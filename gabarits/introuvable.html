<!doctype html>
<html lang="{{lang}}">
<head>
  <!-- FICHIER GÉNÉRÉ par scripts/pages-seo.mjs (gabarits/introuvable.html).
       Cloudflare Pages sert ce fichier, avec le code 404, pour toute adresse
       inconnue : toutes ses adresses partent donc de la racine (/style.css…). -->
  {{{tete}}}
</head>
<body class="page-introuvable">
  {{> entete}}

  <main class="introuvable">
    <h1>{{t:page.introuvableTitre}}</h1>
    <p>{{t:page.introuvableTexte}}</p>
    <p><a class="bouton" href="{{accueil}}">{{t:jeu.voirTous}}</a></p>
    <p class="puces-liens">{{{categories}}}</p>
  </main>

  {{> pied}}
</body>
</html>
