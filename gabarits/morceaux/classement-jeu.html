<!-- Classement des étoiles du jeu (jeux à étoiles seulement : "etoiles" de game.json,
         scripts/pages-seo.mjs). Rempli par /classement-jeu.js (POST /api/classement,
         périmètre « jeu:<id> ») quand le bloc approche de l'écran ; sans réponse
         (hors ligne, serveur indisponible), un message, et le jeu reste jouable.
         Docs : docs/cadrage-fidelisation.md, section 14.10. -->
    <section class="classement-jeu" id="classement-jeu" aria-labelledby="titre-classement-jeu" data-jeu="{{jeu_id}}" data-max="{{etoiles_max}}">
      <h2 id="titre-classement-jeu">{{t:classementJeu.titre}}</h2>
      <p class="profil-aide">{{t:classementJeu.intro}}</p>
      <p class="classement-jeu-etat" id="classement-jeu-etat" role="status" aria-live="polite"></p>
      <button type="button" class="classement-moi" id="classement-jeu-moi" hidden></button>
      <ol class="classement-liste" id="classement-jeu-liste"></ol>
      <nav class="classement-pages" id="classement-jeu-pages" aria-label="{{t:classementJeu.pages}}" hidden>
        <button type="button" class="bouton bouton-secondaire" id="classement-jeu-precedent">{{t:classementJeu.precedent}}</button>
        <span class="classement-page" id="classement-jeu-page" aria-live="polite"></span>
        <button type="button" class="bouton bouton-secondaire" id="classement-jeu-suivant">{{t:classementJeu.suivant}}</button>
      </nav>
      <noscript><p class="profil-aide">{{t:profil.sansJavascript}}</p></noscript>
      <script type="module" src="/classement-jeu.js"></script>
    </section>
