<footer class="pied">
    <p data-i18n="pied.texte">{{t:pied.texte}}</p>
    <p data-i18n="pied.horsLigne">{{t:pied.horsLigne}}</p>
    <!-- Pages légales : adresses en français ou en anglais selon la langue de la
         page (posées par pages-seo.mjs) ; formulaire public de demandes dans la
         langue de la page ; « Réglages des cookies » rouvre le bandeau
         (consentement.js, qui affiche ce bouton). -->
    <nav class="pied-liens" aria-label="{{t:legal.piedAria}}" data-i18n-aria="legal.piedAria">
      <ul>
        <li><a href="{{lien:mentions}}" hreflang="{{langue_legale}}" data-i18n="legal.titre">{{t:legal.titre}}</a></li>
        <li><a href="{{lien:confidentialite}}" hreflang="{{langue_legale}}" data-i18n="legal.confidentialite">{{t:legal.confidentialite}}</a></li>
        <li><a href="{{lien:conditions}}" hreflang="{{langue_legale}}" data-i18n="legal.conditions">{{t:legal.conditions}}</a></li>
        <li><a href="{{lien:cookies}}" hreflang="{{langue_legale}}" data-i18n="legal.cookies">{{t:legal.cookies}}</a></li>
        <li><a href="{{lien_proposer}}" data-i18n="proposer.lien">{{t:proposer.lien}}</a></li>
        <li><a href="mailto:contact@freemicrogames.com">contact@freemicrogames.com</a></li>
        <li class="pied-reglages" hidden><button type="button" data-consentement-ouvrir data-i18n="legal.reglagesCookies">{{t:legal.reglagesCookies}}</button></li>
      </ul>
    </nav>
    {{note_langues_legales}}
  </footer>

  {{> consentement}}
