<!-- Bandeau de consentement aux cookies (consentement.js) : caché tant que le
       visiteur a un choix de moins de 6 mois ; rouvert par « Réglages des cookies ».
       Les deux boutons ont exactement la même taille et le même style. -->
  <div class="consentement" id="consentement" role="region" aria-labelledby="consentement-titre" hidden>
    <div class="consentement-boite">
      <p class="consentement-titre" id="consentement-titre" data-i18n="cookies.titre">{{t:cookies.titre}}</p>
      <p class="consentement-texte" data-i18n="cookies.texte">{{t:cookies.texte}}</p>
      <div class="consentement-boutons">
        <button type="button" class="consentement-bouton" data-consentement="accepte" data-i18n="cookies.accepter">{{t:cookies.accepter}}</button>
        <button type="button" class="consentement-bouton" data-consentement="refuse" data-i18n="cookies.refuser">{{t:cookies.refuser}}</button>
      </div>
      <a class="consentement-lien" href="{{lien:cookies}}" hreflang="{{langue_legale}}" data-i18n="legal.cookies">{{t:legal.cookies}}</a>
    </div>
  </div>
