<!doctype html>
<html lang="{{lang}}">
<head>
  <!-- FICHIER GÉNÉRÉ par scripts/pages-seo.mjs (gabarit du classement des
       joueurs : gabarits/classement.html ; textes : clés « classement.* » de
       public/i18n/site/<langue>.json). Ne pas modifier ici : il est recréé à chaque build. -->
  {{{tete}}}
</head>
<body class="page-classement">
  {{> entete}}

  <main class="legal classement">
    {{{ariane}}}
    <h1>{{t:classement.titre}}</h1>
    <p class="legal-intro">{{t:classement.intro}}</p>

    <!-- Rempli par /classement.js (POST /api/classement). -->
    <form class="classement-choix" id="classement-choix">
      <div class="champ">
        <label for="classement-perimetre">{{t:classement.perimetre}}</label>
        <select id="classement-perimetre">
          <option value="general">{{t:classement.general}}</option>
          <option value="etoiles">{{t:classement.etoiles}}</option>
        </select>
      </div>
      <div class="champ">
        <label for="classement-periode">{{t:classement.periode}}</label>
        <select id="classement-periode">
          <option value="semaine">{{t:classement.semaine}}</option>
          <option value="mois">{{t:classement.mois}}</option>
        </select>
      </div>
      <!-- Classement entre amis (docs/consigne-amis.md, section 4) : moi et mes amis acceptés. -->
      <div class="champ">
        <label for="classement-portee">{{t:classement.portee}}</label>
        <select id="classement-portee">
          <option value="tous">{{t:classement.tous}}</option>
          <option value="amis">{{t:classement.amis}}</option>
        </select>
      </div>
    </form>
    <p class="profil-aide" id="classement-aide"></p>
    <div class="amis-barre" id="classement-amis-barre" hidden>
      <button type="button" class="bouton bouton-secondaire amis-actualiser" id="classement-actualiser">{{t:amis.actualiser}}</button>
      <p class="profil-aide" id="classement-maj"></p>
    </div>
    <p class="message" id="classement-presence" hidden>{{t:amis.presenceIndisponible}}</p>
    <p class="amis-note" id="classement-amis-vide" hidden>{{t:classement.amisVide}} <a href="{{amis}}">{{t:classement.amisLien}}</a></p>

    <p class="message" id="classement-etat" role="status" aria-live="polite"></p>
    <button type="button" class="classement-moi" id="classement-moi" hidden></button>
    <ol class="classement-liste" id="classement-liste"></ol>

    <!-- Historique des podiums (classement général seulement) : 3 premiers de chaque
         semaine ou de chaque mois terminés, selon la période choisie. Rempli par
         /classement.js (POST /api/classement, type « historique »). -->
    <section class="classement-historique" id="classement-historique" aria-labelledby="titre-historique" hidden>
      <h2 id="titre-historique"></h2>
      <p class="profil-aide">{{t:classement.historique.intro}}</p>
      <p class="message" id="historique-etat" role="status" aria-live="polite"></p>
      <ol class="historique-liste" id="historique-liste"></ol>
      <button type="button" class="bouton bouton-secondaire historique-plus" id="historique-plus" hidden>{{t:classement.historique.plus}}</button>
    </section>

    <p class="legal-retour"><a class="bouton" href="{{profil}}">{{t:profil.monProfil}}</a> <a class="bouton bouton-secondaire" href="{{accueil}}">{{t:jeu.voirTous}}</a></p>
    <noscript><p class="message erreur">{{t:profil.sansJavascript}}</p></noscript>
  </main>

  {{> pied}}

  <script type="module" src="/classement.js"></script>
</body>
</html>
