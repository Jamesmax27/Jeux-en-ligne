<!doctype html>
<html lang="{{lang}}">
<head>
  <!-- FICHIER GÉNÉRÉ par scripts/pages-seo.mjs (gabarit des pages légales :
       gabarits/legal.html ; textes : gabarits/legal/<page>.<langue>.html et
       gabarits/textes/legal.json). Ne pas modifier ici : il est recréé à chaque build. -->
  {{{tete}}}
</head>
<body class="page-legale">
  {{> entete}}

  <main class="legal">
    {{{ariane}}}
    <h1>{{h1}}</h1>
    <p class="legal-maj">{{maj}}</p>

    {{{contenu}}}

    <nav class="legal-autres" aria-labelledby="titre-legal-autres">
      <h2 id="titre-legal-autres">{{t:legal.autres}}</h2>
      <ul>{{{autres}}}</ul>
    </nav>

    <p class="legal-retour"><a class="bouton" href="{{accueil}}">{{t:jeu.voirTous}}</a></p>
  </main>

  {{> pied}}
</body>
</html>
