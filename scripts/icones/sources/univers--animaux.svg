<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" data-anim="sautiller">
  <!-- Animaux (ferme, sauvages, compagnie) : empreinte de patte, un coussinet
       en forme de cœur arrondi et quatre doigts ovales bien séparés. -->
  <g id="fond">
    <path d="M12 11.9c2.6 0 5 2.6 5 5.2 0 2-1.4 3.4-3 3.4-.9 0-1.4-.4-2-.4s-1.1.4-2 .4c-1.6 0-3-1.4-3-3.4 0-2.6 2.4-5.2 5-5.2Z"/>
    <ellipse cx="8.6" cy="5.8" rx="1.6" ry="2.2"/>
    <ellipse cx="15.4" cy="5.8" rx="1.6" ry="2.2"/>
    <ellipse cx="4.6" cy="10.8" rx="1.6" ry="2"/>
    <ellipse cx="19.4" cy="10.8" rx="1.6" ry="2"/>
  </g>
  <g id="trait">
    <path d="M12 11.9c2.6 0 5 2.6 5 5.2 0 2-1.4 3.4-3 3.4-.9 0-1.4-.4-2-.4s-1.1.4-2 .4c-1.6 0-3-1.4-3-3.4 0-2.6 2.4-5.2 5-5.2Z"/>
    <ellipse cx="8.6" cy="5.8" rx="1.6" ry="2.2"/>
    <ellipse cx="15.4" cy="5.8" rx="1.6" ry="2.2"/>
    <ellipse cx="4.6" cy="10.8" rx="1.6" ry="2"/>
    <ellipse cx="19.4" cy="10.8" rx="1.6" ry="2"/>
  </g>
  <!-- Un petit cœur et une étincelle quand la patte retombe. -->
  <g id="extra">
    <path d="M20.4 18.2c.5-1 2.2-.8 2.2.5 0 1-1.2 1.8-2.2 2.6-1-.8-2.2-1.6-2.2-2.6 0-1.3 1.7-1.5 2.2-.5Z" fill="#a8b3f0"/>
    <path d="M3 18q0 1.6 1.6 1.6-1.6 0-1.6 1.6 0-1.6-1.6-1.6 1.6 0 1.6-1.6Z" fill="#f2d27a"/>
  </g>
</svg>
