<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" data-anim="emboiter">
  <!-- Simulation et soin : un pansement en diagonale, compresse craie au
       milieu. Dessiné à plat, puis tourné de 45° (transform des groupes). -->
  <g id="fond" transform="rotate(45 12 12)">
    <rect x="2.2" y="7.8" width="19.6" height="8.4" rx="4.2"/>
  </g>
  <g id="trait" transform="rotate(45 12 12)">
    <rect x="2.2" y="7.8" width="19.6" height="8.4" rx="4.2"/>
    <rect x="9" y="10" width="6" height="4" rx=".9" fill="#000" stroke="none"/>
  </g>
  <!-- Il colle : petits traits du « clic » de part et d'autre. -->
  <g id="extra" transform="rotate(45 12 12)" fill="none" stroke-width="1.4" stroke-linecap="round">
    <path d="M10.2 4.8 9.6 3.4M13.8 4.8l.6-1.4" stroke="#f2d27a"/>
    <path d="M10.2 19.2l-.6 1.4M13.8 19.2l.6 1.4" stroke="#a8b3f0"/>
  </g>
</svg>
