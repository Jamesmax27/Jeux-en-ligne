<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" data-anim="nager" data-origine-extra="5 12">
  <!-- Coloriage : un crayon de cire qui laisse une vague de sa couleur
       (la vague est de la masse seule, sans trait craie). Le crayon est
       dessiné debout, puis tourné de 45°. -->
  <g id="fond">
    <path d="M7.6 18c1.4 1.5 2.8 1.5 4.2 0s2.8-1.5 4.2 0 2.8 1.5 4.2 0" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round"/>
    <path transform="rotate(45 12 12)" d="M9.4 3.4h5.2v10.4l-1.6 4.4h-2l-1.6-4.4Z"/>
  </g>
  <g id="trait">
    <path transform="rotate(45 12 12)" d="M9.4 3.4h5.2v10.4l-1.6 4.4h-2l-1.6-4.4ZM9.4 13.8h5.2M9.4 6.6h5.2"/>
  </g>
  <!-- Petites étincelles qui montent près de la pointe. -->
  <g id="extra">
    <path d="M3 9.4q0 1.6 1.6 1.6-1.6 0-1.6 1.6 0-1.6-1.6-1.6 1.6 0 1.6-1.6Z" fill="#f2d27a"/>
    <path d="M7 4.6q0 1.2 1.2 1.2-1.2 0-1.2 1.2 0-1.2-1.2-1.2 1.2 0 1.2-1.2Z" fill="#a8b3f0"/>
  </g>
</svg>
