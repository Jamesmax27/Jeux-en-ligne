<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" data-anim="emboiter">
  <!-- Construction : trois blocs de bois empilés ; celui du haut, penché,
       est en train d'être posé (pas de tenons, pas de toit : ce n'est pas
       une maison). -->
  <g id="fond">
    <path d="M3.8 13H20.2V20.8H3.8Z"/>
    <rect x="8.7" y="4.9" width="7.4" height="7.4" rx=".6" transform="rotate(-10 12.4 8.6)"/>
  </g>
  <g id="trait">
    <path d="M3.8 13H20.2V20.8H3.8ZM12 13v7.8"/>
    <rect x="8.7" y="4.9" width="7.4" height="7.4" rx=".6" transform="rotate(-10 12.4 8.6)"/>
  </g>
  <!-- « Clic » : petits traits aux coins quand le bloc se pose. -->
  <g id="extra" fill="none" stroke-width="1.4" stroke-linecap="round">
    <path d="M3.4 8.6 2.2 7.8M5 6.6l-.4-1.3" stroke="#f2d27a"/>
    <path d="M20.6 8.6l1.2-.8M19 6.6l.4-1.3" stroke="#f2d27a"/>
  </g>
</svg>
