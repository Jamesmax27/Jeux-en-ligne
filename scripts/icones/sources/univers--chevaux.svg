    <path d="M9.6 5C7.2 5.8 5.4 7.6 4.4 9.6c1 0 1.8.4 2.2 1-1.6 1.6-2.6 3.4-2.8 5 1-.2 1.8.2 2.4.8-1 1.6-1.4 3.2-1.2 4.8.6-.2 1.2 0 1.6.4C6 16.6 6.6 10.6 8.8 6.2Z"/>
