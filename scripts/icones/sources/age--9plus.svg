<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" data-anim="decoller" data-origine-extra="3.4 13">
  <!-- 9 ans et + : une planche à roulettes de profil, nez relevé vers le
       libellé (dessinée à plat, puis penchée : transform des trois groupes). -->
  <g id="fond" transform="rotate(-16 12 12) translate(1.2 .1) scale(.9)">
    <path d="M2.4 9.4a1.2 1.2 0 0 1 2.2-.6q.8 1.8 2.4 1.8h10q1.6 0 2.4-1.8a1.2 1.2 0 0 1 2.2.6q-.8 4.6-4.6 4.6H7Q3.2 14 2.4 9.4Z"/>
    <circle cx="7.6" cy="16.2" r="2.3"/>
    <circle cx="16.4" cy="16.2" r="2.3"/>
  </g>
  <g id="trait" transform="rotate(-16 12 12) translate(1.2 .1) scale(.9)">
    <path d="M2.4 9.4a1.2 1.2 0 0 1 2.2-.6q.8 1.8 2.4 1.8h10q1.6 0 2.4-1.8a1.2 1.2 0 0 1 2.2.6q-.8 4.6-4.6 4.6H7Q3.2 14 2.4 9.4Z"/>
    <circle cx="7.6" cy="16.2" r="2.3"/>
    <circle cx="16.4" cy="16.2" r="2.3"/>
  </g>
  <!-- Traits de vitesse, collés derrière la planche. -->
  <g id="extra" transform="rotate(-16 12 12) translate(1.2 .1) scale(.9)" fill="none" stroke="#eceae4" stroke-width="1.3" stroke-linecap="round">
    <path d="M-1.6 11h2.4M-.8 14.6h2"/>
  </g>
</svg>
