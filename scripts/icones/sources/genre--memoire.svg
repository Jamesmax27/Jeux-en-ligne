    <rect x="13.8" y="3.2" width="7" height="7" rx="1.4"/>
    <rect x="3.2" y="13.8" width="7" height="7" rx="1.4"/>
    <rect x="13.8" y="13.8" width="7" height="7" rx="1.4"/>
  </g>
  <!-- Bravo, une paire : étincelles dans les allées entre les tuiles. -->
