       retournées montrent la même étoile (percée dans la masse : une paire
       trouvée), les deux autres sont de dos. -->
  <g id="fond">
    <path fill-rule="evenodd" d="M4.6 3.2h4.2a1.4 1.4 0 0 1 1.4 1.4v4.2a1.4 1.4 0 0 1-1.4 1.4H4.6a1.4 1.4 0 0 1-1.4-1.4V4.6a1.4 1.4 0 0 1 1.4-1.4ZM6.7 4.7l.6 1.4 1.5.1-1.1 1 .3 1.5-1.3-.7-1.3.7.3-1.5-1.1-1 1.5-.1Z"/>
    <path fill-rule="evenodd" d="M15.2 13.8h4.2a1.4 1.4 0 0 1 1.4 1.4v4.2a1.4 1.4 0 0 1-1.4 1.4h-4.2a1.4 1.4 0 0 1-1.4-1.4v-4.2a1.4 1.4 0 0 1 1.4-1.4ZM17.3 15.3l.6 1.4 1.5.1-1.1 1 .3 1.5-1.3-.7-1.3.7.3-1.5-1.1-1 1.5-.1Z"/>
    <rect x="13.8" y="3.2" width="7" height="7" rx="1.4"/>
    <rect x="3.2" y="13.8" width="7" height="7" rx="1.4"/>
  </g>
  <g id="trait">
