<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" data-anim="sautiller">
  <!-- Plateforme : deux plateformes en escalier et une bille qui saute de
       l'une à l'autre (sa trajectoire en pointillé). -->
  <g id="fond">
    <rect x="3.2" y="17" width="7.6" height="3.8" rx="1.4"/>
    <rect x="13.2" y="11.4" width="7.6" height="3.8" rx="1.4"/>
    <circle cx="15.6" cy="5.8" r="2.6"/>
  </g>
  <g id="trait">
    <rect x="3.2" y="17" width="7.6" height="3.8" rx="1.4"/>
    <rect x="13.2" y="11.4" width="7.6" height="3.8" rx="1.4"/>
    <circle cx="15.6" cy="5.8" r="2.6"/>
    <circle cx="5.8" cy="13.4" r="1" fill="#000" stroke="none"/>
    <circle cx="7.2" cy="9.2" r="1" fill="#000" stroke="none"/>
    <circle cx="9.9" cy="6.3" r="1" fill="#000" stroke="none"/>
  </g>
  <!-- Des pièces d'or au sommet du saut. -->
  <g id="extra">
    <ellipse cx="21.6" cy="3.4" rx="1.1" ry="1.5" fill="#f2d27a"/>
    <ellipse cx="9.4" cy="1.6" rx=".9" ry="1.2" fill="#f2d27a"/>
    <path d="M2.6 4.4q0 1.2 1.2 1.2-1.2 0-1.2 1.2 0-1.2-1.2-1.2 1.2 0 1.2-1.2Z" fill="#eceae4"/>
  </g>
</svg>
