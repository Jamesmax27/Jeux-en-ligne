      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('noyee', noyee);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      const cle = (noyee ? 'n' : 'v') + (info.moi ? 'm' + prog.combi : '');
      const cv = d.querySelector('canvas.hublot');
      if (cv.dataset.cle !== cle) {
        cv.dataset.cle = cle;
        const c = cv.getContext('2d'); c.clearRect(0, 0, 84, 84);
        hublot(c, s, 42, 42, 40, { noyee: noyee, combi: info.moi ? prog.combi : undefined });
      }
      d.setAttribute('aria-label', tr('place.aria', { cabine: tr('cabine.' + s), qui: nomPlace(info, role), air: o2, bruit: br }) + (noyee ? ' · ' + tr('place.noyee') : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || e.fini) return '';
    if (partie.siege < 0) return tr('multi.attente');
    const s = e.tour;
    if (s === partie.siege) return tr('tour.toi');
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.' + s);
  }

  function majInfos() {
    let info = '';
    const e = vue;
    const ronde = e ? tr('jeu.ronde', { n: Math.min(e.ronde, e.cfg.t), total: e.cfg.t }) : '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length }) + (ronde ? ' · ' + ronde : '');
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche }) + (ronde ? ' · ' + ronde : '');
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  function majInterface() { majPlaces(); majInfos(); }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fini && !file.length && !occupe) {
      const s = e.tour, sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0, horloge = 0;
  function relancerBoucle() { if (!rafId) { tPrec = 0; rafId = requestAnimationFrame(boucle); } }
  function boucle(t) {
    rafId = 0;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    if (ecran !== 'jeu') {
      tempsTitre += dt;
      dessinerTitre(tempsTitre);
      rafId = requestAnimationFrame(boucle);
      return;
    }
    if (enPause) return;
    horloge += dt;
    avancerObs(dt);
    dessinerJeu(dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function geometrie() {
    const zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight;
    const Rr = Math.max(40, Math.min(w, h) / 2 - Math.max(20, Math.min(w, h) * 0.08));
    return { w: w, h: h, cx: w / 2, cy: h / 2, R: Rr };
  }

  function dessinerJeu(dt) {
    const cv = $('sonar');
    const g = geometrie(), dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!g.w || !g.h) return;
    if (cv.width !== Math.round(g.w * dpr) || cv.height !== Math.round(g.h * dpr)) { cv.width = Math.round(g.w * dpr); cv.height = Math.round(g.h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, g.w, g.h);
    const o = { t: horloge };
    if (obs) {
      dessinerSonar(c, g.cx, g.cy, g.R, obs.sc, Math.min(1, obs.ecoule / obs.d), o);
    } else if (affichage.mode === 'revele' && affichage.sc) {
      Object.assign(o, affichage.o || {}, { revele: true });
      dessinerSonar(c, g.cx, g.cy, g.R, affichage.sc, 1, o);
    } else {
      o.eteint = true;
      if (affichage.mode === 'attaque') { o.attaque = (horloge - affichage.t0) / 1.2; o.danger = true; if (o.attaque > 1.3) affichage = { mode: 'eteint' }; }
      dessinerSonar(c, g.cx, g.cy, g.R, null, 1, o);
    }
    // bulles d'oxygène
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt + Math.sin(horloge * 6 + i) * 0.4; p.y += p.vy * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 1.5);
      c.strokeStyle = p.coul; c.lineWidth = 2; rond(c, p.x, p.y, p.k); c.stroke();
      c.fillStyle = '#ffffff88'; rond(c, p.x - p.k * 0.35, p.y - p.k * 0.35, p.k * 0.25); c.fill();
      c.globalAlpha = 1;
    }
  }

  function bulles(n, coul) {
    const g = geometrie();
    for (let k = 0; k < n; k++) {
      particules.push({ x: g.cx + (Math.random() - 0.5) * g.R, y: g.cy + g.R * 0.4 + Math.random() * g.R * 0.4, vx: (Math.random() - 0.5) * 30, vy: -80 - Math.random() * 110, vie: 1 + Math.random() * 0.7, k: 4 + Math.random() * 9, coul: coul || '#9fe6ff' });
    }
  }

  // ---------------------------------------------------------------------
  //  Observation du sonar
  // ---------------------------------------------------------------------

  // mode : 'moi' (mon tour), 'spect' (un autre vrai joueur observe), 'flash'
  // (écran d'un robot, montré en accéléré).
  function lancerObs(sc, mode, apres) {
    if (!sc) { if (apres) apres(); return; }
    obs = { sc: sc, d: mode === 'flash' ? 900 : sc.d, ecoule: 0, mode: mode, apres: apres, joues: {} };
    affichage = { mode: 'eteint' };
    if (mode === 'moi') {
      etatPanneau = 'obs';
      remplirPanneau(tr('obs.toi'), sc.m === 's' ? tr('obs.panne') : tr('obs.aide'), [], [], 'obs');
    }
    relancerBoucle();
  }

  function avancerObs(dt) {
    if (!obs) return;
    obs.ecoule += dt * 1000;
    const p = Math.min(1, obs.ecoule / obs.d);
    if (obs.mode !== 'flash') {
      const sc = obs.sc;
      if (sc.m === 's') sc.e.forEach((pg, i) => { if (!obs.joues['s' + i] && p >= pg.t / 1000 * 0.8) { obs.joues['s' + i] = 1; sons.pingSon(pg.h); } });
      else {
        sc.e.forEach((x, i) => { if (!obs.joues['e' + i] && p >= x.t / 1000 * 0.8) { obs.joues['e' + i] = 1; sons.ping(x.p === 1); } });
        sc.x.forEach((x, i) => { if (!obs.joues['x' + i] && p >= x.t / 1000 * 0.8) { obs.joues['x' + i] = 1; sons.pingFaux(); } });
      }
    }
    if (obs.mode === 'moi') $('obs-barre').firstElementChild.style.transform = 'scaleX(' + (1 - p).toFixed(3) + ')';
    if (obs.ecoule >= obs.d) {
      const f = obs.apres;
      obs = null;
      if (f) f();
    }
  }

  // ---------------------------------------------------------------------
  //  Panneau du bas : question, réponses, choix
  // ---------------------------------------------------------------------

  function remplirPanneau(texte, sous, options, actions, classe) {
    const p = $('panneau');
    p.className = classe || '';
    // « la cabine orange garde… » en début de phrase : majuscule
    $('pan-texte').textContent = texte ? texte.charAt(0).toUpperCase() + texte.slice(1) : '';
    $('pan-sous').textContent = sous || '';
    const bo = $('pan-options'); bo.textContent = '';
    (options || []).forEach((b) => bo.appendChild(b));
    const ba = $('pan-actions'); ba.textContent = '';
    (actions || []).forEach((b) => ba.appendChild(b));
  }

  function texteQuestion(q) {
    if (q.k === 'dir') return tr('q.dir', { dir: tr('dir.dans.' + q.z) });
    if (q.k === 'nbf') return tr('q.nbf', { forme: tr('forme.pl.' + q.z) });
    return tr('q.' + q.k);
  }

  // Contenu d'un bouton de réponse.
  function contenuOption(b, q, v) {
    if (q.k === 'der' || q.k === 'pre') { b.innerHTML = svgForme(v); b.setAttribute('aria-label', tr('forme.' + v)); return; }
    if (q.k === 'cr') { b.innerHTML = svgFleche(v); const s = document.createElement('span'); s.textContent = tr('dir.' + v); b.appendChild(s); b.classList.add('petit-texte'); return; }
    if (q.k === 'sder') { b.innerHTML = svgSon(v); const s = document.createElement('span'); s.textContent = tr(v === 0 ? 'son.aigu' : 'son.grave'); b.appendChild(s); b.classList.add('petit-texte'); return; }
    b.textContent = nb(v);
  }

  function boutonsOptions(q, surChoix) {
    return q.o.map((v, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'opt';
      contenuOption(b, q, v);
      const k = document.createElement('span'); k.className = 'touche'; k.textContent = nb(i + 1);
      b.appendChild(k);
      if (surChoix) b.addEventListener('click', () => { audio(); surChoix(i); });
      else b.disabled = true;
      return b;
    });
  }

  function bouton(texte, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = texte;
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function sousQuestion(e) {
    const gain = e.nq + 1;
    return e.pot > 0 ? tr('q.enJeu', { pot: e.pot, n: gain }) : tr('q.gain', { n: gain });
  }

  function montrerQuestion() {
    const e = vue;
    if (!e || !e.sc) return;
    etatPanneau = 'question';
    affichage = { mode: 'eteint' };
    const actions = [];
    if (e.fu[moi()] > 0 && !e.rv) actions.push(bouton(tr('bouton.fusee', { n: e.fu[moi()] }), '', tirerFusee));
    remplirPanneau(texteQuestion(e.sc.q), sousQuestion(e), boutonsOptions(e.sc.q, repondre), actions, '');
    focusPremier('#pan-options button');
  }

  function montrerChoix() {
    const e = vue;
    etatPanneau = 'choix';
    const actions = [
      bouton(tr('choix.garder', { n: e.pot }), 'vert', () => agir({ p: 1 })),
      bouton(tr('choix.encore', { n: e.nq + 1 }), 'rouge', () => agir({ c: 1 }))
    ];
    remplirPanneau(tr('choix.titre', { n: e.pot }), tr('choix.aide'), [], actions, 'bon');
    focusPremier('#pan-actions button');
  }

  function montrerAttente() {
    const e = vue;
    if (!e || !partie) return;
    etatPanneau = 'attente';
    let texte = '';
    if (e.fini) texte = '';
    else if (partie.siege >= 0 && e.mort[partie.siege] > 0) texte = tr('attente.noyee');
    else if (e.ph === 'c') texte = tr('attente.choix', { cabine: nomCabine(e.tour) });
    else texte = tr('attente.obs', { cabine: nomCabine(e.tour) });
    remplirPanneau(texte, '', [], [], '');
  }

  function focusPremier(sel) {
    if (!clavierUtilise) return;
    const b = document.querySelector(sel);
    if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }

  function agir(action) {
    if (!partie || enPause || attenteTuto) return false;
    if (!partie.monTour() || file.length || occupe || obs) {
      if (Date.now() - dernierAttends > 1500) { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return false;
    }
    $('pan-options').querySelectorAll('button').forEach((b) => { b.disabled = true; });
    $('pan-actions').querySelectorAll('button').forEach((b) => { b.disabled = true; });
    if (!partie.jouer(action)) { majTour(); return false; }
    return true;
  }
  function repondre(i) { if (etatPanneau === 'question') agir({ r: i }); }
  function tirerFusee() { if (etatPanneau === 'question') agir({ f: 1 }); }

  // Résultat d'une réponse : l'écran se rallume, les échos comptés sont entourés.
  function montrerResultat(sc, der, monCoup, s) {
    if (!sc) return;
    const q = sc.q, o = {};
    if (q.k === 'dir') { o.zone = q.z; o.marque = (x) => x.q === q.z; }
    else if (q.k === 'nbf') o.marque = (x) => x.f === q.z;
    else if (q.k === 'pro') { o.cercle = true; o.marque = (x) => x.p === 1; }
    else if (q.k === 'tot') o.marque = () => true;
    else if (q.k === 'cr') o.zoneCreature = true;
    else if (q.k === 'der' || q.k === 'pre') {
      let ch = sc.e[0];
      sc.e.forEach((x) => { if (q.k === 'der' ? x.t > ch.t : x.t < ch.t) ch = x; });
      o.marque = (x) => x === ch;
    }
    affichage = { mode: 'revele', sc: sc, o: o };
    const opts = boutonsOptions(q, null);
    opts[der.b].classList.add('bonne');
    if (!der.ok && opts[der.r]) opts[der.r].classList.add('fausse');
    let texte, sous = '';
    if (monCoup) texte = der.ok ? tr('res.bon', { n: der.g }) : tr('res.faux');
    else texte = der.ok ? tr('res.bonAutre', { cabine: nomCabine(s), n: der.g }) : tr('res.fauxAutre', { cabine: nomCabine(s) });
    if (!der.ok && der.perdu) sous = tr('res.perdu', { n: der.perdu });
    else if (der.auto) sous = tr('res.auto', { n: der.auto });
    else if (!monCoup) sous = texteQuestion(q);
    remplirPanneau(texte, sous, opts, [], der.ok ? 'bon' : 'erreur');
    etatPanneau = 'resultat';
    const carte = $('place-' + (s === undefined ? moi() : s));
    if (der.ok) {
      sons.bon();
      bulles(6 + der.g * 3);
      if (carte) { carte.classList.remove('gagne'); void carte.offsetWidth; carte.classList.add('gagne'); }
    } else {
      sons.faux();
      setTimeout(() => sons.grogne(), 250);
      if (monCoup) flash('#ff2a1a');
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI) et file d'affichage
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': pousser({ type: 'manche', etat: copie(partie.etat), manche: partie.manche }); break;
      case 'action': pousser({ type: 'action', ev: ev }); break;
      case 'fin': pousser({ type: 'fin', etat: copie(partie.etat), resultat: ev.resultat, enLigne: partie.mode === 'en-ligne' }); break;
      case 'sieges': surSieges(); break;
      case 'salon': pousser({ type: 'salon', fin: Date.now() + (ev.reste || 0) }); break;
      default: break;
    }
    majInterface();
  }

  function pousser(it) { file.push(it); pomperFile(); }

  function pomperFile() {
    if (enPause) return;
    while (file.length && !occupe) {
      const it = file.shift();
      const d = traiterItem(it);
      if (d > 0) {
        occupe = true;
        const j = jeton;
        setTimeout(() => { if (j !== jeton) return; occupe = false; pomperFile(); }, file.length > 2 ? d * 0.5 : d);
      }
    }
    if (!occupe) { majInterface(); majTour(); }
  }

  function traiterItem(it) {
    if (it.type === 'manche') { debutManche(it); return 500; }
    if (it.type === 'salon') { finSalon = it.fin; lancement = false; ouvrirSalon(); return 0; }
    if (mancheFinie) return 0;
    if (it.type === 'action') return animerAction(it.ev);
    if (it.type === 'fin') {
      mancheFinie = true;
      vue = it.etat;
      surPlaces = null;
      if (session === 'solo') enPartie = false;
      finManche = Date.now() + R.pauseManche;
      if (it.enLigne) afficherFinEnLigne(it); else afficherFin(it);
      return 0;
    }
    return 0;
  }

  function debutManche(it) {
    vue = it.etat;
    surPlaces = null;
    mancheFinie = false;
    obs = null;
    affichage = { mode: 'eteint' };
    cleObs = '';
    particules.length = 0;
    debutTour = Date.now();
    dernierTic = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    lancement = false;
    if (partie && partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: it.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    remplirPanneau('', '', [], [], '');
    etatPanneau = '';
  }

  // Ce qu'on montre quand la file est vide : mon observation, ma question, mon
  // choix, ou l'attente (un autre vrai joueur observe : on regarde aussi).
  function majTour() {
    if (!partie || !vue || occupe || file.length || mancheFinie || attenteTuto) return;
    if (partie.phase !== 'jeu' || vue.fini) return;
    const m = partie.siege, s = vue.tour, info = siegesActuels()[s] || {};
    const cle = partie.manche + ':' + partie.n + ':' + vue.rv + ':' + s;
    if (s === m && m >= 0) {
      if (vue.ph === 'q') {
        if (cleObs !== cle) { cleObs = cle; sons.tour(); lancerObs(vue.sc, 'moi', montrerQuestion); }
        else if (!obs && etatPanneau !== 'question') montrerQuestion();
      } else if (vue.ph === 'c' && etatPanneau !== 'choix') montrerChoix();
    } else if (vue.ph === 'q' && info.humain && cleObs !== cle) {
      cleObs = cle;
      lancerObs(vue.sc, 'spect', () => { affichage = { mode: 'eteint' }; });
      montrerAttente();
    } else if (etatPanneau !== 'attente') montrerAttente();
  }

  // Une action arrive : on l'anime ; renvoie le temps à laisser avant la suivante.
  function animerAction(ev) {
    const a = ev.apres, av = ev.avant, d = a.der || {}, s = ev.siege;
    vue = copie(a);
    debutTour = Date.now();
    dernierTic = -1;
    obs = null;
    let duree = 600;
    const autreHumain = !ev.moi && (siegesActuels()[s] || {}).humain;
    if (a.ev) {
      // jusqu'à l'animation de fin de ronde, les cabines montrent l'air d'avant
      surPlaces = { o2: av.o2.slice(), br: av.br.slice(), mort: av.mort.slice() };
      const gain = d.k === 'p' ? d.g : (d.auto || 0);
      surPlaces.o2[s] += gain;
      if (d.k === 'r' && !d.ok) surPlaces.br[s] = Math.min(9, surPlaces.br[s] + 2);
      else if (gain || d.k === 'p') surPlaces.br[s] = Math.max(0, surPlaces.br[s] - 1);
    } else surPlaces = null;
    if (d.k === 'r') {
      if (ev.moi) { montrerResultat(av.sc, d, true, s); duree = 1500; }
      else if (!autreHumain && av.sc) {
        etatPanneau = 'attente';
        remplirPanneau(tr('attente.obs', { cabine: nomCabine(s) }), '', [], [], '');
        lancerObs(av.sc, 'flash', () => montrerResultat(av.sc, d, false, s));
        duree = 900 + 1200;
      } else { montrerResultat(av.sc, d, false, s); duree = 1500; }
      if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    } else if (d.k === 'f') {
      sons.fusee();
      flash('#fff3c8');
      if (!ev.moi) { etatPanneau = 'attente'; remplirPanneau(tr('fusee.autre', { cabine: nomCabine(s) }), '', [], [], ''); }
      duree = 700;
    } else if (d.k === 'c') {
      sons.encore();
      if (!ev.moi) { etatPanneau = 'attente'; remplirPanneau(tr('encore.autre', { cabine: nomCabine(s), n: d.pot }), '', [], [], ''); }
      duree = ev.moi ? 200 : 700;
    } else if (d.k === 'p') {
      sons.bulles();
      bulles(10);
      const carte = $('place-' + s);
      if (carte) { carte.classList.remove('gagne'); void carte.offsetWidth; carte.classList.add('gagne'); }
      etatPanneau = 'attente';
      remplirPanneau(ev.moi ? tr('garde.toi', { n: d.g }) : tr('garde.autre', { cabine: nomCabine(s), n: d.g }), '', [], [], 'bon');
      duree = 800;
    }
    if (a.ev) {
      const j = jeton, r = a.ev;
      setTimeout(() => { if (j === jeton) montrerFinRonde(r); }, duree);
      duree += 2100;
    }
    // Solo : ma cabine est noyée, la plongée est perdue (les robots n'ont pas besoin de finir).
    if (session === 'solo' && moi() >= 0 && a.mort[moi()] > 0 && !a.fini) {
      const j = jeton, etat = copie(a);
      mancheFinie = true;
      enPartie = false;
      setTimeout(() => { if (j === jeton) afficherFin({ etat: etat, noyee: true }); }, duree);
    }
    majInterface();
    return duree;
  }

  function montrerFinRonde(r) {
    surPlaces = null;
    sons.ronde();
    let texte = tr('ronde.fin', { n: r.r, c: r.c });
    if (r.f.length) {
      texte += ' ' + tr('ronde.frappe', { cabine: r.f.map(nomCabine).join(', '), n: r.d });
      setTimeout(() => {
        sons.grogne(); sons.choc();

        affichage = { mode: 'attaque', t0: horloge };

      }, 450);
    } else texte += ' ' + tr('ronde.calme');
    if (r.m.length) texte += ' ' + tr('ronde.noyee', { cabine: r.m.map(nomCabine).join(', ') });

    const j = jeton;

    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche'), { roue: true }); return; }

    const raison = ev.raison;

  function surDebut(ev) {
    file.length = 0;

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    obs = null;
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + prog.combi;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 104, 104);
        hublot(c, s, 52, 58, 42, { combi: info.moi ? prog.combi : undefined });
        if (info.chef) couronne(c, 52, 22, 20);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place', { cabine: tr('cabine.' + s), qui: nom }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }

    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { cabine: nomChef ? nomChef + ' · ' + tr('cabine.' + partie.chef) : tr('cabine.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const b = $('btn-lancer');
    b.hidden = !(enSalon && partie.estChef());
    b.disabled = lancement;
    const tb = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (b.textContent !== tb) b.textContent = tb;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';

  // ---------------------------------------------------------------------

  // Classement d'un état (même ordre que fin() des règles, même avant la fin).
  function ordre(e) {
    const f = copie(e); f.fini = 1;
    return R.fin(f).classement;
  }

  function remplirClassement(e, m, sieges, boite) {
    boite.textContent = '';
    ordre(e).forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === m ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60;
      const info = sieges[s] || {};
      hublot(cv.getContext('2d'), s, 30, 30, 28, { noyee: e.mort[s] > 0, combi: s === m ? prog.combi : undefined });
      const qui = document.createElement('span'); qui.className = 'qui';
      const role = s === m ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = e.mort[s] > 0 ? tr('fin.noyee') : tr('fin.air', { n: Math.max(0, e.o2[s]) });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function etoilesPour(o2, depart, gagne) {
    if (!gagne) return 0;
    return o2 >= depart ? 3 : o2 >= Math.ceil(depart / 2) ? 2 : 1;
  }

  function afficherFinEnLigne(it) {
    const e = it.etat;
    if (!e) return;
    const m = partie.siege;
    const gagne = m >= 0 && it.resultat && it.resultat.classement[0] === m;
    if (m >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, m, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); bullesVictoire(); } else sons.defaite();
    remplirPanneau(tr(gagne ? 'manche.gagnee' : 'manche.finie'), '', [], [], gagne ? 'bon' : 'erreur');
    if (salonOuvert()) ouvrirSalon();
  }

  function afficherFin(it) {
    const e = it.etat;
    if (!e || !partie) return;
    const m = partie.siege, sieges = siegesActuels();
    const ord = ordre(e);
    const gagne = m >= 0 && !it.noyee && e.mort[m] === 0 && ord[0] === m;
    const o2 = m >= 0 ? Math.max(0, e.o2[m]) : 0;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, m, sieges, $('fin-classement'));
    $('fin-points').textContent = m >= 0 ? (e.mort[m] > 0 ? tr('fin.pointsNoyee') : tr('fin.points', { n: o2 })) : '';
    $('fin-journal').textContent = '';
    $('fin-combi').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(o2, e.cfg.o2, gagne);
      const ancienRecord = prog.records[i];
      const record = gagne && o2 > ancienRecord;
      if (record) prog.records[i] = o2;
      if (gagne) {
        const avant = COMBIS.filter((_, k) => combiOuverte(k)).length;
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (!prog.journaux[i]) { prog.journaux[i] = 1; $('fin-journal').textContent = tr('fin.journal', { n: niveau }); }
        const apres = COMBIS.filter((_, k) => combiOuverte(k));
        if (apres.length > avant) $('fin-combi').textContent = tr('fin.combi', { nom: tr('combi.' + (apres.length - 1)) });
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) prog.debloque = niveau + 1;
        sauver(Math.min(niveau + 1, NIVEAUX.length), o2);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      }
      $('fin-titre').textContent = gagne ? tr(niveau === NIVEAUX.length ? 'fin.dernier' : 'fin.gagne') : tr(e.mort[m] > 0 ? 'fin.noyeeTitre' : 'fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = gagne ? (record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, o2) })) : tr('fin.conseil');
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton(tr('bouton.suivant'), 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(tr(gagne ? 'bouton.rejouer' : 'bouton.reessayer'), gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton(tr('bouton.niveaux'), '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (m >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      majCompte();
      boutons.appendChild(bouton(tr('bouton.quitter'), '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); bullesVictoire(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (partie en ligne repassée sur l'appareil).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
  }

  // Bulles de victoire sur tout l'écran.
  function bullesVictoire() {
    const cv = $('effets'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bs = [];
    for (let i = 0; i < 70; i++) bs.push({ x: Math.random() * w, y: h + Math.random() * h * 0.5, v: 120 + Math.random() * 200, r: 3 + Math.random() * 12, coul: i % 3 ? '#9fe6ff' : COUL[i % 4] });
    let debut = 0, prec = 0;
    const j = ++bullesVictoire.n;
    function pas(t) {
      if (j !== bullesVictoire.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bs.forEach((b, i) => {
        b.y -= b.v * dt; b.x += Math.sin(t / 300 + i) * 0.6;
        c.strokeStyle = b.coul; c.lineWidth = 2; rond(c, b.x, b.y, b.r); c.stroke();
        c.fillStyle = '#ffffff99'; rond(c, b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.25); c.fill();
      });
      if (t - debut < 3000) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  bullesVictoire.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // État de départ d'une plongée, montré pendant le tutoriel.
  function apercu(n) { return R.depart(window.JEL_MULTI.hasard(n * 7 + 1), PLACES, { niveau: n }); }

  // Parcours solo : plongée n contre 3 robots.
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    file.length = 0;
    occupe = false;
    obs = null;
    enPartie = true;
    enPause = false;
    mancheFinie = false;
    ['voile-fin', 'voile-pause'].forEach(fermerVoile);
    vue = apercu(niveau);
    surPlaces = null;
    particules.length = 0;
    affichage = { mode: 'eteint' };
    remplirPanneau('', '', [], [], '');
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    cleObs = '';

    if (partie) partie.quitter();

      regles: R, enLigne: false, force: NIVEAUX[niveau - 1].fr, options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Dessin d'une case de réponse dans la démonstration (sans texte ni chiffre).
  function caseDemo(c, q, v, x, y, w, h, etat) {
    rr(c, x, y, w, h, 12);
    c.fillStyle = etat === 'bonne' ? '#0f5a3c' : '#0b2730'; c.fill();
    c.lineWidth = 3; c.strokeStyle = etat === 'bonne' ? VERT : '#3fbfa4'; c.stroke();
    const cx = x + w / 2, cy = y + h / 2;
    c.fillStyle = '#c8fff0'; c.strokeStyle = '#c8fff0';
    if (q.k === 'der' || q.k === 'pre') { formeChemin(c, v, cx, cy, h * 0.24); c.fill(); }
    else if (q.k === 'cr') {
      c.save(); c.translate(cx, cy); c.rotate(v * Math.PI / 2);
      c.beginPath(); c.moveTo(0, -h * 0.3); c.lineTo(h * 0.22, 0); c.lineTo(h * 0.08, 0); c.lineTo(h * 0.08, h * 0.3); c.lineTo(-h * 0.08, h * 0.3); c.lineTo(-h * 0.08, 0); c.lineTo(-h * 0.22, 0); c.closePath(); c.fill();
      c.restore();
    } else if (q.k === 'sder') {
      const H = v === 0 ? h * 0.32 : h * 0.14;
      c.lineWidth = 3; c.beginPath(); c.moveTo(x + 10, cy); c.lineTo(cx - 8, cy); c.lineTo(cx, cy - H); c.lineTo(cx + 8, cy + H * 0.6); c.lineTo(cx + 12, cy); c.lineTo(x + w - 10, cy); c.stroke();
    } else {
      // un point par unité (aucun chiffre dessiné)
      const n = v, col = Math.min(4, Math.max(1, n));
      for (let k = 0; k < n; k++) {
        const ix = k % 4, iy = Math.floor(k / 4);
        rond(c, cx + (ix - (col - 1) / 2) * 11, cy + (iy - (n > 4 ? 0.5 : 0)) * 12, 4); c.fill();
      }
    }
  }

  function marqueDemo(q) {
    if (q.k === 'tot') return () => true;
    if (q.k === 'dir') return (x) => x.q === q.z;
    if (q.k === 'nbf') return (x) => x.f === q.z;
    if (q.k === 'pro') return (x) => x.p === 1;
    return null;
  }

  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const sc = sceneDemo(cle);
    const q = sc.q;
    // étapes : 1 observer, 2 répondre (ou tirer une fusée), 3 garder / attaque / répondre
    const etapes = d.choix || d.attaque || d.fusee ? 3 : 2;
    const DUREES = [3000, 2400, 2600];
    const total = DUREES.slice(0, etapes).reduce((a, b) => a + b, 0);
    let debut = 0, derniere = -1, joues = {};
    const j = ++tutoAnim;
    function nomEtape(k) {
      if (k === 0) return 'obs';
      if (k === 1) return d.fusee ? 'fusee' : 'repondre';
      return d.attaque ? 'attaque' : d.fusee ? 'repondre' : 'garder';
    }
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      let ec = t - debut, k = 0;
      if (ec > total + 600) { debut = t; ec = 0; joues = {}; }
      while (k < etapes - 1 && ec > DUREES[k]) { ec -= DUREES[k]; k++; }
      if (k !== derniere) { derniere = k; $('tuto-etape').textContent = tr('tuto.etape', { n: k + 1, total: etapes }) + ' · ' + tr('tuto.etape.' + nomEtape(k)); }
      const T = t / 1000;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 480, 480);
      const cx = 240, cy = 190, Rr = 140;
      const etape = nomEtape(k);
      if (etape === 'obs' || (etape === 'fusee' && ec > 1100)) {
        const p = etape === 'obs' ? Math.min(1, ec / 2600) : Math.min(1, (ec - 1100) / 1200);
        dessinerSonar(c, cx, cy, Rr, sc, p, { t: T });
        if (etape === 'obs' && sc.m === 's') sc.e.forEach((pg, i) => { if (!joues['s' + i] && p >= pg.t / 1000 * 0.8) { joues['s' + i] = 1; sons.pingSon(pg.h); } });
      } else if (etape === 'attaque') {
        dessinerSonar(c, cx, cy, Rr, null, 1, { t: T, eteint: true, attaque: ec > 900 ? (ec - 900) / 1200 : 0, danger: ec > 900 });
      } else {
        dessinerSonar(c, cx, cy, Rr, null, 1, { t: T, eteint: true });
      }
      const y = 380, h = 62;
      if (etape === 'garder') {
        // deux boutons : garder (bulle) et encore (flèche)
        rr(c, 60, y, 170, h, 14); c.fillStyle = '#17b38a'; c.fill();
        c.strokeStyle = '#022218'; c.lineWidth = 3; rond(c, 145, y + h / 2, 16); c.stroke(); rond(c, 139, y + h / 2 - 6, 4); c.fillStyle = '#022218'; c.fill();
        rr(c, 250, y, 170, h, 14); c.fillStyle = '#d0402a'; c.fill();
        c.fillStyle = '#2a0600'; c.beginPath(); c.moveTo(335, y + 12); c.lineTo(355, y + 34); c.lineTo(343, y + 34); c.lineTo(343, y + 50); c.lineTo(327, y + 50); c.lineTo(327, y + 34); c.lineTo(315, y + 34); c.closePath(); c.fill();
        const qq = Math.min(1, ec / 900);
        if (ec > 1200) { for (let b = 0; b < 6; b++) { const by = y - ((ec - 1200) / 8 + b * 22) % 160; c.strokeStyle = '#9fe6ff'; c.lineWidth = 2; rond(c, 120 + b * 10, by, 5 + b % 3 * 2); c.stroke(); } }
        main(c, 400 + (150 - 400) * qq, 470 + (y + 30 - 470) * qq, 1.3, ec > 900 ? Math.min(1, (ec - 900) / 300) : 0);
      } else if (etape === 'fusee') {
        rr(c, 190, 322, 100, 46, 12); c.fillStyle = '#0b2730'; c.fill(); c.strokeStyle = '#ffb347'; c.lineWidth = 3; c.stroke();
        c.fillStyle = '#ffb347'; c.beginPath(); c.moveTo(240, 330); c.lineTo(252, 348); c.lineTo(252, 360); c.lineTo(228, 360); c.lineTo(228, 348); c.closePath(); c.fill();
        const qq = Math.min(1, ec / 800);
        if (ec < 1100) main(c, 420 + (240 - 420) * qq, 470 + (345 - 470) * qq, 1.3, ec > 800 ? Math.min(1, (ec - 800) / 300) : 0);
      } else if (etape === 'repondre') {
        const n = q.o.length, w = n === 2 ? 150 : 100, gap = 12;
        const x0 = 240 - (n * w + (n - 1) * gap) / 2;
        const repondu = ec > 1300;
        if (repondu) dessinerSonar(c, cx, cy, Rr, sc, 1, { t: T, revele: true, marque: marqueDemo(q), zone: q.k === 'dir' ? q.z : undefined, cercle: q.k === 'pro', zoneCreature: q.k === 'cr' });
        for (let i = 0; i < n; i++) caseDemo(c, q, q.o[i], x0 + i * (w + gap), y, w, h, repondu && i === q.b ? 'bonne' : '');
        const tx = x0 + q.b * (w + gap) + w / 2, ty = y + h / 2;
        const qq = Math.min(1, ec / 1000);
        main(c, 430 + (tx - 430) * qq, 475 + (ty - 475) * qq, 1.3, ec > 1000 ? Math.min(1, (ec - 1000) / 300) : 0);
      } else if (etape === 'attaque') {
        const qa = Math.min(1, ec / 1400);
        for (let s = 0; s < 4; s++) {
          const x = 90 + s * 100, yy = 405;
          const secoue = s === 1 && ec > 1100 && ec < 1700 ? Math.sin(ec / 20) * 6 : 0;
          hublot(c, s, x + secoue, yy, 30, {});
          const br = [1, 4, 0, 2][s];
          for (let b = 0; b < 5; b++) { c.fillStyle = b < br ? (br >= 3 ? '#ff4b3a' : '#ffb347') : '#ffffff22'; c.fillRect(x - 16 + b * 7, yy + 46 - b * 2, 5, 6 + b * 2); }
          if (s === 1 && qa > 0.5) { c.strokeStyle = '#ff4b3a'; c.lineWidth = 4; rond(c, x, yy, 36 + (qa - 0.5) * 10); c.stroke(); }
        }
      }
      tutoId = requestAnimationFrame(image);
    }
    let tutoId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = (ev) => { if (ev.target === $('voile-tuto')) { audio(); fermer(); } };
  }

  // ---------------------------------------------------------------------
  //  Clavier : 1 à 4 (réponses), F (fusée), flèches (boutons), Échap / P (pause)
  // ---------------------------------------------------------------------

  document.addEventListener('pointerdown', () => { clavierUtilise = false; audio(); }, true);
  document.addEventListener('keydown', (ev) => {
    clavierUtilise = true;
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const chiffre = /^(?:Digit|Numpad)([1-4])$/.exec(ev.code);
    if (chiffre) {
      const i = Number(chiffre[1]) - 1;
      audio();
      if (etatPanneau === 'question' && vue && vue.sc && i < vue.sc.q.o.length) { ev.preventDefault(); repondre(i); }
      else if (etatPanneau === 'choix' && i < 2) { ev.preventDefault(); agir(i === 0 ? { p: 1 } : { c: 1 }); }
      return;
    }
    if (ev.code === 'KeyF' && etatPanneau === 'question') { ev.preventDefault(); audio(); tirerFusee(); return; }
    if (ev.code === 'ArrowLeft' || ev.code === 'ArrowRight' || ev.code === 'ArrowUp' || ev.code === 'ArrowDown') {
      const bs = Array.from(document.querySelectorAll('#panneau button:not(:disabled)'));
      if (!bs.length) return;
      ev.preventDefault();
      const i = bs.indexOf(document.activeElement);
      const pas = ev.code === 'ArrowLeft' || ev.code === 'ArrowUp' ? -1 : 1;
      const k = i < 0 ? 0 : (i + pas + bs.length) % bs.length;
      try { bs[k].focus({ preventScroll: true }); } catch (e) { /* rien */ }
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-journaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirJournaux(); });
  $('btn-combis').addEventListener('click', () => { audio(); sons.clic(); ouvrirCombis(); });
  ['niv-retour', 'jour-retour', 'combi-retour'].forEach((id) => $(id).addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); }));
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une plongée solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? Math.max(0, vue.o2[partie.siege]) : 0);
  });

  window.addEventListener('resize', () => relancerBoucle());

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
