        for (let k = 0; k < 160; k++) {
          c.fillStyle = 'rgba(200,220,210,' + (Math.random() * 0.25) + ')';
          c.fillRect(cx - R + Math.random() * 2 * R, cy - R + Math.random() * 2 * R, R * 0.02, R * 0.012);
        }
        c.fillStyle = 'rgba(160,200,180,0.06)';
        c.fillRect(cx - R, cy - R + ((h / 7) % (2 * R)), 2 * R, R * 0.12);
        const bh = R * 0.42, x0 = cx - R * 0.9, lx = R * 1.8;
        c.fillStyle = '#020806e6'; c.fillRect(x0 - 6, cy - bh / 2, lx + 12, bh);
        c.strokeStyle = '#1e7a4f55'; c.lineWidth = 1;
        for (let k = 1; k < 6; k++) { c.beginPath(); c.moveTo(x0 + (lx * k) / 6, cy - bh / 2); c.lineTo(x0 + (lx * k) / 6, cy + bh / 2); c.stroke(); }
        c.strokeStyle = VERT; c.lineWidth = Math.max(1.5, R * 0.016); c.shadowColor = VERT; c.shadowBlur = R * 0.05;

      }
    } else if (o.mode === 'titre') {
      const ang = (h / 1500) * Math.PI * 2 - Math.PI / 2;
      for (let k = 0; k < 16; k++) {
        c.fillStyle = 'rgba(109,255,176,' + (0.18 * (1 - k / 16)) + ')';
        c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, R, ang - (k + 1) * 0.05, ang - k * 0.05); c.closePath(); c.fill();
      }
      c.strokeStyle = '#9dffd0'; c.lineWidth = Math.max(1, R * 0.012);
      c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(ang) * R, cy + Math.sin(ang) * R); c.stroke();
      const deco = [{ d: 0, r: 1, a: 1, f: 0 }, { d: 1, r: 2, a: 3, f: 1 }, { d: 2, r: 0, a: 2, f: 2 }, { d: 3, r: 1, a: 4, f: 3 }, { d: 1, r: 0, a: 0, f: 0 }, { d: 2, r: 2, a: 4, f: 1 }, { d: 0, r: 2, a: 4, f: 2 }];

      const k = (h % 2600) / 2600;
      c.strokeStyle = 'rgba(109,255,176,' + (0.25 * (1 - k)) + ')'; c.lineWidth = Math.max(1, R * 0.01);

  // Fond : abysses, neige marine ; sur l'écran titre, le grand sonar (jaquette).
  const fond = $('fond');
  const neige = [];
  for (let i = 0; i < 70; i++) neige.push({ x: Math.random(), y: Math.random(), v: 0.004 + Math.random() * 0.012, r: 0.6 + Math.random() * 1.8 });
  function dessinerFond(h) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = window.innerWidth, H = window.innerHeight;
    if (fond.width !== Math.round(W * dpr) || fond.height !== Math.round(H * dpr)) { fond.width = Math.round(W * dpr); fond.height = Math.round(H * dpr); }
    const c = fond.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#062231'); g.addColorStop(0.45, '#03111a'); g.addColorStop(1, '#010407');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    // Rayons de lumière lointaine
    c.fillStyle = 'rgba(80,180,200,0.04)';
    for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(W * (0.15 + k * 0.3), 0); c.lineTo(W * (0.28 + k * 0.3), 0); c.lineTo(W * (0.05 + k * 0.33), H * 0.6); c.lineTo(W * (-0.05 + k * 0.33), H * 0.6); c.fill(); }
    c.fillStyle = 'rgba(200,230,230,0.5)';

      p.y += p.v * 0.016; if (p.y > 1.02) { p.y = -0.02; p.x = Math.random(); }
      c.globalAlpha = 0.25 + 0.4 * Math.abs(Math.sin(h / 2000 + p.x * 9));
      c.beginPath(); c.arc((p.x + Math.sin(h / 4000 + p.y * 6) * 0.01) * W, p.y * H, p.r, 0, Math.PI * 2); c.fill();
    });
    c.globalAlpha = 1;
    if (ecran === 'titre') {
      const h1 = document.querySelector('#ecran-titre h1').getBoundingClientRect();
      const pan = document.querySelector('#ecran-titre .panneau').getBoundingClientRect();
      const haut = h1.bottom + 26, bas = pan.top - 6;
      const taille = Math.max(170, Math.min(W * 0.98, (bas - haut) * 1.18));
      c.save();
      c.translate(W / 2 - taille / 2, Math.max(haut, (haut + bas) / 2) - taille / 2);
      dessinerSonar(c, taille, taille, { mode: 'titre', h: h, efface: false });

  // ---------------------------------------------------------------------

  function siegesActuels() {
    if (!partie) return [];

  }
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom d'une place dans les étiquettes : Toi, Robot, ou le pseudo du vrai joueur.
  function nomPlace(info, role) { return role === 'toi' ? tr('place.toi') : role === 'joueur' ? (info.nom || tr('place.joueur')) : tr('place.robot'); }
  // Nom d'une cabine dans les phrases : pseudo d'un vrai joueur, sinon « cabine Lagon ».
  function nomTexte(s) {

  // ---------------------------------------------------------------------

  function construirePlaces() {
    const boite = $('places');

      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s;

  function remplirTag(el, role, nom) {
    el.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;

  function majPlaces() {
    const e = vueP;
    const sieges = siegesActuels();
    // Avant le lancement d'une plongée solo (tutoriel), la cabine 0 est déjà la tienne.
    if (!partie && session === 'solo') sieges[0] = { humain: true, moi: true, chef: false, nom: null };
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s);
      const info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role);
      const air = e ? e.air[s] : 0, br = e ? e.br[s] : 0, fl = e ? e.fl[s] : 0, vi = e ? e.vi[s] : 1;
      const tour = !!(e && vue && !R.fin(vue) && siegeAffiche(maintenant()) === s && partie && partie.phase === 'jeu');
      const cle = [air, br, fl, vi, role, nom, info.chef ? 1 : 0, combiDe(s), e ? 1 : 0].join('|');
      if (d.dataset.cle !== cle) {
        d.dataset.cle = cle;
        const c = d.querySelector('canvas.av').getContext('2d');
        c.clearRect(0, 0, 88, 88);

  }

  // Petit texte qui monte au-dessus d'une cabine (+2, Bruit !, −3…).
  function gainFlottant(s, texte, couleur) {
    const d = $('place-' + s);
    if (!d) return;
    const g = document.createElement('span');
    g.className = 'gain'; g.textContent = texte; g.style.color = couleur;

  function secouer(el) { if (!el) return; el.classList.remove('secoue'); void el.offsetWidth; el.classList.add('secoue'); }

  // ---------------------------------------------------------------------
  //  Regard sur le sonar, réponses, coups de la créature (file d'affichage)
  // ---------------------------------------------------------------------

  function dureeRegard(s) { return estHumain(s) ? vue.cfg.vue : 1150; }

  function commencerRegard(t0, sansEncre) {
    if (!vue || !vue.sc) { bal = null; return; }
    const d = dureeRegard(vue.to);
    bal = { id: vue.sc.id, t0: t0, d: d, fin: t0 + d + 250, sansEncre: !!sansEncre, joues: [], sc: vue.sc, s: vue.to, ef: vue.cfg.ef, ping: false };
  }

  function pousser(ev) { file.push(ev); dernierRecu = Date.now(); }

  function traiterFile(t) {
    while (file.length && t >= finEtape && !enPause) {
      const it = file.shift();
      if (it.fin) { montrerFin(it.resultat); finEtape = t; break; }
      jouerEtape(it, t);
    }
  }

  function jouerEtape(ev, t) {
    const avant = ev.avant, apres = ev.apres, x = apres.ev || {}, s = ev.siege;
    const robot = !estHumain(s);
    vue = copie(apres);
    vueP = copie(avant);
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto', { nom: nomTexte(s) }));
    let fin = t;
    if (x.t === 'fusee') {
      vueP = copie(apres);
      sons.fusee(); flareT0 = t;
      gainFlottant(s, tr('jeu.bruitCourt', { n: 1 }), '#ff8a5c');
      commencerRegard(t + 550, true);
      fin = bal.fin + (robot ? 450 : 0);
    } else if (x.t === 'ok' || x.t === 'faux') {
      const ok = x.t === 'ok';
      const dur = ev.moi ? 1050 : (robot ? 1100 : 1450);
      resultat = { t0: t, fin: t + dur, sc: avant.sc, r: x.r, b: x.b, ok: ok, s: s, k: avant.k, g: x.g || 0, re: ok ? avant.re + (x.g || 0) : 0, perdu: x.perdu || 0 };
      if (ok) {
        sons.juste();
        gainFlottant(s, '+' + nb(x.g), VERT);
        if (estMoi(s)) bulles(0.5);
      } else {
        sons.erreur();
        secouer($('place-' + s));
        gainFlottant(s, tr('jeu.bruitCourt', { n: 2 }), '#ff8a5c');
      }
      fin = t + dur;
      if (ok && apres.ph === 'c') planifier(fin, () => { vueP = copie(apres); });
      else if (ok && x.enchaine) {

        commencerRegard(fin + 250, false);
        fin = bal.fin + (robot ? 400 : 0);
      } else {
        if (x.bonus) planifier(fin, () => { toast(tr(estMoi(s) ? 'jeu.bonusToi' : 'jeu.bonus', { nom: nomTexte(s) })); sons.reserve(); gainFlottant(s, '+' + nb(x.banque), VERT); });
        else if (ok && x.banque > 0) planifier(fin, () => { sons.reserve(); gainFlottant(s, '+' + nb(x.banque), VERT); });
        fin = suiteTour(x, avant, apres, fin);
      }
    } else if (x.t === 'encore') {
      vueP = copie(apres);
      sons.clic();
      commencerRegard(t + 300, false);
      fin = bal.fin + (robot ? 450 : 0);
    } else if (x.t === 'passe') {
      if (x.banque > 0) { sons.reserve(); gainFlottant(s, '+' + nb(x.banque), VERT); }
      fin = suiteTour(x, avant, apres, t + 650);
    } else {
      vueP = copie(apres);
    }
    finEtape = fin;
  }

  // Fin d'un tour : respiration, coup de la créature, éliminations, regard suivant.
  function suiteTour(x, avant, apres, t) {
    planifier(t, () => {
      vueP = copie(apres);
      if (x.co) gainFlottant(avant.to, '−' + nb(x.co), '#ffcf5a');
      if (x.ronde && !R.fin(apres)) toast(tr('jeu.nouvelleRonde', { n: x.ronde, c: O.conso(x.ronde) }), 1600);
    });
    if (x.att) {
      const a = x.att;
      attaqueVue = { t0: t + 200, fin: t + 1900, c: a.c, d: a.d };
      planifier(t + 200, () => {
        sons.grogne();
        setTimeout(() => sons.coup(), 450);
        const fl = $('flash'); fl.classList.remove('actif'); void fl.offsetWidth; fl.classList.add('actif');
        secouer($('ecran-jeu'));
        secouer($('place-' + a.c));
        gainFlottant(a.c, '−' + nb(a.d), '#ff4d5e');
        toast(estMoi(a.c) ? tr('jeu.attaqueToi', { n: a.d }) : tr('jeu.attaque', { nom: nomTexte(a.c), n: a.d }), 2200, true);
      });
      t += 1900;
    }
    if (x.morts && x.morts.length) {
      const morts = x.morts.slice();
      planifier(t, () => {
        sons.mort();
        morts.forEach((m) => toast(estMoi(m) ? tr('jeu.mortToi') : tr('jeu.mort', { nom: nomTexte(m) }), 2400, true));
      });
      t += 900;
    }
    if (!R.fin(apres) && apres.ph === 'q' && apres.sc) {
      commencerRegard(t + 250, false);
      if (estMoi(apres.to)) planifier(t + 100, () => sons.tour());
      t = bal.fin + (estHumain(apres.to) ? 0 : 450);
    }
    return t;
  }

  // Ce que montre la zone des questions maintenant.
  function modeZone(t) {
    if (!partie || !vue || !vue.sc || partie.phase === 'salon') return 'vide';
    if (resultat && t < resultat.fin) return 'resultat';
    if (attaqueVue && t < attaqueVue.fin) return 'attaque';
    if (bal && t < bal.t0) return 'attente';
    if (bal && t < bal.fin) return 'regard';
    if (R.fin(vue)) return 'finie';
    return vue.ph === 'q' ? 'question' : 'choix';
  }

  // Cabine montrée comme « en train de jouer » (l'affichage a un temps de retard sur l'état).
  function siegeAffiche(t) {
    if (!vue) return -1;
    if (resultat && (t < resultat.fin || (bal && t < bal.t0))) return resultat.s;
    return bal && t < bal.fin ? bal.s : vue.to;
  }

  function peutJouer(mode) {
    return (mode === 'question' || mode === 'choix') && !file.length && !enPause && !attenteTuto && partie && partie.monTour();
  }

  function texteQuestion(q) {
    if (q.t === 'dir' || q.t === 'fc' || q.t === 'ou') return tr('q.' + q.t + '.' + q.p);
    return tr('q.' + q.t);
  }
  function genreOption(q) { return (q.t === 'tot' || q.t === 'dir' || q.t === 'fc') ? 'n' : (q.t === 'ou' || q.t === 'pro') ? 'd' : 'f'; }
  function texteOption(sc, i) {
    const v = sc.op[i], g = genreOption(sc.q);
    return g === 'n' ? nb(v) : g === 'd' ? tr('dir.' + v) : tr('forme.' + v);
  }

  function boutonReponse(sc, i, actif) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn rep';
    const v = sc.op[i], g = genreOption(sc.q);
    if (g === 'n') { const x = document.createElement('b'); x.textContent = nb(v); b.appendChild(x); }
    else if (g === 'd') { b.innerHTML = svgDir(v); const sp = document.createElement('span'); sp.className = 'dir'; sp.textContent = tr('dir.' + v); b.appendChild(sp); }
    else { b.innerHTML = svgForme(v); const sp = document.createElement('span'); sp.className = 'sr'; sp.textContent = tr('forme.' + v); b.appendChild(sp); }
    b.setAttribute('aria-label', tr('jeu.reponseAria', { n: i + 1, rep: texteOption(sc, i) }));
    b.disabled = !actif;
    if (actif) b.addEventListener('click', () => { audio(); sons.clic(); jouerAction({ r: i }); });
    return b;
  }

  function boutonTexte(texte, classe, actif, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn ' + (classe || '');
    b.textContent = texte;
    b.disabled = !actif;
    if (actif) b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function jouerAction(a) {
    if (!partie || !peutJouer(modeZone(maintenant()))) return;
    partie.jouer(a);
  }

  let cleZone = '';
  function majZone(t) {
    const mode = modeZone(t);
    const jouable = peutJouer(mode);
    const s = siegeAffiche(t);
    const nomTour = s >= 0 ? nomTexte(s) : '';
    const cle = [mode, vue ? vue.sc && vue.sc.id : '', vue ? vue.ph + vue.k + (vue.sc ? vue.sc.vu : '') : '', jouable, resultat ? resultat.t0 : '', attaqueVue ? attaqueVue.t0 : '', nomTour, s, vue ? vue.fl.join() : ''].join('|');
    majRadio(mode);
    if (cle === cleZone) return;
    cleZone = cle;
    const qt = $('q-texte'), rep = $('q-reponses'), res = $('q-reserve'), fus = $('btn-fusee');
    rep.textContent = ''; rep.className = '';
    fus.hidden = true;
    let texte = '';
    const moi = s >= 0 && estMoi(s);
    if (mode === 'regard' || mode === 'attente') {
      const sc = bal ? bal.sc : vue.sc;
      if (sc && sc.pa) texte = moi ? tr('jeu.panneToi') : tr('jeu.panneAutre', { nom: nomTour });
      else texte = moi ? tr('jeu.regardeToi') : tr('jeu.regardeAutre', { nom: nomTour });
      if (sc && sc.en >= 0 && !(bal && bal.sansEncre)) texte += ' ' + tr('jeu.encreVue');
    } else if (mode === 'question' || mode === 'resultat') {
      const sc = mode === 'resultat' ? resultat.sc : vue.sc;
      texte = mode === 'resultat' ? (resultat.ok ? tr('jeu.juste') : tr('jeu.faux', { rep: texteOption(sc, resultat.b) })) : texteQuestion(sc.q);
      rep.className = (sc.op.length === 3 ? 'trois ' : '') + (mode === 'resultat' ? 'montre' : '');
      for (let i = 0; i < sc.op.length; i++) {
        const b = boutonReponse(sc, i, jouable && mode === 'question');
        if (mode === 'resultat') { if (i === resultat.b) b.classList.add('juste'); else if (i === resultat.r) b.classList.add('faux'); }
        rep.appendChild(b);
      }
      if (mode === 'question' && !jouable && !moi) texte = tr('jeu.questionAutre', { nom: nomTour }) + ' ' + texte;
      if (mode === 'question' && jouable && vue.fl[s] > 0 && !sc.pa && !sc.vu) {
        fus.hidden = false;
        $('fusee-texte').textContent = tr('jeu.fusee', { n: vue.fl[s] });
      }
    } else if (mode === 'choix') {
      if (moi) {
        texte = tr('jeu.choixToi', { n: vue.re });
        rep.appendChild(boutonTexte(tr('jeu.encore', { n: vue.k + 1 }), 'ambre', jouable, () => jouerAction({ e: 1 })));
        rep.appendChild(boutonTexte(tr('jeu.passer', { n: vue.re }), 'vert', jouable, () => jouerAction({ p: 1 })));
      } else texte = tr('jeu.choixAutre', { nom: nomTour, n: vue.re });
    } else if (mode === 'attaque') {
      texte = estMoi(attaqueVue.c) ? tr('jeu.attaqueToi', { n: attaqueVue.d }) : tr('jeu.attaque', { nom: nomTexte(attaqueVue.c), n: attaqueVue.d });
    } else if (mode === 'vide' && partie && partie.mode === 'connexion') texte = tr('multi.recherche');
    qt.textContent = texte;
    // Réserve et temps
    let r = '';
    if (vue && mode !== 'vide' && mode !== 'finie') {
      const re = mode === 'resultat' ? resultat.re : vue.re;
      if (re > 0) r = tr('jeu.reserve', { n: re });
      if (mode === 'question' && vue.k > 1) r = (r ? r + ' · ' : '') + tr('jeu.question', { n: vue.k });
    }
    res.textContent = r;
    if (jouable) {
      const premier = rep.querySelector('button');
      if (premier && document.activeElement && document.activeElement.classList.contains('rep') === false && clavierActif) try { premier.focus({ preventScroll: true }); } catch (e) { /* rien */ }
    }
  }

  // Message radio de l'équipage (ou de la créature qui l'imite).
  let cleRadio = '';
  function majRadio(mode) {
    const sc = vue && vue.sc;
    const montrer = !!(sc && sc.im && mode === 'question');
    const cle = montrer ? sc.id + '|' + sc.im.s + '|' + sc.im.v : '';
    if (cle !== cleRadio) {
      cleRadio = cle;
      const r = $('radio');
      r.classList.toggle('actif', montrer);
      r.classList.toggle('tordu', montrer && !!sc.im.x);
      if (montrer) {
        $('radio-texte').textContent = tr('radio.message', { cabine: tr('cabine.nom', { c: tr('cabine.' + sc.im.s) }), rep: texteOption(sc, sc.im.v) });
        sons.radio();
      }
    }
    if (cleRadio) {
      const c = $('radio-onde').getContext('2d');
      const tordu = $('radio').classList.contains('tordu');
      const h = performance.now();
      c.clearRect(0, 0, 108, 44);
      c.strokeStyle = tordu ? '#ff6b7a' : '#4fd6e0'; c.lineWidth = 3;
      c.beginPath();
      for (let x = 0; x <= 108; x += 3) {
        let y = Math.sin(x / 7 + h / 120) * 10;
        if (tordu) y = y * (0.4 + Math.abs(Math.sin(x * 1.7 + h / 50))) + (Math.random() - 0.5) * 10;
        if (x === 0) c.moveTo(x, 22 + y); else c.lineTo(x, 22 + y);
      }
      c.stroke();
    }
  }

  // Sons des échos pendant le regard.
  function sonsRegard(t) {
    if (!bal || t < bal.t0 || t > bal.fin) return;
    if (!bal.ping) { bal.ping = true; sons.ping(estHumain(bal.s) ? 1 : 0.4); }
    const n = bal.sc.e.length, el = t - bal.t0;
    for (let i = 0; i < n; i++) {
      if (bal.joues[i] || el < tempsEcho(i, n, bal.d)) continue;
      bal.joues[i] = true;
      const e = bal.sc.e[i];
      const v = estHumain(bal.s) ? (bal.sc.pa ? 1.2 : 0.6) : 0.25;
      if (e.x) sons.faux(v); else sons.forme(e.f, v);
    }
  }

  // Dessin du sonar de la partie.
  const sonar = $('sonar');
  function tailleSonar() {
    const z = $('zone-sonar').getBoundingClientRect();
    const t = Math.max(120, Math.floor(Math.min(z.width, z.height)));
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (sonar.width !== Math.round(t * dpr)) {
      sonar.width = Math.round(t * dpr); sonar.height = Math.round(t * dpr);
      sonar.style.width = t + 'px'; sonar.style.height = t + 'px';
    }
  }
  function dessinerPartie(t) {
    tailleSonar();
    const c = sonar.getContext('2d');
    const W = sonar.width, H = sonar.height;
    const enRegard = bal && t >= bal.t0 && t < bal.fin;
    const menace = vueP ? Math.min(1, vueP.me / Math.max(1, vueP.cfg.se)) : 0;
    dessinerSonar(c, W, H, {
      sc: enRegard ? bal.sc : null, t: enRegard ? t - bal.t0 : 0, d: bal ? bal.d : 1, ef: bal ? bal.ef : 0, sansEncre: bal && bal.sansEncre,
      mode: enRegard ? 'balayage' : 'repos', h: performance.now(), menace: menace, lettres: true,
      flare: Math.max(0, 1 - (t - flareT0) / 700)
    });
    // Barre du temps qui défile pendant le regard
    if (enRegard && t < bal.t0 + bal.d) {
      const k = 1 - (t - bal.t0) / bal.d;
      c.fillStyle = '#6dffb0';
      c.fillRect(W * 0.2, H * 0.965, W * 0.6 * k, H * 0.012);
    }
  }

  // Temps laissé à un vrai joueur en ligne (le robot répond ensuite à sa place).
  function majTemps(mode) {
    const el = $('temps');
    const actif = partie && partie.mode === 'en-ligne' && peutJouer(mode);
    el.classList.toggle('actif', !!actif);
    if (!actif) { dernierTic = -1; return; }
    const reste = Math.max(0, dernierRecu + R.delaiJoueur - Date.now());
    el.firstElementChild.style.transform = 'scaleX(' + (reste / R.delaiJoueur) + ')';
    const sec = Math.ceil(reste / 1000);
    if (sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
  }

  function majInfo() {
    let txt = '', sous = '';
    if (session === 'solo') txt = tr('jeu.plongee', { n: niveau, max: NIVEAUX.length });
    else if (partie && partie.mode === 'connexion') txt = tr('jeu.connexion');
    else if (partie && partie.manche > 0) txt = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else txt = tr('jeu.salon');
    if (vue && partie && partie.phase === 'jeu' && !R.fin(vue)) {
      if (partie.siege < 0) sous = tr('multi.attente');
      else if (!vue.vi[partie.siege]) sous = tr('jeu.spectateur');
      else { const sa = siegeAffiche(maintenant()); sous = estMoi(sa) ? tr('tour.toi') : tr('tour.de', { nom: nomTexte(sa) }); }
    }
    const el = $('info-plongee');
    const cle = txt + '|' + sous;
    if (el.dataset.cle !== cle) {
      el.dataset.cle = cle;
      el.textContent = txt;
      if (sous) { const sm = document.createElement('small'); sm.textContent = sous; el.appendChild(sm); }
    }
  }

  // Boucle d'affichage
  function boucle(h) {
    requestAnimationFrame(boucle);
    if (ecran !== 'jeu') { dessinerFond(h); return; }
    if (!boucle.fondFait || h - boucle.fondFait > 120) { dessinerFond(h); boucle.fondFait = h; }
    const t = maintenant();
    if (!enPause) {
      for (let i = 0; i < effets.length;) { if (effets[i].t <= t) { const f = effets[i].f; effets.splice(i, 1); f(); } else i++; }
      traiterFile(t);
      sonsRegard(t);
    }
    const mode = modeZone(t);
    majZone(t);
    majPlaces();
    majInfo();
    majTemps(mode);
    dessinerPartie(t);
    if (session === 'ligne' && $('voile-salon').classList.contains('actif')) majSalon();
    else if (session === 'ligne') majCompte();
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': pousser(ev); break;
      case 'fin':
        if (partie.mode === 'en-ligne') finEnAttente = true;
        file.push({ fin: true, resultat: ev.resultat });
        break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
  }

  function surMode(ev) {
    if (ev.mode === 'connexion' || session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function reinitialiserVue() {
    file.length = 0;
    effets.length = 0;
    resultat = null; attaqueVue = null; bal = null;
    finEtape = 0;
    cleZone = '';
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    reinitialiserVue();
    vue = partie.etat ? copie(partie.etat) : null;
    vueP = vue;
    dernierRecu = Date.now();
    if (partie.phase === 'salon') { finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); }
    else if (partie.phase === 'jeu' && vue && vue.sc && !R.fin(vue)) commencerRegard(maintenant() + 300, false);
  }

  function surManche() {
    jeton++;
    reinitialiserVue();
    vue = copie(partie.etat);
    vueP = vue;
    dernierRecu = Date.now();
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null; finEnAttente = false; lancement = false;
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    commencerRegard(maintenant() + 700, false);
    finEtape = bal ? bal.fin : 0;
    if (estMoi(vue.to)) planifier(maintenant() + 600, () => sons.tour());
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    majSalon();
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche
  // ---------------------------------------------------------------------

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    if (finEnAttente || file.some((x) => x.fin)) return;   // le résultat de la manche ouvrira le salon
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) fermerPause();
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + combiDe(s);
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        casque(c, 56, 60, 44, s, combiDe(s), false);
        if (info.chef) couronne(c, 56, 16, 34);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { cabine: tr('cabine.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomTexte(partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  // ---------------------------------------------------------------------
  //  Fins de plongée : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function montrerFin(res) {
    if (!partie || !vue) return;
    vueP = vue;
    const j = jeton;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (session === 'ligne' && partie.mode === 'en-ligne') afficherFinEnLigne(res);
      else afficherFin(res);
    }, 500);
  }

  function remplirClassement(e, res, moi, sieges, boite) {
    boite.textContent = '';
    const ordre = res && res.classement ? res.classement : [0, 1, 2, 3];
    ordre.forEach((s, k) => {
      const l = document.createElement('div');

  const TUTOS = {
    base: [
      (c, t) => sonarDemo(c, t, DEMO, { centre: true }),
      (c, t) => {
        sonarDemo(c, t, DEMO, { mode: 'repos' });
        for (let i = 0; i < 4; i++) { miniBouton(c, 30 + i * 128, 400, 116, 90, i === 2 && t > 1700 ? 'juste' : ''); pips(c, 88 + i * 128, 445, i + 1); }
        const x = t < 1500 ? 90 + (t / 1500) * 250 : 344;
        main(c, x, 452, t > 1500 && t < 1900);
      },
      (c, t) => {
        miniBouton(c, 40, 400, 220, 110, t % 2400 < 1200 ? 'juste' : '');
        miniBouton(c, 300, 400, 220, 110, t % 2400 >= 1200 ? 'juste' : '');
        c.fillStyle = '#ffcf5a'; c.beginPath(); c.moveTo(150, 425); c.lineTo(180, 470); c.lineTo(120, 470); c.fill();
        c.fillStyle = '#9dffd0'; c.fillRect(395, 425, 30, 55); c.fillRect(402, 415, 16, 12);
        for (let k = 0; k < 6; k++) bulleAir(c, 280 + Math.sin(t / 300 + k) * 60, 330 - ((t / 6 + k * 50) % 300), 8 + (k % 3) * 4);
        casque(c, 280, 150, 70, 0, 0, false);
        main(c, t % 2400 < 1200 ? 150 : 410, 470, (t % 1200) > 600);
      }
    ],
    creature: [
      (c, t) => {
        miniBouton(c, 170, 40, 220, 100, t > 600 ? 'faux' : '');
        pips(c, 280, 90, 2);
        rangeeCasques(c, t, { bruit: t > 800 ? 0 : -1 });
        main(c, 270, 110, t > 400 && t < 800);
      },
      (c, t) => {
        sonarDemo(c, t, null, { mode: 'repos', menace: Math.min(1, t / 3000) });
        jauge(c, 80, 380, 400, 4, Math.min(4, Math.floor(t / 800)));
        rangeeCasques(c, t, { bruit: 0 });
      },
      (c, t) => {
        sonarDemo(c, t, null, { mode: 'repos', menace: 1 });
        rangeeCasques(c, t, { bruit: t < 1200 ? 0 : -1, secoue: 0, secoueDepuis: 1200 });
        if (t > 1200 && t < 1800) { c.fillStyle = 'rgba(255,40,60,' + (0.5 * (1 - (t - 1200) / 600)) + ')'; c.fillRect(0, 0, 560, 560); }
        if (t > 1200) for (let k = 0; k < 5; k++) bulleAir(c, 95 + Math.sin(k * 2) * 30, 400 - (t - 1200) / 8 - k * 14, 6 + k);
      }
    ],
    formes: [
      (c, t, croise) => {
        for (let f = 0; f < 4; f++) {
          if (croise(f * 700 + 100)) sons.forme(f, 1);
          if (t > f * 700 + 100) grandeForme(c, f, 85 + f * 130, 230, 44);
        }
      },
      (c, t) => {
        sonarDemo(c, t, DEMO4, { d: 2400 });
        if (t > 2500) {
          for (let f = 0; f < 4; f++) { miniBouton(c, 30 + f * 128, 400, 116, 100, f === 3 && t > 3000 ? 'juste' : ''); c.save(); c.fillStyle = VERT; formeCanvas(c, f, 88 + f * 128, 450, 22); c.fill(); c.restore(); }
          main(c, 472, 460, t > 2900);
        }
      }
    ],
    efface: [(c, t) => sonarDemo(c, t, DEMO4, { ef: 1, d: 2900, centre: true })],
    encre: [
      (c, t) => sonarDemo(c, t, DEMO_ENCRE, { centre: true }),
      (c, t) => {
        const apres = t > 900;
        sonarDemo(c, apres ? t - 900 : 0, DEMO_ENCRE, { sansEncre: apres, flare: apres ? Math.max(0, 1 - (t - 900) / 700) : 0, mode: apres ? 'balayage' : 'repos' });
        miniBouton(c, 200, 410, 160, 100, t > 700 && t < 1100 ? 'juste' : '');
        c.fillStyle = '#ffcf5a'; c.beginPath(); c.moveTo(280, 425); c.quadraticCurveTo(300, 450, 296, 470); c.lineTo(264, 470); c.quadraticCurveTo(260, 450, 280, 425); c.fill();
        c.fillStyle = '#ff6a3d'; c.beginPath(); c.moveTo(266, 474); c.lineTo(280, 496); c.lineTo(294, 474); c.fill();
        if (t < 1100) main(c, 300, 470, t > 700);
      },
      (c, t) => { casque(c, 280, 250, 90, 0, 0, false); ondes(c, 280, 250, t); }
    ],
    position: [
      (c, t) => {
        sonarDemo(c, t, DEMO4, { d: 2200 });
        if (t > 2300) {
          const p = posEcho(DEMO4.e[3], 280, 170, 136);
          c.strokeStyle = '#ffcf5a'; c.lineWidth = 5; c.beginPath(); c.arc(p[0], p[1], 26, 0, Math.PI * 2); c.stroke();
          c.save(); c.translate(280, 470); c.fillStyle = VERT; c.beginPath(); c.moveTo(0, -60); c.lineTo(40, -10); c.lineTo(14, -10); c.lineTo(14, 50); c.lineTo(-14, 50); c.lineTo(-14, -10); c.lineTo(-40, -10); c.closePath(); c.fill(); c.restore();
        }
      },
      (c, t) => {
        sonarDemo(c, t, DEMO4, { d: 2200 });
        const p = posEcho(DEMO4.e[0], 280, 170, 136);
        if (t > 300) { c.strokeStyle = '#ffcf5a'; c.lineWidth = 5; c.beginPath(); c.arc(p[0], p[1], 26 + Math.sin(t / 150) * 3, 0, Math.PI * 2); c.stroke(); }
      }
    ],
    violente: [
      (c, t) => {
        sonarDemo(c, t, null, { mode: 'repos', menace: 1 });
        rangeeCasques(c, t, { secoue: 2, secoueDepuis: 1000 });
        if (t > 1000 && t < 1700) { c.fillStyle = 'rgba(255,40,60,' + (0.6 * (1 - (t - 1000) / 700)) + ')'; c.fillRect(0, 0, 560, 560); }
        if (t > 1000) for (let k = 0; k < 8; k++) bulleAir(c, 341 + Math.sin(k * 2) * 40, 400 - (t - 1000) / 7 - k * 12, 5 + k);
      }
    ],
    faux: [(c, t) => sonarDemo(c, t, DEMO_FAUX, { ef: 1, d: 3000, centre: true })],
    proche: [
      (c, t) => {
        sonarDemo(c, t, DEMO4, { d: 2200 });
        c.strokeStyle = '#ffcf5a'; c.lineWidth = 4;
        c.beginPath(); c.arc(280, 170, 136 * 0.33, 0, Math.PI * 2); c.stroke();
        if (t > 2000) { const p = posEcho(DEMO4.e[3], 280, 170, 136); c.lineWidth = 5; c.beginPath(); c.arc(p[0], p[1], 26, 0, Math.PI * 2); c.stroke(); }
      }
    ],
    affamee: [
      (c, t) => {
        sonarDemo(c, t, null, { mode: 'repos', menace: Math.min(1, t / 1800) });
        jauge(c, 130, 400, 300, 3, Math.min(3, Math.floor(t / 600)));
      }
    ],
    panne: [
      (c, t) => sonarDemo(c, t, DEMO_PANNE, { d: 3000, centre: true }),
      (c, t, croise) => {
        const f = Math.min(3, Math.floor(t / 900)), u = (t % 900) / 900;
        if (croise(f * 900 + 10)) sons.forme(f, 1.2);
        grandeForme(c, f, 130, 250, 58);
        c.fillStyle = '#020806'; c.fillRect(230, 150, 300, 200);
        onde(c, f, 245, 290, 270, 110, Math.min(1, u * 1.6));
      }
    ],
    compte: [
      (c, t) => {
        sonarDemo(c, t, DEMO_CARRES, { d: 2400 });
        if (t > 2500) DEMO_CARRES.e.forEach((e) => { if (e.f === 2) { const p = posEcho(e, 280, 170, 136); c.strokeStyle = '#ffcf5a'; c.lineWidth = 4; c.beginPath(); c.arc(p[0], p[1], 22, 0, Math.PI * 2); c.stroke(); } });
        c.save(); c.fillStyle = VERT; formeCanvas(c, 2, 240, 450, 26); c.fill(); c.restore();
        if (t > 2500) pips(c, 330, 450, 3);
      }
    ],
    absente: [
      (c, t) => {
        for (let f = 0; f < 4; f++) {
          miniBouton(c, 30 + f * 128, 200, 116, 116, f === 1 && t > 2200 ? 'juste' : '');
          c.save(); c.globalAlpha = f === 1 ? 0.25 + 0.2 * Math.sin(t / 200) : 1; c.fillStyle = VERT; formeCanvas(c, f, 88 + f * 128, 258, 30); c.fill(); c.restore();
          if (f !== 1 && t > 300 + f * 400) { c.strokeStyle = '#6dffb0'; c.lineWidth = 6; c.beginPath(); c.moveTo(60 + f * 128, 360); c.lineTo(80 + f * 128, 380); c.lineTo(118 + f * 128, 340); c.stroke(); }
        }
        if (t > 1800) main(c, 216, 280, t > 2100);
      }
    ],
    imite: [
      (c, t) => {
        casque(c, 110, 260, 60, 1, 0, false);
        c.fillStyle = '#0a2028'; c.strokeStyle = '#4fd6e0'; c.lineWidth = 4;
        c.beginPath(); c.roundRect ? c.roundRect(190, 200, 340, 120, 20) : c.rect(190, 200, 340, 120); c.fill(); c.stroke();
        c.strokeStyle = '#4fd6e0'; c.lineWidth = 5; c.beginPath();
        for (let x = 0; x <= 300; x += 4) { const y = Math.sin(x / 14 + t / 120) * 26; if (x === 0) c.moveTo(210 + x, 260 + y); else c.lineTo(210 + x, 260 + y); }
        c.stroke();
      },
      (c, t) => {
        const j = Math.sin(t / 30) * 4;
        casque(c, 110 + j, 260, 60, 1, 0, false);
        c.fillStyle = '#200a10'; c.strokeStyle = '#ff6b7a'; c.lineWidth = 4;
        c.beginPath(); c.roundRect ? c.roundRect(190 + j, 200, 340, 120, 20) : c.rect(190, 200, 340, 120); c.fill(); c.stroke();
        c.strokeStyle = '#ff6b7a'; c.lineWidth = 5; c.beginPath();
        for (let x = 0; x <= 300; x += 4) { const y = Math.sin(x / 14 + t / 120) * 26 * (0.3 + Math.abs(Math.sin(x * 1.7 + t / 50))) + (Math.random() - 0.5) * 18; if (x === 0) c.moveTo(210 + x, 260 + y); else c.lineTo(210 + x, 260 + y); }
        c.stroke();
        creature(c, 470, 470, 50, performance.now(), 0.9);
      }
    ],
    coups: [
      (c, t) => {
        sonarDemo(c, t, null, { mode: 'repos', menace: 1 });
        rangeeCasques(c, t, { secoue: 1, secoueDepuis: 900 });
        if (t > 900 && t < 1600) { c.fillStyle = 'rgba(255,40,60,' + (0.7 * (1 - (t - 900) / 700)) + ')'; c.fillRect(0, 0, 560, 560); }
        if (t > 900) for (let k = 0; k < 10; k++) bulleAir(c, 218 + Math.sin(k * 2) * 46, 400 - (t - 900) / 6 - k * 11, 5 + k);
      }
    ],
    reserve: [
      (c, t) => {
        casque(c, 280, 220, 90, 0, 0, false);
        for (let k = 0; k < 2; k++) { c.fillStyle = '#ffcf5a'; c.shadowColor = '#ffcf5a'; c.shadowBlur = 14; c.fillRect(220 + k * 100, 380, 20, 44); c.shadowBlur = 0; }
        for (let k = 0; k < 3; k++) bulleAir(c, 200 + k * 80, 120 - ((t / 9 + k * 40) % 90), 10);
      }
    ],
    finale: [(c, t) => sonarDemo(c, (t * 1.25) % DUREE_ETAPE, DEMO_ENCRE, { ef: 1, d: 2200, centre: true })]
  };

  let tutoCourant = null;
  function montrerTuto(cle, suite) {
    const etapes = TUTOS[cle];
    if (!etapes) { suite(); return; }
    tutoCourant = { cle: cle, etapes: etapes, n: 0, t0: performance.now(), prec: 0, suite: suite };
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    const pts = $('tuto-etapes');
    pts.textContent = '';
    etapes.forEach(() => pts.appendChild(document.createElement('i')));
    majTutoTexte();
    ouvrirVoile('voile-tuto');
    requestAnimationFrame(animerTuto);
  }
  function majTutoTexte() {
    const tc = tutoCourant;
    $('tuto-texte').textContent = tr('tuto.' + tc.cle + '.' + (tc.n + 1));
    [...$('tuto-etapes').children].forEach((x, i) => x.classList.toggle('on', i === tc.n));
  }
  function etapeSuivanteTuto() {
    const tc = tutoCourant;
    if (!tc) return;
    tc.n = (tc.n + 1) % tc.etapes.length;
    tc.t0 = performance.now(); tc.prec = 0;
    majTutoTexte();
  }
  function animerTuto(h) {
    const tc = tutoCourant;
    if (!tc) return;
    requestAnimationFrame(animerTuto);
    let t = h - tc.t0;
    if (t > DUREE_ETAPE) { if (tc.etapes.length > 1) { etapeSuivanteTuto(); return; } tc.t0 = h; tc.prec = 0; t = 0; }
    const c = $('tuto-demo').getContext('2d');
    c.clearRect(0, 0, 560, 560);
    const prec = tc.prec;
    tc.etapes[tc.n](c, t, (m) => prec < m && t >= m);
    tc.prec = t;
  }
  function fermerTuto() {
    const tc = tutoCourant;
    if (!tc) return;
    tutoCourant = null;
    fermerVoile('voile-tuto');
    tc.suite();
  }

  // ---------------------------------------------------------------------
  //  Clavier : 1 à 4 répondre (1 encore, 2 passer), F fusée, flèches, Échap/P pause
  // ---------------------------------------------------------------------

  let clavierActif = false;
  document.addEventListener('pointerdown', () => { clavierActif = false; }, true);
  document.addEventListener('keydown', (ev) => {
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      if (tutoCourant) { if (ev.code === 'Escape') fermerTuto(); return; }
      if (ecran !== 'jeu' || salonOuvert()) return;
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (tutoCourant || enPause || ecran !== 'jeu' || $('voile-fin').classList.contains('actif') || salonOuvert()) return;
    const chiffres = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Numpad1: 0, Numpad2: 1, Numpad3: 2, Numpad4: 3 };
    const mode = modeZone(maintenant());
    if (chiffres[ev.code] !== undefined) {
      ev.preventDefault(); audio(); clavierActif = true;
      const i = chiffres[ev.code];
      if (mode === 'question' && vue && i < vue.sc.op.length) { sons.clic(); jouerAction({ r: i }); }
      else if (mode === 'choix' && i < 2) { sons.clic(); jouerAction(i === 0 ? { e: 1 } : { p: 1 }); }
      return;
    }
    if (ev.code === 'KeyF') { if (!$('btn-fusee').hidden) { audio(); $('btn-fusee').click(); } return; }
    if (/^Arrow/.test(ev.code)) {
      const boutons = [...$('q-reponses').querySelectorAll('button:not(:disabled)')];
      if (!boutons.length) return;
      ev.preventDefault(); clavierActif = true;
      let i = boutons.indexOf(document.activeElement);
      const pas = ev.code === 'ArrowLeft' ? -1 : ev.code === 'ArrowRight' ? 1 : ev.code === 'ArrowUp' ? -2 : 2;
      i = i < 0 ? 0 : Math.max(0, Math.min(boutons.length - 1, i + pas));
      boutons[i].focus({ preventScroll: true });
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-journaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirJournaux(); });
  $('btn-combis').addEventListener('click', () => { audio(); sons.clic(); ouvrirCombis(); });
  ['niv-retour', 'jour-retour', 'combi-retour'].forEach((id) => $(id).addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); }));
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); fermerPause(); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-fusee').addEventListener('click', () => { audio(); jouerAction({ f: 1 }); });
  $('btn-tuto-ok').addEventListener('click', () => { audio(); sons.clic(); fermerTuto(); });
  $('tuto-demo').addEventListener('click', () => { audio(); etapeSuivanteTuto(); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une plongée solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vueP && partie && partie.siege >= 0 ? vueP.air[partie.siege] : 0);
  });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  requestAnimationFrame(boucle);
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
