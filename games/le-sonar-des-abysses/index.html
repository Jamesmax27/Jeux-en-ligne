  // ---------------------------------------------------------------------
  //  Dessins (canvas, aucun texte)
  // ---------------------------------------------------------------------

  function rond(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function rad(d) { return d * Math.PI / 180; }

  // Casque de scaphandrier dans un hublot : couleur du casque, couleur de la vitre.
  function casque(c, coul, vitre, x, y, r, opt) {
    opt = opt || {};
    c.save();
    c.translate(x, y);
    const k = r / 50;
    c.scale(k, k);
    // hublot de la cabine
    const g = c.createRadialGradient(0, -10, 5, 0, 0, 50);
    g.addColorStop(0, '#12324a'); g.addColorStop(1, '#040d16');
    rond(c, 0, 0, 48); c.fillStyle = g; c.fill();
    c.lineWidth = 5; c.strokeStyle = opt.bord || coul; c.stroke();
    // casque
    const gc = c.createLinearGradient(-30, -30, 30, 30);
    gc.addColorStop(0, '#ffffff55'); gc.addColorStop(0.35, coul); gc.addColorStop(1, '#00000088');
    rond(c, 0, 4, 32); c.fillStyle = coul; c.fill(); c.fillStyle = gc; c.fill();
    c.lineWidth = 2.5; c.strokeStyle = '#00000066'; c.stroke();
    // col du scaphandre
    rr(c, -26, 26, 52, 14, 6); c.fillStyle = coul; c.fill(); c.strokeStyle = '#00000055'; c.stroke();
    // vitre
    rond(c, 0, 6, 17); c.fillStyle = '#061018'; c.fill();
    c.lineWidth = 5; c.strokeStyle = '#d9b46a'; c.stroke();
    const gv = c.createRadialGradient(-6, 0, 2, 0, 6, 17);
    gv.addColorStop(0, vitre); gv.addColorStop(1, '#0a1c28');
    rond(c, 0, 6, 13); c.fillStyle = gv; c.globalAlpha = 0.85; c.fill(); c.globalAlpha = 1;
    c.beginPath(); c.arc(-4, 2, 7, rad(200), rad(260)); c.lineWidth = 3; c.strokeStyle = '#ffffffaa'; c.stroke();
    // boulons
    c.fillStyle = '#d9b46a';
    [[-24, -8], [24, -8], [-18, -22], [18, -22]].forEach((p) => { rond(c, p[0], p[1], 3.2); c.fill(); });
    // lampe
    rr(c, -5, -34, 10, 8, 3); c.fillStyle = '#d9b46a'; c.fill();
    rond(c, 0, -34, 4); c.fillStyle = opt.lampe || '#fff6c4'; c.fill();
    if (opt.noyee) {
      c.globalAlpha = 0.65; rond(c, 0, 0, 46); c.fillStyle = '#021a2c'; c.fill(); c.globalAlpha = 1;
      c.strokeStyle = '#7fb3c9'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(-20, -28); c.lineTo(-6, -8); c.lineTo(-14, 6); c.lineTo(2, 22); c.stroke();
    }
    c.restore();
  }

  // Couleurs du casque d'une place (Toi : la combinaison choisie).
  function couleursPlace(s, moi) {
    if (moi) { const cb = COMBIS[prog.combi] || COMBIS[0]; return { c: cb.c, v: cb.v, bord: COUL[s] }; }
    return { c: COUL[s], v: '#9fe8ff', bord: COUL[s] };
  }

  function couronne(c, x, y, k) {
    c.save(); c.translate(x, y); c.scale(k / 24, k / 24);
    c.beginPath(); c.moveTo(-20, 8); c.lineTo(-22, -14); c.lineTo(-10, -2); c.lineTo(0, -18); c.lineTo(10, -2); c.lineTo(22, -14); c.lineTo(20, 8); c.closePath();
    c.fillStyle = '#ffd34d'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#8a5f0c'; c.stroke();
    c.restore();
  }

  // Forme d'un écho (sonar) : 0 cercle, 1 triangle, 2 carré, 3 losange, 4 croissant.
  function tracerForme(c, f, x, y, s) {
    c.beginPath();
    if (f === 0) c.arc(x, y, s, 0, Math.PI * 2);
    else if (f === 1) { c.moveTo(x, y - s * 1.1); c.lineTo(x + s * 1.05, y + s * 0.8); c.lineTo(x - s * 1.05, y + s * 0.8); c.closePath(); }
    else if (f === 2) c.rect(x - s * 0.85, y - s * 0.85, s * 1.7, s * 1.7);
    else if (f === 3) { c.moveTo(x, y - s * 1.15); c.lineTo(x + s * 1.05, y); c.lineTo(x, y + s * 1.15); c.lineTo(x - s * 1.05, y); c.closePath(); }
    else { c.arc(x, y, s, rad(-60), rad(240)); c.arc(x + s * 0.55, y - s * 0.35, s * 0.8, rad(215), rad(-25), true); c.closePath(); }
  }

  function dessinerEcho(c, f, x, y, s, alpha, faux, lueur) {
    c.save();
    c.globalAlpha = alpha;
    if (lueur > 0) { rond(c, x, y, s * (1.4 + lueur * 2.2)); c.strokeStyle = 'rgba(125,255,196,' + (0.6 * lueur) + ')'; c.lineWidth = 2; c.stroke(); }
    c.shadowColor = faux ? '#9cc3d6' : '#3dffa0';
    c.shadowBlur = faux ? 6 : 14;
    tracerForme(c, f, x, y, s);
    c.lineWidth = Math.max(2, s * 0.28);
    if (faux) { c.setLineDash([s * 0.35, s * 0.3]); c.strokeStyle = '#b5d8e6'; c.stroke(); }
    else { c.fillStyle = 'rgba(61,255,160,.22)'; c.fill(); c.strokeStyle = '#8dffcc'; c.stroke(); }
    c.restore();
  }

  // Encre : nuage sombre posé sur un secteur.
  function dessinerEncre(c, cx, cy, r, q, alpha, t) {
    const a = rad([270, 0, 90, 180][q]);
    c.save();
    c.globalAlpha = alpha;
    c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, r * 1.02, a - rad(47), a + rad(47)); c.closePath(); c.clip();
    for (let i = 0; i < 9; i++) {
      const ang = a + rad(-40 + i * 10) + Math.sin(t / 900 + i) * 0.05;
      const d = r * (0.3 + (i % 3) * 0.25);
      const px = cx + Math.cos(ang) * d, py = cy + Math.sin(ang) * d;
      const g = c.createRadialGradient(px, py, 0, px, py, r * 0.42);
      g.addColorStop(0, '#0a0412'); g.addColorStop(0.7, '#14082acc'); g.addColorStop(1, '#14082a00');
      c.fillStyle = g; rond(c, px, py, r * 0.42); c.fill();
    }
    c.restore();
  }

  // La créature : une masse sombre aux tentacules, qui rôde autour de l'écran.
  function dessinerCreature(c, cx, cy, r, ang, menace, t) {
    const d = r * (1.12 - 0.05 * menace);
    const x = cx + Math.cos(ang) * d, y = cy + Math.sin(ang) * d;
    const k = r * (0.34 + 0.06 * menace);
    c.save();
    c.globalAlpha = 0.75 + 0.08 * menace;
    // tentacules qui épousent le bord
    c.strokeStyle = '#02040a'; c.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const dir = (i - 2) * 0.32;
      c.lineWidth = k * (0.32 - Math.abs(i - 2) * 0.05);
      c.beginPath();
      c.moveTo(x, y);
      const a1 = ang + dir + Math.sin(t / 700 + i) * 0.08;
      c.quadraticCurveTo(cx + Math.cos(a1) * r * 1.3, cy + Math.sin(a1) * r * 1.3, cx + Math.cos(ang + dir * 2.4) * r * 1.02, cy + Math.sin(ang + dir * 2.4) * r * 1.02);
      c.stroke();
    }
    const g = c.createRadialGradient(x, y, 0, x, y, k * 1.3);
    g.addColorStop(0, '#05070f'); g.addColorStop(0.75, '#05070fdd'); g.addColorStop(1, '#05070f00');
    c.fillStyle = g; rond(c, x, y, k * 1.3); c.fill();
    // deux petites lueurs
    const cligne = (Math.sin(t / 1300) > 0.97) ? 0.2 : 1;
    const perp = ang + Math.PI / 2;
    c.fillStyle = 'rgba(255,170,60,' + (0.55 + 0.12 * menace) + ')';
    c.shadowColor = '#ffaa3c'; c.shadowBlur = 10;
    for (const sgn of [-1, 1]) {
      const ex = x + Math.cos(perp) * k * 0.28 * sgn - Math.cos(ang) * k * 0.1, ey = y + Math.sin(perp) * k * 0.28 * sgn - Math.sin(ang) * k * 0.1;
      c.beginPath(); c.ellipse(ex, ey, k * 0.07, k * 0.045 * cligne, ang, 0, Math.PI * 2); c.fill();
    }
    c.restore();
  }

  // L'écran du sonar. opt : { t, sc, u (0 à 1, avancement), mode, encre, rapide }
  //  mode 'obs'   : la scène s'allume au fil de u (échos, faux échos, encre, rotations) ;
  //  mode 'final' : la scène à la fin (échos réels à leur place finale) ;
  //  mode 'panne' : neige et voyant qui clignote ;
  //  mode 'veille' : faisceau seul.
  function dessinerSonar(c, cx, cy, r, opt) {
    const t = opt.t;
    c.save();
    // fond de l'écran
    const g = c.createRadialGradient(cx, cy, r * 0.1, cx, cy, r);
    g.addColorStop(0, '#05301f'); g.addColorStop(1, '#021710');
    rond(c, cx, cy, r); c.fillStyle = g; c.fill();
    c.save();
    rond(c, cx, cy, r); c.clip();
    // cercles et secteurs
    c.strokeStyle = 'rgba(61,255,160,.22)'; c.lineWidth = 1.2;
    for (let i = 1; i <= 3; i++) { rond(c, cx, cy, r * i / 3.2); c.stroke(); }
    c.strokeStyle = 'rgba(61,255,160,.35)'; c.lineWidth = 1.6;
    for (let i = 0; i < 4; i++) {
      const a = rad(45 + i * 90);
      c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); c.stroke();
    }
    // faisceau qui tourne
    const vit = opt.mode === 'veille' ? 2600 : 1500;
    const ab = (t / vit) * Math.PI * 2;
    for (let i = 0; i < 18; i++) {
      c.beginPath(); c.moveTo(cx, cy);
      c.arc(cx, cy, r, ab - rad(i * 2.4) - rad(2.4), ab - rad(i * 2.4));
      c.closePath();
      c.fillStyle = 'rgba(61,255,160,' + (0.2 * (1 - i / 18)) + ')';
      c.fill();
    }
    const s = r * 0.085;
    if (opt.mode === 'panne') {
      // neige de l'écran mort
      c.fillStyle = 'rgba(160,220,200,.16)';
      for (let i = 0; i < 160; i++) c.fillRect(cx - r + Math.random() * r * 2, cy - r + Math.random() * r * 2, 2, 2);
      // voyant
      const on = opt.voyant || 0;
      rond(c, cx, cy, r * 0.2); c.fillStyle = '#0a1a14'; c.fill();
      c.lineWidth = 4; c.strokeStyle = '#2d4a3c'; c.stroke();
      if (on > 0) {
        c.save(); c.shadowColor = opt.gresil ? '#b5d8e6' : '#ffe28a'; c.shadowBlur = 30 * on;
        rond(c, cx, cy, r * (0.14 + (opt.monte || 0) * 0.06)); c.fillStyle = opt.gresil ? 'rgba(181,216,230,' + on + ')' : 'rgba(255,226,138,' + on + ')'; c.fill();
        c.restore();
      }
    } else if (opt.sc && (opt.mode === 'obs' || opt.mode === 'final')) {
      const u = opt.mode === 'final' ? 2 : opt.u;
      opt.sc.ec.forEach((x) => {
        if (opt.mode === 'final' && x.x) return;
        if (u < x.t) return;
        const age = u - x.t;
        if (x.x && age > 0.12) return;
        let an = x.an;
        if (x.m) an = x.an + x.m * Math.min(1, opt.mode === 'final' ? 1 : age / 0.3);
        const px = cx + Math.cos(rad(an)) * x.r * r, py = cy + Math.sin(rad(an)) * x.r * r;
        let alpha = 1;
        if (x.x) alpha = (Math.sin(t / 45) > 0 ? 0.9 : 0.35) * (1 - age / 0.12);
        const lueur = opt.mode === 'obs' ? Math.max(0, 1 - age * (opt.rapide ? 6 : 3.5)) : 0;
        dessinerEcho(c, x.f, px, py, s, alpha, !!x.x, lueur);
        // traînée d'un écho qui tourne
        if (x.m && opt.mode === 'obs' && age < 0.36) {
          c.save(); c.strokeStyle = 'rgba(125,255,196,.35)'; c.lineWidth = 3; c.setLineDash([4, 6]);
          c.beginPath(); c.arc(cx, cy, x.r * r, rad(Math.min(x.an, an)), rad(Math.max(x.an, an))); c.stroke(); c.restore();
        }
      });
      if (opt.mode === 'obs' && opt.sc.enc && !opt.rapide) {
        const e = opt.sc.enc;
        if (u >= e.t0 - 0.05 && u <= e.t1 + 0.05) {
          const a = Math.min(1, (u - e.t0 + 0.05) / 0.07, (e.t1 + 0.05 - u) / 0.07);
          dessinerEncre(c, cx, cy, r, e.q, Math.max(0, a), t);
        }
      }
    }
    c.restore();
    // bord de l'écran
    rond(c, cx, cy, r); c.lineWidth = Math.max(4, r * 0.05); c.strokeStyle = '#1a3a32'; c.stroke();
    rond(c, cx, cy, r + Math.max(2, r * 0.025)); c.lineWidth = 2; c.strokeStyle = '#3d6b5a'; c.stroke();
    // centre : le sous-marin
    if (opt.mode !== 'panne') {
      c.fillStyle = '#7dffc4';
      c.beginPath(); c.ellipse(cx, cy, s * 0.9, s * 0.45, 0, 0, Math.PI * 2); c.fill();
      c.fillRect(cx - s * 0.2, cy - s * 0.75, s * 0.4, s * 0.4);
    }
    c.restore();
  }

  // Main qui montre le geste (tutoriels).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#0b1928'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    c.beginPath(); c.ellipse(-14, 30, 5, 9, -0.6, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // Écran titre : épave au fond, faisceau du sonar, silhouette lointaine, bulles.
  let neige = null;
  function dessinerTitre(t) {
    const cv = $('fond');
    const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    t = t || 0;
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#0b3550'); g.addColorStop(0.35, '#061a2c'); g.addColorStop(1, '#010409');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    // rayons de lumière venus de très haut
    c.save();
    for (let i = 0; i < 5; i++) {
      const x = w * (0.15 + i * 0.18) + Math.sin(t / 3000 + i) * 12;
      const gr = c.createLinearGradient(0, 0, 0, h * 0.7);
      gr.addColorStop(0, 'rgba(140,220,255,.10)'); gr.addColorStop(1, 'rgba(140,220,255,0)');
      c.fillStyle = gr;
      c.beginPath(); c.moveTo(x - 18, 0); c.lineTo(x + 18, 0); c.lineTo(x + 70, h * 0.7); c.lineTo(x - 30, h * 0.7); c.closePath(); c.fill();
    }
    c.restore();
    // neige marine
    if (!neige) { neige = []; for (let i = 0; i < 90; i++) neige.push({ x: Math.random(), y: Math.random(), r: 0.5 + Math.random() * 1.6, v: 0.004 + Math.random() * 0.01 }); }
    c.fillStyle = 'rgba(200,235,255,.45)';
    neige.forEach((p) => { const y = (p.y + t / 1000 * p.v) % 1; rond(c, p.x * w, y * h, p.r); c.fill(); });
    const cx = w / 2, cy = h * 0.42, R = Math.min(w * 0.46, h * 0.27);
    // grande silhouette lointaine, tentacules, deux lueurs
    c.save();
    c.globalAlpha = 0.85;
    const mx = cx + Math.sin(t / 4000) * R * 0.1, my = cy - R * 0.62;
    const gm = c.createRadialGradient(mx, my, 0, mx, my, R * 0.75);
    gm.addColorStop(0, '#000208'); gm.addColorStop(0.7, '#020612cc'); gm.addColorStop(1, '#02061200');
    c.fillStyle = gm; rond(c, mx, my, R * 0.75); c.fill();
    c.strokeStyle = '#010309'; c.lineCap = 'round';
    for (let i = 0; i < 7; i++) {
      const dx = (i - 3) * R * 0.2;
      c.lineWidth = R * (0.09 - Math.abs(i - 3) * 0.01);
      c.beginPath(); c.moveTo(mx + dx * 0.4, my + R * 0.2);
      c.bezierCurveTo(mx + dx, my + R * 0.6, mx + dx * 1.6 + Math.sin(t / 900 + i) * R * 0.08, my + R * 0.85, mx + dx * 2.1, my + R * (1.1 + (i % 2) * 0.15));
      c.stroke();
    }
    c.fillStyle = 'rgba(255,170,60,.85)'; c.shadowColor = '#ffaa3c'; c.shadowBlur = 16;
    c.beginPath(); c.ellipse(mx - R * 0.12, my - R * 0.05, R * 0.035, R * 0.018, 0.15, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(mx + R * 0.12, my - R * 0.05, R * 0.035, R * 0.018, -0.15, 0, Math.PI * 2); c.fill();
    c.restore();
    // onde du sonar
    const ph = (t / 2600) % 1;
    for (let i = 0; i < 3; i++) {
      const p = (ph + i / 3) % 1;
      c.strokeStyle = 'rgba(61,255,160,' + (0.45 * (1 - p)) + ')'; c.lineWidth = 3;
      c.beginPath(); c.ellipse(cx, cy + R * 0.25, R * 1.25 * p, R * 0.45 * p, 0, 0, Math.PI * 2); c.stroke();
    }
    // fond rocheux
    c.fillStyle = '#03080e';
    c.beginPath(); c.moveTo(0, h); c.lineTo(0, cy + R * 0.55);
    for (let i = 0; i <= 10; i++) c.lineTo(w * i / 10, cy + R * (0.45 + ((i * 37) % 7) * 0.035));
    c.lineTo(w, h); c.closePath(); c.fill();
    // épave du sous-marin, penchée
    c.save();
    c.translate(cx, cy + R * 0.33); c.rotate(-0.12);
    const L = R * 1.15, H = R * 0.34;
    const gs = c.createLinearGradient(0, -H, 0, H);
    gs.addColorStop(0, '#3a5566'); gs.addColorStop(1, '#0d1a22');
    c.fillStyle = gs;
    c.beginPath(); c.ellipse(0, 0, L / 2, H / 2, 0, 0, Math.PI * 2); c.fill();
    rr(c, -L * 0.12, -H * 0.95, L * 0.24, H * 0.6, 8); c.fill();
    c.fillRect(-L * 0.02, -H * 1.35, L * 0.03, H * 0.45);
    c.strokeStyle = '#0a141b'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(L * 0.5, 0); c.lineTo(L * 0.6, -H * 0.4); c.lineTo(L * 0.6, H * 0.4); c.closePath(); c.fillStyle = '#1b2c38'; c.fill();
    // quatre hublots allumés : les quatre cabines
    COUL.forEach((col, i) => {
      const hx = -L * 0.3 + i * L * 0.2;
      const flick = 0.7 + 0.3 * Math.sin(t / (400 + i * 130) + i);
      c.save(); c.shadowColor = col; c.shadowBlur = 18 * flick;
      rond(c, hx, H * 0.02, H * 0.15); c.fillStyle = col; c.globalAlpha = flick; c.fill();
      c.restore();
      rond(c, hx, H * 0.02, H * 0.15); c.lineWidth = 3; c.strokeStyle = '#d9b46a'; c.stroke();
    });
    c.restore();
    // bulles qui montent
    c.strokeStyle = 'rgba(200,240,255,.5)'; c.lineWidth = 1.5;
    for (let i = 0; i < 12; i++) {
      const p = ((t / 6000) + i / 12) % 1;
      const bx = cx - R * 0.35 + (i % 4) * R * 0.22 + Math.sin(p * 9 + i) * 6, by = cy + R * 0.3 - p * h * 0.5;
      rond(c, bx, by, 2 + (i % 3) * 1.5); c.stroke();
    }
  }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (parcours de 20 niveaux) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // partie solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)
  let attenteTuto = false;
  let finAnticipee = false;   // solo : ta cabine est noyée, la plongée s'arrête
  // Observation du sonar par le joueur de l'appareil.
  let obs = { nq: -1, ecoule: 0, duree: 0, fini: true, rapide: false, sonnes: {} };
  // Dernier résultat montré (réponse juste ou fausse) : { siege, ok, q, r, jusqua, moi }
  let resultat = null;
  const radio = [];           // journal radio (dernières lignes)
  let geo = null;
  let crAngle = 0, crVise = 0;
  let secousse = 0;
  let dernierCoeur = 0;
  let cleePanneau = '';

  // ---------------------------------------------------------------------
  //  Écrans
  // ---------------------------------------------------------------------

  let rafTitre = 0;
  function boucleTitre(t) {
    rafTitre = 0;
    if (ecran === 'jeu') return;
    dessinerTitre(t);
    rafTitre = requestAnimationFrame(boucleTitre);
  }

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'journaux', 'combis', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'titre' ? 'block' : 'none';
    if (nom === 'titre') { majTitre(); if (!rafTitre) rafTitre = requestAnimationFrame(boucleTitre); }
    if (nom === 'jeu') relancerBoucle();
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    el.classList.toggle('haut', salonOuvert() || $('voile-fin').classList.contains('actif') || ecran === 'jeu');
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  function ajouterRadio(texte) {
    radio.unshift(texte);
    radio.length = Math.min(radio.length, 2);
    const boite = $('radio');
    boite.textContent = '';
    radio.forEach((l) => { const d = document.createElement('div'); d.textContent = l; boite.appendChild(d); });
  }
  function viderRadio() { radio.length = 0; $('radio').textContent = ''; }

  // Cartes des 4 cabines, en haut de l'écran.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'casque'; cv.width = 88; cv.height = 88;
      const tag = document.createElement('span'); tag.className = 'tag';
      const air = document.createElement('span'); air.className = 'air';
      const jauge = document.createElement('div'); jauge.className = 'jauge'; jauge.appendChild(document.createElement('div'));
      const bruit = document.createElement('div'); bruit.className = 'bruit';
      for (let k = 0; k < 3; k++) { const b = document.createElement('span'); b.style.height = (5 + k * 3.5) + 'px'; bruit.appendChild(b); }
      const pot = document.createElement('span'); pot.className = 'pot';
      const fus = document.createElement('span'); fus.className = 'fus';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 26, 24, 22);
      d.append(cv, tag, air, jauge, bruit, pot, fus, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 104; cv.height = 104;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  // Le rôle d'une place : toi, un vrai joueur ou un robot.
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : « Toi », le pseudo d'un vrai joueur en ligne
  // (partie.sieges()[s].nom, donné par le serveur), sinon le nom de la cabine.
  function nomDe(s) {
    const info = siegesActuels()[s] || {};
    if (info.moi) return tr('place.toi');
    if (info.humain && info.nom) return info.nom;
    return tr('cabine.' + s);
  }
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    if (tag.dataset.role === role && tag.dataset.nom === nom) return;
    tag.dataset.role = role;
    tag.dataset.nom = nom;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = nom;
    tag.appendChild(txt);
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !e.fini ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const air = e ? e.air[s] : (NIVEAUX[niveau - 1] || NIVEAUX[0]).a;
      const noyee = !!(e && e.mo[s]);
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('noyee', noyee);
      const role = roleDe(info);
      const nom = role === 'toi' ? tr('place.toi') : role === 'joueur' && info.nom ? info.nom : tr('cabine.' + s);
      remplirTag(d.querySelector('.tag'), role, nom);
      const cle = (info.moi ? 'm' + prog.combi : 'a') + (noyee ? 'n' : '');
      const cv = d.querySelector('canvas.casque');
      if (cv.dataset.cle !== cle) {
        cv.dataset.cle = cle;
        const cc = cv.getContext('2d'), k = couleursPlace(s, !!info.moi);
        cc.clearRect(0, 0, 88, 88);
        casque(cc, k.c, k.v, 44, 44, 42, { bord: k.bord, noyee: noyee });
      }
      const airEl = d.querySelector('.air');
      const texteAir = nb(air);
      if (airEl.dataset.v !== texteAir) { airEl.dataset.v = texteAir; airEl.innerHTML = ICONE_BULLE; const sp = document.createElement('span'); sp.textContent = texteAir; airEl.appendChild(sp); }
      d.querySelector('.jauge > div').style.width = Math.min(100, air / 10 * 100) + '%';
      const br = e ? e.br[s] : 0;
      d.querySelectorAll('.bruit span').forEach((b, k) => b.classList.toggle('oui', k < br));
      const pot = d.querySelector('.pot');
      const montrePot = e && s === tour && e.pot > 0;
      pot.classList.toggle('vu', !!montrePot);
      if (montrePot) pot.textContent = '+' + nb(e.pot);
      const fu = e ? e.fu[s] : 0;
      d.querySelector('.fus').textContent = fu > 0 ? '✦'.repeat(Math.min(3, fu)) : '';
      d.setAttribute('aria-label', tr('place.aria', { nom: nom, cabine: tr('cabine.' + s), air: air, bruit: br }) + (noyee ? ' · ' + tr('place.noyee') : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || e.fini) return '';
    if (partie.siege < 0) return tr('multi.attente');
    if (e.mo[partie.siege]) return tr('tour.noye');
    const s = R.aQui(e);
    if (s === partie.siege) {
      if (e.ph === 'c') return tr('tour.choix');
      return obs.nq === e.nq && !obs.fini ? tr('tour.observe') : tr('tour.toi');
    }
    return tr('tour.nom', { nom: nomDe(s) });
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if (vue && !vue.fini) info += ' · ' + tr('jeu.tourTable', { n: Math.min(vue.rd, vue.cfg.t), total: vue.cfg.t });
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majPanneau();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fini) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Panneau du bas : question, réponses, choix
  // ---------------------------------------------------------------------

  // Texte d'une question.
  function texteQuestion(q) {
    const base = q.pn ? q.ty.slice(1) : q.ty;
    if (q.pn) {
      if (base === 'nbf') return tr('q.pnbf', { forme: tr('forme.pl.' + q.a) });
      return tr('q.p' + base);
    }
    if (base === 'dir') return tr('q.dir.' + q.a);
    if (base === 'ou') return tr('q.ou.' + q.a);
    if (base === 'nbf') return tr('q.nbf', { forme: tr('forme.pl.' + q.a) });
    if (base === 'dd') return tr('q.dd.' + q.b, { forme: tr('forme.pl.' + q.a) });
    return tr('q.' + base);
  }
  function genreReponse(q) {
    const base = q.pn ? q.ty.slice(1) : q.ty;
    if (base === 'der' || base === 'pre') return 'forme';
    if (base === 'ou' || base === 'max') return 'secteur';
    return 'nombre';
  }
  function libelleReponse(q, i) {
    const g = genreReponse(q), v = q.o[i];
    if (g === 'forme') return tr('forme.' + v);
    if (g === 'secteur') return tr('secteur.' + v);
    return nb(v);
  }

  function remplirReponses(q, opts) {
    const boite = $('reponses');
    boite.textContent = '';

      b.className = 'rep' + (q.val > 1 && q.ty.indexOf('dd') >= 0 ? ' doree' : '');

  function afficherVoix(q) {

  // Met le panneau à jour (seulement quand ce qu'il doit montrer change).
  function majPanneau() {
    const e = vue;
    let mode = 'vide';
    const maintenant = performance.now();
    if (resultat && maintenant < resultat.jusqua) mode = 'res';
    else if (e && partie && partie.phase === 'jeu' && !e.fini && !attenteTuto && partie.siege >= 0 && R.aQui(e) === partie.siege && !e.mo[partie.siege]) {
      if (e.ph === 'c') mode = 'choix';
      else if (obs.nq === e.nq && !obs.fini) mode = 'obs';
      else if (obs.nq === e.nq && obs.fini) mode = 'rep';
      else mode = 'attente';
    } else if (e && partie && partie.phase === 'jeu' && !e.fini) mode = 'autre';
    const cle = mode + '|' + (e ? e.nq + '|' + e.ph + '|' + e.pot + '|' + e.fu.join() + '|' + (e.q ? e.q.fu : '') : '') + '|' + (resultat ? resultat.id : '') + '|' + (mode === 'autre' ? R.aQui(e) : '') + '|' + I18N.getLang();
    if (cle === cleePanneau) return;
    cleePanneau = cle;
    const qt = $('q-texte');
    qt.classList.remove('doree');
    $('obs').classList.toggle('vu', mode === 'obs');
    $('choix').classList.toggle('vu', mode === 'choix');
    $('btn-fusee').classList.remove('vu');
    afficherVoix(null);
    $('reponses').textContent = '';
    qt.textContent = '';
    if (mode === 'obs') {
      $('obs-texte').textContent = tr(e.q.pn ? 'obs.panne' : 'obs.regarde');
    } else if (mode === 'rep') {
      qt.textContent = texteQuestion(e.q);
      if (e.q.val > 1) { qt.classList.add('doree'); qt.textContent += ' ' + tr('q.bonus', { n: e.q.val }); }
      remplirReponses(e.q, { actif: true });
      afficherVoix(e.q);
      if (e.fu[partie.siege] > 0 && !e.q.fu) {
        $('btn-fusee').classList.add('vu');
        $('btn-fusee-texte').textContent = tr('fusee.bouton', { n: e.fu[partie.siege] });
      }
      const premier = $('reponses').querySelector('button');
      if (premier && clavierActif) try { premier.focus({ preventScroll: true }); } catch (er) { /* rien */ }
    } else if (mode === 'choix') {
      $('choix-texte').textContent = tr('choix.juste', { n: e.pot });
      $('btn-continuer').textContent = tr('choix.continuer');
      $('btn-passer').textContent = tr('choix.passer', { n: e.pot });
      $('choix-aide').textContent = e.k >= 2 ? tr('choix.aideBonus') : tr('choix.aide');
      if (clavierActif) try { $('btn-passer').focus({ preventScroll: true }); } catch (er) { /* rien */ }
    } else if (mode === 'res') {
      const r = resultat;
      qt.textContent = (r.moi ? '' : nomDe(r.siege) + ' · ') + texteQuestion(r.q);
      remplirReponses(r.q, { resultat: r });
    } else if (mode === 'attente') {
      qt.textContent = tr('tour.prepare');
    } else if (mode === 'autre') {
      qt.textContent = tr('tour.observeAutre', { nom: nomDe(R.aQui(e)) });
    }
  }

  // ---------------------------------------------------------------------
  //  Actions du joueur
  // ---------------------------------------------------------------------

  let dernierAttends = 0;
  function peutAgir() {
    return partie && !enPause && !attenteTuto && vue && !vue.fini && partie.monTour();
  }
  function repondre(i) {
    if (!peutAgir() || vue.ph !== 'q' || !obs.fini || obs.nq !== vue.nq) return;
    if (resultat && performance.now() < resultat.jusqua) return;
    sons.clic();
    partie.jouer({ r: i });
  }
  function tirerFusee() {
    if (!peutAgir() || vue.ph !== 'q' || !obs.fini || vue.fu[partie.siege] <= 0 || vue.q.fu) return;
    audio();
    partie.jouer({ f: 1 });
  }
  function choisir(cont) {
    if (!peutAgir() || vue.ph !== 'c') return;
    audio(); sons.clic();
    partie.jouer({ c: cont ? 1 : 0 });
  }

  // Début de l'observation (le sonar s'allume pour toi).
  function commencerObservation(rapide) {
    const q = vue.q;
    obs = { nq: vue.nq, ecoule: 0, duree: rapide ? 2400 : q.v, fini: false, rapide: !!rapide, sonnes: {}, panne: !!q.pn, sc: q.sc };
    sons.ping(0);
    cleePanneau = '';
    majInterface();
  }

  function verifierTour() {
    if (!vue || !partie || partie.phase !== 'jeu' || vue.fini || attenteTuto || enPause) return;
    if (!partie.monTour() || vue.ph !== 'q') return;
    if (resultat && performance.now() < resultat.jusqua) return;
    if (obs.nq !== vue.nq) commencerObservation(false);
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    // observation
    if (!obs.fini && vue && obs.nq === vue.nq) {
      obs.ecoule += dt * 1000;
      const u = obs.ecoule / obs.duree;
      obs.sc.ec.forEach((x, i) => {
        const tx = x.t;
        if (u >= tx && !obs.sonnes[i]) {
          obs.sonnes[i] = 1;
          if (obs.panne) { if (x.x) sons.gresil(); else sons.signal(x.f); }
          else if (!x.x) sons.ping(x.f);
        }
      });
      $('obs-barre').style.transform = 'scaleX(' + Math.max(0, 1 - u).toFixed(3) + ')';
      if (u >= 1) { obs.fini = true; sons.tour(); cleePanneau = ''; majInterface(); }
    }
    verifierTour();
    if (resultat && resultat.jusqua && performance.now() >= resultat.jusqua && !resultat.vu) { resultat.vu = true; cleePanneau = ''; majInterface(); }
    // battement de cœur quand l'air manque
    if (vue && partie && partie.siege >= 0 && !vue.fini && !vue.mo[partie.siege] && vue.air[partie.siege] <= 2 && t - dernierCoeur > 1150) { dernierCoeur = t; sons.coeur(); }
    dessinerJeu(t, dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('sonar'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); geo = null; }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    const r = Math.max(40, Math.min(w, h) / 2 - 24);
    let cx = w / 2, cy = h / 2;
    if (!geo || geo.w !== w || geo.h !== h) {
      geo = { w: w, h: h };
      [[0, -1], [1, 0], [0, 1], [-1, 0]].forEach((d, i) => {
        const el = $('card-' + i);
        el.style.left = (cx + d[0] * (r + 12)) + 'px';
        el.style.top = (cy + d[1] * (r + 12)) + 'px';
      });
    }
    if (secousse > 0) { secousse = Math.max(0, secousse - dt); const k = secousse * 22; cx += (Math.random() - 0.5) * k; cy += (Math.random() - 0.5) * k; }
    // la créature rôde : plus vite quand le bruit monte
    const menace = vue ? Math.max.apply(null, vue.br) : 0;
    crAngle += dt * (0.12 + menace * 0.12);
    dessinerCreature(c, cx, cy, r, crAngle + crVise, menace, t);
    const opt = { t: t, mode: 'veille' };
    if (resultat && performance.now() < resultat.jusqua && resultat.sc) { opt.mode = resultat.sc.panne ? 'veille' : 'final'; opt.sc = resultat.sc; }
    else if (vue && !obs.fini && obs.nq === vue.nq) {
      const u = obs.ecoule / obs.duree;
      if (obs.panne) {
        opt.mode = 'panne';
        // voyant : impulsions du signal de l'écho en cours
        let on = 0, gres = false, monte = 0;
        obs.sc.ec.forEach((x) => {
          const dtx = (u - x.t) * obs.duree / 1000;
          if (dtx < 0 || dtx > 0.7) return;
          if (x.x) { if (dtx < 0.3) { on = Math.max(on, Math.random() > 0.4 ? 0.8 : 0.2); gres = true; } return; }
          (SIGNAUX[x.f] || SIGNAUX[0]).forEach((p) => { if (dtx >= p[0] && dtx <= p[0] + p[1]) { on = 1; if (x.f === 4) monte = (dtx - p[0]) / p[1]; } });
        });
        opt.voyant = on; opt.gresil = gres && on < 1; opt.monte = monte;
      } else { opt.mode = 'obs'; opt.sc = obs.sc; opt.u = u; opt.rapide = obs.rapide; }
    }
    dessinerSonar(c, cx, cy, r, opt);
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = role === 'toi' ? tr('place.toi') : nomPlace(info, role);
      const cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + prog.combi;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 104, 104);
        const k = couleursPlace(s, !!info.moi);
        casque(c, k.c, k.v, 52, 58, 44, { bord: k.bord });
        if (info.chef) couronne(c, 52, 16, 22);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { cabine: tr('cabine.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomChef ? nomChef + ' · ' + tr('cabine.' + partie.chef) : tr('cabine.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    obs = { nq: -1, ecoule: 0, duree: 0, fini: true, rapide: false, sonnes: {} };
    resultat = null;
    cleePanneau = '';
    finAnticipee = false;
    debutTour = Date.now();
    dernierTic = -1;
    viderRadio();
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    ajouterRadio(tr('radio.depart', { n: vue.cfg.t }));
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function secouerCabine(s) {
    const d = $('place-' + s);
    d.classList.remove('frappe'); void d.offsetWidth; d.classList.add('frappe');
  }
  function rebondCabine(s) {
    const d = $('place-' + s);
    d.classList.remove('bond'); void d.offsetWidth; d.classList.add('bond');
  }

  function surAction(ev) {
    const avant = ev.avant, apres = ev.apres, a = ev.action, s = ev.siege;
    vue = JSON.parse(JSON.stringify(apres));
    debutTour = Date.now();
    dernierTic = -1;
    const qui = nomDe(s);
    if (a.f === 1) {
      sons.fusee();
      ajouterRadio(tr('radio.fusee', { nom: qui }));
      if (ev.moi) { obs = { nq: vue.nq, ecoule: 0, duree: vue.q.pn ? Math.round(vue.q.v * 0.75) : 2400, fini: false, rapide: true, sonnes: {}, panne: !!vue.q.pn, sc: vue.q.sc }; cleePanneau = ''; }
      bulles(s, 6, '#ffe28a');
    } else if (Number.isInteger(a.r)) {
      const q = avant.q, ok = a.r === q.bon;
      resultat = { id: (resultat ? resultat.id : 0) + 1, siege: s, ok: ok, q: q, r: a.r, bon: q.bon, moi: ev.moi, sc: q.pn ? { panne: 1 } : q.sc, jusqua: performance.now() + (ev.moi ? 1500 : 900) };
      if (ok) {
        sons.juste();
        rebondCabine(s);
        bulles(s, 4 + q.val * 2, '#7dffc4');
        ajouterRadio(tr('radio.juste', { nom: qui, n: avant.pot + q.val }));
        if (apres.der && apres.der.mis) { sons.bulles(apres.der.mis); ajouterRadio(tr('radio.quatre', { nom: qui, n: apres.der.mis })); }
      } else {
        sons.faux();
        secousse = Math.max(secousse, 0.2);
        ajouterRadio(tr(avant.pot > 0 ? 'radio.fauxPerdu' : 'radio.faux', { nom: qui, n: avant.pot }));
        if (ev.moi && !apres.der.frappe) toast(tr('toast.bruit'), 2000);
      }
    } else if (a.c === 1) {
      ajouterRadio(tr('radio.continue', { nom: qui }));
    } else if (a.c === 0) {
      sons.bulles(avant.pot);
      bulles(s, 6 + avant.pot * 2, '#9fe8ff');
      rebondCabine(s);
      ajouterRadio(tr('radio.passe', { nom: qui, n: avant.pot }));
    }
    // Frappe de la créature (bruit trop fort ou fin du tour de table).
    const nAv = avant.cr ? avant.cr.n : 0, nAp = apres.cr ? apres.cr.n : 0;
    if (nAp > nAv) {
      const c = apres.cr.p;
      sons.frappe();
      setTimeout(() => sons.grondement(), 300);
      secousse = 0.6;
      secouerCabine(c);
      const fl = $('flash'); fl.classList.remove('actif'); void fl.offsetWidth; fl.classList.add('actif');
      ajouterRadio(tr('radio.frappe', { cabine: nomDe(c), n: apres.cr.d }));
      if (c === partie.siege) toast(tr('toast.frappe', { n: apres.cr.d }), 2200);
    }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (apres.rd > avant.rd && !apres.fini) ajouterRadio(tr('radio.respire', { n: apres.rd, total: apres.cfg.t }));
    for (let k = 0; k < PLACES; k++) {
      if (apres.mo[k] && !avant.mo[k]) {
        setTimeout(() => sons.noyee(), 500);
        ajouterRadio(tr('radio.noyee', { cabine: nomDe(k) }));
        if (k === partie.siege) {
          toast(tr('toast.noyee'), 3000);
          // Solo : ta cabine est noyée, la plongée est perdue tout de suite.
          if (session === 'solo' && !apres.fini) finSolo();
        }
      }
    }
    if (partie.phase === 'jeu' && !apres.fini && R.aQui(vue) === partie.siege && !ev.moi && avant.tour !== apres.tour) sons.tour();
    cleePanneau = '';
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    if (finAnticipee) return;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin(partie.etat);
    }, 1300);
  }

  // Solo : ta cabine est noyée avant la fin, la plongée s'arrête.
  function finSolo() {
    finAnticipee = true;
    enPartie = false;
    const j = jeton, e = JSON.parse(JSON.stringify(vue));
    try { partie.pause(true); } catch (er) { /* rien */ }
    setTimeout(() => { if (j === jeton && partie) afficherFin(e); }, 1500);
  }

  function gagnePour(e, moi) {
    if (moi < 0 || !O.enVie(e, moi)) return false;
    let haut = -1;
    for (let s = 0; s < PLACES; s++) if (O.enVie(e, s)) haut = Math.max(haut, e.air[s]);
    return e.air[moi] === haut;
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;

    const gagne = gagnePour(e, moi);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });

      qui.appendChild(nom);

    });

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);

    return b;

  function afficherFin(e) {
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const gagne = gagnePour(e, moi);
    const air = moi >= 0 ? e.air[moi] : 0;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? (e.mo[moi] ? tr('fin.noyeeToi') : tr('fin.air', { n: air })) : '';
    $('fin-journal').textContent = '';
    $('fin-combi').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = O.etoiles(e, moi, gagne);
      const ancienRecord = prog.records[i];
      const record = !e.mo[moi] && air > ancienRecord;
      if (record) prog.records[i] = air;
      if (gagne) {
        const premiere = prog.etoiles[i] === 0;
        const avantTotal = totalEtoiles();
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) prog.debloque = niveau + 1;
        sauver(Math.min(niveau + 1, NIVEAUX.length), air);
        if (premiere) $('fin-journal').textContent = tr('fin.journal', { n: niveau });
        if (combisDebloquees(totalEtoiles()) > combisDebloquees(avantTotal)) $('fin-combi').textContent = tr('fin.combi');
        // Parcours solo terminé (toutes les plongées gagnées, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else if (record) sauver(niveau, air);
      $('fin-titre').textContent = gagne ? tr(niveau === NIVEAUX.length ? 'fin.dernier' : 'fin.gagne') : tr(e.mo[moi] ? 'fin.perduNoye' : 'fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : (prog.records[i] > 0 ? tr('fin.record', { n: prog.records[i] }) : '');
      $('fin-compte').textContent = gagne ? '' : tr('fin.conseil');
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); bullesFete(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (partie en ligne repassée en solo).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));

    else if ($('bandeau').classList.contains('actif')) bandeau(texte);

  // Bulles qui montent d'une cabine (bonne réponse, oxygène mis à l'abri).
  const bullesActives = [];
  let rafBulles = 0;
  function bulles(s, n, coul) {
    const d = $('place-' + s);
    if (!d || ecran !== 'jeu') return;
    const rc = d.getBoundingClientRect();
    for (let i = 0; i < n; i++) {
      bullesActives.push({ x: rc.left + rc.width / 2 + (Math.random() - 0.5) * rc.width * 0.6, y: rc.bottom, vx: (Math.random() - 0.5) * 30, vy: -60 - Math.random() * 90, r: 3 + Math.random() * 5, vie: 0.9 + Math.random() * 0.6, coul: coul });
    }
    animerBulles();
  }
  function bullesFete() {
    const w = window.innerWidth, h = window.innerHeight;
    for (let i = 0; i < 80; i++) bullesActives.push({ x: Math.random() * w, y: h + Math.random() * h * 0.3, vx: (Math.random() - 0.5) * 40, vy: -140 - Math.random() * 200, r: 4 + Math.random() * 10, vie: 2.2 + Math.random(), coul: i % 3 ? '#7dffc4' : '#ffe28a' });
    animerBulles();
  }
  function animerBulles() {
    if (rafBulles) return;
    const cv = $('bulles');
    let prec = 0;
    function pas(t) {
      const w = window.innerWidth, h = window.innerHeight;
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
      const c = cv.getContext('2d');
      const dt = prec ? Math.min(0.05, (t - prec) / 1000) : 0.016; prec = t;
      c.clearRect(0, 0, w, h);
      for (let i = bullesActives.length - 1; i >= 0; i--) {
        const b = bullesActives[i];
        b.vie -= dt; b.x += b.vx * dt + Math.sin(t / 200 + i) * 0.4; b.y += b.vy * dt;
        if (b.vie <= 0) { bullesActives.splice(i, 1); continue; }
        c.globalAlpha = Math.min(1, b.vie * 1.5);
        c.strokeStyle = b.coul; c.lineWidth = 2;
        rond(c, b.x, b.y, b.r); c.stroke();
        c.fillStyle = b.coul; rond(c, b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.25); c.fill();
      }
      c.globalAlpha = 1;
      if (bullesActives.length) rafBulles = requestAnimationFrame(pas);
      else { rafBulles = 0; c.clearRect(0, 0, w, h); }
    }
    rafBulles = requestAnimationFrame(pas);
  }

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }

  // Parcours solo : plongée n contre 3 robots.
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo' || finAnticipee) { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    finAnticipee = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = null;
    resultat = null;
    obs = { nq: -1, ecoule: 0, duree: 0, fini: true, rapide: false, sonnes: {} };
    cleePanneau = '';
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement

    partie.lancer();

  // ---------------------------------------------------------------------
  //  Tutoriels animés (3 étapes au plus, une main montre le geste)
  // ---------------------------------------------------------------------

  // Petite scène fixe pour les démonstrations.
  const DEMO = {
    ec: [{ f: 0, an: 250, r: 0.6, t: 0.05, x: 0 }, { f: 1, an: 290, r: 0.45, t: 0.3, x: 0 }, { f: 2, an: 20, r: 0.62, t: 0.55, x: 0 }],
    enc: null
  };
  // Bouton de démonstration : des points (nombre), une forme, ou une icône.
  function boutonDemo(c, x, y, w, h, contenu, etat) {
    rr(c, x - w / 2, y - h / 2, w, h, 12);
    c.fillStyle = etat === 'bon' ? '#0f5a3a' : etat === 'mauvais' ? '#5a1420' : '#0f2236'; c.fill();
    c.lineWidth = 3; c.strokeStyle = etat === 'bon' ? '#3dffa0' : etat === 'mauvais' ? '#ff5e6c' : etat === 'or' ? '#e0a52a' : '#2f6f8f'; c.stroke();
    c.fillStyle = '#e9fff6'; c.strokeStyle = '#7dffc4';
    if (contenu.points !== undefined) {
      for (let i = 0; i < contenu.points; i++) { rond(c, x - (contenu.points - 1) * 8 + i * 16, y, 5); c.fill(); }
    } else if (contenu.forme !== undefined) {
      c.lineWidth = 3.5; tracerForme(c, contenu.forme, x, y, h * 0.24); c.stroke();
    } else if (contenu.icone === 'suite') {
      c.lineWidth = 4; c.beginPath(); c.arc(x, y, h * 0.22, rad(-60), rad(220)); c.stroke();
      c.beginPath(); c.moveTo(x + h * 0.2, y - h * 0.32); c.lineTo(x + h * 0.14, y - h * 0.12); c.lineTo(x + h * 0.32, y - h * 0.12); c.closePath(); c.fillStyle = '#7dffc4'; c.fill();
    } else if (contenu.icone === 'bouteille') {
      rr(c, x - h * 0.14, y - h * 0.22, h * 0.28, h * 0.48, 6); c.fillStyle = '#9fe8ff'; c.fill();
      c.fillRect(x - h * 0.06, y - h * 0.34, h * 0.12, h * 0.14);
    } else if (contenu.icone === 'etoile') {
      c.fillStyle = '#ffe28a'; c.beginPath();
      for (let i = 0; i < 10; i++) { const a = rad(-90 + i * 36), rr2 = i % 2 ? h * 0.12 : h * 0.28; c.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
      c.closePath(); c.fill();
    }
  }
  function bullesDemo(c, x, y, p, coul) {
    c.strokeStyle = coul || '#7dffc4'; c.lineWidth = 2;
    for (let i = 0; i < 6; i++) { rond(c, x + Math.sin(i * 2.1) * 18, y - p * (40 + i * 12), 4 + (i % 3) * 2); c.stroke(); }
  }
  function ondesDemo(c, x, y, n, t) {
    c.strokeStyle = '#ff5e6c'; c.lineWidth = 3;
    for (let i = 0; i < n; i++) { c.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t / 200 + i)); c.beginPath(); c.arc(x, y, 30 + i * 9, rad(-40), rad(40)); c.stroke(); }
    c.globalAlpha = 1;
  }

  // Une image de la démonstration au temps ms (boucle de 6 s).
  function imageTuto(cle, c, ms) {
    const W = 560, H = 360;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, W, H);
    c.fillStyle = '#020a12'; c.fillRect(0, 0, W, H);
    const T = ms % 6400;
    const sx = 150, sy = 180, sr = 125;
    const bx = 410;
    if (cle === 'base') {
      // 1) le sonar s'allume ; 2) la main touche la bonne réponse ; 3) passer la main : bulles
      if (T < 2600) dessinerSonar(c, sx, sy, sr, { t: ms, mode: 'obs', sc: DEMO, u: T / 2600 });
      else dessinerSonar(c, sx, sy, sr, { t: ms, mode: 'veille' });
      if (T >= 2600) {
        const etat = T > 3600 ? 'bon' : '';
        [0, 1, 2, 3].forEach((n, i) => boutonDemo(c, bx + (i % 2 ? 60 : -60), 120 + Math.floor(i / 2) * 70, 100, 54, { points: n }, n === 2 ? etat : ''));
        if (T < 4400) main(c, bx + 60 + (1 - Math.min(1, (T - 2600) / 900)) * 80, 120 + 30 + (1 - Math.min(1, (T - 2600) / 900)) * 120, 1.3, T > 3400 && T < 3800 ? 1 : 0);
      }
      if (T >= 4400) {
        boutonDemo(c, bx - 60, 290, 100, 56, { icone: 'suite' }, '');
        boutonDemo(c, bx + 60, 290, 100, 56, { icone: 'bouteille' }, T > 5300 ? 'bon' : '');
        main(c, bx + 60, 310 + (1 - Math.min(1, (T - 4400) / 700)) * 40, 1.3, T > 5100 && T < 5500 ? 1 : 0);
        if (T > 5300) { casque(c, COMBIS[prog.combi].c, '#9fe8ff', sx, sy, 34); bullesDemo(c, sx, sy - 30, (T - 5300) / 1100); }
      }
    } else if (cle === 'bruit') {
      dessinerSonar(c, sx, sy, sr, { t: ms, mode: 'veille' });
      const cab = (i) => casque(c, COUL[i], '#9fe8ff', 340 + i * 70, 80, 28);
      for (let i = 0; i < 3; i++) cab(i);
      const n = T < 1600 ? 0 : T < 3200 ? 1 : 2;
      if (T < 1600) {
        boutonDemo(c, 420, 230, 100, 54, { points: 1 }, T > 1000 ? 'mauvais' : '');
        main(c, 430, 260, 1.3, T > 800 && T < 1200 ? 1 : 0);
      }
      ondesDemo(c, 410, 80, n, ms);
      if (T >= 3200) {
        const p = Math.min(1, (T - 3200) / 900);
        dessinerCreature(c, sx, sy, sr, rad(-30) + p * 0.6, 2, ms);
        if (T > 4100) {
          const dx = T < 4600 ? (Math.random() - 0.5) * 14 : 0;
          c.save(); c.translate(dx, 0);
          c.fillStyle = 'rgba(255,26,58,' + Math.max(0, 0.45 - (T - 4100) / 3000) + ')'; c.fillRect(300, 30, 240, 100);
          casque(c, COUL[1], '#9fe8ff', 410, 80, 28);
          c.restore();
          bullesDemo(c, 410, 140, -(T - 4100) / 1600, '#ff9aa6');
        }
      }
    } else if (cle === 'encre') {
      const u = T / 6400;
      dessinerSonar(c, W / 2, sy, 150, { t: ms, mode: 'obs', sc: { ec: DEMO.ec, enc: { q: 0, t0: 0.3, t1: 0.75 } }, u: u });
    } else if (cle === 'faux') {
      const sc = { ec: [{ f: 0, an: 250, r: 0.6, t: 0.05, x: 0 }, { f: 3, an: 30, r: 0.5, t: 0.3, x: 1 }, { f: 1, an: 120, r: 0.55, t: 0.5, x: 0 }], enc: null };
      const u = (T / 6400) * 1.4;
      dessinerSonar(c, W / 2, sy, 150, { t: ms, mode: 'obs', sc: sc, u: Math.min(1, u) });
      if (u > 0.47) {
        c.strokeStyle = '#ff5e6c'; c.lineWidth = 6; c.lineCap = 'round';
        const px = W / 2 + Math.cos(rad(30)) * 75, py = sy + Math.sin(rad(30)) * 75;
        c.beginPath(); c.moveTo(px - 22, py - 22); c.lineTo(px + 22, py + 22); c.moveTo(px + 22, py - 22); c.lineTo(px - 22, py + 22); c.stroke();
      }
    } else if (cle === 'fusee') {
      const flash = T > 2000 && T < 2600;
      if (T < 2000) dessinerSonar(c, sx, sy, sr, { t: ms, mode: 'veille' });
      else dessinerSonar(c, sx, sy, sr, { t: ms, mode: 'obs', sc: DEMO, u: Math.min(1, (T - 2000) / 2200), rapide: true });
      [0, 1, 2].forEach((f, i) => boutonDemo(c, bx, 80 + i * 66, 120, 52, { forme: f }, ''));
      boutonDemo(c, bx, 300, 120, 52, { icone: 'etoile' }, 'or');
      if (T < 2400) main(c, bx + 10, 320 + (1 - Math.min(1, T / 1200)) * 30, 1.3, T > 1600 && T < 2100 ? 1 : 0);
      if (flash) { c.fillStyle = 'rgba(255,240,190,' + (0.6 - (T - 2000) / 1000) + ')'; c.fillRect(0, 0, W, H); }
    } else if (cle === 'mobile') {
      const sc = { ec: [{ f: 2, an: 260, r: 0.65, t: 0.08, x: 0, m: 100 }, { f: 0, an: 160, r: 0.5, t: 0.2, x: 0 }], enc: null };
      const u = Math.min(1, T / 4200);
      dessinerSonar(c, W / 2, sy, 150, { t: ms, mode: T < 4200 ? 'obs' : 'final', sc: sc, u: u });
      if (T >= 4200) {
        c.strokeStyle = '#ffe28a'; c.lineWidth = 4; c.setLineDash([8, 8]);
        rond(c, W / 2 + Math.cos(rad(0)) * 97, sy + Math.sin(rad(0)) * 97, 26); c.stroke(); c.setLineDash([]);
      }
    } else if (cle === 'panne') {
      const k = Math.floor(T / 2100) % 3, dans = (T % 2100) / 1000, f = [0, 1, 3][k];
      let on = 0;
      SIGNAUX[f].forEach((p) => { if (dans >= p[0] && dans <= p[0] + p[1]) on = 1; });
      dessinerSonar(c, sx, sy, sr, { t: ms, mode: 'panne', voyant: on });
      [0, 1, 3].forEach((ff, i) => {
        boutonDemo(c, bx, 90 + i * 90, 150, 64, { forme: ff }, ff === f ? 'bon' : '');
        c.fillStyle = '#ffe28a';
        SIGNAUX[ff].forEach((p) => { rr(c, bx + 30 + p[0] * 70, 84 + i * 90, Math.max(8, p[1] * 70), 12, 6); c.fill(); });
      });
    } else if (cle === 'doree') {
      dessinerSonar(c, sx, sy, sr, { t: ms, mode: 'veille' });
      [1, 2].forEach((n, i) => boutonDemo(c, bx, 110 + i * 80, 140, 60, { points: n }, T > 2200 && n === 2 ? 'bon' : 'or'));
      if (T < 2600) main(c, bx + 10, 220 + (1 - Math.min(1, T / 1200)) * 40, 1.3, T > 1800 && T < 2300 ? 1 : 0);
      if (T > 2400) { bullesDemo(c, bx - 30, 300, (T - 2400) / 1600, '#ffe28a'); bullesDemo(c, bx + 30, 300, (T - 2600) / 1600, '#ffe28a'); }
    } else if (cle === 'voix') {
      dessinerSonar(c, sx, sy, sr, { t: ms, mode: 'veille' });
      casque(c, COUL[2], '#ffb3d1', 330, 60, 30, { lampe: '#ff8fb8' });
      // onde de voix vers un mauvais bouton
      c.strokeStyle = '#ff8fb8'; c.lineWidth = 3;
      for (let i = 0; i < 3; i++) { c.globalAlpha = 0.3 + 0.7 * Math.abs(Math.sin(ms / 250 + i)); c.beginPath(); c.arc(330, 60, 40 + i * 10, rad(-10), rad(60)); c.stroke(); }
      c.globalAlpha = 1;
      const faux = T > 1800 && T < 4000;
      boutonDemo(c, 450, 120, 120, 54, { forme: 3 }, faux ? 'mauvais' : '');
      boutonDemo(c, 450, 200, 120, 54, { forme: 1 }, T > 4600 ? 'bon' : '');
      boutonDemo(c, 450, 280, 120, 54, { forme: 0 }, '');
      if (faux) {
        dessinerCreature(c, sx, sy, sr, rad(-20), 3, ms);
        c.strokeStyle = '#ff5e6c'; c.lineWidth = 5; c.beginPath(); c.moveTo(400, 100); c.lineTo(500, 140); c.stroke();
      }
      if (T > 3600) main(c, 460, 220 + (1 - Math.min(1, (T - 3600) / 800)) * 60, 1.3, T > 4400 && T < 4800 ? 1 : 0);
    }
  }

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    let debut = 0;
    const j = ++tutoAnim;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      imageTuto(cle, c, t - debut);
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  let clavierActif = false;
  document.addEventListener('pointerdown', () => { clavierActif = false; }, true);

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    clavierActif = true;
    audio();
    const chiffres = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Numpad1: 0, Numpad2: 1, Numpad3: 2, Numpad4: 3 };
    if (vue && vue.ph === 'c' && peutAgir()) {
      if (ev.code === 'Digit1' || ev.code === 'Numpad1' || ev.code === 'KeyC') { ev.preventDefault(); choisir(true); return; }
      if (ev.code === 'Digit2' || ev.code === 'Numpad2' || ev.code === 'KeyS') { ev.preventDefault(); choisir(false); return; }
    }
    if (chiffres[ev.code] !== undefined) {
      ev.preventDefault();
      if (!peutAgir()) { if (Date.now() - dernierAttends > 1500 && partie && partie.phase === 'jeu') { dernierAttends = Date.now(); sons.non(); } return; }
      if (vue.ph === 'q' && obs.fini && chiffres[ev.code] < vue.q.o.length) repondre(chiffres[ev.code]);
      return;
    }
    if (ev.code === 'KeyF') { ev.preventDefault(); tirerFusee(); return; }
    // Flèches : passer d'un bouton à l'autre dans le panneau.
    const dirs = { ArrowLeft: -1, ArrowUp: -2, ArrowRight: 1, ArrowDown: 2 };
    if (dirs[ev.code] !== undefined) {
      const liste = Array.from($('panneau-q').querySelectorAll('button')).filter((b) => b.offsetParent && !b.disabled);
      if (!liste.length) return;
      ev.preventDefault();
      let i = liste.indexOf(document.activeElement);
      const pas = Math.abs(dirs[ev.code]) === 2 ? 2 * Math.sign(dirs[ev.code]) : dirs[ev.code];
      i = i < 0 ? 0 : Math.max(0, Math.min(liste.length - 1, i + pas));
      try { liste[i].focus({ preventScroll: true }); } catch (e) { /* rien */ }
      sons.clic();
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-journaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirJournaux(); });
  $('btn-combis').addEventListener('click', () => { audio(); sons.clic(); ouvrirCombis(); });
  ['niv-retour', 'jou-retour', 'com-retour'].forEach((id) => $(id).addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); }));
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-fusee').addEventListener('click', () => tirerFusee());
  $('btn-continuer').addEventListener('click', () => choisir(true));
  $('btn-passer').addEventListener('click', () => choisir(false));
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.air[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { geo = null; });
  I18N.surChangement(() => { cleePanneau = ''; [0, 1, 2, 3].forEach((i) => { $('card-' + i).textContent = tr('secteur.court.' + i); }); majBoutonsSon(); if (partie) majInterface(); });

  document.title = tr('titre');
  [0, 1, 2, 3].forEach((i) => { $('card-' + i).textContent = tr('secteur.court.' + i); });
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
