<script>
(function () {
  'use strict';

  // =====================================================================
  //  Le Sonar des Abysses — quiz de mémoire visuelle à 4 cabines
  //  Chacun son tour : regarder le sonar, répondre, encaisser ou continuer.
  //  Solo : 20 plongées contre 3 robots. En ligne : de vrais joueurs
  //  remplacent les robots (moteur commun JEL_MULTI). Règles : jel-regles.
  // =====================================================================

  const JEU = 'le-sonar-des-abysses';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = R.niveaux;               // mêmes données que les règles
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);

  // Une couleur par cabine : 0 jade, 1 corail, 2 lilas, 3 ambre.
  const COUL = ['#3fe0c8', '#ff8a3d', '#b98cff', '#ffd34d'];
  const PHOS = '#5dffb0';                    // vert phosphore du sonar
  // Combinaisons : couleur du casque et étoiles nécessaires.
  const COMBIS = [
    { c: '#c99a4a', f: '#7a5718', v: 0 },     // laiton
    { c: '#b0583a', f: '#5e2614', v: 8 },     // rouille
    { c: '#2f4f8f', f: '#152a52', v: 16 },    // abysse
    { c: '#ff7f9a', f: '#9a2f48', v: 26 },    // corail
    { c: '#7dffb5', f: '#1d7a4c', v: 38 },    // phosphore
    { c: '#d5dde6', f: '#6c7b8a', v: 50 }     // titane
  ];
  const JOURNAUX = 10;                       // un journal toutes les 2 plongées gagnées

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#03121a"/><circle cx="10.4" cy="8" r="1.6" fill="#03121a"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#03121a"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';
  // Grappe de bulles (oxygène) : trois bulles pleines, pour ne pas la confondre avec un zéro.
  const ICONE_BULLE = '<svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="5" cy="9" r="4" fill="currentColor"/><circle cx="10.5" cy="5" r="2.8" fill="currentColor" opacity=".8"/><circle cx="6.5" cy="2.4" r="1.6" fill="currentColor" opacity=".6"/><circle cx="3.8" cy="7.8" r="1.2" fill="#fff" opacity=".7"/></svg>';

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = { etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, tutos: [], combi: 0, options: { son: true } };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 99, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string' && TUTOS[x]);
      prog.combi = entier(d.combi, 0, COMBIS.length - 1, 0);
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
    if (COMBIS[prog.combi].v > totalEtoiles()) prog.combi = 0;
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.combi = 0;
  }

  function sauver(niveauReprise, score) {
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
        debloque: prog.debloque, tutos: prog.tutos.slice(), combi: prog.combi, options: { son: prog.options.son }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Réglages changés depuis l'écran titre ou le carnet : jamais de nouvelle sauvegarde là.
  function sauverReglages() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { combi: prog.combi, options: { son: prog.options.son } }); } catch (e) { /* rien */ }
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);
  const journauxLus = () => { let n = 0; for (let k = 0; k < JOURNAUX; k++) if (prog.etoiles[2 * k + 1] > 0) n++; return n; };

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null, bruitBlanc = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      const v = o.vol || 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.02, d / 4));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.vibrato) {
        const l = ac.createOscillator(), lg = ac.createGain();
        l.frequency.value = o.vibrato; lg.gain.value = f * 0.06;
        l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + d + 0.05);
      }
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      osc.connect(g); sortie.connect(ac.destination);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  // Souffle (bruit filtré) : encre, coup sur la coque, parasites.
  function souffle(d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      if (!bruitBlanc) {
        bruitBlanc = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const data = bruitBlanc.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
      const t = ac.currentTime + (o.retard || 0);
      const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = bruitBlanc; src.loop = true;
      fl.type = o.passe || 'lowpass'; fl.frequency.setValueAtTime(o.f || 600, t);
      if (o.vers) fl.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t + Math.min(0.05, d / 3));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      src.connect(fl); fl.connect(g); g.connect(ac.destination);
      src.start(t); src.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  const TONS = [196, 392, 880];
  const sons = {
    clic: () => note(700, 0.05, { type: 'triangle', vol: 0.06 }),
    ping: () => { note(1320, 0.5, { vol: 0.07 }); note(1320, 0.4, { vol: 0.03, retard: 0.22 }); },
    echo: () => note(980, 0.12, { type: 'sine', vol: 0.06, vers: 760 }),
    faux: () => { note(600, 0.18, { type: 'square', vol: 0.025, vibrato: 30, filtre: 1800 }); },
    encre: () => souffle(1.2, { f: 300, vers: 90, vol: 0.12 }),
    ton: (h) => { note(TONS[h], 0.38, { type: 'sine', vol: 0.14 }); note(TONS[h] * 2, 0.2, { type: 'sine', vol: 0.03 }); },
    bon: () => [523, 659, 784, 1047].forEach((f, i) => note(f, 0.12, { type: 'triangle', vol: 0.08, retard: i * 0.06 })),
    mauvais: () => { note(155, 0.5, { type: 'sawtooth', vol: 0.08, filtre: 700, vers: 110 }); note(164, 0.5, { type: 'sawtooth', vol: 0.06, filtre: 700, vers: 98 }); souffle(0.4, { f: 1800, passe: 'bandpass', vol: 0.06 }); },
    bulles: () => { for (let i = 0; i < 6; i++) note(500 + Math.random() * 600, 0.07, { vol: 0.05, vers: 1300, retard: i * 0.07 }); },
    approche: () => note(55, 1.4, { type: 'sawtooth', vol: 0.09, filtre: 240, vibrato: 4 }),
    coup: () => { souffle(0.6, { f: 220, vers: 60, vol: 0.5 }); note(70, 0.7, { type: 'sine', vol: 0.3, vers: 38 }); note(1900, 0.9, { type: 'sine', vol: 0.02, vibrato: 7, retard: 0.08 }); },
    noye: () => { note(330, 1.4, { type: 'triangle', vol: 0.09, vers: 70 }); souffle(1.2, { f: 900, vers: 200, vol: 0.08 }); },
    fusee: () => { souffle(0.5, { f: 900, vers: 4000, passe: 'bandpass', vol: 0.12 }); note(1600, 0.4, { vol: 0.05, retard: 0.35, vibrato: 20 }); },
    victoire: () => [392, 523, 659, 784, 1047].forEach((f, i) => note(f, 0.3, { type: 'triangle', vol: 0.1, retard: i * 0.12 })),
    defaite: () => [262, 220, 175, 131].forEach((f, i) => note(f, 0.4, { type: 'sawtooth', vol: 0.06, filtre: 900, retard: i * 0.2 })),
    tic: () => note(1250, 0.04, { type: 'square', vol: 0.03 }),
    arrive: () => { note(660, 0.12, { vol: 0.08 }); note(880, 0.16, { vol: 0.08, retard: 0.1 }); },
    part: () => { note(880, 0.12, { vol: 0.06 }); note(587, 0.16, { vol: 0.06, retard: 0.1 }); },
    tour: () => note(988, 0.1, { vol: 0.05 }),
    non: () => note(180, 0.12, { type: 'triangle', vol: 0.06 }),
    brouille: () => souffle(0.3, { f: 2500, passe: 'bandpass', vol: 0.05 })
  };

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.textContent = prog.options.son ? '🔊' : '🔇';
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    sauverReglages();
    majBoutonsSon();
    sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Dessins : outils, casques, formes du sonar, décor du titre
  // ---------------------------------------------------------------------

  function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }
  function rond(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r);
    else { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  }
  function graineHasard(g) { let a = g >>> 0; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; }

  // Casque de scaphandrier, centré en (x, y), rayon r ; anneau de la couleur de la cabine.
  function casque(c, place, x, y, r, combi) {
    const m = COMBIS[combi || 0];
    c.save();
    c.fillStyle = COUL[place]; rond(c, x, y, r); c.fill();
    c.fillStyle = '#03121a'; rond(c, x, y, r * 0.86); c.fill();
    const g = c.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r * 0.8);
    g.addColorStop(0, '#fff8'); g.addColorStop(0.25, m.c); g.addColorStop(1, m.f);
    c.fillStyle = g; rond(c, x, y + r * 0.04, r * 0.74); c.fill();
    // hublot avant
    c.fillStyle = m.f; rond(c, x, y + r * 0.06, r * 0.44); c.fill();
    const v = c.createLinearGradient(x, y - r * 0.4, x, y + r * 0.5);
    v.addColorStop(0, '#0f5f6a'); v.addColorStop(1, '#021a20');
    c.fillStyle = v; rond(c, x, y + r * 0.06, r * 0.35); c.fill();
    c.fillStyle = '#ffffffaa'; ell(c, x - r * 0.12, y - r * 0.08, r * 0.1, r * 0.06, -0.6); c.fill();
    // boulons
    c.fillStyle = '#ffffffcc';
    [[-0.52, -0.22], [0.52, -0.22], [-0.46, 0.38], [0.46, 0.38], [0, -0.5]].forEach((p) => { rond(c, x + p[0] * r, y + p[1] * r, r * 0.055); c.fill(); });
    c.restore();
  }

  function oeilRouge(c, x, y, k, ouvert) {
    c.save(); c.translate(x, y); c.scale(k, k);
    c.fillStyle = '#1a0000'; ell(c, 0, 0, 14, 8 * ouvert); c.fill();
    const g = c.createRadialGradient(0, 0, 0, 0, 0, 9);
    g.addColorStop(0, '#fff2a0'); g.addColorStop(0.35, '#ff3b1e'); g.addColorStop(1, '#5a0000');
    c.fillStyle = g; ell(c, 0, 0, 11, 6.5 * ouvert); c.fill();
    c.fillStyle = '#000'; ell(c, 0, 0, 1.8, 5.5 * ouvert); c.fill();
    c.restore();
  }

  function couronne(c, x, y, k) {
    c.save(); c.translate(x, y); c.scale(k / 22, k / 22);
    c.fillStyle = '#ffd34d'; c.strokeStyle = '#6b4a00'; c.lineWidth = 2.5; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-20, 0); c.lineTo(-23, -22); c.lineTo(-10, -10); c.lineTo(0, -26); c.lineTo(10, -10); c.lineTo(23, -22); c.lineTo(20, 0); c.closePath();
    c.fill(); c.stroke();
    c.fillStyle = '#3fe0c8'; rond(c, 0, -10, 3.5); c.fill();
    c.restore();
  }

  // Formes du sonar, centrées en (x, y), taille r ; coul : couleur du trait.
  // 0 poisson, 1 méduse, 2 épave, 3 calmar, 4 plongeur (im : imitation), 5 ombre.
  function forme(c, f, x, y, r, coul, opt) {
    opt = opt || {};
    c.save(); c.translate(x, y); c.scale(r / 20, r / 20);
    c.fillStyle = coul; c.strokeStyle = coul; c.lineWidth = 2.6; c.lineJoin = 'round'; c.lineCap = 'round';
    if (f === 0) {
      ell(c, -2, 0, 12, 7); c.fill();
      c.beginPath(); c.moveTo(8, 0); c.lineTo(18, -8); c.lineTo(18, 8); c.closePath(); c.fill();
      c.fillStyle = '#021a14'; rond(c, -8, -1.5, 1.8); c.fill();
    } else if (f === 1) {
      c.beginPath(); c.arc(0, -2, 11, Math.PI, 0); c.closePath(); c.fill();
      for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * 4, -1); c.quadraticCurveTo(i * 4 + 3, 7, i * 4, 16); c.stroke(); }
    } else if (f === 2) {
      // tonneau d'épave, posé de travers
      c.rotate(-0.35);
      rr(c, -12, -9, 24, 18, 6); c.fill();
      c.strokeStyle = '#021a14'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(-5, -9); c.lineTo(-5, 9); c.moveTo(5, -9); c.lineTo(5, 9); c.stroke();
    } else if (f === 3) {
      c.beginPath(); c.moveTo(0, -17); c.lineTo(8, -4); c.lineTo(6, 6); c.lineTo(-6, 6); c.lineTo(-8, -4); c.closePath(); c.fill();
      for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * 2.6, 6); c.quadraticCurveTo(i * 6, 12, i * 4.5, 18); c.stroke(); }
    } else if (f === 4) {
      // plongeur : casque rond, corps, bras ; l'imitation a des yeux rouges et des membres trop longs
      const im = !!opt.im;
      rond(c, 0, -10, 6); c.fill();
      rr(c, -5, -4, 10, 12, 3); c.fill();
      c.beginPath(); c.moveTo(-5, -1); c.lineTo(-12, im ? 10 : 5); c.moveTo(5, -1); c.lineTo(12, im ? 10 : 5);
      c.moveTo(-3, 8); c.lineTo(-5, im ? 22 : 17); c.moveTo(3, 8); c.lineTo(5, im ? 22 : 17); c.stroke();
      if (im) { c.fillStyle = '#ff3b1e'; rond(c, -2.4, -10.5, 1.8); c.fill(); rond(c, 2.4, -10.5, 1.8); c.fill(); }
      else { c.fillStyle = '#fff7a0'; rond(c, 0, -14.5, 2.4); c.fill(); c.globalAlpha = 0.35; c.beginPath(); c.moveTo(0, -15); c.lineTo(-7, -26); c.lineTo(7, -26); c.closePath(); c.fill(); c.globalAlpha = 1; }
    } else if (f === 5) {
      // ombre : grande masse sombre bordée de lumière, avec un tentacule
      c.fillStyle = '#000'; c.globalAlpha = 0.85;
      ell(c, 0, 0, 22, 12, -0.2); c.fill();
      c.globalAlpha = 1; c.strokeStyle = coul; c.lineWidth = 2;
      ell(c, 0, 0, 22, 12, -0.2); c.stroke();
      c.beginPath(); c.moveTo(18, 4); c.bezierCurveTo(30, 10, 22, 22, 32, 26); c.stroke();
      oeilRouge(c, -8, -2, 0.35, 1);
    }
    c.restore();
  }

  // Petite icône d'une forme dans un canvas de réponse (fond transparent).
  function iconeForme(f) {
    const cv = document.createElement('canvas');
    cv.width = 64; cv.height = 64;
    cv.setAttribute('aria-hidden', 'true');
    forme(cv.getContext('2d'), f, 32, 30, f === 5 ? 18 : 24, '#9dffd0', { im: false });
    return cv;
  }

  // Le décor de l'écran titre : l'épave au fond de l'abîme, la créature, les hublots.
  let titreT = 0;
  function dessinerTitre(t) {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    t = t || 0;
    let g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#0b4a5c'); g.addColorStop(0.35, '#05222d'); g.addColorStop(1, '#010608');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    // rayons de lumière venus de très haut
    c.save(); c.globalAlpha = 0.07; c.fillStyle = '#bff';
    for (let i = 0; i < 5; i++) { const x = w * (0.1 + i * 0.2); c.beginPath(); c.moveTo(x - 20, 0); c.lineTo(x + 30, 0); c.lineTo(x + 120 - i * 40, h * 0.6); c.lineTo(x + 40 - i * 40, h * 0.6); c.closePath(); c.fill(); }
    c.restore();
    // Portrait (téléphone, jaquette) : l'épave entre le titre et les boutons.
    const portrait = h > w * 1.15;
    const u = Math.min(w, h * 0.75) / 10 * (portrait ? 1 : 0.8), cx = w / 2, sol = h * (portrait ? 0.62 : 0.6);
    // la créature : immense silhouette derrière l'épave
    c.save();
    c.fillStyle = '#020c10';
    ell(c, cx + u * 0.6, sol - u * 3.4, u * 4.6, u * 2.6, -0.15); c.fill();
    for (let i = 0; i < 6; i++) {
      const a = -0.4 + i * 0.6, ox = cx + Math.cos(a) * u * 3.8, oy = sol - u * 2.6 + Math.sin(a) * u * 1.4;
      const ond = Math.sin(t / 900 + i) * u * 0.25;
      c.strokeStyle = '#020c10'; c.lineWidth = u * (0.55 - i * 0.05); c.lineCap = 'round';
      c.beginPath(); c.moveTo(ox, oy);
      c.bezierCurveTo(ox + Math.cos(a) * u * 1.5 + ond, oy + u * 0.6, ox + Math.cos(a) * u * 2.5 - ond, oy + u * 1.6, ox + Math.cos(a) * u * 2.0, sol + u * 0.2);
      c.stroke();
    }
    const cl = Math.abs(Math.sin(t / 1700)) > 0.97 ? 0.15 : 1;
    oeilRouge(c, cx - u * 1.3, sol - u * 4.0, u / 17, cl);
    oeilRouge(c, cx + u * 0.3, sol - u * 4.25, u / 17, cl);
    c.restore();
    // fond marin
    c.fillStyle = '#04151b';
    c.beginPath(); c.moveTo(0, sol); c.bezierCurveTo(w * 0.3, sol - u * 0.6, w * 0.6, sol + u * 0.3, w, sol - u * 0.4); c.lineTo(w, h); c.lineTo(0, h); c.fill();
    // l'épave du sous-marin, penchée
    c.save(); c.translate(cx - u * 0.3, sol - u * 0.9); c.rotate(-0.12);
    const coque = c.createLinearGradient(0, -u * 1.2, 0, u * 1.2);
    coque.addColorStop(0, '#3d5560'); coque.addColorStop(0.5, '#1e2f36'); coque.addColorStop(1, '#0a1418');
    c.fillStyle = coque; ell(c, 0, 0, u * 4.2, u * 1.15); c.fill();
    c.fillStyle = '#26383f'; rr(c, -u * 0.9, -u * 2.0, u * 1.8, u * 1.1, u * 0.25); c.fill();
    c.fillStyle = '#1a282d'; c.fillRect(-u * 0.2, -u * 2.7, u * 0.2, u * 0.75);
    c.strokeStyle = '#0006'; c.lineWidth = 2;
    for (let i = -3; i <= 3; i++) { c.beginPath(); c.moveTo(i * u * 1.05, -u * 1.05); c.lineTo(i * u * 1.05, u * 1.05); c.stroke(); }
    // hélice
    c.fillStyle = '#2a3a40'; ell(c, u * 4.3, 0, u * 0.25, u * 0.7); c.fill();
    // les 4 hublots des cabines, chacun de sa couleur
    for (let i = 0; i < 4; i++) {
      const hx = -u * 2.4 + i * u * 1.6, hy = u * 0.05, hr = u * 0.36;
      const halo = c.createRadialGradient(hx, hy, 0, hx, hy, hr * 3);
      halo.addColorStop(0, COUL[i] + '88'); halo.addColorStop(1, COUL[i] + '00');
      c.fillStyle = halo; rond(c, hx, hy, hr * 3); c.fill();
      c.fillStyle = '#7d8b90'; rond(c, hx, hy, hr * 1.25); c.fill();
      c.fillStyle = COUL[i]; rond(c, hx, hy, hr); c.fill();
      c.fillStyle = '#ffffffaa'; ell(c, hx - hr * 0.3, hy - hr * 0.35, hr * 0.3, hr * 0.18, -0.5); c.fill();
    }
    c.restore();
    // neige marine et bulles
    const al = graineHasard(11);
    for (let i = 0; i < 90; i++) {
      const x = al() * w, y = (al() * h + t * 0.01 * (0.5 + al())) % h;
      c.fillStyle = 'rgba(200,240,240,' + (0.15 + al() * 0.35).toFixed(2) + ')';
      rond(c, x, y, 0.6 + al() * 1.6); c.fill();
    }
    for (let i = 0; i < 12; i++) {
      const x = cx - u * 2.4 + (i % 4) * u * 1.6 + Math.sin(t / 500 + i) * 4, y = sol - u * 1.2 - ((t * 0.04 + i * 70) % (h * 0.6));
      c.strokeStyle = 'rgba(190,255,245,.5)'; c.lineWidth = 1.5; rond(c, x, y, 2 + (i % 3)); c.stroke();
    }
  }

  // ---------------------------------------------------------------------
  //  Le sonar : dessin d'une scène (jeu et tutoriels)
  // ---------------------------------------------------------------------

  // Moment d'apparition de l'écho i (fraction du temps d'affichage).
  function momentEcho(i, n) { return n <= 1 ? 0.15 : 0.08 + 0.7 * i / (n - 1); }
  const ANG_DIR = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];

  // sc : scène ; ms : temps écoulé depuis le début de l'affichage ; opt : { eteint, petit }
  function dessinerSonar(c, cx, cy, Rr, sc, ms, opt) {
    opt = opt || {};
    const vu = sc ? sc.vu : 4000;
    const fin = !sc || ms >= vu || opt.eteint;
    c.save();
    // cadran
    const g = c.createRadialGradient(cx, cy, Rr * 0.1, cx, cy, Rr);
    g.addColorStop(0, fin ? '#03140f' : '#06301f'); g.addColorStop(1, fin ? '#010806' : '#021a10');
    c.fillStyle = '#0d2228'; rond(c, cx, cy, Rr * 1.06); c.fill();
    c.fillStyle = g; rond(c, cx, cy, Rr); c.fill();
    c.beginPath(); c.arc(cx, cy, Rr, 0, Math.PI * 2); c.clip();
    let jx = 0, jy = 0;
    if (sc && sc.bz && !fin) { jx = (Math.random() - 0.5) * Rr * 0.03; jy = (Math.random() - 0.5) * Rr * 0.03; }
    c.translate(jx, jy);
    c.strokeStyle = 'rgba(93,255,176,.18)'; c.lineWidth = 1.2;
    for (let k = 1; k <= 3; k++) { rond(c, cx, cy, Rr * k / 3); c.stroke(); }
    // secteurs (diagonales) : nord, est, sud, ouest
    c.beginPath();
    for (let k = 0; k < 4; k++) { const a = Math.PI / 4 + k * Math.PI / 2; c.moveTo(cx, cy); c.lineTo(cx + Math.cos(a) * Rr, cy + Math.sin(a) * Rr); }
    c.stroke();
    if (!opt.petit) {
      c.fillStyle = 'rgba(93,255,176,.45)'; c.font = '800 ' + Math.round(Rr * 0.1) + 'px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      for (let k = 0; k < 4; k++) c.fillText(tr('dir.court.' + k), cx + Math.cos(ANG_DIR[k]) * Rr * 0.9, cy + Math.sin(ANG_DIR[k]) * Rr * 0.9);
    }
    if (sc && !fin) {
      // faisceau qui tourne
      const fa = (ms / 1300) * Math.PI * 2 - Math.PI / 2;
      const grad = c.createConicGradient ? c.createConicGradient(fa - 0.9, cx, cy) : null;
      if (grad) {
        grad.addColorStop(0, 'rgba(93,255,176,0)'); grad.addColorStop(0.14, 'rgba(93,255,176,.28)'); grad.addColorStop(0.145, 'rgba(93,255,176,0)');
        c.fillStyle = grad; rond(c, cx, cy, Rr); c.fill();
      }
      c.strokeStyle = 'rgba(160,255,210,.7)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(fa) * Rr, cy + Math.sin(fa) * Rr); c.stroke();
      if (sc.p) dessinerPanne(c, cx, cy, Rr, sc, ms);
      else dessinerEchos(c, cx, cy, Rr, sc, ms);
      if (sc.enc) dessinerEncre(c, cx, cy, Rr, sc, ms);
      if (sc.bz) {
        c.fillStyle = 'rgba(180,255,220,.12)';
        for (let i = 0; i < 26; i++) c.fillRect(cx - Rr + Math.random() * Rr * 2, cy - Rr + Math.random() * Rr * 2, Math.random() * Rr * 0.3, 1.5);
      }
    } else {
      // écran éteint : parasites faibles
      c.fillStyle = 'rgba(93,255,176,.06)';
      for (let i = 0; i < 40; i++) c.fillRect(cx - Rr + Math.random() * Rr * 2, cy - Rr + Math.random() * Rr * 2, 2, 2);
    }
    c.restore();
    // bord et compte à rebours
    c.strokeStyle = '#2b5f66'; c.lineWidth = Math.max(3, Rr * 0.04); rond(c, cx, cy, Rr * 1.03); c.stroke();
    if (sc && !fin && !opt.petit) {
      const reste = 1 - ms / vu;
      c.strokeStyle = reste < 0.25 ? '#ff6b4a' : PHOS; c.lineWidth = Math.max(3, Rr * 0.035);
      c.beginPath(); c.arc(cx, cy, Rr * 1.03, -Math.PI / 2, -Math.PI / 2 + reste * Math.PI * 2); c.stroke();
    }
  }

  function dessinerEchos(c, cx, cy, Rr, sc, ms) {
    const n = sc.l.length, vu = sc.vu;
    sc.l.forEach((it, i) => {
      const t0 = momentEcho(i, n) * vu;
      if (ms < t0) return;
      const age = ms - t0;
      const x = cx + it.x * Rr, y = cy + it.y * Rr;
      // anneau du ping
      if (age < 700) {
        c.strokeStyle = 'rgba(160,255,210,' + (0.8 * (1 - age / 700)).toFixed(2) + ')'; c.lineWidth = 2;
        rond(c, x, y, Rr * 0.05 + age / 700 * Rr * 0.16); c.stroke();
      }
      if (it.fx) {
        // faux écho : anneau creux qui clignote puis s'efface
        if (age > 750) return;
        if (Math.floor(age / 90) % 2) return;
        c.strokeStyle = 'rgba(200,255,230,.85)'; c.lineWidth = 2.5; c.setLineDash([4, 4]);
        rond(c, x, y, Rr * 0.08); c.stroke(); c.setLineDash([]);
        return;
      }
      let a = Math.min(1, age / 200);
      if (sc.fl) a *= Math.max(0, Math.min(1, (1500 - age) / 400));
      if (a <= 0) return;
      c.globalAlpha = a;
      c.shadowColor = PHOS; c.shadowBlur = 10;
      const dx = it.f === 5 ? Math.sin(age / 500) * Rr * 0.03 : 0;
      forme(c, it.f, x + dx, y, Rr * (it.f === 5 ? 0.12 : 0.1), PHOS, { im: !!it.im });
      c.shadowBlur = 0; c.globalAlpha = 1;
    });
  }

  // Sonar en panne : rien à l'écran, des sons et une barre lumineuse (grave, moyen, aigu).
  function dessinerPanne(c, cx, cy, Rr, sc, ms) {
    const n = sc.l.length, vu = sc.vu;
    c.fillStyle = 'rgba(0,10,6,.7)'; rond(c, cx, cy, Rr); c.fill();
    c.strokeStyle = 'rgba(93,255,176,.35)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(cx - Rr * 0.7, cy + Rr * 0.35); c.lineTo(cx + Rr * 0.7, cy + Rr * 0.35); c.stroke();
    sc.l.forEach((it, i) => {
      const t0 = momentEcho(i, n) * vu, age = ms - t0;
      if (age < 0 || age > 550) return;
      const a = 1 - age / 550, haut = Rr * (0.22 + it.h * 0.24);
      c.fillStyle = 'rgba(93,255,176,' + a.toFixed(2) + ')';
      c.shadowColor = PHOS; c.shadowBlur = 14;
      rr(c, cx - Rr * 0.07, cy + Rr * 0.35 - haut, Rr * 0.14, haut, Rr * 0.04); c.fill();
      c.shadowBlur = 0;
      c.strokeStyle = 'rgba(93,255,176,' + (a * 0.6).toFixed(2) + ')';
      rond(c, cx, cy, Rr * (0.2 + age / 550 * 0.7)); c.stroke();
    });
  }

  // Encre : un nuage noir traverse l'écran au milieu de l'affichage.
  function dessinerEncre(c, cx, cy, Rr, sc, ms) {
    const p = (ms / sc.vu - 0.2) / 0.55;
    if (p <= 0 || p >= 1) return;
    const a = sc.enc.a, d = (p * 2 - 1) * Rr * 1.15;
    const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d, rr2 = Rr * sc.enc.r * (0.7 + 0.5 * Math.sin(p * Math.PI));
    const op = Math.min(1, Math.sin(p * Math.PI) * 1.6);
    c.save(); c.globalAlpha = op;
    for (let k = 0; k < 7; k++) {
      const kx = x + Math.cos(k * 2.1 + p * 3) * rr2 * 0.45, ky = y + Math.sin(k * 1.7 + p * 2) * rr2 * 0.4;
      const gg = c.createRadialGradient(kx, ky, 0, kx, ky, rr2 * 0.75);
      gg.addColorStop(0, '#05000a'); gg.addColorStop(0.7, '#0b0214ee'); gg.addColorStop(1, '#0b021400');
      c.fillStyle = gg; rond(c, kx, ky, rr2 * 0.75); c.fill();
    }
    c.restore();
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#03121a'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (parcours de 20 plongées) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // plongée solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)
  let attenteTuto = false;
  // Affichage du sonar : cle de la scène, temps écoulé, échos déjà annoncés.
  const obs = { cle: '', ms: 0, sons: 0, encre: false, retient: 0 };
  // Réponse qui vient d'être donnée (affichée un moment avant la scène suivante).
  let retour = null;
  let finieSolo = false;      // plongée solo déjà jugée (noyé avant la fin)

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'carnet', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom === 'titre') majTitre();
    relancerBoucle();
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    el.classList.toggle('haut', ecran !== 'jeu' || salonOuvert() || $('voile-fin').classList.contains('actif'));
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  // Cartes des 4 cabines, en haut de l'écran.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'casque'; cv.width = 88; cv.height = 88;
      const o2 = document.createElement('span'); o2.className = 'o2';
      const br = document.createElement('span'); br.className = 'bruit';
      for (let k = 0; k < 6; k++) { const i = document.createElement('i'); i.style.height = (3 + k) + 'px'; br.appendChild(i); }
      const tag = document.createElement('span'); tag.className = 'tag';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 26, 36, 24);
      const oe = document.createElement('canvas'); oe.className = 'oeil'; oe.width = 60; oe.height = 36;
      oe.setAttribute('aria-hidden', 'true');
      oeilRouge(oe.getContext('2d'), 30, 18, 1.8, 1);
      d.append(cv, o2, br, tag, cour, oe);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 112; cv.height = 112;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  const monSiege = () => (partie ? partie.siege : -1);
  function combiDe(s) { return s === monSiege() ? prog.combi : 0; }

  // Le rôle d'une place : toi, un vrai joueur ou un robot.
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché : pseudo d'un vrai joueur en ligne (partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  // Nom d'une place dans les phrases : pseudo, « toi » ou le nom de la cabine.
  function nomCabine(s) {
    const info = siegesActuels()[s] || {};
    if (s === monSiege()) return tr('cabine.toi');
    if (info.humain && info.nom) return info.nom;
    return tr('cabine.' + s);
  }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !e.fini ? R.aQui(e) : -1;
    const rode = e ? O.rodeur(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const o2 = e ? e.ox[s] : 0, bruit = e ? e.br[s] : 0, noye = e ? !O.vivant(e, s) : false;
      const cleCasque = s + '|' + combiDe(s);
      const cv = d.querySelector('canvas.casque');
      if (cv.dataset.cle !== cleCasque) { cv.dataset.cle = cleCasque; const c = cv.getContext('2d'); c.clearRect(0, 0, 88, 88); casque(c, s, 44, 44, 42, combiDe(s)); }
      const zo = d.querySelector('.o2');
      const texteO2 = nb(o2);
      if (zo.dataset.v !== texteO2) { zo.dataset.v = texteO2; zo.innerHTML = ICONE_BULLE; const sp = document.createElement('span'); sp.textContent = texteO2; zo.appendChild(sp); }
      d.querySelectorAll('.bruit i').forEach((i, k) => i.classList.toggle('on', k < bruit));
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('noye', noye);
      d.classList.toggle('rode', s === rode);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria.' + role, { cabine: tr('cabine.' + s), o2: o2, bruit: bruit }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : '') + (s === rode ? ' · ' + tr('place.rode') : '') + (noye ? ' · ' + tr('place.noye') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || e.fini) return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) return tr(e.ph === 'c' ? 'tour.choix' : 'tour.toi');
    return tr('tour.nom', { nom: nomCabine(s) });
  }

  function majInfos() {
    let info = '';
    const e = vue;
    const ronde = e ? tr('jeu.ronde', { n: Math.min(e.ro, e.cfg.rmax), total: e.cfg.rmax }) : '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length }) + (ronde ? ' · ' + ronde : '');
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche }) + (ronde ? ' · ' + ronde : '');
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majPanneau();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fini) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Panneau du bas : observer, répondre, continuer ou passer
  // ---------------------------------------------------------------------

  const enObservation = () => !!(vue && vue.sc && obs.ms < vue.sc.vu);
  const montrerRetour = () => !!(retour && performance.now() < retour.jusqua);

  // Texte d'une question (q : question, avec son type).
  function texteQuestion(q) {
    switch (q.t) {
      case 'nb': return tr('q.nb', { dir: tr('dir.' + q.x) });
      case 'tot': return tr('q.tot');
      case 'der': return tr('q.der');
      case 'prem': return tr('q.prem');
      case 'fnb': return tr('q.fnb', { forme: tr('forme.pl.' + q.x) });
      case 'ou': return tr('q.ou', { forme: tr('forme.le.' + q.x) });
      case 'plus': return tr('q.plus');
      case 'ombre': return tr('q.ombre');
      case 'plong': return tr('q.plong');
      case 'snb': return tr('q.snb');
      case 'sder': return tr('q.sder');
      case 'sh': return tr(q.x === 2 ? 'q.shAigu' : 'q.shGrave');
      default: return '';
    }
  }
  const estForme = (q) => q.t === 'der' || q.t === 'prem';
  const estDir = (q) => q.t === 'ou' || q.t === 'plus' || q.t === 'ombre';

  // Contenu d'un bouton de réponse.
  function remplirReponse(b, q, v, i) {
    b.textContent = '';
    if (estForme(q)) { b.appendChild(iconeForme(v)); const sp = document.createElement('span'); sp.textContent = tr('forme.' + v); b.appendChild(sp); }
    else if (estDir(q)) { const sp = document.createElement('span'); sp.textContent = tr('dir.' + v); b.appendChild(sp); }
    else if (q.t === 'sder') { const sp = document.createElement('span'); sp.textContent = tr('ton.' + v); b.appendChild(sp); }
    else { const sp = document.createElement('span'); sp.textContent = nb(v); sp.style.fontSize = '1.3rem'; b.appendChild(sp); }
    const k = document.createElement('small'); k.textContent = nb(i + 1); k.setAttribute('aria-hidden', 'true');
    b.appendChild(k);
  }

  let panneauCle = '';
  function majPanneau() {
    const e = vue, rep = $('reponses'), act = $('actions'), texte = $('q-texte');
    let cle = 'vide', q = null, mode = 'vide';
    const moi = monSiege();
    if (e && partie && partie.phase === 'jeu' && !attenteTuto && !e.fini) {
      if (montrerRetour()) { mode = 'retour'; q = retour.q; cle = 'r' + retour.i + '-' + retour.r; }
      else if (e.ph === 'c' && e.tour === moi) { mode = 'choix'; cle = 'c' + e.nq; }
      else if (enObservation()) { mode = 'observe'; q = e.q; cle = 'o' + e.nq + '-' + e.rv + '-' + e.tour; }
      else { mode = e.tour === moi ? 'question' : 'autre'; q = e.q; cle = mode + e.nq + '-' + e.rv + '-' + e.fu[moi >= 0 ? moi : 0]; }
    } else if (retour && montrerRetour()) { mode = 'retour'; q = retour.q; cle = 'r' + retour.i + '-' + retour.r; }
    if (cle === panneauCle) return;
    panneauCle = cle;
    rep.textContent = ''; act.textContent = '';
    rep.classList.remove('trois');
    if (mode === 'vide') { texte.textContent = ''; ajouterFantomes(rep, 4); return; }
    if (mode === 'choix') {
      const g = O.gains[Math.min(e.k, O.gains.length - 1)];
      texte.textContent = tr('choix.texte', { n: e.res });
      ajouterFantomes(rep, 0);
      const b1 = boutonAction(tr('choix.encore', { n: g }), 'rouge', () => jouerAction({ c: 1 }));
      const b2 = boutonAction(tr('choix.passer', { n: e.res }), 'vert', () => jouerAction({ c: 0 }));
      act.append(b1, b2);
      try { b2.focus({ preventScroll: true }); } catch (er) { /* rien */ }
      return;
    }
    if (mode === 'observe') {
      texte.textContent = e.tour === moi ? tr(e.sc.p ? 'obs.ecoute' : 'obs.regarde') : tr('obs.autre', { nom: nomCabine(e.tour) });
      ajouterFantomes(rep, q.ch.length);
      return;
    }
    texte.textContent = texteQuestion(q);
    if (q.ch.length === 3) rep.classList.add('trois');
    q.ch.forEach((v, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'rep';
      remplirReponse(b, q, v, i);
      if (mode === 'question') b.addEventListener('click', () => jouerAction({ r: i }));
      else b.disabled = true;
      if (mode === 'retour') {
        if (i === retour.b) b.classList.add('bon');
        if (i === retour.r && retour.r !== retour.b) b.classList.add('mauvais');
      }
      rep.appendChild(b);
    });
    if (mode === 'retour') {
      const qui = nomCabine(retour.p);
      texte.textContent = retour.ok ? tr('retour.bon', { nom: qui }) : tr('retour.mauvais', { nom: qui });
    }
    if (mode === 'question' && e.fu[moi] > 0 && !e.rv && !e.sc.p) {
      act.appendChild(boutonAction(tr('fusee.bouton', { n: e.fu[moi] }), '', () => jouerAction({ f: 1 })));
    }
    if (mode === 'question') { const b = rep.querySelector('button'); if (b) try { b.focus({ preventScroll: true }); } catch (er) { /* rien */ } }
  }

  // Places vides de même taille (rien ne bouge quand la question arrive).
  function ajouterFantomes(rep, n) {
    for (let i = 0; i < Math.max(n, 4) && n > 0; i++) {
      const b = document.createElement('div'); b.className = 'rep cache'; rep.appendChild(b);
    }
    if (n === 3) rep.classList.add('trois');
  }

  function boutonAction(texte, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = texte;
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  let dernierAttends = 0;
  function jouerAction(a) {
    if (!partie || enPause || attenteTuto) return;
    audio();
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (a.r !== undefined && (enObservation() || montrerRetour())) return;
    if (partie.jouer(a)) panneauCle = '';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    if (ecran !== 'jeu') {
      titreT = t;
      if (ecran === 'titre' || ecran === 'niveaux' || ecran === 'carnet') { dessinerTitre(t); rafId = requestAnimationFrame(boucle); }
      return;
    }
    if (enPause) return;
    avancerObservation(dt);
    dessinerJeu(t, dt);
    majTemps();
    majCompte();
    majPanneau();
    rafId = requestAnimationFrame(boucle);
  }

  // Le sonar s'allume à chaque nouvelle question (ou fusée), après la réponse précédente.
  function avancerObservation(dt) {
    const e = vue;
    if (!e || !e.sc || attenteTuto || e.fini) return;
    if (montrerRetour()) return;
    const cle = e.nq + '-' + e.rv;
    if (cle !== obs.cle) {
      obs.cle = cle; obs.ms = 0; obs.sons = 0; obs.encre = false;
      if (partie && partie.phase === 'jeu') sons.ping();
    }
    if (e.ph === 'c') return;
    const avant = obs.ms;
    obs.ms += dt * 1000;
    // sons des échos au moment où ils apparaissent
    const n = e.sc.l.length;
    while (obs.sons < n && momentEcho(obs.sons, n) * e.sc.vu <= obs.ms) {
      const it = e.sc.l[obs.sons];
      if (e.sc.p) sons.ton(it.h); else if (it.fx) sons.faux(); else sons.echo();
      obs.sons++;
    }
    if (e.sc.enc && !obs.encre && obs.ms / e.sc.vu > 0.2) { obs.encre = true; sons.encre(); }
    if (e.sc.bz && Math.random() < dt * 1.5) sons.brouille();
    if (avant < e.sc.vu && obs.ms >= e.sc.vu && e.tour === monSiege()) sons.tour();
  }

  let secousse = 0;
  function dessinerJeu(t, dt) {
    const cv = $('sonar'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    const Rr = Math.max(40, Math.min(w, h) / 2 * 0.9 - 6);
    const e = vue;
    const ms = e && e.ph !== 'c' && !montrerRetour() && !attenteTuto ? obs.ms : 1e9;
    dessinerSonar(c, w / 2, h / 2, Rr, e ? e.sc : null, ms, {});
    // l'œil de la créature s'ouvre dans le sonar quand elle frappe
    if (secousse > 0) {
      secousse = Math.max(0, secousse - dt);
      const k = Math.sin(Math.min(1, secousse / 1.2) * Math.PI);
      c.save(); c.globalAlpha = k;
      oeilRouge(c, w / 2, h / 2, Rr / 16, Math.min(1, k * 1.5));
      c.restore();
    }
    // bulles d'oxygène qui montent
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.strokeStyle = p.coul; c.lineWidth = 2;
      rond(c, p.x, p.y, p.r); c.stroke();
      c.globalAlpha = 1;
    }
  }

  const particules = [];
  function bullesVers(s, n) {
    const zone = $('zone'), w = zone.clientWidth, h = zone.clientHeight;
    for (let k = 0; k < n; k++) particules.push({ x: w / 2 + (Math.random() - 0.5) * w * 0.3, y: h * 0.6, vx: (s - 1.5) * 40 + (Math.random() - 0.5) * 40, vy: -120 - Math.random() * 120, vie: 1 + Math.random() * 0.6, r: 3 + Math.random() * 6, coul: COUL[s] });
  }

  function flotter(s, texte, coul) {
    const d = $('place-' + s);
    if (!d) return;
    const f = document.createElement('span');
    f.className = 'flot'; f.textContent = texte; f.style.color = coul || '#fff';
    d.appendChild(f);
    setTimeout(() => f.remove(), 1400);
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function nouvelleVue(etat) {
    vue = etat ? JSON.parse(JSON.stringify(etat)) : null;
    panneauCle = '';
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    nouvelleVue(partie.etat);
    obs.cle = '';
    retour = null;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;

  function majSalon(tout) {

      if (d.dataset.etat !== cle) {

        d.dataset.etat = cle;

  function surManche() {

  function surAction(ev) {
    const avant = ev.avant, apres = ev.apres, a = ev.action, s = ev.siege;
    nouvelleVue(apres);

    dernierTic = -1;
    if (a.f === 1) {

    } else if (a.r !== undefined) {
      const ok = a.r === avant.q.b;
      retour = { q: avant.q, r: a.r, b: avant.q.b, ok: ok, p: s, i: avant.nq, jusqua: performance.now() + (ev.moi ? 1300 : 900) };
      if (ok) { sons.bon(); if (apres.dern && apres.dern.g) { bullesVers(s, 8); sons.bulles(); flotter(s, '+' + nb(apres.dern.g), '#7dffb5'); } }
      else {

      }
    } else if (a.c === 0) {
      if (apres.dern && apres.dern.g) { bullesVers(s, 8); sons.bulles(); flotter(s, '+' + nb(apres.dern.g), '#7dffb5'); }
    } else if (a.c === 1) {

    // respiration

      setTimeout(() => flotter(apres.resp.p, '−' + nb(apres.resp.n), '#9fd6ff'), 500);
    }
    // la créature frappe
    if (apres.fx && (!avant.fx || apres.fx.ro !== avant.fx.ro)) {
      const fx = apres.fx;
      if (fx.p >= 0) {
        setTimeout(() => {
          sons.coup();
          secousse = 1.2;
          const ej = $('ecran-jeu'); ej.classList.remove('secousse'); void ej.offsetWidth; ej.classList.add('secousse');
          const ec = $('eclair'); ec.classList.add('actif'); setTimeout(() => ec.classList.remove('actif'), 90);
          const carte = $('place-' + fx.p); carte.classList.remove('frappe'); void carte.offsetWidth; carte.classList.add('frappe');
          flotter(fx.p, '−' + nb(fx.d), '#ff5a3a');
          toast(tr(fx.p === monSiege() ? 'creature.toi' : 'creature.frappe', { nom: nomCabine(fx.p), n: fx.d }), 2600);
        }, 700);
      } else setTimeout(() => toast(tr('creature.calme'), 2000), 700);
    }
    // cabines noyées
    apres.el.forEach((p) => {
      if (avant.el.indexOf(p) >= 0) return;
      setTimeout(() => { sons.noye(); toast(tr(p === monSiege() ? 'noye.toi' : 'noye.autre', { nom: nomCabine(p) }), 2600); }, 1400);
    });

    if (partie.phase === 'jeu' && !apres.fini && R.aQui(apres) === partie.siege && !ev.moi && R.aQui(avant) !== partie.siege) sons.tour();
    // Solo : noyé avant la fin de la plongée, la défaite est montrée tout de suite.
    if (session === 'solo' && !finieSolo && partie.siege >= 0 && !O.vivant(apres, partie.siege) && !apres.fini) {
      finieSolo = true;
      enPartie = false;
      const j = jeton;
      setTimeout(() => { if (j === jeton && partie) afficherFin(true); }, 1900);
    }
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;

    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    panneauCle = '';
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;

      if (j !== jeton || !partie) return;

    }, 2000);
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, res = R.fin(e);
    const gagne = moi >= 0 && !!res && res.classement[0] === moi;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); fete(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de plongée : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(o2, gagne) {
    if (!gagne) return 0;
    return o2 >= 5 ? 3 : o2 >= 3 ? 2 : 1;
  }

  // Classement : celui des règles à la fin ; en cours de plongée, oxygène puis ordre des noyades.
  function ordreCabines(e) {
    const res = R.fin(e);
    if (res) return res.classement;
    const vivants = [], noyes = e.el.slice().reverse();
    for (let s = 0; s < PLACES; s++) if (O.vivant(e, s)) vivants.push(s);
    vivants.sort((x, y) => (e.ox[y] - e.ox[x]) || (e.br[x] - e.br[y]) || (x - y));
    return vivants.concat(noyes.filter((s) => vivants.indexOf(s) < 0));
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    ordreCabines(e).forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; casque(cv.getContext('2d'), s, 30, 30, 28, s === moi ? prog.combi : 0);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('cabine.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = O.vivant(e, s) ? tr('fin.o2Court', { n: e.ox[s] }) : tr('fin.noyeCourt');
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  // noyeAvant : la cabine du joueur est noyée avant la fin de la plongée (solo).
  function afficherFin(noyeAvant) {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const o2 = moi >= 0 && O.vivant(e, moi) ? e.ox[moi] : 0;
    const ordre = ordreCabines(e);
    const gagne = !noyeAvant && moi >= 0 && ordre[0] === moi;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? (o2 > 0 ? tr('fin.o2', { n: o2 }) : tr('fin.noye')) : '';
    $('fin-journal').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(o2, gagne);
      const ancienRecord = prog.records[i];
      const record = gagne && o2 > ancienRecord;
      if (record) prog.records[i] = o2;
      let debloque = false, combiNouvelle = -1;
      if (gagne) {
        const avantTotal = totalEtoiles(), premiere = prog.etoiles[i] === 0;
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        COMBIS.forEach((m, k) => { if (m.v > avantTotal && m.v <= totalEtoiles()) combiNouvelle = k; });
        if (premiere && niveau % 2 === 0) $('fin-journal').textContent = tr('fin.journal', { n: niveau / 2 });
        sauver(Math.min(niveau + 1, NIVEAUX.length), o2);
        // Parcours solo terminé (toutes les plongées gagnées, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      }
      $('fin-titre').textContent = gagne ? tr('fin.gagne') : tr(noyeAvant ? 'fin.noyeTitre' : 'fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = gagne ? (record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, o2) })) : tr('fin.conseil');
      let txt = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      if (combiNouvelle >= 0) txt = (txt ? txt + ' ' : '') + tr('fin.combi', { nom: tr('combi.' + combiNouvelle) });
      $('fin-debloque').textContent = txt;
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
      if (noyeAvant && partie) { try { partie.quitter(); } catch (er) { /* rien */ } partie = null; session = null; }
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); fete(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));

    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Fête de victoire : une gerbe de bulles et d'étincelles qui remonte.
  function fete() {
    const cv = $('bulles'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 80; i++) bouts.push({ x: Math.random() * w, y: h + Math.random() * h * 0.4, vx: (Math.random() - 0.5) * 40, vy: -(140 + Math.random() * 220), r: 3 + Math.random() * 9, coul: COUL[i % 4] });
    let debut = 0, prec = 0;
    const j = ++fete.n;
    function pas(t) {
      if (j !== fete.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt + Math.sin((t + b.r * 90) / 300) * 0.6; b.y += b.vy * dt;
        c.strokeStyle = b.coul; c.lineWidth = 2.5; rond(c, b.x, b.y, b.r); c.stroke();
        c.fillStyle = '#ffffff99'; rond(c, b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.25); c.fill();
      });
      if (t - debut < 2800) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  fete.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

    enPause = false;

  // Parcours solo : plongée n contre 3 robots (force croissante, donnée par la plongée).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    quitterPartie();
    session = 'solo';
    jeton++;
    enPartie = true;
    finieSolo = false;
    particules.length = 0;
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: NIVEAUX[niveau - 1].fr, options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.

    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.titre', { n: n, max: NIVEAUX.length * 3, j: journauxLus(), jt: JOURNAUX }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés : sonar miniature, puis la main touche la bonne case
  // ---------------------------------------------------------------------

  const D = (s, x, y, f, extra) => Object.assign({ s: s, x: x, y: y, f: f }, extra || {});
  const TUTOS = {
    base: { sc: { l: [D(0, -0.2, -0.6, 0), D(1, 0.6, 0.1, 1), D(0, 0.25, -0.55, 2)] }, cases: 4, bonne: 2 },
    ordre: { sc: { l: [D(3, -0.6, 0.1, 1), D(1, 0.55, -0.1, 2), D(2, 0.1, 0.6, 0)] }, cases: 4, bonne: 0, formes: [0, 1, 2, 3] },
    formes: { sc: { l: [D(0, -0.1, -0.6, 1), D(1, 0.6, 0.15, 1), D(2, -0.1, 0.6, 3), D(3, -0.6, -0.1, 0)] }, cases: 4, bonne: 1, formes: [1, 0, 3, 2] },
    encre: { sc: { l: [D(0, -0.15, -0.6, 0), D(1, 0.6, 0, 2), D(2, 0.2, 0.55, 1)], enc: { a: 2.4, r: 0.5 } }, cases: 4, bonne: 2 },
    faux: { sc: { l: [D(0, 0.1, -0.6, 0), D(1, 0.55, 0.2, 2, { fx: 1 }), D(3, -0.6, 0.05, 1), D(2, 0, 0.55, 3, { fx: 1 })] }, cases: 4, bonne: 1 },
    fusee: { sc: { l: [D(0, -0.2, -0.5, 3), D(1, 0.6, -0.1, 1), D(2, 0.2, 0.6, 0), D(3, -0.6, 0.2, 2)] }, cases: 4, bonne: 3, fusee: true },
    panne: { sc: { p: 1, l: [{ h: 0 }, { h: 2 }, { h: 1 }] }, cases: 3, bonne: 1 },
    ombre: { sc: { l: [D(0, 0, -0.6, 0), D(1, 0.55, 0.05, 5), D(3, -0.6, 0.1, 1)] }, cases: 4, bonne: 1, dirs: true },
    imite: { sc: { l: [D(0, -0.2, -0.55, 4), D(1, 0.6, 0.1, 4, { im: 1 }), D(2, 0.1, 0.6, 4)] }, cases: 4, bonne: 1, compare: true },
    balayage: { sc: { l: [D(0, 0, -0.6, 2), D(1, 0.6, 0.1, 0), D(2, -0.1, 0.6, 0), D(3, -0.6, 0, 1)], fl: 1 }, cases: 4, bonne: 2 },
    brouillage: { sc: { l: [D(0, 0.15, -0.6, 1), D(1, 0.6, 0.2, 0, { fx: 1 }), D(3, -0.55, -0.1, 3), D(2, 0.05, 0.6, 2, { fx: 1 })], bz: 1 }, cases: 4, bonne: 1 }
  };

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const sc = Object.assign({ p: 0, enc: null, fl: 0, bz: 0, vu: 2600 }, d.sc);
    let debut = 0;
    const j = ++tutoAnim, CYCLE = 5200;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ms = (t - debut) % CYCLE;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.fillStyle = '#021016'; c.fillRect(0, 0, 560, 360);
      // replay du sonar avec la fusée
      let msSonar = ms;
      if (d.fusee && ms > 3400) msSonar = ms - 3400;
      else if (d.fusee && ms > 2600) msSonar = 99999;
      dessinerSonar(c, 160, 180, 140, sc, msSonar, { petit: true });
      if (d.compare) {
        // à droite, le vrai plongeur et l'imitation, côte à côte
        forme(c, 4, 300, 70, 26, PHOS, {});
        forme(c, 4, 360, 70, 26, '#ff8a6a', { im: true });
      }
      // cases de réponse, dessinées sans texte
      const n = d.cases, cases = [];
      for (let i = 0; i < n; i++) {
        const col = n === 3 ? i : i % 2, lig = n === 3 ? 0 : Math.floor(i / 2);
        const x = 330 + col * (n === 3 ? 70 : 105), y = 150 + lig * 80, w = n === 3 ? 62 : 95, h = 64;
        cases.push([x, y, w, h]);
      }
      const touche = ms > 4100 && ms < 5000;
      const visible = ms > 2700;
      cases.forEach((b, i) => {
        c.globalAlpha = visible ? 1 : 0.25;
        c.fillStyle = touche && i === d.bonne ? '#138a63' : '#0d3a46'; c.strokeStyle = touche && i === d.bonne ? '#8dffd6' : '#2b8f86'; c.lineWidth = 3;
        rr(c, b[0], b[1], b[2], b[3], 12); c.fill(); c.stroke();
        if (d.formes) forme(c, d.formes[i], b[0] + b[2] / 2, b[1] + b[3] / 2, 20, '#9dffd0', {});
        else if (d.dirs) { // flèche vers la direction
          const a = ANG_DIR[i]; c.strokeStyle = '#9dffd0'; c.lineWidth = 4;
          const mx = b[0] + b[2] / 2, my = b[1] + b[3] / 2;
          c.beginPath(); c.moveTo(mx - Math.cos(a) * 14, my - Math.sin(a) * 14); c.lineTo(mx + Math.cos(a) * 14, my + Math.sin(a) * 14);
          c.lineTo(mx + Math.cos(a + 2.5) * 6 + Math.cos(a) * 8, my + Math.sin(a + 2.5) * 6 + Math.sin(a) * 8); c.stroke();
        } else { // des points pour les nombres
          const k = i + (n === 3 ? 1 : 1);
          c.fillStyle = '#9dffd0';
          for (let p = 0; p < k; p++) { rond(c, b[0] + b[2] / 2 + (p - (k - 1) / 2) * 14, b[1] + b[3] / 2, 4.5); c.fill(); }
        }
        c.globalAlpha = 1;
      });
      // fusée : un bouton rond avec une étincelle, touché avant la réponse
      if (d.fusee) {
        const fx = 330, fy = 80;
        c.fillStyle = ms > 2900 && ms < 3400 ? '#ff8a3d' : '#0d3a46'; c.strokeStyle = '#ffb37f'; c.lineWidth = 3;
        rr(c, fx, fy, 200, 46, 12); c.fill(); c.stroke();
        c.fillStyle = '#ffd34d';
        c.beginPath(); c.moveTo(fx + 100, fy + 6); c.lineTo(fx + 108, fy + 23); c.lineTo(fx + 100, fy + 40); c.lineTo(fx + 92, fy + 23); c.closePath(); c.fill();
      }
      // la main
      let hx = 520, hy = 340, appui = 0;
      if (d.fusee && ms > 2600 && ms < 3400) { const q = Math.min(1, (ms - 2600) / 300); hx = 520 + (430 - 520) * q; hy = 340 + (103 - 340) * q; appui = ms > 2900 ? 1 : 0; }
      else if (ms > 3400) {
        const b = cases[d.bonne], q = Math.min(1, (ms - 3400) / 600);
        hx = 520 + (b[0] + b[2] / 2 - 520) * q; hy = 340 + (b[1] + b[3] / 2 - 340) * q; appui = touche ? 1 : 0;
      }
      main(c, hx, hy, 1.5, appui);
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Clavier : 1 à 4 pour répondre, F pour la fusée, flèches entre les boutons
  // ---------------------------------------------------------------------

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const chiffres = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Numpad1: 0, Numpad2: 1, Numpad3: 2, Numpad4: 3 };
    if (chiffres[ev.code] !== undefined) {
      const b = $('reponses').querySelectorAll('button')[chiffres[ev.code]];
      if (b && !b.disabled) { ev.preventDefault(); b.click(); }
      return;
    }
    if (ev.code === 'KeyF') {
      const b = $('actions').querySelector('button');
      if (b && vue && vue.ph === 'q') { ev.preventDefault(); b.click(); }
      return;
    }
    const dirs = { ArrowLeft: -1, ArrowUp: -2, ArrowRight: 1, ArrowDown: 2 };
    if (dirs[ev.code] !== undefined) {
      const boutons = Array.from(document.querySelectorAll('#panneau button:not(:disabled)'));
      if (!boutons.length) return;
      ev.preventDefault();
      let i = boutons.indexOf(document.activeElement);
      const pas = Math.abs(dirs[ev.code]) === 2 && $('reponses').querySelectorAll('button').length === 4 ? 2 : 1;
      i = i < 0 ? 0 : Math.max(0, Math.min(boutons.length - 1, i + Math.sign(dirs[ev.code]) * pas));
      try { boutons[i].focus({ preventScroll: true }); } catch (e) { /* rien */ }
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-carnet').addEventListener('click', () => { audio(); sons.clic(); ouvrirCarnet(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('carnet-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une plongée solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.ox[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(titreT); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
