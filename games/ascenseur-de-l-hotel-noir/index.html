<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {

  function pluriel(valeur, lang, variables) {

    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);

      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }

        u.searchParams.set('lang', c);
        location.replace(u.href);

      return Promise.resolve(c);

      var adresse = new URL(location.href);

        history.replaceState(history.state, '', adresse.href);

  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =

    '.jel-langue *{box-sizing:border-box}' +

    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +

    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +

    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();

        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });

    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);

    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;

  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {

    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();

   aile : 0 hall, 1 salle de bal, 2 sous-sol, 3 toit ; bas / haut : étages ;
   quota : clients à livrer ; duree : secondes avant l'aube ; vc : vitesse de la

  NIV({ aile: 2, bas: -3, haut: 4, quota: 10, duree: 125, vc: 0.032, cap: 3, spawn: 4.8, maxAtt: 4, presse: 0.3, faux: 0.2, panne: [15, 4.5], bond: 16 }),

/* ---------- Hasard reproductible ---------- */
function alea(graine) {
  let a = graine >>> 0;

}
function bruit1(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

/* ---------- Progression (sauvegarde JEL_SAVE) ---------- */
const P = { etoiles: new Array(NB_NIV).fill(0), records: new Array(NB_NIV).fill(0), cles: new Array(NB_NIV).fill(0), niveau: 1, cabine: 0, uniforme: 0, vus: [] };

function chargerProgression() {
  let d = null;
  try { d = JEL_SAVE.load(JEU); } catch (e) { d = null; }
  d = d || {};
  P.etoiles = tableau(d.etoiles, NB_NIV).map((v) => Math.min(3, Math.floor(v)));
  P.records = tableau(d.records, NB_NIV).map((v) => Math.floor(v));
  P.cles = tableau(d.cles, NB_NIV).map((v) => (v > 0 ? 1 : 0));
  P.niveau = clamp(Math.floor(Number(d.niveau) || 1), 1, NB_NIV);
  P.cabine = clamp(Math.floor(Number(d.cabine) || 0), 0, CABINES.length - 1);
  P.uniforme = clamp(Math.floor(Number(d.uniforme) || 0), 0, UNIFORMES.length - 1);
  P.vus = Array.isArray(d.vus) ? d.vus.filter((x) => typeof x === 'string') : [];
  if (d.options && typeof d.options.son === 'boolean') SON.muet = !d.options.son;
  if (etoilesTotal() < CABINES[P.cabine].seuil) P.cabine = 0;
  if (clesTotal() < UNIFORMES[P.uniforme].seuil) P.uniforme = 0;
}
function etoilesTotal() { return P.etoiles.reduce((a, b) => a + b, 0); }
function clesTotal() { return P.cles.reduce((a, b) => a + b, 0); }
function nuitsOuvertes() { let n = 1; for (let i = 0; i < NB_NIV; i++) if (P.etoiles[i] > 0) n = i + 2; return clamp(Math.max(n, P.niveau), 1, NB_NIV); }
function ecrireProgression(niveauReprise) {
  if (apercu) return;
  try {
    JEL_SAVE.save(JEU, { niveau: clamp(niveauReprise, 1, NB_NIV), score: P.records.reduce((a, b) => a + b, 0), etoiles: P.etoiles.slice(), records: P.records.slice(),
      cles: P.cles.slice(), cabine: P.cabine, uniforme: P.uniforme, vus: P.vus.slice(), options: { son: !SON.muet } });

// Réglages hors partie (son, vestiaire) : écrits seulement si une sauvegarde existe déjà.

}

/* ---------- Sons (Web Audio, aucun fichier) ---------- */
const SON = { ctx: null, muet: false, maitre: null, moteur: null, moteurGain: null, bruitBuf: null, coeurT: 0 };
try { if (localStorage.getItem('ascenseur-noir-son') === '0') SON.muet = true; } catch (e) { /* rien */ }
let apercu = 0; // 1, 2 ou 3 : image du jeu pour sa page (window.JEL_APERCU)
function audio() {
  if (apercu || window.JEL_AFFICHE) return null;
  if (!SON.ctx) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      SON.ctx = new AC();
      SON.maitre = SON.ctx.createGain(); SON.maitre.gain.value = SON.muet ? 0 : 0.8; SON.maitre.connect(SON.ctx.destination);
      const n = SON.ctx.sampleRate; SON.bruitBuf = SON.ctx.createBuffer(1, n, n);
      const d = SON.bruitBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;

      SON.moteur = SON.ctx.createOscillator(); SON.moteur.type = 'sawtooth'; SON.moteur.frequency.value = 55;
      const f = SON.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380;

function souffle(dur, vol, freq, type, q, retard, freqFin) {

  const f = a.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.setValueAtTime(freq || 800, t0); f.Q.value = q || 1;

function son(nom) {

    case 'demarre': souffle(0.25, 0.12, 300, 'lowpass', 1); note(90, 0.25, 'sawtooth', 0.06, 140); break;
    case 'frein': souffle(0.35, 0.09, 2600, 'bandpass', 8, 0, 1800); break;
    case 'ding': note(1046, 0.5, 'sine', 0.16); note(1318, 0.5, 'sine', 0.1, 0, 0.09); break;
    case 'parfait': [784, 988, 1175, 1568].forEach((f, i) => note(f, 0.42, 'triangle', 0.13, 0, i * 0.06)); souffle(0.4, 0.05, 6000, 'highpass', 1); break;

// Volume et hauteur du moteur, à chaque image.
function majMoteur() {

/* ---------- État de la partie ---------- */
const G = {
  phase: 'titre', t: 0, niv: 0, L: null, rng: Math.random, cabs: [], crs: [], clients: [], sortants: [],
  livres: 0, partis: 0, parfaits: 0, score: 0, restant: 100, ecoule: 0, spawnT: 0, cle: null, cleGagnee: false,
  panne: { t: 0, noir: 0, alerte: 0 }, vent: { t: 0, force: 0, dur: 0, alerte: 0 }, eclair: 0, eclairT: 6,
  secousse: 0, particules: [], textes: [], introT: 0, finT: 0, finRaison: '', gele: false, noirFaux: 0, aideDouble: 0,

let vues = [];   // une vue par cabine (moitié d'écran en mode deux cabines)

function calculerVues() {
  const double = G.L && G.L.double;
  const n = double ? 2 : 1;
  vues = [];
  for (let i = 0; i < n; i++) {
    const x = (W / n) * i, w = W / n;
    const FH = Math.min(H / 5.1, double ? w * 0.85 : 9999, 210);
    const SW = Math.min(FH * 0.95, w * (double ? 0.44 : 0.36));
    const cx = x + w * (double ? 0.6 : 0.56);
    vues.push({ x, w, FH, SW, cx, cam: G.cabs[i] ? G.cabs[i].y : 1, s: i });
  }
}
// Écran : hauteur y (en étages) → pixel, pour une vue.
function ecranY(v, y) { return H * 0.47 + (v.cam - y) * v.FH; }

/* ---------- Démarrage d'une nuit ---------- */
function preparerNiveau(i) {
  const L = NIVEAUX[i];
  G.niv = i; G.L = L; G.rng = alea(1000 + i * 7919);
  G.t = 0; G.ecoule = 0; G.restant = L.duree; G.livres = 0; G.partis = 0; G.parfaits = 0; G.score = 0;
  G.clients = []; G.sortants = []; G.particules = []; G.textes = []; G.secousse = 0; G.gele = false;
  G.spawnT = 1.2; G.cleGagnee = false; G.finRaison = ''; G.noirFaux = 0;
  G.panne = { t: L.panne ? L.panne[0] * 0.7 : 0, noir: 0, alerte: 0 };
  G.vent = { t: L.vent ? L.vent * 0.8 : 0, force: 0, dur: 0, alerte: 0 };
  G.eclair = 0; G.eclairT = 5;
  G.aideDouble = L.double ? 6 : 0;
  const n = L.double ? 2 : 1;
  G.cabs = []; G.crs = [];
  for (let s = 0; s < n; s++) {
    G.cabs.push({ s, y: L.bas + (s === 1 ? 2 : 1), v: 0, etat: 'arret', press: 0, pressT: 0, depuisArret: false, chute: false, delai: 0,
      portesT: 0, portesEtage: null, ouvert: 0, passagers: [], aff: 0, affV: 0, grip: 0, dejaSorti: false, dernierEmbarq: 0, freinSon: false });
    G.crs.push({ s, h: L.bas - 1.8, hMin: L.bas - 1.8, bondT: L.bond ? L.bond * 0.8 : 0, bondAlerte: 0, bondDur: 0, off: 0, recule: 0, yeux: 1 });
  }
  // Étages qui clignotent (jamais le premier) et étage de la clé.
  G.clign = {};
  if (L.clign) for (let k = L.bas + 1; k <= L.haut; k++) if (G.rng() < L.clign) G.clign[k] = 1 + G.rng() * 5;
  const cleEtage = L.bas + 1 + Math.floor(G.rng() * (L.haut - L.bas));
  G.cle = P.cles[i] ? null : { etage: cleEtage, s: Math.floor(G.rng() * n), debut: 18 + G.rng() * 10, duree: 25, prise: false };
  calculerVues();
  for (const v of vues) v.cam = G.cabs[v.s].y + 0.3;
  // Deux premiers clients tout de suite.
  apparaitreClient(true); if (L.maxAtt > 2) apparaitreClient(true);

/* ---------- Clients ---------- */
function apparaitreClient(premier) {
  const L = G.L, r = G.rng;
  const n = G.cabs.length;
  const attente = G.clients.filter((c) => c.etat === 'attend');
  if (attente.length >= L.maxAtt) return;
  for (let essai = 0; essai < 8; essai++) {
    const s = Math.floor(r() * n);
    let f = L.bas + Math.floor(r() * (L.haut - L.bas + 1));
    const cab = G.cabs[s];
    if (cab.etat === 'portes' && cab.portesEtage === f) continue;
    if (G.crs[s].h > f - 0.6) continue;                         // la créature tient cet étage
    if (attente.filter((c) => c.s === s && c.f === f).length >= 3) continue;
    let d;
    do { d = L.bas + Math.floor(r() * (L.haut - L.bas + 1)); } while (d === f);
    const faux = !premier && L.faux && r() < L.faux;
    const presse = !faux && L.presse && r() < L.presse;
    const malle = !faux && L.malle && r() < L.malle;
    const pat = (presse ? 0.55 : 1) * L.patience * (faux ? 0.8 : 1);
    G.clients.push({ s, f, d, pat, patMax: pat, presse, malle, faux, etat: 'attend', x: -2, cible: 0, look: Math.floor(r() * 6), pas: r() * 6, tic: 0 });
    return;
  }
}
function clientsA(s, f) { return G.clients.filter((c) => c.etat === 'attend' && c.s === s && c.f === f); }

/* ---------- Entrées : appuyer / lâcher ---------- */
const pointeurs = new Map();  // pointeur → cabine
const touches = new Map();    // touche → cabine
function appuyer(s) {
  if (G.phase !== 'jeu' || G.gele) return;
  const c = G.cabs[clamp(s, 0, G.cabs.length - 1)];
  if (!c) return;
  audio();
  c.press++;
}
function lacher(s) {
  const c = G.cabs[clamp(s, 0, G.cabs.length - 1)];
  if (c && c.press > 0) c.press--;
}
function relacherTout() { pointeurs.clear(); touches.clear(); for (const c of G.cabs) c.press = 0; }
function cabineDuPoint(x) { return G.L && G.L.double ? (x < W / 2 ? 0 : 1) : 0; }
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (G.phase !== 'jeu') return;
  const s = cabineDuPoint(e.clientX);
  pointeurs.set(e.pointerId, s);
  try { cv.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
  appuyer(s);

function finPointeur(e) { if (pointeurs.has(e.pointerId)) { lacher(pointeurs.get(e.pointerId)); pointeurs.delete(e.pointerId); } }
cv.addEventListener('pointerup', finPointeur);
cv.addEventListener('pointercancel', finPointeur);

cv.addEventListener('contextmenu', (e) => e.preventDefault());
const TOUCHES_G = ['ArrowLeft', 'KeyF', 'KeyD', 'ShiftLeft'];
const TOUCHES_D = ['ArrowRight', 'KeyJ', 'KeyK', 'ShiftRight'];
const TOUCHES_1 = ['Space', 'ArrowUp', 'Enter', 'NumpadEnter', 'KeyW', 'KeyZ'];
window.addEventListener('keydown', (e) => {
  if (G.phase === 'tuto') { if (!e.repeat && (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter')) { e.preventDefault(); tutoSuivant(); } return; }
  if (G.phase === 'pause' && (e.code === 'Escape' || e.code === 'KeyP')) { e.preventDefault(); reprendre(); return; }
  if (G.phase !== 'jeu') return;
  if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); mettrePause(); return; }
  let s = -1;
  if (TOUCHES_G.includes(e.code)) s = 0;
  else if (TOUCHES_D.includes(e.code)) s = G.L.double ? 1 : 0;
  else if (TOUCHES_1.includes(e.code)) s = 0;
  if (s < 0) return;
  e.preventDefault();
  if (e.repeat || touches.has(e.code)) return;
  touches.set(e.code, s);
  appuyer(s);
});

/* ---------- Mouvement de la cabine ---------- */
function masse(c) { return 1 + 0.3 * c.passagers.filter((p) => p.malle).length; }
function majCabine(c, dt) {
  const L = G.L;
  const tenu = c.press > 0;
  // Effet visuel de l'arrêt (cabine qui se pose, câbles qui donnent du jeu).
  c.affV += (-c.aff * 160 - c.affV * 14) * dt; c.aff += c.affV * dt;
  if (Math.abs(c.aff) < 0.0005 && Math.abs(c.affV) < 0.001) { c.aff = 0; c.affV = 0; }

  if (c.etat === 'portes') { majPortes(c, dt, tenu); if (c.etat === 'portes') return; }
  if (c.etat === 'arret') {
    c.v = 0;
    if (!tenu) return;
    c.etat = 'mouv'; c.pressT = 0; c.depuisArret = true; c.chute = false; c.delai = L.cables ? 0.13 : 0; c.freinSon = false;
    son('demarre');
  }
  const m = masse(c);
  if (tenu) {
    c.pressT += dt;
    if (c.delai > 0) { c.delai -= dt; if (c.chute) c.v -= PHY.G / m * dt; }
    else {
      let a = (c.v < 0 ? PHY.ACC + PHY.FREIN : PHY.ACC) / m;
      if (c.depuisArret && c.pressT < PHY.TAP) a *= 0.5;
      c.v = Math.min(PHY.VMAX, c.v + a * dt);
    }
    c.freinSon = false;
  } else {
    if (c.depuisArret && c.pressT < PHY.TAP) {
      // Petit toucher depuis l'arrêt : le frein se décroche, la cabine descend.
      c.chute = true; c.v = Math.min(c.v, -0.45);
    }
    c.depuisArret = false;
    if (c.v > 0) {
      if (!c.freinSon && c.v > 1) { son('frein'); c.freinSon = true; poussiere(c); }
      c.v -= (PHY.G + PHY.FREIN) / m * dt;
      if (c.v <= 0) { c.v = 0; arreter(c); return; }
    } else {
      c.chute = true;
      c.v = Math.max(-PHY.VMAXD, c.v - PHY.G / m * dt);
    }
  }
  // Rafales de vent (toit).
  if (G.vent.dur > 0) c.v += G.vent.force * dt;
  c.y += c.v * dt;
  // Butées du puits.
  const plafond = L.haut + 0.32, fond = L.bas - 0.55;
  if (c.y > plafond) { c.y = plafond; c.v = Math.min(0, c.v); if (!tenu) arreter(c); }
  if (c.y < fond) { c.y = fond; c.v = 0; G.secousse = Math.max(G.secousse, 0.5); arreter(c); }
}
// La cabine vient de s'arrêter : parfait, bon ou raté ?
function arreter(c) {
  const L = G.L;
  c.etat = 'arret'; c.v = 0; c.chute = false;
  if (L.cables) { c.y -= 0.05; c.aff += 0.05; c.affV = -0.4; }   // les câbles usés laissent la cabine s'affaisser
  const k = Math.round(c.y), d = Math.abs(c.y - k);
  if (k < L.bas || k > L.haut || d >= PHY.BON) {
    // Arrêt raté : les portes restent fermées.
    son('rate'); G.secousse = Math.max(G.secousse, 0.45);
    G.crs[c.s].h += 0.12;
    texteFlottant(c.s, c.y + 0.6, T('fb.rate'), '#ff8a7a');
    return;
  }
  const parfait = d < PHY.PARFAIT;
  c.aff += c.y - k; c.y = k;
  // Y a-t-il quelque chose à faire à cet étage ?
  const action = c.passagers.some((p) => p.d === k) || clientsA(c.s, k).some((x) => !x.faux) || (G.cle && !G.cle.prise && G.cle.s === c.s && G.cle.etage === k && cleVisible());
  if (parfait && action) {
    G.parfaits++; G.score += 50;
    const cr = G.crs[c.s];
    cr.h = Math.max(cr.hMin, cr.h - 0.7); cr.recule = 1;
    son('parfait'); etincelles(c, '#ffd24a', 26);
    texteFlottant(c.s, k + 0.62, T('fb.parfait'), '#ffe27a', 1.3);
    if (G.cle && !G.cle.prise && G.cle.s === c.s && G.cle.etage === k && cleVisible()) {
      G.cle.prise = true; G.cleGagnee = true; son('cle'); etincelles(c, '#fff4b0', 30, -0.9);
      texteFlottant(c.s, k + 0.95, T('fb.cle'), '#fff4b0', 1.6);
    }
  } else {
    son('ding');
    if (parfait) etincelles(c, '#ffd24a', 8);
    texteFlottant(c.s, k + 0.62, parfait ? T('fb.parfait') : T('fb.bon'), parfait ? '#ffe27a' : '#e6dcc8', 0.9);
  }
  c.etat = 'portes'; c.portesT = 0; c.portesEtage = k; c.dejaSorti = false; c.dernierEmbarq = 0;
  son('portes');
}
// Portes ouvertes : on descend, on monte ; le faux client entre toujours en dernier.
function majPortes(c, dt, tenu) {
  const k = c.portesEtage;
  c.portesT += dt;
  const t = c.portesT;
  c.ouvert = t < 0.25 ? t / 0.25 : t < 1.3 ? 1 : Math.max(0, 1 - (t - 1.3) / 0.2);
  if (t >= 0.2 && !c.dejaSorti) {
    c.dejaSorti = true;
    const restent = [];
    for (const p of c.passagers) {
      if (p.d === k) {
        const gain = 100 + (p.presse ? 50 : 0);
        G.livres++; G.score += gain; p.etat = 'livre';
        texteFlottant(c.s, k + 0.3, '+' + NB(gain), '#9affc0');
        G.sortants.push({ s: c.s, f: k, x: 0, look: p.look, malle: p.malle, presse: p.presse, a: 1 });
        son('merci');
      } else restent.push(p);
    }
    c.passagers = restent;
    if (G.livres >= G.L.quota && G.phase === 'jeu' && G.finT <= 0) { G.finT = 1.1; G.finRaison = 'gagne'; }
  }
  if (t >= 0.38 && t < 1.25) {
    c.dernierEmbarq -= dt;
    if (c.dernierEmbarq <= 0) {
      const ici = clientsA(c.s, k);
      const vrai = ici.find((x) => !x.faux);
      if (vrai && c.passagers.length < G.L.cap) {
        vrai.etat = 'cabine'; c.passagers.push(vrai); c.dernierEmbarq = 0.16;
        son('clic'); etincelles(c, '#ffffff', 4);
      } else if (!vrai && t >= 0.95) {
        const faux = ici.find((x) => x.faux);
        if (faux) entreFaux(c, faux);
      }
    }
  }
  // Appuyer referme les portes (une fois les passagers sortis).
  if (tenu && t >= 0.22) { c.etat = 'arret'; c.ouvert = 0; son('portes'); return; }
  if (t >= 1.5) { c.etat = 'arret'; c.ouvert = 0; }
}
// Un faux client est entré : noir, cri, les passagers s'enfuient, la créature bondit.
function entreFaux(c, faux) {
  faux.etat = 'fini';
  son('faux'); G.noirFaux = 0.9; G.secousse = 1;
  const perdus = c.passagers.length;
  for (const p of c.passagers) { p.etat = 'fini'; G.sortants.push({ s: c.s, f: c.portesEtage, x: 0, look: p.look, malle: p.malle, presse: p.presse, a: 1, fuite: true }); }
  G.partis += perdus; c.passagers = [];
  G.crs[c.s].h += 1.2;
  texteFlottant(c.s, c.portesEtage + 0.6, T('fb.faux'), '#ff6a6a', 1.8);
  c.portesT = Math.max(c.portesT, 1.25);
}

/* ---------- La créature du puits ---------- */
function majCreature(cr, c, dt) {
  const L = G.L;
  let vit = L.vc;
  if (c.y - cr.h < 2) vit *= 1.8;          // attirée par la lumière de la cabine
  // Bond : la chose s'étire d'un coup (jusqu'à 1,4 étage plus haut) puis se rétracte.
  cr.off = 0;
  if (L.bond) {
    if (cr.bondDur > 0) { cr.bondDur -= dt; cr.off = 1.4 * Math.sin(Math.PI * clamp(1 - cr.bondDur / 1.3, 0, 1)); }
    else if (cr.bondAlerte > 0) { cr.bondAlerte -= dt; if (cr.bondAlerte <= 0) cr.bondDur = 1.3; }
    else { cr.bondT -= dt; if (cr.bondT <= 0) { cr.bondT = L.bond * (0.8 + G.rng() * 0.4); cr.bondAlerte = 1.2; son('grogne'); texteFlottant(c.s, cr.h + 0.6, T('fb.bond'), '#ff7a5a', 1.2); } }
  }
  cr.h += vit * dt;
  cr.recule = Math.max(0, cr.recule - dt * 1.5);
  const basCabine = c.y - 0.45;
  if (cr.h + cr.off >= basCabine) {
    if (c.grip === 0) { son('griffes'); texteFlottant(c.s, c.y + 0.7, T('fb.griffes'), '#ff5a4a', 1.1); }
    if (cr.h > basCabine + 0.02) cr.h = basCabine + 0.02;
    c.grip += dt; G.secousse = Math.max(G.secousse, 0.25);
    if (c.grip > 1.1 && G.phase === 'jeu' && G.finT <= 0) { G.finT = 0.9; G.finRaison = 'creature'; son('defaite'); }
  } else c.grip = Math.max(0, c.grip - dt * 2);
  // Les clients des étages que la créature atteint s'enfuient.
  for (const cl of G.clients) if (cl.etat === 'attend' && cl.s === cr.s && cr.h > cl.f - 0.5) { cl.etat = 'part'; if (!cl.faux) { G.partis++; son('parti'); } }
}

/* ---------- Une image de simulation ---------- */
function majJeu(dt) {
  const L = G.L;
  G.t += dt;
  if (G.introT > 0) { G.introT -= dt; }
  if (G.gele) return;
  if (G.finT > 0) {
    G.finT -= dt;
    for (const c of G.cabs) if (c.etat === 'portes') majPortes(c, dt, false);
    if (G.finT <= 0) terminerNuit(G.finRaison === 'gagne');
    return;
  }
  G.ecoule += dt; G.restant -= dt;
  if (G.restant <= 0) { G.restant = 0; G.finT = 0.6; G.finRaison = 'aube'; son('defaite'); return; }
  for (let i = 0; i < G.cabs.length; i++) { majCabine(G.cabs[i], dt); majCreature(G.crs[i], G.cabs[i], dt); }
  // Clients : arrivées, patience, départs.
  G.spawnT -= dt;
  if (G.spawnT <= 0) { G.spawnT = L.spawn * (0.75 + G.rng() * 0.5); apparaitreClient(false); }
  for (const cl of G.clients) {
    if (cl.etat !== 'attend') continue;
    cl.pat -= dt;
    if (cl.pat <= 0) { cl.etat = 'part'; if (!cl.faux) { G.partis++; son('parti'); texteFlottant(cl.s, cl.f + 0.5, T('fb.parti'), '#e0a080'); } }
  }
  G.clients = G.clients.filter((c) => c.etat === 'attend' || c.etat === 'cabine' || (c.etat === 'part' && (c.dep = (c.dep || 0) - dt) > -1.5));
  for (const s of G.sortants) { s.x -= dt * 2.2; s.a -= dt * 0.7; }
  G.sortants = G.sortants.filter((s) => s.a > 0);
  // Pannes de courant.
  if (L.panne) {
    const p = G.panne;
    if (p.noir > 0) { p.noir -= dt; if (p.noir <= 0) son('courant'); }
    else if (p.alerte > 0) { p.alerte -= dt; if (p.alerte <= 0) { p.noir = L.panne[1]; son('panne'); texteFlottant(0, G.cabs[0].y + 0.8, T('fb.panne'), '#ffd27a', 1); } }
    else { p.t -= dt; if (p.t <= 0) { p.t = L.panne[0] * (0.85 + G.rng() * 0.3); p.alerte = 0.8; } }
  }
  // Rafales (toit).
  if (L.vent) {
    const v = G.vent;
    if (v.dur > 0) { v.dur -= dt; if (v.dur <= 0) v.force = 0; }
    else if (v.alerte > 0) { v.alerte -= dt; if (v.alerte <= 0) { v.dur = 1.5; } }
    else { v.t -= dt; if (v.t <= 0) { v.t = L.vent * (0.8 + G.rng() * 0.4); v.alerte = 0.8; v.force = (G.rng() < 0.5 ? -1 : 1) * 1.1; son('vent'); texteFlottant(0, G.cabs[0].y + 0.8, T('fb.vent'), '#bfe4ff', 1); } }
  }
  if (L.aile === 3) { G.eclairT -= dt; if (G.eclairT <= 0) { G.eclairT = 6 + G.rng() * 7; G.eclair = 0.35; son('tonnerre'); } }
  // Battements de cœur quand la créature est proche.
  let proche = 99;
  for (let i = 0; i < G.cabs.length; i++) proche = Math.min(proche, G.cabs[i].y - 0.45 - G.crs[i].h);
  if (proche < 1.4) { SON.coeurT -= dt; if (SON.coeurT <= 0) { son('coeur'); SON.coeurT = 0.45 + proche * 0.4; } }
  if (G.aideDouble > 0) G.aideDouble -= dt;
}
function cleVisible() { return G.cle && !G.cle.prise && G.ecoule >= G.cle.debut && G.ecoule <= G.cle.debut + G.cle.duree; }

/* ---------- Effets ---------- */
function etincelles(c, col, n, vy) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 160;
    G.particules.push({ s: c.s, wy: c.y, px: (Math.random() - 0.5) * 30, py: 0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + (vy || 0) * 120, vie: 0.7 + Math.random() * 0.5, max: 1.2, col, r: 2 + Math.random() * 2.5 });
  }
}
function poussiere(c) {
  for (let i = 0; i < 10; i++) G.particules.push({ s: c.s, wy: c.y + 0.45, px: (Math.random() - 0.5) * 60, py: 0, vx: (Math.random() - 0.5) * 80, vy: -Math.random() * 40, vie: 0.8, max: 0.8, col: '#c8b8a0', r: 2 });
}
function texteFlottant(s, y, txt, col, dur) { G.textes.push({ s, y, txt, col, t: 0, dur: dur || 1 }); }
function majEffets(dt) {
  for (const p of G.particules) { p.px += p.vx * dt; p.py += p.vy * dt; p.vy += 220 * dt; p.vie -= dt; }
  G.particules = G.particules.filter((p) => p.vie > 0);
  for (const t of G.textes) t.t += dt;
  G.textes = G.textes.filter((t) => t.t < t.dur);
  G.secousse = Math.max(0, G.secousse - dt * 2.5);
  G.noirFaux = Math.max(0, G.noirFaux - dt);
  G.eclair = Math.max(0, G.eclair - dt);
}

/* ==========================================================================
   Dessin
   ========================================================================== */
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

// Lampe d'un étage : allumée ? (clignotement)
function lampeAllumee(k) {
  if (G.panne.noir > 0) return 0;
  if (G.panne.alerte > 0) return bruit1(Math.floor(G.t * 18)) > 0.5 ? 1 : 0.2;
  const f = G.clign && G.clign[k];
  if (!f) return 1;
  const ph = Math.floor((G.t + f * 3) * 7);
  return bruit1(ph + f * 13) > 0.42 ? 1 : 0;
}

// Un étage : mur, motif, portes de chambres, lampes, tapis.
function dessinerEtage(c, v, k, A, y0, FH, lum) {
  const x0 = v.x, x1 = v.x + v.w;
  const L = G.L;
  c.fillStyle = A.mur; c.fillRect(x0, y0, v.w, FH);
  // Motif du papier peint selon l'aile.
  c.globalAlpha = 0.5; c.fillStyle = A.motif;
  if (L.aile === 0) { for (let x = x0 - ((x0) % 28); x < x1; x += 28) c.fillRect(x, y0 + FH * 0.08, 6, FH * 0.55); }
  else if (L.aile === 1) {
    for (let x = x0 - (x0 % 40); x < x1 + 40; x += 40) for (let yy = 0; yy < 2; yy++) {
      const cy = y0 + FH * (0.18 + yy * 0.26), cx2 = x + (yy % 2) * 20;
      c.beginPath(); c.moveTo(cx2, cy - 10); c.lineTo(cx2 + 8, cy); c.lineTo(cx2, cy + 10); c.lineTo(cx2 - 8, cy); c.closePath(); c.fill();
    }
  } else if (L.aile === 2) {
    for (let yy = 0; yy < 6; yy++) for (let x = x0 - (x0 % 36) - (yy % 2) * 18; x < x1; x += 36) c.fillRect(x + 1, y0 + yy * FH * 0.11 + 1, 34, FH * 0.11 - 2);
  } else { for (let x = x0 - (x0 % 60); x < x1; x += 60) c.fillRect(x, y0, 3, FH * 0.66); }
  c.globalAlpha = 1;
  // Soubassement et tapis.
  c.fillStyle = A.bas; c.fillRect(x0, y0 + FH * 0.66, v.w, FH * 0.26);
  c.fillStyle = A.tapis; c.fillRect(x0, y0 + FH * 0.92, v.w, FH * 0.08);
  c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(x0, y0 + FH * 0.66, v.w, 3);
  // Décor le long du couloir (portes, tableaux, tuyaux, fenêtres).
  const pas = Math.max(120, FH * 1.25);
  const debut = Math.floor((x0 - v.cx) / pas) - 1;
  for (let i = debut; v.cx + i * pas < x1 + pas; i++) {
    const dx = v.cx + i * pas;
    if (Math.abs(dx - v.cx) < v.SW * 0.9 + FH * 0.4) continue;   // pas sur le palier
    const h = (i * 31 + k * 17) & 7;
    if (L.aile === 3) {
      // Grande fenêtre : pluie et lumières de la ville.
      const fw = FH * 0.5, fh = FH * 0.48, fx = dx - fw / 2, fy = y0 + FH * 0.12;
      c.fillStyle = '#0e1a2e'; c.fillRect(fx, fy, fw, fh);
      c.fillStyle = 'rgba(255,214,140,.7)'; for (let j = 0; j < 4; j++) c.fillRect(fx + ((j * 37 + i * 13) % (fw - 6)), fy + fh * 0.6 + (j % 2) * 6, 3, 4);
      c.strokeStyle = 'rgba(180,210,255,.35)'; c.lineWidth = 1; c.beginPath();
      for (let j = 0; j < 5; j++) { const rx = fx + ((j * 19 + G.t * 90 + i * 7) % fw); const ry = fy + ((j * 23 + G.t * 260) % fh); c.moveTo(rx, ry); c.lineTo(rx - 2, ry + 8); }
      c.stroke();
      c.strokeStyle = '#7a8aa8'; c.lineWidth = 3; c.strokeRect(fx, fy, fw, fh); c.beginPath(); c.moveTo(fx + fw / 2, fy); c.lineTo(fx + fw / 2, fy + fh); c.stroke();
    } else if (h < 4) {
      // Porte de chambre.
      const pw = FH * 0.34, ph = FH * 0.6, px = dx - pw / 2, py = y0 + FH * 0.32;
      c.fillStyle = L.aile === 2 ? '#3a3a2c' : '#3a2214'; c.fillRect(px, py, pw, ph);
      c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = 2; c.strokeRect(px + 4, py + 4, pw - 8, ph * 0.4); c.strokeRect(px + 4, py + ph * 0.5, pw - 8, ph * 0.44);
      c.fillStyle = '#e0b860'; c.beginPath(); c.arc(px + pw - 7, py + ph * 0.55, 2.5, 0, 7); c.fill();
      if (h === 1) { c.fillStyle = 'rgba(255,220,150,.35)'; c.fillRect(px, py + ph - 3, pw, 3); }  // lumière sous la porte
    } else if (h < 6) {
      // Tableau (formes simples, sans texte).
      const tw = FH * 0.3, th = FH * 0.24, tx = dx - tw / 2, ty = y0 + FH * 0.2;
      c.fillStyle = '#c99a3a'; c.fillRect(tx - 4, ty - 4, tw + 8, th + 8);
      c.fillStyle = h === 4 ? '#2a3a4a' : '#4a2a2a'; c.fillRect(tx, ty, tw, th);
      c.fillStyle = 'rgba(240,220,180,.55)'; c.beginPath(); c.arc(tx + tw * 0.5, ty + th * 0.45, th * 0.22, 0, 7); c.fill();
      c.fillRect(tx + tw * 0.45, ty + th * 0.62, tw * 0.1, th * 0.34);
    } else if (L.aile === 2) {
      c.fillStyle = '#6a7a5a'; c.fillRect(dx - pas / 2, y0 + FH * 0.06, pas, 7); c.fillStyle = '#4a5a3a'; c.fillRect(dx - 5, y0 + FH * 0.03, 10, 13);
    } else {
      // Plante en pot.
      c.fillStyle = '#5a3a22'; c.fillRect(dx - 10, y0 + FH * 0.76, 20, FH * 0.16);
      c.fillStyle = '#2f5a32'; for (let j = 0; j < 5; j++) { c.beginPath(); c.ellipse(dx + (j - 2) * 6, y0 + FH * (0.62 - Math.abs(j - 2) * 0.03), 5, FH * 0.14, (j - 2) * 0.35, 0, 7); c.fill(); }
    }
    // Applique murale (ou lustre au bal).
    const lx = dx + pas / 2, ly = y0 + FH * 0.24;
    if (Math.abs(lx - v.cx) > v.SW * 0.9) {
      c.fillStyle = '#b8893a'; c.fillRect(lx - 3, ly, 6, 12);
      if (lum > 0) {
        const g = c.createRadialGradient(lx, ly, 2, lx, ly, FH * 0.55);
        g.addColorStop(0, hexA(A.lampe, 0.55 * lum)); g.addColorStop(1, hexA(A.lampe, 0));
        c.fillStyle = g; c.fillRect(lx - FH * 0.55, ly - FH * 0.55, FH * 1.1, FH * 1.1);
        c.fillStyle = A.lampe; c.beginPath(); c.arc(lx, ly - 2, 5, 0, 7); c.fill();
      } else { c.fillStyle = '#3a3030'; c.beginPath(); c.arc(lx, ly - 2, 5, 0, 7); c.fill(); }
    }
  }
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a.toFixed(3) + ')';
}

// Personnage (client, passager ou faux client). x = centre, y = pieds, h = taille.
const TENUES_CLIENTS = [
  { manteau: '#2e3a5a', peau: '#e8c4a0', chapeau: '#1a1a22' }, { manteau: '#6a2a2a', peau: '#c08a60', chapeau: null },
  { manteau: '#3a4a2a', peau: '#f0d0b0', chapeau: '#3a2a1a' }, { manteau: '#5a4a6a', peau: '#8a5a3a', chapeau: null },
  { manteau: '#7a6a4a', peau: '#e0b890', chapeau: '#2a2a2a' }, { manteau: '#2a2a2a', peau: '#d8a880', chapeau: '#6a1a1a' },
];
function dessinerPersonne(c, x, y, h, o) {
  const t = TENUES_CLIENTS[(o.look || 0) % TENUES_CLIENTS.length];
  const w = h * 0.36;
  const revele = o.faux && o.revele;
  if (!o.faux && !o.sansOmbre) { c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(x, y, w * 0.7, h * 0.05, 0, 0, 7); c.fill(); }
  const jit = o.faux ? Math.sin(G.t * 23 + (o.look || 0)) * (revele ? 2 : 0.6) : 0;
  // Jambes.
  c.fillStyle = '#1a1418'; c.fillRect(x - w * 0.3, y - h * 0.32, w * 0.22, h * 0.32); c.fillRect(x + w * 0.08, y - h * 0.32, w * 0.22, h * 0.32);
  // Manteau.
  c.fillStyle = o.faux ? '#3a3640' : t.manteau;
  c.beginPath(); c.moveTo(x - w * 0.5, y - h * 0.28); c.lineTo(x - w * 0.38, y - h * 0.78); c.lineTo(x + w * 0.38, y - h * 0.78); c.lineTo(x + w * 0.5, y - h * 0.28); c.closePath(); c.fill();
  // Bras (très longs et griffus chez un faux client révélé).

let fileTuto = [], tutoType = '', tutoT0 = 0, apresTuto = null;

}

/* ---------- Lancement d'une nuit ---------- */
function lancerNiveau(i) {

  P.niveau = i + 1;
  const L = NIVEAUX[i];
  // Une nouveauté se montre à sa première apparition (et toujours à la 1re nuit).
  const liste = L.nouveau.filter((n) => TUTOS[n] && (!P.vus.includes(n) || i === 0));
  G.phase = 'tuto';

}
function mettrePause() {

}
function reprendre() {
  if (G.phase !== 'pause') return;

/* ---------- Fin d'une nuit ---------- */
function terminerNuit(gagne) {
  const i = G.niv, L = G.L;
  relacherTout();
  G.phase = 'fin';
  let etoiles = 0, nouveauRecord = false;
  if (gagne) {
    const bonus = Math.round(G.restant) * 5;
    G.score += bonus;
    etoiles = 1;
    if (G.parfaits >= Math.ceil(L.quota * 0.6)) etoiles = 2;
    if (G.parfaits >= Math.ceil(L.quota * 1.1)) etoiles = 3;
    P.etoiles[i] = Math.max(P.etoiles[i], etoiles);
    if (G.score > P.records[i]) { nouveauRecord = true; P.records[i] = G.score; }
    if (G.cleGagnee) P.cles[i] = 1;
    ecrireProgression(Math.min(NB_NIV, i + 2));
    son('victoire');
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
    if (P.etoiles.every((v) => v > 0)) { if (window.FMG) window.FMG.reportComplete({ stars: etoilesTotal(), maxStars: NIVEAUX.length * 3 }); }
  } else {
    ecrireProgression(i + 1);
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: i + 1 });
  }
  // Écran de bilan.
  $('finTitre').textContent = gagne ? T('fin.gagne') : T('fin.perdu');
  $('finSous').textContent = gagne ? T('nuitN', { n: NB(i + 1) }) + ' · ' + T('aile.' + L.aile) : (G.finRaison === 'aube' ? T('fin.aube') : T('fin.creature'));
  const spans = $('finEtoiles').querySelectorAll('span');
  spans.forEach((s) => s.classList.remove('on'));
  $('finEtoiles').classList.toggle('cache', !gagne);
  if (gagne) for (let k = 0; k < etoiles; k++) setTimeout(() => { spans[k].classList.add('on'); son('etoile'); }, 450 + k * 380);
  // Score qui défile.
  const cible = G.score, t0 = performance.now();
  const defile = () => { const k = Math.min(1, (performance.now() - t0) / 900); $('finScore').textContent = NB(Math.round(cible * k)); if (k < 1 && G.phase === 'fin') requestAnimationFrame(defile); };
  defile();
  $('finParfaits').textContent = T('fin.parfaits', { n: G.parfaits });
  $('finClients').textContent = T('fin.clients', { n: NB(G.livres), total: NB(L.quota) });
  $('finCle').textContent = G.cleGagnee ? T('fin.cle') : (P.cles[i] ? T('fin.cleDeja') : '');
  $('finRecord').textContent = gagne ? (nouveauRecord ? T('fin.record') : T('fin.recordAncien', { n: NB(P.records[i]) })) : (P.records[i] ? T('fin.recordAncien', { n: NB(P.records[i]) }) : '');
  $('finRecord').className = 'detailB' + (nouveauRecord ? ' record' : '');
  const bS = $('bSuivante');
  if (gagne) { bS.textContent = i + 1 < NB_NIV ? T('suivante') : T('bilan.voir'); }
  else bS.textContent = T('reessayer');

    son('clic');
    if (!gagne) lancerNiveau(i);
    else if (i + 1 < NB_NIV) lancerNiveau(i + 1);
    else montrerBilan();
  };
  montrer('ecranFin');
  if (gagne) confettis();
}

/* ==========================================================================
   Boucle principale
   ========================================================================== */
let dernier = performance.now();
function boucle(now) {
  const dt = Math.min(0.05, Math.max(0, (now - dernier) / 1000));
  dernier = now;
  if (window.JEL_AFFICHE) { dessinerAffiche(); requestAnimationFrame(boucle); return; }
  if (G.phase === 'titre' || G.phase === 'nuits' || G.phase === 'vestiaire' || G.phase === 'bilan') {
    if (!G.L) preparerDecorTitre();
    majDecorTitre(dt);
  } else if (G.phase === 'jeu') {
    if (apercu) G.t += dt; else majJeu(dt);
    majCameras(dt);
  } else if (G.phase === 'fin') {
    majCameras(dt);
    for (const c of G.cabs) if (c.etat === 'portes') majPortes(c, dt, false);
  }
  if (G.phase !== 'pause' && !apercu) majEffets(dt);
  if (G.phase === 'tuto') dessinerTuto(tutoType, (now - tutoT0) / 1000);
  if (G.L) dessinerJeu();
  majMoteur();
  requestAnimationFrame(boucle);
}

  $('bFinAccueil').addEventListener('click', () => { son('clic'); montrerTitre(); });
  $('bBilanNuits').addEventListener('click', () => { son('clic'); montrerNuits(); });
  $('bBilanVestiaire').addEventListener('click', () => { son('clic'); montrerVestiaire(); });
  $('bBilanAccueil').addEventListener('click', () => { son('clic'); montrerTitre(); });
  // Sauvegarde à la fermeture, seulement pendant une nuit.
  JEL_SAVE.surFermeture(() => {
    if (apercu || !G.L) return;
    if (G.phase === 'jeu' || G.phase === 'pause' || G.phase === 'tuto') ecrireProgression(G.niv + 1);
  });
}

/* ---------- Démarrage ---------- */
function init() {
  redim();
  try { chargerProgression(); } catch (e) { /* rien */ }
  appliquerSon();
  if (window.JEL_AFFICHE) {
    for (const e of ECRANS) $(e).classList.add('cache');
    $('hud').classList.add('cache');
    const cacher = () => document.querySelectorAll('.jel-langue').forEach((e) => { e.style.display = 'none'; });
    cacher(); setTimeout(cacher, 300);
    dessinerAffiche();
    requestAnimationFrame(boucle);
    return;
  }
  if (window.JEL_APERCU) { ouvrirApercu(Number(window.JEL_APERCU)); requestAnimationFrame(boucle); return; }
  brancher();
  montrerTitre();
  requestAnimationFrame(boucle);
}
init();
</script>
</body>
