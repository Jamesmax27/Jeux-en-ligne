<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],

    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }

      return Promise.resolve(c);

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +

    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });

  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });

      menu.append(li);

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)

        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);

      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();

      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();

    });

    });
    bouton.addEventListener('keydown', function (e) {

      e.stopPropagation();

      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {

    }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.

    try { texte = JSON.stringify(tout); } catch (e) { return false; }

      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>
  /* ---- Base ---------------------------------------------------------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #7cc6f2;
    font-family: ui-rounded, "Segoe UI", system-ui, sans-serif; color: #2b2340; -webkit-tap-highlight-color: transparent;
    touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid #ffcf3a; outline-offset: 2px; }
  .cache { display: none !important; }

  /* ---- Barre du haut et du bas pendant la partie ------------------------ */
  #hud { position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 6px;
    padding: max(6px, env(safe-area-inset-top)) 8px 6px; background: rgba(255,255,255,.82); box-shadow: 0 2px 8px rgba(0,0,0,.12); z-index: 5; }
  #hud .infos { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
  #hud .titre-niveau { font-weight: 800; font-size: 15px; }
  #hud .compteurs { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; font-weight: 700; color: #4a4170; }
  #hud .compteurs span.alerte { color: #d0342c; }
  #hud .compteurs span.ok { color: #2f8a3c; }
  .rond { min-width: 44px; min-height: 44px; border-radius: 14px; border: 0; background: #ffe7a8; color: #2b2340;
    display: inline-flex; align-items: center; justify-content: center; padding: 0 10px; font-weight: 800; font-size: 15px; box-shadow: 0 2px 0 #d9b45a; }
  .rond:active { transform: translateY(2px); box-shadow: none; }
  .ico-pause { width: 14px; height: 16px; border-left: 5px solid #2b2340; border-right: 5px solid #2b2340; }
  .ico-son { width: 22px; height: 18px; position: relative; display: inline-block; }
  .ico-son::before { content: ""; position: absolute; left: 0; top: 5px; width: 6px; height: 8px; background: #2b2340; border-radius: 2px; }
  .ico-son::after { content: ""; position: absolute; left: 4px; top: 1px; border-style: solid; border-width: 8px 9px 8px 0; border-color: transparent #2b2340 transparent transparent; }
  .ico-son i { position: absolute; right: 0; top: 3px; width: 8px; height: 12px; border: 3px solid #2b2340; border-left: 0; border-radius: 0 10px 10px 0; }
  .muet .ico-son i { border: 0; width: 12px; height: 3px; top: 8px; right: -2px; background: #d0342c; transform: rotate(45deg); border-radius: 2px; }
  #bas { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 10px;
    padding: 6px 8px max(6px, env(safe-area-inset-bottom)); z-index: 5; pointer-events: none; }
  #bas .rond { pointer-events: auto; background: rgba(255,255,255,.92); box-shadow: 0 2px 0 #b6b0c8; font-size: 14px; }

  /* ---- Écrans (titre, niveaux, fins…) ---------------------------------- */
  .ecran { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: max(12px, env(safe-area-inset-top)) 14px max(12px, env(safe-area-inset-bottom)); overflow-y: auto; touch-action: pan-y; }
  .voile { background: rgba(32,24,60,.55); }
  .carte { width: min(430px, 100%); background: #fffaf0; border-radius: 24px; padding: 18px 16px 14px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.3); border: 3px solid #ffd36b; animation: arrive .35s ease-out; }
  @keyframes arrive { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .carte h2 { margin: 2px 0 8px; font-size: 23px; line-height: 1.2; color: #3b2f6b; }
  .carte p { margin: 6px 0; font-size: 16px; line-height: 1.35; }
  .boutons { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }
  .bouton { min-height: 50px; border-radius: 999px; border: 0; padding: 8px 18px; font-size: 18px; font-weight: 800;
    background: #ffffff; color: #3b2f6b; box-shadow: 0 3px 0 #c9c0e0; }
  .bouton.principal { background: #ff8a3d; color: #fff; box-shadow: 0 4px 0 #c75c17; font-size: 21px; }
  .bouton.vert { background: #4cbf6b; color: #fff; box-shadow: 0 4px 0 #2e8a48; }
  .bouton:active { transform: translateY(3px); box-shadow: none; }
  .rangee { display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; }
  .rangee .bouton { flex: 1 1 140px; }

  /* Écran titre : texte en haut et boutons en bas, le dessin reste visible au milieu */
  #ecran-titre { justify-content: space-between; }
  #ecran-titre .haut { text-align: center; margin-top: 6px; width: min(520px, 100%); }
  #ecran-titre h1 { margin: 0; font-size: clamp(30px, 8.6vw, 50px); line-height: 1.05; color: #fff; font-weight: 900;
    text-shadow: 0 3px 0 #c75c17, 0 6px 14px rgba(60,30,0,.35); letter-spacing: .5px; }
  #ecran-titre .consigne { margin: 10px auto 0; max-width: 440px; font-size: 16px; line-height: 1.35; font-weight: 700; color: #2b2340;
    background: rgba(255,255,255,.85); border-radius: 16px; padding: 8px 12px; }
  #ecran-titre .bas { width: min(430px, 100%); display: flex; flex-direction: column; gap: 9px; }
  #ecran-titre .petit { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
  @media (min-aspect-ratio: 23/20) {
    #ecran-titre .haut { width: min(900px, 100%); }
    #ecran-titre h1 { font-size: clamp(30px, 6.5vh, 52px); }
    #ecran-titre .consigne { max-width: 640px; font-size: 15px; }
  }
  #ecran-titre .clavier { font-size: 13px; text-align: center; color: #2b2340; background: rgba(255,255,255,.7); border-radius: 10px; padding: 3px 8px; }

  /* Niveaux */
  .quartier { margin: 10px 0 4px; font-weight: 800; color: #6a4fb0; font-size: 15px; text-align: left; }
  .grille-niveaux { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .case-niveau { min-height: 60px; border-radius: 14px; border: 0; background: #fff; box-shadow: 0 3px 0 #c9c0e0; font-weight: 900; font-size: 19px; color: #3b2f6b;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 2px; }
  .case-niveau.fermee { background: #e4e0ee; color: #9a93b3; box-shadow: none; }
  .case-niveau .mini { display: flex; gap: 1px; }
  .etoile { display: inline-block; width: 13px; height: 13px; background: #d9d4e6;
    clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .etoile.pleine { background: #ffb800; }
  .cadenas { width: 16px; height: 14px; background: #9a93b3; border-radius: 3px; position: relative; margin-top: 6px; }
  .cadenas::before { content: ""; position: absolute; left: 3px; top: -8px; width: 6px; height: 7px; border: 2px solid #9a93b3; border-bottom: 0; border-radius: 6px 6px 0 0; }

  /* Fin de niveau */
  .grandes-etoiles { display: flex; justify-content: center; gap: 8px; margin: 6px 0 4px; }
  .grandes-etoiles .etoile { width: 54px; height: 54px; }
  .grandes-etoiles .etoile.pleine { animation: pop .5s both; }
  @keyframes pop { 0% { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.25) rotate(10deg); } 100% { transform: scale(1); } }
  .criteres { list-style: none; padding: 0; margin: 6px 0; text-align: left; font-size: 15px; }
  .criteres li { padding: 3px 0 3px 26px; position: relative; }
  .criteres li::before { content: ""; position: absolute; left: 2px; top: 5px; width: 16px; height: 16px; border-radius: 50%; background: #d9d4e6; }
  .criteres li.oui::before { background: #4cbf6b; box-shadow: inset 0 0 0 4px #4cbf6b, inset 0 0 0 8px #fff; }
  .record { font-weight: 800; color: #d06a00; }
  .gain { display: flex; align-items: center; gap: 10px; justify-content: center; margin: 8px 0 2px; font-weight: 700; }
  .gain canvas { width: 64px; height: 64px; }

  /* Collection et garage */
  .grille-autocollants { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
  .grille-autocollants canvas { width: 100%; aspect-ratio: 1; }
  .grille-garage { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
  .couleur { border: 3px solid transparent; border-radius: 16px; background: #fff; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 800; font-size: 14px; color: #3b2f6b; min-height: 44px; box-shadow: 0 3px 0 #c9c0e0; }
  .couleur canvas { width: 100%; height: auto; }
  .couleur.choisie { border-color: #ff8a3d; }
  .couleur.fermee { opacity: .6; }

  /* Tutoriel */
  #tuto .carte { max-width: 380px; }
  #tuto canvas { width: 100%; max-width: 320px; height: auto; aspect-ratio: 16 / 10; border-radius: 16px; background: #dff2ff; }
  #tuto ol { text-align: left; margin: 8px 0 0; padding-left: 22px; font-size: 16px; line-height: 1.35; }
  #tuto ol li { margin: 3px 0; }
  .langue-titre { display: inline-block; }
</style>
</head>
<body>
<canvas id="scene" data-i18n-aria="aria.scene" role="img"></canvas>

<!-- Barre du haut (partie) -->
<div id="hud" class="cache">
  <button id="b-pause" class="rond" type="button" data-i18n-aria="bouton.pause"><span class="ico-pause"></span></button>
  <div class="infos">
    <span class="titre-niveau" id="hud-niveau"></span>
    <span class="compteurs"><span id="hud-gestes"></span><span id="hud-trous"></span></span>
  </div>
  <button id="b-son-hud" class="rond b-son" type="button"><span class="ico-son"><i></i></span></button>
</div>
<div id="bas" class="cache">
  <button id="b-annuler" class="rond" type="button" data-i18n="bouton.annuler"></button>
  <button id="b-recommencer" class="rond" type="button" data-i18n="bouton.recommencer"></button>
</div>

<!-- Écran titre -->
<div id="ecran-titre" class="ecran">
  <div class="haut">
    <h1 data-i18n="titre.nom"></h1>
    <p class="consigne" data-i18n="titre.consigne"></p>
  </div>
  <div class="bas">
    <button id="b-jouer" class="bouton principal" type="button" data-i18n="bouton.jouer"></button>
    <div class="rangee">
      <button id="b-niveaux" class="bouton" type="button" data-i18n="bouton.niveaux"></button>
      <button id="b-maison" class="bouton" type="button" data-i18n="bouton.maison"></button>
    </div>
    <div class="petit">
      <button id="b-garage" class="bouton" type="button" data-i18n="bouton.garage"></button>
      <button id="b-son-titre" class="rond b-son" type="button"><span class="ico-son"><i></i></span></button>
      <span id="langue-titre" class="langue-titre"></span>
    </div>
    <div class="clavier" data-i18n="aide.clavier"></div>
  </div>
</div>

<!-- Niveaux -->
<div id="ecran-niveaux" class="ecran voile cache">
  <div class="carte">
    <h2 data-i18n="niveaux.titre"></h2>
    <div id="liste-niveaux"></div>
    <div class="boutons"><button id="b-niveaux-retour" class="bouton" type="button" data-i18n="bouton.retour"></button></div>
  </div>
</div>

<!-- Ma nouvelle maison (autocollants) -->
<div id="ecran-maison" class="ecran voile cache">
  <div class="carte">
    <h2 data-i18n="maison.titre"></h2>
    <p id="maison-texte"></p>
    <div id="grille-autocollants" class="grille-autocollants"></div>
    <div class="boutons"><button id="b-maison-retour" class="bouton" type="button" data-i18n="bouton.retour"></button></div>
  </div>
</div>

<!-- Garage (couleurs du camion) -->
<div id="ecran-garage" class="ecran voile cache">
  <div class="carte">
    <h2 data-i18n="garage.titre"></h2>
    <p data-i18n="garage.texte"></p>
    <div id="grille-garage" class="grille-garage"></div>
    <div class="boutons"><button id="b-garage-retour" class="bouton" type="button" data-i18n="bouton.retour"></button></div>
  </div>
</div>

<!-- Tutoriel animé -->
<div id="tuto" class="ecran voile cache">
  <div class="carte">
    <h2 id="tuto-titre"></h2>
    <canvas id="tuto-canvas" width="640" height="400"></canvas>
    <ol id="tuto-etapes"></ol>
    <div class="boutons"><button id="b-tuto" class="bouton principal" type="button" data-i18n="tuto.ok"></button></div>
  </div>
</div>

<!-- Pause -->
<div id="ecran-pause" class="ecran voile cache">
  <div class="carte">

/* ---------- Formes ---------------------------------------------------- */
function normaliser(cases) {
  let r0 = Infinity, c0 = Infinity;
  for (const [r, c] of cases) { if (r < r0) r0 = r; if (c < c0) c0 = c; }
  return cases.map(([r, c]) => [r - r0, c - c0]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
}
function tourner(forme) { // quart de tour dans le sens des aiguilles d'une montre
  let h = 0; for (const [r] of forme) h = Math.max(h, r + 1);
  return normaliser(forme.map(([r, c]) => [c, h - 1 - r]));
}
function cleForme(f) { return f.map((x) => x.join(',')).join(';'); }
function taille(f) { let w = 0, h = 0; for (const [r, c] of f) { h = Math.max(h, r + 1); w = Math.max(w, c + 1); } return { w, h }; }
function cleCanonique(f) { let k = [], x = f; for (let i = 0; i < 4; i++) { k.push(cleForme(x)); x = tourner(x); } return k.sort()[0]; }

// Prépare un niveau : grille des cases bloquées, meubles groupés en piles.
function preparer(i) {
  const N = NIVEAUX[i];
  const lignes = N.g.length, colonnes = N.g[0].length;
  const bloque = [];
  const cases = {};
  for (let r = 0; r < lignes; r++) {
    bloque.push([]);
    for (let c = 0; c < colonnes; c++) {
      const ch = N.g[r][c];
      bloque[r].push(ch === '#');
      if (ch !== '.' && ch !== '#') (cases[ch] = cases[ch] || []).push([r, c]);
    }
  }
  const groupes = [];
  let par = 0;
  for (const lettre of Object.keys(cases)) {
    const sorte = N.p[lettre];
    const solution = normaliser(cases[lettre]);
    let forme = solution;
    // arrive tourné dans l'autre sens : « t » touchers suffisent pour le remettre
    for (let k = 0; k < (4 - (N.t[lettre] || 0)) % 4; k++) forme = tourner(forme);
    // gestes minimaux : une pose + les quarts de tour pour retrouver la solution
    let tours = 0, x = forme;
    while (cleForme(x) !== cleForme(solution) && tours < 4) { x = tourner(x); tours++; }
    par += 1 + tours;
    const cle = sorte + '|' + cleCanonique(forme);
    let g = groupes.find((x2) => x2.cle === cle);
    if (g) g.nombre++;
    else groupes.push({ cle, sorte, forme, nombre: 1, id: groupes.length });
  }
  const objectif = par + Math.floor(par / 5);
  return { lignes, colonnes, bloque, groupes, par, objectif, limite: objectif * 2 + 4 };
}

  prog.records = Array.from({ length: n }, (_, i) => (d && Array.isArray(d.records) && Number.isInteger(d.records[i]) ? d.records[i] : 0));
  prog.couleur = d && Number.isInteger(d.couleur) && COULEURS_CAMION[d.couleur] ? d.couleur : 1;
  if (d && d.options && typeof d.options.son === 'boolean') prog.son = d.options.son;
  try { const s = localStorage.getItem('camion-demenagement-son'); if (s === '0') prog.son = false; if (s === '1') prog.son = true; } catch (e) { /* stockage indisponible */ }
  let max = d && Number.isInteger(d.niveau) ? d.niveau : 1;
  prog.etoiles.forEach((e, i) => { if (e > 0) max = Math.max(max, i + 2); });
  prog.niveauMax = Math.max(1, Math.min(n, max));
}
function totalEtoiles() { return prog.etoiles.reduce((a, b) => a + b, 0); }

/* ---------- Sons (Web Audio, aucun avant la première action) ------------- */
let audioCtx = null;
function audio() {
  if (!prog.son) return null;

    if (audioCtx.state === 'suspended') audioCtx.resume();

}
function ton(f, d, type, v, f2, retard) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime + (retard || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v || 0.15, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.05);
}
function bruit(d, v, freq, retard) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime + (retard || 0);
  const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * d), ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const s = ac.createBufferSource(); s.buffer = buf;
  const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = freq || 800;
  const g = ac.createGain(); g.gain.value = v || 0.2;
  s.connect(fl).connect(g).connect(ac.destination); s.start(t0);
}

function rr(c, x, y, w, h, r) { // rectangle arrondi
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function eclaircir(hex, k) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r + (255 - r) * k); g = Math.round(g + (255 - g) * k); b = Math.round(b + (255 - b) * k);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function pictoPoids(c, x, y, s) {

  c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.arc(x - s * 0.15, y, s * 0.1, 0, Math.PI * 2); c.fill();
}

  c.quadraticCurveTo(x - s * 0.22, y + s * 0.02, x - s * 0.25, y - s * 0.32); c.fill();

// Dessine un meuble : forme (cases relatives), en (x, y), taille de case k.
function dessinerMeuble(c, nomSorte, forme, x, y, k, opt) {
  opt = opt || {};
  const S = sorteDe(nomSorte);
  const { w, h } = taille(forme);
  const dans = new Set(forme.map(([r, cc]) => r + ',' + cc));
  const a = (r, cc) => dans.has(r + ',' + cc);
  c.save();
  if (opt.alpha != null) c.globalAlpha = opt.alpha;
  const i1 = Math.max(1, k * 0.05), i2 = Math.max(2, k * 0.11);
  const teinte = S.teinte ? TEINTES[S.teinte] : null;
  const dessineCorps = S.base !== 'lampe' && S.base !== 'plante';
  // Corps : union des cases (bord foncé puis intérieur clair, jointures comprises).
  if (dessineCorps) {
    for (const [pass, ins, coul] of [[0, i1, S.bord], [1, i2, opt.rouge ? '#ff9a9a' : S.corps]]) {
      c.fillStyle = coul;
      for (const [r, cc] of forme) {
        const px = x + cc * k, py = y + r * k;
        rr(c, px + ins, py + ins, k - ins * 2, k - ins * 2, k * (pass ? 0.12 : 0.16)); c.fill();
        if (a(r, cc + 1)) c.fillRect(px + k - ins - 1, py + ins, ins * 2 + 2, k - ins * 2);
        if (a(r + 1, cc)) c.fillRect(px + ins, py + k - ins - 1, k - ins * 2, ins * 2 + 2);
        if (a(r, cc + 1) && a(r + 1, cc) && a(r + 1, cc + 1)) c.fillRect(px + k - ins - 1, py + k - ins - 1, ins * 2 + 2, ins * 2 + 2);
      }
    }
  }
  // Décor propre à chaque sorte, case par case.
  const L = w >= h; // couché (plus large que haut)
  for (const [r, cc] of forme) {
    const px = x + cc * k, py = y + r * k, m = k * 0.16;
    switch (S.base) {
      case 'canape': case 'canapeL': {
        c.fillStyle = eclaircir(S.corps, -0.0); c.fillStyle = S.bord; c.globalAlpha *= 0.35;
        rr(c, px + m, py + m, k - 2 * m, k * 0.3, k * 0.08); c.fill(); c.globalAlpha = opt.alpha != null ? opt.alpha : 1;
        c.fillStyle = eclaircir(S.corps, 0.35); rr(c, px + m, py + k * 0.5, k - 2 * m, k * 0.3, k * 0.1); c.fill();
        break;
      }
      case 'table': case 'bureauL': {
        c.fillStyle = S.bord; c.fillRect(px + m * 0.6, py + m * 0.8, k - m * 1.2, k * 0.14);
        c.fillRect(px + k * 0.22, py + k * 0.4, k * 0.08, k * 0.42); c.fillRect(px + k * 0.7, py + k * 0.4, k * 0.08, k * 0.42);
        if (S.base === 'bureauL') { c.fillStyle = eclaircir(S.corps, 0.4); rr(c, px + k * 0.35, py + k * 0.42, k * 0.3, k * 0.16, 3); c.fill(); }
        break;
      }
      case 'chaise': {
        c.fillStyle = S.bord; c.fillRect(px + k * 0.25, py + k * 0.2, k * 0.12, k * 0.62);
        c.fillRect(px + k * 0.25, py + k * 0.5, k * 0.5, k * 0.1); c.fillRect(px + k * 0.63, py + k * 0.5, k * 0.1, k * 0.32);
        break;
      }
      case 'tapis': {
        c.strokeStyle = eclaircir(S.corps, 0.45); c.lineWidth = k * 0.08;
        for (let s = 0.3; s < 0.8; s += 0.22) { c.beginPath(); if (L) { c.moveTo(px + k * s, py + m); c.lineTo(px + k * s, py + k - m); } else { c.moveTo(px + m, py + k * s); c.lineTo(px + k - m, py + k * s); } c.stroke(); }
        break;
      }
      case 'commode': case 'buffetL': {
        c.strokeStyle = S.bord; c.lineWidth = Math.max(1, k * 0.05);
        c.beginPath(); c.moveTo(px + m, py + k * 0.5); c.lineTo(px + k - m, py + k * 0.5); c.stroke();
        c.fillStyle = '#ffe08a'; c.beginPath(); c.arc(px + k / 2, py + k * 0.33, k * 0.05, 0, 7); c.arc(px + k / 2, py + k * 0.68, k * 0.05, 0, 7); c.fill();
        break;
      }
      case 'coffre': case 'banc': {
        c.fillStyle = S.bord; c.fillRect(px + m, py + k * 0.36, k - 2 * m, k * 0.08);
        c.fillStyle = '#ffe08a'; c.fillRect(px + k * 0.44, py + k * 0.34, k * 0.12, k * 0.18);
        break;
      }
      case 'frigo': {
        c.strokeStyle = S.bord; c.lineWidth = Math.max(1, k * 0.04);
        c.beginPath(); c.moveTo(px + m, py + k * 0.32); c.lineTo(px + k - m, py + k * 0.32); c.stroke();
        c.fillStyle = S.bord; c.fillRect(px + k * 0.7, py + k * 0.45, k * 0.07, k * 0.3);
        break;
      }
      case 'armoire': case 'etagere': {
        if (S.base === 'armoire') {
          c.strokeStyle = S.bord; c.lineWidth = Math.max(1, k * 0.05);
          c.beginPath(); c.moveTo(px + k / 2, py + m); c.lineTo(px + k / 2, py + k - m); c.stroke();
          c.fillStyle = '#ffe08a'; c.beginPath(); c.arc(px + k * 0.42, py + k / 2, k * 0.045, 0, 7); c.arc(px + k * 0.58, py + k / 2, k * 0.045, 0, 7); c.fill();
        } else {
          c.fillStyle = S.bord; c.fillRect(px + m, py + k * 0.78, k - 2 * m, k * 0.07);
          const livres = ['#e86a6a', '#5ea8ff', '#5fcf6a', '#ffcf3a'];
          for (let b = 0; b < 4; b++) { c.fillStyle = livres[(b + r + cc) % 4]; c.fillRect(px + m + b * k * 0.16, py + k * (0.34 + (b % 2) * 0.06), k * 0.12, k * (0.44 - (b % 2) * 0.06)); }
        }
        break;
      }
      case 'piano': {
        if (!a(r + 1, cc)) {
          c.fillStyle = '#fff'; c.fillRect(px + 2, py + k * 0.28, k - 4, k * 0.22);
          c.fillStyle = '#16131f'; for (let b = 1; b < 4; b++) c.fillRect(px + b * k / 4 - k * 0.04, py + k * 0.28, k * 0.08, k * 0.13);
        } else { c.fillStyle = '#5a5378'; rr(c, px + k * 0.2, py + k * 0.25, k * 0.6, k * 0.4, 4); c.fill(); }
        break;
      }
      case 'vaisselle': case 'verres': {
        c.fillStyle = 'rgba(255,255,255,.85)';
        if (S.base === 'vaisselle') { c.beginPath(); c.ellipse(px + k * 0.42, py + k * 0.55, k * 0.24, k * 0.24, 0, 0, 7); c.fill(); c.strokeStyle = S.bord; c.lineWidth = 1.5; c.beginPath(); c.arc(px + k * 0.42, py + k * 0.55, k * 0.14, 0, 7); c.stroke(); }
        else {
          for (const dx of [0.32, 0.66]) { c.beginPath(); c.moveTo(px + k * (dx - 0.1), py + k * 0.3); c.lineTo(px + k * (dx + 0.1), py + k * 0.3); c.lineTo(px + k * dx, py + k * 0.55); c.fill(); c.fillRect(px + k * dx - 1.5, py + k * 0.55, 3, k * 0.15); }
        }
        break;
      }
      case 'miroir': {
        c.fillStyle = '#a8d8f5'; rr(c, px + m, py + m, k - 2 * m, k - 2 * m, k * 0.1); c.fill();
        c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = k * 0.07; c.beginPath(); c.moveTo(px + k * 0.3, py + k * 0.65); c.lineTo(px + k * 0.6, py + k * 0.3); c.stroke();
        break;
      }
      case 'lit': {
        c.fillStyle = teinte || '#ccc'; rr(c, px + i2, py + k * 0.42, k - i2 * 2 + (a(r, cc + 1) ? i2 * 2 : 0), k * 0.4, k * 0.06); c.fill();
        break;
      }
      case 'carton': {
        c.fillStyle = '#f0d39c'; c.fillRect(px + k * 0.44, py + i2, k * 0.12, k - i2 * 2); c.fillRect(px + i2, py + k * 0.44, k - i2 * 2, k * 0.08);
        break;
      }
      default: break;
    }
  }
  // Décors d'ensemble.
  if (S.base === 'lit') { // oreiller blanc au bout
    const [r0, c0] = L ? forme.reduce((b, p) => (p[1] < b[1] ? p : b)) : forme.reduce((b, p) => (p[0] < b[0] ? p : b));
    c.fillStyle = '#ffffff'; rr(c, x + c0 * k + k * 0.18, y + r0 * k + k * 0.22, k * 0.5, k * 0.28, k * 0.12); c.fill();
  }
  if (S.base === 'lampe') {
    const [rb, cb] = forme.reduce((b, p) => (p[0] > b[0] ? p : b));
    const [rh] = forme.reduce((b, p) => (p[0] < b[0] ? p : b));
    const cx = x + cb * k + k / 2, haut = y + rh * k, bas = y + (rb + 1) * k;
    c.fillStyle = 'rgba(255,230,120,.35)'; c.beginPath(); c.arc(cx, haut + k * 0.45, k * 0.55, 0, 7); c.fill();
    c.fillStyle = '#7a6a50'; c.fillRect(cx - k * 0.05, haut + k * 0.6, k * 0.1, bas - haut - k * 0.75);
    c.fillStyle = '#7a6a50'; rr(c, cx - k * 0.28, bas - k * 0.2, k * 0.56, k * 0.12, 4); c.fill();
    c.fillStyle = opt.rouge ? '#ff9a9a' : '#ffd84a'; c.beginPath(); c.moveTo(cx - k * 0.2, haut + k * 0.12); c.lineTo(cx + k * 0.2, haut + k * 0.12);
    c.lineTo(cx + k * 0.38, haut + k * 0.62); c.lineTo(cx - k * 0.38, haut + k * 0.62); c.closePath(); c.fill();
    c.strokeStyle = '#c9a43a'; c.lineWidth = 2; c.stroke();
  }
  if (S.base === 'plante') {
    const [rb, cb] = forme.reduce((b, p) => (p[0] > b[0] ? p : b));
    const [rh] = forme.reduce((b, p) => (p[0] < b[0] ? p : b));
    const cx = x + cb * k + k / 2, haut = y + rh * k, bas = y + (rb + 1) * k;
    c.fillStyle = opt.rouge ? '#ff9a9a' : '#d9773a';
    c.beginPath(); c.moveTo(cx - k * 0.28, bas - k * 0.42); c.lineTo(cx + k * 0.28, bas - k * 0.42); c.lineTo(cx + k * 0.2, bas - k * 0.08); c.lineTo(cx - k * 0.2, bas - k * 0.08); c.closePath(); c.fill();
    c.strokeStyle = '#3f8a2a'; c.lineWidth = k * 0.06; c.beginPath(); c.moveTo(cx, bas - k * 0.42); c.lineTo(cx, haut + k * 0.3); c.stroke();

    }

    const cx = x + k / 2, cy = y + k / 2, t2 = teinte || '#ccc';
    if (S.teinte === 'bleu') { // ballon
      c.fillStyle = t2; c.beginPath(); c.arc(cx, cy + k * 0.04, k * 0.3, 0, 7); c.fill();
      c.strokeStyle = '#fff'; c.lineWidth = k * 0.06; c.beginPath(); c.arc(cx, cy + k * 0.04, k * 0.3, -0.6, 0.9); c.stroke();
      c.beginPath(); c.moveTo(cx - k * 0.3, cy + k * 0.04); c.lineTo(cx + k * 0.3, cy + k * 0.04); c.stroke();

      c.fillStyle = '#fff'; c.beginPath(); c.arc(cx - k * 0.15, cy - k * 0.13, k * 0.06, 0, 7); c.arc(cx + k * 0.15, cy - k * 0.13, k * 0.06, 0, 7); c.fill();
      c.fillStyle = '#222'; c.beginPath(); c.arc(cx - k * 0.15, cy - k * 0.12, k * 0.03, 0, 7); c.arc(cx + k * 0.15, cy - k * 0.12, k * 0.03, 0, 7); c.fill();

      c.fillStyle = '#c98a4a'; c.beginPath(); c.arc(cx - k * 0.2, cy - k * 0.2, k * 0.1, 0, 7); c.arc(cx + k * 0.2, cy - k * 0.2, k * 0.1, 0, 7); c.fill();

      c.fillStyle = '#f2d0a8'; c.beginPath(); c.ellipse(cx, cy + k * 0.08, k * 0.12, k * 0.09, 0, 0, 7); c.fill();
      c.fillStyle = '#222'; c.beginPath(); c.arc(cx - k * 0.09, cy - k * 0.05, k * 0.03, 0, 7); c.arc(cx + k * 0.09, cy - k * 0.05, k * 0.03, 0, 7); c.arc(cx, cy + k * 0.05, k * 0.035, 0, 7); c.fill();
      c.fillStyle = t2; c.beginPath(); c.moveTo(cx, cy + k * 0.28); c.lineTo(cx - k * 0.16, cy + k * 0.2); c.lineTo(cx - k * 0.16, cy + k * 0.38); c.closePath();
      c.moveTo(cx, cy + k * 0.28); c.lineTo(cx + k * 0.16, cy + k * 0.2); c.lineTo(cx + k * 0.16, cy + k * 0.38); c.closePath(); c.fill();
    }
    // petite pastille de la couleur du lit
    c.fillStyle = t2; c.beginPath(); c.arc(x + k * 0.84, y + k * 0.16, k * 0.1, 0, 7); c.fill();
  }
  if (S.base === 'lit' && teinte) { c.fillStyle = teinte; }
  // Pictogrammes des règles, dans le coin haut droit de la case la plus en haut à droite.
  const coin = forme.reduce((b, p) => (p[0] < b[0] || (p[0] === b[0] && p[1] > b[1]) ? p : b));
  const ps = Math.max(7, k * 0.26), qx = x + coin[1] * k + k - ps * 0.8, qy = y + coin[0] * k + ps * 0.8;

  if (S.fragile) pictoVerre(c, qx, qy, ps);

  c.restore();
}

// Pompon, le petit lapin déménageur (casquette, salopette).
function dessinerPompon(c, x, y, s, humeur, temps) {
  c.save(); c.translate(x, y);
  const saut = humeur === 'content' ? -Math.abs(Math.sin(temps * 10)) * s * 0.15 : 0;
  const secoue = humeur === 'non' ? Math.sin(temps * 30) * s * 0.06 : 0;
  c.translate(secoue, saut);
  c.fillStyle = 'rgba(0,0,0,.15)'; c.beginPath(); c.ellipse(0, 0, s * 0.35, s * 0.08, 0, 0, 7); c.fill();
  // oreilles
  c.fillStyle = '#f4f1f8';
  c.beginPath(); c.ellipse(-s * 0.13, -s * 1.12, s * 0.08, s * 0.24, -0.15, 0, 7); c.ellipse(s * 0.13, -s * 1.12, s * 0.08, s * 0.24, 0.15, 0, 7); c.fill();
  c.fillStyle = '#ffc2d6'; c.beginPath(); c.ellipse(-s * 0.13, -s * 1.1, s * 0.04, s * 0.17, -0.15, 0, 7); c.ellipse(s * 0.13, -s * 1.1, s * 0.04, s * 0.17, 0.15, 0, 7); c.fill();
  // corps (salopette bleue)
  c.fillStyle = '#3f7fd8'; rr(c, -s * 0.24, -s * 0.5, s * 0.48, s * 0.46, s * 0.14); c.fill();
  c.fillStyle = '#f4f1f8'; c.beginPath(); c.arc(-s * 0.26, -s * 0.34, s * 0.08, 0, 7); c.arc(s * 0.26, -s * 0.34, s * 0.08, 0, 7); c.fill();
  c.fillStyle = '#2b2340'; rr(c, -s * 0.22, -s * 0.06, s * 0.18, s * 0.07, 3); c.fill(); rr(c, s * 0.04, -s * 0.06, s * 0.18, s * 0.07, 3); c.fill();
  c.fillStyle = '#ffcf3a'; c.beginPath(); c.arc(-s * 0.12, -s * 0.42, s * 0.03, 0, 7); c.arc(s * 0.12, -s * 0.42, s * 0.03, 0, 7); c.fill();
  // tête
  c.fillStyle = '#f4f1f8'; c.beginPath(); c.arc(0, -s * 0.7, s * 0.26, 0, 7); c.fill();
  c.fillStyle = '#ffb3c8'; c.beginPath(); c.arc(-s * 0.15, -s * 0.63, s * 0.05, 0, 7); c.arc(s * 0.15, -s * 0.63, s * 0.05, 0, 7); c.fill();
  c.fillStyle = '#2b2340';
  if (humeur === 'fatigue') { c.lineWidth = 2; c.strokeStyle = '#2b2340'; c.beginPath(); c.moveTo(-s * 0.13, -s * 0.73); c.lineTo(-s * 0.05, -s * 0.73); c.moveTo(s * 0.05, -s * 0.73); c.lineTo(s * 0.13, -s * 0.73); c.stroke(); }
  else { c.beginPath(); c.arc(-s * 0.09, -s * 0.74, s * 0.035, 0, 7); c.arc(s * 0.09, -s * 0.74, s * 0.035, 0, 7); c.fill(); }
  c.fillStyle = '#ff7aa2'; c.beginPath(); c.arc(0, -s * 0.66, s * 0.03, 0, 7); c.fill();
  c.strokeStyle = '#2b2340'; c.lineWidth = Math.max(1.2, s * 0.025); c.beginPath();
  if (humeur === 'non' || humeur === 'fatigue') c.arc(0, -s * 0.55, s * 0.06, Math.PI + 0.4, -0.4); else c.arc(0, -s * 0.62, s * 0.07, 0.3, Math.PI - 0.3);
  c.stroke();
  // casquette rouge
  c.fillStyle = '#e8574f'; c.beginPath(); c.arc(0, -s * 0.84, s * 0.2, Math.PI, 0); c.fill(); rr(c, 0, -s * 0.87, s * 0.3, s * 0.06, 3); c.fill();
  c.restore();
}

// Camion vu de côté : caisse (grille), cabine à droite, portes à gauche.
function dessinerCamion(c, gx, gy, colonnes, lignes, k, couleurIdx, opt) {
  opt = opt || {};
  const C = COULEURS_CAMION[couleurIdx] || COULEURS_CAMION[1];
  const largeur = colonnes * k, hauteur = lignes * k;
  const bas = gy + hauteur;
  // cabine
  const hc = Math.min(hauteur, k * 2.2) * 0.95, cx = gx + largeur + k * 0.1;
  c.fillStyle = C.c; rr(c, cx, bas - hc, k * 1.6, hc + k * 0.25, k * 0.35); c.fill();
  c.fillStyle = '#cfefff'; rr(c, cx + k * 0.55, bas - hc + k * 0.18, k * 0.85, hc * 0.42, k * 0.18); c.fill();
  c.fillStyle = 'rgba(255,255,255,.6)'; c.fillRect(cx + k * 0.7, bas - hc + k * 0.25, k * 0.12, hc * 0.3);
  c.fillStyle = '#ffd84a'; rr(c, cx + k * 1.45, bas - k * 0.25, k * 0.15, k * 0.2, 3); c.fill();
  c.fillStyle = C.f; c.fillRect(cx + k * 0.25, bas - hc * 0.4, k * 0.25, k * 0.06);
  // caisse
  if (C.or) { const g = c.createLinearGradient(gx, gy, gx + largeur, bas); g.addColorStop(0, '#ffe27a'); g.addColorStop(0.5, '#f0b53c'); g.addColorStop(1, '#ffd35a'); c.fillStyle = g; }
  else c.fillStyle = C.c;
  rr(c, gx - k * 0.18, gy - k * 0.18, largeur + k * 0.36, hauteur + k * 0.42, k * 0.25); c.fill();
  c.fillStyle = '#fbf6ec'; c.fillRect(gx, gy, largeur, hauteur);
  c.strokeStyle = 'rgba(120,100,80,.18)'; c.lineWidth = 1;
  for (let i = 1; i < colonnes; i++) { c.beginPath(); c.moveTo(gx + i * k, gy); c.lineTo(gx + i * k, bas); c.stroke(); }
  for (let j = 1; j < lignes; j++) { c.beginPath(); c.moveTo(gx, gy + j * k); c.lineTo(gx + largeur, gy + j * k); c.stroke(); }
  // châssis et roues
  c.fillStyle = '#4a4458'; c.fillRect(gx - k * 0.1, bas + k * 0.24, largeur + k * 1.7, k * 0.14);
  const rayon = k * 0.4, angle = opt.roues || 0;
  for (const rx of [gx + k * 0.9, gx + largeur + k * 0.85]) {
    c.fillStyle = '#2b2635'; c.beginPath(); c.arc(rx, bas + k * 0.5, rayon, 0, 7); c.fill();
    c.fillStyle = '#c9c4d6'; c.beginPath(); c.arc(rx, bas + k * 0.5, rayon * 0.45, 0, 7); c.fill();

// Portes arrière : ouverture 0 (fermées) à 1 (grandes ouvertes).

}

// Décor du quartier (derrière le camion).
function dessinerDecor(c, q, x, y, w, h, sol, temps) {
  const Q = QUARTIERS[q];
  const g = c.createLinearGradient(0, y, 0, sol); g.addColorStop(0, Q.ciel[0]); g.addColorStop(1, Q.ciel[1]);
  c.fillStyle = g; c.fillRect(x, y, w, sol - y);
  // nuages
  c.fillStyle = 'rgba(255,255,255,.85)';
  for (let i = 0; i < 3; i++) {
    const nx = x + ((i * 0.37 + temps * 0.01) % 1.2) * w - w * 0.1, ny = y + h * (0.08 + i * 0.06);
    c.beginPath(); c.arc(nx, ny, h * 0.035, 0, 7); c.arc(nx + h * 0.04, ny - h * 0.015, h * 0.045, 0, 7); c.arc(nx + h * 0.09, ny, h * 0.035, 0, 7); c.fill();
  }

    const couleurs = ['#f7c59f', '#b8e0d2', '#f2a6a6', '#d6c1f0', '#fde49c'];
    for (let i = 0; i < 6; i++) {
      const mw = w / 5.2, mx = x + i * mw * 1.02 - mw * 0.3, mh = hs * (0.38 + (i % 3) * 0.08);
      c.fillStyle = couleurs[i % 5]; c.fillRect(mx, sol - mh, mw * 0.92, mh);
      c.fillStyle = '#c0564a'; c.beginPath(); c.moveTo(mx - 4, sol - mh); c.lineTo(mx + mw * 0.46, sol - mh - mw * 0.35); c.lineTo(mx + mw * 0.96, sol - mh); c.fill();
      c.fillStyle = '#ffffff'; c.fillRect(mx + mw * 0.15, sol - mh + mh * 0.2, mw * 0.22, mw * 0.2); c.fillRect(mx + mw * 0.55, sol - mh + mh * 0.2, mw * 0.22, mw * 0.2);
    }
  } else if (q === 1) { // ferme : collines, grange, clôture
    c.fillStyle = '#9fd36a'; c.beginPath(); c.ellipse(x + w * 0.25, sol, w * 0.45, hs * 0.35, 0, Math.PI, 0); c.fill();
    c.fillStyle = '#8cc85a'; c.beginPath(); c.ellipse(x + w * 0.8, sol, w * 0.4, hs * 0.28, 0, Math.PI, 0); c.fill();
    const bx = x + w * 0.62, bw = w * 0.22, bh = hs * 0.32;
    c.fillStyle = '#d94a3a'; c.fillRect(bx, sol - bh, bw, bh); c.beginPath(); c.moveTo(bx - 6, sol - bh); c.lineTo(bx + bw / 2, sol - bh - bw * 0.45); c.lineTo(bx + bw + 6, sol - bh); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 3; c.strokeRect(bx + bw * 0.3, sol - bh * 0.6, bw * 0.4, bh * 0.6);
    c.fillStyle = '#f4f0e0'; for (let i = 0; i < 12; i++) c.fillRect(x + i * w / 11, sol - hs * 0.1, 5, hs * 0.1);
    c.fillRect(x, sol - hs * 0.08, w, 4);
  } else if (q === 2) { // immeubles
    for (let i = 0; i < 5; i++) {
      const bw = w / 4.6, bx = x + i * bw * 1.05 - bw * 0.2, bh = hs * (0.55 + ((i * 7) % 4) * 0.08);
      c.fillStyle = ['#c9c2e6', '#e6d2c2', '#c2dbe6', '#e6c2d6', '#d8e6c2'][i]; c.fillRect(bx, sol - bh, bw, bh);
      c.fillStyle = '#fffbe0';
      for (let r = 0; r < 6; r++) for (let cc = 0; cc < 3; cc++) { const wy = sol - bh + 10 + r * bh / 6.5; if (wy < sol - 12) c.fillRect(bx + 8 + cc * (bw - 16) / 3, wy, (bw - 16) / 3 - 6, bh / 13); }
    }

    c.fillStyle = '#ffd84a'; c.beginPath(); c.arc(x + w * 0.82, y + hs * 0.22, hs * 0.1, 0, 7); c.fill();
    c.fillStyle = '#3fb0e0'; c.fillRect(x, sol - hs * 0.3, w, hs * 0.3);
    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 2;
    for (let i = 0; i < 8; i++) { const vx = x + ((i * 0.13 + temps * 0.02) % 1) * w; c.beginPath(); c.arc(vx, sol - hs * 0.18 + (i % 3) * 8, 8, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); }

  }

/* ---------- État de la partie ------------------------------------------ */
let etat = 'titre';      // titre | jeu | tuto | pause | depart | fin
let niv = 0;             // index du niveau
let P = null;            // niveau préparé
let poses = [];          // meubles posés : { id, sorte, forme, r, c, groupe }
let occ = [];            // occ[r][c] : id du meuble, -1 vide, -2 bloqué
let gestes = 0;
let historique = [];
let prochainId = 1;
let drag = null;         // meuble tenu au doigt
let clavier = { sel: 0, tenu: null }; // jeu au clavier
let anims = [];          // chutes de meubles
let particules = [];
let message = null;      // bulle de Pompon { texte, t }
let humeur = 'normal', humeurT = 0;
let secousse = 0;
let clignote = { ids: [], t: 0 };
let depart = null;       // animation des portes et du camion
let enPartie = false;
let L = {};              // mise en page

function construireOcc() {
  occ = [];
  for (let r = 0; r < P.lignes; r++) { occ.push([]); for (let c = 0; c < P.colonnes; c++) occ[r].push(P.bloque[r][c] ? -2 : -1); }

}
function meuble(id) { return poses.find((m) => m.id === id); }
function libre(forme, r0, c0, ignorer) {
  for (const [r, c] of forme) {
    const R = r0 + r, C = c0 + c;
    if (R < 0 || C < 0 || R >= P.lignes || C >= P.colonnes) return false;
    const v = occ[R][C];

// Le meuble lâché en (r0, c0) descend jusqu'à son appui. Renvoie la place finale et si les règles l'acceptent.
function atterrir(sorte, forme, r0, c0, ignorer) {
  const { w, h } = taille(forme);

  r0 = Math.max(0, Math.min(P.lignes - h, r0));
  // Lâché sur d'autres meubles : il se pose par-dessus.
  while (r0 >= 0 && !libre(forme, r0, c0, ignorer)) r0--;
  if (r0 < 0) return { ok: false, raison: 'place', r: 0, c: c0 };
  while (libre(forme, r0 + 1, c0, ignorer)) r0++;
  const regle = verifierRegles(sorte, forme, r0, c0, ignorer);

}
function verifierRegles(sorte, forme, r0, c0, ignorer) {
  const S = sorteDe(sorte);
  const a = (R, C) => (R >= 0 && C >= 0 && R < P.lignes && C < P.colonnes ? occ[R][C] : -3);
  const dans = new Set(forme.map(([r, c]) => (r0 + r) + ',' + (c0 + c)));
  for (const [r, c] of forme) {
    const R = r0 + r, C = c0 + c;
    const dessous = a(R + 1, C), dessus = a(R - 1, C);
    const mDessous = dessous >= 0 && dessous !== ignorer && !dans.has((R + 1) + ',' + C) ? sorteDe(meuble(dessous).sorte) : null;
    const mDessus = dessus >= 0 && dessus !== ignorer && !dans.has((R - 1) + ',' + C) ? sorteDe(meuble(dessus).sorte) : null;
    if (S.lourd && mDessous && mDessous.fragile) return { ok: false, raison: 'fragile', cases: [[R + 1, C]] };
    if (S.fragile && mDessus && mDessus.lourd) return { ok: false, raison: 'fragile', cases: [[R - 1, C]] };
    if (mDessous && mDessous.debout) return { ok: false, raison: 'debout', cases: [[R + 1, C]] };

}
function aQuelqueChoseDessus(m) {
  for (const [r, c] of m.forme) {
    const R = m.r + r - 1, C = m.c + c;
    if (R >= 0 && occ[R][C] >= 0 && occ[R][C] !== m.id) return true;
  }

}
function compterTrous() {
  let n = 0;
  for (let c = 0; c < P.colonnes; c++) {
    let couvert = false;
    for (let r = 0; r < P.lignes; r++) {
      const v = occ[r][c];
      if (v === -2) couvert = false;
      else if (v >= 0) couvert = true;

}
function trayRestant() { return P.groupes.reduce((a, g) => a + g.nombre, 0); }

  const seuls = [];
  for (const m of poses) {
    const S = sorteDe(m.sorte);
    if (!S.jouet) continue;
    let ok = false;
    for (const [r, c] of m.forme) for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const R = m.r + r + dr, C = m.c + c + dc;
      if (R < 0 || C < 0 || R >= P.lignes || C >= P.colonnes) continue;
      const v = occ[R][C];
      if (v >= 0 && v !== m.id) { const S2 = sorteDe(meuble(v).sorte); if (S2.base === 'lit' && S2.teinte === S.teinte) ok = true; }
    }

function memoriser() { historique.push(JSON.stringify({ poses, groupes: P.groupes.map((g) => ({ nombre: g.nombre, forme: g.forme })) })); if (historique.length > 80) historique.shift(); }
function annuler() {
  if (etat !== 'jeu' || !historique.length || drag || clavier.tenu) return;
  const e = JSON.parse(historique.pop());
  poses = e.poses; e.groupes.forEach((g, i) => { P.groupes[i].nombre = g.nombre; P.groupes[i].forme = g.forme; });
  construireOcc(); compterGeste(); SON.clic(); majHud();
}
function compterGeste() {
  gestes++;
  majHud();

  Promise.resolve().then(() => { if (etat === 'jeu' && P && gestes >= P.limite) perdre(); });
  if (gestes === P.limite - 3) dire(T('msg.fatigue'), 'non');
}

/* ---------- Démarrer un niveau ----------------------------------------- */
function lancerNiveau(i) {
  niv = Math.max(0, Math.min(NIVEAUX.length - 1, i));
  P = preparer(niv);
  poses = []; historique = []; gestes = 0; prochainId = 1; anims = []; particules = []; drag = null;
  clavier = { sel: 0, tenu: null }; message = null; depart = null; clignote = { ids: [], t: 0 }; humeur = 'normal';
  construireOcc();
  enPartie = true;
  try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (e) { /* rien */ }
  cacherEcrans();
  document.getElementById('hud').classList.remove('cache');
  document.getElementById('bas').classList.remove('cache');
  etat = 'jeu';
  mettreEnPage(); majHud();
  const nouveau = NIVEAUX[niv].n;
  if (nouveau) montrerTuto(nouveau);
  else dire(T('msg.debut.' + (niv % 3)), 'content');
}
function majHud() {
  if (!P) return;
  document.getElementById('hud-niveau').textContent = T('hud.niveau', { n: niv + 1, quartier: T('quartier.' + NIVEAUX[niv].q) });
  const eg = document.getElementById('hud-gestes');
  eg.textContent = T('hud.gestes', { n: gestes, max: P.objectif });
  eg.className = gestes > P.objectif ? 'alerte' : '';
  const tr = compterTrous();
  const et = document.getElementById('hud-trous');
  et.textContent = T('hud.trous', { n: tr });
  et.className = tr > 0 ? 'alerte' : (poses.length ? 'ok' : '');
}
function dire(texte, h) { message = { texte, t: 2.8 }; if (h) { humeur = h; humeurT = 1.2; } }

/* ---------- Mise en page ------------------------------------------------ */
function mettreEnPage() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  toile.width = Math.round(W * DPR); toile.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!P) return;
  const hud = document.getElementById('hud'), bas = document.getElementById('bas');
  const hHaut = hud.classList.contains('cache') ? 0 : hud.offsetHeight;
  const hBas = bas.classList.contains('cache') ? 0 : bas.offsetHeight;
  const paysage = W > H * 1.15 && W >= 600;
  const uW = P.colonnes + 2.4, uH = P.lignes + 2.6;
  let k, scene, tray;
  if (paysage) {
    const sw = W * 0.6;
    k = Math.min((sw - 20) / uW, (H - hHaut - hBas - 10) / uH, 84);
    scene = { x: 0, y: hHaut, w: sw, h: H - hHaut - hBas };
    tray = { x: sw + 6, y: hHaut + 10, w: W - sw - 14, h: H - hHaut - hBas - 20 };
  } else {
    const dispo = H - hHaut - hBas;
    k = Math.min((W - 14) / uW, (dispo * 0.6) / uH, 76);
    const sh = k * uH;
    scene = { x: 0, y: hHaut, w: W, h: sh };
    tray = { x: 8, y: hHaut + sh + 4, w: W - 16, h: H - hBas - (hHaut + sh) - 8 };
  }
  const largeurCamion = k * uW;
  const gx = scene.x + (scene.w - largeurCamion) / 2 + k * 0.5;
  const gy = scene.y + k * 1.25;
  L = { k, scene, tray, gx, gy, sol: gy + P.lignes * k + k * 0.9, paysage };
  placerPlateau();
}
function placerPlateau() {
  const tr = L.tray, groupes = P.groupes.filter((g) => g.nombre > 0);
  const n = Math.max(1, groupes.length);
  let S = Math.min(120, tr.h);
  for (; S > 40; S -= 2) { const par = Math.max(1, Math.floor(tr.w / S)); if (Math.ceil(n / par) * S <= tr.h) break; }
  const par = Math.max(1, Math.floor(tr.w / S));
  const lignes = Math.ceil(n / par);
  const x0 = tr.x + (tr.w - Math.min(n, par) * S) / 2, y0 = tr.y + Math.max(0, (tr.h - lignes * S) / 2) * 0.3;
  L.cases = groupes.map((g, i) => ({ g, x: x0 + (i % par) * S, y: y0 + Math.floor(i / par) * S, s: S }));

}

/* ---------- Dessin de la partie ----------------------------------------- */
let tempsTotal = 0;
function dessinerJeu(dt) {
  const k = L.k, q = NIVEAUX[niv].q;
  ctx.clearRect(0, 0, W, H);
  dessinerDecor(ctx, q, 0, 0, W, H, L.sol, tempsTotal);
  // trottoir (pavés)
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  for (let x = 0; x < W; x += 40) for (let y = L.sol + 14; y < H; y += 26) ctx.fillRect(x + ((y / 26) % 2) * 20, y, 36, 22);
  ctx.save();
  let dx = 0;
  if (secousse > 0) { dx = Math.sin(tempsTotal * 60) * secousse * 6; }
  let decalCamion = 0;
  if (depart && depart.phase === 'route') decalCamion = Math.pow(depart.t, 2) * W * 0.9;
  ctx.translate(dx + decalCamion, 0);
  dessinerCamion(ctx, L.gx, L.gy, P.colonnes, P.lignes, k, prog.couleur, { roues: decalCamion / (k * 0.4) });
  // cases bloquées : passage de roue (en bas) ou planche
  for (let r = 0; r < P.lignes; r++) for (let c = 0; c < P.colonnes; c++) if (P.bloque[r][c]) {
    const x = L.gx + c * k, y = L.gy + r * k;
    if (r === P.lignes - 1) { ctx.fillStyle = '#6a6478'; rr(ctx, x + 2, y + k * 0.15, k - 4, k * 0.85, k * 0.4); ctx.fill(); ctx.fillStyle = '#4a4458'; ctx.beginPath(); ctx.arc(x + k / 2, y + k, k * 0.32, Math.PI, 0); ctx.fill(); }
    else { ctx.fillStyle = '#c08a4a'; ctx.fillRect(x - 1, y + k * 0.3, k + 2, k * 0.4); ctx.fillStyle = '#9a6a35'; ctx.fillRect(x - 1, y + k * 0.62, k + 2, k * 0.08); ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(x - 1, y, k + 2, k * 0.3); ctx.fillRect(x - 1, y + k * 0.7, k + 2, k * 0.3); }
  }

  for (const m of poses) {
    const an = anims.find((a) => a.id === m.id);
    let y = L.gy + m.r * k;
    if (an) y = L.gy + (an.de + (m.r - an.de) * easeBounce(Math.min(1, an.t / an.d))) * k;
    if (drag && drag.source === 'grille' && drag.id === m.id) continue;
    if (clavier.tenu && clavier.tenu.id === m.id) continue;
    dessinerMeuble(ctx, m.sorte, m.forme, L.gx + m.c * k, y, k, { clignote: clignote.t > 0 && clignote.ids.includes(m.id) && Math.floor(tempsTotal * 6) % 2 === 0 });
  }

  for (let c = 0; c < P.colonnes; c++) {
    let couvert = false;

      else if (couvert) { ctx.strokeStyle = 'rgba(230,60,60,.7)'; ctx.setLineDash([4, 4]); ctx.lineWidth = 2; rr(ctx, L.gx + c * k + 4, L.gy + r * k + 4, k - 8, k - 8, k * 0.2); ctx.stroke(); ctx.setLineDash([]); }
    }

    const cb = tenu.cible;

    ctx.fillStyle = cb.ok ? '#4cbf6b' : '#e04a4a';
    for (const [r, c] of tenu.forme) { rr(ctx, L.gx + (cb.c + c) * k + 3, L.gy + (cb.r + r) * k + 3, k - 6, k - 6, k * 0.15); ctx.fill(); }

/* ---------- Clavier ---------------------------------------------------- */

const lisse = (t) => t * t * (3 - 2 * t);
function animerTuto(dt) {

      dessinerMeuble(c, 'vaisselle', [[0, 0]], gx, gy + k, k, {});
      if (u < 0.5) {
        const p = lisse(Math.min(1, u / 0.3));

        c.fillStyle = '#fff'; c.font = '800 22px ui-rounded, system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(NB(reste), 40 + k, Ht * 0.6 + 1);

function dessinerTitre() {

  const sol = H * (large ? 0.62 : 0.68);
  dessinerDecor(ctx, 0, 0, 0, W, H, sol, tempsTotal);
  const k = Math.min(W / 9.5, H / (large ? 14 : 12), 70);
  // maison de la famille Lapinou
  const mx = W * 0.5 - k * 4.4, mw = k * 3.2, mh = k * 2.6;
  ctx.fillStyle = '#ffd9a8'; ctx.fillRect(mx, sol - mh, mw, mh);
  ctx.fillStyle = '#e8574f'; ctx.beginPath(); ctx.moveTo(mx - k * 0.3, sol - mh); ctx.lineTo(mx + mw / 2, sol - mh - k * 1.4); ctx.lineTo(mx + mw + k * 0.3, sol - mh); ctx.fill();
  ctx.fillStyle = '#8a5a2c'; rr(ctx, mx + mw * 0.38, sol - k * 1.3, k * 0.8, k * 1.3, 8); ctx.fill();
  ctx.fillStyle = '#cfefff'; ctx.fillRect(mx + k * 0.3, sol - mh + k * 0.5, k * 0.7, k * 0.6); ctx.fillRect(mx + mw - k, sol - mh + k * 0.5, k * 0.7, k * 0.6);
  // camion ouvert, à moitié chargé
  const col = 4, lig = 3, gx = W * 0.5 - k * 1.2, gy = sol - k * 0.9 - lig * k;
  dessinerCamion(ctx, gx, gy, col, lig, k, prog.couleur, {});
  dessinerMeuble(ctx, 'canape', [[0, 0], [0, 1]], gx, gy + 2 * k, k, {});
  dessinerMeuble(ctx, 'frigo', [[0, 0], [1, 0]], gx + 3 * k, gy + k, k, {});
  dessinerMeuble(ctx, 'vaisselle', [[0, 0]], gx + 2 * k, gy + 2 * k, k, {});
  dessinerMeuble(ctx, 'carton', [[0, 0]], gx + 3 * k, gy, k, {});

function mettreEnPause() {
  if (etat !== 'jeu') return;
  etat = 'pause'; drag = null;
  if (audioCtx && audioCtx.state === 'running') { try { audioCtx.suspend(); } catch (e) { /* rien */ } }
  ouvrir('ecran-pause');
  setTimeout(() => { try { document.getElementById('b-reprendre').focus(); } catch (e) { /* rien */ } }, 50);
}
function reprendre() {
  if (etat !== 'pause') return;
  document.getElementById('ecran-pause').classList.add('cache');
  etat = 'jeu'; avant = performance.now();
  if (audioCtx && prog.son) { try { audioCtx.resume(); } catch (e) { /* rien */ } }
  SON.clic();
}
function jouer() {
  audio(); SON.clic();
  const reprise = () => window.JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => { lireProgression(); lancerNiveau(Math.max(1, Math.min(NIVEAUX.length, d.niveau)) - 1); },
    onNouvelle: () => { lancerNiveau(0); },
    onEffacer: () => { lireProgression(); lancerNiveau(0); },
  });
  if (window.JEL_SAVE) reprise(); else lancerNiveau(0);
}

document.getElementById('b-jouer').addEventListener('click', jouer);
document.getElementById('b-niveaux').addEventListener('click', () => { audio(); SON.clic(); ouvrirNiveaux(); });
document.getElementById('b-maison').addEventListener('click', () => { audio(); SON.clic(); ouvrirMaison(); });
document.getElementById('b-garage').addEventListener('click', () => { audio(); SON.clic(); ouvrirGarage(); });
document.getElementById('b-niveaux-retour').addEventListener('click', () => { SON.clic(); allerTitre(); });
document.getElementById('b-maison-retour').addEventListener('click', () => { SON.clic(); allerTitre(); });
document.getElementById('b-garage-retour').addEventListener('click', () => { SON.clic(); allerTitre(); });
document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); audio(); basculerSon(); }));
document.getElementById('b-pause').addEventListener('click', () => { audio(); SON.clic(); mettreEnPause(); });
document.getElementById('b-reprendre').addEventListener('click', reprendre);
document.getElementById('b-pause-recommencer').addEventListener('click', () => { SON.clic(); lancerNiveau(niv); });
document.getElementById('b-pause-niveaux').addEventListener('click', () => { SON.clic(); ouvrirNiveaux(); });
document.getElementById('b-pause-accueil').addEventListener('click', () => { SON.clic(); allerTitre(); });
document.getElementById('b-annuler').addEventListener('click', (e) => { audio(); annuler(); e.currentTarget.blur(); });
document.getElementById('b-recommencer').addEventListener('click', (e) => { audio(); e.currentTarget.blur(); if (etat === 'jeu') { SON.clic(); lancerNiveau(niv); } });
document.getElementById('b-tuto').addEventListener('click', (e) => { e.stopPropagation(); audio(); fermerTuto(); });
document.getElementById('b-fin-rejouer').addEventListener('click', () => { SON.clic(); lancerNiveau(niv); });
document.getElementById('b-fin-niveaux').addEventListener('click', () => { SON.clic(); ouvrirNiveaux(); });

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') mettreEnPause(); });
window.addEventListener('resize', () => { mettreEnPage(); });

// Sauvegarde à la fermeture de la page, seulement pendant une partie.
if (window.JEL_SAVE) window.JEL_SAVE.surFermeture(() => { if (enPartie) sauver(niv + 1); });

/* ---------- Démarrage ------------------------------------------------- */
lireProgression();
majBoutonsSon();
if (window.JEL_I18N) {
  window.JEL_I18N.creerSelecteur({ conteneur: document.getElementById('langue-titre'), isole: true });
  window.JEL_I18N.creerSelecteur({ conteneur: document.getElementById('langue-pause'), isole: true });
}
mettreEnPage();
requestAnimationFrame(boucle);
</script>
</body>
</html>
