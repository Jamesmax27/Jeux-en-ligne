<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>
  /* ===== Mise en page générale ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }

    height: 100%; overflow: hidden; background: #cdeee8;
    font-family: system-ui, sans-serif; color: #24324a;

  #outil svg { width: 100%; height: 100%; display: block; }

  /* Fiche du patient et cartes : jamais plus de 60 % de l'écran (téléphone
     couché, petit écran) ; au-delà, le panneau défile au doigt. */
  #panneau {
    background: #fff; padding: 8px 10px 10px; min-height: 140px; z-index: 2;

// Réglages de difficulté de chaque journée (1 à 10).
function cfgJour(j) {
  const k = Math.max(0, j - 2), m = Math.max(0, j - 3), s = Math.max(0, j - 5);
  return {
    patients: [3, 3, 4, 4, 4, 5, 5, 5, 6, 6][j - 1],
    calme: 1.05 - 0.035 * (j - 1),          // durée d'un battement calme (s)
    rapide: 0.62 - 0.018 * (j - 1),         // durée d'un battement rapide (s)
    fenetre: 0.2 - 0.012 * (j - 1),         // marge pour toucher au bon moment (s)
    battements: j < 4 ? 3 : j < 9 ? 4 : 5,
    duree: 1.8 + 0.15 * k,                  // temps de mesure du thermomètre (s)
    calmeMin: 2.2 - 0.12 * k, calmeMax: 3.2 - 0.17 * k, alerte: 0.55 - 0.025 * k,
    amp: 8 + 4 * m, ondes: j < 6 ? 1 : j < 9 ? 2 : 3, tol: 30 - 1.5 * m,
    loupeR: j >= 8 ? 40 : 54 - (j - 1), points: j >= 8 ? 5 : j >= 4 ? 4 : 3,
    cartes: [3, 4, 4, 5, 5, 5, 6, 6, 6, 6][j - 1],
    sales: j < 5 ? 0 : j < 7 ? 1 : 2, taches: 3 + Math.floor(s / 2), frotter: 70 + 10 * s,
    bulles: 5 + s, vitBulles: 18 + 7 * s,
    attente: j >= 7, controles: j === 9 ? 1 : j === 10 ? 2 : 0,
  };
}

function creerPatient(esp, nom, mal) {
  return { esp, nom, mal, sale: false, boue: [], urgence: 1, controle: false, ref: null, gueri: false, soigne: false,
    perte: 0, bonus: 0, indices: [], soinDonne: null, pansement: false, etapes: [], iEtape: -1 };
}
const nomComplet = (p) => traduire('complet.' + p.esp.id, { nom: p.nom });
const accord = (p, m, f) => (p.esp.f ? f : m);

function genererPatients(j, cfg) {
  const maux = Object.keys(MAUX).filter((k) => MAUX[k].jour <= j);
  const nouveaux = melange(Object.keys(MAUX).filter((k) => MAUX[k].jour === j));
  const especes = melange(ESPECES.slice()), noms = melange(NOMS.slice());
  const liste = [];
  let dernier = null;
  for (let i = 0; i < cfg.patients - cfg.controles; i++) {
    let mal;
    if (i < nouveaux.length) mal = nouveaux[i];
    else do { mal = pioche(maux); } while (mal === dernier && maux.length > 1);
    dernier = mal;
    const p = creerPatient(especes[i % especes.length], noms[i], mal);
    p.urgence = entier(1, 3);
    liste.push(p);
  }
  // Patients tout sales (brosse et bain avant les examens).
  melange(liste.slice()).slice(0, cfg.sales).forEach((p) => {
    p.sale = true;
    const places = melange([[-40, 60], [42, 105], [-22, -100], [34, -112], [-55, 118], [10, 30], [62, 55], [-62, 20]]);
    p.boue = places.slice(0, cfg.taches).map(([x, y]) => ({ x, y, r: hasard(15, 21), a: 1 }));
  });
  // Contrôles : un patient déjà soigné revient plus tard dans la journée.
  for (let c = 0; c < cfg.controles; c++) {
    const ref = liste[c];
    const ctrl = creerPatient(ref.esp, ref.nom, ref.mal);
    ctrl.controle = true; ctrl.ref = ref; ctrl.urgence = 1;
    liste.splice(Math.min(liste.length, 3 + c * 2), 0, ctrl);
  }
  return liste;
}

function ell(c, x, y, rx, ry, col, rot = 0) { c.fillStyle = col; c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); c.fill(); }

function assombrir(hex, f) {

  return `rgb(${r},${g},${b})`;
}

  c.beginPath(); c.moveTo(x, y + s);
  c.bezierCurveTo(x - s * 1.6, y - s * 0.2, x - s * 0.7, y - s * 1.3, x, y - s * 0.45);
  c.bezierCurveTo(x + s * 0.7, y - s * 1.3, x + s * 1.6, y - s * 0.2, x, y + s);

function rectArrondi(c, x, y, w, h, r) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }
function etoile(c, x, y, r, col) {

}
function pique(c, cx, cy, rx, ry, a, l) {

}

// Dessine un animal. o : { x, y, s, humeur, secoue, gigote, tremble, symptome, boue, pansement }

    case 'tortue': circ(c, -5, -56, 2.5, sombre); circ(c, 5, -56, 2.5, sombre); break;
    case 'rongeur': ell(c, -30, -48, 18, 15, e.clair); ell(c, 30, -48, 18, 15, e.clair); circ(c, 0, -55, 6, '#f07a95'); c.fillStyle = '#fff'; c.fillRect(-5, -44, 4, 8); c.fillRect(1, -44, 4, 8); break;

const toile = $('#scene'), c = toile.getContext('2d');
let echelle = 1, decX = 0, decY = 0, dpr = 1, largeur = 360, hauteur = 440;
function redimensionner() {
  const r = $('#zone').getBoundingClientRect();
  largeur = Math.max(1, r.width); hauteur = Math.max(1, r.height);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  toile.width = Math.round(largeur * dpr); toile.height = Math.round(hauteur * dpr);
  echelle = Math.min(largeur / W, hauteur / H);
  decX = (largeur - W * echelle) / 2; decY = (hauteur - H * echelle) / 2;
}
function versEcran(x, y) {   // coordonnées logiques → coordonnées de la fenêtre
  const r = toile.getBoundingClientRect();
  return { x: r.left + decX + x * echelle, y: r.top + decY + y * echelle };
}
function coord(ev) {
  const r = toile.getBoundingClientRect();
  return { x: (ev.clientX - r.left - decX) / echelle, y: (ev.clientY - r.top - decY) / echelle };
}

// --- Salle d'attente : soigner d'abord celui qui a le plus mal ---
function etapeAttente(liste) {
  const COUL = ['#3fae6a', '#f29d38', '#e5484d'], MOTS = [0, 1, 2].map((i) => traduire('mot.' + i));
  // Un seul patient doit avoir « le plus mal » : on départage les égalités.
  let max = Math.max(...liste.map((p) => p.urgence));
  const premiers = liste.filter((p) => p.urgence === max);
  if (premiers.length > 1) {
    if (max < 3) { pioche(premiers).urgence = max + 1; max++; }
    else { const garde = pioche(premiers); premiers.forEach((p) => { if (p !== garde) p.urgence = 2; }); }
  }
  const taille = liste.length === 2 ? 0.5 : 0.4;
  const e = {
    nom: 'attente', tuto: 'attente', cacheAnimal: true, sansTable: true, sel: 0, choisi: false,
    consigne: traduire('salleAttente'),
    pos(i) { return liste.length === 2 ? { x: i ? 255 : 105, y: 246 } : { x: 62 + i * 118, y: 262 }; },
    indexUrgent() { return liste.findIndex((p) => p.urgence === max); },
    dessiner(c) {
      c.fillStyle = '#b98a5a'; rectArrondi(c, 10, 318, 340, 20, 8); c.fill();
      c.fillStyle = '#8f6840'; c.fillRect(30, 338, 10, 40); c.fillRect(320, 338, 10, 40);
      liste.forEach((p, i) => {
        const { x, y } = e.pos(i);
        if (!e.choisi && i === e.sel && e.clavier) { c.strokeStyle = '#3b82c4'; c.lineWidth = 4; rectArrondi(c, x - 56, y - 110, 112, 190, 16); c.stroke(); }
        dessinerAnimal(c, p, { x, y, s: taille, humeur: p.controle ? 'content' : 'triste', boue: p.boue, tremble: p.urgence === 3 });
        c.fillStyle = COUL[p.urgence - 1]; rectArrondi(c, x - 52, y - 126, 104, 30, 15); c.fill();
        c.fillStyle = '#fff'; c.font = '800 14px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(p.controle ? traduire('controle') : MOTS[p.urgence - 1], x, y - 110, 100);
        c.fillStyle = '#24324a'; c.font = '700 15px system-ui, sans-serif'; c.fillText(p.nom, x, y + 96);
      });
    },
    down(x, y) {
      e.clavier = false;
      liste.forEach((p, i) => { const q = e.pos(i); if (Math.abs(x - q.x) < 58 && y > q.y - 130 && y < q.y + 110) e.choisir(i); });
    },
    touche(k, on, rep) {
      if (!on || rep) return;
      e.clavier = true;
      if (k === 'ArrowLeft' || k === 'ArrowUp') e.sel = (e.sel + liste.length - 1) % liste.length;
      if (k === 'ArrowRight' || k === 'ArrowDown') e.sel = (e.sel + 1) % liste.length;
      if (k === ' ' || k === 'Enter') e.choisir(e.sel);
    },
    choisir(i) {
      if (e.choisi) return;

      const p = liste[i], q = e.pos(i);
      let cible = p;
      if (p.urgence === max) { son.bien(); confettis(q.x, q.y - 60, 16); texte(traduire('bonChoix'), q.x, q.y - 150, '#3fae6a'); consigne(traduire('bravoUrgent')); }
      else {
        cible = liste[e.indexUrgent()]; son.non(); secousse = 0.3;
        cible.perte += 15; consigne(traduire('oups', { nom: cible.nom }));
      }
      apres(1.3, () => arrivee(cible));
    },

  return e;
}

// --- Stéthoscope : toucher en rythme quand l'anneau arrive sur le cœur ---
function etapeStetho() {
  const p = patient, cfg = partie.cfg;
  const type = p.controle ? 'calme' : MAUX[p.mal].coeur;
  const besoin = p.controle ? 2 : cfg.battements;
  const h = monde(pointPartie(p.esp, 'coeur'));
  const per = () => (type === 'rapide' ? cfg.rapide : type === 'gargouille' ? hasard(0.55, 1.15) : cfg.calme);
  const e = {
    nom: 'stetho', tuto: 'stetho', h, reussis: 0, rates: 0, t: 0, pulse: 0, fini: false, pris: -1,
    consigne: traduire('ecouteCoeur'),
    debut() { e.periode = per(); e.dernier = 0.2; e.prochain = 0.2 + e.periode + 0.5; },
    maj(dt) {
      e.t += dt; e.pulse = Math.max(0, e.pulse - dt * 4);
      if (e.t >= e.prochain) {
        e.dernier = e.prochain; e.pulse = 1;
        if (type === 'gargouille') son.gargouille(); else son.coeur();
        e.periode = per(); e.prochain = e.dernier + e.periode;
      }
    },
    taper() {
      if (e.fini) return;
      const avant = e.t - e.dernier, reste = e.prochain - e.t;
      const cible = avant < reste ? e.dernier : e.prochain, ecart = Math.min(avant, reste);
      if (ecart <= cfg.fenetre && e.pris !== cible) {
        e.pris = cible; e.reussis++; son.bien(); etincelles(h.x, h.y, 8, '#3fae6a');
        texte(traduire(pioche(['bien', 'super', 'bravo'])), h.x, h.y - 50, '#3fae6a');
        if (e.reussis >= besoin) e.finir();
      } else {
        e.rates++; son.rate(); if (e.rates <= 4) perte(6);
        texte(traduire(avant < reste ? 'tropTard' : 'tropTot'), h.x, h.y - 50, '#e5484d');
      }
    },
    finir() {
      e.fini = true;
      if (p.controle) ajouterIndice('stetho', traduire('coeurForme'), false);
      else if (type === 'calme') ajouterIndice('stetho', traduire('coeurCalme'), false);
      else if (type === 'rapide') ajouterIndice('stetho', traduire('coeurRapide'), true);
      else ajouterIndice('stetho', traduire('ventreGargouille'), true);
      son.indice(); apres(0.9, etapeSuivante);
    },
    dessiner(c) {
      // Tuyau et embout du stéthoscope
      const coul = debloque('stetho') ? '#d4a017' : '#3b5b8a';
      c.strokeStyle = coul; c.lineWidth = 6; c.lineCap = 'round';
      c.beginPath(); c.moveTo(h.x + 22, h.y + 6); c.bezierCurveTo(h.x + 110, h.y + 20, 330, 200, 320, 120); c.stroke();
      c.beginPath(); c.moveTo(304, 96); c.quadraticCurveTo(320, 130, 336, 96); c.stroke();
      circ(c, h.x + 20, h.y + 4, 10, coul);
      // Anneau qui se resserre
      let frac;
      if (tutoActif) frac = 1 - ((tuto ? tuto.t : 0) % 1.3) / 1.3;
      else frac = e.fini ? 0 : borne((e.prochain - e.t) / Math.max(0.2, e.prochain - e.dernier), 0, 1);
      if (!e.fini) {
        c.strokeStyle = frac < 0.2 ? '#3fae6a' : '#f29d38'; c.lineWidth = 5;
        c.beginPath(); c.arc(h.x, h.y, 24 + frac * 80, 0, Math.PI * 2); c.stroke();
        c.strokeStyle = '#3fae6a55'; c.lineWidth = 3; c.beginPath(); c.arc(h.x, h.y, 24, 0, Math.PI * 2); c.stroke();
      }
      const s = 15 + e.pulse * 6 + (tutoActif && frac < 0.08 ? 5 : 0);
      c.fillStyle = type === 'gargouille' ? '#f29d38' : '#f2557a'; cheminCoeur(c, h.x, h.y, s); c.fill();
      // Battements réussis
      for (let i = 0; i < besoin; i++) circ(c, 180 - (besoin - 1) * 14 + i * 28, 22, 10, i < e.reussis ? '#3fae6a' : '#ffffffcc');
    },
    down() { e.taper(); },
    touche(k, on, rep) { if (on && !rep && (k === ' ' || k === 'Enter')) e.taper(); },
  };
  return e;
}

// --- Loupe : examiner chaque « ? » pour trouver le bobo ---
function etapeLoupe() {
  const p = patient, cfg = partie.cfg, mal = MAUX[p.mal];
  const autres = melange(['oreille', 'oeil', 'nez', 'patte', 'peau', 'dent'].filter((n) => n !== mal.loupe));
  const noms = melange((mal.loupe ? [mal.loupe] : []).concat(autres).slice(0, cfg.points));
  const pts = noms.map((n) => ({ nom: n, ...monde(pointPartie(p.esp, n)), vu: 0, etat: null }));
  const e = {
    nom: 'loupe', tuto: 'loupe', pts, lx: 316, ly: 64, cx: 316, cy: 64, r: cfg.loupeR, fini: false, appui: false, fl: {},
    consigne: traduire('glisseLoupe'),
    maj(dt) {
      const v = 230 * dt;
      if (e.fl.ArrowLeft) e.cx -= v; if (e.fl.ArrowRight) e.cx += v; if (e.fl.ArrowUp) e.cy -= v; if (e.fl.ArrowDown) e.cy += v;
      e.cx = borne(e.cx, 10, W - 10); e.cy = borne(e.cy, 10, H - 10);
      e.lx += (e.cx - e.lx) * Math.min(1, dt * 14); e.ly += (e.cy - e.ly) * Math.min(1, dt * 14);
      if (e.fini) return;
      let proche = null, dmin = 18;
      for (const q of pts) { const d = dist(q.x, q.y, e.lx, e.ly); if (!q.etat && d < dmin) { dmin = d; proche = q; } }
      for (const q of pts) if (q !== proche && !q.etat) q.vu = Math.max(0, q.vu - dt);
      if (proche) { proche.vu += dt; if (proche.vu >= 0.45) e.examiner(proche); }
    },
    examiner(q) {
      if (q.nom === mal.loupe) {

      } else {
        q.etat = 'ok'; son.clic();

    },
    finir(trouve) {
      e.fini = true;
      if (trouve) ajouterIndice('loupe', TEXTE_LOUPE[mal.loupe], true);
      else { ajouterIndice('loupe', traduire('rienVu'), false); son.indice(); }
      apres(1.1, etapeSuivante);
    },
    suivant() { const q = pts.find((t) => !t.etat); if (q) { e.cx = q.x; e.cy = q.y; } },
    dessiner(c) {
      const { lx, ly, r } = e;
      c.fillStyle = 'rgba(15,30,55,.5)'; c.beginPath(); c.rect(-1500, -1500, 3360, 3440); c.arc(lx, ly, r, 0, Math.PI * 2, true); c.fill();
      c.save(); c.beginPath(); c.arc(lx, ly, r, 0, Math.PI * 2); c.clip();
      c.translate(lx, ly); c.scale(1.8, 1.8); c.translate(-lx, -ly);
      dessinerScene(c);
      c.restore();
      for (const q of pts) {
        const col = q.etat === 'bobo' ? '#e5484d' : q.etat === 'ok' ? '#3fae6a' : '#ffffff';
        circ(c, q.x, q.y, 11, col); c.strokeStyle = '#1f5f8b'; c.lineWidth = 2; c.beginPath(); c.arc(q.x, q.y, 11, 0, Math.PI * 2); c.stroke();
        c.fillStyle = q.etat ? '#fff' : '#1f5f8b'; c.font = '900 15px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(q.etat === 'bobo' ? '!' : q.etat === 'ok' ? '✓' : '?', q.x, q.y + 1);
        if (!q.etat && q.vu > 0) { c.strokeStyle = '#ffd23f'; c.lineWidth = 4; c.beginPath(); c.arc(q.x, q.y, 15, -Math.PI / 2, -Math.PI / 2 + q.vu / 0.45 * Math.PI * 2); c.stroke(); }
      }
      // Monture et manche de la loupe
      const ca = Math.cos(0.8), sa = Math.sin(0.8);
      c.strokeStyle = '#8a5a2b'; c.lineWidth = 12; c.lineCap = 'round';
      c.beginPath(); c.moveTo(lx + ca * (r + 4), ly + sa * (r + 4)); c.lineTo(lx + ca * (r + 44), ly + sa * (r + 44)); c.stroke();
      if (debloque('loupe')) {
        ['#e5484d', '#f29d38', '#ffd23f', '#3fae6a', '#3b82c4', '#b76de0'].forEach((col, i) => { c.strokeStyle = col; c.lineWidth = 3; c.beginPath(); c.arc(lx, ly, r + 1 + i * 2.2, 0, Math.PI * 2); c.stroke(); });
      } else { c.strokeStyle = '#3b5b8a'; c.lineWidth = 7; c.beginPath(); c.arc(lx, ly, r + 3, 0, Math.PI * 2); c.stroke(); }
    },
    down(x, y) { e.appui = true; e.cx = x; e.cy = y; },
    move(x, y) { if (e.appui) { e.cx = x; e.cy = y; } },
    up() { e.appui = false; },
    touche(k, on, rep) {
      if (k.startsWith('Arrow')) e.fl[k] = on;
      if (on && !rep && (k === ' ' || k === 'Enter')) e.suivant();
    },
  };
  return e;
}

// --- Thermomètre : appuyer et tenir, lâcher quand l'animal gigote ---
function etapeThermo() {
  const p = patient, cfg = partie.cfg, fievre = MAUX[p.mal].temp === 'fievre';
  const e = {
    nom: 'thermo', tuto: 'thermo', prog: 0, tient: false, bloque: false, phase: 'calme', tp: hasard(0.9, 1.3), fini: false, bipT: 0,
    consigne: traduire('consThermo'),
    maj(dt) {
      if (e.fini) return;
      e.tp -= dt;
      if (e.tp <= 0) {
        if (e.phase === 'calme') { e.phase = 'alerte'; e.tp = cfg.alerte; son.attention(); }
        else if (e.phase === 'alerte') { e.phase = 'gigote'; e.tp = 0.9; }
        else { e.phase = 'calme'; e.tp = hasard(cfg.calmeMin, cfg.calmeMax); }
      }
      animal.gigote = e.phase === 'gigote';
      if (e.tient && !e.bloque) {
        if (e.phase === 'gigote') {
          e.bloque = true; e.prog = Math.max(0, e.prog - 0.3); perte(8); son.glisse(); secouer();
          texte(traduire('glisseThermo'), 180, 120, '#e5484d');
        } else {
          e.prog += dt / cfg.duree; e.bipT -= dt;
          if (e.bipT <= 0) { son.thermo(); e.bipT = 0.25; }
          if (e.prog >= 1) e.finir();
        }
      }
    },
    finir() {
      e.fini = true; e.prog = 1; animal.gigote = false;
      if (fievre) ajouterIndice('thermo', traduire('fievre'), true); else ajouterIndice('thermo', traduire('pasFievre'), false);
      son.indice(); etincelles(318, 120, 10); apres(1.1, etapeSuivante);
    },
    dessiner(c) {
      // Petit thermomètre sous le bras
      c.save(); c.translate(AX - 66, AY + 62); c.rotate(0.8);
      c.fillStyle = '#fff'; rectArrondi(c, -4, -26, 8, 34, 4); c.fill(); circ(c, 0, 10, 6, '#e5484d'); c.restore();
      // Grand cadran
      const x = 318, haut = 96, bas = 316, niveau = e.prog * (fievre ? 0.92 : 0.6);
      c.fillStyle = '#fff'; c.strokeStyle = '#3b5b8a'; c.lineWidth = 3;
      rectArrondi(c, x - 14, haut - 10, 28, bas - haut + 20, 14); c.fill(); c.stroke();
      circ(c, x, bas + 22, 22, '#e5484d'); c.beginPath(); c.arc(x, bas + 22, 22, 0, Math.PI * 2); c.stroke();
      const brillant = debloque('thermo');
      c.fillStyle = brillant ? '#b76de0' : '#e5484d';
      c.fillRect(x - 6, bas - niveau * (bas - haut), 12, niveau * (bas - haut) + 8);
      c.fillStyle = '#e5484d33'; c.fillRect(x - 13, haut, 26, (bas - haut) * 0.25);
      if (brillant) etoile(c, x, bas + 22, 11, '#ffd23f');
      if (e.fini) {
        c.font = '900 20px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillStyle = fievre ? '#e5484d' : '#3fae6a'; c.fillText(fievre ? '40 °C' : '38 °C', x - 4, haut - 26);
      }
      // Messages
      if (!e.fini) {
        if (e.phase === 'alerte') bulle(c, traduire('attentionGigote'), 180, 40);
        else if (e.phase === 'gigote') bulle(c, traduire('gigoteLache'), 180, 40);
        else if (!e.tient) bulle(c, traduire('appuieGarde'), 180, 40);
        else bulle(c, traduire('mesure'), 180, 40);
      }
      // Jauge de progression
      c.strokeStyle = '#ffffffaa'; c.lineWidth = 10; c.beginPath(); c.arc(60, 330, 26, 0, Math.PI * 2); c.stroke();
      c.strokeStyle = '#3fae6a'; c.beginPath(); c.arc(60, 330, 26, -Math.PI / 2, -Math.PI / 2 + e.prog * Math.PI * 2); c.stroke();
    },
    down() { e.tient = true; },
    up() { e.tient = false; e.bloque = false; },
    touche(k, on) { if (k === ' ' || k === 'Enter') { if (on) e.tient = true; else { e.tient = false; e.bloque = false; } } },
  };
  return e;
}

// --- Pansement : suivre le tracé en pointillés ---
function etapePansement() {
  const p = patient, cfg = partie.cfg;
  const pts = [];
  for (let i = 0; i <= 100; i++) {
    // Le tracé passe par l'égratignure (au milieu du ventre) et ondule de plus en plus.
    const u = i / 100, lx = -74 + u * 148;
    const ly = 88 + Math.sin(u * Math.PI * 2 * cfg.ondes) * cfg.amp;
    pts.push(monde({ x: lx, y: ly }));
  }
  const e = {
    nom: 'pansement', tuto: 'pansement', pts, idx: 0, appui: false, hors: false, sorties: 0, fini: false, doigt: null, fl: false,
    consigne: traduire('consPansement'),
    maj(dt) {
      if (e.fl && !e.fini) { e.avance += dt * 16; while (e.avance >= 1) { e.avance--; e.idx = Math.min(pts.length - 1, e.idx + 1); } e.verifier(); }
    },
    verifier() { if (e.idx >= pts.length - 1 && !e.fini) e.finir(); },
    suivre(x, y) {
      e.doigt = { x, y };
      let meilleur = -1;
      for (let j = e.idx; j < Math.min(pts.length, e.idx + 14); j++) if (dist(pts[j].x, pts[j].y, x, y) < cfg.tol) meilleur = j;
      if (meilleur >= 0) { if (meilleur > e.idx) { e.idx = meilleur; if (Math.random() < 0.3) son.thermo(); } e.hors = false; }
      else {
        let dmin = 1e9;
        for (let j = Math.max(0, e.idx - 3); j < Math.min(pts.length, e.idx + 14); j++) dmin = Math.min(dmin, dist(pts[j].x, pts[j].y, x, y));
        if (dmin > cfg.tol * 2 && !e.hors) {
          e.hors = true; e.sorties++; son.rate(); if (e.sorties <= 4) perte(5);
          texte(traduire('resteSur'), 180, 150, '#e5484d');
        }
      }
      e.verifier();
    },
    finir() { e.fini = true; p.pansement = true; p.soigne = true; son.pose(); etincelles(pts[pts.length - 1].x, pts[pts.length - 1].y, 12); apres(0.7, etapeSuivante); },
    dessiner(c) {
      c.lineCap = 'round'; c.lineJoin = 'round';
      c.strokeStyle = '#1f5f8b'; c.lineWidth = 6; c.setLineDash([2, 12]);
      c.beginPath(); pts.forEach((q, i) => (i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y))); c.stroke();
      c.strokeStyle = '#fff'; c.lineWidth = 3; c.stroke(); c.setLineDash([]);
      if (e.idx > 0 && !e.fini) {
        c.strokeStyle = '#c99868'; c.lineWidth = 20; c.beginPath(); for (let i = 0; i <= e.idx; i++) (i ? c.lineTo(pts[i].x, pts[i].y) : c.moveTo(pts[i].x, pts[i].y)); c.stroke();
        c.strokeStyle = '#f2c79a'; c.lineWidth = 16; c.stroke();
      }
      const a = pts[0], b = pts[pts.length - 1], q = pts[e.idx];
      etoile(c, b.x, b.y, 14, '#ffd23f');
      if (e.idx === 0) { circ(c, a.x, a.y, 14 + Math.sin(temps * 6) * 3, '#3fae6a'); c.fillStyle = '#fff'; c.font = '900 12px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(traduire('ici'), a.x, a.y, 26); }
      else if (!e.fini) { circ(c, q.x, q.y, 9, '#fff'); c.strokeStyle = '#3fae6a'; c.lineWidth = 3; c.beginPath(); c.arc(q.x, q.y, 9, 0, Math.PI * 2); c.stroke(); }
    },
    down(x, y) { e.appui = true; e.suivre(x, y); },
    move(x, y) { if (e.appui) e.suivre(x, y); },
    up() { e.appui = false; e.hors = false; },
    touche(k, on) { if (k === ' ' || k === 'Enter' || k === 'ArrowRight') { e.fl = on; e.avance = 0; } },
  };
  return e;
}

// --- Brosse : frotter les taches de boue ---
function etapeBrosse() {
  const p = patient, cfg = partie.cfg;
  const e = {
    nom: 'brosse', tuto: 'brosse', bx: 300, by: 380, appui: false, fl: {}, fini: false,
    consigne: traduire(p.esp.f ? 'sale.f' : 'sale.m', { nom: p.nom }),
    taches() { return p.boue.map((b) => ({ b, ...monde(b) })); },
    frotter(x, y, d) {
      for (const t of e.taches()) {
        if (t.b.a > 0 && dist(t.x, t.y, x, y) < t.b.r * AS + 20) {
          t.b.a -= d / cfg.frotter; if (Math.random() < 0.5) mousse(x, y);
          if (temps - dernierFrotte > 0.12) { son.frotte(); dernierFrotte = temps; }
          if (t.b.a <= 0) { etincelles(t.x, t.y, 8, '#a9dcf7'); son.bien(); }
        }
      }
      if (!e.fini && p.boue.every((b) => b.a <= 0)) { e.fini = true; texte(traduire('toutPropre'), 180, 120, '#3fae6a'); apres(0.7, etapeSuivante); }
    },
    deplacer(x, y) { const d = dist(x, y, e.bx, e.by); e.bx = x; e.by = y; if (d > 0) e.frotter(x, y, Math.min(d, 40)); },
    maj(dt) {
      const v = 200 * dt; let x = e.bx, y = e.by;
      if (e.fl.ArrowLeft) x -= v; if (e.fl.ArrowRight) x += v; if (e.fl.ArrowUp) y -= v; if (e.fl.ArrowDown) y += v;
      if (x !== e.bx || y !== e.by) e.deplacer(borne(x, 0, W), borne(y, 0, H));
    },
    dessiner(c) {
      if (!e.fini) for (const t of e.taches()) if (t.b.a > 0) { c.strokeStyle = '#ffffffaa'; c.lineWidth = 3; c.setLineDash([6, 6]); c.beginPath(); c.arc(t.x, t.y, t.b.r * AS + 10, 0, Math.PI * 2); c.stroke(); c.setLineDash([]); }
      c.save(); c.translate(e.bx, e.by); c.rotate(-0.4);
      c.fillStyle = '#c0843c'; rectArrondi(c, -28, -14, 56, 20, 8); c.fill();
      c.fillStyle = '#8a5a2b'; rectArrondi(c, 22, -9, 34, 10, 5); c.fill();
      c.fillStyle = '#f7e4b0'; for (let i = -24; i <= 22; i += 6) c.fillRect(i, 6, 3, 10);
      c.restore();
    },
    down(x, y) { e.appui = true; e.bx = x; e.by = y; },
    move(x, y) { if (e.appui) e.deplacer(x, y); },
    up() { e.appui = false; },
    touche(k, on, rep) {
      if (k.startsWith('Arrow')) e.fl[k] = on;
      if (on && !rep && (k === ' ' || k === 'Enter')) { const t = e.taches().find((q) => q.b.a > 0); if (t) { e.bx = t.x - 20; e.by = t.y; } }
    },
  };
  return e;
}

// --- Bain : éclater les bulles de savon ---
function etapeBulles() {
  const cfg = partie.cfg;
  const bulles = [];
  for (let i = 0; i < cfg.bulles; i++) bulles.push({ x: hasard(60, 300), y: hasard(90, 360), r: hasard(18, 26), vx: hasard(-1, 1) * cfg.vitBulles, vy: -hasard(0.5, 1) * cfg.vitBulles, ph: hasard(0, 6) });
  const e = {
    nom: 'bulles', tuto: 'bulles', bulles, fini: false,
    consigne: traduire('consBain'),
    maj(dt) {
      for (const b of bulles) {
        b.x += b.vx * dt + Math.sin(temps * 2 + b.ph) * 0.4; b.y += b.vy * dt;
        if (b.x < 40) b.vx = Math.abs(b.vx); else if (b.x > 320) b.vx = -Math.abs(b.vx);
        if (b.y < 60) b.y = 380;
      }
    },
    eclater(b) {
      bulles.splice(bulles.indexOf(b), 1); son.bulle(); etincelles(b.x, b.y, 6, '#a9dcf7');
      if (!bulles.length && !e.fini) { e.fini = true; texte(traduire('toutBeau'), 180, 120, '#3fae6a'); coeurs(AX, AY - 60, 4); apres(0.7, etapeSuivante); }
    },
    dessiner(c) {
      for (const b of bulles) {
        c.fillStyle = '#d6f1ff66'; c.beginPath(); c.arc(b.x, b.y, b.r, 0, Math.PI * 2); c.fill();
        c.strokeStyle = '#7cc9ff'; c.lineWidth = 2.5; c.stroke();
        circ(c, b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.22, '#ffffffdd');
      }
    },
    down(x, y) { const b = bulles.find((q) => dist(q.x, q.y, x, y) < q.r + 14); if (b) e.eclater(b); },
    touche(k, on, rep) { if (on && !rep && (k === ' ' || k === 'Enter') && bulles.length) e.eclater(bulles[0]); },
  };
  return e;
}

// --- Cartes à choisir (choix du soin, et souvenir du contrôle) ---
function afficherCartes(ids, rappel) {
  const zone = $('#cartes'); zone.innerHTML = '';
  ids.forEach((id) => {
    const b = document.createElement('button');
    b.className = 'carte'; b.dataset.id = id; b.innerHTML = icone(id) + SOINS[id].nom;
    b.addEventListener('click', () => { if (actif()) { premiereAction(); rappel(id, b); } });
    zone.append(b);
  });
}
function navigationCartes(e, k, on, rep) {
  if (!on || rep) return;
  const cartes = [...document.querySelectorAll('#cartes .carte')];
  if (!cartes.length) return;
  if (k.startsWith('Arrow')) {
    const pas = k === 'ArrowLeft' ? -1 : k === 'ArrowRight' ? 1 : k === 'ArrowUp' ? -3 : 3;
    e.sel = e.sel == null ? 0 : (e.sel + pas + cartes.length * 3) % cartes.length;
  } else if (k === ' ' || k === 'Enter') {
    if (e.sel == null) e.sel = 0; else cartes[e.sel].click();
  }
  cartes.forEach((b, i) => b.classList.toggle('focus', i === e.sel));
}
function soinsConnus(j) { return [...new Set(Object.keys(MAUX).filter((k) => MAUX[k].jour <= j).map((k) => MAUX[k].soin))]; }

function etapeChoix() {
  const p = patient, bon = MAUX[p.mal].soin;
  const autres = melange(soinsConnus(partie.jour).filter((s) => s !== bon)).slice(0, partie.cfg.cartes - 1);
  const ids = melange([bon, ...autres]);
  const e = {
    nom: 'choix', tuto: 'choix', fini: false, sel: null, bon,
    consigne: traduire('consChoix'),
    debut() { afficherCartes(ids, e.choisir); },
    choisir(id, b) {
      if (e.fini || b.classList.contains('non')) return;
      if (id === bon) {
        e.fini = true; b.classList.add('bonne'); son.bien(); p.soinDonne = id;
        etincelles(AX, AY - 70, 10); texte(traduire('bonneIdee'), 180, 70, '#3fae6a');
        apres(0.6, etapeSuivante);
      } else {
        b.classList.add('non'); son.non(); perte(15); animal.secoue = 0.6;
        texte(traduire('pasCa'), 180, 70, '#e5484d');
      }
    },
    touche(k, on, rep) { navigationCartes(e, k, on, rep); },
  };
  return e;
}

// --- Contrôle : se souvenir du soin donné plus tôt ---
function etapeMemoire() {
  const p = patient, ref = p.ref, bon = ref.soinDonne || MAUX[ref.mal].soin;
  const autres = melange(soinsConnus(partie.jour).filter((s) => s !== bon)).slice(0, 3);
  const ids = melange([bon, ...autres]);
  const e = {
    nom: 'memoire', tuto: 'controle', fini: false, sel: null,
    consigne: traduire('consMemoire', { nom: p.nom }),
    debut() { afficherCartes(ids, e.choisir); },
    choisir(id, b) {
      if (e.fini) return;
      e.fini = true;
      if (id === bon) {
        b.classList.add('bonne'); p.bonus = 20; son.bien(); confettis(180, 90, 14);
        texte(traduire('bonneMemoire'), 180, 70, '#3fae6a');
      } else {
        b.classList.add('non'); son.non();
        const juste = document.querySelector(`#cartes .carte[data-id="${bon}"]`); if (juste) juste.classList.add('bonne');
        texte(traduire('cEtait', { soin: SOINS[bon].nom }), 180, 70, '#b7791f');
      }
      ajouterIndice('controle', traduire('soinAvant', { soin: SOINS[bon].nom }), false);
      apres(1.4, etapeSuivante);

  return e;
}

// --- Donner le soin : glisser l'outil sur l'endroit qui brille ---
function etapeSoin() {
  const p = patient, s = MAUX[p.mal].soin, cible = monde(pointPartie(p.esp, SOINS[s].partie));
  const e = {
    nom: 'soin', tuto: 'soin', ox: 180, oy: 402, depart: { x: 180, y: 402 }, cible, prise: false, auto: false, applique: 0, fini: false,
    consigne: traduire('glisse.' + s),
    debut() { const o = $('#outil'); o.innerHTML = icone(s); o.classList.remove('cache'); },
    maj(dt) {
      if (e.auto && !e.applique) {
        e.ox += (cible.x - e.ox) * Math.min(1, dt * 6); e.oy += (cible.y - e.oy) * Math.min(1, dt * 6);
        e.tester();
      }
      if (e.applique) {
        e.applique += dt;
        e.ox = cible.x + Math.sin(e.applique * 18) * 7; e.oy = cible.y + Math.cos(e.applique * 14) * 4;
        if (Math.random() < dt * 20) etincelles(cible.x, cible.y, 1, '#a9dcf7');
        if (e.applique > 1.1 && !e.fini) {
          e.fini = true; p.soigne = true; $('#outil').classList.add('cache');
          coeurs(cible.x, cible.y, 4); etapeSuivante();
        }
      }
    },
    tester() { if (!e.applique && dist(e.ox, e.oy, cible.x, cible.y) < 30) { e.applique = 0.001; e.prise = false; son.pose(); } },
    dessiner(c) {
      if (!e.applique) {
        const g = 20 + Math.sin(temps * 6) * 5;
        c.fillStyle = '#ffd23f55'; c.beginPath(); c.arc(cible.x, cible.y, g + 8, 0, Math.PI * 2); c.fill();
        c.strokeStyle = '#ffd23f'; c.lineWidth = 4; c.beginPath(); c.arc(cible.x, cible.y, g, 0, Math.PI * 2); c.stroke();
      }
    },
    down(x, y) {
      if (e.applique) return;
      if (dist(x, y, cible.x, cible.y) < 40) e.auto = true;
      else { e.prise = true; e.ox = x; e.oy = y - 10; }
    },
    move(x, y) { if (e.prise && !e.applique) { e.ox = x; e.oy = y - 10; e.tester(); } },
    up() { e.prise = false; },
    touche(k, on, rep) { if (on && !rep && (k === ' ' || k === 'Enter')) e.auto = true; },
  };
  return e;
}

// --- Câlins : toucher l'animal ---
function etapeCalin() {
  const p = patient;
  const e = {
    nom: 'calin', tuto: 'calin', n: 0, fini: false,
    consigne: traduire('consCalin', { nom: p.nom }),
    calin() {
      if (e.fini) return;
      e.n++; son.calin(); coeurs(AX, AY - 70, 5); animal.joie = 0.8;
      texte('♥'.repeat(e.n), AX, AY - 160, '#f2557a');
      if (e.n >= 3) { e.fini = true; p.soinDonne = 'calin'; p.soigne = true; apres(0.7, etapeSuivante); }
    },
    dessiner(c) { if (!e.fini) { c.strokeStyle = '#f2557a88'; c.lineWidth = 4; c.setLineDash([8, 8]); c.beginPath(); c.arc(AX, AY - 20, 130 + Math.sin(temps * 5) * 4, 0, Math.PI * 2); c.stroke(); c.setLineDash([]); } },
    down(x, y) { if (dist(x, y, AX, AY) < 170) e.calin(); },
    touche(k, on, rep) { if (on && !rep && (k === ' ' || k === 'Enter')) e.calin(); },
  };
  return e;
}

const FABRIQUES = { stetho: etapeStetho, loupe: etapeLoupe, thermo: etapeThermo, choix: etapeChoix, soin: etapeSoin,
  calin: etapeCalin, pansement: etapePansement, brosse: etapeBrosse, bulles: etapeBulles, memoire: etapeMemoire };

function construireEtapes(p) {
  if (p.controle) return ['memoire', 'stetho'];
  const l = [];
  if (p.sale) l.push('brosse', 'bulles');
  l.push('stetho', 'loupe');
  if (partie.jour >= 2) l.push('thermo');
  l.push('choix');
  const s = MAUX[p.mal].soin;
  l.push(s === 'pansement' ? 'pansement' : s === 'calin' ? 'calin' : 'soin');
  return l;
}

// =====================================================================
//  Déroulement d'une journée
// =====================================================================
function cacherEcrans() { document.querySelectorAll('.ecran, .voile').forEach((el) => el.classList.add('cache')); }

function demarrerJournee(j) {
  cacherEcrans(); fermerTuto(true);
  jeuActif = true; enPause = false; bilanOuvert = false;
  minuteurs = []; particules = []; textes = []; patient = null;
  const cfg = cfgJour(j);
  partie = { jour: j, cfg, file: genererPatients(j, cfg), gueris: [], score: 0 };
  partie.max = partie.file.reduce((s, p) => s + 100 + (p.controle ? 20 : 0), 0);
  scoreAffiche = 0; $('#outil').classList.add('cache');
  viderCartes(); majIndices(); majHud(); redimensionner();
  lancerEtape(etapeAnnonce());
}

function lancerEtape(e) {
  etape = e;
  if (e.debut) e.debut();
  consigne(e.consigne || '');
  if (e.tuto && !tutosVus.has(e.tuto)) montrerTuto(e.tuto);
}

function patientSuivant() {
  const dispo = partie.file.filter((p) => !p.gueri && (!p.controle || p.ref.gueri));
  if (!dispo.length) return finJournee();
  if (partie.cfg.attente && dispo.length >= 2) { patient = null; majIndices(); lancerEtape(etapeAttente(dispo.slice(0, 3))); }
  else arrivee(dispo[0]);
}

function arrivee(p) {
  patient = p; p.iEtape = -1; p.etapes = construireEtapes(p);
  etape = null; viderCartes();
  animal.dx = 340; animal.cible = 0; animal.secoue = 0; animal.gigote = false; animal.joie = 0;
  animal.bulle = traduire(p.controle ? 'revient' : 'phrase.' + p.mal, { nom: p.nom });
  animal.bulleT = 2.2;
  majIndices(); majHud();
  consigne(traduire(p.controle ? 'revoila' : 'voici', { qui: nomComplet(p) }));
  son.clic();
  apres(1.3, etapeSuivante);
}

function etapeSuivante() {
  if (!patient || patient.gueri) return;
  viderCartes(); $('#outil').classList.add('cache');
  patient.iEtape++;
  if (patient.iEtape >= patient.etapes.length) return guerir();
  lancerEtape(FABRIQUES[patient.etapes[patient.iEtape]]());
}

function guerir() {
  const p = patient;
  etape = null; p.gueri = true; p.soigne = true; animal.gigote = false; animal.joie = 3;
  const pts = Math.max(30, 100 - p.perte) + p.bonus;
  p.points = pts; partie.score += pts; partie.gueris.push(p);
  if (!p.controle) { sauve.album[p.esp.id] = (sauve.album[p.esp.id] || 0) + 1; enregistrer(); }
  const t = monde({ x: 0, y: -70 });
  son.gueri(); confettis(t.x, t.y, 30); coeurs(t.x, t.y, 8); texte(`+${pts}`, t.x, t.y - 80, '#c2410c');
  consigne(traduire(p.controle ? 'pleineForme' : (p.esp.f ? 'gueri.f' : 'gueri.m'), { nom: p.nom }));
  apres(1.8, () => {
    animal.cible = -380;
    apres(0.7, () => { patient = null; majIndices(); patientSuivant(); });
  });
}

function finJournee() {
  const j = partie.jour, ratio = partie.score / partie.max;
  if (window.FMG) window.FMG.reportEnd({ completed: true, level: j });
  const et = ratio >= 0.85 ? 3 : ratio >= 0.6 ? 2 : 1;
  const avant = totalEtoiles(), ancien = sauve.journees[j];
  const record = !ancien || partie.score > ancien.score;
  sauve.journees[j] = { etoiles: Math.max(et, ancien ? ancien.etoiles : 0), score: Math.max(partie.score, ancien ? ancien.score : 0) };
  if (j < 10) sauve.jourMax = Math.max(sauve.jourMax, j + 1);
  const apresTot = totalEtoiles();
  const nouveaux = RECOMPENSES.filter((r) => r.etoiles > avant && r.etoiles <= apresTot);
  if (nouveaux.some((r) => r.id === 'jardin')) sauve.salle = 'jardin';
  enregistrer();
  // Journée réussie : on reprendra à la suivante (à la dernière si tout est fini).
  scorePartie += partie.score;
  JEL_SAVE.save(JEU, { niveau: Math.min(10, j + 1), score: scorePartie, etoiles: etoilesJournees() });
  // Jeu terminé (les 10 journées réussies, maintenant ou avant) : total des meilleures étoiles.
  if (etoilesJournees().every((e) => e > 0)) { if (window.FMG) window.FMG.reportComplete({ stars: etoilesJournees().reduce((a, b) => a + b, 0), maxStars: 30 }); }

  bilanOuvert = true; etape = null;
  son.fanfare(); confettis(180, 120, 50);
  $('#bilan-titre').textContent = j < 10 ? traduire('journeeTerminee', { n: j }) : traduire('superVeto');
  $('#bilan-info').textContent = traduire('soignes', { n: partie.gueris.length }) + ' · ' + traduire('etoilesTout', { n: apresTot });
  $('#bilan-record').textContent = record ? traduire(ancien ? 'nouveauRecord' : 'premierRecord') : traduire('recordPoints', { n: ancien.score });
  $('#bilan-record').className = record ? 'nouveau' : '';
  $('#bilan-debloque').textContent = nouveaux.length ? traduire('debloque', { liste: nouveaux.map((r) => r.nom).join(', ') }) : '';
  $('#b-suivant').classList.toggle('cache', j >= 10);
  const ets = document.querySelectorAll('.et'); ets.forEach((s) => s.classList.remove('on'));
  $('#bilan').classList.remove('cache');
  // Compteur qui défile et étoiles qui s'envolent
  const debut = performance.now(), total = partie.score;
  const compter = () => {
    const u = borne((performance.now() - debut) / 1200, 0, 1);
    $('#bilan-score').textContent = Math.round(total * u);
    if (u < 1 && bilanOuvert) requestAnimationFrame(compter);
  };
  requestAnimationFrame(compter);
  for (let i = 0; i < et; i++) setTimeout(() => { if (bilanOuvert) { ets[i].classList.add('on'); son.etoile(); } }, 500 + i * 450);
  ($('#b-suivant').classList.contains('cache') ? $('#b-rejouer') : $('#b-suivant')).focus();
}

  ],
  loupe: (e) => [
    { t: traduire('tuto.2'), m: [{ x: e.pts[0].x + 60, y: e.pts[0].y + 60, a: 1 }, { x: e.pts[0].x, y: e.pts[0].y, a: 1 }, { x: e.pts[1].x, y: e.pts[1].y, a: 1 }] },
    { t: traduire('tuto.3'), m: [{ x: e.pts[1].x, y: e.pts[1].y, a: 1 }, { x: e.pts[1].x + 2, y: e.pts[1].y + 2, a: 1 }] },

    { t: traduire('tuto.6'), m: [{ x: 200, y: 250 }, { x: 180, y: 300, a: 1 }, { x: 180, y: 300, a: 1 }] },
  ],
  choix: (e) => [
    { t: traduire('tuto.7'), m: [{ sel: '#indices' }, { sel: '#indices', dy: 6 }] },
    { t: traduire('tuto.8'), m: [{ sel: `#cartes .carte[data-id="${e.bon}"]`, dy: 20 }, { sel: `#cartes .carte[data-id="${e.bon}"]`, a: 1 }] },
  ],
  soin: (e) => [
    { t: traduire('tuto.9'), m: [{ x: e.depart.x, y: e.depart.y, a: 1 }, { x: e.cible.x, y: e.cible.y, a: 1 }, { x: e.cible.x, y: e.cible.y }] },
  ],
  calin: () => [
    { t: traduire('tuto.10'), m: [{ x: AX + 30, y: AY - 20 }, { x: AX, y: AY - 60, a: 1 }, { x: AX + 30, y: AY - 20 }] },
  ],
  pansement: (e) => [
    { t: traduire('tuto.11'), m: e.pts.filter((q, i) => i % 20 === 0).map((q) => ({ x: q.x, y: q.y, a: 1 })) },
  ],
  brosse: (e) => {
    const t = e.taches()[0];
    return [{ t: traduire('tuto.12'), m: [{ x: t.x - 20, y: t.y, a: 1 }, { x: t.x + 20, y: t.y - 8, a: 1 }, { x: t.x - 20, y: t.y + 8, a: 1 }, { x: t.x + 20, y: t.y, a: 1 }] }];
  },
  bulles: (e) => [
    { t: traduire('tuto.13'), m: e.bulles.slice(0, 3).flatMap((b) => [{ x: b.x, y: b.y + 20 }, { x: b.x, y: b.y, a: 1 }]) },
  ],
  attente: (e) => {
    const i = e.indexUrgent(), q = e.pos(i);
    return [
      { t: traduire('tuto.14'), m: [{ x: q.x - 60, y: q.y + 40 }, { x: q.x + 60, y: q.y + 40 }] },
