function montrerTuto(cle) {
  if (!etape || !TUTOS[cle]) return;
  tutosVus.add(cle);
  tuto = { pas: TUTOS[cle](etape), i: 0, t: 0, age: 0 };
  tutoActif = true;
  $('#tuto').classList.remove('cache'); $('#main').classList.remove('cache');
  majTexteTuto();
}
function majTexteTuto() {
  $('#tuto-texte').textContent = tuto.pas[tuto.i].t;
  $('#tuto-pas').textContent = tuto.pas.length > 1 ? traduire('etapeSur', { n: tuto.i + 1, total: tuto.pas.length }) : '';
}
function fermerTuto(silence) {
  if (!tutoActif && !tuto) return;
  tutoActif = false; tuto = null;
  $('#tuto').classList.add('cache'); $('#main').classList.add('cache'); $('#onde').style.opacity = 0;
  if (!silence) son.clic();
}
function positionCle(k) {
  if (k.sel) {
    const el = document.querySelector(k.sel);
    if (!el) return { x: largeur / 2, y: hauteur / 2 };
    const r = el.getBoundingClientRect();
    return { x: r.left + Math.min(r.width / 2, 60), y: r.top + r.height / 2 + (k.dy || 0) };
  }
  return versEcran(k.x, k.y);
}
function majTuto(dt) {
  tuto.t += dt; tuto.age += dt;
  const duree = 2.6;
  if (tuto.t > duree) { tuto.t = 0; tuto.i = (tuto.i + 1) % tuto.pas.length; majTexteTuto(); }
  const m = tuto.pas[tuto.i].m, u = borne(tuto.t / (duree * 0.85), 0, 1) * (m.length - 1);
  const i = Math.min(m.length - 2, Math.floor(u)), f = m.length > 1 ? u - i : 0;
  const a = positionCle(m[Math.max(0, i)]), b = positionCle(m[Math.min(m.length - 1, i + 1)]);
  const x = a.x + (b.x - a.x) * f, y = a.y + (b.y - a.y) * f;
  const appui = (m[Math.round(u)] || {}).a;
  $('#main').style.transform = `translate(${x - 20}px, ${y - 3}px) scale(${appui ? 0.88 : 1})`;
  const onde = $('#onde');
  onde.style.opacity = appui ? 0.9 : 0;
  onde.style.transform = `translate(${x}px, ${y}px) scale(${appui ? 1 + (tuto.t * 2 % 1) * 0.6 : 0.5})`;
}

// =====================================================================
//  Boucle principale
// =====================================================================
let dernierT = performance.now();
function boucle(t) {
  const dt = Math.min(0.05, (t - dernierT) / 1000); dernierT = t;
  if (jeuActif && !enPause) {
    if (tutoActif && tuto) majTuto(dt);
    else {
      temps += dt;
      if (!bilanOuvert) majMinuteurs(dt);
      if (etape && etape.maj && !bilanOuvert) etape.maj(dt);
      animal.dx += (animal.cible - animal.dx) * Math.min(1, dt * 5);
      animal.secoue = Math.max(0, animal.secoue - dt);
      animal.joie = Math.max(0, animal.joie - dt);
      animal.bulleT = Math.max(0, animal.bulleT - dt);
      secousse = Math.max(0, secousse - dt);
      majParticules(dt);
      if (partie) { scoreAffiche += Math.ceil((partie.score - scoreAffiche) * 0.15); $('#scorebox').textContent = traduire('pts', { n: scoreAffiche }); }
    }
    dessiner();
  }
  requestAnimationFrame(boucle);
}

function optionsAnimal() {
  const p = patient, bouge = Math.abs(animal.dx - animal.cible) > 6;
  return {
    x: AX + animal.dx, y: AY - (bouge ? Math.abs(Math.sin(temps * 12)) * 12 : 0), s: AS,
    humeur: p.soigne || p.controle || animal.joie > 0 ? 'content' : 'triste',
    secoue: animal.secoue, gigote: animal.gigote, tremble: p.mal === 'peur' && !p.soigne && !p.controle,
    symptome: !p.soigne && !p.controle ? p.mal : null, boue: p.boue, pansement: p.pansement,
  };
}
function dessinerScene(c) {
  dessinerFond(c, etape && etape.sansTable);
  if (patient && !(etape && etape.cacheAnimal)) dessinerAnimal(c, patient, optionsAnimal());
}
function dessiner() {
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, largeur, hauteur);
  c.save();
  c.translate(decX, decY); c.scale(echelle, echelle);
  if (secousse > 0) c.translate(hasard(-1, 1) * secousse * 14, hasard(-1, 1) * secousse * 14);
  dessinerScene(c);
  if (patient && animal.bulleT > 0 && !(etape && etape.cacheAnimal)) bulle(c, animal.bulle, 180, 34);
  if (etape && etape.dessiner) etape.dessiner(c);
  dessinerParticules(c);
  c.restore();
  // Outil de soin (icône SVG posée au-dessus du canvas)
  if (etape && etape.nom === 'soin') {
    const taille = 58 * echelle, o = $('#outil');
    o.style.width = o.style.height = taille + 'px';
    o.style.transform = `translate(${decX + etape.ox * echelle - taille / 2}px, ${decY + etape.oy * echelle - taille / 2}px)`;
  }
}

const actif = () => jeuActif && !enPause && !tutoActif && !bilanOuvert;
function premiereAction() { audio(); }

toile.addEventListener('pointerdown', (ev) => {
  if (!actif()) return;
  ev.preventDefault(); premiereAction();
  try { toile.setPointerCapture(ev.pointerId); } catch (e) { /* rien */ }
  const p = coord(ev);
  if (etape && etape.down) etape.down(p.x, p.y);
});
toile.addEventListener('pointermove', (ev) => { if (!actif()) return; const p = coord(ev); if (etape && etape.move) etape.move(p.x, p.y); });
const relache = () => { if (etape && etape.up) etape.up(); };
toile.addEventListener('pointerup', relache);
toile.addEventListener('pointercancel', relache);

const TOUCHES_JEU = [' ', 'Enter', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];
addEventListener('keydown', (ev) => {
  const k = ev.key;
  if (k === 'Escape' || k === 'p' || k === 'P') {
    if (jeuActif && !bilanOuvert) { ev.preventDefault(); basculerPause(!enPause); }
    return;
  }
  if (!jeuActif || enPause || bilanOuvert) return;   // les boutons des menus gardent leur comportement normal
  if (tutoActif) {
    if ((k === ' ' || k === 'Enter') && tuto && tuto.age > 0.5) { ev.preventDefault(); fermerTuto(); }
    return;
  }
  if (TOUCHES_JEU.includes(k)) {
    ev.preventDefault(); premiereAction();
    if (etape && etape.touche) etape.touche(k, true, ev.repeat);
  }
});
addEventListener('keyup', (ev) => {
  if (!actif()) return;
  if (TOUCHES_JEU.includes(ev.key) && etape && etape.touche) etape.touche(ev.key, false, false);
});

// ---------- Pause ----------
function basculerPause(on) {
  if (!jeuActif || bilanOuvert) return;
  enPause = on;
  $('#pause').classList.toggle('cache', !on);
  if (on) { relache(); if (etape && etape.fl) Object.keys(etape.fl).forEach((k) => (etape.fl[k] = false)); }
  if (ac) { try { on ? ac.suspend() : ac.resume(); } catch (e) { /* rien */ } }
  if (on) $('#b-reprendre').focus();
  dernierT = performance.now();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && jeuActif && !enPause && !bilanOuvert) basculerPause(true); });
$('#b-pause').addEventListener('click', (ev) => { ev.currentTarget.blur(); premiereAction(); basculerPause(true); });
$('#b-reprendre').addEventListener('click', () => { basculerPause(false); son.clic(); });
$('#b-recommencer').addEventListener('click', () => { basculerPause(false); demarrerJournee(partie.jour); });
$('#b-accueil').addEventListener('click', () => { basculerPause(false); allerAccueil(); });

$('#b-rejouer').addEventListener('click', () => { son.clic(); demarrerJournee(partie.jour); });

function allerAccueil() {
  jeuActif = false; bilanOuvert = false; enPause = false; fermerTuto(true);
  etape = null; patient = null; minuteurs = [];
  $('#outil').classList.add('cache');
  cacherEcrans(); $('#accueil').classList.remove('cache');
  dessinerApercu();
  const tot = totalEtoiles();
  $('#acc-etoiles').textContent = tot ? '★ ' + traduire('etoilesAcc', { n: tot }) : '';
  $('#titre').innerHTML = (debloque('couronne') ? '♛ ' : '') + traduire('titreHtml');
  if (effacerAccueil) effacerAccueil.maj();
}
let effacerAccueil = null; // bouton « Effacer la sauvegarde » de l'accueil
function dessinerApercu() {
  const cv = $('#apercu'), x = cv.getContext('2d');
  x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, cv.width, cv.height);
  x.save(); x.scale(600 / W, 400 / 300); x.translate(0, -140);
  dessinerFond(x);
  x.restore();
  const tri = [['lapin', 120, 0.58], ['poulain', 480, 0.58], ['chaton', 300, 0.72]];
  for (const [id, px, s] of tri) dessinerAnimal(x, creerPatient(ESPECES.find((e) => e.id === id), '', 'oreilles'), { x: px, y: 260 - (1 - s) * 60, s, humeur: 'content' });
  // Stéthoscope autour du cou du chaton
  x.strokeStyle = '#3b5b8a'; x.lineWidth = 7; x.lineCap = 'round';
  x.beginPath(); x.moveTo(250, 240); x.quadraticCurveTo(300, 300, 350, 240); x.stroke();
  circ(x, 300, 282, 12, '#9fb3c8');
  cheminCoeur(x, 300, 40, 18); x.fillStyle = '#f2557a'; x.fill();
}
$('#b-jouer').addEventListener('click', () => {
  premiereAction(); son.clic();
  JEL_SAVE.reprise({
    jeu: JEU,
    // Continuer : directement à la journée gardée (même si elle est encore fermée ici).
    onContinuer: (d) => {
      const j = Math.min(10, d.niveau);
      scorePartie = d.score; sauve.jourMax = Math.max(sauve.jourMax, j);
      demarrerJournee(j);
    },
    onNouvelle: () => {
      scorePartie = 0;
      let j = 1;
      while (j < sauve.jourMax && sauve.journees[j]) j++;
      demarrerJournee(Math.min(10, j));
    },
  });
});
effacerAccueil = JEL_SAVE.boutonEffacer({ jeu: JEU });
$('#b-jouer').after(effacerAccueil);
$('#b-journees').addEventListener('click', () => {
  premiereAction(); son.clic();
  const g = $('#grille-jours'); g.innerHTML = '';
  for (let j = 1; j <= 10; j++) {
    const b = document.createElement('button'), et = sauve.journees[j]?.etoiles || 0;
    b.className = 'jour'; b.disabled = j > sauve.jourMax;
    b.innerHTML = `${traduire('journeeN', { n: j })}<span>${j > sauve.jourMax ? traduire('fermee') : '★'.repeat(et) + '☆'.repeat(3 - et)}</span>`;
    b.addEventListener('click', () => { son.clic(); demarrerJournee(j); });
    g.append(b);
  }
  cacherEcrans(); $('#journees').classList.remove('cache');
  g.querySelector('.jour').focus();
});
$('#b-album').addEventListener('click', () => { premiereAction(); son.clic(); ouvrirAlbum(); });
function ouvrirAlbum() {
  const g = $('#grille-album'); g.innerHTML = '';
  for (const esp of ESPECES) {
    const n = sauve.album[esp.id] || 0, d = document.createElement('div'), cv = document.createElement('canvas');
    d.className = 'fiche'; cv.width = cv.height = 120;
    const x = cv.getContext('2d');
    dessinerAnimal(x, creerPatient(esp, '', 'oreilles'), { x: 60, y: 66, s: 0.3, humeur: n ? 'content' : 'neutre' });
    if (!n) { x.globalCompositeOperation = 'source-atop'; x.fillStyle = '#9aa7b8'; x.fillRect(0, 0, 120, 120); x.globalCompositeOperation = 'source-over'; }
    d.append(cv);
    const t = document.createElement('div');
    t.textContent = n ? `${esp.nom} ×${n}` : '?';
    d.append(t); g.append(d);
  }
  const tot = totalEtoiles();
  $('#liste-recomp').innerHTML = RECOMPENSES.map((r) => `<div class="${tot >= r.etoiles ? 'ok' : 'non'}">${tot >= r.etoiles ? '✓' : '★ ' + r.etoiles} — ${r.nom}</div>`).join('');
  const bs = $('#b-salle');
  bs.classList.toggle('cache', !debloque('jardin'));
  bs.textContent = traduire(sauve.salle === 'jardin' ? 'salleJardin' : 'salleClinique');
  cacherEcrans(); $('#album').classList.remove('cache');
}
$('#b-salle').addEventListener('click', () => {
  son.clic(); sauve.salle = sauve.salle === 'jardin' ? 'clinique' : 'jardin'; enregistrer(); ouvrirAlbum();
});
document.querySelectorAll('[data-retour]').forEach((b) => b.addEventListener('click', () => { son.clic(); allerAccueil(); }));

// ---------- Démarrage ----------
new ResizeObserver(() => { redimensionner(); if (jeuActif) dessiner(); }).observe($('#zone'));
redimensionner();
majBoutonsSon();
allerAccueil();
requestAnimationFrame(boucle);
</script>
