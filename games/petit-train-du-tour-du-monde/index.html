  // ------------------------------------------------------------------------
  // Progression sauvegardée
  // ------------------------------------------------------------------------
  const CLE_LOCALE = 'petit-train-du-tour-du-monde-progres';
  function progresVide() {
    return { debloque: 1, etoiles: Array(NB).fill(0), records: Array(NB).fill(0), temps: Array(NB).fill(0), garage: { wagon: 0, sifflet: 0, loco: 0 }, son: true };
  }
  function fusionner(p, d) {
    if (!d || typeof d !== 'object') return;
    const nb = (x) => typeof x === 'number' && isFinite(x);
    if (Array.isArray(d.etoiles)) d.etoiles.forEach((e, i) => { if (i < NB && nb(e)) p.etoiles[i] = Math.max(p.etoiles[i], clamp(Math.round(e), 0, 3)); });
    if (Array.isArray(d.records)) d.records.forEach((e, i) => { if (i < NB && nb(e)) p.records[i] = Math.max(p.records[i], Math.max(0, Math.round(e))); });
    if (Array.isArray(d.temps)) d.temps.forEach((e, i) => { if (i < NB && nb(e) && e > 0) p.temps[i] = p.temps[i] ? Math.min(p.temps[i], e) : e; });
    if (nb(d.debloque)) p.debloque = clamp(Math.max(p.debloque, Math.round(d.debloque)), 1, NB);
    if (d.garage && typeof d.garage === 'object') for (const k of ['wagon', 'sifflet', 'loco']) if (nb(d.garage[k])) p.garage[k] = Math.round(d.garage[k]);
    if (d.options && typeof d.options.son === 'boolean') p.son = d.options.son;
    if (typeof d.son === 'boolean') p.son = d.son;
  }
  let prog = progresVide();
  function chargerProgres() {
    prog = progresVide();
    try { const brut = localStorage.getItem(CLE_LOCALE); if (brut) fusionner(prog, JSON.parse(brut)); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE && JEL_SAVE.existe(JEU)) fusionner(prog, JEL_SAVE.load(JEU)); } catch (e) { /* sauvegarde illisible */ }
    for (let i = 0; i < NB; i++) if (prog.etoiles[i] > 0) prog.debloque = Math.max(prog.debloque, Math.min(NB, i + 2));
    verifierGarage();
  }
  function totalEtoiles() { return prog.etoiles.reduce((a, b) => a + b, 0); }
  function scoreTotal() { return prog.records.reduce((a, b) => a + b, 0); }
  function verifierGarage() {
    const tot = totalEtoiles();
    if (!COULEURS[prog.garage.wagon] || COULEURS[prog.garage.wagon].seuil > tot) prog.garage.wagon = 0;
    if (!SIFFLETS[prog.garage.sifflet] || SIFFLETS[prog.garage.sifflet].seuil > tot) prog.garage.sifflet = 0;
    if (!LOCOS[prog.garage.loco] || LOCOS[prog.garage.loco].seuil > tot) prog.garage.loco = 0;
  }

    return { niveau, score: scoreTotal(), etoiles: prog.etoiles.slice(), records: prog.records.slice(), temps: prog.temps.slice(), debloque: prog.debloque, garage: Object.assign({}, prog.garage), options: { son: prog.son } };
  }
  // Réglages (son, garage) : gardés sur l'appareil ; recopiés dans la sauvegarde seulement si elle existe déjà
  function sauverReglages() {
    ecrireLocal();
    try { if (window.JEL_SAVE && JEL_SAVE.existe(JEU)) JEL_SAVE.save(JEU, { garage: Object.assign({}, prog.garage), options: { son: prog.son } }); } catch (e) { /* rien */ }
  }

  // ------------------------------------------------------------------------
  // Interface
  // ------------------------------------------------------------------------
  const canvas = $('scene'), ctx = canvas.getContext('2d');
  const V = { W: 400, H: 800, trainY: 565, echelle: 1, dpr: 1 };
  function redimensionner() {
    const r = $('app').getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(r.width * dpr)); canvas.height = Math.max(1, Math.round(r.height * dpr));
    const ech = Math.min(r.width / 400, r.height / 760);
    V.echelle = ech; V.dpr = dpr; V.W = r.width / ech; V.H = r.height / ech; V.trainY = V.H - 235;
  }
  window.addEventListener('resize', redimensionner);

  let ecran = 'titre';

  const ICONE_SON_OUI = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';

  const ICONE_COEUR = (plein) => `<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="${plein ? '#e8443a' : '#d5d9e0'}" stroke="#7a1f14" stroke-width="1.2"/></svg>`;

  let minuteurToast = null;

  // --- Titre ---
  function majTitre() {
    $('titre-etoiles').textContent = traduire('titre.etoiles', { n: totalEtoiles(), max: NB * 3 });
  }

  // --- Niveaux ---
  function construireNiveaux() {
    const liste = $('liste-etapes'); liste.innerHTML = '';
    for (let e = 0; e < 12; e++) {
      const ligne = document.createElement('div'); ligne.className = 'etape-ligne';
      const cv = document.createElement('canvas'); cv.width = 100; cv.height = 100;
      const obtenu = prog.etoiles[e * 2 + 1] > 0;
      const c = cv.getContext('2d'); c.translate(50, 50); dessinerTampon(c, 92, e, obtenu);
      cv.setAttribute('aria-hidden', 'true');
      const nom = document.createElement('div'); nom.className = 'etape-nom';
      nom.textContent = traduire('intro.etape', { n: e + 1, pays: traduire('pays.' + PAYS[e].id) });

      for (let k = 0; k < 2; k++) {
        const n = e * 2 + k + 1;
        const b = document.createElement('button'); b.className = 'niv';
        if (n <= prog.debloque) {
          const et = prog.etoiles[n - 1];
          b.innerHTML = `<span>${nombre(n)}</span><span class="et">${'★'.repeat(et)}${'☆'.repeat(3 - et)}</span>`;
          b.setAttribute('aria-label', traduire('niv.aria', { n, e: et }));
          b.addEventListener('click', () => { Son.jouer('clic'); lancerNiveau(n); });
        } else {
          b.disabled = true; b.innerHTML = ICONE_CADENAS;
          b.setAttribute('aria-label', traduire('niv.ferme', { n }));

  // --- Carnet ---
  function construireCarnet() {
    const g = $('grille-tampons'); g.innerHTML = '';

      const c = cv.getContext('2d'); c.translate(64, 64); c.rotate(obtenu ? -0.08 + (e % 3) * 0.06 : 0); dessinerTampon(c, 116, e, obtenu);
      cv.setAttribute('aria-hidden', 'true');

  // --- Garage ---
  function construireGarage() {
    const tot = totalEtoiles();
    $('garage-etoiles').textContent = traduire('titre.etoiles', { n: tot, max: NB * 3 });
    const remplir = (id, liste, cle, contenu, nomCle) => {
      const z = $(id); z.innerHTML = '';
      liste.forEach((it, i) => {
        const b = document.createElement('button'); b.className = 'choix' + (prog.garage[cle] === i ? ' choisi' : '');
        const ouvert = it.seuil <= tot;
        b.innerHTML = contenu(it, i) + `<span>${ouvert ? traduire(nomCle + it.id) : traduire('garage.seuil', { n: it.seuil })}</span>`;
        b.setAttribute('aria-pressed', prog.garage[cle] === i ? 'true' : 'false');
        if (!ouvert) { b.disabled = true; b.setAttribute('aria-label', traduire('garage.ferme', { nom: traduire(nomCle + it.id), n: it.seuil })); }
        b.addEventListener('click', () => {
          prog.garage[cle] = i; sauverReglages(); Son.init();
          if (cle === 'sifflet') Son.sifflet(i); else Son.jouer('clic');
          construireGarage();
        });
        z.appendChild(b);
      });
    };
    remplir('choix-wagons', COULEURS, 'wagon', (it) => `<span class="pastille" style="background:${it.c.length > 1 ? 'linear-gradient(90deg,' + it.c.join(',') + ')' : it.c[0]}"></span>`, 'couleur.');
    remplir('choix-sifflets', SIFFLETS, 'sifflet', () => '<svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 10h9a5 5 0 1 1 0 6H8l-5-2z" fill="#f2b51d" stroke="#23324a" stroke-width="1.6"/></svg>', 'sifflet.');
    remplir('choix-locos', LOCOS, 'loco', (it) => `<span class="pastille" style="background:${it.id === 'vapeur' ? '#2b2b33' : '#e8573f'}"></span>`, 'loco.');
    // aperçu
    const cv = $('garage-apercu'), c = cv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#93cf6b'; c.fillRect(0, 0, cv.width, cv.height);
    c.setTransform(2, 0, 0, 2, 0, 0);
    c.fillStyle = '#7a5634'; for (let x = 4; x < 340; x += 22) c.fillRect(x, 42, 5, 26);
    c.fillStyle = '#5d6470'; c.fillRect(0, 47, 340, 3); c.fillRect(0, 60, 340, 3);
    const st = styleJoueur(null);
    const pieces = [{ x: 270, loco: true }, { x: 210 }, { x: 160 }, { x: 110 }];
    pieces.forEach((p, k) => { c.save(); c.translate(p.x, 55); c.rotate(Math.PI / 2); ellipse(c, 3, 3, 13, 22, 0, 'rgba(0,0,0,.2)'); if (p.loco) dessinerLoco(c, st); else dessinerWagon(c, st.wagons[(k - 1) % st.wagons.length], 3, st.or); c.restore(); });
  }

  // --- Lancement d'un niveau ---
  function lancerNiveau(n) {
    N = clamp(n, 1, NB);
    calc = calculer(N);
    monde = creerMonde(N, { evt: surEvenement });
    if (calc.cap) monde.rival = { s: 60, v: 0, cap: calc.cap, fini: false };
    partieEnCours = true;
    appuisActifs.clear(); appuiClavier = false;
    // carte d'étape
    const d = NIVEAUX[N - 1];
    $('intro-pays').textContent = traduire('intro.etape', { n: d.e + 1, pays: traduire('pays.' + PAYS[d.e].id) });
    $('intro-niveau').textContent = traduire('intro.niveau', { n: N, max: NB });
    const obj = $('intro-objectifs'); obj.innerHTML = '';
    const ajouter = (txt) => { const li = document.createElement('li'); li.textContent = txt; obj.appendChild(li); };
    ajouter(traduire('obj.temps', { t: nombre(calc.objectif) }));
    if (monde.L.gares.length) ajouter(traduire('obj.gares', { n: monde.L.gares.length, v: Math.ceil(monde.voyMax * 0.75) }));
    if (monde.total) ajouter(traduire('obj.passages', { n: monde.total }));
    if (d.rival) ajouter(traduire('obj.rival'));
    if (d.glace) ajouter(traduire('obj.glace'));
    if (d.pluie) ajouter(traduire('obj.pluie'));
    if (d.nuit) ajouter(traduire('obj.nuit'));
    ajouter(traduire('obj.terminus'));
    if (d.nouv) {
      demoType = d.nouv;
      $('intro-tuto').classList.add('visible');
      $('intro-tuto-titre').textContent = traduire('tuto.' + d.nouv + '.titre');
      const ol = $('intro-etapes'); ol.innerHTML = '';
      for (let i = 1; i <= ETAPES_TUTO[d.nouv]; i++) { const li = document.createElement('li'); li.textContent = traduire('tuto.' + d.nouv + '.' + i); ol.appendChild(li); }
      nouvelleDemo();
    } else {
      demoType = null; demo = null;
      $('intro-tuto').classList.remove('visible');
    }
    majHud();
    montrer('intro');
  }
  function nouvelleDemo() {
    const d = NIVEAUX[N - 1];
    const def = Object.assign({ e: d.e }, DEMOS[demoType]);
    demo = creerMonde(1, { auto: true, def });
    if (def.rival) demo.rival = { s: 60, v: 0, cap: def.rival, fini: false };
    demo.pause = 0;
  }
  function partir() {
    if (ecran !== 'intro') return;
    Son.init(); Son.reveil();
    demo = null;
    montrer('jeu');
    toast(traduire('msg.enRoute'), 'bon');
    Son.sifflet(prog.garage.sifflet);
    dernierTemps = performance.now();
  }

  // --- HUD ---
  function majHud() {
    if (!monde) return;
    const d = NIVEAUX[N - 1];
    $('hud-info').textContent = traduire('hud.info', { n: N, pays: traduire('pays.' + PAYS[d.e].id) });
    const pt = $('puce-temps');
    pt.textContent = traduire('hud.temps', { t: fmtTemps(monde.t), o: nombre(calc.objectif) });
    pt.classList.toggle('rouge', monde.t > calc.objectif);
    const pv = $('puce-voy');
    pv.style.display = monde.voyMax ? '' : 'none';
    pv.textContent = traduire('hud.voy', { n: monde.voy, max: monde.voyMax });
    const reste = MAX_INCIDENTS - monde.incidents;
    const pc = $('puce-coeurs');
    const cle = 'c' + reste;
    if (pc.dataset.cle !== cle) { pc.dataset.cle = cle; pc.innerHTML = [0, 1, 2].map((i) => ICONE_COEUR(i < reste)).join(''); pc.setAttribute('aria-label', traduire('hud.chances', { n: reste })); }
    const br = $('barre-rival');
    br.classList.toggle('visible', !!monde.rival);
    if (monde.rival) {
      const larg = br.clientWidth - 40, L = monde.L;
      $('marq-moi').style.left = (14 + larg * clamp(monde.s / L.fin.c, 0, 1)) + 'px';
      $('marq-rival').style.left = (14 + larg * clamp(monde.rival.s / L.fin.c, 0, 1)) + 'px';
    }
    // levier d'aiguillage
    const lv = $('levier');
    let a = null;
    for (const ai of monde.L.aigs) if (!ai.verrou && monde.s > ai.s0 - 900) { a = ai; break; }
    if (a && ecran === 'jeu') {
      lv.classList.add('visible');
      const actif = levierFenetre(monde, a);
      lv.classList.toggle('actif', actif);
      const cleL = a.choix + actif;
      if (lv.dataset.cle !== cleL) { lv.dataset.cle = cleL; lv.innerHTML = ICONE_LEVIER(a.choix); lv.setAttribute('aria-label', traduire(a.choix === 'droit' ? 'hud.levierDroit' : 'hud.levierDerive')); }
    } else lv.classList.remove('visible');
  }
  function aiguillageCourant() {
    if (!monde) return null;
    for (const ai of monde.L.aigs) if (!ai.verrou && monde.s > ai.s0 - 900) return ai;
    return null;
  }
  let aideLevierDonnee = false;
  function actionnerLevier(choix) {
    const a = aiguillageCourant();
    if (!a || ecran !== 'jeu' || monde.fini) return;
    if (!levierFenetre(monde, a)) {
      if (!aideLevierDonnee) { toast(traduire('msg.levierPasEncore')); aideLevierDonnee = true; }
      Son.jouer('erreur'); return;
    }
    const nouveau = choix || (a.choix === 'droit' ? 'derive' : 'droit');
    if (nouveau !== a.choix) { a.choix = nouveau; Son.jouer('clac'); majHud(); }
  }

  // --- Événements du monde (sons, messages, points) ---
  function surEvenement(type, donnee) {
    const m = monde;
    switch (type) {
      case 'incident':
        Son.jouer('deraille');
        toast(traduire(donnee === 'feu' ? 'msg.feu' : 'msg.deraille'), 'mauvais');
        break;
      case 'heurtoir': Son.jouer('heurtoir'); toast(traduire('msg.heurtoir'), 'mauvais'); break;
      case 'gare':
        Son.jouer('cloche');
        for (let i = 0; i < donnee.n; i++) setTimeout(() => Son.jouer('monte'), 200 + i * 140);
        toast(traduire(donnee.parfait ? 'msg.gareParfaite' : 'msg.gareOk', { n: donnee.n }), donnee.parfait ? 'bon' : '');
        flotter(m, m.s + 20, xTrain(m.L, m.s, V.W) + 40, traduire('flot.voy', { n: donnee.n }), '#ffe066');
        break;
      case 'gareRatee': Son.jouer('erreur'); toast(traduire('msg.gareRatee'), 'mauvais'); break;
      case 'depart': Son.sifflet(prog.garage.sifflet); break;
      case 'aigBon': toast(traduire('msg.aigBon'), 'bon'); Son.jouer('point'); break;
      case 'aigLent': toast(traduire('msg.aigLent')); break;
      case 'zoneOk': Son.jouer('point'); flotter(m, donnee.s, donnee.x + 30, traduire('flot.points', { n: 25 }), '#fff'); break;
      case 'sonnerie': toast(traduire('msg.animaux')); break;
      case 'feuVert': Son.jouer('feuVert'); break;
      case 'frein': Son.jouer('frein'); break;
      case 'rivalArrive': break;
      case 'fin': setTimeout(() => { if (monde === m && ecran === 'jeu') finNiveau(donnee); else if (monde === m) m.finAttente = donnee; }, donnee.gagne ? 900 : 1300); break;
    }
  }

  // --- Fin de niveau ---
  function finNiveau(res) {
    if (!monde || ecran === 'titre') return;
    const m = monde;
    const ligne = (ok, txt) => `<li class="${ok === null ? '' : ok ? 'ok' : 'ko'}">${ok === null ? '•' : ok ? '✓' : '✗'} ${txt}</li>`;
    const lignes = $('fin-lignes'), bonus = $('fin-bonus');
    lignes.innerHTML = ''; bonus.innerHTML = '';
    $('fin-tampon').classList.remove('visible');
    const okTemps = m.t <= calc.objectif;
    const voyBesoin = Math.ceil(m.voyMax * 0.75);
    const okVoy = m.voyMax === 0 || m.voy >= voyBesoin;
    const okPass = m.incidents === 0;
    let etoiles = 0, score = 0;
    const echapper = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
    let h = ligne(res.gagne ? okTemps : null, echapper(traduire('fin.temps', { t: fmtTemps(m.t), o: nombre(calc.objectif) })));
    h += ligne(res.gagne ? okVoy : null, echapper(m.voyMax ? traduire('fin.voy', { n: m.voy, max: m.voyMax, besoin: voyBesoin }) : traduire('fin.sansGare')));
    h += ligne(res.gagne ? okPass : null, echapper(traduire('fin.pass', { n: m.ok, max: m.total, i: m.incidents })));
    lignes.innerHTML = h;
    const etoilesSpans = $('fin-etoiles').children;
    for (const s of etoilesSpans) s.classList.remove('gagnee');
    if (res.gagne) {
      const defis = [okTemps, okVoy, okPass].filter(Boolean).length;
      etoiles = 1 + (defis >= 2 ? 1 : 0) + (defis === 3 ? 1 : 0);
      score = m.voy * 10 + m.ok * 25 + Math.max(0, Math.round((calc.objectif - m.t) * 5)) + (m.arretParfait ? 50 : 0) + etoiles * 100;
      const totAvant = totalEtoiles();
      const premiereFois = prog.etoiles[N - 1] === 0;
      const ancienRecord = prog.records[N - 1];
      prog.etoiles[N - 1] = Math.max(prog.etoiles[N - 1], etoiles);
      prog.records[N - 1] = Math.max(ancienRecord, score);
      prog.temps[N - 1] = prog.temps[N - 1] ? Math.min(prog.temps[N - 1], Math.round(m.t * 10) / 10) : Math.round(m.t * 10) / 10;
      prog.debloque = Math.max(prog.debloque, Math.min(NB, N + 1));
      const totApres = totalEtoiles();
      $('fin-titre').textContent = traduire(N === NB ? 'fin.tourDuMonde' : 'fin.bravo');
      $('fin-raison').textContent = m.arretParfait ? traduire('fin.parfait') : '';
      $('fin-raison').style.color = '#1e8a3c';
      $('fin-record').textContent = score > ancienRecord ? traduire('fin.record') : traduire('fin.recordAncien', { n: nombre(ancienRecord) });
      // nouveautés du garage
      const debloques = [];
      COULEURS.forEach((it) => { if (it.seuil > totAvant && it.seuil <= totApres) debloques.push(traduire('couleur.' + it.id)); });
      SIFFLETS.forEach((it) => { if (it.seuil > totAvant && it.seuil <= totApres) debloques.push(traduire('sifflet.' + it.id)); });
      LOCOS.forEach((it) => { if (it.seuil > totAvant && it.seuil <= totApres) debloques.push(traduire('loco.' + it.id)); });
      for (const nom of debloques) { const li = document.createElement('li'); li.textContent = traduire('fin.debloque', { nom }); bonus.appendChild(li); }
      // tampon de l'étape
      if (N % 2 === 0 && premiereFois) {
        const e = N / 2 - 1;
        const cv = $('fin-tampon'), c = cv.getContext('2d');
        c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height); c.translate(96, 96); dessinerTampon(c, 176, e, true);
        setTimeout(() => { cv.classList.add('visible'); Son.jouer('tampon'); }, 400 + etoiles * 350);
        const li = document.createElement('li'); li.textContent = traduire('fin.tampon', { pays: traduire('pays.' + PAYS[e].id) }); bonus.appendChild(li);
      }
      verifierGarage(); ecrireLocal();
      try { JEL_SAVE.save(JEU, donnees(Math.min(N + 1, NB))); } catch (e) { /* rien */ }
      Son.jouer('victoire');
      for (let i = 0; i < etoiles; i++) setTimeout(() => { etoilesSpans[i].classList.add('gagnee'); Son.jouer('etoile'); }, 350 + i * 350);
      confettis(etoiles * 40 + 30);
    } else {
      $('fin-titre').textContent = traduire('fin.perdu');
      $('fin-raison').textContent = traduire(res.raison === 'rival' ? 'fin.raison.rival' : 'fin.raison.incidents');
      $('fin-raison').style.color = '#9b2a17';
      $('fin-record').textContent = prog.records[N - 1] ? traduire('fin.recordAncien', { n: nombre(prog.records[N - 1]) }) : '';
      Son.jouer('defaite');
    }
    $('fin-etoiles-texte').textContent = traduire('fin.etoilesTexte', { n: etoiles });
    animerScore(score);
    $('btn-suivant').style.display = res.gagne && N < NB ? '' : 'none';
    $('btn-reessayer').style.display = res.gagne ? 'none' : '';
    $('btn-rejouer').style.display = res.gagne ? '' : 'none';
    partieEnCours = false;
    montrer('fin');
    if (!res.gagne) setTimeout(() => $('btn-reessayer').focus(), 40);
  }
  function animerScore(cible) {
    const el = $('fin-score');
    const debut = performance.now();
    const pas = () => {
      const k = clamp((performance.now() - debut) / 1200, 0, 1);
      el.textContent = traduire('fin.score', { n: nombre(Math.round(cible * sm(k))) });
      if (k < 1 && ecran === 'fin') requestAnimationFrame(pas);
    };
    pas();
  }

  // Confettis (coordonnées de l'écran)
  let confs = [];
  function confettis(n) {
    for (let i = 0; i < n; i++) confs.push({ x: Math.random() * V.W, y: -20 - Math.random() * 200, vx: (Math.random() - 0.5) * 60, vy: 120 + Math.random() * 160, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 8, c: COUL_HABITS[i % COUL_HABITS.length], vie: 3.5 });
  }

  // ------------------------------------------------------------------------
  // Commandes : doigt / souris / clavier
  // ------------------------------------------------------------------------
  const appuisActifs = new Set();
  let appuiClavier = false;
  function majAppui() { if (monde) monde.appui = appuisActifs.size > 0 || appuiClavier; }
  function toucherFin() { appuisActifs.clear(); appuiClavier = false; majAppui(); }
  canvas.addEventListener('pointerdown', (e) => {
    Son.init(); Son.reveil();
    if (ecran !== 'jeu') return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
    appuisActifs.add(e.pointerId); majAppui();
  });
  const relacher = (e) => { appuisActifs.delete(e.pointerId); majAppui(); };
  canvas.addEventListener('pointerup', relacher);
  canvas.addEventListener('pointercancel', relacher);
  canvas.addEventListener('lostpointercapture', relacher);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  $('levier').addEventListener('pointerdown', (e) => { e.preventDefault(); Son.init(); actionnerLevier(); });
  $('levier').addEventListener('click', (e) => { if (e.detail === 0) actionnerLevier(); });

  document.addEventListener('keydown', (e) => {
    Son.init(); Son.reveil();
    if (carteOuverte >= 0 && (e.code === 'Escape')) { fermerCarte(); return; }
    if (ecran === 'jeu') {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); appuiClavier = true; majAppui(); }
      else if (e.code === 'ArrowRight') { e.preventDefault(); actionnerLevier('derive'); }
      else if (e.code === 'ArrowLeft') { e.preventDefault(); actionnerLevier('droit'); }
      else if (e.code === 'Enter' || e.code === 'KeyA' || e.code === 'KeyQ') { e.preventDefault(); actionnerLevier(); }
      else if (e.code === 'KeyH') { Son.sifflet(prog.garage.sifflet); }
      else if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); pauser(); }
    } else if (ecran === 'intro') {
      if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); partir(); }
    } else if (ecran === 'pause') {
      if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); reprendre(); }
    } else if (ecran === 'niveaux' || ecran === 'carnet' || ecran === 'garage') {
      if (e.code === 'Escape') { e.preventDefault(); montrer('titre'); }
    }
  });
  document.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { appuiClavier = false; majAppui(); }
  });

  function pauser() {
    if (ecran !== 'jeu' || !monde || monde.fini) return;
    toucherFin();
    montrer('pause');
  }
  function reprendre() {
    if (ecran !== 'pause') return;
    montrer('jeu');
    dernierTemps = performance.now();
    if (monde && monde.finAttente) { const r = monde.finAttente; monde.finAttente = null; finNiveau(r); }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') pauser(); });
  window.addEventListener('blur', () => { toucherFin(); });

  // Boutons des écrans
  const clic = (id, f) => $(id).addEventListener('click', () => { Son.init(); Son.reveil(); Son.jouer('clic'); f(); });
  clic('btn-jouer', () => {
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => {
        chargerProgres();
        const n = clamp(Math.round(Number(d && d.niveau) || 1), 1, NB);
        prog.debloque = Math.max(prog.debloque, n);
        lancerNiveau(n);
      },
      onNouvelle: () => { lancerNiveau(1); },
      onEffacer: () => { try { localStorage.removeItem(CLE_LOCALE); } catch (e) { /* rien */ } prog = progresVide(); majBoutonsSon(); majTitre(); lancerNiveau(1); }
    });
  });
  clic('btn-niveaux', () => { construireNiveaux(); montrer('niveaux'); });
  clic('btn-carnet', () => { construireCarnet(); montrer('carnet'); });
  clic('btn-garage', () => { construireGarage(); montrer('garage'); });
  document.querySelectorAll('[data-retour]').forEach((b) => b.addEventListener('click', () => { Son.jouer('clic'); majTitre(); montrer('titre'); }));
  document.querySelectorAll('.bouton-son').forEach((b) => b.addEventListener('click', basculerSon));
  clic('btn-partir', partir);
  $('ecran-intro').addEventListener('click', (e) => { if (e.target.closest('button')) return; partir(); });
  clic('btn-pause', pauser);
  $('btn-sifflet').addEventListener('click', () => { Son.init(); Son.reveil(); Son.sifflet(prog.garage.sifflet); });
  clic('btn-reprendre', reprendre);
  clic('btn-recommencer', () => lancerNiveau(N));
  clic('btn-accueil', () => { partieEnCours = false; monde = null; majTitre(); montrer('titre'); });
  clic('btn-suivant', () => lancerNiveau(N + 1));
  clic('btn-reessayer', () => lancerNiveau(N));
  clic('btn-rejouer', () => lancerNiveau(N));
  clic('btn-fin-niveaux', () => { monde = null; construireNiveaux(); montrer('niveaux'); });
  clic('cp-fermer', fermerCarte);
  $('carte-postale').addEventListener('click', (e) => { if (e.target.id === 'carte-postale') fermerCarte(); });

  // Sauvegarde à la fermeture, seulement pendant une partie
  JEL_SAVE.surFermeture(() => {
    if (partieEnCours) { ecrireLocal(); JEL_SAVE.save(JEU, donnees(N)); }
  });

  // Changement de langue (jeu ouvert seul) : on réécrit les textes affichés
  if (I18N.surChangement) I18N.surChangement(() => {
    majTitre(); majBoutonsSon();
    if (ecran === 'niveaux') construireNiveaux();
    if (ecran === 'carnet') construireCarnet();
    if (ecran === 'garage') construireGarage();
    if (monde) { $('puce-coeurs').dataset.cle = ''; $('levier').dataset.cle = ''; majHud(); }
  });

  // ------------------------------------------------------------------------
  // Boucle principale
  // ------------------------------------------------------------------------
  let dernierTemps = performance.now(), cumul = 0, tempsTitre = 0, tempsDemo = 0, minuterieSon = 0, phaseChuff = 0;
  const PAS = 1 / 60;
  function boucle(maintenant) {
    let dt = (maintenant - dernierTemps) / 1000; dernierTemps = maintenant;
    if (!(dt > 0)) dt = 0; dt = Math.min(dt, 0.1);
    tempsTitre += dt;

    // simulation
    if (ecran === 'jeu' && monde) {
      cumul += dt;
      let n = 0;
      while (cumul >= PAS && n < 6) { majMonde(monde, PAS); cumul -= PAS; n++; }
      if (n === 6) cumul = 0;
      // sons continus
      phaseChuff += monde.v * dt;
      if (phaseChuff > (prog.garage.loco === 1 ? 70 : 55) && monde.phase === 'conduite' && !monde.fini) { phaseChuff = 0; Son.jouer('chuff'); }
      minuterieSon -= dt;
      if (minuterieSon <= 0) {
        if (monde.alerte) { Son.jouer('alerte'); minuterieSon = 0.22; }
        else {
          const p = monde.L.passages.find((q) => q.trig !== null && !q.vert && Math.abs(q.s - monde.s) < 600);
          minuterieSon = p ? 0.5 : 0.1;
          if (p) Son.jouer('sonnerie');
        }
      }
      majHud();
    } else if (monde && (ecran === 'fin' || ecran === 'pause' || ecran === 'intro')) {
      if (ecran === 'fin') majEffets(monde, dt);
    }

    // dessin
    ctx.setTransform(V.echelle * V.dpr, 0, 0, V.echelle * V.dpr, 0, 0);
    if (monde && (ecran === 'jeu' || ecran === 'pause' || ecran === 'fin' || ecran === 'intro')) {
      dessinerMonde(ctx, V, monde);
      if (ecran === 'jeu' || ecran === 'pause') dessinerJauge(ctx, V, monde);
    } else {
      dessinerTitre(ctx, V, tempsTitre);
    }
    if (confs.length) {
      for (const p of confs) { p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.vie -= dt; }
      confs = confs.filter((p) => p.vie > 0 && p.y < V.H + 30);
      for (const p of confs) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-4, -2.5, 8, 5); ctx.restore(); }
    }

    // démonstration du tutoriel
    if (ecran === 'intro' && demo) {
      tempsDemo += dt;
      if (demo.fini) { demo.pause += dt; if (demo.pause > 1.4) nouvelleDemo(); }
      else for (let i = 0; i < 2; i++) majMonde(demo, Math.min(dt, 0.05) / 2);
      if (demo.rival && demo.rival.fini && !demo.fini) demo.fini = true;
      const cv = $('mini'), c = cv.getContext('2d');
      const ech = cv.width / 400;
      const Vm = { W: 400, H: cv.height / ech, trainY: cv.height / ech * 0.7 };
      c.setTransform(ech, 0, 0, ech, 0, 0);
      dessinerMonde(c, Vm, demo, { cle: 'mini' });
      dessinerJauge(c, Vm, demo);
      // la main montre le geste
      if (demo.mainLevier > 0) { cercle(c, 350, Vm.H - 50, 30, 'rgba(63,174,90,.9)'); dessinerMain(c, 356, Vm.H - 34, true); }
      else if (!demo.fini) dessinerMain(c, 300, Vm.H - 60, demo.dernierAppui);
      // étape du tutoriel en cours
      const lis = $('intro-etapes').children;
      let k = 0;
      if (demoType === 'base') k = demo.fini || (demo.v === 0 && demo.s > 200) ? 2 : demo.dernierAppui ? 0 : 1;
      else if (demoType === 'aig') k = demo.L.aigs[0] && !demo.L.aigs[0].verrou ? (demo.L.aigs[0].choix === demo.L.aigs[0].rapide ? 1 : 0) : 2;
      else if (demoType === 'gare' || demoType === 'pente') k = demo.L.gares.length ? (demo.L.gares[0].etat === 0 ? (demo.dernierAppui ? 0 : 1) : 2) : (pente(demo.L, demo.s) ? 1 : demo.s > (demo.L.pentes[0] ? demo.L.pentes[0].s1 : 0) ? 2 : 0);
      else k = Math.floor(tempsDemo / 2.2) % lis.length;
      for (let i = 0; i < lis.length; i++) lis[i].classList.toggle('actif', i === k);
    }
    requestAnimationFrame(boucle);
  }

  // ------------------------------------------------------------------------
  // Démarrage
  // ------------------------------------------------------------------------
  chargerProgres();
  redimensionner();
  majBoutonsSon();
  majTitre();
  montrer('titre');
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
