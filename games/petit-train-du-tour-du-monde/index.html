<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);

      if (/^https?:$/.test(location.protocol)) {

        u.searchParams.set('lang', c);
        location.replace(u.href);

      return Promise.resolve(c);

        history.replaceState(history.state, '', adresse.href);

  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +

    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +

    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });

  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {

      if (isole && !coin && hote) {

        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }

    }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};

  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

  #fin-bonus { list-style: none; padding: 0; margin: 6px 0; font-weight: 800; color: #2a5fb8; font-size: 15px; }

  @keyframes tampon { 0% { transform: scale(2.6) rotate(-25deg); opacity: 0; } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }

  #ecran-pause { justify-content: center; }

<script>

(function () {
  'use strict';

  const JEU = 'petit-train-du-tour-du-monde';  const I18N = window.JEL_I18N;

  const DIST_DECLENCHE = 450;    // les animaux commencent à traverser à cette distance

  // ------------------------------------------------------------------------
  const PAYS = [

    { id: 'egypte', sol: '#ecd193', sol2: '#e2c47f', deco: ['dune', 'dune', 'palmier', 'pyramide', 'chameau', 'rocher'], animal: 'chameau', teinte: '#d8a02c' },
    { id: 'kenya', sol: '#d8c46c', sol2: '#cbb55c', deco: ['acacia', 'acacia', 'herbe', 'girafe', 'rocher'], animal: 'girafe', teinte: '#2f8a4a' },
    { id: 'canada', sol: '#eef6fb', sol2: '#dfedf7', deco: ['sapinneige', 'glace', 'glace', 'ours', 'igloo'], animal: 'ours', teinte: '#c8323c' },
    { id: 'suisse', sol: '#86c86e', sol2: '#78ba60', deco: ['sapin', 'sapin', 'rocher', 'chalet', 'vache', 'rocher'], animal: 'vache', teinte: '#d32f2f' },

  ];

  // ------------------------------------------------------------------------
  // Les niveaux. p = piste : nombre = écart, D± virage doux, S± virage serré,

  // <n = revenir de n en arrière (élément placé dans le précédent).
  // ------------------------------------------------------------------------
  const NIVEAUX = [
    { e: 0, p: '3400', nouv: 'base' },
    { e: 0, p: '700 D+ 600 D- 700 D+ 500 D- 900', nouv: 'doux' },
    { e: 1, p: '600 D+ 500 S- 600 D- 450 S+ 500 S- 600 D+ 400 S+ 800', nouv: 'serre' },
    { e: 1, p: '600 A1 500 D+ 500 A0 450 S- 500 A1 400 D- 450 A0 700', nouv: 'aig' },
    { e: 2, p: '600 G 700 D+ 600 G 600 S- 600 G 800', nouv: 'gare' },
    { e: 2, p: '500 G 500 A1 400 S+ 450 G 400 D- 300 A0 450 S- 500 G 700' },
    { e: 3, p: '600 P 600 D+ 500 P 500 S- 500 G 500 P 400 D- 700', nouv: 'passage' },
    { e: 3, p: '500 G 250 A0 450 P 450 S+ 400 G 300 A1 400 P 350 D- 300 S+ 700' },
    { e: 4, p: '600 B 600 D+ 500 B 450 S- 500 P 450 B 500 G 700', nouv: 'pont' },
    { e: 4, p: '500 S+ 350 B 400 G 400 P 350 S- 300 B 450 A1 400 G 300 D+ 250 S- 700' },
    { e: 5, p: '700 D+ 600 G 600 S- 550 P 600 B 500 D- 500 G 900', glace: true, nouv: 'glace' },
    { e: 5, p: '600 G 500 S+ 450 S- 500 P 450 G 400 A0 450 B 400 S+ 500 G 900', glace: true, vert: 30 },
    { e: 6, p: '600 T <560 D+ 600 G 500 T <600 S- 600 P 450 D- 500 T <600 S+ 500 G 800', nouv: 'tunnel', vert: 30 },
    { e: 6, p: '600 M- 300 D+ 500 M+ 400 G 500 M- <300 S- 500 B 500 M+ <500 P 600 G 800', nouv: 'pente', vert: 30 },
    { e: 7, p: '500 M- 100 S+ 500 M- 100 B 400 G 400 M- <200 D- 450 T <600 S- 500 M- 100 B 300 P 500 G 700', nouv: 'combo', vert: 30 },
    { e: 7, p: '500 G 400 T <700 M- <400 S+ 600 M+ 300 G 400 A1 400 M- 100 S- 400 P 400 T <560 D+ 500 B 400 G 800', vert: 30 },
    { e: 8, p: '700 D+ 600 S- 600 B 600 D- 500 S+ 600 M- 100 D+ 600 T <600 S- 800', rival: 1.16, nouv: 'rival', vert: 30 },
    { e: 8, p: '600 G 400 A1 400 S+ 500 G 300 A0 400 B 450 D- 400 G 400 A1 350 S- 700', rival: 1.13, vert: 30 },
    { e: 9, p: '600 P 450 B 400 S+ 450 A0 400 P 400 G 400 M- 100 B 400 P 350 D- 400 S+ 800', rival: 1.12, vert: 30 },
    { e: 9, p: '600 D+ 500 G 500 S- 500 P 500 B 500 T <600 D- 600 G 400 S+ 500 P 400 G 800', nuit: true, nouv: 'nuit', vert: 30 },
    { e: 10, p: '600 S+ 500 G 450 P 450 M- 100 S- 450 B 400 A1 400 G 350 D+ 300 S- 450 P 400 G 800', pluie: true, nouv: 'pluie', vert: 28 },
    { e: 10, p: '600 S- 450 A1 400 B 400 G 400 M- 100 S+ 400 P 400 T <600 D- 500 A0 400 S+ 400 G 800', pluie: true, rival: 1.09, vert: 28 },
    { e: 11, p: '500 G 250 G 350 S+ 300 G 300 P 300 G 250 A1 300 G 300 D- 250 G 300 B 300 G 700', nouv: 'pointe', vert: 22, voy: 10 },
    { e: 11, p: '600 G 400 A1 400 S+ 400 P 400 M- 100 B 400 T <600 S- 500 G 300 A0 350 D+ 300 S- 400 P 400 M- <300 S+ 400 G 400 B 800', rival: 1.07, vert: 24, voy: 10, nouv: 'final' }
  ];
  window.JEL_NIVEAUX = NIVEAUX.length;
  const NB = NIVEAUX.length;

  // Démonstrations animées des tutoriels (mini-piste jouée par le conducteur automatique)
  const DEMOS = {
    base: { p: '700' },
    doux: { p: '450 D+ 500' },
    serre: { p: '450 S- 500' },
    aig: { p: '420 A1 450' },
    gare: { p: '420 G 450' },
    passage: { p: '380 P 450' },
    pont: { p: '420 B 450' },
    glace: { p: '420 S+ 300 G 350', glace: true },
    tunnel: { p: '380 T <600 D+ 500' },
    pente: { p: '380 M- <300 S+ 450' },
    combo: { p: '350 M- 100 B 450' },
    rival: { p: '420 D+ 300 S- 450', rival: 0.82 },
    nuit: { p: '380 D+ 300 P 450', nuit: true },
    pluie: { p: '380 S+ 300 G 380', pluie: true },
    pointe: { p: '300 G 200 G 380', vert: 22, voy: 10 },
    final: { p: '380 G 300 A1 450', rival: 0.82 }
  };
  const ETAPES_TUTO = { base: 3, doux: 2, serre: 2, aig: 3, gare: 3, passage: 2, pont: 2, glace: 2, tunnel: 2, pente: 3, combo: 2, rival: 2, nuit: 2, pluie: 2, pointe: 2, final: 2 };

  // Garage : déblocages par nombre d'étoiles
  const COULEURS = [
    { id: 'rouge', c: ['#e8573f'], seuil: 0 }, { id: 'bleu', c: ['#3d7bd9'], seuil: 3 },
    { id: 'vert', c: ['#3fae5a'], seuil: 8 }, { id: 'jaune', c: ['#f4c542'], seuil: 14 },
    { id: 'violet', c: ['#8e5bd6'], seuil: 20 }, { id: 'orange', c: ['#f08a24'], seuil: 28 },
    { id: 'arcenciel', c: ['#e8573f', '#f4c542', '#3fae5a', '#3d7bd9'], seuil: 36 }, { id: 'or', c: ['#e0b13a'], seuil: 48 }
  ];
  const SIFFLETS = [{ id: 'classique', seuil: 0 }, { id: 'aigu', seuil: 6 }, { id: 'corne', seuil: 18 }, { id: 'melodie', seuil: 32 }];
  const LOCOS = [{ id: 'diesel', seuil: 0 }, { id: 'vapeur', seuil: 30 }];

  // ------------------------------------------------------------------------
  // Petits outils
  // ------------------------------------------------------------------------
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function hasard(graine) { const x = Math.sin(graine * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function sm(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function rr(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function cercle(c, x, y, r, coul) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = coul; c.fill(); }
  function ellipse(c, x, y, rx, ry, rot, coul) { c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2); c.fillStyle = coul; c.fill(); }
  function fmtTemps(s) { return nombre(Math.round(s * 10) / 10, { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }

  // ------------------------------------------------------------------------
  // Construction d'un niveau à partir de sa piste
  // ------------------------------------------------------------------------
  function construire(N, def) {
    const d = def || NIVEAUX[N - 1];
    const pays = PAYS[d.e !== undefined ? d.e : 0];
    const L = {
      N, d, pays, zones: [], aigs: [], gares: [], passages: [], pentes: [],
      frein: d.glace ? 0.5 : d.pluie ? 0.65 : 1, glace: !!d.glace, pluie: !!d.pluie, nuit: !!d.nuit,
      rival: d.rival || 0, voy: d.voy || 6, vert: d.vert || 38, xc: d.rival ? 45 : 0
    };
    const ampMul = d.rival ? 0.75 : 1;
    let cur = 0;
    for (const tok of d.p.trim().split(/\s+/)) {
      if (/^\d+$/.test(tok)) { cur += +tok; continue; }
      if (tok[0] === '<') { cur -= +tok.slice(1); continue; }
      const type = tok[0], s0 = cur, s1 = cur + LONG[type];
      if (type === 'D' || type === 'S') {
        L.zones.push({ type: type === 'D' ? 'doux' : 'serre', s0, s1, lim: type === 'D' ? LIM.doux : LIM.serre, dir: tok[1] === '-' ? -1 : 1, amp: (type === 'D' ? 70 : 105) * ampMul, courbe: true, etat: 0 });
      } else if (type === 'B') {
        L.zones.push({ type: 'pont', s0, s1, lim: LIM.pont, etat: 0 });
      } else if (type === 'T') {
        L.zones.push({ type: 'tunnel', s0, s1, lim: LIM.tunnel, etat: 0 });
      } else if (type === 'A') {
        const rapide = tok[1] === '1' ? 'derive' : 'droit';
        L.aigs.push({ s0, s1, rapide, choix: rapide === 'derive' ? 'droit' : 'derive', verrou: false });
      } else if (type === 'G') {
        L.gares.push({ s0, s1, c: s0 + 165, vert: L.vert, jaune: 85, voy: L.voy, etat: 0, monte: 0 });
      } else if (type === 'P') {
        const i = L.passages.length;
        L.passages.push({ s: s0 + 40, R: 2.2 + ((N * 7 + i * 3) % 5) * 0.3, trig: null, vert: false, etat: 0, fuite: null });
      } else if (type === 'M') {
        L.pentes.push({ s0, s1, g: tok[1] === '-' ? -1 : 1 });
      }
      cur = s1;
    }
    L.fin = { c: cur + 420, vert: 40, jaune: 95 };
    L.fin.heurtoir = L.fin.c + L.fin.jaune + 40;
    L.longueur = L.fin.heurtoir;
    return L;
  }

  // Géométrie de la voie : décalage des virages (aller-retour en douceur)
  function bosse(u) { return (1 - Math.cos(2 * Math.PI * u)) / 2; }
  function decal(L, s) {
    let x = 0;
    for (const z of L.zones) if (z.courbe && s > z.s0 && s < z.s1) x += z.dir * z.amp * bosse((s - z.s0) / (z.s1 - z.s0));
    return x;
  }
  function bulge(a, s) {
    const u = (s - a.s0) / (a.s1 - a.s0);
    if (u <= 0 || u >= 1) return 0;
    return 80 * (u < 0.3 ? sm(u / 0.3) : u > 0.7 ? sm((1 - u) / 0.3) : 1);
  }
  function aigEn(L, s) { for (const a of L.aigs) if (s > a.s0 && s < a.s1) return a; return null; }
  function xVoie(L, s, W) { return W / 2 + L.xc + decal(L, s); }
  function xTrain(L, s, W) { const a = aigEn(L, s); return xVoie(L, s, W) + (a && a.choix === 'derive' ? bulge(a, s) : 0); }
  function xRival(L, s, W) { return W / 2 + L.xc - 90 + decal(L, s); }
  function pente(L, s) { for (const p of L.pentes) if (s > p.s0 && s < p.s1) return p.g; return 0; }
  function surVoieLente(a, s) {
    if (!a || a.choix === a.rapide) return false;
    const u = (s - a.s0) / (a.s1 - a.s0);
    return u > 0.3 && u < 0.7;
  }

  // Physique commune au joueur, au rival et au conducteur automatique
  function physique(v, appui, g, frein, dt) {
    if (appui) {
      const a = ACC * (g > 0 ? 0.5 : g < 0 ? 1.5 : 1);
      const vm = VMAX * (g > 0 ? 0.78 : g < 0 ? 1.1 : 1);
      if (v < vm) v = Math.min(vm, v + a * dt); else v = Math.max(vm, v - 0.25 * VMAX * dt);
    } else {
      const d = BRK * frein * (g > 0 ? 1.3 : g < 0 ? 0.7 : 1);
      v = Math.max(0, v - d * dt);
    }
    return v;
  }

  // ------------------------------------------------------------------------
  // Le monde d'une partie (aussi utilisé pour les démonstrations et calculs)
  // ------------------------------------------------------------------------
  function creerMonde(N, o) {
    o = o || {};
    const L = construire(N, o.def);
    if (o.rapides) L.aigs.forEach((a) => { a.choix = a.rapide; });
    return {
      N, L, s: 60, v: 0, t: 0, phase: 'conduite', minuteur: 0, appui: false, appuiAvant: false, dernierAppui: false,
      incidents: 0, danger: 0, alerte: false, voy: 0, voyMax: L.gares.reduce((a, g) => a + g.voy, 0),
      ok: 0, total: L.zones.length + L.passages.length, fini: false, resultat: null, arretParfait: false,
      auto: !!o.auto, effets: !o.sansEffets, evt: o.evt || (() => {}), rival: null,
      part: [], flot: [], embarq: [], secousse: 0, phaseFumee: 0, mainLevier: 0, horloge: 0
    };
  }

  function levierFenetre(m, a) { return m.s >= a.s0 - 520 && m.s <= a.s0 - 30; }

  // Vitesse visée par le conducteur automatique (freine juste à temps)
  function vitesseVoulue(L, s, cap, pourRival) {
    const dec = BRK * L.frein * 0.62;
    let vd = VMAX * cap;
    const lim = (s0, val) => {
      if (s >= s0) vd = Math.min(vd, val);
      else vd = Math.min(vd, Math.sqrt(val * val + 2 * dec * (s0 - s)));
    };
    for (const z of L.zones) if (z.s1 > s && (pourRival || z.etat !== 2)) lim(z.s0, z.lim * VMAX * 0.95);
    if (!pourRival) {
      for (const a of L.aigs) {
        if (a.choix === a.rapide) continue;
        const p0 = a.s0 + 0.3 * (a.s1 - a.s0), p1 = a.s0 + 0.7 * (a.s1 - a.s0);
        if (p1 > s) lim(p0, CAP_LENTE * VMAX);
      }
      for (const g of L.gares) if (g.etat === 0) lim(g.c, 0);
      for (const p of L.passages) if (p.etat === 0 && !p.vert) lim(p.s - 14, 0);
      lim(L.fin.c, 0);
    }
    return vd;
  }

  function incident(m, raison) {
    m.incidents++;
    m.phase = 'incident';
    m.minuteur = DUREE_INCIDENT;
    m.v = 0; m.danger = 0; m.alerte = false;
    for (const z of m.L.zones) if (z.etat === 0 && m.s > z.s0 - 5 && m.s < z.s1 + 5) z.etat = 2;
    m.secousse = 1;
    if (m.effets) etincelles(m, 26);
    m.evt('incident', raison);
  }

  function terminer(m, gagne, raison) {
    if (m.fini) return;
    m.fini = true;
    m.resultat = { gagne, raison: raison || null };
    m.evt('fin', m.resultat);
  }

  function majRival(m, dt) {
    const r = m.rival, L = m.L;
    const vd = vitesseVoulue(L, r.s, r.cap, true);
    const appui = r.v < vd - 2;
    r.v = physique(r.v, appui, pente(L, r.s), L.frein, dt);
    r.s += r.v * dt;
    if (m.effets) fumer(m, r.s, xRival(L, r.s - 6, LARGEUR_MONDE), r.v, true, dt);
    if (r.s >= L.fin.c) {
      r.fini = true;
      m.evt('rivalArrive');
      if (!m.fini) terminer(m, false, 'rival');
    }
  }

  // Un pas de simulation
  function majMonde(m, dt) {
    const L = m.L;
    m.horloge += dt;
    majEffets(m, dt);
    if (m.fini) return;
    m.t += dt;
    if (m.rival && !m.rival.fini) majRival(m, dt);
    if (m.fini) return;
    if (m.phase === 'incident') {
      m.minuteur -= dt;
      if (m.minuteur <= 0) {
        m.phase = 'conduite';
        if (m.incidents >= MAX_INCIDENTS) terminer(m, false, 'incidents');
      }
      return;
    }
    if (m.phase === 'embarq') {
      m.minuteur -= dt;
      if (m.minuteur <= 0) { m.phase = 'conduite'; m.evt('depart'); }
      return;
    }

    // Aiguillages : le conducteur automatique prend toujours la voie rapide
    if (m.auto) {
      for (const a of L.aigs) {
        if (!a.verrou && a.choix !== a.rapide && levierFenetre(m, a) && m.s > a.s0 - 330) {
          a.choix = a.rapide; m.mainLevier = 0.9; m.evt('clac');
        }
      }
    }
    m.mainLevier = Math.max(0, m.mainLevier - dt);

    const appui = m.auto ? (m.v < vitesseVoulue(L, m.s, 1.05, false) - 2) : m.appui;
    m.dernierAppui = appui;
    const vAvant = m.v;
    m.v = physique(m.v, appui, pente(L, m.s), L.frein, dt);
    const a = aigEn(L, m.s);
    if (surVoieLente(a, m.s) && m.v > CAP_LENTE * VMAX) m.v = Math.max(CAP_LENTE * VMAX, m.v - 2.2 * BRK * dt);
    if (!appui && m.appuiAvant && vAvant > 0.55 * VMAX && m.dureeAppui > 0.5) { m.evt('frein'); if (m.effets) etincelles(m, 6); }
    m.dureeAppui = appui ? (m.dureeAppui || 0) + dt : 0;
    m.appuiAvant = appui;
    m.s += m.v * dt;
    if (m.effets) fumer(m, m.s, xTrain(L, m.s - 8, LARGEUR_MONDE), m.v, false, dt);

    for (const ai of L.aigs) {
      if (!ai.verrou && m.s >= ai.s0) { ai.verrou = true; m.evt(ai.choix === ai.rapide ? 'aigBon' : 'aigLent'); }
    }

    // Zones à vitesse limitée (virages, ponts, tunnels)
    let lim = Infinity, dedans = false;
    for (const z of L.zones) {
      if (m.s > z.s0 && m.s < z.s1 && z.etat === 0) { dedans = true; lim = Math.min(lim, z.lim); }
    }
    if (dedans && m.v > lim * VMAX * 1.04) {
      m.danger += dt * 2.4; m.alerte = true;
      if (m.danger >= 1) { incident(m, 'vitesse'); return; }
    } else {
      m.danger = Math.max(0, m.danger - dt * 1.3); m.alerte = false;
    }
    for (const z of L.zones) {
      if (z.etat === 0 && m.s >= z.s1) { z.etat = 1; m.ok++; m.evt('zoneOk', { s: z.s1, x: xVoie(L, z.s1, LARGEUR_MONDE) }); }
    }

    // Passages d'animaux
    for (const p of L.passages) {
      if (p.trig === null && p.s - m.s < DIST_DECLENCHE) { p.trig = m.t; m.evt('sonnerie'); }
      if (p.trig !== null && !p.vert && m.t - p.trig >= p.R) { p.vert = true; m.evt('feuVert'); }
      if (p.etat === 0 && m.s >= p.s) {
        if (p.vert) { p.etat = 1; m.ok++; m.evt('zoneOk', { s: p.s, x: xVoie(L, p.s, LARGEUR_MONDE) }); }
        else { p.etat = 2; p.vert = true; p.fuite = m.t; incident(m, 'feu'); return; }
      }
    }

    // Gares
    for (const g of L.gares) {
      if (g.etat !== 0) continue;
      const d = m.s - g.c;
      if (m.v === 0 && !appui && Math.abs(d) <= g.jaune) {
        const parfait = Math.abs(d) <= g.vert;
        const n = parfait ? g.voy : Math.floor(g.voy / 2);
        g.etat = 1; g.monte = n; m.voy += n;
        m.phase = 'embarq'; m.minuteur = DUREE_EMBARQ;
        if (m.effets) lancerEmbarquement(m, g, n);
        m.evt('gare', { parfait, n });
        return;
      } else if (d > g.jaune) {
        g.etat = 2; m.evt('gareRatee');
      }
    }

    const f = L.fin, df = m.s - f.c;
    if (m.v === 0 && !appui && Math.abs(df) <= f.jaune) {
      m.arretParfait = Math.abs(df) <= f.vert;
      terminer(m, true);
    } else if (m.s >= f.heurtoir - 4) {
      m.s = f.heurtoir - 4; m.v = 0; m.incidents++; m.secousse = 1;
      if (m.effets) etincelles(m, 30);
      m.evt('heurtoir');
      terminer(m, m.incidents < MAX_INCIDENTS, m.incidents >= MAX_INCIDENTS ? 'incidents' : null);
    }
  }

  // Temps du conducteur parfait, objectif et réglage du rival (calculés une fois)
  const calculs = {};
  function simulerRival(N, cap) {
    const L = construire(N);
    let s = 60, v = 0, t = 0;
    const dt = 1 / 60;
    while (s < L.fin.c && t < 900) {
      const vd = vitesseVoulue(L, s, cap, true);
      v = physique(v, v < vd - 2, pente(L, s), L.frein, dt);
      s += v * dt; t += dt;
    }
    return t;
  }
  function calculer(N) {
    if (calculs[N]) return calculs[N];
    const m = creerMonde(N, { auto: true, sansEffets: true, rapides: true });
    const dt = 1 / 60;
    while (!m.fini && m.t < 900) majMonde(m, dt);
    const ideal = m.t;
    const f = N <= 4 ? 1.35 : N <= 10 ? 1.28 : N <= 16 ? 1.22 : 1.18;
    const res = { ideal, objectif: Math.ceil(ideal * f), cap: 0 };
    const d = NIVEAUX[N - 1];
    if (d.rival) {
      const cible = ideal * d.rival;
      let a = 0.25, b = 1.05;
      for (let i = 0; i < 16; i++) {
        const c = (a + b) / 2;
        if (simulerRival(N, c) > cible) a = c; else b = c;
      }
      res.cap = (a + b) / 2;
    }
    calculs[N] = res;
    return res;
  }

  // ------------------------------------------------------------------------
  // Effets visuels (fumée, étincelles, voyageurs, nombres qui s'envolent)
  // ------------------------------------------------------------------------
  let LARGEUR_MONDE = 400;
  function fumer(m, s, x, v, rival, dt) {
    const vapeur = !rival && prog.garage.loco === 1;
    m.phaseFumee += dt * (0.6 + 3 * v / VMAX) * (vapeur ? 2.2 : 1);
    if (m.phaseFumee > 1) {
      m.phaseFumee = 0;
      if (m.part.length < 140) {
        m.part.push({ type: 'fumee', s: s - (vapeur ? 6 : 30), x: x + (Math.random() - 0.5) * 3, vs: -10 - Math.random() * 12, vx: (Math.random() - 0.5) * 14, r: vapeur ? 6 : 4, vie: 1.4, max: 1.4, gris: vapeur ? 245 : 120 });
      }
    }
  }
  function etincelles(m, n) {
    const x = xTrain(m.L, m.s - 20, LARGEUR_MONDE);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 120;
      m.part.push({ type: 'etinc', s: m.s - 20 - Math.random() * 60, x: x + (Math.random() - 0.5) * 20, vs: Math.sin(a) * sp, vx: Math.cos(a) * sp, r: 2 + Math.random() * 2, vie: 0.6, max: 0.6 });
    }
  }
  function lancerEmbarquement(m, g, n) {
    const x = xVoie(m.L, g.c, LARGEUR_MONDE);
    for (let i = 0; i < n; i++) {
      m.embarq.push({ s0: g.c - 30 - i * 14, x0: x + 44 + (i % 2) * 10, s1: m.s - 60 - (i % 3) * 46, x1: x, t: -i * 0.14, coul: COUL_HABITS[(i + g.c) % COUL_HABITS.length] });
    }
  }
  const COUL_HABITS = ['#e8573f', '#3d7bd9', '#f4c542', '#8e5bd6', '#3fae5a', '#f08a24', '#ef6fa8'];
  function flotter(m, s, x, texte, coul) { m.flot.push({ s, x, texte, coul: coul || '#fff', vie: 1.3 }); }
  function majEffets(m, dt) {
    for (const p of m.part) { p.s += p.vs * dt; p.x += p.vx * dt; p.vie -= dt; if (p.type === 'fumee') p.r += dt * 9; }
    m.part = m.part.filter((p) => p.vie > 0);
    for (const f of m.flot) { f.s += 40 * dt; f.vie -= dt; }
    m.flot = m.flot.filter((f) => f.vie > 0);
    for (const e of m.embarq) e.t += dt;
    m.embarq = m.embarq.filter((e) => e.t < 0.9);
    m.secousse = Math.max(0, m.secousse - dt * 1.4);
  }

  // Panneaux (dessins seuls, sans chiffre ni lettre)

  // Rails : traverses + deux rails, le long d'une fonction x(s)
  function rails(c, V, cam, fx, sA, sB, vieux, lueur) {

  // Un train : locomotive + wagons, le long de fx
  function dessinerTrain(c, V, cam, sTete, fx, style, m, wob) {
    const sy = (s) => V.trainY - (s - cam);
    const pieces = [{ s: sTete - 23, loco: true }];
    for (let k = 0; k < 3; k++) pieces.push({ s: sTete - 46 - 6 - 20 - k * 46, k });
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      let x = fx(p.s), y = sy(p.s), a = Math.atan2(fx(p.s + 6) - fx(p.s - 6), 12);
      if (wob > 0) { a += Math.sin(m.horloge * 25 + i) * 0.28 * wob; x += Math.sin(m.horloge * 31 + i * 2) * 5 * wob; }

  function dessinerLoco(c, st) {

  function dessinerWagon(c, coul, n, brillant) {

  function styleJoueur(m) {

  // Signal du passage d'animaux et animaux qui traversent
  function dessinerPassage(c, V, cam, m, p) {
    const L = m.L, W = V.W, sy = (s) => V.trainY - (s - cam);
    const x = xVoie(L, p.s, W), y = sy(p.s);
    // feu
    c.fillStyle = '#4a4f59'; c.fillRect(x + 25, y - 4, 3, 14);
    rr(c, x + 19, y - 26, 15, 24, 4); c.fillStyle = '#222'; c.fill();

  // ------------------------------------------------------------------------
  // Dessin du monde
  // ------------------------------------------------------------------------
  const noirs = {};
  function calqueNoir(cle, w, h) {
    let n = noirs[cle];
    if (!n) { n = document.createElement('canvas'); noirs[cle] = n; }
    if (n.width !== w || n.height !== h) { n.width = w; n.height = h; }
    return n;
  }

  function dessinerMonde(c, V, m, o) {
    o = o || {};
    const L = m.L, W = V.W, H = V.H, pays = L.pays;
    LARGEUR_MONDE = W;
    const cam = m.s;
    const sy = (s) => V.trainY - (s - cam);
    const sMin = cam - (H - V.trainY) - 80, sMax = cam + V.trainY + 80;
    c.save();
    if (m.secousse > 0) c.translate((Math.random() - 0.5) * 10 * m.secousse, (Math.random() - 0.5) * 10 * m.secousse);
    else if (m.alerte) c.translate((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3);

    // 1. Sol et taches
    c.fillStyle = pays.sol; c.fillRect(-20, -20, W + 40, H + 40);
    const BLOC = 160;
    for (let k = Math.floor(sMin / BLOC); k <= Math.ceil(sMax / BLOC); k++) {
      for (let i = 0; i < 3; i++) {
        const r = hasard(k * 13 + i * 7 + L.d.e * 101);
        ellipse(c, hasard(k * 5 + i) * W, sy(k * BLOC + r * BLOC), 40 + r * 50, 20 + r * 20, r * 3, pays.sol2);
      }
    }
    if (L.glace) { c.fillStyle = 'rgba(190,225,245,.25)'; c.fillRect(0, 0, W, H); }

    // 2. Pentes (ombre de colline) et zones au sol
    for (const p of L.pentes) {
      if (p.s1 < sMin || p.s0 > sMax) continue;
      const y0 = sy(p.s1), y1 = sy(p.s0);
      const gr = c.createLinearGradient(0, y0, 0, y1);
      if (p.g > 0) { gr.addColorStop(0, 'rgba(70,50,20,.28)'); gr.addColorStop(1, 'rgba(70,50,20,.02)'); }
      else { gr.addColorStop(0, 'rgba(255,255,255,.02)'); gr.addColorStop(1, 'rgba(255,255,255,.3)'); }
      c.fillStyle = gr; c.fillRect(0, y0, W, y1 - y0);
    }

      if (z.s1 < sMin - 60 || z.s0 > sMax + 60) continue;

        const gr = c.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, '#3c8fd6'); gr.addColorStop(0.5, '#5fb0ec'); gr.addColorStop(1, '#3c8fd6');
        c.fillStyle = gr; c.fillRect(0, y0, W, y1 - y0);
        c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 2;
        for (let i = 0; i < 10; i++) {

        c.fillStyle = '#857b6c'; c.fillRect(0, y0, W, y1 - y0);
        for (let i = 0; i < 14; i++) ellipse(c, hasard(z.s0 + i) * W, y0 + hasard(z.s0 * 2 + i) * (y1 - y0), 18 + hasard(i) * 20, 12, i, '#958a78');
        // couloir du tunnel
        const largeur = L.xc ? [-120, 30] : [-30, 30];
        c.beginPath();
        for (let s = z.s0; s <= z.s1; s += 16) { const x = xVoie(L, s, W) + largeur[0]; if (s === z.s0) c.moveTo(x, sy(s)); else c.lineTo(x, sy(s)); }
        for (let s = z.s1; s >= z.s0; s -= 16) c.lineTo(xVoie(L, s, W) + largeur[1], sy(s));

      }
    }
    for (const p of L.passages) {
      if (p.s < sMin - 60 || p.s > sMax + 60) continue;
      const y = sy(p.s + 30);
      c.fillStyle = '#6b6f78'; c.fillRect(0, y - 24, W, 48);
      c.fillStyle = 'rgba(255,255,255,.6)'; for (let x = 6; x < W; x += 34) c.fillRect(x, y - 2, 18, 4);
    }

    for (const { g, fin } of zonesArret) {

      c.fillStyle = '#f4f0e6'; c.fillRect(x + 18, sy(s1), 4, sy(s0) - sy(s1));
      c.fillStyle = pays.teinte; c.fillRect(x + 64, sy(s1 - 40), 32, sy(s0 + 40) - sy(s1 - 40));
      c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(x + 80, sy(s1 - 40), 16, sy(s0 + 40) - sy(s1 - 40));
      if (fin) { c.fillStyle = '#c9c4ba'; c.fillRect(x - 64, sy(s1), 46, sy(s0) - sy(s1)); }

      for (let i = 0; i < n; i++) {

        if (Math.abs(x - xv) < 56) continue;
        if (L.xc && Math.abs(x - xRival(L, s, W)) < 50) continue;
        let gene = false;
        for (const a of L.aigs) if (s > a.s0 - 30 && s < a.s1 + 30 && x > xv - 20 && x < xv + 130) gene = true;
        for (const z of L.zones) if ((z.type === 'pont' || z.type === 'tunnel') && s > z.s0 - 20 && s < z.s1 + 20) gene = true;
        for (const p of L.passages) if (Math.abs(s - p.s - 30) < 50) gene = true;
        for (const { g, fin } of zonesArret) if (s > (fin ? g.c - 260 : g.s0 - 30) && s < (fin ? g.heurtoir + 40 : g.s1 + 30) && x > xv - (fin ? 90 : 20) && x < xv + 115) gene = true;
        if (gene) continue;
        const kk = hasard(k * 2.3 + i * 5.1 + 9);

      }

    // 4. Voies
    const fin = L.fin.heurtoir + 10;
    if (L.rival) rails(c, V, cam, (s) => xRival(L, s, W), Math.max(0, sMin), Math.min(sMax, fin), false);
    for (const z of L.zones) {
      if (z.type !== 'pont' || z.s1 < sMin || z.s0 > sMax) continue;
      for (const fx of [(s) => xVoie(L, s, W)].concat(L.rival ? [(s) => xRival(L, s, W)] : [])) {

      if (!lenteDerive && !lueurM) rails(c, V, cam, (s) => xVoie(L, s, W), Math.max(sMin, a.s0), Math.min(sMax, a.s1), true);
      // voie lente : barrières et panneaux escargot
      const fl = lenteDerive ? fxD : (s) => xVoie(L, s, W);
      const p0 = a.s0 + 0.3 * (a.s1 - a.s0), p1 = a.s0 + 0.7 * (a.s1 - a.s0);
      for (let s = p0; s <= p1; s += 60) {
        const x = fl(s);
        c.fillStyle = '#f08a24'; c.fillRect(x + 15, sy(s) - 2, 5, 14); c.fillRect(x - 20, sy(s) - 2, 5, 14);
        c.fillStyle = '#fff'; c.fillRect(x + 15, sy(s) + 3, 5, 3); c.fillRect(x - 20, sy(s) + 3, 5, 3);
      }
      panneau(c, fl(p0 - 30) + (lenteDerive ? 30 : -30), sy(p0 - 30), 'lente', 1);

        c.fillStyle = '#2fd15a'; c.beginPath(); c.moveTo(0, -16); c.lineTo(8, -4); c.lineTo(3, -4); c.lineTo(3, 6); c.lineTo(-3, 6); c.lineTo(-3, -4); c.lineTo(-8, -4); c.closePath(); c.fill();

    }
    // heurtoir du terminus
    {

      c.fillStyle = '#fff'; for (let i = 0; i < 3; i++) c.fillRect(x - 13 + i * 10, y - 6, 5, 10);

    for (const g of L.gares) panneaux.push({ s: g.s0 - 40, type: 'gare' });
    for (const p of L.passages) panneaux.push({ s: p.s - 120, type: 'passage' });
    for (const a of L.aigs) panneaux.push({ s: a.s0 - 140, type: 'aig' });
    for (const p of L.pentes) panneaux.push({ s: p.s0 - 30, type: 'pente', dir: p.g });
    panneaux.push({ s: L.fin.c - 300, type: 'fin' });
    const dessinerPanneaux = () => {
      for (const p of panneaux) {
        if (p.s < sMin || p.s > sMax) continue;
        const x = xVoie(L, p.s, W) + 34;
        panneau(c, Math.min(x, W - 14), sy(p.s), p.type, p.dir, 1.05);
      }
    };
    dessinerPanneaux();

    // 6. Voyageurs sur les quais
    for (const g of L.gares) {
      if (g.c < sMin - 100 || g.c > sMax + 100) continue;
      const x = xVoie(L, g.c, W);
      const reste = g.etat === 0 ? g.voy : 0;
      for (let i = 0; i < reste; i++) {
        const px = x + 32 + (i % 2) * 14 + Math.sin(m.horloge * 3 + i) * 1.5, py = sy(g.c - 30 - Math.floor(i / 2) * 18 + 40);
        ellipse(c, px, py + 2, 5, 4, 0, COUL_HABITS[(i + g.c) % COUL_HABITS.length]); cercle(c, px, py - 3, 3.2, '#f2c9a0'); cercle(c, px, py - 4, 2, '#3b2a20');
      }
    }
    for (const e of m.embarq) {

      const k = clamp(e.t / 0.8, 0, 1), px = e.x0 + (e.x1 - e.x0) * k, py = sy(e.s0 + (e.s1 - e.s0) * k) - Math.sin(k * Math.PI) * 18;
      ellipse(c, px, py + 2, 5, 4, 0, e.coul); cercle(c, px, py - 3, 3.2, '#f2c9a0');
    }
    for (const p of L.passages) if (p.s > sMin - 80 && p.s < sMax + 80) dessinerPassage(c, V, cam, m, p);

    // 7. Trains
    if (m.rival) {
      dessinerTrain(c, V, cam, m.rival.s, (s) => xRival(L, s, W), STYLE_RIVAL, m, 0);
    }
    const wob = m.phase === 'incident' ? clamp(m.minuteur / DUREE_INCIDENT, 0, 1) : (m.alerte ? 0.25 : 0);
    dessinerTrain(c, V, cam, m.s, (s) => xTrain(L, s, W), o.style || styleJoueur(m), m, wob);
    if (m.phase === 'incident') { // étoiles qui tournent au-dessus de la locomotive
      const x = xTrain(L, m.s - 20, W), y = sy(m.s - 20);
      for (let i = 0; i < 4; i++) {
        const a = m.horloge * 5 + i * Math.PI / 2;

      }
    }

    // 8. Particules et nombres
    for (const p of m.part) {
      const a = clamp(p.vie / p.max, 0, 1);
      if (p.type === 'fumee') cercle(c, p.x, sy(p.s), p.r, `rgba(${p.gris},${p.gris},${p.gris},${0.55 * a})`);
      else cercle(c, p.x, sy(p.s), p.r, `rgba(255,${180 + Math.floor(70 * a)},60,${a})`);
    }

    // 9. Obscurité (tunnels, nuit) avec phares
    let sombre = L.nuit ? 0.82 : 0;
    for (const z of L.zones) {
      if (z.type !== 'tunnel') continue;
      const k = Math.min(sm((m.s - z.s0 + 20) / 80), sm((z.s1 - m.s + 20) / 80));

      nc.setTransform(1, 0, 0, 1, 0, 0); nc.clearRect(0, 0, n.width, n.height);

      const lumiere = (x, y, r, f) => { const g = nc.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(0,0,0,${f})`); g.addColorStop(1, 'rgba(0,0,0,0)'); nc.fillStyle = g; nc.beginPath(); nc.arc(x, y, r, 0, Math.PI * 2); nc.fill(); };
      const trains = [{ s: m.s, fx: (s) => xTrain(L, s, W) }];
      if (m.rival) trains.push({ s: m.rival.s, fx: (s) => xRival(L, s, W) });
      for (const tr of trains) {
        const xh = tr.fx(tr.s), yh = sy(tr.s);

        nc.save(); nc.translate(xh, yh); nc.rotate(a);
        const g = nc.createLinearGradient(0, 0, 0, -330); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
        nc.fillStyle = g; nc.beginPath(); nc.moveTo(-10, 0); nc.lineTo(-120, -330); nc.lineTo(120, -330); nc.lineTo(10, 0); nc.closePath(); nc.fill();
        nc.restore();
        lumiere(tr.fx(tr.s - 80), sy(tr.s - 80), 110, 0.9);
      }
      for (const z of L.zones) {
        if (z.type !== 'tunnel' || z.s1 < sMin || z.s0 > sMax) continue;
        for (let s = z.s0 + 40; s < z.s1; s += 90) { lumiere(xVoie(L, s, W) + 27, sy(s), 26, 0.8); lumiere(xVoie(L, s, W) + (L.xc ? -117 : -27), sy(s), 26, 0.8); }
      }
      if (L.nuit) {
        for (const { g, fin } of zonesArret) if (g.c > sMin - 100 && g.c < sMax + 100) lumiere(xVoie(L, g.c, W) + 40, sy(g.c), fin ? 150 : 110, 0.85);
        for (const p of L.passages) if (p.s > sMin && p.s < sMax) lumiere(xVoie(L, p.s, W) + 26, sy(p.s + 10), 70, 0.8);

      if (L.nuit) { c.globalAlpha = 0.85; dessinerPanneaux(); c.globalAlpha = 1; }
    }

    // 10. Pluie et brouillard
    if (L.pluie) {
      const g = c.createLinearGradient(0, 0, 0, H * 0.45); g.addColorStop(0, 'rgba(210,220,230,.75)'); g.addColorStop(1, 'rgba(210,220,230,0)');
      c.fillStyle = g; c.fillRect(0, 0, W, H * 0.45);
      c.strokeStyle = 'rgba(220,235,255,.55)'; c.lineWidth = 1.5; c.beginPath();
      for (let i = 0; i < 70; i++) {

      }
      c.stroke();

    // traits de vitesse
    if (m.v > 0.8 * VMAX) {
      c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2; c.beginPath();
      for (let i = 0; i < 8; i++) { const x = i < 4 ? 8 + i * 10 : W - 8 - (i - 4) * 10, y = (hasard(i) * H + m.horloge * 900) % H; c.moveTo(x, y); c.lineTo(x, y + 40); }

  }

  function etoileDessin(c, x, y, r, coul) {
    c.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; c.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
    c.closePath(); c.fillStyle = coul; c.fill();
  }

  // Compteur de vitesse (aiguille, sans chiffre) et prochain panneau
  function prochainEvenement(m) {
    const L = m.L, s = m.s;
    let best = null;
    const voir = (s0, type, dir, lim) => { if (s0 > s - 1 && s0 - s < 900 && (!best || s0 < best.s0)) best = { s0, type, dir, lim }; };
    for (const z of L.zones) if (z.etat === 0) voir(z.s0, z.type, z.dir || 1, z.lim);
    for (const g of L.gares) if (g.etat === 0) voir(g.c - g.jaune, 'gare');
    for (const p of L.passages) if (p.etat === 0) voir(p.s, 'passage');
    for (const a of L.aigs) if (!a.verrou) voir(a.s0, 'aig');
    voir(L.fin.c - L.fin.jaune, 'fin');
    return best;
  }
  function limiteAffichee(m) {
    const L = m.L, s = m.s;
    let lim = null, type = null;
    for (const z of L.zones) {
      if (z.etat !== 0) continue;
      if ((s > z.s0 && s < z.s1) || (z.s0 > s && z.s0 - s < 650)) { if (lim === null || z.lim < lim) { lim = z.lim; type = z.type; } }
    }
    return lim === null ? null : { lim, type };
  }
  function dessinerJauge(c, V, m) {
    const cx = 62, cy = V.H - 64, r = 46;
    const a0 = Math.PI * 0.8, a1 = Math.PI * 2.2, ang = (f) => a0 + clamp(f, 0, 1) * (a1 - a0);
    const VPLEIN = VMAX * 1.1;
    cercle(c, cx, cy + 3, r + 6, 'rgba(0,0,0,.25)');
    cercle(c, cx, cy, r + 6, m.alerte && Math.floor(m.horloge * 8) % 2 ? '#ffb3a6' : 'rgba(255,255,255,.94)');
    c.lineCap = 'butt'; c.lineWidth = 9;
    const lim = limiteAffichee(m);
    const fl = lim ? lim.lim * VMAX / VPLEIN : 1;
    c.beginPath(); c.arc(cx, cy, r - 6, a0, ang(fl)); c.strokeStyle = '#4cc36a'; c.stroke();
    if (lim) {
      c.beginPath(); c.arc(cx, cy, r - 6, ang(fl), a1); c.strokeStyle = '#ef5a44'; c.stroke();
      const coul = { doux: '#f4c542', serre: '#e8443a', pont: '#2f6fe0', tunnel: '#2f6fe0' }[lim.type];
      c.save(); c.translate(cx, cy); c.rotate(ang(fl)); c.fillStyle = coul; c.strokeStyle = '#222'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(r - 15, 0); c.lineTo(r + 4, -6); c.lineTo(r + 4, 6); c.closePath(); c.fill(); c.stroke(); c.restore();
    }
    // graduations
    c.strokeStyle = '#23324a'; c.lineWidth = 2;
    for (let i = 0; i <= 10; i++) { const a = ang(i / 10); c.beginPath(); c.moveTo(cx + Math.cos(a) * (r - 1), cy + Math.sin(a) * (r - 1)); c.lineTo(cx + Math.cos(a) * (r + 3), cy + Math.sin(a) * (r + 3)); c.stroke(); }
    // aiguille
    const an = ang(m.v / VPLEIN);
    c.strokeStyle = '#c2412c'; c.lineWidth = 4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(an) * (r - 8), cy + Math.sin(an) * (r - 8)); c.stroke();
    cercle(c, cx, cy, 6, '#23324a');
    // pente en cours
    const g = pente(m.L, m.s);
    if (g) {
      c.save(); c.translate(cx, cy + 24); c.scale(0.8, 0.8);
      c.beginPath(); if (g < 0) { c.moveTo(-12, -6); c.lineTo(12, 6); c.lineTo(-12, 6); } else { c.moveTo(-12, 6); c.lineTo(12, -6); c.lineTo(12, 6); } c.closePath(); c.fillStyle = '#a0522d'; c.fill();
      c.restore();
    }

      rr(c, px - 22, py - 26, 44, 66, 10); c.fillStyle = 'rgba(255,255,255,.9)'; c.fill();
      panneau(c, px, py, ev.type, ev.dir, 1.05);
      const f = clamp(1 - (ev.s0 - m.s) / 900, 0, 1);
      c.fillStyle = '#d5dae3'; c.fillRect(px - 16, py + 28, 32, 6);
      c.fillStyle = f > 0.7 ? '#ef5a44' : f > 0.4 ? '#f4c542' : '#4cc36a'; c.fillRect(px - 16, py + 28, 32 * f, 6);
    }
  }

  function dessinerMain(c, x, y, presse) {
    c.save(); c.translate(x, y + (presse ? 4 : -6)); c.scale(1.2, 1.2);
    if (presse) { c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 3; c.beginPath(); c.arc(0, -16, 12, 0, Math.PI * 2); c.stroke(); }
    c.fillStyle = '#fde3c8'; c.strokeStyle = '#7a4a2a'; c.lineWidth = 2;
    rr(c, -4, -18, 8, 20, 4); c.fill(); c.stroke();

  }

  // ------------------------------------------------------------------------
  // Écran titre : planète, voie en orbite et petit train
  // ------------------------------------------------------------------------
  function dessinerTitre(c, V, tm) {
    const W = V.W, H = V.H;
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5fb6ef'); g.addColorStop(1, '#c9ecff');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 6; i++) {
      const x = ((hasard(i) * W + tm * (8 + i * 3)) % (W + 120)) - 60, y = H * (0.18 + hasard(i + 9) * 0.7);
      ellipse(c, x, y, 34, 12, 0, 'rgba(255,255,255,.75)'); ellipse(c, x + 18, y - 6, 22, 10, 0, 'rgba(255,255,255,.75)');
    }
    const cx = W / 2, cy = H * 0.5, R = Math.min(W * 0.34, H * 0.21);
    const rx = R * 1.42, ry = R * 0.46, incl = -0.18;
    const point = (a) => { const x = Math.cos(a) * rx, y = Math.sin(a) * ry; return { x: cx + x * Math.cos(incl) - y * Math.sin(incl), y: cy + x * Math.sin(incl) + y * Math.cos(incl) }; };
    const voie = (avant) => {
      for (let i = 0; i < 90; i++) {
        const a = i / 90 * Math.PI * 2;
        if ((Math.sin(a) > 0) !== avant) continue;
        const p = point(a), q = point(a + 0.01);
        c.save(); c.translate(p.x, p.y); c.rotate(Math.atan2(q.y - p.y, q.x - p.x) + Math.PI / 2);
        c.fillStyle = '#7a5634'; c.fillRect(-9, -2, 18, 4); c.restore();
      }
      for (const k of [0.94, 1.06]) {
        c.beginPath();
        for (let i = 0; i <= 120; i++) {
          const a = i / 120 * Math.PI * 2; if ((Math.sin(a) > 0) !== avant) { c.moveTo(cx + Math.cos(a) * rx * k * Math.cos(incl) - Math.sin(a) * ry * k * Math.sin(incl), cy + Math.cos(a) * rx * k * Math.sin(incl) + Math.sin(a) * ry * k * Math.cos(incl)); continue; }
          c.lineTo(cx + Math.cos(a) * rx * k * Math.cos(incl) - Math.sin(a) * ry * k * Math.sin(incl), cy + Math.cos(a) * rx * k * Math.sin(incl) + Math.sin(a) * ry * k * Math.cos(incl));
        }
        c.strokeStyle = '#5d6470'; c.lineWidth = 2.5; c.stroke();
      }
    };
    const st = styleJoueur(null);
    const train = (avant) => {
      const base = tm * 0.55;
      for (let k = 3; k >= 0; k--) {
        const a = base - k * 0.2;
        if ((Math.sin(a) > 0) !== avant) continue;
        const p = point(a), q = point(a + 0.02);
        const echelle = 0.85 + 0.3 * (Math.sin(a) + 1) / 2;
        c.save(); c.translate(p.x, p.y); c.rotate(Math.atan2(q.y - p.y, q.x - p.x) + Math.PI / 2); c.scale(echelle, echelle);
        ellipse(c, 3, 3, 13, 22, 0, 'rgba(0,0,0,.2)');
        if (k === 0) dessinerLoco(c, st); else dessinerWagon(c, st.wagons[(k - 1) % st.wagons.length], 2, st.or);
        c.restore();
        if (k === 0 && Math.floor(tm * 4) % 2 === 0) { /* rien */ }
      }
    };
    voie(false); train(false);
    // planète
    cercle(c, cx + 6, cy + 8, R, 'rgba(0,0,0,.15)');
    const gp = c.createRadialGradient(cx - R * 0.35, cy - R * 0.35, R * 0.1, cx, cy, R);
    gp.addColorStop(0, '#6fc0ff'); gp.addColorStop(1, '#2a6fc4');
    cercle(c, cx, cy, R, gp);
    c.save(); c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.clip();
    const decalage = (tm * 10) % (R * 4);
    const continents = [[-0.5, -0.3, 0.42, 0.28], [0.3, -0.45, 0.3, 0.2], [0.45, 0.2, 0.38, 0.3], [-0.2, 0.45, 0.3, 0.18], [1.3, -0.1, 0.4, 0.3], [1.0, 0.5, 0.25, 0.2], [-1.2, 0.1, 0.35, 0.25]];
    for (const [ux, uy, w, h] of continents) {
      let x = cx + ux * R + decalage; while (x > cx + R * 2) x -= R * 4;
      ellipse(c, x, cy + uy * R, w * R, h * R, 0.4, '#58b45a'); ellipse(c, x - w * R * 0.3, cy + uy * R - h * R * 0.2, w * R * 0.5, h * R * 0.5, 0.2, '#7ccb5e');
    }
    ellipse(c, cx, cy - R * 0.95, R * 0.6, R * 0.16, 0, '#f4fbff'); ellipse(c, cx, cy + R * 0.97, R * 0.5, R * 0.12, 0, '#f4fbff');
    const gl = c.createRadialGradient(cx - R * 0.4, cy - R * 0.45, 0, cx - R * 0.4, cy - R * 0.45, R * 0.8);
    gl.addColorStop(0, 'rgba(255,255,255,.35)'); gl.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = gl; c.fillRect(cx - R, cy - R, 2 * R, 2 * R);

    }

    const tampons = [[0.13, 0.33, 0], [0.86, 0.36, 3], [0.15, 0.7, 4], [0.86, 0.68, 11]];
    for (const [ux, uy, i] of tampons) {
      c.save(); c.translate(W * ux, H * uy + Math.sin(tm * 1.5 + i) * 5); c.rotate(-0.2 + i * 0.05);
      dessinerTampon(c, 46, i, true); c.restore();
    }
  }

  // ------------------------------------------------------------------------
  // Cartes postales et tampons (dessins de chaque pays, sans texte)
  // ------------------------------------------------------------------------
  function dessinerCarte(c, w, h, i) {
