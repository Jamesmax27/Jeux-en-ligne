function fabriquerFond(nuit) {
  const f = document.createElement('canvas');
  f.width = Math.round(W * dpr); f.height = Math.round(H * dpr);
  const gf = f.getContext('2d');
  gf.setTransform(dpr, 0, 0, dpr, 0, 0);
  dessinerFondSur(gf, nuit);
  return f;
}
function dessinerFondSur(gf, nuit) {
  let graine = 7;
  const hasard = () => (graine = (graine * 16807) % 2147483647) / 2147483647;
  const horizon = HUD_H + BANDEAU + (H - HUD_H - BANDEAU) * .12;
  // Ciel
  const ciel = gf.createLinearGradient(0, 0, 0, horizon);
  if (nuit) { ciel.addColorStop(0, '#0a1230'); ciel.addColorStop(1, '#22365a'); }
  else { ciel.addColorStop(0, '#8fd3f4'); ciel.addColorStop(1, '#d7f1d8'); }
  gf.fillStyle = ciel; gf.fillRect(0, 0, W, horizon + 2);
  if (nuit) {
    for (let i = 0; i < 50; i++) {
      gf.fillStyle = `rgba(255,255,230,${.4 + hasard() * .6})`;
      gf.fillRect(hasard() * W, hasard() * horizon, 2, 2);
    }
    gf.fillStyle = '#fff6c8'; gf.beginPath(); gf.arc(W * .8, HUD_H + 40, 22, 0, Math.PI * 2); gf.fill();
    gf.fillStyle = '#22365a'; gf.beginPath(); gf.arc(W * .8 + 10, HUD_H + 34, 19, 0, Math.PI * 2); gf.fill();
  } else {
    gf.fillStyle = 'rgba(255,240,150,.5)'; gf.beginPath(); gf.arc(W * .82, HUD_H + 40, 34, 0, Math.PI * 2); gf.fill();
    gf.fillStyle = '#fff3a0'; gf.beginPath(); gf.arc(W * .82, HUD_H + 40, 24, 0, Math.PI * 2); gf.fill();
    gf.fillStyle = 'rgba(255,255,255,.85)';
    for (const [x, y] of [[.18, 30], [.45, 60]]) {
      gf.beginPath(); gf.ellipse(W * x, HUD_H + y, 34, 12, 0, 0, Math.PI * 2); gf.fill();
      gf.beginPath(); gf.ellipse(W * x + 18, HUD_H + y - 8, 20, 12, 0, 0, Math.PI * 2); gf.fill();
    }
  }
  // Sapins au loin (deux rangées), sur une bande de sous-bois
  gf.fillStyle = nuit ? '#122522' : '#4f9a56';
  gf.fillRect(0, horizon - 2, W, 20);
  for (let rang = 0; rang < 2; rang++) {
    gf.fillStyle = nuit ? (rang ? '#173028' : '#122522') : (rang ? '#3f8a4a' : '#5ea862');
    const base = horizon + rang * 14, haut = 46 - rang * 8;
    for (let x = -20 - rang * 17; x < W + 30; x += 30 + hasard() * 16) {
      const hh = haut * (.7 + hasard() * .6);
      gf.beginPath(); gf.moveTo(x - 17, base + 4); gf.lineTo(x, base - hh); gf.lineTo(x + 17, base + 4); gf.fill();
    }
  }
  // Sol
  const sol = gf.createLinearGradient(0, horizon, 0, H);
  if (nuit) { sol.addColorStop(0, '#1d3a2c'); sol.addColorStop(1, '#0f2318'); }
  else { sol.addColorStop(0, '#79c25a'); sol.addColorStop(1, '#3f8a3a'); }
  gf.fillStyle = sol; gf.fillRect(0, horizon + 16, W, H);
  // Touffes d'herbe et fleurs
  for (let i = 0; i < W * H / 3000; i++) {
    const x = hasard() * W, y = horizon + 24 + hasard() * (H - horizon);
    gf.strokeStyle = nuit ? '#2a4a34' : '#2f7a34'; gf.lineWidth = 2;
    gf.beginPath(); gf.moveTo(x - 4, y - 7); gf.lineTo(x, y); gf.lineTo(x + 4, y - 8); gf.moveTo(x, y); gf.lineTo(x, y - 10); gf.stroke();
    if (hasard() < .3) {
      gf.fillStyle = nuit ? '#4a5a7a' : ['#fff', '#ffd84a', '#f59ac0'][Math.floor(hasard() * 3)];
      gf.beginPath(); gf.arc(x + 8, y - 4, 3, 0, Math.PI * 2); gf.fill();
    }
  }
}

// Calcule la place des 9 cachettes selon la taille de l'écran
function calculer() {
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  toile.width = Math.round(W * dpr); toile.height = Math.round(H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const haut = HUD_H + BANDEAU, ph = H - haut - 6;
  const FW = Math.min(W, 620);
  s = Math.max(60, Math.min(FW / 3.15, ph / 3.0, 180));
  const lignes = [haut + ph * .34, haut + ph * .665, haut + ph * .985];
  const decalage = [-.03, .03, -.01], echelle = [.82, .91, 1];
  grille = [];
  for (let r = 0; r < 3; r++) for (let col = 0; col < 3; col++) {
    grille.push({ x: W / 2 + (col - 1) * FW * .31 + decalage[r] * FW, gy: lignes[r] - (col === 1 ? ph * .015 : 0), e: echelle[r] });
  }
  fondJour = fabriquerFond(false);
  fondNuit = fabriquerFond(true);
  calculerDemo();
}

// Géométrie d'une cachette : taille, rayon de la tête, ligne de coupe
function geom(sp) {
  const S = sp.S || s * sp.e;
  return { S, r: S * .26, coupe: sp.gy - S * .42 };
}
// Hauteur de la tête selon la sortie (0 = caché, 1 = dehors)
function yTete(sp, monte, cache) {
  const { r, coupe } = geom(sp);
  return coupe + r * 2.2 - monte * (cache ? r * 2.55 : r * 3.2);
}

function dessinerCachette(sp, sorte) {
  const { S } = geom(sp);
  g.save(); g.translate(sp.x, sp.gy);
  g.lineWidth = Math.max(1.5, S * .02); g.strokeStyle = c('#24461f');
  if (sorte === 'souche') {
    g.strokeStyle = c('#4a2e16');
    g.beginPath();
    g.moveTo(-S * .3, -S * .44); g.lineTo(-S * .32, -S * .05); g.quadraticCurveTo(-S * .42, 0, -S * .4, S * .02);
    g.lineTo(S * .4, S * .02); g.quadraticCurveTo(S * .42, 0, S * .32, -S * .05); g.lineTo(S * .3, -S * .44); g.closePath();
    g.fillStyle = c('#8a5a32'); g.fill(); g.stroke();
    g.strokeStyle = c('#6b4223');
    for (const x of [-.15, .02, .17]) { g.beginPath(); g.moveTo(S * x, -S * .36); g.lineTo(S * x, -S * .04); g.stroke(); }
    g.strokeStyle = c('#4a2e16');
    ellipse(0, -S * .44, S * .3, S * .08, c('#d9b07a'), true);
    g.strokeStyle = c('#a87a48');
    ellipse(0, -S * .44, S * .17, S * .045, null, true);
    ellipse(0, -S * .44, S * .06, S * .016, null, true);
    cercle(S * .28, -S * .12, S * .07, c('#e0484d'));
    cercle(S * .28, -S * .12, S * .02, c('#ffffff'));
  } else if (sorte === 'rocher') {
    g.strokeStyle = c('#4a5058');
    g.beginPath();
    g.moveTo(-S * .44, S * .02); g.quadraticCurveTo(-S * .5, -S * .3, -S * .22, -S * .44);
    g.quadraticCurveTo(S * .05, -S * .56, S * .26, -S * .44); g.quadraticCurveTo(S * .5, -S * .3, S * .44, S * .02); g.closePath();
    g.fillStyle = c('#9aa3ab'); g.fill(); g.stroke();
    ellipse(-S * .12, -S * .36, S * .14, S * .05, c('#c3c9cf'), false, -.2);
    ellipse(S * .25, -S * .08, S * .1, S * .05, c('#6fa85a'));
  } else {
    const bosses = [[-.3, -.33, .15], [-.12, -.36, .17], [.1, -.37, .17], [.3, -.32, .15]];
    ellipse(0, -S * .18, S * .47, S * .2, c('#2f7a3a'), true);
    for (const [x, y, r] of bosses) cercle(S * x, S * y, S * r, c('#3f9447'), true);
    ellipse(0, -S * .2, S * .45, S * .17, c('#3f9447'));
    for (const [x, y, r] of bosses) cercle(S * (x - .03), S * (y - .04), S * r * .45, c('#5db35a'));
    for (const [x, y] of [[-.28, -.2], [.05, -.26], [.3, -.16]]) cercle(S * x, S * y, S * .035, c('#e0484d'));
  }
  g.restore();
}

// Animal dans sa cachette : on coupe tout ce qui est sous le bord de la cachette
function dessinerAnimalCachette(sp, type, monte, cache, o = {}) {
  const { S, r, coupe } = geom(sp);
  g.save();
  g.beginPath(); g.rect(sp.x - S * 1.2, coupe - S * 3, S * 2.4, S * 3); g.clip();
  dessinerTete(type, sp.x + (o.dx || 0), yTete(sp, monte, cache), r, o);
  g.restore();
}

// Croix rouge « pas touche »
function dessinerInterdit(x, y, r) {
  g.save(); g.lineWidth = Math.max(4, r * .14); g.strokeStyle = '#e53935';
  g.globalAlpha = .9;
  g.beginPath(); g.arc(x, y, r * 1.15, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.moveTo(x - r * .8, y - r * .8); g.lineTo(x + r * .8, y + r * .8); g.stroke();
  g.restore();
}

// Bandeau de mission en haut : « Attrape seulement : <animal> »
function dessinerMission(type, flash, y = HUD_H + 5) {
  const l = Math.min(W - 24, 300), x = (W - l) / 2, h = 40;
  g.save();
  const zoom = 1 + flash * .12;
  g.translate(W / 2, y + h / 2); g.scale(zoom, zoom); g.translate(-W / 2, -(y + h / 2));
  rectArrondi(x, y, l, h, 14);
  g.fillStyle = flash > 0 ? '#fff3b0' : 'rgba(255,252,240,.94)'; g.fill();
  g.lineWidth = 3; g.strokeStyle = '#f07a1a'; g.stroke();
  g.fillStyle = '#2b3a1f'; g.font = 'bold 17px system-ui, sans-serif'; g.textBaseline = 'middle'; g.textAlign = 'left';
  g.fillText(t('mission'), x + 12, y + h / 2 + 1);
  const ancienNuit = nuitDessin; nuitDessin = false;
  dessinerTete(type, x + l - 30, y + h / 2 + 4, 13);
  nuitDessin = ancienNuit;
  g.restore();
}

// ======================================================================
// 6. Effets : particules, textes qui s'envolent, anneaux
// ======================================================================

let particules = [], textes = [], anneaux = [], secousse = 0;
const COULEURS_FETE = ['#ffd34d', '#ff7a59', '#5ec8f2', '#8fdc6a', '#f59ac0', '#ffffff'];

function eclat(x, y, n, couleurs, force = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (80 + Math.random() * 220) * force;
    particules.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120 * force, vie: 0, max: .7 + Math.random() * .5,
      couleur: couleurs[i % couleurs.length], taille: 4 + Math.random() * 5, forme: i % 3 === 0 ? 'etoile' : 'carre', rot: Math.random() * 6 });
  }
}
function feuilles(x, y) {
  for (let i = 0; i < 7; i++) {
    particules.push({ x: x + (Math.random() - .5) * 30, y, vx: (Math.random() - .5) * 160, vy: -80 - Math.random() * 120, vie: 0, max: .8,
      couleur: nuitDessin ? '#2e5a3a' : ['#5db35a', '#3f9447', '#a8d86a'][i % 3], taille: 6, forme: 'feuille', rot: Math.random() * 6 });
  }
}
function confettisPluie() {
  for (let i = 0; i < 70; i++) {
    particules.push({ x: Math.random() * W, y: -10 - Math.random() * 120, vx: (Math.random() - .5) * 60, vy: 60 + Math.random() * 120, vie: 0, max: 3.5,
      couleur: COULEURS_FETE[i % COULEURS_FETE.length], taille: 6 + Math.random() * 5, forme: i % 4 === 0 ? 'etoile' : 'carre', rot: Math.random() * 6, pluie: true });
  }
}
function texteVolant(x, y, texte, couleur, taille = 26) { textes.push({ x, y, texte, couleur, taille, vie: 0, max: .9 }); }
function anneau(x, y, couleur) { anneaux.push({ x, y, couleur, vie: 0, max: .35 }); }

function etoile5(x, y, r) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
    g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  g.closePath(); g.fill();
}

function majEffets(dt) {
  for (const p of particules) {
    p.vie += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 6;
    p.vy += (p.pluie ? 40 : 520) * dt;
    if (p.forme === 'feuille') { p.vx *= .97; p.vy = Math.min(p.vy, 90); }
  }
  particules = particules.filter((p) => p.vie < p.max);
  for (const t of textes) { t.vie += dt; t.y -= 55 * dt; }
  textes = textes.filter((t) => t.vie < t.max);
  for (const a of anneaux) a.vie += dt;
  anneaux = anneaux.filter((a) => a.vie < a.max);
  secousse = Math.max(0, secousse - dt * 30);
}

function dessinerEffets() {
  for (const a of anneaux) {
    const k = a.vie / a.max;
    g.globalAlpha = 1 - k; g.strokeStyle = a.couleur; g.lineWidth = 4;
    g.beginPath(); g.arc(a.x, a.y, 10 + k * 34, 0, Math.PI * 2); g.stroke();
  }
  for (const p of particules) {
    g.globalAlpha = Math.max(0, 1 - p.vie / p.max);
    g.fillStyle = p.couleur;
    g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
    if (p.forme === 'etoile') etoile5(0, 0, p.taille);
    else if (p.forme === 'feuille') { g.beginPath(); g.ellipse(0, 0, p.taille, p.taille * .45, 0, 0, Math.PI * 2); g.fill(); }
    else g.fillRect(-p.taille / 2, -p.taille / 3, p.taille, p.taille * .66);
    g.restore();
  }
  g.globalAlpha = 1;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const t of textes) {
    const k = t.vie / t.max;
    g.globalAlpha = k < .7 ? 1 : 1 - (k - .7) / .3;
    const z = k < .15 ? .6 + k / .15 * .5 : 1.1 - Math.min(.1, (k - .15));
    g.font = `900 ${Math.round(t.taille * z)}px system-ui, sans-serif`;
    g.lineWidth = 5; g.strokeStyle = 'rgba(0,0,0,.55)'; g.strokeText(t.texte, t.x, t.y);
    g.fillStyle = t.couleur; g.fillText(t.texte, t.x, t.y);
  }
  g.globalAlpha = 1;
}

// ======================================================================
// 7. La partie
// ======================================================================

let etat = 'menu';      // menu, demo, jeu, pause, bilan
let niv = 0;
let partie = null;
const demosVues = new Set();
const $ = (id) => document.getElementById(id);

function niveau() { return NIVEAUX[niv]; }
function cachettesActives() { return SOUS_ENSEMBLES[niveau().cachettes]; }
function sorteDe(idx) { return SORTES[(idx + niv * 2) % SORTES.length]; }

function tirer(types, sauf) {
  const liste = Object.entries(types).filter(([t]) => t !== sauf);
  let total = liste.reduce((n, [, p]) => n + p, 0), x = Math.random() * total;
  for (const [t, p] of liste) { if ((x -= p) <= 0) return t; }
  return liste[0][0];
}

function nouvellePartie() {
  partie = {
    score: 0, attrapes: 0, aAttraper: 0, apparus: 0, combo: 0, comboMax: 0, erreurs: 0,
    animaux: [], papillon: null, prochain: 1.0, prochainPap: 3 + Math.random() * 2,
    cible: null, depuisCible: 0, changerCible: false, flashCible: 0, finT: 0, temps: 0, clavier: false,
  };
  if (niveau().mission) nouvelleCible(true);
}

function nouvelleCible(debut) {
  const types = Object.keys(niveau().types).filter((t) => t !== 'herisson' && t !== partie.cible);
  partie.cible = types[Math.floor(Math.random() * types.length)];
  partie.depuisCible = 0;
  partie.flashCible = 1;
  if (!debut) {
    SONS.mission();
    texteVolant(W / 2, HUD_H + BANDEAU + 40, t('nouvelleMission'), '#ffd34d', 26);
  }
}

function cachettesLibres() {
  const prises = new Set(partie.animaux.map((a) => a.spot));
  return cachettesActives().filter((i) => !prises.has(i));
}

function faireApparaitre() {
  const N = niveau(), P = partie;
  const libres = cachettesLibres();
  if (!libres.length) return false;
  const spot = libres[Math.floor(Math.random() * libres.length)];
  let type;
  if (N.mission) type = Math.random() < .55 ? P.cible : tirer(N.types, P.cible);
  else type = tirer(N.types);
  const piege = type === 'herisson' || (N.mission && type !== P.cible);
  const cache = !!N.cache && type !== 'herisson' && type !== 'renard' && Math.random() < N.cache;
  const duree = N.duree * (cache ? .9 : 1) * (type === 'herisson' ? 1.25 : 1) * (.9 + Math.random() * .2);
  P.animaux.push({ spot, type, piege, cache, duree, etat: 'monte', monte: 0, t: 0, coups: 0, fini: false });
  P.apparus++; P.depuisCible++;
  if (!piege) P.aAttraper++;
  if (N.mission && P.depuisCible >= 10) P.changerCible = true;
  return true;
}

// Position du centre de la tête (et rayon de la zone à toucher)
function zoneTouche(a) {
  if (a.etat === 'saut') return { ...posSaut(a), r: 0 };
  const sp = grille[a.spot], { r } = geom(sp);
  const y = yTete(sp, a.monte, a.cache);
  if (a.cache) return { x: sp.x, y: y - r * .5, r: Math.max(r * 1.1, 26) };
  return { x: sp.x, y, r: Math.max(r * 1.3, 28) };
}
function posSaut(a) {
  const A = grille[a.de], B = grille[a.spot];
  const p = doux(borne(a.sautT, 0, 1));
  const yA = yTete(A, 1, false), yB = yTete(B, 1, false);
  return { x: lerp(A.x, B.x, p), y: lerp(yA, yB, p) - Math.sin(Math.PI * p) * s * .9, r: geom(B).r };
}
function posPapillon(b) {
  const p = b.t / b.duree;
  const x = b.sens > 0 ? -40 + (W + 80) * p : W + 40 - (W + 80) * p;
  return { x, y: b.y0 + Math.sin(b.t * 2.6) * s * .25 };
}

function maj(dt) {
  const N = niveau(), P = partie;
  P.temps += dt;
  P.flashCible = Math.max(0, P.flashCible - dt);

  // Nouvelles apparitions
  if (P.apparus < N.apparitions) {
    P.prochain -= dt;
    if (P.prochain <= 0) {
      if (P.changerCible) {
        // On attend que la forêt soit vide pour changer de mission
        if (P.animaux.length === 0) { nouvelleCible(false); P.changerCible = false; P.prochain = 1.2; }
        else P.prochain = .15;
      } else if (faireApparaitre()) {
        if (N.double && Math.random() < N.double && P.apparus < N.apparitions && !P.changerCible) faireApparaitre();
        P.prochain = N.intervalle * (.75 + Math.random() * .5);
      } else P.prochain = .15;
    }
  }

  // Papillon doré
  if (N.papillon && !P.papillon && P.apparus < N.apparitions) {
    P.prochainPap -= dt;
    if (P.prochainPap <= 0) {
      const haut = HUD_H + BANDEAU;
      P.papillon = { t: 0, duree: Math.max(2.4, 3.8 - niv * .1), sens: Math.random() < .5 ? 1 : -1, y0: haut + 10 + Math.random() * (H - haut) * .35 };
      P.prochainPap = N.papillon * (.8 + Math.random() * .6);
    }
  }
  if (P.papillon) {
    P.papillon.t += dt;
    if (P.papillon.t >= P.papillon.duree) P.papillon = null;
  }

  // Animaux
  for (const a of P.animaux) {
    a.t += dt;
    if (a.etat === 'monte') {
      a.monte += dt / .18;
      if (a.monte >= 1) { a.monte = 1; a.etat = 'visible'; a.t = 0; }
    } else if (a.etat === 'visible') {
      if (a.t >= a.duree) a.etat = 'descend';
    } else if (a.etat === 'descend') {
      a.monte -= dt / .22;
      if (a.monte <= 0) {
        a.etat = 'fin';
        if (!a.piege && !a.fini) echappe(a);
      }
    } else if (a.etat === 'attrape') {
      a.monte = a.t < .18 ? 1 + Math.sin(a.t / .18 * Math.PI) * .18 : Math.max(0, 1 - (a.t - .18) / .25);
      if (a.t > .45) a.etat = 'fin';
    } else if (a.etat === 'pique') {
      if (a.t > .45) a.etat = 'descend';
    } else if (a.etat === 'saut') {
      a.sautT += dt / .45;
      if (a.sautT >= 1) { a.etat = 'visible'; a.monte = 1; a.t = 0; a.duree = Math.max(.9, a.duree * .9); }
    }
  }
  P.animaux = P.animaux.filter((a) => a.etat !== 'fin');

  // Fin du niveau
  if (P.apparus >= N.apparitions && P.animaux.length === 0 && !P.papillon) {
    P.finT += dt;
    if (P.finT > .7) finNiveau();
  }
  majHud();
}

function echappe(a) {
  const P = partie, sp = grille[a.spot];
  P.combo = 0;
  nuitDessin = !!niveau().nuit;
  feuilles(sp.x, geom(sp).coupe);
  nuitDessin = false;
  SONS.rate();
}

function toucher(x, y) {
  const P = partie;
  // Le papillon d'abord
  if (P.papillon) {
    const b = posPapillon(P.papillon);
    if (Math.hypot(x - b.x, y - b.y) < Math.max(34, s * .3)) {
      P.score += 30;
      eclat(b.x, b.y, 22, ['#ffd34d', '#ffb000', '#fff6c8'], 1.2);
      texteVolant(b.x, b.y - 20, '+30', '#ffd34d', 32);
      SONS.bonus();
      P.papillon = null;
      return;
    }
  }
  let meilleur = null, dmin = Infinity;
  for (const a of P.animaux) {
    if (!(a.etat === 'visible' || (a.etat === 'monte' && a.monte > .35))) continue;
    const z = zoneTouche(a), d = Math.hypot(x - z.x, y - z.y);
    if (d < z.r && d < dmin) { dmin = d; meilleur = a; }
  }
  if (!meilleur) { anneau(x, y, 'rgba(255,255,255,.75)'); SONS.vide(); return; }
  toucherAnimal(meilleur);
}

function toucherAnimal(a) {
  const P = partie, z = zoneTouche(a);
  if (a.piege) {
    // Piège : hérisson, ou animal qui n'est pas celui de la mission
    a.etat = 'pique'; a.t = 0; a.fini = true;
    const perte = a.type === 'herisson' ? 5 : 3;
    P.score = Math.max(0, P.score - perte);
    P.combo = 0; P.erreurs++;
    secousse = 9;
    anneau(z.x, z.y, '#ff5252');
    texteVolant(z.x, z.y - 30, a.type === 'herisson' ? t('aie') : t('pasLui'), '#ff6b6b', 24);
    SONS.aie();
    return;
  }
  if (a.type === 'renard' && a.coups === 0) {
    // Le renard saute vers une autre cachette libre
    a.coups = 1;
    const libres = cachettesLibres();
    const vers = libres.length ? libres[Math.floor(Math.random() * libres.length)] : a.spot;
    a.de = a.spot; a.spot = vers; a.etat = 'saut'; a.sautT = 0;
    texteVolant(z.x, z.y - 30, t('hop'), '#ffffff', 26);
    anneau(z.x, z.y, '#ffd34d');
    SONS.saut();
    return;
  }
  // Animal attrapé
  P.combo++; P.comboMax = Math.max(P.comboMax, P.combo);
  const mult = 1 + Math.min(4, Math.floor((P.combo - 1) / 5)) * .5;
  const points = Math.round((a.cache ? 15 : POINTS[a.type]) * mult);
  P.score += points; P.attrapes++;
  a.etat = 'attrape'; a.t = 0; a.fini = true;
  eclat(z.x, z.y, 14, COULEURS_FETE);
  anneau(z.x, z.y, '#ffd34d');
  texteVolant(z.x, z.y - 34, '+' + points, '#fff36b', 28);
  SONS.attrape(Math.min(P.combo, 12));
  if (P.combo % 5 === 0) {
    texteVolant(W / 2, HUD_H + BANDEAU + 60, t('combo', { m: 1 + Math.min(4, P.combo / 5) * .5 }), '#ffb347', 30);
    SONS.combo();
  }
}

// Touches 1 à 9 : toucher la cachette correspondante ; Espace : le papillon
function toucheClavier(k) {
  const P = partie;
  P.clavier = true;
  if (k === ' ' || k === 'Spacebar') {
    if (P.papillon) { const b = posPapillon(P.papillon); toucher(b.x, b.y); }
    return;
  }
  const n = parseInt(k, 10);
  const actives = cachettesActives();
  if (!(n >= 1 && n <= actives.length)) return;
  const idx = actives[n - 1];
  const a = P.animaux.find((b) => b.spot === idx && (b.etat === 'visible' || (b.etat === 'monte' && b.monte > .35)));
  if (a) toucherAnimal(a);
  else { const sp = grille[idx]; anneau(sp.x, geom(sp).coupe, 'rgba(255,255,255,.75)'); SONS.vide(); }
}

function majHud() {
  if (!partie) return;
  $('txtNiveau').textContent = t('niveau', { n: niv + 1 });
  $('txtScore').textContent = t('pts', { n: partie.score });
  const mult = 1 + Math.min(4, Math.floor(Math.max(0, partie.combo - 1) / 5)) * .5;
  $('txtCombo').textContent = partie.combo >= 2 ? `🔥 ${partie.combo}${mult > 1 ? ' ×' + window.JEL_I18N.nombre(mult) : ''}` : '';
  $('barre').firstElementChild.style.width = `${Math.round(partie.apparus / niveau().apparitions * 100)}%`;
}

// ======================================================================
// 8. Dessin de la partie
// ======================================================================

function dessinerJeu() {
  const N = niveau(), P = partie;
  nuitDessin = !!N.nuit;
  g.drawImage(N.nuit ? fondNuit : fondJour, 0, 0, W, H);
  g.save();
  if (secousse > 0) g.translate((Math.random() - .5) * secousse, (Math.random() - .5) * secousse);
  const actives = cachettesActives();
  const parSpot = new Map();
  for (const a of P.animaux) if (a.etat !== 'saut') parSpot.set(a.spot, a);
  for (let n = 0; n < actives.length; n++) {
    const idx = actives[n], sp = grille[idx], { S } = geom(sp);
    ellipse(sp.x, sp.gy, S * .48, S * .07, 'rgba(0,0,0,.2)');
    const a = parSpot.get(idx);
    if (a) {
      const o = { content: a.etat === 'attrape' };
      if (a.etat === 'pique') o.dx = Math.sin(a.t * 70) * 4;
      dessinerAnimalCachette(sp, a.type, a.monte, a.cache, o);
    }
    dessinerCachette(sp, sorteDe(idx));
    if (P.clavier) {
      g.font = 'bold 14px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      cercle(sp.x, sp.gy - S * .06, 11, 'rgba(0,0,0,.45)');
      g.fillStyle = '#fff'; g.fillText(String(n + 1), sp.x, sp.gy - S * .06);
    }
  }
  // Renards en plein saut
  for (const a of P.animaux) {
    if (a.etat !== 'saut') continue;
    const p = posSaut(a);
    dessinerRenardSaut(p.x, p.y, p.r, grille[a.spot].x >= grille[a.de].x ? 1 : -1);
  }
  if (P.papillon) { const b = posPapillon(P.papillon); dessinerPapillon(b.x, b.y, Math.max(16, s * .17), P.papillon.t); }
  if (N.nuit) lucioles(P.temps);
  g.restore();
  nuitDessin = false;
  if (N.mission && P.cible) dessinerMission(P.cible, P.flashCible);
}

function lucioles(t) {
  for (let i = 0; i < 10; i++) {
    const x = (W * (i * .137 + .05) + Math.sin(t * .7 + i) * 30) % W;
    const y = HUD_H + BANDEAU + (H - HUD_H) * ((i * .29) % .9) + Math.cos(t * .9 + i * 2) * 20;
    g.globalAlpha = .4 + .4 * Math.sin(t * 3 + i * 1.7);
    cercle(x, y, 3, '#fff27a');
  }
  g.globalAlpha = 1;
}

// ======================================================================
// 9. Tutoriels animés
// ======================================================================

let demo = null, demoT = 0, demoLieux = {};
function calculerDemo() {
  const S = Math.min(W * .36, 190, H * .26);
  const gy = Math.min(H * .7, H - S * .4 - 70);
  demoLieux = {
    C: { x: W / 2, gy, S },
    G: { x: W * .27, gy, S },
    D: { x: W * .73, gy, S },
  };
}

// État d'un acteur du tutoriel au temps t
function acteurDemo(ev, t, duree) {
  if (ev.type === 'papillon') {
    const tt = ev.tap != null ? Math.min(t, ev.tap) : t;
    const p = tt / duree;
    const x = lerp(-W * .05, W * 1.05, p), y = demoLieux.C.gy - demoLieux.C.S * 1.6 + Math.sin(tt * 3) * 25;
    return { x, y, r: 26, visible: ev.tap == null || t < ev.tap, attrape: ev.tap != null && t >= ev.tap };
  }
  let sp = demoLieux[ev.lieu];
  let monte = borne((t - ev.debut) / .2, 0, 1);
  const fin = duree - .3;
  if (t > fin) monte = Math.min(monte, 1 - (t - fin) / .3);
  const res = { sp, monte, saut: null, attrape: -1 };
  if (ev.saut != null && t >= ev.saut) {
    const p = (t - ev.saut) / .45;
    const B = demoLieux[ev.vers];
    if (p < 1) {
      const pp = doux(p);
      res.saut = { x: lerp(sp.x, B.x, pp), y: lerp(yTete(sp, 1), yTete(B, 1), pp) - Math.sin(Math.PI * pp) * sp.S * .9, r: geom(sp).r };
    }
    res.sp = sp = B;
  }
  if (ev.tap != null && t >= ev.tap) {
    const p = (t - ev.tap) / .45;
    res.attrape = p;
    res.monte = p < .4 ? 1 + Math.sin(p / .4 * Math.PI) * .18 : Math.max(0, 1 - (p - .4) / .6);
  }
  const y = res.saut ? res.saut.y : yTete(sp, Math.min(1, res.monte), ev.cache) - (ev.cache ? geom(sp).r * .5 : 0);
  res.x = res.saut ? res.saut.x : sp.x; res.y = y; res.r = geom(sp).r;
  return res;
}

function dessinerDemo(dt) {
  const D = DEMOS[demo];
  const tAvant = demoT % D.duree;
  demoT += dt;
  const t = demoT % D.duree;
  nuitDessin = !!D.nuit;
  g.drawImage(D.nuit ? fondNuit : fondJour, 0, 0, W, H);
  const etats = D.evts.map((ev) => acteurDemo(ev, t, D.duree));
  for (const nom of D.lieux) {
    const sp = demoLieux[nom], { S } = geom(sp);
    ellipse(sp.x, sp.gy, S * .48, S * .07, 'rgba(0,0,0,.2)');
    D.evts.forEach((ev, i) => {
      const e = etats[i];
      if (ev.type === 'papillon' || e.saut || e.sp !== sp || e.attrape >= 1) return;
      dessinerAnimalCachette(sp, ev.type, e.monte, ev.cache, { content: e.attrape >= 0 });
    });
    dessinerCachette(sp, nom === 'D' ? 'souche' : 'buisson');
  }
  D.evts.forEach((ev, i) => {
    const e = etats[i];
    if (ev.type === 'papillon') { if (e.visible) dessinerPapillon(e.x, e.y, e.r, t); }
    else if (e.saut) dessinerRenardSaut(e.saut.x, e.saut.y, e.saut.r, 1);
    if (ev.refus != null && t >= ev.refus && t < D.duree - .3) dessinerInterdit(e.x, e.y, e.r);
    // Effets au moment du toucher
    if (ev.tap != null && tAvant < ev.tap && t >= ev.tap) {
      eclat(e.x, e.y, 14, COULEURS_FETE);
      texteVolant(e.x, e.y - 34, ev.type === 'papillon' ? '+30' : ev.cache ? '+15' : ev.type === 'renard' ? '+20' : '+10', '#fff36b', 28);
    }
    if (ev.saut != null && tAvant < ev.saut && t >= ev.saut) texteVolant(e.x, e.y - 30, window.JEL_I18N.t('hop'), '#ffffff', 26);
  });
  if (D.nuit) lucioles(demoT);
  nuitDessin = false;
  // Sous la bulle d'explication (qui cache le haut de l'écran)
  if (D.mission) dessinerMission(D.mission, 0, Math.max(150, demoLieux.C.gy - demoLieux.C.S * 1.6 - 50));
  // La main
  const kf = D.main;
  let k = 0;
  while (k < kf.length - 1 && kf[k + 1][0] <= t) k++;
  const pos = (ref) => ref === 'R' ? { x: W * .78, y: Math.min(H * .84, H - 130) } : etats[ref];
  const a = pos(kf[k][1]), b = k < kf.length - 1 ? pos(kf[k + 1][1]) : a;
  const p = k < kf.length - 1 ? doux((t - kf[k][0]) / (kf[k + 1][0] - kf[k][0])) : 0;
  const appui = kf[k][2] && t - kf[k][0] < .2;
  if (kf[k][2] && tAvant < kf[k][0] && t >= kf[k][0]) anneau(a.x, a.y, '#ffffff');
  dessinerMain(lerp(a.x, b.x, p), lerp(a.y, b.y, p), appui);
  // Démarrage automatique après trois démonstrations
  if (demoT > D.duree * 3) commencer();
}

// ======================================================================
// 10. Écrans : menu, tutoriel, pause, bilan
// ======================================================================

let minuteursBilan = [];
let bilanScore = 0, bilanAffiche = 0;

function montrer(id) {
  for (const e of ['menu', 'demo', 'pause', 'bilan']) $(e).classList.toggle('cache', e !== id);
  $('hud').classList.toggle('cache', !(id === null || id === 'pause' || id === 'bilan'));
}

function ouvrirMenu() {
  etat = 'menu';
  partie = null;
  minuteursBilan.forEach(clearTimeout); minuteursBilan = [];
  const grilleEl = $('grille');
  grilleEl.innerHTML = '';
  let total = 0;
  NIVEAUX.forEach((_, i) => {
    const b = document.createElement('button');
    const et = sauvegarde.etoiles[i] || 0;
    total += et;
    const ouvert = i < sauvegarde.debloque;
    b.disabled = !ouvert;
    b.setAttribute('aria-label', t('niveau', { n: i + 1 }));
    b.innerHTML = ouvert ? `${i + 1}<small>${'★'.repeat(et)}${'☆'.repeat(3 - et)}</small>` : `${i + 1}<small>🔒</small>`;
    b.addEventListener('click', () => { SONS.bouton(); lancerNiveau(i); });
    grilleEl.appendChild(b);
  });
  const recordTotal = sauvegarde.records.reduce((n, v) => n + (v || 0), 0);
  $('totalEtoiles').textContent = t('etoilesTotal', { n: total, total: NIVEAUX.length * 3 }) + (recordTotal ? ' · ' + t('record', { n: recordTotal }) : '');
  effacerMenu.maj();
  montrer('menu');
}

function lancerNiveau(i) {
  niv = i;
  nouvellePartie();
  particules = []; textes = []; anneaux = [];
  minuteursBilan.forEach(clearTimeout); minuteursBilan = [];
  const d = niveau().demo;
  if (d && !demosVues.has(d)) {
    demosVues.add(d);
    demo = d; demoT = 0; etat = 'demo';
    $('demoTitre').textContent = t('demo.' + d + '.titre');
    $('demoTexte').textContent = t('demo.' + d + '.texte');
    montrer('demo');
  } else commencer();
}

function commencer() {
  etat = 'jeu';
  particules = []; textes = []; anneaux = [];
  montrer(null);
  majHud();
}

function mettrePause() {
  if (etat !== 'jeu') return;
  etat = 'pause';
  montrer('pause');
}

function finNiveau() {
  const P = partie, i = niv;
  etat = 'bilan';
  const ratio = P.aAttraper ? P.attrapes / P.aAttraper : 1;
  const etoiles = ratio >= .9 ? 3 : ratio >= .75 ? 2 : ratio >= .5 ? 1 : 0;
  const reussi = etoiles > 0;
  const ancien = sauvegarde.records[i] || 0;
  const record = P.score > ancien;
  if (record) sauvegarde.records[i] = P.score;
  if (etoiles > (sauvegarde.etoiles[i] || 0)) sauvegarde.etoiles[i] = etoiles;
  if (reussi) sauvegarde.debloque = Math.max(sauvegarde.debloque, Math.min(NIVEAUX.length, i + 2));
  sauver();
  niveauReussi = -1;
  if (reussi) sauverVictoire(i, P.score);

  const dernier = i === NIVEAUX.length - 1;
  $('bTitre').textContent = !reussi ? t('presque') : dernier ? t('foretFinie') : [t('bienJoue'), t('super'), t('genial')][etoiles - 1];
  const total = sauvegarde.etoiles.reduce((n, v) => n + (v || 0), 0);
  $('bDetail').innerHTML = t('detail', { a: P.attrapes, b: P.aAttraper, c: P.comboMax }) +
    (!reussi ? '<br>' + t('moitie') : '') +
    (dernier && reussi ? '<br>' + t('finTout', { n: total, total: NIVEAUX.length * 3 }) : '');
  const rec = $('bRecord');
  rec.textContent = record && P.score > 0 ? t('nouveauRecord') : t('record', { n: ancien });
  rec.classList.toggle('nouveau', record && P.score > 0);
  const etoilesEl = $('bEtoiles').children;
  for (const e of etoilesEl) e.classList.remove('gagne');
  const suivant = $('btnSuivant');
  suivant.classList.toggle('cache', dernier);
  suivant.disabled = !(i + 1 < sauvegarde.debloque);
  bilanScore = P.score; bilanAffiche = 0;
  $('bScore').textContent = '0';
  montrer('bilan');

  if (reussi) { SONS.victoire(); confettisPluie(); } else SONS.echec();
  for (let k = 0; k < etoiles; k++) {
    minuteursBilan.push(setTimeout(() => {
      etoilesEl[k].classList.add('gagne');
      SONS.etoile(k);
      eclat(W / 2 + (k - 1) * 60, H * .3, 16, ['#ffd34d', '#ffb000', '#fff'], 1);
    }, 500 + k * 400));
  }
}

// ======================================================================
// 11. Boucle principale
// ======================================================================

let dernier = 0, tMenu = 0;
function boucle(ms) {
  const dt = Math.min(.05, (ms - dernier) / 1000 || 0);
  dernier = ms;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (etat === 'jeu') maj(dt);
  majEffets(dt);
  if (etat === 'menu') dessinerAccueil(dt);
  else if (etat === 'demo') dessinerDemo(dt);
  else if (partie) dessinerJeu();
  if (etat === 'bilan' && bilanAffiche < bilanScore) {
    bilanAffiche = Math.min(bilanScore, bilanAffiche + Math.max(1, bilanScore * dt * 1.2));
    $('bScore').textContent = String(Math.round(bilanAffiche));
  }
  dessinerEffets();
  requestAnimationFrame(boucle);
}

// Accueil : la forêt avec quelques animaux qui jettent un œil
function dessinerAccueil(dt) {
  tMenu += dt;
  g.drawImage(fondJour, 0, 0, W, H);
  const acteurs = { 3: ['lapin', false, 0], 5: ['ecureuil', false, 1.5], 7: ['renard', false, 3], 6: ['herisson', true, 2.2], 8: ['hibou', true, .8], 1: ['lapin', true, 4] };
  for (let idx = 0; idx < 9; idx++) {
    const sp = grille[idx], { S } = geom(sp);
    ellipse(sp.x, sp.gy, S * .48, S * .07, 'rgba(0,0,0,.2)');
    const ac = acteurs[idx];
    if (ac) {
      const m = borne(.75 + Math.sin(tMenu * 1.3 + ac[2]) * .5, 0, 1);
      dessinerAnimalCachette(sp, ac[0], m, ac[1]);
    }
    dessinerCachette(sp, SORTES[idx]);
  }
  dessinerPapillon(W / 2 + Math.sin(tMenu * .6) * W * .35, H * .62 + Math.sin(tMenu * 1.7) * 30, Math.max(16, s * .17), tMenu);
}

// ======================================================================
// 12. Commandes
// ======================================================================

function majBoutonSon() {
  const b = $('btnSon');
  b.textContent = sauvegarde.son ? '🔊' : '🔇';
  b.setAttribute('aria-label', sauvegarde.son ? t('couperSon') : t('remettreSon'));
}

window.addEventListener('pointerdown', reveillerAudio, true);
window.addEventListener('keydown', reveillerAudio, true);

toile.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (etat === 'jeu') toucher(e.clientX, e.clientY);
});
$('demo').addEventListener('pointerdown', (e) => { e.preventDefault(); if (etat === 'demo') commencer(); });

window.addEventListener('keydown', (e) => {
  if (etat === 'demo') { e.preventDefault(); commencer(); return; }
  if (etat === 'jeu') {
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { mettrePause(); return; }
    if (e.key === ' ' || e.key === 'Spacebar') e.preventDefault();
    toucheClavier(e.key);
  } else if (etat === 'pause' && (e.key === 'Escape' || e.key === 'p' || e.key === 'P')) {
    etat = 'jeu'; montrer(null);
  }
});

$('btnSon').addEventListener('click', () => {
  sauvegarde.son = !sauvegarde.son;
  sauver(); majBoutonSon();
  SONS.bouton();
});
$('btnJouer').addEventListener('click', () => {
  SONS.bouton();
  JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => {
      const i = Math.max(1, Math.min(NIVEAUX.length, d.niveau)) - 1;
      sauvegarde.debloque = Math.max(sauvegarde.debloque, i + 1);
      scorePartie = d.score;
      lancerNiveau(i);
    },
    onNouvelle: () => { scorePartie = 0; lancerNiveau(Math.min(sauvegarde.debloque, NIVEAUX.length) - 1); },
  });
});
$('btnPause').addEventListener('click', () => { SONS.bouton(); mettrePause(); });
$('btnContinuer').addEventListener('click', () => { SONS.bouton(); etat = 'jeu'; montrer(null); });
$('btnRecommencer').addEventListener('click', () => { SONS.bouton(); lancerNiveau(niv); });
$('btnMenu1').addEventListener('click', () => { SONS.bouton(); ouvrirMenu(); });
$('btnMenu2').addEventListener('click', () => { SONS.bouton(); ouvrirMenu(); });
$('btnRejouer').addEventListener('click', () => { SONS.bouton(); lancerNiveau(niv); });
$('btnSuivant').addEventListener('click', () => { SONS.bouton(); if (niv + 1 < NIVEAUX.length) lancerNiveau(niv + 1); });

document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });
window.addEventListener('resize', calculer);

// Sauvegarde de la progression (module commun JEL_SAVE, marche aussi sur le site).
// niveau = niveau où reprendre (1 = premier), score = points des niveaux réussis
// depuis le début de la partie (ou depuis la reprise).
const JEU = 'clic-rapide-animaux';
let scorePartie = 0, niveauReussi = -1;
// Niveau réussi (index à partir de 0) : on reprendra au suivant ; après le dernier, plus rien à continuer.
function sauverVictoire(i, points) {
  niveauReussi = i;
  scorePartie += points;
  if (i + 1 >= NIVEAUX.length) JEL_SAVE.clear(JEU);
  else JEL_SAVE.save(JEU, { niveau: i + 2, score: scorePartie });
}
// Fermeture de la page : seulement pendant un niveau (pas dans le menu).
JEL_SAVE.surFermeture(() => {
  if (!partie || etat === 'menu') return;
  if (etat === 'bilan' && niveauReussi === niv) { if (niv + 1 < NIVEAUX.length) JEL_SAVE.save(JEU, { niveau: niv + 2, score: scorePartie }); return; }
  JEL_SAVE.save(JEU, { niveau: niv + 1, score: scorePartie });
});
const effacerMenu = JEL_SAVE.boutonEffacer({ jeu: JEU });
$('btnJouer').after(effacerMenu);

// Démarrage
calculer();
majBoutonSon();
ouvrirMenu();
requestAnimationFrame(boucle);
</script>
