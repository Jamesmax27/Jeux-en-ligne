  };

  function sceneTuto(d) {
    const e = { n: 0, d: [], sc: [0, 0, 0, 0], h: [{ H: 0, V: 0, Q: 0, B: 0 }, { H: 0, V: 0, Q: 0, B: 0 }, { H: 0, V: 0, Q: 0, B: 0 }, { H: 0, V: 0, Q: 0, B: 0 }], tour: 0, q: -1, pt: 0, mk: d.mk || 0, ouv: 0, tv: 0, pe: 0, bo: d.bo || 0, co: 0, cl: 0, clv: 0, ev: null };
    d.q.forEach((txt) => {
      const m = [], v = [];
      for (let i = 0; i < txt.length; i++) { if (txt[i] === '*') { v[v.length - 1] = 1; continue; } m.push(txt[i]); v.push(0); }
      e.d.push({ m: m, v: v, f: 0 });
    });
    String(d.h || '').split('').forEach((r) => { e.h[0][r] += 1; });
    return e;
  }

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const alea = () => 0.5;
    let e = sceneTuto(d), debut = 0, fait = 0, flash = null, cloche = 0, fievre = 0, sauve = 0;
    const PAS = 1500, j = ++tutoAnim;
    const Q = d.q.length;
    const g = geometrieCite(Q, Q === 1 ? 170 : 300, 360);
    const btn = (r) => ({ x: 440 + REM.indexOf(r) % 2 * 60, y: 270 });
    function cible(pa) {
      if (pa[0] === 'o') { const p = [g.x0 + (pa[1] + 0.5) * g.cw + 20, g.haut + g.toit + g.hs * 0.5]; return p; }
      if (pa[0] === 's') return [470, 330];
      if (REM.indexOf(pa[0]) >= 0) { const b = btn(pa[0]); return [b.x, b.y]; }
      return null;
    }
    function faire(pa, t) {
      if (pa[0] === 'cloche') {
        e.d.forEach((q) => { for (let i = 0; i < Math.min(2, q.m.length); i++) if (q.m[i] === 'p') q.v[i] = 1; });
        cloche = t;
        return;
      }
      const action = pa[0] === 'o' ? { o: pa[1] } : pa[0] === 's' ? { s: 1 } : { r: pa[0] };
      R.jouer(e, 0, action, alea);
      e.tour = 0;
      const x = e.ev || {};
      if (x.t === 'o' || (x.t === 'r' && x.r !== 'H')) flash = { k: x.t === 'o' ? x.k : x.r, t0: t };
      if (x.t === 'r' && x.r === 'H') flash = { k: 'H', t0: t };
      if (x.fievre) fievre = t;
      if (x.sauve) sauve = t;
    }
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ecoule = t - debut;
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      if (k >= d.etapes.length + 2) { e = sceneTuto(d); fait = 0; flash = null; cloche = 0; fievre = 0; sauve = 0; debut = t; }
      else if (k >= fait && fait < d.etapes.length && dans >= 760) { faire(d.etapes[fait], t); fait++; }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 360);
      c.save(); c.translate(20, 0);
      dessinerCite(c, e, g, { t: t, actif: e.q, couleur: COUL[0] });
      c.restore();
      // panneau du tour : vies du tour (cœurs), marques (2 cases), vies gardées (coffre)
      c.fillStyle = 'rgba(255,255,255,.06)'; rr(c, 350, 16, 196, 222, 14); c.fill();
      medaillon(c, 0, 382, 50, 26, prog.options.masque);
      for (let i = 0; i < 2; i++) {
        c.strokeStyle = '#8a7a96'; c.lineWidth = 2; rr(c, 420 + i * 40, 34, 32, 32, 7); c.stroke();
        if (i < e.mk) { c.fillStyle = '#8f2a22'; rr(c, 420 + i * 40, 34, 32, 32, 7); c.fill(); croix(c, 436 + i * 40, 50, 10); }
      }
      const tremble = fievre && t - fievre < 900 ? Math.sin(t / 20) * 4 : 0;
      for (let i = 0; i < Math.min(12, e.pt); i++) coeur(c, 372 + (i % 6) * 28 + tremble, 104 + Math.floor(i / 6) * 28, 12);
      if (fievre && t - fievre < 1300) {
        const p = (t - fievre) / 1300;
        for (let i = 0; i < 5; i++) { c.globalAlpha = 1 - p; coeur(c, 380 + i * 30, 104 + p * 120, 12, '#7a7a7a'); }
        c.globalAlpha = 1;
      }
      // coffre des vies gardées
      tuile(c, 'Q', 380, 196, 44, t);
      for (let i = 0; i < Math.min(10, e.sc[0]); i++) coeur(c, 414 + (i % 5) * 24, 186 + Math.floor(i / 5) * 22, 10, '#ffcf6a');
      // boutons des remèdes de la démonstration
      REM.forEach((r) => {
        if (!(d.h && d.h.indexOf(r) >= 0)) return;
        const b = btn(r);
        c.fillStyle = e.h[0][r] > 0 ? '#2b2438' : '#1a1520'; rr(c, b.x - 24, b.y - 24, 48, 48, 12); c.fill();
        c.strokeStyle = '#ffc44a'; c.lineWidth = 2; c.stroke();
        c.globalAlpha = e.h[0][r] > 0 ? 1 : 0.35; tuile(c, r, b.x, b.y, 40, t); c.globalAlpha = 1;
      });
      // bouton « rentrer » (une porte qui se ferme)
      if (d.etapes.some((p) => p[0] === 's')) {
        c.fillStyle = '#4a9e3f'; rr(c, 430, 308, 80, 44, 14); c.fill();
        c.fillStyle = '#7a4a22'; rr(c, 458, 314, 24, 32, 5); c.fill();
        c.fillStyle = '#e0b04a'; rond(c, 476, 331, 2.5); c.fill();
      }
      // maison ouverte en grand
      if (flash && t - flash.t0 < 1100) {
        const p = Math.min(1, (t - flash.t0) / 200);
        const sz = 120 * (0.6 + 0.4 * p);
        c.globalAlpha = Math.min(1, (1100 - (t - flash.t0)) / 250);
        carteMaison(c, flash.k, 200 - sz / 2 + (Q === 1 ? 20 : 60), 130 - sz / 2, sz, sz, t);
        c.globalAlpha = 1;
      }
      if (cloche && t - cloche < 1400) {
        const a = Math.sin((t - cloche) / 90) * 0.4;
        c.save(); c.translate(280, 60); c.rotate(a);
        c.fillStyle = '#d8aa2c'; c.beginPath(); c.moveTo(-22, 26); c.quadraticCurveTo(-20, -24, 0, -26); c.quadraticCurveTo(20, -24, 22, 26); c.closePath(); c.fill();
        c.fillStyle = '#8f6c12'; rond(c, 0, 30, 6); c.fill();
        c.restore();
      }
      if (sauve && t - sauve < 1400) {
        const p = (t - sauve) / 1400;
        for (let i = 0; i < 3; i++) { c.globalAlpha = 1 - p; coeur(c, 120 + i * 30, 180 - p * 80, 16, '#ffcf6a'); }
        c.globalAlpha = 1;
      }
      // la main pour le geste à venir
      const prochaine = fait < d.etapes.length ? d.etapes[fait] : null;
      const cb = prochaine ? cible(prochaine) : null;
      if (cb) {
        const q = Math.min(1, dans / 650);
        const x = 520 + (cb[0] - 520) * q, y = 350 + (cb[1] - 350) * q;
        main(c, x, y, 1.5, q >= 1 ? Math.min(1, (dans - 650) / 110) : 0);
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  // Prochain quartier ouvert à partir de q (sens dir) ; garde q s'il est ouvert.
  function premierOuvert(q, dir, garder) {
    if (!vue) return 0;
    const Q = vue.d.length;
    if (garder && O.ouvert(vue, q)) return q;
    for (let k = 0; k < Q; k++) {
      const x = ((q + dir * k) % Q + Q) % Q;
      if (O.ouvert(vue, x)) return x;
    }
    return 0;
  }

  function quartierSous(px) {
    if (!vue || !geo) return -1;
    const q = Math.floor((px - geo.x0) / geo.cw);
    return q >= 0 && q < vue.d.length ? q : -1;
  }

  function attends() {
    if (Date.now() - dernierAttends > 1500 && partie && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
  }

  function ouvrir(q) {
    if (!partie || enPause || attenteTuto || q < 0 || !vue) return;
    if (!partie.monTour()) { attends(); return; }
    if (vue.q !== -1 && q !== vue.q) { toast(tr('tour.memeQuartier'), 1800); sons.non(); return; }
    if (!O.ouvert(vue, q)) { sons.non(); return; }
    if (partie.jouer({ o: q })) sons.clic();
  }

  function rentrer() {
    if (!partie || enPause || attenteTuto || !vue) return;
    if (!partie.monTour()) { attends(); return; }
    if (R.valide(vue, partie.siege, { s: 1 })) partie.jouer({ s: 1 });
    else { toast(tr('tour.ouvreDabord'), 1600); sons.non(); }
  }

  function remede(r) {
    if (!partie || enPause || attenteTuto || !vue) return;
    if (!partie.monTour()) { attends(); return; }
    if (R.valide(vue, partie.siege, { r: r })) partie.jouer({ r: r });
    else { toast(tr('remede.' + NOM_REMEDE[r] + '.quand'), 2000); sons.non(); }
  }

  const cite = $('cite');

  cite.addEventListener('pointerup', (ev) => {

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif') || !vue) return;
    if (ev.code === 'ArrowLeft' || ev.code === 'ArrowRight') {
      ev.preventDefault(); audio();
      if (vue.q !== -1) { toast(tr('tour.memeQuartier'), 1500); return; }
      if (!clavier) { clavier = true; curseur = premierOuvert(curseur, 1, true); return; }
      curseur = premierOuvert(curseur + (ev.code === 'ArrowLeft' ? -1 : 1), ev.code === 'ArrowLeft' ? -1 : 1);
      sons.clic();
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter' || ev.code === 'ArrowUp') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && ev.code !== 'ArrowUp') return;
      ev.preventDefault(); audio();
      if (vue.q !== -1) { ouvrir(vue.q); return; }
      if (!clavier) { clavier = true; curseur = premierOuvert(curseur, 1, true); return; }
      ouvrir(curseur);
    } else if (ev.code === 'ArrowDown' || ev.code === 'KeyS') {
      ev.preventDefault(); audio(); rentrer();
    } else if (ev.code === 'Digit1' || ev.code === 'Digit2' || ev.code === 'Digit3' || ev.code === 'Digit4' || ev.code === 'Numpad1' || ev.code === 'Numpad2' || ev.code === 'Numpad3' || ev.code === 'Numpad4') {
      ev.preventDefault(); audio();
      remede(REM[parseInt(ev.code.slice(-1), 10) - 1]);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); dessinerTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-carnet').addEventListener('click', () => { audio(); sons.clic(); ouvrirCarnet(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('carnet-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-rentrer').addEventListener('click', () => { audio(); rentrer(); });
  document.querySelectorAll('.remede').forEach((b) => b.addEventListener('click', () => { audio(); remede(b.dataset.r); }));
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); dessinerTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
