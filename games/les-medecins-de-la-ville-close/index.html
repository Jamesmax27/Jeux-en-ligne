  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    bande = null;
    if (vue) { construireVille(); nouvelleBande(vue.tour); }
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne)
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + masqueDe(s);
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        masque(c, s, masqueDe(s), 56, 62, 44);
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { masque: tr('doc.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { qui: nomChef ? nomChef + ' · ' + tr('doc.' + partie.chef) : tr('doc.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    construireVille();
    nouvelleBande(vue.tour);
    debutTour = Date.now();
    dernierTic = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  // Une action (la sienne ou celle d'un autre) : on l'anime et on l'annonce.
  function surAction(ev) {
    const avant = ev.avant, apres = ev.apres, s = ev.siege, a = ev.action || {};
    vue = JSON.parse(JSON.stringify(apres));
    debutTour = Date.now();
    dernierTic = -1;
    if (!bande || bande.fin || bande.s !== s) nouvelleBande(s);
    const lg = apres.lg || [];
    const moi = ev.moi || s === (partie ? partie.siege : -1);
    const qui = quiEst(s);
    const finTour = apres.tour !== s || (apres.ouv.length === 0 && a.t !== 'm');
    const carteEv = lg.find((x) => x.k === 'carte');
    if (carteEv) {
      bande.cartes.push({ c: carteEv.c, h: carteEv.h });
      sons.porte();
      const c = carteEv.c, qn = tr('quartier.' + carteEv.q);
      let txt = '';
      if (c === 'm' || c === 's' || c === 'g') { setTimeout(sons.soin, 280); }
      if (c === 'x') { if (carteEv.bo) { txt = tr('carte.xbo'); setTimeout(sons.remede, 250); } else { txt = tr('carte.x'); setTimeout(sons.marque, 250); } }
      else if (c === 'r') { txt = tr('carte.r', { q: qn }); setTimeout(sons.rat, 250); const qb = $('quartier-' + carteEv.q); O.voisins(apres, carteEv.q).forEach((v) => { const b = $('quartier-' + v); if (b) { b.classList.remove('secoue'); void b.offsetWidth; b.classList.add('secoue'); } }); if (qb) qb.classList.add('choisi'); }
      else if (c === 'h') {
        txt = tr('carte.h', { herbe: tr('herbe.' + carteEv.h) });
        if (moi && typeof carteEv.h === 'number') {
          if (!prog.herbes[carteEv.h]) { prog.herbes[carteEv.h] = true; sauverReglages(); setTimeout(() => toast(tr('carnet.nouvelle', { herbe: tr('herbe.' + carteEv.h) }), 3000), 500); }
        }
      } else txt = tr('carte.' + c);
      bande.annonce = (moi ? '' : qui + ' · ') + txt;
      if (!finTour) { bande.pd = apres.pd; bande.mk = apres.mk; bande.bo = apres.bo; }
    }
    lg.forEach((x) => {
      if (x.k === 'fievre') {
        bande.fin = 'fievre'; bande.n = x.n; bande.mk = 2; bande.pd = 0; bande.bo = 0;
        bande.annonce = moi ? tr('evt.fievre.toi', { n: x.n }) : tr('evt.fievre.autre', { qui: qui, n: x.n });
        setTimeout(sons.fievre, 300);
        if (moi) secouer();
      } else if (x.k === 'rentre') {
        bande.fin = 'rentre'; bande.n = x.n;
        bande.annonce = moi ? tr('evt.rentre.toi', { n: x.n }) : tr('evt.rentre.autre', { qui: qui, n: x.n });
        sons.rentrer();
        const p = $('place-' + s);
        envolCoeurs($('soins'), p, x.n);
        if (p && x.n > 0) { p.classList.remove('bond'); void p.offsetWidth; p.classList.add('bond'); }
      } else if (x.k === 'emeute') {
        bande.fin = 'emeute'; bande.n = x.n;
        bande.annonce = moi ? tr('evt.emeute.toi', { n: x.n, q: tr('quartier.' + x.q) }) : tr('evt.emeute.autre', { qui: qui, n: x.n, q: tr('quartier.' + x.q) });
        setTimeout(sons.emeute, 250);
        envolCoeurs($('soins'), $('place-' + s), x.n);
      } else if (x.k === 'remede') {
        bande.pd = apres.pd; bande.mk = apres.mk; bande.bo = apres.bo;
        bande.annonce = moi ? tr('evt.remede.toi', { r: tr('remede.' + x.r) }) : tr('evt.remede.autre', { qui: qui, r: tr('remede.' + x.r) });
        sons.remede();
        if (x.r === 2 && x.n > 0) { envolCoeurs($('soins'), $('place-' + s), x.n); const p = $('place-' + s); if (p) { p.classList.remove('bond'); void p.offsetWidth; p.classList.add('bond'); } }
      } else if (x.k === 'passe') {
        bande.fin = 'passe';
        bande.annonce = moi ? tr('evt.passe.toi') : tr('evt.passe.autre', { qui: qui });
      }
    });
    if (lg.some((x) => x.k === 'nuit')) annoncerNuit(lg);
    if (ev.auto) toast(tr(moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && R.aQui(vue) === partie.siege && avant.tour !== partie.siege) sons.tour();
    if (vue.q >= 0) curseur = vue.q;
    void avant;
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1300);
  }

  // Fin d'une manche en ligne : classement, puis le salon (même fenêtre).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = moi >= 0 && e.sc[moi] === Math.max.apply(null, e.sc);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(pts, total, gagne) {
    if (!gagne) return 0;
    const p = total ? pts / total : 0;
    return p >= 0.45 ? 3 : p >= 0.33 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3].sort((x, y) => e.sc[y] - e.sc[x] || x - y);
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      if (e.sc[s] !== prec) { rang = k + 1; prec = e.sc[s]; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64; masque(cv.getContext('2d'), s, masqueDe(s), 32, 32, 30);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = nomPlace(info, role) + ' · ' + tr('doc.' + s);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.viesCourt', { n: e.sc[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.sc[moi] : 0;
    const total = e.sc.reduce((a, b) => a + b, 0);
    const gagne = moi >= 0 && pts === Math.max.apply(null, e.sc);
    const egalite = gagne && e.sc.filter((x) => x === pts).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.vies', { n: pts, total: total }) : '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(pts, total, gagne);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      const masquesAvant = SEUILS_MASQUES.filter((x) => totalEtoiles() >= x).length;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (toutes les nuits gagnées, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else if (record) sauver(niveau, pts);
      const masquesApres = SEUILS_MASQUES.filter((x) => totalEtoiles() >= x).length;
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      let deb = '';
      if (gagne && niveau === NIVEAUX.length) deb = tr('fin.dernier');
      else if (debloque) deb = tr('fin.debloque', { n: niveau + 1 });
      if (masquesApres > masquesAvant) deb += (deb ? ' ' : '') + tr('fin.masque');
      if (!gagne) deb = tr('fin.conseil');
      $('fin-debloque').textContent = deb;
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (partie en ligne jouée sur l'appareil).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Pétales de victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    const coul = COUL.concat(['#f6ead0', '#9bd37f']);
    for (let i = 0; i < 80; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 70, vy: 100 + Math.random() * 140, r: Math.random() * 6, vr: (Math.random() - 0.5) * 6, coul: coul[i % coul.length], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt + Math.sin(t / 300 + b.k) * 0.6; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; ell(c, 0, 0, b.k / 2, b.k / 4.5); c.fill(); c.restore();
      });
      if (t - debut < 2800) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Gestes du joueur
  // ---------------------------------------------------------------------

  function refuser() {
    if (Date.now() - dernierAttends > 1500 && partie && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
  }

  function envoyer(action) {
    if (!partie || enPause || attenteTuto || !vue) return false;
    if (!partie.monTour()) { refuser(); return false; }
    if (!R.valide(vue, partie.siege, action)) { sons.non(); return false; }
    return partie.jouer(action);
  }

  function ouvrirDans(q) {
    if (!vue) return;
    if (vue.q >= 0 && q !== vue.q && partie && partie.monTour()) { toast(tr('tour.memeQuartier'), 1800); sons.non(); return; }
    envoyer({ t: 'o', q: q });
  }
  function ouvrirSuivante() {
    if (!vue) return;
    if (vue.q >= 0) envoyer({ t: 'o', q: vue.q });
    else if (clavier) envoyer({ t: 'o', q: curseur });
    else toast(tr('tour.toi'), 1600);
  }
  function rentrer() { envoyer({ t: 'r' }); }
  function jouerRemede(k) { envoyer({ t: 'm', k: k }); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux
  // ---------------------------------------------------------------------

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    bande = null;
    bandeau('');
    fermerVoile('voile-pause');
    fermerVoile('voile-fin');
    fermerVoile('voile-tuto');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  // Parcours solo : nuit n contre 3 robots médecins (force donnée par le niveau).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = null;
    bande = null;
    $('ville').textContent = '';
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: NIVEAUX[niveau - 1].fr, options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    $('ville').textContent = '';
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const grille = $('grille-niveaux');
    grille.textContent = '';
    NIVEAUX.forEach((_, i) => {
      const n = i + 1, ouvert = n <= prog.debloque;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
      b.append(num, et);
      b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
      else b.disabled = true;
      grille.appendChild(b);
    });
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
  }

  // Carnet : herbes rares trouvées et masques à porter.
  function ouvrirCarnet() {
    const gh = $('grille-herbes');
    gh.textContent = '';
    const trouvees = prog.herbes.filter(Boolean).length;
    $('carnet-compte').textContent = tr('carnet.compte', { n: trouvees, max: NB_HERBES });
    for (let k = 0; k < NB_HERBES; k++) {
      const ok = prog.herbes[k];
      const d = document.createElement('div');
      d.className = 'herbe' + (ok ? '' : ' inconnue');
      const cv = document.createElement('canvas'); cv.width = 104; cv.height = 104;
      herbe(cv.getContext('2d'), k, 52, 56, 44, !ok);
      const txt = document.createElement('div');
      const b = document.createElement('b'); b.textContent = ok ? tr('herbe.' + k) : tr('carnet.inconnue');
      const sp = document.createElement('span'); sp.textContent = ok ? tr('herbe.' + k + '.note') : tr('carnet.indice');
      txt.append(b, sp);
      d.append(cv, txt);
      gh.appendChild(d);
    }
    const gm = $('grille-masques');
    gm.textContent = '';
    for (let k = 0; k < SEUILS_MASQUES.length; k++) {
      const ok = masqueOuvert(k);
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'masque-choix' + (prog.masque === k ? ' porte' : '');
      const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128;
      masque(cv.getContext('2d'), 0, k, 64, 64, 60);
      const sp = document.createElement('span');
      sp.textContent = ok ? (prog.masque === k ? tr('carnet.porte') : tr('masque.' + k)) : tr('carnet.seuil', { n: SEUILS_MASQUES[k] });
      b.append(cv, sp);
      b.setAttribute('aria-label', tr('masque.' + k) + ' · ' + sp.textContent);
      b.disabled = !ok;
      if (ok) b.addEventListener('click', () => { audio(); sons.clic(); prog.masque = k; sauverReglages(); ouvrirCarnet(); });
      gm.appendChild(b);
    }
    afficherEcran('carnet');
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
    majBoutons();
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    relancerBoucle();
    majInterface();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés : une rue, des portes, la main qui montre le geste
  // ---------------------------------------------------------------------

  const DEMO = { W: 560, H: 360, porteX: (i) => 24 + i * 84, porteY: 128, pw: 70, ph: 96, banque: [468, 128, 76, 96] };
  function etatDemo(d) {
    return { ouvertes: [], coeurs: 0, banque: 0, mk: 0, bo: 0, rue: d.rue, voisins: d.voisins ? [0, 0] : null, ferme: false, fievre: -1, rem: (d.remedes || [0, 0, 0, 0]).slice(), nuit: -1, puits: 0, poison: false, feu: -1, envol: -1, herbe: -1 };
  }
  function appliquerDemo(st, pas, t) {
    const a = pas[0], v = pas[1];
    if (a === 'porte') {
      st.ouvertes.push({ c: v, t: t });
      st.coeurs += O.VAL[v] || 0;
      if (v === 'x') { st.rue = Math.max(0, st.rue - 1); if (st.bo) st.bo = 0; else { st.mk++; if (st.mk >= 2) { st.fievre = t; st.coeurs = 0; } } }
      if (v === 'r' && st.voisins) { st.voisins[0]++; st.voisins[1]++; }
      if (v === 'g') st.rue++;
      if (v === 'p') st.puits = 1;
      if (v === 'h') { st.herbe = t; st.rem[0]++; }
      if (v === 'e') { st.ferme = true; st.banque += st.coeurs; st.coeurs = 0; st.envol = t; }
    } else if (a === 'rentrer') { st.banque += st.coeurs; st.coeurs = 0; st.envol = t; }
    else if (a === 'remede') {
      st.rem[v] = Math.max(0, st.rem[v] - 1);
      if (v === 0) st.mk = Math.max(0, st.mk - 1);
      else if (v === 1) st.bo = 1;
      else if (v === 2) { st.banque += st.coeurs; st.coeurs = 0; st.envol = t; }
      else { st.rue = Math.max(0, st.rue - 2); st.feu = t; }
    } else if (a === 'nuit') {
      st.nuit = t;
      if (v === 'poison') { st.rue += 2; st.poison = true; }
      else if (v === 'sombre') st.rue += 2;
      else if (v === 'revolte') { st.rue += 1; st.ferme = true; }
    }
  }
  function cibleDemo(st, pas, d) {
    const a = pas[0];
    if (a === 'porte') return [DEMO.porteX(st.ouvertes.length) + DEMO.pw / 2, DEMO.porteY + DEMO.ph / 2];
    if (a === 'rentrer') return [DEMO.banque[0] + DEMO.banque[2] / 2, DEMO.banque[1] + DEMO.banque[3] / 2];
    if (a === 'remede') { const idx = remedesDemo(d).indexOf(pas[1]); return [316 + idx * 62 + 26, 296]; }
    return null;
  }
  function remedesDemo(d) { const r = []; (d.remedes || [0, 0, 0, 0]).forEach((n, k) => { if (n > 0) r.push(k); }); if (d === TUTOS.herbe) r.push(0); return r; }

  function dessinerDemo(c, d, st, t) {
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, DEMO.W, DEMO.H);
    c.fillStyle = '#2a2335'; c.fillRect(0, 0, DEMO.W, DEMO.H);
    // la rue (quartier) et ses marques
    quartier(c, 2, 20, 14, 190, 72, { ferme: st.ferme && !st.voisins, pu: st.puits && st.nuit < 0 ? 1 : 0 });
    for (let i = 0; i < Math.min(8, st.rue); i++) croix(c, 30 + i * 22, 100, 7);
    if (st.feu >= 0 && t - st.feu < 1400) {
      const p = (t - st.feu) / 1400;
      for (let i = 0; i < 6; i++) { c.fillStyle = 'rgba(240,138,36,' + (0.8 * (1 - p)).toFixed(2) + ')'; ell(c, 40 + i * 30, 96 - p * 30 - (i % 2) * 8, 8, 14 * (1 - p) + 2); c.fill(); }
    }
    if (st.voisins) {
      [0, 1].forEach((k) => {
        const x = 236 + k * 162;
        quartier(c, 3 + k, x, 14, 140, 60, {});
        for (let i = 0; i < Math.min(5, 1 + st.voisins[k]); i++) croix(c, x + 12 + i * 22, 92, 6);
        if (st.voisins[k]) { c.strokeStyle = '#ffd77a'; c.lineWidth = 3; c.setLineDash([6, 5]); c.beginPath(); c.moveTo(212, 50); c.lineTo(x + 6, 44); c.stroke(); c.setLineDash([]); }
      });
    }
    // les portes
    for (let i = 0; i < 5; i++) {
      const o = st.ouvertes[i];
      const x = DEMO.porteX(i), y = DEMO.porteY;
      if (!o) { carte(c, 'porte', x, y, DEMO.pw, DEMO.ph); continue; }
      const p = Math.min(1, (t - o.t) / 300);
      c.save(); c.translate(x + DEMO.pw / 2, 0); c.scale(Math.max(0.05, Math.abs(Math.cos(p * Math.PI))), 1); c.translate(-(x + DEMO.pw / 2), 0);
      carte(c, p < 0.5 ? 'porte' : o.c, x, y, DEMO.pw, DEMO.ph, 3);
      c.restore();
    }
    if (st.ferme) {
      c.fillStyle = '#7a5434'; c.strokeStyle = '#3a2312'; c.lineWidth = 2;
      [[0.3, -0.25], [0.6, 0.2]].forEach((p) => { c.save(); c.translate(24 + 420 * p[0], DEMO.porteY + 48); c.rotate(p[1]); c.fillRect(-150, -9, 300, 18); c.strokeRect(-150, -9, 300, 18); c.restore(); });
    }
    // la maison du médecin (« Rentrer ») et les vies sauvées
    const B = DEMO.banque;
    c.fillStyle = '#3e3550'; rr(c, B[0], B[1], B[2], B[3], 10); c.fill();
    c.strokeStyle = '#9bd37f'; c.lineWidth = 3; c.stroke();
    c.fillStyle = '#6b4a22'; c.beginPath(); c.moveTo(B[0] + 14, B[1] + 44); c.lineTo(B[0] + B[2] / 2, B[1] + 16); c.lineTo(B[0] + B[2] - 14, B[1] + 44); c.closePath(); c.fill();
    c.fillRect(B[0] + 20, B[1] + 44, B[2] - 40, 26);
    c.fillStyle = '#9bd37f'; c.beginPath(); c.moveTo(B[0] + B[2] / 2 - 8, B[1] + 82); c.lineTo(B[0] + B[2] / 2 + 8, B[1] + 82); c.lineTo(B[0] + B[2] / 2, B[1] + 92); c.fill();
    for (let i = 0; i < Math.min(9, st.banque); i++) coeur(c, B[0] + 14 + (i % 3) * 24, B[1] + B[3] + 18 + Math.floor(i / 3) * 16, 7);
    // soins du tour (cœurs), marques, vinaigre
    for (let i = 0; i < Math.min(9, st.coeurs); i++) coeur(c, 34 + i * 22, 254, 8);
    if (st.fievre >= 0 && t - st.fievre < 1600) { const p = (t - st.fievre) / 1600; c.fillStyle = 'rgba(179,52,43,' + (0.55 * (1 - p)).toFixed(2) + ')'; c.fillRect(0, 0, DEMO.W, DEMO.H); }
    for (let i = 0; i < 2; i++) {
      c.strokeStyle = i < st.mk ? '#ff8a7a' : '#8f849f'; c.lineWidth = 3; c.setLineDash(i < st.mk ? [] : [5, 4]);
      rond(c, 40 + i * 44, 300, 17); c.stroke(); c.setLineDash([]);
      if (i < st.mk) croix(c, 40 + i * 44, 300, 9);
    }
    if (st.bo) remede(c, 1, 140, 300, 18);
    // remèdes (une pastille par remède en main)
    remedesDemo(d).forEach((k, idx) => {
      const x = 316 + idx * 62, y = 270;
      c.fillStyle = '#3e3550'; rr(c, x, y, 52, 52, 10); c.fill(); c.strokeStyle = '#8a6436'; c.lineWidth = 2; c.stroke();
      c.globalAlpha = st.rem[k] > 0 ? 1 : 0.35; remede(c, k, x + 26, y + 26, 20); c.globalAlpha = 1;
      for (let j = 0; j < st.rem[k]; j++) { c.fillStyle = '#f2c86a'; rond(c, x + 46 - j * 9, y + 4, 4); c.fill(); }
    });
    if (st.herbe >= 0 && t - st.herbe < 1200) { const p = (t - st.herbe) / 1200; herbe(c, 3, 24 + 35 + p * 280, 176 + p * 110, 18, false); }
    // la nuit
    if (st.nuit >= 0) {
      const p = Math.min(1, (t - st.nuit) / 700);
      c.fillStyle = 'rgba(10,8,30,' + (0.55 * p).toFixed(2) + ')'; c.fillRect(0, 0, DEMO.W, DEMO.H);
      lune(c, 470, 40 + 30 * p, 22);
      if (st.poison) { c.fillStyle = '#7bd36a'; for (let i = 0; i < 5; i++) { rond(c, 160 + i * 8, 70 - ((t / 6 + i * 20) % 40), 3); c.fill(); } }
    }
  }

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    let st = etatDemo(d), debut = 0, fait = 0;
    const PAS = 1350, j = ++tutoAnim;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ecoule = t - debut;
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      if (k >= d.etapes.length + 2) { st = etatDemo(d); fait = 0; debut = t; }
      else if (k >= fait && fait < d.etapes.length) {
        const pas = d.etapes[fait];
        const moment = pas[0] === 'nuit' ? 300 : 760;
        if (dans >= moment) { appliquerDemo(st, pas, t); fait++; }
      }
      dessinerDemo(c, d, st, t);
      // la main se dirige vers le prochain geste
      const prochaine = fait < d.etapes.length ? d.etapes[fait] : null;
      const cible = prochaine ? cibleDemo(st, prochaine, d) : null;
      if (cible) {
        const q = Math.min(1, dans / 650);
        const x = 520 + (cible[0] - 520) * q, y = 345 + (cible[1] - 345) * q;
        main(c, x, y, 1.5, q >= 1 ? Math.min(1, (dans - 650) / 110) : 0);
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = (ev) => { if (ev.target === $('voile-tuto')) { audio(); fermer(); } };
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#2b1d10'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Clavier
  // ---------------------------------------------------------------------

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif') || !vue) return;
    const dirs = { ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1 };
    if (dirs[ev.code] !== undefined) {
      ev.preventDefault(); audio();
      if (vue.q >= 0) return;
      clavier = true;
      for (let i = 1; i <= vue.Q; i++) {
        const q = (curseur + dirs[ev.code] * i + vue.Q * 4) % vue.Q;
        if (O.ouvrable(vue, q)) { curseur = q; break; }
      }
      sons.clic();
      majVille();
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (vue.q < 0 && !clavier) { clavier = true; if (!O.ouvrable(vue, curseur)) { for (let q = 0; q < vue.Q; q++) if (O.ouvrable(vue, q)) { curseur = q; break; } } majVille(); return; }
      if (partie && partie.monTour() && R.valide(vue, partie.siege, { t: 'p' })) { envoyer({ t: 'p' }); return; }
      ouvrirSuivante();
    } else if (ev.code === 'KeyR' || ev.code === 'Backspace') {
      ev.preventDefault(); audio(); rentrer();
    } else if (/^(Digit|Numpad)[1-4]$/.test(ev.code)) {
      ev.preventDefault(); audio(); jouerRemede(Number(ev.code.slice(-1)) - 1);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-carnet').addEventListener('click', () => { audio(); sons.clic(); ouvrirCarnet(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('carnet-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-ouvrir').addEventListener('click', () => { audio(); ouvrirSuivante(); });
  $('btn-rentrer').addEventListener('click', () => { audio(); rentrer(); });
  $('btn-passer').addEventListener('click', () => { audio(); envoyer({ t: 'p' }); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(performance.now()); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  relancerBoucle();
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
