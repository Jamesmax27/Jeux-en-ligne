<script>
(function () {
  'use strict';

  // =====================================================================
  //  Les planètes qui chantent — jeu de musique et de logique
  //  Chaque planète chante sa note en passant sur le rayon du soleil.
  //  On retrouve une mélodie en posant les planètes sur les bonnes orbites.
  // =====================================================================

  const JEU = 'planetes-qui-chantent';
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);

  // ---------------------------------------------------------------------
  //  Données du jeu
  // ---------------------------------------------------------------------

  const ESSAIS = 6;                       // essais (« Tester ») par niveau
  const PERIODES = [0, 2, 4, 8, 16];      // temps pour un tour, orbites 1 à 4
  const PISTE = 5;                        // piste des comètes (8 places)
  const NOTE_LUNE = 6, NOTE_DING = 7;
  const NOTES_HZ = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25]; // do ré mi sol la do
  const RAYON_PISTE = 188;                // rayon logique de la piste des comètes

  // Objets des solutions : planète (couleur = note, orbite, place, lune ?) ou comète (place)
  function P(c, o, s, lune) { return { type: 'planete', c: c, o: o, s: s, lune: !!lune }; }
  function C(s) { return { type: 'comete', c: NOTE_DING, o: PISTE, s: s, lune: false }; }

  // Chaque niveau est décrit par sa SOLUTION : la mélodie à retrouver en est calculée.
  // L : temps de la boucle ; orb : orbites ouvertes ; bloc : places bloquées par des astéroïdes
  // rayons : 1 ou 2 ; voix2 : le 2e rayon chante la voix basse ; tuto : carte de nouveauté
  const TOUT = 'tout';
  const NIVEAUX = [
    // Galaxie 1 — Jardin d'étoiles
    { L: 8, orb: [1, 3], sol: [P(0, 1, 0)], tuto: 'base' },
    { L: 8, orb: [1, 3], sol: [P(0, 3, 0), P(2, 1, 1)], tuto: 'places' },
    { L: 8, orb: [1, 2, 3], sol: [P(0, 3, 0), P(3, 2, 2), P(2, 1, 1)], tuto: 'moyenne' },
    { L: 8, orb: [1, 2, 3], sol: [P(4, 2, 0), P(1, 3, 3), P(5, 3, 6)] },
    { L: 8, orb: [1, 2, 3], sol: [P(0, 3, 0), P(2, 3, 2), P(3, 3, 4), P(5, 3, 6), P(4, 2, 3)] },
    // Galaxie 2 — Nébuleuse rose
    { L: 8, orb: [1, 2, 3], sol: [P(0, 2, 0, true), P(2, 3, 3), P(3, 3, 6)], tuto: 'lune' },
    { L: 8, orb: [1, 2, 3], sol: [P(4, 1, 0, true), P(5, 3, 5), P(1, 2, 2)] },
    { L: 16, orb: [2, 3, 4], sol: [P(0, 4, 0), P(2, 4, 6), P(3, 3, 4), P(4, 2, 2)], tuto: 'long' },
    { L: 16, orb: [1, 2, 3, 4], sol: [P(5, 3, 0, true), P(0, 4, 3), P(1, 4, 11), P(3, 2, 2), P(2, 4, 14)] },
    { L: 16, orb: [1, 2, 3, 4], sol: [P(4, 2, 0, true), P(0, 4, 2), P(2, 4, 10), P(3, 3, 7)] },
    // Galaxie 3 — Amas bleu
    { L: 8, orb: [1, 2, 3], sol: [P(0, 2, 0), P(2, 3, 2), P(3, 3, 6), C(5)], tuto: 'comete' },
    { L: 8, orb: [1, 2, 3], sol: [P(1, 3, 0, true), P(4, 2, 2), P(5, 3, 3), C(4), C(7)] },
    { L: 8, orb: [1, 2, 3], bloc: { 2: [0, 2] }, sol: [P(2, 3, 0), P(2, 3, 4), P(0, 2, 1), P(4, 3, 6)], tuto: 'asteroides' },
    { L: 16, orb: [1, 2, 3, 4], bloc: { 1: TOUT, 3: [0, 4] }, sol: [P(3, 4, 0), P(3, 4, 8), P(0, 2, 1), P(5, 4, 11), C(3), C(7)] },
    { L: 16, orb: [1, 2, 3, 4], bloc: { 3: [3, 7] }, sol: [P(4, 3, 2, true), P(1, 4, 0), P(2, 2, 1), P(0, 4, 7), P(0, 4, 15), C(3), C(6)] },
    // Galaxie 4 — Trou noir doux
    { L: 8, orb: [1, 2, 3], rayons: 2, sol: [P(0, 3, 0), P(2, 2, 1), P(3, 3, 2)], tuto: 'rayons' },
    { L: 8, orb: [1, 2, 3], rayons: 2, sol: [P(5, 3, 1, true), P(4, 3, 0), P(1, 3, 3)] },
    { L: 16, orb: [2, 3, 4], rayons: 2, voix2: true, sol: [P(0, 4, 0), P(3, 3, 2), P(2, 4, 4), P(4, 2, 1)], tuto: 'voix' },
    { L: 16, orb: [1, 2, 3, 4], rayons: 2, voix2: true, bloc: { 2: TOUT }, sol: [P(1, 3, 0, true), P(5, 4, 6), P(0, 4, 10), P(3, 4, 15), C(2)] },
    { L: 16, orb: [1, 2, 3, 4], rayons: 2, voix2: true, bloc: { 3: [2, 6] }, sol: [P(3, 3, 0, true), P(2, 4, 2), P(0, 4, 6), P(0, 4, 14), P(5, 4, 11), C(5)] }
  ];
  window.JEL_NIVEAUX = NIVEAUX.length;

  const GALAXIES = [
    { haut: '#0b0f30', bas: '#22175a', deco: 'voie', accent: '#ffe27a' },
    { haut: '#1c0a2c', bas: '#4c1748', deco: 'nebuleuse', accent: '#ffb3e0' },
    { haut: '#04122c', bas: '#0e3263', deco: 'amas', accent: '#9fe3ff' },
    { haut: '#06050e', bas: '#1d1033', deco: 'trou', accent: '#ffc38a' }
  ];

  // Récompenses de l'atelier (débloquées selon le total d'étoiles)
  const ANNEAUX = [
    { id: 'aucun', min: 0 }, { id: 'simple', min: 0 }, { id: 'double', min: 3 },
    { id: 'etoiles', min: 12 }, { id: 'arcenciel', min: 24 }, { id: 'cristal', min: 50 }
  ];
  const PALETTES = [
    { id: 'classique', min: 0, c: ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7', '#c09bff'] },
    { id: 'pastel', min: 6, c: ['#ffadc0', '#ffd3a1', '#fff1a6', '#b9f5b5', '#a8d4ff', '#dcc1ff'] },
    { id: 'bonbons', min: 18, c: ['#ff4f9a', '#ff8c42', '#ffe14d', '#3ddc97', '#38b6ff', '#a066ff'] },
    { id: 'aurore', min: 30, c: ['#ff7a9c', '#ffb36b', '#f6f37a', '#6ff0c0', '#62c4ff', '#c58cff'] },
    { id: 'givre', min: 42, c: ['#f7a3c4', '#f8c690', '#efe9a0', '#9eeedc', '#98d6ff', '#c6b3ff'] }
  ];

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = {
    etoiles: NIVEAUX.map(() => 0),
    records: NIVEAUX.map(() => 0),
    debloque: 1,
    niveau: 1,
    options: { son: true, anneau: 'simple', palette: 'classique' }
  };
  const vusTutos = {};

  function entier(x, min, max, def) { x = Math.round(Number(x)); return Number.isFinite(x) ? Math.max(min, Math.min(max, x)) : def; }

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE ? window.JEL_SAVE.load(JEU) : null; } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 9999, 0));
      prog.niveau = entier(d.niveau, 1, NIVEAUX.length, 1);
      prog.debloque = Math.max(entier(d.debloque, 1, NIVEAUX.length, 1), prog.niveau);
      if (d.options && typeof d.options === 'object') lireOptions(d.options);
    }
    // Préférences gardées à part (jeu ouvert seul) : son, anneau, couleurs
    try { const s = localStorage.getItem('pqc-options'); if (s) lireOptions(JSON.parse(s)); } catch (e) { /* stockage refusé */ }
    // Un niveau réussi débloque le suivant
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
  }
  function lireOptions(o) {
    if (!o || typeof o !== 'object') return;
    if (typeof o.son === 'boolean') prog.options.son = o.son;
    if (ANNEAUX.some((a) => a.id === o.anneau)) prog.options.anneau = o.anneau;
    if (PALETTES.some((p) => p.id === o.palette)) prog.options.palette = o.palette;
  }
  function totalEtoiles() { return prog.etoiles.reduce((a, b) => a + b, 0); }
  function scoreTotal() { return prog.records.reduce((a, b) => a + b, 0); }

  // Sauvegarde complète (fin de niveau, fermeture pendant une partie)
  function sauver(niveauReprise) {
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: scoreTotal(), etoiles: prog.etoiles.slice(), records: prog.records.slice(),
        debloque: prog.debloque, options: Object.assign({}, prog.options)
      });
    } catch (e) { /* sans stockage : la partie continue */ }
  }
  // Réglages changés hors partie : jamais de nouvelle sauvegarde depuis l'écran titre
  function sauverOptions() {
    try { localStorage.setItem('pqc-options', JSON.stringify(prog.options)); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE && window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: Object.assign({}, prog.options) }); } catch (e) { /* rien */ }
  }

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier)
  // ---------------------------------------------------------------------

  let ac = null, maitre = null;
  function audio() {
    if (!ac) {
      try {
        const A = window.AudioContext || window.webkitAudioContext;
        if (A) { ac = new A(); maitre = ac.createGain(); maitre.gain.value = 0.55; maitre.connect(ac.destination); }
      } catch (e) { ac = null; }
    }
    if (ac && ac.state === 'suspended' && !etat.pause) { try { ac.resume(); } catch (e) { /* rien */ } }
    return ac;
  }
  function osc(f, debut, duree, type, vol, f2) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, debut);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, debut + duree);
    g.gain.setValueAtTime(0.0001, debut);
    g.gain.exponentialRampToValueAtTime(vol, debut + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, debut + duree);
    o.connect(g); g.connect(maitre); o.start(debut); o.stop(debut + duree + 0.05);
  }
  function son(fn) {
    if (!prog.options.son || etat.pause) return;
    const a = audio(); if (!a) return;
    try { fn(a.currentTime + 0.01); } catch (e) { /* son impossible */ }
  }
  // Note d'une planète, d'une lune ou d'une comète ; voix basse = une octave plus bas
  function jouerNote(note, voix) {
    son((t0) => {
      const bas = voix ? 0.5 : 1;
      if (note <= 5) {
        const f = NOTES_HZ[note] * bas;
        osc(f, t0, 0.6, voix ? 'triangle' : 'sine', 0.3);
        osc(f * 2, t0, 0.32, 'sine', 0.05);
      } else if (note === NOTE_LUNE) {
        const f = 783.99 * bas;
        osc(f, t0, 0.4, 'sine', 0.18, f * 1.01);
        osc(f * 3, t0, 0.15, 'sine', 0.03);
      } else {
        const f = 1046.5 * bas;
        osc(f, t0, 0.9, 'sine', 0.16); osc(f * 2.76, t0, 0.5, 'sine', 0.05); osc(f * 5.4, t0, 0.25, 'sine', 0.025);
      }
    });
  }
  const sons = {
    clic: () => son((t) => osc(660, t, 0.08, 'triangle', 0.12)),
    prendre: () => son((t) => osc(440, t, 0.12, 'sine', 0.14, 700)),
    poser: () => son((t) => { osc(700, t, 0.1, 'sine', 0.14, 520); osc(1040, t + 0.05, 0.12, 'sine', 0.06); }),
    refus: () => son((t) => osc(200, t, 0.18, 'square', 0.05, 150)),
    faux: () => son((t) => { osc(330, t, 0.25, 'triangle', 0.14, 247); osc(247, t + 0.2, 0.35, 'triangle', 0.12, 196); }),
    victoire: () => son((t) => { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => osc(f, t + i * 0.11, 0.45, 'sine', 0.16)); }),
    defaite: () => son((t) => { [392, 349.2, 311.1, 261.6].forEach((f, i) => osc(f, t + i * 0.18, 0.4, 'triangle', 0.12)); }),
    etoile: (i) => son((t) => osc(880 + i * 220, t, 0.3, 'sine', 0.12))
  };

  // ---------------------------------------------------------------------
  //  Calcul des notes : qui chante, quand, avec quelle voix
  // ---------------------------------------------------------------------

  function periode(o, niv) { return o === PISTE ? niv.L : PERIODES[o]; }
  function nbPlaces(o, niv) { return o === PISTE ? 8 : PERIODES[o]; }
  function bloque(niv, o, s) {
    const b = niv.bloc && niv.bloc[o];
    return !!b && (b === TOUT || b.indexOf(s) >= 0);
  }
  // Renvoie une Map « temps:note:voix » → { t, note, voix, obj, rayon, lune }
  function evenements(objs, niv) {
    const ev = new Map();
    const ajouter = (t, note, voix, obj, rayon, lune) => {
      t = ((t % niv.L) + niv.L) % niv.L;
      const cle = t + ':' + note + ':' + voix;
      if (!ev.has(cle)) ev.set(cle, { t: t, note: note, voix: voix, obj: obj, rayon: rayon, lune: lune });
    };
    objs.forEach((o) => {
      if (o.o == null) return;
      const per = periode(o.o, niv);
      const debut = o.o === PISTE ? o.s * niv.L / 8 : o.s;
      const decalages = niv.rayons === 2 ? [0, per / 2] : [0];
      decalages.forEach((dec, r) => {
        const voix = r === 1 && niv.voix2 ? 1 : 0;
        for (let t = debut + dec; t < debut + dec + niv.L; t += per) {
          ajouter(t, o.c, voix, o, r, false);
          if (o.lune) ajouter(t + 1, NOTE_LUNE, voix, o, r, true);
        }
      });
    });
    return ev;
  }

  // ---------------------------------------------------------------------
  //  État
  // ---------------------------------------------------------------------

  const etat = {
    ecran: 'titre', n: 0, objs: [], cible: new Map(), produits: null,
    mode: 'pose',            // pose | ecoute | test | fini
    t: 0, tests: 0, res: null, lueurs: {}, soleil: 0,
    drag: null, sel: null, tenu: null, fantomes: null,
    pause: false, enPartie: false, tutoMain: null, tutoCarte: null,
    secousse: 0, particules: [], juke: null
  };
  let tempsAnim = 0;

  // ---------------------------------------------------------------------
  //  Couleurs et dessins
  // ---------------------------------------------------------------------

  function palette() { return (PALETTES.find((p) => p.id === prog.options.palette) || PALETTES[0]).c; }
  function couleur(c) { return c <= 5 ? palette()[c] : (c === NOTE_LUNE ? '#e6e9f7' : '#bff4ff'); }
  function melange(hex, vers, f) {
    const a = parseInt(hex.slice(1), 16), b = parseInt(vers.slice(1), 16);
    const m = (s) => Math.round(((a >> s) & 255) * (1 - f) + ((b >> s) & 255) * f);
    return 'rgb(' + m(16) + ',' + m(8) + ',' + m(0) + ')';
  }
  function cercle(g, x, y, r) { g.beginPath(); g.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); }
  function rectArrondi(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function etoile(g, x, y, r, branches, creux) {
    g.beginPath();
    for (let i = 0; i < branches * 2; i++) {
      const a = -Math.PI / 2 + i * Math.PI / branches, rr = i % 2 ? r * (creux || 0.45) : r;
      g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    g.closePath();
  }

  // Anneau d'une planète : moitié arrière (dessinée avant la planète) ou avant
  function dessinerAnneau(g, x, y, r, style, col, partie) {
    if (style === 'aucun') return;
    const debut = partie === 'arriere' ? Math.PI : 0, fin = partie === 'arriere' ? Math.PI * 2 : Math.PI;
    g.save(); g.translate(x, y); g.rotate(-0.35);
    const ellipse = (rx, ry, w, c) => { g.beginPath(); g.ellipse(0, 0, rx, ry, 0, debut, fin); g.lineWidth = w; g.strokeStyle = c; g.stroke(); };
    if (style === 'simple') ellipse(r * 1.75, r * 0.5, Math.max(1.5, r * 0.22), melange(col, '#ffffff', 0.55));
    else if (style === 'double') { ellipse(r * 1.6, r * 0.45, Math.max(1, r * 0.12), '#fff3c4'); ellipse(r * 2, r * 0.6, Math.max(1, r * 0.12), melange(col, '#ffffff', 0.4)); }
    else if (style === 'arcenciel') { ['#ff8a8a', '#ffe27a', '#8ad8ff'].forEach((c, i) => ellipse(r * (1.55 + i * 0.2), r * (0.42 + i * 0.07), Math.max(1, r * 0.1), c)); }
    else if (style === 'cristal') {
      ellipse(r * 1.85, r * 0.55, Math.max(1.5, r * 0.18), 'rgba(190,240,255,0.85)');
      for (let i = 0; i < 6; i++) {
        const a = debut + (i + 0.5) * (fin - debut) / 6 + tempsAnim * 0.6;
        g.fillStyle = '#ffffff'; etoile(g, Math.cos(a) * r * 1.85, Math.sin(a) * r * 0.55, r * 0.2, 4, 0.35); g.fill();
      }
    } else if (style === 'etoiles') {
      ellipse(r * 1.8, r * 0.52, Math.max(1, r * 0.08), 'rgba(255,240,180,0.6)');
      for (let i = 0; i < 5; i++) {
        const a = debut + (i + 0.5) * (fin - debut) / 5;
        g.fillStyle = '#ffe27a'; etoile(g, Math.cos(a) * r * 1.8, Math.sin(a) * r * 0.52, r * 0.24, 5); g.fill();
      }
    }
    g.restore();
  }

  // Planète avec un petit visage (bouche ouverte quand elle chante)
  function dessinerPlanete(g, x, y, r, c, o) {
    o = o || {};
    const col = couleur(c);
    const ch = o.chante || 0;
    const rr = r * (1 + 0.25 * ch);
    const anneau = o.anneau || prog.options.anneau;
    g.save();
    if (o.alpha != null) g.globalAlpha = o.alpha;
    if (ch > 0) {
      const halo = g.createRadialGradient(x, y, rr * 0.5, x, y, rr * 2.6);
      halo.addColorStop(0, melange(col, '#ffffff', 0.3)); halo.addColorStop(1, 'rgba(255,255,255,0)');
      g.globalAlpha = (o.alpha != null ? o.alpha : 1) * ch * 0.75; g.fillStyle = halo; cercle(g, x, y, rr * 2.6); g.fill();
      g.globalAlpha = o.alpha != null ? o.alpha : 1;
    }
    dessinerAnneau(g, x, y, rr, anneau, col, 'arriere');
    const grad = g.createRadialGradient(x - rr * 0.35, y - rr * 0.4, rr * 0.1, x, y, rr);
    grad.addColorStop(0, melange(col, '#ffffff', 0.45)); grad.addColorStop(0.7, col); grad.addColorStop(1, melange(col, '#1a1040', 0.35));
    g.fillStyle = grad; cercle(g, x, y, rr); g.fill();
    // motif selon la note (aide à distinguer les couleurs proches)
    g.save(); cercle(g, x, y, rr); g.clip();
    if (c === 1 || c === 4) { g.fillStyle = 'rgba(255,255,255,0.22)'; g.fillRect(x - rr, y + rr * 0.25, rr * 2, rr * 0.28); }
    if (c === 2 || c === 5) { g.fillStyle = 'rgba(40,20,70,0.18)'; cercle(g, x + rr * 0.45, y + rr * 0.45, rr * 0.22); g.fill(); cercle(g, x - rr * 0.55, y + rr * 0.15, rr * 0.13); g.fill(); }
    g.restore();
    // visage
    g.fillStyle = '#2a1840';
    cercle(g, x - rr * 0.32, y - rr * 0.12, rr * 0.11); g.fill();
    cercle(g, x + rr * 0.32, y - rr * 0.12, rr * 0.11); g.fill();
    g.fillStyle = 'rgba(255,120,150,0.45)';
    cercle(g, x - rr * 0.55, y + rr * 0.15, rr * 0.13); g.fill(); cercle(g, x + rr * 0.55, y + rr * 0.15, rr * 0.13); g.fill();
    g.strokeStyle = '#2a1840'; g.lineWidth = Math.max(1, rr * 0.09); g.lineCap = 'round';
    if (ch > 0.15) { g.fillStyle = '#2a1840'; g.beginPath(); g.ellipse(x, y + rr * 0.3, rr * 0.16, rr * 0.2 * (0.6 + ch), 0, 0, Math.PI * 2); g.fill(); }
    else { g.beginPath(); g.arc(x, y + rr * 0.12, rr * 0.25, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke(); }
    dessinerAnneau(g, x, y, rr, anneau, col, 'avant');
    // lune
    if (o.lune) {
      const a = o.angleLune != null ? o.angleLune : tempsAnim * 2;
      const lx = x + Math.cos(a) * rr * 1.75, ly = y + Math.sin(a) * rr * 1.75, lc = o.luneChante || 0;
      if (lc > 0) { g.globalAlpha = lc * 0.7; g.fillStyle = '#ffffff'; cercle(g, lx, ly, rr * 0.7); g.fill(); g.globalAlpha = o.alpha != null ? o.alpha : 1; }
      g.fillStyle = '#e6e9f7'; cercle(g, lx, ly, rr * 0.38 * (1 + lc * 0.3)); g.fill();
      g.fillStyle = 'rgba(120,130,170,0.5)'; cercle(g, lx + rr * 0.1, ly - rr * 0.05, rr * 0.1); g.fill();
    }
    g.restore();
  }

  // Comète : tête glacée et queue opposée au mouvement
  function dessinerComete(g, x, y, r, angleMvt, o) {
    o = o || {};
    const ch = o.chante || 0;
    g.save();
    if (o.alpha != null) g.globalAlpha = o.alpha;
    const qx = -Math.cos(angleMvt), qy = -Math.sin(angleMvt);
    const px = -qy, py = qx;
    const grad = g.createLinearGradient(x, y, x + qx * r * 4, y + qy * r * 4);
    grad.addColorStop(0, 'rgba(190,245,255,0.9)'); grad.addColorStop(1, 'rgba(190,245,255,0)');
    g.fillStyle = grad; g.beginPath();
    g.moveTo(x + px * r * 0.8, y + py * r * 0.8); g.lineTo(x + qx * r * 4.2, y + qy * r * 4.2); g.lineTo(x - px * r * 0.8, y - py * r * 0.8); g.closePath(); g.fill();
    if (ch > 0) { g.fillStyle = 'rgba(255,255,255,' + (ch * 0.6) + ')'; etoile(g, x, y, r * (1.6 + ch), 4, 0.25); g.fill(); }
    const tete = g.createRadialGradient(x - r * 0.3, y - r * 0.3, 1, x, y, r);
    tete.addColorStop(0, '#ffffff'); tete.addColorStop(1, '#8fe3ff');
    g.fillStyle = tete; cercle(g, x, y, r * (1 + ch * 0.3)); g.fill();
    g.fillStyle = '#20406a'; cercle(g, x - r * 0.3, y - r * 0.1, r * 0.13); g.fill(); cercle(g, x + r * 0.3, y - r * 0.1, r * 0.13); g.fill();
    g.restore();
  }

  // Soleil souriant
  function dessinerSoleil(g, x, y, r, pulse, couleurPulse) {
    g.save();
    const halo = g.createRadialGradient(x, y, r * 0.6, x, y, r * (2.4 + pulse));
    halo.addColorStop(0, 'rgba(255,215,110,0.55)'); halo.addColorStop(1, 'rgba(255,200,90,0)');
    g.fillStyle = halo; cercle(g, x, y, r * (2.4 + pulse)); g.fill();
    if (pulse > 0 && couleurPulse) { g.globalAlpha = pulse * 0.6; g.fillStyle = couleurPulse; cercle(g, x, y, r * (1.5 + pulse * 0.6)); g.fill(); g.globalAlpha = 1; }
    g.fillStyle = '#ffcf4a';
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6 + tempsAnim * 0.25;
      g.beginPath();
      g.moveTo(x + Math.cos(a - 0.14) * r * 1.02, y + Math.sin(a - 0.14) * r * 1.02);
      g.lineTo(x + Math.cos(a) * r * (1.38 + pulse * 0.2), y + Math.sin(a) * r * (1.38 + pulse * 0.2));
      g.lineTo(x + Math.cos(a + 0.14) * r * 1.02, y + Math.sin(a + 0.14) * r * 1.02);
      g.fill();
    }
    const grad = g.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
    grad.addColorStop(0, '#fff6c2'); grad.addColorStop(0.6, '#ffd54a'); grad.addColorStop(1, '#ffa530');
    g.fillStyle = grad; cercle(g, x, y, r); g.fill();
    g.strokeStyle = '#8a4b10'; g.lineWidth = Math.max(1.2, r * 0.08); g.lineCap = 'round';
    g.beginPath(); g.arc(x - r * 0.35, y - r * 0.1, r * 0.16, 1.15 * Math.PI, 1.85 * Math.PI); g.stroke();
    g.beginPath(); g.arc(x + r * 0.35, y - r * 0.1, r * 0.16, 1.15 * Math.PI, 1.85 * Math.PI); g.stroke();
    g.beginPath(); g.arc(x, y + r * 0.12, r * 0.35 + pulse * r * 0.05, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
    g.fillStyle = 'rgba(255,120,90,0.4)'; cercle(g, x - r * 0.6, y + r * 0.2, r * 0.15); g.fill(); cercle(g, x + r * 0.6, y + r * 0.2, r * 0.15); g.fill();
    g.restore();
  }

  // Rayon lumineux du soleil (vers le haut ou vers le bas)
  function dessinerRayon(g, x, y, longueur, largeur, bas, bleu, eclat) {
    g.save();
    const fin = bas ? y + longueur : y - longueur;
    const grad = g.createLinearGradient(x, y, x, fin);
    const c = bleu ? '120,190,255' : '255,225,120';
    grad.addColorStop(0, 'rgba(' + c + ',' + (0.6 + eclat * 0.35) + ')');
    grad.addColorStop(1, 'rgba(' + c + ',0.05)');
    g.fillStyle = grad;
    const w = largeur * (1 + eclat * 0.5);
    g.beginPath(); g.moveTo(x - w * 0.35, y); g.lineTo(x - w * 0.5, fin); g.lineTo(x + w * 0.5, fin); g.lineTo(x + w * 0.35, y); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,' + (0.35 + eclat * 0.4) + ')';
    g.fillRect(x - 1, Math.min(y, fin), 2, longueur);
    g.restore();
  }

  function dessinerCaillou(g, x, y, r, graine) {
    g.save(); g.translate(x, y); g.rotate(graine * 2.1);
    g.fillStyle = graine % 2 ? '#8d7b6a' : '#a3907c'; g.strokeStyle = '#4e4036'; g.lineWidth = 1.2;
    g.beginPath();
    for (let i = 0; i < 7; i++) {
      const a = i / 7 * Math.PI * 2, rr = r * (0.75 + 0.3 * Math.abs(Math.sin(graine * 3.7 + i * 1.9)));
      g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    g.closePath(); g.fill(); g.stroke();
    g.fillStyle = 'rgba(60,45,35,0.4)'; cercle(g, r * 0.2, -r * 0.15, r * 0.22); g.fill();
    g.restore();
  }

  // Petite main de tutoriel (bout du doigt en x, y)
  function dessinerMain(g, x, y, s, appui) {
    g.save(); g.translate(x, y); g.scale(s * (appui ? 0.88 : 1), s * (appui ? 0.88 : 1)); g.rotate(-0.35);
    g.fillStyle = '#ffffff'; g.strokeStyle = '#3a2470'; g.lineWidth = 2.2; g.lineJoin = 'round';
    rectArrondi(g, -10, 18, 30, 26, 10); g.fill(); g.stroke();
    rectArrondi(g, -6, 0, 12, 30, 6); g.fill(); g.stroke();
    g.fillStyle = '#ffffff'; g.fillRect(-4.5, 20, 9, 8);
    if (appui) { g.strokeStyle = '#ffe27a'; g.lineWidth = 3; cercle(g, 0, 0, 14); g.stroke(); }
    g.restore();
  }

  // Note de musique dessinée (forme, pas de texte)
  function dessinerNoteMusique(g, x, y, r, col) {
    g.save(); g.fillStyle = col; g.strokeStyle = col; g.lineWidth = r * 0.3;
    g.beginPath(); g.ellipse(x, y, r * 0.65, r * 0.48, -0.4, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.moveTo(x + r * 0.55, y - r * 0.1); g.lineTo(x + r * 0.55, y - r * 1.9); g.quadraticCurveTo(x + r * 1.3, y - r * 1.5, x + r * 1.2, y - r * 1.0); g.stroke();
    g.restore();
  }

  // Partition : une ou deux lignes, un point par note (hauteur = note)
  function dessinerPartition(g, x0, y0, w, h, L, voix2, cible, o) {
    o = o || {};
    g.save();
    rectArrondi(g, x0, y0, w, h, 12); g.fillStyle = 'rgba(8,10,36,0.93)'; g.fill();
    g.strokeStyle = 'rgba(170,175,255,0.45)'; g.lineWidth = 1.5; g.stroke();
    const bandes = voix2 ? 2 : 1, ecart = 5, marge = 5;
    const bh = (h - marge * 2 - (bandes - 1) * ecart) / bandes;
    const cw = (w - marge * 2) / L;
    const rp = Math.max(2.5, Math.min(cw * 0.32, bh / 9, 8));
    const rangH = (bh - rp * 2 - 2) / 7;
    const xs = (t) => x0 + marge + (t + 0.5) * cw;
    // note 0 (grave) en bas, comète (aiguë) en haut ; les points restent dans leur ligne
    const ys = (note, voix) => y0 + marge + voix * (bh + ecart) + rp + 1 + (7 - note) * rangH;
    for (let b = 0; b < bandes; b++) {
      const by = y0 + marge + b * (bh + ecart);
      g.fillStyle = b === 1 ? 'rgba(90,150,255,0.13)' : 'rgba(255,220,120,0.07)';
      g.fillRect(x0 + marge, by, w - marge * 2, bh);
      for (let i = 0; i <= L; i++) {
        g.fillStyle = i % 4 === 0 ? 'rgba(255,255,255,0.28)' : 'rgba(255,255,255,0.09)';
        g.fillRect(x0 + marge + i * cw - 0.5, by, 1, bh);
      }
    }
    // curseur de lecture
    if (o.t != null && o.t > -0.5 && o.t < L) {
      const cx = x0 + marge + (o.t + 0.5) * cw;
      g.fillStyle = 'rgba(255,240,170,0.75)'; g.fillRect(cx - 1.5, y0 + 3, 3, h - 6);
    }
    const point = (ev, style) => {
      const x = xs(ev.t), y = ys(ev.note, ev.voix);
      const col = couleur(ev.note);
      if (style === 'plein' || style === 'lueur') {
        const r = rp * (style === 'lueur' ? 1.5 : 1);
        if (style === 'lueur') { g.fillStyle = 'rgba(255,255,255,0.35)'; cercle(g, x, y, r * 1.6); g.fill(); }
        g.fillStyle = col;
        if (ev.note === NOTE_DING) { etoile(g, x, y, r * 1.25, 4, 0.4); g.fill(); }
        else { cercle(g, x, y, r); g.fill(); }
        if (ev.note === NOTE_LUNE) { g.fillStyle = 'rgba(8,10,36,0.85)'; cercle(g, x + r * 0.45, y - r * 0.3, r * 0.75); g.fill(); }
      } else if (style === 'fantome') {
        g.strokeStyle = '#ffffff'; g.lineWidth = 2; g.setLineDash([3, 2]); cercle(g, x, y, rp + 3); g.stroke(); g.setLineDash([]);
      } else if (style === 'juste') {
        g.strokeStyle = '#6dff9e'; g.lineWidth = 2.5; cercle(g, x, y, rp + 3); g.stroke();
      } else if (style === 'faux') {
        g.fillStyle = col; g.globalAlpha = 0.85; cercle(g, x, y, rp * 0.9); g.fill(); g.globalAlpha = 1;
        g.strokeStyle = '#ff5d5d'; g.lineWidth = 2.5; cercle(g, x, y, rp + 3); g.stroke();
        g.beginPath(); g.moveTo(x - rp, y - rp); g.lineTo(x + rp, y + rp); g.moveTo(x + rp, y - rp); g.lineTo(x - rp, y + rp); g.stroke();
      } else if (style === 'manque') {
        g.strokeStyle = '#ffb347'; g.lineWidth = 2; g.setLineDash([2, 3]); cercle(g, x, y, rp + 4); g.stroke(); g.setLineDash([]);
      }
    };
    cible.forEach((ev, cle) => {
      const lu = o.lueurs && o.lueurs[cle] != null && tempsAnim - o.lueurs[cle] < 0.35;
      point(ev, lu ? 'lueur' : 'plein');
    });
    if (o.res) {
      o.res.justes.forEach((cle) => { const ev = cible.get(cle); if (ev) point(ev, 'juste'); });
      o.res.faux.forEach((ev) => point(ev, 'faux'));
      if (o.res.fini) cible.forEach((ev, cle) => { if (!o.res.justes.has(cle)) point(ev, 'manque'); });
    }
    if (o.fantomes) o.fantomes.forEach((ev) => point(ev, 'fantome'));
    g.restore();
  }

  // ---------------------------------------------------------------------
  //  Fond étoilé et galaxies
  // ---------------------------------------------------------------------

  const fond = $('fond'), gf = fond.getContext('2d');
  let FW = 0, FH = 0;
  const ETOILES = [];
  (function () {
    let graine = 7;
    const hasard = () => { graine = (graine * 16807) % 2147483647; return graine / 2147483647; };
    for (let i = 0; i < 170; i++) ETOILES.push({ x: hasard(), y: hasard(), r: 0.4 + hasard() * 1.4, p: hasard() * 6.3, v: 0.5 + hasard() * 2 });
  })();

  function galaxieCourante() {
    if (etat.ecran === 'jeu') return Math.floor(etat.n / 5);
    return 0;
  }

  function dessinerFond() {
    const gx = GALAXIES[galaxieCourante()];
    const grad = gf.createLinearGradient(0, 0, 0, FH);
    grad.addColorStop(0, gx.haut); grad.addColorStop(1, gx.bas);
    gf.fillStyle = grad; gf.fillRect(0, 0, FW, FH);
    const m = Math.min(FW, FH);
    if (gx.deco === 'voie') {
      gf.save(); gf.translate(FW / 2, FH / 2); gf.rotate(-0.6);
      const v = gf.createLinearGradient(0, -m * 0.25, 0, m * 0.25);
      v.addColorStop(0, 'rgba(180,160,255,0)'); v.addColorStop(0.5, 'rgba(200,180,255,0.16)'); v.addColorStop(1, 'rgba(180,160,255,0)');
      gf.fillStyle = v; gf.fillRect(-FW, -m * 0.25, FW * 2, m * 0.5); gf.restore();
    } else if (gx.deco === 'nebuleuse') {
      [[0.2, 0.25, '255,110,190'], [0.8, 0.4, '200,110,255'], [0.35, 0.8, '255,150,200'], [0.75, 0.85, '255,90,160']].forEach((n, i) => {
        const x = FW * n[0] + Math.sin(tempsAnim * 0.1 + i) * 20, y = FH * n[1] + Math.cos(tempsAnim * 0.08 + i) * 16;
        const r = m * 0.45;
        const ng = gf.createRadialGradient(x, y, 0, x, y, r);
        ng.addColorStop(0, 'rgba(' + n[2] + ',0.28)'); ng.addColorStop(1, 'rgba(' + n[2] + ',0)');
        gf.fillStyle = ng; gf.fillRect(x - r, y - r, r * 2, r * 2);
      });
    } else if (gx.deco === 'amas') {
      [[0.18, 0.2], [0.85, 0.32], [0.3, 0.88]].forEach((a, i) => {
        const x = FW * a[0], y = FH * a[1], r = m * 0.22;
        const ng = gf.createRadialGradient(x, y, 0, x, y, r);
        ng.addColorStop(0, 'rgba(140,210,255,0.3)'); ng.addColorStop(1, 'rgba(140,210,255,0)');
        gf.fillStyle = ng; gf.fillRect(x - r, y - r, r * 2, r * 2);
        for (let k = 0; k < 26; k++) {
          const ang = k * 2.4 + i, d = r * 0.7 * Math.sqrt((k * 37 % 26) / 26);
          gf.fillStyle = 'rgba(210,240,255,' + (0.5 + 0.5 * Math.sin(tempsAnim * 2 + k)) + ')';
          cercle(gf, x + Math.cos(ang) * d, y + Math.sin(ang) * d, 1 + (k % 3) * 0.5); gf.fill();
        }
      });
    } else if (gx.deco === 'trou') {
      const x = FW * 0.82, y = FH * 0.16, r = m * 0.11;
      gf.save(); gf.translate(x, y);
      const hg = gf.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 3);
      hg.addColorStop(0, 'rgba(255,160,120,0.25)'); hg.addColorStop(1, 'rgba(255,160,120,0)');
      gf.fillStyle = hg; cercle(gf, 0, 0, r * 3); gf.fill();
      gf.rotate(-0.3);
      for (let i = 0; i < 3; i++) {
        gf.beginPath(); gf.ellipse(0, 0, r * (2.1 - i * 0.3), r * (0.6 - i * 0.08), 0, 0, Math.PI * 2);
        gf.strokeStyle = ['rgba(255,190,120,0.7)', 'rgba(255,130,200,0.6)', 'rgba(190,140,255,0.6)'][i]; gf.lineWidth = r * 0.16; gf.stroke();
      }
      gf.fillStyle = '#05040a'; cercle(gf, 0, 0, r * 0.8); gf.fill();
      gf.strokeStyle = 'rgba(255,220,180,0.8)'; gf.lineWidth = 2; cercle(gf, 0, 0, r * 0.82); gf.stroke();
      for (let i = 0; i < 8; i++) {
        const a = tempsAnim * 0.8 + i * Math.PI / 4;
        gf.fillStyle = '#ffe9c9'; cercle(gf, Math.cos(a) * r * 1.8, Math.sin(a) * r * 0.5, 1.6); gf.fill();
      }
      gf.restore();
    }
    ETOILES.forEach((e) => {
      gf.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(tempsAnim * e.v * 0.5 + e.p));
      gf.fillStyle = '#ffffff'; gf.fillRect(e.x * FW, e.y * FH, e.r * 1.4, e.r * 1.4);
    });
    gf.globalAlpha = 1;
    if (etat.ecran === 'titre') dessinerIllustrationTitre();
  }

  // Grand système solaire animé de l'écran titre (sert aussi de jaquette)
  function dessinerIllustrationTitre() {
    const r = $('illus').getBoundingClientRect();
    if (r.height < 60) return;
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const R = Math.min(r.width * 0.46, r.height * 0.48);
    const k = R / 170;
    dessinerRayon(gf, cx, cy, R * 1.05, 26 * k, false, false, 0.3 + 0.2 * Math.sin(tempsAnim * 3));
    const orbites = [{ r: 62, v: 1.1, p: [[0, 2, 'simple']] }, { r: 105, v: 0.6, p: [[1.9, 4, 'double'], [4.6, 0, 'aucun']] }, { r: 150, v: 0.34, p: [[3.3, 5, 'etoiles'], [5.6, 3, 'simple']] }];
    gf.save();
    orbites.forEach((o) => { gf.strokeStyle = 'rgba(255,255,255,0.28)'; gf.lineWidth = 2; cercle(gf, cx, cy, o.r * k); gf.stroke(); });
    gf.setLineDash([6, 8]); gf.strokeStyle = 'rgba(170,235,255,0.35)'; cercle(gf, cx, cy, 168 * k); gf.stroke(); gf.setLineDash([]);
    gf.restore();
    dessinerSoleil(gf, cx, cy, 30 * k, 0.15 + 0.15 * Math.sin(tempsAnim * 2), null);
    orbites.forEach((o) => o.p.forEach((p) => {
      const a = p[0] + tempsAnim * o.v;
      const x = cx + Math.cos(a) * o.r * k, y = cy + Math.sin(a) * o.r * k;
      // la planète chante quand elle passe sur le rayon (en haut)
      const dist = Math.abs(Math.atan2(Math.sin(a + Math.PI / 2), Math.cos(a + Math.PI / 2)));
      const ch = dist < 0.25 ? 1 - dist / 0.25 : 0;
      dessinerPlanete(gf, x, y, 17 * k, p[1], { anneau: p[2], chante: ch, lune: p[1] === 4, angleLune: tempsAnim * 2.5 });
    }));
    const ac2 = -tempsAnim * 0.25 + 1;
    dessinerComete(gf, cx + Math.cos(ac2) * 168 * k, cy + Math.sin(ac2) * 168 * k, 9 * k, ac2 - Math.PI / 2);
    for (let i = 0; i < 4; i++) {
      const ph = (tempsAnim * 0.35 + i / 4) % 1;
      gf.globalAlpha = Math.sin(ph * Math.PI);
      dessinerNoteMusique(gf, cx + (i % 2 ? 1 : -1) * (24 + i * 8) * k, cy - R * 0.25 - ph * R * 0.65, 8 * k, ['#ffe27a', '#ffb3e0', '#9fe3ff', '#b9f5b5'][i]);
    }
    gf.globalAlpha = 1;
  }

  // ---------------------------------------------------------------------
  //  Mise en page du jeu
  // ---------------------------------------------------------------------

  const zone = $('zone'), cv = $('jeu'), g = cv.getContext('2d');
  const calque = $('calque'), gc = calque.getContext('2d');
  const MP = { W: 0, H: 0, k: 1, cx: 0, cy: 0, partY: 6, partH: 70, trayY: 0, trayH: 78 };

  function redimensionner() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    FW = window.innerWidth; FH = window.innerHeight;
    fond.width = Math.round(FW * dpr); fond.height = Math.round(FH * dpr); gf.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (etat.ecran === 'jeu') {
      const r = zone.getBoundingClientRect();
      MP.W = r.width; MP.H = r.height;
      cv.width = Math.round(MP.W * dpr); cv.height = Math.round(MP.H * dpr); g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const e = $('ecran-jeu').getBoundingClientRect();
      calque.width = Math.round(e.width * dpr); calque.height = Math.round(e.height * dpr); gc.setTransform(dpr, 0, 0, dpr, 0, 0);
      const niv = NIVEAUX[etat.n];
      MP.partH = niv.voix2 ? Math.max(90, Math.min(150, MP.H * 0.22)) : Math.max(56, Math.min(108, MP.H * 0.16));
      MP.trayH = Math.min(80, Math.max(62, MP.H * 0.13));
      MP.trayY = MP.H - MP.trayH;
      const haut = MP.partY + MP.partH + 4, bas = MP.trayY - 2;
      const taille = Math.max(140, Math.min(MP.W - 6, bas - haut));
      MP.k = taille / 400; MP.cx = MP.W / 2; MP.cy = (haut + bas) / 2;
    }
    if (etat.ecran === 'juke') preparerCanvas($('juke-partition'));
    if (etat.ecran === 'atelier') preparerCanvas($('atelier-apercu'));
  }
  function preparerCanvas(c) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2), r = c.getBoundingClientRect();
    c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function rayonOrbite(o) {
    const niv = NIVEAUX[etat.n];
    if (o === PISTE) return RAYON_PISTE;
    return niv.L === 16 ? [0, 50, 88, 125, 160][o] : [0, 62, 106, 150][o];
  }
  function aComete(niv) { return niv.sol.some((o) => o.type === 'comete'); }
  // Position d'un objet sur son orbite au temps t (en temps de la boucle)
  function position(o, s, t) {
    const niv = NIVEAUX[etat.n];
    const a = -Math.PI / 2 - s * 2 * Math.PI / nbPlaces(o, niv) + t * 2 * Math.PI / periode(o, niv);
    const R = rayonOrbite(o) * MP.k;
    return { x: MP.cx + Math.cos(a) * R, y: MP.cy + Math.sin(a) * R, a: a };
  }
  function rayonPlanete() { return Math.max(11, 15 * MP.k); }

  // Places du plateau (objets pas encore posés)
  function placesPlateau() {
    const libres = etat.objs.filter((o) => o.o == null);
    const m = libres.length;
    const sp = Math.min(60, (MP.W - 24) / Math.max(1, m));
    const res = new Map();
    libres.forEach((o, i) => res.set(o, { x: MP.W / 2 + (i - (m - 1) / 2) * sp, y: MP.trayY + MP.trayH / 2 + 2 }));
    return res;
  }
  function positionObjet(o, t) {
    if (o.o == null) return placesPlateau().get(o);
    return position(o.o, o.s, t || 0);
  }

  // ---------------------------------------------------------------------
  //  Dessin du jeu
  // ---------------------------------------------------------------------

  function chant(depuis) {
    if (depuis == null) return 0;
    const d = tempsAnim - depuis;
    return d >= 0 && d < 0.45 ? 1 - d / 0.45 : 0;
  }

  function dessinerJeu() {
    const niv = NIVEAUX[etat.n];
    g.clearRect(0, 0, MP.W, MP.H);
    g.save();
    if (etat.secousse > 0) g.translate(Math.sin(tempsAnim * 60) * etat.secousse * 8, 0);
    const k = MP.k, cx = MP.cx, cy = MP.cy;
    const tt = etat.mode === 'test' ? Math.max(0, etat.t) : 0;
    const enPose = etat.mode !== 'test';

    // partition
    dessinerPartition(g, 8, MP.partY, MP.W - 16, MP.partH, niv.L, !!niv.voix2, etat.cible, {
      t: (etat.mode === 'ecoute' || etat.mode === 'test') ? etat.t : null,
      lueurs: etat.lueurs, res: etat.res, fantomes: etat.fantomes
    });

    // rayons
    const eclat = chant(etat.soleil);
    const Lr = (aComete(niv) ? RAYON_PISTE + 14 : rayonOrbite(niv.orb[niv.orb.length - 1]) + 24) * k;
    dessinerRayon(g, cx, cy, Lr, 24 * k, false, false, eclat);
    if (niv.rayons === 2) dessinerRayon(g, cx, cy, Lr, 24 * k, true, !!niv.voix2, eclat);

    // orbites, places, sens de rotation
    niv.orb.forEach((o) => {
      const R = rayonOrbite(o) * k;
      g.strokeStyle = 'rgba(255,255,255,0.3)'; g.lineWidth = 2; cercle(g, cx, cy, R); g.stroke();
      const n = nbPlaces(o, niv);
      for (let s = 0; s < n; s++) {
        const p = position(o, s, 0);
        if (bloque(niv, o, s)) continue;
        if (enPose) { g.fillStyle = 'rgba(255,255,255,0.35)'; cercle(g, p.x, p.y, 3); g.fill(); }
      }
      // flèches de sens (dans le sens des aiguilles d'une montre)
      for (let i = 0; i < 3; i++) {
        const a = -Math.PI / 2 + Math.PI / n + i * Math.PI * 2 / 3 + 0.4 + o * 0.5;
        const x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
        g.save(); g.translate(x, y); g.rotate(a + Math.PI / 2);
        g.strokeStyle = 'rgba(255,255,255,0.4)'; g.lineWidth = 2; g.beginPath(); g.moveTo(-4, -4); g.lineTo(0, 0); g.lineTo(-4, 4); g.stroke();
        g.restore();
      }
    });
    // ceintures d'astéroïdes
    if (niv.bloc) Object.keys(niv.bloc).forEach((cleO) => {
      const o = Number(cleO), n = nbPlaces(o, niv);
      for (let s = 0; s < n; s++) {
        if (!bloque(niv, o, s)) continue;
        const p = position(o, s, 0), R = rayonOrbite(o) * k;
        const pas = Math.PI * 2 / n;
        const cailloux = Math.max(3, Math.round(pas * R / 13));
        for (let i = 0; i < cailloux; i++) {
          const a = p.a + (i / cailloux - 0.5) * pas * 0.9 + Math.sin(s * 3 + i) * 0.02;
          const d = R + Math.sin(i * 2.3 + s) * 5 * k;
          dessinerCaillou(g, cx + Math.cos(a) * d, cy + Math.sin(a) * d, (5 + (i * 7 + s) % 4) * k, i + s * 5);
        }
      }
    });
    // piste des comètes
    if (aComete(niv)) {
      const R = RAYON_PISTE * k;
      g.setLineDash([6, 7]); g.strokeStyle = 'rgba(170,235,255,0.55)'; g.lineWidth = 2; cercle(g, cx, cy, R); g.stroke(); g.setLineDash([]);
      if (enPose) for (let s = 0; s < 8; s++) { const p = position(PISTE, s, 0); g.fillStyle = 'rgba(190,245,255,0.6)'; etoile(g, p.x, p.y, 4, 4, 0.4); g.fill(); }
    }

    dessinerSoleil(g, cx, cy, 24 * k, eclat, etat.couleurSoleil);

    // plateau
    rectArrondi(g, 8, MP.trayY + 4, MP.W - 16, MP.trayH - 8, 16);
    g.fillStyle = 'rgba(20,18,60,0.7)'; g.fill(); g.strokeStyle = 'rgba(170,175,255,0.35)'; g.lineWidth = 1.5; g.stroke();
    const plateau = placesPlateau();
    if (!plateau.size) {
      g.fillStyle = 'rgba(220,220,255,0.65)'; g.font = '600 14px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(tr('plateau.vide'), MP.W / 2, MP.trayY + MP.trayH / 2, MP.W - 40);
    }

    // objets
    const rp = rayonPlanete();
    etat.objs.forEach((o) => {
      if (etat.drag && etat.drag.obj === o && etat.drag.bouge) return;
      if (etat.tenu && etat.tenu.obj === o) return;
      let p, angleMvt = 0, r = rp;
      if (o.o == null) { p = plateau.get(o); r = Math.min(17, (MP.trayH - 24) / 2); }
      else { p = position(o.o, o.s, tt); angleMvt = p.a + Math.PI / 2; }
      dessinerObjet(g, o, p.x, p.y, r, angleMvt, 1);
      if (etat.sel === o && !etat.tenu) { g.strokeStyle = '#ffe27a'; g.lineWidth = 3; g.setLineDash([5, 4]); cercle(g, p.x, p.y, r + 8); g.stroke(); g.setLineDash([]); }
    });

    // objet tenu au clavier : à la place visée
    if (etat.tenu) {
      const c = etat.tenu, p = position(c.o, c.s, 0);
      const ok = !bloque(niv, c.o, c.s);
      g.strokeStyle = ok ? '#ffe27a' : '#ff6b6b'; g.lineWidth = 3; cercle(g, p.x, p.y, rp + 9); g.stroke();
      dessinerObjet(g, c.obj, p.x, p.y, rp, p.a + Math.PI / 2, 0.8);
    }
    // objet glissé au doigt ou à la souris
    if (etat.drag && etat.drag.bouge) {
      const d = etat.drag;
      if (d.cible) { const p = position(d.cible.o, d.cible.s, 0); g.strokeStyle = '#ffe27a'; g.lineWidth = 3; g.setLineDash([5, 4]); cercle(g, p.x, p.y, rp + 8); g.stroke(); g.setLineDash([]); }
      dessinerObjet(g, d.obj, d.x, d.y - 6, rp * 1.25, 0, 0.95);
    }

    // particules
    etat.particules.forEach((q) => {
      g.globalAlpha = Math.max(0, Math.min(1, q.vie / q.vieMax));
      if (q.type === 'note') dessinerNoteMusique(g, q.x, q.y, q.r, q.col);
      else if (q.type === 'onde') { g.strokeStyle = q.col; g.lineWidth = 3; cercle(g, q.x, q.y, q.r * (1 + (1 - q.vie / q.vieMax) * 2)); g.stroke(); }
      else { g.fillStyle = q.col; etoile(g, q.x, q.y, q.r, 5); g.fill(); }
    });
    g.globalAlpha = 1;
    g.restore();
  }

  function dessinerObjet(gx, o, x, y, r, angleMvt, alpha) {
    if (o.type === 'comete') dessinerComete(gx, x, y, r * 0.65, angleMvt, { chante: chant(o.chante), alpha: alpha });
    else dessinerPlanete(gx, x, y, r, o.c, { chante: chant(o.chante), lune: o.lune, luneChante: chant(o.luneChante), alpha: alpha, angleLune: tempsAnim * 2.2 + o.c });
  }

  // ---------------------------------------------------------------------
  //  Particules et effets
  // ---------------------------------------------------------------------

  function particule(q) { q.vieMax = q.vie; etat.particules.push(q); }
  function majParticules(dt) {
    etat.particules.forEach((q) => { q.vie -= dt; q.x += (q.vx || 0) * dt; q.y += (q.vy || 0) * dt; if (q.type === 'etoile') q.vy += 160 * dt; });
    etat.particules = etat.particules.filter((q) => q.vie > 0);
    if (etat.particules.length > 260) etat.particules.splice(0, etat.particules.length - 260);
  }
  function feuDArtifice(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 220;
      particule({ type: 'etoile', x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, r: 3 + Math.random() * 4, vie: 1 + Math.random() * 0.8, col: ['#ffe27a', '#ffb3e0', '#9fe3ff', '#b9f5b5', '#ffffff'][i % 5] });
    }
  }

  // ---------------------------------------------------------------------
  //  Déroulement d'un niveau
  // ---------------------------------------------------------------------

  function dureePas() { return NIVEAUX[etat.n].L === 16 ? 0.34 : 0.5; }

  function demarrerNiveau(n) {
    etat.n = n;
    const niv = NIVEAUX[n];
    etat.objs = niv.sol.map((o) => ({ type: o.type, c: o.c, lune: o.lune, o: null, s: null, chante: null, luneChante: null }))
      .sort((a, b) => (a.type === b.type ? (a.c - b.c) || (a.lune - b.lune) : (a.type === 'comete' ? 1 : -1)));
    etat.cible = evenements(niv.sol, niv);
    etat.tests = 0; etat.mode = 'pose'; etat.res = null; etat.sel = null; etat.tenu = null; etat.drag = null;
    etat.fantomes = null; etat.t = 0; etat.lueurs = {}; etat.particules = []; etat.secousse = 0;
    etat.enPartie = true; etat.pause = false; etat.produits = null;
    prog.niveau = n + 1;
    montrer('jeu');
    majHud();
    fermerVoiles();
    if (n % 5 === 0) setTimeout(() => toast(tr('toast.galaxie', { nom: tr('galaxie.' + Math.floor(n / 5)) })), 300);
    if (niv.tuto === 'base' && prog.etoiles[n] === 0) { lancerTutoMain(); setTimeout(lancerEcoute, 700); }
    else if (niv.tuto && niv.tuto !== 'base' && prog.etoiles[n] === 0 && !vusTutos[niv.tuto + n]) { vusTutos[niv.tuto + n] = true; ouvrirTuto(niv.tuto); }
    else setTimeout(lancerEcoute, 600);
    setTimeout(() => { try { cv.focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 50);
  }

  function majHud() {
    const n = etat.n;
    $('hud-niveau').textContent = tr('hud.niveau', { n: n + 1, total: NIVEAUX.length });
    $('hud-galaxie').textContent = tr('galaxie.' + Math.floor(n / 5));
    const reste = ESSAIS - etat.tests;
    $('hud-essais').textContent = tr('hud.essais', { n: reste });
    $('hud-essais').classList.toggle('peu', reste <= 2);
    $('btn-tester').disabled = etat.mode === 'test' || etat.mode === 'fini';
    $('btn-ecouter').disabled = etat.mode === 'test' || etat.mode === 'fini';
    $('aide-clavier').textContent = tr('aide.clavier');
  }

  function lancerEcoute() {
    if (etat.ecran !== 'jeu' || etat.mode === 'test' || etat.mode === 'fini' || etat.pause) return;
    audio();
    etat.mode = 'ecoute'; etat.t = -0.3; etat.lueurs = {};
    majHud();
  }

  function lancerTest() {
    if (etat.ecran !== 'jeu' || etat.mode === 'test' || etat.mode === 'fini' || etat.pause) return;
    audio();
    if (!etat.objs.some((o) => o.o != null)) { toast(tr('toast.vide')); sons.refus(); return; }
    lacher();
    etat.tests++;
    etat.mode = 'test'; etat.t = -0.3;
    etat.produits = evenements(etat.objs, NIVEAUX[etat.n]);
    etat.res = { justes: new Set(), faux: [], fini: false };
    majHud();
  }

  // Un temps de la boucle est atteint : les notes de ce temps chantent
  function jouerTemps(i) {
    const k = MP.k;
    if (etat.mode === 'ecoute') {
      etat.cible.forEach((ev, cle) => {
        if (ev.t !== i) return;
        jouerNote(ev.note, ev.voix); etat.lueurs[cle] = tempsAnim; etat.soleil = tempsAnim; etat.couleurSoleil = couleur(ev.note);
        particule({ type: 'onde', x: MP.cx, y: MP.cy, r: 26 * k, vie: 0.6, col: couleur(ev.note) });
      });
    } else if (etat.mode === 'test') {
      etat.produits.forEach((ev, cle) => {
        if (ev.t !== i) return;
        jouerNote(ev.note, ev.voix); etat.soleil = tempsAnim; etat.couleurSoleil = couleur(ev.note);
        if (ev.lune) ev.obj.luneChante = tempsAnim; else ev.obj.chante = tempsAnim;
        const p = position(ev.obj.o, ev.obj.s, i);
        const ok = etat.cible.has(cle);
        if (ok) etat.res.justes.add(cle); else etat.res.faux.push(ev);
        particule({ type: 'note', x: p.x + 10, y: p.y - 10, vx: 10, vy: -50, r: 6, vie: 0.9, col: ok ? couleur(ev.note) : '#ff8a8a' });
        if (ok) particule({ type: 'onde', x: p.x, y: p.y, r: 14 * k, vie: 0.5, col: '#ffffff' });
      });
    }
  }

  function avancerLecture(dt) {
    if (etat.mode !== 'ecoute' && etat.mode !== 'test') return;
    const L = NIVEAUX[etat.n].L;
    const avant = etat.t;
    etat.t += dt / dureePas();
    for (let i = Math.floor(avant) + 1; i <= Math.floor(etat.t); i++) if (i >= 0 && i < L) jouerTemps(i);
    if (etat.t >= L + 0.15) finLecture();
  }

  function finLecture() {
    if (etat.mode === 'ecoute') { etat.mode = 'pose'; etat.t = 0; majHud(); return; }
    // fin d'un essai : la mélodie est-elle exactement la même ?
    const cible = etat.cible, prod = etat.produits;
    etat.res.fini = true;
    let ok = prod.size === cible.size;
    if (ok) cible.forEach((_, cle) => { if (!prod.has(cle)) ok = false; });
    etat.t = 0;
    if (ok) { gagner(); return; }
    etat.mode = 'pose';
    etat.secousse = 1;
    sons.faux();
    majHud();
    if (etat.tests >= ESSAIS) { etat.mode = 'fini'; majHud(); setTimeout(perdre, 900); }
    else toast(conseil());
  }

  // Petit conseil après un essai raté
  function conseil() {
    const manquent = [...etat.cible.keys()].filter((c) => !etat.res.justes.has(c)).length;
    const trop = etat.res.faux.length;
    if (trop && !manquent) return tr('conseil.trop', { n: trop });
    if (manquent && !trop) return tr('conseil.manque', { n: manquent });
    return tr('conseil.compte');
  }

  function etoilesPour(tests) { return tests <= 2 ? 3 : (tests <= 4 ? 2 : 1); }

  function gagner() {
    const n = etat.n;
    etat.mode = 'fini'; etat.enPartie = false;
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
    const et = etoilesPour(etat.tests);
    const score = 100 * et + 40 * (ESSAIS - etat.tests);
    const ancienRecord = prog.records[n];
    const avant = totalEtoiles();
    prog.etoiles[n] = Math.max(prog.etoiles[n], et);
    prog.records[n] = Math.max(ancienRecord, score);
    prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, n + 2));
    sauver(Math.min(NIVEAUX.length, n + 2));
    const debloques = [].concat(
      ANNEAUX.filter((a) => a.min > avant && a.min <= totalEtoiles()).map((a) => tr('anneau.' + a.id)),
      PALETTES.filter((p) => p.min > avant && p.min <= totalEtoiles()).map((p) => tr('palette.' + p.id))
    );
    sons.victoire();
    feuDArtifice(MP.cx, MP.cy, 60);
    etat.objs.forEach((o) => { o.chante = tempsAnim; });
    majHud();
    setTimeout(() => afficherFin(true, { etoiles: et, score: score, record: score > ancienRecord, ancien: ancienRecord, debloques: debloques }), 1300);
  }

  function perdre() {
    const n = etat.n;
    etat.enPartie = false;
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: n + 1 });
    sons.defaite();
    afficherFin(false, { etoiles: 0, score: 0, record: false, ancien: prog.records[n], debloques: [] });
  }

  function afficherFin(victoire, d) {
    const n = etat.n;
    const v = $('voile-fin');
    $('fin-titre').textContent = victoire ? tr('fin.victoire') : tr('fin.defaite');
    const et = $('fin-etoiles'); et.innerHTML = '';
    et.setAttribute('aria-label', tr('fin.etoilesAria', { n: d.etoiles }));
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span'); s.textContent = '★';
      if (i < d.etoiles) { s.className = 'oui'; s.style.animationDelay = (0.2 + i * 0.25) + 's'; setTimeout(() => sons.etoile(i), 200 + i * 250); }
      et.appendChild(s);
    }
    // compteur qui défile
    const sc = $('fin-score');
    let affiche = 0; const pas = Math.max(1, Math.round(d.score / 30));
    sc.textContent = tr('fin.score', { n: nb(0) });
    const iv = setInterval(() => { affiche = Math.min(d.score, affiche + pas); sc.textContent = tr('fin.score', { n: nb(affiche) }); if (affiche >= d.score) clearInterval(iv); }, 30);
    $('fin-record').textContent = d.record ? tr('fin.nouveauRecord') : tr('fin.record', { n: nb(prog.records[n]) });
    $('fin-melodie').textContent = victoire ? tr('fin.melodie', { nom: tr('melodie.' + (n + 1)) }) : tr('fin.astuce');
    $('fin-debloque').textContent = d.debloques.length ? tr('fin.debloque', { liste: d.debloques.join(', ') }) : '';
    const boutons = $('fin-boutons'); boutons.innerHTML = '';
    const ajouter = (cle, classe, f) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ' + (classe || ''); b.textContent = tr(cle); b.addEventListener('click', () => { sons.clic(); f(); }); boutons.appendChild(b); return b; };
    let premier;
    if (victoire) {
      if (n + 1 < NIVEAUX.length) premier = ajouter('bouton.suivant', 'moyen', () => demarrerNiveau(n + 1));
      else premier = ajouter('bouton.bilan', 'moyen', afficherBilan);
      ajouter('bouton.rejouer', '', () => demarrerNiveau(n));
      ajouter('bouton.niveaux', '', () => { fermerVoiles(); ouvrirNiveaux(); });
    } else {
      premier = ajouter('bouton.reessayer', 'moyen', () => demarrerNiveau(n));
      ajouter('bouton.niveaux', '', () => { fermerVoiles(); ouvrirNiveaux(); });
      ajouter('pause.accueil', '', () => { fermerVoiles(); ouvrirTitre(); });
    }
    v.classList.add('actif');
    setTimeout(() => { try { premier.focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 60);
  }

  // Bilan final, après le dernier niveau
  function afficherBilan() {
    $('fin-titre').textContent = tr('bilan.titre');
    const et = $('fin-etoiles'); et.innerHTML = ''; et.removeAttribute('aria-label');
    for (let i = 0; i < 3; i++) { const s = document.createElement('span'); s.textContent = '★'; s.className = 'oui'; s.style.animationDelay = (i * 0.2) + 's'; et.appendChild(s); }
    $('fin-score').textContent = tr('bilan.etoiles', { n: totalEtoiles(), total: NIVEAUX.length * 3 });
    $('fin-record').textContent = tr('bilan.score', { n: nb(scoreTotal()) });
    $('fin-melodie').textContent = tr('bilan.texte');
    $('fin-debloque').textContent = '';
    const boutons = $('fin-boutons'); boutons.innerHTML = '';
    [['bouton.juke', () => { fermerVoiles(); ouvrirJuke(); }], ['bouton.niveaux', () => { fermerVoiles(); ouvrirNiveaux(); }], ['pause.accueil', () => { fermerVoiles(); ouvrirTitre(); }]].forEach((b, i) => {
      const e = document.createElement('button'); e.type = 'button'; e.className = 'btn' + (i === 0 ? ' moyen' : ''); e.textContent = tr(b[0]);
      e.addEventListener('click', () => { sons.clic(); b[1](); }); boutons.appendChild(e);
    });
    feuDArtifice(MP.cx, MP.cy, 90);
    sons.victoire();
  }

  // ---------------------------------------------------------------------
  //  Poser, glisser, retirer
  // ---------------------------------------------------------------------

  function occupant(o, s, sauf) { return etat.objs.find((x) => x !== sauf && x.o === o && x.s === s) || null; }
  function orbitesPour(obj) { return obj.type === 'comete' ? [PISTE] : NIVEAUX[etat.n].orb; }

  function placeProche(obj, x, y) {
    const niv = NIVEAUX[etat.n];
    let mieux = null, dmin = Math.max(30, 40 * MP.k);
    orbitesPour(obj).forEach((o) => {
      for (let s = 0; s < nbPlaces(o, niv); s++) {
        if (bloque(niv, o, s)) continue;
        const p = position(o, s, 0), d = Math.hypot(p.x - x, p.y - y);
        if (d < dmin) { dmin = d; mieux = { o: o, s: s }; }
      }
    });
    return mieux;
  }
  // Une place bloquée est-elle tout près ? (pour expliquer le refus)
  function placeBloqueeProche(obj, x, y) {
    const niv = NIVEAUX[etat.n];
    let oui = false;
    orbitesPour(obj).forEach((o) => { for (let s = 0; s < nbPlaces(o, niv); s++) { if (!bloque(niv, o, s)) continue; const p = position(o, s, 0); if (Math.hypot(p.x - x, p.y - y) < 30) oui = true; } });
    return oui;
  }

  function placer(obj, place) {
    const autre = occupant(place.o, place.s, obj);
    const ancienne = obj.o != null ? { o: obj.o, s: obj.s } : null;
    obj.o = place.o; obj.s = place.s;
    if (autre) {
      if (ancienne && orbitesPour(autre).indexOf(ancienne.o) >= 0) { autre.o = ancienne.o; autre.s = ancienne.s; }
      else { autre.o = null; autre.s = null; }
    }
    configurationChangee();
    sons.poser();
    const p = position(place.o, place.s, 0);
    particule({ type: 'onde', x: p.x, y: p.y, r: 12 * MP.k, vie: 0.45, col: couleur(obj.c) });
  }
  function retirer(obj) {
    if (obj.o == null) return;
    obj.o = null; obj.s = null;
    configurationChangee();
    sons.prendre();
  }
  function configurationChangee() {
    if (etat.mode === 'pose' || etat.mode === 'ecoute') etat.res = null;
    etat.fantomes = null;
  }
  // Notes que donnerait un seul objet à une place : points fantômes dans la partition
  function fantomesPour(obj, place) {
    if (!place) return null;
    const copie = { type: obj.type, c: obj.c, lune: obj.lune, o: place.o, s: place.s };
    return [...evenements([copie], NIVEAUX[etat.n]).values()];
  }

  function objetSous(x, y) {
    let mieux = null, dmin = Math.max(26, rayonPlanete() + 10);
    const plateau = placesPlateau();
    etat.objs.forEach((o) => {
      const p = o.o == null ? plateau.get(o) : position(o.o, o.s, 0);
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < dmin) { dmin = d; mieux = o; }
    });
    return mieux;
  }

  function pointCanvas(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function peutManipuler() { return etat.ecran === 'jeu' && !etat.pause && (etat.mode === 'pose' || etat.mode === 'ecoute') && !etat.tutoCarte; }

  cv.addEventListener('pointerdown', (e) => {
    if (etat.tutoMain) { fermerTutoMain(); }
    if (!peutManipuler()) return;
    audio();
    e.preventDefault();
    lacher();
    const p = pointCanvas(e);
    const obj = objetSous(p.x, p.y);
    if (obj) {
      etat.drag = { obj: obj, x: p.x, y: p.y, sx: p.x, sy: p.y, bouge: false, cible: null };
      try { cv.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
    } else if (etat.sel) {
      const place = placeProche(etat.sel, p.x, p.y);
      if (place) { placer(etat.sel, place); etat.sel = null; }
      else if (placeBloqueeProche(etat.sel, p.x, p.y)) { sons.refus(); toast(tr('toast.bloque')); }
      else etat.sel = null;
    }
  });
  cv.addEventListener('pointermove', (e) => {
    const d = etat.drag; if (!d) return;
    const p = pointCanvas(e);
    d.x = p.x; d.y = p.y;
    if (!d.bouge && Math.hypot(p.x - d.sx, p.y - d.sy) > 8) { d.bouge = true; sons.prendre(); etat.sel = null; }
    if (d.bouge) { d.cible = placeProche(d.obj, p.x, p.y - 6); etat.fantomes = fantomesPour(d.obj, d.cible); }
  });
  function finGlisser(e, annule) {
    const d = etat.drag; if (!d) return;
    etat.drag = null; etat.fantomes = null;
    if (annule || !peutManipuler()) return;
    if (!d.bouge) { etat.sel = etat.sel === d.obj ? null : d.obj; sons.clic(); return; }
    const p = pointCanvas(e);
    if (d.cible) placer(d.obj, d.cible);
    else if (placeBloqueeProche(d.obj, p.x, p.y - 6)) { sons.refus(); toast(tr('toast.bloque')); }
    else retirer(d.obj);
  }
  cv.addEventListener('pointerup', (e) => finGlisser(e, false));
  cv.addEventListener('pointercancel', (e) => finGlisser(e, true));

  // ---------------------------------------------------------------------
  //  Clavier
  // ---------------------------------------------------------------------

  function lacher() { if (etat.tenu) { etat.tenu = null; etat.fantomes = null; } }
  function choisirSuivant(sens) {
    const liste = etat.objs;
    if (!liste.length) return;
    let i = liste.indexOf(etat.sel);
    i = i < 0 ? (sens > 0 ? 0 : liste.length - 1) : (i + sens + liste.length) % liste.length;
    etat.sel = liste[i]; sons.clic();
  }
  function prendreAuClavier() {
    const obj = etat.sel; if (!obj) { choisirSuivant(1); return; }
    const orbs = orbitesPour(obj);
    const o = obj.o != null ? obj.o : orbs[0];
    etat.tenu = { obj: obj, o: o, s: obj.o != null ? obj.s : 0 };
    etat.fantomes = fantomesPour(obj, etat.tenu);
    sons.prendre();
  }
  function bougerTenu(dOrbite, dPlace) {
    const c = etat.tenu, niv = NIVEAUX[etat.n];
    const orbs = orbitesPour(c.obj);
    if (dOrbite) {
      const i = Math.max(0, Math.min(orbs.length - 1, orbs.indexOf(c.o) + dOrbite));
      const ancien = c.o; c.o = orbs[i];
      if (c.o !== ancien) c.s = Math.round(c.s * nbPlaces(c.o, niv) / nbPlaces(ancien, niv)) % nbPlaces(c.o, niv);
    }
    if (dPlace) { const n = nbPlaces(c.o, niv); c.s = (c.s + dPlace + n) % n; }
    etat.fantomes = fantomesPour(c.obj, c);
    sons.clic();
  }
  function poserAuClavier() {
    const c = etat.tenu;
    if (bloque(NIVEAUX[etat.n], c.o, c.s)) { sons.refus(); toast(tr('toast.bloque')); return; }
    etat.tenu = null;
    placer(c.obj, { o: c.o, s: c.s });
  }

  document.addEventListener('pointerdown', () => document.body.classList.remove('clavier'), true);
  document.addEventListener('keydown', (e) => {
    const code = e.code;
    document.body.classList.add('clavier');
    if ($('voile-tuto').classList.contains('actif')) {
      if (code === 'Enter' || code === 'Space' || code === 'Escape') { e.preventDefault(); fermerTuto(); }
      return;
    }
    if ($('voile-pause').classList.contains('actif')) {
      if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); fermerPause(); }
      return;
    }
    if ($('voile-fin').classList.contains('actif')) return;
    if (etat.ecran === 'juke' || etat.ecran === 'niveaux' || etat.ecran === 'atelier') {
      if (code === 'Escape') { e.preventDefault(); ouvrirTitre(); }
      return;
    }
    if (etat.ecran !== 'jeu') return;
    if (etat.tutoMain) { fermerTutoMain(); if (code === 'Enter' || code === 'Space') { e.preventDefault(); return; } }
    if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); if (etat.tenu) lacher(); else ouvrirPause(); return; }
    const surBouton = e.target && e.target.tagName === 'BUTTON';
    if (surBouton && (code === 'Enter' || code === 'Space')) return;
    if (code === 'Space') { e.preventDefault(); lancerTest(); return; }
    if (code === 'KeyE') { e.preventDefault(); lancerEcoute(); return; }
    if (!peutManipuler()) return;
    audio();
    if (etat.tenu) {
      if (code === 'ArrowLeft') { e.preventDefault(); bougerTenu(0, 1); }
      else if (code === 'ArrowRight') { e.preventDefault(); bougerTenu(0, -1); }
      else if (code === 'ArrowUp') { e.preventDefault(); bougerTenu(1, 0); }
      else if (code === 'ArrowDown') { e.preventDefault(); bougerTenu(-1, 0); }
      else if (code === 'Enter' || code === 'NumpadEnter') { e.preventDefault(); poserAuClavier(); }
      else if (code === 'Backspace' || code === 'Delete') { e.preventDefault(); const o = etat.tenu.obj; lacher(); retirer(o); }
    } else {
      if (code === 'ArrowRight' || code === 'ArrowDown') { e.preventDefault(); choisirSuivant(1); }
      else if (code === 'ArrowLeft' || code === 'ArrowUp') { e.preventDefault(); choisirSuivant(-1); }
      else if (code === 'Enter' || code === 'NumpadEnter') { e.preventDefault(); prendreAuClavier(); }
      else if ((code === 'Backspace' || code === 'Delete') && etat.sel) { e.preventDefault(); retirer(etat.sel); }
    }
  });

  // Niveau 1 : une main montre les 3 gestes (glisser, Écouter, Tester)
  function lancerTutoMain() {
    etat.tutoMain = { debut: tempsAnim };
    calque.classList.add('actif');
  }
  function fermerTutoMain() {
    etat.tutoMain = null;
    calque.classList.remove('actif');
    $('bulle').style.display = 'none';
  }
  calque.addEventListener('pointerdown', (e) => { e.preventDefault(); fermerTutoMain(); });

  function dessinerTutoMain() {
    const e = $('ecran-jeu').getBoundingClientRect();
    gc.clearRect(0, 0, e.width, e.height);
    const z = zone.getBoundingClientRect();
    const ox = z.left - e.left, oy = z.top - e.top;
    const d = tempsAnim - etat.tutoMain.debut;
    const DUREE = 2.8, phase = Math.floor(d / DUREE) % 3, f = (d % DUREE) / DUREE;
    const bulle = $('bulle');
    let x, y, appui = false;
    const obj = etat.objs[0];
    if (phase === 0) {
      const depart = placesPlateau().get(obj) || { x: MP.cx, y: MP.trayY + MP.trayH / 2 };
      const arrivee = position(1, 0, 0);
      const m = Math.min(1, Math.max(0, (f - 0.15) / 0.6));
      const lisse = m * m * (3 - 2 * m);
      x = ox + depart.x + (arrivee.x - depart.x) * lisse; y = oy + depart.y + (arrivee.y - depart.y) * lisse;
      appui = f > 0.1 && f < 0.8;
      if (appui) dessinerPlanete(gc, x, y - 4, rayonPlanete() * 1.2, obj.c, { alpha: 0.75, anneau: prog.options.anneau });
    } else {
      const b = $(phase === 1 ? 'btn-ecouter' : 'btn-tester').getBoundingClientRect();
      x = b.left - e.left + b.width / 2; y = b.top - e.top + b.height / 2;
      const rebond = Math.abs(Math.sin(f * Math.PI * 3));
      y += 6 - rebond * 14; appui = rebond < 0.3;
    }
    // texte de la bulle, changé seulement à chaque nouvelle étape
    if (etat.tutoMain.phase !== phase) {
      etat.tutoMain.phase = phase;
      bulle.textContent = tr('tuto.main' + (phase + 1));
      const astuce = document.createElement('small'); astuce.textContent = tr('tuto.passer'); bulle.appendChild(astuce);
    }
    bulle.style.top = (oy + MP.partY + MP.partH + 8) + 'px';
    bulle.style.display = 'block';
    dessinerMain(gc, x, y, 1.15, appui);
  }

  function dessinerDemo() {
    const c = $('tuto-demo'), dg = c.getContext('2d');
    const W = 280, H = 190;
    dg.setTransform(c.width / W, 0, 0, c.height / H, 0, 0);
    dg.clearRect(0, 0, W, H);
    const D = DEMOS[etat.tutoCarte.cle];
    const cx = 140, cy = D.voix2 ? 68 : 74;
    const pasT = D.L === 16 ? 0.3 : 0.45;
    const tempsGeste = 1.6, cycle = tempsGeste + D.L * pasT + 0.8;
    const d = (tempsAnim - etat.tutoCarte.debut) % cycle;
    const t = d < tempsGeste ? 0 : Math.min(D.L, (d - tempsGeste) / pasT);
    const enJeu = d >= tempsGeste && t < D.L;
    // notes produites
    const evs = [];
    const posD = (o, tt) => {
      const n = o.comete ? 8 : D.orb[o.oi].n, per = o.comete ? D.L : D.orb[o.oi].n, R = o.comete ? 80 : D.orb[o.oi].r;
      const a = -Math.PI / 2 - o.s * 2 * Math.PI / n + tt * 2 * Math.PI / per;
      return { x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R, a: a };
    };
    D.objs.forEach((o) => {
      const per = o.comete ? D.L : D.orb[o.oi].n, debut = o.comete ? o.s * D.L / 8 : o.s;
      (D.rayons === 2 ? [0, per / 2] : [0]).forEach((dec, r) => {
        for (let tt = debut + dec; tt < debut + dec + D.L; tt += per) {
          const voix = r === 1 && D.voix2 ? 1 : 0;
          evs.push({ t: tt % D.L, note: o.comete ? NOTE_DING : o.c, voix: voix, o: o });
          if (o.lune) evs.push({ t: (tt + 1) % D.L, note: NOTE_LUNE, voix: voix, o: o, lune: true });
        }
      });
    });
    const recents = evs.filter((ev) => enJeu && t - ev.t >= 0 && t - ev.t < 0.6);
    const eclat = recents.length ? 1 - (t - recents[0].t) / 0.6 : 0;
    dessinerRayon(dg, cx, cy, 86, 14, false, false, eclat);
    if (D.rayons === 2) dessinerRayon(dg, cx, cy, 86, 14, true, !!D.voix2, eclat);
    D.orb.forEach((o) => { dg.strokeStyle = 'rgba(255,255,255,0.3)'; dg.lineWidth = 1.5; cercle(dg, cx, cy, o.r); dg.stroke(); });
    if (D.piste) { dg.setLineDash([4, 5]); dg.strokeStyle = 'rgba(170,235,255,0.6)'; cercle(dg, cx, cy, 80); dg.stroke(); dg.setLineDash([]); }
    (D.bloc || []).forEach((b) => {
      const p = posD({ oi: b.oi, s: b.s }, 0);
      for (let i = 0; i < 4; i++) { const a = p.a + (i - 1.5) * 0.18; dessinerCaillou(dg, cx + Math.cos(a) * D.orb[b.oi].r, cy + Math.sin(a) * D.orb[b.oi].r, 4.5, i); }
    });
    dessinerSoleil(dg, cx, cy, 14, eclat, null);
    // geste : la main amène le premier objet
    const premier = D.objs[0];
    D.objs.forEach((o, i) => {
      let p = posD(o, t), alpha = 1;
      if (i === 0 && d < tempsGeste) {
        const lerp = (a, b, m) => ({ x: a.x + (b.x - a.x) * m, y: a.y + (b.y - a.y) * m, a: 0 });
        const depart = { x: 255, y: 150 }, arrivee = posD(o, 0), f = d / tempsGeste;
        if (D.faux) {
          // la main essaie d'abord la place bloquée (croix rouge), puis va à la bonne place
          const faux = posD(D.faux, 0);
          if (f < 0.45) p = lerp(depart, faux, f / 0.45);
          else if (f < 0.62) {
            p = lerp(faux, faux, 0);
            dg.strokeStyle = '#ff5d5d'; dg.lineWidth = 3; dg.beginPath();
            dg.moveTo(faux.x - 8, faux.y - 8); dg.lineTo(faux.x + 8, faux.y + 8); dg.moveTo(faux.x + 8, faux.y - 8); dg.lineTo(faux.x - 8, faux.y + 8); dg.stroke();
          } else p = lerp(faux, arrivee, Math.min(1, (f - 0.62) / 0.3));
        } else p = lerp(depart, arrivee, Math.min(1, f * 1.3));
        alpha = 0.85;
        p.main = true;
      }
      const chanteEv = recents.find((ev) => ev.o === o && !ev.lune);
      const luneEv = recents.find((ev) => ev.o === o && ev.lune);
      const ch = chanteEv ? 1 - (t - chanteEv.t) / 0.6 : 0, lch = luneEv ? 1 - (t - luneEv.t) / 0.6 : 0;
      if (o.comete) dessinerComete(dg, p.x, p.y, 6, p.a + Math.PI / 2, { chante: ch, alpha: alpha });
      else dessinerPlanete(dg, p.x, p.y, 9, o.c, { chante: ch, lune: o.lune, luneChante: lch, alpha: alpha, angleLune: tempsAnim * 2.2, anneau: 'simple' });
      if (p.main) dessinerMain(dg, p.x + 4, p.y + 6, 0.6, true);
    });
    void premier;
    // mini partition
    const cible = new Map();
    evs.forEach((ev) => cible.set(ev.t + ':' + ev.note + ':' + ev.voix, ev));
    const lueurs = {};
    recents.forEach((ev) => { lueurs[ev.t + ':' + ev.note + ':' + ev.voix] = tempsAnim - (t - ev.t) * 0.3; });
    const ph = D.voix2 ? 50 : 34;
    dessinerPartition(dg, 6, H - ph - 4, W - 12, ph, D.L, !!D.voix2, cible, { t: enJeu ? t : null, lueurs: lueurs });
  }

        ligne.classList.add('ferme'); nom.textContent = tr('juke.inconnue'); b.textContent = '🔒'; b.disabled = true;
        b.setAttribute('aria-label', tr('juke.inconnue'));
      }
      ligne.appendChild(num); ligne.appendChild(b); ligne.appendChild(nom); liste.appendChild(ligne);
    });
  }
  function jouerJuke(i) {
    const niv = NIVEAUX[i];
    const ancienN = etat.n; etat.n = i;
    const cible = evenements(niv.sol, niv);
    etat.n = ancienN;
    etat.juke = { i: i, niv: niv, cible: cible, t: -0.3, tours: 0, lueurs: {} };
    document.querySelectorAll('.piste').forEach((p) => p.classList.toggle('joue', p.id === 'piste-' + i));
  }
  function majJuke(dt) {
    const j = etat.juke; if (!j) return;
    const avant = j.t;
    j.t += dt / (j.niv.L === 16 ? 0.34 : 0.5);
    for (let k = Math.floor(avant) + 1; k <= Math.floor(j.t); k++) {
      if (k < 0 || k >= j.niv.L) continue;
      j.cible.forEach((ev, cle) => { if (ev.t === k) { jouerNote(ev.note, ev.voix); j.lueurs[cle] = tempsAnim; } });
    }
    if (j.t >= j.niv.L) { j.tours++; j.t -= j.niv.L; if (j.tours >= 2) { etat.juke = null; document.querySelectorAll('.piste').forEach((p) => p.classList.remove('joue')); } }
  }
  function dessinerJuke() {
    const c = $('juke-partition'), r = c.getBoundingClientRect(), jg = c.getContext('2d');
    jg.clearRect(0, 0, r.width, r.height);
    const j = etat.juke;
    if (!j) {
      // petit système au repos
      dessinerSoleil(jg, r.width / 2, r.height / 2, 18, 0.1, null);
      for (let i = 0; i < 4; i++) { const a = tempsAnim * (0.9 - i * 0.18) + i * 1.7, R = 30 + i * 12; dessinerPlanete(jg, r.width / 2 + Math.cos(a) * R * 2.2, r.height / 2 + Math.sin(a) * R * 0.6, 8, i + 1, { anneau: prog.options.anneau }); }
      return;
    }
    dessinerPartition(jg, 6, 6, r.width - 12, r.height - 12, j.niv.L, !!j.niv.voix2, j.cible, { t: j.t, lueurs: j.lueurs });
  }

  // Atelier : anneaux et couleurs des planètes
  function ouvrirAtelier() {
    montrer('atelier');
    const total = totalEtoiles();
    $('atelier-total').textContent = '★ ' + total;
    const remplir = (id, liste, cleOption, prefixe) => {
      const boite = $(id); boite.innerHTML = '';
      liste.forEach((item) => {
        const b = document.createElement('button'); b.type = 'button';
        b.textContent = tr(prefixe + item.id);
        const ouvert = total >= item.min;
        if (!ouvert) { b.disabled = true; const s = document.createElement('small'); s.textContent = tr('atelier.verrou', { n: item.min }); b.appendChild(s); }
        b.setAttribute('aria-pressed', String(prog.options[cleOption] === item.id));
        b.addEventListener('click', () => { prog.options[cleOption] = item.id; sauverOptions(); sons.poser(); ouvrirAtelier(); });
        boite.appendChild(b);
      });
    };
    remplir('liste-anneaux', ANNEAUX, 'anneau', 'anneau.');
    remplir('liste-palettes', PALETTES, 'palette', 'palette.');
  }
  function dessinerAtelier() {
    const c = $('atelier-apercu'), r = c.getBoundingClientRect(), ag = c.getContext('2d');
    ag.clearRect(0, 0, r.width, r.height);
    const n = 6, sp = r.width / n;
    for (let i = 0; i < n; i++) {
      const x = sp * (i + 0.5), y = r.height / 2 + Math.sin(tempsAnim * 2 + i) * 6;
      const ch = Math.max(0, Math.sin(tempsAnim * 2.5 - i * 0.8)) > 0.92 ? 1 : 0;
      dessinerPlanete(ag, x, y, Math.min(18, sp * 0.22), i, { chante: ch });
    }
  }

  // ---------------------------------------------------------------------
  //  Boutons, son, toast
  // ---------------------------------------------------------------------

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.textContent = prog.options.son ? '🔊' : '🔇';
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', String(!prog.options.son));
    });
  }
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', () => {
    prog.options.son = !prog.options.son;
    if (prog.options.son) { audio(); sons.clic(); }
    sauverOptions(); majBoutonsSon();
  }));

  let minuteurToast = null;
  function toast(texte) {
    const t = $('toast'); t.textContent = texte; t.classList.add('actif');
    clearTimeout(minuteurToast); minuteurToast = setTimeout(() => t.classList.remove('actif'), 2600);
  }

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n - 1); },
      onNouvelle: () => demarrerNiveau(0)
    });
  });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-juke').addEventListener('click', () => { audio(); sons.clic(); ouvrirJuke(); });
  $('btn-atelier').addEventListener('click', () => { audio(); sons.clic(); ouvrirAtelier(); });
  ['niv-retour', 'juke-retour', 'atelier-retour'].forEach((id) => $(id).addEventListener('click', () => { sons.clic(); ouvrirTitre(); }));
  $('btn-ecouter').addEventListener('click', () => { if (etat.tutoMain) fermerTutoMain(); lancerEcoute(); });
  $('btn-tester').addEventListener('click', () => { if (etat.tutoMain) fermerTutoMain(); lancerTest(); });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie
  window.JEL_SAVE.surFermeture(() => {
    if (etat.enPartie && etat.ecran === 'jeu') sauver(etat.n + 1);
  });

  // ---------------------------------------------------------------------
  //  Boucle principale
  // ---------------------------------------------------------------------

  let derniere = performance.now();
  function boucle(maintenant) {
    const dt = Math.min(0.05, Math.max(0, (maintenant - derniere) / 1000));
    derniere = maintenant;
    if (!etat.pause) {
      tempsAnim += dt;
      if (etat.ecran === 'jeu') {
        avancerLecture(dt);
        majParticules(dt);
        if (etat.secousse > 0) etat.secousse = Math.max(0, etat.secousse - dt * 2.5);
      }
      if (etat.ecran === 'juke') majJuke(dt);
    }
    dessinerFond();
    if (etat.ecran === 'jeu') {
      dessinerJeu();
      if (etat.tutoMain) dessinerTutoMain();
    }
    if (etat.tutoCarte) dessinerDemo();
    if (etat.ecran === 'juke') dessinerJuke();
    if (etat.ecran === 'atelier') dessinerAtelier();
    requestAnimationFrame(boucle);
  }

  window.addEventListener('resize', redimensionner);
  chargerProgression();
  majBoutonsSon();
  ouvrirTitre();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
