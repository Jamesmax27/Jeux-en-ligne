  function dessinerSablier(ctx, x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#fff6d8'; ctx.strokeStyle = '#6b4a12'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 0, s * 0.75, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#d99a2b';
    ctx.beginPath(); ctx.moveTo(-s * 0.35, -s * 0.45); ctx.lineTo(s * 0.35, -s * 0.45); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s * 0.35, s * 0.45); ctx.lineTo(s * 0.35, s * 0.45); ctx.lineTo(0, 0); ctx.closePath(); ctx.stroke();
    ctx.restore();
  }
  function dessinerBallon(ctx, x, y, rr, h) {
    h = h || 0;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,' + (0.3 - Math.min(0.2, h * 0.15)) + ')';
    ellipse(ctx, x + rr * 0.3, y + rr * 0.5, rr * (1 - h * 0.25), rr * 0.6 * (1 - h * 0.25)); ctx.fill();
    const yy = y - h * rr * 3;
    const r2 = rr * (1 + h * 0.35);
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = Math.max(1, rr * 0.12);
    ctx.beginPath(); ctx.arc(x, yy, r2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1b1b1b';
    ctx.beginPath();
    for (let k = 0; k < 5; k++) {
      const a = -Math.PI / 2 + k * Math.PI * 2 / 5;
      const px = x + Math.cos(a) * r2 * 0.38, py = yy + Math.sin(a) * r2 * 0.38;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // Objet de vitrine : maillot, écharpe ou coupe.
  function dessinerObjet(ctx, o, S, gagne, dore) {
    ctx.clearRect(0, 0, S, S);
    ctx.save();
    if (dore) {
      const g = ctx.createRadialGradient(S / 2, S / 2, S * 0.1, S / 2, S / 2, S * 0.55);
      g.addColorStop(0, 'rgba(255,220,120,.45)'); g.addColorStop(1, 'rgba(255,220,120,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
    }
    const c1 = gagne ? o.c1 : '#2c3b52', c2 = gagne ? o.c2 : '#36465f';
    ctx.lineJoin = 'round'; ctx.lineWidth = S * 0.025; ctx.strokeStyle = gagne ? 'rgba(0,0,0,.45)' : '#23314a';
    if (o.type === 'maillot') {
      ctx.beginPath();
      ctx.moveTo(S * 0.36, S * 0.18); ctx.quadraticCurveTo(S * 0.5, S * 0.28, S * 0.64, S * 0.18);
      ctx.lineTo(S * 0.86, S * 0.3); ctx.lineTo(S * 0.78, S * 0.46); ctx.lineTo(S * 0.7, S * 0.42);
      ctx.lineTo(S * 0.7, S * 0.84); ctx.lineTo(S * 0.3, S * 0.84); ctx.lineTo(S * 0.3, S * 0.42);
      ctx.lineTo(S * 0.22, S * 0.46); ctx.lineTo(S * 0.14, S * 0.3); ctx.closePath();
      ctx.fillStyle = c1; ctx.fill();
      ctx.save(); ctx.clip();
      ctx.fillStyle = c2;
      if (o.rayures) for (let k = 0; k < 5; k++) ctx.fillRect(S * (0.24 + k * 0.12), 0, S * 0.05, S);
      else { ctx.fillRect(0, S * 0.18, S, S * 0.04); ctx.fillRect(S * 0.14, S * 0.4, S * 0.1, S * 0.08); ctx.fillRect(S * 0.76, S * 0.4, S * 0.1, S * 0.08); }
      ctx.restore();
      ctx.stroke();
      // écusson : petite étoile
      if (gagne) { ctx.fillStyle = c2; etoileCanvas(ctx, S * 0.6, S * 0.36, S * 0.05); ctx.fill(); }
    } else if (o.type === 'echarpe') {
      ctx.save();
      ctx.translate(S / 2, S / 2); ctx.rotate(-0.5);
      const w = S * 0.2, L = S * 0.78;
      for (let k = 0; k < 8; k++) {
        ctx.fillStyle = o.arcenciel && gagne ? ['#ff5f57', '#ff9a3d', '#ffd84a', '#3ccf7a', '#3d8bff', '#8e6cff', '#ff6fae', '#1fc2b5'][k] : (k % 2 ? c2 : c1);
        ctx.fillRect(-L / 2 + k * L / 8, -w / 2, L / 8 + 0.5, w);
      }
      ctx.strokeRect(-L / 2, -w / 2, L, w);
      ctx.strokeStyle = gagne ? c1 : '#2c3b52'; ctx.lineWidth = S * 0.018;
      for (let k = 0; k < 5; k++) {
        ctx.beginPath(); ctx.moveTo(-L / 2 + w * 0.15 + k * w * 0.17, w / 2); ctx.lineTo(-L / 2 + w * 0.15 + k * w * 0.17, w / 2 + S * 0.07); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(L / 2 - w * 0.15 - k * w * 0.17, -w / 2); ctx.lineTo(L / 2 - w * 0.15 - k * w * 0.17, -w / 2 - S * 0.07); ctx.stroke();
      }
      ctx.restore();
    } else {
      const k = o.taille || 1;
      ctx.translate(S / 2, S / 2); ctx.scale(k, k); ctx.translate(-S / 2, -S / 2);
      const grad = ctx.createLinearGradient(S * 0.3, 0, S * 0.7, 0);
      grad.addColorStop(0, c2); grad.addColorStop(0.45, c1); grad.addColorStop(1, c2);
      ctx.fillStyle = grad;
      // anses
      ctx.lineWidth = S * 0.045; ctx.strokeStyle = c2;
      ctx.beginPath(); ctx.arc(S * 0.3, S * 0.34, S * 0.1, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
      ctx.beginPath(); ctx.arc(S * 0.7, S * 0.34, S * 0.1, -Math.PI * 0.5, Math.PI * 0.5); ctx.stroke();
      if (o.grande) { ctx.beginPath(); ctx.arc(S * 0.26, S * 0.3, S * 0.14, Math.PI * 0.6, Math.PI * 1.4); ctx.stroke(); ctx.beginPath(); ctx.arc(S * 0.74, S * 0.3, S * 0.14, -Math.PI * 0.4, Math.PI * 0.4); ctx.stroke(); }
      ctx.lineWidth = S * 0.02; ctx.strokeStyle = gagne ? 'rgba(0,0,0,.4)' : '#23314a';
      ctx.beginPath();
      ctx.moveTo(S * 0.28, S * 0.2); ctx.lineTo(S * 0.72, S * 0.2);
      ctx.quadraticCurveTo(S * 0.7, S * 0.5, S * 0.54, S * 0.56); ctx.lineTo(S * 0.54, S * 0.68);
      ctx.lineTo(S * 0.46, S * 0.68); ctx.lineTo(S * 0.46, S * 0.56); ctx.quadraticCurveTo(S * 0.3, S * 0.5, S * 0.28, S * 0.2);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = gagne ? '#5b3a1c' : '#2a3850';
      rondRect(ctx, S * 0.34, S * 0.68, S * 0.32, S * 0.14, S * 0.03); ctx.fill(); ctx.stroke();
      if (gagne) { ctx.fillStyle = 'rgba(255,255,255,.55)'; etoileCanvas(ctx, S * 0.5, S * 0.34, S * 0.06); ctx.fill(); }
    }
    ctx.restore();
  }
  function etoileCanvas(ctx, x, y, r) {
    ctx.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 5;
      const rr = k % 2 ? r * 0.45 : r;
      if (k === 0) ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); else ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  }
  // Main qui montre le geste (tutoriel).
  function dessinerMain(ctx, x, y, s, appui) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(appui ? 0.88 : 1, appui ? 0.88 : 1);
    if (appui) {
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, s * 0.45, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = '#ffe0c2'; ctx.strokeStyle = '#7a4a2a'; ctx.lineWidth = Math.max(2, s * 0.05);
    rondRect(ctx, -s * 0.12, 0, s * 0.24, s * 0.55, s * 0.12); ctx.fill(); ctx.stroke();
    rondRect(ctx, -s * 0.2, s * 0.35, s * 0.62, s * 0.5, s * 0.2); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // ------------------------------------------------------------------------
  // Partie
  // ------------------------------------------------------------------------
  const plateau = $('plateau');
  const ctx = plateau.getContext('2d');
  let N = 0;                 // match en cours (à partir de 0)
  let etat = null;           // état du moteur
  let historique = [];       // pour « Annuler »
  let enPartie = false;      // match commencé et pas encore fini
  let occupe = false;        // animation en cours
  let enPause = false;
  let selection = -1;        // coéquipier choisi
  let modeLob = false;
  let curseur = null;        // case du curseur clavier
  let lay = { cs: 40, ox: 0, oy: 0, gh: 30, w: 300, h: 400, dpr: 1 };
  let vis = null;            // positions affichées (en cases)
  let anims = [];            // animations en cours
  let particules = [];
  let secousse = 0;
  let filet = 0;             // tremblement du filet
  let horloge = 0;           // temps du jeu (ms), arrêté pendant la pause
  let glisse = null;         // glissé en cours (pointeur)

  function synchro() {
    vis = {
      eq: etat.eq.map((j) => ({ x: j.c, y: j.r })),
      adv: etat.adv.map((a) => ({ x: a.c, y: a.r, penche: 0 })),
      gar: etat.gar ? { x: etat.gar.c, y: etat.gar.r } : null,
      porteur: etat.bal,
      balle: null, // { x, y, h } quand le ballon est en l'air ou roule
      voleur: null,
    };
  }

  function commencerNiveau(n) {
    N = n;
    etat = etatInitial(NIVEAUX[n]);
    historique = [];
    selection = -1; modeLob = false; curseur = null; occupe = false;
    particules = []; anims = []; filet = 0;
    synchro();
    enPartie = true;
    fermerVoiles();
    montrer('ecran-jeu');
    majHud();
    majMessage();
    jouerSon('sifflet');
    const niv = NIVEAUX[n];
    if (n === 0 && !prog.vus.includes('base')) ouvrirTuto(['base']);
    else if (niv.nouveau && !prog.vus.includes(niv.nouveau)) ouvrirTuto([niv.nouveau]);
  }

  function majHud() {
    const niv = NIVEAUX[N];
    $('nom-match').textContent = t('matchNom', { n: N + 1, stade: t('stade.' + stadeDe(N)) });
    $('objectif').innerHTML = SVG.etoile(true) + SVG.etoile(true) + SVG.etoile(true) + '<span></span>';
    $('objectif').lastChild.textContent = t('objectifPar', { n: niv.par });
    const c = $('compteur');
    if (etat.limite) {
      c.innerHTML = `<small></small>${nb(etat.tours)} / ${nb(etat.limite)}`;
      c.classList.toggle('alerte', etat.limite - etat.tours <= 2);
    } else {
      c.innerHTML = `<small></small>${nb(etat.tours)}`;
      c.classList.remove('alerte');
    }
    c.firstChild.textContent = t('tours');
    c.setAttribute('aria-label', etat.limite ? t('toursRestantsAria', { n: etat.tours, max: etat.limite }) : t('toursAria', { n: etat.tours }));
    const lob = $('btn-lob');
    lob.hidden = !niv.regles.includes('lob');
    lob.classList.toggle('actif', modeLob);
    lob.setAttribute('aria-pressed', modeLob ? 'true' : 'false');
    $('btn-annuler').disabled = historique.length === 0;
  }

  // Dangers : défenseurs dont la prochaine case est celle du porteur.
  function dangers(e) {
    const p = e.eq[e.bal];
    const res = [];
    e.adv.forEach((a, k) => { const n = prochaineCase(a); if (n && n[0] === p.c && n[1] === p.r) res.push(k); });
    const g = prochaineGardien(e);
    if (g && g[0] === p.c && g[1] === p.r) res.push('g');
    return res;
  }

  function dire(cleTexte, vars, genre) {
    const m = $('message');
    m.textContent = t(cleTexte, vars);
    m.className = genre || '';
  }
  function majMessage() {
    if (!etat) return;
    if (dangers(etat).length) { dire('msg.danger', null, 'danger'); return; }
    if (selection < 0) {
      if (tirs(etat).length) dire('msg.tirPossible', null, 'bon');
      else if (etat.limite && etat.limite - etat.tours <= 2) dire('msg.presqueFini', { n: etat.limite - etat.tours }, 'danger');
      else dire(N === 0 && etat.tours === 0 ? 'msg.debut' : 'msg.choisir');
      return;
    }
    const j = etat.eq[selection];
    if (selection === etat.bal) {
      if (tirs(etat).length) dire('msg.porteurTir', null, 'bon');
      else if (modeLob) dire(passes(etat, true).length ? 'msg.lobChoix' : 'msg.lobAucun');
      else dire('msg.porteur');
    } else if (!peutBouger(etat, selection)) dire('msg.repos');
    else if (etat.boue.has(cle(j.c, j.r))) dire('msg.dansBoue');
    else dire('msg.joueur');
  }

  // --- Disposition du plateau -----------------------------------------------
  function redimensionner() {
    const zone = $('zone-plateau');
    const w = zone.clientWidth, h = zone.clientHeight;
    if (!w || !h) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    plateau.width = Math.round(w * dpr); plateau.height = Math.round(h * dpr);
    const cs = Math.floor(Math.min((w - 12) / COLS, (h - 10) / (LIGNES + 0.9)));
    const gh = Math.round(cs * 0.9);
    lay = { cs, gh, w, h, dpr, ox: Math.round((w - cs * COLS) / 2), oy: Math.round((h - cs * LIGNES - gh) / 2) };
  }
  const cx = (c) => lay.ox + (c + 0.5) * lay.cs;
  const cy = (r) => lay.oy + lay.gh + (r + 0.5) * lay.cs;

  // --- Dessin du plateau ------------------------------------------------------
  function dessinerPlateau() {
    const { cs, gh, w, h, dpr, ox, oy } = lay;
    const th = STADES[stadeDe(N)];
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.save();
    if (secousse > 0) ctx.translate((Math.random() - 0.5) * secousse, (Math.random() - 0.5) * secousse);
    dessinerAutour(ctx, th, w, h, ox, oy, cs * COLS, cs * LIGNES + gh);
    // pelouse rayée
    const py = oy + gh;
    for (let r = 0; r < LIGNES; r++) { ctx.fillStyle = th.herbe[r % 2]; ctx.fillRect(ox, py + r * cs, cs * COLS, cs); }
    // derrière le but
    ctx.fillStyle = th.herbe[1]; ctx.fillRect(ox, oy, cs * COLS, gh);
    // lignes à la craie
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = Math.max(2, cs * 0.05);
    ctx.strokeRect(ox + 1, py, cs * COLS - 2, cs * LIGNES);
    ctx.strokeRect(ox + cs * 1, py, cs * 5, cs * 3);
    ctx.strokeRect(ox + cs * 2, py, cs * 3, cs * 1.3);
    ctx.beginPath(); ctx.arc(ox + cs * 3.5, py + cs * 2.1, cs * 1.25, Math.asin(0.72), Math.PI - Math.asin(0.72)); ctx.stroke();
    ctx.beginPath(); ctx.arc(ox + cs * 3.5, py + cs * LIGNES, cs * 1.4, Math.PI, 2 * Math.PI); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(ox + cs * 3.5, py + cs * 2.1, cs * 0.06, 0, Math.PI * 2); ctx.fill();
    // quadrillage du tableau
    ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.lineWidth = 1;
    for (let c = 1; c < COLS; c++) { ctx.beginPath(); ctx.moveTo(ox + c * cs, py); ctx.lineTo(ox + c * cs, py + cs * LIGNES); ctx.stroke(); }
    for (let r = 1; r < LIGNES; r++) { ctx.beginPath(); ctx.moveTo(ox, py + r * cs); ctx.lineTo(ox + cs * COLS, py + r * cs); ctx.stroke(); }
    dessinerBut(ctx, ox + cs * BUT_MIN, oy, cs * (BUT_MAX - BUT_MIN + 1), gh, filet);
    // boue
    etat.boue.forEach((k) => { const [c, r] = k.split(',').map(Number); dessinerBoue(ctx, cx(c), cy(r), cs, c * 7 + r * 3); });
    // zones des coupeurs (d'après les positions affichées)
    const zoneVis = new Set();
    vis.adv.forEach((a, k) => {
      if (etat.adv[k].type !== 'c') return;
      const c = Math.round(a.x), r = Math.round(a.y);
      [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dc, dr]) => { if (dans(c + dc, r + dr)) zoneVis.add(cle(c + dc, r + dr)); });
    });
    zoneVis.forEach((k) => {
      const [c, r] = k.split(',').map(Number);
      ctx.fillStyle = 'rgba(255,150,40,.28)';
      ctx.fillRect(ox + c * cs + 2, py + r * cs + 2, cs - 4, cs - 4);
      ctx.strokeStyle = 'rgba(255,170,60,.75)'; ctx.setLineDash([4, 3]); ctx.lineWidth = 1.5;
      ctx.strokeRect(ox + c * cs + 3, py + r * cs + 3, cs - 6, cs - 6); ctx.setLineDash([]);
    });
    if (!occupe && enPartie) dessinerAides();
    // joueurs
    if (vis.gar) dessinerJoueur(ctx, cx(vis.gar.x), cy(vis.gar.y), cs, { equipe: 'gardien' });
    vis.adv.forEach((a, k) => dessinerJoueur(ctx, cx(a.x), cy(a.y), cs, { equipe: 'raye', coupeur: etat.adv[k].type === 'c', penche: a.penche }));
    vis.eq.forEach((j, i) => {
      const x = cx(j.x), y = cy(j.y);
      if (i === selection && !occupe) {
        ctx.save();
        ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(x, y, cs * 0.46 + Math.sin(horloge / 160) * 1.5, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
      dessinerJoueur(ctx, x, y, cs, { equipe: 'bleu', fatigue: etat.eq[i].fat, repos: !occupe && !peutBouger(etat, i) });
    });
    // flèches des défenseurs (au-dessus des joueurs pour rester visibles)
    if (!occupe && enPartie) {
      etat.adv.forEach((a) => { const n = prochaineCase(a); if (n) dessinerFleche(ctx, cx(a.c), cy(a.r), cx(n[0]), cy(n[1]), cs, '#ff4b3e'); });
      const g = prochaineGardien(etat);
      if (g) dessinerFleche(ctx, cx(etat.gar.c), cy(0), cx(g[0]), cy(0), cs, '#c8ff3a');
    }
    // ballon
    if (vis.balle) dessinerBallon(ctx, cx(vis.balle.x), cy(vis.balle.y), cs * 0.13, vis.balle.h || 0);
    else if (vis.voleur !== null) {
      const v = vis.voleur === 'g' ? vis.gar : vis.adv[vis.voleur];
      dessinerBallon(ctx, cx(v.x) + cs * 0.22, cy(v.y) + cs * 0.24, cs * 0.13);
    } else {
      const p = vis.eq[vis.porteur];
      dessinerBallon(ctx, cx(p.x) + cs * 0.2, cy(p.y) + cs * 0.26, cs * 0.13);
    }
    // danger : le porteur est visé
    if (!occupe && enPartie && dangers(etat).length) {
      const p = etat.eq[etat.bal];
      ctx.save();
      ctx.strokeStyle = 'rgba(255,60,50,' + (0.55 + 0.4 * Math.sin(horloge / 120)) + ')'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(cx(p.c), cy(p.r), cs * 0.5, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    dessinerMeteo(ctx, th, w, h);
    // particules
    particules.forEach((p) => {
      ctx.save(); ctx.globalAlpha = Math.max(0, p.vie); ctx.fillStyle = p.couleur;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.etoile) { etoileCanvas(ctx, 0, 0, p.taille); ctx.fill(); } else ctx.fillRect(-p.taille / 2, -p.taille / 4, p.taille, p.taille / 2);
      ctx.restore();
    });
    // curseur du clavier
    if (curseur && !occupe) {
      ctx.save();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.setLineDash([6, 4]);
      if (curseur.r < 0) ctx.strokeRect(ox + BUT_MIN * cs + 2, oy + 2, cs * 3 - 4, gh - 4);
      else ctx.strokeRect(ox + curseur.c * cs + 3, py + curseur.r * cs + 3, cs - 6, cs - 6);
      ctx.restore();
    }
    ctx.restore();
  }

  // Cases et lignes proposées pour le joueur choisi.
  function dessinerAides() {
    const { cs } = lay;
    if (selection < 0) return;
    deplacements(etat, selection).forEach((m) => {
      ctx.fillStyle = m.cout === 2 ? 'rgba(170,120,60,.9)' : 'rgba(120,255,170,.9)';
      ctx.strokeStyle = 'rgba(10,60,30,.6)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx(m.c), cy(m.r), cs * 0.13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    });
    if (selection !== etat.bal) return;
    const p = etat.eq[etat.bal];
    passes(etat, modeLob).forEach((pa) => {
      const q = etat.eq[pa.cible];
      ctx.save();
      ctx.strokeStyle = modeLob ? 'rgba(255,240,150,.95)' : 'rgba(255,211,77,.95)'; ctx.lineWidth = 3; ctx.setLineDash([7, 6]);
      ctx.lineDashOffset = -horloge / 40;
      ctx.beginPath();
      if (modeLob) {
        const mx = (cx(p.c) + cx(q.c)) / 2, my = (cy(p.r) + cy(q.r)) / 2 - cs * 1.2;
        ctx.moveTo(cx(p.c), cy(p.r)); ctx.quadraticCurveTo(mx, my, cx(q.c), cy(q.r));
      } else { ctx.moveTo(cx(p.c), cy(p.r)); ctx.lineTo(cx(q.c), cy(q.r)); }
      ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx(q.c), cy(q.r), cs * 0.44, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    });
    tirs(etat).forEach((tr) => {
      const fin = tr.chemin[tr.chemin.length - 1];
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 3; ctx.setLineDash([5, 5]); ctx.lineDashOffset = -horloge / 30;
      ctx.beginPath(); ctx.moveTo(cx(p.c), cy(p.r)); ctx.lineTo(cx(fin[0]), lay.oy + lay.gh * 0.45); ctx.stroke();
      ctx.restore();
    });
  }

  function dessinerFleche(c2, x1, y1, x2, y2, cs, couleur) {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
    if (!L) return;
    const ux = dx / L, uy = dy / L;
    const a = { x: x1 + ux * cs * 0.3, y: y1 + uy * cs * 0.3 }, b = { x: x2 - ux * cs * 0.18, y: y2 - uy * cs * 0.18 };
    c2.save();
    c2.strokeStyle = couleur; c2.fillStyle = couleur; c2.lineWidth = Math.max(3, cs * 0.08); c2.lineCap = 'round';
    c2.shadowColor = 'rgba(0,0,0,.35)'; c2.shadowBlur = 3;
    c2.beginPath(); c2.moveTo(a.x, a.y); c2.lineTo(b.x - ux * cs * 0.12, b.y - uy * cs * 0.12); c2.stroke();
    c2.beginPath();
    c2.moveTo(b.x, b.y);
    c2.lineTo(b.x - ux * cs * 0.2 - uy * cs * 0.13, b.y - uy * cs * 0.2 + ux * cs * 0.13);
    c2.lineTo(b.x - ux * cs * 0.2 + uy * cs * 0.13, b.y - uy * cs * 0.2 - ux * cs * 0.13);
    c2.closePath(); c2.fill();
    c2.restore();
  }
  function dessinerBut(c2, x, y, w, h, tremble) {
    c2.save();
    const d = tremble > 0 ? Math.sin(horloge / 25) * tremble * 3 : 0;
    c2.fillStyle = 'rgba(255,255,255,.12)'; c2.fillRect(x, y + 2, w, h - 2);
    c2.strokeStyle = 'rgba(255,255,255,.55)'; c2.lineWidth = 1;
    for (let k = 1; k < 10; k++) { c2.beginPath(); c2.moveTo(x + (w * k) / 10 + d, y + 3); c2.lineTo(x + (w * k) / 10 - d, y + h); c2.stroke(); }
    for (let k = 1; k < 4; k++) { c2.beginPath(); c2.moveTo(x, y + (h * k) / 4 + d); c2.lineTo(x + w, y + (h * k) / 4 - d); c2.stroke(); }
    c2.strokeStyle = '#ffffff'; c2.lineWidth = Math.max(4, h * 0.12); c2.lineCap = 'round';
    c2.beginPath(); c2.moveTo(x, y + h); c2.lineTo(x, y + 3); c2.lineTo(x + w, y + 3); c2.lineTo(x + w, y + h); c2.stroke();
    c2.restore();
  }
  function dessinerBoue(c2, x, y, cs, graine) {
    c2.save();
    c2.fillStyle = '#7a5332';
    c2.beginPath();
    for (let k = 0; k < 9; k++) {
      const a = (k / 9) * Math.PI * 2;
      const rr = cs * (0.4 + 0.06 * Math.sin(graine + k * 2.1));
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr * 0.9;
      if (k === 0) c2.moveTo(px, py); else c2.quadraticCurveTo(x + Math.cos(a - 0.35) * rr * 1.1, y + Math.sin(a - 0.35) * rr, px, py);
    }
    c2.closePath(); c2.fill();
    c2.fillStyle = '#5e3e23';
    ellipse(c2, x - cs * 0.1, y + cs * 0.05, cs * 0.14, cs * 0.08); c2.fill();
    ellipse(c2, x + cs * 0.15, y - cs * 0.1, cs * 0.08, cs * 0.05); c2.fill();
    c2.fillStyle = 'rgba(255,255,255,.25)';
    ellipse(c2, x + cs * 0.08, y + cs * 0.16, cs * 0.07, cs * 0.03); c2.fill();
    c2.restore();
  }
  // Décor autour du terrain selon le stade.
  function dessinerAutour(c2, th, w, h, ox, oy, bw, bh) {
    c2.fillStyle = th.autour; c2.fillRect(0, 0, w, h);
    if (th.deco === 'pre') {
      // fleurs et clôture en bois
      for (let k = 0; k < 60; k++) {
        const x = (k * 97) % w, y = (k * 53 + (k % 7) * 31) % h;
        if (x > ox - 6 && x < ox + bw + 6 && y > oy - 6 && y < oy + bh + 6) continue;
        c2.fillStyle = ['#fff', '#ffe066', '#ff9ec4'][k % 3];
        c2.beginPath(); c2.arc(x, y, 2.5, 0, Math.PI * 2); c2.fill();
      }
      c2.strokeStyle = '#8a5a2b'; c2.lineWidth = 3;
      c2.strokeRect(ox - 5, oy - 5, bw + 10, bh + 10);
    } else {
      // tribunes : public en points de couleur
      const couleurs = th.deco === 'nuit' ? ['#3b4a7a', '#6c5bd6', '#2f3b66', '#ffd34d'] : th.deco === 'pluie' ? ['#55637a', '#6d7c95', '#3d8bff', '#ffd34d'] : ['#ff5f57', '#ffd34d', '#ffffff', '#3d8bff', '#3ccf7a'];
      for (let y = 4; y < h; y += 9) {
        for (let x = 4 + ((y / 9) % 2) * 4; x < w; x += 9) {
          if (x > ox - 8 && x < ox + bw + 8 && y > oy - 8 && y < oy + bh + 8) continue;
          c2.fillStyle = couleurs[(x * 7 + y * 13) % couleurs.length];
          c2.globalAlpha = 0.55;
          c2.beginPath(); c2.arc(x, y, 2.6, 0, Math.PI * 2); c2.fill();
        }
      }
      c2.globalAlpha = 1;
      c2.fillStyle = 'rgba(0,0,0,.35)'; c2.fillRect(ox - 6, oy - 6, bw + 12, bh + 12);
    }
  }
  function dessinerMeteo(c2, th, w, h) {
    if (th.deco === 'pluie') {
      c2.save();
      c2.strokeStyle = 'rgba(200,220,255,.35)'; c2.lineWidth = 1.5;
      for (let k = 0; k < 70; k++) {
        const x = ((k * 61 + horloge * 0.05) % (w + 40)) - 20;
        const y = ((k * 113 + horloge * 0.5) % (h + 40)) - 20;
        c2.beginPath(); c2.moveTo(x, y); c2.lineTo(x - 4, y + 12); c2.stroke();
      }
      c2.restore();
    } else if (th.deco === 'nuit') {
      c2.save();
      [[0, 0], [w, 0], [0, h], [w, h]].forEach(([x, y]) => {
        const g = c2.createRadialGradient(x, y, 0, x, y, Math.max(w, h) * 0.55);
        g.addColorStop(0, 'rgba(255,250,220,.22)'); g.addColorStop(1, 'rgba(255,250,220,0)');
        c2.fillStyle = g; c2.fillRect(0, 0, w, h);
      });
      c2.restore();
    }
  }

  // --- Animations ---------------------------------------------------------------
  // Une étape : { duree, maj(p), fin() } ; les étapes se suivent.
  function lancerEtapes(etapes, fin) {
    occupe = true;
    anims = etapes.map((e) => Object.assign({ ecoule: 0, debute: false }, e));
    anims.finAll = fin;
  }
  function avancerAnims(dt) {
    if (!anims.length) return;
    const e = anims[0];
    if (!e.debute) { e.debute = true; if (e.debut) e.debut(); }
    e.ecoule += dt;
    const p = Math.min(1, e.ecoule / e.duree);
    if (e.maj) e.maj(p);
    if (p >= 1) {
      if (e.fin) e.fin();
      const finAll = anims.finAll;
      anims.shift();
      anims.finAll = finAll;
      if (!anims.length) { occupe = false; if (finAll) finAll(); }
    }
  }
  const lisse = (p) => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

  function etapesDepuis(ev) {
    const etapes = [];
    let i = 0;
    while (i < ev.length) {
      const e = ev[i];
      if (e.type === 'dep') {
        const j = e.i;
        etapes.push({ duree: 200, debut: () => jouerSon(e.boue ? 'boue' : 'pas'),
          maj: (p) => { const q = lisse(p); vis.eq[j].x = e.de[0] + (e.a[0] - e.de[0]) * q; vis.eq[j].y = e.de[1] + (e.a[1] - e.de[1]) * q; },
          fin: () => { if (e.boue) eclabousser(e.a); } });
        i++;
      } else if (e.type === 'passe' || e.type === 'lob') {
        const lob = e.type === 'lob';
        const a = etat.eq[e.de], b = etat.eq[e.a];
        etapes.push({ duree: lob ? 560 : 280, debut: () => jouerSon(lob ? 'lob' : 'passe'),
          maj: (p) => { const q = lob ? p : lisse(p); vis.balle = { x: a.c + (b.c - a.c) * q, y: a.r + (b.r - a.r) * q, h: lob ? Math.sin(Math.PI * p) * 1.3 : 0 }; },
          fin: () => { vis.balle = null; vis.porteur = e.a; } });
        i++;
      } else if (e.type === 'tir') {
        const ch = [e.de].concat(e.chemin);
        etapes.push({ duree: 380, debut: () => jouerSon('tir'),
          maj: (p) => {
            const L = ch.length - 1, s = p * L, k = Math.min(L - 1, Math.floor(s)), f = s - k;
            vis.balle = { x: ch[k][0] + (ch[k + 1][0] - ch[k][0]) * f, y: ch[k][1] + (ch[k + 1][1] - ch[k][1]) * f, h: 0 };
          },
          fin: () => { filet = 1; jouerSon('but'); confettis(); } });
        etapes.push({ duree: 700 });
        i++;
      } else if (e.type === 'manche') {
        // tous les pas de défense de ce tour en même temps
        const groupe = [];
        i++;
        while (i < ev.length && ['pas', 'attend', 'gardien', 'vol'].includes(ev[i].type)) groupe.push(ev[i++]);
        if (!groupe.length) { etapes.push({ duree: 120 }); continue; }
        const vol = groupe.find((g) => g.type === 'vol');
        etapes.push({ duree: 260, debut: () => jouerSon(groupe.some((g) => g.type === 'gardien') ? 'gardien' : 'defense'),
          maj: (p) => {
            const q = lisse(p);
            groupe.forEach((g) => {
              if (g.type === 'pas' || (g.type === 'vol' && g.k !== 'g')) { const v = vis.adv[g.k]; v.x = g.de[0] + (g.a[0] - g.de[0]) * q; v.y = g.de[1] + (g.a[1] - g.de[1]) * q; }
              else if (g.type === 'gardien' || (g.type === 'vol' && g.k === 'g')) { vis.gar.x = g.de[0] + (g.a[0] - g.de[0]) * q; }
              else if (g.type === 'attend') vis.adv[g.k].penche = Math.sin(p * Math.PI * 4) * 0.15;
            });
          },
          fin: () => { if (vol) { vis.voleur = vol.k; secousse = 10; jouerSon('vol'); } } });
        if (vol) etapes.push({ duree: 650 });
      } else i++;
    }
    return etapes;
  }

  function confettis() {
    const x0 = lay.ox + lay.cs * 3.5, y0 = lay.oy + lay.gh;
    for (let k = 0; k < 70; k++) {
      particules.push({ x: x0, y: y0, vx: (Math.random() - 0.5) * 7, vy: -Math.random() * 6 - 1, vie: 1.6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
        taille: 6 + Math.random() * 6, couleur: ['#ffd34d', '#ff5f57', '#3d8bff', '#3ccf7a', '#ffffff', '#ff9ec4'][k % 6], etoile: k % 5 === 0 });
    }
  }
  function eclabousser(caseB) {
    for (let k = 0; k < 14; k++) {
      particules.push({ x: cx(caseB[0]), y: cy(caseB[1]), vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 3, vie: 0.7, rot: 0, vr: 0.2, taille: 5, couleur: '#6b4528' });
    }
  }
  function etincelles(caseB) {
    for (let k = 0; k < 12; k++) {
      particules.push({ x: cx(caseB[0]), y: cy(caseB[1]), vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, vie: 0.6, rot: Math.random() * 6, vr: 0.3, taille: 7, couleur: '#ffd34d', etoile: true });
    }
  }

  // --- Actions du joueur ----------------------------------------------------------
  function executer(action) {
    const r = jouer(etat, action);
    if (!r) { jouerSon('erreur'); return false; }
    historique.push(etat);
    selection = -1;
    if (action.type === 'passe' && action.lob) modeLob = false;
    lancerEtapes(etapesDepuis(r.ev), () => {
      etat = r.etat;
      synchro();
      if (r.fin === 'vol') vis.voleur = r.ev.filter((e) => e.type === 'vol')[0].k;
      if (r.fin === 'but') { const ch = r.ev[0].chemin; vis.balle = { x: ch[ch.length - 1][0], y: -0.55, h: 0 }; }
      majHud();
      if (r.fin === 'but') victoire();
      else if (r.fin) defaite(r.fin);
      else {
        majMessage();
        if (action.type === 'passe') etincelles([etat.eq[etat.bal].c, etat.eq[etat.bal].r]);
      }
    });
    majHud();
    return true;
  }

  // Toucher (ou Entrée) sur une case du plateau (r = -1 : le but).
  function toucherCase(c, r) {
    if (!enPartie || occupe || enPause || ouverteTuto) return;
    if (r < 0) {
      const ts = tirs(etat);
      if (!ts.length) {
        jouerSon('erreur');
        dire(selection === etat.bal || selection < 0 ? (etat.eq[etat.bal].r > PORTEE_TIR ? 'msg.tropLoin' : 'msg.tirBouche') : 'msg.tirBouche', null, 'danger');
        return;
      }
      // tir dont la sortie est la plus proche de l'endroit touché
      ts.sort((a, b) => Math.abs(a.chemin[a.chemin.length - 1][0] - c) - Math.abs(b.chemin[b.chemin.length - 1][0] - c));
      executer({ type: 'tir', dc: ts[0].dc });
      return;
    }
    if (!dans(c, r)) return;
    const o = occupant(etat, c, r);
    if (selection >= 0) {
      if (o && o.k === 'e') {
        if (o.i === selection) { selection = -1; jouerSon('clic'); majMessage(); return; }
        if (selection === etat.bal) {
          const pa = passes(etat, modeLob).find((x) => x.cible === o.i);
          if (pa) { executer({ type: 'passe', cible: o.i, lob: modeLob }); return; }
          if (!modeLob && NIVEAUX[N].regles.includes('lob') && passes(etat, true).find((x) => x.cible === o.i)) {
            jouerSon('erreur'); dire('msg.essaieLob', null, 'danger'); return;
          }
          // passe impossible : on choisit ce joueur à la place (pour le déplacer)
          selection = o.i; jouerSon('erreur'); dire(modeLob ? 'msg.lobImpossible' : 'msg.passeImpossible', null, 'danger');
          return;
        }
        selection = o.i; jouerSon('choix'); majMessage(); return;
      }
      if (!o) {
        const m = deplacements(etat, selection).find((x) => x.c === c && x.r === r);
        if (m) { executer({ type: 'dep', i: selection, c, r }); return; }
        jouerSon('erreur');
        dire(peutBouger(etat, selection) ? 'msg.uneCase' : 'msg.repos', null, 'danger');
        return;
      }
      selection = -1;
    }
    if (o && o.k === 'e') { selection = o.i; jouerSon('choix'); majMessage(); return; }
    if (o && o.k === 'a') { jouerSon('clic'); dire(etat.adv[o.i].type === 'c' ? 'msg.coupeur' : (etat.adv[o.i].ch.length > 1 ? 'msg.defenseur' : 'msg.defenseurFixe')); return; }
    if (o && o.k === 'g') { jouerSon('clic'); dire('msg.gardien'); return; }
    if (etat.boue.has(cle(c, r))) { dire('msg.boue'); return; }
    majMessage();
  }

  function caseSous(ev) {
    const b = plateau.getBoundingClientRect();
    const x = ev.clientX - b.left, y = ev.clientY - b.top;
    const { cs, gh, ox, oy } = lay;
    if (y >= oy - 6 && y < oy + gh && x >= ox + BUT_MIN * cs && x < ox + (BUT_MAX + 1) * cs) return { c: Math.floor((x - ox) / cs), r: -1 };
    const c = Math.floor((x - ox) / cs), r = Math.floor((y - oy - gh) / cs);
    if (!dans(c, r)) return null;
    return { c, r };
  }
  plateau.addEventListener('pointerdown', (ev) => {
    ouvrirAudio();
    curseur = null;
    const k = caseSous(ev);
    glisse = k ? { depart: k } : null;
  });
  plateau.addEventListener('pointerup', (ev) => {
    const k = caseSous(ev);
    const g = glisse;
    glisse = null;
    if (!k) return;
    if (!g || (g.depart.c === k.c && g.depart.r === k.r)) { toucherCase(k.c, k.r); return; }
    // glissé : du joueur de départ vers la case d'arrivée
    if (!enPartie || occupe || enPause) return;
    const o = g.depart.r >= 0 ? occupant(etat, g.depart.c, g.depart.r) : null;
    if (o && o.k === 'e') { selection = o.i; toucherCase(k.c, k.r); }
  });
  plateau.addEventListener('pointercancel', () => { glisse = null; });

  function annuler() {
    if (!enPartie || occupe || !historique.length) return;
    etat = historique.pop();
    selection = -1; modeLob = false;
    synchro(); majHud(); majMessage();
    jouerSon('clic');
  }
  function basculerLob() {
    if (!enPartie || occupe || !NIVEAUX[N].regles.includes('lob')) return;
    modeLob = !modeLob;
    if (modeLob) selection = etat.bal;
    jouerSon('choix');
    majHud(); majMessage();
  }

  // --- Fins de match ---------------------------------------------------------------
  function etoilesPour(tours, par) { return tours <= par ? 3 : tours <= par + 2 ? 2 : 1; }

  function victoire() {
    enPartie = false;
    dire('victoire.titre', null, 'bon');
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: N + 1 });
    const niv = NIVEAUX[N];
    const e = etoilesPour(etat.tours, niv.par);
    const avant = prog.etoiles[N] || 0;
    const dejaGagne = avant > 0;
    const ancienRecord = prog.records[N] || 0;
    const nouveauRecord = !ancienRecord || etat.tours < ancienRecord;
    prog.etoiles[N] = Math.max(avant, e);
    if (nouveauRecord) prog.records[N] = etat.tours;
    for (let k = 0; k < NIVEAUX.length; k++) if (prog.etoiles[k] === undefined || prog.etoiles[k] === null) prog.etoiles[k] = 0;
    const suivant = Math.min(NIVEAUX.length, N + 2);
    prog.niveau = Math.max(prog.niveau, suivant);
    try { JEL_SAVE.save(JEU, donneesSauvegarde(N + 2 > NIVEAUX.length ? NIVEAUX.length : N + 2)); } catch (er) { /* sauvegarde indisponible */ }
    setTimeout(() => {
      $('titre-fin').textContent = t('victoire.titre');
      const zoneE = $('fin-etoiles');
      zoneE.innerHTML = SVG.etoile(e >= 1) + SVG.etoile(e >= 2) + SVG.etoile(e >= 3);
      [...zoneE.children].forEach((s, k) => setTimeout(() => { s.classList.add('vue'); if (k < e) jouerSon('etoile', k); }, 250 + k * 300));
      zoneE.setAttribute('aria-label', t('etoilesAria', { n: e }));
      $('fin-texte').textContent = t('victoire.texte', { n: etat.tours }) + ' ' + (e < 3 ? t('victoire.conseil', { n: niv.par }) : t('victoire.parfait'));
      $('fin-record').textContent = nouveauRecord ? (ancienRecord ? t('record.nouveau', { n: etat.tours }) : t('record.premier', { n: etat.tours })) : t('record.ancien', { n: ancienRecord });
      const cadeau = $('fin-cadeau');
      cadeau.innerHTML = '';
      if (!dejaGagne || (e >= 3 && avant < 3)) {
        const d = document.createElement('div');
        d.className = 'cadeau';
        const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128;
        dessinerObjet(cv.getContext('2d'), OBJETS[N], 128, true, e >= 3);
        const sp = document.createElement('span');
        sp.textContent = !dejaGagne ? t('cadeau.' + OBJETS[N].type) : t('cadeau.dore');
        d.append(cv, sp);
        cadeau.appendChild(d);
      }
      const bs = $('fin-boutons');
      bs.innerHTML = '';
      if (N < NIVEAUX.length - 1) ajouterBouton(bs, 'niveauSuivant', 'principal', () => commencerNiveau(N + 1));
      else ajouterBouton(bs, 'bilan.voir', 'principal', afficherBilan);
      ajouterBouton(bs, 'rejouer', '', () => commencerNiveau(N));
      ajouterBouton(bs, 'niveaux', '', afficherNiveaux);
      ouvrirVoile('voile-fin');
    }, 650);
  }

  function defaite(raison) {
    enPartie = false;
    dire(raison === 'temps' ? 'defaite.tempsTitre' : 'defaite.volTitre', null, 'danger');
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: N + 1 });
    if (raison === 'temps') jouerSon('siffletFin');
    setTimeout(() => {
      jouerSon('rate');
      $('titre-fin').textContent = t(raison === 'temps' ? 'defaite.tempsTitre' : 'defaite.volTitre');
      $('fin-etoiles').innerHTML = SVG.etoile(false) + SVG.etoile(false) + SVG.etoile(false);
      [...$('fin-etoiles').children].forEach((s) => s.classList.add('vue'));
      $('fin-etoiles').setAttribute('aria-label', t('etoilesAria', { n: 0 }));
      $('fin-texte').textContent = raison === 'temps' ? t('defaite.temps', { n: etat.limite }) : t('defaite.vol');
      const rec = prog.records[N] || 0;
      $('fin-record').textContent = rec ? t('record.ancien', { n: rec }) : t('record.aucun');
      $('fin-cadeau').innerHTML = '';
      const bs = $('fin-boutons');
      bs.innerHTML = '';
      ajouterBouton(bs, 'reessayer', 'principal', () => commencerNiveau(N));
      ajouterBouton(bs, 'annulerCoup', '', () => {
        fermerVoiles();
        enPartie = true;
        annuler();
      });
      ajouterBouton(bs, 'niveaux', '', afficherNiveaux);
      ouvrirVoile('voile-fin');
    }, raison === 'temps' ? 900 : 500);
  }

  function afficherBilan() {
    $('titre-fin').textContent = t('bilan.titre');
    const tot = totalEtoiles();
    $('fin-etoiles').innerHTML = SVG.etoile(true);
    [...$('fin-etoiles').children].forEach((s) => s.classList.add('vue'));
    $('fin-texte').textContent = t('bilan.texte', { n: tot, max: NIVEAUX.length * 3 });

    c2.strokeRect(bx + cs, by + 4, cs * 5, bh * 0.3);
    c2.strokeRect(bx + cs * 2, by + 4, cs * 3, bh * 0.13);
    c2.beginPath(); c2.arc(bx + bw / 2, by + bh - 4, cs * 1.4, Math.PI, Math.PI * 2); c2.stroke();
    // but
    dessinerBut(c2, bx + cs * 2, by - cs * 0.9, cs * 3, cs * 0.9 + 4, 0);
    // flèches à la craie (le plan de jeu)
    const P = (c, r) => [bx + (c + 0.5) * cs, by + (r + 0.5) * (bh / 9)];
    const craie = (pts, couleur) => {
      c2.save(); c2.strokeStyle = couleur; c2.lineWidth = 4; c2.setLineDash([10, 7]); c2.lineCap = 'round';
      c2.beginPath(); c2.moveTo(...P(...pts[0])); c2.quadraticCurveTo(...P(...pts[1]), ...P(...pts[2])); c2.stroke();
      c2.setLineDash([]);
      const [x2, y2] = P(...pts[2]), [x1, y1] = P(...pts[1]);
      const ang = Math.atan2(y2 - y1, x2 - x1);
      c2.fillStyle = couleur; c2.beginPath(); c2.moveTo(x2, y2);
      c2.lineTo(x2 - Math.cos(ang - 0.45) * 18, y2 - Math.sin(ang - 0.45) * 18); c2.lineTo(x2 - Math.cos(ang + 0.45) * 18, y2 - Math.sin(ang + 0.45) * 18); c2.closePath(); c2.fill();
      c2.restore();
    };
    craie([[3, 7.6], [0.6, 6.6], [1, 4.4]], '#ffffff');
    craie([[1, 4.2], [3.6, 3.2], [5, 2.2]], '#ffffff');
    craie([[5, 2], [4.6, 0.6], [3.4, -0.5]], '#ffd34d');
    // défenseurs et leurs flèches
    [[2, 5, [2, 4]], [4, 3, [3, 3]], [3, 1.4, [2.2, 1.4]]].forEach(([c, r, n]) => dessinerFleche(c2, ...P(c, r), ...P(n[0], n[1]), cs, '#ff4b3e'));
    [[2, 5], [4, 3], [3, 1.4]].forEach(([c, r]) => dessinerJoueur(c2, ...P(c, r), cs * 0.95, { equipe: 'raye', coupeur: r === 3 }));
    dessinerJoueur(c2, ...P(3, -0.25), cs * 0.9, { equipe: 'gardien' });
    [[3, 7.6], [1, 4.2], [5, 2]].forEach(([c, r]) => dessinerJoueur(c2, ...P(c, r), cs * 0.95, { equipe: 'bleu' }));
    const [bxx, byy] = P(3, 7.6);
    dessinerBallon(c2, bxx + cs * 0.22, byy + cs * 0.26, cs * 0.15);
    // coupe et écharpe au pied du tableau
    const s = Math.min(w * 0.3, 150);
    const tmp = document.createElement('canvas'); tmp.width = 200; tmp.height = 200;
    dessinerObjet(tmp.getContext('2d'), OBJETS[19], 200, true, true);
    c2.drawImage(tmp, w - s * 1.02, by + bh - s * 0.55, s, s);
    dessinerObjet(tmp.getContext('2d'), OBJETS[5], 200, true, false);
    c2.drawImage(tmp, -s * 0.05, by + bh - s * 0.45, s, s);
  }

  // ------------------------------------------------------------------------
  // Boucle d'affichage
  // ------------------------------------------------------------------------
  let dernier = performance.now();
  function boucle(maintenant) {
    const dt = Math.min(60, maintenant - dernier);
    dernier = maintenant;
    if (!enPause) {
      horloge += dt;
      if (ecranActuel === 'ecran-jeu' && etat) {
        avancerAnims(dt);
        particules.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.rot += p.vr; p.vie -= dt / 1000; });
        particules = particules.filter((p) => p.vie > 0);
        secousse = Math.max(0, secousse - dt * 0.03);
        filet = Math.max(0, filet - dt / 1200);
        dessinerPlateau();
      }
      if (ouverteTuto) { avancerTuto(dt); secousseTuto = Math.max(0, secousseTuto - dt * 0.03); dessinerTuto(); }
    }
    if (ecranActuel === 'ecran-titre') {
      // redessine quand la mise en page change (textes posés, rotation, langue)
      const repere = [art.clientWidth, art.clientHeight, Math.round(document.querySelector('#ecran-titre .haut').getBoundingClientRect().bottom), Math.round($('btn-jouer').getBoundingClientRect().top)].join(',');
      if (titreAFaire || repere !== repereTitre) { titreAFaire = false; repereTitre = repere; dessinerTitre(); }
    }
    requestAnimationFrame(boucle);
  }

  // ------------------------------------------------------------------------
  // Commandes
  // ------------------------------------------------------------------------
  function lancerJeu() {
    ouvrirAudio();
    jouerSon('clic');
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { lireProgression(); commencerNiveau(Math.max(0, Math.min(NIVEAUX.length - 1, (d.niveau || 1) - 1))); },
      onNouvelle: () => commencerNiveau(0),
      onEffacer: () => { prog = { etoiles: [], records: [], vus: [], niveau: 1 }; commencerNiveau(0); },
    });
  }
  $('btn-jouer').addEventListener('click', lancerJeu);
  $('btn-matchs').addEventListener('click', () => { ouvrirAudio(); jouerSon('clic'); afficherNiveaux(); });
  $('btn-vitrine').addEventListener('click', () => { ouvrirAudio(); jouerSon('clic'); afficherVitrine(); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', () => { ouvrirAudio(); basculerSon(); }));
  document.querySelectorAll('.retour-accueil').forEach((b) => { b.innerHTML = SVG.maison; b.addEventListener('click', () => { jouerSon('clic'); montrer('ecran-titre'); }); });
  $('btn-pause').innerHTML = SVG.pause;
  $('btn-pause').addEventListener('click', () => { jouerSon('clic'); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { jouerSon('clic'); reprendre(); });
  $('btn-recommencer').addEventListener('click', () => { jouerSon('clic'); commencerNiveau(N); });
  $('btn-accueil-pause').addEventListener('click', () => { jouerSon('clic'); allerAccueil(); });
  $('btn-annuler').innerHTML = SVG.annuler + '<span></span>';
  $('btn-annuler').lastChild.textContent = t('annuler');
  $('btn-annuler').addEventListener('click', annuler);
  $('btn-lob').innerHTML = SVG.lob + '<span></span>';
  $('btn-lob').lastChild.textContent = t('lob');
  $('btn-lob').addEventListener('click', basculerLob);
  $('btn-aide').innerHTML = SVG.ampoule + '<span></span>';
  $('btn-aide').lastChild.textContent = t('aide');
  $('btn-aide').addEventListener('click', () => {
    if (!enPartie || occupe) return;
    jouerSon('clic');
    // dernière règle apprise (celle de ce match ou d'un match précédent)
    let regle = 'base';
    for (let k = N; k >= 0; k--) if (NIVEAUX[k].nouveau) { regle = NIVEAUX[k].nouveau; break; }
    ouvrirTuto([regle]);
  });
  $('btn-tuto-ok').addEventListener('click', () => { jouerSon('clic'); fermerTuto(); });
  $('voile-tuto').addEventListener('click', (ev) => { if (ev.target.id !== 'btn-tuto-ok' && ouverteTuto) fermerTuto(); });
  $('ecran-jeu').setAttribute('aria-label', t('titre'));

  document.addEventListener('keydown', (ev) => {
    ouvrirAudio();
    const k = ev.code;
    if (ouverteTuto && (k === 'Enter' || k === 'Space' || k === 'Escape')) { ev.preventDefault(); fermerTuto(); return; }
    if (ecranActuel !== 'ecran-jeu') return;
    if (k === 'Escape' || k === 'KeyP') {
      ev.preventDefault();
      if (enPause) reprendre(); else ouvrirPause();
      return;
    }
    if (document.querySelector('.voile.actif')) return;
    if (!enPartie) return;
    if (k === 'KeyL') { basculerLob(); return; }
    if (k === 'KeyU' || k === 'Backspace') { ev.preventDefault(); annuler(); return; }
    const fl = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[k];
    if (fl) {
      ev.preventDefault();
      if (!curseur) { const p = etat.eq[etat.bal]; curseur = { c: p.c, r: p.r }; return; }
      let c = Math.max(0, Math.min(COLS - 1, curseur.c + fl[0]));
      let r = Math.max(-1, Math.min(LIGNES - 1, curseur.r + fl[1]));
      if (r === -1) c = Math.max(BUT_MIN, Math.min(BUT_MAX, c));
      curseur = { c, r };
      return;
    }
    if (k === 'Enter' || k === 'Space') {
      ev.preventDefault();
      if (!curseur) { const p = etat.eq[etat.bal]; curseur = { c: p.c, r: p.r }; }
      toucherCase(curseur.c, curseur.r);
    }
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') ouvrirPause(); });
  window.addEventListener('resize', () => { redimensionner(); dessinerTitreBientot(); });

  // Sauvegarde à la fermeture de la page, seulement pendant un match.
  JEL_SAVE.surFermeture(() => {
    if (enPartie) JEL_SAVE.save(JEU, donneesSauvegarde(N + 1));
  });

  lireProgression();
  majBoutonsSon();
  requestAnimationFrame(boucle);
})();
</script>
