      particules.push({ x, y, vx: Math.cos(an) * v, vy: Math.sin(an) * v - 120, vie: 1 + Math.random() * 0.6, coul: COULEURS_KLAXONS[i % 5], rot: Math.random() * 6, sorte: 'c' });
    }
  }
  function notesMusique(x, y, coul) {
    for (let i = 0; i < 3; i++) particules.push({ x: x + (i - 1) * 14, y, vx: (i - 1) * 30, vy: -90 - i * 20, vie: 1.1, coul, rot: 0, sorte: 'n' });
  }
  function nuageGris(x, y) {
    for (let i = 0; i < 5; i++) particules.push({ x: x + (Math.random() - 0.5) * 30, y: y + (Math.random() - 0.5) * 10, vx: (Math.random() - 0.5) * 30, vy: -20, vie: 0.8, coul: 'rgba(140,140,150,.7)', rot: 0, sorte: 'g' });
  }
  function texteVolant(txt, x, y, coul, taille) { textes.push({ txt, x, y, coul, vie: 1, taille: taille || 26 }); }

  function majEffets(dt) {
    particules = particules.filter((p) => (p.vie -= dt) > 0);
    for (const p of particules) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.sorte === 'c') { p.vy += 300 * dt; p.vx *= 0.99; p.rot += dt * 8; }
      else if (p.sorte === 'n') { p.vy += 40 * dt; }
      else { p.vy *= 0.95; }
    }
    textes = textes.filter((x) => (x.vie -= dt * 0.9) > 0);
    for (const x of textes) x.y -= 40 * dt;
    secousse = Math.max(0, secousse - dt * 3);
  }
  function dessinerEffets(c) {
    const k = G.k;
    for (const p of particules) {
      c.globalAlpha = Math.min(1, p.vie);
      if (p.sorte === 'c') { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.coul; c.fillRect(-4, -2.5, 8, 5); c.restore(); }
      else if (p.sorte === 'n') {
        c.fillStyle = p.coul; c.beginPath(); c.ellipse(p.x, p.y, 6 * k, 4.5 * k, -0.4, 0, 7); c.fill();
        c.fillRect(p.x + 4 * k, p.y - 18 * k, 2.5 * k, 18 * k); c.fillRect(p.x + 4 * k, p.y - 18 * k, 8 * k, 3 * k);
      } else rond(c, p.x, p.y, 10 * k * (1.4 - p.vie * 0.5), p.coul);
    }
    c.globalAlpha = 1;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (const x of textes) {
      c.globalAlpha = Math.min(1, x.vie * 2);
      c.font = '900 ' + Math.round(x.taille * Math.min(1.3, Math.max(0.8, k))) + 'px system-ui, sans-serif';
      c.lineWidth = 6; c.strokeStyle = '#1d2b53'; c.strokeText(x.txt, x.x, x.y);
      c.fillStyle = x.coul; c.fillText(x.txt, x.x, x.y);
    }
    c.globalAlpha = 1;
  }

  // =====================================================================
  //  Partie
  // =====================================================================
  let etat = 'titre';   // titre, jeu, tuto, pause, bilan
  let jeu = null;
  let enCours = false;
  let animTemps = 0;    // temps des animations de décor
  let joieFoule = 0;
  let eclatPortique = 0;

  function vitesse(e) { return 150 * G.k / jeu.b * (e.veh === 'moto' ? 1.7 : 1); }
  // Distance de l'évènement au portique (positive avant, négative après), arrêts aux feux compris
  function distance(e, tm) {
    const v = vitesse(e);
    let reste = e.T - tm;
    if (reste <= 0 || !e.arrets) return v * reste;
    const D = G.DL;
    let s = 0;
    for (const st of e.arrets) {
      const sp = st.f * D;
      const trajet = (sp - s) / v;
      if (reste <= trajet) return s + v * reste;
      reste -= trajet; s = sp;
      if (reste <= st.d) return s;
      reste -= st.d;
    }
    return s + v * reste;
  }

  function lancerNiveau(idx) {
    idx = borne(idx | 0, 0, NIVEAUX.length - 1);
    const L = NIVEAUX[idx];
    const g = genererNiveau(idx);
    const f = idx / (NIVEAUX.length - 1);
    jeu = {
      idx, L, evts: g.evts, fin: g.fin, b: g.b, total: g.total,
      temps: 0, prochainBattement: 0, mode: 'rythme', air: null,
      score: 0, justes: 0, faits: 0, serie: 0, meilleureSerie: 0,
      fen: [0.13 - f * 0.04, 0.26 - f * 0.07],
      tenu: null, stopTenu: null, appuye: false,
    };
    particules = []; textes = [];
    enCours = true;
    $('klaxons').classList.add('cache');
    construireKlaxons(L.boutons);
    $('nomNiveau').textContent = t('hud.niveau', { n: idx + 1, nom: t('niveau.nom.' + (idx + 1)) });
    majHud(true);
    const pc = (x) => (x * 100).toFixed(1) + '%';
    $('rep1').style.left = pc(L.seuil); $('rep2').style.left = pc(0.8); $('rep3').style.left = pc(0.95);
    montrerEcran(null);
    $('hud').classList.remove('cache');
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (L.tuto && !prog.tutos[L.tuto]) ouvrirTuto(L.tuto);
    else etat = 'jeu';
  }

  function majHud(direct) {
    if (!jeu) return;
    $('jaugeRemplie').style.width = (100 * jeu.justes / jeu.total).toFixed(1) + '%';
    if (direct) { $('score').textContent = nombre(jeu.score); scoreAffiche = jeu.score; }
  }
  let scoreAffiche = 0;

  // Appui (doigt, souris, Espace, Entrée)
  function appui() {
    if (!jeu || etat !== 'jeu' || jeu.mode !== 'rythme' || jeu.tenu) return;
    const tm = jeu.temps;
    const [fp, fb] = jeu.fen;
    let meilleur = null, ecart = 1e9;
    for (const e of jeu.evts) {
      if (e.fait || e.kind === 'dodo' || e.kind === 'air') continue;
      const d = Math.abs(tm - e.T);
      if (d < ecart) { ecart = d; meilleur = e; }
    }
    if (meilleur && ecart <= fb) { toucherNote(meilleur, ecart <= fp ? 'parfait' : 'bien'); return; }
    const dodo = jeu.evts.find((e) => e.kind === 'dodo' && !e.fait && Math.abs(tm - e.T) <= fb);
    if (dodo) { bebeReveille(dodo); return; }
    if (meilleur && meilleur.T > tm && meilleur.T - tm <= fb + 0.22) { rater(meilleur, 'tot'); return; }
    sPouetDoux();
  }
  function relache() {
    if (!jeu || !jeu.tenu) return;
    const e = jeu.tenu;
    if (jeu.temps >= e.Tend - 0.18) finirBus(e, true);
    else finirBus(e, false);
  }

  function positionEcran(e) {
    const x = G.xg - e.dir * distance(e, jeu.temps);
    const y = e.dir === 1 ? G.voieBas : G.voieHaut;
    return { x, y: y - 40 * G.k };
  }

  function toucherNote(e, qualite) {
    const p = positionEcran(e);
    if (e.kind === 'bus') {
      e.tenu = true; e.qualite = qualite; jeu.tenu = e;
      jeu.stopTenu = klaxonTenu(e.pitch);
      texteVolant(t('jeu.tiens'), G.xg, p.y - 60 * G.k, '#ffd23f');
      eclatPortique = 1;
      return;
    }
    e.fait = true; e.res = qualite; e.saut = 1;
    klaxon(e.veh, e.pitch);
    reussir(qualite === 'parfait' ? 100 : 60, p, qualite === 'parfait' ? t('jeu.parfait') : t('jeu.bien'), qualite === 'parfait' ? '#ffd23f' : '#7bf1a8');
    if (e.veh === 'train') e.fumee = 1;
  }
  function reussir(points, p, txt, coul) {
    jeu.justes++; jeu.faits++;
    jeu.serie++; jeu.meilleureSerie = Math.max(jeu.meilleureSerie, jeu.serie);
    jeu.score += points + Math.min(jeu.serie, 10) * 10;
    texteVolant(txt, p.x, p.y - 50 * G.k, coul);
    confettis(G.xg, p.y, 14, 0.7);
    notesMusique(p.x, p.y - 40 * G.k, coul);
    eclatPortique = 1; joieFoule = Math.min(1, joieFoule + 0.5);
    if (jeu.serie > 0 && jeu.serie % 5 === 0) texteVolant(t('jeu.serie', { n: jeu.serie }), G.W / 2, G.yR1 - 150 * G.k, '#ff8fab', 30);
    majHud();
  }
  function rater(e, pourquoi) {
    e.fait = true; e.res = 'rate'; jeu.faits++;
    jeu.serie = 0;
    const p = positionEcran(e);
    texteVolant(t(pourquoi === 'tot' ? 'jeu.tot' : pourquoi === 'lache' ? 'jeu.lache' : 'jeu.tard'), p.x, p.y - 50 * G.k, '#ff9aa2');
    nuageGris(p.x, p.y - 20 * G.k);
    sOups(); secousse = 0.5;
    majHud();
  }
  function finirBus(e, ok) {
    if (jeu.stopTenu) jeu.stopTenu();
    jeu.stopTenu = null; jeu.tenu = null;
    e.tenu = false;
    if (ok) {
      e.fait = true; e.res = e.qualite;
      jeu.score += 50;
      reussir(e.qualite === 'parfait' ? 100 : 60, positionEcran(e), t('jeu.super'), '#ffd23f');
    } else rater(e, 'lache');
  }
  function bebeReveille(e) {
    e.fait = true; e.res = 'rate'; e.reveil = true; jeu.faits++; jeu.serie = 0;
    const p = positionEcran(e);
    texteVolant(t('jeu.reveil'), p.x, p.y - 60 * G.k, '#c8b6ff');
    sBebe(); secousse = 0.4;
    majHud();
  }
  function dodoPasse(e) {
    e.fait = true; e.res = 'parfait';
    jeu.justes++; jeu.faits++; jeu.score += 80;
    const p = positionEcran(e);
    texteVolant(t('jeu.chut'), p.x, p.y - 60 * G.k, '#c8b6ff');
    sChut();
    majHud();
  }

  // ---------- Petit air de la parade (mémoire) ----------
  function construireKlaxons(n) {
    const boite = $('klaxons');
    boite.textContent = '';
    for (let i = 0; i < n; i++) {
      const b = document.createElement('button');
      b.className = 'klaxon';
      b.style.background = COULEURS_KLAXONS[i];
      b.setAttribute('aria-label', t('klaxon.aria', { n: i + 1 }));
      b.innerHTML = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 16h6l16-9v26l-16-9H6z" fill="#fff"/><path d="M31 12q5 8 0 16" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';
      b.addEventListener('pointerdown', (ev) => { ev.preventDefault(); audio(); toucherKlaxon(i); });
      boite.appendChild(b);
    }
  }
  function allumerKlaxon(i, duree) {
    const b = $('klaxons').children[i];
    if (!b) return;
    b.classList.add('allume');
    setTimeout(() => b.classList.remove('allume'), duree);
  }
  function debutAir(e) {
    jeu.mode = 'air';
    jeu.temps = e.T;
    jeu.air = { e, phase: 'arrivee', chrono: 0, i: 0, attente: 0, allume: -1 };
    $('klaxons').classList.remove('cache');
    [...$('klaxons').children].forEach((b) => b.classList.remove('indice'));
  }
  function majAir(dt) {
    const A = jeu.air;
    A.chrono += dt;
    if (A.phase === 'arrivee' && A.chrono > 0.7) { A.phase = 'ecoute'; A.chrono = 0; A.i = 0; }
    else if (A.phase === 'ecoute') {
      const pas = 0.62;
      const i = Math.floor(A.chrono / pas);
      if (i >= A.e.seq.length) { A.phase = 'joue'; A.chrono = 0; A.i = 0; A.allume = -1; return; }
      if (i !== A.dernierJoue) {
        A.dernierJoue = i;
        const k = A.e.seq[i];
        A.allume = k; allumerKlaxon(k, 400);
        klaxon('char', NOTES_KLAXONS[k], 0.4);
      }
      if (A.chrono - i * pas > 0.45) A.allume = -1;
    } else if (A.phase === 'joue') {
      A.attente += dt;
      if (A.attente > 7) { const b = $('klaxons').children[A.e.seq[A.i]]; if (b) b.classList.add('indice'); }
    } else if (A.phase === 'fin' && A.chrono > 1.1) {
      A.e.fait = true;
      jeu.mode = 'rythme'; jeu.air = null;
      $('klaxons').classList.add('cache');
      // reprise de la musique au battement suivant
      jeu.prochainBattement = Math.ceil(jeu.temps / jeu.b);
    }
  }
  function toucherKlaxon(k) {
    if (!jeu || etat !== 'jeu' || !jeu.air || jeu.air.phase !== 'joue') return;
    const A = jeu.air;
    [...$('klaxons').children].forEach((b) => b.classList.remove('indice'));
    A.attente = 0;
    allumerKlaxon(k, 250);
    A.allume = k; setTimeout(() => { if (jeu && jeu.air === A) A.allume = -1; }, 250);
    const centre = { x: G.xg, y: G.voieBas - 90 * G.k };
    if (k === A.e.seq[A.i]) {
      klaxon('char', NOTES_KLAXONS[k], 0.35);
      A.i++;
      jeu.justes++; jeu.faits++; jeu.serie++; jeu.meilleureSerie = Math.max(jeu.meilleureSerie, jeu.serie);
      jeu.score += 100;
      notesMusique(centre.x, centre.y, COULEURS_KLAXONS[k]);
      majHud();
      if (A.i >= A.e.seq.length) {
        A.phase = 'fin'; A.chrono = 0; A.reussi = true;
        texteVolant(t('jeu.bravo'), G.W / 2, G.yR1 - 150 * G.k, '#ffd23f', 34);
        confettis(G.xg, centre.y, 40, 1.2); sBravo(); joieFoule = 1; eclatPortique = 1;
      }
    } else {
      sOups(); secousse = 0.5;
      const reste = A.e.seq.length - A.i;
      jeu.faits += reste; jeu.serie = 0;
      A.phase = 'fin'; A.chrono = 0; A.reussi = false;
      texteVolant(t('jeu.oups'), G.W / 2, G.yR1 - 150 * G.k, '#ff9aa2', 34);
      majHud();
    }
  }

  // ---------- Fin de niveau ----------
  function finNiveau() {
    if (etat !== 'jeu') return;
    etat = 'bilan';
    enCours = false;
    if (jeu.stopTenu) jeu.stopTenu();
    const idx = jeu.idx, L = jeu.L;
    const part = jeu.justes / jeu.total;
    const etoiles = part >= 0.95 ? 3 : part >= 0.8 ? 2 : part >= L.seuil ? 1 : 0;
    const ancienRecord = prog.records[idx];
    const record = jeu.score > ancienRecord;
    const pct = Math.round(part * 100);
    if (etoiles > 0) victoire(idx, etoiles, record, ancienRecord, pct);
    else defaite(idx, record, ancienRecord, pct);
  }

  function dessinerEtoiles(boite, n) {
    boite.textContent = '';
    boite.setAttribute('role', 'img');
    boite.setAttribute('aria-label', t('etoiles.aria', { n }));
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 'etoile' + (i < n ? ' pleine' : '');
      s.style.animationDelay = (0.3 + i * 0.35) + 's';
      s.innerHTML = '<svg viewBox="0 0 50 50" aria-hidden="true"><path d="M25 3l6.5 14 15.3 1.7-11.4 10.4 3.2 15.1L25 36.6 11.4 44.2l3.2-15.1L3.2 18.7 18.5 17z"/></svg>';
      boite.appendChild(s);
    }
  }

  function victoire(idx, etoiles, record, ancienRecord, pct) {
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: idx + 1 });
    const ancienTotal = totalEtoiles();
    const nouvelAutoc = prog.etoiles[idx] === 0;
    prog.etoiles[idx] = Math.max(prog.etoiles[idx], etoiles);
    if (record) prog.records[idx] = jeu.score;
    prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, idx + 2));
    try { window.JEL_SAVE.save(JEU, donnees(Math.min(idx + 2, NIVEAUX.length), jeu.score)); } catch (e) { /* rien */ }
    // Tout le jeu a-t-il été gagné ?
    if (prog.etoiles.every((e) => e > 0)) {
      if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: MAX_ETOILES });
    }
    sVictoire();
    confettis(G.W / 2, G.H * 0.4, 90, 1.6);
    joieFoule = 1;
    dessinerEtoiles($('vEtoiles'), etoiles);
    for (let i = 0; i < etoiles; i++) setTimeout(() => sEtoile(i), 300 + i * 350);
    $('vNotes').textContent = t('victoire.notes', { a: jeu.justes, b: jeu.total, p: pct });
    compterScore($('vScore'), jeu.score);
    $('vRecord').textContent = record ? t('victoire.record') : t('victoire.ancien', { s: nombre(ancienRecord) });
    const bonus = [];
    if (nouvelAutoc) bonus.push(t('victoire.autocollant', { v: t('veh.' + NIVEAUX[idx].autoc) }));
    const nouveauTotal = totalEtoiles();
    INSTRUMENTS.forEach((ins) => { if (ins.etoiles > ancienTotal && ins.etoiles <= nouveauTotal) bonus.push(t('victoire.instrument', { i: t('instr.' + ins.id) })); });
    $('vBonus').textContent = bonus.join(' ');
    const dernier = idx === NIVEAUX.length - 1;
    $('btSuivant').textContent = dernier ? t('bouton.bilan') : t('bouton.suivant');
    setTimeout(() => { montrerEcran('ecranVictoire'); $('btSuivant').focus(); }, 700);
  }

  function defaite(idx, record, ancienRecord, pct) {
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: idx + 1 });
    if (record) prog.records[idx] = jeu.score;
    sDefaite();
    dessinerEtoiles($('dEtoiles'), 0);
    $('dTexte').textContent = t('defaite.texte', { p: Math.round(jeu.L.seuil * 100), q: pct });
    compterScore($('dScore'), jeu.score);
    $('dRecord').textContent = record ? t('victoire.record') : t('victoire.ancien', { s: nombre(ancienRecord) });
    setTimeout(() => { montrerEcran('ecranDefaite'); $('btReessayer').focus(); }, 600);
  }

  function compterScore(el, cible) {
    const debut = performance.now();
    const pas = () => {
      const f = Math.min(1, (performance.now() - debut) / 900);
      el.textContent = t('victoire.score', { s: nombre(Math.round(cible * f)) });
      if (f < 1) requestAnimationFrame(pas);
    };
    pas();
  }

  function bilanFinal() {
    $('fEtoiles').textContent = t('fin.etoiles', { a: totalEtoiles(), b: MAX_ETOILES });
    $('fAutoc').textContent = t('fin.autocollants', { a: prog.etoiles.filter((e) => e > 0).length, b: NIVEAUX.length });
    $('fScore').textContent = t('fin.score', { s: nombre(prog.records.reduce((s, r) => s + r, 0)) });
    confettis(G.W / 2, G.H * 0.3, 120, 1.8);
    sVictoire();
    etat = 'bilan';
    montrerEcran('ecranFin');
  }

  // ---------- Pause ----------
  function mettreEnPause() {
    if (etat !== 'jeu') return;
    if (jeu && jeu.tenu) finirBus(jeu.tenu, jeu.temps >= jeu.tenu.T);
    etat = 'pause';
    montrerEcran('ecranPause');
    $('btReprendre').focus();
  }
  function reprendre() {
    if (etat !== 'pause') return;
    montrerEcran(null);
    etat = 'jeu';
    dernierInstant = performance.now();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  function versAccueil() {
    if (jeu && jeu.stopTenu) jeu.stopTenu();
    enCours = false; jeu = null; etat = 'titre';
    $('hud').classList.add('cache'); $('klaxons').classList.add('cache');
    montrerEcran('ecranTitre');
    $('btJouer').focus();
  }

  // =====================================================================
  //  Tutoriels animés
  // =====================================================================
  const TUTOS = {
    toucher: { lignes: 3, veh: 'voiture' }, train: { lignes: 1, veh: 'train' }, moto: { lignes: 2, veh: 'moto' },
    glaces: { lignes: 1, veh: 'glaces' }, air: { lignes: 3, n: 3 }, feu: { lignes: 2, veh: 'tracteur' },
    bus: { lignes: 3, veh: 'bus' }, dodo: { lignes: 2, veh: 'dodo' }, air4: { lignes: 2, n: 4 },
    paires: { lignes: 2, veh: 'mini' }, tunnel: { lignes: 2, veh: 'chasseneige' }, air5: { lignes: 2, n: 5 },
    deux: { lignes: 2, veh: 'voiture' }, ecole: { lignes: 2, veh: 'ecole' },
  };
  let tutoCle = null, tutoTemps = 0;
  function ouvrirTuto(cle) {
    etat = 'tuto';
    tutoCle = cle; tutoTemps = 0;
    $('tutoTitre').textContent = t('tuto.' + cle + '.titre');
    const ol = $('tutoLignes');
    ol.textContent = '';
    for (let i = 1; i <= TUTOS[cle].lignes; i++) { const li = document.createElement('li'); li.textContent = t('tuto.' + cle + '.' + i); ol.appendChild(li); }
    montrerEcran('ecranTuto');
    $('btTuto').focus();
  }
  function fermerTuto() {
    if (etat !== 'tuto') return;
    sClic();
    prog.tutos[tutoCle] = true;
    tutoCle = null;
    montrerEcran(null);
    etat = 'jeu';
    dernierInstant = performance.now();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  // Petite scène animée du tutoriel (600 × 300)
  function dessinerTuto(dt) {
    if (!tutoCle) return;
    tutoTemps += dt;
    const c = $('tutoCanvas').getContext('2d');
    const W = 600, H = 300, k = 0.95;
    const def = TUTOS[tutoCle];
    c.clearRect(0, 0, W, H);
    const ciel = c.createLinearGradient(0, 0, 0, H); ciel.addColorStop(0, '#8fd3ff'); ciel.addColorStop(1, '#e8f7ff');
    c.fillStyle = ciel; c.fillRect(0, 0, W, H);
    const yR1 = 170, yR2 = 250, xg = 380;
    c.fillStyle = '#585e72'; c.fillRect(0, yR1, W, yR2 - yR1);
    c.fillStyle = '#fff'; for (let x = 0; x < W; x += 40) c.fillRect(x, 208, 22, 4);
    c.fillStyle = '#8bc34a'; c.fillRect(0, yR2, W, H - yR2);
    // portique

      else if (etape < 3) { c.strokeStyle = '#1d2b53'; c.lineWidth = 4; for (let j = 0; j < 3; j++) { c.beginPath(); c.arc(xg, 60, 12 + j * 10, Math.PI * 1.2, Math.PI * 1.8); c.stroke(); } }
    } else if (tutoCle === 'bus') {

      main = { x: xg, y: 120, appui: pres(x, xg) || pres(x - 70, xg) };
    } else if (tutoCle === 'deux') {
      const x = -60 + ph * (W + 120);

      vehAt('voiture', x, voie, 1, { couleur: 0 });

    } else if (tutoCle === 'feu' || tutoCle === 'ecole') {
      // arrêt(s) puis départ
      const arrets = tutoCle === 'feu' ? [190] : [140, 270];
      let x, tt = ph * per, rouge = false;
      const v = 200;
      const pts = [];

      for (const a of arrets) { pts.push([tps, pos]); tps += (a - pos) / v; pos = a; pts.push([tps, pos]); tps += 0.7; pts.push([tps, pos]); }

      for (const a of arrets) {
        c.fillStyle = '#4b5063'; c.fillRect(a + 60, yR1 - 60, 4, 60);

        else rond(c, a + 62, yR1 - 75, 6, rouge && Math.abs(x - a) < 2 ? '#ffb703' : '#6b5a20');
      }

  // =====================================================================
  //  Boucle principale
  // =====================================================================
  let dernierInstant = performance.now();
  const demo = { temps: 0 };
  const DEMO_VEH = ['pompiers', 'train', 'voiture', 'tracteur', 'glaces', 'bus', 'moto', 'chasseneige'];

  function boucle(maint) {
    let dt = (maint - dernierInstant) / 1000;
    dernierInstant = maint;
    dt = borne(dt, 0, 0.1);
    animTemps += dt;
    joieFoule = Math.max(0, joieFoule - dt * 0.6);
    eclatPortique = Math.max(0, eclatPortique - dt * 3);

    if (etat === 'jeu' && jeu) majJeu(dt);
    majEffets(dt);
    if (etat === 'tuto') dessinerTuto(dt);
    // compteur de score qui défile
    if (jeu && scoreAffiche !== jeu.score) {
      scoreAffiche += Math.ceil((jeu.score - scoreAffiche) * 0.25);
      if (Math.abs(jeu.score - scoreAffiche) < 2) scoreAffiche = jeu.score;
      $('score').textContent = nombre(scoreAffiche);
    }
    dessiner(dt);    requestAnimationFrame(boucle);
  }

  function majJeu(dt) {
    if (jeu.mode === 'air') { majAir(dt); return; }
    jeu.temps += dt;
    const tm = jeu.temps;
    // musique : on prévoit les battements un peu à l'avance
    while (jeu.prochainBattement * jeu.b <= tm + 0.1 && jeu.prochainBattement * jeu.b < jeu.fin) {
      const quand = maintenant() + Math.max(0, jeu.prochainBattement * jeu.b - tm);
      if (ac) tempsMusique(jeu.prochainBattement, quand, jeu.L.bpm);
      jeu.prochainBattement++;
    }
    const fb = jeu.fen[1];
    for (const e of jeu.evts) {
      if (e.saut) e.saut = Math.max(0, e.saut - dt * 4);
      if (e.fait) continue;
      if (e.kind === 'air') { if (tm >= e.T) { debutAir(e); return; } continue; }
      if (e.kind === 'dodo') { if (tm > e.T + fb) dodoPasse(e); continue; }
      if (e.kind === 'bus' && e.tenu) {
        if (tm >= e.Tend) finirBus(e, true);
        else if (Math.random() < dt * 12) confettis(G.xg, G.voieBas - 40 * G.k, 2, 0.4);
        continue;
      }
      if (tm > e.T + fb) rater(e, 'tard');
    }
    if (tm >= jeu.fin && !jeu.tenu) finNiveau();
  }

  function dessiner() {
    const c = ctx;
    c.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
    const q = jeu ? jeu.L.q : 0;
    c.save();
    if (secousse > 0) c.translate((Math.random() - 0.5) * 10 * secousse, (Math.random() - 0.5) * 8 * secousse);
    fond(q);
    nuages(c, animTemps);
    if (jeu) dessinerPartie(c);
    else dessinerDemo(c);
    dessinerFoule(c, animTemps, joieFoule);
    dessinerEffets(c);
    c.restore();
  }

  // Parade de l'écran titre (sert aussi de jaquette)
  function dessinerDemo(c) {
    demo.temps += 1 / 60;
    const b = 0.62, v = 150 * G.k / b;
    const tm = animTemps;
    dessinerPortique(c, tm, b, 0, 40 * G.k);
    const premier = Math.floor(tm / (2 * b)) - 6;
    let sous = false;
    for (let i = premier; i < premier + 12; i++) {
      const T = i * 2 * b;
      const veh = DEMO_VEH[((i % DEMO_VEH.length) + DEMO_VEH.length) % DEMO_VEH.length];
      const x = G.xg - v * (T - tm);
      if (x < -320 * G.k || x > G.W + 200 * G.k) continue;
      if (Math.abs(x - G.xg) < 18 * G.k) sous = true;
      poserVehicule(c, veh, x, G.voieBas, 1, G.k, { ang: x / (12 * G.k), temps: tm, len: 300, couleur: i & 3 });
    }
    if (sous) { eclatPortique = Math.max(eclatPortique, 0.6); joieFoule = Math.max(joieFoule, 0.5); }
  }

  function dessinerPartie(c) {
    const { xg, k } = G;
    const tm = jeu.temps;
    const L = jeu.L;
    const vNorm = 150 * k / jeu.b;
    dessinerPortique(c, tm, jeu.b, eclatPortique, vNorm * jeu.fen[1] * 2);
    // feux
    const feuxRouges = { feu: false, e1: 0, e2: 0 };
    for (const e of jeu.evts) {
      if (!e.arrets || e.T < tm - 1) continue;
      const v = vitesse(e);
      let depart = e.T;
      for (let i = 0; i < e.arrets.length; i++) {
        const st = e.arrets[i];
        // instant de départ de l'arrêt : temps restant jusqu'au portique depuis cet arrêt
        let apres = (st.f * G.DL) / v;
        for (let j = 0; j < i; j++) apres += e.arrets[j].d;
        depart = e.T - apres;
        const arrivee = depart - st.d;
        if (tm >= arrivee - 0.4 && tm <= depart) {
          if (e.arrets.length === 1) feuxRouges.feu = true;
          else if (i === 0) feuxRouges.e1 = 1; else feuxRouges.e2 = 1;
        }
      }
    }
    const aFeu = L.feu, aEcole = L.ecole;
    const largeur = (veh) => (LONGUEURS[veh] || 100) * k;
    if (aFeu) dessinerFeu(c, xg - 0.42 * G.DL + largeur('voiture') / 2 + 14 * k, feuxRouges.feu, 0);
    if (aEcole) {
      dessinerFeu(c, xg - 0.25 * G.DL + largeur('ecole') / 2 + 10 * k, false, feuxRouges.e1 ? 1 : 0.2);
      dessinerFeu(c, xg - 0.6 * G.DL + largeur('ecole') / 2 + 10 * k, false, feuxRouges.e2 ? 1 : 0.2);
    }
    // véhicules : voie du haut puis voie du bas
    for (const voie of [-1, 1]) {
      for (const e of jeu.evts) {
        if (e.dir !== voie) continue;
        if (e.kind === 'air' && e.fait && tm > e.T + 6) continue;
        const s = distance(e, tm);
        const x = xg - e.dir * s;
        const longueur = e.kind === 'bus' ? 150 * k * (e.Tend - e.T) / jeu.b : largeur(e.veh);
        if (x < -longueur - 40 && e.dir === 1 && s > 0) continue;
        if (x > G.W + longueur + 40 && e.dir === -1 && s > 0) continue;
        if (s < -(G.W + longueur)) continue;
        const o = { ang: x / (12 * k), temps: animTemps, couleur: e.couleur, saut: (e.saut || 0) * 10 * k };
        if (e.kind === 'bus') {
          o.len = 150 * (e.Tend - e.T) / jeu.b;
          if (e.tenu || e.res === 'parfait' || e.res === 'bien') o.passe = borne((tm - e.T) / (e.Tend - e.T), 0, 1);
        }
        if (e.kind === 'dodo') o.reveil = e.reveil;
        if (e.kind === 'air') { o.n = L.boutons; o.allume = jeu.air && jeu.air.e === e ? jeu.air.allume : -1; }
        if (e.res === 'rate' && e.kind !== 'dodo') c.globalAlpha = 0.6;
        poserVehicule(c, e.veh, x, e.dir === 1 ? G.voieBas : G.voieHaut, e.dir, k, o);
        c.globalAlpha = 1;
      }
    }
    if (L.tunnel) dessinerTunnel(c);
    // messages du petit air
    if (jeu.air) {
      const A = jeu.air;
      let msg = null;
      if (A.phase === 'arrivee' || A.phase === 'ecoute') msg = t('jeu.ecoute');
      else if (A.phase === 'joue') msg = t('jeu.atoi');
      if (msg) {
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.font = '900 ' + Math.round(26 * Math.min(1.3, Math.max(0.85, k))) + 'px system-ui, sans-serif';
        const y = Math.max(110, G.yR1 - 170 * k);
        c.lineWidth = 7; c.strokeStyle = '#1d2b53'; c.strokeText(msg, G.W / 2, y);
        c.fillStyle = '#fff'; c.fillText(msg, G.W / 2, y);
      }
    }
  }

  // Autocollant : véhicule du niveau sur le fond de son quartier (silhouette grise tant qu'il n'est pas gagné)
  function dessinerAutocollant(c, L, gagne) {
    const fonds = [['#8fd3ff', '#2e86de'], ['#b8e994', '#6bb35a'], ['#dbe9f6', '#ffffff'], ['#ffc6a8', '#efd9bd']][L.q];
    c.fillStyle = gagne ? fonds[0] : '#e4e1d8'; rr(c, 4, 4, 192, 152, 22); c.fill();

    c.fillStyle = gagne ? '#585e72' : '#bdb8aa'; c.fillRect(4, 118, 192, 18);
    const veh = L.autoc;
    const ech = veh === 'char' ? 0.72 : veh === 'bus' ? 0.6 : 1.05;
    const tmp = document.createElement('canvas');
    tmp.width = 200; tmp.height = 160;
    const d = tmp.getContext('2d');
    d.translate(veh === 'bus' ? 182 : 100, 132);
    d.scale(ech, ech);
    dessinerVehicule(d, veh, { len: 270, n: 5, couleur: L.q, temps: 0.3, ang: 0.4 });
    if (!gagne) {
      d.setTransform(1, 0, 0, 1, 0, 0);
      d.globalCompositeOperation = 'source-in';
      d.fillStyle = '#8f8b80'; d.fillRect(0, 0, 200, 160);
    }
    c.drawImage(tmp, 0, 0);
    if (!gagne) {
      c.fillStyle = '#6b6b80'; rr(c, 84, 40, 32, 26, 5); c.fill();
      c.strokeStyle = '#6b6b80'; c.lineWidth = 5; c.beginPath(); c.arc(100, 40, 10, Math.PI, 0); c.stroke();

    $('iconeSon').innerHTML = sonActif
      ? '<path d="M3 9h4l5-4v14l-5-4H3z" fill="#1d2b53"/><path d="M15 8q3 4 0 8M18 5q5 7 0 14" stroke="#1d2b53" stroke-width="2" fill="none" stroke-linecap="round"/>'
      : '<path d="M3 9h4l5-4v14l-5-4H3z" fill="#1d2b53"/><path d="M15 9l6 6M21 9l-6 6" stroke="#e63946" stroke-width="2.5" stroke-linecap="round"/>';
    $('btSon').setAttribute('aria-label', sonActif ? t('son.couper') : t('son.activer'));
  }

  // =====================================================================
  //  Commandes
  // =====================================================================
  function jouer() {
    audio(); sClic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => lancerNiveau(borne((d.niveau | 0) || 1, 1, NIVEAUX.length) - 1),
      onNouvelle: () => lancerNiveau(0),
      onEffacer: () => { reinitialiserProgression(); versAccueil(); },
    });
  }
  $('btJouer').addEventListener('click', jouer);
  $('btNiveaux').addEventListener('click', () => { audio(); sClic(); ouvrirNiveaux(); });
  $('btGarage').addEventListener('click', () => { audio(); sClic(); ouvrirGarage(); });
  $('btRetourNiv').addEventListener('click', () => { sClic(); versAccueil(); });
  $('btRetourGar').addEventListener('click', () => { sClic(); versAccueil(); });
  $('btPause').addEventListener('click', () => { sClic(); mettreEnPause(); });
  $('btReprendre').addEventListener('click', () => { sClic(); reprendre(); });
  $('btRecommencer').addEventListener('click', () => { sClic(); lancerNiveau(jeu ? jeu.idx : 0); });
  $('btAccueilP').addEventListener('click', () => { sClic(); versAccueil(); });
  $('btTuto').addEventListener('click', fermerTuto);
  // Un toucher n'importe où passe le tutoriel
  $('ecranTuto').addEventListener('pointerdown', (e) => { e.preventDefault(); fermerTuto(); });
  $('btSuivant').addEventListener('click', () => {
    sClic();
    const idx = jeu ? jeu.idx : 0;
    if (idx >= NIVEAUX.length - 1) bilanFinal(); else lancerNiveau(idx + 1);
  });
  $('btRejouerV').addEventListener('click', () => { sClic(); lancerNiveau(jeu ? jeu.idx : 0); });
  $('btNiveauxV').addEventListener('click', () => { sClic(); jeu = null; ouvrirNiveaux(); });
  $('btReessayer').addEventListener('click', () => { sClic(); lancerNiveau(jeu ? jeu.idx : 0); });
  $('btAccueilD').addEventListener('click', () => { sClic(); versAccueil(); });
  $('btNiveauxD').addEventListener('click', () => { sClic(); jeu = null; ouvrirNiveaux(); });
  $('btRejouerF').addEventListener('click', () => { sClic(); lancerNiveau(0); });
  $('btNiveauxF').addEventListener('click', () => { sClic(); jeu = null; ouvrirNiveaux(); });
  $('btGarageF').addEventListener('click', () => { sClic(); jeu = null; ouvrirGarage(); });
  $('btSon').addEventListener('click', () => {
    sonActif = !sonActif;
    audio(); majVolume(); majBoutonSon(); enregistrerPrefs();
    if (sonActif) sClic();
  });

  // Toucher la scène = klaxonner
  let doigt = null;
  toile.addEventListener('pointerdown', (e) => {
    audio();
    if (etat !== 'jeu') return;
    e.preventDefault();
    doigt = e.pointerId;
    try { toile.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
    appui();
  });
  const lever = (e) => { if (doigt === e.pointerId) { doigt = null; relache(); } };
  toile.addEventListener('pointerup', lever);
  toile.addEventListener('pointercancel', lever);

  const TOUCHES_KLAXONS = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Digit5: 4, Numpad1: 0, Numpad2: 1, Numpad3: 2, Numpad4: 3, Numpad5: 4, ArrowLeft: 0, ArrowDown: 1, ArrowUp: 2, ArrowRight: 3 };
  window.addEventListener('keydown', (e) => {
    if (document.querySelector('jel-sauvegarde')) return;
    if (etat === 'jeu' || etat === 'pause') {
      if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); if (etat === 'jeu') mettreEnPause(); else reprendre(); return; }
    }
    if (etat === 'tuto' && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); fermerTuto(); return; }
    if (etat !== 'jeu' || !jeu) return;
    if (jeu.mode === 'air') {
      if (e.code in TOUCHES_KLAXONS) {
        e.preventDefault();
        const k = TOUCHES_KLAXONS[e.code];
        if (k < jeu.L.boutons && !e.repeat) toucherKlaxon(k);
      }
      return;
    }
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') {
      e.preventDefault();
      audio();
      if (!e.repeat && !jeu.appuye) { jeu.appuye = true; appui(); }
    }
  });
  window.addEventListener('keyup', (e) => {
    if (!jeu) return;
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') { jeu.appuye = false; relache(); }
  });

  // Écran caché : pause automatique
  document.addEventListener('visibilitychange', () => { if (document.hidden) mettreEnPause(); });
  window.addEventListener('blur', () => { if (!jeu) return; jeu.appuye = false; if (jeu.tenu) relache(); });
  window.addEventListener('resize', redimensionner);

  // Sauvegarde à la fermeture de la page, seulement pendant une partie
  window.JEL_SAVE.surFermeture(() => {
    if (enCours && jeu) window.JEL_SAVE.save(JEU, donnees(jeu.idx + 1, jeu.score));
  });

  // =====================================================================
  //  Démarrage
  // =====================================================================
  chargerProgression();
  majBoutonSon();
  redimensionner();
  requestAnimationFrame((m) => { dernierInstant = m; boucle(m); });
})();
</script>
</body>
</html>
