<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.

    try {

  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +

    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +

    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }

      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};

  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
(function () {

  // ==========================================================================

  // ==========================================================================

  // ===== MOTEUR DEBUT =====
  const VBASE = 300;        // vitesse de croisière (unités du monde par seconde)

  const DUREE_TURBO = 2.5;
  const PAS = 10;           // précision de la piste (une valeur tous les 10 unités)

  // Poids des éléments : chaque niveau tire sa glissière avec ces fréquences.
  const TOUT = { gouttes: 3, boost: 1.1, flotteur: 1.4, tremplin: 1, ballon: 1, courant: 1, fourche: 1, glace: 1, boule: 1, tunnel: 1, tourbillon: 1, geyser: 1, champi: 1, etroit: 0.8, bulle: 0.7, aimant: 0.7, anneau: 1 };

  // ligue : 0 Piscine, 1 Jungle, 2 Glacier, 3 Volcan, 4 Nuit étoilée, 5 Arc-en-ciel
  // f : vitesse des adversaires (1 = la tienne) ; skill : leur adresse (0 à 1)
  // ampl / per : force et longueur des virages ; hw : demi-largeur de la glissière
  const NIVEAUX = [

    { ligue: 0, nouveau: 'boost', bots: 3, qualif: 3, f: 0.78, skill: 0.3, long: 10000, ampl: 32, per: 2400, hw: 118, el: { gouttes: 3, boost: 2 } },
    { ligue: 0, nouveau: 'turbo', bots: 3, qualif: 3, f: 0.80, skill: 0.35, long: 11000, ampl: 36, per: 2300, hw: 116, el: { gouttes: 3.5, boost: 1.4 } },
    { ligue: 0, nouveau: 'canards', bots: 3, qualif: 3, f: 0.81, skill: 0.4, long: 12000, ampl: 40, per: 2200, hw: 115, el: { gouttes: 3, boost: 1.2, flotteur: 2.5 } },

    { ligue: 1, nouveau: 'tremplin', bots: 3, qualif: 2, f: 0.82, skill: 0.45, long: 12500, ampl: 46, per: 2100, hw: 113, el: { gouttes: 3, boost: 1, flotteur: 1.8, tremplin: 2.4 } },
    { ligue: 1, nouveau: 'ballons', bots: 3, qualif: 2, f: 0.835, skill: 0.48, long: 13000, ampl: 48, per: 2050, hw: 112, el: { gouttes: 3, boost: 1, flotteur: 1.4, tremplin: 1, ballon: 2.6 } },

    { ligue: 1, nouveau: 'fourche', bots: 3, qualif: 2, f: 0.855, skill: 0.52, long: 14000, ampl: 50, per: 2000, hw: 110, el: { gouttes: 3, boost: 1, flotteur: 1.3, tremplin: 0.8, ballon: 1, courant: 1, fourche: 2.6 } },

    { ligue: 2, nouveau: 'boules', bots: 4, qualif: 2, f: 0.87, skill: 0.56, long: 14500, ampl: 55, per: 1900, hw: 108, el: { gouttes: 3, boost: 1, flotteur: 1, glace: 1.5, boule: 3, courant: 0.7 } },

    { ligue: 2, nouveau: 'melange_glacier', bots: 4, qualif: 2, f: 0.885, skill: 0.6, long: 16000, ampl: 58, per: 1850, hw: 107, el: { gouttes: 3, boost: 1, flotteur: 1.2, tremplin: 1, glace: 1.6, boule: 1.5, tunnel: 1.3, fourche: 1.3, ballon: 0.6 } },

    { ligue: 3, nouveau: 'tourbillon', bots: 4, qualif: 2, f: 0.89, skill: 0.62, long: 15500, ampl: 60, per: 1800, hw: 106, el: { gouttes: 3, boost: 1, flotteur: 1.4, tremplin: 1, ballon: 1, tourbillon: 3 } },
    { ligue: 3, nouveau: 'geyser', bots: 4, qualif: 2, f: 0.895, skill: 0.63, long: 16000, ampl: 60, per: 1800, hw: 106, el: { gouttes: 3, boost: 1, flotteur: 1, tourbillon: 1.2, geyser: 3, courant: 1 } },
    { ligue: 3, nouveau: 'champi', bots: 4, qualif: 2, f: 0.90, skill: 0.64, long: 16500, ampl: 62, per: 1780, hw: 105, el: { gouttes: 3, boost: 1, flotteur: 1, geyser: 1.2, champi: 3, tremplin: 1 } },
    { ligue: 3, nouveau: 'etroit', bots: 4, qualif: 2, f: 0.905, skill: 0.66, long: 17000, ampl: 62, per: 1760, hw: 105, el: { gouttes: 3, boost: 1, flotteur: 1.2, tourbillon: 1, geyser: 1, champi: 1, etroit: 2.6, fourche: 1 } },

    { ligue: 4, nouveau: 'bulle', bots: 5, qualif: 2, f: 0.91, skill: 0.68, long: 17000, ampl: 64, per: 1720, hw: 104, el: { gouttes: 3, boost: 1, flotteur: 2, tunnel: 1.5, ballon: 1, bulle: 1.6, geyser: 1 } },
    { ligue: 4, nouveau: 'rivaux_turbo', bots: 5, qualif: 2, f: 0.91, skill: 0.69, botTurbo: true, long: 17500, ampl: 64, per: 1700, hw: 104, el: { gouttes: 3, boost: 1, flotteur: 1.5, tunnel: 1.5, boule: 1, courant: 1.2, bulle: 1, glace: 1 } },
    { ligue: 4, nouveau: 'aimant', bots: 5, qualif: 2, f: 0.915, skill: 0.7, botTurbo: true, long: 18000, ampl: 65, per: 1700, hw: 103, el: { gouttes: 3.5, boost: 1, flotteur: 1.5, tunnel: 1, tourbillon: 1, champi: 1, aimant: 1.6, bulle: 0.7 } },
    { ligue: 4, nouveau: 'melange_nuit', bots: 5, qualif: 2, f: 0.92, skill: 0.71, botTurbo: true, long: 19000, ampl: 66, per: 1680, hw: 103, el: { gouttes: 3, boost: 1, flotteur: 1.5, tunnel: 1.5, ballon: 1, boule: 1, geyser: 1, fourche: 1, etroit: 1, bulle: 0.8, aimant: 0.8 } },

    { ligue: 5, nouveau: 'champion', bots: 5, qualif: 2, f: 0.92, skill: 0.72, botTurbo: true, champion: true, long: 18500, ampl: 68, per: 1650, hw: 102, el: { gouttes: 3, boost: 1.2, flotteur: 1.5, tremplin: 1, courant: 1, champi: 1, tourbillon: 1, bulle: 0.8 } },
    { ligue: 5, nouveau: 'anneaux', bots: 5, qualif: 2, f: 0.925, skill: 0.73, botTurbo: true, champion: true, long: 19000, ampl: 68, per: 1640, hw: 102, el: { gouttes: 3, boost: 1, flotteur: 1.5, tremplin: 1.4, anneau: 2.2, geyser: 1, ballon: 1, glace: 1 } },
    { ligue: 5, nouveau: 'melange', bots: 5, qualif: 2, f: 0.93, skill: 0.75, botTurbo: true, champion: true, long: 21000, ampl: 70, per: 1600, hw: 101, el: TOUT },
    { ligue: 5, nouveau: 'grande_finale', bots: 5, qualif: 1, f: 0.93, skill: 0.77, botTurbo: true, champion: true, long: 22000, ampl: 72, per: 1560, hw: 100, el: TOUT }
  ];
  // longueurs données pour ~300 unités/s : ×1,2 → de 40 s (niveau 1) à 1 min 30 (grande finale)
  NIVEAUX.forEach(function (d, i) { d.graine = 1009 + i * 7919; d.turbo = i >= 2; d.index = i; d.long = Math.round(d.long * 1.2); });

  const LONGUEURS = { gouttes: 430, boost: 230, flotteur: 300, tremplin: 430, ballon: 240, courant: 620, fourche: 840, glace: 760, boule: 260, tunnel: 880, tourbillon: 300, geyser: 280, champi: 320, etroit: 620, bulle: 150, aimant: 150, anneau: 170 };
  const EST_ZONE = { courant: 1, fourche: 1, glace: 1, tunnel: 1, etroit: 1 };
  const RAYONS = { goutte: 11, boost: 26, tremplin: 16, flotteur: 18, ballon: 17, boule: 20, champi: 20, geyser: 24, tourbillon: 36, bulle: 18, aimant: 17, anneau: 21 };

  // Tirage pseudo-aléatoire fixe : un niveau est toujours le même.
  function hasard(graine) {
    let a = graine >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function borner(x, a, b) { return x < a ? a : x > b ? b : x; }
  function lisse(x) { if (x <= 0) return 0; if (x >= 1) return 1; return x * x * (3 - 2 * x); }

  function tirer(rnd, poids, eviter) {
    let total = 0;
    for (const k in poids) if (k !== eviter) total += poids[k];
    let x = rnd() * total;
    for (const k in poids) {
      if (k === eviter) continue;
      x -= poids[k];
      if (x <= 0) return k;
    }
    return 'gouttes';
  }

  // Centre et demi-largeur de la glissière à la hauteur y (valeurs interpolées).
  function cxA(m, y) {
    const p = m.piste;
    let f = (y - p.y0) / PAS, i = Math.floor(f);
    if (i < 0) return p.cx[0];
    if (i >= p.n - 1) return p.cx[p.n - 1];
    f -= i;
    return p.cx[i] + (p.cx[i + 1] - p.cx[i]) * f;
  }
  function hwA(m, y) {
    const p = m.piste;
    let f = (y - p.y0) / PAS, i = Math.floor(f);
    if (i < 0) return p.hw[0];
    if (i >= p.n - 1) return p.hw[p.n - 1];
    f -= i;
    return p.hw[i] + (p.hw[i + 1] - p.hw[i]) * f;
  }
  // Demi-largeur de l'île d'une fourche (0 hors de l'île).
  function ileDemi(m, z, y) {
    const a = z.y0 + 130, b = z.y1 - 130;
    if (y < a || y > b) return 0;
    const t = (y - a) / (b - a);
    return hwA(m, y) * 0.34 * Math.sqrt(Math.sin(Math.PI * t));
  }
  // Position de côté d'un objet (les ballons roulent d'un bord à l'autre).
  function posX(m, o) {
    if (o.type === 'ballon') return cxA(m, o.y) + hwA(m, o.y) * 0.72 * Math.sin(m.t * o.w + o.ph);
    return o.x;
  }
  // 0 : calme, 1 : les bulles grossissent, 2 : le jet d'eau jaillit
  function etatGeyser(m, o) {
    const c = (((m.t + o.ph) % o.per) + o.per) % o.per / o.per;
    return c < 0.58 ? 0 : c < 0.8 ? 1 : 2;
  }

  function ajouter(m, type, y, u, extra) {
    const o = { id: ++m.id, type: type, y: y, u: u, x: cxA(m, y) + u * hwA(m, y), r: RAYONS[type], pris: false };
    if (extra) for (const k in extra) o[k] = extra[k];
    if (type === 'boule') m.boules.push(o); else m.objets.push(o);
    if (type === 'goutte') m.gouttesTotal++;
    return o;
  }

  function ligneGouttes(m, y, n, pas, u0, ampl, rnd) {
    const ph = rnd() * 6.28;
    for (let i = 0; i < n; i++) ajouter(m, 'goutte', y + i * pas, borner(u0 + ampl * Math.sin(ph + i * 0.8), -0.72, 0.72));
  }

  // Place les objets d'un morceau de glissière.
  function placerBloc(m, b, rnd) {
    const Y = b.y0, lg = m.def.ligue;
    const cote = function () { return rnd() < 0.5 ? -1 : 1; };
    switch (b.type) {
      case 'gouttes':
        ligneGouttes(m, Y, 6, 70, (rnd() * 2 - 1) * 0.45, 0.3, rnd);
        break;
      case 'boost': {
        const u = (rnd() * 2 - 1) * 0.5;
        ajouter(m, 'boost', Y + 60, u);
        if (lg >= 3) ajouter(m, 'flotteur', Y + 190, u * 0.4 + (u > 0 ? -0.45 : 0.45));
        ligneGouttes(m, Y, 3, 60, -u, 0.1, rnd);
        break;
      }
      case 'flotteur': {
        const places = [-0.55, 0, 0.55].sort(function () { return rnd() - 0.5; });
        const k = 1 + (rnd() < 0.55 ? 1 : 0) + (lg >= 2 && rnd() < 0.4 ? 1 : 0);
        for (let i = 0; i < k; i++) ajouter(m, 'flotteur', Y + 40 + i * 100, places[i] + (rnd() - 0.5) * 0.15);
        ajouter(m, 'goutte', Y + 90, places[k % 3] * 0.9);
        ajouter(m, 'goutte', Y + 160, places[k % 3] * 0.9);
        break;
      }
      case 'tremplin': {
        ajouter(m, 'tremplin', Y + 40, 0);
        ajouter(m, 'flotteur', Y + 200, (rnd() - 0.5) * 0.3);
        if (lg >= 3 && rnd() < 0.5) ajouter(m, 'flotteur', Y + 250, cote() * 0.5);
        for (let i = 0; i < 5; i++) ajouter(m, 'goutte', Y + 110 + i * 55, 0);
        break;
      }
      case 'ballon':
        ajouter(m, 'ballon', Y + 120, 0, { w: 1.5 + rnd() * 1.1 + lg * 0.18, ph: rnd() * 6.28 });
        if (lg >= 4 && rnd() < 0.5) ajouter(m, 'ballon', Y + 220, 0, { w: 1.3 + rnd(), ph: rnd() * 6.28 });
        break;
      case 'courant':
        ajouter(m, 'flotteur', Y + 300, b.dir * 0.58);
        if (lg >= 3) ajouter(m, 'flotteur', Y + 480, b.dir * 0.2);
        ligneGouttes(m, Y + 80, 5, 90, -b.dir * 0.4, 0.15, rnd);
        break;
      case 'fourche': {
        b.s = cote();
        for (let y = Y + 220; y < b.y1 - 200; y += 66) ajouter(m, 'goutte', y, b.s * 0.66);
        ajouter(m, 'boost', Y + 330, -b.s * 0.66);
        if (lg >= 3) ajouter(m, 'flotteur', Y + 480, b.s * 0.66);
        break;
      }
      case 'glace':
        ligneGouttes(m, Y + 60, 7, 85, 0, 0.55, rnd);
        if (lg >= 2) ajouter(m, 'flotteur', Y + 400, cote() * 0.35);
        break;
      case 'boule':
        ajouter(m, 'boule', Y + 100, (rnd() * 2 - 1) * 0.5, { actif: false, rot: 0 });
        ajouter(m, 'goutte', Y + 40, 0);
        break;
      case 'tunnel': {
        const s = cote();
        ajouter(m, 'flotteur', Y + 260, s * 0.45);
        ajouter(m, 'flotteur', Y + 560, -s * 0.45);
        ligneGouttes(m, Y + 120, 6, 110, 0, 0.35, rnd);
        break;
      }
      case 'tourbillon': {
        const s = cote();
        ajouter(m, 'tourbillon', Y + 150, s * 0.36);
        ajouter(m, 'goutte', Y + 110, s * 0.12);
        ajouter(m, 'goutte', Y + 190, s * 0.12);
        if (lg >= 4) ajouter(m, 'flotteur', Y + 160, -s * 0.5);
        break;
      }
      case 'geyser':
        ajouter(m, 'geyser', Y + 70, -0.42, { per: 2.4, ph: rnd() * 2.4 });
        ajouter(m, 'geyser', Y + 190, 0.36, { per: 2.4, ph: rnd() * 2.4 });
        ajouter(m, 'goutte', Y + 130, 0);
        break;
      case 'champi':
        ajouter(m, 'champi', Y + 70, cote() * 0.45);
        ajouter(m, 'champi', Y + 220, (rnd() - 0.5) * 0.3);
        ajouter(m, 'goutte', Y + 145, 0);
        break;
      case 'etroit':
        ligneGouttes(m, Y + 120, 6, 70, 0, 0.12, rnd);
        if (lg >= 4) ajouter(m, 'flotteur', Y + 310, cote() * 0.55);
        break;
      case 'bulle':
        ajouter(m, 'bulle', Y + 60, (rnd() * 2 - 1) * 0.5);
        break;
      case 'aimant': {
        ajouter(m, 'aimant', Y + 50, (rnd() * 2 - 1) * 0.4);
        for (let i = 0; i < 8; i++) ajouter(m, 'goutte', Y + 120 + i * 40, (rnd() * 2 - 1) * 0.7);
        break;
      }
      case 'anneau':
        ajouter(m, 'anneau', Y + 70, (rnd() * 2 - 1) * 0.45);
        break;
    }
  }

  function nouveauCoureur(m, x, y, opts) {
    const r = {
      id: m.coureurs.length, bot: true, x: x, y: y, v: 0, vx: 0, tx: x, f: 1, fEff: 1, skill: 0.5, agilite: 1,
      jauge: 0, turbo: 0, bouclier: 0, aimant: 0, air: 0, airMax: 1, bord: 0, tourb: 0, ignore: 0, ignoreT: 0,
      boost: 0, saut: 0, fini: false, temps: 0, place: 0, decisions: new Map(), ligne: 0, ligneT: 0,
      turboT: 4 + m.rnd() * 4, style: -1, couleur: '#3a8dff', peau: '#f1c79b', cheveux: '#5a3a1a',
      champion: false, gourmand: false, turboAuto: false, angle: 0, spin: 0
    };
    if (opts) for (const k in opts) r[k] = opts[k];
    m.coureurs.push(r);
    return r;
  }

  const COULEURS_BOTS = ['#3a8dff', '#2fbf71', '#a463f2', '#ff5fa2', '#16b8b0', '#ff9f1c'];
  const PEAUX = ['#f6d2b0', '#e0a878', '#b9784a', '#8a5532', '#f1c79b', '#5e3a22'];
  const CHEVEUX = ['#3b2412', '#e3b341', '#1d1d1d', '#a2481c', '#6b3e1e', '#2a1a0e'];

  // Crée une course. options : ev (événements), joueur (false = pas de joueur),
  // style (bouée du joueur), debut (premier élément), variante (adversaires).
  function creerMonde(def, options) {
    const o = options || {};
    const rnd = hasard(def.graine);
    const L = def.long;
    const blocs = [];
    let y = o.debut || 700, prec = null;
    while (y < L - 650) {
      const type = tirer(rnd, def.el, prec === 'gouttes' ? null : prec);
      const lg = LONGUEURS[type];
      if (y + lg > L - 450) break;
      blocs.push({ type: type, y0: y, y1: y + lg, dir: rnd() < 0.5 ? -1 : 1 });
      prec = type;
      y += lg + (150 + rnd() * 210);
    }
    const zones = blocs.filter(function (b) { return EST_ZONE[b.type]; });
    const y0 = -800, n = Math.ceil((L + 1400 - y0) / PAS) + 1;
    const cx = new Float32Array(n), hw = new Float32Array(n);
    const p1 = rnd() * 6.283, p2 = rnd() * 6.283;
    for (let i = 0; i < n; i++) {
      const yy = y0 + i * PAS;
      let f = 1;
      for (const z of zones) {
        if (z.type !== 'etroit' && z.type !== 'fourche') continue;
        const e = z.type === 'etroit' ? 0.6 : 1.3;
        f *= 1 + (e - 1) * lisse((yy - z.y0) / 160) * lisse((z.y1 - yy) / 160);
      }
      const h = def.hw * f;
      const rampe = lisse((yy - 250) / 800) * lisse((L + 100 - yy) / 700);
      const dev = def.ampl * (0.68 * Math.sin(6.2832 * yy / def.per + p1) + 0.32 * Math.sin(6.2832 * yy / (def.per * 0.43) + p2)) * rampe;
      const maxDev = LARGEUR_MONDE / 2 - h - 18;
      cx[i] = LARGEUR_MONDE / 2 + (maxDev > 1 ? maxDev * Math.tanh(dev / maxDev) : 0);
      hw[i] = h;
    }
    const m = {
      def: def, L: L, zones: zones, objets: [], boules: [], coureurs: [], t: 0, chrono: 0, arrives: 0, depart: false,

    m.objets.sort(function (a, b) { return a.y - b.y; });

    const total = def.bots + (o.joueur === false ? 0 : 1);

          g.fillStyle = 'rgba(120,210,255,.9)';
          for (let k = 0; k < 8; k++) { const a = k * 0.785 + t * 4; g.beginPath(); g.arc(x + Math.cos(a) * 30 * p, y + Math.sin(a) * 24 * p - 6, 3.5, 0, 7); g.fill(); }
        }
        break;
      }
      case 'tourbillon': {
        g.fillStyle = 'rgba(10,70,150,.35)'; g.beginPath(); g.arc(x, y, 40, 0, 7); g.fill();
        g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 3; g.lineCap = 'round';
        for (let k = 0; k < 3; k++) {
          g.beginPath();
          for (let s = 0; s < 30; s++) { const a = -t * 4 + k * 2.094 + s * 0.2, rr = 38 - s * 1.2; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
          g.stroke();
        }
        g.lineCap = 'butt';
        g.fillStyle = 'rgba(0,40,100,.6)'; g.beginPath(); g.arc(x, y, 7, 0, 7); g.fill();
        break;
      }
      case 'bulle': {
        if (o.pris) return;
        const b = Math.sin(t * 3 + o.id) * 3;
        const gr = g.createRadialGradient(x - 6, y - 7 + b, 2, x, y + b, 20);
        gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(0.6, 'rgba(180,230,255,.45)'); gr.addColorStop(1, 'rgba(255,150,230,.7)');
        g.fillStyle = gr; g.beginPath(); g.arc(x, y + b, 18, 0, 7); g.fill();
        g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 2; g.stroke();
        g.fillStyle = '#ffd23f'; etoile(g, x, y + b, 8, 3.5, 5); g.fill();
        break;
      }
      case 'aimant': {
        if (o.pris) return;
        const b = Math.sin(t * 3 + o.id) * 3;
        g.save(); g.translate(x, y + b); g.rotate(Math.sin(t * 2) * 0.3);
        g.strokeStyle = '#ff3b3b'; g.lineWidth = 8; g.beginPath(); g.arc(0, -2, 10, Math.PI, 0); g.stroke();
        g.beginPath(); g.moveTo(-10, -2); g.lineTo(-10, 8); g.moveTo(10, -2); g.lineTo(10, 8); g.stroke();
        g.strokeStyle = '#e8eef5'; g.beginPath(); g.moveTo(-10, 8); g.lineTo(-10, 14); g.moveTo(10, 8); g.lineTo(10, 14); g.stroke();
        g.restore();
        break;
      }
      case 'anneau': {
        if (o.pris) return;
        const p = 1 + 0.08 * Math.sin(t * 5 + o.id);
        g.strokeStyle = '#e59a00'; g.lineWidth = 8; g.beginPath(); g.ellipse(x, y, 22 * p, 12 * p, 0, 0, 7); g.stroke();
        g.strokeStyle = '#ffd23f'; g.lineWidth = 5; g.stroke();
        g.fillStyle = '#ffffff'; etoile(g, x + 18 * p, y - 8 * p, 5, 2, 4); g.fill();
        break;
      }
    }
  }

  // Obstacle flottant, différent selon la ligue.
  function dessinerFlotteur(g, x, y, ligue, t, id) {
    const b = Math.sin(t * 2.5 + id) * 1.5;
    g.fillStyle = 'rgba(0,40,90,.2)'; g.beginPath(); g.ellipse(x + 3, y + 6, 18, 10, 0, 0, 7); g.fill();
    g.save(); g.translate(x, y + b);
    switch (ligue) {
      case 0: // canard en caoutchouc
        g.fillStyle = '#ffd23f'; g.beginPath(); g.ellipse(0, 3, 15, 12, 0, 0, 7); g.fill();
        g.beginPath(); g.arc(0, -9, 8, 0, 7); g.fill();
        g.fillStyle = '#ff8b3d'; g.beginPath(); g.ellipse(0, -16, 4.5, 3, 0, 0, 7); g.fill();
        g.fillStyle = '#1d1d1d'; g.beginPath(); g.arc(-3, -10, 1.5, 0, 7); g.arc(3, -10, 1.5, 0, 7); g.fill();
        g.fillStyle = '#f0b400'; g.beginPath(); g.ellipse(-8, 4, 5, 7, 0.3, 0, 7); g.ellipse(8, 4, 5, 7, -0.3, 0, 7); g.fill();
        break;
      case 1: // noix de coco
        g.fillStyle = '#7a4a24'; g.beginPath(); g.arc(0, 0, 16, 0, 7); g.fill();
        g.fillStyle = '#9b6234'; g.beginPath(); g.arc(-4, -4, 9, 0, 7); g.fill();
        g.fillStyle = '#3b230f'; g.beginPath(); g.arc(-4, 3, 2.2, 0, 7); g.arc(4, 3, 2.2, 0, 7); g.arc(0, 8, 2.2, 0, 7); g.fill();
        break;
      case 2: // glaçon
        g.fillStyle = '#d8f2ff'; arrondi(g, -16, -15, 32, 30, 7); g.fill();
        g.strokeStyle = '#8cc8ee'; g.lineWidth = 2.5; g.stroke();
        g.fillStyle = '#ffffff'; arrondi(g, -10, -10, 10, 6, 3); g.fill();
        break;
      case 3: // rocher qui flotte (pierre ponce)
        g.fillStyle = '#8b7a74'; g.beginPath(); g.moveTo(-16, 4); g.lineTo(-10, -12); g.lineTo(6, -15); g.lineTo(16, -2); g.lineTo(10, 13); g.lineTo(-6, 14); g.closePath(); g.fill();
        g.fillStyle = '#a69690'; g.beginPath(); g.moveTo(-8, -8); g.lineTo(4, -11); g.lineTo(9, -2); g.lineTo(-3, 0); g.closePath(); g.fill();
        g.fillStyle = '#6d5f5a'; g.beginPath(); g.arc(-4, 6, 2, 0, 7); g.arc(6, 4, 1.6, 0, 7); g.fill();
        break;
      case 4: // étoile de mer lumineuse
        g.fillStyle = '#ffb347'; etoile(g, 0, 0, 18, 8, 5); g.fill();
        g.strokeStyle = '#e07b00'; g.lineWidth = 2; g.stroke();
        g.fillStyle = '#ffe2a8'; g.beginPath(); g.arc(0, 0, 4, 0, 7); g.fill();
        break;
      default: // petit nuage gonflable
        g.fillStyle = '#ffffff'; g.beginPath(); g.arc(-8, 2, 10, 0, 7); g.arc(3, -5, 11, 0, 7); g.arc(10, 4, 9, 0, 7); g.fill();
        g.strokeStyle = '#ffb3d6'; g.lineWidth = 2; g.stroke();
        g.fillStyle = '#ff8fc0'; g.beginPath(); g.arc(-3, 3, 2, 0, 7); g.arc(5, 3, 2, 0, 7); g.fill();
    }
    g.restore();
  }

  // Dessine tout le monde : fond, glissière, éléments, bouées, effets.
  // vue : { k, ox, camY, W, H } en pixels CSS ; dpr : densité de l'écran.
  function dessinerMonde(g, m, vue, dpr, parts) {
    const th = m.def.ligue, T = THEMES[th], t = m.t;
    const k = vue.k, camY = vue.camY, vh = vue.H / k;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = T.fond; g.fillRect(0, 0, vue.W, vue.H);
    g.setTransform(dpr * k, 0, 0, dpr * k, dpr * vue.ox, -dpr * k * camY);
    const xa = -vue.ox / k, xb = (vue.W - vue.ox) / k;
    const ya = camY - 60, yb = camY + vh + 60;

    // décors (grille fixe, tirée au hasard)
    const C = 110;
    for (let j = Math.floor(ya / C); j <= Math.ceil(yb / C); j++) {
      for (let i = Math.floor(xa / C); i <= Math.ceil(xb / C); i++) {
        const h0 = hach(i, j, 3);
        if (((i + j) & 1) === 0) { g.fillStyle = T.fond2; g.fillRect(i * C, j * C, C, C); }
        decor(g, th, i * C + 20 + h0 * 70, j * C + 20 + hach(i, j, 5) * 70, hach(i, j, 7), hach(i, j, 9), t);
      }
    }

    // plateforme de départ
    const yHaut = -300;
    if (ya < yHaut + 40) {
      g.fillStyle = 'rgba(0,0,0,.15)'; arrondi(g, 200 - 150 + 8, yHaut - 200 + 10, 300, 210, 24); g.fill();
      g.fillStyle = '#f3e2c0'; arrondi(g, 200 - 150, yHaut - 200, 300, 210, 24); g.fill();
      g.strokeStyle = '#d9c39a'; g.lineWidth = 2;
      for (let yy = yHaut - 180; yy < yHaut + 10; yy += 26) { g.beginPath(); g.moveTo(56, yy); g.lineTo(344, yy); g.stroke(); }
      [70, 330].forEach(function (fx, i) { g.fillStyle = '#7a5a3a'; g.fillRect(fx - 2, yHaut - 170, 4, 40); g.fillStyle = i ? '#3a8dff' : '#ff4d4d'; g.beginPath(); g.moveTo(fx + 2, yHaut - 170); g.lineTo(fx + 26 + Math.sin(t * 4 + i) * 3, yHaut - 162); g.lineTo(fx + 2, yHaut - 154); g.closePath(); g.fill(); });
    }

    // bassin d'arrivée
    const yPisc = m.L + 330;
    if (yb > m.L - 100) {
      g.fillStyle = '#f3e6c8'; g.beginPath(); g.arc(200, yPisc, 260, 0, 7); g.fill();
      g.strokeStyle = '#e1cf9f'; g.lineWidth = 3; g.beginPath(); g.arc(200, yPisc, 248, 0, 7); g.stroke();
      g.fillStyle = T.eau; g.beginPath(); g.arc(200, yPisc, 236, 0, 7); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.4)'; g.lineWidth = 3;
      for (let q = 0; q < 4; q++) { const rr = ((t * 40 + q * 60) % 230); g.beginPath(); g.arc(200, yPisc, rr, 0, 7); g.stroke(); }
    }

    // glissière : ombre, bords, eau
    const sa = Math.max(ya, yHaut + 10), sb = Math.min(yb, m.L + 140);
    if (sb > sa) {
      g.save(); g.translate(9, 12); g.fillStyle = 'rgba(0,0,0,.2)'; bande(g, m, sa, sb, 14, 14); g.fill(); g.restore();
      if (th === 5) {
        for (let q = 0; q < 5; q++) { g.fillStyle = ARC[q]; bande(g, m, sa, sb, 16 - q * 3, 14); g.fill(); }
      } else {
        g.fillStyle = T.bord; bande(g, m, sa, sb, 14, 14); g.fill();
        g.fillStyle = T.glissiere; bande(g, m, sa, sb, 8, 14); g.fill();
      }
      g.fillStyle = T.eau; bande(g, m, sa, sb, 0, 14); g.fill();
      // reflets qui descendent avec l'eau
      g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 3; g.lineCap = 'round';
      const dec = (t * 160) % 70;
      for (let yy = Math.floor(sa / 70) * 70 + dec; yy < sb; yy += 70) {
        const c = cxA(m, yy), h = hwA(m, yy), w = 0.25 + 0.2 * hach(Math.floor((yy - dec) / 70), 1, 2);
        g.beginPath(); g.moveTo(c - h * w - h * 0.3, yy); g.quadraticCurveTo(c - h * 0.3, yy + 8, c - h * 0.3 + h * w, yy); g.stroke();
        g.beginPath(); g.moveTo(c + h * 0.2, yy + 30); g.quadraticCurveTo(c + h * 0.2 + h * w * 0.6, yy + 36, c + h * 0.2 + h * w * 1.2, yy + 30); g.stroke();
      }
      g.lineCap = 'butt';
      // reflet sur le bord gauche
      g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = 3; g.beginPath();
      for (let yy = sa; yy <= sb; yy += 14) g.lineTo(cxA(m, yy) - hwA(m, yy) + 4, yy);
      g.stroke();
    }

    // portillon de départ
    if (ya < 40 && yb > -80) {
      const ouvert = m.depart ? Math.min(1, m.chrono * 2) : 0;
      const c = cxA(m, -30), h = hwA(m, -30);
      g.fillStyle = '#ffffff'; g.strokeStyle = '#ff4d4d'; g.lineWidth = 3;
      arrondi(g, c - h - 6 - ouvert * h, -36, h + 6, 12, 5); g.fill(); g.stroke();
      arrondi(g, c + ouvert * h, -36, h + 6, 12, 5); g.fill(); g.stroke();
    }
    // ligne d'arrivée (damier)
    if (ya < m.L + 30 && yb > m.L - 30) {
      const c = cxA(m, m.L), h = hwA(m, m.L), n = 10, w = (h * 2 + 16) / n;
      for (let q = 0; q < n; q++) for (let r2 = 0; r2 < 2; r2++) { g.fillStyle = (q + r2) % 2 ? '#222' : '#fff'; g.fillRect(c - h - 8 + q * w, m.L - 12 + r2 * 12, w + 0.5, 12); }
    }

    // zones : glace, courants, île des fourches
    for (const z of m.zones) {
      if (z.y1 < ya || z.y0 > yb) continue;
      const za = Math.max(z.y0, ya), zb = Math.min(z.y1, yb);
      if (z.type === 'glace') {
        g.fillStyle = 'rgba(240,252,255,.78)'; bande(g, m, za, zb, 0, 14); g.fill();
        g.strokeStyle = 'rgba(160,210,240,.9)'; g.lineWidth = 2;
        for (let yy = Math.ceil(za / 50) * 50; yy < zb; yy += 50) {
          const c = cxA(m, yy), h = hwA(m, yy), hx = hach(yy, 3, 1);
          g.beginPath(); g.moveTo(c - h * 0.7 + hx * h, yy); g.lineTo(c - h * 0.5 + hx * h, yy + 18); g.stroke();
          g.fillStyle = '#ffffff'; etoile(g, c + h * (0.6 - hx), yy + 20, 5 + 2 * Math.sin(t * 4 + yy), 1.5, 4); g.fill();
        }
      } else if (z.type === 'courant') {
        g.fillStyle = 'rgba(0,80,170,.16)'; bande(g, m, za, zb, 0, 14); g.fill();
        g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round';
        for (let yy = Math.ceil(za / 60) * 60; yy < zb; yy += 60) {
          const c = cxA(m, yy), h = hwA(m, yy);
          for (let q = 0; q < 3; q++) {
            let u = ((q / 3 + t * 0.6 * z.dir) % 1 + 1) % 1;
            const xx = c - h * 0.8 + u * h * 1.6;
            g.beginPath(); g.moveTo(xx - z.dir * 8, yy - 9); g.lineTo(xx + z.dir * 3, yy); g.lineTo(xx - z.dir * 8, yy + 9); g.stroke();
          }
        }
        g.lineCap = 'butt';
      } else if (z.type === 'fourche') {
        g.beginPath();
        let premier = true;
        for (let yy = z.y0 + 130; yy <= z.y1 - 130; yy += 10) { const c = cxA(m, yy), ih = ileDemi(m, z, yy); if (premier) { g.moveTo(c - ih, yy); premier = false; } else g.lineTo(c - ih, yy); }
        for (let yy = z.y1 - 130; yy >= z.y0 + 130; yy -= 10) { const c = cxA(m, yy), ih = ileDemi(m, z, yy); g.lineTo(c + ih, yy); }
        g.closePath();
        g.fillStyle = T.bord; g.fill();
        g.save(); g.clip(); g.fillStyle = T.ile; g.fillRect(xa, z.y0 + 136, xb - xa, z.y1 - z.y0 - 272); g.restore();
        const ym = (z.y0 + z.y1) / 2, cm = cxA(m, ym);
        if (th === 1 || th === 0) { feuille(g, cm - 6, ym - 30, 0.8, 0.8); feuille(g, cm + 6, ym - 20, 2.3, 0.8); fleur(g, cm, ym + 30, '#ff7ab0'); }
        else if (th === 2) sapin(g, cm, ym, 0.7);
        else if (th === 4) { g.fillStyle = '#f7e9a0'; etoile(g, cm, ym, 12, 5, 5); g.fill(); }
        else { fleur(g, cm, ym - 20, '#ffffff'); fleur(g, cm, ym + 20, '#ffd23f'); }
      }
    }

    // éléments (sauf ceux cachés sous le toit d'un tunnel)
    const j = m.joueur;
    const arr = m.objets;
    for (let i = indexDepuis(arr, ya - 40); i < arr.length && arr[i].y < yb + 40; i++) dessinerObjet(g, m, arr[i], th, t);
    for (const b of m.boules) if (b.y > ya - 40 && b.y < yb + 40) dessinerObjet(g, m, b, th, t);

    // particules sous les bouées (traînées)
    if (parts) for (const p of parts) if (p.sol) { g.globalAlpha = Math.max(0, p.vie / p.max); g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.s, 0, 7); g.fill(); }
    g.globalAlpha = 1;

    // bouées, de haut en bas
    const cs = m.coureurs.slice().sort(function (a, b) { return a.y - b.y; });
    for (const r of cs) {
      if (r.y < ya - 60 || r.y > yb + 60) continue;
      const haut = r.air > 0 ? Math.sin(Math.PI * (1 - r.air / r.airMax)) * 18 : 0;
      g.fillStyle = 'rgba(0,30,70,.25)'; g.beginPath(); g.ellipse(r.x + 4 + haut * 0.5, r.y + 7 + haut, 19 - haut * 0.2, 12 - haut * 0.2, 0, 0, 7); g.fill();
      if (r === j && !r.bot) {
        g.strokeStyle = 'rgba(255,255,255,' + (0.55 + 0.3 * Math.sin(t * 6)) + ')'; g.lineWidth = 3;
        g.beginPath(); g.arc(r.x, r.y - haut, 24, 0, 7); g.stroke();
      }
      if (r.turbo > 0) {
        g.fillStyle = 'rgba(255,210,63,.45)'; g.beginPath(); g.arc(r.x, r.y - haut, 26 + Math.sin(t * 30) * 2, 0, 7); g.fill();
      }
      dessinerBouee(g, r.x, r.y - haut, 1 + haut / 60, r.style, r.couleur, r.peau, r.cheveux, r.angle, t, r.champion);
      if (r.bouclier > 0) {
        const cl = r.bouclier < 1 && Math.sin(t * 25) > 0 ? 0.25 : 0.6;
        g.strokeStyle = 'rgba(255,255,255,' + cl + ')'; g.lineWidth = 3; g.fillStyle = 'rgba(190,235,255,' + (cl * 0.5) + ')';
        g.beginPath(); g.arc(r.x, r.y - haut, 27, 0, 7); g.fill(); g.stroke();
      }
      if (r.aimant > 0) {
        g.strokeStyle = 'rgba(255,80,80,.5)'; g.lineWidth = 2;
        const rr = 30 + ((t * 60) % 40);
        g.beginPath(); g.arc(r.x, r.y, rr, 0, 7); g.stroke();
      }
    }

    // toits des tunnels (on ne voit pas dedans… sauf quand on y est)
    for (const z of m.zones) {
      if (z.type !== 'tunnel' || z.y1 < ya || z.y0 > yb) continue;
      const dedans = j && j.y >= z.y0 && j.y <= z.y1;
      const za = Math.max(z.y0, ya), zb = Math.min(z.y1, yb);
      if (!dedans) {
        g.fillStyle = th === 4 ? '#3a2f7a' : th === 2 ? '#7fa6c9' : '#5a4f86'; bande(g, m, za, zb, 16, 14); g.fill();
        g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 6;
        for (let yy = Math.ceil(za / 60) * 60; yy < zb; yy += 60) { const c = cxA(m, yy), h = hwA(m, yy) + 16; g.beginPath(); g.moveTo(c - h, yy); g.quadraticCurveTo(c, yy + 14, c + h, yy); g.stroke(); }
      }
      [z.y0, z.y1].forEach(function (yy) {
        if (yy < ya || yy > yb) return;
        const c = cxA(m, yy), h = hwA(m, yy) + 18;
        g.fillStyle = '#2b2350'; arrondi(g, c - h, yy - 9, h * 2, 18, 9); g.fill();
        g.fillStyle = '#ffd23f';
        for (let q = -2; q <= 2; q++) { g.beginPath(); g.arc(c + q * h * 0.4, yy, 3, 0, 7); g.fill(); }
      });
    }

    // particules au-dessus (éclaboussures, étincelles)
    if (parts) for (const p of parts) if (!p.sol) {
      g.globalAlpha = Math.max(0, Math.min(1, p.vie / p.max * 1.5)); g.fillStyle = p.c;
      if (p.etoile) { etoile(g, p.x, p.y, p.s, p.s * 0.45, 4); g.fill(); } else { g.beginPath(); g.arc(p.x, p.y, p.s, 0, 7); g.fill(); }
    }
    g.globalAlpha = 1;

    // dans un tunnel : il fait noir, sauf autour de soi
    if (j && j.tunnel) {
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const sx = vue.ox + j.x * k, sy = (j.y - camY) * k;
      const gr = g.createRadialGradient(sx, sy, 40 * k, sx, sy, 190 * k);
      gr.addColorStop(0, 'rgba(8,10,30,0)'); gr.addColorStop(1, 'rgba(8,10,30,.94)');
      g.fillStyle = gr; g.fillRect(0, 0, vue.W, vue.H);
    }
  }

  // ==========================================================================
  // État du jeu
  // ==========================================================================
  const toile = document.getElementById('jeu');
  const ctx = toile.getContext('2d');
  const demoToile = document.getElementById('intro-demo');
  const dctx = demoToile.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let etat = 'titre';          // titre, niveaux, intro, compte, course, arrivee, fin, pause
  let etatAvantPause = null;
  let monde = null;            // course en cours
  let mondeTitre = null;       // toboggan animé de l'écran titre
  let demo = null, demoNouveau = null, demoT = 0;
  let niveauCourant = 0, niveauReprise = 1, partieEnCours = false;
  let compteT = 0, arriveeT = 0, dernierCompte = 0;
  let camY = 0, secousse = 0;
  let particules = [];         // dans le monde
  let ecranParts = [];         // à l'écran (confettis, gouttes qui volent)
  const entree = { gauche: false, droite: false, doigt: false, doigtX: 0, souris: false };

  const $ = function (id) { return document.getElementById(id); };
  const ecrans = ['ecran-titre', 'ecran-niveaux', 'ecran-intro', 'ecran-pause', 'ecran-fin'];
  function montrer(id) { ecrans.forEach(function (e) { $(e).hidden = e !== id; }); }

  function redimensionner() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    toile.width = Math.round(W * DPR); toile.height = Math.round(H * DPR);
  }
  window.addEventListener('resize', redimensionner);
  redimensionner();

  function vuePrincipale(camYv) {
    const k = Math.min(W / LARGEUR_MONDE, H / 560);
    return { k: k, ox: (W - LARGEUR_MONDE * k) / 2, camY: camYv, W: W, H: H };
  }

  // ---------- Effets ----------
  function eclabousser(x, y, n, c, force) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, v = (40 + Math.random() * 120) * (force || 1);

  // Événements de la course : sons et effets (sons seulement pour le joueur).

  function surEvenement(type, r, o) {
    const moi = monde && r === monde.joueur;
    switch (type) {
      case 'goutte': if (moi) { son('goutte'); versCompteur(r); eclabousser(o.x, o.y, 5, 'rgba(120,210,255,.9)', 0.6); } break;
      case 'bord': eclabousser(r.x + (r.x > cxA(monde, r.y) ? 10 : -10), r.y, 7); if (moi && monde.t - dernierBord > 0.3) { son('bord'); dernierBord = monde.t; } break;
      case 'choc': eclabousser(r.x, r.y, 12); if (moi) { son('choc'); secousse = 0.3; } break;
      case 'bouscule': if (moi && monde.t - dernierBord > 0.3) { son('bouscule'); dernierBord = monde.t; } break;
      case 'boost': etincelles(r.x, r.y, 6); if (moi) son('boost'); break;
      case 'turbo': etincelles(r.x, r.y, 14, '#ffb020'); if (moi) son('turbo'); break;
      case 'turboBot': etincelles(r.x, r.y, 6, '#ffb020'); break;
      case 'saut': if (moi) son('saut'); break;
      case 'atterrir': eclabousser(r.x, r.y, 14, null, 1.2); if (moi) son('atterrir'); break;
      case 'boing': etincelles(r.x, r.y, 6, '#ff4d6d'); if (moi) { son('boing'); secousse = 0.2; } break;
      case 'geyser': eclabousser(r.x, r.y, 20, null, 1.6); if (moi) { son('geyser'); secousse = 0.3; } break;
      case 'tourbillon': if (moi) son('tourbillon'); break;
      case 'bulle': etincelles(r.x, r.y, 10, '#bfe8ff'); if (moi) { son('bulle'); info('info_bulle'); } break;
      case 'bouclier': etincelles(r.x, r.y, 6, '#ffffff'); if (moi) son('bouclier'); break;

  // ---------- Lancement d'une course ----------
  function lancerNiveau(i, avecIntro) {
    niveauCourant = borner(i, 0, NIVEAUX.length - 1);
    niveauReprise = niveauCourant + 1;
    partieEnCours = true;
    const def = NIVEAUX[niveauCourant];
    monde = creerMonde(def, { ev: surEvenement, style: prog.bouee, peau: '#f1c79b', cheveux: '#6b3e1e' });
    particules = []; ecranParts = [];
    camY = monde.joueur.y - (H / vuePrincipale(0).k) * 0.3;
    entree.doigt = false;
    $('compte').hidden = true; $('bulle-info').hidden = true;

  }

  function texteObjectif(def) { return tr('objectif_qualif', { n: def.qualif }); }

  function montrerIntro() {
    etat = 'intro';

  function preparerHud() {
    const p = $('progres');
    p.querySelectorAll('.point').forEach(function (e) { e.remove(); });
    monde.coureurs.forEach(function (r) {
      const d = document.createElement('span');
      d.className = 'point' + (r === monde.joueur ? ' moi' : '');

  let hudCache = {};
  function majHud(force) {
    const m = monde, j = m.joueur;
    const cl = classement(m), place = cl.indexOf(j) + 1;
    const txt = tr('hud_place', { n: place, total: cl.length });
    if (force || hudCache.place !== txt) { $('hud-place-texte').textContent = txt; hudCache.place = txt; }
    const cls = place <= m.def.qualif ? 'pastille bonne' : 'pastille mauvaise';
    if (force || hudCache.cls !== cls) { $('hud-place').className = cls; hudCache.cls = cls; }
    const g = nb(m.gouttesPrises);
    if (force || hudCache.g !== g) { $('hud-gouttes-texte').textContent = g; hudCache.g = g; }
    for (const r of m.coureurs) r.point.style.left = (borner(r.y / m.L, 0, 1) * 100).toFixed(1) + '%';
    if (m.def.turbo) {
      const f = j.turbo > 0 ? j.turbo / DUREE_TURBO : j.jauge / JAUGE_MAX;
      $('jauge-turbo').setAttribute('stroke-dashoffset', (226.2 * (1 - f)).toFixed(1));
      const pret = j.jauge >= JAUGE_MAX && j.turbo <= 0;
      if (force || hudCache.pret !== pret) { $('btn-turbo').classList.toggle('pret', pret); hudCache.pret = pret; }
    }
  }

  function commencerCompte() {
    montrer(null);
    $('hud').hidden = false;
    etat = 'compte'; compteT = 3.2; dernierCompte = 0;
