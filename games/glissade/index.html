  function turboJoueur() {
    if (etat !== 'course' || !monde) return;
    if (!lancerTurbo(monde, monde.joueur) && monde.def.turbo && monde.joueur.turbo <= 0) {
      const b = $('btn-turbo'); b.classList.remove('secousse'); void b.offsetWidth; b.classList.add('secousse');
    }
  }

  // ---------- Fin de course ----------
  function finCourse() {
    etat = 'fin';
    const m = monde, j = m.joueur, def = m.def, i = niveauCourant;
    const total = m.coureurs.length, place = j.place;
    const qualifie = place <= def.qualif;
    const ratio = m.gouttesTotal ? m.gouttesPrises / m.gouttesTotal : 1;
    const premier = place === 1, gouttesOk = ratio >= 0.7;
    const etoiles = qualifie ? 1 + (premier ? 1 : 0) + (gouttesOk ? 1 : 0) : 0;
    const par = def.long / VBASE + 4;
    const score = m.gouttesPrises * 10 + (total - place) * 100 + Math.max(0, Math.round((par - j.temps) * 10));
    const ancienRecord = prog.records[i];
    const coupeAvant = coupe(def.ligue);
    let nouveauRecord = false;
    if (qualifie) {
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
      prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
      if (score > prog.records[i]) { prog.records[i] = score; nouveauRecord = true; }
      prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2));
      niveauReprise = Math.min(NIVEAUX.length, i + 2);
      enregistrerLocal();
      sauver(niveauReprise);
      // Jeu terminé (toutes les courses gagnées, maintenant ou avant) : total des meilleures étoiles.
      if (prog.etoiles.every(function (x) { return x > 0; })) { if (window.FMG) window.FMG.reportComplete({ stars: etoilesTotal(), maxStars: NIVEAUX.length * 3 }); }
    }
    $('hud').hidden = true;
    $('fin-titre').textContent = tr(qualifie ? (i === NIVEAUX.length - 1 ? 'fin_champion_titre' : 'fin_qualifie') : 'fin_non');
    $('fin-place').textContent = tr('fin_place', { n: place, total: total });
    const fe = $('fin-etoiles'); fe.innerHTML = SVG_ETOILE(true) + SVG_ETOILE(true) + SVG_ETOILE(true);
    fe.setAttribute('role', 'img'); fe.setAttribute('aria-label', tr('etoiles', { n: etoiles }));
    fe.querySelectorAll('svg').forEach(function (s, q) { if (q >= etoiles) s.outerHTML = SVG_ETOILE(false); });
    const objectifs = [
      [qualifie, texteObjectif(def)],
      [qualifie && premier, tr('obj_premier')],
      [qualifie && gouttesOk, tr('obj_gouttes', { pris: m.gouttesPrises, total: m.gouttesTotal })]
    ];
    const ul = $('fin-objectifs'); ul.innerHTML = '';
    objectifs.forEach(function (o) { const li = document.createElement('li'); li.className = o[0] ? 'ok' : 'non'; li.innerHTML = o[0] ? SVG_OK : SVG_NON; const s = document.createElement('span'); s.textContent = o[1]; li.appendChild(s); ul.appendChild(li); });
    $('fin-score').textContent = tr('fin_score', { score: 0 });
    const rec = $('fin-record');
    rec.className = '';
    if (qualifie && nouveauRecord && ancienRecord > 0) { rec.textContent = tr('fin_record_nouveau'); rec.className = 'nouveau'; }
    else rec.textContent = tr('fin_record', { record: Math.max(prog.records[i], 0) });
    if (!qualifie && prog.records[i] === 0) rec.textContent = '';
    const msg = $('fin-message'); msg.className = '';
    if (qualifie) {
      if (i === NIVEAUX.length - 1) msg.textContent = tr('fin_champion');
      else if (i % 4 === 3) msg.textContent = tr(coupeAvant ? 'fin_coupe_deja' : 'fin_coupe', { ligue: tr('ligue_' + LIGUES[def.ligue + 1]) }) + (coupeAvant ? '' : ' ' + tr('fin_bouee'));
      else msg.textContent = tr('fin_bravo');
    } else {
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: i + 1 });
      msg.className = 'conseil';
      const conseil = m.stats.bords > 14 ? 'conseil_bords' : (def.turbo && m.stats.jaugePleine > 6) ? 'conseil_turbo' : m.stats.chocs > 3 ? 'conseil_obstacles' : 'conseil_fleches';
      msg.textContent = tr('objectif_rate', { n: def.qualif }) + ' ' + tr(conseil);
    }
    $('btn-suivant').hidden = !qualifie || i === NIVEAUX.length - 1;
    $('btn-reessayer').hidden = qualifie;
    $('btn-rejouer').hidden = !qualifie;
    montrer('ecran-fin');
    son(qualifie ? 'victoire' : 'defaite');
    if (qualifie) confettis(i % 4 === 3 ? 140 : 70);
    // étoiles une à une, puis score qui défile
    fe.querySelectorAll('svg').forEach(function (s, q) {
      setTimeout(function () { s.classList.add('vue'); if (q < etoiles) son('etoile', q); }, 350 + q * 320);
    });
    const debut = performance.now();
    (function defiler() {
      if (etat !== 'fin') return;
      const f = Math.min(1, (performance.now() - debut) / 1200);
      $('fin-score').textContent = tr('fin_score', { score: Math.round(score * f) });
      if (f < 1) requestAnimationFrame(defiler); else if (rec.className === 'nouveau') son('record');
    })();
    setTimeout(function () {
      const b = qualifie ? ($('btn-suivant').hidden ? $('btn-rejouer') : $('btn-suivant')) : $('btn-reessayer');
      try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ }
    }, 60);
  }

  // ---------- Pause ----------
  function pause() {
    if (etat !== 'course' && etat !== 'compte' && etat !== 'arrivee') return;
    etatAvantPause = etat; etat = 'pause';
    entree.gauche = entree.droite = entree.doigt = false;
    if (actx) { try { actx.suspend(); } catch (e) { /* rien */ } }
    montrer('ecran-pause');
    setTimeout(function () { try { $('btn-reprendre').focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30);
  }
  function reprendre() {
    if (etat !== 'pause') return;
    montrer(null);
    etat = etatAvantPause || 'course';
    if (actx) { try { actx.resume(); } catch (e) { /* rien */ } }
  }

  // ---------- Boutons ----------
  function jouerAccueil() {
    son('clic');
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: function (d) {
        const n = borner(Math.floor(Number(d && d.niveau) || 1), 1, NIVEAUX.length);
        prog.debloque = Math.max(prog.debloque, n);
        lancerNiveau(n - 1, true);
      },
      onNouvelle: function () { lancerNiveau(0, true); },
      onEffacer: function () {
        prog = progressionVide(); enregistrerLocal();
        mondeTitre = creerMondeTitre(); majTitre();
        lancerNiveau(0, true);
      }
    });
  }
  $('btn-jouer').addEventListener('click', jouerAccueil);
  $('btn-niveaux').addEventListener('click', function () { son('clic'); allerNiveaux(); });
  $('btn-niveaux-retour').addEventListener('click', function () { son('clic'); allerTitre(); });
  $('btn-partir').addEventListener('click', function () { son('clic'); commencerCompte(); });
  $('btn-intro-niveaux').addEventListener('click', function (e) { e.stopPropagation(); son('clic'); allerNiveaux(); });
  // Un toucher n'importe où sur la carte passe la démonstration et lance la course.
  $('ecran-intro').addEventListener('click', function (e) {
    if (etat !== 'intro' || demoT < 0.8 || e.target.closest('button')) return;
    son('clic'); commencerCompte();
  });
  $('btn-pause').addEventListener('click', function () { son('clic'); pause(); });
  $('btn-reprendre').addEventListener('click', function () { reprendre(); son('clic'); });
  $('btn-recommencer').addEventListener('click', function () { if (actx) { try { actx.resume(); } catch (e) { /* rien */ } } son('clic'); lancerNiveau(niveauCourant, false); });
  $('btn-pause-niveaux').addEventListener('click', function () { if (actx) { try { actx.resume(); } catch (e) { /* rien */ } } allerNiveaux(); });
  $('btn-accueil').addEventListener('click', function () { if (actx) { try { actx.resume(); } catch (e) { /* rien */ } } allerTitre(); });
  $('btn-suivant').addEventListener('click', function () { son('clic'); lancerNiveau(niveauCourant + 1, true); });
  $('btn-reessayer').addEventListener('click', function () { son('clic'); lancerNiveau(niveauCourant, false); });
  $('btn-rejouer').addEventListener('click', function () { son('clic'); lancerNiveau(niveauCourant, false); });
  $('btn-fin-niveaux').addEventListener('click', function () { son('clic'); allerNiveaux(); });
  $('btn-turbo').addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); turboJoueur(); });
  $('btn-turbo').addEventListener('click', function (e) { if (e.detail === 0) turboJoueur(); });

  // ---------- Contrôles ----------
  function versMondeX(clientX) { const v = vuePrincipale(0); return (clientX - v.ox) / v.k; }
  function premiereAction() { if (!aAgi) { aAgi = true; audio(); } }
  window.addEventListener('pointerdown', premiereAction, true);
  window.addEventListener('keydown', premiereAction, true);

  toile.addEventListener('pointerdown', function (e) {
    if (etat !== 'course' && etat !== 'compte') return;
    entree.doigt = true; entree.souris = false; entree.doigtX = versMondeX(e.clientX);
    try { toile.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
  });
  toile.addEventListener('pointermove', function (e) {
    if (etat !== 'course' && etat !== 'compte') return;
    if (entree.doigt || e.pointerType === 'mouse') { entree.doigtX = versMondeX(e.clientX); if (e.pointerType === 'mouse') entree.souris = true; }
  });
  const lacher = function () { entree.doigt = false; };
  toile.addEventListener('pointerup', lacher);
  toile.addEventListener('pointercancel', lacher);

  window.addEventListener('keydown', function (e) {
    const c = e.code;
    if (etat === 'course' || etat === 'compte' || etat === 'arrivee') {
      if (c === 'ArrowLeft' || c === 'KeyA' || c === 'KeyQ') { entree.gauche = true; entree.souris = false; e.preventDefault(); }
      else if (c === 'ArrowRight' || c === 'KeyD') { entree.droite = true; entree.souris = false; e.preventDefault(); }
      else if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW' || c === 'KeyZ') { turboJoueur(); e.preventDefault(); }
      else if (c === 'Escape' || c === 'KeyP') { pause(); e.preventDefault(); }
    } else if (etat === 'pause') {
      if (c === 'Escape' || c === 'KeyP') { reprendre(); e.preventDefault(); }
    } else if (etat === 'intro') {
      if ((c === 'Enter' || c === 'Space') && document.activeElement !== $('btn-intro-niveaux')) { e.preventDefault(); son('clic'); commencerCompte(); }
    } else if (etat === 'titre') {
      if (c === 'Enter' && document.activeElement === document.body) { e.preventDefault(); jouerAccueil(); }
    }
  });
  window.addEventListener('keyup', function (e) {
    const c = e.code;
    if (c === 'ArrowLeft' || c === 'KeyA' || c === 'KeyQ') entree.gauche = false;
    if (c === 'ArrowRight' || c === 'KeyD') entree.droite = false;
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); });
  window.addEventListener('blur', function () { entree.gauche = entree.droite = false; });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie.
  JEL_SAVE.surFermeture(function () {
    if (partieEnCours) sauver(niveauReprise);
  });

  // ==========================================================================
  // Boucle principale
  // ==========================================================================
  function majParticules(dt) {
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94;
      if (p.vie <= 0) particules.splice(i, 1);
    }
    if (particules.length > 400) particules.splice(0, particules.length - 400);
  }

  function traineeCoureurs(m) {
    for (const r of m.coureurs) {
      if (r.v < 120 || r.fini) continue;
      if (Math.random() < 0.5) particules.push({ sol: true, x: r.x + (Math.random() - 0.5) * 20, y: r.y - 14, vx: 0, vy: 0, vie: 0.5, max: 0.5, s: 3 + Math.random() * 3, c: 'rgba(255,255,255,.7)' });
      if (r.turbo > 0) particules.push({ x: r.x + (Math.random() - 0.5) * 14, y: r.y - 18, vx: (Math.random() - 0.5) * 40, vy: -60, vie: 0.4, max: 0.4, s: 4, c: Math.random() < 0.5 ? '#ffd23f' : '#ff8b3d', etoile: true });
    }
  }

  function dessinerEcranParts(dt) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    for (let i = ecranParts.length - 1; i >= 0; i--) {
      const p = ecranParts[i];
      p.vie += dt;
      if (p.vie >= p.max) { ecranParts.splice(i, 1); continue; }
      if (p.goutte) {
        const f = p.vie / p.max, x = p.x + (p.x1 - p.x) * f, y = p.y + (p.y1 - p.y) * f - Math.sin(f * Math.PI) * 60;
        ctx.fillStyle = '#2fa6ff'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, 7 - f * 3, 0, 7); ctx.fill(); ctx.stroke();
      } else {
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
      }
    }
  }

  // Petite main qui montre le geste (tutoriel animé).
  function dessinerMain(g, x, y, appui) {
    g.save(); g.translate(x, y); g.scale(appui ? 0.9 : 1, appui ? 0.9 : 1);
    g.fillStyle = '#ffffff'; g.strokeStyle = '#0f4d8a'; g.lineWidth = 2.5;
    arrondi(g, -5, -30, 10, 26, 5); g.fill(); g.stroke();
    arrondi(g, -13, -10, 28, 26, 9); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(-3, -6); g.lineTo(-3, 2); g.moveTo(4, -6); g.lineTo(4, 2); g.stroke();
    if (appui) { g.strokeStyle = 'rgba(255,210,63,.9)'; g.lineWidth = 3; g.beginPath(); g.arc(0, -32, 10, 0, 7); g.stroke(); }
    g.restore();
  }
  function fleche(g, x, y, t) {
    const b = Math.sin(t * 6) * 5;
    g.save(); g.translate(x, y - 34 + b);
    g.fillStyle = '#ffd23f'; g.strokeStyle = '#b36b00'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(-8, -16); g.lineTo(8, -16); g.lineTo(8, -2); g.lineTo(15, -2); g.lineTo(0, 12); g.lineTo(-15, -2); g.lineTo(-8, -2); g.closePath(); g.fill(); g.stroke();
    g.restore();
  }

  // Démonstration de la nouveauté, dans la carte d'avant-course.
  function dessinerDemo(dt) {
    if (!demo) return;
    demoT += dt;
    avancer(demo, dt);
    const j = demo.joueur;
    if (j.y > demo.L - 300) { demo = creerDemo(niveauCourant); demoT = 0; return; }
    const rect = demoToile.getBoundingClientRect();
    const w = Math.max(10, rect.width), h = Math.max(10, rect.height);
    const d = Math.min(2, window.devicePixelRatio || 1);
    if (demoToile.width !== Math.round(w * d)) { demoToile.width = Math.round(w * d); demoToile.height = Math.round(h * d); }
    const k = w / 300;
    const v = { k: k, ox: w / 2 - 200 * k, camY: j.y - (h / k) * 0.3, W: w, H: h };
    dessinerMonde(dctx, demo, v, d, null);
    dctx.setTransform(d, 0, 0, d, 0, 0);
    const sx = function (x) { return v.ox + x * k; }, sy = function (y) { return (y - v.camY) * k; };
    // flèche vers la nouveauté la plus proche devant
    const type = NOUVEAU_TYPE[demoNouveau];
    if (type) {
      let cible = null;
      if (EST_ZONE[type]) { for (const z of demo.zones) if (z.type === type && z.y1 > j.y) { cible = { x: cxA(demo, Math.max(z.y0, j.y + 120)), y: Math.max(z.y0, j.y + 120) }; break; } }
      else { const liste = type === 'boule' ? demo.boules : demo.objets; for (const o of liste) if (o.type === type && o.y > j.y + 40 && !o.pris) { cible = { x: posX(demo, o), y: o.y }; break; } }
      if (cible && sy(cible.y) < h - 10) fleche(dctx, sx(cible.x), sy(cible.y) - 10, demoT);
    }
    if (demoNouveau === 'turbo' || (demo.def.turbo && j.jauge >= JAUGE_MAX - 1)) {
      // bouton turbo dessiné, avec sa jauge
      const bx = w - 34, by = h - 34;
      dctx.fillStyle = 'rgba(255,255,255,.92)'; dctx.beginPath(); dctx.arc(bx, by, 24, 0, 7); dctx.fill();
      dctx.strokeStyle = '#ffb020'; dctx.lineWidth = 5; dctx.beginPath(); dctx.arc(bx, by, 20, -Math.PI / 2, -Math.PI / 2 + 6.283 * (j.turbo > 0 ? j.turbo / DUREE_TURBO : j.jauge / JAUGE_MAX)); dctx.stroke();
      dctx.fillStyle = '#ff8b3d'; dctx.beginPath(); dctx.moveTo(bx + 3, by - 13); dctx.lineTo(bx - 7, by + 2); dctx.lineTo(bx - 1, by + 2); dctx.lineTo(bx - 3, by + 13); dctx.lineTo(bx + 7, by - 3); dctx.lineTo(bx + 1, by - 3); dctx.closePath(); dctx.fill();
      if (j.turbo > DUREE_TURBO - 0.6 || j.jauge >= JAUGE_MAX - 1) dessinerMain(dctx, bx + 4, by + 34, j.turbo > 0);
      else dessinerMain(dctx, sx(j.tx), h - 8, false);
    } else {
      dessinerMain(dctx, sx(j.tx), h - 8, false);
    }
    if (demoNouveau === 'diriger') {
      const etape = Math.floor(demoT / 2.5) % 3;
      const txt = tr('tuto_' + (etape + 1));
      if ($('intro-etape').textContent !== txt) $('intro-etape').textContent = txt;
    }
  }

  let avant = performance.now();
  function boucle(maintenant) {
    let dt = Math.min(0.05, Math.max(0, (maintenant - avant) / 1000));
    avant = maintenant;

    if (etat === 'titre' || etat === 'niveaux') {
      const m = mondeTitre;
      avancer(m, dt);
      const tete = m.coureurs[0];
      if (tete.y > m.L - 1500) mondeTitre = creerMondeTitre();
      const v = vuePrincipale(0);
      // la caméra suit le milieu du groupe, au-dessus de la carte des consignes
      let ymin = Infinity, ymax = -Infinity;
      for (const r of m.coureurs) { ymin = Math.min(ymin, r.y); ymax = Math.max(ymax, r.y); }
      camY += (((ymin + ymax) / 2 - (H / v.k) * 0.34) - camY) * Math.min(1, dt * 3);
      v.camY = camY;
      majParticules(dt); traineeCoureursTitre(m);
      dessinerMonde(ctx, m, v, DPR, particules);
    } else if (monde) {
      const m = monde, j = m.joueur;
      if (etat === 'compte') {
        compteT -= dt;
        const n = Math.ceil(compteT - 0.2);
        const c = $('compte');
        if (n >= 1 && n <= 3 && n !== dernierCompte) { dernierCompte = n; c.textContent = nb(n); c.className = 'anime'; void c.offsetWidth; c.classList.add('anime'); c.hidden = false; son('bip'); }
        if (compteT <= 0.2 && dernierCompte !== 0) {
          dernierCompte = 0; m.depart = true; etat = 'course';
          c.textContent = tr('partez'); c.className = 'mot anime'; son('partez');
          setTimeout(function () { if (c.textContent === tr('partez')) c.hidden = true; }, 700);
        }
        avancer(m, dt);
      } else if (etat === 'course' || etat === 'arrivee') {
        // commande du joueur
        if (!j.fini) {
          if (entree.gauche || entree.droite) j.tx = j.x + ((entree.droite ? 1 : 0) - (entree.gauche ? 1 : 0)) * 90;
          else if (entree.doigt || entree.souris) j.tx = entree.doigtX;
          else j.tx = j.x + j.vx * 0.05;
        }
        avancer(m, dt);
        traineeCoureurs(m);
        if (etat === 'course' && j.fini) { etat = 'arrivee'; arriveeT = 1.6; }
        if (etat === 'arrivee') { arriveeT -= dt; if (arriveeT <= 0) finCourse(); }
        majHud(false);
      } else if (etat === 'intro') {
        m.t += dt;
      } else if (etat === 'fin') {
        avancer(m, dt);
      }
      if (etat === 'intro') dessinerDemo(dt);
      if (etat !== 'pause') majParticules(dt);
      const v = vuePrincipale(0);
      const cible = j.y - (H / v.k) * 0.3;
      camY += (cible - camY) * Math.min(1, dt * 8);
      v.camY = camY;
      if (secousse > 0 && etat !== 'pause') { secousse -= dt; v.ox += (Math.random() - 0.5) * 10 * secousse / 0.3; v.camY += (Math.random() - 0.5) * 8 * secousse / 0.3; }
      dessinerMonde(ctx, m, v, DPR, particules);
    }
    dessinerEcranParts(etat === 'pause' ? 0 : dt);
    requestAnimationFrame(boucle);
  }
  function traineeCoureursTitre(m) {
    for (const r of m.coureurs) if (Math.random() < 0.4) particules.push({ sol: true, x: r.x + (Math.random() - 0.5) * 20, y: r.y - 14, vx: 0, vy: 0, vie: 0.5, max: 0.5, s: 3 + Math.random() * 3, c: 'rgba(255,255,255,.7)' });
  }

  // Démarrage
  I18N.surChangement(function () { majSon(); majTitre(); });
  majSon();
  mondeTitre = creerMondeTitre();
  camY = mondeTitre.coureurs[1].y - (H / vuePrincipale(0).k) * 0.34;
  majTitre();
  montrer('ecran-titre');
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
