<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });

  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).

      b.lang = l;
      b.dataset.lang = l;

      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

    { ligue: 2, long: 23000, bots: 5, vit: [0.88, 0.97], evite: 0.6, turbo: 0.5, qualif: 3, virages: 0.4, tunnels: 2,

    // Ligue des Orques
    { ligue: 3, long: 24000, bots: 5, vit: [0.91, 1.0], evite: 0.68, turbo: 0.58, qualif: 2, virages: 0.2, nouv: 'tourbillon',
      p: { bulle: 3, coq: 2, tourbillon: 5, canard: 1, fleche: 1 } },

      p: { bulle: 3, coq: 2, ballon: 3, tourbillon: 2, tremplin: 2 } },
    // Ligue des Champions
    { ligue: 4, long: 25000, bots: 5, vit: [0.93, 1.02], evite: 0.78, turbo: 0.68, qualif: 2, virages: 0.3, etroits: 3, nouv: 'etroit',
      p: { bulle: 3, coq: 2, canard: 3, fleche: 2, jet: 1 } },
    { ligue: 4, long: 27000, bots: 5, vit: [0.94, 1.03], evite: 0.8, turbo: 0.7, qualif: 2, virages: 0.36, etroits: 2, tunnels: 2,
      p: { bulle: 3, coq: 2, ballon: 3, canard: 2, tremplin: 1, fleche: 1 } },
    { ligue: 4, long: 29000, bots: 5, vit: [0.94, 1.03], evite: 0.84, turbo: 0.75, qualif: 2, virages: 0.42, etroits: 2, tunnels: 1,
      p: { bulle: 3, coq: 2, canard: 2, fleche: 1, jet: 2, tremplin: 2, tourbillon: 2, ballon: 2 } },
    { ligue: 4, long: 32000, bots: 5, vit: [0.94, 1.03], evite: 0.88, turbo: 0.8, qualif: 2, virages: 0.45, etroits: 2, tunnels: 2, finale: true,
      p: { bulle: 4, coq: 2, canard: 2, fleche: 2, jet: 2, tremplin: 2, tourbillon: 2, ballon: 2 } },

  window.JEL_NIVEAUX = NIVEAUX.length;

  // Nouveautés : ordre des étapes du tutoriel et cartes des mécaniques.
  const TUTO = ['glisser', 'bulle', 'arrivee'];

  // ---------------------------------------------------------------------
  // Sauvegarde (toujours dans try/catch : le jeu marche sans stockage).
  // ---------------------------------------------------------------------
  const CLE = 'glissade-v1';
  let sauve = { etoiles: [], records: [], animal: 'loutre', bouee: 0, son: true, vus: {}, coureurChoisi: false };
  try {
    const brut = localStorage.getItem(CLE);
    if (brut) Object.assign(sauve, JSON.parse(brut));
  } catch (e) { /* stockage indisponible */ }
  if (!Array.isArray(sauve.etoiles)) sauve.etoiles = [];
  if (!Array.isArray(sauve.records)) sauve.records = [];
  if (!sauve.vus || typeof sauve.vus !== 'object') sauve.vus = {};
  function enregistrer() {
    try { localStorage.setItem(CLE, JSON.stringify(sauve)); } catch (e) { /* stockage refusé */ }
  }
  const etoilesDe = (i) => sauve.etoiles[i] || 0;
  const estOuvert = (i) => i === 0 || etoilesDe(i - 1) > 0;
  function liguesGagnees() {
    let n = 0;
    for (let l = 0; l < LIGUES.length; l++) if (etoilesDe(l * 4 + 3) > 0) n++;
    return n;
  }
  const boueeOuverte = (b) => b <= liguesGagnees();

  // ---------------------------------------------------------------------
  // Hasard reproductible (chaque course a son propre tracé).
  // ---------------------------------------------------------------------
  function hasard(graine) {
    let a = graine >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let x = a;
      x = Math.imul(x ^ (x >>> 15), x | 1);
      x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }
  function bruitHash(a, b) {
    let x = (a * 374761393 + b * 668265263) >>> 0;
    x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, f) => a + (b - a) * f;

  // ---------------------------------------------------------------------
  // Sons (Web Audio, aucun fichier ; rien avant la première action).
  // ---------------------------------------------------------------------
  const Son = {
    ctx: null, maitre: null, eau: null, eauGain: null,
    demarrer() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
      try {
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return;
        this.ctx = new C();
        this.maitre = this.ctx.createGain();
        this.maitre.gain.value = sauve.son ? 0.8 : 0;
        this.maitre.connect(this.ctx.destination);
        // Bruit blanc réutilisé pour l'eau et les éclaboussures.
        const n = this.ctx.sampleRate * 2;
        this.bruit = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
        const d = this.bruit.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { this.ctx = null; }
    },
    majVolume() {
      if (this.maitre) this.maitre.gain.setTargetAtTime(sauve.son ? 0.8 : 0, this.ctx.currentTime, 0.02);
    },
    note(freq, duree, type, vol, vers, retard) {
      if (!this.ctx || !sauve.son) return;
      const c = this.ctx, t0 = c.currentTime + (retard || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      if (vers) o.frequency.exponentialRampToValueAtTime(vers, t0 + duree);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
      o.connect(g); g.connect(this.maitre);
      o.start(t0); o.stop(t0 + duree + 0.05);
    },
    souffle(duree, freq, vol, vers) {
      if (!this.ctx || !sauve.son) return;
      const c = this.ctx, t0 = c.currentTime;
      const s = c.createBufferSource(); s.buffer = this.bruit;
      const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
      f.frequency.setValueAtTime(freq, t0);
      if (vers) f.frequency.exponentialRampToValueAtTime(vers, t0 + duree);
      const g = c.createGain();
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
      s.connect(f); f.connect(g); g.connect(this.maitre);
      s.start(t0, Math.random()); s.stop(t0 + duree + 0.05);
    },
    eauDemarrer() {
      if (!this.ctx || this.eau) return;
      const c = this.ctx;
      this.eau = c.createBufferSource(); this.eau.buffer = this.bruit; this.eau.loop = true;
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
      this.eauGain = c.createGain(); this.eauGain.gain.value = 0.0001;
      this.eauGain.gain.setTargetAtTime(0.06, c.currentTime, 0.3);
      this.eau.connect(f); f.connect(this.eauGain); this.eauGain.connect(this.maitre);
      this.eau.start();
    },
    eauArreter() {
      if (!this.eau) return;
      try { this.eau.stop(); } catch (e) { /* déjà arrêté */ }
      this.eau = null;
    },
    bip() { this.note(660, 0.18, 'square', 0.12); },
    depart() { this.note(990, 0.4, 'square', 0.14); this.souffle(0.6, 900, 0.25, 300); },
    turbo() { this.note(300, 0.35, 'sawtooth', 0.08, 1200); this.souffle(0.4, 600, 0.2, 2400); },
    elan() { this.souffle(0.25, 1200, 0.18, 2600); },
    coq() { this.note(1320, 0.12, 'triangle', 0.15); this.note(1760, 0.16, 'triangle', 0.12, null, 0.06); },
    canard() { this.note(700, 0.22, 'square', 0.12, 380); this.note(520, 0.2, 'square', 0.1, 300, 0.12); },
    mur() { this.souffle(0.3, 1500, 0.22, 500); },
    jet() { this.souffle(0.5, 2500, 0.18, 1200); },

    atterrir() { this.souffle(0.35, 700, 0.3, 200); },

    defaite() { [523, 440, 392, 330].forEach((f, i) => this.note(f, 0.3, 'triangle', 0.13, null, i * 0.16)); },
    etoile(i) { this.note(880 + i * 220, 0.25, 'triangle', 0.15); },

  // ---------------------------------------------------------------------
  // Création du toboggan d'une course : tracé (virages, passages étroits),
  // tunnels et éléments (bulles, coquillages, obstacles…).
  // ---------------------------------------------------------------------
  function genererPiste(niv, graine) {
    const rnd = hasard(graine);
    const L = niv.long;
    const n = Math.ceil((L + 4000) / PAS) + 2;
    const cx = new Float32Array(n), hw = new Float32Array(n).fill(HW);
    // Tracé : alternance de lignes droites et de virages.
    let pente = 0, cible = 0, reste = Math.round(700 / PAS), x = 0, sens = rnd() < 0.5 ? -1 : 1, virage = false;
    for (let i = 0; i < n; i++) {
      if (--reste <= 0) {
        virage = !virage && niv.virages > 0.15;
        if (virage) {
          sens = rnd() < 0.7 ? -sens : sens;
          cible = sens * niv.virages * (0.7 + rnd() * 0.3);
          reste = Math.round((600 + rnd() * 600) / PAS);
        } else {
          cible = (rnd() - 0.5) * 2 * Math.min(0.1, niv.virages + 0.05);
          reste = Math.round((400 + rnd() * 700) / PAS);
        }
      }
      if (i * PAS > L - 400) cible = 0; // ligne droite avant l'arrivée
      pente += (cible - pente) * 0.06;
      x += pente * PAS;
      cx[i] = x;
    }
    // Passages étroits.
    const etroits = [];
    for (let k = 0; k < (niv.etroits || 0); k++) {
      const d0 = L * (k + 0.6) / ((niv.etroits || 1) + 0.5) + (rnd() - 0.5) * 600;
      const d1 = d0 + 1400 + rnd() * 600;
      etroits.push([d0, d1]);
      for (let i = 0; i < n; i++) {
        const d = i * PAS;
        let f = 0;
        if (d > d0 - 250 && d < d1 + 250) f = Math.min(1, (d - (d0 - 250)) / 250, ((d1 + 250) - d) / 250);
        hw[i] = Math.min(hw[i], lerp(HW, HW_ETROIT, clamp(f, 0, 1)));
      }
    }
    // Tunnels.
    const tunnels = [];
    for (let k = 0; k < (niv.tunnels || 0); k++) {
      const d0 = L * (k + 0.35) / ((niv.tunnels || 1) + 0.2) + (rnd() - 0.5) * 500;
      tunnels.push([d0, d0 + 1500 + rnd() * 700]);
    }
    const piste = { L, cx, hw, n, tunnels, etroits, objets: [] };

    // Éléments, placés de loin en loin.
    const obj = piste.objets;
    const poids = Object.entries(niv.p);
    const total = poids.reduce((s, e) => s + e[1], 0);
    const lim = (d, marge) => hwA(piste, d) - marge;
    const auHasard = (d, marge) => (rnd() * 2 - 1) * lim(d, marge);
    let d = 1000, dernierType = '';
    while (d < L - 600) {
      let r = rnd() * total, type = poids[0][0];
      for (const [k, w] of poids) { r -= w; if (r <= 0) { type = k; break; } }
      if (type === dernierType && type !== 'coq' && rnd() < 0.5) continue;
      dernierType = type;
      let longueur = 0;
      const etroit = hwA(piste, d) < HW - 20;
      if (type === 'bulle') {
        const x0 = auHasard(d, 40);
        if (rnd() < 0.5) for (let j = 0; j < 3; j++) obj.push({ type: 'coq', d: d - 200 + j * 60, x: x0 });
        obj.push({ type: 'bulle', d, x: x0 });
        longueur = 80;
      } else if (type === 'coq') {
        const x0 = auHasard(d, 30), x1 = clamp(x0 + (rnd() - 0.5) * 180, -lim(d, 30), lim(d, 30));
        for (let j = 0; j < 5; j++) obj.push({ type: 'coq', d: d + j * 60, x: lerp(x0, x1, j / 4) });
        longueur = 260;
      } else if (type === 'fleche') {
        obj.push({ type: 'fleche', d, x: auHasard(d, 45) });
        longueur = 60;
      } else if (type === 'canard') {
        if (etroit || rnd() < 0.35) {
          obj.push({ type: 'canard', d, x: auHasard(d, 30) });
        } else {
          // Deux canards qui laissent un passage (parfois avec une bulle au milieu).
          const trou = auHasard(d, 60);
          const ecart = 92 + rnd() * 26;
          for (const s of [-1, 1]) {
            const xc = trou + s * ecart;
            if (Math.abs(xc) < lim(d, 18)) obj.push({ type: 'canard', d, x: xc });
          }
          if (rnd() < 0.4) obj.push({ type: 'bulle', d: d + 10, x: trou });
        }
        longueur = 60;
      } else if (type === 'jet') {
        obj.push({ type: 'jet', d, x: 0, cote: rnd() < 0.5 ? -1 : 1, long: 260, periode: 2.6, actif: 1.0, phase: rnd() * 2.6 });
        longueur = 300;
      } else if (type === 'tremplin') {
        const xr = auHasard(d, 70);
        obj.push({ type: 'tremplin', d, x: xr });
        // Rangée de canards après le tremplin, avec un passage du côté opposé.
        const dC = d + 230, h = lim(dC, 18);
        const trou = xr > 0 ? -h + 50 : h - 50;
        for (let xc = -h; xc <= h + 1; xc += 62) if (Math.abs(xc - trou) > 78) obj.push({ type: 'canard', d: dC, x: xc });
        for (let j = 0; j < 4; j++) obj.push({ type: 'coq', d: d + 120 + j * 70, x: xr, haut: true });
        longueur = 360;
      } else if (type === 'tourbillon') {
        if (etroit) { obj.push({ type: 'bulle', d, x: auHasard(d, 40) }); longueur = 60; }
        else { obj.push({ type: 'tourbillon', d, x: auHasard(d, 80), r: 70 }); longueur = 150; }
      } else if (type === 'ballon') {
        obj.push({ type: 'ballon', d, x: 0, amp: lim(d, 30), w: 1.3 + rnd() * 0.9, phase: rnd() * 6.28 });
        longueur = 80;
      }
      d += longueur + 300 + rnd() * 220 - Math.min(80, (niv.ligue || 0) * 18);
    }
    obj.sort((a, b) => a.d - b.d);
    obj.forEach((o, i) => { o.id = i; });
    return piste;
  }
  function interp(arr, d) {
    const f = d / PAS;
    if (f <= 0) return arr[0];
    const i = Math.floor(f);
    if (i >= arr.length - 1) return arr[arr.length - 1];
    return lerp(arr[i], arr[i + 1], f - i);
  }
  const cxA = (p, d) => interp(p.cx, d);
  const hwA = (p, d) => interp(p.hw, d);
  const penteA = (p, d) => (cxA(p, d + PAS) - cxA(p, d)) / PAS;
  const dansTunnel = (p, d) => {
    let f = 0;
    for (const [a, b] of p.tunnels) {
      if (d > a - 120 && d < b + 120) f = Math.max(f, Math.min(1, (d - (a - 120)) / 160, ((b + 120) - d) / 160));
    }
    return clamp(f, 0, 1);
  };
  // Position d'un ballon à un instant donné.
  const xBallon = (o, temps) => o.amp * Math.sin(o.phase + o.w * temps);
  // Un jet est-il actif (ou sur le point de l'être) ?
  function etatJet(o, temps) {
    const c = (temps + o.phase) % o.periode;
    if (c < o.actif) return 'actif';
    if (c > o.periode - 0.7) return 'alerte';
    return 'repos';
  }

  // ---------------------------------------------------------------------
  // Monde d'une course (aussi utilisé pour la course de démonstration
  // derrière l'écran titre, sans joueur).
  // ---------------------------------------------------------------------
  function creerMonde(iNiv, avecJoueur) {
    const niv = NIVEAUX[iNiv];
    const piste = genererPiste(niv, 1234 + iNiv * 7919 + (avecJoueur ? 0 : Math.floor(Math.random() * 1e6)));
    const rnd = hasard(99 + iNiv * 31 + (avecJoueur ? 0 : Math.floor(Math.random() * 1e6)));
    const iJoueur = Math.max(0, ANIMAUX.findIndex((a) => a.cle === sauve.animal));
    const ordre = [iJoueur].concat(ANIMAUX.map((a, i) => i).filter((i) => i !== iJoueur));
    const nbBots = avecJoueur ? niv.bots : 6;
    const total = nbBots + (avecJoueur ? 1 : 0);
    // Vitesses des adversaires réparties entre min et max, puis mélangées.
    const vits = [];
    for (let i = 0; i < nbBots; i++) vits.push(lerp(niv.vit[0], niv.vit[1], nbBots > 1 ? i / (nbBots - 1) : 1));
    for (let i = vits.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [vits[i], vits[j]] = [vits[j], vits[i]]; }
    // Grille de départ : deux rangées ; le joueur part au milieu de la 2e.
    const places = [];
    const rang1 = Math.ceil(total / 2), rang2 = total - rang1;
    for (let i = 0; i < rang1; i++) places.push({ d: 0, x: lerp(-100, 100, rang1 > 1 ? i / (rang1 - 1) : 0.5) });
    for (let i = 0; i < rang2; i++) places.push({ d: -70, x: lerp(-70, 70, rang2 > 1 ? i / (rang2 - 1) : 0.5) });
    const coureurs = [];
    let iPlace = 0;
    const placeJoueur = avecJoueur ? rang1 + Math.floor(rang2 / 2) : -1;
    for (let k = 0; k < total; k++) {
      const estJoueur = avecJoueur && k === 0;
      const animal = ANIMAUX[ordre[k % ordre.length]];
      let pl;
      if (estJoueur) pl = places[placeJoueur];
      else { if (iPlace === placeJoueur) iPlace++; pl = places[iPlace++]; }
      const ecart = (rnd() - 0.5) * 0.16;
      coureurs.push({
        joueur: estJoueur, animal, bouee: estJoueur ? sauve.bouee : 0,
        d: pl.d, x: pl.x, tx: pl.x, v: 0, vx: 0,
        vit: estJoueur ? 1 : vits[k - (avecJoueur ? 1 : 0)],
        evite: estJoueur ? 1 : clamp(niv.evite + ecart, 0, 0.97),
        turbo: estJoueur ? 1 : clamp(niv.turbo + ecart, 0, 0.95),
        reflexion: 0, boost: 0, elan: 0, etourdi: 0, tour: 0, saut: 0, mur: 0,
        touches: new Set(), fini: false, temps: 0, rang: 0, num: k,
      });
    }
    const monde = {
      iNiv, niv, piste, coureurs, joueur: avecJoueur ? coureurs[0] : null,
      temps: 0, camD: 0, camX: cxA(piste, 0), secousse: 0, particules: [], ecume: [], confettis: [],
      arrives: 0, coquillages: 0, demo: !avecJoueur, enCourse: !avecJoueur,
    };
    monde.suivi = monde.joueur || coureurs[0];
    return monde;
  }

  // ---------------------------------------------------------------------
  // Intelligence des adversaires : ils regardent devant eux, évitent les
  // obstacles qu'ils « voient » (selon leurs réflexes) et visent les bulles.
  // ---------------------------------------------------------------------
  function decider(m, c) {
    const p = m.piste;
    const h = hwA(p, c.d + 120) - R - 4;
    const regard = 240 + 480 * c.evite;
    let meilleur = c.x, score = -1e9;
    for (let cand = -h; cand <= h + 0.1; cand += 16) {
      let s = -Math.abs(cand - c.x) * 0.03 - Math.abs(cand) * 0.004;
      for (const o of p.objets) {
        const dd = o.d - c.d;
        if (dd < 20) continue;
        if (dd > regard) break;
        const proche = 1 - dd / regard * 0.5;
        const voit = bruitHash(o.id, c.num * 13 + 7);
        if (o.type === 'canard' || o.type === 'tourbillon' || o.type === 'ballon') {
          if (voit > c.evite) continue;
          const ox = o.type === 'ballon' ? xBallon(o, m.temps + dd / Math.max(200, c.v)) : o.x;
          const rayon = o.type === 'tourbillon' ? o.r + R : 26 + R + 12;
          if (Math.abs(cand - ox) < rayon) s -= 120 * proche;
        } else if (o.type === 'bulle' || o.type === 'fleche' || o.type === 'tremplin') {
          if (voit > c.turbo) continue;
          const largeur = o.type === 'bulle' ? 24 : o.type === 'fleche' ? 34 : 56;
          if (Math.abs(cand - o.x) < largeur) s += (o.type === 'bulle' ? 45 : 25) * proche;
        }
      }
      if (s > score) { score = s; meilleur = cand; }
    }
    // Les adversaires habiles compensent la poussée des virages.
    const poussee = -penteA(p, c.d + 60) * c.v * 0.9;
    c.tx = clamp(meilleur - poussee / GAIN_LAT * c.evite, -h, h);
    c.reflexion = 0.32 - 0.2 * c.evite + Math.random() * 0.08;
  }

  // ---------------------------------------------------------------------
  // Mise à jour d'un instant de course.
  // ---------------------------------------------------------------------
  function majMonde(m, dt) {
    m.temps += dt;
    const p = m.piste, j = m.joueur;
    for (const c of m.coureurs) {
      if (!c.joueur) {
        c.reflexion -= dt;
        if (c.reflexion <= 0) decider(m, c);
      }
      // Vitesse visée.
      let cible = VMAX * c.vit;
      if (!c.joueur && j && m.enCourse && !j.fini) {
        // Petit coup de pouce (ou de frein) pour garder la course serrée.
        const ecart = c.d - j.d;
        if (ecart > 900) cible *= 0.95; else if (ecart < -900) cible *= 1.05;
      }
      if (c.boost > 0) cible *= TURBO;
      if (c.elan > 0) cible *= ELAN;
      if (c.saut > 0) cible *= 1.08;
      if (c.etourdi > 0) cible *= 0.55;
      if (c.fini) cible *= 0.55;
      if (!m.enCourse) cible = 0;
      const k = c.v < cible ? 1.4 : 2.2;
      c.v += (cible - c.v) * Math.min(1, dt * k);
      c.boost = Math.max(0, c.boost - dt);
      c.elan = Math.max(0, c.elan - dt);
      c.etourdi = Math.max(0, c.etourdi - dt);
      if (c.etourdi > 0) c.tour += dt * 14;
      else c.tour *= 0.85;
      const enLAir = c.saut > 0;
      if (enLAir) {
        c.saut -= dt;
        if (c.saut <= 0) { c.saut = 0; if (c.joueur) { Son.atterrir(); eclabousser(m, c, 10); } }
      }
      // Déplacement sur le côté (le joueur vise tx avec le doigt ou les flèches).
      let force = 0;
      if (!enLAir) force += -penteA(p, c.d) * c.v * 0.9;
      let vx = c.etourdi > 0 ? 0 : clamp((c.tx - c.x) * GAIN_LAT, -LAT_MAX, LAT_MAX);
      // Éléments du toboggan.
      for (const o of p.objets) {
        const dd = o.d - c.d;
        if (dd > 140) break;
        if (o.type === 'jet') {
          if (c.d >= o.d && c.d <= o.d + o.long && !enLAir && etatJet(o, m.temps) === 'actif') {
            force += -o.cote * 330;
            if (c.joueur && !c.touches.has(o.id)) { c.touches.add(o.id); Son.jet(); }
          }
          continue;
        }
        if (dd < -140) continue;
        const ox = o.type === 'ballon' ? xBallon(o, m.temps) : o.x;
        const dx = c.x - ox;
        if (o.type === 'bulle') {
          if (Math.hypot(dx, dd) < 26 + R && !c.touches.has(o.id)) {
            c.touches.add(o.id); c.boost = 1.5;
            if (c.joueur) { Son.turbo(); o.eclat = m.temps; etincelles(m, c, '#ffffff', 14); }
          }
        } else if (o.type === 'coq') {
          if (c.joueur && !o.pris && Math.hypot(dx, dd) < 14 + R && (!!o.haut === enLAir)) {
            o.pris = true; m.coquillages++; Son.coq(); etincelles(m, c, '#ffd23f', 8); majCoq(true);
          }
        } else if (o.type === 'fleche') {
          if (!enLAir && Math.abs(dx) < 40 && Math.abs(dd) < 34 && !c.touches.has(o.id)) {
            c.touches.add(o.id); c.elan = 1.0;
            if (c.joueur) Son.elan();
          }
        } else if (o.type === 'tremplin') {
          if (!enLAir && Math.abs(dx) < 62 && Math.abs(dd) < 26 && !c.touches.has(o.id)) {
            c.touches.add(o.id); c.saut = 0.95; c.elan = Math.max(c.elan, 0.6);
            if (c.joueur) Son.saut();
          }
        } else if (o.type === 'tourbillon') {
          const dist = Math.hypot(dx, dd);
          if (!enLAir && dist < o.r) {
            force += -Math.sign(dx || 1) * 240 * (0.45 + (1 - dist / o.r));
            c.v *= 1 - 1.1 * dt;
            if (c.joueur && !c.touches.has(o.id)) { c.touches.add(o.id); Son.tourbillon(); }
          }
        } else if (o.type === 'canard' || o.type === 'ballon') {
          const rayon = (o.type === 'canard' ? 24 : 26) + R - 6;
          if (!enLAir && c.etourdi <= 0 && Math.hypot(dx, dd) < rayon && !c.touches.has(o.id)) {
            c.touches.add(o.id);
            c.v *= o.type === 'canard' ? 0.45 : 0.6;
            c.etourdi = o.type === 'canard' ? 0.9 : 0.6;
            c.x += Math.sign(dx || 1) * 18;
            o.choc = m.temps;
            if (c.joueur) {
              m.secousse = 0.35;
              if (o.type === 'canard') Son.canard(); else Son.ballon();
              eclabousser(m, c, 12);
            }
          }
        }
      }
      c.vx = vx + force;
      c.x += c.vx * dt;
      // Bords du toboggan : on freine en frottant.
      const lim = hwA(p, c.d) - R;
      if (Math.abs(c.x) > lim) {
        c.x = Math.sign(c.x) * lim;
        if (!enLAir) {
          c.v *= 1 - 1.6 * dt;
          c.mur += dt;
          if (c.joueur && c.mur > 0.05 && c.mur - dt <= 0.05) { Son.mur(); eclabousser(m, c, 8); }
        }
      } else c.mur = 0;
      c.d += c.v * dt;
      // Écume derrière la bouée.
      if (!enLAir && c.v > 150 && Math.random() < dt * 30) m.ecume.push({ d: c.d - 18, x: c.x + (Math.random() - 0.5) * 22, vie: 0.6 });
      // Arrivée.
      if (!c.fini && c.d >= p.L && m.enCourse) {
        c.fini = true; c.rang = ++m.arrives; c.temps = m.temps;
        if (c.joueur) arriveeJoueur(m);
      }
    }
    // Les bouées se poussent gentiment quand elles se touchent.
    const cs = m.coureurs;
    for (let a = 0; a < cs.length; a++) for (let b = a + 1; b < cs.length; b++) {
      const A = cs[a], B = cs[b];
      if (A.saut > 0 || B.saut > 0) continue;
      const dd = A.d - B.d, dx = A.x - B.x;
      const dist = Math.hypot(dd, dx);
      if (dist < R * 2 && dist > 0.01) {
        const pousse = (R * 2 - dist) / 2;
        const s = Math.sign(dx || (a - b));
        A.x += s * pousse; B.x -= s * pousse;
      }
    }
    // Caméra.
    const s = m.suivi;
    m.camD = s.d;
    m.camX = lerp(m.camX, cxA(p, s.d + 160), Math.min(1, dt * 4));
    m.secousse = Math.max(0, m.secousse - dt);
    // Particules.
    for (const q of m.particules) { q.vie -= dt; q.d += q.vd * dt; q.x += q.vx * dt; q.vx *= 0.96; q.vd *= 0.96; }
    m.particules = m.particules.filter((q) => q.vie > 0);
    for (const q of m.ecume) q.vie -= dt;
    m.ecume = m.ecume.filter((q) => q.vie > 0);
    if (m.ecume.length > 260) m.ecume.splice(0, m.ecume.length - 260);
  }
  function eclabousser(m, c, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 160;
      m.particules.push({ d: c.d, x: c.x, vd: Math.sin(a) * v + c.v * 0.6, vx: Math.cos(a) * v, vie: 0.5 + Math.random() * 0.3, max: 0.8, coul: Math.random() < 0.5 ? '#ffffff' : '#bdefff', forme: 'goutte' });
    }
  }
  function etincelles(m, c, coul, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 140;
      m.particules.push({ d: c.d, x: c.x, vd: Math.sin(a) * v + c.v * 0.8, vx: Math.cos(a) * v, vie: 0.7, max: 0.7, coul, forme: 'etoile' });
    }
  }

  // ---------------------------------------------------------------------
  // Dessin.
  // ---------------------------------------------------------------------
  const can = document.getElementById('jeu');
  const ctx = can.getContext('2d');
  let W = 0, H = 0, DPR = 1, K = 1, Y0 = 0;
  function redimensionner() {
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    can.width = Math.round(W * DPR); can.height = Math.round(H * DPR);
    K = clamp(Math.min(W / 430, H / 680), 0.6, 1.45);
    Y0 = H * 0.7;
  }
  window.addEventListener('resize', redimensionner);
  redimensionner();

  // Passage du monde à l'écran.
  let sx0 = 0, sy0 = 0;
  const ex = (m, d, x) => W / 2 + (cxA(m.piste, d) + x - m.camX) * K + sx0;
  const ey = (m, d) => Y0 - (d - m.camD) * K + sy0;

  function etoile(c, x, y, r1, r2, branches) {
    c.beginPath();
    for (let i = 0; i < branches * 2; i++) {
      const r = i % 2 ? r2 : r1, a = -Math.PI / 2 + i * Math.PI / branches;
      c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
    c.closePath();
  }

  function dessinerDecor(m, dMin, dMax) {
    // Sol du parc : dalles claires, pelouse, palmiers et parasols.
    ctx.fillStyle = '#8fdcc0';
    ctx.fillRect(0, 0, W, H);
    const tranche = 360;
    for (let b = Math.floor(dMin / tranche) - 1; b <= Math.ceil(dMax / tranche) + 1; b++) {
      for (let s = -1; s <= 1; s += 2) {
        for (let q = 0; q < 2; q++) {
          const h = bruitHash(b * 2 + q, s + 5);
          const d = b * tranche + q * tranche / 2 + h * 80;
          const off = (HW + 70 + bruitHash(b, q * 3 + s) * 170) * s;
          const x = ex(m, d, off), y = ey(m, d);
          if (y < -80 || y > H + 80 || x < -80 || x > W + 80) continue;
          const genre = Math.floor(bruitHash(b + 17, q + s * 2) * 4);
          if (genre === 0) dessinerPalmier(ctx, x, y, 34 * K, b + q);
          else if (genre === 1) dessinerParasol(ctx, x, y, 28 * K, b + q * 3);
          else if (genre === 2) {
            ctx.fillStyle = '#6fd3f7';
            ctx.beginPath(); ctx.ellipse(x, y, 46 * K, 30 * K, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 5 * K; ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2 * K;
            ctx.beginPath(); ctx.arc(x - 10 * K, y - 6 * K, 10 * K, 0.2, 1.4); ctx.stroke();
          } else {
            ctx.fillStyle = '#f6e3b4';
            ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - 34 * K, y - 22 * K, 68 * K, 44 * K, 10 * K) : ctx.rect(x - 34 * K, y - 22 * K, 68 * K, 44 * K); ctx.fill();
            ctx.fillStyle = ['#ff6b6b', '#4ecdc4', '#ffd23f', '#a98bff'][b & 3];
            ctx.fillRect(x - 24 * K, y - 12 * K, 48 * K, 24 * K);
          }
        }
      }
    }
  }
  function dessinerPalmier(c, x, y, r, graine) {
    c.fillStyle = 'rgba(0,0,0,.12)';
    c.beginPath(); c.ellipse(x + r * 0.3, y + r * 0.3, r, r * 0.8, 0, 0, Math.PI * 2); c.fill();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 + graine;
      c.fillStyle = i % 2 ? '#2f9e44' : '#40c057';
      c.beginPath();
      c.ellipse(x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.55, r * 0.6, r * 0.22, a, 0, Math.PI * 2);
      c.fill();
    }
    c.fillStyle = '#8d5524'; c.beginPath(); c.arc(x, y, r * 0.18, 0, Math.PI * 2); c.fill();
  }
  function dessinerParasol(c, x, y, r, graine) {
    const couls = [['#ff6b6b', '#fff'], ['#ffd23f', '#ff8c42'], ['#4ecdc4', '#fff'], ['#a98bff', '#ffe066']][graine & 3];
    c.fillStyle = 'rgba(0,0,0,.12)';
    c.beginPath(); c.arc(x + r * 0.25, y + r * 0.25, r, 0, Math.PI * 2); c.fill();
    for (let i = 0; i < 8; i++) {
      c.fillStyle = couls[i % 2];
      c.beginPath(); c.moveTo(x, y); c.arc(x, y, r, i * Math.PI / 4, (i + 1) * Math.PI / 4); c.closePath(); c.fill();
    }
    c.fillStyle = '#fff'; c.beginPath(); c.arc(x, y, r * 0.12, 0, Math.PI * 2); c.fill();
  }

  function cheminBord(m, dMin, dMax, decal) {
    // Contour du toboggan (côté gauche puis côté droit).
    const p = m.piste;
    ctx.beginPath();
    for (let d = dMin; d <= dMax; d += PAS) ctx.lineTo(ex(m, d, -hwA(p, d) - decal), ey(m, d));
    for (let d = dMax; d >= dMin; d -= PAS) ctx.lineTo(ex(m, d, hwA(p, d) + decal), ey(m, d));
    ctx.closePath();
  }
  function ligneBord(m, dMin, dMax, cote, decal) {
    const p = m.piste;
    ctx.beginPath();
    for (let d = dMin; d <= dMax; d += PAS) ctx.lineTo(ex(m, d, cote * (hwA(p, d) + decal)), ey(m, d));
  }

  function dessinerPiste(m, dMin, dMax) {
    const p = m.piste, lig = LIGUES[m.niv.ligue];
    dMin = Math.floor(dMin / PAS) * PAS; dMax = Math.ceil(dMax / PAS) * PAS;
    // Ombre, rebord, eau.

  function dessinerCoureur(m, c) {

    if (Y < -60 || Y > H + 60) return;
    const saut = c.saut > 0 ? Math.sin((1 - c.saut / 0.95) * Math.PI) : 0;
    // Ombre (s'éloigne pendant un saut).
    ctx.fillStyle = 'rgba(0,40,80,.25)';
    ctx.beginPath(); ctx.ellipse(X + (4 + saut * 16) * K, Y + (6 + saut * 22) * K, R * K * (1 - saut * 0.2), R * 0.8 * K * (1 - saut * 0.2), 0, 0, Math.PI * 2); ctx.fill();
    // Traînée de turbo.
    if (c.boost > 0 || c.elan > 0) {
      ctx.strokeStyle = c.boost > 0 ? 'rgba(255,255,255,.75)' : 'rgba(255,220,80,.75)';
      ctx.lineWidth = 3 * K; ctx.lineCap = 'round';
      for (let i = -1; i <= 1; i++) {
        const l = (30 + 20 * Math.random()) * K;
        ctx.beginPath(); ctx.moveTo(X + i * 12 * K, Y + 26 * K); ctx.lineTo(X + i * 12 * K, Y + 26 * K + l); ctx.stroke();
      }
    }
    const echelle = K * (1 + saut * 0.45);
    if (c.joueur) {
      // Halo et flèche au-dessus du joueur.
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3 * K;
      ctx.beginPath(); ctx.arc(X, Y - saut * 20 * K, (R + 6) * echelle, 0, Math.PI * 2); ctx.stroke();
      const fy = Y - saut * 20 * K - (R + 16 + Math.sin(m.temps * 6) * 3) * echelle;
      ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#10233f'; ctx.lineWidth = 2.5 * K;
      ctx.beginPath(); ctx.moveTo(X - 9 * K, fy - 10 * K); ctx.lineTo(X + 9 * K, fy - 10 * K); ctx.lineTo(X, fy); ctx.closePath(); ctx.fill(); ctx.stroke();

    dessinerBouee(ctx, X, Y - saut * 20 * K, echelle, c.animal, c.bouee, c.tour + Math.sin(m.temps * 3 + c.num) * 0.08, m.temps);
  }

  function dessinerParticules(m) {
    for (const q of m.ecume) {
      const X = ex(m, q.d, q.x), Y = ey(m, q.d);
      ctx.fillStyle = `rgba(255,255,255,${q.vie})`;
      ctx.beginPath(); ctx.arc(X, Y, (3 + (0.6 - q.vie) * 8) * K, 0, Math.PI * 2); ctx.fill();
    }
    for (const q of m.particules) {
      const X = ex(m, q.d, q.x), Y = ey(m, q.d);
      ctx.globalAlpha = clamp(q.vie / q.max, 0, 1);
      ctx.fillStyle = q.coul;
      if (q.forme === 'etoile') { etoile(ctx, X, Y, 6 * K, 2.6 * K, 5); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(X, Y, 3.5 * K, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
  }

  function dessinerMonde(m) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // Derrière les menus, la tête de course est plus haut : la troupe reste visible au-dessus des cartes.
    Y0 = m.demo ? H * 0.36 : H * 0.7;
    sx0 =m.secousse > 0 ? (Math.random() - 0.5) * 12 * m.secousse * K : 0;
    sy0 = m.secousse > 0 ? (Math.random() - 0.5) * 12 * m.secousse * K : 0;
    const dMax = m.camD + (Y0 + 80) / K, dMin = m.camD - (H - Y0 + 80) / K;
    dessinerDecor(m, dMin, dMax);
    dessinerPiste(m, dMin, dMax);
    const objs = m.piste.objets;
    // Éléments au ras de l'eau, puis bouées, puis obstacles hauts.
    for (const o of objs) {
      if (o.d < dMin - 300) continue;
      if (o.d > dMax + 100) break;
      if (o.type === 'fleche' || o.type === 'tourbillon' || o.type === 'jet' || o.type === 'tremplin') dessinerObjet(m, o);
    }
    for (const o of objs) {
      if (o.d < dMin - 100) continue;
      if (o.d > dMax + 100) break;
      if (o.type === 'bulle' || (o.type === 'coq' && !o.haut) || o.type === 'canard' || o.type === 'ballon') dessinerObjet(m, o);
    }
    dessinerParticules(m);
    const tries = m.coureurs.slice().sort((a, b) => (a.saut > 0) - (b.saut > 0) || b.d - a.d);
    for (const c of tries) dessinerCoureur(m, c);
    for (const o of objs) {
      if (o.d < dMin - 100) continue;
      if (o.d > dMax + 100) break;
      if (o.type === 'coq' && o.haut) dessinerObjet(m, o);
    }
    dessinerTunnels(m, dMin, dMax);
    // Obscurité du tunnel autour du joueur suivi.
    const s = m.suivi, nuit = dansTunnel(m.piste, s.d);
    if (nuit > 0) {
      const X = ex(m, s.d, s.x), Y = ey(m, s.d) - 60 * K;
      const g = ctx.createRadialGradient(X, Y, 70 * K, X, Y, 230 * K);
      g.addColorStop(0, 'rgba(8,10,35,0)');
      g.addColorStop(1, `rgba(8,10,35,${0.93 * nuit})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // Petites lumières au plafond.
      ctx.fillStyle = `rgba(255,230,120,${0.7 * nuit})`;
      for (let b = Math.floor(dMin / 160); b < dMax / 160; b++) {
        const d = b * 160;
        if (dansTunnel(m.piste, d) < 0.5) continue;
        for (const sd of [-1, 1]) { ctx.beginPath(); ctx.arc(ex(m, d, sd * (hwA(m.piste, d) + 14)), ey(m, d), 4 * K, 0, Math.PI * 2); ctx.fill(); }
      }
    }
    // Confettis (repère de l'écran).
    for (const q of m.confettis) {
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.a);
      ctx.fillStyle = q.coul; ctx.fillRect(-5, -3, 10, 6);
      ctx.restore();
    }
  }

  // Animation de la carte : mini toboggan avec l'élément présenté.
  const demoCan = $('demo'), demoCtx = demoCan.getContext('2d');
  const animalDemo = () => ANIMAUX.find((a) => a.cle === sauve.animal) || ANIMAUX[0];
  function dessinerDemo(dt) {
    if (!demoType) return;
    demoPas += dt;
    const c = demoCtx, w = demoCan.width, h = demoCan.height, k = 1.6;
    const tm = demoPas;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = '#8fdcc0'; c.fillRect(0, 0, w, h);
    const lig = LIGUES[NIVEAUX[iCourant].ligue];
    // Toboggan vertical (ou courbe pour le virage).
    const courbe = demoType === 'virage' ? 1 : 0;
    const etroit = demoType === 'etroit';
    const centre = (y) => w / 2 + courbe * Math.sin((y / h) * Math.PI) * -90 + courbe * 40;
    const demi = (y) => (etroit ? lerp(170, 110, clamp((h * 0.75 - y) / 120, 0, 1)) : 170);
    for (const [dec, coul] of [[22, lig.bordFonce], [14, lig.bord], [0, lig.eauFonce], [-20, lig.eau]]) {
      c.fillStyle = coul; c.beginPath();
      for (let y = 0; y <= h; y += 10) c.lineTo(centre(y) - demi(y) - dec, y);
      for (let y = h; y >= 0; y -= 10) c.lineTo(centre(y) + demi(y) + dec, y);
      c.fill();
    }
    c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 4; c.lineCap = 'round';
    for (let i = 0; i < 6; i++) {

      c.beginPath(); c.moveTo(x - 12, y); c.quadraticCurveTo(x, y - 6, x + 12, y); c.stroke();
    }
    const cycle = 3;
    const f = (tm % cycle) / cycle;
    const yJ = h * 0.78;
    let xJ = w / 2, angle = 0, sautJ = 0;
    const fausseM = { piste: { hw: [HW], cx: [0], tunnels: [] } };
    const anim = animalDemo();
    if (demoType === 'glisser') {
      xJ = w / 2 + Math.sin(tm * 2) * 130;
      dessinerBouee(c, xJ, yJ, k * 1.5, anim, sauve.bouee, 0, tm);
      dessinerMain(c, xJ, yJ + 70, tm);
      c.strokeStyle = '#fff'; c.lineWidth = 5;
      for (const s of [-1, 1]) { c.beginPath(); c.moveTo(xJ + s * 60, yJ + 70); c.lineTo(xJ + s * 85, yJ + 70); c.lineTo(xJ + s * 75, yJ + 60); c.moveTo(xJ + s * 85, yJ + 70); c.lineTo(xJ + s * 75, yJ + 80); c.stroke(); }
      return;
    }
    if (demoType === 'arrivee') {

      const autres = ANIMAUX.filter((a) => a !== anim);
      dessinerBouee(c, w / 2 - 100, yJ + 40, k * 1.2, autres[0], 0, 0, tm);
      dessinerBouee(c, w / 2 + 110, yJ + 55, k * 1.2, autres[1], 0, 0, tm);
      dessinerBouee(c, w / 2, yJ - 20, k * 1.5, anim, sauve.bouee, 0, tm);
      if (yl > yJ - 20) { for (let i = 0; i < 3; i++) { c.fillStyle = '#ffd23f'; etoile(c, w / 2 - 50 + i * 50, 60 - (i === 1 ? 20 : 0), 26, 11, 5); c.fill(); c.strokeStyle = '#c98400'; c.lineWidth = 3; c.stroke(); } }
      return;
    }
    // Élément qui descend vers la bouée ; la bouée réagit.
    const yO = lerp(-60, h + 80, f);
    let xO = w / 2;
    const o = { id: 1, r: 70, amp: 120, w: 1.6, phase: 0 };
    if (demoType === 'bulle' || demoType === 'fleche' || demoType === 'tremplin') {
      xO = w / 2 + 60;
      xJ = lerp(w / 2 - 80, xO, clamp(f * 2.2, 0, 1));
      if (yO > yJ - 20 && demoType === 'bulle') { o.eclat = tm - (yO - yJ + 20) / 260; }
      if (demoType === 'tremplin' && yO > yJ) sautJ = Math.sin(clamp((yO - yJ) / 260, 0, 1) * Math.PI);
    } else if (demoType === 'canard' || demoType === 'tourbillon') {

    } else if (demoType === 'jet') {

    } else if (demoType === 'etroit') {

    if (demoType === 'jet') {
      const etat = f > 0.3 && f < 0.4 ? 'alerte' : f >= 0.4 && f < 0.75 ? 'actif' : 'repos';
      const by = yJ - 10;
      c.fillStyle = etat === 'alerte' && Math.floor(tm * 10) % 2 ? '#ff3b3b' : '#6c7a89';
      c.beginPath(); c.arc(w / 2 - 190, by, 18, 0, Math.PI * 2); c.fill();

        c.beginPath(); c.moveTo(w / 2 - 175, by - 40); c.lineTo(w / 2 + 160, by - 60); c.lineTo(w / 2 + 160, by + 60); c.lineTo(w / 2 - 175, by + 40); c.fill();
        c.fillStyle = '#fff';
        for (let i = 0; i < 10; i++) { const g = (tm * 2 + i / 10) % 1; c.beginPath(); c.arc(lerp(w / 2 - 170, w / 2 + 160, g), by + Math.sin(i * 5) * 30, 6, 0, Math.PI * 2); c.fill(); }
      }

    if (demoType === 'tunnel') {
      const yl = lerp(-30, h * 0.9, Math.min(1, f * 1.6));
      c.fillStyle = 'rgba(30,20,70,.45)'; c.fillRect(0, yl, w, h - yl);
      c.fillStyle = '#5b3f8c'; c.fillRect(w / 2 - 200, yl - 10, 400, 18);

    }
    dessinerBouee(c, xJ, yJ - sautJ * 40, k * (1.5 + sautJ * 0.5), anim, sauve.bouee, demoType === 'canard' && f > 0.5 && f < 0.55 ? tm * 10 : 0, tm);
    if (demoType === 'tunnel') {
      const nuit = clamp(f * 2 - 0.3, 0, 1);
      const g = c.createRadialGradient(xJ, yJ - 60, 70, xJ, yJ - 60, 220);
      g.addColorStop(0, 'rgba(8,10,35,0)'); g.addColorStop(1, `rgba(8,10,35,${0.93 * nuit})`);
      c.fillStyle = g; c.fillRect(0, 0, w, h);
    }
    // Flèche qui montre où aller.
    if (demoType === 'canard' || demoType === 'tourbillon' || demoType === 'ballon' || demoType === 'virage') {
      const dir = demoType === 'virage' ? 1 : -1;
      c.fillStyle = 'rgba(255,255,255,.9)'; c.strokeStyle = '#10233f'; c.lineWidth = 3;
      const ax = xJ + dir * 70, ay = yJ + 60;
      c.beginPath(); c.moveTo(ax - dir * 30, ay - 10); c.lineTo(ax, ay - 10); c.lineTo(ax, ay - 22); c.lineTo(ax + dir * 24, ay); c.lineTo(ax, ay + 22); c.lineTo(ax, ay + 10); c.lineTo(ax - dir * 30, ay + 10); c.closePath(); c.fill(); c.stroke();
    }
  }
  function dessinerMain(c, x, y, tm) {
    c.save(); c.translate(x, y); c.rotate(-0.2 + Math.sin(tm * 4) * 0.05);
    c.fillStyle = '#ffe0bd'; c.strokeStyle = '#7a4b2a'; c.lineWidth = 3;
    c.beginPath(); c.roundRect ? c.roundRect(-8, -50, 16, 50, 8) : c.rect(-8, -50, 16, 50); c.fill(); c.stroke();
    c.beginPath(); c.roundRect ? c.roundRect(-22, -12, 44, 40, 14) : c.rect(-22, -12, 44, 40); c.fill(); c.stroke();
    c.restore();
  }

  // --- Lancement d'une course ---
  function preparerCourse(i) {
    iCourant = i;
    const niv = NIVEAUX[i];
    monde = creerMonde(i, true);
    etat = 'menu';
    montrer(null);
    const suite = () => lancerDecompte();
    if (niv.nouv === 'tuto' && !sauve.vus.tuto) { sauve.vus.tuto = true; enregistrer(); presenter(TUTO, suite); }
    else if (niv.nouv && niv.nouv !== 'tuto' && !sauve.vus[niv.nouv]) { sauve.vus[niv.nouv] = true; enregistrer(); presenter([niv.nouv], suite); }
    else suite();
  }
  function texteObjectif(niv) {
    return t('objectif.top', { n: niv.qualif });
  }
  function lancerDecompte() {
    montrer(null);
    $('hud').hidden = false;
    construireBarre();
    majCoq(false); majPlace(true);
    $('objectif').textContent = (NIVEAUX[iCourant].finale ? t('objectif.finale') + ' ' : '') + texteObjectif(NIVEAUX[iCourant]);
    $('objectif').hidden = false;
    etat = 'decompte'; decompte = 3.99;
    afficherDecompte(3);
    Son.bip();
    joueurPointeur.actif = false;
    clavier.gauche = clavier.droite = false;
  }
  let dernierChiffre = 3;
  function afficherDecompte(n) {
    const el = $('decompte');
    el.hidden = false;
    el.textContent = n > 0 ? nb(n) : t('course.partez');
    el.classList.remove('anim'); void el.offsetWidth; el.classList.add('anim');
    dernierChiffre = n;
  }

  // --- Interface de course ---
  function construireBarre() {
    const barre = $('barre');
    barre.querySelectorAll('.pion').forEach((p) => p.remove());
    monde.coureurs.forEach((c) => {
      const p = document.createElement('div');
      p.className = 'pion' + (c.joueur ? ' moi' : '');
      p.style.background = c.animal.anneau;
      c.pion = p;
      barre.appendChild(p);
    });
  }
  let placeAffichee = 0;
  function rangDe(m, c) {
    if (c.fini) return c.rang;
    let r = 1;
    for (const o of m.coureurs) if (o !== c && (o.fini || o.d > c.d)) r++;
    return r;
  }
  function majPlace(forcer) {
    const j = monde.joueur;
    if (!j) return;
    const r = rangDe(monde, j);
    if (r !== placeAffichee || forcer) {
      const el = $('hud-place');
      el.textContent = t('hud.place', { place: nb(r), total: nb(monde.coureurs.length) });
      el.classList.toggle('qualifie', r <= NIVEAUX[iCourant].qualif);
      if (!forcer && r < placeAffichee) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); Son.depasse(); }
      placeAffichee = r;
    }
  }
  function majCoq(anime) {
    $('coq-nombre').textContent = nb(monde.coquillages || 0);
    if (anime) { const el = $('hud-coq'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  }
  function majBarre() {
    for (const c of monde.coureurs) if (c.pion) c.pion.style.left = (clamp(c.d / monde.piste.L, 0, 1) * 100).toFixed(2) + '%';
  }

  // --- Arrivée et résultats ---
  function arriveeJoueur(m) {
    etat = 'arrivee'; attenteArrivee = 1.8;
    const niv = NIVEAUX[iCourant];
    const qualifie = m.joueur.rang <= niv.qualif;
    if (qualifie) {
      Son.victoire();
      const couls = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93', '#ffffff'];
      for (let i = 0; i < 120; i++) m.confettis.push({ x: Math.random() * W, y: -Math.random() * H * 0.6, vy: 120 + Math.random() * 200, vx: (Math.random() - 0.5) * 80, a: Math.random() * 6, va: (Math.random() - 0.5) * 10, coul: couls[i % couls.length] });
    } else Son.defaite();
    $('objectif').hidden = true;
  }
  function afficherFin() {
    etat = 'fin';
    Son.eauArreter();
    const niv = NIVEAUX[iCourant], j = monde.joueur;
    const place = j.rang, qualifie = place <= niv.qualif;
    const etoiles = qualifie ? Math.max(1, 4 - place) : 0;
    const score = monde.coquillages * 10 + (place === 1 ? 300 : place === 2 ? 200 : place === 3 ? 100 : 0);
    const ancienRecord = sauve.records[iCourant] || 0;
    const record = score > ancienRecord;
    const avantLigues = liguesGagnees();
    if (record) sauve.records[iCourant] = score;
    if (etoiles > etoilesDe(iCourant)) sauve.etoiles[iCourant] = etoiles;
    enregistrer();
    const montee = qualifie && niv.finale && liguesGagnees() > avantLigues;

    $('fin-titre').textContent = qualifie ? (place === 1 ? t('fin.victoire') : t('fin.qualifie')) : t('fin.perdu');
    const zoneEt = $('fin-etoiles'); zoneEt.textContent = '';
    for (let s = 0; s < 3; s++) {
      zoneEt.insertAdjacentHTML('beforeend', SVG_ETOILE);
      const el = zoneEt.lastElementChild;
      if (s < etoiles) setTimeout(() => { el.classList.add('gagnee'); Son.etoile(s); }, 350 + s * 320);
    }
    zoneEt.setAttribute('aria-label', t('niveaux.etoiles', { n: etoiles }));
    $('fin-place').textContent = t('fin.place', { place: t('place.' + place) });
    $('fin-besoin').textContent = qualifie ? '' : t('fin.besoin', { n: niv.qualif });
    $('fin-besoin').hidden = qualifie;
    $('fin-coq').textContent = t('fin.coquillages', { n: nb(monde.coquillages) });
    // Score qui défile.
    const elScore = $('fin-score');
    let affiche = 0;
    const pas = Math.max(1, Math.round(score / 30));
    const tic = () => { affiche = Math.min(score, affiche + pas); elScore.textContent = t('fin.score', { n: nb(affiche) }); if (affiche < score && etat === 'fin') setTimeout(tic, 30); };
    tic();
    const elRec = $('fin-record');
    elRec.textContent = record ? t('fin.record') : t('fin.meilleur', { n: nb(Math.max(ancienRecord, score)) });
    elRec.classList.toggle('battu', record);
    const ban = $('fin-banniere');
    if (montee && iCourant < NIVEAUX.length - 1) {
      const nouvelle = liguesGagnees();
      ban.textContent = t('fin.montee', { ligue: t('ligue.' + LIGUES[niv.ligue + 1].cle) }) + ' ' + t('fin.bouee', { nom: t('bouee.' + BOUEES[nouvelle]) });
      ban.hidden = false;
      setTimeout(() => Son.montee(), 1400);
    } else if (montee) {
      ban.textContent = t('fin.bouee', { nom: t('bouee.' + BOUEES[Math.min(BOUEES.length - 1, liguesGagnees())]) });
      ban.hidden = false;
    } else ban.hidden = true;
    $('fin-astuce').textContent = qualifie ? '' : t('astuce.' + (1 + Math.floor(Math.random() * 6)));
    $('fin-astuce').hidden = qualifie;
    const principal = $('btn-fin-principal');
    if (qualifie && iCourant === NIVEAUX.length - 1) { principal.textContent = t('btn.bilan'); principal.onclick = () => { Son.clic(); ouvrirBilan(); }; }
    else if (qualifie) { principal.textContent = t('btn.suivant'); principal.onclick = () => { Son.clic(); preparerCourse(iCourant + 1); }; }
    else { principal.textContent = t('btn.reessayer'); principal.onclick = () => { Son.clic(); preparerCourse(iCourant); }; }
    $('btn-fin-rejouer').hidden = !qualifie;
    $('hud').hidden = true;
    montrer('ecran-fin');
  }
  $('btn-fin-rejouer').addEventListener('click', () => { Son.clic(); preparerCourse(iCourant); });
  $('btn-fin-niveaux').addEventListener('click', () => { Son.clic(); ouvrirNiveaux(); });
  function ouvrirBilan() {
    let total = 0;
    for (let i = 0; i < NIVEAUX.length; i++) total += etoilesDe(i);
    $('bilan-etoiles').textContent = t('bilan.etoiles', { n: nb(total), total: nb(NIVEAUX.length * 3) });
    Son.montee();
    montrer('ecran-bilan');
  }
  $('btn-bilan-niveaux').addEventListener('click', () => { Son.clic(); ouvrirNiveaux(); });
  $('btn-bilan-accueil').addEventListener('click', () => { Son.clic(); allerAccueil(); });

  // --- Pause ---
  function pause() {
    if (etat !== 'course' && etat !== 'decompte' && etat !== 'arrivee') return;
    etatAvantPause = etat; etat = 'pause';
    if (Son.ctx && Son.ctx.state === 'running') Son.ctx.suspend().catch(() => {});
    $('pause-objectif').textContent = texteObjectif(NIVEAUX[iCourant]);
    montrer('ecran-pause');
  }
  function reprendre() {
    if (etat !== 'pause') return;
    etat = etatAvantPause;
    if (Son.ctx) Son.ctx.resume().catch(() => {});
    montrer(null);
    joueurPointeur.actif = false;
  }
  $('btn-pause').addEventListener('click', () => { Son.demarrer(); pause(); });
  $('btn-reprendre').addEventListener('click', () => { reprendre(); Son.clic(); });
  $('btn-recommencer').addEventListener('click', () => { if (Son.ctx) Son.ctx.resume().catch(() => {}); Son.eauArreter(); preparerCourse(iCourant); });
  $('btn-pause-accueil').addEventListener('click', () => { if (Son.ctx) Son.ctx.resume().catch(() => {}); allerAccueil(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  // --- Commandes : doigt, souris, clavier ---
  const joueurPointeur = { actif: false, x: 0 };
  const clavier = { gauche: false, droite: false };
  function viserPointeur(xEcran) {
    const m = monde, j = m.joueur;
    if (!j) return;
    const centre = ex(m, j.d, 0);
    const lim = hwA(m.piste, j.d) - R;
    j.tx = clamp((xEcran - centre) / K, -lim, lim);
  }
  can.addEventListener('pointerdown', (e) => {
    Son.demarrer();
    if (etat !== 'course' && etat !== 'decompte') return;
    joueurPointeur.actif = true; joueurPointeur.x = e.clientX;
    try { can.setPointerCapture(e.pointerId); } catch (err) { /* rien */ }
  });
  can.addEventListener('pointermove', (e) => {
    if (joueurPointeur.actif || e.pointerType === 'mouse') { joueurPointeur.x = e.clientX; if (e.pointerType === 'mouse') joueurPointeur.souris = true; }
  });
  const relacher = () => { joueurPointeur.actif = false; };
  can.addEventListener('pointerup', relacher);
  can.addEventListener('pointercancel', relacher);
  window.addEventListener('keydown', (e) => {
    Son.demarrer();
    const code = e.code;
    if (code === 'Escape' || code === 'KeyP') {
      if (etat === 'pause') reprendre(); else pause();
      e.preventDefault(); return;
    }
    if (code === 'ArrowLeft' || code === 'KeyA') { clavier.gauche = true; joueurPointeur.souris = false; if (etat === 'course' || etat === 'decompte') e.preventDefault(); }
    if (code === 'ArrowRight' || code === 'KeyD') { clavier.droite = true; joueurPointeur.souris = false; if (etat === 'course' || etat === 'decompte') e.preventDefault(); }
    if ((code === 'Space' || code === 'ArrowUp' || code === 'ArrowDown') && (etat === 'course' || etat === 'decompte')) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') clavier.gauche = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') clavier.droite = false;
  });
  window.addEventListener('blur', () => { clavier.gauche = clavier.droite = false; });

  // ---------------------------------------------------------------------
  // Boucle principale.
  // ---------------------------------------------------------------------
  let avant = performance.now();
  function boucle(maintenant) {
    const dt = Math.min(0.05, Math.max(0, (maintenant - avant) / 1000));
    avant = maintenant;
    const m = monde;
    if (etat === 'menu') {
      // Course de démonstration : on suit le premier, on recommence à la fin.
      majMonde(m, dt);
      let tete = m.coureurs[0];
      for (const c of m.coureurs) if (c.d > tete.d) tete = c;
      m.suivi = tete;
      if (tete.d > m.piste.L + 600) monde = creerMonde(Math.floor(Math.random() * 5) * 4 + Math.floor(Math.random() * 3), false);
    } else if (etat === 'decompte') {
      decompte -= dt;
      const n = Math.ceil(decompte);
      if (n !== dernierChiffre) {
        if (n > 0) { afficherDecompte(n); Son.bip(); }
        else { afficherDecompte(0); Son.depart(); Son.eauDemarrer(); etat = 'course'; m.enCourse = true; m.temps = 0; setTimeout(() => { if (etat === 'course' || etat === 'arrivee') $('decompte').hidden = true; }, 700); setTimeout(() => { $('objectif').hidden = true; }, 1600); }
      }
      commandes(m, dt);
      majMonde(m, dt);
    } else if (etat === 'course' || etat === 'arrivee') {
      commandes(m, dt);
      majMonde(m, dt);
      majPlace(false); majBarre();
      if (etat === 'arrivee') {
        attenteArrivee -= dt;
        if (attenteArrivee <= 0) afficherFin();
      }
    } else if (etat === 'fin') {
      majMonde(m, dt);
    }
    // Confettis.
    for (const q of m.confettis) { q.y += q.vy * dt; q.x += q.vx * dt; q.a += q.va * dt; }
    m.confettis = m.confettis.filter((q) => q.y < H + 20);
    if (etat !== 'pause') dessinerMonde(m);
    if (!$('ecran-nouveau').hidden) dessinerDemo(dt);
    requestAnimationFrame(boucle);
  }
  function commandes(m, dt) {
    const j = m.joueur;
    if (!j) return;
    const lim = hwA(m.piste, j.d) - R;
    if (clavier.gauche || clavier.droite) {
      j.tx = clamp(j.tx + ((clavier.droite ? 1 : 0) - (clavier.gauche ? 1 : 0)) * 430 * dt, -lim, lim);
      // Au clavier, la cible reste près de la bouée pour qu'elle réagisse vite.
      j.tx = clamp(j.tx, j.x - 90, j.x + 90);
    } else if (joueurPointeur.actif || joueurPointeur.souris) viserPointeur(joueurPointeur.x);
    j.tx = clamp(j.tx, -lim, lim);
  }

  // Textes qui dépendent de la langue.
  I18N.surChangement(() => { majBoutonSon(); if (!$('ecran-niveaux').hidden) ouvrirNiveaux(); if (!$('ecran-coureur').hidden) ouvrirCoureur(); });
  majBoutonSon();
  montrer('ecran-titre');
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
