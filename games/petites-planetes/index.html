<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);

      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];

    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];

    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }

      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }

    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();

  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +

  function empreinte(sim, etat) { return hacher(typeof sim.empreinte === 'function' ? sim.empreinte(etat) : etat); }
  // État précédent (interpolation du rendu) : seulement pour un état JSON simple.
  function precedent(sim, etat) { return typeof sim.exporter === 'function' ? null : copie(etat); }
  // config : { ctl: [0 | 1..3 par camp], … (propre au jeu : carte, niveau…) }

  function Simulation(sim, graine, config, reglages) {
    this.sim = sim;
    this.r = Object.assign({}, REGLAGES, reglages || {});
    this.config = copie(config || {});
    var etat = sim.depart(graine >>> 0, copie(this.config));
    etat.k = 0;
    if (!Number.isInteger(etat.a)) etat.a = graine >>> 0;
    etat.ctl = [];
    for (var c = 0; c < sim.camps; c++) etat.ctl.push(Array.isArray(this.config.ctl) && Number.isInteger(this.config.ctl[c]) ? this.config.ctl[c] : 0);
    this.etat = etat;
    this.prec = precedent(sim, etat);
    this.resultat = sim.fin(etat);
    this.journal = [];               // [[k, ordres], …] depuis le plus ancien instantané gardé
    this.instantanes = [{ k: 0, etat: exporterEtat(sim, etat) }];
    this.hashes = [];                // [[k, h], …] (les 20 derniers)
  }

  Simulation.prototype.k = function () { return this.etat.k; };

  // Joue le tick suivant avec ses ordres. Renvoie le hachage si c'est un tick de contrôle.
  Simulation.prototype.avancer = function (ordres) {
    var sim = this.sim, etat = this.etat, camps = sim.camps;
    var k = etat.k + 1;
    this.prec = precedent(sim, etat);
    var liste = trierOrdres(Array.isArray(ordres) ? ordres : []);
    var alea = aleaDe(etat);
    var i, o;
    // 1. contrôles
    for (i = 0; i < liste.length; i++) {
      o = liste[i];
      if (o[0] === camps && o[2] === T_CONTROLE && Number.isInteger(o[3]) && o[3] >= 0 && o[3] < camps && Number.isInteger(o[4]) && o[4] >= 0 && o[4] <= 3) etat.ctl[o[3]] = o[4];
    }
    // 2. humains
    for (i = 0; i < liste.length; i++) {
      o = liste[i];
      if (!Array.isArray(o) || !Number.isInteger(o[0]) || o[0] < 0 || o[0] >= camps || etat.ctl[o[0]] !== 0) continue;
      var ordre = o.slice(2);
      if (!ordreBienForme(ordre)) continue;
      var ok = false;
      try { ok = sim.valide(etat, o[0], ordre) === true; } catch (e) { ok = false; }
      if (ok) sim.ordre(etat, o[0], ordre);
    }
    // 3. robots
    for (var c = 0; c < camps; c++) {
      if (etat.ctl[c] === 0 || (k + c * 3) % sim.periodeBot !== 0) continue;
      var siens = [];
      try { siens = sim.bot(etat, c, etat.ctl[c], alea) || []; } catch (e) { siens = []; }
      for (var j = 0; j < siens.length && j < 8; j++) {
        if (ordreBienForme(siens[j]) && sim.valide(etat, c, siens[j]) === true) sim.ordre(etat, c, siens[j]);
      }
    }
    // 4. un pas
    sim.pas(etat, alea);
    etat.k = k;
    this.journal.push([k, liste]);
    var h = null;
    if (k % this.r.hashTous === 0) {
      h = empreinte(sim, etat);
      this.hashes.push([k, h]);
      if (this.hashes.length > 20) this.hashes.shift();
    }
    if (k % this.r.instantaneTous === 0) {
      this.instantanes.push({ k: k, etat: exporterEtat(sim, etat) });
      if (this.instantanes.length > 2) {
        this.instantanes.shift();
        var depuis = this.instantanes[0].k;
        while (this.journal.length && this.journal[0][0] <= depuis) this.journal.shift();
      }
    }
    if (!this.resultat) this.resultat = sim.fin(etat);
    return h;
  };

  Simulation.prototype.instantane = function () { return { k: this.etat.k, etat: exporterEtat(this.sim, this.etat) }; };

  // Empreinte de l'état courant (comparaison de deux appareils, tests).
  Simulation.prototype.hachage = function () { return empreinte(this.sim, this.etat); };

  // Remplace l'état (resynchronisation, reprise). Le journal repart de cet instantané.
  Simulation.prototype.restaurer = function (snap) {
    if (!snap || !snap.etat || !Number.isInteger(snap.k)) return false;
    this.etat = importerEtat(this.sim, snap.etat);
    this.etat.k = snap.k;
    this.prec = precedent(this.sim, this.etat);
    this.journal = [];
    this.instantanes = [{ k: snap.k, etat: copie(snap.etat) }];
    this.hashes = [];
    this.resultat = this.sim.fin(this.etat);
    return true;
  };

  Simulation.prototype.hashDe = function (k) {
    for (var i = this.hashes.length - 1; i >= 0; i--) if (this.hashes[i][0] === k) return this.hashes[i][1];
    return null;
  };

  // Rejoue un journal de paquets [[k, ordres], …] depuis un état de départ (tests, reprise).
  function rejouer(sim, graine, config, journal, reglages) {
    var s = new Simulation(sim, graine, config, reglages);
    for (var i = 0; i < journal.length; i++) s.avancer(journal[i][1]);
    return s;
  }

  // --- Cadenceur : l'horloge d'une partie -----------------------------------
  // o : { camps, delai, depart (dernier tick déjà joué), envoyer(paquet) }

  function Cadenceur(o) {
    this.camps = o.camps;
    this.delai = Number.isInteger(o.delai) ? o.delai : REGLAGES.delaiEntree;
    this.k = Number.isInteger(o.depart) ? o.depart : 0;
    this.envoyer = o.envoyer || function () {};
    this.attente = [];                    // [kApplication, ordre complet]
    this.seqs = [];
    for (var c = 0; c < this.camps; c++) this.seqs.push(-1);
    this.seqSys = 0;
  }

  // Ordre d'un joueur : joué au tick courant + délai. Les numéros de séquence ne font que
  // croître (un ordre en double ou rejoué est ignoré). false si l'ordre est refusé.
  Cadenceur.prototype.recevoir = function (camp, seq, ordre) {
    if (!Number.isInteger(camp) || camp < 0 || camp >= this.camps) return false;
    if (!Number.isInteger(seq) || seq <= this.seqs[camp] || !ordreBienForme(ordre)) return false;
    this.seqs[camp] = seq;
    this.attente.push([this.k + this.delai, [camp, seq].concat(ordre)]);
    return true;
  };

  // Le camp passe à un robot (niveau 1 à 3) ou revient à un humain (0), au tick suivant.
  Cadenceur.prototype.controle = function (camp, niveau) {
    this.seqSys += 1;
    this.attente.push([this.k + 1, [this.camps, this.seqSys, T_CONTROLE, camp, niveau]]);
  };

  // Tick suivant : paquet des ordres arrivés à échéance, diffusé (même vide).
  Cadenceur.prototype.pas = function () {
    this.k += 1;
    var k = this.k, garde = [], o = [];
    for (var i = 0; i < this.attente.length; i++) {
      if (this.attente[i][0] <= k) o.push(this.attente[i][1]); else garde.push(this.attente[i]);
    }
    this.attente = garde;
    var paquet = { t: 'k', k: k, o: trierOrdres(o) };
    this.envoyer(paquet);
    return paquet;
  };

  // --- Partie, côté jeu ------------------------------------------------------
  // o : {
  //   sim           window.JEL_SIM
  //   surEvenement  function (e) :
  //                   { type: 'recherche', reste, n }      recherche en cours (reste : ms ; n : joueurs qui cherchent, ou null)
  //                   { type: 'connexion' }                adversaire trouvé, connexion en cours
  //                   { type: 'debut', mode, camp, raison } partie commencée : mode 'local' (robot) ou 'p2p' / 'relais'
  //                   { type: 'controle', camp, niveau }   un camp passe au robot (niveau ≥ 1) ou revient à l'humain (0)
  //                   { type: 'fin', resultat }            partie finie (fin(etat) de la simulation)
  //                   { type: 'info', code }               'coupe' (avec raison ; retour : reconnexion encore tentée),
  //                                                        'reprise', 'reconnecte'…
  //                   { type: 'reseau', qui, ok, fin }     problème de réseau : qui = 'moi' (cet appareil) ou
  //                                                        'adversaire' ; ok = true quand il est réglé ; fin = true
  //                                                        quand on renonce à se reconnecter (la partie reste contre le robot)
  //                   { type: 'attente', n }               réponse à partie.attente() : joueurs qui cherchent
  //   reglages      remplace des valeurs de REGLAGES
  // }
  // Commandes : local({ graine, config, camp }), chercher({ config, repli }), jouerRobot(),
  // ordre([type, a, b, c]), pause(oui), quitter(), attente().
  // Lecture : mode ('arret', 'recherche', 'connexion', 'local', 'en-ligne', 'fin'), camp, etat (tick
  // courant), prec (tick précédent), alpha() (0 à 1, pour l'interpolation du rendu), resultat,
  // connexion ('p2p' | 'relais' | null).

  function dansLanceur() {
    try { return racine.parent && racine.parent !== racine; } catch (e) { return false; }
  }

  function horloge() {
    return racine.performance && typeof racine.performance.now === 'function' ? racine.performance.now() : Date.now();
  }

  function Partie(o) {
    this.o = o || {};
    this.sim = this.o.sim;
    this.r = Object.assign({}, REGLAGES, this.sim && this.sim.reglages, this.o.reglages || {});
    this.mode = 'arret';
    this.camp = 0;
    this.connexion = null;
    this.s = null;                 // Simulation
    this.cad = null;               // cadenceur local (partie contre le robot)
    this.file = [];                // paquets reçus, pas encore joués (en ligne)
    this.seq = 0;
    this.tDernier = 0;             // heure du dernier tick joué
    this.minuteur = 0;
    this.minuteurRecherche = 0;
    this.finRecherche = 0;
    this.nRecherche = null;
    this.enPause = false;
    this.attendSnap = false;
    this.retour = false;           // partie continuée contre le robot après une coupure, retour en ligne possible
    this.repli = null;             // { graine, config } de la partie contre le robot si personne n'est trouvé
    this.ecoute = this.recevoirLanceur.bind(this);
    this.battement = this.boucle.bind(this);
  }

  Object.defineProperty(Partie.prototype, 'etat', { get: function () { return this.s ? this.s.etat : null; } });
  Object.defineProperty(Partie.prototype, 'prec', { get: function () { return this.s ? this.s.prec : null; } });
  Object.defineProperty(Partie.prototype, 'resultat', { get: function () { return this.s ? this.s.resultat : null; } });

  Partie.prototype.signaler = function (e) {
    var f = this.o.surEvenement;
    if (typeof f !== 'function') return;
    try { f(e); } catch (erreur) { setTimeout(function () { throw erreur; }, 0); }
  };

  Partie.prototype.alpha = function () {
    if (!this.s || this.enPause) return 1;
    var a = (horloge() - this.tDernier) / this.r.tickMs;
    return a < 0 ? 0 : a > 1 ? 1 : a;
  };

  Partie.prototype.versLanceur = function (m) {
    m.type = 'jel-tr';
    try { racine.parent.postMessage(m, '*'); } catch (e) { /* pas de lanceur */ }
  };

  // Arrête tout sans rien annoncer.
  Partie.prototype.arreter = function () {
    clearTimeout(this.minuteur);
    clearInterval(this.minuteurRecherche);
    racine.removeEventListener('message', this.ecoute);
    if (this.mode === 'recherche' || this.mode === 'connexion' || this.mode === 'en-ligne' || (this.mode === 'local' && this.retour)) this.versLanceur({ op: 'quitter' });
    this.mode = 'arret';
    this.file = [];
    this.cad = null;
    this.connexion = null;
    this.attendSnap = false;
    this.retour = false;
  };

  Partie.prototype.quitter = function () { this.arreter(); };

  // Partie contre le robot, entièrement sur l'appareil (aucune requête réseau).
  // p : { graine, config (ctl compris), camp }.
  Partie.prototype.local = function (p, raison) {
    this.arreter();
    racine.JEL_TR.derniere = this;       // pour le robot de contrôle (scripts/tester-temps-reel.mjs)
    p = p || {};
    this.camp = Number.isInteger(p.camp) ? p.camp : 0;
    this.s = new Simulation(this.sim, (p.graine >>> 0) || 1, p.config || {}, this.r);
    this.seq = 0;
    var moi = this;
    this.cad = new Cadenceur({ camps: this.sim.camps, delai: this.r.delaiEntree, depart: 0, envoyer: function (paquet) { moi.jouerPaquet(paquet); } });
    this.mode = 'local';
    this.enPause = false;
    this.tDernier = horloge();
    this.signaler({ type: 'debut', mode: 'local', camp: this.camp, raison: raison || 'choix' });
    this.minuteur = setTimeout(this.battement, 16);
  };

  // Recherche d'un adversaire en ligne (par le lanceur), robot si personne n'est trouvé
  // dans rechercheMs. p : { config (partie en ligne), repli: { graine, config, camp } }.
  Partie.prototype.chercher = function (p) {
    this.arreter();
    racine.JEL_TR.derniere = this;
    p = p || {};
    this.repli = p.repli || { graine: 1, config: {} };
    if (!dansLanceur()) { this.local(this.repli, 'seul'); return; }
    this.mode = 'recherche';
    this.nRecherche = null;
    this.finRecherche = horloge() + this.r.rechercheMs;
    racine.addEventListener('message', this.ecoute);
    this.versLanceur({ op: 'chercher', proto: PROTOCOLE, config: copie(p.config || {}) });
    var moi = this;
    var annoncer = function () {
      if (moi.mode !== 'recherche') return;
      var reste = Math.max(0, moi.finRecherche - horloge());
      moi.signaler({ type: 'recherche', reste: reste, n: moi.nRecherche });
      if (reste <= 0) moi.basculerLocal('personne');
    };
    this.minuteurRecherche = setInterval(annoncer, 250);
    annoncer();
  };

  // Bouton « Jouer contre un robot maintenant » (ou délai écoulé).
  Partie.prototype.jouerRobot = function () {
    if (this.mode === 'recherche' || this.mode === 'connexion') this.basculerLocal('choix');
  };

  Partie.prototype.basculerLocal = function (raison) {
    var repli = this.repli || { graine: 1, config: {} };
    this.local(repli, raison);
  };

  // Joueurs en recherche, demandés au lanceur (fin d'une partie contre le robot) : événement 'attente'.
  Partie.prototype.attente = function () {
    if (!dansLanceur()) return false;
    racine.removeEventListener('message', this.ecoute);
    racine.addEventListener('message', this.ecoute);
    this.versLanceur({ op: 'attente' });
    return true;
  };

  // Messages du lanceur : { type: 'jel-tr', etat: … } ou { type: 'jel-tr', paquet | snap | journal | demande }.
  Partie.prototype.recevoirLanceur = function (e) {
    if (e.source !== racine.parent) return;
    var d = e.data;
    if (!d || d.type !== 'jel-tr') return;
    if (d.etat === 'attente') {
      if (this.mode === 'recherche') { this.nRecherche = Number.isInteger(d.n) ? d.n : null; }
      else this.signaler({ type: 'attente', n: Number.isInteger(d.n) ? d.n : 0 });
      return;
    }
    if (d.etat === 'solo') {
      if (this.mode === 'recherche' || this.mode === 'connexion') this.basculerLocal(d.raison || 'reseau');
      return;
    }
    if (d.etat === 'trouve') {
      if (this.mode !== 'recherche') return;
      clearInterval(this.minuteurRecherche);
      this.mode = 'connexion';
      this.camp = d.camp === 1 ? 1 : 0;
      var cfg = copie(d.config || {});
      cfg.ctl = [0, 0];
      this.s = new Simulation(this.sim, d.graine >>> 0, cfg, this.r);
      this.seq = 0;
      this.file = [];
      this.signaler({ type: 'connexion' });
      this.versLanceur({ op: 'pret' });
      var moi = this;
      clearTimeout(this.minuteur);
      this.minuteur = setTimeout(function () { if (moi.mode === 'connexion') moi.basculerLocal('connexion'); }, this.r.connexionMs);
      return;
    }
    if (d.etat === 'mode') { this.connexion = d.mode === 'p2p' ? 'p2p' : 'relais'; return; }
    if (d.etat === 'info') { this.signaler({ type: 'info', code: String(d.code || '') }); return; }
    if (d.etat === 'reseau') {
      if (d.fin) this.retour = false;
      this.signaler({ type: 'reseau', qui: d.qui === 'adversaire' ? 'adversaire' : 'moi', ok: d.ok === true, fin: d.fin === true });
      return;
    }
    if (d.etat === 'coupe') { this.continuerSeul(d.raison || 'coupe', d.retour === true); return; }
    if (d.demande === 'snap') {
      if (this.s) this.versLanceur({ op: 'snap', snap: this.s.instantane() });
      return;
    }
    if (d.snap) {
      // Coupure longue : la partie continuait contre le robot ; le réseau revient → retour en ligne.
      if (this.mode === 'local' && this.retour) this.revenirEnLigne(d.snap);
      else if (this.mode === 'en-ligne' || this.mode === 'connexion') this.recevoirSnap(d.snap);
      return;
    }
    if (d.paquet) {
      if (this.mode !== 'connexion' && this.mode !== 'en-ligne') return;
      this.file.push(d.paquet);
      if (this.mode === 'connexion') {
        clearTimeout(this.minuteur);
        this.mode = 'en-ligne';
        this.tDernier = horloge();
        this.signaler({ type: 'debut', mode: this.connexion || 'relais', camp: this.camp, raison: 'en-ligne' });
        this.minuteur = setTimeout(this.battement, 0);
      }
    }
  };

  // Instantané reçu (désynchronisation, reprise, secours) : l'état est remplacé. Les paquets
  // déjà en file sont jetés : ceux qui suivent l'instantané arrivent toujours après lui (même
  // canal), et ceux d'avant peuvent venir d'une autre horloge (secours).
  Partie.prototype.recevoirSnap = function (snap) {
    if (!this.s || !snap || !Number.isInteger(snap.k)) return;
    this.s.restaurer(snap);
    this.attendSnap = false;
    this.file = [];
    this.tDernier = horloge();
    this.signaler({ type: 'info', code: 'reprise' });
  };

  // Plus de réseau : la partie continue sur l'appareil, au même tick, l'autre camp tenu par
  // le robot (niveau moyen). retour : le lanceur essaie encore de se reconnecter ; s'il y
  // arrive, l'état de la vraie partie arrive (instantané) et on y revient (revenirEnLigne).
  Partie.prototype.continuerSeul = function (raison, retour) {
    if (this.mode === 'recherche' || this.mode === 'connexion') { this.basculerLocal(raison); return; }
    if (this.mode !== 'en-ligne' || !this.s) return;
    clearTimeout(this.minuteur);
    this.retour = !!retour;
    if (!this.retour) racine.removeEventListener('message', this.ecoute);
    var moi = this;
    // Les paquets déjà reçus sont joués d'abord (dans l'ordre), puis l'horloge locale prend la suite.
    while (this.file.length && this.file[0].k === this.s.k() + 1) this.jouerPaquet(this.file.shift());
    this.file = [];
    this.cad = new Cadenceur({ camps: this.sim.camps, delai: this.r.delaiEntree, depart: this.s.k(), envoyer: function (p) { moi.jouerPaquet(p); } });
    for (var c = 0; c < this.sim.camps; c++) if (c !== this.camp && this.s.etat.ctl[c] === 0) this.cad.controle(c, 2);
    this.mode = 'local';
    this.connexionAvant = this.connexion;
    this.connexion = null;
    this.tDernier = horloge();
    this.signaler({ type: 'info', code: 'coupe', raison: raison, retour: this.retour });
    this.minuteur = setTimeout(this.battement, 16);
  };

  // Retour dans la partie en ligne après une coupure : l'état de la vraie partie remplace
  // celui joué contre le robot pendant l'absence.
  Partie.prototype.revenirEnLigne = function (snap) {
    if (!this.s || !snap || !Number.isInteger(snap.k)) return;
    clearTimeout(this.minuteur);
    this.cad = null;
    this.retour = false;
    this.mode = 'en-ligne';
    this.connexion = this.connexion || this.connexionAvant || 'relais';
    this.enPause = false;
    this.file = [];
    this.s.restaurer(snap);
    this.attendSnap = false;
    this.tDernier = horloge();
    this.signaler({ type: 'info', code: 'reconnecte' });
    this.minuteur = setTimeout(this.battement, 0);
  };

  // Ordre du joueur de l'appareil : [type, a, b, c]. Renvoie true s'il part.
  Partie.prototype.ordre = function (ordre) {
    if (!ordreBienForme(ordre) || !this.s || this.s.resultat) return false;
    if (this.mode === 'local') {
      if (this.enPause) return false;
      this.seq += 1;
      return this.cad.recevoir(this.camp, this.seq, ordre.slice());
    }
    if (this.mode === 'en-ligne' || this.mode === 'connexion') {
      this.seq += 1;
      this.versLanceur({ op: 'ordre', seq: this.seq, o: ordre.slice() });
      return true;
    }
    return false;
  };

  // Pause : seulement contre le robot (en ligne, la partie continue ; le moteur rattrape
  // les ticks au retour).
  Partie.prototype.pause = function (oui) {
    oui = !!oui;
    if (oui === this.enPause) return;
    this.enPause = oui;
    if (!oui) { this.tDernier = horloge(); clearTimeout(this.minuteur); this.minuteur = setTimeout(this.battement, 0); }
  };

  Partie.prototype.jouerPaquet = function (paquet) {
    var s = this.s;
    if (!s || !paquet || paquet.k !== s.k() + 1) return false;
    var avaitFin = !!s.resultat;
    var ctlAvant = s.etat.ctl.slice();
    var h = s.avancer(paquet.o);
    for (var c = 0; c < ctlAvant.length; c++) {
      if (s.etat.ctl[c] !== ctlAvant[c]) this.signaler({ type: 'controle', camp: c, niveau: s.etat.ctl[c] });
    }
    if (h && this.mode === 'en-ligne') this.versLanceur({ op: 'hash', k: paquet.k, h: h });
    if (!avaitFin && s.resultat) {
      this.signaler({ type: 'fin', resultat: s.resultat });
      if (this.mode === 'en-ligne') this.versLanceur({ op: 'fin', k: paquet.k, resultat: s.resultat });
    }
    return true;
  };

  // Boucle (minuterie courte, découplée du rendu) : joue les ticks dus, sans jamais en
  // jouer plus de rattrapageMax d'un coup (l'affichage ne gèle pas ; un onglet revenu
  // d'arrière-plan rattrape en quelques images).
  Partie.prototype.boucle = function () {
    clearTimeout(this.minuteur);
    var s = this.s;

      ordres.push([ENVOYER, de, meilleur, pctMeilleur]);
      parti.push(de);
      envois++;
    }

    // 4. Attaque groupée (difficile) : deux planètes visent ensemble une planète adverse trop forte pour une seule.
    if (niveau === 3 && envois === 0 && miennes.length >= 2 && alea(2) === 0) {
      var a1 = miennes[0], a2 = miennes[1];
      if (parti.indexOf(a1) < 0 && parti.indexOf(a2) < 0) {
        var dispo1 = vaisseaux(pl[a1]) - garde(etat, a1, camp, niveau, prof), dispo2 = vaisseaux(pl[a2]) - garde(etat, a2, camp, niveau, prof);
        var choix = -1, mieux = 0;
        for (var e = 0; e < pl.length; e++) {
          if (pl[e].c < 0 || pl[e].c === camp) continue;
          var bes = besoinPour(etat, pl[a1], e, camp, niveau).besoin + 3;
          if (dispo1 + dispo2 < bes || dispo1 >= bes) continue;
          var sc = Math.floor((valeurDe(pl[e], prof) * 1000) / (bes * 12 + 30));
          if (sc > mieux) { mieux = sc; choix = e; }
        }
        if (choix >= 0) {
          ordres.push([ENVOYER, a1, choix, 100 - 25 * (vaisseaux(pl[a1]) > 2 * dispo1 ? 1 : 0)]);
          ordres.push([ENVOYER, a2, choix, 75]);
        }
      }
    }
    return ordres;
  }

  window.JEL_SIM = {
    camps: 2,
    periodeBot: 5,
    reglages: { tickMs: 100, delaiEntree: 2 },
    U: U, W: W, H: H, RAYON: RAYON, COUT: COUT, ENVOYER: ENVOYER, CONSTRUIRE: CONSTRUIRE, USINE: USINE, BOUCLIER: BOUCLIER,
    depart: depart, valide: valide, ordre: ordre, pas: pas, bot: bot, fin: fin, forces: forces,
  };
})();

<script>
/* ==========================================================================
   Les Petites Planètes — stratégie en temps réel, 1 contre 1.
   Des vaisseaux-graines partent de tes planètes pour coloniser les planètes
   grises et prendre les planètes orange du robot (ou d'un autre joueur).
   La partie elle-même (règles, robot, temps) est dans le bloc jel-sim
   (window.JEL_SIM) ; le moteur commun jel-tr (window.JEL_TR) fait tourner
   l'horloge. Ce code ne fait que dessiner, écouter le doigt et le clavier,
   et gérer les écrans, les niveaux et la sauvegarde.
   ========================================================================== */
(function () {
  'use strict';
  var JEU = 'petites-planetes';
  var I18N = window.JEL_I18N, JEL_SAVE = window.JEL_SAVE, JEL_TR = window.JEL_TR, SIM = window.JEL_SIM;
  var t = function (cle, vars) { return I18N.t(cle, vars); };
  var U = SIM.U, W = SIM.W, H = SIM.H;

  // --- Les 20 niveaux du parcours solo ---------------------------------------
  // Clés lues par la simulation : paires (paires de planètes grises), neutres
  // [min, max] (vaisseaux sur les grises), bat (0 rien, 1 usine, 2 usine et
  // bouclier), lunes, nebuleuses, dorees, duree (ticks, 10 par seconde),
  // depart / departRobot (vaisseaux × 100 des planètes mères), bouclierDepart.
  // robot : niveau du robot (1 facile, 2 moyen, 3 difficile) ; graine : carte fixe.

    dessinerUsine(bx + br * 0.62, by - br * 0.72, m * 0.04);
    // Flottes de graines qui voyagent entre les planètes
    var trajets = [[bx, by, dx, dy, MOI, 0], [bx, by, w * 0.5, h * 0.44, MOI, 0.4], [ox, oy, w * 0.5, h * 0.44, LUI, 0.15], [dx, dy, ox, oy, MOI, 0.65], [w * 0.86, h * 0.82, dx, dy, LUI, 0.8]];
    for (var i = 0; i < trajets.length; i++) {
      var tr = trajets[i], u = (tps * 0.18 + tr[5]) % 1;
      var x = tr[0] + (tr[2] - tr[0]) * u, y = tr[1] + (tr[3] - tr[1]) * u - Math.sin(u * Math.PI) * m * 0.08;
      var ang = Math.atan2(tr[3] - tr[1] - Math.cos(u * Math.PI) * Math.PI * m * 0.08, tr[2] - tr[0]);
      var tl = m * 0.016;
      for (var k = 0; k < 3; k++) dessinerGraine(x - Math.cos(ang) * k * tl * 2.6 + (k === 1 ? tl : 0), y - Math.sin(ang) * k * tl * 2.6 + (k === 2 ? tl : -tl * 0.5), ang, tl, tr[4]);
    }
  }

  // --- Boucle de dessin -------------------------------------------------------------------------
  var tPrec = performance.now();
  function image(now) {
    var dt = Math.min(0.05, (now - tPrec) / 1000);
    tPrec = now;
    var w = innerWidth, h = innerHeight;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fondCiel(now, w, h);
    if (session && partie.etat && (enJeu || finAnnoncee)) dessinerPartie(now, dt);
    else { pos = []; dessinerAccueil(now); }
    dessinerParticules(dt);
    if (tuto) dessinerTuto(now);
    requestAnimationFrame(image);
  }

  // Page cachée : pause complète contre le robot (en ligne, la partie continue).
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && enJeu && partie.mode === 'local' && !partie.resultat) ouvrirPause();
  });
  JEL_SAVE.surFermeture(function () {
    if (session && session.type === 'solo' && enJeu) JEL_SAVE.save(JEU, donneesSauvegarde(session.i + 1));
  });

  // --- Boutons ----------------------------------------------------------------------------------
  function clic(id, f) { $(id).addEventListener('click', function () { reveillerAudio(); son('clic'); f(); }); }
  clic('bJouer', function () {
    JEL_SAVE.reprise({ jeu: JEU, onContinuer: function (d) { lancerNiveau((d.niveau | 0) - 1); }, onNouvelle: function () { lancerNiveau(0); } });
  });
  clic('bLigne', function () { majChoixRobot(); montrer('choixRobot'); });
  clic('bNiveaux', ouvrirNiveaux);
  clic('bRetourNiveaux', function () { majTitre(); montrer('titre'); });
  clic('bRetourChoix', function () { montrer('titre'); });
  clic('bChercher', lancerRecherche);
  clic('bRobotMaintenant', function () { partie.jouerRobot(); });
  clic('bAnnuler', allerAccueil);
  clic('bPause', ouvrirPause);
  clic('bReprendre', reprendre);
  clic('bRecommencer', function () { if (session && session.type === 'solo') { partie.pause(false); lancerNiveau(session.i); } });
  clic('bAccueilPause', allerAccueil);
  $('bUsine').addEventListener('click', function () { if (menuPour >= 0) construire(menuPour, SIM.USINE); });
  $('bBouclier').addEventListener('click', function () { if (menuPour >= 0) construire(menuPour, SIM.BOUCLIER); });
  var boutonsSon = document.querySelectorAll('.bouton-son');
  for (var bs = 0; bs < boutonsSon.length; bs++) boutonsSon[bs].addEventListener('click', function () { reveillerAudio(); basculerSon(); });
  function majChoixRobot() {
    var b = $('choixNiveauRobot').querySelectorAll('button');
    for (var i = 0; i < b.length; i++) b[i].setAttribute('aria-pressed', +b[i].dataset.robot === reglages.robot ? 'true' : 'false');
  }
  (function () {
    var b = $('choixNiveauRobot').querySelectorAll('button');
    for (var i = 0; i < b.length; i++) b[i].addEventListener('click', function () { reglages.robot = +this.dataset.robot; ecrireLocal('pp-robot', String(reglages.robot)); majChoixRobot(); son('clic'); });
  })();

  // --- Démarrage ----------------------------------------------------------------------------------
  construireBarrePct();
  majSon();
  majTitre();
  redimensionner();
  montrer('titre');
  requestAnimationFrame(image);
})();
</script>
