<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

  .algue-b .stock { position: absolute; right: -6px; top: -8px; min-width: 24px; height: 24px; border-radius: 12px; background: #fff; color: #12324a; font-weight: 800; font-size: 14px; display: grid; place-items: center; padding: 0 5px; box-shadow: 0 1px 3px #0005; }

  #b-poissons .attente { position: absolute; left: 0; bottom: 0; right: 0; background: #0006; height: 0; }
  #b-poissons.appel { animation: respire 1s infinite; box-shadow: 0 0 0 3px #ffe46b; }
  #b-poissons:disabled { cursor: default; }

  /* ---------- Écrans ---------- */
  .ecran { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
  .voile { background: #062a40c4; }
  .carte { background: #fffaf0; border-radius: 22px; padding: 18px 18px 16px; width: min(420px, 100%); text-align: center; box-shadow: 0 10px 30px #0006; max-height: 100%; overflow-y: auto; }

  .gros:active { transform: translateY(3px); box-shadow: 0 2px 0 #b86f0c; }
  .moyen { display: block; width: 100%; min-height: 48px; border-radius: 15px; background: #d8f3fb; color: #0d4f73; font-weight: 800; font-size: 17px; box-shadow: 0 3px 0 #8fc7da; margin: 7px 0; padding: 8px 12px; }
  .moyen:active { transform: translateY(2px); box-shadow: 0 1px 0 #8fc7da; }
  .rang { display: flex; gap: 8px; }
  .rang > * { flex: 1; }

  #ecran-titre { justify-content: space-between; padding: 0; }
  .t-haut { width: 100%; text-align: center; padding: 18px 16px 0; padding-top: max(18px, env(safe-area-inset-top)); color: #fff; }
  .t-haut h1 { margin: 0; font-size: clamp(30px, 8.5vw, 50px); line-height: 1.05; font-weight: 900; color: #fff; text-shadow: 0 3px 0 #0d6b8c, 0 6px 14px #0006; letter-spacing: .5px; }
  .t-haut p { margin: 8px auto 0; max-width: 460px; font-size: 16px; font-weight: 700; text-shadow: 0 1px 3px #0009; line-height: 1.3; }
  .t-bas { width: min(420px, 100%); padding: 0 16px 14px; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  .t-bas .gros { font-size: 26px; min-height: 64px; }
  .t-outils { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
  .t-outils .rond { background: #0d4f73cc; }
  .clavier { color: #e8fbff; font-size: 12px; text-align: center; margin: 6px 0 0; text-shadow: 0 1px 2px #000a; }
  .langue-place { min-height: 44px; display: flex; align-items: center; }
  #effacer-titre { display: flex; justify-content: center; }

  .grille-zone { margin: 8px 0 4px; font-weight: 800; color: #0d4f73; text-align: left; font-size: 15px; }
  .grille { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .niv-b { min-height: 58px; border-radius: 14px; background: #d8f3fb; color: #0d4f73; font-weight: 900; font-size: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 3px 0 #8fc7da; padding: 2px; }
  .niv-b .et { display: flex; gap: 0; }
  .niv-b .et svg { width: 13px; height: 13px; }
  .niv-b.ferme { background: #d9dde0; color: #8a9399; box-shadow: 0 3px 0 #aab2b8; cursor: default; }
  .niv-b.ferme svg.lock { width: 22px; height: 22px; }
  .niv-b.actuel { background: #ffe9a8; box-shadow: 0 3px 0 #d8a93a; }

  .album { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; text-align: left; }
  .fiche { background: #e9f8fc; border-radius: 14px; padding: 6px; font-size: 12px; line-height: 1.25; }
  .fiche canvas { width: 100%; height: 70px; display: block; border-radius: 10px; background: linear-gradient(#7fd8ea, #2a93b8); }
  .fiche b { display: block; font-size: 13px; margin: 4px 0 2px; color: #0d4f73; }
  .fiche.inconnue { opacity: .7; }
  .fiche.inconnue canvas { background: linear-gradient(#a9dbe6, #6fa9bd); }
  .compte { font-weight: 700; margin: 0 0 8px; color: #33627d; }

  .choix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .choix button { border-radius: 14px; background: #e9f8fc; padding: 6px 4px; min-height: 92px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: #0d4f73; border: 3px solid transparent; }
  .choix button canvas { width: 100%; height: 56px; }
  .choix button.choisi { border-color: #f5a623; background: #fff3d1; }
  .choix button.ferme { opacity: .55; cursor: default; }
  .choix button.ferme canvas { filter: grayscale(1) brightness(.7); }

  #f-etoiles { display: flex; justify-content: center; gap: 6px; margin: 4px 0 8px; }
  #f-etoiles svg { width: 54px; height: 54px; transform: scale(0); }
  #f-etoiles svg.on { animation: etoile .5s forwards; }
  #f-etoiles svg.off { animation: etoile .5s forwards; opacity: .35; filter: grayscale(1); }
  .f-ligne { display: flex; justify-content: space-between; gap: 10px; padding: 5px 4px; border-bottom: 1px dashed #c8dbe3; font-weight: 700; text-align: left; }
  .f-ligne span:last-child { text-align: right; }
  #f-record { margin: 8px 0 0; font-weight: 800; color: #c76a00; min-height: 1.2em; }
  #f-debloque { margin: 6px 0 0; color: #2a8a3a; font-weight: 800; }
  #f-debloque:empty, #f-conseil:empty { display: none; }
  #f-conseil { margin: 8px 0 0; color: #33627d; font-size: 14px; }

  /* ---------- Tutoriel, messages ---------- */
  #tuto { position: absolute; inset: 0; z-index: 20; background: #0624384d; }
  #tuto-bulle { position: absolute; left: 50%; transform: translateX(-50%); width: min(360px, calc(100% - 24px)); background: #fffaf0; border-radius: 18px; padding: 12px 14px; text-align: center; font-weight: 700; font-size: 16px; line-height: 1.3; box-shadow: 0 6px 20px #0006; }
  #tuto-bulle small { display: block; margin-top: 6px; font-size: 12px; color: #6a8899; font-weight: 600; }
  #main { position: absolute; left: 0; top: 0; width: 54px; height: 54px; pointer-events: none; z-index: 21; filter: drop-shadow(0 3px 4px #0007); }
  #toast { position: absolute; left: 50%; top: 40%; transform: translate(-50%, 0); z-index: 15; background: #fffaf0f2; color: #0d4f73; font-weight: 800; font-size: 15px; padding: 8px 14px; border-radius: 16px; box-shadow: 0 4px 14px #0005; text-align: center; width: max-content; max-width: min(340px, 90%); pointer-events: none; opacity: 0; transition: opacity .2s; }
  #toast.vu { opacity: 1; }
  #alerte { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 14; background: #4b2a6fe6; color: #fff; font-weight: 900; font-size: 22px; padding: 12px 20px; border-radius: 18px; pointer-events: none; animation: pulse .6s infinite; text-align: center; }

  @keyframes pop { 50% { transform: scale(1.3); } }
  @keyframes pulse { 50% { opacity: .55; } }
  @keyframes respire { 50% { transform: scale(1.05); } }
  @keyframes brille { 50% { box-shadow: 0 3px 0 #59b25a, 0 0 0 3px #7be05a, 0 0 14px 4px #c8ff9a; } }
  @keyframes part { to { transform: translateY(-30px) scale(.6); opacity: 0; } }
  @keyframes etoile { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.25) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
  @media (min-width: 700px) { .cmd .lignes { font-size: 17px; } .cmd .lg svg { width: 24px; height: 24px; } }
</style>

<body>
<div id="app">

<script>
(function () {
  'use strict';
  /* =====================================================================
     La ferme d'algues du lagon — jeu de simulation et de stratégie.
     On plante des boutures sur des cordes sous l'eau, on récolte les algues
     mûres d'un glissement du doigt et on livre les commandes du port avant
     le départ du bateau. 20 niveaux, 4 coins du lagon.
     ===================================================================== */
  const JEU = 'la-ferme-d-algues-du-lagon';
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => (I18N ? I18N.t(cle, vars) : cle);
  const nb = (x) => (I18N ? I18N.nombre(x) : String(x));
  const SAVE = window.JEL_SAVE;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const hasard = (a, b) => a + Math.random() * (b - a);
  const entier = (a, b) => Math.floor(hasard(a, b + 1));
  const choisir = (liste) => liste[Math.floor(Math.random() * liste.length)];
  const $ = (id) => document.getElementById(id);

  /* ---------------- Les espèces d'algues ----------------
     base : secondes de pousse en pleine lumière ; val : coquillages par algue ;
     f(l) : vitesse de pousse selon la lumière l (0 = noir, 1 = plein soleil). */
  const TYPES = {
    verte: { base: 7, val: 1, f: (l) => 0.2 + 0.8 * l, c1: '#9df06a', c2: '#2c9a3c' },
    rouge: { base: 8, val: 2, f: (l) => clamp(1 - Math.abs(l - 0.4) * 1.6, 0.22, 1), c1: '#ff8fa3', c2: '#b8233f' },
    doree: { base: 11, val: 4, f: (l) => clamp((l - 0.4) / 0.5, 0.04, 1), c1: '#ffe98a', c2: '#d39a17' },
  };
  const ORDRE_TYPES = ['verte', 'rouge', 'doree'];
  const PLACES = 5; // places par corde

  /* ---------------- Les 20 niveaux ----------------
     z : zone ; k : cordes ; a : algues ; t : secondes avant le départ du bateau ;
     c : commandes ; q : algues par commande [min, max] ; mur : secondes avant
     qu'une algue mûre se détache ; maree : amplitude des marées ; oursin :
     secondes entre deux oursins (0 = aucun) ; vit : vitesse des oursins ;
     tempete : secondes entre deux tempêtes ; trouble : vitesse du trouble de
     l'eau ; ordre : commandes à livrer dans l'ordre ; urg : commandes urgentes ;
     tuto : démonstration de la nouveauté au début du niveau. */
  const V = ['verte'], VR = ['verte', 'rouge'], VRD = ['verte', 'rouge', 'doree'];
  const N = (o) => Object.assign({ k: 3, a: VR, t: 120, c: 5, q: [3, 5], mur: 9, maree: 0, oursin: 0, vit: 0.22, tempete: 0, trouble: 0, ordre: false, urg: 0, tuto: null, simple: false }, o);
  const NIVEAUX = [
    N({ z: 'baie', k: 2, a: V, t: 110, c: 3, q: [2, 3], mur: 11, tuto: 'base', simple: true }),
    N({ z: 'baie', a: V, t: 110, c: 4, q: [2, 4], mur: 10, tuto: 'detache', simple: true }),
    N({ z: 'baie', t: 120, c: 4, q: [2, 4], mur: 10, tuto: 'rouge', simple: true }),
    N({ z: 'baie', t: 125, c: 5, q: [3, 5], mur: 10, tuto: 'melange' }),
    N({ z: 'baie', t: 125, c: 5, q: [3, 5], maree: 0.1, tuto: 'maree' }),
    N({ z: 'recif', t: 125, c: 5, q: [3, 5], oursin: 22, vit: 0.22, tuto: 'oursin' }),
    N({ z: 'recif', k: 4, t: 135, c: 6, q: [3, 5], maree: 0.1, oursin: 20, vit: 0.24 }),
    N({ z: 'recif', k: 4, a: VRD, t: 135, c: 5, q: [3, 5], tuto: 'doree' }),
    N({ z: 'recif', k: 4, a: VRD, t: 140, c: 6, q: [3, 6], mur: 8, maree: 0.1, oursin: 18, vit: 0.26 }),
    N({ z: 'recif', k: 4, a: VRD, t: 140, c: 6, q: [3, 6], mur: 8, oursin: 24, tempete: 32, tuto: 'tempete' }),
    N({ z: 'mangrove', a: VRD, t: 140, c: 6, q: [3, 5], mur: 8, trouble: 0.02, tuto: 'trouble' }),
    N({ z: 'mangrove', k: 4, a: VRD, t: 145, c: 6, q: [3, 6], mur: 8, trouble: 0.02, tempete: 30 }),
    N({ z: 'mangrove', k: 4, a: VRD, t: 150, c: 7, q: [3, 6], mur: 8, trouble: 0.022, oursin: 15, vit: 0.32, maree: 0.08 }),
    N({ z: 'mangrove', k: 4, a: VRD, t: 150, c: 6, q: [3, 6], mur: 8, maree: 0.1, oursin: 20, ordre: true, tuto: 'ordre' }),
    N({ z: 'mangrove', k: 4, a: VRD, t: 155, c: 7, q: [4, 6], mur: 7, trouble: 0.022, tempete: 30, oursin: 18, vit: 0.28, ordre: true }),
    N({ z: 'large', k: 4, a: VRD, t: 155, c: 7, q: [4, 6], mur: 7, maree: 0.17, oursin: 18, vit: 0.28, tuto: 'grandmaree' }),
    N({ z: 'large', k: 4, a: VRD, t: 155, c: 7, q: [4, 6], mur: 7, maree: 0.14, trouble: 0.02, urg: 3, tuto: 'urgent' }),
    N({ z: 'large', k: 4, a: VRD, t: 160, c: 8, q: [4, 6], mur: 7, maree: 0.12, oursin: 13, vit: 0.34, trouble: 0.025, urg: 3 }),
    N({ z: 'large', k: 4, a: VRD, t: 165, c: 8, q: [4, 7], mur: 6.5, maree: 0.14, oursin: 16, vit: 0.3, tempete: 22, trouble: 0.02, ordre: true }),
    N({ z: 'large', k: 4, a: VRD, t: 170, c: 9, q: [4, 7], mur: 6, maree: 0.16, oursin: 14, vit: 0.34, tempete: 26, trouble: 0.025, ordre: true, urg: 3 }),
  ];
  window.JEL_NIVEAUX = NIVEAUX.length;
  const MAX_ETOILES = NIVEAUX.length * 3;

  const ZONES = { baie: { eau1: '#7fe3e3', eau2: '#1d8fae', ciel1: '#8fd8ff', ciel2: '#d9f6ff' }, recif: { eau1: '#6fd6ef', eau2: '#156a9e', ciel1: '#7ccaf7', ciel2: '#e2f7ff' }, mangrove: { eau1: '#79cdb0', eau2: '#1f5d5a', ciel1: '#a6dcc6', ciel2: '#f0fbe8' }, large: { eau1: '#4cb0e0', eau2: '#0a3a72', ciel1: '#5fb6f2', ciel2: '#d5efff' } };
  const ZONE_ANIMAUX = { baie: ['tortue', 'bernard'], recif: ['hippocampe', 'perroquet'], mangrove: ['crabe'], large: ['raie', 'dauphin'] };

  /* Album : 13 espèces du lagon. */
  const ALBUM = ['verte', 'rouge', 'doree', 'oursin', 'etoile', 'nettoyeur', 'tortue', 'bernard', 'hippocampe', 'perroquet', 'crabe', 'raie', 'dauphin'];
  /* Bouées décorées (débloquées par les étoiles) et bateaux (un par zone terminée). */
  const BOUEES = [
    { id: 'classique', etoiles: 0 }, { id: 'rayee', etoiles: 6 }, { id: 'pois', etoiles: 14 },
    { id: 'etoile', etoiles: 24 }, { id: 'coquillage', etoiles: 36 }, { id: 'arcenciel', etoiles: 50 },
  ];

    $('b-poissons').classList.toggle('cache', !S.L.trouble);
    majOutils();
  }
  function majOutils() {
    document.querySelectorAll('.algue-b').forEach((b) => {
      const type = b.dataset.type;
      b.classList.toggle('choisie', S.choix === type);
      const st = b.querySelector('.stock');
      if (st.textContent !== nb(S.stock[type])) { st.textContent = nb(S.stock[type]); st.classList.remove('pop'); void st.offsetWidth; st.classList.add('pop'); }
      b.setAttribute('aria-label', tr('aria.algue', { algue: tr('algue.' + type), n: S.stock[type] }));
      b.setAttribute('aria-pressed', S.choix === type ? 'true' : 'false');
    });
    const oe = $('o-etoiles');
    oe.innerHTML = SVG.etoileMer + '<span></span>';
    oe.lastChild.textContent = tr('outil.etoiles', { n: S.etoilesMer });
    oe.setAttribute('aria-label', tr('aria.etoiles', { n: S.etoilesMer }));
    const bp = $('b-poissons');
    bp.disabled = S.attentePoissons > 0;
    $('poissons-attente').style.height = (S.attentePoissons > 0 ? (S.attentePoissons / 14) * 100 : 0) + '%';
    bp.classList.toggle('appel', S.attentePoissons <= 0 && S.trouble > 0.35);
  }

  /* ---------------- Barre du haut ---------------- */
  function majHud() {
    if (!S) return;
    $('h-score').textContent = nb(Math.round(S.scoreAffiche || 0));
    const r = Math.max(0, Math.ceil(S.restant));
    $('h-temps').textContent = tr('hud.temps', { m: Math.floor(r / 60), s: String(r % 60).padStart(2, '0') });
    $('h-temps').classList.toggle('urgent', r <= 10);
    $('h-temps-barre').style.width = clamp(S.restant / S.L.t, 0, 1) * 100 + '%';
    const b = seuils(S.L.c);
    $('h-cmd').textContent = tr('hud.commandes', { n: S.livrees, total: S.L.c, min: b[0] });
  }
  function seuils(c) { return [Math.ceil(c * 0.6), Math.ceil(c * 0.8), c]; }
  function gagner(n, source) {
    S.score += n;
    if (S.scoreAffiche === undefined) S.scoreAffiche = 0;
    const cible = $('h-coq').getBoundingClientRect(), ra = app.getBoundingClientRect();
    let x = S.plongeuse.x, y = S.plongeuse.y;
    if (source && source.getBoundingClientRect) { const r = source.getBoundingClientRect(); x = r.left - ra.left + r.width / 2; y = r.top - ra.top + r.height / 2; }
    else if (source && typeof source.x === 'number') { x = source.x; y = source.y; }
    const nbCoq = Math.min(8, 2 + Math.floor(n / 4));
    for (let i = 0; i < nbCoq; i++) {
      S.particules.push({ k: 'coq', x, y, tx: cible.left - ra.left + 18, ty: cible.top - ra.top + 16, t: -i * 0.06, d: 0.7, v: n / nbCoq });
    }
  }

  /* ---------------- Actions du joueur ---------------- */
  function placeA(x, y) {
    if (!S) return null;
    for (let r = 0; r < S.cordes.length; r++) {
      const yc = yCorde(S, r);
      if (y < yc - G.haut - 10 || y > yc + 18) continue;
      const s = Math.floor((x - G.xL) / G.pw);
      if (s >= 0 && s < PLACES) return { r, s };
    }
    return null;
  }
  function viserPlongeuse(x, y) { const p = S.plongeuse; p.dir = x >= p.x ? 1 : -1; p.tx = x; p.ty = y + 26; }
  function oursinA(x, y) {
    let best = null, bd = 34 * G.s;
    S.oursins.forEach((o) => { if (o.fuit) return; const d = Math.hypot(o.x - x, o.y - y); if (d < bd) { bd = d; best = o; } });
    return best;
  }
  function animalA(x, y) { return S.animaux.find((a) => !a.vu && Math.abs(a.x - x) < 40 * G.s && Math.abs(a.y - y) < 30 * G.s) || null; }

  function toucher(x, y) {
    if (!S || S.fini || S.pause || S.tuto) return;
    const a = animalA(x, y);
    if (a) { decouvrirAnimal(a); return; }
    const o = oursinA(x, y);
    if (o) { lancerEtoile(o); return; }
    const p = placeA(x, y);
    if (p) actionPlace(p.r, p.s);
  }
  function actionPlace(r, s) {
    const c = S.cordes[r];
    const x = xPlace(s), y = yCorde(S, r);
    viserPlongeuse(x, y);
    if (c.noeuds[s]) {
      c.noeuds[s] = false; son('noeud');
      bulles(x, y, 6);
      if (!c.noeuds.some(Boolean)) { toast('msg.demele'); etincelles(x, y, '#ffffff', 10); }
      return;
    }
    if (c.noeuds.some(Boolean)) { toast('msg.emmelee'); son('erreur'); return; }
    // Un oursin sur cette place ? on le chasse.
    const o = S.oursins.find((u) => !u.fuit && u.r === r && Math.abs(u.pos - s) < 0.6);
    if (o) { lancerEtoile(o); return; }
    const pl = c.places[s];
    if (!pl) {
      c.places[s] = nouvellePlante(S.choix);
      son('planter'); bulles(x, y, 8);
      return;
    }
    if (pl.g >= 1) { recolter(r, s); return; }
    pl.secoue = 0.3; son('erreur'); toast('msg.pasMure');
  }
  function recolter(r, s) {
    const c = S.cordes[r], pl = c.places[s];
    if (!pl || pl.g < 1 || c.noeuds.some(Boolean)) return false;
    c.places[s] = null;
    S.stock[pl.type]++;
    const x = xPlace(s), y = yCorde(S, r);
    etincelles(x, y - G.haut * 0.5, TYPES[pl.type].c1, 12);
    son('recolte');
    if (!P.album[pl.type]) decouvrir(pl.type);
    majOutils(); majCommandes();
    return true;
  }
  function lancerEtoile(o) {
    if (S.etoilesMer <= 0) { toast('msg.plusEtoile'); son('erreur'); return; }
    S.etoilesMer--;
    viserPlongeuse(o.x, o.y);
    S.projectiles.push({ x: S.plongeuse.x, y: S.plongeuse.y, cible: o, t: 0 });
    o.vise = true;
    if (!P.album.etoile) decouvrir('etoile');
    majOutils();
  }
  function appelerPoissons() {
    if (!S || S.fini || S.pause || S.tuto || !S.L.trouble) return;
    if (S.attentePoissons > 0) { son('erreur'); return; }
    S.attentePoissons = 14; S.poissons = 4;
    S.banc = [];
    const dir = Math.random() < 0.5 ? 1 : -1;
    for (let i = 0; i < 9; i++) S.banc.push({ x: dir > 0 ? -40 - i * 22 : W + 40 + i * 22, y: G.surface + G.prof * hasard(0.15, 0.85), dir, ph: Math.random() * 6, coul: i % 2 });
    son('poissons');
    if (!P.album.nettoyeur) decouvrir('nettoyeur');
    majOutils();
  }
  function decouvrir(id) {
    P.album[id] = 1;
    son('decouverte');
    toast('msg.decouverte', { nom: tr('espece.' + id) });
  }
  function decouvrirAnimal(a) {
    a.vu = true;
    etincelles(a.x, a.y, '#fff6a0', 16);
    gagner(3, { x: a.x, y: a.y });
    if (!P.album[a.id]) decouvrir(a.id); else son('etoile');
  }

  /* ---------------- Glisser pour récolter ---------------- */
  let doigt = null;
  function posEvt(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  cv.addEventListener('pointerdown', (e) => {
    if (mode !== 'jeu') return;
    const p = posEvt(e);
    doigt = { x0: p.x, y0: p.y, x: p.x, y: p.y, glisse: false, id: e.pointerId, recoltes: 0 };
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
    S.curseur.vu = false;
  });
  cv.addEventListener('pointermove', (e) => {
    if (!doigt || doigt.id !== e.pointerId || !S || S.fini || S.pause || S.tuto) return;
    const p = posEvt(e);
    if (Math.hypot(p.x - doigt.x0, p.y - doigt.y0) > 12) doigt.glisse = true;
    if (doigt.glisse) {
      const d = Math.hypot(p.x - doigt.x, p.y - doigt.y), n = Math.max(1, Math.ceil(d / 8));
      for (let i = 1; i <= n; i++) {
        const x = doigt.x + (p.x - doigt.x) * i / n, y = doigt.y + (p.y - doigt.y) * i / n;
        const pl = placeA(x, y);
        if (pl && S.cordes[pl.r].places[pl.s] && S.cordes[pl.r].places[pl.s].g >= 1) {
          if (recolter(pl.r, pl.s)) { doigt.recoltes++; viserPlongeuse(x, y); }
        }
      }
      S.particules.push({ k: 'trace', x: p.x, y: p.y, t: 0, d: 0.35 });
    }
    doigt.x = p.x; doigt.y = p.y;
  });
  function finDoigt(e) {
    if (!doigt || doigt.id !== e.pointerId) return;
    const d = doigt; doigt = null;
    if (!S) return;
    if (S.tuto) return;
    if (!d.glisse) toucher(d.x0, d.y0);
  }
  cv.addEventListener('pointerup', finDoigt);
  cv.addEventListener('pointercancel', () => { doigt = null; });

  /* ---------------- Boucle principale ---------------- */
  function maj(dt) {
    if (!S || S.pause || S.tuto) return;
    if (S.fini) { S.depart += dt; return; }
    const L = S.L;
    S.temps += dt; S.restant -= dt;
    // Pousse des algues.
    for (let r = 0; r < S.cordes.length; r++) {
      const c = S.cordes[r];
      const bloque = c.noeuds.some(Boolean);
      const lum = lumiere(S, r);
      for (let s = 0; s < PLACES; s++) {
        const pl = c.places[s];
        if (!pl) continue;
        if (pl.secoue > 0) pl.secoue -= dt;
        if (bloque) continue;
        if (pl.g < 1) {
          const T = TYPES[pl.type];
          pl.g = Math.min(1, pl.g + dt * T.f(lum) / T.base);
          if (pl.g >= 1) { pl.mur = L.mur; etincelles(xPlace(s), yCorde(S, r) - G.haut * 0.7, '#ffffff', 5); }
        } else {
          if (pl.mur === null) pl.mur = L.mur;
          pl.mur -= dt;
          if (pl.mur <= 0) {
            c.places[s] = null;
            S.particules.push({ k: 'derive', type: pl.type, x: xPlace(s), y: yCorde(S, r), t: 0, d: 2.2 });
            son('detache'); toast('msg.detachee');
          }
        }
      }
    }
    // Oursins.
    if (L.oursin) {
      S.prochainOursin -= dt;
      if (S.prochainOursin <= 0) {
        S.prochainOursin = L.oursin * hasard(0.8, 1.2);
        const r = entier(0, S.cordes.length - 1), dir = Math.random() < 0.5 ? 1 : -1;
        S.oursins.push({ r, pos: dir > 0 ? -0.6 : PLACES - 0.4, dir, mange: 0, x: 0, y: 0, fuit: false, vy: 0, a: 1 });
        if (!P.album.oursin) decouvrir('oursin');
        if (!P.tutos.oursin) { S.tutoOursin = true; }
      }
      S.recharge += dt;
      if (S.etoilesMer < 3 && S.recharge >= 10) { S.etoilesMer++; S.recharge = 0; majOutils(); }
      if (S.etoilesMer >= 3) S.recharge = 0;
    }
    S.oursins.forEach((o) => {
      if (o.fuit) { o.vy += dt * 300; o.y += o.vy * dt; o.x += o.dir * -60 * dt; o.a -= dt * 1.2; return; }
      const c = S.cordes[o.r];
      const s = Math.round(o.pos);
      const pl = s >= 0 && s < PLACES ? c.places[s] : null;
      if (pl && Math.abs(o.pos - s) < 0.08) {
        o.mange += dt;
        if (Math.floor(o.mange * 4) !== Math.floor((o.mange - dt) * 4)) son('croc');
        pl.secoue = 0.2;
        if (o.mange >= 1.8) { c.places[s] = null; o.mange = 0; o.pos += o.dir * 0.1; bulles(xPlace(s), yCorde(S, o.r), 6); toast('msg.mangee'); }
      } else {
        o.pos += o.dir * L.vit * dt;
      }
      o.x = G.xL + (o.pos + 0.5) * G.pw; o.y = yCorde(S, o.r) - 9 * G.s;
    });
    S.oursins = S.oursins.filter((o) => (o.fuit ? o.a > 0 : o.pos > -1 && o.pos < PLACES));
    // Étoiles de mer lancées.
    S.projectiles.forEach((p) => {
      p.t += dt * 2.6;
      const o = p.cible;
      if (p.t >= 1 && !o.fuit) { o.fuit = true; o.vy = -120; son('fuite'); etincelles(o.x, o.y, '#ff9a4a', 10); }
    });
    S.projectiles = S.projectiles.filter((p) => p.t < 1.2);
    // Tempêtes.
    if (L.tempete) {
      if (S.alerte > 0) {
        S.alerte -= dt;
        if (S.alerte <= 0) {
          $('alerte').classList.add('cache');
          const libres = S.cordes.map((c, i) => i).filter((i) => !S.cordes[i].noeuds.some(Boolean));
          const combien = Math.min(libres.length, S.n >= 14 ? 2 : 1);
          libres.sort(() => Math.random() - 0.5);
          for (let k = 0; k < combien; k++) {
            const c = S.cordes[libres[k]];
            const ids = [0, 1, 2, 3, 4].sort(() => Math.random() - 0.5).slice(0, 3);
            ids.forEach((s) => { c.noeuds[s] = true; });
          }
          S.secousse = 0.5;
          if (!P.tutos.tempete && combien) S.tutoTempete = libres[0];
        }
      } else {
        S.prochaineTempete -= dt;
        if (S.prochaineTempete <= 0) {
          S.prochaineTempete = L.tempete * hasard(0.85, 1.15);
          S.alerte = 3; S.tempetes++;
          $('alerte').classList.remove('cache');
          son('tempete');
        }
      }
    }
    // Eau trouble et poissons nettoyeurs.
    if (L.trouble) {
      if (S.poissons > 0) { S.poissons -= dt; S.trouble = Math.max(0, S.trouble - 0.32 * dt); }
      else S.trouble = Math.min(1, S.trouble + L.trouble * dt);
      if (S.attentePoissons > 0) { S.attentePoissons = Math.max(0, S.attentePoissons - dt); }
      if (S.trouble > 0.3 && !P.tutos.trouble) S.tutoTrouble = true;
      if (Math.random() < dt * 4) majOutils();
    }
    S.banc.forEach((f) => { f.x += f.dir * 170 * dt; f.ph += dt * 8; });
    S.banc = S.banc.filter((f) => (f.dir > 0 ? f.x < W + 260 : f.x > -260));
    // Commandes urgentes.
    let changeCmd = false;
    S.commandes.forEach((cmd, i) => {
      if (!cmd.urgent || cmd.livree) return;
      if (!P.tutos.urgent) S.tutoUrgent = true;
      // Livraison dans l'ordre : le sablier attend que la commande soit la première.
      if (S.L.ordre && i !== 0) return;
      cmd.sablier -= dt;
      if (cmd.sablier <= 0) {
        // Remplacée par une commande ordinaire.
        cmd.urgent = false; cmd.val = Math.round(cmd.val / 2); changeCmd = true;
        toast('msg.urgenteRatee');
      }
    });
    if (changeCmd) majCommandes(); else majSabliers();
    // Animaux du coin.
    S.prochainAnimal -= dt;
    if (S.prochainAnimal <= 0) {
      S.prochainAnimal = hasard(22, 36);
      const id = choisir(ZONE_ANIMAUX[L.z]);
      const dir = Math.random() < 0.5 ? 1 : -1;
      const fond = id === 'crabe' || id === 'bernard';
      const y = id === 'dauphin' ? G.surface + G.prof * 0.07 : (fond ? G.fond - 16 * G.s : G.surface + G.prof * hasard(0.88, 0.95));
      S.animaux.push({ id, x: dir > 0 ? -50 : W + 50, y, dir, v: fond ? 26 : 48, vu: false, t: 0 });
    }
    S.animaux.forEach((a) => { a.x += a.dir * a.v * dt; a.t += dt; });
    S.animaux = S.animaux.filter((a) => a.x > -80 && a.x < W + 80);
    // Fin du temps.
    const r = Math.ceil(S.restant);
    if (r <= 10 && r !== S.dernierTic && r > 0) { S.dernierTic = r; son('tic'); }
    if (S.restant <= 0) { S.restant = 0; finNiveau(); }
    // Démonstrations déclenchées par un évènement.
    if (S.tutoOursin && S.oursins.length) { S.tutoOursin = false; montrerTuto('oursin'); }
    else if (S.tutoTempete !== undefined && S.tutoTempete !== null) { const r2 = S.tutoTempete; S.tutoTempete = null; montrerTuto('tempete', r2); }
    else if (S.tutoTrouble) { S.tutoTrouble = false; montrerTuto('trouble'); }
    else if (S.tutoUrgent) { S.tutoUrgent = false; montrerTuto('urgent'); }
  }

  function majCommun(dt) {
    if (!S) return;
    if (!S.pause) {
      // Plongeuse.
      const p = S.plongeuse;
      p.x += (p.tx - p.x) * Math.min(1, dt * 4); p.y += (p.ty - p.y) * Math.min(1, dt * 4);
      p.y = clamp(p.y, G.surface + 14, G.fond - 14);
      // Compteur de coquillages qui défile.
      if (S.scoreAffiche === undefined) S.scoreAffiche = 0;
      // Particules.
      S.particules.forEach((q) => {
        q.t += dt;
        if (q.k === 'coq' && q.t >= q.d && !q.fait) { q.fait = true; S.scoreAffiche += q.v; const el = $('h-coq'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
        if (q.vx !== undefined) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.g || 0) * dt; }
      });
      S.particules = S.particules.filter((q) => q.t < q.d + (q.k === 'coq' ? 0.05 : 0));
      if (S.secousse > 0) S.secousse -= dt;
    }
  }

  /* ---------------- Effets ---------------- */
  function etincelles(x, y, coul, n) {
    if (!S) return;
    for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = hasard(40, 140); S.particules.push({ k: 'etin', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 60, t: 0, d: hasard(0.4, 0.8), coul }); }
  }
  function bulles(x, y, n) {
    if (!S) return;
    for (let i = 0; i < n; i++) S.particules.push({ k: 'bulle', x: x + hasard(-12, 12), y: y + hasard(-6, 6), vx: hasard(-10, 10), vy: hasard(-90, -40), t: 0, d: hasard(0.6, 1.2), r: hasard(2, 5) });
  }
  function confettis(x, y, n) {
    if (!S) return;
    const coul = ['#ffd45a', '#7be05a', '#ff8fa3', '#7fd8ff', '#ffffff'];
    for (let i = 0; i < n; i++) { const a = hasard(-2.8, -0.3), v = hasard(120, 260); S.particules.push({ k: 'conf', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 380, t: 0, d: hasard(0.9, 1.6), coul: choisir(coul), rot: Math.random() * 6 }); }
  }

  /* ---------------- Dessin ---------------- */
  function frond(c, x, y, len, w, ang, sway, col1, col2) {
    const n = 9, Lp = [], Rp = [];
    for (let i = 0; i <= n; i++) {
      const s = i / n;
      const bx = x + Math.sin(ang) * len * s + sway * s * s;
      const by = y - Math.cos(ang) * len * s;
      const ww = w * (0.35 + 0.65 * Math.sin(Math.PI * Math.min(1, 0.15 + s * 0.85))) * (1 - s * 0.55);
      Lp.push([bx - ww / 2, by]); Rp.push([bx + ww / 2, by]);
    }
    const g = c.createLinearGradient(x, y, x, y - len);
    g.addColorStop(0, col2); g.addColorStop(1, col1);
    c.fillStyle = g;
    c.beginPath(); c.moveTo(Lp[0][0], Lp[0][1]);
    Lp.forEach((p) => c.lineTo(p[0], p[1]));
    for (let i = Rp.length - 1; i >= 0; i--) c.lineTo(Rp[i][0], Rp[i][1]);
    c.closePath(); c.fill();
    c.strokeStyle = col2; c.lineWidth = 1; c.globalAlpha *= 0.6;
    c.beginPath(); c.moveTo(x, y);
    for (let i = 1; i <= n; i++) { const s = i / n; c.lineTo(x + Math.sin(ang) * len * s + sway * s * s, y - Math.cos(ang) * len * s); }
    c.stroke(); c.globalAlpha /= 0.6;
  }
  function dessinerAlgue(c, type, x, y, h, t, s) {
    const T = TYPES[type];
    const sw = Math.sin(t * 1.6 + x * 0.05) * h * 0.18;
    if (type === 'verte') {
      frond(c, x - 4 * s, y, h * 0.82, 10 * s, -0.22, sw, T.c1, T.c2);
      frond(c, x + 4 * s, y, h * 0.7, 9 * s, 0.25, sw * 1.1, T.c1, T.c2);
      frond(c, x, y, h, 11 * s, 0, sw * 0.9, T.c1, T.c2);
    } else if (type === 'rouge') {
      c.strokeStyle = T.c2; c.lineCap = 'round';
      const br = [[-0.45, 0.75], [0.1, 1], [0.5, 0.8], [-0.15, 0.55], [0.3, 0.5]];
      br.forEach((b, i) => {
        const len = h * b[1], ang = b[0];
        const tx = x + Math.sin(ang) * len + sw * b[1], ty = y - Math.cos(ang) * len;
        c.lineWidth = 3.2 * s; c.beginPath(); c.moveTo(x, y);
        c.quadraticCurveTo(x + Math.sin(ang) * len * 0.3, y - len * 0.6, tx, ty); c.stroke();
        c.fillStyle = i % 2 ? T.c1 : '#ff6f88';
        c.beginPath(); c.arc(tx, ty, (4 + (i % 3)) * s, 0, 6.29); c.fill();
        c.beginPath(); c.arc((x + tx) / 2 + sw * 0.2, (y + ty) / 2, 2.8 * s, 0, 6.29); c.fill();
      });
    } else {
      [-0.6, -0.3, 0, 0.3, 0.6].forEach((a, i) => frond(c, x, y, h * (i === 2 ? 1 : 0.82), 9 * s, a, sw * 0.7, T.c1, T.c2));

    // Bouées et lignes d'ancrage.
    const yb = G.surface;
    [G.xL - 6, G.xR + 6].forEach((x) => {
      c.strokeStyle = '#e8e0c8aa'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(x, yb); c.lineTo(x, yCorde(E, E.cordes.length - 1)); c.stroke();
    });
    // Cordes.
    E.cordes.forEach((cd, r) => {
      const y = yCorde(E, r), lum = lumiere(E, r);
      const emmelee = cd.noeuds.some(Boolean);
      // Indicateur de lumière (petit soleil).
      const sx = G.xL - 26 * s;
      c.fillStyle = `rgba(255, ${Math.round(200 + 55 * lum)}, 90, ${0.25 + 0.75 * lum})`;
      c.beginPath(); c.arc(sx, y, 7 * s, 0, 6.29); c.fill();
      c.strokeStyle = `rgba(255,240,150,${lum})`; c.lineWidth = 2;
      for (let i = 0; i < 8; i++) { const a = i * 0.785; c.beginPath(); c.moveTo(sx + Math.cos(a) * 9 * s, y + Math.sin(a) * 9 * s); c.lineTo(sx + Math.cos(a) * (9 + 4 * lum) * s, y + Math.sin(a) * (9 + 4 * lum) * s); c.stroke(); }
      // La corde.
      c.strokeStyle = emmelee ? '#8a6a3a' : '#e8d8a8'; c.lineWidth = 3.5 * s;
      c.beginPath();
      for (let x = G.xL - 6; x <= G.xR + 6; x += 8) {
        const ond = emmelee ? Math.sin(x * 0.25 + t * 6) * 4 : Math.sin(x * 0.03 + t) * 1.5;
        c.lineTo(x, y + ond);
      }
      c.stroke();
      // Petits flotteurs aux deux bouts.
      dessinerBouee(c, G.xL - 6, y, 7 * s, P.bouee, t);
      dessinerBouee(c, G.xR + 6, y, 7 * s, P.bouee, t + 1);
      // Algues.
      for (let p = 0; p < PLACES; p++) {
        const x = xPlace(p), pl = cd.places[p];
        if (pl) {
          let h = G.haut * (0.22 + 0.78 * pl.g);
          let dx = pl.secoue > 0 ? Math.sin(t * 60) * 3 : 0;
          c.save();
          if (pl.g >= 1) {
            const fin = pl.mur !== null && pl.mur < 3;
            if (fin && Math.floor(t * 6) % 2 === 0) c.globalAlpha = 0.45;
            const pulse = 0.6 + 0.4 * Math.sin(t * 5);
            const gg = c.createRadialGradient(x, y - h * 0.55, 2, x, y - h * 0.55, h * 0.7);
            gg.addColorStop(0, `rgba(255,255,210,${0.55 * pulse})`); gg.addColorStop(1, 'rgba(255,255,210,0)');
            c.fillStyle = gg; c.beginPath(); c.arc(x, y - h * 0.55, h * 0.7, 0, 6.29); c.fill();
            if (fin) dx += Math.sin(t * 9) * 2;
          } else if (lum < 0.25 || emmelee) c.globalAlpha = 0.75;
          dessinerAlgue(c, pl.type, x + dx, y, h, t, s * (0.6 + 0.4 * pl.g));
          // Anneau de pousse.
          if (pl.g < 1) {
            c.globalAlpha = 1;
            c.strokeStyle = '#ffffff99'; c.lineWidth = 3; c.beginPath(); c.arc(x, y + 11 * s, 5 * s, -Math.PI / 2, -Math.PI / 2 + pl.g * 6.28); c.stroke();
          }
          c.restore();
        } else if (!emmelee) {
          c.fillStyle = '#ffffff40'; c.beginPath(); c.arc(x, y, 4 * s, 0, 6.29); c.fill();
        }
        // Nœuds de la tempête.
        if (cd.noeuds[p]) {
          c.save(); c.translate(x, y);
          c.strokeStyle = '#6a4a1a'; c.lineWidth = 4 * s;
          for (let k = 0; k < 3; k++) { c.beginPath(); c.ellipse(0, 0, 11 * s, 6 * s, k * 1.05 + t, 0, 6.29); c.stroke(); }
          c.fillStyle = '#ffe46b'; c.globalAlpha = 0.5 + 0.5 * Math.sin(t * 6); c.beginPath(); c.arc(0, 0, 4 * s, 0, 6.29); c.fill();
          c.restore();
        }
      }
      if (curseur && curseur.vu && curseur.r === r) {
        c.save(); c.strokeStyle = '#ffe46b'; c.lineWidth = 3; c.setLineDash([6, 4]);
        const x = xPlace(curseur.s);
        c.strokeRect(x - G.pw / 2 + 3, y - G.haut - 6, G.pw - 6, G.haut + 22);
        c.restore();
      }
    });
  }
  function dessinerJeu(t) {
    const c = ctx;
    c.save();
    if (S.secousse > 0) c.translate(Math.sin(t * 50) * 4 * S.secousse, 0);
    dessinerDecor(S, t);
    S.animaux.forEach((a) => {
      if (a.vu) { c.save(); c.globalAlpha = 0.6; }
      dessinerAnimal(c, a.id, a.x, a.y, G.s, a.t, a.dir);
      if (a.vu) c.restore();
      else { c.fillStyle = '#ffffffaa'; c.beginPath(); c.arc(a.x + 10, a.y - 26 * G.s, 3 + Math.sin(t * 6), 0, 6.29); c.fill(); }
    });
    // Bateau du port.
    const bx = W * 0.62 + (S.fini ? S.depart * S.depart * 140 : 0);
    dessinerBateau(c, bx, G.surface - 4, G.s * 0.8, P.bateau, t);
    dessinerSurface(t);
    dessinerFerme(S, t, S.curseur);
    S.oursins.forEach((o) => { c.save(); c.globalAlpha = clamp(o.a, 0, 1); dessinerOursin(c, o.x, o.y, G.s, t, o.mange > 0); c.restore(); });
    S.banc.forEach((f) => dessinerPoisson(c, f.x, f.y + Math.sin(f.ph) * 4, G.s, f.dir, f.ph, f.coul));
    const p = S.plongeuse;
    dessinerPlongeuse(c, p.x, p.y, G.s, p.dir, t, Math.hypot(p.tx - p.x, p.ty - p.y) > 4);
    S.projectiles.forEach((q) => {
      const o = q.cible, k = Math.min(1, q.t);
      const x = q.x + (o.x - q.x) * k, y = q.y + (o.y - q.y) * k - Math.sin(k * Math.PI) * 40;
      dessinerEtoileMer(c, x, y, 9 * G.s, q.t * 10);
    });
    // Eau trouble.
    if (S.trouble > 0) {
      c.fillStyle = `rgba(110, 120, 60, ${S.trouble * 0.42})`; c.fillRect(0, G.surface, W, G.fond - G.surface);
      c.fillStyle = `rgba(200, 190, 140, ${S.trouble * 0.6})`;
      for (let i = 0; i < 40; i++) { const x = (i * 53.7 + t * 8 * (i % 3 + 1)) % W, y = G.surface + ((i * 97.3 + t * 5) % (G.fond - G.surface)); c.fillRect(x, y, 2.5, 2.5); }
    }
    // Tempête qui approche.
    if (S.alerte > 0) {
      c.fillStyle = 'rgba(30, 20, 60, 0.28)'; c.fillRect(0, 0, W, H);
      c.strokeStyle = '#ffffff55'; c.lineWidth = 1.5;
      for (let i = 0; i < 30; i++) { const x = (i * 37 + t * 400) % W, y = (i * 61 + t * 700) % G.surface; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 6, y + 14); c.stroke(); }
    }
    c.restore();
    dessinerParticules(t);
  }
  function dessinerParticules() {
    const c = ctx;
    S.particules.forEach((q) => {
      const k = clamp(q.t / q.d, 0, 1);
      if (q.t < 0) return;
      c.save();
      if (q.k === 'etin') { c.globalAlpha = 1 - k; c.fillStyle = q.coul; c.beginPath(); c.arc(q.x, q.y, 3 * (1 - k) + 1, 0, 6.29); c.fill(); }
      else if (q.k === 'bulle') { c.globalAlpha = 1 - k; c.strokeStyle = '#ffffff'; c.lineWidth = 1.5; c.beginPath(); c.arc(q.x, q.y, q.r, 0, 6.29); c.stroke(); }
      else if (q.k === 'conf') { c.globalAlpha = 1 - k * k; c.fillStyle = q.coul; c.translate(q.x, q.y); c.rotate(q.rot + q.t * 8); c.fillRect(-4, -2, 8, 4); }
      else if (q.k === 'trace') { c.globalAlpha = 0.5 * (1 - k); c.fillStyle = '#ffffff'; c.beginPath(); c.arc(q.x, q.y, 9 * (1 - k), 0, 6.29); c.fill(); }
      else if (q.k === 'derive') { c.globalAlpha = 1 - k; dessinerAlgue(c, q.type, q.x + k * 30, q.y - k * 120, G.haut * 0.9, q.t * 3, G.s); }
      else if (q.k === 'coq') {
        const e = k * k * (3 - 2 * k);
        const x = q.x + (q.tx - q.x) * e, y = q.y + (q.ty - q.y) * e - Math.sin(k * Math.PI) * 50;
        c.translate(x, y); c.rotate(k * 6);
        c.fillStyle = '#ffd2b0'; c.strokeStyle = '#c46a3a'; c.lineWidth = 1.2;
        c.beginPath(); c.moveTo(0, 7); c.lineTo(-7, -2); c.quadraticCurveTo(0, -10, 7, -2); c.closePath(); c.fill(); c.stroke();
      }
      c.restore();
    });
  }

  /* Décor de l'écran titre (sert aussi de jaquette). */
  const deco = {
    L: { z: 'baie', k: 3, maree: 0 }, temps: 0, trouble: 0,
    cordes: [nouvelleCorde(0.17), nouvelleCorde(0.37), nouvelleCorde(0.57)],
  };
  [['verte', 'doree', 'verte', 'doree', 'verte'], ['rouge', 'verte', 'rouge', 'verte', 'rouge'], ['rouge', 'rouge', null, 'rouge', 'rouge']].forEach((ligne, r) => {
    ligne.forEach((type, s) => { if (type) deco.cordes[r].places[s] = nouvellePlante(type, (s + r) % 3 === 0 ? 0.6 : 1); });
  });
  function dessinerTitre(t) {
    const sauve = { surface: G.surface, fond: G.fond };
    dessinerDecor(deco, t);
    dessinerBateau(ctx, W * 0.6, G.surface - 4, G.s * 0.95, P.bateau, t);
    dessinerSurface(t);
    dessinerAnimal(ctx, 'tortue', ((t * 22) % (W + 160)) - 80, G.surface + G.prof * 0.9, G.s, t, 1);
    dessinerFerme(deco, t, null);
    dessinerPoisson(ctx, W * 0.2 + Math.sin(t * 0.7) * 30, G.surface + G.prof * 0.38, G.s, 1, t * 8, 0);
    dessinerPoisson(ctx, W * 0.8 + Math.sin(t * 0.6) * 30, G.surface + G.prof * 0.64, G.s, -1, t * 8, 1);
    dessinerEtoileMer(ctx, W * 0.15, G.fond - 30, 12 * G.s, 0.3);
    dessinerPlongeuse(ctx, W * 0.5 + Math.sin(t * 0.8) * 24, G.surface + G.prof * 0.27 + Math.sin(t * 1.3) * 6, G.s * 1.25, Math.cos(t * 0.8) >= 0 ? 1 : -1, t, true);
    G.surface = sauve.surface; G.fond = sauve.fond;
  }

  let precedent = 0, horloge = 0;
  function boucle(ms) {
    const dt = Math.min(0.05, (ms - precedent) / 1000 || 0);
    precedent = ms;
    horloge += dt;
    if (S && mode === 'jeu') {
      maj(dt);
      majCommun(dt);
      dessinerJeu(horloge);
      if (Math.floor(horloge * 8) !== Math.floor((horloge - dt) * 8)) majHud();
    } else {

      dessinerTitre(horloge);

    if (tutoActif) animerMain(horloge);
