  }

  /* ---------------- Tutoriel animé ---------------- */
  let tutoActif = null;
  function centreEl(el) { const r = el.getBoundingClientRect(), ra = app.getBoundingClientRect(); return { x: r.left - ra.left + r.width / 2, y: r.top - ra.top + r.height / 2 }; }
  const placeXY = (r, s) => ({ x: xPlace(s), y: yCorde(S, r) - G.haut * 0.4 });
  const boutonAlgue = (type) => document.querySelector(`.algue-b[data-type="${type}"]`);
  function etapesTuto(cle, arg) {
    const derniere = S.cordes.length - 1;
    switch (cle) {
      case 'base': return [
        { txt: 'tuto.planter', a: () => placeXY(1, 1), geste: 'tap' },
        { txt: 'tuto.recolter', a: () => placeXY(0, 2.6), b: () => placeXY(0, 4.4), geste: 'glisse' },
        { txt: 'tuto.livrer', a: () => centreEl($('commandes').children[0]), geste: 'tap' },
      ];
      case 'detache': return [{ txt: 'tuto.detache', a: () => placeXY(0, 2), geste: 'tap' }, { txt: 'tuto.soleil', a: () => ({ x: G.xL - 26 * G.s, y: yCorde(S, 0) }), geste: 'tap' }];
      case 'rouge': return [{ txt: 'tuto.rouge', a: () => centreEl(boutonAlgue('rouge')), b: () => placeXY(derniere, 2), geste: 'deux' }];
      case 'melange': return [{ txt: 'tuto.melange', a: () => centreEl($('commandes').children[0]), geste: 'tap' }];
      case 'maree': return [{ txt: 'tuto.maree', a: () => placeXY(0, 2), geste: 'hautbas' }];
      case 'oursin': { const o = S.oursins[0]; return [{ txt: 'tuto.oursin', a: () => ({ x: o.x, y: o.y }), geste: 'tap' }]; }
      case 'doree': return [{ txt: 'tuto.doree', a: () => centreEl(boutonAlgue('doree')), b: () => placeXY(0, 2), geste: 'deux' }];
      case 'tempete': { const c = S.cordes[arg] || S.cordes[0]; const s = Math.max(0, c.noeuds.indexOf(true)); return [{ txt: 'tuto.tempete', a: () => ({ x: xPlace(s), y: yCorde(S, arg || 0) }), geste: 'tap' }]; }
      case 'trouble': return [{ txt: 'tuto.trouble', a: () => centreEl($('b-poissons')), geste: 'tap' }];
      case 'ordre': return [{ txt: 'tuto.ordre', a: () => centreEl($('commandes').children[0]), geste: 'tap' }];
      case 'grandmaree': return [{ txt: 'tuto.grandmaree', a: () => placeXY(0, 2), geste: 'hautbas' }];
      case 'urgent': { const i = Math.max(0, S.commandes.findIndex((c) => c.urgent)); return [{ txt: 'tuto.urgent', a: () => centreEl($('commandes').children[i]), geste: 'tap' }]; }

    return [];
  }
  function montrerTuto(cle, arg) {

    const etapes = etapesTuto(cle, arg);
    if (!etapes.length) return;
    P.tutos[cle] = 1;
    S.tuto = cle;
    tutoActif = { etapes, i: 0, t0: horloge };

  }
  function afficherEtape() {

    const a = e.a();
    const bulle = $('tuto-bulle');

  function etapeSuivante() {

    son('clic');
    tutoActif.i++;
    if (tutoActif.i >= tutoActif.etapes.length) {
      tutoActif = null;

  function animerMain(t) {
    const e = tutoActif.etapes[tutoActif.i];

    try { a = e.a(); b = e.b ? e.b() : null; } catch (er) { a = { x: W / 2, y: H / 2 }; }
    if (e.geste === 'glisse' && b) { const u = clamp((k - 0.2) / 0.6, 0, 1); x = a.x + (b.x - a.x) * u; y = a.y + (b.y - a.y) * u; }
    else if (e.geste === 'deux' && b) { const u = k < 0.5 ? 0 : 1; x = u ? b.x : a.x; y = u ? b.y : a.y; }

  /* ---------------- Fin de niveau ---------------- */
  function finNiveau() {
    if (!S || S.fini) return;
    S.fini = true; S.depart = 0;
    enPartie = false;
    $('alerte').classList.add('cache');
    const gagne = S.livrees >= seuils(S.L.c)[0];
    if (S.livrees >= S.L.c && S.restant > 0) { const bonus = Math.floor(S.restant / 4); S.bonus = bonus; S.score += bonus; }

  function montrerFin(gagne) {

    const et = gagne ? (S.livrees >= b[2] ? 3 : S.livrees >= b[1] ? 2 : 1) : 0;
    const ancienRecord = P.records[n] || 0;
    const record = gagne && S.score > ancienRecord;
    const debloques = [];
    if (gagne) {
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
      const avant = totalEtoiles();
      P.etoiles[n] = Math.max(P.etoiles[n] || 0, et);
      if (record) P.records[n] = S.score;
      const apres = totalEtoiles();
      BOUEES.forEach((bo) => { if (bo.etoiles > avant && bo.etoiles <= apres) debloques.push(tr('bouee.' + bo.id)); });
      if (n + 2 > P.debloque) {
        BATEAUX.forEach((ba) => { if (ba.niveau === n + 1) debloques.push(tr('bateau.' + ba.id)); });
        P.debloque = Math.min(NIVEAUX.length, Math.max(P.debloque, n + 2));
      }
      // Fin d'un coin du lagon : ses animaux rejoignent l'album.
      if ((n + 1) % 5 === 0) ZONE_ANIMAUX[S.L.z].forEach((id) => { if (!P.album[id]) { P.album[id] = 1; debloques.push(tr('espece.' + id)); } });
      sauver(Math.min(NIVEAUX.length, n + 2));
      let tous = true;
      for (let i = 0; i < NIVEAUX.length; i++) if (!(P.etoiles[i] > 0)) tous = false;
      if (tous && window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: MAX_ETOILES });
    } else {
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: n + 1 });
      sauver(n + 1);
    }
    const final = gagne && n === NIVEAUX.length - 1;
    $('f-titre').textContent = tr(final ? 'fin.final' : (gagne ? 'fin.gagne' : 'fin.perdu'));
    const fe = $('f-etoiles'); fe.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      fe.insertAdjacentHTML('beforeend', SVG.etoile(i < et));
      const sv = fe.lastChild;
      setTimeout(() => { sv.classList.add(i < et ? 'on' : 'off'); if (i < et) son('etoile'); }, 300 + i * 350);
    }
    const lignes = [
      [tr('fin.commandes'), tr('fin.commandesVal', { n: S.livrees, total: S.L.c })],
      [tr('fin.coquillages'), nb(S.score) + (S.bonus ? ' ' + tr('fin.bonus', { n: S.bonus }) : '')],
    ];
    if (final) {
      lignes.push([tr('fin.totalEtoiles'), tr('fin.surTotal', { n: totalEtoiles(), total: MAX_ETOILES })]);
      lignes.push([tr('fin.album'), tr('fin.surTotal', { n: ALBUM.filter((id) => P.album[id]).length, total: ALBUM.length })]);
      lignes.push([tr('fin.totalCoq'), nb(totalCoquillages())]);
    }
    const fl = $('f-lignes'); fl.innerHTML = '';
    lignes.forEach((l) => { const d = document.createElement('div'); d.className = 'f-ligne'; const a = document.createElement('span'); a.textContent = l[0]; const v = document.createElement('span'); v.textContent = l[1]; d.append(a, v); fl.appendChild(d); });
    $('f-record').textContent = record ? tr('fin.nouveauRecord') : (gagne && ancienRecord ? tr('fin.record', { n: ancienRecord }) : '');
    $('f-debloque').textContent = debloques.length ? tr('fin.debloque', { liste: debloques.join(', ') }) : '';
    $('f-conseil').textContent = gagne ? (et < 3 ? tr('fin.conseil3', { n: S.L.c }) : '') : tr('fin.conseilPerdu', { n: b[0] });
    $('f-suivant').classList.toggle('cache', !gagne || final);
    $('f-reessayer').classList.toggle('cache', gagne);
    $('f-rejouer').classList.toggle('cache', !gagne);
    montrerEcran('ecran-fin');
    setTimeout(() => { const f = gagne && !final ? $('f-suivant') : (gagne ? $('f-rejouer') : $('f-reessayer')); try { f.focus(); } catch (e) { /* rien */ } }, 50);
  }

  /* ---------------- Écrans ---------------- */
  const ECRANS = ['ecran-titre', 'ecran-niveaux', 'ecran-album', 'ecran-atelier', 'ecran-pause', 'ecran-fin'];
  let retourVers = 'ecran-titre';

  function allerAccueil() {
    if (S && enPartie && !S.fini) sauver(S.n + 1);
    S = null; enPartie = false; mode = 'titre';
    tutoActif = null; $('tuto').classList.add('cache'); $('main').classList.add('cache'); $('alerte').classList.add('cache');
    ['hud', 'commandes', 'outils'].forEach((id) => $(id).classList.add('cache'));
    calculerGeo();
    montrerEcran('ecran-titre');
    majEffacer();
  }
  function etatPause() { return !!(S && S.pause); }
  function pause() {
    if (!S || S.fini || S.pause || mode !== 'jeu') return;
    S.pause = true;
    $('alerte').classList.add('cache');
    montrerEcran('ecran-pause');
  }
  function reprendre() {
    if (!S) return;
    S.pause = false;
    if (S.alerte > 0) $('alerte').classList.remove('cache');
    montrerEcran(null);
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  function construireNiveaux() {
    const g = $('grille'); g.innerHTML = '';
    $('niv-compte').textContent = tr('niveaux.compte', { n: totalEtoiles(), total: MAX_ETOILES });
    ['baie', 'recif', 'mangrove', 'large'].forEach((z, iz) => {
      const h = document.createElement('div'); h.className = 'grille-zone'; h.textContent = tr('zone.' + z); g.appendChild(h);
      const gr = document.createElement('div'); gr.className = 'grille';
      for (let i = iz * 5; i < iz * 5 + 5; i++) {
        const b = document.createElement('button'); b.className = 'niv-b';
        const ouvert = i < P.debloque;
        if (!ouvert) { b.classList.add('ferme'); b.innerHTML = SVG.cadenas; b.setAttribute('aria-label', tr('aria.niveauFerme', { n: i + 1 })); b.disabled = true; }
        else {
          if (i === P.debloque - 1 && !(P.etoiles[i] > 0)) b.classList.add('actuel');
          const num = document.createElement('span'); num.textContent = nb(i + 1);
          const et = document.createElement('span'); et.className = 'et';
          for (let k = 0; k < 3; k++) et.insertAdjacentHTML('beforeend', SVG.etoile(k < (P.etoiles[i] || 0)));
          b.append(num, et);
          b.setAttribute('aria-label', tr('aria.niveau', { n: i + 1, e: P.etoiles[i] || 0 }));
          b.addEventListener('click', () => { son('clic'); lancerNiveau(i); });
        }
        gr.appendChild(b);
      }
      g.appendChild(gr);
    });
  }
  function miniCanvas(dessin, w, h) {
    const c = document.createElement('canvas');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = w * dpr; c.height = h * dpr;
    const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
    dessin(x, w, h);
    return c;
  }
  function construireAlbum() {
    const box = $('liste-album'); box.innerHTML = '';
    const vus = ALBUM.filter((id) => P.album[id]).length;
    $('album-compte').textContent = tr('album.compte', { n: vus, total: ALBUM.length });
    ALBUM.forEach((id) => {
      const f = document.createElement('div'); f.className = 'fiche' + (P.album[id] ? '' : ' inconnue');
      f.appendChild(miniCanvas((c, w, h) => {
        if (TYPES[id]) dessinerAlgue(c, id, w / 2, h - 6, h * 0.8, 0.5, 1);
        else if (id === 'oursin') dessinerOursin(c, w / 2, h / 2, 1.8, 0, false);
        else if (id === 'etoile') dessinerEtoileMer(c, w / 2, h / 2, 24, 0.2);
        else if (id === 'nettoyeur') { dessinerPoisson(c, w / 2 - 14, h / 2 - 10, 1.4, 1, 0, 0); dessinerPoisson(c, w / 2 + 12, h / 2 + 12, 1.4, 1, 1, 1); }
        else dessinerAnimal(c, id, w / 2, h / 2 + (id === 'crabe' || id === 'bernard' ? 8 : 0), 1.3, 0.3, 1);
        // Espèce pas encore découverte : seulement sa silhouette.
        if (!P.album[id]) { c.globalCompositeOperation = 'source-atop'; c.fillStyle = '#123a52'; c.fillRect(0, 0, w, h); c.globalCompositeOperation = 'source-over'; }
      }, 118, 70));
      const b = document.createElement('b'); b.textContent = P.album[id] ? tr('espece.' + id) : tr('album.inconnu');
      const p = document.createElement('span'); p.textContent = P.album[id] ? tr('info.' + id) : tr('album.indice.' + id);
      f.append(b, p); box.appendChild(f);
    });
  }
  function construireAtelier() {
    const total = totalEtoiles();
    const lb = $('liste-bouees'); lb.innerHTML = '';
    BOUEES.forEach((bo) => {
      const ouvert = total >= bo.etoiles;
      const b = document.createElement('button');
      b.className = (P.bouee === bo.id ? 'choisi' : '') + (ouvert ? '' : ' ferme');
      b.appendChild(miniCanvas((c, w, h) => dessinerBouee(c, w / 2, h / 2 + 4, 18, bo.id, 0), 100, 56));
      const s = document.createElement('span'); s.textContent = ouvert ? tr('bouee.' + bo.id) : tr('atelier.etoilesRequises', { n: bo.etoiles });
      b.appendChild(s);
      b.setAttribute('aria-pressed', P.bouee === bo.id ? 'true' : 'false');
      if (ouvert) b.addEventListener('click', () => { P.bouee = bo.id; son('clic'); construireAtelier(); sauverChoix(); });
      else b.disabled = true;
      lb.appendChild(b);
    });
    const lt = $('liste-bateaux'); lt.innerHTML = '';
    BATEAUX.forEach((ba) => {
      const ouvert = ba.niveau === 0 || (P.etoiles[ba.niveau - 1] || 0) > 0;
      const b = document.createElement('button');
      b.className = (P.bateau === ba.id ? 'choisi' : '') + (ouvert ? '' : ' ferme');
      b.appendChild(miniCanvas((c, w, h) => { c.fillStyle = '#7fd8ea'; c.fillRect(0, h * 0.78, w, h); dessinerBateau(c, w / 2, h * 0.8, 0.8, ba.id, 0); }, 100, 56));
      const s = document.createElement('span'); s.textContent = ouvert ? tr('bateau.' + ba.id) : tr('atelier.niveauRequis', { n: ba.niveau });
      b.appendChild(s);
      b.setAttribute('aria-pressed', P.bateau === ba.id ? 'true' : 'false');
      if (ouvert) b.addEventListener('click', () => { P.bateau = ba.id; son('clic'); construireAtelier(); sauverChoix(); });
      else b.disabled = true;
      lt.appendChild(b);
    });
  }
  // Un choix de décoration ne s'écrit que s'il existe déjà une sauvegarde
  // (jamais de nouvelle sauvegarde créée depuis l'écran titre).
  function sauverChoix() {
    try { if (SAVE && SAVE.existe(JEU)) SAVE.save(JEU, { bouee: P.bouee, bateau: P.bateau }); } catch (e) { /* rien */ }
  }

  /* ---------------- Son ---------------- */
  function majBoutonsSon() {
    document.querySelectorAll('.b-son').forEach((b) => { b.innerHTML = P.son ? SVG.sonOn : SVG.sonOff; b.setAttribute('aria-pressed', P.son ? 'true' : 'false'); });
  }
  function basculerSon() {
    P.son = !P.son;
    try { localStorage.setItem('fmg-algues-son', P.son ? '1' : '0'); } catch (e) { /* rien */ }
    try { if (SAVE && SAVE.existe(JEU)) SAVE.save(JEU, { options: { son: P.son } }); } catch (e) { /* rien */ }
    majBoutonsSon();
    if (P.son) son('clic');
  }
  document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', basculerSon));

  /* ---------------- Boutons ---------------- */
  function jouer() {
    son('clic');
    if (!SAVE) { lancerNiveau(0); return; }
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { chargerProgression(); lancerNiveau(clamp((parseInt(d.niveau, 10) || 1) - 1, 0, NIVEAUX.length - 1)); },
      onNouvelle: () => { lancerNiveau(0); },
      onEffacer: () => { reinitialiser(); majEffacer(); },
    });
  }
  function reinitialiser() { P.debloque = 1; P.etoiles = []; P.records = []; P.album = {}; P.tutos = {}; P.bouee = 'classique'; P.bateau = 'barque'; }
  $('b-jouer').addEventListener('click', jouer);
  $('b-niveaux').addEventListener('click', () => { son('clic'); retourVers = 'ecran-titre'; construireNiveaux(); mode = 'menu'; montrerEcran('ecran-niveaux'); });
  $('b-album').addEventListener('click', () => { son('clic'); construireAlbum(); mode = 'menu'; montrerEcran('ecran-album'); });
  $('b-atelier').addEventListener('click', () => { son('clic'); construireAtelier(); mode = 'menu'; montrerEcran('ecran-atelier'); });
  document.querySelectorAll('.b-retour').forEach((b) => b.addEventListener('click', () => { son('clic'); if (retourVers === 'ecran-fin' || S) { allerAccueil(); } else { mode = 'titre'; montrerEcran('ecran-titre'); } retourVers = 'ecran-titre'; }));
  $('b-pause').addEventListener('click', () => { son('clic'); pause(); });
  $('p-reprendre').addEventListener('click', () => { son('clic'); reprendre(); });
  $('p-recommencer').addEventListener('click', () => { son('clic'); const n = S.n; S = null; lancerNiveau(n); });
  $('p-accueil').addEventListener('click', () => { son('clic'); allerAccueil(); });
  $('f-suivant').addEventListener('click', () => { son('clic'); lancerNiveau(Math.min(NIVEAUX.length - 1, S.n + 1)); });
  $('f-reessayer').addEventListener('click', () => { son('clic'); lancerNiveau(S.n); });
  $('f-rejouer').addEventListener('click', () => { son('clic'); lancerNiveau(S.n); });
  $('f-niveaux').addEventListener('click', () => { son('clic'); S = null; mode = 'menu'; ['hud', 'commandes', 'outils'].forEach((id) => $(id).classList.add('cache')); calculerGeo(); construireNiveaux(); retourVers = 'ecran-fin'; montrerEcran('ecran-niveaux'); });
  $('b-poissons').addEventListener('click', appelerPoissons);

  let effaceur = null;
  function majEffacer() { if (effaceur && effaceur.maj) effaceur.maj(); }
  try { if (SAVE && SAVE.boutonEffacer) effaceur = SAVE.boutonEffacer({ jeu: JEU, conteneur: $('effacer-titre'), apres: () => { reinitialiser(); } }); } catch (e) { effaceur = null; }

  /* ---------------- Clavier ---------------- */
  document.addEventListener('keydown', (e) => {
    if (tutoActif) { if (['Space', 'Enter', 'Escape', 'ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', 'NumpadEnter'].includes(e.code)) { e.preventDefault(); etapeSuivante(); } return; }
    if (!S || mode !== 'jeu') return;
    if (e.code === 'Escape' || e.code === 'KeyP') {
      e.preventDefault();
      if (S.pause) reprendre(); else pause();
      return;
    }
    if (S.pause || S.fini) return;
    const cu = S.curseur;
    const mouvement = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.code];
    if (mouvement) {
      e.preventDefault();
      if (cu.vu) { cu.r = clamp(cu.r + mouvement[0], 0, S.cordes.length - 1); cu.s = clamp(cu.s + mouvement[1], 0, PLACES - 1); }
      cu.vu = true;
      viserPlongeuse(xPlace(cu.s), yCorde(S, cu.r));
      return;
    }
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && !cu.vu) return; // laisse le bouton agir
      e.preventDefault();
      if (!cu.vu) { cu.vu = true; return; }
      actionPlace(cu.r, cu.s);
      return;
    }
    const chiffre = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[e.code];
    if (chiffre !== undefined && S.L.a[chiffre]) { S.choix = S.L.a[chiffre]; son('clic'); majOutils(); return; }
    if (e.code === 'KeyV') {
      let i = S.commandes.findIndex((c, k) => livrable(k));
      if (i < 0) i = 0;
      livrer(i, $('commandes').children[i]);
      return;
    }
    if (e.code === 'KeyF') appelerPoissons();
  });

  /* ---------------- Sauvegarde à la fermeture ---------------- */
  if (SAVE) JEL_SAVE.surFermeture(() => { if (enPartie && S && !S.fini) sauver(S.n + 1); });

  /* ---------------- Démarrage ---------------- */
  majBoutonsSon();
  redim();
  requestAnimationFrame((ms) => { precedent = ms; boucle(ms); });
})();
</script>
</body>
</html>
