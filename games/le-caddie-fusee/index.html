<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

  }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

    position: absolute; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px;
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  }
  #hud .rond { pointer-events: auto; }
  .pilule {
    background: rgba(255, 255, 255, .93); color: #3a2614; border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: 17px;
    display: flex; align-items: center; gap: 6px; min-height: 40px; box-shadow: 0 3px 0 rgba(150, 70, 20, .25);
  }

  .pilule.perdu svg .etoileHud { fill: #c9c0b4; }
  .espace { flex: 1; }
  #hud .barreHaut { flex-wrap: nowrap; }
  #hud .pilule { white-space: nowrap; flex: none; }
  @media (max-width: 440px) {
    #hud .barreHaut { gap: 4px; left: 6px; right: 6px; }

    #hudListe { top: calc(max(8px, env(safe-area-inset-top)) + 50px); }
    .case, .case canvas { width: 34px; height: 34px; }
  }
  #hudListe {
    position: absolute; top: calc(max(8px, env(safe-area-inset-top)) + 52px); left: 8px; display: flex; gap: 3px; flex-wrap: wrap;
    max-width: calc(100% - 16px); background: rgba(255, 255, 255, .93); border-radius: 16px; padding: 4px 8px; box-shadow: 0 3px 0 rgba(150,70,20,.25);

  #bandeau {

  /* ---------- Niveaux ---------- */

<script>
(() => {

  // =====================================================================

  const RAYONS = {

      couleurs: ['#7ecbff', '#ff8fab', '#ffffff', '#b8f2e6', '#ffd166', '#a0c4ff'] },
    jouets: { mur: '#ffe3f2', mur2: '#ffc8e4', sol: '#fff4e4', sol2: '#f3dfc4', etag: '#8a63d2', etag2: '#6845ad', plafond: '#fff2fa',
      produits: ['ballon', 'ourson', 'voiture', 'canard', 'toupie'], pile: ['#ff595e', '#1982c4', '#ffca3a', '#8ac926'], icone: 'ourson',
      couleurs: ['#ff595e', '#1982c4', '#ffca3a', '#8ac926', '#6a4c93', '#ff924c'] },
    boulangerie: { mur: '#f9e2c2', mur2: '#efc995', sol: '#f7ecdd', sol2: '#e8d4ba', etag: '#a0612f', etag2: '#7a4520', plafond: '#fff5e4',
      produits: ['baguette', 'croissant', 'painrond', 'gateau', 'beignet'], pile: ['#d99a4e', '#e8b66d', '#c47f36'], icone: 'croissant',
      couleurs: ['#e8b66d', '#d99a4e', '#f6d7a7', '#c47f36', '#ffb5a7', '#fff1d0'] },
    parking: { mur: '#9fd8ff', mur2: '#dff3ff', sol: '#8f959e', sol2: '#7d838c', etag: '#e85d3c', etag2: '#b8401f', plafond: '#c9ecff',
      produits: ['fleurs', 'eau', 'pasteque', 'ballon', 'croissant'], pile: ['#4b9be0', '#9ad1ff', '#2f73b5'], icone: 'voiture', dehors: true,
      couleurs: ['#ff595e', '#1982c4', '#ffca3a', '#8ac926', '#ffffff', '#6a4c93'] },

  const ORDRE_RAYONS = ['fruits', 'surgeles', 'jouets', 'boulangerie', 'parking'];

  // =====================================================================
  //  Les 20 courses. Jetons de la piste (mètres) :

  // =====================================================================
  const NIVEAUX = [

    { rayon: 'fruits', tutos: ['pile'], piste: '_14 it _8 pi it _6 co pi _8 it _10 pi _4 co _8 pi it _6 pi _8 it _8' },
    { rayon: 'fruits', tutos: ['rampe'], piste: '_14 it _10 ra ih _8 pi _6 co _8 ra ch _8 it _10 pi _6 ra ih _10 pi it _10' },

    { rayon: 'surgeles', tutos: ['mouille'], piste: '_14 it _6 mo8 co _4 pi _8 mo10 it _4 ra ih _8 pi _4 mo12 it _8 pi _6 vi10 it _10' },
    { rayon: 'surgeles', tutos: ['client'], piste: '_14 it _8 cl _6 co _6 mo8 cl _4 it _8 pi _6 cl it _8 ra ih _8 cl pi _6 vi10 it _10' },
    { rayon: 'surgeles', tutos: ['tapis'], piste: '_14 it _6 ta+10 co _6 ta-8 it _8 pi _6 ta+12 ra ih _8 cl _6 mo8 it _6 ta-10 pi _6 it _10' },
    { rayon: 'surgeles', tutos: ['grandepile'], piste: '_14 it _8 ra ih gp _6 mo10 cl _6 ta+10 ra gp _6 it _6 vi12 pi _6 ta-8 it _6 ra ih gp _6 cl pi it _12' },
    { rayon: 'jouets', tutos: ['ballon'], piste: '_14 it _8 bl _6 co bl _4 it _8 pi _4 bl _6 ra ih _8 mo8 bl it _8 cl _6 bl pi _6 it _10' },
    { rayon: 'jouets', tutos: ['promo'], piste: '_14 it _6 pr _18 bl it _6 pi _6 ra ih _8 cl _6 pr _16 ta+10 it _6 bl _4 vi12 pi _6 pr _16 it _10' },
    { rayon: 'jouets', tutos: [], piste: '_14 it _6 bl bl _4 cl _4 ta-10 it _6 ra ih gp _6 mo10 bl _4 pr _16 pi pi it _6 cl cl _6 vi12 bl it _6 ra ih _8 it _10' },
    { rayon: 'jouets', tutos: [], piste: '_14 it _6 cl _2 bl _4 pi it _4 mo10 cl _6 ta+12 ra ih gp _4 bl bl _2 it _6 vi14 pi _4 pr _16 cl _4 ta-10 it _6 ra ih _8 bl pi _6 it _10' },
    { rayon: 'boulangerie', tutos: ['pain'], piste: '_14 it _8 pa _6 co _6 pa it _6 pi _6 pa ra ih _8 cl _6 pa _4 mo8 it _8 pa pi _6 it _10' },
    { rayon: 'boulangerie', tutos: [], piste: '_14 it _6 pa _4 vi12 pa _6 mo10 it _6 pa pi _4 ra ih _8 cl _4 pa _6 vi12 co _4 mo8 pa it _8 pr _16 it _10' },
    { rayon: 'boulangerie', tutos: [], piste: '_14 it _6 ra ih gp _4 pa _6 ra ch _8 ta+10 ra ih gp _6 bl pi _4 pr _14 ra ih _8 cl pa _6 vi10 it _6 ra gp _6 it _10' },
    { rayon: 'boulangerie', tutos: [], piste: '_14 it _6 pa pa _2 cl _4 mo12 bl _4 ta+12 ra ih gp _6 vi14 pa it _6 cl cl _4 pr _16 ta-12 pi pi _4 bl it _6 mo10 pa _6 ra ih _8 it _10' },
    { rayon: 'parking', tutos: ['dos'], piste: '_14 it _6 da da _4 co _4 da it _6 mo8 _2 da da da _4 pi _6 ra ih _8 cl _6 da it _8 pa _6 it _10' },
    { rayon: 'parking', tutos: [], piste: '_14 it _6 da cl _4 mo10 da da pa _4 it _6 cl _2 ra ih gp _6 da da pi _4 pr _16 mo8 cl _6 ta+10 pa it _8 bl _4 it _10' },
    { rayon: 'parking', tutos: [], piste: '_14 it _4 da da pa _6 mo12 cl _4 vi12 bl it _6 ra ih gp _6 cl cl _4 ta-10 da pi _4 pr _16 pa pa it _6 mo10 bl _4 ra ih _8 da da da it _6 vi12 pi _6 it _10' },
    { rayon: 'parking', tutos: [], piste: '_14 it _4 da da da pa _4 mo10 cl _4 bl bl it _6 ta+12 ra ih gp _6 vi12 pa pa _4 cl _2 pr _16 mo12 da pi it _6 cl cl _4 ra ch gp _6 bl pi _4 ta-10 pa it _6 pr _16 vi14 da da it _6 ra ih gp _6 cl bl pi _6 it _10' },
  ];
  window.JEL_NIVEAUX = NIVEAUX.length;

  // =====================================================================
  //  Garage : caddies, roues, autocollants à débloquer
  // =====================================================================
  const CADDIES = [
    { id: 'rouge', couleur: '#e8463a', fonce: '#a82418', seuil: 0 },
    { id: 'bleu', couleur: '#2f80ed', fonce: '#1a4f9c', seuil: 6 },
    { id: 'vert', couleur: '#3fb950', fonce: '#227a30', seuil: 15 },
    { id: 'rose', couleur: '#ff6fb5', fonce: '#c23a80', seuil: 27 },
    { id: 'or', couleur: '#f5b820', fonce: '#a87400', seuil: 40 },
    { id: 'fusee', couleur: '#9b5de5', fonce: '#5a2ea6', seuil: 54, fusee: true },
  ];
  const ROUES = [
    { id: 'normales', seuil: 0 },
    { id: 'orange', seuil: 4 },
    { id: 'etoiles', seuil: 8 },
    { id: 'neon', seuil: 12 },
    { id: 'arcenciel', seuil: 16 },
  ];
  const STICKERS = [
    { id: 'aucun', seuil: 0 },
    { id: 'etoile', seuil: 1 },
    { id: 'coeur', seuil: 2 },
    { id: 'eclair', seuil: 4 },
    { id: 'fleur', seuil: 6 },
    { id: 'sourire', seuil: 9 },
    { id: 'banane', seuil: 12 },
  ];

  // =====================================================================
  //  Physique (mètres, secondes)
  // =====================================================================
  const PHY = {
    G: 17, SAUT: 5.6, ACC: 7.5, VCOURSE: 9, VVIRAGE: 4.6, FROT: 0.45, FROT_MOUILLE: 0.05, VMAX: 15, ELAN_LACHE: 0.4,
    RAMPE_L: 3.2, RAMPE_H: 0.95, RAMPE_ELAN: 0.6, DOS_L: 1.4, DOS_H: 0.26, DOS_ELAN: 0.38,
    CHUTE: 0.9, INVUL: 1.6, PROMO_VIE: 3, PAIN_V: 2.2,
  };
  const BOITE = { dx: 0.5, h: 1.35 };

  // Hasard fixe (pour que chaque course soit toujours la même)
  function graine(s) {
    let a = s >>> 0;
    return () => { a = (a + 0x6D2B79F5) | 0; let q = Math.imul(a ^ (a >>> 15), 1 | a); q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q; return ((q ^ (q >>> 14)) >>> 0) / 4294967296; };
  }
  function hache(k) { let x = Math.imul((k | 0) ^ 0x9E3779B1, 0x85EBCA6B); x ^= x >>> 13; x = Math.imul(x, 0xC2B2AE35); x ^= x >>> 16; return (x >>> 0) / 4294967296; }

  // Fabrique la piste d'une course à partir de ses jetons
  function construire(n) {
    const nv = NIVEAUX[n], R = RAYONS[nv.rayon];
    const P = { n, rayon: nv.rayon, piles: [], rampes: [], dos: [], zones: [], clients: [], ballons: [], pains: [], objets: [], promos: [], fin: 0 };
    const rnd = graine(n * 977 + 13);
    let ip = n * 2, c = 0;
    const prochain = () => R.produits[(ip++) % R.produits.length];
    let ref = 0; // secondes « idéales » en plus de la longueur
    for (const tok of nv.piste.trim().split(/\s+/)) {
      const m = /^([_a-z]+?)([+-]?\d+)?$/.exec(tok);
      if (!m) continue;
      const nom = m[1], num = m[2] ? Number(m[2]) : 0;
      switch (nom) {
        case '_': c += num; break;
        case 'it': P.objets.push({ x: c, y: 0.62, nom: prochain(), liste: true }); c += 1.5; break;
        case 'ih': P.objets.push({ x: c + 2.6, y: 2.0, nom: prochain(), liste: true }); break;
        case 'co': P.objets.push({ x: c, y: 0.6, coupon: true }); c += 1.5; break;
        case 'ch': P.objets.push({ x: c + 2.6, y: 2.0, coupon: true }); break;
        case 'pi': P.piles.push({ x0: c, x1: c + 0.9, h: 0.5, grande: false, k: P.piles.length }); c += 6.9; break;
        case 'gp': P.piles.push({ x0: c + 1.2, x1: c + 2.1, h: 1.3, grande: true, k: P.piles.length }); c += 8.1; break;
        case 'ra': P.rampes.push({ x0: c, x1: c + PHY.RAMPE_L }); c += PHY.RAMPE_L; break;
        case 'mo': P.zones.push({ type: 'mouille', x0: c, x1: c + num }); c += num + 3; break;
        case 'vi': P.zones.push({ type: 'virage', x0: c, x1: c + num }); c += num + 3; ref += num * (1 / 7.2 - 1 / 8.6); break;
        case 'ta': P.zones.push({ type: 'tapis', x0: c, x1: c + Math.abs(num), b: num > 0 ? 4 : -3 }); c += Math.abs(num) + 2;
          ref += Math.abs(num) * (num > 0 ? (1 / 12 - 1 / 8.6) : (1 / 5.8 - 1 / 8.6)); break;
        case 'cl': P.clients.push({ x: c + 0.6, per: 3.4 + rnd() * 0.8, ph: rnd() * 4, habit: Math.floor(rnd() * 4) }); c += 7.2; ref += 0.7; break;
        case 'bl': P.ballons.push({ x: c + 0.4, per: 1.15, ph: rnd() * 1.1, coul: Math.floor(rnd() * 4) }); c += 6.8; ref += 0.35; break;
        case 'pa': P.pains.push({ x: c + 0.5, x0: c + 0.5, actif: false, casse: false }); c += 7; break;
        case 'da': P.dos.push({ x0: c, x1: c + PHY.DOS_L }); c += PHY.DOS_L + 3; break;
        case 'pr': P.promos.push({ xd: c, x: c + 15, y: 0.7, nom: R.produits[(n + P.promos.length) % R.produits.length], etat: 'attente', vie: 0 }); break;
        default: break;
      }
    }
    P.fin = c + 6;
    P.nbListe = P.objets.filter((o) => o.liste).length;
    ref += P.fin / 8.6 + 1.4 + P.piles.length * 0.15;
    P.cible = Math.ceil(ref * 1.12 + 1.5);
    P.limite = Math.ceil(ref * 1.6 + 12);
    return P;
  }

  function hauteurSol(P, x) {
    for (const r of P.rampes) if (x >= r.x0 && x < r.x1) return PHY.RAMPE_H * (x - r.x0) / PHY.RAMPE_L;
    for (const d of P.dos) if (x >= d.x0 && x < d.x1) return PHY.DOS_H * Math.sin(Math.PI * (x - d.x0) / PHY.DOS_L);
    return 0;
  }
  function zoneA(P, x, type) {
    for (const z of P.zones) if (z.type === type && x >= z.x0 && x < z.x1) return z;
    return null;
  }
  // Position d'un chariot de client : 0 = au fond, 1 = devant ; il bloque l'allée entre 0,4 et 0,72
  function profondeurClient(c, tt) { return ((tt + c.ph) % c.per) / c.per; }
  function clientBloque(z) { return z > 0.4 && z < 0.72; }
  function hauteurBallon(b, tt) { return 0.45 + 2.0 * Math.abs(Math.sin(Math.PI * (tt + b.ph) / b.per)); }

  function nouvelEtat(n) {
    const P = construire(n);
    return {
      n, P, x: 2.5, y: 0, vy: 0, v: 0, etat: 'pret', t: 0, tt: 0, accidents: 0, listePrise: 0, coupons: 0, promosPrises: 0,
      invul: 0, chute: 0, glissade: 0, pas: 0, penche: 0, finT: 0, gagneEmis: false, ev: [], roue: 0,
      parts: [], pops: [], secousse: 0, pause: false, cam: 0, flash: 0,
    };
  }

  function sauter(J) {
    J.etat = 'air'; J.vy = PHY.SAUT; J.v = Math.min(PHY.VMAX, J.v + PHY.ELAN_LACHE);
    J.ev.push({ t: 'saut' });
  }
  function accident(J, quoi, obj) {
    J.accidents++; J.etat = 'chute'; J.chute = PHY.CHUTE; J.v *= 0.22; J.invul = PHY.INVUL;
    if (J.vy > 0) J.vy = 0;
    J.ev.push({ t: 'crash', quoi, obj });
  }

  // Un pas de simulation. appui = doigt (ou touche) enfoncé.
  function etape(J, dt, appui) {
    const P = J.P, ev = J.ev;
    J.tt += dt;
    if (J.etat === 'perdu') return;
    if (J.etat === 'pret') {
      if (!appui) return;
      J.etat = 'course'; ev.push({ t: 'depart' });
    }
    if (J.etat !== 'fini') {
      J.t += dt;
      if (J.t >= P.limite) { J.etat = 'perdu'; ev.push({ t: 'perdu' }); return; }
    }
    J.invul = Math.max(0, J.invul - dt);
    J.glissade = Math.max(0, J.glissade - dt);
    const xAvant = J.x;
    const mou = zoneA(P, J.x, 'mouille'), vir = zoneA(P, J.x, 'virage'), tap = zoneA(P, J.x, 'tapis');

    switch (J.etat) {
      case 'course': {
        if (!appui) { sauter(J); break; }
        if (mou && J.invul <= 0) {
          // On dérape en courant sur le sol mouillé : l'enfant tombe dans son caddie
          J.accidents++; J.etat = 'glisse'; J.v *= 0.75; J.invul = 1.2; J.glissade = 0.8;
          ev.push({ t: 'glissade' });
          break;
        }
        const cible = vir ? PHY.VVIRAGE : PHY.VCOURSE;
        if (J.v < cible) J.v = Math.min(cible, J.v + PHY.ACC * dt);
        else J.v = Math.max(cible, J.v - (vir ? 12 : 2.5) * dt);
        const avant = Math.floor(J.pas / 0.9);
        J.pas += J.v * dt;
        if (Math.floor(J.pas / 0.9) !== avant) ev.push({ t: 'pas' });
        break;
      }
      case 'glisse':
        if (appui) { J.etat = 'course'; ev.push({ t: 'descend' }); break; }

    // Déplacement
    if (J.etat === 'air') {
      J.vy -= PHY.G * dt; J.x += J.v * dt; J.y += J.vy * dt;
      const s = hauteurSol(P, J.x);
      if (J.y <= s && J.vy < 0) { J.y = s; J.vy = 0; J.etat = appui ? 'course' : 'glisse'; ev.push({ t: 'atterrit' }); }
    } else {
      const b = (tap && J.etat !== 'fini') ? tap.b : 0;
      J.x = Math.max(0.5, J.x + (J.v + b) * dt);
      // Au bout d'une rampe : le caddie décolle (testé avant de suivre le sol, qui retombe à 0)
      let lance = false;
      if (J.etat === 'glisse' || J.etat === 'course') {
        for (const r of P.rampes) {
          if (xAvant < r.x1 && J.x >= r.x1 && J.y > PHY.RAMPE_H * 0.5) {
            J.etat = 'air'; J.y = PHY.RAMPE_H; J.vy = Math.max(2.2, PHY.RAMPE_ELAN * J.v); lance = true;
            ev.push({ t: 'rampe' });
          }
        }
      }
      const s = hauteurSol(P, J.x);
      if (lance) { /* déjà en vol */ }
      else if (J.y > s + 0.02) {
        // encore en l'air (chute ou arrivée) : il retombe
        J.vy -= PHY.G * dt; J.y = Math.max(s, J.y + J.vy * dt);
        if (J.y <= s) J.vy = 0;
      } else {
        J.y = s;
        if (J.etat === 'glisse' || J.etat === 'course') {
          for (const r of P.rampes) if (J.x >= r.x0 && J.x < r.x1 && J.etat === 'glisse') J.v = Math.max(0, J.v - 1.2 * dt);
          for (const d of P.dos) {
            const pic = (d.x0 + d.x1) / 2;
            if (J.etat !== 'air' && xAvant < pic && J.x >= pic && J.v > 5) {

    // Chariots de pain : roulent vers le joueur quand il approche
    for (const p of P.pains) {
      if (p.casse) continue;

      for (const p of P.piles) {

    }
    if (J.invul <= 0 && (J.etat === 'course' || J.etat === 'glisse' || J.etat === 'air')) {
      for (const c of P.clients) {

      for (const b of P.ballons) {

      if (o.pris) continue;
      if (o.x > gx0 - 0.42 && o.x < gx1 + 0.42 && o.y > gy0 - 0.42 && o.y < gy1 + 0.42) {

        else if (p.vie <= 0) { p.etat = 'perdue'; ev.push({ t: 'promoRatee', p }); }

    if (J.etat !== 'fini' && J.etat !== 'perdu' && J.x >= P.fin - 3) { J.etat = 'fini'; J.finT = 0; ev.push({ t: 'caisse' }); }

    let cibleP = 0;
    if (J.etat === 'glisse' && vir) cibleP = -0.28;
    if (J.etat === 'glisse' && mou) cibleP = 0.1 * Math.sin(J.tt * 14);
    if (J.etat === 'air') cibleP = Math.max(-0.25, Math.min(0.25, -J.vy * 0.04));
    J.penche += (cibleP - J.penche) * Math.min(1, dt * 8);
    J.roue += J.v * dt / 0.12;
  }

  function etoilesDe(J) {
    const liste = J.listePrise >= J.P.nbListe;
    const chrono = J.t <= J.P.cible && J.accidents === 0;
    return { liste, chrono, total: 1 + (liste ? 1 : 0) + (chrono ? 1 : 0) };
  }
  function scoreDe(J) {
    return Math.max(0, J.listePrise * 100 + J.coupons * 25 + J.promosPrises * 150 + Math.round(Math.max(0, J.P.limite - J.t) * 10) - J.accidents * 40);
  }


  // =====================================================================
  //  Progression sauvegardée
  // =====================================================================
  let prog = progVide();
  function progVide() {
    return { niveau: 1, etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, promos: 0,
      garage: { caddie: 'rouge', roue: 'normales', sticker: 'aucun' }, tutos: [], son: true };
  }
  function chargerProg() {
    prog = progVide();
    let d = null;
    try { d = SAVE ? window.JEL_SAVE.load(JEU) : null; } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => Math.max(0, Math.min(3, Number(d.etoiles[i]) || 0)));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => Math.max(0, Number(d.records[i]) || 0));
      prog.niveau = Math.max(1, Math.min(NIVEAUX.length, Number(d.niveau) || 1));
      // dernière course ouverte : celle de la sauvegarde, ou celle qui suit la plus loin gagnée
      let gagnee = 0;
      prog.etoiles.forEach((e, i) => { if (e > 0) gagnee = i + 1; });
      prog.debloque = Math.max(1, Math.min(NIVEAUX.length, Math.max(Number(d.debloque) || 1, prog.niveau, gagnee + 1)));
      prog.promos = Math.max(0, Number(d.promos) || 0);
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string');
      if (d.garage && typeof d.garage === 'object') {
        if (CADDIES.some((c) => c.id === d.garage.caddie)) prog.garage.caddie = d.garage.caddie;
        if (ROUES.some((c) => c.id === d.garage.roue)) prog.garage.roue = d.garage.roue;
        if (STICKERS.some((c) => c.id === d.garage.sticker)) prog.garage.sticker = d.garage.sticker;
      }
      if (d.options && typeof d.options === 'object' && d.options.son === false) prog.son = false;
    }
    try { const s = localStorage.getItem('caddie-fusee-son'); if (s === '0') prog.son = false; } catch (e) { /* pas de stockage */ }
  }
  function sauverProg(niveau, score) {
    if (!SAVE || APERCU) return;
    try {
      window.JEL_SAVE.save(JEU, { niveau: Math.max(1, Math.min(NIVEAUX.length, niveau)), score: score || 0, etoiles: prog.etoiles, records: prog.records,
        debloque: prog.debloque, promos: prog.promos, garage: prog.garage, tutos: prog.tutos, options: { son: prog.son } });
    } catch (e) { /* rien */ }
  }
  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);
  const coursesGagnees = () => prog.etoiles.filter((e) => e > 0).length;
  function estDebloque(type, item) {
    if (type === 'caddie') return totalEtoiles() >= item.seuil;
    if (type === 'roue') return coursesGagnees() >= item.seuil;
    return prog.promos >= item.seuil;
  }
  function listeDebloques() {
    const l = [];
    CADDIES.forEach((c) => { if (estDebloque('caddie', c)) l.push('c:' + c.id); });
    ROUES.forEach((c) => { if (estDebloque('roue', c)) l.push('r:' + c.id); });
    STICKERS.forEach((c) => { if (estDebloque('sticker', c)) l.push('s:' + c.id); });
    return l;
  }

  // =====================================================================
  //  Sons (Web Audio, aucun fichier)

  function dessinerPremierPlan(c, R, cam, s, Y) {

  function dessinerZones(c, P, cam, s, Y, tt) {
    for (const z of P.zones) {
      const x0 = (z.x0 - cam) * s, x1 = (z.x1 - cam) * s;
      if (x1 < -50 || x0 > LW + 50) continue;

        const g = c.createLinearGradient(0, Y - 0.2 * s, 0, Y + 0.4 * s); g.addColorStop(0, 'rgba(90,180,255,.55)'); g.addColorStop(1, 'rgba(160,220,255,.35)');
        c.fillStyle = g; c.beginPath(); c.ellipse((x0 + x1) / 2, Y + 0.05 * s, (x1 - x0) / 2, 0.32 * s, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = 'rgba(255,255,255,.6)';
        for (let i = 0; i < 4; i++) { c.beginPath(); c.ellipse(x0 + (x1 - x0) * (0.2 + i * 0.2), Y + 0.02 * s, 0.35 * s, 0.04 * s, 0, 0, Math.PI * 2); c.fill(); }

  function dessinerEntites(c, J, cam, s, Y, devant) {

  function rendre(J) {

  // =====================================================================
  //  Effets
  // =====================================================================
  function particule(J, o) { o.vie0 = o.vie; J.parts.push(o); }

  function majEffets(J, dt) {

    for (const p of J.pops) { p.y += dt * 1.2; p.vie -= dt; }
    J.pops = J.pops.filter((p) => p.vie > 0);
    J.secousse = Math.max(0, J.secousse - dt * 2.5);
    J.flash = Math.max(0, J.flash - dt * 3);

    if (prog.garage.roue === 'etoiles' && J.v > 3 && Math.random() < dt * 18) particule(J, { type: 'etoile', x: J.x - 0.4, y: 0.15, vx: -1, vy: 1.5, rot: 0, vr: 3, vie: 0.6, t: 0.09, col: '#ffd43b', g: 2 });
  }

    for (let i = 0; i < n; i++) particule(J, { type: 'confetti', x, y, vx: (Math.random() - 0.5) * 8, vy: 3 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 20, vie: 1.2 + Math.random(), t: 0.14, col: cols[i % cols.length], g: 9 });
  }

  // Événements de la simulation → sons, effets, interface
  function traiterEvenements(J, muet) {
    for (const e of J.ev) {

      switch (e.t) {

        case 'pas': Son.pas(); break;
        case 'saut': Son.saut(); for (let i = 0; i < 6; i++) particule(J, { type: 'rond', x: J.x - 0.3, y: 0.05, vx: -Math.random() * 2, vy: Math.random() * 1.5, rot: 0, vr: 0, vie: 0.4, t: 0.12, col: 'rgba(200,180,150,.7)', g: 3 }); break;
        case 'descend': Son.descend(); break;
        case 'atterrit': Son.atterrit(); for (let i = 0; i < 8; i++) particule(J, { type: 'rond', x: J.x + (Math.random() - 0.5), y: 0.05, vx: (Math.random() - 0.5) * 3, vy: Math.random() * 1.5, rot: 0, vr: 0, vie: 0.45, t: 0.12, col: 'rgba(200,180,150,.7)', g: 3 }); break;
        case 'rampe': Son.rampe(); J.flash = 0.3; for (let i = 0; i < 10; i++) particule(J, { type: 'etoile', x: J.x - 0.5, y: J.y + 0.3, vx: -2 - Math.random() * 2, vy: (Math.random() - 0.5) * 3, rot: 0, vr: 4, vie: 0.6, t: 0.1, col: '#ffd43b', g: 0 }); break;
        case 'bond': Son.bond(); break;
        case 'prend': {
          Son.prend(J.listePrise); cocherListe(e.o.nom);
          particule(J, { type: 'produit', nom: e.o.nom, x: e.o.x, y: e.o.y, vx: 1.5, vy: 6, rot: 0, vr: 6, vie: 0.6, t: 0.34, g: 8 });
          for (let i = 0; i < 8; i++) particule(J, { type: 'etoile', x: e.o.x, y: e.o.y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.3) * 6, rot: 0, vr: 5, vie: 0.6, t: 0.09, col: '#ffd43b', g: 4 });
          pop(J, e.o.x, e.o.y + 0.6, t('pop.points', { n: 100 }), '#2f8f4e'); break;
        }
        case 'coupon': Son.coupon(); pop(J, e.o.x, e.o.y + 0.5, t('pop.points', { n: 25 }), '#2f8f4e'); break;
        case 'listeOk': Son.listeOk(); montrerBandeau(t('hud.listeOk')); confettis(J, J.x, J.y + 1.5, 30); break;
        case 'crash': {

          const R = RAYONS[J.P.rayon];

            const p = e.obj, n = p.grande ? 14 : 7;

      g.appendChild(grille);
    });
    montrer('ecranNiveaux');
  }

  // ---------- Garage ----------
  function ouvrirGarage() {
    Son.init(); Son.clic(); mode = 'garage';
    remplirGarage();
    montrer('ecranGarage');
  }
  function remplirGarage() {
    const ligne = (boite, info, type, liste, cle, prefixe, dessin) => {
      const b = $(boite); b.textContent = '';
      liste.forEach((it) => {
        const ok = estDebloque(type, it);
        const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'pastille' + (prog.garage[cle] === it.id ? ' actif' : '') + (ok ? '' : ' ferme');
        const cv = document.createElement('canvas'); cv.width = 92; cv.height = 92; dessin(cv.getContext('2d'), it); bt.appendChild(cv);
        if (!ok) bt.insertAdjacentHTML('beforeend', SVG_CADENAS);
        bt.setAttribute('aria-label', t(prefixe + '.' + it.id));
        bt.addEventListener('click', () => {
          Son.init();
          if (!ok) { Son.note(220, 0.15, 'square', 0.08); $(info).textContent = condition(type, it); return; }
          Son.clic(); prog.garage[cle] = it.id; sauverProg(prog.niveau || 1, 0); remplirGarage();
        });
        b.appendChild(bt);
      });
      const actuel = liste.find((x) => x.id === prog.garage[cle]);
      $(info).textContent = t(prefixe + '.' + actuel.id);
    };
    ligne('choixCaddie', 'infoCaddie', 'caddie', CADDIES, 'caddie', 'caddie', (c, it) => {
      dessinerJoueur(c, 52, 84, 62, { etat: 'glisse', garage: { caddie: it.id, roue: 'normales', sticker: 'aucun' }, tt: 0, roue: 0, flamme: it.fusee ? 0.6 : 0 }); });
    ligne('choixRoue', 'infoRoue', 'roue', ROUES, 'roue', 'roue', (c, it) => {
      const col = it.id === 'orange' ? '#ff8800' : it.id === 'neon' ? '#4cc9f0' : it.id === 'etoiles' ? '#ffc21a' : it.id === 'arcenciel' ? '#ff70a6' : '#3a3a48';
      if (it.id === 'neon') { c.shadowColor = '#4cc9f0'; c.shadowBlur = 16; }
      cercle(c, 46, 46, 30, '#2a2a33'); c.shadowBlur = 0; cercle(c, 46, 46, 19, col);
      if (it.id === 'etoiles') { etoilePath(c, 46, 46, 13, 6, 5); c.fillStyle = '#fff'; c.fill(); }
      if (it.id === 'arcenciel') ['#ff595e', '#ffca3a', '#8ac926', '#1982c4'].forEach((k, i) => { c.fillStyle = k; c.fillRect(2, 80 + i * 3, 88, 3); });
    });
    ligne('choixSticker', 'infoSticker', 'sticker', STICKERS, 'sticker', 'sticker', (c, it) => {
      if (it.id === 'aucun') { c.strokeStyle = '#d6c7b3'; c.lineWidth = 6; c.beginPath(); c.arc(46, 46, 26, 0, Math.PI * 2); c.moveTo(28, 64); c.lineTo(64, 28); c.stroke(); }
      else dessinerSticker(c, it.id, 46, 46, 34); });
  }
  function condition(type, it) {
    if (type === 'caddie') return t('garage.cond.etoiles', { n: it.seuil, a: totalEtoiles() });
    if (type === 'roue') return t('garage.cond.courses', { n: it.seuil, a: coursesGagnees() });
    return t('garage.cond.promos', { n: it.seuil, a: prog.promos });
  }
  function dessinerApercuGarage(tt) {
    const cv = $('apercuGarage'); const w = cv.clientWidth || 300, h = cv.clientHeight || 170, d = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }
    const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, w, h);
    c.fillStyle = 'rgba(0,0,0,.06)'; for (let i = 0; i < 10; i++) c.fillRect(((i * 60 - tt * 120) % (w + 60) + w + 60) % (w + 60) - 30, h * 0.82, 30, 4);
    const s = h / 2.0;
    dessinerJoueur(c, w * 0.55, h * 0.86 - Math.abs(Math.sin(tt * 2.4)) * 0.15 * s, s, { etat: 'glisse', tt, roue: tt * 20, flamme: 0.7, v: 9, penche: Math.sin(tt * 1.5) * 0.08 });
  }

  // ---------- Titre ----------
  function allerTitre() {
    mode = 'titre'; jeu = null; appui = false;
    $('hud').classList.add('cache'); cacherAstuce();
    montrer('ecranTitre');
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
    demo = null;
  }
  // Démo de l'écran titre : le caddie roule tout seul dans les rayons
  function majDemo(dt) {
    if (!demo || demo.x > demo.P.fin - 8) { demo = nouvelEtat((Math.floor(performance.now() / 20000) % 5) * 4); demo.P.limite = 1e9; demo.camFixe = true; demo.horloge = 0; }
    demo.horloge += dt;
    const presse = (demo.horloge % 2.6) < 1.4;
    const pas = 1 / 120; let r = dt;
    while (r > 1e-6) { const d = Math.min(pas, r); etape(demo, d, presse); r -= d; }
    demo.accidents = 0; demo.ev.length = 0;
    majEffets(demo, dt);
  }

  // =====================================================================
  //  Commandes : doigt, souris, clavier
  // =====================================================================
  function enCourse() { return mode === 'jeu' && jeu && !jeu.pause && !tutoCle; }
  // Après un clic sur un bouton, on lui retire le focus : Espace sert alors à courir, pas à recliquer.
  function libererFocus() { try { const a = document.activeElement; if (a && a !== document.body && a.blur) a.blur(); } catch (e) { /* rien */ } }
  toile.addEventListener('pointerdown', (e) => { if (enCourse()) { e.preventDefault(); Son.init(); Son.reprendre(); appui = true; } });
  window.addEventListener('pointerup', () => { appui = false; });
  window.addEventListener('pointercancel', () => { appui = false; });
  window.addEventListener('blur', () => { appui = false; });
  const TOUCHES = ['Space', 'ArrowUp', 'Enter', 'NumpadEnter', 'ArrowRight', 'KeyW', 'KeyZ'];
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (mode === 'jeu' && jeu) { e.preventDefault(); if (tutoCle) return; mettrePause(!jeu.pause); }
      return;
    }
    if (tutoCle && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); fermerTuto(); return; }
    if (enCourse() && TOUCHES.includes(e.code)) { e.preventDefault(); if (!e.repeat) { Son.init(); Son.reprendre(); } appui = true; }
  });
  window.addEventListener('keyup', (e) => { if (TOUCHES.includes(e.code)) appui = false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'jeu' && jeu && !jeu.pause && !tutoCle) mettrePause(true); });

  // Son
  function majBoutonsSon() {
    document.querySelectorAll('.btnSon').forEach((b) => { b.classList.toggle('coupe', !prog.son); b.setAttribute('aria-pressed', prog.son ? 'false' : 'true'); });
  }
  function basculerSon() {
    prog.son = !prog.son; Son.init(); Son.clic();
    try { localStorage.setItem('caddie-fusee-son', prog.son ? '1' : '0'); } catch (e) { /* pas de stockage */ }
    majBoutonsSon();
  }

  // Boutons des écrans
  $('btnJouer').addEventListener('click', () => {
    Son.init(); Son.clic();
    const nouvelle = () => lancerNiveau(0);
    if (!SAVE) { nouvelle(); return; }
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { chargerProg(); majBoutonsSon(); lancerNiveau(Math.min(NIVEAUX.length, Number(d.niveau) || 1) - 1); },
      onNouvelle: nouvelle,
      onEffacer: () => { chargerProg(); majBoutonsSon(); nouvelle(); },
    });
  });
  $('btnNiveaux').addEventListener('click', ouvrirNiveaux);
  $('btnGarage').addEventListener('click', ouvrirGarage);
  document.querySelectorAll('.btnRetour').forEach((b) => b.addEventListener('click', () => { Son.clic(); allerTitre(); }));
  document.querySelectorAll('.btnSon').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); basculerSon(); }));
  $('btnPause').addEventListener('click', () => { Son.init(); Son.clic(); mettrePause(true); try { $('btnReprendre').focus(); } catch (e) { /* rien */ } });
  // les petits boutons ronds du HUD ne gardent pas le focus (Espace = courir)
  document.querySelectorAll('#hud button').forEach((b) => b.addEventListener('mouseup', () => b.blur()));
  $('btnReprendre').addEventListener('click', () => { Son.clic(); mettrePause(false); });
  $('btnRecommencer').addEventListener('click', () => { Son.clic(); if (jeu) lancerNiveau(jeu.n); });
  $('btnPauseAccueil').addEventListener('click', () => { Son.clic(); if (jeu) sauverProg(jeu.n + 1, 0); allerTitre(); });
  $('btnTutoOk').addEventListener('click', fermerTuto);
  $('ecranTuto').addEventListener('click', (e) => { if (e.target === $('ecranTuto') || e.target === $('toileTuto')) fermerTuto(); });
  $('btnSuivant').addEventListener('click', () => { Son.clic(); lancerNiveau(jeu.n + 1); });
  $('btnRejouerV').addEventListener('click', () => { Son.clic(); lancerNiveau(jeu.n); });
  $('btnNiveauxV').addEventListener('click', ouvrirNiveaux);
  $('btnReessayer').addEventListener('click', () => { Son.clic(); lancerNiveau(jeu.n); });
  $('btnNiveauxD').addEventListener('click', ouvrirNiveaux);
  $('btnAccueilD').addEventListener('click', () => { Son.clic(); allerTitre(); });

  // Sauvegarde à la fermeture de la page (seulement pendant une course)
  if (SAVE) window.JEL_SAVE.surFermeture(() => {
    if (jeu && mode === 'jeu' && !APERCU) sauverProg(jeu.n + 1, 0);
  });

  // =====================================================================
  //  Boucle principale
  // =====================================================================
  let dernier = performance.now();
  function boucle(now) {
    const dt = Math.min(0.05, Math.max(0, (now - dernier) / 1000)); dernier = now;
    if (mode === 'jeu' && jeu) {
      if (!jeu.pause && !tutoCle && !jeu.gele) {
        let r = dt; const pas = 1 / 120;
        while (r > 1e-6) { const d = Math.min(pas, r); etape(jeu, d, appui); r -= d; if (jeu.ev.length) traiterEvenements(jeu, false); if (mode !== 'jeu') break; }
        majEffets(jeu, dt);
        majHud(jeu);
      }
      if (jeu) rendre(jeu);
    } else if (mode === 'bilan' && jeu) {
      jeu.tt += dt; majEffets(jeu, dt); rendre(jeu);
    } else if (mode !== 'affiche') {
      majDemo(dt); rendre(demo);
    }
    if (tutoCle) dessinerTuto();
    if (mode === 'garage') dessinerApercuGarage(now / 1000);
    requestAnimationFrame(boucle);
  }

  // =====================================================================
  //  Affiche (jaquette du jeu) — avec window.JEL_AFFICHE (posé par le robot du site)
  //  L'enfant, bras levés, s'envole dans son caddie fusée au bout d'une rampe de livraison,
  //  en attrapant une banane ; une pyramide d'oranges s'écroule au premier plan ; les lampes
  //  du plafond éclairent le rayon des fruits.
  // =====================================================================
  function cacherInterface() {
    ECRANS.forEach((e) => $(e).classList.add('cache'));
    $('hud').classList.add('cache');
    document.querySelectorAll('.jel-langue, [class*="jel-langue"]').forEach((el) => { el.style.display = 'none'; });
  }
  function dessinerAffiche() {
    const c = ctx; c.setTransform(DPR, 0, 0, DPR, 0, 0);
    const W = LW, H = LH, R = RAYONS.fruits;
    const s = Math.min(W / 3.1, H / 4.1);
    const Y = H * 0.8;
    // fond : rayon vu de côté, caméra plus proche
    const cam = 3;
    dessinerFond(c, R, cam, s * 0.55, Y, 0);
    // halo de lumière derrière le héros
    const hx = W * 0.56, hy = H * 0.38;
    const halo = c.createRadialGradient(hx, hy, 10, hx, hy, W * 0.75);
    halo.addColorStop(0, 'rgba(255,248,210,.95)'); halo.addColorStop(0.35, 'rgba(255,220,140,.55)'); halo.addColorStop(1, 'rgba(255,200,120,0)');
    c.fillStyle = halo; c.fillRect(0, 0, W, H);
    // rayons de lumière
    c.save(); c.translate(hx, hy);
    for (let i = 0; i < 14; i++) { c.rotate(Math.PI / 7); c.fillStyle = 'rgba(255,255,255,.16)'; c.beginPath(); c.moveTo(0, 0); c.lineTo(W, -W * 0.1); c.lineTo(W, W * 0.1); c.closePath(); c.fill(); }
    c.restore();
    dessinerSol(c, R, cam, s * 0.55, Y);
    // rampe à gauche (bord coupé)
    dessinerRampe(c, -W * 0.25, W * 0.2, Y, s * 0.75);
    // traînée de vitesse
    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineCap = 'round';
    for (let i = 0; i < 6; i++) { c.lineWidth = 4 + (i % 2) * 3; const y = H * (0.3 + i * 0.06); c.beginPath(); c.moveTo(W * 0.05, y + 20); c.lineTo(W * 0.28, y); c.stroke(); }
    // héros en grand, en plein vol
    const px = W * 0.56, py = H * 0.63;
    c.save(); c.translate(px, py); c.rotate(-0.16); c.translate(-px, -py);
    dessinerJoueur(c, px, py, s * 1.0, { etat: 'air', tt: 0.2, roue: 1, flamme: 1.3, v: 10, penche: 0, garage: { caddie: 'rouge', roue: 'normales', sticker: 'etoile' }, joie: true });
    c.restore();
    // étincelles de la fusée
    for (let i = 0; i < 14; i++) { const a = hache(i), b2 = hache(i + 40); etoilePath(c, W * (0.08 + a * 0.3), H * (0.5 + b2 * 0.16), 6 + a * 6, 3, 5); c.fillStyle = i % 2 ? '#ffd43b' : '#ff9f1c'; c.fill(); }
    // banane attrapée et fraise qui arrive
    const bx = W * 0.84, by = H * 0.37;
    const gl = c.createRadialGradient(bx, by, 5, bx, by, s * 0.4); gl.addColorStop(0, 'rgba(255,255,255,1)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = gl; c.beginPath(); c.arc(bx, by, s * 0.4, 0, Math.PI * 2); c.fill();
    dessinerProduit(c, 'banane', bx, by, s * 0.22);
    dessinerProduit(c, 'fraise', W * 0.9, H * 0.55, s * 0.15);
    for (let i = 0; i < 8; i++) { const a = i * 0.785; etoilePath(c, bx + Math.cos(a) * s * 0.42, by + Math.sin(a) * s * 0.42, 9, 4, 5); c.fillStyle = '#ffd43b'; c.fill(); }
    // pyramide d'oranges qui s'écroule au premier plan
    for (let i = 0; i < 12; i++) {
      const a = hache(i + 3), b2 = hache(i + 77);
      cercle(c, W * (0.68 + a * 0.36), H * (0.74 + b2 * 0.08) - (i > 7 ? 60 + a * 60 : 0), s * 0.1, ['#ff9f1c', '#ffbf47', '#f77f00'][i % 3]);
      cercle(c, W * (0.68 + a * 0.36) - s * 0.03, H * (0.74 + b2 * 0.08) - (i > 7 ? 60 + a * 60 : 0) - s * 0.03, s * 0.025, 'rgba(255,255,255,.6)');
    }
    dessinerPile(c, W * 0.74, H * 0.92, s * 0.55, { grande: false, h: 0.5, k: 0 }, 'fruits');
  }
  function demarrerAffiche() {
    mode = 'affiche';
    cacherInterface(); setTimeout(cacherInterface, 300); setTimeout(cacherInterface, 1200);
    dessinerAffiche();
  }

  // =====================================================================
  //  Images du jeu (page du jeu) — avec window.JEL_APERCU = 1, 2 ou 3
  //    1 = course 1 (fruits) : l'enfant court vers une banane de la liste
  //    2 = course 6 (surgelés) : il glisse sur le sol mouillé, un client traverse devant
  //    3 = course 15 (boulangerie), sur ordinateur : envol au-dessus d'une grande pile, promo éclair
  // =====================================================================
  function ouvrirApercu(numero) {
    Son.init = () => {};
    prog = progVide(); prog.tutos = ['base', 'pile', 'rampe', 'virage', 'mouille', 'client', 'tapis', 'grandepile', 'ballon', 'promo', 'pain', 'dos'];
    let seedA = 4242 + numero * 77; Math.random = () => { seedA = (seedA * 16807) % 2147483647; return seedA / 2147483647; };
    const nv = numero === 1 ? 2 : numero === 2 ? 5 : 14;
    lancerNiveau(nv);
    cacherAstuce();
    const J = jeu, P = J.P;
    if (numero === 1) {
      const premier = P.objets.filter((x) => x.liste)[0], ramp = P.rampes[0];
      premier.pris = true; J.listePrise = 1; cocherListe(premier.nom);
      J.x = ramp.x0 - 2.4; J.v = 8.6; J.etat = 'course'; J.pas = 3.3; J.t = 4.2; J.tt = 4.2;
      prog.garage = { caddie: 'rouge', roue: 'normales', sticker: 'aucun' };
    } else if (numero === 2) {
      const z = P.zones.find((x) => x.type === 'mouille'); const cl = P.clients.find((c) => c.x > z.x1);
      P.objets.filter((x) => x.liste).slice(0, 2).forEach((o) => { o.pris = true; J.listePrise++; cocherListe(o.nom); });
      P.objets.filter((x) => !x.liste && x.x < z.x0).forEach((o) => { o.pris = true; J.coupons++; });
      J.x = z.x0 + 6.2; J.v = 8.8; J.etat = 'glisse'; J.t = 15.3; J.penche = 0.08; J.glissade = 0;
      cl.ph = 0; J.tt = cl.per * 0.5; // le client traverse l'allée juste devant
      prog.garage = { caddie: 'bleu', roue: 'orange', sticker: 'coeur' };
    } else {
      const ramp = P.rampes[2]; const pr = P.promos[0];
      P.objets.filter((x) => x.liste && x.x < ramp.x0).forEach((o) => { o.pris = true; J.listePrise++; cocherListe(o.nom); });
      P.piles.filter((p) => p.x1 < ramp.x0 && !p.grande).forEach((p) => { p.tombe = false; });
      J.x = ramp.x1 + 0.9; J.y = 1.75; J.vy = 2.0; J.v = 10.5; J.etat = 'air'; J.t = 28; J.tt = 28; J.accidents = 1;
      pr.x = J.x + 6.5; pr.y = 1.2; pr.etat = 'visible'; pr.vie = 2.1;
      prog.garage = { caddie: 'fusee', roue: 'etoiles', sticker: 'eclair' };
      for (let i = 0; i < 18; i++) particule(J, { type: 'etoile', x: J.x - 1 - i * 0.12, y: J.y + 0.5 + (hache(i) - 0.5), vx: -1, vy: 0, rot: 0, vr: 2, vie: 1, t: 0.09, col: '#ffd43b', g: 0 });
    }
    J.ev.length = 0;
    J.camFixe = true; J.cam = J.x - (LW * placeJoueur()) / echelle();
    majHud(J);
    J.gele = true; // figé, sans fenêtre de pause
    rendre(J);
  }

  // =====================================================================
  //  Démarrage
  // =====================================================================
  try { document.title = t('titre'); } catch (e) { /* rien */ }
  chargerProg();
  majBoutonsSon();
  let boutonEffacer = null;
  if (window.JEL_AFFICHE) {
    demarrerAffiche();
    return;
  }
  if (APERCU) {
    ouvrirApercu(APERCU);
    requestAnimationFrame(boucle);
    return;
  }
  if (SAVE) boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('effacerTitre'), apres: () => { chargerProg(); majBoutonsSon(); } });
  allerTitre();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
