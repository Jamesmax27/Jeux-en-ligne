  "journal.p1": "Je m'appelle Iris. Hier soir, mon petit frère Noé est entré dans ce manoir pour un pari. Il n'est jamais ressorti. J'ai une lampe, ce carnet, et pas le choix.",
  "journal.p2": "La chose pâle du couloir ne bouge que quand je bouge. Si je m'arrête, elle s'arrête. Le manoir compte mes pas.",
  "journal.p3": "Elle ne sait pas faire le tour. Une armoire entre nous, et elle s'y cogne encore et encore, comme un papillon contre une vitre.",
  "journal.p4": "Ils sont deux maintenant. Ils ne passent pas l'un à travers l'autre. Je les ai regardés se gêner, et j'ai presque ri.",
  "journal.p5": "Dans la chapelle, une poupée de porcelaine. Quand je vais à droite, elle va à gauche. C'est mon reflet, en pire.",
  "journal.p6": "Sur les bancs, des prénoms gravés au couteau. Le dernier est celui de Noé. Les copeaux sont encore frais.",
  "journal.p7": "La statue de l'autel se cache le visage. Tant que je la regarde, elle reste de pierre.",
  "journal.p8": "J'ai tourné le dos une seule seconde. Elle était trois pas plus près. Je ne cligne plus des yeux.",
  "journal.p9": "La cave sent la terre mouillée. Le sol est percé de trappes. Ce qui tombe là-dedans ne remonte pas.",
  "journal.p10": "J'ai entendu quelque chose tomber dans le noir, puis plus rien. Les planches se sont refermées toutes seules.",
  "journal.p11": "Une clé rouillée pendait à un clou. Sur l'étiquette, une écriture d'enfant : « Pour ceux qui reviennent. »",
  "journal.p12": "Le manoir est construit autour d'un vieux puits. Les anciens propriétaires y jetaient tout ce qu'ils voulaient oublier.",
  "journal.p13": "Au grenier, des dizaines de bougies. Quand je souffle une flamme, ils ne me voient plus. Trois pas, pas un de plus.",
  "journal.p14": "Quelque chose de grand vit sous les poutres. Il fait deux pas quand j'en fais un, et il sait faire le tour des malles.",
  "journal.p15": "J'ai trouvé le pull de Noé accroché à une poutre. Il était encore chaud.",
  "journal.p16": "La chose du grenier n'a peur que d'une chose : le vide sous ses pieds.",
  "journal.p17": "Le jardin d'hiver est gelé. Sur la glace, mes pieds partent tout seuls. Eux marchent dessus comme sur un tapis.",
  "journal.p18": "Derrière la verrière, la neige tombe vers le haut. Le manoir ne veut pas que le matin arrive.",
  "journal.p19": "J'entends Noé m'appeler depuis la serre. Sa voix se rapproche d'un pas chaque fois que j'avance.",
  "journal.p20": "La porte du jardin est ouverte. Noé est assis dans la neige, il tremble, mais il est vivant. Derrière nous, plus rien ne bouge.",

  "journal.vide": "Page hidden in room {n}",
  "journal.p1": "My name is Iris. Last night, my little brother Noah walked into this manor on a dare. He never came out. I have a lamp, this notebook, and no choice.",
  "journal.p2": "The pale thing in the hallway only moves when I move. If I stop, it stops. The manor is counting my steps.",
  "journal.p3": "It can't go around things. Put a wardrobe between us and it bumps into it again and again, like a moth against a window.",
  "journal.p4": "There are two of them now. They can't pass through each other. I watched them get in each other's way, and I almost laughed.",
  "journal.p5": "In the chapel, a porcelain doll. When I go right, she goes left. She's my reflection, only worse.",
  "journal.p6": "On the pews, names carved with a knife. The last one is Noah's. The wood shavings are still fresh.",
  "journal.p7": "The statue on the altar hides its face. As long as I look at it, it stays stone.",
  "journal.p8": "I turned my back for one second. It was three steps closer. I don't blink anymore.",
  "journal.p9": "The cellar smells of wet earth. The floor is full of trapdoors. What falls in there never comes back up.",
  "journal.p10": "I heard something fall in the dark, then nothing. The boards closed again all by themselves.",
  "journal.p11": "A rusty key hung on a nail. On the tag, a child's handwriting: \"For those who come back.\"",
  "journal.p12": "The manor was built around an old well. The former owners threw everything they wanted to forget into it.",
  "journal.p13": "In the attic, dozens of candles. When I blow out a flame, they can't see me anymore. Three steps, not one more.",
  "journal.p14": "Something big lives under the beams. It takes two steps when I take one, and it knows how to get around the trunks.",
  "journal.p15": "I found Noah's sweater hanging from a beam. It was still warm.",
  "journal.p16": "The thing from the attic is afraid of only one thing: empty space under its feet.",
  "journal.p17": "The winter garden is frozen. On the ice, my feet slide away on their own. They walk on it like it's a carpet.",
  "journal.p18": "Behind the glass roof, the snow falls upward. The manor doesn't want morning to come.",
  "journal.p19": "I can hear Noah calling me from the greenhouse. His voice gets one step closer every time I move forward.",
  "journal.p20": "The garden door is open. Noah is sitting in the snow, shaking, but alive. Behind us, nothing moves anymore.",

  "journal.titre": "El diario de Iris",

  "journal.vide": "Página escondida en la sala {n}",
  "journal.p1": "Me llamo Iris. Anoche, mi hermanito Noé entró en esta mansión por una apuesta. Nunca salió. Tengo una lámpara, este cuaderno y ninguna otra opción.",
  "journal.p2": "La cosa pálida del pasillo solo se mueve cuando yo me muevo. Si me detengo, se detiene. La mansión cuenta mis pasos.",
  "journal.p3": "No sabe rodear nada. Un armario entre nosotros y se choca contra él una y otra vez, como una polilla contra un cristal.",
  "journal.p4": "Ahora son dos. No pueden atravesarse. Los vi estorbarse entre ellos y casi me reí.",
  "journal.p5": "En la capilla, una muñeca de porcelana. Cuando voy a la derecha, ella va a la izquierda. Es mi reflejo, pero peor.",
  "journal.p6": "En los bancos, nombres grabados con navaja. El último es el de Noé. Las virutas todavía están frescas.",
  "journal.p7": "La estatua del altar se tapa la cara. Mientras la miro, sigue siendo de piedra.",
  "journal.p8": "Le di la espalda un solo segundo. Estaba tres pasos más cerca. Ya no parpadeo.",
  "journal.p9": "El sótano huele a tierra mojada. El suelo está lleno de trampillas. Lo que cae ahí no vuelve a subir.",
  "journal.p10": "Oí algo caer en la oscuridad y luego nada. Las tablas se cerraron solas.",
  "journal.p11": "Una llave oxidada colgaba de un clavo. En la etiqueta, la letra de un niño: «Para los que vuelven».",
  "journal.p12": "La mansión se construyó alrededor de un viejo pozo. Los antiguos dueños tiraban ahí todo lo que querían olvidar.",
  "journal.p13": "En el desván, decenas de velas. Cuando apago una llama, ya no me ven. Tres pasos, ni uno más.",
  "journal.p14": "Algo grande vive bajo las vigas. Da dos pasos cuando yo doy uno, y sabe rodear los baúles.",
  "journal.p15": "Encontré el suéter de Noé colgado de una viga. Todavía estaba caliente.",
  "journal.p16": "La cosa del desván solo le teme a una cosa: el vacío bajo sus pies.",
  "journal.p17": "El jardín de invierno está helado. Sobre el hielo, mis pies se van solos. Ellos caminan encima como sobre una alfombra.",
  "journal.p18": "Detrás de la cristalera, la nieve cae hacia arriba. La mansión no quiere que llegue la mañana.",
  "journal.p19": "Oigo a Noé llamarme desde el invernadero. Su voz se acerca un paso cada vez que avanzo.",
  "journal.p20": "La puerta del jardín está abierta. Noé está sentado en la nieve, tiembla, pero está vivo. Detrás de nosotros, ya nada se mueve.",

  "tuto.spectre.titre": "Un paso, ellos avanzan",
  "tuto.spectre.texte": "Desliza el dedo, usa las flechas o WASD, o toca una casilla vecina para avanzar una casilla. A cada paso, el espectro avanza un paso hacia ti, por el lado más largo. Llega a la puerta y, si te atreves, recoge la página del diario.",
  "tuto.armoire.titre": "Los muebles",
  "tuto.armoire.texte": "El espectro no rodea nada: si un mueble está en su camino, se choca contra él y se queda atascado. Colócate de modo que un mueble quede entre ustedes.",
  "tuto.attendre.titre": "Esperar",
  "tuto.attendre.texte": "Toca el reloj de arena, tu propia casilla o la barra espaciadora para esperar: tú no te mueves, pero ellos sí. Ideal para atraer a una criatura contra un mueble.",
  "tuto.deux.titre": "Se estorban",
  "tuto.deux.texte": "Una criatura nunca atraviesa a otra. Usa una para bloquear a la otra.",
  "tuto.poupee.titre": "La muñeca",
  "tuto.poupee.texte": "La muñeca copia tu gesto como en un espejo: si vas a la izquierda, ella va a la derecha; si subes, ella sube. Cuando esperas, ella espera.",
  "tuto.statue.titre": "La estatua",
  "tuto.statue.texte": "La estatua solo se mueve si le das la espalda. Tu último paso marca hacia dónde miras. Sus ojos rojos se encienden cuando va a avanzar.",
  "tuto.trappe.titre": "Las trampillas",
  "tuto.trappe.texte": "No puedes cruzar una trampilla. Una criatura que la pisa cae, y la trampilla se cierra: se convierte en un paso.",
  "tuto.cle.titre": "La llave",
  "tuto.cle.texte": "Un candado cierra la puerta. Primero recoge la llave y luego corre hacia la salida.",
  "tuto.bougie.titre": "Las velas",
  "tuto.bougie.texte": "Pisa una vela para apagarla. En la oscuridad, las criaturas se quedan inmóviles durante 3 pasos.",
  "tuto.chose.titre": "La cosa del desván",
  "tuto.chose.texte": "La cosa avanza dos casillas en cada paso. Si un obstáculo la estorba, prueba por el otro lado. Solo las trampillas y las otras criaturas la detienen de verdad.",
  "tuto.glace.titre": "El hielo",
  "tuto.glace.texte": "Sobre el hielo te deslizas hasta el final, en un solo paso. Las criaturas, en cambio, caminan sobre él con normalidad."

  "journal.titre": "O diário de Iris",
  "journal.compte": "{n} páginas de {max}",
  "journal.numero": "Página {n}",
  "journal.vide": "Página escondida na sala {n}",
  "journal.p1": "Meu nome é Iris. Ontem à noite, meu irmãozinho Noé entrou nesta mansão por causa de uma aposta. Ele nunca saiu. Eu tenho uma lanterna, este caderno e nenhuma escolha.",
  "journal.p2": "A coisa pálida do corredor só se mexe quando eu me mexo. Se eu paro, ela para. A mansão conta os meus passos.",
  "journal.p3": "Ela não sabe dar a volta. Um armário entre nós, e ela bate nele de novo e de novo, como uma mariposa contra o vidro.",
  "journal.p4": "Agora são dois. Eles não atravessam um ao outro. Fiquei olhando os dois se atrapalharem e quase ri.",
  "journal.p5": "Na capela, uma boneca de porcelana. Quando eu vou para a direita, ela vai para a esquerda. É o meu reflexo, só que pior.",
  "journal.p6": "Nos bancos, nomes gravados a faca. O último é o do Noé. As lascas de madeira ainda estão frescas.",
  "journal.p7": "A estátua do altar esconde o rosto. Enquanto eu olho para ela, ela continua de pedra.",
  "journal.p8": "Virei de costas por um segundo. Ela estava três passos mais perto. Eu não pisco mais.",
  "journal.p9": "O porão tem cheiro de terra molhada. O chão é cheio de alçapões. O que cai ali não volta.",
  "journal.p10": "Ouvi algo cair no escuro, depois mais nada. As tábuas se fecharam sozinhas.",
  "journal.p11": "Uma chave enferrujada estava pendurada num prego. Na etiqueta, uma letra de criança: \"Para quem volta.\"",
  "journal.p12": "A mansão foi construída em volta de um velho poço. Os antigos donos jogavam lá dentro tudo o que queriam esquecer.",
  "journal.p13": "No sótão, dezenas de velas. Quando apago uma chama, eles não me veem mais. Três passos, nem um a mais.",
  "journal.p14": "Algo grande vive debaixo das vigas. Ele dá dois passos quando eu dou um, e sabe contornar os baús.",
  "journal.p15": "Encontrei o moletom do Noé pendurado numa viga. Ainda estava quente.",
  "journal.p16": "A coisa do sótão só tem medo de uma coisa: o vazio debaixo dos pés.",
  "journal.p17": "O jardim de inverno está congelado. No gelo, meus pés escorregam sozinhos. Eles andam em cima como se fosse um tapete.",
  "journal.p18": "Atrás do teto de vidro, a neve cai para cima. A mansão não quer que a manhã chegue.",
  "journal.p19": "Ouço o Noé me chamando da estufa. A voz dele chega um passo mais perto toda vez que eu avanço.",
  "journal.p20": "A porta do jardim está aberta. Noé está sentado na neve, tremendo, mas vivo. Atrás de nós, nada mais se mexe.",

 "de": {
  "titre": "Ein Schritt, sie kommen näher",
  "titre.consigne": "Wische, um ein Feld weiterzugehen. Bei jedem deiner Schritte machen auch die Kreaturen einen. Erreiche die Tür, ohne gefangen zu werden.",
  "titre.age": "Empfohlen ab 13 Jahren",
  "bouton.jouer": "Spielen",

  "salles.titre": "Die Räume des Herrenhauses",

  "journal.titre": "Iris' Tagebuch",
  "journal.compte": "{n} von {max} Seiten",
  "journal.numero": "Seite {n}",
  "journal.vide": "Seite versteckt in Raum {n}",
  "journal.p1": "Ich heiße Iris. Gestern Abend ist mein kleiner Bruder Noah wegen einer Wette in dieses Herrenhaus gegangen. Er ist nie wieder herausgekommen. Ich habe eine Lampe, dieses Heft und keine Wahl.",
  "journal.p2": "Das bleiche Ding im Flur bewegt sich nur, wenn ich mich bewege. Bleibe ich stehen, bleibt es stehen. Das Haus zählt meine Schritte.",
  "journal.p3": "Es kann nicht außen herumgehen. Ein Schrank zwischen uns, und es stößt immer wieder dagegen, wie eine Motte gegen eine Scheibe.",
  "journal.p4": "Jetzt sind es zwei. Sie können nicht durcheinander hindurch. Ich habe zugesehen, wie sie sich gegenseitig im Weg standen, und fast gelacht.",
  "journal.p5": "In der Kapelle eine Porzellanpuppe. Wenn ich nach rechts gehe, geht sie nach links. Sie ist mein Spiegelbild, nur schlimmer.",
  "journal.p6": "In die Bänke sind Namen geritzt. Der letzte ist der von Noah. Die Holzspäne sind noch frisch.",
  "journal.p7": "Die Statue am Altar verbirgt ihr Gesicht. Solange ich sie ansehe, bleibt sie aus Stein.",
  "journal.p8": "Ich habe ihr eine einzige Sekunde den Rücken zugedreht. Sie war drei Schritte näher. Ich blinzle nicht mehr.",
  "journal.p9": "Der Keller riecht nach nasser Erde. Der Boden ist voller Falltüren. Was dort hineinfällt, kommt nicht wieder hoch.",
  "journal.p10": "Ich habe etwas im Dunkeln fallen hören, dann nichts mehr. Die Bretter haben sich von selbst wieder geschlossen.",
  "journal.p11": "Ein rostiger Schlüssel hing an einem Nagel. Auf dem Anhänger eine Kinderschrift: „Für alle, die zurückkommen.“",
  "journal.p12": "Das Herrenhaus wurde um einen alten Brunnen gebaut. Die früheren Besitzer warfen alles hinein, was sie vergessen wollten.",
  "journal.p13": "Auf dem Dachboden Dutzende Kerzen. Wenn ich eine Flamme ausblase, sehen sie mich nicht mehr. Drei Schritte, keinen mehr.",
  "journal.p14": "Unter den Balken lebt etwas Großes. Es macht zwei Schritte, wenn ich einen mache, und es weiß, wie man um die Truhen herumkommt.",
  "journal.p15": "Ich habe Noahs Pulli an einem Balken hängen sehen. Er war noch warm.",
  "journal.p16": "Das Ding vom Dachboden fürchtet nur eines: die Leere unter seinen Füßen.",

<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');

      element: element,
      maj: function () {

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {

      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {

  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {

    var ok = false;

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },

  function texte(cle, vars) {

    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +

  }

  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {

    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);

  }

    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,

    existe: existe,

<script>
'use strict';
/* =====================================================================
   Un Pas, Ils Avancent — puzzle d'horreur au tour par tour.
   Le joueur avance d'une case ; chaque créature avance alors selon sa
   règle. Les règles sont dans un bloc pur (REGLES) : le même code fait
   tourner la partie, les démonstrations du tutoriel et le calcul du
   nombre de pas minimum de chaque salle.
   ===================================================================== */

/* REGLES-DEBUT : règles pures du jeu (aucun accès à la page). */
const REGLES = (() => {
  // Directions : 0 haut, 1 droite, 2 bas, 3 gauche, 4 attendre sur place.
  const DX = [0, 1, 0, -1, 0];
  const DY = [-1, 0, 1, 0, 0];
  const MIROIR = [0, 3, 2, 1, 4]; // la poupée : gauche et droite inversées
  const AVEUGLE = 3;              // tours de noir quand on souffle une bougie
  const MONSTRES = 'SDTG';        // spectre, poupée, statue, chose du grenier

  function nouvelEtat(niv) {
    const carte = niv.carte;
    const H = carte.length, W = carte[0].length;
    const c = [];
    const m = [];
    let px = 0, py = 0, cle = true;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const k = carte[y][x];
        if (k === 'P') { px = x; py = y; c.push('.'); }
        else if (MONSTRES.includes(k)) { m.push({ t: k, x, y, v: true }); c.push('.'); }
        else { c.push(k); if (k === 'K') cle = false; }
      }
    }
    return { W, H, c, px, py, dir: 0, pas: 0, m, cle, page: false, aveugle: 0, fin: null, qui: -1 };
  }

  function cloner(e) {
    return { W: e.W, H: e.H, c: e.c.slice(), px: e.px, py: e.py, dir: e.dir, pas: e.pas,
      m: e.m.map((o) => ({ t: o.t, x: o.x, y: o.y, v: o.v })), cle: e.cle, page: e.page, aveugle: e.aveugle, fin: e.fin, qui: e.qui };
  }

  function dedans(e, x, y) { return x >= 0 && y >= 0 && x < e.W && y < e.H; }
  function monstreA(e, x, y) {
    for (let i = 0; i < e.m.length; i++) { const o = e.m[i]; if (o.v && o.x === x && o.y === y) return i; }
    return -1;
  }
  // Le joueur passe partout sauf murs, meubles, trappes ouvertes et porte verrouillée.
  function libreJoueur(e, x, y) {
    if (!dedans(e, x, y)) return false;
    const k = e.c[y * e.W + x];
    if (k === '#' || k === 'A' || k === 'O') return false;
    if (k === 'E' && !e.cle) return false;
    return true;
  }
  // Une créature ne franchit ni mur, ni meuble, ni la porte, ni une autre créature ;
  // sur une trappe ouverte, elle tombe.
  function libreMonstre(e, x, y) {
    if (!dedans(e, x, y)) return false;
    const k = e.c[y * e.W + x];
    if (k === '#' || k === 'A' || k === 'E') return false;
    return monstreA(e, x, y) < 0;
  }
  // La statue ne bouge que si le joueur lui tourne le dos (son dernier pas donne son regard).
  function dansLeDos(e, o) {
    const rx = o.x - e.px, ry = o.y - e.py;
    return rx * DX[e.dir] + ry * DY[e.dir] < 0;
  }
  // Pas vers le joueur par le plus long côté (à égalité : de côté), puis l'autre côté.
  function axePrincipal(e, o) {
    const dx = e.px - o.x, dy = e.py - o.y;
    if (dx === 0 && dy === 0) return [];
    const h = dx > 0 ? 1 : 3, v = dy > 0 ? 2 : 0;
    if (Math.abs(dx) >= Math.abs(dy)) return dy === 0 ? [h] : [h, v];
    return dx === 0 ? [v] : [v, h];
  }

  function ramasser(e, ev) {
    const i = e.py * e.W + e.px;

}

let appui = null;
cv.addEventListener('pointerdown', (e) => {
  if (G.phase !== 'jeu') return;
  appui = { x: e.clientX, y: e.clientY, id: e.pointerId };
  try { cv.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
});
cv.addEventListener('pointerup', (e) => {
  if (!appui || G.phase !== 'jeu') { appui = null; return; }
  const dx = e.clientX - appui.x, dy = e.clientY - appui.y;
  appui = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 22) {
    action(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
    return;
  }
  // toucher : une case voisine = un pas, sa propre case = attendre
  const v = G.vue;
  const cx = Math.floor((e.clientX - v.ox) / v.cs), cy = Math.floor((e.clientY - v.oy) / v.cs);
  const ex = G.etat.px, ey = G.etat.py;
  if (cx === ex && cy === ey) { action(4); return; }
  const ddx = cx - ex, ddy = cy - ey;
  if (Math.abs(ddx) + Math.abs(ddy) === 1) action(ddx === 1 ? 1 : ddx === -1 ? 3 : ddy === 1 ? 2 : 0);
});
cv.addEventListener('pointercancel', () => { appui = null; });
document.addEventListener('keydown', (e) => {
  if (e.target && e.target.closest && e.target.closest('.jel-langue')) return;
  const c = e.code;
  if (G.phase === 'jeu') {
    const dirs = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
    if (c in dirs) { e.preventDefault(); action(dirs[c]); return; }
    if (c === 'Space' || c === 'Period' || c === 'Numpad5') { e.preventDefault(); action(4); return; }
    if (c === 'KeyU' || c === 'Backspace') { e.preventDefault(); annuler(); return; }
    if (c === 'KeyR') { e.preventDefault(); recommencer(); return; }
    if (c === 'Escape' || c === 'KeyP') { e.preventDefault(); mettrePause(); return; }
  } else if (G.phase === 'pause') {
    if (c === 'Escape' || c === 'KeyP') { e.preventDefault(); reprendre(); }
  } else if (G.phase === 'tuto') {
    if (c === 'Enter' || c === 'Space') { e.preventDefault(); fermerTuto(); }
  } else if (G.phase === 'defaite') {

    else if (c === 'KeyR') { e.preventDefault(); recommencer(); }
  }
});

    // brume bleutée
    const brume = g.createLinearGradient(0, h * 0.4, 0, h * 0.7); brume.addColorStop(0, 'rgba(150,170,210,0)'); brume.addColorStop(1, 'rgba(150,170,210,.22)');
    g.fillStyle = brume; g.fillRect(0, h * 0.4, w, h * 0.3);
    // héroïne au premier plan, lanterne levée
    heroAffiche(g, w * 0.36, h * 0.6, h * 0.5);
    // premier plan : guéridon et bougie coupés par le bord
    g.fillStyle = '#2a160c'; g.fillRect(w * 0.82, h * 0.7, w * 0.3, h * 0.04); g.fillRect(w * 0.88, h * 0.74, w * 0.05, h * 0.26);
    dessinerBougie(g, w * 0.84, h * 0.6, h * 0.12, true, tps);
    // vignette
    const vg = g.createRadialGradient(w / 2, h * 0.45, h * 0.25, w / 2, h * 0.45, h * 0.8); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)');
    g.fillStyle = vg; g.fillRect(0, 0, w, h);
  };
  peindre();
  window.addEventListener('resize', peindre);
}
// Héroïne de l'affiche : de trois quarts, elle se retourne, lanterne à la main.
function heroAffiche(g, x, y, s) {
  g.save(); g.translate(x, y);
  // lueur de la lanterne
  const lx = s * 0.3, ly = -s * 0.12;
  const hal = g.createRadialGradient(lx, ly, 0, lx, ly, s * 0.6); hal.addColorStop(0, 'rgba(255,200,110,.75)'); hal.addColorStop(1, 'rgba(255,170,80,0)');
  g.fillStyle = hal; g.beginPath(); g.arc(lx, ly, s * 0.6, 0, 7); g.fill();
  // corps (veste sombre éclairée côté lanterne, contour froid)
  const veste = g.createLinearGradient(-s * 0.3, 0, s * 0.34, 0); veste.addColorStop(0, '#16302f'); veste.addColorStop(0.6, '#2a5a5c'); veste.addColorStop(1, '#6a7a5a');
  g.fillStyle = veste;
  g.beginPath(); g.moveTo(-s * 0.3, s * 0.55); g.quadraticCurveTo(-s * 0.34, -s * 0.02, -s * 0.12, -s * 0.12); g.lineTo(s * 0.14, -s * 0.12); g.quadraticCurveTo(s * 0.34, -s * 0.02, s * 0.32, s * 0.55); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(170,210,255,.7)'; g.lineWidth = s * 0.012; g.beginPath(); g.moveTo(-s * 0.3, s * 0.5); g.quadraticCurveTo(-s * 0.34, -s * 0.02, -s * 0.12, -s * 0.12); g.stroke();
  // fermeture éclair, poche et écharpe rouge
  g.strokeStyle = 'rgba(10,20,20,.6)'; g.lineWidth = s * 0.008; g.beginPath(); g.moveTo(s * 0.01, -s * 0.05); g.lineTo(s * 0.03, s * 0.55); g.stroke();
  g.strokeRect(-s * 0.2, s * 0.25, s * 0.12, s * 0.1);
  g.fillStyle = '#a8323a'; g.beginPath(); g.ellipse(s * 0.0, -s * 0.09, s * 0.15, s * 0.05, 0.05, 0, 7); g.fill();
  g.fillRect(-s * 0.1, -s * 0.08, s * 0.06, s * 0.2);
  // capuche
  g.fillStyle = '#2a5258'; g.beginPath(); g.ellipse(-s * 0.02, -s * 0.28, s * 0.2, s * 0.22, 0, 0, 7); g.fill();
  // visage éclairé par la lanterne
  const vis = g.createLinearGradient(-s * 0.12, 0, s * 0.14, 0); vis.addColorStop(0, '#b08868'); vis.addColorStop(1, '#ffd8b0');
  g.fillStyle = vis; g.beginPath(); g.ellipse(s * 0.02, -s * 0.26, s * 0.13, s * 0.16, 0.1, 0, 7); g.fill();
  g.fillStyle = '#2a1810'; g.beginPath(); g.moveTo(-s * 0.13, -s * 0.3); g.quadraticCurveTo(-s * 0.02, -s * 0.46, s * 0.14, -s * 0.33); g.quadraticCurveTo(s * 0.02, -s * 0.36, -s * 0.13, -s * 0.22); g.fill();
  // yeux écarquillés vers l'arrière (vers les créatures)
  g.fillStyle = '#fff'; g.beginPath(); g.ellipse(-s * 0.02, -s * 0.25, s * 0.026, s * 0.02, 0, 0, 7); g.ellipse(s * 0.07, -s * 0.25, s * 0.026, s * 0.02, 0, 0, 7); g.fill();
  g.fillStyle = '#1a0e08'; g.beginPath(); g.arc(s * 0.0, -s * 0.255, s * 0.012, 0, 7); g.arc(s * 0.088, -s * 0.255, s * 0.012, 0, 7); g.fill();
  g.strokeStyle = '#7a4030'; g.lineWidth = s * 0.008; g.beginPath(); g.ellipse(s * 0.035, -s * 0.18, s * 0.025, s * 0.012, 0, 0, 7); g.stroke();
  // bras levé et lanterne
  g.strokeStyle = '#1f3d42'; g.lineWidth = s * 0.08; g.lineCap = 'round'; g.beginPath(); g.moveTo(s * 0.18, -s * 0.02); g.quadraticCurveTo(s * 0.32, s * 0.02, s * 0.3, -s * 0.06); g.stroke();
  g.fillStyle = '#3a2c1c'; g.fillRect(lx - s * 0.06, ly - s * 0.09, s * 0.12, s * 0.16);
  g.fillStyle = '#ffd27a'; g.fillRect(lx - s * 0.045, ly - s * 0.06, s * 0.09, s * 0.11);
  g.strokeStyle = '#3a2c1c'; g.lineWidth = s * 0.01; g.beginPath(); g.arc(lx, ly - s * 0.09, s * 0.05, Math.PI, 0); g.stroke();
  g.restore();
}

/* ---------- Images du jeu (window.JEL_APERCU) ---------- */
function ouvrirApercu(n) {
  apercu = n;
  chargerProgression();
  // 1 : le couloir et le premier spectre ; 2 : la chose du grenier ; 3 : la salle finale du jardin d'hiver
  const i = n === 1 ? 0 : n === 2 ? 13 : 19;
  const coups = n === 1 ? 2 : n === 2 ? 4 : 5;
  G.i = i; G.niv = NIVEAUX[i];
  let e = REGLES.nouvelEtat(G.niv);
  const sol = G.niv.sol || '';
  for (let k = 0; k < Math.min(coups, sol.length); k++) { const r = REGLES.jouer(e, CODE_DIR[sol[k]]); if (r.tour && !r.etat.fin) e = r.etat; }
  G.etat = e; G.pile = [REGLES.nouvelEtat(G.niv)];
  G.phase = 'jeu'; G.intro = -10; G.temps = 1;
  redim(); cacherEcrans(); majLegende(); majHud(); majSon();
  document.querySelectorAll('.jel-langue').forEach((x) => { x.style.display = 'none'; });
  requestAnimationFrame(boucle);
  // partie figée : aucun geste ne fait bouger la salle (action() ne joue pas en mode aperçu)
}

/* ---------- Démarrage ---------- */
function init() {
  chargerProgression();
  redim();
  if (window.JEL_AFFICHE) {
    document.querySelectorAll('.ecran').forEach((x) => x.classList.add('cache'));
    const cacher = () => document.querySelectorAll('.jel-langue').forEach((x) => { x.style.display = 'none'; });
    cacher(); setTimeout(cacher, 300);
    dessinerAffiche();
    return;
  }
  if (window.JEL_APERCU) { ouvrirApercu(Number(window.JEL_APERCU)); return; }
  brancher();
  majSon();
  montrerTitre();
  requestAnimationFrame(boucle);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
