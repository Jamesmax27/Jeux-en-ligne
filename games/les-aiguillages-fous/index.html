<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }

        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);

        history.replaceState(history.state, '', adresse.href);

  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });

      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];

    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);

      } catch (e) { /* stockage plein ou refusé */ }

      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.

    try { texte = JSON.stringify(tout); } catch (e) { return false; }

      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });

    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>
  :root { --encre: #1d2433; --creme: #fffaf0; --or: #ffcf3f; --bleu: #2f80e4; --vert: #35b35a; --rouge: #e5483f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7fbf55; font-family: ui-rounded, "Segoe UI", system-ui, sans-serif; color: var(--encre); touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; cursor: pointer; }
  .btn { min-height: 48px; min-width: 48px; padding: 10px 20px; border: 0; border-radius: 16px; background: #fff; color: var(--encre); font-weight: 800; font-size: 17px; box-shadow: 0 4px 0 #c9c2b0, 0 6px 14px rgba(0,0,0,.18); transition: transform .08s; line-height: 1.15; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c9c2b0; }
  .btn.principal { background: var(--or); box-shadow: 0 4px 0 #c79a12, 0 6px 14px rgba(0,0,0,.2); }
  .btn.vert { background: #5fd17e; box-shadow: 0 4px 0 #2f9a4d, 0 6px 14px rgba(0,0,0,.2); }
  .btn:focus-visible, .rond:focus-visible, .case:focus-visible, .carte-depot:focus-visible { outline: 4px solid #2f80e4; outline-offset: 3px; }
  .rond { width: 46px; height: 46px; border: 0; border-radius: 50%; background: rgba(255,255,255,.92); color: var(--encre); display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 rgba(0,0,0,.18); padding: 0; }
  .rond svg { width: 26px; height: 26px; }
  .ecran { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .ecran.actif { display: flex; }
  .voile { background: rgba(20, 28, 45, .45); }
  .panneau { background: var(--creme); border-radius: 26px; padding: 22px 20px; width: min(94vw, 520px); max-height: 94vh; overflow-y: auto; text-align: center; box-shadow: 0 14px 40px rgba(0,0,0,.3); border: 4px solid #fff; }
  .panneau h2 { margin: 0 0 8px; font-size: 26px; }
  .panneau p { margin: 8px 0; font-size: 17px; line-height: 1.35; }
  .ligne { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .coin-langue { display: flex; justify-content: center; margin-top: 10px; min-height: 44px; }
  /* Écran titre */
  #ecran-titre { align-items: stretch; justify-content: space-between; flex-direction: column; padding: max(16px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); background: linear-gradient(rgba(255,250,235,.0), rgba(255,250,235,0) 60%, rgba(30,40,60,.25)); }
  .titre-haut { text-align: center; margin-top: 4vh; }
  .titre-haut h1 { margin: 0 auto; font-size: clamp(38px, 10vw, 76px); line-height: .98; color: #fff; letter-spacing: .5px; text-shadow: 0 4px 0 #b4471f, 0 7px 0 #7b2a10, 0 12px 24px rgba(0,0,0,.35); max-width: 12ch; }
  .titre-haut p { display: inline-block; margin: 16px auto 0; max-width: 30em; background: rgba(255,250,240,.93); padding: 10px 16px; border-radius: 16px; font-size: 17px; font-weight: 700; line-height: 1.35; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .titre-bas { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .titre-bas .btn.principal { font-size: 26px; padding: 16px 58px; border-radius: 22px; }
  .titre-outils { position: absolute; top: max(10px, env(safe-area-inset-top)); right: 12px; display: flex; gap: 8px; }
  #place-langue-titre { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 12px; }
  /* Barre du haut pendant la partie */
  #hud { position: fixed; left: 0; right: 0; top: 0; height: 58px; display: none; align-items: center; gap: 8px; padding: 6px 8px; padding-top: max(6px, env(safe-area-inset-top)); background: linear-gradient(rgba(255,250,240,.96), rgba(255,250,240,.9)); box-shadow: 0 3px 10px rgba(0,0,0,.18); z-index: 5; }
  #hud.actif { display: flex; }
  .hud-milieu { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  #hud-niveau { font-size: 13px; font-weight: 800; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .hud-stats { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 18px; }
  .hud-stats span { display: inline-flex; align-items: center; gap: 4px; }
  .hud-stats svg { width: 22px; height: 22px; }
  #hud-etoiles svg { width: 22px; height: 22px; transition: transform .3s, opacity .3s; }
  #hud-etoiles svg.perdue { opacity: .25; transform: scale(.75) rotate(-20deg); filter: grayscale(1); }
  /* Bulle d'astuce et annonces */
  #astuce { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(92vw, 520px); background: #fffaf0; border: 3px solid #ffcf3f; border-radius: 18px; padding: 10px 14px; font-weight: 800; font-size: 16px; line-height: 1.3; text-align: center; box-shadow: 0 8px 22px rgba(0,0,0,.25); z-index: 6; display: none; }
  #astuce.actif { display: block; animation: monte .35s ease-out; }
  #annonce { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); width: min(92vw, 520px); background: #2c3e66; color: #fff; border-radius: 16px; padding: 10px 14px; font-weight: 800; font-size: 16px; text-align: center; box-shadow: 0 8px 22px rgba(0,0,0,.3); z-index: 6; display: none; }
  #annonce.actif { display: block; animation: monte .35s ease-out; }
  @keyframes monte { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  /* Niveaux */
  .regions { text-align: left; }
  .region h3 { margin: 12px 4px 6px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .region h3 i { display: inline-block; width: 16px; height: 16px; border-radius: 5px; }
  .cases { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .case { min-height: 62px; border: 0; border-radius: 14px; background: #fff; box-shadow: 0 3px 0 #cfc7b4; font-weight: 900; font-size: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; color: var(--encre); }
  .case .mini { display: flex; gap: 1px; }
  .case .mini svg { width: 14px; height: 14px; }
  .case[disabled] { background: #e5e0d4; color: #8a8576; cursor: default; box-shadow: none; }
  .case.courant { outline: 3px solid var(--or); }
  /* Dépôt */
  .grille-depot { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 6px 0 12px; }
  .carte-depot { border: 3px solid transparent; border-radius: 16px; background: #fff; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 15px; box-shadow: 0 3px 0 #cfc7b4; color: var(--encre); min-height: 44px; }
  .carte-depot canvas { width: 110px; height: 56px; }
  .carte-depot.choisi { border-color: var(--vert); background: #effbe9; }
  .carte-depot[disabled] { opacity: .7; cursor: default; background: #ece7db; }
  .carte-depot small { font-weight: 700; font-size: 13px; opacity: .8; }
  /* Nouveauté */
  #nv-canvas { width: min(100%, 320px); aspect-ratio: 4 / 3; border-radius: 18px; background: #8fcf62; display: block; margin: 8px auto; box-shadow: inset 0 0 0 3px rgba(0,0,0,.08); }
  .badge-nv { display: inline-block; background: var(--rouge); color: #fff; font-weight: 900; padding: 4px 14px; border-radius: 99px; font-size: 15px; letter-spacing: .5px; }
  /* Fin de niveau */
  .etoiles-fin { display: flex; justify-content: center; gap: 6px; margin: 6px 0; min-height: 70px; }
  .etoiles-fin svg { width: 64px; height: 64px; opacity: .2; transform: scale(.6); transition: transform .4s cubic-bezier(.3,1.8,.5,1), opacity .3s; }
  .etoiles-fin svg.on { opacity: 1; transform: scale(1); }
  .gros-chiffre { font-size: 34px !important; font-weight: 900; margin: 4px 0 !important; }
  .debloque { background: #effbe9; border-radius: 14px; padding: 8px; font-weight: 800; }
  .bilan { background: #fff3c4; border-radius: 14px; padding: 8px; font-weight: 800; }
  [hidden] { display: none !important; }
  @media (min-width: 900px) { .panneau { width: min(80vw, 600px); } .cases { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<!-- Barre du haut pendant la partie -->
<div id="hud">
  <button class="rond" id="b-pause" data-i18n-aria="ui.pause"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/></svg></button>
  <div class="hud-milieu">
    <div id="hud-niveau"></div>
    <div class="hud-stats">
      <span data-i18n-title="hud.livraisons"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="13" height="9" rx="2" fill="#e5483f"/><rect x="11" y="4" width="5" height="5" rx="1" fill="#a8261f"/><rect x="16" y="10" width="5" height="6" rx="1.5" fill="#e5483f"/><circle cx="7" cy="18" r="2.4" fill="#333"/><circle cx="14" cy="18" r="2.4" fill="#333"/></svg><b id="hud-livres"></b></span>
      <span id="hud-etoiles" data-i18n-title="hud.etoiles"></span>
      <span data-i18n-title="hud.score"><b id="hud-score"></b></span>
    </div>
  </div>
  <button class="rond b-son" data-i18n-aria="ui.son"></button>
</div>
<div id="astuce" role="status"></div>
<div id="annonce" role="status"></div>

<!-- Écran titre -->
<section class="ecran actif" id="ecran-titre">
  <div id="place-langue-titre"></div>
  <div class="titre-outils"><button class="rond b-son" data-i18n-aria="ui.son"></button></div>
  <div class="titre-haut">
    <h1 data-i18n="titre"></h1>
    <p data-i18n="titre.consigne"></p>
  </div>
  <div class="titre-bas">
    <button class="btn principal" id="b-jouer" data-i18n="ui.jouer"></button>
    <div class="ligne" style="margin-top:0">
      <button class="btn" id="b-niveaux" data-i18n="ui.niveaux"></button>
      <button class="btn" id="b-depot" data-i18n="ui.depot"></button>

</section>

<!-- Choix du niveau -->

  // ------------------------------------------------------------------
  // Petits outils
  // ------------------------------------------------------------------
  function graine(n) { // hasard reproductible (même horaire à chaque essai)
    let a = (n * 2654435761) >>> 0 || 1;
    return function () { a ^= a << 13; a >>>= 0; a ^= a >> 17; a ^= a << 5; a >>>= 0; return (a % 100000) / 100000; };
  }
  const LONGUEURS = { loco: 0.5, wagon: 0.42, ecart: 0.07 };

  // Échantillonne une voie (coins arrondis) en points rapprochés.
  function echantillonner(pts) {
    const out = [{ x: pts[0][0], y: pts[0][1] }];
    const ajouterLigne = (x, y) => {
      const p = out[out.length - 1];
      const d = Math.hypot(x - p.x, y - p.y);
      const n = Math.max(1, Math.ceil(d / 0.08));
      for (let i = 1; i <= n; i++) out.push({ x: p.x + (x - p.x) * i / n, y: p.y + (y - p.y) * i / n });
    };
    for (let i = 1; i < pts.length - 1; i++) {
      const a = pts[i - 1], b = pts[i], c = pts[i + 1];
      const l1 = Math.hypot(b[0] - a[0], b[1] - a[1]), l2 = Math.hypot(c[0] - b[0], c[1] - b[1]);
      const r = Math.min(0.7, l1 * 0.45, l2 * 0.45);
      const ax = b[0] - (b[0] - a[0]) / l1 * r, ay = b[1] - (b[1] - a[1]) / l1 * r;
      const bx = b[0] + (c[0] - b[0]) / l2 * r, by = b[1] + (c[1] - b[1]) / l2 * r;
      ajouterLigne(ax, ay);
      for (let k = 1; k <= 10; k++) {
        const u = k / 10, v = 1 - u;
        out.push({ x: v * v * ax + 2 * u * v * b[0] + u * u * bx, y: v * v * ay + 2 * u * v * b[1] + u * u * by });
      }
    }
    const fin = pts[pts.length - 1];
    ajouterLigne(fin[0], fin[1]);
    const cum = [0];
    for (let i = 1; i < out.length; i++) cum.push(cum[i - 1] + Math.hypot(out[i].x - out[i - 1].x, out[i].y - out[i - 1].y));
    return { pts: out, cum, len: cum[cum.length - 1] };
  }

  // Position et direction sur une voie, à la distance s du départ.
  function positionSur(v, s) {
    const cum = v.cum, pts = v.pts;
    if (s <= 0) { const dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y, l = Math.hypot(dx, dy) || 1; return { x: pts[0].x + dx / l * s, y: pts[0].y + dy / l * s, dx: dx / l, dy: dy / l }; }
    if (s >= v.len) { const n = pts.length; const dx = pts[n - 1].x - pts[n - 2].x, dy = pts[n - 1].y - pts[n - 2].y, l = Math.hypot(dx, dy) || 1; return { x: pts[n - 1].x + dx / l * (s - v.len), y: pts[n - 1].y + dy / l * (s - v.len), dx: dx / l, dy: dy / l }; }
    let lo = 0, hi = cum.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
    const u = (s - cum[lo]) / ((cum[hi] - cum[lo]) || 1);
    const a = pts[lo], b = pts[hi];
    const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1;
    return { x: a.x + dx * u, y: a.y + dy * u, dx: dx / l, dy: dy / l };
  }

  function intersection(p1, p2, p3, p4) {
    const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
    if (Math.abs(d) < 1e-9) return null;
    const u = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
    const w = ((p3.x - p1.x) * (p2.y - p1.y) - (p3.y - p1.y) * (p2.x - p1.x)) / d;
    if (u < 0 || u > 1 || w < 0 || w > 1) return null;
    return { u, w };
  }

  // ------------------------------------------------------------------
  // Construction du réseau d'un niveau
  // ------------------------------------------------------------------
  function construire(def) {
    const noeuds = {};
    const listeNoeuds = [];
    Object.keys(def.n).forEach((id) => {
      const d = def.n[id];
      const n = { id, x: d[0], y: d[1], type: d[2], c: d[2] === 'g' ? d[3] : null, c0: d[2] === 'g' ? d[3] : null, entrees: [], sorties: [], etat: 0, res: null, pivot: 0 };
      noeuds[id] = n; listeNoeuds.push(n);
    });
    const voies = def.v.map((d, i) => {
      const a = noeuds[d[0]], b = noeuds[d[1]];
      const pts = [[a.x, a.y]].concat(d[2] || []).concat([[b.x, b.y]]);
      const ech = echantillonner(pts);
      const o = d[3] || {};
      const v = { i, a: a.id, b: b.id, pts: ech.pts, cum: ech.cum, len: ech.len, o, ponts: [], tunnel: null, feu: null, unique: o.unique || null };
      if (o.tunnel) v.tunnel = [o.tunnel[0] * v.len, o.tunnel[1] * v.len];
      if (o.feu) v.feu = { rouge: false, arret: Math.max(0.3, v.len - 0.6), prot: o.prot ? { x: o.prot[0], y: o.prot[1] } : null, u: o.u || null };
      a.sorties.push(i); b.entrees.push(i);
      return v;
    });
    // Croisements : ponts (au-dessus) ou croisements à niveau (dangereux).
    const croisements = [];
    for (let i = 0; i < voies.length; i++) {
      for (let j = i + 1; j < voies.length; j++) {
        const A = voies[i], B = voies[j];
        if (A.unique && A.unique === B.unique) continue;
        for (let k = 0; k < A.pts.length - 1; k++) {
          for (let m = 0; m < B.pts.length - 1; m++) {
            const r = intersection(A.pts[k], A.pts[k + 1], B.pts[m], B.pts[m + 1]);
            if (!r) continue;
            const sA = A.cum[k] + (A.cum[k + 1] - A.cum[k]) * r.u, sB = B.cum[m] + (B.cum[m + 1] - B.cum[m]) * r.w;
            if (sA < 0.3 || sA > A.len - 0.3 || sB < 0.3 || sB > B.len - 0.3) continue;
            const x = A.pts[k].x + (A.pts[k + 1].x - A.pts[k].x) * r.u, y = A.pts[k].y + (A.pts[k + 1].y - A.pts[k].y) * r.u;
            if (croisements.some((c) => Math.hypot(c.x - x, c.y - y) < 0.2)) continue;
            const c = { x, y, a: i, sA, b: j, sB, pont: null, sous: hauteur(A, sA) < 0 || hauteur(B, sB) < 0 };
            if (A.o.pont) { A.ponts.push([sA - 0.62, sA + 0.62]); c.pont = i; } else if (B.o.pont) { B.ponts.push([sB - 0.62, sB + 0.62]); c.pont = j; }
            croisements.push(c);
          }
        }
      }
    }
    const entrees = listeNoeuds.filter((n) => n.type === 'e');
    const gares = listeNoeuds.filter((n) => n.type === 'g');
    const aiguillages = listeNoeuds.filter((n) => n.type === 'a' && n.sorties.length > 1);
    const feux = voies.filter((v) => v.feu);
    // Gares que l'on peut atteindre depuis chaque nœud (toutes positions d'aiguillage).
    const atteint = {};
    function atteindre(id, vu) {
      if (atteint[id]) return atteint[id];
      vu = vu || {};
      if (vu[id]) return [];
      vu[id] = true;
      const n = noeuds[id];
      let res = n.type === 'g' ? [id] : [];
      n.sorties.forEach((vi) => { res = res.concat(atteindre(voies[vi].b, vu)); });
      res = Array.from(new Set(res));
      atteint[id] = res;
      return res;
    }
    listeNoeuds.forEach((n) => atteindre(n.id));
    return { def, noeuds, listeNoeuds, voies, croisements, entrees, gares, aiguillages, feux, atteint };
  }

  // Niveau (hauteur) d'un point d'une voie : -1 tunnel, 0 sol, 1 pont.
  function hauteur(v, s) {
    if (v.tunnel && s > v.tunnel[0] && s < v.tunnel[1]) return -1;
    for (let k = 0; k < v.ponts.length; k++) if (s > v.ponts[k][0] && s < v.ponts[k][1]) return 1;
    return 0;
  }

  // Couleur de chaque gare à l'instant t (fermetures).
  function couleursA(R, t) {
    const res = {};
    R.gares.forEach((g) => { res[g.id] = g.c0; });
    (R.def.ev || []).forEach((e) => { if (t >= e.t) { const c = res[e.ferme]; res[e.ferme] = -1; res[e.ouvre] = c; } });
    return res;
  }
  // Une gare de la couleur c est-elle atteignable depuis cette entrée à l'instant t ?
  function couleurAtteignable(R, entree, c, t) {
    const coul = couleursA(R, t);
    return R.atteint[entree].some((g) => coul[g] === c);
  }

  // ------------------------------------------------------------------
  // Horaire des trains d'un niveau (reproductible)
  // ------------------------------------------------------------------
  function horaire(R, def, numero) {
    const tr = def.tr;
    const h = graine(numero * 7919 + 17);
    const liste = [];
    let t = def.deb || 1.6;
    let derniereEntree = null;
    for (let k = 0; k < tr.n; k++) {
      // Entrée : au hasard, plutôt une autre que la précédente.
      let ents = R.entrees.map((e) => e.id);
      if (ents.length > 1 && derniereEntree && h() < 0.6) ents = ents.filter((e) => e !== derniereEntree);
      const entree = ents[Math.floor(h() * ents.length)];
      derniereEntree = entree;
      // Couleurs livrables maintenant et à l'arrivée probable (t + 9 s).
      const possibles = [];
      for (let c = 0; c < 6; c++) if (couleurAtteignable(R, entree, c, t) && couleurAtteignable(R, entree, c, t + 9)) possibles.push(c);
      if (!possibles.length) for (let c = 0; c < 6; c++) if (couleurAtteignable(R, entree, c, t + 9)) possibles.push(c);
      let type = 'n';
      const r = h();
      if (tr.x && r < tr.x) type = 'x';
      else if (tr.lg && r < (tr.x || 0) + tr.lg) type = 'l';
      const cols = [possibles[Math.floor(h() * possibles.length)]];
      if (tr.bi && type === 'n' && h() < tr.bi && k > 0) {
        // Deux couleurs : la seconde doit être livrable depuis au moins une entrée.
        const autres = [];
        for (let c = 0; c < 6; c++) if (c !== cols[0] && R.entrees.some((e) => couleurAtteignable(R, e.id, c, t + 12))) autres.push(c);
        if (autres.length) { cols.push(autres[Math.floor(h() * autres.length)]); type = 'b'; }
      }
      liste.push({ t, entree, cols, type });
      t += tr.int[0] + h() * (tr.int[1] - tr.int[0]) + (type === 'l' ? 1.2 : 0) + (type === 'b' ? 1 : 0);
    }
    return liste;
  }

  // ------------------------------------------------------------------
  // Partie
  // ------------------------------------------------------------------
  function creerPartie(def, options) {
    options = options || {};
    const R = construire(def);
    let liste;
    if (def.fixe) liste = def.fixe.map((f) => ({ t: f[0], cols: f[1].slice(), entree: f[2] || R.entrees[0].id, type: f[3] || (f[1].length > 1 ? 'b' : 'n') }));
    else liste = horaire(R, def, options.numero || 1);
    let livraisons = 0;
    liste.forEach((x) => { livraisons += x.cols.length; });
    return {
      R, def, t: 0, vit: def.vit || (def.tr ? def.tr.v : 1), auto: !!def.auto,
      horaire: liste, prochain: 0, reentrees: [], trains: [], idSuivant: 1,
      livraisonsTotal: livraisons, livres: 0, erreurs: 0, maxErreurs: 3, serie: 0, score: 0,
      fin: null, crash: null, places: [], ev: (def.ev || []).map((e) => Object.assign({ fait: false, annonce: false }, e)),
      evts: [], // évènements pour la page (sons, effets), vidés par la page
      pilote: !!options.pilote, mains: [], numero: options.numero || 0
    };
  }

  function signaler(P, type, donnees) { P.evts.push(Object.assign({ type }, donnees || {})); if (P.evts.length > 60) P.evts.shift(); }

  // Liste des voitures d'un train (longueurs et couleurs).
  function voitures(tr) {
    const l = [{ k: 'loco', c: tr.cols[0], len: LONGUEURS.loco }];
    if (tr.type === 'b') tr.cols.forEach((c) => l.push({ k: 'wagon', c, len: LONGUEURS.wagon }));
    else if (tr.type === 'l') for (let i = 0; i < 3; i++) l.push({ k: 'wagon', c: tr.cols[0], len: LONGUEURS.wagon });
    else l.push({ k: 'wagon', c: tr.cols[0], len: LONGUEURS.wagon });
    return l;
  }
  function longueurTrain(tr) { return tr.voit.reduce((s, v) => s + v.len, 0) + LONGUEURS.ecart * (tr.voit.length - 1); }

  // Place d'un point situé d à l'arrière de la tête du train.
  function placeArriere(P, tr, d) {
    let e = tr.e, s = tr.s - d, h = tr.hist.length - 1;
    while (s < 0 && h >= 0) { e = tr.hist[h]; s += P.R.voies[e].len; h--; }
    return { e, s };
  }

  function lancerTrain(P, entree, cols, type) {
    const n = P.R.noeuds[entree];
    const e = n.sorties[0];
    const tr = { id: P.idSuivant++, cols: cols.slice(), type, e, s: 0, v: 0, hist: [], vmax: P.vit * (type === 'x' ? 1.55 : type === 'l' ? 0.82 : 1), entree, age: 0 };
    tr.voit = voitures(tr);
    tr.L = longueurTrain(tr);
    tr.v = tr.vmax;
    P.trains.push(tr);
    signaler(P, 'sortie', { entree, train: tr.id, genre: type });
    return tr;
  }

  // L'entrée est-elle libre (aucun wagon tout près) ?
  function entreeLibre(P, entree) {
    const e = P.R.noeuds[entree].sorties[0];

    [['sapin', 6], ['rocher', 4], ['pic', 1.5], ['buisson', 1], ['fleurs', 1]],
    [['immeuble', 6], ['arbre', 2.5], ['voiture', 2], ['buisson', 1]],
    [['dune', 3], ['cactus', 4], ['rocher', 2], ['palmier', 1]],
    [['sapin', 5], ['bonhomme', 1], ['igloo', 0.7], ['lac', 0.8], ['rocher', 1]]

  // Dessine le décor et les rails sur un calque fixe (et ponts, tunnels sur un 2e calque).
  function preparerCalques(P, v, w, h, dpr) {
    const reg = REGIONS[P.def.reg || 0];
    const mk = () => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * dpr)); c.height = Math.max(1, Math.round(h * dpr)); const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); return [c, g]; };
    const [fond, g] = mk();
    const [dessus, g2] = mk();
    const R = P.R; const c = v.c;
    const h0 = hasard(1234 + (P.numero || 7) * 31 + (P.def.reg || 0) * 977);
    // Sol.
    const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, reg.sol); gr.addColorStop(1, reg.sol2);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);

    g.fillStyle = reg.herbe;
    for (let i = 0; i < (w * h) / 900; i++) { const x = h0() * w, y = h0() * h; g.globalAlpha = 0.25 + h0() * 0.35; g.beginPath(); g.ellipse(x, y, c * (0.04 + h0() * 0.08), c * (0.02 + h0() * 0.04), h0() * 3, 0, 7); g.fill(); }
    g.globalAlpha = 1;
    // Points des rails pour écarter le décor.
    const obst = [];
    R.voies.forEach((voie) => { for (let s = 0; s <= voie.len; s += 0.25) { const p = M.positionSur(voie, s); obst.push(ecranDe(v, p.x, p.y)); } });
    R.gares.concat(R.entrees).forEach((n) => { const p = ecranDe(v, n.x, n.y); obst.push(p, p); });
    const loin = (x, y, d) => { for (let k = 0; k < obst.length; k++) { const o = obst[k]; if (Math.abs(o[0] - x) < d && Math.abs(o[1] - y) < d && Math.hypot(o[0] - x, o[1] - y) < d) return false; } return true; };
    // Décor posé sur une grille irrégulière qui couvre tout l'écran.
    const types = DECOR_REGION[P.def.reg || 0];
    const somme = types.reduce((s, x) => s + x[1], 0);
    const pas = c * 0.95;
    const objets = [];
    for (let y = -pas * 0.3; y < h + pas; y += pas) {
      for (let x = -pas * 0.3; x < w + pas; x += pas) {
        if (h0() < 0.22) continue;
        let r = h0() * somme, type = types[0][0];
        for (const tp of types) { r -= tp[1]; if (r <= 0) { type = tp[0]; break; } }
        const px = x + (h0() - 0.5) * pas * 0.8, py = y + (h0() - 0.5) * pas * 0.8;
        const taille = c * (0.28 + h0() * 0.14) * (GROS[type] || 1);
        if (!loin(px, py, c * 0.62 + taille * 0.75)) continue;
        objets.push([type, px, py, taille]);

    // Les gros d'abord (champs, lacs, pics), les petits par-dessus.
    objets.sort((a, b) => (GROS[b[0]] || 1) - (GROS[a[0]] || 1));
    objets.forEach((o) => DECOR[o[0]](g, o[1], o[2], o[3], h0, P.def.reg === 4));
    // Rails au sol (les voies uniques sont teintées de sable).
    R.voies.forEach((voie) => {
      if (voie.unique && voie.o.unique && R.voies.some((x) => x.unique === voie.unique && x.i < voie.i)) return;
      dessinerRails(g, v, voie, 0, voie.len, reg, false);
      if (voie.unique) {
        const pts = polyEcran(v, voie, 0.2, voie.len - 0.2, 0.1);
        g.setLineDash([c * 0.12, c * 0.12]); g.strokeStyle = 'rgba(230,120,40,.75)'; g.lineWidth = Math.max(2, c * 0.04);
        [-1, 1].forEach((cote) => {
          const off = pts.map((p, i) => { const q = pts[Math.min(i + 1, pts.length - 1)], o = pts[Math.max(0, i - 1)]; const dx = q[0] - o[0], dy = q[1] - o[1], l = Math.hypot(dx, dy) || 1; return [p[0] - dy / l * c * 0.24 * cote, p[1] + dx / l * c * 0.24 * cote]; });
          tracer(g, off); g.stroke();
        });

      }

    // Croisements à niveau : croix de Saint-André dessinée sur le sol.
    R.croisements.filter((k) => k.pont === null && !k.sous).forEach((k) => {
      const [X, Y] = ecranDe(v, k.x, k.y);
      g.fillStyle = 'rgba(255,255,255,.0)';
      g.strokeStyle = '#d23a32'; g.lineWidth = Math.max(2, c * 0.06); g.setLineDash([c * 0.08, c * 0.08]);
      g.beginPath(); g.arc(X, Y, c * 0.42, 0, 7); g.stroke(); g.setLineDash([]);

      g2.strokeStyle = 'rgba(0,0,0,.25)'; g2.lineWidth = c * 0.74; g2.save(); g2.translate(c * 0.12, c * 0.14); tracer(g2, pts); g2.stroke(); g2.restore();
      g2.strokeStyle = '#8a6a4a'; g2.lineWidth = c * 0.72; tracer(g2, pts); g2.stroke();
      g2.strokeStyle = '#b48a5e'; g2.lineWidth = c * 0.56; tracer(g2, pts); g2.stroke();
      dessinerRails(g2, v, voie, pt[0], pt[1], reg, true);
      // Garde-corps.
      [-1, 1].forEach((cote) => {
        const off = pts.map((p, i) => { const q = pts[Math.min(i + 1, pts.length - 1)], o = pts[Math.max(0, i - 1)]; const dx = q[0] - o[0], dy = q[1] - o[1], l = Math.hypot(dx, dy) || 1; return [p[0] - dy / l * c * 0.33 * cote, p[1] + dx / l * c * 0.33 * cote]; });
        g2.strokeStyle = '#5e4530'; g2.lineWidth = Math.max(2, c * 0.07); tracer(g2, off); g2.stroke();
        g2.strokeStyle = '#e2c393'; g2.lineWidth = Math.max(1, c * 0.025); tracer(g2, off); g2.stroke();
      });
    }));
    // Tunnels : colline qui couvre la voie, deux bouches sombres.
    const bouche = (gg, voie, s, sens) => {
      const p = M.positionSur(voie, s); const [X, Y] = ecranDe(v, p.x, p.y); let [dx, dy] = dirEcran(v, p.dx, p.dy); dx *= sens; dy *= sens;

      gg.fillStyle = '#1b1a1f'; gg.beginPath(); gg.ellipse(c * 0.03, 0, c * 0.13, c * 0.26, 0, 0, 7); gg.fill();

      gg.strokeStyle = 'rgba(0,0,0,.2)'; gg.lineWidth = larg * 1.05; gg.save(); gg.translate(c * 0.1, c * 0.14); tracer(gg, pts); gg.stroke(); gg.restore();

      gg.strokeStyle = reg.colline2; gg.lineWidth = larg * 0.62; gg.save(); gg.translate(-c * 0.05, -c * 0.07); tracer(gg, pts); gg.stroke(); gg.restore();
      if (P.def.reg === 4 || P.def.reg === 1) { gg.strokeStyle = 'rgba(255,255,255,.85)'; gg.lineWidth = larg * 0.25; gg.save(); gg.translate(-c * 0.08, -c * 0.1); tracer(gg, pts); gg.stroke(); gg.restore(); }
    };
    R.voies.forEach((voie) => {
      if (!voie.tunnel) return;
      const pts = polyEcran(v, voie, voie.tunnel[0] + 0.1, voie.tunnel[1] - 0.1, 0.1);
      colline(g2, pts, c * 1.1);
      bouche(g2, voie, voie.tunnel[0] + 0.05, -1);
      bouche(g2, voie, voie.tunnel[1] - 0.05, 1);
    });
    // Entrées : bouche de tunnel dans une colline au bord du réseau.
    R.entrees.forEach((n) => {
      const voie = R.voies[n.sorties[0]];
      if (voie.tunnel && voie.tunnel[0] < 0.5) return;
      const p = M.positionSur(voie, 0); const [X, Y] = ecranDe(v, p.x, p.y); const [dx, dy] = dirEcran(v, p.dx, p.dy);
      const pts = [[X - dx * c * 1.2, Y - dy * c * 1.2], [X - dx * c * 0.1, Y - dy * c * 0.1]];
      colline(g2, pts, c * 1.2);
      bouche(g2, voie, 0.12, 1);
    });
    return { fond, dessus };
  }

  // ------------------------------------------------------------------
  // Trains (vus de dessus)
  // ------------------------------------------------------------------
  function dessinerLoco(g, L, l, coul, skin, type, temps) {
    const c = COUL[coul] || COUL[0];
    const corps = type === 'b' ? '#f4efe4' : skin === 'doree' ? '#f2c94c' : c.c;
    const fonce = type === 'b' ? '#bdb3a2' : skin === 'doree' ? '#b38a16' : c.d;

    if (skin === 'fusee') {
      g.fillStyle = fonce; g.beginPath(); g.moveTo(-L / 2, -l * 0.62); g.lineTo(-L * 0.25, -l * 0.4); g.lineTo(-L * 0.25, l * 0.4); g.lineTo(-L / 2, l * 0.62); g.closePath(); g.fill();
      g.fillStyle = corps; g.beginPath(); g.moveTo(-L / 2, -l / 2); g.lineTo(L * 0.18, -l / 2); g.quadraticCurveTo(L * 0.62, 0, L * 0.18, l / 2); g.lineTo(-L / 2, l / 2); g.closePath(); g.fill();

    } else {
      const nez = skin === 'bouledogue' ? l * 0.5 : skin === 'electrique' ? l * 0.42 : l * 0.25;
      g.fillStyle = corps; rondRect(g, -L / 2, -l / 2, L, l, nez); g.fill();
      g.fillStyle = fonce; rondRect(g, -L / 2, -l / 2, L * 0.36, l, l * 0.2); g.fill(); // cabine
      g.fillStyle = 'rgba(255,255,255,.85)'; g.fillRect(-L / 2 + L * 0.06, -l * 0.32, L * 0.22, l * 0.12); g.fillRect(-L / 2 + L * 0.06, l * 0.2, L * 0.22, l * 0.12);
      g.fillStyle = 'rgba(255,255,255,.25)'; rondRect(g, -L * 0.12, -l * 0.42, L * 0.55, l * 0.3, l * 0.12); g.fill();

        g.fillStyle = '#ffd84d'; g.beginPath(); g.arc(L * 0.44, 0, l * 0.09, 0, 7); g.fill();

        g.fillStyle = '#ffd84d'; g.fillRect(L * 0.42, -l * 0.4, L * 0.06, l * 0.8);
      } else if (skin === 'electrique') {
        g.strokeStyle = '#2b2b33'; g.lineWidth = Math.max(1, l * 0.07); g.beginPath(); g.moveTo(-L * 0.05, -l * 0.25); g.lineTo(L * 0.12, l * 0.2); g.lineTo(L * 0.28, -l * 0.25); g.stroke();

      }
    }

    else { symbole(g, 'rond', -L * 0.04, 0, l * 0.12, '#bdb3a2'); }

    }
  }
  function dessinerWagon(g, L, l, coul, style, long) {
    const c = COUL[coul] || COUL[0];
    g.fillStyle = 'rgba(0,0,0,.22)'; rondRect(g, -L / 2 + l * 0.12, -l / 2 + l * 0.16, L, l, l * 0.2); g.fill();
    if (long) {
      g.fillStyle = c.d; rondRect(g, -L / 2, -l / 2, L, l, l * 0.12); g.fill();
      g.fillStyle = c.c; rondRect(g, -L / 2 + l * 0.08, -l / 2 + l * 0.08, L - l * 0.16, l - l * 0.16, l * 0.1); g.fill();

      g.fillStyle = c.c; rondRect(g, -L / 2 + 2, -l / 2 + 2, L - 4, l - 4, l * 0.45); g.fill();

      g.fillStyle = c.c; g.fillRect(-L / 2 + 2, -l / 2 + 2, L - 4, l - 4);

      g.strokeStyle = '#7a5434'; g.lineWidth = 1.5; g.strokeRect(-L * 0.36, -l * 0.3, L * 0.32, l * 0.6); g.strokeRect(L * 0.04, -l * 0.3, L * 0.32, l * 0.6);
    } else if (style === 'panoramique') {
      g.fillStyle = c.c; rondRect(g, -L / 2, -l / 2, L, l, l * 0.3); g.fill();
      g.fillStyle = '#bfe8ff'; rondRect(g, -L * 0.42, -l * 0.32, L * 0.84, l * 0.64, l * 0.25); g.fill();
      g.fillStyle = 'rgba(255,255,255,.7)'; g.fillRect(-L * 0.36, -l * 0.25, L * 0.25, l * 0.1);
    } else { // voyageurs
      g.fillStyle = c.d; rondRect(g, -L / 2, -l / 2, L, l, l * 0.22); g.fill();
      g.fillStyle = c.c; rondRect(g, -L / 2 + 2, -l / 2 + 2, L - 4, l - 4, l * 0.2); g.fill();
      g.fillStyle = 'rgba(255,255,255,.85)'; for (let i = 0; i < 3; i++) { g.fillRect(-L * 0.36 + i * L * 0.26, -l * 0.42, L * 0.16, l * 0.12); g.fillRect(-L * 0.36 + i * L * 0.26, l * 0.3, L * 0.16, l * 0.12); }
    }

  }
  function dessinerVoiture(g, v, p, temps) {
    const [X, Y] = ecranDe(v, p.x, p.y);
    const [dx, dy] = dirEcran(v, p.dx, p.dy);
    const L = p.voit.len * v.c * 0.98, l = v.c * 0.33;
    g.save(); g.translate(X, Y); g.rotate(Math.atan2(dy, dx));
    if (p.k === 0) {

  let rendusSpeciaux = null; // locomotive imposée (démonstrations)
  const choixLoco = () => (rendusSpeciaux && rendusSpeciaux.loco) || prog.loco;
  const choixWagon = () => (rendusSpeciaux && rendusSpeciaux.wagon) || prog.wagon;

  // ------------------------------------------------------------------
  // Dessin d'une partie (écran principal et démonstrations)
  // ------------------------------------------------------------------
  function directionSortie(P, n, k) { const voie = P.R.voies[n.sorties[k]]; const p = M.positionSur(voie, Math.min(0.55, voie.len)); return [p.x - n.x, p.y - n.y]; }

  function dessinerGare(g, v, P, n, temps) {
    const voie = P.R.voies[n.entrees[0]];
    const p = M.positionSur(voie, voie.len);
    const [X, Y] = ecranDe(v, n.x, n.y);
    const [dx, dy] = dirEcran(v, p.dx, p.dy);

    g.fillStyle = '#d8d2c6'; rondRect(g, -c * 0.45, -c * 0.62, c * 0.95, c * 1.24, c * 0.12); g.fill();

    g.fillStyle = ferme ? '#c3cad2' : coul.c; rondRect(g, c * 0.15, -c * 0.52, c * 0.44, c * 1.04, c * 0.08); g.fill();

      g.strokeStyle = '#f1f1f1'; g.lineWidth = c * 0.03; g.beginPath(); g.moveTo(-c * 0.3, -c * 0.3); g.lineTo(-c * 0.04, c * 0.3); g.stroke();

    g.restore();
  }

  function dessinerAiguillage(g, v, P, n, temps, choisi) {
    const [X, Y] = ecranDe(v, n.x, n.y);

  let annonceGare = null; // gare qui clignote avant de fermer
  function dessinerPartie(g, v, P, calques, temps, opts) {

    // Voie unique occupée : elle s'allume.
    const uniques = {};
    P.places.forEach((p) => { const vo = R.voies[p.e]; if (vo.unique) uniques[vo.unique] = true; });
    R.voies.forEach((vo) => {
      if (!vo.unique || !uniques[vo.unique] || !vo.o.unique) return;
      const pts = polyEcran(v, vo, 0, vo.len, 0.1);
      g.strokeStyle = 'rgba(255,120,40,' + (0.35 + 0.2 * Math.sin(temps * 8)) + ')'; g.lineWidth = c * 0.5; g.lineCap = 'round'; tracer(g, pts); g.stroke();

    prochains.forEach((x) => {
      const n = R.noeuds[x.entree]; const voie = R.voies[n.sorties[0]]; const p = M.positionSur(voie, 0.55); const [X, Y] = ecranDe(v, p.x, p.y);
      const k = 1 - clamp((x.t - P.t) / 2.4, 0, 1);

    g.drawImage(calques.dessus, 0, 0, v.w, v.h);

  // ------------------------------------------------------------------

  let parts = [];

      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 180;
      parts.push({ x: X, y: Y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, vie: 0.9 + Math.random() * 0.6, age: 0, coul: couleur || ['#ffcf3f', '#ff6f91', '#5fd17e', '#2f80e4'][i % 4], type: type || (i % 3 ? 'confetti' : 'etoile'), r: 3 + Math.random() * 4, rot: Math.random() * 6 });

  function texteVolant(X, Y, txt, couleur) { parts.push({ x: X, y: Y, vx: 0, vy: -50, vie: 1.2, age: 0, type: 'texte', txt, coul: couleur || '#fff' }); }

    parts = parts.filter((p) => (p.age += dt) < p.vie);

      if (p.type !== 'texte' && p.type !== 'fumee') p.vy += 260 * dt;

  function redimensionner() {

    neige = [];

  function montrer(id) {

    document.querySelectorAll('.ecran').forEach((e) => e.classList.toggle('actif', e.id === id));
    $('hud').classList.toggle('actif', id === 'jeu' || id === 'ecran-pause' || id === 'ecran-fin' || id === 'ecran-nouveau');

  // Bouton principal de chaque écran (touche Entrée quand aucun bouton n'a le focus).

  // ------------------------------------------------------------------
  // Partie
  // ------------------------------------------------------------------
  function lancerNiveau(i) {
    index = clamp(i, 0, NIVEAUX.length - 1);
    P = M.creerPartie(NIVEAUX[index], { numero: index + 1 });
    vue = calculerVue(W, H, 60, BORNES, true);
    calques = preparerCalques(P, vue, W, H, DPR);
    parts = []; sel = null; enPause = false; finAffichee = false; minuterieFin = 0; annonceGare = null; astuce = null;
    $('annonce').classList.remove('actif');
    majHud();
    const nv = NIVEAUX[index].nouveau;
    if (nv && prog.vus.indexOf(nv) < 0) { ouvrirNouveau(nv); return; }
    demarrer();
  }
  function demarrer() {
    montrer('jeu');
    const nv = NIVEAUX[index].nouveau;
    if (nv) montrerAstuce(nv);
  }
  function montrerAstuce(cle) {
    const R = P.R;
    let cible = null;
    if (cle === 'aig' || cle === 'gares' || cle === 'triple' || cle === 'bicolore' || cle === 'express' || cle === 'long') {
      const tri = R.aiguillages.find((n) => n.sorties.length > 2);
      const n = cle === 'triple' && tri ? tri : R.aiguillages[0];
      if (n) cible = { x: n.x, y: n.y };
    } else if (cle === 'feu' || cle === 'unique' || cle === 'croisement') {
      const vo = R.feux[0]; if (vo) { const f = positionFeu(vue, vo); cible = { x: f.x, y: f.y }; }
    } else if (cle === 'fusion') {

    } else if (cle === 'pont') {

  function majHud() {

    $('hud-livres').textContent = T('hud.compte', { n: nb(P.livres), total: nb(Math.max(P.livres, P.livraisonsTotal)) });
    $('hud-score').textContent = T('hud.points', { n: nb(P.score) });

  }

  // Évènements du moteur : sons et effets.
  function traiterEvts() {
    const evts = P.evts.splice(0);
    evts.forEach((e) => {
      if (e.type === 'aig') son('clac');
      else if (e.type === 'feu') son(e.rouge ? 'feuRouge' : 'feuVert');
      else if (e.type === 'sortie') son(e.genre === 'x' ? 'express' : 'tchou');
      else if (e.type === 'livre') {
        son('livre'); const [X, Y] = ecranDe(vue, e.x, e.y);
        jaillir(X, Y, null, 24); texteVolant(X, Y - vue.c * 0.6, T('jeu.points', { n: nb(e.pts) }), COUL[e.c].l);
        if (e.serie >= 3) texteVolant(X, Y - vue.c * 1.2, T('jeu.serie', { n: nb(e.serie) }), '#ffcf3f');
        majHud();
      } else if (e.type === 'erreur') {
        son('erreur'); const [X, Y] = ecranDe(vue, e.x, e.y);

        secousse = 0.35; majHud();

  let minuterieAnnonce = null;
  function afficherAnnonce(txt) {

  let secousse = 0;

  function finDeNiveau() {

    let score = P.score;
    const sansErreur = gagne && P.erreurs === 0;
    if (sansErreur) score += 200;
    const ancienRecord = prog.records[index] || 0;
    const record = gagne && score > ancienRecord;
    if (gagne) {
      prog.etoiles[index] = Math.max(prog.etoiles[index] || 0, etoiles);
      if (record) prog.records[index] = score;
      prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, index + 2));
      const tout = NIVEAUX.every((x, i) => (prog.etoiles[i] || 0) > 0);
      if (tout) prog.termine = true;
      ecrireProg(Math.min(NIVEAUX.length, index + 2));
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: index + 1 });
      if (tout) { if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 }); }
      son('victoire');
    } else {
      ecrireProg(index + 1);
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: index + 1 });
      son('defaite');
    }
    // Écran de fin.
    $('fin-titre').textContent = T(gagne ? 'fin.gagne' : P.fin === 'crash' ? 'fin.crash' : 'fin.erreurs');

    // Voie principale : de l'avant-plan vers la gare rouge.

      g.strokeStyle = '#7a5434'; g.lineWidth = 4 + 5 * k; g.beginPath(); g.moveTo(voie[i][0] - dy / l * e, voie[i][1] + dx / l * e); g.lineTo(voie[i][0] + dy / l * e, voie[i][1] - dx / l * e); g.stroke();

    // Héros : une grosse locomotive à vapeur rouge, de trois quarts, avec ses wagons.

  // Grosse locomotive (affiche), vue de côté légèrement de trois quarts.

    [[-140, 64, 38], [-30, 64, 44], [80, 64, 44], [160, 70, 26]].forEach(([x, y, r]) => {

      g.strokeStyle = '#ffcf3f'; g.lineWidth = 4; for (let i = 0; i < 4; i++) { const a = i * Math.PI / 4 + 0.3; g.beginPath(); g.moveTo(x + Math.cos(a) * r * 0.25, y + Math.sin(a) * r * 0.25); g.lineTo(x + Math.cos(a) * r * 0.68, y + Math.sin(a) * r * 0.68); g.stroke(); g.beginPath(); g.moveTo(x - Math.cos(a) * r * 0.25, y - Math.sin(a) * r * 0.25); g.lineTo(x - Math.cos(a) * r * 0.68, y - Math.sin(a) * r * 0.68); g.stroke(); }
    });
    g.strokeStyle = '#c9ced6'; g.lineWidth = 9; g.lineCap = 'round'; g.beginPath(); g.moveTo(-30, 76); g.lineTo(80, 76); g.stroke();
    // Contour clair (lumière du soleil sur le dessus).

    g.beginPath(); g.moveTo(-196, -128); g.lineTo(-72, -128); g.stroke();

  // ------------------------------------------------------------------
  // Images du jeu (window.JEL_APERCU = 1, 2 ou 3, posé par le robot)
  // ------------------------------------------------------------------
  const MOMENTS_APERCU = { 1: { niv: 0, t: 13 }, 2: { niv: 9, t: 20 }, 3: { niv: 17, t: 30 } };
  function ouvrirApercu(n) {
    apercu = n;
    const mo = MOMENTS_APERCU[n];
    index = mo.niv;
    P = M.creerPartie(NIVEAUX[index], { numero: index + 1, pilote: true });
    vue = calculerVue(W, H, 60, BORNES, true);
    calques = preparerCalques(P, vue, W, H, DPR);
    for (let s = 0; s < mo.t * 30 && !P.fin; s++) { M.etape(P, 1 / 30); P.evts.length = 0; }
    P.mains = []; P.pilote = false;
    if (n === 2 && P.R.feux[1]) P.R.feux[1].feu.rouge = true;
    annonceGare = null;
    montrer('jeu'); majHud();
    if (n === 3) { astuce = null; }
  }

  // ------------------------------------------------------------------
  // Démarrage
  // ------------------------------------------------------------------
  redimensionner();
  if (window.JEL_AFFICHE) { dessinerAffiche(); return; }
  const numeroApercu = Number(window.JEL_APERCU);
  if (numeroApercu === 1 || numeroApercu === 2 || numeroApercu === 3) {
    lireProg(false);
    majBoutonsSon();
    ouvrirApercu(numeroApercu);
    requestAnimationFrame(boucle);
    return;
  }
  lireProg(true);
  majBoutonsSon();
  montrer('ecran-titre');
  requestAnimationFrame(boucle);
})();
