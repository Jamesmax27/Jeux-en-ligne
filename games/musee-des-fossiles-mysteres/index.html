<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

   Le musée des fossiles mystères — jeu de quiz et de fouille.
   20 caisses (niveaux) dans 4 salles ; chaque caisse enchaîne des épreuves :
   fouille au pinceau + question, fossile à deviner, « Lequel ? », frise du

   ===================================================================== */
(function () {

  const JEU = 'musee-des-fossiles-mysteres';
  const I18N = window.JEL_I18N;

  const S = (inner, vb, cls) => `<svg viewBox="${vb || '0 0 120 80'}"${cls ? ` class="${cls}"` : ''} aria-hidden="true" focusable="false">${inner}</svg>`;

  /* ---------------------------------------------------------------

  function construireNiveau(L) {

      if (!c.length) c = pool(filtre, maxSalle);
      const poids = c.map((id) => ANIMAUX[id].salle === s ? 3 : 1);

    }
    function distracteurs(bonne, nb) {
      const sa = ANIMAUX[bonne].salle;
      let c = IDS.filter((id) => id !== bonne);
      if (dist === 0) c = c.filter((id) => ANIMAUX[id].salle !== sa);
      else if (dist === 2) { const m = c.filter((id) => ANIMAUX[id].salle === sa); if (m.length >= nb) c = m; }
      return melanger(c).slice(0, nb);
    }
    return n.ep.map((e) => {
      const d = Object.assign({}, e);
      if (d.t === 'fouille' || d.t === 'devine') {
        d.animal = d.v ? n.vedette : tirerAnimal((id) => d.q !== 'regime' || ANIMAUX[id].regime);
        if (d.q === 'regime' && !ANIMAUX[d.animal].regime) d.q = 'qui';
        if (d.q === 'qui') d.options = melanger([d.animal].concat(distracteurs(d.animal, 2)));
      } else if (d.t === 'lequel') {
        const props = melanger(['mer', 'plantes', 'viande', 'ciel']);
        for (const p of props) {
          const a = (id) => p === 'mer' ? ANIMAUX[id].milieu === 'mer' : p === 'ciel' ? ANIMAUX[id].milieu === 'ciel' : ANIMAUX[id].regime === p;
          const non = (id) => p === 'mer' ? ANIMAUX[id].milieu !== 'mer' : p === 'ciel' ? ANIMAUX[id].milieu !== 'ciel' : ANIMAUX[id].regime && ANIMAUX[id].regime !== p;
          const oui = pool(a), nons = pool(non);
          if (oui.length && nons.length >= 2) { d.prop = p; d.animal = hasard(oui); d.options = melanger([d.animal].concat(melanger(nons).slice(0, 2))); break; }
        }
      } else if (d.t === 'loupe') {
        d.animal = tirerAnimal(() => true, s);
        d.options = melanger([d.animal].concat(distracteurs(d.animal, 2)));
      } else if (d.t === 'frise') {
        const ratio = L < 5 ? 3 : L < 10 ? 2 : L < 15 ? 1.5 : 1.25;
        const c = IDS.filter((id) => ANIMAUX[id].ere && ANIMAUX[id].salle <= Math.max(s, 2));
        let choix = null;
        for (let k = 0; k < 400 && !choix; k++) {
          const essai = melanger(c).slice(0, d.n).sort((a, b) => ANIMAUX[b].ere - ANIMAUX[a].ere);
          let ok = true;
          for (let i = 1; i < essai.length; i++) if (ANIMAUX[essai[i - 1]].ere / ANIMAUX[essai[i]].ere < ratio) ok = false;
          if (ok) choix = essai;
        }
        if (!choix) choix = ['trilobite', 'stegosaure', 'tyrannosaure', 'mammouth'].slice(0, d.n);
        d.ordre = choix; d.ids = melanger(choix);
      } else if (d.t === 'squelette') {
        const c = IDS.filter((id) => ANIMAUX[id].sq && ANIMAUX[id].salle <= s);
        const ici = c.filter((id) => ANIMAUX[id].salle === s && !utilises.has(id));
        d.animal = ici.length ? hasard(ici) : hasard(c); utilises.add(d.animal);
      } else if (d.t === 'empreintes') {
        const c = melanger(IDS.filter((id) => ANIMAUX[id].pied && ANIMAUX[id].salle <= Math.max(s, 2)));
        const pris = [], types = new Set();
        c.sort((a, b) => (ANIMAUX[b].salle === s) - (ANIMAUX[a].salle === s));
        for (const id of c) { if (pris.length < d.n && !types.has(ANIMAUX[id].pied)) { pris.push(id); types.add(ANIMAUX[id].pied); } }
        d.ids = pris; d.n = pris.length;
      } else if (d.t === 'vf') {
        const c = Object.keys(VF).filter((k) => VF[k][0] <= s);
        const ici = melanger(c.filter((k) => VF[k][0] === s)), avant = melanger(c.filter((k) => VF[k][0] !== s));
        d.items = melanger(ici.slice(0, Math.ceil(d.n * .6)).concat(avant)).slice(0, d.n);
        if (d.items.length < d.n) d.items = melanger(c).slice(0, d.n);
      }
      return d;
    });
  }

  /* ---------------------------------------------------------------
     Partie : lancement, HUD, épreuves, fins
     --------------------------------------------------------------- */
  function majHud() {
    const L = etat.niveau, s = salleDe(L);
    document.getElementById('hud-caisse').textContent = t('hud.caisse', { n: L + 1 });
    document.getElementById('hud-salle').textContent = t('salle.' + s);
    const c = document.getElementById('hud-coeurs');
    c.innerHTML = [0, 1, 2].map((i) => ICONES.coeur.replace('<svg ', `<svg class="${i < etat.coeurs ? '' : 'perdu'}" `)).join('');
    c.setAttribute('aria-label', t('hud.coeurs', { n: etat.coeurs }));
    document.getElementById('hud-score').textContent = I18N.nombre(etat.scoreNiv);
    const pr = document.getElementById('progression');
    pr.innerHTML = etat.epreuves.map((_, i) => `<i class="${i < etat.iEp ? (etat.resultats[i] ? 'fait' : 'rate') : i === etat.iEp && etat.enPartie ? 'encours' : ''}"></i>`).join('');
  }
  function consigne(txt) { document.getElementById('consigne').textContent = txt; }
  function nettoyer() {
    gen++; minuteurs = [];
    if (ep && ep.detruire) ep.detruire();
    ep = null; etat.suivant = null; etat.touchesChoix = null; etat.verrou = false;
    document.getElementById('zone').innerHTML = '';
    document.getElementById('retour').hidden = true;
    document.getElementById('toast').hidden = true;
    document.querySelectorAll('.fantome').forEach((f) => f.remove());
  }
  function lancerNiveau(L) {
    nettoyer();
    document.getElementById('fin').hidden = true;
    document.getElementById('pause').hidden = true;
    Object.assign(etat, { niveau: L, iEp: 0, coeurs: 3, erreurs: 0, scoreNiv: 0, reussies: 0, enPartie: true, fini: false, pauseMenu: false, resultats: [] });
    etat.epreuves = construireNiveau(L);    document.body.dataset.salle = salleDe(L);
    afficherEcran('jeu');
    sauve.niveauMax = Math.max(sauve.niveauMax, L + 1);
    if (L % 5 === 0) toast(t('salle.nouvelle', { salle: t('salle.' + salleDe(L)) }));
    demarrerEpreuve(0);
  }
  const TUTOS_DE = { fouille: ['pinceau'], devine: ['pinceau', 'devine'], lequel: ['question'], loupe: ['loupe'], frise: ['frise'], squelette: ['squelette'], empreintes: ['empreintes'], vf: ['vf'] };
  function tutosPour(d) {
    const l = (TUTOS_DE[d.t] || []).slice();
    if (d.r) l.push('roche'); if (d.g) l.push('fragile'); if (d.i) l.push('glace');
    return l;
  }
  function demarrerEpreuve(i) {
    nettoyer();
    etat.iEp = i; majHud();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    const d = etat.epreuves[i];
    ep = MONTEURS[d.t](d);
    const aVoir = tutosPour(d).filter((k) => !sauve.tutos.includes(k));
    if (aVoir.length) montrerTutos(aVoir);
  }
  function epreuveSuivante() {
    if (!etat.enPartie) return;
    if (etat.iEp + 1 >= etat.epreuves.length) { etat.iEp = etat.epreuves.length; victoire(); }
    else demarrerEpreuve(etat.iEp + 1);
  }
  function gagner(pts, cible) { etat.scoreNiv += pts; points(pts, cible); majHud(); }
  // Perte d'un cœur ; renvoie vrai si la partie est perdue.
  function perdreCoeur() {
    etat.coeurs = Math.max(0, etat.coeurs - 1); etat.erreurs++;
    son('faux'); secouer(); majHud();
    if (etat.coeurs <= 0) { etat.verrou = true; return true; }
    return false;
  }
  // Fin d'une épreuve : bandeau « Bravo ! » ou « Oups ! », puis la suite.
  function retour(ok, titre, texte, auto, ensuite) {
    const b = document.getElementById('retour');
    b.className = ok ? 'bon' : 'oups';
    b.innerHTML = `<div class="rt-titre">${titre}</div>${texte ? `<div class="rt-texte">${texte}</div>` : ''}`;
    b.hidden = false;
    let fait1 = false;
    const go = () => { if (fait1) return; fait1 = true; etat.suivant = null; b.hidden = true; ensuite(); };
    if (auto) plusTard(auto, go);
    else {
      const btn = el('button', 'btn', t('btn.suivant')); btn.type = 'button';
      btn.addEventListener('click', () => { son('clic'); go(); });

      setTimeout(() => { try { btn.focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 60);
    }
  }
  function finEpreuve(ok) { etat.resultats[etat.iEp] = ok; if (ok) etat.reussies++; }
  const bravo = () => t('fb.bravo' + (1 + Math.floor(Math.random() * 4)));
  function apresErreur(mort) { return mort ? defaite : epreuveSuivante; }

  // Panneau de réponses en images.
  function panneauChoix(parent, question, options, onChoix, classe) {
    const p = el('div', 'question');
    if (question) p.append(el('div', 'q-texte', question));
    const g = el('div', 'choix n' + options.length + (classe ? ' ' + classe : ''));
    options.forEach((o, i) => {
      const b = el('button', 'carte-choix', `<span class="touche">${i + 1}</span><span class="img">${o.svg}</span><span class="lbl">${o.label}</span>`);
      b.type = 'button'; b.dataset.id = o.id; b.setAttribute('aria-label', o.label);
      b.addEventListener('click', () => onChoix(o.id, b));
      g.append(b);
    });
    p.append(g); parent.append(p);
    const boutons = Array.from(g.children);
    etat.touchesChoix = boutons;
    return { p, boutons };
  }
  const optionAnimal = (id) => ({ id, svg: dessinAnimal(id), label: nom(id) });
  const optionImage = (id) => ({ id, svg: IMAGES[id], label: t('rep.' + id) });

  // Question qui suit une fouille.
  function questionDe(d) {
    const a = d.animal;
    if (d.q === 'regime') return { texte: t('q.regime', { animal: nom(a) }), options: ['plantes', 'viande'].map(optionImage), bonne: ANIMAUX[a].regime };
    if (d.q === 'milieu') return { texte: t('q.milieu', { animal: nom(a) }), options: ['mer', 'terre', 'ciel'].map(optionImage), bonne: ANIMAUX[a].milieu };
    return { texte: t('q.qui'), options: d.options.map(optionAnimal), bonne: a };
  }
  function labelDe(q) { const o = q.options.find((x) => x.id === q.bonne); return o ? o.label : ''; }
  function marquerChoix(boutons, bonne, b, ok) {
    boutons.forEach((x) => { x.disabled = true; });
    b.classList.add(ok ? 'juste' : 'faux');
    if (!ok) { const j = boutons.find((x) => x.dataset.id === bonne); if (j) j.classList.add('juste'); }
  }

  /* ----- La fouille au pinceau ----- */
  function creerFouille(parent, o) {
    const wrap = el('div', 'fouille');
    const fond = el('div', 'fouille-fond', fossileSVG(o.animal));
    const cv = el('canvas', 'fouille-sable');
    const felures = el('div', 'felure');
    const curseur = el('div', 'pinceau-curseur', ICONES.pinceau);
    const barre = el('div', 'fouille-barre', '<i></i><b></b>');
    wrap.append(fond, felures, cv, curseur);
    parent.append(wrap, barre);
    const ctx = cv.getContext('2d');
    const GW = 30, GH = 19, SEUIL = 0.7;
    const cells = [];
    let W = 0, H = 0, dpr = 1, sale = true, nZone = 0, nZoneOk = 0, revele = false, actif = false, fini = false;
    let dernier = null, vitesse = 0, dernierAvert = -9999, nbFelures = 0, dernierCoup = 0, accGlace = 0;
    let kx = 0.5, ky = 0.5, clavierVu = false;
    const sable = getComputedStyle(document.body).getPropertyValue('--sable').trim() || '200,170,120';
    for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
      const dx = (i + .5) / GW - .5, dy = (j + .5) / GH - .5;
      const zone = (dx * dx) / (.4 * .4) + (dy * dy) / (.42 * .42) <= 1;
      if (zone) nZone++;
      cells.push({ i, j, hp: o.glace ? 2 : 1, type: o.glace ? 'glace' : 'sable', ombre: Math.random(), dern: -999, zone });
    }
    if (o.roche) {
      const nb = 4;
      for (let k = 0; k < nb; k++) {
        const ci = 4 + Math.random() * (GW - 8), cj = 3 + Math.random() * (GH - 6), r = 2.4 + Math.random() * 1.6;
        cells.forEach((c) => { if (Math.hypot(c.i - ci, (c.j - cj) * 1.2) <= r) { c.type = 'roche'; c.hp = 3; } });
      }
    }
    function taille() {
      const r = wrap.getBoundingClientRect(); W = r.width; H = r.height;
      dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr)); sale = true;
    }
    taille();
    function dessiner() {
      if (!sale || !W) return; sale = false;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
      const cw = W / GW, ch = H / GH, r = Math.max(cw, ch) * .8;
      for (const c of cells) {
        if (c.hp <= 0) continue;
        const x = (c.i + .5) * cw, y = (c.j + .5) * ch;
        if (c.type === 'roche') { const g = 110 + c.ombre * 30 - (3 - c.hp) * 10; ctx.fillStyle = `rgb(${g},${g - 4},${g - 10})`; }
        else if (c.type === 'glace') ctx.fillStyle = c.hp >= 2 ? `rgba(${200 + c.ombre * 30},${232 + c.ombre * 15},255,.97)` : `rgba(215,240,255,.78)`;
        else { const [a, b, d] = sable.split(',').map(Number), k = (c.ombre - .5) * 26; ctx.fillStyle = `rgb(${a + k},${b + k},${d + k})`; }
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      // Petits détails : grains, fissures de la roche, reflets de la glace.
      for (const c of cells) {
        if (c.hp <= 0) continue;
        const x = (c.i + .5) * cw, y = (c.j + .5) * ch;
        if (c.type === 'roche' && c.ombre > .6) { ctx.strokeStyle = 'rgba(60,55,50,.6)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x - cw * .4, y - ch * .2); ctx.lineTo(x + cw * .3, y + ch * .3); ctx.stroke(); }
        else if (c.type === 'glace' && c.ombre > .94) { ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x - cw * .4, y + ch * .3); ctx.lineTo(x + cw * .4, y - ch * .3); ctx.stroke(); }
        else if (c.type === 'sable' && c.ombre > .8) { ctx.fillStyle = 'rgba(90,60,30,.35)'; ctx.fillRect(x, y, 2, 2); }
      }
    }
    const pct = () => nZone ? nZoneOk / nZone : 1;
    function majBarre() { barre.firstChild.style.width = Math.min(100, Math.round(pct() / SEUIL * 70)) + '%'; }
    function devoiler() {
      if (revele) return; revele = true;
      cells.forEach((c) => { c.hp = 0; }); cv.classList.add('parti'); fond.classList.add('brille');
      barre.firstChild.style.width = '100%';
      const [x, y] = centre(wrap); confettis(x, y, 26);
      if (o.onReveal) o.onReveal();
    }
    function coup(x, y, r) {
      const cw = W / GW, ch = H / GH;
      const i0 = Math.max(0, Math.floor((x - r) / cw)), i1 = Math.min(GW - 1, Math.floor((x + r) / cw));
      const j0 = Math.max(0, Math.floor((y - r) / ch)), j1 = Math.min(GH - 1, Math.floor((y + r) / ch));
      let touche = false;
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
        const c = cells[j * GW + i];
        if (c.hp <= 0) continue;
        const cx = (i + .5) * cw, cy = (j + .5) * ch;
        if (Math.hypot(cx - x, cy - y) > r) continue;
        if (horloge - c.dern < 75) continue;
        c.dern = horloge; c.hp--; touche = true; sale = true;
        if (c.hp <= 0 && c.zone) nZoneOk++;
      }
      if (touche) {
        dernierCoup = horloge; son('brosse');
        if (Math.random() < .5) { const rb = wrap.getBoundingClientRect(); poussiere(rb.left + x, rb.top + y, o.glace ? '235,248,255' : sable); }
        majBarre();
        if (pct() >= SEUIL) devoiler();
      }
    }
    function avertir() {
      if (horloge - dernierAvert < 750) return;
      dernierAvert = horloge; nbFelures++;
      son('felure'); secouer(wrap);
      const x = 20 + Math.random() * 60, y = 20 + Math.random() * 60;
      felures.insertAdjacentHTML('beforeend', S(`<path d="M${x} ${y} l6 5 l-4 6 l7 4 l-3 7" stroke="#2a1a0c" stroke-width="1.6" fill="none"/>`, '0 0 100 100').replace('<svg ', '<svg style="position:absolute;inset:0;width:100%;height:100%" '));
      if (nbFelures >= 3) { nbFelures = 0; felures.innerHTML = ''; if (o.onCasse) o.onCasse(); }
      else toast(t('fouille.felure', { n: nbFelures }));
    }
    function segment(x0, y0, x1, y1, dt, auClavier) {
      if (fini || revele || bloque() || etat.verrou) return;
      const d = Math.hypot(x1 - x0, y1 - y0);
      if (o.fragile && !auClavier) {
        const v = d / Math.max(dt, 8) / W;
        vitesse = vitesse * .55 + v * .45;
        if (vitesse > 0.0025) { avertir(); return; }
      }
      const r = o.rayon * W, pas = Math.max(1, Math.ceil(d / (r * .45)));
      for (let k = 0; k <= pas; k++) coup(x0 + (x1 - x0) * k / pas, y0 + (y1 - y0) * k / pas, r);
    }
    function pos(e) { const r = wrap.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
    wrap.addEventListener('pointerdown', (e) => {
      if (fini) return; e.preventDefault();
      try { wrap.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
      actif = true; vitesse = 0; const [x, y] = pos(e); dernier = { x, y, t: performance.now() };
      segment(x, y, x, y, 16, false);
    });
    wrap.addEventListener('pointermove', (e) => {
      if (!actif || !dernier) return;
      const [x, y] = pos(e), n = performance.now();
      segment(dernier.x, dernier.y, x, y, n - dernier.t, false);
      dernier = { x, y, t: n };
    });
    const lacher = () => { actif = false; dernier = null; };
    wrap.addEventListener('pointerup', lacher); wrap.addEventListener('pointercancel', lacher);
    function placerCurseur() { curseur.style.left = (kx * W) + 'px'; curseur.style.top = (ky * H - 30) + 'px'; }
    return {
      pct, devoiler,
      estRevele: () => revele,
      fin() { fini = true; },
      maj(dt) {
        if (W === 0 || Math.abs(wrap.getBoundingClientRect().width - W) > 1) taille();
        if (o.glace && !revele && !fini) {
          accGlace += dt;
          if (accGlace > 850) {
            accGlace = 0;
            if (horloge - dernierCoup > 1100) {
              const cand = cells.filter((c) => c.hp <= 0 && c.type === 'glace' && [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => { const v = cells[(c.j + b) * GW + c.i + a]; return v && c.i + a >= 0 && c.i + a < GW && v.hp > 0; }));
              melanger(cand).slice(0, 4).forEach((c) => { c.hp = 1; if (c.zone) nZoneOk--; sale = true; });
              majBarre();
            }
          }
        }
        dessiner();
      },
      clavier(e) {
        if (fini || revele) return false;
        const pasK = 0.05, x0 = kx * W, y0 = ky * H;
        if (e.key === 'ArrowLeft') kx = Math.max(0.03, kx - pasK);
        else if (e.key === 'ArrowRight') kx = Math.min(0.97, kx + pasK);
        else if (e.key === 'ArrowUp') ky = Math.max(0.04, ky - pasK * 1.5);
        else if (e.key === 'ArrowDown') ky = Math.min(0.96, ky + pasK * 1.5);
        else if (e.key === ' ' || e.key === 'Spacebar') {
          const r = o.rayon * W * .6;
          segment(x0 - r, y0, x0 + r, y0 + r * .3, 200, true);
          clavierVu = true; curseur.classList.add('visible'); placerCurseur();
          return true;
        } else return false;
        clavierVu = true; curseur.classList.add('visible'); placerCurseur();
        segment(x0, y0, kx * W, ky * H, 200, true);
        return true;
      }
    };
  }

  /* ----- Épreuves ----- */
  const MONTEURS = {
    fouille: epFouille, devine: epFouille, lequel: epChoixSimple, loupe: epChoixSimple,
    frise: epFrise, squelette: epSquelette, empreintes: epEmpreintes, vf: epVF
  };

  function epFouille(d) {
    const zone = document.getElementById('zone');
    let txt = d.t === 'devine' ? t('fouille.devine') : t('fouille.consigne');
    if (d.g) txt = t('fouille.fragile'); else if (d.i) txt = t('fouille.glace'); else if (d.r && d.t !== 'devine') txt = t('fouille.roche');
    consigne(txt);
    let q = null, pan = null, repondu = false;
    const fouille = creerFouille(zone, {
      animal: d.animal, roche: d.r, fragile: d.g, glace: d.i, rayon: NIVEAUX[etat.niveau].rayon,
      onReveal: () => { son('degage'); if (!q) montrerQuestion(); },
      onCasse: () => {
        toast(t('fouille.casse'));
        if (perdreCoeur()) { fouille.fin(); plusTard(1300, defaite); }
      }
    });
    function montrerQuestion() { q = questionDe(d); pan = panneauChoix(zone, q.texte, q.options, choisir); }
    if (d.t === 'devine') montrerQuestion();
    function choisir(id, b) {
      if (repondu || bloque() || etat.verrou) return;
      repondu = true; fouille.fin();
      const ok = id === q.bonne;
      marquerChoix(pan.boutons, q.bonne, b, ok);
      const avant = !fouille.estRevele(), p = fouille.pct();
      if (avant) fouille.devoiler();
      finEpreuve(ok);
      if (ok) {
        son('bon');
        let pts = 100, titre = bravo();

    if (d.intrus >= 2) { const autres = Object.keys(QUEUES).filter((k) => k !== ANIMAUX[a].sq.queue); pieces.push({ role: 'queue', cle: hasard(autres), vrai: false }); }
    pieces = melanger(pieces);

    const lbl = (p) => t('piece.' + p.role);

    }
    function poser(b, e) {
      if (bloque() || etat.verrou || !b || !e || e.classList.contains('rempli')) return;

      if (accepte(p, e.dataset.role)) {
        e.classList.add('rempli'); e.innerHTML = dessinPiece(p); e.disabled = true;

    // Glisser-déposer (doigt ou souris) ; un simple toucher choisit la pièce.
    function brancherGlisser(b) {
      let dep = null, fantome = null, vise = null;
      b.addEventListener('pointerdown', (e) => {
        if (bloque() || etat.verrou) return;

        try { b.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
      });

    const bts = document.getElementById('fin-boutons');
    bouton(bts, t('btn.decorer'), 'btn vert', () => { fermerFin(); ouvrirMusee(1); });
    bouton(bts, t('btn.rejouer'), 'btn', () => lancerNiveau(N - 1));
    bouton(bts, t('btn.niveaux'), 'btn clair', () => { fermerFin(); ouvrirNiveaux(); });
    confettis(innerWidth / 2, innerHeight / 3, 80); son('victoire');
  }
  function bouton(parent, texte, cls, fn) { const b = el('button', cls, texte); b.type = 'button'; b.addEventListener('click', () => { son('clic'); fn(); }); parent.append(b); return b; }
  function fermerFin() { document.getElementById('fin').hidden = true; }

  /* ----- Pause ----- */
  function ouvrirPause() {
    if (!etat.enPartie || etat.pauseMenu) return;
    etat.pauseMenu = true; document.getElementById('pause').hidden = false;
    setTimeout(() => { try { document.getElementById('p-reprendre').focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30);
  }
  function fermerPause() { etat.pauseMenu = false; document.getElementById('pause').hidden = true; }
  function quitterPartie() {
    if (etat.enPartie) enregistrer({ niveau: etat.niveau + 1, score: etat.scoreTotal });
    nettoyer(); etat.enPartie = false; fermerPause(); afficherEcran('titre');
  }

  /* ----- Tutoriels animés ----- */
  function sceneTuto(cle) {
    const main = (cls, x, y) => `<div class="main ${cls}" style="left:${x}%;top:${y}%">${ICONES.main}</div>`;
    const fondSable = `<rect width="300" height="200" fill="#c9a77a"/>`;
    const deco = (svg) => S(svg, '0 0 300 200', 'decor');
    const mini = (id, x, y, w) => dessinAnimal(id).replace('<svg ', `<svg x="${x}" y="${y}" width="${w}" height="${w * 2 / 3}" `);
    const carte = (x, y, inner) => `<rect x="${x}" y="${y}" width="80" height="70" rx="10" fill="#fff7e8" stroke="#c9ab78" stroke-width="3"/>${inner}`;
    switch (cle) {
      case 'pinceau': return deco(`${fondSable}<svg x="70" y="30" width="160" height="110" viewBox="0 0 120 80" style="filter:sepia(.8)">${D.ammonite()}</svg><rect x="0" y="0" width="150" height="200" fill="#d8b98c"/><circle cx="150" cy="70" r="30" fill="#d8b98c"/><circle cx="150" cy="140" r="26" fill="#d8b98c"/>`) + main('frotter', 45, 30);
      case 'question': return deco(`<rect width="300" height="200" fill="#e9d6b2"/>${carte(14, 60, mini('trilobite', 18, 70, 72))}${carte(110, 60, mini('mammouth', 114, 70, 72))}${carte(206, 60, mini('stegosaure', 210, 70, 72))}`) + main('toucher', 45, 45);
      case 'devine': return deco(`${fondSable}<svg x="80" y="20" width="140" height="94" viewBox="0 0 120 80" style="filter:sepia(.8)">${D.stegosaure()}</svg><rect x="80" y="20" width="80" height="100" fill="#d8b98c"/><rect x="0" y="130" width="300" height="70" fill="#e9d6b2"/>${carte(30, 128, '')}${carte(190, 128, '')}`) + main('toucher', 22, 62);
      case 'roche': return deco(`${fondSable}<circle cx="110" cy="90" r="45" fill="#8a8580"/><circle cx="200" cy="110" r="35" fill="#9a958e"/><path d="M90 70 l20 30 M190 100 l15 20" stroke="#5a5550" stroke-width="3"/>`) + main('frotter', 38, 32);
      case 'fragile': return deco(`${fondSable}<svg x="70" y="30" width="160" height="110" viewBox="0 0 120 80" style="filter:sepia(.8)">${D.diplodocus()}</svg><path d="M150 60 l10 10 l-8 10 l12 8" stroke="#2a1a0c" stroke-width="3" fill="none"/>`) + main('lent', 45, 30);
      case 'glace': return deco(`<rect width="300" height="200" fill="#d6ecf7"/><svg x="70" y="30" width="160" height="110" viewBox="0 0 120 80" style="filter:sepia(.8)">${D.mammouth()}</svg><rect x="0" y="0" width="140" height="200" fill="#e9f6ff" opacity=".95"/><path d="M30 40 l40 -20 M60 150 l50 -30" stroke="#fff" stroke-width="4"/>`) + main('frotter', 40, 30);
      case 'frise': return deco(`<rect width="300" height="200" fill="#e9d6b2"/><path d="M20 160 H270" stroke="#b5532c" stroke-width="8"/><path d="M270 148 L290 160 L270 172Z" fill="#b5532c"/>${carte(14, 50, mini('trilobite', 18, 60, 72))}${carte(110, 50, mini('tyrannosaure', 114, 60, 72))}${carte(206, 50, mini('mammouth', 210, 60, 72))}`) + main('deux', 30, 35);
      case 'squelette': return deco(`<rect width="300" height="200" fill="#f6ecd8"/><svg x="50" y="10" width="240" height="141" viewBox="0 0 340 200">${corpsSquelette('triceratops')}<rect x="244" y="32" width="80" height="60" rx="14" fill="none" stroke="#b5532c" stroke-width="4" stroke-dasharray="8 6"/></svg><svg x="10" y="130" width="90" height="68" viewBox="0 0 80 60">${CRANES.triceratops}</svg>`) + main('glisser', 22, 62);
      case 'empreintes': return deco(`<rect width="300" height="200" fill="#e9d6b2"/><svg x="30" y="55" width="90" height="90" viewBox="0 0 60 60">${EMPREINTES.griffu}</svg>${carte(180, 60, mini('tyrannosaure', 184, 70, 72))}`) + main('deux', 30, 38);
      case 'vf': return deco(`<rect width="300" height="200" fill="#e9d6b2"/><rect x="30" y="20" width="240" height="16" rx="8" fill="#6cc46a"/><rect x="30" y="50" width="240" height="60" rx="14" fill="#fff7e8"/><rect x="30" y="130" width="110" height="50" rx="14" fill="#3f8f4f"/><rect x="160" y="130" width="110" height="50" rx="14" fill="#c8463c"/><path d="M68 155 l12 12 l22 -24" stroke="#fff" stroke-width="7" fill="none"/><path d="M200 140 l30 30 M230 140 l-30 30" stroke="#fff" stroke-width="7"/>`) + main('toucher', 20, 62);
      case 'loupe': return deco(`<rect width="300" height="200" fill="#e9d6b2"/><circle cx="150" cy="80" r="60" fill="#f8f1e0" stroke="#4b3a2a" stroke-width="10"/><svg x="96" y="26" width="108" height="108" viewBox="88 26 30 30">${D.triceratops()}</svg><rect x="190" y="125" width="20" height="60" rx="8" fill="#4b3a2a" transform="rotate(-40 200 130)"/>`) + main('toucher', 45, 30);
      default: return '';
    }
  }
  let fileTutos = [];
  function montrerTutos(liste) { fileTutos = liste.slice(); tutoSuivant(); }
  function tutoSuivant() {
    const cle = fileTutos.shift();
    if (!cle) { document.getElementById('tuto').hidden = true; etat.tutoOuvert = false; return; }
    etat.tutoOuvert = true;
    document.getElementById('tuto-scene').innerHTML = sceneTuto(cle);
    document.getElementById('tuto-titre').textContent = t('tuto.' + cle + '.titre');
    document.getElementById('tuto-texte').textContent = t('tuto.' + cle + '.texte');
    document.getElementById('tuto').hidden = false;
    // Gardé en mémoire ; enregistré avec la fin de niveau ou la fermeture de la page.
    if (!sauve.tutos.includes(cle)) sauve.tutos.push(cle);
    setTimeout(() => { try { document.getElementById('tuto-ok').focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30);
  }
  function fermerTuto() { son('clic'); tutoSuivant(); }

  /* ----- Sélection des niveaux ----- */
  function ouvrirNiveaux() {
    const liste = document.getElementById('liste-niveaux');
    liste.innerHTML = '';
    const couleurs = ['#2e7f8f', '#3e7a3c', '#b0602c', '#6f97b8'];
    for (let s = 1; s <= 4; s++) {
      liste.append(el('div', 'salle-titre', `<i style="background:${couleurs[s - 1]}"></i>${t('salle.' + s)}`));
      const g = el('div', 'grille-niveaux');
      for (let L = (s - 1) * 5; L < s * 5; L++) {
        const ouvert = debloque(L);
        const b = el('button', 'case-niveau' + (ouvert ? '' : ' ferme'));
        b.type = 'button';
        if (ouvert) {
          b.innerHTML = `<span class="caisse-ico">${ICONES.caisse}</span><span class="num">${L + 1}</span><span class="mini-etoiles">${[0, 1, 2].map((i) => i < sauve.etoiles[L] ? ICONES.etoile : ICONES.etoileVide).join('')}</span>`;
          b.setAttribute('aria-label', t('niveau.aria', { n: L + 1, e: sauve.etoiles[L] }));
          b.addEventListener('click', () => { son('clic'); lancerNiveau(L); });
        } else {
          b.innerHTML = `<span class="num">${L + 1}</span>${ICONES.cadenas}`;
          b.setAttribute('aria-label', t('niveau.ferme', { n: L + 1 }));
          b.disabled = true;
        }
        g.append(b);
      }
      liste.append(g);
    }
    afficherEcran('niveaux');
  }

  /* ----- Mon musée ----- */
  let salleMusee = 1;
  function ouvrirMusee(s) {
    salleMusee = s || salleMusee;
    const ong = document.getElementById('onglets'); ong.innerHTML = '';
    for (let k = 1; k <= 4; k++) {
      const b = el('button', k === salleMusee ? 'actif' : '', t('salle.' + k)); b.type = 'button';
      b.addEventListener('click', () => { son('clic'); ouvrirMusee(k); });
      ong.append(b);
    }
    const salle = document.getElementById('salle-musee'); salle.dataset.s = salleMusee; salle.innerHTML = '';
    salle.append(el('div', 'musee-nom', t('salle.' + salleMusee)));
    const vit = el('div', 'vitrines');
    for (let L = (salleMusee - 1) * 5; L < salleMusee * 5; L++) {
      const id = NIVEAUX[L].vedette, ok = sauve.etoiles[L] > 0;
      const b = el('button', 'vitrine', `<span class="verre">${ok ? fossileSVG(id) : ICONES.caisse}</span><span class="socle"></span>`);
      b.type = 'button';
      b.setAttribute('aria-label', ok ? nom(id) : t('musee.vide'));
      b.addEventListener('click', () => { son('clic'); if (ok) ficheAnimal(id); else toast(t('musee.vide')); });
      vit.append(b);
    }
    salle.append(vit);
    const total = totalEtoiles(), ouvertes = DECOS.filter((x) => x.seuil <= total);
    const decos = el('div', 'decos');
    const choix = Array.isArray(sauve.deco[salleMusee]) ? sauve.deco[salleMusee] : [-1, -1, -1];
    for (let k = 0; k < 3; k++) {
      const idx = DECOS.findIndex((x) => x.id === choix[k]);
      const d = idx >= 0 && DECOS[idx].seuil <= total ? DECOS[idx] : null;
      const b = el('button', 'deco-place' + (d ? ' pleine' : ''), d ? S(d.svg, '0 0 60 60') : '');
      b.type = 'button';
      b.setAttribute('aria-label', t('musee.decoAria', { n: k + 1 }) + (d ? ' : ' + t('deco.' + d.id) : ''));
      b.addEventListener('click', () => {
        if (!ouvertes.length) { toast(t('musee.aucune')); return; }
        const actuel = ouvertes.findIndex((x) => d && x.id === d.id);
        const suivant = actuel + 1 < ouvertes.length ? ouvertes[actuel + 1].id : null;
        const nouv = choix.slice(); nouv[k] = suivant;
        sauve.deco[salleMusee] = nouv; enregistrer({ deco: sauve.deco });
        son('pose'); ouvrirMusee(salleMusee);
        const bt = document.querySelectorAll('.deco-place')[k]; if (bt) { try { bt.focus({ preventScroll: true }); } catch (e) { /* rien */ } if (suivant) confettis(...centre(bt), 12); }
      });
      decos.append(b);
    }
    salle.append(decos);
    const prochaine = DECOS.find((x) => x.seuil > total);
    salle.append(el('div', 'musee-pied', (ouvertes.length ? t('musee.astuce') + ' ' : '') + (prochaine ? t('musee.prochaine', { n: total, s: prochaine.seuil }) : t('musee.toutes'))));
    afficherEcran('musee');
  }
  function ficheAnimal(id) {
    const c = document.getElementById('info-carte');
    c.innerHTML = `<div class="info-anim">${dessinAnimal(id)}</div><h2>${nom(id)}</h2><p>${fait(id)}</p>${ANIMAUX[id].ere ? `<p class="fin-ligne">${ageTexte(id)}</p>` : ''}`;
    bouton(c, t('btn.fermer'), 'btn', () => { document.getElementById('info').hidden = true; });
    document.getElementById('info').hidden = false;
  }

  /* ---------------------------------------------------------------
     Commandes générales
     --------------------------------------------------------------- */
  function jouer() {
    son('clic');
    const nouvelle = () => { etat.scoreTotal = 0; lancerNiveau(0); };
    if (window.JEL_SAVE && window.JEL_SAVE.reprise) {
      window.JEL_SAVE.reprise({
        jeu: JEU,
        onContinuer: (d) => { etat.scoreTotal = Number(d.score) || 0; lancerNiveau(Math.max(0, Math.min(N - 1, (Number(d.niveau) || 1) - 1))); },
        onNouvelle: nouvelle,
        onEffacer: () => { lireSauvegarde(); sauve.niveauMax = 1; nouvelle(); }
      });
    } else nouvelle();
  }
  document.getElementById('btn-jouer').addEventListener('click', jouer);
  document.getElementById('btn-niveaux').addEventListener('click', () => { son('clic'); ouvrirNiveaux(); });
  document.getElementById('btn-musee').addEventListener('click', () => { son('clic'); ouvrirMusee(1); });
  document.querySelectorAll('.retour-titre').forEach((b) => { b.innerHTML = ICONES.retour; b.addEventListener('click', () => { son('clic'); afficherEcran('titre'); }); });
  ['btn-son', 'btn-son-titre', 'p-son'].forEach((id) => document.getElementById(id).addEventListener('click', basculerSon));
  document.getElementById('btn-pause').innerHTML = ICONES.pause;
  document.getElementById('btn-pause').addEventListener('click', () => { son('clic'); ouvrirPause(); });
  document.getElementById('btn-aide').innerHTML = ICONES.ampoule;
  document.getElementById('btn-aide').addEventListener('click', () => { if (!etat.enPartie || etat.pauseMenu) return; son('clic'); const d = etat.epreuves[etat.iEp]; if (d) montrerTutos(tutosPour(d)); });
  document.getElementById('p-reprendre').addEventListener('click', () => { son('clic'); fermerPause(); });
  document.getElementById('p-recommencer').addEventListener('click', () => { son('clic'); fermerPause(); lancerNiveau(etat.niveau); });
  document.getElementById('p-accueil').addEventListener('click', () => { son('clic'); quitterPartie(); });
  document.getElementById('tuto').addEventListener('click', fermerTuto);
  document.getElementById('info').addEventListener('click', (e) => { if (e.target.id === 'info') document.getElementById('info').hidden = true; });

  document.addEventListener('keydown', (e) => {
    if (etat.tutoOuvert) { if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') { e.preventDefault(); fermerTuto(); } return; }
    if (!document.getElementById('info').hidden) { if (e.key === 'Escape') document.getElementById('info').hidden = true; return; }
    if (etat.ecran !== 'jeu' || !etat.enPartie) return;
    if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); if (etat.pauseMenu) fermerPause(); else ouvrirPause(); return; }
    if (etat.pauseMenu) return;
    if (etat.suivant && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); etat.suivant(); return; }
    const m = /^(?:Digit|Numpad)([1-9])$/.exec(e.code);
    if (m && etat.touchesChoix) { const b = etat.touchesChoix[Number(m[1]) - 1]; if (b && b.isConnected && !b.disabled) { e.preventDefault(); b.click(); } return; }
    if (ep && ep.clavier && ep.clavier(e)) e.preventDefault();
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && etat.enPartie) ouvrirPause(); });
  window.addEventListener('resize', tailleFx);

  // Sauvegarde à la fermeture de la page, seulement pendant une partie.
  if (window.JEL_SAVE) window.JEL_SAVE.surFermeture(() => { if (etat.enPartie) window.JEL_SAVE.save(JEU, { niveau: etat.niveau + 1, score: etat.scoreTotal, tutos: sauve.tutos }); });

  // Boucle principale : horloge de jeu, épreuve en cours, effets.
  let avant = performance.now();
  function boucle(n) {
    const dt = Math.min(50, n - avant); avant = n;
    if (etat.enPartie && !etat.pauseMenu && !etat.tutoOuvert) {
      horloge += dt; majMinuteurs();
      if (ep && ep.maj) ep.maj(dt);
    }
    if (!etat.pauseMenu) majFx(dt);
    requestAnimationFrame(boucle);
  }

  // Démarrage.
  lireSauvegarde();
  tailleFx();
  document.getElementById('titre-illu').innerHTML = illustrationTitre();
  majBoutonsSon();
  afficherEcran('titre');
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
