<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });

    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>
  /* ===== Mise en page générale : un écran à la fois, jamais de défilement ===== */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #1b2340; color: #fff8ea;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid #ffd45c; outline-offset: 2px; }
  .ecran { position: fixed; inset: 0; display: none; flex-direction: column; }
  .ecran.actif { display: flex; }

  .bouton {
    min-height: 48px; min-width: 48px; padding: 10px 18px;
    border: none; border-radius: 16px;
    background: #ffffff22; color: #fff8ea; font-weight: 700; font-size: 17px;
    box-shadow: 0 3px 0 #00000040;
    transition: transform .12s;
  }

<script>
'use strict';
/* =====================================================================
   Les blocs des grands bâtisseurs — Free Micro Games
   Puzzle de blocs sans rotation : on pose des pièces sur une grille,
   les lignes et colonnes pleines disparaissent. 24 niveaux, 8 monuments.
   ===================================================================== */

/* <logique> — partie sans affichage (réutilisable pour simuler les niveaux) */

// Formes des pièces : '#' = bloc, '.' = vide, '/' = nouvelle rangée.
// Pas de rotation : chaque orientation est une forme à part.
const FORMES = {
  p: ['#', '##', '#/#', '###', '#/#/#', '##/#.', '##/.#', '#./##', '.#/##'],
  m: ['##/##', '####', '#/#/#/#', '#./#./##', '.#/.#/##', '##/#./#.', '##/.#/.#', '###/#..', '###/..#', '#../###', '..#/###',
      '###/.#.', '.#./###', '#./##/#.', '.#/##/.#', '##./.##', '.##/##.', '#./##/.#', '.#/##/#.'],
  g: ['###/###/###', '#####', '#/#/#/#/#', '###/#../#..', '###/..#/..#', '#../#../###', '..#/..#/###', '###/###', '##/##/##'],
};

function lireForme(texte) {
  const cases = [];
  texte.split('/').forEach((rangee, y) => {
    for (let x = 0; x < rangee.length; x++) if (rangee[x] === '#') cases.push([x, y]);
  });
  const w = Math.max(...cases.map((c) => c[0])) + 1;
  const h = Math.max(...cases.map((c) => c[1])) + 1;
  return { texte, cases, w, h };
}
const FORMES_LUES = { p: FORMES.p.map(lireForme), m: FORMES.m.map(lireForme), g: FORMES.g.map(lireForme) };

/* Niveaux. grille (facultative) : '.' vide, 'x' trou (hors plateau), '#' pierre,
   'g' pierre avec trésor, 'i' pierre gelée, 'j' gelée avec trésor,
   'P' pilier (ne part jamais, compte comme plein), 's' sablier, 'h' herbe folle.
   obj : lignes, score, tresors, glace, herbe. pieces : poids des petites (p),
   moyennes (m) et grandes (g). max : pièces comptées. etoiles : [3 étoiles, 2 étoiles]
   en nombre de pièces posées au plus. tuto : cartes montrées à la première fois. */
const NIVEAUX = [
  // --- Étape 1 : pyramides d'Égypte ---
  { etape: 0, obj: { lignes: 3 }, pieces: { p: 5, m: 2, g: 0 }, aide: 2, etoiles: [12, 17], tuto: ['base1', 'base2', 'base3'] },
  { etape: 0, obj: { lignes: 5 }, pieces: { p: 4, m: 3, g: 0 }, aide: 2, etoiles: [18, 25], tuto: ['combo'] },
  { etape: 0, obj: { lignes: 6 }, pieces: { p: 4, m: 3, g: 0 }, aide: 2, etoiles: [17, 24], tuto: ['pierres'],
    grille: ['........', '........', '##....##', '#......#', '#......#', '##....##', '........', '........'] },
  // --- Étape 2 : temple grec ---
  { etape: 1, obj: { tresors: true }, pieces: { p: 4, m: 3, g: 0 }, aide: 2, etoiles: [11, 16], tuto: ['tresor'],
    grille: ['........', '.g......', '.##..#g.', '........', '...##...', '.....#..', '..g#....', '........'] },
  { etape: 1, obj: { tresors: true, lignes: 5 }, pieces: { p: 4, m: 3, g: 0 }, marteaux: 1, aide: 1, etoiles: [18, 25], tuto: ['marteau'],
    grille: ['#......#', '..g.....', '...##...', '.#....g.', '.g....#.', '...##...', '.....g..', '#......#'] },
  { etape: 1, obj: { lignes: 8 }, pieces: { p: 3, m: 3, g: 2 }, marteaux: 1, aide: 1, etoiles: [23, 31], tuto: ['grandes'],
    grille: ['........', '........', '........', '...##...', '...##...', '........', '........', '........'] },
  // --- Étape 3 : Grande Muraille de Chine ---
  { etape: 2, obj: { lignes: 8 }, pieces: { p: 4, m: 3, g: 1 }, marteaux: 1, aide: 1, etoiles: [22, 30], tuto: ['trous'],
    grille: ['.x.x.x.x', '........', '........', '........', '........', '........', '...xx...', '...xx...'] },
  { etape: 2, obj: { score: 300 }, pieces: { p: 3, m: 3, g: 1 }, marteaux: 1, aide: 1, etoiles: [20, 27], tuto: ['score'],
    grille: ['........', '........', '..g..g..', '........', '........', '..g..g..', '........', '........'] },
  { etape: 2, obj: { glace: true }, pieces: { p: 3, m: 3, g: 1 }, marteaux: 1, aide: 1, etoiles: [15, 21], tuto: ['glace'],
    grille: ['........', '.i....i.', '........', '...ii...', '...ii...', '........', '.i....i.', '........'] },
  // --- Étape 4 : temple maya ---
  { etape: 3, obj: { glace: true, tresors: true }, pieces: { p: 3, m: 3, g: 1 }, marteaux: 1, aide: 1, etoiles: [21, 29],
    grille: ['i......i', '...j....', '.#....#.', '..g..i..', '..i..g..', '.#....#.', '....j...', 'i......i'] },
  { etape: 3, obj: { lignes: 8 }, max: 32, pieces: { p: 3, m: 3, g: 1 }, marteaux: 1, aide: 1, etoiles: [22, 27], tuto: ['comptees'],
    grille: ['........', '.#....#.', '........', '........', '........', '........', '.#....#.', '........'] },
  { etape: 3, obj: { tresors: true }, max: 24, pieces: { p: 4, m: 3, g: 1 }, marteaux: 1, aide: 1, etoiles: [14, 19],
    grille: ['xx.g..xx', 'x......x', '.g......', '.....g..', '........', '..g.....', '......g.', '........'] },
  // --- Étape 5 : château fort ---

function caseVide() { return { b: false, col: 0, gem: false, glace: false, pilier: false, sab: 0, herbe: false, dore: false }; }

// Plateau : { w, h, c: [cases] } ; une case vaut null si c'est un trou.
function creerPlateau(niv) {
  const taille = niv.taille || 8;
  const g = niv.grille || Array.from({ length: taille }, () => '.'.repeat(taille));
  const P = { w: g[0].length, h: g.length, c: [] };
  for (let y = 0; y < P.h; y++) {
    for (let x = 0; x < P.w; x++) {
      const ch = g[y][x];
      if (ch === 'x') { P.c.push(null); continue; }
      const k = caseVide();
      if (ch !== '.') { k.b = true; k.col = -1; }
      if (ch === 'g' || ch === 'j') k.gem = true;
      if (ch === 'i' || ch === 'j') k.glace = true;
      if (ch === 'P') k.pilier = true;
      if (ch === 's') k.sab = (niv.sablier && niv.sablier.duree) || 10;
      if (ch === 'h') k.herbe = true;
      P.c.push(k);
    }
  }
  return P;
}
function copierPlateau(P) { return { w: P.w, h: P.h, c: P.c.map((k) => (k ? { ...k } : null)) }; }
function caseEn(P, x, y) { return x < 0 || y < 0 || x >= P.w || y >= P.h ? null : P.c[y * P.w + x]; }

function peutPoser(P, forme, x, y) {
  for (const [dx, dy] of forme.cases) {
    const k = caseEn(P, x + dx, y + dy);
    if (!k || k.b) return false;
  }
  return true;
}
function trouverPlace(P, forme) {
  for (let y = 0; y <= P.h - forme.h; y++) for (let x = 0; x <= P.w - forme.w; x++) if (peutPoser(P, forme, x, y)) return [x, y];
  return null;
}
function poser(P, piece, x, y) {
  for (const [dx, dy] of piece.forme.cases) {
    const k = caseEn(P, x + dx, y + dy);
    Object.assign(k, caseVide(), { b: true, col: piece.col, dore: !!piece.dore });
  }
}

// Lignes et colonnes pleines (une ligne de piliers seuls ne compte pas).
function lignesPleines(P) {
  const rangees = [], colonnes = [];
  for (let y = 0; y < P.h; y++) {
    let n = 0, plein = true, autre = false;
    for (let x = 0; x < P.w; x++) { const k = caseEn(P, x, y); if (!k) continue; n++; if (!k.b) plein = false; else if (!k.pilier) autre = true; }
    if (n && plein && autre) rangees.push(y);
  }
  for (let x = 0; x < P.w; x++) {
    let n = 0, plein = true, autre = false;
    for (let y = 0; y < P.h; y++) { const k = caseEn(P, x, y); if (!k) continue; n++; if (!k.b) plein = false; else if (!k.pilier) autre = true; }
    if (n && plein && autre) colonnes.push(x);
  }
  return { rangees, colonnes, n: rangees.length + colonnes.length };
}

// Efface les lignes données ; renvoie ce qui est parti (pour l'animation et les objectifs).
function effacer(P, pleines) {
  const indices = new Set();
  for (const y of pleines.rangees) for (let x = 0; x < P.w; x++) indices.add(y * P.w + x);
  for (const x of pleines.colonnes) for (let y = 0; y < P.h; y++) indices.add(y * P.w + x);
  const r = { n: pleines.n, parties: [], gems: 0, glaces: 0, herbes: 0, sabliers: 0, dore: false };
  for (const i of indices) {
    const k = P.c[i];
    if (!k || !k.b || k.pilier) continue;
    if (k.dore) r.dore = true;
    if (k.glace) { k.glace = false; r.glaces++; r.parties.push({ i, glace: true }); continue; }
    if (k.gem) r.gems++;
    if (k.herbe) r.herbes++;
    if (k.sab) r.sabliers++;
    r.parties.push({ i, k: { ...k } });
    P.c[i] = caseVide();
  }
  return r;
}
function pointsLignes(n, dore) { return n ? 20 * n * n * (dore ? 2 : 1) : 0; }

function compter(P, test) { let n = 0; for (const k of P.c) if (k && test(k)) n++; return n; }

// Tirage d'une pièce selon les poids du niveau.
function tirerUne(niv, rng) {
  const poids = niv.pieces;
  const total = poids.p + poids.m + poids.g;
  let r = rng() * total;
  const cat = r < poids.p ? 'p' : r < poids.p + poids.m ? 'm' : 'g';
  const liste = FORMES_LUES[cat];
  return { forme: liste[Math.floor(rng() * liste.length)], col: Math.floor(rng() * 4), dore: !!(niv.dore && rng() < niv.dore) };
}
// Trois pièces, dont au moins « aide » qui rentrent dans le plateau actuel.
function tirerPieces(P, niv, rng) {
  const besoin = niv.aide || 1;
  let meilleur = null, mieux = -1;
  for (let essai = 0; essai < 40; essai++) {
    const lot = [tirerUne(niv, rng), tirerUne(niv, rng), tirerUne(niv, rng)];
    const n = lot.filter((p) => trouverPlace(P, p.forme)).length;
    if (n >= besoin) return lot;
    if (n > mieux) { mieux = n; meilleur = lot; }
  }
  // Dernier recours : une petite pièce qui rentre, s'il y en a une.
  if (mieux < 1) {
    const petite = FORMES_LUES.p.find((f) => trouverPlace(P, f));
    if (petite) meilleur[0] = { forme: petite, col: Math.floor(rng() * 4), dore: false };
  }
  return meilleur;
}

// État d'une partie au début d'un niveau.
function nouvelEtat(niv) {
  const P = creerPlateau(niv);
  return {
    P, score: 0, lignes: 0, gems: 0, glaces: 0, pieces: 0,
    gemsTotal: compter(P, (k) => k.gem), glacesTotal: compter(P, (k) => k.glace),
    herbesMax: compter(P, (k) => k.herbe), marteaux: niv.marteaux || 0,
  };
}

// Applique le résultat d'un effacement à l'état (score, objectifs).
function compterEffacement(E, r) {
  const pts = pointsLignes(r.n, r.dore) + r.gems * 25 + r.glaces * 5 + r.herbes * 5 + r.sabliers * 15;
  E.score += pts; E.lignes += r.n; E.gems += r.gems; E.glaces += r.glaces;
  if (r.n >= 3) E.marteaux = Math.min(3, E.marteaux + 1);
  return pts;
}

// Objectifs : liste { cle, a, b, ok } (a = fait, b = à faire).
function objectifs(niv, E) {
  const o = niv.obj, l = [];
  if (o.lignes) l.push({ cle: 'lignes', a: Math.min(E.lignes, o.lignes), b: o.lignes, ok: E.lignes >= o.lignes });
  if (o.score) l.push({ cle: 'score', a: Math.min(E.score, o.score), b: o.score, ok: E.score >= o.score });
  if (o.tresors) l.push({ cle: 'tresors', a: E.gems, b: E.gemsTotal, ok: E.gems >= E.gemsTotal });
  if (o.glace) l.push({ cle: 'glace', a: E.glaces, b: E.glacesTotal, ok: E.glaces >= E.glacesTotal });
  if (o.herbe) {
    const reste = compter(E.P, (k) => k.herbe);
    E.herbesMax = Math.max(E.herbesMax, reste);
    l.push({ cle: 'herbe', a: reste, b: E.herbesMax, ok: reste === 0 });
  }
  return l;
}
function objectifAtteint(niv, E) { return objectifs(niv, E).every((o) => o.ok); }
function avancement(niv, E) {
  const l = objectifs(niv, E);
  if (!l.length) return 0;
  return l.reduce((s, o) => s + (o.cle === 'herbe' ? (o.b ? 1 - o.a / o.b : 1) : (o.b ? o.a / o.b : 1)), 0) / l.length;
}

// Ce qui change après chaque pièce : sabliers, nouveaux sabliers, herbes qui poussent.
function evoluer(niv, E, rng) {
  const P = E.P, ev = { sablierVide: false, nouveauSablier: -1, pousse: -1 };
  for (const k of P.c) if (k && k.sab > 0) { k.sab--; if (k.sab === 0) ev.sablierVide = true; }
  if (niv.sablier && niv.sablier.tous && E.pieces % niv.sablier.tous === 0) {
    const vides = [];
    P.c.forEach((k, i) => { if (k && !k.b) vides.push(i); });
    if (vides.length) {
      const i = vides[Math.floor(rng() * vides.length)];
      Object.assign(P.c[i], caseVide(), { b: true, col: -1, sab: niv.sablier.duree });
      ev.nouveauSablier = i;
    }
  }
  if (niv.herbe && E.pieces % niv.herbe.tous === 0) {
    const voisins = [];
    for (let y = 0; y < P.h; y++) for (let x = 0; x < P.w; x++) {
      const k = caseEn(P, x, y);
      if (!k || !k.herbe) continue;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const v = caseEn(P, x + dx, y + dy);
        if (v && !v.b) voisins.push((y + dy) * P.w + x + dx);
      }
    }
    if (voisins.length) {
      const i = voisins[Math.floor(rng() * voisins.length)];
      Object.assign(P.c[i], caseVide(), { b: true, col: -1, herbe: true });
      ev.pousse = i;
    }
  }
  return ev;
}

// Coup de marteau sur une case : renvoie ce qui est parti, ou null.
function frapper(E, i) {
  const k = E.P.c[i];
  if (!k || !k.b || k.pilier) return null;
  if (k.glace) { k.glace = false; E.glaces++; return { glace: true, k: { ...k } }; }
  const avant = { ...k };
  if (k.gem) E.gems++;
  E.P.c[i] = caseVide();
  return { k: avant };
}

function etoilesPour(niv, pieces) { return pieces <= niv.etoiles[0] ? 3 : pieces <= niv.etoiles[1] ? 2 : 1; }

function demarrerAudio() {

function note(freq, debut, duree, type = 'sine', volume = 0.15, glisse = 0) {
  if (!audio || !sonActif) return;
  const t0 = audio.currentTime + debut;
  const o = audio.createOscillator();
  const g = audio.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (glisse) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + glisse), t0 + duree);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(volume, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
  o.connect(g).connect(audio.destination);
  o.start(t0); o.stop(t0 + duree + 0.05);
}
function bruit(debut, duree, volume = 0.12, filtre = 1200) {
  if (!audio || !sonActif) return;
  const t0 = audio.currentTime + debut;
  const n = Math.floor(audio.sampleRate * duree);
  const tampon = audio.createBuffer(1, n, audio.sampleRate);
  const d = tampon.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = audio.createBufferSource();
  s.buffer = tampon;
  const f = audio.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = filtre;
  const g = audio.createGain();
  g.gain.value = volume;
  s.connect(f).connect(g).connect(audio.destination);
  s.start(t0);
}

}

  m.liste.forEach((b, i) => {

/* ---------- Écran titre : monuments faits de blocs ---------- */
const titre = { anime: false, chutes: [], depart: 0 };
function dessinerTitre(t) {
  const c = $('toile-titre');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = c.clientWidth, H = c.clientHeight;
  if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Ciel du soir
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3b4c9a'); g.addColorStop(0.45, '#f39c6b'); g.addColorStop(0.7, '#ffd59a'); g.addColorStop(1, '#ffd59a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const haut = document.querySelector('.titre-haut'), basEl = document.querySelector('.titre-bas');
  const libreHaut = haut ? haut.offsetTop + haut.offsetHeight + 10 : H * 0.35;
  const sol = Math.max(libreHaut + 80, (basEl ? basEl.offsetTop : H * 0.8) - 14);
  const libre = sol - libreHaut;
  // Soleil
  ctx.fillStyle = '#fff2b8';
  ctx.beginPath(); ctx.arc(W * 0.8, libreHaut + libre * 0.3, Math.min(W, H) * 0.08, 0, Math.PI * 2); ctx.fill();
  // Nuages
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  for (let i = 0; i < 3; i++) {
    const x = ((t * 8 + i * 170) % (W + 200)) - 100, y = libreHaut + libre * (0.12 + i * 0.12);
    ctx.beginPath(); ctx.ellipse(x, y, 46, 12, 0, 0, Math.PI * 2); ctx.ellipse(x + 30, y - 8, 30, 12, 0, 0, Math.PI * 2); ctx.fill();
  }
  // Au loin, sur une colline : temple grec, muraille et temple maya
  const s = Math.max(6, Math.min(W / 40, (libre * 0.45) / 8, 18));
  const colline = sol - Math.min(libre * 0.45, s * 14);
  ctx.fillStyle = '#e7b578';
  ctx.beginPath(); ctx.moveTo(0, colline + s * 2);
  ctx.quadraticCurveTo(W * 0.5, colline - s * 2, W, colline + s * 2); ctx.lineTo(W, sol); ctx.lineTo(0, sol); ctx.closePath(); ctx.fill();

  dessinerMonument(ctx, 2, 1, W * 0.5, colline - s * 0.2, s * 0.8, t, false);
  dessinerMonument(ctx, 3, 1, W * 0.77, colline + s * 0.8, s * 0.85, t, false);

  ctx.fillStyle = '#c4843f'; ctx.fillRect(0, sol, W, 6);
  // Devant : pyramide, château, pagode
  dessinerMonument(ctx, 0, 1, W * 0.18, sol, s, t, false);
  dessinerMonument(ctx, 4, 1, W * 0.5, sol, s * 1.05, t, false);
  dessinerMonument(ctx, 5, 1, W * 0.82, sol, s * 0.95, t, false);
  // Une pièce en L dorée qui flotte dans le ciel, prête à être posée sur la muraille
  const gs = Math.max(14, s * 2.2);
  const flotte = Math.sin(t * 2) * 6;
  const sommet = colline - s * 0.2 - 7 * s * 0.8;
  const fx = W * 0.5 - gs, fy = Math.max(libreHaut + 8, sommet - gs * 3.4) + flotte;

  ctx.beginPath(); ctx.moveTo(fx + gs, fy + gs * 2 + 6); ctx.lineTo(fx + gs, sommet - 4); ctx.stroke();
  ctx.setLineDash([]);

  for (const b of titre.chutes) {

    bloc(ctx, b.x, b.y, b.s, b.c, 0.55);
  }
}

  bm.setAttribute('aria-pressed', jeu.mode === 'marteau' ? 'true' : 'false');
  bm.setAttribute('aria-label', traduire('marteauAria', { n: E.marteaux }));

/* ---------- Disposition du canevas ---------- */
function redimensionner() {
  const c = $('toile');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = c.clientWidth, H = c.clientHeight;
  if (!W || !H) return;
  c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  const P = jeu.E ? jeu.E.P : { w: 8, h: 8 };
  const bandeMon = Math.max(54, Math.min(150, H * 0.17));
  const reserveH = Math.min(150, Math.max(84, H * 0.2));
  const dispo = H - bandeMon - reserveH - 12;
  const s = Math.floor(Math.min((W - 16) / P.w, dispo / P.h, 58));
  const bw = s * P.w, bh = s * P.h;
  const x0 = Math.round((W - bw) / 2), y0 = Math.round(bandeMon + 4);
  jeu.disposition = { W, H, dpr, s, x0, y0, bw, bh, bandeMon, reserveY: y0 + bh + 8, reserveH: H - (y0 + bh + 8) };
}
function caseReserve(i) {
  const d = jeu.disposition;
  const w = d.W / 3;
  return { x: i * w, y: d.reserveY, w, h: d.reserveH };
}
function echelleReserve() {
  const d = jeu.disposition;
  return Math.min(d.s * 0.62, (d.W / 3 - 16) / 5, (d.reserveH - 12) / 5 * 1.6);
}

/* ---------- Boucle de dessin ---------- */
let derniereImage = 0;
function boucle(ms) {

  const dt = Math.min(0.05, (ms - derniereImage) / 1000 || 0);
  derniereImage = ms;
  dessinerConfettis(dt);
  if (!$('ecran-partie').classList.contains('actif') || !jeu.E || !jeu.disposition) return;
  if (jeu.pause) return; // tout est figé pendant la pause
  dessinerPartie(t, dt);
}

function dessinerPartie(t, dt) {
  const c = $('toile'), ctx = c.getContext('2d'), d = jeu.disposition, E = jeu.E, P = E.P;
  const etape = jeu.niv.etape, ET = ETAPES[etape];
  ctx.setTransform(d.dpr, 0, 0, d.dpr, 0, 0);
  // Fond : ciel de l'étape
  const g = ctx.createLinearGradient(0, 0, 0, d.H);
  g.addColorStop(0, ET.ciel[0]); g.addColorStop(0.35, ET.ciel[1]); g.addColorStop(1, '#1b2340');
  ctx.fillStyle = g; ctx.fillRect(0, 0, d.W, d.H);

  const cible = avancement(jeu.niv, E);
  jeu.anim.avanceVue += (cible - jeu.anim.avanceVue) * Math.min(1, dt * 3);
  const m = blocsMonument(etape);
  const tm = Math.min((d.bandeMon - 8) / m.h, (d.W * 0.6) / m.w);
  ctx.fillStyle = ET.sol;
  ctx.fillRect(0, d.bandeMon - 4, d.W, 6);
  dessinerMonument(ctx, etape, jeu.anim.avanceVue, d.W / 2, d.bandeMon - 2, tm, t);

  // Secousse
  ctx.save();
  if (jeu.anim.secousse > 0) {
    jeu.anim.secousse = Math.max(0, jeu.anim.secousse - dt);
    const a = jeu.anim.secousse * 14;
    ctx.translate((Math.random() - 0.5) * a, (Math.random() - 0.5) * a);
  }
  // Plateau
  const s = d.s;
  ctx.fillStyle = 'rgba(20,24,48,0.72)';
  rectArrondi(ctx, d.x0 - 6, d.y0 - 6, d.bw + 12, d.bh + 12, 14); ctx.fill();
  // Lignes qui vont disparaître (aperçu)
  const apercu = calculerApercu();
  const surligne = new Set();
  if (apercu && apercu.ok) {
    const copie = copierPlateau(P);
    poser(copie, apercu.piece, apercu.x, apercu.y);
    const pl = lignesPleines(copie);
    for (const y of pl.rangees) for (let x = 0; x < P.w; x++) surligne.add(y * P.w + x);
    for (const x of pl.colonnes) for (let y = 0; y < P.h; y++) surligne.add(y * P.w + x);
  }
  for (let y = 0; y < P.h; y++) for (let x = 0; x < P.w; x++) {
    const i = y * P.w + x, k = P.c[i];
    if (!k) continue;
    const px = d.x0 + x * s, py = d.y0 + y * s;
    ctx.fillStyle = (x + y) % 2 ? 'rgba(255,255,255,0.09)' : 'rgba(255,255,255,0.13)';
    rectArrondi(ctx, px + 1.5, py + 1.5, s - 3, s - 3, s * 0.14); ctx.fill();
    // Apparition en douceur au début du niveau
    const age = (performance.now() - jeu.anim.entree) / 1000 - (x + y) * 0.03;
    if (k.b) {
      ctx.save();
      if (age < 0.3) { const f = Math.max(0, age / 0.3); ctx.globalAlpha = f; }
      dessinerCase(ctx, k, px, py, s, etape, t, i);
      ctx.restore();
    }
    if (surligne.has(i)) {
      ctx.fillStyle = `rgba(255,236,150,${0.35 + 0.15 * Math.sin(t * 8)})`;
      rectArrondi(ctx, px + 1.5, py + 1.5, s - 3, s - 3, s * 0.14); ctx.fill();
    }
  }
  // Petit rebond des blocs qui viennent d'être posés
  jeu.anim.pose = jeu.anim.pose.filter((p) => (p.vie -= dt) > 0);
  for (const p of jeu.anim.pose) {
    const k = P.c[p.i];
    if (!k || !k.b) continue;
    const x = d.x0 + (p.i % P.w) * s, y = d.y0 + Math.floor(p.i / P.w) * s;
    ctx.fillStyle = `rgba(255,255,255,${p.vie * 1.5})`;
    rectArrondi(ctx, x + 2, y + 2, s - 4, s - 4, s * 0.14); ctx.fill();

  for (const p of jeu.anim.parties) {

    ctx.rotate((1 - f) * 0.6);
    ctx.globalAlpha = f;

  }

  if (jeu.mode === 'marteau') {
    for (let y = 0; y < P.h; y++) for (let x = 0; x < P.w; x++) {
      const k = caseEn(P, x, y);
      if (k && k.b && !k.pilier) {
        ctx.strokeStyle = `rgba(255,212,92,${0.5 + 0.3 * Math.sin(t * 6)})`;
        ctx.lineWidth = 2;

    }

      dessinerMarteau(ctx, d.x0 + cx * s + s * 0.7, d.y0 + cy * s + s * 0.1, s * 0.9, Math.sin(t * 6) * 0.3);
    }
  }
  // Fantôme de la pièce (glisser ou clavier)
  if (apercu) {
    ctx.save();
    for (const [dx, dy] of apercu.piece.forme.cases) {
      const x = apercu.x + dx, y = apercu.y + dy;
      if (x < 0 || y < 0 || x >= P.w || y >= P.h) continue;
      const px = d.x0 + x * s, py = d.y0 + y * s;
      if (apercu.ok) dessinerCase(ctx, { b: true, col: apercu.piece.col, dore: apercu.piece.dore }, px, py, s, etape, t, 0);
      ctx.fillStyle = apercu.ok ? 'rgba(255,255,255,0.25)' : 'rgba(255,80,60,0.45)';
      rectArrondi(ctx, px + 2, py + 2, s - 4, s - 4, s * 0.14); ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();

  // Réserve des 3 pièces
  const rs = echelleReserve();
  for (let i = 0; i < 3; i++) {
    const r = caseReserve(i);
    const p = jeu.pieces[i];
    if (jeu.mode === 'pieces' && i === jeu.sel && p && !jeu.glisse) {
      ctx.fillStyle = 'rgba(255,212,92,0.18)';
      rectArrondi(ctx, r.x + 6, r.y + 2, r.w - 12, r.h - 8, 14); ctx.fill();
      ctx.strokeStyle = 'rgba(255,212,92,0.8)'; ctx.lineWidth = 2; ctx.stroke();
    }
    if (!p || (jeu.glisse && jeu.glisse.i === i && jeu.glisse.bouge)) continue;
    const rentre = !!trouverPlace(P, p.forme);

    const arrive = Math.max(0, 1 - (performance.now() - (p.arrivee || 0)) / 300);
    dessinerPiece(ctx, p, r.x + (r.w - pw) / 2 + arrive * 60, r.y + (r.h - ph) / 2 - 2, rs, etape, rentre ? 1 - arrive : 0.35, t);
  }
  // Pièce tenue sous le doigt
  if (jeu.glisse && jeu.glisse.bouge) {

  for (const e of jeu.anim.eclats) {
    e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 600 * dt;

    ctx.globalAlpha = 1;
  }
  jeu.anim.textes = jeu.anim.textes.filter((e) => (e.vie -= dt) > 0);
  for (const e of jeu.anim.textes) {

    ctx.textAlign = 'center';

/* ---------- Glisser-déposer, toucher, souris ---------- */
function positionPieceTenue() {
  const d = jeu.disposition, g = jeu.glisse, p = jeu.pieces[g.i];
  const s = d.s * 0.92;
  const w = p.forme.w * s, h = p.forme.h * s;
  // Au doigt, la pièce passe au-dessus du doigt pour rester visible.
  const dy = g.doigt ? h + d.s * 0.9 : h / 2;
  return { x: g.x - w / 2, y: g.y - dy };
}
function calculerApercu() {
  const d = jeu.disposition;
  if (jeu.mode !== 'pieces' || jeu.fini) return null;
  if (jeu.glisse && jeu.glisse.bouge) {
    const p = jeu.pieces[jeu.glisse.i];
    if (!p) return null;
    const pos = positionPieceTenue();
    const s2 = d.s * 0.92;
    const cx = pos.x + (p.forme.w * s2) / 2, cy = pos.y + (p.forme.h * s2) / 2;
    const x = Math.round((cx - d.x0) / d.s - p.forme.w / 2);
    const y = Math.round((cy - d.y0) / d.s - p.forme.h / 2);
    if (x < -1 || y < -1 || x + p.forme.w > jeu.E.P.w + 1 || y + p.forme.h > jeu.E.P.h + 1) return null;
    return { piece: p, x, y, ok: peutPoser(jeu.E.P, p.forme, x, y) };
  }
  if (jeu.clavier && jeu.pieces[jeu.sel]) {
    const p = jeu.pieces[jeu.sel];
    return { piece: p, x: jeu.curseur[0], y: jeu.curseur[1], ok: peutPoser(jeu.E.P, p.forme, jeu.curseur[0], jeu.curseur[1]) };
  }
  return null;
}
function pointDe(ev) {
  const r = $('toile').getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}
function caseSous(pt) {
  const d = jeu.disposition;
  const x = Math.floor((pt.x - d.x0) / d.s), y = Math.floor((pt.y - d.y0) / d.s);
  if (x < 0 || y < 0 || x >= jeu.E.P.w || y >= jeu.E.P.h) return null;
  return [x, y];
}
function surAppui(ev) {
  if (!jeu.enCours || jeu.fini || jeu.pause || jeu.bloque) return;
  demarrerAudio();
  const pt = pointDe(ev);
  const d = jeu.disposition;
  if (jeu.mode === 'marteau') {
    const c = caseSous(pt);
    if (c) coupDeMarteau(c[0], c[1]);
    else { jeu.mode = 'pieces'; majBas(); }
    return;
  }
  // Une pièce de la réserve ?
  if (pt.y >= d.reserveY - 10) {
    const i = Math.max(0, Math.min(2, Math.floor(pt.x / (d.W / 3))));
    if (!jeu.pieces[i]) return;
    jeu.sel = i; jeu.clavier = false;

    son('prendre');
    return;
  }
  // Toucher la grille avec une pièce choisie : la poser là (centrée sur le doigt)
  const c = caseSous(pt);
  const p = jeu.pieces[jeu.sel];
  if (c && p) {
    const x = c[0] - Math.floor((p.forme.w - 1) / 2), y = c[1] - Math.floor((p.forme.h - 1) / 2);
    if (peutPoser(jeu.E.P, p.forme, x, y)) jouerPiece(jeu.sel, x, y);

}
function surMouvement(ev) {
  if (!jeu.glisse) return;
  const pt = pointDe(ev);
  jeu.glisse.x = pt.x; jeu.glisse.y = pt.y;
  if (!jeu.glisse.bouge && Math.hypot(pt.x - jeu.glisse.depart.x, pt.y - jeu.glisse.depart.y) > 8) jeu.glisse.bouge = true;
}
function surRelache() {
  const g = jeu.glisse;
  if (!g) return;
  jeu.glisse = null;
  if (!g.bouge) return; // simple toucher : la pièce est choisie
  jeu.glisse = g;
  const a = calculerApercu();
  jeu.glisse = null;
  if (a && a.ok) jouerPiece(g.i, a.x, a.y);

/* ---------- Jouer une pièce ---------- */
function eclatsCase(i, couleur, n = 5) {
  const d = jeu.disposition, P = jeu.E.P;
  const x = d.x0 + (i % P.w + 0.5) * d.s, y = d.y0 + (Math.floor(i / P.w) + 0.5) * d.s;
  for (let k = 0; k < n; k++) jeu.anim.eclats.push({ x, y, vx: (Math.random() - 0.5) * 320, vy: -Math.random() * 300 - 60, r: 4 + Math.random() * 5, c: couleur, vie: 0.6 + Math.random() * 0.4 });
}
function texteVolant(texte, x, y, c, taille) {
  jeu.anim.textes.push({ texte, x, y, c, taille: taille || Math.max(18, jeu.disposition.s * 0.6), vie: 1.1 });
}
function couleurCase(k) {
  const ET = ETAPES[jeu.niv.etape];

}
function animerEffacement(r) {

    eclatsCase(p.i, p.glace ? '#dff4ff' : couleurCase(p.k), p.glace ? 4 : 5);
    if (p.k && p.k.gem) {
      const x = d.x0 + (p.i % P.w + 0.5) * d.s, y = d.y0 + (Math.floor(p.i / P.w) + 0.5) * d.s;
      jeu.anim.eclats.push({ x, y, vx: 0, vy: -420, r: d.s * 0.3, gemme: true, vie: 0.9 });

}
function jouerPiece(i, x, y) {
  const E = jeu.E, niv = jeu.niv, P = E.P, d = jeu.disposition;
  const piece = jeu.pieces[i];
  if (!piece || !peutPoser(P, piece.forme, x, y)) { son('refus'); return; }
  poser(P, piece, x, y);
  jeu.anim.pose = piece.forme.cases.map(([dx, dy]) => ({ i: (y + dy) * P.w + x + dx, vie: 0.35 }));
  E.score += piece.forme.cases.length;
  E.pieces++;
  jeu.pieces[i] = null;
  son('poser');
  // Lignes pleines
  const pleines = lignesPleines(P);
  if (pleines.n) {
    const r = effacer(P, pleines);
    const marteauxAvant = E.marteaux;
    const pts = compterEffacement(E, r);
    animerEffacement(r);
    son('ligne', r.n);
    if (r.gems) setTimeout(() => son('tresor'), 120);
    if (r.glaces) son('glace');
    const cx = d.x0 + (x + piece.forme.w / 2) * d.s, cy = d.y0 + y * d.s;
    texteVolant(traduire('plus', { n: nombre(pts) }), cx, cy, r.dore ? '#ffd45c' : '#fff3c9');
    if (r.n >= 2) {
      jeu.anim.secousse = 0.25 + r.n * 0.05;
      bulle(traduire(r.n >= 4 ? 'combo4' : r.n === 3 ? 'combo3' : 'combo2'));
      confettis(30 + r.n * 15);
    }
    if (E.marteaux > marteauxAvant) setTimeout(() => { son('bonus'); bulle(traduire('marteauGagne')); }, 500);
    if (r.dore) setTimeout(() => son('bonus'), 200);
  }
  if (objectifAtteint(niv, E)) return terminer(true);
  // Le monde bouge : sabliers, herbes
  const ev = evoluer(niv, E, Math.random);
  if (ev.pousse >= 0) { son('pousse'); eclatsCase(ev.pousse, '#9be36f', 6); jeu.anim.pose.push({ i: ev.pousse, vie: 0.5 }); }
  if (ev.nouveauSablier >= 0) { son('tic'); jeu.anim.pose.push({ i: ev.nouveauSablier, vie: 0.6 }); }
  const pleines2 = lignesPleines(P);
  if (pleines2.n) { const r2 = effacer(P, pleines2); compterEffacement(E, r2); animerEffacement(r2); son('ligne', r2.n); }

  if (!jeu.pieces.some(Boolean)) {

function basculerMarteau() {

  for (let i = 0; i < n; i++) confs.push({ x: Math.random() * c.clientWidth, y: -20 - Math.random() * 200, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, c: cols[i % cols.length], w: 6 + Math.random() * 6 });

function dessinerConfettis(dt) {

  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  for (let i = confs.length - 1; i >= 0; i--) {
    const p = confs[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;

    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2);
    ctx.restore();
  }
}

function ouvrirNiveaux() {
  voile('voile-fin', false); voile('voile-pause', false); voile('voile-finale', false);
  jeu.enCours = false; jeu.pause = false;
  if (audio) audio.resume().catch(() => {});
  const liste = $('liste-niveaux');
  liste.innerHTML = '';
  for (let e = 0; e < ETAPES.length; e++) {
    const bloc = document.createElement('div');
    bloc.className = 'etape';
    const h = document.createElement('h3');
    const pastille = document.createElement('i');
    pastille.style.background = ETAPES[e].mon.a;
    h.append(pastille, document.createTextNode(traduire('etape.' + e)));
    const cases = document.createElement('div');
    cases.className = 'cases';
    NIVEAUX.forEach((n, i) => {
      if (n.etape !== e) return;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'b-niveau' + (i + 1 === prog.debloque ? ' courant' : '');
      const ouvert = i + 1 <= prog.debloque;
      const et = prog.etoiles[i] || 0;
      if (ouvert) {
        b.innerHTML = `<span>${nombre(i + 1)}</span><span class="mini-etoiles">${[1, 2, 3].map((k) => etoileSvg(k <= et)).join('')}</span>`;
        b.setAttribute('aria-label', traduire('niveauEtoiles', { n: i + 1, e: et }));
        b.addEventListener('click', () => { son('clic'); lancerNiveau(i); });
      } else {
        b.disabled = true;
        b.innerHTML = `<svg width="22" height="22" aria-hidden="true"><use href="#i-cadenas"/></svg>`;
        b.setAttribute('aria-label', traduire('niveauFerme', { n: i + 1 }));
      }
      b.querySelectorAll('.etoile').forEach((s) => { s.style.width = '14px'; s.style.height = '14px'; });
      cases.appendChild(b);
    });
    bloc.append(h, cases);
    liste.appendChild(bloc);
  }
  const total = prog.etoiles.reduce((s, x) => s + (x || 0), 0);
  $('total-etoiles').textContent = traduire('totalEtoiles', { n: total, total: NIVEAUX.length * 3 });
  montrerEcran('ecran-niveaux');
  const courant = liste.querySelector('.courant');
  if (courant) { courant.scrollIntoView({ block: 'center' }); courant.focus(); }
}
function allerTitre() {
  voile('voile-fin', false); voile('voile-pause', false); voile('voile-finale', false);
  jeu.enCours = false; jeu.pause = false;
  if (audio) audio.resume().catch(() => {});
  montrerEcran('ecran-titre');
  if (effacerTitre && effacerTitre.maj) effacerTitre.maj();
}

/* =====================================================================
   Branchements
   ===================================================================== */
chargerProgres();
majBoutonsSon();

const toile = $('toile');
toile.addEventListener('pointerdown', (e) => { e.preventDefault(); surAppui(e); });
toile.addEventListener('pointermove', (e) => { e.preventDefault(); surMouvement(e); });
toile.addEventListener('pointerup', (e) => { e.preventDefault(); surRelache(e); });
toile.addEventListener('pointercancel', () => { jeu.glisse = null; });
toile.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('resize', () => { if (jeu.E) redimensionner(); });

document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', basculerSon));
$('b-pause').addEventListener('click', () => { demarrerAudio(); son('clic'); mettrePause(); });
$('b-reprendre').addEventListener('click', () => { son('clic'); reprendre(); });
$('b-recommencer').addEventListener('click', () => { reprendre(); son('clic'); lancerNiveau(jeu.index); });
$('b-pause-aide').addEventListener('click', () => {
  voile('voile-pause', false);
  const vus = ['base1', 'base2', 'base3'];
  NIVEAUX.slice(0, jeu.index + 1).forEach((n) => (n.tuto || []).forEach((k) => { if (!vus.includes(k)) vus.push(k); }));
  ouvrirTuto(vus.length > 3 ? vus.slice(-3) : vus, false);
});
$('b-pause-niveaux').addEventListener('click', () => { son('clic'); ouvrirNiveaux(); });
$('b-pause-accueil').addEventListener('click', () => { son('clic'); allerTitre(); });
$('b-marteau').addEventListener('click', basculerMarteau);
$('b-fin-principal').addEventListener('click', () => {
  son('clic');
  const a = $('b-fin-principal').dataset.action;
  if (a === 'suivant') lancerNiveau(jeu.index + 1);
  else if (a === 'bilan') afficherFinale();
  else lancerNiveau(jeu.index);
});
$('b-fin-rejouer').addEventListener('click', () => { son('clic'); lancerNiveau(jeu.index); });
$('b-fin-niveaux').addEventListener('click', () => { son('clic'); ouvrirNiveaux(); });
$('b-finale-niveaux').addEventListener('click', () => { son('clic'); ouvrirNiveaux(); });
$('b-finale-accueil').addEventListener('click', () => { son('clic'); allerTitre(); });
$('b-niv-retour').addEventListener('click', () => { son('clic'); allerTitre(); });
$('b-niveaux-titre').addEventListener('click', () => { demarrerAudio(); son('clic'); ouvrirNiveaux(); });
$('b-aide-titre').addEventListener('click', () => { demarrerAudio(); son('clic'); ouvrirTuto(['base1', 'base2', 'base3'], true); });
$('b-tuto').addEventListener('click', suiteTuto);
$('voile-tuto').addEventListener('click', (e) => { if (e.target === $('voile-tuto')) suiteTuto(); });

// Jouer : fenêtre « Continuer / Nouvelle partie » s'il y a une sauvegarde.
$('b-jouer').addEventListener('click', () => {
  demarrerAudio();
  son('clic');
  JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => {
      chargerProgres();
      const n = Math.max(1, Math.min(NIVEAUX.length, d.niveau));
      prog.debloque = Math.max(prog.debloque, n);
      lancerNiveau(n - 1);
    },
    onNouvelle: () => {
      chargerProgres();
      if (prog.debloque <= 1) lancerNiveau(0); else ouvrirNiveaux();
    },
    onEffacer: () => { effacerProgres(); lancerNiveau(0); },
  });
});
const effacerTitre = JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('effacer-titre'), apres: () => effacerProgres() });

// Sauvegarde à la fermeture de la page, seulement pendant une partie.
JEL_SAVE.surFermeture(() => {
  if ($('ecran-partie').classList.contains('actif') && jeu.E && !jeu.fini) {
    garderLocal();
    JEL_SAVE.save(JEU, {
      niveau: jeu.index + 1, score: prog.records.reduce((s, r) => s + (r || 0), 0),
      debloque: prog.debloque, etoiles: prog.etoiles, records: prog.records, vus: prog.vus, options: { son: sonActif },
    });
  }
});

montrerEcran('ecran-titre');
requestAnimationFrame(boucle);
</script>
</body>
</html>
