  // Décor : ciel, soleil, nuages, décor de l'endroit
  function dessinerCiel(c, w, h, mer, lieu, tt) {
    const g = c.createLinearGradient(0, 0, 0, mer);
    g.addColorStop(0, CIELS[lieu][0]); g.addColorStop(1, CIELS[lieu][1]);
    c.fillStyle = g; c.fillRect(0, 0, w, mer + 2);
    if (lieu === 0 || lieu === 2) {
      const sx = w * 0.82, sy = mer * 0.2;
      const gs = c.createRadialGradient(sx, sy, 4, sx, sy, 60); gs.addColorStop(0, 'rgba(255,250,200,1)'); gs.addColorStop(0.35, 'rgba(255,236,150,.9)'); gs.addColorStop(1, 'rgba(255,236,150,0)');
      c.fillStyle = gs; c.beginPath(); c.arc(sx, sy, 60, 0, Math.PI * 2); c.fill();
    } else if (lieu === 1) {
      const sx = w * 0.3, sy = mer - 30;
      const gs = c.createRadialGradient(sx, sy, 6, sx, sy, 90); gs.addColorStop(0, 'rgba(255,240,190,1)'); gs.addColorStop(0.3, 'rgba(255,190,120,.85)'); gs.addColorStop(1, 'rgba(255,170,110,0)');
      c.fillStyle = gs; c.beginPath(); c.arc(sx, sy, 90, 0, Math.PI * 2); c.fill();
    }
    nuages.forEach((n) => {
      const x = ((n.x + tt * n.v) % 1.3) * w * 1.1 - w * 0.15, y = n.y * mer * 1.6, k = n.k * Math.max(0.7, w / 500);
      c.fillStyle = lieu === 3 ? 'rgba(60,68,82,.85)' : 'rgba(255,255,255,.85)';
      c.beginPath(); c.ellipse(x, y, 34 * k, 11 * k, 0, 0, Math.PI * 2); c.ellipse(x + 16 * k, y - 7 * k, 20 * k, 12 * k, 0, 0, Math.PI * 2); c.ellipse(x - 14 * k, y - 4 * k, 16 * k, 9 * k, 0, 0, Math.PI * 2); c.fill();
    });
  }

  function dessinerDecor(c, w, h, mer, lieu, tt) {
    if (lieu === 0) {
      // falaises blanches avec herbe et colonie d'oiseaux
      const fh = Math.min(h * 0.26, mer * 0.6);
      c.fillStyle = '#b9ad98';
      c.beginPath(); c.moveTo(w, mer + 4); c.lineTo(w, mer - fh * 0.62); c.lineTo(w * 0.93, mer - fh * 0.6); c.lineTo(w * 0.88, mer - fh * 0.35); c.lineTo(w * 0.86, mer + 4); c.fill();
      c.fillStyle = '#93866f';
      c.beginPath(); c.moveTo(0, mer + 4); c.lineTo(0, mer - fh); c.lineTo(w * 0.1, mer - fh * 0.97); c.lineTo(w * 0.15, mer - fh * 0.72); c.lineTo(w * 0.13, mer - fh * 0.4); c.lineTo(w * 0.19, mer + 4); c.fill();
      c.fillStyle = '#6fae4f';
      c.beginPath(); c.moveTo(0, mer - fh - 4); c.quadraticCurveTo(w * 0.06, mer - fh - 9, w * 0.105, mer - fh * 0.97); c.lineTo(0, mer - fh + 6); c.fill();
      c.strokeStyle = 'rgba(80,66,50,.5)'; c.lineWidth = 2;
      for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(0, mer - fh + i * fh * 0.22); c.lineTo(w * (0.12 + i * 0.012), mer - fh + i * fh * 0.22 + 4); c.stroke(); }
      c.fillStyle = '#fff';
      for (let i = 0; i < 9; i++) { c.beginPath(); c.ellipse(w * 0.02 + (i % 3) * w * 0.035, mer - fh * (0.75 - Math.floor(i / 3) * 0.22), 3.2, 2, 0, 0, Math.PI * 2); c.fill(); }
    } else if (lieu === 1) {
      // quai, bateau, phare
      const qh = 26 * S;
      c.fillStyle = '#8c7a66'; c.fillRect(0, mer - qh, w * 0.2, qh + 6);
      c.strokeStyle = 'rgba(60,45,30,.5)'; c.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(0, mer - qh + i * qh / 3); c.lineTo(w * 0.2, mer - qh + i * qh / 3); c.stroke(); }
      c.fillStyle = '#3d3d44'; c.fillRect(w * 0.14, mer - qh - 9, 8, 9);
      const by = mer - 6 + Math.sin(tt * 1.4) * 2;
      c.fillStyle = '#d64b3c'; c.beginPath(); c.moveTo(w * 0.21, by - 12); c.lineTo(w * 0.36, by - 12); c.lineTo(w * 0.33, by + 2); c.lineTo(w * 0.23, by + 2); c.fill();
      c.fillStyle = '#f5efe2'; c.fillRect(w * 0.26, by - 22, w * 0.05, 10);
      c.strokeStyle = '#5a4a3a'; c.lineWidth = 2; c.beginPath(); c.moveTo(w * 0.285, by - 22); c.lineTo(w * 0.285, by - 50); c.stroke();
      const lx = w * 0.88, lh = Math.min(h * 0.25, mer * 0.6);
      c.fillStyle = '#6b6560'; c.beginPath(); c.ellipse(lx, mer, 34, 10, 0, Math.PI, 0); c.fill();
      for (let i = 0; i < 5; i++) {
        c.fillStyle = i % 2 ? '#f4f1ea' : '#d9473a';
        const y0 = mer - 6 - lh * i / 5, y1 = mer - 6 - lh * (i + 1) / 5, w0 = 12 - i * 1.2, w1 = 12 - (i + 1) * 1.2;
        c.beginPath(); c.moveTo(lx - w0, y0); c.lineTo(lx - w1, y1); c.lineTo(lx + w1, y1); c.lineTo(lx + w0, y0); c.fill();
      }
      c.fillStyle = '#ffe9a0'; c.fillRect(lx - 5, mer - 6 - lh - 10, 10, 10);
      c.fillStyle = '#333'; c.beginPath(); c.moveTo(lx - 8, mer - 6 - lh - 10); c.lineTo(lx, mer - 6 - lh - 20); c.lineTo(lx + 8, mer - 6 - lh - 10); c.fill();
      c.fillStyle = 'rgba(255,240,160,.25)'; c.beginPath(); c.moveTo(lx, mer - 6 - lh - 5); c.lineTo(lx - 80 * (1 + Math.sin(tt)), mer - 6 - lh - 25); c.lineTo(lx - 80 * (1 + Math.sin(tt)), mer - 6 - lh + 15); c.fill();
    } else if (lieu === 2) {
      // îlot rocheux et palmier
      const ix = w * 0.76;
      c.fillStyle = '#e8d49a'; c.beginPath(); c.ellipse(ix, mer + 2, 70, 16, 0, Math.PI, 0); c.fill();
      c.fillStyle = '#7f9a5a'; c.beginPath(); c.ellipse(ix - 10, mer - 6, 36, 12, 0, Math.PI, 0); c.fill();
      c.strokeStyle = '#7a5a3a'; c.lineWidth = 4; c.beginPath(); c.moveTo(ix + 10, mer - 8); c.quadraticCurveTo(ix + 16, mer - 30, ix + 8, mer - 52); c.stroke();
      c.fillStyle = '#3f9b4a';
      for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i - 2) * 0.6 + Math.sin(tt + i) * 0.05; c.beginPath(); c.ellipse(ix + 8 + Math.cos(a) * 14, mer - 52 + Math.sin(a) * 8 + 6, 16, 4, a, 0, Math.PI * 2); c.fill(); }
    } else {
      // haute mer : houle lointaine et cargo
      c.fillStyle = 'rgba(30,50,70,.8)';
      c.beginPath(); c.moveTo(0, mer);
      for (let x = 0; x <= w; x += 20) c.lineTo(x, mer - 14 - Math.sin(x * 0.015 + tt * 0.8) * 10);
      c.lineTo(w, mer); c.fill();
      c.fillStyle = 'rgba(25,30,38,.9)'; const sx = ((tt * 6) % (w + 120)) - 60;
      c.fillRect(sx, mer - 30, 46, 8); c.fillRect(sx + 30, mer - 40, 10, 10);
    }
  }

  function surface(x, mer, tt, vagues, amp) {
    let y = mer + Math.sin(x * 0.025 + tt * 1.6) * 3 * amp + Math.sin(x * 0.011 - tt) * 2 * amp;
    if (vagues) vagues.forEach((v) => { const d = (x - v.x) / (v.w * 0.5); y -= v.h * Math.exp(-d * d * 2); });
    return y;
  }

  function dessinerMer(c, w, h, mer, lieu, tt, vagues) {
    const amp = lieu === 3 ? 2.4 : 1;
    const g = c.createLinearGradient(0, mer, 0, h);
    g.addColorStop(0, MERS[lieu][0]); g.addColorStop(1, MERS[lieu][1]);
    c.fillStyle = g; c.beginPath(); c.moveTo(0, h);
    for (let x = 0; x <= w + 8; x += 8) c.lineTo(x, surface(x, mer, tt, vagues, amp));
    c.lineTo(w, h); c.closePath(); c.fill();
    // rayons de lumière
    c.fillStyle = 'rgba(255,255,255,.06)';
    for (let i = 0; i < 4; i++) {
      const x = w * (0.15 + i * 0.25) + Math.sin(tt * 0.3 + i) * 20;
      c.beginPath(); c.moveTo(x - 14, mer); c.lineTo(x + 14, mer); c.lineTo(x + 60, h); c.lineTo(x + 10, h); c.fill();
    }
    // fond
    const fy = h - Math.max(18, (h - mer) * 0.06);
    c.fillStyle = lieu === 2 ? '#e6cf8f' : (lieu === 3 ? '#1b2b36' : '#8b7d5e');
    c.beginPath(); c.moveTo(0, h);
    for (let x = 0; x <= w + 10; x += 10) c.lineTo(x, fy + Math.sin(x * 0.04) * 4);
    c.lineTo(w, h); c.fill();
    if (lieu === 2) {
      const cols = ['#ff7a8a', '#ffb347', '#b57bff', '#ff5e7e', '#58d68d'];
      for (let i = 0; i < 9; i++) {
        const x = (i + 0.5) * w / 9, cc = cols[i % cols.length];
        c.fillStyle = cc; c.beginPath(); c.arc(x, fy, 9, Math.PI, 0); c.fill();
        c.beginPath(); c.arc(x - 6, fy - 8, 5, 0, Math.PI * 2); c.arc(x + 6, fy - 10, 4, 0, Math.PI * 2); c.fill();
      }
    }
    c.strokeStyle = lieu === 3 ? 'rgba(40,90,70,.8)' : 'rgba(40,130,70,.75)'; c.lineWidth = 3;
    for (let i = 0; i < 7; i++) {
      const x = (i + 0.3) * w / 7; c.beginPath(); c.moveTo(x, fy + 4);
      c.quadraticCurveTo(x + Math.sin(tt * 1.2 + i) * 10, fy - 18, x + Math.sin(tt * 1.2 + i + 1) * 6, fy - 34); c.stroke();
    }
  }

  function dessinerEcume(c, w, mer, tt, vagues, lieu) {
    const amp = lieu === 3 ? 2.4 : 1;
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 2.5; c.beginPath();
    for (let x = 0; x <= w + 8; x += 8) { const y = surface(x, mer, tt, vagues, amp); if (x === 0) c.moveTo(x, y); else c.lineTo(x, y); }
    c.stroke();
  }

  // =========================================================================
  // PARTIE
  // =========================================================================
  function nouvellePartie(i) {
    niv = clamp(i, 0, NIVEAUX.length - 1);
    L = Object.assign({ vagues: 0, meduses: 0, danse: false, mouettes: 0, split: 0, profond: 0, vent: 0, dauphins: false }, NIVEAUX[niv]);
    jeu = {
      poissons: 0, plongeons: L.plongeons, score: 0, streak: 0, bestMult: 1, nouvelles: [],
      bancs: [], vagues: [], meduses: [], dauphins: [], mouette: null, parts: [], textes: [],
      vent: 0, ventPh: rand(0, 6), spawnT: 0.3, dauphinT: rand(3, 5), finDans: 0, finGagne: false, secousse: 0,
      remontees: 0,
      o: { x: 0, y: 0, dir: 1, etat: 'plane', angle: Math.PI / 2, ph: 0, prise: [], v: 0, vx: 0, vy: 0, dx: 0, dy: 1, flapV: 0, t: 0, pique: false, rabattu: false }
    };
    disposition();
    const o = jeu.o; o.x = FX0 + FW * 0.3; o.y = birdY;
    for (let k = 0; k < L.vagues; k++) jeu.vagues.push(nouvelleVague(k));
    for (let k = 0; k < L.meduses; k++) jeu.meduses.push(nouvelleMeduse(k));
    // premier banc déjà là pour commencer tout de suite
    jeu.bancs.push(nouveauBanc(true));
    if (L.meduses) decouvrir('meduse');
    visee.angle = Math.PI / 2;
  }
  function ajusterApresResize() {
    const o = jeu.o; o.x = clamp(o.x, FX0 + 20, FX0 + FW - 20);
    if (o.etat === 'plane' || o.etat === 'vise') o.y = birdY;
  }

  function nouvelleVague(k) {
    const dir = k % 2 ? -1 : 1;
    return { x: FX0 + FW * rand(0, 1), w: rand(110, 170) * S, h: (L.lieu === 3 ? 14 : 9) * S, vx: dir * rand(40, 60) * S };
  }
  function nouvelleMeduse(k) {
    const n = Math.max(1, L.meduses);
    return { x: FX0 + FW * ((k + 0.5) / n) + rand(-20, 20) * S, y0: seaY + D * rand(0.3, 0.82), y: 0, ph: rand(0, 6), amp: L.danse ? rand(0.08, 0.16) * D : 0, vx: rand(-12, 12) * S, r: 12 };
  }
  function nouveauBanc(premier) {
    const gauche = Math.random() < 0.5;
    let pf = rand(L.prof[0], L.prof[1]);
    if (L.profond && Math.random() < L.profond) pf = rand(0.72, 0.86);
    const n = randInt(L.taille[0], L.taille[1]);
    const b = {
      cx: premier ? FX0 + FW * rand(0.45, 0.7) : (gauche ? FX0 - 50 * S : FX0 + FW + 50 * S),
      cy: seaY + D * pf, vx: (gauche ? 1 : -1) * L.vit * S * rand(0.8, 1.2), vy: 0,
      vie: L.vie * rand(0.85, 1.2), age: 0, fuite: false, entre: !!premier, poissons: [],
      split: Math.random() < L.split, splitT: rand(3, 5.5), rabat: 0, comp: 1, ph: rand(0, 6)
    };
    const communs = ESPECES.filter((e) => e.lieu === L.lieu && !e.rare);
    const rares = ESPECES.filter((e) => e.lieu === L.lieu && e.rare);
    const rx = 40 * S * Math.sqrt(n / 5), ry = 19 * S * Math.sqrt(n / 5);
    for (let i = 0; i < n; i++) {
      const a = i * 2.39996, r = Math.sqrt((i + 0.5) / n);
      const e = Math.random() < 0.15 ? rares[0] : communs[0];
      b.poissons.push({ ox: Math.cos(a) * r * rx, oy: Math.sin(a) * r * ry, e, ph: rand(0, 6), x: b.cx, y: b.cy });
    }
    return b;
  }
  function diviser(b) {
    b.split = false;
    if (b.poissons.length < 2 || b.fuite) return;
    const moitie = Math.ceil(b.poissons.length / 2);
    const autre = Object.assign({}, b, { poissons: b.poissons.splice(moitie), vx: -b.vx * 1.1, vy: 30 * S, split: false, rabat: 0 });
    b.vy = -30 * S; b.vx *= 1.1;
    const recentrer = (bb) => {
      const mx = bb.poissons.reduce((s, p) => s + p.ox, 0) / bb.poissons.length, my = bb.poissons.reduce((s, p) => s + p.oy, 0) / bb.poissons.length;
      bb.poissons.forEach((p) => { p.ox -= mx; p.oy -= my; }); bb.cx += mx; bb.cy += my;
    };
    recentrer(b); recentrer(autre);
    b.vie = Math.max(b.age + 3, b.vie * 0.85); autre.vie = b.vie;
    jeu.bancs.push(autre);
    for (let i = 0; i < 10; i++) particule(b.cx, b.cy, rand(-60, 60) * S, rand(-60, 60) * S, 0.6, 'eclat', '#ffe07a', 2.5);
    SON.split();
  }

  // --- Particules et textes flottants -----------------------------------------
  function particule(x, y, vx, vy, vie, type, couleur, r) {
    if (!jeu) return;
    if (jeu.parts.length > 260) jeu.parts.shift();
    jeu.parts.push({ x, y, vx, vy, vie, max: vie, type, couleur, r: r || 3 });
  }
  function texteFlottant(x, y, txt, couleur, taille) { if (jeu) jeu.textes.push({ x: clamp(x, 50 * S, W - 50 * S), y, txt, couleur, taille: taille || 22, vie: 1.2 }); }
  function eclaboussure(x, y, force) {
    for (let i = 0; i < 18 * force; i++) particule(x, y, rand(-130, 130) * S * force, rand(-260, -80) * S * force, rand(0.5, 0.9), 'goutte', 'rgba(230,248,255,.95)', rand(2, 4) * S);
    for (let i = 0; i < 12; i++) particule(x + rand(-10, 10), y + rand(4, 30) * S, rand(-20, 20), rand(-60, -20) * S, rand(0.6, 1.4), 'bulle', 'rgba(255,255,255,.7)', rand(1.5, 3.5) * S);
    particule(x, y, 0, 0, 0.6, 'anneau', 'rgba(255,255,255,.8)', 6 * S);
  }

  let minuterieMessage = 0;
  function message(txt, duree) {
    const m = $('message'); m.textContent = txt; m.classList.add('vu');
    clearTimeout(minuterieMessage); minuterieMessage = setTimeout(() => m.classList.remove('vu'), (duree || 1.6) * 1000);
  }
  function astuce(txt) { const a = $('astuce'); if (txt) { a.textContent = txt; a.classList.add('vu'); } else a.classList.remove('vu'); }

  function decouvrir(id) {
    if (!prog.carnet.includes(id)) { prog.carnet.push(id); if (jeu) jeu.nouvelles.push(id); }
  }

  // --- Visée -------------------------------------------------------------------------
  const visee = { angle: Math.PI / 2, px: 0, py: 0, clavier: false, gauche: false, droite: false };
  const ANGLE_MIN = Math.PI * 0.11, ANGLE_MAX = Math.PI * 0.89;
  function angleVers(px, py) {
    const o = jeu.o; let a = Math.atan2(py - o.y, px - o.x);
    if (a < 0) a = px >= o.x ? ANGLE_MIN : ANGLE_MAX; // doigt au-dessus de l'oiseau
    return clamp(a, ANGLE_MIN, ANGLE_MAX);
  }
  function commencerVisee(px, py, clavier) {
    const o = jeu.o;
    if (o.etat !== 'plane' || jeu.plongeons <= 0 || jeu.finDans > 0) return;
    o.etat = 'vise'; visee.clavier = clavier;
    if (!clavier) visee.angle = angleVers(px, py);
    SON.vise();
  }
  function plonger() {
    const o = jeu.o;
    if (o.etat !== 'vise') return;
    o.etat = 'chute'; jeu.plongeons--; o.angle = visee.angle;
    const v = 820 * S; o.vx = Math.cos(o.angle) * v; o.vy = Math.sin(o.angle) * v;
    o.prise = []; o.pique = false; o.rabattu = false; o.vole = false;
    SON.plonge(); majHUD();
    if (jeu.plongeons === 1) message(t('msg.dernier'), 1.4);
  }
  function battreAiles() {
    const o = jeu.o;
    if (o.etat !== 'remonte') return;
    o.flapV = Math.min(o.flapV + 230 * S, 560 * S);
    o.ph += 1.4; SON.aile();
    for (let i = 0; i < 3; i++) particule(o.x + rand(-6, 6), o.y + 10 * S, rand(-30, 30), rand(30, 80) * S, 0.6, 'bulle', 'rgba(255,255,255,.75)', rand(1.5, 3) * S);
    if (jeu.remontees <= 2) astuce('');
  }

  // --- Mise à jour d'une image -----------------------------------------------------
  function majJeu(dt) {
    const o = jeu.o;
    // vent : force et sens qui changent
    if (L.vent) {
      jeu.vent = L.vent * S * Math.sin(T * 0.42 + jeu.ventPh) * (0.65 + 0.35 * Math.sin(T * 1.3 + jeu.ventPh * 2));
      if (Math.random() < dt * 25) particule(jeu.vent > 0 ? -10 : W + 10, rand(birdY * 0.4, seaY - 10), jeu.vent * 2.2 + Math.sign(jeu.vent) * 80, 0, 1.4, 'vent', 'rgba(255,255,255,.55)', 1);
    }
    // vagues
    jeu.vagues.forEach((v) => {
      v.x += v.vx * dt;
      if (v.x > FX0 + FW + v.w) v.x = FX0 - v.w; if (v.x < FX0 - v.w) v.x = FX0 + FW + v.w;
    });
    // méduses
    jeu.meduses.forEach((m) => {
      m.x += m.vx * dt; if (m.x < FX0 + 20 || m.x > FX0 + FW - 20) m.vx *= -1;
      m.y = m.y0 + Math.sin(T * 0.8 + m.ph) * m.amp; m.y = clamp(m.y, seaY + 30 * S, H - 30 * S);
    });
    // bancs
    jeu.spawnT -= dt;
    const actifs = jeu.bancs.filter((b) => !b.fuite).length;
    if (actifs < L.bancs && jeu.spawnT <= 0) { jeu.bancs.push(nouveauBanc(false)); jeu.spawnT = rand(0.9, 1.8); }
    jeu.bancs.forEach((b) => {
      b.age += dt;
      if (!b.fuite && b.age > b.vie) {
        b.fuite = true; const versDroite = b.cx > FX0 + FW / 2;
        b.vx = (versDroite ? 1 : -1) * Math.max(Math.abs(b.vx) * 3.5, 180 * S); b.vy = 25 * S;
      }
      if (b.split && !b.fuite) { b.splitT -= dt; if (b.splitT <= 0) diviser(b); }
      let vx = b.vx;
      if (b.rabat > 0) {
        b.rabat -= dt; vx = b.vx * 0.3;
        b.cy = lerp(b.cy, seaY + D * 0.14, dt * 1.6); b.comp = lerp(b.comp, 0.55, dt * 3);
      } else {
        b.comp = lerp(b.comp, 1, dt * 2);
        b.cy += b.vy * dt + Math.sin(T * 0.9 + b.ph) * 8 * S * dt; b.vy *= (1 - dt * 0.6);
      }
      b.cx += vx * dt;
      if (!b.fuite) {
        if (b.entre) {
          if (b.cx < FX0 + 40 * S) b.vx = Math.abs(b.vx); if (b.cx > FX0 + FW - 40 * S) b.vx = -Math.abs(b.vx);
        } else if (b.cx > FX0 + 40 * S && b.cx < FX0 + FW - 40 * S) b.entre = true;
      }
      b.cy = clamp(b.cy, seaY + D * 0.07, H - D * 0.07);
      const dir = Math.sign(vx) || 1, frisson = (!b.fuite && b.vie - b.age < 1.6) ? 3 : 1;
      b.poissons.forEach((p) => {
        p.ph += dt * (8 + Math.abs(vx) * 0.03);
        p.x = b.cx + p.ox * b.comp + Math.sin(T * 3 + p.ph * 0.2) * 2 * frisson; p.y = b.cy + p.oy * b.comp + Math.cos(T * 2.5 + p.ph * 0.3) * 2 * frisson; p.dir = dir;
      });
    });
    jeu.bancs = jeu.bancs.filter((b) => b.poissons.length && !(b.fuite && (b.cx < -120 || b.cx > W + 120)));
    // dauphins
    if (L.dauphins) {
      jeu.dauphinT -= dt;
      if (jeu.dauphinT <= 0 && !jeu.dauphins.length) {
        const cible = jeu.bancs.find((b) => !b.fuite && b.entre && b.rabat <= 0 && b.vie - b.age > 3);
        if (cible) {
          const gauche = cible.cx > FX0 + FW / 2;
          jeu.dauphins.push({ x: gauche ? FX0 - 60 : FX0 + FW + 60, y: Math.min(H - 30 * S, cible.cy + 60 * S), dir: gauche ? 1 : -1, banc: cible, etat: 'approche', t: 0, ph: 0 });
          decouvrir('dauphin'); SON.dauphin();
        }
        jeu.dauphinT = rand(7, 11);
      }
      jeu.dauphins.forEach((d) => {
        d.ph += dt * 6; d.t += dt;
        const b = d.banc;
        if (d.etat === 'approche') {
          if (!jeu.bancs.includes(b) || b.fuite) { d.etat = 'part'; return; }
          const tx = b.cx, ty = b.cy + 45 * S, dx = tx - d.x, dy = ty - d.y, dd = Math.hypot(dx, dy);
          d.dir = dx > 0 ? 1 : -1;
          if (dd < 20 * S) { d.etat = 'pousse'; d.t = 0; b.rabat = 5; b.vie = Math.max(b.vie, b.age + 6.5); message(t('msg.dauphin'), 1.6); SON.dauphin(); }
          else { d.x += dx / dd * 240 * S * dt; d.y += dy / dd * 240 * S * dt; }
        } else if (d.etat === 'pousse') {
          if (!jeu.bancs.includes(b) || b.rabat <= 0) { d.etat = 'part'; return; }
          d.x = b.cx + Math.sin(d.t * 2) * 50 * S; d.y = lerp(d.y, b.cy + 40 * S, dt * 3); d.dir = Math.cos(d.t * 2) > 0 ? 1 : -1;
        } else { d.x += d.dir * 300 * S * dt; d.y += 20 * S * dt; }
      });
      jeu.dauphins = jeu.dauphins.filter((d) => d.x > -100 && d.x < W + 100);
    }
    // oiseau
    o.ph += dt * (o.etat === 'plane' || o.etat === 'vise' ? 3 : 9);
    if (o.etat === 'plane' || o.etat === 'vise') {
      const vit = 0.24 * FW * (o.etat === 'vise' ? 0.35 : 1);
      o.x += o.dir * vit * dt; o.y = birdY + Math.sin(T * 1.5) * 4 * S;
      if (o.x > FX0 + FW - 28 * S) o.dir = -1; if (o.x < FX0 + 28 * S) o.dir = 1;
      if (o.etat === 'vise' && visee.clavier) {
        if (visee.gauche) visee.angle = Math.min(ANGLE_MAX, visee.angle + dt * 1.6);
        if (visee.droite) visee.angle = Math.max(ANGLE_MIN, visee.angle - dt * 1.6);
      }
    } else if (o.etat === 'chute') {
      o.x += (o.vx + jeu.vent) * dt; o.y += o.vy * dt;
      if (Math.random() < 0.6) particule(o.x, o.y, 0, 0, 0.25, 'trainee', 'rgba(255,255,255,.6)', 2 * S);
      if (o.x < 6 || o.x > W - 6) { o.x = clamp(o.x, 6, W - 6); o.vx = 0; }
      if (o.y >= seaY) entrerDansLEau();
    } else if (o.etat === 'eau') {
      o.v -= o.k * dt;
      o.x += o.dx * o.v * dt; o.y += o.dy * o.v * dt;
      if (o.x < FX0 + 8 || o.x > FX0 + FW - 8) { o.x = clamp(o.x, FX0 + 8, FX0 + FW - 8); o.dx = 0; }
      if (o.y > H - 22 * S) { o.y = H - 22 * S; o.v = Math.min(o.v, 30 * S); }
      if (Math.random() < 0.4) particule(o.x, o.y, rand(-10, 10), rand(-40, -10), 0.8, 'bulle', 'rgba(255,255,255,.7)', rand(1, 2.5) * S);
      attraper();
      if (!o.pique) toucherMeduse();
      if (o.v <= 0 || o.pique) commencerRemontee();
    } else if (o.etat === 'remonte') {
      o.flapV = Math.max(0, o.flapV - 380 * S * dt);
      o.y -= ((o.pique ? 55 : 75) * S + o.flapV) * dt;
      if (Math.random() < 0.3) particule(o.x, o.y + 8, rand(-10, 10), rand(-40, -10), 0.7, 'bulle', 'rgba(255,255,255,.7)', rand(1, 2.5) * S);
      majMouette(dt);
      if (o.y <= seaY) sortirDeLEau();
    } else if (o.etat === 'envol') {
      o.t += dt; const k = doux(Math.min(1, o.t / 0.55));
      o.y = lerp(seaY, birdY, k);
      majMouette(dt);
      if (o.t >= 0.55) { o.etat = 'plane'; resoudre(); }
    }
    if (o.etat !== 'remonte' && o.etat !== 'envol') majMouette(dt);
    // particules
    jeu.parts.forEach((p) => {
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.type === 'goutte') p.vy += 700 * S * dt;
      if (p.type === 'confetti') { p.vy += 120 * dt; p.vx *= 0.99; }
      if (p.type === 'bulle') { p.x += Math.sin(p.vie * 10) * 0.3; if (p.y < seaY) p.vie = 0; }
    });
    jeu.parts = jeu.parts.filter((p) => p.vie > 0);
    jeu.textes.forEach((x) => { x.vie -= dt; x.y -= 40 * dt; });
    jeu.textes = jeu.textes.filter((x) => x.vie > 0);
    jeu.secousse = Math.max(0, jeu.secousse - dt);
    if (jeu.finDans > 0) { jeu.finDans -= dt; if (jeu.finDans <= 0) { if (jeu.finGagne) victoire(); else defaite(); } }
  }

  function entrerDansLEau() {
    const o = jeu.o;
    o.y = seaY; o.etat = 'eau';
    let vx = o.vx + jeu.vent, vy = o.vy; const n = Math.hypot(vx, vy) || 1;
    o.dx = vx / n; o.dy = vy / n;
    o.v = 540 * S; o.k = (o.v * o.v) / (2 * 0.9 * D);
    eclaboussure(o.x, seaY, 1); SON.plouf(); jeu.secousse = 0.12;
    // un plongeon tout près fait éclater les bancs qui se séparent
    jeu.bancs.forEach((b) => { if (b.split && Math.hypot(b.cx - o.x, b.cy - seaY) < 170 * S) diviser(b); });
  }
  function attraper() {
    const o = jeu.o, r = 26 * S;
    jeu.bancs.forEach((b) => {
      for (let i = b.poissons.length - 1; i >= 0; i--) {
        if (o.prise.length >= 6) return;
        const p = b.poissons[i];
        if (Math.hypot(p.x - o.x, p.y - o.y) < r) {
          b.poissons.splice(i, 1); o.prise.push(p.e.id);
          if (b.rabat > 0) o.rabattu = true;
          SON.poisson(o.prise.length);
          for (let k = 0; k < 6; k++) particule(p.x, p.y, rand(-80, 80) * S, rand(-80, 80) * S, 0.5, 'eclat', p.e.rare ? '#ffe07a' : '#ffffff', 2.2 * S);
        }
      }
    });
  }
  function toucherMeduse() {
    const o = jeu.o;
    jeu.meduses.forEach((m) => {
      if (!o.pique && Math.hypot(m.x - o.x, (m.y + 4 * S) - o.y) < (m.r + 5) * S) {
        o.pique = true; o.prise = []; jeu.secousse = 0.35; SON.pique();
        message(t('msg.pique'), 1.6);
        for (let k = 0; k < 12; k++) particule(o.x, o.y, rand(-90, 90) * S, rand(-90, 90) * S, 0.5, 'eclat', '#ff6fb5', 2.5 * S);
      }
    });
  }
  function commencerRemontee() {
    const o = jeu.o;
    o.etat = 'remonte'; o.flapV = 0; jeu.remontees++;
    if (niv === 0 && jeu.remontees <= 2) astuce(t('msg.remonte'));
    if (L.mouettes && o.prise.length && !o.pique) {
      const gauche = Math.random() < 0.5;
      jeu.mouette = { x: gauche ? -30 : W + 30, y: birdY - 30 * S, x0: gauche ? -30 : W + 30, y0: birdY - 30 * S, t: 0, T: L.mouettes, etat: 'fonce', porte: 0, ph: 0, dir: gauche ? 1 : -1 };
      decouvrir('mouette'); SON.mouette();
    }
  }
  function majMouette(dt) {
    const m = jeu.mouette; if (!m) return;
    const o = jeu.o;
    m.ph += dt * 10;
    if (m.etat === 'fonce') {
      m.t += dt; const k = Math.min(1, m.t / m.T);
      m.x = lerp(m.x0, o.x, k); m.y = lerp(m.y0, seaY - 8 * S, k * k) - Math.sin(k * Math.PI) * 40 * S;
      m.dir = o.x > m.x ? 1 : -1;
      if (k >= 1) {
        if (o.etat === 'remonte' && o.prise.length) {
          const n = Math.ceil(o.prise.length / 2);
          o.prise.splice(o.prise.length - n, n); m.porte = n; o.vole = true;
          message(t('msg.vole', { n }), 1.8); SON.vole(); jeu.secousse = 0.3;
          for (let i = 0; i < 8; i++) particule(m.x, m.y, rand(-60, 60) * S, rand(-60, 20) * S, 0.8, 'plume', '#ffffff', 3 * S);
        }
        m.etat = 'part';
      }
    } else {
      m.x += m.dir * 220 * S * dt; m.y -= 90 * S * dt;
      if (m.x < -60 || m.x > W + 60 || m.y < -60) jeu.mouette = null;
    }
  }
  function sortirDeLEau() {
    const o = jeu.o;
    o.y = seaY; o.etat = 'envol'; o.t = 0; o.angle = -Math.PI / 2;
    eclaboussure(o.x, seaY, 0.5);
    const m = jeu.mouette;
    if (m && m.etat === 'fonce') { m.etat = 'part'; m.dir = m.x < o.x ? -1 : 1; if (o.prise.length) message(t('msg.semee'), 1.4); }
    astuce('');
  }
  function resoudre() {
    const o = jeu.o, n = o.prise.length;
    if (n > 0) {
      const mult = Math.min(5, 1 + jeu.streak);
      let base = 0; o.prise.forEach((id) => { base += ESP[id].rare ? 30 : 10; decouvrir(id); });
      const pts = base * mult;
      jeu.score += pts; jeu.poissons += n; jeu.bestMult = Math.max(jeu.bestMult, mult);
      jeu.streak += o.rabattu ? 2 : 1;
      texteFlottant(o.x, o.y + 26 * S, t('plus', { n: nombre(pts) }), '#ffe07a', 26);
      if (mult > 1) texteFlottant(o.x, o.y + 54 * S, t('mult', { n: mult }), '#ffffff', 20);
      for (let i = 0; i < 14; i++) particule(o.x, o.y, rand(-120, 120) * S, rand(-160, 40) * S, 0.9, 'eclat', i % 2 ? '#ffe07a' : '#ffffff', 2.6 * S);
      const nm = Math.min(5, 1 + jeu.streak);
      if (nm > mult) { SON.combo(nm); const e = $('hud-mult'); e.classList.add('pop'); setTimeout(() => e.classList.remove('pop'), 250); }
    } else {
      if (!o.pique && !o.vole) { message(t('msg.rate'), 1.2); SON.rate(); }
      jeu.streak = 0;
    }
    o.prise = []; majHUD();
    if (jeu.poissons >= L.cible) { jeu.finDans = 0.8; jeu.finGagne = true; }
    else if (jeu.plongeons <= 0) { jeu.finDans = 0.8; jeu.finGagne = false; }
  }

  // --- Dessin de la partie ----------------------------------------------------------
  function dessinerJeu() {
    const c = ctx, o = jeu.o;
    c.save();
    if (jeu.secousse > 0) c.translate(rand(-5, 5) * jeu.secousse * 4, rand(-5, 5) * jeu.secousse * 4);
    dessinerCiel(c, W, H, seaY, L.lieu, T);
    dessinerDecor(c, W, H, seaY, L.lieu, T);
    dessinerMer(c, W, H, seaY, L.lieu, T, jeu.vagues);
    // méduses, bancs, dauphins
    jeu.meduses.forEach((m) => dessinerMeduse(c, m.x, m.y, S, T + m.ph));
    jeu.bancs.forEach((b) => {
      if (b.split && !b.fuite) { c.fillStyle = 'rgba(255,224,122,.18)'; c.beginPath(); c.ellipse(b.cx, b.cy, 56 * S, 30 * S, 0, 0, Math.PI * 2); c.fill(); }
      if (b.rabat > 0) { c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2; c.beginPath(); c.arc(b.cx, b.cy, 40 * S + Math.sin(T * 6) * 3, 0, Math.PI * 2); c.stroke(); }
      b.poissons.forEach((p) => dessinerPoisson(c, p.x, p.y, p.dir || 1, S * 1.35, p.e, p.ph));
    });
    jeu.dauphins.forEach((d) => dessinerDauphin(c, d.x, d.y, d.dir, S, d.ph));
    // écume des vagues : cache les poissons du dessous
    jeu.vagues.forEach((v) => {
      const h = D * 0.55, x0 = v.x - v.w / 2;
      const g = c.createLinearGradient(0, seaY, 0, seaY + h);
      g.addColorStop(0, 'rgba(225,244,255,.97)'); g.addColorStop(0.8, 'rgba(170,215,240,.93)'); g.addColorStop(1, 'rgba(170,215,240,0)');
      c.fillStyle = g; c.beginPath();
      c.moveTo(x0, seaY); c.quadraticCurveTo(v.x, seaY - v.h, x0 + v.w, seaY);
      c.lineTo(x0 + v.w - 10 * S, seaY + h); c.quadraticCurveTo(v.x, seaY + h + 18 * S, x0 + 10 * S, seaY + h); c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,255,255,.8)';

  $('b-niveaux').addEventListener('click', () => { audio(); SON.clic(); ouvrirNiveaux('ecran-titre'); });
  $('b-carnet').addEventListener('click', () => { audio(); SON.clic(); ouvrirCarnet('ecran-titre'); });
  $('b-plumages').addEventListener('click', () => { audio(); SON.clic(); ouvrirPlumages(); });
  document.querySelectorAll('[data-retour]').forEach((b) => b.addEventListener('click', () => { SON.clic(); if (ecranRetour === 'ecran-fin' && jeu) { mode = 'fin'; montrer('ecran-fin'); } else { mode = 'titre'; montrer('ecran-titre'); } }));

  // --- Niveaux ---
  const CADENAS = '<svg class="cadenas" viewBox="0 0 16 18"><path d="M4 8V5a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2" fill="none"/><rect x="2" y="8" width="12" height="9" rx="2" fill="currentColor"/></svg>';
  function ouvrirNiveaux(retour) {
    ecranRetour = retour; mode = 'menu';
    const max = niveauMax(), liste = $('niveaux-liste'); liste.innerHTML = '';
    $('niveaux-total').textContent = t('niveaux.etoiles', { n: totalEtoiles(), max: ETOILES_MAX });
    for (let l = 0; l < 4; l++) {
      const h = document.createElement('h3'); h.textContent = t('lieu.' + l); liste.appendChild(h);
      const g = document.createElement('div'); g.className = 'grille';
      for (let i = l * 5; i < l * 5 + 5; i++) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'case';
        b.setAttribute('aria-label', t('niveaux.aria', { n: i + 1 }));
        if (i + 1 > max) { b.classList.add('ferme'); b.innerHTML = CADENAS; b.disabled = true; }
        else {
          const n = document.createElement('span'); n.textContent = nombre(i + 1); b.appendChild(n);
          const e = document.createElement('span'); e.className = 'mini-etoiles';
          for (let k = 0; k < 3; k++) { const s = document.createElement('span'); s.className = 'et' + (k < prog.etoiles[i] ? ' on' : ''); e.appendChild(s); }
          b.appendChild(e);
          if (i + 1 === max) b.classList.add('courant');
          b.addEventListener('click', () => { SON.clic(); demarrerNiveau(i); });
        }
        g.appendChild(b);
      }
      liste.appendChild(g);
    }
    montrer('ecran-niveaux');
  }

  // --- Carnet ---
  function dessinerFiche(cv, id, connu) {
    const r = cv.getBoundingClientRect(), w = r.width || 120, h = r.height || 64;
    cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
    const c = cv.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (ESP[id]) dessinerPoisson(c, w / 2, h / 2, 1, 2.4, ESP[id], 1);
    else if (id === 'meduse') dessinerMeduse(c, w / 2, h / 2 - 6, 1.6, 1);
    else if (id === 'mouette') dessinerMouette(c, w / 2, h / 2 + 8, 1, 1.6, 1);
    else dessinerDauphin(c, w / 2, h / 2 + 2, 1, 1.1, 1);
    if (!connu) { c.globalCompositeOperation = 'source-in'; c.fillStyle = '#0a2742'; c.fillRect(0, 0, w, h); c.globalCompositeOperation = 'source-over'; }
  }
  function ouvrirCarnet(retour) {
    ecranRetour = retour; if (retour === 'ecran-titre') mode = 'menu';
    $('carnet-total').textContent = t('carnet.compte', { n: prog.carnet.length, max: CARNET.length });
    const liste = $('carnet-liste'); liste.innerHTML = '';
    montrer('ecran-carnet');
    CARNET.forEach((id) => {
      const connu = prog.carnet.includes(id);
      const f = document.createElement('div'); f.className = 'fiche' + (connu ? '' : ' inconnue');
      const cv = document.createElement('canvas'); f.appendChild(cv);
      const b = document.createElement('b'); b.textContent = connu ? t('espece.' + id) : t('carnet.inconnu'); f.appendChild(b);
      const p = document.createElement('span'); p.textContent = connu ? t('note.' + id) : t('carnet.indice.' + id); f.appendChild(p);
      liste.appendChild(f);
      dessinerFiche(cv, id, connu);
    });
  }

  // --- Plumages ---
  function ouvrirPlumages() {
    mode = 'menu'; ecranRetour = 'ecran-titre';
    const tot = totalEtoiles();
    $('plumages-total').textContent = t('plumages.aide', { n: tot });
    const liste = $('plumages-liste'); liste.innerHTML = '';
    montrer('ecran-plumages');
    PLUMAGES.forEach((p) => {
      const ok = tot >= p.min;
      const b = document.createElement('button'); b.type = 'button';
      b.className = 'plume' + (p.id === prog.plumage ? ' choisi' : '') + (ok ? '' : ' ferme');
      const cv = document.createElement('canvas'); b.appendChild(cv);
      const n = document.createElement('b'); n.textContent = t('plumage.' + p.id); b.appendChild(n);
      const s = document.createElement('span'); s.textContent = ok ? (p.id === prog.plumage ? t('plumage.choisi') : t('plumage.choisir')) : t('plumage.verrou', { n: p.min }); b.appendChild(s);
      if (ok) b.addEventListener('click', () => { prog.plumage = p.id; SON.clic(); enregistrerReglages(); ouvrirPlumages(); });
      else b.disabled = true;
      liste.appendChild(b);
      const r = cv.getBoundingClientRect(), w = r.width || 120, h = r.height || 70;
      cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
      const c = cv.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0);
      dessinerFou(c, w / 2, h / 2 + 8, 0, 1.6, 'plane', 1.2, p, false);
    });
  }

  // --- Début d'un niveau : carte de consignes ---
  function demarrerNiveau(i) {
    nouvellePartie(i);
    const nv = L.nouveau && (!prog.vus.includes(L.nouveau) || L.nouveau === 'tuto') ? L.nouveau : null;
    introType = nv || 'aucun'; introT = 0;
    $('intro-titre').textContent = t('intro.niveau', { n: niv + 1, lieu: t('lieu.' + L.lieu) });
    $('intro-etape').textContent = '';
    $('intro-texte').textContent = nv ? t('intro.' + nv) : t('intro.lieu.' + L.lieu);
    $('intro-objectif').textContent = t('objectif', { cible: L.cible, n: L.plongeons });
    if (L.nouveau && !prog.vus.includes(L.nouveau)) prog.vus.push(L.nouveau);
    mode = 'intro'; montrer('ecran-intro'); majHUD();
  }
  function partir() {
    if (mode !== 'intro') return;
    audio(); SON.clic(); mode = 'jeu'; montrer(null);
    if (niv === 0 && prog.etoiles[0] === 0) message(t('msg.vise'), 2.5);
  }
  $('b-partir').addEventListener('click', partir);

  // --- Pause ---
  function pause() {
    if (mode !== 'jeu') return;
    mode = 'pause'; if (jeu.o.etat === 'vise') jeu.o.etat = 'plane';
    $('pause-objectif').textContent = t('pause.objectif', { niveau: niv + 1, poissons: jeu.poissons, cible: L.cible, n: jeu.plongeons });
    montrer('ecran-pause');
  }
  function reprendre() { if (mode !== 'pause') return; SON.clic(); mode = 'jeu'; montrer(null); }
  $('b-pause').addEventListener('click', (e) => { e.stopPropagation(); audio(); if (mode === 'jeu') pause(); else if (mode === 'pause') reprendre(); });
  $('b-reprendre').addEventListener('click', reprendre);
  $('b-recommencer').addEventListener('click', () => { SON.clic(); demarrerNiveau(niv); });
  $('b-accueil').addEventListener('click', () => { SON.clic(); allerTitre(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'jeu') pause(); });

  // --- Fins de niveau ---
  function etoilesDuScore(score) { const base = L.cible * 10; return 1 + (score >= base * 2 ? 1 : 0) + (score >= base * 3 ? 1 : 0); }
  function boutonFin(cle, action, gros) {
    const b = document.createElement('button'); b.type = 'button'; b.className = gros ? 'gros' : 'moyen';
    b.textContent = t(cle); b.addEventListener('click', () => { SON.clic(); action(); }); return b;
  }
  function compteur(el, fin) {
    const debut = performance.now();
    const pas = (now) => { const k = Math.min(1, (now - debut) / 900); el.textContent = t('fin.score', { n: nombre(Math.round(fin * doux(k))) }); if (k < 1 && mode === 'fin') requestAnimationFrame(pas); };
    requestAnimationFrame(pas);
  }
  function victoire() {
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: niv + 1 });
    mode = 'fin'; astuce('');
    const bonus = jeu.plongeons * 20;
    jeu.score += bonus;
    const et = etoilesDuScore(jeu.score);
    const ancienRecord = prog.records[niv], totAvant = totalEtoiles();
    const record = jeu.score > ancienRecord;
    prog.etoiles[niv] = Math.max(prog.etoiles[niv], et);
    prog.records[niv] = Math.max(ancienRecord, jeu.score);
    const toutGagne = prog.etoiles.every((e) => e > 0);
    enregistrer({ niveau: Math.min(niv + 2, NIVEAUX.length) });
    if (toutGagne) { if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: ETOILES_MAX }); }
    $('fin-titre').textContent = t(niv === NIVEAUX.length - 1 ? 'fin.dernierTitre' : 'fin.victoire');
    const spans = $('fin-etoiles').children;
    for (let k = 0; k < 3; k++) { spans[k].className = 'et'; spans[k].style.animationDelay = ''; }
    for (let k = 0; k < et; k++) { const s = spans[k]; setTimeout(() => { if (mode === 'fin') { s.className = 'et on'; SON.etoile(k); } }, 500 + k * 350); }
    compteur($('fin-score'), jeu.score);
    const rec = $('fin-record');
    rec.className = record ? 'nouveau' : ''; rec.textContent = record ? t('fin.record') : t('fin.recordAncien', { n: nombre(ancienRecord) });
    const lignes = $('fin-lignes'); lignes.innerHTML = '';
    const ligne = (txt) => { const p = document.createElement('p'); p.className = 'ligne'; p.textContent = txt; lignes.appendChild(p); };
    ligne(t('fin.poissons', { n: jeu.poissons, cible: L.cible }));
    ligne(t('fin.combo', { n: jeu.bestMult }));
    if (bonus) ligne(t('fin.bonus', { n: nombre(bonus) }));
    jeu.nouvelles.forEach((id) => ligne(t('fin.espece', { nom: t('espece.' + id) })));
    PLUMAGES.forEach((p) => { if (totAvant < p.min && totalEtoiles() >= p.min) ligne(t('fin.plumage', { nom: t('plumage.' + p.id) })); });
    if (niv === NIVEAUX.length - 1) ligne(t('fin.dernier', { n: totalEtoiles(), max: ETOILES_MAX }));
    const bt = $('fin-boutons'); bt.innerHTML = '';
    if (niv < NIVEAUX.length - 1) bt.appendChild(boutonFin('bouton.suivant', () => demarrerNiveau(niv + 1), true));
    else bt.appendChild(boutonFin('bouton.carnet', () => ouvrirCarnet('ecran-fin'), true));
    const r = document.createElement('div'); r.className = 'rangee';
    r.appendChild(boutonFin('bouton.rejouer', () => demarrerNiveau(niv)));
    r.appendChild(boutonFin('bouton.niveaux', () => ouvrirNiveaux('ecran-fin')));
    r.appendChild(boutonFin('bouton.accueil', allerTitre));
    bt.appendChild(r);
    SON.victoire();
    for (let i = 0; i < 70; i++) particule(rand(0, W), rand(-60, 0), rand(-40, 40), rand(40, 160), rand(2, 3.5), 'confetti', ['#ffe07a', '#ff7aa2', '#7ad8ff', '#9cff8a', '#ffffff'][i % 5], 4);
    montrer('ecran-fin');
  }
  function defaite() {
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: niv + 1 });
    mode = 'fin'; astuce('');
    enregistrer({ niveau: niv + 1 });
    $('fin-titre').textContent = t('fin.defaite');
    const spans = $('fin-etoiles').children; for (let k = 0; k < 3; k++) spans[k].className = 'et';
    $('fin-score').textContent = t('fin.score', { n: nombre(jeu.score) });
    const rec = $('fin-record'); rec.className = ''; rec.textContent = t('fin.recordAncien', { n: nombre(prog.records[niv]) });
    const lignes = $('fin-lignes'); lignes.innerHTML = '';
    const ligne = (txt) => { const p = document.createElement('p'); p.className = 'ligne'; p.textContent = txt; lignes.appendChild(p); };
    ligne(t('fin.poissons', { n: jeu.poissons, cible: L.cible }));
    jeu.nouvelles.forEach((id) => ligne(t('fin.espece', { nom: t('espece.' + id) })));
    ligne(t('fin.astuce.' + (niv % 4)));
    const bt = $('fin-boutons'); bt.innerHTML = '';
    bt.appendChild(boutonFin('bouton.reessayer', () => demarrerNiveau(niv), true));
    const r = document.createElement('div'); r.className = 'rangee';
    r.appendChild(boutonFin('bouton.niveaux', () => ouvrirNiveaux('ecran-fin')));
    r.appendChild(boutonFin('bouton.accueil', allerTitre));
    bt.appendChild(r);
    SON.defaite();
    montrer('ecran-fin');
  }

  // Sauvegarde à la fermeture de la page, seulement pendant une partie
  if (window.JEL_SAVE) window.JEL_SAVE.surFermeture(() => {
    if (jeu && (mode === 'jeu' || mode === 'pause' || mode === 'intro')) enregistrer({ niveau: niv + 1 });
  });

  // =========================================================================
  // COMMANDES : doigt, souris, clavier
  // =========================================================================
  let pointeurActif = null;
  canvas.addEventListener('pointerdown', (e) => {
    audio();
    if (mode !== 'jeu' || !jeu) return;
    e.preventDefault();
    const o = jeu.o;
    if (o.etat === 'plane') { pointeurActif = e.pointerId; try { canvas.setPointerCapture(e.pointerId); } catch (er) { /* rien */ } commencerVisee(e.clientX, e.clientY, false); }
    else if (o.etat === 'remonte') battreAiles();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (mode !== 'jeu' || !jeu || e.pointerId !== pointeurActif) return;
    if (jeu.o.etat === 'vise' && !visee.clavier) visee.angle = angleVers(e.clientX, e.clientY);
  });
  const lacher = (e) => {
    if (e.pointerId !== pointeurActif) return;
    pointeurActif = null;
    if (mode === 'jeu' && jeu && jeu.o.etat === 'vise' && !visee.clavier) { visee.angle = angleVers(e.clientX, e.clientY); plonger(); }
  };
  canvas.addEventListener('pointerup', lacher);
  canvas.addEventListener('pointercancel', (e) => { if (e.pointerId === pointeurActif) { pointeurActif = null; if (jeu && jeu.o.etat === 'vise') jeu.o.etat = 'plane'; } });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  const TOUCHES_VISEE = ['Space', 'Enter', 'NumpadEnter', 'ArrowDown', 'KeyS'];
  document.addEventListener('keydown', (e) => {
    audio();
    if (e.code === 'Escape' || e.code === 'KeyP') { if (mode === 'jeu') pause(); else if (mode === 'pause') reprendre(); e.preventDefault(); return; }
    if (mode === 'titre' && (e.code === 'Enter' || e.code === 'Space') && !e.repeat && document.activeElement === document.body) { e.preventDefault(); jouer(); return; }
    if (mode === 'intro' && (e.code === 'Enter' || e.code === 'Space') && !e.repeat) { e.preventDefault(); partir(); return; }
    if (mode !== 'jeu' || !jeu) return;
    const o = jeu.o;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA' || e.code === 'KeyQ') { visee.gauche = true; if (o.etat === 'plane') visee.angle = Math.min(ANGLE_MAX, visee.angle + 0.06); e.preventDefault(); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { visee.droite = true; if (o.etat === 'plane') visee.angle = Math.max(ANGLE_MIN, visee.angle - 0.06); e.preventDefault(); }
    if (TOUCHES_VISEE.includes(e.code)) {
      e.preventDefault(); if (e.repeat) return;
      if (o.etat === 'plane') commencerVisee(0, 0, true);
    }
    if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'KeyZ') && !e.repeat && o.etat === 'remonte') { e.preventDefault(); battreAiles(); }
  });
  document.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA' || e.code === 'KeyQ') visee.gauche = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') visee.droite = false;
    if (mode === 'jeu' && jeu && TOUCHES_VISEE.includes(e.code) && jeu.o.etat === 'vise' && visee.clavier) plonger();
  });

  // =========================================================================
  // BOUCLE
  // =========================================================================
  let dernier = performance.now();
  function boucle(now) {
    let dt = (now - dernier) / 1000; dernier = now;
    dt = clamp(dt, 0, 0.05);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (mode === 'pause') { if (jeu) dessinerJeu(); }
    else {
      T += dt;
      if (jeu) {
        if (mode === 'jeu') majJeu(dt);
        else if (mode === 'fin') {
          jeu.parts.forEach((p) => { p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.type === 'confetti') p.vy += 60 * dt; });
          jeu.parts = jeu.parts.filter((p) => p.vie > 0);
        }
        dessinerJeu();
      } else dessinerTitre();
      if (mode === 'intro') { introT += dt; dessinerIntro(); }
    }
    requestAnimationFrame(boucle);
  }

  function rafraichirTextes() {
    majHUD(); majSon();
    if (mode === 'menu') {
      if ($('ecran-niveaux').classList.contains('actif')) ouvrirNiveaux(ecranRetour);
      else if ($('ecran-carnet').classList.contains('actif')) ouvrirCarnet(ecranRetour);
      else if ($('ecran-plumages').classList.contains('actif')) ouvrirPlumages();
    }
  }
  I18N.surChangement(rafraichirTextes);

  dimensions(); majSon();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
