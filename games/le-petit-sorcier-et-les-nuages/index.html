/* Fins de niveau */
function calculEtoiles(g) { return g.coeurs >= g.coeursMax ? 3 : g.coeurs >= 3 ? 2 : 1; }

function victoire() {
  const g = G;
  if (!g || g.fini) return;
  g.fini = true;
  const etoiles = calculEtoiles(g);
  const bonus = g.coeurs * 50 + Math.round((100 - g.hum) * 2);
  g.score += bonus;
  const n = g.n;
  const ancienRec = prog.options.rec[n];
  const record = g.score > ancienRec;
  prog.options.et[n] = Math.max(prog.options.et[n], etoiles);
  if (record) prog.options.rec[n] = g.score;
  const gain = g.gagnees + etoiles * 10;
  prog.options.gouttes += gain;
  prog.options.max = Math.max(prog.options.max, Math.min(n + 2, NIVEAUX.length));
  sauver(n + 2);
  // Les nuages restants fondent en arc-en-ciel, confettis
  for (const m of g.nuages) { if (!m.mort) { m.mort = true; for (let i = 0; i < 8; i++) { const a = Math.random() * 6.28; g.parts.push({ x: m.x, y: m.y, vx: Math.cos(a) * 120 * S, vy: Math.sin(a) * 120 * S, vie: 0.8, max: 0.8, c: ARC[i % 6], s: 4 * S, forme: 'rond' }); } } }
  g.pluie.length = 0; g.eclairs.length = 0;
  for (let i = 0; i < 90; i++) g.parts.push({ x: hasard(0, W), y: hasard(-60, -10), vx: hasard(-40, 40), vy: hasard(40, 160), vie: 2.2, max: 2.2, c: ARC[i % 6], s: hasard(3, 6) * S, forme: 'confetti', rot: Math.random() * 6 });
  son('victoire');
  setTimeout(() => afficherVictoire(g, etoiles, record, gain), 1300);
}

function afficherVictoire(g, etoiles, record, gain) {
  if (G !== g) return;
  ecran = 'fin';
  const n = g.n;
  if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
  if (tousGagnes()) { if (window.FMG) window.FMG.reportComplete({ stars: etoilesTotal(), maxStars: NIVEAUX.length * 3 }); }
  $('finTitre').textContent = tr(n === NIVEAUX.length - 1 ? 'fin.victoireFinale' : 'fin.victoire');
  $('finRaison').textContent = tr(g.def.roi ? 'fin.roiVaincu' : 'fin.valleeSauvee', { n: g.eclates });
  afficherEtoiles(etoiles);
  compteur($('finScore'), g.score);
  $('finRecord').textContent = record ? tr('fin.record') : tr('fin.meilleur', { n: nb(prog.options.rec[n]) });
  $('finGouttes').textContent = tr('fin.gouttes', { n: gain });
  const derniere = n === NIVEAUX.length - 1;
  boutonsFin(
    [derniere ? 'bouton.bilan' : 'bouton.suivant', () => { if (derniere) afficherBilan(); else lancerNiveau(n + 1); }],
    ['bouton.rejouer', () => lancerNiveau(n)],
    ['bouton.niveaux', () => ouvrirNiveaux()],
  );
  montrer('ecranFin');
}

function defaite(raison) {
  const g = G;
  if (!g || g.fini) return;
  g.fini = true;
  son('defaite');
  const n = g.n;
  prog.options.gouttes += g.gagnees;
  sauver(n + 1);
  g.secousse = 0.4;
  setTimeout(() => {
    if (G !== g) return;
    ecran = 'fin';

    $('finTitre').textContent = tr('fin.defaite');
    $('finRaison').textContent = tr(raison === 'vallee' ? 'fin.raisonVallee' : 'fin.raisonCoeurs');
    afficherEtoiles(0);
    compteur($('finScore'), g.score);
    $('finRecord').textContent = tr('fin.meilleur', { n: nb(prog.options.rec[n]) });
    $('finGouttes').textContent = tr('fin.gouttes', { n: g.gagnees });
    boutonsFin(['bouton.reessayer', () => lancerNiveau(n)], ['bouton.niveaux', () => ouvrirNiveaux()], ['bouton.accueil', () => allerTitre()]);

  if (k && ecran === 'jeu') { touches[k] = true; e.preventDefault(); return; }

    else if (e.code === 'Digit2' || e.code === 'Numpad2') choisirPouvoir(1);

  });
}
$('bJouer').addEventListener('click', jouer);

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && !apercu) mettrePause(); });
window.JEL_SAVE.surFermeture(() => { if (G && !G.fini && ['jeu', 'pause', 'choix', 'intro'].includes(ecran)) sauver(G.n + 1); });
if (window.JEL_I18N && window.JEL_I18N.surChangement) window.JEL_I18N.surChangement(() => { if (ecran === 'titre') allerTitre(); });

/* ---------- Affiche (jaquette du jeu) ---------- */
// Avec window.JEL_AFFICHE (posé par le robot du site, jamais par le jeu) : une scène composée, sans
// interface ni texte, d'où sort la jaquette (CONSIGNES-JEU.md, section 5). Le petit sorcier en grand lance
// ses étoiles sur un nuage grincheux, un nuage d'orage gronde, l'arc-en-ciel brille derrière lui.
function dessinerAffiche() {
  redim();
  const c = cx, t = 1.3;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  pleineLargeur(() => {
    const k = Math.min(W / 600, H / 800);
    dessinerFond(c, t, 0);
    // Lumière chaude derrière le sorcier
    const sx = W * 0.42, sy = H * 0.75, s = (H * 0.4) / 74;
    const halo = c.createRadialGradient(sx, sy - 34 * s, 10 * k, sx, sy - 34 * s, H * 0.42);
    halo.addColorStop(0, 'rgba(255,248,200,.95)'); halo.addColorStop(0.45, 'rgba(255,236,170,.45)'); halo.addColorStop(1, 'rgba(255,236,170,0)');
    c.fillStyle = halo; c.fillRect(0, 0, W, H);
    // Grand arc-en-ciel
    ARC.forEach((col, i) => { c.strokeStyle = col; c.globalAlpha = 0.8; c.lineWidth = 15 * k; c.beginPath(); c.arc(W * 0.5, H * 0.82, H * 0.5 - i * 15 * k, Math.PI, 0); c.stroke(); });
    c.globalAlpha = 1;
    // Éclair du nuage d'orage, qui frappe la prairie à droite
    const ox = W * 0.74, oy = H * 0.19;
    c.strokeStyle = '#fff3a0'; c.lineWidth = 9 * k; c.lineJoin = 'round'; c.shadowColor = '#ffe36b'; c.shadowBlur = 28 * k;
    c.beginPath(); c.moveTo(ox + 20 * k, oy + 60 * k); c.lineTo(ox - 10 * k, oy + 150 * k); c.lineTo(ox + 30 * k, oy + 160 * k); c.lineTo(ox + 5 * k, oy + 260 * k); c.lineTo(ox + 60 * k, oy + 140 * k); c.lineTo(ox + 22 * k, oy + 132 * k); c.closePath();
    c.fillStyle = '#ffe36b'; c.fill(); c.stroke(); c.shadowBlur = 0;
    // Nuages : orage (en haut à droite), grincheux touché (à gauche), grêle (plus loin)
    dessinerNuage(c, 'grele', W * 0.9, H * 0.43, 46 * k, t + 2, { regardX: sx, regardY: sy - 120 * k });
    dessinerNuage(c, 'orage', ox, oy, 112 * k, t, { regardX: sx, regardY: sy - 120 * k });
    const gx = W * 0.2, gy = H * 0.27;
    dessinerNuage(c, 'grincheux', gx, gy, 78 * k, t + 1, { regardX: sx, regardY: sy, flash: 0.35 });
    // Pluie du nuage d'orage
    for (let i = 0; i < 7; i++) dessinerGoutte(c, ox - 60 * k + i * 22 * k, oy + 120 * k + (i % 3) * 38 * k, 7 * k, '#3f8fe0');
    // Étoiles lancées par la baguette jusqu'au nuage grincheux, qui éclatent sur lui
    const bx = sx + 10 * s, by = sy - 46 * s;
    for (let i = 0; i < 6; i++) {
      const p = (i + 1) / 7, x = bx + (gx + 30 * k - bx) * p, y = by + (gy + 40 * k - by) * p - Math.sin(p * Math.PI) * 50 * k;
      c.fillStyle = ARC[i % 6]; c.shadowColor = ARC[i % 6]; c.shadowBlur = 16 * k;
      etoileForme(c, x, y, (16 - i * 1.2) * k, i * 0.7); c.fill();
    }
    c.shadowBlur = 0;
    c.fillStyle = '#fff6b0';
    for (let i = 0; i < 9; i++) { const a = i * 0.7; etoileForme(c, gx + 30 * k + Math.cos(a) * 70 * k, gy + 40 * k + Math.sin(a) * 50 * k, 8 * k, a); c.fill(); }
    // Gouttes d'arc-en-ciel qui tombent du nuage touché
    for (let i = 0; i < 6; i++) { c.shadowColor = ARC[i]; c.shadowBlur = 10 * k; dessinerGoutte(c, gx - 40 * k + i * 26 * k, gy + 100 * k + (i % 2) * 34 * k, 9 * k, ARC[i]); }
    c.shadowBlur = 0;
    // Le petit sorcier, en grand
    dessinerSorcier(c, sx, sy, s, 0.4, { bulle: false });
    // Premier plan : grandes fleurs et herbes dans les coins du bas
    [[W * 0.06, H * 0.97, 1.9], [W * 0.92, H * 0.95, 2.2], [W * 0.78, H * 1.0, 1.5]].forEach(([fx, fy, f], i) => {
      c.strokeStyle = '#2f7a34'; c.lineWidth = 5 * k * f;
      c.beginPath(); c.moveTo(fx, H); c.quadraticCurveTo(fx - 10 * k, fy - 40 * k * f, fx + 6 * k, fy - 70 * k * f); c.stroke();
      const hx = fx + 6 * k, hy = fy - 70 * k * f;
      c.fillStyle = ARC[(i * 2) % 6];
      for (let p = 0; p < 6; p++) { const a = p * 1.047; c.beginPath(); c.arc(hx + Math.cos(a) * 13 * k * f, hy + Math.sin(a) * 13 * k * f, 9 * k * f, 0, 6.28); c.fill(); }
      c.fillStyle = '#fff3a0'; c.beginPath(); c.arc(hx, hy, 8 * k * f, 0, 6.28); c.fill();
    });
  });
}
function demarrerAffiche() {
  for (const el of document.querySelectorAll('.ecran, .rond, #toast, .jel-langue')) el.style.setProperty('display', 'none', 'important');
  dessinerAffiche();
  window.addEventListener('resize', dessinerAffiche);
}

/* ---------- Images du jeu (page du jeu) ---------- */
// Avec window.JEL_APERCU = 1, 2 ou 3 (posé par le robot du site, jamais par le jeu) : le jeu s'ouvre
// directement en pleine partie, avec sa vraie interface (cœurs, vallée mouillée, chrono, jauge,
// pouvoirs), sans écran titre, ni fenêtre « Continuer », ni carte de présentation (CONSIGNES-JEU.md,
// section 5). La scène est posée, la partie tourne une seconde (tirs, nuages qui éclatent, pluie),
// puis elle est figée sans fenêtre de pause : ni victoire, ni défaite, ni son, ni sauvegarde.
//   1 = niveau 1 : nuages grincheux, premières gouttes d'arc-en-ciel ;
//   2 = niveau 9 : le brouillard sur les bords, la grêle, le nuage diviseur qui éclate en deux ;
//   3 = niveau 20 : le roi des nuages, sa barre de vie, sa pluie en éventail, son éclair, le vent, la tornade.
const SCENES_APERCU = {
  1: {
    niveau: 0, coeurs: 5, hum: 16, score: 45, jauge: 3, sorcX: 0.5, pouvoirs: {},
    nuages: [['grincheux', 0.2, 0.2, 2], ['grincheux', 0.78, 0.27, 2], ['grincheux', 'sorc', 0.36, 1], ['grincheux', 0.62, 0.11, 2]],
    gouttes: [[0.2, 0.31], [0.26, 0.36]], pluie: [[0.78, 0.4], [0.74, 0.5], [0.2, 0.46]],
  },
  2: {
    niveau: 8, coeurs: 4, hum: 34, score: 640, jauge: 6, sorcX: 0.46, secondes: 0.8, pouvoirs: { multi: 1, bulle: 1 }, chapeau: 'etoile', baguette: 'cristal',
    nuages: [['grele', 0.64, 0.3, 4], ['diviseur', 'sorc', 0.4, 2], ['grincheux', 0.36, 0.18, 2], ['rapide', 0.72, 0.13, 1], ['grincheux', 0.16, 0.32, 2]],
    gouttes: [[0.6, 0.48], [0.36, 0.3]],
    pluie: [[0.64, 0.42, 1], [0.7, 0.55, 1], [0.36, 0.3], [0.3, 0.46], [0.16, 0.44], [0.82, 0.5]],
  },
  3: {
    niveau: 19, coeurs: 3, hum: 42, score: 2380, jauge: 11, sorcX: 0.4, pouvoirs: { multi: 2, tornade: 2, cadence: 1 }, chapeau: 'lune', baguette: 'arc',
    roi: 0.6, vent: -1, frappe: 0.62, nuages: [['mini', 0.16, 0.34, 1], ['rapide', 0.86, 0.36, 1]],
    gouttes: [[0.3, 0.45], [0.7, 0.4]], pluie: [],
  },
};
function ouvrirApercu(numero) {
  apercu = numero;
  const sc = SCENES_APERCU[numero];
  // Hasard fixe : la même image à chaque capture.
  let graine = 1234567 + numero * 7919;
  Math.random = () => { graine = (graine + 0x6D2B79F5) | 0; let t = Math.imul(graine ^ (graine >>> 15), 1 | graine); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  prog = progDefaut(); // progression neuve en mémoire seulement (rien n'est enregistré)
  if (sc.chapeau) prog.options.chapeau = sc.chapeau;
  if (sc.baguette) prog.options.baguette = sc.baguette;
  nouvellePartie(sc.niveau);
  const g = G;
  ecran = 'jeu'; montrer(null);
  g.sorc.x = W * sc.sorcX;
  g.pouvoirs = Object.assign({}, sc.pouvoirs);
  majPouvoirs();
  if (g.pouvoirs.bulle) g.bulle.pret = true;
  g.hum = sc.hum; g.score = sc.score; g.eclates = Math.round(sc.score / 25);
  const jaugeMax = g.jaugeMax;
  // Pendant la mise en place : cœurs et jauge hors d'atteinte (ni défaite, ni fenêtre de choix).
  g.coeurs = 99; g.jaugeMax = 1e9; g.jauge = sc.jauge;
  g.t = g.def.roi ? g.def.duree + 25 : g.def.duree * 0.45;
  const tirX = g.sorc.x + 10 * S;
  for (const [type, x, y, pv] of sc.nuages) {
    const n = creerNuage(type, x === 'sorc' ? tirX : W * x, H * y, H * y);
    n.pv = Math.min(n.pvMax, pv);
  }
  if (sc.roi) {
    g.roiArrive = true;
    g.roi = creerNuage('roi');
    g.roi.y = g.roi.cibleY; g.roi.phase = 0.9; g.roi.pv = Math.round(g.roi.pvMax * sc.roi);
    g.roi.attaqueT = 0.35; g.roi.eclairRoiT = 30; g.roi.appelT = 30;
    g.spawnT = 30;
  }
  if (g.pouvoirs.tornade) g.tornadeT = 0.2;
  if (sc.vent) { g.vent.dir = sc.vent; g.vent.reste = 3; }
  for (const [x, y] of sc.gouttes) g.gouttes.push({ x: W * x, y: H * y, vx: 0, vy: 20, t: 0, p: Math.random() * 6, c: ARC[g.gouttes.length % 6] });
  for (const [x, y, grele] of sc.pluie) g.pluie.push({ x: W * x, y: H * y, vx: 0, vy: 80 * KV, grele: !!grele });
  if (sc.eclair) lancerEclair(W * sc.eclair, g.nuages[0]);
  // La partie tourne environ une seconde : le sorcier tire, un nuage éclate, la pluie tombe.
  const pas = Math.round((sc.secondes || 1) * 60);
  for (let i = 0; i < pas; i++) maj(1 / 60);
  // Puis elle est figée sur ce moment, avec la vraie interface et sans fenêtre de pause.
  g.coeurs = sc.coeurs; g.jaugeMax = jaugeMax; g.jauge = Math.min(g.jauge, jaugeMax - 1);
  if (g.pouvoirs.bulle) g.bulle.pret = true;
  g.sorc.inv = 0; g.secousse = 0; g.eclairFlash = 0;
  // Éclair du roi qui vient de frapper la prairie, juste à côté du sorcier qui l'a esquivé.
  if (sc.frappe) { g.eclairs.push({ x: W * sc.frappe, y0: 0, t: 1.2, frappe: true, bip: true }); g.eclairFlash = 0.16; }
  g.pause = true;
}

/* ---------- Démarrage ---------- */
chargerProg();
document.title = tr('titre');
majBoutonSon();
redim();
const numeroApercu = Number(window.JEL_APERCU);
if (window.JEL_AFFICHE) demarrerAffiche();
else if (numeroApercu === 1 || numeroApercu === 2 || numeroApercu === 3) {
  ouvrirApercu(numeroApercu);
  requestAnimationFrame(boucle);
} else {
  allerTitre();
  requestAnimationFrame(boucle);
}
</script>
