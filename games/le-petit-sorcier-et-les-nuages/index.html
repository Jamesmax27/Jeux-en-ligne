<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {

        history.replaceState(history.state, '', adresse.href);

  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }

    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {

    var d;

    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];

  }

    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>

  /* Plein écran sur toutes les largeurs : sur ordinateur, le décor va jusqu'aux bords et la zone de jeu
     s'élargit (redim) ; seules les fenêtres (.carte) gardent une largeur raisonnable. */
  #plateau { position: fixed; inset: 0; overflow: hidden; background: #bfe3ff; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .rond { position: absolute; width: 46px; height: 46px; border-radius: 50%; border: 3px solid #fff; background: rgba(66, 54, 140, .78); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; z-index: 5; }
  .rond svg { width: 24px; height: 24px; }
  #bPause { top: 10px; right: 10px; }

  .voile { background: rgba(32, 26, 78, .62); }
  .carte { background: #fffaf0; border-radius: 22px; padding: 18px 16px; max-width: 420px; width: 100%; box-shadow: 0 10px 30px rgba(20, 10, 60, .35); border: 4px solid #ffd977; }
  h1 { margin: 0 0 8px; font-size: clamp(30px, 9vw, 46px); line-height: 1.05; color: #fff; text-shadow: 0 3px 0 #5a3fb0, 0 6px 14px rgba(40, 20, 100, .5); }
  h2 { margin: 0 0 10px; font-size: 24px; color: #4a33a8; }

  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #4f37a6; }

  #titreBas { margin-top: auto; width: 100%; max-width: 400px; }
  #titreConsigne { color: #fff; font-weight: 600; text-shadow: 0 2px 4px rgba(30, 20, 80, .8); max-width: 360px; }
  .pastille { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, .9); border-radius: 20px; padding: 6px 14px; font-weight: 700; color: #4a33a8; margin: 6px; }
  .goutte-ico { width: 18px; height: 22px; }

  #grille { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }
  .niv { min-height: 64px; border: 0; border-radius: 14px; background: #7c5ce0; color: #fff; font: 800 20px system-ui, sans-serif; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; box-shadow: 0 3px 0 #4f37a6; }

  .article { border: 3px solid #e2dbff; background: #fff; border-radius: 14px; padding: 6px 4px; cursor: pointer; min-height: 112px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; font: 600 13px system-ui, sans-serif; color: #2b2550; }

  .pouvoir.sel { border-color: #ff9f2e; box-shadow: 0 0 0 4px rgba(255, 159, 46, .45); }

  #finEtoiles svg.vu { transform: scale(1); }
  .gros-chiffre { font-size: 30px; font-weight: 800; color: #4a33a8; }
  .record { color: #e07a00; font-weight: 800; min-height: 22px; }
  #toast { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); z-index: 8; background: rgba(255, 250, 230, .96); border: 3px solid #ffd977; border-radius: 16px; padding: 8px 14px; font-weight: 800; color: #4a33a8; max-width: 90%; text-align: center; pointer-events: none; transition: opacity .3s; }
</style>

<body>
<div id="plateau">
  <canvas id="c"></canvas>
  <button id="bSon" class="rond" type="button" data-i18n-aria="bouton.son"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="sonOnde" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path id="sonCoupe" d="M16 9l5 6M21 9l-5 6" class="cache"/></svg></button>
  <button id="bPause" class="rond cache" type="button" data-i18n-aria="bouton.pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>

  <!-- Bilan final -->
  <div id="ecranBilan" class="ecran voile cache">
    <div class="carte">
      <h2 data-i18n="bilan.titre"></h2>
      <p data-i18n="bilan.texte"></p>

/* ---------- Sauvegarde ---------- */
let prog = null;

  return { niveau: 1, score: 0, options: { et: [], rec: [], gouttes: 0, max: 1, chap: ['pointe'], bag: ['bois'], dep: [], chapeau: 'pointe', baguette: 'bois', depart: '', son: true, vus: [] } };

function chargerProg() {
  const p = progDefaut();
  let d = null;
  try { d = window.JEL_SAVE ? window.JEL_SAVE.load(JEU) : null; } catch (e) { d = null; }
  if (d) {
    p.niveau = borne(Math.floor(d.niveau) || 1, 1, NIVEAUX.length);
    p.score = Number(d.score) || 0;
    const o = d.options || {};
    const tab = (a) => (Array.isArray(a) ? a : []);
    p.options.et = tab(o.et).map((x) => borne(Math.floor(x) || 0, 0, 3));
    p.options.rec = tab(o.rec).map((x) => Math.max(0, Math.floor(x) || 0));
    p.options.gouttes = Math.max(0, Math.floor(o.gouttes) || 0);
    p.options.max = borne(Math.max(Math.floor(o.max) || 1, p.niveau), 1, NIVEAUX.length);
    p.options.chap = tab(o.chap).filter((id) => CHAPEAUX.some((c) => c.id === id));
    if (!p.options.chap.includes('pointe')) p.options.chap.unshift('pointe');
    p.options.bag = tab(o.bag).filter((id) => BAGUETTES.some((c) => c.id === id));

    p.options.dep = tab(o.dep).filter((id) => DEPARTS.some((c) => c.id === id));

    if (!(p.options.et[i] >= 0)) p.options.et[i] = 0;
    if (!(p.options.rec[i] >= 0)) p.options.rec[i] = 0;
    if (p.options.et[i] > 0) p.options.max = Math.max(p.options.max, Math.min(i + 2, NIVEAUX.length));

function sauver(niveau) {

}
const etoilesTotal = () => prog.options.et.reduce((a, b) => a + b, 0);

const pouvoirDispo = (id) => (id === 'aimant' ? prog.options.et[4] > 0 : id === 'soleil' ? prog.options.et[9] > 0 : true);

/* ---------- Sons (Web Audio, rien avant le premier geste) ---------- */
let audio = null, bruit = null, dernierTir = 0;
function initAudio() {
  if (audio) { if (audio.state === 'suspended' && !(G && G.pause)) audio.resume().catch(() => {}); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = new AC();
    bruit = audio.createBuffer(1, audio.sampleRate * 0.6, audio.sampleRate);

  if (!audio || !prog.options.son || audio.state !== 'running') return;
  const t0 = audio.currentTime + (retard || 0);

/* ---------- Canvas ---------- */
const cv = $('c'), cx = cv.getContext('2d');
// W : largeur de la zone de jeu (nuages, sorcier, pluie) ; WE : largeur de l'écran ; X0 : bord gauche de la zone.
// Sur téléphone en portrait, W = WE. Sur un écran large, la zone s'élargit jusqu'à 1,15 fois la hauteur
// (le sorcier doit pouvoir aller sous chaque nuage) et le décor (ciel, collines, prairie) remplit le reste.
let W = 400, WE = 400, X0 = 0, H = 800, S = 1, KV = 1, DPR = 1;
function redim() {
  const r = $('plateau').getBoundingClientRect();

  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(WE * DPR); cv.height = Math.round(H * DPR);

  const nl = G.pouvoirs.lucioles ? G.pouvoirs.lucioles + 1 : 0;
  while (G.lucioles.length < nl) G.lucioles.push({ a: Math.random() * 6.28, etat: 0, x: G.sorc.x, y: G.sorc.y, t: hasard(1, 2.5), cible: null });

/* ---------- Apparition des nuages ---------- */
function tirerType(types) {
  let total = 0;
  for (const k in types) total += types[k];
  let x = Math.random() * total;
  for (const k in types) { x -= types[k]; if (x <= 0) return k; }
  return Object.keys(types)[0];
}
function creerNuage(type, x, y, cibleY) {
  const ty = TYPES[type];
  const mult = 1 + G.n * 0.05;
  const r = ty.r * S;
  const pv = type === 'roi' ? PV_ROI[G.def.roi] : Math.max(1, Math.round(ty.pv * mult));
  const nuage = {
    type, ty, x: x == null ? hasard(r + 10, W - r - 10) : x, y: y == null ? -r - 10 : y, r,
    pv, pvMax: pv, vx: (Math.random() < 0.5 ? -1 : 1) * hasard(14, 30) * S, cibleY: cibleY || hasard(H * 0.11, H * 0.36),

  };

/* ---------- Mise à jour ---------- */
function maj(dt) {
  const g = G;
  g.t += dt;
  const def = g.def;
  // Chrono, arrivée du roi, victoire
  if (!def.roi && g.t >= def.duree) { victoire(); return; }

  if (g.spawnT <= 0) {
    const acc = 1 - 0.3 * Math.min(1, g.t / def.duree);

  if (def.dore && !g.roiArrive) {
    g.doreT -= dt;
    if (g.doreT <= 0) { g.doreT = hasard(20, 30); creerNuage('dore'); }
  }
  // Vent
  if (def.vent) {
    const v = g.vent;
    if (v.reste > 0) { v.reste -= dt; v.f = v.dir * (def.vent === 2 ? 150 : 95) * S * Math.min(1, v.reste * 2); if (v.reste <= 0) { v.f = 0; v.t = hasard(5, 8); } }
    else if (v.annonce > 0) { v.annonce -= dt; if (v.annonce <= 0) { v.reste = 2.6; son('vent'); } }
    else { v.t -= dt; if (v.t <= 0) { v.annonce = 0.9; v.dir = Math.random() < 0.5 ? -1 : 1; } }
    if (v.annonce > 0 || v.reste > 0) {
      if (Math.random() < dt * 30) g.parts.push({ x: v.dir > 0 ? -10 : W + 10, y: hasard(H * 0.1, sol()), vx: v.dir * hasard(350, 500) * S, vy: 0, vie: 0.9, max: 0.9, c: 'rgba(255,255,255,.7)', s: 1, forme: 'trait' });
    }
  }
  const ventF = def.vent ? g.vent.f : 0;
  // Sorcier
  const sc = g.sorc;
  let dx = 0, dy = 0;
  if (touches.g) dx -= 1; if (touches.d) dx += 1; if (touches.h) dy -= 1; if (touches.b) dy += 1;
  if (dx || dy) {
    const l = Math.hypot(dx, dy); const v = 290 * S;
    sc.x += dx / l * v * dt; sc.y += dy / l * v * dt; cible.actif = false;
  }
  if (cible.actif) {
    const ex = cible.x - sc.x, ey = cible.y - sc.y;
    const f = Math.min(1, dt * 18);
    sc.x += ex * f; sc.y += ey * f;
  }
  sc.x += ventF * dt * 0.8;
  if (cible.actif) cible.x += ventF * dt * 0.8;
  sc.dir = dx || Math.sign(cible.actif ? cible.x - sc.x : 0);
  sc.x = borne(sc.x, 18 * S, W - 18 * S); sc.y = borne(sc.y, zoneHaut(), zoneBas());
  if (sc.inv > 0) sc.inv -= dt;
  // Tir automatique
  g.tirT -= dt;
  if (g.tirT <= 0) {
    g.tirT = 0.42 * Math.pow(0.8, g.pouvoirs.cadence || 0);
    const nbE = 1 + (g.pouvoirs.multi || 0);
    for (let i = 0; i < nbE; i++) {
      const a = (i - (nbE - 1) / 2) * 0.16;
      g.etoiles.push({ x: sc.x + 10 * S, y: sc.y - 44 * S, vx: Math.sin(a) * 560 * KV, vy: -Math.cos(a) * 560 * KV, rb: g.pouvoirs.rebond || 0, dernier: null, rot: 0 });
    }
    son('tir');
  }
  // Pouvoirs à minuterie
  if (g.pouvoirs.bulle && !g.bulle.pret) { g.bulle.t -= dt; if (g.bulle.t <= 0) g.bulle.pret = true; }
  if (g.pouvoirs.tornade) {
    g.tornadeT -= dt;
    if (g.tornadeT <= 0) {
      g.tornadeT = Math.max(2.4, 7 - 1.3 * g.pouvoirs.tornade);
      g.tornades.push({ x: sc.x, y: sc.y - 20 * S, w: (24 + 8 * g.pouvoirs.tornade) * S, vie: 0, coups: new Map() });
    }
  }
  if (g.pouvoirs.soleil) {
    g.soleilT -= dt;
    if (g.soleilT <= 0) {
      g.soleilT = Math.max(2.6, 6 - 0.8 * g.pouvoirs.soleil);
      const R = (110 + 30 * g.pouvoirs.soleil) * S;
      for (const p of g.pluie) if (Math.hypot(p.x - sc.x, p.y - sc.y) < R) { p.mort = true; etincelles(p.x, p.y, '#ffe680', 3); }
      g.hum = Math.max(0, g.hum - 4 * g.pouvoirs.soleil);
      g.parts.push({ x: sc.x, y: sc.y - 20 * S, vx: 0, vy: 0, vie: 0.5, max: 0.5, c: '#ffe680', s: R, forme: 'anneau' });
      son('soleil');
    }
  }
  // Étoiles
  for (const e of g.etoiles) {
    e.x += e.vx * dt; e.y += e.vy * dt; e.rot += dt * 10;
    if (e.x < 6 || e.x > W - 6) { if (e.rb > 0) { e.vx = -e.vx; e.x = borne(e.x, 6, W - 6); e.rb--; } else e.mort = true; }
    if (e.y < -30 || e.y > H + 20) e.mort = true;
    if (e.mort) continue;
    for (const n of g.nuages) {
      if (n.mort || n === e.dernier) continue;
      if (Math.hypot(n.x - e.x, n.y - e.y) < n.r * 0.88 + 7 * S) {
        frapper(n, 1, e.x, e.y);
        if (e.rb > 0) {
          e.rb--; e.dernier = n;
          let best = null, bd = 1e9;
          for (const m of g.nuages) { if (m === n || m.mort) continue; const d = Math.hypot(m.x - e.x, m.y - e.y); if (d < bd) { bd = d; best = m; } }
          const v = Math.hypot(e.vx, e.vy);
          if (best) { e.vx = (best.x - e.x) / bd * v; e.vy = (best.y - e.y) / bd * v; }
          else { e.vy = Math.abs(e.vy); e.vx = hasard(-200, 200) * S; }
        } else e.mort = true;
        break;
      }
    }
  }
  // Nuages
  for (const n of g.nuages) { if (!n.mort) majNuage(n, dt, ventF); }
  // Tornades
  for (const tn of g.tornades) {
    tn.vie += dt; tn.y -= 170 * KV * dt; tn.x += Math.sin(tn.vie * 4) * 40 * S * dt;
    if (tn.y < -80) tn.mort = true;
    for (const n of g.nuages) {
      if (n.mort) continue;
      if (Math.abs(n.x - tn.x) < tn.w + n.r * 0.7 && Math.abs(n.y - tn.y) < 50 * S + n.r * 0.5) {
        const dern = tn.coups.get(n) || -1;
        if (tn.vie - dern > 0.35) { tn.coups.set(n, tn.vie); frapper(n, 1, n.x, n.y + n.r * 0.5); if (!n.ty.roi) n.cibleY = Math.max(H * 0.08, n.cibleY - 8 * S); }
      }
    }
    if (g.combos.aspiration) for (const gt of g.gouttes) if (Math.hypot(gt.x - tn.x, gt.y - tn.y) < 110 * S) gt.attiree = true;
    if (Math.random() < dt * 40) g.parts.push({ x: tn.x + hasard(-tn.w, tn.w), y: tn.y + hasard(-30, 30) * S, vx: hasard(-60, 60), vy: hasard(-80, -20), vie: 0.8, max: 0.8, c: Math.random() < 0.5 ? '#ff9ccf' : '#ffd1e8', s: 5 * S, forme: 'petale', rot: Math.random() * 6 });
  }
  // Lucioles
  const rayonL = (g.combos.tourbillon ? 70 + Math.sin(g.t * 3) * 14 : 48) * S;
  g.lucioles.forEach((l, i) => {
    l.a += dt * 2.6;
    const ang = l.a + i * 6.283 / g.lucioles.length;
    const ox = sc.x + Math.cos(ang) * rayonL, oy = sc.y - 18 * S + Math.sin(ang) * rayonL * 0.8;
    if (l.etat === 0) {
      l.x += (ox - l.x) * Math.min(1, dt * 12); l.y += (oy - l.y) * Math.min(1, dt * 12);
      l.t -= dt;
      if (l.t <= 0) {
        let best = null, bd = 1e9;
        for (const n of g.nuages) { if (n.mort) continue; const d = Math.hypot(n.x - l.x, n.y - l.y); if (d < bd) { bd = d; best = n; } }
        if (best) { l.etat = 1; l.cible = best; } else l.t = 1;
      }
    } else if (l.etat === 1) {
      const n = l.cible;
      if (!n || n.mort) { l.etat = 2; } else {
        const d = Math.hypot(n.x - l.x, n.y - l.y), v = 620 * KV * dt;
        if (d < n.r * 0.8) { frapper(n, 1, l.x, l.y); l.etat = 2; }
        else { l.x += (n.x - l.x) / d * v; l.y += (n.y - l.y) / d * v; }
      }
    } else {
      const d = Math.hypot(ox - l.x, oy - l.y), v = 700 * KV * dt;
      if (d < v + 2) { l.etat = 0; l.t = Math.max(1.2, 3.2 - 0.4 * g.pouvoirs.lucioles); } else { l.x += (ox - l.x) / d * v; l.y += (oy - l.y) / d * v; }
    }
    // Les lucioles avalent la pluie
    const rr = (g.combos.tourbillon ? 14 : 10) * S;
    for (const p of g.pluie) if (!p.mort && Math.abs(p.x - l.x) < rr && Math.abs(p.y - l.y) < rr) { p.mort = true; etincelles(p.x, p.y, '#fff59a', 4); }
  });
  // Pluie, grêle
  for (const p of g.pluie) {
    if (p.mort) continue;
    p.vy += (p.grele ? 260 : 120) * KV * dt;
    p.x += (p.vx + ventF * 0.6) * dt; p.y += p.vy * dt;
    if (p.x < -20 || p.x > W + 20) { p.mort = true; continue; }
    if (sc.inv <= 0 && Math.hypot(p.x - sc.x, p.y - (sc.y - 16 * S)) < (p.grele ? 8 : 5) * S + 15 * S) { p.mort = true; blesser(); continue; }
    if (p.y >= sol()) {
      if (p.grele && !p.rebondi) { p.rebondi = true; p.y = sol(); p.vy = -170 * KV; p.vx = hasard(-80, 80) * S; g.hum += 2.5; son('grele'); }
      else { p.mort = true; if (!p.rebondi) g.hum += 2.2; g.parts.push({ x: p.x, y: sol(), vx: 0, vy: 0, vie: 0.35, max: 0.35, c: '#8fd3ff', s: 8 * S, forme: 'eclabousse' }); }
    }
  }
  g.hum = Math.max(0, g.hum - 1.4 * dt);
  // Éclairs
  for (const e of g.eclairs) {
    e.t += dt;
    if (e.t < 1.15) { if (!e.bip) { e.bip = true; son('alerte'); } }
    else if (!e.frappe) {
      e.frappe = true; g.eclairFlash = 0.25; g.secousse = Math.max(g.secousse, 0.2); son('tonnerre');
      if (sc.inv <= 0 && Math.abs(sc.x - e.x) < 17 * S + 13 * S) blesser();
    } else if (e.t > 1.5) e.mort = true;
  }
  if (g.eclairFlash > 0) g.eclairFlash -= dt;
  // Gouttes d'arc-en-ciel
  const aimant = (58 + 36 * (g.pouvoirs.aimant || 0)) * S;
  for (const gt of g.gouttes) {
    if (gt.mort) continue;
    gt.t += dt;
    const d = Math.hypot(sc.x - gt.x, sc.y - 16 * S - gt.y);
    if (gt.attiree || d < aimant) {
      const v = (gt.attiree ? 520 : 380) * S * dt;
      gt.x += (sc.x - gt.x) / (d || 1) * v; gt.y += (sc.y - 16 * S - gt.y) / (d || 1) * v;
    } else {
      gt.vy = Math.min(gt.vy + 60 * KV * dt, 80 * KV);
      gt.y += gt.vy * dt; gt.x += (gt.vx + Math.sin(gt.t * 3 + gt.p) * 30 * S) * dt;
      gt.vx *= 0.98;
      // Le nuage voleur aspire les gouttes proches
      for (const n of g.nuages) {
        if (n.mort || !n.ty.voleur) continue;
        const dv = Math.hypot(n.x - gt.x, n.y - gt.y);
        if (dv < n.r * 0.8) { gt.mort = true; n.vole++; break; }
        if (dv < 120 * S) { gt.x += (n.x - gt.x) / dv * 140 * S * dt; gt.y += (n.y - gt.y) / dv * 140 * S * dt; }
      }
    }
    if (gt.mort) continue;
    if (d < 24 * S) { gt.mort = true; ramasser(gt); }
    else if (gt.y > sol() + 4) gt.mort = true;
  }
  // Particules
  for (const p of g.parts) { p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.forme === 'rond' || p.forme === 'etoile' || p.forme === 'confetti') p.vy += 260 * dt; if (p.rot != null) p.rot += dt * 5; }
  for (const f of g.flottants) { f.vie -= dt; f.y -= 40 * dt; }
  if (g.secousse > 0) g.secousse -= dt;
  nettoyer();
  // Défaite
  if (g.coeurs <= 0) { defaite('coeurs'); return; }
  if (g.hum >= 100) { g.hum = 100; defaite('vallee'); }
}

function majNuage(n, dt, ventF) {
  const g = G, ty = n.ty;
  n.phase += dt;
  if (n.flash > 0) n.flash -= dt;
  if (ty.roi) {
    n.y += (n.cibleY + Math.sin(n.phase * 0.9) * 12 * S - n.y) * Math.min(1, dt * 1.5);
    const amp = W / 2 - n.r - 6;
    n.x = W / 2 + Math.sin(n.phase * (g.def.roi === 4 && n.pv < n.pvMax / 2 ? 0.75 : 0.5)) * amp;
    if (n.y < n.cibleY - 30 * S) return;
    const phase2 = g.def.roi === 4 && n.pv < n.pvMax / 2;
    n.attaqueT -= dt;
    if (n.attaqueT <= 0) {
      n.attaqueT = (3.0 - 0.3 * g.def.roi) * (phase2 ? 0.7 : 1);
      const k = 5 + g.def.roi + (phase2 ? 2 : 0);
      for (let i = 0; i < k; i++) {
        const a = -0.9 + 1.8 * i / (k - 1);
        g.pluie.push({ x: n.x + Math.sin(a) * n.r * 0.6, y: n.y + n.r * 0.6, vx: Math.sin(a) * 150 * S, vy: 110 * KV });
      }
    }
    if (g.def.roi >= 2) {
      n.eclairRoiT -= dt;
      if (n.eclairRoiT <= 0) {
        n.eclairRoiT = phase2 ? 3.2 : 4.6;
        lancerEclair(g.sorc.x);
        if (phase2) lancerEclair(borne(g.sorc.x + (Math.random() < 0.5 ? -90 : 90) * S, 20, W - 20));
      }
    }
    if (g.def.roi >= 3) {
      n.appelT -= dt;
      if (n.appelT <= 0) { n.appelT = 8; creerNuage(Math.random() < 0.5 ? 'mini' : 'rapide', n.x - n.r, n.y, H * 0.3); creerNuage('mini', n.x + n.r, n.y, H * 0.33); }
    }
    if (phase2) {
      n.greleRoiT -= dt;
      if (n.greleRoiT <= 0) { n.greleRoiT = 5; for (let i = 0; i < 3; i++) g.pluie.push({ x: n.x + (i - 1) * n.r * 0.6, y: n.y + n.r * 0.5, vx: (i - 1) * 60 * S, vy: 80 * KV, grele: true }); }
    }
    return;
  }
  if (ty.dore) {
    n.x += n.vx * dt; n.y = n.cibleY + Math.sin(n.phase * 3) * 10 * S;
    if ((n.vx > 0 && n.x > W + n.r + 5) || (n.vx < 0 && n.x < -n.r - 5)) n.mort = true;
    return;
  }
  // Descente vers son altitude, puis il flotte de côté et descend lentement
  if (n.y < n.cibleY) n.y = Math.min(n.cibleY, n.y + ty.vit * 2.4 * KV * dt);
  else { n.cibleY = Math.min(H * 0.47, n.cibleY + 1.6 * KV * dt); n.y += (n.cibleY - n.y) * dt; }
  let vx = n.vx;
  if (ty.rapide) vx = n.vx * (0.7 + 0.5 * Math.sin(n.phase * 2.2));
  n.x += (vx + ventF * 0.3) * dt;
  if (n.x < n.r * 0.6) { n.x = n.r * 0.6; n.vx = Math.abs(n.vx); }
  if (n.x > W - n.r * 0.6) { n.x = W - n.r * 0.6; n.vx = -Math.abs(n.vx); }
  if (n.y < n.cibleY - 5) return; // pas d'attaque tant qu'il arrive
  const pluieMult = 1 / (0.75 + g.n * 0.035);
  if (ty.pluie) {
    n.pluieT -= dt;
    if (n.pluieT <= 0) {
      n.pluieT = ty.pluie * pluieMult * hasard(0.7, 1.3);
      const k = ty.blinde ? 2 : 1;
      for (let i = 0; i < k; i++) g.pluie.push({ x: n.x + hasard(-n.r * 0.6, n.r * 0.6), y: n.y + n.r * 0.5, vx: 0, vy: 60 * KV });
    }
  }
  if (ty.grele) {
    n.greleT -= dt;
    if (n.greleT <= 0) { n.greleT = ty.grele * pluieMult * hasard(0.8, 1.2); g.pluie.push({ x: n.x, y: n.y + n.r * 0.5, vx: hasard(-40, 40) * S, vy: 50 * KV, grele: true }); }
  }
  if (ty.eclair) {
    n.eclairT -= dt;
    if (n.eclairT <= 0) { n.eclairT = ty.eclair * pluieMult * hasard(0.8, 1.3); lancerEclair(borne(G.sorc.x + hasard(-40, 40) * S, 20, W - 20), n); }
  }
}

function lancerEclair(x, n) { G.eclairs.push({ x, y0: n ? n.y + n.r * 0.5 : 0, t: 0, frappe: false, source: n || null }); }

function frapper(n, deg, x, y) {
  if (n.mort) return;
  n.pv -= deg; n.flash = 0.12;
  if (n.ty.blinde) n.cibleY = Math.max(H * 0.08, n.cibleY - 5 * S);
  etincelles(x, y, '#fff6b0', 3);
  son('touche');
  if (n.pv <= 0) eclater(n);
}

function eclater(n) {
  const g = G;
  n.mort = true;
  g.eclates++;
  g.score += n.ty.pts;
  g.flottants.push({ x: n.x, y: n.y, txt: '+' + nb(n.ty.pts), vie: 1, c: '#fff' });
  for (let i = 0; i < 18 + n.r / S * 0.4; i++) {
    const a = Math.random() * 6.28, v = hasard(60, 220) * S;
    g.parts.push({ x: n.x, y: n.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 0.7, max: 0.7, c: ARC[i % 6], s: hasard(3, 6) * S, forme: 'rond' });
  }
  g.parts.push({ x: n.x, y: n.y, vx: 0, vy: 0, vie: 0.45, max: 0.45, c: '#ffffff', s: n.r * 1.4, forme: 'anneau' });
  son('pop');
  const k = n.ty.gouttes + n.vole;
  for (let i = 0; i < k; i++) g.gouttes.push({ x: n.x + hasard(-n.r * 0.5, n.r * 0.5), y: n.y, vx: hasard(-70, 70) * S, vy: hasard(-120, -40) * KV, t: 0, p: Math.random() * 6, c: ARC[(i + g.eclates) % 6] });
  if (n.ty.divise) { creerNuage('mini', n.x - n.r * 0.5, n.y, n.y + 10 * S).vx = -40 * S; creerNuage('mini', n.x + n.r * 0.5, n.y, n.y + 10 * S).vx = 40 * S; }
  if (n.ty.roi) {
    g.secousse = 0.5;
    for (let i = 0; i < 60; i++) { const a = Math.random() * 6.28, v = hasard(80, 380) * S; g.parts.push({ x: n.x, y: n.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 1.2, max: 1.2, c: ARC[i % 6], s: hasard(4, 8) * S, forme: 'etoile', rot: 0 }); }
    for (const m of g.nuages) if (!m.mort && m !== n) { m.mort = true; g.parts.push({ x: m.x, y: m.y, vx: 0, vy: 0, vie: 0.45, max: 0.45, c: '#fff', s: m.r * 1.4, forme: 'anneau' }); }
    g.pluie.length = 0; g.eclairs.length = 0;
    setTimeout(() => { if (G === g && !g.fini) victoire(); }, 900);
    g.roiVaincu = true;
  }
}

function ramasser(gt) {
  const g = G;
  g.gagnees++; g.score += 5; g.jauge++;
  son('goutte', g.jauge);
  etincelles(gt.x, gt.y, gt.c, 3);
  if (g.jauge >= g.jaugeMax && !g.fini && !g.roiVaincu) {
    g.jauge = 0; g.choixFaits++; g.jaugeMax += 6;
    son('jauge');
    setTimeout(() => { if (G === g && !g.fini && ecran === 'jeu') ouvrirChoix(); else if (G === g) g.choixAttente = true; }, 60);
  }
}

function blesser() {
  const g = G, sc = g.sorc;
  if (sc.inv > 0 || g.fini) return;
  if (g.pouvoirs.bulle && g.bulle.pret) {
    g.bulle.pret = false; g.bulle.t = 16 - 2.5 * g.pouvoirs.bulle; sc.inv = 0.6;
    son('bulle');
    g.parts.push({ x: sc.x, y: sc.y - 18 * S, vx: 0, vy: 0, vie: 0.4, max: 0.4, c: '#bfe8ff', s: 40 * S, forme: 'anneau' });
    if (g.combos.eclatbulle) for (let i = 0; i < 8; i++) { const a = -Math.PI / 2 + (i - 3.5) * 0.35; g.etoiles.push({ x: sc.x, y: sc.y - 20 * S, vx: Math.cos(a) * 520 * KV, vy: Math.sin(a) * 520 * KV, rb: g.pouvoirs.rebond || 0, dernier: null, rot: 0 }); }
    return;
  }
  g.coeurs--; sc.inv = 1.3; g.secousse = 0.3;
  son('aie');
  etincelles(sc.x, sc.y - 18 * S, '#8fd3ff', 10);
}

function etincelles(x, y, c, k) {
  for (let i = 0; i < k; i++) { const a = Math.random() * 6.28, v = hasard(40, 140) * S; G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, vie: 0.4, max: 0.4, c, s: hasard(2, 4) * S, forme: 'rond' }); }
}

function nettoyer() {
  const g = G;
  const garder = (a) => { let j = 0; for (let i = 0; i < a.length; i++) if (!a[i].mort && (a[i].vie == null || a[i].vie > 0)) a[j++] = a[i]; a.length = j; };
  garder(g.etoiles); garder(g.nuages); garder(g.pluie); garder(g.gouttes); garder(g.eclairs); garder(g.tornades); garder(g.parts); garder(g.flottants);
  if (g.parts.length > 500) g.parts.splice(0, g.parts.length - 500);
}

/* ---------- Dessin ---------- */
function dessinerFond(c, t, hum) {
  const ciel = c.createLinearGradient(0, 0, 0, H);
  ciel.addColorStop(0, '#7fc4ff'); ciel.addColorStop(0.6, '#c8ecff'); ciel.addColorStop(1, '#e8f8ff');
  c.fillStyle = ciel; c.fillRect(0, 0, W, H);
  // Soleil
  c.fillStyle = 'rgba(255,240,170,.85)';
  c.beginPath(); c.arc(W * 0.84, H * 0.08, 34 * S, 0, 6.28); c.fill();
  // Collines lointaines
  c.fillStyle = '#9fd8a6';
  c.beginPath(); c.moveTo(0, H * 0.74);
  for (let x = 0; x <= W; x += 20) c.lineTo(x, H * 0.74 - Math.sin(x / W * 5 + 1) * 30 * S - 20 * S);
  c.lineTo(W, H); c.lineTo(0, H); c.fill();
  // Petites maisons de la vallée
  const maisons = [0.14, 0.38, 0.66, 0.88];
  maisons.forEach((mx, i) => {
    const x = W * mx, y = H * 0.74 - Math.sin(mx * 5 + 1) * 30 * S - 16 * S;
    c.fillStyle = ['#fff3d6', '#ffe1e1', '#e9f0ff', '#fff3d6'][i];
    c.fillRect(x - 12 * S, y - 12 * S, 24 * S, 18 * S);
    c.fillStyle = ['#e0645a', '#7c5ce0', '#f0a030', '#3fb36b'][i];
    c.beginPath(); c.moveTo(x - 16 * S, y - 12 * S); c.lineTo(x, y - 26 * S); c.lineTo(x + 16 * S, y - 12 * S); c.fill();
    c.fillStyle = '#ffd977'; c.fillRect(x - 4 * S, y - 6 * S, 8 * S, 8 * S);
  });
  // Prairie
  const pre = c.createLinearGradient(0, H * 0.78, 0, H);
  pre.addColorStop(0, '#7fcf6e'); pre.addColorStop(1, '#56ad4f');
  c.fillStyle = pre;
  c.beginPath(); c.moveTo(0, H * 0.8);
  for (let x = 0; x <= W; x += 20) c.lineTo(x, H * 0.8 - Math.sin(x / W * 3 + 2) * 14 * S);
  c.lineTo(W, H); c.lineTo(0, H); c.fill();
  // Flaques selon l'humidité
  if (hum > 5) {
    c.fillStyle = `rgba(90,170,240,${0.25 + hum / 200})`;
    for (let i = 0; i < 5; i++) {
      const x = W * (0.1 + i * 0.2), r = (8 + hum * 0.45) * S;
      c.beginPath(); c.ellipse(x, sol() + 10 * S, r, r * 0.25, 0, 0, 6.28); c.fill();
    }
  }
  // Fleurs (elles se penchent quand la vallée est mouillée)
  for (let i = 0; i < 9; i++) {
    const x = W * (0.05 + i * 0.112), y = sol() + 6 * S;
    const pench = (hum / 100) * 0.9 + Math.sin(t * 2 + i) * 0.08;
    c.strokeStyle = '#3a8a3a'; c.lineWidth = 2 * S;
    const hx = x + Math.sin(pench) * 14 * S, hy = y - Math.cos(pench) * 14 * S;
    c.beginPath(); c.moveTo(x, y); c.lineTo(hx, hy); c.stroke();
    c.fillStyle = ARC[i % 6];
    for (let k = 0; k < 5; k++) { const a = k * 1.256 + t * 0.3; c.beginPath(); c.arc(hx + Math.cos(a) * 4 * S, hy + Math.sin(a) * 4 * S, 3 * S, 0, 6.28); c.fill(); }
    c.fillStyle = '#fff3a0'; c.beginPath(); c.arc(hx, hy, 2.4 * S, 0, 6.28); c.fill();
  }
}

function formeNuage(c, r) {
  c.beginPath();
  c.arc(0, 0, r * 0.78, 0, 6.28);
  c.moveTo(-r * 0.25, 0); c.arc(-r * 0.55, r * 0.12, r * 0.52, 0, 6.28);
  c.moveTo(r * 0.85, 0); c.arc(r * 0.55, r * 0.12, r * 0.52, 0, 6.28);
  c.moveTo(-r * 0.05, 0); c.arc(-r * 0.3, -r * 0.32, r * 0.5, 0, 6.28);
  c.moveTo(r * 0.75, 0); c.arc(r * 0.32, -r * 0.26, r * 0.48, 0, 6.28);
}

// Dessine un nuage (aussi utilisé par les cartes de présentation).
function dessinerNuage(c, type, x, y, r, t, opt) {
  const ty = TYPES[type];
  opt = opt || {};
  c.save(); c.translate(x, y);
  const sq = 1 + Math.sin(t * 3) * 0.03;
  c.scale(sq, 2 - sq);
  if (ty.rapide) {
    c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 2;
    for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(-r * 1.1 - i * 4, -r * 0.3 + i * r * 0.3); c.lineTo(-r * 1.6 - i * 4, -r * 0.3 + i * r * 0.3); c.stroke(); }
  }
  const gr = c.createLinearGradient(0, -r, 0, r);
  gr.addColorStop(0, ty.c2); gr.addColorStop(1, ty.c1);
  c.fillStyle = gr;
  formeNuage(c, r); c.fill();
  // Détails du type
  if (type === 'orage') {
    c.fillStyle = `rgba(255,227,107,${0.6 + Math.sin(t * 8) * 0.3})`;
    c.beginPath(); c.moveTo(r * 0.1, -r * 0.1); c.lineTo(-r * 0.15, r * 0.35); c.lineTo(r * 0.02, r * 0.33); c.lineTo(-r * 0.1, r * 0.7); c.lineTo(r * 0.25, r * 0.22); c.lineTo(r * 0.06, r * 0.24); c.closePath(); c.fill();
  } else if (type === 'diviseur') {
    c.strokeStyle = 'rgba(160,70,130,.6)'; c.lineWidth = 2.5; c.setLineDash([5, 5]);
    c.beginPath(); c.moveTo(0, -r * 0.75); c.lineTo(0, r * 0.65); c.stroke(); c.setLineDash([]);
  } else if (type === 'grele') {
    c.fillStyle = '#ffffff';
    for (let i = 0; i < 5; i++) { c.beginPath(); c.arc(-r * 0.5 + i * r * 0.25, r * 0.42 + (i % 2) * 4, r * 0.07, 0, 6.28); c.fill(); }
  } else if (type === 'blinde') {
    c.fillStyle = '#6c7383';
    c.fillRect(-r * 0.7, -r * 0.05, r * 0.34, r * 0.4); c.fillRect(r * 0.36, -r * 0.05, r * 0.34, r * 0.4);
    c.fillStyle = '#d8dce6';
    [[-0.62, 0.05], [-0.44, 0.25], [0.44, 0.05], [0.62, 0.25]].forEach(([a, b]) => { c.beginPath(); c.arc(r * a, r * b, r * 0.04, 0, 6.28); c.fill(); });
  } else if (type === 'dore') {
    c.fillStyle = '#ffffff';
    for (let i = 0; i < 4; i++) { const a = t * 2 + i * 1.57; etoileForme(c, Math.cos(a) * r * 1.1, Math.sin(a) * r * 0.7, r * 0.14, 0); c.fill(); }
  } else if (type === 'roi') {
    // Couronne
    c.fillStyle = '#ffcc33'; c.strokeStyle = '#c98a00'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-r * 0.42, -r * 0.72); c.lineTo(-r * 0.46, -r * 1.12); c.lineTo(-r * 0.22, -r * 0.9); c.lineTo(0, -r * 1.22); c.lineTo(r * 0.22, -r * 0.9); c.lineTo(r * 0.46, -r * 1.12); c.lineTo(r * 0.42, -r * 0.72); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#ff5c8a'; c.beginPath(); c.arc(0, -r * 0.86, r * 0.07, 0, 6.28); c.fill();
    c.fillStyle = '#5cc8ff'; c.beginPath(); c.arc(-r * 0.27, -r * 0.8, r * 0.05, 0, 6.28); c.arc(r * 0.27, -r * 0.8, r * 0.05, 0, 6.28); c.fill();
  }
  // Visage : les yeux regardent le sorcier
  const gx = opt.regardX != null ? borne((opt.regardX - x) / 200, -1, 1) : 0;
  const gy = opt.regardY != null ? borne((opt.regardY - y) / 300, -1, 1) : 0.4;
  const ex = r * 0.26, ey = r * 0.02, er = r * 0.13;
  c.fillStyle = '#ffffff';
  c.beginPath(); c.ellipse(-ex, ey, er, er * 1.15, 0, 0, 6.28); c.ellipse(ex, ey, er, er * 1.15, 0, 0, 6.28); c.fill();
  c.fillStyle = '#2b2550';
  c.beginPath(); c.arc(-ex + gx * er * 0.45, ey + gy * er * 0.45, er * 0.55, 0, 6.28); c.arc(ex + gx * er * 0.45, ey + gy * er * 0.45, er * 0.55, 0, 6.28); c.fill();
  c.strokeStyle = '#2b2550'; c.lineWidth = Math.max(2, r * 0.07); c.lineCap = 'round';
  if (ty.dore) {
    c.beginPath(); c.arc(0, r * 0.22, r * 0.2, 0.2, Math.PI - 0.2); c.stroke();
  } else {
    // Sourcils froncés
    c.beginPath(); c.moveTo(-ex - er, ey - er * 1.5); c.lineTo(-ex + er * 0.8, ey - er * 0.9); c.moveTo(ex + er, ey - er * 1.5); c.lineTo(ex - er * 0.8, ey - er * 0.9); c.stroke();
    if (ty.voleur) { c.fillStyle = '#4a3046'; c.beginPath(); c.ellipse(0, r * 0.36, r * 0.16, r * 0.12 + Math.sin(t * 6) * r * 0.03, 0, 0, 6.28); c.fill(); }
    else { c.beginPath(); c.arc(0, r * 0.46, r * 0.17, Math.PI + 0.5, -0.5); c.stroke(); }
  }
  if (opt.flash > 0) { c.globalAlpha = 0.6; c.fillStyle = '#ffffff'; formeNuage(c, r); c.fill(); c.globalAlpha = 1; }
  c.restore();
}

function etoileForme(c, x, y, r, rot) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
    c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  c.closePath();
}

function couleurBaguette(i) {
  const b = BAGUETTES.find((x) => x.id === (prog ? prog.options.baguette : 'bois')) || BAGUETTES[0];
  return b.c === 'arc' ? ARC[(i || 0) % 6] : b.c;
}

// Le petit sorcier (aussi pour l'écran titre et la boutique).
function dessinerSorcier(c, x, y, s, t, opt) {
  opt = opt || {};
  const chap = CHAPEAUX.find((h) => h.id === (opt.chapeau || prog.options.chapeau)) || CHAPEAUX[0];
  const bag = BAGUETTES.find((h) => h.id === (opt.baguette || prog.options.baguette)) || BAGUETTES[0];
  c.save(); c.translate(x, y + Math.sin(t * 4) * 2 * s);
  if (opt.clignote) c.globalAlpha = 0.45;
  // Ombre
  c.fillStyle = 'rgba(0,0,0,.15)'; c.beginPath(); c.ellipse(0, 4 * s, 18 * s, 5 * s, 0, 0, 6.28); c.fill();
  // Robe
  c.fillStyle = '#5b5fd6';
  c.beginPath(); c.moveTo(-16 * s, 2 * s); c.quadraticCurveTo(0, 6 * s, 16 * s, 2 * s); c.lineTo(8 * s, -24 * s); c.lineTo(-8 * s, -24 * s); c.closePath(); c.fill();
  c.fillStyle = '#ffd977';
  etoileForme(c, -5 * s, -9 * s, 3.5 * s, 0); c.fill();
  etoileForme(c, 6 * s, -4 * s, 2.5 * s, 0.3); c.fill();
  // Bras et baguette
  c.strokeStyle = '#5b5fd6'; c.lineWidth = 5 * s; c.lineCap = 'round';
  c.beginPath(); c.moveTo(6 * s, -18 * s); c.lineTo(13 * s, -27 * s); c.stroke();
  c.beginPath(); c.moveTo(-6 * s, -18 * s); c.lineTo(-13 * s, -10 * s); c.stroke();
  c.strokeStyle = bag.bois; c.lineWidth = 3 * s;
  c.beginPath(); c.moveTo(12 * s, -24 * s); c.lineTo(10 * s, -44 * s); c.stroke();
  const cb = bag.c === 'arc' ? ARC[Math.floor(t * 6) % 6] : bag.c;
  c.fillStyle = cb; c.shadowColor = cb; c.shadowBlur = 10 * s;
  etoileForme(c, 10 * s, -46 * s, 5 * s, t * 2); c.fill();
  c.shadowBlur = 0;
  // Tête
  c.fillStyle = '#ffd9b8'; c.beginPath(); c.arc(0, -31 * s, 11 * s, 0, 6.28); c.fill();
  c.fillStyle = '#ff9f9f'; c.beginPath(); c.arc(-6 * s, -28 * s, 2.5 * s, 0, 6.28); c.arc(6 * s, -28 * s, 2.5 * s, 0, 6.28); c.fill();
  c.fillStyle = '#2b2550'; c.beginPath(); c.arc(-4 * s, -32 * s, 1.8 * s, 0, 6.28); c.arc(4 * s, -32 * s, 1.8 * s, 0, 6.28); c.fill();
  c.strokeStyle = '#2b2550'; c.lineWidth = 1.6 * s; c.beginPath(); c.arc(0, -29 * s, 3.5 * s, 0.3, Math.PI - 0.3); c.stroke();
  // Chapeau
  dessinerChapeau(c, chap, 0, -38 * s, s, t);
  if (opt.bulle) {
    c.strokeStyle = 'rgba(160,220,255,.9)'; c.lineWidth = 2.5 * s; c.fillStyle = 'rgba(190,235,255,.22)';
    c.beginPath(); c.arc(0, -20 * s, 32 * s + Math.sin(t * 5), 0, 6.28); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(-12 * s, -38 * s, 6 * s, 3 * s, -0.6, 0, 6.28); c.fill();
  }
  c.restore();
}

function dessinerChapeau(c, chap, x, y, s, t) {
  c.save(); c.translate(x, y);
  if (chap.id === 'champi') {
    c.fillStyle = chap.c; c.beginPath(); c.ellipse(0, -2 * s, 17 * s, 13 * s, 0, Math.PI, 0); c.fill();
    c.fillStyle = '#fff'; [[-8, -6], [3, -10], [9, -4]].forEach(([a, b]) => { c.beginPath(); c.arc(a * s, b * s, 2.6 * s, 0, 6.28); c.fill(); });
    c.restore(); return;
  }
  c.fillStyle = chap.c;
  c.beginPath(); c.ellipse(0, 0, 17 * s, 4.5 * s, 0, 0, 6.28); c.fill();
  c.beginPath(); c.moveTo(-11 * s, -1 * s); c.quadraticCurveTo(-2 * s, -20 * s, 6 * s, -30 * s + Math.sin(t * 2) * 2 * s); c.quadraticCurveTo(4 * s, -14 * s, 11 * s, -1 * s); c.closePath(); c.fill();
  if (chap.id === 'arc') {
    for (let i = 0; i < 4; i++) { c.fillStyle = ARC[i + 1]; c.fillRect(-9 * s + i * 1.2 * s, -6 * s - i * 5 * s, 18 * s - i * 3.4 * s, 3 * s); }
  } else {
    c.fillStyle = chap.c2; c.fillRect(-10 * s, -5 * s, 20 * s, 3.4 * s);
  }
  if (chap.id === 'etoile' || chap.id === 'pointe') { c.fillStyle = chap.c2; etoileForme(c, 1 * s, -14 * s, 3.5 * s, 0); c.fill(); }
  if (chap.id === 'fleur') { c.fillStyle = chap.c2; for (let k = 0; k < 5; k++) { const a = k * 1.256; c.beginPath(); c.arc(7 * s + Math.cos(a) * 3 * s, -6 * s + Math.sin(a) * 3 * s, 2.4 * s, 0, 6.28); c.fill(); } c.fillStyle = '#ffe066'; c.beginPath(); c.arc(7 * s, -6 * s, 2 * s, 0, 6.28); c.fill(); }
  if (chap.id === 'lune') { c.fillStyle = chap.c2; c.beginPath(); c.arc(0, -14 * s, 5 * s, 0, 6.28); c.fill(); c.fillStyle = chap.c; c.beginPath(); c.arc(2.5 * s, -15 * s, 4.4 * s, 0, 6.28); c.fill(); }
  c.restore();
}

function dessinerGoutte(c, x, y, r, col) {
  c.fillStyle = col;
  c.beginPath(); c.moveTo(x, y - r * 1.4); c.quadraticCurveTo(x + r, y - r * 0.2, x + r, y + r * 0.2); c.arc(x, y + r * 0.2, r, 0, Math.PI); c.quadraticCurveTo(x - r, y - r * 0.2, x, y - r * 1.4); c.fill();
}

function coeur(c, x, y, r, plein) {
  c.beginPath();
  c.moveTo(x, y + r * 0.9);
  c.bezierCurveTo(x - r * 1.4, y - r * 0.1, x - r * 0.7, y - r * 1.2, x, y - r * 0.45);
  c.bezierCurveTo(x + r * 0.7, y - r * 1.2, x + r * 1.4, y - r * 0.1, x, y + r * 0.9);
  c.fillStyle = plein ? '#ff5c7a' : 'rgba(255,255,255,.45)'; c.fill();
  c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
}

// Icônes des pouvoirs (cartes de choix, boutique, barre du jeu).
function dessinerIcone(c, id, x, y, r, t) {
  c.save(); c.translate(x, y);
  t = t || 0;
  switch (id) {
    case 'rebond':
      c.strokeStyle = '#7c5ce0'; c.lineWidth = r * 0.12; c.setLineDash([r * 0.15, r * 0.12]);
      c.beginPath(); c.moveTo(-r * 0.8, r * 0.6); c.lineTo(-r * 0.1, -r * 0.5); c.lineTo(r * 0.7, r * 0.3); c.stroke(); c.setLineDash([]);
      c.fillStyle = '#ffd447'; etoileForme(c, r * 0.6, r * 0.25, r * 0.38, t * 2); c.fill();
      break;
    case 'bulle':
      c.fillStyle = 'rgba(150,215,255,.45)'; c.strokeStyle = '#5ab4ec'; c.lineWidth = r * 0.1;
      c.beginPath(); c.arc(0, 0, r * 0.8, 0, 6.28); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.ellipse(-r * 0.3, -r * 0.35, r * 0.2, r * 0.1, -0.6, 0, 6.28); c.fill();
      break;
    case 'lucioles':
      for (let i = 0; i < 4; i++) {
        const a = t * 2 + i * 1.57;
        c.fillStyle = '#fff59a'; c.shadowColor = '#ffee55'; c.shadowBlur = r * 0.4;
        c.beginPath(); c.arc(Math.cos(a) * r * 0.6, Math.sin(a) * r * 0.6, r * 0.16, 0, 6.28); c.fill();
      }
      c.shadowBlur = 0;
      break;
    case 'tornade':
      c.strokeStyle = '#ff8cc6'; c.lineWidth = r * 0.14; c.lineCap = 'round';
      for (let i = 0; i < 4; i++) { const w = r * (0.85 - i * 0.18); c.beginPath(); c.ellipse(Math.sin(t * 3 + i) * r * 0.08, -r * 0.6 + i * r * 0.38, w, r * 0.13, 0, 0, 6.28); c.stroke(); }
      break;
    case 'multi':
      c.fillStyle = '#ffd447';
      etoileForme(c, -r * 0.5, r * 0.15, r * 0.3, 0); c.fill(); etoileForme(c, 0, -r * 0.35, r * 0.36, 0); c.fill(); etoileForme(c, r * 0.5, r * 0.15, r * 0.3, 0); c.fill();
      break;
    case 'cadence':
      c.strokeStyle = '#7c5ce0'; c.lineWidth = r * 0.1; c.lineCap = 'round';
      for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(-r * 0.2 + i * r * 0.2, r * 0.9); c.lineTo(-r * 0.2 + i * r * 0.2, r * 0.35); c.stroke(); }
      c.fillStyle = '#ffd447'; etoileForme(c, 0, -r * 0.15, r * 0.45, t * 3); c.fill();
      break;
    case 'aimant':
      c.strokeStyle = '#e0483d'; c.lineWidth = r * 0.28;
      c.beginPath(); c.arc(0, r * 0.05, r * 0.5, Math.PI, 0); c.lineTo(r * 0.5, r * 0.55); c.moveTo(-r * 0.5, r * 0.05); c.lineTo(-r * 0.5, r * 0.55); c.stroke();
      c.fillStyle = '#d8dce6'; c.fillRect(-r * 0.64, r * 0.5, r * 0.28, r * 0.2); c.fillRect(r * 0.36, r * 0.5, r * 0.28, r * 0.2);
      dessinerGoutte(c, 0, r * 0.25 + Math.sin(t * 4) * r * 0.06, r * 0.16, '#7fd0ff');
      break;
    case 'soleil':
      c.fillStyle = '#ffcc33';
      for (let i = 0; i < 8; i++) { const a = t + i * 0.785; c.beginPath(); c.moveTo(Math.cos(a) * r * 0.45, Math.sin(a) * r * 0.45); c.lineTo(Math.cos(a + 0.2) * r * 0.85, Math.sin(a + 0.2) * r * 0.85); c.lineTo(Math.cos(a - 0.2) * r * 0.85, Math.sin(a - 0.2) * r * 0.85); c.fill(); }
      c.beginPath(); c.arc(0, 0, r * 0.45, 0, 6.28); c.fill();
      break;
    case 'coeur':
      coeur(c, 0, 0, r * 0.6, true);
      break;
    case 'sechage':
      c.fillStyle = '#ffcc33'; c.beginPath(); c.arc(-r * 0.2, -r * 0.2, r * 0.45, 0, 6.28); c.fill();
      dessinerGoutte(c, r * 0.4, r * 0.35, r * 0.25, '#7fd0ff');
      break;
  }
  c.restore();
}

// Dessine fn sur toute la largeur de l'écran (W = WE pendant l'appel) : décor et barre d'infos.
function pleineLargeur(fn) { const w = W; W = WE; try { fn(); } finally { W = w; } }

// Bords de la zone de jeu sur un écran large : un voile clair et une lisière douce, pour qu'on voie
// jusqu'où vont les nuages et le sorcier sans couper le paysage.
function dessinerBordsZone(c) {
  if (X0 < 1) return;
  for (const cote of [0, 1]) {
    const x = cote ? W : 0, d = cote ? 1 : -1, l = Math.min(X0, 70);
    const gr = c.createLinearGradient(x, 0, x + d * l, 0);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(255,255,255,.28)');
    c.fillStyle = gr; c.fillRect(cote ? x : x - l, 0, l, sol());
    c.fillStyle = 'rgba(255,255,255,.28)'; c.fillRect(cote ? x + l : -X0, 0, X0 - l, sol());
  }
}

function dessinerJeu(c) {
  const g = G, t = g.t;
