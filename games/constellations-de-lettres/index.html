<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });

  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).

    var isole = !!(coin || options.isole);

    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }

      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;

      bouton.setAttribute('aria-expanded', 'false');

    }

    });

    });

    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');

        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }

      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  function lireDonnees(jeu) {

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  }

  function texte(cle, vars) {
    var l = langue();

    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

      element.addEventListener(type, function (e) { e.stopPropagation(); });

    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');

  function armerEffacement(b, jeu, fait) {

    b.addEventListener('click', function () {

        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }

      b.classList.remove('armer');

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)

  //                prochaine écriture du jeu)

    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

/* ---------- Sons (Web Audio, aucun son avant la 1re action) ---------- */
let audio = null;
let sonActif = true;
function contexteAudio() {
  if (!sonActif) return null;
  if (!audio) {
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  }
  if (audio && audio.state === 'suspended' && !enPause) { try { audio.resume(); } catch (e) { /* rien */ } }
  return audio;
}
function note(freq, duree = 0.15, type = 'sine', vol = 0.18, retard = 0, glisse = 0) {
  const ac = contexteAudio();
  if (!ac) return;
  try {
    const t0 = ac.currentTime + retard;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (glisse) o.frequency.exponentialRampToValueAtTime(glisse, t0 + duree);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
    o.connect(g).connect(ac.destination);
    o.start(t0);
    o.stop(t0 + duree + 0.05);
  } catch (e) { /* audio indisponible */ }
}
function bruit(duree = 0.3, vol = 0.12, frequence = 1200) {
  const ac = contexteAudio();
  if (!ac) return;
  try {
    const n = Math.floor(ac.sampleRate * duree);
    const tampon = ac.createBuffer(1, n, ac.sampleRate);
    const d = tampon.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource();
    s.buffer = tampon;
    const f = ac.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = frequence;
    const g = ac.createGain();
    g.gain.value = vol;
    s.connect(f).connect(g).connect(ac.destination);
    s.start();
  } catch (e) { /* audio indisponible */ }
}

/* ---------- Progression sauvegardée ---------- */
// Tout passe par JEL_SAVE (module commun save.js) : dans le cadre du site,
// c'est le seul stockage disponible.
let progres = { etoiles: [], records: [], carnet: [], niveauMax: 1 };
function chargerProgres() {
  const d = JEL_SAVE.load(JEU);
  progres = {
    etoiles: Array.isArray(d.etoiles) ? d.etoiles.slice(0, NIVEAUX.length).map((x) => Math.max(0, Math.min(3, Number(x) || 0))) : [],
    records: Array.isArray(d.records) ? d.records.slice(0, NIVEAUX.length).map((x) => Math.max(0, Number(x) || 0)) : [],
    carnet: Array.isArray(d.carnet) ? d.carnet.filter((c) => OBJETS.includes(c)) : [],
    niveauMax: Math.max(1, Math.min(NIVEAUX.length, Number(d.niveau) || 1)),
  };
  if (d.options && typeof d.options.son === 'boolean') sonActif = d.options.son;
  else {
    try { const s = localStorage.getItem('constellations-son'); if (s !== null) sonActif = s === '1'; } catch (e) { /* pas de stockage */ }
  }
}
const scoreTotal = () => progres.records.reduce((a, b) => a + (b || 0), 0);
const totalEtoiles = () => progres.etoiles.reduce((a, b) => a + (b || 0), 0);
const debloque = (i) => i + 1 <= progres.niveauMax || i === 0 || (progres.etoiles[i - 1] || 0) > 0;
function donneesSauvegarde(niveau) {
  return { niveau, score: Math.max(scoreTotal(), progres.scoreRepris || 0), etoiles: progres.etoiles, records: progres.records, carnet: progres.carnet, options: { son: sonActif } };
}
function enregistrer(niveau) {
  progres.niveauMax = Math.max(progres.niveauMax, Math.min(NIVEAUX.length, niveau));
  JEL_SAVE.save(JEU, donneesSauvegarde(Math.max(niveau, 1)));
}

const ECRANS = ['ecran-titre', 'ecran-niveaux', 'ecran-carnet', 'ecran-jeu'];
function montrer(id) {
  ECRANS.forEach((e) => $(e).classList.toggle('cache', e !== id));
}
function fermerVoiles() { ['voile-nouveau', 'voile-pause', 'voile-fin'].forEach((v) => $(v).classList.add('cache')); }

function majBoutonsSon() {
  document.querySelectorAll('.btn-son').forEach((b) => {
    b.innerHTML = sonActif ? ICONES.sonOui : ICONES.sonNon;
    b.setAttribute('aria-pressed', sonActif ? 'false' : 'true');
    b.setAttribute('aria-label', t(sonActif ? 'bouton.son' : 'bouton.sonCoupe'));
  });
}
function basculerSon() {
  sonActif = !sonActif;
  if (!sonActif && audio) { try { audio.suspend(); } catch (e) { /* rien */ } }
  try { localStorage.setItem('constellations-son', sonActif ? '1' : '0'); } catch (e) { /* pas de stockage */ }
  // Le choix va aussi dans la sauvegarde, sans toucher au niveau (fusion).
  if (JEL_SAVE.existe(JEU)) JEL_SAVE.save(JEU, { options: { son: sonActif } });
  majBoutonsSon();
  SONS.clic();
}

/* Dessin de l'écran titre (sert aussi de jaquette) */
function dessinerTitre() {
  const pts = [[40, 60], [90, 30], [150, 50], [200, 22], [260, 48], [295, 92]];
  let s = '';
  for (let i = 0; i < 40; i++) s += `<circle cx="${(i * 83) % 330}" cy="${(i * 47) % 150}" r="${1 + (i % 3) * 0.6}" fill="#fff" opacity="${0.4 + (i % 4) * 0.15}"/>`;
  s += `<polyline points="${pts.map((p) => p.join(',')).join(' ')}" fill="none" stroke="#ffd86b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`;
  pts.forEach(([x, y], i) => {
    s += `<circle cx="${x}" cy="${y}" r="${i % 2 ? 12 : 10}" fill="#fff4b8"/><circle cx="${x}" cy="${y}" r="${i % 2 ? 18 : 15}" fill="#ffd86b" opacity=".25"/>`;
  });
  // Planète de Zou, Lune et fusée
  s += `<g transform="translate(250 120) scale(.85)">${DESSINS.planete}</g>`;
  s += `<g transform="translate(10 105) scale(.55)">${DESSINS.lune}</g>`;
  s += `<g transform="translate(70 150) scale(.7) rotate(25 50 50)">${DESSINS.fusee}</g>`;
  s += `<ellipse cx="170" cy="222" rx="80" ry="16" fill="#3d3592"/>`;
  s += dessinZou(118, 108, 1.05);
  $('titre-dessin').innerHTML = s;
}

/* =====================================================================
   La partie
   ===================================================================== */
let etat = null;      // niveau en cours
let enPause = false;
let enJeu = false;    // une partie est en cours (pour la sauvegarde à la fermeture)
let horloge = 0;      // temps de jeu (ms), figé pendant la pause
let taches = [];      // actions planifiées sur l'horloge du jeu
const ciel = $('ciel');

function planifier(ms, f) { taches.push({ quand: horloge + ms, f }); }

function lancerNiveau(i) {
  fermerVoiles();
  const def = NIVEAUX[i];
  etat = {
    i, def,
    mots: def.mots.slice(),
    iMot: 0,
    boucliers: boucliersDe(i), boucliersMax: boucliersDe(i),
    erreurs: 0, aides: 0, score: 0, erreursMot: 0,
    etoiles: [], nuages: [], lettres: [], prochaine: 0,
    actif: false,
    aube: 0, aubeDuree: 0,
    trou: null, filante: null, prochaineFilante: 0,
    tuto: null, inactif: 0,
    termine: false,
  };
  enJeu = true;
  enPause = false;
  document.body.classList.remove('en-pause');
  horloge = 0;
  taches = [];
  montrer('ecran-jeu');
  $('txt-niveau').textContent = t('jeu.niveau', { n: i + 1 });
  $('btn-telescope').classList.toggle('cache', !(def.efface || def.memoire));
  $('jauge-aube').classList.toggle('cache', !def.aube);
  $('lueur-aube').style.opacity = 0;
  $('soleil-aube').style.bottom = '-120px';
  // Durée de l'aube : environ 3,4 s par lettre du niveau + 12 s
  if (def.aube) {
    const total = etat.mots.reduce((a, m) => a + lettresDe(m).length, 0);
    etat.aubeDuree = (total * 3.4 + 12) * 1000 / def.aube;
  }
  majBoucliers();
  majScore();
  majProgresMots();
  viderCiel();
  $('cases').innerHTML = '';
  $('panneau-dessin').innerHTML = '';
  if (def.nouveau) montrerNouveaute(def.nouveau, () => commencerMot());
  else commencerMot();
}

function viderCiel() {
  ciel.querySelectorAll('.etoile, .nuage, #trou, #filante, #grand-dessin, .main, #bulle-tuto, .etincelle, .points').forEach((e) => e.remove());
  $('traits').querySelector('polyline').setAttribute('points', '');
  $('traits').classList.remove('brille');
  if (etat) { etat.etoiles = []; etat.nuages = []; etat.trou = null; etat.filante = null; etat.tuto = null; }
}

function majBoucliers() {
  const b = $('boucliers');
  b.innerHTML = '';
  for (let k = 0; k < etat.boucliersMax; k++) {
    const s = document.createElement('span');
    s.innerHTML = ICONES.bouclier;
    const svg = s.firstChild;
    if (k >= etat.boucliers) svg.classList.add('perdu');
    b.appendChild(svg);
  }
  b.setAttribute('aria-label', t('jeu.boucliers', { n: etat.boucliers }));
}
function majScore() { $('txt-score').textContent = t('jeu.score', { n: etat.score }); }
function majProgresMots() {
  const p = $('progres-mots');
  p.innerHTML = '';
  etat.mots.forEach((m, k) => {
    const d = document.createElement('i');
    if (k < etat.iMot) d.className = 'fait'; else if (k === etat.iMot) d.className = 'encours';
    p.appendChild(d);
  });
}

/* Un mot : cases du modèle + étoiles dans le ciel */
function commencerMot() {
  viderCiel();
  const def = etat.def;
  const cle = etat.mots[etat.iMot];
  etat.cle = cle;
  etat.lettres = lettresDe(cle);
  etat.prochaine = 0;
  etat.erreursMot = 0;
  etat.inactif = 0;
  etat.points = [];
  majProgresMots();
  $('panneau-dessin').innerHTML = dessin(cle);

  // Cases du modèle
  const cases = $('cases');
  cases.innerHTML = '';
  cases.classList.remove('efface', 'voir');
  const largeur = Math.min(46, Math.floor(($('panneau-droite').clientWidth - 4) / etat.lettres.length) - 4);
  const police = Math.max(16, Math.min(30, largeur * 0.72));
  etat.lettres.forEach((l, k) => {
    const c = document.createElement('div');
    c.className = 'case';
    c.style.width = largeur + 'px';
    c.style.fontSize = police + 'px';
    const f = document.createElement('span');
    f.className = 'fantome';
    f.textContent = (def.memoire && k > 0) ? '' : l;
    if (def.memoire) f.dataset.cache = l;
    const p = document.createElement('span');
    p.className = 'pleine';
    c.append(f, p);
    cases.appendChild(c);
  });
  cases.setAttribute('aria-label', t('jeu.motAria', { n: etat.lettres.length }));
  if (def.efface) planifier(def.efface * 1000, () => { if (etat && etat.actif) cases.classList.add('efface'); });

  // Étoiles : les lettres du mot + les intruses
  const contenu = etat.lettres.map((l) => ({ l, intruse: false }));
  const dansMot = new Set(etat.lettres.map(sansAccent));
  const possibles = melanger(alphabet().filter((l) => !dansMot.has(sansAccent(l))));
  for (let k = 0; k < (def.intruses || 0) && k < possibles.length; k++) contenu.push({ l: possibles[k], intruse: true });
  const W = ciel.clientWidth, H = ciel.clientHeight;
  const positions = placer(contenu.length, W, H);
  contenu.forEach((c, k) => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'etoile apparait';
    el.textContent = def.min ? minuscule(c.l) : c.l;
    el.setAttribute('aria-label', t('jeu.etoileAria', { lettre: el.textContent }));
    const e = { el, l: c.l, intruse: c.intruse, x: positions[k][0], y: positions[k][1], vx: 0, vy: 0, prise: false, scint: false, allumee: true, phase: 0, avalee: 0, nuage: null };
    if (def.derive) {
      const a = Math.random() * Math.PI * 2, v = hasard(14, 26) * def.derive;
      e.vx = Math.cos(a) * v; e.vy = Math.sin(a) * v;
    }
    el.addEventListener('pointerdown', (ev) => { ev.preventDefault(); toucherEtoile(e); });
    el.addEventListener('click', (ev) => { if (ev.detail === 0) toucherEtoile(e); }); // Entrée / Espace au clavier
    ciel.appendChild(el);
    etat.etoiles.push(e);
  });
  // Scintillement : des étoiles au hasard (jamais la 1re lettre à toucher au début)
  const candidats = melanger(etat.etoiles.slice(1));
  for (let k = 0; k < (def.scint || 0) && k < candidats.length; k++) {
    candidats[k].scint = true;
    candidats[k].phase = hasard(0, 3800);
  }
  // Nuages : sur des étoiles du mot
  const sousNuage = melanger(etat.etoiles.filter((e) => !e.intruse).slice());
  for (let k = 0; k < (def.nuages || 0) && k < sousNuage.length; k++) creerNuage(sousNuage[k]);
  // Trou noir
  if (def.trou) {
    const tr = document.createElement('div');
    tr.id = 'trou';
    ciel.appendChild(tr);
    const a = Math.random() * Math.PI * 2, v = 34 * def.trou;
    etat.trou = { el: tr, x: W * 0.5, y: H * 0.5, vx: Math.cos(a) * v, vy: Math.sin(a) * v };
  }
  if (def.filantes) etat.prochaineFilante = horloge + hasard(5000, 9000);
  dessinerPositions();
  etat.actif = true;
  if (etat.i === 0 && etat.iMot === 0) lancerTutoriel();
}

// Positions au hasard, assez loin les unes des autres (repli : grille)
function placer(n, W, H) {
  const marge = 36, dist = Math.min(78, Math.sqrt((W * H) / (n * 2.2)));
  const res = [];
  for (let k = 0; k < n; k++) {
    let ok = null;
    for (let essai = 0; essai < 300 && !ok; essai++) {
      const p = [hasard(marge, W - marge), hasard(marge, H - marge - 10)];
      if (res.every((q) => Math.hypot(p[0] - q[0], p[1] - q[1]) >= dist)) ok = p;
    }
    if (!ok) {
      const col = Math.ceil(Math.sqrt(n)), lig = Math.ceil(n / col);
      ok = [marge + ((k % col) + 0.5) * (W - 2 * marge) / col, marge + (Math.floor(k / col) + 0.5) * (H - 2 * marge) / lig];
    }
    res.push(ok);
  }
  return res;
}

function creerNuage(e) {
  const n = document.createElement('button');
  n.type = 'button';
  n.className = 'nuage';
  n.innerHTML = ICONES.nuage;
  n.setAttribute('aria-label', t('jeu.nuageAria'));
  const nuage = { el: n, e };
  e.nuage = nuage;
  n.addEventListener('pointerdown', (ev) => { ev.preventDefault(); souffler(nuage); });
  n.addEventListener('click', (ev) => { if (ev.detail === 0) souffler(nuage); });
  ciel.appendChild(n);
  etat.nuages.push(nuage);
}
function souffler(nuage) {
  if (!etat || !etat.actif || enPause || !nuage.e.nuage) return;
  nuage.e.nuage = null;
  nuage.el.classList.add('souffle');
  SONS.souffle();
  etat.inactif = 0;
  planifier(650, () => nuage.el.remove());
  try { nuage.e.el.focus({ preventScroll: true }); } catch (e) { /* rien */ }
}

function dessinerPositions() {
  etat.etoiles.forEach((e) => {
    e.el.style.transform = `translate(${e.x}px, ${e.y}px)`;
    if (e.nuage) e.nuage.el.style.transform = `translate(${e.x}px, ${e.y}px)`;
  });
  if (etat.trou) etat.trou.el.style.transform = `translate(${etat.trou.x}px, ${etat.trou.y}px)`;
  majTraits();
}
function majTraits() {
  const pts = etat.points.map((e) => `${e.x.toFixed(1)},${e.y.toFixed(1)}`).join(' ');
  $('traits').querySelector('polyline').setAttribute('points', pts);
}

/* Toucher une étoile */
function toucherEtoile(e) {
  if (!etat || !etat.actif || enPause || e.prise || e.avalee) return;
  contexteAudio();
  finirTutoriel();
  etat.inactif = 0;
  if (e.nuage) { souffler(e.nuage); return; }
  if (e.scint && !e.allumee) { SONS.tic(); rejouerAnim(e.el, 'bouge'); return; }
  const attendue = etat.lettres[etat.prochaine];
  if (!e.intruse && e.l === attendue) bonneEtoile(e);
  else mauvaiseEtoile(e);
}
function rejouerAnim(el, classe) { el.classList.remove(classe); void el.offsetWidth; el.classList.add(classe); }

function bonneEtoile(e) {
  e.prise = true;
  e.scint = false;
  e.el.classList.remove('eteinte', 'indice', 'apparait');
  e.el.classList.add('prise');
  e.el.textContent = etat.def.min ? minuscule(e.l) : e.l;
  const k = etat.prochaine;
  const c = $('cases').children[k];
  c.querySelector('.pleine').textContent = e.l;
  c.classList.add('remplie');
  rejouerAnim(c, 'pop');
  etat.points.push(e);
  majTraits();
  SONS.bonne(k);
  etincelles(e.x, e.y, 8);
  gagner(10, e.x, e.y);
  etat.prochaine++;
  if (etat.prochaine >= etat.lettres.length) motTermine();
}
function mauvaiseEtoile(e) {
  etat.erreurs++;
  etat.erreursMot++;
  etat.boucliers--;
  SONS.erreur();
  rejouerAnim(e.el, 'secoue');
  rejouerAnim($('panneau'), 'tremble');
  afficherPoints('✗', e.x, e.y - 30, true);
  majBoucliers();
  if (etat.boucliers <= 0) { etat.actif = false; planifier(500, () => defaite('boucliers')); }
}
function gagner(n, x, y) {
  etat.score += n;
  majScore();
  if (x !== undefined) afficherPoints('+' + nb(n), x, y - 30);
}
function afficherPoints(texte, x, y, mal) {
  const p = document.createElement('div');
  p.className = 'points' + (mal ? ' mal' : '');
  p.textContent = texte;
  p.style.left = (x - 16) + 'px';
  p.style.top = y + 'px';
  ciel.appendChild(p);
  setTimeout(() => p.remove(), 1000);
}
function etincelles(x, y, n) {
  for (let k = 0; k < n; k++) {
    const s = document.createElement('i');
    s.className = 'etincelle';
    const a = (k / n) * Math.PI * 2, d = hasard(30, 60);
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.setProperty('--dx', Math.cos(a) * d + 'px');
    s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    ciel.appendChild(s);
    setTimeout(() => s.remove(), 750);
  }
}

/* Mot terminé : la constellation brille, le dessin apparaît */
function motTermine() {
  etat.actif = false;
  gagner(50);
  if (etat.erreursMot === 0) gagner(30);
  if (!progres.carnet.includes(etat.cle)) progres.carnet.push(etat.cle);
  SONS.mot();
  $('traits').classList.add('brille');
  $('cases').classList.add('voir');
  etat.etoiles.forEach((e) => { if (!e.prise) e.el.style.opacity = '0'; });
  etat.nuages.forEach((n) => n.el.remove());
  const g = document.createElement('div');
  g.id = 'grand-dessin';
  g.innerHTML = dessin(etat.cle);
  const b = document.createElement('b');
  b.textContent = majuscule(t('mot.' + etat.cle));
  g.appendChild(b);
  ciel.appendChild(g);
  etincelles(ciel.clientWidth / 2, ciel.clientHeight * 0.4, 16);
  if (etat.def.aube) etat.aube = Math.max(0, etat.aube - 0.12);
  etat.iMot++;
  planifier(1700, () => {
    if (etat.iMot >= etat.mots.length) victoire();
    else commencerMot();
  });
}

/* Télescope : montre le modèle 2 secondes (compte comme une aide) */
function telescope() {
  if (!etat || !etat.actif || enPause || !(etat.def.efface || etat.def.memoire)) return;
  const cases = $('cases');
  if (cases.classList.contains('voir')) return;
  contexteAudio();
  etat.aides++;
  SONS.filante();
  if (etat.def.memoire) cases.querySelectorAll('.fantome').forEach((f) => { f.textContent = f.dataset.cache; });
  cases.classList.add('voir');
  planifier(2000, () => {
    cases.classList.remove('voir');
    if (etat.def.memoire) cases.querySelectorAll('.fantome').forEach((f, k) => { if (k > 0) f.textContent = ''; });
  });
}

/* Étoile filante bonus */
function lancerFilante() {
  const W = ciel.clientWidth, H = ciel.clientHeight;
  const el = document.createElement('button');
  el.type = 'button';
  el.id = 'filante';
  el.innerHTML = ICONES.filante;
  el.setAttribute('aria-label', t('jeu.filanteAria'));
  const f = { el, x: -40, y: hasard(H * 0.1, H * 0.5), vx: W / 3.2, vy: hasard(20, 60) };
  el.addEventListener('pointerdown', (ev) => { ev.preventDefault(); attraperFilante(); });
  el.addEventListener('click', (ev) => { if (ev.detail === 0) attraperFilante(); });
  ciel.appendChild(el);
  etat.filante = f;
}
function attraperFilante() {
  const f = etat && etat.filante;
  if (!f || enPause) return;
  contexteAudio();
  SONS.filante();
  etincelles(f.x, f.y, 12);
  gagner(50, f.x, f.y);
  if (etat.boucliers < etat.boucliersMax) {
    etat.boucliers++;
    majBoucliers();
    const s = $('boucliers').children[etat.boucliers - 1];
    if (s) s.classList.add('gagne');
    planifier(300, SONS.bouclier);
  }
  f.el.remove();
  etat.filante = null;
}

/* ---------- Boucle d'animation ---------- */
let derniere = performance.now();
function boucle(maintenant) {
  const dt = Math.min(50, maintenant - derniere);
  derniere = maintenant;
  if (etat && enJeu && !enPause) {
    horloge += dt;
    const dues = taches.filter((x) => x.quand <= horloge);
    taches = taches.filter((x) => x.quand > horloge);
    dues.forEach((x) => x.f());
    if (etat) avancer(dt);
  }
  requestAnimationFrame(boucle);
}
function avancer(dt) {
  const s = dt / 1000;
  const W = ciel.clientWidth, H = ciel.clientHeight, m = 32;
  const def = etat.def;
  let bouge = false;
  etat.etoiles.forEach((e) => {
    // Dérive et rebonds
    if (def.derive && !e.avalee) {
      e.x += e.vx * s; e.y += e.vy * s;
      if (e.x < m) { e.x = m; e.vx = Math.abs(e.vx); }
      if (e.x > W - m) { e.x = W - m; e.vx = -Math.abs(e.vx); }
      if (e.y < m) { e.y = m; e.vy = Math.abs(e.vy); }
      if (e.y > H - m) { e.y = H - m; e.vy = -Math.abs(e.vy); }
      bouge = true;
    }
    // Scintillement : 2,4 s allumée, 1,5 s éteinte
    if (e.scint && !e.prise) {
      e.phase = (e.phase + dt) % 3900;
      const allumee = e.phase < 2400;
      if (allumee !== e.allumee) { e.allumee = allumee; e.el.classList.toggle('eteinte', !allumee); }
    }
    // Étoile avalée : elle revient ailleurs
    if (e.avalee) {
      e.avalee -= dt;
      if (e.avalee <= 0) {
        e.avalee = 0;
        const p = placerLoinDuTrou(W, H);
        e.x = p[0]; e.y = p[1];
        e.el.classList.remove('avalee');
        rejouerAnim(e.el, 'apparait');
        bouge = true;
      }
    }
  });
  // Ciel qui dérive : les étoiles rebondissent l'une sur l'autre (jamais empilées)
  if (def.derive) {
    const libres = etat.etoiles.filter((e) => !e.avalee);
    for (let a = 0; a < libres.length; a++) {
      for (let b = a + 1; b < libres.length; b++) {
        const p = libres[a], q = libres[b];
        const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 1;
        if (d < 66) {
          const nx = dx / d, ny = dy / d, pousse = (66 - d) / 2;
          p.x -= nx * pousse; p.y -= ny * pousse; q.x += nx * pousse; q.y += ny * pousse;
          const vp = p.vx * nx + p.vy * ny, vq = q.vx * nx + q.vy * ny;
          if (vp - vq > 0) { p.vx += (vq - vp) * nx; p.vy += (vq - vp) * ny; q.vx += (vp - vq) * nx; q.vy += (vp - vq) * ny; }
        }
      }
    }
  }
  // Trou noir
  const tr = etat.trou;
  if (tr && etat.actif) {
    tr.x += tr.vx * s; tr.y += tr.vy * s;
    if (tr.x < 40 || tr.x > W - 40) { tr.vx = -tr.vx; tr.x = Math.max(40, Math.min(W - 40, tr.x)); }
    if (tr.y < 40 || tr.y > H - 40) { tr.vy = -tr.vy; tr.y = Math.max(40, Math.min(H - 40, tr.y)); }
    etat.etoiles.forEach((e) => {
      if (!e.prise && !e.avalee && !e.nuage && Math.hypot(e.x - tr.x, e.y - tr.y) < 34) {
        e.avalee = 2000;
        e.el.classList.add('avalee');
        if (e.el.classList.contains('indice')) e.el.classList.remove('indice');
        SONS.trou();
      }
    });
    bouge = true;
  }
  if (bouge) dessinerPositions();
  // Étoile filante
  if (def.filantes && etat.actif) {
    if (!etat.filante && horloge > etat.prochaineFilante) lancerFilante();
    const f = etat.filante;
    if (f) {
      f.x += f.vx * s; f.y += f.vy * s;
      f.el.style.transform = `translate(${f.x}px, ${f.y}px) rotate(15deg)`;
      if (f.x > W + 50) { f.el.remove(); etat.filante = null; etat.prochaineFilante = horloge + hasard(8000, 14000); }
    }
    if (!etat.filante && etat.prochaineFilante < horloge) etat.prochaineFilante = horloge + hasard(8000, 14000);
  }
  // L'aube qui monte
  if (def.aube && etat.actif) {
    etat.aube += dt / etat.aubeDuree;
    const a = Math.min(1, etat.aube);
    $('lueur-aube').style.opacity = (a * 0.85).toFixed(3);
    $('soleil-aube').style.bottom = (-120 + a * 150) + 'px';
    $('jauge-aube').firstElementChild.style.width = (a * 100).toFixed(1) + '%';
    if (etat.aube >= 1) { etat.actif = false; defaite('aube'); return; }
  }
  // Aide douce (niveaux 1 à 6) : après 7 s sans rien faire, la bonne étoile grossit
  if (etat.actif && etat.i < 6 && !etat.tuto) {
    etat.inactif += dt;
    if (etat.inactif > 7000) {
      const cible = etat.etoiles.find((e) => !e.prise && !e.intruse && e.l === etat.lettres[etat.prochaine] && !e.avalee);
      if (cible && !cible.el.classList.contains('indice')) cible.el.classList.add('indice');
    }
  }
}
function placerLoinDuTrou(W, H) {
  const tr = etat.trou;
  for (let k = 0; k < 60; k++) {
    const p = [hasard(36, W - 36), hasard(36, H - 46)];
    if (!tr || Math.hypot(p[0] - tr.x, p[1] - tr.y) > 140) return p;
  }
  return [W / 2, H / 2];
}

/* ---------- Tutoriel animé du niveau 1 ---------- */
function lancerTutoriel() {
  const main = document.createElement('div');
  main.className = 'main';
  main.innerHTML = ICONES.main;
  ciel.appendChild(main);
  const bulle = document.createElement('div');
  bulle.id = 'bulle-tuto';
  bulle.textContent = t('tuto.bulle');
  ciel.appendChild(bulle);
  // Les étoiles des 2 premières lettres, dans l'ordre
  const cibles = [];
  etat.lettres.slice(0, 3).forEach((l) => {
    const e = etat.etoiles.find((x) => x.l === l && !cibles.includes(x));
    if (e) cibles.push(e);
  });
  etat.tuto = { main, bulle, cibles, k: 0 };
  const etape = () => {
    if (!etat || !etat.tuto) return;
    const tu = etat.tuto;
    const e = tu.cibles[tu.k % tu.cibles.length];
    main.style.left = e.x + 'px';
    main.style.top = e.y + 'px';
    planifier(950, () => {
      if (!etat || !etat.tuto) return;
      rejouerAnim(main, 'tape');
      e.el.classList.add('indice');
      planifier(600, () => { e.el.classList.remove('indice'); if (etat && etat.tuto) { tu.k++; etape(); } });
    });
  };
  main.style.left = (ciel.clientWidth / 2) + 'px';
  main.style.top = (ciel.clientHeight - 60) + 'px';
  planifier(300, etape);
}
function finirTutoriel() {
  if (!etat || !etat.tuto) return;
  etat.tuto.main.remove();
  etat.tuto.bulle.remove();
  etat.tuto.cibles.forEach((e) => e.el.classList.remove('indice'));
  etat.tuto = null;
}

/* ---------- Présentation d'une nouveauté (démonstration animée) ---------- */
function montrerNouveaute(cle, suite) {
  const lettres = lettresDe('lune');
  const a = lettres[0] || 'A', b = lettres[1] || 'B', c = lettres[2] || 'C';
  const intruse = alphabet().find((x) => !lettres.map(sansAccent).includes(sansAccent(x))) || 'X';
  const et = (l, x, y, cl = '') => `<span class="et ${cl}" style="left:${x}px;top:${y}px">${l}</span>`;
  const main = `<span class="main">${ICONES.main}</span>`;
  const casesD = (n, montrees) => Array.from({ length: n }, (_, k) => `<span class="case-d ${k === 0 ? 'p' : ''}" style="left:${20 + k * 32}px">${montrees ? (lettres[k] || '') : (k === 0 ? lettres[0] : '')}</span>`).join('');
  const demos = {
    constellation: `<svg class="traits-demo"><line class="l1" x1="50" y1="80" x2="110" y2="34"/><line class="l2" x1="110" y1="34" x2="170" y2="78"/></svg>${et(a, 50, 80)}${et(b, 110, 34)}${et(c, 170, 78)}${main}`,
    final: `<svg class="traits-demo"><line class="l1" x1="50" y1="80" x2="110" y2="34"/><line class="l2" x1="110" y1="34" x2="170" y2="78"/></svg>${et(a, 50, 80)}${et(b, 110, 34)}${et(c, 170, 78)}${main}`,
    intruses: `${et(a, 50, 50)}${et(b, 100, 80)}${et(intruse, 160, 50, 'x')}${main}`,
    scint: `${et(a, 118, 52)}${main}`,
    min: `<span class="case-d" style="left:58px;bottom:auto;top:40px;color:#fff">${a}</span><span class="fleche">${ICONES.fleche}</span>${et(minuscule(a), 150, 56, 'b')}`,
    derive: `${et(a, 50, 60)}${et(b, 90, 40)}`,
    nuages: `${et(a, 110, 60)}<span class="nuage">${ICONES.nuage}</span>${main}`,
    efface: `${casesD(4, true)}<span class="tele">${ICONES.telescope}</span>${main}`,
    filante: `<span class="fil">${ICONES.filante}</span><span class="bonus">${ICONES.bouclier}</span>${main}`,
    aube: `<span class="lueur"></span><span class="sol"></span>${et(a, 50, 40)}${et(b, 170, 50)}`,
    trou: `<span class="tn"></span>${et(a, 120, 60)}`,
    memoire: `<span class="dessin-d">${dessin('lune')}</span>${casesD(4, false)}`,
  };
  $('nouveau-demo').className = 'demo d-' + cle;
  $('nouveau-demo').innerHTML = demos[cle] || '';
  $('nouveau-titre').textContent = t('nouveau.' + cle + '.titre');
  $('nouveau-texte').textContent = t('nouveau.' + cle + '.texte');
  $('nouveau-zou').innerHTML = SVG('0 0 100 100', dessinZou());
  $('voile-nouveau').classList.remove('cache');
  const ok = $('btn-nouveau-ok');
  try { ok.focus({ preventScroll: true }); } catch (e) { /* rien */ }
  // Un seul gestionnaire à la fois (onclick) : la suite n'est jamais appelée deux fois.
  ok.onclick = () => {
    ok.onclick = null;
    $('voile-nouveau').classList.add('cache');
    contexteAudio();
    SONS.clic();
    suite();
  };
}

/* ---------- Pause ---------- */
function mettrePause() {
  if (!enJeu || enPause || !$('voile-fin').classList.contains('cache')) return;
  enPause = true;
  document.body.classList.add('en-pause');
  if (audio) { try { audio.suspend(); } catch (e) { /* rien */ } }
  $('pause-info').textContent = t('pause.info', { n: etat.i + 1, mot: etat.iMot + 1, total: etat.mots.length });
  $('voile-pause').classList.remove('cache');
  try { $('btn-reprendre').focus({ preventScroll: true }); } catch (e) { /* rien */ }
}
function reprendre() {
  if (!enPause) return;
  enPause = false;
  document.body.classList.remove('en-pause');
  $('voile-pause').classList.add('cache');
  derniere = performance.now();
  if (audio && sonActif) { try { audio.resume(); } catch (e) { /* rien */ } }
  SONS.clic();
}
function quitterPartie() {
  // On garde le niveau en cours pour « Continuer » plus tard.
  if (enJeu && etat) enregistrer(Math.max(etat.i + 1, progres.niveauMax));
  enJeu = false;
  enPause = false;
  document.body.classList.remove('en-pause');
  taches = [];
  fermerVoiles();
  viderCiel();
}

/* ---------- Fins de niveau ---------- */
function calculerEtoiles() {
  const fautes = etat.erreurs + etat.aides;
  return fautes <= 1 ? 3 : fautes <= 3 ? 2 : 1;
}
function victoire() {
  enJeu = false;
  etat.termine = true;
  const i = etat.i;
  // Bonus d'aube : ce qu'il restait de nuit
  if (etat.def.aube) gagner(Math.round((1 - Math.min(1, etat.aube)) * 100));
  const e = calculerEtoiles();
  const ancienRecord = progres.records[i] || 0;
  const record = etat.score > ancienRecord;
  progres.etoiles[i] = Math.max(progres.etoiles[i] || 0, e);
  if (record) progres.records[i] = etat.score;
  enregistrer(Math.max(i + 2, progres.niveauMax)); // niveau suivant (N + 1, en numéros à partir de 1)
  SONS.victoire();
  const dernier = i === NIVEAUX.length - 1;
  afficherFin({
    titre: t(dernier ? 'fin.bilanTitre' : 'fin.bravo'),
    message: dernier ? t('fin.bilanTexte', { etoiles: totalEtoiles(), total: NIVEAUX.length * 3, mots: progres.carnet.length, score: scoreTotal() }) : t('fin.victoire', { n: etat.mots.length }),
    etoiles: e,
    record: record ? t('fin.record') : t('fin.recordAncien', { n: ancienRecord }),
    boutons: dernier
      ? [['bouton.carnet', afficherCarnetDepuisFin, true], ['bouton.rejouer', () => lancerNiveau(i)], ['bouton.niveaux', afficherNiveauxDepuisFin]]
      : [['bouton.suivant', () => lancerNiveau(i + 1), true], ['bouton.rejouer', () => lancerNiveau(i)], ['bouton.niveaux', afficherNiveauxDepuisFin]],
    victoire: true,
  });
}
function defaite(raison) {
  if (!etat || etat.termine) return;
  enJeu = false;
  etat.termine = true;
  etat.actif = false;
  // La reprise reste à ce niveau.
  enregistrer(Math.max(etat.i + 1, progres.niveauMax));
  SONS.defaite();
  const i = etat.i;
  afficherFin({
    titre: t('fin.oups'),
    message: t(raison === 'aube' ? 'fin.aube' : 'fin.boucliers'),
    etoiles: 0,
    record: (progres.records[i] || 0) ? t('fin.recordAncien', { n: progres.records[i] }) : '',
    boutons: [['bouton.reessayer', () => lancerNiveau(i), true], ['bouton.niveaux', afficherNiveauxDepuisFin], ['bouton.accueil', retourAccueil]],
    victoire: false,
  });
}
function afficherNiveauxDepuisFin() { fermerVoiles(); viderCiel(); afficherNiveaux(); }
function afficherCarnetDepuisFin() { fermerVoiles(); viderCiel(); afficherCarnet(); }
function afficherFin(o) {
  $('fin-dessin').innerHTML = SVG('0 0 100 100', dessinZou());
  $('fin-titre').textContent = o.titre;
  $('fin-message').textContent = o.message;
  const zoneE = $('fin-etoiles');
  zoneE.innerHTML = [0, 1, 2].map(() => ICONES.etoileOr).join('');
  zoneE.setAttribute('aria-label', t('fin.etoilesAria', { n: o.etoiles }));
  zoneE.style.display = o.victoire ? 'flex' : 'none';
  [...zoneE.children].forEach((s, k) => {
    if (k < o.etoiles) setTimeout(() => { s.classList.add('allumee'); SONS.etoileFin(k); }, 500 + k * 380);
  });
  // Score qui défile
  const zs = $('fin-score');
  const cible = etat.score;
  const debut = performance.now();
  const defiler = (now) => {
    const p = Math.min(1, (now - debut) / 900);
    zs.textContent = t('fin.score', { n: Math.round(cible * p) });
    if (p < 1 && !$('voile-fin').classList.contains('cache')) requestAnimationFrame(defiler);
  };
  requestAnimationFrame(defiler);
  $('fin-record').textContent = o.record;
  // Mots appris dans ce niveau
  const zm = $('fin-mots');
  zm.innerHTML = '';
  etat.mots.slice(0, o.victoire ? etat.mots.length : etat.iMot).forEach((cle) => {
    const s = document.createElement('span');
    s.innerHTML = dessin(cle);
    s.appendChild(document.createTextNode(majuscule(t('mot.' + cle))));
    zm.appendChild(s);
  });
  const zb = $('fin-boutons');
  zb.innerHTML = '';
  o.boutons.forEach(([cle, f, principal]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = principal ? 'gros' : 'moyen';
    b.textContent = t(cle);
    b.addEventListener('click', () => { SONS.clic(); f(); });
    zb.appendChild(b);
  });
  $('voile-fin').classList.remove('cache');
  if (o.victoire) confettis();
  try { zb.firstChild.focus({ preventScroll: true }); } catch (e) { /* rien */ }
}
function confettis() {
  const couleurs = ['#ffd86b', '#ff9ccf', '#7ee0a1', '#9fd8ff', '#b9b2ff'];
  for (let k = 0; k < 36; k++) {
    const s = document.createElement('i');
    s.className = 'etincelle';
    s.style.position = 'fixed';
    s.style.zIndex = 30;
    s.style.background = couleurs[k % couleurs.length];
    s.style.left = (window.innerWidth / 2) + 'px';
    s.style.top = (window.innerHeight * 0.3) + 'px';
    s.style.width = s.style.height = hasard(6, 12) + 'px';
    s.style.setProperty('--dx', hasard(-220, 220) + 'px');
    s.style.setProperty('--dy', hasard(-120, 320) + 'px');
    s.style.animationDuration = hasard(0.8, 1.6) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1700);
  }
}

/* ---------- Accueil et lancement ---------- */
function retourAccueil() {
  quitterPartie();
  montrer('ecran-titre');
  if (boutonEffacer) boutonEffacer.maj();
  try { $('btn-jouer').focus({ preventScroll: true }); } catch (e) { /* rien */ }
}
function jouer() {
  contexteAudio();
  SONS.clic();
  JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => {
      chargerProgres();
      const n = Math.max(1, Math.min(NIVEAUX.length, Math.floor(Number(d.niveau) || 1)));
      progres.niveauMax = Math.max(progres.niveauMax, n);
      progres.scoreRepris = Math.max(0, Number(d.score) || 0);
      lancerNiveau(n - 1);
    },
    onNouvelle: () => lancerNiveau(0),
    onEffacer: () => {
      progres = { etoiles: [], records: [], carnet: [], niveauMax: 1 };
      if (boutonEffacer) boutonEffacer.maj();
      lancerNiveau(0);
    },
  });
}

/* Sauvegarde à la fermeture de la page, seulement pendant une partie */
JEL_SAVE.surFermeture(() => {
  if (enJeu && etat && !etat.termine) JEL_SAVE.save(JEU, donneesSauvegarde(Math.max(etat.i + 1, progres.niveauMax)));
});
// Écran caché : pause automatique
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') mettrePause(); });

/* ---------- Clavier ---------- */
document.addEventListener('keydown', (ev) => {
  const titre = !$('ecran-titre').classList.contains('cache');
  if (titre && (ev.code === 'Enter' || ev.code === 'Space') && document.activeElement === document.body) { ev.preventDefault(); jouer(); return; }
  if (!$('ecran-jeu').classList.contains('cache') && enJeu) {
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) reprendre(); else if ($('voile-nouveau').classList.contains('cache')) mettrePause();
      return;
    }
    if (enPause || !etat || !etat.actif) return;
    if (ev.code.startsWith('Arrow')) { ev.preventDefault(); deplacerFocus(ev.code); return; }
    // Lettre tapée : la prochaine étoile qui porte cette lettre
    if (ev.key && ev.key.length === 1 && /\p{L}/u.test(ev.key) && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
      ev.preventDefault();
      toucherLettre(ev.key);
    }
  }
  if (!$('ecran-niveaux').classList.contains('cache') || !$('ecran-carnet').classList.contains('cache')) {
    if (ev.code === 'Escape') { ev.preventDefault(); retourAccueil(); }
  }
});
function toucherLettre(touche) {
  const k = sansAccent(touche);
  const attendue = etat.lettres[etat.prochaine];
  const libres = etat.etoiles.filter((e) => !e.prise && !e.avalee && sansAccent(e.l) === k);
  if (!libres.length) { mauvaiseLettreClavier(); return; }
  // On préfère une étoile du mot, visible et allumée
  const bonne = libres.find((e) => !e.intruse && e.l === attendue && !e.nuage && (!e.scint || e.allumee));
  if (bonne) { toucherEtoile(bonne); return; }
  const cachee = libres.find((e) => !e.intruse && e.l === attendue);
  if (cachee) { toucherEtoile(cachee); return; } // nuage soufflé, ou étoile éteinte : rien de perdu
  toucherEtoile(libres[0]);
}
function mauvaiseLettreClavier() {
  etat.erreurs++;
  etat.erreursMot++;
  etat.boucliers--;
  SONS.erreur();
  rejouerAnim($('panneau'), 'tremble');
  majBoucliers();
  if (etat.boucliers <= 0) { etat.actif = false; planifier(500, () => defaite('boucliers')); }
}
// Flèches : passe d'une étoile (ou d'un nuage) à la plus proche dans cette direction
function deplacerFocus(code) {
  const cibles = etat.etoiles.filter((e) => !e.prise && !e.avalee).map((e) => (e.nuage ? { el: e.nuage.el, x: e.x, y: e.y } : { el: e.el, x: e.x, y: e.y }));
  if (!cibles.length) return;
  const actuelle = cibles.find((c) => c.el === document.activeElement);
  if (!actuelle) { cibles.sort((a, b) => a.y - b.y || a.x - b.x)[0].el.focus({ preventScroll: true }); return; }
  const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[code];
  let meilleure = null, score = Infinity;
  cibles.forEach((c) => {
    if (c === actuelle) return;
    const dx = c.x - actuelle.x, dy = c.y - actuelle.y;
    const avance = dx * dir[0] + dy * dir[1];
    if (avance <= 0) return;
    const cote = Math.abs(dx * dir[1]) + Math.abs(dy * dir[0]);
    const s = avance + cote * 2;
    if (s < score) { score = s; meilleure = c; }
  });
  if (meilleure) meilleure.el.focus({ preventScroll: true });
}

/* ---------- Mise en route ---------- */
let boutonEffacer = null;
function demarrer() {
  chargerProgres();
  // Fond étoilé
  const fond = $('fond');
  for (let k = 0; k < 70; k++) {
    const s = document.createElement('i');
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 100) + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    const r = hasard(1.5, 3.2);
    s.style.width = s.style.height = r + 'px';
    fond.appendChild(s);
  }
  dessinerTitre();
  document.querySelectorAll('.btn-retour').forEach((b) => { b.innerHTML = ICONES.retour; b.addEventListener('click', () => { SONS.clic(); retourAccueil(); }); });
  $('btn-pause').innerHTML = ICONES.pause;
  $('btn-telescope').innerHTML = ICONES.telescope;
  majBoutonsSon();
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-jouer').addEventListener('click', jouer);
  $('btn-niveaux').addEventListener('click', () => { contexteAudio(); SONS.clic(); afficherNiveaux(); });
  $('btn-carnet').addEventListener('click', () => { contexteAudio(); SONS.clic(); afficherCarnet(); });
  $('btn-pause').addEventListener('click', mettrePause);
  $('btn-telescope').addEventListener('click', telescope);
  $('btn-reprendre').addEventListener('click', reprendre);
  $('btn-recommencer').addEventListener('click', () => { const i = etat.i; quitterPartie(); lancerNiveau(i); });
  $('btn-pause-niveaux').addEventListener('click', () => { quitterPartie(); afficherNiveaux(); });
  $('btn-accueil').addEventListener('click', retourAccueil);
  boutonEffacer = JEL_SAVE.boutonEffacer({
    jeu: JEU,
    conteneur: $('effacer-titre'),
    apres: () => { progres = { etoiles: [], records: [], carnet: [], niveauMax: 1 }; },
  });
  // Écran redimensionné : les étoiles restent dans le ciel
  window.addEventListener('resize', () => {
    if (!etat || !enJeu) return;
    const W = ciel.clientWidth, H = ciel.clientHeight;
    etat.etoiles.forEach((e) => { e.x = Math.max(32, Math.min(W - 32, e.x)); e.y = Math.max(32, Math.min(H - 32, e.y)); });
    dessinerPositions();
  });
  requestAnimationFrame(boucle);
}
demarrer();
