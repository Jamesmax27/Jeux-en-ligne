    montrer(tuto ? 'ecran-carte' : null);
    if (tuto) montrer('ecran-carte');
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) mettrePause(); });

  // ==========================================================================
  // DESSIN DE LA PLAGE (chaque image)
  // ==========================================================================
  function dessinerPlage() {
    var ctx = ctxP, s = geo.s, mx = geo.mx, P = palette(), h = S.horloge;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var tremble = S.horloge - S.tremble < 300 ? Math.sin(S.horloge / 20) * 3 * (1 - (S.horloge - S.tremble) / 300) : 0;
    ctx.clearRect(0, 0, geo.w, geo.h);
    ctx.save(); ctx.translate(tremble, 0);
    // Bord de mer sur les côtés (vagues qui contournent)
    ctx.fillStyle = P.merClair; ctx.globalAlpha = 0.7;
    ctx.fillRect(0, 0, mx, geo.h); ctx.fillRect(geo.w - mx, 0, mx, geo.h);
    ctx.globalAlpha = 1;
    dessinerMer(ctx, 0, 0, geo.w, s * PLAGE0, P, h);
    // Cases
    for (var i = PLAGE0 * LARG; i < LARG * HAUT; i++) {
      var r = Math.floor(i / LARG), c = i % LARG, x = mx + c * s, y = r * s;
      var k = S.g[i], opts = {};
      var f = S.fantome[i];
      if (f && h >= f.jusqua) { delete S.fantome[i]; f = null; }
      var arrivee = S.eauA[i];
      var pasEncore = arrivee !== undefined && h < arrivee;
      if (f && f.k) k = f.k;
      if (k.t === 'eau' && pasEncore) opts.secheVisuel = true;
      if (k.t === 'eau' && arrivee !== undefined && h >= arrivee && h < arrivee + 250) { opts.secheVisuel = true; opts.eauPartielle = (h - arrivee) / 250; }
      if (k.t === 'donjon' && S.issue === 'defaite' && S.iNoye === i && arrivee !== undefined && h >= arrivee) { opts.noye = true; opts.eauPartielle = 0.6; }
      var sec = S.secousse[i];
      var dx = sec !== undefined && h - sec < 250 ? Math.sin((h - sec) / 25) * 3 : 0;
      ctx.save(); ctx.translate(dx, 0);
      dessinerCase(ctx, x, y, s, k, i, S.g, P, h, opts);
      ctx.restore();
    }
    // Aperçu : où ira l'eau
    if (S.apercuRes) {
      S.apercuRes.mouille.forEach(function (n, i2) {
        if (n < 0 || S.g[i2].t === 'eau') return;
        var x2 = mx + (i2 % LARG) * s, y2 = Math.floor(i2 / LARG) * s;
        ctx.fillStyle = 'rgba(110,190,255,' + (0.62 - n * 0.06) + ')'; ctx.fillRect(x2, y2, s, s);
        ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1; ctx.strokeRect(x2 + 1, y2 + 1, s - 2, s - 2);
      });
      if (S.apercuRes.noye) {
        var ci = S.apercuRes.iNoye, xx = mx + (ci % LARG) * s, yy = Math.floor(ci / LARG) * s;
        ctx.strokeStyle = 'rgba(255,60,40,' + (0.6 + Math.sin(h / 120) * 0.4) + ')'; ctx.lineWidth = 4;
        ctx.strokeRect(xx + 2, yy + 2, s - 4, s - 4);
      }
    }
    // Annonce de la prochaine vague : flèches au bord
    var vn = S.anim ? S.anim.v : S.niv.vagues[S.vagueN];
    if (vn && S.phase !== 'fin') {
      var pulse = 0.55 + Math.sin(h / 160) * 0.45;
      var type = vn.p === 3 ? 'geante' : vn.p === 2 ? 'grande' : '';
      entreesVague(vn).forEach(function (e) {
        ctx.globalAlpha = S.anim ? 1 : pulse;
        if (e.cote === 'h') {
          var ex = mx + e.c * s + s / 2;
          ctx.fillStyle = type === 'geante' ? 'rgba(139,111,224,.45)' : 'rgba(255,255,255,.35)';
          ctx.fillRect(mx + (e.c - 1) * s, s * 0.9, s * 3, s * 1.1);
          var avance = S.anim ? Math.min(1, Math.max(0, (h - (S.anim.debut - ANNONCE)) / ANNONCE)) : 0;
          fleche(ctx, ex, s * (0.15 + avance * 0.8), 0, 1, s * 0.95, type);
        } else {
          var ey = e.r * s + s / 2, gauche = e.cote === 'g';
          ctx.fillStyle = 'rgba(255,255,255,.35)';
          ctx.fillRect(gauche ? 0 : geo.w - mx, (e.r - 1) * s, mx, s * 3);
          fleche(ctx, gauche ? 1 : geo.w - 1, ey, gauche ? 1 : -1, 0, mx * 1.6, type);
        }
        ctx.globalAlpha = 1;
      });
    }
    // Choc de la vague contre les murs
    if (S.anim && !S.anim.choc && h >= S.anim.fin - 250) { S.anim.choc = true; effetsChoc(); }
    // Crabes
    S.crabes.forEach(function (cr) {
      var cx = mx + cr.c * s + s / 2, cy = cr.r * s + s / 2;
      if (cr.etat === 'creuse') {
        cx += Math.sin(h / 40) * 1.5;
        var part = cr.creuse / (cr.rapide ? 2200 : 3000);
        ctx.strokeStyle = '#ff5a3d'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(cx, cy, s * 0.42, -Math.PI / 2, -Math.PI / 2 + part * Math.PI * 2); ctx.stroke();
      }
      dessinerCrabe(ctx, cx, cy, s * 0.85, cr.rapide, h, cr.etat === 'fuite');
    });
    // Curseur du clavier
    if (S.curseurVisible && S.phase !== 'fin') {
      ctx.strokeStyle = '#ff8a3d'; ctx.lineWidth = 3; ctx.setLineDash([6, 4]); ctx.lineDashOffset = -h / 50;
      ctx.strokeRect(mx + S.curseur.c * s + 2, S.curseur.r * s + 2, s - 4, s - 4); ctx.setLineDash([]);
    }
    // Particules et textes
    S.particules.forEach(function (p) {
      var a = 1 - p.vie / p.duree;
      ctx.globalAlpha = Math.max(0, a);
      if (p.type === 'etoile') etoileForme(ctx, p.x, p.y, p.t * 1.6, p.c);
      else { ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.t, 0, Math.PI * 2); ctx.fill(); }
    });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.font = 'bold ' + Math.round(s * 0.36) + 'px system-ui, sans-serif';
    S.textes.forEach(function (t2) {
      ctx.globalAlpha = Math.max(0, 1 - t2.vie / 1000);
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(40,25,5,.7)'; ctx.strokeText(t2.texte, t2.x, t2.y - t2.vie / 30);
      ctx.fillStyle = t2.c; ctx.fillText(t2.texte, t2.x, t2.y - t2.vie / 30);
    });
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ==========================================================================
  // DÉCOR DE L'ACCUEIL (château de sable, mer animée, mouettes, crabe)
  // ==========================================================================
  function dessinerFond(t) {
    var ctx = ctxF, W = window.innerWidth, H = window.innerHeight, P = palette();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var gr = ctx.createLinearGradient(0, 0, 0, H * 0.5);
    gr.addColorStop(0, P.ciel[0]); gr.addColorStop(1, P.ciel[1]);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    if (SAUVE.plage === 2) for (var e = 0; e < 40; e++) { ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + 0.4 * Math.sin(t / 500 + e)) + ')'; ctx.fillRect(hasard(e) * W, hasard(e + 50) * H * 0.4, 2, 2); }
    // Astre
    ctx.fillStyle = P.astre; ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(W * 0.78, H * 0.2, 56, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(W * 0.78, H * 0.2, 38, 0, Math.PI * 2); ctx.fill();
    // Nuages
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    [[0.15, 0.13, 1], [0.55, 0.08, 0.8], [0.9, 0.3, 0.7]].forEach(function (n) {
      var nx = ((n[0] * W + t / 60 * n[2]) % (W + 160)) - 80, ny = n[1] * H;
      ctx.beginPath(); ctx.arc(nx, ny, 22 * n[2], 0, Math.PI * 2); ctx.arc(nx + 24 * n[2], ny - 8, 26 * n[2], 0, Math.PI * 2); ctx.arc(nx + 50 * n[2], ny, 20 * n[2], 0, Math.PI * 2); ctx.fill();
    });
    // Mer
    var merY = H * (W > H ? 0.3 : 0.42);        // écran en paysage : la mer monte pour laisser la place au château
    dessinerMer(ctx, 0, merY, W, H * 0.14, P, t);
    // Plage
    var sy = merY + H * 0.14;
    var gs = ctx.createLinearGradient(0, sy, 0, H);
    gs.addColorStop(0, P.sable); gs.addColorStop(1, P.sableFonce);
    ctx.fillStyle = gs; ctx.fillRect(0, sy, W, H - sy);
    // Vague qui monte et redescend sur le sable
    var monte = (Math.sin(t / 1400) + 1) / 2;
    ctx.fillStyle = P.eau; ctx.globalAlpha = 0.65;
    ctx.beginPath(); ctx.moveTo(0, sy);
    for (var x = 0; x <= W; x += 10) ctx.lineTo(x, sy + 10 + monte * 22 + Math.sin(x / 40 + t / 600) * 6);
    ctx.lineTo(W, sy); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    for (x = 0; x <= W; x += 14) { ctx.beginPath(); ctx.arc(x, sy + 10 + monte * 22 + Math.sin(x / 40 + t / 600) * 6, 4, 0, Math.PI * 2); ctx.fill(); }
    for (var g = 0; g < 60; g++) { ctx.fillStyle = P.grain; ctx.globalAlpha = 0.3; ctx.fillRect(hasard(g) * W, sy + 40 + hasard(g + 9) * (H - sy - 40), 3, 3); }
    ctx.globalAlpha = 1;
    // Château de sable au centre
    var base = Math.min(W * 0.8, 380), cx = W / 2;
    var s = base / 4.4;
    // Le château reste au-dessus des boutons du bas (environ 170 px)
    var cy = Math.max(sy + s * 1.8, Math.min(sy + (H - sy) * 0.46, H - 175 - s));
    var C = couleursMur(P);
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(cx, cy + s * 1.05, base * 0.55, s * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    // Muraille
    ctx.fillStyle = C.moyen; ctx.fillRect(cx - s * 1.9, cy, s * 3.8, s);
    ctx.fillStyle = C.clair; ctx.fillRect(cx - s * 1.9, cy, s * 3.8, s * 0.16);
    for (var cr = 0; cr < 9; cr++) { ctx.fillStyle = C.moyen; ctx.fillRect(cx - s * 1.9 + cr * s * 0.44, cy - s * 0.2, s * 0.26, s * 0.22); }
    ctx.fillStyle = '#6b4a22'; ctx.beginPath(); ctx.arc(cx, cy + s * 0.62, s * 0.28, Math.PI, 0); ctx.fillRect(cx - s * 0.28, cy + s * 0.62, s * 0.56, s * 0.38); ctx.fill();
    // Tours et donjon
    dessinerTour(ctx, cx - s * 2.5, cy - s * 0.55, s * 1.3, { pv: 4, coqs: 0, deco: true }, P, SAUVE.tour);
    dessinerTour(ctx, cx + s * 1.2, cy - s * 0.55, s * 1.3, { pv: 4, coqs: 0, deco: true }, P, SAUVE.tour);
    dessinerDonjon(ctx, cx - s * 0.9, cy - s * 1.7, s * 1.8, P, t, false);
    dessinerDrapeau(ctx, cx - s * 1.85, cy - s * 0.45, s * 0.8, (SAUVE.drapeau + 1) % 6, t + 300);
    dessinerDrapeau(ctx, cx + s * 1.85, cy - s * 0.45, s * 0.8, (SAUVE.drapeau + 2) % 6, t + 600);
    // Seau, pelle, coquillages, crabe
    dessinerSeau(ctx, cx - base * 0.48, cy + s * 1.5, s * 0.9, '#ff5a5a');
    ctx.strokeStyle = '#2f8fdc'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx + base * 0.42, cy + s * 0.9); ctx.lineTo(cx + base * 0.52, cy + s * 1.7); ctx.stroke();
    ctx.fillStyle = '#2f8fdc'; ctx.beginPath(); ctx.ellipse(cx + base * 0.53, cy + s * 1.8, s * 0.18, s * 0.26, -0.15, 0, Math.PI * 2); ctx.fill();
    dessinerCoquillage(ctx, cx - base * 0.2, cy + s * 1.75, s * 0.4);
    dessinerCoquillage(ctx, cx + base * 0.18, cy + s * 1.9, s * 0.34, '#fff3c4');
    var crx = cx + Math.sin(t / 1800) * base * 0.3;
    dessinerCrabe(ctx, crx, cy + s * 2.35, s * 0.75, false, t, false);
    // Mouettes
    ctx.strokeStyle = '#3b4a5a'; ctx.lineWidth = 2.5;
    [[0.2, 0.25, 0], [0.32, 0.2, 1], [0.62, 0.3, 2]].forEach(function (m) {
      var mx2 = ((m[0] * W + t / 25) % (W + 60)) - 30, my2 = m[1] * H + Math.sin(t / 700 + m[2]) * 8, ail = Math.sin(t / 150 + m[2]) * 5;
      ctx.beginPath(); ctx.moveTo(mx2 - 12, my2 - ail); ctx.quadraticCurveTo(mx2 - 5, my2 - 8, mx2, my2); ctx.quadraticCurveTo(mx2 + 5, my2 - 8, mx2 + 12, my2 - ail); ctx.stroke();
    });
  }

  function dessinerEffets(dt) {
    var ctx = ctxE, W = window.innerWidth, H = window.innerHeight;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    confettis.forEach(function (c) {
      c.x += c.vx; c.y += c.vy; c.r += c.vr;
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r);
      if (c.etoile) etoileForme(ctx, 0, 0, c.t, c.c); else { ctx.fillStyle = c.c; ctx.fillRect(-c.t / 2, -c.t / 4, c.t, c.t / 2); }
      ctx.restore();
    });
    confettis = confettis.filter(function (c) { return c.y < H + 30; });
  }

  // ==========================================================================
  // BOUCLE PRINCIPALE
  // ==========================================================================
  var dernier = performance.now();
  function boucle(maintenant) {
    var dt = Math.min(50, maintenant - dernier); dernier = maintenant;
    if (S.ecran === 'jeu') {
      if (!S.pause && $('ecran-carte').hidden) {
        S.horloge += dt;
        if (S.phase === 'maree') {
          if (S.anim) { if (S.horloge >= S.anim.fin) finirVague(); }
          else {
            S.attente -= dt;
            if (S.attente <= 0) lancerVague();
          }
          $('attente-barre').style.width = (S.anim ? 100 : Math.max(0, 100 - S.attente / S.attenteMax * 100)) + '%';
        }
        if (S.phase === 'maree' || S.phase === 'construction') majCrabes(dt);
        if (S.phase === 'fin' && S.finA && S.horloge >= S.finA) { S.finA = 0; afficherFin(); }
        S.particules.forEach(function (p) { p.vie += dt; p.x += p.vx; p.y += p.vy; p.vy += 0.12; });
        S.particules = S.particules.filter(function (p) { return p.vie < p.duree; });
        S.textes.forEach(function (t2) { t2.vie += dt; });
        S.textes = S.textes.filter(function (t2) { return t2.vie < 1000; });
      }
      dessinerPlage();
    } else dessinerFond(maintenant);
    if (tuto && !$('ecran-carte').hidden) dessinerTuto(maintenant);
    if (S.compteur) {
      var p = Math.min(1, (maintenant - S.compteur.debut) / 1200);
      $('fin-score').textContent = T('score_n', { n: Math.round(S.compteur.a * p) });
      if (p >= 1) S.compteur = null;
    }
    dessinerEffets(dt);
    requestAnimationFrame(boucle);
  }

  // ==========================================================================
  // SAUVEGARDE DE LA PROGRESSION (module commun JEL_SAVE, marche aussi sur le site)
  // niveau = marée où reprendre (1 = première), score = points des marées
  // gagnées depuis le début de la partie (ou depuis la reprise).
  // ==========================================================================
  var JEU = 'chateaux-de-sable-contre-la-maree';
  var scorePartie = 0;
  // Marée gagnée (n à partir de 0) : on reprendra à la suivante ; après la dernière, plus rien à continuer.
  function sauverVictoire(n, points) {
    scorePartie += points;
    if (n >= NIVEAUX.length - 1) JEL_SAVE.clear(JEU);
    else JEL_SAVE.save(JEU, { niveau: n + 2, score: scorePartie });
  }
  // Fermeture de la page : seulement pendant une marée (pas sur l'accueil ni le choix des niveaux).
  JEL_SAVE.surFermeture(function () {
    if (S.ecran !== 'jeu' || !S.niv) return;
    if (S.issue === 'victoire') { if (S.n < NIVEAUX.length - 1) JEL_SAVE.save(JEU, { niveau: S.n + 2, score: scorePartie }); return; }
    JEL_SAVE.save(JEU, { niveau: S.n + 1, score: scorePartie });
  });
  var effacerAccueil = JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('accueil-bas') });

  // ==========================================================================
  // ENTRÉES : doigt, souris, clavier
  // ==========================================================================
  cvPlage.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    var b = cvPlage.getBoundingClientRect();
    var px = ev.clientX - b.left, py = ev.clientY - b.top;
    var c = Math.floor((px - geo.mx) / geo.s), r = Math.floor(py / geo.s);
    S.curseurVisible = false;
    if (c >= 0 && c < LARG) S.curseur = { r: Math.max(PLAGE0, Math.min(HAUT - 1, r)), c: c };
    toucherCase(r, c, px, py);
  });

  function clic(id, f) { $(id).addEventListener('click', function () { demarrerAudio(); f(); }); }
  clic('b-jouer', function () {
    SON.bouton();
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: function (d) {
        var n = Math.max(1, Math.min(NIVEAUX.length, d.niveau)) - 1;
        SAUVE.debloque = Math.max(SAUVE.debloque, n + 1);
        scorePartie = d.score;
        commencerNiveau(n);
      },
      onNouvelle: function () { scorePartie = 0; if (SAUVE.debloque <= 1 && !SAUVE.etoiles[0]) commencerNiveau(0); else ouvrirNiveaux(); }
    });
  });
  clic('b-niveaux-accueil', function () { SON.bouton(); ouvrirNiveaux(); });
  clic('b-decors', function () { SON.bouton(); ouvrirDecors(); });
  clic('b-niveaux-retour', function () { SON.bouton(); allerAccueil(); });
  clic('b-decors-retour', function () { SON.bouton(); allerAccueil(); });
  clic('b-carte-ok', function () { SON.bouton(); fermerCarte(); });
  $('ecran-carte').addEventListener('click', function (ev) { if (ev.target === $('ecran-carte')) { demarrerAudio(); fermerCarte(); } });
  clic('b-pause', function () { SON.bouton(); mettrePause(); });
  clic('b-reprendre', function () { reprendre(); SON.bouton(); });
  clic('b-recommencer', function () { S.pause = false; if (audio) audio.resume().catch(function () {}); SON.bouton(); commencerNiveau(S.n); });
  clic('b-aide', function () { S.pause = false; if (audio) audio.resume().catch(function () {}); SON.bouton(); montrerCarteNiveau(true); });
  clic('b-pause-accueil', function () { S.pause = false; if (audio) audio.resume().catch(function () {}); SON.bouton(); allerAccueil(); });
  clic('b-lancer', lancerMaree);
  clic('b-suivante', vagueSuivante);
  clic('b-annuler', annuler);
  clic('b-apercu', basculerApercu);
  clic('b-suivant', function () { SON.bouton(); if (S.n === NIVEAUX.length - 1) afficherBilan(); else commencerNiveau(S.n + 1); });
  clic('b-reessayer', function () { SON.bouton(); commencerNiveau(S.n); });
  clic('b-rejouer', function () { SON.bouton(); commencerNiveau(S.n); });
  clic('b-fin-niveaux', function () { SON.bouton(); ouvrirNiveaux(); });
  clic('b-bilan-rejouer', function () { SON.bouton(); commencerNiveau(S.n); });
  clic('b-bilan-niveaux', function () { SON.bouton(); ouvrirNiveaux(); });
  clic('b-bilan-accueil', function () { SON.bouton(); allerAccueil(); });
  ['b-son-accueil', 'b-son-jeu', 'b-son-pause'].forEach(function (id) {
    clic(id, function () { SAUVE.son = !SAUVE.son; sauver(); majBoutonsSon(); SON.bouton(); });
  });

  document.addEventListener('keydown', function (ev) {
    demarrerAudio();
    var code = ev.code;
    if (code === 'Escape' || code === 'KeyP') {
      if (S.ecran === 'jeu') { if (S.pause) reprendre(); else if ($('ecran-carte').hidden) mettrePause(); else fermerCarte(); }
      ev.preventDefault(); return;
    }
    if (S.ecran !== 'jeu' || S.pause || !$('ecran-fin').hidden || !$('ecran-bilan').hidden) return;
    if (!$('ecran-carte').hidden) { if (code === 'Space' || code === 'Enter') { ev.preventDefault(); fermerCarte(); } return; }
    var dep = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[code];
    if (dep) {
      ev.preventDefault();
      S.curseurVisible = true;
      S.curseur.r = Math.max(PLAGE0, Math.min(HAUT - 1, S.curseur.r + dep[0]));
      S.curseur.c = Math.max(0, Math.min(LARG - 1, S.curseur.c + dep[1]));
      return;
    }
    if (code === 'Space' || code === 'Enter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && !S.curseurVisible) return;
      ev.preventDefault(); S.curseurVisible = true; toucherCase(S.curseur.r, S.curseur.c); return;
    }
    var chiffre = /^Digit([1-5])$/.exec(code) || /^Numpad([1-5])$/.exec(code);
    if (chiffre) { var o = outilsAffiches(S.n)[+chiffre[1] - 1]; if (o) { SON.bouton(); choisirOutil(o); } return; }
    // Raccourcis lettres : la lettre écrite sur la touche (AZERTY comme QWERTY)
    var lettre = (ev.key || '').toLowerCase();
    if (lettre === 'l') { if (S.phase === 'construction') lancerMaree(); else vagueSuivante(); return; }
    if (lettre === 'a' && S.phase === 'construction') { basculerApercu(); return; }
    if ((lettre === 'u' || code === 'Backspace') && S.phase === 'construction') { ev.preventDefault(); annuler(); }
  });

  // ==========================================================================
  // DÉMARRAGE
  // ==========================================================================
  Array.prototype.forEach.call(document.querySelectorAll('canvas[data-ico]'), function (cv) { dessinerIcone(cv, cv.dataset.ico); });
  // Après la traduction du HTML par le module commun (data-i18n)
  function insecablesHtml() { Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) { el.textContent = insecables(el.textContent); }); }
  document.addEventListener('DOMContentLoaded', insecablesHtml);
  setTimeout(insecablesHtml, 0);
  I18N.creerSelecteur({ conteneur: $('langue-accueil'), isole: true });
  I18N.creerSelecteur({ conteneur: $('langue-pause'), isole: true });
  majBoutonsSon();
  redimensionner();
  allerAccueil();
  requestAnimationFrame(boucle);})();
</script>
