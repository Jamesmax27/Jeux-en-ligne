    const tourDe = partie && partie.phase === 'jeu' ? R.aQui(e) : -1;

    const proche = tourDe >= 0 ? O.plusProche(e, ref) : -1;
    e.rap.forEach((rp, r) => {
      const p = posSeg(anim.ra[r], t, rp[0]);
      const pl = placeRaptor(g, p.x);

      if (yy > h + 10) { yeux(c, Math.min(w - 40, pl.x), h - 12, 5, t, p.alpha); return; }
      if (yy < -10) { yeux(c, Math.min(w - 40, pl.x), 12, 5, t, p.alpha); return; }

      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.grav === undefined ? 520 : p.grav) * dt;

  }

  // Petite carte du pont à droite : tout le monde d'un coup d'œil.
  function dessinerCarte(c, g, e, t) {
    const x = g.w - 10, y0 = g.h - 12, y1 = 12, L = e.L;
    const Yc = (k) => lerp(y0, y1, (Math.max(-1, Math.min(L + 2, k)) + 1) / (L + 3));

    c.fillStyle = '#5a7a68'; c.fillRect(x - 6, Yc(0) - 1, 12, 3); c.fillRect(x - 6, Yc(L + 1) - 1, 12, 3);
    e.rap.forEach((rp, r) => {
      const p = posSeg(anim.ra[r], t, rp[0]);
      c.fillStyle = '#e0505a'; c.beginPath(); const yy = Yc(p.x); c.moveTo(x - 7, yy); c.lineTo(x - 1, yy - 4); c.lineTo(x - 1, yy + 4); c.closePath(); c.fill();
    });
    for (let s = 0; s < e.pos.length; s++) {
      const p = posSeg(anim.ex[s], t, e.pos[s]);
      c.fillStyle = COUL[s]; rond(c, x + 3 + (s % 2) * 3, Yc(p.x) + (s - 1.5) * 1.5, 3.4); c.fill();
    }
  }

  function eclats(k, coul, n, opts) {
    if (!geo) return;
    const y = geo.Y(k), o = opts || {};
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (o.v || 160) * (0.4 + Math.random());
      particules.push({ x: (o.x !== undefined ? o.x : geo.cx + (Math.random() - 0.5) * geo.pw), y: y + (o.dy || 0), vx: Math.cos(a) * v, vy: Math.sin(a) * v - (o.monte || 120), vie: 0.6 + Math.random() * 0.6, k: o.k || (2 + Math.random() * 3), coul: Array.isArray(coul) ? coul[i % coul.length] : coul, carre: !!o.carre, grav: o.grav });
    }
  }

  // ---------------------------------------------------------------------
  //  État de l'écran
  // ---------------------------------------------------------------------

  let ecran = 'titre';
  let partie = null;          // partie JEL_MULTI en cours
  let session = null;         // 'solo' (parcours de niveaux) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let enPartie = false;       // niveau solo en cours (pour la sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché (copie de partie.etat)
  let jeton = 0;              // change à chaque partie : les minuteries d'avant s'arrêtent
  let attenteTuto = false;
  let humainsAvant = null;
  let debutTour = Date.now(), dernierTic = -1, finManche = 0;
  let expr = [];              // calcul en cours : [{ p: pierre } | { o: opération }]
  let modeCorde = false;
  let passeArme = 0;          // « Passer » touché une fois : on attend la confirmation
  let tourVu = -1;            // dernier coup pour lequel le calcul a été remis à zéro

  function plusTard(ms, fn) {
    const j = jeton;
    setTimeout(() => { if (j === jeton) fn(); }, Math.max(0, ms));
  }

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'carnets', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom === 'titre') majTitre();
    if (nom === 'jeu') { tPrec = 0; relancerBoucle(); } else relancerTitre();
  }

  // Toast (message court) et bandeau d'attente.
  let toastMinuterie = 0;
  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    el.classList.add('actif');
    clearTimeout(toastMinuterie);
    toastMinuterie = setTimeout(() => el.classList.remove('actif'), duree || 2400);
  }
  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  // Ce qui vient de se passer, en haut du pont.
  let coupMinuterie = 0;
  function montrerCoup(texte, classe) {
    const el = $('coup');
    el.textContent = texte;
    el.className = 'actif' + (classe ? ' ' + classe : '');
    clearTimeout(coupMinuterie);
    coupMinuterie = setTimeout(() => { el.className = ''; }, 2600);
  }

  // ---------------------------------------------------------------------
  //  Places : couleur, explorateur, « Toi », robot ou pseudo
  // ---------------------------------------------------------------------

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  // Nom court dans les messages : « Toi », le pseudo, ou le nom de l'explorateur.
  function nomCourt(s) {
    const info = siegesActuels()[s] || {};
    if (info.moi) return tr('place.toi');
    return info.nom || tr('explo.' + s);
  }
  function remplirTag(tag, role, nom) {
    if (tag.dataset.role === role && tag.dataset.nom === nom) return;
    tag.dataset.role = role;
    tag.dataset.nom = nom;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = nom;
    tag.appendChild(txt);
  }

  function construirePlaces() {
    const boite = $('places'), salon = $('salon-places');
    boite.textContent = ''; salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s;
      d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'tete'; cv.width = 84; cv.height = 84;
      medaillon(cv.getContext('2d'), s, 42, 42, 40);
      const cr = document.createElement('canvas'); cr.className = 'couronne'; cr.width = 52; cr.height = 40;
      couronne(cr.getContext('2d'), 26, 22, 44);
      const tag = document.createElement('span'); tag.className = 'tag';
      const pos = document.createElement('span'); pos.className = 'pos';
      const obj = document.createElement('span'); obj.className = 'objets';
      d.append(cv, cr, tag, pos, obj);
      boite.appendChild(d);
      const sp = document.createElement('div');
      sp.className = 'salon-place'; sp.id = 'salon-place-' + s;
      const scv = document.createElement('canvas'); scv.width = 112; scv.height = 112;
      const stag = document.createElement('span'); stag.className = 'tag';
      sp.append(scv, stag);
      salon.appendChild(sp);
    }
  }

  function texteObjets(e, s) {
    let h = '';
    if (e.to[s] > 0) h += '<span>' + ICONE_TORCHE + nb(e.to[s]) + '</span>';
    if (e.co[s] > 0) h += '<span>' + ICONE_CORDE + nb(e.co[s]) + '</span>';
    h += '<span>' + ICONE_GRIFFE + nb(e.gr[s]) + '</span>';
    return h;
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const p = e ? e.pos[s] : 0, L = e ? e.L : 0;
      const pos = !e ? '' : p > L ? tr('place.rive') : tr('place.pos', { n: nb(p), total: nb(L) });
      const elPos = d.querySelector('.pos');
      if (elPos.textContent !== pos) elPos.textContent = pos;
      const ob = e ? texteObjets(e, s) : '';
      const elOb = d.querySelector('.objets');
      if (elOb.dataset.h !== ob) { elOb.dataset.h = ob; elOb.innerHTML = ob; }
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria', { explo: tr('explo.' + s), role: nomPlace(info, role), pos: pos }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) return tr('tour.toi');
    return tr('tour.autre', { nom: nomCourt(s) });
  }

  function majInfos() {
    let info = '';
    const e = vue;
    const toursMax = e ? Math.round(e.tm / PLACES) : O.toursMax;
    const tourTable = e ? Math.min(toursMax, Math.floor(e.coups / PLACES) + 1) : 1;
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length, t: tourTable, max: toursMax });
    else if (partie && partie.manche > 0 && e) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche, t: tourTable, max: toursMax });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  // ---------------------------------------------------------------------
  //  Le calcul : pierres, opérations, cible
  // ---------------------------------------------------------------------

  function monTour() {
    return !!(partie && vue && !attenteTuto && !enPause && partie.phase === 'jeu' && partie.monTour());
  }
  // Cible du joueur de l'appareil, seulement quand c'est à lui.
  function cibleMoi() {
    if (!monTour()) return null;
    const moi = partie.siege;
    let c = O.cible(vue, moi, modeCorde);
    if (!c && modeCorde) { modeCorde = false; c = O.cible(vue, moi, false); }
    return c;
  }
  function exprPierres() { return expr.filter((x) => x.p !== undefined).map((x) => x.p); }
  function exprOps() { return expr.filter((x) => x.o !== undefined).map((x) => x.o); }
  function exprComplete() { const n = expr.length; return (n === 3 || n === 5) && expr[n - 1].p !== undefined; }
  function exprAction() { return { k: 'c', p: exprPierres(), o: exprOps(), s: modeCorde ? 2 : 1 }; }
  function exprJuste() {
    if (!exprComplete() || !monTour()) return false;
    try { return R.valide(vue, partie.siege, exprAction()); } catch (e) { return false; }
  }

  // Écriture d'un calcul (de gauche à droite : parenthèses quand il le faut).
  function texteCalcul(pierres, ordre, ops) {
    if (!ordre.length) return '';
    let s = nb(pierres[ordre[0]]);
    for (let k = 1; k < ordre.length; k++) {
      if (ops[k - 1] === undefined) break;
      if (k === 2 && ops[1] === 'x' && ops[0] !== 'x') s = '(' + s + ')';
      s += ' ' + SYMBOLE[ops[k - 1]] + (ordre[k] !== undefined ? ' ' + nb(pierres[ordre[k]]) : '');
    }
    return s;
  }

  function majCommandes() {
    const e = vue, boite = $('commandes');
    const mien = monTour();
    boite.classList.toggle('attente', !mien);
    const s = e && partie && partie.phase === 'jeu' ? R.aQui(e) : -1;
    // pierres : les miennes, ou celles de la place qui joue
    const pierres = document.querySelectorAll('.pierre');
    const prises = exprPierres();
    pierres.forEach((b, i) => {
      const v = e ? nb(e.pi[i]) : '';
      if (b.textContent !== v) b.textContent = v;
      b.disabled = !mien;
      b.classList.toggle('prise', mien && prises.indexOf(i) >= 0);
      b.classList.toggle('robot', !mien && s >= 0);
      if (s >= 0) b.style.setProperty('--c', COUL[s]);
      b.setAttribute('aria-label', tr('pierre.aria', { n: v }));
    });
    // cible
    const c = mien ? cibleMoi() : (e && s >= 0 ? O.cible(e, s, false) : null);
    const cb = $('cible-boite');
    cb.classList.toggle('or', !!(c && c.or));
    cb.classList.toggle('bloque', !!(mien && c && c.bloque));
    cb.classList.toggle('corde', !!(mien && modeCorde));
    const cn = c ? nb(c.v) : '';
    if ($('cible-nombre').textContent !== cn) $('cible-nombre').textContent = cn;
    // opérations permises
    const ops = c ? O.operations(e, c) : (e ? e.op : '+');
    document.querySelectorAll('.op[data-o]').forEach((b) => {
      const ok = ops.indexOf(b.dataset.o) >= 0;
      b.classList.toggle('ferme', !ok);
      b.disabled = !mien || !ok;
    });
    $('btn-efface').disabled = !mien || !expr.length;
    // calcul en cours
    const cal = $('calcul');
    let txt = '', classe = '';
    if (mien) {
      if (!expr.length) txt = '';
      else {
        txt = texteCalcul(e.pi, exprPierres(), exprOps());
        if (exprComplete()) {
          const val = O.calculer(e.pi, exprPierres(), exprOps());
          txt += ' = ' + nb(val);
          classe = exprJuste() ? 'juste' : 'faux';
        }
      }
    }
    const cle = txt + '|' + classe + '|' + (mien ? 1 : 0);
    if (cal.dataset.cle !== cle) {
      cal.dataset.cle = cle;
      cal.textContent = '';
      if (txt) cal.textContent = txt;
      else {
        const f = document.createElement('span'); f.className = 'fantome';
        f.textContent = mien ? tr('calcul.vide') : (s >= 0 && partie && partie.phase === 'jeu' ? tr('calcul.attente', { nom: nomCourt(s) }) : '');
        cal.appendChild(f);
      }
      cal.classList.toggle('juste', classe === 'juste');
      cal.classList.toggle('faux', classe === 'faux');
    }
    // aide sous la cible
    let aide = '', danger = false;
    if (mien && c) {
      if (c.bloque) { aide = tr('aide.bloque'); danger = true; }
      else if (exprComplete() && classe === 'faux' && O.calculer(e.pi, exprPierres(), exprOps()) === c.v && c.trois) aide = tr('aide.trois');
      else if (c.trois) aide = tr('aide.trou');
      else if (modeCorde) aide = tr('aide.corde');
      else if (c.or) aide = tr('aide.or');
      else if (!expr.length) aide = tr(e.op.indexOf('-') >= 0 ? 'aide.baseMoins' : 'aide.base');
    } else if (mien && !c) aide = '';
    const ai = $('cible-aide');
    if (ai.textContent !== aide) ai.textContent = aide;
    ai.classList.toggle('danger', danger);
    // actions
    const moi = partie ? partie.siege : -1;
    const bt = $('btn-torche'), bc = $('btn-corde'), bp = $('btn-passer');
    const nt = e && moi >= 0 ? e.to[moi] : 0, nc = e && moi >= 0 ? e.co[moi] : 0;
    const ht = ICONE_TORCHE + '<span>' + tr('bouton.torche', { n: nb(nt) }) + '</span>';
    if (bt.dataset.h !== ht) { bt.dataset.h = ht; bt.innerHTML = ht; }
    bt.disabled = !mien || !O.torcheUtile(e, moi);
    const hc = ICONE_CORDE + '<span>' + tr('bouton.corde', { n: nb(nc) }) + '</span>';
    if (bc.dataset.h !== hc) { bc.dataset.h = hc; bc.innerHTML = hc; }
    bc.disabled = !mien || nc <= 0 || !O.cible(e, moi, true);
    bc.classList.toggle('actif', mien && modeCorde);
    bc.setAttribute('aria-pressed', modeCorde ? 'true' : 'false');
    if (passeArme && Date.now() - passeArme > 3000) passeArme = 0;
    const hp = ICONE_PASSER + '<span>' + tr(passeArme ? 'bouton.confirmer' : 'bouton.passer') + '</span>';
    if (bp.dataset.h !== hp) { bp.dataset.h = hp; bp.innerHTML = hp; }
    bp.disabled = !mien;
    bp.classList.toggle('arme', !!passeArme);
    $('btn-valider').disabled = !exprJuste();
  }

  function remettreCalcul() { expr = []; modeCorde = false; passeArme = 0; }

  function toucherPierre(i) {
    if (!monTour()) { refuser(); return; }
    if (exprPierres().indexOf(i) >= 0) { sons.non(); return; }
    if (expr.length && expr[expr.length - 1].p !== undefined) {
      // deux pierres de suite : on remplace la dernière
      expr[expr.length - 1] = { p: i };
    } else {
      if (expr.length >= 5) return;
      expr.push({ p: i });
    }
    sons.pierre();
    passeArme = 0;
    apresSaisie();
  }
  function toucherOp(o) {
    if (!monTour()) { refuser(); return; }
    const c = cibleMoi();
    if (!c || O.operations(vue, c).indexOf(o) < 0) { sons.non(); return; }
    if (!expr.length) { sons.non(); return; }
    const der = expr[expr.length - 1];
    if (der.o !== undefined) expr[expr.length - 1] = { o: o };
    else { if (exprPierres().length >= 3) { sons.non(); return; } expr.push({ o: o }); }
    sons.op();
    apresSaisie();
  }
  function effacer() {
    if (!monTour() || !expr.length) return;
    expr.pop();
    sons.efface();
    majCommandes();
  }
  function apresSaisie() {
    majCommandes();
    if (exprComplete()) {
      if (exprJuste()) sons.juste();
      else { const cal = $('calcul'); cal.classList.remove('secoue'); void cal.offsetWidth; cal.classList.add('secoue'); }
    }
  }
  function valider() {
    if (!monTour()) { refuser(); return; }
    if (!exprJuste()) { sons.non(); return; }
    const a = exprAction();
    if (partie.jouer(a)) { sons.clic(); remettreCalcul(); majCommandes(); }
  }
  function basculerCorde() {
    if (!monTour()) { refuser(); return; }
    const moi = partie.siege;
    if (vue.co[moi] <= 0 || !O.cible(vue, moi, true)) { sons.non(); return; }
    modeCorde = !modeCorde;
    sons.op();
    majCommandes();
  }
  function brandirTorche() {
    if (!monTour()) { refuser(); return; }
    if (!O.torcheUtile(vue, partie.siege)) { sons.non(); return; }
    if (partie.jouer({ k: 't' })) { sons.clic(); passeArme = 0; majCommandes(); }
  }
  let revelation = null;      // solution qu'il y avait quand on a passé
  function passer() {
    if (!monTour()) { refuser(); return; }
    if (!passeArme) { passeArme = Date.now(); sons.non(); majCommandes(); return; }
    const moi = partie.siege;
    const sols = O.solutions(vue, moi, false).concat(O.solutions(vue, moi, true));
    revelation = sols.length ? tr('passe.solution', { calcul: texteCalcul(vue.pi, sols[0].p, sols[0].o), v: nb(O.cible(vue, moi, sols[0].s === 2).v) }) : tr('passe.aucune');
    if (partie.jouer({ k: 'p' })) { sons.passe(); remettreCalcul(); majCommandes(); }
  }
  let dernierRefus = 0;
  function refuser() {
    if (!partie || partie.phase !== 'jeu' || Date.now() - dernierRefus < 1500) return;
    dernierRefus = Date.now();
    toast(tr('tour.attends'), 1400);
    sons.non();
  }

  // ---------------------------------------------------------------------
  //  Barre de temps (en ligne, quand c'est à un vrai joueur)
  // ---------------------------------------------------------------------

  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0, majDom = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    if (t - majDom > 250) { majDom = t; majCompte(); majCommandes(); }
    rafId = requestAnimationFrame(boucle);
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majCommandes();
  }

  // ---------------------------------------------------------------------
  //  Animation d'un coup (d'après la liste ev de l'état)
  // ---------------------------------------------------------------------

  function animerCoup(ev) {
    const t0 = performance.now();
    nettoyerSegs(t0);
    const e = ev.apres, liste = e.ev || [];
    const prisDe = {};
    let tc = t0;
    const moi = partie ? partie.siege : -1;
    const qui = (s) => (s === moi ? '.toi' : '');
    liste.forEach((x) => {
      switch (x[0]) {
        case 'calcul': {
          const s = x[1];
          montrerCoup(tr(x[5] === 2 ? 'coup.saut' : 'coup.calcul', { nom: nomCourt(s), calcul: texteCalcul(x[6], x[2], x[3]), v: nb(x[4]) }), 'bien');
          break;
        }
        case 'avance': {
          const s = x[1], de = x[2], a = x[3];
          ajouterSeg(anim.ex[s], { de: de, a: a, t0: tc, d: 420, mode: a - de >= 2 ? 'saut' : 'marche' });
          if (a - de >= 2) sons.saut(); else sons.avance();
          const carte = $('place-' + s);
          carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
          tc += 380;
          break;
        }
        case 'casse': {
          const k = x[1], tombes = x[2];
          plusTard(tc - t0, () => {
            casseT[k] = performance.now();
            eclats(k, ['#6f7458', '#4a321b', '#8a8f70'], 16, { carre: true, monte: 40, k: 5 });
            sons.casse();
            montrerCoup(tombes.length ? tr('coup.tombe' + (tombes.indexOf(moi) >= 0 ? '.toi' : ''), { nom: tombes.map(nomCourt).join(', ') }) : tr('coup.casse'), tombes.length ? 'danger' : '');
          });
          tombes.forEach((s2) => ajouterSeg(anim.ex[s2], { de: k, a: 0, t0: tc, d: 1000, mode: 'chute' }));
          tc += 300;
          break;
        }
        case 'objet': {
          const s = x[1], o = x[2];
          flottants.push({ s: s, o: o, t0: tc });
          plusTard(tc - t0 + 100, () => {
            if (o === 3) sons.griffe(); else sons.objet();
            montrerCoup(tr((o === 1 ? 'coup.torcheObj' : o === 2 ? 'coup.cordeObj' : 'coup.griffe') + qui(s), { nom: nomCourt(s) }), 'bien');
          });
          tc += 200;
          break;
        }
        case 'rive': {
          const s = x[1];
          plusTard(tc - t0, () => { montrerCoup(tr('coup.rive' + qui(s), { nom: nomCourt(s) }), 'bien'); if (s === moi) confettis(); });
          break;
        }
        case 'nid': {
          const k = x[1];
          plusTard(tc - t0, () => { nidT[k] = performance.now(); sons.nid(); eclats(k, ['#e8eedb', '#c9d2b8'], 10, { x: geo ? geo.cx + geo.pw * 0.06 : 0, monte: 160, k: 3 }); montrerCoup(tr('coup.nid'), 'danger'); });
          tc += 250;
          break;
        }
        case 'pris': prisDe[x[1]] = { x: x[2], victimes: x[3] }; break;
        case 'bond': {
          const r = x[1], de = x[2], a = x[3];
          anim.ra[r] = anim.ra[r] || [];
          if (x[4] && prisDe[r]) {
            const p = prisDe[r];
            ajouterSeg(anim.ra[r], { de: de, a: p.x, t0: tc, d: 320, mode: 'bond' });
            ajouterSeg(anim.ra[r], { de: p.x, a: a, t0: tc + 750, d: 800, mode: 'retour' });
            p.victimes.forEach((s2) => ajouterSeg(anim.ex[s2], { de: p.x, a: 0, t0: tc + 300, d: 1000, mode: 'vole' }));
            plusTard(tc - t0, () => sons.rugit());
            plusTard(tc - t0 + 300, () => {
              const moiPris = p.victimes.indexOf(moi) >= 0;
              flash = moiPris ? 1 : 0.5; secousse = moiPris ? 1 : 0.5;
              sons.pris();
              eclats(p.x, ['#7a1f22', '#e0505a', '#2c4a33'], 14, { monte: 60 });
              montrerCoup(tr('coup.pris' + (moiPris ? '.toi' : ''), { nom: p.victimes.map(nomCourt).join(', ') }), 'danger');
              p.victimes.forEach((s2) => { const cte = $('place-' + s2); cte.classList.remove('aie'); void cte.offsetWidth; cte.classList.add('aie'); });
            });
            tc += 550;
          } else {
            ajouterSeg(anim.ra[r], { de: de, a: a, t0: tc, d: 260 + 70 * Math.abs(a - de), mode: 'bond' });
            plusTard(tc - t0, () => sons.rugit());
            tc += 250;
          }
          break;
        }
        case 'passe': {
          const s = x[1];
          montrerCoup(tr('coup.passe' + qui(s), { nom: nomCourt(s) }), '');
          break;
        }
        case 'torche': {
          const s = x[1], r = x[2], de = x[3], a = x[4];
          anim.ra[r] = anim.ra[r] || [];
          ajouterSeg(anim.ra[r], { de: de, a: a, t0: tc + 150, d: 800, mode: 'retour' });
          plusTard(tc - t0, () => {
            sons.torche();
            montrerCoup(tr('coup.torche' + qui(s), { nom: nomCourt(s) }), 'bien');
            if (geo && vue) eclats(Math.max(0, Math.min(vue.L + 1, vue.pos[s])), ['#ffb02e', '#ffe07a', '#ff7a1a'], 22, { x: geo.cx - geo.pw * 0.3, monte: 200, grav: -80, k: 4 });
          });
          tc += 300;
          break;
        }
        case 'hurle': {
          plusTard(tc - t0, () => { hurleT = performance.now(); sons.hurle(); montrerCoup(tr('coup.hurle'), 'danger'); });
          tc += 350;
          break;
        }
        default: break;
      }
    });
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function nouvelleVue() {
    vue = partie && partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    anim.ex = [[], [], [], []]; anim.ra = [];
    particules.length = 0; flottants.length = 0; nidT = {}; casseT = {};
    remettreCalcul();
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    nouvelleVue();
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;           // heure du lancement automatique (ms)
  let resultatSalon = null;   // classement de la manche qui vient de finir
  let finEnAttente = false;   // fin de manche signalée, résultat pas encore montré
  let lancement = false;      // le chef a demandé le lancement

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;            // le résultat de la manche ouvrira le salon
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44);
        if (info.chef) couronne(c, 56, 22, 28);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place', { explo: tr('explo.' + s), role: nom }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomChef ? nomChef + ' · ' + tr('explo.' + partie.chef) : tr('explo.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    nouvelleVue();
    cam = -0.4;
    debutTour = Date.now();
    dernierTic = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    tourVu = -1;
  }

  function surAction(ev) {
    vue = JSON.parse(JSON.stringify(ev.apres));
    debutTour = Date.now();
    dernierTic = -1;
    animerCoup(ev);
    if (ev.moi) remettreCalcul();
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    // la solution qu'il y avait, après avoir passé
    if (ev.moi && revelation && ev.action && ev.action.k === 'p') { const r = revelation; plusTard(900, () => toast(r, 3200)); }
    if (ev.moi) revelation = null;
    if (partie.phase === 'jeu' && R.aQui(vue) === partie.siege && vue.coups !== tourVu) {
      tourVu = vue.coups;
      remettreCalcul();
      if (!ev.moi) sons.tour();
    }
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1500);
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, res = R.fin(e);
    const gagne = moi >= 0 && !!res && res.classement[0] === moi;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    ordre.forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64; medaillon(cv.getContext('2d'), s, 32, 32, 30);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('explo.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = (e.pos[s] > e.L ? tr('fin.rive') : tr('place.pos', { n: nb(e.pos[s]), total: nb(e.L) })) + ' · ' + tr('fin.griffesCourt', { n: e.gr[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels(), res = R.fin(e);
    const gagne = moi >= 0 && !!res && res.classement[0] === moi;
    const traverse = moi >= 0 && e.pos[moi] > e.L;
    const quelquUn = O.arrive(e) >= 0;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    if (session === 'solo') {
      const i = niveau - 1, par = NIVEAUX[i].par, tours = e.nt[moi] || 0;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = !gagne ? 0 : traverse ? (tours <= par ? 3 : 2) : 1;
      const avantCarnets = carnetsOuverts();
      if (e.gr[moi] > prog.griffes[i]) prog.griffes[i] = e.gr[moi];
      const nouveauCarnet = carnetsOuverts() > avantCarnets;
      const record = traverse && (prog.records[i] === 0 || tours < prog.records[i]);
      if (record) prog.records[i] = tours;
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), e.pos[moi]);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else {
        sauver(niveau, e.pos[moi]);
      }
      $('fin-titre').textContent = gagne ? tr(traverse ? 'fin.traverse' : 'fin.nuit') : tr(quelquUn ? 'fin.devance' : 'fin.perduNuit');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-bilan').textContent = tr('fin.bilan', { tours: tours, par: par }) + ' ' + tr('fin.griffes', { n: e.gr[moi] });
      $('fin-record').textContent = record ? tr('fin.nouveauRecord', { n: tours }) : (prog.records[i] ? tr('fin.record', { n: prog.records[i] }) : '');
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      $('fin-carnet').textContent = nouveauCarnet ? tr('fin.carnet') : '';
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      if (nouveauCarnet) boutons.appendChild(bouton('bouton.carnets', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirCarnets(); }));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-bilan').textContent = moi >= 0 ? tr('fin.griffes', { n: e.gr[moi] }) : '';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      $('fin-carnet').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (en ligne repassée en solo) et salon.
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Confettis de victoire (éclats de couleur des chapeaux).
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux, carnets
  // ---------------------------------------------------------------------

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    revelation = null;
    remettreCalcul();
    bandeau('');
    fermerVoile('voile-pause');
    fermerVoile('voile-fin');
    fermerVoile('voile-tuto');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  // Aperçu du pont d'un niveau (pendant le tutoriel, avant la première manche).
  function apercu(n) {
    return R.depart(graineHasard(n * 31), PLACES, { niveau: n });
  }

  // Parcours solo : niveau n contre 3 robots (force croissante, donnée par le terrain).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = apercu(niveau);
    anim.ex = [[], [], [], []]; anim.ra = [];
    particules.length = 0; flottants.length = 0; nidT = {}; casseT = {};
    cam = -0.4;
    remettreCalcul();
    afficherEcran('jeu');
    const cle = NIVEAUX[niveau - 1].tuto;
    const aMontrer = (cle ? (cle === 'base' ? ['base', 'passe'] : [cle]) : []).filter((x) => prog.tutos.indexOf(x) < 0);
    if (aMontrer.length) {
      attenteTuto = true;
      const suite = () => {
        const x = aMontrer.shift();
        if (!x) { attenteTuto = false; lancerNiveau(); return; }
        montrerTuto(x, () => { if (prog.tutos.indexOf(x) < 0) prog.tutos.push(x); suite(); });
      };
      suite();
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : salon, puis manches ; robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    cam = -0.4;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const grille = $('grille-niveaux');
    grille.textContent = '';
    NIVEAUX.forEach((_, i) => {
      const n = i + 1, ouvert = n <= prog.debloque;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
      b.append(num, et);
      if (ouvert && prog.griffes[i] > 0) { const g = document.createElement('span'); g.className = 'gr'; g.innerHTML = ICONE_GRIFFE; g.appendChild(document.createTextNode(nb(prog.griffes[i]))); b.appendChild(g); }
      b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
      else b.disabled = true;
      grille.appendChild(b);
    });
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
  }

  function ouvrirCarnets() {
    const liste = $('liste-carnets'), total = totalGriffes();
    liste.textContent = '';
    const nouveaux = carnetsOuverts() > prog.carnetsVus;
    CARNETS.forEach((seuil, i) => {
      const ouvert = total >= seuil;
      const d = document.createElement('div');
      d.className = 'carnet' + (ouvert ? '' : ' ferme') + (ouvert && nouveaux && i >= prog.carnetsVus ? ' nouveau' : '');
      const ic = document.createElement('div'); ic.innerHTML = ouvert ? ICONE_CARNET : ICONE_CADENAS;
      const txt = document.createElement('div');
      const h = document.createElement('h3'); h.textContent = ouvert ? tr('carnet.' + (i + 1) + '.titre') : tr('carnet.ferme', { n: i + 1 });
      const p = document.createElement('p'); p.textContent = ouvert ? tr('carnet.' + (i + 1) + '.texte') : tr('carnet.manque', { n: seuil - total });
      txt.append(h, p);
      d.append(ic.firstChild, txt);
      liste.appendChild(d);
    });
    $('car-total').textContent = tr('carnets.total', { n: total });
    if (nouveaux) { prog.carnetsVus = carnetsOuverts(); try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { carnetsVus: prog.carnetsVus }); } catch (e) { /* rien */ } }
    afficherEcran('carnets');
  }

  function majTitre() {
    const n = totalEtoiles(), g = totalGriffes();
    $('total-titre').textContent = n || g ? tr('titre.total', { n: n, max: NIVEAUX.length * 3, g: g }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés (3 étapes au plus, passés d'un toucher)
  // ---------------------------------------------------------------------

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const j = ++tutoAnim;
    let debut = 0, idAnim = 0;
    const dessin = d.type === 'calcul' ? demoCalcul(d) : demoPont(d);
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 360);
      dessin(c, t - debut, t);
      idAnim = requestAnimationFrame(image);
    }
    idAnim = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(idAnim);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // Démonstration du calcul : la main touche les pierres et les signes.
  function demoCalcul(d) {
    const PAS = 850, n = d.suite.length, cycle = n * PAS + 2200;
    const posPierre = (i) => [170 + i * 110, 300];
    const posOp = (o) => [o === '+' ? 205 : o === '-' ? 280 : 355, 222];
    return (c, tl, t) => {
      const k = tl % cycle;
      const fait = Math.min(n, Math.floor(k / PAS));
      // planche visée
      const g = c.createLinearGradient(130, 40, 430, 90);
      if (d.or) { g.addColorStop(0, '#b8862a'); g.addColorStop(0.5, '#ffd86a'); g.addColorStop(1, '#a8761c'); } else { g.addColorStop(0, '#8a5e36'); g.addColorStop(1, '#7a5230'); }
      const juste = fait >= n;
      c.fillStyle = g; rr(c, 150, 46, 300, 44, 6); c.fill();
      c.strokeStyle = juste ? '#8fe08a' : '#ffe2b0'; c.lineWidth = 3 + (juste ? 2 : 0); c.stroke();
      c.fillStyle = d.or ? '#ffd34a' : '#d9cdb0'; rond(c, 112, 68, 26); c.fill(); c.strokeStyle = '#2a1d10'; c.lineWidth = 2; c.stroke();
      c.fillStyle = '#1c1408'; c.font = '900 26px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(nb(d.cible), 112, 69);
      if (d.or) dessinGriffe(c, 400, 68, 26, true);
      // explorateur qui saute sur la planche quand le calcul est juste
      const ks = juste ? Math.min(1, (k - n * PAS) / 600) : 0;
      tete(c, 0, lerp(480, 300, ks), lerp(150, 52, ks) - Math.sin(Math.PI * ks) * 40, 22);
      // le calcul en cours
      const ordre = [], ops = [];
      for (let i = 0; i < fait; i++) { const x = d.suite[i]; if (typeof x === 'number') ordre.push(x); else ops.push(x); }
      let txt = ordre.length ? texteCalcul(d.pierres, ordre, ops) : '';
      if (juste) txt += ' = ' + nb(d.cible);
      c.fillStyle = juste ? '#b8ffcb' : '#e9efe6'; c.font = '900 34px system-ui, sans-serif';
      c.fillText(txt, 280, 152);
      // signes
      ['+', '-', 'x'].forEach((o) => {
        const p = posOp(o), permis = o === '+' || (o === '-' && (d.suite.indexOf('-') >= 0)) || (o === 'x' && d.or);
        c.globalAlpha = permis ? 1 : 0.3;
        c.fillStyle = '#22363a'; rond(c, p[0], p[1], 24); c.fill(); c.strokeStyle = '#4f7068'; c.lineWidth = 2; c.stroke();
        c.fillStyle = '#eef4ec'; c.font = '900 28px system-ui, sans-serif'; c.fillText(SYMBOLE[o], p[0], p[1] + 1);
        c.globalAlpha = 1;
      });
      // pierres
      d.pierres.forEach((v, i) => {
        const p = posPierre(i), prise = ordre.indexOf(i) >= 0;
        c.globalAlpha = prise ? 0.4 : 1;
        const gp = c.createRadialGradient(p[0] - 10, p[1] - 10, 4, p[0], p[1], 34);
        gp.addColorStop(0, '#e9e2d0'); gp.addColorStop(1, '#6f6656');
        c.fillStyle = gp; ell(c, p[0], p[1], 40, 30); c.fill(); c.strokeStyle = '#3d372d'; c.lineWidth = 2; c.stroke();
        c.fillStyle = '#1c1408'; c.font = '900 32px system-ui, sans-serif'; c.fillText(nb(v), p[0], p[1] + 1);
        c.globalAlpha = 1;
      });
      // la main
      if (fait < n) {
        const x = d.suite[fait], cibleM = typeof x === 'number' ? posPierre(x) : posOp(x);
        const dans = k - fait * PAS;
        const de = fait === 0 ? [520, 350] : (typeof d.suite[fait - 1] === 'number' ? posPierre(d.suite[fait - 1]) : posOp(d.suite[fait - 1]));
        const q = doux(Math.min(1, dans / 500));
        main(c, lerp(de[0], cibleM[0], q) + 6, lerp(de[1], cibleM[1], q) + 8, 1.3, dans > 520 && dans < 760 ? 1 : 0);
      }
    };
  }

  // Démonstration sur le pont, vu de côté : positions -2 à 8 (0 et 6 : les bords).
  function demoPont(d) {
    const X = (k) => 100 + k * 62, YP = 236;
    const segEx = d.ex.map(() => []), segRa = d.ra.map(() => []);
    const pe = d.ex.slice(), pr = d.ra.slice();
    let fin = 0;
    d.etapes.forEach((st) => {
      const [t0, op, a, b, c2] = st;
      fin = Math.max(fin, t0);
      if (op === 'ex') { segEx[a].push({ de: pe[a], a: b, t0: t0, d: 450, mode: c2 ? 'saut' : 'marche' }); pe[a] = b; }
      if (op === 'ra') { segRa[a].push({ de: pr[a], a: b, t0: t0, d: 350, mode: 'bond' }); pr[a] = b; }
      if (op === 'retour') { segRa[a].push({ de: pr[a], a: b, t0: t0, d: 700, mode: 'retour' }); pr[a] = b; }
      if (op === 'pris') { segEx[a].push({ de: pe[a], a: 0, t0: t0, d: 900, mode: 'vole' }); pe[a] = 0; }
    });
    const cycle = fin + 2000;
    const quand = (op, a) => { const st = d.etapes.find((s) => s[1] === op && (a === undefined || s[2] === a)); return st ? st[0] : Infinity; };
    return (c, tl, t) => {
      const k = tl % cycle;
      // ciel et ravin
      const gf = c.createLinearGradient(0, 0, 0, 360);
      gf.addColorStop(0, '#13282b'); gf.addColorStop(1, '#060c0d');
      c.fillStyle = gf; c.fillRect(0, 0, 560, 360);
      const kl = k - quand('lune');
      c.fillStyle = '#efe7cc'; rond(c, 500, 50, 24); c.fill();
      if (kl >= 0 && kl < 1400) { c.fillStyle = 'rgba(160,20,30,' + (0.35 * Math.sin(Math.PI * kl / 1400)) + ')'; c.fillRect(0, 0, 560, 360); }
      // bords
      c.fillStyle = '#33463c'; c.fillRect(0, YP - 6, X(0) + 22, 140); c.fillRect(X(6) - 22, YP - 6, 200, 140);
      c.strokeStyle = '#7a5530'; c.lineWidth = 3; c.beginPath(); c.moveTo(X(0), YP - 30); c.quadraticCurveTo(X(3), YP - 14, X(6), YP - 30); c.stroke();
      // planches
      for (let p = 1; p <= 5; p++) {
        const ty = d.planches.charAt(p - 1), cassee = ty === 'p' && k >= quand('casse', p);
        if (cassee) { c.fillStyle = '#5a3b20'; c.save(); c.translate(X(p) - 24, YP); c.rotate(1.2); c.fillRect(0, 0, 18, 8); c.restore(); continue; }
        c.fillStyle = ty === 'p' ? '#6f7458' : '#8a5e36'; rr(c, X(p) - 27, YP - 7, 54, 14, 3); c.fill();
        c.strokeStyle = '#3a2a14'; c.lineWidth = 1.5; c.stroke();
        if (ty === 'p') { c.strokeStyle = '#23251a'; c.beginPath(); c.moveTo(X(p) - 6, YP - 7); c.lineTo(X(p), YP + 7); c.stroke(); }
        if (ty === 'd') dessinNid(c, X(p) + 8, YP - 8, 44, k >= quand('oeufs', p));
      }
      (d.obj || []).forEach((o) => { if (k < quand('objet', o[0])) dessinCorde(c, X(o[0]) + 10, YP - 14, 30); });
      // raptors
      d.ra.forEach((r0, r) => {
        const pos = posSeg(segRa[r], k, r0);
        const xe = posSeg(segEx[0], k, d.ex[0]).x;
        raptor(c, X(pos.x), YP - 7 - pos.haut * 30, 74, xe >= pos.x ? 1 : -1, t + r * 400, pos.alpha, pos.haut > 0.05);
      });
      // explorateurs
      d.ex.forEach((x0, i) => {
        const p = posSeg(segEx[i], k, x0);
        c.save(); c.globalAlpha = p.alpha;
        tete(c, i, X(p.x) - 8 + i * 6, YP - 34 - p.haut * 40, 20);
        c.restore();
        const croix = d.etapes.some((s) => s[1] === 'croix' && s[2] === i && k >= s[0] && k < s[0] + 600);
        if (croix) {
          c.strokeStyle = '#ff5060'; c.lineWidth = 6; c.lineCap = 'round';
          const cx = X(p.x) - 8 + i * 6, cy = YP - 80;
          c.beginPath(); c.moveTo(cx - 12, cy - 12); c.lineTo(cx + 12, cy + 12); c.moveTo(cx + 12, cy - 12); c.lineTo(cx - 12, cy + 12); c.stroke();
        }
        const kf = k - quand('flamme', i);
        if (kf >= 0 && kf < 900) {
          const f = 1 + kf / 300;
          c.fillStyle = 'rgba(255,140,30,' + (1 - kf / 900) + ')'; ell(c, X(p.x) + 20, YP - 50, 18 * f, 26 * f); c.fill();
          c.fillStyle = 'rgba(255,230,120,' + (1 - kf / 900) + ')'; ell(c, X(p.x) + 20, YP - 46, 9 * f, 14 * f); c.fill();
        }
      });
      // la main qui touche
      d.etapes.filter((s) => s[1] === 'main').forEach((s) => {
        const dans = k - (s[0] - 600);
        if (dans < 0 || dans > 900) return;
        const q = doux(Math.min(1, dans / 400));
        main(c, lerp(520, X(s[2]), q), lerp(350, YP + 12, q), 1.2, dans > 450 && dans < 700 ? 1 : 0);
      });
    };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  document.querySelectorAll('.pierre').forEach((b) => b.addEventListener('click', () => { audio(); toucherPierre(Number(b.dataset.p)); }));
  document.querySelectorAll('.op[data-o]').forEach((b) => b.addEventListener('click', () => { audio(); toucherOp(b.dataset.o); }));
  $('btn-efface').addEventListener('click', () => { audio(); effacer(); });
  $('btn-valider').addEventListener('click', () => { audio(); valider(); });
  $('btn-passer').addEventListener('click', () => { audio(); passer(); });
  $('btn-corde').addEventListener('click', () => { audio(); basculerCorde(); });
  $('btn-torche').addEventListener('click', () => { audio(); brandirTorche(); });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const chiffres = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 };
    if (chiffres[ev.code] !== undefined) { ev.preventDefault(); audio(); toucherPierre(chiffres[ev.code]); return; }
    if (ev.key === '+' || ev.code === 'NumpadAdd') { ev.preventDefault(); audio(); toucherOp('+'); return; }
    if (ev.key === '-' || ev.code === 'NumpadSubtract' || ev.code === 'Minus') { ev.preventDefault(); audio(); toucherOp('-'); return; }
    if (ev.key === '*' || ev.code === 'NumpadMultiply' || ev.code === 'KeyX') { ev.preventDefault(); audio(); toucherOp('x'); return; }
    if (ev.code === 'Backspace' || ev.code === 'Delete') { ev.preventDefault(); audio(); effacer(); return; }
    if (ev.code === 'KeyT') { ev.preventDefault(); audio(); brandirTorche(); return; }
    if (ev.code === 'KeyC') { ev.preventDefault(); audio(); basculerCorde(); return; }
    if (ev.code === 'KeyN') { ev.preventDefault(); audio(); passer(); return; }
    if (ev.code === 'Enter' || ev.code === 'NumpadEnter' || ev.code === 'Space') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio(); valider();
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-carnets').addEventListener('click', () => { audio(); sons.clic(); ouvrirCarnets(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('car-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.pos[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(performance.now()); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  dessinerTitre(0);
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
