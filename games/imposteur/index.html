    var d = {};
    try { d = window.JEL_SAVE ? window.JEL_SAVE.load(JEU) : {}; } catch (e) { d = {}; }
    memo.etoiles = Array.isArray(d.etoiles) ? d.etoiles.slice(0, NIVEAUX.length).map(function (x) { return Math.max(0, Math.min(3, x | 0)); }) : [];
    memo.records = Array.isArray(d.records) ? d.records.slice(0, NIVEAUX.length).map(function (x) { return Math.max(0, x | 0); }) : [];
    memo.vus = (d.vus && typeof d.vus === 'object') ? d.vus : {};
    memo.niveau = Math.max(1, Math.min(NIVEAUX.length, (d.niveau | 0) || 1));
    while (memo.etoiles.length < NIVEAUX.length) memo.etoiles.push(0);
    while (memo.records.length < NIVEAUX.length) memo.records.push(0);
    var m = d.options && typeof d.options.muet === 'boolean' ? d.options.muet : null;
    if (m === null) { try { m = localStorage.getItem('imposteur-muet') === '1'; } catch (e) { m = false; } }
    muet = !!m;
    return d;
  }
  function existeSauvegarde() { try { return !!(window.JEL_SAVE && window.JEL_SAVE.existe(JEU)); } catch (e) { return false; } }
  function sauver(niveau) {
    try {
      if (!window.JEL_SAVE) return;
      window.JEL_SAVE.save(JEU, {
        niveau: Math.max(1, Math.min(NIVEAUX.length, niveau)),
        score: totalRecords(),
        etoiles: memo.etoiles.slice(), records: memo.records.slice(), vus: memo.vus,
        options: { muet: muet }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }
  function totalEtoiles() { return memo.etoiles.reduce(function (a, b) { return a + b; }, 0); }
  function totalRecords() { return memo.records.reduce(function (a, b) { return a + b; }, 0); }
  function niveauMaxOuvert() {
    var m = memo.niveau || 1;
    for (var i = 0; i < NIVEAUX.length; i++) if (memo.etoiles[i] > 0) m = Math.max(m, i + 2);
    return Math.min(NIVEAUX.length, m);
  }
  function basculerSon() {
    muet = !muet;
    try { localStorage.setItem('imposteur-muet', muet ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    if (existeSauvegarde()) { try { window.JEL_SAVE.save(JEU, { options: { muet: muet } }); } catch (e) { /* rien */ } }
    majBoutonsSon();
    if (!muet) son('toucher');
  }

  // ---------------------------------------------------------------------
  // Écrans
  // ---------------------------------------------------------------------
  function montrerEcran(id) {
    document.querySelectorAll('.ecran').forEach(function (e) { e.classList.toggle('actif', e.id === id); });
  }
  function ouvrir(id, oui) { $(id).classList.toggle('ouvert', !!oui); }

  function allerAccueil() {
    annulerTout(); enPartie = false; enPause = false; document.body.classList.remove('en-pause');
    ouvrir('pause', false); ouvrir('fin', false); ouvrir('tuto', false);
    montrerEcran('ecran-titre');
    majEffacer();
    setTimeout(function () { $('btn-jouer').focus(); }, 30);
  }
  function majEffacer() {
    var zone = $('effacer-zone'); zone.innerHTML = '';
    try { if (window.JEL_SAVE && window.JEL_SAVE.boutonEffacer) window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: zone, apres: function () { chargerMemo(); } }); } catch (e) { /* rien */ }
  }

  function afficherNiveaux() {
    annulerTout(); enPartie = false; enPause = false; document.body.classList.remove('en-pause');
    ouvrir('pause', false); ouvrir('fin', false); ouvrir('tuto', false);
    montrerEcran('ecran-niveaux');
    $('total-etoiles').textContent = T('niveaux.total', { e: totalEtoiles(), max: NIVEAUX.length * 3 });
    var g = $('grille'); g.innerHTML = '';
    var max = niveauMaxOuvert();
    NIVEAUX.forEach(function (n, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'case';
      var ouvert = i < max;
      if (!ouvert) {
        b.classList.add('ferme'); b.disabled = true;
        b.setAttribute('aria-label', T('niveaux.ferme', { n: i + 1 }));
        b.innerHTML = '<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="#a8916f"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#a8916f" stroke-width="2.5" fill="none"/></svg>';
      } else {
        if (n.nouveau) b.classList.add('nouveau-niv');
        b.setAttribute('aria-label', T('niveaux.case', { n: i + 1, e: memo.etoiles[i] }));
        var num = document.createElement('span'); num.textContent = String(i + 1);
        var mini = document.createElement('span'); mini.className = 'mini';
        mini.innerHTML = [0, 1, 2].map(function (k) { return svgEtoile(k < memo.etoiles[i]); }).join('');
        b.appendChild(num); b.appendChild(mini);
        b.addEventListener('click', function () { son('toucher'); demarrerNiveau(i); });
      }
      g.appendChild(b);
    });
    var premier = g.querySelector('.case:not(.ferme)');
    if (premier) setTimeout(function () { premier.focus(); }, 30);
  }

  // ---------------------------------------------------------------------
  // Partie
  // ---------------------------------------------------------------------
  var enPartie = false;
  var etat = null; // état du niveau en cours
  var sieges = []; // éléments des Pompons à la table
  var mode = 'attente';

  function demarrerNiveau(idx) {
    annulerTout();
    ouvrir('fin', false); ouvrir('pause', false); ouvrir('tuto', false);
    enPause = false; document.body.classList.remove('en-pause');
    var cfg = NIVEAUX[idx];
    etat = { idx: idx, cfg: cfg, coeurs: COEURS, loupes: cfg.loupe ? LOUPES : 0, loupesUtilisees: 0, erreurs: 0, score: 0, reussies: 0, manche: 0, themes: [] };
    // Manche où le joueur est l'imposteur, en grande finale
    etat.roleFinale = cfg.finale ? 1 + hasard(cfg.m - 1) : -1;
    enPartie = true;
    montrerEcran('ecran-jeu');
    $('lbl-niveau').textContent = T('jeu.niveau', { n: idx + 1 });
    majCoeurs(); majLoupe();
    construireTable(cfg.p);
    $('bandeau').className = ''; $('bandeau').textContent = '';
    consigne('', '');
    $('choix').innerHTML = '';
    $('btn-continuer').classList.add('cache');
    deroulerNiveau(jeton);
  }

  async function deroulerNiveau(j) {
    var cfg = etat.cfg;
    // Tutoriel du début et fiches des nouveautés
    if (cfg.tuto) await tutoriel('base');
    if (j !== jeton) return;
    if (cfg.nouveau && !memo.vus[cfg.nouveau]) {
      await tutoriel(cfg.nouveau);
      memo.vus[cfg.nouveau] = 1;
    }
    if (j !== jeton) return;
    for (var k = 0; k < cfg.m; k++) {
      etat.manche = k;
      var ok = await jouerManche(k, j);
      if (j !== jeton) return;
      if (!ok && etat.coeurs <= 0) { defaite(); return; }
    }
    victoire();
  }

  function majCoeurs() {
    var c = $('coeurs'); c.innerHTML = '';
    for (var i = 0; i < COEURS; i++) {
      var s = document.createElement('span'); s.innerHTML = svgCoeur();
      if (i >= etat.coeurs) s.firstChild.classList.add('perdu');
      c.appendChild(s.firstChild);
    }
    c.setAttribute('role', 'img');
    c.setAttribute('aria-label', T('jeu.coeurs', { n: etat.coeurs }));
  }
  function majLoupe() {
    var b = $('btn-loupe');
    b.classList.toggle('cache', !etat || !etat.cfg.loupe || !!(etat.o && etat.o.role));
    if (etat) {
      b.innerHTML = SVG_LOUPE;
      b.appendChild(document.createTextNode(T('jeu.loupe', { n: etat.loupes })));
      b.disabled = etat.loupes <= 0 || mode !== 'accuse';
    }
  }
  function consigne(texte, classe) { var c = $('consigne'); c.textContent = texte; c.className = classe || ''; }

  // Places autour de la table (en %), de gauche à droite
  function places(n) {
    var res = [], debut = 165, pas = 210 / n;
    for (var i = 0; i < n; i++) {
      var a = (debut + pas * (i + 0.5)) * Math.PI / 180;
      res.push({ x: 50 + 39 * Math.cos(a), y: 49 + 34 * Math.sin(a) });
    }
    return res;
  }

  function construireTable(n) {
    var table = $('table');
    sieges.forEach(function (s) { s.el.remove(); });
    sieges = [];
    var pos = places(n);
    for (var i = 0; i < n; i++) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'siege';
      b.disabled = true;
      b.innerHTML = '<span class="pompon">' + svgPompon(i) + '</span><span class="paire"></span>';
      b.setAttribute('aria-label', T('pompon.aria', { couleur: T('couleur.' + POMPONS[i].cle) }));
      (function (k) { b.addEventListener('click', function () { choisirSiege(k); }); })(i);
      table.appendChild(b);
      sieges.push({ el: b, place: i, cartes: [] });
    }
    placerSieges();
    $('toi-pompon').innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="55" r="34" fill="#fff6e0" stroke="#ffb347" stroke-width="5"/><ellipse cx="39" cy="54" rx="6" ry="7.5" fill="#2d2240"/><ellipse cx="61" cy="54" rx="6" ry="7.5" fill="#2d2240"/><path d="M42 68 Q50 75 58 68" stroke="#2d2240" stroke-width="3" fill="none" stroke-linecap="round"/>' +
      '<g class="deguisement"><path d="M24 47 Q50 39 76 47 L75 61 Q50 55 25 61 Z" fill="#2d2240"/><ellipse cx="39" cy="54" rx="5.5" ry="5" fill="#fff"/><ellipse cx="61" cy="54" rx="5.5" ry="5" fill="#fff"/><circle cx="40" cy="55" r="3" fill="#2d2240"/><circle cx="62" cy="55" r="3" fill="#2d2240"/></g></svg>';
    $('toi-nom').textContent = T('toi');
  }
  function placerSieges() {
    var pos = places(sieges.length);
    sieges.forEach(function (s) { s.el.style.left = pos[s.place].x + '%'; s.el.style.top = pos[s.place].y + '%'; });
  }
  // Sièges dans l'ordre des places, de gauche à droite
  function siegesDansLOrdre() { return sieges.slice().sort(function (a, b) { return a.place - b.place; }); }

  function creerCarte(emoji) {
    var c = document.createElement('div');
    c.className = 'carte';
    c.innerHTML = '<div class="int"><div class="face dos"></div><div class="face avant"></div></div>';
    c.querySelector('.avant').textContent = emoji;
    return c;
  }

  // Prépare une manche : thème, imposteurs, cartes de chacun
  function preparerManche(k) {
    var cfg = etat.cfg, n = cfg.p;
    var o = {
      tours: cfg.tours || 1, melange: cfg.melange || 0, eclair: !!cfg.eclair, deux: !!cfg.deux,
      taCarte: !!cfg.taCarte, role: (cfg.role || []).indexOf(k) >= 0, ruse: prendre(cfg.ruses || ['malin'])
    };
    if (cfg.finale) {
      o.tours = Math.random() < 0.4 ? 2 : 1;
      o.deux = Math.random() < 0.35;
      o.melange = Math.random() < 0.55 ? cfg.melange : 0;
      o.eclair = Math.random() < 0.4;
      o.taCarte = Math.random() < 0.5;
      o.role = k === etat.roleFinale;
      o.ruse = o.tours === 2 ? 'copieur' : prendre(['malin', 'malin', 'perdu']);
    }
    if (o.ruse === 'copieur' && o.tours < 2) o.ruse = 'malin';
    if (o.role) { o.deux = false; o.melange = 0; o.taCarte = false; }
    if (n < 5) o.deux = false;
    // Thème jamais vu dans ce niveau
    var libres = THEMES.filter(function (t) { return etat.themes.indexOf(t) < 0; });
    o.theme = prendre(libres);
    etat.themes.push(o.theme);
    // Imposteurs (aucun Pompon quand le joueur est l'imposteur)
    var indices = melanger(sieges.map(function (s, i) { return i; }));
    o.imposteurs = o.role ? [] : indices.slice(0, o.deux ? 2 : 1);
    // Cartes des Pompons honnêtes : piochées dans le thème, sans doublon tant que possible
    var pioche = melanger(CARTES[o.theme]), p = 0;
    function cartesTheme() { var c = pioche[p % pioche.length]; p++; return c; }
    var dejaPrises = {};
    function carteAutre(themes) {
      for (var essai = 0; essai < 30; essai++) { var c = prendre(CARTES[prendre(themes)]); if (!dejaPrises[c]) { dejaPrises[c] = 1; return c; } }
      return prendre(CARTES[prendre(themes)]);
    }
    sieges.forEach(function (s, i) {
      var liste = [];
      var imp = o.imposteurs.indexOf(i) >= 0;
      for (var t = 0; t < o.tours; t++) {
        if (!imp) liste.push(cartesTheme());
        else if (o.ruse === 'perdu') liste.push(carteAutre(lointains(o.theme)));
        else if (o.ruse === 'copieur' && t === 1) liste.push(cartesTheme());
        else liste.push(carteAutre(voisins(o.theme)));
      }
      s.cartes = liste;
    });
    // Main du joueur
    if (o.role) {
      o.main = melanger([cartesTheme(), carteAutre(voisins(o.theme)), carteAutre(lointains(o.theme)), carteAutre(etat.idx >= 10 ? voisins(o.theme) : lointains(o.theme))]);
      var v = voisins(o.theme);
      o.propositions = melanger([o.theme, v[0], v[1], prendre(lointains(o.theme))]);
    } else if (o.taCarte) {
      o.main = melanger([cartesTheme(), carteAutre(voisins(o.theme)), carteAutre(lointains(o.theme))]);
    }
    o.bonneCarte = o.main ? o.main.filter(function (c) { return CARTES[o.theme].indexOf(c) >= 0; })[0] : null;
    return o;
  }

  function nomTheme(th) { return T('theme.' + th); }
  function montrerTheme(o, visible) {
    var b = $('bandeau');
    b.className = '';
    b.innerHTML = '';
    if (o.role && !o.revele) {
      b.className = 'inconnu';
      b.innerHTML = SVG_MASQUE;
      b.appendChild(document.createTextNode(T('theme.inconnu')));
      return;
    }
    if (!visible) {
      b.className = 'cache-theme';
      b.textContent = T('theme.cache');
      return;
    }
    var e = document.createElement('span'); e.className = 'emo'; e.textContent = CARTES[o.theme][0];
    var tx = document.createElement('span'); tx.textContent = T('theme.label', { theme: nomTheme(o.theme) });
    b.appendChild(e); b.appendChild(tx);
  }

  function retournerToutes(ouvertes) {
    sieges.forEach(function (s) { s.el.querySelectorAll('.carte').forEach(function (c) { c.classList.toggle('ouverte', ouvertes); }); });
  }
  function activerSieges(oui) {
    sieges.forEach(function (s) { s.el.disabled = !oui || s.el.classList.contains('trouve'); });
    $('table').classList.toggle('mode-accuse', oui);
  }

  async function jouerManche(k, j) {
    var cfg = etat.cfg;
    var o = preparerManche(k);
    etat.o = o;
    mode = 'attente';
    majLoupe();
    $('lbl-manche').textContent = T('jeu.manche', { n: k + 1, total: cfg.m });
    $('choix').innerHTML = '';
    $('btn-continuer').classList.add('cache');
    $('toi').classList.toggle('toujours', o.role);
    var tc = $('toi-carte'); tc.className = 'carte vide'; tc.querySelector('.avant').textContent = '';
    // Remise à zéro de la table
    sieges.forEach(function (s, i) {
      s.el.classList.remove('demasque', 'innocent', 'trouve', 'faux', 'choisi', 'parle');
      var paire = s.el.querySelector('.paire'); paire.innerHTML = '';
      s.cartes.forEach(function (c) { var el = creerCarte(c); el.classList.add('vide'); paire.appendChild(el); });
    });
    activerSieges(false);

    // 1. Le thème
    if (o.role) {
      montrerTheme(o, false);
      consigne(T('phase.role'), '');
      son('eclair');
      await attendre(2200);
    } else if (o.eclair) {
      montrerTheme(o, true);
      $('bandeau').classList.add('eclair');
      consigne(T('phase.eclair'), '');
      son('eclair');
      await attendre(2000);
      if (j !== jeton) return false;
      montrerTheme(o, false);
    } else {
      montrerTheme(o, true);
      consigne(T('phase.regarde'), '');
      await attendre(1100);
    }
    if (j !== jeton) return false;

    // 2. Les cartes, Pompon par Pompon (de gauche à droite)
    for (var t = 0; t < o.tours; t++) {
      if (t === 1) { consigne(T('phase.tour2'), ''); await attendre(1000); if (j !== jeton) return false; }
      else consigne(T('phase.regarde'), '');
      var ordre = siegesDansLOrdre();
      for (var i = 0; i < ordre.length; i++) {
        var s = ordre[i];
        var carte = s.el.querySelectorAll('.carte')[t];
        s.el.classList.add('parle');
        carte.classList.remove('vide');
        await attendre(60);
        carte.classList.add('ouverte');
        son('carte');
        await attendre(cfg.d);
        if (j !== jeton) return false;
        carte.classList.remove('ouverte');
        s.el.classList.remove('parle');
        son('retourne');
        await attendre(260);
        if (j !== jeton) return false;
      }
    }

    // 3. Le joueur montre sa carte (« Ta carte » ou rôle d'imposteur)
    if (o.main) {
      var bonne = await choisirCarte(o, j);
      if (j !== jeton) return false;
      if (!bonne) return await finManche(false, o.role ? 'res.roleRepere' : 'res.carteRatee', o, j);
    }

    // 4. Rôle d'imposteur : deviner le thème
    if (o.role) {
      var trouveTheme = await choisirTheme(o, j);
      if (j !== jeton) return false;
      return await finManche(trouveTheme, trouveTheme ? 'res.roleGagne' : 'res.roleThemeRate', o, j);
    }

    // 5. Mélange des places
    if (o.melange) {
      consigne(T('phase.melange'), '');
      await attendre(700);
      for (var m = 0; m < o.melange; m++) {
        if (j !== jeton) return false;
        var a = hasard(sieges.length), b = (a + 1 + hasard(sieges.length - 1)) % sieges.length;
        var pa = sieges[a].place; sieges[a].place = sieges[b].place; sieges[b].place = pa;
        placerSieges();
        son('glisse');
        await attendre(Math.max(520, 760 - etat.idx * 10));
      }
      await attendre(300);
      if (j !== jeton) return false;
    }

    // 6. Accusation
    var reste = o.imposteurs.length;
    consigne(T(reste > 1 ? 'phase.accuse2' : 'phase.accuse'), '');
    var debut = horloge;
    mode = 'accuse';
    majLoupe();
    activerSieges(true);
    var premier = siegesDansLOrdre()[0];
    if (premier && !('ontouchstart' in window)) premier.el.focus({ preventScroll: true });
    while (reste > 0) {
      var choix = await attendreChoix();
      if (j !== jeton) return false;
      var sg = sieges[choix];
      son('toucher');
      if (o.imposteurs.indexOf(choix) >= 0) {
        sg.el.classList.add('trouve', 'demasque');
        sg.el.disabled = true;
        son('demasque');
        reste--;
        if (reste > 0) consigne(T('phase.accuseEncore'), 'bon');
      } else {
        sg.el.classList.add('faux');
        activerSieges(false);
        mode = 'attente'; majLoupe();
        return await finManche(false, 'res.rate', o, j);
      }
    }
    activerSieges(false);
    mode = 'attente'; majLoupe();
    var secondes = (horloge - debut) / 1000;
    var bonus = Math.max(0, Math.round(50 - secondes * 5));
    return await finManche(true, o.imposteurs.length > 1 ? 'res.trouve2' : 'res.trouve', o, j, bonus);
  }

  // Choix d'une carte dans la main du joueur
  async function choisirCarte(o, j) {
    consigne(T(o.role ? 'phase.roleCarte' : 'phase.taCarte'), '');
    var zone = $('choix'); zone.innerHTML = '';
    o.main.forEach(function (c, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'choix-carte choisissable';
      b.textContent = c;
      b.style.animationDelay = (i * 0.08) + 's';
      b.setAttribute('aria-label', T('carte.aria', { n: i + 1 }));
      b.addEventListener('click', function () { if (resoudreChoix && mode === 'main') resoudreChoix(i); });
      zone.appendChild(b);
    });
    mode = 'main';
    if (!('ontouchstart' in window)) zone.firstChild.focus({ preventScroll: true });
    var i = await attendreChoix();
    if (j !== jeton) return false;
    mode = 'attente';
    var c = o.main[i];
    var bonne = c === o.bonneCarte;
    var boutons = zone.querySelectorAll('button');
    boutons.forEach(function (b) { b.disabled = true; });
    boutons[i].classList.add(bonne ? 'bon' : 'mauvais');
    var tc = $('toi-carte'); tc.className = 'carte'; tc.querySelector('.avant').textContent = c;
    await attendre(60);
    tc.classList.add('ouverte');
    son(bonne ? 'carte' : 'faux');
    if (bonne) consigne(T(o.role ? 'res.roleCarteOk' : 'res.carteOk'), 'bon');
    await attendre(1000);
    zone.innerHTML = '';
    return bonne;
  }

  // Rôle d'imposteur : choisir le thème parmi 4
  async function choisirTheme(o, j) {
    consigne(T('phase.roleTheme'), '');
    var zone = $('choix'); zone.innerHTML = '';
    o.propositions.forEach(function (th, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn choix-theme choisissable';
      b.textContent = nomTheme(th);
      b.addEventListener('click', function () { if (resoudreChoix && mode === 'theme') resoudreChoix(i); });
      zone.appendChild(b);
    });
    mode = 'theme';
    if (!('ontouchstart' in window)) zone.firstChild.focus({ preventScroll: true });
    var i = await attendreChoix();
    if (j !== jeton) return false;
    mode = 'attente';
    var ok = o.propositions[i] === o.theme;
    var boutons = zone.querySelectorAll('button');
    boutons.forEach(function (b, k) { b.disabled = true; if (o.propositions[k] === o.theme) b.classList.add('bon'); });
    if (!ok) boutons[i].classList.add('mauvais');
    await attendre(900);
    return ok;
  }

  // Fin d'une manche : explication, points, cœurs
  async function finManche(gagne, cleMessage, o, j, bonus) {
    mode = 'resultat';
    activerSieges(false);
    // Tout est révélé : imposteurs démasqués et cartes retournées
    o.imposteurs.forEach(function (i) {
      sieges[i].el.classList.add('demasque');
      sieges[i].el.querySelectorAll('.carte').forEach(function (c, t) {
        if (CARTES[o.theme].indexOf(sieges[i].cartes[t]) < 0) c.classList.add('intrus');
      });
    });
    retournerToutes(true);
    o.revele = true;
    montrerTheme(o, true);
    $('choix').innerHTML = '';
    if (gagne) {
      var pts = 100 + (bonus || 0);
      etat.score += pts;
      etat.reussies++;
      son('bon');
      consigne(T(cleMessage), 'bon');
      flotter(T('res.points', { n: pts }));
      confettis(18);
    } else {
      etat.coeurs--;
      etat.erreurs++;
      majCoeurs();
      son('faux');
      if (o.imposteurs.length) setTimeout(function () { son('demasque'); }, 350);
      $('ecran-jeu').classList.add('secousse');
      setTimeout(function () { $('ecran-jeu').classList.remove('secousse'); }, 450);
      consigne(T(cleMessage, { theme: nomTheme(o.theme) }), 'mauvais');
    }
    var detail = document.createElement('p');
    detail.style.cssText = 'margin:0;font-size:.95rem;color:#6b5a86;text-align:center';
    if (!gagne || o.role) detail.textContent = T('res.theme', { theme: nomTheme(o.theme) });
    $('choix').appendChild(detail);
    var bc = $('btn-continuer');
    bc.classList.remove('cache');
    bc.textContent = T(etat.coeurs <= 0 ? 'btn.voirBilan' : (etat.manche + 1 >= etat.cfg.m ? 'btn.terminer' : 'btn.continuer'));
    mode = 'continuer';
    setTimeout(function () { if (mode === 'continuer') bc.focus({ preventScroll: true }); }, 50);
    await attendreChoix();
    if (j !== jeton) return gagne;
    bc.classList.add('cache');
    mode = 'attente';
    retournerToutes(false);
    return gagne;
  }

  function choisirSiege(i) {
    if (mode !== 'accuse' || enPause || !resoudreChoix) return;
    if (sieges[i].el.disabled) return;
    resoudreChoix(i);
  }

  async function utiliserLoupe() {
    if (mode !== 'accuse' || !etat || etat.loupes <= 0 || enPause) return;
    etat.loupes--; etat.loupesUtilisees++;
    mode = 'loupe';
    majLoupe();
    son('loupe');
    activerSieges(false);
    retournerToutes(true);
    var j = jeton;
    await attendre(1500);
    if (j !== jeton) return;
    retournerToutes(false);
    // Les imposteurs déjà trouvés gardent leur déguisement
    activerSieges(true);
    mode = 'accuse';
    majLoupe();
  }

  // ---------------------------------------------------------------------
  // Fins de niveau
  // ---------------------------------------------------------------------
  function etoilesDuNiveau() {
    var p = etat.erreurs + etat.loupesUtilisees;
    return p === 0 ? 3 : (p === 1 ? 2 : 1);
  }

  function victoire() {
    var idx = etat.idx;
    enPartie = false;
    mode = 'fin';
    var e = etoilesDuNiveau();
    var ancienRecord = memo.records[idx];
    var record = etat.score > ancienRecord;
    memo.etoiles[idx] = Math.max(memo.etoiles[idx], e);
    if (record) memo.records[idx] = etat.score;
    memo.niveau = Math.max(memo.niveau || 1, Math.min(NIVEAUX.length, idx + 2));
    sauver(idx + 2);
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: idx + 1 });
    var toutGagne = memo.etoiles.every(function (x) { return x > 0; });
    if (toutGagne) { if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 }); }
    son('victoire');
    confettis(60);
    afficherFin(true, e, record, ancienRecord, toutGagne && idx === NIVEAUX.length - 1);
  }

  function defaite() {
    var idx = etat.idx;
    enPartie = false;
    mode = 'fin';
    sauver(idx + 1);
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: idx + 1 });
    son('defaite');
    afficherFin(false, 0, false, memo.records[idx], false);
  }

  function afficherFin(gagne, e, record, ancien, finJeu) {
    var idx = etat.idx;
    $('fin-titre').textContent = T(gagne ? 'fin.victoire' : 'fin.defaite');
    var et = $('fin-etoiles'); et.innerHTML = '';
    for (var i = 0; i < 3; i++) {
      var s = document.createElement('span'); s.innerHTML = svgEtoile(gagne && i < e);
      var svg = s.firstChild;
      et.appendChild(svg);
      (function (svg, i, allume) {
        setTimeout(function () { svg.classList.add(allume ? 'allume' : 'eteinte'); if (allume) son('etoile'); }, 300 + i * 350);
      })(svg, i, gagne && i < e);
    }
    et.setAttribute('role', 'img');
    et.setAttribute('aria-label', T('fin.etoiles', { n: gagne ? e : 0 }));
    // Score qui défile
    var sc = $('fin-score'), cible = etat.score, debut = performance.now();
    function compte(now) {
      var r = Math.min(1, (now - debut) / 900);
      sc.textContent = T('fin.score', { n: Math.round(cible * r) });
      if (r < 1 && $('fin').classList.contains('ouvert')) requestAnimationFrame(compte);
    }
    sc.textContent = T('fin.score', { n: 0 });
    requestAnimationFrame(compte);
    var rec = $('fin-record');
    rec.className = record ? 'battu' : '';
    rec.textContent = record ? T('fin.record') : T('fin.recordAncien', { n: ancien });
    $('fin-detail').textContent = T('fin.manches', { n: etat.reussies, total: etat.cfg.m });
    var extra = '';
    if (!gagne) extra = T('fin.conseil');
    else if (finJeu) extra = T('fin.toutFini', { e: totalEtoiles(), max: NIVEAUX.length * 3 });
    else if (e < 3) extra = T('fin.astuce');
    $('fin-extra').textContent = extra;
    var bt = $('fin-boutons'); bt.innerHTML = '';
    function bouton(cle, principal, action) {
      var b = document.createElement('button'); b.type = 'button';
      b.className = 'btn' + (principal ? ' principal' : '');
      b.textContent = T(cle);
      b.addEventListener('click', function () { son('toucher'); action(); });
      bt.appendChild(b);
      return b;
    }
    var premier;
    if (gagne && idx + 1 < NIVEAUX.length) premier = bouton('btn.suivant', true, function () { demarrerNiveau(idx + 1); });
    if (!gagne) premier = bouton('btn.reessayer', true, function () { demarrerNiveau(idx); });
    var r = bouton('btn.rejouer', !premier, function () { demarrerNiveau(idx); });
    if (!premier) premier = r;
    if (!gagne) r.remove();
    bouton('btn.niveaux', false, afficherNiveaux);
    bouton('btn.accueil', false, allerAccueil);
    ouvrir('fin', true);
    setTimeout(function () { premier.focus({ preventScroll: true }); }, 60);
  }

  // ---------------------------------------------------------------------
  // Pause
  // ---------------------------------------------------------------------
  function mettrePause() {
    if (!enPartie || enPause || $('fin').classList.contains('ouvert')) return;
    enPause = true;
    document.body.classList.add('en-pause');
    if (ac) { try { ac.suspend(); } catch (e) { /* rien */ } }
    ouvrir('pause', true);
    setTimeout(function () { $('btn-reprendre').focus({ preventScroll: true }); }, 30);
  }
  function reprendre() {
    if (!enPause) return;
    enPause = false;
    document.body.classList.remove('en-pause');
    if (ac) { try { ac.resume(); } catch (e) { /* rien */ } }
    ouvrir('pause', false);
    son('toucher');
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) mettrePause(); });

  // ---------------------------------------------------------------------
  // Tutoriel animé et fiches des nouveautés
  // ---------------------------------------------------------------------
  var FICHES = {
    base: ['tuto.1', 'tuto.2', 'tuto.3'],
    malin: ['nouveau.malin', 'nouveau.loupe'],
    taCarte: ['nouveau.taCarte'],
    role: ['nouveau.role'],
    tours: ['nouveau.tours'],
    melange: ['nouveau.melange'],
    eclair: ['nouveau.eclair'],
    deux: ['nouveau.deux'],
    finale: ['nouveau.finale']
  };
  // Petite scène animée pour chaque étape
  function scene(nom, etape) {
    var sc = $('tuto-scene'); sc.innerHTML = '';
    var xs = [10, 98, 186];
    var cartes = ['🍎', '🍌', '🚗'];
    if (nom === 'malin') cartes = ['🍎', '🍓', '🥦'];
    if (nom === 'deux') cartes = ['🍎', '🚗', '🥕'];
    var intrus = { 2: true };
    if (nom === 'deux') intrus = { 1: true, 2: true };
    xs.forEach(function (x, i) {
      var p = document.createElement('div'); p.className = 't-pompon'; p.style.left = x + 'px';
      p.innerHTML = svgPompon(i);
      var montrerMasque = (nom === 'base' && etape === 2 && intrus[i]) || (nom === 'role' && i === 1);
      if (montrerMasque) p.classList.add('toujours');
      sc.appendChild(p);
      var c = document.createElement('div'); c.className = 't-carte'; c.style.left = (x + 8) + 'px';
      c.textContent = (nom === 'role' && i === 1) ? '' : cartes[i];
      if (nom === 'role' && i === 1) c.style.background = 'repeating-linear-gradient(45deg,#7b5ce6 0 6px,#6c4bd8 6px 12px)';
      if (nom === 'loupe') { c.style.boxShadow = '0 0 0 4px #e6dcff'; }
      if (((nom === 'base' && etape >= 1) || nom === 'malin' || nom === 'deux') && intrus[i]) c.classList.add('intrus');
      sc.appendChild(c);
    });
    var main = document.createElement('div'); main.className = 'main-anim'; main.innerHTML = SVG_MAIN;
    if (nom === 'base' && etape === 0) { main.classList.add('glisse'); main.style.left = '108px'; main.style.top = '100px'; }
    else if (nom === 'base' && etape === 1) { main.style.left = '200px'; main.style.top = '104px'; }
    else if (nom === 'melange') { main.classList.add('glisse'); main.style.left = '108px'; main.style.top = '30px'; animerMelange(sc); }
    else if (nom === 'loupe') { main.innerHTML = SVG_LOUPE; main.style.left = '108px'; main.style.top = '100px'; main.classList.add('glisse'); }
    else if (nom === 'deux') { main.style.left = '150px'; main.style.top = '40px'; }
    else if (nom === 'taCarte' || nom === 'role') { main.style.left = '112px'; main.style.top = '100px'; }
    else { main.style.left = '200px'; main.style.top = '40px'; }
    sc.appendChild(main);
  }
  function animerMelange(sc) {
    var ps = sc.querySelectorAll('.t-pompon');
    ps.forEach(function (p) { p.style.transition = 'left .6s ease-in-out'; });
    var k = 0;
    var minuteur = setInterval(function () {
      if (!sc.isConnected || !$('tuto').classList.contains('ouvert')) { clearInterval(minuteur); return; }
      var a = ps[k % 3], b = ps[(k + 1) % 3];
      var la = a.style.left; a.style.left = b.style.left; b.style.left = la;
      k++;
    }, 1100);
  }
  function tutoriel(nom) {
    var etapes = FICHES[nom] || [];
    var e = 0;
    var j = jeton;
    return new Promise(function (fini) {
      function afficher() {
        var cle = etapes[e];
        var sousNom = nom;
        if (nom === 'malin' && e === 1) sousNom = 'loupe';
        $('tuto-titre').textContent = T(nom === 'base' ? 'tuto.titre' : 'nouveau.titre');
        $('tuto-texte').textContent = T(cle);
        scene(sousNom, e);
        var pts = $('tuto-etapes'); pts.innerHTML = '';
        if (etapes.length > 1) etapes.forEach(function (x, k) { var i = document.createElement('i'); if (k === e) i.className = 'on'; pts.appendChild(i); });
      }
      function suivant(ev) {
        if (ev) { ev.stopPropagation(); }
        if (j !== jeton) { fermer(); return; }
        son('toucher');
        e++;
        if (e >= etapes.length) { fermer(); fini(); }
        else afficher();
      }
      function fermer() {
        ouvrir('tuto', false);
        $('tuto-boite').onclick = null;
        tutoActif = null;
      }
      tutoActif = suivant;
      $('tuto-boite').onclick = suivant;
      afficher();
      ouvrir('tuto', true);
      setTimeout(function () { $('btn-tuto').focus({ preventScroll: true }); }, 40);
    });
  }
  var tutoActif = null;

  // ---------------------------------------------------------------------
  // Effets visuels
  // ---------------------------------------------------------------------
  function confettis(n) {
    var couleurs = ['#ff8fb8', '#6ec3ff', '#86dd84', '#ffd65a', '#b89cff', '#ffa45c'];
    var zone = $('effets');
    for (var i = 0; i < n; i++) {
      var c = document.createElement('i');
      c.className = 'confetti';
      c.style.left = (Math.random() * 100) + '%';
      c.style.background = prendre(couleurs);
      c.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      c.style.animationDuration = (1.4 + Math.random() * 0.9) + 's';
      zone.appendChild(c);
      setTimeout(function (el) { el.remove(); }.bind(null, c), 2800);
    }
  }
  function flotter(texte) {
    var p = document.createElement('div');
    p.className = 'points';
    p.textContent = texte;
    var r = $('consigne').getBoundingClientRect();
    p.style.left = (r.left + r.width / 2 - 40) + 'px';
    p.style.top = (r.top - 30) + 'px';
    $('effets').appendChild(p);
    setTimeout(function () { p.remove(); }, 1300);
  }

  // ---------------------------------------------------------------------
  // Commandes : boutons, clavier
  // ---------------------------------------------------------------------
  function lancerJeu() {
    audio();
    son('toucher');
    var lancer = function (n) { chargerMemo(); majBoutonsSon(); demarrerNiveau(n); };
    try {
      window.JEL_SAVE.reprise({
        jeu: JEU,
        onContinuer: function (d) { lancer(Math.max(1, Math.min(NIVEAUX.length, (d && d.niveau | 0) || 1)) - 1); },
        onNouvelle: function () { lancer(0); }
      });
    } catch (e) { lancer(0); }
  }
  $('btn-jouer').addEventListener('click', lancerJeu);
  $('btn-niveaux').addEventListener('click', function () { audio(); son('toucher'); chargerMemo(); afficherNiveaux(); });
  $('btn-retour-niveaux').addEventListener('click', function () { son('toucher'); allerAccueil(); });
  document.querySelectorAll('.btn-son').forEach(function (b) { b.addEventListener('click', function () { audio(); basculerSon(); }); });
  $('btn-pause').innerHTML = SVG_PAUSE;
  $('btn-pause').addEventListener('click', function () { son('toucher'); mettrePause(); });
  $('btn-reprendre').addEventListener('click', reprendre);
  $('btn-recommencer').addEventListener('click', function () { var i = etat ? etat.idx : 0; demarrerNiveau(i); });
  $('btn-pause-niveaux').addEventListener('click', function () { if (enPartie && etat) sauver(etat.idx + 1); afficherNiveaux(); });
  $('btn-pause-accueil').addEventListener('click', function () { if (enPartie && etat) sauver(etat.idx + 1); allerAccueil(); });
  $('btn-loupe').addEventListener('click', utiliserLoupe);
  $('btn-continuer').addEventListener('click', function () { if (mode === 'continuer' && resoudreChoix) { son('toucher'); resoudreChoix(0); } });
  $('btn-tuto').addEventListener('click', function (ev) { if (tutoActif) tutoActif(ev); });

  document.addEventListener('keydown', function (ev) {
    var code = ev.code;
    if ($('pause').classList.contains('ouvert')) {
      if (code === 'Escape' || code === 'KeyP') { ev.preventDefault(); reprendre(); }
      return;
    }
    if ($('tuto').classList.contains('ouvert')) {
      if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') { ev.preventDefault(); if (tutoActif) tutoActif(); }
      return;
    }
    if (!$('ecran-jeu').classList.contains('actif') || $('fin').classList.contains('ouvert')) return;
    if (code === 'Escape' || code === 'KeyP') { ev.preventDefault(); mettrePause(); return; }
    if (code === 'KeyL') { ev.preventDefault(); utiliserLoupe(); return; }
    var m = /^(Digit|Numpad)([1-6])$/.exec(code);
    if (m) {
      var n = parseInt(m[2], 10) - 1;
      if (mode === 'accuse') { var s = siegesDansLOrdre()[n]; if (s) { ev.preventDefault(); choisirSiege(sieges.indexOf(s)); } }
      else if (mode === 'main' || mode === 'theme') { var b = $('choix').querySelectorAll('button')[n]; if (b) { ev.preventDefault(); b.click(); } }
      return;
    }
    if (/^Arrow/.test(code)) {
      var liste = [];
      if (mode === 'accuse') liste = siegesDansLOrdre().map(function (s) { return s.el; }).filter(function (b) { return !b.disabled; });
      else if (mode === 'main' || mode === 'theme') liste = Array.prototype.slice.call($('choix').querySelectorAll('button:not(:disabled)'));
      if (!liste.length) return;
      ev.preventDefault();
      var i = liste.indexOf(document.activeElement);
      var sens = (code === 'ArrowLeft' || code === 'ArrowUp') ? -1 : 1;
      i = i < 0 ? 0 : (i + sens + liste.length) % liste.length;
      liste[i].focus({ preventScroll: true });
    }
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie
  try {
    window.JEL_SAVE.surFermeture(function () { if (enPartie && etat) sauver(etat.idx + 1); });
  } catch (e) { /* module absent */ }

  // Démarrage
  chargerMemo();
  majBoutonsSon();
  dessinerIllustration();
  majEffacer();
})();
</script>
</body>
</html>
