  }
  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  const monSiege = () => (partie ? partie.siege : -1);
  const chapeauDe = (s) => (s === monSiege() && s >= 0 ? prog.chapeau : 0);

  function dessinerTete(cv, s) {
    const c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    dino(c, s, cv.width * 0.45, cv.height * (s === 2 ? 0.86 : 0.6), cv.height * (s === 2 ? 0.34 : 0.42), { ombre: false, chapeau: chapeauDe(s) });
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !e.fini ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const pos = e ? e.pos[s] : 0, L = e ? e.L : 1;
      d.querySelector('.barre > div').style.width = Math.round(100 * pos / L) + '%';
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('boue', !!(e && e.passe[s] > 0));
      const role = roleDe(info);
      const cleTete = role + '|' + chapeauDe(s);
      const cv = d.querySelector('canvas.tete');
      if (cv.dataset.cle !== cleTete) { cv.dataset.cle = cleTete; dessinerTete(cv, s); }
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      const nbo = e ? e.bonus[s] : 0, boite = d.querySelector('.oeufs');
      if (boite.childElementCount !== nbo) { boite.textContent = ''; for (let k = 0; k < nbo; k++) boite.appendChild(document.createElement('i')); }
      d.setAttribute('aria-label', tr('place.aria.' + role, { animal: tr('animal.' + s), n: pos, total: L }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    if (annonce.texte && Date.now() < annonce.fin) return annonce.texte;
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || e.fini) return '';
    if (anim || file.length) return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) return tr(e.pile && e.pos[s] >= e.L - 4 ? 'tour.toiPile' : 'tour.toi');
    const nom = pseudoDe(s);
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.' + s);
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  // Les pierres en bas de l'écran : celles du joueur dont c'est le tour.
  function peutJouer() {
    return !!(partie && vue && !enPause && !attenteTuto && !anim && !file.length && partie.phase === 'jeu'
      && !vue.fini && partie.monTour() && R.aQui(vue) === partie.siege);
  }

  function majPierres() {
    const e = vue;
    const moi = peutJouer();
    const tour = e && !e.fini ? R.aQui(e) : -1;
    if (!moi && choix >= 0) choix = -1;
    for (let a = 0; a < 4; a++) {
      const b = $('pierre-' + a);
      let n = 0;
      if (e && !e.fini && partie && partie.phase === 'jeu') {
        if (a < 3) n = e.main[a] || 0;
        else n = tour >= 0 && e.bonus[tour] > 0 ? 4 : 0;
      }
      const cle = n + '|' + (choix === a ? 1 : 0);
      if (b.dataset.cle !== cle) {
        b.dataset.cle = cle;
        const cv = b.querySelector('canvas');
        if (n) dessinerPierre(cv.getContext('2d'), cv.width, cv.height, n, choix === a);
      }
      b.classList.toggle('cachee', !n);
      b.classList.toggle('inactive', !moi);
      b.classList.toggle('choisie', choix === a);
      b.disabled = !n;
      if (a === 3) b.querySelector('.compte').textContent = n && e ? '×' + nb(e.bonus[tour]) : '';
      const lab = n ? tr(a === 3 ? 'pierre.oeuf.aria' : 'pierre.aria', { n: n }) : '';
      if (b.getAttribute('aria-label') !== lab) b.setAttribute('aria-label', lab);
    }
    const av = $('btn-avance');
    const montrer = moi && choix >= 0;
    if (av.hidden === montrer) av.hidden = !montrer;
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majPierres();
  }

  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fini && !anim && !file.length) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Animations des coups (une file : les coups se suivent, jamais en même temps)
  // ---------------------------------------------------------------------

  const DUREES = { pas: 200, contour: 340, saut: 340, liane: 650, ptero: 950, pente: 520 };

  function demarrerAnim(t) {
    if (anim || !file.length) return;
    const a = file.shift();
    const d = a.apres.der;
    const etapes = d.et.map((x) => ({ p: x.p, k: x.k }));
    const vitesse = file.length > 1 ? 2.2 : file.length ? 1.5 : 1;
    let total = 0;
    etapes.forEach((x) => { x.t0 = total; x.d = DUREES[x.k] / vitesse; total += x.d; });
    anim = { s: d.s, de: d.de, etapes: etapes, t0: t, total: total + 120 / vitesse, ev: d.ev, apres: a.apres, moi: a.moi, auto: a.auto, d: d, joue: -1 };
    choix = -1;
    majInterface();
  }

  function finirAnim() {
    const a = anim;
    anim = null;
    vue = a.apres;
    const d = a.d, s = d.s, moi = s === monSiege();
    const nom = pseudoDe(s) || tr('qui.' + s);
    // ce qui est arrivé à la fin du coup
    if (d.ev.indexOf('nid') >= 0) { sons.nid(); jaillirCase(vue.L, s, 26); }
    else if (d.ev.indexOf('boue') >= 0) { sons.boue(); jaillirCase(vue.pos[s], -2, 12); annoncer(tr(moi ? 'ev.boue.toi' : 'ev.boue', { animal: nom })); }
    else if (d.ev.indexOf('oeuf') >= 0) { sons.oeuf(); jaillirCase(vue.pos[s], -1, 16); annoncer(tr(moi ? 'ev.oeuf.toi' : 'ev.oeuf', { animal: nom })); }
    else if (d.ev.indexOf('ptero') >= 0) annoncer(tr(moi ? 'ev.ptero.toi' : 'ev.ptero', { animal: nom }));
    else if (d.ev.indexOf('liane') >= 0) annoncer(tr(moi ? 'ev.liane.toi' : 'ev.liane', { animal: nom }));
    else if (d.ev.indexOf('pente') >= 0) annoncer(tr(moi ? 'ev.pente.toi' : 'ev.pente', { animal: nom }));
    else if (d.ev.indexOf('coince') >= 0) annoncer(tr(moi ? 'ev.coince.toi' : 'ev.coince', { animal: nom }));
    else if (d.ev.indexOf('rebond') >= 0) annoncer(tr(moi ? 'ev.rebond.toi' : 'ev.rebond', { animal: nom }));
    else if (d.ev.indexOf('saut') >= 0) annoncer(tr(moi ? 'ev.saut.toi' : 'ev.saut', { animal: nom }));
    if (d.bm) { sons.bronto(); annoncer(tr('ev.bronto')); }
    d.pa.forEach((q) => { annoncer(tr(q === monSiege() ? 'ev.passe.toi' : 'ev.passe', { animal: pseudoDe(q) || tr('qui.' + q) }), 2600); });
    if (a.auto) toast(tr(moi ? 'multi.autoToi' : 'multi.auto'));
    debutTour = Date.now();
    dernierTic = -1;
    if (!vue.fini && partie && partie.phase === 'jeu' && R.aQui(vue) === monSiege() && !file.length) sons.tour();
    if (!file.length && finAttendue) {
      const f = finAttendue; finAttendue = null;
      const j = jeton;
      setTimeout(() => { if (j === jeton && partie) f(); }, 700);
    }
    majInterface();
  }

  // Position (x, y) du dino animé à l'instant t.
  function positionAnim(t) {
    const a = anim, g = geo;
    const ec = Math.max(0, t - a.t0);
    let prec = a.de;
    for (let i = 0; i < a.etapes.length; i++) {
      const x = a.etapes[i];
      if (ec < x.t0 + x.d) {
        if (a.joue < i) { a.joue = i; sonEtape(x.k, x.p < prec); }
        const u = Math.max(0, Math.min(1, (ec - x.t0) / x.d));
        const A = g.pts[prec], B = g.pts[Math.min(x.p, g.pts.length - 1)];
        let px = A[0] + (B[0] - A[0]) * u, py = A[1] + (B[1] - A[1]) * u;
        const s = g.s;
        if (x.k === 'pas') py -= Math.sin(u * Math.PI) * s * 0.28;
        else if (x.k === 'contour') { py -= Math.sin(u * Math.PI) * s * 0.55; }
        else if (x.k === 'saut') py -= Math.sin(u * Math.PI) * s * 0.7;
        else if (x.k === 'liane') { const m = Math.sin(u * Math.PI); px -= m * s * 0.5; py -= m * s * 0.3; }
        else if (x.k === 'ptero') py -= Math.sin(u * Math.PI) * s * 1.6;
        return { x: px, y: py, k: x.k, u: u };
      }
      prec = x.p;
    }
    const B = g.pts[prec];
    return { x: B[0], y: B[1], k: '', u: 1 };
  }

  function sonEtape(k, recule) {
    if (k === 'pas') { if (recule) sons.rebond(); else sons.pas(); }
    else if (k === 'contour') sons.contour();
    else if (k === 'saut') sons.saut();
    else if (k === 'liane') sons.liane();
    else if (k === 'ptero') sons.ptero();
    else if (k === 'pente') sons.pente();
  }

  function jaillirCase(i, qui, n) {
    if (!vue || !geo || !geo.pts[i]) return;
    const p = geo.pts[i];
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 160;
      const coul = qui === -2 ? '#7a5230' : qui === -1 ? '#ffd34d' : (k % 2 ? COUL[qui] : '#ffe066');
      particules.push({ x: p[0], y: p[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v - 150, vie: 0.6 + Math.random() * 0.4, k: geo.s * (0.06 + Math.random() * 0.06), coul: coul, etoile: qui !== -2 && k % 3 !== 0 });
    }
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    const maintenant = performance.now();
    if (!anim && file.length && geo) demarrerAnim(maintenant);
    if (anim && maintenant - anim.t0 >= anim.total) finirAnim();
    dessinerJeu(maintenant, dt);
    majTemps();
    majCompte();
    if (annonce.texte && Date.now() >= annonce.fin) { annonce.texte = ''; majInfos(); }
    rafId = requestAnimationFrame(boucle);
  }

  let fondCache = null;
  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cleFond = w + 'x' + h + 'x' + dpr;
    if (!fondCache || fondCache.cle !== cleFond) {
      const f = document.createElement('canvas'); f.width = Math.round(w * dpr); f.height = Math.round(h * dpr);
      const fc = f.getContext('2d'); fc.setTransform(dpr, 0, 0, dpr, 0, 0); fondJungle(fc, w, h, 0);
      fondCache = { cle: cleFond, cv: f };
    }
    c.drawImage(fondCache.cv, 0, 0, w, h);
    if (!vue) { geo = null; return; }
    if (!geo || geo.cle !== vue.L + '|' + cleFond) { geo = disposer(vue.L, w, h, false); geo.cle = vue.L + '|' + cleFond; }
    dessinerChemin(c, vue, geo, t, {});
    dessinerApercu(c, t);
    dessinerDinos(c, vue, geo, t);
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      if (p.etoile) etincelle(c, p.x, p.y, p.k); else { rond(c, p.x, p.y, p.k * 0.5); c.fill(); }
      c.globalAlpha = 1;
    }
  }

  // Aperçu de la pierre choisie (ou survolée) : trajet et case d'arrivée.
  function dessinerApercu(c, t) {
    const a = choix >= 0 ? choix : survolPierre;
    if (a < 0 || !peutJouer() || !R.valide(vue, partie.siege, a)) return;
    const s = partie.siege, val = a === 3 ? 4 : vue.main[a];
    const r = O.deplacer(vue, s, val);
    const g = geo;
    let prec = vue.pos[s];
    c.save();
    c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = Math.max(3, g.s * 0.07); c.setLineDash([g.s * 0.1, g.s * 0.09]); c.lineCap = 'round';
    c.beginPath(); c.moveTo(g.pts[prec][0], g.pts[prec][1]);
    r.et.forEach((x) => { const p = g.pts[x.p]; c.lineTo(p[0], p[1]); prec = x.p; });
    c.stroke(); c.setLineDash([]);
    const p = g.pts[r.p];
    const pulse = 0.5 + 0.5 * Math.sin(t / 180);
    c.strokeStyle = r.boue ? '#ff6b4a' : '#fff36b'; c.lineWidth = Math.max(3, g.s * 0.08);
    rond(c, p[0], p[1], g.s * (0.44 + pulse * 0.05)); c.stroke();
    c.globalAlpha = 0.5;
    dino(c, s, p[0], p[1] - g.s * 0.05, g.s * 0.3, { chapeau: chapeauDe(s), ombre: false });
    c.restore();
  }

  function dessinerDinos(c, e, g, t) {
    const tour = !e.fini && partie && partie.phase === 'jeu' && !anim && !file.length ? R.aQui(e) : -1;
    const parCase = {};
    for (let s = 0; s < PLACES; s++) {
      if (anim && anim.s === s) continue;
      (parCase[e.pos[s]] = parCase[e.pos[s]] || []).push(s);
    }
    const dessins = [];
    Object.keys(parCase).forEach((i) => {
      const l = parCase[i];
      l.forEach((s, k) => {
        const q = placeSurCase(g, +i, k, l.length);
        dessins.push({ s: s, x: q[0], y: q[1], n: l.length });
      });
    });
    if (anim) {
      const q = positionAnim(t);
      dessins.push({ s: anim.s, x: q.x, y: q.y, k: q.k, u: q.u, anim: true });
    }
    dessins.sort((a, b) => a.y - b.y);
    dessins.forEach((d) => {
      const s = d.s;
      // plus petits quand plusieurs bébés dinos se serrent sur une case
      const r = g.s * (d.n >= 3 ? 0.23 : d.n === 2 ? 0.27 : 0.32);
      if (s === tour) {
        const pulse = 0.5 + 0.5 * Math.sin(t / 200);
        c.strokeStyle = COUL[s]; c.lineWidth = Math.max(3, g.s * 0.06);
        ell(c, d.x, d.y + r * 0.8, r * (1.1 + pulse * 0.15), r * 0.35); c.stroke();
      }
      if (d.anim && d.k === 'ptero') {
        ptero(c, d.x, d.y - r * 1.2, r * 1.1, t, true);
      }
      const coince = !d.anim && e.passe[s] > 0;
      const bond = !d.anim && s === tour ? Math.abs(Math.sin(t / 240)) * r * 0.15 : 0;
      dino(c, s, d.x, d.y - r * 0.15 - bond, r, { chapeau: chapeauDe(s), sens: 1, ecrase: coince ? 0.85 : 1 });
      if (coince) { c.fillStyle = 'rgba(110,74,42,.85)'; ell(c, d.x, d.y + r * 0.75, r * 1.0, r * 0.3); c.fill(); }
      if (s === monSiege()) {
        // petite étoile « Toi » au-dessus de son bébé dino
        c.fillStyle = '#ffd84d'; c.strokeStyle = '#7a4f00'; c.lineWidth = 1.5;
        const sx = d.x, sy = d.y - r * (s === 2 ? 2.2 : 1.6) - bond, k = r * 0.32;
        c.beginPath();
        for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? k * 0.45 : k; c.lineTo(sx + Math.cos(a) * rr2, sy + Math.sin(a) * rr2); }
        c.closePath(); c.fill(); c.stroke();
      }
    });
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function viderAnimations() { file.length = 0; anim = null; finAttendue = null; particules.length = 0; choix = -1; annonce = { texte: '', fin: 0 }; }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    viderAnimations();
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // Salon d'attente (en ligne) : le premier joueur arrivé lance la course.
  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + chapeauDe(s) + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 120, 112);
        medaillon(c, s, 60, 64, 44, { chapeau: chapeauDe(s) });
        if (info.chef) couronne(c, 60, 24, 24);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { animal: tr('animal.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { animal: nomChef ? nomChef + ' · ' + tr('animal.' + partie.chef) : tr('animal.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    viderAnimations();
    vue = JSON.parse(JSON.stringify(partie.etat));
    geo = null;
    debutTour = Date.now();
    dernierTic = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    if (R.aQui(vue) === partie.siege) sons.tour();
  }

  function surAction(ev) {
    file.push({ apres: JSON.parse(JSON.stringify(ev.apres)), moi: ev.moi, auto: ev.auto });
    choix = -1;
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    const montrer = () => { if (enLigne) afficherFinEnLigne(); else afficherFin(); };
    if (anim || file.length) finAttendue = montrer;
    else { const j = jeton; setTimeout(() => { if (j === jeton && partie) montrer(); }, 700); }
  }

  // Place d'un dino : 1 + ceux qui sont strictement devant (à égalité de cases, même place).
  function rangDe(e, s) {
    const cle = (q) => (q === e.gagnant ? 100000 : e.pos[q]);
    let r = 1;
    for (let q = 0; q < PLACES; q++) if (q !== s && cle(q) > cle(s)) r++;
    return r;
  }

  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    vue = JSON.parse(JSON.stringify(e));
    const moi = partie.siege;
    const gagne = moi >= 0 && e.gagnant === moi;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de course : victoire, défaite, classement
  // ---------------------------------------------------------------------

  const etoilesPour = (rang) => (rang >= 1 && rang <= 3 ? 4 - rang : 0);

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    ordre.forEach((s) => {
      const l = document.createElement('div');

  }

  // Pierre dessinée dans un repère déjà placé (tutoriel).
  function dessinerPierreDans(c, w, h, n, choisie) { dessinerPierre(c, w, h, n, choisie, true); }

  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#3a2a14'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Gestes : pierres au doigt ou à la souris, clavier
  // ---------------------------------------------------------------------

  function attendsTonTour() {
    if (Date.now() - dernierAttends > 1500 && partie && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
  }

  function choisirPierre(a) {
    if (!peutJouer()) { attendsTonTour(); return; }
    if (!R.valide(vue, partie.siege, a)) return;
    if (choix === a) { jouerPierre(); return; }
    choix = a;
    sons.choix();
    majPierres();
  }

  function jouerPierre() {
    if (!peutJouer() || choix < 0) return;
    const a = choix;
    if (!R.valide(vue, partie.siege, a)) return;
    if (partie.jouer(a)) { choix = -1; survolPierre = -1; majPierres(); }
  }

  for (let a = 0; a < 4; a++) {
    const b = $('pierre-' + a);
    b.addEventListener('click', () => { audio(); choisirPierre(a); });
    b.addEventListener('pointerenter', (ev) => { if (ev.pointerType === 'mouse') survolPierre = a; });
    b.addEventListener('pointerleave', () => { survolPierre = -1; });
  }
  $('btn-avance').addEventListener('click', () => { audio(); jouerPierre(); });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const touches = { Digit1: 0, Numpad1: 0, Digit2: 1, Numpad2: 1, Digit3: 2, Numpad3: 2, Digit4: 3, Numpad4: 3 };
    if (ev.code in touches) { ev.preventDefault(); audio(); choisirPierre(touches[ev.code]); return; }
    if (ev.code === 'ArrowLeft' || ev.code === 'ArrowRight') {
      ev.preventDefault(); audio();
      if (!peutJouer()) { attendsTonTour(); return; }
      const valides = [0, 1, 2, 3].filter((a) => R.valide(vue, partie.siege, a));
      let i = valides.indexOf(choix);
      i = i < 0 ? 0 : (i + (ev.code === 'ArrowRight' ? 1 : valides.length - 1)) % valides.length;
      choix = valides[i]; sons.choix(); majPierres();
      return;
    }
    if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement.id !== 'btn-avance') return;
      ev.preventDefault(); audio();
      if (!peutJouer()) { attendsTonTour(); return; }
      if (choix < 0) { choix = 0; sons.choix(); majPierres(); return; }
      jouerPierre();
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-nurserie').addEventListener('click', () => { audio(); sons.clic(); ouvrirNurserie(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('nur-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.pos[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { geo = null; });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
})();
</script>
</body>
</html>
