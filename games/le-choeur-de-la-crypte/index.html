<script>
(function () {
  'use strict';

  // =====================================================================
  //  Le Chœur de la Crypte — jeu de mémoire musicale (13+)
  //  À tour de rôle, on rejoue le chant de l'orgue puis on ajoute une note.
  //  Fausse note : la main squelettique avance vers ta bougie. Solo : 20
  //  niveaux contre des robots. En ligne : de vrais joueurs remplacent les
  //  robots (moteur commun JEL_MULTI). Règles et niveaux : bloc jel-regles.
  // =====================================================================

  const JEU = 'le-choeur-de-la-crypte';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = R.niveaux;
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);
  const copie = (x) => JSON.parse(JSON.stringify(x));

  // Une couleur et un emblème par place : chauve-souris, corbeau, chat, araignée, hibou.
  const COUL = ['#ffb84a', '#5cc8ff', '#ff5d7a', '#7ee06a', '#c48cff'];
  const COUL_F = ['#8a5300', '#145a80', '#801a30', '#2c6a1e', '#55288a'];
  // Couleur des gemmes des tuyaux (de gauche à droite).
  const GEMMES = ['#ff5d5d', '#ffb340', '#ffe45c', '#5ddc7a', '#4fc3ff', '#8c8cff', '#e07dff'];

  // Orgues : couleurs, timbre et gamme ; débloqués avec les étoiles.
  const ORGUES = [
    { id: 'pierre', seuil: 0, haut: '#7a7486', bas: '#3b3646', bord: '#a39cb0', type: 'triangle', filtre: 2400,
      gamme: [220, 261.63, 293.66, 329.63, 392, 440, 523.25] },
    { id: 'os', seuil: 15, haut: '#efe4c8', bas: '#a8977a', bord: '#fff7e2', type: 'sawtooth', filtre: 1500,
      gamme: [293.66, 311.13, 349.23, 392, 440, 466.16, 587.33] },
    { id: 'cristal', seuil: 30, haut: '#3c5a8c', bas: '#141d33', bord: '#a8d4ff', type: 'sine', filtre: 5000,
      gamme: [329.63, 369.99, 392, 493.88, 523.25, 622.25, 659.25] },
    { id: 'racines', seuil: 45, haut: '#6e4a2a', bas: '#2e1d10', bord: '#8fb35a', type: 'square', filtre: 1100,
      gamme: [196, 233.08, 261.63, 293.66, 349.23, 392, 466.16] }
  ];

  // Partitions maudites : une par crypte bonus gagnée (niveaux 5, 10, 15, 20),
  // chacune rejoue son petit chant quand on la touche.
  const PARTITIONS = [
    { niveau: 5, chant: [0, 2, 1, 3, 2, 4, 3, 1] },
    { niveau: 10, chant: [4, 3, 4, 1, 2, 0, 1, 0] },
    { niveau: 15, chant: [2, 2, 5, 4, 3, 1, 3, 0] },
    { niveau: 20, chant: [6, 4, 5, 3, 4, 2, 1, 0, 6] }
  ];

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#1b1724"/><circle cx="10.4" cy="8" r="1.6" fill="#1b1724"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#1b1724"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';

  // Tutoriels : orgue miniature, notes jouées par l'orgue (o) ou par la main (m).
  // f : fausse note (main squelettique), s : note sautée (tuyau maudit).
  const TUTOS = {
    base: { k: 4, etapes: [['o', 0], ['o', 2], ['m', 0], ['m', 2], ['m', 3, 'ajout']] },
    main: { k: 4, bougie: true, etapes: [['o', 1], ['o', 3], ['m', 1], ['m', 0, 'f']] },
    tuyau: { k: 5, etapes: [['o', 4], ['o', 1], ['m', 4], ['m', 1], ['m', 3, 'ajout']] },
    maudit: { k: 5, maudit: 2, etapes: [['o', 1], ['o', 2], ['o', 3], ['m', 1], ['m', 2, 's'], ['m', 3], ['m', 0, 'ajout']] },
    bonus: { k: 5, bougie: true, bonus: true, etapes: [['o', 0], ['o', 3], ['o', 1], ['m', 0], ['m', 3], ['m', 1], ['m', 4, 'ajout']] },
    rebours: { k: 5, rebours: true, etapes: [['o', 0], ['o', 1], ['o', 3], ['m', 3], ['m', 1], ['m', 0], ['m', 4, 'ajout']] },
    brouillard: { k: 6, brume: 1, etapes: [['o', 0], ['o', 3], ['o', 4], ['m', 0], ['m', 3], ['m', 4], ['m', 1, 'ajout']] },
    echo: { k: 6, echange: [1, 4], etapes: [['o', 1], ['o', 4], ['m', 1], ['m', 4], ['m', 2, 'ajout']] }
  };

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = {
    etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, tutos: [],
    orgue: 0, partitions: PARTITIONS.map(() => false), options: { son: true }
  };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 9999, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string' && TUTOS[x]);
      if (Array.isArray(d.partitions)) prog.partitions = PARTITIONS.map((_, i) => d.partitions[i] === true);
      prog.orgue = entier(d.orgue, 0, ORGUES.length - 1, 0);
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
    if (!orgueOuvert(prog.orgue)) prog.orgue = 0;
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.orgue = 0;
    prog.partitions = PARTITIONS.map(() => false);
  }

  function sauver(niveauReprise, score) {
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
        debloque: prog.debloque, tutos: prog.tutos.slice(), orgue: prog.orgue, partitions: prog.partitions.slice(),
        options: { son: prog.options.son }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Réglages changés hors d'une partie (son, orgue) : seulement si une sauvegarde existe déjà.
  function sauverReglages() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: prog.options.son }, orgue: prog.orgue }); } catch (e) { /* rien */ }
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);
  const orgueOuvert = (i) => totalEtoiles() >= ORGUES[i].seuil;

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null, echoEntree = null, bruit = null;
  function audio() {
    try {
      if (!ac) {
        const C = window.AudioContext || window.webkitAudioContext;
        if (C) {
          ac = new C();
          // Écho de la crypte : un retard qui se répète doucement.
          const d = ac.createDelay(1); d.delayTime.value = 0.23;
          const fb = ac.createGain(); fb.gain.value = 0.32;
          const sortie = ac.createGain(); sortie.gain.value = 0.35;
          d.connect(fb); fb.connect(d); d.connect(sortie); sortie.connect(ac.destination);
          echoEntree = d;
          const n = ac.sampleRate * 1.2;
          bruit = ac.createBuffer(1, n, ac.sampleRate);
          const data = bruit.getChannelData(0);
          for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
        }
      }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }

  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      if (o.detune) osc.detune.value = o.detune;
      const v = o.vol || 0.1;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + (o.attaque || Math.min(0.025, d / 4)));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      osc.connect(g); sortie.connect(ac.destination);
      if (o.echo && echoEntree) sortie.connect(echoEntree);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }

  function souffle(d, o) {
    o = o || {};
    if (!ac || !prog.options.son || !bruit) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const src = ac.createBufferSource(); src.buffer = bruit;
      const fl = ac.createBiquadFilter(); fl.type = o.passe || 'bandpass'; fl.frequency.setValueAtTime(o.f1 || 800, t);
      if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t + d);
      fl.Q.value = o.q || 1;
      const g = ac.createGain();
      const v = o.vol || 0.1;
      if (o.monte) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + d * 0.95); g.gain.setValueAtTime(0.0001, t + d); }
      else { g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); }
      src.connect(fl); fl.connect(g); g.connect(ac.destination);
      if (o.echo && echoEntree) g.connect(echoEntree);
      src.start(t); src.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }

  // Voix d'un tuyau : fondamentale, octave et quinte, avec l'écho de la crypte.
  function voixTuyau(v, duree, orgue) {
    const o = ORGUES[orgue === undefined ? orgueActuel() : orgue];
    const f = o.gamme[Math.max(0, Math.min(6, v))];
    const d = duree || 0.42;
    note(f, d, { type: o.type, vol: 0.09, filtre: o.filtre, attaque: 0.03, echo: true });
    note(f * 2, d * 0.9, { type: 'sine', vol: 0.035, attaque: 0.03 });
    note(f * 1.5, d * 0.8, { type: 'sine', vol: 0.02, attaque: 0.04 });
  }

  const sons = {
    clic: () => note(700, 0.05, { type: 'triangle', vol: 0.06 }),
    faux: () => {
      [92, 97.5, 103].forEach((f, i) => note(f, 0.55, { type: 'sawtooth', vol: 0.06, filtre: 900, detune: i * 12, echo: true }));
      [0, 0.07, 0.13, 0.22].forEach((r) => souffle(0.04, { f1: 2600, q: 6, vol: 0.12, retard: r }));
    },
    main: () => souffle(0.4, { f1: 300, f2: 1400, q: 3, vol: 0.09, retard: 0.15 }),
    eteinte: () => { souffle(0.7, { passe: 'lowpass', f1: 1600, f2: 120, vol: 0.18, retard: 0.3 }); note(70, 1, { type: 'sine', vol: 0.12, retard: 0.3 }); },
    maudit: () => { note(65, 0.9, { type: 'sawtooth', vol: 0.07, filtre: 400, echo: true }); note(98, 0.7, { type: 'sawtooth', vol: 0.04, filtre: 500, detune: 30 }); },
    rebours: () => souffle(0.6, { f1: 400, f2: 3000, q: 2, vol: 0.12, monte: true }),
    echo: () => { note(400, 0.6, { vol: 0.06, vers: 800, echo: true }); note(800, 0.6, { vol: 0.06, vers: 400, echo: true }); },
    brume: () => souffle(0.9, { passe: 'lowpass', f1: 500, f2: 300, vol: 0.06 }),
    victoire: () => {
      const o = ORGUES[orgueActuel()];
      [0, 2, 4, 6].forEach((k, i) => note(o.gamme[Math.min(6, k)], 0.9, { type: o.type, vol: 0.07, filtre: o.filtre, retard: i * 0.14, echo: true }));
    },
    defaite: () => [196, 185, 155.6, 98].forEach((f, i) => note(f, 0.6, { type: 'sawtooth', vol: 0.06, filtre: 700, retard: i * 0.2, echo: true })),
    tic: () => note(1250, 0.04, { type: 'square', vol: 0.03 }),
    arrive: () => { note(523, 0.14, { vol: 0.08 }); note(784, 0.18, { vol: 0.08, retard: 0.1 }); },
    part: () => { note(784, 0.14, { vol: 0.07 }); note(523, 0.18, { vol: 0.07, retard: 0.1 }); },
    tour: () => { note(880, 0.1, { vol: 0.06 }); note(1320, 0.12, { vol: 0.05, retard: 0.08 }); },
    non: () => note(160, 0.12, { type: 'triangle', vol: 0.06 })
  };

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.textContent = prog.options.son ? '🔊' : '🔇';
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    sauverReglages();
    majBoutonsSon();
    sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Dessins (canvas) : outils, tuyaux, bougies, emblèmes, décor
  // ---------------------------------------------------------------------

  function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }
  function rond(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r);
    else { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  }

  // Petit crâne (tuyau maudit, décor).
  function crane(c, x, y, r, coul) {
    c.save();
    c.fillStyle = coul || '#e9e2d0';
    rond(c, x, y, r); c.fill();
    rr(c, x - r * 0.6, y + r * 0.55, r * 1.2, r * 0.6, r * 0.2); c.fill();
    c.fillStyle = '#120e18';
    ell(c, x - r * 0.4, y + r * 0.05, r * 0.28, r * 0.32); c.fill();
    ell(c, x + r * 0.4, y + r * 0.05, r * 0.28, r * 0.32); c.fill();
    c.beginPath(); c.moveTo(x, y + r * 0.35); c.lineTo(x - r * 0.12, y + r * 0.6); c.lineTo(x + r * 0.12, y + r * 0.6); c.closePath(); c.fill();
    c.fillRect(x - r * 0.35, y + r * 0.85, r * 0.1, r * 0.3); c.fillRect(x - r * 0.05, y + r * 0.85, r * 0.1, r * 0.3); c.fillRect(x + r * 0.25, y + r * 0.85, r * 0.1, r * 0.3);
    c.restore();
  }

  // Un tuyau d'orgue. x, y : coin haut gauche ; w, h ; o : options.
  function dessinerTuyau(c, x, y, w, h, o) {
    const org = ORGUES[o.orgue || 0];
    const lum = o.lum || 0, gem = GEMMES[o.idx % GEMMES.length];
    c.save();
    if (o.maudit) {
      c.shadowColor = '#b05cff'; c.shadowBlur = 18 + 8 * Math.sin((o.t || 0) / 160);
    } else if (lum > 0.01) {
      c.shadowColor = gem; c.shadowBlur = 30 * lum;
    }
    // corps
    const g = c.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, org.bas); g.addColorStop(0.35, org.haut); g.addColorStop(0.6, org.haut); g.addColorStop(1, org.bas);
    c.fillStyle = g;
    rr(c, x, y + w * 0.35, w, h - w * 0.35, Math.min(8, w * 0.18)); c.fill();
    c.shadowBlur = 0;
    // chapeau en pointe
    c.beginPath(); c.moveTo(x - w * 0.06, y + w * 0.42); c.lineTo(x + w / 2, y); c.lineTo(x + w * 1.06, y + w * 0.42); c.closePath();
    c.fillStyle = org.bas; c.fill();
    c.strokeStyle = org.bord; c.lineWidth = Math.max(1, w * 0.04); c.stroke();
    // détails selon l'orgue
    c.strokeStyle = org.bord; c.globalAlpha = 0.45; c.lineWidth = Math.max(1, w * 0.03);
    if (org.id === 'os') {
      for (let k = 1; k < 6; k++) { const yy = y + w * 0.4 + (h - w * 0.4) * k / 6; c.beginPath(); c.moveTo(x + w * 0.12, yy); c.quadraticCurveTo(x + w / 2, yy - w * 0.12, x + w * 0.88, yy); c.stroke(); }
    } else if (org.id === 'racines') {
      c.beginPath(); c.moveTo(x + w * 0.3, y + h); c.bezierCurveTo(x + w * 0.9, y + h * 0.7, x + w * 0.1, y + h * 0.45, x + w * 0.6, y + w * 0.5); c.stroke();
      c.fillStyle = '#6f9a3a'; c.globalAlpha = 0.7; ell(c, x + w * 0.2, y + h * 0.62, w * 0.18, w * 0.08); c.fill(); ell(c, x + w * 0.78, y + h * 0.38, w * 0.15, w * 0.07); c.fill();
    } else if (org.id === 'cristal') {
      c.globalAlpha = 0.5; c.fillStyle = '#ffffff';
      c.fillRect(x + w * 0.18, y + w * 0.5, w * 0.08, h * 0.55);
    } else {
      for (let k = 1; k < 5; k++) { const yy = y + w * 0.4 + (h - w * 0.4) * k / 5; c.beginPath(); c.moveTo(x + 2, yy); c.lineTo(x + w - 2, yy); c.stroke(); }
    }
    c.globalAlpha = 1;
    // bouche du tuyau
    c.fillStyle = '#0a0710';
    ell(c, x + w / 2, y + h * 0.62, w * 0.3, w * 0.12); c.fill();
    // lumière de la note
    if (lum > 0.01) {
      c.globalAlpha = 0.55 * lum;
      c.fillStyle = gem;
      rr(c, x, y + w * 0.35, w, h - w * 0.35, Math.min(8, w * 0.18)); c.fill();
      c.globalAlpha = 0.35 * lum;
      const fx = c.createLinearGradient(0, y - h * 0.5, 0, y + w * 0.4);
      fx.addColorStop(0, 'rgba(0,0,0,0)'); fx.addColorStop(1, gem);
      c.fillStyle = fx;
      c.beginPath(); c.moveTo(x - w * 0.2, y - h * 0.5); c.lineTo(x + w * 1.2, y - h * 0.5); c.lineTo(x + w, y + w * 0.4); c.lineTo(x, y + w * 0.4); c.closePath(); c.fill();
      c.globalAlpha = 1;
    }
    // gemme
    c.fillStyle = gem;
    c.shadowColor = gem; c.shadowBlur = 6 + 14 * lum;
    c.beginPath();
    const gx = x + w / 2, gy = y + w * 0.62, gr = w * 0.2;
    c.moveTo(gx, gy - gr); c.lineTo(gx + gr * 0.8, gy); c.lineTo(gx, gy + gr); c.lineTo(gx - gr * 0.8, gy); c.closePath(); c.fill();
    c.shadowBlur = 0;
    c.fillStyle = '#ffffffaa'; rond(c, gx - gr * 0.25, gy - gr * 0.3, gr * 0.2); c.fill();
    // crâne gravé au pied (violet pour le tuyau maudit)
    crane(c, x + w / 2, y + h - w * 0.55, w * 0.22, o.maudit ? '#d9a8ff' : (org.id === 'os' ? '#fff6e0' : '#bfb6a8'));
    if (o.maudit) {
      c.strokeStyle = '#b05cff'; c.lineWidth = Math.max(2, w * 0.06); c.globalAlpha = 0.85;
      c.beginPath(); c.moveTo(x - 2, y + h * 0.3); c.lineTo(x + w + 2, y + h * 0.5); c.moveTo(x + w + 2, y + h * 0.3); c.lineTo(x - 2, y + h * 0.5); c.stroke();
      c.globalAlpha = 1;
    }
    // brouillard : ce tuyau ne s'allume plus quand un autre joue
    if (o.brume) {
      const tt = (o.t || 0) / 900;
      c.fillStyle = 'rgba(200,210,220,0.33)';
      for (let k = 0; k < 4; k++) { ell(c, x + w / 2 + Math.sin(tt + k * 1.7) * w * 0.25, y + h * (0.25 + k * 0.18), w * 0.75, w * 0.32); c.fill(); }
    }
    c.restore();
  }

  // Emblème d'une place (silhouette) centré en (x, y), taille r.
  function embleme(c, s, x, y, r, coul) {
    c.save();
    c.translate(x, y); c.scale(r / 10, r / 10);
    c.fillStyle = coul || COUL[s];
    c.beginPath();
    if (s === 0) { // chauve-souris
      c.moveTo(0, -2); c.lineTo(-2, -5); c.lineTo(-1, -1); c.quadraticCurveTo(-6, -6, -10, -3); c.quadraticCurveTo(-8, 0, -9, 3);
      c.quadraticCurveTo(-6, 1, -4, 4); c.quadraticCurveTo(-2, 2, 0, 5); c.quadraticCurveTo(2, 2, 4, 4); c.quadraticCurveTo(6, 1, 9, 3);
      c.quadraticCurveTo(8, 0, 10, -3); c.quadraticCurveTo(6, -6, 1, -1); c.lineTo(2, -5); c.closePath(); c.fill();
    } else if (s === 1) { // corbeau
      ell(c, -1, 2, 6, 4.5, -0.2); c.fill(); rond(c, 4, -3, 3.2); c.fill();
      c.beginPath(); c.moveTo(6.5, -3.5); c.lineTo(10, -2); c.lineTo(6.5, -1.5); c.fill();
      c.beginPath(); c.moveTo(-6, 2); c.lineTo(-10, 5); c.lineTo(-5, 5); c.fill();
      c.fillStyle = '#fff'; rond(c, 4.8, -3.6, 0.8); c.fill();
    } else if (s === 2) { // chat
      ell(c, 0, 3, 6, 6); c.fill(); rond(c, 0, -4, 4.5); c.fill();
      c.beginPath(); c.moveTo(-4.3, -5); c.lineTo(-4, -10); c.lineTo(-1, -7); c.fill();
      c.beginPath(); c.moveTo(4.3, -5); c.lineTo(4, -10); c.lineTo(1, -7); c.fill();
      c.strokeStyle = c.fillStyle; c.lineWidth = 1.6; c.beginPath(); c.moveTo(5, 7); c.quadraticCurveTo(11, 6, 9, -1); c.stroke();
      c.fillStyle = '#fff6a8'; ell(c, -1.7, -4.3, 0.9, 1.2); c.fill(); ell(c, 1.7, -4.3, 0.9, 1.2); c.fill();
    } else if (s === 3) { // araignée
      rond(c, 0, 2, 4.5); c.fill(); rond(c, 0, -4, 2.8); c.fill();
      c.strokeStyle = c.fillStyle; c.lineWidth = 1.3;
      for (let k = 0; k < 4; k++) {
        const yy = -2 + k * 2;
        c.beginPath(); c.moveTo(-3, yy); c.lineTo(-7, yy - 3 + k); c.lineTo(-9, yy + 1 + k); c.stroke();
        c.beginPath(); c.moveTo(3, yy); c.lineTo(7, yy - 3 + k); c.lineTo(9, yy + 1 + k); c.stroke();
      }
    } else { // hibou
      ell(c, 0, 2, 6.5, 7.5); c.fill();
      c.beginPath(); c.moveTo(-6, -4); c.lineTo(-5, -10); c.lineTo(-2, -5); c.fill();
      c.beginPath(); c.moveTo(6, -4); c.lineTo(5, -10); c.lineTo(2, -5); c.fill();
      c.fillStyle = '#fff6a8'; rond(c, -2.6, -1.5, 2.2); c.fill(); rond(c, 2.6, -1.5, 2.2); c.fill();
      c.fillStyle = '#120e18'; rond(c, -2.6, -1.5, 1); c.fill(); rond(c, 2.6, -1.5, 1); c.fill();
    }
    c.restore();
  }

  // Main squelettique qui avance depuis la droite (k de 0 à 1 : distance parcourue).
  function mainSquelette(c, x, y, s, coul) {
    c.save();
    c.translate(x, y); c.scale(s, s);
    c.strokeStyle = coul || '#e9e2d0'; c.fillStyle = coul || '#e9e2d0';
    c.lineCap = 'round'; c.lineWidth = 2.2;
    // avant-bras
    c.beginPath(); c.moveTo(30, 6); c.lineTo(14, 3); c.moveTo(30, 10); c.lineTo(14, 7); c.stroke();
    // paume
    rr(c, 6, -1, 9, 11, 3); c.fill();
    // doigts crochus
    c.lineWidth = 1.8;
    [-1, 2.5, 6, 9.5].forEach((dy, i) => {
      c.beginPath(); c.moveTo(7, dy + 0.5); c.lineTo(1 - i * 0.3, dy - 1); c.lineTo(-3, dy + 1.5); c.stroke();
      rond(c, 1 - i * 0.3, dy - 1, 0.9); c.fill();
    });
    c.beginPath(); c.moveTo(10, 10); c.lineTo(7, 14); c.lineTo(4, 14); c.stroke();
    c.restore();
  }

  // Bougie d'une place, avec la main et les crans. w × h en pixels du canvas.
  function dessinerBougie(c, w, h, s, info, t) {
    const cr = info.cr || 0, mx = info.mx || 3, eteinte = !!info.eteinte;
    const cx = w * 0.42, base = h * 0.92, haut = h * 0.48, lw = w * 0.2;
    // bougeoir
    c.fillStyle = '#6b5a45'; ell(c, cx, base, w * 0.28, h * 0.05); c.fill();
    // cire
    const g = c.createLinearGradient(cx - lw / 2, 0, cx + lw / 2, 0);
    g.addColorStop(0, COUL_F[s]); g.addColorStop(0.5, COUL[s]); g.addColorStop(1, COUL_F[s]);
    c.fillStyle = g; c.fillRect(cx - lw / 2, haut, lw, base - haut);
    c.fillStyle = COUL[s]; ell(c, cx, haut, lw / 2, h * 0.025); c.fill();
    // coulures
    c.fillStyle = COUL[s]; rr(c, cx - lw / 2, haut, lw * 0.3, h * 0.12, 3); c.fill();
    // mèche
    c.strokeStyle = '#1a1a1a'; c.lineWidth = 2; c.beginPath(); c.moveTo(cx, haut); c.lineTo(cx, haut - h * 0.06); c.stroke();
    if (!eteinte) {
      const v = Math.sin(t / 90 + s * 2) * 0.12 + Math.sin(t / 37 + s) * 0.06;
      c.save();
      c.shadowColor = '#ffb84a'; c.shadowBlur = 16;
      c.fillStyle = '#ffcf6b';
      c.beginPath(); c.moveTo(cx, haut - h * (0.3 + v * 0.3)); c.quadraticCurveTo(cx + w * 0.11, haut - h * 0.1, cx, haut - h * 0.04); c.quadraticCurveTo(cx - w * 0.11, haut - h * 0.1, cx, haut - h * (0.3 + v * 0.3)); c.fill();
      c.shadowBlur = 0;
      c.fillStyle = '#fff6d8'; ell(c, cx, haut - h * 0.1, w * 0.035, h * 0.05); c.fill();
      c.restore();
    } else {
      c.strokeStyle = 'rgba(190,190,200,.6)'; c.lineWidth = 2;
      c.beginPath();
      const ph = t / 300;
      c.moveTo(cx, haut - h * 0.06);
      for (let k = 1; k < 6; k++) c.lineTo(cx + Math.sin(ph + k) * w * 0.06, haut - h * 0.06 - k * h * 0.06);
      c.stroke();
    }
    // main squelettique : avance d'un cran à chaque fausse note
    const k = Math.min(1, cr / mx);
    const mxp = w * 0.8 - k * (w * 0.8 - (cx + lw * 0.65));
    mainSquelette(c, mxp, h * 0.58, w / 48, '#e9e2d0');
    // crans
    for (let i = 0; i < mx; i++) {
      c.fillStyle = i < cr ? '#ff4d5e' : '#ffffff30';
      rond(c, w * 0.18, h * (0.86 - i * 0.14), w * 0.05); c.fill();
    }
    // emblème
    embleme(c, s, w * 0.17, h * 0.13, w * 0.1);
  }

  // Couronne du chef (salon, places).
  function couronne(c, x, y, k) {
    c.save();
    c.translate(x, y);
    c.fillStyle = '#ffd27a'; c.strokeStyle = '#8a5300'; c.lineWidth = Math.max(1, k * 0.08);
    c.beginPath();
    c.moveTo(-k, 0); c.lineTo(-k, -k * 0.75); c.lineTo(-k * 0.5, -k * 0.35); c.lineTo(0, -k); c.lineTo(k * 0.5, -k * 0.35); c.lineTo(k, -k * 0.75); c.lineTo(k, 0);
    c.closePath(); c.fill(); c.stroke();
    c.restore();
  }

  // Médaillon d'une place (salon, classement) : emblème dans un rond.
  function medaillon(c, s, x, y, r) {
    c.fillStyle = '#1b1724'; rond(c, x, y, r); c.fill();
    c.strokeStyle = COUL[s]; c.lineWidth = r * 0.12; rond(c, x, y, r * 0.92); c.stroke();
    embleme(c, s, x, y, r * 0.62);
  }

  // Mur de pierre de la crypte.
  function murCrypte(c, w, h, teinte) {
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, teinte ? '#1d2a24' : '#1a1522'); g.addColorStop(1, '#09070d');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.strokeStyle = 'rgba(255,255,255,0.045)'; c.lineWidth = 1;
    const bh = 26;
    for (let y = 0, r = 0; y < h; y += bh, r++) {
      c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke();
      for (let x = (r % 2) * 30; x < w; x += 60) { c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + bh); c.stroke(); }
    }
  }

  // Arche gothique centrée.
  function arche(c, cx, y, w, h, fond) {
    c.save();
    c.beginPath();
    c.moveTo(cx - w / 2, y + h); c.lineTo(cx - w / 2, y + w * 0.5);
    c.quadraticCurveTo(cx - w / 2, y, cx, y - w * 0.12);
    c.quadraticCurveTo(cx + w / 2, y, cx + w / 2, y + w * 0.5);
    c.lineTo(cx + w / 2, y + h); c.closePath();
    c.fillStyle = fond; c.fill();
    c.strokeStyle = 'rgba(160,150,180,0.35)'; c.lineWidth = Math.max(3, w * 0.04); c.stroke();
    c.restore();
  }

  // Toile d'araignée dans un coin.
  function toile(c, x, y, r, sx, sy) {
    c.save(); c.translate(x, y); c.scale(sx, sy);
    c.strokeStyle = 'rgba(220,220,230,0.22)'; c.lineWidth = 1;
    for (let k = 0; k <= 5; k++) { const a = k / 5 * Math.PI / 2; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * r, Math.sin(a) * r); c.stroke(); }
    for (let n = 1; n <= 4; n++) {
      c.beginPath();
      for (let k = 0; k <= 5; k++) { const a = k / 5 * Math.PI / 2, rr2 = r * n / 4.4; const px = Math.cos(a) * rr2, py = Math.sin(a) * rr2; if (k) c.quadraticCurveTo(px * 0.85 + 2, py * 0.85 + 2, px, py); else c.moveTo(px, py); }
      c.stroke();
    }
    c.restore();
  }

  // Écran titre (et jaquette) : crypte, arche au clair de lune, orgue, bougies, main.
  function dessinerTitre(t) {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    t = t || 0;
    murCrypte(c, w, h);
    const cx = w / 2;
    const L = Math.min(w * 0.9, 520);
    // grande arche et clair de lune
    const lune = c.createRadialGradient(cx, h * 0.3, 10, cx, h * 0.3, L * 0.6);
    lune.addColorStop(0, '#3d3a5e'); lune.addColorStop(1, '#141020');
    arche(c, cx, h * 0.2, L * 0.8, h * 0.62, lune);
    c.fillStyle = '#d8dcf0'; c.shadowColor = '#cfd6ff'; c.shadowBlur = 30;
    rond(c, cx + L * 0.12, h * 0.3, Math.min(32, L * 0.07)); c.fill();
    c.shadowBlur = 0;
    // orgue
    const k = 7, gap = Math.max(4, L * 0.012);
    const pw = Math.min(46, (L * 0.7 - gap * (k - 1)) / k);
    const tot = k * pw + (k - 1) * gap;
    const basY = h * 0.78;
    for (let i = 0; i < k; i++) {
      const f = 0.62 + 0.38 * (1 - Math.abs(i - 3) / 3);
      const ph = Math.min(h * 0.42, 300) * f;
      const x = cx - tot / 2 + i * (pw + gap);
      const lum = 0.35 + 0.35 * Math.max(0, Math.sin(t / 700 - i * 0.9));
      dessinerTuyau(c, x, basY - ph, pw, ph, { idx: i, lum: lum, orgue: prog.orgue, t: t });
    }
    // console de l'orgue
    c.fillStyle = '#2b2533'; rr(c, cx - tot / 2 - 14, basY - 4, tot + 28, h * 0.06, 8); c.fill();
    c.strokeStyle = '#6d6180'; c.lineWidth = 2; c.stroke();
    // rebord de pierre et bougies
    c.fillStyle = '#231e2b'; c.fillRect(0, h * 0.86, w, h * 0.14);
    c.fillStyle = '#3a3344'; c.fillRect(0, h * 0.86, w, 4);
    const bw = Math.min(70, w / 6.5);
    for (let s = 0; s < 5; s++) {
      const bx = cx + (s - 2) * bw * 1.15;
      c.save(); c.translate(bx - bw / 2, h * 0.86 - bw * 1.05);
      dessinerBougie(c, bw, bw * 1.15, s, { cr: s === 4 ? 2 : 0, mx: 3, eteinte: false }, t);
      c.restore();
    }
    // brume au sol
    c.fillStyle = 'rgba(180,170,210,0.08)';
    for (let k2 = 0; k2 < 6; k2++) { ell(c, (k2 / 5) * w + Math.sin(t / 2000 + k2) * 30, h * 0.9, w * 0.3, h * 0.04); c.fill(); }
    toile(c, 0, 0, Math.min(w, h) * 0.22, 1, 1);
    toile(c, w, 0, Math.min(w, h) * 0.18, -1, 1);
    // chauves-souris
    for (let k2 = 0; k2 < 3; k2++) {
      embleme(c, 0, w * (0.2 + k2 * 0.3) + Math.sin(t / 900 + k2 * 2) * 20, h * (0.14 + k2 * 0.05) + Math.cos(t / 700 + k2) * 8, 9 + k2 * 2, '#0a0710');
    }
  }

  // ---------------------------------------------------------------------
  //  Géométrie de l'orgue dans la partie
  // ---------------------------------------------------------------------

  function geometrieOrgue(k, w, h) {
    const marge = 10, gap = Math.max(5, w * 0.014);
    const pw = Math.max(36, Math.min(66, (Math.min(w, 620) - 2 * marge - gap * (k - 1)) / k));
    const tot = k * pw + (k - 1) * gap;
    const ox = (w - tot) / 2;
    const bas = h - Math.max(18, h * 0.06);
    const hmax = Math.min(h * 0.72, 380);
    const tuyaux = [];
    for (let i = 0; i < k; i++) {
      const f = k > 1 ? 0.66 + 0.34 * (1 - Math.abs(i - (k - 1) / 2) / ((k - 1) / 2)) : 1;
      const ph = hmax * f;
      tuyaux.push({ x: ox + i * (pw + gap), y: bas - ph, w: pw, h: ph });
    }
    return { k: k, pw: pw, gap: gap, ox: ox, tot: tot, bas: bas, tuyaux: tuyaux, w: w, h: h };
  }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (parcours de 20 niveaux) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // partie solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché (en retard sur le moteur, le temps des animations)
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)
  let geo = null;
  let curseur = -1, clavier = false;
  let dernierAttends = 0;
  let secousse = 0;
  const lueurs = {};          // tuyau → heure de la dernière note (lumière)
  const particules = [];
  let echange = null;         // { a, b, t } : voix échangées (animation)
  let attenteTuto = false;
  let moiJoue = null;         // note que je viens de jouer (déjà entendue)

  // File d'affichage : chaque note jouée par un autre, la reprise du chant
  // par l'orgue et les annonces passent l'une après l'autre.
  const fileAff = [];
  let occupe = false;
  let minuteurAff = 0;

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom === 'titre') majTitre();
    relancerBoucle();
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    el.classList.toggle('haut', salonOuvert() || $('voile-fin').classList.contains('actif'));
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  function annonce(texte, duree) {
    const el = $('annonce');
    el.textContent = texte;
    el.classList.add('actif');
    clearTimeout(annonce.m);
    annonce.m = setTimeout(() => el.classList.remove('actif'), duree || 1400);
  }

  // Cartes des 5 places, en haut de l'écran, et places du salon.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'bougie'; cv.width = 92; cv.height = 104;
      const pts = document.createElement('span'); pts.className = 'pts';
      const tag = document.createElement('span'); tag.className = 'tag';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 48; cour.height = 36;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 24, 32, 20);
      d.append(cv, pts, tag, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 96; cv.height = 96;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  function remplirTag(tag, role) {
    if (tag.dataset.role === role) return;
    tag.dataset.role = role;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = tr('place.' + role);
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  function monSiege() { return partie ? partie.siege : (session === 'solo' ? 0 : -1); }

  function orgueActuel() { return prog.orgue; }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const nbPlaces = e ? e.el.filter((x) => x !== -1).length : PLACES;
    const colonnes = 'repeat(' + nbPlaces + ', 1fr)';
    if ($('places').style.gridTemplateColumns !== colonnes) $('places').style.gridTemplateColumns = colonnes;
    const tour = e && !e.fini && !attenteTuto && (!partie || partie.phase === 'jeu') ? e.tour : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: s === monSiege(), chef: false };
      const absent = !!(e && e.el[s] === -1);
      d.classList.toggle('absent', absent);
      if (absent) continue;
      const pts = e ? e.sc[s] : 0;
      const txt = nb(pts);
      const p = d.querySelector('.pts');
      if (p.textContent !== txt) p.textContent = txt;
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('eteinte', !!(e && e.el[s] > 0));
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role);
      const aria = tr('place.aria.' + role, { nom: tr('nom.' + s), points: pts, crans: e ? e.cr[s] : 0 }) + (info.chef ? ' · ' + tr('salon.chefMarque') : '');
      if (d.getAttribute('aria-label') !== aria) d.setAttribute('aria-label', aria);
    }
  }

  function dessinerPlaces(t) {
    const e = vue;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s);
      if (d.classList.contains('absent')) continue;
      const cv = d.querySelector('canvas.bougie');
      const cb = cv.getContext('2d');
      cb.clearRect(0, 0, cv.width, cv.height);
      dessinerBougie(cb, cv.width, cv.height, s, {
        cr: e ? e.cr[s] : 0, mx: e ? e.mx : 3, eteinte: !!(e && e.el[s] > 0)
      }, t);
    }
  }

  // Ce que doit faire le joueur de l'appareil maintenant.
  function texteMessage() {
    if (!partie && session !== 'solo') return '';
    if (partie && partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || (partie && partie.phase !== 'jeu') || e.fini) return '';
    const moi = monSiege();
    if (moi < 0) return tr('multi.attente');
    if (e.el[moi] > 0) return tr('tour.eteinte');
    if (e.tour === moi) {
      if (fileAff.length || occupe) return tr('tour.ecoute');
      if (e.pos < e.att.length) return tr('tour.rejoue', { n: e.pos + 1, total: e.att.length });
      return tr('tour.ajoute');
    }
    return tr('tour.' + e.tour);
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr(NIVEAUX[niveau - 1].b ? 'jeu.niveauBonus' : 'jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if (vue && !vue.fini) info += ' · ' + tr('jeu.chant', { n: vue.mel.length, total: vue.lmax });
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
    majPieges();
  }

  // Pièges du tour en cours (petites étiquettes sous le message).
  function majPieges() {
    const e = vue;
    const liste = [];
    if (e && !e.fini && (!partie || partie.phase === 'jeu')) {
      if (e.b) liste.push('bonus');
      if (e.mt >= 0) liste.push('maudit');
      if (e.rv) liste.push('rebours');
      if (e.bp >= 0) liste.push('brouillard');
      if (e.cfg.pe && e.vx.some((v, i) => v !== i)) liste.push('echo');
    }
    const cle = liste.join(',');
    const boite = $('pieges');
    if (boite.dataset.cle === cle) return;
    boite.dataset.cle = cle;
    boite.textContent = '';
    liste.forEach((p) => {
      const sp = document.createElement('span');
      sp.className = 'piege ' + p;
      sp.textContent = tr('piege.' + p, { n: e ? e.mx : 2 });
      boite.appendChild(sp);
    });
  }

  function majInterface() {
    majPlaces();
    majInfos();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && !e.fini && partie.phase === 'jeu' && !fileAff.length) {
      const s = e.tour, sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran === 'jeu') {
      if (enPause) return;
      const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
      tPrec = t;
      dessinerJeu(performance.now(), dt);
      dessinerPlaces(performance.now());
      majTemps();
      majCompte();
    } else if (ecran === 'titre') {
      dessinerTitre(performance.now());
    }
    rafId = requestAnimationFrame(boucle);
  }

  function peutJouer() {
    return !!(partie && vue && !vue.fini && !enPause && !attenteTuto && !fileAff.length && !occupe &&
      partie.monTour() && vue.tour === partie.siege);
  }

  function dessinerJeu(t, dt) {
    const cv = $('scene'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    let sx = 0, sy = 0;
    if (secousse > t) { const k = (secousse - t) / 400; sx = (Math.random() - 0.5) * 12 * k; sy = (Math.random() - 0.5) * 8 * k; }
    c.translate(sx, sy);
    murCrypte(c, w + 20, h + 20, vue && vue.b);
    const k = vue ? vue.k : 6;
    geo = geometrieOrgue(k, w, h);
    // arche derrière l'orgue
    const ag = c.createRadialGradient(w / 2, h * 0.35, 10, w / 2, h * 0.35, geo.tot);
    ag.addColorStop(0, vue && vue.b ? '#2c4a3a' : '#2c2442'); ag.addColorStop(1, '#100c16');
    arche(c, w / 2, Math.max(8, geo.bas - Math.min(h * 0.72, 380) - h * 0.12), geo.tot + 40, h, ag);
    // console
    c.fillStyle = '#2b2533'; rr(c, geo.ox - 12, geo.bas - 2, geo.tot + 24, h - geo.bas + 10, 8); c.fill();
    c.strokeStyle = '#6d6180'; c.lineWidth = 2; c.stroke();
    // flèches du rebours
    if (vue && vue.rv && !vue.fini) {
      c.save(); c.globalAlpha = 0.5 + 0.3 * Math.sin(t / 200);
      c.fillStyle = '#4fb3ff';
      for (let i = 0; i < 4; i++) {
        const x = geo.ox + geo.tot - ((t / 12 + i * geo.tot / 4) % geo.tot);
        const y = geo.bas + (h - geo.bas) / 2 + 2;
        c.beginPath(); c.moveTo(x - 8, y); c.lineTo(x + 4, y - 7); c.lineTo(x + 4, y + 7); c.closePath(); c.fill();
      }
      c.restore();
    }
    const jouable = peutJouer();
    for (let i = 0; i < k; i++) {
      const p = geo.tuyaux[i];
      const l = lueurs[i] ? Math.max(0, 1 - (t - lueurs[i]) / 520) : 0;
      const bond = l > 0 ? Math.sin(l * Math.PI) * 4 : 0;
      dessinerTuyau(c, p.x, p.y - bond, p.w, p.h + bond, {
        idx: i, lum: l, orgue: prog.orgue, t: t,
        maudit: !!(vue && !vue.fini && vue.mt === i),
        brume: !!(vue && !vue.fini && vue.bp >= 0 && i % 2 === vue.bp)
      });
      if (jouable && clavier && curseur === i) {
        c.strokeStyle = '#ffd27a'; c.lineWidth = 3; c.setLineDash([6, 4]);
        rr(c, p.x - 4, p.y - 6, p.w + 8, p.h + 10, 10); c.stroke(); c.setLineDash([]);
      }
    }
    // tuyaux jouables : légère lueur dorée au pied
    if (jouable) {
      c.fillStyle = 'rgba(255,210,122,' + (0.12 + 0.08 * Math.sin(t / 250)) + ')';
      rr(c, geo.ox - 8, geo.bas - 6, geo.tot + 16, 10, 5); c.fill();
    }
    // voix échangées : deux volutes qui se croisent
    if (echange && t - echange.t < 1600) {
      const a = geo.tuyaux[echange.a], b = geo.tuyaux[echange.b];
      if (a && b) {
        const q = (t - echange.t) / 1600;
        const ax = a.x + a.w / 2, bx = b.x + b.w / 2, y = Math.min(a.y, b.y) - 16;
        c.save(); c.globalAlpha = 1 - q; c.strokeStyle = '#48d99a'; c.lineWidth = 3;
        c.beginPath(); c.moveTo(ax, a.y); c.quadraticCurveTo((ax + bx) / 2, y - 60, bx, b.y); c.stroke();
        c.beginPath(); c.moveTo(bx, b.y); c.quadraticCurveTo((ax + bx) / 2, y - 20, ax, a.y); c.stroke();
        c.fillStyle = '#b8ffe0';
        rond(c, ax + (bx - ax) * q, y - 40 * Math.sin(q * Math.PI), 5); c.fill();
        rond(c, bx + (ax - bx) * q, y - 14 * Math.sin(q * Math.PI), 5); c.fill();
        c.restore();
      }
    }
    // particules (étincelles, cendres)
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 260) * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      rond(c, p.x, p.y, p.k); c.fill();
      c.globalAlpha = 1;
    }
    // voile rouge d'une fausse note
    if (secousse > t) {
      c.fillStyle = 'rgba(255,40,60,' + (0.18 * (secousse - t) / 400) + ')';
      c.fillRect(-20, -20, w + 40, h + 40);
    }
  }

  function jaillir(i, coul, n) {
    if (!geo || !geo.tuyaux[i]) return;
    const p = geo.tuyaux[i];
    for (let k = 0; k < (n || 10); k++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6, v = 80 + Math.random() * 160;
      particules.push({ x: p.x + p.w / 2, y: p.y + p.w * 0.6, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 0.6 + Math.random() * 0.4, k: 2 + Math.random() * 2.5, coul: k % 2 ? coul : '#fff3c4' });
    }
  }

  // Allume un tuyau et joue sa voix (selon les voix du moment).
  function sonnerTuyau(i, e, eclairer) {
    if (eclairer) { lueurs[i] = performance.now(); jaillir(i, GEMMES[i % GEMMES.length], 8); }
    const v = e && e.vx ? e.vx[i] : i;
    voixTuyau(v, Math.max(0.3, (e ? e.tp : 450) / 1000 * 0.95));
  }

  function pulsePlace(s) {
    const d = $('place-' + s);
    if (!d) return;
    d.classList.remove('joue'); void d.offsetWidth; d.classList.add('joue');
  }

  // ---------------------------------------------------------------------
  //  File d'affichage
  // ---------------------------------------------------------------------

  function pousser(item) { fileAff.push(item); pomperAff(); }
  function viderFile() { fileAff.length = 0; occupe = false; clearTimeout(minuteurAff); }

  function pomperAff() {
    while (!occupe && !enPause && fileAff.length) {
      const it = fileAff.shift();
      const j = jeton;
      let d = 0;
      try { d = traiterAff(it) || 0; } catch (err) { setTimeout(() => { throw err; }, 0); d = 0; }
      if (j !== jeton) return;
      if (d > 0) {
        occupe = true;
        minuteurAff = setTimeout(() => { if (j !== jeton) return; occupe = false; pomperAff(); }, d);
      }
    }
    majInterface();
    if (!occupe && !fileAff.length && peutJouer() && vue && vue.pos === 0 && !tourAnnonce) { tourAnnonce = true; sons.tour(); }
  }
  let tourAnnonce = false;

  // L'orgue rejoue tout le chant (début de manche, après une fausse note).
  function reprise(e, avecTexte) {
    if (!e || !e.mel.length) return;
    const items = [];
    if (avecTexte) items.push({ t: 'texte', cle: 'annonce.orgue', d: 650 });
    e.mel.forEach((p) => items.push({ t: 'note', p: p, e: e }));
    items.push({ t: 'pause', d: 350 });
    fileAff.unshift.apply(fileAff, items);
  }

  // Annonce des pièges d'un nouveau tour.
  function annoncerPieges(e) {
    const items = [];
    if (e.sw) items.push({ t: 'echange', a: e.sw[0], b: e.sw[1] });
    if (e.mt >= 0) items.push({ t: 'piege', cle: 'maudit' });
    if (e.rv) items.push({ t: 'piege', cle: 'rebours' });
    return items;
  }

  function traiterAff(it) {
    const tempo = vue ? vue.tp : 450;
    switch (it.t) {
      case 'manche': {
        vue = copie(it.etat);
        particules.length = 0;
        tourAnnonce = false;
        Object.keys(lueurs).forEach((k) => delete lueurs[k]);
        annonce(tr(vue.b ? 'annonce.bonus' : 'annonce.manche'), 1500);
        if (vue.bp >= 0) sons.brume();
        const items = [{ t: 'pause', d: 900 }].concat(annoncerPieges(vue), [{ t: 'texte', cle: 'annonce.orgue', d: 600 }]);
        vue.mel.forEach((p) => items.push({ t: 'note', p: p, e: vue }));
        items.push({ t: 'pause', d: 300 });
        fileAff.unshift.apply(fileAff, items);
        return 0;
      }
      case 'note': {
        // L'orgue joue une note (le brouillard cache la lumière d'un tuyau sur deux).
        const e = it.e || vue;
        const cache = e.bp >= 0 && it.p % 2 === e.bp;
        sonnerTuyau(it.p, e, !cache);
        return e.tp || tempo;
      }
      case 'texte': annonce(tr(it.cle), it.d + 400); return it.d;
      case 'pause': return it.d;
      case 'piege': {
        annonce(tr('annonce.' + it.cle), 1300);
        if (it.cle === 'maudit') sons.maudit(); else sons.rebours();
        return 1000;
      }
      case 'echange': {
        echange = { a: it.a, b: it.b, t: performance.now() };
        annonce(tr('annonce.echo'), 1400);
        sons.echo();
        return 1300;
      }
      case 'action': return traiterAction(it.ev, it.decoupe);
      case 'appui': return traiterAppui(it);
      case 'fin': finEnAttente = false; afficherFinManche(it.etat); return 0;
      default: return 0;
    }
  }

  // Une note juste au milieu d'un tour joué d'un coup (robot) : affichée seule.
  function traiterAppui(it) {
    const e = vue || it.e;
    const cache = !it.moi && it.e.bp >= 0 && it.p % 2 === it.e.bp;
    sonnerTuyau(it.p, it.e, !cache);
    pulsePlace(it.s);
    if (vue) { vue.pos += 1; vue.sc[it.s] += vue.b ? 2 : 1; }
    debutTour = Date.now();
    return (e && e.tp) || 450;
  }

  function traiterAction(ev, decoupe) {
    const liste = Array.isArray(ev.action) ? ev.action : [ev.action];
    if (liste.length > 1 && !decoupe) {
      // Tour entier en une action : chaque note passe à son tour, puis le résultat.
      const items = liste.slice(0, -1).map((p) => ({ t: 'appui', s: ev.siege, p: p, e: ev.avant, moi: ev.moi }));
      items.push({ t: 'action', ev: ev, decoupe: true });
      fileAff.unshift.apply(fileAff, items);
      return 0;
    }
    const avant = ev.avant, apres = ev.apres, der = apres.der || {};
    vue = copie(apres);
    debutTour = Date.now();
    dernierTic = -1;
    const s = ev.siege, p = liste[liste.length - 1];
    const moi = ev.moi;
    const tempo = avant.tp || 450;
    pulsePlace(s);
    if (ev.auto) toast(tr(moi ? 'multi.autoToi' : 'multi.auto'));
    if (der.r === 'ok' || der.r === 'ajout') {
      const cache = !moi && avant.bp >= 0 && p % 2 === avant.bp;
      const dejaEntendu = moi && moiJoue === p && !ev.auto;
      moiJoue = null;
      if (!dejaEntendu) sonnerTuyau(p, avant, !cache);
      if (der.r === 'ajout') {
        tourAnnonce = false;
        if (moi) { annonce(tr('annonce.ajoutToi'), 900); jaillir(p, '#ffd27a', 18); }
        if (apres.fini) return moi ? 300 : tempo + 300;
        fileAff.unshift.apply(fileAff, [{ t: 'pause', d: 380 }].concat(annoncerPieges(apres)));
      }
      return moi ? 60 : tempo;
    }
    // Fausse note : main qui avance, secousse, reprise du chant par l'orgue.
    moiJoue = null;
    tourAnnonce = false;
    lueurs[p] = performance.now();
    sons.faux();
    sons.main();
    secousse = performance.now() + 450;
    const place = $('place-' + s);
    if (place) { place.classList.remove('joue'); void place.offsetWidth; place.classList.add('joue'); }
    if (der.x) {
      sons.eteinte();
      annonce(tr(moi ? 'annonce.eteinteToi' : 'annonce.eteinte', { nom: tr('nom.' + s) }), 1800);
    } else annonce(tr(moi ? 'annonce.fauxToi' : 'annonce.faux', { nom: tr('nom.' + s) }), 1300);
    // En solo, une bougie éteinte est une défaite : on arrête tout de suite.
    if (moi && der.x && session === 'solo') {
      fileAff.length = 0;
      fileAff.push({ t: 'pause', d: 600 }, { t: 'fin', etat: copie(apres), perdu: true });
      arreterPartie();
      return 1300;
    }
    if (!apres.fini) {
      // Pièges du tour suivant d'abord (les voix échangées s'entendent dans la reprise).
      const items = [{ t: 'pause', d: der.x ? 1500 : 1000 }].concat(annoncerPieges(apres), [{ t: 'texte', cle: 'annonce.orgue', d: 650 }]);
      apres.mel.forEach((n) => items.push({ t: 'note', p: n, e: apres }));
      items.push({ t: 'pause', d: 300 });
      fileAff.unshift.apply(fileAff, items);
    }
    return 300;
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': pousser({ t: 'action', ev: ev }); break;
      case 'fin': if (session === 'ligne' && partie.mode === 'en-ligne') finEnAttente = true; pousser({ t: 'fin', etat: copie(partie.etat) }); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    viderFile();
    if (partie.etat) vue = copie(partie.etat);
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  function surManche() {
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    pousser({ t: 'manche', etat: copie(partie.etat) });
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;            // le résultat de la manche ouvrira le salon
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), cle = role + (info.chef ? '+chef' : '');
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 96, 96);
        medaillon(c, s, 48, 54, 38);
        if (info.chef) couronne(c, 48, 20, 22);
        remplirTag(d.querySelector('.tag'), role);
        d.setAttribute('aria-label', tr('salon.place.' + role, { nom: tr('nom.' + s) }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: tr('nom.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;

        const x = (prec.x + prec.w / 2) + ((p.x + p.w / 2) - (prec.x + prec.w / 2)) * q;
        const y0 = prec.w ? prec.y + prec.h * 0.55 : 300;
        let y = y0 + (p.y + p.h * 0.55 - y0) * q;
        if (et[2] === 's') y -= Math.sin(dans / 60) * 6 + 30; // la main hésite au-dessus du tuyau maudit, puis passe
        main(c, x, y, 1.5, et[2] !== 's' && dans > 420 ? Math.min(1, (dans - 420) / 120) : 0);
      }
      tutoId = requestAnimationFrame(image);
    }
    let tutoId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.35);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#120e18'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function tuyauSous(px, py) {
    if (!geo) return -1;
    for (let i = 0; i < geo.tuyaux.length; i++) {
      const p = geo.tuyaux[i];
      if (px >= p.x - geo.gap / 2 && px <= p.x + p.w + geo.gap / 2 && py >= p.y - 30) return i;
    }
    return -1;
  }

  function toucherTuyau(i) {
    if (i < 0 || !vue) return;
    if (!peutJouer()) {
      if (partie && partie.phase === 'jeu' && Date.now() - dernierAttends > 1500 && !enPause && !attenteTuto) {
        dernierAttends = Date.now();
        const moi = monSiege();
        toast(tr(vue.el[moi] > 0 ? 'tour.eteinte' : (vue.tour === moi ? 'tour.ecoute' : 'tour.attends')), 1400);
        sons.non();
      }
      return;
    }
    // Retour immédiat : la note sonne et le tuyau s'allume tout de suite.
    const e = vue;
    const juste = e.pos < e.att.length ? i === e.att[e.pos] : i !== e.mt;
    if (juste) { sonnerTuyau(i, e, true); moiJoue = i; }
    else { lueurs[i] = performance.now(); }
    if (!partie.jouer(i)) moiJoue = null;
  }

  const scene = $('scene');
  scene.addEventListener('pointerdown', (ev) => {
    audio();
    clavier = false;
    const r = scene.getBoundingClientRect();
    toucherTuyau(tuyauSous(ev.clientX - r.left, ev.clientY - r.top));
  });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape' || ev.code === 'NumpadEnter') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif') || !vue) return;
    const m = /^(?:Digit|Numpad)([1-9])$/.exec(ev.code);
    if (m) {
      const i = parseInt(m[1], 10) - 1;
      if (i < vue.k) { ev.preventDefault(); audio(); clavier = true; curseur = i; toucherTuyau(i); }
      return;
    }
    if (ev.code === 'ArrowLeft' || ev.code === 'ArrowRight') {
      ev.preventDefault(); audio();
      if (!clavier || curseur < 0) { clavier = true; curseur = Math.floor(vue.k / 2); return; }
      curseur = (curseur + (ev.code === 'ArrowLeft' ? vue.k - 1 : 1)) % vue.k;
      sons.clic();
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (!clavier || curseur < 0) { clavier = true; curseur = Math.floor(vue.k / 2); return; }
      toucherTuyau(curseur);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue ? vue.sc[0] : 0);
  });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
})();
</script>
</body>
</html>
