<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);

  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +

    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });

    var carte = document.createElement('div');
    carte.className = 'carte';

    carte.setAttribute('aria-modal', 'true');

    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));

    fond.appendChild(carte);
    h.ombre.appendChild(fond);

      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);

      },
    };

    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };

    bNouvelle.addEventListener('click', choisir(nouvelle));

  }

  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();

<script id="jel-multi">
/* ==========================================================================
   Free Micro Games — moteur commun des jeux multijoueurs          jel-multi v2
   JavaScript pur, sans dépendance. Détails : docs/multijoueur.md.

   Le même fichier sert à trois endroits :
     - dans chaque jeu multijoueur, recopié tel quel dans index.html
       (bloc jel-multi, juste après jel-sauvegarde) par
       node scripts/i18n-jeu.mjs : window.JEL_MULTI ;
     - dans le Worker Cloudflare commun (multijoueur/src/), qui l'importe :
       globalThis.JEL_MULTI ;
     - dans les tests (scripts/tester-multijoueur.mjs).

   Les règles d'un jeu (bloc jel-regles du jeu, objet
   window.JEL_REGLES) sont des fonctions pures, sans écran ni réseau :
     places        nombre de places de la partie, 2 à 10 (constante unique)
     depart(alea, places, options)  état de départ d'une manche
     aQui(etat)    place qui doit jouer (0 à places − 1)
     valide(etat, place, action)    l'action est-elle permise ? (true/false)
     jouer(etat, place, action, alea)  nouvel état (alea : hasard reproductible)
     bot(etat, place, alea, force)  action d'un robot (force de 0 à 1)
     fin(etat)     null pendant la manche, sinon { classement, scores }
   Facultatifs : remplacement ('tour' : un vrai joueur prend la place d'un
   robot tout de suite ; 'manche' : à la manche suivante), delaiBot (ms entre
   deux coups affichés), delaiJoueur (ms laissées à un vrai joueur avant que
   son robot joue), pauseManche (ms entre deux manches, solo), attenteSalon
   (ms avant que le salon lance seul la manche), forceEnLigne.

   Arbitre : fait tourner une partie (places, robots, coups, manches). En ligne,
   c'est le Durable Object de la partie qui l'utilise ; en solo, le jeu en crée
   un sur l'appareil. Il n'a ni minuterie ni boucle : les coups des robots sont
   calculés d'un coup, dès que c'est à eux (le jeu les affiche ensuite un par
   un, espacés de delaiBot), et seul un réveil (alarme) est programmé pour le
   temps laissé à un vrai joueur, la pause entre deux manches ou le salon.

   Salon (en ligne : réglage salon) : avant chaque manche, les joueurs se
   retrouvent dans un salon d'attente ; les places vides y sont des robots, et
   chaque joueur qui arrive prend la place d'un robot. Le « chef » (le premier
   joueur arrivé encore présent) lance la manche ; s'il part, le suivant devient
   chef. Sans lancement, la manche part seule après attenteSalon. Pendant une
   manche, un arrivant remplace un robot selon « remplacement ».

   Messages de l'arbitre (seules les actions circulent, jamais l'état complet
   en continu ; l'état n'est envoyé qu'une fois, à l'arrivée d'un joueur) :
     { t: 'bienvenue', proto, siege, sieges, chef, n, manche, phase, etat, o, reste }
     { t: 'salon', chef, reste }        salon d'attente (reste : ms avant le lancement automatique)
     { t: 'manche', n, manche, g, o }   nouvelle manche (graine g, options o)
     { t: 'action', n, s, a, g, auto }  action a de la place s (graine g)
     { t: 'sieges', sieges, chef }      vrais joueurs (true) et robots (false), place du chef
     { t: 'place', siege }              place enfin attribuée (spectateur)
     { t: 'refus', n }                  action refusée
   Messages d'un joueur : { t: 'action', n, a }, { t: 'lancer' } (chef, dans le
   salon) et { t: 'resync' }.

   API pour le jeu (window.JEL_MULTI) :
     creer({ regles, surEvenement, enLigne, force, options, enchainer })
                       partie (voir Partie plus bas) ; lancer() la démarre
   Ce fichier ne doit contenir aucune balise script, ni ouverture ni fermeture
   (recopié dans le jeu, il tromperait la recherche des blocs jel-regles…).
   ========================================================================== */
(function (racine) {
  'use strict';
  if (racine.JEL_MULTI) return;

  var PROTOCOLE = 2;               // à augmenter si les messages changent (2 : salon d'attente)
  var TOURS_MAX = 5000;            // coups de robots enchaînés au plus (règles en boucle)
  var DELAI_CONNEXION = 6000;      // ms : sans réponse du serveur, partie contre des robots locaux
  var DELAI_MOI = 120;             // ms après son propre coup, avant le coup suivant affiché
  var DELAI_RATTRAPAGE = 80;       // ms entre deux coups rejoués après une pause en ligne

  var DEFAUTS = { remplacement: 'tour', delaiBot: 700, delaiJoueur: 20000, pauseManche: 6000, attenteSalon: 90000, forceEnLigne: 0.6 };
  var FONCTIONS = ['depart', 'aQui', 'valide', 'jouer', 'bot', 'fin'];

  // --- Outils ---------------------------------------------------------------

  function copie(x) { return x === undefined ? undefined : JSON.parse(JSON.stringify(x)); }

  // Hasard reproductible (mulberry32) : la même graine donne la même suite,
  // sur le serveur comme sur chaque appareil.
  function hasard(graine) {
    var a = graine >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function nouvelleGraine(alea) { return Math.floor(alea() * 4294967296) >>> 0; }

  // Problèmes des règles d'un jeu (liste vide = bonnes). Sert au robot de contrôle.
  function problemesRegles(r) {
    if (!r || typeof r !== 'object') return ['window.JEL_REGLES absent ou qui n\'est pas un objet'];
    var p = [];
    if (!Number.isInteger(r.places) || r.places < 2 || r.places > 10) p.push('"places" doit être un nombre entier de 2 à 10');
    FONCTIONS.forEach(function (f) { if (typeof r[f] !== 'function') p.push('fonction "' + f + '" absente'); });
    if (r.remplacement !== undefined && r.remplacement !== 'tour' && r.remplacement !== 'manche') p.push('"remplacement" : "tour" ou "manche"');
    var bornes = { delaiBot: [200, 3000], delaiJoueur: [5000, 60000], pauseManche: [2000, 30000], attenteSalon: [20000, 300000], forceEnLigne: [0, 1] };
    Object.keys(bornes).forEach(function (k) {
      if (r[k] !== undefined && !(typeof r[k] === 'number' && r[k] >= bornes[k][0] && r[k] <= bornes[k][1])) {
        p.push('"' + k + '" : nombre de ' + bornes[k][0] + ' à ' + bornes[k][1]);
      }
    });
    return p;
  }

  // Règles avec les valeurs par défaut des réglages facultatifs.
  function completer(r) {
    var c = {};
    Object.keys(DEFAUTS).forEach(function (k) { c[k] = DEFAUTS[k]; });
    Object.keys(r).forEach(function (k) { if (r[k] !== undefined) c[k] = r[k]; });
    return c;
  }

  // --- Arbitre --------------------------------------------------------------
  // reglages : {
  //   envoyer(cle, message)  cle = un joueur, ou null pour tous
  //   maintenant()           heure en ms (Date.now par défaut)
  //   alea()                 hasard du serveur (Math.random par défaut)
  //   salon                  true (en ligne) : salon d'attente avant chaque manche, lancée par le chef
  //   enchainer              false : pas de nouvelle manche automatique (solo à niveaux)
  //   delaiJoueur            remplace celui des règles (Infinity : jamais de robot à sa place)
  //   force                  force des robots (forceEnLigne des règles par défaut)
  //   options                options des manches (ex. { niveau: 3 }) ; sinon { manche: n }
  // }

  function Arbitre(regles, reglages) {
    this.r = completer(regles);
    this.reglages = reglages || {};
    this.places = this.r.places;
    this.sieges = [];                       // cle du vrai joueur de chaque place, null = robot
    for (var s = 0; s < this.places; s++) this.sieges.push(null);
    this.attente = [];                      // joueurs qui attendent une place (remplacement 'manche')
    this.arrivees = [];                     // vrais joueurs présents, dans l'ordre d'arrivée (le 1er est le chef)
    this.etat = null;
    this.n = 0;                             // numéro du dernier message de jeu (manche ou action)
    this.manche = 0;
    this.phase = 'attente';                 // 'attente' (rien commencé), 'salon', 'jeu', 'pause' (entre deux manches, solo)
    this.finManche = 0;                     // fin de la pause entre deux manches (ms)
    this.salonDepuis = 0;                   // ouverture du salon (ms), pour son lancement automatique
    this.echeance = null;                   // { siege, quand } : temps laissé à un vrai joueur
    this.options = null;                    // options de la manche en cours
  }

  Arbitre.prototype.maintenant = function () { return this.reglages.maintenant ? this.reglages.maintenant() : Date.now(); };
  Arbitre.prototype.alea = function () { return this.reglages.alea ? this.reglages.alea() : Math.random(); };
  Arbitre.prototype.force = function () { return typeof this.reglages.force === 'number' ? this.reglages.force : this.r.forceEnLigne; };
  Arbitre.prototype.envoyer = function (cle, message) { if (this.reglages.envoyer) this.reglages.envoyer(cle, message); };

  // Nombre de vrais joueurs (assis ou en attente d'une place).
  Arbitre.prototype.humains = function () {
    return this.sieges.filter(function (c) { return c !== null; }).length + this.attente.length;
  };
  Arbitre.prototype.estVide = function () { return this.humains() === 0; };
  Arbitre.prototype.estPleine = function () { return this.humains() >= this.places; };

  // État à garder (stockage du Durable Object entre deux réveils).
  Arbitre.prototype.donnees = function () {
    return {
      v: PROTOCOLE, sieges: this.sieges, attente: this.attente, arrivees: this.arrivees, etat: this.etat, n: this.n,
      manche: this.manche, phase: this.phase, finManche: this.finManche, salonDepuis: this.salonDepuis,
      echeance: this.echeance, options: this.options,
    };
  };

  Arbitre.prototype.restaurer = function (d) {
    if (!d || d.v !== PROTOCOLE || !Array.isArray(d.sieges) || d.sieges.length !== this.places) return false;
    this.sieges = d.sieges.slice();
    this.attente = Array.isArray(d.attente) ? d.attente.slice() : [];
    var presents = this.sieges.concat(this.attente).filter(function (c) { return c !== null; });
    this.arrivees = Array.isArray(d.arrivees) ? d.arrivees.filter(function (c) { return presents.indexOf(c) >= 0; }) : presents;
    this.salonDepuis = d.salonDepuis || 0;
    this.etat = d.etat;
    this.n = d.n;
    this.manche = d.manche;
    this.phase = d.phase;
    this.finManche = d.finManche || 0;
    this.echeance = d.echeance || null;
    this.options = d.options || null;
    return true;
  };

  Arbitre.prototype.flagsSieges = function () { return this.sieges.map(function (c) { return c !== null; }); };

  // Le chef : le premier vrai joueur arrivé encore présent ; sa place (-1 s'il n'en a pas encore).
  Arbitre.prototype.chef = function () { return this.arrivees.length ? this.arrivees[0] : null; };
  Arbitre.prototype.siegeChef = function () { var c = this.chef(); return c === null ? -1 : this.sieges.indexOf(c); };

  Arbitre.prototype.envoyerSieges = function () {
    this.envoyer(null, { t: 'sieges', sieges: this.flagsSieges(), chef: this.siegeChef() });
  };

  // Temps restant avant la fin de la pause (solo) ou le lancement automatique du salon.
  Arbitre.prototype.reste = function () {
    var t = this.maintenant();
    if (this.phase === 'pause') return Math.max(0, this.finManche - t);
    if (this.phase === 'salon') return Math.max(0, this.salonDepuis + this.r.attenteSalon - t);
    return 0;
  };

  Arbitre.prototype.bienvenue = function (cle, siege) {
    this.envoyer(cle, {
      t: 'bienvenue', proto: PROTOCOLE, siege: siege, sieges: this.flagsSieges(), chef: this.siegeChef(),
      n: this.n, manche: this.manche, phase: this.phase, etat: this.etat, o: this.options, reste: this.reste(),
    });
  };

  // Place d'un robot à donner à un vrai joueur : de préférence pas celle qui doit jouer.
  Arbitre.prototype.siegeRobot = function () {
    var tour = this.phase === 'jeu' ? this.r.aQui(this.etat) : -1;
    var choix = -1;
    for (var s = 0; s < this.places; s++) {
      if (this.sieges[s] !== null) continue;
      if (s !== tour) return s;
      choix = s;
    }
    return choix;
  };

  // Une fois le premier joueur arrivé : salon d'attente (en ligne), sinon première manche.
  Arbitre.prototype.demarrer = function () {
    if (this.phase !== 'attente') return;
    if (this.reglages.salon) this.ouvrirSalon(0);
    else this.nouvelleManche();
  };

  // Salon d'attente : les arrivants prennent la place de robots ; le chef lance la
  // manche (message 'lancer'), sinon elle part seule après attenteSalon.
  // delai : temps d'affichage des derniers coups de la manche précédente.
  Arbitre.prototype.ouvrirSalon = function (delai) {
    this.phase = 'salon';
    this.echeance = null;
    this.salonDepuis = this.maintenant() + delai;
    this.placerAttente();
    // reste : compté à partir du moment où l'appareil lit le message (après l'affichage des coups).
    this.envoyer(null, { t: 'salon', chef: this.siegeChef(), reste: this.r.attenteSalon });
  };

  Arbitre.prototype.nouvelleManche = function () {
    var options = this.reglages.options ? copie(this.reglages.options) : { manche: this.manche + 1 };
    var g = nouvelleGraine(this.alea.bind(this));
    this.manche += 1;
    this.n += 1;
    this.options = options;
    this.etat = this.r.depart(hasard(g), this.places, copie(options));
    this.phase = 'jeu';
    this.echeance = null;
    this.envoyer(null, { t: 'manche', n: this.n, manche: this.manche, g: g, o: options });
    this.placerAttente();
    this.avancer(0);
  };

  // Joueurs en attente (remplacement 'manche') : ils prennent la place de robots.
  Arbitre.prototype.placerAttente = function () {
    var change = false;
    while (this.attente.length) {
      var s = this.siegeRobot();
      if (s < 0) break;
      var cle = this.attente.shift();
      this.sieges[s] = cle;
      change = true;
      this.envoyer(cle, { t: 'place', siege: s });
    }
    if (change) this.envoyerSieges();
  };

  // Un vrai joueur arrive. Renvoie sa place, -1 s'il attend la manche suivante,
  // null si la partie est déjà pleine de vrais joueurs.
  Arbitre.prototype.rejoindre = function (cle) {
    var deja = this.sieges.indexOf(cle);
    if (deja >= 0 || this.attente.indexOf(cle) >= 0) {
      this.bienvenue(cle, deja);
      return deja;
    }
    if (this.estPleine()) return null;
    var s = this.r.remplacement === 'manche' && this.phase === 'jeu' ? -1 : this.siegeRobot();
    if (s >= 0) this.sieges[s] = cle; else this.attente.push(cle);
    this.arrivees.push(cle);
    this.bienvenue(cle, s);
    if (s >= 0) this.envoyerSieges();
    return s;
  };

  // Un vrai joueur s'en va : un robot reprend sa place, la partie continue ;
  // si c'était le chef, le joueur arrivé juste après lui le devient.
  Arbitre.prototype.quitter = function (cle) {
    var k = this.arrivees.indexOf(cle);
    if (k >= 0) this.arrivees.splice(k, 1);
    var i = this.attente.indexOf(cle);
    if (i >= 0) { this.attente.splice(i, 1); if (k === 0) this.envoyerSieges(); return; }
    var s = this.sieges.indexOf(cle);
    if (s < 0) return;
    this.sieges[s] = null;
    this.envoyerSieges();
    if (this.echeance && this.echeance.siege === s) {
      this.echeance = null;
      this.avancer(0);
    }
  };

  Arbitre.prototype.valide = function (s, a) {
    if (a === undefined || this.phase !== 'jeu') return false;
    try { return this.r.valide(copie(this.etat), s, copie(a)) === true; } catch (e) { return false; }
  };

  // Applique une action (déjà contrôlée) et l'annonce à tous.
  Arbitre.prototype.appliquer = function (s, a, auto) {
    var g = nouvelleGraine(this.alea.bind(this));
    this.etat = this.r.jouer(copie(this.etat), s, copie(a), hasard(g));
    this.n += 1;
    var m = { t: 'action', n: this.n, s: s, a: a, g: g };
    if (auto) m.auto = true;
    this.envoyer(null, m);
  };

  // Coup d'un robot (à sa place, ou à celle d'un vrai joueur trop long : auto).
  // Un robot qui ne trouve aucune action permise arrête la manche (règles fautives).
  Arbitre.prototype.jouerRobot = function (s, auto) {
    var a;
    try { a = this.r.bot(copie(this.etat), s, this.alea.bind(this), this.force()); } catch (e) { a = undefined; }
    if (!this.valide(s, a)) { this.finirManche(0); return false; }
    this.appliquer(s, a, auto);
    return true;
  };

  // Fait jouer les robots tant que c'est à eux, jusqu'au tour d'un vrai joueur
  // ou à la fin de la manche. delai : temps d'affichage des coups déjà annoncés.
  Arbitre.prototype.avancer = function (delai) {
    var tours = 0;
    while (this.phase === 'jeu') {
      if (this.r.fin(this.etat)) { this.finirManche(delai); return; }
      if (this.estVide()) return;            // plus personne : la partie va être fermée
      var s = this.r.aQui(this.etat);
      if (!(Number.isInteger(s) && s >= 0 && s < this.places)) { this.finirManche(delai); return; }
      if (this.sieges[s] !== null) {
        var d = this.reglages.delaiJoueur !== undefined ? this.reglages.delaiJoueur : this.r.delaiJoueur;
        this.echeance = isFinite(d) ? { siege: s, quand: this.maintenant() + delai + d } : null;
        return;
      }
      if (!this.jouerRobot(s, false)) return;
      delai += this.r.delaiBot;
      if (++tours > TOURS_MAX) { this.finirManche(delai); return; }
    }
  };

  Arbitre.prototype.finirManche = function (delai) {
    if (this.reglages.salon) { this.ouvrirSalon(delai); return; }
    this.phase = 'pause';
    this.echeance = null;
    this.finManche = this.maintenant() + delai + this.r.pauseManche;
  };

  // Message d'un vrai joueur (déjà lu en JSON).
  Arbitre.prototype.recevoir = function (cle, m) {
    if (!m || typeof m !== 'object') return;
    var s = this.sieges.indexOf(cle);
    if (m.t === 'resync') { this.bienvenue(cle, s); return; }
    // Le chef lance la manche depuis le salon (les autres attendent).
    if (m.t === 'lancer') {
      if (this.phase === 'salon' && cle === this.chef()) this.nouvelleManche();
      return;
    }
    if (m.t !== 'action') return;
    if (s < 0 || this.phase !== 'jeu' || m.n !== this.n || this.r.aQui(this.etat) !== s || !this.valide(s, m.a)) {
      this.envoyer(cle, { t: 'refus', n: this.n });
      return;
    }
    this.echeance = null;
    this.appliquer(s, m.a, false);
    this.avancer(0);
  };

  // Heure du prochain réveil utile (ms), ou null.
  Arbitre.prototype.prochainReveil = function () {
    if (this.phase === 'pause' && this.reglages.enchainer !== false) return this.finManche;
    if (this.phase === 'salon') return this.salonDepuis + this.r.attenteSalon;
    if (this.phase === 'jeu' && this.echeance) return this.echeance.quand;
    return null;
  };

  // Réveil (alarme) : nouvelle manche après la pause ou au bout du salon, ou
  // robot qui joue à la place d'un vrai joueur resté trop longtemps sans jouer.
  Arbitre.prototype.reveil = function () {
    var t = this.maintenant();
    if (this.phase === 'salon' && t >= this.salonDepuis + this.r.attenteSalon) {
      if (!this.estVide()) this.nouvelleManche();
      return;
    }
    if (this.phase === 'pause' && this.reglages.enchainer !== false && t >= this.finManche) {
      if (!this.estVide()) this.nouvelleManche();
      return;
    }
    if (this.phase === 'jeu' && this.echeance && t >= this.echeance.quand) {
      var s = this.echeance.siege;
      this.echeance = null;
      if (this.r.aQui(this.etat) === s && this.jouerRobot(s, true)) this.avancer(this.r.delaiBot);
    }
  };

  // --- Partie, côté jeu -----------------------------------------------------
  // o : {
  //   regles        window.JEL_REGLES
  //   surEvenement  function (e) : { type: 'mode', mode, raison } ('connexion', 'en-ligne', 'solo') ;
  //                 { type: 'debut', reste } (arrivée dans une partie : etat, siege, sieges,
  //                 phase : 'salon' le plus souvent) ;
  //                 { type: 'salon', reste } (salon d'attente, en ligne : avant la 1re manche et
  //                 après chacune ; le chef peut lancer, sinon lancement seul dans reste ms) ;
  //                 { type: 'manche' } (nouvelle manche, etat de départ) ;
  //                 { type: 'action', siege, action, avant, apres, auto, moi } ;
  //                 { type: 'fin', resultat } (fin(etat) des règles) ;
  //                 { type: 'sieges' } (un vrai joueur arrive ou part, ou le chef change) ; { type: 'refus' }
  //   enLigne       false : directement contre des robots sur l'appareil (sinon : en ligne
  //                 si le lanceur du site le permet, robots locaux à défaut)
  //   force         force des robots locaux (0 à 1)
  //   options       options des manches locales (ex. { niveau: 3 })
  //   enchainer     false : pas de nouvelle manche automatique en solo (jeu à niveaux)
  // }
  // Lecture : partie.mode, partie.etat, partie.siege (place du joueur, -1 en attente),
  // partie.phase ('attente', 'salon', 'jeu', 'pause'), partie.sieges() ([{ humain, moi, chef }]),
  // partie.chef (place du chef), partie.estChef(), partie.monTour(). Commandes : lancer(),
  // lancerManche() (le chef, dans le salon), jouer(action), pause(oui), recommencer(options)
  // (solo), quitter(). La dernière partie lancée est aussi dans JEL_MULTI.derniere.

  function dansLanceur() {
    try { return racine.parent && racine.parent !== racine; } catch (e) { return false; }
  }

  function Partie(o) {
    this.o = o || {};
    this.r = completer(this.o.regles);
    this.mode = 'arret';
    this.etat = null;
    this.n = 0;
    this.manche = 0;
    this.phase = 'attente';
    this.siege = -1;
    this.humains = [];
    this.chef = -1;            // place du chef du salon (en ligne)
    this.options = null;
    this.file = [];            // messages reçus, joués un par un
    this.libreA = 0;           // heure à partir de laquelle le message suivant peut être joué
    this.rattrapage = false;   // coups accumulés pendant une pause en ligne : rejoués vite
    this.minuteur = 0;
    this.enPause = false;
    this.debutPause = 0;
    this.attendEcho = false;   // action envoyée, pas encore revenue
    this.versSolo = false;     // connexion coupée : bascule en solo une fois la file vidée
    this.local = null;         // arbitre local (solo)
    this.minuteurReveil = 0;
    this.minuteurConnexion = 0;
    this.ecoute = this.recevoirLanceur.bind(this);
  }

  Partie.prototype.signaler = function (e) {
    var f = this.o.surEvenement;
    if (typeof f !== 'function') return;
    // Une erreur du jeu ne bloque pas la file ; elle reste signalée (console, suivi du site).
    try { f(e); } catch (erreur) { setTimeout(function () { throw erreur; }, 0); }
  };

  Partie.prototype.changerMode = function (mode, raison) {
    this.mode = mode;
    this.signaler({ type: 'mode', mode: mode, raison: raison || '' });
  };

  Partie.prototype.lancer = function () {
    this.arreter();
    racine.JEL_MULTI.derniere = this;      // pour le robot de contrôle (scripts/tester-multijoueur.mjs)
    if (this.o.enLigne !== false && dansLanceur()) {
      this.changerMode('connexion');
      racine.addEventListener('message', this.ecoute);
      try { racine.parent.postMessage({ type: 'jel-multi', op: 'rejoindre', proto: PROTOCOLE }, '*'); } catch (e) { /* pas de lanceur */ }
      var moi = this;
      this.minuteurConnexion = setTimeout(function () { moi.passerSolo('delai'); }, DELAI_CONNEXION);
    } else {
      this.passerSolo(this.o.enLigne === false ? 'choix' : 'seul');
    }
  };

  // Arrête tout (connexion, robots locaux, file) sans rien annoncer.
  Partie.prototype.arreter = function () {
    clearTimeout(this.minuteur);
    clearTimeout(this.minuteurReveil);
    clearTimeout(this.minuteurConnexion);
    racine.removeEventListener('message', this.ecoute);
    if (this.mode === 'connexion' || this.mode === 'en-ligne') {
      try { racine.parent.postMessage({ type: 'jel-multi', op: 'quitter' }, '*'); } catch (e) { /* pas de lanceur */ }
    }
    this.file = [];
    this.local = null;
    this.versSolo = false;
    this.attendEcho = false;
    this.mode = 'arret';
  };

  Partie.prototype.quitter = function () { this.arreter(); };

  // Messages du lanceur : { type: 'jel-multi', m } (message du serveur) ou
  // { type: 'jel-multi', etat: 'solo' | 'coupe', raison }.
  Partie.prototype.recevoirLanceur = function (e) {
    if (e.source !== racine.parent) return;
    var d = e.data;
    if (!d || d.type !== 'jel-multi') return;
    if (d.etat) {
      if (this.mode === 'connexion') this.passerSolo(d.raison || d.etat);
      else if (this.mode === 'en-ligne') { this.versSolo = true; this.pomper(); }
      return;
    }
    var m = d.m;
    if (!m || typeof m !== 'object') return;
    if (this.mode === 'connexion') {
      if (m.t !== 'bienvenue') return;
      clearTimeout(this.minuteurConnexion);
      this.changerMode('en-ligne');
    }
    if (this.mode !== 'en-ligne') return;
    this.file.push(m);
    this.pomper();
  };

  // Partie contre des robots sur l'appareil (choix, pas de site, ou serveur absent).
  Partie.prototype.passerSolo = function (raison) {
    this.arreter();
    this.changerMode('solo', raison);
    this.local = this.creerArbitreLocal();
    this.local.rejoindre('moi');
    this.local.demarrer();
    this.programmerReveil();
  };

  Partie.prototype.creerArbitreLocal = function () {
    var moi = this;
    return new Arbitre(this.o.regles, {
      envoyer: function (cle, m) { moi.file.push(m); moi.pomper(); },
      enchainer: this.o.enchainer !== false,
      delaiJoueur: Infinity,               // le joueur de l'appareil prend son temps
      force: typeof this.o.force === 'number' ? this.o.force : this.r.forceEnLigne,
      options: this.o.options || null,
    });
  };

  // Connexion coupée pendant une partie en ligne : la partie continue sur
  // l'appareil, au même point, les autres places tenues par des robots locaux.
  Partie.prototype.basculer = function () {
    racine.removeEventListener('message', this.ecoute);
    // Coupure dans le salon (ou sans place) : une nouvelle manche commence contre des robots.
    if (this.siege < 0 || !this.etat || this.phase === 'salon') { this.passerSolo('coupe'); return; }
    var a = this.creerArbitreLocal();
    var sieges = [];
    for (var s = 0; s < this.r.places; s++) sieges.push(s === this.siege ? 'moi' : null);
    a.restaurer({
      v: PROTOCOLE, sieges: sieges, attente: [], etat: copie(this.etat), n: this.n, manche: this.manche,
      phase: this.phase, finManche: Date.now() + this.r.pauseManche, echeance: null, options: this.options,
    });
    this.local = a;
    this.attendEcho = false;
    this.humains = a.flagsSieges();
    this.changerMode('solo', 'coupe');
    this.signaler({ type: 'sieges' });
    if (a.phase === 'jeu') a.avancer(0);
    this.programmerReveil();
  };

  Partie.prototype.programmerReveil = function () {
    clearTimeout(this.minuteurReveil);
    if (!this.local || this.enPause) return;
    var t = this.local.prochainReveil();
    if (t === null || !isFinite(t)) return;
    var moi = this;
    this.minuteurReveil = setTimeout(function () {
      if (!moi.local || moi.enPause) return;
      moi.local.reveil();
      moi.programmerReveil();
    }, Math.max(0, t - Date.now()));
  };

  // Joue les messages reçus un par un : les coups des autres sont espacés de
  // delaiBot, pour qu'on les voie.
  Partie.prototype.pomper = function () {
    if (this.enPause) return;
    clearTimeout(this.minuteur);
    while (this.file.length) {
      var attente = this.libreA - Date.now();
      if (attente > 0) {
        var moi = this;
        this.minuteur = setTimeout(function () { moi.pomper(); }, attente);
        return;
      }
      var delai = this.traiter(this.file.shift());
      this.libreA = Date.now() + (this.rattrapage ? Math.min(delai, DELAI_RATTRAPAGE) : delai);
    }
    this.rattrapage = false;
    if (this.versSolo) {
      this.versSolo = false;
      this.basculer();
    }
  };

  // Joue un message ; renvoie le temps à laisser avant le suivant (ms).
  Partie.prototype.traiter = function (m) {
    var r = this.r;
    switch (m.t) {
      case 'bienvenue':
        this.siege = m.siege;
        this.humains = m.sieges || [];
        this.chef = typeof m.chef === 'number' ? m.chef : -1;
        this.n = m.n;
        this.manche = m.manche;
        this.options = m.o || null;
        this.etat = m.etat;
        this.phase = m.phase;
        this.attendEcho = false;
        this.signaler({ type: 'debut', reste: m.reste || 0 });
        return 0;
      case 'manche':
        this.etat = r.depart(hasard(m.g), r.places, copie(m.o));
        this.n = m.n;
        this.manche = m.manche;
        this.options = m.o || null;
        this.phase = 'jeu';
        this.attendEcho = false;
        this.signaler({ type: 'manche' });
        return 300;
      case 'action': {
        if (m.n !== this.n + 1 || !this.etat) { this.resynchroniser(); return 0; }
        var avant = this.etat, apres;
        try { apres = r.jouer(copie(avant), m.s, copie(m.a), hasard(m.g)); } catch (e) { this.resynchroniser(); return 0; }
        this.etat = apres;
        this.n = m.n;
        var moi = m.s === this.siege;
        if (moi) this.attendEcho = false;
        this.signaler({ type: 'action', siege: m.s, action: m.a, avant: avant, apres: apres, auto: !!m.auto, moi: moi });
        var resultat = r.fin(apres);
        if (resultat) {
          this.phase = 'pause';
          this.signaler({ type: 'fin', resultat: resultat });
        }
        return moi && !m.auto ? DELAI_MOI : r.delaiBot;
      }
      case 'sieges':
        this.humains = m.sieges || [];
        if (typeof m.chef === 'number') this.chef = m.chef;
        this.signaler({ type: 'sieges' });
        return 0;
      case 'salon':
        this.phase = 'salon';
        if (typeof m.chef === 'number') this.chef = m.chef;
        this.attendEcho = false;
        this.signaler({ type: 'salon', reste: m.reste || 0 });
        return 0;
      case 'place':
        this.siege = m.siege;
        this.signaler({ type: 'sieges' });
        return 0;
      case 'refus':
        this.attendEcho = false;
        this.signaler({ type: 'refus' });
        return 0;
      default:
        return 0;
    }
  };

  // Messages perdus ou incohérents : en ligne, on redemande l'état au serveur.
  Partie.prototype.resynchroniser = function () {
    this.file = [];
    if (this.mode === 'en-ligne') {
      try { racine.parent.postMessage({ type: 'jel-multi', op: 'envoyer', m: { t: 'resync' } }, '*'); } catch (e) { /* pas de lanceur */ }
    }
  };

  Partie.prototype.sieges = function () {
    var liste = [];
    for (var s = 0; s < this.r.places; s++) {
      liste.push({ humain: this.humains[s] === true, moi: s === this.siege, chef: this.mode === 'en-ligne' && s === this.chef });
    }
    return liste;
  };

  // Le joueur de l'appareil peut-il lancer la manche ? (en ligne, dans le salon, s'il est le chef)
  Partie.prototype.estChef = function () {
    return this.mode === 'en-ligne' && this.phase === 'salon' && this.siege >= 0 && this.siege === this.chef;
  };

  // Le chef lance la manche depuis le salon. Renvoie true si la demande part.
  Partie.prototype.lancerManche = function () {
    if (!this.estChef() || this.file.length) return false;
    try { racine.parent.postMessage({ type: 'jel-multi', op: 'envoyer', m: { t: 'lancer' } }, '*'); } catch (e) { return false; }
    return true;
  };

  Partie.prototype.monTour = function () {
    if (this.phase !== 'jeu' || !this.etat || this.siege < 0 || this.attendEcho || this.file.length) return false;
    if (this.mode !== 'solo' && this.mode !== 'en-ligne') return false;
    try { return this.r.aQui(this.etat) === this.siege; } catch (e) { return false; }
  };

  // Action du joueur de l'appareil. Renvoie true si elle part (elle sera jouée
  // à son retour, comme celles des autres).
  Partie.prototype.jouer = function (action) {
    if (!this.monTour()) return false;
    try { if (this.r.valide(copie(this.etat), this.siege, copie(action)) !== true) return false; } catch (e) { return false; }
    this.attendEcho = true;
    var m = { t: 'action', n: this.n, a: copie(action) };
    if (this.mode === 'solo') {
      this.local.recevoir('moi', m);
      this.programmerReveil();
    } else {
      try { racine.parent.postMessage({ type: 'jel-multi', op: 'envoyer', m: m }, '*'); } catch (e) { this.attendEcho = false; return false; }
    }
    return true;
  };

  // Pause (menu, écran caché) : la file et les robots locaux s'arrêtent. En
  // ligne, la partie continue sur le serveur : les coups attendent la reprise.
  Partie.prototype.pause = function (oui) {
    if (oui === this.enPause) return;
    this.enPause = oui;
    if (oui) {
      this.debutPause = Date.now();
      clearTimeout(this.minuteur);
      clearTimeout(this.minuteurReveil);
      return;
    }
    var duree = Date.now() - this.debutPause;
    if (this.local) {
      if (this.local.finManche) this.local.finManche += duree;
      if (this.local.echeance) this.local.echeance.quand += duree;
    }
    if (this.mode === 'en-ligne') { this.libreA = 0; this.rattrapage = true; }   // rattraper vite les coups joués pendant la pause
    this.pomper();
    this.programmerReveil();
  };

  // Solo : nouvelle manche tout de suite (niveau suivant, rejouer…).
  Partie.prototype.recommencer = function (options) {
    if (this.mode !== 'solo' || !this.local) return false;
    if (options) { this.o.options = options; this.local.reglages.options = options; }
    this.file = [];
    this.libreA = 0;
    this.local.nouvelleManche();
    this.programmerReveil();
    return true;
  };

  racine.JEL_MULTI = {
    PROTOCOLE: PROTOCOLE,
    hasard: hasard,
    copie: copie,
    completer: completer,
    problemesRegles: problemesRegles,
    Arbitre: Arbitre,
    Partie: Partie,
    creer: function (o) { return new Partie(o); },
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script id="jel-regles">
/* Règles du « Chœur de la Crypte » : fonctions pures (docs/multijoueur.md).
   Les mêmes règles tournent sur le serveur et sur chaque appareil.
   Un orgue de k tuyaux. À son tour, un joueur touche les tuyaux pour
   répéter tout le chant déjà joué (séquence « att » du tour), puis touche
   un tuyau de plus : cette note allonge le chant et le tour passe.
   Une fausse note fait avancer d'un cran la main squelettique vers la bougie
   du joueur et passe le tour ; au dernier cran, sa bougie s'éteint : il est
   éliminé. La manche finit quand il reste une seule bougie, quand le chant
   atteint sa longueur finale (lmax) ou après 200 tours.
   Pièges tirés au début de chaque tour (alea) : tuyau maudit (mt, ses notes
   sont à sauter et il ne faut pas le toucher), passage à rebours (rv),
   échange des voix de deux tuyaux (vx, sw) ; brouillard (bp : parité des
   tuyaux qui ne s'allument plus, affichage seulement).
   État (JSON) : k, mel, cr (crans), mx (crans max), el (0 en jeu, -1 place
   vide, sinon ordre d'élimination), sc (points), tour, pos, att, mt, rv, vx,
   sw, bp, cfg, lmax, nt (tours), nel, der (dernier toucher), fini, n
   (niveau, -1 en ligne), b (crypte bonus), fr (force des robots en solo),
   h (place du joueur en solo, -1 en ligne), tp (tempo d'affichage, ms).
   Action : numéro du tuyau touché (entier de 0 à k − 1), ou liste de
   tuyaux joués d'affilée dans le même tour (les robots jouent ainsi). */
(function () {
  'use strict';

  var PLACES = 5;
  // k tuyaux, r robots (solo), l longueur finale du chant, d notes de départ,
  // pm tuyau maudit, pr rebours, br brouillard, pe échos (probabilités par
  // tour), b crypte bonus (2 crans, points doublés), tp tempo (ms par note).
  var NIVEAUX = [
    { k: 4, r: 2, l: 7, d: 1, tp: 560, tuto: ['base', 'main'] },
    { k: 4, r: 2, l: 8, d: 1, tp: 530 },
    { k: 5, r: 2, l: 8, d: 1, tp: 510, tuto: ['tuyau'] },
    { k: 5, r: 3, l: 9, d: 2, pm: 0.35, tp: 500, tuto: ['maudit'] },
    { k: 5, r: 3, l: 9, d: 3, pm: 0.3, b: 1, tp: 490, tuto: ['bonus'] },
    { k: 5, r: 3, l: 10, d: 2, pm: 0.5, tp: 480 },
    { k: 5, r: 3, l: 9, d: 2, pr: 0.4, tp: 470, tuto: ['rebours'] },
    { k: 5, r: 3, l: 10, d: 2, pm: 0.35, pr: 0.35, tp: 460 },
    { k: 6, r: 3, l: 10, d: 2, pr: 0.4, tp: 450, tuto: ['tuyau'] },
    { k: 6, r: 3, l: 10, d: 3, pm: 0.35, pr: 0.35, b: 1, tp: 440 },
    { k: 6, r: 3, l: 10, d: 2, br: 1, tp: 440, tuto: ['brouillard'] },
    { k: 6, r: 3, l: 11, d: 2, br: 1, pm: 0.4, tp: 430 },
    { k: 6, r: 4, l: 10, d: 2, pe: 0.4, tp: 420, tuto: ['echo'] },
    { k: 6, r: 4, l: 11, d: 2, pe: 0.35, pr: 0.35, tp: 410 },
    { k: 6, r: 4, l: 11, d: 3, br: 1, pe: 0.35, b: 1, tp: 400 },
    { k: 7, r: 4, l: 11, d: 2, pm: 0.35, pr: 0.3, br: 1, tp: 400, tuto: ['tuyau'] },
    { k: 7, r: 4, l: 12, d: 2, pm: 0.35, br: 1, pe: 0.35, tp: 390 },
    { k: 7, r: 4, l: 12, d: 3, pm: 0.3, pr: 0.3, br: 1, pe: 0.3, tp: 380 },
    { k: 7, r: 4, l: 13, d: 3, pm: 0.35, pr: 0.35, br: 1, pe: 0.35, tp: 350 },
    { k: 7, r: 4, l: 13, d: 4, pm: 0.35, pr: 0.35, br: 1, pe: 0.35, b: 1, tp: 340 }
  ];

  function forceNiveau(n) {
    var k = Math.max(0, Math.min(NIVEAUX.length - 1, n - 1)) / (NIVEAUX.length - 1);
    return Math.round((0.15 + 0.71 * k) * 100) / 100;
  }

  function tirer(alea, n) { return Math.floor(alea() * n) % n; }

  // Prochaine place encore en jeu après « place » (-1 s'il n'y en a pas).
  function suivant(e, place) {
    for (var i = 1; i <= PLACES; i++) {
      var s = (place + i) % PLACES;
      if (e.el[s] === 0) return s;
    }
    return -1;
  }

  function enJeu(e) {
    var n = 0;
    for (var s = 0; s < PLACES; s++) if (e.el[s] === 0) n++;
    return n;
  }

  // Début d'un tour : pièges tirés au hasard, séquence attendue.
  function nouveauTour(e, place, alea) {
    e.tour = place;
    e.pos = 0;
    e.nt += 1;
    e.mt = -1; e.rv = false; e.sw = null;
    var c = e.cfg;
    if (c.pm && e.mel.length >= 2 && alea() < c.pm) e.mt = tirer(alea, e.k);
    if (c.pr && e.mel.length >= 3 && alea() < c.pr) e.rv = true;
    if (c.pe && e.mel.length >= 2 && alea() < c.pe) {
      var a = tirer(alea, e.k), b = (a + 1 + tirer(alea, e.k - 1)) % e.k;
      var v = e.vx[a]; e.vx[a] = e.vx[b]; e.vx[b] = v;
      e.sw = [a, b];
    }
    e.bp = c.br ? e.nt % 2 : -1;
    var suite = e.rv ? e.mel.slice().reverse() : e.mel.slice();
    e.att = suite.filter(function (p) { return p !== e.mt; });
    if (e.nt >= 200) e.fini = true;
  }

  function depart(alea, places, options) {
    var o = options || {}, cfg, idx = -1, i;
    var solo = typeof o.niveau === 'number' && isFinite(o.niveau);
    if (solo) {
      idx = Math.max(0, Math.min(NIVEAUX.length - 1, Math.floor(o.niveau) - 1));
      cfg = NIVEAUX[idx];
    } else {
      // En ligne : orgue de 6 tuyaux, pièges tirés pour la manche.
      cfg = { k: 6, r: 4, l: 13, d: 2, tp: 420 };
      if (alea() < 0.6) cfg.pm = 0.35;
      if (alea() < 0.5) cfg.pr = 0.3;
      if (alea() < 0.4) cfg.br = 1;
      if (alea() < 0.4) cfg.pe = 0.3;
    }
    var e = {
      k: cfg.k, mel: [], cr: [], mx: cfg.b ? 2 : 3, el: [], sc: [], tour: 0, pos: 0, att: [],
      mt: -1, rv: false, vx: [], sw: null, bp: -1, lmax: cfg.l, nt: 0, nel: 0, der: null, fini: false,
      n: idx, b: cfg.b ? 1 : 0, h: solo ? 0 : -1, tp: cfg.tp,
      cfg: { pm: cfg.pm || 0, pr: cfg.pr || 0, br: cfg.br ? 1 : 0, pe: cfg.pe || 0 }
    };
    if (solo) e.fr = forceNiveau(idx + 1);
    for (i = 0; i < e.k; i++) e.vx.push(i);
    for (var s = 0; s < PLACES; s++) {
      e.cr.push(0); e.sc.push(0);
      // En solo, le joueur est à la place 0 et les robots aux places 1 à r.
      e.el.push(solo && s > cfg.r ? -1 : 0);
    }
    var der = -1;
    for (i = 0; i < cfg.d; i++) {
      var p = tirer(alea, e.k);
      if (p === der) p = (p + 1 + tirer(alea, e.k - 1)) % e.k;
      e.mel.push(p);
      der = p;
    }
    var actifs = [];
    for (s = 0; s < PLACES; s++) if (e.el[s] === 0) actifs.push(s);
    nouveauTour(e, actifs[tirer(alea, actifs.length)], alea);
    return e;
  }

  function aQui(e) { return e.tour; }

  // Action : un tuyau (entier), ou une liste de tuyaux joués d'affilée
  // pendant le même tour (un robot joue tout son tour d'un coup).
  function valide(e, place, a) {
    if (e.fini || place !== e.tour || e.el[place] !== 0) return false;
    var liste = Array.isArray(a) ? a : [a];
    if (!liste.length || liste.length > e.att.length - e.pos + 1) return false;
    for (var i = 0; i < liste.length; i++) {
      if (!Number.isInteger(liste[i]) || liste[i] < 0 || liste[i] >= e.k) return false;
    }
    return true;
  }

  function jouer(e, place, a, alea) {
    var liste = Array.isArray(a) ? a : [a];
    for (var i = 0; i < liste.length; i++) {
      var tour = e.nt;
      jouerUn(e, place, liste[i], alea);
      if (e.fini || e.nt !== tour) break;
    }
    return e;
  }

  function jouerUn(e, place, a, alea) {
    var mult = e.b ? 2 : 1;
    var juste;
    if (e.pos < e.att.length) {
      juste = a === e.att[e.pos];
      if (juste) {
        e.pos += 1;
        e.sc[place] += mult;
        e.der = { s: place, p: a, r: 'ok' };
        return e;
      }
    } else if (a !== e.mt) {
      // Note ajoutée : le chant s'allonge, le tour passe.
      e.mel.push(a);
      e.sc[place] += 2 * mult;
      e.der = { s: place, p: a, r: 'ajout' };
      if (e.mel.length >= e.lmax) { e.fini = true; return e; }
      nouveauTour(e, suivant(e, place), alea);
      return e;
    }
    // Fausse note : la main avance d'un cran.
    e.cr[place] += 1;
    e.der = { s: place, p: a, r: 'faux', x: false };
    if (e.cr[place] >= e.mx) {
      e.nel += 1;
      e.el[place] = e.nel;
      e.der.x = true;
    }
    if (enJeu(e) <= 1) { e.fini = true; return e; }
    nouveauTour(e, suivant(e, place), alea);
    return e;
  }

  // Robot : rejoue le chant avec des erreurs qui dépendent de sa force, de la
  // longueur du chant et des pièges du tour ; sa note ajoutée est variée.
  function bot(e, place, alea, force) {
    var fo = typeof e.fr === 'number' ? e.fr : (typeof force === 'number' ? force : 0.5);
    var i, res = [];
    var L = e.att.length;
    var gene = 1 + (e.mt >= 0 ? 0.5 : 0) + (e.rv ? 0.6 : 0) + (e.bp >= 0 ? 0.3 : 0) + (e.cfg.pe ? 0.3 : 0);
    var q = Math.pow(Math.max(0, 1 - fo), 1.5) * (0.03 + 0.012 * L) * gene;
    for (var j = e.pos; j < L; j++) {
      var bon = e.att[j];
      if (alea() < q) {
        if (e.mt >= 0 && e.mt !== bon && alea() < 0.5) res.push(e.mt);
        else res.push((bon + 1 + tirer(alea, e.k - 1)) % e.k);
        return res;
      }
      res.push(bon);
    }
    var choix = [];
    var dernier = e.mel.length ? e.mel[e.mel.length - 1] : -1;
    for (i = 0; i < e.k; i++) if (i !== e.mt && (i !== dernier || alea() < 0.25)) choix.push(i);
    if (!choix.length) for (i = 0; i < e.k; i++) if (i !== e.mt) choix.push(i);
    res.push(choix[tirer(alea, choix.length)]);
    return res;
  }

  // Classement : bougies allumées d'abord (moins de crans, puis plus de
  // points ; en solo, le joueur passe devant à égalité), puis les éliminés
  // du dernier au premier, places vides à la fin.
  function classer(e) {
    var cl = [];
    for (var s = 0; s < PLACES; s++) cl.push(s);
    cl.sort(function (x, y) {
      var ex = e.el[x], ey = e.el[y];
      var gx = ex === 0 ? 2 : (ex > 0 ? 1 : 0), gy = ey === 0 ? 2 : (ey > 0 ? 1 : 0);
      if (gx !== gy) return gy - gx;
      if (gx === 2) {
        if (e.cr[x] !== e.cr[y]) return e.cr[x] - e.cr[y];
        if (e.h >= 0 && (x === e.h || y === e.h)) return x === e.h ? -1 : 1;
        return (e.sc[y] - e.sc[x]) || (x - y);
      }
      if (gx === 1) return (ey - ex) || (e.sc[y] - e.sc[x]) || (x - y);
      return x - y;
    });
    return cl;
  }

  function fin(e) {
    if (!e.fini) return null;
    return { classement: classer(e), scores: e.sc.slice() };
  }

  window.JEL_REGLES = {
    places: PLACES,
    delaiBot: 200,
    delaiJoueur: 40000,
    pauseManche: 7000,
    attenteSalon: 90000,
    remplacement: 'tour',
    forceEnLigne: 0.6,
    niveaux: NIVEAUX,
    depart: depart,
    aQui: aQui,
    valide: valide,
    jouer: jouer,
    bot: bot,
    fin: fin,
    outils: { forceNiveau: forceNiveau, classer: classer, enJeu: enJeu }
  };
})();
</script>
