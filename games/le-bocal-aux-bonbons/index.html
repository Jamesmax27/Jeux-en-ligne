        g.fillStyle = '#fff'; rond(g, ex + e * 0.3, y - e * 0.35, e * 0.35); g.fill();
        g.fillStyle = '#3a1f1a';
      }
    }
    // joues
    g.fillStyle = 'rgba(255,90,120,.35)';
    ellipse(g, x - ecart * 1.6, y + e * 1.5, e * 0.9, e * 0.55); g.fill();
    ellipse(g, x + ecart * 1.6, y + e * 1.5, e * 0.9, e * 0.55); g.fill();
    // bouche
    g.strokeStyle = '#3a1f1a'; g.lineWidth = e * 0.45; g.lineCap = 'round';
    if (humeur === 1 || humeur === 3) {
      g.fillStyle = '#7a2a2a'; ellipse(g, x, y + e * 2.1, e * 0.6, e * 0.75); g.fill();
    } else if (humeur === 2) {
      g.fillStyle = '#7a2a2a';
      g.beginPath(); g.moveTo(x - e * 1.4, y + e * 1.4); g.quadraticCurveTo(x, y + e * 4, x + e * 1.4, y + e * 1.4); g.closePath(); g.fill();
    } else {
      g.beginPath(); g.arc(x, y + e * 1.0, e * 1.0, Math.PI * 0.2, Math.PI * 0.8); g.stroke();
    }
  }

  // Dessine une friandise de rang donné (ou spéciale) au rayon 1.
  function dessinerFriandise(g, c, opt) {
    opt = opt || {};
    const hum = opt.humeur || 0, cl = !!opt.cligne, face = opt.face !== false, p = opt.parfum;
    const lw = 0.07;
    g.lineJoin = 'round';
    if (c.sp === 'arc') {
      const cols = ['#ff4d6d', '#ff9f1c', '#ffe14d', '#5fd35f', '#4dc3ff', '#7a6cff', '#e05fff'];
      for (let i = 0; i < 7; i++) {
        g.fillStyle = cols[i];
        g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 1, i * Math.PI * 2 / 7, (i + 1) * Math.PI * 2 / 7 + 0.02); g.closePath(); g.fill();
      }
      g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 0.12;
      g.beginPath();
      for (let a = 0; a < Math.PI * 3.2; a += 0.15) { const rr = 0.12 + a * 0.075; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      g.stroke();
      rond(g, 0, 0, 1); g.lineWidth = 0.08; g.strokeStyle = '#fff'; g.stroke();
      brillance(g, -0.35, -0.45, 0.28, 0.7);
      return;
    }
    if (c.sp === 'geant') {
      const anneaux = ['#7a4cd9', '#ffd23f', '#3ec7e0', '#ff6fa3', '#fff3c4'];
      anneaux.forEach((col, i) => { g.fillStyle = col; rond(g, 0, 0, 1 - i * 0.17); g.fill(); });
      g.strokeStyle = '#4a2a8a'; g.lineWidth = 0.05; rond(g, 0, 0, 1); g.stroke();
      brillance(g, -0.4, -0.5, 0.3, 0.6);
      if (face) {
        // sourcils décidés et grand sourire
        g.strokeStyle = '#3a1f1a'; g.lineWidth = 0.07; g.lineCap = 'round';
        g.beginPath(); g.moveTo(-0.45, -0.38); g.lineTo(-0.15, -0.28); g.moveTo(0.45, -0.38); g.lineTo(0.15, -0.28); g.stroke();
        g.fillStyle = '#fff'; ellipse(g, -0.27, -0.12, 0.13, 0.16); g.fill(); ellipse(g, 0.27, -0.12, 0.13, 0.16); g.fill();
        g.fillStyle = '#3a1f1a'; rond(g, -0.24, -0.1, 0.07); g.fill(); rond(g, 0.3, -0.1, 0.07); g.fill();
        g.fillStyle = '#7a2a2a';
        g.beginPath(); g.moveTo(-0.38, 0.15); g.quadraticCurveTo(0, 0.6, 0.38, 0.15); g.closePath(); g.fill();
        g.fillStyle = '#fff'; g.fillRect(-0.26, 0.15, 0.52, 0.09);
      }
      if (c.fond > 0) {
        g.fillStyle = 'rgba(255,111,163,.7)';
        for (let i = -2; i <= 2; i++) { ellipse(g, i * 0.32, 0.9 + Math.abs(i) * -0.12, 0.1, 0.18 + c.fond * 0.25); g.fill(); }
      }
      return;
    }
    const r = c.rang;
    switch (r) {
      case 0: { // bonbon emballé
        g.fillStyle = coul(0, 14, 0, undefined, p); g.strokeStyle = coul(0, -18, 0, undefined, p); g.lineWidth = lw;
        for (const s of [-1, 1]) {
          g.beginPath(); g.moveTo(s * 0.55, 0); g.lineTo(s * 1.0, -0.45); g.quadraticCurveTo(s * 0.86, 0, s * 1.0, 0.45); g.closePath(); g.fill(); g.stroke();
        }
        const gr = g.createRadialGradient(-0.25, -0.25, 0.1, 0, 0, 0.75);
        gr.addColorStop(0, coul(0, 18, 0, undefined, p)); gr.addColorStop(1, coul(0, -6, 0, undefined, p));
        g.fillStyle = gr; rond(g, 0, 0, 0.72); g.fill(); g.stroke();
        g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 0.1;
        g.beginPath(); g.arc(0, 0, 0.5, -2.6, -1.4); g.stroke();
        if (face) visage(g, 0, 0.02, 0.24, 0.09, hum, cl);
        break;
      }
      case 1: { // sucette en spirale
        g.strokeStyle = '#f4efe6'; g.lineWidth = 0.16; g.lineCap = 'round';
        g.beginPath(); g.moveTo(0.45, 0.6); g.lineTo(0.75, 1.05); g.stroke();
        g.fillStyle = '#fff'; rond(g, 0, 0, 0.95); g.fill();
        g.strokeStyle = coul(1, 0, 0, undefined, p); g.lineWidth = 0.2; g.lineCap = 'round';
        g.beginPath();
        for (let a = 0; a < Math.PI * 4.6; a += 0.12) { const rr = 0.85 * a / (Math.PI * 4.6); g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
        g.stroke();
        g.lineWidth = lw; g.strokeStyle = coul(1, -20, 0, undefined, p); rond(g, 0, 0, 0.95); g.stroke();
        brillance(g, -0.38, -0.45, 0.26, 0.6);
        if (face) { g.fillStyle = 'rgba(255,255,255,.85)'; ellipse(g, 0, 0.12, 0.5, 0.32); g.fill(); visage(g, 0, 0.06, 0.22, 0.085, hum, cl); }
        break;
      }
      case 2: { // guimauve
        g.fillStyle = coul(2, 0, 0, undefined, p); g.strokeStyle = coul(2, -22, 0, undefined, p); g.lineWidth = lw;
        rrect(g, -0.82, -0.72, 1.64, 1.48, 0.45); g.fill(); g.stroke();
        g.fillStyle = coul(2, 8, 0, undefined, p); ellipse(g, 0, -0.48, 0.68, 0.22); g.fill();
        g.fillStyle = 'rgba(255,255,255,.6)';
        for (const [x, y] of [[-0.4, 0.3], [0.45, 0.4], [0.1, 0.55], [-0.55, -0.1], [0.55, -0.05]]) { rond(g, x, y, 0.05); g.fill(); }
        if (face) visage(g, 0, 0.08, 0.26, 0.1, hum, cl);
        break;
      }
      case 3: { // macaron
        g.strokeStyle = coul(3, -22, 0, undefined, p); g.lineWidth = lw;
        g.fillStyle = coul(3, -6, 0, undefined, p); ellipse(g, 0, 0.36, 0.9, 0.42); g.fill(); g.stroke();
        g.fillStyle = coul(3, 10, 0, undefined, p);
        g.beginPath(); for (let i = 0; i <= 12; i++) { const x = -0.88 + i * 0.147; g.lineTo(x, 0.12 + (i % 2) * 0.06); } g.lineTo(0.88, 0.22); g.lineTo(-0.88, 0.22); g.closePath(); g.fill();
        g.fillStyle = '#fff4dc'; rrect(g, -0.86, -0.13, 1.72, 0.28, 0.14); g.fill();
        g.fillStyle = coul(3, 0, 0, undefined, p); ellipse(g, 0, -0.36, 0.94, 0.46); g.fill(); g.stroke();
        brillance(g, -0.35, -0.55, 0.3, 0.45);
        if (face) visage(g, 0, -0.36, 0.26, 0.09, hum, cl);
        break;
      }
      case 4: { // beignet glacé
        g.fillStyle = '#d99a5b'; g.strokeStyle = '#a5683a'; g.lineWidth = lw;
        g.beginPath(); g.arc(0, 0, 0.97, 0, Math.PI * 2); g.arc(0, 0, 0.3, 0, Math.PI * 2, true); g.fill('evenodd'); g.stroke();
        g.fillStyle = coul(4, 0, 0, undefined, p);
        g.beginPath();
        for (let i = 0; i <= 40; i++) { const a = i / 40 * Math.PI * 2, rr = 0.8 + Math.sin(a * 7) * 0.06; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
        g.closePath(); g.arc(0, 0, 0.36, 0, Math.PI * 2, true); g.fill('evenodd');
        const pep = ['#fff', '#ffe14d', '#5fd3b0', '#4dc3ff', '#ff9f1c'];
        for (let i = 0; i < 14; i++) {
          const a = i * 2.39, rr = 0.5 + (i % 3) * 0.1;
          g.save(); g.translate(Math.cos(a) * rr, Math.sin(a) * rr); g.rotate(a * 1.7);
          g.fillStyle = pep[i % pep.length]; rrect(g, -0.08, -0.025, 0.16, 0.05, 0.025); g.fill(); g.restore();
        }
        brillance(g, -0.45, -0.5, 0.22, 0.45);
        if (face) visage(g, 0, 0.52, 0.22, 0.08, hum, cl);
        break;
      }
      case 5: { // cupcake
        g.fillStyle = '#7ec8e8'; g.strokeStyle = '#4b97b8'; g.lineWidth = lw;
        g.beginPath(); g.moveTo(-0.72, 0.05); g.lineTo(0.72, 0.05); g.lineTo(0.52, 0.95); g.lineTo(-0.52, 0.95); g.closePath(); g.fill(); g.stroke();
        g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 0.06;
        for (let i = -3; i <= 3; i++) { g.beginPath(); g.moveTo(i * 0.2, 0.1); g.lineTo(i * 0.145, 0.9); g.stroke(); }
        g.strokeStyle = coul(5, -20, 0, undefined, p); g.lineWidth = lw;
        g.fillStyle = coul(5, -4, 0, undefined, p); ellipse(g, 0, 0.0, 0.86, 0.3); g.fill(); g.stroke();
        g.fillStyle = coul(5, 4, 0, undefined, p); ellipse(g, 0, -0.3, 0.66, 0.28); g.fill(); g.stroke();
        g.fillStyle = coul(5, 10, 0, undefined, p); ellipse(g, 0, -0.55, 0.42, 0.22); g.fill(); g.stroke();
        g.strokeStyle = '#3a7a2a'; g.lineWidth = 0.06; g.beginPath(); g.moveTo(0, -0.8); g.quadraticCurveTo(0.1, -1.0, 0.22, -1.02); g.stroke();
        g.fillStyle = '#e0243c'; rond(g, 0, -0.78, 0.15); g.fill();
        brillance(g, -0.05, -0.82, 0.06, 0.8);
        if (face) visage(g, 0, 0.42, 0.24, 0.085, hum, cl);
        break;
      }
      case 6: { // gâteau au chocolat et fraises
        g.fillStyle = '#ffffff'; ellipse(g, 0, 0.8, 0.98, 0.16); g.fill();
        g.fillStyle = '#f2c98a'; g.strokeStyle = '#b8864a'; g.lineWidth = lw;
        rrect(g, -0.86, -0.3, 1.72, 1.08, 0.16); g.fill(); g.stroke();
        g.fillStyle = '#fff7ea'; g.fillRect(-0.86, 0.18, 1.72, 0.12);
        g.fillStyle = coul(6, 0, 0, undefined, p);
        g.beginPath(); g.moveTo(-0.86, -0.15); g.lineTo(-0.86, -0.3);
        g.quadraticCurveTo(-0.86, -0.42, -0.7, -0.42); g.lineTo(0.7, -0.42); g.quadraticCurveTo(0.86, -0.42, 0.86, -0.3);
        for (let i = 0; i <= 8; i++) { const x = 0.86 - i * 0.215; g.lineTo(x, -0.12 + (i % 2 ? 0.14 : 0)); }
        g.closePath(); g.fill();
        for (const x of [-0.45, 0, 0.45]) {
          g.fillStyle = '#e0243c'; g.beginPath(); g.moveTo(x - 0.15, -0.5); g.quadraticCurveTo(x, -0.2, x + 0.15, -0.5); g.quadraticCurveTo(x, -0.72, x - 0.15, -0.5); g.fill();
          g.fillStyle = '#3fae49'; ellipse(g, x, -0.66, 0.1, 0.05); g.fill();
        }
        if (face) visage(g, 0, 0.45, 0.28, 0.09, hum, cl);
        break;
      }
      case 7: default: { // pièce montée
        g.fillStyle = '#ffffff'; ellipse(g, 0, 0.66, 0.98, 0.14); g.fill();
        const creme = coul(7, 0, 0, undefined, p), deco = coul(0, 4, 0, undefined, p);
        g.strokeStyle = coul(7, -26, 0, undefined, p); g.lineWidth = lw;
        g.fillStyle = creme;
        rrect(g, -0.86, 0.12, 1.72, 0.52, 0.1); g.fill(); g.stroke();
        rrect(g, -0.6, -0.32, 1.2, 0.46, 0.1); g.fill(); g.stroke();
        rrect(g, -0.36, -0.72, 0.72, 0.42, 0.1); g.fill(); g.stroke();
        g.fillStyle = deco;
        for (const [y, w] of [[0.14, 0.86], [-0.3, 0.6], [-0.7, 0.36]]) {
          for (let x = -w + 0.1; x < w - 0.05; x += 0.2) { rond(g, x, y + 0.05, 0.06); g.fill(); }
        }
        // étoile dorée au sommet
        g.fillStyle = '#ffd23f'; g.strokeStyle = '#d99a00'; g.lineWidth = 0.04;
        g.beginPath();
        for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 0.08 : 0.2; g.lineTo(Math.cos(a) * rr, -0.88 + Math.sin(a) * rr); }
        g.closePath(); g.fill(); g.stroke();
        if (face) visage(g, 0, 0.36, 0.3, 0.08, hum, cl);
        break;
      }
    }
    // Vernis du bonbon collant.
    if (c.collant) {
      g.strokeStyle = 'rgba(255,190,40,.9)'; g.lineWidth = 0.13;
      rond(g, 0, 0, 1.0); g.stroke();
      g.fillStyle = 'rgba(255,200,60,.85)';
      for (const [x, l] of [[-0.45, 0.32], [0.1, 0.45], [0.55, 0.26]]) {
        g.beginPath(); g.moveTo(x - 0.1, 0.86); g.quadraticCurveTo(x, 0.9 + l * 2, x + 0.1, 0.86); g.fill();
        rond(g, x, 0.92 + l, 0.09); g.fill();
      }
      brillance(g, 0.45, -0.6, 0.18, 0.8);
    }
  }

  // Petite icône d'une friandise dans un canvas (puces, cartes, collection).
  function iconeFriandise(cv, f, parfum) {
    const g = cv.getContext('2d'), w = cv.width, h = cv.height;
    g.clearRect(0, 0, w, h);
    g.save(); g.translate(w / 2, h / 2); g.scale(w * 0.4, w * 0.4);
    dessinerFriandise(g, f, { parfum, face: w > 40 });
    g.restore();
  }
  function iconeBut(cv, b) {
    const g = cv.getContext('2d'), w = cv.width;
    g.clearRect(0, 0, w, w);
    g.save(); g.translate(w / 2, w / 2);
    if (b.k === 'rang') { g.scale(w * 0.42, w * 0.42); dessinerFriandise(g, { rang: b.r }, { face: false }); }
    else if (b.k === 'cascade') {
      // trois friandises en marches d'escalier, de plus en plus grosses
      const s = w * 0.13;
      [[-1.9, 1.2, 0.8, 0], [-0.2, 0.3, 1.0, 1], [1.5, -0.9, 1.25, 2]].forEach(([x, y, k, r]) => {
        g.save(); g.translate(x * s, y * s); g.scale(s * k, s * k); dessinerFriandise(g, { rang: r }, { face: false }); g.restore();
      });
      g.strokeStyle = '#ffb400'; g.lineWidth = w * 0.06; g.lineCap = 'round';
      g.beginPath(); g.moveTo(-w * 0.38, -w * 0.05); g.quadraticCurveTo(-w * 0.2, -w * 0.38, w * 0.05, -w * 0.36); g.stroke();
      if (b.c >= 3) { g.fillStyle = '#ff6fa3'; rond(g, w * 0.32, w * 0.3, w * 0.12); g.fill(); g.fillStyle = '#fff'; rond(g, w * 0.32, w * 0.3, w * 0.05); g.fill(); }
    } else if (b.k === 'fusions') {
      g.save(); g.translate(-w * 0.18, 0); g.scale(w * 0.2, w * 0.2); dessinerFriandise(g, { rang: 0 }, { face: false }); g.restore();
      g.save(); g.translate(w * 0.18, 0); g.scale(w * 0.2, w * 0.2); dessinerFriandise(g, { rang: 0 }, { face: false }); g.restore();
      g.fillStyle = '#ffd23f';
      g.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? w * 0.08 : w * 0.18; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr - w * 0.28); } g.closePath(); g.fill();
    } else if (b.k === 'ecraser') {
      g.save(); g.translate(0, -w * 0.06); g.scale(w * 0.34, w * 0.34); dessinerFriandise(g, { sp: 'geant', fond: 0 }, { face: false }); g.restore();
      g.fillStyle = '#ff6fa3'; for (const x of [-0.34, 0, 0.34]) { ellipse(g, x * w, w * 0.38, w * 0.1, w * 0.04); g.fill(); }
    } else if (b.k === 'decoller') {
      g.fillStyle = '#c9e7f5'; g.fillRect(-w * 0.45, -w * 0.45, w * 0.12, w * 0.9);
      g.save(); g.translate(w * 0.04, 0); g.scale(w * 0.3, w * 0.3); dessinerFriandise(g, { rang: 1, collant: true }, { face: false }); g.restore();
    }
    g.restore();
  }

  // ------------------------------------------------------------------------
  // Toile, vue et décor de la confiserie (le décor remplit toute la largeur)
  // ------------------------------------------------------------------------
  const cv = $('jeu');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let fond = null, fondCle = '';
  const VUE = { s: 1, ox: 0, oy: 0 };
  let haut = 96, bas = 62;

  function redimensionner() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    fondCle = '';
  }

  function boiteBocal(def) {
    const b = S.BOCAUX[def.b];
    const angles = [def.angle || 0];
    if (def.balance) angles.push((def.angle || 0) + def.balance.amp, (def.angle || 0) - def.balance.amp);
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    const faux = { bocal: b, ca: 1, sa: 0 };
    for (const a of angles) {
      faux.ca = Math.cos(a); faux.sa = Math.sin(a);
      for (const p of b.pts) {
        const q = S.versMonde(faux, p[0], p[1]);
        x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]);
      }
    }
    return { x0: x0 - 8, x1: x1 + 8, y0: y0 - 50, y1: y1 + 16 };
  }
  function calculerVue(V, def, w, h, ht, bs) {
    const bx = boiteBocal(def);
    const lw = w - 20, lh = h - ht - bs;
    V.s = Math.max(0.5, Math.min(lw / (bx.x1 - bx.x0), lh / (bx.y1 - bx.y0)));
    V.ox = w / 2 - (bx.x0 + bx.x1) / 2 * V.s;
    V.oy = ht + (lh - (bx.y1 - bx.y0) * V.s) / 2 - bx.y0 * V.s;
    V.sol = V.oy + (bx.y1 - 4) * V.s; // haut du comptoir, sous le socle du bocal
  }
  function versEcran(V, x, y) { return [V.ox + x * V.s, V.oy + y * V.s]; }

  // Décor : murs rayés, fenêtres au soleil, étagères de bocaux, comptoir.
  function dessinerDecor(g, w, h, sol, graine) {
    const rng = S.alea(graine || 7);
    const mur = g.createLinearGradient(0, 0, 0, h);
    mur.addColorStop(0, '#ffe7ef'); mur.addColorStop(1, '#ffc9da');
    g.fillStyle = mur; g.fillRect(0, 0, w, h);
    // rayures
    const l = Math.max(26, Math.round(w / 40));
    for (let x = 0; x < w + l; x += l * 2) { g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(x, 0, l, sol); }
    // guirlande de festons en haut
    g.fillStyle = '#ff9ec1';
    for (let x = 0; x < w + 40; x += 40) { g.beginPath(); g.arc(x + 20, 0, 20, 0, Math.PI); g.fill(); }
    g.fillStyle = '#fff'; for (let x = 0; x < w + 40; x += 40) { rond(g, x + 20, 14, 3); g.fill(); }
    // fenêtres
    const fen = w > 760 ? [w * 0.13, w * 0.87] : [w * 0.86];
    const fw = Math.min(170, Math.max(90, w * 0.12)), fh = fw * 1.15, fy = Math.max(70, h * 0.12);
    for (const fx of fen) {
      const x = fx - fw / 2;
      g.fillStyle = '#fffaf2'; rrect(g, x - 8, fy - 8, fw + 16, fh + 16, 14); g.fill();
      const ciel = g.createLinearGradient(0, fy, 0, fy + fh);
      ciel.addColorStop(0, '#8fd8ff'); ciel.addColorStop(1, '#d9f3ff');
      g.fillStyle = ciel; rrect(g, x, fy, fw, fh, 10); g.fill();
      g.save(); rrect(g, x, fy, fw, fh, 10); g.clip();
      const sx = x + fw * 0.68, sy = fy + fh * 0.3;
      const halo = g.createRadialGradient(sx, sy, 2, sx, sy, fw * 0.6);
      halo.addColorStop(0, 'rgba(255,250,200,1)'); halo.addColorStop(0.25, 'rgba(255,235,140,.8)'); halo.addColorStop(1, 'rgba(255,235,140,0)');
      g.fillStyle = halo; g.fillRect(x, fy, fw, fh);
      g.fillStyle = '#ffe66b'; rond(g, sx, sy, fw * 0.12); g.fill();
      g.fillStyle = '#fff';
      for (const [cx, cy, k] of [[0.25, 0.55, 1], [0.6, 0.72, 0.8]]) {
        rond(g, x + fw * cx, fy + fh * cy, fw * 0.08 * k); g.fill();
        rond(g, x + fw * cx + fw * 0.09 * k, fy + fh * cy - fw * 0.03, fw * 0.1 * k); g.fill();
        rond(g, x + fw * cx + fw * 0.19 * k, fy + fh * cy, fw * 0.07 * k); g.fill();
      }
      g.fillStyle = '#8ad37a'; g.beginPath(); g.ellipse(x + fw / 2, fy + fh, fw * 0.7, fh * 0.18, 0, 0, Math.PI * 2); g.fill();
      g.restore();
      g.strokeStyle = '#fffaf2'; g.lineWidth = 6;
      g.beginPath(); g.moveTo(x + fw / 2, fy); g.lineTo(x + fw / 2, fy + fh); g.moveTo(x, fy + fh / 2); g.lineTo(x + fw, fy + fh / 2); g.stroke();
      // rideaux
      g.fillStyle = '#ff7aa8';
      for (const s of [-1, 1]) {
        const cx = s < 0 ? x - 10 : x + fw + 10;
        g.beginPath(); g.moveTo(cx, fy - 12); g.quadraticCurveTo(cx + s * -fw * 0.32, fy + fh * 0.4, cx + s * -fw * 0.08, fy + fh + 14);
        g.lineTo(cx + s * 16, fy + fh + 14); g.lineTo(cx + s * 16, fy - 12); g.closePath(); g.fill();
      }
      // rayons de lumière
      g.save(); g.globalAlpha = 0.16; g.fillStyle = '#fffbe0';
      g.beginPath(); g.moveTo(x, fy + fh); g.lineTo(x + fw, fy + fh); g.lineTo(x + fw * 1.9 * (fx < w / 2 ? 1 : -0.4), sol); g.lineTo(x - fw * (fx < w / 2 ? -0.2 : 1.2), sol); g.closePath(); g.fill();
      g.restore();
    }
    // étagères avec bocaux, sucettes et gâteaux
    const etages = [h * 0.42, h * 0.66].filter((y) => y < sol - 60);
    for (const ey of etages) {
      g.fillStyle = 'rgba(120,60,40,.18)'; g.fillRect(0, ey + 10, w, 10);
      g.fillStyle = '#e0a77a'; g.fillRect(0, ey, w, 12);
      g.fillStyle = '#f2c49c'; g.fillRect(0, ey, w, 4);
      for (let x = 20; x < w; x += 56 + rng() * 40) {
        const type = Math.floor(rng() * 4), k = 0.8 + rng() * 0.5;
        g.save(); g.translate(x, ey);
        if (type === 0) { // petit bocal de bonbons
          const bw = 30 * k, bh = 38 * k;
          g.fillStyle = 'rgba(220,240,255,.55)'; rrect(g, -bw / 2, -bh, bw, bh, 6); g.fill();
          for (let i = 0; i < 9; i++) { g.fillStyle = hsl(rng() * 360, 80, 65); rond(g, -bw / 2 + 5 + rng() * (bw - 10), -5 - rng() * (bh * 0.7), 4 * k); g.fill(); }
          g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 2; rrect(g, -bw / 2, -bh, bw, bh, 6); g.stroke();
          g.fillStyle = hsl(rng() * 360, 70, 60); rrect(g, -bw / 2 - 2, -bh - 7, bw + 4, 8, 3); g.fill();
        } else if (type === 1) { // pot de sucettes
          g.fillStyle = '#7ec8e8'; rrect(g, -10 * k, -16 * k, 20 * k, 16 * k, 3); g.fill();
          for (let i = -1; i <= 1; i++) {
            g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath(); g.moveTo(i * 6 * k, -14 * k); g.lineTo(i * 9 * k, -36 * k); g.stroke();
            g.fillStyle = hsl(rng() * 360, 80, 62); rond(g, i * 9 * k, -40 * k, 7 * k); g.fill();
            g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 1.5; g.beginPath(); g.arc(i * 9 * k, -40 * k, 3.5 * k, 0, 5); g.stroke();
          }
        } else if (type === 2) { // gâteau sur présentoir
          g.fillStyle = '#fff'; g.fillRect(-2, -10 * k, 4, 10 * k); ellipse(g, 0, -10 * k, 16 * k, 3 * k); g.fill();
          g.fillStyle = hsl(rng() * 360, 60, 80); rrect(g, -13 * k, -30 * k, 26 * k, 20 * k, 5); g.fill();
          g.fillStyle = '#e0243c'; rond(g, 0, -33 * k, 3.5 * k); g.fill();
        } else { // boîte à biscuits
          g.fillStyle = hsl(rng() * 360, 55, 70); rrect(g, -16 * k, -22 * k, 32 * k, 22 * k, 4); g.fill();
          g.fillStyle = 'rgba(255,255,255,.6)'; rond(g, 0, -11 * k, 6 * k); g.fill();
        }
        g.restore();
      }
    }
    // comptoir
    const bois = g.createLinearGradient(0, sol, 0, h);
    bois.addColorStop(0, '#d98f5f'); bois.addColorStop(1, '#a8603a');
    g.fillStyle = bois; g.fillRect(0, sol, w, h - sol);
    g.fillStyle = '#f5c89e'; g.fillRect(0, sol, w, 7);
    g.fillStyle = 'rgba(80,30,15,.25)'; g.fillRect(0, sol + 7, w, 4);
    for (let x = 0; x < w; x += 90) { g.fillStyle = 'rgba(80,30,15,.12)'; g.fillRect(x, sol + 14, 3, h - sol); }
    // carreaux roses et blancs tout en bas
    const ty = Math.max(sol + 30, h - 26);
    for (let x = 0, i = 0; x < w; x += 22, i++) { g.fillStyle = i % 2 ? '#fff' : '#ff9ec1'; g.fillRect(x, ty, 22, 11); g.fillStyle = i % 2 ? '#ff9ec1' : '#fff'; g.fillRect(x, ty + 11, 22, 15); }
  }

  function preparerFond(def) {
    const cle = `${W}x${H}:${def.b}:${def.angle || 0}:${def.balance ? 1 : 0}:${haut}:${bas}`;
    if (cle === fondCle) return;
    fondCle = cle;
    fond = document.createElement('canvas');
    fond.width = Math.round(W * DPR); fond.height = Math.round(H * DPR);
    const g = fond.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    dessinerDecor(g, W, H, VUE.sol, 11);
  }

  // ------------------------------------------------------------------------
  // Dessin du bocal et de son contenu
  // ------------------------------------------------------------------------
  function cheminBocal(g, V, P, ferme) {
    const pts = P.bocal.pts;
    g.beginPath();
    pts.forEach((p, i) => { const q = versEcran(V, ...S.versMonde(P, p[0], p[1])); if (i) g.lineTo(q[0], q[1]); else g.moveTo(q[0], q[1]); });
    if (ferme) g.closePath();
  }

  function dessinerBocalArriere(g, V, P) {
    // ombre portée sur le comptoir
    const [bx, by] = versEcran(V, ...S.versMonde(P, 0, 0));
    g.fillStyle = 'rgba(90,30,20,.18)'; ellipse(g, bx, by + 13 * V.s, 60 * V.s * (P.bocal.id === 'grand' ? 1.15 : 1), 5 * V.s); g.fill();
    // socle de verre sous le bocal (le visage y est dessiné)
    const l = Math.min(36, -P.bocal.pts[0][0] * 0.62);
    g.save(); g.translate(bx, by); g.rotate(P.angle);
    const gs = g.createLinearGradient(0, 0, 0, 12 * V.s);
    gs.addColorStop(0, 'rgba(255,214,230,.95)'); gs.addColorStop(1, 'rgba(255,170,200,.95)');
    g.fillStyle = gs; rrect(g, -l * V.s, 1 * V.s, l * 2 * V.s, 11 * V.s, 5 * V.s); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1.2 * V.s; g.stroke();
    g.restore();
    // intérieur du verre, assez dense pour que le décor ne se confonde pas avec le contenu
    cheminBocal(g, V, P, true);
    const gi = g.createLinearGradient(bx - 60 * V.s, 0, bx + 60 * V.s, 0);
    gi.addColorStop(0, 'rgba(232,246,255,.9)'); gi.addColorStop(0.5, 'rgba(246,252,255,.84)'); gi.addColorStop(1, 'rgba(225,242,255,.9)');
    g.fillStyle = gi; g.fill();
    // bouche à soda au fond
    if (P.def.soda) {
      const [sx, sy] = versEcran(V, ...S.versMonde(P, P.def.soda.x, -1));
      g.save(); g.translate(sx, sy); g.rotate(P.angle);
      g.fillStyle = '#5fd3b0'; rrect(g, -9 * V.s, -4 * V.s, 18 * V.s, 5 * V.s, 2 * V.s); g.fill();
      g.fillStyle = '#2e9c7a'; for (let i = -1; i <= 1; i++) { rond(g, i * 5 * V.s, -2 * V.s, 1.2 * V.s); g.fill(); }
      g.restore();
    }
  }

  function dessinerBocalAvant(g, V, P, decor, humeur) {
    const s = V.s;
    // décor du verre
    g.save(); cheminBocal(g, V, P, true); g.clip();
    const [cx, cy] = versEcran(V, ...S.versMonde(P, 0, -P.bocal.haut / 2));
    if (decor === 'pois') {
      g.fillStyle = 'rgba(255,255,255,.3)';
      for (let y = -P.bocal.haut; y < 0; y += 16) for (let x = -70; x < 70; x += 16) {
        const q = versEcran(V, ...S.versMonde(P, x + ((y / 16) % 2 ? 8 : 0), y)); rond(g, q[0], q[1], 2.4 * s); g.fill();
      }
    } else if (decor === 'menthe') {
      g.strokeStyle = 'rgba(95,211,176,.2)'; g.lineWidth = 6 * s;
      for (let k = -12; k < 12; k++) { g.beginPath(); g.moveTo(cx + k * 22 * s - 200 * s, cy - 200 * s); g.lineTo(cx + k * 22 * s + 200 * s, cy + 200 * s); g.stroke(); }
    } else if (decor === 'etoile') {
      g.fillStyle = 'rgba(255,215,80,.45)';
      const r = S.alea(5);
      for (let i = 0; i < 26; i++) {
        const q = versEcran(V, ...S.versMonde(P, (r() - 0.5) * 120, -r() * P.bocal.haut));
        g.beginPath(); for (let j = 0; j < 10; j++) { const a = j * Math.PI / 5, rr = (j % 2 ? 1.2 : 3) * s; g.lineTo(q[0] + Math.cos(a) * rr, q[1] + Math.sin(a) * rr); } g.closePath(); g.fill();
      }
    }
    // reflets
    const reflet = (x, y1, y2, a, l) => {
      const A = versEcran(V, ...S.versMonde(P, x, y1)), B = versEcran(V, ...S.versMonde(P, x, y2));
      g.strokeStyle = `rgba(255,255,255,${a})`; g.lineWidth = l * s; g.lineCap = 'round';
      g.beginPath(); g.moveTo(A[0], A[1]); g.lineTo(B[0], B[1]); g.stroke();
    };
    const xg = P.bocal.pts[0][0];
    reflet(xg + 7, -P.bocal.haut + 18, -22, 0.38, 4);
    reflet(xg + 14, -P.bocal.haut + 26, -P.bocal.haut * 0.55, 0.22, 2.2);
    reflet(-xg - 8, -P.bocal.haut * 0.6, -P.bocal.haut * 0.3, 0.25, 2.5);
    g.restore();
    // étagère de verre
    if (P.bocal.etagere) {
      const e = P.bocal.etagere, xd = P.bocal.pts[P.bocal.pts.length - 1][0];
      for (const [a, b] of [[xg, e.trou[0]], [e.trou[1], xd]]) {
        const A = versEcran(V, ...S.versMonde(P, a, e.y)), B = versEcran(V, ...S.versMonde(P, b, e.y));
        g.strokeStyle = 'rgba(150,200,230,.95)'; g.lineWidth = S.MUR * 2 * s + 1; g.lineCap = 'round';
        g.beginPath(); g.moveTo(A[0], A[1]); g.lineTo(B[0], B[1]); g.stroke();
        g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1.2 * s;
        g.beginPath(); g.moveTo(A[0], A[1] - s); g.lineTo(B[0], B[1] - s); g.stroke();
      }
    }
    // parois
    cheminBocal(g, V, P, false);
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.strokeStyle = 'rgba(110,160,200,.55)'; g.lineWidth = S.MUR * 2 * s + 3; g.stroke();
    let bord = 'rgba(255,255,255,.92)';
    if (decor === 'dore') bord = '#ffd23f';
    if (decor === 'arc') {
      const [A, B] = [versEcran(V, ...S.versMonde(P, xg, 0)), versEcran(V, ...S.versMonde(P, -xg, 0))];
      const gr = g.createLinearGradient(A[0], A[1], B[0], B[1]);
      ['#ff4d6d', '#ff9f1c', '#ffe14d', '#5fd35f', '#4dc3ff', '#7a6cff'].forEach((c, i) => gr.addColorStop(i / 5, c));
      bord = gr;
    }
    cheminBocal(g, V, P, false);
    g.strokeStyle = bord; g.lineWidth = S.MUR * 1.2 * s; g.stroke();
    // lèvres du col
    const pts = P.bocal.pts;
    for (const p of [pts[0], pts[pts.length - 1]]) {
      const q = versEcran(V, ...S.versMonde(P, p[0], p[1]));
      g.fillStyle = decor === 'dore' ? '#ffd23f' : 'rgba(255,255,255,.95)';
      rond(g, q[0], q[1], 3.2 * s); g.fill();
      g.strokeStyle = 'rgba(110,160,200,.7)'; g.lineWidth = 1.2; g.stroke();
    }
    // ligne à ne pas dépasser
    const L = P.bocal.ligne;
    const [A, B] = [versEcran(V, ...S.versMonde(P, xg + 3, L)), versEcran(V, ...S.versMonde(P, -xg - 3, L))];
    const danger = P.debord > 0;
    const clign = danger && Math.floor(tempsRendu * 8) % 2 === 0;
    g.setLineDash([5 * s, 4 * s]);
    g.strokeStyle = danger ? (clign ? '#ff2d55' : '#ffb3c4') : `rgba(255,111,163,${0.45 + P.alerte * 0.5})`;
    g.lineWidth = (danger ? 2.2 : 1.4) * s;
    g.beginPath(); g.moveTo(A[0], A[1]); g.lineTo(B[0], B[1]); g.stroke();
    g.setLineDash([]);
    if (danger) {
      // jauge de débordement le long de la ligne
      const k = Math.min(1, P.debord / S.DEBORD_MAX);
      g.strokeStyle = '#ff2d55'; g.lineWidth = 3 * s;
      g.beginPath(); g.moveTo(A[0], A[1] - 4 * s); g.lineTo(A[0] + (B[0] - A[0]) * k, A[1] - 4 * s + (B[1] - A[1]) * k); g.stroke();
    }
    // visage du bocal, sur son socle
    const [fx, fy] = versEcran(V, ...S.versMonde(P, 0, 4.6));
    g.save(); g.translate(fx, fy); g.rotate(P.angle);
    const k = s * 0.85;
    visage(g, 0, 0, 8 * k, 1.7 * k, humeur, ((tempsRendu + 1.3) % 5) < 0.14 && humeur !== 2);
    g.restore();
  }

  // Une friandise à l'écran.
  function dessinerCorps(g, V, c, P, extra) {
    const [x, y] = versEcran(V, c.x, c.y);
    let k = 1;
    if (c.grandit > 0) { const u = c.grandit; k = 0.55 + 0.45 * u + Math.sin(u * Math.PI) * 0.18; }
    const r = c.r * V.s * k;
    if (x < -r * 2 || x > W + r * 2) return;
    let hum = 0;
    if (P && P.alerte > 0.7) hum = 3;
    if (extra && extra.humeur !== undefined) hum = extra.humeur;
    const cligne = ((tempsRendu + c.cligne) % 4.2) < 0.13;
    g.save(); g.translate(x, y); g.rotate(c.rot); g.scale(r, r);
    if (c.colle) { // la colle qui le retient
      g.fillStyle = 'rgba(255,200,60,.5)'; rond(g, 0, 0, 1.18); g.fill();
    }
    dessinerFriandise(g, c, { humeur: hum, cligne, face: r > 7 });
    g.restore();
  }

  // ------------------------------------------------------------------------
  // Particules et textes flottants (coordonnées du monde)
  // ------------------------------------------------------------------------
  const parts = [];
  function eclats(x, y, n, couleurs, force, taille) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (0.4 + Math.random()) * (force || 60);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, vie: 0.6 + Math.random() * 0.5, age: 0, col: couleurs[i % couleurs.length], t: taille || 1.6, type: Math.random() < 0.4 ? 'etoile' : 'rond', g: 120 });
    }
  }
  function texteFlottant(x, y, texte, col, taille) {
    parts.push({ x, y, vx: 0, vy: -26, vie: 1.3, age: 0, col: col || '#fff', texte, t: taille || 9, type: 'texte', g: 0 });
  }
  function bulles(P, n) {
    const s = P.def.soda;
    for (let i = 0; i < n; i++) {
      const w = S.versMonde(P, s.x + (Math.random() - 0.5) * 24, -2);
      parts.push({ x: w[0], y: w[1], vx: (Math.random() - 0.5) * 10, vy: -60 - Math.random() * 90, vie: 1.0 + Math.random() * 0.8, age: 0, col: 'rgba(200,255,240,.8)', t: 1 + Math.random() * 2.4, type: 'bulle', g: -10 });
    }
  }
  function majParticules(dt) {
    for (const p of parts) { p.age += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - dt; }
    for (let i = parts.length - 1; i >= 0; i--) if (parts[i].age >= parts[i].vie) parts.splice(i, 1);
  }
  function dessinerParticules(g, V) {
    for (const p of parts) {
      let [x, y] = versEcran(V, p.x, p.y);
      const a = 1 - p.age / p.vie;
      g.globalAlpha = Math.max(0, Math.min(1, a * 1.4));
      if (p.type === 'texte') {
        const t = Math.min(p.t * V.s * (1 + Math.min(0.3, p.age)), 44);
        g.font = `900 ${t}px ${POLICE}`; g.textAlign = 'center'; g.textBaseline = 'middle';
        const demi = g.measureText(p.texte).width / 2 + 6;
        x = Math.max(demi, Math.min(W - demi, x));
        g.lineWidth = t * 0.22; g.strokeStyle = '#a3245a'; g.strokeText(p.texte, x, y);
        g.fillStyle = p.col; g.fillText(p.texte, x, y);
      } else if (p.type === 'bulle') {
        g.strokeStyle = p.col; g.lineWidth = 1.2; rond(g, x, y, p.t * V.s); g.stroke();
        g.fillStyle = 'rgba(255,255,255,.5)'; rond(g, x - p.t * V.s * 0.3, y - p.t * V.s * 0.3, p.t * V.s * 0.3); g.fill();
      } else if (p.type === 'etoile') {
        const r = p.t * V.s;
        g.fillStyle = p.col; g.beginPath();
        for (let i = 0; i < 10; i++) { const an = i * Math.PI / 5 + p.age * 4, rr = i % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(an) * rr, y + Math.sin(an) * rr); }
        g.closePath(); g.fill();
      } else if (p.type === 'confetti') {
        g.save(); g.translate(x, y); g.rotate(p.age * 8 + p.vx); g.fillStyle = p.col; g.fillRect(-p.t * V.s, -p.t * V.s * 0.4, p.t * V.s * 2, p.t * V.s * 0.8); g.restore();
      } else {
        g.fillStyle = p.col; rond(g, x, y, p.t * V.s * a + 0.5); g.fill();
      }
    }
    g.globalAlpha = 1;
  }
  function confettis(n) {
    const cols = ['#ff6fa3', '#ffd23f', '#5fd3b0', '#4dc3ff', '#b28bff', '#ff9f1c'];
    const bx = boiteBocal(P.def);
    for (let i = 0; i < n; i++) {
      parts.push({ x: bx.x0 + Math.random() * (bx.x1 - bx.x0), y: bx.y0 - Math.random() * 40, vx: (Math.random() - 0.5) * 60, vy: Math.random() * 40, vie: 2 + Math.random(), age: 0, col: cols[i % cols.length], t: 1.4 + Math.random(), type: 'confetti', g: 60 });
    }
  }

  // ------------------------------------------------------------------------
  // Scène complète : bocal, friandises, friandise tenue, aide à la visée
  // ------------------------------------------------------------------------
  let tempsRendu = 0;
  function dessinerScene(g, V, P, opt) {
    opt = opt || {};
    const ren = opt.renverse || 0;
    g.save();
    if (ren > 0) {
      // le bocal trop plein se renverse en riant
      const [px, py] = versEcran(V, ...S.versMonde(P, -P.bocal.pts[0][0], 0));
      const a = Math.min(1, ren) * 1.25;
      g.translate(px, py); g.rotate(a); g.translate(-px, -py);
    }
    dessinerBocalArriere(g, V, P);
    for (const c of P.corps) {
      if (ren > 0.35) {
        const u = ren - 0.35;
        const [px] = versEcran(V, ...S.versMonde(P, -P.bocal.pts[0][0], 0));
        g.save(); g.translate(u * u * 260 * (1 + (c.id % 3) * 0.4) * (px > 0 ? 1 : 1), -u * 90 * ((c.id % 5) / 5)); dessinerCorps(g, V, c, P, { humeur: 2 }); g.restore();
      } else dessinerCorps(g, V, c, P);
    }
    let humeur = 0;
    if (P.alerte > 0.6 || P.debord > 0) humeur = 1;
    if (ren > 0 || opt.rit) humeur = 2;
    if (opt.content) humeur = 0;
    dessinerBocalAvant(g, V, P, opt.decor || prog.decor, humeur);
    g.restore();
    // friandise tenue en haut, avec son fil, et l'aide à la visée
    if (P.tenu && !P.fini && opt.tenu !== false) {
      const r = S.rayonDe(P.tenu);
      const y = S.hauteurLacher(P, r);
      const [x0, y0] = versEcran(V, P.x, y);
      const pret = P.cooldown <= 0;
      if (opt.guide !== false && pret) {
        // pointillés jusqu'à la première friandise en dessous
        let fin = 0;
        let ybas = 1e9;
        for (const c of P.corps) { const dx = Math.abs(c.x - P.x); if (dx < c.r + r * 0.6) ybas = Math.min(ybas, c.y - Math.sqrt(Math.max(0, (c.r + r) ** 2 - dx * dx))); }
        fin = ybas < 1e8 ? ybas : 0;
        const yb = versEcran(V, P.x, fin)[1];
        g.setLineDash([3, 6]); g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 2;
        g.beginPath(); g.moveTo(x0, y0 + r * V.s); g.lineTo(x0, yb); g.stroke(); g.setLineDash([]);
      }
      g.strokeStyle = 'rgba(150,80,60,.6)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(x0, y0 - r * V.s - 14 * V.s); g.lineTo(x0, y0 - r * V.s); g.stroke();
      g.fillStyle = '#c0392b'; rond(g, x0, y0 - r * V.s - 14 * V.s, 2.4 * V.s); g.fill();
      const balance = Math.sin(tempsRendu * 3) * 0.08;
      g.globalAlpha = pret ? 1 : 0.5;
      dessinerCorps(g, V, { x: P.x, y, r, rot: balance, rang: P.tenu.rang, sp: P.tenu.sp, collant: P.tenu.collant, cligne: 0, grandit: 0, fond: 0 }, null);
      g.globalAlpha = 1;
      // la suivante, dans une bulle
      if (P.suivant && opt.suivant !== false) {
        const bx = boiteBocal(P.def);
        const rs = Math.min(15, Math.max(9, 8.5 * V.s / 1.5));
        let sx = versEcran(V, bx.x1, 0)[0] + rs + 12, sy = versEcran(V, 0, y)[1];
        if (sx + rs + 6 > W) { sx = W - rs - 12; sy = Math.max(sy, haut + rs + 20); }
        g.fillStyle = 'rgba(255,255,255,.88)'; rond(g, sx, sy, rs + 7); g.fill();
        g.strokeStyle = '#ffb3cc'; g.lineWidth = 2.5; g.stroke();
        const rr = rs * Math.min(1, S.rayonDe(P.suivant) / 10);
        g.save(); g.translate(sx, sy); g.scale(rr, rr);
        dessinerFriandise(g, P.suivant, { face: rr > 7 }); g.restore();
        g.font = `800 ${Math.max(11, rs * 0.75)}px ${POLICE}`; g.textAlign = 'center'; g.textBaseline = 'bottom';
        g.lineWidth = 3; g.strokeStyle = 'rgba(255,255,255,.9)'; g.strokeText(tr('hud.suivant'), sx, sy - rs - 9);
        g.fillStyle = '#7a3a4a'; g.fillText(tr('hud.suivant'), sx, sy - rs - 9);
      }
    }
  }

  // Frise de la chaîne en bas de l'écran (silhouettes pour les inconnues).
  function dessinerFrise(g, but) {
    const n = S.RANGS.length;
    const tw = Math.min(W - 16, n * 52), slot = tw / n, x0 = (W - tw) / 2, y = H - bas / 2 - 2;
    g.fillStyle = 'rgba(255,255,255,.78)'; rrect(g, x0 - 6, y - slot * 0.5 - 4, tw + 12, slot + 8, 18); g.fill();
    for (let i = 0; i < n; i++) {
      const cx = x0 + slot * (i + 0.5), r = slot * (0.26 + i * 0.022);
      if (i === but) { g.strokeStyle = '#ffb400'; g.lineWidth = 3; rond(g, cx, y, slot * 0.46); g.stroke(); }
      if (i <= prog.meilleur || i <= 1) {
        g.save(); g.translate(cx, y); g.scale(r, r); dessinerFriandise(g, { rang: i }, { face: r > 10 }); g.restore();
      } else {
        g.fillStyle = 'rgba(90,51,36,.22)'; rond(g, cx, y, r); g.fill();
        g.setLineDash([3, 3]); g.strokeStyle = 'rgba(90,51,36,.45)'; g.lineWidth = 1.5; rond(g, cx, y, r); g.stroke(); g.setLineDash([]);
      }
      if (i < n - 1) { g.fillStyle = 'rgba(90,51,36,.35)'; g.beginPath(); const ax = cx + slot * 0.5; g.moveTo(ax - 3, y - 4); g.lineTo(ax + 3, y); g.lineTo(ax - 3, y + 4); g.fill(); }
    }
  }

  // Main animée du tutoriel (glisser, puis lâcher).
  function dessinerMain(g, x, y, appui) {
    g.save(); g.translate(x, y); g.scale(1.1, 1.1);
    g.fillStyle = '#ffe0c8'; g.strokeStyle = '#a5683a'; g.lineWidth = 2.5;
    rrect(g, -7, -6, 14, 30, 7); g.fill(); g.stroke();
    rrect(g, -18, 14, 36, 30, 13); g.fill(); g.stroke();
    if (appui) { g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 3; rond(g, 0, -10, 14); g.stroke(); }
    g.restore();
  }

  // ------------------------------------------------------------------------
  // États du jeu
  // ------------------------------------------------------------------------
  let etat = 'titre';
  let P = null;               // partie en cours (ou bocal vivant du titre)

  let finT = 0;               // temps depuis la fin (animation)

  let toucheG = false, toucheD = false;

  let tutoActif = false;

  const ECRANS = ['ecran-titre', 'ecran-niveaux', 'ecran-collection', 'ecran-intro', 'ecran-pause', 'ecran-fin', 'ecran-bilan'];

  // Bocal vivant derrière l'écran titre : le robot joue tout seul.

    demoTitre = S.creerPartie(0, 1000 + Math.floor(Math.random() * 9999), { b: 'classique', lache: { 0: 3, 1: 3, 2: 2, 3: 1 }, buts: [{ k: 'rang', r: 7, n: 99 }], p3: 1, p2: 1 });
    demoAttente = 0.6;

  function animerDemo(dt) {
    if (!demoTitre || demoTitre.fini || demoTitre.corps.length > 38) nouveauDemo();
    S.pas(demoTitre, dt);
    demoTitre.evts.length = 0;
    demoAttente -= dt;
    if (demoAttente <= 0 && demoTitre.cooldown <= 0) {
      S.viser(demoTitre, S.choisirX(demoTitre, 6));
      S.lacher(demoTitre);

    }
  }

  function allerTitre() {

  function apercuBocal(c, decor) {

    [[0, -22, 4], [-26, -14, 3], [24, -15, 2], [-6, -42, 1], [20, -40, 0]].forEach(([x, y, r]) => { const k = S.nouveauCorps(p, { rang: r }, x, y); p.corps.push(k); });
    const V = { s: w / 175, ox: w / 2, oy: w * 0.92 };
    dessinerBocalArriere(g, V, p);
    for (const k of p.corps) dessinerCorps(g, V, k, p);
    dessinerBocalAvant(g, V, p, decor, 0);
  }
  function apercuParfum(c, d) {
    const g = c.getContext('2d'), w = c.width;
    g.clearRect(0, 0, w, w);
    [[0.3, 0.62, 0, 0.2], [0.7, 0.62, 4, 0.24], [0.5, 0.32, 5, 0.26]].forEach(([x, y, r, k]) => {
      g.save(); g.translate(x * w, y * w); g.scale(w * k, w * k); dessinerFriandise(g, { rang: r }, { parfum: d, face: true }); g.restore();
    });
  }

  // Texte d'un objectif.
  function texteBut(b) {

  // Carte d'introduction d'un niveau (avec la démonstration de sa nouveauté).

  function lancerNiveau(i) {
    niv = i;
    enPartie = true;
    try { if (Son.ctx && Son.ctx.state === 'suspended') Son.ctx.resume(); } catch (e) { /* rien */ }
    P = S.creerPartie(i, (Date.now() & 0xffff) + i * 977);

  function commencer() {

    demoIntro = null;
    etat = 'jeu';
    tutoActif = niv === 0;
    montrer(null);
    majHud(true);
    Son.clic();

  // ------------------------------------------------------------------------
  // Démonstrations animées des nouveautés (vraie physique, scénario écrit)
  // ------------------------------------------------------------------------
  const SCENARIOS = {
    lacher: { def: { b: 'classique', lache: { 0: 1 } }, pas: [[0.3, { rang: 0 }, -10], [1.3, { rang: 0 }, -8], [2.6, { rang: 1 }, 24], [3.6, { rang: 1 }, 26]], duree: 5.5, main: true },
    chaine: { def: { b: 'classique', lache: { 0: 1 } }, pas: [[0.2, { rang: 2 }, 0], [0.9, { rang: 1 }, 0], [1.8, { rang: 1 }, 2], [3.0, { rang: 0 }, -30], [3.6, { rang: 0 }, -28]], duree: 5.6 },
    cascade: { def: { b: 'classique', lache: { 0: 1 } }, pre: [[{ rang: 3 }, 0, -11], [{ rang: 2 }, 0, -32]], pas: [[0.6, { rang: 1 }, 2], [1.5, { rang: 1 }, 0]], duree: 4.5 },
    cascade3: { def: { b: 'classique', lache: { 0: 1 } }, pre: [[{ rang: 4 }, 0, -13], [{ rang: 3 }, 0, -37], [{ rang: 2 }, 0, -55]], pas: [[0.6, { rang: 1 }, 0], [1.5, { rang: 1 }, 1]], duree: 5 },
    etroit: { def: { b: 'etroit', lache: { 0: 1 } }, pas: [[0.2, { rang: 2 }, 0], [0.9, { rang: 1 }, -10], [1.6, { rang: 1 }, -9], [2.6, { rang: 0 }, 12], [3.3, { rang: 0 }, 11]], duree: 5 },
    penche: { def: { b: 'classique', angle: 0.2, lache: { 0: 1 } }, pas: [[0.2, { rang: 1 }, 20], [1.0, { rang: 2 }, 10], [1.8, { rang: 1 }, 25], [2.7, { rang: 0 }, 0], [3.4, { rang: 0 }, 5]], duree: 5 },
    collant: { def: { b: 'classique', lache: { 0: 1 } }, pas: [[0.3, { rang: 1, collant: true }, -48], [1.7, { rang: 1 }, -44]], duree: 4.2 },
    garni: { def: { b: 'etroit', angle: 0.13, pre: 8, lache: { 0: 1 } }, pas: [[0.5, { rang: 1 }, 0], [1.5, { rang: 0 }, -12], [2.5, { rang: 2 }, 10], [3.4, { rang: 1 }, 4]], duree: 4.8 },
    etages: { def: { b: 'etages', lache: { 0: 1 } }, pas: [[0.2, { rang: 0 }, 0], [0.8, { rang: 1 }, 2], [1.5, { rang: 4 }, 10], [2.4, { rang: 2 }, -30], [3.2, { rang: 0 }, -2]], duree: 5 },
    soda: { def: { b: 'classique', lache: { 0: 1 }, soda: { x: 0, periode: 3.4 } }, pre: [[{ rang: 2 }, -2, -10], [{ rang: 1 }, 8, -26], [{ rang: 2 }, -6, -40], [{ rang: 3 }, 30, -12], [{ rang: 1 }, -30, -10]], pas: [], duree: 4.6, gele: true },
    tourne: { def: { b: 'classique', balance: { amp: 0.26, periode: 4 }, lache: { 0: 1 } }, pas: [[0.2, { rang: 2 }, 0], [1.0, { rang: 1 }, 10], [1.8, { rang: 3 }, -10], [2.6, { rang: 0 }, 0]], duree: 5 },
    arc: { def: { b: 'classique', lache: { 0: 1 } }, pre: [[{ rang: 3 }, 0, -11], [{ rang: 1 }, -30, -8], [{ rang: 2 }, 28, -9]], pas: [[0.6, { sp: 'arc' }, 1]], duree: 3.4 },
    boule: { def: { b: 'boule', lache: { 0: 1 } }, pas: [[0.2, { rang: 2 }, 0], [0.9, { rang: 3 }, 15], [1.6, { rang: 2 }, -14], [2.4, { rang: 1 }, 0], [3.1, { rang: 1 }, 2]], duree: 5 },
    geant: { def: { b: 'classique', lache: { 0: 1 } }, pre: [[{ rang: 0 }, -8, -6], [{ rang: 1 }, 6, -7], [{ rang: 0 }, 18, -6], [{ rang: 2 }, -22, -9], [{ rang: 0 }, -4, -18], [{ rang: 1 }, 30, -8]], pas: [[0.5, { sp: 'geant' }, 0]], duree: 4.2 },
    finale: { def: { b: 'grand', lache: { 0: 1 } }, pre: [[{ rang: 6 }, -20, -18], [{ rang: 5 }, 28, -16], [{ rang: 4 }, -5, -50]], pas: [[0.5, { rang: 4 }, -4], [1.4, { sp: 'arc' }, 30]], duree: 4.6 },
    niveau: null,
  };
  function demarrerDemoIntro(cle) {
    let sc = SCENARIOS[cle];
    if (!sc) { // niveau sans nouveauté : son propre bocal se remplit
      const d = NIVEAUX[niv];
      sc = { def: Object.assign({}, d, { buts: [], soda: d.soda ? { x: d.soda.x, periode: 4 } : null }), pas: [[0.2, { rang: 1 }, -10], [0.9, { rang: 2 }, 12], [1.6, { rang: 1 }, -9], [2.4, { rang: 0 }, 20], [3.1, { rang: 0 }, 21]], duree: 5 };
    }
    demoIntro = { sc, t: 0, P: null, i: 0 };
    rejouerDemo();
  }
  function rejouerDemo() {
    const d = demoIntro, sc = d.sc;
    const def = Object.assign({ buts: [], p3: 1, p2: 1 }, sc.def);
    d.P = S.creerPartie(0, 21, def);
    d.P.tenu = null;
    d.t = 0; d.i = 0;
    for (const [f, x, y] of sc.pre || []) d.P.corps.push(S.nouveauCorps(d.P, f, x, y));
  }
  function animerDemoIntro(dt) {
    const d = demoIntro;
    if (!d) return;
    d.t += dt;
    const sc = d.sc, p = d.P;
    while (d.i < sc.pas.length && d.t >= sc.pas[d.i][0]) {
      const [, f, x] = sc.pas[d.i];
      p.tenu = Object.assign({}, f); p.suivant = { rang: 0 }; p.cooldown = 0; p.x = x;
      S.lacher(p); p.tenu = null;
      d.i++;
    }
    S.pas(p, dt);
    for (const e of p.evts) if (e.k === 'fusion') eclatsDemo(p, e);
    p.evts.length = 0;
    p.fini = null;
    if (d.t > sc.duree) rejouerDemo();
    // prochaine friandise affichée (et main) pendant l'attente
    const prochain = sc.pas[d.i];
    if (prochain && prochain[0] - d.t < 0.7) { p.tenu = prochain[1]; p.x = prochain[2]; S.viser(p, prochain[2]); }
    dessinerDemoIntro();
  }
  const partsDemo = [];
  function eclatsDemo(p, e) {
    for (let i = 0; i < 10; i++) { const a = Math.random() * 6.28, v = 30 + Math.random() * 50; partsDemo.push({ x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 0.6, age: 0 }); }
  }
  function dessinerDemoIntro() {
    const c = $('intro-anim'), g = c.getContext('2d'), w = c.width, h = c.height;
    const d = demoIntro, p = d.P;
    g.clearRect(0, 0, w, h);
    const fondG = g.createLinearGradient(0, 0, 0, h); fondG.addColorStop(0, '#ffeef4'); fondG.addColorStop(1, '#ffd6e4');
    g.fillStyle = fondG; g.fillRect(0, 0, w, h);
    g.fillStyle = '#e0a77a'; g.fillRect(0, h - 22, w, 22);
    const V = {};
    calculerVue(V, p.def, w, h, 6, 18);
    dessinerScene(g, V, p, { suivant: false, guide: false, decor: 'verre' });
    for (const q of partsDemo) {
      q.age += 1 / 60; q.x += q.vx / 60; q.y += q.vy / 60;
      const [x, y] = versEcran(V, q.x, q.y);
      g.globalAlpha = Math.max(0, 1 - q.age / q.vie); g.fillStyle = '#ffd23f'; rond(g, x, y, 4); g.fill();
    }
    g.globalAlpha = 1;
    for (let i = partsDemo.length - 1; i >= 0; i--) if (partsDemo[i].age > partsDemo[i].vie) partsDemo.splice(i, 1);
    if (p.def.soda && p.soda && p.soda.etat !== 'calme') {
      const [sx, sy] = versEcran(V, ...S.versMonde(p, p.def.soda.x, -4));
      g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 2;
      for (let i = 0; i < (p.soda.etat === 'gerbe' ? 14 : 4); i++) { rond(g, sx + (Math.random() - 0.5) * 30 * V.s, sy - Math.random() * (p.soda.etat === 'gerbe' ? 120 : 20) * V.s, 2 + Math.random() * 5); g.stroke(); }
    }
    if (d.sc.main && p.tenu) {
      const r = S.rayonDe(p.tenu);
      const [x, y] = versEcran(V, p.x, S.hauteurLacher(p, r));
      dessinerMain(g, x + 6, y + r * V.s + 30, d.t % 1 > 0.6);
    }
  }

  // ------------------------------------------------------------------------
  // Barre du haut
  // ------------------------------------------------------------------------
  let hudCache = '';
  function majHud(force) {
    if (!P) return;
    const obj = S.objectifs(P);
    const cle = obj.map((o) => o.fait).join(',') + '|' + P.lache;
    if (cle === hudCache && !force) return;
    const avant = hudCache.split('|')[0].split(',');
    hudCache = cle;
    $('hud-niv').textContent = tr('hud.niveau', { n: niv + 1 });
    const zone = $('hud-buts');
    if (force || zone.children.length !== obj.length) {
      zone.textContent = '';
      obj.forEach((o, i) => {
        const p = document.createElement('div'); p.className = 'puce';

      prog.etoiles[niv] = Math.max(prog.etoiles[niv], e);
      if (record) prog.records[niv] = P.score;
      prog.atteint = Math.max(prog.atteint, Math.min(NIVEAUX.length, niv + 2));

      if (window.FMG) window.FMG.reportEnd({ completed: true, level: niv + 1 });

  // ------------------------------------------------------------------------

  let dernier = performance.now();
  function boucle(maintenant) {
    let dt = (maintenant - dernier) / 1000;
    dernier = maintenant;
    if (!(dt > 0)) dt = 0;
    dt = Math.min(dt, 0.05);
    tempsRendu += dt;

    const partie = (etat === 'titre' || etat === 'niveaux' || etat === 'collection') ? demoTitre : P;
    if (etat === 'titre' || etat === 'niveaux' || etat === 'collection') animerDemo(dt);
    if (etat === 'intro') animerDemoIntro(dt);
    if (etat === 'jeu' && P) {
      const vitesse = 95;
      if (toucheG) S.viser(P, P.x - vitesse * dt);

  // ------------------------------------------------------------------------

  // ------------------------------------------------------------------------
  function dessinerAffiche() {

      const halo = g.createRadialGradient(hx, hy, 10, hx, hy, H * 0.55);
      halo.addColorStop(0, 'rgba(255,248,210,.95)'); halo.addColorStop(0.45, 'rgba(255,225,160,.45)'); halo.addColorStop(1, 'rgba(255,225,160,0)');
      g.fillStyle = halo; g.fillRect(0, 0, W, H);
      // le bocal héros, en grand, rempli par la vraie physique (sans fusion)
      const p = S.creerPartie(0, 9, { b: 'boule', lache: { 0: 1 }, buts: [], p3: 1, p2: 1 });
      p.sansFusion = true; p.prep = true;
      const tas = [[5, -20], [4, 30], [4, -42], [3, 8], [2, -30], [3, 40], [2, 18], [1, -12], [2, -44], [0, 30], [1, 44], [0, -2], [3, -24], [1, 16]];

        for (let k = 0; k < 14; k++) S.pas(p, 1 / 30);
      }
      for (let k = 0; k < 90; k++) S.pas(p, 1 / 30);
      for (const c of p.corps) c.rot = ((c.id * 37) % 9 - 4) * 0.05;
      const V = { s: echelle };
      V.ox = W / 2; V.oy = H * 0.74;
      dessinerBocalArriere(g, V, p);
      for (const c of p.corps) dessinerCorps(g, V, c, p, { humeur: 0 });
      // fusion en cours : un gâteau jaillit au-dessus de la pile, éclats tout autour
      const fx = 0, fy = -158;
      const [ex, ey] = versEcran(V, fx, fy);
      const eclat = g.createRadialGradient(ex, ey, 4, ex, ey, 46 * V.s);

      g.strokeStyle = 'rgba(255,215,60,.95)'; g.lineWidth = 3 * V.s; g.lineCap = 'round';
      for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; g.beginPath(); g.moveTo(ex + Math.cos(a) * 26 * V.s, ey + Math.sin(a) * 26 * V.s); g.lineTo(ex + Math.cos(a) * 40 * V.s, ey + Math.sin(a) * 40 * V.s); g.stroke(); }
      dessinerBocalAvant(g, V, p, 'verre', 0);
      dessinerCorps(g, V, { x: fx, y: fy, r: 27, rot: -0.06, rang: 6, cligne: 9, grandit: 0, fond: 0 }, null, { humeur: 3 });
      // deux friandises pareilles qui arrivent du haut, et le bonbon arc-en-ciel
      dessinerCorps(g, V, { x: -54, y: -196, r: 11.4, rot: 0.3, rang: 2, cligne: 9 }, null, { humeur: 3 });
      dessinerCorps(g, V, { x: 56, y: -188, r: 9, rot: -0.4, sp: 'arc' }, null);
      for (let i = 0; i < 26; i++) {
        const a = i * 2.4, rr = 30 + (i * 13) % 34;
        const [x, y] = versEcran(V, fx + Math.cos(a) * rr, fy + Math.sin(a) * rr * 0.8);
        g.fillStyle = ['#ffd23f', '#ff6fa3', '#5fd3b0', '#fff'][i % 4];
        g.beginPath(); for (let k = 0; k < 10; k++) { const an = k * Math.PI / 5, q = (k % 2 ? 1.6 : 4) * V.s * 0.8; g.lineTo(x + Math.cos(an) * q, y + Math.sin(an) * q); } g.closePath(); g.fill();
      }
      // premier plan : sucettes et bonbons géants coupés par les bords
      const devant = [[-0.02, 0.9, 1, 0.16], [1.02, 0.88, 0, 0.13], [0.12, 0.97, 4, 0.1], [0.9, 1.0, 5, 0.12]];
      for (const [x, y, r, k] of devant) {
        g.save(); g.translate(W * x, H * y); g.rotate((x - 0.5) * 0.5); g.scale(W * k, W * k);
        dessinerFriandise(g, { rang: r }, { face: true }); g.restore();
      }
      // vignette douce
      const vg = g.createRadialGradient(W / 2, H * 0.45, H * 0.3, W / 2, H * 0.45, H * 0.85);
      vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(120,30,60,.28)');
      g.fillStyle = vg; g.fillRect(0, 0, W, H);
    };
    peindre();
    window.addEventListener('resize', peindre);
  }

  // ------------------------------------------------------------------------
  // Images du jeu : une vraie partie posée par le robot, puis figée
  // ------------------------------------------------------------------------
  function ouvrirApercu(n) {
    const choix = { 1: { i: 0, lache: 6, graine: 17 }, 2: { i: 9, lache: 14, graine: 5 }, 3: { i: 16, lache: 22, graine: 8 } }[n] || { i: 0, lache: 4, graine: 17 };
    niv = choix.i;
    prog.meilleur = n === 1 ? 1 : 5;
    const fabriquer = (graine) => {
      const p = S.creerPartie(niv, graine);
      let t = 0, attente = 0;
      while (p.lache < choix.lache && t < 400) {
        S.pas(p, 1 / 30); t += 1 / 30; attente -= 1 / 30;
        if (p.fini) break;
        if (attente <= 0 && p.cooldown <= 0) { S.viser(p, S.choisirX(p, 2)); S.lacher(p); attente = 1.0; }
      }
      for (let k = 0; k < 20 && !p.fini; k++) S.pas(p, 1 / 30);
      return p;
    };
    let p = null;
    for (let g = choix.graine; g < choix.graine + 40; g++) { p = fabriquer(g); if (!p.fini && p.debord === 0) break; }
    p.fini = null; p.evts.length = 0;
    P = p;
    // la friandise tenue se place au-dessus d'une pareille, avec un petit éclat de fusion
    S.viser(P, S.choisirX(P, 0));
    P.cooldown = 0;
    etat = 'jeu';
    montrer(null);
    majHud(true);
    if (P.corps.length) {
      const c = P.corps[P.corps.length - 1];
      eclats(c.x, c.y, 14, ['#ffd23f', '#fff', coul(Math.max(0, c.rang), 10)], 50);
      if (n > 1) texteFlottant(c.x, c.y - c.r - 6, tr('fx.cascade', { n: 2 }), '#ffe14d', 10);
    }
    if (n === 2 && P.soda) bulles(P, 25);
    // figé : on dessine sans faire avancer la partie
    const peindre = () => { majParticules(0.25); dessiner(P); };
    tempsRendu = 0.3;
    peindre();
    window.addEventListener('resize', () => { redimensionner(); peindre(); });
  }

  // ------------------------------------------------------------------------
  // Démarrage
  // ------------------------------------------------------------------------
  redimensionner();
  chargerProgression();
  parfumCourant = PARFUMS.find((d) => d.id === prog.parfum) || PARFUMS[0];
  majSon();
  if (AFFICHE) { dessinerAffiche(); return; }
  if (APERCU) { ouvrirApercu(APERCU); return; }
  nouveauDemo();
  for (let i = 0; i < 240; i++) { animerDemo(1 / 30); }
  allerTitre();
  requestAnimationFrame((t) => { dernier = t; boucle(t); });
})();
</script>
