  // --- Panneau : ticket + pavé ---
  function panneauTicket(avecBoutonTout) {
    var pan = $('#panneau'); pan.innerHTML = '';
    var tk = el('div', 'ticket');
    var lignes = el('div', 'ticket-lignes'); lignes.id = 'ticket';
    lignes.appendChild(el('span', 'aide', t(avecBoutonTout ? 'ticket.videCommande' : 'ticket.vide')));
    tk.appendChild(lignes);
    var tot = el('div', 'ticket-total');
    tot.appendChild(el('span', null, t('ticket.total')));
    var aff = el('span', 'afficheur', '?'); aff.id = 'afficheur';
    tot.appendChild(aff);
    tk.appendChild(tot);
    pan.appendChild(tk);
    var aide = el('div', 'aide'); aide.id = 'aide'; pan.appendChild(aide);
    if (avecBoutonTout) {
      var bt = el('button', 'btn vert btn-plein', t('commande.fini')); bt.id = 'btn-tout'; bt.tabIndex = -1;
      bt.addEventListener('click', verifierCommande);
      pan.appendChild(bt);
    }
    pan.appendChild(construirePave());
  }
  function construirePave() {
    var pave = el('div', 'pave inactif'); pave.id = 'pave';
    ['1', '2', '3', 'eff', '4', '5', '6', '0', '7', '8', '9', 'ok'].forEach(function (k) {
      var b = el('button', k === 'ok' ? 'ok' : (k === 'eff' ? 'eff' : ''));
      b.tabIndex = -1;
      if (k === 'eff') { b.textContent = '⌫'; b.setAttribute('aria-label', t('pave.effacer')); }
      else if (k === 'ok') { b.textContent = '✔'; b.setAttribute('aria-label', t('pave.valider')); }
      else b.textContent = k;
      b.addEventListener('click', function () { toucheChiffre(k); });
      pave.appendChild(b);
    });
    return pave;
  }
  function activerPave(oui) { var p = $('#pave'); if (p) p.classList.toggle('inactif', !oui); }
  function aide(cle, vars, classe) {
    var a = $('#aide'); if (!a) return;
    a.className = 'aide' + (classe ? ' ' + classe : '');
    a.textContent = cle ? t(cle, vars) : '';
  }
  function majAfficheur(etatAff) {
    var a = $('#afficheur'); if (!a) return;
    a.textContent = etat.saisie === '' ? '?' : etat.saisie;
    a.className = 'afficheur' + (etatAff ? ' ' + etatAff : '');
  }
  function puceTicket(p, offert) {
    var pr = PRODUITS[p];
    var s = el('span', 'puce' + (offert ? ' offert' : ''));
    s.appendChild(el('span', null, pr.e));
    var px = el('span', 'prix'); px.innerHTML = String(pr.prix) + svgGland(); s.appendChild(px);
    return s;
  }

  // ------------------------------------------------------------------------
  // Phase « caisse » : passer chaque produit
  // ------------------------------------------------------------------------
  function phaseCaisse() {
    var c = etat.ev;
    etat.phase = 'caisse';
    var cpt = $('#comptoir'); cpt.innerHTML = '';
    c.articles.forEach(function (p, i) {
      var b = boutonArticle(p, p === etat.promoProd);
      b.dataset.i = i;
      b.addEventListener('click', function () { scanner(i); });
      cpt.appendChild(b);
    });
    panneauTicket(false);
    aide('aide.scanner');
    marquerCurseurArticle();
    var liste = [];
    if (etat.cfg.nouveau === 'caisse') liste.push('caisse');
    if (c.rare) liste.push('rare');
    if (c.presse) liste.push('presse');
    if (c.articles.indexOf(etat.promoProd) >= 0) liste.push('promo');
    if (c.coupon) liste.push('coupon');
    tutoriels(liste);
  }
  function marquerCurseurArticle() {
    var arts = document.querySelectorAll('#comptoir .article');
    arts.forEach(function (a) { a.classList.remove('curseur'); });
    for (var i = 0; i < arts.length; i++) if (!arts[i].classList.contains('passe')) { arts[i].classList.add('curseur'); break; }
  }
  function scanner(i) {
    if (etat.phase !== 'caisse') return;
    var b = document.querySelector('#comptoir .article[data-i="' + i + '"]');
    if (!b || b.classList.contains('passe')) return;
    var c = etat.ev, p = c.articles[i];
    b.classList.add('passe');
    SON.bip();
    if (etat.ticket.length === 0) $('#ticket').innerHTML = '';
    etat.ticket.push(p);
    var tk = $('#ticket');
    if (etat.ticket.length > 1) tk.appendChild(el('span', 'signe', '+'));
    var nPromo = etat.ticket.filter(function (x) { return x === etat.promoProd; }).length;
    var puce = puceTicket(p, false);
    puce.dataset.p = p; puce.dataset.n = p === etat.promoProd ? nPromo : 0;
    tk.appendChild(puce);
    voler(b, puce, PRODUITS[p].e);
    marquerCurseurArticle();
    if (etat.ticket.length === c.articles.length) {
      etat.phase = 'total';
      activerPave(true);
      aide(c.coupon ? 'aide.totalBon' : 'aide.total', { v: c.coupon });
    }
  }

  // ------------------------------------------------------------------------
  // Phase « commande » : prendre les produits demandés sur l'étagère
  // ------------------------------------------------------------------------
  function phaseCommande() {
    var c = etat.ev;
    etat.phase = 'commande';
    var cpt = $('#comptoir'); cpt.innerHTML = '';
    cpt.classList.add('mode-etagere');
    produitsDispo().forEach(function (p, i) {
      var b = boutonArticle(p, p === etat.promoProd);
      b.dataset.p = p; b.dataset.i = i;
      b.addEventListener('click', function () { prendre(p, b); });
      cpt.appendChild(b);
    });
    panneauTicket(true);
    aide('aide.commande');
    etat.curseur = 0; marquerCurseurEtagere();
    var liste = ['commande'];
    if (c.rare) liste.push('rare');
    if (c.presse) liste.push('presse');
    if (c.coupon) liste.push('coupon');
    tutoriels(liste);
  }
  function marquerCurseurEtagere() {
    var arts = document.querySelectorAll('#comptoir .article');
    arts.forEach(function (a, i) { a.classList.toggle('curseur', i === etat.curseur); });
  }
  function redessinerTicketCommande() {
    var tk = $('#ticket'); tk.innerHTML = '';
    if (!etat.ticket.length) { tk.appendChild(el('span', 'aide', t('ticket.videCommande'))); return; }
    etat.ticket.forEach(function (p, i) {
      if (i) tk.appendChild(el('span', 'signe', '+'));
      var b = el('button', 'puce');
      b.tabIndex = -1;
      b.appendChild(el('span', null, PRODUITS[p].e));
      var px = el('span', 'prix'); px.innerHTML = String(PRODUITS[p].prix) + svgGland(); b.appendChild(px);
      b.setAttribute('aria-label', t('aria.reposer', { nom: t('prod.' + p) }));
      b.addEventListener('click', function () { if (etat.phase !== 'commande') return; etat.ticket.splice(i, 1); SON.reprise(); redessinerTicketCommande(); });
      tk.appendChild(b);
    });
  }
  function prendre(p, b) {
    if (etat.phase !== 'commande') return;
    if (etat.ticket.length >= 12) { SON.erreur(); return; }
    etat.ticket.push(p);
    SON.bip();
    redessinerTicketCommande();
    var puces = document.querySelectorAll('#ticket .puce');
    voler(b, puces[puces.length - 1], PRODUITS[p].e);
  }
  function verifierCommande() {
    if (etat.phase !== 'commande') return;
    var c = etat.ev;
    var a = c.articles.slice().sort().join(','), b = etat.ticket.slice().sort().join(',');
    if (a === b) { commandeJuste(); return; }
    if (faute()) return;
    etat.essais++;
    if (etat.essais >= 2) {
      // Le bon panier est préparé pour l'enfant, puis on passe au total.
      etat.phase = 'attente';
      etat.ticket = c.articles.slice();
      redessinerTicketCommande();
      aide('aide.commandeCorrigee', null, 'erreur');
      planifier(1800, commandeJuste);
    } else aide('aide.commandeFausse', null, 'erreur');
  }
  function commandeJuste() {
    var c = etat.ev;
    SON.juste();
    etat.phase = 'total'; etat.essais = 0;
    var bt = $('#btn-tout'); if (bt) bt.remove();
    // Le ticket se fige : chaque produit avec son prix.
    var tk = $('#ticket'); tk.innerHTML = '';
    var nPromo = 0;
    etat.ticket.forEach(function (p, i) {
      if (i) tk.appendChild(el('span', 'signe', '+'));
      var puce = puceTicket(p, false);
      if (p === etat.promoProd) nPromo++;
      puce.dataset.p = p; puce.dataset.n = p === etat.promoProd ? nPromo : 0;
      tk.appendChild(puce);
    });
    document.querySelectorAll('#comptoir .article').forEach(function (x) { x.classList.add('passe'); });
    activerPave(true);
    aide(c.coupon ? 'aide.totalBon' : 'aide.total', { v: c.coupon });
  }

  // ------------------------------------------------------------------------
  // Pavé numérique (total, livraison)
  // ------------------------------------------------------------------------
  function toucheChiffre(k) {
    if (etat.phase !== 'total' && etat.phase !== 'livraison') return;
    if (k === 'ok') { valider(); return; }
    SON.touche();
    if (k === 'eff') etat.saisie = etat.saisie.slice(0, -1);
    else if (etat.saisie.length < 3) etat.saisie = (etat.saisie === '0' ? '' : etat.saisie) + k;
    majAfficheur();
  }
  function valider() {
    if (etat.saisie === '') { SON.erreur(); aide('aide.tapeNombre', null, 'erreur'); return; }
    if (etat.phase === 'total') validerTotal();
    else if (etat.phase === 'livraison') validerLivraison();
  }

  function expressionTotal(c) {
    var parts = etat.ticket.map(function (p) { return PRODUITS[p].prix; }).join(' + ');
    var s = parts;
    if (c.offert) s += ' − ' + c.offert;
    if (c.coupon) s += ' − ' + c.coupon;
    return s;
  }
  function validerTotal() {
    if (etat.phase !== 'total') return;
    var c = etat.ev, v = parseInt(etat.saisie, 10);
    if (v === c.total) {
      majAfficheur('juste');
      SON.juste();
      etat.phase = 'attente';
      flotter($('#afficheur'), '✔');
      if (etat.cfg.paie === 'exact') planifier(500, paiementExact);
      else planifier(500, phaseMonnaie);
      return;
    }
    majAfficheur('faux');
    if (faute()) return;
    etat.essais++;
    if (etat.essais >= 2) {
      etat.saisie = String(c.total);
      etat.phase = 'attente';
      planifier(250, function () { majAfficheur('juste'); });
      aide('aide.solution', { calcul: expressionTotal(c), n: c.total }, 'erreur');
      planifier(2200, function () { if (etat.cfg.paie === 'exact') paiementExact(); else phaseMonnaie(); });
    } else {
      etat.saisie = '';
      planifier(500, function () { if (etat.phase === 'total') majAfficheur(); });
      montrerOfferts();
      aide('aide.indice', { calcul: expressionTotal(c) }, 'erreur');
    }
  }
  // Après une erreur, le produit offert de la promotion est montré sur le ticket.
  function montrerOfferts() {
    var c = etat.ev; if (!c.offert) return;
    document.querySelectorAll('#ticket .puce').forEach(function (p) {
      if (p.dataset.p === etat.promoProd && Number(p.dataset.n) % 3 === 0 && Number(p.dataset.n) > 0) p.classList.add('offert');
    });
  }

  // Les courses passées attendent dans le panier du client pendant le paiement.
  function montrerPanier() {
    var cpt = $('#comptoir'); cpt.innerHTML = ''; cpt.classList.remove('mode-etagere');
    var p = el('div', 'panier');
    p.appendChild(el('span', 'anse', '🧺'));
    etat.ticket.forEach(function (x) { p.appendChild(el('span', null, PRODUITS[x].e)); });
    cpt.appendChild(p);
  }

  // Le client paie juste (niveaux 1 et 2) : les pièces vont dans la caisse.
  function paiementExact() {
    var c = etat.ev;
    etat.phase = 'attente';
    montrerPanier();
    var pan = $('#panneau'); pan.innerHTML = '';
    var l = el('div', 'ligne-paie');
    var bx = el('div', 'boite recu');
    bx.appendChild(el('small', null, t('monnaie.recu')));
    var pr = el('div', 'pieces-recues');
    c.recu.forEach(function (v) { pr.appendChild(piece(v, 'moyen')); });
    bx.appendChild(pr); l.appendChild(bx); pan.appendChild(l);
    pan.appendChild(el('div', 'aide bravo', t('aide.paieJuste')));
    SON.piece();
    planifier(900, clientServi);
  }

  // ------------------------------------------------------------------------
  // Phase « monnaie » : rendre la monnaie
  // ------------------------------------------------------------------------
  function piece(v, taille) {
    var b = el('button', 'piece ' + (v <= 2 ? 'cuivre ' : '') + (taille || ('p' + v)), String(v));
    b.tabIndex = -1;
    b.setAttribute('aria-label', t('aria.piece', { n: v }));
    return b;
  }
  function phaseMonnaie() {
    var c = etat.ev;
    etat.phase = 'monnaie'; etat.essais = 0; etat.plateau = []; etat.curseur = 0;
    montrerPanier();
    var pan = $('#panneau'); pan.innerHTML = '';
    var l = el('div', 'ligne-paie');
    var bt = el('div', 'boite');
    bt.appendChild(el('small', null, t('monnaie.aPayer')));
    bt.appendChild(el('b', null, String(c.total)));
    l.appendChild(bt);
    var bx = el('div', 'boite recu'); bx.id = 'recu';
    bx.appendChild(el('small', null, t('monnaie.recu')));
    var pr = el('div', 'pieces-recues');
    c.recu.forEach(function (v) { var p = piece(v, 'mini'); p.disabled = true; pr.appendChild(p); });
    bx.appendChild(pr);
    l.appendChild(bx);
    pan.appendChild(l);
    var pl = el('div', 'plateau'); pl.id = 'plateau';
    pl.appendChild(el('small', null, t('monnaie.rends')));
    var pp = el('div', 'pieces-plateau'); pp.id = 'pieces-plateau';
    pl.appendChild(pp);
    var cpt = el('b', 'compte', etat.cfg.panne ? '?' : '0'); cpt.id = 'compte';
    if (etat.cfg.panne) cpt.setAttribute('aria-label', t('monnaie.panne'));
    pl.appendChild(cpt);
    pan.appendChild(pl);
    var ti = el('div', 'tiroir'); ti.id = 'tiroir';
    [1, 2, 5, 10].forEach(function (v, i) {
      var p = piece(v);
      p.addEventListener('click', function () { etat.curseur = i; ajouterPiece(v, p); });
      ti.appendChild(p);
    });
    pan.appendChild(ti);
    var br = el('button', 'btn vert btn-plein', t('monnaie.rendre')); br.id = 'btn-rendre'; br.tabIndex = -1;
    br.addEventListener('click', rendre);
    pan.appendChild(br);
    var a = el('div', 'aide'); a.id = 'aide'; pan.appendChild(a);
    aide(c.optimal ? 'aide.monnaieOptimal' : 'aide.monnaie');
    marquerCurseurTiroir();
    var liste = [];
    if (etat.cfg.nouveau === 'monnaie') liste.push('monnaie');
    if (c.recu.length > 1 && c.rendu > 0 && etat.cfg.paie === 'plusieurs') liste.push('plusieurs');
    if (c.rendu === 0 && etat.cfg.nouveau === 'rien') liste.push('rien');
    if (c.optimal) liste.push('optimal');
    if (etat.cfg.panne) liste.push('panne');
    tutoriels(liste);
  }
  function marquerCurseurTiroir() {
    document.querySelectorAll('#tiroir .piece').forEach(function (p, i) { p.classList.toggle('curseur', i === etat.curseur); });
  }
  function redessinerPlateau() {
    var pp = $('#pieces-plateau'); if (!pp) return;
    pp.innerHTML = '';
    etat.plateau.forEach(function (v, i) {
      var p = piece(v, 'moyen');
      p.setAttribute('aria-label', t('aria.reprendre', { n: v }));
      p.addEventListener('click', function () { retirerPiece(i); });
      pp.appendChild(p);
    });
    var cpt = $('#compte');
    if (cpt && !etat.cfg.panne) cpt.textContent = String(somme(etat.plateau));
  }
  function ajouterPiece(v, depuis) {
    if (etat.phase !== 'monnaie') return;
    if (etat.plateau.length >= 14) { SON.erreur(); return; }
    etat.plateau.push(v);
    SON.piece();
    redessinerPlateau();
    var ps = document.querySelectorAll('#pieces-plateau .piece');
    if (depuis) voler(depuis, ps[ps.length - 1], '🪙');
  }
  function retirerPiece(i) {
    if (etat.phase !== 'monnaie') return;
    etat.plateau.splice(i, 1);
    SON.reprise();
    redessinerPlateau();
  }
  function rendre() {
    if (etat.phase !== 'monnaie') return;
    var c = etat.ev, s = somme(etat.plateau);
    var minimum = decomposer(c.rendu).length;
    if (s === c.rendu && (!c.optimal || etat.plateau.length <= minimum)) {
      if (etat.plateau.length === minimum && c.rendu > 0) { c.parfaite = true; }
      etat.phase = 'attente';
      SON.piece();
      planifier(150, clientServi);
      return;
    }
    if (faute()) return;
    etat.essais++;
    var cle;
    if (s === c.rendu) cle = 'aide.tropDePieces';
    else if (s > c.rendu) cle = 'aide.tropRendu';
    else cle = 'aide.pasAssez';
    if (etat.essais >= 2) {
      etat.phase = 'attente';
      etat.plateau = decomposer(c.rendu);
      redessinerPlateau();
      if (etat.cfg.panne) $('#compte').textContent = String(c.rendu);
      aide('aide.solutionMonnaie', { paye: c.paye, total: c.total, n: c.rendu }, 'erreur');
      planifier(2300, clientServi);
    } else {
      aide(cle, { n: minimum }, 'erreur');
      $('#plateau').classList.add('secoue');
      planifier(400, function () { var p = $('#plateau'); if (p) p.classList.remove('secoue'); });
    }
  }

  // ------------------------------------------------------------------------
  // Client servi, client parti, erreurs
  // ------------------------------------------------------------------------
  function faute() {
    SON.erreur();
    etat.erreurs++; etat.coeurs--;
    var c = etat.ev; if (c) c.parfait = false;
    $('#ecran-jeu').classList.add('secoue');
    setTimeout(function () { $('#ecran-jeu').classList.remove('secoue'); }, 380);
    var cl = $('#client'); cl.classList.add('fache');
    setTimeout(function () { cl.classList.remove('fache'); }, 420);
    majHud();
    if (etat.coeurs <= 0) {
      etat.phase = 'attente';
      planifier(900, function () { finJournee(false); });
      return true;
    }
    return false;
  }

  function clientServi() {
    var c = etat.ev;
    etat.phase = 'attente';
    var duree = etat.temps - etat.tDebutClient;
    var pts = 10 + Math.max(0, 10 - Math.floor(duree / 4));
    var extras = [];
    if (c.presse) { pts += 5; extras.push(t('bonus.presse')); }
    if (c.parfaite) { pts += 5; extras.push(t('bonus.parfaite')); }
    if (c.rare) {
      if (c.parfait) {
        pts += 15;
        if (sauve.rares.indexOf(c.rare[0]) < 0) { sauve.rares.push(c.rare[0]); sauver(); etat.raresGagnes.push(c.rare); }
        SON.rare();
      }
    }
    etat.score += pts; etat.servis++;
    majHud();
    SON.kaching();
    var cl = $('#client');
    flotter(cl, t('points', { n: pts }));
    confettis(18, cl);
    $('#ecureuil').classList.remove('content'); void $('#ecureuil').offsetWidth; $('#ecureuil').classList.add('content');
    var merci = c.rare && c.parfait ? t('dit.merciRare') : t('dit.merci' + alea(1, 4));
    if (extras.length) merci += ' ' + extras.join(' ');
    parler(c.nom, merci);
    $('#patience').classList.remove('visible');
    $('#bon').classList.remove('visible');
    planifier(1100, function () { cl.classList.add('dehors'); });
    planifier(1500, evenementSuivant);
  }

  function clientParti() {
    var c = etat.ev;
    etat.phase = 'attente';
    parler(c.nom, t('dit.parti'));
    $('#patience').classList.remove('visible');
    if (faute()) return;
    planifier(1200, function () { $('#client').classList.add('dehors'); });
    planifier(1700, evenementSuivant);
  }

  // ------------------------------------------------------------------------
  // Livraison : réassort des étagères (soustraction)
  // ------------------------------------------------------------------------
  function arriveeLivreur(ev) {
    var cl = $('#client');
    cl.textContent = '🦫';
    cl.className = 'client dehors';
    void cl.offsetWidth; cl.classList.remove('dehors');
    SON.pop();
    parler('animal.castor', t('dit.livreur'));
    var cpt = $('#comptoir'); cpt.innerHTML = '';
    cpt.appendChild(el('div', 'caisse-vide', '📦 📦 📦'));
    etat.tache = 0;
    planifier(450, tacheLivraison);
  }
  function tacheLivraison() {
    var ev = etat.ev, ta = ev.taches[etat.tache];
    etat.phase = 'livraison'; etat.essais = 0; etat.saisie = '';
    var pan = $('#panneau'); pan.innerHTML = '';
    pan.appendChild(el('div', 'liste-livreur', t('livraison.liste', { n: ta.cible, e: PRODUITS[ta.p].e })));
    var et = el('div', 'etal'); et.id = 'etal';
    for (var i = 0; i < ta.actuel; i++) et.appendChild(el('span', null, PRODUITS[ta.p].e));
    pan.appendChild(et);
    var tk = el('div', 'ticket');
    tk.appendChild(el('div', 'ticket-lignes', t('livraison.question', { n: ta.actuel, e: PRODUITS[ta.p].e })));
    var tot = el('div', 'ticket-total');
    tot.appendChild(el('span', null, '+'));
    var aff = el('span', 'afficheur', '?'); aff.id = 'afficheur';
    tot.appendChild(aff); tk.appendChild(tot);
    pan.appendChild(tk);
    var a = el('div', 'aide'); a.id = 'aide'; pan.appendChild(a);
    pan.appendChild(construirePave());
    activerPave(true);
    tutoriels(etat.cfg.nouveau === 'reassort' ? ['reassort'] : []);
  }
  function validerLivraison() {
    if (etat.phase !== 'livraison') return;
    var ta = etat.ev.taches[etat.tache], v = parseInt(etat.saisie, 10), bon = ta.cible - ta.actuel;
    if (v === bon) {
      majAfficheur('juste');
      etat.phase = 'attente';
      SON.juste();
      var et = $('#etal');
      for (var i = 0; i < bon; i++) {
        (function (i) { planifier(80 * i, function () { et.appendChild(el('span', null, PRODUITS[ta.p].e)); SON.pop(); }); })(i);
      }
      planifier(80 * bon + 500, finTacheLivraison);
      return;
    }
    majAfficheur('faux');
    if (faute()) return;
    etat.essais++;
    if (etat.essais >= 2) {
      etat.phase = 'attente';
      etat.saisie = String(bon);
      planifier(250, function () { majAfficheur('juste'); });
      aide('aide.solutionLivraison', { cible: ta.cible, actuel: ta.actuel, n: bon }, 'erreur');
      planifier(2300, finTacheLivraison);
    } else {
      etat.saisie = '';
      planifier(500, function () { if (etat.phase === 'livraison') majAfficheur(); });
      aide('aide.indiceLivraison', { cible: ta.cible, actuel: ta.actuel }, 'erreur');
    }
  }
  function finTacheLivraison() {
    var ev = etat.ev;
    etat.score += 10; majHud();
    flotter($('#etal'), t('points', { n: 10 }));
    confettis(10, $('#etal'));
    etat.tache++;
    if (etat.tache < ev.taches.length) { tacheLivraison(); return; }
    parler('animal.castor', t('dit.livreurMerci'));
    planifier(900, function () { $('#client').classList.add('dehors'); });
    planifier(1300, evenementSuivant);
  }

  // ------------------------------------------------------------------------
  // Fin de journée : victoire ou défaite
  // ------------------------------------------------------------------------
  function finJournee(gagne) {
    etat.actif = false; etat.phase = 'fin';
    var i = etat.niv, cfg = etat.cfg;
    var carte = $('#carte-fin'); carte.innerHTML = '';
    var etoilesAvant = totalEtoiles();
    if (gagne) {
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
      var et = 1;
      if (etat.erreurs <= 2) et = 2;
      if (etat.erreurs === 0 && etat.temps <= cfg.tCible) et = 3;
      var ancienRecord = sauve.records[i] || 0;
      var record = etat.score > ancienRecord;
      if (record) sauve.records[i] = etat.score;
      sauve.etoiles[i] = Math.max(sauve.etoiles[i] || 0, et);
      var debloqueAvant = sauve.debloque;
      if (i + 2 > sauve.debloque) sauve.debloque = Math.min(NIVEAUX.length, i + 2);
      sauver();
      journeeGagnee = i;
      JEL_SAVE.save(JEU, { niveau: Math.min(NIVEAUX.length, i + 2), score: etat.score });
      var derniere = i === NIVEAUX.length - 1;
      carte.appendChild(el('div', 'grand-ic', derniere ? '🏆' : '🎉'));
      carte.appendChild(el('h2', null, t(derniere ? 'fin.titreFinale' : 'fin.titreVictoire')));
      if (derniere) carte.appendChild(el('p', null, t('fin.finale', { n: totalEtoiles(), max: NIVEAUX.length * 3 })));
      var ets = el('div', 'etoiles-fin');
      for (var s = 0; s < 3; s++) ets.appendChild(el('span', null, '★'));
      carte.appendChild(ets);
      var stats = el('div', 'stats');
      var dScore = el('div'); dScore.appendChild(document.createTextNode(t('fin.score'))); var bS = el('b', null, '0'); dScore.appendChild(bS); stats.appendChild(dScore);
      var dTemps = el('div'); dTemps.appendChild(document.createTextNode(t('fin.temps'))); dTemps.appendChild(el('b', null, formatTemps(etat.temps))); stats.appendChild(dTemps);
      var dErr = el('div'); dErr.appendChild(document.createTextNode(t('fin.erreurs'))); dErr.appendChild(el('b', null, String(etat.erreurs))); stats.appendChild(dErr);
      var dRec = el('div'); dRec.appendChild(document.createTextNode(t('fin.record'))); dRec.appendChild(el('b', null, nb(Math.max(etat.score, ancienRecord)))); stats.appendChild(dRec);
      carte.appendChild(stats);
      carte.appendChild(el('p', 'record', record ? t('fin.nouveauRecord') : t('fin.pasRecord', { n: nb(ancienRecord) })));
      if (et < 3) carte.appendChild(el('p', null, t(etat.erreurs > 0 ? 'fin.conseilErreurs' : 'fin.conseilTemps', { s: formatTemps(cfg.tCible) })));
      var gains = el('div', 'gains');
      etat.raresGagnes.forEach(function (r) { gains.appendChild(el('div', null, t('fin.rare', { e: r[1], nom: t('rare.' + r[0]) }))); });
      RAYONS.forEach(function (r) { if (r.niv === i + 2 && debloqueAvant < r.niv) gains.appendChild(el('div', null, t('fin.rayon', { e: r.e, nom: t('rayon.' + r.id) }))); });
      ENSEIGNES.forEach(function (en, k) { if (etoilesAvant < en.seuil && totalEtoiles() >= en.seuil) gains.appendChild(el('div', null, t('fin.enseigne', { e: en.e, nom: t('enseigne.' + k) }))); });
      if (gains.childNodes.length) carte.appendChild(gains);
      var col = el('div', 'colonne-boutons');
      if (!derniere) col.appendChild(boutonFin('fin.suivant', 'btn gros vert', function () { lancerNiveau(i + 1); }));
      col.appendChild(boutonFin('fin.rejouer', 'btn', function () { lancerNiveau(i); }));
      col.appendChild(boutonFin('fin.niveaux', 'btn', function () { fermerVoiles(); afficher('niveaux'); }));
      carte.appendChild(col);
      $('#ov-fin').classList.add('visible');
      SON.victoire();
      confettis(60);
      // Étoiles qui s'allument une à une, score qui défile
      var spans = ets.querySelectorAll('span');
      for (var e = 0; e < et; e++) (function (e) { setTimeout(function () { spans[e].classList.add('on'); SON.etoile(e); }, 500 + e * 420); })(e);
      var debut = Date.now(), cible = etat.score;
      (function defiler() {
        var r = Math.min(1, (Date.now() - debut) / 1200);
        bS.textContent = nb(Math.round(cible * r));
        if (r < 1) requestAnimationFrame(defiler);
      })();
      var premier = col.querySelector('button'); setTimeout(function () { try { premier.focus(); } catch (e) { /* rien */ } }, 60);
    } else {
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: i + 1 });
      carte.appendChild(el('div', 'grand-ic', '🍂'));
      carte.appendChild(el('h2', null, t('fin.titreDefaite')));
      carte.appendChild(el('p', null, t('fin.defaite')));
      var st = el('div', 'stats');
      var d1 = el('div'); d1.appendChild(document.createTextNode(t('fin.servis'))); d1.appendChild(el('b', null, t('fin.servisN', { n: etat.servis, total: cfg.clients }))); st.appendChild(d1);
      var d2 = el('div'); d2.appendChild(document.createTextNode(t('fin.score'))); d2.appendChild(el('b', null, nb(etat.score))); st.appendChild(d2);
      carte.appendChild(st);
      carte.appendChild(el('p', 'record', t('fin.pasRecord', { n: nb(sauve.records[i] || 0) })));
      carte.appendChild(el('p', null, t('fin.astuce')));
      var col2 = el('div', 'colonne-boutons');
      col2.appendChild(boutonFin('fin.reessayer', 'btn gros vert', function () { lancerNiveau(i); }));
      col2.appendChild(boutonFin('fin.niveaux', 'btn', function () { fermerVoiles(); afficher('niveaux'); }));
      col2.appendChild(boutonFin('pause.accueil', 'btn', function () { fermerVoiles(); afficher('titre'); }));
      carte.appendChild(col2);
      $('#ov-fin').classList.add('visible');
      SON.defaite();
      var prem = col2.querySelector('button'); setTimeout(function () { try { prem.focus(); } catch (e) { /* rien */ } }, 60);
    }
  }
  function boutonFin(cle, cls, f) {
    var b = el('button', cls, t(cle));
    b.addEventListener('click', function () { SON.touche(); f(); });
    return b;
  }
  function formatTemps(s) {
    s = Math.round(s);
    // Espaces insécables : la durée ne se coupe jamais en fin de ligne.
    return t('temps', { m: Math.floor(s / 60), s: (s % 60 < 10 ? '0' : '') + (s % 60) }).replace(/ /g, ' ');
  }
  function fermerVoiles() {
    document.querySelectorAll('.voile').forEach(function (v) { v.classList.remove('visible'); });
    fermerTuto();
  }

  // ------------------------------------------------------------------------
  // Effets visuels
  // ------------------------------------------------------------------------
  function centre(e) {
    var r = e.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
  function voler(depuis, vers, contenu) {
    if (!depuis || !vers) return;
    var a = centre(depuis), b = centre(vers);
    var f = el('div', 'volant', contenu);
    f.style.left = a.x + 'px'; f.style.top = a.y + 'px';
    document.body.appendChild(f);
    try {
      var an = f.animate([
        { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
        { transform: 'translate(calc(-50% + ' + (b.x - a.x) + 'px), calc(-50% + ' + (b.y - a.y) + 'px)) scale(.5)', opacity: 0.2 }
      ], { duration: 420, easing: 'ease-in' });
      an.onfinish = function () { f.remove(); };
    } catch (e) { f.remove(); }
  }
  function flotter(cible, texte) {
    if (!cible) return;
    var p = centre(cible);
    var f = el('div', 'flotte', texte);
    f.style.left = p.x + 'px'; f.style.top = p.y + 'px';
    document.body.appendChild(f);
    try {
      var an = f.animate([{ transform: 'translate(-50%,-50%)', opacity: 1 }, { transform: 'translate(-50%,-180%)', opacity: 0 }], { duration: 1000, easing: 'ease-out' });
      an.onfinish = function () { f.remove(); };
    } catch (e) { f.remove(); }
  }
  var COULEURS = ['#f2b632', '#d0473f', '#3f8f4f', '#3b6fb6', '#8e5bc9', '#ff8fb1'];
  function confettis(n, depuis) {
    var p = depuis ? centre(depuis) : { x: window.innerWidth / 2, y: window.innerHeight * 0.3 };
    for (var i = 0; i < n; i++) {
      var c = el('div', 'confetti');
      c.style.background = choisir(COULEURS);
      c.style.left = p.x + 'px'; c.style.top = p.y + 'px';
      document.body.appendChild(c);
      var dx = (Math.random() - 0.5) * (depuis ? 220 : window.innerWidth);
      var dy = -Math.random() * 160 + (depuis ? 120 : 400);
      try {
        var an = c.animate([
          { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
          { transform: 'translate(' + dx * 0.6 + 'px,' + (-80 - Math.random() * 80) + 'px) rotate(200deg)', opacity: 1, offset: 0.4 },
          { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(520deg)', opacity: 0 }
        ], { duration: 900 + Math.random() * 600, easing: 'ease-out' });
        an.onfinish = (function (c) { return function () { c.remove(); }; })(c);
      } catch (e) { c.remove(); }
    }
  }

  // ------------------------------------------------------------------------
  // Tutoriel animé : une main montre le vrai élément de l'écran
  // ------------------------------------------------------------------------
  var TUTOS = {
    caisse: [['#comptoir .article', 'tuto.caisse1'], ['#pave', 'tuto.caisse2'], ['#pave .ok', 'tuto.caisse3']],
    rare: [['#client', 'tuto.rare']],
    monnaie: [['#recu', 'tuto.monnaie1'], ['#tiroir', 'tuto.monnaie2'], ['#btn-rendre', 'tuto.monnaie3']],
    rien: [['#recu', 'tuto.rien1'], ['#btn-rendre', 'tuto.rien2']],
    plusieurs: [['#recu', 'tuto.plusieurs1'], ['#tiroir', 'tuto.plusieurs2']],
    promo: [['#comptoir .article.promo', 'tuto.promo1'], ['#pave', 'tuto.promo2']],
    presse: [['#patience', 'tuto.presse']],
    optimal: [['#client', 'tuto.optimal1'], ['#tiroir .piece:last-child', 'tuto.optimal2']],
    coupon: [['#bon', 'tuto.coupon']],
    reassort: [['.liste-livreur', 'tuto.reassort1'], ['#etal', 'tuto.reassort2'], ['#pave', 'tuto.reassort3']],
    panne: [['#compte', 'tuto.panne']],
    commande: [['#bulle', 'tuto.commande1'], ['#comptoir', 'tuto.commande2'], ['#btn-tout', 'tuto.commande3']]
  };
  var tuto = { actif: false, etapes: [], i: 0 };
  var tutosVusSession = {};
  function tutoriels(cles) {
    var etapes = [];
    cles.forEach(function (k) {
      if (sauve.tutos[k] || tutosVusSession[k] || !TUTOS[k]) return;
      tutosVusSession[k] = true; sauve.tutos[k] = true;
      TUTOS[k].forEach(function (e) { etapes.push(e); });
    });
    if (!etapes.length) return;
    sauver();
    tuto.actif = true; tuto.etapes = etapes; tuto.i = 0;
    $('#tuto').classList.add('visible');
    // La 1re position de la main : au centre
    var m = $('#tuto-main'); m.style.left = (window.innerWidth / 2) + 'px'; m.style.top = (window.innerHeight / 2) + 'px';
    etapeTuto();
  }
  function etapeTuto() {
    var e = tuto.etapes[tuto.i];
    var cible = $(e[0]);
    var anneau = $('#tuto-anneau'), main = $('#tuto-main'), bulle = $('#tuto-bulle');
    $('#tuto-texte').textContent = t(e[1]);
    $('#tuto-suite').textContent = t(tuto.i < tuto.etapes.length - 1 ? 'tuto.suite' : 'tuto.fin', { n: tuto.i + 1, total: tuto.etapes.length });
    var r = cible ? cible.getBoundingClientRect() : { left: window.innerWidth / 2 - 30, top: window.innerHeight / 2 - 30, width: 60, height: 60 };
    anneau.style.left = (r.left - 6) + 'px'; anneau.style.top = (r.top - 6) + 'px';
    anneau.style.width = (r.width + 12) + 'px'; anneau.style.height = (r.height + 12) + 'px';
    main.style.left = (r.left + r.width / 2 - 14) + 'px';
    main.style.top = (r.top + r.height / 2 - 8) + 'px';
    var milieu = r.top + r.height / 2;
    if (milieu > window.innerHeight * 0.5) { bulle.style.top = '12px'; bulle.style.bottom = 'auto'; }
    else { bulle.style.top = 'auto'; bulle.style.bottom = '16px'; }
  }
  function etapeSuivante() {
    if (!tuto.actif) return;
    SON.touche();
    tuto.i++;
    if (tuto.i >= tuto.etapes.length) fermerTuto(); else etapeTuto();
  }
  function fermerTuto() {
    tuto.actif = false;
    $('#tuto').classList.remove('visible');
  }
  $('#tuto').addEventListener('click', function (e) {
    if (e.target.id === 'tuto-passer') return;
    etapeSuivante();
  });
  $('#tuto-passer').addEventListener('click', function (e) { e.stopPropagation(); SON.touche(); fermerTuto(); });

  // ------------------------------------------------------------------------
  // Pause (bouton, Échap ou P, écran caché)
  // ------------------------------------------------------------------------
  function mettrePause() {
    if (ecranCourant !== 'jeu' || etat.pause || etat.phase === 'fin') return;
    if ($('#ov-intro').classList.contains('visible')) return;
    etat.pause = true;
    $('#ov-pause').classList.add('visible');
    $('#ecran-jeu').classList.add('fige');
    try { document.getAnimations().forEach(function (a) { a.pause(); }); } catch (e) { /* ancien navigateur */ }
    try { if (actx && actx.state === 'running') actx.suspend(); } catch (e) { /* rien */ }
    setTimeout(function () { try { $('#btn-reprendre').focus(); } catch (e) { /* rien */ } }, 50);
  }
  function reprendre() {
    if (!etat.pause) return;
    etat.pause = false;
    $('#ov-pause').classList.remove('visible');
    $('#ecran-jeu').classList.remove('fige');
    try { document.getAnimations().forEach(function (a) { a.play(); }); } catch (e) { /* ancien navigateur */ }
    try { if (actx && actx.state === 'suspended' && sauve.son) actx.resume(); } catch (e) { /* rien */ }
    try { document.activeElement.blur(); } catch (e) { /* rien */ }
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) mettrePause(); });

  // ------------------------------------------------------------------------
  // Boucle du jeu : temps, minuteries, patience
  // ------------------------------------------------------------------------
  var dernier = 0;
  function boucle(ts) {
    var dt = dernier ? Math.min(0.1, (ts - dernier) / 1000) : 0;
    dernier = ts;
    if (ecranCourant === 'jeu' && etat.actif && !etat.pause && !tuto.actif) {
      etat.temps += dt;
      // Minuteries
      var prets = [];
      etat.minuteries = etat.minuteries.filter(function (m) { m.reste -= dt; if (m.reste <= 0) { prets.push(m); return false; } return true; });
      prets.forEach(function (m) { m.f(); });
      // Patience du client pressé
      var c = etat.ev;
      if (c && c.type === 'client' && c.presse && ['caisse', 'total', 'monnaie', 'commande'].indexOf(etat.phase) >= 0) {
        c.patience -= dt;
        majPatience();
        if (c.patience / c.patienceMax < 0.3) {
          etat.ticTac -= dt;
          if (etat.ticTac <= 0) { SON.tic(); etat.ticTac = 1; }
        }
        if (c.patience <= 0) clientParti();
      }
    }
    requestAnimationFrame(boucle);
  }
  requestAnimationFrame(boucle);

  // ------------------------------------------------------------------------
  // Clavier
  // ------------------------------------------------------------------------
  document.addEventListener('keydown', function (e) {
    var code = e.code, touche = e.key;
    if (tuto.actif) {
      if (code === 'Escape') fermerTuto();
      else if (code === 'Enter' || code === 'NumpadEnter' || code === 'Space' || code === 'ArrowRight') etapeSuivante();
      e.preventDefault();
      return;
    }
    var actifEl = document.activeElement;
    var surBouton = actifEl && actifEl.tagName === 'BUTTON' && !actifEl.closest('#ecran-jeu');
    if (ecranCourant === 'titre') {
      if ((code === 'Enter' || code === 'Space') && !surBouton) { e.preventDefault(); $('#btn-jouer').click(); }
      return;
    }
    if (ecranCourant !== 'jeu') {
      if (code === 'Escape') afficher('titre');
      return;
    }
    if (code === 'Escape' || code === 'KeyP') {
      if (etat.pause) reprendre(); else mettrePause();
      e.preventDefault(); return;
    }
    if (etat.pause || !etat.actif) return;
    var ph = etat.phase;
    var chiffre = /^[0-9]$/.test(touche) ? touche : null;
    var entree = code === 'Enter' || code === 'NumpadEnter';
    if (ph === 'caisse') {
      if (entree || code === 'Space' || code === 'ArrowRight') {
        e.preventDefault();
        var a = document.querySelector('#comptoir .article.curseur');
        if (a) scanner(Number(a.dataset.i));
      }
    } else if (ph === 'total' || ph === 'livraison') {
      if (chiffre) { e.preventDefault(); toucheChiffre(chiffre); }
      else if (code === 'Backspace' || code === 'Delete') { e.preventDefault(); toucheChiffre('eff'); }
      else if (entree || code === 'Space') { e.preventDefault(); toucheChiffre('ok'); }
    } else if (ph === 'commande') {
      var nbP = document.querySelectorAll('#comptoir .article').length;
      if (code === 'ArrowRight' || code === 'ArrowDown') { e.preventDefault(); etat.curseur = (etat.curseur + 1) % nbP; marquerCurseurEtagere(); }
      else if (code === 'ArrowLeft' || code === 'ArrowUp') { e.preventDefault(); etat.curseur = (etat.curseur + nbP - 1) % nbP; marquerCurseurEtagere(); }
      else if (code === 'Space') { e.preventDefault(); var art = document.querySelectorAll('#comptoir .article')[etat.curseur]; if (art) art.click(); }
      else if (code === 'Backspace' || code === 'Delete') { e.preventDefault(); if (etat.ticket.length) { etat.ticket.pop(); SON.reprise(); redessinerTicketCommande(); } }
      else if (entree) { e.preventDefault(); verifierCommande(); }
    } else if (ph === 'monnaie') {
      var valeurs = { '1': 1, '2': 2, '5': 5, '0': 10 };
      var pieces = document.querySelectorAll('#tiroir .piece');
      if (chiffre && valeurs[chiffre]) { e.preventDefault(); etat.curseur = [1, 2, 5, 10].indexOf(valeurs[chiffre]); marquerCurseurTiroir(); ajouterPiece(valeurs[chiffre], pieces[etat.curseur]); }
      else if (code === 'ArrowRight') { e.preventDefault(); etat.curseur = (etat.curseur + 1) % 4; marquerCurseurTiroir(); }
      else if (code === 'ArrowLeft') { e.preventDefault(); etat.curseur = (etat.curseur + 3) % 4; marquerCurseurTiroir(); }
      else if (code === 'Space' || code === 'ArrowUp') { e.preventDefault(); ajouterPiece([1, 2, 5, 10][etat.curseur], pieces[etat.curseur]); }
      else if (code === 'Backspace' || code === 'Delete' || code === 'ArrowDown') { e.preventDefault(); if (etat.plateau.length) retirerPiece(etat.plateau.length - 1); }
      else if (entree) { e.preventDefault(); rendre(); }
    }
  });

  // ------------------------------------------------------------------------
  // Boutons des écrans
  // ------------------------------------------------------------------------
  $('#btn-jouer').addEventListener('click', function () {
    SON.touche();
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: function (d) {
        var n = Math.min(NIVEAUX.length, d.niveau);
        if (n > sauve.debloque) sauve.debloque = n;
        lancerNiveau(n - 1);
      },
      onNouvelle: nouvellePartie,
      onEffacer: function () { majEffacerTitre(); nouvellePartie(); }
    });
  });
  function nouvellePartie() {
    // Reprend à la journée la plus avancée débloquée.
    lancerNiveau(Math.min(sauve.debloque, NIVEAUX.length) - 1);
  }
  effacerTitre = JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('#ecran-titre') });
  $('#btn-niveaux').addEventListener('click', function () { SON.touche(); afficher('niveaux'); });
  $('#btn-boutique').addEventListener('click', function () { SON.touche(); afficher('boutique'); });
  document.querySelectorAll('.btn-retour').forEach(function (b) { b.addEventListener('click', function () { SON.touche(); afficher('titre'); }); });
  ['btn-son', 'btn-son-titre', 'btn-son-pause'].forEach(function (id) { document.getElementById(id).addEventListener('click', basculerSon); });
  $('#btn-pause').addEventListener('click', function () { SON.touche(); mettrePause(); });
  $('#btn-reprendre').addEventListener('click', function () { reprendre(); SON.touche(); });
  $('#btn-recommencer').addEventListener('click', function () { etat.pause = false; $('#ecran-jeu').classList.remove('fige'); reprendreAnimations(); lancerNiveau(etat.niv); });
  $('#btn-accueil').addEventListener('click', function () { etat.pause = false; etat.actif = false; $('#ecran-jeu').classList.remove('fige'); reprendreAnimations(); fermerVoiles(); afficher('titre'); });
  function reprendreAnimations() {
    try { document.getAnimations().forEach(function (a) { a.play(); }); } catch (e) { /* rien */ }
    try { if (actx && actx.state === 'suspended' && sauve.son) actx.resume(); } catch (e) { /* rien */ }
  }

  // Les boutons du jeu ne gardent pas le focus (Entrée et Espace restent aux commandes du jeu).
  $('#ecran-jeu').addEventListener('mousedown', function (e) { if (e.target.closest('button')) e.preventDefault(); });

  majBoutonsSon();
})();
</script>
