<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {

      var v = variables[nom];

  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }

      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }

  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +

    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)

      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();

    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();

    });
    bouton.addEventListener('keydown', function (e) {

    document.addEventListener('pointerdown', function (e) {

    });

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {

      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });

        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }

      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {

    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];

  function existe(jeu) { return lireDonnees(jeu) !== null; }

    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();

    try { texte = JSON.stringify(tout); } catch (e) { return false; }

  function surFermeture(f) {

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }

  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];

    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');

    var feuille = document.createElement('style');

    ombre.appendChild(feuille);

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau

  //                prochaine écriture du jeu)

    var fond = document.createElement('div');

    h.ombre.appendChild(fond);
    isoler(h.hote);

      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

const NB = NIVEAUX.length;
let prog = null;
function progNormale(d) {
  const p = Object.assign({}, d || {});
  p.etoiles = Array.isArray(p.etoiles) ? p.etoiles.slice(0, NB) : [];
  p.records = Array.isArray(p.records) ? p.records.slice(0, NB) : [];
  p.livre = Array.isArray(p.livre) ? p.livre.slice(0, NB) : [];
  while (p.etoiles.length < NB) p.etoiles.push(0);
  while (p.records.length < NB) p.records.push(0);
  while (p.livre.length < NB) p.livre.push(false);
  p.niveau = Math.max(1, Math.min(NB, Number(p.niveau) || 1));
  p.max = Math.max(1, Math.min(NB, Number(p.max) || 1, NB), p.niveau);
  p.options = Object.assign({ son: true, nappe: 0, vaisselle: 0, deco: 1 }, p.options || {});
  return p;
}
function chargerProg() {
  let d = null;
  try { d = window.JEL_SAVE ? window.JEL_SAVE.load(JEU) : null; } catch (e) { d = null; }
  prog = progNormale(d);
  try { const s = localStorage.getItem('banquet-son'); if (s === '0') prog.options.son = false; } catch (e) { /* pas de stockage */ }
  sonActif = prog.options.son !== false;
}
function totalEtoiles() { return prog.etoiles.reduce((a, b) => a + (b || 0), 0); }
function scoreTotal() { return prog.records.reduce((a, b) => a + (b || 0), 0); }
function donneesSauvegarde(niveau) {
  return { niveau, score: scoreTotal(), max: prog.max, etoiles: prog.etoiles, records: prog.records, livre: prog.livre, options: prog.options };
}
function sauver(niveau) {
  try { if (window.JEL_SAVE) window.JEL_SAVE.save(JEU, donneesSauvegarde(niveau)); } catch (e) { /* rien */ }
}
// Options seules (hors partie) : on n'écrit que si une sauvegarde existe déjà, sans toucher au niveau.
function sauverOptions() {
  try { localStorage.setItem('banquet-son', prog.options.son === false ? '0' : '1'); } catch (e) { /* pas de stockage */ }
  try { if (window.JEL_SAVE && window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: prog.options }); } catch (e) { /* rien */ }
}

function confettis(n = 70) {

function texteIndice(c) {
  const v = { a: c.a ? nomAnimal(c.a) : '', b: c.b ? nomAnimal(c.b) : '', d: c.d ? nomPlat(c.d) : '' };
  if (c.r) v.pres = t('pres.' + c.r);
  if (c.g) v.aime = t('aime.' + c.g);
  return maj1(t('ind.' + c.k, v));
}
function iconesIndice(c) {
  switch (c.k) {
    case 'marque': return visageSVG(c.a, 'v-carte') + relSVG('fleche') + repereSVG(c.r);
    case 'pasMarque': return visageSVG(c.a, 'v-carte') + relSVG('fleche') + croixSur(REPERES[c.r]);
    case 'voisin': return visageSVG(c.a, 'v-carte') + relSVG('voisin') + visageSVG(c.b, 'v-carte');
    case 'pasVoisin': return visageSVG(c.a, 'v-carte') + relSVG('voisin', true) + visageSVG(c.b, 'v-carte');
    case 'enFace': return visageSVG(c.a, 'v-carte') + relSVG('enface') + visageSVG(c.b, 'v-carte');
    case 'gauche': return visageSVG(c.a, 'v-carte') + relSVG('gauche') + visageSVG(c.b, 'v-carte');
    case 'voisinGout': return visageSVG(c.a, 'v-carte') + relSVG('voisin') + bulleGoutSVG(c.g);
    case 'memeTable': return visageSVG(c.a, 'v-carte') + relSVG('table') + visageSVG(c.b, 'v-carte');
    case 'pasMemeTable': return visageSVG(c.a, 'v-carte') + relSVG('table', true) + visageSVG(c.b, 'v-carte');
    case 'partage': return visageSVG(c.a, 'v-carte') + alimentSVG(c.d) + visageSVG(c.b, 'v-carte');
    case 'partageUn': return visageSVG(c.a, 'v-carte') + alimentSVG(c.d) + relSVG('voisin');
    case 'platInvite': return alimentSVG(c.d) + relSVG('fleche') + visageSVG(c.a, 'v-carte');
    case 'platGout': return alimentSVG(c.d) + relSVG('fleche') + bulleGoutSVG(c.g);
    case 'pasPlat': return visageSVG(c.a, 'v-carte') + relSVG('fleche') + croixSur(ALIMENTS[c.d]);

  }
}
const estIndicePlat = (c) => c.k === 'platInvite' || c.k === 'platGout' || c.k === 'pasPlat';

// =====================================================================
//  Partie
// =====================================================================
let B = null;        // banquet en cours (généré)
let st = null;       // état de la partie
let enCours = false; // une partie est en cours (sauvegarde à la fermeture)
let chrono = null;

function invitesPhase() { return st.phase === 1 ? B.invites.filter((g) => g !== B.gL) : B.invites; }
function platsPhase() { return st.phase === 1 ? B.plats.filter((d) => d !== B.dL) : B.plats; }
function ctxPhase() { return st.phase === 1 ? B.ctx1 : B.ctx; }
function indicesPlacesVisibles() { return st.phase === 1 ? B.C1 : B.C2; }
function indicesPlatsVisibles() { return st.phase === 1 ? B.D1 : B.D2; }
function solutionPhase() { return st.phase === 1 ? B.s1 : B.sol; }

function lancerNiveau(idx) {
  idx = Math.max(0, Math.min(NB - 1, idx));
  B = banquet(idx);
  st = {
    idx, phase: B.spec.retard ? 1 : 2, pos: {}, plat: {}, grand: {}, bloque: { inv: {}, plat: {}, grand: {} },
    erreurs: 0, pouces: 0, coeurs: 3, temps: 0, leves: new Set(), neuves: new Set(), sel: null, vue: null, pause: false, fini: false,
  };
  B.invites.forEach((g) => { st.pos[g] = -1; st.plat[g] = null; });
  B.grands.forEach((d) => { st.grand[d] = -1; });
  prog.max = Math.max(prog.max, idx + 1);
  enCours = true;
  const resto = RESTOS[B.spec.r].id;
  $('#ecran-jeu').className = 'ecran actif resto-' + resto;
  montrer('ecran-jeu');
  $('#plateau').style.minHeight = '';
  rendreTout();
  requestAnimationFrame(() => { const p = $('#plateau'); if (p) p.style.minHeight = p.offsetHeight + 'px'; rendreSalle(); });
  lecture(st.phase === 1 ? t('lecture.phase1') : t('lecture.defaut'));
  demarrerChrono();
  // Présentation d'une nouveauté ou d'un nouveau restaurant.
  const nouveauResto = idx % 5 === 0;
  if (B.spec.nouv || nouveauResto) ouvrirIntro(B.spec.nouv || null, nouveauResto ? resto : null);
}
function demarrerChrono() {
  if (chrono) clearInterval(chrono);
  chrono = setInterval(() => {
    if (st && enCours && !st.pause && !st.fini && !document.querySelector('.voile.ouvert')) st.temps++;
  }, 1000);
}

function rendreTout() { rendreBarre(); rendreIndices(); rendreSalle(); rendrePlateau(); majBoutons(); }
function rendreBarre() {
  $('#hud-niveau').textContent = t('jeu.niveau', { n: st.idx + 1 });
  $('#hud-resto').textContent = t('resto.' + RESTOS[B.spec.r].id);
  const c = $('#coeurs'); c.innerHTML = '';
  for (let i = 0; i < 3; i++) { const w = document.createElement('span'); w.innerHTML = COEUR; const s = w.firstChild; if (i >= st.coeurs) s.classList.add('perdu'); c.appendChild(s); }

    const b = document.createElement('button');
    b.className = 'carte' + (plat ? ' plat-carte' : '') + (st.neuves.has(c.id) ? ' neuve' : '') + (st.vue === c.id ? ' vue' : '');

    b.innerHTML = iconesIndice(c);
    const cache = B.cloches.has(c.id) && !st.leves.has(c.id);

      const cl = document.createElement('span'); cl.className = 'cloche'; cl.innerHTML = ICONES.cloche; b.appendChild(cl);
      if (!cache) b.classList.add('levee');

// Taille et position de la salle (espace virtuel → pixels).
// La table occupe toute la place disponible (cadre des chaises et des tables).
function geometrie() {
  const z = $('#salle'); const W = z.clientWidth, H = z.clientHeight;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const etendre = (a, b, c, d) => { x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d); };
  B.L.seats.forEach((se) => etendre(se.x - 40, se.y - 40, se.x + 40, se.y + 40));
  B.L.tables.forEach((tb) => { if (tb.forme === 'rect') etendre(tb.cx - tb.w / 2 - 12, tb.cy - tb.h / 2 - 12, tb.cx + tb.w / 2 + 12, tb.cy + tb.h / 2 + 12); else etendre(tb.cx - tb.r - 12, tb.cy - tb.r - 12, tb.cx + tb.r + 12, tb.cy + tb.r + 12); });
  const bw = x1 - x0, bh = y1 - y0;
  const s = Math.max(0.55, Math.min(W / bw, H / bh, 1.45));
  return { s, ox: (W - bw * s) / 2 - x0 * s, oy: (H - bh * s) / 2 - y0 * s, W, H };
}
function rendreSalle() {
  if (!B) return;
  const z = $('#salle'); const G = geometrie(); const s = G.s;
  const P = (x, y) => [G.ox + x * s, G.oy + y * s];
  const ctx = ctxPhase(); const L = B.L;
  const tj = Math.round(50 * s), ta = Math.round(36 * s), te = Math.round(40 * s);
  let h = '';
  const nappe = 'nappe-' + (prog.options.nappe || 0);
  L.tables.forEach((tb) => {
    if (tb.forme === 'rect') {
      const [x, y] = P(tb.cx - tb.w / 2, tb.cy - tb.h / 2);
      h += `<div class="table-dessin rect ${nappe}" style="left:${x}px;top:${y}px;width:${tb.w * s}px;height:${tb.h * s}px"></div>`;
    } else {
      const [x, y] = P(tb.cx - tb.r, tb.cy - tb.r);
      h += `<div class="table-dessin rond ${nappe}" style="left:${x}px;top:${y}px;width:${tb.r * 2 * s}px;height:${tb.r * 2 * s}px"></div>`;
      if (B.spec.types.includes('gauche')) {
        for (let i = 0; i < tb.n; i++) {
          const am = -Math.PI / 2 + (i + 0.5) * 2 * Math.PI / tb.n;
          const [cx, cy] = P(tb.cx + Math.cos(am) * (tb.r + 6), tb.cy + Math.sin(am) * (tb.r + 6));
          const rot = am * 180 / Math.PI + 90;
          h += `<div class="chevron" style="left:${cx - 9}px;top:${cy - 9}px;transform:rotate(${rot}deg)">${ICONES.chevron}</div>`;
        }
      }
    }
    const dc = prog.options.deco || 0;
    const decoX = tb.forme === 'rond' ? (ctx.slots.length ? null : tb.cx) : tb.decoX;
    if (dc && decoX != null) { const tdc = Math.round(28 * s); const [x, y] = P(decoX, tb.cy); h += `<div class="deco-table" style="left:${x - tdc / 2}px;top:${y - tdc / 2}px;width:${tdc}px;height:${tdc}px">${decoSVG(dc)}</div>`; }
  });
  // Emplacements des grands plats.
  ctx.slots.forEach((sl, i) => {
    const [x, y] = P(sl.x, sl.y);
    const d = B.grands.find((g) => st.grand[g] === i);
    const choisi = st.sel && st.sel.type === 'grand';
    if (d) {
      const bl = st.bloque.grand[d];
      h += `<button class="grand vaisselle-${prog.options.vaisselle || 0}${bl ? ' bloque' : ''}${selCls('grand', d)}${viseCls('d', d)}" data-objet="grand" data-id="${d}" data-cible="emplacement" data-i="${i}" style="left:${x - te / 2}px;top:${y - te / 2}px;width:${te}px;height:${te}px" aria-label="${attr(maj1(nomPlat(d)))}">${alimentSVG(d)}</button>`;
    } else {
      h += `<button class="emplacement${choisi ? ' cible-ok' : ''}" data-cible="emplacement" data-i="${i}" style="left:${x - te / 2}px;top:${y - te / 2}px;width:${te}px;height:${te}px" aria-label="${attr(t('aria.emplacement'))}"></button>`;
    }
  });
  // Chaises, invités, assiettes.
  const occ = occupation();
  L.seats.forEach((se, i) => {
    const [x, y] = P(se.x, se.y);
    const actif = ctx.actif[i];
    const g = occ[i];
    const rep = ctx.rep[i];
    const libelle = rep ? t('aria.chaiseRepere', { n: i + 1, pres: t('pres.' + rep) }) : t('aria.chaise', { n: i + 1 });
    const cibleOk = st.sel && st.sel.type === 'inv' && actif ? ' cible-ok' : '';
    h += `<button class="chaise${actif ? '' : ' reservee'}${cibleOk}" data-cible="chaise" data-i="${i}" style="left:${x - tj / 2 - 3}px;top:${y - tj / 2 - 3}px;width:${tj + 6}px;height:${tj + 6}px" aria-label="${attr(actif ? libelle : t('aria.reservee'))}">${actif ? '' : ICONES.horloge}</button>`;
    if (g) {
      const bl = st.bloque.inv[g];
      h += `<button class="jeton${bl ? ' bloque' : ''}${selCls('inv', g)}${viseCls('a', g)}${st.fini && st.gagne ? ' saute' : ''}" data-objet="inv" data-id="${g}" data-cible="chaise" data-i="${i}" style="left:${x - tj / 2}px;top:${y - tj / 2}px;width:${tj}px;height:${tj}px" aria-label="${attr(t('aria.invite', { a: nomAnimal(g), aime: t('aime.' + B.ctx.gout[g]) }))}">${visageSVG(g)}<span class="bulle">${goutSVG(B.ctx.gout[g])}</span></button>`;
      const [px, py] = P(se.px, se.py);
      const d = st.plat[g];
      if (d) {
        const bl2 = st.bloque.plat[d];
        h += `<button class="assiette vaisselle-${prog.options.vaisselle || 0}${bl2 ? ' bloque' : ''}${selCls('plat', d)}${viseCls('d', d)}" data-objet="plat" data-id="${d}" data-cible="chaise" data-i="${i}" style="left:${px - ta / 2}px;top:${py - ta / 2}px;width:${ta}px;height:${ta}px" aria-label="${attr(t('aria.platDe', { d: maj1(nomPlat(d)), a: nomAnimal(g) }))}">${alimentSVG(d)}</button>`;
      } else {
        const ok = st.sel && st.sel.type === 'plat' ? ' cible-ok' : '';
        h += `<button class="spot${ok}" data-cible="chaise" data-i="${i}" style="left:${px - ta / 2}px;top:${py - ta / 2}px;width:${ta}px;height:${ta}px" aria-label="${attr(t('aria.spot', { a: nomAnimal(g) }))}"></button>`;
      }
    }
    if (rep && actif) {
      const tb = Math.max(20, Math.round(24 * s));
      h += `<div class="badge-repere" style="left:${x - tj / 2 - tb * 0.35}px;top:${y - tj / 2 - tb * 0.35}px;width:${tb}px;height:${tb}px">${repereSVG(rep)}</div>`;
    }
  });
  z.innerHTML = h;
}
function attr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function selCls(type, id) { return st.sel && st.sel.type === type && st.sel.id === id ? ' choisi' : ''; }
function viseCls(champ, id) {
  if (st.vue == null) return '';
  const c = tousIndicesVisibles().find((x) => x.id === st.vue);
  if (!c || (B.cloches.has(c.id) && !st.leves.has(c.id))) return '';
  if (champ === 'a' && (c.a === id || c.b === id)) return ' vise';
  if (champ === 'd' && c.d === id) return ' vise';
  return '';
}
function tousIndicesVisibles() { return indicesPlacesVisibles().concat(indicesPlatsVisibles()); }
function occupation() {
  const occ = new Array(B.L.seats.length).fill(null);
  invitesPhase().forEach((g) => { if (st.pos[g] >= 0) occ[st.pos[g]] = g; });
  return occ;
}
function rendrePlateau() {
  const z = $('#plateau'); let h = '';
  invitesPhase().forEach((g) => {
    if (st.pos[g] >= 0) return;
    h += `<button class="jeton${selCls('inv', g)}${viseCls('a', g)}" data-objet="inv" data-id="${g}" data-cible="plateau" aria-label="${attr(t('aria.invite', { a: nomAnimal(g), aime: t('aime.' + B.ctx.gout[g]) }))}">${visageSVG(g)}<span class="bulle">${goutSVG(B.ctx.gout[g])}</span></button>`;
  });
  const donnes = new Set(Object.values(st.plat).filter(Boolean));
  platsPhase().forEach((d) => {
    if (donnes.has(d)) return;
    h += `<button class="assiette vaisselle-${prog.options.vaisselle || 0}${selCls('plat', d)}${viseCls('d', d)}" data-objet="plat" data-id="${d}" data-cible="plateau" aria-label="${attr(maj1(nomPlat(d)))}">${alimentSVG(d)}</button>`;
  });
  B.grands.forEach((d) => {
    if (st.grand[d] >= 0) return;
    h += `<button class="grand vaisselle-${prog.options.vaisselle || 0}${selCls('grand', d)}${viseCls('d', d)}" data-objet="grand" data-id="${d}" data-cible="plateau" aria-label="${attr(maj1(nomPlat(d)))}">${alimentSVG(d)}</button>`;
  });
  z.innerHTML = h;
}
function restants() {
  let n = 0;
  invitesPhase().forEach((g) => { if (st.pos[g] < 0) n++; });
  const donnes = new Set(Object.values(st.plat).filter(Boolean));
  platsPhase().forEach((d) => { if (!donnes.has(d)) n++; });
  B.grands.forEach((d) => { if (st.grand[d] < 0) n++; });
  return n;
}
function majBoutons() {
  const n = restants();
  $('#btn-servir').disabled = false;
  $('#btn-servir').classList.toggle('pulse', n === 0);
  $('#btn-pouce').innerHTML = ICONES.pouce.replace('<svg', '<svg width="24" height="24"') + `<span>${attr(t('btn.pouce'))}</span>`;
}
let minuterieLecture = null;
function lecture(txt, genre) {
  const l = $('#lecture'); l.textContent = txt; l.className = genre || '';
  if (minuterieLecture) clearTimeout(minuterieLecture);
  if (genre) minuterieLecture = setTimeout(() => { l.className = ''; }, 2200);

// Le rendu reconstruit la salle : on garde le focus clavier sur le même objet ou la même place.
function rafraichir() {
  const a = document.activeElement;
  const f = a && $('#ecran-jeu').contains(a) ? { objet: a.dataset.objet, id: a.dataset.id, cible: a.dataset.cible, i: a.dataset.i, plateau: a.id === 'plateau' } : null;
  rendreSalle(); rendrePlateau(); majBoutons();
  if (!f) return;

  if (f.objet) el = document.querySelector(`#ecran-jeu [data-objet="${f.objet}"][data-id="${f.id}"]`);

  if (!el) el = $('#plateau .jeton, #plateau .assiette, #plateau .grand') || $('#btn-servir');

function animerPose(sel) {
  const el = document.querySelector(`#salle [data-objet="${sel.type}"][data-id="${sel.id}"]`);
  if (el) { el.classList.add('pose'); const r = el.getBoundingClientRect(); etincelles(r.left + r.width / 2, r.top + r.height / 2); }
}

// --- Déplacements ------------------------------------------------------------------
function deplacer(sel, cible, i) {
  const ctx = ctxPhase();
  if (sel.type === 'inv') {
    const g = sel.id;
    if (st.bloque.inv[g]) { lecture(t('msg.bloque'), 'alerte'); SONS.refus(); return false; }
    if (cible === 'plateau') { if (st.pos[g] < 0) return false; st.pos[g] = -1; SONS.poser(); return true; }
    if (cible !== 'chaise') return false;
    if (!ctx.actif[i]) { lecture(t('msg.reservee'), 'alerte'); SONS.refus(); return false; }
    const occ = occupation(); const o = occ[i];
    if (o === g) return true;
    if (o && st.bloque.inv[o]) { lecture(t('msg.bloque'), 'alerte'); SONS.refus(); return false; }
    const ancien = st.pos[g];
    st.pos[g] = i;
    if (o) { st.pos[o] = ancien; SONS.echange(); } else SONS.poser();
    return true;
  }
  if (sel.type === 'plat') {
    const d = sel.id;
    if (st.bloque.plat[d]) { lecture(t('msg.bloque'), 'alerte'); SONS.refus(); return false; }
    const proprio = Object.keys(st.plat).find((g) => st.plat[g] === d) || null;
    if (cible === 'plateau') { if (!proprio) return false; st.plat[proprio] = null; SONS.poser(); return true; }
    if (cible !== 'chaise') return false;
    const occ = occupation(); const g2 = occ[i];
    if (!g2) { lecture(ctx.actif[i] ? t('msg.chaiseVide') : t('msg.reservee'), 'alerte'); SONS.refus(); return false; }
    if (g2 === proprio) return true;
    const autre = st.plat[g2];
    if (autre && st.bloque.plat[autre]) { lecture(t('msg.bloque'), 'alerte'); SONS.refus(); return false; }
    st.plat[g2] = d;
    if (proprio) st.plat[proprio] = autre || null;
    if (autre) SONS.echange(); else SONS.poser();
    return true;
  }
  if (sel.type === 'grand') {
    const d = sel.id;
    if (st.bloque.grand[d]) { lecture(t('msg.bloque'), 'alerte'); SONS.refus(); return false; }
    if (cible === 'plateau') { if (st.grand[d] < 0) return false; st.grand[d] = -1; SONS.poser(); return true; }
    if (cible !== 'emplacement') { lecture(t('msg.emplacement'), 'alerte'); SONS.refus(); return false; }
    const o = B.grands.find((x) => st.grand[x] === i);
    if (o === d) return true;
    if (o && st.bloque.grand[o]) { lecture(t('msg.bloque'), 'alerte'); SONS.refus(); return false; }
    const ancien = st.grand[d];
    st.grand[d] = i;

function choisir(type, id) {

  else if (type === 'plat') lecture(t('lecture.plat', { d: maj1(nomPlat(id)) }));

// Toucher (ou Entrée) sur un élément de la partie.
function agir(el) {
  if (!st || st.fini || st.pause) return;
  premierGeste = true;
  if (el.dataset.indice != null) { toucherIndice(+el.dataset.indice); return; }
  const obj = el.dataset.objet, id = el.dataset.id, cible = el.dataset.cible, i = el.dataset.i != null ? +el.dataset.i : -1;
  if (st.sel) {
    if (obj && st.sel.type === obj && st.sel.id === id) { st.sel = null; rafraichir(); return; }
    // Un objet du plateau touché : on le prend à la place.
    if (obj && cible === 'plateau') { choisir(obj, id); return; }
    const sel = st.sel;
    if (deplacer(sel, cible, i)) { st.sel = null; rafraichir(); animerPose(sel); return; }
    if (obj && !st.bloque[obj][id]) { choisir(obj, id); return; }
    rafraichir();
    return;
  }

    if (st.bloque[obj][id]) { lecture(t('msg.bloque'), 'alerte'); SONS.refus(); return; }

}
function toucherIndice(id) {

// --- Servir et coup de pouce -----------------------------------------------------
function indicesCasses() {
  const ctx = ctxPhase(); const occ = occupation(); const casses = [];
  indicesPlacesVisibles().forEach((c) => {
    if (estGrand(c)) { const place = {}; B.grands.forEach((d) => { place[d] = st.grand[d]; }); if (!verifierGrand(c, occ, place, ctx)) casses.push(c); }
    else if (!verifier(c, st.pos, occ, ctx)) casses.push(c);
  });
  indicesPlatsVisibles().forEach((c) => {
    const g = Object.keys(st.plat).find((x) => st.plat[x] === c.d);
    if (!g || !platPossible(c, c.d, g, ctx)) casses.push(c);
  });
  return casses;
}
function servir() {
  if (!st || st.fini || st.pause) return;
  premierGeste = true;
  const n = restants();
  if (n > 0) { lecture(t('msg.manque', { n }), 'alerte'); SONS.refus(); return; }
  st.sel = null;
  const casses = indicesCasses();
  if (casses.length) {
    st.erreurs++; st.coeurs--;
    SONS.erreur();
    const salle = $('#salle'); salle.style.animation = 'secoue .4s'; setTimeout(() => { salle.style.animation = ''; }, 450);
    rendreBarre();
    casses.forEach((c) => { const el = document.querySelector(`.carte[data-indice="${c.id}"]`); if (el) { el.classList.remove('faux'); void el.offsetWidth; el.classList.add('faux'); setTimeout(() => el.classList.remove('faux'), 1100); } });
    lecture(t('msg.erreur', { n: casses.length }), 'alerte');
    if (st.coeurs <= 0) { st.fini = true; setTimeout(defaite, 900); }
    return;
  }
  if (st.phase === 1) { arriveeRetard(); return; }
  victoire();
}
function coupDePouce() {
  if (!st || st.fini || st.pause) return;
  premierGeste = true;
  const sol = solutionPhase(); const ctx = ctxPhase();
  // 1) un invité mal placé
  for (const g of invitesPhase()) {
    if (st.pos[g] !== sol.pos[g]) {
      const occ = occupation(); const o = occ[sol.pos[g]];
      if (o && st.bloque.inv[o]) continue;
      const ancien = st.pos[g]; st.pos[g] = sol.pos[g]; if (o) st.pos[o] = ancien;
      st.bloque.inv[g] = true; finPouce({ type: 'inv', id: g }, t('msg.pouce', { a: nomAnimal(g) })); return;
    }
  }
  // 2) un plat mal servi
  for (const d of platsPhase()) {
    const g = sol.plats[d]; if (st.plat[g] === d) continue;
    const proprio = Object.keys(st.plat).find((x) => st.plat[x] === d) || null; const autre = st.plat[g];
    if (autre && st.bloque.plat[autre]) continue;
    st.plat[g] = d; if (proprio) st.plat[proprio] = autre || null;
    st.bloque.plat[d] = true; finPouce({ type: 'plat', id: d }, t('msg.poucePlat', { d: maj1(nomPlat(d)) })); return;
  }
  // 3) un grand plat
  for (const d of B.grands) {
    const i = sol.place[d]; if (st.grand[d] === i) continue;
    const o = B.grands.find((x) => st.grand[x] === i); const ancien = st.grand[d];
    st.grand[d] = i; if (o) st.grand[o] = ancien;
    st.bloque.grand[d] = true; finPouce({ type: 'grand', id: d }, t('msg.poucePlat', { d: maj1(nomPlat(d)) })); return;
  }
  void ctx;
  lecture(t('msg.toutJuste'), 'bien'); SONS.carte();
}
function finPouce(sel, msg) {

function etoilesGagnees() { return Math.max(1, 3 - st.erreurs - st.pouces); }

function victoire() {

  const idx = st.idx, e = etoilesGagnees();
  const bonus = st.temps <= parTemps() ? 200 : Math.max(0, 200 - (st.temps - parTemps()) * 2);
  const score = Math.max(50, 500 - 100 * st.erreurs - 100 * st.pouces + Math.round(bonus));
  const totalAvant = totalEtoiles();
  const ancienRecord = prog.records[idx] || 0;
  const record = score > ancienRecord;
  const nouveauLivre = !prog.livre[idx];
  prog.etoiles[idx] = Math.max(prog.etoiles[idx] || 0, e);
  prog.records[idx] = Math.max(ancienRecord, score);
  prog.livre[idx] = true;
  prog.max = Math.max(prog.max, Math.min(NB, idx + 2));
  JEL_SAVE.save(JEU, donneesSauvegarde(Math.min(NB, idx + 2)));

  let sous = nouv && resto && nouv !== 'base' ? `<p class="ligne-info or">${attr(t('nouv.resto', { r: t('resto.' + resto) }))}</p>` : '';
  if (nouv === 'base') {
    boite.innerHTML = `<h2 id="intro-titre">${attr(titre)}</h2>${sous}<div class="scene" id="scene-tuto"></div><p class="tuto-etape" id="tuto-etape"></p><p>${attr(t('nouv.base.texte'))}</p><div class="boutons"><button class="gros" id="intro-ok">${attr(t('btn.compris'))}</button></div>`;
    let etape = 0;
    const montrerEtape = () => { $('#scene-tuto').innerHTML = SCENES['base' + (etape + 1)](); $('#tuto-etape').textContent = t('tuto.' + (etape + 1)); etape = (etape + 1) % 3; };
    montrerEtape();
    if (introMinuterie) clearInterval(introMinuterie);
    introMinuterie = setInterval(montrerEtape, 2800);
  } else if (nouv) {
    const ex = exempleIndice(nouv);
    boite.innerHTML = `<h2 id="intro-titre">${attr(titre)}</h2>${sous}<div class="scene">${SCENES[nouv]()}</div>${ex ? `<div class="carte-exemple">${iconesIndice(ex)}</div><p class="ligne-info">${attr(texteIndice(ex))}</p>` : ''}<p>${attr(t('nouv.' + nouv + '.texte'))}</p><div class="boutons"><button class="gros" id="intro-ok">${attr(t('btn.compris'))}</button></div>`;
  } else {
    boite.innerHTML = `<h2 id="intro-titre">${attr(titre)}</h2><div id="dessin-intro" style="height:150px">${dessinTitre(resto)}</div><p>${attr(t('nouv.resto.texte'))}</p><div class="boutons"><button class="gros" id="intro-ok">${attr(t('btn.compris'))}</button></div>`;
  }
  ouvrirVoile('voile-intro');
}
function exempleIndice(nouv) {
  const kinds = FORCE[nouv]; if (!kinds) return null;
  return B.C2.concat(B.D2).find((c) => kinds.includes(c.k)) || null;
}

// --- Écrans de menus -----------------------------------------------------------------------
function ouvrirNiveaux() {
  enCours = false;
  const z = $('#liste-niv'); let h = '';
  RESTOS.forEach((r, ri) => {
    h += `<div class="groupe-resto"><h3>${attr(t('resto.' + r.id))}</h3><div class="grille-niv">`;
    for (let i = ri * 5; i < ri * 5 + 5; i++) {
      const ouvert = i < prog.max;
      if (ouvert) {
        const e = prog.etoiles[i] || 0;
        h += `<button class="btn-niv" data-niv="${i}" aria-label="${attr(t('aria.niveau', { n: i + 1 }))}">${i + 1}<span class="mini">${ETOILE(e > 0)}${ETOILE(e > 1)}${ETOILE(e > 2)}</span></button>`;
      } else h += `<button class="btn-niv ferme" disabled aria-label="${attr(t('aria.niveauFerme', { n: i + 1 }))}">${ICONES.cadenas}</button>`;
    }
    h += '</div></div>';
  });
  z.innerHTML = h;
  $('#total-niv').textContent = t('niveaux.total', { n: totalEtoiles(), max: NB * 3 });
  z.querySelectorAll('[data-niv]').forEach((b) => { b.onclick = () => { premierGeste = true; SONS.clic(); lancerNiveau(+b.dataset.niv); }; });
  montrer('ecran-niveaux');
}
function ouvrirLivre() {
  const z = $('#grille-livre'); let h = '';
  for (let i = 0; i < NB; i++) {
    const a = HONNEUR[i];
    if (prog.livre[i]) {
      const e = prog.etoiles[i] || 0;
      h += `<div class="case-livre">${visageSVG(a)}<div>${attr(nomAnimal(a))}</div><div class="mini">${ETOILE(e > 0)}${ETOILE(e > 1)}${ETOILE(e > 2)}</div><div>${attr(t('jeu.niveau', { n: i + 1 }))}</div></div>`;
    } else h += `<div class="case-livre vide"><svg class="visage" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38" fill="#5a4a5e"/></svg><div>${attr(t('jeu.niveau', { n: i + 1 }))}</div></div>`;
  }
  z.innerHTML = h;
  $('#total-livre').textContent = t('livre.compte', { n: prog.livre.filter(Boolean).length, max: NB });
  montrer('ecran-livre');
}
function ouvrirSalle() {
  const total = totalEtoiles();
  const z = $('#choix-salle');
  const groupe = (titre, seuils, cle, apercu) => {
    let h = `<div class="choix-groupe"><h3>${attr(t(titre))}</h3><div class="choix-liste">`;
    seuils.forEach((s, i) => {
      const ouvert = total >= s, pris = (prog.options[cle] || 0) === i;
      h += `<button class="choix${pris ? ' pris' : ''}${ouvert ? '' : ' ferme'}" data-cle="${cle}" data-i="${i}" ${ouvert ? '' : 'disabled'} aria-pressed="${pris}">${ouvert ? apercu(i) : ICONES.cadenas}<span>${attr(ouvert ? t(cle === 'deco' ? 'deco.' + i : cle + '.' + i) : t('salle.ferme', { n: s }))}</span></button>`;
    });
    return h + '</div></div>';
  };
  z.innerHTML = groupe('salle.nappes', NAPPES, 'nappe', (i) => `<span class="apercu nappe-${i}"></span>`)
    + groupe('salle.vaisselle', VAISSELLES, 'vaisselle', (i) => `<span class="apercu ass vaisselle-${i}" style="border-width:4px;border-style:${i === 3 ? 'dotted' : 'solid'};border-color:${['#d9cbb4', '#4a8fd6', '#e2a92a', '#e86fa1'][i]}"></span>`)
    + groupe('salle.deco', DECO_SEUILS, 'deco', (i) => (i ? decoSVG(i) : '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="30" fill="none" stroke="#c9b28f" stroke-width="6" stroke-dasharray="8 8"/></svg>'));
  $('#total-salle').textContent = t('niveaux.total', { n: total, max: NB * 3 });
  z.querySelectorAll('.choix:not([disabled])').forEach((b) => {
    b.onclick = () => { premierGeste = true; prog.options[b.dataset.cle] = +b.dataset.i; sauverOptions(); SONS.poser(); ouvrirSalle(); const nb = $(`.choix[data-cle="${b.dataset.cle}"][data-i="${b.dataset.i}"]`); if (nb) nb.focus(); };
  });
  montrer('ecran-salle');
}

// --- Dessin de l'écran titre -------------------------------------------------------------
function dessinTitre(resto) {
  const fond = { creperie: ['#a8573f', '#c98d59'], palais: ['#4b2a6b', '#7b3f8f'], piquenique: ['#8fd3f4', '#5fae45'], train: ['#2f4f7a', '#6c7f99'] }[resto || 'creperie'];
  const face = (a, x, y, w = 62) => `<svg x="${x}" y="${y}" width="${w}" height="${w}" viewBox="0 0 100 100"><clipPath id="c-${a}-${x}"><circle cx="50" cy="50" r="48"/></clipPath><g clip-path="url(#c-${a}-${x})">${VISAGES[a]}</g><circle cx="50" cy="50" r="47" fill="none" stroke="#fff" stroke-width="4"/></svg>`;
  const ass = (d, x, y, w = 40) => `<circle cx="${x + w / 2}" cy="${y + w / 2}" r="${w / 2}" fill="#fff" stroke="#d9cbb4" stroke-width="3"/><svg x="${x}" y="${y}" width="${w}" height="${w}" viewBox="0 0 100 100">${ALIMENTS[d]}</svg>`;
  let fanions = '';
  const couleurs = ['#ff5a6e', '#f7c62a', '#4fc3ff', '#3fa86b', '#9a6bff'];
  for (let i = 0; i < 12; i++) { const x = 6 + i * 30; fanions += `<path d="M${x} ${18 + Math.sin(i / 11 * Math.PI) * 14} l26 0 l-13 22 Z" fill="${couleurs[i % 5]}"/>`; }
  return `<svg viewBox="0 0 360 300" aria-hidden="true">
    <rect width="360" height="300" rx="22" fill="${fond[1]}"/><rect width="360" height="110" rx="22" fill="${fond[0]}"/>
    <path d="M0 20 Q180 50 360 20" stroke="#f2e2c4" stroke-width="3" fill="none"/>${fanions}
    <svg x="22" y="44" width="62" height="62" viewBox="0 0 100 100">${REPERES[resto === 'piquenique' ? 'arbre' : 'fenetre']}</svg>
    <svg x="282" y="48" width="56" height="56" viewBox="0 0 100 100">${REPERES[resto === 'piquenique' ? 'fleurs' : 'plante']}</svg>
    <ellipse cx="180" cy="250" rx="150" ry="22" fill="rgba(0,0,0,.18)"/>
    ${face('girafe', 46, 92, 70)}${face('hibou', 145, 70, 70)}${face('chat', 244, 92, 70)}
    <ellipse cx="180" cy="200" rx="150" ry="50" fill="#fbfaf5" stroke="#6b3e1f" stroke-width="6"/>
    <path d="M40 214 Q60 246 80 216 Q100 248 120 218 Q140 250 160 220 Q180 250 200 220 Q220 250 240 218 Q260 248 280 216 Q300 246 320 214" fill="#e24c4c" opacity=".85"/>
    ${ass('tarte', 66, 168)}${ass('poisson', 160, 160)}${ass('pizza', 254, 168)}
    <svg x="124" y="186" width="54" height="40" viewBox="0 0 100 100" preserveAspectRatio="none">${ICONES.cloche.replace(/<\/?svg[^>]*>/g, '')}</svg>
    ${face('lapin', 196, 214, 50)}${face('panda', 114, 220, 46)}
    <path d="M300 150 l4 10 l10 2 l-8 7 l2 10 l-8 -5 l-8 5 l2 -10 l-8 -7 l10 -2 Z" fill="#f7c62a"/>
    <path d="M40 140 l3 7 l7 1 l-5 5 l1 7 l-6 -4 l-6 4 l1 -7 l-5 -5 l7 -1 Z" fill="#f7c62a"/>
  </svg>`;
}

// =====================================================================
//  Glisser-déposer et clavier
// =====================================================================
let glisse = null, ignorerClic = 0;
function surAppui(e) {
  premierGeste = true;
  if (!st || st.fini || st.pause || e.button > 0) return;
  const el = e.target.closest('[data-objet]');
  if (!el || !$('#ecran-jeu').contains(el)) return;
  if (st.bloque[el.dataset.objet][el.dataset.id]) return;
  glisse = { el, x: e.clientX, y: e.clientY, id: e.pointerId, actif: false, clone: null };
}
function surMouvement(e) {
  if (!glisse || e.pointerId !== glisse.id) return;
  const dx = e.clientX - glisse.x, dy = e.clientY - glisse.y;
  if (!glisse.actif && Math.hypot(dx, dy) > 8) {
    glisse.actif = true;
    const r = glisse.el.getBoundingClientRect();
    const c = glisse.el.cloneNode(true);
    c.classList.add('flottant'); c.classList.remove('choisi', 'vise');
    c.style.width = r.width + 'px'; c.style.height = r.height + 'px'; c.style.left = r.left + 'px'; c.style.top = r.top + 'px';
    document.body.appendChild(c);
    glisse.clone = c; glisse.ox = e.clientX - r.left; glisse.oy = e.clientY - r.top;
    glisse.el.classList.add('fantome');
    st.sel = { type: glisse.el.dataset.objet, id: glisse.el.dataset.id };
    SONS.prendre();
  }
  if (glisse.actif) {
    glisse.clone.style.left = (e.clientX - glisse.ox) + 'px';
    glisse.clone.style.top = (e.clientY - glisse.oy) + 'px';
    e.preventDefault();
  }
}
function surRelache(e) {
  if (!glisse || e.pointerId !== glisse.id) return;
  const g = glisse; glisse = null;
  if (!g.actif) return; // simple toucher : géré par le clic
  ignorerClic = Date.now();
  g.clone.remove(); g.el.classList.remove('fantome');
  const sous = document.elementFromPoint(e.clientX, e.clientY);
  const cible = sous && sous.closest('[data-cible]');
  const sel = st.sel;
  if (cible && sel && $('#ecran-jeu').contains(cible) && deplacer(sel, cible.dataset.cible, cible.dataset.i != null ? +cible.dataset.i : -1)) {
    st.sel = null; rafraichir(); animerPose(sel);
  } else { st.sel = null; rafraichir(); }
}
function surAnnule() { if (glisse) { if (glisse.clone) glisse.clone.remove(); glisse.el.classList.remove('fantome'); glisse = null; if (st) { st.sel = null; rafraichir(); } } }

// Navigation au clavier : flèches vers le bouton le plus proche dans la direction.
function zoneActive() {
  const v = document.querySelector('.voile.ouvert');
  if (v) return v;
  return document.querySelector('.ecran.actif');
}
function naviguer(dir) {
  const z = zoneActive(); if (!z) return false;
  const liste = Array.from(z.querySelectorAll('button:not([disabled]), [tabindex="0"]')).filter((b) => b.offsetParent !== null || b.getClientRects().length);
  if (!liste.length) return false;
  const cur = document.activeElement;
  if (!cur || !z.contains(cur)) { liste[0].focus(); return true; }
  const r0 = cur.getBoundingClientRect(); const cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;
  let best = null, bd = Infinity;
  liste.forEach((b) => {
    if (b === cur) return;
    const r = b.getBoundingClientRect(); const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const dx = x - cx, dy = y - cy;
    let p, s;
    if (dir === 'g') { p = -dx; s = Math.abs(dy); } else if (dir === 'd') { p = dx; s = Math.abs(dy); } else if (dir === 'h') { p = -dy; s = Math.abs(dx); } else { p = dy; s = Math.abs(dx); }
    if (p <= 4) return;
    const d = p + s * 2.2;
    if (d < bd) { bd = d; best = b; }
  });
  if (best) { best.focus(); return true; }
  return false;
}
document.addEventListener('keydown', (e) => {
  premierGeste = true;
  if (document.querySelector('jel-sauvegarde')) return;
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if ($('#voile-intro').classList.contains('ouvert')) { fermerIntro(); e.preventDefault(); return; }
    if ($('#voile-pause').classList.contains('ouvert')) { reprendre(); e.preventDefault(); return; }
    if ($('#ecran-jeu').classList.contains('actif')) { pause(); e.preventDefault(); }
    return;
  }
  const dirs = { ArrowLeft: 'g', ArrowRight: 'd', ArrowUp: 'h', ArrowDown: 'b' };
  if (dirs[e.code]) { if (naviguer(dirs[e.code])) e.preventDefault(); return; }
  if ((e.code === 'Enter' || e.code === 'Space') && document.activeElement && document.activeElement.id === 'plateau') { agir($('#plateau')); e.preventDefault(); }
});

// =====================================================================
//  Branchements
// =====================================================================
function brancher() {
  $('#btn-pause').innerHTML = ICONES.pause;
  document.querySelectorAll('.retour').forEach((b) => { b.innerHTML = ICONES.retour; b.onclick = () => { SONS.clic(); montrer('ecran-titre'); }; });
  majBoutonsSon();
  ['#btn-son-titre', '#btn-son-jeu', '#btn-son-pause'].forEach((s) => { $(s).onclick = () => { premierGeste = true; basculerSon(); }; });
  $('#btn-jouer').onclick = () => {
    premierGeste = true; SONS.clic();
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { chargerProg(); lancerNiveau((Number(d.niveau) || 1) - 1); },
      onNouvelle: () => lancerNiveau(0),
      onEffacer: () => { chargerProg(); majBoutonsSon(); lancerNiveau(0); },
    });
  };
  $('#btn-niveaux').onclick = () => { premierGeste = true; SONS.clic(); ouvrirNiveaux(); };
  $('#btn-livre').onclick = () => { premierGeste = true; SONS.clic(); ouvrirLivre(); };
  $('#btn-salle').onclick = () => { premierGeste = true; SONS.clic(); ouvrirSalle(); };
  $('#btn-pause').onclick = () => { premierGeste = true; SONS.clic(); pause(); };
  $('#p-reprendre').onclick = () => { SONS.clic(); reprendre(); };
  $('#p-recommencer').onclick = () => { SONS.clic(); fermerVoiles(); lancerNiveau(st.idx); };
  $('#p-niveaux').onclick = () => { SONS.clic(); if (st && !st.fini) sauver(st.idx + 1); fermerVoiles(); ouvrirNiveaux(); };
  $('#p-accueil').onclick = () => { SONS.clic(); allerAccueil(); };
  $('#btn-servir').onclick = () => servir();
  $('#btn-pouce').onclick = () => coupDePouce();
  // Toucher sur la partie (délégation).
  $('#ecran-jeu').addEventListener('click', (e) => {
    if (Date.now() - ignorerClic < 350) return;
    const el = e.target.closest('[data-indice], [data-objet], [data-cible]');
    if (el && $('#ecran-jeu').contains(el)) agir(el);
  });
  const jeu = $('#ecran-jeu');
  jeu.addEventListener('pointerdown', surAppui);
  window.addEventListener('pointermove', surMouvement, { passive: false });
  window.addEventListener('pointerup', surRelache);
  window.addEventListener('pointercancel', surAnnule);
  // Un toucher sur une présentation la ferme.
  $('#voile-intro').addEventListener('click', (e) => { if (!e.target.closest('button') || e.target.id === 'intro-ok') fermerIntro(); });
  window.addEventListener('resize', () => { if ($('#ecran-jeu').classList.contains('actif')) rendreSalle(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') pause(); });
  JEL_SAVE.surFermeture(() => { if (enCours && st && !st.fini) JEL_SAVE.save(JEU, donneesSauvegarde(st.idx + 1)); });
  I18N.surChangement(() => { document.title = t('titre'); });
}

chargerProg();
document.title = t('titre');
$('#dessin-titre').innerHTML = dessinTitre('creperie');
brancher();
})();
</script>
