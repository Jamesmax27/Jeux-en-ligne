  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && e.main && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  const cache = document.createElement('canvas');
  let cacheCle = '';
  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    dessinerCouche(performance.now(), dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cacheCle = ''; }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!vue) {
      const L = LAGONS[0], gr = c.createLinearGradient(0, 0, 0, h);
      gr.addColorStop(0, L.haut); gr.addColorStop(1, L.bas); c.fillStyle = gr; c.fillRect(0, 0, w, h);
      geo = null; return;
    }
    geo = geometrie(vue, w, h, Math.max(10, Math.min(w, h) * 0.03));
    // tuiles qui finissent de tomber : on les rend au dessin fixe
    Object.keys(anims).forEach((k) => { if (t - anims[k] > 300) delete anims[k]; });
    const cle = [w, h, dpr, prog.corail, vue.g.join(','), vue.zc.join(''), vue.res.join(','), Object.keys(anims).join(',')].join('|');
    if (cle !== cacheCle) {
      cacheCle = cle;
      cache.width = cv.width; cache.height = cv.height;
      const cc = cache.getContext('2d');
      cc.setTransform(dpr, 0, 0, dpr, 0, 0);
      dessinerLagon(cc, vue, geo, w, h, { cacher: anims });
    }
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.drawImage(cache, 0, 0);
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const s = geo.s;
    // aides de pose (seulement pendant mon tour)
    if (monTour()) {
      const sp = moi();
      if (modeEtoile) {
        for (let i = 0; i < vue.W * vue.H; i++) {
          if (!R.valide(vue, sp, { e: i })) continue;
          const x = geo.ox + (i % vue.W + 0.5) * s, y = geo.oy + (Math.floor(i / vue.W) + 0.5) * s;
          c.globalAlpha = 0.45 + 0.25 * Math.sin(t / 220); etoileDeMer(c, x, y, s * 0.22, '#ffb36b', 0); c.globalAlpha = 1;
        }
      } else {
        const ici = O.rot(vue.main, rotation);
        const toutes = O.poses(vue, sp, vue.main);
        const vus = {};
        toutes.forEach((p) => { vus[p.c] = vus[p.c] || 1; if (O.rot(vue.main, p.r) === ici) vus[p.c] = 2; });
        Object.keys(vus).forEach((k) => {
          const i = +k, x = geo.ox + (i % vue.W + 0.5) * s, y = geo.oy + (Math.floor(i / vue.W) + 0.5) * s;
          if (i === choix) return;
          if (vus[k] === 2) { c.fillStyle = 'rgba(255,255,255,' + (0.6 + 0.25 * Math.sin(t / 250)).toFixed(2) + ')'; rond(c, x, y, s * 0.12); c.fill(); }
          else { c.strokeStyle = 'rgba(255,255,255,.65)'; c.lineWidth = Math.max(2, s * 0.04); rond(c, x, y, s * 0.12); c.stroke(); }
        });
        // tuile fantôme sur la case choisie
        if (choix >= 0 && vue.g[choix] === '') {
          const ok = O.peutPoser(vue, sp, choix, ici);
          const x = geo.ox + (choix % vue.W) * s, y = geo.oy + Math.floor(choix / vue.W) * s;
          dessinerTuile(c, ici, x, y, s, { alpha: 0.88 });
          c.strokeStyle = ok ? '#4dff9a' : '#ff4d4d'; c.lineWidth = Math.max(3, s * 0.07);
          c.setLineDash(ok ? [] : [s * 0.12, s * 0.08]);
          c.strokeRect(x + 2, y + 2, s - 4, s - 4); c.setLineDash([]);
        }
      }
      if (clavier && curseur >= 0) {
        const x = geo.ox + (curseur % vue.W) * s, y = geo.oy + Math.floor(curseur / vue.W) * s;
        c.strokeStyle = 'rgba(255,230,80,' + (0.6 + 0.4 * Math.sin(t / 150)).toFixed(2) + ')'; c.lineWidth = Math.max(3, s * 0.06);
        rr(c, x + 3, y + 3, s - 6, s - 6, s * 0.12); c.stroke();
      }
    }
    // dernière tuile posée par quelqu'un d'autre : un cadre de sa couleur
    if (vue.der >= 0 && O.estTuile(vue.g[vue.der]) && !anims[vue.der]) {
      const x = geo.ox + (vue.der % vue.W) * s, y = geo.oy + Math.floor(vue.der / vue.W) * s;
      c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = Math.max(2, s * 0.04); c.setLineDash([s * 0.1, s * 0.07]);
      c.strokeRect(x + 2, y + 2, s - 4, s - 4); c.setLineDash([]);
    }
    dessinerVivant(c, vue, geo, t, { anims: anims, naissances: naissances, derive: derive, positions: positions });
    // particules (bulles, étincelles)
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.bulle ? -60 : 260) * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      if (p.bulle) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.5; rond(c, p.x, p.y, p.k); c.stroke(); }
      else { c.fillStyle = p.coul; etincelle(c, p.x, p.y, p.k); }
      c.globalAlpha = 1;
    }
  }

  // Couche au-dessus de tout : poissons qui nagent jusqu'à la carte de leur place.
  function dessinerCouche(t) {
    const cv = $('couche'), w = window.innerWidth, h = window.innerHeight;
    if (!vols.length) { if (cv.dataset.vide !== '1') { cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); cv.dataset.vide = '1'; } return; }
    cv.dataset.vide = '0';
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    const c = cv.getContext('2d');
    c.clearRect(0, 0, w, h);
    for (let i = vols.length - 1; i >= 0; i--) {
      const v = vols[i], q = (t - v.t0) / v.dur;
      if (q >= 1) {
        vols.splice(i, 1);
        if (v.place >= 0) { const carte = $('place-' + v.place); carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond'); }
        continue;
      }
      if (q < 0) continue;
      const e = q * q * (3 - 2 * q);
      const x = v.x0 + (v.x1 - v.x0) * e, y = v.y0 + (v.y1 - v.y0) * e - Math.sin(q * Math.PI) * 60;
      c.globalAlpha = v.place < 0 ? 1 - q : 1;
      poisson(c, v.sp, x, y, v.k * (1 - 0.4 * q), t, v.x1 >= v.x0 ? 1 : -1);
      c.globalAlpha = 1;
    }
  }

  function centreCase(i) {
    if (!vue || !geo) return [0, 0];
    return [geo.ox + (i % vue.W + 0.5) * geo.s, geo.oy + (Math.floor(i / vue.W) + 0.5) * geo.s];
  }
  function jaillir(i, coul, bulles) {
    if (!vue || !geo) return;
    const p = centreCase(i);
    for (let k = 0; k < 12; k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 140;
      particules.push({ x: p[0], y: p[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, vie: 0.6 + Math.random() * 0.5, k: geo.s * (0.05 + Math.random() * 0.06), coul: k % 2 ? coul : '#fff3a0', bulle: bulles && k % 2 === 0 });
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function nouvelleVue(etat) {
    vue = etat ? JSON.parse(JSON.stringify(etat)) : null;
    positions = vue ? positionsPoissons(vue) : [];
    cacheCle = '';
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    nouvelleVue(partie.etat);
    anims = {}; naissances = {}; derive = null;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44);
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { animal: tr('animal.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { animal: nomChef ? nomChef + ' · ' + tr('animal.' + partie.chef) : tr('animal.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    nouvelleVue(partie.etat);
    anims = {}; naissances = {}; derive = null;
    particules.length = 0;
    vols.length = 0;
    debutTour = Date.now();
    dernierTic = -1;
    choix = -1; modeEtoile = false; curseur = -1;
    mainAffichee = undefined;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche, lagon: tr('lagon.' + vue.l) })); sons.tour(); }
    else {
      enPartie = true;
      const L = NIVEAUX[niveau - 1];
      toast(tr('objectif', { a: L.o[0], b: L.o[1] }), 3400);
    }
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surAction(ev) {
    const t = performance.now();
    const av = ev.avant, ap = ev.apres, a = ev.action || {};
    nouvelleVue(ap);
    debutTour = Date.now();
    dernierTic = -1;
    if (Number.isInteger(a.c)) {
      anims[a.c] = t;
      sons.pose();
      jaillir(a.c, COUL[ev.siege], true);
    } else if (Number.isInteger(a.e)) {
      sons.etoile();
      jaillir(a.e, '#ffb36b', false);
      if (!ev.moi) toast(tr('etoile.posee', { animal: tr('animal.' + ev.siege) }), 1800);
    } else if (a.p === 1) {
      toast(tr(ev.moi ? 'passe.toi' : 'passe.autre', { animal: tr('animal.' + ev.siege) }), 1800);
    }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    // la tuile qui dérive a bougé
    if (av.d && ap.d && av.d.i !== ap.d.i) { derive = { de: av.d.i, a: ap.d.i, t0: t }; sons.courant(); }
    else if (!av.d && ap.d) { derive = null; sons.courant(); }
    if (ap.dac >= 0) { anims[ap.dac] = t; jaillir(ap.dac, '#bfefff', true); sons.courant(); }
    // nouveaux poissons
    const moiS = moi();
    for (let k = av.pois.length; k < ap.pois.length; k++) {
      const p = ap.pois[k];
      naissances[k] = t;
      sons.ferme();
      const pos = positions[k];
      if (!pos || !geo) continue;
      const r = $('plateau').getBoundingClientRect();
      const x0 = r.left + geo.ox + pos.x * geo.s, y0 = r.top + geo.oy + pos.y * geo.s;
      if (p.p >= 0) {
        sons.poisson();
        const carte = $('place-' + p.p).getBoundingClientRect();
        vols.push({ sp: p.sp, x0: x0, y0: y0, x1: carte.left + carte.width / 2, y1: carte.top + carte.height / 2, t0: t + 650, dur: 900, k: geo.s * 0.6, place: p.p });
        if (p.sp >= 9) { sons.exigeant(); toast(tr(p.p === moiS ? 'exigeant.toi' : 'exigeant.autre', { espece: tr('espece.' + p.sp), animal: tr('animal.' + p.p) }), 2600); }
        else if (p.p === moiS) toast(tr('poisson.toi', { espece: tr('espece.' + p.sp), n: p.pts }), 2000);
        if (p.p === moiS && moiS >= 0) noterEspece(p.sp);
        confettisLocaux(k, p.p);
      } else {
        sons.large();
        vols.push({ sp: p.sp, x0: x0, y0: y0, x1: r.right + 60, y1: y0 - 80, t0: t + 300, dur: 1400, k: geo.s * 0.6, place: -1 });
        toast(tr('courant.large'), 2600);
      }
    }
    if (ap.main !== av.main || ap.tour !== av.tour) { mainAffichee = undefined; }
    if (ap.main && ap.tour === moiS && ev.siege !== moiS && partie.phase === 'jeu') sons.tour();
  }

  function confettisLocaux(k, place) {
    const pos = positions[k];
    if (!pos || !geo) return;
    const x = geo.ox + pos.x * geo.s, y = geo.oy + pos.y * geo.s;
    for (let n = 0; n < 16; n++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 160;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, vie: 0.8 + Math.random() * 0.4, k: geo.s * (0.06 + Math.random() * 0.06), coul: n % 2 ? COUL[place] : '#ffe066' });
    }
  }

  // Album : une espèce accueillie par le joueur de l'appareil.
  function noterEspece(sp) {
    if (prog.album[sp]) return;
    prog.album[sp] = true;
    setTimeout(() => toast(tr('album.nouvelle', { espece: tr('espece.' + sp) }), 2600), 2200);
    if (!(session === 'solo' && enPartie)) sauverReglages();
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1700);
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const m = partie.siege;
    const gagne = m >= 0 && R.fin(e) && R.fin(e).classement[0] === m;
    if (m >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, m, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(pf, gagne, L) {
    if (!gagne) return 0;
    return pf >= L.o[1] ? 3 : (pf >= L.o[0] ? 2 : 1);
  }

  function remplirClassement(e, m, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    ordre.forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === m ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64; medaillon(cv.getContext('2d'), s, 32, 32, 30);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === m ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      // Robot : l'animal seul (le pictogramme dit « robot ») ; vrai joueur : son pseudo.
      const nom = document.createElement('span');
      nom.textContent = role === 'robot' ? tr('animal.' + s) : (role === 'joueur' && info.nom ? info.nom : tr('animal.' + s) + ' · ' + nomPlace(info, role));
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.ligne', { n: e.sc[s], p: e.pf[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const m = partie.siege, sieges = siegesActuels();
    const pts = m >= 0 ? e.sc[m] : 0, pf = m >= 0 ? e.pf[m] : 0;
    const res = R.fin(e);
    const gagne = m >= 0 && pts === Math.max.apply(null, e.sc);
    const egalite = gagne && res && res.classement[0] !== m;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, m, sieges, $('fin-classement'));
    $('fin-points').textContent = m >= 0 ? tr('fin.points', { n: pts }) : '';
    $('fin-poissons').textContent = m >= 0 ? tr('fin.poissons', { n: pf }) : '';
    $('fin-album').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1, L = NIVEAUX[i];
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(pf, gagne, L);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      const totalAvant = totalEtoiles();
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
        const corail = CORAUX.findIndex((k, n) => n > 0 && totalEtoiles() >= k.seuil && totalAvant < k.seuil);
        if (corail > 0) $('fin-album').textContent = tr('fin.corail', { corail: tr('corail.' + corail) });
      } else sauver(niveau, pts);
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : (gagne ? '' : tr('fin.conseil', { a: L.o[0] })));
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil.
      if (m >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (contre des robots après une coupure).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Confettis de victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: [COUL[i % 4], '#ff8f86', '#ffd34d', '#b48cff'][i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux, album
  // ---------------------------------------------------------------------

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    nouvelleVue(null);
    vols.length = 0;
    bandeau('');
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon'].forEach(fermerVoile);
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    mainAffichee = undefined;
  }

  // Aperçu du lagon d'un niveau (avant que la partie ne commence).
  function apercu(n) {
    const e = R.depart(() => 0.5, PLACES, { niveau: n });
    return e;
  }

  // Parcours solo : niveau n contre 3 robots (force croissante).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    nouvelleVue(apercu(niveau));
    vue.main = null;
    anims = {}; naissances = {}; derive = null;
    particules.length = 0;
    vols.length = 0;
    mainAffichee = undefined;
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const grille = $('grille-niveaux');
    grille.textContent = '';
    NIVEAUX.forEach((L, i) => {
      const n = i + 1, ouvert = n <= prog.debloque;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'case l' + L.l + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
      b.append(num, et);
      b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i], lagon: tr('lagon.' + L.l) }) : tr('niveau.ferme', { niveau: n }));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
      else b.disabled = true;
      grille.appendChild(b);
    });
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
  }

  function ouvrirAlbum() {
    const ge = $('grille-especes');
    ge.textContent = '';
    for (let sp = 0; sp < NB_ESPECES; sp++) {
      const vu = prog.album[sp];
      const d = document.createElement('div');
      d.className = 'fiche' + (vu ? '' : ' cache');
      const cv = document.createElement('canvas'); cv.width = 168; cv.height = 112;
      poisson(cv.getContext('2d'), sp, 84, 56, 70, 0, 1, vu ? null : 'rgba(20,50,70,.55)');
      const nom = document.createElement('span'); nom.textContent = vu ? tr('espece.' + sp) : tr('album.inconnue');
      const aide = document.createElement('small'); aide.textContent = tr('album.ou.' + sp);
      d.append(cv, nom, aide);
      ge.appendChild(d);
    }
    const gc = $('grille-coraux');
    gc.textContent = '';
    const total = totalEtoiles();
    CORAUX.forEach((k, n) => {
      const ouvert = total >= k.seuil;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'fiche' + (ouvert ? '' : ' ferme') + (n === prog.corail ? ' choisi' : '');
      const cv = document.createElement('canvas'); cv.width = 168; cv.height = 112;
      const c = cv.getContext('2d');
      const ancien = prog.corail;
      prog.corail = n;
      dessinerTuile(c, 'rrss', 30, 4, 52, { vis: ouvert ? null : [false, false, false, false] });
      dessinerTuile(c, 'srrs', 86, 4, 52, { vis: ouvert ? null : [false, false, false, false] });
      prog.corail = ancien;
      const nom = document.createElement('span'); nom.textContent = tr('corail.' + n);
      const aide = document.createElement('small'); aide.textContent = ouvert ? (n === prog.corail ? tr('album.choisi') : tr('album.choisir')) : tr('album.seuil', { n: k.seuil });
      b.append(cv, nom, aide);
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); prog.corail = n; sauverReglages(); exCle = ''; suivanteCle = null; ouvrirAlbum(); });
      else b.disabled = true;
      gc.appendChild(b);
    });
    $('album-total').textContent = tr('album.total', { n: prog.album.filter(Boolean).length, max: NB_ESPECES });
    afficherEcran('album');
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    const L = NIVEAUX[niveau - 1];
    $('pause-objectif').textContent = ligne ? '' : tr('objectif', { a: L.o[0], b: L.o[1] });
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();

  // ---------------------------------------------------------------------
  //  Tutoriels animés : un petit lagon, une main qui tourne et pose la tuile
  // ---------------------------------------------------------------------

  // g : tuiles déjà posées ; ep : épaves ; src / d : courant ; etapes : poses
  // (c case, t tuile posée, k touchers pour la tourner) ou étoile de mer (e).
  const TUTOS = {
    base: { W: 3, H: 2, cols: 'r', g: { '0,0': 'srss' }, etapes: [{ c: '0,1', t: 'sssr', k: 1 }] },
    couleurs: { W: 3, H: 2, cols: 'rj', g: { '0,0': 'sjss', '1,0': 'srss' }, etapes: [{ c: '0,1', t: 'ssjj', k: 2 }, { c: '1,1', t: 'jssr', k: 0 }] },
    anemone: { W: 4, H: 2, cols: 'rjv', g: { '0,0': 'svss', '0,1': 'svsv', '0,2': 'svsv' }, etapes: [{ c: '0,3', t: 'sssv', k: 1 }] },
    exigeant: { W: 3, H: 2, cols: 'rjv', ex: [{ a: 'r', b: 'j' }], g: { '0,0': 'srsj' }, etapes: [{ c: '0,1', t: 'sssr', k: 1 }] },
    courant: { W: 4, H: 3, cols: 'rjv', g: { '0,3': 'ssjs' }, d: { c: '0,0', dir: 1, t: 'rsrs' }, etapes: [{ c: '1,3', t: 'jsss', k: 0 }, { c: '1,2', t: 'ssss', k: 0 }, { c: '1,1', t: 'svss', k: 1 }] },
    deuxCourants: { W: 4, H: 3, cols: 'rjv', g: { '1,1': 'ssss', '1,2': 'ssss' }, d: { c: '0,0', dir: 1, t: 'jsjs' }, src: [{ c: '2,3', dir: 3 }], etapes: [{ c: '1,0', t: 'ssrs', k: 0 }, { c: '1,3', t: 'srss', k: 1 }, { c: '0,3', t: 'ssvs', k: 0 }] },
    etoile: { W: 3, H: 2, cols: 'rjv', g: { '0,0': 'srss' }, etapes: [{ e: '0,1' }, { c: '0,1', t: 'sssr', k: 1 }] },
    epave: { W: 3, H: 2, cols: 'rjv', g: { '0,0': 'srss' }, ep: ['0,2'], etapes: [{ c: '0,1', t: 'srsr', k: 1 }] },
    deux: { W: 5, H: 2, cols: 'rjv', g: { '0,0': 'svss', '0,4': 'sssj' }, etapes: [{ c: '0,1', t: 'sssv', k: 1 }, { c: '0,3', t: 'sjss', k: 2 }] },
    nuit: { W: 3, H: 2, cols: 'rjv', nuit: 1, g: { '0,0': 'svss', '1,1': 'jsrs', '1,2': 'ssss' }, etapes: [{ c: '0,1', t: 'sssv', k: 1 }] }
  };

  // Petit état de règles pour un tutoriel (une seule place : la tienne).
  function etatTuto(d) {
    const e = {
      W: d.W, H: d.H, g: [], res: [], zc: [], pois: [], sc: [0], pf: [0], et: [d.etapes.some((x) => x.e) ? 1 : 0], tour: 0, prem: 0, tdt: 0,
      main: null, sac: [], etp: false, ex: (d.ex || []).map((x) => ({ a: x.a, b: x.b })), d: null, nd: 0, src: [], ks: 0, n: 0, l: d.nuit ? 3 : 0,
      nuit: d.nuit ? 1 : 0, cols: d.cols, der: -1, dac: -1
    };
    for (let i = 0; i < d.W * d.H; i++) { e.g.push(''); e.res.push(-1); }
    for (let i = 0; i < d.W * d.H * 4; i++) e.zc.push(-1);
    Object.keys(d.g).forEach((k) => { e.g[O.caseDe(e, k)] = d.g[k]; });
    (d.ep || []).forEach((k) => { e.g[O.caseDe(e, k)] = '#'; });
    if (d.d) e.d = { i: O.caseDe(e, d.d.c), dir: d.d.dir, t: d.d.t };
    if (d.src) { e.src = d.src.map((s) => ({ i: O.caseDe(e, s.c), d: s.dir })); e.nd = d.src.length; }
    // la tuile à poser à chaque étape, avant ses quarts de tour
    d.etapes.forEach((x) => { if (x.c) e.sac.push(O.rot(x.t, -x.k)); });
    e.sac.push('ssss');
    e.main = e.sac.shift();
    return e;
  }

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    let e = etatTuto(d), debut = 0, fait = 0, rotTuto = 0, an = {}, nais = {}, der = null;
    const j = ++tutoAnim;
    const g = geometrie(e, 400, 360, 30);
    g.ox = Math.max(14, g.ox - 70);
    const MX = 470, MY = 180, MS = 84;          // la tuile en main, à droite
    // durées d'une étape : aller à la tuile, touchers, aller à la case, poser, regarder
    const duree = (x) => (x.e ? 2200 : 600 + x.k * 520 + 800 + 1300);
    let tutoAnimId = 0;
    const bruit = graineHasard(5);
    const alea = () => bruit();
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      let ecoule = t - debut;
      // étape en cours
      let k = 0, avant = 0;
      while (k < d.etapes.length && ecoule >= avant + duree(d.etapes[k])) { avant += duree(d.etapes[k]); k++; }
      if (k >= d.etapes.length && ecoule > avant + 1600) { e = etatTuto(d); fait = 0; rotTuto = 0; an = {}; nais = {}; der = null; debut = t; ecoule = 0; k = 0; avant = 0; }
      const x = d.etapes[Math.min(k, d.etapes.length - 1)], dans = ecoule - avant;
      // la main : position et appui
      let hx = 520, hy = 330, appui = 0;
      if (k < d.etapes.length) {
        if (x.e) {
          const ci = O.caseDe(e, x.e), cx = g.ox + (ci % e.W + 0.5) * g.s, cy = g.oy + (Math.floor(ci / e.W) + 0.5) * g.s;
          const q = Math.min(1, dans / 900);
          hx = MX + (cx - MX) * q; hy = MY + 90 + (cy - MY - 90) * q;
          if (dans > 1000 && fait === k) { R.jouer(e, 0, { e: ci }, alea); fait++; }
          if (dans > 900 && dans < 1150) appui = 1;
        } else {
          const ci = O.caseDe(e, x.c), cx = g.ox + (ci % e.W + 0.5) * g.s, cy = g.oy + (Math.floor(ci / e.W) + 0.5) * g.s;
          if (dans < 600) { const q = dans / 600; hx = 520 + (MX - 520) * q; hy = 330 + (MY - 330) * q; }
          else if (dans < 600 + x.k * 520) {
            hx = MX; hy = MY;
            const n = Math.floor((dans - 600) / 520), dd = (dans - 600) % 520;
            if (dd < 150) appui = 1;
            rotTuto = n + (dd >= 150 ? 1 : 0);
          } else if (dans < 600 + x.k * 520 + 800) {
            rotTuto = x.k;
            const q = (dans - 600 - x.k * 520) / 800;
            hx = MX + (cx - MX) * q; hy = MY + (cy - MY) * q;
          } else {
            hx = cx; hy = cy;
            if (fait === k) {
              const av = e.pois.length;
              R.jouer(e, 0, { c: ci, r: x.k }, alea);
              an[ci] = t; for (let p = av; p < e.pois.length; p++) nais[p] = t;
              if (e.dac >= 0) an[e.dac] = t;
              fait++; rotTuto = 0;
            }
            if (dans < 600 + x.k * 520 + 1000) appui = 1;
          }
        }
      }
      // dessin
      c.setTransform(1, 0, 0, 1, 0, 0);
      dessinerLagon(c, e, g, 560, 360, { cacher: {} });
      Object.keys(an).forEach((q) => { if (t - an[q] > 300) delete an[q]; });
      dessinerVivant(c, e, g, t, { anims: an, naissances: nais, derive: der });
      // la tuile en main
      c.fillStyle = 'rgba(255,248,236,.9)'; rr(c, MX - MS / 2 - 10, MY - MS / 2 - 10, MS + 20, MS + 20, 14); c.fill();
      if (e.main && k < d.etapes.length && !x.e && fait === k) {
        c.save(); c.translate(MX, MY); c.rotate(rotTuto * Math.PI / 2);
        dessinerTuile(c, e.main, -MS / 2, -MS / 2, MS, {});
        c.restore();
      } else if (x.e && k < d.etapes.length) etoileDeMer(c, MX, MY, MS * 0.35, '#ff8a3d', 0.2);
      main(c, hx, hy, 1.5, appui);
      tutoAnimId = requestAnimationFrame(image);
    }
    tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 16); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#12324a'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function tourner() {
    if (!monTour()) return;
    audio(); sons.tourne();
    angle += 90;
    rotation = (angle / 90) % 4;
    $('main-tuile').style.transform = 'rotate(' + angle + 'deg)';
    modeEtoile = false;
    majInterface();
  }

  // Première rotation (à partir de la rotation actuelle) où la tuile tient sur la case i.
  function rotationQuiTient(i) {
    for (let k = 0; k < 4; k++) {
      const r = (rotation + k) % 4;
      if (O.peutPoser(vue, moi(), i, O.rot(vue.main, r))) return k;
    }
    return -1;
  }

  function choisirCase(i) {
    if (!monTour() || i < 0) return;
    const sp = moi();
    if (modeEtoile) {
      if (R.valide(vue, sp, { e: i })) { partie.jouer({ e: i }); modeEtoile = false; }
      else { sons.non(); toast(tr('etoile.ici'), 1600); }
      majInterface();
      return;
    }
    if (vue.g[i] !== '' || (vue.d && vue.d.i === i)) { sons.non(); return; }
    if (vue.res[i] >= 0 && vue.res[i] !== sp) { sons.non(); toast(tr('etoile.reservee'), 1600); return; }
    if (!O.contreRecif(vue, vue.g, i)) { sons.non(); toast(tr('pose.loin'), 1600); return; }
    if (choix === i) {
      // toucher de nouveau la tuile posée la fait tourner
      tourner();
      if (!O.peutPoser(vue, sp, i, O.rot(vue.main, rotation))) {
        const k = rotationQuiTient(i);
        for (let n = 0; n < k; n++) tourner();
      }
      return;
    }
    choix = i;
    audio(); sons.clic();
    const k = rotationQuiTient(i);
    if (k > 0) for (let n = 0; n < k; n++) tourner();
    else if (k < 0) { sons.non(); toast(tr('pose.couleurs'), 1800); }
    majInterface();
  }

  function poserChoix() {
    if (!monTour() || choix < 0) return;
    const t = O.rot(vue.main, rotation);
    if (!O.peutPoser(vue, moi(), choix, t)) {
      sons.non(); toast(tr('pose.couleurs'), 1800);
      const z = $('zone'); z.classList.remove('secousse'); void z.offsetWidth; z.classList.add('secousse');
      return;
    }
    if (partie.jouer({ c: choix, r: rotation })) { choix = -1; }
  }

  function caseSous(px, py) {
    if (!vue || !geo) return -1;
    const col = Math.floor((px - geo.ox) / geo.s), lig = Math.floor((py - geo.oy) / geo.s);
    if (col < 0 || lig < 0 || col >= vue.W || lig >= vue.H) return -1;
    return lig * vue.W + col;
  }

  const plateau = $('plateau');
  plateau.addEventListener('pointerdown', (ev) => { audio(); clavier = false; plateau.dataset.x = ev.clientX; plateau.dataset.y = ev.clientY; });
  plateau.addEventListener('pointerup', (ev) => {
    const r = plateau.getBoundingClientRect();
    const i = caseSous(ev.clientX - r.left, ev.clientY - r.top);
    if (i < 0) return;
    if (!partie || partie.phase !== 'jeu' || enPause || attenteTuto) return;
    if (!monTour()) { if (vue && vue.main) { sons.non(); toast(tr('tour.attends'), 1300); } return; }
    choisirCase(i);
  });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif') || !vue) return;
    const dirs = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 };
    if (dirs[ev.code] !== undefined) {
      ev.preventDefault(); audio();
      if (!clavier || curseur < 0) {
        clavier = true;
        curseur = choix >= 0 ? choix : (vue.der >= 0 ? vue.der : Math.floor(vue.H / 2) * vue.W + Math.floor(vue.W / 2));
        return;
      }
      const n = O.voisin(vue, curseur, dirs[ev.code]);
      if (n >= 0) { curseur = n; sons.clic(); }
    } else if (ev.code === 'KeyR' || ev.code === 'Space') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && ev.code === 'Space') return;
      ev.preventDefault(); tourner();
    } else if (ev.code === 'KeyE') {
      ev.preventDefault(); basculerEtoile();
    } else if (ev.code === 'Enter' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (!monTour()) return;
      if (!O.poses(vue, moi(), vue.main).length) { partie.jouer({ p: 1 }); return; }
      if (clavier && curseur >= 0 && curseur !== choix) { choisirCase(curseur); return; }
      if (clavier && curseur >= 0 && modeEtoile) { choisirCase(curseur); return; }
      poserChoix();
    }
  });

  function basculerEtoile() {
    if (!monTour()) return;
    const et = vue.et[moi()] || 0;
    if (et <= 0 || vue.etp) { sons.non(); return; }
    audio(); sons.etoile();
    modeEtoile = !modeEtoile;
    if (modeEtoile) toast(tr('etoile.aide'), 2200);
    majInterface();
  }

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-album').addEventListener('click', () => { audio(); sons.clic(); ouvrirAlbum(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('album-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-tuile').addEventListener('click', () => tourner());
  $('btn-tourner').addEventListener('click', () => tourner());
  $('btn-poser').addEventListener('click', () => { audio(); poserChoix(); });
  $('btn-passer').addEventListener('click', () => { audio(); sons.clic(); if (monTour() && !O.poses(vue, moi(), vue.main).length) partie.jouer({ p: 1 }); });
  $('btn-etoile').addEventListener('click', () => basculerEtoile());
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(); cacheCle = ''; });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
