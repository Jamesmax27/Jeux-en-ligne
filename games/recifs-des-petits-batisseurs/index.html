        c.beginPath(); c.moveTo(xx, 8 * u); c.quadraticCurveTo(xx + (i < 2 ? -8 : 8) * u, 22 * u, xx + (i < 2 ? -2 : 2) * u, 30 * u); c.stroke();
      }
      c.fillStyle = '#ff8cc6'; ell(c, 0, -4 * u, 20 * u, 19 * u); c.fill();
      oeil(c, -7 * u, -4 * u, 5 * u); oeil(c, 7 * u, -4 * u, 5 * u);
      c.strokeStyle = '#7a1b55'; c.lineWidth = 2 * u; c.beginPath(); c.arc(0, 6 * u, 5 * u, 0.3, 2.8); c.stroke();
    } else { // dauphin
      c.fillStyle = '#8cc8ff';
      c.beginPath(); c.moveTo(-24 * u, 18 * u); c.quadraticCurveTo(-26 * u, -16 * u, 4 * u, -18 * u); c.quadraticCurveTo(20 * u, -18 * u, 24 * u, -6 * u);
      c.lineTo(34 * u, -2 * u); c.lineTo(22 * u, 4 * u); c.quadraticCurveTo(6 * u, 6 * u, -4 * u, 22 * u); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(-6 * u, -16 * u); c.lineTo(-2 * u, -28 * u); c.lineTo(6 * u, -17 * u); c.fill();
      c.fillStyle = '#e6f4ff'; ell(c, 6 * u, 2 * u, 12 * u, 6 * u, -0.2); c.fill();
      oeil(c, 12 * u, -8 * u, 4.5 * u);
      c.strokeStyle = '#123f80'; c.lineWidth = 2 * u; c.beginPath(); c.moveTo(20 * u, 1 * u); c.quadraticCurveTo(24 * u, 3 * u, 28 * u, 0); c.stroke();
    }
    c.restore();
  }

  // Couronne du chef du salon.
  function couronne(c, x, y, k) {
    c.save(); c.translate(x, y);
    c.fillStyle = '#ffcf33'; c.strokeStyle = '#a56d00'; c.lineWidth = k * 0.08; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-k * 0.9, 0); c.lineTo(-k * 0.9, -k * 1.1); c.lineTo(-k * 0.45, -k * 0.55); c.lineTo(0, -k * 1.3);
    c.lineTo(k * 0.45, -k * 0.55); c.lineTo(k * 0.9, -k * 1.1); c.lineTo(k * 0.9, 0); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#ff5d7a'; rond(c, 0, -k * 0.42, k * 0.2); c.fill();
    c.restore();
  }

  // Main qui montre le geste (tutoriels).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k);
    if (appui > 0) { c.globalAlpha = 0.5 * appui; c.strokeStyle = '#fff'; c.lineWidth = 3; rond(c, 0, 0, 14 + 10 * appui); c.stroke(); c.globalAlpha = 1; }
    c.fillStyle = '#ffe0c2'; c.strokeStyle = '#8a5a3a'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-4, 0); c.lineTo(-4, 26); c.quadraticCurveTo(-14, 22, -14, 32); c.quadraticCurveTo(-8, 46, 6, 50);
    c.lineTo(22, 50); c.quadraticCurveTo(30, 40, 30, 28); c.lineTo(30, 18); c.quadraticCurveTo(26, 14, 22, 18); c.quadraticCurveTo(20, 12, 15, 14);
    c.quadraticCurveTo(12, 9, 6, 12); c.lineTo(6, 0); c.quadraticCurveTo(1, -6, -4, 0); c.closePath(); c.fill(); c.stroke();
    c.restore();
  }

  // Bulle verte « poser » des tutoriels (coche dessinée, aucun texte).
  function coche(c, x, y, r, appui) {
    c.save();
    rond(c, x, y, r * (1 + 0.15 * appui)); c.fillStyle = '#2fbf6a'; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = r * 0.18; c.stroke();
    c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = r * 0.22;
    c.beginPath(); c.moveTo(x - r * 0.4, y); c.lineTo(x - r * 0.1, y + r * 0.32); c.lineTo(x + r * 0.45, y - r * 0.35); c.stroke();
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Le lagon (plateau) : décor, tuiles, zones, poissons, aides au choix
  // ---------------------------------------------------------------------

  const FONDS = [ // eaux claires, grotte, épave, grand large
    { h: '#2ea7d8', b: '#137cb3', hors: '#f1d79a', horsB: '#d7b46c' },
    { h: '#1d6f8f', b: '#0f4a66', hors: '#5b5148', horsB: '#3d362f' },
    { h: '#1b6a8a', b: '#0d4060', hors: '#c9b27f', horsB: '#9c844f' },
    { h: '#1257a0', b: '#0a2f66', hors: '#0a2a55', horsB: '#071d3d' }
  ];

  function geometrie(e, w, h, marge) {
    // + 0,4 case : le bord arrondi du lagon dépasse de 0,2 case de chaque côté
    const s = Math.max(10, Math.min((w - 2 * marge) / (e.W + 0.4), (h - 2 * marge) / (e.H + 0.4), 84));
    return { s: s, ox: Math.round((w - s * e.W) / 2), oy: Math.round((h - s * e.H) / 2) };
  }

  function caseXY(e, g, i) { return [g.ox + (i % e.W) * g.s, g.oy + Math.floor(i / e.W) * g.s]; }

  function dessinerPlateau(c, e, g, opt) {
    const s = g.s, t = opt.t || 0, F = FONDS[e.lag || 0], st = opt.style || 0;
    const L = g.ox - s * 0.2, T = g.oy - s * 0.2, LW = e.W * s + s * 0.4, LH = e.H * s + s * 0.4;
    // eau du lagon
    rr(c, L, T, LW, LH, s * 0.4);
    const gr = c.createLinearGradient(0, T, 0, T + LH);
    gr.addColorStop(0, F.h); gr.addColorStop(1, F.b);
    c.fillStyle = gr; c.fill();
    // reflets qui ondulent
    c.save(); rr(c, L, T, LW, LH, s * 0.4); c.clip();
    c.strokeStyle = '#ffffff1c'; c.lineWidth = Math.max(1, s * 0.05);
    for (let k = 0; k < e.H + 1; k++) {
      const yy = T + k * s + Math.sin(t / 900 + k) * s * 0.1;
      c.beginPath();
      for (let xx = L; xx <= L + LW; xx += s * 0.5) c.lineTo(xx, yy + Math.sin(xx / s * 1.7 + t / 600) * s * 0.06);
      c.stroke();
    }
    c.restore();
    const anims = opt.anims || { poses: {}, zones: {}, poissons: {} };
    // cases
    for (let i = 0; i < e.W * e.H; i++) {
      const xy = caseXY(e, g, i), x = xy[0], y = xy[1], ch = e.g.charAt(i);
      if (ch === ' ') {
        c.fillStyle = F.hors; rr(c, x - 1, y - 1, s + 2, s + 2, s * 0.22); c.fill();
        c.fillStyle = F.horsB;
        rond(c, x + s * 0.3, y + s * 0.4, s * 0.12); c.fill(); rond(c, x + s * 0.68, y + s * 0.66, s * 0.09); c.fill();
        continue;
      }
      if (ch === '#') { // morceau d'épave
        c.fillStyle = '#6b4a2b'; rr(c, x + s * 0.06, y + s * 0.1, s * 0.88, s * 0.8, s * 0.1); c.fill();
        c.strokeStyle = '#3f2a16'; c.lineWidth = Math.max(1, s * 0.035);
        for (let k = 1; k < 3; k++) { c.beginPath(); c.moveTo(x + s * 0.08, y + s * (0.1 + k * 0.27)); c.lineTo(x + s * 0.92, y + s * (0.12 + k * 0.27)); c.stroke(); }
        rond(c, x + s * 0.5, y + s * 0.5, s * 0.15); c.fillStyle = '#c9a227'; c.fill();
        rond(c, x + s * 0.5, y + s * 0.5, s * 0.1); c.fillStyle = '#123a52'; c.fill();
        c.fillStyle = '#4f8f3a'; ell(c, x + s * 0.2, y + s * 0.85, s * 0.06, s * 0.16, 0.3); c.fill();
        continue;
      }
      c.fillStyle = '#ffffff10'; rr(c, x + s * 0.04, y + s * 0.04, s * 0.92, s * 0.92, s * 0.14); c.fill();
    }
    // courants : flèches sur leurs cases
    e.la.forEach((l) => {
      const sens = l.length > 1 && l[1] > l[0] ? 1 : -1;
      l.forEach((i, q) => {
        if (e.k[i] >= 0) return;
        const xy = caseXY(e, g, i), cx = xy[0] + s / 2, cy = xy[1] + s / 2, dec = ((t / 1400 + q * 0.37) % 1 - 0.5) * s * 0.3;
        c.strokeStyle = '#bff3ff70'; c.lineWidth = Math.max(1.5, s * 0.06); c.lineCap = 'round'; c.lineJoin = 'round';
        c.beginPath(); c.moveTo(cx + dec - sens * s * 0.12, cy - s * 0.14); c.lineTo(cx + dec + sens * s * 0.08, cy); c.lineTo(cx + dec - sens * s * 0.12, cy + s * 0.14); c.stroke();
      });
    });
    // perles
    e.pe.forEach((i) => {
      if (e.k[i] >= 0) return;
      const xy = caseXY(e, g, i), cx = xy[0] + s / 2, cy = xy[1] + s * 0.56;
      c.fillStyle = '#c9c3d9'; ell(c, cx, cy + s * 0.08, s * 0.3, s * 0.14); c.fill();
      c.fillStyle = '#e9e4f5'; c.beginPath(); c.ellipse(cx, cy, s * 0.3, s * 0.2, 0, Math.PI, Math.PI * 2); c.fill();
      c.save(); c.shadowColor = '#fff'; c.shadowBlur = s * 0.2 * (1 + 0.3 * Math.sin(t / 300));
      rond(c, cx, cy + s * 0.02, s * 0.1); c.fillStyle = '#fffdf6'; c.fill(); c.restore();
    });
    // zones fermées : fond pastel de la couleur de qui les a fermées
    for (let i = 0; i < e.k.length; i++) {
      if (e.zf[i] < 0) continue;
      const xy = caseXY(e, g, i), a0 = anims.zones[i];
      c.fillStyle = COUL[e.zf[i]] + '55';
      rr(c, xy[0] + 1, xy[1] + 1, s - 2, s - 2, s * 0.18); c.fill();
      if (a0 !== undefined && t - a0 < 1400) {
        const k = (t - a0) / 1400;
        c.save(); c.globalAlpha = 1 - k; c.strokeStyle = '#fff9c4'; c.lineWidth = s * 0.12 * (1 - k) + 1;
        rr(c, xy[0] - k * s * 0.15, xy[1] - k * s * 0.15, s + k * s * 0.3, s + k * s * 0.3, s * 0.2); c.stroke(); c.restore();
      }
    }
    // tuiles
    const nuit = !!e.nuit;
    for (let i = 0; i < e.k.length; i++) {
      const u = e.k[i];
      if (u < 0) continue;
      const xy = caseXY(e, g, i), a0 = anims.poses[i];
      let k = 1;
      if (a0 !== undefined && t - a0 < 380) { const q = (t - a0) / 380; k = 1.25 - 0.25 * q + Math.sin(q * Math.PI) * 0.08; }
      c.save();
      if (k !== 1) { c.translate(xy[0] + s / 2, xy[1] + s / 2); c.scale(k, k); c.translate(-(xy[0] + s / 2), -(xy[1] + s / 2)); }
      dessinerTuile(c, u, xy[0], xy[1], s, { style: st, t: t });
      c.restore();
      if (e.zf[i] >= 0) {
        c.strokeStyle = COUL[e.zf[i]]; c.lineWidth = Math.max(2, s * 0.06);
        rr(c, xy[0] + s * 0.06, xy[1] + s * 0.06, s * 0.88, s * 0.88, s * 0.16); c.stroke();
      }
    }
    // nuit : tout s'assombrit, seules les anémones brillent
    if (nuit) {
      c.fillStyle = '#030a24a8';
      rr(c, L, T, LW, LH, s * 0.4); c.fill();
      for (let i = 0; i < e.k.length; i++) {
        const u = e.k[i];
        if (u < 0 || (u >> 4) !== 2) continue;
        const xy = caseXY(e, g, i);
        dessinerTuile(c, u, xy[0], xy[1], s, { style: st, t: t, lueur: true });
      }
    }
    // tuiles à la dérive
    e.dr.forEach((d) => { const xy = caseXY(e, g, e.la[d.l][d.i]); dessinerDerive(c, xy[0], xy[1], s, t); });
    // étoiles de mer qui gardent un coin
    e.et.forEach((i, p) => { if (i >= 0) { const xy = caseXY(e, g, i); etoileMer(c, xy[0] + s / 2, xy[1] + s / 2, s * 0.32, COUL[p], Math.sin(t / 800) * 0.2); } });
    // poissons installés
    e.po.forEach((f, q) => {
      const xy = caseXY(e, g, f.c), a0 = anims.poissons[q];
      let x = xy[0] + s / 2, y = xy[1] + s / 2 + Math.sin(t / 520 + q) * s * 0.06, dir = Math.sin(t / 2600 + q * 1.3) > 0 ? 1 : -1;
      if (a0 !== undefined && t - a0 < 1100) {
        const k = Math.max(0, (t - a0) / 1100), e2 = 1 - Math.pow(1 - k, 3);
        x = x + (1 - e2) * s * 3.2; y = y - (1 - e2) * s * 1.2; dir = -1;
      }
      c.save(); c.globalAlpha = 0.95;
      poisson(c, f.sp, x + (q % 2 ? s * 0.08 : -s * 0.08), y, s * 0.62, t + q * 300, dir);
      c.restore();
    });
    // aides au choix : cases possibles, case visée, étoile, fantôme de la tuile
    const pulse = 0.5 + 0.5 * Math.sin(t / 260);
    if (opt.legaux) opt.legaux.forEach((i) => {
      const xy = caseXY(e, g, i);
      c.fillStyle = 'rgba(255,255,255,' + (0.16 + 0.16 * pulse).toFixed(3) + ')';
      rr(c, xy[0] + s * 0.08, xy[1] + s * 0.08, s * 0.84, s * 0.84, s * 0.16); c.fill();
      c.strokeStyle = '#ffffffb0'; c.lineWidth = Math.max(1.5, s * 0.04); c.setLineDash([s * 0.12, s * 0.08]);
      c.stroke(); c.setLineDash([]);
    });
    if (opt.etoiles) opt.etoiles.forEach((i) => {
      const xy = caseXY(e, g, i);
      c.strokeStyle = 'rgba(255,215,64,' + (0.5 + 0.4 * pulse).toFixed(3) + ')'; c.lineWidth = Math.max(2, s * 0.06);
      rond(c, xy[0] + s / 2, xy[1] + s / 2, s * 0.36); c.stroke();
    });
    if (opt.survol >= 0) {
      const xy = caseXY(e, g, opt.survol);
      c.strokeStyle = '#ffffffd0'; c.lineWidth = Math.max(2, s * 0.05);
      rr(c, xy[0] + s * 0.05, xy[1] + s * 0.05, s * 0.9, s * 0.9, s * 0.16); c.stroke();
    }
    if (opt.etoileChoix >= 0) {
      const xy = caseXY(e, g, opt.etoileChoix);
      c.save(); c.globalAlpha = 0.7 + 0.3 * pulse; etoileMer(c, xy[0] + s / 2, xy[1] + s / 2, s * 0.32, COUL[opt.couleur >= 0 ? opt.couleur : 0], 0); c.restore();
    }
    if (opt.fantome) {
      const xy = caseXY(e, g, opt.fantome.c);
      dessinerTuile(c, opt.fantome.t, xy[0], xy[1], s, { style: st, t: t, alpha: 0.88, lueur: nuit && (opt.fantome.t >> 4) === 2 });
      c.strokeStyle = 'rgba(255,224,90,' + (0.6 + 0.4 * pulse).toFixed(3) + ')'; c.lineWidth = Math.max(3, s * 0.08);
      rr(c, xy[0] + 1, xy[1] + 1, s - 2, s - 2, s * 0.18); c.stroke();
    }
    if (opt.curseur >= 0) {
      const xy = caseXY(e, g, opt.curseur);
      c.strokeStyle = '#ffd23f'; c.lineWidth = Math.max(3, s * 0.07); c.setLineDash([s * 0.18, s * 0.1]);
      rr(c, xy[0] + s * 0.03, xy[1] + s * 0.03, s * 0.94, s * 0.94, s * 0.16); c.stroke(); c.setLineDash([]);
    }
  }

  // ---------------------------------------------------------------------
  //  Décor de l'écran titre (sert aussi de jaquette) : récif, poissons, bâtisseurs
  // ---------------------------------------------------------------------

  // Petit récif du titre : un anneau de corail fermé, des éponges et des anémones.
  const RECIF_TITRE = [[6, 10, 12, 48], [3, 10, 9, 36], [18, 26, 24, 33]];
  const POISSONS_TITRE = [
    { sp: 0, y: 0.3, v: 0.05, k: 0.09, d: 1 }, { sp: 2, y: 0.55, v: 0.035, k: 0.08, d: -1 }, { sp: 11, y: 0.22, v: 0.03, k: 0.1, d: -1 },
    { sp: 4, y: 0.62, v: 0.06, k: 0.06, d: 1 }, { sp: 9, y: 0.4, v: 0.045, k: 0.085, d: 1 }
  ];

  function dessinerFond(t) {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const gr = c.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#6fd6f7'); gr.addColorStop(0.45, '#1f93c8'); gr.addColorStop(1, '#0a4a74');
    c.fillStyle = gr; c.fillRect(0, 0, w, h);
    // rayons de soleil
    c.save(); c.globalAlpha = 0.12; c.fillStyle = '#ffffff';
    for (let i = 0; i < 5; i++) {
      const x0 = w * (0.1 + i * 0.22) + Math.sin(t / 3000 + i) * 20;
      c.beginPath(); c.moveTo(x0 - 20, 0); c.lineTo(x0 + 30, 0); c.lineTo(x0 + 120, h * 0.85); c.lineTo(x0 + 30, h * 0.85); c.closePath(); c.fill();
    }
    c.restore();
    // sable
    const ys = h * 0.8;
    c.fillStyle = '#f1d79a';
    c.beginPath(); c.moveTo(0, ys);
    for (let x = 0; x <= w; x += 20) c.lineTo(x, ys + Math.sin(x / 70) * 8);
    c.lineTo(w, h); c.lineTo(0, h); c.closePath(); c.fill();
    c.fillStyle = '#d9b979';
    for (let i = 0; i < 14; i++) { rond(c, (i * 97) % w, ys + 20 + (i * 53) % Math.max(10, h - ys - 20), 3); c.fill(); }
    // algues qui ondulent
    const algue = (x, hh, coul) => {
      c.strokeStyle = coul; c.lineWidth = 7; c.lineCap = 'round';
      c.beginPath(); c.moveTo(x, ys + 10);
      for (let k = 1; k <= 6; k++) c.lineTo(x + Math.sin(t / 700 + k * 0.8 + x) * 8 * k / 3, ys + 10 - hh * k / 6);
      c.stroke();
    };
    [0.06, 0.1, 0.9, 0.95, 0.85].forEach((k, i) => algue(w * k, h * (0.18 + (i % 3) * 0.05), i % 2 ? '#2f9e5a' : '#4fbf6f'));
    // récif de tuiles, au milieu de l'écran
    const s = Math.min(w * 0.145, h * 0.085, 76);
    const rx = w / 2 - s * 2, ry = h * 0.44 - s * 1.5;
    c.fillStyle = '#0b4f7a55'; ell(c, w / 2, ry + s * 3.1, s * 2.6, s * 0.35); c.fill();
    RECIF_TITRE.forEach((ligne, y) => ligne.forEach((code, x) => dessinerTuile(c, code, rx + x * s, ry + y * s, s, { style: prog.style, t: t })));
    c.strokeStyle = COUL[0]; c.lineWidth = 3;
    poisson(c, 7, rx + s * 1.5, ry + s * 0.95 + Math.sin(t / 500) * 3, s * 0.9, t, 1);
    poisson(c, 4, rx + s * 3.5, ry + s * 1.95 + Math.sin(t / 450) * 3, s * 0.55, t, -1);
    poisson(c, 3, rx + s * 1.5, ry + s * 2.55 + Math.sin(t / 600) * 3, s * 0.5, t, 1);
    // poissons qui passent
    POISSONS_TITRE.forEach((p, i) => {
      const larg = w + 160, x = ((t * p.v + i * 270) % larg) - 80;
      poisson(c, p.sp, p.d > 0 ? x : w - x, h * p.y + Math.sin(t / 700 + i) * 10, Math.max(36, w * p.k), t + i * 100, p.d);
    });
    // les 4 bâtisseurs autour du récif
    const r = s * 0.44;
    [[rx - r * 1.2, ry + s * 0.6], [rx + s * 4 + r * 1.2, ry + s * 0.6], [rx - r * 1.2, ry + s * 2.4], [rx + s * 4 + r * 1.2, ry + s * 2.4]].forEach((p, k) => {
      medaillon(c, k, p[0], p[1] + Math.sin(t / 800 + k) * 3, r);
    });
    // bulles
    c.strokeStyle = '#ffffffaa'; c.lineWidth = 1.5;
    for (let i = 0; i < 18; i++) {
      const x = (i * 131) % w + Math.sin(t / 600 + i) * 6, y = h - ((t * (0.02 + (i % 5) * 0.008) + i * 97) % (h + 40));
      rond(c, x, y, 3 + (i % 4) * 2); c.stroke();
    }
  }

  // Animation douce de l'écran titre, des niveaux et de l'album.
  let fondId = 0;
  function animerFond() {
    if (fondId) return;
    const pas = (t) => {
      fondId = 0;
      if (ecran === 'jeu') return;
      dessinerFond(t);

    };

  }

  // ---------------------------------------------------------------------
  //  État de l'écran
  // ---------------------------------------------------------------------

  let ecran = 'titre';
  let partie = null;          // partie JEL_MULTI en cours
  let session = null;         // 'solo' (niveaux) ou 'ligne' (avec d'autres joueurs)

  let vue = null;             // état affiché (copie)
  let anims = { poses: {}, zones: {}, poissons: {} };
  let particules = [];
  let flottants = [];
  let geo = null;
  let jeton = 0;
  let debutTour = 0, dernierTic = -1, dernierAttends = 0, dernierNon = 0;
  let humainsAvant = null;
  let finManche = 0;
  // choix du joueur : case, rotation possible choisie, étoile de mer
  const sel = { c: -1, ri: 0, s: -1 };
  let rotPref = 0;
  let modeEtoile = false;
  let possibles = new Map();  // case → rotations possibles de la tuile courante
  let clavier = false, curseur = -1, survol = -1;

  // Le rôle d'une place : toi, un vrai joueur ou un robot.
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  const monSiege = () => (partie ? partie.siege : -1);
  const monTour = () => !!(partie && vue && !enPause && !attenteTuto && partie.monTour());

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && e.t >= 0 ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const pts = e ? e.sc[s] : 0, fi = e ? e.fi[s] : 0;
      d.querySelector('.pts').textContent = nb(pts);
      d.querySelector('.fi').textContent = '🐠 ' + nb(fi);
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria.' + role, { animal: tr('animal.' + s), points: pts, poissons: fi }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || e.t < 0) return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) {
      if (modeEtoile) return tr('etoile.mode');
      return sel.c >= 0 ? tr('tour.tourne') : tr('tour.toi');
    }
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.' + s);
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length, lagon: tr('lagon.' + Math.floor((niveau - 1) / 5)) });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
    $('ecran-jeu').classList.toggle('nuit', !!(vue && vue.nuit));
  }

  // Poissons exigeants visibles (et la nuit) au-dessus du lagon.
  function majDemandes() {
    const boite = $('demandes');
    const e = vue;
    const cle = e ? JSON.stringify([e.ex, e.nuit]) : '';
    if (boite.dataset.cle === cle) return;
    boite.dataset.cle = cle;
    boite.textContent = '';
    if (!e) return;
    e.ex.forEach((p) => {
      const d = document.createElement('div');
      d.className = 'demande';
      const cv = document.createElement('canvas'); cv.width = 80; cv.height = 52;
      poisson(cv.getContext('2d'), 9 + p, 40, 26, 54, 0, 1);
      d.appendChild(cv);
      O.PAIRES[p].forEach((k) => { const i = document.createElement('i'); i.style.background = TEINTES[k].c; d.appendChild(i); });
      d.setAttribute('role', 'img');
      d.setAttribute('aria-label', tr('ex.aria', { poisson: tr('poisson.' + (9 + p)), a: tr('couleur.' + O.PAIRES[p][0]), b: tr('couleur.' + O.PAIRES[p][1]) }));
      boite.appendChild(d);
    });
    if (e.nuit) {
      const n = document.createElement('span');
      n.className = 'puce-nuit';
      n.textContent = tr('nuit.puce');
      boite.appendChild(n);
    }
  }

  // Poses possibles de la tuile courante pour le joueur de l'appareil.
  function calculerPossibles() {
    possibles = new Map();
    const e = vue, moi = monSiege();
    if (!e || e.t < 0 || moi < 0) return;
    O.poses(e, moi, e.t).forEach((p) => {
      if (!possibles.has(p.c)) possibles.set(p.c, []);
      possibles.get(p.c).push(p.r);
    });
  }

  function viderChoix() { sel.c = -1; sel.ri = 0; sel.s = -1; modeEtoile = false; }

  function tuileChoisie() {
    if (!vue || vue.t < 0) return -1;
    if (sel.c >= 0 && possibles.has(sel.c)) return O.tuile(vue.t, possibles.get(sel.c)[sel.ri]);
    return O.tuile(vue.t, rotPref);
  }

  // Panneau du bas : tuile à poser, Tourner, étoile de mer, Poser, pioche.
  function majPanneau() {
    const e = vue, cv = $('apercu'), c = cv.getContext('2d'), moi = monSiege();
    c.clearRect(0, 0, 112, 112);
    const toi = monTour();
    let qui = '';
    if (e && e.t >= 0 && partie && partie.phase === 'jeu') {
      const s = R.aQui(e);
      const code = s === moi ? tuileChoisie() : e.t;
      dessinerTuile(c, code, 6, 6, 100, { style: prog.style });
      if (s === moi) qui = tr('tuile.toi');
      else { const nom = (siegesActuels()[s] || {}).nom; qui = tr('tuile.de', { animal: nom || tr('animal.' + s) }); }
    }
    $('apercu-qui').textContent = qui;
    $('boite-tuile').classList.toggle('attend', !toi);
    $('btn-poser').disabled = !(toi && sel.c >= 0);
    $('btn-tourner').disabled = !(e && e.t >= 0 && toi);
    const etoiles = e && moi >= 0 ? e.es[moi] : 0;
    const be = $('btn-etoile');
    be.hidden = !(e && moi >= 0 && (etoiles > 0 || sel.s >= 0));
    be.disabled = !toi;
    be.classList.toggle('actif', modeEtoile || sel.s >= 0);
    be.querySelector('b').textContent = nb(Math.max(0, etoiles - (sel.s >= 0 ? 1 : 0)));
    $('pioche').textContent = e && e.t >= 0 && partie && partie.phase === 'jeu' ? tr('jeu.pioche', { n: e.sac.length + 1 }) : '';
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majDemandes();
    majPanneau();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && e.t >= 0) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  // Cases où l'étoile de mer peut garder un coin.
  function casesEtoile() {
    const e = vue, moi = monSiege(), l = [];
    if (!e || moi < 0) return l;
    for (let i = 0; i < e.k.length; i++) if (i !== sel.c && O.libre(e, i, moi) && O.contre(e, i, sel.c)) l.push(i);
    return l;
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    geo = geometrie(vue, w, h, Math.max(8, Math.min(w, h) * 0.02));
    const toi = monTour();
    dessinerPlateau(c, vue, geo, {
      t: t, anims: anims, style: prog.style, couleur: monSiege(),
      legaux: toi && !modeEtoile ? Array.from(possibles.keys()) : null,
      etoiles: toi && modeEtoile ? casesEtoile() : null,
      fantome: toi && sel.c >= 0 ? { c: sel.c, t: tuileChoisie() } : null,
      etoileChoix: toi ? sel.s : -1,
      survol: toi ? survol : -1,
      curseur: clavier && toi ? curseur : -1
    });
    // particules (bulles, étoiles)
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.bulle ? -60 : 300) * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      if (p.bulle) { c.strokeStyle = '#ffffffd0'; c.lineWidth = 1.5; rond(c, p.x, p.y, p.k); c.stroke(); }
      else { c.fillStyle = p.coul; rond(c, p.x, p.y, p.k * 0.5); c.fill(); }
      c.globalAlpha = 1;
    }
    // points qui s'envolent
    for (let i = flottants.length - 1; i >= 0; i--) {
      const f = flottants[i], k = (t - f.t0) / 1300;
      if (k >= 1) { flottants.splice(i, 1); continue; }
      const xy = caseXY(vue, geo, f.c);
      c.save(); c.globalAlpha = 1 - k * k;
      c.font = '900 ' + Math.round(geo.s * 0.42) + 'px system-ui, sans-serif'; c.textAlign = 'center';
      c.lineWidth = 4; c.strokeStyle = '#0b2c45'; c.fillStyle = f.coul;
      const y = xy[1] + geo.s * 0.3 - k * geo.s * 0.9;
      c.strokeText(f.txt, xy[0] + geo.s / 2, y); c.fillText(f.txt, xy[0] + geo.s / 2, y);
      c.restore();
    }
  }

  function jaillir(i, coul, bulles) {
    if (!vue || !geo) return;
    const xy = caseXY(vue, geo, i), x = xy[0] + geo.s / 2, y = xy[1] + geo.s / 2;
    for (let k = 0; k < 16; k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 150;
      const bulle = bulles && k % 2 === 0;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (bulle ? 40 : 120), vie: 0.7 + Math.random() * 0.5, k: geo.s * (0.06 + Math.random() * 0.08), coul: k % 3 ? coul : '#ffe066', bulle: bulle });
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    calculerPossibles();
    if (sel.c >= 0 && !possibles.has(sel.c)) viderChoix();
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function nouvelleVue(etat) {
    vue = etat ? JSON.parse(JSON.stringify(etat)) : null;
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    nouvelleVue(partie.etat);
    anims = { poses: {}, zones: {}, poissons: {} };
    viderChoix();
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44);
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { animal: tr('animal.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { animal: nomChef ? nomChef + ' · ' + tr('animal.' + partie.chef) : tr('animal.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    nouvelleVue(partie.etat);
    anims = { poses: {}, zones: {}, poissons: {} };
    particules.length = 0;
    flottants.length = 0;
    viderChoix();
    debutTour = Date.now();
    dernierTic = -1;
    curseur = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surAction(ev) {
    const t = performance.now();
    const avant = ev.avant;
    nouvelleVue(ev.apres);
    const dc = vue.dc || {};
    anims.poses[dc.c] = t;
    debutTour = Date.now();
    dernierTic = -1;
    viderChoix();
    sons.pose();
    jaillir(dc.c, TEINTES[(dc.t || 0) >> 4].c, true);
    let bondir = false;
    if (dc.z && dc.z.length) {
      bondir = true;
      dc.z.forEach((i) => { anims.zones[i] = t; });
      for (let q = avant.po.length; q < vue.po.length; q++) anims.poissons[q] = t + (q - avant.po.length) * 350;
      flottants.push({ c: vue.po[avant.po.length] ? vue.po[avant.po.length].c : dc.c, txt: tr('pts.plus', { n: dc.pts }), coul: '#fff59d', t0: t });
      sons.ferme(); sons.poisson();
      dc.z.forEach((i, k) => { if (k < 4) jaillir(i, COUL[dc.p], true); });
      if (dc.ex && dc.ex.length) {
        sons.exigeant();
        dc.ex.forEach((sp, k) => flottants.push({ c: vue.po[avant.po.length + 1 + k] ? vue.po[avant.po.length + 1 + k].c : dc.c, txt: tr('pts.plus', { n: 3 }), coul: '#ffd23f', t0: t + 350 }));
        const nom = ev.moi ? '' : ((siegesActuels()[dc.p] || {}).nom || tr('animal.' + dc.p));
        toast(ev.moi ? tr('ex.toi') : tr('ex.autre', { animal: nom }));
      }
    }
    if (dc.perle) { bondir = true; sons.perle(); flottants.push({ c: dc.c, txt: tr('pts.plus', { n: 1 }), coul: '#ffffff', t0: t + 150 }); }
    if (dc.s >= 0) sons.etoile();
    if (dc.derive) setTimeout(() => sons.courant(), 250);
    if (dc.jet > 0) toast(tr('tuile.ecartee', { n: dc.jet }), 2200);
    if (bondir) {
      const carte = $('place-' + ev.siege);
      carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
    }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && vue.t >= 0 && R.aQui(vue) === partie.siege && !ev.moi) sons.tour();
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1200);
  }

  // Espèces accueillies par le joueur dans cette manche : ajoutées à l'album.
  function remplirAlbum(e, moi) {
    let nouvelles = 0;
    if (moi < 0 || !e) return 0;
    e.po.forEach((f) => { if (f.p === moi && f.sp >= 0 && f.sp < NB_ESPECES && !prog.album[f.sp]) { prog.album[f.sp] = 1; nouvelles++; } });
    return nouvelles;
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = moi >= 0 && e.sc[moi] === Math.max.apply(null, e.sc);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    if (remplirAlbum(e, moi)) sauverReglages();
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  // Étoiles selon les poissons accueillis : 1 pour une victoire, 2 avec 35 % des
  // poissons de la manche, 3 avec 50 %.
  function etoilesPour(fi, total, gagne) {
    if (!gagne) return 0;
    const p = total ? fi / total : 0;
    return p >= 0.5 ? 3 : p >= 0.35 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const f = R.fin(e);
    const ordre = f ? f.classement : [0, 1, 2, 3];
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      if (e.sc[s] !== prec) { rang = k + 1; prec = e.sc[s]; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64; medaillon(cv.getContext('2d'), s, 32, 32, 30);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('animal.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.ligne', { n: e.sc[s], f: e.fi[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.sc[moi] : 0, fi = moi >= 0 ? e.fi[moi] : 0;
    const totalFi = e.fi.reduce((a, b) => a + b, 0);
    const gagne = moi >= 0 && pts === Math.max.apply(null, e.sc);
    const egalite = gagne && e.sc.filter((x) => x === pts).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.points', { n: pts, poissons: fi, total: totalFi }) : '';
    const etoilesAvant = totalEtoiles();
    const nouvelles = remplirAlbum(e, moi);
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(fi, totalFi, gagne);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else sauver(niveau, pts);
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      const coraux = SEUILS_CORAUX.filter((x) => x > etoilesAvant && x <= totalEtoiles()).length;
      $('fin-album').textContent = [nouvelles ? tr('fin.especes', { n: nouvelles }) : '', coraux ? tr('fin.corail') : ''].filter(Boolean).join(' ');
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      if (nouvelles) sauverReglages();
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      $('fin-album').textContent = nouvelles ? tr('fin.especes', { n: nouvelles }) : '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (partie en ligne repassée en solo).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Confettis de victoire (bulles et paillettes).
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    const coul = COUL.concat(TEINTES.slice(0, 3).map((x) => x.c));
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: coul[i % coul.length], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux, album
  // ---------------------------------------------------------------------

  let attenteTuto = false;

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    viderChoix();
    bandeau('');
    fermerVoile('voile-pause');
    fermerVoile('voile-fin');
    fermerVoile('voile-tuto');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  function apercu(n) {
    const e = O.preparer(NIVEAUX[n - 1], PLACES, null);
    e.n = n - 1;
    e.lag = Math.floor((n - 1) / 5);
    return e;
  }

  // Parcours solo : niveau n contre 3 robots (force croissante, donnée par le niveau).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = apercu(niveau);
    anims = { poses: {}, zones: {}, poissons: {} };
    particules.length = 0;
    flottants.length = 0;
    viderChoix();
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const boite = $('grille-niveaux');
    boite.textContent = '';
    for (let l = 0; l < 4; l++) {
      const titre = document.createElement('p'); titre.className = 'lagon-titre';
      titre.textContent = tr('lagon.' + l);
      const grille = document.createElement('div'); grille.className = 'grille';
      for (let i = l * 5; i < l * 5 + 5 && i < NIVEAUX.length; i++) {
        const n = i + 1, ouvert = n <= prog.debloque;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
        const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
        const et = document.createElement('small');
        for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
        b.append(num, et);
        b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
        if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
        else b.disabled = true;
        grille.appendChild(b);
      }
      boite.append(titre, grille);
    }
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
  }

  function ouvrirAlbum() {
    const g = $('grille-album');
    g.textContent = '';
    for (let sp = 0; sp < NB_ESPECES; sp++) {
      const connu = !!prog.album[sp];
      const d = document.createElement('div');
      d.className = 'espece' + (connu ? '' : ' inconnue');
      const cv = document.createElement('canvas'); cv.width = 152; cv.height = 100;
      const c = cv.getContext('2d');
      poisson(c, sp, 76, 52, 92, 0, 1);
      if (!connu) { c.globalCompositeOperation = 'source-atop'; c.fillStyle = '#2b4a5e'; c.fillRect(0, 0, 152, 100); }
      const nom = document.createElement('span');
      nom.textContent = connu ? tr('poisson.' + sp) : tr('album.inconnu');
      d.append(cv, nom);
      g.appendChild(d);
    }
    $('album-aide').textContent = tr('album.especes', { n: nbEspeces(), max: NB_ESPECES });
    const gc = $('grille-coraux');
    gc.textContent = '';
    const total = totalEtoiles();
    for (let k = 0; k < 4; k++) {
      const ouvert = total >= SEUILS_CORAUX[k];
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'corail-btn' + (prog.style === k ? ' choisi' : '');
      const cv = document.createElement('canvas'); cv.width = 108; cv.height = 108;
      dessinerTuile(cv.getContext('2d'), k === 3 ? 39 : k === 2 ? 23 : 7, 4, 4, 100, { style: k });
      const txt = document.createElement('span');
      txt.textContent = tr('corail.' + k);
      const sous = document.createElement('small');
      sous.textContent = !ouvert ? tr('corail.ferme', { n: SEUILS_CORAUX[k] }) : (prog.style === k ? tr('corail.actif') : tr('corail.choisir'));
      txt.appendChild(sous);
      b.append(cv, txt);
      b.setAttribute('aria-pressed', prog.style === k ? 'true' : 'false');
      if (ouvert) b.addEventListener('click', () => { audio(); sons.etoile(); prog.style = k; sauverReglages(); ouvrirAlbum(); });
      else b.disabled = true;
      gc.appendChild(b);
    }
    afficherEcran('album');
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
    majInterface();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés : lagon miniature, la main montre le geste
  // ---------------------------------------------------------------------

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const base = () => {
      const e = O.preparer({ g: d.g, nuit: d.nuit, dr: d.dr }, PLACES, null);
      e.lag = Math.floor((niveau - 1) / 5);
      d.pre.forEach((p) => { const i = p[1] * e.W + p[0]; e.k[i] = p[2]; e.ow[i] = 1; });
      if (d.ex) { e.ex = d.ex.slice(); e.exn = d.ex.length; }
      return e;
    };
    let e = base(), debut = 0, fait = 0, an = { poses: {}, zones: {}, poissons: {} }, fl = [];
    const PAS = 2100, j = ++tutoAnim;
    const g = geometrie(e, 560, 360, 50);
    const centreCase = (xy) => { const i = xy[1] * e.W + xy[0], p = caseXY(e, g, i); return [p[0] + g.s / 2, p[1] + g.s / 2, i]; };
    function appliquer(et, t) {
      if (et.derive) { O.deriver(e); return; }
      if (et.etoile) { const q = centreCase(et.etoile); e.et[et.p] = q[2]; return; }
      const q = centreCase(et.c), avantPo = e.po.length;
      e.t = et.t; e.tour = et.p;
      R.jouer(e, et.p, { c: q[2], r: et.r });
      e.coups = 1;
      an.poses[q[2]] = t;
      if (e.dc && e.dc.z.length) {
        e.dc.z.forEach((i) => { an.zones[i] = t; });
        for (let k = avantPo; k < e.po.length; k++) an.poissons[k] = t + (k - avantPo) * 300;
        fl.push({ c: q[2], txt: tr('pts.plus', { n: e.dc.pts + 3 * e.dc.ex.length }), t0: t });
      }
      if (e.dc && e.dc.perle && !e.dc.z.length) fl.push({ c: q[2], txt: tr('pts.plus', { n: 1 }), t0: t });
    }
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ecoule = t - debut;
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      if (k >= d.etapes.length + 1) { e = base(); fait = 0; an = { poses: {}, zones: {}, poissons: {} }; fl = []; debut = t; }
      const et = fait < d.etapes.length && k === fait ? d.etapes[fait] : null;
      const joueur = et && !et.derive && et.p === 0;
      const moment = et ? (et.derive ? 700 : et.etoile ? 900 : joueur ? 1500 : 600) : 0;
      if (et && dans >= moment) { appliquer(et, t); fait++; }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 360);
      const opt = { t: t, anims: an, style: prog.style, couleur: 0, etoileChoix: -1, survol: -1, curseur: -1 };
      // pendant le geste du joueur : case visée, puis tuile fantôme
      if (et && joueur && !et.etoile && fait === k) {
        const q = centreCase(et.c);
        if (dans > 650) opt.fantome = { c: q[2], t: O.tuile(et.t, et.r) };
        else opt.legaux = [q[2]];
      }
      dessinerPlateau(c, e, g, opt);
      // carte du poisson exigeant
      if (e.ex.length) {
        c.fillStyle = '#effbffe6'; rr(c, 452, 10, 100, 44, 12); c.fill(); c.strokeStyle = '#ffb52e'; c.lineWidth = 3; c.stroke();
        poisson(c, 9 + e.ex[0], 482, 32, 44, t, 1);
        O.PAIRES[e.ex[0]].forEach((kk, q) => { rond(c, 520 + q * 18, 32, 7); c.fillStyle = TEINTES[kk].c; c.fill(); });
      }
      // points
      fl.forEach((f) => {
        const kk = (t - f.t0) / 1300;
        if (kk < 0 || kk >= 1) return;
        const p = caseXY(e, g, f.c);
        c.save(); c.globalAlpha = 1 - kk * kk; c.font = '900 30px system-ui, sans-serif'; c.textAlign = 'center';
        c.lineWidth = 4; c.strokeStyle = '#0b2c45'; c.fillStyle = '#fff59d';
        c.strokeText(f.txt, p[0] + g.s / 2, p[1] + g.s * 0.2 - kk * 50); c.fillText(f.txt, p[0] + g.s / 2, p[1] + g.s * 0.2 - kk * 50);
        c.restore();
      });
      // la main
      if (et && joueur && fait === k) {
        const q = centreCase(et.etoile || et.c);
        const ok = [q[0] + g.s * 0.75, q[1] - g.s * 0.75];
        if (et.etoile) {
          const avance = Math.min(1, dans / 700);
          main(c, 500 + (q[0] - 500) * avance, 340 + (q[1] - 340) * avance, 1.3, dans > 700 ? Math.min(1, (dans - 700) / 150) : 0);
        } else {
          if (dans > 650) coche(c, ok[0], ok[1], 22, dans > 1350 ? 1 : 0);
          if (dans <= 650) {
            const a = dans / 650;
            main(c, 500 + (q[0] - 500) * a, 340 + (q[1] - 340) * a, 1.3, 0);
          } else if (dans <= 800) main(c, q[0], q[1], 1.3, (dans - 650) / 150);
          else {
            const a = Math.min(1, (dans - 800) / 500);
            main(c, q[0] + (ok[0] - q[0]) * a, q[1] + (ok[1] - q[1]) * a, 1.3, dans > 1350 ? Math.min(1, (dans - 1350) / 150) : 0);
          }
        }
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function caseSous(px, py) {
    if (!vue || !geo) return -1;
    const x = Math.floor((px - geo.ox) / geo.s), y = Math.floor((py - geo.oy) / geo.s);
    if (x < 0 || y < 0 || x >= vue.W || y >= vue.H) return -1;
    return y * vue.W + x;
  }

  function refuser(cle) {
    if (Date.now() - dernierNon < 900) return;
    dernierNon = Date.now();
    toast(tr(cle), 1500);
    sons.non();
  }

  function tourner() {
    audio();
    if (!vue || vue.t < 0) return;
    if (sel.c >= 0 && possibles.has(sel.c)) {
      const rots = possibles.get(sel.c);
      if (rots.length < 2) { refuser('tour.uneSeule'); return; }
      sel.ri = (sel.ri + 1) % rots.length;
      rotPref = rots[sel.ri];
    } else rotPref = (rotPref + 1) % 4;
    sons.tourne();
    majInterface();
  }

  function choisirCase(i) {
    if (!partie || enPause || attenteTuto || i < 0 || !vue) return;
    if (!monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (modeEtoile) {
      if (casesEtoile().indexOf(i) >= 0) { sel.s = i; modeEtoile = false; sons.etoile(); }
      else refuser('etoile.pas');
      majInterface();
      return;
    }
    if (possibles.has(i)) {
      if (sel.c === i) { tourner(); return; }
      sel.c = i;
      const rots = possibles.get(i);
      sel.ri = Math.max(0, rots.indexOf(rotPref));
      if (sel.s === i) sel.s = -1;
      sons.clic();
    } else if (vue.g.charAt(i) === '.' && vue.k[i] < 0) refuser(O.libre(vue, i, monSiege()) ? 'case.non' : 'case.prise');
    majInterface();
  }

  function basculerEtoile() {
    audio();
    if (!monTour()) return;
    if (sel.s >= 0) { sel.s = -1; modeEtoile = false; sons.clic(); }
    else if (vue.es[monSiege()] > 0) { modeEtoile = !modeEtoile; sons.clic(); }
    majInterface();
  }

  function poser() {
    audio();
    if (!monTour() || sel.c < 0 || !possibles.has(sel.c)) return;
    const action = { c: sel.c, r: possibles.get(sel.c)[sel.ri] };
    if (sel.s >= 0 && sel.s !== sel.c) action.s = sel.s;
    if (!R.valide(JSON.parse(JSON.stringify(vue)), monSiege(), action)) delete action.s;
    if (partie.jouer(action)) { viderChoix(); survol = -1; majInterface(); }
  }

  function deplacerCurseur(dx, dy) {
    if (!vue) return;
    if (curseur < 0) { curseur = possibles.size ? Array.from(possibles.keys())[0] : Math.floor(vue.H / 2) * vue.W + Math.floor(vue.W / 2); return; }
    let x = curseur % vue.W + dx, y = Math.floor(curseur / vue.W) + dy;
    x = Math.max(0, Math.min(vue.W - 1, x)); y = Math.max(0, Math.min(vue.H - 1, y));
    curseur = y * vue.W + x;
    sons.clic();
  }

  const plateau = $('plateau');
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  plateau.addEventListener('pointerdown', (ev) => {
    audio();
    clavier = false;
    const p = point(ev);
    survol = caseSous(p[0], p[1]);
  });
  plateau.addEventListener('pointermove', (ev) => {
    if (ev.pointerType !== 'mouse') return;
    const p = point(ev), i = caseSous(p[0], p[1]);
    survol = vue && i >= 0 && (possibles.has(i) || modeEtoile) ? i : -1;
  });
  plateau.addEventListener('pointerup', (ev) => {
    const p = point(ev);
    if (ev.pointerType !== 'mouse') survol = -1;
    choisirCase(caseSous(p[0], p[1]));
  });
  plateau.addEventListener('pointercancel', () => { survol = -1; });
  plateau.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') survol = -1; });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) {
      ev.preventDefault(); audio();
      clavier = true;
      deplacerCurseur(dirs[ev.code][0], dirs[ev.code][1]);
    } else if (ev.code === 'KeyR') { ev.preventDefault(); clavier = true; tourner(); }
    else if (ev.code === 'KeyE') { ev.preventDefault(); basculerEtoile(); }
    else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (!clavier || curseur < 0) { clavier = true; deplacerCurseur(0, 0); return; }
      if (ev.code !== 'Space' && sel.c >= 0 && sel.c === curseur && !modeEtoile) poser();
      else choisirCase(curseur);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-album').addEventListener('click', () => { audio(); sons.clic(); ouvrirAlbum(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('album-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-tourner').addEventListener('click', tourner);
  $('btn-etoile').addEventListener('click', basculerEtoile);
  $('btn-poser').addEventListener('click', poser);
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerFond(performance.now()); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
