<script>
(function () {
  'use strict';

  // =====================================================================
  //  Les récifs des petits bâtisseurs — jeu de pose de tuiles sous la mer
  //  On pose à tour de rôle des tuiles de corail contre le récif ; qui
  //  ferme une zone de couleur y accueille un poisson. Solo : 20 niveaux
  //  contre 3 robots. En ligne : de vrais joueurs remplacent les robots
  //  (moteur commun JEL_MULTI). Les règles sont dans le bloc jel-regles.
  // =====================================================================

  const JEU = 'recifs-des-petits-batisseurs';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = R.niveaux;                // mêmes données que les règles
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);
  const DX = O.DX, DY = O.DY;

  // Une couleur et un animal par place : 0 crabe, 1 tortue, 2 dauphin, 3 loutre.
  const COUL = ['#e4572e', '#1e9e57', '#2f6fe0', '#9a6233'];
  const COUL_F = ['#8f2a10', '#0c5a30', '#163d8f', '#5a3510'];
  // Couleurs des bords de tuile.
  const TEINTE = { j: '#ffd34d', v: '#b48cff', s: '#efdfb2' };
  const TEINTE_F = { r: '#b8443c', j: '#b88a0c', v: '#6a3fc2', s: '#c4a76a' };
  // Les 6 coraux de l'album (couleur du corail rose et forme du dessin).
  const CORAUX = [
    { seuil: 0, c: '#ff8f86' }, { seuil: 10, c: '#ff9a6b' }, { seuil: 20, c: '#ff7fb0' },
    { seuil: 30, c: '#ff8c5a' }, { seuil: 45, c: '#f79ac0' }, { seuil: 60, c: '#ff6b5e' }
  ];
  const NB_ESPECES = 12;
  // Les 4 lagons : eaux claires, grotte, épave, grand large.
  const LAGONS = [
    { haut: '#6fd8ea', bas: '#1d93b6', eau: '#9ddfeb', eau2: '#8ad3e2', trait: '#5fb9cc' },
    { haut: '#2b8590', bas: '#0d3d49', eau: '#4f8f97', eau2: '#45838b', trait: '#2f6c74' },
    { haut: '#3a6fa3', bas: '#14345a', eau: '#6f93b8', eau2: '#6588ae', trait: '#46698f' },
    { haut: '#1d4f92', bas: '#081d42', eau: '#3e64a0', eau2: '#375b94', trait: '#27497c' }
  ];

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#fff"/><circle cx="10.4" cy="8" r="1.6" fill="#fff"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#fff"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';
  const ICONE_POISSON = '<svg viewBox="0 0 20 14" aria-hidden="true"><path d="M2 7c3-5 9-6 13 0-4 6-10 5-13 0z" fill="#ff8a3d"/><path d="M14 7l5-4v8z" fill="#ff8a3d"/><circle cx="6" cy="6" r="1.2" fill="#12324a"/></svg>';

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = {
    etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, tutos: [],
    album: Array.from({ length: NB_ESPECES }, () => false), corail: 0, options: { son: true }
  };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 999, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string' && TUTOS[x]);
      if (Array.isArray(d.album)) prog.album = prog.album.map((_, i) => d.album[i] === true);
      prog.corail = entier(d.corail, 0, CORAUX.length - 1, 0);
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try {
      const s = localStorage.getItem(JEU + '-son');
      if (s === '0' || s === '1') prog.options.son = s === '1';
      const a = JSON.parse(localStorage.getItem(JEU + '-album') || 'null');
      if (Array.isArray(a)) prog.album = prog.album.map((x, i) => x || a[i] === true);
    } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
    if (totalEtoiles() < CORAUX[prog.corail].seuil) prog.corail = 0;
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.album = prog.album.map(() => false);
    prog.corail = 0;
    try { localStorage.removeItem(JEU + '-album'); } catch (e) { /* rien */ }
  }

  function sauver(niveauReprise, score) {
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
        debloque: prog.debloque, tutos: prog.tutos.slice(), album: prog.album.slice(), corail: prog.corail,
        options: { son: prog.options.son }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Son, album et corail se règlent aussi hors d'une partie solo : jamais de nouvelle sauvegarde là.
  function sauverReglages() {
    try {
      localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0');
      localStorage.setItem(JEU + '-album', JSON.stringify(prog.album));
    } catch (e) { /* stockage refusé */ }
    try {
      if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: prog.options.son }, album: prog.album.slice(), corail: prog.corail });
    } catch (e) { /* rien */ }
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      const v = o.vol || 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.025, d / 4));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      osc.connect(g); sortie.connect(ac.destination);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  // Bruit doux (souffle du courant).
  function souffle(d, vol) {
    if (!ac || !prog.options.son) return;
    try {
      const n = Math.floor(ac.sampleRate * d), buf = ac.createBuffer(1, n, ac.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n);
      const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = buf; fl.type = 'lowpass'; fl.frequency.value = 700; g.gain.value = vol || 0.08;
      src.connect(fl); fl.connect(g); g.connect(ac.destination); src.start();
    } catch (e) { /* rien */ }
  }
  const sons = {
    clic: () => note(660, 0.06, { type: 'triangle', vol: 0.07 }),
    tourne: () => { note(420, 0.07, { vol: 0.08, vers: 620 }); note(700, 0.05, { vol: 0.04, retard: 0.05 }); },
    pose: () => { note(180, 0.1, { type: 'triangle', vol: 0.13, vers: 110 }); note(520, 0.05, { vol: 0.04, retard: 0.03 }); },
    non: () => note(160, 0.16, { type: 'triangle', vol: 0.08, vers: 120 }),
    ferme: () => [523, 659, 784].forEach((f, i) => note(f, 0.14, { type: 'triangle', vol: 0.09, retard: i * 0.07 })),
    poisson: () => [700, 900, 1150, 1400].forEach((f, i) => note(f, 0.09, { vol: 0.06, vers: f * 1.25, retard: 0.2 + i * 0.06 })),
    large: () => [900, 700, 520].forEach((f, i) => note(f, 0.12, { vol: 0.05, retard: i * 0.08 })),
    exigeant: () => [784, 988, 1175, 1568].forEach((f, i) => note(f, 0.18, { type: 'triangle', vol: 0.08, retard: 0.3 + i * 0.09 })),
    courant: () => souffle(0.6, 0.07),
    etoile: () => { note(1320, 0.12, { vol: 0.06 }); note(1760, 0.2, { vol: 0.05, retard: 0.08 }); },
    victoire: () => [523, 659, 784, 1047].forEach((f, i) => note(f, 0.26, { type: 'triangle', vol: 0.11, retard: i * 0.13 })),
    defaite: () => [392, 330, 262].forEach((f, i) => note(f, 0.3, { vol: 0.11, retard: i * 0.18 })),
    tic: () => note(1250, 0.04, { type: 'square', vol: 0.035 }),
    arrive: () => { note(660, 0.12, { vol: 0.09 }); note(880, 0.16, { vol: 0.09, retard: 0.1 }); },
    part: () => { note(880, 0.12, { vol: 0.07 }); note(587, 0.16, { vol: 0.07, retard: 0.1 }); },
    tour: () => note(988, 0.1, { vol: 0.06 })
  };

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.textContent = prog.options.son ? '🔊' : '🔇';
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    sauverReglages();
    majBoutonsSon();
    sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Dessins (canvas) : outils, animaux, poissons, tuiles
  // ---------------------------------------------------------------------

  function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }
  function rond(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r);
    else { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  }
  function oeil(c, x, y, r) {
    c.fillStyle = '#fff'; rond(c, x, y, r); c.fill();
    c.fillStyle = '#1b1b1b'; rond(c, x + r * 0.15, y + r * 0.1, r * 0.58); c.fill();
    c.fillStyle = '#fff'; rond(c, x + r * 0.35, y - r * 0.18, r * 0.22); c.fill();
  }
  function graineHasard(g) { let a = g >>> 0; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; }
  function etincelle(c, x, y, k) {
    c.beginPath(); c.moveTo(x, y - k); c.quadraticCurveTo(x, y, x + k, y); c.quadraticCurveTo(x, y, x, y + k); c.quadraticCurveTo(x, y, x - k, y); c.quadraticCurveTo(x, y, x, y - k); c.fill();
  }
  function etoileDeMer(c, x, y, r, coul, angle) {
    c.save(); c.translate(x, y); c.rotate(angle || 0);
    c.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 5, rr2 = k % 2 ? r * 0.42 : r;
      if (k === 0) c.moveTo(Math.cos(a) * rr2, Math.sin(a) * rr2); else c.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2);
    }
    c.closePath();
    c.fillStyle = coul; c.fill();
    c.lineJoin = 'round'; c.lineWidth = Math.max(1, r * 0.12); c.strokeStyle = 'rgba(0,0,0,.35)'; c.stroke();
    c.fillStyle = 'rgba(255,255,255,.55)';
    for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + k * Math.PI * 2 / 5; rond(c, Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5, r * 0.08); c.fill(); }
    c.restore();
  }

  // Visage d'un animal (place k), centré en (x, y), rayon r (dessiné dans une boîte de 100).
  function visage(c, k, x, y, r) {
    c.save(); c.translate(x, y); c.scale(r / 50, r / 50);
    c.lineWidth = 3; c.lineJoin = 'round'; c.lineCap = 'round';
    if (k === 0) { // crabe : yeux sur tiges, pinces levées
      c.fillStyle = '#ff6a3d'; c.strokeStyle = '#9c2c0e';
      [[-1, 1], [1, -1]].forEach((s) => {
        c.save(); c.scale(s[0], 1);
        ell(c, -34, -26, 13, 10, -0.6); c.fill(); c.stroke();
        c.fillStyle = '#ffe0d2'; c.beginPath(); c.moveTo(-34, -26); c.lineTo(-44, -36); c.lineTo(-30, -34); c.closePath(); c.fill();
        c.fillStyle = '#ff6a3d';
        c.restore();
      });
      c.beginPath(); c.moveTo(-10, -10); c.lineTo(-12, -30); c.moveTo(10, -10); c.lineTo(12, -30); c.stroke();
      ell(c, 0, 10, 34, 24); c.fill(); c.stroke();
      oeil(c, -12, -32, 7); oeil(c, 12, -32, 7);
      c.strokeStyle = '#7a1d05'; c.beginPath(); c.arc(0, 12, 9, 0.2, Math.PI - 0.2); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.35)'; ell(c, -12, 2, 8, 4, -0.3); c.fill();
    } else if (k === 1) { // tortue : tête verte, carapace derrière
      c.fillStyle = '#7a5a2a'; c.strokeStyle = '#4a3410'; ell(c, 0, 18, 42, 26); c.fill(); c.stroke();
      c.strokeStyle = '#c8a45a'; c.lineWidth = 2.5;
      for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(i * 22 - 8, 10); c.lineTo(i * 22 + 8, 10); c.lineTo(i * 22 + 12, 24); c.lineTo(i * 22 - 12, 24); c.closePath(); c.stroke(); }
      c.lineWidth = 3;
      c.fillStyle = '#6cc46a'; c.strokeStyle = '#2f7a2c'; ell(c, 0, -8, 27, 25); c.fill(); c.stroke();
      oeil(c, -10, -12, 6); oeil(c, 10, -12, 6);
      c.strokeStyle = '#1f5a1c'; c.beginPath(); c.arc(0, -2, 8, 0.3, Math.PI - 0.3); c.stroke();
      c.fillStyle = 'rgba(255,140,140,.5)'; rond(c, -18, -1, 4); c.fill(); rond(c, 18, -1, 4); c.fill();
    } else if (k === 2) { // dauphin : tête arrondie, rostre et sourire
      c.fillStyle = '#7fb3e8'; c.strokeStyle = '#2f5f99';
      c.beginPath(); c.moveTo(0, -46); c.quadraticCurveTo(12, -40, 8, -28); c.lineTo(-6, -30); c.closePath(); c.fill(); c.stroke();
      ell(c, 0, -2, 34, 32); c.fill(); c.stroke();
      c.fillStyle = '#d9ecff'; ell(c, 0, 20, 24, 14); c.fill();
      c.fillStyle = '#7fb3e8'; ell(c, 0, 22, 14, 9); c.fill(); c.stroke();
      oeil(c, -14, -8, 6); oeil(c, 14, -8, 6);
      c.strokeStyle = '#1f3f6f'; c.beginPath(); c.arc(0, 22, 10, 0.25, Math.PI - 0.25); c.stroke();
      c.fillStyle = '#fff'; rond(c, 12, -30, 3); c.fill();
    } else { // loutre : brune, museau clair, moustaches
      c.fillStyle = '#9a6233'; c.strokeStyle = '#5a3510';
      rond(c, -30, -26, 9); c.fill(); c.stroke(); rond(c, 30, -26, 9); c.fill(); c.stroke();
      ell(c, 0, 0, 38, 34); c.fill(); c.stroke();
      c.fillStyle = '#f2d9b8'; ell(c, 0, 14, 22, 15); c.fill();
      oeil(c, -14, -8, 6); oeil(c, 14, -8, 6);
      c.fillStyle = '#3a2210'; ell(c, 0, 6, 7, 5); c.fill();
      c.strokeStyle = '#3a2210'; c.lineWidth = 2;
      [[-1], [1]].forEach((s) => { for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(s[0] * 10, 12 + i * 3); c.lineTo(s[0] * 32, 9 + i * 6); c.stroke(); } });
      c.lineWidth = 3; c.beginPath(); c.arc(0, 14, 5, 0.3, Math.PI - 0.3); c.stroke();
    }
    c.restore();
  }

  // Médaillon : disque de la couleur de la place + visage de l'animal.
  function medaillon(c, k, x, y, r) {
    c.fillStyle = COUL[k]; rond(c, x, y, r); c.fill();
    c.fillStyle = 'rgba(255,255,255,.85)'; rond(c, x, y, r * 0.86); c.fill();
    c.lineWidth = Math.max(1.5, r * 0.1); c.strokeStyle = COUL[k]; rond(c, x, y, r * 0.86); c.stroke();
    visage(c, k, x, y + r * 0.04, r * 0.66);
  }

  // Couronne dorée du chef du salon (le premier joueur arrivé), base centrée en (x, y).
  function couronne(c, x, y, k) {
    c.save(); c.translate(x, y); c.scale(k / 22, k / 22);
    c.fillStyle = '#ffc21a'; c.strokeStyle = '#7a4f00'; c.lineWidth = 2.5; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-20, 0); c.lineTo(-23, -22); c.lineTo(-10, -10); c.lineTo(0, -26); c.lineTo(10, -10); c.lineTo(23, -22); c.lineTo(20, 0); c.closePath();
    c.fill(); c.stroke();
    c.fillStyle = '#fff3a8'; c.fillRect(-17, -6, 34, 3);
    c.fillStyle = '#e23b2e'; rond(c, 0, -10, 3.5); c.fill();
    c.fillStyle = '#2f6fe0'; rond(c, -12, -8, 2.6); c.fill(); rond(c, 12, -8, 2.6); c.fill();
    c.restore();
  }

  // Les 12 espèces : couleurs du corps, de la queue et des motifs ; taille ; forme.
  const ESPECES = [
    { corps: '#ff9fb2', queue: '#f07a92', motif: 'points', l: 1.25, h: 0.5 },          // gobie rose
    { corps: '#ff7a1a', queue: '#e85d00', motif: 'bandes', l: 1.05, h: 0.62 },         // poisson-clown
    { corps: '#3ec6a8', queue: '#ff6fa8', motif: 'perroquet', l: 1.2, h: 0.62 },       // poisson-perroquet
    { corps: '#ffd21f', queue: '#f0b400', motif: 'rien', l: 0.95, h: 0.68 },           // demoiselle jaune
    { corps: '#ffe14d', queue: '#ffe14d', motif: 'papillon', l: 0.9, h: 0.86 },        // poisson-papillon
    { corps: '#ffcc00', queue: '#ffcc00', motif: 'chirurgien', l: 1.1, h: 0.72 },      // poisson-chirurgien
    { corps: '#a64dff', queue: '#ffd21f', motif: 'gramma', l: 1.1, h: 0.55 },          // gramma
    { corps: '#5b6cff', queue: '#ffd21f', motif: 'ange', l: 0.95, h: 0.95 },           // poisson-ange
    { corps: '#2fa3a0', queue: '#1f7c7a', motif: 'napoleon', l: 1.3, h: 0.72 },        // napoléon
    { forme: 'hippocampe', corps: '#ff9a3c' },                                          // hippocampe
    { forme: 'raie', corps: '#7b9fc4' },                                                // raie
    { forme: 'pieuvre', corps: '#e05a7a' }                                              // pieuvre
  ];

  // Un poisson centré en (x, y), longueur k, tourné vers la droite (sens -1 : vers la gauche).
  function poisson(c, sp, x, y, k, t, sens, ombre) {
    const E = ESPECES[sp] || ESPECES[0];
    c.save(); c.translate(x, y); c.scale((sens || 1) * k / 100, k / 100);
    const nage = Math.sin((t || 0) / 180 + sp) * 6;
    c.lineWidth = 3; c.lineJoin = 'round'; c.lineCap = 'round';
    if (ombre) { c.fillStyle = ombre; c.strokeStyle = ombre; }
    if (E.forme === 'hippocampe') {
      if (!ombre) { c.fillStyle = E.corps; c.strokeStyle = '#a3520f'; }
      c.beginPath(); c.moveTo(-6, -40); c.quadraticCurveTo(26, -44, 18, -18); c.quadraticCurveTo(10, 0, 16, 18);
      c.quadraticCurveTo(22, 40, 2, 44); c.quadraticCurveTo(-12, 44, -8, 32); c.quadraticCurveTo(4, 36, 4, 24);
      c.quadraticCurveTo(-8, 4, -2, -16); c.quadraticCurveTo(-20, -18, -6, -40); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(14, -32); c.lineTo(42, -28 + nage * 0.3); c.lineTo(40, -20); c.lineTo(16, -24); c.closePath(); c.fill(); c.stroke();
      if (!ombre) { oeil(c, 6, -30, 6); c.fillStyle = '#ffd08a'; for (let i = 0; i < 4; i++) { rond(c, 12, -6 + i * 10, 3); c.fill(); } }
    } else if (E.forme === 'raie') {
      if (!ombre) { c.fillStyle = E.corps; c.strokeStyle = '#3d5f82'; }
      c.beginPath(); c.moveTo(-40, nage); c.quadraticCurveTo(-10, -30, 20, -4); c.quadraticCurveTo(-10, 26, -40, nage); c.closePath();
      c.moveTo(-6, -2); c.quadraticCurveTo(-2, -46 - nage, 18, -40); c.quadraticCurveTo(26, -18, 20, -4); c.closePath();
      c.moveTo(-6, 2); c.quadraticCurveTo(-2, 46 + nage, 18, 40); c.quadraticCurveTo(26, 18, 20, 4); c.closePath();
      c.fill(); c.stroke();
      c.beginPath(); c.moveTo(-36, nage); c.quadraticCurveTo(-56, nage * 1.5, -70, -4); c.stroke();
      if (!ombre) { c.fillStyle = '#c8daec'; for (let i = 0; i < 5; i++) { rond(c, -8 + i * 5, -16 + (i % 2) * 30, 2.5); c.fill(); } oeil(c, 12, -8, 4.5); oeil(c, 12, 8, 4.5); }
    } else if (E.forme === 'pieuvre') {
      if (!ombre) { c.fillStyle = E.corps; c.strokeStyle = '#8f2742'; }
      for (let i = 0; i < 6; i++) {
        const bx = -24 + i * 9.6, ph = (t || 0) / 200 + i;
        c.beginPath(); c.moveTo(bx, 6); c.quadraticCurveTo(bx + Math.sin(ph) * 12, 30, bx + Math.sin(ph + 1) * 10, 44);
        c.lineWidth = 9; c.stroke(); c.lineWidth = 6; c.strokeStyle = ombre || E.corps; c.stroke(); c.strokeStyle = ombre || '#8f2742'; c.lineWidth = 3;
      }
      ell(c, 0, -10, 30, 30); c.fill(); c.stroke();
      if (!ombre) { oeil(c, -10, -6, 7); oeil(c, 10, -6, 7); c.fillStyle = '#ffb3c4'; rond(c, -10, -26, 4); c.fill(); rond(c, 8, -30, 3); c.fill(); }
    } else {
      const L = 48 * E.l, H = 40 * E.h;
      if (!ombre) { c.fillStyle = E.queue; c.strokeStyle = 'rgba(0,0,0,.35)'; }
      c.beginPath(); c.moveTo(-L * 0.8, 0); c.lineTo(-L * 1.25, -H * 0.7 + nage); c.lineTo(-L * 1.2, H * 0.7 + nage); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(-L * 0.2, -H * 0.85); c.quadraticCurveTo(L * 0.1, -H * 1.35, L * 0.35, -H * 0.8); c.closePath(); c.fill(); c.stroke();
      if (!ombre) c.fillStyle = E.corps;
      ell(c, 0, 0, L, H); c.fill(); c.stroke();
      if (!ombre) {
        c.save(); ell(c, 0, 0, L, H); c.clip();
        if (E.motif === 'bandes') {
          [-0.45, 0.05, 0.55].forEach((p) => { c.fillStyle = '#fff'; c.fillRect(L * p - 7, -H, 14, H * 2); c.strokeStyle = '#1b1b1b'; c.lineWidth = 2; c.strokeRect(L * p - 7, -H - 2, 14, H * 2 + 4); });
        } else if (E.motif === 'points') {
          c.fillStyle = '#ffffffaa'; for (let i = 0; i < 6; i++) { rond(c, -L * 0.6 + i * L * 0.25, (i % 2 ? -1 : 1) * H * 0.3, 4); c.fill(); }
        } else if (E.motif === 'perroquet') {
          c.fillStyle = '#ff6fa8'; ell(c, L * 0.7, 0, L * 0.45, H); c.fill();
          c.strokeStyle = '#1f8f78'; c.lineWidth = 2; for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(-L * 0.4 + i * L * 0.25, 0, H * 0.6, -1, 1); c.stroke(); }
        } else if (E.motif === 'papillon') {
          c.fillStyle = '#1b1b1b'; c.fillRect(L * 0.38, -H, 10, H * 2);
          c.strokeStyle = '#d9a400'; c.lineWidth = 2; for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(-L + i * L * 0.35, -H); c.lineTo(-L * 0.5 + i * L * 0.35, H); c.stroke(); }
          c.fillStyle = '#1b1b1b'; rond(c, -L * 0.55, -H * 0.3, 6); c.fill();
        } else if (E.motif === 'chirurgien') {
          c.fillStyle = '#fff'; ell(c, -L * 0.72, 0, 6, 3); c.fill();
        } else if (E.motif === 'gramma') {
          c.fillStyle = '#ffd21f'; c.fillRect(-L, -H, L * 0.9, H * 2);
        } else if (E.motif === 'ange') {
          c.strokeStyle = '#ffd21f'; c.lineWidth = 3; for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(L * 0.9, 0, H * 0.5 + i * 12, Math.PI * 0.6, Math.PI * 1.4); c.stroke(); }
        } else if (E.motif === 'napoleon') {
          c.fillStyle = '#1f7c7a'; ell(c, L * 0.4, -H * 0.85, L * 0.45, H * 0.4); c.fill();
          c.strokeStyle = '#7fd6cf'; c.lineWidth = 1.5; for (let i = 0; i < 6; i++) { c.beginPath(); c.moveTo(-L * 0.6 + i * L * 0.22, -H * 0.4); c.lineTo(-L * 0.5 + i * L * 0.22, H * 0.4); c.stroke(); }
        }
        c.restore();
        c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 3; ell(c, 0, 0, L, H); c.stroke();
        oeil(c, L * 0.55, -H * 0.18, Math.max(5, H * 0.2));
        c.strokeStyle = 'rgba(0,0,0,.55)'; c.lineWidth = 2.5; c.beginPath(); c.arc(L * 0.82, H * 0.2, 5, 0.3, 1.8); c.stroke();
      }
    }
    c.restore();
  }

  // Petit dessin dans un quart de tuile (couleur ch), au point (x, y), tourné vers le centre.
  function motif(c, ch, x, y, k, d, skin, cache) {
    c.save(); c.translate(x, y); c.rotate(d * Math.PI / 2); c.scale(k / 20, k / 20);
    c.lineCap = 'round'; c.lineJoin = 'round';
    if (cache) {
      c.fillStyle = 'rgba(160,190,255,.12)'; rond(c, 0, 2, 3); c.fill();
    } else if (ch === 'r') {
      c.strokeStyle = '#b8443c'; c.fillStyle = '#ffd0c8'; c.lineWidth = 3;
      if (skin === 1) { // corail cerveau
        c.fillStyle = '#e8706a'; ell(c, 0, 2, 13, 10); c.fill();
        c.strokeStyle = '#ffd0c8'; c.lineWidth = 2; c.beginPath(); c.moveTo(-9, 2); c.bezierCurveTo(-5, -6, -2, 10, 2, 0); c.bezierCurveTo(5, -6, 7, 8, 10, 2); c.stroke();
      } else if (skin === 2) { // éventail
        c.strokeStyle = '#c24d7a'; c.lineWidth = 2;
        for (let i = -3; i <= 3; i++) { c.beginPath(); c.moveTo(0, -10); c.lineTo(i * 4.5, 12); c.stroke(); }
        c.beginPath(); c.arc(0, -10, 22, Math.PI * 0.32, Math.PI * 0.68); c.stroke();
      } else if (skin === 3) { // tubes
        c.fillStyle = '#ff7a3d'; c.strokeStyle = '#a8461a'; c.lineWidth = 2;
        [[-7, 6], [0, 10], [7, 5]].forEach((p) => { rr(c, p[0] - 3, -8, 6, p[1] + 8, 3); c.fill(); c.stroke(); c.fillStyle = '#5a1d08'; ell(c, p[0], p[1], 2.4, 1.4); c.fill(); c.fillStyle = '#ff7a3d'; });
      } else if (skin === 4) { // corail table
        c.fillStyle = '#e07aa0'; c.strokeStyle = '#a3456a'; c.lineWidth = 2;
        c.fillRect(-1.5, -8, 3, 10); ell(c, 0, 6, 13, 5); c.fill(); c.stroke();
      } else if (skin === 5) { // corail de feu
        c.fillStyle = '#ff5a3a'; c.strokeStyle = '#a3220a'; c.lineWidth = 1.6;
        c.beginPath(); c.moveTo(-10, -8); c.lineTo(-6, 10); c.lineTo(-2, 0); c.lineTo(1, 13); c.lineTo(4, 1); c.lineTo(7, 9); c.lineTo(10, -8); c.closePath(); c.fill(); c.stroke();
      } else { // corail branchu
        c.beginPath(); c.moveTo(0, -10); c.lineTo(0, 2); c.lineTo(-7, 10); c.moveTo(0, 2); c.lineTo(7, 9); c.moveTo(0, -3); c.lineTo(-6, 3); c.moveTo(0, -1); c.lineTo(5, 3); c.stroke();
        [[-7, 10], [7, 9], [0, 2]].forEach((p) => { rond(c, p[0], p[1], 2.2); c.fill(); });
      }
    } else if (ch === 'j') { // éponge à trous
      c.fillStyle = '#ffe48a'; c.strokeStyle = '#b88a0c'; c.lineWidth = 2;
      rr(c, -9, -8, 18, 18, 7); c.fill(); c.stroke();
      c.fillStyle = '#c99a10'; [[-4, -3], [4, -1], [-2, 5], [5, 6]].forEach((p) => { ell(c, p[0], p[1], 2, 2.6); c.fill(); });
    } else if (ch === 'v') { // anémone et ses tentacules
      c.strokeStyle = '#7a4fd0'; c.lineWidth = 2.6;
      for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * 3, -6); c.quadraticCurveTo(i * 7 - 2, 2, i * 6, 11); c.stroke(); }
      c.fillStyle = '#e9d8ff'; for (let i = -2; i <= 2; i++) { rond(c, i * 6, 11, 2.4); c.fill(); }
      c.fillStyle = '#8a5ce0'; ell(c, 0, -7, 8, 4); c.fill();
    } else { // sable : petits galets
      c.fillStyle = '#d4bd84'; ell(c, -5, 2, 4, 3); c.fill(); c.fillStyle = '#c7ad70'; ell(c, 5, 6, 3, 2.2); c.fill();
      c.fillStyle = '#b9b2a6'; ell(c, 3, -4, 3.4, 2.6); c.fill();
    }
    c.restore();
  }

  function couleurBord(ch) { return ch === 'r' ? CORAUX[prog.corail].c : TEINTE[ch]; }

  // Une tuile t en (x, y), côté s. o : visibles (4 booléens, nuit), alpha, ferme (4 booléens).
  function dessinerTuile(c, t, x, y, s, o) {
    o = o || {};
    const vis = o.vis || [true, true, true, true];
    const cx = x + s / 2, cy = y + s / 2;
    const P = [[x, y], [x + s, y], [x + s, y + s], [x, y + s]];
    c.save();
    if (o.alpha !== undefined) c.globalAlpha = o.alpha;
    for (let d = 0; d < 4; d++) {
      const ch = t.charAt(d);
      c.beginPath(); c.moveTo(P[d][0], P[d][1]); c.lineTo(P[(d + 1) % 4][0], P[(d + 1) % 4][1]); c.lineTo(cx, cy); c.closePath();
      c.fillStyle = vis[d] ? couleurBord(ch) : '#1d2a4c';
      c.fill();
      c.strokeStyle = vis[d] ? couleurBord(ch) : '#1d2a4c'; c.lineWidth = 1; c.stroke();
    }
    // Couleur des bords opposés seulement : une bande les relie.
    for (let d = 0; d < 2; d++) {
      const ch = t.charAt(d);
      if (ch !== 's' && t.charAt(d + 2) === ch && t.charAt(d + 1) !== ch && t.charAt((d + 3) % 4) !== ch && vis[d] && vis[d + 2]) {
        c.fillStyle = couleurBord(ch);
        if (d === 0) c.fillRect(x + s * 0.3, y, s * 0.4, s); else c.fillRect(x, y + s * 0.3, s, s * 0.4);
      }
    }
    for (let d = 0; d < 4; d++) {
      const ch = t.charAt(d);
      const px = cx + DX[d] * s * 0.3, py = cy + DY[d] * s * 0.3;
      motif(c, ch, px, py, s * 0.19, d, prog.corail, !vis[d]);
    }
    if (o.ferme) {
      for (let d = 0; d < 4; d++) {
        if (!o.ferme[d] || t.charAt(d) === 's') continue;
        c.beginPath(); c.moveTo(P[d][0], P[d][1]); c.lineTo(P[(d + 1) % 4][0], P[(d + 1) % 4][1]); c.lineTo(cx, cy); c.closePath();
        c.fillStyle = 'rgba(255,255,255,.16)'; c.fill();
      }
    }
    c.strokeStyle = 'rgba(10,40,60,.45)'; c.lineWidth = Math.max(1, s * 0.03);
    c.strokeRect(x + 0.5, y + 0.5, s - 1, s - 1);
    c.restore();
  }

  // Épave : morceau de coque en bois couché sur le sable.
  function dessinerEpave(c, x, y, s, i) {
    const al = graineHasard(i * 53 + 7);
    c.save();
    c.fillStyle = 'rgba(0,0,0,.18)'; ell(c, x + s * 0.5, y + s * 0.78, s * 0.42, s * 0.1); c.fill();
    c.translate(x + s / 2, y + s / 2); c.rotate((al() - 0.5) * 0.6);
    c.fillStyle = '#7a5230'; c.strokeStyle = '#3e2610'; c.lineWidth = Math.max(1.5, s * 0.03);
    c.beginPath(); c.moveTo(-s * 0.42, -s * 0.1); c.quadraticCurveTo(0, s * 0.42, s * 0.42, -s * 0.1); c.lineTo(s * 0.36, -s * 0.22); c.lineTo(-s * 0.36, -s * 0.22); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = '#5a3a1c';
    for (let k = -1; k <= 1; k++) { c.beginPath(); c.moveTo(-s * 0.38, k * s * 0.07 - s * 0.05); c.lineTo(s * 0.38, k * s * 0.07 - s * 0.05); c.stroke(); }
    c.fillStyle = '#2a1a08'; rond(c, -s * 0.12, s * 0.04, s * 0.06); c.fill(); rond(c, s * 0.14, s * 0.03, s * 0.05); c.fill();
    c.strokeStyle = '#4a3010'; c.lineWidth = Math.max(2, s * 0.05);
    c.beginPath(); c.moveTo(s * 0.05, -s * 0.22); c.lineTo(s * 0.18, -s * 0.44); c.stroke();
    c.fillStyle = '#3d9a5a'; ell(c, -s * 0.3, -s * 0.2, s * 0.06, s * 0.12, 0.3); c.fill();
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Le lagon : fond, tuiles, poissons, courant (jeu, tutoriels, titre)
  // ---------------------------------------------------------------------

  function geometrie(e, w, h, marge) {
    const s = Math.min((w - 2 * marge) / e.W, (h - 2 * marge) / e.H, 96);
    return { s: s, ox: Math.round((w - s * e.W) / 2), oy: Math.round((h - s * e.H) / 2) };
  }

  // Une case est éclairée la nuit si elle ou une voisine porte une anémone.
  function eclairee(e, i) {
    if (O.estTuile(e.g[i]) && e.g[i].indexOf('v') >= 0) return true;
    for (let d = 0; d < 4; d++) { const n = O.voisin(e, i, d); if (n >= 0 && O.estTuile(e.g[n]) && e.g[n].indexOf('v') >= 0) return true; }
    return false;
  }

  // Partie fixe du lagon : eau, cases, épaves, tuiles posées (sauf celles qui tombent), étoiles de mer.
  function dessinerLagon(c, e, g, w, h, opt) {
    const L = LAGONS[e.l] || LAGONS[0], s = g.s, nuit = !!e.nuit;
    let gr = c.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, nuit ? '#0d2350' : L.haut); gr.addColorStop(1, nuit ? '#030a1e' : L.bas);
    c.fillStyle = gr; c.fillRect(0, 0, w, h);
    // décor du lagon autour du plateau
    const al = graineHasard(e.n * 31 + 3);
    if (e.l === 1) { // grotte : parois de roche
      c.fillStyle = 'rgba(10,30,36,.55)';
      c.beginPath(); c.moveTo(0, 0); for (let x = 0; x <= w; x += w / 8) c.lineTo(x, 12 + al() * 26); c.lineTo(w, 0); c.fill();
      c.beginPath(); c.moveTo(0, h); for (let x = 0; x <= w; x += w / 8) c.lineTo(x, h - 10 - al() * 22); c.lineTo(w, h); c.fill();
    } else if (e.l === 2) { // épave : mât couché au loin
      c.strokeStyle = 'rgba(20,30,50,.35)'; c.lineWidth = 8; c.beginPath(); c.moveTo(w * 0.05, h * 0.92); c.lineTo(w * 0.35, h * 0.7); c.stroke();
    } else if (e.l === 0) { // eaux claires : rayons de soleil
      c.fillStyle = 'rgba(255,255,255,.08)';
      for (let k = 0; k < 4; k++) { const x0 = w * (0.1 + k * 0.25); c.beginPath(); c.moveTo(x0, 0); c.lineTo(x0 + 40, 0); c.lineTo(x0 - 30, h); c.lineTo(x0 - 70, h); c.fill(); }
    }
    if (nuit) { c.fillStyle = 'rgba(200,220,255,.5)'; for (let k = 0; k < 30; k++) { rond(c, al() * w, al() * h, 1 + al() * 1.2); c.fill(); } }
    // ombre et cases du plateau
    c.fillStyle = 'rgba(0,0,0,.18)'; rr(c, g.ox + 4, g.oy + 6, s * e.W, s * e.H, 10); c.fill();
    for (let i = 0; i < e.W * e.H; i++) {
      const x = g.ox + (i % e.W) * s, y = g.oy + Math.floor(i / e.W) * s;
      c.fillStyle = nuit ? ((i + Math.floor(i / e.W)) % 2 ? '#142a55' : '#17305d') : ((i + Math.floor(i / e.W)) % 2 ? L.eau : L.eau2);

      if (v === '#') { dessinerEpave(c, x, y, s, i); continue; }
      if (!O.estTuile(v) || (opt.cacher && opt.cacher[i])) continue;
      const ferme = [0, 1, 2, 3].map((d) => e.zc[i * 4 + d] !== -1);
      let vis = null;
      if (nuit) {

        vis = [0, 1, 2, 3].map((d) => v.charAt(d) === 'v' || lum || ferme[d]);

      dessinerTuile(c, v, x, y, s, { vis: vis, ferme: ferme });

    if (nuit) { // lueur des anémones

      for (let i = 0; i < e.W * e.H; i++) {
        const v = e.g[i];

        const x = g.ox + (i % e.W + 0.5) * s, y = g.oy + (Math.floor(i / e.W) + 0.5) * s;
        const lu = c.createRadialGradient(x, y, s * 0.1, x, y, s * 1.2);

      etoileDeMer(c, x, y, s * 0.34, COUL[e.res[i]] || '#ff8a3d', 0.2);
    }
  }

  // Position (en cases) de chaque poisson : milieu de sa zone.
  function positionsPoissons(e) {
    const somme = e.pois.map(() => ({ x: 0, y: 0, n: 0 }));
    for (let k = 0; k < e.zc.length; k++) {
      const p = e.zc[k];
      if (p < 0 || !somme[p]) continue;
      const i = k >> 2, d = k & 3;
      somme[p].x += i % e.W + 0.5 + DX[d] * 0.28;
      somme[p].y += Math.floor(i / e.W) + 0.5 + DY[d] * 0.28;
      somme[p].n++;

    return somme.map((q) => (q.n ? { x: q.x / q.n, y: q.y / q.n } : null));
  }

  // Cases sur le chemin du courant (pour les flèches).
  function cheminCourant(e) {
    const l = [];
    const depart = e.d ? { i: e.d.i, dir: e.d.dir } : null;
    const sources = depart ? [depart] : [];
    if (e.nd > 0) e.src.forEach((s) => sources.push({ i: s.i, dir: s.d, source: true }));
    sources.forEach((s) => {
      let i = s.i, k = 0;
      if (s.source) l.push({ i: i, dir: s.dir });
      while (k++ < 12) {
        const n = O.voisin(e, i, s.dir);
        if (n < 0 || e.g[n] !== '') break;
        l.push({ i: n, dir: s.dir });
        i = n;
      }
    });
    return l;
  }

  // Partie animée : flèches du courant, tuile qui dérive, poissons, tuiles qui tombent.
  function dessinerVivant(c, e, g, t, opt) {
    const s = g.s;
    // flèches du courant
    cheminCourant(e).forEach((p, k) => {
      const x = g.ox + (p.i % e.W + 0.5) * s, y = g.oy + (Math.floor(p.i / e.W) + 0.5) * s;
      const a = 0.25 + 0.2 * Math.sin(t / 300 - k);
      c.save(); c.translate(x, y); c.rotate(p.dir * Math.PI / 2);
      c.strokeStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')'; c.lineWidth = Math.max(2, s * 0.05); c.lineCap = 'round';
      const dy = ((t / 600) % 1) * s * 0.2;
      c.beginPath(); c.moveTo(-s * 0.15, s * 0.05 - dy); c.lineTo(0, -s * 0.12 - dy); c.lineTo(s * 0.15, s * 0.05 - dy); c.stroke();
      c.restore();
    });
    // tuile qui dérive (glisse d'une case à l'autre)
    if (e.d) {
      let ci = e.d.i, px = ci % e.W, py = Math.floor(ci / e.W);
      const an = opt.derive;
      if (an && an.a === ci && t - an.t0 < 500) {
        const q = (t - an.t0) / 500, ease = 1 - Math.pow(1 - q, 3);
        px = an.de % e.W + (px - an.de % e.W) * ease; py = Math.floor(an.de / e.W) + (py - Math.floor(an.de / e.W)) * ease;
      }
      const x = g.ox + px * s, y = g.oy + py * s, bob = Math.sin(t / 260) * s * 0.03;
      c.save();
      c.fillStyle = 'rgba(255,255,255,.25)'; rr(c, x + 2, y + 2 + bob, s - 4, s - 4, s * 0.12); c.fill();
      dessinerTuile(c, e.d.t, x + s * 0.1, y + s * 0.1 + bob, s * 0.8, { alpha: 0.85, vis: e.nuit ? [false, false, false, false].map((_, d) => e.d.t.charAt(d) === 'v') : null });
      c.restore();
    }
    // tuiles qui tombent en place
    const anims = opt.anims || {};
    Object.keys(anims).forEach((k) => {
      const i = +k, t0 = anims[k], q = Math.min(1, (t - t0) / 260);
      if (!O.estTuile(e.g[i])) return;
      const z = 1 + 0.3 * (1 - q) * (1 - q), x = g.ox + (i % e.W + 0.5) * s, y = g.oy + (Math.floor(i / e.W) + 0.5) * s;
      const vis = e.nuit ? [0, 1, 2, 3].map((d) => e.g[i].charAt(d) === 'v' || eclairee(e, i) || e.zc[i * 4 + d] !== -1) : null;
      dessinerTuile(c, e.g[i], x - s * z / 2, y - s * z / 2, s * z, { vis: vis, ferme: [0, 1, 2, 3].map((d) => e.zc[i * 4 + d] !== -1), alpha: 0.4 + 0.6 * q });
    });
    // poissons installés dans leur zone
    const pos = opt.positions || positionsPoissons(e);
    e.pois.forEach((p, k) => {
      if (p.p < 0 || !pos[k]) return;
      const t0 = opt.naissances ? opt.naissances[k] : undefined;
      let z = 1;
      if (t0 !== undefined) { const q = Math.min(1, (t - t0) / 600); z = q < 1 ? Math.max(0.05, q * (1 + 0.4 * Math.sin(q * Math.PI))) : 1; }
      const taille = s * (p.sp >= 9 ? 0.62 : 0.42 + 0.12 * (p.sp % 3)) * z;
      const x = g.ox + pos[k].x * s + Math.sin(t / 900 + k) * s * 0.06, y = g.oy + pos[k].y * s + Math.cos(t / 700 + k) * s * 0.04;
      c.fillStyle = 'rgba(255,255,255,.55)'; rond(c, x, y, taille * 0.45); c.fill();
      c.strokeStyle = COUL[p.p]; c.lineWidth = Math.max(2, s * 0.05); rond(c, x, y, taille * 0.45); c.stroke();
      poisson(c, p.sp, x, y, taille * 0.62, t, Math.sin(t / 1800 + k) > 0 ? 1 : -1);
    });
  }

  // ---------------------------------------------------------------------
  //  Écran titre : un récif en construction, ses poissons et les 4 animaux
  // ---------------------------------------------------------------------

  const titreCache = document.createElement('canvas');
  let titreBulles = [];
  function preparerTitre() {
    const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    titreCache.width = Math.round(w * dpr); titreCache.height = Math.round(h * dpr);
    const c = titreCache.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const large = w > h * 1.05;
    let g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#7fe0f0'); g.addColorStop(0.45, '#2aa6c8'); g.addColorStop(1, '#0c4f72');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    // rayons de lumière
    c.fillStyle = 'rgba(255,255,255,.10)';
    for (let k = 0; k < 5; k++) { const x0 = w * (0.05 + k * 0.22); c.beginPath(); c.moveTo(x0, 0); c.lineTo(x0 + w * 0.08, 0); c.lineTo(x0 - w * 0.05, h * 0.8); c.lineTo(x0 - w * 0.16, h * 0.8); c.fill(); }
    // fond de sable
    const sol = h * (large ? 0.78 : 0.8);
    c.fillStyle = '#e6cf92';
    c.beginPath(); c.moveTo(0, sol); c.bezierCurveTo(w * 0.3, sol - 30, w * 0.6, sol + 20, w, sol - 14); c.lineTo(w, h); c.lineTo(0, h); c.fill();
    c.fillStyle = '#d6bb78';
    c.beginPath(); c.moveTo(0, sol + 30); c.bezierCurveTo(w * 0.4, sol + 10, w * 0.7, sol + 50, w, sol + 24); c.lineTo(w, h); c.lineTo(0, h); c.fill();
    // algues
    const al = graineHasard(9);
    for (let k = 0; k < 9; k++) {
      const x = al() * w, hh = 50 + al() * 90;
      c.strokeStyle = k % 2 ? '#2f9a5a' : '#3fb86c'; c.lineWidth = 6; c.lineCap = 'round';
      c.beginPath(); c.moveTo(x, sol + 20); c.bezierCurveTo(x - 18, sol - hh * 0.3, x + 18, sol - hh * 0.6, x - 4, sol - hh); c.stroke();
    }
    // le récif : un petit plateau de tuiles déjà posées, entre le titre et les boutons
    const haut = h * (large ? 0.3 : 0.26), bas = h * (large ? 0.63 : 0.62);
    const u = Math.min(w / (large ? 9 : 6.2), (bas - haut) / 3.4, 92);
    const motifRecif = [
      ['ssrr', 'srsr', 'sjsr', 'ssvj'],
      ['rrss', 'jsss', 'vvjs', 'svsv'],
      ['', 'jsjr', 'rvsj', 'vsss']
    ];
    const gw = 4 * u, gx = (w - gw) / 2, gy = (haut + bas) / 2 - u * 1.5;
    c.fillStyle = 'rgba(0,0,0,.18)'; rr(c, gx + 6, gy + 8, gw, u * 3, 12); c.fill();
    motifRecif.forEach((ligne, r) => ligne.forEach((t, col) => { if (t) dessinerTuile(c, t, gx + col * u, gy + r * u, u); }));
    // une tuile en route, tenue par le crabe
    dessinerTuile(c, 'rjsv', gx + u * 0.08, gy + u * 2.1, u * 0.84, { alpha: 0.95 });
    // poissons accueillis
    poisson(c, 1, gx + u * 1.1, gy + u * 0.72, u * 0.55, 0, 1);
    poisson(c, 7, gx + u * 3.2, gy + u * 1.45, u * 0.5, 0, -1);
    poisson(c, 9, gx + u * 2.4, gy - u * 0.35, u * 0.55, 0, 1);
    // les quatre bâtisseurs autour du récif
    const k0 = u * 0.5;
    medaillonLibre(c, 0, gx - u * 0.35, gy + u * 2.75, k0);
    medaillonLibre(c, 1, gx + gw + u * 0.35, gy + u * 2.3, k0);
    medaillonLibre(c, 2, gx - u * 0.45, gy + u * 0.2, k0);
    medaillonLibre(c, 3, gx + gw + u * 0.4, gy + u * 0.5, k0);
    // poissons au loin
    poisson(c, 4, w * 0.12, h * 0.24, u * 0.4, 0, 1);
    poisson(c, 0, w * 0.88, h * 0.22, u * 0.36, 0, -1);
    poisson(c, 10, w * 0.8, h * 0.68, u * 0.5, 0, -1);
    poisson(c, 3, w * 0.16, h * 0.7, u * 0.32, 0, 1);
    titreBulles = [];
    for (let k = 0; k < 18; k++) titreBulles.push({ x: al() * w, y: al() * h, v: 18 + al() * 30, r: 2 + al() * 5 });
  }
  function medaillonLibre(c, k, x, y, r) {
    c.fillStyle = 'rgba(255,255,255,.3)'; rond(c, x, y, r * 1.1); c.fill();
    visage(c, k, x, y, r);
  }
  let titreRaf = 0, titrePrec = 0;
  function animerTitre(t) {
    titreRaf = 0;
    if (ecran === 'jeu') return;
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== titreCache.width || cv.height !== titreCache.height) { cv.width = titreCache.width; cv.height = titreCache.height; }
    const c = cv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.drawImage(titreCache, 0, 0);
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const dt = Math.min(0.05, titrePrec ? (t - titrePrec) / 1000 : 0.016);
    titrePrec = t;
    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.5;
    titreBulles.forEach((b) => {
      b.y -= b.v * dt; if (b.y < -10) { b.y = h + 10; }
      rond(c, b.x + Math.sin(t / 700 + b.r) * 4, b.y, b.r); c.stroke();
    });
    titreRaf = requestAnimationFrame(animerTitre);
  }
  function dessinerTitre() {
    preparerTitre();
    if (!titreRaf) titreRaf = requestAnimationFrame(animerTitre);
  }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (parcours de 20 niveaux) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // partie solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)
  let geo = null;
  let attenteTuto = false;
  // La main : rotation choisie, case visée, mode « étoile de mer ».
  let rotation = 0, angle = 0, choix = -1, modeEtoile = false, clavier = false, curseur = -1;
  let anims = {}, naissances = {}, derive = null, positions = [];
  const particules = [];
  const vols = [];            // poissons qui nagent jusqu'à la carte de leur place
  let mainAffichee = null;

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'album', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom !== 'jeu') dessinerTitre();
    if (nom === 'titre') majTitre();
    if (nom === 'jeu') { cacheCle = ''; relancerBoucle(); }
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    el.classList.toggle('haut', salonOuvert() || $('voile-fin').classList.contains('actif'));
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  // Cartes des 4 places, en haut de l'écran.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'medaille'; cv.width = 96; cv.height = 96;
      medaillon(cv.getContext('2d'), s, 48, 48, 46);
      const ligne = document.createElement('span'); ligne.className = 'ligne-pts';
      const pts = document.createElement('span'); pts.className = 'pts';
      const pf = document.createElement('span'); pf.className = 'pf';
      ligne.append(pts, pf);
      const ets = document.createElement('span'); ets.className = 'ets';
      const tag = document.createElement('span'); tag.className = 'tag';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 26, 36, 24);
      d.append(cv, ligne, ets, tag, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 112; cv.height = 112;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  // Le rôle d'une place : toi, un vrai joueur ou un robot.
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  function moi() { return partie ? partie.siege : -1; }
  function monTour() { return !!(partie && vue && vue.main && partie.phase === 'jeu' && !attenteTuto && !enPause && partie.monTour()); }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && e.main && partie && partie.phase === 'jeu' && !attenteTuto ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const pts = e ? e.sc[s] : 0, pf = e ? e.pf[s] : 0;
      const ptsEl = d.querySelector('.pts');
      if (ptsEl.textContent !== nb(pts)) ptsEl.textContent = nb(pts);
      const pfEl = d.querySelector('.pf');
      if (pfEl.dataset.n !== String(pf)) { pfEl.dataset.n = String(pf); pfEl.innerHTML = ICONE_POISSON; const sp = document.createElement('span'); sp.textContent = nb(pf); pfEl.appendChild(sp); }
      const etsEl = d.querySelector('.ets'), et = e && e.et ? e.et[s] : 0;
      const texteEt = et > 0 ? '✶'.repeat(et) : '';
      if (etsEl.textContent !== texteEt) etsEl.textContent = texteEt;
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria.' + role, { animal: tr('animal.' + s), points: pts, poissons: pf }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || !e.main) return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) {
      if (modeEtoile) return tr('tour.etoile');
      return O.poses(e, s, e.main).length ? tr('tour.toi') : tr('tour.passe');
    }
    const nom = (siegesActuels()[s] || {}).nom;

  // La main : tuile à poser, tuile suivante, boutons.
  function dessinerMiniTuile(cv, t) {

  function majMain() {

  let suivanteCle = null;
  function dessinerSuivante() {

  function majInterface() {
