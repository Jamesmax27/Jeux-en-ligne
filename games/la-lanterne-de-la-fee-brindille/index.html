<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {

    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +

    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +

    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },

    var nom = document.createElement('span');

    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {

      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');

      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();

      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }

      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];

    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {

    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },

    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });

        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }

    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);

    } catch (e) { return null; } // cadre isolé du site, stockage refusé

    var donnees = window.JEL_SAUVEGARDES;

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
/* ==========================================================================
   La lanterne de la fée Brindille — jeu de plateforme (Free Micro Games)
   La fée Brindille monte dans une forêt endormie et rallume les lanternes.
   Toucher à gauche / à droite : battement d'ailes de ce côté ; deux touchers
   rapides : grand battement. Sa lanterne éclaire autour d'elle et révèle les
   ponts de lumière. 20 niveaux, 4 coins de forêt.
   ========================================================================== */
(function () {
  'use strict';

  const JEU = 'la-lanterne-de-la-fee-brindille';
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => (I18N ? I18N.t(cle, vars) : cle);
  const nb = (x) => (I18N ? I18N.nombre(x) : String(x));

  // ------------------------------------------------------------------------
  // Morceaux de forêt (12 cases de large), dessinés à la main.
  // Chaque morceau : rangée du haut = branche de sortie, rangée du bas vide,
  // première branche 2 ou 3 rangées au-dessus du bas.
  //  .  vide          #  branche (on la traverse par-dessous)   T  tronc (mur)
  //  =  pont de lumière   ~  feuille qui se replie   ^  ronces   w  eau

  function chargerProgression(d) {
    d = d || (window.JEL_SAVE ? window.JEL_SAVE.load(JEU) : null) || {};

  function note(freq, duree, type, vol, glisse, delai) {
    if (!prog.son || !actx || enPause) return;

      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      if (glisse) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * glisse), t0 + duree);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
      o.connect(g); g.connect(sortie); o.start(t0); o.stop(t0 + duree + 0.03);
    } catch (e) { /* son impossible */ }
  }

      const g = actx.createGain(); g.gain.value = vol || 0.2;

  }

  function dessinerRonces(c, x, y, s, tps) {
    c.fillStyle = '#4a2a5a';
    c.beginPath(); c.ellipse(x + s * 0.5, y + s * 0.85, s * 0.55, s * 0.22, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#8a4aa0';
    for (let i = 0; i < 4; i++) {
      const bx = x + s * (0.12 + i * 0.25);
      c.beginPath(); c.moveTo(bx - s * 0.1, y + s * 0.82); c.lineTo(bx, y + s * 0.38 + Math.sin(tps * 2 + i) * s * 0.03); c.lineTo(bx + s * 0.1, y + s * 0.82); c.fill();
    }
    c.strokeStyle = '#5e2e72'; c.lineWidth = Math.max(1.5, s * 0.06);
    c.beginPath(); c.arc(x + s * 0.3, y + s * 0.7, s * 0.14, 0, Math.PI * 1.5); c.arc(x + s * 0.72, y + s * 0.66, s * 0.12, Math.PI, Math.PI * 2.4); c.stroke();
  }

  function dessinerFeuille(c, x, y, s, ouv) {
    // x, y : coin haut gauche ; ouv de 0 (bouton replié) à 1 (feuille ouverte)
    const cx = x + s * 0.5, cy = y + s * 0.16;
    const larg = s * (0.12 + 0.44 * ouv), haut = s * (0.12 + 0.06 * ouv);
    c.fillStyle = ouv > 0.6 ? '#62d26d' : '#3f7a4a';
    c.beginPath(); c.ellipse(cx, cy, larg, haut, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(30,90,40,0.8)'; c.lineWidth = Math.max(1, s * 0.03);
    c.beginPath(); c.moveTo(cx - larg, cy); c.lineTo(cx + larg, cy); c.stroke();
    c.strokeStyle = '#3d6e3c';
    c.beginPath(); c.moveTo(cx, cy + haut); c.lineTo(cx, cy + s * 0.5); c.stroke();
  }

  // ------------------------------------------------------------------------
  // Niveau en cours
  // ------------------------------------------------------------------------
  let niv = null; // données du niveau
  const F = { x: 0, y: 0, vx: 0, vy: 0, w: 0.56, h: 0.72, sol: false, plumes: 2, dir: 1, phase: 0, stun: 0, invul: 0, eternue: 0, mobile: null };
  let energie = 100, coeurs = 3, tempsNiv = 0, scoreNiv = 0, lucNiv = 0, monNiv = 0, camY = 0, secousse = 0, finAnim = 0, finEtat = null;
  let dernierTap = -9, tapGrandPossible = false, tps = 0, ventT = 0, ventDir = 1, ventForce = 0;
  let particules = [], textes = [];
  let niveauCourant = 0, partieEnCours = false, enPause = false, ecranOuvert = null;
  const tenus = new Map(); // doigts posés → côté
  const touches = { g: false, d: false };

  function retourner(ligne) {
    return ligne.split('').reverse().map((ch) => ({ '/': 'q', q: '/', '>': '<', '<': '>' }[ch] || ch)).join('');
  }
  function construireCarte(def) {
    const lignes = [];
    for (const nom of def.m.slice().reverse()) {
      const inv = nom.endsWith('*');
      const base = MORCEAUX[nom.replace('*', '')];
      for (const l of base) { const p = (l + '............').slice(0, COLS); lignes.push(inv ? retourner(p) : p); }
    }
    return lignes;
  }

  function chargerNiveau(i) {
    const def = NIVEAUX[i];
    const lignes = construireCarte(def);
    const rows = lignes.length;
    const grille = [];
    const n = {
      i, def, rows, grille, monde: Math.floor(i / 5), lanternes: [], lucioles: [], nuages: [], monstres: [], miroirs: [], mobiles: [],
      depart: { x: 2.5, y: rows - 2 }, but: { x: 6, y: 1.5 }, ponts: [], feuilles: [], ecrase: {}, decor: [],
      lum: new Float32Array(rows * COLS), allume: new Uint8Array(rows * COLS), ouv: new Float32Array(rows * COLS), reste: new Float32Array(rows * COLS),
    };
    const rnd = hasard(i * 977 + 13);
    for (let r = 0; r < rows; r++) {
      const ligne = [];
      for (let c = 0; c < COLS; c++) {
        const ch = lignes[r][c];
        const cx = c + 0.5, cy = r + 0.5;
        if ('#T=~^wm'.includes(ch)) ligne.push(ch); else ligne.push('.');
        if (ch === '=') n.ponts.push(r * COLS + c);
        if (ch === '~') n.feuilles.push(r * COLS + c);
        if (ch === 'S') n.depart = { x: cx, y: cy };
        else if (ch === 'G') n.but = { x: cx, y: cy };
        else if (ch === 'L') n.lanternes.push({ x: cx, y: cy, allumee: false });
        else if (ch === 'f') n.lucioles.push({ x0: cx, y0: cy, x: cx, y: cy, vivante: true, retour: 0, ph: rnd() * 6 });
        else if (ch === 'P') n.nuages.push({ x0: cx, y: cy, x: cx, ph: rnd() * 6, amp: 2 });
        else if (ch === 'B') n.monstres.push({ x: cx, y: r + 1, c, r, dir: rnd() < 0.5 ? -1 : 1, calme: 0, apaise: false, min: 0, max: COLS });
        else if (DIRS_MIROIR[ch]) n.miroirs.push({ x: cx, y: cy, dir: ch, minuterie: 0, perm: false, fin: null });
        else if (ch === 'H') n.mobiles.push({ x0: c - 0.5, x: c - 0.5, r, ph: rnd() * 6, dx: 0 });
      }
      grille.push(ligne);
    }
    // Trajet de chaque monstre : sa branche
    for (const m of n.monstres) {
      let a = m.c, b = m.c;
      const sous = m.r + 1;
      const porte = (c) => c >= 0 && c < COLS && sous < rows && (grille[sous][c] === '#' || grille[sous][c] === 'T');
      while (porte(a - 1)) a--;
      while (porte(b + 1)) b++;
      m.min = a + 0.4; m.max = b + 1 - 0.4;
    }
    // Rayon de chaque miroir : jusqu'au premier tronc
    for (const mi of n.miroirs) {
      const v = DIRS_MIROIR[mi.dir];
      let x = mi.x, y = mi.y, k = 0;
      while (k < 200) {
        const nx = x + v[0] * 0.2, ny = y + v[1] * 0.2;
        const c = Math.floor(nx), r = Math.floor(ny);
        if (c < 0 || c >= COLS || r < 0 || r >= rows) { x = nx; y = ny; break; }
        if (grille[r][c] === 'T') break;
        x = nx; y = ny; k++;
      }
      mi.fin = { x, y };
    }
    // Décor : troncs lointains et petites plantes
    for (let k = 0; k < 14; k++) n.decor.push({ x: rnd() * COLS, l: 0.6 + rnd() * 1.4, p: 0.2 + rnd() * 0.5, teinte: rnd() });
    return n;
  }

  function demarrerNiveau(i) {
    niveauCourant = i;
    niv = chargerNiveau(i);
    Object.assign(F, { x: niv.depart.x, y: niv.depart.y, vx: 0, vy: 0, sol: false, plumes: 2, dir: 1, stun: 0, invul: 0, eternue: 0, mobile: null });
    niv.reprise = { x: niv.depart.x, y: niv.depart.y };
    energie = 100; coeurs = 3; tempsNiv = 0; scoreNiv = 0; lucNiv = 0; monNiv = 0; secousse = 0; finAnim = 0; finEtat = null;
    ventT = 0; ventForce = 0; ventDir = 1; particules = []; textes = [];
    tenus.clear(); touches.g = touches.d = false;
    camY = cibleCamera();
    partieEnCours = true; enPause = false;
    fermerEcrans();
    document.getElementById('hud').hidden = false;
    majHud();
    // Tutoriel et cartes des nouveautés
    // (on montre aussi, au plus 3, celles des niveaux précédents jamais vues :
    // un joueur qui reprend au niveau 12 découvre les miroirs et le ruisseau)
    const dejaLa = [];
    for (let k = 0; k <= i; k++) for (const m of NIVEAUX[k].nouveau) if (m !== 'base' && !prog.vus.includes(m) && !dejaLa.includes(m)) dejaLa.push(m);
    const aMontrer = dejaLa.slice(-3);
    const suite = () => montrerNouveautes(aMontrer);
    if (!prog.vus.includes('base')) { prog.vus.push('base'); montrerTuto(suite); } else suite();
  }

  function montrerNouveautes(liste) {
    if (!liste.length) { ecranOuvert = null; return; }
    const k = liste.shift();
    if (!prog.vus.includes(k)) prog.vus.push(k);
    montrerCarteNouveau(k, () => montrerNouveautes(liste));
  }

  // Lumière en un point (cases) : lanterne de Brindille, lanternes allumées,
  // rayons des miroirs, lucioles.
  function rayonFee() { return 0.7 + 2.9 * Math.max(0, energie) / 100; }
  function distSeg(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay; const l2 = dx * dx + dy * dy || 1;
    let u = ((px - ax) * dx + (py - ay) * dy) / l2; u = Math.max(0, Math.min(1, u));
    const qx = ax + u * dx - px, qy = ay + u * dy - py; return Math.sqrt(qx * qx + qy * qy);
  }
  function eclaire(px, py, sansFee) {
    if (!sansFee && Math.hypot(px - F.x, py - F.y) < rayonFee()) return true;
    for (const l of niv.lanternes) if (l.allumee && Math.hypot(px - l.x, py - l.y) < RAYON_LANTERNE) return true;
    for (const m of niv.miroirs) if ((m.minuterie > 0 || m.perm) && distSeg(px, py, m.x, m.y, m.fin.x, m.fin.y) < LARGEUR_RAYON) return true;
    for (const f of niv.lucioles) if (f.vivante && Math.hypot(px - f.x, py - f.y) < 0.9) return true;
    return false;
  }

  function tuile(c, r) { if (c < 0 || c >= COLS) return 'T'; if (r < 0 || r >= niv.rows) return '.'; return niv.grille[r][c]; }
  function plein(c, r) { const ch = tuile(c, r); return ch === 'T' || ch === 'm'; }
  function porteuse(c, r) {
    const ch = tuile(c, r);
    if (ch === '#') return true;
    if (ch === '=') return niv.allume[r * COLS + c] === 1;
    if (ch === '~') return niv.ouv[r * COLS + c] >= 0.6;
    return false;
  }

  // --- Gestes -------------------------------------------------------------
  function battre(cote) {
    audio();
    if (!partieEnCours || enPause || ecranOuvert || finEtat) return;
    if (cote) F.dir = cote;
    if (F.stun > 0) return;
    if (tps - dernierTap < DOUBLE_DELAI && tapGrandPossible && F.plumes >= 1) {
      // Grand battement : deux touchers rapides
      F.plumes -= 1;
      F.vy = -GRAND_BAT;
      if (cote) F.vx = cote * VIT_TAP;
      tapGrandPossible = false; dernierTap = -9;
      SON.grand();
      bouffee(F.x, F.y + 0.3, 12, [255, 255, 220]);
      F.sol = false;
      return;
    }
    if (F.plumes > 0) {
      F.plumes -= 1;
      F.vy = -BAT;
      if (cote) F.vx = cote * VIT_TAP;
      tapGrandPossible = true;
      SON.battement();
      bouffee(F.x, F.y + 0.3, 5, [220, 255, 220]);
      F.sol = false;
    } else {
      if (cote) F.vx = cote * 3;
      tapGrandPossible = false;
    }
    dernierTap = tps;
  }
  function coteTenu() {
    let s = 0;
    tenus.forEach((v) => { s += v; });
    if (touches.g) s -= 1;
    if (touches.d) s += 1;
    return Math.sign(s);
  }

  toile.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    audio();
    if (!partieEnCours || enPause || ecranOuvert) return;
    const cote = e.clientX < W / 2 ? -1 : 1;
    tenus.set(e.pointerId, cote);
    try { toile.setPointerCapture(e.pointerId); } catch (err) { /* rien */ }
    battre(cote);
  });
  const lacher = (e) => { tenus.delete(e.pointerId); };
  toile.addEventListener('pointerup', lacher);
  toile.addEventListener('pointercancel', lacher);
  toile.addEventListener('lostpointercapture', lacher);
  toile.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    const code = e.code;
    if (code === 'Escape' || code === 'KeyP') {
      if (partieEnCours && !finEtat) {
        if (ecranOuvert === 'pause') reprendre();
        else if (!ecranOuvert) mettrePause();
      }
      e.preventDefault();
      return;
    }
    if (!partieEnCours || ecranOuvert) return;
    const gauche = code === 'ArrowLeft' || code === 'KeyA' || code === 'KeyQ';
    const droite = code === 'ArrowRight' || code === 'KeyD';
    const haut = code === 'ArrowUp' || code === 'Space' || code === 'KeyW' || code === 'KeyZ';
    if (gauche || droite || haut) e.preventDefault();
    if (e.repeat) return;
    if (gauche) { touches.g = true; battre(-1); }
    else if (droite) { touches.d = true; battre(1); }
    else if (haut) battre(0);
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA' || e.code === 'KeyQ') touches.g = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') touches.d = false;
  });

  // --- Effets ----------------------------------------------------------------
  function bouffee(x, y, n, col, vit) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = (vit || 1.5) * (0.4 + Math.random());
      particules.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 0.6 + Math.random() * 0.5, max: 1.1, col, t: 0.06 + Math.random() * 0.08 });
    }
  }
  function confettis(x, y, n) {
    const cols = [[255, 220, 110], [255, 150, 210], [150, 230, 255], [170, 255, 150], [255, 255, 255]];
    for (let k = 0; k < n; k++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, v = 3 + Math.random() * 5;
      particules.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 1 + Math.random(), max: 2, col: cols[k % cols.length], t: 0.08 + Math.random() * 0.08, g: 5, etoile: Math.random() < 0.4 });
    }
  }
  function texteFlottant(x, y, cle, col) { textes.push({ x, y, txt: tr(cle), vie: 1.3, col: col || '#fff3c4' }); }

  function blesser(raison) {
    if (F.invul > 0 || finEtat) return;
    coeurs -= 1;
    secousse = 0.35;
    F.invul = 1.6;
    if (raison === 'eau') { SON.plouf(); bouffee(F.x, F.y + 0.3, 16, [140, 200, 255], 3); texteFlottant(F.x, F.y - 0.8, 'msg.plouf', '#bfe6ff'); }
    else if (raison === 'dodo') { SON.dodo(); texteFlottant(F.x, F.y - 0.8, 'msg.dodo', '#ffd0a0'); }
    else { SON.aie(); bouffee(F.x, F.y, 10, [255, 140, 160], 2.5); texteFlottant(F.x, F.y - 0.8, 'msg.aie', '#ffb0c0'); }
    majHud();
    if (coeurs <= 0) { finEtat = 'perdu'; finAnim = 0; return; }
    if (raison !== 'monstre') {
      F.x = niv.reprise.x; F.y = niv.reprise.y; F.vx = 0; F.vy = 0; F.plumes = 2; F.stun = 0;
      energie = Math.max(energie, 65);
    }
  }

  // --- Mise à jour -----------------------------------------------------------
  function maj(dt) {
    tempsNiv += dt;
    const def = niv.def;
    // Fin de niveau animée
    if (finEtat) {
      finAnim += dt;
      F.phase += dt * 10;
      if (finEtat === 'gagne') { F.vy = -1.2; F.y += F.vy * dt; }
      majParticules(dt);
      if (finAnim > 1.1) { const e = finEtat; finEtat = 'fini'; if (e === 'gagne') montrerVictoire(); else if (e === 'perdu') montrerDefaite(); }
      return;
    }

    // Lumière qui baisse
    if (def.perte > 0) {
      energie -= def.perte * dt;
      if (energie <= 0) { energie = 0; blesser('dodo'); energie = 70; }
    }
    if (F.invul > 0) F.invul -= dt;
    if (F.stun > 0) F.stun -= dt;
    if (F.eternue > 0) F.eternue -= dt;

    // Vent (cime des arbres)
    ventForce = 0;
    if (def.vent) {
      ventT += dt;
      const p = ventT % 7;
      if (p < dt) ventDir = -ventDir;
      if (p > 4.3 && p < 5.3 && Math.random() < 0.5) particules.push({ x: ventDir > 0 ? -0.5 : COLS + 0.5, y: camY + Math.random() * VR, vx: ventDir * 6, vy: 0.5, vie: 2, max: 2, col: [120, 200, 110], t: 0.12, feuille: true });
      if (p >= 5.3 && p < 7) {
        ventForce = ventDir * 7;
        if (p - dt < 5.3) { SON.vent(); texteFlottant(F.x, F.y - 1, 'msg.vent', '#d8ffd0'); }
        if (Math.random() < 0.6) particules.push({ x: ventDir > 0 ? -0.5 : COLS + 0.5, y: camY + Math.random() * VR, vx: ventDir * 9, vy: 0.3, vie: 2, max: 2, col: [120, 200, 110], t: 0.12, feuille: true });
      }
    }

    // Branches qui se balancent
    for (const h of niv.mobiles) {
      const ancien = h.x;
      h.x = Math.max(0, Math.min(COLS - 2, h.x0 + Math.sin(tps * Math.PI * 2 / 4 + h.ph) * 2));
      h.dx = h.x - ancien;
    }
    if (F.mobile) F.x += F.mobile.dx;

    // Mouvement horizontal
    const cote = coteTenu();
    if (F.stun <= 0 && cote) { F.vx += (cote * VIT_TENIR - F.vx) * Math.min(1, 10 * dt) * (Math.abs(F.vx) > VIT_TENIR && Math.sign(F.vx) === cote ? 0.15 : 1); F.dir = cote; }
    else F.vx *= Math.exp(-(F.sol ? 12 : 1.8) * dt);
    if (ventForce) { F.vx += ventForce * dt; F.vx = Math.max(-6, Math.min(6, F.vx)); }

    F.vy = Math.min(CHUTE_MAX, F.vy + GRAV * dt);
    F.phase += dt * (F.sol ? 4 : 16);

    // Axe X
    F.x += F.vx * dt;
    {
      const haut = F.y - F.h / 2, bas = F.y + F.h / 2 - 0.02;
      for (let r = Math.floor(haut); r <= Math.floor(bas); r++) {
        if (F.vx > 0) { const c = Math.floor(F.x + F.w / 2); if (plein(c, r)) { F.x = c - F.w / 2 - 0.001; F.vx = 0; } }
        else if (F.vx < 0) { const c = Math.floor(F.x - F.w / 2); if (plein(c, r)) { F.x = c + 1 + F.w / 2 + 0.001; F.vx = 0; } }
      }
    }
    // Axe Y
    const piedsAvant = F.y + F.h / 2;
    F.y += F.vy * dt;
    const etaitAuSol = F.sol;
    F.sol = false; F.mobile = null;
    const gx = F.x - F.w / 2 + 0.04, dx = F.x + F.w / 2 - 0.04;
    if (F.vy < 0) {
      const r = Math.floor(F.y - F.h / 2);
      for (let c = Math.floor(gx); c <= Math.floor(dx); c++) if (plein(c, r)) { F.y = r + 1 + F.h / 2; F.vy = 0; break; }
    } else {
      const pieds = F.y + F.h / 2, r = Math.floor(pieds);
      for (let c = Math.floor(gx); c <= Math.floor(dx); c++) {
        const p = plein(c, r);
        if (p || (porteuse(c, r) && piedsAvant <= r + 0.06)) {
          F.y = r - F.h / 2;
          if (tuile(c, r) === 'm') {
            F.vy = -REBOND; F.plumes = 2; niv.ecrase[r * COLS + c] = 1; SON.rebond(); bouffee(c + 0.5, r, 8, [255, 200, 220], 2);
          } else {
            F.vy = 0; F.sol = true; F.plumes = 2;
            if (!etaitAuSol) SON.pose();
          }
          break;
        }
      }
      if (!F.sol && F.vy >= 0) {
        for (const h of niv.mobiles) {
          const top = h.r + 0.0;
          if (piedsAvant <= top + 0.06 && pieds >= top && F.x > h.x - 0.15 && F.x < h.x + 2.15) {
            F.y = top - F.h / 2; F.vy = 0; F.sol = true; F.plumes = 2; F.mobile = h;
            if (!etaitAuSol) SON.pose();
            break;
          }
        }
      }
    }

    // Dangers : ronces et eau
    {
      const g = F.x - F.w * 0.35, d = F.x + F.w * 0.35, ht = F.y - F.h * 0.35, bs = F.y + F.h * 0.45;
      for (let r = Math.floor(ht); r <= Math.floor(bs); r++) for (let c = Math.floor(g); c <= Math.floor(d); c++) {
        const ch = tuile(c, r);
        if (ch === '^' && bs > r + 0.45) { blesser('ronce'); break; }
        if (ch === 'w' && bs > r + 0.3) { blesser('eau'); break; }
      }
    }
    if (F.y > niv.rows + 1.5) blesser('chute');

    // Ponts et feuilles
    const appel = niv.ponts.length + niv.feuilles.length;
    if (appel) {
      for (const k of niv.ponts) {
        const r = Math.floor(k / COLS), c = k % COLS;
        const a = eclaire(c + 0.5, r + 0.5) ? 1 : 0;
        if (a && !niv.allume[k] && niv.lum[k] < 0.05 && Math.hypot(c + 0.5 - F.x, r + 0.5 - F.y) < 5) { SON.pont(); }
        niv.allume[k] = a;
        niv.lum[k] += ((a ? 1 : 0) - niv.lum[k]) * Math.min(1, dt * 8);
      }
      for (const k of niv.feuilles) {
        const r = Math.floor(k / COLS), c = k % COLS;
        if (eclaire(c + 0.5, r + 0.5)) {
          if (niv.ouv[k] < 0.05) SON.feuille();
          niv.ouv[k] = Math.min(1, niv.ouv[k] + dt / 0.6); niv.reste[k] = 1.2;
        } else if (niv.reste[k] > 0) niv.reste[k] -= dt;
        else niv.ouv[k] = Math.max(0, niv.ouv[k] - dt / 0.35);
      }
    }

    // Lanternes
    for (const l of niv.lanternes) {
      if (l.allumee) continue;
      const parFee = Math.hypot(l.x - F.x, l.y - F.y) < 0.85;
      let parRayon = false;
      if (!parFee) for (const m of niv.miroirs) if ((m.minuterie > 0 || m.perm) && distSeg(l.x, l.y, m.x, m.y, m.fin.x, m.fin.y) < LARGEUR_RAYON) parRayon = true;
      if (parFee || parRayon) {
        l.allumee = true;
        scoreNiv += 100;
        SON.lanterne();
        confettis(l.x, l.y, 22);
        texteFlottant(l.x, l.y - 0.8, 'msg.lanterne');
        if (parFee) { energie = Math.min(100, energie + 40); niv.reprise = { x: l.x, y: l.y }; }
        majHud();
      }
    }
    // Miroirs
    for (const m of niv.miroirs) {
      m.perm = niv.lanternes.some((l) => l.allumee && Math.hypot(l.x - m.x, l.y - m.y) < RAYON_LANTERNE);
      let touche = Math.hypot(m.x - F.x, m.y - F.y) < rayonFee() + 0.2;
      if (!touche) for (const o of niv.miroirs) if (o !== m && (o.minuterie > 0 || o.perm) && distSeg(m.x, m.y, o.x, o.y, o.fin.x, o.fin.y) < 0.6) touche = true;
      if (touche) { if (m.minuterie <= 0 && !m.perm) SON.miroir(); m.minuterie = 5; }
      else if (m.minuterie > 0) m.minuterie -= dt;
    }
    // Lucioles
    for (const f of niv.lucioles) {
      if (!f.vivante) { f.retour -= dt; if (f.retour <= 0) f.vivante = true; continue; }
      f.x = f.x0 + Math.sin(tps * 1.3 + f.ph) * 0.5; f.y = f.y0 + Math.cos(tps * 1.7 + f.ph) * 0.35;
      if (Math.hypot(f.x - F.x, f.y - F.y) < 0.8) {
        f.vivante = false; f.retour = 10;
        energie = Math.min(100, energie + 35); F.plumes = 2; scoreNiv += 20; lucNiv++;
        SON.luciole(); bouffee(f.x, f.y, 14, [220, 255, 120], 2.5); texteFlottant(f.x, f.y - 0.6, 'msg.luciole', '#eaff9a');
      }
    }
    // Nuages de pollen
    for (const n of niv.nuages) {
      n.x = Math.max(0.8, Math.min(COLS - 0.8, n.x0 + Math.sin(tps * Math.PI * 2 / 5 + n.ph) * n.amp));
      if (F.eternue <= 0 && Math.hypot(n.x - F.x, n.y - F.y) < 1.05) {
        const s = Math.sign(F.x - n.x) || -F.dir;
        F.vx = s * 7.5; F.vy = 1.5; F.stun = 0.5; F.eternue = 1.1; F.plumes = 0;
        SON.atchoum(); bouffee(F.x, F.y, 18, [250, 230, 120], 3); texteFlottant(F.x, F.y - 0.9, 'msg.atchoum', '#fff2a0');
        secousse = 0.15;
      }
    }
    // Monstres boudeurs
    for (const m of niv.monstres) {
      if (m.apaise) continue;
      m.x += m.dir * 1.1 * dt;
      if (m.x < m.min) { m.x = m.min; m.dir = 1; } else if (m.x > m.max) { m.x = m.max; m.dir = -1; }
      if (eclaire(m.x, m.y - 0.4)) m.calme += dt / 1.0; else m.calme = Math.max(0, m.calme - dt * 0.4);
      if (m.calme >= 1) {
        m.apaise = true; scoreNiv += 50; monNiv++;
        SON.calme(); confettis(m.x, m.y - 0.5, 14); texteFlottant(m.x, m.y - 1.2, 'msg.calme', '#ffd0ea');
        continue;
      }
      if (Math.abs(m.x - F.x) < 0.65 && Math.abs((m.y - 0.36) - F.y) < 0.7 && F.invul <= 0) {
        blesser('monstre');
        F.vx = Math.sign(F.x - m.x || 1) * 6; F.vy = -5;
      }
    }
    // Champignons écrasés
    for (const k in niv.ecrase) { niv.ecrase[k] -= dt * 3; if (niv.ecrase[k] <= 0) delete niv.ecrase[k]; }

    // Arrivée
    if (Math.hypot(niv.but.x - F.x, niv.but.y - F.y) < 1.0) {
      finEtat = 'gagne'; finAnim = 0; SON.victoire(); confettis(niv.but.x, niv.but.y, 60);
    }

    majParticules(dt);
    if (secousse > 0) secousse -= dt;
    majHud(true);
  }

  function majParticules(dt) {
    for (const p of particules) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; p.vx *= Math.exp(-1.2 * dt); p.vie -= dt; }
    particules = particules.filter((p) => p.vie > 0);
    if (particules.length > 400) particules.splice(0, particules.length - 400);
    for (const t of textes) { t.y -= dt * 0.9; t.vie -= dt; }
    textes = textes.filter((t) => t.vie > 0);
  }

  // --- Rendu du jeu ---------------------------------------------------------------
  const FONDS = [
    ['#0f2a2e', '#1d4a3a', '#0a1a1c'], // sous-bois
    ['#24163f', '#3d2a5e', '#120a24'], // champignonnière
    ['#0e2442', '#1c4a63', '#081628'], // ruisseau
    ['#0a0f33', '#232a66', '#05071c'], // cime des arbres
  ];
  const NUITS = [0.7, 0.76, 0.78, 0.8];

  function dessinerFond(monde, decor, decalage, tpsLocal) {
    const f = FONDS[monde];
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, f[0]); g.addColorStop(0.6, f[1]); g.addColorStop(1, f[2]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // Étoiles et lune (cime) ou lucioles lointaines
    const rnd = hasard(monde * 31 + 7);
    for (let k = 0; k < 60; k++) {
      const x = rnd() * W, y = ((rnd() * H * 1.5 - decalage * 0.08) % (H * 1.5) + H * 1.5) % (H * 1.5) - H * 0.25;
      const a = 0.3 + 0.5 * Math.abs(Math.sin(tpsLocal * (0.5 + rnd()) + k));
      ctx.fillStyle = monde === 3 ? 'rgba(255,255,255,' + a + ')' : 'rgba(220,255,160,' + a * 0.6 + ')';
      ctx.fillRect(x, y, monde === 3 ? 2 : 2.5, monde === 3 ? 2 : 2.5);
    }
    if (monde === 3) {
      ctx.fillStyle = 'rgba(255,250,220,0.9)'; ctx.beginPath(); ctx.arc(W * 0.8, H * 0.18, Math.min(W, H) * 0.07, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = f[0]; ctx.beginPath(); ctx.arc(W * 0.8 + Math.min(W, H) * 0.03, H * 0.18 - Math.min(W, H) * 0.02, Math.min(W, H) * 0.065, 0, Math.PI * 2); ctx.fill();
    }
    // Troncs lointains (parallaxe)
    for (const d of decor) {
      const x = OX + d.x * T;
      ctx.fillStyle = monde === 1 ? 'rgba(80,50,110,' + d.p + ')' : monde === 2 ? 'rgba(30,70,90,' + d.p + ')' : monde === 3 ? 'rgba(25,30,70,' + d.p + ')' : 'rgba(25,60,45,' + d.p + ')';
      if (monde === 1) {
        // grands champignons dans le fond
        const y = ((d.teinte * H * 2 - decalage * d.p * 0.5) % (H * 1.4) + H * 1.4) % (H * 1.4) - H * 0.2;
        ctx.fillRect(x - T * 0.25 * d.l, y, T * 0.5 * d.l, T * 2 * d.l);
        ctx.beginPath(); ctx.ellipse(x, y, T * 1.4 * d.l, T * 0.8 * d.l, 0, Math.PI, 0); ctx.fill();
      } else {
        ctx.fillRect(x - T * 0.3 * d.l, 0, T * 0.6 * d.l, H);
      }
    }
    if (monde === 2) {
      // ruisseau qui scintille au loin
      for (let k = 0; k < 6; k++) {
        const y = H * (0.15 + k * 0.16);
        ctx.strokeStyle = 'rgba(140,210,255,0.08)'; ctx.lineWidth = 3;
        ctx.beginPath();
        for (let x = 0; x <= W; x += 20) ctx.lineTo(x, y + Math.sin(x * 0.03 + tpsLocal * 2 + k) * 4);
        ctx.stroke();
      }
    }
  }

  // Caméra : suit Brindille ; laisse de la place sous la barre du haut ;
  // un niveau plus petit que l'écran est posé en bas.
  function cibleCamera() {
    const marge = 110 / T;
    const bas = niv.rows - VR, haut = -marge;
    if (bas < haut) return bas;
    return Math.max(haut, Math.min(bas, F.y - VR * 0.58));
  }
  function px(x) { return OX + x * T; }
  function py(y) { return (y - camY) * T; }

  function dessinerJeu() {
    const cible = cibleCamera();
    camY += (cible - camY) * 0.18;
    const sx = secousse > 0 ? (Math.random() - 0.5) * 10 * secousse / 0.35 : 0;
    const sy = secousse > 0 ? (Math.random() - 0.5) * 10 * secousse / 0.35 : 0;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    dessinerFond(niv.monde, niv.decor, camY * T, tps);
    ctx.save();
    ctx.translate(sx, sy);
    const r0 = Math.max(0, Math.floor(camY) - 1), r1 = Math.min(niv.rows - 1, Math.ceil(camY + VR) + 1);
    // Tuiles
    for (let r = r0; r <= r1; r++) {
      const ligne = niv.grille[r];
      let c = 0;
      while (c < COLS) {
        const ch = ligne[c];
        if (ch === '#') {
          let d = c; while (d + 1 < COLS && ligne[d + 1] === '#') d++;
          dessinerBranche(ctx, px(c) + 1, py(r), (d - c + 1) * T - 2, T, niv.monde);
          c = d + 1; continue;
        }
        if (ch === 'T') {
          ctx.fillStyle = '#3e2a1c'; ctx.fillRect(px(c), py(r), T + 0.5, T + 0.5);
          ctx.strokeStyle = 'rgba(20,10,4,0.5)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(px(c) + T * 0.3, py(r)); ctx.lineTo(px(c) + T * 0.35, py(r) + T); ctx.moveTo(px(c) + T * 0.7, py(r) + T * 0.2); ctx.lineTo(px(c) + T * 0.68, py(r) + T * 0.8); ctx.stroke();
        } else if (ch === '=') {
          const k = r * COLS + c, a = niv.lum[k];
          if (a > 0.03) {
            ctx.fillStyle = 'rgba(255,225,120,' + (0.25 * a) + ')';
            ctx.fillRect(px(c), py(r) - T * 0.15, T, T * 0.6);
            ctx.fillStyle = 'rgba(255,236,160,' + (0.9 * a) + ')';
            ctx.fillRect(px(c) + 1, py(r), T - 2, T * 0.26);
            ctx.fillStyle = 'rgba(255,255,255,' + (0.8 * a) + ')';
            ctx.fillRect(px(c) + 1, py(r), T - 2, T * 0.06);
          }
          // paillettes qui trahissent le pont caché
          const sc = 0.18 + 0.15 * Math.sin(tps * 3 + c * 1.7 + r);
          ctx.fillStyle = 'rgba(255,240,180,' + sc * (1 - a) + ')';
          ctx.fillRect(px(c) + T * 0.3, py(r) + T * 0.1, 2, 2); ctx.fillRect(px(c) + T * 0.75, py(r) + T * 0.05, 2, 2);
        } else if (ch === '~') {
          dessinerFeuille(ctx, px(c), py(r), T, niv.ouv[r * COLS + c]);
        } else if (ch === '^') {
          dessinerRonces(ctx, px(c), py(r), T, tps);
        } else if (ch === 'w') {
          ctx.fillStyle = 'rgba(70,150,230,0.85)';
          ctx.fillRect(px(c), py(r) + T * 0.25, T + 0.5, T * 0.75);
          ctx.strokeStyle = 'rgba(200,240,255,0.9)'; ctx.lineWidth = 2;
          ctx.beginPath(); for (let x = 0; x <= T; x += 4) ctx.lineTo(px(c) + x, py(r) + T * 0.25 + Math.sin((c * T + x) * 0.2 + tps * 4) * 2); ctx.stroke();
        } else if (ch === 'm') {
          dessinerChampignon(ctx, px(c), py(r), T, niv.ecrase[r * COLS + c] || 0, niv.monde);
        }
        c++;
      }
    }
    // Branches mobiles
    for (const h of niv.mobiles) {
      ctx.strokeStyle = 'rgba(120,180,90,0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px(h.x + 0.2), py(h.r)); ctx.lineTo(px(h.x + 1), py(h.r - 3)); ctx.lineTo(px(h.x + 1.8), py(h.r)); ctx.stroke();
      dessinerBranche(ctx, px(h.x), py(h.r), T * 2, T, niv.monde);
    }
    // Rayons des miroirs
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const m of niv.miroirs) {
      const a = m.perm ? 1 : Math.min(1, m.minuterie / 1.5);
      if (a <= 0) continue;
      ctx.strokeStyle = 'rgba(190,240,255,' + 0.22 * a + ')'; ctx.lineWidth = T * 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(px(m.x), py(m.y)); ctx.lineTo(px(m.fin.x), py(m.fin.y)); ctx.stroke();
      ctx.strokeStyle = 'rgba(240,255,255,' + 0.6 * a + ')'; ctx.lineWidth = T * 0.25;
      ctx.beginPath(); ctx.moveTo(px(m.x), py(m.y)); ctx.lineTo(px(m.fin.x), py(m.fin.y)); ctx.stroke();
      const lg = Math.hypot(m.fin.x - m.x, m.fin.y - m.y);
      for (let k = 0; k < 5; k++) {
        const u = ((tps * 0.5 + k / 5) % 1);
        ctx.fillStyle = 'rgba(255,255,255,' + 0.8 * a + ')';
        ctx.beginPath(); ctx.arc(px(m.x + (m.fin.x - m.x) * u), py(m.y + (m.fin.y - m.y) * u), T * 0.08, 0, Math.PI * 2); ctx.fill();
      }
      if (lg < 0.1) continue;
    }
    ctx.restore();
    for (const m of niv.miroirs) dessinerMiroir(ctx, px(m.x), py(m.y), T, m.dir, m.minuterie > 0 || m.perm, tps);
    for (const l of niv.lanternes) dessinerLanterne(ctx, px(l.x), py(l.y), T, l.allumee, tps);
    dessinerFleur(ctx, px(niv.but.x), py(niv.but.y), T, tps);
    for (const f of niv.lucioles) if (f.vivante) dessinerLuciole(ctx, px(f.x), py(f.y), T, tps);
    for (const m of niv.monstres) dessinerMonstre(ctx, px(m.x), py(m.y), T, m, tps);
    for (const n of niv.nuages) dessinerNuage(ctx, px(n.x), py(n.y), T, tps);
    // Brindille
    dessinerFee(ctx, px(F.x), py(F.y), T * 1.15, {
      dir: F.dir, phase: F.phase, clignote: F.invul > 0 ? F.invul : 0, eternue: F.eternue > 0.5,
      lumiere: Math.max(0.2, energie / 100), tourne: finEtat === 'gagne' ? finAnim * 8 : (finEtat === 'perdu' || finEtat === 'fini' ? 0.3 : 0), dort: finEtat === 'perdu',
    });
    ctx.restore();

    // Nuit : on creuse la lumière
    const lumieres = [];
    const col = couleurLumiere();
    lumieres.push({ x: px(F.x), y: py(F.y), r: rayonFee() * T * 1.25 });
    for (const l of niv.lanternes) if (l.allumee) lumieres.push({ x: px(l.x), y: py(l.y), r: RAYON_LANTERNE * T * 1.2 });
    for (const f of niv.lucioles) if (f.vivante) lumieres.push({ x: px(f.x), y: py(f.y), r: T * 1.0 });
    lumieres.push({ x: px(niv.but.x), y: py(niv.but.y), r: T * 2.4 });
    const rayons = niv.miroirs.filter((m) => m.minuterie > 0 || m.perm).map((m) => ({ x1: px(m.x), y1: py(m.y), x2: px(m.fin.x), y2: py(m.fin.y), a: m.perm ? 1 : Math.min(1, m.minuterie / 1.5) }));
    dessinerNuit(NUITS[niv.monde], lumieres, rayons, col);

    // Particules et textes (par-dessus la nuit)
    ctx.save();
    ctx.translate(sx, sy);
    for (const p of particules) {
      const a = Math.max(0, Math.min(1, p.vie / (p.max * 0.6)));
      ctx.fillStyle = rgba(p.col, a);
      if (p.feuille) { ctx.beginPath(); ctx.ellipse(px(p.x), py(p.y), T * 0.15, T * 0.07, tps * 5 + p.y, 0, Math.PI * 2); ctx.fill(); }
      else if (p.etoile) etoileCanvas(ctx, px(p.x), py(p.y), T * p.t * 1.6, tps * 4 + p.x);
      else { ctx.beginPath(); ctx.arc(px(p.x), py(p.y), T * p.t, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '800 ' + Math.round(Math.max(15, T * 0.5)) + 'px system-ui, sans-serif';
    for (const t of textes) {
      ctx.globalAlpha = Math.min(1, t.vie);
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,10,40,0.8)'; ctx.strokeText(t.txt, px(t.x), py(t.y));
      ctx.fillStyle = t.col; ctx.fillText(t.txt, px(t.x), py(t.y));
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    // Bords de l'écran large
    if (OX > 1) {
      ctx.fillStyle = 'rgba(5,6,18,0.55)';
      ctx.fillRect(0, 0, OX, H); ctx.fillRect(W - OX, 0, OX, H);
    }
  }

  function etoileCanvas(c, x, y, r, rot) {
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = rot + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      if (i === 0) c.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); else c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    c.closePath(); c.fill();
  }

  function dessinerNuit(opacite, lumieres, rayons, col) {
    const k = nuit.width / W;
    nctx.setTransform(1, 0, 0, 1, 0, 0);
    nctx.globalCompositeOperation = 'source-over';
    nctx.clearRect(0, 0, nuit.width, nuit.height);
    nctx.fillStyle = 'rgba(4,5,22,' + opacite + ')';
    nctx.fillRect(0, 0, nuit.width, nuit.height);
    nctx.globalCompositeOperation = 'destination-out';
    for (const l of lumieres) {
      const g = nctx.createRadialGradient(l.x * k, l.y * k, 0, l.x * k, l.y * k, l.r * k);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.55, 'rgba(0,0,0,0.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      nctx.fillStyle = g; nctx.beginPath(); nctx.arc(l.x * k, l.y * k, l.r * k, 0, Math.PI * 2); nctx.fill();
    }
    nctx.lineCap = 'round';
    for (const r of rayons) {
      nctx.strokeStyle = 'rgba(0,0,0,' + 0.5 * r.a + ')'; nctx.lineWidth = T * 2.4 * k;
      nctx.beginPath(); nctx.moveTo(r.x1 * k, r.y1 * k); nctx.lineTo(r.x2 * k, r.y2 * k); nctx.stroke();
      nctx.strokeStyle = 'rgba(0,0,0,' + 0.8 * r.a + ')'; nctx.lineWidth = T * 1.3 * k;
      nctx.beginPath(); nctx.moveTo(r.x1 * k, r.y1 * k); nctx.lineTo(r.x2 * k, r.y2 * k); nctx.stroke();
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(nuit, 0, 0, toile.width, toile.height);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // Lueur colorée autour de Brindille
    if (lumieres.length) {
      const l = lumieres[0];
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
      g.addColorStop(0, rgba(col, 0.22)); g.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(l.x, l.y, l.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  // --- Écran titre : grand dessin ---------------------------------------------
  const decorTitre = (() => { const r = hasard(4242); const d = []; for (let k = 0; k < 12; k++) d.push({ x: r() * COLS, l: 0.6 + r() * 1.5, p: 0.2 + r() * 0.5, teinte: r() }); return d; })();
  function dessinerTitre() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const s = Math.min(W / 8, H / 11);
    const oxSauve = OX, tSauve = T;
    OX = (W - COLS * (W / COLS)) / 2; T = W / COLS;
    dessinerFond(0, decorTitre, tps * 6, tps);
    OX = oxSauve; T = tSauve;
    const cx = W / 2, cy = H * 0.5;
    // Branches et ponts
    ctx.save();
    dessinerBranche(ctx, cx - s * 3.6, cy + s * 1.9, s * 2.6, s, 0);
    dessinerBranche(ctx, cx + s * 1.2, cy + s * 0.9, s * 2.4, s, 0);
    ctx.fillStyle = 'rgba(255,236,160,0.85)';
    ctx.fillRect(cx - s * 1.2, cy + s * 1.4, s * 2.2, s * 0.24);
    ctx.fillStyle = 'rgba(255,225,120,0.25)'; ctx.fillRect(cx - s * 1.2, cy + s * 1.25, s * 2.2, s * 0.55);
    dessinerChampignon(ctx, cx - s * 3.3, cy + s * 0.9, s, 0, 0);
    dessinerChampignon(ctx, cx + s * 2.6, cy + s * 2.6, s * 0.8, 0, 1);
    // Lanternes allumées
    const lant = [[-2.6, -1.6, true], [2.4, -2.2, true], [-1.5, 0.4, false], [3.1, -0.3, true]];
    for (const l of lant) dessinerLanterne(ctx, cx + l[0] * s, cy + l[1] * s, s * 0.9, l[2], tps);
    dessinerFleur(ctx, cx + s * 2.6, cy - s * 3.4, s * 0.8, tps);
    for (let k = 0; k < 7; k++) dessinerLuciole(ctx, cx + Math.sin(tps * 0.7 + k * 2) * s * 3.2, cy + Math.cos(tps * 0.5 + k * 1.3) * s * 2.6, s * 0.7, tps);
    // Brindille
    dessinerFee(ctx, cx, cy + Math.sin(tps * 2) * s * 0.15, s * 2.1, { dir: 1, phase: tps * 8, lumiere: 1 });
    ctx.restore();
    const lumieres = [
      { x: cx + s * 0.9, y: cy + Math.sin(tps * 2) * s * 0.15, r: s * 3.6 },
      { x: cx - 2.6 * s, y: cy - 1.6 * s, r: s * 2 }, { x: cx + 2.4 * s, y: cy - 2.2 * s, r: s * 2 }, { x: cx + 3.1 * s, y: cy - 0.3 * s, r: s * 2 },
      { x: cx + s * 2.6, y: cy - s * 3.4, r: s * 2.2 },
      { x: W / 2, y: H * 0.1, r: W * 0.6 },
    ];
    dessinerNuit(0.6, lumieres, [], couleurLumiere());
  }

  // --- Démonstrations animées (tutoriel et nouveautés) --------------------------------
  function dessinerDemo(c, w, h, genre, tm) {
    c.setTransform(1, 0, 0, 1, 0, 0);
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#1d2a4a'); g.addColorStop(1, '#0e1430');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    const s = h / 5;
    const sol = h * 0.82;
    const boucle = (d) => (tm % d) / d;
    const main = (x, y, appui) => {
      c.save(); c.translate(x, y); c.scale(appui ? 0.9 : 1, appui ? 0.9 : 1);
      c.fillStyle = '#ffe0c4'; c.strokeStyle = '#a0704a'; c.lineWidth = 3;
      c.beginPath(); c.ellipse(0, s * 0.55, s * 0.32, s * 0.38, 0, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); if (c.roundRect) c.roundRect(-s * 0.1, -s * 0.15, s * 0.2, s * 0.6, s * 0.1); else c.rect(-s * 0.1, -s * 0.15, s * 0.2, s * 0.6); c.fill(); c.stroke();
      if (appui) { c.strokeStyle = 'rgba(255,240,160,0.9)'; c.beginPath(); c.arc(0, -s * 0.2, s * 0.3, 0, Math.PI * 2); c.stroke(); }
      c.restore();
    };
    const branche = (x, y, l) => dessinerBranche(c, x, y, l, s, 0);
    if (genre === 'base') {
      const etape = Math.floor(tm / 2.4) % 3, u = (tm % 2.4) / 2.4;
      c.fillStyle = 'rgba(255,255,255,0.06)'; c.fillRect(etape === 1 ? 0 : w / 2, 0, w / 2, h);
      if (etape === 2) c.fillRect(0, 0, w, h);
      branche(0, sol, w);
      let fx = w * 0.5, fy = sol - s * 0.5, dir = 1;
      if (etape === 0) { fx = w * 0.3 + u * w * 0.35; fy = sol - s * 0.5 - Math.sin(Math.min(1, u * 1.3) * Math.PI) * s * 1.4; dir = 1; main(w * 0.78, h * 0.32, u < 0.2); }
      else if (etape === 1) { fx = w * 0.7 - u * w * 0.35; fy = sol - s * 0.5 - Math.sin(Math.min(1, u * 1.3) * Math.PI) * s * 1.4; dir = -1; main(w * 0.22, h * 0.32, u < 0.2); }
      else { fx = w * 0.5; fy = sol - s * 0.5 - Math.sin(Math.min(1, u * 1.15) * Math.PI) * s * 3; main(w * 0.8, h * 0.4, u < 0.1 || (u > 0.15 && u < 0.25)); }
      dessinerFee(c, fx, fy, s * 1.3, { dir, phase: tm * 14, lumiere: 1 });
      return etape;
    }
    if (genre === 'lanterne') {
      branche(w * 0.1, sol, w * 0.8);
      const u = boucle(3);
      const fx = w * 0.2 + Math.min(1, u * 1.6) * w * 0.45;
      dessinerLanterne(c, w * 0.68, h * 0.45, s, u > 0.6, tm);
      dessinerFee(c, fx, sol - s * 0.5 - Math.sin(Math.min(1, u * 1.6) * Math.PI) * s * 1.2, s * 1.2, { dir: 1, phase: tm * 12 });
      return 0;
    }
    if (genre === 'pont') {
      branche(0, sol, w * 0.3);
      const u = boucle(3.5);
      const fx = w * 0.15 + Math.min(1, u * 1.4) * w * 0.55;
      const d = Math.abs(fx - w * 0.55);
      const a = Math.max(0, 1 - d / (w * 0.3));
      c.fillStyle = 'rgba(255,236,160,' + (0.15 + 0.85 * a) + ')'; c.fillRect(w * 0.4, sol - s * 0.8, w * 0.35, s * 0.25);
      c.fillStyle = 'rgba(255,225,120,' + 0.25 * a + ')'; c.fillRect(w * 0.4, sol - s * 1.0, w * 0.35, s * 0.6);
      dessinerFee(c, fx, sol - s * 0.5 - Math.sin(Math.min(1, u * 1.4) * Math.PI) * s * 1.0, s * 1.2, { dir: 1, phase: tm * 12 });
      return 0;
    }
    if (genre === 'luciole') {
      branche(0, sol, w);
      const u = boucle(4);
      const e = u < 0.6 ? 1 - u : 1;
      c.fillStyle = '#332'; c.fillRect(w * 0.1, h * 0.1, w * 0.3, s * 0.3);
      c.fillStyle = e < 0.5 ? '#ff8a5b' : '#ffd36b'; c.fillRect(w * 0.1, h * 0.1, w * 0.3 * e, s * 0.3);
      const fx = w * 0.25 + Math.min(1, u / 0.6) * w * 0.4;
      if (u < 0.6) dessinerLuciole(c, w * 0.66, sol - s * 1.6, s, tm);
      dessinerFee(c, fx, sol - s * 0.5 - Math.sin(Math.min(1, u / 0.6) * Math.PI) * s * 1.1, s * 1.2, { dir: 1, phase: tm * 12, lumiere: Math.max(0.2, e) });
      return 0;
    }
    if (genre === 'ronce') {
      branche(0, sol, w * 0.3); branche(w * 0.7, sol, w * 0.3);
      for (let k = 0; k < 4; k++) dessinerRonces(c, w * 0.32 + k * s * 0.95, sol - s * 0.3, s, tm);
      const u = boucle(3);
      const fx = w * 0.15 + u * w * 0.7;
      dessinerFee(c, fx, sol - s * 0.5 - Math.sin(u * Math.PI) * s * 1.8, s * 1.2, { dir: 1, phase: tm * 12 });
      return 0;
    }
    if (genre === 'champignon') {
      dessinerChampignon(c, w * 0.45, sol - s * 0.7, s * 1.2, Math.max(0, 1 - boucle(2) * 6), 1);
      const u = boucle(2);
      dessinerFee(c, w * 0.52, sol - s * 1.2 - Math.sin(u * Math.PI) * s * 2.8, s * 1.2, { dir: 1, phase: tm * 12 });
      return 0;
    }
    if (genre === 'feuille') {
      const u = boucle(4);
      const fx = w * 0.15 + Math.min(1, u * 1.5) * w * 0.3;
      const o = Math.max(0, Math.min(1, (u - 0.25) * 3));
      for (let k = 0; k < 3; k++) dessinerFeuille(c, w * 0.48 + k * s * 0.9, sol - s * 0.6, s, u > 0.85 ? Math.max(0, 1 - (u - 0.85) * 7) : o);
      branche(0, sol, w * 0.35);
      dessinerFee(c, fx, sol - s * 0.5 - Math.sin(Math.min(1, u * 1.5) * Math.PI) * s * 0.5, s * 1.2, { dir: 1, phase: tm * 12 });
      return 0;
    }
    if (genre === 'pollen') {
      branche(0, sol, w);
      const u = boucle(3);
      const fx = u < 0.5 ? w * 0.2 + u * 2 * w * 0.3 : w * 0.5 - (u - 0.5) * 2 * w * 0.3;
      dessinerNuage(c, w * 0.66, sol - s * 1.0, s * 1.2, tm);
      dessinerFee(c, fx, sol - s * 0.8, s * 1.2, { dir: 1, phase: tm * 12, eternue: u > 0.5 && u < 0.75 });
      return 0;
    }
    if (genre === 'eau') {
      branche(0, sol - s * 0.2, w * 0.3);
      c.fillStyle = 'rgba(70,150,230,0.85)'; c.fillRect(w * 0.3, sol, w * 0.7, h - sol);
      dessinerLanterne(c, w * 0.15, sol - s * 1.6, s, true, tm);
      const u = boucle(3);
      if (u < 0.6) dessinerFee(c, w * 0.2 + u * w * 0.6, sol - s * 1.4 + u * s * 2.5, s * 1.2, { dir: 1, phase: tm * 12 });
      else dessinerFee(c, w * 0.15, sol - s * 1.0, s * 1.2, { dir: 1, phase: tm * 12, clignote: u });
      return 0;
    }
    if (genre === 'miroir' || genre === 'chaine') {
      const u = boucle(4);
      const actif = u > 0.3;
      const mx = w * 0.2, my = sol - s * 0.4;
      if (genre === 'miroir') {
        if (actif) { c.strokeStyle = 'rgba(220,250,255,0.6)'; c.lineWidth = s * 0.5; c.lineCap = 'round'; c.beginPath(); c.moveTo(mx, my); c.lineTo(w * 0.78, h * 0.15); c.stroke(); }
        dessinerMiroir(c, mx, my, s * 1.2, '/', actif, tm);
        dessinerLanterne(c, w * 0.78, h * 0.25, s, u > 0.45, tm);
      } else {
        const m2x = w * 0.75;
        if (actif) { c.strokeStyle = 'rgba(220,250,255,0.6)'; c.lineWidth = s * 0.5; c.lineCap = 'round'; c.beginPath(); c.moveTo(mx, my); c.lineTo(m2x, my); c.stroke(); }
        if (u > 0.5) { c.beginPath(); c.moveTo(m2x, my); c.lineTo(m2x, h * 0.1); c.stroke(); }
        dessinerMiroir(c, mx, my, s * 1.2, '>', actif, tm);
        dessinerMiroir(c, m2x, my, s * 1.2, 'u', u > 0.5, tm);
        dessinerLanterne(c, m2x, h * 0.22, s, u > 0.6, tm);
      }
      dessinerFee(c, mx - s * 0.2 + Math.min(1, u * 3) * s * 0.6, sol - s * 1.3, s * 1.2, { dir: 1, phase: tm * 12 });
      return 0;
    }
    if (genre === 'monstre') {
      branche(0, sol, w);
      const u = boucle(5);
      const m = { dir: -1, calme: Math.max(0, Math.min(1, (u - 0.2) * 2)), apaise: u > 0.7 };
      dessinerMonstre(c, w * 0.66, sol, s * 1.2, m, tm);
      dessinerFee(c, w * 0.3, sol - s * 0.8, s * 1.2, { dir: 1, phase: tm * 12 });
      c.save(); c.globalCompositeOperation = 'lighter';
      const gg = c.createRadialGradient(w * 0.38, sol - s * 0.8, 0, w * 0.38, sol - s * 0.8, s * 3);
      gg.addColorStop(0, 'rgba(255,220,120,0.35)'); gg.addColorStop(1, 'rgba(255,220,120,0)');
      c.fillStyle = gg; c.fillRect(0, 0, w, h); c.restore();
      return 0;
    }
    if (genre === 'branche') {
      for (let k = 0; k < 5; k++) dessinerRonces(c, k * s * 1.4 + s * 0.5, sol, s, tm);
      const x = w * 0.5 + Math.sin(tm * Math.PI / 2) * w * 0.25 - s;
      dessinerBranche(c, x, sol - s * 0.8, s * 2, s, 0);
      dessinerFee(c, x + s, sol - s * 1.25, s * 1.2, { dir: 1, phase: tm * 4 });
      return 0;
    }
    if (genre === 'vent') {
      branche(0, sol, w);
      const u = boucle(3);
      for (let k = 0; k < 8; k++) { c.fillStyle = 'rgba(120,200,110,0.9)'; c.beginPath(); c.ellipse(((k * 97 + tm * 300) % (w + 40)) - 20, h * 0.15 + k * h * 0.08, s * 0.2, s * 0.08, tm * 5 + k, 0, Math.PI * 2); c.fill(); }
      dessinerFee(c, w * 0.3 + u * w * 0.4, sol - s * 1.2, s * 1.2, { dir: -1, phase: tm * 14 });
      return 0;
    }
    return 0;
  }

  let dernierHud = '';
  function majHud(leger) {
    if (!niv) return;
    const total = niv.lanternes.length, faites = niv.lanternes.filter((l) => l.allumee).length;
    const cle = niveauCourant + '|' + coeurs + '|' + faites + '|' + F.plumes;
    if (!leger || cle !== dernierHud) {
      dernierHud = cle;
      $('hud-niveau').textContent = tr('hud.niveau', { n: niveauCourant + 1 });
      let c = ''; for (let k = 0; k < 3; k++) c += SVG_COEUR(k < coeurs);
      $('hud-coeurs').innerHTML = c;
      $('hud-coeurs').setAttribute('aria-label', tr('hud.coeurs', { n: coeurs }));
      $('hud-lanternes-n').textContent = tr('hud.compte', { a: faites, b: total });
      $('hud-lanternes').setAttribute('aria-label', tr('hud.lanternes', { a: faites, b: total }));
      let p = ''; for (let k = 0; k < 2; k++) p += SVG_PLUME(k < F.plumes);
      $('hud-plumes').innerHTML = p;
    }
    $('jauge-remplie').style.width = Math.max(0, energie) + '%';
    $('jauge').classList.toggle('faible', energie < 25);
  }

  function majBoutonsSon() {

  const ECRANS = ['ecran-titre', 'ecran-niveaux', 'ecran-atelier', 'ecran-tuto', 'ecran-nouveau', 'ecran-pause', 'ecran-fin'];
  function fermerEcrans() { for (const id of ECRANS) $(id).hidden = true; ecranOuvert = null; }
  function ouvrir(id, nom) {
    for (const e of ECRANS) $(e).hidden = e !== id;
    ecranOuvert = nom || id;
    tenus.clear(); touches.g = touches.d = false;
    const premier = $(id).querySelector('button.principal, button:not(:disabled)');
    if (premier) setTimeout(() => { try { premier.focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30);
  }

  function allerTitre() {
    partieEnCours = false; enPause = false; niv = null; finEtat = null;
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
    $('hud').hidden = true;
    ouvrir('ecran-titre', 'titre');
    if (effacerBtn && effacerBtn.maj) effacerBtn.maj();
  }

  // Tutoriel
  let demoAnim = null;
  function animerDemo(canvasId, genre, surEtape) {
    const cv = $(canvasId), c = cv.getContext('2d');
    const t0 = performance.now();
    if (demoAnim) cancelAnimationFrame(demoAnim);
    const boucle = () => {
      if ($(canvasId).closest('.ecran').hidden) { demoAnim = null; return; }
      const tm = (performance.now() - t0) / 1000;
      const etape = dessinerDemo(c, cv.width, cv.height, genre, tm);
      if (surEtape) surEtape(etape);
      demoAnim = requestAnimationFrame(boucle);
    };
    boucle();
  }
  let apresTuto = null;
  function montrerTuto(suite) {
    apresTuto = suite || null;
    ouvrir('ecran-tuto', 'tuto');
    let derniere = -1;
    animerDemo('demo-tuto', 'base', (e) => { if (e !== derniere) { derniere = e; $('tuto-texte').textContent = tr('tuto.' + (e + 1)); } });
  }
  function fermerTuto() {
    SON.clic();
    $('ecran-tuto').hidden = true; ecranOuvert = null;
    const s = apresTuto; apresTuto = null;
    if (s) s(); else if (partieEnCours) ouvrir('ecran-pause', 'pause');
    else allerTitre();
  }
  let apresNouveau = null;

  function fermerNouveau() {

  // Pause
  function mettrePause() {
    if (!partieEnCours || ecranOuvert || finEtat) return;
    enPause = true;
    if (actx && actx.state === 'running') actx.suspend().catch(() => {});
    ouvrir('ecran-pause', 'pause');
  }
  function reprendre() {
    enPause = false;
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
    $('ecran-pause').hidden = true; ecranOuvert = null;
    SON.clic();
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden && partieEnCours && !ecranOuvert && !finEtat) mettrePause(); });

  // Sélection des niveaux
  function ouvrirNiveaux() {
    SON.clic();
    chargerProgression();
    const g = $('grille-mondes');
    g.innerHTML = '';
    for (let m = 0; m < 4; m++) {
      const bloc = document.createElement('div'); bloc.className = 'monde';
      const h = document.createElement('h3'); h.textContent = tr('monde.' + m); bloc.appendChild(h);
      const cases = document.createElement('div'); cases.className = 'cases';
      for (let k = 0; k < 5; k++) {
        const i = m * 5 + k;
        const b = document.createElement('button'); b.type = 'button'; b.className = 'case';
        const ouvert = i < prog.debloque;
        if (ouvert) {
          const n = document.createElement('span'); n.textContent = nb(i + 1); b.appendChild(n);
          const e = document.createElement('span'); e.className = 'etoiles-mini';
          let html = ''; for (let s = 0; s < 3; s++) html += s < prog.etoiles[i] ? SVG_ETOILE() : SVG_ETOILE_VIDE;
