          b.setAttribute('aria-label', tr('niveaux.bouton', { n: i + 1, e: prog.etoiles[i] }));
          b.addEventListener('click', () => { SON.clic(); demarrerNiveau(i); });
        } else {
          b.disabled = true; b.innerHTML = SVG_CADENAS;
          b.setAttribute('aria-label', tr('niveaux.ferme', { n: i + 1 }));
        }
        cases.appendChild(b);
      }
      bloc.appendChild(cases); g.appendChild(bloc);
    }
    $('total-etoiles').textContent = tr('etoilesTotal', { n: totalEtoiles(), max: MAX_ETOILES });
    ouvrir('ecran-niveaux', 'niveaux');
  }

  // Atelier
  let apercuAnim = null;
  function ouvrirAtelier() {
    SON.clic();
    chargerProgression();
    const total = totalEtoiles();
    $('atelier-etoiles').textContent = tr('atelier.etoiles', { n: total });
    const remplir = (id, liste, champ, prefixe) => {
      const zone = $(id); zone.innerHTML = '';
      for (const o of liste) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'option' + (prog[champ] === o.id ? ' choisi' : '');
        const cv = document.createElement('canvas'); cv.width = 108; cv.height = 108; b.appendChild(cv);
        const nom = document.createElement('span'); nom.textContent = tr(prefixe + o.id); b.appendChild(nom);
        const libre = total >= o.besoin;
        if (!libre) {
          b.disabled = true;
          const bs = document.createElement('span'); bs.className = 'besoin'; bs.innerHTML = SVG_ETOILE();
          const n = document.createElement('span'); n.textContent = nb(o.besoin); bs.appendChild(n); b.appendChild(bs);
          b.setAttribute('aria-label', tr('atelier.ferme', { nom: tr(prefixe + o.id), n: o.besoin }));
        } else b.setAttribute('aria-label', tr(prefixe + o.id));
        b.setAttribute('aria-pressed', prog[champ] === o.id ? 'true' : 'false');
        b.addEventListener('click', () => {
          prog[champ] = o.id; ecrireStockage(champ === 'ailes' ? 'brindille-ailes' : 'brindille-couleur', o.id);
          SON.clic(); ouvrirAtelierMaj();
        });
        const c = cv.getContext('2d');
        b._dessin = (tm) => {
          c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 108, 108);
          const opts = { dir: 1, phase: tm * 10, ailes: champ === 'ailes' ? o.id : prog.ailes, couleur: champ === 'couleurs' ? o.id : (champ === 'couleur' ? o.id : prog.couleur) };
          if (!libre) c.globalAlpha = 0.4;
          dessinerFee(c, 50, 58, 70, opts);
          c.globalAlpha = 1;
        };
        zone.appendChild(b);
      }
    };
    remplir('choix-ailes', AILES, 'ailes', 'aile.');
    remplir('choix-couleurs', COULEURS, 'couleur', 'couleur.');
    if (ecranOuvert !== 'atelier') ouvrir('ecran-atelier', 'atelier');
    const t0 = performance.now();
    if (apercuAnim) cancelAnimationFrame(apercuAnim);
    const cvA = $('apercu'), cA = cvA.getContext('2d');
    const boucle = () => {
      if ($('ecran-atelier').hidden) { apercuAnim = null; return; }
      const tm = (performance.now() - t0) / 1000;
      cA.setTransform(1, 0, 0, 1, 0, 0);
      const g = cA.createRadialGradient(150, 120, 5, 150, 120, 130);
      const col = couleurLumiere();
      g.addColorStop(0, rgba(col, 0.5)); g.addColorStop(1, 'rgba(20,18,58,1)');
      cA.fillStyle = g; cA.fillRect(0, 0, 240, 240);
      dessinerFee(cA, 110, 125 + Math.sin(tm * 2) * 6, 130, { dir: 1, phase: tm * 9 });
      document.querySelectorAll('#ecran-atelier .option').forEach((b) => b._dessin && b._dessin(tm));
      apercuAnim = requestAnimationFrame(boucle);
    };
    boucle();
  }
  function ouvrirAtelierMaj() { ouvrirAtelier(); }

  // Fin de niveau
  function calculerEtoiles() {
    const total = niv.lanternes.length, faites = niv.lanternes.filter((l) => l.allumee).length;
    if (faites >= total) return 3;
    if (faites * 2 >= total) return 2;
    return 1;
  }
  function boutonFin(cle, principal, action) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn' + (principal ? ' principal' : '');
    b.textContent = tr(cle); b.addEventListener('click', () => { SON.clic(); action(); });
    $('fin-actions').appendChild(b);
  }
  function afficherDetailFin(faites, total) {
    let d = tr('fin.lanternes', { a: faites, b: total });
    if (lucNiv) d += ' · ' + tr('fin.lucioles', { n: lucNiv });
    if (monNiv) d += ' · ' + tr('fin.monstres', { n: monNiv });
    $('fin-detail').textContent = d;
  }
  function compter(el, cible, cle) {
    const t0 = performance.now();
    const pas = () => {
      const u = Math.min(1, (performance.now() - t0) / 900);
      el.textContent = tr(cle, { n: Math.round(cible * (1 - Math.pow(1 - u, 3))) });
      if (u < 1 && !$('ecran-fin').hidden) requestAnimationFrame(pas);
    };
    pas();
  }
  function montrerVictoire() {
    const i = niveauCourant;
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
    const etoiles = calculerEtoiles();
    const total = niv.lanternes.length, faites = niv.lanternes.filter((l) => l.allumee).length;
    const bonusTemps = Math.max(0, 300 - Math.floor(tempsNiv) * 2);
    const score = scoreNiv + coeurs * 50 + bonusTemps;
    const avant = totalEtoiles();
    const ancienRecord = prog.records[i];
    const record = score > ancienRecord;
    prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
    if (record) prog.records[i] = score;
    prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2));
    prog.score = scoreCumule();
    sauver(Math.min(i + 2, NIVEAUX.length));
    partieEnCours = false;
    // Jeu terminé : tous les niveaux gagnés au moins une fois
    if (prog.etoiles.every((e) => e > 0)) {
      if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: MAX_ETOILES });
    }
    // Écran
    $('fin-titre').textContent = tr('fin.gagne');
    $('fin-sous').textContent = tr('fin.gagneSous');
    const zone = $('fin-etoiles'); zone.innerHTML = SVG_ETOILE() + SVG_ETOILE() + SVG_ETOILE();
    const svgs = zone.querySelectorAll('svg');
    zone.setAttribute('role', 'img'); zone.setAttribute('aria-label', tr('etoiles', { n: etoiles }));
    for (let k = 0; k < etoiles; k++) setTimeout(() => { svgs[k].classList.add('gagnee'); SON.etoile(k); }, 350 + k * 380);
    compter($('fin-score'), score, 'fin.score');
    $('fin-record').className = record ? 'record' : '';
    $('fin-record').textContent = record ? tr('fin.record') : tr('fin.recordAncien', { n: ancienRecord });
    afficherDetailFin(faites, total);
    // Déblocages
    const apres = totalEtoiles();
    const nouveaux = [];
    for (const a of AILES) if (a.besoin > avant && a.besoin <= apres) nouveaux.push(tr('aile.' + a.id));
    for (const c of COULEURS) if (c.besoin > avant && c.besoin <= apres) nouveaux.push(tr('couleur.' + c.id));
    $('fin-debloque').hidden = !nouveaux.length;
    if (nouveaux.length) $('fin-debloque').textContent = tr('fin.debloque', { nom: nouveaux.join(', ') });
    const dernier = i === NIVEAUX.length - 1;
    $('fin-final').hidden = !dernier;
    if (dernier) $('fin-final').textContent = tr('final.texte', { e: apres, max: MAX_ETOILES, s: scoreCumule() });
    if (dernier) $('fin-titre').textContent = tr('final.titre');
    $('fin-actions').innerHTML = '';
    if (!dernier) boutonFin('suivant', true, () => demarrerNiveau(i + 1));
    boutonFin('rejouer', dernier, () => demarrerNiveau(i));
    boutonFin('niveaux', false, ouvrirNiveaux);
    if (dernier) boutonFin('pause.accueil', false, allerTitre);
    $('hud').hidden = true;
    ouvrir('ecran-fin', 'fin');
  }
  function montrerDefaite() {
    const i = niveauCourant;
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: i + 1 });
    SON.defaite();
    partieEnCours = false;
    const total = niv.lanternes.length, faites = niv.lanternes.filter((l) => l.allumee).length;
    $('fin-titre').textContent = tr('fin.perdu');
    $('fin-sous').textContent = tr('fin.perduSous');
    $('fin-etoiles').innerHTML = SVG_ETOILE_VIDE + SVG_ETOILE_VIDE + SVG_ETOILE_VIDE;
    $('fin-etoiles').setAttribute('role', 'img'); $('fin-etoiles').setAttribute('aria-label', tr('etoiles', { n: 0 }));
    compter($('fin-score'), scoreNiv, 'fin.score');
    $('fin-record').className = '';
    $('fin-record').textContent = tr('fin.recordAncien', { n: prog.records[i] });
    afficherDetailFin(faites, total);
    $('fin-debloque').hidden = true; $('fin-final').hidden = true;
    $('fin-actions').innerHTML = '';
    boutonFin('reessayer', true, () => demarrerNiveau(i));
    boutonFin('niveaux', false, ouvrirNiveaux);
    boutonFin('pause.accueil', false, allerTitre);
    $('hud').hidden = true;
    ouvrir('ecran-fin', 'fin');
  }

  // Boutons
  $('btn-jouer').addEventListener('click', () => {
    audio(); SON.clic();
    const lancer = () => {
      if (window.JEL_SAVE) {
        window.JEL_SAVE.reprise({
          jeu: JEU,
          onContinuer: (d) => { const n = chargerProgression(d); demarrerNiveau(n - 1); },
          onNouvelle: () => { chargerProgression(); demarrerNiveau(0); },
          onEffacer: () => { Object.assign(prog, { etoiles: new Array(NIVEAUX.length).fill(0), records: new Array(NIVEAUX.length).fill(0), debloque: 1, vus: [], score: 0 }); demarrerNiveau(0); },
        });
      } else demarrerNiveau(0);
    };
    lancer();
  });
  $('btn-niveaux').addEventListener('click', ouvrirNiveaux);
  $('btn-atelier').addEventListener('click', ouvrirAtelier);
  $('btn-aide').addEventListener('click', () => { audio(); SON.clic(); montrerTuto(() => allerTitre()); });
  $('btn-niveaux-retour').addEventListener('click', () => { SON.clic(); allerTitre(); });
  $('btn-atelier-retour').addEventListener('click', () => { SON.clic(); allerTitre(); });
  $('btn-son-titre').addEventListener('click', basculerSon);
  $('btn-son-jeu').addEventListener('click', basculerSon);
  $('btn-pause').addEventListener('click', () => { audio(); SON.clic(); mettrePause(); });
  $('btn-reprendre').addEventListener('click', reprendre);
  $('btn-recommencer').addEventListener('click', () => { SON.clic(); demarrerNiveau(niveauCourant); });
  $('btn-pause-aide').addEventListener('click', () => { SON.clic(); montrerTuto(() => ouvrir('ecran-pause', 'pause')); });
  $('btn-accueil').addEventListener('click', () => { SON.clic(); allerTitre(); });
  $('btn-tuto').addEventListener('click', (e) => { e.stopPropagation(); fermerTuto(); });
  // Un toucher sur le fond ou sur l'animation passe aussi le tutoriel et les cartes.
  $('ecran-tuto').addEventListener('click', (e) => { if (e.target === $('ecran-tuto') || e.target.id === 'demo-tuto') fermerTuto(); });
  $('btn-nouveau').addEventListener('click', (e) => { e.stopPropagation(); fermerNouveau(); });
  $('ecran-nouveau').addEventListener('click', (e) => { if (e.target === $('ecran-nouveau') || e.target.id === 'demo-nouveau') fermerNouveau(); });

  let effacerBtn = null;
  if (window.JEL_SAVE && window.JEL_SAVE.boutonEffacer) {
    effacerBtn = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('zone-effacer'), apres: () => { Object.assign(prog, { etoiles: new Array(NIVEAUX.length).fill(0), records: new Array(NIVEAUX.length).fill(0), debloque: 1, vus: [], score: 0 }); } });
  }

  // Sauvegarde à la fermeture de la page, seulement pendant une partie
  if (window.JEL_SAVE) {
    window.JEL_SAVE.surFermeture(() => { if (partieEnCours) sauver(niveauCourant + 1); });
  }

  // ------------------------------------------------------------------------
  // Boucle principale
  // ------------------------------------------------------------------------
  let avant = performance.now();
  function boucle(maintenant) {
    const dt = Math.min(0.05, Math.max(0, (maintenant - avant) / 1000));
    avant = maintenant;
    if (niv && (partieEnCours || finEtat) && !enPause && !ecranOuvert) { tps += dt; maj(dt); }
    else if (!niv) tps += dt;
    try {
      if (niv) dessinerJeu(); else dessinerTitre();
    } catch (e) { setTimeout(() => { throw e; }); }
    requestAnimationFrame(boucle);
  }

  chargerProgression();
  majBoutonsSon();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
