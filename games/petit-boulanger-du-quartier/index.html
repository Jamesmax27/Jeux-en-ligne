  // ---------------------------------------------------------------------
  // Construction de l'écran de jeu
  // ---------------------------------------------------------------------
  function lancerNiveau(i) {
    if (jeu) jeu.fini = true;
    fermerVoiles();
    const def = NIVEAUX[i];
    etat.enPartie = true;
    etat.niveauReprise = i + 1;
    const clients = genererClients(def, i);
    jeu = {
      i, def, clients, prochain: 0, horloge: 0, temps: 0, derniereArrivee: -9,
      places: [null, null, null],
      recette: RECETTES[def.nouveau] ? def.nouveau : def.recettes[0],
      bol: { ajoutes: [], petri: 0, pret: false },
      fours: Array(def.fours).fill(null),
      vitrine: Array(VITRINE).fill(null),
      farine: def.moulin ? def.farine : Infinity,
      ble: def.moulin ? def.ble : 0,
      moulin: { actif: false, t: 0 },
      champ: def.champ ? [{ t: POUSSE }, { t: POUSSE * 0.5 }, { t: 0 }] : [],
      pigeon: null,
      prochainPigeon: def.pigeons ? def.pigeons * 0.7 : Infinity,
      pieces: 0, max: piecesMax(clients), contents: 0, mecontents: 0, dores: 0,
      pause: false, bloque: false, fini: false,
    };
    app.classList.remove('en-pause', 'bloque');
    construireJeu();
    afficherEcran('jeu');
    if (i === 0 && !prog.vus.tuto) {
      prog.vus.tuto = true;
      setTimeout(() => lancerTuto(), 350);
    } else if (def.nouveau && def.nouveau !== 'tuto' && !prog.vus[def.nouveau]) {
      prog.vus[def.nouveau] = true;
      montrerAstuce(def.nouveau);
    }
  }

  function construireJeu() {
    dessinerDecorBoutique();
    $('hud-jour').textContent = t('jour', { n: nb(jeu.i + 1) });
    document.querySelectorAll('#places .place').forEach((p) => { p.innerHTML = ''; });
    // Onglets des recettes
    const rec = $('recettes');
    rec.innerHTML = '';
    jeu.def.recettes.forEach((r, k) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'onglet';
      b.dataset.recette = r;
      b.innerHTML = svgPain(r, 'dore');
      b.setAttribute('aria-label', t('aria.recette', { nom: t('pain.' + r) }));
      b.addEventListener('click', () => choisirRecette(r));
      rec.appendChild(b);
      if (k === 0) b.dataset.premier = '1';
    });
    // Ingrédients utiles dans cette journée
    const utiles = ORDRE_ING.filter((id) => jeu.def.recettes.some((r) => RECETTES[r].ing.includes(id)));
    jeu.ingredients = utiles;
    const ing = $('ingredients');
    ing.innerHTML = '';
    ing.style.gridTemplateColumns = `repeat(${Math.min(5, Math.max(4, utiles.length))}, 1fr)`;
    utiles.forEach((id, k) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'ing';
      b.dataset.ing = id;
      b.innerHTML = svgIng(id) + `<span class="touche" aria-hidden="true">${(k + 1) % 10}</span>`;
      b.setAttribute('aria-label', t('ing.' + id));
      b.addEventListener('click', () => ajouterIngredient(id, b));
      ing.appendChild(b);
    });
    // Fours
    const f = $('fours');
    f.innerHTML = '';
    jeu.fours.forEach((_, k) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'four';
      b.setAttribute('aria-label', t('aria.four', { n: nb(k + 1) }));
      b.innerHTML = '<div class="bouche"></div><div class="jauge"><i></i></div>';
      b.addEventListener('click', () => toucherFour(k));
      f.appendChild(b);
    });
    // Vitrine
    const v = $('vitrine');
    v.innerHTML = '';
    for (let k = 0; k < VITRINE; k++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'case vide';
      b.addEventListener('click', () => toucherVitrine(k));
      v.appendChild(b);
    }
    // Réserve : moulin et champ
    $('reserve').classList.toggle('visible', !!jeu.def.moulin);
    $('champ').classList.toggle('visible', !!jeu.def.champ);
    $('moulin').innerHTML = svgMoulin() + '<div class="avance"><i></i></div>';
    const ch = $('champ');
    ch.innerHTML = '';
    jeu.champ.forEach((_, k) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'parcelle';
      b.setAttribute('aria-label', t('aria.parcelle'));
      b.addEventListener('click', () => toucherParcelle(k));
      ch.appendChild(b);
    });
    $('bol').classList.remove('attend');
    majTout();
  }

  function majTout() {
    majHud();
    majRecettes();
    majBol();
    jeu.fours.forEach((_, k) => majFour(k));
    majVitrine();
    majReserve();
    jeu.champ.forEach((_, k) => majParcelle(k, true));
    majFile();
  }

  function majHud() {
    $('hud-pieces').innerHTML = svgPiece() + `<span>${nb(jeu.pieces)}</span>`;
    $('hud-pieces').setAttribute('aria-label', t('aria.pieces', { n: nb(jeu.pieces) }));
    $('hud-coeurs').innerHTML = Array.from({ length: COEURS }, (_, k) => svgCoeur(k >= jeu.mecontents)).join('');
    $('hud-coeurs').setAttribute('aria-label', t('aria.coeurs', { n: nb(jeu.mecontents), max: nb(COEURS) }));
    const partis = jeu.contents + jeu.mecontents;
    $('hud-progres').style.width = (100 * partis / jeu.clients.length) + '%';
  }
  function majRecettes() {
    document.querySelectorAll('#recettes .onglet').forEach((b) => b.classList.toggle('actif', b.dataset.recette === jeu.recette));
  }
  function majBol() {
    const b = jeu.bol;
    const rec = RECETTES[jeu.recette].ing;
    $('bol').innerHTML = svgBol();
    // Carte : les ingrédients de la recette, cochés quand ils sont dans le bol.
    const restants = b.ajoutes.slice();
    $('carte').innerHTML = rec.map((id) => {
      const k = restants.indexOf(id);
      const mis = k >= 0 || b.petri > 0 || b.pret;
      if (k >= 0) restants.splice(k, 1);
      return `<span class="${mis ? 'mis' : ''}">${svgIng(id)}</span>`;
    }).join('');
    $('jauge-petrir').style.width = (b.pret ? 100 : (100 * b.petri / PETRIR)) + '%';
    const complet = b.ajoutes.length >= rec.length;
    $('bol').classList.toggle('attend', complet || b.pret);
  }
  function majFour(k) {
    const el = $('fours').children[k];
    const f = jeu.fours[k];
    const bouche = el.querySelector('.bouche');
    el.classList.toggle('pret', !!f && (f.etat === 'dore' || f.etat === 'cuit'));
    el.classList.toggle('brule', !!f && f.etat === 'brule');
    if (!f) { bouche.innerHTML = ''; el.querySelector('.jauge i').style.left = '0%'; return; }
    bouche.innerHTML = svgPain(f.recette, f.etat) + svgPain(f.recette, f.etat);
    majJaugeFour(k);
  }
  function majJaugeFour(k) {
    const f = jeu.fours[k];
    if (!f) return;
    const r = f.t / RECETTES[f.recette].cuisson;
    $('fours').children[k].querySelector('.jauge i').style.left = Math.min(100, (100 * r) / BRULE) + '%';
  }
  function majVitrine() {
    $('vitrine').querySelectorAll('.case').forEach((b, k) => {
      const p = jeu.vitrine[k];
      b.className = 'case' + (p ? (p.qualite === 'dore' ? ' dore' : '') : ' vide');
      b.innerHTML = p ? svgPain(p.recette, p.qualite) : '';
      b.setAttribute('aria-label', p ? t('pain.' + p.recette) : t('aria.caseVide'));
    });
  }
  function majReserve() {
    if (!jeu.def.moulin) return;
    const sf = $('stock-farine');
    sf.innerHTML = svgIng('farine') + `<span>${nb(jeu.farine)}</span>`;
    sf.classList.toggle('vide', jeu.farine <= 0);
    sf.setAttribute('aria-label', t('aria.stockFarine', { n: nb(jeu.farine) }));
    const sb = $('stock-ble');
    sb.innerHTML = `<svg viewBox="0 0 40 40" aria-hidden="true">${dessinSacBle()}</svg><span>${nb(jeu.ble)}</span>`;
    sb.classList.toggle('vide', jeu.ble <= 0);
    sb.setAttribute('aria-label', t('aria.stockBle', { n: nb(jeu.ble) }));
    majMoulin();
  }
  function majMoulin() {
    $('moulin').classList.toggle('tourne', jeu.moulin.actif);
    $('moulin').querySelector('.avance i').style.width = (jeu.moulin.actif ? (100 * jeu.moulin.t / DUREE_MOULIN) : 0) + '%';
  }
  function majParcelle(k, force) {
    const p = jeu.champ[k];
    const pas = Math.floor(Math.min(1, p.t / POUSSE) * 8);
    if (!force && p.pas === pas) return;
    p.pas = pas;
    const b = $('champ').children[k];
    b.innerHTML = svgParcelle(p);
    b.classList.toggle('mure', p.t >= POUSSE);
  }
  function majFile() {
    const attente = jeu.clients.slice(jeu.prochain).filter((c) => c.arrivee <= jeu.horloge).length;
    if (attente === jeu.attenteVue) return;
    jeu.attenteVue = attente;
    const f = $('file');
    f.classList.toggle('visible', attente > 0);
    if (attente > 0) { f.innerHTML = ICONES.personne + `<span>+${nb(attente)}</span>`; f.setAttribute('aria-label', t('aria.file', { n: nb(attente) })); }
  }

  // Message court en haut de l'atelier.
  let minuteurMessage = 0;
  function message(cle, vars) {
    const m = $('message');
    m.textContent = t(cle, vars);
    m.classList.add('visible');
    clearTimeout(minuteurMessage);
    minuteurMessage = setTimeout(() => m.classList.remove('visible'), 1900);
  }
  function secouer(el) {
    if (!el) return;
    el.classList.remove('secoue');
    void el.offsetWidth;
    el.classList.add('secoue');
  }

  // ---------------------------------------------------------------------
  // Effets visuels
  // ---------------------------------------------------------------------
  function centre(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
  function voler(html, de, vers) {
    if (!de || !vers) return;
    const a = centre(de), b = centre(vers);
    const v = document.createElement('div');
    v.className = 'vol';
    v.innerHTML = html;
    v.style.left = (a.x - 22) + 'px';
    v.style.top = (a.y - 16) + 'px';
    app.appendChild(v);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      v.style.transform = `translate(${b.x - a.x}px, ${b.y - a.y}px) scale(.8)`;
      v.style.opacity = '.4';
    }));
    setTimeout(() => v.remove(), 500);
  }
  function particules(el, html, n = 6) {
    if (!el) return;
    const c = centre(el);
    for (let k = 0; k < n; k++) {
      const p = document.createElement('div');
      p.className = 'particule';
      p.innerHTML = html;
      p.style.left = (c.x - 11) + 'px';
      p.style.top = (c.y - 11) + 'px';
      const ang = (Math.PI * 2 * k) / n + Math.random() * 0.6;
      p.style.setProperty('--dx', Math.cos(ang) * (30 + Math.random() * 30) + 'px');
      p.style.setProperty('--dy', (Math.sin(ang) * 30 - 40 - Math.random() * 20) + 'px');
      app.appendChild(p);
      setTimeout(() => p.remove(), 1050);
    }
  }
  function gain(el, n) {
    if (!el) return;
    const c = centre(el);
    const g = document.createElement('div');
    g.className = 'gain';
    g.innerHTML = `<span>+${nb(n)}</span>` + svgPiece();
    g.style.left = (c.x - 20) + 'px';
    g.style.top = (c.y - 30) + 'px';
    app.appendChild(g);
    setTimeout(() => g.remove(), 1050);
    const hp = $('hud-pieces');
    hp.classList.remove('pop'); void hp.offsetWidth; hp.classList.add('pop');
  }
  function confettis() {
    const couleurs = ['#e0603a', '#f2b632', '#4f8cc9', '#6dbf73', '#e86fa6', '#9b6bc9'];
    for (let k = 0; k < 46; k++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = couleurs[k % couleurs.length];
      c.style.animationDuration = 1.6 + Math.random() * 1.6 + 's';
      c.style.animationDelay = Math.random() * 0.5 + 's';
      c.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
      app.appendChild(c);
      setTimeout(() => c.remove(), 3800);
    }
  }
  const NUAGE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a5 5 0 0 1-.5-10A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z" fill="#8f97a6"/></svg>';
  const ETINCELLE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.5 8.5L23 12l-8.5 2.5L12 23l-2.5-8.5L1 12l8.5-2.5z" fill="#ffd34d"/></svg>';
  const PLUME = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20C6 10 12 4 20 3c-1 8-7 14-16 17z" fill="#c3cad6"/></svg>';
  const FUMEE = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#6d6d6d" opacity=".6"/></svg>';
  const FARINE = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="#fffaf0" opacity=".9"/></svg>';

  // ---------------------------------------------------------------------
  // Actions du joueur
  // ---------------------------------------------------------------------
  const actif = () => jeu && etat.ecran === 'jeu' && !jeu.pause && !jeu.bloque && !jeu.fini;

  function choisirRecette(r) {
    if (!actif()) return;
    if (r === jeu.recette) { son.clic(); return; }
    const b = jeu.bol;
    if (b.ajoutes.length || b.petri || b.pret) {
      son.refus();
      message('msg.videBol');
      secouer($('poubelle'));
      return;
    }
    jeu.recette = r;
    son.clic();
    majRecettes();
    majBol();
  }
  function viderBol() {
    if (!actif()) return;
    const b = jeu.bol;
    if (!b.ajoutes.length && !b.petri && !b.pret) { son.clic(); message('msg.bolVide'); return; }
    jeu.bol = { ajoutes: [], petri: 0, pret: false };
    bruit(0.25, 0.1, 600);
    particules($('bol'), FARINE, 5);
    majBol();
  }
  function ajouterIngredient(id, bouton) {
    if (!actif()) return;
    const b = jeu.bol;
    if (b.petri > 0 || b.pret) { son.refus(); secouer(bouton); message(b.pret ? 'msg.pateprete' : 'msg.bolPlein'); return; }
    const rec = RECETTES[jeu.recette].ing;
    const besoin = rec.filter((x) => x === id).length;
    const deja = b.ajoutes.filter((x) => x === id).length;
    if (deja >= besoin) { son.refus(); secouer(bouton); message(besoin ? 'msg.dejaMis' : 'msg.pasDansRecette'); return; }
    if (id === 'farine' && jeu.def.moulin) {
      if (jeu.farine <= 0) { son.refus(); secouer(bouton); secouer($('moulin')); message('msg.plusFarine'); return; }
      jeu.farine--;
      majReserve();
    }
    b.ajoutes.push(id);
    son.ploc();
    voler(svgIng(id), bouton, $('bol'));
    majBol();
    if (b.ajoutes.length >= rec.length) message('msg.petris');
  }
  function actionBol() {
    if (!actif()) return;
    const b = jeu.bol;
    const rec = RECETTES[jeu.recette].ing;
    if (b.pret) { enfourner(-1); return; }
    if (b.ajoutes.length < rec.length) { son.refus(); secouer($('carte')); message('msg.ajouteIng'); return; }
    b.petri++;
    son.petrir();
    const bol = $('bol');
    bol.classList.remove('ecrase'); void bol.offsetWidth; bol.classList.add('ecrase');
    particules(bol, FARINE, 3);
    if (b.petri >= PETRIR) {
      b.pret = true;
      son.pret();
      particules(bol, ETINCELLE, 6);
      message('msg.pateprete');
    }
    majBol();
  }
  function enfourner(k) {
    if (k < 0) k = jeu.fours.findIndex((f) => !f);
    if (k < 0) { son.refus(); message('msg.fourPlein'); secouer($('fours')); return; }
    jeu.fours[k] = { recette: jeu.recette, t: 0, etat: 'cru' };
    jeu.bol = { ajoutes: [], petri: 0, pret: false };
    son.four();
    voler(svgPain(jeu.recette, 'cru'), $('bol'), $('fours').children[k]);
    majFour(k);
    majBol();
  }
  function toucherFour(k) {
    if (!actif()) return;
    const f = jeu.fours[k];
    const el = $('fours').children[k];
    if (!f) {
      if (jeu.bol.pret) enfourner(k);
      else { son.refus(); message('msg.fourVide'); }
      return;
    }
    if (f.etat === 'cru') { son.refus(); secouer(el); message('msg.pasCuit'); return; }
    if (f.etat === 'brule') { jeu.fours[k] = null; son.clic(); majFour(k); return; }
    const libres = [];
    jeu.vitrine.forEach((p, i) => { if (!p) libres.push(i); });
    if (libres.length < PAINS_PAR_PATE) { son.refus(); secouer($('vitrine')); message('msg.vitrinePleine'); return; }
    for (let n = 0; n < PAINS_PAR_PATE; n++) jeu.vitrine[libres[n]] = { recette: f.recette, qualite: f.etat };
    if (f.etat === 'dore') { jeu.dores += PAINS_PAR_PATE; particules(el, ETINCELLE, 7); message('msg.dore'); }
    jeu.fours[k] = null;
    son.sortir();
    voler(svgPain(f.recette, f.etat), el, $('vitrine').children[libres[0]]);
    majFour(k);
    majVitrine();
  }
  function trouverVitrine(r) {
    let v = jeu.vitrine.findIndex((p) => p && p.recette === r && p.qualite === 'dore');
    if (v < 0) v = jeu.vitrine.findIndex((p) => p && p.recette === r);
    return v;
  }
  function toucherVitrine(v) {
    if (!actif()) return;
    const p = jeu.vitrine[v];
    if (!p) { son.clic(); message('msg.vitrineVide'); return; }
    // Le client qui attend ce pain depuis le plus longtemps (patience la plus basse).
    let choix = -1, item = -1, mini = Infinity;
    jeu.places.forEach((c, k) => {
      if (!c || c.parti) return;
      const i = c.items.findIndex((r, n) => r === p.recette && !c.livres[n]);
      if (i >= 0 && c.patience < mini) { mini = c.patience; choix = k; item = i; }
    });
    if (choix < 0) { son.refus(); secouer($('vitrine').children[v]); message('msg.personne'); return; }
    livrer(choix, item, v);
  }
  function servir(k) {
    if (!actif()) return;
    const c = jeu.places[k];
    if (!c || c.parti) return;
    let n = 0;
    c.items.forEach((r, i) => {
      if (c.livres[i] || c.parti) return;
      const v = trouverVitrine(r);
      if (v >= 0) { livrer(k, i, v); n++; }
    });
    if (!n) { son.refus(); secouer(c.el.querySelector('.bulle')); message('msg.pasPret'); }
  }
  function livrer(k, i, v) {
    const c = jeu.places[k];
    const p = jeu.vitrine[v];
    jeu.vitrine[v] = null;
    c.livres[i] = true;
    const g = RECETTES[p.recette].prix + (p.qualite === 'dore' ? 1 : 0);
    jeu.pieces += g;
    voler(svgPain(p.recette, p.qualite), $('vitrine').children[v], c.el);
    son.vente();
    gain(c.el, g);
    if (jeu.pigeon && jeu.pigeon.v === v) viserAutrePain();
    majVitrine();
    majBulle(k);
    majHud();
    if (c.livres.every(Boolean)) clientServi(k);
  }
  function clientServi(k) {
    const c = jeu.places[k];
    c.parti = true;
    if (c.patience / c.patienceMax > 0.5) {
      const pb = POURBOIRE[c.type];
      jeu.pieces += pb;
      setTimeout(() => { if (c.el.isConnected) gain(c.el, pb); }, 350);
    }
    jeu.contents++;
    c.humeur = 'ravi';
    dessinerFigure(c);
    son.content();
    particules(c.el, svgCoeur(true), 6);
    c.el.classList.add('part');
    majHud();
    retirerClient(k, c);
  }
  function clientFache(k) {
    const c = jeu.places[k];
    c.parti = true;
    c.patience = 0;
    jeu.mecontents++;
    c.humeur = 'fache';
    dessinerFigure(c);
    son.fache();
    particules(c.el, NUAGE, 4);
    message('msg.fache');
    app.classList.remove('tremble'); void app.offsetWidth; app.classList.add('tremble');
    c.el.classList.add('part');
    majHud();
    retirerClient(k, c);
    if (jeu.mecontents >= COEURS) finJournee(false);
  }
  function retirerClient(k, c) {
    const j = jeu;
    setTimeout(() => {
      if (jeu !== j) return;
      if (j.places[k] === c) { j.places[k] = null; c.el.remove(); }
    }, 900);
  }
  function toucherMoulin() {
    if (!actif() || !jeu.def.moulin) return;
    const m = jeu.moulin;
    if (m.actif) { m.t = Math.min(DUREE_MOULIN, m.t + 0.6); son.moulin(); majMoulin(); return; }
    if (jeu.ble <= 0) { son.refus(); secouer($('stock-ble')); message(jeu.def.champ ? 'msg.recolte' : 'msg.plusBle'); return; }
    jeu.ble--;
    m.actif = true;
    m.t = 0;
    son.moulin();
    majReserve();
  }
  function finMoulin() {
    jeu.moulin.actif = false;
    jeu.farine += 2;
    son.farine();
    particules($('stock-farine'), FARINE, 5);
    majReserve();
  }
  function toucherParcelle(k) {
    if (!actif()) return;
    const p = jeu.champ[k];
    const el = $('champ').children[k];
    if (p.t < POUSSE) { son.refus(); secouer(el); message('msg.pousse'); return; }
    p.t = 0;
    jeu.ble++;
    son.recolte();
    particules(el, ETINCELLE, 4);
    majParcelle(k, true);
    majReserve();
  }

  // ---------------------------------------------------------------------
  // Clients
  // ---------------------------------------------------------------------
  function arriverClient(k) {
    const d = jeu.clients[jeu.prochain++];
    jeu.derniereArrivee = jeu.temps;
    const c = Object.assign({}, d, { patienceMax: d.patience, livres: d.items.map(() => false), humeur: 'content', parti: false });
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'client';
    b.innerHTML = `<div class="bulle${c.type === 'presse' ? ' presse' : ''}"></div><div class="figure"></div><div class="patience"><i></i></div>`;
    b.addEventListener('click', () => servir(k));
    c.el = b;
    jeu.places[k] = c;
    $('places').children[k].appendChild(b);
    majBulle(k);
    dessinerFigure(c);
    son.porte();
    majFile();
  }
  function majBulle(k) {
    const c = jeu.places[k];
    const bulle = c.el.querySelector('.bulle');
    bulle.innerHTML = c.items.map((r, i) => `<span class="item${c.livres[i] ? ' livre' : ''}">${svgPain(r, 'dore')}</span>`).join('')
      + (c.type === 'presse' ? svgMontre() : '');
    const reste = c.items.filter((_, i) => !c.livres[i]).map((r) => t('pain.' + r)).join(', ');
    c.el.setAttribute('aria-label', t('aria.client', { commande: reste || t('pain.' + c.items[0]) }));
  }
  function dessinerFigure(c) {
    c.el.querySelector('.figure').innerHTML = svgClient(c, c.humeur);
  }
  function majClient(c) {
    const r = c.patience / c.patienceMax;
    const i = c.el.querySelector('.patience i');
    i.style.width = (100 * r) + '%';
    i.style.background = r > 0.5 ? '#3f9a4a' : r > 0.25 ? '#f2a23a' : '#e0503a';
    const h = r > 0.55 ? 'content' : r > 0.28 ? 'bof' : 'triste';
    if (h !== c.humeur) { c.humeur = h; dessinerFigure(c); }
  }

  // ---------------------------------------------------------------------
  // Pigeon gourmand
  // ---------------------------------------------------------------------
  function painsVitrine() {
    const l = [];
    jeu.vitrine.forEach((p, i) => { if (p) l.push(i); });
    return l;
  }
  function placerPigeon() {
    const el = jeu.pigeon.el;
    const cas = $('vitrine').children[jeu.pigeon.v];
    el.style.left = (cas.offsetLeft + cas.offsetWidth / 2 - 26) + 'px';
    el.style.top = (cas.offsetTop - 30) + 'px';
  }
  function poserPigeon() {
    const l = painsVitrine();
    if (!l.length) { jeu.prochainPigeon = jeu.temps + 3; return; }
    const v = l[Math.floor(Math.random() * l.length)];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pigeon';
    b.innerHTML = svgPigeon();
    b.setAttribute('aria-label', t('aria.pigeon'));
    b.addEventListener('click', chasserPigeon);
    $('vitrine').appendChild(b);
    jeu.pigeon = { v, t: 0, el: b };
    placerPigeon();
    son.pigeon();
  }
  function viserAutrePain() {
    const l = painsVitrine().filter((i) => i !== jeu.pigeon.v);
    if (!l.length) { envolPigeon(); return; }
    jeu.pigeon.v = l[0];
    placerPigeon();
  }
  function envolPigeon() {
    const p = jeu.pigeon;
    if (!p) return;
    p.el.classList.add('envol');
    setTimeout(() => p.el.remove(), 700);
    jeu.pigeon = null;
    jeu.prochainPigeon = jeu.temps + jeu.def.pigeons * (0.8 + Math.random() * 0.4);
  }
  function chasserPigeon() {
    if (!actif() || !jeu.pigeon) return;
    son.chasse();
    particules(jeu.pigeon.el, PLUME, 5);
    envolPigeon();
  }
  function pigeonMange() {
    const v = jeu.pigeon.v;
    if (jeu.vitrine[v]) {
      jeu.vitrine[v] = null;
      particules(jeu.pigeon.el, PLUME, 4);
      son.pigeon();
      message('msg.pigeonVole');
      majVitrine();
    }
    envolPigeon();
  }

  // ---------------------------------------------------------------------
  // Boucle de jeu
  // ---------------------------------------------------------------------
  function maj(dt) {
    const j = jeu;
    j.temps += dt;
    const personne = j.places.every((p) => !p);
    j.horloge += dt * (personne ? 3 : 1); // boutique vide : le client suivant arrive plus vite
    if (j.prochain < j.clients.length && j.horloge >= j.clients[j.prochain].arrivee && j.temps - j.derniereArrivee > 1.5) {
      const libre = j.places.findIndex((p) => !p);
      if (libre >= 0) arriverClient(libre);
    }
    j.places.forEach((c, k) => {
      if (!c || c.parti) return;
      c.patience -= dt;
      if (c.patience <= 0) clientFache(k);
      else majClient(c);
    });
    if (j.fini) return;
    const vitesse = j.def.chaud ? 1.35 : 1;
    j.fours.forEach((f, k) => {
      if (!f) return;
      if (f.etat === 'brule') {
        f.tb = (f.tb || 0) + dt;
        if (f.tb > 1.6) { j.fours[k] = null; majFour(k); }
        return;
      }
      f.t += dt * vitesse;
      const r = f.t / RECETTES[f.recette].cuisson;
      const e = r < DORE ? 'cru' : r < CUIT ? 'dore' : r < BRULE ? 'cuit' : 'brule';
      if (e !== f.etat) {
        f.etat = e;
        if (e === 'dore') son.ding();
        if (e === 'brule') { son.brule(); message('msg.brule'); particules($('fours').children[k], FUMEE, 5); }
        majFour(k);
      } else majJaugeFour(k);
    });
    if (j.moulin.actif) {
      j.moulin.t += dt;
      if (j.moulin.t >= DUREE_MOULIN) finMoulin();
      else majMoulin();
    }
    j.champ.forEach((p, k) => {
      if (p.t < POUSSE) {
        p.t = Math.min(POUSSE, p.t + dt);
        majParcelle(k);
        if (p.t >= POUSSE) majParcelle(k, true);
      }
    });
    if (j.def.pigeons) {
      if (!j.pigeon && j.temps >= j.prochainPigeon) poserPigeon();
      else if (j.pigeon) {
        j.pigeon.t += dt;
        if (!j.vitrine[j.pigeon.v]) viserAutrePain();
        else if (j.pigeon.t >= DUREE_PIGEON) pigeonMange();
      }
    }
    majFile();
    if (j.prochain >= j.clients.length && j.places.every((p) => !p)) finJournee(true);
  }
  let dernier = 0;
  function boucle(ts) {
    const dt = dernier ? Math.min(0.05, (ts - dernier) / 1000) : 0;
    dernier = ts;
    if (actif()) maj(dt);
    requestAnimationFrame(boucle);
  }

  // ---------------------------------------------------------------------
  // Fin de journée
  // ---------------------------------------------------------------------
  function finJournee(gagne) {
    if (jeu.fini) return;
    const j = jeu;
    j.fini = true;
    const i = j.i;
    let etoiles = 0;
    const ancienRecord = prog.records[i];
    if (gagne) {
      const ratio = j.max ? j.pieces / j.max : 1;
      etoiles = ratio >= 0.75 ? 3 : ratio >= 0.5 ? 2 : 1;
      prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
      prog.records[i] = Math.max(prog.records[i], j.pieces);
      prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2));
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
      etat.niveauReprise = Math.min(NIVEAUX.length, i + 2);
      sauver(i + 2);
      if (prog.etoiles.every((e) => e > 0)) {
        if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
      }
    } else {
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: i + 1 });
      etat.niveauReprise = i + 1;
      sauver(i + 1);
    }
    if (j.pigeon) { j.pigeon.el.remove(); j.pigeon = null; }
    setTimeout(() => { if (jeu === j) montrerFin(gagne, etoiles, ancienRecord); }, 800);
  }

  function montrerFin(gagne, etoiles, ancienRecord) {
    const j = jeu;
    const i = j.i;
    const dernier = i === NIVEAUX.length - 1;
    $('fin-titre').textContent = t(gagne ? 'fin.gagneTitre' : 'fin.perduTitre');
    const zone = $('fin-etoiles');
    zone.innerHTML = [0, 1, 2].map((k) => svgEtoile(k < etoiles)).join('');
    zone.setAttribute('aria-label', t('etoilesAria', { n: etoiles }));
    [...zone.children].forEach((s, k) => {
      if (k < etoiles) { s.classList.add('gagnee'); s.style.animationDelay = (0.25 + k * 0.35) + 's'; setTimeout(() => son.etoile(k), 250 + k * 350); }
    });
    let texte = '';
    if (!gagne) texte = t('fin.perduTexte');
    else if (dernier) texte = t('fin.jeuFini');
    else if (etoiles < 3) texte = t('fin.conseil');
    else texte = t('fin.bravo');
    $('fin-texte').textContent = texte;
    // Pièces qui défilent
    const fp = $('fin-pieces');
    fp.innerHTML = svgPiece() + '<span></span>';
    const span = fp.querySelector('span');
    let n = 0;
    const pas = Math.max(1, Math.ceil(j.pieces / 25));
    const compter = () => {
      n = Math.min(j.pieces, n + pas);
      span.textContent = t('fin.pieces', { n: nb(n), max: nb(j.max) });
      if (n < j.pieces && jeu === j) setTimeout(compter, 40);
    };
    compter();
    if (gagne && j.pieces > ancienRecord && ancienRecord > 0) $('fin-record').textContent = t('fin.nouveauRecord');
    else $('fin-record').textContent = t('fin.record', { n: nb(Math.max(ancienRecord, gagne ? j.pieces : 0)) });
    $('fin-stats').textContent = [t('fin.contents', { n: j.contents }), t('fin.mecontents', { n: j.mecontents }), t('fin.dores', { n: j.dores })].join(' · ');
    const bt = $('fin-boutons');
    bt.innerHTML = '';
    const ajouter = (cle, clair, f) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'bouton' + (clair ? ' clair' : '');
      b.textContent = t(cle);
      b.addEventListener('click', () => { son.clic(); f(); });
      bt.appendChild(b);
      return b;
    };
    let premier;
    if (gagne) {
      if (!dernier) premier = ajouter('fin.suivant', false, () => lancerNiveau(i + 1));
      const r = ajouter('fin.rejouer', !!premier, () => lancerNiveau(i));
      premier = premier || r;
      son.victoire();
      confettis();
    } else {
      premier = ajouter('fin.reessayer', false, () => lancerNiveau(i));
      son.defaite();
    }
    ajouter('fin.niveaux', true, afficherNiveaux);
    if (!gagne) ajouter('pause.accueil', true, afficherTitre);
    $('ov-fin').classList.add('visible');
    setTimeout(() => { try { premier.focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 50);
  }

  // ---------------------------------------------------------------------
  // Pause
  // ---------------------------------------------------------------------
  function fermerVoiles() {
    ['ov-pause', 'ov-fin', 'ov-astuce'].forEach((id) => $(id).classList.remove('visible'));
    $('tuto').classList.remove('visible');
    app.classList.remove('en-pause', 'bloque');
  }
  function mettrePause() {
    if (!jeu || jeu.fini || jeu.pause || etat.ecran !== 'jeu') return;
    jeu.pause = true;
    app.classList.add('en-pause');
    $('ov-pause').classList.add('visible');
    if (ac) { try { ac.suspend(); } catch (e) { /* rien */ } }
    setTimeout(() => { try { $('b-reprendre').focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30);
  }
  function reprendre() {
    if (!jeu) return;
    jeu.pause = false;
    app.classList.remove('en-pause');
    $('ov-pause').classList.remove('visible');
    if (ac && prog.son) { try { ac.resume(); } catch (e) { /* rien */ } }
  }

  // ---------------------------------------------------------------------
  // Nouveautés et tutoriel
  // ---------------------------------------------------------------------
  // Dessin de chaque nouveauté (la main animée tape dessus).
  function illustration(cle) {
    const pain = (r) => `<svg class="dessin" viewBox="0 0 60 42" aria-hidden="true">${dessinPain(r, 'dore')}</svg>`;
    switch (cle) {
      case 'boule': case 'croissant': case 'painchoc': case 'brioche': case 'graines': case 'raisins':
        return `<div style="display:flex;gap:4px;height:100%;align-items:center"><div style="flex:1.2;height:100%">${pain(cle)}</div><div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2px">${RECETTES[cle].ing.map(svgIng).join('')}</div></div>`;
      case 'four2': case 'four3': case 'chaud':
        return `<div style="display:flex;gap:6px;height:100%">${Array.from({ length: cle === 'four2' ? 2 : 3 }, () => `<div class="four" style="flex:1;${cle === 'chaud' ? 'box-shadow:inset 0 0 0 3px #ff7a2a,0 0 14px #ff7a2a' : ''}"><div class="bouche">${svgPain('baguette', 'dore')}</div><div class="jauge"><i style="left:60%"></i></div></div>`).join('')}</div>`;
      case 'double': return `<div class="bulle" style="height:60%;margin:14px auto 0;width:80%"><span class="item" style="width:45%;height:100%">${svgPain('baguette')}</span><span class="item" style="width:45%;height:100%">${svgPain('croissant')}</span></div>`;
      case 'panier': return `<div style="display:flex;height:100%;align-items:flex-end;justify-content:center"><div style="height:100%">${svgClient({ look: { p: 1, c: 2, h: 5, s: 2 }, type: 'panier' }, 'content')}</div><div class="bulle" style="align-self:flex-start">${['brioche', 'baguette', 'boule'].map((r) => `<span class="item">${svgPain(r)}</span>`).join('')}</div></div>`;
      case 'presse': return `<div style="display:flex;height:100%;align-items:flex-end;justify-content:center"><div style="height:100%">${svgClient({ look: { p: 3, c: 3, h: 0, s: 0 }, type: 'presse' }, 'bof')}</div><div class="bulle presse" style="align-self:flex-start"><span class="item">${svgPain('croissant')}</span>${svgMontre()}</div></div>`;
      case 'moulin': return `<div style="display:flex;height:100%;align-items:center;justify-content:center;gap:6px"><svg viewBox="0 0 40 40" style="width:30%">${dessinSacBle()}</svg><div style="width:36%;height:100%">${svgMoulin().replace('<svg', '<svg style="width:100%;height:100%"')}</div><svg viewBox="0 0 40 40" style="width:30%">${dessinIng('farine')}</svg></div>`;
      case 'champ': return `<div style="display:flex;height:100%;gap:6px">${[POUSSE, POUSSE * 0.6, POUSSE * 0.2].map((tt) => `<div class="parcelle" style="flex:1">${svgParcelle({ t: tt })}</div>`).join('')}</div>`;
      case 'pigeon': return `<div style="position:relative;height:100%"><div class="case" style="position:absolute;left:25%;right:25%;bottom:0;height:46%">${svgPain('baguette')}</div><div style="position:absolute;left:30%;width:40%;top:0;height:60%">${svgPigeon()}</div></div>`;
      default: // fête du quartier
        return `<div style="height:100%"><svg class="dessin" viewBox="0 0 60 60">${dessinDeco('guirlande')}<g transform="translate(8 16) scale(.75)">${dessinPain('brioche', 'dore')}</g></svg></div>`;
    }
  }
  // Où la main se pose sur le dessin (en % de la boîte).
  const POSE_MAIN = { double: [60, 40], panier: [30, 45], presse: [30, 45], moulin: [48, 40], champ: [12, 30], pigeon: [48, 20], four2: [20, 30], four3: [10, 30], chaud: [10, 30] };
  function montrerAstuce(cle) {
    jeu.bloque = true;
    app.classList.add('bloque');
    const ill = $('astuce-illus');
    ill.innerHTML = illustration(cle) + `<div class="main tape">${svgMain()}</div>`;
    const [x, y] = POSE_MAIN[cle] || [36, 34];
    const m = ill.querySelector('.main');
    m.style.left = x + '%';
    m.style.top = y + '%';
    $('astuce-texte').textContent = t('astuce.' + cle);
    $('ov-astuce').classList.add('visible');
    setTimeout(() => { try { $('b-astuce').focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30);
  }
  function fermerAstuce() {
    son.clic();
    $('ov-astuce').classList.remove('visible');
    if (jeu) { jeu.bloque = false; app.classList.remove('bloque'); }
  }

  // Tutoriel du niveau 1 : la main se pose sur les vrais éléments.
  const ETAPES_TUTO = [
    { texte: 'tuto.etape1', cible: () => $('ingredients'), main: () => $('ingredients').children[0] },
    { texte: 'tuto.etape2', cible: () => $('bol'), main: () => $('bol') },
    { texte: 'tuto.etape3', cible: () => $('fours'), main: () => $('fours') },
  ];
  let etapeTuto = 0;
  function lancerTuto() {
    if (!jeu || jeu.fini) return;
    jeu.bloque = true;
    app.classList.add('bloque');
    etapeTuto = 0;
    $('tuto').classList.add('visible');
    $('tuto-main').innerHTML = svgMain();
    montrerEtape();
  }
  function montrerEtape() {
    const e = ETAPES_TUTO[etapeTuto];
    const cible = e.cible().getBoundingClientRect();
    const main = e.main().getBoundingClientRect();
    const an = $('tuto-anneau');
    an.style.left = (cible.left - 6) + 'px';
    an.style.top = (cible.top - 6) + 'px';
    an.style.width = (cible.width + 12) + 'px';
    an.style.height = (cible.height + 12) + 'px';
    const m = $('tuto-main');
    m.style.left = (main.left + main.width / 2 - 14) + 'px';
    m.style.top = (main.top + main.height / 2 - 6) + 'px';
    $('tuto-texte').textContent = t(e.texte);
    const boite = $('tuto-boite');
    // Boîte de texte loin de la cible.
    if (cible.top + cible.height / 2 > window.innerHeight / 2) { boite.style.top = '62px'; boite.style.bottom = ''; }
    else { boite.style.top = ''; boite.style.bottom = '14px'; }
    const dernier = etapeTuto === ETAPES_TUTO.length - 1;
    $('b-tuto-suivant').textContent = t(dernier ? 'tuto.commencer' : 'tuto.suivant');
    $('b-tuto-passer').style.display = dernier ? 'none' : '';
    setTimeout(() => { try { $('b-tuto-suivant').focus({ preventScroll: true }); } catch (er) { /* rien */ } }, 30);
  }
  function etapeSuivante() {
    son.clic();
    etapeTuto++;
    if (etapeTuto >= ETAPES_TUTO.length) finTuto();
    else montrerEtape();
  }
  function finTuto() {
    $('tuto').classList.remove('visible');
    if (jeu) { jeu.bloque = false; app.classList.remove('bloque'); }
  }

  // ---------------------------------------------------------------------
  // Commandes
  // ---------------------------------------------------------------------
  function jouer() {
    son.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => {
        const n = Math.max(1, Math.min(NIVEAUX.length, d.niveau | 0 || 1));
        prog.debloque = Math.max(prog.debloque, n);
        lancerNiveau(n - 1);
      },
      onNouvelle: () => lancerNiveau(0),
    });
  }
  JEL_SAVE.surFermeture(() => {
    if (etat.enPartie) window.JEL_SAVE.save(JEU, { niveau: etat.niveauReprise, score: totalRecords(), etoiles: prog.etoiles.slice(), records: prog.records.slice(), debloque: prog.debloque, vus: Object.assign({}, prog.vus), options: { son: prog.son } });
  });

  $('b-jouer').addEventListener('click', jouer);
  $('b-niveaux').addEventListener('click', () => { son.clic(); afficherNiveaux(); });
  $('b-deco').addEventListener('click', () => { son.clic(); afficherDecos(); });
  document.querySelectorAll('.b-retour').forEach((b) => { b.innerHTML = ICONES.retour; b.addEventListener('click', () => { son.clic(); afficherTitre(); }); });
  ['b-son-titre', 'b-son-jeu', 'b-son-pause'].forEach((id) => $(id).addEventListener('click', basculerSon));
  $('b-pause').innerHTML = ICONES.pause;
  $('b-pause').addEventListener('click', () => { son.clic(); mettrePause(); });
  $('b-reprendre').addEventListener('click', () => { reprendre(); son.clic(); });
  $('b-recommencer').addEventListener('click', () => { son.clic(); lancerNiveau(jeu.i); });
  $('b-accueil').addEventListener('click', () => { son.clic(); afficherTitre(); });
  $('b-astuce').addEventListener('click', fermerAstuce);
  $('b-tuto-suivant').addEventListener('click', (e) => { e.stopPropagation(); etapeSuivante(); });
  $('b-tuto-passer').addEventListener('click', (e) => { e.stopPropagation(); son.clic(); finTuto(); });
  $('tuto').addEventListener('click', etapeSuivante);
  $('bol').addEventListener('click', actionBol);
  $('poubelle').innerHTML = ICONES.poubelle;
  $('poubelle').addEventListener('click', viderBol);
  $('moulin').addEventListener('click', toucherMoulin);

  // Clavier
  document.addEventListener('keydown', (e) => {
    if (etat.ecran !== 'jeu' || !jeu) return;
    const code = e.code;
    if (code === 'Escape' || code === 'KeyP') {
      e.preventDefault();
      if (jeu.pause) reprendre(); else if (!jeu.bloque) mettrePause();
      return;
    }
    if (!actif()) return;
    const chiffre = /^(Digit|Numpad)(\d)$/.exec(code);
    if (chiffre) {
      const n = (Number(chiffre[2]) + 9) % 10; // 1 → 0, …, 0 → 9
      const b = $('ingredients').children[n];
      if (b) { e.preventDefault(); ajouterIngredient(b.dataset.ing, b); }
      return;
    }
    if (code === 'ArrowLeft' || code === 'ArrowRight') {
      e.preventDefault();
      const l = jeu.def.recettes;
      const k = (l.indexOf(jeu.recette) + (code === 'ArrowRight' ? 1 : l.length - 1)) % l.length;
      choisirRecette(l[k]);
      return;
    }
    if (code === 'Space') { e.preventDefault(); actionBol(); return; }
    if (code === 'KeyO') {
      e.preventDefault();
      // Le pain le plus cuit d'abord ; sinon, enfourner la pâte prête.
      let k = -1, mx = -1;
      jeu.fours.forEach((f, i) => { if (f && f.etat !== 'cru' && f.t > mx) { mx = f.t; k = i; } });
      if (k >= 0) toucherFour(k);
      else if (jeu.bol.pret) enfourner(-1);
      else { son.refus(); message('msg.pasCuit'); }
      return;
    }
    if (code === 'KeyS') {
      e.preventDefault();
      // Le client le plus impatient dont un pain est prêt.
      let k = -1, mini = Infinity;
      jeu.places.forEach((c, i) => {
        if (!c || c.parti) return;
        const possible = c.items.some((r, n) => !c.livres[n] && trouverVitrine(r) >= 0);
        if (possible && c.patience < mini) { mini = c.patience; k = i; }
      });
      if (k >= 0) servir(k); else { son.refus(); message('msg.pasPret'); }
      return;
    }
    if (code === 'KeyF') { e.preventDefault(); toucherMoulin(); return; }
    if (code === 'KeyR') {
      e.preventDefault();
      const k = jeu.champ.findIndex((p) => p.t >= POUSSE);
      if (k >= 0) toucherParcelle(k); else if (jeu.champ.length) { son.refus(); message('msg.pousse'); }
      return;
    }
    if (code === 'KeyC') { e.preventDefault(); chasserPigeon(); }
  });

  // Espace sert au bol : le bouton qui a le focus ne s'active pas en plus.
  document.addEventListener('keyup', (e) => { if (e.code === 'Space' && actif()) e.preventDefault(); });

  // Pause automatique quand l'écran est caché.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && jeu && !jeu.fini && etat.ecran === 'jeu') mettrePause();
  });
  window.addEventListener('resize', () => {
    if (jeu && jeu.pigeon) placerPigeon();
    if ($('tuto').classList.contains('visible')) montrerEtape();
  });

  majBoutonsSon();
  afficherTitre();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
