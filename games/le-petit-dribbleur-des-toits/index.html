    { q: 'ecole', h: 2, tuto: 'trou', apercu: 46, oiseau: 60, c: 's7 g1 s4 e2 s3 g2 s5 u1 s3 g2 s4 C s3 g1 s2 g2 s3 e3 g2 s3 d1 s4 g3 s3 u1 s3 g2 s4 C s3 g3 s3 d1 s3 e2 s6 P5,3' },
    { q: 'ecole', h: 2, tuto: 'flaque', apercu: 44, oiseau: 60, c: 's8 f2 s4 e2 s3 f2 s3 u1 s4 f3 s4 C s4 e3 g2 s3 f2 s2 f2 s5 e2 d1 s4 C s3 f1 s3 g2 s2 f3 s3 u1 s3 f2 s4 d1 s5 P5,3.5' },
    { q: 'ecole', h: 2, tuto: 'tramp', apercu: 42, oiseau: 60, c: 's8 T s1 u3 s5 e2 s3 d3 s4 f2 s3 T g4 s4 C s3 e5 T s5 g2 s3 u1 s2 T s1 u3 s4 e2 d4 s4 C s3 T g4 s3 f2 s4 u2 s2 d2 s5 P5,4' },
    { q: 'ecole', h: 2, tuto: 'drapeau', apercu: 40, oiseau: 60, c: 's6 e2 s3 g2 s3 f3 s3 T s1 u3 s4 g2 s3 C s4 f2 s2 g3 s4 e3 d3 s3 T g4 s4 C s3 f2 s3 u1 s3 e2 f3 s4 C s3 g2 s2 f2 s3 T s1 u3 s3 g3 s3 d4 s5 P6,4' },
    { q: 'parc', h: 2, tuto: 'passe', apercu: 34, oiseau: 65, c: 's7 e2 s3 A s3 f8 s2 R s4 C s4 g2 s3 A s3 f4 g2 f4 s2 R e2 s4 u1 s4 e3 g2 s4 C s3 A s3 f3 g2 f3 g2 f3 R s3 d1 s5 P6,4' },
    { q: 'parc', h: 2, tuto: 'arros', apercu: 32, oiseau: 65, c: 's7 W s3 e2 s4 W s3 W s4 C s3 f2 s3 W s3 W s4 e3 A s3 f6 R s3 u1 s3 W s3 e2 s4 C s3 W s3 g2 s3 W s4 P6,3.5' },
    { q: 'parc', h: 2, tuto: 'pigeon', apercu: 30, oiseau: 70, c: 's8 b5 s6 e2 s3 g2 s4 b4 s5 C s3 f3 s3 b6,2 s7 e3 T s1 u3 s3 b4 s5 e2 d3 s4 C s3 g2 s3 b5 s6 f2 s3 b4,2 s6 P6,4' },
    { q: 'parc', h: 2, tuto: null, apercu: 28, oiseau: 75, c: 's6 W s3 b5 s5 e2 A s3 f7 s2 R s3 C s3 g2 s3 W s3 W s3 b6,2 s6 e3 T s1 u3 s3 A s2 f5 g2 f3 R s3 e2 s5 P7,4' },
    { q: 'parc', h: 2, tuto: 'panier', apercu: 26, oiseau: 80, c: 's6 e2 s3 W s3 W s4 g3 s3 b5 s5 C s3 T g4 s3 A s3 f8 R s3 C s4 W s3 b5,1 s4 e3 u1 s3 g3 s3 e2 s3 d1 s5 P6,4,m' },
    { q: 'port', h: 2, tuto: 'grille', apercu: 22, oiseau: 90, c: 's8 e2 s5 F s6 C s4 g2 s3 F s5 e2 s4 f2 s3 F s3 g2 s4 e3 s4 C s3 F f2 s3 g2 s4 P6,4' },
    { q: 'port', h: 2, tuto: null, apercu: 20, oiseau: 95, c: 's7 F s1 f2 s5 e2 s4 C s3 F f2 s2 f2 s5 e3 g2 s3 F s3 f3 s4 C s3 T s1 u3 s3 e2 s3 F s3 g2 s5 P7,4' },
    { q: 'port', h: 2, tuto: 'mouette', apercu: 18, oiseau: 105, c: 's6 b6 s6 u2 s3 u2 s4 e3 d1 s2 b4,2.2 s5 C g2 s3 T s1 u3 s4 b4 s7 e2 F s4 d4 s3 f3 s3 b6 s6 e2 s4 P7,4.5' },
    { q: 'port', h: 2, tuto: null, apercu: 16, oiseau: 105, c: 's6 e2 A s3 f6 R s3 F s4 C s3 g2 s2 b5 s5 F f3 s3 e3 s3 A s2 f4 g3 f4 R s2 C s3 W s3 W s3 F s3 e2 s5 P7,4' },
    { q: 'port', h: 2, tuto: null, apercu: 15, oiseau: 110, c: 's5 e2 s3 b4 s7 F s3 g2 s4 C s3 A s3 f7 R s3 T g4 s4 b6,1 s6 C s2 F f2 s3 e3 s4 u2 s3 W s3 b4 s6 e2 g3 s3 C s4 d2 s6 P7,4,m' },
    { q: 'toits', h: 5, tuto: 'platH', apercu: 14, oiseau: 95, c: 's8 e2 s3 m5 s4 e3 s3 m6 s4 C s3 f2 s3 m7 s3 b4 s7 e2 m6 s3 g2 s5 P6,4' },
    { q: 'toits', h: 5, tuto: 'platV', apercu: 13, oiseau: 100, c: 's7 e2 s3 v3 s5 m5 s4 C s3 v4 s3 e3 g2 s4 b5 s5 v3 s3 F s4 C s3 e2 d4 s4 m6 s5 P7,4.5' },
    { q: 'toits', h: 5, tuto: 'vapeur', apercu: 12, oiseau: 100, c: 's7 V3 u3 s5 e2 g2 s4 V4 u4 s4 C s3 m6 s4 e4 V3 u2 s4 f3 s3 b6 s5 e2 d3 s4 V4 u3 s5 P7,4.5' },
    { q: 'toits', h: 5, tuto: null, apercu: 11, oiseau: 110, c: 's6 e2 m5 s3 V3 u3 s4 b5,1 s5 C s3 v3 s2 F s4 A s3 f3 g3 f3 R s3 C s3 W s3 W s3 m6 s3 e3 V4 u3 s4 g2 s3 b6 s5 e2 s3 P8,5,m' },
    { q: 'toits', h: 5, tuto: 'finale', apercu: 10, oiseau: 115, c: 's6 e2 s3 T s1 u3 s4 m6 s4 b5 s5 C s3 V3 u3 s3 F s3 g2 s4 C s3 A s3 f4 g3 f4 R s3 v4 s4 e3 b6,2 s6 C s3 W s3 W s3 m7 s4 V4 u4 s4 e2 s5 P8,5,m' }
  ];
  window.JEL_NIVEAUX = NIVEAUX.length;

  // Tenues à débloquer avec le total d'étoiles
  const BALLONS = [0, 5, 14, 26, 40, 55];
  const BASKETS = [0, 8, 20, 33, 48];
  const MAILLOTS = [0, 3, 11, 23, 36, 50];
  const COULEURS_BASKETS = ['#e8423f', '#f4f4f4', '#2fb7ff', '#45c35a', '#f2c230'];
  const COULEURS_MAILLOTS = [
    { c: '#ffd23f', s: '#2a5bd7' }, { c: '#2a7de1', s: '#ffffff' }, { c: '#e23e57', s: '#ffffff' },
    { c: '#2fae5f', s: '#ffffff' }, { c: '#8e5bd8', s: '#ffd23f' }, { c: '#ff8c2a', s: '#ffffff', raye: true }
  ];

  const QUARTIERS = {
    ecole: { ciel: ['#6fc0f5', '#dff3ff'], haut: '#9a9086', corps: '#c4674c', joint: '#a5523a', loin: '#a7c6df', milieu: '#78b062' },
    parc: { ciel: ['#7cc9f2', '#eafbdc'], haut: '#5cb85c', corps: '#8b5e3c', joint: '#6f4a2e', loin: '#a3d4ae', milieu: '#4f9e4a' },
    port: { ciel: ['#86cdec', '#ffe7c4'], haut: '#a87443', corps: '#6f7f8f', joint: '#5a6979', loin: '#9db9cc', milieu: '#3a8fc2' },
    toits: { ciel: ['#3b2a6e', '#ff9d6c'], haut: '#c2514b', corps: '#4e4170', joint: '#3d325b', loin: '#5c4a8c', milieu: '#2f2652' }
  };

  // Réglages de la physique (unités du monde : une case = 40)
  const T = 40, LW = 11, LH = 44;
  const VITESSE = 210, SAUT = 430, GRAV = 1800, GRAV_TENUE = 800, TENUE = 0.3, TRAMP = 860;
  const GB = 900, RB = 10, RIM = 24;
  const VIES = 3;

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant la première action)
  // ---------------------------------------------------------------------
  const Son = {
    ctx: null, actif: true,
    init: function () {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(function () {}); return; }
      try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); } catch (e) { this.ctx = null; }
    },
    bip: function (freq, duree, type, vol, glisse, delai) {
      if (!this.actif || !this.ctx) return;
      try {
        const c = this.ctx, t0 = c.currentTime + (delai || 0);
        const o = c.createOscillator(), g = c.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(freq, t0);
        if (glisse) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + glisse), t0 + duree);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
        o.connect(g); g.connect(c.destination);
        o.start(t0); o.stop(t0 + duree + 0.03);
      } catch (e) { /* son impossible */ }
    },
    bruit: function (duree, vol, filtre, delai) {
      if (!this.actif || !this.ctx) return;
      try {
        const c = this.ctx, t0 = c.currentTime + (delai || 0);
        const n = Math.floor(c.sampleRate * duree);
        const buf = c.createBuffer(1, n, c.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
        const s = c.createBufferSource(); s.buffer = buf;
        const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filtre || 1500;
        const g = c.createGain(); g.gain.value = vol || 0.1;
        s.connect(f); f.connect(g); g.connect(c.destination);
        s.start(t0);
      } catch (e) { /* son impossible */ }
    },
    jouer: function (nom) {
      const s = this;
      switch (nom) {
        case 'rebond': s.bip(150, 0.07, 'sine', 0.13, -70); break;
        case 'saut': s.bip(330, 0.14, 'square', 0.045, 360); break;
        case 'etoile': [880, 1175, 1568].forEach(function (f, i) { s.bip(f, 0.14, 'triangle', 0.09, 0, i * 0.06); }); break;
        case 'tramp': s.bip(180, 0.4, 'sine', 0.16, 520); break;
        case 'plouf': s.bruit(0.4, 0.16, 900); s.bip(520, 0.22, 'sine', 0.07, -380); break;
        case 'perdu': [392, 330, 262].forEach(function (f, i) { s.bip(f, 0.2, 'triangle', 0.09, 0, 0.1 + i * 0.13); }); break;
        case 'oiseau': s.bip(1800, 0.06, 'sine', 0.06, 600); s.bip(2000, 0.06, 'sine', 0.05, 500, 0.08); break;
        case 'passe': s.bruit(0.25, 0.08, 2600); s.bip(520, 0.25, 'sine', 0.05, 380); break;
        case 'tir': s.bruit(0.18, 0.07, 3200); s.bip(400, 0.18, 'sine', 0.04, 300); break;
        case 'cercle': s.bip(760, 0.12, 'square', 0.045, -260); break;
        case 'planche': s.bip(240, 0.1, 'square', 0.04, -80); break;
        case 'panier': s.bruit(0.3, 0.1, 4200); [523, 659, 784, 1047].forEach(function (f, i) { s.bip(f, 0.2, 'triangle', 0.1, 0, 0.12 + i * 0.08); }); break;
        case 'drapeau': s.bip(660, 0.1, 'triangle', 0.08); s.bip(990, 0.16, 'triangle', 0.08, 0, 0.09); break;
        case 'attrape': s.bip(440, 0.08, 'triangle', 0.08); s.bip(660, 0.1, 'triangle', 0.07, 0, 0.06); break;
        case 'grimpe': s.bip(300 + Math.random() * 80, 0.04, 'square', 0.025); break;
        case 'vapeur': s.bruit(0.3, 0.04, 700); break;
        case 'clic': s.bip(540, 0.05, 'sine', 0.06); break;
        case 'victoire': [523, 659, 784, 659, 784, 1047].forEach(function (f, i) { s.bip(f, 0.22, 'triangle', 0.1, 0, i * 0.12); }); break;
        case 'defaite': [440, 392, 349, 294].forEach(function (f, i) { s.bip(f, 0.28, 'triangle', 0.09, 0, i * 0.18); }); break;
        case 'debloque': [784, 988, 1175, 1568].forEach(function (f, i) { s.bip(f, 0.16, 'sine', 0.08, 0, i * 0.07); }); break;
      }
    }
  };

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js) et réglages
  // ---------------------------------------------------------------------
  function lireLocal(cle, def) { try { const v = localStorage.getItem(cle); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
  function ecrireLocal(cle, v) { try { localStorage.setItem(cle, JSON.stringify(v)); } catch (e) { /* pas de stockage */ } }

  const prog = { etoiles: [], records: [], gagnes: [], debloque: 1, tenue: { ballon: 0, basket: 0, maillot: 0 }, vus: {} };
  for (let i = 0; i < NIVEAUX.length; i++) { prog.etoiles.push(0); prog.records.push(0); prog.gagnes.push(false); }
  (function charger() {
    let d = null;
    try { d = window.JEL_SAVE ? window.JEL_SAVE.load(JEU) : null; } catch (e) { d = null; }
    if (d) {
      if (Array.isArray(d.etoiles)) d.etoiles.forEach(function (v, i) { if (i < NIVEAUX.length) prog.etoiles[i] = clamp(Math.floor(Number(v) || 0), 0, 3); });
      if (Array.isArray(d.records)) d.records.forEach(function (v, i) { if (i < NIVEAUX.length) prog.records[i] = Math.max(0, Math.floor(Number(v) || 0)); });
      if (Array.isArray(d.gagnes)) d.gagnes.forEach(function (v, i) { if (i < NIVEAUX.length) prog.gagnes[i] = !!v; });
      if (d.tenue && typeof d.tenue === 'object') prog.tenue = Object.assign(prog.tenue, d.tenue);
      if (d.vus && typeof d.vus === 'object') prog.vus = Object.assign({}, d.vus);
      prog.debloque = clamp(Math.floor(Number(d.debloque) || 1), 1, NIVEAUX.length);
      prog.debloque = Math.max(prog.debloque, clamp(d.niveau || 1, 1, NIVEAUX.length));
      if (d.options && typeof d.options.son === 'boolean') Son.actif = d.options.son;
    }
    const tenueLocale = lireLocal('dribbleur_tenue', null);
    if (tenueLocale && typeof tenueLocale === 'object') prog.tenue = Object.assign(prog.tenue, tenueLocale);
    const sonLocal = lireLocal('dribbleur_son', null);
    if (typeof sonLocal === 'boolean') Son.actif = sonLocal;
  })();

  function totalEtoiles() { return prog.etoiles.reduce(function (a, b) { return a + b; }, 0); }
  function totalRecords() { return prog.records.reduce(function (a, b) { return a + b; }, 0); }
  function donneesSauvegarde(niveau) {
    return { niveau: niveau, score: totalRecords(), etoiles: prog.etoiles.slice(), records: prog.records.slice(), gagnes: prog.gagnes.slice(), debloque: prog.debloque, tenue: Object.assign({}, prog.tenue), vus: Object.assign({}, prog.vus), options: { son: Son.actif } };
  }
  function sauver(niveau) { try { if (window.JEL_SAVE) window.JEL_SAVE.save(JEU, donneesSauvegarde(niveau)); } catch (e) { /* rien */ } }
  // Réglages changés hors partie : jamais de nouvelle sauvegarde depuis le menu,
  // seulement une mise à jour si une sauvegarde existe déjà.
  function sauverReglages() {
    try { if (window.JEL_SAVE && window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { tenue: Object.assign({}, prog.tenue), options: { son: Son.actif } }); } catch (e) { /* rien */ }
  }

  // ---------------------------------------------------------------------
  //  Construction d'un niveau à partir de ses morceaux
  // ---------------------------------------------------------------------
  function construire(def) {
    const m = { cols: [], etoiles: [], drapeaux: [], amis: [], arroseurs: [], oiseaux: [], grilles: [], plats: [], vapeurs: [], ligne: null, panier: null, q: def.q, minH: def.h, depart: null };
    let h = def.h, ami = null;
    const pousser = function (c) { m.cols.push(c); if (c.h != null) m.minH = Math.min(m.minH, c.base != null ? c.base : c.h); };
    def.c.split(/\s+/).forEach(function (tok) {
      const k = tok.charAt(0);
      const p = tok.slice(1).split(',');
      const n = p[0] !== '' && !isNaN(parseFloat(p[0])) ? parseFloat(p[0]) : 1;
      const x = m.cols.length * T;
      let i;
      switch (k) {
        case 's': for (i = 0; i < n; i++) pousser({ h: h, t: 'n' }); break;
        case 'u': h += n; break;
        case 'd': h -= n; break;
        case 'g': for (i = 0; i < n; i++) pousser({ h: null, t: 'g' }); break;
        case 'f': for (i = 0; i < n; i++) pousser({ h: h, t: 'f' }); break;
        case 'T': pousser({ h: h, t: 'tr', ecrase: 0 }); break;
        case 'e': m.etoiles.push({ x: x + T / 2, y: (h + n) * T, prise: false }); break;
        case 'C': {
          const prec = m.cols[m.cols.length - 1];
          m.drapeaux.push({ x: x, hx: x - T / 2, hy: prec && prec.h != null ? prec.h * T : h * T, actif: false, levee: 0 });
          break;
        }
        case 'A': ami = { x: x + T / 2, sol: h * T, yb: (h + 4) * T, etat: 'attend', recep: null, salut: 0 }; m.amis.push(ami); break;
        case 'R': if (ami) ami.recep = { x: x + T / 2, y: h * T }; break;
        case 'W': pousser({ h: h, t: 'n' }); m.arroseurs.push({ col: m.cols.length - 1, x: x + T / 2, y: h * T, phase: m.arroseurs.length * 1.1, actif: false, alerte: false }); break;
        case 'b': {
          const hauteur = p[1] ? parseFloat(p[1]) : 0.8;
          m.oiseaux.push({ x0: x + 10, x1: x + n * T - 10, x: x + n * T / 2, y0: h * T + hauteur * T, y: 0, dir: m.oiseaux.length % 2 ? 1 : -1, ph: m.oiseaux.length });
          break;
        }
        case 'F': pousser({ h: h, t: 'n' }); m.grilles.push({ x: x + T / 2, y: h * T, haut: 3.5 * T }); break;
        case 'm': {
          for (i = 0; i < n; i++) pousser({ h: null, t: 'g' });
          m.plats.push({ type: 'h', a: x, b: x + (n - 2) * T, x: x, y: h * T, w: 2 * T, v: 55, dir: 1, dx: 0, dy: 0 });
          break;
        }
        case 'v': {
          for (i = 0; i < 2; i++) pousser({ h: null, t: 'g' });
          m.plats.push({ type: 'v', a: h * T, b: (h + n) * T, x: x, y: h * T, w: 2 * T, v: 48, dir: 1, dx: 0, dy: 0 });
          h += n;
          break;
        }
        case 'V': pousser({ h: h + 1, base: h, t: 'chem' }); m.vapeurs.push({ x: x + T / 2, bas: (h + 1) * T, haut: (h + 1 + n) * T }); break;
        case 'P': {
          const d = n, hh = p[1] ? parseFloat(p[1]) : 4;
          m.ligne = { x: x + T / 2 };
          m.panier = { x: x + T / 2 + d * T, base: h * T + hh * T, y: h * T + hh * T, sol: h * T, mobile: p[2] === 'm', filet: 0 };
          for (i = 0; i < d + 5; i++) pousser({ h: h, t: 'n' });
          break;
        }
      }
    });
    m.largeur = m.cols.length * T;
    m.depart = { x: 1.5 * T, y: m.cols[1].h * T };
    return m;
  }

  // ---------------------------------------------------------------------
  //  État
  // ---------------------------------------------------------------------
  const canvas = $('jeu');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let ecran = 'titre';
  let enPause = false, tutoOuvert = null, partieEnCours = false;
  let monde = null, jeu = null, visee = null;
  let horloge = 0, secousse = 0;
  const cam = { x: 0, b: 0, s: 1, zoom: 1 };
  const lou = { x: 0, y: 0, vx: 0, vy: 0, face: 1, sol: false, plat: null, coyote: 0, tampon: 0, tenue: 0, anim: 0, grimpe: null, invincible: 0, phase: 0 };
  let balle = { etat: 'dribble' };
  let particules = [], flottants = [];
  const entree = { gauche: false, droite: false, saut: false, sautPresse: false, action: false };
  const touches = {};

  // ---------------------------------------------------------------------
  //  Outils du monde
  // ---------------------------------------------------------------------
  function topCol(i) {
    if (i < 0 || i >= monde.cols.length) return 1e6;
    const c = monde.cols[i];
    return c.h == null ? -Infinity : c.h * T;
  }
  function colA(x) { const i = Math.floor(x / T); return (i >= 0 && i < monde.cols.length) ? monde.cols[i] : null; }
  function mouille(i) {
    for (const a of monde.arroseurs) if (a.actif && Math.abs(a.col - i) <= 1) return true;
    return false;
  }
  function aBalle() { return balle.etat === 'dribble' || balle.etat === 'tenu'; }

  // Position du ballon quand Lou l'a
  function posBalleLou() {
    if (visee || balle.etat === 'tenu') return { x: lou.x + 8, y: lou.y + LH + 8 };
    if (!lou.sol || lou.grimpe) return { x: lou.x + lou.face * 9, y: lou.y + 22 };
    const rebond = Math.abs(Math.sin(lou.phase));
    return { x: lou.x + lou.face * 13, y: lou.y + RB + rebond * 18 };
  }

  // ---------------------------------------------------------------------
  //  Effets
  // ---------------------------------------------------------------------
  function eclats(x, y, n, couleurs, vitesse, gravite) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (0.3 + Math.random()) * (vitesse || 150);
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v + (vitesse || 150) * 0.4, vie: 0.6 + Math.random() * 0.6, max: 1.2, c: couleurs[i % couleurs.length], r: 2 + Math.random() * 3, g: gravite == null ? 500 : gravite, carre: Math.random() < 0.5 });
    }
  }
  function confettis(x, y) { eclats(x, y, 60, ['#ff5d73', '#ffd23f', '#3ec1ff', '#6be08a', '#b07cff', '#ffffff'], 330, 380); }
  function flotter(x, y, txt, c) { flottants.push({ x: x, y: y, txt: txt, vie: 1.2, c: c || '#ffd23f' }); }
  let toastMinuteur = null;
  function toast(txt, duree) {
    const el = $('toast');
    el.textContent = txt;
    el.classList.add('vu');
    clearTimeout(toastMinuteur);
    toastMinuteur = setTimeout(function () { el.classList.remove('vu'); }, duree || 1600);
  }

  // ---------------------------------------------------------------------
  //  Écrans
  // ---------------------------------------------------------------------
  function montrer(id, oui) { $(id).classList.toggle('cache', !oui); }
  function majBoutonsSon() {
    const ico = Son.actif ? '🔊' : '🔇';
    ['b-son', 'b-son-titre', 'b-son-pause'].forEach(function (id) {
      const b = $(id); b.textContent = ico;
      b.setAttribute('aria-label', Son.actif ? t('btn.sonCouper') : t('btn.sonRemettre'));
    });
  }
  function basculerSon() {
    Son.actif = !Son.actif;
    Son.init();
    ecrireLocal('dribbleur_son', Son.actif);
    if (!partieEnCours) sauverReglages();
    majBoutonsSon();
    Son.jouer('clic');
  }

  function allerTitre() {
    ecran = 'titre'; enPause = false; partieEnCours = false; visee = null;
    ['ecran-niveaux', 'ecran-vestiaire', 'ecran-pause', 'ecran-fin', 'ecran-tuto', 'hud', 'commandes', 'visee'].forEach(function (id) { montrer(id, false); });
    tutoOuvert = null;
    montrer('ecran-titre', true);
  }

  function ouvrirNiveaux() {
    ecran = 'niveaux';
    ['ecran-titre', 'ecran-fin', 'ecran-pause', 'hud', 'commandes', 'visee'].forEach(function (id) { montrer(id, false); });
    enPause = false; partieEnCours = false;
    const liste = $('liste-niveaux');
    liste.textContent = '';
    $('niveaux-total').textContent = t('niveaux.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    ['ecole', 'parc', 'port', 'toits'].forEach(function (q, iq) {
      const titreQ = document.createElement('div');
      titreQ.className = 'quartier';
      titreQ.textContent = t('quartier.' + q);
      liste.appendChild(titreQ);
      const g = document.createElement('div');
      g.className = 'grille-niv';
      for (let k = 0; k < 5; k++) {
        const i = iq * 5 + k;
        const b = document.createElement('button');
        const ouvert = i < prog.debloque;
        b.className = 'niv' + (ouvert ? '' : ' ferme') + (prog.gagnes[i] ? ' gagne' : '');
        const num = document.createElement('span'); num.textContent = ouvert ? nb(i + 1) : '🔒';
        const et = document.createElement('span'); et.className = 'et';
        et.textContent = ouvert ? '★'.repeat(prog.etoiles[i]) + '☆'.repeat(3 - prog.etoiles[i]) : '';
        b.appendChild(num); b.appendChild(et);
        b.setAttribute('aria-label', ouvert ? t('niveaux.aria', { n: i + 1, e: prog.etoiles[i] }) : t('niveaux.ferme', { n: i + 1 }));
        if (ouvert) b.addEventListener('click', function () { Son.init(); Son.jouer('clic'); demarrerNiveau(i); });
        else b.disabled = true;
        g.appendChild(b);
      }
      liste.appendChild(g);
    });
    montrer('ecran-niveaux', true);
  }

  // --- Vestiaire ---
  function debloques(seuils) { const tot = totalEtoiles(); return seuils.map(function (s) { return tot >= s; }); }
  function ouvrirVestiaire() {
    ecran = 'vestiaire';
    montrer('ecran-titre', false);
    $('vestiaire-total').textContent = t('niveaux.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    remplirObjets('liste-ballons', BALLONS, 'ballon', function (c, i) { dessinerBalle(c, 22, 22, 15, i, 0.4); });
    remplirObjets('liste-baskets', BASKETS, 'basket', function (c, i) { dessinerChaussure(c, 22, 26, 2.6, COULEURS_BASKETS[i]); });
    remplirObjets('liste-maillots', MAILLOTS, 'maillot', function (c, i) { dessinerMaillot(c, 22, 24, 1.9, COULEURS_MAILLOTS[i]); });
    dessinerApercu();
    montrer('ecran-vestiaire', true);
  }
  function remplirObjets(id, seuils, type, dessin) {
    const zone = $(id);
    zone.textContent = '';
    const ok = debloques(seuils);
    seuils.forEach(function (s, i) {
      const b = document.createElement('button');
      b.className = 'objet' + (ok[i] ? '' : ' ferme') + (prog.tenue[type] === i ? ' choisi' : '');
      const c = document.createElement('canvas'); c.width = 44; c.height = 44;
      b.appendChild(c);
      dessin(c.getContext('2d'), i);
      const leg = document.createElement('span');
      leg.textContent = ok[i] ? (prog.tenue[type] === i ? '✔' : '') : '★ ' + nb(s);
      b.appendChild(leg);
      if (!ok[i]) { const k = document.createElement('span'); k.className = 'cadenas'; k.textContent = '🔒'; b.appendChild(k); }
      b.setAttribute('aria-label', t(type + '.' + i) + (ok[i] ? '' : ' — ' + t('vestiaire.ferme', { n: s })));
      b.addEventListener('click', function () {
        Son.init();
        if (!ok[i]) { Son.jouer('planche'); toast(t('vestiaire.ferme', { n: s })); return; }
        prog.tenue[type] = i;
        ecrireLocal('dribbleur_tenue', prog.tenue);
        sauverReglages();
        Son.jouer('attrape');
        ouvrirVestiaire();
      });
      zone.appendChild(b);
    });
  }
  function dessinerApercu() {
    const c = $('apercu-lou').getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, 240, 260);
    const g = c.createRadialGradient(120, 150, 10, 120, 150, 130);
    g.addColorStop(0, '#ffe8c8'); g.addColorStop(1, '#fff8ec');
    c.fillStyle = g; c.fillRect(0, 0, 240, 260);
    c.fillStyle = '#e8d7f5'; c.beginPath(); c.ellipse(120, 236, 70, 12, 0, 0, Math.PI * 2); c.fill();
    dessinerEnfant(c, 110, 234, 4.2, tenueLou({ pose: 'dribble', anim: 0 }));
    dessinerBalle(c, 168, 210, 10 * 4.2 * 0.9, prog.tenue.ballon, 0.3);
  }

  function tenueLou(o) {
    const m = COULEURS_MAILLOTS[prog.tenue.maillot] || COULEURS_MAILLOTS[0];
    return Object.assign({ peau: '#8a5a3c', cheveux: '#2b1b12', coiffure: 'macarons', maillot: m.c, bande: m.s, raye: !!m.raye, short: '#2a2f6b', basket: COULEURS_BASKETS[prog.tenue.basket] || COULEURS_BASKETS[0], bandeau: '#ffffff' }, o);
  }
  const TENUE_AMI = { peau: '#f1c7a1', cheveux: '#9a5b2a', coiffure: 'court', maillot: '#35b86b', bande: '#ffffff', short: '#34406b', basket: '#ffffff', bandeau: '#ffd23f' };

  // ---------------------------------------------------------------------
  //  Démarrer, gagner, perdre
  // ---------------------------------------------------------------------
  function demarrerNiveau(n) {
    n = clamp(n, 0, NIVEAUX.length - 1);
    prog.debloque = Math.max(prog.debloque, n + 1);
    const def = NIVEAUX[n];
    monde = construire(def);
    jeu = { n: n, def: def, vies: VIES, prises: 0, score: 0, essais: 0, temps: 0, phase: 'jeu', minuteur: 0, check: { x: monde.depart.x, y: monde.depart.y }, avertiGrille: false };
    Object.assign(lou, { x: monde.depart.x, y: monde.depart.y, vx: 0, vy: 0, face: 1, sol: true, plat: null, coyote: 0, tampon: 0, tenue: 0, grimpe: null, invincible: 0, phase: 0 });
    balle = { etat: 'dribble' };
    particules = []; flottants = []; visee = null;
    cam.zoom = 1; cam.s = echelleBase(); cam.x = 0; cam.b = lou.y - 200;
    majCamera(1, true);
    ecran = 'jeu'; enPause = false; partieEnCours = true;
    entree.gauche = entree.droite = entree.saut = entree.sautPresse = false;
    ['ecran-titre', 'ecran-niveaux', 'ecran-vestiaire', 'ecran-fin', 'ecran-pause', 'visee'].forEach(function (id) { montrer(id, false); });
    montrer('hud', true); montrer('commandes', true);
    majHUD();
    toast(t('quartier.' + def.q) + ' · ' + t('hud.niveau', { n: n + 1 }), 1800);
    if (def.tuto && !prog.vus[def.tuto]) ouvrirTuto(def.tuto);
  }

  function majHUD() {
    if (!jeu) return;
    $('hud-niveau').textContent = t('hud.niveau', { n: jeu.n + 1 });
    $('hud-etoiles').textContent = '★ ' + nb(jeu.prises) + '/' + nb(monde.etoiles.length);
    const v = $('hud-vies');
    v.textContent = '';
    for (let i = 0; i < VIES; i++) { const s = document.createElement('span'); s.className = 'mini-balle' + (i < jeu.vies ? '' : ' vide'); v.appendChild(s); }
    v.setAttribute('aria-label', t('hud.ballons', { n: jeu.vies }));
  }

  function perdre(raison) {
    if (!jeu || jeu.phase !== 'jeu') return;
    jeu.phase = 'perte'; jeu.minuteur = 1.4; jeu.raison = raison;
    visee = null; montrer('visee', false); montrer('commandes', true);
    const p = (balle.etat === 'vol' || balle.etat === 'pose') ? { x: balle.x, y: balle.y } : posBalleLou();
    balle = { etat: 'fuite', x: p.x, y: p.y, vx: (raison === 'oiseau' ? -60 : 150) * lou.face, vy: raison === 'oiseau' ? 420 : 160, rot: 0 };
    if (raison === 'flaque' || raison === 'lob') { Son.jouer('plouf'); eclats(p.x, p.y, 18, ['#7cc8ff', '#bfe6ff', '#ffffff'], 160); balle.vy = 60; }
    Son.jouer('perdu');
    secousse = 0.35;
    toast(t('perte.' + raison), 1500);
  }

  function apresPerte() {
    jeu.vies--;
    majHUD();
    if (jeu.vies <= 0) { defaite(); return; }
    Object.assign(lou, { x: jeu.check.x, y: jeu.check.y, vx: 0, vy: 0, sol: true, plat: null, grimpe: null, invincible: 1.3, face: 1 });
    balle = { etat: 'dribble' };
    monde.amis.forEach(function (a) { if (a.x > jeu.check.x) a.etat = 'attend'; });
    jeu.phase = 'jeu';
    eclats(lou.x, lou.y + 20, 14, ['#ffffff', '#ffd23f'], 120);
  }

  function marquer() {
    jeu.phase = 'panier'; jeu.minuteur = 1.9;
    const premier = jeu.essais === 1;
    jeu.score += 300 + (premier ? 200 : 0);
    Son.jouer('panier');
    confettis(monde.panier.x, monde.panier.y);
    monde.panier.filet = 1;
    flotter(monde.panier.x, monde.panier.y + 30, t('flottant.points', { n: premier ? 500 : 300 }));
    toast(premier ? t('msg.premierCoup') : t('msg.panier'), 1600);
  }

  function victoire() {
    const n = jeu.n;
    const premier = jeu.essais === 1;
    const etoiles = 1 + (jeu.prises >= monde.etoiles.length ? 1 : 0) + (premier ? 1 : 0);
    jeu.score += jeu.vies * 100;
    const avantTotal = totalEtoiles();
    const ancienRecord = prog.records[n];
    const record = jeu.score > ancienRecord;
    prog.etoiles[n] = Math.max(prog.etoiles[n], etoiles);
    prog.records[n] = Math.max(ancienRecord, jeu.score);
    prog.gagnes[n] = true;
    prog.debloque = Math.max(prog.debloque, Math.min(n + 2, NIVEAUX.length));
    partieEnCours = false;
    sauver(Math.min(n + 2, NIVEAUX.length));
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
    const toutGagne = prog.gagnes.every(Boolean);
    if (toutGagne) {
      if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
    }
    // Objets débloqués par ce niveau
    const nouveaux = [];
    [[BALLONS, 'ballon'], [BASKETS, 'basket'], [MAILLOTS, 'maillot']].forEach(function (p) {
      p[0].forEach(function (s, i) { if (s > avantTotal && s <= totalEtoiles()) nouveaux.push(t(p[1] + '.' + i)); });
    });
    Son.jouer('victoire');
    afficherFin(true, { etoiles: etoiles, record: record, ancienRecord: ancienRecord, nouveaux: nouveaux, dernier: n === NIVEAUX.length - 1, toutGagne: toutGagne });
  }

  function defaite() {
    partieEnCours = false;
    jeu.phase = 'fin';
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: jeu.n + 1 });
    Son.jouer('defaite');
    afficherFin(false, { etoiles: 0, record: false, ancienRecord: prog.records[jeu.n], nouveaux: [] });
  }

  let compteur = null;
  function afficherFin(gagne, info) {
    if (jeu) jeu.phase = 'fin';
    ecran = 'fin';
    montrer('commandes', false); montrer('visee', false); montrer('hud', false);
    const n = jeu.n;
    $('fin-titre').textContent = gagne ? (info.dernier ? t('fin.tournoi') : t('fin.gagne')) : t('fin.perdu');
    const spans = $('fin-etoiles').querySelectorAll('span');
    spans.forEach(function (s) { s.classList.remove('on'); });
    $('fin-etoiles').classList.toggle('cache', !gagne);
    for (let i = 0; i < info.etoiles; i++) {
      (function (k) { setTimeout(function () { spans[k].classList.add('on'); Son.jouer('etoile'); }, 350 + k * 380); })(i);
    }
    // Score qui défile
    clearInterval(compteur);
    let affiche = 0;
    const cible = jeu.score;
    $('fin-score').textContent = t('fin.score', { n: 0 });
    compteur = setInterval(function () {
      affiche = Math.min(cible, affiche + Math.max(10, Math.ceil(cible / 30)));
      $('fin-score').textContent = t('fin.score', { n: affiche });
      if (affiche >= cible) clearInterval(compteur);
    }, 30);
    const detail = [];
    detail.push(t('fin.etoilesDorees', { n: jeu.prises, max: monde.etoiles.length }));
    if (gagne) detail.push(t('fin.essais', { n: jeu.essais }));
    $('fin-detail').textContent = detail.join(' · ');
    const rec = $('fin-record');
    rec.classList.toggle('nouveau', !!info.record);
    rec.textContent = info.record ? t('fin.nouveauRecord') : t('fin.record', { n: Math.max(info.ancienRecord, 0) });
    let deb = '';
    if (info.nouveaux.length) { deb = t('fin.debloque', { liste: info.nouveaux.join(', ') }); setTimeout(function () { Son.jouer('debloque'); }, 1500); }
    if (info.dernier && gagne) deb = (deb ? deb + ' ' : '') + t('fin.bravoFinal', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    else if (gagne && info.toutGagne) deb = (deb ? deb + ' ' : '') + t('fin.toutGagne');
    $('fin-debloque').textContent = deb;
    montrer('f-suivant', gagne && n < NIVEAUX.length - 1);
    montrer('f-reessayer', !gagne);
    montrer('f-rejouer', gagne);
    montrer('ecran-fin', true);
  }

  // --- Pause ---
  function pauser() {
    if (ecran !== 'jeu' || enPause || !jeu || jeu.phase === 'fin') return;
    enPause = true;
    relacherTout();
    montrer('ecran-pause', true);
    montrer('b-aide', !!jeu.def.tuto);
  }
  function reprendre() {
    enPause = false;
    montrer('ecran-pause', false);
  }
  function relacherTout() {
    entree.gauche = entree.droite = entree.saut = false;
    for (const k in touches) touches[k] = false;
    document.querySelectorAll('.cmd.appui').forEach(function (b) { b.classList.remove('appui'); });
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés
  // ---------------------------------------------------------------------
  const TUTO_ETAPES = { bases: 3, trou: 2, flaque: 2, tramp: 2, drapeau: 2, tir: 3, passe: 3, arros: 2, pigeon: 2, panier: 2, grille: 3, mouette: 2, platH: 2, platV: 2, vapeur: 2, finale: 2 };
  function ouvrirTuto(cle) {
    tutoOuvert = { cle: cle, debut: horloge };
    relacherTout();
    $('tuto-titre').textContent = t('tuto.' + cle + '.titre');
    const ol = $('tuto-etapes'); ol.textContent = '';
    for (let i = 1; i <= TUTO_ETAPES[cle]; i++) { const li = document.createElement('li'); li.textContent = t('tuto.' + cle + '.' + i); ol.appendChild(li); }
    montrer('ecran-pause', false);
    montrer('ecran-tuto', true);
  }
  function fermerTuto() {
    if (!tutoOuvert) return;
    prog.vus[tutoOuvert.cle] = true;
    tutoOuvert = null;
    enPause = false;
    montrer('ecran-tuto', false);
    Son.init(); Son.jouer('clic');
  }

  // ---------------------------------------------------------------------
  //  Visée (panier final et tir en cloche par-dessus les grillages)
  // ---------------------------------------------------------------------
  function commencerVisee(mode) {
    visee = { mode: mode, angle: mode === 'panier' ? 58 : 66, force: mode === 'panier' ? 0.5 : 0.35, tire: null, recul: null };
    // Trop près du grillage : Lou recule d'un pas pour avoir la place de lancer
    if (mode === 'lob') {
      const g = monde.grilles.filter(function (gr) { return gr.x > lou.x; })[0];
      if (g && g.x - lou.x < 1.3 * T) visee.recul = g.x - 1.3 * T;
    }
    balle = { etat: 'tenu' };
    lou.vx = 0; lou.face = 1;
    relacherTout();
    montrer('commandes', false);
    montrer('visee', true);
    montrer('b-retour', mode === 'lob');
    $('visee-aide').textContent = t(mode === 'panier' ? 'visee.panier' : 'visee.lob');
    if (mode === 'panier' && !prog.vus.tir) ouvrirTuto('tir');
  }
  function annulerVisee() {
    if (!visee || visee.mode !== 'lob') return;
    visee = null;
    balle = { etat: 'dribble' };
    montrer('visee', false); montrer('commandes', true);
  }
  // Le tir en cloche part du centre de Lou : jamais de l'autre côté du grillage
  function departTir() { return { x: lou.x + (visee && visee.mode === 'lob' ? 0 : 10), y: lou.y + LH + 10 }; }
  function vitesseTir(v) { const a = v.angle * Math.PI / 180, s = 300 + v.force * 620; return { vx: Math.cos(a) * s, vy: Math.sin(a) * s }; }
  function tirer() {
    if (!visee || !jeu || jeu.phase !== 'jeu' || visee.recul != null) return;
    const d = departTir(), v = vitesseTir(visee);
    balle = { etat: 'vol', mode: visee.mode, x: d.x, y: d.y, vx: v.vx, vy: v.vy, t: 0, rot: 0, rebonds: 0 };
    if (visee.mode === 'panier') jeu.essais++;
    visee = null;
    montrer('visee', false);
    if (balle.mode === 'lob') montrer('commandes', true);
    Son.jouer('tir');
  }

  // ---------------------------------------------------------------------
  //  Mise à jour du jeu
  // ---------------------------------------------------------------------
  function approche(v, cible, pas) { return v < cible ? Math.min(cible, v + pas) : Math.max(cible, v - pas); }

  function majMonde(dt) {
    for (const p of monde.plats) {
      const avX = p.x, avY = p.y;
      if (p.pause > 0) { p.pause -= dt; p.dx = 0; p.dy = 0; continue; }
      const finAvant = p.type === 'h' ? (p.x >= p.b || p.x <= p.a) : (p.y >= p.b || p.y <= p.a);
      if (p.type === 'h') { p.x += p.dir * p.v * dt; if (p.x > p.b) { p.x = p.b; p.dir = -1; } if (p.x < p.a) { p.x = p.a; p.dir = 1; } }
      else { p.y += p.dir * p.v * dt; if (p.y > p.b) { p.y = p.b; p.dir = -1; } if (p.y < p.a) { p.y = p.a; p.dir = 1; } }
      p.dx = p.x - avX; p.dy = p.y - avY;
      // Petite pause à chaque bout : le temps de monter ou de descendre
      const finApres = p.type === 'h' ? (p.x >= p.b || p.x <= p.a) : (p.y >= p.b || p.y <= p.a);
      if (finApres && !finAvant) p.pause = 0.7;
    }
    for (const a of monde.arroseurs) {
      const c = (jeu.temps + a.phase) % 3.2;
      a.actif = c < 1.6;
      a.alerte = c > 2.7;
    }
    const vo = jeu.def.oiseau;
    for (const o of monde.oiseaux) {
      o.x += o.dir * vo * dt;
      if (o.x > o.x1) { o.x = o.x1; o.dir = -1; }
      if (o.x < o.x0) { o.x = o.x0; o.dir = 1; }
      o.y = o.y0 + Math.sin(jeu.temps * 4 + o.ph) * 6;
    }
    const pa = monde.panier;
    if (pa.mobile) pa.y = pa.base + Math.sin(jeu.temps * 1.8) * T * 0.9;
    pa.filet = Math.max(0, pa.filet - dt * 1.5);
    for (const c of monde.cols) if (c.ecrase) c.ecrase = Math.max(0, c.ecrase - dt * 3);
    for (const d of monde.drapeaux) if (d.actif) d.levee = Math.min(1, d.levee + dt * 2);
    for (const a of monde.amis) a.salut += dt;
  }

  function majLou(dt) {
    const L = lou;
    if (L.invincible > 0) L.invincible -= dt;
    if (L.plat) { L.x += L.plat.dx; L.y += L.plat.dy; }

    // Escalade d'un grillage (sans ballon)
    if (L.grimpe) {
      const g = L.grimpe.g, dir = L.grimpe.dir;
      const pousse = dir > 0 ? entree.droite : entree.gauche;
      const recule = dir > 0 ? entree.gauche : entree.droite;
      if (recule || aBalle()) { L.grimpe = null; }
      else {
        if (pousse) { L.y += 115 * dt; if (Math.random() < dt * 8) Son.jouer('grimpe'); }
        L.vy = 0; L.vx = 0;
        if (L.y >= g.y + g.haut) { L.y = g.y + g.haut + 2; L.vy = 220; L.vx = dir * 95; L.grimpe = null; Son.jouer('saut'); }
        L.anim += dt * 8;
        return;
      }
    }

    const dir = (entree.droite ? 1 : 0) - (entree.gauche ? 1 : 0);
    L.vx = approche(L.vx, dir * VITESSE, (L.sol ? 1700 : 1000) * dt);
    if (dir) L.face = dir;

    // Saut (avec petite marge avant l'atterrissage et après le bord)
    if (entree.sautPresse) { entree.sautPresse = false; L.tampon = 0.13; }
    if (L.tampon > 0) {
      L.tampon -= dt;
      if (L.sol || L.coyote > 0) {
        L.vy = SAUT; L.tenue = TENUE; L.sol = false; L.coyote = 0; L.tampon = 0; L.plat = null;
        Son.jouer('saut');
        eclats(L.x, L.y, 5, ['#ffffff', '#e8e0d0'], 60, 100);
      }
    }
    let g = GRAV;
    if (L.vy > 0 && entree.saut && L.tenue > 0) { g = GRAV_TENUE; L.tenue -= dt; } else if (!entree.saut) L.tenue = 0;

    // Vapeur des cheminées : elle soulève Lou
    let vapeur = false;
    for (const v of monde.vapeurs) {
      if (Math.abs(L.x - v.x) < T * 0.8 && L.y >= v.bas - 6 && L.y < v.haut) { vapeur = true; break; }
    }
    if (vapeur) {
      g = 0; L.vy = approche(L.vy, 210, 2100 * dt);
      if (Math.random() < dt * 3) Son.jouer('vapeur');
      if (Math.random() < dt * 20) particules.push({ x: L.x + (Math.random() - 0.5) * 20, y: L.y, vx: 0, vy: 60, vie: 0.6, max: 0.6, c: 'rgba(255,255,255,0.8)', r: 4, g: -50 });
    }
    L.vy -= g * dt;
    L.vy = Math.max(L.vy, -950);
    const etaitAuSol = L.sol;

    // Déplacement horizontal et murs
    L.x += L.vx * dt;
    resoudreX();
    // Grillages : murs, sauf si on les escalade
    for (const gr of monde.grilles) {
      if (L.y < gr.y + gr.haut - 1 && L.y + LH > gr.y && Math.abs(L.x - gr.x) < LW + 8) {
        const cote = L.x < gr.x ? -1 : 1;
        L.x = gr.x + cote * (LW + 8.01);
        L.vx = 0;
        if (!aBalle()) {
          if (cote < 0 && entree.droite) L.grimpe = { g: gr, dir: 1 };
          if (cote > 0 && entree.gauche) L.grimpe = { g: gr, dir: -1 };
        } else if (!jeu.avertiGrille && cote < 0) { jeu.avertiGrille = true; toast(t('msg.grille'), 2000); }
      }
    }
    // Ligne de tir : on s'arrête dessus
    if (L.x > monde.ligne.x) { L.x = monde.ligne.x; L.vx = Math.min(0, L.vx); }

    // Déplacement vertical, sol et plateformes
    const ancienY = L.y;
    L.y += L.vy * dt;
    resoudreY(ancienY, etaitAuSol);

    // Animation de course et rebonds du ballon
    L.anim += Math.abs(L.vx) * dt * 0.06;
    const avant = Math.floor(L.phase / Math.PI);
    L.phase += dt * (Math.abs(L.vx) > 30 ? 8.4 : 5.6);
    if (L.sol && aBalle() && Math.floor(L.phase / Math.PI) !== avant) {
      Son.jouer('rebond');
      const bp = posBalleLou();
      if (Math.random() < 0.5) particules.push({ x: bp.x, y: L.y, vx: (Math.random() - 0.5) * 40, vy: 30, vie: 0.3, max: 0.3, c: 'rgba(255,255,255,0.6)', r: 2.5, g: 100 });
    }
  }

  function resoudreX() {
    const L = lou;
    const i0 = Math.floor((L.x - LW) / T), i1 = Math.floor((L.x + LW - 0.001) / T);
    for (let i = i0; i <= i1; i++) {
      if (topCol(i) > L.y + 1) {
        if (L.x < i * T + T / 2) L.x = i * T - LW - 0.01; else L.x = (i + 1) * T + LW + 0.01;
        L.vx = 0;
      }
    }
  }

  function resoudreY(ancienY, etaitAuSol) {
    const L = lou;
    L.sol = false; L.plat = null;
    if (L.vy <= 0) {
      let meilleur = -Infinity, surf = null, plat = null;
      const i0 = Math.floor((L.x - LW + 3) / T), i1 = Math.floor((L.x + LW - 3) / T);
      for (let i = i0; i <= i1; i++) {
        const top = topCol(i);
        if (top <= ancienY + 1 && top > meilleur) { meilleur = top; surf = monde.cols[i]; }
      }
      for (const p of monde.plats) {
        if (L.x + LW - 3 > p.x && L.x - LW + 3 < p.x + p.w && p.y <= ancienY + 1 + Math.max(0, p.dy) && p.y > meilleur) { meilleur = p.y; plat = p; surf = null; }
      }
      if (L.y <= meilleur) {
        const vitesseChute = L.vy;
        L.y = meilleur; L.vy = 0; L.sol = true; L.plat = plat;
        if (surf && surf.t === 'tr') {
          L.vy = TRAMP; L.sol = false; L.plat = null; surf.ecrase = 1; L.tenue = 0;
          Son.jouer('tramp');
          eclats(L.x, L.y, 8, ['#ff8a2a', '#ffd23f'], 120);
        } else if (!etaitAuSol && vitesseChute < -350) {
          eclats(L.x, L.y, 6, ['#ffffff', '#e0d6c6'], 70, 120);
        }
      }
    }
    if (etaitAuSol && !L.sol && L.vy <= 0) L.coyote = 0.09; else if (L.coyote > 0) L.coyote -= 1 / 60;
  }

  // Ballon : passes, renvois, tirs et rebonds
  function majBalle(dt) {
    const L = lou;
    if (balle.etat === 'dribble') {
      if (jeu.phase !== 'jeu') return;
      // Flaques et sol mouillé
      if (L.sol && !L.plat && !L.grimpe) {
        const i = Math.floor(L.x / T), c = colA(L.x);
        if (c && c.t === 'f') { perdre('flaque'); return; }
        if (mouille(i)) { perdre('arroseur'); return; }
      }
      // Oiseaux
      if (L.invincible <= 0) {
        const bp = posBalleLou();
        for (const o of monde.oiseaux) {
          const dx = Math.max(Math.abs(o.x - L.x) - LW + 3, 0), dy = Math.max(Math.abs(o.y - (L.y + LH / 2)) - LH / 2, 0);
          if (dx * dx + dy * dy < 8 * 8 || Math.hypot(o.x - bp.x, o.y - bp.y) < 16) { Son.jouer('oiseau'); perdre('oiseau'); return; }
        }
      }
      return;
    }
    if (balle.etat === 'passe' || balle.etat === 'renvoi') {
      balle.k += dt / balle.duree;
      const k = Math.min(1, balle.k);
      balle.x = lerp(balle.x0, balle.x1, k);
      balle.y = lerp(balle.y0, balle.y1, k) + Math.sin(k * Math.PI) * balle.haut;
      balle.rot += dt * 8;
      if (balle.etat === 'renvoi' && Math.hypot(balle.x - L.x, balle.y - (L.y + 22)) < 30) { attraper(); return; }
      if (k >= 1) {
        if (balle.etat === 'passe') { balle.ami.etat = 'tient'; balle = { etat: 'ami', ami: balle.ami }; Son.jouer('attrape'); }
        else { balle = { etat: 'pose', x: balle.x1, y: balle.y1, sol: balle.y1 - RB, ami: balle.ami, rot: 0 }; Son.jouer('rebond'); }
      }
      return;
    }
    if (balle.etat === 'ami') {
      const a = balle.ami;
      if (a.recep && L.x > a.recep.x - 5 * T) {
        a.etat = 'lance';
        balle = { etat: 'renvoi', ami: a, x0: a.x + 8, y0: a.yb + 40, x1: a.recep.x, y1: a.recep.y + RB, k: 0, duree: 0.95, haut: 70, x: a.x, y: a.yb + 40, rot: 0 };
        Son.jouer('passe');
      }
      return;
    }
    if (balle.etat === 'pose') {
      if (Math.abs(balle.x - L.x) < 24 && L.y <= balle.y + 12 && L.y + LH >= balle.y - 12) attraper();
      return;
    }
    if (balle.etat === 'vol') { majVol(dt); return; }
  }

  function attraper() {
    balle = { etat: 'dribble' };
    Son.jouer('attrape');
    eclats(lou.x, lou.y + 30, 8, ['#ffd23f', '#ffffff'], 90);
  }

  function majVol(dt) {
    const b = balle;
    b.t += dt;
    const px = b.x, py = b.y;
    b.vy -= GB * dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.rot += b.vx * dt * 0.05;
    // Sol et côtés des bâtiments
    const i = Math.floor(b.x / T), top = topCol(i);
    if (b.y - RB < top) {
      if (py - RB >= top - 2) {
        b.y = top + RB;
        const c = monde.cols[i];
        if (b.mode === 'lob' && jeu.phase === 'jeu' && c && (c.t === 'f' || mouille(i))) { perdre('lob'); return; }
        if (Math.abs(b.vy) > 80) Son.jouer('rebond');
        b.vy = -b.vy * 0.45; b.vx *= 0.55; b.rebonds++;
        if (Math.abs(b.vy) < 70) { finVol(); return; }
      } else { b.x = px; b.vx = -b.vx * 0.5; }
    }
    // Plateformes (le ballon peut s'y poser)
    for (const p of monde.plats) {
      if (b.x > p.x && b.x < p.x + p.w && b.y - RB < p.y && py - RB >= p.y - 2) {
        b.y = p.y + RB; b.vy = -b.vy * 0.45; b.vx *= 0.55;
        if (Math.abs(b.vy) < 70) { b.vy = 0; b.y = p.y + RB; finVol(); return; }
      }
    }
    // Grillages
    for (const gr of monde.grilles) {
      if (b.y < gr.y + gr.haut + RB * 0.3 && b.y > gr.y) {
        if (px <= gr.x - 4 - RB + 0.5 && b.x > gr.x - 4 - RB) { b.x = gr.x - 4 - RB; b.vx = -Math.abs(b.vx) * 0.4; Son.jouer('planche'); }
        else if (px >= gr.x + 4 + RB - 0.5 && b.x < gr.x + 4 + RB) { b.x = gr.x + 4 + RB; b.vx = Math.abs(b.vx) * 0.4; Son.jouer('planche'); }
      }
    }
    // Panier : cercle, planche et poteau
    if (b.mode === 'panier') {
      const pa = monde.panier;
      [pa.x - RIM, pa.x + RIM].forEach(function (cx) {
        const dx = b.x - cx, dy = b.y - pa.y, d = Math.hypot(dx, dy);
        if (d < RB + 3 && d > 0) {
          const nx = dx / d, ny = dy / d;
          b.x = cx + nx * (RB + 3); b.y = pa.y + ny * (RB + 3);
          const vn = b.vx * nx + b.vy * ny;
          if (vn < 0) { b.vx -= 1.6 * vn * nx; b.vy -= 1.6 * vn * ny; Son.jouer('cercle'); }
        }
      });
      const bx = pa.x + RIM + 4;
      if (b.y > pa.y - 12 && b.y < pa.y + 66 && b.x + RB > bx && px + RB <= bx + 1) { b.x = bx - RB; b.vx = -Math.abs(b.vx) * 0.6; Son.jouer('planche'); }
      if (jeu.phase === 'jeu' && py > pa.y && b.y <= pa.y && Math.abs(b.x - pa.x) < RIM - 3 && b.vy < 0) {
        b.vx *= 0.3; marquer();
      }
      if (b.t > 4 || b.x > monde.largeur + 100) { finVol(); return; }
    }
    // Ballon tombé dans le vide
    if (b.y < monde.minH * T - 4 * T) {
      if (b.mode === 'lob') { if (jeu.phase === 'jeu') perdre('trou'); }
      else finVol();
      return;
    }
    if (b.t > 5) finVol();
  }

  function finVol() {
    if (balle.mode === 'panier') {
      if (jeu.phase === 'jeu') {
        balle = { etat: 'tenu' };
        toast(t('msg.rate'), 1200);
        commencerVisee('panier');
      } else balle.etat = 'repos';
    } else {
      const i = Math.floor(balle.x / T), top = topCol(i);
      let y = top;
      for (const p of monde.plats) if (balle.x > p.x && balle.x < p.x + p.w && Math.abs(balle.y - RB - p.y) < 6) y = p.y;
      balle = { etat: 'pose', x: balle.x, y: (isFinite(y) ? y : balle.y - RB) + RB, rot: 0 };
    }
  }

  function majObjets() {
    const L = lou;
    for (const e of monde.etoiles) {
      if (!e.prise && Math.abs(e.x - L.x) < LW + 14 && e.y > L.y - 14 && e.y < L.y + LH + 14) {
        e.prise = true; jeu.prises++; jeu.score += 100;
        Son.jouer('etoile');
        eclats(e.x, e.y, 16, ['#ffd23f', '#fff3a0', '#ffffff'], 160, 200);
        flotter(e.x, e.y + 20, t('flottant.points', { n: 100 }));
        majHUD();
      }
    }
    for (const d of monde.drapeaux) {
      if (!d.actif && L.x > d.x && aBalle() && L.sol) {
        d.actif = true; jeu.check = { x: d.hx, y: d.hy };
        Son.jouer('drapeau');
        eclats(d.x, d.hy + 60, 12, ['#35b86b', '#ffd23f', '#ffffff'], 120);
        toast(t('msg.drapeau'), 1100);
      }
    }
    // Arrivée sur la ligne de tir
    if (aBalle() && !visee && L.sol && L.x >= monde.ligne.x - 1) commencerVisee('panier');
    // Chute dans le vide
    if (L.y < monde.minH * T - 3 * T) perdre('chute');
  }

  // Bouton d'action : passe à l'ami ou tir en cloche
  function actionPossible() {
    if (!jeu || jeu.phase !== 'jeu' || visee || balle.etat !== 'dribble' || !lou.sol || lou.grimpe) return null;
    for (const a of monde.amis) if (a.etat === 'attend' && lou.x > a.x - 3 * T && lou.x < a.x + 2 * T) return { type: 'passe', ami: a };
    for (const g of monde.grilles) if (g.x - lou.x > 0 && g.x - lou.x < 3.2 * T) return { type: 'lob', g: g };
    return null;
  }
  let actionAffichee = null;
  function majBoutonAction() {
    const a = actionPossible();
    const type = a ? a.type : null;
    if (type !== actionAffichee) {
      actionAffichee = type;
      const b = $('b-action');
      b.classList.toggle('cache', !type);
      if (type) { b.textContent = t(type === 'passe' ? 'btn.passe' : 'btn.lob'); b.setAttribute('aria-label', b.textContent); }
    }
  }
  function faireAction() {
    const a = actionPossible();
    if (!a) return;
    if (a.type === 'passe') {
      const p = posBalleLou();
      a.ami.etat = 'recoit';
      balle = { etat: 'passe', ami: a.ami, x0: p.x, y0: p.y, x1: a.ami.x + 8, y1: a.ami.yb + 40, k: 0, duree: 0.55, haut: 40, x: p.x, y: p.y, rot: 0 };
      Son.jouer('passe');
      toast(t('msg.passe'), 1400);
    } else commencerVisee('lob');
  }

  function majCamera(dt, net) {
    const base = echelleBase();
    let zoom = 1, cx;

  function dessinerColonne(c, col, i, x, yTop, w, bas, s, q) {

  function dessinerJeu() {

  // Dessin de l'écran titre : Lou dribble sur un toit au coucher du soleil

        dessinerEnfant(c, lx, sol, s, tenueLou({ pose: etape === 1 ? 'cours' : 'idle', anim: tt * 8, face: 1 }));

  // ---------------------------------------------------------------------
  //  Boucle principale
  // ---------------------------------------------------------------------
  function redimensionner() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  }
  let dernier = 0;
  function boucle(ms) {
    const dt = Math.min(0.033, Math.max(0, (ms - dernier) / 1000));
    dernier = ms;
    try {
      maj(dt);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      if (ecran === 'jeu' || ecran === 'fin') { if (monde) dessinerJeu(); }
      else dessinerTitre();
      dessinerTuto();
    } finally {
      requestAnimationFrame(boucle);
    }
  }

  // ---------------------------------------------------------------------
  //  Commandes
  // ---------------------------------------------------------------------
  function brancherBouton(id, quand) {
    const b = $(id);
    const fin = function (e) { b.classList.remove('appui'); quand(false); if (e) e.preventDefault(); };
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault(); Son.init();
      try { b.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
      b.classList.add('appui'); quand(true);
    });
    b.addEventListener('pointerup', fin);
    b.addEventListener('pointercancel', fin);
    b.addEventListener('lostpointercapture', function () { b.classList.remove('appui'); quand(false); });
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }
  brancherBouton('b-gauche', function (on) { entree.gauche = on; });
  brancherBouton('b-droite', function (on) { entree.droite = on; });
  brancherBouton('b-saut', function (on) { if (on && !entree.saut) entree.sautPresse = true; entree.saut = on; });
  $('b-action').addEventListener('pointerdown', function (e) { e.preventDefault(); Son.init(); faireAction(); });
  $('b-tirer').addEventListener('click', function () { Son.init(); tirer(); });
  $('b-retour').addEventListener('click', function () { Son.init(); Son.jouer('clic'); annulerVisee(); });

  // Visée au doigt ou à la souris : on tire vers l'arrière, puis on lâche
  let glisse = null;
  canvas.addEventListener('pointerdown', function (e) {
    Son.init();
    if (!visee || enPause || tutoOuvert) return;
    glisse = { id: e.pointerId, x0: e.clientX, y0: e.clientY, angle: visee.angle, force: visee.force };
    visee.tire = { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY };
    try { canvas.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!glisse || !visee || e.pointerId !== glisse.id) return;
    const dx = glisse.x0 - e.clientX, dy = e.clientY - glisse.y0;
    visee.tire.x = e.clientX; visee.tire.y = e.clientY;
    const l = Math.hypot(dx, dy);
    if (l > 10) {
      visee.angle = clamp(Math.atan2(dy, Math.max(dx, 1)) * 180 / Math.PI, 12, 82);
      visee.force = clamp(l / 150, 0, 1);
    }
  });
  const finGlisse = function (e) {
    if (!glisse || e.pointerId !== glisse.id) return;
    const l = Math.hypot(glisse.x0 - e.clientX, e.clientY - glisse.y0);
    glisse = null;
    if (visee) { visee.tire = null; if (l > 14) tirer(); }
  };
  canvas.addEventListener('pointerup', finGlisse);
  canvas.addEventListener('pointercancel', function () { glisse = null; if (visee) visee.tire = null; });

  const CODES_JEU = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'];
  window.addEventListener('keydown', function (e) {
    Son.init();
    if (tutoOuvert) { if (e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape') { e.preventDefault(); fermerTuto(); } return; }
    // Entrée ou Espace sans bouton choisi : le bouton principal de l'écran
    const libre = !document.activeElement || document.activeElement === document.body;
    if (libre && !e.repeat && (e.code === 'Enter' || e.code === 'Space')) {
      let b = null;
      if (ecran === 'titre') b = $('b-jouer');
      if (ecran === 'fin') b = ['f-suivant', 'f-reessayer', 'f-rejouer'].map($).filter(function (x) { return !x.classList.contains('cache'); })[0];
      if (b) { e.preventDefault(); b.click(); return; }
    }
    if (ecran === 'jeu' && !enPause && CODES_JEU.indexOf(e.code) >= 0) e.preventDefault();
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (ecran === 'jeu') { e.preventDefault(); if (enPause) reprendre(); else pauser(); }
      return;
    }
    if (ecran !== 'jeu' || enPause) return;
    touches[e.code] = true;
    if (visee) {
      if (!e.repeat && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); tirer(); }
      if (e.code === 'KeyX' || e.code === 'Backspace') { e.preventDefault(); annulerVisee(); }
      return;
    }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA' || e.code === 'KeyQ') entree.gauche = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') entree.droite = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'KeyZ') { if (!e.repeat && !entree.saut) entree.sautPresse = true; entree.saut = true; }
    if ((e.code === 'KeyE' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); faireAction(); }
  });
  window.addEventListener('keyup', function (e) {
    touches[e.code] = false;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA' || e.code === 'KeyQ') entree.gauche = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') entree.droite = false;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'KeyZ') entree.saut = false;
  });
  window.addEventListener('blur', relacherTout);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') pauser(); });

  // Boutons des écrans
  const clic = function (id, f) { $(id).addEventListener('click', function () { Son.init(); Son.jouer('clic'); f(); }); };
  clic('b-jouer', function () {
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: function (d) { demarrerNiveau(clamp(Math.floor(d.niveau) || 1, 1, NIVEAUX.length) - 1); },
      onNouvelle: function () { demarrerNiveau(0); }
    });
  });
  clic('b-niveaux', ouvrirNiveaux);
  clic('b-vestiaire', ouvrirVestiaire);
  clic('b-niveaux-retour', allerTitre);
  clic('b-vestiaire-retour', allerTitre);
  $('b-son').addEventListener('click', basculerSon);
  $('b-son-titre').addEventListener('click', basculerSon);
  $('b-son-pause').addEventListener('click', basculerSon);
  clic('b-pause', pauser);
  clic('b-reprendre', reprendre);
  clic('b-recommencer', function () { enPause = false; demarrerNiveau(jeu.n); });
  clic('b-aide', function () { if (jeu && jeu.def.tuto) ouvrirTuto(jeu.def.tuto); });
  clic('b-accueil', function () { if (partieEnCours && jeu) sauver(jeu.n + 1); allerTitre(); });
  $('b-tuto-ok').addEventListener('click', fermerTuto);
  $('ecran-tuto').addEventListener('click', function (e) { if (e.target === $('ecran-tuto')) fermerTuto(); });
  clic('f-suivant', function () { demarrerNiveau(jeu.n + 1); });
  clic('f-reessayer', function () { demarrerNiveau(jeu.n); });
  clic('f-rejouer', function () { demarrerNiveau(jeu.n); });
  clic('f-niveaux', ouvrirNiveaux);
  clic('f-accueil', allerTitre);

  // Sauvegarde à la fermeture de la page, seulement pendant une partie
  window.JEL_SAVE.surFermeture(function () {
    if (partieEnCours && jeu) JEL_SAVE.save(JEU, donneesSauvegarde(jeu.n + 1));
  });

  window.addEventListener('resize', redimensionner);
  redimensionner();
  majBoutonsSon();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
