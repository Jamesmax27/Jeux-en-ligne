  // ---------------------------------------------------------------------
  //  Carte de question
  // ---------------------------------------------------------------------

  let carte = null;   // { q, siege, interactif, repondu, finChrono, resteChrono, jeton }
  let jetonCarte = 0;

  function texteQuestion(q) {
    if (q.ty === 'b') return tr('q.balle.' + q.s);
    if (q.ty === 'o') return tr('q.objet.' + q.s);
    if (q.ty === 'l') return tr('q.lieu');
    if (q.ty === 'i') return tr('q.intrus');
    return tr('q.ombre');
  }
  const nomChoix = (q, id) => tr((q.ty === 'l' ? 'lieu.' : 'obj.') + id);

  function ouvrirCarte(q, siege) {
    const moi = siege === monSiege();
    const info = siegesActuels()[siege] || {};
    const humain = moi || info.humain;
    jetonCarte++;
    carte = { q: q, siege: siege, interactif: moi, repondu: false, finChrono: q.c && humain ? Date.now() + q.c * 1000 : 0, resteChrono: 0, dernierTic: -1, jeton: jetonCarte };
    const el = $('carte-q');
    el.classList.remove('secoue');
    const f = $('q-face').getContext('2d'); f.clearRect(0, 0, 68, 68); medaillon(f, siege, 34, 34, 32, moi ? prog.maillot : 0);
    $('q-qui').textContent = moi ? tr('q.toi') : tr('q.autre', { nom: nomPhrase(siege) });
    const diff = $('q-diff'); diff.className = 'k' + q.k; diff.textContent = tr('q.diff', { n: q.k, diff: tr('diff.' + q.k) });
    $('q-texte').textContent = texteQuestion(q);
    const sujet = $('q-sujet');
    sujet.hidden = !(q.ty === 'l' || q.ty === 's');
    if (!sujet.hidden) { const c = sujet.getContext('2d'); c.clearRect(0, 0, 240, 192); objet(c, q.s, 120, 96, 170, q.ty === 's'); }
    const boite = $('q-choix');
    boite.textContent = '';
    boite.classList.toggle('trois', q.ch.length === 3);
    q.ch.forEach((id, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'rep'; b.dataset.i = String(i);
      const cv = document.createElement('canvas'); cv.width = 160; cv.height = 120;
      dessinerChoix(cv, q, id);
      const n = document.createElement('span'); n.className = 'num'; n.textContent = nb(i + 1); n.setAttribute('aria-hidden', 'true');
      b.append(cv, n);
      b.setAttribute('aria-label', tr('q.choixAria', { n: i + 1, nom: nomChoix(q, id) }));
      b.disabled = !moi;
      b.addEventListener('click', () => { audio(); repondre(i); });
      boite.appendChild(b);
    });
    $('q-temps').hidden = !carte.finChrono;
    $('q-temps').firstElementChild.style.transform = 'scaleX(1)';
    const ret = $('q-retour'); ret.textContent = moi && q.c ? tr('q.chrono', { n: q.c }) : ''; ret.className = '';
    el.classList.add('actif');
    sons.question();
    if (moi) { const b0 = boite.querySelector('button'); if (b0) try { b0.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  }

  function fermerCarte() { carte = null; $('carte-q').classList.remove('actif'); }

  function repondre(i) {
    if (!carte || !carte.interactif || carte.repondu || enPause || !partie || !partie.monTour() || !vue || vue.ph !== 'q') return;
    carte.repondu = true;
    document.querySelectorAll('#q-choix .rep').forEach((b) => { b.disabled = true; b.classList.toggle('vise', Number(b.dataset.i) === i); });
    sons.clic();
    if (!partie.jouer({ t: 'r', i: i })) carte.repondu = false;
  }

  // Résultat d'une réponse sur la carte : bonne réponse en vert, erreur en rouge.
  function revelerCarte(der, q) {
    if (!carte || !q) return;
    const moi = der.p === monSiege();
    document.querySelectorAll('#q-choix .rep').forEach((b) => {
      const i = Number(b.dataset.i);
      b.disabled = true;
      b.classList.remove('vise');
      if (i === q.b) b.classList.add('bonne'); else if (i === der.i) b.classList.add('faux');
    });
    $('q-temps').hidden = true;
    carte.finChrono = 0;
    const nom = nomChoix(q, q.ch[q.b]), ret = $('q-retour');
    if (der.ok) { ret.textContent = moi ? tr('rep.bravo', { n: der.k }) : tr('rep.botBon', { qui: nomPhrase(der.p), nom: nom }); ret.className = 'ok'; sons.bon(); }
    else {
      ret.textContent = der.i < 0 ? tr('rep.temps', { nom: nom }) : (moi ? tr('rep.faux', { nom: nom }) : tr('rep.botFaux', { qui: nomPhrase(der.p), nom: nom }));
      ret.className = 'ko'; sons.faux();
      const el = $('carte-q'); el.classList.remove('secoue'); void el.offsetWidth; el.classList.add('secoue');
    }
    const j = carte.jeton;
    setTimeout(() => { if (carte && carte.jeton === j) fermerCarte(); }, moi ? 1250 : 1050);
  }

  // Chrono de la ligne droite : barre qui se vide, puis réponse « temps écoulé ».
  function majChrono() {
    if (!carte || !carte.finChrono || enPause) return;
    const q = carte.q, reste = Math.max(0, carte.finChrono - Date.now());
    $('q-temps').firstElementChild.style.transform = 'scaleX(' + (reste / (q.c * 1000)).toFixed(3) + ')';
    const sec = Math.ceil(reste / 1000);
    if (carte.interactif && sec <= 3 && sec > 0 && sec !== carte.dernierTic) { carte.dernierTic = sec; sons.tic(); }
    if (reste <= 0 && carte.interactif && !carte.repondu) {
      carte.repondu = true;
      carte.finChrono = 0;
      document.querySelectorAll('#q-choix .rep').forEach((b) => { b.disabled = true; });
      if (partie && partie.monTour() && vue && vue.ph === 'q') partie.jouer({ t: 'r', i: -1 });
    }
  }

  // ---------------------------------------------------------------------
  //  Médaille : choisir le rival devant qui la poser
  // ---------------------------------------------------------------------

  function ouvrirMedaille() {
    if (!peutChoisir() || !vue || vue.cfg.med <= 0 || vue.mu || vue.md[monSiege()] <= 0) return;
    modeMedaille = true;
    const boite = $('rivaux');
    boite.textContent = '';
    let k = 0;
    for (let s = 0; s < PLACES; s++) {
      if (s === monSiege()) continue;
      k++;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'rival'; b.dataset.s = String(s); b.dataset.k = String(k);
      const cv = document.createElement('canvas'); cv.width = 68; cv.height = 68; medaillon(cv.getContext('2d'), s, 34, 34, 32, 0);
      const sp = document.createElement('span'); sp.textContent = nomPhrase(s);
      b.append(cv, sp);
      b.setAttribute('aria-label', tr('medaille.aria', { nom: nomPhrase(s) }));
      b.disabled = O.caseMedaille(vue, s) < 0;
      b.addEventListener('click', () => { audio(); poserMedaille(s); });
      boite.appendChild(b);
    }
    const ann = document.createElement('button');
    ann.type = 'button'; ann.className = 'btn'; ann.textContent = '✕'; ann.setAttribute('aria-label', tr('medaille.annuler'));
    ann.addEventListener('click', () => { sons.clic(); fermerMedaille(); majActions(); });
    boite.appendChild(ann);
    sons.clic();
    majActions();
    toast(tr('medaille.choisis'), 2000);
    const b0 = boite.querySelector('button:not(:disabled)'); if (b0) try { b0.focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }
  function fermerMedaille() { modeMedaille = false; $('pas').hidden = false; $('rivaux').hidden = true; }
  function poserMedaille(s) {
    if (!peutChoisir()) return;
    fermerMedaille();
    partie.jouer({ t: 'm', c: s });
    majActions();
  }

  function choisirPas(k) {
    if (!peutChoisir()) {
      if (partie && partie.phase === 'jeu' && vue && vue.tour !== monSiege() && Date.now() - dernierAttends > 1500) { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    fermerMedaille();
    sons.pas(k);
    partie.jouer({ t: 'p', k: k });
    $('pas').querySelectorAll('button').forEach((b) => { b.disabled = true; });
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage et animations des coureurs
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu') return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    if (!enPause) { avancerAnims(performance.now()); majChrono(); }
    dessinerJeu(performance.now(), enPause ? 0 : dt);
    majCompte();
    if (!enPause) majActions();
    rafId = requestAnimationFrame(boucle);
  }

  // Le coureur suit son chemin case par case ; sur la glace, le chemin
  // redescend : il glisse sans sauter.
  const DUREE_SAUT = 190;
  function avancerAnims(t) {
    for (let s = 0; s < PLACES; s++) {
      const a = anims[s];
      if (!a.file.length) { a.saut = 0; continue; }
      const cible = a.file[0];
      a.glisse = cible < a.de;
      const p = Math.min(1, (t - a.t0) / (a.glisse ? DUREE_SAUT * 1.5 : DUREE_SAUT));
      a.x = a.de + (cible - a.de) * p;
      a.saut = a.glisse ? 0 : Math.sin(p * Math.PI) * 0.5;
      if (p >= 1) {
        a.x = cible; a.de = cible; a.file.shift(); a.t0 = t;
        if (!a.glisse) sons.hop();
        if (!a.file.length && a.fin) { const f = a.fin; a.fin = null; f(); }
      }
    }
  }
  function lancerAnim(s, chemin, de, fin) {
    const a = anims[s];
    a.file = chemin.slice(); a.de = de; a.x = de; a.t0 = performance.now(); a.glisse = false; a.fin = fin || null;
  }
  function placerCoureurs() { for (let s = 0; s < PLACES; s++) { const a = anims[s]; a.file = []; a.x = vue ? vue.pos[s] : 0; a.de = a.x; a.saut = 0; a.fin = null; } }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; c.fillStyle = THEMES[0].fond; c.fillRect(0, 0, w, h); return; }
    geo = geometrie(vue, w, h);
    let apercu = null;
    if (peutChoisir() && !modeMedaille) apercu = [1, 2, 3].map((k) => O.trajet(vue, monSiege(), k).p);
    dessinerPlateau(c, vue, geo, { t: t, anims: anims, apercu: apercu, tour: partie && partie.phase === 'jeu' ? vue.tour : -1, moi: monSiege() });
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      if (p.etoile) etincelle(c, p.x, p.y, p.k); else { rond(c, p.x, p.y, p.k * 0.5); c.fill(); }
      c.globalAlpha = 1;
    }
  }

  function jaillir(caseI, coul) {
    if (!vue || !geo || !geo.pts[caseI]) return;
    const p = geo.pts[caseI];
    for (let k = 0; k < 16; k++) {
      const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 170;
      particules.push({ x: p[0], y: p[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v - 150, vie: 0.7 + Math.random() * 0.4, k: geo.r * (0.25 + Math.random() * 0.2), coul: k % 2 ? coul : '#ffe066', etoile: k % 3 !== 0 });
    }
  }

  // ---------------------------------------------------------------------
  //  Évènements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': fileAff.length = 0; libreAff = 0; surDebut(ev); break;
      case 'sieges': surSieges(); break;
      case 'refus': if (carte) carte.repondu = false; break;
      default: fileAff.push(ev); pomperAff(); return;
    }
    majInterface();
  }

  function pomperAff() {
    clearTimeout(minuteurAff);
    if (enPause) return;                  // la pause fige aussi l'affichage (reprise dans fermerPause)
    while (fileAff.length) {
      const attente = libreAff - Date.now();
      if (attente > 0) { minuteurAff = setTimeout(pomperAff, attente); return; }
      const ev = fileAff.shift();
      let garde = traiterAff(ev) || 0;
      // Beaucoup de coups en attente (retour de pause, connexion lente) : on rattrape vite.
      if (fileAff.length >= 3) garde = Math.min(garde, 120);
      libreAff = Date.now() + garde;
    }
    majInterface();
  }

  function traiterAff(ev) {
    if (!partie) return 0;
    switch (ev.type) {
      case 'manche': surManche(); return 0;
      case 'action': return surAction(ev);
      case 'fin': surFin(ev.resultat); return 0;
      case 'salon': surSalon(ev); return 0;
      default: return 0;
    }
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    placerCoureurs();
    fermerCarte();
    if (vue && vue.ph === 'q' && vue.q && partie.phase === 'jeu') ouvrirCarte(vue.q, vue.tour);
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    placerCoureurs();
    particules.length = 0;
    fermerCarte();
    fermerMedaille();
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') toast(tr('manche.nouvelle', { n: partie.manche }) + ' · ' + tr('stade.' + vue.st));
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    sons.tour();
  }

  // Une action affichée ; renvoie le temps à garder avant la suivante (ms).
  function surAction(ev) {
    const avant = ev.avant, apres = ev.apres, a = ev.action, der = apres.der || {};
    vue = JSON.parse(JSON.stringify(apres));
    if (a.t === 'p') {
      ouvrirCarte(vue.q, ev.siege);
      return ev.moi ? 0 : 1000;
    }
    if (a.t === 'm') {
      sons.medaille();
      jaillir(der.x, '#ffc21a');
      toast(ev.moi ? tr('medaille.toi', { nom: nomPhrase(der.c) }) : tr('medaille.autre', { qui: nomPhrase(ev.siege), nom: nomPhrase(der.c) }), 2000);
      return ev.moi ? 0 : 600;
    }
    // Réponse : résultat sur la carte, puis le coureur avance case par case.
    const s = ev.siege;
    revelerCarte(der, avant.q);
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (der.ok && der.ch && der.ch.length) {
      const fx = der.fx || '';
      lancerAnim(s, der.ch, der.de, () => {
        if (fx.indexOf('t') >= 0) { sons.boing(); toast(tr('fx.tremplin'), 1500); }
        if (fx.indexOf('g') >= 0) { sons.glisse(); toast(tr('fx.glace'), 1500); }
        if (der.ramasse && der.ramasse.length) { sons.medaille(); toast(tr('fx.ramasse', { qui: nomPhrase(s) }), 1700); }
        if (fx.indexOf('r') >= 0) { sons.sifflet(); toast(ev.moi ? tr('fx.relaisToi') : tr('fx.relais', { qui: nomPhrase(s) }), 1700); }
        if (der.gagne && ev.moi) toast(tr('fx.gagneMedaille'), 1700);
        jaillir(apres.pos[s], COUL[s]);
        const carteP = $('place-' + s); carteP.classList.remove('bond'); void carteP.offsetWidth; carteP.classList.add('bond');
      });
    }
    if (partie.phase === 'jeu' && vue.tour === monSiege() && !ev.moi) setTimeout(() => sons.tour(), 500);
    return ev.moi ? 1350 : 900;
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la course,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0, resultatSalon = null, finEnAttente = false, lancement = false;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    fermerCarte();
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44, info.moi ? prog.maillot : 0);
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { animal: tr('nom.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomPhrase(partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    fermerMedaille();
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1100);
  }

  // Fin d'une course en ligne : classement, puis le salon (même fenêtre).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, res = R.fin(e);
    const gagne = moi >= 0 && !!res && res.classement[0] === moi;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de course : podium, étoiles, coupes, maillots
  // ---------------------------------------------------------------------

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    ordre.forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64; medaillon(cv.getContext('2d'), s, 32, 32, 30, s === moi ? prog.maillot : 0);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('nom.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = e.pos[s] >= e.but ? tr('fin.arrive') : tr('fin.case', { n: e.pos[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  // Podium : or au milieu, argent à gauche, bronze à droite (aucun chiffre dessiné).
  function dessinerPodium(e, moi) {
    const c = $('fin-podium').getContext('2d');
    c.clearRect(0, 0, 600, 300);
    const res = R.fin(e), ordre = res ? res.classement : [0, 1, 2, 3];
    const blocs = [[300, 120, '#ffc21a'], [170, 80, '#c9d3e6'], [430, 50, '#e0975a']];
    c.fillStyle = '#9fd4ff'; c.fillRect(0, 0, 600, 300);
    c.fillStyle = '#6cc657'; c.fillRect(0, 250, 600, 50);
    blocs.forEach((b, k) => {
      c.fillStyle = b[2]; c.fillRect(b[0] - 60, 250 - b[1], 120, b[1]);
      c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(b[0] - 60, 250 - b[1], 120, 10);
      medaillon(c, ordre[k], b[0], 250 - b[1] - 46, 42, ordre[k] === moi ? prog.maillot : 0);
      c.fillStyle = b[2]; c.strokeStyle = '#7a4f00'; c.lineWidth = 2; rond(c, b[0], 250 - b[1] - 6, 9); c.fill(); c.stroke();
    });
    medaillon(c, ordre[3], 540, 220, 26, ordre[3] === moi ? prog.maillot : 0);
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const res = R.fin(e), ordre = res ? res.classement : [0, 1, 2, 3];
    const rang = ordre.indexOf(moi);
    const gagne = moi >= 0 && rang >= 0 && rang <= 1;    // victoire : 1re ou 2e place
    const bon = moi >= 0 ? e.bon[moi] : 0, rep = moi >= 0 ? e.rep[moi] : 0;
    const taux = rep ? bon / rep : 0;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    dessinerPodium(e, moi);
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.reponses', { n: bon, total: rep }) : '';
    $('fin-coupe').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      // Étoiles : or 2, argent 1, +1 avec au moins 75 % de bonnes réponses.
      const etoiles = gagne ? (rang === 0 ? 2 : 1) + (taux >= 0.75 ? 1 : 0) : 0;
      const ancienRecord = prog.records[i];
      const record = bon > ancienRecord;
      if (record) prog.records[i] = bon;
      let debloque = false;
      const maillotsAvant = MAILLOTS_SEUILS.filter((x) => totalEtoiles() >= x).length;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (rang === 0 && !prog.coupes[i]) { prog.coupes[i] = 1; $('fin-coupe').textContent = tr('fin.coupe', { n: totalCoupes(), total: NIVEAUX.length }); }
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), bon);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      }
      const maillotsApres = MAILLOTS_SEUILS.filter((x) => totalEtoiles() >= x).length;
      $('fin-titre').textContent = gagne ? tr(rang === 0 ? 'fin.or' : 'fin.argent') : tr(rang === 2 ? 'fin.bronze' : 'fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord', { n: bon }) : tr('fin.record', { n: Math.max(ancienRecord, bon) });
      let deb = '';
      if (!gagne) deb = tr('fin.conseil');
      else {
        if (niveau === NIVEAUX.length) deb = tr('fin.dernier');
        else if (debloque) deb = tr('fin.debloque', { n: niveau + 1 });
        if (maillotsApres > maillotsAvant) deb = (deb ? deb + ' ' : '') + tr('fin.maillot', { nom: tr('maillot.' + (maillotsApres - 1)) });
      }
      $('fin-debloque').textContent = deb;
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil.
      const premier = moi >= 0 && rang === 0;
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: premier, level: e.n + 1 });
      $('fin-titre').textContent = premier ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la course suivante (partie en ligne repassée en solo).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 100; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 5 === 4 ? '#ffc21a' : COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux, vestiaire
  // ---------------------------------------------------------------------

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    fileAff.length = 0;
    libreAff = 0;
    clearTimeout(minuteurAff);
    bandeau('');
    fermerCarte();
    fermerMedaille();
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon'].forEach(fermerVoile);
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  // Parcours solo : niveau n contre 3 robots (force croissante).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    fileAff.length = 0; libreAff = 0;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    fermerCarte();
    fermerMedaille();
    vue = O.preparer(niveau - 1, PLACES);
    placerCoureurs();
    particules.length = 0;
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);

  // ---------------------------------------------------------------------
  //  Tutoriels animés (une petite scène qui tourne en boucle)
  // ---------------------------------------------------------------------

  function mainTuto(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#1d2340'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }
  const lisse = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
  const XC = (i) => 70 + i * 70;   // position d'une case de la mini-piste
  const YP = 322;

  function miniPiste(c, speciaux, medailles, arrivee) {
    const t = performance.now();
    c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 4; c.setLineDash([6, 6]); trait(c, XC(0), YP, XC(6), YP); c.setLineDash([]);
    for (let i = 0; i <= 6; i++) {
      const ch = speciaux[i] || '.';
      c.fillStyle = 'rgba(0,0,0,.2)'; rond(c, XC(i) + 2, YP + 3, 26); c.fill();
      c.fillStyle = i === 0 ? '#7fd36a' : ch === 'r' ? '#fff0b8' : ch === 't' ? '#e6d9ff' : ch === 'g' ? '#d9f2ff' : '#fff';
      rond(c, XC(i), YP, 26); c.fill();
      c.strokeStyle = '#2f9ee0'; c.lineWidth = 3; rond(c, XC(i), YP, 24); c.stroke();
      if (i === 6 && arrivee) drapeauDamier(c, XC(i), YP, 26); else picto(c, ch, XC(i), YP, 26, t);
    }
    (medailles || []).forEach((i) => medaillePosee(c, XC(i), YP + 4, 26, t));
  }
  function pionTuto(c, k, x, saut) { medaillon(c, k, XC(0) + x * 70, YP - 4 - saut * 40, 20, k === 0 ? prog.maillot : 0); }
  // Position d'un pion qui saute de case en case : chemin, début, durée d'un saut.
  function sauts(t, t0, chemin, d) {
    if (t < t0) return { x: chemin[0], s: 0 };
    const k = Math.floor((t - t0) / d), f = ((t - t0) % d) / d;
    if (k >= chemin.length - 1) return { x: chemin[chemin.length - 1], s: 0 };

  }
  function boutonsPasTuto(c, appuye) {
    ['#c9f2c2', '#ffe08a', '#ffb0a8'].forEach((col, k) => {
      const x = 110 + k * 120, y = appuye === k + 1 ? 34 : 30;
      c.fillStyle = col; c.strokeStyle = '#2b3f7a'; c.lineWidth = 3; rr(c, x, y, 100, 56, 14); c.fill(); c.stroke();
      for (let d = 0; d <= k; d++) { c.fillStyle = '#2b3f7a'; rond(c, x + 50 + (d - k / 2) * 18, y + 28, 6); c.fill(); }
    });
  }
  // Carte de question miniature : choix en images, sujet éventuel, barre de temps.
  function carteTuto(c, q, etat) {
    const x0 = 60, y0 = 22, w = 440, h = 252;
    c.fillStyle = 'rgba(0,0,0,.25)'; rr(c, x0 + 4, y0 + 6, w, h, 20); c.fill();
    c.fillStyle = '#fff'; c.strokeStyle = '#2b3f7a'; c.lineWidth = 4; rr(c, x0, y0, w, h, 20); c.fill(); c.stroke();
    let yc = y0 + 20;
    if (q.sujet) { c.fillStyle = '#eef4ff'; rr(c, 230, y0 + 12, 100, 80, 12); c.fill(); objet(c, q.sujet, 280, y0 + 52, 72, q.ombre); yc = y0 + 104; }
    if (q.temps !== undefined) { c.fillStyle = '#e3e8f5'; rr(c, x0 + 30, y0 + h - 22, w - 60, 10, 5); c.fill(); c.fillStyle = '#ff8a1a'; rr(c, x0 + 30, y0 + h - 22, Math.max(10, (w - 60) * q.temps), 10, 5); c.fill(); }
    const n = q.ch.length, cw = n === 3 ? 120 : 92, gap = 12, tot = n * cw + (n - 1) * gap, hh = q.sujet ? 100 : 150;
    q.pos = [];
    q.ch.forEach((id, i) => {
      const x = 280 - tot / 2 + i * (cw + gap), y = yc + (q.sujet ? 0 : 20);
      c.fillStyle = etat.bonne === i ? '#dcffd6' : '#fff'; c.strokeStyle = etat.bonne === i ? '#2ea043' : '#9fb0dc'; c.lineWidth = etat.bonne === i ? 6 : 3;
      rr(c, x, y, cw, hh, 14); c.fill(); c.stroke();
      if (q.lieux) lieu(c, id, x + cw / 2, y + hh / 2, cw * 0.86, hh * 0.7); else objet(c, id, x + cw / 2, y + hh / 2, Math.min(cw, hh) * 0.82);
      q.pos[i] = [x + cw / 2, y + hh / 2];

  }
  // Scène : la main touche la bonne image, qui passe au vert.
  function sceneQuestion(c, t, q, bonne) {
    const tTap = 1700;
    carteTuto(c, q, { bonne: t >= tTap ? bonne : -1 });
    const cible = q.pos[bonne], p = lisse((t - 400) / 1200);
    mainTuto(c, 500 + (cible[0] - 500) * p, 360 + (cible[1] + 10 - 360) * p, 1.5, t > tTap - 150 && t < tTap + 250 ? 1 : 0);
  }

  const TUTOS = {
    base: { d: 5600, f(c, t) {
      miniPiste(c, {});
      const pr = sauts(t, 3600, [1, 2, 3], 300);
      pionTuto(c, 0, t < 3600 ? 1 : pr.x, pr.s);
      if (t < 1100) {
        boutonsPasTuto(c, t > 850 ? 2 : 0);
        const p = lisse((t - 100) / 700);

      } else if (t < 3500) sceneQuestion(c, t - 1100, { ch: ['foot', 'basket', 'tennis'] }, 1);
    } },
    objet: { d: 3600, f(c, t) { miniPiste(c, {}); pionTuto(c, 0, 1, 0); sceneQuestion(c, t, { ch: ['skis', 'lunettes', 'raquette'] }, 1); } },
    lieu: { d: 3600, f(c, t) { miniPiste(c, {}); pionTuto(c, 0, 1, 0); sceneQuestion(c, t, { ch: ['mer', 'patinoire', 'golf', 'piste'], lieux: true, sujet: 'palet' }, 1); } },
    intrus: { d: 3600, f(c, t) { miniPiste(c, {}); pionTuto(c, 0, 1, 0); sceneQuestion(c, t, { ch: ['foot', 'basket', 'raquette', 'rugby'] }, 2); } },
    ombre: { d: 3600, f(c, t) { miniPiste(c, {}); pionTuto(c, 0, 1, 0); sceneQuestion(c, t, { ch: ['skis', 'patins', 'palmes', 'volant'], sujet: 'patins', ombre: true }, 1); } },
    chrono: { d: 3600, f(c, t) { miniPiste(c, {}, [], true); pionTuto(c, 0, 4, 0); sceneQuestion(c, t, { ch: ['golf', 'tennis', 'pingpong'], temps: Math.max(0, 1 - Math.min(t, 1700) / 3000) }, 1); } },
    relais: { d: 4200, f(c, t) {
      miniPiste(c, { 3: 'r' });
      const p = t < 1900 ? sauts(t, 500, [1, 2, 3], 300) : sauts(t, 1900, [3, 4, 5], 300);
      pionTuto(c, 0, p.x, p.s);
      if (t > 1150 && t < 1900) { c.fillStyle = '#ffd84d'; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + t / 300; etincelle(c, XC(3) + Math.cos(a) * 40, YP - 10 + Math.sin(a) * 34, 8); } }
    } },
    tremplin: { d: 3800, f(c, t) {
      miniPiste(c, { 3: 't' });
      let x = 1, s = 0;
      if (t < 1300) { const p = sauts(t, 500, [1, 2, 3], 300); x = p.x; s = p.s; }
      else { const f = lisse((t - 1300) / 700); x = 3 + 2 * f; s = Math.sin(f * Math.PI) * 2.2; }
      pionTuto(c, 0, x, s);
    } },
    glace: { d: 4000, f(c, t) {
      miniPiste(c, { 4: 'g' });
      let x = 1, s = 0;
      if (t < 1500) { const p = sauts(t, 500, [1, 2, 3, 4], 300); x = p.x; s = p.s; }
      else { x = 4 - 2 * lisse((t - 1600) / 800); }
      pionTuto(c, 0, x, s);
      if (t > 1600 && t < 2500) { c.strokeStyle = '#7fbfe8'; c.lineWidth = 3; for (let i = 0; i < 3; i++) trait(c, XC(0) + x * 70 + 26, YP - 14 + i * 10, XC(0) + x * 70 + 50, YP - 14 + i * 10); }
    } },
    medaille: { d: 4400, f(c, t) {
      miniPiste(c, {}, t > 1500 && t < 2150 ? [3] : []);
      pionTuto(c, 0, 1, 0);
      const r = sauts(t, 1800, [2, 3], 320);
      pionTuto(c, 3, t < 1800 ? 2 : r.x, r.s);
      if (t < 1500) {
        const p = lisse((t - 200) / 1100), x = 100 + (XC(3) - 100) * p, y = 120 + (YP - 120) * p;
        medaillePosee(c, x, y, 26, t);
        mainTuto(c, x + 10, y + 16, 1.5, t > 1300 ? 1 : 0);
      }
      if (t > 2150 && t < 2900) { c.fillStyle = '#ffc21a'; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; etincelle(c, XC(3) + Math.cos(a) * (30 + (t - 2150) / 20), YP - 20 + Math.sin(a) * (24 + (t - 2150) / 25), 7); } }
    } },
    finale: { d: 4200, f(c, t) {

      if (t > 1200) { const k = lisse((t - 1200) / 600); coupe(c, 3, 280, 140, 150 * k, true); c.fillStyle = '#ffd84d'; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + t / 500; etincelle(c, 280 + Math.cos(a) * 110 * k, 140 + Math.sin(a) * 90 * k, 9); } }
    } }
  };

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const c = $('tuto-demo').getContext('2d');
    const j = ++tutoAnim;
    let debut = 0, id = 0;
    function image(t) {
      if (j !== tutoAnim) return;

      c.setTransform(1, 0, 0, 1, 0, 0);

      c.fillStyle = g; c.fillRect(0, 0, 560, 380);

    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };

  // ---------------------------------------------------------------------
  //  Clavier, boutons et démarrage
  // ---------------------------------------------------------------------

  const CHIFFRES = { Digit1: 1, Digit2: 2, Digit3: 3, Digit4: 4, Numpad1: 1, Numpad2: 2, Numpad3: 3, Numpad4: 4 };

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }

      return;

      ev.preventDefault(); audio();
      const b = document.querySelector('#rivaux .rival[data-k="' + n + '"]');
      if (b && !b.disabled) poserMedaille(Number(b.dataset.s));
      return;

    if (n && n <= 3) { ev.preventDefault(); audio(); choisirPas(n); return; }
    if (ev.code === 'KeyM') { ev.preventDefault(); audio(); if (modeMedaille) { fermerMedaille(); majActions(); } else ouvrirMedaille(); }
  });

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();

  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-vestiaire').addEventListener('click', () => { audio(); sons.clic(); ouvrirVestiaire(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('vest-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  [1, 2, 3].forEach((k) => $('pas-' + k).addEventListener('click', () => { audio(); choisirPas(k); }));
  $('btn-medaille').addEventListener('click', () => { audio(); ouvrirMedaille(); });
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });

  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });

  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {

  document.title = tr('titre');

  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
