    recul: { cases: 'D.v....', pions: [0], etapes: [{ tap: 'd2' }, { q: { k: 'objet', ch: ['batons', 'ballon_rugby', 'haie'] } }, { tap: 'c0' }, { ok: 0 }, { va: 2 }, { va: 0, mode: 'glisse' }] },
    compte: { cases: 'D......', pions: [0], etapes: [{ tap: 'd2' }, { q: { k: 'compte', s: 'ballon_basket', tas: ['ballon_basket', 'lunettes', 'ballon_basket', 'skis', 'ballon_basket'], ch: [2, 3, 4] } }, { tap: 'c1' }, { ok: 1 }, { va: 2 }] },
    telesiege: { cases: 'D.s.....', pions: [0], etapes: [{ tap: 'd2' }, { q: { k: 'objet', ch: ['skis', 'panier', 'temoin'] } }, { tap: 'c0' }, { ok: 0 }, { va: 2 }, { va: 6, mode: 'cable' }] },
    sprint: { cases: 'D.......', pions: [0], chrono: true, etapes: [{ tap: 'd3' }, { q: { k: 'objet', ch: ['crosse', 'bonnet', 'arc', 'casque_velo'] } }, { tap: 'c0' }, { ok: 0 }, { va: 4 }] }
  };

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const PAS = 1150, j = ++tutoAnim;
    const st = cle === 'telesiege' || cle === 'sprint' ? 3 : cle === 'chrono' || cle === 'recul' || cle === 'compte' ? 2 : cle === 'intrus' || cle === 'tremplin' || cle === 'medaille' || cle === 'ombre' ? 1 : 0;
    const n = d.cases.length, pasX = Math.min(70, 520 / n), x0 = 280 - pasX * (n - 1) / 2, yC = 70;
    const xCase = (i) => x0 + i * pasX;
    // cibles de la main
    const cibleDist = (k) => ({ x: 280 + (k - 2) * 170, y: 318 });
    const avecImage = (q) => q.k === 'sport' || q.k === 'ombre' || q.k === 'compte';
    const cibleChoix = (q, k) => {
      const z0 = avecImage(q) ? 132 : 30, zw = avecImage(q) ? 398 : 500, m = q.ch.length;
      const lw = Math.min(120, (zw - (m - 1) * 8) / m), total = m * lw + (m - 1) * 8;
      return { x: z0 + (zw - total) / 2 + k * (lw + 8) + lw / 2, y: 205, lw: lw };
    };
    let debut = 0;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const total = d.etapes.length + 1.5;
      const ecoule = (t - debut) % (total * PAS);
      const k = Math.floor(ecoule / PAS), dans = (ecoule - k * PAS) / PAS;
      // état rejoué jusqu'à l'étape k
      const pions = d.pions.slice();
      let q = null, okI = -1, med = -1, main = null, appui = 0, relais = false, chronoPart = -1, saut = 0;
      for (let i = 0; i <= Math.min(k, d.etapes.length - 1); i++) {
        const et = d.etapes[i], fini = i < k ? 1 : dans;
        if (et.tap) {
          const cible = et.tap === 'm' ? { x: 470, y: 150 } : et.tap.charAt(0) === 'd' ? cibleDist(+et.tap.charAt(1)) : cibleChoix(q, +et.tap.charAt(1));
          if (i === k) { main = cible; appui = dans > 0.55 ? Math.min(1, (dans - 0.55) * 4) : 0; }
        }
        if (et.q) { q = et.q; okI = -1; if (d.chrono) chronoPart = i === k ? 1 - dans * 0.5 : 0.5; }
        if (et.ok !== undefined) okI = et.ok;
        if (et.medaille !== undefined) med = et.medaille;
        if (et.va !== undefined) {
          // le pion avance (ou bondit, glisse, monte au télésiège) ; la question disparaît
          const de = pions[0], vers = et.va, p = Math.min(1, fini * 1.4);
          pions[0] = de + (vers - de) * p;
          if (i === k) saut = et.mode === 'saut' ? Math.sin(Math.PI * p) * 34 : et.mode ? 0 : Math.abs(Math.sin(Math.PI * p * Math.max(1, Math.abs(vers - de)))) * 12;
          if (et.effet === 'r' && p >= 1) relais = true;
          q = null; chronoPart = -1;
        }
        if (et.autre !== undefined) {
          const p = Math.min(1, fini * 1.6);
          pions[1] = 2 + (et.autre - 2) * p;
          if (p >= 1) med = -1;
        }
      }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 360);
      const S = STADES[st];
      c.fillStyle = S.ciel[1]; c.fillRect(0, 0, 560, 360);
      c.strokeStyle = S.bande; c.lineWidth = 56; c.lineCap = 'round'; ligne(c, xCase(0), yC, xCase(n - 1), yC); c.lineCap = 'butt';
      for (let i = 0; i < n; i++) {
        const ch = d.cases.charAt(i);
        c.fillStyle = ch === 'D' ? '#fff' : S.case; rond(c, xCase(i), yC, 22); c.fill();
        c.strokeStyle = d.chrono && i > 0 ? '#ff9f1a' : '#fff'; c.lineWidth = 3; rond(c, xCase(i), yC, 22); c.stroke();
        if (ch !== '.' && ch !== 'D') iconeCase(c, ch, xCase(i), yC, 20, st, t);
        if (ch === 'D') { c.fillStyle = '#172238'; c.fillRect(xCase(i) - 11, yC - 11, 11, 11); c.fillRect(xCase(i), yC, 11, 11); }
      }
      if (cle === 'telesiege') { c.strokeStyle = '#172238'; c.lineWidth = 2.5; c.setLineDash([6, 4]); ligne(c, xCase(2), yC - 26, xCase(6), yC - 26); c.setLineDash([]); }
      if (med >= 0) dessinMedaille(c, xCase(med), yC - 4, 12);
      // pions
      if (d.pions.length > 1) pion(c, 2, xCase(pions[1]), yC - 14, 22, 0);
      pion(c, 0, xCase(pions[0]), yC - 14 - saut, 22, prog.maillot);
      if (relais) { c.fillStyle = '#ffc21a'; etincelle(c, xCase(2) + 26, yC - 40, 10); etincelle(c, xCase(2) - 26, yC - 44, 7); }
      // question
      if (q) {
        c.fillStyle = '#fffdf6'; c.strokeStyle = '#23407a'; c.lineWidth = 3; rr(c, 20, 118, 520, 140, 16); c.fill(); c.stroke();
        if (avecImage(q)) {
          c.fillStyle = '#e9f0ff'; rr(c, 30, 128, 94, 120, 10); c.fill();
          if (q.k === 'compte') q.tas.forEach((id, i) => dessinObjet(c, id, 54 + (i % 2) * 44, 150 + Math.floor(i / 2) * 38, 36));
          else dessinObjet(c, q.s, 77, 188, 80, q.k === 'ombre');
        }
        q.ch.forEach((x, i) => {
          const p = cibleChoix(q, i), bx = p.x - p.lw / 2, lw = p.lw;
          c.fillStyle = i === okI ? '#c9f5cf' : '#fff'; c.strokeStyle = i === okI ? '#1f8a35' : '#23407a'; c.lineWidth = 3;
          rr(c, bx, 160, lw, 90, 12); c.fill(); c.stroke();
          if (q.k === 'sport' || q.k === 'compte') {
            c.fillStyle = '#172238'; c.textAlign = 'center'; c.textBaseline = 'middle';
            const txt = q.k === 'compte' ? nb(x) : tr('sport.' + x);
            c.font = '800 ' + (q.k === 'compte' ? 34 : Math.min(20, Math.floor(lw / Math.max(5, txt.length) * 1.7))) + 'px system-ui, sans-serif';
            c.fillText(txt, bx + lw / 2, 205);
          } else if (q.k === 'lieu') dessinLieu(c, x, bx + 8, 170, lw - 16, 70);
          else dessinObjet(c, x, bx + lw / 2, 205, Math.min(76, lw - 10));
        });
        if (chronoPart >= 0) {
          chronoIcone(c, 520, 138, 13, chronoPart);
        }
      } else {
        // boutons de distance
        for (let dd = 1; dd <= 3; dd++) {
          const p = cibleDist(dd);
          c.fillStyle = '#fff'; c.strokeStyle = '#23407a'; c.lineWidth = 3; rr(c, p.x - 70, p.y - 34, 140, 62, 12); c.fill(); c.stroke();
          c.fillStyle = ['#2f9e44', '#e08a00', '#d6336c'][dd - 1];
          for (let z = 0; z < dd; z++) { rond(c, p.x + (z - (dd - 1) / 2) * 24, p.y - 4, 8); c.fill(); }
        }
        if (cle === 'medaille') { c.fillStyle = '#fff4cf'; c.strokeStyle = '#b07800'; c.lineWidth = 3; rr(c, 420, 125, 100, 52, 12); c.fill(); c.stroke(); medaillon(c, 2, 450, 151, 18); dessinMedaille(c, 492, 156, 10); }
      }
      if (main) dessinerMain(c, main.x, main.y, 1.5, appui);
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function dessinerMain(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(47,111,224,.8)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#172238'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Clavier : 1 à 4 (choix), flèches (se déplacer), Entrée ou Espace, Échap ou P
  // ---------------------------------------------------------------------

  let clavier = false;
  document.addEventListener('pointerdown', () => { clavier = false; audio(); }, true);
  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    audio();
    const chiffres = { Digit1: 1, Digit2: 2, Digit3: 3, Digit4: 4, Numpad1: 1, Numpad2: 2, Numpad3: 3, Numpad4: 4 };
    if (chiffres[ev.code] && vue) {
      ev.preventDefault();
      clavier = true;
      const k = chiffres[ev.code];
      if (vue.ph === 'choix' && k <= 3) choisirDistance(k);
      else if (vue.ph === 'question' && vue.q && k <= vue.q.ch.length) repondre(k - 1);
      return;
    }
    const sens = { ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1 }[ev.code];
    if (sens) {
      ev.preventDefault();
      clavier = true;
      const liste = Array.from(document.querySelectorAll('#panneau-jeu button:not(:disabled)'));
      if (!liste.length) return;
      const i = liste.indexOf(document.activeElement);
      const b = liste[i < 0 ? 0 : (i + sens + liste.length) % liste.length];
      try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ }
      sons.clic();
      return;
    }
    if ((ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) {
      ev.preventDefault();
      clavier = true;
      const b = document.querySelector('#panneau-jeu button:not(:disabled)');
      if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ }
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-vitrine').addEventListener('click', () => { audio(); sons.clic(); ouvrirVitrine(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('vit-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une course solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.ok[partie.siege] : 0);
  });

  let animTitre = 0;
  function boucleTitre() {
    animTitre = 0;
    if (ecran === 'titre') { dessinerTitre(); animTitre = requestAnimationFrame(boucleTitre); }
  }
  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
