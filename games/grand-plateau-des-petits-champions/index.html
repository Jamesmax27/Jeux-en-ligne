    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    nouvelleVue(partie.etat);
    debutTour = Date.now();
    dernierTic = -1;
    repEnvoyee = -1; pasEnvoye = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche, stade: tr('stade.' + STADES[vue.st]) })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surAction(ev) {
    vue = JSON.parse(JSON.stringify(ev.apres));
    const d = vue.der;
    debutTour = Date.now();
    dernierTic = -1;
    if (!d) return;
    if (d.k === 'p') {
      if (!ev.moi) sons.choix(d.n);
      fb = null;
    } else if (d.k === 'm') {
      anims.medailles[d.at] = performance.now();
      sons.medaille();
      jaillir(d.at, '#ffd23a', 10);
      toast(ev.moi ? tr('medaille.posee') : tr('medaille.contre', { nom: nomDe(d.s), cible: d.c === partie.siege ? tr('medaille.toi') : nomDe(d.c) }), 2200);
    } else if (d.k === 'r') {
      fb = { q: d.q, s: d.s, i: d.i, ok: d.ok };
      fbFin = Date.now() + (ev.moi ? 1500 : 1100);
      if (d.ok) {
        if (ev.moi) sons.bonne(); else note(880, 0.1, { type: 'triangle', vol: 0.06 });
        animerPion(d.s, d);
        const n = d.mi - d.de;
        for (let k = 1; k <= n; k++) setTimeout(() => sons.pas(), k * PAS_MS);
        const apres = n * PAS_MS + 80, j = jeton;
        setTimeout(() => {
          if (j !== jeton || !vue) return;
          jaillir(d.mi, COUL[d.s], 12);
          if (d.bl) { sons.bloque(); toast(d.s === partie.siege ? tr('effet.bloqueToi') : tr('effet.bloque', { nom: nomDe(d.s) }), 1800); }
          if (d.eff === 'r') { sons.relais(); toast(tr('effet.relais'), 1600); }
          else if (d.eff === 'p') sons.plongeoir();
          else if (d.eff === 'v') { sons.verglas(); toast(tr('effet.verglas'), 1600); }
          else if (d.eff === 'x') { sons.double(); toast(tr('effet.double'), 1600); }
          if (d.gm && d.s === partie.siege) toast(tr('medaille.gagnee'), 1800);
          if (d.a >= vue.L - 1) sons.arrivee();
        }, apres);
        const carte = $('place-' + d.s);
        carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
      } else if (ev.moi) sons.fausse();
      else note(240, 0.12, { type: 'triangle', vol: 0.05 });
    }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && R.aQui(vue) === partie.siege && !ev.moi && vue.ph === 'choix') sons.tour();
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1500);
  }

  // Place d'un joueur dans le classement (1 = premier).
  function placeDe(e, s) {
    const f = R.fin(e);
    return f ? f.classement.indexOf(s) + 1 : 4;
  }

  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = moi >= 0 && placeDe(e, moi) === 1;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.st + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(place, bon, rep) {
    if (place > 2) return 0;
    return (place === 1 ? 2 : 1) + (rep > 0 && bon / rep >= 0.75 ? 1 : 0);
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const f = R.fin(e);
    const ordre = f ? f.classement : [0, 1, 2, 3];
    ordre.forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; medaillon(cv.getContext('2d'), s, 30, 30, 28);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('animal.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = tr('fin.ligne', { cases: e.pos[s], total: e.L - 1, bon: e.bon[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function dessinerPodium(e, moi) {
    const cv = $('fin-podium'), c = cv.getContext('2d');
    c.clearRect(0, 0, 360, 192);
    const f = R.fin(e); if (!f) return;
    const pl = [[1, 120, 70, '#c9d1de'], [0, 180, 105, '#ffd23a'], [2, 240, 50, '#e0a060']];
    pl.forEach((p) => {
      const s = f.classement[p[0]];
      rr(c, p[1] - 30, 190 - p[2], 60, p[2], 8); remplir(c, p[3], '#5a6070', 2);
      pion(c, s, p[1], 190 - p[2] - 32, 24, s === moi ? prog.maillot : 0);
      medaille(c, p[1], 190 - p[2] / 2 + 4, 10);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const place = moi >= 0 ? placeDe(e, moi) : 4;
    const bon = moi >= 0 ? e.bon[moi] : 0, rep = moi >= 0 ? e.rep[moi] : 0;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    dessinerPodium(e, moi);
    $('fin-points').textContent = moi >= 0 ? tr('fin.points', { n: bon, total: rep }) : '';
    $('fin-cadeau').textContent = '';
    let gagne = false;
    if (session === 'solo') {
      const i = niveau - 1;
      gagne = place <= 2;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(place, bon, rep);
      const ancienRecord = prog.records[i];
      const record = bon > ancienRecord;
      if (record) prog.records[i] = bon;
      let debloque = false;
      const etoilesAvant = totalEtoiles(), stadeAvant = stadeFini(NIVEAUX[i].st);
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), bon);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      }
      const cadeaux = [];
      if (gagne && !stadeAvant && stadeFini(NIVEAUX[i].st)) cadeaux.push(tr('fin.coupe', { stade: tr('stade.' + STADES[NIVEAUX[i].st]) }));
      SEUILS_MAILLOT.forEach((sv, m) => { if (m > 0 && etoilesAvant < sv && totalEtoiles() >= sv) cadeaux.push(tr('fin.maillot', { nom: tr('maillot.' + MOTIFS[m]) })); });
      $('fin-cadeau').textContent = cadeaux.join(' ');
      $('fin-titre').textContent = tr(place === 1 ? 'fin.or' : place === 2 ? 'fin.argent' : 'fin.perdu', { n: place });
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, bon) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      gagne = place === 1;
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.st + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');

      $('fin-etoiles').style.display = 'none';

      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (partie en ligne repassée sur l'appareil).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

    const def = NIVEAUX[n - 1];

  // Parcours solo : niveau n contre 3 robots (force croissante, donnée par le terrain).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;

    repEnvoyee = -1; pasEnvoye = -1;
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: NIVEAUX[niveau - 1].fr, options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement

    partie.lancer();

  function dessinerScene(c, sc, t) {
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = '#cfe6ff'; c.fillRect(0, 0, 560, 360);
    rr(c, 18, TY - 40, 524, 80, 40); remplir(c, '#d9603a', '#a8402a', 3);
    for (let i = 0; i < 7; i++) {
      const ch = sc.cases.charAt(i), x = TX(i);
      rond(c, x, TY + 2, 26); remplir(c, '#00000030');
      rond(c, x, TY, 26); remplir(c, COUL_CASE[ch] || '#fff', sc.lueur === i ? '#ff3a7a' : '#2b4a8a', sc.lueur === i ? 5 : 2);
      iconeCase(c, ch, x, TY, 26, t);
    }
    sc.medailles.forEach((k) => medaille(c, TX(k), TY - 4, 13));
    sc.pions.forEach((p, n) => {
      const memes = sc.pions.filter((q) => Math.abs(q.p - p.p) < 0.3).length > 1;
      const dx = memes ? (n % 2 ? 9 : -9) : 0;
      pion(c, p.s, TX(0) + p.p * 74 + dx, TY - 22, memes ? 18 : 25, p.s === 0 ? prog.maillot : 0, p.saut * 22);
      if (n === 0 && sc.x2) { etoilePath(c, TX(0) + p.p * 74 + 22, TY - 40, 9); remplir(c, '#c9a2ff', '#4a2a86', 2); etoilePath(c, TX(0) + p.p * 74 + 34, TY - 30, 7); remplir(c, '#c9a2ff', '#4a2a86', 2); }
    });
    // pupitre
    rr(c, 10, 168, 540, 186, 22); remplir(c, '#ffffff', '#2b4a8a', 3);
    const P = sc.panel;
    if (P.type === 'choix') {
      const cols = ['#3fae4a', '#f08a1c', '#e0403a'];
      [1, 2, 3].forEach((n) => {
        const b = BOUTON_PAS(n);
        rr(c, b[0] - 70, b[1] - 55, 140, 100, 18); remplir(c, '#fff', cols[n - 1], 5);
        for (let k = 0; k < n; k++) { rond(c, b[0] + (k - (n - 1) / 2) * 30, b[1] - 8, 11); remplir(c, cols[n - 1]); }
      });
      if (P.med) { rr(c, 200, 314, 160, 36, 14); remplir(c, '#ffd23a', '#b88a00', 3); medaille(c, 280, 334, 9); }
    } else if (P.type === 'attente') {
      medaillon(c, P.s, 280, 262, 50);
    } else {
      if (P.label) {
        c.font = '800 26px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        const w = c.measureText(P.label).width + 30;
        rr(c, 280 - w / 2, 180, w, 38, 12); remplir(c, '#ffe680', '#e8b800', 2);
        c.fillStyle = '#13305f'; c.fillText(P.label, 280, 200);
      }
      if (P.chrono !== undefined) { rr(c, 40, 224, 480, 8, 4); remplir(c, '#0000001a'); rr(c, 40, 224, 480 * Math.max(0, P.chrono), 8, 4); remplir(c, '#e0403a'); }
      if (P.grand) {
        rr(c, 40, 190, 150, 150, 18); remplir(c, '#fff', '#c9d6ea', 3);
        objet(c, P.grand, 115, 265, 62);
        P.items.forEach((it, i) => {
          const y = 222 + i * 50, etat = P.sel === i ? (i === P.bon ? '#2a9a4a' : '#e0403a') : '#c9d6ea';
          rr(c, 230, y - 22, 300, 44, 14); remplir(c, P.sel === i ? (i === P.bon ? '#d9f7df' : '#ffe0dd') : '#fff', etat, 4);
          c.font = '800 22px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#1f2a44'; c.fillText(it.txt, 380, y);
        });
      } else {
        const n = P.items.length;
        P.items.forEach((it, i) => {
          const p = TUILE(i, n), taille = n > 3 ? 100 : 116;
          const etat = P.sel === i ? (i === P.bon ? '#2a9a4a' : '#e0403a') : '#c9d6ea';
          rr(c, p[0] - taille / 2, p[1] - taille / 2 + 6, taille, taille - 6, 18); remplir(c, P.sel === i ? '#d9f7df' : '#fff', etat, 5);
          if (it.o) objet(c, it.o, p[0], p[1] + 3, taille * 0.38);
          else lieu(c, it.l, p[0], p[1] + 3, taille * 0.4);
        });
      }
    }
  }

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const def = TUTOS[cle]();
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    let sc = TUTOS[cle]().sc, k = 0, debut = 0, main0 = [470, 340];
    const j = ++tutoAnim;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const etapes = def.etapes;
      let et = etapes[k], ecoule = t - debut;
      if (ecoule >= et.d) {
        if (et.fait) et.fait(sc);
        if (et.pendant) et.pendant(sc, 1);
        if (et.main) main0 = et.main;
        k++; debut = t; ecoule = 0;
        if (k >= etapes.length) { k = 0; sc = TUTOS[cle]().sc; main0 = [470, 340]; }
        et = etapes[k];
      }
      const f = Math.min(1, ecoule / et.d);
      if (et.pendant) et.pendant(sc, f);
      dessinerScene(c, sc, t);
      if (et.main) {
        const q = Math.min(1, f / 0.7), ease = q * (2 - q);
        const x = main0[0] + (et.main[0] - main0[0]) * ease, y = main0[1] + (et.main[1] - main0[1]) * ease;
        main(c, x - 4, y, 1.5, et.tap && f > 0.75 ? Math.min(1, (f - 0.75) / 0.12) : 0);
      } else main(c, main0[0] - 4, main0[1], 1.5, 0);
      idAnim = requestAnimationFrame(image);
    }
    let idAnim = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(idAnim);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Clavier
  // ---------------------------------------------------------------------

  let clavierActif = false;
  document.addEventListener('pointerdown', () => { clavierActif = false; }, true);
  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    clavierActif = true;
    const chiffre = /^(?:Digit|Numpad)([1-4])$/.exec(ev.code);
    const mode = modePupitre();
    if (chiffre) {
      ev.preventDefault(); audio();
      const n = +chiffre[1];
      if (mode === 'choix' && !choixRivaux && n <= 3) choisirPas(n);
      else if (mode === 'question' && vue && vue.q && n <= vue.q.ch.length) repondre(n - 1);
      return;
    }
    if (ev.code === 'KeyM' && mode === 'choix' && !$('btn-medaille').hidden) { ev.preventDefault(); $('btn-medaille').click(); return; }
    if (/^Arrow/.test(ev.code)) {
      const liste = mode === 'choix' ? [...document.querySelectorAll(choixRivaux ? '#pup-rivaux button' : '#choix-ligne button')] : mode === 'question' ? [...document.querySelectorAll('#q-reps button:not(:disabled)')] : [];
      if (!liste.length) return;
      ev.preventDefault(); audio();
      const i = liste.indexOf(document.activeElement);
      const d = ev.code === 'ArrowLeft' || ev.code === 'ArrowUp' ? -1 : 1;
      const k = i < 0 ? 0 : (i + d + liste.length) % liste.length;
      try { liste[k].focus({ preventScroll: true }); } catch (e) { /* rien */ }
      sons.clic();
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-vestiaire').addEventListener('click', () => { audio(); sons.clic(); ouvrirVestiaire(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('vest-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-medaille').addEventListener('click', () => { audio(); sons.clic(); choixRivaux = true; clePupitre = ''; majPupitre(); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.bon[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'titre') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
