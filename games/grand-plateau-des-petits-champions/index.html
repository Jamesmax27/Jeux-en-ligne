<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    bouton.className = 'jel-langue-bouton';

    bouton.setAttribute('aria-expanded', 'false');

    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    menu.className = 'jel-langue-menu';
    menu.hidden = true;

      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;

      if (isole && !coin && hote) {

    });

    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };

      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;

      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);

  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);

      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });

      }
    };

    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {

    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];

    tout.date = Date.now();

    try { texte = JSON.stringify(tout); } catch (e) { return false; }

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },

  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');

    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;

      b.classList.remove('armer');

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)

  //                prochaine écriture du jeu)

    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {

  // o : {

    this.n = 0;
    this.manche = 0;
    this.phase = 'attente';
    this.siege = -1;
    this.humains = [];
    this.noms = [];            // pseudo des vrais joueurs par place (en ligne), ou null
    this.chef = -1;            // place du chef du salon (en ligne)

        return 0;
      case 'place':
        this.siege = m.siege;
        this.signaler({ type: 'sieges' });

  Partie.prototype.resynchroniser = function () {

  Partie.prototype.lancerManche = function () {

    return true;

  Partie.prototype.jouer = function (action) {

  // Pause (menu, écran caché) : la file et les robots locaux s'arrêtent. En
  // ligne, la partie continue sur le serveur : les coups attendent la reprise.
  Partie.prototype.pause = function (oui) {

  Partie.prototype.recommencer = function (options) {
    if (this.mode !== 'solo' || !this.local) return false;
    if (options) { this.o.options = options; this.local.reglages.options = options; }
    this.file = [];
    this.libreA = 0;
    this.local.nouvelleManche();

    PROTOCOLE: PROTOCOLE,
    hasard: hasard,
    copie: copie,

  var Q4 = ['objet', 'sport', 'lieu', 'intrus'];
  var Q5 = ['objet', 'sport', 'lieu', 'intrus', 'ombre'];
  var Q6 = ['objet', 'sport', 'lieu', 'intrus', 'ombre', 'compte'];
  var NIVEAUX = [
    { st: 0, L: 12, q: ['objet'], tuto: 'base' },
    { st: 0, L: 14, q: ['objet', 'sport'], nouv: 'sport', tuto: 'sport' },
    { st: 0, L: 16, q: ['objet', 'sport'], r: [4, 9, 13], tuto: 'relais' },
    { st: 0, L: 16, q: Q3, r: [5, 11], nouv: 'lieu', tuto: 'lieu' },
    { st: 0, L: 18, q: Q3, r: [3, 8, 14] },
    { st: 1, L: 16, q: Q4, r: [6, 12], nouv: 'intrus', tuto: 'intrus' },
    { st: 1, L: 18, q: Q4, r: [9, 15], t: [3, 11], tuto: 'tremplin' },
    { st: 1, L: 18, q: Q4, r: [7, 14], t: [4, 10], med: 1, tuto: 'medaille' },
    { st: 1, L: 20, q: Q5, r: [6, 13], t: [3, 9, 15], med: 1, nouv: 'ombre', tuto: 'ombre' },
    { st: 1, L: 22, q: Q5, r: [5, 12, 18], t: [2, 8, 15], med: 1 },
    { st: 2, L: 18, q: Q5, r: [4, 13], t: [7], med: 1, chr: 1, tuto: 'chrono' },
    { st: 2, L: 20, q: Q5, r: [5, 14], t: [2, 11], v: [8, 17], med: 1, chr: 1, tuto: 'recul' },
    { st: 2, L: 20, q: Q6, r: [6, 15], t: [3], v: [9, 13, 18], med: 1, chr: 1, nouv: 'compte', tuto: 'compte' },
    { st: 2, L: 22, q: Q6, r: [4, 12, 19], t: [7, 15], v: [10, 18], med: 2, chr: 1 },
    { st: 2, L: 24, q: Q6, r: [6, 13, 20], t: [2, 9, 16], v: [7, 12, 19, 23], med: 2, chr: 1 },
    { st: 3, L: 22, q: Q6, r: [6, 17], t: [11], v: [9, 14, 20], s: [1], med: 2, chr: 1, tuto: 'telesiege' },
    { st: 3, L: 24, q: Q6, r: [5, 16], t: [8], v: [3, 6, 11, 19, 22], s: [14], med: 2, chr: 1 },
    { st: 3, L: 24, q: Q6, r: [4, 13, 20], t: [9], v: [7, 12, 18, 23], s: [15], med: 2, chr: 1, spr: 1, tuto: 'sprint' },
    { st: 3, L: 26, q: Q6, r: [5, 14, 21], t: [2, 10, 18], v: [8, 13, 17, 24], s: [11], med: 2, chr: 1, spr: 1 },
    { st: 3, L: 28, q: Q6, r: [5, 13, 22], t: [2, 10, 19], v: [8, 16, 20, 25], s: [11], med: 2, chr: 1, spr: 1 }
  ];
  var TOURS_MAX = 40;          // questions par place au plus : la course finit toujours

  function cases(def) {
    var c = [], k, i;
    for (i = 0; i <= def.L; i++) c.push('.');
    c[0] = 'D'; c[def.L] = 'A';
    ['r', 't', 'v', 's'].forEach(function (k2) { (def[k2] || []).forEach(function (x) { c[x] = k2; }); });
    k = c.join('');
    return k;
  }

  // Cases de la ligne droite du fond (chronométrées à partir du niveau 11).
  function estChrono(L, i) {
    var f = (i + 0.5) / (L + 1);
    return i > 0 && i < L && f >= 0.5 && f <= 0.6945;
  }

  // Force des robots d'un niveau solo : 0,1 au niveau 1, 0,85 au niveau 20.
  function forceNiveau(n) {
    var k = Math.max(0, Math.min(NIVEAUX.length - 1, n - 1)) / (NIVEAUX.length - 1);
    return Math.round((0.1 + 0.75 * k) * 100) / 100;
  }

  // Chance qu'un robot réponde juste à une question de difficulté d.
  function chance(d, fo) { return [0.92, 0.78, 0.64][d - 1] * (0.55 + 0.45 * fo); }

  function pioche(liste, alea) { return liste[Math.floor(alea() * liste.length) % liste.length]; }
  function melange(liste, alea) {
    var l = liste.slice();
    for (var i = l.length - 1; i > 0; i--) { var j = Math.floor(alea() * (i + 1)) % (i + 1); var x = l[i]; l[i] = l[j]; l[j] = x; }
    return l;
  }

  // Un objet pour une question de difficulté d (préférence : le stade, puis la difficulté).
  function choisirObjet(d, st, alea, filtre) {
    var tous = OBJETS.filter(function (o) { return o.d <= d && (!filtre || filtre(o)); });
    var memes = tous.filter(function (o) { return o.d === d; });
    var fav = tous.filter(function (o) { return FAVORIS[st].indexOf(o.sp) >= 0; });
    var r = alea();
    if (fav.length && r < 0.3) return pioche(fav, alea);
    if (memes.length && r < 0.75) return pioche(memes, alea);
    return pioche(tous, alea);
  }

  // Place la bonne réponse parmi les autres ; renvoie { ch, a }.
  function ranger(bonne, autres, alea) {
    var ch = melange([bonne].concat(autres), alea);
    return { ch: ch, a: ch.indexOf(bonne) };
  }

  function typeQuestion(def, alea) {
    var l = [];
    def.q.forEach(function (k) { l.push(k); if (k === def.nouv) { l.push(k); l.push(k); } });
    return pioche(l, alea);
  }

  // Tire une question de difficulté d pour la place s.
  function question(e, s, d, alea) {
    var def = NIVEAUX[e.n], k = typeQuestion(def, alea), n = d + 1, q, x, r;
    if (k === 'objet') {
      x = choisirObjet(d, e.st, alea);
      var autres = melange(OBJETS.filter(function (o) { return o.sp !== x.sp && o.d <= d + 1; }), alea);
      var pris = [], sports = [];
      for (var i = 0; i < autres.length && pris.length < n - 1; i++) {
        if (sports.indexOf(autres[i].sp) >= 0) continue;
        sports.push(autres[i].sp); pris.push(autres[i].id);
      }
      r = ranger(x.id, pris, alea);
      q = { k: k, s: x.sp, ch: r.ch, a: r.a };
    } else if (k === 'sport') {
      x = choisirObjet(d, e.st, alea);
      var exclus = x.c === 'r' ? OBJETS.filter(function (o) { return o.c === 'r'; }).map(function (o) { return o.sp; }) : [x.sp];
      var choix = melange(LISTE_SPORTS.filter(function (sp) { return sp !== x.sp && exclus.indexOf(sp) < 0 && SPORTS[sp].d <= d + 1; }), alea).slice(0, n - 1);
      r = ranger(x.sp, choix, alea);
      q = { k: k, s: x.id, ch: r.ch, a: r.a };
    } else if (k === 'lieu') {
      var avec = LISTE_SPORTS.filter(function (sp) { return SPORTS[sp].l && SPORTS[sp].d <= d; });
      var memes = avec.filter(function (sp) { return SPORTS[sp].d === d; });
      var sp = memes.length && alea() < 0.6 ? pioche(memes, alea) : pioche(avec, alea);
      var lieux = melange(LIEUX.filter(function (l) { return l !== SPORTS[sp].l; }), alea).slice(0, n - 1);
      r = ranger(SPORTS[sp].l, lieux, alea);
      q = { k: k, s: sp, ch: r.ch, a: r.a };
    } else if (k === 'intrus') {
      n = Math.max(3, n);
      var fam = alea() < 0.4 ? FAMILLE_STADE[e.st] : pioche(FAMILLES, alea);
      var dedans = melange(OBJETS.filter(function (o) { return o.c === fam; }), alea).slice(0, n - 1).map(function (o) { return o.id; });
      var dehors = OBJETS.filter(function (o) { return o.c !== fam && o.d <= d + 1; });
      var intrus = pioche(dehors, alea).id;
      r = ranger(intrus, dedans, alea);
      q = { k: k, s: fam, ch: r.ch, a: r.a };
    } else if (k === 'ombre') {
      x = choisirObjet(d, e.st, alea, function (o) { return !o.o; });
      var formes = melange(OBJETS.filter(function (o) { return !o.o && o.id !== x.id; }), alea).slice(0, n - 1).map(function (o) { return o.id; });
      r = ranger(x.id, formes, alea);
      q = { k: k, s: x.id, ch: r.ch, a: r.a };
    } else {
      var cible = pioche(A_COMPTER, alea);
      var combien = d === 1 ? 1 + Math.floor(alea() * 3) % 3 : d === 2 ? 2 + Math.floor(alea() * 4) % 4 : 3 + Math.floor(alea() * 5) % 5;
      var tas = [];
      for (var j = 0; j < combien; j++) tas.push(cible);
      var sortes = melange(OBJETS.filter(function (o) { return !o.o && o.id !== cible && o.id !== 'but' && o.id !== 'panier' && o.id !== 'velo'; }), alea).slice(0, d === 1 ? 1 : 2);
      sortes.forEach(function (o) { var m = 1 + Math.floor(alea() * 3) % 3; for (var z = 0; z < m; z++) tas.push(o.id); });
      var voisins = [];
      for (var v = combien - 2; v <= combien + 2; v++) if (v > 0 && v !== combien) voisins.push(v);
      r = ranger(combien, melange(voisins, alea).slice(0, n - 1), alea);
      q = { k: k, s: cible, ch: r.ch, a: r.a, tas: melange(tas, alea) };
    }
    q.d = d;
    q.chr = def.chr ? estChrono(e.L, e.pos[s]) : false;
    q.spr = !!(def.spr && d === 3);
    return q;
  }

  // Première case libre (sans médaille) devant la place t, ou -1.
  function caseMedaille(e, t) {
    for (var x = e.pos[t] + 1; x < e.L; x++) if (e.mc.indexOf(x) < 0) return x;
    return -1;
  }

  // Déplacement d'une bonne réponse de `pas` cases, depuis la place s.
  function avancer(e, s, pas) {
    var p = e.pos[s], bloc = false, mi;
    for (var k = 0; k < pas && p < e.L; k++) {
      var x = p + 1;
      if (x < e.L && e.mc.indexOf(x) >= 0) { p = x; bloc = true; break; }
      p = x;
    }
    mi = p;
    var eff = bloc ? 'b' : '';
    if (!bloc && p < e.L && pas > 0) {
      var ch = e.p.charAt(p);
      if (ch === 't') { p = Math.min(e.L, p + 2); eff = 't'; }
      else if (ch === 'v') { p = Math.max(0, p - 2); eff = 'v'; }
      else if (ch === 's') { p = Math.min(e.L, p + 4); eff = 's'; }
      else if (ch === 'r') eff = 'r';
    }
    if (p >= e.L) eff = eff || 'a';
    return { mi: mi, a: p, eff: eff, bloc: bloc };
  }

  function pasPour(e, s, d) {
    var def = NIVEAUX[e.n];
    return d + (def.chr && estChrono(e.L, e.pos[s]) ? 1 : 0) + (def.spr && d === 3 ? 1 : 0);
  }

  // Valeur (pour un robot) d'une bonne réponse à d cases.
  function valeurArrivee(e, s, d) {
    var m = avancer(e, s, pasPour(e, s, d));
    var v = m.a - e.pos[s];
    if (m.eff === 'r') v += 1.6;
    if (m.eff === 'b') v += 0.6;
    if (m.a >= e.L) v += 3;
    return v;
  }

  window.JEL_REGLES = {
    places: 4,
    delaiBot: 1100,
    delaiJoueur: 25000,
    pauseManche: 8000,
    remplacement: 'tour',
    forceEnLigne: 0.55,

    depart: function (alea, places, options) {
      var o = options || {}, idx;
      var solo = typeof o.niveau === 'number' && isFinite(o.niveau);
      if (solo) idx = Math.max(0, Math.min(NIVEAUX.length - 1, Math.floor(o.niveau) - 1));
      else idx = 4 + Math.floor(alea() * (NIVEAUX.length - 4)) % (NIVEAUX.length - 4);
      var def = NIVEAUX[idx];
      var e = {
        n: idx, st: def.st, L: def.L, p: cases(def), pos: [], med: [], mc: [], ok: [], nq: [], arr: [],
        tour: 0, ph: 'choix', d: 0, q: null, lq: null, mp: false, nt: 0, max: TOURS_MAX * places, der: null
      };
      for (var s = 0; s < places; s++) { e.pos.push(0); e.med.push(def.med || 0); e.ok.push(0); e.nq.push(0); }
      if (solo) e.fr = forceNiveau(idx + 1);
      e.tour = solo && idx < 2 ? 0 : Math.floor(alea() * places) % places;
      return e;
    },

    aQui: function (e) { return e.tour; },

    valide: function (e, s, a) {
      if (!a || typeof a !== 'object' || s !== e.tour || e.arr.length || e.nt >= e.max) return false;
      var n = (a.d !== undefined ? 1 : 0) + (a.m !== undefined ? 1 : 0) + (a.r !== undefined ? 1 : 0);
      if (n !== 1) return false;
      if (e.ph === 'choix') {
        if (a.d !== undefined) return a.d === 1 || a.d === 2 || a.d === 3;
        if (a.m !== undefined) {
          return (NIVEAUX[e.n].med || 0) > 0 && !e.mp && e.med[s] > 0 && Number.isInteger(a.m) && a.m >= 0 &&
            a.m < e.pos.length && a.m !== s && caseMedaille(e, a.m) >= 0;
        }
        return false;
      }
      if (e.ph === 'question') return !!e.q && Number.isInteger(a.r) && a.r >= -1 && a.r < e.q.ch.length;
      return false;
    },

    jouer: function (e, s, a, alea) {
      if (a.m !== undefined) {
        var c = caseMedaille(e, a.m);
        e.mc.push(c);
        e.med[s] -= 1;
        e.mp = true;
        e.der = { k: 'm', s: s, cible: a.m, c: c };
        return e;
      }
      if (a.d !== undefined) {
        e.d = a.d;
        e.q = question(e, s, a.d, alea);
        e.ph = 'question';
        e.der = { k: 'd', s: s, d: a.d };
        return e;
      }
      var q = e.q, bon = a.r === q.a, de = e.pos[s];
      e.nq[s] += 1;
      if (bon) e.ok[s] += 1;
      var m = bon ? avancer(e, s, e.d + (q.chr ? 1 : 0) + (q.spr ? 1 : 0)) : { mi: de, a: de, eff: '', bloc: false };
      if (m.bloc) {
        e.mc.splice(e.mc.indexOf(m.mi), 1);
        e.med[s] = Math.min(3, e.med[s] + 1);
      }
      var gm = bon && q.d === 3 && (NIVEAUX[e.n].med || 0) > 0 && e.med[s] < 3;
      if (gm) e.med[s] += 1;
      e.pos[s] = m.a;
      if (m.a >= e.L && e.arr.indexOf(s) < 0) e.arr.push(s);
      e.der = { k: 'r', s: s, bon: bon, rep: a.r, de: de, mi: m.mi, a: m.a, eff: m.eff, gm: gm };
      e.lq = q;
      e.q = null;
      e.d = 0;
      e.ph = 'choix';
      e.mp = false;
      e.nt += 1;
      if (!(m.eff === 'r' && m.a < e.L)) e.tour = (s + 1) % e.pos.length;
      return e;
    },

    // Robot : répond juste plus ou moins souvent (force, difficulté), pose une
    // médaille devant le meneur, choisit sa distance d'après les cases.
    bot: function (e, s, alea, force) {
      var fo = typeof e.fr === 'number' ? e.fr : (typeof force === 'number' ? force : 0.5);
      if (e.ph === 'question') {
        var q = e.q;
        if (alea() < chance(q.d, fo)) return { r: q.a };
        var faux = [];
        for (var i = 0; i < q.ch.length; i++) if (i !== q.a) faux.push(i);
        return { r: pioche(faux, alea) };
      }
      if ((NIVEAUX[e.n].med || 0) > 0 && !e.mp && e.med[s] > 0 && alea() < 0.2 + 0.5 * fo) {
        var cible = -1, haut = -1;
        for (var t = 0; t < e.pos.length; t++) {
          if (t !== s && e.pos[t] > haut && caseMedaille(e, t) >= 0) { haut = e.pos[t]; cible = t; }
        }
        if (cible >= 0 && e.pos[cible] >= e.pos[s] - 1) return { m: cible };
      }
      if (alea() < 0.3 * (1 - fo)) return { d: 1 + Math.floor(alea() * 3) % 3 };
      var mieux = 1, haute = -Infinity;
      for (var d = 1; d <= 3; d++) {
        var v = chance(d, fo) * valeurArrivee(e, s, d) + alea() * (1 - fo) * 1.5;
        if (v > haute) { haute = v; mieux = d; }
      }
      return { d: mieux };
    },

    fin: function (e) {
      if (!e.arr.length && e.nt < e.max) return null;
      var cl = [];
      for (var s = 0; s < e.pos.length; s++) cl.push(s);
      cl.sort(function (x, y) {
        var ax = e.arr.indexOf(x), ay = e.arr.indexOf(y);
        if (ax >= 0 || ay >= 0) { if (ax < 0) return 1; if (ay < 0) return -1; return ax - ay; }
        return (e.pos[y] - e.pos[x]) || (e.ok[y] - e.ok[x]) || (x - y);
      });
      return { classement: cl, scores: e.pos.slice() };
    },

    // Données et outils partagés avec l'écran du jeu.
    outils: {
      NIVEAUX: NIVEAUX, OBJETS: OBJETS, PAR_ID: PAR_ID, SPORTS: SPORTS, LISTE_SPORTS: LISTE_SPORTS, LIEUX: LIEUX,
      cases: cases, estChrono: estChrono, forceNiveau: forceNiveau, caseMedaille: caseMedaille,
      avancer: avancer, pasPour: pasPour
    }
  };
})();
</script>

<script>
(function () {
  'use strict';

  // =====================================================================
  //  Le grand plateau des petits champions — quiz de sport en course
  //  À son tour : 1, 2 ou 3 cases, puis une question en images ; bonne
  //  réponse, on avance. Solo : 20 niveaux contre 3 robots. En ligne : de
  //  vrais joueurs remplacent les robots (moteur commun JEL_MULTI).
  //  Les règles, les pistes et les questions sont dans le bloc jel-regles.
  // =====================================================================

  const JEU = 'grand-plateau-des-petits-champions';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = O.NIVEAUX;                 // mêmes données que les règles
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);
  const DUREE_CHRONO = 10000;               // ms pour répondre à une question chronométrée

  // Une couleur et un champion par place : 0 lapin, 1 renard, 2 ourse, 3 grenouille.
  const COUL = ['#2f6fe0', '#e0484f', '#eaa400', '#1d9a55'];
  const COUL_F = ['#163d8f', '#8c1f28', '#7a4f00', '#0d5530'];
  // Maillots débloqués par les étoiles (total gagné dans les 20 niveaux).
  const MAILLOTS = [0, 6, 12, 20, 28, 36, 46, 56];
  // Stades : couleurs du ciel, de la piste et des cases.
  const STADES = [
    { ciel: ['#5fb4ee', '#cdeaff'], bande: '#c8503a', bord: '#8f2f20', case: '#e8775f', ligne: '#ffffff' },
    { ciel: ['#4fc0e8', '#d2f4ff'], bande: '#59b7e3', bord: '#1f6f99', case: '#9ad8f2', ligne: '#ffffff' },
    { ciel: ['#e7c79a', '#fff0d6'], bande: '#d49a52', bord: '#8a5a20', case: '#f0c27e', ligne: '#ffffff' },

    const cle = partie.manche + ':' + e.nt + ':' + e.d + ':' + e.q.ch.join(',');
    if (!chrono || chrono.cle !== cle) { chrono = { cle: cle, reste: DUREE_CHRONO, dernier: now, envoye: false }; dernierTic = -1; }
    if (!enPause) chrono.reste -= now - chrono.dernier;
    chrono.dernier = now;
    if (chrono.reste <= 0 && !chrono.envoye) {
      chrono.envoye = true;
      if (partie.jouer({ r: -1 })) toast(tr('jeu.tempsEcoule'), 1600);
    }
  }

  // ---------------------------------------------------------------------
  //  Panneau du bas : distances, médailles, question
  // ---------------------------------------------------------------------

  function libelleQuestion(q) {
    if (q.k === 'objet') return tr('q.objet', { sport: tr('sport.' + q.s) });
    if (q.k === 'sport') return tr('q.sport');
    if (q.k === 'lieu') return tr('q.lieu', { sport: tr('sport.' + q.s) });
    if (q.k === 'intrus') return tr('q.intrus.' + q.s);
    if (q.k === 'ombre') return tr('q.ombre');
    return tr('q.compte', { objet: tr('objet.' + q.s) });
  }

  function nomChoix(q, x) {
    if (q.k === 'sport') return tr('sport.' + x);
    if (q.k === 'lieu') return tr('lieu.' + x);
    if (q.k === 'compte') return nb(x);
    return tr('objet.' + x);
  }

  function boutonChoix(q, i, actif, marque) {
    const x = q.ch[i];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'rep' + (q.k === 'lieu' ? ' lieu' : '') + (q.k === 'compte' ? ' nombre' : '') + (marque || '');
    b.disabled = !actif;

    b.appendChild(touche);

    } else {

      else { cv.width = 144; cv.height = 144; dessinObjet(cv.getContext('2d'), x, 72, 72, 136); }
      b.appendChild(cv);
    }
    b.setAttribute('aria-label', nomChoix(q, x));
    if (actif) b.addEventListener('click', () => { audio(); repondre(i); });

  }

  function boutonDistance(d, actif) {
    const e = vue, s = partie ? partie.siege : -1;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'dist d' + d; b.disabled = !actif;
    const pts = document.createElement('span'); pts.className = 'points'; pts.textContent = '●'.repeat(d); pts.setAttribute('aria-hidden', 'true');
    const lib = document.createElement('span'); lib.className = 'lib'; lib.textContent = tr('choix.cases', { n: d });
    const sous = document.createElement('span'); sous.className = 'sous'; sous.textContent = tr('choix.niveau' + d);
    const bonus = document.createElement('span'); bonus.className = 'bonus';
    if (e && s >= 0) {
      const def = NIVEAUX[e.n];
      const enChrono = def.chr && O.estChrono(e.L, e.pos[s]);
      if (def.spr && d === 3) bonus.textContent = tr('choix.sprint');
      else if (enChrono) bonus.textContent = tr('choix.chrono');
    }
    b.append(pts, lib, sous, bonus);
    b.setAttribute('aria-label', tr('choix.aria', { n: d, rep: d + 1 }) + (bonus.textContent ? ' · ' + bonus.textContent : ''));
    if (actif) {
      b.addEventListener('click', () => { audio(); choisirDistance(d); });
      b.addEventListener('pointerenter', () => { apercuD = d; });
      b.addEventListener('pointerleave', () => { if (apercuD === d) apercuD = 0; });
      b.addEventListener('focus', () => { apercuD = d; });
      b.addEventListener('blur', () => { if (apercuD === d) apercuD = 0; });
    }
    return b;
  }

  // Reconstruit le panneau seulement quand ce qu'il montre change.
  function majPanneau() {
    const e = vue, texte = $('p-texte'), boite = $('p-choix'), meds = $('p-medailles');
    const now = performance.now();
    let cle = 'vide', construire = null, message = '', classe = '';
    const moi = partie ? partie.siege : -1;
    if (e && partie && partie.phase === 'jeu' && !attenteTuto) {
      const s = R.aQui(e);
      const monTour = s === moi && partie.monTour();
      if (resultat && now < resultat.jusque) {
        cle = 'res:' + resultat.id;
        message = resultat.texte; classe = resultat.bon ? 'bon' : 'faux';
        construire = () => questionBoutons(resultat.q, false, resultat.rep);
      } else if (e.ph === 'question' && e.q) {
        const actif = monTour && now >= libreA;
        cle = 'q:' + e.nt + ':' + e.q.ch.join(',') + ':' + actif;
        message = libelleQuestion(e.q);
        construire = () => questionBoutons(e.q, actif, null);
      } else {
        const actif = monTour && now >= libreA;
        cle = 'd:' + e.nt + ':' + actif + ':' + s + ':' + e.mp + ':' + e.med.join(',') + ':' + e.pos.join(',');
        message = actif ? tr('choix.titre') : '';
        construire = () => distanceBoutons(actif);
      }
    } else if (partie && partie.mode === 'connexion') {
      cle = 'connexion';
    }
    if (cle === cleBoutons) return;
    cleBoutons = cle;
    const focusAvant = document.activeElement && boite.contains(document.activeElement);
    texte.textContent = message;
    texte.className = classe;
    boite.textContent = '';
    meds.hidden = true; meds.textContent = '';
    if (construire) construire();
    if (focusAvant || clavier) { const b = boite.querySelector('button:not(:disabled)'); if (b) try { b.focus({ preventScroll: true }); } catch (er) { /* rien */ } }
  }

  function questionBoutons(q, actif, rep) {
    const boite = $('p-choix');
    boite.className = 'n' + q.ch.length;
    for (let i = 0; i < q.ch.length; i++) {
      let marque = '';
      if (rep !== null) { if (i === q.a) marque = ' bonne'; else if (i === rep) marque = ' mauvaise'; }
      boite.appendChild(boutonChoix(q, i, actif, marque));
    }
  }

  function distanceBoutons(actif) {
    const e = vue, boite = $('p-choix'), meds = $('p-medailles');
    boite.className = 'n3';
    for (let d = 1; d <= 3; d++) boite.appendChild(boutonDistance(d, actif));
    const moi = partie.siege;
    if (actif && (NIVEAUX[e.n].med || 0) > 0 && !e.mp && e.med[moi] > 0) {
      const cibles = [];
      for (let t = 0; t < PLACES; t++) if (t !== moi && O.caseMedaille(e, t) >= 0) cibles.push(t);
      if (cibles.length) {
        meds.hidden = false;
        const lib = document.createElement('span'); lib.textContent = tr('medaille.poser');
        meds.appendChild(lib);
        cibles.forEach((t) => {
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'btn-med';
          const cv = document.createElement('canvas'); cv.width = 72; cv.height = 72;
          const c = cv.getContext('2d'); medaillon(c, t, 36, 36, 34);
          const sp = document.createElement('span'); sp.textContent = '🏅';
          b.append(cv, sp);
          b.setAttribute('aria-label', tr('medaille.aria', { nom: nomCourt(t) }));
          b.addEventListener('click', () => { audio(); poserMedaille(t); });
          meds.appendChild(b);
        });
      }
    }
  }

  function jouerAction(a) {
    if (!partie || enPause || attenteTuto) return false;
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return false;
    }
    if (performance.now() < libreA) return false;
    return partie.jouer(a);
  }
  function choisirDistance(d) { if (vue && vue.ph === 'choix' && jouerAction({ d: d })) { apercuD = 0; sons.clic(); } }
  function repondre(i) { if (vue && vue.ph === 'question' && jouerAction({ r: i })) { chrono = null; } }
  function poserMedaille(t) { if (vue && vue.ph === 'choix') jouerAction({ m: t }); }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    const now = performance.now();
    majChrono(now);
    dessinerJeu(now, dt);
    majTemps(now);
    majCompte();
    majPanneau();
    majInfos();
    rafId = requestAnimationFrame(boucle);
  }

  // Positions animées des pions (pas de case en case, puis effet de la case).
  function positionsAnimees(now) {
    if (!vue) return null;
    const pos = vue.pos.map((x) => ({ i: x, saut: 0 }));
    if (!anim) return pos;
    let t = now - anim.t0;
    if (t < 0) { pos[anim.s] = { i: anim.depart, saut: 0 }; return pos; }
    let i = anim.depart;
    for (const et of anim.etapes) {
      if (t < et.duree) {
        const k = Math.max(0, t / et.duree);
        const arc = et.type === 'pas' ? 0.5 : et.type === 'saut' ? 1.6 : 0;
        pos[anim.s] = { i: et.de + (et.vers - et.de) * k, saut: Math.sin(Math.PI * k) * (geo ? geo.rc * arc : 0) };
        if (et.son && !et.joue) { et.joue = true; et.son(); }
        return pos;
      }
      t -= et.duree;
      if (et.son && !et.joue) { et.joue = true; et.son(); }
      i = et.vers;
    }
    void i;
    anim = null;
    return pos;
  }

  function dessinerJeu(now, dt) {
    const cv = $('piste'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; c.fillStyle = '#1d5fa8'; c.fillRect(0, 0, w, h); return; }
    geo = geometrie(vue.L, w, h);
    const moi = partie ? partie.siege : -1;
    let apercu = null;
    if (apercuD && moi >= 0 && vue.ph === 'choix' && R.aQui(vue) === moi) apercu = O.avancer(vue, moi, O.pasPour(vue, moi, apercuD));
    const s = partie && partie.phase === 'jeu' ? R.aQui(vue) : -1;
    dessinerPiste(c, vue, geo, w, h, {
      t: now, positions: positionsAnimees(now), apercu: apercu, moi: moi, actif: s, chuteMedaille: chuteMedaille
    });
    const q = resultat && now < resultat.jusque ? resultat.q : vue.q;
    dessinerEcranGeant(c, geo, q, now, resultat && now < resultat.jusque ? resultat.s : s);
    // particules (étincelles, confettis de case)
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      if (p.etoile) etincelle(c, p.x, p.y, p.k); else { rond(c, p.x, p.y, p.k * 0.5); c.fill(); }
      c.globalAlpha = 1;
    }
  }

  function jaillir(i, qui, nbre) {
    if (!vue || !geo) return;
    const p = geo.pts[Math.max(0, Math.min(vue.L, i))];
    for (let k = 0; k < (nbre || 14); k++) {
      const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 180;
      particules.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 160, vie: 0.7 + Math.random() * 0.4, k: geo.rc * (0.25 + Math.random() * 0.25), coul: k % 2 ? COUL[qui] : '#ffe066', etoile: k % 3 !== 0 });
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function nouvelleVue() {
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    anim = null; resultat = null; chrono = null; chuteMedaille = null; cleBoutons = '';
    particules.length = 0;
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    nouvelleVue();
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la course,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44);
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { animal: tr('animal.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomChef ? nomChef + ' · ' + tr('animal.' + partie.chef) : tr('animal.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    nouvelleVue();
    debutTour = Date.now();
    dernierTic = -1;
    libreA = performance.now() + 400;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche, stade: tr('stade.' + vue.st) })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  // Un coup joué (par soi, un robot ou un autre joueur) : animation et sons.
  function surAction(ev) {
    const now = performance.now();
    const avant = ev.avant, apres = ev.apres;
    vue = JSON.parse(JSON.stringify(apres));
    debutTour = Date.now();
    dernierTic = -1;
    const der = apres.der || {};
    if (der.k === 'm') {
      chuteMedaille = { c: der.c, t: now };
      sons.medaille();
      toast(ev.moi ? tr('medaille.posee', { nom: nomCourt(der.cible) }) : tr('medaille.contre', { nom: nomCourt(ev.siege), cible: der.cible === partie.siege ? tr('medaille.toi') : nomCourt(der.cible) }), 1800);
    } else if (der.k === 'd') {
      sons.choix(der.d);
      setTimeout(() => sons.question(), 180);
      if (ev.moi) libreA = now + 350;
    } else if (der.k === 'r') {
      const q = avant.q;
      const nbPas = der.mi - der.de;
      const etapes = [];
      for (let k = 0; k < nbPas; k++) etapes.push({ type: 'pas', de: der.de + k, vers: der.de + k + 1, duree: 170, son: sons.pas });
      if (der.eff === 't') etapes.push({ type: 'saut', de: der.mi, vers: der.a, duree: 420, son: sons.tremplin });
      else if (der.eff === 'v') etapes.push({ type: 'glisse', de: der.mi, vers: der.a, duree: 420, son: sons.recul });
      else if (der.eff === 's') etapes.push({ type: 'cable', de: der.mi, vers: der.a, duree: 700, son: sons.telesiege });
      const debut = now + 380;
      anim = etapes.length ? { s: ev.siege, depart: der.de, etapes: etapes, t0: debut } : null;
      const duree = etapes.reduce((a, b) => a + b.duree, 0);
      let texte;
      const qui = ev.moi ? '' : nomCourt(ev.siege);
      if (der.bon) {
        const n = der.a - der.de;
        if (n > 0) texte = ev.moi ? tr('res.bon', { n: n }) : tr('res.bonAutre', { nom: qui, n: n });
        else texte = ev.moi ? tr('res.bonSeul') : tr('res.bonSeulAutre', { nom: qui });
        if (der.eff === 'r') texte += ' ' + tr('res.relais');
        else if (der.eff === 'b') texte += ' ' + tr('res.bloque');
        else if (der.eff === 't') texte += ' ' + tr('res.tremplin');
        else if (der.eff === 'v') texte += ' ' + tr('res.recul');
        else if (der.eff === 's') texte += ' ' + tr('res.telesiege');
        if (der.gm) texte += ' ' + tr('res.medaille');
        sons.bon();
        setTimeout(() => { if (vue) jaillir(der.a, ev.siege); }, 380 + duree);
        if (der.eff === 'r') setTimeout(() => sons.relais(), 380 + duree);
        if (der.eff === 'b') setTimeout(() => sons.bloque(), 380 + duree);
        const carte = $('place-' + ev.siege);
        carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
      } else {
        texte = der.rep === -1 ? (ev.moi ? tr('res.temps') : tr('res.tempsAutre', { nom: qui })) : (ev.moi ? tr('res.faux') : tr('res.fauxAutre', { nom: qui }));
        sons.faux();
      }
      resultat = { id: apres.nt + ':' + now, q: q, rep: der.rep, bon: der.bon, s: ev.siege, texte: texte, jusque: now + Math.max(1100, 380 + duree + 250) };
      libreA = resultat.jusque;
      chrono = null;
    }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && R.aQui(vue) === partie.siege && !ev.moi) setTimeout(() => sons.tour(), 500);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }

    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');

    majSalon();

    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, attente);
  }

  function rangDe(e, s) {
    const f = R.fin(e);
    return f ? f.classement.indexOf(s) + 1 : 0;

  // Fin d'une course en ligne : classement, puis le salon (même fenêtre).

  // Étoiles : 3 = 1er avec 75 % de bonnes réponses ; 2 = 1er, ou 2e avec 75 % ; 1 = 2e.
  function etoilesPour(rang, ok, nq) {
    const ratio = nq ? ok / nq : 0;
    if (rang === 1) return ratio >= 0.75 ? 3 : 2;
    if (rang === 2) return ratio >= 0.75 ? 2 : 1;
    return 0;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const f = R.fin(e);
    const ordre = f ? f.classement : [0, 1, 2, 3];
    ordre.forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64; medaillon(cv.getContext('2d'), s, 32, 32, 30);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('animal.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = e.arr.indexOf(s) >= 0 ? tr('fin.arrive') : tr('fin.cases', { n: e.pos[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');

    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const rang = moi >= 0 ? rangDe(e, moi) : 0;
    const ok = moi >= 0 ? e.ok[moi] : 0, nq = moi >= 0 ? e.nq[moi] : 0;
    const gagne = rang >= 1 && rang <= 2;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.bonnes', { n: ok, total: nq }) : '';
    $('fin-cadeau').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = gagne ? etoilesPour(rang, ok, nq) : 0;
      const ancienRecord = prog.records[i];
      const record = gagne && ok > ancienRecord;
      if (record) prog.records[i] = ok;
      let debloque = false;
      const cadeaux = [];
      if (gagne) {
        const avantTotal = totalEtoiles(), coupeAvant = coupe(NIVEAUX[i].st);
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        const coupeApres = coupe(NIVEAUX[i].st);
        if (coupeApres > coupeAvant) cadeaux.push(tr('fin.coupe', { coupe: tr('coupe.' + coupeApres), stade: tr('stade.' + NIVEAUX[i].st) }));
        MAILLOTS.forEach((seuil) => { if (avantTotal < seuil && totalEtoiles() >= seuil) cadeaux.push(tr('fin.maillot')); });
        sauver(Math.min(niveau + 1, NIVEAUX.length), ok);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      }
      $('fin-titre').textContent = gagne ? tr(rang === 1 ? 'fin.premier' : 'fin.deuxieme') : tr('fin.perdu', { n: rang });
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : (prog.records[i] ? tr('fin.record', { n: prog.records[i] }) : '');
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : (gagne ? '' : tr('fin.conseil')));
      $('fin-cadeau').textContent = cadeaux.join(' ');
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
      if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil.
      const premier = rang === 1;

      if (premier) { sons.victoire(); confettis(); } else sons.defaite();
    }

  }

  // Compte à rebours avant la course suivante (en ligne repassée en solo).
  function majCompte() {
    majSalon();

    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
