<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */

  var SECOURS = 'en';

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<style>

    margin: 0; font-size: clamp(34px, 10vw, 58px); line-height: 1.02; color: #fff8e6; letter-spacing: .5px;
    text-shadow: 0 3px 0 #b9541a, 0 6px 18px rgba(0, 0, 0, .45);
  }

    position: absolute; z-index: 2; left: 0; right: 0; bottom: 22px; display: flex; flex-direction: column; align-items: center; gap: 12px;
  }

  /* ---- Panneaux (noms, niveaux, prévisions) ---- */

  .entete h2 { flex: 1; margin: 0; font-size: 22px; text-align: center; color: #23324f; }
  .defile { flex: 1 1 auto; overflow-y: auto; padding: 0 12px 12px; -webkit-overflow-scrolling: touch; }
  .carte {
    background: rgba(255, 250, 236, .96); border-radius: 18px; padding: 12px; box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
    max-width: 560px; margin: 0 auto 10px;
  }
  .pied { flex: none; padding: 10px 12px 14px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

  /* Noms */
  .ligne-nom { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed #e2cfa6; }
  .ligne-nom:last-child { border-bottom: 0; }
  .ligne-nom .avatar { width: 48px; height: 48px; flex: none; }
  .ligne-nom .infos { flex: 1; min-width: 0; }
  .ligne-nom .metier-nom { font-weight: 700; font-size: 14px; color: #6a4a1c; }
  .ligne-nom .arrivee { font-size: 12px; color: #7d6a4c; }

  }
</style>
</head>

<script>
/* ==========================================================================
   Logique pure du jeu : pièces, villageois, niveaux, effet des catastrophes
   sur la maison, score. Aucun dessin ici.
   ========================================================================== */
var CN = (function () {
  'use strict';

  // Les 5 dangers : eau, vent, feu, secousses, chocs.
  var DANGERS = ['eau', 'vent', 'feu', 'secousse', 'choc'];

  // Pièces de la maison. cat : base, etage, toit ou protection.

    gouttiere:    { cat: 'protection', cout: { bois: 2 },            travail: 4, pts: 1 },
    paratonnerre: { cat: 'protection', cout: { pierre: 2, bois: 2 }, travail: 4, pts: 1 },
    volets:       { cat: 'protection', cout: { bois: 4 },            travail: 5, pts: 1 },
    muret:        { cat: 'protection', cout: { pierre: 6 },          travail: 6, pts: 1 },

  var ORDRE_PIECES = ['socle', 'fondation', 'pilotis', 'murBois', 'murPierre', 'toitPaille', 'toitBardeaux', 'toitTuiles',
    'gouttiere', 'paratonnerre', 'volets', 'muret', 'contreforts', 'charpente'];
  // Dangers contre lesquels chaque protection aide (pictogrammes du plan).
  var AIDE_PROTECTION = {
    gouttiere: ['eau'], paratonnerre: ['feu'], volets: ['vent', 'choc'], muret: ['eau', 'feu'],
    contreforts: ['secousse', 'vent'], charpente: ['choc', 'vent']
  };
  var PV_MAX = 3;

  // Petit village qui grandit avec les niveaux réussis (dessin sans texte).
  function dessinerVillage(reussis) {
    var c = $('village'), r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = Math.max(10, r.width * dpr); c.height = Math.max(10, r.height * dpr);
    var x = c.getContext('2d'), w = c.width, h = c.height;
    x.save(); x.scale(dpr, dpr);
    var W = w / dpr, H = h / dpr;
    var ciel = x.createLinearGradient(0, 0, 0, H); ciel.addColorStop(0, '#7fc1ef'); ciel.addColorStop(1, '#d6efff');
    x.fillStyle = ciel; x.fillRect(0, 0, W, H);
    x.fillStyle = '#ffe38a'; x.beginPath(); x.arc(W - 30, 24, 14, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#9fd17a'; x.beginPath(); x.ellipse(W * 0.3, H + 30, W * 0.5, 60, 0, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#86c060'; x.beginPath(); x.ellipse(W * 0.8, H + 34, W * 0.45, 62, 0, 0, Math.PI * 2); x.fill();
    var sol = H - 16;
    var n = Math.max(1, NIVEAUX.length), pas = (W - 20) / n;
    for (var i = 0; i < n; i++) {
      var cx = 10 + pas * (i + 0.5), haut = sol - (i % 2 ? 4 : 0);
      if (i < reussis) {
        var lw = Math.min(14, pas * 0.8), info = i % 3;
        x.fillStyle = ['#c58a4f', '#a7adb6', '#e9c48c'][info]; x.fillRect(cx - lw / 2, haut - 14, lw, 14);
        x.fillStyle = ['#d9573b', '#9b6334', '#e8c35a'][(i + 1) % 3];
        x.beginPath(); x.moveTo(cx - lw / 2 - 2, haut - 14); x.lineTo(cx, haut - 24); x.lineTo(cx + lw / 2 + 2, haut - 14); x.fill();
        x.fillStyle = '#5a3a12'; x.fillRect(cx - 2, haut - 7, 4, 7);
      } else {
        x.strokeStyle = 'rgba(80,60,30,.35)'; x.setLineDash([3, 3]); x.strokeRect(cx - 5, haut - 10, 10, 10); x.setLineDash([]);
      }
    }
    x.restore();
  }

  // ---------- Prévisions et choix de l'équipe ----------
  var niveauCourant = 0;
  var equipeChoisie = [];
  function montrerPrevision(n) {
    niveauCourant = n;
    var niv = NIVEAUX[n - 1];
    $('prev-titre').textContent = t('niveau', { n: n });
    $('prev-picto').innerHTML = icone(niv.p, 56);
    $('prev-cata-nom').textContent = t('cata.' + niv.c);

    CN.DANGERS.forEach(function (ty) {
      if (!d[ty]) return;
      var el = document.createElement('div'); el.className = 'danger';

    if (niv.minEtages) lignes.unshift(t('prev.minEtages', { n: niv.minEtages }));
    else lignes.unshift(t('prev.gagner'));
    var info = infoNiveau(n - 1);

    lignes.forEach(function (l) { var p = document.createElement('p'); p.textContent = l; obj.appendChild(p); });

    // Équipe : tous les villageois arrivés ; on en choisit « equipe ».
    var dispo = CN.villageoisDuNiveau(n), taille = Math.min(niv.equipe, dispo.length);
    var choixLibre = dispo.length > taille;
    var precedent = (sauve.equipe || []).filter(function (v) { return dispo.indexOf(v) >= 0; });
    equipeChoisie = choixLibre ? precedent.slice(0, taille) : dispo.slice(0, taille);
    if (choixLibre && equipeChoisie.length < taille) {
      dispo.forEach(function (v) { if (equipeChoisie.length < taille && equipeChoisie.indexOf(v) < 0) equipeChoisie.push(v); });
    }
    var eq = $('prev-equipe');
    eq.innerHTML = '';
    dispo.forEach(function (type) {
      var c = document.createElement('button');
      c.type = 'button'; c.className = 'carte-equipe' + (choixLibre ? '' : ' fixe');
      c.setAttribute('data-type', type);
      c.innerHTML = avatar(type);
      var b = document.createElement('b'); b.textContent = nomDe(type);
      var s = document.createElement('span'); s.textContent = t('competence.' + type);
      c.appendChild(b); c.appendChild(s);
      c.addEventListener('click', function () {
        initAudio();
        if (!choixLibre) { son('clic'); return; }
        var i = equipeChoisie.indexOf(type);
        if (i >= 0) equipeChoisie.splice(i, 1);
        else if (equipeChoisie.length < taille) equipeChoisie.push(type);

  function majEquipe(taille, choixLibre) {
    var cartes = $('prev-equipe').querySelectorAll('.carte-equipe');
    for (var i = 0; i < cartes.length; i++) {
      var type = cartes[i].getAttribute('data-type'), dedans = equipeChoisie.indexOf(type) >= 0;
      cartes[i].classList.toggle('choisi', dedans);
      cartes[i].setAttribute('aria-pressed', dedans ? 'true' : 'false');

    $('prev-equipe-titre').textContent = choixLibre

  }

  // ------------------------------------------------------------------------
  // État d'une partie
  // ------------------------------------------------------------------------
  // Monde de la scène (unités) : 800 de large, sol à 470.
  var W = 800, H = 560, SOL = 470;
  var LIEUX = { bois: 75, paille: 235, maison: 430, pierre: 728 };
  var DEPOT = [-150, 150, -122, 122, -178, 178];
  var CHANTIER = [-118, 118, -92, 92, -144, 144];
  var jeu = null;   // partie en cours

  function nouvellePartie(n) {
    var niv = NIVEAUX[n - 1];
    var equipe = equipeChoisie.slice();
    if (!equipe.length) equipe = CN.villageoisDuNiveau(n).slice(0, niv.equipe);
    var bonus = 0;
    equipe.forEach(function (ty) { bonus += VILL[ty].temps || 0; });
    jeu = {
      n: n, niv: niv, phase: 'prep', vitesse: 1,
      temps: niv.temps + bonus, tempsTotal: niv.temps + bonus,
      stock: { bois: 0, paille: 0, pierre: 0 },
      maison: CN.maisonVide(), file: [], enCours: null,
      villageois: equipe.map(function (type, i) {
        return { type: type, nom: nomDe(type), x: LIEUX.maison + DEPOT[i], dir: 1, job: null, porte: 0, porteRes: null, etat: 'attente', minuteur: 0, pas: Math.random() * 6, i: i, outil: 0 };
      }),
      choisi: 0, particules: [], coups: [], tCata: 0, indexCoup: 0, finCoups: 0,
      crue: 0, crueAff: 0, lave: 0, laveAff: 0, neige: 0, secousse: 0, flash: 0, eclairs: [], projectiles: [],
      tornadeX: -200, ventAff: 0, curseur: -1, reparerAttente: 0, aideMinuteur: 0, aide: '', fin: false,
      alerte: false, objectifs: CN.objectifs(niv), reparatrice: equipe.indexOf('reparatrice') >= 0,
      feuMecanique: niv.coups.some(function (g) { var e = CN.EFFETS[g[0]]; return e.flamme || e.double; }),
      tutoCata: false, temps0: 0, sansConstructeur: 0
    };
    sauve.equipe = equipe; enregistrer();
  }

  // ------------------------------------------------------------------------
  // Interface du jeu (cartes des villageois, métiers, plan, file)
  // ------------------------------------------------------------------------
  function construireInterface() {

    $('hud-nuage').style.left = '';

    var st = $('stocks'); st.innerHTML = '';

      if (r === 'pierre' && n < 4) return;
      var s = document.createElement('div'); s.className = 'stock'; s.id = 'stock-' + r;
      s.setAttribute('aria-label', t('res.' + r));
      s.innerHTML = icone(r, 26) + '<b></b>';

    });

      c.innerHTML = avatar(v.type) + '<span class="badge"></span>';

    });
    // Plan
    var pl = $('plan'); pl.innerHTML = '';
    CN.piecesDuNiveau(n).forEach(function (p) {
      var def = PIECES[p];

      cout += '</span>';
      var forts = '<span class="forts">';
      var fortsListe = def.res ? CN.DANGERS.filter(function (d) { return def.res[d] >= 3; }) : (CN.AIDE_PROTECTION[p] || []);
      fortsListe.slice(0, 3).forEach(function (d) { forts += icone(d, 13); });
      forts += '</span>';

      var nm = document.createElement('span'); nm.className = 'nom-p'; nm.textContent = t('piece.' + p);

  function texteCout(cout) {
    return Object.keys(cout).map(function (r) { return t('cout.' + r, { n: cout[r] }); }).join(', ');
  }

  // Projection de la maison : construite + en cours + en file.
  function projection() {
    var p = { base: !!jeu.maison.base, etages: jeu.maison.etages.length, toit: !!jeu.maison.toit, prot: {} };
    Object.keys(jeu.maison.prot).forEach(function (k) { p.prot[k] = true; });
    var liste = (jeu.enCours ? [jeu.enCours.type] : []).concat(jeu.file);
    liste.forEach(function (ty) {
      var c = PIECES[ty].cat;
      if (c === 'base') p.base = true; else if (c === 'etage') p.etages++; else if (c === 'toit') p.toit = true; else p.prot[ty] = true;
    });
    return p;
  }
  // Peut-on commander cette pièce ? Renvoie '' si oui, sinon la clé du message.
  function raisonRefus(ty) {
    var p = projection(), c = PIECES[ty].cat;
    if (jeu.file.length >= 4) return 'refus.file';
    if (c === 'base') return p.base ? 'refus.base' : '';
    if (!p.base) return 'refus.sansBase';
    if (c === 'etage') return p.etages >= jeu.niv.etages ? 'refus.etages' : '';
    if (c === 'toit') return p.toit ? 'refus.toit' : (p.etages < 1 ? 'refus.sansEtage' : '');
    return p.prot[ty] ? 'refus.prot' : '';
  }
  function commander(ty) {
    if (!jeu || jeu.phase !== 'prep') return;
    var r = raisonRefus(ty);
    if (r) { son('refus'); message(t(r, { n: jeu.niv.etages })); return; }
    jeu.file.push(ty);
    son('ajout');
    majInterface(true);
  }
  function annulerFile(index) {
    if (!jeu || jeu.phase !== 'prep') return;
    if (index < 0) {
      // Annuler la pièce en cours : les matériaux reviennent.
      if (!jeu.enCours) return;
      var cout = PIECES[jeu.enCours.type].cout;
      Object.keys(cout).forEach(function (r) { jeu.stock[r] += cout[r]; });
      jeu.enCours = null;
    } else jeu.file.splice(index, 1);
    // Retirer ce qui n'a plus de sens (toit sans étage, étage sans base…).
    nettoyerFile();
    son('clic');
    majInterface(true);
  }
  function nettoyerFile() {
    var garde = [], base = !!jeu.maison.base || (jeu.enCours && PIECES[jeu.enCours.type].cat === 'base');
    var et = jeu.maison.etages.length + (jeu.enCours && PIECES[jeu.enCours.type].cat === 'etage' ? 1 : 0);
    jeu.file.forEach(function (ty) {
      var c = PIECES[ty].cat;
      if (c === 'base') { base = true; garde.push(ty); }
      else if (!base) return;
      else if (c === 'etage') { et++; garde.push(ty); }
      else if (c === 'toit') { if (et >= 1) garde.push(ty); }
      else garde.push(ty);
    });
    jeu.file = garde;
  }

  function choisirVillageois(i) {
    if (!jeu || jeu.phase !== 'prep' || i < 0 || i >= jeu.villageois.length) return;
    jeu.choisi = i; son('clic'); majInterface(true);
  }
  function donnerMetier(i, m) {
    if (!jeu || jeu.phase !== 'prep') return;
    var v = jeu.villageois[i];
    if (!v) return;
    if (v.job === m) { son('clic'); return; }
    v.job = m; v.etat = 'aller'; v.minuteur = 0;
    son('choix');
    // Le villageois suivant sans métier est choisi tout seul.
    for (var k = 1; k <= jeu.villageois.length; k++) {
      var j = (i + k) % jeu.villageois.length;
      if (!jeu.villageois[j].job) { jeu.choisi = j; break; }
    }
    majInterface(true);
  }

  var dernierEtatInterface = '';
  function majInterface(forcer) {
    if (!jeu) return;
    // Stocks
    ['bois', 'paille', 'pierre'].forEach(function (r) {
      var s = $('stock-' + r);
      if (!s) return;
      var b = s.querySelector('b'), v = nombre(jeu.stock[r]);
      if (b.textContent !== v) {
        b.textContent = v;
        s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop');
      }
    });
    var cle = JSON.stringify([jeu.choisi, jeu.villageois.map(function (v) { return v.job; }), jeu.file, jeu.enCours && jeu.enCours.type,
      jeu.maison.base && jeu.maison.base.type, jeu.maison.etages.length, !!jeu.maison.toit, Object.keys(jeu.maison.prot), jeu.phase, jeu.stock]);
    // Jauge de la pièce en cours (souvent)
    var jauge = document.querySelector('#file .encours .jauge i');
    if (jauge && jeu.enCours) jauge.style.width = Math.round(100 * jeu.enCours.fait / PIECES[jeu.enCours.type].travail) + '%';
    if (!forcer && cle === dernierEtatInterface) return;
    dernierEtatInterface = cle;
    // Cartes des villageois
    var cartes = document.querySelectorAll('#villageois .carte-v');
    for (var i = 0; i < cartes.length; i++) {
      var v = jeu.villageois[i];
      cartes[i].classList.toggle('choisi', i === jeu.choisi);
      cartes[i].classList.toggle('libre', !v.job && jeu.phase === 'prep');
      cartes[i].querySelector('.badge').innerHTML = v.job ? icone(v.job, 18) : '';
      cartes[i].setAttribute('aria-label', t('vill.aria', { nom: v.nom, metier: t('vill.' + v.type), job: v.job ? t('metier.' + v.job) : t('metier.aucun') }));
      cartes[i].setAttribute('aria-pressed', i === jeu.choisi ? 'true' : 'false');
    }
    // Métiers du villageois choisi
    var vc = jeu.villageois[jeu.choisi];
    var mets = document.querySelectorAll('#metiers .metier');
    for (i = 0; i < mets.length; i++) {
      var actif = vc && vc.job === mets[i].getAttribute('data-metier');
      mets[i].classList.toggle('actif', actif);
      mets[i].setAttribute('aria-pressed', actif ? 'true' : 'false');
    }
    // Plan : pièces possibles
    var pieces = document.querySelectorAll('#plan .piece-btn');
    for (i = 0; i < pieces.length; i++) {
      var ty = pieces[i].getAttribute('data-piece');
      var r = raisonRefus(ty);
      pieces[i].hidden = r === 'refus.base' || r === 'refus.toit' || r === 'refus.prot';
      pieces[i].disabled = !!r || jeu.phase !== 'prep';
      var cout = PIECES[ty].cout, assez = true;
      Object.keys(cout).forEach(function (k) { if (jeu.stock[k] < cout[k]) assez = false; });
      pieces[i].classList.toggle('cher', !assez);
    }
    // File de construction
    var f = $('file'); f.innerHTML = '';
    var ajouterPuce = function (ty, index, enCours) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'puce' + (enCours ? ' encours' : '');
      b.innerHTML = icone(ty, 30) + (enCours ? '<span class="jauge"><i style="width:' + Math.round(100 * jeu.enCours.fait / PIECES[ty].travail) + '%"></i></span>' : '');
      if (!enCours && index === 0 && !jeu.enCours) {
        var c2 = PIECES[ty].cout, ok = true;
        Object.keys(c2).forEach(function (k) { if (jeu.stock[k] < c2[k]) ok = false; });
        if (!ok) b.classList.add('manque');
      }
      b.setAttribute('aria-label', t(enCours ? 'file.encours' : 'file.attente', { nom: t('piece.' + ty) }));
      // Annuler demande un 2e toucher (pour ne rien perdre par erreur).
      var conf = jeu.confirmer;
      var aConfirmer = conf && conf.index === index && conf.jusqua > performance.now();
      if (aConfirmer) b.classList.add('confirmer');
      b.addEventListener('click', function () {
        initAudio();
        var c = jeu.confirmer;
        if (c && c.index === index && c.jusqua > performance.now()) { jeu.confirmer = null; annulerFile(index); return; }
        jeu.confirmer = { index: index, jusqua: performance.now() + 2500 };
        son('clic');
        message(t('file.confirmer'));
        majInterface(true);
      });
      f.appendChild(b);
    };
    if (jeu.enCours) ajouterPuce(jeu.enCours.type, -1, true);
    jeu.file.forEach(function (ty, k) { ajouterPuce(ty, k, false); });
  }

  // ------------------------------------------------------------------------
  // Déroulement : préparation
  // ------------------------------------------------------------------------
  function demarrerNiveau(n) {
    nouvellePartie(n);
    montrer('ecran-jeu');
    construireInterface();
    redimensionner();
    var cle = jeu.niv.nouveau;
    var tj = TUTOS_JEU[cle];
    if (tj && !sauve.tutos['jeu-' + cle]) {
      jeu.tutoEnCours = true;
      setTimeout(function () { lancerTuto(tj, 'jeu-' + cle, function () { if (jeu) jeu.tutoEnCours = false; }); }, 300);
    }
  }

  function majPrep(dt) {
    var j = jeu;
    j.temps -= dt;
    if (j.temps <= 10 && !j.alerte) { j.alerte = true; son('cloche'); message(t('alerte')); }
    // Démarrer la pièce suivante si les matériaux sont là.
    if (!j.enCours && j.file.length) {
      var ty = j.file[0], cout = PIECES[ty].cout, ok = true;
      Object.keys(cout).forEach(function (r) { if (j.stock[r] < cout[r]) ok = false; });
      if (ok) {
        Object.keys(cout).forEach(function (r) { j.stock[r] -= cout[r]; });
        j.enCours = { type: ty, fait: 0 };
        j.file.shift();
      }
    }
    // Villageois
    var constructeurs = 0;
    j.villageois.forEach(function (v) { if (majVillageois(v, dt)) constructeurs++; });
    if (j.enCours && constructeurs === 0) j.sansConstructeur += dt; else j.sansConstructeur = 0;
    // Pièce terminée
    if (j.enCours && j.enCours.fait >= PIECES[j.enCours.type].travail) {
      var ty2 = j.enCours.type;
      var p = CN.ajouterPiece(j.maison, ty2);
      if (p) p.yAff = null;
      j.enCours = null;
      son('piece');
      var c = centreMaison();
      for (var i = 0; i < 18; i++) particule(c.x + (Math.random() - 0.5) * 200, c.y + (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 160, -Math.random() * 160, 0.9, 'etoile', '#ffd54a', 5);
      majInterface(true);
    }
    // Petits conseils
    j.aide = '';
    if (j.villageois.every(function (v) { return !v.job; })) j.aide = t('aide.metier');
    else if (!j.enCours && !j.file.length && !j.maison.toit) j.aide = t('aide.plan');
    else if (j.sansConstructeur > 2.5) j.aide = t('aide.constructeur');
    else if (!j.enCours && j.file.length) j.aide = t('aide.materiaux');
    if (j.temps <= 0) commencerCatastrophe();
  }

  // Un villageois travaille. Renvoie true s'il construit en ce moment.
  function majVillageois(v, dt) {
    var j = jeu, def = VILL[v.type], vitesse = def.vitesse || 110;
    v.pas += dt * 8;
    var aller = function (x) {
      var d = x - v.x;
      if (Math.abs(d) < 4) { v.x = x; return true; }
      v.dir = d > 0 ? 1 : -1;
      v.x += v.dir * Math.min(Math.abs(d), vitesse * dt);
      return false;
    };
    v.marche = false;
    if (!v.job) { aller(LIEUX.maison + DEPOT[v.i]); return false; }
    if (v.porte > 0) {
      v.marche = true;
      if (aller(LIEUX.maison + DEPOT[v.i])) {
        j.stock[v.porteRes] += v.porte;
        particuleTexte(v.x, SOL - 70, t('plus', { n: v.porte }), '#2d7a31');
        v.porte = 0; v.porteRes = null; son('depot');
        majInterface(true);
      }
      return false;
    }
    if (v.job === 'construire') {
      var xc = LIEUX.maison + CHANTIER[v.i];
      if (!aller(xc)) { v.marche = true; return false; }
      if (!j.enCours) { v.etat = 'attente'; return false; }
      v.etat = 'travail';
      var rythme = def.construit || 1;
      if (def.protections && PIECES[j.enCours.type].cat === 'protection') rythme = def.protections;
      j.enCours.fait += rythme * dt;
      v.outil += dt;
      if (v.outil > 0.45) { v.outil = 0; son('marteau'); particule(LIEUX.maison + CHANTIER[v.i] * 0.7, SOL - 40 - Math.random() * 60, (Math.random() - 0.5) * 60, -60, 0.4, 'poussiere', '#d8c09a', 4); }
      v.dir = CHANTIER[v.i] < 0 ? 1 : -1;
      return true;
    }
    // Récolte
    var xs = LIEUX[v.job] + (v.i - 2) * 9;
    if (v.etat !== 'recolte') {
      if (!aller(xs)) { v.marche = true; return false; }
      v.etat = 'recolte'; v.minuteur = 0;
    }
    var bon = def.res === v.job;
    v.minuteur += dt;
    v.outil += dt;
    if (v.outil > 0.5) { v.outil = 0; son(v.job === 'bois' ? 'hache' : v.job === 'pierre' ? 'pioche' : 'faucille'); }
    if (v.minuteur >= (bon ? 1.0 : 2.4)) {
      v.porte = def.charge || (bon ? 4 : 2);
      v.porteRes = v.job; v.etat = 'aller';
    }
    return false;
  }

  // ------------------------------------------------------------------------
  // Déroulement : la catastrophe
  // ------------------------------------------------------------------------
  function commencerCatastrophe() {
    var j = jeu;
    j.temps = 0;
    j.phase = 'abri';
    j.tAbri = 0;
    if (j.enCours) { particuleTexte(LIEUX.maison, SOL - 300, t('inacheve'), '#d9534f'); j.enCours = null; }
    j.file = [];
    son('cloche');
    $('panneau-cata').hidden = false;
    $('metiers').style.visibility = 'hidden'; $('plan').style.visibility = 'hidden';
    // Les commandes de construction se cachent : le clavier sert maintenant à la maison.
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    $('cata-titre').textContent = t('cata.arrive', { nom: t('cata.' + j.niv.c) });
    $('hud-sec').textContent = '';
    $('hud-barre').style.width = '0%';
    $('hud-nuage').style.right = '';
    $('hud-nuage').style.left = '4px';
    var aides = [t('cata.abri')];
    if (j.feuMecanique) aides.push(t('cata.aideFeu'));
    if (j.reparatrice) aides.push(t('cata.aideReparer', { nom: nomDe('reparatrice') }));
    $('cata-aide').textContent = aides.join(' ');
    var liste = CN.listeCoups(j.niv), ecart = j.niv.ecart || 1.3;
    j.coups = liste.map(function (c, i) { return { effet: c[0], f: c[1], t: 1.8 + i * ecart, lance: false, fait: false }; });
    j.finCoups = 1.8 + liste.length * ecart + 1.2;
    j.tCata = 0;
    majInterface(true);
  }
  function majAbri(dt) {
    var j = jeu;
    j.tAbri += dt;
    j.villageois.forEach(function (v) {
      var d = LIEUX.maison - v.x;
      v.marche = Math.abs(d) > 4;
      if (v.marche) { v.dir = d > 0 ? 1 : -1; v.x += v.dir * Math.min(Math.abs(d), 260 * dt); }
      v.pas += dt * 10;
    });
    if (j.tAbri > 1.3) {
      j.phase = 'cata';
      if ((j.reparatrice || j.feuMecanique)) {
        var cle = j.feuMecanique ? (j.niv.feuRapide ? 'feuVent' : 'feu') : 'reparer';
        if (TUTOS_CATA[cle] && !sauve.tutos['cata-' + cle]) {
          j.tutoEnCours = true;
          lancerTuto(TUTOS_CATA[cle], 'cata-' + cle, function () { if (jeu) jeu.tutoEnCours = false; });
        }
      }
    }
  }
  function majCata(dt) {
    var j = jeu;
    j.tCata += dt;
    j.coups.forEach(function (c) {
      if (!c.lance && j.tCata >= c.t - 0.55) { c.lance = true; annoncerCoup(c); }
      if (!c.fait && j.tCata >= c.t) { c.fait = true; frapper(c); }
    });
    // Flammes
    var periode = j.niv.feuRapide ? 1.1 : 1.6;
    CN.couches(j.maison).forEach(function (p, idx, liste) {
      if (!p.feu) return;
      p.tFeu += dt;
      if (Math.random() < dt * 14) { var r = rectPiece(p); if (r) particule(r.x + Math.random() * r.w, r.y + r.h * 0.4, (Math.random() - 0.5) * 30, -60 - Math.random() * 50, 0.8, 'braise', '#ffb347', 3); }
      if (p.tFeu >= periode) {
        p.tFeu = 0;
        // Le vent pousse le feu vers la pièce du dessus.
        if (j.niv.feuRapide && !p.propage) {
          p.propage = true;
          var dessus = liste[idx + 1];
          if (dessus && !dessus.feu && CN.resistance(dessus.type, 'feu') < 2) { dessus.feu = 3; dessus.tFeu = 0; dessus.propage = false; }
        }
        var rAvant = rectPiece(p);
        var detruit = CN.brulure(j.maison, p);
        p.coup = 0.3;
        if (detruit) { effetChute(p, rAvant); }
        else son('feu');
      }
    });
    var reste = j.coups.filter(function (c) { return !c.fait; }).length;
    var i = $('cata-progres').firstElementChild;
    i.style.width = Math.round(100 * (j.coups.length - reste) / Math.max(1, j.coups.length)) + '%';
    var enFeu = CN.couches(j.maison).some(function (p) { return p.feu > 0; });
    if (j.tCata >= j.finCoups && (!enFeu || j.tCata > j.finCoups + 8)) finirNiveau();
    if (j.reparerAttente > 0) j.reparerAttente -= dt;
  }

  // Effet visuel annoncé un peu avant le coup (projectile, éclair qui se prépare…).
  function annoncerCoup(c) {
    var j = jeu, cible = cibleVisuelle(c.effet);
    if (c.effet === 'grele' || c.effet === 'grelemur' || c.effet === 'debris' || c.effet === 'cendre') {
      for (var i = 0; i < 6; i++) j.projectiles.push({ x: cible.x + (Math.random() - 0.5) * 220 - 120, y: -40 - Math.random() * 60, tx: cible.x + (Math.random() - 0.5) * 160, ty: cible.y + (Math.random() - 0.5) * 40, t: 0, d: 0.55, type: c.effet === 'debris' ? 'debris' : c.effet === 'cendre' ? 'cendre' : 'grele' });
    } else if (c.effet === 'bombe') {
      j.projectiles.push({ x: 640, y: 190, tx: cible.x, ty: cible.y, t: 0, d: 0.55, type: 'bombe', arc: true });
    } else if (c.effet === 'braise') {
      for (var k = 0; k < 5; k++) j.projectiles.push({ x: 40 + Math.random() * 60, y: SOL - 120 - Math.random() * 80, tx: cible.x + (Math.random() - 0.5) * 120, ty: cible.y, t: 0, d: 0.55, type: 'braise', arc: true });
    } else if (c.effet === 'tornade') {
      j.tornadeX = 900;
    }
  }
  // Point visé par un effet (pour les dessins).
  function cibleVisuelle(effet) {
    var e = CN.EFFETS[effet], m = jeu.maison, lay = disposition();
    var haut = lay.length ? lay[lay.length - 1] : null;
    if (e.zone === 'toit' || e.zone === 'haut') return haut ? { x: LIEUX.maison, y: haut.y - haut.h * 0.6 } : { x: LIEUX.maison, y: SOL - 20 };
    if (e.zone === 'sol') return { x: LIEUX.maison, y: SOL - 20 };
    return { x: LIEUX.maison, y: SOL - (m.etages.length ? 120 : 30) };
  }

  function frapper(c) {
    var j = jeu, e = CN.EFFETS[c.effet];
    // Ambiance du coup
    switch (c.effet) {
      case 'pluie': case 'averse': son('pluie'); for (var i = 0; i < 40; i++) goutte(true); break;
      case 'foudre': son('tonnerre'); j.flash = 1; j.eclairs.push({ x: j.maison.prot.paratonnerre ? LIEUX.maison + 70 : LIEUX.maison, vie: 0.35, sur: !!j.maison.prot.paratonnerre }); break;
      case 'vent': case 'rafale': case 'tornade': son('vent'); j.ventAff = 1.2; break;
      case 'grele': case 'grelemur': case 'cendre': son('grele'); break;
      case 'debris': son('choc'); break;
      case 'crue': son('eau'); j.crue = Math.min(4, j.crue + 1); break;
      case 'secousse': son('grondement'); j.secousse = 0.9; break;
      case 'braise': son('feu'); break;
      case 'feusol': son('feu'); break;
      case 'neige': son('vent'); j.neige = Math.min(6, j.neige + c.f); break;
      case 'lave': son('lave'); j.lave = Math.min(4, j.lave + 1); break;
      case 'bombe': son('choc'); j.secousse = 0.3; break;
    }
    // Position des pièces avant le coup (une pièce détruite n'est plus dans la maison ensuite).
    var avant = CN.couches(j.maison).map(function (p) { return { piece: p, r: rectPiece(p) }; });
    var rectAvant = function (p) { for (var k = 0; k < avant.length; k++) if (avant[k].piece === p) return avant[k].r; return null; };
    var evts = CN.appliquerCoup(j.maison, c.effet, c.f);
    evts.forEach(function (ev) {
      if (ev.paratonnerre) { son('bouclier'); etincelles(LIEUX.maison + 70, cibleVisuelle('foudre').y - 40, '#ffd54a'); return; }
      var p = ev.piece, r = rectAvant(p) || rectPiece(p) || { x: LIEUX.maison - 100, y: SOL - 100, w: 200, h: 80 };
      if (ev.bloque) { bouclier(r); return; }
      if (ev.allume) { son('feu'); return; }
      if (ev.degats) {
        p.coup = 0.35;
        son(ev.detruit ? 'chute' : 'choc');
        for (var k = 0; k < 10; k++) particule(r.x + Math.random() * r.w, r.y + Math.random() * r.h, (Math.random() - 0.5) * 200, -Math.random() * 150, 0.8, 'eclat', couleurPiece(p.type), 5);
        if (ev.detruit) effetChute(p, r);
      }
    });
    if (e.zone === 'sol' && c.effet === 'feusol') { /* flammes au sol dessinées par l'ambiance */ }
  }
  function effetChute(p, r) {
    r = r || rectPiece(p) || { x: LIEUX.maison - 100, y: SOL - 100, w: 200, h: 80 };
    son('chute');
    jeu.secousse = Math.max(jeu.secousse, 0.4);
    for (var k = 0; k < 26; k++) particule(r.x + Math.random() * r.w, r.y + Math.random() * r.h, (Math.random() - 0.5) * 260, -Math.random() * 120, 1.2, 'eclat', couleurPiece(p.type), 7);
    for (k = 0; k < 14; k++) particule(r.x + Math.random() * r.w, SOL - 6, (Math.random() - 0.5) * 120, -Math.random() * 40, 1.1, 'poussiere', '#cbb894', 10);
  }
  function bouclier(r) {
    son('bouclier');
    jeu.particules.push({ x: r.x + r.w / 2, y: r.y + r.h / 2, vx: 0, vy: 0, vie: 0.5, vieMax: 0.5, type: 'bouclier', couleur: '#8fd0ff', taille: Math.max(r.w, r.h) * 0.55 });
  }
  function etincelles(x, y, couleur) {
    for (var k = 0; k < 14; k++) particule(x, y, (Math.random() - 0.5) * 220, (Math.random() - 0.5) * 220, 0.5, 'etoile', couleur, 4);
  }

  // Toucher la maison pendant la catastrophe : éteindre ou réparer.
  function agirSurPiece(p) {
    var j = jeu;
    if (!p) return;
    var r = rectPiece(p);
    if (p.feu > 0) {
      p.feu = 0; p.tFeu = 0;
      son('eteindre');
      for (var k = 0; k < 16; k++) particule(r.x + Math.random() * r.w, r.y + Math.random() * r.h * 0.5, (Math.random() - 0.5) * 120, -Math.random() * 100, 0.6, 'eau', '#8fd0ff', 4);
      return;
    }
    if (p.pv >= CN.PV_MAX) { son('clic'); return; }
    if (!j.reparatrice) { son('refus'); message(t(jeu.n >= 8 ? 'cata.sansReparatrice' : 'cata.pasReparer', { nom: nomDe('reparatrice') })); return; }
    if (j.reparerAttente > 0) return;
    var mat = Object.keys(PIECES[p.type].cout)[0];
    if (j.stock[mat] < 1) { son('refus'); message(t('cata.manque', { res: t('res.' + mat) })); return; }
    j.stock[mat] -= 1; p.pv += 1; j.reparerAttente = 0.6;
    son('reparer');
    etincelles(r.x + r.w / 2, r.y + r.h / 2, '#7dff9a');
    majInterface(true);
  }

  // ------------------------------------------------------------------------
  // Fin du niveau
  // ------------------------------------------------------------------------
  function finirNiveau() {
    var j = jeu;
    if (j.fin) return;
    j.fin = true; j.phase = 'fin';
    var tient = CN.maisonTient(j.maison, j.niv);
    var sc = CN.score(j.maison), o = j.objectifs;
    var etoiles = tient ? 1 + (sc >= o.deux ? 1 : 0) + (sc >= o.trois ? 1 : 0) : 0;
    var info = infoNiveau(j.n - 1);
    var record = tient && sc > (info.r || 0);
    if (tient) {
      sauve.niv[j.n - 1] = { e: Math.max(info.e || 0, etoiles), r: Math.max(info.r || 0, sc) };
      sauve.debloque = Math.max(sauve.debloque, Math.min(NIVEAUX.length, j.n + 1));
      enregistrer();
      for (var k = 0; k < 70; k++) particule(Math.random() * W, -20 - Math.random() * 100, (Math.random() - 0.5) * 80, 60 + Math.random() * 120, 3, 'confetti', ['#ff8a3d', '#ffd54a', '#4cb050', '#3d7fd1', '#d9534f'][k % 5], 6);
    }
    setTimeout(function () { montrerBilan(tient, sc, etoiles, record, info.r || 0); }, tient ? 1200 : 1500);
  }
  function montrerBilan(tient, sc, etoiles, record, ancien) {
    if (!jeu) return;
    var j = jeu, b = $('bilan');
    b.hidden = false;
    son(tient ? 'victoire' : 'defaite');
    $('bilan-titre').textContent = t(tient ? 'bilan.bravo' : 'bilan.ohnon');
    var msg;
    if (tient) msg = j.n === NIVEAUX.length ? t('bilan.fin') : t('bilan.tient', { nom: t('cata.' + j.niv.c) });
    else if (!j.maison.toit) msg = t('bilan.sansToit');
    else if (!j.maison.etages.length) msg = t('bilan.sansEtage');
    else msg = t('bilan.pasAssez', { n: j.niv.minEtages || 1 });
    $('bilan-message').textContent = msg;
    var debout = CN.couches(j.maison).length + Object.keys(j.maison.prot).length;
    $('bilan-detail').textContent = t('bilan.detail', { n: debout, deux: j.objectifs.deux, trois: j.objectifs.trois });
    var r = $('bilan-record');
    r.classList.toggle('battu', record);
    r.textContent = record ? t('bilan.record') : (ancien ? t('bilan.ancien', { n: ancien }) : '');
    var et = $('bilan-etoiles');
    et.innerHTML = '';
    for (var k = 0; k < 3; k++) {
      var s = document.createElement('span');
      s.innerHTML = icone(k < etoiles ? 'etoile' : 'etoileVide', 58);
      et.appendChild(s);
      (function (svg, plein, delai) {
        if (!plein) { svg.classList.add('vide'); return; }
        setTimeout(function () { svg.classList.add('vole'); son('etoile'); }, delai);
      })(s.firstChild, k < etoiles, 500 + k * 380);
    }
    // Score qui défile
    var sEl = $('bilan-score'), v = 0, pas = Math.max(1, Math.ceil(sc / 25));
    sEl.textContent = t('bilan.points', { n: 0 });
    var anim = setInterval(function () {
      v = Math.min(sc, v + pas);
      sEl.textContent = t('bilan.points', { n: v });
      if (v >= sc) clearInterval(anim);
    }, 40);
    var dernier = j.n >= NIVEAUX.length;
    $('btn-suivant').hidden = !tient || dernier;
    $('btn-reessayer').hidden = tient;
    // Les boutons répondent après un court instant : le bilan ne se ferme pas par erreur.
    bilanOuvertA = performance.now();
    setTimeout(function () { var bt = tient && !dernier ? $('btn-suivant') : (tient ? $('btn-rejouer') : $('btn-reessayer')); try { bt.focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 50);
  }

  // ------------------------------------------------------------------------

    $('pause').hidden = false;

    try { $('btn-reprendre').focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }

    $('pause').hidden = true;
    if (audio) { try { audio.resume(); } catch (e) { /* rien */ } }
    dernierTemps = 0;

  }

  // ---------- La maison ----------
  function dessinerMaison(x, dt, tps) {
    var j = jeu, m = j.maison, lay = disposition(), cx = LIEUX.maison;
    // Muret (des deux côtés) et contreforts, derrière ou devant
    if (m.prot.muret) {
      [-1, 1].forEach(function (s) {
        var mx = cx + s * 140 - 22;
        x.fillStyle = '#9aa0aa'; x.fillRect(mx, SOL - 44, 44, 44);
        x.strokeStyle = '#6b717b'; x.lineWidth = 2;
        x.beginPath(); x.moveTo(mx, SOL - 22); x.lineTo(mx + 44, SOL - 22); x.moveTo(mx + 22, SOL - 44); x.lineTo(mx + 22, SOL - 22); x.moveTo(mx + 11, SOL - 22); x.lineTo(mx + 11, SOL); x.moveTo(mx + 33, SOL - 22); x.lineTo(mx + 33, SOL); x.stroke();

    }
    // Couches
    lay.forEach(function (c, i) {
      var p = c.piece;

      if (j.ventAff > 0 && c.type && PIECES[c.type].cat !== 'base') dx += Math.sin(tps * 20) * 1.5 * (i + 1) * j.ventAff;
      x.save();
      x.translate(cx + dx, yb);
      if (c.fantome) {
        x.globalAlpha = 0.35;
        dessinerCouche(x, c.type, c.w, c.h, null, m.etages.length === 0);
        x.globalAlpha = 1;
        // Remplissage du chantier
        var k = j.enCours ? j.enCours.fait / PIECES[j.enCours.type].travail : 0;
        x.save(); x.beginPath(); x.rect(-c.w / 2 - 20, -c.h * k, c.w + 40, c.h * k); x.clip();
        dessinerCouche(x, c.type, c.w, c.h, null, m.etages.length === 0);
        x.restore();
        x.setLineDash([8, 6]); x.strokeStyle = '#fff'; x.lineWidth = 3; x.strokeRect(-c.w / 2, -c.h, c.w, c.h); x.setLineDash([]);
        // Échafaudage
        x.strokeStyle = '#8a5a2b'; x.lineWidth = 4;
        x.beginPath(); x.moveTo(-c.w / 2 - 14, 0); x.lineTo(-c.w / 2 - 14, -c.h); x.moveTo(c.w / 2 + 14, 0); x.lineTo(c.w / 2 + 14, -c.h);
        x.moveTo(-c.w / 2 - 22, -c.h / 2); x.lineTo(-c.w / 2 - 6, -c.h / 2); x.moveTo(c.w / 2 + 6, -c.h / 2); x.lineTo(c.w / 2 + 22, -c.h / 2); x.stroke();
      } else {
        var premierEtage = PIECES[c.type].cat === 'etage' && m.etages[0] === p;
        dessinerCouche(x, c.type, c.w, c.h, p, premierEtage);
        if (PIECES[c.type].cat === 'etage' && m.prot.volets) volets(x, c.h);
        if (PIECES[c.type].cat === 'toit' && m.prot.charpente) {
          x.strokeStyle = '#5a3a12'; x.lineWidth = 5;
          x.beginPath(); x.moveTo(-c.w / 2 + 16, -6); x.lineTo(c.w / 2 - 16, -6); x.moveTo(0, -6); x.lineTo(0, -c.h + 18); x.moveTo(-50, -6); x.lineTo(0, -c.h + 18); x.lineTo(50, -6); x.stroke();
        }
        if (PIECES[c.type].cat === 'toit' && j.neige > 0) {
          x.fillStyle = '#ffffff';
          var hn = 4 + j.neige * 4;
          x.beginPath(); x.moveTo(-c.w / 2, 0); x.lineTo(0, -c.h); x.lineTo(c.w / 2, 0); x.lineTo(c.w / 2 - hn, -hn * 0.3); x.lineTo(0, -c.h + hn); x.lineTo(-c.w / 2 + hn, -hn * 0.3); x.fill();

    var etages = lay.filter(function (c) { return c.piece && PIECES[c.type].cat === 'etage'; });
    var toit = lay.filter(function (c) { return c.piece && PIECES[c.type].cat === 'toit'; })[0];

      x.beginPath(); x.moveTo(cx - 140, SOL); x.lineTo(cx - 95, yb2 - hc + 20); x.moveTo(cx + 140, SOL); x.lineTo(cx + 95, yb2 - hc + 20); x.stroke();

      x.strokeStyle = '#7d8592'; x.lineWidth = 5;
      x.beginPath(); x.moveTo(cx + 70, ytop + (toit ? 34 : 0)); x.lineTo(cx + 70, ytop - 50); x.stroke();
      x.fillStyle = '#ffd54a'; x.beginPath(); x.arc(cx + 70, ytop - 52, 7, 0, Math.PI * 2); x.fill();
    }
  }
  function dessinerCouche(x, type, w, h, p, porte) {
    var hw = w / 2;
    if (type === 'socle') {
      x.fillStyle = '#b07a43'; x.fillRect(-hw, -h, w, h);
      x.strokeStyle = '#7a4a24'; x.lineWidth = 3;
      for (var i = 1; i < 6; i++) { x.beginPath(); x.moveTo(-hw + i * w / 6, -h); x.lineTo(-hw + i * w / 6, 0); x.stroke(); }
    } else if (type === 'fondation') {
      x.fillStyle = '#9aa0aa'; x.fillRect(-hw, -h, w, h);
      x.strokeStyle = '#6b717b'; x.lineWidth = 2;
      x.beginPath(); x.moveTo(-hw, -h / 2); x.lineTo(hw, -h / 2); x.stroke();
      for (i = 0; i < 7; i++) { var bx = -hw + i * w / 7 + (i % 2) * 10; x.beginPath(); x.moveTo(bx, -h); x.lineTo(bx, -h / 2); x.moveTo(bx + 14, -h / 2); x.lineTo(bx + 14, 0); x.stroke(); }
    } else if (type === 'pilotis') {
      x.fillStyle = '#8a5a2b';
      [-hw + 12, -hw / 3, hw / 3, hw - 12].forEach(function (px) { x.fillRect(px - 6, -h + 12, 12, h - 12); });
      x.fillStyle = '#b07a43'; x.fillRect(-hw, -h, w, 14);
      x.strokeStyle = '#7a4a24'; x.lineWidth = 3;
      x.beginPath(); x.moveTo(-hw + 12, -h + 40); x.lineTo(-hw / 3, -h + 14); x.moveTo(hw - 12, -h + 40); x.lineTo(hw / 3, -h + 14); x.stroke();
    } else if (type === 'murBois' || type === 'murPierre') {
      var bois = type === 'murBois';
      x.fillStyle = bois ? '#c58a4f' : '#a7adb6'; x.fillRect(-hw, -h, w, h);
      x.strokeStyle = bois ? '#94612f' : '#737a84'; x.lineWidth = 2;
      if (bois) { for (i = 1; i < 9; i++) { x.beginPath(); x.moveTo(-hw + i * w / 9, -h); x.lineTo(-hw + i * w / 9, 0); x.stroke(); } }
      else {
        for (var r = 1; r < 5; r++) { x.beginPath(); x.moveTo(-hw, -r * h / 5); x.lineTo(hw, -r * h / 5); x.stroke(); }
        for (r = 0; r < 5; r++) for (i = 0; i < 6; i++) { var px2 = -hw + i * w / 6 + (r % 2) * (w / 12); x.beginPath(); x.moveTo(px2, -r * h / 5); x.lineTo(px2, -(r + 1) * h / 5); x.stroke(); }
      }
      // Fenêtres et porte
      fenetre(x, -hw + 34, -h + 18, 34, 30, bois);
      if (porte) { x.fillStyle = '#6a4520'; arrondi(x, 4, -56, 34, 56, 6); x.fill(); x.fillStyle = '#ffd54a'; x.beginPath(); x.arc(32, -28, 3, 0, Math.PI * 2); x.fill(); }
      else fenetre(x, 10, -h + 18, 34, 30, bois);
      if (!porte) fenetre(x, hw - 68, -h + 18, 34, 30, bois);
      else fenetre(x, hw - 60, -h + 18, 34, 30, bois);
    } else if (PIECES[type] && PIECES[type].cat === 'toit') {
      var coul = { toitPaille: ['#e8c35a', '#b48a24'], toitBardeaux: ['#9b6334', '#6a4020'], toitTuiles: ['#d9573b', '#a83a24'] }[type];
      x.fillStyle = coul[0];
      x.beginPath(); x.moveTo(-hw, 0); x.lineTo(0, -h); x.lineTo(hw, 0); x.closePath(); x.fill();
      x.strokeStyle = coul[1]; x.lineWidth = 3;
      x.save(); x.beginPath(); x.moveTo(-hw, 0); x.lineTo(0, -h); x.lineTo(hw, 0); x.closePath(); x.clip();

      else { for (r = 0; r < 6; r++) { for (i = -10; i < 10; i++) { x.beginPath(); x.arc(i * 18 + (r % 2) * 9, -r * h / 6 - 2, 9, 0, Math.PI); x.stroke(); } } }

  function fenetre(x, a, b, w, h, bois) {

    x.fillStyle = 'rgba(255,255,255,.6)'; x.fillRect(a + 3, b + 3, 8, h - 6);
    x.strokeStyle = bois ? '#6a4520' : '#585e68'; x.lineWidth = 3; x.strokeRect(a, b, w, h);
    x.beginPath(); x.moveTo(a + w / 2, b); x.lineTo(a + w / 2, b + h); x.moveTo(a, b + h / 2); x.lineTo(a + w, b + h / 2); x.stroke();
  }
  function volets(x, h) {
    x.fillStyle = '#3f9b4a';
    var pos = [-95 + 34, 10, 95 - 68];
    pos.forEach(function (a) { x.fillRect(a - 11, -h + 16, 10, 34); x.fillRect(a + 35, -h + 16, 10, 34); });
  }
  function fissures(x, p, c) {
    if (p.pv >= CN.PV_MAX) return;
    x.strokeStyle = 'rgba(40,20,10,.75)'; x.lineWidth = 3;
    var seed = p.num * 7.3, hw = c.w / 2;

    for (var i = 0; i < nb; i++) {

  }
  function flammes(x, c, tps) {
    for (var i = 0; i < 4; i++) {
      var fx2 = -c.w / 2 + 25 + i * (c.w - 50) / 3, hf = 34 + Math.sin(tps * 14 + i * 2) * 10;

      x.quadraticCurveTo(fx2 + 18, -c.h * 0.4 - hf * 0.5, fx2 + 16, -c.h * 0.4 + 10); x.fill();
    }
  }

  // ---------- Un villageois ----------
  function villageois(x, v, choisi) {
    var def = VILL[v.type], bob = v.marche ? Math.abs(Math.sin(v.pas)) * 4 : 0;
    var travail = v.etat === 'travail' || v.etat === 'recolte';
    x.save();
    x.translate(v.x, SOL - bob);
    if (choisi) {
      x.fillStyle = 'rgba(255,138,61,.45)'; x.beginPath(); x.ellipse(0, bob + 2, 26, 8, 0, 0, Math.PI * 2); x.fill();
      x.strokeStyle = '#ff8a3d'; x.lineWidth = 3; x.stroke();
    } else { x.fillStyle = 'rgba(0,0,0,.18)'; x.beginPath(); x.ellipse(0, bob + 2, 18, 5, 0, 0, Math.PI * 2); x.fill(); }
    x.scale(v.dir, 1);
    // Jambes
    var jl = v.marche ? Math.sin(v.pas) * 8 : 0;
    x.strokeStyle = '#4a3a2a'; x.lineWidth = 6; x.lineCap = 'round';
    x.beginPath(); x.moveTo(-5, -18); x.lineTo(-5 + jl, 0); x.moveTo(5, -18); x.lineTo(5 - jl, 0); x.stroke();
    // Corps
    x.fillStyle = def.couleur; arrondi(x, -13, -46, 26, 30, 10); x.fill();
    if (v.type === 'porteur') { x.fillStyle = '#8a5a2b'; arrondi(x, -22, -44, 11, 22, 4); x.fill(); }
    // Bras et outil
    var ang = travail ? Math.sin(performance.now() / 90) * 0.9 : (v.marche ? Math.sin(v.pas) * 0.4 : 0);
    x.save(); x.translate(8, -38); x.rotate(-0.6 + ang);
    x.strokeStyle = def.peau; x.lineWidth = 6; x.beginPath(); x.moveTo(0, 0); x.lineTo(14, 0); x.stroke();
    outilDessin(x, v.type, v.job);
    x.restore();
    // Tête
    x.fillStyle = def.peau; x.beginPath(); x.arc(0, -56, 12, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#2f2414'; x.beginPath(); x.arc(4, -58, 1.8, 0, Math.PI * 2); x.arc(9, -58, 1.8, 0, Math.PI * 2); x.fill();
    x.strokeStyle = '#2f2414'; x.lineWidth = 1.6; x.beginPath(); x.arc(6, -53, 3.5, 0.2, Math.PI - 0.2); x.stroke();
    // Chapeau
    x.fillStyle = def.chapeau;
    x.beginPath(); x.moveTo(-13, -62); x.quadraticCurveTo(0, -80, 13, -62); x.fill();
    x.fillRect(-15, -64, 30, 5);
    if (v.type === 'guetteuse') { x.strokeStyle = '#ffd54a'; x.lineWidth = 3; x.beginPath(); x.moveTo(-8, -70); x.quadraticCurveTo(-18, -86, -4, -88); x.stroke(); }
    x.restore();
    // Ce qu'il porte
    if (v.porte > 0) {
      x.save(); x.translate(v.x, SOL - 96 - bob);
      chargeDessin(x, v.porteRes);
      x.restore();
    }
    // Nom du villageois choisi
    if (choisi) {
      x.font = '800 20px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
      var tw = x.measureText(v.nom).width + 16, yN = SOL - (v.porte ? 128 : 100);
      x.fillStyle = 'rgba(255,248,232,.95)'; arrondi(x, v.x - tw / 2, yN - 13, tw, 26, 10); x.fill();
      x.fillStyle = '#23324f'; x.fillText(v.nom, v.x, yN + 1);
    }
  }
  function outilDessin(x, type, job) {
    if (job === 'construire' || type === 'reparatrice' || type === 'maconne') {
      x.fillStyle = '#8a5a2b'; x.fillRect(12, -14, 4, 16);
      x.fillStyle = '#6f7782'; x.fillRect(6, -20, 16, 8);
    } else if (job === 'bois' || type === 'bucheron') {
      x.fillStyle = '#8a5a2b'; x.fillRect(12, -16, 4, 20);
      x.fillStyle = '#9aa0aa'; x.beginPath(); x.moveTo(16, -16); x.lineTo(26, -20); x.lineTo(26, -8); x.lineTo(16, -10); x.fill();
    } else if (job === 'pierre' || type === 'tailleuse') {
      x.fillStyle = '#8a5a2b'; x.fillRect(12, -16, 4, 20);
      x.strokeStyle = '#9aa0aa'; x.lineWidth = 4; x.beginPath(); x.moveTo(4, -12); x.quadraticCurveTo(14, -24, 26, -12); x.stroke();
    } else if (job === 'paille') {
      x.strokeStyle = '#9aa0aa'; x.lineWidth = 3; x.beginPath(); x.moveTo(14, 0); x.lineTo(14, -10); x.arc(22, -10, 8, Math.PI, Math.PI * 1.9); x.stroke();
