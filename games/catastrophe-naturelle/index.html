  function chargeDessin(x, res) {
    if (res === 'bois') { x.fillStyle = '#9b6334'; arrondi(x, -18, -8, 36, 16, 8); x.fill(); x.fillStyle = '#e3b77c'; x.beginPath(); x.ellipse(18, 0, 4, 8, 0, 0, Math.PI * 2); x.fill(); }
    else if (res === 'paille') { x.strokeStyle = '#e2b23c'; x.lineWidth = 4; for (var i = -2; i <= 2; i++) { x.beginPath(); x.moveTo(0, 12); x.lineTo(i * 6, -14); x.stroke(); } x.fillStyle = '#b07a2a'; x.fillRect(-8, 0, 16, 5); }
    else { x.fillStyle = '#9aa0aa'; x.beginPath(); x.moveTo(-16, 10); x.lineTo(-12, -6); x.lineTo(0, -12); x.lineTo(14, -8); x.lineTo(18, 8); x.closePath(); x.fill(); x.fillStyle = '#c3c8cf'; x.beginPath(); x.moveTo(-12, -6); x.lineTo(0, -12); x.lineTo(4, 0); x.fill(); }
  }

  function dessinerParticules(x, dt) {
    var j = jeu;
    j.particules = j.particules.filter(function (p) {
      p.vie -= dt;
      if (p.vie <= 0) return false;
      var a = p.vie / p.vieMax;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.type === 'eclat' || p.type === 'etoile' || p.type === 'eau') p.vy += 500 * dt;
      if (p.type === 'confetti') { p.vx += Math.sin(p.vie * 5) * 20 * dt; }
      if ((p.type === 'goutte' || p.type === 'grele') && p.y > SOL) { if (p.type === 'grele') p.vy = -p.vy * 0.3; else return false; }
      if (p.type === 'eclat' && p.y > SOL + 8) { p.y = SOL + 8; p.vy = 0; p.vx *= 0.8; }
      x.globalAlpha = Math.min(1, a * 2);
      switch (p.type) {
        case 'goutte': x.strokeStyle = p.couleur; x.lineWidth = 2; x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(p.x + p.vx * 0.03, p.y + p.vy * 0.03); x.stroke(); break;
        case 'vent': x.strokeStyle = p.couleur; x.lineWidth = 3; x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(p.x + p.taille, p.y); x.stroke(); break;
        case 'texte':
          x.font = '800 ' + p.taille + 'px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
          x.lineWidth = 4; x.strokeStyle = '#fff'; x.strokeText(p.texte, p.x, p.y); x.fillStyle = p.couleur; x.fillText(p.texte, p.x, p.y); break;
        case 'bouclier':
          x.strokeStyle = p.couleur; x.lineWidth = 6; x.globalAlpha = a;
          x.beginPath(); x.arc(p.x, p.y, p.taille * (1.2 - a * 0.4), 0, Math.PI * 2); x.stroke(); break;
        case 'fumee': x.fillStyle = p.couleur; x.globalAlpha = a * 0.6; x.beginPath(); x.arc(p.x, p.y, p.taille * (2 - a), 0, Math.PI * 2); x.fill(); break;
        case 'confetti': x.fillStyle = p.couleur; x.save(); x.translate(p.x, p.y); x.rotate(p.vie * 6); x.fillRect(-p.taille / 2, -p.taille / 4, p.taille, p.taille / 2); x.restore(); break;
        case 'etoile':
          x.fillStyle = p.couleur; x.beginPath();
          for (var k = 0; k < 5; k++) { var an = k * Math.PI * 0.4 - Math.PI / 2; x.lineTo(p.x + Math.cos(an) * p.taille, p.y + Math.sin(an) * p.taille); an += Math.PI * 0.2; x.lineTo(p.x + Math.cos(an) * p.taille * 0.45, p.y + Math.sin(an) * p.taille * 0.45); }
          x.fill(); break;
        case 'grele': x.fillStyle = p.couleur; x.strokeStyle = '#7fb6db'; x.lineWidth = 1.5; x.beginPath(); x.arc(p.x, p.y, p.taille, 0, Math.PI * 2); x.fill(); x.stroke(); break;
        default: x.fillStyle = p.couleur; x.beginPath(); x.arc(p.x, p.y, p.taille, 0, Math.PI * 2); x.fill();
      }
      x.globalAlpha = 1;
      return true;
    });
  }

  // ------------------------------------------------------------------------
  // Écran titre : dessin animé du village (sert aussi de jaquette)
  // ------------------------------------------------------------------------
  var titreCanvas = $('titre-canvas'), tctx = titreCanvas.getContext('2d'), titreVue = { w: 1, h: 1, dpr: 1 };
  function redimTitre() {
    var r = titreCanvas.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    titreVue.w = Math.max(1, r.width); titreVue.h = Math.max(1, r.height); titreVue.dpr = dpr;
    titreCanvas.width = Math.round(titreVue.w * dpr); titreCanvas.height = Math.round(titreVue.h * dpr);
  }
  var maisonTitre = null;
  function dessinerTitre(tps) {
    var x = tctx, w = titreVue.w, h = titreVue.h;
    x.setTransform(titreVue.dpr, 0, 0, titreVue.dpr, 0, 0);
    var ciel = x.createLinearGradient(0, 0, 0, h);
    ciel.addColorStop(0, '#3d4c6e'); ciel.addColorStop(0.45, '#7a9cc4'); ciel.addColorStop(1, '#f2c48a');
    x.fillStyle = ciel; x.fillRect(0, 0, w, h);
    var s = Math.min(w / 560, h / 640);
    x.save();
    x.translate(w / 2 - 280 * s, h * (h > w ? 0.79 : 0.86) - 470 * s);
    x.scale(s, s);
    // Volcan à droite
    x.fillStyle = '#7a4e36';
    x.beginPath(); x.moveTo(330, 470); x.lineTo(450, 170); x.lineTo(500, 170); x.lineTo(660, 470); x.fill();
    x.fillStyle = '#ff7a2f'; x.beginPath(); x.moveTo(450, 170); x.quadraticCurveTo(475, 185, 500, 170); x.quadraticCurveTo(475, 160, 450, 170); x.fill();
    x.fillStyle = '#ff9a3d'; x.beginPath(); x.moveTo(462, 175); x.quadraticCurveTo(455, 240, 430, 300); x.lineTo(445, 300); x.quadraticCurveTo(470, 240, 480, 176); x.fill();
    for (var i = 0; i < 5; i++) { x.fillStyle = 'rgba(120,120,120,' + (0.55 - i * 0.08) + ')'; x.beginPath(); x.arc(475 + Math.sin(tps + i) * 8 + i * 6, 150 - i * 26 - (tps * 10 % 26), 18 + i * 6, 0, Math.PI * 2); x.fill(); }
    // Nuage d'orage à gauche, éclair, pluie
    x.fillStyle = '#4a5163';
    x.beginPath(); x.arc(60, 150, 40, 0, Math.PI * 2); x.arc(110, 125, 50, 0, Math.PI * 2); x.arc(165, 150, 40, 0, Math.PI * 2); x.rect(60, 150, 105, 40); x.fill();
    x.strokeStyle = 'rgba(143,208,255,.8)'; x.lineWidth = 3;
    for (i = 0; i < 12; i++) { var dx = 40 + i * 12, dy = 200 + ((tps * 260 + i * 37) % 120); x.beginPath(); x.moveTo(dx, dy); x.lineTo(dx - 5, dy + 14); x.stroke(); }
    if (Math.sin(tps * 1.7) > 0.93) { x.fillStyle = 'rgba(255,255,230,.25)'; x.fillRect(-500, -500, 2000, 2000); }
    x.strokeStyle = '#ffd54a'; x.lineWidth = 6; x.lineJoin = 'round';
    x.beginPath(); x.moveTo(120, 170); x.lineTo(100, 215); x.lineTo(122, 215); x.lineTo(98, 268); x.stroke();
    // Collines et sol
    x.fillStyle = '#7fbf5c'; x.beginPath(); x.moveTo(-400, 470); x.quadraticCurveTo(120, 360, 300, 440); x.quadraticCurveTo(480, 380, 960, 470); x.fill();
    x.fillStyle = '#6fae4c'; x.fillRect(-400, 470, 1400, 16);
    x.fillStyle = '#8a5a34'; x.fillRect(-400, 486, 1400, 400);
    // Arbres
    for (i = 0; i < 3; i++) {
      var tx = -20 + i * 40;
      x.fillStyle = '#7a4a24'; x.fillRect(tx - 5, 430, 10, 40);
      x.fillStyle = i % 2 ? '#2e7d3a' : '#3c9447';
      x.beginPath(); x.moveTo(tx - 28, 440); x.lineTo(tx + Math.sin(tps * 2 + i) * 4, 340); x.lineTo(tx + 28, 440); x.fill();
    }
    // Maison en chantier (fondation, deux étages, toit de tuiles et échafaudage)
    x.save(); x.translate(280, 470);
    dessinerCouche(x, 'fondation', 214, 36, null, false);
    x.translate(0, -36); dessinerCouche(x, 'murPierre', 190, 80, null, true);
    x.translate(0, -80); dessinerCouche(x, 'murBois', 190, 80, null, false);
    x.save(); x.globalAlpha = 0.85; x.translate(0, -80); dessinerCouche(x, 'toitTuiles', 232, 88, null, false); x.restore();
    x.strokeStyle = '#8a5a2b'; x.lineWidth = 5;
    x.beginPath(); x.moveTo(110, 116); x.lineTo(110, -84); x.moveTo(132, 116); x.lineTo(132, -84); x.moveTo(104, 40); x.lineTo(138, 40); x.moveTo(104, -40); x.lineTo(138, -40); x.stroke();
    x.restore();
    // Villageois au travail
    if (!maisonTitre) {
      maisonTitre = [
        { type: 'bucheron', x: 120, dir: 1, job: 'bois', porte: 2, porteRes: 'bois', marche: true, pas: 0, etat: '' },
        { type: 'maconne', x: 175, dir: 1, job: 'construire', porte: 0, marche: false, pas: 0, etat: 'travail' },
        { type: 'porteur', x: 440, dir: -1, job: 'pierre', porte: 3, porteRes: 'pierre', marche: true, pas: 0, etat: '' },
        { type: 'reparatrice', x: 390, dir: -1, job: 'construire', porte: 0, marche: false, pas: 0, etat: 'travail' }
      ];
    }
    // Même dessin que dans la scène (sol à 470 dans les deux cas).
    maisonTitre.forEach(function (v) { v.pas = tps * 8; villageois(x, v, false); });
    x.restore();
  }

  // ------------------------------------------------------------------------
  // Boucle principale
  // ------------------------------------------------------------------------
  var dernierTemps = 0;
  function boucle(maintenant) {
    requestAnimationFrame(boucle);
    var dt = dernierTemps ? Math.min(0.05, (maintenant - dernierTemps) / 1000) : 0;
    dernierTemps = maintenant;
    if (ecranActuel === 'ecran-titre') { dessinerTitre(maintenant / 1000); return; }
    if (ecranActuel !== 'ecran-jeu' || !jeu) return;
    var fige = enPause() || !!tuto || jeu.tutoEnCours;
    if (fige) { dessinerScene(0); return; }
    if (jeu.phase === 'prep') { majPrep(dt * jeu.vitesse); majInterface(false); majHud(); }
    else if (jeu.phase === 'abri') majAbri(dt);
    else if (jeu.phase === 'cata') majCata(dt);
    dessinerScene(dt * (jeu.phase === 'prep' ? jeu.vitesse : 1));
  }
  function majHud() {
    var j = jeu;
    if (j.phase !== 'prep') return;
    var k = Math.max(0, j.temps / j.tempsTotal);
    $('hud-barre').style.width = (k * 100) + '%';
    var boite = $('hud-temps').getBoundingClientRect();
    $('hud-nuage').style.right = Math.max(0, (1 - k) * (boite.width - 36)) + 'px';
    $('hud-sec').textContent = t('secondes', { n: Math.max(0, Math.ceil(j.temps)) });
    $('hud-temps').classList.toggle('urgent', j.temps <= 10);
    $('btn-vitesse').classList.toggle('actif', j.vitesse > 1);
  }

  // ------------------------------------------------------------------------
  // Toucher la scène : choisir un villageois, l'envoyer quelque part, agir sur la maison
  // ------------------------------------------------------------------------
  canvas.addEventListener('pointerdown', function (e) {
    initAudio();
    if (!jeu || enPause() || tuto) return;
    var r = canvas.getBoundingClientRect();
    var wx = (e.clientX - r.left - vue.ox) / vue.s, wy = (e.clientY - r.top - vue.oy) / vue.s;
    if (jeu.phase === 'cata') {
      var lay = disposition();
      for (var i = lay.length - 1; i >= 0; i--) {
        var c = lay[i];
        if (c.piece && Math.abs(wx - LIEUX.maison) <= c.w / 2 + 16 && wy <= c.y + 10 && wy >= c.y - c.h - 10) { agirSurPiece(c.piece); return; }
      }
      return;
    }
    if (jeu.phase !== 'prep') return;
    // Un villageois ?
    var meilleur = -1, dmin = 1e9;
    jeu.villageois.forEach(function (v, i) {
      var d = Math.hypot(wx - v.x, (wy - (SOL - 40)) * 0.6);
      if (d < 44 && d < dmin) { dmin = d; meilleur = i; }
    });
    if (meilleur >= 0) { choisirVillageois(meilleur); return; }
    // Un lieu ?
    var lieu = null;
    if (wx < 165) lieu = 'bois';
    else if (wx < 310) lieu = 'paille';
    else if (wx > 640 && jeu.n >= 4) lieu = 'pierre';
    else if (wx > 300 && wx < 560) lieu = 'construire';
    if (lieu) donnerMetier(jeu.choisi, lieu);
  });

  // ------------------------------------------------------------------------
  // Clavier
  // ------------------------------------------------------------------------
  document.addEventListener('keydown', function (ev) {
    var cible = ev.target;
    // Copie de l'événement avec une touche toujours définie.
    var e = { key: ev.key || '', code: ev.code || '', preventDefault: function () { ev.preventDefault(); } };
    if (cible && (cible.tagName === 'INPUT' || cible.tagName === 'TEXTAREA')) {
      if (e.key === 'Enter' && ecranActuel === 'ecran-noms') validerNoms();
      return;
    }
    initAudio();
    if (tuto) { if (e.key === 'Escape') finirTuto(); else if (e.key === ' ' || e.key === 'Enter' || e.key.indexOf('Arrow') === 0) { e.preventDefault(); etapeTuto(); } return; }
    if (ecranActuel !== 'ecran-jeu' || !jeu) {
      if (e.key === 'Escape') {
        if (ecranActuel === 'ecran-prevision') montrerNiveaux();
        else if (ecranActuel === 'ecran-niveaux') montrer('ecran-titre');
      }
      return;
    }
    if (!$('bilan').hidden) return;
    if (e.key === 'Escape' || e.code === 'KeyP') { e.preventDefault(); if (enPause()) reprendre(); else mettrePause(); return; }
    if (enPause()) return;
    var surBouton = cible && cible.tagName === 'BUTTON';
    if (jeu.phase === 'prep') {
      var chiffre = /^(Digit|Numpad)([1-6])$/.exec(e.code);
      if (chiffre) { choisirVillageois(parseInt(chiffre[2], 10) - 1); e.preventDefault(); return; }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        var nv = jeu.villageois.length;
        choisirVillageois((jeu.choisi + (e.key === 'ArrowLeft' ? nv - 1 : 1)) % nv);
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        var mets = CN.metiersDuNiveau(jeu.n), v = jeu.villageois[jeu.choisi];
        var i = mets.indexOf(v.job);
        i = i < 0 ? 0 : (i + (e.key === 'ArrowUp' ? mets.length - 1 : 1)) % mets.length;
        donnerMetier(jeu.choisi, mets[i]);
        return;
      }
      if (e.key === ' ' && !surBouton) { e.preventDefault(); basculerVitesse(); }
    } else if (jeu.phase === 'cata') {
      var liste = CN.couches(jeu.maison);
      if (!liste.length) return;
      if (e.key.indexOf('Arrow') === 0) {
        e.preventDefault();
        var monte = e.key === 'ArrowUp' || e.key === 'ArrowRight';
        if (jeu.curseur < 0) jeu.curseur = liste.length - 1;
        else jeu.curseur = (jeu.curseur + (monte ? 1 : liste.length - 1)) % liste.length;
        son('clic');
      } else if ((e.key === ' ' || e.key === 'Enter') && !surBouton) {
        e.preventDefault();
        if (jeu.curseur < 0 || jeu.curseur >= liste.length) jeu.curseur = liste.length - 1;
        agirSurPiece(liste[jeu.curseur]);
      }
    }
  });
  function basculerVitesse() {
    if (!jeu || jeu.phase !== 'prep') return;
    jeu.vitesse = jeu.vitesse > 1 ? 1 : 2;
    son('clic'); majHud();
  }

  // ------------------------------------------------------------------------
  // Boutons
  // ------------------------------------------------------------------------
  function surClic(id, f) { $(id).addEventListener('click', function (e) { initAudio(); f(e); }); }
  surClic('btn-jouer', function () {
    son('choix');
    if (!sauve.noms) montrerNoms('niveaux'); else montrerNiveaux();
  });
  surClic('btn-noms-ok', validerNoms);
  surClic('btn-niv-accueil', function () { son('clic'); montrer('ecran-titre'); });
  surClic('btn-niv-noms', function () { son('clic'); montrerNoms('niveaux'); });
  surClic('btn-prev-retour', function () { son('clic'); montrerNiveaux(); });
  surClic('btn-partir', function () { son('choix'); demarrerNiveau(niveauCourant); });
  surClic('btn-pause', function () { son('clic'); mettrePause(); });
  surClic('btn-reprendre', reprendre);
  surClic('btn-recommencer', function () { reprendre(); demarrerNiveau(jeu.n); });
  surClic('btn-pause-niveaux', function () { reprendre(); jeu = null; montrerNiveaux(); });
  surClic('btn-pause-accueil', function () { reprendre(); jeu = null; montrer('ecran-titre'); });
  surClic('btn-vitesse', basculerVitesse);
  var sons = document.querySelectorAll('.btn-son');
  for (var i = 0; i < sons.length; i++) sons[i].addEventListener('click', basculerSon);
  var bilanOuvertA = 0;
  function bilanPret() { return jeu && performance.now() - bilanOuvertA > 1200; }
  surClic('btn-suivant', function () { if (!bilanPret()) return; var n = jeu.n + 1; jeu = null; son('choix'); montrerPrevision(n); });
  surClic('btn-reessayer', function () { if (!bilanPret()) return; son('choix'); demarrerNiveau(jeu.n); });
  surClic('btn-rejouer', function () { if (!bilanPret()) return; son('choix'); demarrerNiveau(jeu.n); });
  surClic('btn-bilan-niveaux', function () { if (!bilanPret()) return; jeu = null; son('clic'); montrerNiveaux(); });
  $('tuto').addEventListener('click', function (e) { if (e.target.id === 'tuto-passer') finirTuto(); else etapeTuto(); });

  // Icônes des boutons ronds
  $('btn-niv-accueil').innerHTML = icone('maison', 28);
  $('btn-niv-noms').innerHTML = icone('gens', 30);
  $('btn-prev-retour').innerHTML = icone('retour', 28);
  majBoutonsSon();

  // L'écran caché met le jeu en pause.
  document.addEventListener('visibilitychange', function () { if (document.hidden) mettrePause(); });
  window.addEventListener('resize', function () {
    redimensionner();
    if (ecranActuel === 'ecran-niveaux') dessinerVillage(sauve.niv.filter(function (x) { return x && x.e; }).length);
  });

  redimensionner();
  requestAnimationFrame(boucle);
})();
</script>
