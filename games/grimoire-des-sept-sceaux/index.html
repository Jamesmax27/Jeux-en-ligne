<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grimoire des Sept Sceaux</title>
<style>
  /* ---------- Base : fond magique, pas de défilement de la page ---------- */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#120d22;
    font-family:system-ui,sans-serif;color:#f6efe2;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
  button:focus-visible{outline:3px solid #ffd76a;outline-offset:2px}
  .cache{display:none!important}
  #jeu{position:fixed;inset:0;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
    background:
      radial-gradient(1px 1px at 12% 14%,#fff 99%,transparent),radial-gradient(1px 1px at 78% 8%,#fff 99%,transparent),
      radial-gradient(1.5px 1.5px at 44% 30%,#e8d8ff 99%,transparent),radial-gradient(1px 1px at 90% 40%,#fff 99%,transparent),
      radial-gradient(1px 1px at 6% 52%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 64% 20%,#fff 99%,transparent),
      radial-gradient(ellipse at 50% 120%,#4a2a7a 0,transparent 65%),
      linear-gradient(#1a1233,#22183f 60%,#1a1230)}
  .ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;flex:none}
  .ico .p{fill:currentColor;stroke:none}

  /* ---------- Barre du haut ---------- */
  #barre{height:46px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px;background:rgba(0,0,0,.35);font-weight:700;font-size:15px}
  #barre .pv{color:#ff7a8a}#barre .or{color:#f3c55b}#barre .et{color:#ffd76a}#barre .niv{color:#cbbcf5;font-size:13px}
  #rels{flex:1;display:flex;gap:2px;overflow:hidden;min-width:0;height:44px;align-items:center}
  #rels .rel{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:17px;flex:none}
  .rond{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.1);flex:none}

  #ecran{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}
  .btn{min-height:48px;padding:10px 18px;border-radius:14px;font-weight:800;font-size:17px;color:#2a1640;
    background:linear-gradient(#ffe39a,#f3b94b);box-shadow:0 4px 0 #a8721e,0 6px 14px rgba(0,0,0,.35);transition:transform .1s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8721e}
  .btn.v{color:#fff;background:linear-gradient(#9b7cf0,#6a46c9);box-shadow:0 4px 0 #43288c,0 6px 14px rgba(0,0,0,.35)}
  .btn.g{color:#fff;background:linear-gradient(#5b5577,#3d3858);box-shadow:0 4px 0 #262238}
  .btn[disabled]{opacity:.45;filter:grayscale(.7)}

  /* ---------- Accueil ---------- */
  .accueil{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
  .titre{font-size:clamp(32px,10vw,50px);font-weight:900;line-height:1.02;margin:0;
    background:linear-gradient(#fff3c4,#f3c55b 55%,#d98a2b);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 #4a2a7a) drop-shadow(0 0 18px rgba(243,197,91,.35))}
  .regle{font-size:17px;max-width:340px;line-height:1.35;margin:0;color:#e9defc}
  .record{font-size:14px;color:#cbbcf5}
  .livre svg{width:min(70vw,260px);height:auto;animation:flotte 4s ease-in-out infinite}
  @keyframes flotte{50%{transform:translateY(-8px)}}

  /* ---------- Carte du monde ---------- */
  .carteMonde{flex:1;display:flex;flex-direction:column;min-height:0}
  .acte{text-align:center;padding:8px 6px 2px;font-weight:900;font-size:19px;color:#ffe39a}
  .sceaux{display:flex;justify-content:center;gap:6px;padding:4px 0 6px}
  .sceaux .s{width:30px;height:30px;color:#6d5a99}
  .sceaux .s.ok{color:#ffd76a;filter:drop-shadow(0 0 6px #ffd76a)}
  #chemin{position:relative;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 6px 20px;scrollbar-width:none}
  .rang{display:flex;justify-content:center;gap:14px;position:relative}
  .lien{width:4px;height:18px;margin:2px auto;background:repeating-linear-gradient(#8d7bc4 0 4px,transparent 4px 8px);opacity:.7}
  .noeud{display:flex;flex-direction:column;align-items:center;gap:3px;width:86px;font-size:12.5px;font-weight:700;color:#e9defc}
  .noeud .b{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;color:#fff;border:3px solid rgba(255,255,255,.5);box-shadow:0 4px 10px rgba(0,0,0,.4)}
  .noeud.fait .b{filter:grayscale(.2);border-color:#ffd76a}
  .noeud.passe{opacity:.32}
  .noeud.futur{opacity:.55}
  .noeud.actif .b{animation:pulse 1.2s ease-in-out infinite;border-color:#fff}
  @keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 0 8px rgba(255,227,154,.25)}}
  .basCarte{display:flex;gap:10px;justify-content:center;padding:8px;flex:none}

  /* ---------- Combat ---------- */
  #combat{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
  #zEn{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
  #ennemis{display:flex;justify-content:center;align-items:flex-end;gap:4px;width:100%;padding:0 4px}
  .en{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border-radius:14px;border:2px solid transparent;position:relative;transition:opacity .3s}
  .en.cible{border-color:rgba(255,227,154,.7);background:rgba(255,227,154,.07)}
  .en .art{position:relative;line-height:0}
  .en .art svg{width:100%;height:auto}
  .en .nom{font-size:12.5px;font-weight:800;text-align:center;line-height:1.1}
  .intent{min-height:30px;display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;background:rgba(0,0,0,.45);font-weight:900;font-size:15px;flex-wrap:wrap;justify-content:center}
  .intent .ia{color:#ff8a7a}.intent .ib{color:#8cc8ff}.intent .ix{color:#d6b4ff}.intent .ic{color:#ffd76a}
  .pvbar{position:relative;width:100%;max-width:120px;height:16px;border-radius:9px;background:#3a2238;overflow:visible}
  .pvbar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(#ff8a9a,#d9465c);transition:width .3s}
  .pvbar span{position:absolute;inset:0;text-align:center;font-size:11.5px;font-weight:800;line-height:16px;text-shadow:0 1px 2px #000}
  .pvbar b{position:absolute;left:-12px;top:-5px;min-width:26px;height:26px;padding:0 3px;border-radius:9px;background:#3b7fd0;font-size:12.5px;line-height:26px;text-align:center;border:2px solid #bfe0ff}
  .pvbar b:empty{display:none}
  .sts{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:20px}
  .st{display:inline-flex;align-items:center;gap:1px;padding:1px 4px;border-radius:8px;background:rgba(0,0,0,.5);font-size:12px;font-weight:800}
  .en.libre{pointer-events:none;animation:libre 1.4s ease-out forwards}
  @keyframes libre{0%{transform:none}30%{transform:translateY(6px) scale(1.05)}100%{transform:translateY(-120px) scale(.8);opacity:0}}
  .en.parti{opacity:0;pointer-events:none}
  .en.attaque{animation:fonce .35s ease-out}
  @keyframes fonce{50%{transform:translateY(22px) scale(1.06)}}
  .secoue{animation:secoue .35s}
  @keyframes secoue{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .aura{transform-box:fill-box;transform-origin:center;animation:tourne 6s linear infinite}
  @keyframes tourne{to{transform:rotate(360deg)}}

  #info{flex:none;min-height:44px;margin:0 6px;padding:5px 10px;border-radius:12px;background:rgba(0,0,0,.4);font-size:14px;line-height:1.25;display:flex;align-items:center;justify-content:center;text-align:center}
  #info b{color:#ffe39a}
  #zJ{flex:none;display:flex;align-items:center;gap:6px;padding:6px}
  .joueur{flex:1;display:flex;align-items:center;gap:4px;min-width:0;border-radius:12px;padding:2px}
  .joueur svg{width:46px;height:46px;flex:none}
  .joueur .col{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
  .joueur .pvbar{max-width:none;margin-left:12px;width:auto}
  #orbe{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:18px;color:#3b2200;flex:none;
    background:radial-gradient(circle at 35% 30%,#fff6c8,#ffcf4d 55%,#d98a2b);box-shadow:0 0 14px rgba(255,207,77,.6)}
  #orbe.vide{filter:grayscale(.8);box-shadow:none}
  .tas{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;color:#cbbcf5;min-width:44px;min-height:44px;justify-content:center}
  #btnFin{padding:8px 12px;font-size:15px;min-height:48px;line-height:1.05}
  #zMain{flex:none;height:136px;position:relative}
  #main{position:absolute;inset:0 4px}

  /* ---------- Cartes ---------- */
  .carte{position:absolute;width:82px;height:116px;border-radius:11px;padding:4px;display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(#fbf3e2,#e9dcc3);color:#2a1a10;border:3px solid var(--c);box-shadow:0 4px 10px rgba(0,0,0,.45);
    transition:transform .18s,left .18s,opacity .2s;transform-origin:50% 100%}
  .carte .cout{position:absolute;left:-7px;top:-7px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;
    background:radial-gradient(circle at 35% 30%,#fff6c8,#ffcf4d 60%,#d98a2b);border:2px solid #7a4a10;color:#3b2200}
  .carte .nomc{font-size:10.5px;font-weight:900;text-align:center;line-height:1.05;min-height:22px;display:flex;align-items:center;justify-content:center;padding:0 1px 0 15px;width:100%}
  .carte .art{width:100%;flex:1;border-radius:7px;display:grid;place-items:center;font-size:24px;color:#fff;background:var(--c);margin:2px 0;min-height:0}
  .carte .res{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;font-size:12px;font-weight:900;line-height:1}
  .carte .res span{display:inline-flex;align-items:center;gap:1px}
  .carte .txt{font-size:11px;line-height:1.15;text-align:center;font-weight:600}
  .carte.plus{background:linear-gradient(#eaffea,#cdeccf)}
  .carte.r2{box-shadow:0 0 0 2px #7fc4ff,0 4px 12px rgba(0,0,0,.45)}
  .carte.r3{box-shadow:0 0 0 2px #ffd76a,0 0 14px #ffd76a}
  .carte.trop{filter:grayscale(.55) brightness(.8)}
  .carte.sel{z-index:50}
  .carte .typ{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;opacity:.7}
  .carte.g{position:relative;width:104px;height:156px}
  .carte.g .nomc{font-size:12px}
  .carte.g .art{flex:none;height:38px;font-size:24px}
  .grille{display:flex;flex-wrap:wrap;gap:12px 10px;justify-content:center;padding:10px 4px}
  .grille .item{display:flex;flex-direction:column;align-items:center;gap:4px}
  .prix{font-weight:900;color:#f3c55b;font-size:14px}
  .vendu{opacity:.3;pointer-events:none}

  /* ---------- Panneaux (boutique, repos, événements, récompenses) ---------- */
  .panneau{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 10px 18px;text-align:center}
  .panneau h2{margin:4px 0 0;font-size:24px;color:#ffe39a}
  .panneau p{margin:0;font-size:16px;line-height:1.35;max-width:380px}
  .panneau .grosIco{font-size:64px;color:#ffe39a;filter:drop-shadow(0 0 12px rgba(255,227,154,.5))}
  .choix{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px}
  .choix .btn{font-size:15.5px}
  .relChoix{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);min-height:56px;width:100%}
  .relChoix .rel{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex:none}
  .relChoix small{display:block;font-weight:500;font-size:13px;opacity:.85}
  .section{font-weight:900;color:#cbbcf5;font-size:14px;text-transform:uppercase;letter-spacing:1px;margin-top:6px}

  /* ---------- Couche (bilans, choix de cartes) ---------- */
  #couche{position:absolute;inset:0;z-index:100;background:rgba(10,6,24,.82);display:flex;align-items:center;justify-content:center;padding:12px}
  .boite{width:100%;max-width:400px;max-height:100%;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(#2e2352,#211a3c);border:2px solid #6d5a99;border-radius:20px;padding:16px 12px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:apparait .3s}
  @keyframes apparait{from{transform:scale(.85);opacity:0}}
  .boite h2{margin:0;font-size:25px;color:#ffe39a}
  .boite p{margin:0;font-size:16px;line-height:1.35}
  .etoiles{display:flex;gap:6px;justify-content:center}
  .etoiles svg{width:54px;height:54px;color:#4b3f70;transition:transform .3s}
  .etoiles svg.ok{color:#ffd76a;animation:etoile .5s;filter:drop-shadow(0 0 8px #ffd76a)}
  @keyframes etoile{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}}
  .grosScore{font-size:30px;font-weight:900;color:#fff}
  .badge{display:inline-block;padding:5px 12px;border-radius:12px;background:#ffd76a;color:#3b2200;font-weight:900;animation:pulse 1s infinite}
  .ligneBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  /* ---------- Effets ---------- */
  #fx{position:absolute;inset:0;pointer-events:none;z-index:150;overflow:hidden}
  #confettis{position:absolute;inset:0;pointer-events:none;z-index:160;width:100%;height:100%}
  .flot{position:absolute;font-weight:900;font-size:26px;text-shadow:0 2px 0 #000,0 0 8px #000;animation:flot 1s ease-out forwards;transform:translateX(-50%);white-space:nowrap}
  .flot.d{color:#ff6a6a}.flot.b{color:#8cc8ff}.flot.s{color:#7dffa0}.flot.t{color:#ffe39a;font-size:20px}
  @keyframes flot{0%{transform:translate(-50%,10px) scale(.6);opacity:0}20%{transform:translate(-50%,0) scale(1.15);opacity:1}100%{transform:translate(-50%,-55px) scale(1);opacity:0}}
  .grandTexte{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#ffe39a;text-shadow:0 3px 0 #4a2a7a,0 0 18px #000;animation:grand 1.6s ease-out forwards;white-space:nowrap}
  @keyframes grand{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
  .ecranSecoue{animation:secoue .4s}
  .flashRouge{animation:flashR .4s}
  @keyframes flashR{30%{background:rgba(255,60,60,.35)}}
  .fantome{position:fixed;z-index:200;pointer-events:none;transition:all .28s ease-in}

  /* ---------- Tutoriel animé ---------- */
  #tuto{position:absolute;inset:0;z-index:300}
  #tuto .halo{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(8,4,20,.62),0 0 0 3px #ffe39a,0 0 22px #ffe39a;transition:all .45s ease-in-out;pointer-events:none}
  #tuto .main{position:absolute;width:44px;height:57px;transition:left .7s ease-in-out,top .7s ease-in-out;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
  #tuto .main.tape svg{animation:tape .5s ease-in-out 2}
  @keyframes tape{50%{transform:scale(.8) translateY(4px)}}
  #tuto .bulle{position:absolute;left:12px;right:12px;padding:12px 14px;border-radius:16px;background:#fff7e0;color:#2a1640;font-size:17px;font-weight:700;line-height:1.3;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  #tuto .bulle .pts{display:flex;gap:6px;justify-content:center;margin-top:6px}
  #tuto .bulle .pts i{width:9px;height:9px;border-radius:50%;background:#d8c9a8}
  #tuto .bulle .pts i.on{background:#6a46c9}
  #tuto .bulle .btn{margin-top:8px;min-height:44px;padding:6px 16px;font-size:15px}

  /* ---------- Sceau qui se brise ---------- */
  .sceauAnim{position:absolute;inset:0;z-index:250;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,6,24,.75);gap:14px}
  .sceauAnim svg{width:180px;height:180px;animation:vibre .12s linear 10}
  .sceauAnim .eclat{animation:eclate .9s 1.2s ease-out forwards}
  .sceauAnim .fis{stroke-dasharray:120;stroke-dashoffset:120;animation:fissure .6s .5s forwards}
  .sceauAnim h2{margin:0;color:#ffe39a;font-size:28px;text-shadow:0 2px 0 #4a2a7a}
  @keyframes vibre{25%{transform:translate(-3px,2px)}75%{transform:translate(3px,-2px)}}
  @keyframes fissure{to{stroke-dashoffset:0}}
  @keyframes eclate{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
  .sceauAnim .morceau{transform-box:fill-box;transform-origin:center}

  @media (min-height:760px){ #zMain{height:146px} }
  @media (prefers-reduced-motion:reduce){ .aura,.livre svg{animation:none} }
</style>
</head>
<body>
<div id="jeu">
  <header id="barre" class="cache"></header>
  <main id="ecran"></main>
  <div id="fx"></div>
  <canvas id="confettis"></canvas>
  <div id="couche" class="cache"></div>
  <div id="tuto" class="cache"></div>
</div>
<script>
'use strict';
/* =====================================================================
   Grimoire des Sept Sceaux — jeu de cartes (deckbuilding) en 3 actes.
   Tout est dans ce fichier : données (cartes, reliques, ennemis,
   événements), écrans (accueil, carte, combat, boutique…), sons Web Audio,
   tutoriel animé et sauvegarde (localStorage protégé par try/catch).
   ===================================================================== */

// ---------- Petits outils ----------
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const rnd = (n) => Math.floor(Math.random() * n);
const pause = (ms) => new Promise((r) => setTimeout(r, ms));
const clone = (o) => JSON.parse(JSON.stringify(o));
const melange = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ROMAIN = ['', 'I', 'II', 'III'];

// Registre des actions des boutons : data-f="<n>" → fonction n.
const FN = [];
const on = (f) => { FN.push(f); return FN.length - 1; };
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-f]');
  if (!el || el.disabled) return;
  const f = FN[+el.dataset.f];
  if (f) f(el, ev);
});

// ---------- Sauvegarde (toujours dans try/catch) ----------
const CLE = 'grimoire-sept-sceaux-v1';
const REC = { meilleur: 0, etoiles: 0, sceaux: 0, son: true, vus: {}, partie: null };
function charger() { try { const t = localStorage.getItem(CLE); if (t) Object.assign(REC, JSON.parse(t)); } catch (e) { /* sans stockage, on joue quand même */ } }
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(REC)); } catch (e) { /* stockage refusé */ } }

// ---------- Sons (Web Audio, aucun fichier) ----------
let AC = null;
function audio() {
  if (!REC.son) return null;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}
function bip(f, dur, type = 'sine', vol = 0.12, delai = 0, f2 = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delai, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function bruit(dur, vol = 0.15, freq = 1200, delai = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delai, n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), fi = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; fi.type = 'bandpass'; fi.frequency.value = freq; g.gain.value = vol;
  s.connect(fi).connect(g).connect(a.destination); s.start(t);
}
const SONS = {

function resumeCarte(c) {
  const out = [];
  for (const o of opsDe(c)) {
    if (o.k === 'deg') out.push(`<span style="color:#b8322a">${ico('epee')}${o.n}${o.x > 1 ? '×' + o.x : ''}${o.tous ? '<small>tous</small>' : ''}</span>`);
    else if (o.k === 'bouc') out.push(`<span style="color:#2a6bb0">${ico('bouclier')}${o.n}</span>`);
    else if (o.k === 'pioche') out.push(`<span style="color:#6a3fa8">${ico('livre')}${o.n}</span>`);
    else if (o.k === 'energie') out.push(`<span style="color:#b07a10">${ico('soleil')}${o.n}</span>`);
    else if (o.k === 'st' || o.k === 'soi') out.push(`<span style="color:#7a3a90">${ico(ICST[o.s])}${o.s === 'garde' ? '' : o.n}${o.tous ? '<small>tous</small>' : ''}</span>`);
    else if (o.k === 'soin') out.push(`<span style="color:#c2334d">${ico('coeur')}${o.n}</span>`);
    else if (o.k === 'pouv') out.push(`<span style="color:#a06a00">${ico('soleil')}${o.n}</span>`);
    else out.push(`<span style="color:#6a3fa8">${ico('etoile')}</span>`);

  for (let i = 0; i < n; i++) confettisActifs.push({ x: r.width / 2 + (Math.random() - 0.5) * 80, y: r.height * 0.35, vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 9 - 3, c: cols[rnd(cols.length)], t: 0, r: Math.random() * 6 });

function animerConfettis() {
  const cv = $('#confettis'), g = cv.getContext('2d');

  confettisActifs = confettisActifs.filter((p) => p.t < 130 && p.y < cv.height + 20);
  for (const p of confettisActifs) {
    p.t++; p.vy += 0.22; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += 0.15;

function astuce(cle, etapes) {
  if (REC.vus[cle] || !etapes || !etapes.length) return Promise.resolve();

  return new Promise((res) => {
    tutoActif = true;

    t.classList.remove('cache');
    const halo = t.querySelector('.halo'), main = t.querySelector('.main'), bulle = t.querySelector('.bulle');
    const jr = () => $('#jeu').getBoundingClientRect();
    let i = 0, fini = false, minuteurs = [];
    const debut = Date.now();
    const viser = (el) => {
      if (!el) return;
      const r = el.getBoundingClientRect(), j = jr();
      halo.style.left = (r.left - j.left - 6) + 'px'; halo.style.top = (r.top - j.top - 6) + 'px';

      bulle.querySelectorAll('.pts i').forEach((p, k) => p.classList.toggle('on', k === i % etapes.length));
      viser(e.el());

      i++;
      minuteurs.push(setTimeout(etape, e.el2 ? 3200 : 2600));

    const fermer = () => {
      if (fini || Date.now() - debut < 500) return;
      fini = true; minuteurs.forEach(clearTimeout);

}

// Rangée de chemins avant le combat du niveau n
function genererChoix(n) {
  if (n === 2) return ['evenement', 'tresor'];
  const avantGardien = !!NIVEAUX[n - 1].sceau;
  const poids = { repos: 2, boutique: 2, evenement: 3, tresor: 1, elite: n >= 3 ? 2 : 0 };
  const res = avantGardien ? ['repos'] : [];
  if ((n === 3 || n === 7 || n === 11) && !res.includes('boutique')) res.push('boutique');
  while (res.length < 3) {
    const cand = Object.keys(poids).filter((k) => !res.includes(k) && poids[k] > 0);
    const tot = cand.reduce((a, k) => a + poids[k], 0);
    let r = Math.random() * tot;
    for (const k of cand) { r -= poids[k]; if (r <= 0) { res.push(k); break; } }
  }
  return melange(res);
}

function tirerCartes(n, bonus) {
  const niv = Math.min(S.niv, 12), res = [];
  const pool = Object.values(CARTES).filter((dc) => !dc.special && dc.niv >= 1 && dc.niv <= niv);
  const leg = niv >= 5 ? (bonus ? 0.15 : 0.05) : 0, rare = bonus ? 0.5 : 0.3;
  while (res.length < n) {
    const r = Math.random(), rar = r < leg ? 3 : r < leg + rare ? 2 : 1;
    let cand = pool.filter((dc) => dc.rare === rar && !res.includes(dc.id));
    if (!cand.length) cand = pool.filter((dc) => !res.includes(dc.id));
    res.push(cand[rnd(cand.length)].id);
  }
  return res.map((id) => ({ id, plus: 0 }));
}
function tirerReliques(n, gardien) {
  let dispo = Object.keys(RELIQUES).filter((id) => !S.rel.includes(id) && !!RELIQUES[id].gardien === gardien);
  if (dispo.length < n) dispo = dispo.concat(Object.keys(RELIQUES).filter((id) => !S.rel.includes(id) && !dispo.includes(id)));
  return melange(dispo).slice(0, n);
}

function lancerNiveau() { son('clic'); lancerCombat(NIVEAUX[S.niv - 1].en, 'niveau'); }
function creerEnnemi(id, decal = 0) {
  const dn = ENNEMIS[id];
  const e = { uid: UID++, id, nom: dn.nom, pvMax: dn.pv, pv: dn.pv, bouc: (dn.debut && dn.debut.bouc) || 0,
    st: { force: 0, faible: 0, fragile: 0, brulure: 0, gel: 0, epines: 0, regen: 0 },
    motif: dn.phases ? dn.phases[0] : dn.motif, idx: decal, phase: 0, enrage: false, delivre: false, boss: !!dn.boss, dernier: -1 };
  if (dn.debut) for (const k in dn.debut) if (k !== 'bouc') e.st[k] = dn.debut[k];
  choisirIntention(e);
  return e;
}
function choisirIntention(e) {
  const dn = ENNEMIS[e.id];

  e.intention = e.motif[e.idx % e.motif.length]; e.idx++;
}
function lancerCombat(liste, type) {
  snap = clone(S);

  const deck = melange(S.deck.map((c) => ({ ...c, uid: UID++ })));

    j: { pv: S.pv, bouc: 0, st: { force: 0, faible: 0, fragile: 0, brulure: 0, gel: 0, epines: 0, regen: 0, garde: 0 } },
    pioche: deck, main: [], defausse: [], epuisees: [], energie: 0, energieMax: 3, tour: 0, jouees: 0, pouv: {},
    premiereAttaque: true, pvDebut: S.pv, fini: false, vuPouvoir: false };
  // Reliques de début de combat
  if (aRel('cristalForce')) C.j.st.force += 1;
  if (aRel('anneauEpines')) C.j.st.epines += 3;
  if (aRel('grelot')) C.ennemis.forEach((e) => { e.st.fragile += 1; });
  ecran(`<div id="combat">
    <div id="zEn"><div id="ennemis"></div></div>
    <div id="info"></div>
    <div id="zJ">
      <div class="joueur" id="joueur">${MAGE}<div class="col"><div class="pvbar"><i></i><span></span><b></b></div><div class="sts" id="jst"></div></div></div>
      <div id="orbe" aria-label="Énergie">3/3</div>
      <div class="tas" data-f="${on(() => info(`Pioche : ${C.pioche.length} cartes. Défausse : ${C.defausse.length}. Quand la pioche est vide, la défausse est mélangée.`))}">${ico('livre')}<span id="nbPioche">0</span></div>
      <button class="btn" id="btnFin" data-f="${on(finTour)}">Fin du<br>tour</button>
    </div>
    <div id="zMain"><div id="main"></div></div>
  </div>`);
  majBarre(true);
  construireEnnemis();
  debutTourJoueur().then(async () => {
    if (type === 'niveau') {
      const nv = NIVEAUX[S.niv - 1];
      grandTexte(nv.sceau ? `Sceau ${nv.sceau} !` : `Niveau ${S.niv}`);
      await pause(900);
      await astuce('intro-' + nv.intro, INTROS[nv.intro] && INTROS[nv.intro]());

}
const vivants = () => C.ennemis.filter((e) => !e.delivre);

const elEn = (e) => document.getElementById('en-' + e.uid);

function construireEnnemis() {

  zone.innerHTML = C.ennemis.map((e) => {

function degatsEnnemi(e, base) {

  if (e.st.faible > 0) n = Math.floor(n * 0.75);

  if (it.f) p.push(`<span class="ic">${ico('haut')}${it.f}</span>`);

  if (it.encre) p.push(`<span class="ix" style="color:#bbb">${ico('goutte')}${it.encre}</span>`);

function texteIntention(e) {
  const it = e.intention; if (!it) return '';

  if (it.charge) p.push('se concentre pour un énorme coup');
  if (it.a) p.push(`attaque : ${degatsEnnemi(e, it.a)} dégâts${it.x > 1 ? ' × ' + it.x : ''}`);
  if (it.b) p.push(`se protège (+${it.b})`);
  if (it.f) p.push(`devient plus fort (+${it.f})`);
  if (it.brul) p.push(`Brûlure ${it.brul}`);
  if (it.faible) p.push(`Faible ${it.faible}`);
  if (it.fragile) p.push(`Fragile ${it.fragile}`);
  if (it.gel) p.push('te givre');
  if (it.encre) p.push(`jette ${it.encre} tache(s) d’encre`);

  return p.join(', ');
}
function majTout() {
  if (!C || !$('#combat')) return;

    const el = elEn(e); if (!el) continue;
    el.classList.toggle('cible', !e.delivre && e === cible && vivants().length > 1);
    el.querySelector('.intent').innerHTML = e.delivre ? '' : intentHTML(e);
    el.querySelector('.pvbar i').style.width = Math.max(0, e.pv / e.pvMax * 100) + '%';
    el.querySelector('.pvbar span').textContent = `${Math.max(0, e.pv)}/${e.pvMax}`;
    el.querySelector('.pvbar b').textContent = e.bouc > 0 ? e.bouc : '';
    el.querySelector('.sts').innerHTML = stsHTML(e.st);
  }
  const j = $('#joueur');
  j.querySelector('.pvbar i').style.width = Math.max(0, C.j.pv / S.pvMax * 100) + '%';
  j.querySelector('.pvbar span').textContent = `${Math.max(0, C.j.pv)}/${S.pvMax}`;
  j.querySelector('.pvbar b').textContent = C.j.bouc > 0 ? C.j.bouc : '';
  $('#jst').innerHTML = stsHTML(C.j.st);

function info(t) {

  el.innerHTML = jouable ? `<span>Énergie <b>${C.energie}</b> : choisis une carte !</span>` : '<span>Plus rien à jouer : touche <b>Fin du tour</b>.</span>';
  // Le bouton « Fin du tour » pulse quand il n'y a plus rien à jouer

function dessinerMain() {
  const zone = $('#main'); if (!zone) return;
  const w = (zone.clientWidth || 360) - 10, n = C.main.length, cw = 82;
  const pas = n > 1 ? Math.min(cw + 4, (w - cw) / (n - 1)) : 0;
  const total = pas * (n - 1) + cw, x0 = (w - total) / 2;
  zone.innerHTML = C.main.map((c, i) => {
    const trop = defC(c).type === 'M' || coutDe(c) > C.energie;

  }).join('');

    const rot = n > 1 ? (i - (n - 1) / 2) * 3 : 0;
    el.style.left = (5 + x0 + i * pas) + 'px';
    el.style.top = '10px';
    el.style.zIndex = i === C.sel ? 50 : i + 1;
    el.style.transform = i === C.sel ? 'translateY(-14px) scale(1.08)' : `rotate(${rot}deg) translateY(${Math.abs(rot) * 0.8}px)`;
  });
}
// Une carte vise-t-elle un seul ennemi ?
function viseUn(c) {
  return opsDe(c).some((o) => (o.k === 'deg' && !o.tous && !o.hasard) || (o.k === 'st' && !o.tous) || ['degBouc', 'echo', 'siFragile', 'doubleBrul', 'degBrul', 'siDelivre'].includes(o.k));
}
function toucherCarte(i) {
  if (!C || C.occupe || C.fini || tutoActif) return;

  else if (coutDe(c) > C.energie) aide = ' <i>(pas assez d’énergie)</i>';

  info(`<span><b>${nomDe(c)}</b> (${dc.type === 'M' ? '–' : coutDe(c)}) : ${texteCarte(c)}${aide}</span>`);
}
function toucherEnnemi(e) {

// Clavier : 1-9 choisir/jouer, flèches pour changer de carte ou de cible, Entrée/Espace pour jouer, F pour finir le tour
document.addEventListener('keydown', (ev) => {
  if (!C || C.fini || !$('#combat') || !$('#couche').classList.contains('cache')) return;
  if (tutoActif) return;
  const k = ev.key;
  if (/^[1-9]$/.test(k)) { toucherCarte(+k - 1); ev.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'ArrowLeft') { if (!C.main.length) return; const n = C.main.length; const i = C.sel < 0 ? 0 : (C.sel + (k === 'ArrowRight' ? 1 : n - 1)) % n; C.sel = -1; toucherCarte(i); ev.preventDefault(); }
  else if (k === 'ArrowUp' || k === 'ArrowDown') { const v = vivants(); if (v.length) { const i = (v.indexOf(cibleCourante()) + 1) % v.length; C.cible = v[i].uid; son('choix'); majTout(); } ev.preventDefault(); }
  else if (k === 'Enter' || k === ' ') { if (C.sel >= 0) jouerCarte(C.sel, null); ev.preventDefault(); }

// ---------- Jouer une carte ----------
async function jouerCarte(i, cibleE) {
  if (C.occupe || C.fini) return;
  const c = C.main[i]; if (!c) return;
  const dc = defC(c);
  if (dc.type === 'M') { son('erreur'); info('Une <b>tache d’encre</b> : elle ne se joue pas. Elle partira à la fin du combat.'); return; }
  const cout = coutDe(c);
  if (cout > C.energie) { son('erreur'); secouer($('#orbe')); info('Pas assez d’énergie ! Touche <b>Fin du tour</b> pour en retrouver.'); C.sel = -1; dessinerMain(); return; }
  const cible = cibleE && !cibleE.delivre ? cibleE : cibleCourante();
  if (cible) C.cible = cible.uid;
  C.occupe = true; C.sel = -1;
  C.energie -= cout;
  // Petite carte qui vole vers sa cible
  const elC = $$('#main .carte')[i];
  if (elC) {
    const r = elC.getBoundingClientRect(), g = elC.cloneNode(true);
    g.classList.add('fantome'); g.removeAttribute('data-f');
    Object.assign(g.style, { left: r.left + 'px', top: r.top + 'px', transform: 'none' });
    document.body.appendChild(g);
    const dest = dc.type === 'A' || viseUn(c) ? (cible ? elEn(cible) : null) : $('#joueur');
    const rd = dest ? dest.getBoundingClientRect() : r;
    requestAnimationFrame(() => Object.assign(g.style, { left: (rd.left + rd.width / 2 - 41) + 'px', top: (rd.top + rd.height / 2 - 58) + 'px', transform: 'scale(.4)', opacity: '0.2' }));
    setTimeout(() => g.remove(), 320);
  }
  C.main.splice(i, 1);
  dessinerMain();
  await pause(230);
  son(dc.type === 'A' ? 'attaque' : dc.type === 'D' ? 'bouclier' : dc.type === 'P' ? 'pouvoir' : 'sort');

function gagnerBouclier(n) { C.j.bouc += n; flotter($('#joueur'), '+' + n, 'b'); }
async function appliquerOp(o, cible, bonus) {
  const v = vivants();
  switch (o.k) {
    case 'deg':
      for (let k = 0; k < o.x; k++) {
        const cibles = o.tous ? vivants() : o.hasard ? [vivants()[rnd(vivants().length)]] : [cible];
        for (const e of cibles) if (e) frapperEnnemi(e, o.n + bonus);
        majTout();
        if (o.x > 1) { await pause(160); son('attaque'); }
        if (!vivants().length) break;
      }
      break;
    case 'bouc': gagnerBouclier(o.n); break;
    case 'pioche': piocher(o.n); break;
    case 'energie': C.energie += o.n; flotter($('#orbe'), '+' + o.n, 't'); break;
    case 'st': for (const e of (o.tous ? v : [cible])) if (e) donnerStatut(e, o.s, o.n); break;
    case 'soi': C.j.st[o.s] += o.n; flotter($('#joueur'), NOMST[o.s], 't'); break;
    case 'soin': { const avant = C.j.pv; C.j.pv = Math.min(S.pvMax, C.j.pv + o.n); flotter($('#joueur'), '+' + (C.j.pv - avant), 's'); son('soin'); break; }
    case 'degBouc': if (cible) frapperEnnemi(cible, C.j.bouc + bonus); break;
    case 'echo': if (cible) frapperEnnemi(cible, o.n + o.par * C.jouees + bonus); break;
    case 'siFragile': if (cible && cible.st.fragile > 0) { C.energie += o.en; flotter($('#orbe'), '+' + o.en, 't'); } break;
    case 'siDelivre': if (cible && cible.delivre) { C.energie += o.en; piocher(o.pi); flotter($('#orbe'), '+' + o.en, 't'); } break;
    case 'doubleBrul': if (cible) { cible.st.brulure *= 2; flotter(elEn(cible), 'Brûlure ×2', 't'); son('brulure'); } break;
    case 'degBrul': if (cible && !cible.delivre && cible.st.brulure > 0) frapperEnnemi(cible, cible.st.brulure, true); break;
    case 'doubleBouc': gagnerBouclier(C.j.bouc); break;
    case 'lutins': for (let k = 0; k < o.n; k++) if (C.main.length < 10) C.main.push({ id: 'lutin', plus: 0, uid: UID++ }); break;
    case 'recycle': { const n = C.main.length; C.defausse.push(...C.main); C.main = []; piocher(n); break; }
    case 'purif': C.j.st.faible = 0; C.j.st.fragile = 0; C.j.st.brulure = 0; flotter($('#joueur'), 'Purifié !', 's'); break;
    case 'pouv':
      C.pouv[o.p] = (C.pouv[o.p] || 0) + o.n;
      if (o.p === 'force') C.j.st.force += o.n;
      if (o.p === 'epines') C.j.st.epines += o.n;
      flotter($('#joueur'), 'Pouvoir !', 't'); grandTexte(TXTPOUV[o.p](o.n).split(':')[0]);
      break;
  }
  majTout();
}
function donnerStatut(e, s, n) {
  if (e.delivre) return;
  if (s === 'gel' && e.boss) { flotter(elEn(e), 'Insensible', 't'); return; }
  if (s === 'brulure' && aRel('bougie')) n += 1;
  e.st[s] += n;
  flotter(elEn(e), `${NOMST[s]} ${n}`, 't');
  if (s === 'gel') son('gel'); else if (s === 'brulure') son('brulure');
}
// Le joueur frappe un ennemi (direct = sans force ni faiblesse)
function frapperEnnemi(e, base, direct) {
  if (e.delivre) return;
  let n = direct ? base : base + C.j.st.force;
  if (!direct && C.j.st.faible > 0) n = Math.floor(n * 0.75);
  if (e.st.fragile > 0) n = Math.floor(n * 1.5);
  const bloque = Math.min(e.bouc, n); e.bouc -= bloque; n -= bloque;
  e.pv -= n;
  const el = elEn(e);
  flotter(el, n > 0 ? '-' + n : 'Bloqué', n > 0 ? 'd' : 'b');
  secouer(el && el.querySelector('.art'));
  if (!direct && e.st.epines > 0) { blesserJoueur(e.st.epines, null); flotter($('#joueur'), 'Épines !', 't'); }
  if (e.pv <= 0) delivrer(e); else verifierPhase(e);
}
function delivrer(e) {

  if (el) { el.querySelector('.art').innerHTML = creature(ENNEMIS[e.id].art, true); el.classList.add('libre'); flotter(el, 'Délivré !', 's'); setTimeout(() => { el.classList.remove('libre'); el.classList.add('parti'); }, 1400); }

}
function verifierPhase(e) {
  const dn = ENNEMIS[e.id];
  if (dn.rage && !e.enrage && e.pv <= e.pvMax / 2) {
    e.enrage = true; e.st.force += 3; e.motif = dn.motifRage; e.idx = 0; choisirIntention(e);

  }
  if (dn.phases) {
    const r = e.pv / e.pvMax, ph = r > 0.66 ? 0 : r > 0.33 ? 1 : 2;
    if (ph > e.phase) {
      e.phase = ph; e.motif = dn.phases[ph]; e.idx = 0; choisirIntention(e);
      e.st.faible = 0; e.st.fragile = 0;
      grandTexte(`Phase ${ph + 1} !`); secouer($('#jeu'), 'ecranSecoue'); son('sceau');
    }
  }
}
// Le joueur reçoit des dégâts (source = ennemi qui attaque, pour les épines)
function blesserJoueur(n, source) {
  const bloque = Math.min(C.j.bouc, n); C.j.bouc -= bloque; n -= bloque;
  C.j.pv -= n;
  const jEl = $('#joueur');
  flotter(jEl, n > 0 ? '-' + n : 'Bloqué', n > 0 ? 'd' : 'b');
  if (n > 0) { son('coup'); secouer(jEl); secouer($('#combat'), 'flashRouge'); if (n >= 15) secouer($('#jeu'), 'ecranSecoue'); } else son('bouclier');
  if (source && C.j.st.epines > 0 && !source.delivre) { source.pv -= C.j.st.epines; flotter(elEn(source), '-' + C.j.st.epines, 'd'); if (source.pv <= 0) delivrer(source); }
}
function piocher(n) {
  for (let k = 0; k < n; k++) {
    if (!C.pioche.length) { if (!C.defausse.length) break; C.pioche = melange(C.defausse); C.defausse = []; }
    if (C.main.length >= 10) break;
    C.main.push(C.pioche.pop());
  }
}
async function debutTourJoueur() {
  C.tour++;
  if (C.j.st.garde > 0) C.j.st.garde = 0; else C.j.bouc = 0;
  if (C.tour === 1 && aRel('coquillage')) C.j.bouc += 8;
  if (C.j.st.brulure > 0) { const n = C.j.st.brulure; C.j.pv -= n; C.j.st.brulure--; flotter($('#joueur'), '-' + n, 'd'); son('brulure'); }
  if (C.j.st.regen > 0) { C.j.pv = Math.min(S.pvMax, C.j.pv + C.j.st.regen); flotter($('#joueur'), '+' + C.j.st.regen, 's'); C.j.st.regen--; }
  if (C.pouv.phenix) C.j.pv = Math.min(S.pvMax, C.j.pv + C.pouv.phenix);
  if (C.pouv.boucTour) C.j.bouc += C.pouv.boucTour;
  if (aRel('ailesFee')) C.j.bouc += 3;
  if (C.pouv.auraFeu) for (const e of vivants()) donnerStatut(e, 'brulure', C.pouv.auraFeu);
  let energie = 3 + (C.pouv.energie || 0) + (aRel('coeurCristal') ? 1 : 0) + (C.tour === 1 && aRel('lanterne') ? 1 : 0) + (aRel('sablier') && C.tour % 3 === 0 ? 1 : 0);
  if (C.j.st.gel > 0) { energie -= C.j.st.gel; C.j.st.gel = 0; flotter($('#orbe'), 'Givré', 't'); }
  C.energie = Math.max(0, energie); C.energieMax = C.energie;
  piocher(5 + (C.pouv.pioche || 0) + (aRel('grimoireDore') ? 1 : 0) + (C.tour === 1 && aRel('sacoche') ? 2 : 0));
  C.sel = -1;

}
async function finTour() {
  if (!C || C.occupe || C.fini || tutoActif) return;
  C.occupe = true; C.sel = -1; son('clic');

    const el = elEn(e);
    e.bouc = 0;
    if (e.st.brulure > 0) { e.pv -= e.st.brulure; flotter(el, '-' + e.st.brulure, 'd'); e.st.brulure--; son('brulure'); if (e.pv <= 0) { delivrer(e); majTout(); await pause(500); continue; } verifierPhase(e); }
    if (e.st.regen > 0) { const avant = e.pv; e.pv = Math.min(e.pvMax, e.pv + e.st.regen); if (e.pv > avant) flotter(el, '+' + (e.pv - avant), 's'); }
    majTout();

async function agir(e) {

  if (it.fragile) C.j.st.fragile += it.fragile;

/* =====================================================================

    </div>`);

    <div class="ligneBtns">
      <button class="btn" data-f="${on(() => { son('clic'); const essais = S.essais; S = clone(snap); if (niveau) S.essais = essais + 1; S.pv = Math.max(S.pv, Math.ceil(S.pvMax * 0.6)); fermerCouche(); lancerCombat(niveau ? NIVEAUX[S.niv - 1].en : ELITES[acteDe(S.niv)][rnd(2)], niveau ? 'niveau' : 'elite'); })}">Réessayer</button>
      <button class="btn g" data-f="${on(() => { son('clic'); finPartie(false); })}">Abandonner</button>
    </div>`);
}
function finPartie(gagne) {
  fermerCouche();
  const battu = majRecords();
  const sc = S.score, et = totalEtoiles(), sx = S.sceaux;
  REC.partie = null; sauver();
  C = null; majBarre(false);
  if (gagne) { son('victoire'); confettis(140); setTimeout(() => confettis(100), 900); }
  const amis = ['gelee', 'golem', 'reine', 'dragonnet', 'chouette', 'titan', 'gardien'].map((id) => `<div style="width:44px;display:inline-block">${creature(ENNEMIS[id].art, true)}</div>`).join('');
  ecran(`<div class="panneau" style="justify-content:center">
    <h2 style="font-size:28px">${gagne ? 'Les sept sceaux sont brisés !' : 'Fin de l’aventure'}</h2>
    <p>${gagne ? 'Toutes les créatures sont délivrées et la forêt chante de joie. Tu es un grand magicien !' : 'Tu reviendras plus fort : chaque partie t’apprend de nouveaux combos !'}</p>
    <div>${amis}</div>
    <div class="grosScore">${sc} points</div>
    <p>${ico('etoile')} ${et} étoiles · ${ico('sceau')} ${sx}/7 sceaux</p>
    ${battu ? '<span class="badge">Nouveau record !</span>' : `<p style="opacity:.8">Record : ${REC.meilleur} points</p>`}
    <div class="ligneBtns">
      <button class="btn" data-f="${on(() => { son('clic'); nouvellePartie(); carte(); })}">Rejouer</button>
      <button class="btn g" data-f="${on(() => { son('clic'); accueil(); })}">Accueil</button>
    </div></div>`);
}

// Redessiner la main si la taille change (rotation du téléphone)
window.addEventListener('resize', () => { if (C && $('#main')) dessinerMain(); });

charger();
accueil();
</script>
</body>
</html>
