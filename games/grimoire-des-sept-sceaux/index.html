<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? texte('score', { n: d.score })
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
'use strict';
/* =====================================================================
   Grimoire des Sept Sceaux — jeu de cartes (deckbuilding) en 3 actes.
   Tout est dans ce fichier : données (cartes, reliques, ennemis,
   événements), écrans (accueil, carte, combat, boutique…), sons Web Audio,
   tutoriel animé et sauvegarde (localStorage protégé par try/catch).
   ===================================================================== */

// ---------- Petits outils ----------
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const rnd = (n) => Math.floor(Math.random() * n);
const pause = (ms) => new Promise((r) => setTimeout(r, ms));
const clone = (o) => JSON.parse(JSON.stringify(o));
const melange = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ROMAIN = ['', 'I', 'II', 'III'];

// Registre des actions des boutons : data-f="<n>" → fonction n.
const FN = [];
const on = (f) => { FN.push(f); return FN.length - 1; };
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-f]');
  if (!el || el.disabled) return;
  const f = FN[+el.dataset.f];
  if (f) f(el, ev);
});

// ---------- Sauvegarde (toujours dans try/catch) ----------
const CLE = 'grimoire-sept-sceaux-v1';
const REC = { meilleur: 0, etoiles: 0, sceaux: 0, son: true, vus: {}, partie: null };
function charger() { try { const t = localStorage.getItem(CLE); if (t) Object.assign(REC, JSON.parse(t)); } catch (e) { /* sans stockage, on joue quand même */ } }
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(REC)); } catch (e) { /* stockage refusé */ } }

// ---------- Sons (Web Audio, aucun fichier) ----------
let AC = null;
function audio() {
  if (!REC.son) return null;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}
function bip(f, dur, type = 'sine', vol = 0.12, delai = 0, f2 = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delai, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function bruit(dur, vol = 0.15, freq = 1200, delai = 0) {
  const a = audio(); if (!a) return;

  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), fi = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; fi.type = 'bandpass'; fi.frequency.value = freq; g.gain.value = vol;
  s.connect(fi).connect(g).connect(a.destination); s.start(t);

const SONS = {

  clic: () => bip(520, 0.06, 'square', 0.05),
  attaque: () => { bruit(0.14, 0.25, 900); bip(220, 0.15, 'sawtooth', 0.07, 0, 90); },
  bouclier: () => { bip(880, 0.18, 'sine', 0.1); bip(1320, 0.25, 'sine', 0.06, 0.04); },

  pouvoir: () => { bip(300, 0.4, 'triangle', 0.1, 0, 900); bip(600, 0.3, 'sine', 0.06, 0.2); },

const NOMST = Object.fromEntries(['brulure', 'faible', 'fragile', 'gel', 'force', 'epines', 'regen', 'garde'].map((k) => [k, t('st.' + k)]));
const ICST = { brulure: 'flamme', faible: 'spirale', fragile: 'fissure', gel: 'flocon', force: 'haut', epines: 'epines', regen: 'feuille', garde: 'bouclier' };

// Texte des pouvoirs : traductions pouv.<pouvoir>
const TXTPOUV = (p, n) => t('pouv.' + p, { n });
const defC = (c) => CARTES[c.id];
const coutDe = (c) => (c.plus ? defC(c).coutP : defC(c).cout);
const opsDe = (c) => defC(c).ops(c.plus ? 1 : 0);
const epDe = (c) => { const e = defC(c).ep; return e === 'base' ? !c.plus : !!e; };
const nomDe = (c) => defC(c).nom + (c.plus ? ' +' : '');

function texteOp(o) {
  switch (o.k) {
    case 'deg': return t('op.deg', { n: o.n }) + (o.x > 1 ? ` × ${o.x}` : '') + (o.tous ? ' ' + t('op.aTous') : o.hasard ? ' ' + t('op.auHasard') : '');
    case 'bouc': return t('op.bouc', { n: o.n });
    case 'pioche': return t('op.pioche', { n: o.n });
    case 'energie': return t('op.energie', { n: o.n });
    case 'st': return `${NOMST[o.s]} ${o.n}` + (o.tous ? ' ' + t('op.aTous') : '');
    case 'soi': return o.s === 'garde' ? t('op.garde') : t('op.soi', { n: o.n, nom: t('stMin.' + o.s) });
    case 'soin': return t('op.soin', { n: o.n });
    case 'degBouc': return t('op.degBouc');
    case 'echo': return t('op.echo', { n: o.n, par: o.par });
    case 'siFragile': return t('op.siFragile', { en: o.en });
    case 'siDelivre': return t('op.siDelivre', { en: o.en, pi: o.pi });
    case 'doubleBrul': return t('op.doubleBrul');
    case 'degBrul': return t('op.degBrul');
    case 'doubleBouc': return t('op.doubleBouc');
    case 'lutins': return t('op.lutins', { n: o.n });
    case 'recycle': return t('op.recycle');
    case 'purif': return t('op.purif');
    case 'pouv': return TXTPOUV(o.p, o.n);
  }
  return '';
}
function texteCarte(c) {
  if (defC(c).type === 'M') return t('carte.encreTxt');
  return opsDe(c).map(texteOp).join('. ') + '.' + (epDe(c) ? ' ' + t('carte.epuiseeTxt') : '');
}
// Petit résumé en icônes pour les cartes de la main
function resumeCarte(c) {
  const out = [];
  for (const o of opsDe(c)) {
    if (o.k === 'deg') out.push(`<span style="color:#b8322a">${ico('epee')}${o.n}${o.x > 1 ? '×' + o.x : ''}${o.tous ? '<small>' + t('tous') + '</small>' : ''}</span>`);
    else if (o.k === 'bouc') out.push(`<span style="color:#2a6bb0">${ico('bouclier')}${o.n}</span>`);
    else if (o.k === 'pioche') out.push(`<span style="color:#6a3fa8">${ico('livre')}${o.n}</span>`);
    else if (o.k === 'energie') out.push(`<span style="color:#b07a10">${ico('soleil')}${o.n}</span>`);
    else if (o.k === 'st' || o.k === 'soi') out.push(`<span style="color:#7a3a90">${ico(ICST[o.s])}${o.s === 'garde' ? '' : o.n}${o.tous ? '<small>' + t('tous') + '</small>' : ''}</span>`);
    else if (o.k === 'soin') out.push(`<span style="color:#c2334d">${ico('coeur')}${o.n}</span>`);
    else if (o.k === 'pouv') out.push(`<span style="color:#a06a00">${ico('soleil')}${o.n}</span>`);
    else out.push(`<span style="color:#6a3fa8">${ico('etoile')}</span>`);
  }
  return out.slice(0, 3).join('');
}
function carteHTML(c, grand, extra = '') {
  const dc = defC(c), t = TYPES[dc.type];
  return `<div class="carte ${grand ? 'g' : ''} r${dc.rare} ${c.plus ? 'plus' : ''} ${extra}" style="--c:${t.c}">
    ${dc.type === 'M' ? '' : `<div class="cout">${coutDe(c)}</div>`}
    <div class="nomc">${nomDe(c)}</div>
    <div class="art">${ico(t.ic)}</div>
    ${grand ? `<div class="typ">${t.nom}</div><div class="txt">${texteCarte(c)}</div>` : `<div class="res">${resumeCarte(c)}</div>`}
  </div>`;
}

// ---------- Sauvegarde du site (JEL_SAVE) ----------
// Données : niveau (S.niv), score, réglage du son et « partie » (copie de S :
// paquet, reliques, or, PV… nécessaires pour reprendre l'aventure).
// pointReprise : dernier état sûr hors combat (carte du monde, ou juste après
// un niveau réussi) ; en combat, c'est snap (état au début du combat).
const JEU = 'grimoire-des-sept-sceaux';
let pointReprise = null, partieFinie = null;
function retenirReprise(etat) {
  pointReprise = etat;
  if (etat) JEL_SAVE.save(JEU, { niveau: Math.min(12, Math.max(1, etat.niv)), score: etat.score, options: { son: REC.son }, partie: etat });
}
JEL_SAVE.surFermeture(() => {
  if (!S || S === partieFinie || $('#ecran .accueil')) return; // pas de partie en cours
  const etat = C ? snap : pointReprise;
  if (etat) retenirReprise(clone(etat));
});
function reprendreSauvegarde(d) {
  const p = d.partie;
  if (p && typeof p === 'object' && Array.isArray(p.deck) && p.deck.length && Number.isFinite(p.niv)) S = clone(p);
  else { nouvellePartie(); S.niv = Math.min(12, d.niveau); S.score = d.score; }
  S.niv = Math.min(13, Math.max(1, Math.floor(S.niv)));
  if (S.etape !== 'choix' || S.niv < 2) S.etape = 'combat';

}

let confettisActifs = [];

  confettisActifs = confettisActifs.filter((p) => p.t < 130 && p.y < cv.height + 20);
  for (const p of confettisActifs) {
    p.t++; p.vy += 0.22; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += 0.15;
    g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-4, -2.5, 8, 5); g.restore();
  }

const NOEUDS = {

  elite: { nom: t('noeud.elite'), ic: 'couronne', c: '#d0407a' },

// Rangée de chemins avant le combat du niveau n
function genererChoix(n) {
  if (n === 2) return ['evenement', 'tresor'];
  const avantGardien = !!NIVEAUX[n - 1].sceau;
  const poids = { repos: 2, boutique: 2, evenement: 3, tresor: 1, elite: n >= 3 ? 2 : 0 };
  const res = avantGardien ? ['repos'] : [];
  if ((n === 3 || n === 7 || n === 11) && !res.includes('boutique')) res.push('boutique');
  while (res.length < 3) {
    const cand = Object.keys(poids).filter((k) => !res.includes(k) && poids[k] > 0);
    const tot = cand.reduce((a, k) => a + poids[k], 0);
    let r = Math.random() * tot;
    for (const k of cand) { r -= poids[k]; if (r <= 0) { res.push(k); break; } }
  }
  return melange(res);
}
function carte() {

  const a = acteDe(S.niv);
  let lignes = '';
  for (let n = 4 * a - 3; n <= 4 * a; n++) {

    lignes += `<div class="rang"><button class="noeud ${actif ? 'actif' : fait ? 'fait' : 'futur'}" id="${actif ? 'noeudCombat' : ''}" ${actif ? `data-f="${on(lancerNiveau)}"` : 'disabled'}>

    if (n < 4 * a) lignes += '<div class="lien"></div>';
  }
  const sceaux = [1, 2, 3, 4, 5, 6, 7].map((k) => `<span class="s ${k <= S.sceaux ? 'ok' : ''}">${ico('sceau')}</span>`).join('');

function tirerCartes(n, bonus) {
  const niv = Math.min(S.niv, 12), res = [];

  while (res.length < n) {

  const j = $('#joueur');
  j.querySelector('.pvbar i').style.width = Math.max(0, C.j.pv / S.pvMax * 100) + '%';

  $('#jst').innerHTML = stsHTML(C.j.st);

  $('#nbPioche').textContent = C.pioche.length;
  majBarre(true);

}
function info(m) {

  const jouable = C.main.some((c) => defC(c).type !== 'M' && coutDe(c) <= C.energie);
  el.innerHTML = jouable ? `<span>${t('infoEnergie', { n: C.energie })}</span>` : `<span>${t('infoRien')}</span>`;

}
function dessinerMain() {
  const zone = $('#main'); if (!zone) return;
  const w = (zone.clientWidth || 360) - 10, n = C.main.length, cw = 82;
  const pas = n > 1 ? Math.min(cw + 4, (w - cw) / (n - 1)) : 0;
  const total = pas * (n - 1) + cw, x0 = (w - total) / 2;
  zone.innerHTML = C.main.map((c, i) => {
    const trop = defC(c).type === 'M' || coutDe(c) > C.energie;
    return carteHTML(c, false, (trop ? 'trop ' : '') + (i === C.sel ? 'sel' : '')).replace('<div class="carte', `<div data-f="${on(() => toucherCarte(i))}" role="button" aria-label="${nomDe(c)}" class="carte`);
  }).join('');

  });
}
// Une carte vise-t-elle un seul ennemi ?
function viseUn(c) {
  return opsDe(c).some((o) => (o.k === 'deg' && !o.tous && !o.hasard) || (o.k === 'st' && !o.tous) || ['degBouc', 'echo', 'siFragile', 'doubleBrul', 'degBrul', 'siDelivre'].includes(o.k));
}
function toucherCarte(i) {
  if (!C || C.occupe || C.fini || tutoActif) return;
  const c = C.main[i]; if (!c) return;
  if (C.sel === i) { jouerCarte(i, null); return; }
  C.sel = i; son('choix');
  dessinerMain();
  const dc = defC(c);
  let aide = '';
  if (dc.type === 'M') aide = '';
  else if (coutDe(c) > C.energie) aide = ' <i>' + t('pasAssezEnergie') + '</i>';
  else aide = ' ' + t(viseUn(c) && vivants().length > 1 ? 'toucheVise' : 'toucheEncore');
  info(`<span><b>${nomDe(c)}</b> (${dc.type === 'M' ? '–' : coutDe(c)}) : ${texteCarte(c)}${aide}</span>`);
}
function toucherEnnemi(e) {
  if (!C || C.occupe || C.fini || e.delivre || tutoActif) return;
  C.cible = e.uid;
  if (C.sel >= 0) { jouerCarte(C.sel, e); return; }
  son('choix'); majTout();
  const sts = Object.keys(e.st).filter((k) => e.st[k] > 0).map((k) => `${NOMST[k]} ${e.st[k]}`).join(', ');
  info(`<span><b>${e.nom}</b> ${texteIntention(e)}.${sts ? ' ' + sts + '.' : ''}${e.boss ? ' ' + t('insensibleGel') : ''}</span>`);
}
// Clavier : 1-9 choisir/jouer, flèches pour changer de carte ou de cible, Entrée/Espace pour jouer, F pour finir le tour
document.addEventListener('keydown', (ev) => {
  if (!C || C.fini || !$('#combat') || !$('#couche').classList.contains('cache')) return;
  if (tutoActif) return;
  const k = ev.key;
  if (/^[1-9]$/.test(k)) { toucherCarte(+k - 1); ev.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'ArrowLeft') { if (!C.main.length) return; const n = C.main.length; const i = C.sel < 0 ? 0 : (C.sel + (k === 'ArrowRight' ? 1 : n - 1)) % n; C.sel = -1; toucherCarte(i); ev.preventDefault(); }
  else if (k === 'ArrowUp' || k === 'ArrowDown') { const v = vivants(); if (v.length) { const i = (v.indexOf(cibleCourante()) + 1) % v.length; C.cible = v[i].uid; son('choix'); majTout(); } ev.preventDefault(); }
  else if (k === 'Enter' || k === ' ') { if (C.sel >= 0) jouerCarte(C.sel, null); ev.preventDefault(); }
  else if (k === 'f' || k === 'F') finTour();
});

// ---------- Jouer une carte ----------
async function jouerCarte(i, cibleE) {
  if (C.occupe || C.fini) return;
  const c = C.main[i]; if (!c) return;
  const dc = defC(c);
  if (dc.type === 'M') { son('erreur'); info(t('encreInfo')); return; }
  const cout = coutDe(c);
  if (cout > C.energie) { son('erreur'); secouer($('#orbe')); info(t('pasEnergie')); C.sel = -1; dessinerMain(); return; }
  const cible = cibleE && !cibleE.delivre ? cibleE : cibleCourante();
  if (cible) C.cible = cible.uid;
  C.occupe = true; C.sel = -1;
  C.energie -= cout;
  // Petite carte qui vole vers sa cible
  const elC = $$('#main .carte')[i];
  if (elC) {
    const r = elC.getBoundingClientRect(), g = elC.cloneNode(true);
    g.classList.add('fantome'); g.removeAttribute('data-f');
    Object.assign(g.style, { left: r.left + 'px', top: r.top + 'px', transform: 'none' });
    document.body.appendChild(g);
    const dest = dc.type === 'A' || viseUn(c) ? (cible ? elEn(cible) : null) : $('#joueur');
    const rd = dest ? dest.getBoundingClientRect() : r;
    requestAnimationFrame(() => Object.assign(g.style, { left: (rd.left + rd.width / 2 - 41) + 'px', top: (rd.top + rd.height / 2 - 58) + 'px', transform: 'scale(.4)', opacity: '0.2' }));
    setTimeout(() => g.remove(), 320);
  }
  C.main.splice(i, 1);
  dessinerMain();
  await pause(230);
  son(dc.type === 'A' ? 'attaque' : dc.type === 'D' ? 'bouclier' : dc.type === 'P' ? 'pouvoir' : 'sort');
  const bonus = dc.type === 'A' && C.premiereAttaque && aRel('etoileArgent') ? 8 : 0;
  for (const o of opsDe(c)) { await appliquerOp(o, cible, bonus); if (C.fini) break; }
  if (dc.type === 'A') C.premiereAttaque = false;
  // Pouvoirs déclenchés
  if (dc.type === 'A' && C.pouv.atkEcho) { for (const e of vivants()) frapperEnnemi(e, C.pouv.atkEcho, true); }
  if (dc.type === 'S' && C.pouv.sortBouc) gagnerBouclier(C.pouv.sortBouc);
  C.jouees++;
  if (dc.type === 'P') { /* le pouvoir reste actif, la carte quitte le combat */ }
  else if (epDe(c)) { C.epuisees.push(c); flotter($('#orbe'), t('fxEpuisee'), 't'); }
  else C.defausse.push(c);
  C.occupe = false;
  majTout();
  if (verifierVictoire()) return;
  // Les épines de l'ennemi peuvent épuiser le joueur pendant son propre tour
  if (C.j.pv <= 0) {
    if (aRel('plumePhenix') && !S.phenix) { S.phenix = true; C.j.pv = Math.ceil(S.pvMax / 2); grandTexte(t('fxPhenix')); son('soin'); majTout(); }
    else await defaite();
  }
}
function gagnerBouclier(n) { C.j.bouc += n; flotter($('#joueur'), '+' + n, 'b'); }
async function appliquerOp(o, cible, bonus) {
  const v = vivants();
  switch (o.k) {
    case 'deg':
      for (let k = 0; k < o.x; k++) {
        const cibles = o.tous ? vivants() : o.hasard ? [vivants()[rnd(vivants().length)]] : [cible];
        for (const e of cibles) if (e) frapperEnnemi(e, o.n + bonus);
        majTout();
        if (o.x > 1) { await pause(160); son('attaque'); }
        if (!vivants().length) break;
      }
      break;
    case 'bouc': gagnerBouclier(o.n); break;
    case 'pioche': piocher(o.n); break;
    case 'energie': C.energie += o.n; flotter($('#orbe'), '+' + o.n, 't'); break;
    case 'st': for (const e of (o.tous ? v : [cible])) if (e) donnerStatut(e, o.s, o.n); break;
    case 'soi': C.j.st[o.s] += o.n; flotter($('#joueur'), NOMST[o.s], 't'); break;
    case 'soin': { const avant = C.j.pv; C.j.pv = Math.min(S.pvMax, C.j.pv + o.n); flotter($('#joueur'), '+' + (C.j.pv - avant), 's'); son('soin'); break; }
    case 'degBouc': if (cible) frapperEnnemi(cible, C.j.bouc + bonus); break;
    case 'echo': if (cible) frapperEnnemi(cible, o.n + o.par * C.jouees + bonus); break;
    case 'siFragile': if (cible && cible.st.fragile > 0) { C.energie += o.en; flotter($('#orbe'), '+' + o.en, 't'); } break;
    case 'siDelivre': if (cible && cible.delivre) { C.energie += o.en; piocher(o.pi); flotter($('#orbe'), '+' + o.en, 't'); } break;
    case 'doubleBrul': if (cible) { cible.st.brulure *= 2; flotter(elEn(cible), t('fxBrulureX2'), 't'); son('brulure'); } break;
    case 'degBrul': if (cible && !cible.delivre && cible.st.brulure > 0) frapperEnnemi(cible, cible.st.brulure, true); break;
    case 'doubleBouc': gagnerBouclier(C.j.bouc); break;
    case 'lutins': for (let k = 0; k < o.n; k++) if (C.main.length < 10) C.main.push({ id: 'lutin', plus: 0, uid: UID++ }); break;
    case 'recycle': { const n = C.main.length; C.defausse.push(...C.main); C.main = []; piocher(n); break; }
    case 'purif': C.j.st.faible = 0; C.j.st.fragile = 0; C.j.st.brulure = 0; flotter($('#joueur'), t('fxPurifie'), 's'); break;
    case 'pouv':
      C.pouv[o.p] = (C.pouv[o.p] || 0) + o.n;
      if (o.p === 'force') C.j.st.force += o.n;
      if (o.p === 'epines') C.j.st.epines += o.n;
      flotter($('#joueur'), t('fxPouvoir'), 't'); grandTexte(TXTPOUV(o.p, o.n).split(':')[0]);
      break;
  }
  majTout();
}
function donnerStatut(e, s, n) {
  if (e.delivre) return;
  if (s === 'gel' && e.boss) { flotter(elEn(e), t('fxInsensible'), 't'); return; }
  if (s === 'brulure' && aRel('bougie')) n += 1;
  e.st[s] += n;
  flotter(elEn(e), `${NOMST[s]} ${n}`, 't');
  if (s === 'gel') son('gel'); else if (s === 'brulure') son('brulure');
}
// Le joueur frappe un ennemi (direct = sans force ni faiblesse)
function frapperEnnemi(e, base, direct) {
  if (e.delivre) return;
  let n = direct ? base : base + C.j.st.force;
  if (!direct && C.j.st.faible > 0) n = Math.floor(n * 0.75);
  if (e.st.fragile > 0) n = Math.floor(n * 1.5);
  const bloque = Math.min(e.bouc, n); e.bouc -= bloque; n -= bloque;
  e.pv -= n;
  const el = elEn(e);
  flotter(el, n > 0 ? '-' + n : t('fxBloque'), n > 0 ? 'd' : 'b');
  secouer(el && el.querySelector('.art'));
  if (!direct && e.st.epines > 0) { blesserJoueur(e.st.epines, null); flotter($('#joueur'), t('fxEpines'), 't'); }
  if (e.pv <= 0) delivrer(e); else verifierPhase(e);
}
function delivrer(e) {
  e.delivre = true; e.pv = 0; e.bouc = 0;
  const el = elEn(e);
  if (el) { el.querySelector('.art').innerHTML = creature(ENNEMIS[e.id].art, true); el.classList.add('libre'); flotter(el, t('fxDelivre'), 's'); setTimeout(() => { el.classList.remove('libre'); el.classList.add('parti'); }, 1400); }
  son('delivre');
}
function verifierPhase(e) {
  const dn = ENNEMIS[e.id];
  if (dn.rage && !e.enrage && e.pv <= e.pvMax / 2) {
    e.enrage = true; e.st.force += 3; e.motif = dn.motifRage; e.idx = 0; choisirIntention(e);
    grandTexte(t('fxColere')); secouer($('#jeu'), 'ecranSecoue'); son('coup');
  }
  if (dn.phases) {
    const r = e.pv / e.pvMax, ph = r > 0.66 ? 0 : r > 0.33 ? 1 : 2;
    if (ph > e.phase) {
      e.phase = ph; e.motif = dn.phases[ph]; e.idx = 0; choisirIntention(e);
      e.st.faible = 0; e.st.fragile = 0;
      grandTexte(t('fxPhase', { n: ph + 1 })); secouer($('#jeu'), 'ecranSecoue'); son('sceau');
    }
  }
}
// Le joueur reçoit des dégâts (source = ennemi qui attaque, pour les épines)
function blesserJoueur(n, source) {
  const bloque = Math.min(C.j.bouc, n); C.j.bouc -= bloque; n -= bloque;
  C.j.pv -= n;
  const jEl = $('#joueur');
  flotter(jEl, n > 0 ? '-' + n : t('fxBloque'), n > 0 ? 'd' : 'b');
  if (n > 0) { son('coup'); secouer(jEl); secouer($('#combat'), 'flashRouge'); if (n >= 15) secouer($('#jeu'), 'ecranSecoue'); } else son('bouclier');
  if (source && C.j.st.epines > 0 && !source.delivre) { source.pv -= C.j.st.epines; flotter(elEn(source), '-' + C.j.st.epines, 'd'); if (source.pv <= 0) delivrer(source); }
}
function piocher(n) {
  for (let k = 0; k < n; k++) {
    if (!C.pioche.length) { if (!C.defausse.length) break; C.pioche = melange(C.defausse); C.defausse = []; }
    if (C.main.length >= 10) break;
    C.main.push(C.pioche.pop());
  }
}
async function debutTourJoueur() {
  C.tour++;
  if (C.j.st.garde > 0) C.j.st.garde = 0; else C.j.bouc = 0;
  if (C.tour === 1 && aRel('coquillage')) C.j.bouc += 8;
  if (C.j.st.brulure > 0) { const n = C.j.st.brulure; C.j.pv -= n; C.j.st.brulure--; flotter($('#joueur'), '-' + n, 'd'); son('brulure'); }
  if (C.j.st.regen > 0) { C.j.pv = Math.min(S.pvMax, C.j.pv + C.j.st.regen); flotter($('#joueur'), '+' + C.j.st.regen, 's'); C.j.st.regen--; }
  if (C.pouv.phenix) C.j.pv = Math.min(S.pvMax, C.j.pv + C.pouv.phenix);
  if (C.pouv.boucTour) C.j.bouc += C.pouv.boucTour;
  if (aRel('ailesFee')) C.j.bouc += 3;
  if (C.pouv.auraFeu) for (const e of vivants()) donnerStatut(e, 'brulure', C.pouv.auraFeu);
  let energie = 3 + (C.pouv.energie || 0) + (aRel('coeurCristal') ? 1 : 0) + (C.tour === 1 && aRel('lanterne') ? 1 : 0) + (aRel('sablier') && C.tour % 3 === 0 ? 1 : 0);
  if (C.j.st.gel > 0) { energie -= C.j.st.gel; C.j.st.gel = 0; flotter($('#orbe'), t('fxGivre'), 't'); }
  C.energie = Math.max(0, energie); C.energieMax = C.energie;
  piocher(5 + (C.pouv.pioche || 0) + (aRel('grimoireDore') ? 1 : 0) + (C.tour === 1 && aRel('sacoche') ? 2 : 0));
  C.sel = -1;
  majTout();
  if (C.j.pv <= 0) { await defaite(); return; }
  // Présentation de la première carte Pouvoir piochée
  const iP = C.main.findIndex((c) => defC(c).type === 'P');
  if (iP >= 0 && !REC.vus['pouvoir']) { await pause(600); await astuce('pouvoir', [{ el: () => carteEl(iP), txt: t('tuto.pouvoir') }]); }
  const iE = C.main.findIndex((c) => epDe(c));
  if (iE >= 0 && !REC.vus['epuisee'] && S.niv >= 2) { await pause(300); await astuce('epuisee', [{ el: () => carteEl(iE), txt: t('tuto.epuisee') }]); }
}
async function finTour() {
  if (!C || C.occupe || C.fini || tutoActif) return;
  C.occupe = true; C.sel = -1; son('clic');
  C.defausse.push(...C.main); C.main = [];
  if (C.j.st.faible > 0) C.j.st.faible--;
  if (C.j.st.fragile > 0) C.j.st.fragile--;
  majTout(); info(t('tourCreatures'));
  await pause(450);
  for (const e of [...C.ennemis]) {
    if (e.delivre) continue;
    const el = elEn(e);
    e.bouc = 0;
    if (e.st.brulure > 0) { e.pv -= e.st.brulure; flotter(el, '-' + e.st.brulure, 'd'); e.st.brulure--; son('brulure'); if (e.pv <= 0) { delivrer(e); majTout(); await pause(500); continue; } verifierPhase(e); }
    if (e.st.regen > 0) { const avant = e.pv; e.pv = Math.min(e.pvMax, e.pv + e.st.regen); if (e.pv > avant) flotter(el, '+' + (e.pv - avant), 's'); }
    majTout();
    if (e.st.gel > 0) { e.st.gel--; flotter(el, t('fxGele'), 't'); son('gel'); await pause(500); }
    else await agir(e);
    if (e.st.faible > 0) e.st.faible--;
    if (e.st.fragile > 0) e.st.fragile--;
    majTout();
    if (C.j.pv <= 0) break;
  }
  if (C.j.pv <= 0) {
    if (aRel('plumePhenix') && !S.phenix) { S.phenix = true; C.j.pv = Math.ceil(S.pvMax / 2); grandTexte(t('fxPhenix')); son('soin'); await pause(900); }
    else { C.occupe = false; await defaite(); return; }
  }
  if (verifierVictoire()) return;
  for (const e of vivants()) choisirIntention(e);
  C.occupe = false;
  await debutTourJoueur();
}
async function agir(e) {
  const it = e.intention, el = elEn(e);
  if (!it) return;
  secouer(el, 'attaque');
  await pause(200);
  if (it.charge) { flotter(el, t('fxConcentration'), 't'); son('gel'); }
  if (it.b) { e.bouc += it.b; flotter(el, '+' + it.b, 'b'); son('bouclier'); }
  if (it.f) { e.st.force += it.f; flotter(el, t('fxForce', { n: it.f }), 't'); }
  if (it.a) {
    for (let k = 0; k < (it.x || 1); k++) {
      blesserJoueur(degatsEnnemi(e, it.a), e); majTout();
      await pause(it.x > 1 ? 220 : 120);
      if (C.j.pv <= 0 || e.delivre) break;
    }
  }
  if (it.brul) { C.j.st.brulure += it.brul; flotter($('#joueur'), NOMST.brulure + ' ' + it.brul, 't'); son('brulure'); }
  if (it.faible) C.j.st.faible += it.faible;
  if (it.fragile) C.j.st.fragile += it.fragile;
  if (it.gel) { C.j.st.gel += it.gel; flotter($('#orbe'), t('fxGivre'), 't'); son('gel'); }
  if (it.encre) { for (let k = 0; k < it.encre; k++) C.defausse.push({ id: 'encre', plus: 0, uid: UID++ }); flotter($('#joueur'), t('fxEncre', { n: it.encre }), 't'); }
  if (it.inv && vivants().length < 4) {
    C.ennemis.push(creerEnnemi(it.inv)); son('sort'); construireEnnemis(); flotter(elEn(C.ennemis[C.ennemis.length - 1]), t('fxBzzz'), 't');
  }
  majTout();
  await pause(380);
}
function verifierVictoire() {
  if (!C || C.fini || vivants().length) return false;
  C.fini = true;
  setTimeout(victoire, 1100);
  return true;
}

/* =====================================================================
   FIN DE COMBAT : victoire, bilan, récompenses, défaite
   ===================================================================== */
async function victoire() {
  const type = C.type, niv = C.niv, nv = NIVEAUX[niv - 1];
  S.pv = Math.max(1, C.j.pv);
  const perdus = C.pvDebut - S.pv, tours = C.tour;
  if (aRel('fiole')) soigner(5);
  let or = type === 'elite' ? 30 + rnd(10) : 10 + niv * 2 + rnd(6) + (nv.sceau ? 25 : 0);
  if (aRel('bourse')) or += 10;
  S.or += or;
  son('victoire'); confettis();
  let etoiles = 0, gain;
  if (type === 'niveau') {
    etoiles = 1 + (tours <= nv.par ? 1 : 0) + (perdus <= S.pvMax * 0.2 ? 1 : 0);
    etoiles = Math.max(1, etoiles - S.essais);
    S.etoiles[niv] = Math.max(S.etoiles[niv] || 0, etoiles);
    gain = 100 * etoiles + 5 * S.pv + (nv.sceau ? 300 : 0);
    if (nv.sceau) { S.sceaux = Math.max(S.sceaux, nv.sceau); S.pvMax += 4; soigner(10); }
  } else gain = 150 + 5 * S.pv;
  S.score += gain;
  const battu = majRecords();
  // Sauvegarde du site : on reprendra après ce combat (niveau suivant, ou même niveau après une élite).
  if (type !== 'niveau') retenirReprise({ ...clone(S), etape: 'combat' });
  else if (niv < 12) retenirReprise({ ...clone(S), niv: niv + 1, essais: 0, etape: 'choix' });
  else { JEL_SAVE.clear(JEU); pointReprise = null; } // dernier sceau : l'aventure est finie
  C = null;
  if (type === 'niveau' && nv.sceau) await animSceau(nv.sceau);
  const recomp = () => recompenses(type, nv, or);
  const titre = type === 'elite' ? t('eliteDelivree') : nv.sceau ? t('sceauBrise', { n: nv.sceau }) : t('niveauReussi', { n: niv });
  const conseils = type === 'niveau' ? `<p style="font-size:13.5px;opacity:.85">${t('conseils', { par: nv.par, tours, pv: Math.round(S.pvMax * 0.2), perdus: Math.max(0, perdus) })}${S.essais ? ' · ' + t('moinsEtoile') : ''}</p>` : '';
  ouvrirCouche(`<h2>${titre}</h2>
    ${type === 'niveau' ? `<div class="etoiles">${[0, 1, 2].map(() => `<svg viewBox="0 0 24 24">${IC.etoile.replace('class="p"', 'fill="currentColor"')}</svg>`).join('')}</div>` : ''}
    ${conseils}
    <div class="grosScore" id="cpt">${S.score - gain}</div><p>${t('gainLigne', { g: gain, or })}${nv.sceau && type === 'niveau' ? ' · ' + t('plus4PV') : ''}</p>
    ${battu ? `<span class="badge">${t('nouveauRecord')}</span>` : `<p style="font-size:14px;opacity:.8">${t('recordN', { n: REC.meilleur })}</p>`}
    <div class="ligneBtns">
      ${type === 'niveau' ? `<button class="btn g" data-f="${on(() => { son('clic'); S = clone(snap); fermerCouche(); lancerCombat(NIVEAUX[S.niv - 1].en, 'niveau'); })}">${t('rejouer')}</button>` : ''}
      <button class="btn" data-f="${on(() => { son('clic'); fermerCouche(); recomp(); })}">${t(niv === 12 && type === 'niveau' ? 'bilanFinal' : type === 'elite' ? 'continuer' : 'niveauSuivant')}</button>
    </div>`);
  majBarre(true);
  // Étoiles une par une, score qui défile
  const ets = $$('#couche .etoiles svg');
  for (let k = 0; k < etoiles; k++) { await pause(380); if (ets[k]) { ets[k].classList.add('ok'); son('etoile'); } }
  const cpt = $('#cpt'), de = S.score - gain, t0 = performance.now();
  const roule = (t) => { if (!cpt.isConnected) return; const p = Math.min(1, (t - t0) / 900); cpt.textContent = Math.round(de + gain * p); if (p < 1) requestAnimationFrame(roule); };
  requestAnimationFrame(roule);
}
function animSceau(n) {
  return new Promise((res) => {
    son('sceau'); secouer($('#jeu'), 'ecranSecoue');
    const morceaux = [[-60, -50, -40], [60, -40, 50], [-50, 60, 30], [55, 60, -60]].map(([dx, dy, r], k) => {
      const q = ['M100 100L100 20A80 80 0 0 0 20 100z', 'M100 100L180 100A80 80 0 0 0 100 20z', 'M100 100L20 100A80 80 0 0 0 100 180z', 'M100 100L100 180A80 80 0 0 0 180 100z'][k];
      return `<path class="morceau eclat" style="--dx:${dx}px;--dy:${dy}px;--r:${r}deg" d="${q}" fill="#7a3ac0" stroke="#ffd76a" stroke-width="4"/>`;
    }).join('');
    const div = document.createElement('div');
    div.className = 'sceauAnim';
    div.innerHTML = `<svg viewBox="0 0 200 200">${morceaux}<g class="eclat" style="--dx:0px;--dy:-30px;--r:0deg"><text x="100" y="118" text-anchor="middle" font-size="56" font-weight="900" fill="#ffd76a">${n}</text></g>
      <path class="fis" d="M100 22L90 70 112 96 86 130 104 178" stroke="#fff" stroke-width="4" fill="none"/></svg><h2>${t('sceauBrise', { n })}</h2><p>${t('magieRevient')}</p>`;
    $('#jeu').appendChild(div);
    setTimeout(() => confettis(70), 1300);
    setTimeout(() => { div.remove(); res(); }, 2500);
  });
}
function recompenses(type, nv, or) {
  if (type === 'niveau' && S.niv === 12) { S.niv = 13; finPartie(true); return; }
  const nbCartes = 3 + (aRel('trefle') ? 1 : 0);
  const cartes = tirerCartes(nbCartes, type === 'elite' || nv.sceau ? 1 : 0);
  let rels = [], relDon = null;
  if (type === 'elite') { relDon = tirerReliques(1, false)[0] || null; if (relDon) prendreRelique(relDon); }
  else if (nv.sceau) rels = tirerReliques(2, [2, 4, 6].includes(nv.sceau));
  let relPrise = false, cartePrise = false;
  const suite = () => {
    son('clic');
    if (type === 'niveau') { S.niv++; S.essais = 0; S.etape = 'choix'; } else S.etape = 'combat';
    carte();
  };
  const dessiner = () => {
    majBarre(true);
    ecran(`<div class="panneau"><h2>${t('recompenses')}</h2><p class="prix">${ico('piece')} ${t('plusOr', { n: or })}</p>
      ${relDon ? `<div class="section">${t('reliqueGagnee')}</div><div class="relChoix">${relHTML(relDon, true)}</div>` : ''}
      ${rels.length ? `<div class="section">${t(relPrise ? 'reliqueChoisie' : 'choisisRelique')}</div>${rels.map((id) => `<button class="relChoix ${relPrise && !S.rel.includes(id) ? 'vendu' : ''}" ${relPrise ? 'disabled' : ''} data-f="${on(() => { if (relPrise) return; relPrise = true; prendreRelique(id); son('achat'); dessiner(); })}">${relHTML(id, true)}</button>`).join('')}` : ''}
      <div class="section">${t(cartePrise ? 'carteAjoutee' : 'ajouteCarte')}</div>
      <div class="grille">${cartes.map((c) => `<button class="item ${cartePrise && !c.pris ? 'vendu' : ''}" ${cartePrise ? 'disabled' : ''} data-f="${on(() => { if (cartePrise) return; cartePrise = true; c.pris = true; S.deck.push({ id: c.id, plus: 0 }); son('sort'); dessiner(); })}">${carteHTML(c, true)}</button>`).join('')}</div>
      <button class="btn ${cartePrise && (relPrise || !rels.length) ? '' : 'g'}" data-f="${on(() => { if (rels.length && !relPrise) { son('erreur'); grandTexte(t('choisisRelique')); return; } suite(); })}">${t(cartePrise ? 'continuer' : 'passer')}</button>
    </div>`, true);
  };
  dessiner();
  astuce('recompense', [{ el: () => $('.grille .item') || $('.panneau'), txt: t('tuto.recompense') }]);
}
async function defaite() {
  C.fini = true; C.occupe = true;
  son('defaite');
  await pause(700);
  const niveau = C.type === 'niveau';
  ouvrirCouche(`<h2>${t('epuise')}</h2>
    <div style="width:110px">${MAGE}</div>
    <p>${t(niveau ? 'feeAideEtoile' : 'feeAide')}</p>
    <p style="font-size:14px;opacity:.85">${t('scoreRecord', { s: S.score, r: REC.meilleur })}</p>
    <div class="ligneBtns">
      <button class="btn" data-f="${on(() => { son('clic'); const essais = S.essais; S = clone(snap); if (niveau) S.essais = essais + 1; S.pv = Math.max(S.pv, Math.ceil(S.pvMax * 0.6)); fermerCouche(); lancerCombat(niveau ? NIVEAUX[S.niv - 1].en : ELITES[acteDe(S.niv)][rnd(2)], niveau ? 'niveau' : 'elite'); })}">${t('reessayer')}</button>
      <button class="btn g" data-f="${on(() => { son('clic'); finPartie(false); })}">${t('abandonner')}</button>
    </div>`);
}
function finPartie(gagne) {
  fermerCouche();
  const battu = majRecords();
  const sc = S.score, et = totalEtoiles(), sx = S.sceaux;
  REC.partie = null; sauver();
  JEL_SAVE.clear(JEU); partieFinie = S; pointReprise = null;
  C = null; majBarre(false);
  if (gagne) { son('victoire'); confettis(140); setTimeout(() => confettis(100), 900); }
  const amis = ['gelee', 'golem', 'reine', 'dragonnet', 'chouette', 'titan', 'gardien'].map((id) => `<div style="width:44px;display:inline-block">${creature(ENNEMIS[id].art, true)}</div>`).join('');
  ecran(`<div class="panneau" style="justify-content:center">
    <h2 style="font-size:28px">${t(gagne ? 'septBrises' : 'finAventure')}</h2>
    <p>${t(gagne ? 'finGagne' : 'finPerdu')}</p>
    <div>${amis}</div>
    <div class="grosScore">${t('points', { n: sc })}</div>
    <p>${ico('etoile')} ${t('nbEtoiles', { n: et })} · ${ico('sceau')} ${t('sceauxSur7', { n: sx })}</p>
    ${battu ? `<span class="badge">${t('nouveauRecord')}</span>` : `<p style="opacity:.8">${t('recordPoints', { n: REC.meilleur })}</p>`}
    <div class="ligneBtns">
      <button class="btn" data-f="${on(() => { son('clic'); nouvellePartie(); carte(); })}">${t('rejouer')}</button>
      <button class="btn g" data-f="${on(() => { son('clic'); accueil(); })}">${t('accueil')}</button>
    </div></div>`);
}

// Redessiner la main si la taille change (rotation du téléphone)
window.addEventListener('resize', () => { if (C && $('#main')) dessinerMain(); });

charger();
accueil();
</script>
</body>
