  "c.aube.nom": "Opération Aube Rouge",
  "c.aube.intro": "An 2291. La Coalition terrienne débarque sur Mars pour reprendre les gisements de cristaux tombés aux mains d'Hélix, une intelligence militaire devenue incontrôlable.",
  "m.aube.1.titre": "Atterrissage",
  "m.aube.1.brief": "Ton escouade s'est posée près d'un avant-poste d'Hélix. Choisis tes soldats, déplace-les et détruis tout ce qui appartient à l'ennemi.",
  "m.aube.1.astuce1": "Toucher ou clic gauche : choisir une unité. Cadre : en choisir plusieurs.",
  "m.aube.1.astuce2": "Unités choisies : touche le sol (ou clic droit) pour les déplacer, un ennemi pour l'attaquer.",
  "m.aube.1.astuce3": "Bouton Attaquer puis le sol : tes unités avancent en tirant sur tout ce qu'elles croisent.",
  "m.aube.2.titre": "Premières fondations",
  "m.aube.2.brief": "Établis une base. Tes drones récoltent les cristaux tout seuls : produis-en davantage depuis le QG et accumule 1 500 cristaux.",
  "m.aube.2.astuce1": "Choisis le QG puis le bouton du drone pour en produire un.",
  "m.aube.2.astuce2": "Un drone choisi peut bâtir : bouton Construire.",
  "m.aube.3.titre": "Tenir la crête",
  "m.aube.3.brief": "Hélix envoie des vagues d'assaut. Construis des tourelles et une caserne, et tiens 7 minutes.",
  "m.aube.3.astuce1": "Les tourelles consomment de l'énergie : garde assez de centrales.",
  "m.aube.4.titre": "Contre-attaque",
  "m.aube.4.brief": "L'usine d'assemblage est en ligne. Produis des chars Hoplite et rase la base d'Hélix.",
  "m.aube.5.titre": "Les canons du désert",
  "m.aube.5.brief": "L'artillerie Pilum est disponible. Le QG ennemi est retranché derrière des tourelles : pilonne-le à distance.",
  "m.aube.6.titre": "Tempête rouge",
  "m.aube.6.brief": "Des escadrilles d'Hélix approchent. Batteries SAM débloquées. Tiens 9 minutes.",
  "m.aube.7.titre": "Maîtrise du ciel",
  "m.aube.7.brief": "La base aérienne est opérationnelle. Construis une flotte d'intercepteurs et détruis Hélix.",
  "m.aube.8.titre": "Front commun",
  "m.aube.8.brief": "Un commandant allié (vert) te rejoint. Ensemble, éliminez les deux bases d'Hélix.",
  "m.aube.9.titre": "Le laboratoire",
  "m.aube.9.brief": "Le Centre de recherche ouvre les améliorations, le tireur d'élite, le Titan et le bombardier. Détruis le QG d'Hélix.",
  "m.aube.10.titre": "Aube rouge",
  "m.aube.10.brief": "Dernier bastion martien d'Hélix : deux commandements coordonnés. Écrase-les.",
  "c.glace.nom": "Glaciation Hélix",
  "c.glace.intro": "Hélix a fui vers les lunes de Jupiter. Sous la glace d'Europa et sur les champs de lave d'Io, l'IA reconstruit ses usines. La Coalition la poursuit.",
  "m.glace.1.titre": "Sous la glace",
  "m.glace.1.brief": "Un commando de reconnaissance doit nettoyer un relais d'Hélix sur la banquise.",
  "m.glace.2.titre": "Course aux cristaux",
  "m.glace.2.brief": "Hélix extrait les mêmes gisements. Récolte 4 000 cristaux avant d'être submergé.",
  "m.glace.3.titre": "Blizzard",
  "m.glace.3.brief": "Les vagues d'Hélix se succèdent pendant la tempête. Tiens 10 minutes.",
  "m.glace.4.titre": "Le pont de glace",
  "m.glace.4.brief": "Le QG d'Hélix contrôle le seul passage vers le pôle. Détruis-le.",
  "m.glace.5.titre": "Alliance polaire",
  "m.glace.5.brief": "Avec ton allié (vert), affronte deux commandements d'Hélix en 2 contre 2.",
  "m.glace.6.titre": "Io, la forge",
  "m.glace.6.brief": "Sur Io, une avant-garde blindée sans base doit écraser une forge d'Hélix gardée par des tourelles.",
  "m.glace.7.titre": "Fleuves de lave",
  "m.glace.7.brief": "Les coulées de lave coupent le terrain. L'aviation sera décisive. Détruis le QG d'Hélix.",
  "m.glace.8.titre": "Encerclement",
  "m.glace.8.brief": "Trois factions d'Hélix t'encerclent, mais elles se méfient aussi les unes des autres. Chacun pour soi.",
  "m.glace.9.titre": "Mer de la Tranquillité",
  "m.glace.9.brief": "Hélix s'est replié sur Séléné. Deux commandements brutaux protègent le relais orbital.",
  "m.glace.10.titre": "Cœur d'Hélix",
  "m.glace.10.brief": "Le noyau d'Hélix. Trois commandements unis contre toi. C'est la bataille finale.",
  "c.nova.nom": "Nova Ascendante",
  "c.nova.intro": "Hélix est tombée, mais ses fragments se sont dispersés dans le système solaire. Sur Titan et dans les colonies lointaines, ils construisent des Titans de combat et s'étendent de gisement en gisement. Pour les arrêter, la Coalition doit à son tour s'étendre plus vite qu'eux.",
  "m.nova.1.titre": "Relève sur Titan",
  "m.nova.1.brief": "Les gisements de Titan sont dispersés. Construis deux quartiers généraux de plus sur des gisements éloignés pour en contrôler trois au total. Hélix fera de même : sois plus rapide.",
  "m.nova.1.astuce1": "Choisis un drone, bouton Construire puis Quartier général.",
  "m.nova.1.astuce2": "Place le QG à 3 ou 4 cases d'un gisement.",
  "m.nova.1.astuce3": "Chaque QG produit ses propres drones.",
  "m.nova.2.titre": "Les prototypes",
  "m.nova.2.brief": "Hélix assemble trois Titans prototypes dans une forge d'Io. Encore inachevés, ils ne sont qu'à moitié blindés : ta colonne doit les détruire avant leur mise en service. Les prototypes sont marqués d'un losange rouge.",
  "m.nova.3.titre": "Course contre la montre",
  "m.nova.3.brief": "Une flotte d'Hélix arrive en orbite dans 14 minutes. Détruis le quartier général ennemi avant son arrivée.",
  "m.nova.4.titre": "Sauver Orion",
  "m.nova.4.brief": "La base du commandant Orion (vert) est encerclée par deux commandements d'Hélix. Il ne tiendra pas seul : s'il tombe, la mission échoue. Détruis les deux bases ennemies.",
  "m.nova.5.titre": "Guerre d'usure",
  "m.nova.5.brief": "La Coalition a besoin de cristaux pour sa flotte. Récolte 9 000 cristaux. Ton gisement principal n'y suffira pas : étends-toi, et défends tes nouvelles bases contre Hélix.",
  "m.nova.6.titre": "Ciel noir",
  "m.nova.6.brief": "Hélix lance son aviation sur ta colonie. Batteries SAM, lance-roquettes et intercepteurs seront tes meilleures armes. Tiens 10 minutes.",
  "m.nova.7.titre": "Trois fronts",
  "m.nova.7.brief": "Trois fragments d'Hélix se disputent la face cachée de Séléné. Chacun pour soi : ils se combattront aussi entre eux. Sois le dernier debout.",
  "m.nova.8.titre": "Tête de pont",
  "m.nova.8.brief": "Ton groupe d'assaut s'est posé sans base, avec cinq drones. Construis ton quartier général, développe-toi, puis détruis le QG d'Hélix.",
  "m.nova.8.astuce1": "Choisis un drone, bouton Construire puis Quartier général.",
  "m.nova.8.astuce2": "Tes soldats peuvent protéger les drones pendant la construction.",
  "m.nova.9.titre": "Chasse aux Titans",
  "m.nova.9.brief": "Quatre Titans d'élite mènent les armées d'Hélix sur Europa. Avec ton allié (vert), détruisez-les en moins de 25 minutes. Ils sont marqués d'un losange rouge.",
  "m.nova.10.titre": "Nova",
  "m.nova.10.brief": "Le dernier noyau d'Hélix s'est retranché sur Titan, protégé par deux commandements qui s'étendent sur toute la carte. Avec Orion à tes côtés, efface-les pour de bon.",
  "m.aube.4.astuce1": "Choisis l'usine puis le bouton du char. Tes nouvelles unités se rassemblent au point de ralliement.",
  "m.aube.6.astuce1": "Les batteries SAM ne tirent que sur les aéronefs : place-les près de tes bâtiments.",
  "m.aube.9.astuce1": "Les améliorations du Centre de recherche valent pour toutes tes unités.",
  "m.glace.2.astuce1": "Plus de drones sur un gisement, c'est plus de cristaux : vise trois drones par cristal.",
  "m.glace.6.astuce1": "Pas de base ici : garde tes blindés groupés et attaque les tourelles une par une.",
  "m.glace.8.astuce1": "Laisse les autres factions s'user entre elles avant de frapper.",
  "m.nova.2.astuce1": "Les Titans prototypes sont marqués d'un losange rouge. Concentre tes tirs sur eux.",
  "m.nova.5.astuce1": "Une raffinerie près d'un gisement éloigné évite à tes drones de longs trajets.",

  "c.aube.nom": "Operation Red Dawn",
  "c.aube.intro": "Year 2291. The Earth Coalition lands on Mars to take back the crystal deposits seized by Helix, a military intelligence that has gone out of control.",
  "m.aube.1.titre": "Landing",
  "m.aube.1.brief": "Your squad has touched down near a Helix outpost. Select your soldiers, move them and destroy everything the enemy owns.",
  "m.aube.1.astuce1": "Tap or left-click: select a unit. Box: select several.",
  "m.aube.1.astuce2": "With units selected, tap the ground (or right-click) to move them, or an enemy to attack it.",
  "m.aube.1.astuce3": "Attack button, then the ground: your units advance and fire at everything they meet.",
  "m.aube.2.titre": "First foundations",
  "m.aube.2.brief": "Set up a base. Your drones harvest crystals on their own: build more from the HQ and stockpile 1,500 crystals.",
  "m.aube.2.astuce1": "Select the HQ, then the drone button to produce one.",
  "m.aube.2.astuce2": "A selected drone can build: Build button.",
  "m.aube.3.titre": "Hold the ridge",
  "m.aube.3.brief": "Helix is sending assault waves. Build turrets and barracks, and hold out for 7 minutes.",
  "m.aube.3.astuce1": "Turrets use energy: keep enough power plants running.",
  "m.aube.4.titre": "Counterattack",
  "m.aube.4.brief": "The assembly plant is online. Build Hoplite tanks and wipe out the Helix base.",
  "m.aube.5.titre": "Desert guns",
  "m.aube.5.brief": "Pilum artillery is ready. The enemy HQ is dug in behind turrets: pound it from a distance.",
  "m.aube.6.titre": "Red storm",
  "m.aube.6.brief": "Helix squadrons are closing in. SAM batteries unlocked. Hold out for 9 minutes.",
  "m.aube.7.titre": "Command of the skies",
  "m.aube.7.brief": "The airfield is up and running. Build a fleet of interceptors and destroy Helix.",
  "m.aube.8.titre": "United front",
  "m.aube.8.brief": "An allied commander (green) joins you. Together, take out both Helix bases.",
  "m.aube.9.titre": "The lab",
  "m.aube.9.brief": "The Research Center unlocks upgrades, the sniper, the Titan and the bomber. Destroy the Helix HQ.",
  "m.aube.10.titre": "Red dawn",
  "m.aube.10.brief": "Helix's last stronghold on Mars: two coordinated commands. Crush them.",
  "c.glace.nom": "Helix Ice Age",
  "c.glace.intro": "Helix has fled to the moons of Jupiter. Under the ice of Europa and on the lava fields of Io, the AI is rebuilding its factories. The Coalition gives chase.",
  "m.glace.1.titre": "Under the ice",
  "m.glace.1.brief": "A recon team must clear out a Helix relay on the ice shelf.",
  "m.glace.2.titre": "Crystal rush",
  "m.glace.2.brief": "Helix is mining the same deposits. Harvest 4,000 crystals before you get overrun.",
  "m.glace.3.titre": "Blizzard",
  "m.glace.3.brief": "Helix waves keep coming during the storm. Hold out for 10 minutes.",
  "m.glace.4.titre": "The ice bridge",
  "m.glace.4.brief": "The Helix HQ controls the only way to the pole. Destroy it.",
  "m.glace.5.titre": "Polar alliance",
  "m.glace.5.brief": "With your ally (green), face two Helix commands in a 2 vs 2.",
  "m.glace.6.titre": "Io, the forge",
  "m.glace.6.brief": "On Io, an armored vanguard with no base must crush a Helix forge guarded by turrets.",
  "m.glace.7.titre": "Rivers of lava",
  "m.glace.7.brief": "Lava flows cut the map apart. Air power will decide this one. Destroy the Helix HQ.",
  "m.glace.8.titre": "Surrounded",
  "m.glace.8.brief": "Three Helix factions surround you, but they don't trust each other either. Free for all.",
  "m.glace.9.titre": "Sea of Tranquility",
  "m.glace.9.brief": "Helix has fallen back to Selene. Two brutal commands guard the orbital relay.",
  "m.glace.10.titre": "Heart of Helix",
  "m.glace.10.brief": "The Helix core. Three commands united against you. This is the final battle.",
  "c.nova.nom": "Nova Rising",
  "c.nova.intro": "Helix has fallen, but its fragments have scattered across the solar system. On Titan and in distant colonies, they are building combat Titans and spreading from deposit to deposit. To stop them, the Coalition has to expand faster than they do.",
  "m.nova.1.titre": "Taking over on Titan",
  "m.nova.1.brief": "Titan's deposits are scattered. Build two more headquarters on distant deposits so you control three in total. Helix will do the same: be faster.",
  "m.nova.1.astuce1": "Select a drone, the Build button, then Headquarters.",
  "m.nova.1.astuce2": "Place the HQ 3 or 4 tiles from a deposit.",
  "m.nova.1.astuce3": "Each HQ produces its own drones.",
  "m.nova.2.titre": "The prototypes",
  "m.nova.2.brief": "Helix is assembling three prototype Titans in a forge on Io. Still unfinished, they only have half their armor: your column must destroy them before they go into service. The prototypes are marked with a red diamond.",
  "m.nova.3.titre": "Race against time",
  "m.nova.3.brief": "A Helix fleet reaches orbit in 14 minutes. Destroy the enemy headquarters before it arrives.",
  "m.nova.4.titre": "Save Orion",
  "m.nova.4.brief": "Commander Orion's base (green) is surrounded by two Helix commands. He won't hold out alone: if he falls, the mission fails. Destroy both enemy bases.",
  "m.nova.5.titre": "War of attrition",
  "m.nova.5.brief": "The Coalition needs crystals for its fleet. Harvest 9,000 crystals. Your main deposit won't be enough: expand, and defend your new bases against Helix.",
  "m.nova.6.titre": "Black sky",
  "m.nova.6.brief": "Helix sends its air force at your colony. SAM batteries, rocket troopers and interceptors will be your best weapons. Hold out for 10 minutes.",
  "m.nova.7.titre": "Three fronts",
  "m.nova.7.brief": "Three Helix fragments are fighting over the far side of Selene. Free for all: they'll fight each other too. Be the last one standing.",
  "m.nova.8.titre": "Beachhead",
  "m.nova.8.brief": "Your strike team has landed with no base and five drones. Build your headquarters, grow, then destroy the Helix HQ.",
  "m.nova.8.astuce1": "Select a drone, the Build button, then Headquarters.",
  "m.nova.8.astuce2": "Your soldiers can protect the drones while they build.",
  "m.nova.9.titre": "Titan hunt",
  "m.nova.9.brief": "Four elite Titans lead the Helix armies on Europa. With your ally (green), destroy them in under 25 minutes. They are marked with a red diamond.",
  "m.nova.10.titre": "Nova",
  "m.nova.10.brief": "The last Helix core has dug in on Titan, protected by two commands spreading across the whole map. With Orion at your side, wipe them out for good.",
  "m.aube.4.astuce1": "Select the plant, then the tank button. Your new units gather at the rally point.",
  "m.aube.6.astuce1": "SAM batteries only fire at aircraft: place them near your buildings.",
  "m.aube.9.astuce1": "Research Center upgrades apply to all your units.",
  "m.glace.2.astuce1": "More drones on a deposit means more crystals: aim for three drones per crystal.",
  "m.glace.6.astuce1": "No base here: keep your armor together and take out the turrets one by one.",
  "m.glace.8.astuce1": "Let the other factions wear each other down before you strike.",
  "m.nova.2.astuce1": "The prototype Titans are marked with a red diamond. Focus your fire on them.",
  "m.nova.5.astuce1": "A refinery near a distant deposit saves your drones long trips.",

  "c.aube.intro": "Año 2291. La Coalición terrestre desembarca en Marte para recuperar los yacimientos de cristales que cayeron en manos de Hélix, una inteligencia militar que se volvió incontrolable.",
  "m.aube.1.titre": "Aterrizaje",

  "m.glace.10.brief": "El núcleo de Hélix. Tres mandos unidos contra ti. Es la batalla final.",
  "c.nova.nom": "Nova Ascendente",
  "c.nova.intro": "Hélix ha caído, pero sus fragmentos se han dispersado por el sistema solar. En Titán y en las colonias lejanas construyen Titanes de combate y se expanden de yacimiento en yacimiento. Para detenerlos, la Coalición debe expandirse más rápido que ellos.",
  "m.nova.1.titre": "Relevo en Titán",
  "m.nova.1.brief": "Los yacimientos de Titán están dispersos. Construye dos cuarteles generales más en yacimientos lejanos para controlar tres en total. Hélix hará lo mismo: sé más rápido.",
  "m.nova.1.astuce1": "Elige un dron, botón Construir y luego Cuartel general.",
  "m.nova.1.astuce2": "Coloca el CG a 3 o 4 casillas de un yacimiento.",
  "m.nova.1.astuce3": "Cada CG produce sus propios drones.",
  "m.nova.2.titre": "Los prototipos",
  "m.nova.2.brief": "Hélix ensambla tres Titanes prototipo en una forja de Io. Aún sin terminar, solo tienen la mitad del blindaje: tu columna debe destruirlos antes de que entren en servicio. Los prototipos llevan un rombo rojo.",
  "m.nova.3.titre": "Contrarreloj",
  "m.nova.3.brief": "Una flota de Hélix llegará a la órbita dentro de 14 minutos. Destruye el cuartel general enemigo antes de que llegue.",
  "m.nova.4.titre": "Salvar a Orión",
  "m.nova.4.brief": "La base del comandante Orión (verde) está rodeada por dos mandos de Hélix. No resistirá solo: si cae, la misión fracasa. Destruye las dos bases enemigas.",
  "m.nova.5.titre": "Guerra de desgaste",
  "m.nova.5.brief": "La Coalición necesita cristales para su flota. Recolecta 9 000 cristales. Tu yacimiento principal no bastará: expándete y defiende tus nuevas bases contra Hélix.",
  "m.nova.6.titre": "Cielo negro",
  "m.nova.6.brief": "Hélix lanza su aviación contra tu colonia. Las baterías SAM, los lanzacohetes y los interceptores serán tus mejores armas. Resiste 10 minutos.",
  "m.nova.7.titre": "Tres frentes",
  "m.nova.7.brief": "Tres fragmentos de Hélix se disputan la cara oculta de Selene. Todos contra todos: también lucharán entre ellos. Sé el último en pie.",
  "m.nova.8.titre": "Cabeza de puente",
  "m.nova.8.brief": "Tu grupo de asalto ha aterrizado sin base, con cinco drones. Construye tu cuartel general, crece y luego destruye el CG de Hélix.",
  "m.nova.8.astuce1": "Elige un dron, botón Construir y luego Cuartel general.",
  "m.nova.8.astuce2": "Tus soldados pueden proteger a los drones mientras construyen.",
  "m.nova.9.titre": "Caza de Titanes",
  "m.nova.9.brief": "Cuatro Titanes de élite dirigen los ejércitos de Hélix en Europa. Con tu aliado (verde), destrúyanlos en menos de 25 minutos. Llevan un rombo rojo.",
  "m.nova.10.titre": "Nova",
  "m.nova.10.brief": "El último núcleo de Hélix se ha atrincherado en Titán, protegido por dos mandos que se extienden por todo el mapa. Con Orión a tu lado, bórralos para siempre.",
  "m.aube.4.astuce1": "Elige la fábrica y luego el botón del tanque. Tus nuevas unidades se reúnen en el punto de reunión.",
  "m.aube.6.astuce1": "Las baterías SAM solo disparan a las aeronaves: colócalas cerca de tus edificios.",
  "m.aube.9.astuce1": "Las mejoras del Centro de investigación se aplican a todas tus unidades.",
  "m.glace.2.astuce1": "Más drones en un yacimiento significan más cristales: apunta a tres drones por cristal.",
  "m.glace.6.astuce1": "Aquí no hay base: mantén tus blindados agrupados y ataca las torretas una por una.",
  "m.glace.8.astuce1": "Deja que las otras facciones se desgasten entre sí antes de atacar.",
  "m.nova.2.astuce1": "Los Titanes prototipo llevan un rombo rojo. Concentra tus disparos en ellos.",
  "m.nova.5.astuce1": "Una refinería cerca de un yacimiento lejano ahorra a tus drones largos trayectos.",

  "c.aube.nom": "Operação Aurora Vermelha",
  "c.aube.intro": "Ano 2291. A Coalizão Terrestre desembarca em Marte para retomar as jazidas de cristais que caíram nas mãos de Hélix, uma inteligência militar que saiu do controle.",
  "m.aube.1.titre": "Pouso",
  "m.aube.1.brief": "Seu esquadrão pousou perto de um posto avançado de Hélix. Escolha seus soldados, mova-os e destrua tudo o que pertence ao inimigo.",
  "m.aube.1.astuce1": "Toque ou clique esquerdo: escolher uma unidade. Seleção: escolher várias.",
  "m.aube.1.astuce2": "Com unidades escolhidas: toque no chão (ou clique direito) para movê-las, num inimigo para atacá-lo.",
  "m.aube.1.astuce3": "Botão Atacar e depois o chão: suas unidades avançam atirando em tudo o que encontram.",
  "m.aube.2.titre": "Primeiros alicerces",
  "m.aube.2.brief": "Monte uma base. Seus drones coletam cristais sozinhos: produza mais no QG e junte 1 500 cristais.",
  "m.aube.2.astuce1": "Escolha o QG e depois o botão do drone para produzir um.",
  "m.aube.2.astuce2": "Um drone escolhido pode construir: botão Construir.",
  "m.aube.3.titre": "Segurar a crista",
  "m.aube.3.brief": "Hélix manda ondas de ataque. Construa torres e um quartel, e resista por 7 minutos.",
  "m.aube.3.astuce1": "As torres consomem energia: tenha usinas suficientes.",
  "m.aube.4.titre": "Contra-ataque",
  "m.aube.4.brief": "A fábrica de montagem está funcionando. Produza tanques Hoplita e arrase a base de Hélix.",
  "m.aube.5.titre": "Os canhões do deserto",
  "m.aube.5.brief": "A artilharia Pilum está disponível. O QG inimigo está entrincheirado atrás de torres: bombardeie de longe.",
  "m.aube.6.titre": "Tempestade vermelha",
  "m.aube.6.brief": "Esquadrilhas de Hélix se aproximam. Baterias SAM liberadas. Resista por 9 minutos.",
  "m.aube.7.titre": "Domínio do céu",
  "m.aube.7.brief": "A base aérea está operacional. Monte uma frota de interceptadores e destrua Hélix.",
  "m.aube.8.titre": "Frente unida",
  "m.aube.8.brief": "Um comandante aliado (verde) se junta a você. Juntos, eliminem as duas bases de Hélix.",
  "m.aube.9.titre": "O laboratório",
  "m.aube.9.brief": "O Centro de pesquisa libera as melhorias, o atirador de elite, o Titã e o bombardeiro. Destrua o QG de Hélix.",
  "m.aube.10.titre": "Aurora vermelha",
  "m.aube.10.brief": "Último bastião de Hélix em Marte: dois comandos coordenados. Esmague os dois.",
  "c.glace.nom": "Glaciação Hélix",
  "c.glace.intro": "Hélix fugiu para as luas de Júpiter. Sob o gelo de Europa e nos campos de lava de Io, a IA reconstrói suas fábricas. A Coalizão vai atrás dela.",
  "m.glace.1.titre": "Sob o gelo",
  "m.glace.1.brief": "Um comando de reconhecimento precisa limpar um posto de retransmissão de Hélix no gelo.",
  "m.glace.2.titre": "Corrida dos cristais",
  "m.glace.2.brief": "Hélix explora as mesmas jazidas. Colete 4 000 cristais antes de ser engolido.",
  "m.glace.3.titre": "Nevasca",
  "m.glace.3.brief": "As ondas de Hélix não param durante a tempestade. Resista por 10 minutos.",
  "m.glace.4.titre": "A ponte de gelo",
  "m.glace.4.brief": "O QG de Hélix controla a única passagem para o polo. Destrua-o.",
  "m.glace.5.titre": "Aliança polar",
  "m.glace.5.brief": "Com seu aliado (verde), enfrente dois comandos de Hélix num 2 contra 2.",
  "m.glace.6.titre": "Io, a forja",
  "m.glace.6.brief": "Em Io, uma vanguarda blindada sem base precisa esmagar uma forja de Hélix protegida por torres.",
  "m.glace.7.titre": "Rios de lava",
  "m.glace.7.brief": "Os rios de lava cortam o terreno. A aviação vai decidir. Destrua o QG de Hélix.",
  "m.glace.8.titre": "Cerco",
  "m.glace.8.brief": "Três facções de Hélix cercam você, mas também desconfiam umas das outras. Cada um por si.",
  "m.glace.9.titre": "Mar da Tranquilidade",
  "m.glace.9.brief": "Hélix recuou para Selene. Dois comandos brutais protegem a estação orbital.",
  "m.glace.10.titre": "Coração de Hélix",
  "m.glace.10.brief": "O núcleo de Hélix. Três comandos unidos contra você. É a batalha final.",
  "c.nova.nom": "Nova Ascendente",
  "c.nova.intro": "Hélix caiu, mas seus fragmentos se espalharam pelo sistema solar. Em Titã e nas colônias distantes, eles constroem Titãs de combate e se expandem de jazida em jazida. Para detê-los, a Coalizão precisa se expandir mais rápido que eles.",
  "m.nova.1.titre": "Reforço em Titã",
  "m.nova.1.brief": "As jazidas de Titã estão espalhadas. Construa mais dois quartéis-generais em jazidas distantes para controlar três no total. Hélix fará o mesmo: seja mais rápido.",
  "m.nova.1.astuce1": "Escolha um drone, botão Construir e depois Quartel-general.",
  "m.nova.1.astuce2": "Ponha o QG a 3 ou 4 casas de uma jazida.",
  "m.nova.1.astuce3": "Cada QG produz seus próprios drones.",
  "m.nova.2.titre": "Os protótipos",
  "m.nova.2.brief": "Hélix monta três Titãs protótipos numa forja de Io. Ainda inacabados, estão só meio blindados: sua coluna precisa destruí-los antes que entrem em serviço. Os protótipos têm um losango vermelho.",
  "m.nova.3.titre": "Contra o relógio",
  "m.nova.3.brief": "Uma frota de Hélix chega em órbita em 14 minutos. Destrua o quartel-general inimigo antes que ela chegue.",
  "m.nova.4.titre": "Salvar Órion",
  "m.nova.4.brief": "A base do comandante Órion (verde) está cercada por dois comandos de Hélix. Ele não vai aguentar sozinho: se ele cair, a missão fracassa. Destrua as duas bases inimigas.",
  "m.nova.5.titre": "Guerra de desgaste",
  "m.nova.5.brief": "A Coalizão precisa de cristais para sua frota. Colete 9 000 cristais. Sua jazida principal não vai bastar: expanda-se e defenda suas novas bases contra Hélix.",
  "m.nova.6.titre": "Céu negro",
  "m.nova.6.brief": "Hélix lança sua aviação contra sua colônia. Baterias SAM, lança-foguetes e interceptadores serão suas melhores armas. Resista por 10 minutos.",
  "m.nova.7.titre": "Três frentes",
  "m.nova.7.brief": "Três fragmentos de Hélix disputam o lado oculto de Selene. Cada um por si: eles também vão lutar entre si. Seja o último de pé.",
  "m.nova.8.titre": "Cabeça de ponte",
  "m.nova.8.brief": "Seu grupo de assalto pousou sem base, com cinco drones. Construa seu quartel-general, cresça e depois destrua o QG de Hélix.",
  "m.nova.8.astuce1": "Escolha um drone, botão Construir e depois Quartel-general.",
  "m.nova.8.astuce2": "Seus soldados podem proteger os drones durante a construção.",
  "m.nova.9.titre": "Caça aos Titãs",
  "m.nova.9.brief": "Quatro Titãs de elite lideram os exércitos de Hélix em Europa. Com seu aliado (verde), destruam todos em menos de 25 minutos. Eles têm um losango vermelho.",
  "m.nova.10.titre": "Nova",
  "m.nova.10.brief": "O último núcleo de Hélix se entrincheirou em Titã, protegido por dois comandos que se espalham pelo mapa inteiro. Com Órion ao seu lado, apague-os de vez.",
  "m.aube.4.astuce1": "Escolha a fábrica e depois o botão do tanque. Suas novas unidades se reúnem no ponto de encontro.",
  "m.aube.6.astuce1": "As baterias SAM só atiram em aeronaves: ponha-as perto dos seus edifícios.",
  "m.aube.9.astuce1": "As melhorias do Centro de pesquisa valem para todas as suas unidades.",
  "m.glace.2.astuce1": "Mais drones numa jazida significa mais cristais: mire em três drones por cristal.",
  "m.glace.6.astuce1": "Aqui não há base: mantenha seus blindados juntos e ataque as torres uma por uma.",
  "m.glace.8.astuce1": "Deixe as outras facções se desgastarem entre si antes de atacar.",
  "m.nova.2.astuce1": "Os Titãs protótipos têm um losango vermelho. Concentre seus tiros neles.",
  "m.nova.5.astuce1": "Uma refinaria perto de uma jazida distante poupa seus drones de longas viagens.",

  "th.mars.nom": "Mars — Arcadia-Ebene",

  "th.moon.nom": "Selene — Regolithmeere",

  "c.aube.nom": "Operation Rote Dämmerung",
  "c.aube.intro": "Im Jahr 2291 landet die irdische Koalition auf dem Mars, um die Kristallvorkommen zurückzuholen. Sie sind Helix in die Hände gefallen, einer militärischen KI, die außer Kontrolle geraten ist.",
  "m.aube.1.titre": "Landung",
  "m.aube.1.brief": "Dein Trupp ist nahe einem Außenposten von Helix gelandet. Wähle deine Soldaten, bewege sie und zerstöre alles, was dem Feind gehört.",
  "m.aube.1.astuce1": "Antippen oder Linksklick: eine Einheit wählen. Rahmen: mehrere wählen.",
  "m.aube.1.astuce2": "Einheiten gewählt: Tippe auf den Boden (oder Rechtsklick), um sie zu bewegen, auf einen Gegner, um ihn anzugreifen.",
  "m.aube.1.astuce3": "Schaltfläche Angriff, dann der Boden: Deine Einheiten rücken vor und feuern auf alles, was ihnen begegnet.",
  "m.aube.2.titre": "Erste Fundamente",
  "m.aube.2.brief": "Errichte eine Basis. Deine Drohnen sammeln die Kristalle von selbst: Baue im HQ weitere und sammle 1 500 Kristalle.",
  "m.aube.2.astuce1": "Wähle das HQ und dann die Drohnen-Schaltfläche, um eine zu bauen.",
  "m.aube.2.astuce2": "Eine gewählte Drohne kann bauen: Schaltfläche Bauen.",
  "m.aube.3.titre": "Den Kamm halten",
  "m.aube.3.brief": "Helix schickt Angriffswellen. Baue Geschütztürme und eine Kaserne und halte 7 Minuten durch.",
  "m.aube.3.astuce1": "Geschütztürme verbrauchen Energie: Sorge für genug Kraftwerke.",
  "m.aube.4.titre": "Gegenangriff",
  "m.aube.4.brief": "Das Montagewerk läuft. Baue Hoplit-Panzer und mach die Basis von Helix dem Erdboden gleich.",
  "m.aube.5.titre": "Die Kanonen der Wüste",
  "m.aube.5.brief": "Die Pilum-Artillerie ist verfügbar. Das feindliche HQ hat sich hinter Geschütztürmen verschanzt: Beschieß es aus der Ferne.",
  "m.aube.6.titre": "Roter Sturm",
  "m.aube.6.brief": "Staffeln von Helix nähern sich. SAM-Batterien freigeschaltet. Halte 9 Minuten durch.",
  "m.aube.7.titre": "Luftherrschaft",
  "m.aube.7.brief": "Die Luftwaffenbasis ist einsatzbereit. Baue eine Flotte Abfangjäger und zerstöre Helix.",
  "m.aube.8.titre": "Gemeinsame Front",
  "m.aube.8.brief": "Ein verbündeter Kommandant (grün) schließt sich dir an. Vernichtet gemeinsam beide Basen von Helix.",
  "m.aube.9.titre": "Das Labor",
  "m.aube.9.brief": "Das Forschungszentrum schaltet Verbesserungen, den Scharfschützen, den Titan und den Bomber frei. Zerstöre das HQ von Helix.",
  "m.aube.10.titre": "Rote Dämmerung",
  "m.aube.10.brief": "Die letzte Bastion von Helix auf dem Mars: zwei abgestimmte Kommandos. Zerschmettere sie.",
  "c.glace.nom": "Eiszeit Helix",
  "c.glace.intro": "Helix ist zu den Jupitermonden geflohen. Unter dem Eis von Europa und auf den Lavafeldern von Io baut die KI ihre Fabriken wieder auf. Die Koalition verfolgt sie.",
  "m.glace.1.titre": "Unter dem Eis",
  "m.glace.1.brief": "Ein Aufklärungskommando soll eine Relaisstation von Helix auf dem Packeis säubern.",
  "m.glace.2.titre": "Wettlauf um Kristalle",
  "m.glace.2.brief": "Helix baut dieselben Vorkommen ab. Sammle 4 000 Kristalle, bevor du überrannt wirst.",
  "m.glace.3.titre": "Schneesturm",
  "m.glace.3.brief": "Im Sturm folgt eine Welle von Helix auf die nächste. Halte 10 Minuten durch.",
  "m.glace.4.titre": "Die Eisbrücke",
  "m.glace.4.brief": "Das HQ von Helix kontrolliert den einzigen Weg zum Pol. Zerstöre es.",
  "m.glace.5.titre": "Polarbündnis",
  "m.glace.5.brief": "Stell dich mit deinem Verbündeten (grün) zwei Kommandos von Helix im 2 gegen 2.",
  "m.glace.6.titre": "Io, die Schmiede",
  "m.glace.6.brief": "Auf Io muss eine gepanzerte Vorhut ohne Basis eine Schmiede von Helix zerschlagen, die von Geschütztürmen bewacht wird.",
  "m.glace.7.titre": "Lavaströme",
  "m.glace.7.brief": "Lavaströme zerschneiden das Gelände. Die Luftwaffe wird entscheidend sein. Zerstöre das HQ von Helix.",
  "m.glace.8.titre": "Eingekesselt",
  "m.glace.8.brief": "Drei Fraktionen von Helix kesseln dich ein, aber sie trauen auch einander nicht. Jeder gegen jeden.",
  "m.glace.9.titre": "Meer der Ruhe",
  "m.glace.9.brief": "Helix hat sich auf Selene zurückgezogen. Zwei brutale Kommandos schützen die Orbitalstation.",
  "m.glace.10.titre": "Herz von Helix",
  "m.glace.10.brief": "Der Kern von Helix. Drei vereinte Kommandos gegen dich. Das ist die Endschlacht.",
  "c.nova.nom": "Aufsteigende Nova",
  "c.nova.intro": "Helix ist gefallen, doch ihre Bruchstücke haben sich im Sonnensystem verstreut. Auf Titan und in fernen Kolonien bauen sie Kampf-Titanen und breiten sich von Vorkommen zu Vorkommen aus. Um sie aufzuhalten, muss sich die Koalition nun selbst schneller ausbreiten als sie.",
  "m.nova.1.titre": "Ablösung auf Titan",
  "m.nova.1.brief": "Die Vorkommen auf Titan liegen weit verstreut. Baue zwei weitere Hauptquartiere an entfernten Vorkommen, damit du insgesamt drei kontrollierst. Helix macht das Gleiche: Sei schneller.",
  "m.nova.1.astuce1": "Wähle eine Drohne, dann Bauen und Hauptquartier.",
  "m.nova.1.astuce2": "Setze das HQ 3 oder 4 Felder von einem Vorkommen entfernt.",
  "m.nova.1.astuce3": "Jedes HQ baut seine eigenen Drohnen.",
  "m.nova.2.titre": "Die Prototypen",
  "m.nova.2.brief": "Helix montiert in einer Schmiede auf Io drei Titan-Prototypen. Noch sind sie unfertig und nur halb gepanzert: Deine Kolonne muss sie zerstören, bevor sie in Dienst gehen. Die Prototypen sind mit einer roten Raute markiert.",
  "m.nova.3.titre": "Wettlauf gegen die Zeit",
  "m.nova.3.brief": "Eine Flotte von Helix erreicht in 14 Minuten den Orbit. Zerstöre das feindliche Hauptquartier vor ihrer Ankunft.",
  "m.nova.4.titre": "Orion retten",
  "m.nova.4.brief": "Die Basis von Kommandant Orion (grün) ist von zwei Kommandos von Helix umzingelt. Allein hält er nicht durch: Fällt er, scheitert die Mission. Zerstöre beide feindlichen Basen.",
  "m.nova.5.titre": "Zermürbungskrieg",
  "m.nova.5.brief": "Die Koalition braucht Kristalle für ihre Flotte. Sammle 9 000 Kristalle. Dein Hauptvorkommen reicht dafür nicht: Breite dich aus und verteidige deine neuen Basen gegen Helix.",
  "m.nova.6.titre": "Schwarzer Himmel",
  "m.nova.6.brief": "Helix schickt ihre Luftwaffe gegen deine Kolonie. SAM-Batterien, Raketenwerfer und Abfangjäger sind deine besten Waffen. Halte 10 Minuten durch.",
  "m.nova.7.titre": "Drei Fronten",
  "m.nova.7.brief": "Drei Bruchstücke von Helix streiten um die Rückseite von Selene. Jeder gegen jeden: Sie kämpfen auch untereinander. Sei der Letzte, der noch steht.",
  "m.nova.8.titre": "Brückenkopf",
  "m.nova.8.brief": "Dein Angriffstrupp ist ohne Basis gelandet, mit fünf Drohnen. Baue dein Hauptquartier, wachse und zerstöre dann das HQ von Helix.",
  "m.nova.8.astuce1": "Wähle eine Drohne, dann Bauen und Hauptquartier.",
  "m.nova.8.astuce2": "Deine Soldaten können die Drohnen beim Bauen schützen.",
  "m.nova.9.titre": "Titanenjagd",
  "m.nova.9.brief": "Vier Elite-Titanen führen die Armeen von Helix auf Europa an. Zerstört sie mit deinem Verbündeten (grün) in weniger als 25 Minuten. Sie sind mit einer roten Raute markiert.",
  "m.nova.10.titre": "Nova",
  "m.nova.10.brief": "Der letzte Kern von Helix hat sich auf Titan verschanzt, geschützt von zwei Kommandos, die sich über die ganze Karte ausbreiten. Mit Orion an deiner Seite löschst du sie endgültig aus.",
  "m.aube.4.astuce1": "Wähle das Montagewerk und dann die Panzer-Schaltfläche. Neue Einheiten sammeln sich am Sammelpunkt.",
  "m.aube.6.astuce1": "SAM-Batterien schießen nur auf Flugzeuge: Stell sie nahe deinen Gebäuden auf.",
  "m.aube.9.astuce1": "Die Verbesserungen des Forschungszentrums gelten für alle deine Einheiten.",
  "m.glace.2.astuce1": "Mehr Drohnen an einem Vorkommen bringen mehr Kristalle: Ziel sind drei Drohnen pro Kristall.",
  "m.glace.6.astuce1": "Hier gibt es keine Basis: Halte deine Panzer zusammen und greif die Geschütztürme einzeln an.",
  "m.glace.8.astuce1": "Lass die anderen Fraktionen sich gegenseitig schwächen, bevor du zuschlägst.",
  "m.nova.2.astuce1": "Die Titan-Prototypen sind mit einer roten Raute markiert. Konzentriere dein Feuer auf sie.",
  "m.nova.5.astuce1": "Eine Raffinerie nahe einem entfernten Vorkommen erspart deinen Drohnen lange Wege.",

<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }

  function surFermeture(f) {

    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');

    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {

    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }

      b.classList.remove('armer');
      clear(jeu);

  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)

  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();

      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<script id="jel-tr">
/* ==========================================================================
   Free Micro Games — moteur commun des jeux en temps réel          jel-tr v2
   JavaScript pur, sans dépendance. Cadrage : docs/cadrage-temps-reel.md.

   Le même fichier sert à quatre endroits :
     - dans chaque jeu temps réel, recopié tel quel dans index.html (bloc
       jel-tr, juste après jel-sauvegarde) par node scripts/i18n-jeu.mjs :
       window.JEL_TR ;
     - dans le lanceur du site (public/temps-reel/lanceur.js), qui l'importe
       pour le cadenceur du pair horloge ;
     - dans le Worker Cloudflare commun (multijoueur/src/temps-reel/), qui fait
       tourner le cadenceur et la simulation des parties relayées ;
     - dans les tests (scripts/tester-temps-reel.mjs).

   La simulation d'un jeu (bloc jel-sim, objet window.JEL_SIM) est faite de
   fonctions pures sur un état entièrement entier (ou, avec flottants: true, en
   nombres à virgule calculés seulement avec + − × ÷ et JEL_TR.flottant) :
     camps          nombre de camps, au plus (2 à 8) ; une partie peut en avoir
                    moins (config.camps) ; le camp « système » vaut toujours camps
     periodeBot     un robot réfléchit tous les periodeBot ticks
     depart(graine, config)          état de départ (graine : entier 32 bits)
     valide(etat, camp, ordre)       ordre permis ? (ordre : [type, a, b, …], entiers, type ≥ 1, ORDRE_MAX au plus)
     ordre(etat, camp, ordre)        applique un ordre déjà validé
     pas(etat, alea)                 avance d'un tick
     bot(etat, camp, niveau, alea)   ordres d'un robot (niveau 1 facile, 2 moyen, 3 difficile)
     fin(etat)                       null, ou { gagnant, scores }
   Facultatif, pour un état qui n'est pas un simple objet JSON (grilles, index…) :
     flottants: true                 l'état contient des nombres à virgule (voir JEL_TR.flottant)
     exporter(etat)                  objet JSON de l'état (instantané : envoyé, gardé, rejoué)
     importer(donnees)               état rebâti depuis exporter(etat)
     empreinte(etat)                 ce qui est haché pour comparer deux appareils
     modes                           modes de partie en ligne (plus de 2 joueurs, équipes) :
                                     { <id>: { equipes: [équipe de chaque camp], robots: [camps
                                     toujours tenus par un robot] } } ; le premier est le mode par
                                     défaut ; sans modes : 1 contre 1 (configMode)
     cartes                          cartes qu'un joueur peut choisir en ligne (identifiants)
   alea(n) donne un entier de 0 à n − 1 tiré du hasard gardé DANS l'état
   (etat.a) : deux appareils partis du même état tirent la même suite.
   Le moteur gère lui-même etat.k (numéro du tick) et etat.ctl (qui tient
   chaque camp : 0 = un humain, 1 à 3 = un robot de ce niveau).

   Un tick se joue toujours ainsi (ordre fixe, le même partout) :
     1. ordres de contrôle (camp « système » = camps) : etat.ctl change ;
     2. ordres des humains, triés par camp puis numéro de séquence ;
        un ordre d'un camp tenu par un robot ou refusé par valide est ignoré ;
     3. robots, dans l'ordre des camps, tous les periodeBot ticks ;
     4. pas(etat).
   Paquet d'un tick : { t: 'k', k, o: [[camp, seq, type, a, b, c], …] }.

   Le CADENCEUR est l'horloge d'une partie : il numérote les ticks, donne à
   chaque ordre reçu le tick courant + delai (délai d'entrée) et diffuse un
   paquet par tick, même vide. Il tourne sur l'appareil (partie contre le
   robot), chez le pair horloge (pair-à-pair) ou dans le Durable Object
   (partie relayée) : les appareils, eux, ne font que jouer les paquets.

   Ce fichier ne doit contenir aucune balise script (ni ouverture ni fermeture) :
   il est recopié dans le jeu.
   ========================================================================== */
(function (racine) {
  'use strict';
  if (racine.JEL_TR) return;

  var PROTOCOLE = 2;                 // 2 : modes à plusieurs joueurs (recherche, pair-à-pair en étoile)
  var CAMPS_MAX = 8;
  var T_CONTROLE = 0;                // type réservé aux ordres de contrôle (camp système)
  var ORDRE_MAX = 200;               // nombres d'un ordre, au plus (type compris : unités choisies d'un jeu de stratégie)

  // Réglages communs (tous paramétrables par la partie ou le jeu).
  var REGLAGES = {
    tickMs: 100,                     // durée d'un tick
    delaiEntree: 2,                  // un ordre reçu au tick k est joué au tick k + delaiEntree
    hashTous: 50,                    // hachage de l'état tous les N ticks
    instantaneTous: 300,             // instantané gardé tous les N ticks (30 s)
    rattrapageMax: 50,               // ticks rejoués au plus par appel de la boucle (jamais de gel)
    reserve: 2,                      // paquets gardés d'avance pour lisser le réseau
    rechercheMs: 15000,              // recherche d'un adversaire, au plus
    connexionMs: 12000,              // adversaire trouvé, mais aucune partie au bout de ce délai : robot
    lancementMs: 4000,               // partie à plus de 2 lancée : réponse du serveur attendue au plus ce délai
  };

  // --- Outils entiers --------------------------------------------------------

  function copie(x) { return x === undefined ? undefined : JSON.parse(JSON.stringify(x)); }

  // Hasard gardé dans l'état (mulberry32 sur etat.a) : renvoie un entier 32 bits non signé.
  function tirer(etat) {
    var a = ((etat.a >>> 0) + 0x6D2B79F5) >>> 0;

  //   surEvenement  function (e) :
