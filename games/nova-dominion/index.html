      SPRITES.u[t + ci] = { body, tur, S, shadow: ci === 0 ? null : SPRITES.u[t + 0].shadow };
      if (ci === 0) {
        const tmp = mk(S, S), tc = tmp.getContext('2d'); tc.drawImage(body, 0, 0); if (tur) tc.drawImage(tur, 0, 0);
        SPRITES.u[t + ci].shadow = blurred(shadowOf(tmp, UT[t].fly ? .32 : .5), UT[t].fly ? 4 : 2);
      }

      const cv = mk((W + M * 2) * SPR, (H + M * 2) * SPR), c = cv.getContext('2d');
      c.scale(SPR, SPR); c.translate(M, M);

      BPAINT[t](sc, col, W, H);
      const sh = blurred(shadowOf(st, .55), 5);
      pad(c, W, H);
      c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(sh, 9 * SPR, 10 * SPR); c.restore();
      c.drawImage(st, -M, -M, W + M * 2, H + M * 2);
      // version « en construction » : socle seul
      const pv = mk((W + M * 2) * SPR, (H + M * 2) * SPR), pc = pv.getContext('2d'); pc.scale(SPR, SPR); pc.translate(M, M); pad(pc, W, H);

    const r = mulberry32(v * 97 + 5);

      c.fillStyle = 'rgba(0,0,0,.35)'; poly(c, [s0.bx - px, s0.by - py, s0.bx + px, s0.by + py, s0.bx + px + s0.h * .55, s0.by + py + s0.h * .4, s0.bx + s0.h * .62, s0.by + s0.h * .45]); c.fill();

  glow('red', 'rgba(255,170,150,1)', 'rgba(255,40,20,.45)');
  glow('cyan', 'rgba(220,255,255,1)', 'rgba(40,220,255,.45)');
  glow('green', 'rgba(220,255,220,1)', 'rgba(60,255,120,.45)');
  glow('blue', 'rgba(220,235,255,1)', 'rgba(70,140,255,.45)');
  glow('violet', 'rgba(250,220,255,1)', 'rgba(190,80,255,.45)');

    const S = 64, cv = mk(S, S), c = cv.getContext('2d'); const r = mulberry32(name.length * 13);

      const tb = t + k * .5;
      osc(tb, .35, 'sine', mtof(ch[0] - 24), 0, k % 4 === 0 ? .22 : .1, AU.musG, .01);
      if (Math.random() < .35) osc(tb, .4, 'triangle', mtof(ch[(k * 7) % 3] + 12 + (Math.random() < .3 ? 12 : 0)), 0, .5, arpG, .005);

function pickAt(wx, wy, r = 0) {
  const team = myTeam();
  let best = null, bs = 1e9;
  for (const e of G.ents) {
    if (e.dead) continue;
    let d;
    if (e.k === 'u') {
      if (!G.revealAll && !visibleTo(e, team)) continue;
      d = Math.hypot(e.x - wx, e.y - wy) - e.r - 4 - r; if (d > 0) continue; d -= 100;

      if (wx < e.tx * TILE - r || wx > (e.tx + e.w) * TILE + r || wy < e.ty * TILE - r || wy > (e.ty + e.h) * TILE + r) continue;
      d = Math.hypot(e.x - wx, e.y - wy) * .1;

function clickSelect(wx, wy, add, dbl) {

function zoomAt(sx, sy, f) {

function onKey(e) {

function initTouch() {
  CV.addEventListener('touchstart', e => {
    if (!G || G.over) return; e.preventDefault(); audioInit();
    for (const t of e.changedTouches) { UI.touches.set(t.identifier, { x0: t.clientX, y0: t.clientY, x: t.clientX, y: t.clientY, t0: performance.now(), moved: false }); UI.mouse.x = t.clientX; UI.mouse.y = t.clientY; }

      const [a, b] = [...UI.touches.values()];
      UI.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, z: CAM.z };
      UI.drag = null; clearTimeout(UI.lpTimer);
    } else if (UI.touches.size === 1) {
      const t = [...UI.touches.values()][0];
      if (UI.boxMode) UI.drag = { x0: t.x, y0: t.y, x1: t.x, y1: t.y };
      clearTimeout(UI.lpTimer);
      UI.lpTimer = setTimeout(() => {
        if (!t.moved && UI.touches.size === 1) { t.long = true; const w = screenToWorld(t.x, t.y); clickSelect(w.x, w.y, false, true); if (navigator.vibrate) try { navigator.vibrate(15); } catch (er) { } }

      const dx = t.clientX - s.x, dy = t.clientY - s.y;
      if (UI.mode === 'place' && UI.touches.size === 1) { UI.mouse.x = t.clientX; UI.mouse.y = t.clientY; s.x = t.clientX; s.y = t.clientY; s.placeDrag = true; continue; }
      s.x = t.clientX; s.y = t.clientY;
      if (Math.hypot(s.x - s.x0, s.y - s.y0) > 10) s.moved = true;
      if (UI.touches.size === 1 && s.moved) {
        if (UI.drag) { UI.drag.x1 = s.x; UI.drag.y1 = s.y; }
        else { CAM.x -= dx / CAM.z; CAM.y -= dy / CAM.z; clampCam(); }
      }
    }
    if (UI.touches.size === 2 && UI.pinch) {
      const [a, b] = [...UI.touches.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const before = screenToWorld(UI.pinch.mx, UI.pinch.my);

      const after = screenToWorld(mx, my);

    }
  }, { passive: false });
  const end = e => {
    if (!G) return; e.preventDefault();
    for (const t of e.changedTouches) {
      const s = UI.touches.get(t.identifier); UI.touches.delete(t.identifier);
      if (!s) continue;
      clearTimeout(UI.lpTimer);
      if (UI.pinch) { if (UI.touches.size < 2) UI.pinch = null; continue; }
      if (UI.drag) { const d = UI.drag; UI.drag = null; if (Math.abs(d.x1 - d.x0) + Math.abs(d.y1 - d.y0) > 12) { boxSelect(d.x0, d.y0, d.x1, d.y1, false); continue; } }
      if ((s.moved && !s.placeDrag) || s.long) continue;
      const w = screenToWorld(s.x, s.y);
      if (UI.mode) { doModeClick(w.x, w.y); continue; }
      tapAction(w.x, w.y);
    }
  };
  CV.addEventListener('touchend', end, { passive: false });
  CV.addEventListener('touchcancel', end, { passive: false });
}
function tapAction(wx, wy) {

  clickSelect(wx, wy, false, false);

function drawWorldUI(c, alpha) {
  const t = performance.now();
  for (const e of selEnts()) {

    const col = e.k === 'r' ? '#5fe9dc' : own ? '#4ef08a' : ally ? '#6ad8ff' : '#ff4a3a';
    c.strokeStyle = col; c.lineWidth = 1.6;

    } else if (e.k === 'b') {

      c.beginPath();

      c.moveTo(x1, y1 - L); c.lineTo(x1, y1); c.lineTo(x1 - L, y1); c.moveTo(x0 + L, y1); c.lineTo(x0, y1); c.lineTo(x0, y1 - L);
      c.stroke();
      if (own && e.rally) {
        c.setLineDash([5, 5]); c.lineDashOffset = -t / 40; c.strokeStyle = 'rgba(255,211,106,.8)'; c.beginPath(); c.moveTo(e.x, e.y); c.lineTo(e.rally.x, e.rally.y); c.stroke(); c.setLineDash([]);
        c.fillStyle = '#ffd36a'; c.beginPath(); c.moveTo(e.rally.x, e.rally.y); c.lineTo(e.rally.x, e.rally.y - 16); c.lineTo(e.rally.x + 10, e.rally.y - 12); c.lineTo(e.rally.x, e.rally.y - 8); c.fill();
      }
    } else { c.beginPath(); c.arc(e.x, e.y, 18, 0, 7); c.stroke(); }
    if (own && e.k === 'u' && e.goal && (e.st === 'move' || e.st === 'amove')) {
      c.strokeStyle = e.st === 'amove' ? 'rgba(255,138,64,.35)' : 'rgba(78,240,138,.3)'; c.lineWidth = 1; c.setLineDash([3, 5]);
      const p = lerpPos(e, alpha); c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(e.goal.x, e.goal.y); c.stroke(); c.setLineDash([]);
    }
  }
  // survol
  if (UI.mouse.in && !IS_TOUCH && !UI.drag) {
    const w = screenToWorld(UI.mouse.x, UI.mouse.y); const h = pickAt(w.x, w.y);
    UI.hover = h;
    if (h && !UI.selSet.has(h.id)) {
      c.strokeStyle = h.k === 'r' ? 'rgba(95,233,220,.5)' : h.o === G.me ? 'rgba(78,240,138,.45)' : isEnemy(G.me, h.o) ? 'rgba(255,74,58,.6)' : 'rgba(106,216,255,.5)';
      c.lineWidth = 1.2;
      if (h.k === 'b') c.strokeRect(h.tx * TILE - 2, h.ty * TILE - 2, h.w * TILE + 4, h.h * TILE + 4);
      else { const p = lerpPos(h, alpha); c.beginPath(); c.ellipse(p.x, p.y + 2, (h.r || 14) + 3, ((h.r || 14) + 3) * .72, 0, 0, 7); c.stroke(); }
    }
    const atk = h && h.k !== 'r' && isEnemy(G.me, h.o) && selOwnUnits().length;
    CV.style.cursor = UI.mode === 'attack' || atk ? 'crosshair' : UI.mode ? 'cell' : 'default';
  }

    const m = UI.markers[i]; const k = (t - m.t) / 600; if (k > 1) { UI.markers.splice(i, 1); continue; }
    c.strokeStyle = m.col; c.globalAlpha = 1 - k; c.lineWidth = 2;
    c.beginPath(); c.ellipse(m.x, m.y, 14 * (1 - k * .6), 10 * (1 - k * .6), 0, 0, 7); c.stroke();
    c.beginPath(); c.moveTo(m.x - 4, m.y); c.lineTo(m.x + 4, m.y); c.moveTo(m.x, m.y - 4); c.lineTo(m.x, m.y + 4); c.stroke();

    for (let y = ty; y < ty + d.h; y++) for (let x = tx; x < tx + d.w; x++) {

// défilement de la caméra (bords d'écran et flèches)
function scrollCam(dt) {
  if (!G) return;
  const sp = 900 / CAM.z * dt;
  let dx = 0, dy = 0;
  if (UI.keys.ArrowLeft) dx -= sp; if (UI.keys.ArrowRight) dx += sp; if (UI.keys.ArrowUp) dy -= sp; if (UI.keys.ArrowDown) dy += sp;
  if (!IS_TOUCH && UI.mouse.in && !UI.drag && !UI.pan && document.hasFocus() && SETTINGS.edge) {
    const m = 6;
    if (UI.mouse.x < m) dx -= sp; if (UI.mouse.x > innerWidth - m) dx += sp;
    if (UI.mouse.y < m) dy -= sp; if (UI.mouse.y > innerHeight - m) dy += sp;
  }
  CAM.x += dx; CAM.y += dy; clampCam();
}

      <div class="row"><button id="tutoPasser">${traduire('tuto.passer')}</button><button id="tutoSuite" class="primary">${traduire(i < etapes.length - 1 ? 'tuto.suivant' : 'tuto.compris')}</button></div>
    </div>`;
    el.hidden = false;
    $('tutoSuite').addEventListener('click', ev => { ev.stopPropagation(); suite(); });
    $('tutoPasser').addEventListener('click', ev => { ev.stopPropagation(); fermer(); });
    try { $('tutoSuite').focus(); } catch (e) { /* rien */ }
  };
  const suite = () => { audioInit(); sfx('click', 0, 0, .8, true); i++; if (i >= etapes.length) fermer(); else montrer(); };
  const fermer = () => { el.hidden = true; el.innerHTML = ''; window.removeEventListener('keydown', clavier, true); const f = TUTO_FIN; TUTO_FIN = null; if (f) f(); };
  const clavier = ev => {
    if (el.hidden) return;
    if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') { ev.preventDefault(); ev.stopPropagation(); suite(); }
    else if (ev.code === 'Escape') { ev.preventDefault(); ev.stopPropagation(); fermer(); }
  };
  el.onclick = ev => { if (ev.target === el || ev.target.closest('.tuto-scene')) suite(); };
  window.addEventListener('keydown', clavier, true);
  montrer();
}

// ---------------- sauvegarde (module commun du site, sinon stockage local) ----------------
function chargerProgression() {
  let d = null;
  if (window.JEL_SAVE) { try { d = JEL_SAVE.load(JEU); } catch (e) { d = null; } }
  const st = d && d.etoiles && typeof d.etoiles === 'object' ? d.etoiles : (store('nova_progress') || {}).stars || {};
  PROG.stars = {};
  for (const k in st) if (/^\d-\d$/.test(k)) PROG.stars[k] = clamp(st[k] | 0, 0, 3);
  if (d && d.options && typeof d.options === 'object') {
    if (typeof d.options.son === 'boolean') SETTINGS.sound = d.options.son;
    if (typeof d.options.vitesse === 'number') SETTINGS.speed = d.options.vitesse;
  }
}
function totalEtoiles() { return Object.values(PROG.stars).reduce((a, b) => a + b, 0); }
function numeroMission(ci, mi) { return ci * 10 + mi + 1; }
function missionDuNumero(n) { n = clamp((n | 0) - 1, 0, CAMPAIGNS.length * 10 - 1); return { ci: Math.floor(n / 10), mi: n % 10 }; }
function sauverProgression(niveau) {
  const donnees = { niveau: clamp(niveau, 1, CAMPAIGNS.length * 10), score: totalEtoiles(), etoiles: Object.assign({}, PROG.stars), options: { son: SETTINGS.sound, vitesse: SETTINGS.speed } };
  if (window.JEL_SAVE) { try { JEL_SAVE.save(JEU, donnees); } catch (e) { /* stockage refusé */ } }

// ---------------- configuration des parties ----------------
function missionCfg(ci, mi) {
  const m = CAMPAIGNS[ci].missions[mi];
  const players = [];
  const pp = m.player;
  players.push({ name: nomJoueur(), team: 0, color: 0, human: true, start: 0, credits: pp.credits ?? 0, workers: pp.workers ?? 0, hq: pp.hq, units: pp.units || null, extraTurrets: pp.extraTurrets || 0, allow: m.allow ? m.allow.slice() : null, unitsAllow: m.units ? m.units.slice() : null });
  const usedStarts = [0];
  const colors = [1, 3, 2];
  (m.allies || []).forEach(a => {
    players.push({ name: traduire('nom.allie'), team: 0, color: 2, ai: a.ai, start: 3, credits: 600, workers: 5, hq: true, aiMode: 'full', extraTurrets: a.extraTurrets || 0 });
    usedStarts.push(3); colors.splice(colors.indexOf(2), 1);
  });
  const freeStarts = [1, 2, 3].filter(s => !usedStarts.includes(s));
  m.enemies.forEach((e, i) => {
    const full = e.base === 'full';
    players.push({
      name: nomIA(i), team: e.team ?? 1, color: colors[i % colors.length], ai: e.ai, start: freeStarts[i % freeStarts.length],
      credits: full ? 600 : 0, workers: full ? 5 : 0, hq: full, outpost: e.base === 'outpost' ? e.outpost : null, units: e.units || null,
      extraTurrets: e.extraTurrets || 0, vip: e.vip || null, vipHp: e.vipHp || 0, maxBases: e.bases, waves: e.waves ? JSON.parse(JSON.stringify(e.waves)) : null, immortal: !!e.waves,
      aiMode: full ? 'full' : e.base === 'outpost' ? 'defend' : 'none', aggro: e.aggro || (ci === 0 && mi < 4 ? 1.4 : 1)
    });

  return { seed: m.seed, size: m.size, theme: m.theme, players, mission: m, mode: 'solo', me: 0 };

// Modes d'escarmouche contre les robots
const MODES_ESC = ['1v1', '2v2', '1v2', 'ffa3', 'ffa4', 'survie'];
function skirmishCfg(o) {
  const ai = o.diff;
  const P = (name, team, color, start, extra) => Object.assign({ name, team, color, start, credits: o.credits, workers: 5, hq: true, aiMode: 'full' }, extra || {});
  const moi = P(nomJoueur(), 0, 0, 0, { human: true });
  let players, mission = null;
  if (o.mode === '1v1') players = [moi, P(nomIA(0), 1, 1, 1, { ai })];
  else if (o.mode === '2v2') players = [moi, P(traduire('nom.allie'), 0, 2, 3, { ai }), P(nomIA(0), 1, 1, 2, { ai }), P(nomIA(1), 1, 3, 1, { ai })];
  else if (o.mode === '1v2') players = [moi, P(nomIA(0), 1, 1, 1, { ai }), P(nomIA(1), 1, 3, 2, { ai })];
  else if (o.mode === 'ffa3') players = [moi, P(nomIA(0), 1, 1, 1, { ai }), P(nomIA(1), 2, 2, 2, { ai })];
  else if (o.mode === 'survie') {
    // Survie : tenir 15 minutes face à des vagues qui grossissent, sans base ennemie
    const f = { easy: .7, normal: 1, hard: 1.35, brutal: 1.7 }[ai] || 1;
    players = [moi, { name: nomIA(0), team: 1, color: 1, start: 1, credits: 0, workers: 0, hq: false, ai, aiMode: 'none', immortal: true,
      waves: { every: 50, start: 80, size: Math.round(3 * f), grow: Math.max(1, Math.round(1.5 * f)), types: ['marine', 'rocket', 'scout', 'marine', 'tank', 'interceptor', 'arty', 'bomber', 'titan'] } }];
    mission = { obj: 'survive', time: 900, skirm: true, player: { hq: true } };
  }
  else players = [moi, P(nomIA(0), 1, 1, 1, { ai }), P(nomIA(1), 2, 2, 2, { ai }), P(nomIA(2), 3, 3, 3, { ai })];
  return { seed: (Math.random() * 1e6) | 0, size: o.size, theme: o.theme, players, mode: 'solo', me: 0, reveal: o.reveal, mission, label: 'esc.mode.' + o.mode };
}

function objectiveText() {
  if (!G) return '';
  if (G.mode === 'tr') {
    const temps = fmtTime(Math.max(0, G.cfg.limite - G.time));
    if (G.players.length === 2) return traduire('tr.objectif', { temps });
    const equipes = new Set(G.players.map(p => p.team)).size;
    return traduire(equipes === G.players.length ? 'tr.objectifTous' : 'tr.objectifEquipe', { temps });
  }
  const m = G.mission;
  if (!m || (m.skirm && m.obj !== 'survive')) return (G.cfg.label ? traduire(G.cfg.label) + ' · ' : '') + traduire('obj.eliminer');
  const lim = m.limit ? ' · ' + traduire('obj.reste', { temps: fmtTime(m.limit - G.time) }) : '';
  const ally = m.protectAlly ? ' · ' + traduire('obj.protegerAllie') : '';
  if (m.obj === 'vip') { const n = G.ents.filter(e => e.vip && !e.dead).length; return traduire('obj.vip', { n, total: G.vipTotal || n }) + lim + ally; }
  if (m.obj === 'expand') { const n = G.ents.filter(e => e.k === 'b' && e.t === 'hq' && e.built && !e.dead && e.o === G.me).length; return traduire('obj.expansion', { n, total: m.target }) + lim; }
  if (m.obj === 'destroy') return traduire('obj.detruire') + lim + ally;
  if (m.obj === 'hq') { const n = G.ents.filter(e => e.k === 'b' && e.t === 'hq' && !e.dead && isEnemy(G.me, e.o)).length; return traduire('obj.qg', { n }) + lim; }
  if (m.obj === 'survive') return traduire('obj.survivre', { temps: fmtTime(m.time - G.time) });
  if (m.obj === 'credits') return traduire('obj.cristaux', { n: Math.floor(G.players[G.me].gathered), total: m.target });
  return '';
}

// ---------------- fin de partie ----------------
function endGame(win, reason) {
  if (!G || G.over) return;
  G.over = true; G.result = win;
  if (G.mode === 'host' && typeof hostFinPartie === 'function') hostFinPartie(win);
  let stars = 0, record = false, avant = 0;
  const campagne = G.mission && !G.mission.skirm;
  if (campagne) {
    const n = numeroMission(CUR.ci, CUR.mi);
    if (win) {
      const me = G.players[G.me];
      stars = 1;
      if (G.time <= G.mission.par) stars++;
      const noLoss = G.mission.player.hq === false ? me.st.lost <= Math.ceil(Object.values(G.mission.player.units).reduce((a, b) => a + b, 0) * .3) : me.st.bLost === 0;
      if (noLoss) stars++;
      const key = CUR.ci + '-' + CUR.mi;
      avant = PROG.stars[key] || 0;
      record = stars > avant;
      PROG.stars[key] = Math.max(avant, stars);
      sauverProgression(n + 1);
    } else sauverProgression(n);
  }
  if (G.mode !== 'client' || true) {
    const level = campagne ? numeroMission(CUR.ci, CUR.mi) : null;
    if (window.FMG) window.FMG.reportEnd({ completed: !!win, level: level });
  }
  if (campagne && win && Object.keys(PROG.stars).length >= CAMPAIGNS.length * 10 && Object.values(PROG.stars).every(v => v > 0)) {
    if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: MAX_ETOILES });
  }
  sfx(win ? 'victory' : 'defeat', 0, 0, 1, true);
  if (win) setTimeout(() => confettis(), 900);
  setTimeout(() => showEnd(win, stars, reason, record, avant), 1600);
}

// ============================================================
//  En ligne, en temps réel (moteur jel-tr ; c'est le lanceur du site qui se connecte, le
//  jeu n'a aucun accès au réseau) : 1 contre 1, chacun pour soi à 3 ou 4, 2 contre 2, ou
//  à deux contre des robots ; carte choisie ou au hasard. Recherche de 15 s au plus ; il
//  manque des joueurs → des robots prennent les places libres ; personne en ligne, hors
//  connexion ou serveur trop demandé → partie contre les robots, entièrement sur
//  l'appareil. Documentation : docs/cadrage-temps-reel.md (sections 4 et 16).
// ============================================================
const TRJ = {
  partie: null,                                             // JEL_TR.Partie
  robot: clamp(Math.round(+store('nova_tr_robot') || 2), 1, 3), // niveau des robots (places libres, secours)
  choixMode: Object.prototype.hasOwnProperty.call(TR_MODES, store('nova_tr_mode')) ? store('nova_tr_mode') : '1v1',
  carte: TR_CARTES.includes(store('nova_tr_carte')) ? store('nova_tr_carte') : '*',
  affichee: false,                                          // la carte de la partie est à l'écran
  contreRobot: false,                                       // partie contre les robots, ou plus aucun autre vrai joueur
  elimine: false,                                           // mon camp est éliminé, la partie continue entre les autres
  reseau: { moi: false, autres: new Set() },                // bandeau « problème de réseau »
  coupeA: 0,
  fin: null,                                                // résultat de la partie (bilan affiché)
};
function partieTR() {
  if (!TRJ.partie) TRJ.partie = JEL_TR.creer({ sim: window.JEL_SIM, surEvenement: surEvenementTR });
  return TRJ.partie;
}
function nomRobotTR(n) { return traduire('tr.robot', { niveau: traduire('ia.' + (TR_ROBOTS[n] || 'normal')) }); }

function nomCarteTR(k) { return k === '*' ? traduire('tr.carteHasard') : traduire('th.' + k + '.court'); }
function resumeChoixTR() { return traduire('tr.mode.' + TRJ.choixMode) + ' · ' + nomCarteTR(TRJ.carte); }

// Écran « En ligne » : mode, carte, niveau des robots, recherche.
function ecranEnLigne() {
  if (!G || !G.demo) startDemo();
  document.body.classList.remove('ingame');
  CUR.kind = 'tr';
  const opt = (act, vals, actuel) => `<div class="opts">${vals.map(([v, l]) => `<button data-act="${act}" data-v="${v}" class="${String(actuel) === String(v) ? 'on' : ''}">${esc(l)}</button>`).join('')}</div>`;
  const adverses = (TR_MODES[TRJ.choixMode].robots || []).length > 0;
  screen(`
    <h2>${traduire('tr.titre')}</h2>
    <p>${traduire('tr.explication')}</p>
    <label>${traduire('tr.mode')}</label>${opt('trMode', Object.keys(TR_MODES).map(k => [k, traduire('tr.mode.' + k)]), TRJ.choixMode)}
    <p class="dim small">${traduire('tr.aide.' + TRJ.choixMode)}</p>
    <label>${traduire('tr.carte')}</label>${opt('trCarte', ['*', ...TR_CARTES].map(k => [k, nomCarteTR(k)]), TRJ.carte)}
    <label>${traduire(adverses ? 'tr.niveauAdverses' : 'tr.robotChoix')}</label>${opt('trNiveau', [1, 2, 3].map(n => [n, traduire('ia.' + TR_ROBOTS[n])]), TRJ.robot)}
    <div class="row">${B('menu', 'bouton.retour')}${B('trChercher', 'tr.chercher', 'primary', 'data-tr="chercher"')}</div>`, 'wide', ecranEnLigne);
}

function lancerRechercheTR() {
  quitterPartieTR();
  const p = partieTR();
  screen(`
    <h2 id="trTitre">${traduire('tr.recherche')}</h2>
    <p class="tr-centre">${esc(resumeChoixTR())}</p>
    <div class="tr-orbite" aria-hidden="true"><i></i></div>
    <p id="trReste" class="dim tr-centre"></p><p id="trN" class="dim small tr-centre"></p>
    <div class="menu"><button id="trLancer" data-act="trLancer" class="big primary hidden"></button>${B('trRobot', 'tr.robotMaintenant', 'big', 'data-tr="robot"')}${B('trAnnuler', 'tr.annuler')}</div>`, '', null);
  const graine = ((Math.random() * 2147483647) | 0) || 7;
  const choix = { mode: TRJ.choixMode, carte: TRJ.carte, niveau: TRJ.robot };
  // Personne en ligne : la même partie contre les robots, sur l'appareil (mêmes mode et carte).
  p.chercher({ config: choix, repli: { graine, config: JEL_TR.configMode(window.JEL_SIM, choix, 1, graine), camp: 0 } });
}

function quitterPartieTR() {
  if (TRJ.partie) { TRJ.partie.pause(false); TRJ.partie.quitter(); }
  TRJ.affichee = false; TRJ.fin = null; TRJ.contreRobot = false; TRJ.elimine = false;
  oublierReseau();
}

// Champs d'affichage de G (jamais dans la simulation) : refaits quand l'état est remplacé
// (reprise depuis un instantané, retour dans la partie en ligne).
function preparerG() {
  const p = TRJ.partie;
  G.me = p.camp; G.affiche = true; G.demo = false; G.revealAll = false; G.spectate = false;
  if (!G.stats) G.stats = { start: performance.now() };
  nommerJoueursTR();
  FOG.dirty = true;
}
// Noms affichés (propres à cet appareil) : moi, « Adversaire » à deux, sinon « Joueur 3 »,
// « Robot (difficile) »… et « (allié) » pour un camp de mon équipe.
function nomCampTR(c) {
  const ctl = G.ctl ? G.ctl[c] : 0;
  if (ctl > 0) return nomRobotTR(ctl);
  return G.players.length === 2 ? traduire('tr.adversaire') : traduire('tr.joueurNum', { n: c + 1 });
}
function nommerJoueursTR() {
  if (!G || !G.players || G.me === undefined) return;
  const moi = G.players[G.me];
  G.players.forEach((p, c) => {
    if (c === G.me) { p.name = nomJoueur(); return; }
    const nom = nomCampTR(c);
    p.name = G.players.length > 2 && p.team === moi.team ? traduire('tr.allieNom', { nom }) : nom;
  });
}
// Plus aucun autre vrai joueur dans la partie (tous les autres camps tenus par des robots) ?
function seulAvecRobotsTR() { return !G || !G.ctl || G.ctl.every((x, c) => c === G.me || x > 0); }

function messageRobotTR(raison) {
  if (raison === 'choix') return '';
  if (raison === 'personne') return 'tr.raison.personne';
  if (raison === 'budget') return 'tr.raison.budget';
  if (raison === 'hors-ligne') return 'tr.raison.horsLigne';
  if (raison === 'site' || raison === 'seul') return 'tr.raison.site';
  return 'tr.raison.autre';
}

// Début d'une partie (contre le robot ou en ligne) : la carte de l'état du moteur à l'écran.
function afficherPartieTR(e) {
  const p = TRJ.partie;
  TRJ.contreRobot = e.mode === 'local';
  TRJ.fin = null;
  TRJ.elimine = false;
  hideScreens();
  PART.length = 0; VPROJ.length = 0; BEAMS.length = 0; TIMED.length = 0; WX.length = 0;
  UI.sel = []; UI.selSet = new Set(); UI.groups = {}; UI.mode = null; UI.card = 'main'; UI.markers = []; UI.pings = []; UI.cardSig = ''; UI.panelSig = '';
  G = p.etat;
  G.stats = null;
  preparerG();
  bakeTerrain();
  const s = G.players[G.me].start;
  CAM.z = IS_TOUCH ? .85 : 1.2;
  centerOn((s.x + .5) * TILE, (s.y + .5) * TILE + 60);
  $('msgs').innerHTML = '';
  document.body.classList.add('ingame');
  $('hud').classList.remove('hidden');
  PAUSED = false; ACC = 0; SPEED = 1;
  UI.showBars = SETTINGS.bars;
  CUR.tips = [];
  TRJ.affichee = true;
  oublierReseau();
  audioInit(); majBoutonSon();
  if (TRJ.contreRobot) { const m = messageRobotTR(e.raison); if (m) showMsg(m, 'warn'); }
  else { showMsg(G.players.length > 2 ? 'tr.trouves' : 'tr.trouve', 'info'); sfx('ready', 0, 0, 1, true); }
  showMsg(traduire('msg.objectif', { texte: objectiveText() }), 'info');
  updateHud(); layoutHud();
}

function surEvenementTR(e) {
  if (!e) return;
  const p = TRJ.partie;
  if (e.type === 'recherche') {
    const r = $('trReste'), n = $('trN');
    if (r) r.textContent = traduire('tr.reste', { n: Math.ceil(e.reste / 1000) });
    const plusieurs = Number.isInteger(e.max) && e.max > 2;
    if (n) n.textContent = !Number.isInteger(e.n) ? '' : plusieurs ? traduire('tr.groupe', { n: e.n, max: e.max }) : traduire('tr.joueurs', { n: e.n });
    // Partie à plus de 2 : on peut commencer tout de suite avec les joueurs réunis.
    const l = $('trLancer');
    if (l) { const ok = plusieurs && e.n >= 2; l.classList.toggle('hidden', !ok); if (ok) l.textContent = traduire('tr.lancer', { n: e.n }); }
    return;
  }
  if (e.type === 'connexion') {
    const t = $('trTitre'), r = $('trReste'), n = $('trN');
    if (t) t.textContent = traduire('tr.connexion');
    if (r) r.textContent = ''; if (n) n.textContent = '';
    const l = $('trLancer'); if (l) l.classList.add('hidden');
    sfx('ready', 0, 0, 1, true);
    return;
  }
  if (e.type === 'debut') { afficherPartieTR(e); return; }
  if (!TRJ.affichee) { if (e.type === 'attente' && TRJ.fin && e.n > 0) ajouterDefiTR(); return; }
  if (e.type === 'controle') {
    if (e.camp === p.camp) return;
    const deux = G.players.length === 2, joueur = traduire('tr.joueurNum', { n: e.camp + 1 });
    nommerJoueursTR();
    TRJ.contreRobot = TRJ.partie.mode === 'local' || seulAvecRobotsTR();
    if (e.niveau > 0) { if (performance.now() - TRJ.coupeA > 3000) showMsg(deux ? 'tr.adversaireParti' : 'tr.joueurParti', 'warn', undefined, undefined, { nom: joueur }); }
    else showMsg(deux ? 'tr.adversaireRevenu' : 'tr.joueurRevenu', 'info', undefined, undefined, { nom: joueur });
    return;
  }
  if (e.type === 'reseau') {
    if (e.fin) { TRJ.reseau.moi = false; showMsg('tr.reseauAbandon', 'alert'); }
    else if (e.qui === 'moi') {
      const avant = TRJ.reseau.moi;
      TRJ.reseau.moi = !e.ok;
      if (e.ok && avant) showMsg('tr.reseauRetrouve', 'info');
    } else {
      const camp = Number.isInteger(e.camp) ? e.camp : -1;
      if (e.ok) TRJ.reseau.autres.delete(camp); else TRJ.reseau.autres.add(camp);
    }
    majReseau();
    return;
  }
  if (e.type === 'info') {
    if (e.code === 'coupe') { TRJ.coupeA = performance.now(); TRJ.contreRobot = true; TRJ.reseau.autres.clear(); majReseau(); showMsg(e.retour ? 'tr.raison.coupeAttente' : 'tr.raison.coupe', 'warn'); }
    else if (e.code === 'reconnecte') { TRJ.contreRobot = seulAvecRobotsTR(); TRJ.reseau.moi = false; majReseau(); nommerJoueursTR(); showMsg('tr.reconnecte', 'info'); sfx('ready', 0, 0, 1, true); }
    else if (e.code === 'budget') showMsg('tr.raison.budget', 'warn');
    return;
  }
  if (e.type === 'attente') { if (TRJ.fin && e.n > 0) ajouterDefiTR(); return; }
  if (e.type === 'fin') finPartieTR(e.resultat);
}

// Bandeau « problème de réseau » (sous la barre du haut), tant que dure le problème.
function majReseau() {
  const el = $('reseau'); if (!el) return;
  const enJeu = TRJ.affichee && !TRJ.fin;
  const texte = !enJeu ? '' : TRJ.reseau.moi ? traduire('tr.reseauMoi') : TRJ.reseau.autres.size ? traduire(G && G.players.length > 2 ? 'tr.reseauAutre' : 'tr.reseauAdversaire') : '';
  $('reseauTexte').textContent = texte;
  const haut = $('topbar') ? $('topbar').offsetHeight : 48;
  el.style.top = (haut + 6) + 'px';
  el.classList.toggle('cache', !texte);
  document.body.classList.toggle('avec-reseau', !!texte);
  if (texte) $('msgs').style.top = (haut + el.offsetHeight + 12) + 'px'; else $('msgs').style.top = '';
}
function oublierReseau() { TRJ.reseau.moi = false; TRJ.reseau.autres.clear(); majReseau(); }

// Mon camp est éliminé alors que la partie continue (à plus de 2) : regarder la suite, ou partir.
function ecranElimineTR() {
  TRJ.elimine = true;
  sfx('defeat', 0, 0, 1, true);
  screen(`
    <div class="end lose"><div class="big">${traduire('tr.elimine')}</div>
    <p>${traduire('tr.elimineSuite')}</p></div>
    <div class="row">${B('trRegarder', 'tr.regarder', 'primary')}${B('quit', 'tr.quitter', 'danger')}</div>`, '', null);
}

// Ordre de l'interface pendant une partie en ligne : liste d'entiers envoyée au moteur.
function ordreTR(cmd) {
  const p = TRJ.partie;
  if (!p || !G || G.over) return;
  const o = window.JEL_SIM.encoder(cmd);
  if (o) p.ordre(o);
}

// Fin : bilan, statistiques de fin de partie, nouvelle recherche.
function finPartieTR(r) {
  if (!r || TRJ.fin) return;
  TRJ.fin = r;
  oublierReseau();
  const gagne = r.gagnant === equipeTR(r, TRJ.partie.camp);
  if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: null });
  sfx(gagne ? 'victory' : 'defeat', 0, 0, 1, true);
  if (gagne) setTimeout(() => confettis(), 900);
  setTimeout(() => montrerBilanTR(r), 1600);
}
// Équipe d'un camp d'après le résultat (ancien résultat sans équipes : le camp lui-même).
function equipeTR(r, camp) { return Array.isArray(r.equipes) ? r.equipes[camp] : camp; }
function montrerBilanTR(r) {
  if (!G || TRJ.fin !== r) return;
  const camp = TRJ.partie.camp, monEquipe = equipeTR(r, camp), gagne = r.gagnant === monEquipe;
  const titre = gagne ? 'fin.victoire' : r.gagnant === -1 ? 'tr.egalite' : 'fin.defaite';
  // Fin au temps : points de mon équipe contre ceux de la meilleure autre équipe.
  const parEquipe = new Map();
  (r.scores || []).forEach((s, c) => { const t = equipeTR(r, c); parEquipe.set(t, (parEquipe.get(t) || 0) + s); });
  const autres = [...parEquipe].filter(([t]) => t !== monEquipe).map(([, s]) => s);
  const detail = r.raison === 'temps' ? traduire('tr.fin.temps', { a: JEL_I18N_nombre(parEquipe.get(monEquipe) || 0), b: JEL_I18N_nombre(autres.length ? Math.max(...autres) : 0) })
    : gagne ? traduire('tr.fin.conquete', { temps: fmtTime(G.time) }) : traduire('tr.fin.perdu');
  const rows = G.players.map(p => `<tr style="color:${p.color}"><td>${esc(p.name)}${p.id === G.me ? ' ' + traduire('fin.vous') : ''}</td><td>${JEL_I18N_nombre((r.scores || [])[p.id] || 0)}</td><td>${p.st.built}</td><td>${p.st.lost}</td><td>${p.st.kills}</td><td>${p.st.bKills}</td><td>${Math.floor(p.gathered)}</td></tr>`).join('');
  screen(`
    <div class="end ${gagne ? 'win' : 'lose'}"><div class="big">${traduire(titre)}</div>
    <p>${esc(detail)}</p>
    <p class="dim">${traduire('fin.duree', { temps: fmtTime(G.time) })}</p></div>
    <div class="stats-wrap"><table class="stats"><tr><th>${traduire('fin.col.joueur')}</th><th>${traduire('tr.col.score')}</th><th>${traduire('fin.col.produites')}</th><th>${traduire('fin.col.pertes')}</th><th>${traduire('fin.col.eliminations')}</th><th>${traduire('fin.col.batiments')}</th><th>${traduire('fin.col.cristaux')}</th></tr>${rows}</table></div>
    <div class="row" id="trBoutons">${B('quitToMenu', 'pause.accueil')}${B('trChercher', 'tr.rejouer', 'primary')}</div>`, 'wide');
  // Partie contre le robot : quelqu'un cherche-t-il en ce moment ? (réponse : événement « attente »)
  if (TRJ.contreRobot) TRJ.partie.attente();
}
function ajouterDefiTR() {
  const zone = $('trBoutons');
  if (!zone || $('trDefi')) return;
  const b = document.createElement('button');
  b.id = 'trDefi'; b.className = 'primary'; b.textContent = traduire('tr.joueurDispo');
  b.addEventListener('click', () => { audioInit(); sfx('click', 0, 0, .8, true); lancerRechercheTR(); });
  zone.insertBefore(b, zone.firstChild);
  sfx('ready', 0, 0, 1, true);
}

// Sorties de la simulation (bloc jel-sim) vers l'affichage.
SORTIES.fx = (...a) => playFx(...a);
SORTIES.msg = (cle, kind, x, y, vars) => showMsg(cle, kind, x, y, vars);
SORTIES.fin = (win, reason) => endGame(win, reason);
SORTIES.spectateur = () => showDefeatSpectate();
SORTIES.ordre = cmd => ordreTR(cmd);

const ACTIONS = {
  menu: () => { if (G && !G.demo && G.mode !== 'solo') { fermerReseau(); if (G && G.mode === 'tr') G = null; } mainMenu(); },
  multi: () => ecranEnLigne(),
  trNiveau: b => { TRJ.robot = clamp(+b.dataset.v || 2, 1, 3); store('nova_tr_robot', TRJ.robot); ecranEnLigne(); },
  trMode: b => { if (Object.prototype.hasOwnProperty.call(TR_MODES, b.dataset.v)) { TRJ.choixMode = b.dataset.v; store('nova_tr_mode', TRJ.choixMode); } ecranEnLigne(); },
  trCarte: b => { const v = b.dataset.v; TRJ.carte = TR_CARTES.includes(v) ? v : '*'; store('nova_tr_carte', TRJ.carte); ecranEnLigne(); },
  trLancer: () => { if (TRJ.partie) TRJ.partie.lancer(); },
  trRegarder: () => { hideScreens(); if (G) { G.revealAll = true; FOG.dirty = true; } },
  trChercher: () => lancerRechercheTR(),
  trRobot: () => { if (TRJ.partie) TRJ.partie.jouerRobot(); },
  trAnnuler: () => { quitterPartieTR(); if (G && G.mode === 'tr') G = null; ecranEnLigne(); },
  jouer: () => {
    const nouvelle = () => { CUR.ci = 0; campaignMenu(0); briefing(0); };
    if (window.JEL_SAVE) JEL_SAVE.reprise({ jeu: JEU, onContinuer: d => { chargerProgression(); const p = missionDuNumero(d.niveau || 1); CUR.ci = p.ci; briefing(p.mi); }, onNouvelle: nouvelle, onEffacer: () => { chargerProgression(); nouvelle(); } });
    else nouvelle();
  },
  campaign: () => campaignMenu(), ctab: b => campaignMenu(+b.dataset.i), mission: b => briefing(+b.dataset.i),
  campaignBack: () => campaignMenu(),
  campaignFromGame: () => { fermerReseau(); G = null; startDemo(); campaignMenu(); },
  launchMission: () => { CUR.kind = 'mission'; startGame(missionCfg(CUR.ci, CUR.mi)); },
  nextMission: () => { const p = missionDuNumero(numeroMission(CUR.ci, CUR.mi) + 1); CUR.ci = p.ci; G = null; startDemo(); briefing(p.mi); },
  restart: () => { if (CUR.kind === 'skirm') ACTIONS.launchSkirm(); else { CUR.kind = 'mission'; startGame(missionCfg(CUR.ci, CUR.mi)); } },
  skirmish: () => skirmishMenu(),
  skopt: b => { let v = b.dataset.v; if (v === 'true' || v === 'false') v = v === 'true'; else if (!isNaN(+v)) v = +v; SK[b.dataset.k] = v; store('nova_skirm', SK); skirmishMenu(); },
  launchSkirm: () => { CUR.kind = 'skirm'; startGame(skirmishCfg(SK)); },
  options: () => optionsMenu(false), optionsInGame: () => optionsMenu(true),
  set: b => { const k = b.dataset.k; let v = b.dataset.v; SETTINGS[k] = k === 'speed' ? +v : v === '1'; saveSettings(); if (k === 'sound') { setAudioOn(SETTINGS.sound); majBoutonSon(); } if (k === 'bars') UI.showBars = SETTINGS.bars; if (k === 'speed' && G && G.mode === 'solo' && !G.demo) SPEED = SETTINGS.speed; optionsMenu(CUR.optFromGame); },
  son: () => basculerSon(),
  howto: () => howtoMenu(),
  tutoRevoir: () => { hideScreens(); montrerTuto(TUTO.combat, () => montrerTuto(TUTO.eco, () => mainMenu())); },
  pause: () => pauseMenu(),
  resume: () => { hideScreens(); PAUSED = false; if (G && G.mode === 'tr' && TRJ.partie) TRJ.partie.pause(false); },
  quit: () => {
    if (G && G.mode === 'tr') { quitterPartieTR(); G = null; mainMenu(); return; }
    if (G && !G.over && G.mission && !G.mission.skirm && G.mode === 'solo') sauverProgression(numeroMission(CUR.ci, CUR.mi));
    if (G && !G.over && G.mode !== 'client') G.over = true;
    fermerReseau(); G = null; mainMenu();
  },
  quitToMenu: () => { fermerReseau(); G = null; mainMenu(); },
};
function fermerReseau() { if (TRJ.partie) quitterPartieTR(); }

// ---------------- mise en page du HUD ----------------
function layoutHud() {
  const b = $('bottom'); UI.hudH = b ? b.offsetHeight : 0;
  const mm = $('minimap');
  if (mm) { const s = mm.clientWidth; if (mm.width !== s * DPR) { mm.width = mm.height = Math.max(80, s * DPR | 0); } }
}

// ---------------- boucle ----------------
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(.25, (ts - (LAST || ts)) / 1000); LAST = ts;
  if (!G) return;
  let alpha = 1;
  if (G.mode === 'tr') {
    // Partie temps réel : c'est le moteur jel-tr qui joue les ticks ; ici, seulement l'affichage.
    if (!TRJ.affichee || !TRJ.partie) return;
    if (G.affiche !== true) preparerG();
    alpha = TRJ.partie.alpha();
    if (!TRJ.elimine && !TRJ.fin && !G.over && G.players[G.me] && G.players[G.me].defeated) ecranElimineTR();
  } else if (G.mode !== 'client') {
    if (!PAUSED) {
      ACC += dt * SPEED;
      let n = 0;
      while (ACC >= TICK && n < 6) {
        if (!G.over || G.demo) simStep(); ACC -= TICK; n++;
        if (G && G.mode === 'host' && typeof hostTick === 'function') hostTick();
        if (!G) return;
      }
      if (ACC > TICK * 6) ACC = 0;
      alpha = clamp(ACC / TICK, 0, 1);
    }
    if (G.demo) demoTick(dt);
  } else if (typeof clientAlpha === 'function') alpha = clientAlpha();
  if (!G.demo && !PAUSED) scrollCam(dt);
  render(alpha);
  if (!G.demo) {
    drawMinimap();
    HUD_T -= dt; if (HUD_T <= 0) { HUD_T = .15; updateHud(); }
    if (G.mission && CUR.tips.length && !PAUSED) { TIP_T -= dt; if (TIP_T <= 0) { TIP_T = 7; showMsg(CUR.tips.shift(), 'tip'); } }
  }
}
function demoTick(dt) {
  // caméra cinématique sur la partie de démonstration
  const D = G.demoCam || (G.demoCam = { t: 0, tx: G.W * TILE / 2, ty: G.H * TILE / 2 });
  D.t -= dt;
  if (D.t <= 0) {
    D.t = 7;
    const fights = G.ents.filter(e => e.k === 'u' && (e.st === 'attack' || e.st === 'amove') && !e.dead);
    const pick = fights.length ? fights[(Math.random() * fights.length) | 0] : G.ents[(Math.random() * G.ents.length) | 0];
    if (pick) { D.tx = pick.x; D.ty = pick.y; }
  }
  CAM.z = IS_TOUCH ? .75 : 1.05;
  const cx = CAM.x + viewW() / 2, cy = CAM.y + viewH() / 2;
  CAM.x += (D.tx - cx) * dt * .4; CAM.y += (D.ty - cy) * dt * .4;
  clampCam();
  if ((G.over || G.time > 600) && !G.restarting) { G.restarting = true; startDemo(); }
}

// ---------------- démarrage ----------------
function boot() {
  localiserDonnees();
  if (window.JEL_I18N && JEL_I18N.surChangement) JEL_I18N.surChangement(() => { localiserDonnees(); if (window.JEL_I18N.appliquer) JEL_I18N.appliquer(); UI.cardSig = ''; UI.panelSig = ''; if (CUR.ecran) CUR.ecran(); });
  if (window.JEL_I18N && JEL_I18N.appliquer) JEL_I18N.appliquer();
  chargerProgression();
  window.JEL_NIVEAUX = CAMPAIGNS.reduce((s, c) => s + c.missions.length, 0);
  CV = $('cv'); CX = CV.getContext('2d', { alpha: false });
  MM = $('minimap'); MMc = MM.getContext('2d');
  resizeCanvas();
  setVolumes(SETTINGS.sfx, SETTINGS.mus); AU.on = SETTINGS.sound;
  showLoading(traduire('chargement.modeles'));
  setTimeout(() => {
    buildSprites();
    initInput();
    // barre tactile
    document.querySelectorAll('[data-tb]').forEach(b => b.addEventListener('click', ev => {
      ev.stopPropagation(); audioInit(); if (!G) return;
      const k = b.dataset.tb;
      if (k === 'box') { UI.boxMode = !UI.boxMode; b.classList.toggle('on', UI.boxMode); }
      else if (k === 'army') selectArmy();
      else if (k === 'home') centerHome();
      else if (k === 'desel') setSel([]);
    }));
    $('btnMenu').addEventListener('click', () => { audioInit(); togglePause(); });
    $('btnSon').addEventListener('click', ev => { ev.stopPropagation(); basculerSon(); });
    $('idleW').addEventListener('click', ev => { ev.stopPropagation(); audioInit(); if (G) selectIdleWorkers(); });
    window.addEventListener('resize', () => { layoutHud(); });
    document.addEventListener('pointerdown', () => audioInit(), { once: true });
    document.addEventListener('visibilitychange', () => { const robotLocal = G && G.mode === 'tr' && TRJ.affichee && TRJ.partie && TRJ.partie.mode === 'local'; if (document.hidden && G && (G.mode === 'solo' || robotLocal) && !G.demo && !G.over && $('screens').dataset.open !== '1') togglePause(); });
    if (window.JEL_SAVE && JEL_SAVE.surFermeture) JEL_SAVE.surFermeture(() => { const enMission = G && !G.demo && !G.over && G.mission && !G.mission.skirm && G.mode === 'solo'; if (enMission || CUR.briefing) sauverProgression(numeroMission(CUR.ci, CUR.mi)); });
    hideLoading();
    mainMenu();
    requestAnimationFrame(loop);
  }, 20);
}
window.addEventListener('load', boot);

</script>
