  //                                                        cette partie, ou null ; max : vrais joueurs au plus)
  //                   { type: 'connexion' }                adversaire trouvé, connexion en cours
  //                   { type: 'debut', mode, camp, raison } partie commencée : mode 'local' (robot) ou 'p2p' / 'relais'
  //                   { type: 'controle', camp, niveau }   un camp passe au robot (niveau ≥ 1) ou revient à l'humain (0)
  //                   { type: 'fin', resultat }            partie finie (fin(etat) de la simulation)
  //                   { type: 'info', code }               'coupe' (avec raison ; retour : reconnexion encore tentée),
  //                                                        'reprise', 'reconnecte'…
  //                   { type: 'reseau', qui, camp, ok, fin } problème de réseau : qui = 'moi' (cet appareil) ou
  //                                                        'adversaire' (un autre joueur : camp) ; ok = true quand il est réglé ; fin = true
  //                                                        quand on renonce à se reconnecter (la partie reste contre le robot)
  //                   { type: 'attente', n }               réponse à partie.attente() : joueurs qui cherchent
  //   reglages      remplace des valeurs de REGLAGES
  // }
  // Commandes : local({ graine, config, camp }), chercher({ config, repli }), lancer() (partie à plus
  // de 2 : commencer tout de suite avec les joueurs déjà réunis, robots aux places libres), jouerRobot(),
  // ordre([type, a, b, c]), pause(oui), quitter(), attente().
  // Lecture : mode ('arret', 'recherche', 'connexion', 'local', 'en-ligne', 'fin'), camp, etat (tick
  // courant), prec (tick précédent), alpha() (0 à 1, pour l'interpolation du rendu), resultat,
  // connexion ('p2p' | 'relais' | null).

  function dansLanceur() {
    try { return racine.parent && racine.parent !== racine; } catch (e) { return false; }
  }

  function horloge() {
    return racine.performance && typeof racine.performance.now === 'function' ? racine.performance.now() : Date.now();
  }

  function Partie(o) {
    this.o = o || {};
    this.sim = this.o.sim;
    this.r = Object.assign({}, REGLAGES, this.sim && this.sim.reglages, this.o.reglages || {});
    this.mode = 'arret';
    this.camp = 0;
    this.connexion = null;
    this.s = null;                 // Simulation
    this.cad = null;               // cadenceur local (partie contre le robot)
    this.file = [];                // paquets reçus, pas encore joués (en ligne)
    this.seq = 0;
    this.tDernier = 0;             // heure du dernier tick joué
    this.minuteur = 0;
    this.minuteurRecherche = 0;
    this.finRecherche = 0;
    this.nRecherche = null;
    this.enPause = false;
    this.attendSnap = false;
    this.retour = false;           // partie continuée contre le robot après une coupure, retour en ligne possible
    this.repli = null;             // { graine, config } de la partie contre le robot si personne n'est trouvé
    this.ecoute = this.recevoirLanceur.bind(this);
    this.battement = this.boucle.bind(this);
  }

  Object.defineProperty(Partie.prototype, 'etat', { get: function () { return this.s ? this.s.etat : null; } });
  Object.defineProperty(Partie.prototype, 'prec', { get: function () { return this.s ? this.s.prec : null; } });
  Object.defineProperty(Partie.prototype, 'resultat', { get: function () { return this.s ? this.s.resultat : null; } });

  Partie.prototype.signaler = function (e) {
    var f = this.o.surEvenement;
    if (typeof f !== 'function') return;
    try { f(e); } catch (erreur) { setTimeout(function () { throw erreur; }, 0); }
  };

  Partie.prototype.alpha = function () {
    if (!this.s || this.enPause) return 1;
    var a = (horloge() - this.tDernier) / this.r.tickMs;
    return a < 0 ? 0 : a > 1 ? 1 : a;
  };

  Partie.prototype.versLanceur = function (m) {
    m.type = 'jel-tr';
    try { racine.parent.postMessage(m, '*'); } catch (e) { /* pas de lanceur */ }
  };

  // Arrête tout sans rien annoncer.
  Partie.prototype.arreter = function () {
    clearTimeout(this.minuteur);
    clearInterval(this.minuteurRecherche);
    racine.removeEventListener('message', this.ecoute);
    if (this.mode === 'recherche' || this.mode === 'connexion' || this.mode === 'en-ligne' || (this.mode === 'local' && this.retour)) this.versLanceur({ op: 'quitter' });
    this.mode = 'arret';
    this.file = [];
    this.cad = null;
    this.connexion = null;
    this.attendSnap = false;
    this.retour = false;
  };

  Partie.prototype.quitter = function () { this.arreter(); };

  // Partie contre le robot, entièrement sur l'appareil (aucune requête réseau).
  // p : { graine, config (ctl compris), camp }.
  Partie.prototype.local = function (p, raison) {
    this.arreter();
    racine.JEL_TR.derniere = this;       // pour le robot de contrôle (scripts/tester-temps-reel.mjs)
    p = p || {};
    this.camp = Number.isInteger(p.camp) ? p.camp : 0;
    this.s = new Simulation(this.sim, (p.graine >>> 0) || 1, p.config || {}, this.r);
    this.seq = 0;
    var moi = this;
    this.cad = new Cadenceur({ camps: this.s.etat.ctl.length, systeme: this.sim.camps, delai: this.r.delaiEntree, depart: 0, envoyer: function (paquet) { moi.jouerPaquet(paquet); } });
    this.mode = 'local';
    this.enPause = false;
    this.tDernier = horloge();
    this.signaler({ type: 'debut', mode: 'local', camp: this.camp, raison: raison || 'choix' });
    this.minuteur = setTimeout(this.battement, 16);
  };

  // Recherche d'adversaires en ligne (par le lanceur), robot si personne n'est trouvé dans
  // rechercheMs. p : { config ({ mode, carte, niveau } : choix du joueur, voir configMode),
  // repli: { graine, config, camp } }. Partie à plus de 2 : au bout de rechercheMs, si au moins
  // deux joueurs sont réunis, la partie commence avec eux (robots aux places libres).
  Partie.prototype.chercher = function (p) {
    this.arreter();
    racine.JEL_TR.derniere = this;
    p = p || {};
    this.repli = p.repli || { graine: 1, config: {} };
    if (!dansLanceur()) { this.local(this.repli, 'seul'); return; }
    this.mode = 'recherche';
    this.nRecherche = null;
    this.maxRecherche = null;
    this.lance = false;
    this.finRecherche = horloge() + this.r.rechercheMs;
    racine.addEventListener('message', this.ecoute);
    this.versLanceur({ op: 'chercher', proto: PROTOCOLE, config: copie(p.config || {}) });
    var moi = this;
    var annoncer = function () {
      if (moi.mode !== 'recherche') return;
      var brut = moi.finRecherche - horloge(), reste = Math.max(0, brut);
      moi.signaler({ type: 'recherche', reste: reste, n: moi.nRecherche, max: moi.maxRecherche });
      if (reste > 0) return;
      // Délai écoulé : avec au moins un autre joueur, la partie commence (sinon, robots sur l'appareil).
      if (moi.nRecherche >= 2 && !moi.lance) moi.lancer();
      else if (!moi.lance || brut <= -moi.r.lancementMs) moi.basculerLocal('personne');
    };
    this.minuteurRecherche = setInterval(annoncer, 250);
    annoncer();
  };

  // Partie à plus de 2 joueurs : commencer tout de suite avec les joueurs déjà réunis (bouton
  // « Lancer la partie », ou fin de la recherche). Le serveur répond « trouve », ou « solo ».
  Partie.prototype.lancer = function () {
    if (this.mode !== 'recherche' || this.lance) return false;
    this.lance = true;
    this.finRecherche = Math.min(this.finRecherche, horloge());
    this.versLanceur({ op: 'lancer' });
    return true;
  };

  // Bouton « Jouer contre un robot maintenant » (ou délai écoulé).
  Partie.prototype.jouerRobot = function () {
    if (this.mode === 'recherche' || this.mode === 'connexion') this.basculerLocal('choix');
  };

  Partie.prototype.basculerLocal = function (raison) {
    var repli = this.repli || { graine: 1, config: {} };
    this.local(repli, raison);
  };

  // Joueurs en recherche, demandés au lanceur (fin d'une partie contre le robot) : événement 'attente'.
  Partie.prototype.attente = function () {
    if (!dansLanceur()) return false;
    racine.removeEventListener('message', this.ecoute);
    racine.addEventListener('message', this.ecoute);
    this.versLanceur({ op: 'attente' });
    return true;
  };

  // Messages du lanceur : { type: 'jel-tr', etat: … } ou { type: 'jel-tr', paquet | snap | journal | demande }.
  Partie.prototype.recevoirLanceur = function (e) {
    if (e.source !== racine.parent) return;
    var d = e.data;
    if (!d || d.type !== 'jel-tr') return;
    if (d.etat === 'attente') {
      if (this.mode === 'recherche') { this.nRecherche = Number.isInteger(d.n) ? d.n : null; this.maxRecherche = Number.isInteger(d.max) ? d.max : null; }
      else this.signaler({ type: 'attente', n: Number.isInteger(d.n) ? d.n : 0 });
      return;
    }
    if (d.etat === 'solo') {
      if (this.mode === 'recherche' || this.mode === 'connexion') this.basculerLocal(d.raison || 'reseau');
      return;
    }
    if (d.etat === 'trouve') {
      if (this.mode !== 'recherche') return;
      clearInterval(this.minuteurRecherche);
      this.mode = 'connexion';
      var cfg = copie(d.config || {});
      var n = campsDe(this.sim, cfg);
      this.camp = Number.isInteger(d.camp) && d.camp >= 0 && d.camp < n ? d.camp : 0;
      if (!Array.isArray(cfg.ctl) || cfg.ctl.length !== n) { cfg.ctl = []; for (var c = 0; c < n; c++) cfg.ctl.push(0); }
      this.s = new Simulation(this.sim, d.graine >>> 0, cfg, this.r);
      this.seq = 0;
      this.file = [];
      this.signaler({ type: 'connexion' });
      this.versLanceur({ op: 'pret' });
      var moi = this;
      clearTimeout(this.minuteur);
      this.minuteur = setTimeout(function () { if (moi.mode === 'connexion') moi.basculerLocal('connexion'); }, this.r.connexionMs);
      return;
    }
    if (d.etat === 'mode') { this.connexion = d.mode === 'p2p' ? 'p2p' : 'relais'; return; }
    if (d.etat === 'info') { this.signaler({ type: 'info', code: String(d.code || '') }); return; }
    if (d.etat === 'reseau') {
      if (d.fin) this.retour = false;
      this.signaler({ type: 'reseau', qui: d.qui === 'adversaire' ? 'adversaire' : 'moi', camp: Number.isInteger(d.camp) ? d.camp : null, ok: d.ok === true, fin: d.fin === true });
      return;
    }
    if (d.etat === 'coupe') { this.continuerSeul(d.raison || 'coupe', d.retour === true); return; }
    if (d.demande === 'snap') {
      if (this.s) this.versLanceur({ op: 'snap', snap: this.s.instantane() });
      return;
    }
    if (d.snap) {
      // Coupure longue : la partie continuait contre le robot ; le réseau revient → retour en ligne.
      if (this.mode === 'local' && this.retour) this.revenirEnLigne(d.snap);
      else if (this.mode === 'en-ligne' || this.mode === 'connexion') this.recevoirSnap(d.snap);
      return;
    }
    if (d.paquet) {
      if (this.mode !== 'connexion' && this.mode !== 'en-ligne') return;
      this.file.push(d.paquet);
      if (this.mode === 'connexion') {
        clearTimeout(this.minuteur);
        this.mode = 'en-ligne';
        this.tDernier = horloge();
        this.signaler({ type: 'debut', mode: this.connexion || 'relais', camp: this.camp, raison: 'en-ligne' });
        this.minuteur = setTimeout(this.battement, 0);
      }
    }
  };

  // Instantané reçu (désynchronisation, reprise, secours) : l'état est remplacé. Les paquets
  // déjà en file sont jetés : ceux qui suivent l'instantané arrivent toujours après lui (même
  // canal), et ceux d'avant peuvent venir d'une autre horloge (secours).
  Partie.prototype.recevoirSnap = function (snap) {
    if (!this.s || !snap || !Number.isInteger(snap.k)) return;
    this.s.restaurer(snap);
    this.attendSnap = false;
    this.file = [];
    this.tDernier = horloge();
    this.signaler({ type: 'info', code: 'reprise' });
  };

  // Plus de réseau : la partie continue sur l'appareil, au même tick, les autres camps tenus
  // par le robot (niveau moyen). retour : le lanceur essaie encore de se reconnecter ; s'il y
  // arrive, l'état de la vraie partie arrive (instantané) et on y revient (revenirEnLigne).
  Partie.prototype.continuerSeul = function (raison, retour) {
    if (this.mode === 'recherche' || this.mode === 'connexion') { this.basculerLocal(raison); return; }
    if (this.mode !== 'en-ligne' || !this.s) return;
    clearTimeout(this.minuteur);
    this.retour = !!retour;
    if (!this.retour) racine.removeEventListener('message', this.ecoute);
    var moi = this;
    // Les paquets déjà reçus sont joués d'abord (dans l'ordre), puis l'horloge locale prend la suite.
    while (this.file.length && this.file[0].k === this.s.k() + 1) this.jouerPaquet(this.file.shift());
    this.file = [];
    var camps = this.s.etat.ctl.length;
    this.cad = new Cadenceur({ camps: camps, systeme: this.sim.camps, delai: this.r.delaiEntree, depart: this.s.k(), envoyer: function (p) { moi.jouerPaquet(p); } });
    for (var c = 0; c < camps; c++) if (c !== this.camp && this.s.etat.ctl[c] === 0) this.cad.controle(c, 2);
    this.mode = 'local';
    this.connexionAvant = this.connexion;
    this.connexion = null;
    this.tDernier = horloge();
    this.signaler({ type: 'info', code: 'coupe', raison: raison, retour: this.retour });
    this.minuteur = setTimeout(this.battement, 16);
  };

  // Retour dans la partie en ligne après une coupure : l'état de la vraie partie remplace
  // celui joué contre le robot pendant l'absence.
  Partie.prototype.revenirEnLigne = function (snap) {
    if (!this.s || !snap || !Number.isInteger(snap.k)) return;
    clearTimeout(this.minuteur);
    this.cad = null;
    this.retour = false;
    this.mode = 'en-ligne';
    this.connexion = this.connexion || this.connexionAvant || 'relais';
    this.enPause = false;
    this.file = [];
    this.s.restaurer(snap);
    this.attendSnap = false;
    this.tDernier = horloge();
    this.signaler({ type: 'info', code: 'reconnecte' });
    this.minuteur = setTimeout(this.battement, 0);
  };

  // Ordre du joueur de l'appareil : [type, a, b, c]. Renvoie true s'il part.
  Partie.prototype.ordre = function (ordre) {
    if (!ordreBienForme(ordre) || !this.s || this.s.resultat) return false;
    if (this.mode === 'local') {
      if (this.enPause) return false;
      this.seq += 1;
      return this.cad.recevoir(this.camp, this.seq, ordre.slice());
    }
    if (this.mode === 'en-ligne' || this.mode === 'connexion') {
      this.seq += 1;
      this.versLanceur({ op: 'ordre', seq: this.seq, o: ordre.slice() });
      return true;
    }
    return false;
  };

  // Pause : seulement contre le robot (en ligne, la partie continue ; le moteur rattrape
  // les ticks au retour).
  Partie.prototype.pause = function (oui) {
    oui = !!oui;
    if (oui === this.enPause) return;
    this.enPause = oui;
    if (!oui) { this.tDernier = horloge(); clearTimeout(this.minuteur); this.minuteur = setTimeout(this.battement, 0); }
  };

  Partie.prototype.jouerPaquet = function (paquet) {
    var s = this.s;
    if (!s || !paquet || paquet.k !== s.k() + 1) return false;
    var avaitFin = !!s.resultat;
    var ctlAvant = s.etat.ctl.slice();
    var h = s.avancer(paquet.o);
    for (var c = 0; c < ctlAvant.length; c++) {
      if (s.etat.ctl[c] !== ctlAvant[c]) this.signaler({ type: 'controle', camp: c, niveau: s.etat.ctl[c] });
    }
    if (h && this.mode === 'en-ligne') this.versLanceur({ op: 'hash', k: paquet.k, h: h });
    if (!avaitFin && s.resultat) {
      this.signaler({ type: 'fin', resultat: s.resultat });
      if (this.mode === 'en-ligne') this.versLanceur({ op: 'fin', k: paquet.k, resultat: s.resultat });
    }
    return true;
  };

  // Boucle (minuterie courte, découplée du rendu) : joue les ticks dus, sans jamais en
  // jouer plus de rattrapageMax d'un coup (l'affichage ne gèle pas ; un onglet revenu
  // d'arrière-plan rattrape en quelques images).
  Partie.prototype.boucle = function () {
    clearTimeout(this.minuteur);
    var s = this.s;
    if (!s || (this.mode !== 'local' && this.mode !== 'en-ligne')) return;
    var maintenant = horloge(), tick = this.r.tickMs, joues = 0;
    if (this.mode === 'local') {
      if (this.enPause || s.resultat) {
        this.tDernier = maintenant;
        if (s.resultat) {
          // Partie finie pendant une coupure : le lanceur arrête de chercher à se reconnecter.
          if (this.retour) { this.retour = false; this.versLanceur({ op: 'quitter' }); }
          this.mode = 'fin';
          return;
        }
      }
      else {
        var dus = Math.floor((maintenant - this.tDernier) / tick);
        // Contre le robot, un long retard (appareil endormi) n'est pas rattrapé : la partie reprend où elle était.
        if (dus > this.r.rattrapageMax) { dus = 1; this.tDernier = maintenant - tick; }
        while (dus > 0 && !s.resultat) { this.cad.pas(); this.tDernier += tick; dus--; joues++; }
      }
    } else {
      // En ligne : on suit l'horloge distante, avec une petite réserve pour lisser le réseau.
      this.file.sort(function (a, b) { return a.k - b.k; });
      while (this.file.length && this.file[0].k <= s.k()) this.file.shift();
      if (this.file.length && this.file[0].k !== s.k() + 1 && !this.attendSnap && maintenant - (this.repriseA || 0) > 1000) {
        this.attendSnap = true;      // paquet manquant : on redemande l'état (une fois par seconde au plus)
        this.repriseA = maintenant;
        this.versLanceur({ op: 'reprise', depuis: s.k() });
      }
      // Demande restée sans réponse (message perdu pendant une coupure) : on pourra redemander.
      if (this.attendSnap && maintenant - (this.repriseA || 0) > 3000) this.attendSnap = false;
      var aJouer = Math.floor((maintenant - this.tDernier) / tick);
      if (this.file.length > this.r.reserve) aJouer = Math.max(aJouer, this.file.length - this.r.reserve);
      aJouer = Math.min(aJouer, this.r.rattrapageMax);
      while (aJouer > 0 && this.file.length && this.file[0].k === s.k() + 1) {
        this.jouerPaquet(this.file.shift());
        this.tDernier = Math.max(this.tDernier + tick, maintenant - tick);
        aJouer--; joues++;
      }
      if (!this.file.length && maintenant - this.tDernier > tick) this.tDernier = maintenant - tick;
      if (s.resultat && !this.file.length) { this.mode = 'fin'; this.versLanceur({ op: 'quitter' }); return; }
    }
    this.minuteur = setTimeout(this.battement, joues > 1 ? 0 : 16);
  };

  racine.JEL_TR = {
    PROTOCOLE: PROTOCOLE,
    CAMPS_MAX: CAMPS_MAX,
    modeDe: modeDe,
    placesHumaines: placesHumaines,
    configMode: configMode,
    campsDe: campsDe,
    T_CONTROLE: T_CONTROLE,
    ORDRE_MAX: ORDRE_MAX,
    flottant: flottant,
    empreinte: empreinte,
    REGLAGES: REGLAGES,
    copie: copie,
    tirer: tirer,
    aleaDe: aleaDe,
    racineEntiere: racineEntiere,
    div: div,
    sinus: sinus,
    cosinus: cosinus,
    hacher: hacher,
    premierFlottant: premierFlottant,
    ordreBienForme: ordreBienForme,
    trierOrdres: trierOrdres,
    problemesSim: problemesSim,
    Simulation: Simulation,
    rejouer: rejouer,
    Cadenceur: Cadenceur,
    Partie: Partie,
    creer: function (o) { return new Partie(o); },
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script id="jel-sim">

// ============================================================

// ============================================================
//  NOVA DOMINION — données de jeu
// ============================================================
const TILE = 32;
const TICK = 0.05;            // 20 ticks de simulation par seconde
const POP_CAP = 150;
const CLS = { bio: 0, light: 1, heavy: 2, air: 3, bld: 4 };
const TEAM_COLORS = ['#3d8bff', '#ff4a3d', '#36d67a', '#ffb52e'];

// mult = multiplicateurs de dégâts contre [bio, léger, lourd, aérien, bâtiment]
const UT = {

    harvest: true, build: true
  },
  marine: {

    weapon: { dmg: 7, range: 5.5, cd: .7, mult: [1, 1, .45, .8, .5], air: true, ground: true, proj: 'bullet' }
  },
  rocket: {
    cls: 'bio', hp: 80, cost: 100, time: 17, speed: 62, r: 7, vision: 8, pop: 1, key: 'KeyW',
    weapon: { dmg: 24, range: 6.5, cd: 2.0, mult: [.45, 1.2, 1.5, 1.4, 1], air: true, ground: true, proj: 'missile' }
  },
  medic: {
    cls: 'bio', hp: 75, cost: 90, time: 15, speed: 72, r: 7, vision: 8, pop: 1, key: 'KeyE',
    heal: 9, healRange: 3.5

// ============================================================
//  Utilitaires : traduction, aléatoire, bruit, maths
// ============================================================
// Texte traduit (module commun jel-i18n du site) ; sans module : la clé elle-même
const traduire = (cle, vars) => (typeof window !== 'undefined' && window.JEL_I18N) ? window.JEL_I18N.t(cle, vars) : cle;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// Hasard de la partie en cours : suite tirée de G.a (même suite partout, gardée dans les instantanés)
function hasardG() { return FM_TIRER(G) / 4294967296; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
const smooth = t => t * t * (3 - 2 * t);

// Bruit de valeur 2D lissé (déterministe par graine)
function makeNoise(seed) {
  const rnd = mulberry32(seed);
  const P = new Uint8Array(512), V = new Float32Array(256);
  for (let i = 0; i < 256; i++) { P[i] = i; V[i] = rnd(); }
  for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = P[i]; P[i] = P[j]; P[j] = t; }
  for (let i = 0; i < 256; i++) P[i + 256] = P[i];
  function n2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const a = V[P[P[X] + Y]], b = V[P[P[X + 1] + Y]], c = V[P[P[X] + Y + 1]], d = V[P[P[X + 1] + Y + 1]];
    const u = smooth(xf), v = smooth(yf);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  }
  function fbm(x, y, oct = 5, lac = 2, gain = .5) {
    let s = 0, amp = .5, f = 1, norm = 0;
    for (let i = 0; i < oct; i++) { s += amp * n2(x * f, y * f); norm += amp; amp *= gain; f *= lac; }
    return s / norm;
  }
  function ridged(x, y, oct = 4) {
    let s = 0, amp = .5, f = 1, norm = 0;
    for (let i = 0; i < oct; i++) { const v = 1 - Math.abs(n2(x * f, y * f) * 2 - 1); s += amp * v * v; norm += amp; amp *= .5; f *= 2.1; }
    return s / norm;
  }
  return { n2, fbm, ridged };
}

// Tas binaire min sur indices (pour A*)
class MinHeap {
  constructor(n) { this.k = new Float32Array(n); this.v = new Int32Array(n); this.n = 0; }
  clear() { this.n = 0; }
  push(v, k) {
    let i = this.n++; const K = this.k, Vv = this.v;
    while (i > 0) { const p = (i - 1) >> 1; if (K[p] <= k) break; K[i] = K[p]; Vv[i] = Vv[p]; i = p; }
    K[i] = k; Vv[i] = v;
  }
  pop() {

function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

// ============================================================
//  Génération procédurale des cartes (symétrique, équitable)
// ============================================================
const SPT = 4; // échantillons de hauteur par case

function genMap(seed, size, themeKey) {
  const W = size, H = size, SW = W * SPT + 1, SH = H * SPT + 1;
  const rnd = mulberry32(seed * 9973 + 17);
  const N = makeNoise(seed), N2 = makeNoise(seed * 31 + 7);
  const hgt = new Float32Array(SW * SH);
  const feat = 1 / (SPT * (10 + size / 12));
  // hauteur brute, symétrie miroir sur les deux axes
  for (let sy = 0; sy < SH; sy++) for (let sx = 0; sx < SW; sx++) {
    const mx = Math.min(sx, SW - 1 - sx), my = Math.min(sy, SH - 1 - sy);
    const f = N.fbm(mx * feat + 11.3, my * feat + 5.1, 5);
    const r = N2.ridged(mx * feat * .7 + 3, my * feat * .7 + 9, 4);
    hgt[sy * SW + sx] = f * .78 + r * .32;
  }
  // points importants : départs (coins) puis extensions
  const ins = Math.max(10, Math.round(size * .14));
  const starts = [
    { x: ins, y: ins }, { x: W - 1 - ins, y: H - 1 - ins }, { x: W - 1 - ins, y: ins }, { x: ins, y: H - 1 - ins }
  ];
  const cx = W / 2, cy = H / 2;
  const fields = [];
  for (const s of starts) {
    let dx = s.x - cx, dy = s.y - cy; const l = FM.hypot(dx, dy); dx /= l; dy /= l;
    fields.push({ x: s.x + dx * 6.5, y: s.y + dy * 6.5, dir: FM.atan2(dy, dx), n: 8, amount: 2400, main: true, arc: true, start: starts.indexOf(s) });
  }
  const e = Math.round(size * .12);
  [[cx, e], [cx, H - 1 - e], [e, cy], [W - 1 - e, cy]].forEach(([x, y]) => fields.push({ x, y, n: 7, amount: 2000, main: false }));
  if (size >= 96) fields.push({ x: cx, y: cy, n: 8, amount: 2000, main: false });
  if (size >= 112) {
    const q = Math.round(size * .3);
    [[q, q], [W - 1 - q, q], [q, H - 1 - q], [W - 1 - q, H - 1 - q]].forEach(([x, y]) => fields.push({ x, y, n: 6, amount: 2000, main: false }));
  }

  // seuils par percentiles : ~11 % falaises, ~8 % liquide
  const sorted = Float32Array.from(hgt).sort();
  const pct = p => sorted[Math.floor(p * (sorted.length - 1))];
  const cliffT = pct(.885), liqT = pct(.085), mid = pct(.5);
  // aplanir autour des bases et des gisements
  const flat = (tx, ty, rad) => {
    const scx = tx * SPT + SPT / 2, scy = ty * SPT + SPT / 2, R = rad * SPT;
    for (let sy = Math.max(0, scy - R | 0); sy < Math.min(SH, scy + R + 1); sy++)
      for (let sx = Math.max(0, scx - R | 0); sx < Math.min(SW, scx + R + 1); sx++) {
        const d = FM.hypot(sx - scx, sy - scy) / R; if (d >= 1) continue;
        const t = smooth(d), i = sy * SW + sx;
        hgt[i] = lerp(mid + (hgt[i] - mid) * .25, hgt[i], t);
      }
  };
  starts.forEach(s => flat(s.x, s.y, 12));
  fields.forEach(f => flat(f.x, f.y, f.main ? 6 : 7));

  const ter = new Uint8Array(W * H);
  const classify = () => {
    for (let ty = 0; ty < H; ty++) for (let tx = 0; tx < W; tx++) {
      const b = ty * SPT * SW + tx * SPT;
      const c = b + (SPT / 2) * SW + SPT / 2;
      const v = (hgt[c] * 2 + hgt[b] + hgt[b + SPT] + hgt[b + SPT * SW] + hgt[b + SPT * SW + SPT]) / 6;
      ter[ty * W + tx] = v > cliffT ? 1 : v < liqT ? 2 : 0;
    }
  };
  classify();

  // connectivité : chaque base doit rejoindre la base 0 par voie terrestre
  const reach = new Uint8Array(W * H);
  const flood = () => {
    reach.fill(0); const q = [starts[0].y * W + starts[0].x]; reach[q[0]] = 1;
    while (q.length) {
      const i = q.pop(), x = i % W, y = (i / W) | 0;
      for (const [ax, ay] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + ax, ny = y + ay; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const j = ny * W + nx; if (!reach[j] && ter[j] === 0) { reach[j] = 1; q.push(j); }
      }
    }
  };
  const carve = (ax, ay, bx, by) => {
    const steps = Math.ceil(FM.hypot(bx - ax, by - ay) * 2);
    for (let k = 0; k <= steps; k++) {
      const x = lerp(ax, bx, k / steps), y = lerp(ay, by, k / steps);
      const scx = x * SPT + 2, scy = y * SPT + 2, R = 2.4 * SPT;
      for (let sy = Math.max(0, scy - R | 0); sy < Math.min(SH, scy + R + 1); sy++)
        for (let sx = Math.max(0, scx - R | 0); sx < Math.min(SW, scx + R + 1); sx++) {
          const d = FM.hypot(sx - scx, sy - scy) / R; if (d >= 1) continue;
          const i = sy * SW + sx, tgt = clamp(hgt[i], liqT + .03, cliffT - .03);
          hgt[i] = lerp(tgt, hgt[i], smooth(d));
        }
    }
  };
  for (let pass = 0; pass < 6; pass++) {
    flood();
    let ok = true;
    const pts = [...starts, ...fields.map(f => ({ x: Math.round(f.x), y: Math.round(f.y) }))];
    for (const p of pts) {
      if (!reach[p.y * W + p.x]) {
        ok = false;
        // relier vers le point atteignable le plus proche dans la direction de la base 0
        let best = null, bd = 1e9;
        for (let i = 0; i < W * H; i++) if (reach[i]) { const x = i % W, y = (i / W) | 0, d = dist2(x, y, p.x, p.y); if (d < bd) { bd = d; best = { x, y }; } }
        if (best) carve(p.x, p.y, best.x, best.y);
      }
    }
    classify();
    if (ok) break;
  }
  flood();

  // gisements de cristaux
  const crystals = [];
  const used = new Uint8Array(W * H);
  const reserve = (s) => { for (let y = s.y - 3; y <= s.y + 3; y++) for (let x = s.x - 3; x <= s.x + 3; x++) if (x >= 0 && y >= 0 && x < W && y < H) used[y * W + x] = 1; };
  starts.forEach(reserve);
  for (const f of fields) {
    let placed = 0, tries = 0;
    while (placed < f.n && tries < 200) {
      tries++;
      let x, y;
      if (f.arc) {
        const a = f.dir + (placed / (f.n - 1) - .5) * 1.9 + (rnd() - .5) * .25;
        const rr = 6.5 + (rnd() - .5) * 1.4 + (placed % 2) * .9;
        const s = starts[fields.indexOf(f)];
        x = Math.round(s.x + FM.cos(a) * rr); y = Math.round(s.y + FM.sin(a) * rr);
      } else {
        const a = rnd() * Math.PI * 2, rr = rnd() * 2.6;
        x = Math.round(f.x + FM.cos(a) * rr); y = Math.round(f.y + FM.sin(a) * rr);
      }
      if (x < 1 || y < 1 || x >= W - 1 || y >= H - 1) continue;
      const i = y * W + x;
      if (used[i] || ter[i] !== 0 || !reach[i]) continue;
      used[i] = 1; crystals.push({ x, y, amount: f.amount, main: f.main }); placed++;
    }
  }

  // décor (purement visuel)
  const decor = [];
  const nd = Math.round(W * H / 9);
  for (let k = 0; k < nd; k++) {
    const x = rnd() * W, y = rnd() * H, ti = (y | 0) * W + (x | 0);
    const r = rnd();
    if (ter[ti] === 2) continue;
    if (ter[ti] === 1) { if (r < .5) decor.push({ k: 'boulder', x, y, s: .5 + rnd() * 1.2, rot: rnd() * 6.3 }); continue; }
    if (used[ti]) continue;
    if (r < .62) decor.push({ k: 'pebbles', x, y, s: .4 + rnd(), rot: rnd() * 6.3 });
    else if (r < .80) decor.push({ k: 'rock', x, y, s: .35 + rnd() * .55, rot: rnd() * 6.3 });
    else if (r < .92) decor.push({ k: 'crack', x, y, s: .6 + rnd() * 1.4, rot: rnd() * 6.3 });
    else decor.push({ k: 'crater', x, y, s: .6 + rnd() * 1.8, rot: rnd() * 6.3 });
  }
  return { W, H, SW, SH, hgt, ter, starts, crystals, decor, cliffT, liqT, mid, theme: themeKey, seed, fields: fields.map(f => ({ x: f.x, y: f.y, main: f.main, start: f.start })) };
}

// ============================================================
//  Simulation : entités, déplacements, combat, économie
// ============================================================
let G = null;
const CARRY = 8, MINE_TIME = 1.7, REACH = 27;
const CELL = 128;

// Cartes déjà générées (une partie en ligne rebâtit sa carte à chaque instantané) : la carte n'est jamais modifiée.
const CARTES = [];
function carteDe(seed, size, theme) {
  const cle = seed + '|' + size + '|' + theme;
  for (const c of CARTES) if (c.cle === cle) return c.map;
  const map = genMap(seed, size, theme);
  CARTES.unshift({ cle, map }); if (CARTES.length > 3) CARTES.pop();

}
function newGame(cfg) {
  const map = carteDe(cfg.seed, cfg.size, cfg.theme);

    cfg, map, W, H, tick: 0, time: 0, ents: [], byId: new Map(), nextId: 1, projs: [],
    players: [], me: cfg.me ?? 0, mode: cfg.mode || 'solo', mission: cfg.mission || null,
    pass: new Uint8Array(W * H), bgrid: new Int32Array(W * H), rgrid: new Int32Array(W * H),
    vis: [0, 1, 2, 3].map(() => new Uint8Array(W * H)), exp: [0, 1, 2, 3].map(() => new Uint8Array(W * H)),
    cw: Math.ceil(W * TILE / CELL), ch: Math.ceil(H * TILE / CELL), cells: null,
    pathQ: [], over: false, result: null, fxq: [], msgq: [], a: (cfg.seed + 77) >>> 0, rng: hasardG, stats: null
  };
  G.cells = new Array(G.cw * G.ch).fill(0).map(() => []);
  for (let i = 0; i < W * H; i++) G.pass[i] = map.ter[i] === 0 ? 1 : 0;
  initPath();
  if (!cfg.client) for (const c of map.crystals) makeRes(c.x, c.y, c.amount);
  cfg.players.forEach((pc, i) => {
    const p = {
      id: i, name: pc.name, team: pc.team, color: TEAM_COLORS[pc.color ?? i], colorIdx: pc.color ?? i,
      ai: pc.ai || null, human: !!pc.human, remote: !!pc.remote, credits: pc.credits ?? 600, gathered: 0, ups: {},
      pop: 0, powerProd: 0, powerUse: 0, defeated: false, start: map.starts[pc.start], immortal: !!pc.immortal,
      allow: pc.allow || null, unitsAllow: pc.unitsAllow || null, noBld: false,
      st: { built: 0, lost: 0, kills: 0, bLost: 0, bKills: 0 }, waves: pc.waves || null, aiState: null
    };
    G.players.push(p);
  });
  // forces de départ
  if (!cfg.client) G.players.forEach((p, i) => setupPlayer(p, cfg.players[i]));
  recomputePlayers();
  computeFog(true);
  if (!cfg.client) G.players.forEach(p => { if (p.ai) aiInit(p); });
  G.revealAll = !!cfg.reveal;
  return G;
}

function setupPlayer(p, pc) {
  const s = p.start;
  if (pc.hq !== false) {
    const hq = makeBld('hq', p.id, s.x - 1, s.y - 1, true);
    const nw = pc.workers ?? 5;
    for (let k = 0; k < nw; k++) {
      const a = k / nw * Math.PI * 2;
      const u = makeUnit('worker', p.id, hq.x + FM.cos(a) * 64, hq.y + FM.sin(a) * 64);
      autoHarvest(u);
    }
  }
  if (pc.outpost) {
    const slots = [[-5, -1], [3, -1], [-1, 3], [-1, -5], [3, 3], [-5, 3], [3, -5], [-5, -5], [-1, -1], [6, -1], [-1, 6], [-8, -1]];
    let si = 0;
    for (const [t, n] of Object.entries(pc.outpost)) for (let k = 0; k < n; k++) {
      while (si < slots.length) {
        const [ox, oy] = slots[si++]; const tx = s.x + ox, ty = s.y + oy;
        if (canPlace(t, tx, ty, -1, true)) { makeBld(t, p.id, tx, ty, true); break; }
      }
    }
  }
  if (pc.extraTurrets) {
    for (let k = 0; k < pc.extraTurrets; k++) {
      const a = k / pc.extraTurrets * Math.PI * 2 + .4;
      for (let r = 5; r < 9; r++) { const tx = Math.round(s.x + FM.cos(a) * r), ty = Math.round(s.y + FM.sin(a) * r); if (canPlace('turret', tx, ty, -1, true)) { makeBld('turret', p.id, tx, ty, true); break; } }
    }
  }
  if (pc.vip) {
    let k = 0;
    const cx = (s.x + .5) * TILE, cy = (s.y + .5) * TILE;
    for (const [t, n] of Object.entries(pc.vip)) for (let j = 0; j < n; j++) {
      const pos = freeSpot(cx + 90, cy + 90, k++);
      const u = makeUnit(t, p.id, pos.x, pos.y); u.vip = true; if (pc.vipHp) u.hp = Math.round(u.mhp * pc.vipHp);
      G.vipTotal = (G.vipTotal || 0) + 1;
    }
  }
  if (pc.units) {
    let k = 0;
    const cx = (s.x + .5) * TILE, cy = (s.y + .5) * TILE;
    for (const [t, n] of Object.entries(pc.units)) for (let j = 0; j < n; j++) {
      const pos = freeSpot(cx, cy, k++);
      makeUnit(t, p.id, pos.x, pos.y);
    }
  }
}

function freeSpot(cx, cy, k) {
  // spirale de positions libres autour d'un point
  let n = 0;
  for (let r = 0; r < 14; r++) for (let a = 0; a < Math.max(1, r * 6); a++) {
    const ang = a / Math.max(1, r * 6) * Math.PI * 2;
    const x = cx + FM.cos(ang) * r * 22, y = cy + FM.sin(ang) * r * 22;
    const tx = (x / TILE) | 0, ty = (y / TILE) | 0;
    if (tx < 0 || ty < 0 || tx >= G.W || ty >= G.H) continue;
    const i = ty * G.W + tx;
    if (!G.pass[i] || G.bgrid[i] || G.rgrid[i]) continue;
    if (n++ === k) return { x, y };
  }
  return { x: cx, y: cy };
}

// ---------------- entités ----------------
function addEnt(e) { e.id = G.nextId++; G.ents.push(e); G.byId.set(e.id, e); return e; }
function makeUnit(t, o, x, y) {
  const d = UT[t];
  const e = addEnt({
    k: 'u', t, o, x, y, px: x, py: y, hp: d.hp, mhp: d.hp, r: d.r, a: G ? G.rng() * 6.28 : 0, ta: 0, cd: 0,
    st: 'idle', path: null, pi: 0, dest: null, tgt: 0, scan: (G.rng() * 8) | 0, carry: 0, res: 0, mine: 0, bld: 0,
    fly: !!d.fly, stuck: 0, lastX: x, lastY: y, repath: 0, home: null, auto: false, anim: G.rng() * 10, moving: false, hold: false, fireT: 0
  });
  e.ta = e.a;
  if (G.players[o]) G.players[o].st.built++;
  return e;
}
function makeBld(t, o, tx, ty, built) {
  const d = BT[t];
  const e = addEnt({
    k: 'b', t, o, tx, ty, w: d.w, h: d.h, x: (tx + d.w / 2) * TILE, y: (ty + d.h / 2) * TILE,
    hp: built ? d.hp : d.hp * .1, mhp: d.hp, built: !!built, prog: built ? 1 : 0, queue: [], qp: 0, rally: null,
    cd: 0, ta: -Math.PI / 2, tgt: 0, scan: 0, r: Math.max(d.w, d.h) * TILE * .5, seen: 0, fireT: 0
  });

  return e;
}
function makeRes(tx, ty, amount) {
  const e = addEnt({ k: 'r', t: 'crystal', o: -1, tx, ty, x: (tx + .5) * TILE, y: (ty + .5) * TILE, amount, max: amount, r: 14, hp: 1, mhp: 1, var: (tx * 7 + ty * 13) % 5 });

}
function blocked(i) { return !G.pass[i] || G.bgrid[i] !== 0 || G.rgrid[i] !== 0; }
function tileOf(x) { return (x / TILE) | 0; }

function canPlace(t, tx, ty, pid, ignoreFog) {
  const d = BT[t]; if (!d) return false;
  if (tx < 1 || ty < 1 || tx + d.w > G.W - 1 || ty + d.h > G.H - 1) return false;
  const team = pid >= 0 ? G.players[pid].team : -1;
  for (let y = ty; y < ty + d.h; y++) for (let x = tx; x < tx + d.w; x++) {
    const i = y * G.W + x;
    if (blocked(i)) return false;
    if (!ignoreFog && team >= 0 && !G.exp[team][i]) return false;
  }
  // pas d'unité ennemie dessus
  const x0 = tx * TILE, y0 = ty * TILE, x1 = x0 + d.w * TILE, y1 = y0 + d.h * TILE;
  for (const e of G.ents) if (e.k === 'u' && !e.fly && !e.dead && e.x > x0 - 4 && e.x < x1 + 4 && e.y > y0 - 4 && e.y < y1 + 4 && pid >= 0 && G.players[e.o].team !== team) return false;
  return true;
}

function isEnemy(a, b) { return a !== b && a >= 0 && b >= 0 && G.players[a].team !== G.players[b].team; }

// ---------------- pathfinding A* ----------------
let PF;
function initPath() {
  const n = G.W * G.H;
  if (PF && PF.g.length === n) return;

}
function nearestFree(gx, gy, fromX, fromY, rmax = 8) {
  const W = G.W, H = G.H;
  if (gx >= 0 && gy >= 0 && gx < W && gy < H && !blocked(gy * W + gx)) return gy * W + gx;
  let best = -1, bd = 1e9;
  for (let r = 1; r <= rmax; r++) {
    for (let y = gy - r; y <= gy + r; y++) for (let x = gx - r; x <= gx + r; x++) {
      if (Math.max(Math.abs(x - gx), Math.abs(y - gy)) !== r) continue;
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const i = y * W + x; if (blocked(i)) continue;
      const d = dist2(x, y, gx, gy) * 4 + dist2(x, y, fromX, fromY) * .05;
      if (d < bd) { bd = d; best = i; }
    }

function findPath(sx, sy, gx, gy, budget) {
  const W = G.W, H = G.H;

  // différentes) dans la même mémoire ; ils sont refaits si la carte en cours n'a pas la même taille.
  initPath();

  const hfn = (x, y) => { const dx = Math.abs(x - tgx), dy = Math.abs(y - tgy); return (dx + dy) + (1.414 - 2) * Math.min(dx, dy); };
  PF.g[start] = 0; PF.open[start] = gen; PF.from[start] = -1;
  heap.push(start, hfn(sx, sy));

  while (heap.n > 0) {

    PF.closed[cur] = gen;
    if (cur === goal) { best = cur; break; }
    if (++exp > budget) break;
    const cx = cur % W, cy = (cur / W) | 0;

      const ni = ny * W + nx;

// ---------------- unités ----------------
function goAdjacent(u, t, jitter) {

  if (u.fly) { reqPath(u, t.x, t.y); return; }
  const tx = t.k === 'u' ? tileOf(t.x) : t.tx, ty = t.k === 'u' ? tileOf(t.y) : t.ty;
  const w = t.w || 1, h = t.h || 1;
  let best = -1, bd = 1e18;
  for (let y = ty - 1; y <= ty + h; y++) for (let x = tx - 1; x <= tx + w; x++) {
    if (x >= tx && x < tx + w && y >= ty && y < ty + h) continue;
    if (x < 0 || y < 0 || x >= G.W || y >= G.H) continue;
    const i = y * G.W + x; if (blocked(i)) continue;
    const px = (x + .5) * TILE, py = (y + .5) * TILE;
    let dd = FM.sqrt(dist2(px, py, u.x, u.y));
    const corner = (x < tx || x >= tx + w) && (y < ty || y >= ty + h);
    if (corner) dd += 10;
    if (t.k === 'r') query(px, py, 14, v => { if (v !== u && v.k === 'u' && v.t === 'worker' && !v.dead) dd += 22; });
    if (jitter) dd += G.rng() * 80;
    if (dd < bd) { bd = dd; best = i; }
  }
  if (best < 0) { reqPath(u, t.x, t.y); return; }

}
function nearestDropoff(u) {
  let best = null, bd = 1e18;
  for (const e of G.ents) if (e.k === 'b' && !e.dead && e.built && e.o === u.o && BT[e.t].dropoff) {
    const d = dist2(e.x, e.y, u.x, u.y); if (d < bd) { bd = d; best = e; }
  }
  return best;
}
function nearestCrystal(x, y, maxD, avoidId) {
  let best = null, bd = maxD * maxD;
  for (const e of G.ents) if (e.k === 'r' && !e.dead && e.amount > 0 && e.id !== avoidId) {
    const d = dist2(e.x, e.y, x, y); if (d < bd) { bd = d; best = e; }
  }

}
function dropoffsOf(o) { return G.ents.filter(e => e.k === 'b' && !e.dead && e.built && e.o === o && BT[e.t].dropoff); }
function workersOn(o, rid, except) {
  let n = 0;
  for (const e of G.ents) if (e.k === 'u' && e !== except && !e.dead && e.o === o && e.t === 'worker' && e.st === 'harvest' && e.res === rid) n++;

// Choisit un cristal : proche de (x, y), peu occupé, proche d'un dépôt du joueur
function pickCrystal(u, x, y, maxD, avoidId) {

function autoHarvest(u) {

function updateUnit(u, dt) {
  const d = UT[u.t];

  u.anim += dt;
  u.scan--;
  const w = d.weapon;
  const team = G.players[u.o].team;

  // soins

    }

    b.blockedPop = false;
    let rate = p.lowPower ? .5 : 1;
    if (p.ai) rate *= AI_LEVELS[p.ai].prodMul;
    q.p += dt * rate / total;
    if (q.p >= 1) {
      b.queue.shift();
      if (isUnit) spawnFrom(b, q.t);
      else { p.ups[q.t] = true; notify(b.o, 'msg.rechercheFinie', { nom: '@up.' + q.t + '.nom' }, b.x, b.y, 'ok'); fx('snd', 'done', b.x, b.y); }

}

    if (i < 0) { x = b.x; y = b.y + b.h * TILE * .5 + 12; }

    if (d.harvest && b.rally.res) { const r = G.byId.get(b.rally.res); if (r && !r.dead) { u.st = 'harvest'; u.res = r.id; u.phase = 'go'; return u; } }
    u.st = d.weapon ? 'amove' : 'move'; u.goal = { x: b.rally.x, y: b.rally.y }; reqPath(u, b.rally.x, b.rally.y);

}

// ---------------- séparation ----------------
function separate(dt) {
  for (let i = 0; i < G.cells.length; i++) {
    const c = G.cells[i];
    for (let a = 0; a < c.length; a++) {
      const u = c[a]; if (u.k !== 'u' || u.dead) continue;
      query(u.x, u.y, u.r + 24, v => {
        if (v === u || v.k !== 'u' || v.dead || v.fly !== u.fly || v.id < u.id) return;
        if (u.t === 'worker' && v.t === 'worker' && (u.st === 'harvest' || v.st === 'harvest')) return;
        const dx = v.x - u.x, dy = v.y - u.y; const min = (u.r + v.r) * (u.fly ? 1.1 : .85);
        const d2 = dx * dx + dy * dy; if (d2 >= min * min) return;
        const d = FM.sqrt(d2) || .01; const push = (min - d) * .5;
        let nx = dx / d, ny = dy / d; if (d < .02) { nx = FM.cos(u.id); ny = FM.sin(u.id); }
        // l'unité qui bouge pousse celle qui est arrêtée
        const um = u.moving || u.path, vm = v.moving || v.path;
        let fu = .5, fv = .5;
        if (um && !vm) { fu = .2; fv = .8; } else if (vm && !um) { fu = .8; fv = .2; }
        if (u.mining || u.buildFx) fu *= .3; if (v.mining || v.buildFx) fv *= .3;
        moveSafe(u, -nx * push * fu * 2, -ny * push * fu * 2);
        moveSafe(v, nx * push * fv * 2, ny * push * fv * 2);
      });
    }
  }
  // dégager les unités au sol coincées dans une case bloquée
  if (G.tick % 4 === 0) for (const u of G.ents) {
    if (u.k !== 'u' || u.fly || u.dead) continue;
    const tx = tileOf(u.x), ty = tileOf(u.y);
    if (tx < 0 || ty < 0 || tx >= G.W || ty >= G.H) { u.x = clamp(u.x, 16, G.W * TILE - 16); u.y = clamp(u.y, 16, G.H * TILE - 16); continue; }
    if (blocked(ty * G.W + tx)) {
      const i = nearestFree(tx, ty, tx, ty, 5);
      if (i >= 0) { const nx = (i % G.W + .5) * TILE, ny = (((i / G.W) | 0) + .5) * TILE; u.x += (nx - u.x) * .35; u.y += (ny - u.y) * .35; }
    }
  }
  for (const u of G.ents) if (u.k === 'u' && u.fly) { u.x = clamp(u.x, 8, G.W * TILE - 8); u.y = clamp(u.y, 8, G.H * TILE - 8); }
}
function moveSafe(u, dx, dy) {
  if (u.fly) { u.x += dx; u.y += dy; return; }
  const nx = u.x + dx, ny = u.y + dy;
  const tx = tileOf(nx), ty = tileOf(ny);
  if (tx < 0 || ty < 0 || tx >= G.W || ty >= G.H) return;
  if (blocked(ty * G.W + tx)) {
    // glisser le long de l'obstacle
    const tx2 = tileOf(u.x + dx), ty2 = tileOf(u.y);
    if (!blocked(ty2 * G.W + tx2)) u.x += dx;
    else { const tx3 = tileOf(u.x), ty3 = tileOf(u.y + dy); if (!blocked(ty3 * G.W + tx3)) u.y += dy; }
    return;
  }
  u.x = nx; u.y = ny;
}

// ---------------- brouillard de guerre ----------------
const CIRC = {};
function circle(r) {
  if (CIRC[r]) return CIRC[r];
  const o = []; for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r) o.push(x, y);
  return CIRC[r] = o;
}
function computeFog(first) {
  const teams = new Set(G.players.map(p => p.team));
  for (const t of teams) G.vis[t].fill(0);
  for (const e of G.ents) {
    if (e.dead || e.o < 0) continue;
    const team = G.players[e.o].team;
    const r = e.k === 'u' ? UT[e.t].vision : (e.built ? BT[e.t].vision : 3);
    const cx = tileOf(e.x), cy = tileOf(e.y);
    const c = circle(r), V = G.vis[team], E = G.exp[team], W = G.W, H = G.H;
    for (let k = 0; k < c.length; k += 2) {
      const x = cx + c[k], y = cy + c[k + 1];
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const i = y * W + x; V[i] = 1; E[i] = 1;
    }
  }
  // mémoriser les bâtiments vus
  for (const e of G.ents) if (e.k === 'b' && !e.dead) for (const t of teams) if (visibleTo(e, t)) e.seen |= (1 << t);
  if (typeof FOG !== 'undefined') FOG.dirty = true;
}

// ---------------- fin de partie ----------------
function checkEnd() {
  if (G.over) return;
  for (const p of G.players) {
    if (p.defeated) continue;
    if (p.nb === 0 && p.nu === 0 && !p.immortal) {
      p.defeated = true;
      for (const q of G.players) notify(q.id, 'msg.elimine', { nom: p.name }, 0, 0, 'warn');
    }
  }
  if (G.mode === 'tr') { finTR(); return; }
  const m = G.mission;
  const me = G.players[G.me];
  if (m && G.mode === 'solo') {
    if (me.defeated) return SORTIES.fin(false);
    if (m.limit && G.time > m.limit) return SORTIES.fin(false, 'fin.tempsEcoule');
    if (m.protectAlly && G.players.some(p => p.id !== me.id && p.team === me.team && p.defeated)) return SORTIES.fin(false, 'fin.allieElimine');
    const enemies = G.players.filter(p => isEnemy(me.id, p.id));
    if (m.obj === 'destroy' && enemies.every(p => p.defeated || p.waves)) return SORTIES.fin(true);
    if (m.obj === 'vip' && !G.ents.some(e => e.vip && !e.dead)) return SORTIES.fin(true);
    if (m.obj === 'expand' && G.ents.filter(e => e.k === 'b' && e.t === 'hq' && e.built && !e.dead && e.o === me.id).length >= m.target) return SORTIES.fin(true);
    if (m.obj === 'hq') {
      const hqLeft = G.ents.some(e => e.k === 'b' && e.t === 'hq' && !e.dead && isEnemy(me.id, e.o));
      if (!hqLeft) return SORTIES.fin(true);
    }
    if (m.obj === 'survive' && G.time >= m.time) return SORTIES.fin(true);
    if (m.obj === 'credits' && me.gathered >= m.target) return SORTIES.fin(true);
    return;
  }
  const alive = new Set(G.players.filter(p => !p.defeated).map(p => p.team));
  if (alive.size <= 1) {
    const wt = [...alive][0];
    G.winTeam = wt;
    SORTIES.fin(G.players[G.me].team === wt);
  } else if (G.players[G.me].defeated && !G.spectate && !G.demo) {
    G.spectate = true; SORTIES.spectateur();
  }
}

// ---------------- missions : vagues ----------------
function missionTick(dt) {
  for (const p of G.players) {
    if (!p.waves || p.defeated) continue;
    const wv = p.waves;
    if (wv.next === undefined) { wv.next = wv.start; wv.n = 0; }
    if (G.time >= wv.next) {
      wv.next += wv.every;
      const size = wv.size + wv.grow * wv.n; wv.n++;
      // point d'apparition : départ de ce joueur
      const s = p.start, cx = (s.x + .5) * TILE, cy = (s.y + .5) * TILE;
      const target = G.players.find(q => isEnemy(p.id, q.id) && !q.defeated);
      if (!target) continue;
      const hq = G.ents.find(e => e.k === 'b' && e.o === target.id && !e.dead) || G.ents.find(e => e.k === 'u' && e.o === target.id && !e.dead);
      if (!hq) continue;
      const us = [];
      for (let k = 0; k < size; k++) {
        const t = wv.types[(k + wv.n) % wv.types.length];
        const pos = freeSpot(cx, cy, k);
        us.push(makeUnit(t, p.id, pos.x, pos.y));
      }
      execCmd({ c: 'amove', p: p.id, ids: us.map(u => u.id), x: hq.x, y: hq.y });
      notify(G.me, 'msg.vague', null, cx, cy, 'alert');
    }
  }
}

// ============================================================
//  Intelligence artificielle des commandants robots
// ============================================================
const AI_PLAN = [
  ['barracks', 1, 0], ['refinery', 0, 0], ['factory', 1, 60], ['turret', 1, 80], ['lab', 1, 160],
  ['airfield', 1, 200], ['barracks', 2, 220], ['turret', 2, 240], ['sam', 1, 260], ['factory', 2, 330],
  ['turret', 3, 380], ['sam', 2, 420], ['airfield', 2, 520], ['barracks', 3, 600], ['turret', 5, 700]
];
const AI_COMP = {
  barracks: [['marine', 5], ['rocket', 3], ['medic', 1], ['sniper', 1.2]],
  factory: [['tank', 5], ['scout', 2], ['arty', 2], ['titan', 1.3]],
  airfield: [['interceptor', 3], ['bomber', 2]]
};

function aiInit(p) {
  const lvl = AI_LEVELS[p.ai];
  const pc = G.cfg.players[p.id];
  p.aiState = {
    t: 1 + G.rng() * 2, waveN: 0, nextAttack: lvl.firstWave * (pc.aggro || 1), mode: pc.aiMode || 'full',
    lastOrder: 0, attackTgt: 0, defending: false, maxBases: pc.maxBases ?? lvl.maxBases
  };
}

function aiTick(p, dt) {
  const S = p.aiState; if (!S) return;
  S.t -= dt; if (S.t > 0) return;
  const lvl = AI_LEVELS[p.ai];
  S.t = lvl.think * (.8 + G.rng() * .4);

  const mine = G.ents.filter(e => e.o === p.id && !e.dead);
  const blds = mine.filter(e => e.k === 'b');
  const units = mine.filter(e => e.k === 'u');
  const workers = units.filter(u => u.t === 'worker');
  const army = units.filter(u => u.t !== 'worker' && UT[u.t].weapon || u.t === 'medic');
  const hq = blds.find(b => b.id === S.mainId && b.built) || blds.find(b => b.t === 'hq' && b.built) || blds.find(b => b.t === 'hq');
  const base = hq || blds[0];
  const count = t => blds.filter(b => b.t === t).length;
  const builtCount = t => blds.filter(b => b.t === t && b.built).length;

  // ---- économie : bases, drones, expansion ----
  const hqs = blds.filter(b => b.t === 'hq');
  const bases = aiBases(p, blds);
  if (S.mode === 'full' && (hq || workers.length)) {
    aiEconomy(p, S, lvl, blds, workers, army, hqs, bases, count, builtCount);
  }

  // ---- production ----
  if (S.mode !== 'none') {
    const enemyAir = G.ents.filter(e => e.k === 'u' && e.fly && isEnemy(p.id, e.o)).length;
    const reserve = S.mode === 'full' && G.time > 30 ? (S.saving ? 420 : 120) : 0;
    for (const b of blds) {
      if (!b.built || !AI_COMP[b.t] || b.queue.length >= 2) continue;
      if (p.credits < reserve + 60) break;
      const opts = AI_COMP[b.t].filter(([t]) => hasReq(p, UT[t].req) && allowedU(p, t) && p.credits >= UT[t].cost + reserve)
        .map(([t, wgt]) => [t, wgt * (enemyAir > 4 && (t === 'rocket' || t === 'interceptor') ? 2.5 : 1)]);
      if (!opts.length) continue;
      const sum = opts.reduce((s, o) => s + o[1], 0); let r = G.rng() * sum, pick = opts[0][0];
      for (const [t, wgt] of opts) { r -= wgt; if (r <= 0) { pick = t; break; } }
      execCmd({ c: 'train', p: p.id, b: b.id, t: pick });
    }
  }

  // ---- armée ----
  if (!base && !army.length) return;
  const center = base ? { x: base.x, y: base.y } : { x: army[0].x, y: army[0].y };
  // menace sur la base
  let threat = null, td = 1e18;
  if (blds.length) {
    for (const e of G.ents) {
      if (e.dead || e.k !== 'u' || !isEnemy(p.id, e.o)) continue;
      for (const b of blds) {
        const d = dist2(e.x, e.y, b.x, b.y);
        if (d < sq(13 * TILE) && d < td) { td = d; threat = e; }
      }
    }
  }
  if (threat) {
    const defenders = army.filter(u => u.st !== 'attack' && (u.st !== 'amove' || !S.attacking || dist2(u.x, u.y, center.x, center.y) < sq(25 * TILE)));
    if (defenders.length) execCmd({ c: 'amove', p: p.id, ids: defenders.map(u => u.id), x: threat.x, y: threat.y });
    S.defending = true;
    return;
  }
  S.defending = false;
  if (S.mode === 'defend') return;

  const idle = army.filter(u => u.st === 'idle');
  // revenus taris (carte épuisée) : assaut avec tout ce qui reste
  if (p.gathered > (S.lastG || 0)) { S.lastG = p.gathered; S.lastGT = G.time; }
  const broke = G.time > 300 && G.time - (S.lastGT || 0) > 45 && p.credits < 300;
  const need = broke ? 1 : Math.min(32, lvl.waveBase + lvl.waveGrow * S.waveN);
  if (!S.attacking && (G.time >= S.nextAttack || broke) && idle.length >= need) {
    const tgt = aiPickTarget(p, center);
    if (tgt) {
      S.attacking = true; S.attackTgt = tgt.id; S.waveN++; S.lastOrder = G.time;
      execCmd({ c: 'amove', p: p.id, ids: army.filter(u => u.st === 'idle' || u.st === 'move').map(u => u.id), x: tgt.x, y: tgt.y });
    }
  } else if (S.attacking) {
    const active = army.filter(u => u.st === 'amove' || u.st === 'attack');
    if (active.length < Math.max(broke ? 1 : 2, need * .25) && G.time - S.lastOrder > 20) {
      // vague épuisée : regroupement
      S.attacking = false; S.nextAttack = G.time + 40 + G.rng() * 30;
      const rp = aiRally(p, center);
      if (idle.length) execCmd({ c: 'move', p: p.id, ids: idle.map(u => u.id), x: rp.x, y: rp.y });
    } else if (idle.length && G.time - S.lastOrder > 6) {
      const tgt = aiPickTarget(p, idle[0]);
      if (tgt) { S.lastOrder = G.time; execCmd({ c: 'amove', p: p.id, ids: idle.map(u => u.id), x: tgt.x, y: tgt.y }); }
    }
  } else {
    // rassemblement au point de ralliement
    const rp = aiRally(p, center);
    const ownHqs = blds.filter(b => b.t === 'hq' && b !== hq);
    const strays = idle.filter(u => dist2(u.x, u.y, rp.x, rp.y) > sq(6 * TILE) && !ownHqs.some(h => dist2(u.x, u.y, h.x, h.y) < sq(9 * TILE)));
    if (strays.length) execCmd({ c: 'move', p: p.id, ids: strays.map(u => u.id), x: rp.x, y: rp.y });
  }
}

// Bases : chaque QG (et raffinerie) avec les cristaux qui l'entourent
function aiBases(p, blds) {
  return blds.filter(b => b.t === 'hq' || b.t === 'refinery').map(b => {
    const crystals = G.ents.filter(r => r.k === 'r' && !r.dead && r.amount > 0 && rectDist(r.x, r.y, b) < 11 * TILE);
    return { b, crystals, cap: Math.min(18, crystals.length * 2), workers: [] };
  });
}
function nearOf(blds, t, b, rad) { return blds.filter(e => e.t === t && dist2(e.x, e.y, b.x, b.y) < sq(rad * TILE)).length; }

function aiEconomy(p, S, lvl, blds, workers, army, hqs, bases, count, builtCount) {
  const main = hqs.find(h => h.built && h.id === S.mainId) || hqs.find(h => h.built) || hqs[0];
  if (main) S.mainId = main.id;
  // affectation des drones aux bases
  const builtBases = bases.filter(B => B.b.built);
  for (const w of workers) {
    if (w.st !== 'harvest') continue;
    const r = G.byId.get(w.res); if (!r) continue;
    let best = null, bd = 1e18;
    for (const B of builtBases) { const d = dist2(r.x, r.y, B.b.x, B.b.y); if (d < bd) { bd = d; best = B; } }
    if (best) best.workers.push(w);
  }
  for (const w of workers) if (w.st === 'idle') autoHarvest(w);
  // rééquilibrage entre bases saturées et bases en manque
  const over = builtBases.filter(B => B.workers.length > B.cap + 1), under = builtBases.filter(B => B.workers.length < B.cap - 1 && B.crystals.length);
  if (over.length && under.length) {
    const from = over[0], to = under[0];
    const n = Math.min(3, from.workers.length - from.cap, to.cap - to.workers.length);
    const movers = from.workers.filter(w => w.carry === 0).slice(0, n);
    if (movers.length) execCmd({ c: 'harvest', p: p.id, ids: movers.map(w => w.id), tgt: to.crystals[0].id });
  }
  // production de drones : depuis le QG de la base la moins saturée
  const wantW = Math.min(44, builtBases.reduce((s, B) => s + B.cap, 0) + 2);
  if (workers.length < wantW && p.credits >= 50) {
    const cands = hqs.filter(h => h.built && h.queue.length < 2);
    if (cands.length) {
      const sat = h => { const B = builtBases.find(x => x.b === h); return B ? B.workers.length / Math.max(1, B.cap) : 9; };
      cands.sort((a, b) => sat(a) - sat(b));
      execCmd({ c: 'train', p: p.id, b: cands[0].id, t: 'worker' });
    }
  }
  // ---- expansion ----
  aiExpand(p, S, lvl, workers, army, hqs, bases, main);
  if (!main) return;
  // ---- constructions ----
  const underCons = blds.filter(b => !b.built && b.t !== 'hq').length;
  const maxCons = 1 + (p.credits > 900 ? 1 : 0) + (hqs.length > 2 ? 1 : 0);
  if (underCons >= maxCons || workers.length <= 3) return;
  const margin = p.powerProd - p.powerUse - blds.filter(b => !b.built).reduce((s, b) => s + Math.max(0, -BT[b.t].power), 0);
  let want = null, at = main;
  if (margin < 6 && count('power') <= builtCount('power')) want = 'power';
  // plan de la base principale (défenses comptées près du QG principal)
  let mainWant = null;
  for (const [t, n, tm] of AI_PLAN) {
    if (t === 'refinery') continue;
    if (G.time < tm * (p.ai === 'easy' ? 1.6 : 1)) continue;
    const have = (t === 'turret' || t === 'sam') ? nearOf(blds, t, main, 14) : count(t);
    if (have < n && hasReq(p, BT[t].req) && allowedB(p, t)) { mainWant = t; break; }
  }
  // plan des bases secondaires : défenses, énergie, puis production
  let expWant = null, expAt = null;
  const EXP_PLAN = [['turret', 1], ['power', 1], ['sam', 1], ['turret', 2], ['barracks', 1], ['turret', 3], ['factory', 1]];
  for (const h of hqs) {
    if (!h.built || h === main) continue;
    for (const [t, n] of EXP_PLAN) {
      if (!hasReq(p, BT[t].req) || !allowedB(p, t)) continue;
      if ((t === 'barracks' || t === 'factory') && p.ai === 'easy') continue;
      if (nearOf(blds, t, h, 11) < n) { expWant = t; expAt = h; break; }
    }
    if (expWant) break;
  }
  if (!want) {
    S.flip = !S.flip;
    if (mainWant && (!expWant || S.flip)) want = mainWant;
    else if (expWant) { want = expWant; at = expAt; }
  }
  // raffinerie de secours quand l'expansion est impossible et que les gisements s'épuisent
  if (!want && hqs.length >= S.maxBases && count('refinery') < 2 && bases.every(B => B.crystals.length < 3)) want = 'refinery';
  if (want && p.credits >= BT[want].cost + (S.saving && want !== 'power' ? 400 : 0)) {
    const spot = aiFindSpot(p, want, at);
    if (spot) {
      const builder = workers.filter(w => w.st !== 'build').sort((a, b) => (a.carry - b.carry) || (dist2(a.x, a.y, spot.x * TILE, spot.y * TILE) - dist2(b.x, b.y, spot.x * TILE, spot.y * TILE)))[0];
      if (builder) execCmd({ c: 'place', p: p.id, t: want, tx: spot.x, ty: spot.y, ids: [builder.id] });
    }
  }
  // recherche
  const lab = blds.find(b => b.t === 'lab' && b.built);
  if (lab && !lab.queue.length && p.credits > 700) {
    const up = UPCODES.find(u => !p.ups[u]);
    if (up) execCmd({ c: 'research', p: p.id, b: lab.id, t: up });
  }
}

function aiExpand(p, S, lvl, workers, army, hqs, bases, main) {
  if (!allowedB(p, 'hq')) return;
  const E = S.exp;
  if (E) {
    const b = E.hqId ? G.byId.get(E.hqId) : null;
    if (b && !b.dead && b.built) { S.exp = null; S.saving = false; S.nextExpand = G.time + lvl.expandEvery * (.85 + G.rng() * .3); return; }
    if (E.hqId && (!b || b.dead)) { S.exp = null; S.saving = false; S.nextExpand = G.time + 60; return; }
    if (!E.hqId) {
      // pas encore posé : chercher le QG en construction à cet endroit, sinon reposer
      const placed = G.ents.find(e => e.k === 'b' && e.o === p.id && e.t === 'hq' && !e.built && !e.dead && e.tx === E.tx && e.ty === E.ty);
      if (placed) { E.hqId = placed.id; return; }
      if (G.time - E.since > 70) { S.exp = null; S.saving = false; S.nextExpand = G.time + 40; return; }
      if (p.credits >= BT.hq.cost && canPlace('hq', E.tx, E.ty, p.id, true)) {
        const builder = G.byId.get(E.builder);
        const w = builder && !builder.dead ? builder : workers.filter(x => x.st !== 'build').sort((a, c) => dist2(a.x, a.y, E.tx * TILE, E.ty * TILE) - dist2(c.x, c.y, E.tx * TILE, E.ty * TILE))[0];
        if (w) { E.builder = w.id; execCmd({ c: 'place', p: p.id, t: 'hq', tx: E.tx, ty: E.ty, ids: [w.id] }); }
      } else if (!canPlace('hq', E.tx, E.ty, p.id, true)) { S.exp = null; S.saving = false; S.nextExpand = G.time + 20; }
    }
    return;
  }
  if (S.nextExpand === undefined) S.nextExpand = lvl.expandAt * (.9 + G.rng() * .2);
  const noHq = hqs.length === 0;
  const mainLow = bases.length && bases.filter(B => B.b.built).every(B => B.crystals.length <= 3);
  const rich = p.credits > 1400 && G.time > 120;
  const due = noHq || (hqs.length < S.maxBases && (G.time >= S.nextExpand || rich || (mainLow && G.time > 120)));
  if (!due || workers.length < (noHq ? 1 : 6)) return;
  const site = aiPickExpansion(p, hqs, main);
  if (!site) { S.nextExpand = G.time + 45; return; }
  S.saving = true;
  S.exp = { tx: site.tx, ty: site.ty, since: G.time, hqId: 0, builder: 0 };
  // escorte : un tiers de l'armée au repos part sécuriser le site
  const idle = army.filter(u => u.st === 'idle');
  const esc = idle.slice(0, Math.ceil(idle.length / 3));
  if (esc.length) execCmd({ c: 'amove', p: p.id, ids: esc.map(u => u.id), x: (site.tx + 1.5) * TILE, y: (site.ty + 1.5) * TILE });
}

function aiPickExpansion(p, hqs, main) {
  const from = main || hqs[0] || G.ents.find(e => e.o === p.id && !e.dead);
  if (!from) return null;
  const team = p.team;
  const enemyB = G.ents.filter(e => e.k === 'b' && !e.dead && isEnemy(p.id, e.o));
  let best = null, bs = 1e18;
  for (const f of G.map.fields) {
    const fx = (f.x + .5) * TILE, fy = (f.y + .5) * TILE;
    const crystals = G.ents.filter(r => r.k === 'r' && !r.dead && r.amount > 300 && dist2(r.x, r.y, fx, fy) < sq(7 * TILE));
    if (crystals.length < 4) continue;
    if (G.ents.some(e => e.k === 'b' && !e.dead && (e.t === 'hq' || e.t === 'refinery') && dist2(e.x, e.y, fx, fy) < sq(10 * TILE))) continue;
    let nearEnemy = 1e9;
    for (const e of enemyB) nearEnemy = Math.min(nearEnemy, FM.sqrt(dist2(e.x, e.y, fx, fy)));
    if (nearEnemy < 15 * TILE) continue;
    // menace visible sur le site
    let threat = 0;
    query(fx, fy, 10 * TILE, e => { if (e.k === 'u' && !e.dead && isEnemy(p.id, e.o) && visibleTo(e, team)) threat++; });
    if (threat > 2) continue;
    const spot = f.start !== undefined ? { tx: G.map.starts[f.start].x - 1, ty: G.map.starts[f.start].y - 1 } : aiHqSpot(p, f, crystals, from);
    if (!spot || !canPlace('hq', spot.tx, spot.ty, p.id, true)) continue;
    const d = FM.sqrt(dist2((spot.tx + 1.5) * TILE, (spot.ty + 1.5) * TILE, from.x, from.y));
    const s = d + Math.max(0, 34 * TILE - nearEnemy) * 1.3 - crystals.length * 40;
    if (s < bs) { bs = s; best = spot; }
  }
  return best;
}
function aiHqSpot(p, f, crystals, from) {
  let best = null, bs = 1e18;
  for (let r = 3; r <= 7; r++) for (let k = 0; k < 24; k++) {
    const a = k / 24 * Math.PI * 2;
    const cx = Math.round(f.x + FM.cos(a) * r), cy = Math.round(f.y + FM.sin(a) * r);
    const tx = cx - 1, ty = cy - 1;
    if (!canPlace('hq', tx, ty, p.id, true)) continue;
    let ok = true;
    for (let y = ty - 1; y <= ty + 3 && ok; y++) for (let x = tx - 1; x <= tx + 3; x++) {
      if (x < 0 || y < 0 || x >= G.W || y >= G.H || G.bgrid[y * G.W + x] || G.rgrid[y * G.W + x]) { ok = false; break; }
    }
    if (!ok) continue;
    const hx = (tx + 1.5) * TILE, hy = (ty + 1.5) * TILE;
    let md = 1e9, sum = 0;
    for (const c of crystals) { const d = FM.sqrt(dist2(c.x, c.y, hx, hy)); md = Math.min(md, d); sum += d; }
    const s = Math.abs(md - 3.2 * TILE) * 3 + sum / crystals.length + FM.sqrt(dist2(hx, hy, from.x, from.y)) * .05;
    if (s < bs) { bs = s; best = { tx, ty }; }
  }
  return best;
}

function aiRally(p, center) {
  const tx = G.W * TILE / 2, ty = G.H * TILE / 2;
  const a = FM.atan2(ty - center.y, tx - center.x);
  const x = center.x + FM.cos(a) * 7 * TILE, y = center.y + FM.sin(a) * 7 * TILE;
  const i = nearestFree(tileOf(x), tileOf(y), tileOf(center.x), tileOf(center.y), 6);
  return i >= 0 ? { x: (i % G.W + .5) * TILE, y: (((i / G.W) | 0) + .5) * TILE } : center;
}

function aiPickTarget(p, from) {
  let best = null, bd = 1e18;
  for (const e of G.ents) {
    if (e.dead || e.k === 'r' || !isEnemy(p.id, e.o)) continue;
    if (G.players[e.o].defeated) continue;
    let d = dist2(e.x, e.y, from.x, from.y);
    if (e.k === 'u') d *= 4; // préférer les bâtiments
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function aiFindSpot(p, t, hq) {
  const d = BT[t];
  let cx, cy, rmin = 3, rmax = 15;
  const crystals = G.ents.filter(r => r.k === 'r' && !r.dead);
  if (t === 'refinery') {
    // gisement le plus proche du QG encore riche, hors base
    let best = null, bd = 1e18;
    for (const r of crystals) {
      const d2 = dist2(r.x, r.y, hq.x, hq.y);
      if (d2 < sq(11 * TILE)) continue;
      const near = crystals.filter(o => dist2(o.x, o.y, r.x, r.y) < sq(4 * TILE)).length;
      if (near < 3) continue;
      if (d2 < bd) { bd = d2; best = r; }
    }
    if (!best) return null;
    cx = tileOf(best.x); cy = tileOf(best.y); rmin = 2; rmax = 6;
  } else {
    cx = hq.tx + 1; cy = hq.ty + 1;
    if (t === 'turret' || t === 'sam') {
      const a = FM.atan2(G.H / 2 - cy, G.W / 2 - cx) + (G.rng() - .5) * 1.6;
      cx = Math.round(cx + FM.cos(a) * 7); cy = Math.round(cy + FM.sin(a) * 7); rmin = 0; rmax = 4;
    }
  }
  const field = crystals.filter(r => dist2(r.x, r.y, hq.x, hq.y) < sq(10 * TILE));
  const cands = [];
  for (let r = rmin; r <= rmax; r++) for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) {
    if (Math.max(Math.abs(x - cx), Math.abs(y - cy)) !== r) continue;
    cands.push({ x: x - (d.w >> 1), y: y - (d.h >> 1), r });
  }
  for (let k = cands.length - 1; k > 0; k--) { const j = (G.rng() * (k + 1)) | 0; if (cands[j].r === cands[k].r) { const tmp = cands[k]; cands[k] = cands[j]; cands[j] = tmp; } }
  for (const c of cands) {
    if (!canPlace(t, c.x, c.y, p.id, true)) continue;
    // marge d'une case libre de bâtiments autour
    let ok = true;
    for (let y = c.y - 1; y <= c.y + d.h && ok; y++) for (let x = c.x - 1; x <= c.x + d.w; x++) {
      if (x < 0 || y < 0 || x >= G.W || y >= G.H) { ok = false; break; }
      if (G.bgrid[y * G.W + x]) { ok = false; break; }
    }
    if (!ok) continue;
    const bx = (c.x + d.w / 2) * TILE, by = (c.y + d.h / 2) * TILE;
    if (t !== 'refinery') {
      // ne pas bloquer la zone de récolte (entre le QG et les cristaux)
      let bad = false;
      for (const r of field) {
        if (dist2(bx, by, r.x, r.y) < sq(3.2 * TILE)) { bad = true; break; }
        const sx = r.x - hq.x, sy = r.y - hq.y, l2 = sx * sx + sy * sy;
        const tt = clamp(((bx - hq.x) * sx + (by - hq.y) * sy) / l2, 0, 1);
        if (dist2(bx, by, hq.x + sx * tt, hq.y + sy * tt) < sq(2.6 * TILE)) { bad = true; break; }
      }
      if (bad) continue;
    }
    return c;
  }
  return null;
}


// ============================================================
//  Parties en ligne (2 à 4 camps) : window.JEL_SIM (moteur temps réel jel-tr,
//  docs/cadrage-temps-reel.md, sections 5 et 16). Un tick du moteur (100 ms) =
//  deux pas de simulation (TICK = 50 ms). Les robots du moteur (niveaux 1 à 3)
//  sont l'IA du jeu (facile, normal, difficile), qui joue dans le pas de
//  simulation. Modes : TR_MODES (camp 0 = premier joueur arrivé) ; cartes : les
//  thèmes de THEMES, ou au hasard d'après la graine.
// ============================================================
const TR_LIMITE = 900;                                  // 15 minutes de jeu au plus, puis le plus gros score gagne
// Modes en ligne : équipe de chaque camp, camps toujours tenus par un robot, coin de départ de chaque
// camp (0 haut gauche, 1 bas droite, 2 haut droite, 3 bas gauche), taille de la carte (64 cases à
// deux : parties nerveuses, légères pour le serveur ; 80 à trois ou quatre).
const TR_MODES = {
  '1v1': { equipes: [0, 1], departs: [0, 1], taille: 64 },
  ffa3: { equipes: [0, 1, 2], departs: [0, 1, 2], taille: 80 },
  ffa4: { equipes: [0, 1, 2, 3], departs: [0, 1, 2, 3], taille: 80 },
  '2v2': { equipes: [0, 1, 0, 1], departs: [0, 2, 3, 1], taille: 80 },
  equipe2: { equipes: [0, 0, 1, 1], robots: [2, 3], departs: [0, 3, 2, 1], taille: 80 },
  equipe1: { equipes: [0, 0, 1], robots: [2], departs: [0, 3, 2], taille: 64 },
};
const TR_CARTES = Object.keys(THEMES);
const TR_ROBOTS = [null, 'easy', 'normal', 'hard'];     // contrôle du moteur → niveau de l'IA
const TR_ORDRES = ['', 'move', 'amove', 'attack', 'harvest', 'return', 'buildhelp', 'stop', 'hold', 'train', 'research', 'cancel', 'rally', 'place', 'cancelbld', 'surrender'];
const TR_IDS_MAX = window.JEL_TR.ORDRE_MAX - 6;         // unités ou bâtiments d'un ordre, au plus
// Champs de G propres à un appareil (affichage) : jamais dans un instantané ni dans une empreinte.
const TR_LOCAL = new Set(['me', 'demo', 'stats', 'revealAll', 'spectate', 'restarting', 'demoCam', 'affiche', 'fxq', 'msgq', 'rng']);
// Champs objets de G, rangés à part dans l'instantané (les autres objets n'y sont pas : test d'export).
const TR_OBJETS = new Set(['cfg', 'map', 'pass', 'bgrid', 'rgrid', 'vis', 'exp', 'cells', 'pathQ', 'ents', 'byId', 'projs', 'players', 'ctl', 'mission']);
// Armes des projectiles : un projectile garde sa référence d'arme, l'instantané garde sa clé.
const TR_ARMES = new Map();
for (const t of UTYPES) if (UT[t].weapon) TR_ARMES.set(UT[t].weapon, 'u:' + t);
for (const t of BTYPES) if (BT[t].weapon) TR_ARMES.set(BT[t].weapon, 'b:' + t);
function armeDe(cle) {
  const i = String(cle).indexOf(':'), k = String(cle).slice(0, i), t = String(cle).slice(i + 1);
  return k === 'u' ? (UT[t] && UT[t].weapon) || null : (BT[t] && BT[t].weapon) || null;
}

// Configuration d'une partie en ligne (config du moteur : mode, carte).
function trConfig(graine, config) {
  config = config || {};
  const id = Object.prototype.hasOwnProperty.call(TR_MODES, config.mode) ? config.mode : '1v1';
  const m = TR_MODES[id], robots = m.robots || [];
  const theme = TR_CARTES.includes(config.carte) ? config.carte : TR_CARTES[graine % TR_CARTES.length];
  // Robot seul contre plus de joueurs : il part avec plus de cristaux.
  const credits = c => (robots.includes(c) && robots.length < m.equipes.length - robots.length ? 1200 : 600);
  const joueur = (team, i) => ({ name: 'J' + (i + 1), team, color: i, start: m.departs[i], credits: credits(i), workers: 5, hq: true, aiMode: 'full', human: true });
  return { seed: graine % 1000000, size: m.taille, theme, players: m.equipes.map(joueur), mode: 'tr', me: 0, reveal: false, mission: null, limite: TR_LIMITE, label: 'tr.mode.' + id, trMode: id };
}

// Score (fin au temps) : valeur de l'armée et des bâtiments debout, plus les cristaux récoltés.
function scoreTR(pid) {
  let s = Math.floor(G.players[pid].gathered);
  for (const e of G.ents) if (!e.dead && e.o === pid) s += e.k === 'u' ? UT[e.t].cost : e.built ? BT[e.t].cost : 0;
  return s;
}
function scoreEquipeTR(team) {
  let s = 0;
  for (const p of G.players) if (p.team === team) s += scoreTR(p.id);
  return s;
}
// Fin d'une partie en ligne (appelée par checkEnd) : une seule équipe a encore des forces, ou le temps
// est écoulé (la meilleure équipe encore en jeu aux points ; égalité : personne).
function finTR() {
  const equipes = [];
  for (const p of G.players) if (!p.defeated && !equipes.includes(p.team)) equipes.push(p.team);
  if (equipes.length <= 1) { G.over = true; G.winTeam = equipes.length ? equipes[0] : -1; G.raisonFin = 'conquete'; return; }
  if (G.time >= G.cfg.limite) {
    let meilleure = -1, score = -1, egalite = false;
    for (const t of equipes) {
      const s = scoreEquipeTR(t);
      if (s > score) { score = s; meilleure = t; egalite = false; } else if (s === score) egalite = true;
    }
    G.over = true; G.winTeam = egalite ? -1 : meilleure; G.raisonFin = 'temps';
  }
}

// --- ordres : objet de l'interface ↔ liste d'entiers du moteur ---------------
function trEncoder(cmd) {
  const code = TR_ORDRES.indexOf(cmd && cmd.c);
  if (code < 1) return null;
  const r = v => Math.round(+v || 0);
  const ids = l => (l || []).slice(0, TR_IDS_MAX).map(r);
  switch (cmd.c) {
    case 'move': case 'amove': return [code, r(cmd.x), r(cmd.y), ...ids(cmd.ids)];
    case 'attack': case 'harvest': case 'buildhelp': return [code, r(cmd.tgt), ...ids(cmd.ids)];
    case 'return': case 'stop': case 'hold': return [code, ...ids(cmd.ids)];
    case 'train': return [code, r(cmd.b), UTYPES.indexOf(cmd.t), r(cmd.n || 1)];
    case 'research': return [code, r(cmd.b), UPCODES.indexOf(cmd.t)];
    case 'cancel': return [code, r(cmd.b), cmd.i === undefined || cmd.i === null ? -1 : r(cmd.i)];
    case 'rally': return [code, r(cmd.x), r(cmd.y), r(cmd.tgt), ...ids(cmd.bs)];
    case 'place': return [code, BTYPES.indexOf(cmd.t), r(cmd.tx), r(cmd.ty), cmd.queueBack ? 1 : 0, ...ids(cmd.ids)];
    case 'cancelbld': return [code, r(cmd.b)];
    case 'surrender': return [code];
  }
  return null;
}
const TR_LONGUEUR_MIN = { move: 3, amove: 3, attack: 2, harvest: 2, buildhelp: 2, return: 1, stop: 1, hold: 1, train: 4, research: 3, cancel: 3, rally: 4, place: 5, cancelbld: 2, surrender: 1 };
function trDecoder(camp, o) {
  const c = TR_ORDRES[o[0]];
  if (!c || o.length < TR_LONGUEUR_MIN[c]) return null;
  const liste = from => o.slice(from, from + TR_IDS_MAX);
  switch (c) {
    case 'move': case 'amove': return { c, p: camp, x: o[1], y: o[2], ids: liste(3) };
    case 'attack': case 'harvest': case 'buildhelp': return { c, p: camp, tgt: o[1], ids: liste(2) };
    case 'return': case 'stop': case 'hold': return { c, p: camp, ids: liste(1) };
    case 'train': return { c, p: camp, b: o[1], t: UTYPES[o[2]], n: clamp(o[3], 1, 6) };
    case 'research': return { c, p: camp, b: o[1], t: UPCODES[o[2]] };
    case 'cancel': return { c, p: camp, b: o[1], i: o[2] >= 0 ? o[2] : undefined };
    case 'rally': return { c, p: camp, x: o[1], y: o[2], tgt: o[3], bs: liste(4) };
    case 'place': return { c, p: camp, t: BTYPES[o[1]], tx: o[2], ty: o[3], queueBack: o[4] === 1, ids: liste(5) };
    case 'cancelbld': return { c, p: camp, b: o[1] };
    case 'surrender': return { c, p: camp };
  }
  return null;
}
function trValide(etat, camp, o) {
  G = etat;
  if (G.over || camp < 0 || camp >= G.players.length) return false;
  const cmd = trDecoder(camp, o);
  if (!cmd) return false;
  // Coordonnées dans la carte (les vérifications d'appartenance, de coût… sont celles d'execCmd).
  if (cmd.x !== undefined && (cmd.x < 0 || cmd.y < 0 || cmd.x > G.W * TILE || cmd.y > G.H * TILE)) return false;
  if (cmd.tx !== undefined && (cmd.tx < 0 || cmd.ty < 0 || cmd.tx >= G.W || cmd.ty >= G.H)) return false;
  return true;
}

// --- pas : robots (contrôle du moteur), puis deux pas de simulation ----------
function trPas(etat) {
  G = etat;
  if (G.over) return;
  for (let c = 0; c < G.players.length; c++) {
    const p = G.players[c], niveau = TR_ROBOTS[etat.ctl[c]] || null;
    if (p.ai !== niveau) { p.ai = niveau; if (niveau && !p.aiState) aiInit(p); }
  }
  for (const e of G.ents) if (e.k === 'u') { e.px = e.x; e.py = e.y; }
  simStep(true);
  if (!G.over) simStep(true);
}
function trFin(etat) {
  if (!etat.over) return null;
  G = etat;
  return { gagnant: etat.winTeam, scores: G.players.map(p => scoreTR(p.id)), equipes: G.players.map(p => p.team), k: etat.k, raison: etat.raisonFin || 'conquete' };
}

// --- instantané : grilles compressées (valeur, longueur), projectiles avec la clé de leur arme ---
function trRle(t) {
  const o = []; let v = t[0], n = 0;
  for (let i = 0; i < t.length; i++) { if (t[i] === v) n++; else { o.push(v, n); v = t[i]; n = 1; } }
  o.push(v, n);
  return o;
}
function trDerle(o, t) {
  let i = 0;
  for (let k = 0; k + 1 < o.length && i < t.length; k += 2) { t.fill(o[k], i, i + o[k + 1]); i += o[k + 1]; }
  return t;
}
function trExporter(etat) {
  const g = etat, d = { v: 1, g: {}, inconnus: [] };
  for (const k of Object.keys(g)) {
    if (TR_LOCAL.has(k)) continue;
    const v = g[k];
    if (v === null || v === undefined || typeof v === 'number' || typeof v === 'boolean' || typeof v === 'string') { if (v !== undefined) d.g[k] = v; }
    else if (!TR_OBJETS.has(k)) d.inconnus.push(k);
  }
  d.cfg = g.cfg;
  d.ctl = g.ctl ? g.ctl.slice() : g.players.map(() => 0);
  d.ents = g.ents.map(e => { const o = Object.assign({}, e); delete o.px; delete o.py; return o; });
  d.projs = g.projs.map(P => Object.assign({}, P, { w: TR_ARMES.get(P.w) || null }));
  // Noms affichés : propres à chaque appareil (le pseudo tapé dans les options ne quitte jamais l'appareil).
  d.players = g.players.map(p => Object.assign({}, p, { name: 'J' + (p.id + 1) }));
  d.pathQ = g.pathQ.map(u => u.id);
  d.grilles = { pass: trRle(g.pass), bgrid: trRle(g.bgrid), rgrid: trRle(g.rgrid), vis: g.vis.map(trRle), exp: g.exp.map(trRle) };
  return JSON.parse(JSON.stringify(d));
}
function trImporter(d) {
  newGame(Object.assign({}, d.cfg, { client: true }));       // carte (même graine) et grilles vides, sans entité
  const g = G;
  Object.assign(g, d.g);
  g.cfg = d.cfg; g.mode = 'tr'; g.ctl = d.ctl.slice();
  g.players = d.players;
  for (const e of d.ents) { e.px = e.x; e.py = e.y; g.ents.push(e); g.byId.set(e.id, e); }
  g.projs = d.projs.map(P => Object.assign(P, { w: armeDe(P.w) }));
  g.pathQ = d.pathQ.map(id => g.byId.get(id)).filter(Boolean);
  const r = d.grilles;
  trDerle(r.pass, g.pass); trDerle(r.bgrid, g.bgrid); trDerle(r.rgrid, g.rgrid);
  r.vis.forEach((o, i) => trDerle(o, g.vis[i])); r.exp.forEach((o, i) => trDerle(o, g.exp[i]));
  g.rng = hasardG;
  rebuildCells();
  return g;
}
// Ce qui est comparé entre deux appareils (tous les 50 ticks) : tout l'état de la partie.
function trEmpreinte(etat) {
  const g = etat;
  return {
    k: g.k, a: g.a, tick: g.tick, time: g.time, n: g.nextId, ctl: g.ctl, over: !!g.over, pf: g.pfExp || 0,

    projs: g.projs.map(P => [P.kind, P.x, P.y, P.tgt, P.tx, P.ty, P.t, P.a]),
    joueurs: g.players.map(p => [p.credits, p.gathered, !!p.defeated, p.pop, p.ai, p.st, p.ups, p.aiState]),
    q: g.pathQ.map(u => u.id),
  };

  camps: 4,

  flottants: true,

  cartes: TR_CARTES,
  depart(graine, config) { newGame(trConfig(graine >>> 0, config)); return G; },
  valide: trValide,
  ordre(etat, camp, o) { G = etat; const cmd = trDecoder(camp, o); if (cmd) execCmd(cmd); },
  pas: trPas,
  bot() { return []; },                 // l'IA du jeu joue dans le pas (trPas), d'après etat.ctl
  fin: trFin,
  exporter: trExporter,
  importer: trImporter,
  empreinte: trEmpreinte,
  encoder: trEncoder,
  score: scoreTR,
  limite: TR_LIMITE,
  // Robot de contrôle (scripts/tester-temps-reel.mjs) : parties plus longues que la moyenne, donc moins
  // nombreuses ; ordres d'un « humain » d'essai (lecture seule de l'état) ; ce qui distingue deux débuts.
  essais: {
    parties: 5,
    equite: 20,
    ordres(etat, camp, alea, paisible) {
      const miennes = etat.ents.filter(e => !e.dead && e.o === camp);
      const unites = miennes.filter(e => e.k === 'u');
      const prod = miennes.filter(e => e.k === 'b' && e.built && BT[e.t].produces);
      const o = [];
      if (unites.length && alea(2) === 0) {
        const ids = unites.filter(() => alea(3) === 0).slice(0, 30).map(u => u.id);
        const s = etat.players[camp].start;
        const x = paisible ? (s.x + alea(9) - 4 + .5) * TILE : (alea(etat.W - 4) + 2) * TILE;
        const y = paisible ? (s.y + alea(9) - 4 + .5) * TILE : (alea(etat.H - 4) + 2) * TILE;
        if (ids.length) o.push([paisible || alea(2) ? 1 : 2, Math.round(x), Math.round(y), ...ids]);

        const b = prod[alea(prod.length)], types = BT[b.t].produces;
        o.push([9, b.id, UTYPES.indexOf(types[alea(types.length)]), 1]);
      }
      return o;
    },

  },
};

function buildSprites() {
