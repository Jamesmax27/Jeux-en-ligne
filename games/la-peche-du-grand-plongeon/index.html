      if (d.aqua && typeof d.aqua === 'object') for (const k of ORDRE_AQUA) if (d.aqua[k]) prog.aqua[k] = entier(d.aqua[k], 0, 1e7, 0);
      if (d.vus && typeof d.vus === 'object') for (const k of Object.keys(d.vus)) if (d.vus[k] === 1) prog.vus[k] = 1;
      prog.profMax = entier(d.profMax, 0, 1000, 0);
      if (d.options && typeof d.options.son === 'boolean') prog.son = d.options.son;
    }
    try { const s = localStorage.getItem(CLE_SON); if (s === '0') prog.son = false; if (s === '1') prog.son = true; } catch (e) { /* stockage refusé */ }
    if (!bateauOuvert(prog.bateau)) prog.bateau = 'barque';
  }
  function totalEtoiles() { return prog.etoiles.reduce((a, b) => a + b, 0); }
  function totalRecords() { return prog.records.reduce((a, b) => a + b, 0); }
  function sauver(niveauReprise) {
    if (APERCU || AFFICHE || !window.JEL_SAVE) return;
    if (niveauReprise) prog.reprise = clamp(niveauReprise, 1, NIVEAUX.length);
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: prog.reprise, score: totalRecords(), etoiles: prog.etoiles.slice(), records: prog.records.slice(),
        atteint: prog.atteint, pieces: prog.pieces, gagne: prog.gagne, amelio: Object.assign({}, prog.amelio), bateau: prog.bateau,
        aqua: Object.assign({}, prog.aqua), vus: Object.assign({}, prog.vus), profMax: prog.profMax, options: { son: prog.son },
      });
    } catch (e) { /* rien */ }
  }
  function niveauOuvert(i) { return i === 0 || i < prog.atteint || prog.etoiles[i - 1] > 0; }
  function valAmelio(k) { return AMELIO[k].val[prog.amelio[k]]; }
  function bateau() { return BATEAUX.find((b) => b.id === prog.bateau) || BATEAUX[0]; }
  function bateauOuvert(id) { const b = BATEAUX.find((x) => x.id === id); return !!b && totalEtoiles() >= b.etoiles; }

  // ------------------------------------------------------------------------
  // Sons Web Audio (aucun fichier ; rien avant le premier geste)
  // ------------------------------------------------------------------------
  const Son = {
    ctx: null, maitre: null,
    init() {
      if (this.ctx || APERCU || AFFICHE) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.maitre = this.ctx.createGain();
        this.maitre.gain.value = 0.7;
        this.maitre.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; }
    },
    pret() {
      if (!this.ctx || !prog.son) return false;
      if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) { /* rien */ } }
      return true;
    },
    bip(f, d, type = 'sine', vol = 0.15, f2 = null, delai = 0) {
      if (!this.pret()) return;
      const t0 = this.ctx.currentTime + delai;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t0);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g); g.connect(this.maitre);
      o.start(t0); o.stop(t0 + d + 0.02);
    },
    bruit(d, vol, freq, delai = 0) {
      if (!this.pret()) return;
      const t0 = this.ctx.currentTime + delai;
      const n = Math.floor(this.ctx.sampleRate * d);
      const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(); s.buffer = buf;
      const fl = this.ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = freq;
      const g = this.ctx.createGain(); g.gain.value = vol;
      s.connect(fl); fl.connect(g); g.connect(this.maitre);
      s.start(t0);
    },
    clic() { this.bip(660, 0.06, 'triangle', 0.12); },
    plouf() { this.bruit(0.4, 0.35, 1100); this.bip(260, 0.3, 'sine', 0.12, 70); },
    choc() { this.bip(320, 0.14, 'triangle', 0.2, 140); },
    accroche(n) { const f = 480 * Math.pow(1.06, Math.min(n, 24)); this.bip(f, 0.09, 'square', 0.05); this.bip(f * 1.5, 0.12, 'sine', 0.12, null, 0.03); },
    plein() { [523, 659, 784, 1046].forEach((f, i) => this.bip(f, 0.14, 'triangle', 0.14, null, i * 0.06)); },
    piece() { this.bip(1250, 0.06, 'square', 0.04); this.bip(1680, 0.09, 'sine', 0.07, null, 0.04); },
    coffre() { [392, 523, 659, 784, 1046].forEach((f, i) => this.bip(f, 0.18, 'triangle', 0.15, null, i * 0.07)); },
    meduse() { this.bip(1100, 0.3, 'sawtooth', 0.08, 120); this.bruit(0.25, 0.15, 3000); },
    coque() { this.bip(220, 0.12, 'square', 0.1, 420); this.bip(880, 0.1, 'sine', 0.1, null, 0.05); },
    glace() { this.bip(1900, 0.18, 'sine', 0.08); this.bip(2500, 0.12, 'sine', 0.05, null, 0.03); },
    crabe() { this.bip(1500, 0.03, 'square', 0.06); this.bip(1300, 0.03, 'square', 0.06, null, 0.07); this.bip(1450, 0.03, 'square', 0.05, null, 0.14); },
    decroche() { this.bip(500, 0.15, 'triangle', 0.12, 900); },
    courant() { this.bruit(0.6, 0.07, 500); },
    geant() { this.bip(75, 0.8, 'sawtooth', 0.12, 55); this.bip(110, 0.7, 'sine', 0.12, 80, 0.05); },
    repousse() { this.bip(140, 0.25, 'sawtooth', 0.1, 90); },
    achat() { [660, 880, 1320].forEach((f, i) => this.bip(f, 0.12, 'triangle', 0.14, null, i * 0.07)); },
    etoile(i) { this.bip(700 + i * 220, 0.25, 'triangle', 0.16); },
    victoire() { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => this.bip(f, 0.2, 'triangle', 0.15, null, i * 0.11)); },
    defaite() { [392, 349, 311, 262].forEach((f, i) => this.bip(f, 0.26, 'sine', 0.14, null, i * 0.16)); },
    record() { [784, 988, 1175].forEach((f, i) => this.bip(f, 0.14, 'sine', 0.12, null, i * 0.08)); },
  };

  // ------------------------------------------------------------------------
  // État de la partie
  // ------------------------------------------------------------------------
  const etat = {
    mode: 'menu', niv: 0, phase: 'surface', pause: false, fige: false, enPartie: false,
    plongee: 0, nbPlongees: 3, gains: 0, compte: { poissons: 0, coffres: 0, esp: {} },
    ents: [], bancs: [], courants: [], epaves: [], h: null, parts: [], textes: [], volants: [], piecesFx: [],
    camY: -10, secousse: 0, banniere: null, nouvelles: [], affPieces: 0, temps: 0, deco: [], invite: 0, envolT: 0,
    merMenu: 0, recordProf: false,
  };
  const clavier = { g: false, d: false };

  function vis() { return H / S; }
  function monde() { return W / S; }
  function def() { return NIVEAUX[etat.niv]; }
  function mer() { return MERS[etat.mode === 'jeu' ? def().mer : etat.merMenu]; }

  // ------------------------------------------------------------------------
  // Mise en place d'une plongée
  // ------------------------------------------------------------------------
  function creerPoisson(e, x, y) {
    const es = ESP[e];
    return { type: 'poisson', e, x, y, y0: y, dir: Math.random() < 0.5 ? -1 : 1, vit: es.vit * rnd(0.8, 1.2), r: es.r, ph: rnd(0, TAU), gonfle: 0, esquive: 0, repousse: 0 };
  }
  function genererPlongee() {
    const d = def();
    const L = monde();
    const k = clamp(L / 16, 0.9, 3);
    const ents = [], bancs = [], courants = [], epaves = [];
    // Densité : au moins 4 créatures pour 10 m de profondeur (pour 16 m de large)
    let equiv = 0;
    for (const p of d.pop) if (!ESP[p.e].geant) equiv += p.banc ? p.n * p.banc : p.n;
    for (const z of [d.crabes, d.meduses, d.glaces]) if (z) equiv += z.n;
    const dens = clamp((d.fond / 10) * 4 / Math.max(1, equiv), 1, 2);
    const combien = (n) => Math.max(1, Math.round(n * k * dens));
    for (const p of d.pop) {
      if (p.banc) {
        for (let b = 0; b < combien(p.n); b++) {
          const banc = { x: rnd(3, L - 3), y: rnd(p.de + 2, p.a - 2), dir: Math.random() < 0.5 ? -1 : 1, vit: ESP[p.e].vit * 0.9, tourne: !!p.tourne, minuteur: rnd(2.5, 4.5), frisson: 0 };
          bancs.push(banc);
          for (let i = 0; i < p.banc; i++) {
            const f = creerPoisson(p.e, banc.x, banc.y);
            f.banc = banc; f.ox = rnd(-2.6, 2.6); f.oy = rnd(-1.6, 1.6);
            ents.push(f);
          }
        }
      } else {
        const n = ESP[p.e].geant ? p.n : combien(p.n);
        for (let i = 0; i < n; i++) ents.push(creerPoisson(p.e, rnd(1.5, L - 1.5), rnd(p.de, p.a)));
      }
    }
    if (d.crabes) for (let i = 0; i < combien(d.crabes.n); i++) ents.push(creerPoisson('crabe', rnd(1, L - 1), rnd(d.crabes.de, d.crabes.a)));
    if (d.meduses) for (let i = 0; i < combien(d.meduses.n); i++) { const y = rnd(d.meduses.de, d.meduses.a); ents.push({ type: 'meduse', x: rnd(1, L - 1), y, y0: y, r: 0.8, ph: rnd(0, TAU), dir: Math.random() < 0.5 ? -1 : 1 }); }
    if (d.glaces) for (let i = 0; i < combien(d.glaces.n); i++) {
      const r = rnd(1.1, 2.0), y = rnd(d.glaces.de, d.glaces.a), pts = [];
      for (let j = 0; j < 7; j++) pts.push(rnd(0.78, 1.08));
      ents.push({ type: 'glace', x: rnd(1, L - 1), y, y0: y, r, pts, rot: rnd(0, TAU), ph: rnd(0, TAU), dir: Math.random() < 0.5 ? -1 : 1 });
    }
    if (d.epaves) for (let i = 0; i < d.epaves.n; i++) {
      const y = d.epaves.de + (d.epaves.a - d.epaves.de) * ((i + rnd(0.15, 0.85)) / d.epaves.n);
      const x = rnd(3, L - 3);
      epaves.push({ x, y, inc: rnd(-0.3, 0.3), flip: Math.random() < 0.5 ? -1 : 1 });
      ents.push({ type: 'coffre', x: x + rnd(-0.8, 0.8), y: y + 0.6, r: 0.85, ph: 0 });
    }
    if (d.courants) for (let i = 0; i < d.courants.n; i++) {
      const y0 = d.courants.de + (d.courants.a - d.courants.de) * ((i + rnd(0.2, 0.8)) / d.courants.n);
      courants.push({ y0, y1: y0 + rnd(6, 9), f: d.courants.f * (Math.random() < 0.5 ? -1 : 1), bulles: Array.from({ length: Math.round(18 * k) }, () => ({ x: rnd(0, L), y: rnd(0, 1), l: rnd(0.6, 1.8) })) });
    }
    etat.ents = ents; etat.bancs = bancs; etat.courants = courants; etat.epaves = epaves;
    const b = bateau();
    etat.h = {
      x: L / 2 + 1.7, y: -1.4, cible: L / 2 + 1.7, r: 0.55, prises: [], charge: 0, plein: false,
      coque: valAmelio('coque'), crabes: 0, signe: 0, changements: [], lampe: 4.5 + b.lampe, prof: 0,
    };
  }
  function lmax() { return Math.min(valAmelio('ligne'), def().fond - 0.8); }

  // ------------------------------------------------------------------------
  // Démarrage d'un niveau
  // ------------------------------------------------------------------------
  function preparerNiveau(i) {
    etat.niv = i; etat.mode = 'jeu'; etat.enPartie = true; etat.pause = false; etat.fige = false;
    etat.plongee = 0; etat.nbPlongees = 3 + bateau().plongees; etat.gains = 0;
    etat.compte = { poissons: 0, coffres: 0, esp: {} };
    etat.parts = []; etat.textes = []; etat.volants = []; etat.piecesFx = []; etat.nouvelles = []; etat.banniere = null; etat.recordProf = false;
    etat.affPieces = prog.pieces;
    genererPlongee();
    etat.phase = 'surface';
    etat.camY = -vis() * 0.42;
    construireHud();
  }
  function lancerNiveau(i) {
    if (!niveauOuvert(i)) i = Math.max(0, prog.atteint - 1);
    cacherTout();
    preparerNiveau(i);
    $('hud').hidden = false;
    etat.pause = true; // la mer attend derrière la fiche
    montrerFiche();
  }
  function montrerFiche() {
    const d = def();
    $('fiche-titre').textContent = tr('fiche.titre', { n: etat.niv + 1 });
    $('fiche-mer').textContent = tr('mer.' + MERS[d.mer].id);
    const box = $('fiche-objectifs'); box.textContent = '';
    for (const [k, n] of d.obj) {
      const el = document.createElement('div'); el.className = 'objectif';
      el.appendChild(iconeCanvas(k, 44));
      const s = document.createElement('span'); s.textContent = tr('obj.' + (k === 'poissons' || k === 'coffres' ? k : 'espece'), { n, nom: k in ESP ? tr('esp.' + k) : '' });
      el.appendChild(s); box.appendChild(el);
    }
    $('fiche-plongees').textContent = tr('fiche.plongees', { n: etat.nbPlongees });
    const besoin = profondeurBesoin();
    $('fiche-profondeur').textContent = tr('fiche.profondeur', { ligne: valAmelio('ligne'), fond: d.fond });
    const conseil = $('fiche-conseil');
    if (besoin > valAmelio('ligne')) { conseil.hidden = false; conseil.textContent = tr('fiche.conseil', { n: besoin }); }
    else conseil.hidden = true;
    $('fen-fiche').hidden = false;
    $('btn-plonger').focus({ preventScroll: true });
  }
  // Profondeur minimale où vit l'espèce demandée
  function profondeurBesoin() {
    const d = def();
    let besoin = 0;
    for (const [k] of d.obj) {
      if (k === 'coffres' && d.epaves) besoin = Math.max(besoin, Math.round(d.epaves.de + 4));
      for (const p of d.pop) if (p.e === k) besoin = Math.max(besoin, Math.round(p.de + 3));
    }
    return besoin;
  }
  function commencerNiveau() {
    $('fen-fiche').hidden = true;
    const n = def().nouv;
    if (n && !prog.vus[n]) { montrerNouveau(n); return; }
    etat.pause = false;
    Son.clic();
  }

  // ------------------------------------------------------------------------
  // Barre du haut
  // ------------------------------------------------------------------------
  function construireHud() {
    const box = $('hud-obj'); box.textContent = '';
    def().obj.forEach(([k, n], i) => {
      const el = document.createElement('div'); el.className = 'puce'; el.id = 'puce-' + i;
      el.appendChild(iconeCanvas(k, 30));
      const s = document.createElement('span'); s.className = 'val'; el.appendChild(s);
      box.appendChild(el);
    });
    majHud();
  }
  function avancement(k) {
    if (k === 'poissons') return etat.compte.poissons;
    if (k === 'coffres') return etat.compte.coffres;
    return etat.compte.esp[k] || 0;
  }
  function objectifsOk() { return def().obj.every(([k, n]) => avancement(k) >= n); }
  function majHud() {
    def().obj.forEach(([k, n], i) => {
      const el = $('puce-' + i); if (!el) return;
      const a = Math.min(n, avancement(k));
      el.querySelector('.val').textContent = tr('hud.compte', { a, n });
      el.classList.toggle('fait', a >= n);
      el.title = k in ESP ? tr('esp.' + k) : tr('hud.' + k);
    });
    const pl = $('hud-plongees'); pl.textContent = '';
    for (let i = 0; i < etat.nbPlongees; i++) {
      const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      s.setAttribute('viewBox', '0 0 18 24');
      s.innerHTML = '<path d="M9 1v14a4 4 0 1 1-8 0" stroke="#23324a" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="9" cy="2" r="1.8" fill="#23324a"/>';
      if (i < etat.plongee) s.classList.add('usee');
      pl.appendChild(s);
    }
    pl.setAttribute('aria-label', tr('hud.plongeesReste', { n: etat.nbPlongees - etat.plongee }));
  }

  // ------------------------------------------------------------------------
  // Plongée : lâcher la ligne, descente, remontée, surface
  // ------------------------------------------------------------------------
  function lacherLigne() {
    if (etat.mode !== 'jeu' || etat.phase !== 'surface' || etat.pause || etat.fige || fenetreOuverte()) return;
    const h = etat.h;
    etat.phase = 'descente';
    h.y = 0.1; h.prof = 0;
    eclaboussure(h.x, 0, 14);
    Son.plouf();
  }
  function remonter(raison) {
    const h = etat.h;
    if (etat.phase !== 'descente') return;
    etat.phase = 'remontee';
    h.prof = h.y;
    if (raison === 'fond') { Son.choc(); for (let i = 0; i < 10; i++) etat.parts.push({ x: h.x + rnd(-0.6, 0.6), y: h.y, vx: rnd(-2, 2), vy: rnd(-2, -0.5), vie: 1, c: mer().sol, r: rnd(0.08, 0.18) }); }
    if (raison === 'ligne') { Son.choc(); banniere(tr('msg.boutLigne'), '#fff'); }
    // Record de profondeur
    const p = Math.round(h.y);
    if (p > prog.profMax) { prog.profMax = p; etat.recordProf = true; }
  }
  function capturer(e) {
    const h = etat.h;
    const i = etat.ents.indexOf(e); if (i >= 0) etat.ents.splice(i, 1);
    if (e.type === 'coffre') {
      const v = MERS[def().mer].coffre;
      h.prises.push({ e: 'coffre', v, coffre: true });
      Son.coffre();
      etincelles(e.x, e.y, '#ffd23f', 18);
      texte(e.x, e.y - 1, tr('flottant.coffre'), '#ffe066');
      return;
    }
    const es = ESP[e.e];
    h.prises.push({ e: e.e, v: es.v });
    if (es.geant) {
      h.charge = valAmelio('hamecon');
      Son.geant();
      banniere(tr('msg.geantPris', { nom: tr('esp.' + e.e) }), '#9dffb0');
      etat.secousse = 0.6;
      etincelles(e.x, e.y, '#9dffb0', 30);
    } else {
      h.charge++;
      Son.accroche(h.charge);
      etincelles(e.x, e.y, '#ffffff', 8);
    }
    if (e.banc) e.banc = null;
    if (h.charge >= valAmelio('hamecon') && !h.plein) {
      h.plein = true;
      if (!es.geant) { Son.plein(); banniere(tr('msg.plein'), '#ffe066'); }
    }
  }
  function couperLigne() {
    const h = etat.h;
    Son.meduse();
    etat.secousse = 0.5;
    const perdus = etat.phase === 'remontee' ? Math.ceil(h.prises.filter((p) => !p.coffre).length / 2) : 0;
    for (let i = 0; i < perdus; i++) {
      const idx = h.prises.findIndex((p) => !p.coffre && !ESP[p.e].geant);
      if (idx < 0) break;
      const p = h.prises.splice(idx, 1)[0];
      const f = creerPoisson(p.e, h.x, h.y + 0.5 + i * 0.3); f.vit = Math.max(4, f.vit * 2.5); f.fuite = 2; f.fuyard = true; etat.ents.push(f);
    }
    h.charge = h.prises.filter((p) => !p.coffre).length;
    banniere(perdus ? tr('msg.coupeePerte', { n: perdus }) : tr('msg.coupee'), '#ffb3c8');
    etat.phase = 'coupe';
    etincelles(h.x, h.y, '#ff9ad0', 16);
  }
  function arriverSurface() {
    const h = etat.h;
    etat.phase = 'envol';
    h.y = -1.4;
    eclaboussure(h.x, 0, 18);
    Son.plouf();
    // Compte de la prise remontée
    const bonus = 1 + bateau().bonus;
    let total = 0;
    h.prises.forEach((p, i) => {
      const v = Math.round(p.v * bonus);
      total += v;
      if (p.coffre) etat.compte.coffres++;
      else {
        if (!ESP[p.e].crabe) etat.compte.poissons++;
        etat.compte.esp[p.e] = (etat.compte.esp[p.e] || 0) + 1;
        if (!prog.aqua[p.e] && !etat.nouvelles.includes(p.e)) etat.nouvelles.push(p.e);
        prog.aqua[p.e] = (prog.aqua[p.e] || 0) + 1;
      }
      etat.volants.push({ e: p.e, x: h.x + rnd(-0.4, 0.4), y: -0.5, vx: rnd(-4, 4), vy: rnd(-15, -10), rot: rnd(0, TAU), vr: rnd(-6, 6), t: -i * 0.06, pop: rnd(0.65, 0.95), v, fait: false });
    });
    etat.gains += total;
    prog.pieces += total; prog.gagne += total;
    etat.envolT = 1.4 + Math.min(1.6, h.prises.length * 0.06);
    if (!h.prises.length) { etat.envolT = 0.9; texte(h.x, -2.5, tr('flottant.rien'), '#ffffff'); }
    if (etat.recordProf) { Son.record(); banniere(tr('msg.recordProf', { n: prog.profMax }), '#9de7ff'); etat.recordProf = false; }
    etat.plongee++;
    h.prises = []; h.charge = 0; h.plein = false; h.crabes = 0;
    majHud();
  }
  function finPlongee() {
    if (objectifsOk()) { victoire(); return; }
    if (etat.plongee >= etat.nbPlongees) { defaite(); return; }
    etat.phase = 'surface';
    etat.invite = 0;
    genererPlongee();
  }

  // ------------------------------------------------------------------------
  // Mise à jour du monde
  // ------------------------------------------------------------------------
  function majJeu(dt) {
    etat.temps += dt;
    const h = etat.h;
    const L = monde();
    majBancs(dt, L);
    majEntites(dt, L);
    if (etat.phase === 'surface') { etat.invite += dt; h.y = -1.4 + Math.sin(etat.temps * 2) * 0.08; h.x += (L / 2 + 1.7 - h.x) * Math.min(1, dt * 4); }
    else if (etat.phase === 'descente' || etat.phase === 'remontee') majHamecon(dt, L);
    else if (etat.phase === 'coupe') { h.y -= 45 * dt; if (h.y <= 0) arriverSurface(); }
    else if (etat.phase === 'envol') {
      etat.envolT -= dt;
      if (etat.envolT <= 0 && !etat.piecesFx.length) finPlongee();
    }
    majEffets(dt);
    majCamera(dt);
  }
  function majBancs(dt, L) {
    for (const b of etat.bancs) {
      b.x += b.dir * b.vit * dt;
      if (b.x < 3) b.dir = 1; else if (b.x > L - 3) b.dir = -1;
      if (b.tourne) {
        b.minuteur -= dt;
        b.frisson = b.minuteur < 0.5 ? 1 : 0;
        if (b.minuteur <= 0) { b.dir *= -1; b.minuteur = rnd(2.5, 4.5); }
      }
    }
  }
  function majEntites(dt, L) {
    const hy = etat.h ? etat.h.y : 0;
    for (const e of etat.ents) {
      if (Math.abs(e.y - hy) > 70 && !e.fuite) continue;
      e.ph += dt * 2;
      if (e.type === 'poisson') {
        const es = ESP[e.e];
        if (e.esquive > 0) e.esquive -= dt;
        if (e.repousse > 0) e.repousse -= dt;
        if (e.fuyard) { e.fuite -= dt; e.x += e.dir * e.vit * dt; e.y += 1.2 * dt; continue; }
        if (e.banc) {
          const b = e.banc;
          const tx = b.x + e.ox * -b.dir, ty = b.y + e.oy + Math.sin(e.ph * 1.5) * 0.15;
          e.x += (tx - e.x) * Math.min(1, dt * 3); e.y += (ty - e.y) * Math.min(1, dt * 3);
          e.dir = b.dir;
          if (b.frisson) e.y += Math.sin(etat.temps * 40 + e.ox) * 0.02;
        } else {
          const v = e.vit * (e.esquive > 0 ? 2.5 : 1);
          e.x += e.dir * v * dt;
          if (es.traverse) {
            if (e.x > L + 4) e.x = -4; else if (e.x < -4) e.x = L + 4;
          } else {
            if (e.x < e.r + 0.3) e.dir = 1; else if (e.x > L - e.r - 0.3) e.dir = -1;
            if (Math.random() < dt * 0.08) e.dir *= -1;
          }
          const amp = e.e === 'manta' ? 1.0 : e.e === 'hippocampe' ? 0.45 : es.geant ? 0.6 : 0.25;
          e.y = e.y0 + Math.sin(e.ph) * amp;
        }
        if (e.e === 'ballon' && etat.h) {
          const d = Math.hypot(e.x - etat.h.x, e.y - etat.h.y);
          e.gonfle = clamp(e.gonfle + (d < 4.2 ? 3 : -1) * dt, 0, 1);
        }
      } else if (e.type === 'meduse') {
        e.y = e.y0 + Math.sin(e.ph * 0.7) * 0.7;
        e.x += e.dir * 0.25 * dt;
        if (e.x < 1 || e.x > L - 1) e.dir *= -1;
      } else if (e.type === 'glace') {
        e.y = e.y0 + Math.sin(e.ph * 0.5) * 0.3;
        e.x += e.dir * 0.2 * dt; e.rot += dt * 0.05 * e.dir;
        if (e.x < 1 || e.x > L - 1) e.dir *= -1;
      }
    }
    etat.ents = etat.ents.filter((e) => !(e.fuyard && e.fuite <= 0));
  }
  function rayon(e) { return e.type === 'poisson' && e.e === 'ballon' ? e.r * (1 + 0.85 * e.gonfle) : e.r; }

  function majHamecon(dt, L) {
    const h = etat.h;
    const m = MERS[def().mer];
    const agil = 9 * valAmelio('moteur') / (1 + 0.6 * h.crabes);
    if (clavier.g) h.cible = h.x - 3; else if (clavier.d) h.cible = h.x + 3;
    let vx = clamp((h.cible - h.x) * 7, -agil, agil);
    // Secouer pour décrocher un crabe
    if (h.crabes > 0 && Math.abs(vx) > agil * 0.45) {
      const s = Math.sign(vx);
      if (s !== h.signe) {
        if (h.signe !== 0) h.changements.push(etat.temps);
        h.signe = s;
        h.changements = h.changements.filter((t) => etat.temps - t < 1.8);
        if (h.changements.length >= 3) {
          h.crabes--; h.changements = [];
          Son.decroche();
          const c = creerPoisson('crabe', h.x, h.y + 0.6); c.fuite = 1.5; c.vit = 5; c.fuyard = true; etat.ents.push(c);
          texte(h.x, h.y - 1, tr('flottant.decroche'), '#ffd2c8');
        }
      }
    }
    // Courants
    let pousse = 0;
    for (const c of etat.courants) if (h.y > c.y0 && h.y < c.y1) pousse += c.f;
    if (pousse && !h.dansCourant) Son.courant();
    h.dansCourant = !!pousse;
    // Lumière des baudroies (aimant)
    for (const e of etat.ents) {
      if (e.type !== 'poisson' || !ESP[e.e].aimant || e.repousse > 0) continue;
      const lx = e.x + e.dir * e.r * 1.3, ly = e.y - e.r * 1.1;
      const d = Math.hypot(lx - h.x, ly - h.y);
      if (d < ESP[e.e].aimant && d > 0.3) pousse += ((lx - h.x) / d) * 3.2;
    }
    h.x = clamp(h.x + (vx + pousse) * dt, 0.5, L - 0.5);
    if (pousse) h.cible += pousse * dt;
    // Vertical
    if (etat.phase === 'descente') {
      h.y += m.vit * (1 + 0.15 * h.crabes) * dt;
      if (Math.random() < dt * 10) etat.parts.push({ x: h.x + rnd(-0.2, 0.2), y: h.y - 0.4, vx: rnd(-0.3, 0.3), vy: rnd(-2.5, -1.5), vie: 1, c: 'bulle', r: rnd(0.07, 0.16) });
      if (h.y >= lmax()) { h.y = lmax(); remonter(h.y >= def().fond - 1 ? 'fond' : 'ligne'); return; }
    } else {
      const v = m.vit * 1.25 * (h.plein ? 3 : 1) / (1 + 0.15 * h.crabes);
      h.y -= v * dt;
      if (h.plein && Math.random() < dt * 30) etat.parts.push({ x: h.x + rnd(-0.4, 0.4), y: h.y + 0.6, vx: rnd(-0.5, 0.5), vy: rnd(1, 2), vie: 0.7, c: 'bulle', r: rnd(0.06, 0.14) });
      if (h.y <= 0) { arriverSurface(); return; }
    }
    collisions();
  }
  function collisions() {
    const h = etat.h;
    for (const e of etat.ents.slice()) {
      if (Math.abs(e.y - h.y) > 6) continue;
      const r = rayon(e);
      const dx = h.x - e.x, dy = h.y - e.y;
      const d = Math.hypot(dx, dy);
      if (e.type === 'glace') {
        const R = r * 0.92 + h.r;
        if (d < R) {
          const s = dx === 0 ? (Math.random() < 0.5 ? -1 : 1) : Math.sign(dx);
          h.x = e.x + s * Math.sqrt(Math.max(0, R * R - dy * dy));
          h.cible = h.x + s * 0.5;
          if (!e.tinte || etat.temps - e.tinte > 0.6) { Son.glace(); e.tinte = etat.temps; etincelles(h.x, h.y, '#e6fbff', 5); }
        }
        continue;
      }
      if (d > r + h.r) continue;
      if (h.plein && etat.phase === 'remontee') continue; // hameçon plein : il file vers la surface
      if (e.type === 'meduse') { couperLigne(); return; }
      if (e.type === 'coffre') { if (etat.phase === 'remontee') capturer(e); continue; }
      if (e.type !== 'poisson' || e.fuyard) continue;
      const es = ESP[e.e];
      if (etat.phase === 'descente') {
        if (es.crabe) {
          etat.ents.splice(etat.ents.indexOf(e), 1);
          h.crabes++; Son.crabe();
          texte(h.x, h.y - 1, tr('flottant.crabe'), '#ffd2c8');
          continue;
        }
        if (es.geant) {
          Son.repousse(); repousser(e);
          texte(h.x, h.y - 1.5, tr('flottant.geantTot', { n: es.geant }), '#ffd2c8');
          remonter('geant');
          return;
        }
        if (e.esquive > 0) continue;
        if (h.coque > 0) {
          h.coque--; Son.coque();
          e.esquive = 1.2; e.dir = dx > 0 ? -1 : 1; if (e.banc) { e.banc = null; e.y0 = e.y; }
          etincelles(h.x, h.y, '#bfe8ff', 10);
          texte(h.x, h.y - 1, tr('flottant.coque'), '#bfe8ff');
          continue;
        }
        capturer(e);
        remonter('poisson');
        return;
      }
      // Remontée
      if (es.geant) {
        if (e.repousse > 0) continue;
        if (h.charge >= es.geant) capturer(e);
        else { Son.repousse(); repousser(e); texte(h.x, h.y - 1.5, tr('flottant.geantTot', { n: es.geant }), '#ffd2c8'); }
        continue;
      }
      if (h.charge < valAmelio('hamecon')) capturer(e);
    }
  }
  function repousser(e) {
    const h = etat.h;
    e.repousse = 1.2;
    const s = h.x >= e.x ? 1 : -1;
    h.x = clamp(e.x + s * (e.r + h.r + 0.4), 0.5, monde() - 0.5);
    h.cible = h.x + s;
    etat.secousse = 0.25;
  }

  // ------------------------------------------------------------------------
  // Effets : particules, textes, pièces qui volent
  // ------------------------------------------------------------------------
  function eclaboussure(x, y, n) { for (let i = 0; i < n; i++) etat.parts.push({ x: x + rnd(-0.3, 0.3), y: y - 0.1, vx: rnd(-3, 3), vy: rnd(-7, -3), vie: 1, c: 'goutte', r: rnd(0.08, 0.2), g: 14 }); }
  function etincelles(x, y, c, n) { for (let i = 0; i < n; i++) { const a = rnd(0, TAU), v = rnd(1.5, 4.5); etat.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 0.8, c, r: rnd(0.06, 0.14), etoile: true }); } }
  function texte(x, y, txt, c) { etat.textes.push({ x, y, txt, c, vie: 1.4 }); }
  function banniere(txt, c) { etat.banniere = { txt, c, vie: 2 }; }
  function majEffets(dt) {
    for (const p of etat.parts) { p.x += p.vx * dt; p.y += p.vy * dt; if (p.g) p.vy += p.g * dt; p.vie -= dt; if (p.c === 'bulle' && p.y < 0) p.vie = 0; }
    etat.parts = etat.parts.filter((p) => p.vie > 0);
    if (etat.parts.length > 400) etat.parts.splice(0, etat.parts.length - 400);
    for (const t of etat.textes) { t.y -= dt * 1.2; t.vie -= dt; }
    etat.textes = etat.textes.filter((t) => t.vie > 0);
    if (etat.banniere) { etat.banniere.vie -= dt; if (etat.banniere.vie <= 0) etat.banniere = null; }
    if (etat.secousse > 0) etat.secousse = Math.max(0, etat.secousse - dt);
    // Poissons qui s'envolent, puis éclatent en pièces
    for (const v of etat.volants) {
      v.t += dt;
      if (v.t < 0) continue;
      v.x += v.vx * dt; v.y += v.vy * dt; v.vy += 16 * dt; v.rot += v.vr * dt;
      if (!v.fait && v.t > v.pop) {
        v.fait = true;
        const cible = cibleHud();
        const n = clamp(Math.round(Math.sqrt(v.v)), 1, 8);
        const sx = v.x * S, sy = (v.y - etat.camY) * S;
        for (let i = 0; i < n; i++) etat.piecesFx.push({ x: sx, y: sy, vx: rnd(-160, 160), vy: rnd(-260, -80), t: 0, cx: cible.x, cy: cible.y, val: i === 0 ? v.v : 0 });
        for (let i = 0; i < 6; i++) etat.parts.push({ x: v.x, y: v.y, vx: rnd(-3, 3), vy: rnd(-3, 3), vie: 0.5, c: '#fff6b0', r: rnd(0.06, 0.12), etoile: true });
      }
    }
    etat.volants = etat.volants.filter((v) => !v.fait);
    for (const p of etat.piecesFx) {
      p.t += dt;
      if (p.t < 0.35) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; }
      else { const k = Math.min(1, dt * 9); p.x += (p.cx - p.x) * k; p.y += (p.cy - p.y) * k; }
      if (p.t > 0.35 && Math.hypot(p.cx - p.x, p.cy - p.y) < 14) {
        p.fini = true;
        if (p.val) { etat.affPieces = Math.min(prog.pieces, etat.affPieces + p.val); Son.piece(); const el = $('hud-pieces'); el.classList.remove('bonus'); void el.offsetWidth; el.classList.add('bonus'); }
      }
    }
    etat.piecesFx = etat.piecesFx.filter((p) => !p.fini);
    if (!etat.piecesFx.length && !etat.volants.length && etat.phase !== 'envol') etat.affPieces = prog.pieces;
    const n = $('hud-pieces-n'); const txt = nb(Math.round(etat.affPieces)); if (n.textContent !== txt) n.textContent = txt;
  }
  function cibleHud() {
    const el = $('hud-pieces');
    const r = el.getBoundingClientRect();
    return { x: r.left + 16, y: r.top + r.height / 2 };
  }
  function majCamera(dt) {
    const V = vis();
    const h = etat.h;
    let c;
    if (etat.phase === 'surface' || etat.phase === 'envol') c = -V * 0.42;
    else if (etat.phase === 'descente') c = h.y - V * 0.3;
    else c = h.y - V * 0.68;
    c = Math.min(c, def().fond + 3 - V);
    c = Math.max(c, -V * 0.42);
    const vitesse = etat.phase === 'coupe' ? 12 : 5;
    etat.camY += (c - etat.camY) * Math.min(1, dt * vitesse);
  }

  // ------------------------------------------------------------------------
  // Fin de niveau
  // ------------------------------------------------------------------------
  function victoire() {
    const i = etat.niv;
    etat.phase = 'fini'; etat.enPartie = false;
    const etoiles = etat.plongee <= 1 ? 3 : etat.plongee === 2 ? 2 : 1;
    const ancien = prog.etoiles[i];
    prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
    const record = etat.gains > prog.records[i];
    if (record) prog.records[i] = etat.gains;
    prog.atteint = Math.max(prog.atteint, Math.min(NIVEAUX.length, i + 2));
    sauver(Math.min(NIVEAUX.length, i + 2));
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
    if (prog.etoiles.every((e) => e > 0)) {
      if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
    }
    Son.victoire();
    confettis();
    montrerFin(true, etoiles, record, ancien);
  }
  function defaite() {
    etat.phase = 'fini'; etat.enPartie = false;
    sauver(etat.niv + 1);
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: etat.niv + 1 });
    Son.defaite();
    montrerFin(false, 0, false, 0);
  }
  function confettis() {
    const L = monde();
    const cols = ['#ffd23f', '#ff6b8b', '#5fd4ff', '#9dffb0', '#ffffff', '#ff9f43'];
    for (let i = 0; i < 90; i++) etat.parts.push({ x: rnd(0, L), y: etat.camY + rnd(-2, 1), vx: rnd(-1.5, 1.5), vy: rnd(0, 3), vie: rnd(2, 3.5), c: cols[i % cols.length], r: rnd(0.1, 0.2), g: 3, confetti: true, rot: rnd(0, TAU) });
  }
  function montrerFin(gagne, etoiles, record, ancien) {
    const fin = $('fen-fin');
    $('fin-titre').textContent = gagne ? tr('fin.bravo') : tr('fin.rate');
    const box = $('fin-etoiles'); box.textContent = '';
    for (let k = 0; k < 3; k++) {
      const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      s.setAttribute('viewBox', '0 0 24 24');
      s.innerHTML = '<path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z" fill="#ffc93c" stroke="#b07a00" stroke-width="1.2" stroke-linejoin="round"/>';
      box.appendChild(s);
      if (gagne && k < etoiles) setTimeout(() => { s.classList.add('allumee'); Son.etoile(k); }, 350 + k * 320);
    }
    box.hidden = !gagne;
    const resteObj = def().obj.map(([k, n]) => tr('fin.manque', { a: Math.min(n, avancement(k)), n, nom: k in ESP ? tr('esp.' + k) : tr('hud.' + k) })).join(' · ');
    $('fin-message').textContent = gagne ? tr('fin.etoilesPlongees', { n: etat.plongee }) : tr('fin.defaite', { detail: resteObj });
    // Compteur de pièces qui défile
    const cible = etat.gains; const debut = performance.now();
    const el = $('fin-pieces');
    const defile = () => { const k = Math.min(1, (performance.now() - debut) / 900); el.textContent = nb(Math.round(cible * k)); if (k < 1 && !fin.hidden) requestAnimationFrame(defile); };
    el.textContent = '0'; requestAnimationFrame(defile);
    $('fin-record').textContent = gagne ? (record ? tr('fin.record') : tr('fin.meilleur', { n: nb(prog.records[etat.niv]) })) : tr('fin.gardees');
    const nv = $('fin-nouvelles'); nv.textContent = '';
    etat.nouvelles.forEach((e) => { const c = iconeCanvas(e, 54); c.title = tr('esp.' + e); nv.appendChild(c); });
    $('fin-nouvelles-bloc').hidden = !etat.nouvelles.length;
    const p = $('btn-fin-principal');
    if (gagne) {
      if (etat.niv + 1 >= NIVEAUX.length) { p.dataset.action = 'bilan'; p.textContent = tr('btn.bilan'); }
      else { p.dataset.action = 'suivant'; p.textContent = tr('btn.suivant'); }
    } else { p.dataset.action = 'reessayer'; p.textContent = tr('btn.reessayer'); }
    $('btn-fin-rejouer').hidden = !gagne;
    void ancien;
    fin.hidden = false;
    p.focus({ preventScroll: true });
  }
  function montrerBilan() {
    cacherTout();
    $('bilan-etoiles').textContent = tr('bilan.etoiles', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    $('bilan-aqua').textContent = tr('bilan.aqua', { n: ORDRE_AQUA.filter((k) => prog.aqua[k]).length, max: ORDRE_AQUA.length });
    $('bilan-prof').textContent = tr('bilan.prof', { n: prog.profMax, p: nb(prog.gagne) });
    $('fen-bilan').hidden = false;
    menuFond(3);
  }

  // ------------------------------------------------------------------------
  // Écrans
  // ------------------------------------------------------------------------
  const FENETRES = ['fen-fiche', 'fen-nouveau', 'fen-pause', 'fen-fin', 'fen-bilan'];
  const ECRANS = ['ecran-titre', 'ecran-niveaux', 'ecran-port', 'ecran-aqua'];
  function fenetreOuverte() { return FENETRES.some((id) => !$(id).hidden) || ECRANS.some((id) => !$(id).hidden); }
  function cacherTout() { [...FENETRES, ...ECRANS].forEach((id) => { $(id).hidden = true; }); etat.demo = null; }
  function menuFond(m) {
    etat.mode = 'menu'; etat.enPartie = false; etat.merMenu = m; etat.pause = false;
    $('hud').hidden = true;
    etat.parts = []; etat.textes = []; etat.banniere = null; etat.volants = []; etat.piecesFx = [];
    const L = monde();
    etat.deco = [];
    const especes = ORDRE_AQUA.filter((k) => MER_ESP[k] === m && !ESP[k].geant && !ESP[k].crabe);
    for (let i = 0; i < Math.round(10 * clamp(L / 16, 1, 3)); i++) { const f = creerPoisson(especes[i % especes.length], rnd(1, L - 1), rnd(4, vis() * 0.55)); etat.deco.push(f); }
  }
  function montrerTitre() {
    cacherTout();
    menuFond(Math.min(3, Math.floor((prog.atteint - 1) / 5)));
    $('titre-resume').textContent = tr('titre.resume', { e: totalEtoiles(), max: NIVEAUX.length * 3, p: nb(prog.pieces) });
    $('ecran-titre').hidden = false;
  }
  function montrerNiveaux() {
    cacherTout();
    if (etat.mode === 'jeu') menuFond(def().mer);
    const box = $('liste-niveaux'); box.textContent = '';
    const couleurs = ['#39c3d4', '#2f86c6', '#6aa6d6', '#3a3f8f'];
    for (let m = 0; m < 4; m++) {
      const g = document.createElement('div'); g.className = 'groupe-mer';
      const h3 = document.createElement('h3'); h3.textContent = tr('mer.' + MERS[m].id); g.appendChild(h3);
      const grille = document.createElement('div'); grille.className = 'grille';
      for (let i = m * 5; i < m * 5 + 5; i++) {
        const b = document.createElement('button'); b.className = 'case-niv';
        const ouvert = niveauOuvert(i);
        if (ouvert) {
          b.style.background = `linear-gradient(#fff, ${couleurs[m]}33)`;
          const n = document.createElement('span'); n.textContent = nb(i + 1); b.appendChild(n);
          const e = document.createElement('span'); e.className = 'mini-etoiles'; e.textContent = '★'.repeat(prog.etoiles[i]) + '☆'.repeat(3 - prog.etoiles[i]); b.appendChild(e);
          b.setAttribute('aria-label', tr('niveaux.aria', { n: i + 1, e: prog.etoiles[i] }));
          b.addEventListener('click', () => { Son.init(); Son.clic(); lancerNiveau(i); });
        } else {
          b.classList.add('ferme'); b.disabled = true;
          b.innerHTML = '<svg class="cadenas" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2.4" fill="none"/></svg>';
          b.setAttribute('aria-label', tr('niveaux.ferme', { n: i + 1 }));

      for (let i = 0; i < 7; i++) { const x = W * (i / 6) - 40 * u; c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 55 * u, 0); c.lineTo(x + 150 * u, H * 0.8); c.lineTo(x + 30 * u, H * 0.8); c.fill(); }
      c.restore();
      const sol = c.createRadialGradient(W * 0.5, -H * 0.02, 10, W * 0.5, -H * 0.02, H * 0.5);
      sol.addColorStop(0, 'rgba(255,255,220,.95)'); sol.addColorStop(0.25, 'rgba(255,250,200,.45)'); sol.addColorStop(1, 'rgba(255,250,200,0)');
      c.fillStyle = sol; c.fillRect(0, 0, W, H * 0.55);
      // Coque du bateau vue d'en dessous, à la surface
      c.fillStyle = 'rgba(40,60,90,.75)'; c.beginPath(); c.ellipse(W * 0.5, H * 0.012, 120 * u, 26 * u, 0, 0, Math.PI); c.fill();
      // Géant des abysses au loin (profondeur)
      c.save(); c.globalAlpha = 0.35; dessinerEspece(c, 'calmarGeant', W * 0.2, H * 0.83, 150 * u, 1, 1.2, { silhouette: true }); c.restore();
      c.save(); c.globalAlpha = 0.45; dessinerEspece(c, 'baudroie', W * 0.86, H * 0.82, 60 * u, -1, 0.5, { lumineux: true }); c.restore();
      // Bancs de poissons qui s'écartent
      const banc = [[0.12, 0.3, 'argent', 1], [0.2, 0.36, 'argent', 1], [0.08, 0.42, 'argent', 1], [0.84, 0.26, 'jaune', -1], [0.92, 0.33, 'jaune', -1], [0.78, 0.36, 'jaune', -1], [0.88, 0.5, 'raye', -1], [0.13, 0.6, 'papillon', 1], [0.83, 0.64, 'chirurgien', -1]];
      for (const [x, y, e, d] of banc) dessinerEspece(c, e, W * x, H * y, 28 * u, d, t + x * 10, {});
      // Ligne qui descend vers l'hameçon doré
      const hx = W * 0.5, hy = H * 0.21;
      c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 3 * u; c.beginPath(); c.moveTo(W * 0.5, 0); c.lineTo(hx, hy); c.stroke();
      // Halo de la prise (lumière d'accent)
      const halo = c.createRadialGradient(hx, H * 0.42, 20 * u, hx, H * 0.42, 260 * u);
      halo.addColorStop(0, 'rgba(255,230,120,.55)'); halo.addColorStop(1, 'rgba(255,230,120,0)');
      c.fillStyle = halo; c.fillRect(0, 0, W, H);
      // La grande prise : héros de l'affiche, en grand
      c.save(); c.shadowColor = 'rgba(255,255,210,.9)'; c.shadowBlur = 18 * u;
      dessinerEspece(c, 'lune', hx + 70 * u, H * 0.52, 120 * u, 1, 0.4, { rot: -Math.PI / 2 + 0.25 });
      dessinerEspece(c, 'tortue', hx - 86 * u, H * 0.45, 100 * u, 1, 0.8, { rot: -Math.PI / 2 - 0.35 });
      dessinerEspece(c, 'raye', hx + 6 * u, H * 0.36, 52 * u, 1, 0.2, { rot: -Math.PI / 2 + 0.1 });
      dessinerEspece(c, 'jaune', hx - 40 * u, H * 0.3, 40 * u, 1, 0.5, { rot: -Math.PI / 2 - 0.3 });
      dessinerEspece(c, 'chirurgien', hx + 52 * u, H * 0.31, 42 * u, 1, 0.9, { rot: -Math.PI / 2 + 0.35 });
      dessinerEspece(c, 'papillon', hx - 10 * u, H * 0.6, 46 * u, 1, 0.3, { rot: -Math.PI / 2 - 0.1 });
      c.restore();
      dessinerCoffre(c, hx - 70 * u, H * 0.66, 34 * u, 0.4);
      dessinerHamecon(c, hx, hy, 46 * u, false);
      // Éclats de lumière autour de la prise
      c.fillStyle = '#fff6b0';
      for (const [dx, dy, r] of [[-170, 120, 12], [175, 150, 14], [-120, 330, 10], [160, 330, 11], [0, 90, 8], [-190, 230, 8], [200, 245, 9]]) etoileForme(c, hx + dx * u, H * 0.2 + dy * u, r * u);
      // Bulles
      c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 2 * u;
      for (let i = 0; i < 22; i++) { c.beginPath(); c.arc(W * (0.3 + ((i * 0.37) % 0.4)), H * (0.12 + ((i * 0.53) % 0.6)), (3 + (i % 4) * 2) * u, 0, TAU); c.stroke(); }
      // Premier plan : coraux et algues coupés par les bords, méduse floue
      for (const [x, cc] of [[0.03, '#ff7a8f'], [0.97, '#ffb24d']]) { c.fillStyle = cc; for (let k = 0; k < 6; k++) rond(c, W * x + Math.sin(k * 2) * 40 * u, H * (0.8 + k * 0.04), (34 + (k % 2) * 16) * u); }
      for (let i = 0; i < 6; i++) algue(c, W * (0.08 + i * 0.17), H * 1.02, H * (0.18 + (i % 3) * 0.06), t + i, i % 2 ? '#2f9f5a' : '#48c274');
      dessinerMeduse(c, W * 0.88, H * 0.12, 34 * u, 0.5, false);
    };
    let t0 = performance.now();
    const boucleAffiche = () => { peindre((performance.now() - t0) / 1000); requestAnimationFrame(boucleAffiche); };
    requestAnimationFrame(boucleAffiche);
  }

  // ------------------------------------------------------------------------
  // Images du jeu (page du jeu) : une vraie partie posée par le code, figée
  // ------------------------------------------------------------------------
  function ouvrirApercu(n) {
    cacherTout();
    document.querySelectorAll('jel-langue, .jel-langue').forEach((el) => { el.style.display = 'none'; });
    const choix = { 1: { niv: 0, phase: 'descente', y: 16, prises: [] },
      2: { niv: 7, phase: 'remontee', y: 66, prises: ['ballon', 'papillon', 'chirurgien', 'papillon', 'merou', 'chirurgien', 'papillon'] },
      3: { niv: 16, phase: 'remontee', y: 352, prises: ['lanterne', 'hachette', 'lanterne', 'dragon', 'lanterne', 'hachette', 'lanterne', 'dragon', 'baudroie'] } }[n];
    if (!choix) return;
    prog.amelio = n === 1 ? { ligne: 0, hamecon: 1, moteur: 0, coque: 0 } : n === 2 ? { ligne: 3, hamecon: 2, moteur: 2, coque: 1 } : { ligne: 7, hamecon: 4, moteur: 4, coque: 3 };
    prog.bateau = n === 3 ? 'phare' : 'barque';
    prog.pieces = n === 1 ? 24 : n === 2 ? 860 : 6420;
    preparerNiveau(choix.niv);
    $('hud').hidden = false;
    const h = etat.h;
    etat.phase = choix.phase; h.y = choix.y; h.x = monde() * 0.45; h.cible = h.x;
    // Place des créatures autour de l'hameçon
    const L = monde();
    if (n === 1) {
      etat.plongee = 0;
      etat.ents.push(Object.assign(creerPoisson('jaune', h.x + 2.4, h.y + 4), { dir: -1 }), Object.assign(creerPoisson('argent', h.x - 2.2, h.y + 7), {}), Object.assign(creerPoisson('argent', h.x + 0.5, h.y + 10), { dir: 1 }), Object.assign(creerPoisson('jaune', L * 0.85, h.y + 1.5), { dir: -1 }));
      for (let i = 0; i < 12; i++) etat.parts.push({ x: h.x + rnd(-0.2, 0.2), y: h.y - rnd(0.4, 5), vx: 0, vy: -2, vie: 5, c: 'bulle', r: rnd(0.07, 0.16) });
    } else if (n === 2) {
      etat.plongee = 1; etat.compte.esp.ballon = 2; etat.compte.poissons = 9;
      const b = creerPoisson('ballon', h.x + 1.6, h.y - 2.2); b.gonfle = 1; b.dir = -1; etat.ents.push(b);
      const banc = { x: h.x - 2.5, y: h.y - 6, dir: 1, vit: 1.5, tourne: true, minuteur: 3, frisson: 0 }; etat.bancs.push(banc);
      for (let i = 0; i < 8; i++) { const f = creerPoisson('papillon', banc.x + rnd(-2.4, 2.4), banc.y + rnd(-1.4, 1.4)); f.banc = banc; f.ox = f.x - banc.x; f.oy = f.y - banc.y; etat.ents.push(f); }
      etat.ents.push(Object.assign(creerPoisson('ballon', L * 0.82, h.y - 9), { dir: -1 }));
      etat.ents.push({ type: 'meduse', x: L * 0.2, y: h.y - 3, y0: h.y - 3, r: 0.8, ph: 1, dir: 1 });
    } else {
      etat.plongee = 1;
      etat.ents = etat.ents.filter((e) => !(e.type === 'poisson' && ESP[e.e].geant));
      const g = creerPoisson('calmarGeant', h.x + 4.5, h.y - 6); g.dir = -1; g.y0 = g.y; etat.ents.push(g);
      etat.ents.push(Object.assign(creerPoisson('lanterne', h.x - 3, h.y - 2.5), { dir: 1 }), Object.assign(creerPoisson('lanterne', h.x - 4, h.y - 9), { dir: 1 }), Object.assign(creerPoisson('dragon', h.x + 9, h.y - 1), { dir: -1 }));
      etat.ents.push({ type: 'meduse', x: h.x - 9, y: h.y - 5, y0: h.y - 5, r: 0.8, ph: 2, dir: 1 });
      etat.ents.push(Object.assign(creerPoisson('baudroie', L * 0.85, h.y - 11), { dir: -1 }));
    }
    for (const p of choix.prises) h.prises.push({ e: p, v: ESP[p].v });
    h.charge = h.prises.length;
    const V = vis();
    etat.camY = clamp(choix.phase === 'descente' ? h.y - V * 0.3 : h.y - V * 0.6, -V * 0.42, def().fond + 3 - V);
    majHud();
    etat.affPieces = prog.pieces;
    etat.fige = true;
  }

  // ------------------------------------------------------------------------
  // Commandes : doigt, souris, clavier
  // ------------------------------------------------------------------------
  function enJeu() { return etat.mode === 'jeu' && !etat.pause && !etat.fige && !fenetreOuverte(); }
  cv.addEventListener('pointerdown', (e) => {
    Son.init();
    if (!enJeu()) return;
    e.preventDefault();
    if (etat.phase === 'surface') { lacherLigne(); }
    if (etat.h) etat.h.cible = e.clientX / S;
    etat.appui = true;
  });
  cv.addEventListener('pointermove', (e) => {
    if (!enJeu() || !etat.h) return;
    if (e.pointerType === 'mouse' || etat.appui) etat.h.cible = e.clientX / S;
  });
  window.addEventListener('pointerup', () => { etat.appui = false; });
  window.addEventListener('pointercancel', () => { etat.appui = false; });
  window.addEventListener('keydown', (e) => {
    Son.init();
    const code = e.code;
    if (code === 'Escape' || code === 'KeyP') {
      if (etat.mode !== 'jeu' || etat.fige) return;
      e.preventDefault();
      if (!$('fen-pause').hidden) reprendre(); else if (!fenetreOuverte()) montrerPause();
      return;
    }
    if ((code === 'Enter' || code === 'NumpadEnter' || code === 'Space') && !e.repeat) {
      // Dans une fenêtre : le bouton principal
      const fen = FENETRES.find((id) => !$(id).hidden);
      if (fen && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) { const b = $(fen).querySelector('[data-primaire]'); if (b) { e.preventDefault(); b.click(); } return; }
    }
    if (!enJeu()) return;
    if (code === 'ArrowLeft' || code === 'KeyA' || code === 'KeyQ') { clavier.g = true; e.preventDefault(); }
    else if (code === 'ArrowRight' || code === 'KeyD') { clavier.d = true; e.preventDefault(); }
    else if (code === 'Space' || code === 'Enter' || code === 'NumpadEnter' || code === 'ArrowDown' || code === 'KeyS') { if (!e.repeat) lacherLigne(); e.preventDefault(); }
  });
  window.addEventListener('keyup', (e) => {
    const code = e.code;
    if (code === 'ArrowLeft' || code === 'KeyA' || code === 'KeyQ') { clavier.g = false; if (etat.h) etat.h.cible = etat.h.x; }
    if (code === 'ArrowRight' || code === 'KeyD') { clavier.d = false; if (etat.h) etat.h.cible = etat.h.x; }
  });
  window.addEventListener('blur', () => { clavier.g = clavier.d = false; });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && etat.mode === 'jeu' && etat.enPartie && !fenetreOuverte()) montrerPause();
  });
  function montrerPause() {
    if (etat.fige) return;
    etat.pause = true;
    clavier.g = clavier.d = false;
    $('fen-pause').hidden = false;
    $('btn-reprendre').focus({ preventScroll: true });
  }
  function reprendre() { $('fen-pause').hidden = true; etat.pause = false; dernierTemps = performance.now(); }

  function majBoutonSon() { $('btn-son').classList.toggle('coupe', !prog.son); $('btn-son').setAttribute('aria-pressed', prog.son ? 'false' : 'true'); }
  function brancherBoutons() {
    $('btn-jouer').addEventListener('click', () => {
      Son.init(); Son.clic();
      chargerProgression(); majBoutonSon();
      if (!window.JEL_SAVE) { lancerNiveau(0); return; }
      window.JEL_SAVE.reprise({
        jeu: JEU,
        onContinuer: (d) => { const n = clamp(Math.floor(Number(d.niveau) || 1), 1, NIVEAUX.length); prog.atteint = Math.max(prog.atteint, n); lancerNiveau(n - 1); },
        onNouvelle: () => { lancerNiveau(0); },
        onEffacer: () => { Object.assign(prog, nouvelleProgression()); majBoutonSon(); lancerNiveau(0); },
      });
    });
    $('btn-titre-niveaux').addEventListener('click', () => { Son.init(); Son.clic(); montrerNiveaux(); });
    $('btn-titre-port').addEventListener('click', () => { Son.init(); Son.clic(); montrerPort('titre'); });
    $('btn-titre-aqua').addEventListener('click', () => { Son.init(); Son.clic(); montrerAquarium('titre'); });
    $('btn-niveaux-retour').addEventListener('click', () => { Son.clic(); montrerTitre(); });
    $('btn-niveaux-port').addEventListener('click', () => { Son.clic(); montrerPort('niveaux'); });
    $('btn-port-retour').addEventListener('click', () => { Son.clic(); quitterPort(); });
    $('btn-aqua-retour').addEventListener('click', () => { Son.clic(); if (etat.retourAqua === 'bilan') { cacherTout(); $('fen-bilan').hidden = false; } else montrerTitre(); });
    $('btn-plonger').addEventListener('click', () => { Son.init(); commencerNiveau(); });
    $('btn-fiche-port').addEventListener('click', () => { Son.clic(); montrerPort('fiche'); });
    $('btn-fiche-niveaux').addEventListener('click', () => { Son.clic(); montrerNiveaux(); });
    $('btn-compris').addEventListener('click', fermerNouveau);
    $('btn-pause').addEventListener('click', () => { if (fenetreOuverte()) return; Son.init(); Son.clic(); montrerPause(); });
    $('btn-reprendre').addEventListener('click', () => { Son.clic(); reprendre(); });
    $('btn-recommencer').addEventListener('click', () => { Son.clic(); $('fen-pause').hidden = true; lancerNiveau(etat.niv); });
    $('btn-pause-niveaux').addEventListener('click', () => { Son.clic(); sauver(etat.niv + 1); montrerNiveaux(); });
    $('btn-pause-accueil').addEventListener('click', () => { Son.clic(); sauver(etat.niv + 1); montrerTitre(); });
    $('btn-fin-principal').addEventListener('click', () => {
      Son.clic();
      const a = $('btn-fin-principal').dataset.action;
      if (a === 'suivant') lancerNiveau(etat.niv + 1);
      else if (a === 'bilan') montrerBilan();
      else lancerNiveau(etat.niv);
    });
    $('btn-fin-rejouer').addEventListener('click', () => { Son.clic(); lancerNiveau(etat.niv); });
    $('btn-fin-port').addEventListener('click', () => {
      Son.clic();
      etat.dernierFin = $('btn-fin-principal').dataset.action === 'suivant' ? etat.niv + 1 : etat.niv;
      montrerPort('fin');
    });
    $('btn-fin-niveaux').addEventListener('click', () => { Son.clic(); montrerNiveaux(); });
    $('btn-bilan-aqua').addEventListener('click', () => { Son.clic(); montrerAquarium('bilan'); });
    $('btn-bilan-niveaux').addEventListener('click', () => { Son.clic(); montrerNiveaux(); });
    $('btn-bilan-accueil').addEventListener('click', () => { Son.clic(); montrerTitre(); });
    $('btn-son').addEventListener('click', () => {
      prog.son = !prog.son;
      try { localStorage.setItem(CLE_SON, prog.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
      // Choix gardé avec la sauvegarde existante (sans en créer une depuis l'écran titre).
      try { if (window.JEL_SAVE && window.JEL_SAVE.existe(JEU) && !APERCU) window.JEL_SAVE.save(JEU, { options: { son: prog.son } }); } catch (e) { /* rien */ }
      majBoutonSon();
      Son.init(); Son.clic();
    });
  }

  // ------------------------------------------------------------------------
  // Boucle principale
  // ------------------------------------------------------------------------
  let dernierTemps = performance.now();
  let horloge = 0;
  function calculerVue() {
    W = window.innerWidth || 390; H = window.innerHeight || 844;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(W * DPR), h = Math.round(H * DPR);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    S = Math.max(14, Math.min(H / 26, W / 12.5));
  }
  function boucle(maintenant) {
    let dt = (maintenant - dernierTemps) / 1000;
    dernierTemps = maintenant;
    if (!(dt > 0)) dt = 0;
    dt = Math.min(dt, 0.05);
    horloge += dt;
    if (etat.mode === 'jeu') {
      if (!etat.pause && !etat.fige) majJeu(dt);
      else if (etat.phase === 'fini' || etat.fige) { majEffets(etat.fige ? 0 : dt); }
    } else {
      // Décor animé des menus
      const L = monde();
      for (const f of etat.deco) { f.ph += dt * 2; f.x += f.dir * f.vit * dt * 0.6; if (f.x < 1) f.dir = 1; if (f.x > L - 1) f.dir = -1; f.y = f.y0 + Math.sin(f.ph) * 0.3; }
      etat.camY = -vis() * 0.36;
      majEffets(dt);
    }
    rendu(horloge);
    if (!$('fen-nouveau').hidden) peindreDemo(horloge);
    if (!$('ecran-aqua').hidden) peindreAquarium(horloge);
    requestAnimationFrame(boucle);
  }

  // ------------------------------------------------------------------------
  // Initialisation
  // ------------------------------------------------------------------------
  function demarrer() {
    calculerVue();
    chargerProgression();
    majBoutonSon();
    brancherBoutons();
    window.addEventListener('resize', () => { if (!AFFICHE) calculerVue(); });
    if (window.JEL_SAVE && !APERCU && !AFFICHE) {
      window.JEL_SAVE.surFermeture(() => { if (etat.mode === 'jeu' && etat.enPartie) sauver(etat.niv + 1); });
    }
    if (AFFICHE) { dessinerAffiche(); return; }
    if (APERCU) { ouvrirApercu(APERCU); requestAnimationFrame(boucle); return; }
    montrerTitre();
    requestAnimationFrame(boucle);
  }
  demarrer();
})();
</script>
