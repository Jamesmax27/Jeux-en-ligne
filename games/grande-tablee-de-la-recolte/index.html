<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }

      if (isole && !coin && hote) {

        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();

    });

      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);

      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }

      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];

    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }

      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }

  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;

  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }

  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };

  // --- Textes (5 langues) -----------------------------------------------------

    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)

  // tout de suite. Renvoie true si la fenêtre s'affiche.

    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');

    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
(function () {
'use strict';
const I18N = window.JEL_I18N;
const t = (cle, vars) => I18N.t(cle, vars);
const JEU = 'grande-tablee-de-la-recolte';

// =====================================================================
//  Données du jeu
// =====================================================================
const W = 400, H = 640;          // espace virtuel de la scène
const COEURS_MAX = 5;            // cœurs de patience par repas
const CX = 200, CY = 345;        // centre de la zone de travail

// Ingrédients (dessinés plus bas) et goûts des invités (fixes tout le jeu).
const INGR = ['citrouille', 'pomme', 'noix', 'mais', 'carotte', 'poire', 'chataigne', 'canneberge', 'courge'];
const GOUTS = { herisson: 'pomme', ecureuil: 'noix', lapin: 'carotte', souris: 'mais', ourson: 'poire', hibou: 'chataigne', renard: 'canneberge', dinde: 'courge' };

// Décorations à débloquer (e = étoiles nécessaires).
const NAPPES = [{ id: 'carreaux', e: 0 }, { id: 'unie', e: 4 }, { id: 'rayures', e: 10 }, { id: 'feuilles', e: 18 }, { id: 'pois', e: 28 }, { id: 'glands', e: 40 }];
const ASSIETTES = [{ id: 'blanche', e: 0 }, { id: 'bleue', e: 6 }, { id: 'feston', e: 14 }, { id: 'doree', e: 24 }, { id: 'citrouille', e: 36 }];
const DECOS = [{ id: 'bougie', e: 0 }, { id: 'bouquet', e: 8 }, { id: 'courges', e: 16 }, { id: 'lanterne', e: 26 }, { id: 'couronne', e: 34 }, { id: 'epis', e: 46 }];

// Étapes : tarte (parts, ingrédients), plat (colonnes, rangées), table (invités).
// Options : cache = secondes avant que le modèle soit caché ; vent = secondes
// entre deux coups de vent ; four = { chauffe (s), vitesse, zone } ;
// suite = période du motif à continuer ; piege = ingrédients inutiles ;
// doubles = invités qui veulent deux choses.
function T(parts, ingr, o) { return Object.assign({ type: 'tarte', parts: parts, ingr: ingr }, o || {}); }
function P(cols, rows, ingr, o) { return Object.assign({ type: 'plat', cols: cols, rows: rows, ingr: ingr }, o || {}); }
function TB(invites, o) { return Object.assign({ type: 'table', invites: invites }, o || {}); }
function F(chauffe, vitesse, zone) { return { chauffe: chauffe, vitesse: vitesse, zone: zone }; }

// salle : 0 grange, 1 verger, 2 salon, 3 grande cour.
// tutos : { index de l'étape : tutoriel montré au début de cette étape }.
// cuisson : tutoriel de la cuisson à la première tarte au four.
const NIVEAUX = [
  { salle: 0, tutos: { 0: 'glisser' }, etapes: [T(4, ['citrouille', 'pomme'])] },
  { salle: 0, tutos: { 1: 'plat' }, etapes: [T(6, ['citrouille', 'pomme', 'mais']), P(2, 2, ['mais', 'pomme'])] },
  { salle: 0, tutos: { 1: 'gouts' }, etapes: [T(4, ['citrouille', 'noix']), TB(['herisson', 'ecureuil'])] },
  { salle: 0, etapes: [P(3, 2, ['mais', 'pomme', 'courge']), TB(['herisson', 'ecureuil', 'lapin'])] },
  { salle: 0, tutos: { 1: 'memoire' }, etapes: [T(6, ['citrouille', 'pomme', 'noix']), P(2, 2, ['mais', 'courge', 'pomme'], { cache: 7 }), TB(['lapin', 'herisson', 'ecureuil'])] },
  { salle: 1, etapes: [T(6, ['citrouille', 'pomme', 'canneberge'], { cache: 6 }), P(3, 2, ['pomme', 'poire', 'mais']), TB(['ecureuil', 'lapin', 'herisson'])] },
  { salle: 1, tutos: { 0: 'feuilles' }, etapes: [P(3, 2, ['mais', 'pomme', 'courge'], { vent: 9 }), TB(['souris', 'herisson', 'ecureuil', 'lapin'], { vent: 9 })] },
  { salle: 1, tutos: { 1: 'cartons' }, etapes: [T(8, ['citrouille', 'pomme']), TB(['souris', 'lapin', 'ecureuil', 'herisson'], { cache: 7 })] },
  { salle: 1, tutos: { 0: 'piege' }, etapes: [P(3, 3, ['mais', 'pomme', 'courge'], { cache: 8, piege: 1 }), T(6, ['citrouille', 'noix', 'canneberge'], { piege: 1, vent: 8 }), TB(['herisson', 'souris', 'ecureuil', 'lapin'], { vent: 8 })] },
  { salle: 1, etapes: [T(6, ['citrouille', 'pomme', 'noix'], { cache: 5, vent: 8 }), P(3, 2, ['mais', 'poire', 'courge'], { cache: 5 }), TB(['lapin', 'souris', 'herisson', 'ecureuil'], { cache: 5 })] },
  { salle: 2, tutos: { 0: 'chaleur' }, cuisson: true, etapes: [T(6, ['citrouille', 'pomme'], { four: F(50, 0.22, 0.24) }), TB(['herisson', 'ecureuil', 'souris'])] },
  { salle: 2, etapes: [T(8, ['citrouille', 'pomme', 'noix'], { four: F(55, 0.25, 0.21) }), TB(['ourson', 'lapin', 'herisson', 'souris'])] },
  { salle: 2, tutos: { 1: 'doubles' }, etapes: [P(3, 2, ['poire', 'mais', 'courge'], { vent: 8 }), TB(['ourson', 'ecureuil', 'herisson', 'lapin'], { doubles: 2, vent: 8 })] },
  { salle: 2, etapes: [T(8, ['citrouille', 'canneberge', 'noix'], { cache: 7, four: F(55, 0.3, 0.19) }), TB(['hibou', 'ourson', 'souris', 'ecureuil', 'lapin'], { cache: 6 })] },

// Hasard à graine (mulberry32) : chaque repas est le même à chaque partie.
function alea(graine) {
  let a = graine >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let x = a;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
function melanger(tab, r) {
  for (let i = tab.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const x = tab[i]; tab[i] = tab[j]; tab[j] = x; }
  return tab;
}
// Motif équilibré : chaque ingrédient revient autant de fois, dans le désordre.
function motifEquilibre(n, ingr, r) {
  const m = [];
  for (let i = 0; i < n; i++) m.push(ingr[i % ingr.length]);
  return melanger(m, r);
}

const progression = { etoiles: [], records: [], decor: { nappe: 'carreaux', assiette: 'blanche', deco: 'bougie' } };
function lireProgression() {
  let d = null;
  try { d = window.JEL_SAVE ? window.JEL_SAVE.load(JEU) : null; } catch (e) { d = null; }
  d = d || {};
  progression.etoiles = NIVEAUX.map((_, i) => {
    const v = Array.isArray(d.etoiles) ? Number(d.etoiles[i]) : 0;
    return isFinite(v) ? Math.max(0, Math.min(3, Math.floor(v))) : 0;
  });
  progression.records = NIVEAUX.map((_, i) => {
    const v = Array.isArray(d.records) ? Number(d.records[i]) : 0;
    return isFinite(v) && v > 0 ? Math.floor(v) : 0;
  });
  const dc = d.decor && typeof d.decor === 'object' ? d.decor : {};
  const ok = (liste, v, def) => liste.some((x) => x.id === v) ? v : def;
  progression.decor = {
    nappe: ok(NAPPES, dc.nappe, 'carreaux'),
    assiette: ok(ASSIETTES, dc.assiette, 'blanche'),
    deco: ok(DECOS, dc.deco, 'bougie'),
  };
  if (d.options && typeof d.options.son === 'boolean') muet = !d.options.son;
}
function totalEtoiles() { return progression.etoiles.reduce((a, b) => a + b, 0); }
function niveauOuvert(i) { return i === 0 || progression.etoiles[i - 1] > 0; }
function donneesSauvegarde(niveau) {
  return {
    niveau: niveau, score: score,
    etoiles: progression.etoiles.slice(), records: progression.records.slice(),
    decor: Object.assign({}, progression.decor), options: { son: !muet },
  };
}
function sauver(niveau) {
  try { if (window.JEL_SAVE) window.JEL_SAVE.save(JEU, donneesSauvegarde(niveau)); } catch (e) { /* sans stockage */ }
}

let muet = false;
try { muet = localStorage.getItem('grande-tablee-son') === 'non'; } catch (e) { /* cadre isolé */ }
let actx = null, bruitBuf = null;
function audio() {
  if (!actx) {
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      actx = new C();
      bruitBuf = actx.createBuffer(1, actx.sampleRate * 1, actx.sampleRate);
      const d = bruitBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; return null; }
  }
  if (actx.state === 'suspended') { try { actx.resume(); } catch (e) { /* rien */ } }
  return actx;
}
function note(freq, debut, duree, type, vol, freqFin) {
  const a = actx; if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  const t0 = a.currentTime + debut;
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (freqFin) o.frequency.exponentialRampToValueAtTime(freqFin, t0 + duree);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + duree + 0.05);
}
function bruit(debut, duree, vol, filtre, f1, f2) {
  const a = actx; if (!a || !bruitBuf) return;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  const t0 = a.currentTime + debut;
  s.buffer = bruitBuf;
  f.type = filtre || 'bandpass';
  f.frequency.setValueAtTime(f1 || 1200, t0);
  if (f2) f.frequency.exponentialRampToValueAtTime(f2, t0 + duree);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + duree * 0.3);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
  s.connect(f); f.connect(g); g.connect(a.destination);
  s.start(t0); s.stop(t0 + duree + 0.05);
}
function son(nom) {
  if (muet || !actx) return;
  try {
    switch (nom) {
      case 'prise': note(520, 0, 0.08, 'sine', 0.12, 760); break;
      case 'pose': note(660, 0, 0.1, 'triangle', 0.22, 990); note(1320, 0.05, 0.12, 'sine', 0.08); break;
      case 'erreur': note(220, 0, 0.22, 'square', 0.06, 150); note(180, 0.12, 0.2, 'square', 0.05, 120); break;
      case 'feuille': bruit(0, 0.22, 0.18, 'bandpass', 2600, 900); note(880, 0, 0.08, 'sine', 0.05, 1400); break;
      case 'vent': bruit(0, 1.1, 0.12, 'bandpass', 400, 1400); break;
      case 'serviette': bruit(0, 0.3, 0.14, 'lowpass', 1800, 500); break;
      case 'tic': note(1200, 0, 0.04, 'square', 0.04); break;
      case 'ding': note(1318, 0, 0.7, 'sine', 0.2); note(1760, 0.02, 0.6, 'sine', 0.1); break;
      case 'brule': note(160, 0, 0.5, 'sawtooth', 0.07, 70); bruit(0, 0.6, 0.1, 'lowpass', 900, 200); break;
      case 'etape': [523, 659, 784, 1046].forEach((f, i) => note(f, i * 0.08, 0.18, 'triangle', 0.16)); break;
      case 'victoire': [523, 659, 784, 659, 784, 1046, 1318].forEach((f, i) => note(f, i * 0.11, 0.24, 'triangle', 0.17)); break;
      case 'defaite': [440, 392, 349, 294].forEach((f, i) => note(f, i * 0.18, 0.3, 'triangle', 0.14)); break;
      case 'etoile': note(1568, 0, 0.25, 'sine', 0.16); note(2093, 0.06, 0.25, 'sine', 0.08); break;
      case 'glouglou': for (let i = 0; i < 5; i++) note(330 + (i % 2) * 120, i * 0.07, 0.07, 'square', 0.05, 260 + (i % 2) * 90); break;
      case 'clic': note(880, 0, 0.05, 'triangle', 0.08); break;
      default: break;
    }
  } catch (e) { /* audio indisponible */ }
}

// Construit une étape d'un repas.
function construireEtape(def, n, e) {
  const r = alea(1009 + n * 97 + e * 13);
  const et = {
    def: def, type: def.type, cibles: [], panier: [], cache: false, memoT: 0, revele: 0,
    ventT: def.vent ? def.vent * 0.6 : 0, chaleur: 0, cuite: false, aiguille: 0, attente: 0,
    rangees: 1, carte: null,
  };
  if (def.type === 'tarte') {
    const nb = def.parts;
    let motif, fixes = 0;
    if (def.suite) {
      const base = melanger(def.ingr.slice(), r).slice(0, def.suite);
      motif = []; for (let i = 0; i < nb; i++) motif.push(base[i % def.suite]);
      fixes = def.suite + 1;
    } else motif = motifEquilibre(nb, def.ingr, r);
    const R = 128;
    for (let i = 0; i < nb; i++) {
      const ang = -Math.PI / 2 + (i + 0.5) * Math.PI * 2 / nb;
      et.cibles.push({
        x: CX + Math.cos(ang) * R * 0.6, y: CY + Math.sin(ang) * R * 0.6, r: nb <= 4 ? 70 : (nb <= 6 ? 58 : 48),
        besoin: [motif[i]], poses: i < fixes ? [motif[i]] : [], fixe: i < fixes, anim: 0, non: 0, feuille: null, ang: ang,
      });
    }
    et.motif = motif;
    et.panier = def.ingr.slice();
  } else if (def.type === 'plat') {
    const cs = def.rows === 3 ? 74 : (def.cols === 3 ? 80 : 92);
    const motif = motifEquilibre(def.cols * def.rows, def.ingr, r);
    const x0 = CX - def.cols * cs / 2 + cs / 2, y0 = CY - def.rows * cs / 2 + cs / 2;
    for (let j = 0; j < def.rows; j++) for (let i = 0; i < def.cols; i++) {
      et.cibles.push({ x: x0 + i * cs, y: y0 + j * cs, r: cs * 0.62, besoin: [motif[j * def.cols + i]], poses: [], fixe: false, anim: 0, non: 0, feuille: null, col: i, lig: j });
    }
    et.taille = cs;
    et.motif = motif;
    et.panier = def.ingr.slice();
  } else {
    const inv = def.invites;
    const n2 = inv.length;
    const deux = n2 > 4;
    et.rangees = deux ? 2 : 1;
    const haut = deux ? Math.ceil(n2 / 2) : n2;
    // Invités qui veulent deux choses.
    const ordre = melanger(inv.map((_, i) => i), r).slice(0, def.doubles || 0);
    inv.forEach((id, i) => {
      const enHaut = i < haut;
      const nbRang = enHaut ? haut : n2 - haut;
      const k = enHaut ? i : i - haut;
      const pas = 340 / nbRang;
      const x = 30 + pas * (k + 0.5);
      const besoin = [GOUTS[id]];
      if (ordre.indexOf(i) >= 0) {
        const autres = INGR.filter((g) => g !== GOUTS[id]);
        besoin.push(autres[Math.floor(r() * autres.length)]);
      }
      let py, cy2, hy;
      if (!deux) { hy = 150; py = 285; cy2 = 348; } else if (enHaut) { hy = 120; py = 250; cy2 = 306; } else { hy = 482; py = 400; cy2 = 344; }
      et.cibles.push({
        x: x, y: py, r: 46, besoin: besoin, poses: [], fixe: false, anim: 0, non: 0, feuille: null,
        invite: { id: id, x: x, y: hy, humeur: 0, ht: 0, enHaut: enHaut || !deux }, cx: x, cy: cy2,
      });
    });
    const set = [];
    et.cibles.forEach((c) => c.besoin.forEach((b) => { if (set.indexOf(b) < 0) set.push(b); }));
    et.panier = set;
  }
  if (def.piege) {
    const autres = melanger(INGR.filter((g) => et.panier.indexOf(g) < 0), r);
    for (let i = 0; i < def.piege && i < autres.length; i++) et.panier.push(autres[i]);
  }
  et.panier = melanger(et.panier, r);
  return et;
}

// Position d'un ingrédient du panier.
// Plus de 6 ingrédients : deux rangées de plus petits ingrédients.
function posPanier(i) {
  const n = etape.panier.length;
  if (n <= 6) {
    const pas = Math.min(64, 352 / n);
    return { x: CX - (n - 1) * pas / 2 + i * pas, y: 588, s: 44 };
  }
  const parRang = Math.ceil(n / 2);
  const rang = i < parRang ? 0 : 1;
  const k = rang ? i - parRang : i;
  const nb = rang ? n - parRang : parRang;
  const pas = Math.min(66, 352 / parRang);
  return { x: CX - (nb - 1) * pas / 2 + k * pas, y: rang ? 610 : 565, s: 34 };
}

// =====================================================================
//  Déroulement d'un repas
// =====================================================================
function lancerNiveau(i) {
  niv = Math.max(0, Math.min(NIVEAUX.length - 1, i));
  etapeIdx = 0; coeurs = COEURS_MAX; score = 0; oeilUtilise = false;
  tutoCuissonVu = false; particules = []; volants = []; popups = []; glisse = null; choix = -1; curseur = -1;
  mode = 'jeu'; enPause = false; enCours = true;

}
function demarrerEtape() {
  etape = construireEtape(NIVEAUX[niv].etapes[etapeIdx], niv, etapeIdx);
  phase = 'jeu'; choix = -1; curseur = clavier ? 0 : -1; glisse = null;
  const tu = NIVEAUX[niv].tutos;
  if (tu && tu[etapeIdx]) lancerTuto(tu[etapeIdx]);
  else if (etape.def.cache) message(etape.type === 'table' ? 'msg.cartons' : 'msg.memo');

}
function lancerTuto(cle) {
  tuto = { cle: cle, t: 0 };
  if (cle === 'feuilles') {
    const c = etape.cibles.find((x) => !x.fixe);
    if (c) c.feuille = poserFeuille(c, true);

}
function finTuto() {
  tuto = null;
  document.getElementById('bandeau').classList.add('cache');
}
function etapeReussie() {
  phase = 'bravo'; bravoT = 1.3;
  son('etape');
  for (let i = 0; i < 40; i++) particule(CX + (Math.random() - 0.5) * 300, 160 + Math.random() * 60, 'feuille');
  message(['msg.bravo1', 'msg.bravo2', 'msg.bravo3'][Math.floor(Math.random() * 3)]);

}
function etapeSuivante() {
  etapeIdx++;

  else finNiveau(true);
}
function perdreCoeur() {
  coeurs = Math.max(0, coeurs - 1);

  son('erreur');

}
function calculerEtoiles() {
  const perdus = COEURS_MAX - coeurs;
  if (perdus === 0 && !oeilUtilise) return 3;
  if (perdus <= 2) return 2;
  return 1;
}

// Fin d'un repas : victoire ou défaite.
function finNiveau(gagne) {
  enCours = false;
  glisse = null;
  const avant = totalEtoiles();
  const fin = document.getElementById('ecran-fin');
  const num = niv + 1;
  let etoiles = 0, nouveauRecord = false;
  if (gagne) {
    score += coeurs * 15;
    etoiles = calculerEtoiles();
    progression.etoiles[niv] = Math.max(progression.etoiles[niv], etoiles);
    if (score > progression.records[niv]) { nouveauRecord = true;progression.records[niv] = score; }
    sauver(num + 1);
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: num });
    if (progression.etoiles.every((e) => e > 0)) {
      if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: MAX_ETOILES });
    }
    son('victoire');
    setTimeout(() => son('glouglou'), 900);
  } else {
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: num });
    son('defaite');
  }
  document.getElementById('fin-titre').textContent = gagne ? t('fin.gagne', { n: num }) : t('fin.perdu');
  document.getElementById('fin-texte').textContent = gagne ? t('fin.gagneTexte') : t('fin.perduTexte');
  const zoneEt = document.getElementById('fin-etoiles');
  zoneEt.innerHTML = '';
  zoneEt.classList.toggle('cache', !gagne);
  for (let i = 0; i < 3; i++) {
    zoneEt.insertAdjacentHTML('beforeend', SVG_ETOILE);
  }
  zoneEt.setAttribute('aria-label', t('fin.etoilesAria', { n: etoiles }));
  const svgs = zoneEt.querySelectorAll('svg');
  for (let i = 0; i < etoiles; i++) setTimeout(() => { svgs[i].classList.add('on'); son('etoile'); }, 450 + i * 350);
  // Score qui défile.
  const elScore = document.getElementById('fin-score');
  const cible = score;
  const t0 = performance.now();
  const defiler = (now) => {
    const u = Math.min(1, (now - t0) / 900);
    elScore.textContent = t('fin.score', { n: Math.round(cible * u) });
    if (u < 1 && !fin.classList.contains('cache')) requestAnimationFrame(defiler);
  };
  elScore.textContent = t('fin.score', { n: 0 });
  requestAnimationFrame(defiler);
  const rec = document.getElementById('fin-record');
  rec.classList.toggle('nouveau', gagne && nouveauRecord);
  rec.textContent = gagne && nouveauRecord ? t('fin.nouveauRecord') : t('fin.record', { n: progression.records[niv] });
  // Décorations débloquées.
  const apres = totalEtoiles();
  const nouvelles = [];
  [['nappe', NAPPES], ['assiette', ASSIETTES], ['deco', DECOS]].forEach(([genre, liste]) => {
    liste.forEach((x) => { if (x.e > avant && x.e <= apres) nouvelles.push(t(genre + '.' + x.id)); });
  });
  document.getElementById('fin-debloque').textContent = nouvelles.length ? t('fin.debloque', { noms: nouvelles.join(', ') }) : '';
  const dernier = niv === NIVEAUX.length - 1;
  document.getElementById('b-suivant').classList.toggle('cache', !gagne || dernier);
  document.getElementById('b-bilan').classList.toggle('cache', !(gagne && dernier));
  document.getElementById('b-reessayer').classList.toggle('cache', gagne);
  document.getElementById('b-rejouer').classList.toggle('cache', !gagne);
  document.getElementById('hud').classList.add('cache');
  montrer('ecran-fin');
}

// =====================================================================
//  Actions du joueur
// =====================================================================
function restants(c) {
  const reste = c.besoin.slice();
  c.poses.forEach((p) => { const k = reste.indexOf(p); if (k >= 0) reste.splice(k, 1); });
  return reste;
}
function complete(c) { return c.poses.length >= c.besoin.length; }

function poser(id, c, fx, fy) {
  if (phase !== 'jeu' || tuto) return;
  if (c.fixe || complete(c)) return;
  if (c.feuille) { c.feuille.secoue = 0.5; message('msg.feuille'); son('tic'); return; }
  const reste = restants(c);
  if (reste.indexOf(id) >= 0) {
    c.poses.push(id); c.anim = 1;
    score += 10;
    popup(c.x, c.y - 30, t('pop.points', { n: 10 }));
    for (let i = 0; i < 10; i++) particule(c.x, c.y, 'etincelle');
    son('pose');
    if (c.invite) {
      c.invite.humeur = 1; c.invite.ht = complete(c) ? 99 : 1.2;
      if (complete(c)) for (let i = 0; i < 4; i++) particule(c.invite.x, c.invite.y - 20, 'coeur');
    }
    majHUD();
    verifierEtape();
  } else {
    c.non = 0.6;
    if (c.invite) { c.invite.humeur = -1; c.invite.ht = 1.1; }
    const k = etape.panier.indexOf(id);
    if (k >= 0) { const p = posPanier(k); volants.push({ id: id, x0: fx, y0: fy, x1: p.x, y1: p.y, u: 0 }); }
    message('msg.oups');
    perdreCoeur();
  }
}
function chasserFeuille(c) {
  if (!c.feuille || !c.feuille.posee) return;
  const f = c.feuille;
  c.feuille = null;
  score += 5;
  popup(c.x, c.y - 30, t('pop.points', { n: 5 }));
  particules.push({ x: c.x, y: c.y, vx: 160 + Math.random() * 80, vy: -200, vie: 1.2, max: 1.2, type: 'feuille', c: f.couleur, rot: f.rot, vr: 8, s: 1.4 });
  son('feuille');
  majHUD();
  verifierEtape();

  if (enPause || !etape || !enCours) return;
  if (tuto) { if (/Enter|Space|Arrow|Digit|Numpad/.test(code)) { e.preventDefault(); finTuto(); } return; }
  if (phase === 'four') { if (code === 'Space' || code === 'Enter' || code === 'NumpadEnter') { e.preventDefault(); sortirTarte(); } return; }
  if (phase !== 'jeu') return;
  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], KeyA: [-1, 0], KeyD: [1, 0], KeyW: [0, -1], KeyS: [0, 1] };
  if (dirs[code]) { e.preventDefault(); clavier = true; deplacerCurseur(dirs[code][0], dirs[code][1]); return; }
  const m = /^(Digit|Numpad)([1-9])$/.exec(code);
  if (m) { const k = Number(m[2]) - 1; if (k < etape.panier.length) { choix = k; clavier = true; son('prise'); } return; }
  if (code === 'Space') { e.preventDefault(); clavier = true; choix = (choix + 1) % etape.panier.length; son('prise'); return; }
  if (code === 'KeyV') { coupDOeil(); return; }
  if (code === 'Enter' || code === 'NumpadEnter') {
    e.preventDefault();
    clavier = true;
    const cs = ciblesActives();
    if (curseur < 0 || curseur >= cs.length) { curseur = 0; return; }
    const c = cs[curseur];
    if (c.feuille) { chasserFeuille(c); return; }
    if (choix < 0) { message('msg.choisis'); return; }
    poser(etape.panier[choix], c, c.x, c.y);
  }
});

// =====================================================================
//  Interface : écrans, barre, boutons
// =====================================================================
const SVG_ETOILE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg>';
const SVG_COEUR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.2 4 6.2 4c2.3 0 3.8 1.4 4.8 3 1-1.6 2.5-3 4.8-3 4 0 5.8 4.4 4.2 7.7C19.5 16.4 12 21 12 21z"/></svg>';
const SVG_CADENAS = '<svg class="cadenas" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3h1.5c.8 0 1.5.7 1.5 1.5v9c0 .8-.7 1.5-1.5 1.5h-13C4.7 22 4 21.3 4 20.5v-9c0-.8.7-1.5 1.5-1.5H7zm2.5 0h5V7a2.5 2.5 0 0 0-5 0v3z"/></svg>';
const SVG_SON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#fff4e0" stroke-width="2" stroke-linecap="round"/></svg>';
const SVG_MUET = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="#fff4e0" stroke-width="2" stroke-linecap="round"/></svg>';

const ECRANS = ['ecran-titre', 'ecran-niveaux', 'ecran-decor', 'ecran-pause', 'ecran-fin', 'ecran-bilan'];
function montrer(id) {
  ECRANS.forEach((e) => document.getElementById(e).classList.toggle('cache', e !== id));
  if (id) {
    const b = document.getElementById(id).querySelector('button.principal:not(.cache), button:not(.cache)');
    if (b) setTimeout(() => { try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30);
  }
}
let minuterieMsg = null;
function message(cle) {
  const el = document.getElementById('message');
  el.textContent = t(cle);
  el.classList.add('voir');
  clearTimeout(minuterieMsg);
  minuterieMsg = setTimeout(() => el.classList.remove('voir'), 1700);
}
function majHUD() {
  if (mode !== 'jeu') return;
  document.getElementById('hud-niveau').textContent = t('hud.niveau', { n: niv + 1 }) + ' · ' + t('salle.' + NIVEAUX[niv].salle);
  const et = document.getElementById('hud-etapes');
  const nb = NIVEAUX[niv].etapes.length;
  if (et.children.length !== nb) { et.innerHTML = ''; for (let i = 0; i < nb; i++) et.appendChild(document.createElement('i')); }
  Array.from(et.children).forEach((el, i) => { el.className = i < etapeIdx || (i === etapeIdx && phase === 'bravo') ? 'fait' : (i === etapeIdx ? 'ici' : ''); });
  et.setAttribute('aria-label', t('hud.etapes', { n: etapeIdx + 1, total: nb }));
  const zc = document.getElementById('hud-coeurs');
  if (zc.children.length !== COEURS_MAX) { zc.innerHTML = ''; for (let i = 0; i < COEURS_MAX; i++) zc.insertAdjacentHTML('beforeend', SVG_COEUR); }
  Array.from(zc.children).forEach((s, i) => s.classList.toggle('vide', i >= coeurs));
  zc.setAttribute('aria-label', t('hud.coeurs', { n: coeurs }));
  document.getElementById('hud-score').textContent = t('hud.score', { n: score });
  document.getElementById('b-oeil').disabled = !(etape && etape.cache && phase === 'jeu');
}
function majSon() {
  document.querySelectorAll('.b-son').forEach((b) => {
    b.innerHTML = muet ? SVG_MUET : SVG_SON;
    b.setAttribute('aria-label', t(muet ? 'b.sonOff' : 'b.sonOn'));
    b.setAttribute('aria-pressed', muet ? 'true' : 'false');
  });
}
function basculerSon() {
  audio();
  muet = !muet;
  try { localStorage.setItem('grande-tablee-son', muet ? 'non' : 'oui'); } catch (e) { /* cadre isolé */ }
  majSon();
  son('clic');
}
function mettrePause() {
  if (mode !== 'jeu' || !enCours || enPause) return;
  enPause = true; glisse = null;
  montrer('ecran-pause');
}
function reprendre() {
  enPause = false;
  montrer(null);
  dernier = performance.now();
}
function allerAccueil() {
  if (enCours) sauver(niv + 1);
  enCours = false; enPause = false; mode = 'titre'; etape = null; tuto = null;
  document.getElementById('bandeau').classList.add('cache');
  document.getElementById('hud').classList.add('cache');
  particules = [];
  calculerEchelle();
  montrer('ecran-titre');
}
function commencer(i) { mode = 'jeu'; calculerEchelle(); lancerNiveau(i); }

// Sélection des repas.
function construireNiveaux() {
  const liste = document.getElementById('niveaux-liste');
  liste.innerHTML = '';
  document.getElementById('niveaux-total').textContent = t('decor.total', { n: totalEtoiles(), max: MAX_ETOILES });
  for (let s = 0; s < 4; s++) {
    const titre = document.createElement('div');
    titre.className = 'salle'; titre.textContent = t('salle.' + s);
    liste.appendChild(titre);
    const grille = document.createElement('div'); grille.className = 'grille';
    for (let k = 0; k < 5; k++) {
      const i = s * 5 + k;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'case';
      const ouvert = niveauOuvert(i);
      if (ouvert) {
        b.innerHTML = '<span></span><span class="mini">' + SVG_ETOILE + SVG_ETOILE + SVG_ETOILE + '</span>';
        b.firstChild.textContent = t('niveaux.num', { n: i + 1 });
        b.querySelectorAll('.mini svg').forEach((sv, j) => sv.classList.toggle('on', j < progression.etoiles[i]));
        b.setAttribute('aria-label', t('niveaux.ouvert', { n: i + 1, e: progression.etoiles[i] }));
        b.addEventListener('click', () => { son('clic'); commencer(i); });
      } else {
        b.classList.add('fermee'); b.innerHTML = SVG_CADENAS;
        b.setAttribute('aria-label', t('niveaux.ferme', { n: i + 1 }));
        b.addEventListener('click', () => { son('erreur'); });
      }
      grille.appendChild(b);
    }
    liste.appendChild(grille);
  }
}

// Décorations.
function apercu(genre, id) {
  const c = document.createElement('canvas');
  c.width = 112; c.height = 112;
  const g2 = c.getContext('2d');
  // Mêmes fonctions de dessin, sur ce petit canvas.
  const avant = ctx;
  ctx = g2;
  try {
    g2.scale(2, 2);
    if (genre === 'nappe') remplirNappe(id, 0, 0, 56, 56);
    else if (genre === 'assiette') { g2.fillStyle = '#c08a4e'; g2.fillRect(0, 0, 56, 56); dessinerAssiette(id, 28, 27, 22); }
    else { g2.fillStyle = '#fbeedd'; g2.fillRect(0, 0, 56, 56); dessinerDeco(id, 28, 30, 0.85); }
  } finally { ctx = avant; }
  return c;
}
function construireDecor() {
  const total = totalEtoiles();
  document.getElementById('decor-total').textContent = t('decor.total', { n: total, max: MAX_ETOILES });
  [['nappe', NAPPES, 'choix-nappe'], ['assiette', ASSIETTES, 'choix-assiette'], ['deco', DECOS, 'choix-deco']].forEach(([genre, liste, idZone]) => {
    const zone = document.getElementById(idZone);
    zone.innerHTML = '';
    liste.forEach((x) => {
      const b = document.createElement('button');
      b.type = 'button';
      const ouvert = total >= x.e;
      const pris = progression.decor[genre] === x.id;
      b.className = (pris ? 'pris' : '') + (ouvert ? '' : ' ferme');
      b.appendChild(apercu(genre, x.id));
      const nom = document.createElement('span');
      nom.textContent = ouvert ? t(genre + '.' + x.id) : t('decor.besoin', { n: x.e });
      b.appendChild(nom);
      b.setAttribute('aria-label', ouvert ? t(genre + '.' + x.id) + (pris ? ' · ' + t('decor.pris') : '') : t('decor.fermeAria', { nom: t(genre + '.' + x.id), n: x.e }));
      b.setAttribute('aria-pressed', pris ? 'true' : 'false');
      b.addEventListener('click', () => {
        if (!ouvert) { son('erreur'); return; }
        progression.decor[genre] = x.id;
        son('pose');
        try { if (window.JEL_SAVE && window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { decor: Object.assign({}, progression.decor) }); } catch (e) { /* rien */ }
        construireDecor();
      });
      zone.appendChild(b);
    });
  });
}
function montrerBilan() {
  document.getElementById('bilan-etoiles').textContent = t('bilan.etoiles', { n: totalEtoiles(), max: MAX_ETOILES });
  document.getElementById('bilan-score').textContent = t('bilan.score', { n: progression.records.reduce((a, b) => a + b, 0) });
  const total = totalEtoiles();
  const toutes = NAPPES.concat(ASSIETTES, DECOS);
  document.getElementById('bilan-decor').textContent = t('bilan.decor', { n: toutes.filter((x) => total >= x.e).length, max: toutes.length });
  montrer('ecran-bilan');
  son('glouglou');
}

// Boutons.
function clic(id, f) { document.getElementById(id).addEventListener('click', () => { audio(); f(); }); }
clic('b-jouer', () => {
  son('clic');
  const lancer = (n) => commencer(n);
  if (window.JEL_SAVE) {
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { lireProgression(); lancer(Math.min(NIVEAUX.length, Math.max(1, d.niveau || 1)) - 1); },
      onNouvelle: () => lancer(0),
      onEffacer: () => { lireProgression(); lancer(0); },
    });
  } else lancer(0);
});
clic('b-niveaux', () => { son('clic'); construireNiveaux(); montrer('ecran-niveaux'); });
clic('b-decor', () => { son('clic'); construireDecor(); montrer('ecran-decor'); });
clic('b-niveaux-retour', () => { son('clic'); allerAccueil(); });
clic('b-decor-retour', () => { son('clic'); allerAccueil(); });
clic('b-pause', () => { son('clic'); mettrePause(); });
clic('b-oeil', () => coupDOeil());
clic('b-reprendre', () => { son('clic'); reprendre(); });
clic('b-recommencer', () => { son('clic'); enPause = false; lancerNiveau(niv); });
clic('b-pause-accueil', () => { son('clic'); allerAccueil(); });
clic('b-suivant', () => { son('clic'); commencer(niv + 1); });
clic('b-rejouer', () => { son('clic'); commencer(niv); });
clic('b-reessayer', () => { son('clic'); commencer(niv); });
clic('b-fin-niveaux', () => { son('clic'); allerAccueil(); construireNiveaux(); montrer('ecran-niveaux'); });
clic('b-fin-accueil', () => { son('clic'); allerAccueil(); });
clic('b-bilan', () => { son('clic'); montrerBilan(); });
clic('b-bilan-decor', () => { son('clic'); allerAccueil(); construireDecor(); montrer('ecran-decor'); });
clic('b-bilan-niveaux', () => { son('clic'); allerAccueil(); construireNiveaux(); montrer('ecran-niveaux'); });
document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', basculerSon));

// Pause automatique quand l'écran est caché ; sauvegarde à la fermeture.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') mettrePause(); });
if (window.JEL_SAVE) {
  window.JEL_SAVE.surFermeture(() => { if (enCours && mode === 'jeu') sauver(niv + 1); });
}
if (I18N.surChangement) I18N.surChangement(() => { majSon(); majHUD(); });
window.addEventListener('resize', redimensionner);

lireProgression();
majSon();
redimensionner();
requestAnimationFrame(boucle);
})();
</script>
