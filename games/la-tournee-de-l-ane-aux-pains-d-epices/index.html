// ===================== Tutoriel animé =====================
// Petites scènes rejouées en boucle : une main montre le geste.
const DEMOS = {
  chemin: { carte: ['#####1#', '#B....#', '#######'], q: 0, actions: [{ trace: [1, 1, 1, 1] }, { servir: 1 }] },
  choix: { carte: ['###2#1#', '#B....#', '#######'], q: 0, actions: [{ trace: [1, 1] }, { servir: 2 }, { trace: [1, 1] }, { servir: 1 }] },
  noix: { carte: ['###3###', '#B....#', '#######'], q: 0, actions: [{ trace: [1, 1] }, { servir: 3 }] },
  sacoche: { carte: ['#1###1#', '#..B..#', '#######'], q: 0, cap: 1, actions: [{ trace: [3, 3] }, { servir: 1 }, { trace: [1, 1, 1, 1] }, { servir: 1 }] },
  glace: { carte: ['#####2#', '#BIII.#', '#######'], q: 1, actions: [{ trace: [1] }, { servir: 2 }] },
  lanterne: { carte: ['###L#1#', '#B....#', '#######'], q: 1, nuit: true, actions: [{ trace: [1, 1, 1, 1] }, { servir: 1 }] },
  chat: { carte: ['###C###', '#B....1', '#######'], q: 2, actions: [{ trace: [1, 1, 1, 1] }, { attendre: 0.6 }, { trace: [3, 3, 3, 3] }, { attendre: 0.4 }, { trace: [1, 1, 1, 1] }] },
  cle: { carte: ['###~#1#', '#BK.P.#', '###~###'], q: 3, actions: [{ trace: [1, 1, 1, 1] }, { servir: 1 }] },
};
let demo = null;
function montrerTuto(cle) {
  const d = DEMOS[cle];
  document.getElementById('titre-tuto').textContent = traduire('tuto.' + cle + '.titre');
  document.getElementById('texte-tuto').textContent = traduire('tuto.' + cle + '.texte');
  const niv = { q: d.q, carte: d.carte, cap: d.cap, nuit: d.nuit };
  demo = { cle, niv, a: analyserNiveau(niv), t: 0, etape: -1, fx: [], croque: {} };
  redemarrerDemo();
  voile('voile-tuto', true);
  document.getElementById('btn-tuto').focus();
}
function redemarrerDemo() {
  demo.e = etatInitial(demo.a);
  demo.ane = { x: demo.e.x, y: demo.e.y, gauche: false, phase: 0 };
  demo.etape = -1; demo.chemin = []; demo.croque = {}; demo.fx = [];
  demo.main = { x: demo.e.x + 0.5, y: demo.e.y + 0.6, appui: false };
  etapeDemoSuivante();
}
function etapeDemoSuivante() {
  demo.etape++;
  const act = DEMOS[demo.cle].actions[demo.etape];
  demo.t = 0;
  if (!act) { demo.phase = { type: 'fin' }; return; }
  if (act.trace) {
    // Pré-calcul des pas
    const moves = []; let e = demo.e;
    act.trace.forEach((d) => { const r = deplacer(demo.a, e, d); if (r) { moves.push(r); e = r.e; } });
    demo.phase = { type: 'trace', moves, n: 0 };
    demo.chemin = [];
  } else if (act.servir) demo.phase = { type: 'servir', type2: act.servir };
  else demo.phase = { type: 'attendre', duree: act.attendre };
}
function majDemo(dt) {
  if (!demo) return;
  const ph = demo.phase;
  demo.t += dt;
  majEffets(demo.fx, dt, demo.s || 30);
  Object.keys(demo.croque).forEach((k) => { demo.croque[k] = Math.max(0, demo.croque[k] - dt); });
  if (ph.type === 'trace') {
    // 1) la main glisse et dessine le chemin ; 2) Grisou marche
    const parCase = 0.35;
    if (!ph.marche) {
      const n = Math.min(ph.moves.length, Math.floor(demo.t / parCase));
      demo.chemin = ph.moves.slice(0, n);
      const fin = n ? ph.moves[n - 1].e : demo.e;
      const vise = ph.moves[Math.min(n, ph.moves.length - 1)].chemin.slice(-1)[0];
      const p = n >= ph.moves.length ? 1 : (demo.t % parCase) / parCase;
      demo.main.x = fin.x + 0.5 + (vise.x - fin.x) * p; demo.main.y = fin.y + 0.6 + (vise.y - fin.y) * p; demo.main.appui = true;
      if (demo.t > parCase * ph.moves.length + 0.3) { ph.marche = true; ph.n = 0; demo.t = 0; demo.main.appui = false; demo.chemin = []; ph.restant = ph.moves.slice(); }
    } else {
      // Marche : un pas après l'autre
      if (!ph.cur && ph.restant.length) { ph.cur = { m: ph.restant.shift(), k: 0, t: 0, dep: { x: demo.ane.x, y: demo.ane.y } }; if (ph.cur.m.d === 3) demo.ane.gauche = true; if (ph.cur.m.d === 1) demo.ane.gauche = false; }
      const c = ph.cur;
      if (c) {
        c.t += dt * (c.m.glisse && c.k > 0 ? 9 : 5);
        const cible = c.m.chemin[c.k], dep = c.k === 0 ? c.dep : c.m.chemin[c.k - 1];
        const p = Math.min(1, c.t);
        demo.ane.x = dep.x + (cible.x - dep.x) * p; demo.ane.y = dep.y + (cible.y - dep.y) * p; demo.ane.phase += dt * 2.4;
        if (c.t >= 1) {
          c.m.evts.filter((ev) => ev.k === c.k).forEach((ev) => {
            const S = demo.s, cx = demo.ox + (ev.x + 0.5) * S, cy = demo.oy + (ev.y + 0.5) * S;
            if (ev.t === 'chat') { demo.croque[ev.i] = 1.2; ajouterEffet(demo.fx, { t: 'vol', x0: demo.ox + (demo.ane.x + 0.5) * S, y0: demo.oy + (demo.ane.y + 0.4) * S, x1: cx, y1: cy, vie: 0.5 }); }
            else if (ev.t === 'lanterne') { ajouterEffet(demo.fx, { t: 'anneau', x: cx, y: cy, vie: 0.6 }); }
            else etincelles(demo.fx, cx, cy, 10, S);
          });
          c.t = 0; c.k++;
          if (c.k >= c.m.chemin.length) { demo.e = c.m.e; ph.cur = null; }
        }
      } else if (demo.t > 0.2) etapeDemoSuivante();
      demo.main.x = demo.ane.x + 0.5; demo.main.y = demo.ane.y + 1.2;
    }
  } else if (ph.type === 'servir') {
    // La main va toucher la bonne friandise en bas de la scène.
    const cible = { x: demo.iconeX(ph.type2), y: demo.iconeY };
    const p = Math.min(1, demo.t / 0.6);
    demo.main.x = demo.main.x + (cible.x - demo.main.x) * p * 0.25; demo.main.y = demo.main.y + (cible.y - demo.main.y) * p * 0.25;
    demo.main.appui = demo.t > 0.6 && demo.t < 0.8;
    if (demo.t > 0.7 && !ph.fait) {
      ph.fait = true;
      const i = porteServableDemo();
      if (i !== null) {
        const p2 = demo.a.portes[i];
        demo.e.sac[ph.type2]--; demo.e.remplies |= 1 << i;
        const S = demo.s; etincelles(demo.fx, demo.ox + (p2.x + 0.5) * S, demo.oy + (p2.y + 0.6) * S, 14, S);
      }
    }
    if (demo.t > 1.3) etapeDemoSuivante();
  } else if (ph.type === 'attendre') {
    if (demo.t > ph.duree) etapeDemoSuivante();
  } else if (ph.type === 'fin') {
    if (demo.t > 1.4) redemarrerDemo();
  }
}
function porteServableDemo() {
  const v = portesVoisines(demo.a, demo.e);
  for (const i of v) if (eclairee(demo.a, demo.e, demo.a.portes[i])) return i;
  return null;
}
function dessinerDemo(temps) {
  const c = document.getElementById('toile-tuto');
  const ctx = c.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0f1736'; ctx.fillRect(0, 0, c.width, c.height);
  const a = demo.a;
  const bas = 120;
  const s = Math.floor(Math.min((c.width - 20) / a.w, (c.height - bas - 10) / a.h));
  demo.s = s; demo.ox = Math.round((c.width - a.w * s) / 2); demo.oy = 10;
  // Icônes des sacoches en bas (coordonnées en cases pour la main)
  const pos = (t) => c.width / 2 + (t - 2) * 150;
  demo.iconeX = (t) => (pos(t) - demo.ox) / s; demo.iconeY = (c.height - bas / 2 + 20 - demo.oy) / s;
  dessinerCarte({ ctx, a, e: demo.e, s, ox: demo.ox, oy: demo.oy, temps, ane: demo.ane, chemin: demo.chemin, fx: demo.fx, croque: demo.croque });
  for (let t = 1; t <= 3; t++) {
    if (!a.besoin[t] && !(demo.cle === 'chat' && t === 1)) continue;
    const x = pos(t), y = c.height - bas / 2;
    ctx.fillStyle = '#6b4426'; rr(ctx, x - 60, y - 40, 120, 80, 16); ctx.fill();
    ctx.strokeStyle = '#9a6a3e'; ctx.lineWidth = 4; ctx.stroke();
    dessinerFriandise(ctx, t, x - 22, y, 30);
    ctx.fillStyle = '#fff'; ctx.font = '800 30px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(traduire('sac.nombre', { n: demo.e.sac[t] }), x + 28, y + 2);
  }
  // La main
  const mx = demo.ox + demo.main.x * s, my = demo.oy + demo.main.y * s;
  ctx.save(); ctx.translate(mx, my); ctx.scale(demo.main.appui ? 0.9 : 1, demo.main.appui ? 0.9 : 1);
  if (demo.main.appui) { ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(0, -8, 26, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#ffe0c4'; ctx.strokeStyle = '#7a4a26'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-6, -10); ctx.lineTo(-6, -40); ctx.quadraticCurveTo(0, -48, 6, -40); ctx.lineTo(6, -16);
  ctx.lineTo(18, -14); ctx.quadraticCurveTo(28, -10, 26, 4); ctx.lineTo(22, 24); ctx.quadraticCurveTo(10, 34, -6, 30); ctx.lineTo(-20, 8);
  ctx.quadraticCurveTo(-24, -2, -14, -2); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

// ===================== Clavier =====================
document.addEventListener('keydown', (ev) => {
  if (ev.repeat && !/^Arrow|Key[WASDZQ]/.test(ev.code)) return;
  const tuto = document.getElementById('voile-tuto').classList.contains('actif');
  if (tuto) { if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); fermerTuto(); } return; }
  const enJeu = document.getElementById('ecran-jeu').classList.contains('actif');
  if (!enJeu || !partie) return;
  if (ev.code === 'Escape' || ev.code === 'KeyP') { ev.preventDefault(); mettrePause(!enPause); return; }
  if (enPause || partie.fini) return;
  const dirs = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, KeyW: 0, KeyD: 1, KeyS: 2, KeyA: 3 };
  // ZQSD (AZERTY) : event.code donne la position de la touche (W→Z, A→Q).
  let d = dirs[ev.code];
  if (d !== undefined) {
    ev.preventDefault(); demarrerAudio();
    // Un appui d'avance au plus pendant que Grisou marche.
    if (partie.file.length > 0) return;
    if (partie.pas + partie.file.length >= partie.budget) { afficherMessage('msg.plusDePas'); return; }
    const base = partie.anim ? partie.anim.m.e : partie.e;
    const r = deplacer(partie.a, base, d);
    if (r) { partie.file.push(r); avancer(); }
    else { sons.vide(); }
    return;
  }
  const m = /^(?:Digit|Numpad)([123])$/.exec(ev.code);
  if (m) { ev.preventDefault(); servir(+m[1]); }
});

// ===================== Boucle d'animation =====================
let dernier = performance.now(), temps = 0;
function boucle(maintenant) {
  const dt = Math.min(0.05, (maintenant - dernier) / 1000); dernier = maintenant;
  if (!enPause) temps += dt;
  const ecran = document.querySelector('.ecran.actif');
  if (ecran && ecran.id === 'ecran-titre') dessinerTitre(temps, enPause ? 0 : dt);
  if (ecran && ecran.id === 'ecran-jeu' && partie) {
    const gele = enPause || !!demo;
    if (!gele) {
      majAnimation(dt);
      majEffets(partie.fx, dt, geo.s);
      Object.keys(partie.croque).forEach((k) => { partie.croque[k] = Math.max(0, partie.croque[k] - dt); });
      Object.values(partie.fxPortes).forEach((f) => { f.secoue = Math.max(0, f.secoue - dt * 2.5); });
    }
    const ctx = ctxJeu;
    const r = toileJeu.getBoundingClientRect();
    if (Math.abs(toileJeu.width - Math.round(r.width * geo.dpr)) > 1 || Math.abs(toileJeu.height - Math.round(r.height * geo.dpr)) > 1) dimensionner();
    ctx.setTransform(geo.dpr, 0, 0, geo.dpr, 0, 0);
    ctx.fillStyle = QUARTIERS[partie.a.niv.q].fond; ctx.fillRect(0, 0, r.width, r.height);
    dessinerCarte({ ctx, a: partie.a, e: partie.e, s: geo.s, ox: geo.ox, oy: geo.oy, temps, ane: partie.ane, chemin: partie.chemin, fx: partie.fx, fxPortes: partie.fxPortes, croque: partie.croque });
    dessinerFlocons(ctx, floconsJeu, r.width, r.height, gele ? 0 : dt, temps);
  }
  if (demo) { if (!enPause) majDemo(dt); dessinerDemo(temps); }
  requestAnimationFrame(boucle);
}
