<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {

  function pluriel(valeur, lang, variables) {

    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }

    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  function changerSurPlace(c) {

  function setLang(code) {

    if (!c) return Promise.resolve(langue);

    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};

  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
'use strict';
/* =====================================================================
   La tournée de l'âne aux pains d'épices — Free Micro Games
   La veille de la Saint-Nicolas, Grisou le petit âne livre pains d'épices,
   clémentines et noix dans les chaussures posées devant les portes.
   ===================================================================== */
const JEU = 'la-tournee-de-l-ane-aux-pains-d-epices';
const traduire = (cle, v) => window.JEL_I18N.t(cle, v);
const nombre = (x) => window.JEL_I18N.nombre(x);

// ===================== Données des niveaux =====================
// Légende des cartes :
//  #  maison (mur)      T  sapin         ~  eau gelée (rivière)   M  étal du marché (décor)
//  W  moulin (décor)   .  ruelle enneigée                        B  boulangerie (départ, recharge)
//  1  porte + chaussure qui veut un pain d'épices
//  2  porte + chaussure qui veut une clémentine
//  3  porte + chaussure qui veut des noix
//  I  verglas (l'âne glisse)   L  lanterne   C  chat gourmand (sur un muret)
//  K  clé de pain d'épices     P  pont fermé (s'ouvre avec une clé)
// q : quartier (0 marché, 1 moulin, 2 rives gelées, 3 colline aux sapins)
// cap : friandises de chaque sorte dans les sacoches (sinon : juste ce qu'il faut)
// nuit : les dessins des chaussures ne se voient qu'à la lumière
// tuto : carte animée montrée à la première arrivée de la mécanique
const NIVEAUX = [
  // ---------- Quartier du marché ----------
  { q: 0, tuto: 'chemin', carte: [
    '#######',
    '###1###',
    '#.....#',
    '#.#M#.#',
    '#.#M#.1',
    '#.....#',
    '###B###'] },
  { q: 0, tuto: 'choix', carte: [
    '#######',
    '#2#1###',
    '#.....#',
    '#.#M#.#',
    '#.#M#.2',
    '#.....#',
    '#1#B..#',
    '#######'] },
  { q: 0, tuto: 'noix', carte: [
    '#3###1#',
    '#.....#',
    '#.#T#.#',
    '#.#2#.#',
    '#...#.#',
    '##.##.3',
    '#1....#',
    '#.#B#.#',
    '#.....#'] },
  { q: 0, cap: 1, tuto: 'sacoche', carte: [
    '##1####',
    '#.....#',
    '#.#M#.1',
    '#.#M#.#',
    '3.....#',
    '###.#.#',
    '#2..B.#',
    '#######'] },
  { q: 0, cap: 2, carte: [
    '#1###2#',
    '#.....#',
    '#.#M#.#',
    '3.#M#.1',
    '#.....#',
    '#.#.#.#',
    '2.#.#.3',
    '#...B.#',
    '###1###'] },
  // ---------- Quartier du moulin ----------
  { q: 1, tuto: 'glace', carte: [
    '#######',
    '##1.2##',
    '#.....#',
    '#I###I#',
    '#I#W#I#',
    '#.#W#.#',
    '#..B.3#',
    '#######'] },

// ===================== Règles (déplacements, lumière, chats, clés) =====================
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // haut, droite, bas, gauche
const LUMIERE = 5; // rayon² éclairé par une lanterne allumée (et par la boulangerie)

function analyserNiveau(niv) {
  const h = niv.carte.length, w = niv.carte[0].length;
  const portes = [], lanternes = [], chats = [], cles = [], ponts = [];
  let depart = null;
  const besoin = [0, 0, 0, 0];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = niv.carte[y][x];
    if (c >= '1' && c <= '3') { portes.push({ x, y, type: +c }); besoin[+c]++; }
    else if (c === 'L') lanternes.push({ x, y });
    else if (c === 'C') chats.push({ x, y });
    else if (c === 'K') cles.push({ x, y });
    else if (c === 'P') ponts.push({ x, y });
    else if (c === 'B') depart = { x, y };
  }
  const cap = [0, 1, 2, 3].map((t) => (t === 0 ? 0 : (niv.cap ? Math.min(niv.cap, besoin[t]) : besoin[t])));
  const a = { niv, w, h, portes, lanternes, chats, cles, ponts, depart, besoin, cap };
  // Côté de chaque porte qui donne sur la rue (pour dessiner la chaussure).
  portes.forEach((p) => {
    p.cote = 2;
    for (let d = 0; d < 4; d++) {
      const c = caseDe(a, p.x + DIRS[d][0], p.y + DIRS[d][1]);
      if ('.BIK'.includes(c)) { p.cote = d; break; }
    }
  });
  return a;
}

function caseDe(a, x, y) { return (x < 0 || y < 0 || x >= a.w || y >= a.h) ? '#' : a.niv.carte[y][x]; }

function etatInitial(a) {
  return { x: a.depart.x, y: a.depart.y, remplies: 0, sac: a.cap.slice(), cles: 0, clesPrises: 0, pontsOuverts: 0, lanternes: 0 };
}
function copier(e) {
  return { x: e.x, y: e.y, remplies: e.remplies, sac: e.sac.slice(), cles: e.cles, clesPrises: e.clesPrises, pontsOuverts: e.pontsOuverts, lanternes: e.lanternes };
}
function praticable(a, e, x, y) {
  const c = caseDe(a, x, y);
  if (c === '.' || c === 'B' || c === 'I' || c === 'K') return true;
  if (c === 'P') { const i = a.ponts.findIndex((p) => p.x === x && p.y === y); return !!(e.pontsOuverts & (1 << i)); }
  return false;
}
// L'âne entre dans une case : clé ramassée, sacoches remplies, lanternes allumées, chats.
function entrer(a, e, evts, k) {
  const c = caseDe(a, e.x, e.y);
  if (c === 'K') {
    const i = a.cles.findIndex((q) => q.x === e.x && q.y === e.y);
    if (!(e.clesPrises & (1 << i))) { e.clesPrises |= 1 << i; e.cles++; evts.push({ t: 'cle', x: e.x, y: e.y, k }); }
  }
  if (c === 'B') {
    let plein = false;
    for (let t = 1; t <= 3; t++) if (e.sac[t] < a.cap[t]) { e.sac[t] = a.cap[t]; plein = true; }
    if (plein) evts.push({ t: 'recharge', x: e.x, y: e.y, k });
  }
  a.lanternes.forEach((l, i) => {
    if (!(e.lanternes & (1 << i)) && Math.abs(l.x - e.x) + Math.abs(l.y - e.y) === 1) { e.lanternes |= 1 << i; evts.push({ t: 'lanterne', x: l.x, y: l.y, i, k }); }
  });
  a.chats.forEach((ch, i) => {
    if (Math.abs(ch.x - e.x) + Math.abs(ch.y - e.y) === 1 && e.sac[1] > 0) { e.sac[1]--; evts.push({ t: 'chat', x: ch.x, y: ch.y, i, k }); }
  });
}
// Un pas dans la direction d (avec glissade éventuelle). null si impossible.
function deplacer(a, e0, d) {
  const [dx, dy] = DIRS[d];
  const e = copier(e0);
  const evts = [], chemin = [];
  const nx = e.x + dx, ny = e.y + dy;
  if (!praticable(a, e, nx, ny)) {
    if (caseDe(a, nx, ny) === 'P' && e.cles > 0) {
      const i = a.ponts.findIndex((p) => p.x === nx && p.y === ny);
      e.cles--; e.pontsOuverts |= 1 << i; evts.push({ t: 'pont', x: nx, y: ny, k: 0 });
    } else return null;
  }
  e.x = nx; e.y = ny; chemin.push({ x: nx, y: ny }); entrer(a, e, evts, 0);
  let glisse = false;
  while (caseDe(a, e.x, e.y) === 'I' && praticable(a, e, e.x + dx, e.y + dy)) {
    e.x += dx; e.y += dy; chemin.push({ x: e.x, y: e.y }); entrer(a, e, evts, chemin.length - 1); glisse = true;
  }
  return { e, chemin, evts, d, glisse };
}
function eclairee(a, e, p) {
  if (!a.niv.nuit) return true;
  const d2 = (o) => (o.x - p.x) ** 2 + (o.y - p.y) ** 2;
  if (d2(a.depart) <= LUMIERE) return true;
  return a.lanternes.some((l, i) => (e.lanternes & (1 << i)) && d2(l) <= LUMIERE);
}
function portesVoisines(a, e) {
  const res = [];
  a.portes.forEach((p, i) => {
    if (!(e.remplies & (1 << i)) && Math.abs(p.x - e.x) + Math.abs(p.y - e.y) === 1) res.push(i);
  });
  return res;
}

// Solveur : nombre de pas du plus court chemin qui remplit toutes les chaussures.
function servirTout(a, e) {
  for (const i of portesVoisines(a, e)) {
    const p = a.portes[i];
    if (eclairee(a, e, p) && e.sac[p.type] > 0) { e.sac[p.type]--; e.remplies |= 1 << i; }
  }
}
function resoudre(a) {
  const tous = (1 << a.portes.length) - 1;
  const cle = (e) => e.x + ',' + e.y + ',' + e.remplies + ',' + e.sac.join('') + ',' + e.cles + ',' + e.clesPrises + ',' + e.pontsOuverts + ',' + e.lanternes;
  const e0 = etatInitial(a); servirTout(a, e0);
  const vus = new Set([cle(e0)]);
  let file = [e0], prof = 0;
  while (file.length && prof < 300) {
    const suite = [];
    for (const e of file) {
      if (e.remplies === tous) return { pas: prof, etats: vus.size };
      for (let d = 0; d < 4; d++) {
        const r = deplacer(a, e, d); if (!r) continue;
        servirTout(a, r.e);
        const k = cle(r.e); if (vus.has(k)) continue;
        vus.add(k); suite.push(r.e);
      }
    }
    file = suite; prof++;
  }
  return { pas: null, etats: vus.size };
}

let prog = nouvelleProgression();
function nouvelleProgression() {
  return { niveau: 1, score: 0, etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), tutos: [], options: { couverture: 'rouge', clochette: 'cuivre' } };
}
function chargerProgression() {
  const p = nouvelleProgression();
  try {
    const d = window.JEL_SAVE ? window.JEL_SAVE.load(JEU) : null;
    if (d) {
      p.niveau = Math.min(NIVEAUX.length, Math.max(1, d.niveau | 0 || 1));
      if (Array.isArray(d.etoiles)) d.etoiles.forEach((v, i) => { if (i < NIVEAUX.length) p.etoiles[i] = Math.max(0, Math.min(3, v | 0)); });
      if (Array.isArray(d.records)) d.records.forEach((v, i) => { if (i < NIVEAUX.length) p.records[i] = Math.max(0, v | 0); });
      if (Array.isArray(d.tutos)) p.tutos = d.tutos.filter((x) => typeof x === 'string').slice(0, 20);
      if (d.options && typeof d.options === 'object') {
        if (COUVERTURES.some((c) => c.id === d.options.couverture)) p.options.couverture = d.options.couverture;
        if (CLOCHETTES.some((c) => c.id === d.options.clochette)) p.options.clochette = d.options.clochette;
        if (typeof d.options.son === 'boolean') p.options.son = d.options.son;
      }
    }
  } catch (e) { /* sauvegarde illisible : valeurs par défaut */ }
  p.score = totalEtoiles(p);
  return p;
}
function totalEtoiles(p) { return (p || prog).etoiles.reduce((s, v) => s + v, 0); }
// Plus haut niveau ouvert (index à partir de 0).
function niveauOuvertMax() {
  let n = 0;
  for (let i = 0; i < NIVEAUX.length; i++) if (prog.etoiles[i] > 0) n = i + 1;
  return Math.min(NIVEAUX.length - 1, Math.max(n, prog.niveau - 1));
}
function sauver(niveau) {
  if (!window.JEL_SAVE) return;
  prog.score = totalEtoiles();
  try {
    window.JEL_SAVE.save(JEU, { niveau, score: prog.score, etoiles: prog.etoiles, records: prog.records, tutos: prog.tutos, options: prog.options });
  } catch (e) { /* stockage refusé */ }
}
function sauvegardeExiste() {
  try { return !!(window.JEL_SAVE && window.JEL_SAVE.existe && window.JEL_SAVE.existe(JEU)); } catch (e) { return false; }
}

function note(f, duree, type, vol, retard, glisseVers) {
  if (!audio || !sonActif) return;
  try {
    const t0 = audio.currentTime + (retard || 0);
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    if (glisseVers) o.frequency.exponentialRampToValueAtTime(glisseVers, t0 + duree);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
    o.connect(g).connect(audio.destination);
    o.start(t0); o.stop(t0 + duree + 0.05);
  } catch (e) { /* son impossible */ }
}

  if (!audio || !sonActif) return;
  try {
    const t0 = audio.currentTime + (retard || 0);
    const n = Math.floor(audio.sampleRate * duree);
    const buf = audio.createBuffer(1, n, audio.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);

    const g = audio.createGain(); g.gain.value = vol || 0.12;
    s.connect(f).connect(g).connect(audio.destination);
    s.start(t0);
  } catch (e) { /* son impossible */ }
}

function dessinerFriandise(ctx, type, cx, cy, r) {

        for (let j = 0; j < 3; j++) {
          ctx.fillStyle = j % 2 ? '#2e7d4a' : '#256b3e';
          ctx.beginPath(); ctx.moveTo(px + s * 0.5, py + s * (0.05 + j * 0.2)); ctx.lineTo(px + s * (0.15 + j * 0.0), py + s * (0.45 + j * 0.2)); ctx.lineTo(px + s * 0.85, py + s * (0.45 + j * 0.2)); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(px + s * 0.5, py + s * (0.12 + j * 0.2), s * 0.12, s * 0.04, 0, 0, 7); ctx.fill();
        }
        ctx.fillStyle = '#6b4426'; ctx.fillRect(px + s * 0.45, py + s * 0.85, s * 0.1, s * 0.12);
      } else if (c === 'M') {
        ctx.fillStyle = '#8a5a2e'; ctx.fillRect(px + s * 0.1, py + s * 0.45, s * 0.8, s * 0.4);
        for (let j = 0; j < 4; j++) { ctx.fillStyle = j % 2 ? '#fff' : '#c8323c'; ctx.fillRect(px + s * (0.08 + j * 0.21), py + s * 0.1, s * 0.21, s * 0.22); }
        ctx.fillStyle = '#6b4426'; ctx.fillRect(px + s * 0.12, py + s * 0.3, s * 0.05, s * 0.2); ctx.fillRect(px + s * 0.83, py + s * 0.3, s * 0.05, s * 0.2);
        for (let j = 0; j < 3; j++) dessinerFriandise(ctx, j === 1 ? 1 : 2, px + s * (0.28 + j * 0.22), py + s * 0.52, s * 0.11);
      } else if (c === 'W') {
        ctx.fillStyle = '#d9c3a0'; ctx.beginPath(); ctx.moveTo(px + s * 0.3, py + s * 0.95); ctx.lineTo(px + s * 0.38, py + s * 0.3); ctx.lineTo(px + s * 0.62, py + s * 0.3); ctx.lineTo(px + s * 0.7, py + s * 0.95); ctx.fill();
        ctx.fillStyle = '#6b4a32'; ctx.beginPath(); ctx.moveTo(px + s * 0.32, py + s * 0.32); ctx.lineTo(px + s * 0.5, py + s * 0.12); ctx.lineTo(px + s * 0.68, py + s * 0.32); ctx.fill();
        ctx.save(); ctx.translate(px + s * 0.5, py + s * 0.35); ctx.rotate(temps * 0.6 + x);
        ctx.fillStyle = '#f3ead8'; ctx.strokeStyle = '#6b4a32'; ctx.lineWidth = s * 0.02;
        for (let j = 0; j < 4; j++) { ctx.rotate(Math.PI / 2); ctx.fillRect(-s * 0.04, -s * 0.42, s * 0.08, s * 0.34); ctx.strokeRect(-s * 0.04, -s * 0.42, s * 0.08, s * 0.34); }
        ctx.restore();
      } else if (c === 'B') {
        ctx.fillStyle = '#f7e4c4'; rr(ctx, px + s * 0.06, py + s * 0.06, s * 0.88, s * 0.88, s * 0.12); ctx.fill();
        for (let j = 0; j < 5; j++) { ctx.fillStyle = j % 2 ? '#fff' : '#c8323c'; ctx.fillRect(px + s * (0.06 + j * 0.176), py + s * 0.04, s * 0.176, s * 0.18); }
        ctx.fillStyle = '#e8b866'; ctx.beginPath(); ctx.ellipse(px + s * 0.22, py + s * 0.82, s * 0.12, s * 0.07, 0, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(px + s * 0.78, py + s * 0.82, s * 0.12, s * 0.07, 0, 0, 7); ctx.fill();
      } else if (c === 'K') {
        const i = a.cles.findIndex((k) => k.x === x && k.y === y);
        if (!(e.clesPrises & (1 << i))) {
          ctx.fillStyle = 'rgba(255,220,120,.45)'; ctx.beginPath(); ctx.arc(px + s / 2, py + s / 2, s * 0.36, 0, 7); ctx.fill();
          dessinerCle(ctx, px + s / 2, py + s / 2 + Math.sin(temps * 3) * s * 0.05, s * 0.32);
        }
      }
    }
  }
  // Portes et chaussures
  a.portes.forEach((p) => {
    const px = ox + p.x * s, py = oy + p.y * s;
    const [dx, dy] = DIRS[p.cote];
    ctx.fillStyle = '#6b3d1e';
    const cxp = px + s / 2 + dx * s * 0.28, cyp = py + s / 2 + dy * s * 0.28;
    if (dx === 0) { rr(ctx, cxp - s * 0.17, cyp - s * 0.2, s * 0.34, s * 0.4, s * 0.12); }
    else { rr(ctx, cxp - s * 0.2, cyp - s * 0.17, s * 0.4, s * 0.34, s * 0.12); }
    ctx.fill();
    ctx.fillStyle = '#2f7d3a'; ctx.beginPath(); ctx.arc(px + s / 2 - dx * s * 0.05, py + s / 2 - dy * s * 0.05, s * 0.1, 0, 7); ctx.fill();
    ctx.fillStyle = '#c8323c'; ctx.fillRect(px + s / 2 - dx * s * 0.05 - s * 0.03, py + s / 2 - dy * s * 0.05 + s * 0.06, s * 0.06, s * 0.04);
  });
  // Lanternes et chats (sur les murets)
  a.lanternes.forEach((l, i) => dessinerLanterne(ctx, ox + (l.x + 0.5) * s, oy + (l.y + 0.5) * s, s, !!(e.lanternes & (1 << i)), temps));
  a.chats.forEach((ch, i) => dessinerChat(ctx, ox + (ch.x + 0.5) * s, oy + (ch.y + 0.55) * s, s, temps + i * 1.7, (v.croque && v.croque[i]) || 0));
  // Chemin tracé
  if (v.chemin && v.chemin.length) dessinerChemin(v);
  // Grisou
  const an = v.ane || { x: e.x, y: e.y, gauche: false, phase: 0 };
  dessinerAne(ctx, ox + (an.x + 0.5) * s, oy + (an.y + 0.52) * s, s * 0.95, an.gauche, an.phase);
  // Nuit : obscurité trouée par les lumières
  if (nuit) dessinerNuit(v, an);
  // Chaussures et bulles (au-dessus de la nuit : on voit qu'il y a une chaussure)
  a.portes.forEach((p, i) => {
    const plein = !!(e.remplies & (1 << i));
    const [dx, dy] = DIRS[p.cote];
    const sx = ox + (p.x + 0.5 + dx * 0.36) * s, sy = oy + (p.y + 0.5 + dy * 0.36) * s;
    const fxp = v.fxPortes && v.fxPortes[i];
    let dec = 0;
    if (fxp && fxp.secoue > 0) dec = Math.sin(temps * 50) * s * 0.06 * fxp.secoue;
    dessinerSabot(ctx, sx + dec, sy + s * 0.08, s * 0.3, plein, p.type);
    if (!plein) {
      const vue = eclairee(a, e, p);
      const bx = ox + (p.x + 0.5 - dx * 0.12) * s + dec, by = oy + (p.y + 0.5 - dy * 0.12) * s - s * 0.08 + Math.sin(temps * 2.5 + i) * s * 0.03;
      ctx.fillStyle = vue ? 'rgba(255,255,255,.95)' : 'rgba(120,130,170,.85)';
      ctx.strokeStyle = vue ? '#f4c55a' : '#59618a'; ctx.lineWidth = s * 0.03;
      ctx.beginPath(); ctx.arc(bx, by, s * 0.25, 0, 7); ctx.fill(); ctx.stroke();
      if (vue) dessinerFriandise(ctx, p.type, bx, by, s * 0.19);
      else { ctx.fillStyle = '#d8dcf0'; for (let j = -1; j <= 1; j++) { ctx.beginPath(); ctx.arc(bx + j * s * 0.08, by, s * 0.03, 0, 7); ctx.fill(); } }
    } else {
      ctx.fillStyle = 'rgba(255,230,120,' + (0.35 + 0.25 * Math.sin(temps * 4 + i)) + ')';
      etoileChemin(ctx, sx + s * 0.2, sy - s * 0.15, s * 0.08); ctx.fill();
    }
  });
  // Effets
  if (v.fx) dessinerEffets(v);
}

function dessinerChemin(v) {
  const { ctx, s, ox, oy } = v;
  let px = v.e.x, py = v.e.y;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  v.chemin.forEach((m, i) => {
    ctx.strokeStyle = m.glisse ? 'rgba(80,180,255,.95)' : 'rgba(200,50,60,.9)';
    ctx.lineWidth = s * 0.12; ctx.setLineDash(m.glisse ? [s * 0.08, s * 0.12] : [s * 0.02, s * 0.2]);
    ctx.beginPath(); ctx.moveTo(ox + (px + 0.5) * s, oy + (py + 0.5) * s);
    m.chemin.forEach((c) => ctx.lineTo(ox + (c.x + 0.5) * s, oy + (c.y + 0.5) * s));
    ctx.stroke();
    const fin = m.chemin[m.chemin.length - 1];
    px = fin.x; py = fin.y;
    if (i === v.chemin.length - 1) {
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(200,50,60,.85)'; ctx.beginPath(); ctx.arc(ox + (px + 0.5) * s, oy + (py + 0.5) * s, s * 0.14, 0, 7); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = s * 0.04; ctx.stroke();
    }
  });
  ctx.setLineDash([]);
}

const toilesNuit = new WeakMap(); // un calque d'obscurité par canvas (jeu, tutoriel)
function dessinerNuit(v, an) {
  const { ctx, a, e, s, ox, oy } = v;
  const W = ctx.canvas.width, H = ctx.canvas.height;
  let toileNuit = toilesNuit.get(ctx.canvas);
  if (!toileNuit) { toileNuit = document.createElement('canvas'); toilesNuit.set(ctx.canvas, toileNuit); }
  if (toileNuit.width !== W || toileNuit.height !== H) { toileNuit.width = W; toileNuit.height = H; }
  const n = toileNuit.getContext('2d');
  n.setTransform(1, 0, 0, 1, 0, 0);
  n.globalCompositeOperation = 'source-over';
  n.clearRect(0, 0, W, H);
  n.setTransform(ctx.getTransform());
  n.fillStyle = 'rgba(8,12,38,.86)';
  n.fillRect(ox - s, oy - s, a.w * s + 2 * s, a.h * s + 2 * s);
  n.globalCompositeOperation = 'destination-out';
  const trou = (x, y, r) => {
    const g = n.createRadialGradient(x, y, r * 0.2, x, y, r);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.7, 'rgba(0,0,0,.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    n.fillStyle = g; n.beginPath(); n.arc(x, y, r, 0, 7); n.fill();
  };
  trou(ox + (a.depart.x + 0.5) * s, oy + (a.depart.y + 0.5) * s, s * 2.6);
  a.lanternes.forEach((l, i) => { if (e.lanternes & (1 << i)) trou(ox + (l.x + 0.5) * s, oy + (l.y + 0.5) * s, s * 2.7); });
  trou(ox + (an.x + 0.5) * s, oy + (an.y + 0.5) * s, s * 1.25);
  if (v.fx) v.fx.forEach((f) => { if (f.t === 'halo') trou(f.x, f.y, s * 2.7 * Math.min(1, f.age / 0.5)); });
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(toileNuit, 0, 0); ctx.restore();
  // Petites flammes des lanternes allumées par-dessus la nuit
  a.lanternes.forEach((l, i) => {
    if (!(e.lanternes & (1 << i))) {
      ctx.fillStyle = 'rgba(150,160,200,.5)'; ctx.beginPath(); ctx.arc(ox + (l.x + 0.5) * s, oy + (l.y + 0.42) * s, s * 0.09, 0, 7); ctx.fill();
    } else dessinerLanterne(ctx, ox + (l.x + 0.5) * s, oy + (l.y + 0.5) * s, s, true, v.temps);
  });
}

// ===================== Effets (particules) =====================
function ajouterEffet(fx, f) { f.age = 0; fx.push(f); }
function confettis(fx, x, y, n, s) {
  const couleurs = ['#f4c55a', '#c8323c', '#ffffff', '#f07a12', '#2e9b55'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.6 + Math.random()) * s * 3;
    ajouterEffet(fx, { t: 'confetti', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - s * 2, c: couleurs[i % couleurs.length], vie: 1.2 + Math.random() * 0.6, r: Math.random() * 6 });
  }
}
function etincelles(fx, x, y, n, s, c) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.4 + Math.random()) * s * 1.8;
    ajouterEffet(fx, { t: 'etincelle', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, c: c || '#ffe38a', vie: 0.7 + Math.random() * 0.4 });
  }
}
function majEffets(fx, dt, s) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.age += dt;
    if (f.vx !== undefined) { f.x += f.vx * dt; f.y += f.vy * dt; if (f.t === 'confetti') f.vy += s * 6 * dt; else { f.vx *= 0.92; f.vy *= 0.92; } }
    if (f.age > (f.vie || 1)) fx.splice(i, 1);
  }
}
function dessinerEffets(v) {
  const { ctx, s } = v;
  v.fx.forEach((f) => {
    const k = 1 - f.age / (f.vie || 1);
    ctx.globalAlpha = Math.max(0, Math.min(1, k * 1.5));
    if (f.t === 'confetti') { ctx.fillStyle = f.c; ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.age * 8 + f.r); ctx.fillRect(-s * 0.06, -s * 0.03, s * 0.12, s * 0.06); ctx.restore(); }
    else if (f.t === 'etincelle') { ctx.fillStyle = f.c; etoileChemin(ctx, f.x, f.y, s * 0.09 * (0.5 + k)); ctx.fill(); }
    else if (f.t === 'texte') {
      ctx.fillStyle = f.c || '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 4;
      ctx.font = '800 ' + Math.round(s * 0.36) + 'px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.strokeText(f.txt, f.x, f.y - f.age * s); ctx.fillText(f.txt, f.x, f.y - f.age * s);
    } else if (f.t === 'saut') {
      const p = Math.min(1, f.age / f.vie);
      const x = f.x0 + (f.x1 - f.x0) * p, y = f.y0 + (f.y1 - f.y0) * p - Math.sin(p * Math.PI) * s * 0.9;
      ctx.globalAlpha = 1; dessinerFriandise(ctx, f.type, x, y, s * 0.24);
    } else if (f.t === 'vol') {
      const p = Math.min(1, f.age / f.vie);
      const x = f.x0 + (f.x1 - f.x0) * p, y = f.y0 + (f.y1 - f.y0) * p - Math.sin(p * Math.PI) * s * 0.6;
      ctx.globalAlpha = 1; dessinerFriandise(ctx, 1, x, y, s * 0.2);
    } else if (f.t === 'anneau') {
      ctx.strokeStyle = f.c || '#ffe38a'; ctx.lineWidth = s * 0.06;
      ctx.beginPath(); ctx.arc(f.x, f.y, s * (0.2 + f.age * 1.4), 0, 7); ctx.stroke();
    }
  });
  ctx.globalAlpha = 1;
}

// Flocons qui tombent (titre et jeu)
function creerFlocons(n) { return Array.from({ length: n }, () => ({ x: Math.random(), y: Math.random(), r: 0.6 + Math.random() * 1.8, v: 0.02 + Math.random() * 0.05, p: Math.random() * 6 })); }
function dessinerFlocons(ctx, flocons, w, h, dt, temps) {
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  flocons.forEach((f) => {
    f.y += f.v * dt; if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); }
    const x = (f.x + Math.sin(temps * 0.8 + f.p) * 0.01) * w;
    ctx.beginPath(); ctx.arc(x, f.y * h, f.r * (w > 500 ? 1.5 : 1.1), 0, 7); ctx.fill();
  });
}

// ===================== Écran titre : le village la veille de la fête =====================
const toileTitre = document.getElementById('toile-titre');
const floconsTitre = creerFlocons(90);
function dessinerTitre(temps, dt) {
  const r = toileTitre.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
  if (!W || !H) return;
  if (toileTitre.width !== W || toileTitre.height !== H) { toileTitre.width = W; toileTitre.height = H; }
  const ctx = toileTitre.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = r.width, h = r.height;
  const ciel = ctx.createLinearGradient(0, 0, 0, h);
  ciel.addColorStop(0, '#0f1640'); ciel.addColorStop(0.55, '#3a3478'); ciel.addColorStop(1, '#6a4d8c');
  ctx.fillStyle = ciel; ctx.fillRect(0, 0, w, h);
  // Étoiles et lune
  for (let i = 0; i < 40; i++) {
    const a = 0.4 + 0.6 * Math.abs(Math.sin(temps * 1.3 + i));
    ctx.fillStyle = 'rgba(255,250,220,' + a + ')';
    ctx.beginPath(); ctx.arc(hash(i, 1) * w, hash(i, 2) * h * 0.45, 1 + hash(i, 3) * 1.4, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#fff4c8'; ctx.beginPath(); ctx.arc(w * 0.82, h * 0.3, Math.min(w, h) * 0.06, 0, 7); ctx.fill();
  ctx.fillStyle = '#3a3478'; ctx.beginPath(); ctx.arc(w * 0.84, h * 0.29, Math.min(w, h) * 0.055, 0, 7); ctx.fill();
  // Maisons du fond
  const sol = h * 0.52;
  const u = Math.min(w / 6.2, h / 8.5);
  const maisons = [
    { x: 0.02, l: 1.3, hh: 1.6, c: '#d98c5f' }, { x: 0.2, l: 1.1, hh: 2.0, c: '#e7cf9f' }, { x: 0.38, l: 1.4, hh: 1.5, c: '#9fb8d6' },
    { x: 0.6, l: 1.2, hh: 1.9, c: '#c9a3c9' }, { x: 0.79, l: 1.3, hh: 1.6, c: '#d98c5f' },
  ];
  maisons.forEach((m, i) => {
    const mx = m.x * w, mw = m.l * u, mh = m.hh * u, my = sol - mh;
    ctx.fillStyle = m.c; ctx.fillRect(mx, my, mw, mh);
    ctx.fillStyle = '#7a3a2e'; ctx.beginPath(); ctx.moveTo(mx - u * 0.1, my); ctx.lineTo(mx + mw / 2, my - u * 0.6); ctx.lineTo(mx + mw + u * 0.1, my); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(mx - u * 0.12, my + 2); ctx.lineTo(mx + mw / 2, my - u * 0.62); ctx.lineTo(mx + mw + u * 0.12, my + 2); ctx.lineTo(mx + mw / 2, my - u * 0.46); ctx.fill();
    ctx.fillStyle = '#ffd877';
    ctx.fillRect(mx + mw * 0.18, my + mh * 0.18, mw * 0.24, mh * 0.2); ctx.fillRect(mx + mw * 0.58, my + mh * 0.18, mw * 0.24, mh * 0.2);
    ctx.fillStyle = '#6b3d1e'; rr(ctx, mx + mw * 0.38, sol - mh * 0.42, mw * 0.24, mh * 0.42, u * 0.08); ctx.fill();
    // Chaussure devant la porte, avec ce que l'enfant aime
    dessinerSabot(ctx, mx + mw * 0.5, sol + u * 0.12, u * 0.22, i % 2 === 0, (i % 3) + 1);
    if (i % 2) {
      ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.beginPath(); ctx.arc(mx + mw * 0.5, sol - mh * 0.62, u * 0.2, 0, 7); ctx.fill();
      dessinerFriandise(ctx, (i % 3) + 1, mx + mw * 0.5, sol - mh * 0.62, u * 0.15);
    }
  });
  // Guirlande d'étoiles dorées entre les maisons
  ctx.strokeStyle = 'rgba(255,230,150,.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, sol - u * 1.9); ctx.quadraticCurveTo(w / 2, sol - u * 1.2, w, sol - u * 1.9); ctx.stroke();
  for (let i = 1; i < 9; i++) {
    const t = i / 9, x = t * w, y = (1 - t) * (1 - t) * (sol - u * 1.9) + 2 * (1 - t) * t * (sol - u * 1.2) + t * t * (sol - u * 1.9);
    ctx.fillStyle = i % 2 ? '#f4c55a' : '#ff7a6a'; etoileChemin(ctx, x, y + 6, 5 + Math.sin(temps * 3 + i) * 1.2); ctx.fill();
  }
  // Sol enneigé
  ctx.fillStyle = '#eef4fb'; ctx.beginPath(); ctx.moveTo(0, sol); ctx.quadraticCurveTo(w * 0.5, sol - u * 0.15, w, sol); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.fill();
  ctx.fillStyle = '#d6e3f2';
  for (let i = 0; i < 14; i++) { ctx.beginPath(); ctx.ellipse(hash(i, 9) * w, sol + (0.1 + hash(i, 8) * 0.3) * (h - sol), 12, 3, 0, 0, 7); ctx.fill(); }
  // Lanterne allumée
  const lx = w * 0.12, ly = sol + u * 0.1;
  const halo = ctx.createRadialGradient(lx, ly - u * 0.9, 2, lx, ly - u * 0.9, u * 1.4);
  halo.addColorStop(0, 'rgba(255,214,120,.55)'); halo.addColorStop(1, 'rgba(255,214,120,0)');
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(lx, ly - u * 0.9, u * 1.4, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(lx, ly - u * 0.9); dessinerLanterne(ctx, 0, 0, u * 1.6, true, temps); ctx.restore();
  ctx.strokeStyle = '#2a2a33'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(lx, ly - u * 0.25); ctx.lineTo(lx, ly + u * 0.4); ctx.stroke();
  // Grisou au premier plan, avec ses sacoches
  const ax = w * 0.52, ay = sol + u * 0.95;
  const marche = (temps * 0.9) % 1;
  dessinerAne(ctx, ax, ay, Math.min(w * 0.5, u * 2.6), false, marche);
  // Friandises qui débordent autour
  dessinerFriandise(ctx, 1, ax - u * 1.5, ay + u * 0.55, u * 0.3);
  dessinerFriandise(ctx, 2, ax + u * 1.45, ay + u * 0.6, u * 0.26);
  dessinerFriandise(ctx, 3, ax + u * 1.9, ay + u * 0.3, u * 0.2);
  dessinerFlocons(ctx, floconsTitre, w, h, dt, temps);
}

// ===================== Écrans =====================
function montrer(id) {
  document.querySelectorAll('.ecran').forEach((e) => e.classList.toggle('actif', e.id === id));
}
function voile(id, actif) { document.getElementById(id).classList.toggle('actif', !!actif); }

// Icônes des boutons (petits canvas)
function peindreIcones() {

    const k = c.dataset.icone, m = c.width / 2;

function objetsDebloques(avant, apres) {

}

// ===================== Partie =====================
const toileJeu = document.getElementById('toile-jeu');
const ctxJeu = toileJeu.getContext('2d');
const floconsJeu = creerFlocons(40);
let partie = null;   // état du niveau en cours
let enPause = false;
let messageCle = null;

function budgetDe(par) { return par + Math.max(6, Math.ceil(par * 0.6)); }
function etoilesPour(pas, par) {
  if (pas <= par + 1) return 3;
  if (pas <= par + Math.max(3, Math.ceil(par * 0.25))) return 2;
  return 1;
}

// Tournée parfaite de chaque niveau (plus court chemin), calculée par resoudre()
// pendant la fabrication et gardée ici pour ne pas la recalculer sur le téléphone.
const PARS = [8, 12, 18, 21, 18, 9, 8, 15, 14, 21, 25, 14, 25, 19, 19, 13, 28, 17, 24, 31];
const parCache = {};
function parDe(i) {
  if (parCache[i] === undefined && PARS[i]) parCache[i] = PARS[i];
  if (parCache[i] === undefined) {
    const r = resoudre(analyserNiveau(NIVEAUX[i]));
    parCache[i] = r.pas === null ? 40 : r.pas;
  }
  return parCache[i];
}

function lancerNiveau(i) {
  demarrerAudio();
  voile('voile-fin', false); voile('voile-pause', false); voile('voile-bilan', false);
  enPause = false;
  const a = analyserNiveau(NIVEAUX[i]);
  const par = parDe(i);
  partie = {
    idx: i, a, e: etatInitial(a), pas: 0, par, budget: budgetDe(par), erreurs: 0,
    chemin: [], file: [], anim: null, fini: false, fx: [], fxPortes: {}, croque: {},
    ane: { x: a.depart.x, y: a.depart.y, gauche: false, phase: 0 }, trace: null,
  };
  prog.niveau = i + 1;
  montrer('ecran-jeu');
  majHud();
  dimensionner();
  afficherMessage('msg.debut');
  sons.clochette();
  // Carte animée à la première arrivée d'une mécanique
  const tuto = NIVEAUX[i].tuto;
  if (tuto && !prog.tutos.includes(tuto)) montrerTuto(tuto);
}

function majHud() {

  document.getElementById('compteur-pas').setAttribute('aria-label', traduire('hud.pas', { n: reste }));
  const remplies = a.portes.filter((p, i) => e.remplies & (1 << i)).length;
  document.getElementById('chaussures').textContent = traduire('hud.chaussuresCourt', { n: remplies, total: a.portes.length });
  document.getElementById('compteur-chaussures').setAttribute('aria-label', traduire('hud.chaussures', { n: remplies, total: a.portes.length }));
  const pret = porteServable();
  document.querySelectorAll('.sacoche').forEach((b) => {

    b.classList.toggle('vide', e.sac[t] === 0);

    b.setAttribute('aria-label', traduire('sac.aria', { nom: traduire('friandise.' + t), n: e.sac[t] }));
  });
  const cles = document.getElementById('cles');
  cles.classList.toggle('cache', a.cles.length === 0);
  cles.querySelector('span').textContent = traduire('sac.nombre', { n: e.cles });
  cles.setAttribute('aria-label', traduire('hud.cles', { n: e.cles }));

function afficherMessage(cle, vars) {

}

// Porte voisine éclairée et vide (index) ou null.
function porteServable() {
  if (!partie) return null;
  const v = portesVoisines(partie.a, partie.e);
  for (const i of v) if (eclairee(partie.a, partie.e, partie.a.portes[i])) return i;
  return null;
}

// ----- Taille de la carte -----
let geo = { s: 40, ox: 0, oy: 0, dpr: 1 };
function dimensionner() {
  const zone = document.getElementById('zone-carte');
  const r = zone.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  toileJeu.width = Math.max(1, Math.round(r.width * dpr)); toileJeu.height = Math.max(1, Math.round(r.height * dpr));
  if (!partie) return;
  const a = partie.a;
  const s = Math.floor(Math.min((r.width - 12) / a.w, (r.height - 12) / a.h, 92));
  geo = { s, ox: Math.round((r.width - a.w * s) / 2), oy: Math.round((r.height - a.h * s) / 2), dpr };
}
window.addEventListener('resize', () => { dimensionner(); });

// ----- Tracé du chemin au doigt (ou à la souris) -----
function caseSous(ev) {
  const r = toileJeu.getBoundingClientRect();
  const x = Math.floor((ev.clientX - r.left - geo.ox) / geo.s), y = Math.floor((ev.clientY - r.top - geo.oy) / geo.s);
  return { x, y };
}
function finDuChemin() {
  const c = partie.chemin;
  return c.length ? c[c.length - 1].e : partie.e;
}
// Prolonge le chemin vers la case visée (pas à pas, axe dominant d'abord).
function prolongerVers(cx, cy) {
  let garde = 0;
  while (garde++ < 30) {
    const fin = finDuChemin();
    if (fin.x === cx && fin.y === cy) return;
    const c = partie.chemin;
    // Retour en arrière : la case visée est une étape déjà tracée → on efface ce qui suit.
    if (partie.e.x === cx && partie.e.y === cy) { c.length = 0; return; }
    for (let j = c.length - 2; j >= 0; j--) {
      if (c[j].e.x === cx && c[j].e.y === cy) { c.length = j + 1; return; }
    }
    // Case traversée pendant une glissade : rien à faire.
    if (c.some((m) => m.chemin.some((q) => q.x === cx && q.y === cy))) return;
    const ddx = cx - fin.x, ddy = cy - fin.y;
    const essais = Math.abs(ddx) >= Math.abs(ddy)
      ? [ddx > 0 ? 1 : 3, ddy !== 0 ? (ddy > 0 ? 2 : 0) : -1]
      : [ddy > 0 ? 2 : 0, ddx !== 0 ? (ddx > 0 ? 1 : 3) : -1];
    let fait = false;
    for (const d of essais) {
      if (d < 0) continue;
      if (partie.pas + c.length >= partie.budget) { afficherMessage('msg.plusDePas'); return; }
      const r = deplacer(partie.a, fin, d);
      if (r) { c.push(r); fait = true; break; }
    }
    if (!fait) return;
  }
}
toileJeu.addEventListener('pointerdown', (ev) => {
  if (!partie || partie.fini || enPause || partie.anim) return;
  demarrerAudio();
  ev.preventDefault();
  try { toileJeu.setPointerCapture(ev.pointerId); } catch (e) { /* rien */ }
  partie.trace = ev.pointerId;
  partie.chemin = [];
  const c = caseSous(ev);
  if (!(c.x === partie.e.x && c.y === partie.e.y)) prolongerVers(c.x, c.y);
});
toileJeu.addEventListener('pointermove', (ev) => {
  if (!partie || partie.trace !== ev.pointerId) return;
  const c = caseSous(ev);
  prolongerVers(c.x, c.y);
});
function finTrace(ev) {
  if (!partie || partie.trace !== ev.pointerId) return;
  partie.trace = null;
  if (partie.chemin.length) { partie.file = partie.chemin.slice(); partie.chemin = []; avancer(); }
}
toileJeu.addEventListener('pointerup', finTrace);
toileJeu.addEventListener('pointercancel', finTrace);

// ----- Exécution des pas -----
function avancer() {
  if (!partie || partie.anim || !partie.file.length) return;
  const m = partie.file.shift();
  partie.pas++;
  partie.anim = { m, k: 0, t: 0, depart: { x: partie.ane.x, y: partie.ane.y } };
  if (m.d === 1) partie.ane.gauche = false; else if (m.d === 3) partie.ane.gauche = true;
  if (m.glisse) { sons.glisse(); afficherMessage('msg.glisse'); }
  else sons.pas();
  m.evts.filter((ev) => ev.t === 'pont').forEach((ev) => evenement(ev));
  majHud();
}
function evenement(ev) {
  const { s, ox, oy } = geo;
  const cx = ox + (ev.x + 0.5) * s, cy = oy + (ev.y + 0.5) * s;
  if (ev.t === 'cle') { sons.cle(); etincelles(partie.fx, cx, cy, 14, s, '#ffd27a'); afficherMessage('msg.cle'); }
  else if (ev.t === 'pont') { sons.pont(); etincelles(partie.fx, cx, cy, 16, s, '#e8b866'); afficherMessage('msg.pont'); }
  else if (ev.t === 'recharge') { sons.recharge(); etincelles(partie.fx, cx, cy, 18, s, '#fff2b0'); afficherMessage('msg.recharge'); }
  else if (ev.t === 'lanterne') { sons.lanterne(); ajouterEffet(partie.fx, { t: 'halo', x: cx, y: cy, vie: 0.5 }); ajouterEffet(partie.fx, { t: 'anneau', x: cx, y: cy, vie: 0.6 }); afficherMessage('msg.lanterne'); }
  else if (ev.t === 'chat') {
    sons.chat(); partie.croque[ev.i] = 1.2;
    const an = partie.ane;
    ajouterEffet(partie.fx, { t: 'vol', x0: ox + (an.x + 0.5) * s, y0: oy + (an.y + 0.4) * s, x1: cx, y1: cy, vie: 0.5 });
    ajouterEffet(partie.fx, { t: 'texte', txt: traduire('fx.chat'), x: cx, y: cy - s * 0.3, c: '#ffd0d0', vie: 1.1 });
    afficherMessage('msg.chat');
    const b = document.querySelector('.sacoche[data-type="1"]'); b.classList.remove('secoue'); void b.offsetWidth; b.classList.add('secoue');
  }
}
function majAnimation(dt) {
  const an = partie.anim;
  if (!an) return;
  const vitesse = an.m.glisse && an.k > 0 ? 11 : 6.5;
  an.t += dt * vitesse;
  const cible = an.m.chemin[an.k];
  const dep = an.k === 0 ? an.depart : an.m.chemin[an.k - 1];
  const p = Math.min(1, an.t);
  partie.ane.x = dep.x + (cible.x - dep.x) * p;
  partie.ane.y = dep.y + (cible.y - dep.y) * p;
  if (!(an.m.glisse && an.k > 0)) partie.ane.phase += dt * 2.4;
  if (an.t >= 1) {
    an.m.evts.filter((ev) => ev.k === an.k && ev.t !== 'pont').forEach((ev) => evenement(ev));
    an.t = 0; an.k++;
    if (an.k >= an.m.chemin.length) {
      partie.e = an.m.e;
      partie.ane.x = partie.e.x; partie.ane.y = partie.e.y;
      partie.anim = null;
      if (partie.file.length) avancer();
      else apresDeplacement();
      majHud();
    }
  }
}
function apresDeplacement() {
  const i = porteServable();
  const voisines = portesVoisines(partie.a, partie.e);
  if (i !== null) { afficherMessage('msg.servir'); sons.clochette(); }
  else if (voisines.length) afficherMessage('msg.noir');
  verifierFatigue();
}
// Plus de pas : défaite, sauf si les dernières chaussures peuvent encore être servies sur place.
function verifierFatigue() {
  if (partie.fini || partie.budget - partie.pas > 0) return;
  const { a, e } = partie;
  const restantes = a.portes.map((p, i) => i).filter((i) => !(e.remplies & (1 << i)));
  const surPlace = restantes.every((i) => {
    const p = a.portes[i];
    return Math.abs(p.x - e.x) + Math.abs(p.y - e.y) === 1 && eclairee(a, e, p) && e.sac[p.type] > 0;
  });
  if (!surPlace || partie.budget - partie.pas < 0) { partie.fini = true; setTimeout(perdre, 700); }
}

// ----- Déposer une friandise -----
function servir(type) {
  if (!partie || partie.fini || enPause || partie.anim) return;
  demarrerAudio();
  const { a, e, s } = partie;
  const bouton = document.querySelector('.sacoche[data-type="' + type + '"]');
  const secouer = (el) => { el.classList.remove('secoue'); void el.offsetWidth; el.classList.add('secoue'); };
  const voisines = portesVoisines(a, e);
  const i = porteServable();
  if (i === null) {
    sons.vide(); secouer(bouton);
    afficherMessage(voisines.length ? 'msg.noir' : 'msg.approche');
    return;
  }
  const p = a.portes[i];
  if (e.sac[type] <= 0) { sons.vide(); secouer(bouton); afficherMessage('msg.sacVide', { nom: traduire('friandise.' + type) }); return; }
  const { ox, oy } = geo, S = geo.s;
  const [dx, dy] = DIRS[p.cote];
  const sx = ox + (p.x + 0.5 + dx * 0.36) * S, sy = oy + (p.y + 0.5 + dy * 0.36) * S;
  if (p.type !== type) {
    // Mauvaise friandise : la chaussure se secoue, Grisou hésite (2 pas perdus).
    partie.erreurs++; partie.pas += 2;
    partie.fxPortes[i] = { secoue: 1 };
    sons.erreur(); secouer(bouton);
    ajouterEffet(partie.fx, { t: 'texte', txt: traduire('fx.penalite', { n: 2 }), x: sx, y: sy - S * 0.3, c: '#ffb0b0', vie: 1.1 });
    afficherMessage('msg.erreur', { nom: traduire('friandise.' + p.type) });
    majHud();
    verifierFatigue();
    return;
  }
  e.sac[type]--; e.remplies |= 1 << i;
  sons.depot();
  ajouterEffet(partie.fx, { t: 'saut', type, x0: ox + (e.x + 0.5) * S, y0: oy + (e.y + 0.3) * S, x1: sx, y1: sy, vie: 0.45 });
  setTimeout(() => { if (partie) { etincelles(partie.fx, sx, sy, 16, S); ajouterEffet(partie.fx, { t: 'anneau', x: sx, y: sy, vie: 0.5 }); } }, 430);
  majHud();
  const toutes = a.portes.every((q, j) => e.remplies & (1 << j));
  if (toutes) { partie.fini = true; afficherMessage('msg.toutes'); setTimeout(gagner, 900); }
  else {
    const autre = porteServable();
    afficherMessage(autre !== null ? 'msg.servir' : 'msg.bravo');
    verifierFatigue();
  }
}
document.querySelectorAll('.sacoche').forEach((b) => b.addEventListener('click', () => servir(+b.dataset.type)));

// ----- Fin de niveau -----
function gagner() {
  if (!partie) return;
  const i = partie.idx;
  const et = etoilesPour(partie.pas, partie.par);
  const avant = totalEtoiles();
  const ancienRecord = prog.records[i];
  const record = !ancienRecord || partie.pas < ancienRecord;
  prog.etoiles[i] = Math.max(prog.etoiles[i], et);
  if (record) prog.records[i] = partie.pas;
  const apres = totalEtoiles();
  sauver(Math.min(NIVEAUX.length, i + 2));
  prog.niveau = Math.min(NIVEAUX.length, i + 2);
  if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
  if (prog.etoiles.every((v) => v > 0)) { if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 }); }
  sons.victoire();
  const { s } = geo;
  const r = toileJeu.getBoundingClientRect();
  confettis(partie.fx, r.width / 2, r.height / 2, 70, s);
  document.getElementById('titre-fin').textContent = traduire('fin.victoire');
  const zone = document.getElementById('etoiles-fin');
  zone.innerHTML = [0, 1, 2].map((j) => svgEtoile(j < et, 60)).join('');
  zone.setAttribute('aria-label', traduire('fin.etoiles', { n: et }));
  zone.setAttribute('role', 'img');
  [...zone.children].forEach((el, j) => setTimeout(() => { el.classList.add('vue'); if (j < et) sons.etoile(j); }, 350 + j * 300));
  const detail = document.getElementById('fin-detail');
  // Compteur de pas qui défile
  let compte = 0;
  const cible = partie.pas;
  const tic = () => {
    detail.textContent = traduire('fin.pas', { n: compte, par: partie ? partie.par : cible });
    if (compte < cible) { compte++; setTimeout(tic, Math.max(18, 500 / cible)); }
  };
  tic();
