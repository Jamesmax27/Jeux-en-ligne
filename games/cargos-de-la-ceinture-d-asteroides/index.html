  };

  // Temps restant avant la fin de la pause (solo) ou le lancement automatique du salon.
  Arbitre.prototype.reste = function () {
    var t = this.maintenant();
    if (this.phase === 'pause') return Math.max(0, this.finManche - t);
    if (this.phase === 'salon') return Math.max(0, this.salonDepuis + this.r.attenteSalon - t);
    return 0;
  };

  Arbitre.prototype.bienvenue = function (cle, siege) {
    this.envoyer(cle, {
      t: 'bienvenue', proto: PROTOCOLE, siege: siege, sieges: this.flagsSieges(), chef: this.siegeChef(),
      n: this.n, manche: this.manche, phase: this.phase, etat: this.etat, o: this.options, reste: this.reste(),
    });
  };

  // Place d'un robot à donner à un vrai joueur : de préférence pas celle qui doit jouer.
  Arbitre.prototype.siegeRobot = function () {
    var tour = this.phase === 'jeu' ? this.r.aQui(this.etat) : -1;
    var choix = -1;
    for (var s = 0; s < this.places; s++) {
      if (this.sieges[s] !== null) continue;
      if (s !== tour) return s;
      choix = s;
    }
    return choix;
  };

  // Une fois le premier joueur arrivé : salon d'attente (en ligne), sinon première manche.
  Arbitre.prototype.demarrer = function () {
    if (this.phase !== 'attente') return;
    if (this.reglages.salon) this.ouvrirSalon(0);
    else this.nouvelleManche();
  };

  // Salon d'attente : les arrivants prennent la place de robots ; le chef lance la
  // manche (message 'lancer'), sinon elle part seule après attenteSalon.
  // delai : temps d'affichage des derniers coups de la manche précédente.
  Arbitre.prototype.ouvrirSalon = function (delai) {
    this.phase = 'salon';
    this.echeance = null;
    this.salonDepuis = this.maintenant() + delai;
    this.placerAttente();
    // reste : compté à partir du moment où l'appareil lit le message (après l'affichage des coups).
    this.envoyer(null, { t: 'salon', chef: this.siegeChef(), reste: this.r.attenteSalon });
  };

  Arbitre.prototype.nouvelleManche = function () {
    var options = this.reglages.options ? copie(this.reglages.options) : { manche: this.manche + 1 };
    var g = nouvelleGraine(this.alea.bind(this));
    this.manche += 1;
    this.n += 1;
    this.options = options;
    this.etat = this.r.depart(hasard(g), this.places, copie(options));
    this.phase = 'jeu';
    this.echeance = null;
    this.envoyer(null, { t: 'manche', n: this.n, manche: this.manche, g: g, o: options });
    this.placerAttente();
    this.avancer(0);
  };

  // Joueurs en attente (remplacement 'manche') : ils prennent la place de robots.
  Arbitre.prototype.placerAttente = function () {
    var change = false;
    while (this.attente.length) {
      var s = this.siegeRobot();
      if (s < 0) break;
      var cle = this.attente.shift();
      this.sieges[s] = cle;
      change = true;
      this.envoyer(cle, { t: 'place', siege: s });
    }
    if (change) this.envoyerSieges();
  };

  // Un vrai joueur arrive. Renvoie sa place, -1 s'il attend la manche suivante,
  // null si la partie est déjà pleine de vrais joueurs.
  Arbitre.prototype.rejoindre = function (cle) {
    var deja = this.sieges.indexOf(cle);
    if (deja >= 0 || this.attente.indexOf(cle) >= 0) {
      this.bienvenue(cle, deja);
      return deja;
    }
    if (this.estPleine()) return null;
    var s = this.r.remplacement === 'manche' && this.phase === 'jeu' ? -1 : this.siegeRobot();
    if (s >= 0) this.sieges[s] = cle; else this.attente.push(cle);
    this.arrivees.push(cle);
    this.bienvenue(cle, s);
    if (s >= 0) this.envoyerSieges();
    return s;
  };

  // Un vrai joueur s'en va : un robot reprend sa place, la partie continue ;
  // si c'était le chef, le joueur arrivé juste après lui le devient.
  Arbitre.prototype.quitter = function (cle) {
    var k = this.arrivees.indexOf(cle);
    if (k >= 0) this.arrivees.splice(k, 1);
    var i = this.attente.indexOf(cle);
    if (i >= 0) { this.attente.splice(i, 1); if (k === 0) this.envoyerSieges(); return; }
    var s = this.sieges.indexOf(cle);
    if (s < 0) return;
    this.sieges[s] = null;
    this.envoyerSieges();
    if (this.echeance && this.echeance.siege === s) {
      this.echeance = null;
      this.avancer(0);
    }
  };

  Arbitre.prototype.valide = function (s, a) {
    if (a === undefined || this.phase !== 'jeu') return false;
    try { return this.r.valide(copie(this.etat), s, copie(a)) === true; } catch (e) { return false; }
  };

  // Applique une action (déjà contrôlée) et l'annonce à tous.
  Arbitre.prototype.appliquer = function (s, a, auto) {
    var g = nouvelleGraine(this.alea.bind(this));
    this.etat = this.r.jouer(copie(this.etat), s, copie(a), hasard(g));
    this.n += 1;
    var m = { t: 'action', n: this.n, s: s, a: a, g: g };
    if (auto) m.auto = true;
    this.envoyer(null, m);
  };

  // Coup d'un robot (à sa place, ou à celle d'un vrai joueur trop long : auto).
  // Un robot qui ne trouve aucune action permise arrête la manche (règles fautives).
  Arbitre.prototype.jouerRobot = function (s, auto) {
    var a;
    try { a = this.r.bot(copie(this.etat), s, this.alea.bind(this), this.force()); } catch (e) { a = undefined; }
    if (!this.valide(s, a)) { this.finirManche(0); return false; }
    this.appliquer(s, a, auto);
    return true;
  };

  // Fait jouer les robots tant que c'est à eux, jusqu'au tour d'un vrai joueur
  // ou à la fin de la manche. delai : temps d'affichage des coups déjà annoncés.
  Arbitre.prototype.avancer = function (delai) {
    var tours = 0;
    while (this.phase === 'jeu') {
      if (this.r.fin(this.etat)) { this.finirManche(delai); return; }
      if (this.estVide()) return;            // plus personne : la partie va être fermée
      var s = this.r.aQui(this.etat);
      if (!(Number.isInteger(s) && s >= 0 && s < this.places)) { this.finirManche(delai); return; }
      if (this.sieges[s] !== null) {
        var d = this.reglages.delaiJoueur !== undefined ? this.reglages.delaiJoueur : this.r.delaiJoueur;
        this.echeance = isFinite(d) ? { siege: s, quand: this.maintenant() + delai + d } : null;
        return;
      }
      if (!this.jouerRobot(s, false)) return;
      delai += this.r.delaiBot;
      if (++tours > TOURS_MAX) { this.finirManche(delai); return; }
    }
  };

  Arbitre.prototype.finirManche = function (delai) {
    if (this.reglages.salon) { this.ouvrirSalon(delai); return; }
    this.phase = 'pause';
    this.echeance = null;
    this.finManche = this.maintenant() + delai + this.r.pauseManche;
  };

  // Message d'un vrai joueur (déjà lu en JSON).
  Arbitre.prototype.recevoir = function (cle, m) {
    if (!m || typeof m !== 'object') return;
    var s = this.sieges.indexOf(cle);
    if (m.t === 'resync') { this.bienvenue(cle, s); return; }
    // Le chef lance la manche depuis le salon (les autres attendent).
    if (m.t === 'lancer') {
      if (this.phase === 'salon' && cle === this.chef()) this.nouvelleManche();
      return;
    }
    if (m.t !== 'action') return;
    if (s < 0 || this.phase !== 'jeu' || m.n !== this.n || this.r.aQui(this.etat) !== s || !this.valide(s, m.a)) {
      this.envoyer(cle, { t: 'refus', n: this.n });
      return;
    }
    this.echeance = null;
    this.appliquer(s, m.a, false);
    this.avancer(0);
  };

  // Heure du prochain réveil utile (ms), ou null.
  Arbitre.prototype.prochainReveil = function () {
    if (this.phase === 'pause' && this.reglages.enchainer !== false) return this.finManche;
    if (this.phase === 'salon') return this.salonDepuis + this.r.attenteSalon;
    if (this.phase === 'jeu' && this.echeance) return this.echeance.quand;
    return null;
  };

  // Réveil (alarme) : nouvelle manche après la pause ou au bout du salon, ou
  // robot qui joue à la place d'un vrai joueur resté trop longtemps sans jouer.
  Arbitre.prototype.reveil = function () {
    var t = this.maintenant();
    if (this.phase === 'salon' && t >= this.salonDepuis + this.r.attenteSalon) {
      if (!this.estVide()) this.nouvelleManche();
      return;
    }
    if (this.phase === 'pause' && this.reglages.enchainer !== false && t >= this.finManche) {
      if (!this.estVide()) this.nouvelleManche();
      return;
    }
    if (this.phase === 'jeu' && this.echeance && t >= this.echeance.quand) {
      var s = this.echeance.siege;
      this.echeance = null;
      if (this.r.aQui(this.etat) === s && this.jouerRobot(s, true)) this.avancer(this.r.delaiBot);
    }
  };

  // --- Partie, côté jeu -----------------------------------------------------
  // o : {
  //   regles        window.JEL_REGLES
  //   surEvenement  function (e) : { type: 'mode', mode, raison } ('connexion', 'en-ligne', 'solo') ;
  //                 { type: 'debut', reste } (arrivée dans une partie : etat, siege, sieges,
  //                 phase : 'salon' le plus souvent) ;
  //                 { type: 'salon', reste } (salon d'attente, en ligne : avant la 1re manche et
  //                 après chacune ; le chef peut lancer, sinon lancement seul dans reste ms) ;
  //                 { type: 'manche' } (nouvelle manche, etat de départ) ;
  //                 { type: 'action', siege, action, avant, apres, auto, moi } ;
  //                 { type: 'fin', resultat } (fin(etat) des règles) ;
  //                 { type: 'sieges' } (un vrai joueur arrive ou part, ou le chef change) ; { type: 'refus' }
  //   enLigne       false : directement contre des robots sur l'appareil (sinon : en ligne
  //                 si le lanceur du site le permet, robots locaux à défaut)
  //   force         force des robots locaux (0 à 1)
  //   options       options des manches locales (ex. { niveau: 3 })
  //   enchainer     false : pas de nouvelle manche automatique en solo (jeu à niveaux)
  // }
  // Lecture : partie.mode, partie.etat, partie.siege (place du joueur, -1 en attente),
  // partie.phase ('attente', 'salon', 'jeu', 'pause'), partie.sieges() ([{ humain, moi, chef, nom }] ;
  // nom : pseudo d'un vrai joueur en ligne, ou null — robot, ou joueur sans profil : libellé du jeu),
  // partie.chef (place du chef), partie.estChef(), partie.monTour(). Commandes : lancer(),
  // lancerManche() (le chef, dans le salon), jouer(action), pause(oui), recommencer(options)
  // (solo), quitter(). La dernière partie lancée est aussi dans JEL_MULTI.derniere.

  function dansLanceur() {
    try { return racine.parent && racine.parent !== racine; } catch (e) { return false; }
  }

  // Invitation du bouton « Rejoindre » (window.JEL_REJOINDRE = { partie }, posé par le
  // lanceur) : { partie } ou null. Elle ne sert qu'une fois (première partie en ligne).
  var invitationUtilisee = false;
  function invitation() {
    if (invitationUtilisee) return null;
    var i = racine.JEL_REJOINDRE;
    return i && typeof i.partie === 'string' && RE_PARTIE.test(i.partie) ? { partie: i.partie } : null;
  }

  function Partie(o) {
    this.o = o || {};
    this.r = completer(this.o.regles);
    this.mode = 'arret';
    this.etat = null;
    this.n = 0;
    this.manche = 0;
    this.phase = 'attente';
    this.siege = -1;
    this.humains = [];
    this.noms = [];            // pseudo des vrais joueurs par place (en ligne), ou null
    this.chef = -1;            // place du chef du salon (en ligne)
    this.options = null;
    this.file = [];            // messages reçus, joués un par un
    this.libreA = 0;           // heure à partir de laquelle le message suivant peut être joué
    this.rattrapage = false;   // coups accumulés pendant une pause en ligne : rejoués vite
    this.minuteur = 0;
    this.enPause = false;
    this.debutPause = 0;
    this.attendEcho = false;   // action envoyée, pas encore revenue
    this.versSolo = false;     // connexion coupée : bascule en solo une fois la file vidée
    this.local = null;         // arbitre local (solo)
    this.minuteurReveil = 0;
    this.minuteurConnexion = 0;
    this.ecoute = this.recevoirLanceur.bind(this);
  }

  Partie.prototype.signaler = function (e) {
    var f = this.o.surEvenement;
    if (typeof f !== 'function') return;
    // Une erreur du jeu ne bloque pas la file ; elle reste signalée (console, suivi du site).
    try { f(e); } catch (erreur) { setTimeout(function () { throw erreur; }, 0); }
  };

  Partie.prototype.changerMode = function (mode, raison) {
    this.mode = mode;
    this.signaler({ type: 'mode', mode: mode, raison: raison || '' });
  };

  Partie.prototype.lancer = function () {
    this.arreter();
    racine.JEL_MULTI.derniere = this;      // pour le robot de contrôle (scripts/tester-multijoueur.mjs)
    if (this.o.enLigne !== false && dansLanceur()) {
      this.changerMode('connexion');
      racine.addEventListener('message', this.ecoute);
      var demande = { type: 'jel-multi', op: 'rejoindre', proto: PROTOCOLE };
      var inv = invitation();
      if (inv) { demande.partie = inv.partie; invitationUtilisee = true; }   // partie d'un ami (« Rejoindre »)
      try { racine.parent.postMessage(demande, '*'); } catch (e) { /* pas de lanceur */ }
      var moi = this;
      this.minuteurConnexion = setTimeout(function () { moi.passerSolo('delai'); }, DELAI_CONNEXION);
    } else {
      this.passerSolo(this.o.enLigne === false ? 'choix' : 'seul');
    }
  };

  // Arrête tout (connexion, robots locaux, file) sans rien annoncer.
  Partie.prototype.arreter = function () {
    clearTimeout(this.minuteur);
    clearTimeout(this.minuteurReveil);
    clearTimeout(this.minuteurConnexion);
    racine.removeEventListener('message', this.ecoute);
    if (this.mode === 'connexion' || this.mode === 'en-ligne') {
      try { racine.parent.postMessage({ type: 'jel-multi', op: 'quitter' }, '*'); } catch (e) { /* pas de lanceur */ }
    }
    this.file = [];
    this.local = null;
    this.versSolo = false;
    this.attendEcho = false;
    this.noms = [];
    this.mode = 'arret';
  };

  Partie.prototype.quitter = function () { this.arreter(); };

  // Messages du lanceur : { type: 'jel-multi', m } (message du serveur) ou
  // { type: 'jel-multi', etat: 'solo' | 'coupe', raison }.
  Partie.prototype.recevoirLanceur = function (e) {
    if (e.source !== racine.parent) return;
    var d = e.data;
    if (!d || d.type !== 'jel-multi') return;
    if (d.etat) {
      if (this.mode === 'connexion') this.passerSolo(d.raison || d.etat);
      else if (this.mode === 'en-ligne') { this.versSolo = true; this.pomper(); }
      return;
    }
    var m = d.m;
    if (!m || typeof m !== 'object') return;
    if (this.mode === 'connexion') {
      if (m.t !== 'bienvenue') return;
      clearTimeout(this.minuteurConnexion);
      this.changerMode('en-ligne');
    }
    if (this.mode !== 'en-ligne') return;
    this.file.push(m);
    this.pomper();
  };

  // Partie contre des robots sur l'appareil (choix, pas de site, ou serveur absent).
  Partie.prototype.passerSolo = function (raison) {
    this.arreter();
    this.changerMode('solo', raison);
    this.local = this.creerArbitreLocal();
    this.local.rejoindre('moi');
    this.local.demarrer();
    this.programmerReveil();
  };

  Partie.prototype.creerArbitreLocal = function () {
    var moi = this;
    return new Arbitre(this.o.regles, {
      envoyer: function (cle, m) { moi.file.push(m); moi.pomper(); },
      enchainer: this.o.enchainer !== false,
      delaiJoueur: Infinity,               // le joueur de l'appareil prend son temps
      force: typeof this.o.force === 'number' ? this.o.force : this.r.forceEnLigne,
      options: this.o.options || null,
    });
  };

  // Connexion coupée pendant une partie en ligne : la partie continue sur
  // l'appareil, au même point, les autres places tenues par des robots locaux.
  Partie.prototype.basculer = function () {
    racine.removeEventListener('message', this.ecoute);
    // Coupure dans le salon (ou sans place) : une nouvelle manche commence contre des robots.
    if (this.siege < 0 || !this.etat || this.phase === 'salon') { this.passerSolo('coupe'); return; }
    var a = this.creerArbitreLocal();
    var sieges = [];
    for (var s = 0; s < this.r.places; s++) sieges.push(s === this.siege ? 'moi' : null);
    a.restaurer({
      v: PROTOCOLE, sieges: sieges, attente: [], etat: copie(this.etat), n: this.n, manche: this.manche,
      phase: this.phase, finManche: Date.now() + this.r.pauseManche, echeance: null, options: this.options,
    });
    this.local = a;
    this.attendEcho = false;
    this.noms = [];
    this.humains = a.flagsSieges();
    this.changerMode('solo', 'coupe');
    this.signaler({ type: 'sieges' });
    if (a.phase === 'jeu') a.avancer(0);
    this.programmerReveil();
  };

  Partie.prototype.programmerReveil = function () {
    clearTimeout(this.minuteurReveil);
    if (!this.local || this.enPause) return;
    var t = this.local.prochainReveil();
    if (t === null || !isFinite(t)) return;
    var moi = this;
    this.minuteurReveil = setTimeout(function () {
      if (!moi.local || moi.enPause) return;
      moi.local.reveil();
      moi.programmerReveil();
    }, Math.max(0, t - Date.now()));
  };

  // Joue les messages reçus un par un : les coups des autres sont espacés de
  // delaiBot, pour qu'on les voie.
  Partie.prototype.pomper = function () {
    if (this.enPause) return;
    clearTimeout(this.minuteur);
    while (this.file.length) {
      var attente = this.libreA - Date.now();
      if (attente > 0) {
        var moi = this;
        this.minuteur = setTimeout(function () { moi.pomper(); }, attente);
        return;
      }
      var delai = this.traiter(this.file.shift());
      this.libreA = Date.now() + (this.rattrapage ? Math.min(delai, DELAI_RATTRAPAGE) : delai);
    }
    this.rattrapage = false;
    if (this.versSolo) {
      this.versSolo = false;
      this.basculer();
    }
  };

  // Joue un message ; renvoie le temps à laisser avant le suivant (ms).
  Partie.prototype.traiter = function (m) {
    var r = this.r;
    switch (m.t) {
      case 'bienvenue':
        this.siege = m.siege;
        this.humains = m.sieges || [];
        this.chef = typeof m.chef === 'number' ? m.chef : -1;
        this.n = m.n;
        this.manche = m.manche;
        this.options = m.o || null;
        this.etat = m.etat;
        this.phase = m.phase;
        this.attendEcho = false;
        this.signaler({ type: 'debut', reste: m.reste || 0 });
        return 0;
      case 'manche':
        this.etat = r.depart(hasard(m.g), r.places, copie(m.o));
        this.n = m.n;
        this.manche = m.manche;
        this.options = m.o || null;
        this.phase = 'jeu';
        this.attendEcho = false;
        this.signaler({ type: 'manche' });
        return 300;
      case 'action': {
        if (m.n !== this.n + 1 || !this.etat) { this.resynchroniser(); return 0; }
        var avant = this.etat, apres;
        try { apres = r.jouer(copie(avant), m.s, copie(m.a), hasard(m.g)); } catch (e) { this.resynchroniser(); return 0; }
        this.etat = apres;
        this.n = m.n;
        var moi = m.s === this.siege;
        if (moi) this.attendEcho = false;
        this.signaler({ type: 'action', siege: m.s, action: m.a, avant: avant, apres: apres, auto: !!m.auto, moi: moi });
        var resultat = r.fin(apres);
        if (resultat) {
          this.phase = 'pause';
          this.signaler({ type: 'fin', resultat: resultat });
        }
        return moi && !m.auto ? DELAI_MOI : r.delaiBot;
      }
      case 'sieges':
        this.humains = m.sieges || [];
        if (typeof m.chef === 'number') this.chef = m.chef;
        this.signaler({ type: 'sieges' });
        return 0;
      case 'salon':
        this.phase = 'salon';
        if (typeof m.chef === 'number') this.chef = m.chef;
        this.attendEcho = false;
        this.signaler({ type: 'salon', reste: m.reste || 0 });
        return 0;
      case 'place':
        this.siege = m.siege;
        this.signaler({ type: 'sieges' });
        return 0;
      case 'noms':
        this.noms = [];
        for (var k = 0; k < r.places; k++) {
          var x = Array.isArray(m.noms) ? m.noms[k] : null;
          this.noms.push(typeof x === 'string' && x ? x.slice(0, NOM_MAX) : null);
        }
        this.signaler({ type: 'sieges' });
        return 0;
      case 'refus':
        this.attendEcho = false;
        this.signaler({ type: 'refus' });
        return 0;
      default:
        return 0;
    }
  };

  // Messages perdus ou incohérents : en ligne, on redemande l'état au serveur.
  Partie.prototype.resynchroniser = function () {
    this.file = [];
    if (this.mode === 'en-ligne') {
      try { racine.parent.postMessage({ type: 'jel-multi', op: 'envoyer', m: { t: 'resync' } }, '*'); } catch (e) { /* pas de lanceur */ }
    }
  };

  Partie.prototype.sieges = function () {
    var liste = [];
    for (var s = 0; s < this.r.places; s++) {
      var humain = this.humains[s] === true;
      var nom = this.mode === 'en-ligne' && humain && typeof this.noms[s] === 'string' ? this.noms[s] : null;
      liste.push({ humain: humain, moi: s === this.siege, chef: this.mode === 'en-ligne' && s === this.chef, nom: nom });
    }
    return liste;
  };

  // Pseudo du vrai joueur de la place s (en ligne), ou null.
  Partie.prototype.nom = function (s) {
    var info = this.sieges()[s];
    return info ? info.nom : null;
  };

  // Le joueur de l'appareil peut-il lancer la manche ? (en ligne, dans le salon, s'il est le chef)
  Partie.prototype.estChef = function () {
    return this.mode === 'en-ligne' && this.phase === 'salon' && this.siege >= 0 && this.siege === this.chef;
  };

  // Le chef lance la manche depuis le salon. Renvoie true si la demande part.
  Partie.prototype.lancerManche = function () {
    if (!this.estChef() || this.file.length) return false;
    try { racine.parent.postMessage({ type: 'jel-multi', op: 'envoyer', m: { t: 'lancer' } }, '*'); } catch (e) { return false; }
    return true;
  };

  Partie.prototype.monTour = function () {
    if (this.phase !== 'jeu' || !this.etat || this.siege < 0 || this.attendEcho || this.file.length) return false;
    if (this.mode !== 'solo' && this.mode !== 'en-ligne') return false;
    try { return this.r.aQui(this.etat) === this.siege; } catch (e) { return false; }
  };

  // Action du joueur de l'appareil. Renvoie true si elle part (elle sera jouée
  // à son retour, comme celles des autres).
  Partie.prototype.jouer = function (action) {
    if (!this.monTour()) return false;
    try { if (this.r.valide(copie(this.etat), this.siege, copie(action)) !== true) return false; } catch (e) { return false; }
    this.attendEcho = true;
    var m = { t: 'action', n: this.n, a: copie(action) };
    if (this.mode === 'solo') {
      this.local.recevoir('moi', m);
      this.programmerReveil();
    } else {
      try { racine.parent.postMessage({ type: 'jel-multi', op: 'envoyer', m: m }, '*'); } catch (e) { this.attendEcho = false; return false; }
    }
    return true;
  };

  // Pause (menu, écran caché) : la file et les robots locaux s'arrêtent. En
  // ligne, la partie continue sur le serveur : les coups attendent la reprise.
  Partie.prototype.pause = function (oui) {
    if (oui === this.enPause) return;
    this.enPause = oui;
    if (oui) {
      this.debutPause = Date.now();
      clearTimeout(this.minuteur);
      clearTimeout(this.minuteurReveil);
      return;
    }
    var duree = Date.now() - this.debutPause;
    if (this.local) {
      if (this.local.finManche) this.local.finManche += duree;
      if (this.local.echeance) this.local.echeance.quand += duree;
    }
    if (this.mode === 'en-ligne') { this.libreA = 0; this.rattrapage = true; }   // rattraper vite les coups joués pendant la pause
    this.pomper();
    this.programmerReveil();
  };

  // Solo : nouvelle manche tout de suite (niveau suivant, rejouer…).
  Partie.prototype.recommencer = function (options) {
    if (this.mode !== 'solo' || !this.local) return false;
    if (options) { this.o.options = options; this.local.reglages.options = options; }
    this.file = [];
    this.libreA = 0;
    this.local.nouvelleManche();
    this.programmerReveil();
    return true;
  };

  racine.JEL_MULTI = {
    PROTOCOLE: PROTOCOLE,
    hasard: hasard,
    copie: copie,
    completer: completer,
    problemesRegles: problemesRegles,
    Arbitre: Arbitre,
    Partie: Partie,
    creer: function (o) { return new Partie(o); },
    invitation: invitation,
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script id="jel-regles">
/* Règles des « Cargos de la ceinture d'astéroïdes » : fonctions pures
   (docs/multijoueur.md). Les mêmes règles tournent sur le serveur et sur
   chaque appareil.
   La ceinture est un anneau de N cases autour d'une étoile. Quatre cargos y
   tournent. À son tour, on a 3 cartes de poussée ; on en combine deux avec une
   opération (+, −, ×) et le cargo avance d'autant de cases, toujours dans le
   même sens. Pile sur un astéroïde : on le mine (ses cristaux). À côté : on
   dérive. À la fin du nombre de tours de table, le plus riche gagne.
   État (JSON) : N, n (numéro du secteur), cmin/cmax (cartes), ops, tours, rd
   (tours de table joués), res (astéroïdes en réserve), vals, pOr, pTou, tem,
   pos, sc, m (mains), h (carte cachée de chaque main, -1 sinon), bal (balises
   restantes), vol (cristaux volés), as (astéroïdes : c case, v cristaux,
   t tourne, b balise de la place b ou -1, bt fin de la balise), tn (trous
   noirs : c, k 'd' doubleur ou 'h' diviseur), pi (pirates), tour, prem, fini,
   der (dernier coup, pour l'animation), fr (force des robots en solo).
   Actions : { k: 'p', a, b, o } (cartes a et b, opération '+', '-' ou 'x')
             { k: 'b', c } (balise lancée à la distance de la carte c). */
(function () {
  'use strict';

  // Secteurs (un par niveau solo ; les secteurs 6 à 20 servent aussi en ligne).
  // N cases, c cartes [min, max], ops, tours de table, ast astéroïdes au départ,
  // res réserve, vals valeurs tirées, or dorés au départ, pOr chance d'un doré,
  // tou tournants au départ, pTou chance d'un tournant, trous ('d' doubleur,
  // 'h' diviseur), bal balises par cargo, pir pirates, tem chance de tempête,
  // fr force des robots en solo, tuto (démonstration de la nouveauté).
  var SECTEURS = [
    { N: 16, c: [1, 5], ops: '+', tours: 5, ast: 4, res: 3, vals: [1, 1, 2], fr: 0.05, tuto: 'base' },
    { N: 18, c: [1, 6], ops: '+', tours: 6, ast: 5, res: 4, vals: [1, 2], fr: 0.15 },
    { N: 20, c: [1, 8], ops: '+-', tours: 6, ast: 5, res: 5, vals: [1, 2], fr: 0.2, tuto: 'moins' },
    { N: 20, c: [1, 9], ops: '+-', tours: 6, ast: 5, res: 5, vals: [1, 2, 3], fr: 0.28 },
    { N: 24, c: [1, 6], ops: '+-x', tours: 6, ast: 6, res: 6, vals: [1, 2, 3], fr: 0.3, tuto: 'fois' },
    { N: 24, c: [1, 7], ops: '+-x', tours: 6, ast: 6, res: 6, vals: [1, 2, 3], or: 1, pOr: 0.12, fr: 0.36, tuto: 'or' },
    { N: 24, c: [1, 7], ops: '+-x', tours: 7, ast: 6, res: 6, vals: [1, 2, 3], tou: 2, pTou: 0.3, fr: 0.4, tuto: 'tourne' },
    { N: 28, c: [1, 8], ops: '+-x', tours: 7, ast: 7, res: 7, vals: [1, 2, 3], or: 1, pOr: 0.1, tou: 3, pTou: 0.3, fr: 0.44 },
    { N: 28, c: [1, 8], ops: '+-x', tours: 7, ast: 7, res: 7, vals: [1, 2, 3], tou: 1, pTou: 0.2, trous: 'd', fr: 0.48, tuto: 'trou' },
    { N: 28, c: [2, 9], ops: '+-x', tours: 7, ast: 7, res: 7, vals: [1, 2, 3], or: 1, pOr: 0.1, trous: 'dh', fr: 0.5, tuto: 'diviseur' },
    { N: 28, c: [1, 9], ops: '+-x', tours: 7, ast: 7, res: 7, vals: [1, 2, 3], or: 1, pOr: 0.12, bal: 1, fr: 0.54, tuto: 'balise' },
    { N: 30, c: [2, 9], ops: '+-x', tours: 7, ast: 7, res: 7, vals: [1, 2, 3], or: 1, pOr: 0.12, tou: 2, pTou: 0.3, bal: 1, fr: 0.58 },
    { N: 30, c: [1, 9], ops: '+-x', tours: 7, ast: 7, res: 7, vals: [1, 2, 3], or: 1, pOr: 0.1, pir: 1, fr: 0.6, tuto: 'pirate' },
    { N: 30, c: [2, 10], ops: '+-x', tours: 8, ast: 8, res: 8, vals: [1, 2, 3], or: 1, pOr: 0.1, trous: 'dh', pir: 1, fr: 0.64 },
    { N: 32, c: [2, 10], ops: '+-x', tours: 8, ast: 8, res: 8, vals: [1, 2, 3], or: 1, pOr: 0.12, tou: 2, pTou: 0.3, bal: 2, pir: 1, fr: 0.68 },
    { N: 32, c: [1, 9], ops: '+-x', tours: 8, ast: 8, res: 8, vals: [1, 2, 3], or: 1, pOr: 0.12, tem: 0.4, fr: 0.7, tuto: 'tempete' },
    { N: 32, c: [2, 10], ops: '+-x', tours: 8, ast: 8, res: 8, vals: [1, 2, 3], or: 1, pOr: 0.1, trous: 'dh', tem: 0.4, fr: 0.74 },
    { N: 34, c: [2, 11], ops: '+-x', tours: 8, ast: 8, res: 9, vals: [1, 2, 3], or: 1, pOr: 0.12, bal: 2, pir: 1, tem: 0.45, fr: 0.78 },
    { N: 36, c: [2, 12], ops: '+-x', tours: 8, ast: 9, res: 9, vals: [1, 2, 3], or: 1, pOr: 0.12, tou: 2, pTou: 0.25, trous: 'dh', bal: 2, pir: 1, tem: 0.45, fr: 0.82 },
    { N: 36, c: [2, 12], ops: '+-x', tours: 9, ast: 9, res: 10, vals: [1, 2, 3], or: 2, pOr: 0.15, tou: 3, pTou: 0.3, trous: 'dh', bal: 2, pir: 2, tem: 0.55, fr: 0.88 }
  ];

  function mod(a, n) { return ((a % n) + n) % n; }
  function entier(x) { return typeof x === 'number' && isFinite(x) && Math.floor(x) === x; }
  function resultat(o, x, y) { return o === '+' ? x + y : (o === '-' ? Math.abs(x - y) : x * y); }
  function auHasard(liste, alea) { return liste[Math.floor(alea() * liste.length) % liste.length]; }

  function astSur(e, c) { for (var i = 0; i < e.as.length; i++) if (e.as[i].c === c) return i; return -1; }
  function trouSur(e, c) { for (var i = 0; i < e.tn.length; i++) if (e.tn[i].c === c) return i; return -1; }
  function piSur(e, c) { for (var i = 0; i < e.pi.length; i++) if (e.pi[i] === c) return i; return -1; }

  // Un pirate sur la case c ou sur une case voisine ?
  function pirateProche(e, c) {
    for (var i = 0; i < e.pi.length; i++) {
      var d = mod(c - e.pi[i], e.N);
      if (d <= 1 || d >= e.N - 1) return true;
    }
    return false;
  }

  // Trajet d'une poussée de r cases depuis la case depart : cases traversées une à
  // une (toujours dans le même sens), premier trou noir traversé (k : 'd' double
  // ce qui reste à parcourir, 'h' le coupe en deux, arrondi en dessous).
  function trajet(e, depart, r) {
    var p = depart, reste = r, cases = [], trou = -1, k = '', garde = 0;
    while (reste > 0 && garde < 2000) {
      garde++;
      p = mod(p + 1, e.N);
      reste--;
      cases.push(p);
      if (trou < 0) {
        var t = trouSur(e, p);
        if (t >= 0) { trou = p; k = e.tn[t].k; reste = k === 'd' ? reste * 2 : Math.floor(reste / 2); }
      }
    }
    return { fin: p, cases: cases, trou: trou, k: k };
  }

  function minable(e, s, i) { return i >= 0 && (e.as[i].b < 0 || e.as[i].b === s); }

  function caseLibre(e, c) {
    if (astSur(e, c) >= 0 || trouSur(e, c) >= 0 || piSur(e, c) >= 0) return false;
    for (var s = 0; s < e.pos.length; s++) if (e.pos[s] === c) return false;
    return true;
  }

  // Case libre au hasard (loin des cargos si possible).
  function choisirCase(e, alea, loin) {
    var libres = [], c, s, ok;
    for (c = 0; c < e.N; c++) {
      if (!caseLibre(e, c)) continue;
      ok = true;
      if (loin) for (s = 0; s < e.pos.length; s++) { var d = mod(c - e.pos[s], e.N); if (d <= 1 || d >= e.N - 1) ok = false; }
      if (ok) libres.push(c);
    }
    if (!libres.length && loin) return choisirCase(e, alea, false);
    return libres.length ? auHasard(libres, alea) : -1;
  }

  function tirer(e, s, alea) {
    var m = [];
    for (var k = 0; k < 3; k++) m.push(e.cmin + Math.floor(alea() * (e.cmax - e.cmin + 1)) % (e.cmax - e.cmin + 1));
    e.m[s] = m;
    e.h[s] = (e.tem > 0 && alea() < e.tem) ? Math.floor(alea() * 3) % 3 : -1;
  }

  function valeurAuHasard(e, alea) {
    if (alea() < e.pOr) return 5;
    return auHasard(e.vals, alea);
  }

  function nouvelAsteroide(e, alea) {
    var c = choisirCase(e, alea, false);
    if (c < 0) return;
    var v = valeurAuHasard(e, alea);
    var t = alea() < e.pTou ? 1 : 0;
    e.as.push({ c: c, v: v, t: t, b: -1, bt: 0 });
  }

  // Fin d'un tour de table : les astéroïdes tournants avancent d'une case, les
  // balises trop vieilles s'éteignent, les pirates reculent de 2 cases.
  function tourDeTable(e) {
    e.rd++;
    for (var i = 0; i < e.as.length; i++) {
      var a = e.as[i];
      if (a.t) {
        var n = mod(a.c + 1, e.N);
        if (astSur(e, n) < 0 && trouSur(e, n) < 0) a.c = n;
      }
      if (a.b >= 0 && e.rd >= a.bt) a.b = -1;
    }
    for (var p = 0; p < e.pi.length; p++) e.pi[p] = mod(e.pi[p] - 2, e.N);
  }

  // Force des robots d'un niveau solo.
  function forceNiveau(n) {
    var i = Math.max(0, Math.min(SECTEURS.length - 1, n - 1));
    return SECTEURS[i].fr;
  }

  // Valeur d'une poussée de r cases pour la place s (cristaux, moins un vol).
  function evaluer(e, s, r) {
    var tj = trajet(e, e.pos[s], r), i = r > 0 ? astSur(e, tj.fin) : -1, g = 0;
    if (minable(e, s, i)) g = e.as[i].v;
    if (pirateProche(e, tj.fin) && e.sc[s] + g > 0) g -= 1.1;
    // petit bonus : des astéroïdes à portée du prochain tour
    var proches = 0;
    for (var k = 0; k < e.as.length; k++) {
      var d = mod(e.as[k].c - tj.fin, e.N);
      if (d >= 2 && d <= e.cmax * 2 && minable(e, s, k)) proches++;
    }
    return g + proches * 0.03;
  }

  window.JEL_REGLES = {
    places: 4,
    delaiBot: 1100,
    delaiJoueur: 25000,
    pauseManche: 8000,
    remplacement: 'tour',
    forceEnLigne: 0.55,
    secteurs: SECTEURS,

    depart: function (alea, places, options) {
      var o = options || {}, idx;
      var solo = typeof o.niveau === 'number' && isFinite(o.niveau);
      if (solo) idx = Math.max(0, Math.min(SECTEURS.length - 1, Math.floor(o.niveau) - 1));
      else idx = 5 + Math.floor(alea() * (SECTEURS.length - 5)) % (SECTEURS.length - 5);
      var d = SECTEURS[idx], s, k;
      var e = {
        N: d.N, n: idx, cmin: d.c[0], cmax: d.c[1], ops: d.ops, tours: d.tours, rd: 0, res: d.res,
        vals: d.vals.slice(), pOr: d.pOr || 0, pTou: d.pTou || 0, tem: d.tem || 0,
        pos: [], sc: [], m: [], h: [], bal: [], vol: [], as: [], tn: [], pi: [],
        tour: 0, prem: 0, fini: false, der: null, coups: 0
      };
      for (s = 0; s < places; s++) {
        e.pos.push(Math.floor(s * d.N / places));
        e.sc.push(0); e.bal.push(d.bal || 0); e.vol.push(0); e.m.push([]); e.h.push(-1);
      }
      var trous = (d.trous || '').split('');
      for (k = 0; k < trous.length; k++) {
        var ct = choisirCase(e, alea, true);
        if (ct >= 0) e.tn.push({ c: ct, k: trous[k] });
      }
      for (k = 0; k < (d.pir || 0); k++) {
        var cp = choisirCase(e, alea, true);
        if (cp >= 0) e.pi.push(cp);
      }
      var nOr = d.or || 0, nTou = d.tou || 0;
      for (k = 0; k < d.ast; k++) {
        var ca = choisirCase(e, alea, false);
        if (ca < 0) break;
        var v = k < nOr ? 5 : auHasard(e.vals, alea);
        var t = (k >= nOr && k < nOr + nTou) ? 1 : 0;
        e.as.push({ c: ca, v: v, t: t, b: -1, bt: 0 });
      }
      for (s = 0; s < places; s++) tirer(e, s, alea);
      if (solo) e.fr = d.fr;
      e.tour = e.prem = Math.floor(alea() * places) % places;
      return e;
    },

    aQui: function (e) { return e.tour; },

    valide: function (e, s, a) {
      if (!e || e.fini || s !== e.tour || !a || typeof a !== 'object') return false;
      if (a.k === 'p') {
        return entier(a.a) && entier(a.b) && a.a >= 0 && a.a < 3 && a.b >= 0 && a.b < 3 && a.a !== a.b &&
          typeof a.o === 'string' && a.o.length === 1 && e.ops.indexOf(a.o) >= 0;
      }
      if (a.k === 'b') {
        if (!(e.bal[s] > 0) || !entier(a.c) || a.c < 0 || a.c > 2) return false;
        var i = astSur(e, mod(e.pos[s] + e.m[s][a.c], e.N));
        return i >= 0 && e.as[i].b < 0;
      }
      return false;
    },

    jouer: function (e, s, a, alea) {
      var m = e.m[s], der = { s: s, k: a.k, d: e.pos[s], gain: 0 };
      if (a.k === 'b') {
        var vb = m[a.c], cb = mod(e.pos[s] + vb, e.N), ib = astSur(e, cb);
        e.as[ib].b = s;
        e.as[ib].bt = e.rd + 2;
        e.bal[s]--;
        der.c = a.c; der.v = vb; der.cible = cb; der.cache = e.h[s] === a.c;
      } else {
        var x = m[a.a], y = m[a.b], r = resultat(a.o, x, y);
        var tj = trajet(e, e.pos[s], r);
        e.pos[s] = tj.fin;
        der.x = x; der.y = y; der.o = a.o; der.r = r; der.fin = tj.fin; der.trou = tj.trou; der.tk = tj.k;
        der.cache = e.h[s] === a.a || e.h[s] === a.b;
        // Une poussée de 0 (deux cartes égales soustraites) laisse le cargo sur place : rien à miner.
        var i = r > 0 ? astSur(e, tj.fin) : -1;
        if (i >= 0) {
          if (minable(e, s, i)) {
            der.gain = e.as[i].v;
            der.av = { c: e.as[i].c, v: e.as[i].v, t: e.as[i].t, b: e.as[i].b };
            e.sc[s] += e.as[i].v;
            e.as.splice(i, 1);
            if (e.res > 0) { e.res--; nouvelAsteroide(e, alea); }
          } else der.reserve = 1;
        }
        if (pirateProche(e, tj.fin) && e.sc[s] > 0) { e.sc[s]--; e.vol[s]++; der.vole = 1; }
      }
      tirer(e, s, alea);
      e.coups++;
      e.tour = (s + 1) % e.pos.length;
      if (e.tour === e.prem) tourDeTable(e);
      if (e.rd >= e.tours || (e.as.length === 0 && e.res <= 0)) e.fini = true;
      e.der = der;
      return e;
    },

    // Robot : essaie toutes les combinaisons (une carte cachée compte pour la
    // moyenne de ses valeurs possibles : il ne triche pas), pose une balise sur
    // un gros astéroïde quand c'est mieux ; la force dose ses erreurs.
    bot: function (e, s, alea, force) {
      var fo = typeof e.fr === 'number' ? e.fr : (typeof force === 'number' ? force : 0.5);
      var m = e.m[s], h = e.h[s], liste = [], paires = [[0, 1], [0, 2], [1, 2]], p, k, o;
      for (p = 0; p < 3; p++) {
        var a = paires[p][0], b = paires[p][1];
        for (k = 0; k < e.ops.length; k++) {
          o = e.ops.charAt(k);
          var val;
          if (h === a || h === b) {
            var autre = h === a ? m[b] : m[a], somme = 0, nbv = 0;
            for (var v = e.cmin; v <= e.cmax; v++) { somme += evaluer(e, s, resultat(o, v, autre)); nbv++; }
            val = somme / nbv - 0.05;
          } else val = evaluer(e, s, resultat(o, m[a], m[b]));
          liste.push({ a: { k: 'p', a: a, b: b, o: o }, v: val });
        }
      }
      if (e.bal[s] > 0) {
        for (k = 0; k < 3; k++) {
          if (k === h) continue;
          var ib = astSur(e, mod(e.pos[s] + m[k], e.N));
          if (ib >= 0 && e.as[ib].b < 0) liste.push({ a: { k: 'b', c: k }, v: e.as[ib].v >= 3 ? e.as[ib].v * 0.5 : 0.2 });
        }
      }
      var haut = -Infinity;
      for (k = 0; k < liste.length; k++) if (liste[k].v > haut) haut = liste[k].v;
      if (alea() < 0.1 + 0.7 * fo) {
        var meilleurs = liste.filter(function (x) { return x.v > haut - 1e-6; });
        return auHasard(meilleurs, alea).a;
      }
      if (alea() < 0.5) {
        var sans = liste.filter(function (x) { return x.v > -0.5 && x.a.k === 'p'; });
        if (sans.length) return auHasard(sans, alea).a;
      }
      var poussees = liste.filter(function (x) { return x.a.k === 'p'; });
      return auHasard(poussees, alea).a;
    },

    fin: function (e) {
      if (!e.fini) return null;
      var cl = [];
      for (var s = 0; s < e.sc.length; s++) cl.push(s);
      cl.sort(function (x, y) { return (e.sc[y] - e.sc[x]) || (x - y); });
      return { classement: cl, scores: e.sc.slice() };
    },

    // Outils de calcul partagés avec l'écran du jeu.
    outils: {
      mod: mod, resultat: resultat, trajet: trajet, astSur: astSur, trouSur: trouSur, piSur: piSur,
      pirateProche: pirateProche, minable: minable, forceNiveau: forceNiveau
    }
  };
})();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: #0d0a24; color: #f3f0ff;
    font-family: system-ui, sans-serif; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #fond { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ecran { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; }
  .ecran.actif { display: flex; }
  button { font: inherit; color: inherit; cursor: pointer; min-height: 44px; min-width: 44px; border: none; border-radius: 14px; }
  button:focus-visible { outline: 3px solid #ffd84d; outline-offset: 2px; }
  button:disabled { cursor: default; }
  .btn {
    background: #2a2160; border: 2px solid #7d6ee8; padding: 8px 16px; font-weight: 800; font-size: 1.05rem; color: #f3f0ff;
    box-shadow: 0 3px 0 #4b3fa8; transition: transform .1s; line-height: 1.15;
  }
  .btn:active { transform: translateY(2px) scale(.97); box-shadow: 0 1px 0 #4b3fa8; }
  .btn.grand {
    background: linear-gradient(#ffd36b, #ff9a3d); color: #3a1600; border-color: #fff0c4;
    font-size: 1.7rem; padding: 10px 52px; border-radius: 24px; box-shadow: 0 5px 0 #b65a12, 0 8px 22px #0006;
  }
  .btn.multi {
    background: linear-gradient(#5fe0ef, #1f97c9); color: #04263a; border-color: #d4fbff;
    box-shadow: 0 4px 0 #0d5f86, 0 6px 16px #0005; font-size: 1.12rem; display: inline-flex; align-items: center; gap: 8px;
  }
  .btn.multi svg { width: 30px; height: 24px; flex: none; }
  .btn.vert { background: linear-gradient(#9cf08a, #39b54a); color: #0b3311; border-color: #e3ffe0; box-shadow: 0 3px 0 #1f6e2a; }
  .rond {
    width: 46px; height: 46px; border-radius: 50%; background: #2a2160; border: 2px solid #7d6ee8;
    font-size: 1.3rem; display: inline-flex; align-items: center; justify-content: center; flex: none; box-shadow: 0 2px 0 #4b3fa8;
  }
  .barre-haut { width: 100%; max-width: 760px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; position: relative; z-index: 2; }
  .barre-haut h2 { flex: 1; text-align: center; font-size: 1.3rem; }
  .espace { flex: 1; }
  .petit { font-size: .95rem; text-align: center; }

  /* Écran titre */
  #ecran-titre { justify-content: space-between; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  #ecran-titre h1 {
    font-size: clamp(1.9rem, 8.4vw, 3.3rem); line-height: 1.04; text-align: center; padding: 0 16px; color: #fff;
    text-shadow: 0 3px 0 #5b2bb5, 0 0 18px #b48cff, 2px 0 0 #5b2bb5, -2px 0 0 #5b2bb5; max-width: 660px;
  }
  .panneau { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 520px; padding: 0 14px; }
  .consigne {
    text-align: center; font-size: 1rem; line-height: 1.3; background: #160f3bdd; border: 2px solid #7d6ee8;
    border-radius: 16px; padding: 8px 12px; box-shadow: 0 3px 10px #0005; font-weight: 600;
  }
  .rangee { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  #total-titre { background: #160f3bcc; border-radius: 10px; padding: 2px 10px; font-weight: 700; color: #ffd84d; }
  #total-titre:empty { display: none; }

  /* Niveaux et hangar */
  #ecran-niveaux, #ecran-hangar { background: linear-gradient(#1b1450, #0d0a24 60%); }
  .defile { overflow-y: auto; width: 100%; max-width: 640px; padding: 4px 12px 20px; flex: 1; -webkit-overflow-scrolling: touch; }
  .neb-titre { font-weight: 800; margin: 12px 2px 6px; display: flex; align-items: center; gap: 8px; }
  .neb-titre::before { content: ''; width: 18px; height: 18px; border-radius: 50%; background: var(--n); box-shadow: 0 0 10px var(--n); flex: none; }
  .grille { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .case {
    min-height: 66px; border-radius: 14px; background: #2a2160; border: 3px solid var(--n, #7d6ee8); display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-weight: 900; font-size: 1.3rem; padding: 4px 2px; box-shadow: 0 3px 0 #0006;
  }
  .case small { font-size: .78rem; letter-spacing: 1px; color: #5a5288; }
  .case small .oui { color: #ffd84d; }
  .case.ferme { background: #1a1540; border-color: #3a3270; color: #6d66a0; box-shadow: none; }
  .case.actuel { box-shadow: 0 0 0 3px #ffd84d; }
  #niv-aide { margin: 4px 0 4px; }
  .section-titre { font-size: 1.15rem; font-weight: 800; margin: 12px 0 4px; text-align: center; }
  .grille-cargos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cargo-choix {
    background: #2a2160; border: 3px solid #4b3fa8; border-radius: 16px; padding: 6px 4px; display: flex; flex-direction: column;
    align-items: center; gap: 2px; font-weight: 700; font-size: .85rem; line-height: 1.15;
  }
  .cargo-choix canvas { width: 72px; height: 54px; }
  .cargo-choix.choisi { border-color: #ffd84d; box-shadow: 0 0 0 2px #ffd84d; }
  .cargo-choix.ferme { opacity: .6; }
  .grille-autocollants { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .autocollant { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; font-size: .72rem; font-weight: 700; line-height: 1.12; }
  .autocollant canvas { width: 62px; height: 62px; }
  .autocollant.ferme { color: #6d66a0; }

  /* Écran de jeu */
  #ecran-jeu { background: #0d0a24; align-items: stretch; }
  #places { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: max(6px, env(safe-area-inset-top)) 6px 4px; width: 100%; max-width: 640px; align-self: center; position: relative; z-index: 2; }
  .place {
    --c: #888; position: relative; background: #1b1450e6; border: 3px solid #3a3270; border-radius: 14px; padding: 3px 2px 4px;
    display: flex; flex-direction: column; align-items: center; gap: 1px; transition: transform .2s, box-shadow .2s, border-color .2s;
  }
  .place canvas.cargo { width: 44px; height: 30px; display: block; }
  .place .pts { font-weight: 900; font-size: 1.15rem; line-height: 1.05; color: var(--c); display: inline-flex; align-items: center; gap: 3px; }
  .place .pts svg { width: 13px; height: 15px; }
  /* Nom d'une place : jamais coupé. L'icône et le nom passent l'un sous l'autre
     s'ils ne tiennent pas sur une ligne, et le nom va à la ligne entre ses mots. */
  .tag {
    font-size: .7rem; font-weight: 800; display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 1px 3px; align-items: center;
    padding: 1px 4px; border-radius: 8px; background: #ffffff14; min-height: 20px; max-width: 100%; text-align: center; line-height: 1.1;
  }
  .tag span { white-space: normal; overflow-wrap: anywhere; min-width: 0; }
  .tag svg { width: 12px; height: 12px; flex: none; }
  .place.moi .tag, .salon-place.moi .tag { background: #ffd84d; color: #3a2600; }
  .place.actif { transform: translateY(-1px) scale(1.04); border-color: var(--c); box-shadow: 0 0 0 2px var(--c), 0 0 16px var(--c); z-index: 1; }
  .place.bond .pts { animation: bond .5s ease-out; }
  .place.vole { animation: secousse .45s; }
  @keyframes bond { 0% { transform: scale(1); } 40% { transform: scale(1.6); } 100% { transform: scale(1); } }
  @keyframes secousse { 0%, 100% { transform: none; } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
  .place canvas.couronne { position: absolute; top: -9px; right: -5px; width: 24px; height: 18px; display: none; }
  .place.chef canvas.couronne { display: block; }
  #infos { display: flex; align-items: center; gap: 8px; padding: 2px 8px; width: 100%; max-width: 640px; align-self: center; position: relative; z-index: 2; }
  #infos-texte { flex: 1; min-width: 0; text-align: center; line-height: 1.15; }
  #info-niveau { font-size: .82rem; font-weight: 700; color: #b9b0ff; }
  #message { font-weight: 900; font-size: 1.02rem; min-height: 1.25em; }
  #temps { height: 7px; margin: 3px 14px 0; border-radius: 4px; background: #ffffff1f; overflow: hidden; visibility: hidden; align-self: stretch; }
  #temps > div { --c: #5fe0ef; height: 100%; width: 100%; background: var(--c); transform-origin: left; }
  #zone { flex: 1; position: relative; min-height: 0; }
  #plateau { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #coup {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.8); opacity: 0; pointer-events: none;
    background: #0d0a24e6; border: 3px solid var(--c, #fff); border-radius: 16px; padding: 6px 12px; text-align: center;
    transition: opacity .2s, transform .2s; z-index: 2; max-width: 70%;
  }
  #coup.actif { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #coup-calc { font-size: 1.35rem; font-weight: 900; white-space: nowrap; }
  #coup-qui, #coup-effet { font-size: .82rem; font-weight: 700; overflow-wrap: anywhere; }
  #coup-effet { color: #ffd84d; }
  #bandeau {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #1b1450f2; border: 3px solid #5fe0ef;
    border-radius: 18px; padding: 14px 18px; font-weight: 800; text-align: center; display: none; align-items: center; gap: 12px;
    width: min(90%, 360px); box-shadow: 0 8px 24px #0006; z-index: 3; pointer-events: none;
  }
  #bandeau.actif { display: flex; }
  .tourne { width: 30px; height: 30px; border-radius: 50%; border: 4px solid #2c5f7a; border-top-color: #5fe0ef; animation: tourne 1s linear infinite; flex: none; }
  @keyframes tourne { to { transform: rotate(360deg); } }

  /* Main : cartes, opérations, calcul */
  #main { width: 100%; max-width: 560px; align-self: center; padding: 4px 8px max(6px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 2; }
  #main-haut { display: flex; gap: 8px; align-items: stretch; justify-content: center; }
  #cartes { display: flex; gap: 6px; }
  .carte-p {
    width: 62px; height: 70px; border-radius: 12px; font-size: 1.9rem; font-weight: 900; color: #1b1450;
    background: linear-gradient(160deg, #ffffff, #d9d2ff); border: 3px solid #a99cff; box-shadow: 0 4px 0 #4b3fa8;
    position: relative; transition: transform .12s, box-shadow .12s; display: flex; align-items: center; justify-content: center;
  }
  .carte-p::after { content: ''; position: absolute; left: 7px; right: 7px; bottom: 6px; height: 5px; border-radius: 3px; background: #ff9a3d; opacity: .7; }
  .carte-p.choisie { transform: translateY(-6px); border-color: #ffd84d; box-shadow: 0 6px 0 #b68a12, 0 0 16px #ffd84d; background: linear-gradient(160deg, #fff8d6, #ffe48a); }
  .carte-p.cachee { background: repeating-linear-gradient(45deg, #ff9a3d, #ff9a3d 8px, #ffbd5e 8px, #ffbd5e 16px); color: #3a1600; border-color: #ffd36b; }
  .carte-p.cachee.choisie { box-shadow: 0 6px 0 #b65a12, 0 0 16px #ff9a3d; }
  .carte-p:disabled { opacity: .55; }
  .carte-p.nouvelle { animation: donne .4s ease-out both; }
  @keyframes donne { from { transform: translateY(30px) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
  #ops { display: grid; grid-template-columns: repeat(3, 44px); gap: 5px; align-content: center; }
  .op { width: 44px; height: 44px; border-radius: 12px; background: #2a2160; border: 2px solid #7d6ee8; font-size: 1.5rem; font-weight: 900; line-height: 1; }
  .op.choisie { background: #ffd84d; color: #3a2600; border-color: #fff3b0; }
  .op[hidden] { display: none; }
  #main-bas { display: flex; gap: 6px; align-items: center; }
  #calcul { flex: 1; min-width: 0; text-align: center; line-height: 1.15; }
  #calcul-expr { font-size: 1.3rem; font-weight: 900; min-height: 1.2em; }
  #calcul-aide { font-size: .78rem; font-weight: 700; color: #b9b0ff; min-height: 1.1em; }
  #calcul-aide.bon { color: #9cf08a; }
  #calcul-aide.mauvais { color: #ffb36b; }
  #btn-propulser { padding: 8px 12px; font-size: 1.05rem; }
  #btn-balise { padding: 6px 10px; font-size: .9rem; background: #2a2160; }
  #btn-balise.choisie { background: #ffd84d; color: #3a2600; border-color: #fff3b0; }
  #btn-balise[hidden] { display: none; }
  #main.attend .carte-p, #main.attend .op { opacity: .6; }

  /* Voiles (pause, tutoriel, fin, salon) */
  .voile { position: fixed; inset: 0; background: #07051899; display: none; align-items: center; justify-content: center; z-index: 20; padding: 12px; }
  .voile.actif { display: flex; }
  .carte {
    background: linear-gradient(#251c62, #171040); border: 3px solid #7d6ee8; border-radius: 22px; padding: 16px 14px;
    width: min(100%, 410px); max-height: 100%; overflow-y: auto; text-align: center; display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 10px 40px #000a; animation: arrivee .35s ease-out;
  }
  @keyframes arrivee { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  .carte h2 { font-size: 1.4rem; color: #ffd84d; }
  .carte p { line-height: 1.35; }
  #tuto-demo { width: 100%; max-width: 330px; aspect-ratio: 560 / 330; align-self: center; background: #0d0a24; border-radius: 14px; border: 2px solid #4b3fa8; }
  #fin-etoiles { font-size: 2.6rem; letter-spacing: 6px; min-height: 50px; }
  #fin-etoiles span { display: inline-block; color: #3a3270; }
  #fin-etoiles span.oui { color: #ffc21a; animation: envol .6s ease-out both; text-shadow: 0 0 12px #ffd84d, 0 2px 0 #b07800; }
  @keyframes envol { 0% { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.35) rotate(10deg); } 100% { transform: none; } }
  #fin-points { font-size: 1.12rem; font-weight: 800; }
  .classement { display: flex; flex-direction: column; gap: 5px; }
  .ligne-cl { display: flex; align-items: center; gap: 8px; background: #ffffff12; border-radius: 12px; padding: 3px 10px; border: 2px solid transparent; }
  .ligne-cl.moi { border-color: #ffd84d; background: #ffd84d22; }
  .ligne-cl .rang { font-weight: 900; width: 1.5em; text-align: right; flex: none; }
  .ligne-cl canvas { width: 40px; height: 28px; flex: none; }
  .ligne-cl .qui { flex: 1; text-align: left; font-weight: 700; display: flex; align-items: center; gap: 4px; min-width: 0; }
  .ligne-cl .qui span { white-space: normal; overflow-wrap: anywhere; min-width: 0; }
  .ligne-cl .qui svg { width: 16px; height: 16px; flex: none; }
  .ligne-cl .nb { font-weight: 900; flex: none; }
  #fin-record, #fin-debloque, #fin-compte, #fin-autocollants { font-weight: 700; }
  #fin-debloque { color: #9cf08a; }
  #fin-autocollants { color: #ffd84d; }
  #fin-autocollants:empty, #fin-debloque:empty, #fin-compte:empty, #fin-record:empty { display: none; }
  #fin-compte { color: #5fe0ef; }
  #fin-boutons, #pause-boutons { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
  #place-langue-pause { display: flex; justify-content: center; }
  #pause-ligne { background: #5fe0ef22; border-radius: 12px; padding: 6px 8px; font-weight: 600; }
  #salon-resultat { display: flex; flex-direction: column; gap: 5px; }
  #salon-resultat-titre { font-weight: 800; color: #b9b0ff; }
  #salon-places { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .salon-place {
    background: #ffffff10; border: 3px solid #3a3270; border-radius: 14px; padding: 6px 2px 5px;
    display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative;
  }
  .salon-place canvas { width: 60px; height: 50px; display: block; }
  .salon-place.moi { border-color: #ffd84d; background: #ffd84d22; }
  .salon-place.arrive { animation: arrivee .45s ease-out; }
  #salon-message { font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
  #salon-compte { color: #5fe0ef; font-weight: 700; }
  #salon-compte:empty, #salon-message:empty { display: none; }
  #btn-lancer { font-size: 1.25rem; padding: 10px 16px; }
  #btn-lancer[hidden] { display: none; }
  #confettis { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
  #toast {
    position: fixed; left: 50%; bottom: 150px; transform: translate(-50%, 20px); opacity: 0; z-index: 25;
    background: #1b1450; color: #f3f0ff; font-weight: 800; padding: 10px 16px; border-radius: 14px; border: 2px solid #5fe0ef;
    transition: opacity .25s, transform .25s; pointer-events: none; text-align: center; width: max-content; max-width: 90%; box-shadow: 0 4px 14px #0008;
  }
  #toast.actif { opacity: 1; transform: translate(-50%, 0); }
  #toast.haut { bottom: auto; top: 10px; }
  @media (min-width: 700px) {
    .place canvas.cargo { width: 54px; height: 36px; }
    .place .pts { font-size: 1.35rem; }
    .carte-p { width: 72px; height: 80px; }
  }
  @media (max-height: 700px) {
    .carte-p { height: 60px; font-size: 1.6rem; }
    .place canvas.cargo { height: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<canvas id="fond" aria-hidden="true"></canvas>

<!-- Écran titre : le dessin de la ceinture sert aussi de jaquette -->
<div id="ecran-titre" class="ecran actif">
  <div class="barre-haut">
    <div id="place-langue"></div>
    <div class="espace"></div>
    <button id="btn-son-titre" class="rond btn-son" type="button"></button>
  </div>
  <h1 data-i18n="titre"></h1>
  <div class="espace"></div>
  <div class="panneau">
    <p class="consigne" data-i18n="titre.consigne"></p>
    <button id="btn-jouer" class="btn grand" type="button" data-i18n="bouton.jouer"></button>
    <button id="btn-multi" class="btn multi" type="button" data-multi="jouer">
      <svg viewBox="0 0 30 24" aria-hidden="true"><circle cx="9" cy="7" r="4.5" fill="#fff"/><path d="M1 22c0-5 3.5-8 8-8s8 3 8 8z" fill="#fff"/><circle cx="21" cy="8" r="4" fill="#ffd84d"/><path d="M14 22c.5-4.5 3.2-7 7-7s7 2.6 7.5 7z" fill="#ffd84d"/></svg>
      <span data-i18n="bouton.multi"></span>
    </button>
    <div class="rangee">
      <button id="btn-niveaux" class="btn" type="button" data-i18n="bouton.niveaux"></button>
      <button id="btn-hangar" class="btn" type="button" data-i18n="bouton.hangar"></button>
      <span id="place-effacer"></span>
    </div>
    <p id="total-titre" class="petit"></p>
  </div>
</div>

<!-- Choix du niveau -->
<div id="ecran-niveaux" class="ecran">
  <div class="barre-haut">
    <button id="niv-retour" class="rond" type="button" data-i18n-aria="bouton.retour">←</button>
    <h2 data-i18n="niveaux.titre"></h2>
    <span id="niv-total" class="petit"></span>
  </div>
  <div class="defile">
    <p id="niv-aide" class="petit" data-i18n="niveaux.aide"></p>
    <div id="grille-niveaux"></div>
  </div>
</div>

<!-- Hangar : cargos et autocollants -->
<div id="ecran-hangar" class="ecran">
  <div class="barre-haut">
    <button id="hangar-retour" class="rond" type="button" data-i18n-aria="bouton.retour">←</button>
    <h2 data-i18n="hangar.titre"></h2>
    <span class="rond" aria-hidden="true" style="visibility:hidden"></span>
  </div>
  <div class="defile">
    <p class="section-titre" data-i18n="hangar.cargos"></p>
    <p class="petit" data-i18n="hangar.cargosAide"></p>
    <div id="grille-cargos" class="grille-cargos"></div>
    <p class="section-titre" data-i18n="hangar.autocollants"></p>
    <p id="hangar-compte" class="petit"></p>
    <div id="grille-autocollants" class="grille-autocollants"></div>
  </div>
</div>

<!-- Partie -->
<div id="ecran-jeu" class="ecran">
  <div id="places"></div>
  <div id="infos">
    <button id="btn-pause" class="rond" type="button" data-i18n-aria="pause.bouton">⏸</button>
    <div id="infos-texte"><div id="info-niveau"></div><div id="message" aria-live="polite"></div></div>
    <button id="btn-son" class="rond btn-son" type="button"></button>
  </div>
  <div id="temps" role="progressbar" data-i18n-aria="multi.temps"><div></div></div>
  <div id="zone">
    <canvas id="plateau" tabindex="0" data-i18n-aria="plateau.aria"></canvas>
    <div id="coup"><div id="coup-qui"></div><div id="coup-calc"></div><div id="coup-effet"></div></div>
    <div id="bandeau"><span class="tourne"></span><span id="bandeau-texte"></span></div>
  </div>
  <div id="main">
    <div id="main-haut">
      <div id="cartes"></div>
      <div id="ops">

<canvas id="confettis" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // =====================================================================
  //  Les cargos de la ceinture d'astéroïdes — jeu de calcul et de stratégie
  //  À son tour, on combine deux cartes de poussée (+, −, ×) pour arriver
  //  pile sur un astéroïde de l'anneau et miner ses cristaux. Solo :
  //  20 secteurs contre 3 robots. En ligne : de vrais joueurs remplacent les
  //  robots (moteur commun JEL_MULTI). Règles et secteurs : bloc jel-regles.
  // =====================================================================

  const JEU = 'cargos-de-la-ceinture-d-asteroides';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = R.secteurs;               // mêmes données que les règles
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);
  const SIGNE = { '+': '+', '-': '−', 'x': '×' };

  // Une couleur par cargo : orange, turquoise, rose, citron vert.
  const COUL = ['#ff9a3d', '#3fd6e8', '#ff6fb5', '#a6e35a'];
  const COUL_F = ['#a8480c', '#0d6f86', '#a0245f', '#4f7d12'];

  // Nébuleuses : une tous les 5 niveaux (fond, nuages, nom).
  const NEBULEUSES = [
    { haut: '#2a0f2e', bas: '#0f0820', nuages: ['#ff7a6b', '#ffb35c'], etoile: '#ffd36b' },
    { haut: '#06261f', bas: '#06101a', nuages: ['#3be3a2', '#5fe0ef'], etoile: '#d4ff8a' },
    { haut: '#0a1844', bas: '#070a1f', nuages: ['#4f8dff', '#7fd6ff'], etoile: '#bfe3ff' },
    { haut: '#25103f', bas: '#0c0620', nuages: ['#b06bff', '#ff7ae0'], etoile: '#ffc6ff' }
  ];
  const nebuleuseDe = (n) => Math.min(3, Math.floor((n - 1) / 5));

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#1b1450"/><circle cx="10.4" cy="8" r="1.6" fill="#1b1450"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#1b1450"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';
  const ICONE_CRISTAL = '<svg viewBox="0 0 12 15" aria-hidden="true"><path d="M6 0l5 5-5 10-5-10z" fill="currentColor"/><path d="M6 0l2 5-2 10-2-10z" fill="#ffffff66"/></svg>';

  // Cargos à débloquer avec les étoiles (forme de la coque).
  const CARGOS = [
    { forme: 0, etoiles: 0 }, { forme: 1, etoiles: 8 }, { forme: 2, etoiles: 18 },
    { forme: 3, etoiles: 30 }, { forme: 4, etoiles: 42 }, { forme: 5, etoiles: 54 }
  ];

  // Autocollants de mission (dessin, condition gérée dans le code).
  const AUTOCOLLANTS = ['premier', 'moins', 'fois', 'or', 'tourne', 'trou', 'balise', 'tour', 'pirates', 'tempete', 'avance', 'final'];

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = {
    etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, tutos: [],
    autocollants: [], cargo: 0, reprise: 1, options: { son: true }
  };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 999, 0));
      prog.reprise = entier(d.niveau, 1, NIVEAUX.length, 1);
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), prog.reprise);
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string');
      if (Array.isArray(d.autocollants)) prog.autocollants = d.autocollants.filter((x) => AUTOCOLLANTS.indexOf(x) >= 0);
      prog.cargo = entier(d.cargo, 0, CARGOS.length - 1, 0);
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
    if (CARGOS[prog.cargo].etoiles > totalEtoiles()) prog.cargo = 0;
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.autocollants = [];
    prog.cargo = 0;
    prog.reprise = 1;
  }

  function sauver(niveauReprise, score) {
    prog.reprise = niveauReprise;
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
        debloque: prog.debloque, tutos: prog.tutos.slice(), autocollants: prog.autocollants.slice(),
        cargo: prog.cargo, options: { son: prog.options.son }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Réglages changés hors d'une partie (son, cargo choisi) : jamais de nouvelle
  // sauvegarde depuis l'écran titre, seulement une mise à jour d'une sauvegarde existante.
  function sauverReglages() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: prog.options.son }, cargo: prog.cargo }); } catch (e) { /* rien */ }
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      const v = o.vol || 0.1;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.025, d / 4));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      osc.connect(g); sortie.connect(ac.destination);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  const sons = {
    clic: () => note(660, 0.06, { type: 'triangle', vol: 0.06 }),
    carte: () => { note(520, 0.05, { type: 'triangle', vol: 0.06 }); note(780, 0.06, { type: 'triangle', vol: 0.05, retard: 0.04 }); },
    op: () => note(440, 0.07, { type: 'square', vol: 0.035, filtre: 1500 }),
    propulse: () => { note(160, 0.45, { type: 'sawtooth', vol: 0.05, vers: 620, filtre: 1200 }); note(90, 0.3, { type: 'triangle', vol: 0.08, vers: 200 }); },
    pas: () => note(1180, 0.03, { type: 'triangle', vol: 0.025 }),
    mine: () => [1320, 1760, 2093].forEach((f, i) => note(f, 0.16, { type: 'triangle', vol: 0.07, retard: i * 0.06 })),
    or: () => [784, 988, 1175, 1568, 1976].forEach((f, i) => note(f, 0.2, { type: 'triangle', vol: 0.08, retard: i * 0.07 })),
    derive: () => note(420, 0.5, { type: 'sine', vol: 0.07, vers: 180 }),
    trou: () => { note(900, 0.35, { type: 'sine', vol: 0.07, vers: 120 }); note(120, 0.3, { type: 'sine', vol: 0.07, vers: 700, retard: 0.3 }); },
    balise: () => { note(1500, 0.07, { type: 'square', vol: 0.04 }); note(1500, 0.07, { type: 'square', vol: 0.04, retard: 0.14 }); },
    vole: () => { note(240, 0.12, { type: 'sawtooth', vol: 0.06, filtre: 900 }); note(180, 0.2, { type: 'sawtooth', vol: 0.06, filtre: 800, retard: 0.12, vers: 110 }); },
    tempete: () => { for (let i = 0; i < 6; i++) note(200 + ((i * 377) % 500), 0.06, { type: 'square', vol: 0.025, filtre: 700, retard: i * 0.05 }); },
    victoire: () => [523, 659, 784, 1047, 1319].forEach((f, i) => note(f, 0.26, { type: 'triangle', vol: 0.1, retard: i * 0.12 })),
    defaite: () => [392, 330, 262].forEach((f, i) => note(f, 0.3, { vol: 0.1, retard: i * 0.18 })),
    tic: () => note(1250, 0.04, { type: 'square', vol: 0.03 }),
    arrive: () => { note(660, 0.12, { vol: 0.08 }); note(880, 0.16, { vol: 0.08, retard: 0.1 }); },
    part: () => { note(880, 0.12, { vol: 0.06 }); note(587, 0.16, { vol: 0.06, retard: 0.1 }); },
    tour: () => { note(988, 0.1, { vol: 0.06 }); note(1319, 0.12, { vol: 0.05, retard: 0.08 }); },
    non: () => note(180, 0.12, { type: 'triangle', vol: 0.06 }),
    autocollant: () => [1047, 1319, 1568, 2093].forEach((f, i) => note(f, 0.12, { type: 'sine', vol: 0.07, retard: i * 0.05 }))
  };

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.textContent = prog.options.son ? '🔊' : '🔇';
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    majBoutonsSon();
    sauverReglages();
    sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Dessins (canvas, aucun texte dans les images)
  // ---------------------------------------------------------------------

  function rond(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
  function rr(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
  }
  function graineHasard(g) { let a = g >>> 0; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; }

  // Cargo vu de dessus, nez vers la droite (angle a), forme f, couleur k.
  function cargo(c, x, y, z, a, k, f, flamme) {
    c.save();
    c.translate(x, y); c.rotate(a || 0); c.scale(z, z);
    const coul = COUL[k] || '#ccc', fonce = COUL_F[k] || '#555';
    if (flamme) {
      const l = 7 + flamme * 9;
      const g = c.createLinearGradient(-10, 0, -10 - l, 0);
      g.addColorStop(0, '#fff6c0'); g.addColorStop(0.4, '#ffb347'); g.addColorStop(1, '#ff5a1f00');
      c.fillStyle = g;
      c.beginPath(); c.moveTo(-9, -3.5); c.lineTo(-10 - l, 0); c.lineTo(-9, 3.5); c.closePath(); c.fill();
    }
    c.lineWidth = 1.4; c.strokeStyle = fonce; c.fillStyle = coul;
    c.beginPath();
    switch (f) {
      case 1: // flèche
        c.moveTo(13, 0); c.lineTo(-6, -8); c.lineTo(-3, 0); c.lineTo(-6, 8); c.closePath(); break;
      case 2: // double coque
        rr(c, -10, -9, 18, 6, 3); c.fill(); c.stroke(); c.beginPath(); rr(c, -10, 3, 18, 6, 3); c.fill(); c.stroke();
        c.beginPath(); c.rect(-4, -4, 8, 8); break;
      case 3: // long courrier avec conteneurs
        rr(c, -12, -5, 22, 10, 4); c.fill(); c.stroke();
        c.fillStyle = '#ffffffaa'; [-8, -3, 2].forEach((u) => { c.fillRect(u, -3.5, 4, 7); });
        c.fillStyle = coul; c.beginPath(); c.moveTo(10, -4); c.lineTo(14, 0); c.lineTo(10, 4); c.closePath(); break;
      case 4: // soucoupe
        c.ellipse(0, 0, 12, 8, 0, 0, Math.PI * 2); break;
      case 5: // étoile filante
        for (let i = 0; i < 10; i++) { const r = i % 2 ? 5 : 12, t = i * Math.PI / 5; c.lineTo(Math.cos(t) * r, Math.sin(t) * r); }
        c.closePath(); break;
      default: // cargo classique
        c.moveTo(12, 0); c.quadraticCurveTo(10, -7, 2, -7); c.lineTo(-9, -7); c.lineTo(-9, 7); c.lineTo(2, 7); c.quadraticCurveTo(10, 7, 12, 0); c.closePath();
    }
    c.fill(); c.stroke();
    // cockpit
    c.fillStyle = '#dff7ff'; rond(c, f === 4 ? 0 : 4, 0, 2.8); c.fill();
    c.fillStyle = '#ffffff99'; rond(c, f === 4 ? -0.8 : 3.3, -0.9, 1); c.fill();
    if (f === 0 || f === 4) { c.fillStyle = fonce; c.fillRect(-7, -9, 6, 2.5); c.fillRect(-7, 6.5, 6, 2.5); }
    c.restore();
  }

  // Astéroïde bosselé (forme fixe par graine), cristaux dessinés dessus.
  function asteroide(c, x, y, r, v, graine, dore, t) {
    const h = graineHasard(graine * 7919 + 13);
    c.save();
    c.translate(x, y);
    c.rotate((t || 0) * 0.0003 + graine);
    c.beginPath();
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * Math.PI * 2, rr2 = r * (0.78 + h() * 0.3);
      if (i === 0) c.moveTo(Math.cos(a) * rr2, Math.sin(a) * rr2); else c.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2);
    }
    c.closePath();
    const g = c.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    if (dore) { g.addColorStop(0, '#fff3b0'); g.addColorStop(1, '#c98b12'); } else { g.addColorStop(0, '#b9a99a'); g.addColorStop(1, '#5d4b42'); }
    c.fillStyle = g; c.fill();
    c.lineWidth = Math.max(1, r * 0.08); c.strokeStyle = dore ? '#7a4f00' : '#3a2c26'; c.stroke();
    c.fillStyle = dore ? '#b07800' : '#4a3a33';
    rond(c, r * 0.3, r * 0.25, r * 0.16); c.fill();
    rond(c, -r * 0.35, r * 0.1, r * 0.1); c.fill();
    c.restore();
    // cristaux (autant que de cristaux à gagner, 5 pour un doré)
    const n = Math.min(5, v);
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.62;
      const cx = x + Math.cos(a) * r * 0.55, cy = y + Math.sin(a) * r * 0.55 + r * 0.05;
      cristal(c, cx, cy, Math.max(3, r * 0.3), dore ? '#ffe36b' : '#5fe0ef');
    }
  }

  function cristal(c, x, y, k, coul) {
    c.beginPath(); c.moveTo(x, y - k); c.lineTo(x + k * 0.6, y - k * 0.15); c.lineTo(x, y + k); c.lineTo(x - k * 0.6, y - k * 0.15); c.closePath();
    c.fillStyle = coul; c.fill(); c.lineWidth = 1; c.strokeStyle = '#ffffffcc'; c.stroke();
  }

  // Tourbillon des astéroïdes qui tournent.
  function tourbillon(c, x, y, r, t) {
    c.save(); c.translate(x, y); c.rotate((t || 0) * 0.002);
    c.strokeStyle = '#ffd84d'; c.lineWidth = Math.max(1.5, r * 0.12); c.lineCap = 'round';
    c.beginPath(); c.arc(0, 0, r * 1.25, 0.2, 1.6); c.stroke();
    c.beginPath(); c.arc(0, 0, r * 1.25, Math.PI + 0.2, Math.PI + 1.6); c.stroke();
    const p = (u) => [Math.cos(u) * r * 1.25, Math.sin(u) * r * 1.25];
    [1.6, Math.PI + 1.6].forEach((u) => {
      const q = p(u);
      c.beginPath(); c.moveTo(q[0], q[1]); c.lineTo(q[0] - Math.sin(u) * r * 0.35 + Math.cos(u) * r * 0.2, q[1] + Math.cos(u) * r * 0.35 + Math.sin(u) * r * 0.2); c.stroke();
    });
    c.restore();
  }

  // Trou noir : violet = doubleur (flèches vers l'extérieur), bleu = diviseur.
  function trouNoir(c, x, y, r, k, t) {
    const coul = k === 'd' ? '#c46bff' : '#4fb0ff';
    c.save(); c.translate(x, y);
    for (let i = 0; i < 3; i++) {
      c.save(); c.rotate((t || 0) * (k === 'd' ? 0.003 : -0.003) + i * 2.1);
      c.strokeStyle = coul; c.globalAlpha = 0.85 - i * 0.22; c.lineWidth = Math.max(1.5, r * 0.16);
