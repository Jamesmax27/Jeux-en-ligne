  }

  // Pirate robot : petite soucoupe sombre avec une pince et un œil rouge.
  function pirate(c, x, y, r, t) {
    c.save(); c.translate(x, y + Math.sin((t || 0) * 0.004) * r * 0.1);
    c.fillStyle = '#2b2b3a'; c.strokeStyle = '#ff4d5e'; c.lineWidth = Math.max(1.2, r * 0.1);
    c.beginPath(); c.ellipse(0, r * 0.15, r, r * 0.45, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = '#44445a'; c.beginPath(); c.arc(0, r * 0.05, r * 0.55, Math.PI, 0); c.fill(); c.stroke();
    c.fillStyle = '#ff4d5e'; rond(c, 0, -r * 0.12, r * 0.18); c.fill();
    c.fillStyle = '#fff'; rond(c, r * 0.05, -r * 0.17, r * 0.06); c.fill();
    c.strokeStyle = '#9aa0b8'; c.beginPath(); c.moveTo(-r * 0.5, r * 0.5); c.lineTo(-r * 0.75, r * 0.95); c.lineTo(-r * 0.45, r * 1.05); c.stroke();
    c.beginPath(); c.moveTo(r * 0.5, r * 0.5); c.lineTo(r * 0.75, r * 0.95); c.lineTo(r * 0.45, r * 1.05); c.stroke();
    c.restore();
  }

  // Balise : petit mât avec un fanion de la couleur de son propriétaire.
  function balise(c, x, y, r, k, t) {
    c.save(); c.translate(x, y);
    c.strokeStyle = '#e8e4ff'; c.lineWidth = Math.max(1.4, r * 0.1);
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -r * 1.5); c.stroke();
    c.fillStyle = COUL[k] || '#fff';
    c.beginPath(); c.moveTo(0, -r * 1.5); c.lineTo(r * 0.9, -r * 1.25); c.lineTo(0, -r * 1.0); c.closePath(); c.fill();
    const a = 0.5 + 0.5 * Math.sin((t || 0) * 0.008);
    c.globalAlpha = a; c.fillStyle = '#fff'; rond(c, 0, -r * 1.55, r * 0.18); c.fill();
    c.restore();
  }

  function etoile5(c, x, y, r, coul) {
    c.beginPath();
    for (let i = 0; i < 10; i++) { const rr2 = i % 2 ? r * 0.45 : r, a = -Math.PI / 2 + i * Math.PI / 5; c.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
    c.closePath(); c.fillStyle = coul; c.fill();
  }

  // Couronne du chef (salon).
  function couronne(c, x, y, k) {
    c.save(); c.translate(x, y);
    c.fillStyle = '#ffd84d'; c.strokeStyle = '#a06a00'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-k, 0); c.lineTo(-k, -k * 0.7); c.lineTo(-k * 0.5, -k * 0.3); c.lineTo(0, -k * 0.95); c.lineTo(k * 0.5, -k * 0.3); c.lineTo(k, -k * 0.7); c.lineTo(k, 0); c.closePath();
    c.fill(); c.stroke();
    c.restore();
  }

  // Fond étoilé et nébuleuse (écran titre, niveaux, jeu).
  const ETOILES = (() => { const h = graineHasard(42), l = []; for (let i = 0; i < 160; i++) l.push([h(), h(), h() * 1.4 + 0.3, h()]); return l; })();
  // Le fond (dégradé et nuages) est peint une fois dans une image gardée.
  const cacheCiel = new Map();
  function fondCiel(w, h, neb) {
    const cle = Math.round(w) + 'x' + Math.round(h) + '|' + neb;
    let off = cacheCiel.get(cle);
    if (off) return off;
    if (cacheCiel.size > 4) cacheCiel.clear();
    off = document.createElement('canvas');
    off.width = Math.max(1, Math.round(w)); off.height = Math.max(1, Math.round(h));
    const c = off.getContext('2d');
    const N2 = NEBULEUSES[neb] || NEBULEUSES[0];
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, N2.haut); g.addColorStop(1, N2.bas);
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    const hz = graineHasard(7 + neb * 31);
    for (let i = 0; i < 7; i++) {
      const x = hz() * w, y = hz() * h, r = (0.25 + hz() * 0.35) * Math.max(w, h);
      const gg = c.createRadialGradient(x, y, 0, x, y, r);
      gg.addColorStop(0, N2.nuages[i % 2] + '40'); gg.addColorStop(1, N2.nuages[i % 2] + '00');
      c.fillStyle = gg; c.fillRect(0, 0, w, h);
    }
    cacheCiel.set(cle, off);
    return off;
  }
  function ciel(c, w, h, neb, t) {
    c.drawImage(fondCiel(w, h, neb), 0, 0, w, h);
    ETOILES.forEach((s) => {
      const a = 0.45 + 0.55 * Math.abs(Math.sin((t || 0) * 0.001 * (0.3 + s[3]) + s[3] * 9));
      c.globalAlpha = a; c.fillStyle = '#fff';
      c.fillRect(s[0] * w, s[1] * h, s[2], s[2]);
    });
    c.globalAlpha = 1;
  }

  function soleil(c, x, y, r, coul, t) {
    const g = c.createRadialGradient(x, y, r * 0.2, x, y, r * 2.4);
    g.addColorStop(0, coul + 'ff'); g.addColorStop(0.35, coul + '66'); g.addColorStop(1, coul + '00');
    c.fillStyle = g; rond(c, x, y, r * 2.4); c.fill();
    const g2 = c.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
    g2.addColorStop(0, '#ffffff'); g2.addColorStop(1, coul);
    c.fillStyle = g2; rond(c, x, y, r * (1 + 0.03 * Math.sin((t || 0) * 0.003))); c.fill();
  }

  // Écran titre : étoile, ceinture en perspective, cargos, nébuleuse.
  function dessinerTitre(t) {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    t = t || 0;
    ciel(c, w, h, 3, t);
    const large = w > h;
    const cx = w / 2, cy = h * (large ? 0.5 : 0.4), rx = Math.min(w * 0.46, large ? 290 : 330), ry = rx * (large ? 0.3 : 0.38);
    // arrière de l'anneau
    const items = [];
    for (let i = 0; i < 22; i++) {
      const a = i / 22 * Math.PI * 2 + t * 0.00006;
      items.push({ a: a, x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry, i: i });
    }
    c.strokeStyle = '#ffffff22'; c.lineWidth = 10;
    c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); c.stroke();
    const dessinerItem = (it) => {
      const z = 0.7 + 0.45 * (Math.sin(it.a) + 1) / 2;
      if (it.i % 5 === 1) cargo(c, it.x, it.y - 4, 1.5 * z, it.a + Math.PI / 2, ((it.i / 5) | 0) % 4, (it.i * 7) % 6, 0.6);
      else if (it.i % 7 === 3) asteroide(c, it.x, it.y, 14 * z, 5, it.i, true, t);
      else asteroide(c, it.x, it.y, (9 + (it.i * 5) % 7) * z, 1 + it.i % 3, it.i, false, t);
    };
    items.filter((it) => Math.sin(it.a) < 0).forEach(dessinerItem);
    soleil(c, cx, cy, Math.min(w, h) * 0.07, '#ffd36b', t);
    items.filter((it) => Math.sin(it.a) >= 0).forEach(dessinerItem);
    // un grand cargo au premier plan, avec sa traînée
    const bx = cx - rx * 0.55 + Math.sin(t * 0.0008) * 6, by = cy + ry + 34;
    cargo(c, bx, by, 3.2, -0.25, 0, 3, 1);
    trouNoir(c, cx + rx * 0.82, cy - ry - 30, 20, 'd', t);
    pirate(c, cx + rx * 0.62, cy + ry + 26, 13, t);
  }

  // ---------------------------------------------------------------------
  //  État de l'écran
  // ---------------------------------------------------------------------

  let ecran = 'titre';
  let partie = null;
  let session = null;          // 'solo' ou 'ligne'
  let niveau = 1;
  let vue = null;              // état affiché
  let enPartie = false;
  let enPause = false;
  let jeton = 0;
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let anim = null;             // déplacement en cours d'un cargo
  let particules = [];
  let flottants = [];          // « +3 » qui s'envolent
  let choix = [];              // cartes choisies (indices)
  let op = '+';
  let modeBalise = false;
  let geo = null;
  let gainsPartie = null;      // autocollants gagnés pendant la partie

  // ---------------------------------------------------------------------
  //  Écrans
  // ---------------------------------------------------------------------

  let rafTitre = 0;
  function animerTitre(t) {
    rafTitre = 0;
    if (ecran === 'jeu') return;
    dessinerTitre(t);
    rafTitre = requestAnimationFrame(animerTitre);
  }

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'hangar', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom !== 'jeu') { dessinerTitre(performance.now()); if (!rafTitre) rafTitre = requestAnimationFrame(animerTitre); }
    if (nom === 'titre') majTitre();
    if (nom === 'jeu') relancerBoucle();
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    el.classList.toggle('haut', salonOuvert() || $('voile-fin').classList.contains('actif'));
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  function formeDe(s) {
    if (partie && s === partie.siege) return CARGOS[prog.cargo].forme;
    return 0;
  }

  function peindreCargo(cv, s, w, h) {
    const c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    cargo(c, w / 2 + 4, h / 2, Math.min(w, h) / 22, 0, s, formeDe(s), 0.5);
  }

  // Cartes des 4 places, en haut de l'écran, et places du salon.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'cargo'; cv.width = 108; cv.height = 72;
      const pts = document.createElement('span'); pts.className = 'pts';
      const tag = document.createElement('span'); tag.className = 'tag';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 48; cour.height = 36;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 24, 32, 20);
      d.append(cv, pts, tag, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 120; cv.height = 100;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché : pseudo d'un vrai joueur en ligne (partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  // Nom d'une place dans les phrases : pseudo, « toi », ou « le cargo orange ».
  function nomPhrase(s) {
    const info = siegesActuels()[s] || {};
    if (partie && s === partie.siege) return tr('cargo.toi');
    if (info.humain && info.nom) return info.nom;
    return tr('cargo.' + s);
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !e.fini ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const pts = e ? e.sc[s] : 0;
      const ptsEl = d.querySelector('.pts');
      const texte = String(pts);
      if (ptsEl.dataset.v !== texte) { ptsEl.dataset.v = texte; ptsEl.innerHTML = ICONE_CRISTAL; const sp = document.createElement('span'); sp.textContent = nb(pts); ptsEl.appendChild(sp); }
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef && session === 'ligne');
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      const cv = d.querySelector('canvas.cargo'), cle = String(formeDe(s));
      if (cv.dataset.f !== cle) { cv.dataset.f = cle; peindreCargo(cv, s, 108, 72); }
      d.setAttribute('aria-label', tr('place.aria.' + role, { cargo: tr('cargo.' + s), n: pts }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || e.fini) return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) return tr('tour.toi');
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.' + s);
  }

  function majInfos() {
    let info = '';
    const e = vue;
    const tourTxt = e ? ' · ' + tr('jeu.tour', { n: Math.min(e.tours, e.rd + 1), total: e.tours }) : '';
    if (session === 'solo') info = tr('neb.' + nebuleuseDe(niveau)) + ' · ' + tr('jeu.niveau', { n: niveau, total: NIVEAUX.length }) + tourTxt;
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche }) + tourTxt;
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  function monTour() {
    return !!(partie && vue && !vue.fini && !attenteTuto && !enPause && partie.phase === 'jeu' && partie.siege >= 0 && R.aQui(vue) === partie.siege && partie.monTour() && !anim);
  }

  // ---------------------------------------------------------------------
  //  Main du joueur : cartes, opérations, calcul en direct
  // ---------------------------------------------------------------------

  let mainCle = '';
  function majMain() {
    const e = vue, moi = partie ? partie.siege : -1;
    const main = $('main');
    const visible = !!(e && moi >= 0 && e.m[moi]);
    main.style.visibility = visible ? 'visible' : 'hidden';
    if (!visible) return;
    const m = e.m[moi], h = e.h[moi];
    const cle = m.join(',') + '|' + h;
    const cartes = $('cartes');
    if (cle !== mainCle || !cartes.children.length) {
      const nouvelle = mainCle !== '';
      mainCle = cle;
      choix = []; modeBalise = false;
      cartes.textContent = '';
      m.forEach((v, i) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'carte-p' + (i === h ? ' cachee' : '') + (nouvelle ? ' nouvelle' : '');
        if (nouvelle) b.style.animationDelay = (i * 0.08) + 's';
        b.dataset.i = String(i);
        b.textContent = i === h ? '?' : nb(v);
        b.setAttribute('aria-label', i === h ? tr('carte.cacheeAria', { n: i + 1 }) : tr('carte.aria', { n: i + 1, v: v }));
        b.addEventListener('click', () => { audio(); toucherCarte(i); });
        cartes.appendChild(b);
      });
      if (nouvelle && h >= 0) sons.tempete();
    }
    const a = monTour();
    main.classList.toggle('attend', !a);
    [...cartes.children].forEach((b, i) => b.classList.toggle('choisie', choix.indexOf(i) >= 0));
    if (e.ops.indexOf(op) < 0) op = '+';
    document.querySelectorAll('.op').forEach((b) => {
      b.hidden = e.ops.indexOf(b.dataset.op) < 0;
      b.classList.toggle('choisie', !modeBalise && b.dataset.op === op);
      b.disabled = modeBalise;
    });
    const bal = $('btn-balise');
    bal.hidden = !(e.bal[moi] > 0) && !modeBalise;
    bal.textContent = tr('bouton.balise', { n: e.bal[moi] });
    bal.classList.toggle('choisie', modeBalise);
    bal.disabled = !a;
    majCalcul();
  }

  function apercuCoup() {
    const e = vue, moi = partie ? partie.siege : -1;
    if (!e || moi < 0) return null;
    const m = e.m[moi], h = e.h[moi];
    if (modeBalise) {
      if (choix.length !== 1) return { balise: true, pret: false };
      const i = choix[0];
      if (i === h) return { balise: true, pret: false, cache: true, c: i };
      const cible = O.mod(e.pos[moi] + m[i], e.N), ia = O.astSur(e, cible);
      return { balise: true, pret: true, c: i, v: m[i], cible: cible, ok: ia >= 0 && e.as[ia].b < 0 };
    }
    if (choix.length !== 2) return { pret: false };
    const a = choix[0], b = choix[1];
    const cache = a === h || b === h;
    const r = O.resultat(op, m[a], m[b]);
    if (cache) return { pret: true, cache: true, a: a, b: b, x: m[a], y: m[b], h: h };
    const tj = O.trajet(e, e.pos[moi], r), ia = r > 0 ? O.astSur(e, tj.fin) : -1;
    return { pret: true, a: a, b: b, x: m[a], y: m[b], r: r, tj: tj, mine: O.minable(e, moi, ia) ? e.as[ia].v : 0, reserve: ia >= 0 && !O.minable(e, moi, ia), pirate: O.pirateProche(e, tj.fin) };
  }

  function majCalcul() {
    const p = apercuCoup();
    const expr = $('calcul-expr'), aide = $('calcul-aide');
    let texte = '', conseil = '', classe = '';
    if (!p) { /* rien */ } else if (p.balise) {
      if (p.cache) { texte = '?'; conseil = tr('calcul.baliseCachee'); classe = 'mauvais'; }
      else if (!p.pret) conseil = tr('calcul.choisisBalise');
      else { texte = nb(p.v); conseil = p.ok ? tr('calcul.baliseOk') : tr('calcul.baliseNon'); classe = p.ok ? 'bon' : 'mauvais'; }
    } else if (!p.pret) {
      conseil = monTour() ? tr('calcul.choisis') : '';
    } else {
      const g = (v, i) => (i === (p.h)) ? '?' : nb(v);
      const ordre = op === '-' && !p.cache && p.y > p.x ? [p.y, p.x, p.b, p.a] : [p.x, p.y, p.a, p.b];
      texte = g(ordre[0], ordre[2]) + ' ' + SIGNE[op] + ' ' + g(ordre[1], ordre[3]) + ' = ' + (p.cache ? '?' : nb(p.r));
      if (p.cache) { conseil = tr('calcul.cachee'); classe = 'mauvais'; }
      else if (p.mine) { conseil = tr('calcul.vise', { n: p.mine }) + (p.pirate ? ' ' + tr('calcul.pirate') : ''); classe = 'bon'; }
      else if (p.reserve) { conseil = tr('calcul.reserve'); classe = 'mauvais'; }
      else { conseil = tr('calcul.derive') + (p.pirate ? ' ' + tr('calcul.pirate') : ''); classe = 'mauvais'; }
    }
    if (expr.textContent !== texte) expr.textContent = texte;
    if (aide.textContent !== conseil) aide.textContent = conseil;
    aide.className = classe;
    const pret = !!(p && p.pret && monTour() && (!p.balise || p.ok));
    $('btn-propulser').disabled = !pret;
    const cleBouton = modeBalise ? 'bouton.poserBalise' : 'bouton.propulser';
    if ($('btn-propulser').dataset.cle !== cleBouton) { $('btn-propulser').dataset.cle = cleBouton; $('btn-propulser').textContent = tr(cleBouton); }
  }

  function toucherCarte(i) {
    if (!vue || !partie || partie.siege < 0) return;
    sons.carte();
    const k = choix.indexOf(i);
    if (k >= 0) choix.splice(k, 1);
    else if (modeBalise) choix = [i];
    else { choix.push(i); if (choix.length > 2) choix.shift(); }
    majMain();
  }

  function choisirOp(o) {
    if (!vue || vue.ops.indexOf(o) < 0 || modeBalise) return;
    op = o;
    sons.op();
    majMain();
  }

  function basculerBalise() {
    if (!vue || !partie || partie.siege < 0) return;
    const moi = partie.siege;
    if (!modeBalise && !(vue.bal[moi] > 0)) { sons.non(); return; }
    modeBalise = !modeBalise;
    choix = choix.slice(0, modeBalise ? 1 : 2);
    sons.clic();
    majMain();
  }

  function jouerCoup() {
    if (!monTour()) { sons.non(); return; }
    const p = apercuCoup();
    if (!p || !p.pret) { sons.non(); toast(tr(p && p.cache ? 'calcul.baliseCachee' : (modeBalise ? 'calcul.choisisBalise' : 'calcul.choisis'))); return; }
    let action;
    if (modeBalise) {
      if (!p.ok) { sons.non(); toast(tr('calcul.baliseNon')); return; }
      action = { k: 'b', c: p.c };
    } else action = { k: 'p', a: p.a, b: p.b, o: op };
    if (!R.valide(vue, partie.siege, action)) { sons.non(); toast(tr(modeBalise ? 'calcul.baliseNon' : 'calcul.choisis')); return; }
    if (partie.jouer(action)) {
      if (action.k === 'p') sons.propulse(); else sons.balise();
      choix = []; modeBalise = false;
    }
  }

  // ---------------------------------------------------------------------
  //  Plateau : l'anneau de la ceinture
  // ---------------------------------------------------------------------

  function geometrie(e, w, h) {
    const R0 = Math.max(60, Math.min(w, h) / 2 - Math.max(34, Math.min(w, h) * 0.12));
    const pas = 2 * Math.PI * R0 / e.N;
    return { cx: w / 2, cy: h / 2, R: R0, pas: pas, ar: Math.min(pas * 0.44, 22), cs: Math.min(pas * 0.42, 18) };
  }
  const angleCase = (e, c) => -Math.PI / 2 + 2 * Math.PI * c / e.N;
  function pointCase(g, e, c, dr) {
    const a = angleCase(e, c), r = g.R + (dr || 0);
    return [g.cx + Math.cos(a) * r, g.cy + Math.sin(a) * r];
  }

  // Position d'un cargo : sur sa case, plusieurs cargos sur la même case se rangent vers l'intérieur.
  function posCargo(g, e, s, angle) {
    let rang = 0;
    for (let k = 0; k < s; k++) if (e.pos[k] === e.pos[s] && !(anim && anim.s === k)) rang++;
    const r = g.R - g.ar - g.cs * (0.7 + rang * 1.05);
    return [g.cx + Math.cos(angle) * r, g.cy + Math.sin(angle) * r];
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const neb = session === 'solo' ? nebuleuseDe(niveau) : (vue ? nebuleuseDe(vue.n + 1) : 0);
    ciel(c, w, h, neb, t);
    if (!vue) { geo = null; return; }
    const e = vue, g = geometrie(e, w, h);
    geo = g;
    const N2 = NEBULEUSES[neb];
    soleil(c, g.cx, g.cy, Math.min(g.R * 0.2, 40), N2.etoile, t);
    // l'anneau
    c.strokeStyle = '#ffffff1c'; c.lineWidth = g.ar * 2.2;
    rond(c, g.cx, g.cy, g.R); c.stroke();
    for (let k = 0; k < e.N; k++) {
      const p = pointCase(g, e, k);
      c.fillStyle = k % 5 === 0 ? '#ffffff55' : '#ffffff2a';
      rond(c, p[0], p[1], k % 5 === 0 ? 2.6 : 1.8); c.fill();
    }
    const moi = partie ? partie.siege : -1;
    const apercu = moi >= 0 && monTour() ? apercuCoup() : null;
    // trajet prévu
    if (apercu && apercu.pret && !apercu.cache) {
      if (apercu.balise) {
        const p = pointCase(g, e, apercu.cible);
        c.strokeStyle = apercu.ok ? '#9cf08a' : '#ffb36b'; c.lineWidth = 3; c.setLineDash([5, 4]);
        rond(c, p[0], p[1], g.ar * 1.35); c.stroke(); c.setLineDash([]);
      } else {
        const tj = apercu.tj, vus = {};
        tj.cases.forEach((k, i) => {
          if (vus[k]) return; vus[k] = 1;
          const p = pointCase(g, e, k);
          c.fillStyle = (tj.trou >= 0 && tj.cases.indexOf(tj.trou) < i) ? (tj.k === 'd' ? '#d79bffcc' : '#7ec8ffcc') : COUL[moi] + 'cc';
          rond(c, p[0], p[1], 3.2 + 1.5 * Math.sin(t * 0.008 - i * 0.5)); c.fill();
        });
        const p = pointCase(g, e, tj.fin);
        c.strokeStyle = apercu.mine ? '#9cf08a' : '#ffb36b'; c.lineWidth = 3.5;
        rond(c, p[0], p[1], g.ar * 1.4 + 2 * Math.sin(t * 0.01)); c.stroke();
      }
    }
    // trous noirs
    e.tn.forEach((tn) => { const p = pointCase(g, e, tn.c); trouNoir(c, p[0], p[1], g.ar * 1.05, tn.k, t); });
    // astéroïdes (et celui qu'un cargo est en train de rejoindre)
    const liste = e.as.slice();
    if (anim && anim.av && !anim.arrive) liste.push(anim.av);
    liste.forEach((a) => {
      const p = pointCase(g, e, a.c);
      if (a.t) tourbillon(c, p[0], p[1], g.ar, t);
      asteroide(c, p[0], p[1], g.ar * (a.v >= 5 ? 1.12 : 0.85 + a.v * 0.06), a.v, a.c * 3 + a.v, a.v >= 5, t);
      if (a.b >= 0) balise(c, p[0] + g.ar * 0.5, p[1] - g.ar * 0.3, g.ar * 0.7, a.b, t);
    });
    // pirates (un peu vers l'extérieur s'ils partagent une case)
    e.pi.forEach((pc) => { const occupe = O.astSur(e, pc) >= 0; const p = pointCase(g, e, pc, occupe ? g.ar * 1.2 : 0); pirate(c, p[0], p[1], g.ar * 0.8, t); });
    // distances des astéroïdes depuis mon cargo, à mon tour
    if (moi >= 0 && e.m[moi] && partie && partie.phase === 'jeu' && R.aQui(e) === moi && !anim && !e.fini) {
      const taille = Math.max(11, Math.min(16, g.pas * 0.42));
      c.font = '800 ' + taille + 'px system-ui, sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      e.as.forEach((a) => {
        const d = O.mod(a.c - e.pos[moi], e.N) || e.N;   // sur ma case : il faut faire le tour
        const p = pointCase(g, e, a.c, g.ar + taille * 0.95);
        const lib = nb(d), lw = c.measureText(lib).width + 8;
        c.fillStyle = O.minable(e, moi, O.astSur(e, a.c)) ? '#0d0a24dd' : '#3a1020dd';
        rr(c, p[0] - lw / 2, p[1] - taille * 0.7, lw, taille * 1.4, 6); c.fill();
        c.strokeStyle = a.v >= 5 ? '#ffd84d' : '#5fe0ef'; c.lineWidth = 1.5; c.stroke();
        c.fillStyle = '#fff'; c.fillText(lib, p[0], p[1] + 1);
      });
    }
    // cargos
    for (let s = 0; s < PLACES; s++) {
      let angle = angleCase(e, e.pos[s]), flamme = 0;
      if (anim && anim.s === s) {
        const p = Math.min(1, (t - anim.t0) / anim.dur);
        const fait = anim.cases.length * easeInOut(p);
        angle = angleCase(e, anim.d) + 2 * Math.PI / e.N * fait;
        flamme = p < 1 ? 1 : 0;
        const pasFait = Math.floor(fait);
        if (pasFait > anim.pas) { anim.pas = pasFait; if (anim.cases.length <= 24) sons.pas(); }
        if (p >= 1 && !anim.arrive) arrivee();
      }
      const pc = posCargo(g, e, s, angle);
      if (s === R.aQui(e) && partie && partie.phase === 'jeu' && !e.fini) {
        c.fillStyle = COUL[s] + '44'; rond(c, pc[0], pc[1], g.cs * 1.25 + 2 * Math.sin(t * 0.008)); c.fill();
      }
      cargo(c, pc[0], pc[1], g.cs / 13, angle + Math.PI / 2, s, formeDe(s), flamme);
      if (s === moi) { c.strokeStyle = '#ffd84d'; c.lineWidth = 2; rond(c, pc[0], pc[1], g.cs * 1.15); c.stroke(); }
    }
    // particules et nombres qui s'envolent
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.vy *= 0.97;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      if (p.cristal) cristal(c, p.x, p.y, p.k, p.coul); else { c.fillStyle = p.coul; rond(c, p.x, p.y, p.k); c.fill(); }
      c.globalAlpha = 1;
    }
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (let i = flottants.length - 1; i >= 0; i--) {
      const f = flottants[i];
      f.vie -= dt; f.y -= 34 * dt;
      if (f.vie <= 0) { flottants.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, f.vie * 1.5);
      c.font = '900 ' + f.taille + 'px system-ui, sans-serif';
      c.lineWidth = 4; c.strokeStyle = '#0d0a24'; c.strokeText(f.texte, f.x, f.y);
      c.fillStyle = f.coul; c.fillText(f.texte, f.x, f.y);
      c.globalAlpha = 1;
    }
  }

  const easeInOut = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);

  function eclater(x, y, coul, n, cristaux) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 160;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 0.6 + Math.random() * 0.5, k: cristaux ? 3 + Math.random() * 4 : 1.5 + Math.random() * 2.5, coul: coul, cristal: cristaux && k % 2 === 0 });
    }
  }

  // Le cargo animé vient d'arriver : effets du coup.
  function arrivee() {
    const a = anim;
    a.arrive = true;
    const e = vue, d = a.der, g = geo;
    if (!e || !g) return;
    const p = pointCase(g, e, d.fin);
    if (d.gain) {
      eclater(p[0], p[1], d.gain >= 5 ? '#ffe36b' : '#5fe0ef', 22, true);
      flottants.push({ x: p[0], y: p[1] - g.ar, texte: '+' + nb(d.gain), coul: d.gain >= 5 ? '#ffd84d' : '#9cf6ff', vie: 1.3, taille: 22 });
      if (d.gain >= 5) sons.or(); else sons.mine();
      const carte = $('place-' + d.s);
      carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
    } else {
      eclater(p[0], p[1], '#ffffff', 8, false);
      sons.derive();
    }
    if (d.vole) {
      setTimeout(() => {
        sons.vole();
        const carte = $('place-' + d.s);
        carte.classList.remove('vole'); void carte.offsetWidth; carte.classList.add('vole');
        if (geo && vue) { const q = pointCase(geo, vue, d.fin); flottants.push({ x: q[0], y: q[1] - geo.ar * 2, texte: '−' + nb(1), coul: '#ff6b7a', vie: 1.3, taille: 20 }); }
      }, 250);
    }
    setTimeout(() => { if (anim === a) anim = null; majMain(); majInterface(); }, 120);
  }

  // Bulle « Léa : 4 × 3 = 12 » au centre de l'anneau.
  function montrerCoup(d) {
    const el = $('coup');
    el.style.setProperty('--c', COUL[d.s]);
    $('coup-qui').textContent = nomPhrase(d.s);
    let calc = '', effet = '';
    if (d.k === 'b') { calc = '⚑ ' + nb(d.v); effet = tr('coup.balise'); }
    else {
      const x = d.o === '-' && d.y > d.x ? d.y : d.x, y = d.o === '-' && d.y > d.x ? d.x : d.y;
      calc = nb(x) + ' ' + SIGNE[d.o] + ' ' + nb(y) + ' = ' + nb(d.r);
      if (d.trou >= 0) effet = tr(d.tk === 'd' ? 'coup.trouD' : 'coup.trouH') + ' ';
      if (d.gain) effet += tr('coup.mine', { n: d.gain });
      else if (d.reserve) effet += tr('coup.reserve');
      else effet += tr('coup.derive');
      if (d.vole) effet += ' ' + tr('coup.vole');
    }
    $('coup-calc').textContent = calc;
    $('coup-effet').textContent = effet;
    el.classList.add('actif');
    clearTimeout(montrerCoup.m);
    montrerCoup.m = setTimeout(() => el.classList.remove('actif'), 1500);
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majMain();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fini) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    anim = null; mainCle = ''; choix = []; modeBalise = false;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // Salon d'attente (en ligne) : le premier joueur arrivé lance la manche.
  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + formeDe(s);
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 120, 100);
        c.fillStyle = COUL[s] + '33'; rond(c, 60, 58, 36); c.fill();
        cargo(c, 62, 60, 2.2, 0, s, formeDe(s), 0.6);
        if (info.chef) couronne(c, 60, 24, 20);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { cargo: tr('cargo.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { cargo: nomChef ? nomChef : tr('cargo.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    anim = null; particules = []; flottants = []; mainCle = ''; choix = []; modeBalise = false;
    debutTour = Date.now();
    dernierTic = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    gainsPartie = [];
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surAction(ev) {
    const avant = ev.avant, apres = ev.apres, d = apres.der;
    if (anim && !anim.arrive) arrivee();          // coup précédent pas fini d'afficher : ses effets tout de suite
    vue = JSON.parse(JSON.stringify(apres));
    debutTour = Date.now();
    dernierTic = -1;
    if (d && d.k === 'p') {
      const cases = O.trajet(avant, avant.pos[d.s], d.r).cases;
      anim = { s: d.s, d: avant.pos[d.s], cases: cases, t0: performance.now(), dur: Math.min(850, 160 + 50 * cases.length), pas: 0, der: d, av: d.av ? Object.assign({}, d.av) : null, arrive: cases.length === 0 };
      if (!ev.moi) sons.propulse();
      if (d.trou >= 0) setTimeout(() => sons.trou(), anim.dur * 0.35);
      if (cases.length === 0) { anim = null; sons.derive(); }
    } else if (d && d.k === 'b') {
      anim = null;
      if (!ev.moi) sons.balise();
      if (geo) { const p = pointCase(geo, vue, d.cible); eclater(p[0], p[1], COUL[d.s], 14, false); }
    }
    if (d) montrerCoup(d);
    if (ev.moi && d) gagnerPendantCoup(avant, d);
    // tour de table : astéroïdes qui tournent, pirates
    if (apres.rd > avant.rd && apres.rd === 1 && !apres.fini && (apres.as.some((a) => a.t) || apres.pi.length)) {
      setTimeout(() => toast(tr('jeu.tourDeTable'), 1800), 600);
    }
    if (apres.rd > avant.rd && !apres.fini && apres.rd === apres.tours - 1) setTimeout(() => toast(tr('jeu.dernierTour'), 2000), 900);
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && !apres.fini && R.aQui(apres) === partie.siege && !ev.moi) setTimeout(() => sons.tour(), 700);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1300);
  }

  // ---------------------------------------------------------------------
  //  Autocollants de mission
  // ---------------------------------------------------------------------

  function gagnerAutocollant(id) {
    if (prog.autocollants.indexOf(id) >= 0) return;
    prog.autocollants.push(id);
    if (gainsPartie) gainsPartie.push(id);
    setTimeout(() => { toast(tr('autocollant.nouveau', { nom: tr('autocollant.' + id) }), 3000); sons.autocollant(); }, 900);
    // En ligne, rien d'autre n'est sauvegardé : on garde l'autocollant tout de suite.
    if (session === 'ligne') sauver(prog.reprise, 0);
  }

  function gagnerPendantCoup(avant, d) {
    if (d.k === 'b') return;
    if (!d.gain) return;
    gagnerAutocollant('premier');
    if (d.o === '-') gagnerAutocollant('moins');
    if (d.o === 'x') gagnerAutocollant('fois');
    if (d.gain >= 5) gagnerAutocollant('or');
    if (d.av && d.av.t) gagnerAutocollant('tourne');
    if (d.trou >= 0) gagnerAutocollant('trou');
    if (d.av && d.av.b === d.s) gagnerAutocollant('balise');
    if (d.r >= avant.N) gagnerAutocollant('tour');
    if (d.cache) gagnerAutocollant('tempete');
  }

  // ---------------------------------------------------------------------
  //  Fins de secteur : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(e, moi, gagne) {
    if (!gagne) return 0;
    let autre = 0;
    for (let s = 0; s < e.sc.length; s++) if (s !== moi) autre = Math.max(autre, e.sc[s]);
    const pts = e.sc[moi];
    if (autre === 0 || pts >= autre * 1.6) return 3;
    return pts >= autre * 1.25 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      if (e.sc[s] !== prec) { rang = k + 1; prec = e.sc[s]; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 80; cv.height = 56;
      cargo(cv.getContext('2d'), 42, 28, 2.4, 0, s, formeDe(s), 0.5);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.cristauxCourt', { n: e.sc[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = moi >= 0 && e.sc[moi] === Math.max.apply(null, e.sc);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.sc[moi] : 0;
    const gagne = moi >= 0 && pts === Math.max.apply(null, e.sc);
    const egalite = gagne && e.sc.filter((x) => x === pts).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.cristaux', { n: pts }) : '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      if (gagne) {
        if (e.pi.length && e.vol[moi] === 0) gagnerAutocollant('pirates');
        let autre = 0;
        for (let s = 0; s < e.sc.length; s++) if (s !== moi) autre = Math.max(autre, e.sc[s]);
        if (pts - autre >= 6) gagnerAutocollant('avance');
        if (niveau === NIVEAUX.length) gagnerAutocollant('final');
      }
      const etoiles = etoilesPour(e, moi, gagne);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      const cargosAvant = CARGOS.filter((x) => x.etoiles <= totalEtoiles()).length;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else sauver(niveau, pts);
      const cargosApres = CARGOS.filter((x) => x.etoiles <= totalEtoiles()).length;
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      let deb = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      if (gagne && niveau % 5 === 0 && niveau < NIVEAUX.length && debloque) deb = tr('fin.nebuleuse', { neb: tr('neb.' + nebuleuseDe(niveau + 1)) });
      if (cargosApres > cargosAvant) deb += (deb ? ' ' : '') + tr('fin.cargo');
      $('fin-debloque').textContent = deb;
      if (!gagne) $('fin-debloque').textContent = tr('fin.conseil');
      $('fin-autocollants').textContent = gainsPartie && gainsPartie.length ? tr('fin.autocollants', { n: gainsPartie.length }) : '';
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil : les manches s'enchaînent.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      $('fin-autocollants').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 5 === 4 ? '#ffd84d' : COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r);
        if (b.k > 9) cristal(c, 0, 0, b.k * 0.6, b.coul); else { c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); }
        c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux, hangar
  // ---------------------------------------------------------------------

  let attenteTuto = false;

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    anim = null;
    bandeau('');
    fermerVoile('voile-pause');
    fermerVoile('voile-fin');
    fermerVoile('voile-tuto');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    tutoNumero++;
  }

  // Parcours solo : niveau n contre 3 robots.
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    gainsPartie = [];
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = null; anim = null; particules = []; flottants = []; mainCle = ''; choix = []; modeBalise = false; op = '+';
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : salon, manches, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    gainsPartie = [];
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const boite = $('grille-niveaux');
    boite.textContent = '';
    for (let nb5 = 0; nb5 < Math.ceil(NIVEAUX.length / 5); nb5++) {
      const titre = document.createElement('p');
      titre.className = 'neb-titre';
      titre.style.setProperty('--n', NEBULEUSES[nb5].nuages[0]);
      titre.textContent = tr('neb.' + nb5);
      const grille = document.createElement('div');
      grille.className = 'grille';
      for (let i = nb5 * 5; i < Math.min(NIVEAUX.length, nb5 * 5 + 5); i++) {
        const n = i + 1, ouvert = n <= prog.debloque;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
        b.style.setProperty('--n', NEBULEUSES[nb5].nuages[0]);
        const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
        const et = document.createElement('small');
        for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
        b.append(num, et);
        b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
        if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
        else b.disabled = true;
        grille.appendChild(b);
      }
      boite.append(titre, grille);
    }
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
  }

  // Dessin d'un autocollant (sans texte) : un badge rond avec son symbole.
  function peindreAutocollant(cv, id, gagne) {
    const c = cv.getContext('2d'), w = cv.width, x = w / 2, r = w * 0.44;
    c.clearRect(0, 0, w, w);
    const fonds = { premier: '#5fe0ef', moins: '#ff9a3d', fois: '#ff6fb5', or: '#ffd84d', tourne: '#a6e35a', trou: '#c46bff', balise: '#3fd6e8', tour: '#7d6ee8', pirates: '#ff4d5e', tempete: '#ffb35c', avance: '#9cf08a', final: '#ffd84d' };
    c.save();
    if (!gagne) c.globalAlpha = 0.35;
    c.fillStyle = '#ffffff'; rond(c, x, x, r); c.fill();
    c.fillStyle = gagne ? fonds[id] : '#6d66a0'; rond(c, x, x, r * 0.88); c.fill();
    c.fillStyle = '#1b1450'; rond(c, x, x, r * 0.7); c.fill();
    const k = r * 0.5;
    switch (id) {
      case 'premier': cristal(c, x, x, k, '#5fe0ef'); break;
      case 'moins': cargo(c, x, x, k / 9, 0, 0, 0, 0.5); c.fillStyle = '#ff9a3d'; c.fillRect(x - k * 0.6, x + k * 0.75, k * 1.2, k * 0.22); break;
      case 'fois': cargo(c, x, x, k / 9, -0.6, 2, 1, 1); etoile5(c, x + k * 0.7, x - k * 0.6, k * 0.35, '#ffd84d'); break;
      case 'or': asteroide(c, x, x, k * 0.9, 5, 3, true, 0); break;
      case 'tourne': asteroide(c, x, x, k * 0.6, 2, 5, false, 0); tourbillon(c, x, x, k * 0.6, 0); break;
      case 'trou': trouNoir(c, x, x, k, 'd', 0); break;
      case 'balise': asteroide(c, x - k * 0.1, x + k * 0.25, k * 0.6, 1, 8, false, 0); balise(c, x + k * 0.1, x + k * 0.1, k * 0.55, 1, 0); break;
      case 'tour': c.strokeStyle = '#7d6ee8'; c.lineWidth = k * 0.18; rond(c, x, x, k * 0.75); c.stroke(); cargo(c, x, x - k * 0.75, k / 14, 0, 3, 0, 0.6); break;
      case 'pirates': pirate(c, x, x - k * 0.1, k * 0.6, 0); c.strokeStyle = '#9cf08a'; c.lineWidth = k * 0.16; c.beginPath(); c.moveTo(x - k * 0.8, x - k * 0.8); c.lineTo(x + k * 0.8, x + k * 0.8); c.stroke(); break;
      case 'tempete': soleil(c, x, x, k * 0.42, '#ffb35c', 0); c.strokeStyle = '#ffd84d'; c.lineWidth = k * 0.12; c.beginPath(); c.moveTo(x + k * 0.2, x - k * 0.9); c.lineTo(x - k * 0.1, x); c.lineTo(x + k * 0.25, x); c.lineTo(x - k * 0.15, x + k * 0.9); c.stroke(); break;
      case 'avance': [-0.55, 0, 0.55].forEach((u, i) => cristal(c, x + u * k, x + (i === 1 ? -0.2 : 0.15) * k, k * 0.42, '#9cf08a')); break;
      case 'final': etoile5(c, x, x, k * 0.95, '#ffd84d'); couronne(c, x, x - k * 0.45, k * 0.4); break;
      default: break;
    }
    c.restore();
  }

  function ouvrirHangar() {
    const total = totalEtoiles();
    const gc = $('grille-cargos');
    gc.textContent = '';
    CARGOS.forEach((cg, i) => {
      const ouvert = total >= cg.etoiles;

      const cv = document.createElement('canvas'); cv.width = 144; cv.height = 108;

      if (!ouvert) { c.fillStyle = '#0d0a24aa'; c.fillRect(0, 0, 144, 108); }
      const nom = document.createElement('span'); nom.textContent = tr('hangar.cargo.' + i);
      const info = document.createElement('span'); info.textContent = ouvert ? (prog.cargo === i ? tr('hangar.choisi') : tr('hangar.choisir')) : tr('hangar.ferme', { n: cg.etoiles });
      b.append(cv, nom, info);

      });
      gc.appendChild(b);

    const ga = $('grille-autocollants');

    $('hangar-compte').textContent = tr('hangar.compte', { n: prog.autocollants.length, max: AUTOCOLLANTS.length });
    afficherEcran('hangar');

  function majTitre() {

    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
    majInterface();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés : une piste droite, trois cartes, une main qui touche
  //  deux cartes, puis le cargo qui avance case par case.
  // ---------------------------------------------------------------------

  // items : [case, type, valeur] ; type : a astéroïde, o doré, t tournant, d/h trou noir, p pirate
  const TUTOS = {
    base: { cartes: [3, 4, 6], ops: '+', choix: [0, 1], op: '+', items: [[7, 'a', 2], [5, 'a', 1], [10, 'a', 1]] },
    moins: { cartes: [8, 5, 6], ops: '+-', choix: [0, 1], op: '-', items: [[3, 'a', 2], [9, 'a', 1]] },
    fois: { cartes: [2, 5, 7], ops: '+-x', choix: [0, 1], op: 'x', items: [[10, 'a', 3], [4, 'a', 1]] },
    or: { cartes: [4, 2, 9], ops: '+-x', choix: [0, 1], op: '+', items: [[6, 'o', 5], [3, 'a', 1]] },
    tourne: { cartes: [2, 4, 9], ops: '+-x', choix: [0, 1], op: '+', items: [[6, 't', 2], [10, 'a', 1]], tourne: true },
    trou: { cartes: [3, 2, 7], ops: '+-x', choix: [0, 1], op: '+', items: [[2, 'd', 0], [8, 'a', 3], [5, 'a', 1]] },
    diviseur: { cartes: [5, 4, 8], ops: '+-x', choix: [0, 1], op: '+', items: [[3, 'h', 0], [6, 'a', 2], [9, 'a', 1]] },
    balise: { cartes: [4, 7, 2], ops: '+-x', choix: [0], op: 'b', items: [[4, 'o', 5], [9, 'a', 1]] },
    pirate: { cartes: [2, 3, 8], ops: '+-x', choix: [0, 1], op: '+', items: [[5, 'a', 2], [6, 'p', 0], [10, 'a', 2]] },
    tempete: { cartes: [5, 6, 3], ops: '+-x', cache: 1, choix: [0, 2], op: '+', items: [[8, 'a', 2], [11, 'a', 1]] }
  };

  let tutoNumero = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    const numero = ++tutoNumero;
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const W = 560, H = 330, cases = 12, x0 = 34, dx = (W - 68) / cases, yp = 120;
    const posCarte = (i) => [W / 2 - 120 + i * 92, 262];
    const opPos = { '+': [470, 222], '-': [470, 262], 'x': [470, 302] };
    // Trajet sur la piste (même règle que le jeu : le premier trou noir traversé change ce qui reste).
    const trou = d.items.find((it) => it[1] === 'd' || it[1] === 'h');
    let r = 0;
    if (d.op === 'b') r = d.cartes[d.choix[0]];
    else { const a = d.cartes[d.choix[0]], b = d.cartes[d.choix[1]]; r = d.op === '+' ? a + b : d.op === '-' ? Math.abs(a - b) : a * b; }
    let fin = 0, reste = r, pas = [], vuTrou = false;
    while (reste > 0) { fin++; reste--; pas.push(fin); if (trou && !vuTrou && fin === trou[0]) { vuTrou = true; reste = trou[1] === 'd' ? reste * 2 : Math.floor(reste / 2); } }
    const debut = performance.now();
    const T_C1 = 900, T_C2 = 1800, T_GO = 2800, T_PAS = 170, T_FIN = T_GO + pas.length * T_PAS, T_BOUCLE = T_FIN + 1800;
    function image(now) {
      if (!$('voile-tuto').classList.contains('actif') || numero !== tutoNumero) return;
      const t = (now - debut) % T_BOUCLE;
      c.setTransform(1, 0, 0, 1, 0, 0);
      ciel(c, W, H, 2, now);
      // piste
      c.strokeStyle = '#ffffff22'; c.lineWidth = 34; c.lineCap = 'round';
      c.beginPath(); c.moveTo(x0, yp); c.lineTo(x0 + dx * cases, yp); c.stroke();
      for (let k = 0; k <= cases; k++) { c.fillStyle = '#ffffff55'; rond(c, x0 + k * dx, yp, 2.4); c.fill(); }
      // éléments
      const decal = d.tourne && t > 400 ? Math.min(1, (t - 400) / 500) : 0;
      d.items.forEach((it) => {
        let cx = x0 + it[0] * dx;
        const mine = t > T_FIN && it[0] === fin && (it[1] === 'a' || it[1] === 'o' || it[1] === 't') && d.op !== 'b';
        if (it[1] === 't') cx = x0 + (it[0] - 1 + decal) * dx;
        if (mine) return;
        if (it[1] === 'a' || it[1] === 'o' || it[1] === 't') {
          if (it[1] === 't') tourbillon(c, cx, yp, 19, now);
          asteroide(c, cx, yp, it[1] === 'o' ? 25 : 19, it[2], it[0], it[1] === 'o', now);
          if (d.op === 'b' && it[0] === fin && t > T_FIN) balise(c, cx + 10, yp - 6, 15, 0, now);
        } else if (it[1] === 'd' || it[1] === 'h') trouNoir(c, cx, yp, 21, it[1], now);
        else if (it[1] === 'p') pirate(c, cx, yp - 42, 17, now);
      });
      // cargo
      let posC = 0, flamme = 0;
      if (d.op !== 'b' && t > T_GO) { posC = Math.min(pas.length, (t - T_GO) / T_PAS); flamme = t < T_FIN ? 1 : 0; }
      const xc = x0 + posC * dx;
      cargo(c, xc, yp + 40, 2.1, 0, 0, 0, flamme);
      if (d.op === 'b' && t > T_GO && t < T_FIN) {
        const p = (t - T_GO) / (T_FIN - T_GO);
        c.fillStyle = '#3fd6e8'; rond(c, x0 + p * fin * dx, yp + 10 - Math.sin(p * Math.PI) * 50, 5); c.fill();
      }
      if (t > T_FIN && d.op !== 'b' && d.items.some((it) => it[0] === fin && (it[1] === 'a' || it[1] === 'o' || it[1] === 't'))) {
        const p = Math.min(1, (t - T_FIN) / 700);
        for (let k = 0; k < 6; k++) cristal(c, x0 + fin * dx + Math.cos(k) * p * 40, yp - p * 50 + Math.sin(k * 2) * 10, 6, '#5fe0ef');
        if (d.items.some((it) => it[1] === 'p')) { c.globalAlpha = p; cristal(c, x0 + fin * dx + 30, yp - 70 - p * 20, 7, '#ff6b7a'); c.globalAlpha = 1; }
      }
      // cartes
      d.cartes.forEach((v, i) => {
        const p = posCarte(i);
        const choisie = (d.choix[0] === i && t > T_C1) || (d.choix[1] === i && t > T_C2);
        const yy = p[1] - (choisie ? 8 : 0);
        c.fillStyle = i === d.cache ? '#ff9a3d' : (choisie ? '#ffe48a' : '#ffffff');
        rr(c, p[0] - 30, yy - 36, 60, 66, 10); c.fill();
        c.strokeStyle = choisie ? '#ffd84d' : '#a99cff'; c.lineWidth = 3; c.stroke();
        c.fillStyle = '#1b1450'; c.font = '900 32px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(i === d.cache ? '?' : nb(v), p[0], yy);
      });
      // opérations
      d.ops.split('').forEach((o) => {
        const p = opPos[o];
        const ch = o === d.op && t > T_C1 + 300;
        c.fillStyle = ch ? '#ffd84d' : '#2a2160'; rr(c, p[0] - 18, p[1] - 17, 36, 34, 8); c.fill();
        c.fillStyle = ch ? '#3a2600' : '#fff'; c.font = '900 24px system-ui, sans-serif'; c.fillText(SIGNE[o], p[0], p[1] + 1);
      });
      // calcul
      if (t > T_C2 && d.op !== 'b') {
        const a = d.cartes[d.choix[0]], b = d.cartes[d.choix[1]];
        const txt = (d.op === '-' && b > a ? nb(b) + ' ' + SIGNE[d.op] + ' ' + nb(a) : nb(a) + ' ' + SIGNE[d.op] + ' ' + nb(b)) + ' = ' + nb(r);
        c.fillStyle = '#ffd84d'; c.font = '900 28px system-ui, sans-serif'; c.fillText(txt, W / 2, 40);
      } else if (t > T_C1 && d.op === 'b') {
        c.fillStyle = '#ffd84d'; c.font = '900 28px system-ui, sans-serif'; c.fillText('⚑ ' + nb(r), W / 2, 40);
      }
      // main qui touche
      let hx = W / 2, hy = 320, appui = false;
      const cible = (tt, i) => { const p = posCarte(i); return [p[0] + 8, p[1] + 10]; };
      if (t < T_C1) { const p = cible(t, d.choix[0]), k = t / T_C1; hx = W / 2 + (p[0] - W / 2) * k; hy = 330 + (p[1] - 330) * k; appui = k > 0.85; }
      else if (t < T_C2 && d.choix[1] !== undefined) { const p0 = cible(t, d.choix[0]), p1 = cible(t, d.choix[1]), k = (t - T_C1) / (T_C2 - T_C1); hx = p0[0] + (p1[0] - p0[0]) * k; hy = p0[1] + (p1[1] - p0[1]) * k; appui = k > 0.85; }
      else if (t < T_GO) { const p = d.choix[1] !== undefined ? cible(t, d.choix[1]) : cible(t, d.choix[0]); hx = p[0]; hy = p[1]; }
      if (t < T_GO + 300) main(c, hx, hy, appui);
      requestAnimationFrame(image);
    }
    requestAnimationFrame(image);
    const fermer = () => {
      $('btn-tuto-ok').onclick = null;
      fermerVoile('voile-tuto');
      sons.clic();
      apres();
    };
    $('btn-tuto-ok').onclick = () => { audio(); fermer(); };
  }

  // Main dessinée (index tendu) pour les tutoriels.
  function main(c, x, y, appui) {
    c.save(); c.translate(x, y); c.scale(appui ? 0.92 : 1, appui ? 0.92 : 1);
    c.fillStyle = '#ffe0c2'; c.strokeStyle = '#7a4a2a'; c.lineWidth = 2.5;
    c.beginPath();
    c.moveTo(-6, 0); c.lineTo(-6, 24); c.quadraticCurveTo(-18, 22, -16, 36); c.lineTo(-4, 52); c.lineTo(20, 52);
    c.quadraticCurveTo(28, 40, 26, 26); c.lineTo(26, 18); c.quadraticCurveTo(20, 14, 16, 18); c.lineTo(16, 14);
    c.quadraticCurveTo(10, 10, 6, 14); c.lineTo(6, 0); c.quadraticCurveTo(0, -8, -6, 0); c.closePath();
    c.fill(); c.stroke();
    if (appui) { c.strokeStyle = '#ffd84d'; c.lineWidth = 3; rond(c, 0, -6, 16); c.stroke(); }
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Commandes : toucher et clavier
  // ---------------------------------------------------------------------

  document.querySelectorAll('.op').forEach((b) => b.addEventListener('click', () => { audio(); choisirOp(b.dataset.op); }));
  $('btn-propulser').addEventListener('click', () => { audio(); jouerCoup(); });
  $('btn-balise').addEventListener('click', () => { audio(); basculerBalise(); });

  // Toucher un astéroïde : rappelle sa distance (aide, ne joue pas).
  $('plateau').addEventListener('pointerup', (ev) => {
    audio();
    if (!vue || !geo || !partie || partie.siege < 0) return;
    const r = $('plateau').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    let meilleur = -1, dmin = Infinity;
    vue.as.forEach((a, i) => { const p = pointCase(geo, vue, a.c), d = Math.hypot(p[0] - x, p[1] - y); if (d < dmin) { dmin = d; meilleur = i; } });
    if (meilleur < 0 || dmin > geo.ar * 2.2) return;
    const a = vue.as[meilleur], d = O.mod(a.c - vue.pos[partie.siege], vue.N);
    toast(tr('aide.asteroide', { d: d, n: a.v }));
  });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape' || ev.code === 'NumpadEnter') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const cartes = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 };
    if (cartes[ev.code] !== undefined) { ev.preventDefault(); audio(); toucherCarte(cartes[ev.code]); return; }
    const ops = { NumpadAdd: '+', NumpadSubtract: '-', NumpadMultiply: 'x', Equal: '+', Minus: '-', KeyX: 'x' };
    if (ops[ev.code]) { ev.preventDefault(); audio(); choisirOp(ops[ev.code]); return; }
    if (ev.code === 'ArrowLeft' || ev.code === 'ArrowRight' || ev.code === 'ArrowUp' || ev.code === 'ArrowDown') {
      ev.preventDefault(); audio();
      if (!vue) return;
      const liste = vue.ops.split(''), i = liste.indexOf(op);
      const sens = ev.code === 'ArrowLeft' || ev.code === 'ArrowUp' ? -1 : 1;
      choisirOp(liste[(i + sens + liste.length) % liste.length]);
      return;
    }
    if (ev.code === 'KeyB') { ev.preventDefault(); audio(); basculerBalise(); return; }
    if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement !== $('btn-propulser')) return;
      ev.preventDefault(); audio(); jouerCoup();
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-hangar').addEventListener('click', () => { audio(); sons.clic(); ouvrirHangar(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('hangar-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(performance.now()); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
