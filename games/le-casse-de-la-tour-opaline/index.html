<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {

    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();

  Arbitre.prototype.alea = function () { return this.reglages.alea ? this.reglages.alea() : Math.random(); };
  Arbitre.prototype.force = function () { return typeof this.reglages.force === 'number' ? this.reglages.force : this.r.forceEnLigne; };

  };

  // Un vrai joueur arrive. Renvoie sa place, -1 s'il attend la manche suivante,

  Arbitre.prototype.rejoindre = function (cle) {

  // Un vrai joueur s'en va : un robot reprend sa place, la partie continue ;

  Arbitre.prototype.quitter = function (cle) {

  Arbitre.prototype.valide = function (s, a) {

  // Applique une action (déjà contrôlée) et l'annonce à tous.

  // Fait jouer les robots tant que c'est à eux, jusqu'au tour d'un vrai joueur

  Arbitre.prototype.avancer = function (delai) {

  Arbitre.prototype.finirManche = function (delai) {

  // --- Partie, côté jeu -----------------------------------------------------
  // o : {
  //   regles        window.JEL_REGLES
  //   surEvenement  function (e) : { type: 'mode', mode, raison } ('connexion', 'en-ligne', 'solo') ;
  //                 { type: 'debut', reste } (arrivée dans une partie : etat, siege, sieges,
  //                 phase : 'salon' le plus souvent) ;
  //                 { type: 'salon', reste } (salon d'attente, en ligne : avant la 1re manche et
  //                 après chacune ; le chef peut lancer, sinon lancement seul dans reste ms) ;
  //                 { type: 'manche' } (nouvelle manche, etat de départ) ;
  //                 { type: 'action', siege, action, avant, apres, auto, moi } ;
  //                 { type: 'fin', resultat } (fin(etat) des règles) ;
  //                 { type: 'sieges' } (un vrai joueur arrive ou part, ou le chef change) ; { type: 'refus' }

  // Lecture : partie.mode, partie.etat, partie.siege (place du joueur, -1 en attente),
  // partie.phase ('attente', 'salon', 'jeu', 'pause'), partie.sieges() ([{ humain, moi, chef, nom }] ;
  // nom : pseudo d'un vrai joueur en ligne, ou null — robot, ou joueur sans profil : libellé du jeu),
  // partie.chef (place du chef), partie.estChef(), partie.monTour(). Commandes : lancer(),
  // lancerManche() (le chef, dans le salon), jouer(action), pause(oui), recommencer(options)
  // (solo), quitter(). La dernière partie lancée est aussi dans JEL_MULTI.derniere.

  function dansLanceur() {
    try { return racine.parent && racine.parent !== racine; } catch (e) { return false; }
  }

    this.manche = 0;

    this.siege = -1;

    this.debutPause = 0;

    if (this.o.enLigne !== false && dansLanceur()) {

      racine.addEventListener('message', this.ecoute);

      var inv = invitation();
      if (inv) { demande.partie = inv.partie; invitationUtilisee = true; }   // partie d'un ami (« Rejoindre »)
      try { racine.parent.postMessage(demande, '*'); } catch (e) { /* pas de lanceur */ }

      this.minuteurConnexion = setTimeout(function () { moi.passerSolo('delai'); }, DELAI_CONNEXION);

    }

  // Arrête tout (connexion, robots locaux, file) sans rien annoncer.
  Partie.prototype.arreter = function () {
    clearTimeout(this.minuteur);
    clearTimeout(this.minuteurReveil);
    clearTimeout(this.minuteurConnexion);
    racine.removeEventListener('message', this.ecoute);
    if (this.mode === 'connexion' || this.mode === 'en-ligne') {
      try { racine.parent.postMessage({ type: 'jel-multi', op: 'quitter' }, '*'); } catch (e) { /* pas de lanceur */ }
    }

  // Messages du lanceur : { type: 'jel-multi', m } (message du serveur) ou

  Partie.prototype.recevoirLanceur = function (e) {
    if (e.source !== racine.parent) return;
    var d = e.data;
    if (!d || d.type !== 'jel-multi') return;
    if (d.etat) {
      if (this.mode === 'connexion') this.passerSolo(d.raison || d.etat);
      else if (this.mode === 'en-ligne') { this.versSolo = true; this.pomper(); }

      if (m.t !== 'bienvenue') return;
      clearTimeout(this.minuteurConnexion);
      this.changerMode('en-ligne');

    this.file.push(m);
    this.pomper();

  // Partie contre des robots sur l'appareil (choix, pas de site, ou serveur absent).
  Partie.prototype.passerSolo = function (raison) {

    this.local.rejoindre('moi');
    this.local.demarrer();
    this.programmerReveil();
  };

  Partie.prototype.creerArbitreLocal = function () {
    var moi = this;

      envoyer: function (cle, m) { moi.file.push(m); moi.pomper(); },
      enchainer: this.o.enchainer !== false,
      delaiJoueur: Infinity,               // le joueur de l'appareil prend son temps
      force: typeof this.o.force === 'number' ? this.o.force : this.r.forceEnLigne,
      options: this.o.options || null,
    });
  };

  // Connexion coupée pendant une partie en ligne : la partie continue sur
  // l'appareil, au même point, les autres places tenues par des robots locaux.
  Partie.prototype.basculer = function () {
    racine.removeEventListener('message', this.ecoute);
    // Coupure dans le salon (ou sans place) : une nouvelle manche commence contre des robots.
    if (this.siege < 0 || !this.etat || this.phase === 'salon') { this.passerSolo('coupe'); return; }
    var a = this.creerArbitreLocal();
    var sieges = [];
    for (var s = 0; s < this.r.places; s++) sieges.push(s === this.siege ? 'moi' : null);
    a.restaurer({
      v: PROTOCOLE, sieges: sieges, attente: [], etat: copie(this.etat), n: this.n, manche: this.manche,
      phase: this.phase, finManche: Date.now() + this.r.pauseManche, echeance: null, options: this.options,
    });
    this.local = a;
    this.attendEcho = false;
    this.noms = [];
    this.humains = a.flagsSieges();
    this.changerMode('solo', 'coupe');
    this.signaler({ type: 'sieges' });
    if (a.phase === 'jeu') a.avancer(0);
    this.programmerReveil();
  };

  Partie.prototype.programmerReveil = function () {
    clearTimeout(this.minuteurReveil);
    if (!this.local || this.enPause) return;
    var t = this.local.prochainReveil();
    if (t === null || !isFinite(t)) return;
    var moi = this;
    this.minuteurReveil = setTimeout(function () {
      if (!moi.local || moi.enPause) return;
      moi.local.reveil();
      moi.programmerReveil();
    }, Math.max(0, t - Date.now()));
  };

  // Joue les messages reçus un par un : les coups des autres sont espacés de
  // delaiBot, pour qu'on les voie.
  Partie.prototype.pomper = function () {
    if (this.enPause) return;
    clearTimeout(this.minuteur);
    while (this.file.length) {
      var attente = this.libreA - Date.now();
      if (attente > 0) {
        var moi = this;
        this.minuteur = setTimeout(function () { moi.pomper(); }, attente);
        return;
      }
      var delai = this.traiter(this.file.shift());
      this.libreA = Date.now() + (this.rattrapage ? Math.min(delai, DELAI_RATTRAPAGE) : delai);
    }
    this.rattrapage = false;
    if (this.versSolo) {

      this.basculer();
    }
  };

  // Joue un message ; renvoie le temps à laisser avant le suivant (ms).
  Partie.prototype.traiter = function (m) {
    var r = this.r;

      case 'bienvenue':

        this.humains = m.sieges || [];

        this.n = m.n;
        this.manche = m.manche;
        this.options = m.o || null;
        this.etat = m.etat;
        this.phase = m.phase;
        this.attendEcho = false;
        this.signaler({ type: 'debut', reste: m.reste || 0 });
        return 0;
      case 'manche':
        this.etat = r.depart(hasard(m.g), r.places, copie(m.o));
        this.n = m.n;
        this.manche = m.manche;
        this.options = m.o || null;
        this.phase = 'jeu';
        this.attendEcho = false;
        this.signaler({ type: 'manche' });
        return 300;
      case 'action': {

    var retour = cibles.map(function (t) { return trajetSortie(t.i); });

<script>
(function () {
  'use strict';

  // =====================================================================
  //  Le Casse de la Tour Opaline — aventure et stratégie au tour par tour
  //  Quatre voleurs rivaux, chacun son tour, dans des bureaux plongés dans
  //  le noir. Solo : 20 casses contre 3 robots. En ligne : de vrais joueurs
  //  remplacent les robots (moteur commun JEL_MULTI). Les règles et les
  //  plans sont dans le bloc jel-regles.
  // =====================================================================

  const JEU = 'le-casse-de-la-tour-opaline';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = R.niveaux;                // mêmes données que les règles
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);
  const copie = (x) => JSON.parse(JSON.stringify(x));

  // Une couleur et un emblème par voleur : 0 Corbeau, 1 Renarde, 2 Vipère, 3 Lynx.
  const COUL = ['#5b8cff', '#ff6b4a', '#3fd18b', '#f5c542'];
  const COUL_F = ['#1f3a8f', '#8f2a14', '#136b40', '#8a6a0e'];
  // Les 4 immeubles (champ imm des casses) et leurs couleurs.
  const PAL = [
    { sol: '#1a2238', sol2: '#1d263f', mur: '#090c18', face: '#141b33', bord: '#3a4a80', lum: '#b9c8ff' },
    { sol: '#14263a', sol2: '#172a40', mur: '#06101a', face: '#0f2034', bord: '#2f6a8f', lum: '#9fe0ff' },
    { sol: '#2a1b30', sol2: '#2e1e35', mur: '#0f0812', face: '#1f1226', bord: '#7a4a8f', lum: '#f0c0ff' },
    { sol: '#1f1f24', sol2: '#232329', mur: '#08080a', face: '#16161b', bord: '#6a6a7a', lum: '#ffe2a0' }
  ];
  const TENUES = [0, 5, 12, 20, 35];         // étoiles nécessaires : cagoule, bonnet, chapeau, lunettes, masque doré
  const OUTILS = [0, 8, 18, 28];             // aucun, chaussons, stéthoscope, passe-partout

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#0d1330"/><circle cx="10.4" cy="8" r="1.6" fill="#0d1330"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#0d1330"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';
  const ICONE_SAC = '<svg viewBox="0 0 16 16" aria-hidden="true" width="12" height="12"><path d="M5 4c0-2 6-2 6 0l-1 1H6z" fill="#c99a4a"/><path d="M3 9c0-3 2.5-4.5 5-4.5S13 6 13 9s-1.5 6-5 6-5-3-5-6z" fill="#c99a4a"/></svg>';

  // ---------------------------------------------------------------------
  //  Tutoriels : mini-plans joués avec les vraies règles (place 0 = toi).
  //  etapes : ['m', ligne, colonne] aller, ['o'] crocheter, ['d'] dénoncer,
  //  ['p'] simple pause.
  // ---------------------------------------------------------------------
  const TUTOS = {
    base: { g: ['#######', '#E.b.o#', '#######'], etapes: [['m', 1, 3], ['m', 1, 5], ['m', 1, 3], ['m', 1, 1], ['p']] },
    garde: { g: ['#######', '#E...o#', '#.....#', '#######'], gardes: [{ r: [[2, 1], [2, 5]], v: 2 }],
      etapes: [['m', 1, 2], ['m', 1, 4], ['m', 1, 5], ['m', 1, 3], ['m', 1, 1], ['p']] },
    cachette: { g: ['#######', '#E.h.o#', '#.....#', '#######'], gardes: [{ r: [[2, 5], [2, 1]], v: 2 }],
      etapes: [['m', 1, 3], ['m', 1, 5], ['m', 1, 3], ['m', 1, 1], ['p']] },
    camera: { g: ['#######', '#E....#', '#..#..#', '#....o#', '#######'], cams: [{ p: [2, 3], d: 'hdbg' }],
      etapes: [['m', 1, 3], ['m', 1, 5], ['m', 3, 5], ['m', 3, 3], ['m', 3, 1], ['m', 1, 1], ['p']] },
    alarme: { g: ['#######', '#Eppo.#', '#######'], etapes: [['m', 1, 2], ['m', 1, 4], ['m', 1, 2], ['m', 1, 1], ['p']] },
    badge: { g: ['#######', '#E.kro#', '#######'], etapes: [['m', 1, 3], ['m', 1, 5], ['m', 1, 3], ['m', 1, 1], ['p']] },
    bleu: { g: ['#######', '#E.Kuo#', '#######'], etapes: [['m', 1, 3], ['m', 1, 5], ['m', 1, 3], ['m', 1, 1], ['p']] },
    ascenseur: { g: ['#######', '#EA#Ao#', '#######'], etapes: [['m', 1, 2], ['m', 1, 5], ['m', 1, 4], ['m', 1, 1], ['p']] },
    denoncer: { g: ['#######', '#E....#', '###.#.#', '#.....#', '#######'], gardes: [{ r: [[3, 1], [3, 5]], v: 2 }],
      cams: [{ p: [2, 4], d: 'h' }], places: 2, rival: [1, 5, 3], etapes: [['m', 1, 3], ['m', 2, 3], ['d'], ['p'], ['p']] },
    coffre: { g: ['#######', '#ExC.y#', '#######'], etapes: [['m', 1, 3], ['m', 1, 5], ['m', 1, 3], ['o'], ['m', 1, 1], ['p']] },
    sentinelle: { g: ['#######', '#E...o#', '#.....#', '#######'], gardes: [{ r: [[2, 3]], t: 's', d: 'g' }],
      etapes: [['m', 1, 2], ['m', 1, 4], ['m', 1, 4], ['m', 1, 5], ['m', 1, 5], ['m', 1, 4], ['m', 1, 2], ['m', 1, 1], ['p']] },
    laser: { g: ['#######', '#E.L.o#', '#######'], etapes: [['m', 1, 2], ['m', 1, 4], ['m', 1, 5], ['m', 1, 3], ['m', 1, 1], ['p']] },
    chien: { g: ['#######', '#E.h.o#', '#.....#', '#######'], gardes: [{ r: [[2, 5], [2, 1]], v: 3, t: 'c' }],
      etapes: [['m', 1, 3], ['p'], ['p']] }
  };

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = { etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, tutos: [], tenue: 0, outil: 0, options: { son: true } };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 999, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string' && TUTOS[x]);
      prog.tenue = entier(d.tenue, 0, TENUES.length - 1, 0);
      prog.outil = entier(d.outil, 0, OUTILS.length - 1, 0);
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
    if (TENUES[prog.tenue] > totalEtoiles()) prog.tenue = 0;
    if (OUTILS[prog.outil] > totalEtoiles()) prog.outil = 0;
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.tenue = 0;
    prog.outil = 0;
  }

  function sauver(niveauReprise, score) {
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
        debloque: prog.debloque, tutos: prog.tutos.slice(), tenue: prog.tenue, outil: prog.outil, options: { son: prog.options.son }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Son, tenue et outil se règlent aussi hors partie : jamais de nouvelle sauvegarde là.
  function sauverReglages() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: prog.options.son }, tenue: prog.tenue, outil: prog.outil }); } catch (e) { /* rien */ }
  }

  function totalEtoiles() { return prog.etoiles.reduce((a, b) => a + b, 0); }

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      const v = o.vol || 0.1;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.02, d / 4));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      osc.connect(g); sortie.connect(ac.destination);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  function souffle(d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const n = Math.floor(ac.sampleRate * d), buf = ac.createBuffer(1, n, ac.sampleRate), x = buf.getChannelData(0);
      for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = buf; fl.type = o.type || 'bandpass'; fl.frequency.value = o.f || 1200; fl.Q.value = o.q || 1;
      g.gain.value = o.vol || 0.08;
      src.connect(fl); fl.connect(g); g.connect(ac.destination);
      src.start(t);
    } catch (e) { /* son impossible */ }
  }
  const sons = {

  // ---------------------------------------------------------------------

  let partie = null;

  // Cartes des 4 places, en haut de l'écran.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');

  function majJetonsPlaces() {

  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {

  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  let moiAvant = -2;
  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const moi = moiSiege();
    if (moi !== moiAvant) { moiAvant = moi; majJetonsPlaces(); }
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !e.fin ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const j = e ? e.j[s] : null;
      const pts = j ? j.sc : 0, sac = j ? j.sac : 0;
      const p = d.querySelector('.pts');
      const texte = nb(pts);
      if (p.textContent !== texte) p.textContent = texte;
      const ts = j && j.pri > 0 ? tr('place.poste') : (sac > 0 ? tr('place.sac', { n: sac }) : '');
      const sp = d.querySelector('.sac');
      if (sp.textContent !== ts) sp.textContent = ts;
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('poste', !!(j && j.pri > 0));
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria.' + role, { nom: nomDe(s), points: pts, sac: sac }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || e.fin) return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) return tr('tour.toi');
    const pseudo = (siegesActuels()[s] || {}).nom;
    return tr('tour.autre', { nom: pseudo || nomDe(s) });
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length, nom: tr('casse.' + niveau) });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
    // jauge d'alarme et tours avant l'aube
    const e = vue, boite = $('alarme');
    const amax = e ? e.amax : 8;
    if (boite.children.length !== amax) { boite.textContent = ''; for (let k = 0; k < amax; k++) boite.appendChild(document.createElement('span')); }
    const a = e ? e.alarme : 0;
    for (let k = 0; k < amax; k++) boite.children[k].classList.toggle('on', k < a);
    boite.setAttribute('aria-valuenow', String(a)); boite.setAttribute('aria-valuemax', String(amax));
    const tt = e ? tr('jeu.tours', { n: Math.min(e.rond, e.tours), total: e.tours }) : '';
    if ($('tours').textContent !== tt) $('tours').textContent = tt;
    // code du coffre (ses chiffres)
    const moi = moiSiege();
    let code = '';
    if (e && e.nc && moi >= 0) {
      const j = e.j[moi];
      code = [0, 1, 2].map((k) => (j.code & (1 << k)) ? nb(e.code[k]) : '?').join(' ');
    }
    const zc = $('code');
    if (zc.dataset.v !== code) { zc.dataset.v = code; zc.textContent = ''; if (code) { zc.append(tr('jeu.code') + ' '); const b = document.createElement('b'); b.textContent = code; zc.appendChild(b); } }
    majActions();
  }

  // Boutons d'action : attendre, crocheter, dénoncer (seulement s'ils sont permis).
  function majActions() {
    const e = vue, moi = moiSiege();
    const monTour = !!(partie && e && !enPause && !attenteTuto && partie.monTour());
    const peut = (a) => monTour && R.valide(copie(e), moi, a);
    $('btn-attendre').disabled = !monTour;
    const cr = peut({ t: 'o' }), de = peut({ t: 'd' });
    $('btn-crocheter').style.display = e && e.nc ? '' : 'none';
    $('btn-crocheter').disabled = !cr;
    $('btn-denoncer').style.display = e && e.cam.length && (session === 'ligne' || e.n >= 9) ? '' : 'none';
    $('btn-denoncer').disabled = !de;
  }

  function majInterface() {
    majPlaces();
    majInfos();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fin) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0, monTourAvant = false;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    const mt = !!(partie && partie.monTour());
    if (mt !== monTourAvant) { monTourAvant = mt; majInterface(); if (mt && vue) curseur = vue.j[moiSiege()].p; }
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    $('ecran-jeu').classList.toggle('grand', vue.H >= 11);
    geo = geometrie(vue, w, h, 4);
    let dx = 0, dy = 0;
    if (t - secousse < 380) { const k = (1 - (t - secousse) / 380) * 6; dx = (Math.random() - 0.5) * k; dy = (Math.random() - 0.5) * k; }
    c.save(); c.translate(dx, dy);
    const monTour = !!(partie && partie.monTour()) && !enPause && !attenteTuto;
    dessinerPlateau(c, vue, geo, { t: t, moi: moiSiege(), anims: anims, tenue: prog.tenue, montrerDest: monTour, curseur: clavier && monTour ? curseur : -1 });
    // particules (pièces, étincelles)
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      if (p.etoile) etincelle(c, p.x, p.y, p.k); else { rond(c, p.x, p.y, p.k * 0.5); c.fill(); }
      c.globalAlpha = 1;
    }
    // textes qui s'envolent (+2, etc.)
    for (let i = flottants.length - 1; i >= 0; i--) {
      const f = flottants[i];
      f.vie -= dt; f.y -= 30 * dt;
      if (f.vie <= 0) { flottants.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, f.vie * 1.5);
      c.font = '900 ' + Math.round(geo.s * 0.42) + 'px system-ui, sans-serif';
      c.textAlign = 'center'; c.lineWidth = 4; c.strokeStyle = '#0b0e1c'; c.fillStyle = f.coul;
      c.strokeText(f.texte, f.x, f.y); c.fillText(f.texte, f.x, f.y);
      c.globalAlpha = 1;
    }
    c.restore();
  }

  function centreCase(i) {
    if (!vue || !geo) return [0, 0];
    return [geo.ox + (i % vue.W + 0.5) * geo.s, geo.oy + (Math.floor(i / vue.W) + 0.5) * geo.s];
  }
  function jaillir(i, coul, n) {
    if (!vue || !geo || i < 0) return;
    const p = centreCase(i);
    for (let k = 0; k < (n || 14); k++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 170;
      particules.push({ x: p[0], y: p[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v - 150, vie: 0.6 + Math.random() * 0.4, k: geo.s * (0.07 + Math.random() * 0.07), coul: k % 2 ? coul : '#ffe066', etoile: k % 3 !== 0 });
    }
  }
  function envol(i, texte, coul) {
    if (!vue || !geo || i < 0) return;
    const p = centreCase(i);
    flottants.push({ x: p[0], y: p[1] - geo.s * 0.3, texte: texte, coul: coul, vie: 1.1 });
  }
  function eclair() {
    const f = $('flash');
    f.style.opacity = '0.3';
    setTimeout(() => { f.style.opacity = '0'; }, 120);
    secousse = performance.now();
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? copie(partie.etat) : null;
    anims = { j: {}, g: {} };
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        jeton(c, s, 56, 64, 38, info.moi ? prog.tenue : 0);
        if (info.chef) couronne(c, 56, 22, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { nom: nomDe(s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomChef ? nomChef + ' · ' + nomDe(partie.chef) : nomDe(partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton2++;
    vue = copie(partie.etat);
    anims = { j: {}, g: {} };
    particules.length = 0;
    flottants.length = 0;
    debutTour = Date.now();
    dernierTic = -1;
    curseur = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche, nom: tr('casse.' + (vue.n + 1)) })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  // Un coup vient d'être joué : animations, sons et messages tirés des évènements.
  function surAction(ev) {
    const t = performance.now();
    const apres = ev.apres;
    vue = copie(apres);
    debutTour = Date.now();
    dernierTic = -1;
    anims = { j: {}, g: {} };
    let fin = t;
    apres.j.forEach((j, s) => {
      if (j.tr && j.tr.length > 1) { anims.j[s] = { chemin: j.tr.slice(), t0: t, pas: 150 }; fin = Math.max(fin, t + 150 * (j.tr.length - 1)); }
    });
    let finG = fin;
    apres.gd.forEach((g, n) => {
      if (g.tr && g.tr.length > 1) {
        const pas = Math.min(130, 420 / (g.tr.length - 1));
        anims.g[n] = { chemin: g.tr.slice(), t0: fin + 40, pas: pas };

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 3 ? COUL[i % 4] : '#ffd76a', k: 6 + Math.random() * 6 });

    const j = ++confettis.n;
    function pas(t) {

      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;

      attenteTuto = true;
      montrerTuto(cle, () => { if (prog.tutos.indexOf(cle) < 0) prog.tutos.push(cle); suite(); });
    };

  // Vestiaire : tenues (apparence) et outils (petit avantage en solo).

  function ouvrirVestiaire() {

        b.append(cv, txt);
        b.setAttribute('aria-pressed', choisi ? 'true' : 'false');
        b.setAttribute('aria-label', tr(type + '.' + k) + (libre ? '' : ' · ' + tr('vestiaire.seuil', { n: seuil })));
        if (libre) b.addEventListener('click', () => {
          audio(); sons.clic();
          if (type === 'tenue') prog.tenue = k; else prog.outil = k;
          sauverReglages();
          ouvrirVestiaire();
        });
        else b.disabled = true;
        boite.appendChild(b);
      });
    };
    remplir($('choix-tenues'), TENUES, 'tenue');
    remplir($('choix-outils'), OUTILS, 'outil');
    $('outil-desc').textContent = tr('outil.desc.' + prog.outil);
    $('vest-total').textContent = tr('etoiles.total', { n: total, max: NIVEAUX.length * 3 });
    if (ecran !== 'vestiaire') afficherEcran('vestiaire');
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
    majActions();
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
    majActions();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés (vraies règles sur un mini-plan)
  // ---------------------------------------------------------------------

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const base = () => {
      const e = O.preparer({ g: d.g, gardes: d.gardes || [], cams: d.cams || [], tours: 99, amax: 9 }, d.places || 1, () => 0.42, 0);
      e.n = 0;
      if (d.rival) { const j = e.j[1]; j.p = d.rival[0] * e.W + d.rival[1]; j.sac = d.rival[2]; j.code = 0; }
      if (e.nc) e.j[0].code = 1;
      e.premier = 0; e.tour = 0; e.file = [];
      return e;
    };
    let e = base(), debut = 0, fait = 0, an = { j: {}, g: {} };
    const PAS = 1350, j = ++tutoAnim;
    const g = geometrie(e, 560, 300, 14);
    const cible = (et) => (et[0] === 'm' ? et[1] * e.W + et[2] : e.j[0].p);
    function jouerEtape(et, t) {
      if (et[0] === 'p' || e.j[0].p < 0) return;
      e.tour = 0; e.file = [];
      const a = et[0] === 'm' ? { t: 'm', c: et[1] * e.W + et[2] } : { t: et[0] };
      if (!R.valide(copie(e), 0, a)) return;
      e = copie(R.jouer(e, 0, a));
      an = { j: {}, g: {} };
      let fin = t;
      e.j.forEach((x, s) => { if (x.tr && x.tr.length > 1) { an.j[s] = { chemin: x.tr.slice(), t0: t, pas: 150 }; fin = Math.max(fin, t + 150 * (x.tr.length - 1)); } });
      e.gd.forEach((x, n) => { if (x.tr && x.tr.length > 1) an.g[n] = { chemin: x.tr.slice(), t0: fin + 40, pas: 120 }; });
      (e.ev || []).forEach((x) => {
        if (x.t === 'butin' || x.t === 'banque' || x.t === 'coffre') sons.butin();
        if (x.t === 'pris') sons.pris();
        if (x.t === 'bruit' || x.t === 'crochete') sons.bruit();
        if (x.t === 'asc') sons.ding();
        if (x.t === 'denonce') sons.denonce();
      });
    }
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ecoule = t - debut;
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      if (k >= d.etapes.length + 1) { e = base(); fait = 0; an = { j: {}, g: {} }; debut = t; }
      else if (k >= fait && fait < d.etapes.length && dans >= 720) { jouerEtape(d.etapes[fait], t); fait++; }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 340);
      dessinerPlateau(c, e, g, { t: t, moi: 0, anims: an, tenue: prog.tenue, montrerDest: true, curseur: -1, pal: 0 });
      // mini-jauge d'alarme sous le plan
      for (let q = 0; q < e.amax; q++) { c.fillStyle = q < e.alarme ? '#ff5a3a' : 'rgba(255,255,255,.15)'; rr(c, 150 + q * 33, 312, 28, 12, 4); c.fill(); }
      const proch = fait < d.etapes.length ? d.etapes[fait] : null;
      if (proch && proch[0] !== 'p' && e.j[0].p >= 0) {
        const i = cible(proch);
        const mx = g.ox + (i % e.W + 0.5) * g.s, my = g.oy + (Math.floor(i / e.W) + 0.6) * g.s;
        const q = Math.min(1, dans / 650);
        main(c, 500 + (mx - 500) * q, 330 + (my - 330) * q, 1.4, q >= 1 ? Math.min(1, (dans - 650) / 120) : 0);
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function caseSous(px, py) {
    if (!vue || !geo) return -1;
    const col = Math.floor((px - geo.ox) / geo.s), r = Math.floor((py - geo.oy) / geo.s);
    if (col < 0 || r < 0 || col >= vue.W || r >= vue.H) return -1;
    return r * vue.W + col;
  }

  function jouerAction(a) {
    if (!partie || enPause || attenteTuto) return false;
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return false;
    }
    if (!R.valide(copie(vue), moiSiege(), a)) { sons.non(); return false; }
    if (partie.jouer(a)) { sons.clic(); majActions(); return true; }
    return false;
  }

  function allerVers(i) {
    if (i < 0 || !vue) return;
    const moi = moiSiege();
    if (moi < 0 || !vue.j[moi]) return;
    const dest = O.destinations(vue, moi);
    if (!Object.prototype.hasOwnProperty.call(dest, String(i))) {
      if (partie && partie.monTour()) { toast(tr('tour.tropLoin'), 1400); sons.non(); }
      return;
    }
    jouerAction({ t: 'm', c: i });
  }

  const plateau = $('plateau');
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  plateau.addEventListener('pointerup', (ev) => {
    audio();
    clavier = false;
    const p = point(ev);
    allerVers(caseSous(p[0], p[1]));
  });

  // Flèches : la case permise la plus proche dans la direction choisie.
  function deplacerCurseur(dr, dc) {
    if (!vue) return;
    const moi = moiSiege();
    if (moi < 0 || !vue.j[moi] || vue.j[moi].p < 0) return;
    const dest = O.destinations(vue, moi);
    if (curseur < 0 || !Object.prototype.hasOwnProperty.call(dest, String(curseur))) curseur = vue.j[moi].p;
    const r0 = Math.floor(curseur / vue.W), c0 = curseur % vue.W;
    let best = -1, bd = Infinity;
    Object.keys(dest).forEach((cle) => {
      const i = +cle, r = Math.floor(i / vue.W), c = i % vue.W;
      const vr = r - r0, vc = c - c0, avance = vr * dr + vc * dc;
      if (avance <= 0) return;
      const score = avance + Math.abs(vr * dc - vc * dr) * 2;
      if (score < bd) { bd = score; best = i; }
    });
    if (best >= 0) { curseur = best; sons.clic(); }
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const dirs = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] };
    if (dirs[ev.code]) {
      ev.preventDefault(); audio();
      clavier = true;
      deplacerCurseur(dirs[ev.code][0], dirs[ev.code][1]);
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      const moi = moiSiege();
      if (!clavier || curseur < 0) { clavier = true; if (vue && moi >= 0) curseur = vue.j[moi].p; return; }
      allerVers(curseur);
    } else if (ev.code === 'KeyC') { audio(); jouerAction({ t: 'o' }); }
    else if (ev.code === 'KeyD') { audio(); jouerAction({ t: 'd' }); }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-vestiaire').addEventListener('click', () => { audio(); sons.clic(); ouvrirVestiaire(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('vest-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-attendre').addEventListener('click', () => { audio(); const moi = moiSiege(); if (vue && moi >= 0 && vue.j[moi]) jouerAction({ t: 'm', c: vue.j[moi].p }); });
  $('btn-crocheter').addEventListener('click', () => { audio(); jouerAction({ t: 'o' }); });
  $('btn-denoncer').addEventListener('click', () => { audio(); jouerAction({ t: 'd' }); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 && vue.j[partie.siege] ? vue.j[partie.siege].sc : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
})();
</script>
</body>
</html>
