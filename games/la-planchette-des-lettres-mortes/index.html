  // Une couleur et un esprit par place : 0 corbeau, 1 chat noir, 2 chouette, 3 chauve-souris.
  const COUL = ['#b48cff', '#3fd0b8', '#ffb340', '#ff6b9a'];
  const COUL_ESPRIT = '#cfe9ff';
  const RANGEES = ['ABCDEFG', 'HIJKLM', 'NOPQRST', 'UVWXYZ'];
  const PLATEAUX = [
    { id: 'chene', prix: 0, points: ['#7a5233', '#f0d79c'] },
    { id: 'os', prix: 8, points: ['#e8dcc0', '#3d3326'] },
    { id: 'lune', prix: 20, points: ['#2a3354', '#e6f1ff'] },
    { id: 'miroir', prix: 35, points: ['#120f1a', '#b48cff'] },
    { id: 'braise', prix: 50, points: ['#2e0a06', '#ff5a2a'] }
  ];

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#1c1219"/><circle cx="10.4" cy="8" r="1.6" fill="#1c1219"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#1c1219"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';
  const FLAMME = '<svg viewBox="0 0 13 18" aria-hidden="true"><path d="M6.5 1C8 4.5 12 7 12 11.5A5.5 5.5 0 0 1 1 11.5C1 8.5 3 7.5 3.5 5c1.2 1 1.6 2.2 1.6 3.4C6 6.5 6.8 4 6.5 1z" fill="#ff8a1e"/><path d="M6.5 8c1 1.6 2.6 2.8 2.6 4.6a2.6 2.6 0 0 1-5.2 0C3.9 11 5.6 10 6.5 8z" fill="#ffe27a"/></svg>';
  const FUMEE = '<svg viewBox="0 0 13 18" aria-hidden="true"><path d="M6.5 17c-2-2 2-4 0-6s2-4 0-6s1-3 1-4" fill="none" stroke="#8a7d8f" stroke-width="1.6" stroke-linecap="round"/></svg>';
  const SEL = '<svg class="sel" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 13h8l-1.4-6H4.4z" fill="#d9d2c2"/><circle cx="7" cy="3.5" r="1.3" fill="#fff"/><circle cx="4.5" cy="2" r=".9" fill="#fff"/><circle cx="9.5" cy="2.4" r="1" fill="#fff"/></svg>';
  const CRANE = '<svg class="crane" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1C4.4 1 2 3.5 2 6.8c0 2 1 3.3 2 4V13h2v-1.4h1V13h2v-1.4h1V13h2v-2.2c1-.7 2-2 2-4C14 3.5 11.6 1 8 1z" fill="#f4efe6"/><circle cx="5.6" cy="7" r="1.6" fill="#2a1010"/><circle cx="10.4" cy="7" r="1.6" fill="#2a1010"/><path d="M8 8.6l.9 1.6H7.1z" fill="#2a1010"/></svg>';

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = {
    etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, tutos: [],
    mots: [], plateau: 'chene', reprise: 1, options: { son: true }
  };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 9999, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      prog.reprise = entier(d.niveau, 1, NIVEAUX.length, 1);
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string');
      if (Array.isArray(d.mots)) prog.mots = d.mots.filter((x) => typeof x === 'string' && /^[A-Z]{4,12}$/.test(x)).slice(0, 3000);
      if (typeof d.plateau === 'string' && PLATEAUX.some((p) => p.id === d.plateau)) prog.plateau = d.plateau;
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.mots = [];
    prog.plateau = 'chene';
    prog.reprise = 1;
  }

  function sauver(niveauReprise, score) {
    prog.reprise = niveauReprise;
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
        debloque: prog.debloque, tutos: prog.tutos.slice(), mots: prog.mots.slice(), plateau: prog.plateau,
        options: { son: prog.options.son }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Son et plateau se règlent hors partie : jamais de nouvelle sauvegarde depuis l'écran titre.
  function sauverReglages() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: prog.options.son }, plateau: prog.plateau }); } catch (e) { /* rien */ }
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);
  let totalFermables = 0;

  function ajouterGrimoire(mot) {
    if (!/^[A-Z]{4,12}$/.test(mot) || prog.mots.indexOf(mot) >= 0) return false;
    prog.mots.push(mot);
    return true;
  }

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null, bruitBuf = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      const v = o.vol || 0.1;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(o.attaque || 0.02, d / 3));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.vibrato) {
        const l = ac.createOscillator(), lg = ac.createGain();
        l.frequency.value = o.vibrato; lg.gain.value = f * 0.03;
        l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + d + 0.05);
      }
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      osc.connect(g); sortie.connect(ac.destination);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  function bruit(d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      if (!bruitBuf) {
        bruitBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const data = bruitBuf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
      const t = ac.currentTime + (o.retard || 0);
      const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = bruitBuf;
      fl.type = o.type || 'bandpass'; fl.frequency.setValueAtTime(o.f || 1200, t);
      if (o.vers) fl.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      fl.Q.value = o.q || 1;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.vol || 0.08, t + Math.min(0.05, d / 3));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      src.connect(fl); fl.connect(g); g.connect(ac.destination);
      src.start(t); src.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  const sons = {
    clic: () => note(620, 0.06, { type: 'triangle', vol: 0.06 }),
    glisse: () => bruit(0.4, { f: 500, vers: 1400, vol: 0.05, q: 0.8 }),
    toc: () => { note(180, 0.09, { type: 'triangle', vol: 0.14 }); bruit(0.05, { f: 2500, vol: 0.05, retard: 0.01 }); },
    reveil: () => {
      note(220, 1.4, { type: 'sawtooth', vol: 0.05, vibrato: 6, filtre: 900, vers: 150, attaque: 0.3 });
      note(233, 1.4, { type: 'sawtooth', vol: 0.04, vibrato: 5, filtre: 800, vers: 140, attaque: 0.3 });
      note(880, 1.1, { vol: 0.04, vibrato: 7, vers: 520, attaque: 0.4, retard: 0.2 });
    },
    souffle: () => bruit(0.7, { f: 900, vers: 200, vol: 0.09, q: 0.6, retard: 0.4 }),
    maudit: () => [311, 330, 466].forEach((f) => note(f, 1, { type: 'square', vol: 0.025, filtre: 1200, attaque: 0.05 })),
    sel: () => { for (let i = 0; i < 6; i++) bruit(0.05, { f: 4000 + i * 300, vol: 0.05, q: 4, retard: i * 0.05 }); },
    esprit: () => { note(400, 0.9, { vol: 0.05, vibrato: 9, vers: 1100, attaque: 0.3 }); note(600, 0.9, { vol: 0.03, vibrato: 7, vers: 1500, attaque: 0.3, retard: 0.1 }); },
    faux: () => { note(140, 0.4, { type: 'square', vol: 0.06, filtre: 600, vers: 70 }); bruit(0.3, { f: 300, vol: 0.08 }); },
    victoire: () => [392, 466, 587, 784].forEach((f, i) => note(f, 0.4, { type: 'triangle', vol: 0.1, retard: i * 0.16 })),
    defaite: () => [330, 311, 247, 196].forEach((f, i) => note(f, 0.45, { type: 'sawtooth', vol: 0.05, filtre: 900, retard: i * 0.2 })),
    tic: () => note(1250, 0.04, { type: 'square', vol: 0.03 }),
    arrive: () => { note(523, 0.14, { vol: 0.08 }); note(784, 0.18, { vol: 0.08, retard: 0.1 }); },
    part: () => { note(784, 0.14, { vol: 0.06 }); note(523, 0.18, { vol: 0.06, retard: 0.1 }); },
    tour: () => note(988, 0.1, { vol: 0.05 }),
    non: () => note(170, 0.14, { type: 'triangle', vol: 0.07 })
  };

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.textContent = prog.options.son ? '🔊' : '🔇';
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    sauverReglages();
    majBoutonsSon();
    sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Dessins (canvas) : emblèmes des esprits, couronne, salle de séance
  // ---------------------------------------------------------------------

  function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }
  function rond(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r);
    else { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  }
  function graineHasard(g) { let a = g >>> 0; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; }

  // Silhouette de l'esprit k, centrée en (x, y), dans une boîte de rayon r (dessin dans 100).
  function silhouette(c, k, x, y, r) {
    c.save(); c.translate(x, y); c.scale(r / 50, r / 50);
    c.lineJoin = 'round';
    if (k === 0) { // corbeau de profil
      c.fillStyle = '#16121c';
      ell(c, -4, 10, 26, 22, -0.3); c.fill();
      rond(c, 14, -14, 17); c.fill();
      c.beginPath(); c.moveTo(-26, 18); c.lineTo(-44, 34); c.lineTo(-20, 28); c.fill();
      c.fillStyle = '#4a4352'; c.beginPath(); c.moveTo(28, -18); c.lineTo(48, -10); c.lineTo(27, -6); c.closePath(); c.fill();
      c.fillStyle = '#ffd84a'; rond(c, 18, -17, 4.5); c.fill();
      c.fillStyle = '#000'; rond(c, 19, -17, 2.2); c.fill();
      c.strokeStyle = '#2e2838'; c.lineWidth = 3; c.beginPath(); c.moveTo(-14, 4); c.quadraticCurveTo(0, 16, 14, 8); c.stroke();
    } else if (k === 1) { // chat noir
      c.fillStyle = '#16121c';
      c.beginPath(); c.moveTo(-32, -10); c.lineTo(-30, -42); c.lineTo(-10, -26); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(32, -10); c.lineTo(30, -42); c.lineTo(10, -26); c.closePath(); c.fill();
      ell(c, 0, 2, 36, 32); c.fill();
      c.fillStyle = '#c6ff4a'; ell(c, -14, -2, 8, 6, 0.2); c.fill(); ell(c, 14, -2, 8, 6, -0.2); c.fill();
      c.fillStyle = '#000'; ell(c, -14, -2, 2, 5.5); c.fill(); ell(c, 14, -2, 2, 5.5); c.fill();
      c.fillStyle = '#e88aa8'; c.beginPath(); c.moveTo(-4, 10); c.lineTo(4, 10); c.lineTo(0, 15); c.closePath(); c.fill();
      c.strokeStyle = '#8a7f96'; c.lineWidth = 1.5;
      [-1, 1].forEach((s) => { c.beginPath(); c.moveTo(s * 10, 14); c.lineTo(s * 34, 10); c.moveTo(s * 10, 17); c.lineTo(s * 33, 19); c.stroke(); });
    } else if (k === 2) { // chouette
      c.fillStyle = '#5a3d2a';
      c.beginPath(); c.moveTo(-30, -24); c.lineTo(-24, -44); c.lineTo(-10, -30); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(30, -24); c.lineTo(24, -44); c.lineTo(10, -30); c.closePath(); c.fill();
      ell(c, 0, 4, 34, 38); c.fill();
      c.fillStyle = '#c9a27a'; ell(c, 0, 22, 20, 18); c.fill();
      c.fillStyle = '#f6e2b0'; rond(c, -14, -8, 13); c.fill(); rond(c, 14, -8, 13); c.fill();
      c.fillStyle = '#ff9a1a'; rond(c, -14, -8, 8); c.fill(); rond(c, 14, -8, 8); c.fill();
      c.fillStyle = '#000'; rond(c, -14, -8, 4.5); c.fill(); rond(c, 14, -8, 4.5); c.fill();
      c.fillStyle = '#f2c230'; c.beginPath(); c.moveTo(-5, 4); c.lineTo(5, 4); c.lineTo(0, 13); c.closePath(); c.fill();
    } else { // chauve-souris
      c.fillStyle = '#16121c';
      c.beginPath();
      c.moveTo(0, -6);
      c.quadraticCurveTo(-20, -26, -48, -16); c.quadraticCurveTo(-40, -4, -42, 8);
      c.quadraticCurveTo(-34, 2, -28, 10); c.quadraticCurveTo(-22, 2, -14, 12); c.quadraticCurveTo(-8, 6, 0, 18);
      c.quadraticCurveTo(8, 6, 14, 12); c.quadraticCurveTo(22, 2, 28, 10); c.quadraticCurveTo(34, 2, 42, 8);
      c.quadraticCurveTo(40, -4, 48, -16); c.quadraticCurveTo(20, -26, 0, -6); c.fill();
      ell(c, 0, -2, 11, 16); c.fill();
      c.beginPath(); c.moveTo(-9, -12); c.lineTo(-7, -26); c.lineTo(-2, -15); c.fill();
      c.beginPath(); c.moveTo(9, -12); c.lineTo(7, -26); c.lineTo(2, -15); c.fill();
      c.fillStyle = '#ff4a5c'; rond(c, -4, -6, 2.4); c.fill(); rond(c, 4, -6, 2.4); c.fill();
    }
    c.restore();
  }

  function medaillon(c, k, x, y, r) {
    const g = c.createRadialGradient(x, y - r * 0.3, r * 0.1, x, y, r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.15, COUL[k]); g.addColorStop(1, '#1a1020');
    c.fillStyle = g; rond(c, x, y, r); c.fill();
    c.lineWidth = Math.max(1.5, r * 0.1); c.strokeStyle = COUL[k]; rond(c, x, y, r * 0.95); c.stroke();
    silhouette(c, k, x, y + r * 0.05, r * 0.68);
  }

  function couronne(c, x, y, k) {
    c.save(); c.translate(x, y); c.scale(k / 22, k / 22);
    c.fillStyle = '#ffc21a'; c.strokeStyle = '#6a3f00'; c.lineWidth = 2.5; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-20, 0); c.lineTo(-23, -22); c.lineTo(-10, -10); c.lineTo(0, -26); c.lineTo(10, -10); c.lineTo(23, -22); c.lineTo(20, 0); c.closePath();
    c.fill(); c.stroke();
    c.fillStyle = '#ff4a5c'; rond(c, 0, -10, 3.5); c.fill();
    c.restore();
  }

  // Flamme de bougie dessinée (titre).
  function flammeCanvas(c, x, y, h, t) {
    const v = 1 + Math.sin(t / 130) * 0.05 + Math.sin(t / 57) * 0.03;
    const lueur = c.createRadialGradient(x, y - h * 0.4, 1, x, y - h * 0.4, h * 5);
    lueur.addColorStop(0, 'rgba(255,180,80,.38)'); lueur.addColorStop(1, 'rgba(255,120,30,0)');
    c.fillStyle = lueur; rond(c, x, y - h * 0.4, h * 5); c.fill();
    c.save(); c.translate(x, y); c.scale(1, v); c.rotate(Math.sin(t / 210) * 0.06);
    const g = c.createRadialGradient(0, -h * 0.3, 1, 0, -h * 0.35, h * 0.7);
    g.addColorStop(0, '#fffbe0'); g.addColorStop(0.4, '#ffd24a'); g.addColorStop(0.8, '#ff7a1a'); g.addColorStop(1, 'rgba(255,80,0,0)');
    c.fillStyle = g;
    c.beginPath(); c.moveTo(0, -h); c.bezierCurveTo(h * 0.45, -h * 0.5, h * 0.38, 0, 0, 0); c.bezierCurveTo(-h * 0.38, 0, -h * 0.45, -h * 0.5, 0, -h); c.fill();
    c.restore();
  }

  function bougieCanvas(c, x, y, l, h, t) {
    const g = c.createLinearGradient(x - l / 2, 0, x + l / 2, 0);
    g.addColorStop(0, '#bfae8e'); g.addColorStop(0.5, '#f6ecd6'); g.addColorStop(1, '#a89878');
    c.fillStyle = g; rr(c, x - l / 2, y - h, l, h, l * 0.15); c.fill();
    c.fillStyle = '#f6ecd6'; ell(c, x + l * 0.3, y - h + l * 0.5, l * 0.12, l * 0.5); c.fill();
    c.fillStyle = '#2a1a10'; c.fillRect(x - 1, y - h - l * 0.35, 2, l * 0.35);
    flammeCanvas(c, x, y - h - l * 0.3, l * 1.3, t);
  }

  // Main d'ombre pâle posée sur la planchette (doigts vers le haut).
  function mainSpectrale(c, x, y, k, rot) {
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(k, k);
    c.fillStyle = 'rgba(210,230,255,.28)'; c.strokeStyle = 'rgba(220,240,255,.5)'; c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(-14, 40); c.lineTo(-16, 8);
    [[-13, -18], [-4, -26], [5, -24], [13, -16]].forEach((p, i) => {
      const bx = -12 + i * 8.5;
      c.lineTo(bx - 3, 6); c.lineTo(p[0] - 3, p[1] + 4); c.quadraticCurveTo(p[0], p[1] - 4, p[0] + 3, p[1] + 4); c.lineTo(bx + 4, 4);
    });
    c.lineTo(18, 6); c.lineTo(26, 0); c.quadraticCurveTo(30, 4, 24, 12); c.lineTo(16, 24); c.lineTo(14, 40); c.closePath();
    c.fill(); c.stroke();
    c.restore();
  }

  // L'écran titre : une table de séance, son plateau orné (sans aucune lettre),
  // la planchette sous deux mains d'ombre, des bougies et un spectre dans la fumée.
  function dessinerTitre(t) {
    t = t || 0;
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    let g = c.createRadialGradient(w / 2, h * 0.45, 10, w / 2, h * 0.5, Math.max(w, h) * 0.8);
    g.addColorStop(0, '#2c1a22'); g.addColorStop(0.5, '#140b14'); g.addColorStop(1, '#050307');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    const u = Math.min(w, h * 0.62) / 10, cx = w / 2, cy = h * 0.58;
    // spectre dans la fumée, au fond
    c.save();
    c.globalAlpha = 0.16 + 0.05 * Math.sin(t / 900);
    const sg = c.createRadialGradient(cx, cy - u * 5.2, u * 0.3, cx, cy - u * 4.6, u * 3.6);
    sg.addColorStop(0, '#e6f4ff'); sg.addColorStop(1, 'rgba(160,200,255,0)');
    c.fillStyle = sg;
    c.beginPath(); c.moveTo(cx - u * 2.2, cy - u * 1.6); c.quadraticCurveTo(cx - u * 2.6, cy - u * 7.4, cx, cy - u * 7.6);
    c.quadraticCurveTo(cx + u * 2.6, cy - u * 7.4, cx + u * 2.2, cy - u * 1.6); c.closePath(); c.fill();
    c.fillStyle = '#0a0410';
    ell(c, cx - u * 0.75, cy - u * 5.6, u * 0.32, u * 0.48); c.fill();
    ell(c, cx + u * 0.75, cy - u * 5.6, u * 0.32, u * 0.48); c.fill();
    c.restore();
    // table ronde
    c.fillStyle = 'rgba(0,0,0,.5)'; ell(c, cx, cy + u * 0.6, u * 6.2, u * 3.1); c.fill();
    g = c.createRadialGradient(cx, cy - u, u, cx, cy, u * 6.4);
    g.addColorStop(0, '#6a3d22'); g.addColorStop(0.7, '#3a2012'); g.addColorStop(1, '#1e0f08');
    c.fillStyle = g; ell(c, cx, cy, u * 6, u * 2.9); c.fill();
    c.strokeStyle = '#8a5a2a'; c.lineWidth = 2; ell(c, cx, cy, u * 5.8, u * 2.75); c.stroke();
    // plateau de séance (en perspective) avec soleil, lune, arcs de sigles et étoiles
    c.save(); c.translate(cx, cy - u * 0.2); c.scale(1, 0.55);
    g = c.createRadialGradient(0, -u, u * 0.5, 0, 0, u * 5);
    g.addColorStop(0, '#9a6a3e'); g.addColorStop(1, '#4a2c16');
    c.fillStyle = g; rr(c, -u * 4.4, -u * 3.2, u * 8.8, u * 6.4, u * 1.2); c.fill();
    c.strokeStyle = '#e9c77a'; c.lineWidth = u * 0.12; rr(c, -u * 4.2, -u * 3, u * 8.4, u * 6, u); c.stroke();
    c.fillStyle = '#e9c77a'; c.strokeStyle = '#e9c77a'; c.lineWidth = u * 0.08;
    rond(c, -u * 3.2, -u * 2, u * 0.45); c.fill();
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; c.beginPath(); c.moveTo(-u * 3.2 + Math.cos(a) * u * 0.62, -u * 2 + Math.sin(a) * u * 0.62); c.lineTo(-u * 3.2 + Math.cos(a) * u * 0.85, -u * 2 + Math.sin(a) * u * 0.85); c.stroke(); }
    c.beginPath(); c.arc(u * 3.2, -u * 2, u * 0.5, Math.PI * 0.35, Math.PI * 1.65); c.arc(u * 3.45, -u * 2, u * 0.4, Math.PI * 1.45, Math.PI * 0.55, true); c.fill();
    [[-1.6, 2.6], [1.6, 2.6]].forEach((arc, j) => {
      for (let i = 0; i < 11; i++) {
        const a = Math.PI * (1.12 + i * 0.076), rx = u * 3.1, ry = u * 2.2;
        const px = Math.cos(a) * rx, py = Math.sin(a) * ry + u * (0.6 + j * 1.35);
        c.lineWidth = u * 0.07;
        if ((i + j) % 3 === 0) { rond(c, px, py, u * 0.16); c.stroke(); }
        else if ((i + j) % 3 === 1) { c.beginPath(); c.moveTo(px - u * 0.15, py); c.lineTo(px + u * 0.15, py); c.moveTo(px, py - u * 0.15); c.lineTo(px, py + u * 0.15); c.stroke(); }
        else { rond(c, px, py, u * 0.08); c.fill(); }
      }
    });
    for (let i = 0; i < 7; i++) { const px = -u * 2.4 + i * u * 0.8; rond(c, px, u * 2.35, u * 0.09); c.fill(); }
    // planchette au centre
    const px = Math.sin(t / 1700) * u * 0.5, py = u * 0.4 + Math.cos(t / 2100) * u * 0.25;
    c.save(); c.translate(px, py);
    c.fillStyle = 'rgba(0,0,0,.35)'; ell(c, u * 0.15, u * 0.4, u * 1.15, u * 1.3); c.fill();
    g = c.createRadialGradient(0, -u * 0.5, u * 0.1, 0, 0, u * 1.5);
    g.addColorStop(0, '#fbebc6'); g.addColorStop(1, '#b88a52');
    c.fillStyle = g; c.strokeStyle = '#4a2a10'; c.lineWidth = u * 0.07;
    c.beginPath(); c.moveTo(0, -u * 1.5); c.bezierCurveTo(u * 1.2, -u * 1.5, u * 1.3, u * 0.2, 0, u * 1.4); c.bezierCurveTo(-u * 1.3, u * 0.2, -u * 1.2, -u * 1.5, 0, -u * 1.5); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,240,200,.25)'; rond(c, 0, -u * 0.6, u * 0.45); c.fill(); c.lineWidth = u * 0.1; c.stroke();
    c.restore();
    c.restore();
    // mains d'ombre sur la planchette
    mainSpectrale(c, cx + Math.sin(t / 1700) * u * 0.5 - u * 0.9, cy + u * 0.9, u * 0.055, 0.35);
    mainSpectrale(c, cx + Math.sin(t / 1700) * u * 0.5 + u * 0.9, cy + u * 0.9, u * 0.055, -0.35);
    // bougies
    bougieCanvas(c, cx - u * 5.0, cy - u * 0.4, u * 0.55, u * 1.8, t);
    bougieCanvas(c, cx + u * 5.1, cy - u * 0.2, u * 0.5, u * 1.4, t + 300);
    bougieCanvas(c, cx + u * 3.7, cy + u * 1.7, u * 0.45, u * 1.0, t + 700);
    // fumée et poussière qui flotte
    const al = graineHasard(11);
    for (let i = 0; i < 34; i++) {
      const x0 = al() * w, y0 = al() * h, ph = al() * 6;
      const x = x0 + Math.sin(t / 2000 + ph) * 12, y = (y0 - t / 60 * (0.3 + al())) % h;
      c.fillStyle = 'rgba(255,220,180,' + (0.15 + 0.15 * Math.sin(t / 700 + ph)).toFixed(2) + ')';
      rond(c, x, y < 0 ? y + h : y, 1.2 + al() * 1.6); c.fill();
    }
    // vignette
    g = c.createRadialGradient(cx, h * 0.5, Math.min(w, h) * 0.3, cx, h * 0.5, Math.max(w, h) * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.7)');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
  }

  let rafTitre = 0, dernierTitre = 0;
  function animerTitre(t) {
    rafTitre = 0;
    if (ecran === 'jeu') return;
    if (t - dernierTitre > 40) { dernierTitre = t; dessinerTitre(t); }
    rafTitre = requestAnimationFrame(animerTitre);
  }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (20 séances) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // partie solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)
  let dernierAttends = 0;
  let curseur = -1;           // lettre visée au clavier (index dans l'alphabet)
  let attenteTuto = false;

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'grimoire', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom !== 'jeu') { dessinerTitre(performance.now()); if (!rafTitre) rafTitre = requestAnimationFrame(animerTitre); }
    if (nom === 'titre') majTitre();
    if (nom === 'jeu') { appliquerPlateau(); relancerBoucle(); }
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    el.classList.toggle('haut', salonOuvert() || $('voile-fin').classList.contains('actif'));
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  function appliquerPlateau() {
    const p = $('plateau');
    PLATEAUX.forEach((x) => p.classList.toggle('skin-' + x.id, x.id === prog.plateau && x.id !== 'chene'));
  }

  // Cartes des 4 places et du salon ; lettres du plateau.
  function construire() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.width = 88; cv.height = 88;
      medaillon(cv.getContext('2d'), s, 44, 44, 42);
      const tag = document.createElement('span'); tag.className = 'tag';
      const fl = document.createElement('span'); fl.className = 'flammes';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 26, 36, 24);
      d.append(cv, tag, fl, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 112; cv.height = 112;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
    const lettres = $('lettres');
    lettres.textContent = '';
    RANGEES.forEach((rang) => {
      rang.split('').forEach((l, i) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'lettre' + (i === 0 && rang.length === 6 ? ' decale' : '');
        b.id = 'l-' + l; b.dataset.l = l;
        b.textContent = l;
        b.addEventListener('click', () => { audio(); poser(l); });
        lettres.appendChild(b);
      });
    });
    const ombre = document.createElement('div');
    ombre.id = 'ombre-nuit';
    lettres.appendChild(ombre);
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : pseudo d'un vrai joueur en ligne (partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    if (tag.dataset.role === role && tag.dataset.nom === nom) return;
    tag.dataset.role = role;
    tag.dataset.nom = nom;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = nom;
    tag.appendChild(txt);
  }
  function siegesActuels() {
    // Avant le début d'une séance solo (tutoriel), la place 0 est déjà la tienne.
    if (!partie) return session === 'solo' ? [{ humain: true, moi: true, chef: false, nom: null }] : [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  // Nom d'une place dans les phrases : « le Corbeau », un pseudo, ou « toi ».
  function nomPhrase(s) {
    const info = siegesActuels()[s] || {};
    if (info.moi) return tr('phrase.toi');
    if (info.humain && info.nom) return info.nom;
    return tr('phrase.esprit.' + s);
  }

  function flammesHtml(n, sel) {
    let h = '';
    for (let k = 0; k < O.FLAMMES; k++) h += k < n ? FLAMME : FUMEE.replace('<svg', '<svg class="eteinte"');
    if (sel > 0) h += SEL;
    return h;
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const fl = e ? e.fl[s] : O.FLAMMES, sel = e && e.o.sels ? e.sel[s] : 0;
      const cle = fl + '|' + sel;
      const boite = d.querySelector('.flammes');
      if (boite.dataset.cle !== cle) { boite.dataset.cle = cle; boite.innerHTML = flammesHtml(fl, sel); }
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('eteinte', !!e && fl <= 0);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria.' + role, { esprit: tr('esprit.' + s), n: fl }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  // Mot en cours : lettres colorées par leur auteur, case de la prochaine lettre.
  let motAffiche = '';
  function majMot() {
    const cadre = $('mot-cadre'), e = vue;
    const f = e ? e.f : '', m = !!(e && e.m);
    const cle = f + '|' + (m ? 1 : 0) + '|' + (e ? e.maud : '') + '|' + (e ? e.nm : 0);
    cadre.classList.toggle('miroir', m);
    if (cadre.dataset.cle === cle) return;
    const ancien = motAffiche;
    cadre.dataset.cle = cle;
    cadre.textContent = '';
    const fente = document.createElement('span'); fente.className = 'fente';
    if (m && f) cadre.appendChild(fente);
    // lettre ajoutée : à la fin, ou au début en miroir
    const neuf = f.length === ancien.length + 1 ? (m ? 0 : f.length - 1) : (f.length === 1 ? 0 : -1);
    for (let i = 0; i < f.length; i++) {
      const sp = document.createElement('span');
      const qui = e.qui[i];
      sp.className = 'lettre-mot' + (i === neuf ? ' neuve' : '') + (e.maud.indexOf(f.charAt(i)) >= 0 ? ' maudite-l' : '');
      sp.style.color = qui >= 0 ? COUL[qui] : COUL_ESPRIT;
      sp.textContent = f.charAt(i);
      cadre.appendChild(sp);
    }
    if (!m && f) cadre.appendChild(fente);
    motAffiche = f;
    cadre.setAttribute('aria-label', f ? tr(m ? 'mot.ariaMiroir' : 'mot.aria', { mot: f.split('').join(' ') }) : '');
  }

  // Plateau : lettres mortes, maudites, refusées, dans le noir, crânes d'aide.
  function majPlateau() {
    const e = vue;
    const monTourUI = peutJouer();
    const ombre = $('ombre-nuit');
    ombre.classList.toggle('haut', !!e && e.nuit === 1);
    ombre.classList.toggle('bas', !!e && e.nuit === 2);
    $('ecran-jeu').classList.toggle('noir', !!e && e.nuit > 0);
    for (let i = 0; i < 26; i++) {
      const l = O.ALPHA.charAt(i), b = $('l-' + l);
      let cl = 'vivant', noir = false, maud = false;
      if (e && e.f) {
        cl = O.classe(e, l);
        noir = O.sombre(e, l);
        maud = e.maud.indexOf(l) >= 0;
      }
      const etat = (noir ? 'n' : '') + cl + (maud ? 'm' : '') + (e && e.o.aide ? 'a' : '') + (i === curseur ? 'c' : '') + (monTourUI ? 't' : '');
      if (b.dataset.etat === etat) continue;
      b.dataset.etat = etat;
      b.classList.toggle('sombre', noir);
      b.classList.toggle('mort', !noir && cl === 'mort');
      b.classList.toggle('refuse', cl === 'refuse');
      b.classList.toggle('maudite', maud);
      b.classList.toggle('clavier', i === curseur);
      const crane = b.querySelector('.crane');
      const montrerCrane = !!e && e.o.aide && !noir && cl === 'ferme';
      if (montrerCrane && !crane) b.insertAdjacentHTML('beforeend', CRANE);
      else if (!montrerCrane && crane) crane.remove();
      let cleAria = 'lettre.aria';
      if (noir) cleAria = 'lettre.aria.sombre';
      else if (cl === 'mort') cleAria = 'lettre.aria.mort';
      else if (cl === 'refuse') cleAria = 'lettre.aria.refuse';
      else if (montrerCrane) cleAria = 'lettre.aria.ferme';
      b.setAttribute('aria-label', tr(cleAria, { l: l }) + (maud ? ' · ' + tr('lettre.aria.maudite') : ''));
    }
  }

  function majMaledictions() {
    const boite = $('maledictions'), e = vue;
    const liste = [];
    if (e) {
      if (e.o.aide) liste.push(['mal.aide', false]);
      if (e.o.maud) liste.push(['mal.maudites', !!e.maud]);
      if (e.o.nuit) liste.push(['mal.bougie', e.nuit > 0]);
      if (e.o.miroir) liste.push(['mal.miroir', e.m]);
      if (e.o.sels) liste.push(['mal.sels', false]);
      if (e.o.esprit) liste.push(['mal.esprit', false]);
      if (e.o.minL > 4) liste.push(['mal.long', false]);
    }
    const cle = liste.map((x) => x[0] + (x[1] ? '!' : '')).join(',');
    if (boite.dataset.cle === cle) return;
    boite.dataset.cle = cle;
    boite.textContent = '';
    liste.forEach((x) => {
      const sp = document.createElement('span');
      sp.className = 'mal' + (x[1] ? ' vif' : '');
      const i = document.createElement('i');
      const t = document.createElement('span'); t.textContent = tr(x[0]);
      sp.append(i, t);
      boite.appendChild(sp);
    });
  }

  function majSel() {
    const b = $('btn-sel'), e = vue;
    const visible = !!e && e.o.sels > 0 && partie && partie.siege >= 0 && e.fl[partie.siege] > 0;
    b.classList.toggle('visible', visible);
    if (!visible) return;
    const n = e.sel[partie.siege];

    if ($('btn-sel-texte').textContent !== texte) $('btn-sel-texte').textContent = texte;

  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');

    if (!e || attenteTuto || partie.phase !== 'jeu' || !e.f) return '';

  }

  function majInfos() {
    let info = '';

    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');

  }

  function majInterface() {

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && e.f) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Planchette : elle glisse jusqu'à chaque lettre posée
  // ---------------------------------------------------------------------

  const filePlanchette = [];
  let planchetteOccupee = false;
  function centreLettre(l) {
    const b = $('l-' + l), p = $('plateau');
    if (!b || !p) return null;
    const rb = b.getBoundingClientRect(), rp = p.getBoundingClientRect();
    return [rb.left - rp.left - p.clientLeft + rb.width / 2, rb.top - rp.top - p.clientTop + rb.height / 2];
  }
  function placerPlanchette(x, y, rot) {
    $('planchette').style.transform = 'translate(' + (x - 37).toFixed(1) + 'px,' + (y - 30).toFixed(1) + 'px) rotate(' + rot.toFixed(1) + 'deg)';
  }
  function centrerPlanchette() {
    const p = $('plateau');
    if (!p.clientWidth) return;
    placerPlanchette(p.clientWidth / 2, p.clientHeight / 2 + 6, 0);
  }
  function glisser(l, esprit) {
    filePlanchette.push({ l: l, esprit: !!esprit });
    if (!planchetteOccupee) suitePlanchette();
  }
  function suitePlanchette() {
    const pas = filePlanchette.shift();
    const pl = $('planchette');
    if (!pas) { planchetteOccupee = false; pl.classList.add('posee'); return; }
    planchetteOccupee = true;
    const c = centreLettre(pas.l);
    pl.classList.remove('posee');
    pl.classList.toggle('esprit', pas.esprit);
    if (c) placerPlanchette(c[0], c[1], (Math.random() - 0.5) * 16);
    sons.glisse();
    setTimeout(() => {
      const b = $('l-' + pas.l);
      if (b) { b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 380); }
      sons.toc();
      setTimeout(suitePlanchette, 120);
    }, 430);
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage (temps en ligne, salon, compte à rebours)
  // ---------------------------------------------------------------------

  let rafId = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle() {
    rafId = 0;
    if (ecran !== 'jeu') return;
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI), affichés à leur rythme :
  //  après un mot réveillé, on laisse le temps de voir le spectre.
  // ---------------------------------------------------------------------

  const fileUI = [];
  let libreUI = 0, minuteurUI = 0;

  function surEvenement(ev) {
    if (!partie) return;
    if (ev.type === 'mode') { surMode(ev); majInterface(); return; }
    if (ev.type === 'sieges') { surSieges(); majInterface(); return; }
    fileUI.push({ ev: ev, j: jeton });
    pomperUI();
  }

  function pomperUI() {
    clearTimeout(minuteurUI);
    while (fileUI.length) {
      if (enPause || attenteTuto) return;
      const attente = libreUI - Date.now();
      if (attente > 0) { minuteurUI = setTimeout(pomperUI, attente + 5); return; }
      const x = fileUI.shift();
      if (x.j !== jeton || !partie) continue;
      const d = traiterUI(x.ev);
      majInterface();
      libreUI = Date.now() + d;
      if (d > 0) setTimeout(majInterface, d + 20);
    }
  }

  // Le joueur peut-il jouer maintenant (moteur et affichage à jour) ?
  function peutJouer() {
    return !!partie && !enPause && !attenteTuto && fileUI.length === 0 && Date.now() >= libreUI && partie.monTour() && !$('reveil').classList.contains('actif');
  }

  function traiterUI(ev) {
    switch (ev.type) {
      case 'debut': surDebut(ev); return 0;
      case 'manche': surManche(); return 300;
      case 'action': return surAction(ev);
      case 'fin': surFin(); return 0;
      case 'salon': surSalon(ev); return 0;
      default: return 0;
    }
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // Salon d'attente (en ligne) : le premier joueur arrivé lance la séance, sinon elle part seule.
  let finSalon = 0, resultatSalon = null, finEnAttente = false, lancement = false;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44);
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { esprit: tr('esprit.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { esprit: nomChef ? nomChef + ' · ' + tr('esprit.' + partie.chef) : tr('esprit.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    bouton.hidden = !(enSalon && partie.estChef());
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    fileUI.forEach((x) => { x.j = jeton; });   // les messages déjà reçus restent valables
    vue = JSON.parse(JSON.stringify(partie.etat));
    debutTour = Date.now();
    dernierTic = -1;
    motAffiche = '';
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    filePlanchette.length = 0;
    centrerPlanchette();
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function secouer(id) { const el = $(id); if (!el) return; el.classList.remove('secoue'); void el.offsetWidth; el.classList.add('secoue'); }

  // Grand spectre : mot réveillé, faux pas ou coincé par le sel.
  function montrerReveil(titre, lettres, qui, texte) {
    const boite = $('reveil-mot');
    boite.textContent = '';
    (lettres || '').split('').forEach((l, i) => {
      const sp = document.createElement('span');
      sp.textContent = l;
      const q = qui ? qui[i] : -1;
      sp.style.color = q >= 0 ? COUL[q] : COUL_ESPRIT;
      sp.style.animationDelay = (i * 0.06) + 's';
      boite.appendChild(sp);
    });
    $('reveil-titre').textContent = titre;
    $('reveil-texte').textContent = texte || '';
    const r = $('reveil');
    r.classList.remove('actif'); void r.offsetWidth; r.classList.add('actif');
    clearTimeout(montrerReveil.m);
    montrerReveil.m = setTimeout(() => { r.classList.remove('actif'); majInterface(); }, 1700);
  }

  // Une action affichée ; renvoie le temps à laisser avant la suivante (ms).
  function surAction(ev) {
    const avant = ev.avant, apres = ev.apres, k = apres.ev ? apres.ev.k : null;
    vue = JSON.parse(JSON.stringify(apres));
    debutTour = Date.now();
    dernierTic = -1;
    const qui = nomPhrase(ev.siege);
    let attente = 0;
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (ev.action === 'SEL') {
      sons.sel();
      secouer('mot-cadre');
      const x = apres.ev || {};
      toast(tr('ev.sel', { qui: qui, lettre: x.l || '', victime: nomPhrase(x.v) }), 3000);
      if (k === 'coince') {
        montrerReveil(tr('reveil.coince'), x.w || '', null, tr('ev.coince', { qui: nomPhrase(x.v) }));
        sons.souffle();
        secouer('place-' + x.v);
        noterElimination(avant, apres);
        attente = 1900;
      } else attente = 300;
    } else {
      glisser(ev.action, false);
      if (k === 'ferme') {
        const x = apres.ev;
        if (ajouterGrimoire(x.w) && x.p === partie.siege) toast(tr('grimoire.nouveau', { mot: x.w }), 2200);
        setTimeout(() => {
          sons.reveil(); sons.souffle();
          if (x.c > 1) sons.maudit();
          secouer('place-' + x.p);
          montrerReveil(tr('reveil.titre'), x.w, x.q, tr(x.c > 1 ? 'ev.fermeMaudit' : 'ev.ferme', { qui: qui }));
        }, 520);
        noterElimination(avant, apres);
        attente = 2300;
      } else if (k === 'faux') {
        const x = apres.ev;
        setTimeout(() => {
          sons.faux(); sons.souffle();
          secouer('place-' + x.p);
          montrerReveil(tr('reveil.faux'), x.w, null, tr('ev.faux', { qui: qui }));
        }, 520);
        noterElimination(avant, apres);
        attente = 2300;
      } else if (k === 'esprit') {
        const x = apres.ev;
        setTimeout(() => { glisser(x.l, true); sons.esprit(); toast(tr('ev.esprit', { lettre: x.l }), 2400); }, 560);
        attente = 1100;
      } else attente = 480;
    }
    if (partie.phase === 'jeu' && R.aQui(vue) === partie.siege && !ev.moi && vue.f) setTimeout(() => sons.tour(), attente);
    curseur = -1;
    return attente;
  }

  // Une place vient de perdre sa dernière flamme : elle devient un spectre.
  function noterElimination(avant, apres) {
    for (let s = 0; s < PLACES; s++) {
      if (avant.fl[s] > 0 && apres.fl[s] <= 0) {
        const moi = partie && s === partie.siege;
        setTimeout(() => toast(moi ? tr('ev.elimineToi') : tr('ev.elimine', { qui: nomPhrase(s) }), 2600), 1900);
      }
    }
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 400);
  }

  function gagnant(e, moi) {
    const res = R.fin(e);
    return moi >= 0 && !!res && res.classement[0] === moi && e.fl[moi] > 0;
  }

  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = vue || partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = gagnant(e, moi);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    sauver(prog.reprise, 0);              // les mots réveillés restent dans le grimoire
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // Score d'une séance : flammes gardées, mots fermés par les autres, victoire.
  function scoreDe(e, moi, gagne) {
    if (moi < 0) return 0;
    const autres = e.mots.filter((x) => x.p !== moi).length;
    return e.fl[moi] * 30 + autres * 10 + (gagne ? 40 : 0);
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    ordre.forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; medaillon(cv.getContext('2d'), s, 30, 30, 28);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('esprit.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.innerHTML = flammesHtml(e.fl[s], 0);
      n.setAttribute('aria-label', tr('flammes', { n: e.fl[s] }));
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function remplirMots(e) {
    const boite = $('fin-mots');
    boite.textContent = '';
    $('fin-mots-titre').textContent = e.mots.length ? tr('fin.mots') : tr('fin.aucunMot');
    e.mots.forEach((x) => {
      const sp = document.createElement('span');
      sp.textContent = x.w;
      sp.style.color = COUL[x.p];
      boite.appendChild(sp);
    });
  }

  function plateauDebloque(avant, apres) {
    const p = PLATEAUX.find((x) => x.prix > avant && x.prix <= apres);
    return p ? tr('plateau.' + p.id) : '';
  }

  function afficherFin() {
    const e = vue || partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const gagne = gagnant(e, moi);
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    remplirMots(e);
    const score = scoreDe(e, moi, gagne);
    $('fin-points').textContent = moi >= 0 ? tr('fin.score', { n: score }) : '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = gagne ? Math.max(1, Math.min(3, e.fl[moi])) : 0;
      const ancienRecord = prog.records[i];
      const record = score > ancienRecord;
      if (record) prog.records[i] = score;
      let debloque = false;
      const etoilesAvant = totalEtoiles();
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), score);
        // Parcours terminé (toutes les séances gagnées, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else sauver(niveau, score);
      $('fin-titre').textContent = gagne ? tr('fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, score) });
      const nouveauPlateau = plateauDebloque(etoilesAvant, totalEtoiles());
      let deb = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      if (nouveauPlateau) deb = (deb ? deb + ' ' : '') + tr('fin.plateau', { nom: nouveauPlateau });
      $('fin-debloque').textContent = deb;
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      sauver(prog.reprise, 0);
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Cendres dorées et étincelles de victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: h + Math.random() * h * 0.3, vx: (Math.random() - 0.5) * 60, vy: -(120 + Math.random() * 200), r: 1.5 + Math.random() * 3.5, coul: i % 3 ? '#ffc84a' : COUL[i % 4], ph: Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += (b.vx + Math.sin(t / 300 + b.ph) * 30) * dt; b.y += b.vy * dt;
        c.globalAlpha = Math.max(0, 1 - (t - debut) / 2800);
        c.fillStyle = b.coul; rond(c, b.x, b.y, b.r); c.fill();
      });
      c.globalAlpha = 1;
      if (t - debut < 2800) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    fileUI.length = 0;
    libreUI = 0;
    filePlanchette.length = 0;
    bandeau('');
    $('reveil').classList.remove('actif');
    fermerVoile('voile-pause');
    fermerVoile('voile-fin');
    fermerVoile('voile-tuto');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  // Parcours solo : séance n contre 3 robots (force donnée par la séance).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    fileUI.length = 0;
    libreUI = 0;
    enPartie = true;
    enPause = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = null;
    motAffiche = '';
    afficherEcran('jeu');
    requestAnimationFrame(centrerPlanchette);
    const tuto = NIVEAUX[niveau - 1].tuto;
    // Première séance : le tutoriel du geste s'affiche toujours ; ensuite, une seule fois par nouveauté.
    if (tuto && (prog.tutos.indexOf(tuto) < 0 || niveau === 1)) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: NIVEAUX[niveau - 1].fr, options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  let tutoJeton = 0;
  function montrerTuto(cle, apres) {
    const images = TUTOS[cle] || TUTOS.base;
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const j = ++tutoJeton;
    let k = 0;
    function image() {
      if (j !== tutoJeton) return;
      const im = images[k % (images.length + 1)];
      k++;
      if (!im) { setTimeout(image, 700); return; }      // courte pause avant de recommencer
      dessinerTuto(im, cle === 'base' || cle === 'piege');
      setTimeout(image, im.fx ? 1700 : 1300);
    }
    image();
    const fermer = () => {
      tutoJeton++;
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;

    };

  function dessinerTuto(im, aide) {
    const mot = $('tuto-mot');
    mot.textContent = '';
    mot.classList.toggle('miroir', !!im.mi);
    mot.classList.remove('ferme');
    const fente = () => { const f = document.createElement('span'); f.className = 'fente'; return f; };
    if (im.mi && !im.fx) mot.appendChild(fente());
    im.m.split('').forEach((l, i) => {
      const sp = document.createElement('span');
      const q = im.q.charAt(i);
      sp.textContent = l;
      sp.style.color = q === '0' ? COUL[0] : q === '1' ? COUL[1] : COUL_ESPRIT;
      mot.appendChild(sp);
    });
    if (!im.mi && !im.fx) mot.appendChild(fente());
    if (im.fx === 'ferme' || im.fx === 'faux') { void mot.offsetWidth; mot.classList.add('ferme'); }
    const tuiles = $('tuto-tuiles');
    tuiles.textContent = '';
    const etats = im.e || {};
    im.t.split('').forEach((l) => {
      const sp = document.createElement('span');
      sp.textContent = l; sp.dataset.l = l;
      const cl = etats[l];
      if (cl === 'ferme' && aide) sp.insertAdjacentHTML('beforeend', CRANE);
      if (cl && cl !== 'ferme') sp.className = cl;
      tuiles.appendChild(sp);
    });
    // flammes de « Toi » et du robot
    const ligne = $('tuto-ligne');
    ligne.textContent = '';
    [0, 1].forEach((p) => {
      const d = document.createElement('span'); d.className = 'tuto-qui';
      const i = document.createElement('i'); i.style.background = COUL[p];
      const t = document.createElement('span'); t.textContent = tr(p === 0 ? 'place.toi' : 'place.robot');
      const f = document.createElement('span'); f.className = 'flammes'; f.innerHTML = flammesHtml(im.f[p], 0);
      d.append(i, t, f);
      ligne.appendChild(d);
    });
    if (im.fx === 'sel') {
      const d = document.createElement('span'); d.className = 'tuto-qui'; d.innerHTML = SEL; ligne.appendChild(d);
    }
    // la main vient toucher la lettre (ou la ligne des flammes pour le sel)
    const main = $('tuto-main'), scene = $('tuto-scene');
    main.style.display = im.main ? '' : 'none';
    if (im.main) {
      requestAnimationFrame(() => {
        const rs = scene.getBoundingClientRect();
        let cible = im.main === 'sel' ? ligne : tuiles.querySelector('[data-l="' + im.main + '"]');
        if (!cible) return;
        const rc = cible.getBoundingClientRect();
        main.style.transition = 'none';

        void main.offsetWidth;
        main.style.transition = '';
        main.style.transform = 'translate(' + (rc.left - rs.left + rc.width / 2 - 20) + 'px,' + (rc.top - rs.top + rc.height / 2 - 4) + 'px)';
        setTimeout(() => { const c = tuiles.querySelector('[data-l="' + im.main + '"]'); if (c) c.classList.add('flash'); }, 600);
      });

  function poser(l) {
    if (!partie || enPause || attenteTuto) return;
    if (!peutJouer()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    const e = vue;
    if (!R.valide(e, partie.siege, l)) {
      const cl = O.classe(e, l);
      toast(tr(cl === 'refuse' ? 'lettre.refusee' : 'lettre.morte', { l: l }), 1800);
      sons.non();
      const b = $('l-' + l);
      if (b) { b.classList.remove('secoue'); void b.offsetWidth; b.classList.add('secoue'); }
      return;
    }
    if (partie.jouer(l)) {
      const b = $('l-' + l);
      if (b) { b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 300); }
      majInterface();
    }
  }

  function jeterSel() {
    if (!partie || !vue || !peutJouer()) return;
    if (!O.peutSel(vue, partie.siege)) { toast(tr('sel.impossible'), 1800); sons.non(); return; }
    if (partie.jouer('SEL')) majInterface();
  }

  // Clavier : une lettre tapée la pose ; flèches pour viser, Entrée pour poser,
  // Retour arrière pour jeter du sel, Échap pour la pause.
  function deplacerCurseur(dx, dy) {
    if (curseur < 0) { curseur = 0; majPlateau(); return; }
    const l = O.ALPHA.charAt(curseur);
    let r = RANGEES.findIndex((x) => x.indexOf(l) >= 0), c = RANGEES[r].indexOf(l);
    if (dx) { c += dx; if (c < 0) { r = (r + 3) % 4; c = RANGEES[r].length - 1; } else if (c >= RANGEES[r].length) { r = (r + 1) % 4; c = 0; } }
    if (dy) { r = (r + dy + 4) % 4; c = Math.min(c, RANGEES[r].length - 1); }
    curseur = O.ALPHA.indexOf(RANGEES[r].charAt(c));
    sons.clic();
    majPlateau();
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) { ev.preventDefault(); audio(); deplacerCurseur(dirs[ev.code][0], dirs[ev.code][1]); return; }
    if (ev.code === 'Enter' || ev.code === 'NumpadEnter' || ev.code === 'Space') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement.id !== 'btn-pause') return;
      ev.preventDefault(); audio();
      if (curseur >= 0) poser(O.ALPHA.charAt(curseur)); else { curseur = 0; majPlateau(); }
      return;
    }
    if (ev.code === 'Backspace' || ev.code === 'Delete') { ev.preventDefault(); audio(); jeterSel(); return; }
    const touche = (ev.key || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
    if (touche.length === 1 && O.ALPHA.indexOf(touche) >= 0) { ev.preventDefault(); audio(); poser(touche); }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); appliquerPlateau(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-grimoire').addEventListener('click', () => { audio(); sons.clic(); ouvrirGrimoire(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('gri-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-sel').addEventListener('click', () => { audio(); jeterSel(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, 0);
  });

  window.addEventListener('resize', () => {
    if (ecran !== 'jeu') dessinerTitre(performance.now());
    else { filePlanchette.length = 0; planchetteOccupee = false; centrerPlanchette(); }
  });

  document.title = tr('titre');
  chargerProgression();
  construire();
  majBoutonsSon();
  appliquerPlateau();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); appliquerPlateau(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
