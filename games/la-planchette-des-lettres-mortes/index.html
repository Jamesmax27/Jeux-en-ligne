<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // =====================================================================
  //  La Planchette des Lettres Mortes — jeu de mots et de stratégie (13+)
  //  Chacun son tour ajoute une lettre au mot commencé par l'esprit ;
  //  qui termine un mot réveille le spectre et perd une flamme.
  //  Solo : 20 séances contre 1 à 3 robots. En ligne : de vrais joueurs
  //  remplacent les robots (moteur commun JEL_MULTI). Règles : jel-regles.
  // =====================================================================

  const JEU = 'la-planchette-des-lettres-mortes';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const ALPHA = O.ALPHA;
  const SEL = O.SEL;
  const NIVEAUX = R.niveaux;
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);
  const copie = (x) => JSON.parse(JSON.stringify(x));

  // Couleurs des 4 médiums (places).
  const COUL = ['#ffb347', '#7fd3ff', '#c792ff', '#8ef0a0'];
  // Plateaux hantés : couleurs et étoiles nécessaires.
  const PLATEAUX = [
    { id: 'chene', seuil: 0, b1: '#6a4426', b2: '#2e1b0e', g: '#c99a4a', l: '#f3dcae' },
    { id: 'os', seuil: 8, b1: '#d8ccb0', b2: '#7a6c54', g: '#4a3a28', l: '#2a1a10' },
    { id: 'amethyste', seuil: 18, b1: '#5a3280', b2: '#1e0e34', g: '#c8a0ff', l: '#f0e0ff' },
    { id: 'mousse', seuil: 30, b1: '#3a5a32', b2: '#122012', g: '#9fd07a', l: '#e2f6cc' },
    { id: 'cendre', seuil: 42, b1: '#4a4a52', b2: '#141418', g: '#b0b0c0', l: '#f0f0f6' },
    { id: 'sang', seuil: 54, b1: '#6a1422', b2: '#22060c', g: '#ff8a7a', l: '#ffe0d8' }
  ];
  // Rangées du plateau : deux moitiés de 13 lettres (A à M, N à Z).
  const RANGEES = [[0, 7], [7, 13], [13, 20], [20, 26]];

  // ---------------------------------------------------------------------
  //  Dessins (SVG en chaînes, sans aucun texte)
  // ---------------------------------------------------------------------

  function avatarSVG(s, cls) {
    const c = COUL[s] || '#999';
    return '<svg class="' + (cls || 'avatar') + '" viewBox="0 0 48 48" aria-hidden="true">' +
      '<circle cx="24" cy="24" r="23" fill="#120a10" stroke="' + c + '" stroke-width="2"/>' +
      '<path d="M24 6 C 12 6, 8 18, 9 30 C 10 38, 8 42, 6 46 L 42 46 C 40 42, 38 38, 39 30 C 40 18, 36 6, 24 6 Z" fill="' + c + '" opacity=".85"/>' +
      '<ellipse cx="24" cy="26" rx="10" ry="12" fill="#0a0610"/>' +
      '<ellipse cx="20" cy="25" rx="2.4" ry="3" fill="' + c + '"/><ellipse cx="28" cy="25" rx="2.4" ry="3" fill="' + c + '"/>' +
      (s === 0 ? '<path d="M14 12 l4 4 M34 12 l-4 4" stroke="#0a0610" stroke-width="2"/>' : '') +
      (s === 1 ? '<circle cx="24" cy="10" r="3" fill="#0a0610"/>' : '') +
      (s === 2 ? '<path d="M18 9 L24 4 L30 9" fill="none" stroke="#0a0610" stroke-width="2"/>' : '') +
      (s === 3 ? '<path d="M17 36 Q24 40 31 36" fill="none" stroke="' + c + '" stroke-width="1.5"/>' : '') +
      '</svg>';
  }
  const FLAMME_ON = '<svg viewBox="0 0 13 16" aria-hidden="true"><path d="M6.5 1 C 9 5, 12 7, 11 11 C 10 14, 8 15, 6.5 15 C 4 15, 2 13.5, 2 11 C 2 8, 4.5 7, 5 4 C 6 6, 6.5 7, 7 6 C 7.5 4.5, 7 3, 6.5 1 Z" fill="#ff9a2a"/><path d="M6.5 8 C 8 10, 8.5 11, 8 12.5 C 7.5 13.6, 5.5 13.6, 5 12.5 C 4.6 11.5, 5.5 10, 6.5 8 Z" fill="#ffe27a"/></svg>';
  const FLAMME_OFF = '<svg viewBox="0 0 13 16" aria-hidden="true"><path d="M6 15 C 4 12, 8 10, 6 7 C 5 5, 7 3, 6 1" fill="none" stroke="#6a5a5a" stroke-width="1.4" stroke-linecap="round"/></svg>';
  const ICONE_SEL = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6 h10 l-1.2 8 h-7.6 z" fill="#e8e8f0"/><rect x="4" y="3" width="8" height="3" rx="1" fill="#b0b0c0"/><circle cx="6" cy="1.6" r=".9" fill="#fff"/><circle cx="9" cy="1" r=".7" fill="#fff"/><circle cx="11" cy="2" r=".8" fill="#fff"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 l1.9 4 4.4.5-3.3 3 .9 4.4L8 11.2 4.1 13.4 5 9 1.7 6l4.4-.5z" fill="currentColor"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="3.2" fill="currentColor"/><path d="M2 15c0-3.6 2.7-5.8 6-5.8s6 2.2 6 5.8z" fill="currentColor"/></svg>';
  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="4.5" width="11" height="9" rx="2.5" fill="currentColor"/><rect x="7.2" y="1" width="1.6" height="3.5" fill="currentColor"/><circle cx="5.8" cy="9" r="1.4" fill="#120a10"/><circle cx="10.2" cy="9" r="1.4" fill="#120a10"/></svg>';
  const ICONE_COURONNE = '<svg class="couronne" viewBox="0 0 24 18" aria-hidden="true"><path d="M2 16 L3 5 L8 10 L12 2 L16 10 L21 5 L22 16 Z" fill="#ffd37a" stroke="#8a5a10" stroke-width="1.5"/></svg>';
  const ICONE_SON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5c1.5 1 1.5 6 0 7M18.5 6c3 2.5 3 9.5 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  const ICONE_MUET = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  const MAIN = '<svg viewBox="0 0 40 46" aria-hidden="true"><path d="M14 4 c0-3 5-3 5 0 v14 c0-3 5-3 5 0 v2 c0-3 5-3 5 0 v2 c0-3 5-3 5 0 v10 c0 7-5 12-12 12 h-2 c-5 0-8-3-11-7 l-6-9 c-2-3 2-6 5-3 l4 4 z" fill="#fff4e0" stroke="#3a1c08" stroke-width="2.2" stroke-linejoin="round"/></svg>';
  const FANTOME = '<svg viewBox="0 0 200 240" aria-hidden="true"><path d="M100 8 C 40 8, 22 60, 26 120 C 28 160, 18 200, 10 232 C 30 214, 40 236, 58 214 C 72 236, 86 214, 100 236 C 114 214, 128 236, 142 214 C 160 236, 170 214, 190 232 C 182 200, 172 160, 174 120 C 178 60, 160 8, 100 8 Z" fill="#dff2ff"/><ellipse cx="72" cy="92" rx="16" ry="24" fill="#0a0612"/><ellipse cx="128" cy="92" rx="16" ry="24" fill="#0a0612"/><path d="M70 150 C 80 136, 120 136, 130 150 C 124 178, 76 178, 70 150 Z" fill="#0a0612"/></svg>';

  function flammesHTML(n, max) {
    let h = '';
    for (let k = 0; k < max; k++) h += k < n ? FLAMME_ON : FLAMME_OFF;
    return h;
  }

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = { etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, tutos: [], grimoire: [], plateau: 'chene', options: { son: true } };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);
  const TUTOS_CONNUS = ['base', 'tour', 'maudite', 'table', 'bougie', 'sel', 'miroir', 'esprit', 'endurance', 'enrage'];

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 9999, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => TUTOS_CONNUS.indexOf(x) >= 0);
      if (Array.isArray(d.grimoire)) prog.grimoire = d.grimoire.filter((x) => typeof x === 'string' && /^[A-Z]{4,9}$/.test(x)).slice(0, 2000);
      if (typeof d.plateau === 'string' && PLATEAUX.some((p) => p.id === d.plateau)) prog.plateau = d.plateau;
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
    if (!plateauOuvert(prog.plateau)) prog.plateau = 'chene';
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.grimoire = [];
    prog.plateau = 'chene';
    appliquerPlateau();
  }

  function sauver(niveauReprise, score) {
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
        debloque: prog.debloque, tutos: prog.tutos.slice(), grimoire: prog.grimoire.slice(), plateau: prog.plateau,
        options: { son: prog.options.son }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Réglages changés hors d'une séance : seulement si une sauvegarde existe déjà
  // (jamais de nouvelle sauvegarde depuis l'écran titre).
  function sauverReglages(champs) {
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, champs); } catch (e) { /* rien */ }
  }
  function sauverSon() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    sauverReglages({ options: { son: prog.options.son } });
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);
  const plateauOuvert = (id) => { const p = PLATEAUX.find((x) => x.id === id); return !!p && totalEtoiles() >= p.seuil; };

  function appliquerPlateau() {
    const p = PLATEAUX.find((x) => x.id === prog.plateau) || PLATEAUX[0];
    const r = document.documentElement.style;
    r.setProperty('--bois', p.b1); r.setProperty('--bois2', p.b2); r.setProperty('--grave', p.g); r.setProperty('--lettre', p.l);
  }

  // Mot ajouté au grimoire : vrai si c'est un nouveau mot.
  function noterMot(w) {
    if (!w || prog.grimoire.indexOf(w) >= 0) return false;
    prog.grimoire.push(w);
    return true;
  }

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ctx = null;
  function audio() {
    if (!prog.options.son) return null;
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch (e) { /* rien */ } }
    return ctx;
  }
  function note(freq, duree, type, vol, retard, glisse) {
    const c = ctx;
    if (!c || !prog.options.son) return;
    const t0 = c.currentTime + (retard || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (glisse) o.frequency.exponentialRampToValueAtTime(glisse, t0 + duree);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + duree + 0.05);
  }
  function bruit(duree, vol, filtre, retard, q) {
    const c = ctx;
    if (!c || !prog.options.son) return;
    const t0 = c.currentTime + (retard || 0);
    const n = Math.floor(c.sampleRate * duree), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = filtre || 1200; f.Q.value = q || 1;
    g.gain.setValueAtTime(vol || 0.1, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t0); src.stop(t0 + duree + 0.05);
  }
  const sons = {
    clic() { note(660, 0.06, 'triangle', 0.07); },
    glisse() { bruit(0.28, 0.06, 700, 0, 0.8); note(180, 0.25, 'sine', 0.04, 0, 140); },
    pose() { note(150, 0.12, 'triangle', 0.16); bruit(0.08, 0.1, 400); note(392, 0.25, 'sine', 0.05, 0.05); },
    non() { note(140, 0.18, 'square', 0.05, 0, 110); },
    tour() { note(523, 0.18, 'sine', 0.08); note(784, 0.3, 'sine', 0.06, 0.12); },
    tic() { note(1200, 0.04, 'square', 0.04); },
    spectre() {
      bruit(1.1, 0.22, 900, 0, 0.6);
      note(220, 1.0, 'sawtooth', 0.08, 0, 70); note(233, 1.0, 'sawtooth', 0.07, 0.02, 75);
      note(1400, 0.6, 'sine', 0.05, 0.05, 600);
    },
    spectreLoin() { bruit(0.6, 0.08, 800, 0, 0.6); note(300, 0.6, 'sawtooth', 0.04, 0, 120); },
    souffle() { bruit(0.5, 0.12, 2400, 0.1, 0.5); },
    maudit() { note(98, 0.6, 'sawtooth', 0.1, 0, 60); note(104, 0.6, 'sawtooth', 0.08); },
    bougie() { bruit(0.45, 0.08, 1800, 0, 0.4); },
    sel() { for (let k = 0; k < 7; k++) bruit(0.04, 0.12, 3000 + k * 300, k * 0.05, 3); note(880, 0.2, 'triangle', 0.04, 0.3, 440); },
    miroir() { [1046, 1318, 1568, 2093].forEach((f, k) => note(f, 0.4, 'sine', 0.04, k * 0.07)); },
    esprit() { [220, 277, 330].forEach((f, k) => note(f, 1.1, 'sine', 0.05, k * 0.05, f * 0.98)); bruit(0.9, 0.05, 500, 0, 0.5); },
    victoire() { [392, 494, 587, 784].forEach((f, k) => note(f, 0.32, 'triangle', 0.1, k * 0.13)); note(988, 0.7, 'sine', 0.06, 0.55); },
    defaite() { [330, 294, 247, 196].forEach((f, k) => note(f, 0.45, 'sawtooth', 0.05, k * 0.2)); },
    arrive() { note(587, 0.15, 'sine', 0.07); note(880, 0.25, 'sine', 0.07, 0.1); },
    part() { note(587, 0.15, 'sine', 0.06); note(392, 0.3, 'sine', 0.06, 0.1); }
  };

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.innerHTML = prog.options.son ? ICONE_SON : ICONE_MUET;
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    prog.options.son = !prog.options.son;
    sauverSon();
    majBoutonsSon();
    if (prog.options.son) { audio(); sons.clic(); }
  }

  // ---------------------------------------------------------------------
  //  Écrans, toast, bandeau
  // ---------------------------------------------------------------------

  let ecran = 'titre';
  function afficherEcran(nom) {
    ecran = nom;
    document.querySelectorAll('.ecran').forEach((e) => e.classList.toggle('actif', e.id === 'ecran-' + nom));
    if (nom === 'titre') { majTitre(); lancerFond(); }
    else arreterFond();
    if (nom === 'jeu') { relancerBoucle(); requestAnimationFrame(() => placerPlanchette(true)); }
  }

  let toastFin = 0;
  function toast(texte, duree) {
    const t = $('toast');
    t.textContent = texte;
    t.classList.add('actif');
    clearTimeout(toastFin);
    toastFin = setTimeout(() => t.classList.remove('actif'), duree || 2400);
  }
  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  // ---------------------------------------------------------------------
  //  Décor de l'écran titre (salle de séance, sans aucun texte)
  // ---------------------------------------------------------------------

  let fondId = 0;
  function lancerFond() { if (!fondId) fondId = requestAnimationFrame(boucleFond); }
  function arreterFond() { if (fondId) cancelAnimationFrame(fondId); fondId = 0; dessinerFondSimple(); }
  function boucleFond(t) { dessinerTitre(t); fondId = ecran === 'titre' ? requestAnimationFrame(boucleFond) : 0; }

  function preparerFond() {
    const cv = $('fond'), dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = window.innerWidth, h = window.innerHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { c: c, w: w, h: h };
  }
  function dessinerFondSimple() {
    const { c, w, h } = preparerFond();
    c.fillStyle = '#0d0812'; c.fillRect(0, 0, w, h);
  }

  function dessinerTitre(t) {
    t = t || 0;
    const { c, w, h } = preparerFond();
    const p = PLATEAUX.find((x) => x.id === prog.plateau) || PLATEAUX[0];
    const vac = 0.85 + 0.15 * Math.sin(t / 130) * Math.sin(t / 47 + 1);
    // Pièce sombre éclairée par la bougie
    const bx = w * 0.78, by = h * 0.5;
    let g = c.createRadialGradient(bx, by, 10, bx, by, Math.max(w, h) * 0.9);
    g.addColorStop(0, 'rgba(255,150,60,' + (0.45 * vac) + ')');
    g.addColorStop(0.35, '#2a1418');
    g.addColorStop(1, '#07040a');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    // Rideaux au fond
    c.fillStyle = '#1a0a14';
    for (let i = 0; i < 9; i++) {
      const x = (i / 8) * w;
      c.beginPath(); c.moveTo(x - 30, 0); c.quadraticCurveTo(x, h * 0.25, x - 10, h * 0.55); c.lineTo(x + 30, h * 0.55); c.quadraticCurveTo(x + 40, h * 0.25, x + 30, 0); c.closePath();
      c.globalAlpha = 0.35; c.fill(); c.globalAlpha = 1;
    }
    // Spectre flou derrière la table
    const sy = h * 0.3 + Math.sin(t / 900) * 8;
    c.save();
    c.globalAlpha = 0.18 + 0.06 * Math.sin(t / 600);
    c.fillStyle = '#cfeaff';
    c.beginPath();
    const sx = w * 0.32, sw = Math.min(w, h) * 0.22;
    c.moveTo(sx, sy - sw); c.bezierCurveTo(sx - sw, sy - sw, sx - sw * 1.1, sy + sw * 0.6, sx - sw * 0.9, sy + sw * 1.4);
    for (let k = 0; k <= 6; k++) c.lineTo(sx - sw * 0.9 + (k / 6) * sw * 1.8, sy + sw * (k % 2 ? 1.2 : 1.45));
    c.bezierCurveTo(sx + sw * 1.1, sy + sw * 0.6, sx + sw, sy - sw, sx, sy - sw);
    c.fill();
    c.globalAlpha = 0.35; c.fillStyle = '#05020a';
    c.beginPath(); c.ellipse(sx - sw * 0.32, sy - sw * 0.2, sw * 0.13, sw * 0.2, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(sx + sw * 0.32, sy - sw * 0.2, sw * 0.13, sw * 0.2, 0, 0, Math.PI * 2); c.fill();
    c.restore();
    // Table ronde
    const portrait = h > w * 1.2;
    const tx = w / 2, ty = h * (portrait ? 0.5 : 0.72), trx = Math.min(w * (portrait ? 0.56 : 0.62), 520), tryy = trx * (portrait ? 0.42 : 0.34);
    g = c.createRadialGradient(tx, ty - tryy * 0.4, 10, tx, ty, trx);
    g.addColorStop(0, '#4a2a18'); g.addColorStop(1, '#160a06');
    c.fillStyle = '#0a0504'; c.beginPath(); c.ellipse(tx, ty + 14, trx, tryy, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = g; c.beginPath(); c.ellipse(tx, ty, trx, tryy, 0, 0, Math.PI * 2); c.fill();
    // Plateau de séance (symboles : lunes, étoiles, soleils — aucune lettre)
    const pw = trx * 1.15, ph = tryy * 1.15;
    g = c.createLinearGradient(tx - pw / 2, ty - ph / 2, tx + pw / 2, ty + ph / 2);
    g.addColorStop(0, p.b1); g.addColorStop(1, p.b2);
    c.save();
    c.beginPath(); c.ellipse(tx, ty, pw / 2, ph / 2, 0, 0, Math.PI * 2);
    c.fillStyle = g; c.fill();
    c.lineWidth = 3; c.strokeStyle = p.g; c.stroke();
    c.beginPath(); c.ellipse(tx, ty, pw / 2 - 10, ph / 2 - 7, 0, 0, Math.PI * 2); c.lineWidth = 1.2; c.stroke();
    c.fillStyle = p.g;
    for (let k = 0; k < 18; k++) {
      const a = Math.PI * (1.05 + (k / 17) * 0.9);
      const x = tx + Math.cos(a) * (pw / 2 - 26), y = ty + Math.sin(a) * (ph / 2 - 16) + ph * 0.1;
      symbole(c, k % 3, x, y, Math.max(4, pw * 0.018));
    }
    // soleil et lune aux coins
    c.beginPath(); c.arc(tx - pw * 0.33, ty + ph * 0.18, pw * 0.04, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(tx + pw * 0.33, ty + ph * 0.18, pw * 0.04, 0, Math.PI * 2); c.fill();
    c.fillStyle = p.b2;
    c.beginPath(); c.arc(tx + pw * 0.33 + pw * 0.02, ty + ph * 0.18 - pw * 0.012, pw * 0.035, 0, Math.PI * 2); c.fill();
    c.restore();
    // Planchette qui dérive
    const px = tx + Math.sin(t / 1400) * pw * 0.18, py = ty + Math.cos(t / 1700) * ph * 0.08;
    planchetteCanvas(c, px, py, pw * 0.14);
    // Bougie
    bougieCanvas(c, bx, by + h * 0.12, Math.min(w, h) * 0.05, t);
    // Volutes
    c.save();
    c.strokeStyle = 'rgba(200,220,255,0.12)'; c.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      c.beginPath();
      const ox = bx + Math.sin(t / 700 + k) * 10;
      c.moveTo(ox, by + h * 0.05);
      c.bezierCurveTo(ox - 30, by - 30 - k * 20, ox + 30, by - 80 - k * 30, ox - 10, by - 140 - k * 40);
      c.stroke();
    }
    c.restore();
  }

  function symbole(c, type, x, y, r) {
    c.beginPath();
    if (type === 0) { // étoile
      for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.45 : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
      c.closePath(); c.fill();
    } else if (type === 1) { // croissant de lune
      c.arc(x, y, r, 0, Math.PI * 2); c.fill();
      c.save(); c.globalCompositeOperation = 'destination-out'; c.beginPath(); c.arc(x + r * 0.45, y - r * 0.2, r * 0.85, 0, Math.PI * 2); c.fill(); c.restore();
    } else { // œil
      c.ellipse(x, y, r * 1.1, r * 0.55, 0, 0, Math.PI * 2); c.fill();
    }
  }

  function planchetteCanvas(c, x, y, s) {
    c.save();
    c.translate(x, y);
    c.shadowColor = '#000'; c.shadowBlur = 12; c.shadowOffsetY = 6;
    c.beginPath();
    c.moveTo(0, s * 0.9);
    c.bezierCurveTo(-s * 0.7, s * 0.4, -s * 0.9, -s * 0.2, -s * 0.8, -s * 0.5);
    c.bezierCurveTo(-s * 0.7, -s * 0.9, -s * 0.15, -s * 1.0, 0, -s * 0.7);
    c.bezierCurveTo(s * 0.15, -s * 1.0, s * 0.7, -s * 0.9, s * 0.8, -s * 0.5);
    c.bezierCurveTo(s * 0.9, -s * 0.2, s * 0.7, s * 0.4, 0, s * 0.9);
    const g = c.createLinearGradient(-s, -s, s, s);
    g.addColorStop(0, '#d9a066'); g.addColorStop(1, '#6a3a18');
    c.fillStyle = g; c.fill();
    c.shadowBlur = 0; c.shadowOffsetY = 0;
    c.lineWidth = 2; c.strokeStyle = '#2a1206'; c.stroke();
    c.beginPath(); c.arc(0, -s * 0.2, s * 0.32, 0, Math.PI * 2);
    c.fillStyle = 'rgba(220,240,255,0.35)'; c.fill(); c.strokeStyle = '#e8c070'; c.lineWidth = 2; c.stroke();
    c.restore();
  }

  function bougieCanvas(c, x, y, s, t) {
    const vac = Math.sin(t / 90) * 0.12 + Math.sin(t / 37) * 0.08;
    c.save();
    // halo
    const g = c.createRadialGradient(x, y - s * 2.6, 2, x, y - s * 2.6, s * 5);
    g.addColorStop(0, 'rgba(255,200,110,0.55)'); g.addColorStop(1, 'rgba(255,140,40,0)');
    c.fillStyle = g; c.beginPath(); c.arc(x, y - s * 2.6, s * 5, 0, Math.PI * 2); c.fill();
    // cire
    c.fillStyle = '#e8dcc4';
    c.fillRect(x - s * 0.5, y - s * 1.9, s, s * 2.2);
    c.beginPath(); c.ellipse(x, y - s * 1.9, s * 0.5, s * 0.16, 0, 0, Math.PI * 2); c.fillStyle = '#f6eedc'; c.fill();
    c.fillStyle = '#d0c2a4';
    c.beginPath(); c.moveTo(x + s * 0.2, y - s * 1.85); c.quadraticCurveTo(x + s * 0.35, y - s * 1.2, x + s * 0.28, y - s * 0.9); c.lineTo(x + s * 0.4, y - s * 0.9); c.lineTo(x + s * 0.5, y - s * 1.85); c.fill();
    // bougeoir
    c.fillStyle = '#6a4a1a'; c.beginPath(); c.ellipse(x, y + s * 0.3, s * 1.1, s * 0.3, 0, 0, Math.PI * 2); c.fill();
    // flamme
    c.translate(x, y - s * 2.05);
    c.scale(1 + vac * 0.3, 1 - vac * 0.2);
    c.beginPath();
    c.moveTo(0, 0); c.bezierCurveTo(-s * 0.4, -s * 0.3, -s * 0.2, -s * 0.9, 0, -s * 1.4); c.bezierCurveTo(s * 0.2, -s * 0.9, s * 0.4, -s * 0.3, 0, 0);
    c.fillStyle = '#ff9a2a'; c.fill();
    c.beginPath(); c.moveTo(0, -s * 0.05); c.bezierCurveTo(-s * 0.18, -s * 0.25, -s * 0.1, -s * 0.6, 0, -s * 0.85); c.bezierCurveTo(s * 0.1, -s * 0.6, s * 0.18, -s * 0.25, 0, -s * 0.05);
    c.fillStyle = '#fff1b0'; c.fill();
    c.restore();
  }

  // Petite bougie de l'écran de jeu (éteinte quand une moitié du plateau est dans le noir).
  function dessinerBougie(t) {
    const cv = $('bougie'), c = cv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, cv.width, cv.height);
    // Fin de séance : la bougie attend d'être soufflée, puis fume.
    if (vue && vue.der) { bougieCanvas(c, 54, 92, 22 + Math.sin(t / 200) * 1.5, t * 2); return; }
    const sombre = vue && ((vue.m && vue.m.b && vue.nuit >= 0) || vue.fini);
    if (!vue || !vue.m || (!vue.m.b && !vue.fini)) {
      // sans bougie : trois petites étoiles qui scintillent
      c.fillStyle = 'rgba(255,211,122,0.6)';
      for (let k = 0; k < 3; k++) { c.globalAlpha = 0.4 + 0.4 * Math.sin(t / 400 + k * 2); symbole(c, 0, 30 + k * 24, 50 + (k % 2) * 10, 6); }
      c.globalAlpha = 1;
      return;
    }
    if (sombre) {
      c.fillStyle = '#e8dcc4'; c.fillRect(44, 54, 20, 40);
      c.strokeStyle = 'rgba(180,180,200,0.5)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(54, 52); c.bezierCurveTo(46, 40, 62, 30, 52, 10 + Math.sin(t / 300) * 3); c.stroke();
    } else bougieCanvas(c, 54, 92, 20, t);
  }

  // ---------------------------------------------------------------------
  //  Plateau de lettres et places
  // ---------------------------------------------------------------------

  const boutonsLettres = [];
  function construirePlateau() {
    const pl = $('plateau');
    pl.textContent = '';
    for (let h = 0; h < 2; h++) {
      const m = document.createElement('div');
      m.className = 'moitie';
      m.id = 'moitie-' + h;
      for (let r = h * 2; r < h * 2 + 2; r++) {
        const rang = document.createElement('div');
        rang.className = 'rang-lettres';
        for (let i = RANGEES[r][0]; i < RANGEES[r][1]; i++) {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'lettre';
          b.textContent = ALPHA.charAt(i);
          b.dataset.i = String(i);
          b.addEventListener('click', () => { audio(); toucherLettre(i); });
          boutonsLettres[i] = b;
          rang.appendChild(b);
        }
        m.appendChild(rang);
      }
      pl.appendChild(m);
    }
  }

  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place';
      d.id = 'place-' + s;
      d.style.setProperty('--c', COUL[s]);
      d.innerHTML = ICONE_COURONNE + avatarSVG(s) + '<span class="tag"></span><span class="flammes"></span><span class="sels"></span>';
      boite.appendChild(d);
      const p = document.createElement('div');
      p.className = 'salon-place';
      p.id = 'salon-place-' + s;
      p.innerHTML = ICONE_COURONNE + avatarSVG(s) + '<span class="tag"></span>';
      salon.appendChild(p);
    }
  }

  // Le rôle d'une place : toi, un vrai joueur ou un robot.
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché : le pseudo d'un vrai joueur en ligne (partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    if (tag.dataset.role === role && tag.dataset.nom === nom) return;
    tag.dataset.role = role;
    tag.dataset.nom = nom;
    tag.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : role === 'vide' ? '' : ICONE_ROBOT;
    const txt = document.createElement('span');
    txt.textContent = nom;
    tag.appendChild(txt);
  }
  function siegesActuels() {
    // Avant le départ d'une séance solo (tutoriel) : la place 0 est la tienne.
    if (!partie) return session === 'solo' ? [{ humain: true, moi: true }] : [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  const absente = (s) => !!vue && vue.el[s] === -1;
  const maxFlammes = (s) => (vue && vue.n >= 0 && s > 0 ? NIVEAUX[vue.n].rf : (vue && vue.n >= 0 ? O.FLAMMES_JOUEUR : O.FLAMMES_LIGNE));
  function nomCourt(s) {
    const info = siegesActuels()[s] || {};
    const role = s === moiPlace() ? 'toi' : roleDe(info);
    return role === 'toi' ? tr('place.toi') : (role === 'joueur' && info.nom ? info.nom : tr('medium.' + s));
  }
  const moiPlace = () => (partie ? partie.siege : -1);

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !e.fini ? e.tour : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const vide = absente(s);
      const role = vide ? 'vide' : roleDe(info);
      const nom = vide ? tr('place.vide') : nomPlace(info, role);
      remplirTag(d.querySelector('.tag'), role, nom);
      const fl = e ? e.fl[s] : 0, max = Math.max(fl, maxFlammes(s));
      const fh = vide ? '' : flammesHTML(fl, max);
      const fz = d.querySelector('.flammes');
      if (fz.dataset.v !== fh) { fz.dataset.v = fh; fz.innerHTML = fh; }
      const sz = d.querySelector('.sels'), se = e && e.m && e.m.s && !vide ? e.se[s] : -1;
      const sh = se >= 0 ? ICONE_SEL + nb(se) : '';
      if (sz.dataset.v !== sh) { sz.dataset.v = sh; sz.innerHTML = sh; }
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('absent', vide);
      d.classList.toggle('elimine', !!e && !vide && fl <= 0);
      d.setAttribute('aria-label', vide ? tr('place.vide') : tr('place.aria', { medium: tr('medium.' + s), qui: nom, n: fl }));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || e.fini) return '';
    if (partie.siege < 0) return tr('multi.attente');
    const moi = partie.siege;
    if (e.der) return e.tour === moi ? tr('tour.souffle') : tr('tour.souffleAutre', { nom: nomCourt(e.tour) });
    if (e.fl[moi] <= 0) return tr('tour.elimine');
    if (e.tour === moi) {
      if (e.ban >= 0) return tr('tour.refusee', { l: ALPHA.charAt(e.ban) });
      if (e.mir) return tr('tour.toiMiroir');
      return tr('tour.toi');
    }
    return tr('tour.autre', { nom: nomCourt(e.tour) });
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  // Le mot en cours : lettres de l'esprit en pâle, maudites en rouge, case de la prochaine lettre.
  let motAffiche = '';
  function majMot() {
    const e = vue, boite = $('mot'), etat = $('etat-mot');
    let cle = '';
    if (e && !e.fini && !e.der) {
      const monTour = partie && partie.monTour() && !attenteTuto;
      cle = e.f + '|' + e.q.join(',') + '|' + e.mir + '|' + e.mau + '|' + (monTour ? choix : -2) + '|' + e.k;
    }
    if (cle === motAffiche) return;
    const ancien = motAffiche.split('|');
    motAffiche = cle;
    boite.textContent = '';
    etat.textContent = '';
    if (!e || e.fini || e.der) { boite.classList.remove('miroir'); return; }
    boite.classList.toggle('miroir', !!e.mir);
    const monTour = partie && partie.monTour() && !attenteTuto;
    const meme = ancien[5] === String(e.k);
    const tuiles = [];
    for (let k = 0; k < e.f.length; k++) {
      const ch = e.f.charAt(k), sp = document.createElement('span');
      sp.className = 'tuile' + (e.q[k] === -1 ? ' esprit' : '') + (e.m.c && e.mau.indexOf(ch) >= 0 ? ' maudite' : '');
      sp.textContent = ch;
      tuiles.push(sp);
    }
    // Lettre nouvelle : petite animation d'arrivée.
    if (meme && ancien[0] !== undefined && e.f.length > ancien[0].length) {
      const pos = e.mir ? 0 : e.f.length - 1;
      if (tuiles[pos]) tuiles[pos].classList.add('arrive');
    }
    const vide = document.createElement('span');
    vide.className = 'tuile vide' + (monTour && choix >= 0 ? ' apercu' : '');
    vide.textContent = monTour && choix >= 0 ? ALPHA.charAt(choix) : '';
    if (e.mir) tuiles.unshift(vide); else tuiles.push(vide);
    tuiles.forEach((x) => boite.appendChild(x));
    boite.setAttribute('aria-label', tr('mot.aria', { mot: e.f }));
    // Pastilles : miroir, lettres maudites, bougie
    if (e.mir) etat.appendChild(pastille('miroir', tr('etat.miroir')));
    if (e.m.c && e.mau) etat.appendChild(pastille('maudit', tr('etat.maudites', { l: e.mau.split('').join(' ') })));
    if (e.m.b && e.nuit >= 0) etat.appendChild(pastille('bougie', tr('etat.noir')));
  }
  function pastille(cls, texte) { const p = document.createElement('span'); p.className = 'pastille ' + cls; p.textContent = texte; return p; }

  // Lettres vivantes / mortes / maudites / dans le noir / refusées.
  function majPlateau() {
    const e = vue;
    const monTour = !!(partie && partie.monTour() && !attenteTuto && e && !e.fini);
    const n = e && !e.fini && !e.der ? O.noeudDe(e.f, e.mir) : null;
    const permises = monTour ? O.lettresPermises(e) : [];
    $('moitie-0').classList.toggle('noire', !!(e && e.m.b && e.nuit === 0));
    $('moitie-1').classList.toggle('noire', !!(e && e.m.b && e.nuit === 1));
    for (let i = 0; i < 26; i++) {
      const b = boutonsLettres[i], ch = ALPHA.charAt(i);
      const enfant = n && n.c[ch];
      const noire = !!(e && e.m.b && e.nuit >= 0 && O.moitie(i) === e.nuit);
      const cls = ['lettre'];
      if (enfant && !noire) cls.push('vivante'); else if (!noire) cls.push('morte');
      if (noire) cls.push('noire');
      if (e && e.m.c && e.mau.indexOf(ch) >= 0 && !noire) cls.push('maudite');
      if (e && i === e.ban) cls.push('bannie');
      if (monTour && e.m.a && enfant && enfant.w && !noire) cls.push('fremit');
      if (monTour && i === choix) cls.push('choisie');
      if (b.classList.contains('posee')) cls.push('posee');
      const c = cls.join(' ');
      if (b.className !== c) b.className = c;
      const permis = permises.indexOf(i) >= 0;
      b.setAttribute('aria-disabled', permis ? 'false' : 'true');
      b.setAttribute('aria-label', noire ? tr('lettre.ariaNoire') : tr(permis ? 'lettre.aria' : 'lettre.ariaMorte', { l: ch }));
    }
    // Boutons Poser (ou Souffler la bougie) et Sel
    const poser = $('btn-poser');
    const souffle = monTour && e.der;
    poser.disabled = !(souffle || (monTour && choix >= 0 && permises.indexOf(choix) >= 0));
    poser.classList.toggle('souffle', !!souffle);
    const tp = souffle ? tr('bouton.souffler') : monTour ? (choix >= 0 ? tr('bouton.poser', { l: ALPHA.charAt(choix) }) : tr('bouton.choisir')) : tr('bouton.attendre');
    if (poser.textContent !== tp) poser.textContent = tp;
    const sel = $('btn-sel');
    const moi = moiPlace();
    sel.hidden = !(e && e.m.s && moi >= 0 && !absente(moi));
    if (!sel.hidden) {
      const reste = e.se[moi] || 0;
      const h = ICONE_SEL + '<span>' + tr('bouton.sel', { n: reste }) + '</span>';
      if (sel.dataset.v !== h) { sel.dataset.v = h; sel.innerHTML = h; }
      sel.disabled = !(monTour && O.selPossible(e, moi));
      sel.setAttribute('aria-label', tr('bouton.selAria', { n: reste }));
    }
    $('aide').textContent = monTour && !e.der ? tr(e.m.s && O.selPossible(e, moi) ? 'jeu.aideSel' : 'jeu.aide') : '';
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majMot();
    majPlateau();
    placerPlanchette();
  }

  // La planchette glisse sur la lettre choisie (ou sur la dernière lettre posée par un autre).
  let cibleAutre = -1, cibleAutreFin = 0;
  function placerPlanchette(immediat) {
    const pl = $('planchette'), zone = $('zone-plateau');
    if (!zone.clientWidth) return;
    let i = -1;
    const monTour = partie && partie.monTour() && !attenteTuto;
    if (monTour && choix >= 0) i = choix;
    else if (cibleAutre >= 0 && Date.now() < cibleAutreFin) i = cibleAutre;
    const zr = zone.getBoundingClientRect();
    let x, y;
    if (i >= 0) {
      const br = boutonsLettres[i].getBoundingClientRect();
      x = br.left - zr.left + br.width / 2 - 39;
      y = br.top - zr.top + br.height / 2 - 38;
    } else {
      const pr = $('plateau').getBoundingClientRect();
      x = pr.left - zr.left + pr.width / 2 - 39;
      y = pr.top - zr.top + pr.height / 2 - 38 + Math.sin(Date.now() / 900) * 3;
    }
    const v = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
    if (immediat) { pl.style.transition = 'none'; pl.style.transform = v; void pl.offsetWidth; pl.style.transition = ''; }
    else if (pl.style.transform !== v) pl.style.transform = v;
    pl.style.opacity = vue && !vue.fini ? '1' : '0';
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  let debutTour = 0, dernierTic = -1;
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fini) {
      const s = e.tour, sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    dessinerBougie(t);
    majTemps();
    majCompte();
    if (!(choix >= 0) && !(cibleAutre >= 0 && Date.now() < cibleAutreFin)) placerPlanchette();
    rafId = requestAnimationFrame(boucle);
  }

  // ---------------------------------------------------------------------
  //  Gestes du joueur
  // ---------------------------------------------------------------------

  let choix = -1, dernierAttends = 0;
  function toucherLettre(i) {
    if (ecran !== 'jeu' || enPause || !partie || !vue || attenteTuto) return;
    const e = vue;
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (O.lettresPermises(e).indexOf(i) < 0) {
      sons.non();
      if (e.m.b && e.nuit >= 0 && O.moitie(i) === e.nuit) toast(tr('lettre.noire'), 1600);
      else if (i === e.ban) toast(tr('lettre.bannie'), 1600);
      else toast(tr('lettre.morte', { l: ALPHA.charAt(i) }), 1800);
      return;
    }
    if (choix === i) { poser(); return; }
    choix = i;
    sons.glisse();
    majInterface();
  }

  function poser() {
    if (!partie || !vue || !partie.monTour()) return;
    if (vue.der) { if (partie.jouer(O.SOUFFLE)) sons.souffle(); return; }
    if (choix < 0) return;
    const i = choix;
    if (O.lettresPermises(vue).indexOf(i) < 0) return;
    if (partie.jouer(i)) {
      const b = boutonsLettres[i];
      b.classList.remove('posee'); void b.offsetWidth; b.classList.add('posee');
      setTimeout(() => b.classList.remove('posee'), 650);
    }
  }

  function jeterSel() {
    if (!partie || !vue || !partie.monTour()) return;
    const moi = partie.siege;
    if (!O.selPossible(vue, moi)) { sons.non(); toast(tr('sel.impossible'), 1800); return; }
    partie.jouer(SEL);
  }

  // Clavier : lettres, Entrée ou Espace pour poser, Retour arrière pour le sel, flèches, Échap pour la pause.
  function deplacerChoix(pas) {
    if (!partie || !partie.monTour() || !vue) return;
    const l = O.lettresPermises(vue);
    if (!l.length) return;
    let k = l.indexOf(choix);
    if (k < 0) k = pas > 0 ? -1 : 0;
    k = (k + pas + l.length * 4) % l.length;
    choix = l[k];
    sons.glisse();
    majInterface();
  }
  function deplacerRangee(sens) {
    if (!partie || !partie.monTour() || !vue) return;
    const l = O.lettresPermises(vue);
    if (!l.length) return;
    const depart = choix >= 0 ? choix : (sens > 0 ? 0 : 25);
    let mieux = -1, dist = Infinity;
    l.forEach((i) => {
      const dr = (rangDe(i) - rangDe(depart)) * sens;
      if (dr <= 0 && choix >= 0) return;
      const d = Math.abs(colonneDe(i) - colonneDe(depart)) + Math.abs(dr) * 0.1;
      if (d < dist) { dist = d; mieux = i; }
    });
    if (mieux < 0) return;
    choix = mieux;
    sons.glisse();
    majInterface();
  }
  function rangDe(i) { for (let r = 0; r < 4; r++) if (i < RANGEES[r][1]) return r; return 3; }
  function colonneDe(i) { const r = rangDe(i), lg = RANGEES[r][1] - RANGEES[r][0]; return (i - RANGEES[r][0]) - (lg - 7) / 2; }

  document.addEventListener('keydown', (ev) => {
    const voile = document.querySelector('.voile.actif');
    if (ev.code === 'Escape') {
      if (ecran === 'jeu' && !voile) { ev.preventDefault(); audio(); ouvrirPause(); }
      else if (voile && voile.id === 'voile-pause') { ev.preventDefault(); fermerPause(); }
      return;
    }
    if (ecran !== 'jeu' || voile || enPause) return;
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const k = (ev.key || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
    if (k.length === 1 && k >= 'A' && k <= 'Z') { ev.preventDefault(); audio(); toucherLettre(ALPHA.indexOf(k)); return; }
    if (ev.code === 'Enter' || ev.code === 'NumpadEnter' || ev.code === 'Space') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && !document.activeElement.classList.contains('lettre')) return;
      ev.preventDefault(); audio();
      if (choix >= 0 || (vue && vue.der)) poser(); else deplacerChoix(1);
      return;
    }
    if (ev.code === 'Backspace' || ev.code === 'Delete') { ev.preventDefault(); audio(); jeterSel(); return; }
    if (ev.code === 'ArrowRight') { ev.preventDefault(); audio(); deplacerChoix(1); }
    else if (ev.code === 'ArrowLeft') { ev.preventDefault(); audio(); deplacerChoix(-1); }
    else if (ev.code === 'ArrowDown') { ev.preventDefault(); audio(); deplacerRangee(1); }
    else if (ev.code === 'ArrowUp') { ev.preventDefault(); audio(); deplacerRangee(-1); }
  });

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  let partie = null, session = null, niveau = 1, vue = null;
  let enPause = false, enPartie = false, attenteTuto = false, jeton = 0;
  let humainsAvant = null, finManche = 0;
  let motsSeance = { autres: 0, moi: 0, nouveaux: [] };

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? copie(partie.etat) : null;
    choix = -1;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // Salon d'attente (en ligne) : le premier joueur arrivé lance la séance,
  // sinon elle part toute seule au bout du temps donné par le serveur.
  let finSalon = 0, resultatSalon = null, finEnAttente = false, lancement = false;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place', { medium: tr('medium.' + s), qui: nom }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
    }
    const fmt = enSalon ? tr('salon.format') : '';
    if ($('salon-format').textContent !== fmt) $('salon-format').textContent = fmt;
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomChef || tr('medium.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = copie(partie.etat);
    choix = -1;
    cibleAutre = -1;
    debutTour = Date.now();
    dernierTic = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    motsSeance = { autres: 0, moi: 0, nouveaux: [] };
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    annoncerMot(vue);
  }

  // Nouveau mot : miroir et lettres maudites annoncés.
  function annoncerMot(e) {
    if (!e || e.fini) return;
    if (e.mir) { setTimeout(() => sons.miroir(), 200); }
    else if (e.m.c && e.mau) setTimeout(() => sons.maudit(), 200);
  }

  function surAction(ev) {
    const avant = ev.avant, apres = ev.apres;
    vue = copie(apres);
    debutTour = Date.now();
    dernierTic = -1;
    const moi = partie.siege;
    choix = -1;
    if (ev.action === O.SOUFFLE) {
      if (!ev.moi) sons.souffle();
      return;
    }
    if (ev.action === SEL) {
      sons.sel();
      const l = ALPHA.charAt(apres.ban);
      if (apres.tour === moi) toast(tr('sel.contreToi', { nom: nomCourt(ev.siege), l: l }), 2600);
      else toast(tr(ev.moi ? 'sel.parToi' : 'sel.parAutre', { nom: nomCourt(ev.siege), cible: nomCourt(apres.tour), l: l }), 2400);
      motAffiche = '';
    } else {
      // Lettre posée : la planchette y glisse (pour les autres joueurs aussi).
      if (!ev.moi) { cibleAutre = ev.action; cibleAutreFin = Date.now() + 700; sons.glisse(); }
      sons.pose();
      if (apres.dm) reveiller(apres.dm, ev.siege);
      else if (apres.es >= 0) {
        setTimeout(() => sons.esprit(), 250);
        toast(apres.tour === moi ? tr('esprit.imposeToi', { l: ALPHA.charAt(apres.es) }) : tr('esprit.impose', { l: ALPHA.charAt(apres.es), nom: nomCourt(apres.tour) }), 2400);
      }
      if (!apres.dm && apres.m.b && apres.nuit >= 0 && avant.nuit < 0) setTimeout(() => sons.bougie(), 150);
    }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && !apres.fini && apres.tour === moi && !ev.moi) sons.tour();
    // Solo : le joueur n'a plus de flamme → la séance est perdue tout de suite.
    if (session === 'solo' && moi >= 0 && apres.fl[moi] <= 0 && !apres.fini) {
      const j = jeton;
      enPartie = false;
      try { partie.pause(true); } catch (e) { /* rien */ }   // les robots ne continuent pas sans toi
      setTimeout(() => { if (j === jeton && partie) afficherFin(); }, 1500);
    }
  }

  // Un mot est fermé : le spectre se réveille.
  function reveiller(dm, s) {
    const moi = partie.siege;
    const parMoi = s === moi;
    if (parMoi) motsSeance.moi++; else motsSeance.autres++;
    if (noterMot(dm.w)) motsSeance.nouveaux.push(dm.w);
    $('reveil-mot').textContent = dm.w;
    const qui = nomCourt(s);
    $('reveil-texte').textContent = parMoi
      ? tr(dm.x ? 'reveil.mauditToi' : 'reveil.toi', { n: dm.p })
      : tr(dm.x ? 'reveil.maudit' : 'reveil.texte', { nom: qui, n: dm.p });
    const r = $('reveil');
    r.classList.add('actif');
    clearTimeout(reveiller.fin);
    reveiller.fin = setTimeout(() => r.classList.remove('actif'), 1900);
    const sp = $('spectre');
    sp.classList.remove('actif'); void sp.offsetWidth;
    if (parMoi || session === 'solo') sp.classList.add('actif');
    setTimeout(() => sp.classList.remove('actif'), 1400);
    const j = $('ecran-jeu');
    j.classList.remove('secoue'); void j.offsetWidth; if (parMoi) j.classList.add('secoue');
    const carte = $('place-' + s);
    carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
    if (parMoi) sons.spectre(); else sons.spectreLoin();
    setTimeout(() => sons.souffle(), 500);
    if (dm.x) setTimeout(() => sons.maudit(), 300);
    if (vue && !vue.fini) setTimeout(() => annoncerMot(vue), 900);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') { if (!enPartie && vue && partie.siege >= 0 && vue.fl[partie.siege] <= 0) return; enPartie = false; }
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1600);
  }

  function gagneManche(e, moi) {
    const res = R.fin(e);
    return moi >= 0 && !!res && res.classement[0] === moi;
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = gagneManche(e, moi);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: partie.manche });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (motsSeance.nouveaux.length) sauverReglages({ grimoire: prog.grimoire.slice() });
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de séance : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3].sort((a, b) => (e.fl[b] - e.fl[a]) || (e.el[b] - e.el[a]) || (a - b));
    let rang = 0;
    ordre.forEach((s) => {
      if (e.el[s] === -1) return;     // place vide (solo)
      rang++;
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const av = document.createElement('span'); av.innerHTML = avatarSVG(s);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = role === 'toi' ? tr('place.toi') : (role === 'joueur' && info.nom ? info.nom : tr('medium.' + s));
      qui.appendChild(nom);
      const fl = document.createElement('span'); fl.className = 'flammes'; fl.innerHTML = flammesHTML(e.fl[s], Math.max(e.fl[s], 1));
      if (e.fl[s] <= 0) fl.innerHTML = FLAMME_OFF;
      l.append(r, av.firstChild, qui, fl);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = vue || (partie && partie.etat);
    if (!e || !partie) return;
    if ($('voile-fin').classList.contains('actif')) return;
    const moi = partie.siege, sieges = siegesActuels();
    const fl = moi >= 0 ? e.fl[moi] : 0;
    const gagne = moi >= 0 && fl > 0 && O.vivants(e) <= 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.flammes', { n: fl }) : '';
    $('fin-grimoire').textContent = motsSeance.nouveaux.length ? tr('fin.grimoire', { n: motsSeance.nouveaux.length }) : '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = gagne ? Math.max(1, Math.min(3, fl)) : 0;
      const score = gagne ? fl * 100 + motsSeance.autres * 25 : 0;
      const ancienRecord = prog.records[i];
      const record = score > ancienRecord;
      if (record) prog.records[i] = score;
      const avantEtoiles = totalEtoiles();
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), score);
        // Parcours terminé (toutes les séances gagnées, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else sauver(niveau, 0);
      $('fin-titre').textContent = gagne ? tr('fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = gagne ? (record ? tr('fin.nouveauRecord', { n: score }) : tr('fin.record', { n: score, record: Math.max(ancienRecord, score) })) : '';
      const nouveauPlateau = PLATEAUX.find((p) => p.seuil > avantEtoiles && p.seuil <= totalEtoiles());
      let deb = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      if (nouveauPlateau) deb += (deb ? ' ' : '') + tr('fin.plateau', { nom: tr('plateau.' + nouveauPlateau.id) });
      $('fin-debloque').textContent = deb;
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: partie.manche });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (en ligne repassé en solo).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Cendres dorées de victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: h + Math.random() * h * 0.3, vx: (Math.random() - 0.5) * 60, vy: -(120 + Math.random() * 200), r: 1.5 + Math.random() * 3.5, coul: i % 3 ? '#ffb347' : '#fff1b0' });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt + Math.sin(t / 300 + b.r) * 0.6; b.y += b.vy * dt;
        c.globalAlpha = Math.max(0, 1 - (t - debut) / 2800);
        c.fillStyle = b.coul; c.beginPath(); c.arc(b.x, b.y, b.r, 0, Math.PI * 2); c.fill();
      });
      c.globalAlpha = 1;
      if (t - debut < 2800) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Tutoriels animés (lettres en HTML, main qui touche)
  // ---------------------------------------------------------------------

  const TUTOS = {
    base: { mot: 'CHA', lettres: ['N', 'T', 'M', 'R'], actions: [{ l: 'N' }, { l: 'T', ferme: 1 }], etapes: ['tuto.base.1', 'tuto.base.2', 'tuto.base.3'] },
    tour: { mot: 'MA', lettres: ['R', 'I', 'N', 'S'], qui: 2, actions: [{ l: 'R', q: 0 }, { l: 'I', q: 1 }, { l: 'N', q: 0, ferme: 1 }], etapes: ['tuto.tour.1', 'tuto.tour.2'] },
    maudite: { mot: 'TOM', lettres: ['B', 'A', 'E', 'S'], maudites: 'B', actions: [{ l: 'B' }, { l: 'E', ferme: 1, perte: 2 }], etapes: ['tuto.maudite.1', 'tuto.maudite.2'] },
    table: { mot: 'LU', lettres: ['N', 'E', 'M', 'T'], qui: 4, actions: [{ l: 'N', q: 0 }, { l: 'E', q: 1, ferme: 1 }], etapes: ['tuto.table.1', 'tuto.table.2'] },
    bougie: { mot: 'NEI', lettres: ['G', 'A', 'O', 'R'], noir: [2, 3], actions: [{ l: 'G' }], etapes: ['tuto.bougie.1', 'tuto.bougie.2'] },
    sel: { mot: 'PLUM', lettres: ['E', 'I', 'S', 'A'], sel: 1, actions: [{ sel: 1 }, { l: 'I', q: 1 }], etapes: ['tuto.sel.1', 'tuto.sel.2', 'tuto.sel.3'] },
    miroir: { mot: 'AGE', miroir: 1, lettres: ['R', 'O', 'N', 'P'], actions: [{ l: 'R' }, { l: 'O', ferme: 1 }], etapes: ['tuto.miroir.1', 'tuto.miroir.2'] },
    esprit: { mot: 'POI', lettres: ['S', 'R', 'V', 'G'], actions: [{ l: 'S' }, { esprit: 'S' }], etapes: ['tuto.esprit.1', 'tuto.esprit.2'] },
    endurance: { mot: 'LU', lettres: ['N', 'E', 'M', 'T'], qui: 4, flammes: 3, actions: [{ l: 'N', q: 0 }, { l: 'E', q: 1, ferme: 1 }], etapes: ['tuto.endurance.1'] },
    enrage: { mot: 'POI', lettres: ['S', 'R', 'V', 'G'], actions: [{ l: 'S' }, { esprit: 'S' }], etapes: ['tuto.enrage.1'] }
  };

  let tutoJeton = 0, tutoApres = null;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    tutoApres = apres;
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    const ol = $('tuto-etapes');
    ol.textContent = '';
    d.etapes.forEach((k) => { const li = document.createElement('li'); li.textContent = tr(k); ol.appendChild(li); });
    ouvrirVoile('voile-tuto');
    jouerDemo(d, ++tutoJeton);
  }
  function fermerTuto() {
    tutoJeton++;
    fermerVoile('voile-tuto');
    const f = tutoApres;
    tutoApres = null;
    if (f) f();
  }

  // Démonstration en boucle : la main touche les lettres une à une.
  function jouerDemo(d, j) {
    const scene = $('tuto-demo');
    scene.innerHTML = '';
    const mot = document.createElement('div'); mot.className = 'demo-mot' + (d.miroir ? ' miroir' : '');
    const lettres = document.createElement('div'); lettres.className = 'demo-lettres';
    const flammes = document.createElement('div'); flammes.className = 'demo-flammes';
    const qui = document.createElement('div'); qui.className = 'demo-qui';
    const main = document.createElement('div'); main.className = 'demo-main'; main.innerHTML = MAIN;
    const fantome = document.createElement('div'); fantome.className = 'demo-fantome'; fantome.innerHTML = FANTOME;
    const sel = document.createElement('button'); sel.type = 'button'; sel.tabIndex = -1; sel.className = 'btn demo-sel' + (d.sel ? ' visible' : ''); sel.innerHTML = ICONE_SEL + '<span>' + tr('bouton.selCourt') + '</span>';
    scene.append(mot, lettres, flammes, qui, sel, fantome, main);
    const nbFl = d.flammes || 3;
    const nQui = d.qui || 0;
    for (let k = 0; k < nQui; k++) { const s = document.createElement('span'); s.style.background = COUL[k]; s.style.color = COUL[k]; qui.appendChild(s); }
    const boutons = {};
    d.lettres.forEach((ch, k) => {
      const b = document.createElement('span');
      b.className = 'lettre vivante' + (d.maudites && d.maudites.indexOf(ch) >= 0 ? ' maudite' : '') + (d.noir && d.noir.indexOf(k) >= 0 ? ' noire' : '');
      b.style.display = 'inline-flex'; b.style.alignItems = 'center'; b.style.justifyContent = 'center';
      b.textContent = ch;
      boutons[ch] = b;
      lettres.appendChild(b);
    });
    let f, q, fl, etape;
    function remise() {
      f = d.mot; q = f.split('').map((_, k) => (d.sel && k === f.length - 1 ? 1 : -1)); fl = nbFl; etape = 0;
      dessiner();
      main.style.transition = 'none';
      main.style.transform = 'translate(240px, 190px)';
      void main.offsetWidth;
      main.style.transition = '';
    }
    function dessiner(nouvelle) {
      mot.textContent = '';
      for (let k = 0; k < f.length; k++) {
        const t = document.createElement('span');
        const ch = f.charAt(k);
        t.className = 'tuile' + (q[k] === -1 ? ' esprit' : '') + (d.maudites && d.maudites.indexOf(ch) >= 0 ? ' maudite' : '') + (nouvelle === k ? ' arrive' : '');
        if (q[k] >= 1) t.style.boxShadow = '0 3px 0 ' + COUL[q[k]] + ', 0 0 10px ' + COUL[q[k]];
        t.textContent = ch;
        mot.appendChild(t);
      }
      flammes.innerHTML = flammesHTML(fl, nbFl);
    }
    function viser(el, ok) {
      const sr = scene.getBoundingClientRect(), r = el.getBoundingClientRect();
      main.style.transform = 'translate(' + Math.round(r.left - sr.left + r.width / 2 - 14) + 'px,' + Math.round(r.top - sr.top + r.height / 2 - 4) + 'px)';
      setTimeout(() => { if (j !== tutoJeton) return; main.classList.remove('tape'); void main.offsetWidth; main.classList.add('tape'); ok(); }, 800);
    }
    function suite() {
      if (j !== tutoJeton) return;
      if (etape >= d.actions.length) { setTimeout(() => { if (j === tutoJeton) { remise(); setTimeout(suite, 700); } }, 1600); return; }
      const a = d.actions[etape++];
      Array.from(qui.children).forEach((s, k) => s.classList.toggle('actif', a.q === k));
      if (a.sel) {
        viser(sel, () => {
          const enleve = d.miroir ? 0 : f.length - 1;
          const ch = f.charAt(enleve);
          f = f.slice(0, enleve) + f.slice(enleve + 1); q.splice(enleve, 1);
          if (boutons[ch]) boutons[ch].classList.add('bannie');
          dessiner();
          setTimeout(suite, 1000);
        });
        return;
      }
      if (a.esprit) {
        setTimeout(() => {
          if (j !== tutoJeton) return;
          f = d.miroir ? a.esprit + f : f + a.esprit; q[d.miroir ? 'unshift' : 'push'](-1);
          dessiner(d.miroir ? 0 : f.length - 1);
          fantome.classList.remove('actif'); void fantome.offsetWidth; fantome.classList.add('actif');
          setTimeout(suite, 1200);
        }, 600);
        return;
      }
      const b = boutons[a.l];
      viser(b, () => {
        f = d.miroir ? a.l + f : f + a.l;
        q[d.miroir ? 'unshift' : 'push'](a.q || 0);
        dessiner(d.miroir ? 0 : f.length - 1);
        if (a.ferme) {
          setTimeout(() => {
            if (j !== tutoJeton) return;
            fantome.classList.remove('actif'); void fantome.offsetWidth; fantome.classList.add('actif');
            fl = Math.max(0, fl - (a.perte || 1));
            dessiner();
            setTimeout(suite, 900);
          }, 400);
        } else setTimeout(suite, 700);
      });
    }
    remise();
    Object.keys(boutons).forEach((k) => boutons[k].classList.remove('bannie'));
    setTimeout(suite, 500);
  }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, séances
  // ---------------------------------------------------------------------

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    choix = -1;
    motAffiche = '';
    bandeau('');
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon'].forEach(fermerVoile);
    tutoJeton++;
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  // Aperçu du niveau pendant le tutoriel (le vrai départ vient de l'arbitre).
  function apercu(n) {
    let a = 12345 + n;
    const alea = () => { a = (a * 1103515245 + 12345) % 2147483648; return a / 2147483648; };
    return R.depart(alea, PLACES, { niveau: n });
  }

  // Séance solo : niveau n contre des robots (force et nombre donnés par le niveau).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = apercu(niveau);
    choix = -1;
    motAffiche = '';
    motsSeance = { autres: 0, moi: 0, nouveaux: [] };
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      majInterface();
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Séance avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    motsSeance = { autres: 0, moi: 0, nouveaux: [] };
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const grille = $('grille-niveaux');
    grille.textContent = '';
    NIVEAUX.forEach((_, i) => {
      const n = i + 1, ouvert = n <= prog.debloque;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
      b.append(num, et);
      b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
      else b.disabled = true;
      grille.appendChild(b);
    });
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
  }

  function ouvrirGrimoire() {
    const liste = $('grimoire-liste');
    liste.textContent = '';
    $('grimoire-compte').textContent = tr('grimoire.compte', { n: prog.grimoire.length });
    if (!prog.grimoire.length) {
      const p = document.createElement('p'); p.id = 'grimoire-vide'; p.className = 'petit'; p.textContent = tr('grimoire.vide');
      liste.appendChild(p);
    }
    const pages = {};
    prog.grimoire.slice().sort().forEach((w) => { (pages[w.charAt(0)] = pages[w.charAt(0)] || []).push(w); });
    Object.keys(pages).sort().forEach((l) => {
      const d = document.createElement('div'); d.className = 'page-grimoire';
      const h = document.createElement('h3'); h.textContent = l + ' · ' + nb(pages[l].length);
      const p = document.createElement('p'); p.textContent = pages[l].join(' ');
      d.append(h, p);
      liste.appendChild(d);
    });
    afficherEcran('grimoire');
  }

  function ouvrirPlateaux() {
    const g = $('grille-plateaux');
    g.textContent = '';
    PLATEAUX.forEach((p) => {
      const ouvert = plateauOuvert(p.id);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'choix-plateau' + (p.id === prog.plateau ? ' actuel' : '') + (ouvert ? '' : ' ferme');
      const ap = document.createElement('span'); ap.className = 'apercu';
      ap.style.setProperty('--b1', p.b1); ap.style.setProperty('--b2', p.b2); ap.style.setProperty('--g', p.g);
      ap.innerHTML = '<svg viewBox="0 0 160 72" aria-hidden="true"><g fill="' + p.g + '" opacity=".9">' +
        '<circle cx="24" cy="36" r="9"/><circle cx="136" cy="36" r="9"/><circle cx="140" cy="33" r="8" fill="' + p.b2 + '"/>' +
        '<path d="M80 14 l3 7 7 .5-5.5 4.5 2 7-6.5-4-6.5 4 2-7-5.5-4.5 7-.5z"/>' +
        '<ellipse cx="58" cy="50" rx="6" ry="3"/><ellipse cx="102" cy="50" rx="6" ry="3"/></g>' +
        '<path d="M80 66 C 66 58, 62 50, 64 42 C 66 34, 76 33, 80 38 C 84 33, 94 34, 96 42 C 98 50, 94 58, 80 66 Z" fill="#c98a50" stroke="#2a1206" stroke-width="2"/><circle cx="80" cy="46" r="5" fill="#dff2ff" opacity=".6"/></svg>';
      const nom = document.createElement('span'); nom.textContent = tr('plateau.' + p.id);
      const info = document.createElement('small');
      info.textContent = ouvert ? (p.id === prog.plateau ? tr('plateaux.choisi') : tr('plateaux.choisir')) : tr('plateaux.seuil', { n: p.seuil });
      b.append(ap, nom, info);
      b.setAttribute('aria-pressed', p.id === prog.plateau ? 'true' : 'false');
      b.addEventListener('click', () => {
        audio();
        if (!ouvert) { sons.non(); toast(tr('plateaux.seuil', { n: p.seuil }), 1800); return; }
        sons.clic();
        prog.plateau = p.id;
        appliquerPlateau();
        sauverReglages({ plateau: prog.plateau });
        ouvrirPlateaux();
      });
      g.appendChild(b);
    });
    afficherEcran('plateaux');
  }

  let boutonEffacer = null;
  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    relancerBoucle();
  }

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-grimoire').addEventListener('click', () => { audio(); sons.clic(); ouvrirGrimoire(); });
  $('btn-plateaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirPlateaux(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('gri-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('pla-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-tuto-ok').addEventListener('click', () => { audio(); sons.clic(); fermerTuto(); });
  $('btn-poser').addEventListener('click', () => { audio(); poser(); });
  $('btn-sel').addEventListener('click', () => { audio(); jeterSel(); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une séance solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.fl[partie.siege] * 100 : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'jeu') placerPlanchette(true); else if (ecran === 'titre') dessinerTitre(performance.now()); });

  document.title = tr('titre');
  chargerProgression();
  appliquerPlateau();
  construirePlateau();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
