  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !R.fin(e) ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const fl = e ? e.fl[s] : 0, max = e ? e.cfg.fl : 3, se = e ? e.sel[s] : 0;
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('spectre', !!e && fl <= 0);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      const zf = d.querySelector('.flammes'), cle = fl + '/' + max;
      if (zf.dataset.v !== cle) {
        const avant = zf.dataset.v ? parseInt(zf.dataset.v, 10) : fl;
        zf.dataset.v = cle;
        let h = '';
        for (let k = 0; k < max; k++) h += k < fl ? FLAMME : FLAMME_MORTE;
        zf.innerHTML = h;
        if (avant > fl) zf.querySelectorAll('svg.morte').forEach((x, k) => { if (k < avant - fl) x.classList.add('souffle'); });
      }
      const zs = d.querySelector('.sels'), cs = String(se);
      if (zs.dataset.v !== cs) { zs.dataset.v = cs; let h = ''; for (let k = 0; k < se; k++) h += SEL; zs.innerHTML = h; }
      d.setAttribute('aria-label', tr('place.aria', { qui: tr('qui.' + s), role: nomPlace(info, role), n: fl }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    if (R.fin(e)) return '';
    if (partie.siege < 0) return tr('multi.attente');
    if (e.fl[partie.siege] <= 0) return tr('tour.spectre');
    const s = R.aQui(e);
    if (s === partie.siege) return e.mir ? tr('tour.toiMiroir') : tr('tour.toi');
    return tr('tour.nom', { nom: nomPhrase(s) });
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  // Le mot de l'esprit sur sa bande de parchemin (ou dans le miroir).
  function majMot() {
    const e = vue, boite = $('mot');
    const cle = e ? e.m + '|' + e.mir + '|' + e.mau + '|' + Object.keys(neuves).join(',') + '|' + espritPos : '';
    if (boite.dataset.v === cle) return;
    boite.dataset.v = cle;
    boite.textContent = '';
    $('bande').classList.toggle('miroir', !!(e && e.mir));
    if (!e) { $('sens').textContent = ''; return; }
    const n = e.m.length + 1;
    boite.style.setProperty('--tl', Math.min(2.1, 15 / n) + 'rem');
    const fente = document.createElement('span'); fente.className = 'fente';
    if (e.mir) boite.appendChild(fente);
    for (let i = 0; i < e.m.length; i++) {
      const sp = document.createElement('span');
      const ch = e.m.charAt(i);
      sp.className = 'lm' + (e.mau.indexOf(ch) >= 0 ? ' maudite' : '') + (neuves[i] ? ' neuve' : '') + (i === espritPos ? ' esprit' : '');
      sp.textContent = ch;
      boite.appendChild(sp);
    }
    if (!e.mir) boite.appendChild(fente);
    $('sens').textContent = e.mir ? tr('mot.sensMiroir') : '';
    $('bande').setAttribute('aria-label', tr(e.mir ? 'mot.ariaMiroir' : 'mot.aria') + ' ' + e.m.split('').join(' '));
  }

  function majSignes() {
    const e = vue, boite = $('signes');
    const cle = e ? [e.mau, e.cfg.bou, e.mir, e.cfg.esp].join('|') : '';
    if (boite.dataset.v === cle) return;
    boite.dataset.v = cle;
    boite.textContent = '';
    if (!e) return;
    const ajouter = (svg, texte, gras) => {
      const s = document.createElement('span'); s.className = 'signe'; s.innerHTML = svg;
      const t = document.createElement('span'); t.textContent = texte; s.appendChild(t);
      if (gras) { const b = document.createElement('b'); b.textContent = gras; s.appendChild(b); }
      boite.appendChild(s);
    };
    if (e.mau) ajouter(SIGNES.maudite, tr('signe.maudites'), e.mau.split('').join(' '));
    if (e.cfg.bou) ajouter(SIGNES.bougie, tr('signe.bougie'));
    if (e.mir) ajouter(SIGNES.miroir, tr('signe.miroir'));
    if (e.cfg.esp > 0) ajouter(SIGNES.esprit, tr('signe.esprit'));
  }

  // Touches du plateau : ombre, lettres maudites, lettres qui guident, sel.
  function majPlanche() {
    const e = vue;
    const monTour = !!(partie && partie.monTour && partie.monTour() && !enPause && !attenteTuto);
    for (let i = 0; i < 26; i++) {
      const b = $('touche-' + i), l = LETTRES.charAt(i);
      const ombre = !!(e && e.omb.indexOf(l) >= 0);
      b.classList.toggle('ombre', ombre);
      b.classList.toggle('maudite', !!(e && !ombre && e.mau.indexOf(l) >= 0));
      b.classList.toggle('guide', !!(e && monTour && e.cfg.aide && !ombre && O.possible(e.m, e.mir, l)));
      b.classList.toggle('curseur', clavier && curseur === i);
      const aria = ombre ? tr('touche.ombre', { l: l }) : (e && e.mau.indexOf(l) >= 0 ? tr('touche.maudite', { l: l }) : l);
      if (b.getAttribute('aria-label') !== aria) b.setAttribute('aria-label', aria);
    }
    const bs = $('touche-sel');
    const moi = partie ? partie.siege : -1;
    const avec = !!(e && e.cfg.sel > 0);
    bs.hidden = !avec;
    if (avec) {
      const n = moi >= 0 ? e.sel[moi] : 0;
      $('sel-n').textContent = '× ' + nb(n);
      bs.classList.toggle('vide', n <= 0);
      bs.classList.toggle('curseur', clavier && curseur === 26);
      bs.setAttribute('aria-label', tr('sel.aria', { n: n }));
    }
    $('aide').textContent = e ? tr(e.cfg.sel > 0 ? 'jeu.aideSel' : 'jeu.aide') : '';
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majMot();
    majSignes();
    majPlanche();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !R.fin(e)) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage (temps, compte à rebours)
  // ---------------------------------------------------------------------

  let rafId = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle() {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  // La planchette glisse jusqu'à une touche du plateau.
  function glisserPlanchette(cible, esprit) {
    const pl = $('planchette'), zone = $('planche-zone');
    if (!cible || !zone.clientWidth) return;
    const rz = zone.getBoundingClientRect(), rb = cible.getBoundingClientRect();
    const x = rb.left - rz.left + rb.width / 2 - 32, y = rb.top - rz.top + rb.height / 2 - 26;
    pl.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
    pl.style.opacity = '1';
    pl.classList.toggle('esprit', !!esprit);
    sons.glisse();
    // Elle s'efface ensuite, pour ne cacher aucune lettre.
    clearTimeout(glisserPlanchette.m);
    glisserPlanchette.m = setTimeout(() => { pl.style.opacity = '0'; }, 1300);
  }
  function planchetteAuRepos() {
    const pl = $('planchette'), zone = $('planche-zone');
    clearTimeout(glisserPlanchette.m);
    pl.style.opacity = '0';
    pl.classList.remove('esprit');
    if (!zone.clientWidth) return;
    pl.style.transform = 'translate(' + (zone.clientWidth / 2 - 32).toFixed(1) + 'px,' + (zone.clientHeight / 2 - 30).toFixed(1) + 'px)';
  }
  function toucheDe(l) { const i = LETTRES.indexOf(l); return i >= 0 ? $('touche-' + i) : null; }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    neuves = {}; espritPos = -1;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { qui: tr('qui.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { qui: nomChef ? nomChef + ' · ' + tr('qui.' + partie.chef) : tr('qui.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    neuves = {}; espritPos = -1;
    debutTour = Date.now();
    dernierTic = -1;
    curseur = -1;
    mesFermes = 0;
    finSoloFaite = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    planchetteAuRepos();
  }

  function surAction(ev) {
    const j = jeton;
    const apres = ev.apres, evs = apres.ev || [];
    const moi = partie.siege;
    vue = JSON.parse(JSON.stringify(apres));
    neuves = {}; espritPos = -1;
    debutTour = Date.now();
    dernierTic = -1;
    let ferme = null, spectre = false;
    evs.forEach((x) => {
      if (x.t === 'lettre') {
        glisserPlanchette(toucheDe(x.l));
        sons.pose();
        const pos = ev.avant.mir ? 0 : ev.avant.m.length;
        neuves[pos] = 1;
      } else if (x.t === 'esprit') {
        const pos = vue.mir ? 0 : vue.m.length - 1;
        if (vue.mir) { const n2 = {}; Object.keys(neuves).forEach((k) => { n2[+k + 1] = 1; }); neuves = n2; }
        neuves[pos] = 1; espritPos = pos;
        setTimeout(() => { if (j === jeton && ecran === 'jeu') glisserPlanchette(toucheDe(x.l), true); }, 420);
        sons.esprit();
        toast(tr('esprit.impose'), 1800);
      } else if (x.t === 'sel') {
        glisserPlanchette($('touche-sel'));
        sons.sel();
        toast(x.s === moi ? tr('sel.toi') : tr('sel.autre', { nom: nomPhrase(x.s) }), 1800);
      } else if (x.t === 'ferme') {
        ferme = x;
        glisserPlanchette(toucheDe(x.l));
      } else if (x.t === 'spectre') spectre = x.s;
    });
    if (ferme) montrerFermeture(ferme, spectre !== false);
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && !R.fin(vue) && R.aQui(vue) === moi && !ev.moi && moi >= 0 && vue.fl[moi] > 0) sons.tour();
    // Séance solo : le joueur n'a plus de flamme → défaite tout de suite.
    if (session === 'solo' && moi >= 0 && vue.fl[moi] <= 0 && !finSoloFaite) {
      finSoloFaite = true;
      enPartie = false;
      try { partie.pause(true); } catch (e) { /* rien */ }
      setTimeout(() => { if (j === jeton) afficherFin(false); }, 1700);
    }
  }

  // Un mot fermé : le spectre surgit, la flamme est soufflée, le mot va au grimoire.
  function montrerFermeture(x, elimine) {
    const moi = partie ? partie.siege : -1;
    if (x.s === moi) mesFermes++;
    const nouveau = noterMot(x.mot);
    if (session === 'ligne') sauverReglages();
    const sp = $('spectre');
    $('spectre-mot').textContent = x.mot;
    const qui = x.s === moi ? null : nomPhrase(x.s);
    let texte = qui ? tr('ferme.autre', { nom: qui, n: x.perte }) : tr('ferme.toi', { n: x.perte });
    if (x.perte > 1) texte += ' ' + tr('ferme.maudit');
    if (elimine) texte += ' ' + (qui ? tr('ferme.elimineAutre', { nom: qui }) : tr('ferme.elimineToi'));
    $('spectre-texte').textContent = texte;
    sp.classList.remove('actif'); void sp.offsetWidth; sp.classList.add('actif');
    const ej = $('ecran-jeu');
    ej.classList.remove('secousse'); void ej.offsetWidth; ej.classList.add('secousse');
    sons.spectre(); sons.souffle();
    if (nouveau) setTimeout(() => toast(tr('grimoire.nouveau', { mot: x.mot }), 1600), 900);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') { if (finSoloFaite) return; finSoloFaite = true; enPartie = false; }
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne();
      else if (session === 'solo') afficherFin(true);
      else afficherFinRobots();
    }, 1700);
  }

  function aGagne(e, moi) {
    const f = R.fin(e);
    return !!(f && moi >= 0 && f.classement[0] === moi && e.fl[moi] > 0);
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = aGagne(e, moi);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); cendres(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de séance : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(fl, max) {
    if (fl <= 0) return 0;
    if (fl >= max) return 3;
    return fl * 2 >= max ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const f = R.fin(e);
    const ordre = f ? f.classement : [0, 1, 2, 3].sort((a, b) => e.fl[b] - e.fl[a]);
    ordre.forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const sc = document.createElement('span'); sc.className = 'sceau'; sc.innerHTML = sceau(s);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('qui.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.setAttribute('aria-label', tr('fin.flammes', { n: e.fl[s] }));
      let h = '';
      for (let q = 0; q < e.cfg.fl; q++) h += q < e.fl[s] ? FLAMME : FLAMME_MORTE;
      n.innerHTML = h;
      l.append(r, sc, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  // Fin d'une séance solo (gagne : dernier à garder une flamme).
  function afficherFin(gagne) {
    const e = vue;
    if (!e || !partie) return;
    const moi = partie.siege >= 0 ? partie.siege : 0;
    const sieges = siegesActuels();
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    const i = niveau - 1;
    const fl = gagne ? e.fl[moi] : 0;
    const score = fl * 10 + Math.max(0, e.mots - mesFermes);
    if (gagne) { if (window.FMG) window.FMG.reportEnd({ completed: true, level: niveau }); }
    else { if (window.FMG) window.FMG.reportEnd({ completed: false, level: niveau }); }
    const etoiles = gagne ? etoilesPour(fl, e.cfg.fl) : 0;
    const totalAvant = totalEtoiles();
    const ancienRecord = prog.records[i];
    const record = score > ancienRecord;
    if (record) prog.records[i] = score;
    let debloque = false;
    if (gagne) {
      prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
      if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
      sauver(Math.min(niveau + 1, NIVEAUX.length), score);
      // Parcours terminé (les 20 séances gagnées, maintenant ou avant) : total des meilleures étoiles.
      if (prog.etoiles.every((x) => x > 0)) {
        if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
      }
    } else {
      sauver(niveau, score);
    }
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-titre').textContent = gagne ? tr('fin.gagne') : tr('fin.perdu');
    $('fin-points').textContent = gagne ? tr('fin.points', { n: fl, total: e.cfg.fl }) : tr('fin.perduTexte');
    const zone = $('fin-etoiles');
    zone.textContent = '';
    for (let k = 0; k < 3; k++) {
      const sp = document.createElement('span'); sp.textContent = '★';
      if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
      zone.appendChild(sp);
    }
    zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
    zone.style.display = '';
    $('fin-mots').textContent = tr('fin.mots', { n: e.mots, score: score });
    $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, score) });
    let deb = '';
    if (gagne && niveau === NIVEAUX.length) deb = tr('fin.dernier');
    else if (debloque) deb = tr('fin.debloque', { n: niveau + 1 });
    const totalApres = totalEtoiles();
    const pl = PLATEAUX.findIndex((x, k) => k > 0 && x > totalAvant && x <= totalApres);
    if (pl > 0) deb += (deb ? ' ' : '') + tr('fin.plateau', { nom: tr('plateau.' + pl) });
    $('fin-debloque').textContent = deb;
    $('fin-compte').textContent = '';
    if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
    boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
    boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    if (gagne) { sons.victoire(); cendres(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
  // (serveur absent, connexion perdue) : les manches s'enchaînent seules.

  // Compte à rebours avant la manche suivante (en ligne repassée en local).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);

  // Cendres dorées de victoire.
  function cendres() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 110; i++) bouts.push({ x: Math.random() * w, y: h + Math.random() * h * 0.4, vx: (Math.random() - 0.5) * 50, vy: -(90 + Math.random() * 180), r: 1.5 + Math.random() * 3.5, coul: ['#ffcf6e', '#ffae3a', '#fff3b0', '#c9b5ff'][i % 4], p: Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++cendres.n;
    function pas(t) {
      if (j !== cendres.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += (b.vx + Math.sin(t / 300 + b.p) * 30) * dt; b.y += b.vy * dt;
        c.globalAlpha = Math.max(0, 1 - (t - debut) / 3000);
        c.fillStyle = b.coul; rond(c, b.x, b.y, b.r); c.fill();
      });
      c.globalAlpha = 1;
      if (t - debut < 3000) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  cendres.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }

  // Séance solo n contre 3 robots (force croissante, donnée par la séance).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    quitterPartie();
    session = 'solo';
    jeton++;
    enPartie = true;
    finSoloFaite = false;
    mesFermes = 0;
    vue = null;
    neuves = {}; espritPos = -1;
    afficherEcran('jeu');
    planchetteAuRepos();
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: NIVEAUX[niveau - 1].fo, options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });

    majInterface();
  }

  // Partie avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.

  function ouvrirNiveaux() {

  // ---------------------------------------------------------------------
  //  Tutoriels animés (une main touche une lettre ; en boucle)
  // ---------------------------------------------------------------------

  // mot : lettres de départ ; mir : mot dans le miroir ; puces : touches
  // montrées ; cible : touche touchée (« ! » = sel) ; effet : ce qui suit.
  const TUTOS = {
    base: { mot: 'LOU', puces: ['P', 'R', 'V'], cible: 'P', effet: 'ferme', guide: true },
    trois: { mot: 'SO', puces: ['L', 'U', 'R'], cible: 'L', effet: 'bien', guide: true },
    maudite: { mot: 'SOR', puces: ['T', 'C', 'B'], maudites: 'T', cible: 'T', effet: 'ferme2' },
    guide: { mot: 'CA', puces: ['V', 'S', 'D'], cible: 'V', effet: 'bien', guideFin: true },
    bougie: { mot: 'PO', puces: ['R', 'U', 'I', 'M'], ombre: 'UI', cible: 'R', effet: 'bien' },
    miroir: { mot: 'ON', mir: true, puces: ['S', 'T', 'M'], cible: 'S', effet: 'bien' },
    sel: { mot: 'BOIT', puces: ['E', '!'], cible: '!', effet: 'sel' },
    esprit: { mot: 'MA', puces: ['R', 'S', 'L'], cible: 'R', effet: 'esprit' }
  };

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const demo = $('tuto-demo');
    const j = ++tutoAnim;
    const etape = (f, ms) => setTimeout(() => { if (j === tutoAnim) f(); }, ms);
    function scene() {
      if (j !== tutoAnim) return;
      demo.textContent = '';
      const bande = document.createElement('div'); bande.className = 'demo-bande' + (d.mir ? ' miroir' : '');
      const mot = document.createElement('div'); mot.className = 'demo-mot';
      const ecrire = (texte, neuve) => {
        mot.textContent = '';
        texte.split('').forEach((ch, i) => {
          const s = document.createElement('span');
          s.className = 'lm' + (d.maudites && d.maudites.indexOf(ch) >= 0 ? ' maudite' : '') + (neuve === i ? (d.effet === 'esprit' ? ' neuve esprit' : ' neuve') : '');
          s.textContent = ch; mot.appendChild(s);
        });
      };
      ecrire(d.mot);
      bande.appendChild(mot);
      const puces = document.createElement('div'); puces.className = 'demo-puces';
      let cible = null;
      d.puces.forEach((p) => {
        const b = document.createElement('div');
        b.className = 'demo-puce' + (p === '!' ? ' sel' : '') + (d.maudites && d.maudites.indexOf(p) >= 0 ? ' maudite' : '') + (d.ombre && d.ombre.indexOf(p) >= 0 ? ' ombre' : '') + ((d.guide || d.guideFin) && p !== '!' ? ' guide' : '');
        if (p === '!') b.innerHTML = SEL; else b.textContent = p;
        if (p === d.cible) cible = b;
        puces.appendChild(b);
      });
      const fl = document.createElement('div'); fl.className = 'demo-flammes'; fl.innerHTML = FLAMME + FLAMME + FLAMME;
      const fant = document.createElement('div'); fant.className = 'demo-fantome'; fant.innerHTML = $('spectre').querySelector('svg').outerHTML;
      const esprit = d.effet === 'esprit';
      const main = document.createElement('div'); main.className = esprit ? 'demo-planchette' : 'demo-main'; main.innerHTML = esprit ? PLANCHETTE_MINI : MAIN;
      demo.append(bande, puces, fl, fant, main);
      if (d.guideFin) etape(() => puces.querySelectorAll('.guide').forEach((x) => x.classList.remove('guide')), 700);
      etape(() => {
        const rd = demo.getBoundingClientRect(), rc = cible.getBoundingClientRect();
        main.style.left = (rc.left - rd.left + rc.width / 2 - (esprit ? 20 : 12)) + 'px';
        main.style.top = (rc.top - rd.top + rc.height / 2 - (esprit ? 16 : 4)) + 'px';
      }, 500);
      etape(() => {
        cible.classList.add('appui');
        if (d.effet === 'sel') { ecrire(d.mot.slice(0, -1)); bande.classList.add('bien'); sons.sel(); return; }
        const neuf = d.mir ? d.cible + d.mot : d.mot + d.cible;
        ecrire(neuf, d.mir ? 0 : neuf.length - 1);
        sons.pose();
        if (d.effet === 'ferme' || d.effet === 'ferme2') {
          bande.classList.add('perdu');
          fant.classList.add('actif');
          const svgs = fl.querySelectorAll('svg');
          const k = d.effet === 'ferme2' ? 2 : 1;
          let h = ''; for (let q = 0; q < 3; q++) h += q < 3 - k ? FLAMME : FLAMME_MORTE;
          fl.innerHTML = h;
          void svgs;
          sons.spectre();
        } else if (esprit) { bande.classList.add('bien'); sons.esprit(); }
        else bande.classList.add('bien');
      }, 1350);
      etape(() => cible.classList.remove('appui'), 1600);
      etape(scene, 3600);
    }
    scene();
    const fermer = () => {
      tutoAnim++;
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function peutJouer() {
    if (!partie || enPause || attenteTuto || !vue) return false;
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(vue && partie.siege >= 0 && vue.fl[partie.siege] <= 0 ? tr('tour.spectre') : tr('tour.attends'), 1400); sons.non(); }
      return false;
    }
    return true;
  }

  function refuser(b, cle, vars) {
    if (b) { b.classList.remove('non'); void b.offsetWidth; b.classList.add('non'); }
    sons.non();
    toast(tr(cle, vars), 1600);
  }

  function jouerLettre(l, b) {
    if (!peutJouer()) return;
    const e = vue;
    if (e.omb.indexOf(l) >= 0) { refuser(b, 'refus.ombre'); return; }
    if (!R.valide(e, partie.siege, l)) { refuser(b, e.mir ? 'refus.lettreMiroir' : 'refus.lettre', { l: l }); return; }
    partie.jouer(l);
  }

  function jouerSel() {
    if (!peutJouer()) return;
    const e = vue, moi = partie.siege;
    if (e.sel[moi] <= 0) { refuser($('touche-sel'), 'refus.plusDeSel'); return; }
    if (e.m.length <= e.dep) { refuser($('touche-sel'), 'refus.selDepart'); return; }
    partie.jouer('!');
  }

  function cases() { const l = []; for (let i = 0; i < 26; i++) l.push($('touche-' + i)); if (!$('touche-sel').hidden) l.push($('touche-sel')); return l; }
  function deplacerCurseur(dx, dy) {
    const l = cases();
    if (curseur < 0 || curseur >= l.length) { curseur = 0; return; }
    if (dy === 0) { curseur = (curseur + dx + l.length) % l.length; return; }
    const r = l[curseur].getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let best = -1, bd = Infinity;
    l.forEach((b, k) => {
      if (k === curseur) return;
      const q = b.getBoundingClientRect(), qx = q.left + q.width / 2, qy = q.top + q.height / 2;
      if ((qy - cy) * dy <= 4) return;
      const d = Math.abs(qy - cy) * 3 + Math.abs(qx - cx);
      if (d < bd) { bd = d; best = k; }
    });
    if (best >= 0) curseur = best;
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    // Une lettre tapée au clavier (azerty, qwerty… : on lit la lettre, accents retirés).
    const k = (ev.key || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
    if (k.length === 1 && LETTRES.indexOf(k) >= 0) {
      ev.preventDefault(); audio();
      jouerLettre(k, toucheDe(k));
      return;
    }
    if (ev.code === 'Backspace' || ev.code === 'Delete') { ev.preventDefault(); audio(); if (vue && vue.cfg.sel > 0) jouerSel(); return; }
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) {
      ev.preventDefault(); audio();
      if (!clavier) { clavier = true; if (curseur < 0) curseur = 0; majPlanche(); return; }
      deplacerCurseur(dirs[ev.code][0], dirs[ev.code][1]);
      majPlanche();
    } else if (ev.code === 'Enter' || ev.code === 'NumpadEnter' || ev.code === 'Space') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && !document.activeElement.classList.contains('touche')) return;
      ev.preventDefault(); audio();
      if (!clavier || curseur < 0) { clavier = true; curseur = Math.max(0, curseur); majPlanche(); return; }
      if (curseur === 26) jouerSel(); else jouerLettre(LETTRES.charAt(curseur), toucheDe(LETTRES.charAt(curseur)));
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-grimoire').addEventListener('click', () => { audio(); sons.clic(); ouvrirGrimoire(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('gri-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une séance solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'jeu') planchetteAuRepos(); });

  document.title = tr('titre');
  chargerProgression();
  appliquerPlateau();
  construire();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
