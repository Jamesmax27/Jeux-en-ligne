<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {

      var b = document.createElement('button');

      b.lang = l;
      b.dataset.lang = l;

      element.className = 'jel-langue';

      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }

      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);

      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);

  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }

    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);

      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });

        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];

    tout.date = Date.now();

      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }

  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];

    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

    var hote = document.createElement(nom);

    ombre.appendChild(feuille);

  function armerEffacement(b, jeu, fait) {

    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;

      b.classList.remove('armer');

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)

  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)

    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');

    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));

    h.ombre.appendChild(fond);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;

      },
    };

    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();

      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.

    this.phase = 'attente';
    this.siege = -1;
    this.humains = [];
    this.noms = [];            // pseudo des vrais joueurs par place (en ligne), ou null
    this.chef = -1;            // place du chef du salon (en ligne)
    this.options = null;

    this.minuteur = 0;
    this.enPause = false;
    this.debutPause = 0;
    this.attendEcho = false;   // action envoyée, pas encore revenue
    this.versSolo = false;     // connexion coupée : bascule en solo une fois la file vidée

    var moi = this;

    'machine magie magicien main maison maitre malade malediction malheur malin maman manche manger manoir manteau marais marbre marche marcher mardi mare marin marmite marron masque massue matin maudit mauvais mechant medecin meilleur melodie membre menace mener mensonge menton merci merveille message metal meteore meurtre midi miel miette mince minuit miroir mobile moine moins mois moment momie monde monstre montagne monter montre morceau mordre mort mouche mouette moulin mourir mousse mouton moyen muet murmure musique mystere',
    'nager naitre nappe navire neige nerf neuf niche noble noeud noir nombre nommer nord note nouveau nuage nuit',
    'oasis objet obscur ocean odeur oeuf offrir ogre oiseau ombre oncle ongle opera orage orange orchestre ordre oreille orgue orgueil oser ossement otage oublier ours outil ouvrir',
    'page paille pain paire paix palais panier panique pantin papier papillon paquet parfum parler parole partir passage passer patte pauvre payer pays paysage peche peigne peindre peine pelle pendule penser perdre perle peril perroquet personne peur phare piano piece pied piege pierre pieuvre pigeon pilier pince pinceau pirate piste place plafond plage plaine plainte plaisir plan planche planchette planete plante plat plein pleurer pleuvoir plonger pluie plume poche poeme poids poignard poing point poire poison poisson poivre police pomme pompe pont porte porter portrait poser posseder possible potion poudre poulain poule poupee pousser poussiere prairie presque prier priere prince prison prix profond promenade prune puits punir',
    'quai quart quartier quelque question queue quille',
    'racine raconter radeau rage raisin raison ramer rampe rang rapide rare rasoir rater rayon reine remede renard rendre repas repos requin reve reveil revenant rever riche rideau rire rituel riviere robe robot roche rocher roman ronce rond rose roseau roue rouge rouille route royaume ruban rubis ruine ruisseau ruse',
    'sable sabre sabot sacre sage saigner saint saison salade sale salle salon saluer sang sapin satin sauce saule saut sauter sauvage sauver savant savoir savon seance secret seigle seigneur semaine sentier sentir serpent serrure servir seuil seul siecle siege sifflet signe silence singe sinistre sirene soeur soie soif soir soldat soleil sombre sommeil sorcier sorciere sort sortie sortilege sortir souci souffle souffler soupe soupir source sourd sourire souris souvenir spectre squelette statue stylo suaire sucre suie suivre sujet supplice surprise',
    'table tableau tache taille tambour tante taper tapis tasse taupe taureau teint tempete temple temps tenebres tente terre terreur tete theatre tigre tiroir tissu titre toile toit tombe tombeau tomber tonneau tonnerre torche tordre tortue tour tourner trace train trait trappe travail tresor tribu triste trompe tronc trou troupeau trouver tuile tunnel tuyau',
    'unique univers urgence usine utile',
    'vache vague vaisseau valise vallee vampire vapeur veille veine velours vendre venin venir vent ventre verger verite verre vers vert veste vetement viande vide vieux vigne village ville violon vipere visage vitre vivre voile voisin voiture voix voler voleur volcan voute voyage vrai',
    'wagon yeux zebre zero zombie'
  ].join(' ');

  var MOTS = [], DICO = {};
  BRUT.split(' ').forEach(function (m) {
    var w = m.toUpperCase();
    if (/^[A-Z]{4,12}$/.test(w) && DICO[w] !== 1) { DICO[w] = 1; MOTS.push(w); }
  });
  MOTS.sort();

  var ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  // Le plateau : 4 rangées. La bougie cache les 2 du haut ou les 2 du bas.
  var RANGS = ['ABCDEFG', 'HIJKLMN', 'OPQRST', 'UVWXYZ'];
  var RANG = {};
  RANGS.forEach(function (r, i) { for (var j = 0; j < r.length; j++) RANG[r.charAt(j)] = i; });
  var MAUDITES = 'BCDFGHLMNPRSTV';
  var DEPARTS = 'AABBCCDDEFFGLLMMPPRRSSTTV';

  // 20 séances solo : flammes des robots (fr), force (f), nouveautés.
  var NIVEAUX = [
    { fr: 1, f: 0.10, tuto: 'base' },
    { fr: 1, f: 0.18, tuto: 'mort' },
    { fr: 2, f: 0.25 },
    { fr: 1, f: 0.30, mm: 2, tuto: 'maudit' },
    { fr: 2, f: 0.34, mm: 2 },
    { fr: 1, f: 0.36, ca: 1, tuto: 'bougie' },
    { fr: 2, f: 0.40, ca: 1, mm: 2 },
    { fr: 1, f: 0.42, mi: 1, tuto: 'miroir' },
    { fr: 2, f: 0.46, mi: 1, mm: 2 },
    { fr: 2, f: 0.50, mi: 1, ca: 1 },
    { fr: 2, f: 0.52, se: 1, mm: 2, tuto: 'sel' },
    { fr: 2, f: 0.55, se: 1, ca: 1, mm: 2 },
    { fr: 2, f: 0.58, se: 1, esp: 1, tuto: 'esprit' },
    { fr: 2, f: 0.62, se: 1, esp: 1, mi: 1 },
    { fr: 2, f: 0.64, min: 5, mm: 2, tuto: 'long' },
    { fr: 2, f: 0.68, se: 1, esp: 1, ca: 1, mm: 3 },
    { fr: 2, f: 0.72, se: 2, mi: 1, ca: 1, mm: 2 },
    { fr: 3, f: 0.76, se: 1, esp: 1, mi: 1, mm: 3 },
    { fr: 2, f: 0.80, se: 1, esp: 1, mi: 1, ca: 1, mm: 2, min: 5 },
    { fr: 3, f: 0.85, se: 2, esp: 1, mi: 1, ca: 1, mm: 3 }
  ];
  // En ligne : une combinaison tirée à chaque manche, 3 flammes pour tous.
  var EN_LIGNE = [
    { mm: 2 },
    { mm: 2, ca: 1 },
    { mm: 2, mi: 1, se: 1 },
    { mm: 2, esp: 1, se: 1 },
    { mm: 3, ca: 1, mi: 1, se: 1 },
    { mm: 2, min: 5, se: 1 },
    { mm: 2, esp: 1, ca: 1, se: 1 }
  ];

  function auHasard(liste, alea) { return liste[Math.floor(alea() * liste.length) % liste.length]; }
  // Le morceau f appartient-il au mot w ? (début du mot, ou n'importe où avec le miroir)
  function correspond(e, w, f) { return e.mi ? w.indexOf(f) >= 0 : w.lastIndexOf(f, 0) === 0; }
  // Mots qui contiennent f et sont plus longs que lui.
  function liste(e, f) {
    var l = [], mn = Math.max(e.min, f.length + 1);
    for (var i = 0; i < MOTS.length; i++) { var w = MOTS[i]; if (w.length >= mn && correspond(e, w, f)) l.push(w); }
    return l;
  }
  function vivantDans(e, l, f) {
    var mn = Math.max(e.min, f.length + 1);
    for (var i = 0; i < l.length; i++) if (l[i].length >= mn && correspond(e, l[i], f)) return true;
    return false;
  }
  function ferme(e, f) { return f.length >= e.min && DICO[f] === 1; }
  // Avec le miroir, une lettre sur trois se pose au début du mot.
  function devant(e) { return !!e.mi && e.k % 3 === 2; }
  // Bougie : -1 pas d'ombre ; 0 rangées du haut dans le noir ; 1 rangées du bas.
  function ombre(e) { return e.ca ? (e.cb + e.k) % 2 : -1; }
  function visible(e, l) { var o = ombre(e); if (o < 0) return true; var r = RANG[l]; return o === 0 ? r >= 2 : r < 2; }
  function permise(e, l) { return typeof l === 'string' && l.length === 1 && RANG[l] !== undefined && visible(e, l) && l !== e.ban; }
  function ajout(e, l) { return devant(e) ? l + e.f : e.f + l; }
  function vivants(e) { var n = 0; for (var s = 0; s < e.fl.length; s++) if (e.fl[s] > 0) n++; return n; }
  function suivant(e, s) {
    for (var i = 1; i <= e.fl.length; i++) { var t = (s + i) % e.fl.length; if (e.fl[t] > 0) return t; }
    return s;
  }
  function finie(e) { return vivants(e) <= 1 || (e.j >= 0 && e.fl[e.j] <= 0); }
  function maudit(e, w) { for (var i = 0; i < e.mm.length; i++) if (w.indexOf(e.mm[i]) >= 0) return true; return false; }
  function peutSaler(e, place) { return !!e.se && e.se[place] > 0 && e.dp >= 0 && e.dp !== place && e.k > 0 && e.f.length > 1; }

  function nouveauMot(e, qui, alea) {
    e.k = 0; e.ban = ''; e.dp = -1; e.ds = 0; e.ei = 0;
    e.cb = e.ca ? Math.floor(alea() * 2) % 2 : 0;
    var choix = [];
    for (var i = 0; i < DEPARTS.length; i++) { var l = DEPARTS.charAt(i); if (vivantDans(e, MOTS, l)) choix.push(l); }
    e.f = choix.length ? auHasard(choix, alea) : 'A';
    e.mm = [];
    var pool = MAUDITES.split('');
    for (var m = 0; m < e.nm && pool.length; m++) { var k = Math.floor(alea() * pool.length) % pool.length; e.mm.push(pool[k]); pool.splice(k, 1); }
    e.mm.sort();
    e.tour = e.fl[qui] > 0 ? qui : suivant(e, qui);
  }

  // Un mot se termine (mot réveillé ou lettre morte) : la place perd 1 flamme, 2 si maudit.
  function perdre(e, place, type, lettre, alea) {
    var w = e.f, p = maudit(e, w) ? 2 : 1;
    e.fl[place] = Math.max(0, e.fl[place] - p);
    var x = e.fl[place] === 0;
    if (x) e.out.push(place);
    e.mots += 1;
    e.ev = { n: e.ev.n + 1, t: type, s: place, w: w, p: p, x: x ? 1 : 0, l: lettre };
    if (finie(e)) { e.dp = -1; return e; }
    nouveauMot(e, place, alea);
    e.ev.d = e.f;
    return e;
  }

  // Part des fins de mot qui tombent sur le joueur qui pose g (robots).
  function analyse(e, l0, g, nv) {
    var vus = {}, moi = 0, tot = 0, L = g.length;
    for (var i = 0; i < l0.length; i++) {
      var w = l0[i];
      if (w.length <= L || w.lastIndexOf(g, 0) !== 0) continue;
      var d = 0;
      for (var m = Math.max(L + 1, e.min); m <= w.length; m++) if (DICO[w.slice(0, m)] === 1) { d = m; break; }
      if (!d) continue;
      var cle = w.slice(0, d);
      if (vus[cle]) continue;
      vus[cle] = 1;
      tot++;
      if ((d - L) % nv === 0) moi++;
    }
    return tot ? moi / tot : 0.5;
  }

  // L'esprit ajoute la lettre qui laisse le moins de lettres sûres au joueur suivant.
  function esprit(e, alea) {
    var l0 = liste(e, e.f), av = devant(e), meilleurs = [], bas = Infinity, secours = [];
    for (var i = 0; i < ALPHA.length; i++) {
      var c = ALPHA.charAt(i), g = e.f + c;
      if (ferme(e, g) || !vivantDans(e, l0, g)) continue;
      secours.push(c);
      var l1 = [];
      for (var j = 0; j < l0.length; j++) if (correspond(e, l0[j], g)) l1.push(l0[j]);
      var surs = 0;
      for (var k = 0; k < ALPHA.length; k++) {
        var c2 = ALPHA.charAt(k);
        if (!visible(e, c2)) continue;
        var h = av ? c2 + g : g + c2;
        if (!ferme(e, h) && vivantDans(e, l1, h)) surs++;
      }
      if (surs < 1) continue;
      if (surs < bas) { bas = surs; meilleurs = [c]; } else if (surs === bas) meilleurs.push(c);
    }
    if (meilleurs.length) return auHasard(meilleurs, alea);
    return secours.length ? auHasard(secours, alea) : '';
  }

  window.JEL_REGLES = {
    places: 4,
    delaiBot: 950,
    delaiJoueur: 20000,
    pauseManche: 7000,
    attenteSalon: 90000,
    remplacement: 'tour',
    forceEnLigne: 0.55,
    niveaux: NIVEAUX,

    depart: function (alea, places, options) {
      var o = options || {};
      var solo = typeof o.niveau === 'number' && isFinite(o.niveau);
      var idx, cfg;
      if (solo) { idx = Math.max(0, Math.min(NIVEAUX.length - 1, Math.floor(o.niveau) - 1)); cfg = NIVEAUX[idx]; }
      else { idx = Math.floor(alea() * EN_LIGNE.length) % EN_LIGNE.length; cfg = EN_LIGNE[idx]; }
      var e = {
        f: '', fl: [], fm: [], se: [], out: [], tour: 0, k: 0, ban: '', dp: -1, ds: 0, ei: 0, cb: 0, mm: [],
        nm: cfg.mm || 0, ca: cfg.ca ? 1 : 0, mi: cfg.mi ? 1 : 0, esp: cfg.esp ? 1 : 0, min: cfg.min || 4, sm: cfg.se || 0,
        j: solo ? 0 : -1, n: idx, solo: solo ? 1 : 0, mots: 0, ev: { n: 0, t: 'debut' }
      };
      if (solo) e.fr = cfg.f;
      for (var s = 0; s < places; s++) {
        var f = solo && s !== 0 ? cfg.fr : 3;
        e.fl.push(f); e.fm.push(f); e.se.push(cfg.se || 0);
      }
      nouveauMot(e, Math.floor(alea() * places) % places, alea);
      return e;
    },

    aQui: function (e) { return e.tour; },

    valide: function (e, place, a) {
      if (finie(e) || place !== e.tour || !(e.fl[place] > 0)) return false;
      if (a === 'SEL') return peutSaler(e, place);
      return permise(e, a);
    },

    jouer: function (e, place, a, alea) {
      var n = e.ev.n + 1;
      if (a === 'SEL') {
        var l = e.ds ? e.f.charAt(0) : e.f.charAt(e.f.length - 1);
        e.f = e.ds ? e.f.slice(1) : e.f.slice(0, -1);
        e.se[place] -= 1;
        e.k -= 1;
        var vers = e.dp;
        e.ban = l; e.tour = vers; e.dp = -1; e.ds = 0;
        e.ev = { n: n, t: 'sel', s: place, c: vers, l: l };
        return e;
      }
      var av = devant(e);
      e.f = av ? a + e.f : e.f + a;
      e.k += 1; e.ban = ''; e.dp = place; e.ds = av ? 1 : 0;
      if (ferme(e, e.f)) return perdre(e, place, 'mot', a, alea);
      if (!vivantDans(e, MOTS, e.f)) return perdre(e, place, 'mort', a, alea);
      e.tour = suivant(e, place);
      e.ev = { n: n, t: 'lettre', s: place, l: a, g: e.ds };
      if (e.esp && !e.ei && e.f.length >= 2 && alea() < 0.45) {
        var x = esprit(e, alea);
        if (x) { e.f += x; e.ei = 1; e.dp = -1; e.ev.t = 'esp'; e.ev.e = x; }
      }
      return e;
    },

    // Robot : évite de finir un mot et les lettres mortes, calcule qui finira
    // chaque mot possible, jette du sel quand toutes ses lettres perdent ; la
    // force dose ses erreurs et alea le fait varier.
    bot: function (e, place, alea, force) {
      var fo = typeof e.fr === 'number' ? e.fr : (typeof force === 'number' ? force : 0.5);
      var l0 = liste(e, e.f), nv = vivants(e), av = devant(e), coups = [];
      for (var i = 0; i < ALPHA.length; i++) {
        var c = ALPHA.charAt(i);
        if (!permise(e, c)) continue;
        var g = av ? c + e.f : e.f + c, cout;
        if (ferme(e, g) || !vivantDans(e, l0, g)) cout = maudit(e, g) ? 20 : 10;
        else cout = e.mi ? 0.3 + 0.4 * alea() : analyse(e, l0, g, nv);
        coups.push({ a: c, c: cout });
      }
      if (!coups.length) return peutSaler(e, place) ? 'SEL' : ALPHA.charAt(0);
      var mieux = Infinity;
      coups.forEach(function (x) { if (x.c < mieux) mieux = x.c; });
      if (peutSaler(e, place) && ((mieux >= 10 && alea() < 0.3 + 0.7 * fo) || (mieux >= 0.85 && alea() < 0.35 * fo))) return 'SEL';
      if (alea() < (1 - fo) * 0.12) return auHasard(coups, alea).a;
      var surs = coups.filter(function (x) { return x.c < 10; });
      if (surs.length && alea() < (1 - fo) * 0.6) return auHasard(surs, alea).a;
      var bas = Infinity, choix = coups[0].a;
      coups.forEach(function (x) {
        var v = x.c + alea() * (1 - fo) * 0.6;
        if (v < bas) { bas = v; choix = x.a; }
      });
      return choix;
    },

    fin: function (e) {
      if (!finie(e)) return null;
      var cl = [], s;
      for (s = 0; s < e.fl.length; s++) if (e.fl[s] > 0) cl.push(s);
      cl.sort(function (x, y) { return (e.fl[y] - e.fl[x]) || (x - y); });
      for (var i = e.out.length - 1; i >= 0; i--) if (cl.indexOf(e.out[i]) < 0) cl.push(e.out[i]);
      for (s = 0; s < e.fl.length; s++) if (cl.indexOf(s) < 0) cl.push(s);
      return { classement: cl, scores: e.fl.slice() };
    },

    // Outils partagés avec l'écran du jeu (mêmes données, mêmes calculs).
    outils: {
      MOTS: MOTS, RANGS: RANGS, RANG: RANG, ALPHA: ALPHA, EN_LIGNE: EN_LIGNE,
      liste: liste, vivantDans: vivantDans, ferme: ferme, devant: devant, ombre: ombre, visible: visible,
      permise: permise, ajout: ajout, vivants: vivants, finie: finie, maudit: maudit, peutSaler: peutSaler
    }
  };
})();

<script>
(function () {
  'use strict';

  // =====================================================================
  //  La Planchette des Lettres Mortes — jeu de mots du « fantôme »
  //  À tour de rôle, on ajoute une lettre au mot de l'esprit ; qui termine
  //  un mot réveille le spectre et perd une flamme. Solo : 20 séances
  //  contre 3 robots. En ligne : de vrais joueurs remplacent les robots
  //  (moteur commun JEL_MULTI). Les règles sont dans le bloc jel-regles.
  // =====================================================================

  const JEU = 'la-planchette-des-lettres-mortes';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = R.niveaux;                // mêmes données que les règles
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);

  // Une couleur et un symbole par place : 0 Lune, 1 Crâne, 2 Œil, 3 Araignée.
  const COUL = ['#8fb8ff', '#f0e2c0', '#7fe0a8', '#ff9a5c'];
  const COUL_F = ['#1f3a74', '#5a4a30', '#14583a', '#7a2e0c'];

  // Plateaux hantés (étoiles nécessaires, bois clair, bois sombre, liseré, encre, lueur).
  const PLATEAUX = [
    { seuil: 0, a: '#8a5630', b: '#3e2210', l: '#e0b86a', x: '#f8e8c4', f: '#ffcf6a' },
    { seuil: 12, a: '#3a3040', b: '#120e16', l: '#b9a6d8', x: '#ece2fa', f: '#c9b0ff' },
    { seuil: 27, a: '#ddd2ba', b: '#8a7e66', l: '#5a3a2a', x: '#3a2418', f: '#ffe08a' },
    { seuil: 42, a: '#6a1620', b: '#22060a', l: '#ff7a6a', x: '#ffe0d8', f: '#ff7a5a' },
    { seuil: 57, a: '#14465a', b: '#04161c', l: '#7ff0e0', x: '#e0fff8', f: '#7ff0e0' }
  ];

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#1d1424"/><circle cx="10.4" cy="8" r="1.6" fill="#1d1424"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#1d1424"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';
  const FLAMME_ON = '<svg viewBox="0 0 13 18" aria-hidden="true"><path d="M6.5 1C8 4 11.5 6.5 11.5 11a5 5 0 0 1-10 0C1.5 8 3.5 6.5 4.5 4c.6 1.6 1.4 2.4 2.2 2.6C6.4 4.8 6 3 6.5 1z" fill="#ffb02e"/><path d="M6.5 8c1 1.4 2.4 2.4 2.4 4.2a2.4 2.4 0 0 1-4.8 0c0-1.4.9-2.4 1.4-3.3.3.6.6.9 1 1 0-.6-.1-1.2 0-1.9z" fill="#fff4b0"/></svg>';
  const FLAMME_OFF = '<svg viewBox="0 0 13 18" aria-hidden="true"><path d="M6 17c-1.5-2 1.5-3 0-5s1.5-3 0-5 1-3 .5-5" fill="none" stroke="#7a6a84" stroke-width="1.4" stroke-linecap="round" opacity=".8"/></svg>';
  const ICONE_SEL = '<svg viewBox="0 0 24 22" aria-hidden="true"><path d="M7 2h10l-1 4H8z" fill="#8a8070"/><path d="M6 6h12c1 0 1.5.8 1.3 1.8L17.5 20c-.2.8-.8 1.2-1.6 1.2H8.1c-.8 0-1.4-.4-1.6-1.2L4.7 7.8C4.5 6.8 5 6 6 6z" fill="#fff" stroke="#8a8070" stroke-width="1.2"/></svg>';

  // Tutoriels : démonstration animée (mot de départ, lettres proposées,
  // étapes [lettre, qui (0 toi, 1 robot, 2 esprit), 'g' = au début]).
  const TUTOS = {
    base: { debut: 'LOU', puces: 'VPRSEA', etapes: [['V', 0], ['E', 1]], fin: 'mot' },
    mort: { debut: 'BOU', puces: 'GLCXQZ', mortes: 'XQZ', etapes: [['G', 0], ['X', 1]], fin: 'mort' },
    maudit: { debut: 'FANTO', puces: 'MECHTR', maudites: 'MT', etapes: [['M', 0], ['E', 1]], fin: 'mot', double: true },
    bougie: { debut: 'CAV', puces: 'ARELIO', ombres: [[3, 4, 5], [0, 1, 2]], etapes: [['A', 0], ['L', 1]] },
    miroir: { debut: 'IROI', puces: 'MRSTAE', etapes: [['M', 0, 'g'], ['R', 1]], fin: 'mot' },
    sel: { debut: 'FANTO', puces: 'MCHESL', etapes: [['M', 1], ['SEL', 0], ['C', 1]], sel: true },
    esprit: { debut: 'CERC', puces: 'UELIOA', etapes: [['U', 0], ['E', 2]] },
    long: { debut: 'LOU', puces: 'PESTRA', etapes: [['P', 0], ['E', 1]], fin: 'mot', court: 1 }
  };

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const MAX_GRIMOIRE = 800;
  const prog = { etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, tutos: [], grimoire: [], plateau: 0, options: { son: true } };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 9999, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string' && TUTOS[x]);
      if (Array.isArray(d.grimoire)) prog.grimoire = d.grimoire.filter((x) => typeof x === 'string' && /^[A-Z]{4,12}$/.test(x)).slice(0, MAX_GRIMOIRE);
      prog.plateau = entier(d.plateau, 0, PLATEAUX.length - 1, 0);
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
    if (totalEtoiles() < PLATEAUX[prog.plateau].seuil) prog.plateau = 0;
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.grimoire = [];
    prog.plateau = 0;
    appliquerPlateau();
  }

  function donnees() {
    return {
      etoiles: prog.etoiles.slice(), records: prog.records.slice(), debloque: prog.debloque, tutos: prog.tutos.slice(),
      grimoire: prog.grimoire.slice(), plateau: prog.plateau, options: { son: prog.options.son }
    };
  }
  function sauver(niveauReprise, score) {
    try { window.JEL_SAVE.save(JEU, Object.assign({ niveau: niveauReprise, score: score }, donnees())); } catch (e) { /* le jeu continue */ }
  }
  // Réglages (son, plateau) et grimoire : jamais de nouvelle sauvegarde de niveau depuis l'écran titre.
  function sauverReglages() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: prog.options.son }, plateau: prog.plateau, grimoire: prog.grimoire.slice() }); } catch (e) { /* rien */ }
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null, bruitBuf = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      const v = o.vol || 0.1;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(o.attaque || 0.02, d / 3));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      if (o.vibrato) {
        const l = ac.createOscillator(), lg = ac.createGain();
        l.frequency.value = o.vibrato; lg.gain.value = f * (o.prof || 0.03);
        l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + d + 0.05);
      }
      let sortie = g;
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      osc.connect(g); sortie.connect(ac.destination);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  function bruit(d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      if (!bruitBuf) {
        bruitBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const ch = bruitBuf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      }
      const t = ac.currentTime + (o.retard || 0);
      const src = ac.createBufferSource(), g = ac.createGain(), fl = ac.createBiquadFilter();
      src.buffer = bruitBuf; src.loop = true;
      fl.type = o.type || 'lowpass'; fl.frequency.setValueAtTime(o.freq || 1200, t);
      if (o.vers) fl.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.vol || 0.08, t + Math.min(o.attaque || 0.02, d / 2));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      src.connect(fl); fl.connect(g); g.connect(ac.destination);
      src.start(t); src.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  const sons = {
    clic: () => note(620, 0.06, { type: 'triangle', vol: 0.06 }),
    glisse: () => bruit(0.38, { freq: 500, vers: 900, vol: 0.05, attaque: 0.1 }),
    pose: () => { note(160, 0.12, { type: 'triangle', vol: 0.14 }); bruit(0.06, { freq: 2200, vol: 0.05, retard: 0.01 }); },
    spectre: () => {
      [110, 116.5, 164.8].forEach((f, i) => note(f, 1.6, { type: 'sawtooth', vol: 0.05, filtre: 700, vibrato: 5 + i, prof: 0.02, attaque: 0.15 }));
      bruit(1.2, { freq: 300, vers: 2600, vol: 0.06, attaque: 0.3, type: 'bandpass' });
      note(880, 1.1, { vol: 0.03, vers: 440, vibrato: 7, retard: 0.2 });
    },
    souffle: () => bruit(0.45, { freq: 3000, vers: 500, vol: 0.09, type: 'highpass', attaque: 0.01 }),
    maudit: () => { note(196, 1.4, { vol: 0.08 }); note(466, 1.2, { vol: 0.05 }); note(554, 1.0, { vol: 0.03, retard: 0.02 }); },
    miroir: () => [1318, 1760, 2093, 2637].forEach((f, i) => note(f, 0.25, { vol: 0.03, retard: i * 0.05 })),
    sel: () => { for (let i = 0; i < 7; i++) bruit(0.03, { freq: 4000, vol: 0.06, retard: i * 0.045 + Math.random() * 0.02, type: 'highpass' }); },
    esprit: () => note(520, 1.3, { vol: 0.06, vers: 860, vibrato: 6, prof: 0.04, attaque: 0.25 }),
    victoire: () => [440, 523, 659, 880, 1047].forEach((f, i) => note(f, 0.42, { type: 'triangle', vol: 0.08, retard: i * 0.13 })),
    defaite: () => [330, 311, 294, 220].forEach((f, i) => note(f, 0.5, { type: 'sawtooth', vol: 0.05, filtre: 900, retard: i * 0.22 })),
    tic: () => note(1250, 0.04, { type: 'square', vol: 0.03 }),
    arrive: () => { note(660, 0.14, { vol: 0.07 }); note(880, 0.18, { vol: 0.07, retard: 0.1 }); },
    part: () => { note(880, 0.14, { vol: 0.06 }); note(587, 0.18, { vol: 0.06, retard: 0.1 }); },
    tour: () => note(988, 0.12, { vol: 0.05, type: 'triangle' }),
    non: () => note(170, 0.14, { type: 'triangle', vol: 0.07 })
  };

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.textContent = prog.options.son ? '🔊' : '🔇';
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    sauverReglages();
    majBoutonsSon();
    sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Dessins (canvas) : outils, symboles, planchette, bougie, spectre
  // ---------------------------------------------------------------------

  function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }
  function rond(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r);
    else { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  }
  function graineHasard(g) { let a = g >>> 0; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; }

  // Symbole d'une place, centré en (x, y), rayon r.
  function symbole(c, k, x, y, r) {
    c.save(); c.translate(x, y); c.scale(r / 50, r / 50);
    c.lineJoin = 'round'; c.lineCap = 'round';
    if (k === 0) { // lune
      c.fillStyle = '#dbe8ff'; rond(c, -4, 0, 34); c.fill();
      c.globalCompositeOperation = 'destination-out'; rond(c, 12, -10, 30); c.fill();
      c.globalCompositeOperation = 'source-over';
      c.fillStyle = '#9fb8e8'; rond(c, -18, 8, 4); c.fill(); rond(c, -10, 22, 3); c.fill();
    } else if (k === 1) { // crâne
      c.fillStyle = '#f4ead2'; c.strokeStyle = '#6b5a3a'; c.lineWidth = 3;
      c.beginPath(); c.arc(0, -6, 30, Math.PI * 0.9, Math.PI * 2.1); c.lineTo(22, 18); c.lineTo(-22, 18); c.closePath(); c.fill(); c.stroke();
      rr(c, -16, 14, 32, 18, 6); c.fill(); c.stroke();
      c.fillStyle = '#1d1424'; ell(c, -12, -2, 9, 10); c.fill(); ell(c, 12, -2, 9, 10); c.fill();
      c.beginPath(); c.moveTo(0, 8); c.lineTo(-5, 16); c.lineTo(5, 16); c.closePath(); c.fill();
      c.strokeStyle = '#6b5a3a'; c.lineWidth = 2.5;
      [-8, 0, 8].forEach((tx) => { c.beginPath(); c.moveTo(tx, 22); c.lineTo(tx, 31); c.stroke(); });
    } else if (k === 2) { // œil
      c.fillStyle = '#f4f7ee'; c.strokeStyle = '#1a3a28'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(-38, 0); c.quadraticCurveTo(0, -36, 38, 0); c.quadraticCurveTo(0, 36, -38, 0); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#3fbf7a'; rond(c, 0, 0, 15); c.fill();
      c.fillStyle = '#0c1a12'; ell(c, 0, 0, 5, 12); c.fill();
      c.fillStyle = '#fff'; rond(c, 5, -6, 4); c.fill();
      c.strokeStyle = '#1a3a28'; c.lineWidth = 2.5;
      [-24, -12, 0, 12, 24].forEach((lx) => { c.beginPath(); c.moveTo(lx, -17 + Math.abs(lx) * 0.4); c.lineTo(lx * 1.15, -27 + Math.abs(lx) * 0.4); c.stroke(); });
    } else { // araignée
      c.strokeStyle = '#2a1408'; c.lineWidth = 4;

        const a = -0.9 + i * 0.6;

          c.beginPath(); c.moveTo(sx * 8, 4); c.quadraticCurveTo(sx * 30, -22 + i * 14 + a, sx * 40, 4 + i * 10); c.stroke();
        });
      }

      ell(c, 0, 12, 15, 18); c.fill(); c.stroke();
      rond(c, 0, -12, 11); c.fill(); c.stroke();
      c.fillStyle = '#2a1408'; rond(c, -4, -14, 3); c.fill(); rond(c, 4, -14, 3); c.fill();
      c.strokeStyle = '#a8401a'; c.lineWidth = 3; c.beginPath(); c.moveTo(-6, 8); c.lineTo(6, 18); c.moveTo(6, 8); c.lineTo(-6, 18); c.stroke();
    }
    c.restore();
  }

  // Médaillon : disque sombre cerclé de la couleur de la place + symbole.
  function medaillon(c, k, x, y, r) {
    const g = c.createRadialGradient(x, y - r * 0.3, r * 0.1, x, y, r);
    g.addColorStop(0, '#3a2a48'); g.addColorStop(1, '#140c1a');
    c.fillStyle = g; rond(c, x, y, r); c.fill();
    c.lineWidth = Math.max(1.5, r * 0.1); c.strokeStyle = COUL[k]; rond(c, x, y, r * 0.93); c.stroke();
    symbole(c, k, x, y, r * 0.68);
  }

  // Couronne dorée du chef du salon, base centrée en (x, y).
  function couronne(c, x, y, k) {
    c.save(); c.translate(x, y); c.scale(k / 22, k / 22);
    c.fillStyle = '#ffcf3a'; c.strokeStyle = '#6a4200'; c.lineWidth = 2.5; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-20, 0); c.lineTo(-23, -22); c.lineTo(-10, -10); c.lineTo(0, -26); c.lineTo(10, -10); c.lineTo(23, -22); c.lineTo(20, 0); c.closePath();
    c.fill(); c.stroke();
    c.fillStyle = '#e23b2e'; rond(c, 0, -10, 3.5); c.fill();
    c.restore();
  }

  // Bougie posée en (x, y) (bas de la cire), hauteur h ; t pour la flamme.
  function bougie(c, x, y, h, t, coulFlamme, lueur) {
    const w = h * 0.36, tt = t / 1000;
    const vacille = Math.sin(tt * 9.1) * 0.5 + Math.sin(tt * 13.7) * 0.3 + Math.sin(tt * 3.3) * 0.2;
    if (lueur) {
      c.save(); c.globalCompositeOperation = 'lighter';
      const R0 = h * (3.6 + vacille * 0.12);
      const g = c.createRadialGradient(x, y - h * 1.1, 0, x, y - h * 1.1, R0);
      g.addColorStop(0, 'rgba(255,190,90,0.32)'); g.addColorStop(0.4, 'rgba(255,140,60,0.12)'); g.addColorStop(1, 'rgba(255,120,40,0)');
      c.fillStyle = g; c.fillRect(x - R0, y - h * 1.1 - R0, R0 * 2, R0 * 2);
      c.restore();
    }
    // bougeoir
    c.fillStyle = '#5a4a3a'; ell(c, x, y + h * 0.04, w * 1.2, w * 0.3); c.fill();
    c.fillStyle = '#8a7558'; ell(c, x, y, w * 0.95, w * 0.22); c.fill();
    // cire
    const g2 = c.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    g2.addColorStop(0, '#d8ccb0'); g2.addColorStop(0.5, '#fff6e0'); g2.addColorStop(1, '#bfae8c');
    c.fillStyle = g2; c.fillRect(x - w / 2, y - h, w, h);
    c.fillStyle = '#f4ead2'; ell(c, x, y - h, w / 2, w * 0.14); c.fill();
    c.fillStyle = '#efe2c4';
    c.beginPath(); c.moveTo(x - w * 0.2, y - h); c.quadraticCurveTo(x - w * 0.24, y - h * 0.7, x - w * 0.14, y - h * 0.6); c.quadraticCurveTo(x - w * 0.06, y - h * 0.75, x - w * 0.04, y - h); c.fill();
    // mèche et flamme
    c.strokeStyle = '#2a1a10'; c.lineWidth = Math.max(1, h * 0.025);
    c.beginPath(); c.moveTo(x, y - h); c.lineTo(x + vacille * h * 0.02, y - h * 1.08); c.stroke();
    const fx = x + vacille * h * 0.04, fy = y - h * 1.08, fh = h * (0.36 + vacille * 0.03), fw = h * 0.1;
    const g3 = c.createRadialGradient(fx, fy - fh * 0.3, 0, fx, fy - fh * 0.3, fh * 0.8);
    g3.addColorStop(0, '#fffbe0'); g3.addColorStop(0.45, coulFlamme || '#ffcf6a'); g3.addColorStop(1, 'rgba(255,100,30,0)');
    c.fillStyle = g3;
    c.beginPath(); c.moveTo(fx, fy - fh); c.bezierCurveTo(fx + fw * 1.4, fy - fh * 0.45, fx + fw, fy, fx, fy); c.bezierCurveTo(fx - fw, fy, fx - fw * 1.4, fy - fh * 0.45, fx, fy - fh); c.fill();
  }

  // Planchette : forme de cœur allongé, la loupe (trou) centrée en (x, y).
  function planchette(c, x, y, s, pl, alpha) {
    c.save(); c.translate(x, y); c.globalAlpha = alpha === undefined ? 0.92 : alpha;
    const k = s / 100;
    c.scale(k, k);
    c.fillStyle = 'rgba(0,0,0,.35)'; ell(c, 6, 40, 52, 22); c.fill();
    c.beginPath();
    c.moveTo(0, -46);
    c.bezierCurveTo(30, -46, 56, -10, 46, 24);
    c.bezierCurveTo(40, 48, 18, 60, 0, 62);
    c.bezierCurveTo(-18, 60, -40, 48, -46, 24);
    c.bezierCurveTo(-56, -10, -30, -46, 0, -46);
    c.closePath();
    c.moveTo(19, 0); c.arc(0, 0, 19, 0, Math.PI * 2, true);
    const g = c.createLinearGradient(-40, -40, 40, 60);
    g.addColorStop(0, pl.a); g.addColorStop(1, pl.b);
    c.fillStyle = g; c.fill('evenodd');
    c.strokeStyle = pl.l; c.lineWidth = 3; c.stroke();
    // anneau de la loupe et reflet
    c.strokeStyle = pl.l; c.lineWidth = 4; rond(c, 0, 0, 20); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.45)'; c.lineWidth = 3; c.beginPath(); c.arc(0, 0, 14, Math.PI * 1.1, Math.PI * 1.5); c.stroke();
    // gravures (sans lettres) : étoile et lune
    c.fillStyle = pl.l; c.globalAlpha *= 0.85;
    c.beginPath(); for (let i = 0; i < 10; i++) { const r2 = i % 2 ? 4 : 9, a = i * Math.PI / 5 - Math.PI / 2; c.lineTo(Math.cos(a) * r2, 38 + Math.sin(a) * r2); } c.closePath(); c.fill();
    c.beginPath(); c.arc(0, -30, 7, Math.PI * 0.3, Math.PI * 1.7); c.arc(3, -30, 5.5, Math.PI * 1.6, Math.PI * 0.4, true); c.fill();
    c.restore();
  }

  // Spectre : drap pâle qui ondule, yeux creux (a = opacité, m = bouche ouverte).
  function spectre(c, x, y, s, a, t) {
    if (a <= 0) return;
    c.save(); c.translate(x, y); c.globalAlpha = Math.min(1, a);
    const k = s / 100; c.scale(k, k);
    const g0 = c.createRadialGradient(0, -10, 10, 0, -10, 90);
    g0.addColorStop(0, 'rgba(168,240,228,.45)'); g0.addColorStop(1, 'rgba(168,240,228,0)');
    c.fillStyle = g0; rond(c, 0, -10, 90); c.fill();
    const g = c.createLinearGradient(0, -60, 0, 70);
    g.addColorStop(0, 'rgba(244,255,252,.95)'); g.addColorStop(1, 'rgba(127,216,200,.05)');
    c.fillStyle = g;
    c.beginPath(); c.moveTo(-40, 10); c.bezierCurveTo(-42, -40, -24, -62, 0, -62); c.bezierCurveTo(24, -62, 42, -40, 40, 10);
    const ph = t / 160;
    for (let i = 0; i <= 8; i++) { const xx = 40 - i * 10, yy = 60 + Math.sin(ph + i * 1.3) * 7 + (i % 2 ? -10 : 0); c.lineTo(xx, yy); }
    c.closePath(); c.fill();
    // bras
    c.beginPath(); c.moveTo(-36, -4); c.quadraticCurveTo(-66, -10 + Math.sin(ph) * 6, -72, -34); c.quadraticCurveTo(-56, -14, -34, 10); c.fill();
    c.beginPath(); c.moveTo(36, -4); c.quadraticCurveTo(66, -10 + Math.cos(ph) * 6, 72, -34); c.quadraticCurveTo(56, -14, 34, 10); c.fill();
    c.fillStyle = '#0c0912';
    ell(c, -15, -26, 8, 12, 0.15); c.fill(); ell(c, 15, -26, 8, 12, -0.15); c.fill();
    ell(c, 0, 4, 9, 14 + Math.sin(ph * 2) * 3); c.fill();
    c.fillStyle = 'rgba(255,90,82,.9)'; rond(c, -14, -24, 2.4); c.fill(); rond(c, 14, -24, 2.4); c.fill();
    c.restore();
  }

  // Plateau de séance sans lettres (gravures seulement), dans le rectangle donné.
  function dessinerPlanche(c, x, y, w, h, pl, sansCercles) {
    const r = Math.min(w, h) * 0.12;
    c.save();
    c.fillStyle = 'rgba(0,0,0,.5)'; rr(c, x + 6, y + 10, w, h, r); c.fill();
    const g = c.createLinearGradient(x, y, x + w * 0.3, y + h);
    g.addColorStop(0, pl.a); g.addColorStop(1, pl.b);
    c.fillStyle = g; rr(c, x, y, w, h, r); c.fill();
    // veines du bois
    const al = graineHasard(11);
    c.strokeStyle = 'rgba(0,0,0,.14)'; c.lineWidth = 1.2;
    for (let i = 0; i < 18; i++) {
      const yy = y + h * al(), dec = al() * 30;
      c.beginPath(); c.moveTo(x + 6, yy); c.bezierCurveTo(x + w * 0.3, yy - dec * 0.4, x + w * 0.6, yy + dec * 0.4, x + w - 6, yy + (al() - 0.5) * 10); c.stroke();
    }
    c.strokeStyle = pl.l; c.lineWidth = Math.max(2, w * 0.006); rr(c, x + 7, y + 7, w - 14, h - 14, r * 0.8); c.stroke();
    c.globalAlpha = 0.5; c.lineWidth = 1; rr(c, x + 12, y + 12, w - 24, h - 24, r * 0.7); c.stroke(); c.globalAlpha = 1;
    // soleil (coin gauche) et lune (coin droit) ; en jeu, les lettres prennent toute la place
    const u = Math.min(w, h) * 0.075;
    c.fillStyle = pl.l; c.strokeStyle = pl.l; c.lineWidth = Math.max(1.5, u * 0.12);
    if (!sansCercles) {
      rond(c, x + u * 2.1, y + u * 2.1, u * 0.7); c.fill();
      for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; c.beginPath(); c.moveTo(x + u * 2.1 + Math.cos(a) * u, y + u * 2.1 + Math.sin(a) * u); c.lineTo(x + u * 2.1 + Math.cos(a) * u * 1.45, y + u * 2.1 + Math.sin(a) * u * 1.45); c.stroke(); }
      c.beginPath(); c.arc(x + w - u * 2.1, y + u * 2.1, u, Math.PI * 0.35, Math.PI * 1.65); c.arc(x + w - u * 1.6, y + u * 2.1, u * 0.8, Math.PI * 1.55, Math.PI * 0.45, true); c.fill();
    }
    // étoiles semées
    for (let i = 0; i < 9; i++) {
      const sx = x + w * (0.15 + 0.7 * al()), sy = y + h * (0.12 + 0.8 * al()), sr = u * (0.12 + 0.12 * al());
      c.globalAlpha = 0.35; rond(c, sx, sy, sr); c.fill();
    }
    c.globalAlpha = 1;
    if (!sansCercles) {
      // emplacements gravés (aperçus, titre)
      c.strokeStyle = pl.l; c.globalAlpha = 0.55; c.lineWidth = Math.max(1, u * 0.1);
      const rangs = [7, 7, 6, 6];
      rangs.forEach((n, i) => {
        for (let j = 0; j < n; j++) {
          const t = (j - (n - 1) / 2) / 3.5;
          const cx = x + w / 2 + (j - (n - 1) / 2) * w * 0.115;
          const cy = y + h * (0.28 + i * 0.15) - (i < 2 ? 1 : -0.6) * h * 0.05 * (1 - t * t);
          rond(c, cx, cy, w * 0.04); c.stroke();
        }
      });
      c.globalAlpha = 1;
    }
    c.restore();
  }

  // L'écran titre : une table de séance à la bougie, le plateau, la planchette et le spectre.
  function dessinerTitre(t) {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    t = t || 0;
    const pl = PLATEAUX[prog.plateau];
    let g = c.createRadialGradient(w / 2, h * 0.55, 0, w / 2, h * 0.55, Math.max(w, h) * 0.8);
    g.addColorStop(0, '#2e1c36'); g.addColorStop(0.6, '#140c1a'); g.addColorStop(1, '#07050a');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    // fenêtre gothique lointaine avec la lune
    const fw = Math.min(w, h) * 0.22, fxp = w * 0.82, fyp = h * 0.16;
    c.fillStyle = '#1c2a44';
    c.beginPath(); c.moveTo(fxp - fw / 2, fyp + fw); c.lineTo(fxp - fw / 2, fyp); c.quadraticCurveTo(fxp, fyp - fw * 0.7, fxp + fw / 2, fyp); c.lineTo(fxp + fw / 2, fyp + fw); c.closePath(); c.fill();
    c.fillStyle = '#e8eef8'; rond(c, fxp + fw * 0.1, fyp + fw * 0.15, fw * 0.17); c.fill();
    c.strokeStyle = '#0c0912'; c.lineWidth = Math.max(2, fw * 0.05);
    c.beginPath(); c.moveTo(fxp, fyp - fw * 0.34); c.lineTo(fxp, fyp + fw); c.moveTo(fxp - fw / 2, fyp + fw * 0.45); c.lineTo(fxp + fw / 2, fyp + fw * 0.45); c.stroke();
    // table ronde en perspective
    const ty = h * 0.7, tw = Math.max(w * 0.62, Math.min(w * 1.1, h * 0.75)), th = tw * 0.32;
    c.fillStyle = '#1a0e08'; ell(c, w / 2, ty + th * 0.18, tw * 0.52, th * 0.52); c.fill();
    g = c.createRadialGradient(w / 2, ty - th * 0.2, 0, w / 2, ty, tw * 0.55);
    g.addColorStop(0, '#5a3418'); g.addColorStop(1, '#24120a');
    c.fillStyle = g; ell(c, w / 2, ty, tw * 0.5, th * 0.5); c.fill();
    // plateau sur la table (vu en légère perspective)
    const pw = tw * 0.62, ph = pw * 0.6;
    c.save(); c.translate(w / 2, ty - th * 0.02); c.scale(1, 0.5); c.rotate(-0.06);
    dessinerPlanche(c, -pw / 2, -ph / 2, pw, ph, pl, false);
    planchette(c, pw * 0.08, ph * 0.02, pw * 0.2, pl, 1);
    c.restore();
    // bougies
    bougie(c, w / 2 - tw * 0.42, ty - th * 0.05, Math.min(w, h) * 0.14, t, pl.f, true);
    bougie(c, w / 2 + tw * 0.4, ty + th * 0.04, Math.min(w, h) * 0.1, t + 700, pl.f, true);
    // le spectre qui s'élève au-dessus de la table
    const large = w > h, taille = Math.min(w, h) * (large ? 0.26 : 0.34);
    const sx = w / 2 + Math.sin(t / 1300) * w * 0.03;
    const sy = (large ? ty - th * 0.5 - taille * 0.55 : ty - th * 0.9 - Math.min(w, h) * 0.12) + Math.sin(t / 900) * 6;
    spectre(c, sx, sy, taille, 0.55 + 0.1 * Math.sin(t / 700), t);
    // poussière qui flotte
    const al = graineHasard(5);
    c.fillStyle = 'rgba(255,220,160,.5)';
    for (let i = 0; i < 40; i++) {
      const px = (al() * w + t * 0.01 * (al() + 0.2)) % w, py = (al() * h - t * 0.012 * (al() + 0.3) + h * 10) % h;
      rond(c, px, py, 0.6 + al() * 1.4); c.fill();
    }
    // vignette
    g = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.7)');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
  }

  let rafTitre = 0;
  function animerTitre(t) {
    rafTitre = 0;
    if (ecran === 'jeu') return;
    dessinerTitre(t);
    if (ecran === 'titre') rafTitre = requestAnimationFrame(animerTitre);
  }

  let jeton = 0;
  let dernierAttends = 0;

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'grimoire', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom !== 'jeu') { dessinerTitre(performance.now()); if (nom === 'titre' && !rafTitre) rafTitre = requestAnimationFrame(animerTitre); }
    if (nom === 'titre') majTitre();
