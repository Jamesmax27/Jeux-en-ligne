  }

  function toast(texte, duree, rouge) {
    const el = $('toast');
    el.textContent = texte;
    el.classList.toggle('haut', salonOuvert() || $('voile-fin').classList.contains('actif'));
    el.classList.toggle('rouge', !!rouge);
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  // Cartes des 4 places, en haut de l'écran, et dans le salon.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'symb'; cv.width = 84; cv.height = 84;
      medaillon(cv.getContext('2d'), s, 42, 42, 40);
      const fl = document.createElement('span'); fl.className = 'flammes';
      const tag = document.createElement('span'); tag.className = 'tag';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 26, 36, 24);
      d.append(cv, fl, tag, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 112; cv.height = 112;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  // Les 26 lettres du plateau (boutons) : la position est donnée par disposer().
  function construireLettres() {
    const boite = $('lettres');
    boite.textContent = '';
    O.ALPHA.split('').forEach((l) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'lettre'; b.dataset.l = l; b.textContent = l;
      b.addEventListener('click', () => { audio(); poser(l); });
      boite.appendChild(b);
      boutons[l] = b;
    });
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : pseudo d'un vrai joueur en ligne (partie.sieges()[s].nom), sinon le libellé.
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  // Nom d'une place dans les phrases : « Toi » n'y sert pas ; pseudo, sinon le symbole.
  function nomPhrase(s) {
    const info = siegesActuels()[s] || {};
    return info.humain && !info.moi && info.nom ? info.nom : tr('symbole.' + s);
  }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !O.finie(e) ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      // Avant la création de la partie (tutoriel), en solo : la place 0 est la tienne.
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: session === 'solo' && s === 0 };
      const fl = e ? e.fl[s] : 3, fm = e ? Math.max(e.fm[s], fl) : 3;
      const cle = fl + '/' + fm;
      const zone = d.querySelector('.flammes');
      if (zone.dataset.cle !== cle) {
        zone.dataset.cle = cle;
        let html = '';
        for (let k = 0; k < fm; k++) html += k < fl ? FLAMME_ON : FLAMME_OFF;
        zone.innerHTML = html;
      }
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('eteint', !!e && fl <= 0);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria.' + role, { symbole: tr('symbole.' + s), n: fl }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || O.finie(e)) return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) {
      if (e.ban) return tr('tour.toiRejoue');
      return O.devant(e) ? tr('tour.toiDebut') : tr('tour.toi');
    }
    if (e.fl[partie.siege] <= 0) return tr('tour.eteint');
    return tr('tour.nom', { nom: nomPhrase(s) });
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  // Mot en cours : lettres (maudites en rouge) et place de la prochaine lettre.
  let dernierMot = '';
  function majMot(neuve) {
    const e = vue, boite = $('mot');
    const mot = e ? e.f : '';
    const enJeu = !!e && partie && partie.phase === 'jeu' && !O.finie(e);
    const av = enJeu && O.devant(e);
    const cle = mot + '|' + (enJeu ? (av ? 'g' : 'd') : '-') + '|' + (e ? e.mm.join('') : '') + '|' + (neuve || '');
    $('zone-mot').classList.toggle('miroir', !!av);
    if (boite.dataset.cle === cle) return;
    boite.dataset.cle = cle;
    boite.textContent = '';
    const trou = () => { const t = document.createElement('span'); t.className = 'trou'; return t; };
    if (enJeu && av) boite.appendChild(trou());
    for (let i = 0; i < mot.length; i++) {
      const sp = document.createElement('span');
      const ch = mot.charAt(i);
      sp.className = 'l' + (e.mm.indexOf(ch) >= 0 ? ' maudite' : '');
      if (neuve && neuve.i === i) sp.className += ' neuf' + (neuve.esp ? ' esp' : '');
      sp.textContent = ch;
      boite.appendChild(sp);
    }
    if (enJeu && !av) boite.appendChild(trou());
    boite.setAttribute('aria-label', tr('mot.aria', { mot: mot }));
    dernierMot = mot;
  }

  // Étiquettes des nouveautés actives pendant la manche.
  function majEtiquettes() {
    const e = vue, boite = $('etiquettes');
    const cle = e ? [e.nm, e.ca, e.mi, e.esp, e.min].join(',') : '';
    if (boite.dataset.cle === cle) return;
    boite.dataset.cle = cle;
    boite.textContent = '';
    if (!e) return;
    const ajouter = (classe, texte) => { const s = document.createElement('span'); s.className = 'etiq ' + classe; s.textContent = texte; boite.appendChild(s); };
    if (e.min > 4) ajouter('long', tr('etiquette.long', { n: e.min }));
    if (e.nm) ajouter('maudites', tr('etiquette.maudites'));
    if (e.ca) ajouter('bougie', tr('etiquette.bougie'));
    if (e.mi) ajouter('miroir', tr('etiquette.miroir'));
    if (e.esp) ajouter('esprit', tr('etiquette.esprit'));
  }

  // État des 26 lettres : dans le noir, mortes, maudites, refusées par le sel.
  function majPlateau() {
    const e = vue;
    const enJeu = !!e && partie && partie.phase === 'jeu' && !O.finie(e);
    const l0 = enJeu ? O.liste(e, e.f) : null;
    O.ALPHA.split('').forEach((l) => {
      const b = boutons[l];
      let ombre = false, morte = false, maudite = false, interdite = false;
      if (e) {
        maudite = e.mm.indexOf(l) >= 0;
        if (enJeu) {
          ombre = !O.visible(e, l);
          interdite = e.ban === l;
          if (!ombre && !interdite) { const g = O.ajout(e, l); morte = !O.ferme(e, g) && !O.vivantDans(e, l0, g); }
        }
      }
      b.classList.toggle('ombre', ombre);
      b.classList.toggle('morte', morte);
      b.classList.toggle('maudite', maudite);
      b.classList.toggle('interdite', interdite);
      b.disabled = ombre || interdite;
      const cle = ombre ? 'lettre.ombre' : morte ? 'lettre.morte' : maudite ? 'lettre.maudite' : 'lettre.aria';
      b.setAttribute('aria-label', tr(cle, { lettre: l }));
    });
    // bouton Sel
    const sel = $('btn-sel');
    const moi = partie ? partie.siege : -1;
    sel.hidden = !(e && e.sm > 0);
    const n = e && moi >= 0 ? e.se[moi] : 0;
    $('sel-n').textContent = nb(n);
    const peut = enJeu && moi >= 0 && partie.monTour() && O.peutSaler(e, moi);
    sel.disabled = !peut;
    sel.classList.toggle('pret', peut);
    sel.setAttribute('aria-label', tr('sel.aria', { n: n }));
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majMot();
    majEtiquettes();
    majPlateau();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !O.finie(e)) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Plateau : disposition, dessin, effets
  // ---------------------------------------------------------------------

  let planche = null;          // dessin du plateau (canvas hors écran)
  function appliquerPlateau() {
    const pl = PLATEAUX[prog.plateau] || PLATEAUX[0];
    const boite = $('lettres');
    boite.style.setProperty('--trait', pl.l + '99');
    boite.style.setProperty('--encre', pl.x);
    boite.style.setProperty('--lueur', pl.f + '88');
    planche = null;
  }

  function disposer() {
    const z = $('zone'), w = z.clientWidth, h = z.clientHeight;
    if (!w || !h) return;
    const rangs = O.RANGS;
    let b = Math.min((w - 20) / 7.5, (h - 24) / 5.2, 66);
    b = Math.max(44, b);
    const pas = b * 1.07, haut = b * 1.12, arc = b * 0.32;
    // Positions des lettres (rangées en arc), puis le tout centré dans la zone.
    const pos = {};
    let haut0 = Infinity, bas0 = -Infinity;
    rangs.forEach((r, i) => {
      const n = r.length;
      for (let j = 0; j < n; j++) {
        const dx = (j - (n - 1) / 2) * pas, t = (j - (n - 1) / 2) / 3.2;
        const y = i * haut + (i < 2 ? -arc * (1 - t * t) : arc * 0.6 * (1 - t * t));
        pos[r.charAt(j)] = { x: w / 2 + dx, y: y };
        haut0 = Math.min(haut0, y); bas0 = Math.max(bas0, y);
      }
    });
    const marge = b * 0.68;
    const bh = bas0 - haut0 + 2 * marge;
    const decal = Math.max(b * 0.9, (h - bh) / 2 + b * 0.25) - haut0 + marge;
    Object.keys(pos).forEach((l) => { pos[l].y += decal; });
    const y0 = decal;
    const bx = w / 2 - pas * 3.5 - b * 0.45, bw = pas * 7 + b * 0.9;
    const by = haut0 + decal - marge;
    geo = { w: w, h: h, b: b, pos: pos, bx: bx, by: by, bw: Math.min(bw, w - 4), bh: bh, haut: haut, y0: y0 };
    if (geo.bw < bw) geo.bx = 2;
    O.ALPHA.split('').forEach((l) => {
      const p = pos[l], bt = boutons[l];
      bt.style.width = bt.style.height = b + 'px';
      bt.style.left = (p.x - b / 2) + 'px';
      bt.style.top = (p.y - b / 2) + 'px';
      bt.style.fontSize = (b * 0.5) + 'px';
    });
    if (!fxs.plan) fxs.plan = { x: w / 2, y: y0 + haut * 1.5, dx: w / 2, dy: y0 + haut * 1.5, t0: 0, depuisX: w / 2, depuisY: y0 + haut * 1.5 };
    planche = null;
  }

  function preparerPlanche(dpr) {
    if (!geo) return null;
    const cv = document.createElement('canvas');
    cv.width = Math.round(geo.w * dpr); cv.height = Math.round(geo.h * dpr);
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    dessinerPlanche(c, geo.bx, geo.by, geo.bw, geo.bh, PLATEAUX[prog.plateau], true);
    return cv;
  }

  // La bougie est posée sur le rebord du plateau, en haut à droite, au-dessus des lettres.
  function placeBougie() {
    if (!geo) return null;
    const x = geo.bx + geo.bw - geo.b * 0.55;
    return { x: Math.min(geo.w - geo.b * 0.4, x), y: geo.by + geo.b * 0.12, h: geo.b * 0.9 };
  }

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const tab = $('table'), fx = $('fx'), z = $('zone');
    const w = z.clientWidth, h = z.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (!geo || geo.w !== w || geo.h !== h) disposer();
    [tab, fx].forEach((cv) => { if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); planche = null; } });
    const pl = PLATEAUX[prog.plateau];
    // fond : le plateau et la bougie
    const c = tab.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, tab.width, tab.height);
    if (!planche) planche = preparerPlanche(dpr);
    if (planche) c.drawImage(planche, 0, 0);
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const pb = placeBougie();
    // effets au-dessus des lettres : ombre, planchette, spectres, particules
    const f = fx.getContext('2d');
    f.setTransform(dpr, 0, 0, dpr, 0, 0);
    f.clearRect(0, 0, w, h);
    const e = vue;
    const o = e && partie && partie.phase === 'jeu' && !O.finie(e) ? O.ombre(e) : -1;
    if (o >= 0 && geo) {
      const yMilieu = geo.y0 + geo.haut * 1.5;
      const y1 = o === 0 ? geo.by - 4 : yMilieu, y2 = o === 0 ? yMilieu : geo.by + geo.bh + 4;
      const g = f.createLinearGradient(0, o === 0 ? y2 : y1, 0, o === 0 ? y1 : y2);
      g.addColorStop(0, 'rgba(6,3,10,.55)'); g.addColorStop(0.25, 'rgba(6,3,10,.86)'); g.addColorStop(1, 'rgba(6,3,10,.94)');
      f.fillStyle = g; rr(f, geo.bx - 4, y1, geo.bw + 8, y2 - y1, 12); f.fill();
    }
    if (pb) bougie(o >= 0 ? f : c, pb.x, pb.y, pb.h, t, pl.f, true);
    // planchette : glisse vers la dernière lettre
    const p = fxs.plan;
    if (p && geo) {
      const k = Math.min(1, (t - p.t0) / 480), ease = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      p.x = p.depuisX + (p.dx - p.depuisX) * ease;
      p.y = p.depuisY + (p.dy - p.depuisY) * ease;
      const flotte = Math.sin(t / 600) * 1.5;
      planchette(f, p.x, p.y + flotte, geo.b * 1.25, pl, 0.78);
    }
    // spectres (mot réveillé)
    for (let i = fxs.spectres.length - 1; i >= 0; i--) {
      const s = fxs.spectres[i], a = (t - s.t0) / 1900;
      if (a >= 1) { fxs.spectres.splice(i, 1); continue; }
      const alpha = a < 0.2 ? a / 0.2 : 1 - (a - 0.2) / 0.8;
      spectre(f, s.x + Math.sin(a * 6) * 10, s.y - a * geo.b * 2.2, geo.b * (2 + a * 0.8), alpha * 0.95, t);
    }
    // particules (sel, braises)
    for (let i = fxs.parts.length - 1; i >= 0; i--) {
      const q = fxs.parts[i];
      q.vie -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.g || 0) * dt;
      if (q.vie <= 0) { fxs.parts.splice(i, 1); continue; }
      f.globalAlpha = Math.min(1, q.vie * 2);
      f.fillStyle = q.coul; rond(f, q.x, q.y, q.k); f.fill();
      f.globalAlpha = 1;
    }
  }

  function centreLettre(l) { return geo && geo.pos[l] ? geo.pos[l] : null; }
  function glisserVers(l) {
    const p = centreLettre(l);
    if (!p || !fxs.plan) return;
    const pl = fxs.plan;
    pl.depuisX = pl.x; pl.depuisY = pl.y; pl.dx = p.x; pl.dy = p.y; pl.t0 = performance.now();
    sons.glisse();
  }
  function eclat(l, coul, n, g) {
    const p = centreLettre(l);
    if (!p) return;
    for (let k = 0; k < (n || 12); k++) {
      const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 130;
      fxs.parts.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, vie: 0.6 + Math.random() * 0.5, k: 1.5 + Math.random() * 2.5, coul: coul, g: g === undefined ? 160 : g });
    }
  }
  function flashLettre(l, classe) {
    const b = boutons[l];
    if (!b) return;
    b.classList.remove('pose', 'esp'); void b.offsetWidth; b.classList.add(classe || 'pose');
  }
  function reveillerSpectre(l) {
    const p = centreLettre(l) || (geo ? { x: geo.w / 2, y: geo.y0 + geo.haut } : null);
    if (!p) return;
    fxs.spectres.push({ x: p.x, y: p.y, t0: performance.now() });
    const z = $('zone');
    z.classList.remove('secousse'); void z.offsetWidth; z.classList.add('secousse');
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // Salon d'attente (en ligne) : le premier joueur arrivé lance la manche.
  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44);
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { symbole: tr('symbole.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { qui: nomPhrase(partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));

  // Braises dorées de victoire.
  function braises() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 110; i++) bouts.push({ x: Math.random() * w, y: h + Math.random() * h * 0.3, vx: (Math.random() - 0.5) * 40, vy: -(90 + Math.random() * 200), k: 1.5 + Math.random() * 3.5, coul: ['#ffcf6a', '#ff9a3a', '#fff0b0', '#a8f0e4'][i % 4], ph: Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++braises.n;
    function pas(t) {
      if (j !== braises.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += (b.vx + Math.sin(t / 300 + b.ph) * 30) * dt; b.y += b.vy * dt;
        c.globalAlpha = Math.max(0, Math.min(1, 1 - (t - debut) / 3000));
        c.fillStyle = b.coul; rond(c, b.x, b.y, b.k); c.fill();
      });
      c.globalAlpha = 1;
      if (t - debut < 3000) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  braises.n = 0;

        if ((d.mortes || '').indexOf(l) >= 0) p.classList.add('morte');
        if ((d.maudites || '').indexOf(l) >= 0) p.classList.add('maudite');
        if (d.ombres && d.ombres[etape % d.ombres.length].indexOf(i) >= 0) p.classList.add('ombre');
        p.dataset.l = l;
        puces.appendChild(p);
      });
    }
    function flammes(n, max) { let h = ''; for (let k = 0; k < max; k++) h += k < n ? FLAMME_ON : FLAMME_OFF; flEl.innerHTML = h; }
    function placerMain(x, y, vite) {
      main.style.transition = vite ? 'none' : 'transform .6s ease-in-out';
      main.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    }
    function cycle() {
      let f = d.debut;
      afficherMot(f);
      construirePuces(0);
      flammes(3, 3);
      qui.textContent = '';
      placerMain(demo.clientWidth - 54, demo.clientHeight - 64, true);
      let t = 500;
      d.etapes.forEach((et, k) => {
        const l = et[0], q = et[1], debut = et[2] === 'g';
        plus_tard(() => {
          construirePuces(k);
          qui.textContent = tr(q === 0 ? 'tuto.toi' : q === 2 ? 'tuto.esprit' : 'tuto.robot');
          const p = puces.querySelector('[data-l="' + l + '"]');
          if (q === 0 && p) {
            const rd = demo.getBoundingClientRect(), rp = p.getBoundingClientRect();
            placerMain(rp.left - rd.left + rp.width / 2 - 14, rp.top - rd.top + rp.height / 2 - 4, false);
          } else placerMain(demo.clientWidth - 54, demo.clientHeight - 64, false);
        }, t);
        t += 800;
        plus_tard(() => {
          const p = puces.querySelector('[data-l="' + l + '"]');
          if (p) { p.classList.remove('touche'); void p.offsetWidth; p.classList.add('touche'); }
          if (l === 'SEL') {
            afficherMot(f, { barre: f.length - 1 });
            f = f.slice(0, -1);
            return;
          }
          f = debut ? l + f : f + l;
          const i = debut ? 0 : f.length - 1;
          afficherMot(f, q === 2 ? { esp: i } : { neuf: i, court: d.court && k === 0 });
          if (q === 2) fant.classList.remove('montre'), void fant.offsetWidth, fant.classList.add('montre');
        }, t);
        t += 700;
      });
      if (d.fin) {
        plus_tard(() => {
          afficherMot(f, { fini: true });
          fant.classList.remove('montre'); void fant.offsetWidth; fant.classList.add('montre');
          flammes(d.double ? 1 : 2, 3);
        }, t);
        t += 1900;
      } else t += 1200;
      plus_tard(cycle, t);
    }
    plus_tard(cycle, 50);
    const fermer = () => {
      arreterTuto();
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function poser(l) {
    if (!partie || enPause || attenteTuto || !vue) return;
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (!O.permise(vue, l)) { sons.non(); return; }
    partie.jouer(l);
  }

  function saler() {
    if (!partie || enPause || attenteTuto || !vue || partie.siege < 0) return;
    if (!partie.monTour() || !O.peutSaler(vue, partie.siege)) { sons.non(); return; }
    partie.jouer('SEL');
  }

  // Flèches : passe d'une lettre à sa voisine (dans le sens demandé).
  function deplacerFocus(dx, dy) {
    if (!geo) return;
    const act = document.activeElement;
    const actuel = act && act.classList && act.classList.contains('lettre') ? act.dataset.l : null;
    const libres = O.ALPHA.split('').filter((l) => !boutons[l].disabled);
    if (!libres.length) return;
    if (!actuel) { boutons[libres[0]].focus(); return; }
    const p = geo.pos[actuel];
    let best = null, bd = Infinity;
    libres.forEach((l) => {
      if (l === actuel) return;
      const q = geo.pos[l], vx = q.x - p.x, vy = q.y - p.y;
      const avance = vx * dx + vy * dy;
      if (avance <= 4) return;
      const score = avance + Math.abs(vx * dy - vy * dx) * 2.4;
      if (score < bd) { bd = score; best = l; }
    });
    if (best) { boutons[best].focus(); sons.clic(); }
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) { ev.preventDefault(); audio(); deplacerFocus(dirs[ev.code][0], dirs[ev.code][1]); return; }
    if (ev.code === 'Backspace' || ev.code === 'Delete') { ev.preventDefault(); audio(); saler(); return; }
    if ((ev.code === 'Enter' || ev.code === 'Space') && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) {
      ev.preventDefault(); deplacerFocus(1, 0); return;
    }
    if (typeof ev.key === 'string' && /^[a-zA-Z]$/.test(ev.key)) {
      ev.preventDefault(); audio();
      poser(ev.key.toUpperCase());
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-grimoire').addEventListener('click', () => { audio(); sons.clic(); ouvrirGrimoire(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('gr-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-sel').addEventListener('click', () => { audio(); saler(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une séance solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, motsAutres * 10);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(performance.now()); else { disposer(); } });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  construireLettres();
  appliquerPlateau();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami : directement dans le salon de sa partie.
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
