     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();

.barre {
  display: flex; align-items: center; gap: 6px; padding: max(6px, env(safe-area-inset-top)) 8px 6px;
  background: rgba(52,34,18,.55); color: #fff8e1; flex: none;
}
.barre .info { flex: 1; min-width: 0; line-height: 1.1; }
.barre .info b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barre .info span { font-size: 13px; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.compteur { display: inline-flex; align-items: center; gap: 3px; font-weight: 900; font-size: 18px; background: rgba(255,248,225,.18); border-radius: 14px; padding: 4px 8px 4px 4px; min-height: 40px; }
.compteur svg { width: 28px; height: 28px; }
.etoiles-jeu { display: inline-flex; gap: 0; }
.etoiles-jeu svg { width: 18px; height: 18px; }
#plateau { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#jardin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.case {
  position: absolute; width: var(--s); height: var(--s); padding: 3px;
}
.case .terre {
  position: absolute; inset: 2px; border-radius: 22%; background: #8a5a33;
  box-shadow: inset 0 calc(var(--s) * -.08) 0 #6b4324, 0 2px 0 rgba(0,0,0,.18);
}
.case .terre::before { content: ""; position: absolute; left: 22%; right: 22%; top: 46%; height: 8%; border-radius: 4px; background: #6b4324; opacity: .55; }
.case.sel .terre { box-shadow: inset 0 calc(var(--s) * -.08) 0 #6b4324, 0 0 0 3px #fff3a0, 0 0 12px 4px rgba(255,243,160,.75); }
.case.cible .terre { background: #a87245; }
.graine-c, .graine {
  position: absolute; inset: 9%; border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%;
  background: radial-gradient(circle at 35% 30%, #fff6d8, #efd394 60%, #d7b06a);
  display: flex; align-items: center; justify-content: center; font-weight: 900;
  color: #3e2a14; font-size: calc(var(--s) * .52); line-height: 1; box-shadow: 0 2px 0 rgba(0,0,0,.25);
}
.case.donnee .graine-c { background: radial-gradient(circle at 35% 30%, #e9ffe0, #b9e3a0 60%, #8cc276); }
.case.or .graine-c { background: radial-gradient(circle at 35% 30%, #fffbe0, #ffd94d 60%, #e3a919); }
.case.fanee .graine-c { background: radial-gradient(circle at 35% 30%, #d8b89a, #a07650 60%, #7a5536); color: #3a2414; animation: secoue .4s; }
.case.fini .terre { background: #6fb453; box-shadow: inset 0 calc(var(--s) * -.08) 0 #4f8f3a; }
.case.fini .graine-c { background: radial-gradient(circle at 35% 30%, #fff, #ffe9f1 60%, #ffc2d8); animation: fleurit .6s; }
.graine-c.indice { opacity: .55; background: rgba(255,248,225,.55); border: 3px dashed #fff8e1; box-shadow: none; animation: gele .3s; }
.pousse { position: absolute; right: 2%; top: -2%; width: 38%; height: 38%; pointer-events: none; }
.herbe, .glace { position: absolute; inset: 0; pointer-events: none; }
.herbe svg, .glace svg { width: 100%; height: 100%; }
.glace { animation: gele .4s; }
.icone { position: absolute; width: var(--s); height: var(--s); padding: 2px; }
.icone > svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 1px rgba(0,0,0,.25)); }
.icone.mot-fini > svg { animation: saute .7s; }
.icone .fruit { position: absolute; width: 40%; height: 40%; }
.tas { position: absolute; z-index: 4; border-radius: 30%; cursor: pointer; }
.tas svg { width: 100%; height: 100%; }
.tas.souffle { animation: envol .5s forwards; pointer-events: none; }
.bete { position: absolute; left: 0; top: 0; z-index: 6; width: calc(var(--s) * .9); height: calc(var(--s) * .9); margin: calc(var(--s) * -.45) 0 0 calc(var(--s) * -.45); cursor: pointer; }
.bete svg { width: 100%; height: 100%; pointer-events: none; }
.bete.fuite { opacity: .8; }
.bete.abe svg { animation: vole .25s infinite alternate; }
#epou-jeu { position: absolute; right: 2px; bottom: 0; width: 64px; height: 84px; opacity: .85; pointer-events: none; }
#bulle {
  position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 20; max-width: 92%;
  background: #fff8e1; color: #4a2f17; font-weight: 800; padding: 8px 14px; border-radius: 16px; font-size: 15px;
  box-shadow: 0 4px 12px rgba(0,0,0,.25); text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none;
}
#bulle.vu { opacity: 1; }
#outils-jeu { display: flex; justify-content: center; gap: 8px; padding: 4px 8px 0; flex: none; }
#b-arrosoir { position: relative; }
#b-arrosoir.actif { background: #8fd3ff; box-shadow: 0 0 0 3px #fff3a0; }
#b-arrosoir .nb { position: absolute; right: -4px; bottom: -4px; background: #2d6fb5; color: #fff; font-weight: 900; font-size: 13px; border-radius: 10px; padding: 1px 6px; }
#panier {
  flex: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 8px 8px max(10px, env(safe-area-inset-bottom));
  background: linear-gradient(#a6743f, #7d5228); border-top: 4px solid #5d3a1a; min-height: 70px;
}
.tuile { position: relative; width: 48px; height: 52px; border: 0; padding: 0; background: none; --s: 54px; touch-action: none; }
.tuile .graine { inset: 0; font-size: 26px; }
.tuile .nb { position: absolute; right: -3px; bottom: -3px; background: #3e7a2c; color: #fff; font-weight: 900; font-size: 12px; border-radius: 9px; padding: 1px 5px; pointer-events: none; }
.tuile.vide { opacity: .25; }
#fantome { position: fixed; z-index: 50; width: 54px; height: 56px; margin: -40px 0 0 -27px; pointer-events: none; --s: 56px; }
#fantome .graine { inset: 0; font-size: 28px; transform: scale(1.1); box-shadow: 0 8px 14px rgba(0,0,0,.35); }
#particules { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

/* --- Fenêtres --- */
.voile { position: fixed; inset: 0; z-index: 40; background: rgba(28,20,10,.55); display: none; align-items: center; justify-content: center; padding: 14px; }
.voile.actif { display: flex; }
.carte {
  background: #fff8e1; color: #4a2f17; border-radius: 24px; padding: 18px 16px; width: min(94vw, 420px); max-height: 94vh; overflow-y: auto;
  text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: entre .3s;
}
.carte h2 { margin: 0 0 6px; font-size: 26px; color: #3e7a2c; }
.carte p { margin: 6px 0; font-size: 17px; font-weight: 600; line-height: 1.35; }
.carte .boutons { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; align-items: stretch; }
.carte .ligne { display: flex; justify-content: center; gap: 10px; align-items: center; flex-wrap: wrap; }
.gros-etoiles { display: flex; justify-content: center; gap: 6px; margin: 4px 0; }
.gros-etoiles svg { width: 58px; height: 58px; }
.gros-etoiles svg.gagne { animation: pop .5s backwards; }
.score-fin { font-size: 22px; font-weight: 900; }
.badge-record { display: inline-block; background: #ffcf4a; border-radius: 12px; padding: 4px 10px; font-weight: 900; animation: pop .5s; }
.nouveautes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 4px 0; }
.nouveautes svg { width: 44px; height: 44px; }
.scene-tuto { position: relative; width: 240px; height: 132px; margin: 6px auto 8px; border-radius: 18px; background: #8cc66b; overflow: hidden; --s: 46px; }
.scene-tuto .d { position: absolute; width: 46px; height: 46px; }
.scene-tuto .d svg { width: 100%; height: 100%; }
.etapes { text-align: left; margin: 4px 0 0; padding-left: 26px; font-size: 16px; font-weight: 700; line-height: 1.35; }
.etapes li { margin: 3px 0; }
#lang-titre, #lang-pause { display: inline-block; min-height: 44px; }

@keyframes secoue { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes fleurit { 0% { transform: scale(.6); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
@keyframes saute { 0%,100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-18%) scale(1.15); } }
@keyframes envol { to { transform: translate(60%, -80%) rotate(40deg); opacity: 0; } }
@keyframes vole { from { transform: translateY(-3%); } to { transform: translateY(3%); } }
@keyframes gele { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
@keyframes pop { 0% { transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes entre { from { transform: translateY(20px) scale(.95); opacity: 0; } }
@keyframes balance { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; } }
@media (min-width: 700px) { .tuile { width: 54px; height: 58px; } .tuile .graine { font-size: 30px; } }
</style>
</head>

<script>
/* ==========================================================================
   Le potager des lettres qui poussent — code du jeu
   Jeu de mots : on sème des graines-lettres dans les sillons d'un jardin pour
   écrire le nom de chaque dessin. 25 niveaux, 5 jardins, saisons et petites
   bêtes. Tout le texte visible passe par t() (module jel-i18n).
   ========================================================================== */
(function () {
  'use strict';

  const JEU = 'potager-des-lettres-qui-poussent';
  const I18N = window.JEL_I18N;
  const t = (cle, v) => I18N.t(cle, v);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);

  // ------------------------------------------------------------------------
  // Niveaux
  //   m    : mots [mot, x, y, sens] ; sens 'h' (dessin à gauche) ou 'v' (dessin au-dessus)
  //   s    : saisons (printemps : pousses + mauvaises herbes ; automne : feuilles ; hiver : gel)
  //   don  : 1 = première lettre de chaque mot déjà semée
  //   leu  : graines leurres dans le panier ; marge : graines en plus du minimum
  //   esc  : [délai entre deux escargots, secondes pour arriver] ; abe : [délai, secondes posée]
  //   arr  : arrosoirs ; her : [délai, maximum] ; feu : [tas au départ, délai] ; gel : [cases au départ, délai]
  //   tuto : tutoriels montrés au début du niveau (une seule fois)
  // ------------------------------------------------------------------------
  // DEBUT-NIVEAUX
  const L = (j, m, o) => Object.assign({ j, m, s: [], don: 0, leu: 3, marge: 5, esc: 0, abe: 0, arr: 0, her: 0, feu: 0, gel: 0, tuto: [] }, o);
  const NIVEAUX = [
    L('potager', [['CHOU', 1, 0, 'h']], { don: 1, leu: 0, marge: 4, tuto: ['semer'] }),
    L('potager', [['RADIS', 1, 0, 'h'], ['POIS', 1, 2, 'h']], { don: 1, leu: 2, marge: 4, tuto: ['leurres'] }),
    L('potager', [['NAVET', 1, 0, 'h'], ['MELON', 1, 2, 'h'], ['CHOU', 1, 4, 'h']], { don: 1, leu: 3, marge: 5, tuto: ['retirer'] }),
    L('potager', [['TOMATE', 1, 0, 'h'], ['SALADE', 1, 2, 'h'], ['POIS', 1, 4, 'h']], { don: 1, leu: 3, marge: 6, esc: [10, 10], tuto: ['escargot'] }),
    L('potager', [['CAROTTE', 1, 0, 'h'], ['OIGNON', 1, 2, 'h'], ['COURGE', 1, 4, 'h'], ['RADIS', 1, 6, 'h']], { don: 1, leu: 4, marge: 6, esc: [8, 8.5] }),
    L('verger', [['POMME', 1, 0, 'h'], ['POIRE', 1, 2, 'h'], ['PRUNE', 1, 4, 'h']], { leu: 3, marge: 6, abe: [11, 4.5], tuto: ['abeille'] }),

  }
  function majTout() { G.cases.forEach(majCase); majPanier(); majBarre(); majTas(); }

  // --- Règles des cases ---
  function estVerrouillee(c) { return c.mots.some((wi) => G.mots[wi].fini); }
  function sousFeuilles(c) { return c.mots.some((wi) => G.mots[wi].feuilles > 0); }
  function estBloquee(c) { return c.herbe || c.gel > 0 || sousFeuilles(c); }
  function raisonBlocage(c) {
    if (sousFeuilles(c)) return t('bloqueFeuilles');
    if (c.herbe) return t('bloqueHerbe');
    if (c.gel) return t('bloqueGel');
    return '';
  }
  const enJeu = () => G && !G.fini && !G.pause && !$('v-tuto').classList.contains('actif') && ecranActif === 'jeu';

  function choisirCase(k) {
    if (!G.cases.has(k)) return;
    const anc = G.sel; G.sel = k;
    if (anc && G.cases.get(anc)) majCase(G.cases.get(anc));
    majCase(G.cases.get(k));
  }
  function avancer(k) {
    // case suivante dans le même mot (sens préféré), sinon la première case vide
    const c = G.cases.get(k);
    const mots = c.mots.map((wi) => G.mots[wi]).filter((w) => !w.fini);
    mots.sort((a, b) => (a.d === G.dir ? -1 : 1) - (b.d === G.dir ? -1 : 1));
    for (const w of mots) {
      const i = w.cles.indexOf(k);
      for (let j = i + 1; j < w.cles.length; j++) { const n = G.cases.get(w.cles[j]); if (n.etat === 'vide') { G.dir = w.d; return choisirCase(n.k); } }
    }
    choisirCase(premiereCaseVide(k));
  }

  function semer(k, l) {
    if (!enJeu()) return false;
    const c = G.cases.get(k); if (!c) return false;
    if (estVerrouillee(c) || c.etat === 'donnee' || c.etat === 'or') { SON.erreur(); return false; }
    if (estBloquee(c)) { SON.erreur(); bulle(raisonBlocage(c)); secouer(c.el); return false; }
    if (!(G.panier[l] > 0)) { SON.erreur(); bulle(t('plusDeGraine', { l })); return false; }
    if (G.budget <= 0) { SON.erreur(); bulle(t('sachetVide')); return false; }
    if (c.etat === 'semee') { G.panier[c.l] = (G.panier[c.l] || 0) + 1; }
    G.panier[l]--; G.budget--; G.utilises++;
    c.l = l; c.etat = 'semee'; c.fanee = false;
    SON.seme();
    const [px, py] = centre(c.el); jaillir(px, py, 6, ['#8a5a33', '#b07a45', '#5fc24a'], { v: 90, haut: 40, forme: 'rond' });
    majCase(c);
    if (G.def.s.indexOf('printemps') >= 0 && l === c.sol) jaillir(px, py, 5, ['#5fc24a', '#9fe07a'], { v: 60, haut: 60, forme: 'petale' });
    verifier(k);
    if (!G.fini) avancer(k);
    majPanier(); majBarre();
    verifierDefaite();
    return true;
  }
  function retirer(k) {
    if (!enJeu()) return;
    const c = G.cases.get(k);
    if (!c || c.etat !== 'semee' || estVerrouillee(c)) return;
    G.panier[c.l] = (G.panier[c.l] || 0) + 1;
    c.l = ''; c.etat = 'vide'; c.fanee = false;
    SON.retire();
    choisirCase(k);
    majCase(c); majPanier(); majBarre();
    verifierDefaite();
  }
  function deplacer(de, vers) {
    if (!enJeu() || de === vers) return;
    const a = G.cases.get(de), b = G.cases.get(vers);
    if (!a || !b || a.etat !== 'semee' || estVerrouillee(a)) return;
    if (estVerrouillee(b) || b.etat === 'donnee' || b.etat === 'or') { SON.erreur(); return; }
    if (estBloquee(b)) { SON.erreur(); bulle(raisonBlocage(b)); return; }
    if (G.budget <= 0) { SON.erreur(); bulle(t('sachetVide')); return; }
    G.budget--; G.utilises++;
    const la = a.l, lb = b.l;
    b.l = la; b.etat = 'semee'; b.fanee = false;
    if (lb) { a.l = lb; a.etat = 'semee'; } else { a.l = ''; a.etat = 'vide'; }
    a.fanee = false;
    SON.seme();
    majCase(a); majCase(b);
    verifier(de); verifier(vers);
    if (!G.fini) choisirCase(vers);
    majBarre(); verifierDefaite();
  }
  function arroser(k) {
    if (!enJeu()) return;
    const c = G.cases.get(k);
    G.modeArrosoir = false;
    if (!c || G.arrosoirs <= 0) { majBarre(); return; }
    if (estVerrouillee(c) || c.etat === 'donnee' || c.etat === 'or') { SON.erreur(); majBarre(); return; }
    if (estBloquee(c)) { SON.erreur(); bulle(raisonBlocage(c)); majBarre(); return; }
    if (c.etat === 'semee') G.panier[c.l] = (G.panier[c.l] || 0) + 1;
    G.arrosoirs--;
    c.l = c.sol; c.etat = 'or'; c.fanee = false;
    SON.eau();
    const [px, py] = centre(c.el); jaillir(px, py, 14, ['#8fd3ff', '#4ab0f0', '#ffd94d'], { v: 120, haut: 90, forme: 'rond' });
    majCase(c); verifier(k);
    if (!G.fini) avancer(k);
    majPanier(); majBarre(); verifierDefaite();
  }
  // Action sur un obstacle (herbe, glace) ou un tas de feuilles
  function agirObstacle(c) {
    if (!enJeu()) return false;
    if (sousFeuilles(c)) { const w = G.mots[c.mots.find((wi) => G.mots[wi].feuilles > 0)]; soufflerTas(w); return true; }
    if (c.herbe) {
      c.herbe = false; SON.arrache();
      const [px, py] = centre(c.el); jaillir(px, py, 10, ['#3f9a35', '#5fc24a', '#8a5a33'], { v: 130, haut: 120, forme: 'petale' });
      majCase(c); return true;
    }
    if (c.gel) {
      c.gel--;
      const [px, py] = centre(c.el);
      if (c.gel) { SON.glace(); secouer(c.el); }
      else { SON.degel(); jaillir(px, py, 12, ['#cfefff', '#ffffff', '#7ac0e8'], { v: 120, haut: 60, forme: 'rond' }); }
      majCase(c); return true;
    }
    return false;
  }
  // Indice : la lettre de la prochaine case vide du mot apparaît un instant (coûte une graine)
  function indice(w) {
    if (!enJeu() || w.fini) return;
    if (w.feuilles) { soufflerTas(w); return; }
    const c = w.cles.map((k) => G.cases.get(k)).find((x) => x.etat === 'vide' && !x.herbe && !x.gel)
      || w.cles.map((k) => G.cases.get(k)).find((x) => x.etat === 'semee' && x.l !== x.sol);
    if (!c) return;
    if (G.budget <= 0) { SON.erreur(); bulle(t('sachetVide')); return; }
    G.budget--; G.utilises++;
    if (c.etat === 'semee') { G.panier[c.l] = (G.panier[c.l] || 0) + 1; c.l = ''; c.etat = 'vide'; c.fanee = false; majPanier(); }
    c.indice = true; SON.etoile(1);
    choisirCase(c.k); majCase(c); majBarre();
    w.elIcone.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.2)' }, { transform: 'scale(1)' }], { duration: 350 });
    setTimeout(() => { c.indice = false; if (G && G.cases.get(c.k) === c) majCase(c); }, 1800);
    verifierDefaite();
  }
  function soufflerTas(w) {
    if (!w.feuilles) return;
    w.feuilles--;
    SON.feuilles();
    const [px, py] = centre(w.elTas);
    jaillir(px, py, 10, ['#e8892a', '#d9541a', '#f2a63a', '#b84a14'], { v: 160, haut: 120, forme: 'petale' });
    if (!w.feuilles) {
      w.elTas.classList.add('souffle');
      setTimeout(() => { if (w.elTas) { w.elTas.classList.remove('souffle'); majTas(); } }, 500);
      w.cles.forEach((k) => majCase(G.cases.get(k)));
    } else majTas();
  }
  function secouer(el) { if (!el) return; el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }], { duration: 260 }); }

  // --- Vérification des mots ---
  function verifier(k) {
    const c = G.cases.get(k); if (!c) return;
    c.mots.forEach((wi) => {
      const w = G.mots[wi]; if (w.fini) return;
      const cs = w.cles.map((x) => G.cases.get(x));
      if (cs.some((x) => !x.l)) return;
      if (cs.every((x) => x.l === x.sol)) fleurir(w);
      else {
        cs.forEach((x) => { if (x.l !== x.sol && x.etat === 'semee') { x.fanee = true; majCase(x); } });
        SON.erreur(); bulle(t('motFaux'));
      }
    });
  }
  function fleurir(w) {
    w.fini = true;
    w.cles.forEach((k) => { const c = G.cases.get(k); c.fanee = false; majCase(c); });
    // Les bêtes qui visaient ce mot repartent
    G.betes.forEach((b) => { if (b.etat !== 'fuite' && ((b.cible && w.cles.indexOf(b.cible) >= 0) || (b.paire && b.paire.some((k) => w.cles.indexOf(k) >= 0)))) b.etat = 'fuite'; });
    SON.fleur();
    const nouveau = P.herbier.indexOf(w.m) < 0;
    if (nouveau) { P.herbier.push(w.m); G.nouvellesPlantes = (G.nouvellesPlantes || []).concat(w.m); }
    w.elIcone.classList.add('mot-fini');
    for (let i = 0; i < 3; i++) {
      const f = document.createElement('div'); f.className = 'fruit';
      f.innerHTML = dessin(w.m);
      f.style.left = [-10, 60, 25][i] + '%'; f.style.top = [-30, -24, -48][i] + '%';
      f.animate([{ transform: 'scale(0)', opacity: 0 }, { transform: 'scale(1.2)', opacity: 1 }, { transform: 'scale(1)', opacity: 1 }], { duration: 500, delay: i * 120, fill: 'backwards' });
      w.elIcone.appendChild(f);
    }
    w.cles.forEach((k, i) => {
      const c = G.cases.get(k);
      setTimeout(() => { if (c.el) { const [px, py] = centre(c.el); jaillir(px, py, 8, ['#ff8ab8', '#ffd94d', '#fff', '#c78ae0'], { v: 120, haut: 100, forme: 'petale' }); } }, i * 70);
    });
    bulle(t('motJuste', { mot: w.m }));
    if (G.mots.every((x) => x.fini)) { G.fini = true; G.attenteFin = 1.1; G.issue = 'victoire'; }
  }
  function verifierDefaite() {
    if (G.fini) return;
    if (G.budget > 0) return;
    // Encore un arrosoir et une case où l'utiliser : on laisse jouer
    if (G.arrosoirs > 0) return;
    G.fini = true; G.attenteFin = 0.9; G.issue = 'defaite';
    bulle(t('sachetVide'));
  }

  // ------------------------------------------------------------------------
  // Bêtes et saisons
  // ------------------------------------------------------------------------
  const hasard = (tab) => tab[Math.floor(Math.random() * tab.length)];
  function casesOccupables() {
    return [...G.cases.values()].filter((c) => c.etat === 'vide' && !estVerrouillee(c) && !estBloquee(c) && c.k !== G.sel);
  }
  function poserFeuilles() {
    const libres = G.mots.filter((w) => !w.fini && !w.feuilles);
    if (!libres.length) return;
    const w = hasard(libres);
    w.feuilles = outilActif('rateau') ? 1 : 2;
  }
  function poserGel() {
    const libres = casesOccupables().filter((c) => !c.herbe && !c.gel);
    if (!libres.length) return false;
    const c = hasard(libres); c.gel = outilActif('paille') ? 2 : 3;
    return c;
  }
  function centreCase(k) { const c = G.cases.get(k); return { x: c.x - G.dm.nx + 0.5, y: c.y - G.dm.ny + 0.5 }; }
  function ciblesEscargot() {
    return [...G.cases.values()].filter((c) => c.etat === 'semee' && !estVerrouillee(c) && !G.betes.some((b) => b.cible === c.k));
  }
  function pairesAbeille() {
    const res = [];
    G.mots.forEach((w) => {
      if (w.fini) return;
      for (let i = 0; i + 1 < w.cles.length; i++) {
        const a = G.cases.get(w.cles[i]), b = G.cases.get(w.cles[i + 1]);
        if (a.etat === 'semee' && b.etat === 'semee' && a.l !== b.l && !estVerrouillee(a) && !estVerrouillee(b)) res.push([a.k, b.k]);
      }
    });
    return res;
  }
  function nouvelleBete(type) {
    const el = document.createElement('div'); el.className = 'bete ' + type;
    el.innerHTML = type === 'esc' ? SVG.escargot : SVG.abeille;
    el.setAttribute('role', 'button'); el.setAttribute('aria-label', t(type === 'esc' ? 'escargotAria' : 'abeilleAria'));
    $('jardin').appendChild(el);
    return el;
  }
  function lancerEscargot() {
    const cibles = ciblesEscargot(); if (!cibles.length) return false;
    const c = hasard(cibles), p = centreCase(c.k);
    const gauche = p.x < G.dm.cols / 2;
    const b = { type: 'esc', cible: c.k, x: gauche ? -0.6 : G.dm.cols + 0.6, y: p.y, etat: 'avance', dir: gauche ? 1 : -1 };
    const dist = Math.hypot(p.x - b.x, p.y - b.y);
    b.v = dist / (G.def.esc[1] * (outilActif('clochette') ? 1.35 : 1));
    b.el = nouvelleBete('esc');
    G.betes.push(b);
    if (P.tutos.indexOf('escargotVu') < 0) { P.tutos.push('escargotVu'); bulle(t('escargotArrive')); }
    return true;
  }
  function lancerAbeille() {
    const paires = pairesAbeille(); if (!paires.length) return false;
    const pr = hasard(paires), a = centreCase(pr[0]), c = centreCase(pr[1]);
    const b = { type: 'abe', paire: pr, x: (a.x + c.x) / 2 + (Math.random() - 0.5) * 3, y: -1, tx: (a.x + c.x) / 2, ty: (a.y + c.y) / 2 - 0.35, etat: 'vole', pose: G.def.abe[1] };
    b.el = nouvelleBete('abe');
    G.betes.push(b);
    SON.bzz();
    return true;
  }
  function chasser(b) {
    if (!enJeu() || b.etat === 'fuite') return;
    b.etat = 'fuite'; G.chasses++;
    SON.chasse();
    if (b.el) {
      const [px, py] = centre(b.el); jaillir(px, py, 8, b.type === 'esc' ? ['#e09a4a', '#d9b68a'] : ['#ffcf1f', '#e8f7ff'], { v: 100, haut: 50, forme: 'etoile' });
      if (b.type === 'esc') b.el.innerHTML = SVG.coquille;
    }
    bulle(t(b.type === 'esc' ? 'escargotChasse' : 'abeilleChassee'));
  }
  function majBetes(dt) {
    const def = G.def;
    // Apparitions
    if (def.esc && (G.minut.esc -= dt) <= 0) G.minut.esc = lancerEscargot() ? def.esc[0] : 1.5;
    if (def.abe && (G.minut.abe -= dt) <= 0) G.minut.abe = lancerAbeille() ? def.abe[0] : 1.5;
    if (def.her && (G.minut.her -= dt) <= 0) {
      G.minut.her = def.her[0];
      const nh = [...G.cases.values()].filter((c) => c.herbe).length;
      if (nh < def.her[1]) {
        const libres = casesOccupables().filter((c) => !c.herbe && !c.gel);
        if (libres.length) { const c = hasard(libres); c.herbe = true; majCase(c); c.el.animate([{ transform: 'scale(.6)' }, { transform: 'scale(1)' }], { duration: 300 }); if (P.tutos.indexOf('herbeVue') < 0) { P.tutos.push('herbeVue'); bulle(t('herbePousse')); } }
      }
    }
    if (def.feu && (G.minut.feu -= dt) <= 0) {
      G.minut.feu = def.feu[1];
      if (!G.mots.some((w) => w.feuilles)) { poserFeuilles(); majTas(); G.cases.forEach(majCase); SON.feuilles(); bulle(t('ventFeuilles')); }
    }
    if (def.gel && (G.minut.gel -= dt) <= 0) {
      G.minut.gel = def.gel[1];
      const c = poserGel(); if (c) { majCase(c); SON.glace(); }
    }
    // Déplacements
    G.betes.forEach((b) => {
      if (b.type === 'esc') {
        if (b.etat === 'avance') {
          const c = G.cases.get(b.cible);
          if (!c || c.etat !== 'semee' || estVerrouillee(c)) { b.etat = 'fuite'; return; }
          const p = centreCase(b.cible), dx = p.x - b.x, dy = p.y - b.y, d = Math.hypot(dx, dy);
          b.dir = dx >= 0 ? 1 : -1;
          if (d < 0.12) {
            // Il grignote la graine : elle retourne au panier
            G.panier[c.l] = (G.panier[c.l] || 0) + 1;
            c.l = ''; c.etat = 'vide'; c.fanee = false;
            SON.croque(); bulle(t('escargotMange'));
            majCase(c); secouer(c.el); majPanier();
            b.etat = 'fuite';
          } else { b.x += dx / d * Math.min(d, b.v * dt); b.y += dy / d * Math.min(d, b.v * dt); }

      } else {
        if (b.etat === 'vole') {
          const dx = b.tx - b.x, dy = b.ty - b.y, d = Math.hypot(dx, dy);
          if (d < 0.05) { b.etat = 'pose'; }
          else { const v = 3.2; b.x += dx / d * Math.min(d, v * dt); b.y += dy / d * Math.min(d, v * dt); }
          if (!abeilleValide(b)) b.etat = 'fuite';
        } else if (b.etat === 'pose') {
          b.pose -= dt;
          b.x = b.tx + Math.sin(performance.now() / 160) * 0.12;
          if (!abeilleValide(b)) b.etat = 'fuite';
          else if (b.pose <= 0) {
            const a = G.cases.get(b.paire[0]), c = G.cases.get(b.paire[1]);
            const l = a.l; a.l = c.l; c.l = l; a.fanee = false; c.fanee = false;
            SON.bzz(); bulle(t('abeilleEchange'));
            majCase(a); majCase(c);
            a.el.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-30%)' }, { transform: 'translateY(0)' }], { duration: 350 });
            c.el.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(30%)' }, { transform: 'translateY(0)' }], { duration: 350 });
            verifier(a.k); verifier(c.k);
            b.etat = 'fuite';
          }
        } else { b.y -= 3 * dt; b.x += 1.2 * dt; }

      if (b.etat === 'fuite') b.vieFuite = (b.vieFuite || 0) + dt;
    });
    G.betes = G.betes.filter((b) => {
      const dehors = b.etat === 'fuite' && (b.vieFuite > 2.5 || b.x < -2 || b.x > G.dm.cols + 2 || b.y < -2);
      if (dehors && b.el) b.el.remove();
      return !dehors;
    });
  }
  function abeilleValide(b) {
    return b.paire.every((k) => { const c = G.cases.get(k); return c && c.etat === 'semee' && !estVerrouillee(c); }) && G.cases.get(b.paire[0]).l !== G.cases.get(b.paire[1]).l;
  }
  function dessinerBetes() {
    G.betes.forEach((b) => {
      if (!b.el) { b.el = nouvelleBete(b.type); if (b.etat === 'fuite' && b.type === 'esc') b.el.innerHTML = SVG.coquille; }
      const sx = b.type === 'esc' ? (b.dir < 0 ? -1 : 1) : 1;
      b.el.style.transform = 'translate(' + (b.x * S) + 'px,' + (b.y * S) + 'px) scaleX(' + sx + ')';
      b.el.classList.toggle('fuite', b.etat === 'fuite');
    });
  }

  // ------------------------------------------------------------------------
  // Boucle principale
  // ------------------------------------------------------------------------
  let dernier = performance.now();
  function boucle(now) {
    const dt = Math.min(0.05, (now - dernier) / 1000); dernier = now;
    dessinerParticules(dt);
    if (G && ecranActif === 'jeu') {
      if (enJeu()) majBetes(dt);
      else if (G.fini && !G.pause && G.attenteFin > 0) {
        G.attenteFin -= dt;
        if (G.attenteFin <= 0) { if (G.issue === 'victoire') victoire(); else defaite(); }
      }
      dessinerBetes();
    }
    requestAnimationFrame(boucle);
  }

  // ------------------------------------------------------------------------
  // Fins de niveau
  // ------------------------------------------------------------------------
  function fermerVoiles() { document.querySelectorAll('.voile').forEach((v) => v.classList.remove('actif')); }
  function boutonFin(cls, cleTexte, action) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ' + cls; b.textContent = t(cleTexte);
    b.addEventListener('click', () => { SON.clic(); action(); });
    return b;
  }
  function viderBetes() { G.betes.forEach((b) => b.el && b.el.remove()); G.betes = []; }

  function victoire() {
    G.attenteFin = 0; G.issue = 'fait';
    viderBetes();
    const i = G.n, et = etoilesCourantes();
    const score = 10 * G.cases.size + 40 * G.mots.length + 8 * G.budget + 15 * G.chasses;
    const ancienRecord = P.records[i], record = score > ancienRecord;
    const avantEtoiles = totalEtoiles();
    P.records[i] = Math.max(ancienRecord, score);
    P.etoiles[i] = Math.max(P.etoiles[i], et);
    P.debloque = Math.max(P.debloque, Math.min(NIVEAUX.length, i + 2));
    // Épouvantail de fin de jardin
    let nouvelEpou = -1;
    if ((i + 1) % 5 === 0) { const e = EPOUVANTAILS.findIndex((x) => x.jardin === (i + 1) / 5 - 1); if (e >= 0 && P.epous.indexOf(e) < 0) { P.epous.push(e); nouvelEpou = e; } }
    const nouveauxOutils = OUTILS.filter((o) => avantEtoiles < o.seuil && totalEtoiles() >= o.seuil);
    sauver(Math.min(NIVEAUX.length, i + 2));

  let glisse = null; // { type: 'panier' | 'case' | 'arrosoir', l, de, x0, y0, bouge }

  // Clavier
  function deplacerCurseur(dx, dy) {
    const c = G.cases.get(G.sel); if (!c) { choisirCase(premiereCaseVide()); return; }
    let mieux = null, md = 1e9;
    G.cases.forEach((o) => {
      const vx = o.x - c.x, vy = o.y - c.y;
      if (o === c) return;
      const av = vx * dx + vy * dy; if (av <= 0) return;
      const lat = Math.abs(vx * dy) + Math.abs(vy * dx);
      const d = av + lat * 2.5;
      if (d < md) { md = d; mieux = o; }
    });
    if (mieux) { G.dir = dx ? 'h' : 'v'; choisirCase(mieux.k); SON.clic(); }
  }
  document.addEventListener('keydown', (e) => {

      if ($('v-pause').classList.contains('actif')) { reprendre(); e.preventDefault(); return; }

      if (ecranActif !== 'titre' && !$('v-fin').classList.contains('actif')) { montrer('titre'); e.preventDefault(); }

    if (!enJeu()) return;

    if (e.target && e.target.closest && e.target.closest('button') && /^(Enter|NumpadEnter|Space)$/.test(e.code)) return;
    const fl = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.code];
    if (fl) { deplacerCurseur(fl[0], fl[1]); e.preventDefault(); return; }
    const c = G.cases.get(G.sel);
    if (e.code === 'Backspace' || e.code === 'Delete') {
      if (c && c.etat === 'semee') retirer(c.k);
      e.preventDefault(); return;
    }
    if (e.code === 'Space') {
      const b = G.betes.find((x) => x.etat !== 'fuite');
      if (b) chasser(b); else if (c) agirObstacle(c);
      e.preventDefault(); return;
    }
    if (e.code === 'Enter' || e.code === 'NumpadEnter') { if (c) agirObstacle(c); e.preventDefault(); return; }
    if (e.code === 'Digit1' || e.code === 'Numpad1') { if (c) arroser(c.k); e.preventDefault(); return; }
    if (e.code === 'Digit2' || e.code === 'Numpad2') {

    }
  });

  function jouer() {
    SON.clic();
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { lireProgression(); demarrerNiveau(Math.max(1, Math.min(NIVEAUX.length, Math.floor(+d.niveau || 1))) - 1); },
      onNouvelle: () => { demarrerNiveau(0); },
      onEffacer: () => { progressionVide(); demarrerNiveau(0); },
    });
  }
  $('b-jouer').addEventListener('click', jouer);
  $('b-niveaux').addEventListener('click', () => { SON.clic(); afficherNiveaux(); });
  $('b-herbier').addEventListener('click', () => { SON.clic(); afficherHerbier(); });
  $('b-cabane').addEventListener('click', () => { SON.clic(); afficherCabane(); });
  document.querySelectorAll('.b-retour').forEach((b) => { b.innerHTML = SVG.retour; b.addEventListener('click', () => { SON.clic(); montrer('titre'); }); });
  document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', () => { P.son = !P.son; reveillerAudio(); SON.clic(); majBoutonsSon(); sauverReglages(); }));
  $('b-pause').innerHTML = SVG.pause;
  $('b-pause').addEventListener('click', () => { SON.clic(); pause(); });
  $('b-reprendre').addEventListener('click', () => { SON.clic(); reprendre(); });
  $('b-recommencer').addEventListener('click', () => { SON.clic(); const i = G ? G.n : 0; if (G) viderBetes(); demarrerNiveau(i); });
  $('b-accueil').addEventListener('click', () => { SON.clic(); allerAccueil(); });
  $('b-compris').addEventListener('click', () => { SON.clic(); tutoSuivant(); });
  $('v-tuto').addEventListener('pointerup', (e) => { if (e.target === $('v-tuto')) tutoSuivant(); });

  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  // Clavier sur les graines du panier et l'arrosoir (Entrée ou Espace sur le bouton)
  $('panier').addEventListener('click', (e) => {
    if (e.detail !== 0 || !G) return;
    const b = e.target.closest('.tuile'); if (b && !b.disabled) semer(G.sel, b.dataset.l);
  });
  $('b-arrosoir').addEventListener('click', (e) => {
    if (e.detail !== 0 || !enJeu() || G.arrosoirs <= 0) return;
    G.modeArrosoir = !G.modeArrosoir; majBarre(); if (G.modeArrosoir) bulle(t('arrosoirMode'));
  });
  JEL_SAVE.surFermeture(() => { if (G && !G.fini) JEL_SAVE.save(JEU, donneesSauvegarde(G.n + 1)); });

  let attenteTaille = 0;
  window.addEventListener('resize', () => {
    tailleCanvas();
    clearTimeout(attenteTaille);
    attenteTaille = setTimeout(() => { if (G && ecranActif === 'jeu') { construireJardin(); majTout(); } }, 120);
  });
  I18N.surChangement(() => {
    majBoutonsSon();
    if (ecranActif === 'ecran-niveaux') afficherNiveaux();
    else if (ecranActif === 'ecran-herbier') afficherHerbier();
    else if (ecranActif === 'ecran-cabane') afficherCabane();
    if (G && ecranActif === 'jeu') { $('info-niveau').textContent = t('niveauN', { n: nb(G.n + 1), max: nb(NIVEAUX.length) }); }
  });

  lireProgression();
  majBoutonsSon();
  tailleCanvas();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
