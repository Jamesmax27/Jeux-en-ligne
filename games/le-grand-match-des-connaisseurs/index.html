    $('message-carte').textContent = ''; $('message-carte').className = '';
    // Visuel au-dessus des réponses.
    const v = $('visuel');
    v.innerHTML = '';
    if ((q.k === 'natInv' || q.k === 'intrus') && q.x) v.innerHTML = drapeau(q.x.pays, 'grand-drapeau');
    if (q.k === 'indices') {
      const l = document.createElement('div'); l.className = 'indices';
      q.x.ind.forEach((j, k) => {
        const s = document.createElement('span'); s.className = 'indice';
        if (j[0] === '@') s.innerHTML = drapeau(j.slice(1), 'dra');
        else if (j[0] === '#') s.innerHTML = maillotClub(j.slice(1));
        const tx = document.createElement('span'); tx.textContent = texteJeton(j); s.appendChild(tx);
        s.dataset.k = k;
        if (carte.progressif && k > 0) s.classList.add('cache');
        l.appendChild(s);
      });
      v.appendChild(l);
    }
    // Réponses.
    const zone = $('reponses');
    zone.innerHTML = '';
    zone.className = q.c.length === 3 ? 'trois' : q.k === 'ordre' ? 'ordre' : '';
    q.c.forEach((j, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'rep';
      const touche = document.createElement('span'); touche.className = 'touche'; touche.textContent = nb(i + 1); touche.setAttribute('aria-hidden', 'true');
      b.appendChild(touche);
      if (q.k === 'maillot') {
        b.classList.add('maillot-seul');
        b.insertAdjacentHTML('beforeend', maillotClub(j.slice(1)));
        b.setAttribute('aria-label', tr('rep.maillot', { n: i + 1 }));
      } else {
        if (j[0] === '@') b.insertAdjacentHTML('beforeend', drapeau(j.slice(1), 'dra'));
        if (j[0] === '#') b.insertAdjacentHTML('beforeend', maillotClub(j.slice(1)));
        const tx = document.createElement('span'); tx.className = 'txt'; tx.textContent = texteJeton(j);
        b.appendChild(tx);
      }
      b.addEventListener('click', () => toucherReponse(i));
      zone.appendChild(b);
    });
    focusRep = -1;
    // Outils de la question « ordre ».
    const out = $('ordre-outils');
    out.innerHTML = '';
    if (q.k === 'ordre' && carte.actif) {
      const ef = document.createElement('button'); ef.type = 'button'; ef.className = 'joker'; ef.textContent = tr('ordre.effacer');
      ef.addEventListener('click', () => { if (!carte || carte.rep !== undefined) return; carte.ordre = []; majOrdre(); Son.clic(); });
      out.appendChild(ef);
    }
    majJokers();
    majChronoAffichage();
  }
  function majOrdre() {
    document.querySelectorAll('#reponses .rep').forEach((b, i) => {
      const k = carte.ordre.indexOf(i);
      b.classList.toggle('choisi-ordre', k >= 0);
      let r = b.querySelector('.rang');
      if (k >= 0) { if (!r) { r = document.createElement('span'); r.className = 'rang'; b.appendChild(r); } r.textContent = nb(k + 1); }
      else if (r) r.remove();
    });
  }
  function toucherReponse(i) {
    if (!carte || !carte.actif || carte.rep !== undefined || enPause || voileOuvert()) return;
    if (carte.elimines.indexOf(i) >= 0) return;
    Son.activer();
    if (carte.q.k === 'ordre') {
      if (carte.ordre.indexOf(i) >= 0) return;
      carte.ordre.push(i); majOrdre(); Son.clic();
      if (carte.ordre.length === carte.q.c.length) repondre(carte.ordre.slice());
      return;
    }
    repondre(i);
  }
  function repondre(rep) {
    if (!carte || carte.rep !== undefined) return;
    carte.rep = rep;
    const f = carte.onReponse;
    if (f) f(rep);
  }
  // Correction : bonne réponse en vert, mauvaise en rouge.
  function corriger(q, rep, ok) {
    const btns = document.querySelectorAll('#reponses .rep');
    btns.forEach((b) => { b.disabled = true; });
    if (q.k === 'ordre') {
      q.b.forEach((idx, k) => {
        const b = btns[idx]; if (!b) return;
        let r = b.querySelector('.rang');
        if (!r) { r = document.createElement('span'); r.className = 'rang'; b.appendChild(r); }
        r.textContent = nb(k + 1); r.classList.add('vrai');
        b.classList.add(ok ? 'bon' : 'choisi-ordre');
      });
    } else {
      if (btns[q.b]) btns[q.b].classList.add('bon');
      if (!ok && typeof rep === 'number' && rep >= 0 && btns[rep]) btns[rep].classList.add('faux');
    }
    document.querySelectorAll('.indice.cache').forEach((s) => s.classList.remove('cache'));
    const m = $('message-carte');
    m.className = ok ? 'bon' : 'faux';
    m.textContent = ok ? tr('rep.bravo') : rep === -1 ? tr('rep.temps', { rep: texteBonne(q) }) : tr('rep.non', { rep: texteBonne(q) });
    if (carte) carte.chrono = null;
    $('jokers').querySelectorAll('button').forEach((b) => { b.disabled = true; });
    $('ordre-outils').innerHTML = '';
    majChronoAffichage();
  }
  function texteBonne(q) {
    if (q.k === 'ordre') return q.b.map((i) => texteJeton(q.c[i])).join(' → ');
    if (q.k === 'maillot') return tr('rep.maillotNum', { n: q.b + 1 });
    return texteJeton(q.c[q.b]);
  }

  // Chrono : il ne tourne ni en pause ni fenêtre ouverte.
  let dernierTemps = 0, dernierTic = -1;
  function majChrono(t) {
    const dt = dernierTemps ? Math.min(100, t - dernierTemps) : 0;
    dernierTemps = t;
    if (!carte || !carte.chrono || carte.rep !== undefined) return;
    if (enPause || voileOuvert() || carte.figer) return;
    carte.chrono.reste -= dt;
    // Indices qui se dévoilent un à un (tirs au but).
    if (carte.progressif) {
      const ecoule = carte.chrono.total - carte.chrono.reste;
      const n = Math.min(carte.q.x.ind.length, 1 + Math.floor(ecoule / carte.progressif));
      document.querySelectorAll('.indice').forEach((s, k) => { if (k < n && s.classList.contains('cache')) { s.classList.remove('cache'); Son.clic(); } });
    }
    const sec = Math.ceil(carte.chrono.reste / 1000);
    if (sec <= 3 && sec !== dernierTic && sec > 0 && carte.actif) { dernierTic = sec; Son.tic(); }
    if (carte.chrono.reste <= 0 && carte.actif && carte.chrono.local !== false) { carte.chrono.reste = 0; majChronoAffichage(); repondre(-1); return; }
    majChronoAffichage();
  }
  function majChronoAffichage() {
    const ch = $('chrono');
    const c = carte && carte.chrono;
    ch.style.visibility = c ? 'visible' : 'hidden';
    if (!c) return;
    const k = Math.max(0, c.reste / c.total);
    ch.firstElementChild.style.transform = `scaleX(${k})`;
    ch.classList.toggle('urgent', c.reste < 4000);
  }

  // Jokers du match.
  function majJokers() {
    const z = $('jokers');
    z.innerHTML = '';
    if (session !== 'solo' || !match || !carte || !carte.actif || match.tirs) return;
    const q = carte.q;
    if (match.cfg.j5) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'joker'; b.id = 'j-5050';
      b.innerHTML = '<span></span><b></b>';
      b.firstChild.textContent = tr('joker.f50'); b.lastChild.textContent = nb(match.j5);
      b.disabled = !match.j5 || q.k === 'ordre' || q.c.length < 3;
      b.setAttribute('aria-label', tr('joker.f50Aria', { n: match.j5 }));
      b.addEventListener('click', joker5050);
      z.appendChild(b);
    }
    if (match.cfg.jr) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'joker'; b.id = 'j-retrait';
      b.innerHTML = '<span></span><b></b>';
      b.firstChild.textContent = tr('joker.retrait'); b.lastChild.textContent = nb(match.jr);
      b.disabled = !match.jr;
      b.setAttribute('aria-label', tr('joker.retraitAria', { n: match.jr }));
      b.addEventListener('click', jokerRetrait);
      z.appendChild(b);
    }
  }
  function joker5050() {
    if (!match || !match.j5 || !carte || carte.rep !== undefined || carte.q.k === 'ordre' || enPause) return;
    match.j5--;
    const q = carte.q, faux = [];
    q.c.forEach((_, i) => { if (i !== q.b) faux.push(i); });
    melanger(faux);
    const n = q.c.length >= 4 ? 2 : 1;
    carte.elimines = faux.slice(0, n);
    document.querySelectorAll('#reponses .rep').forEach((b, i) => { if (carte.elimines.indexOf(i) >= 0) { b.classList.add('elimine'); b.disabled = true; } });
    Son.joker();
    majJokers();
  }
  function jokerRetrait() {
    if (!match || !match.jr || !carte || carte.rep !== undefined || enPause) return;
    match.jr--;
    Son.joker();
    toast(tr('joker.retraitFait'));
    nouvelleQuestion(true);
  }
  function melanger(l) { for (let i = l.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [l[i], l[j]] = [l[j], l[i]]; } return l; }
  function tirerDiff(mix) {
    let x = Math.random(), s = 0;
    for (let k = 0; k < 4; k++) { s += mix[k]; if (x < s) return k + 1; }
    for (let k = 3; k >= 0; k--) if (mix[k] > 0) return k + 1;
    return 1;
  }

  // ------------------------------------------------------------------
  //  Saison solo : un match
  // ------------------------------------------------------------------
  let session = null;      // 'solo' | 'entr' | 'ligne'
  let match = null;
  let enPause = false;
  let minuterie = 0;
  const attendre = (f, ms) => { clearTimeout(minuterie); minuterie = setTimeout(() => { if (enPause) { attendreApresPause = f; return; } f(); }, ms); };
  let attendreApresPause = null;
  const advCourant = () => {
    const n = match ? match.niv : 0, a = ADV[n % ADV.length];
    return { c1: a[0], c2: a[1], motif: a[2] };
  };

  function demarrerMatch(n, sansTuto) {
    quitterPartie();
    n = Math.max(0, Math.min(NIVEAUX.length - 1, n));
    const cfg = NIVEAUX[n];
    session = 'solo';
    match = {
      niv: n, cfg, sc: [0, cfg.dep || 0], enc: 0, p: 0, nous: true, qi: 0, deja: [], j5: cfg.j5, jr: cfg.jr,
      tirs: null, fini: false, enCours: true, serie: 0
    };
    const e = $('ecran-jeu');
    e.className = 'ecran';
    afficherEcran('jeu');
    vueTerrain.bx = vueTerrain.cible = 0.5; vueTerrain.nous = true;
    majTableau();
    majEtat();
    const suite = () => { if (APERCU) return; Son.sifflet(true); toast(tr('match.coupEnvoi', { adv: tr('adv.' + (n + 1)) })); attendre(() => nouvelleQuestion(), 700); };
    if (!sansTuto && cfg.nv && prog.tutos.indexOf(cfg.nv) < 0) montrerTuto(cfg.nv, () => { prog.tutos.push(cfg.nv); suite(); });
    else suite();
  }

  function majTableau() {
    const t = $('tableau');
    t.innerHTML = '';
    if (session === 'entr') {
      const s = document.createElement('div'); s.className = 'score-bloc';
      s.innerHTML = '<b></b><small></small>';
      s.firstChild.textContent = tr('entr.score', { ok: entr ? entr.ok : 0, n: entr ? entr.i : 0 });
      s.lastChild.textContent = entr ? tr('theme.' + entr.theme) : '';
      t.appendChild(s);
      return;
    }
    if (session !== 'solo' || !match) return;
    const adv = advCourant();
    const eq = (c, nom, droite) => {
      const d = document.createElement('div'); d.className = 'eq';
      d.innerHTML = maillot(c.c1, c.c2, c.motif);
      const s = document.createElement('span'); s.className = 'nom-eq'; s.textContent = nom;
      if (droite) d.insertBefore(s, d.firstChild); else d.appendChild(s);
      return d;
    };
    const s = document.createElement('div'); s.className = 'score-bloc';
    s.innerHTML = '<b></b><small></small>';
    s.firstChild.textContent = `${nb(match.sc[0])} – ${nb(match.sc[1])}`;
    s.lastChild.textContent = match.tirs ? tr('match.tirs') : (match.qi ? tr('match.minute', { n: Math.min(90, Math.round(90 * match.qi / match.cfg.Q)) }) : tr('match.debut'));
    t.append(eq(NOUS, tr('equipe.nous')), s, eq(adv, tr('adv.' + (match.niv + 1)), true));
  }
  function majEtat() {
    const e = $('etat-jeu');
    if (!match || match.tirs) { e.textContent = ''; return; }
    const tir = match.nous && match.p >= match.cfg.L;
    e.className = tir ? 'tir' : match.nous ? 'attaque' : 'defense';
    e.textContent = tir ? tr('etat.tir') : match.nous ? tr('etat.attaque', { n: match.cfg.L - match.p + 1 }) : tr('etat.defense');
    vueTerrain.nous = match.nous;
    vueTerrain.cible = posBallon(match.p, match.cfg.L);
  }

  function nouvelleQuestion(remplace) {
    if (!match || match.fini) return;
    if (!remplace && match.qi >= match.cfg.Q) { finTempsReglementaire(); return; }
    const cfg = match.cfg;
    const tir = match.nous && match.p >= cfg.L;
    let types = cfg.ty;
    if (tir && cfg.tirIdx) types = ['indices'];
    const d = tirerDiff(cfg.mix);
    const q = B.question(Math.random, { d, types, choix: cfg.ch, deja: match.deja });
    match.deja.push(q.s);
    const prefixe = tir ? tr('carte.tir') : !match.nous ? tr('carte.defense') : '';
    poserQuestion(q, {
      mode: 'solo', actif: true, prefixe,
      progression: tr('match.question', { n: match.qi + 1, total: cfg.Q }),
      chrono: cfg.chr ? { total: cfg.chr * 1000 + (q.k === 'ordre' || q.k === 'indices' ? 6000 : 0), reste: cfg.chr * 1000 + (q.k === 'ordre' || q.k === 'indices' ? 6000 : 0) } : null,
      onReponse: (rep) => resoudre(q, rep)
    });
    majTableau();
  }

  function resoudre(q, rep) {
    const ok = rep !== -1 && B.juste(q, rep);
    corriger(q, rep, ok);
    match.qi++;
    const L = match.cfg.L;
    let delai = ok ? 1100 : 1900;
    if (ok) Son.bon(); else Son.faux();
    if (match.nous) {
      if (ok) {
        if (match.p >= L) { butMarque(true); delai = 2300; }
        else { match.p++; match.serie++; }
      } else { match.nous = false; toast(tr('match.perdu')); }
    } else if (ok) { match.nous = true; toast(tr('match.recupere')); }
    else {
      if (match.p <= -L) { butMarque(false); delai = 2300; }
      else match.p = Math.max(-L, match.p - match.cfg.pr);
    }
    majEtat();
    majTableau();
    attendre(() => nouvelleQuestion(), delai);
  }

  function butMarque(pourNous) {
    if (pourNous) {
      match.sc[0]++;
      Son.but(); cri(tr('cri.but')); confettis(60);
      vueTerrain.flash = performance.now() + 1400; vueTerrain.flashCote = 1;
      match.nous = false; match.p = 0;
    } else {
      match.sc[1]++; match.enc++;
      Son.encaisse(); cri(tr('cri.encaisse'), true);
      vueTerrain.flash = performance.now() + 1400; vueTerrain.flashCote = -1;
      match.nous = true; match.p = 0;
    }
  }

  function finTempsReglementaire() {
    Son.sifflet(true);
    carte = null;
    if (match.sc[0] === match.sc[1]) { attendre(() => tirsAuBut(), 900); toast(tr('match.egalite'), 2600); return; }
    finMatch(match.sc[0] > match.sc[1], false);
  }

  // --- Tirs au but : on tire (devine le joueur), on arrête (bonne réponse = arrêt) ---
  function tirsAuBut() {
    match.tirs = { nous: [], eux: [], tour: 0 };
    $('ecran-jeu').classList.add('mode-tirs');
    redimensionner();
    majTableau();
    const suite = () => tirSuivant();
    if (prog.tutos.indexOf('tirs') < 0) montrerTuto('tirs', () => { prog.tutos.push('tirs'); suite(); });
    else suite();
  }
  function majTabTirs() {
    const z = $('tab-tirs');
    z.innerHTML = '';
    if (!match || !match.tirs) return;
    [['nous', tr('equipe.nous')], ['eux', tr('adv.' + (match.niv + 1))]].forEach(([k, nom]) => {
      const s = document.createElement('span');
      const n = document.createElement('span'); n.textContent = nom; s.appendChild(n);
      const l = match.tirs[k];
      for (let i = 0; i < Math.max(3, l.length); i++) { const p = document.createElement('i'); p.className = 'pt' + (i < l.length ? (l[i] ? ' oui' : ' non') : ''); s.appendChild(p); }
      z.appendChild(s);
    });
  }
  function tirSuivant() {
    const T = match.tirs;
    majTabTirs();
    vueCage.tir = null; vueCage.zones = false;
    // Fin des tirs : après 3 tirs chacun, ou en mort subite dès qu'une équipe mène à égalité de tirs.
    const bn = T.nous.filter(Boolean).length, be = T.eux.filter(Boolean).length;
    const nn = T.nous.length, ne = T.eux.length;
    if (nn === ne && nn >= 3 && bn !== be) { finMatch(bn > be, true); return; }
    if (nn === ne && nn < 3) {
      // Une équipe ne peut plus rattraper l'autre.
      if (bn > be + (3 - ne)) { finMatch(true, true); return; }
      if (be > bn + (3 - nn)) { finMatch(false, true); return; }
    }
    if (nn >= 10 && nn === ne) { finMatch(false, true); return; }
    const anous = nn === ne;
    $('statut-multi').textContent = anous ? tr('tirs.aToi') : tr('tirs.arrete');
    const cfg = match.cfg;
    const d = Math.max(1, tirerDiff(cfg.mix));
    const q = anous ? B.question(Math.random, { d, types: ['indices'], choix: Math.max(3, cfg.ch), deja: match.deja }) : B.question(Math.random, { d, types: cfg.ty, choix: cfg.ch, deja: match.deja });
    match.deja.push(q.s);
    const total = anous ? 16000 : (cfg.chr ? cfg.chr * 1000 : 20000);
    poserQuestion(q, {
      mode: 'solo', actif: true, prefixe: anous ? tr('carte.penalty') : tr('carte.arret'),
      progression: tr('tirs.numero', { n: Math.min(nn, ne) + 1 }),
      progressif: anous ? 3000 : 0,
      chrono: { total, reste: total },
      onReponse: (rep) => {
        const ok = rep !== -1 && B.juste(q, rep);
        corriger(q, rep, ok);
        if (ok) Son.bon(); else Son.faux();
        // Notre tir entre si la réponse est juste ; le leur, si la réponse est fausse.
        const butTir = anous ? ok : !ok;
        lancerTir(1 + Math.floor(Math.random() * 3), butTir);
        attendre(() => {
          if (butTir) { if (anous) { Son.but(); cri(tr('cri.but')); confettis(30); } else { Son.encaisse(); } }
          else { Son.arret(); cri(anous ? tr('cri.rate') : tr('cri.arret'), anous); }
          (anous ? T.nous : T.eux).push(butTir);
          majTabTirs();
          attendre(() => tirSuivant(), 1500);
        }, 800);
      }
    });
  }

  // --- Fin de match : bilan, étoiles, sauvegarde ---
  function finMatch(gagne, auxTirs) {
    match.fini = true; match.enCours = false;
    carte = null;
    clearTimeout(minuterie);
    const n = match.niv;
    let et = 0;
    if (gagne) et = auxTirs ? 1 : match.enc === 0 ? 3 : (match.sc[0] - match.sc[1] >= 2 ? 2 : 1);
    const avant = prog.e[n];
    if (gagne) {
      prog.e[n] = Math.max(prog.e[n], et);
      enregistrer(Math.min(NIVEAUX.length, n + 2));
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
      if (toutGagne()) { if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 }); }
      Son.victoire(); confettis(140);
    } else {
      enregistrer(n + 1);
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: n + 1 });
      Son.defaite();
    }
    $('fin-titre').textContent = gagne ? (n === NIVEAUX.length - 1 ? tr('fin.champion') : tr('fin.victoire')) : tr('fin.defaite');
    $('fin-etoiles').innerHTML = '';
    for (let k = 0; k < 3; k++) { const s = document.createElement('span'); s.textContent = '★'; if (k < et) s.className = 'oui'; $('fin-etoiles').appendChild(s); }
    $('fin-etoiles').setAttribute('aria-label', tr('fin.etoilesAria', { n: et }));
    $('fin-etoiles').hidden = false;
    const tirsTxt = auxTirs ? ' ' + tr('fin.auxTirs', { a: match.tirs.nous.filter(Boolean).length, b: match.tirs.eux.filter(Boolean).length }) : '';
    $('fin-score').textContent = `${nb(match.sc[0])} – ${nb(match.sc[1])}`;
    $('fin-detail').textContent = tr('fin.contre', { adv: tr('adv.' + (n + 1)) }) + tirsTxt + (gagne ? ' ' + tr(et === 3 ? 'fin.et3' : et === 2 ? 'fin.et2' : 'fin.et1') : ' ' + tr('fin.conseil'));
    $('fin-record').textContent = gagne && et > avant && avant > 0 ? tr('fin.record') : gagne && avant === 0 ? tr('fin.debloque', { n: Math.min(NIVEAUX.length, n + 2) }) : '';
    if (gagne && n === NIVEAUX.length - 1) $('fin-record').textContent = tr('fin.saisonFinie', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    boutonsFin(gagne && n < NIVEAUX.length - 1 ? ['suivant', 'rejouer', 'niveaux'] : gagne ? ['rejouer', 'niveaux', 'accueil'] : ['reessayer', 'niveaux', 'accueil']);
    setTimeout(() => ouvrirVoile('voile-fin'), gagne ? 900 : 600);
  }
  const ACTIONS_FIN = {
    suivant: () => demarrerMatch(match.niv + 1), rejouer: () => demarrerMatch(match.niv), reessayer: () => demarrerMatch(match.niv),
    niveaux: () => ouvrirNiveaux(), accueil: () => allerAccueil(),
    entrRejouer: () => lancerEntrainement(), themes: () => ouvrirEntrainement()
  };
  function boutonsFin(liste) {
    ['btn-fin-1', 'btn-fin-2', 'btn-fin-3'].forEach((id, k) => {
      const b = $(id), a = liste[k];
      b.hidden = !a;
      if (!a) return;
      b.textContent = tr('fin.btn.' + a);
      b.onclick = () => { Son.clic(); fermerVoile('voile-fin'); ACTIONS_FIN[a](); };
    });
  }

  // ------------------------------------------------------------------
  //  Entraînement par thème
  // ------------------------------------------------------------------
  let entr = null;
  const choixEntr = { theme: 'joueurs', diff: 1 };
  function ouvrirEntrainement() {
    quitterPartie();
    afficherEcran('entrainement');
    const g = $('grille-themes');
    g.innerHTML = '';

    const tour = e.ms ? tr('multi.mortSubite') : tr('multi.tir', { n: Math.min(e.r, B.TIRS), total: B.TIRS });
    if (e.ph === 'z') st.textContent = tour + ' · ' + (moi ? tr('multi.choisisZone') : tr('multi.choisit', { nom: nomSiege(e.t) }));
    else if (e.ph === 'q') st.textContent = tour + ' · ' + (moi ? tr('multi.reponds') : tr('multi.repond', { nom: nomSiege(e.t) }));
  }
  function montrerQuestionMulti(e) {
    const moi = partie && e.t === partie.siege && partie.monTour();
    debutTour = performance.now();
    const total = (R.delaiJoueur || 25000) - 1500;
    poserQuestion(e.q, {
      mode: 'multi', actif: !!moi,
      prefixe: tr('zone.' + e.z) + ' ·',
      progression: moi ? '' : tr('multi.repond', { nom: nomSiege(e.t) }),
      chrono: moi ? { total, reste: total, local: false } : null,
      onReponse: (rep) => {
        if (!partie || !partie.monTour()) return;
        partie.jouer({ t: 'r', i: rep });
        document.querySelectorAll('#reponses .rep').forEach((b) => { b.disabled = true; });
      }
    });
  }

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'salon': surSalon(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'refus': break;
      default: break;
    }
    majMulti();
    majSalon(false);
  }
  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); Son.arrive(); return; }
    const r = ev.raison;
    let cle = 'multi.personne';
    if (r === 'coupe' || r === 'cache') cle = 'multi.coupe';
    else if (r === 'hors-ligne') cle = 'multi.horsLigne';
    else if (r === 'site' || r === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
    if (partie && partie.phase === 'salon') ouvrirSalon();
  }
  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); ouvrirSalon(); }
    else if (partie.phase === 'pause') bandeau(tr('manche.attente'));
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else { bandeau(''); if (vue && vue.ph === 'q' && vue.q) montrerQuestionMulti(vue); else poserAttente(); }
  }
  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    ouvrirSalon();
  }
  function surManche() {
    vue = JSON.parse(JSON.stringify(partie.etat));
    hist = [];
    for (let s = 0; s < PLACES; s++) hist.push([]);
    fermerVoile('voile-salon');
    fermerVoile('voile-fin');
    resultatSalon = null; lancement = false;
    vueCage.tir = null;
    if (partie.siege >= 0) bandeau('');
    toast(tr('manche.nouvelle', { n: partie.manche || 1 }));
    Son.sifflet(true);
    poserAttente();
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }
  function surAction(ev) {
    const a = ev.action, apres = ev.apres;
    vue = JSON.parse(JSON.stringify(apres));
    if (a.t === 'z') {
      vueCage.tir = null;
      if (apres.q) montrerQuestionMulti(apres);
      Son.clic();
      return;
    }
    const der = apres.der;
    if (!der) return;
    // Montrer la bonne réponse sur la carte (comme si on avait vu la question).
    if (carte && carte.q && carte.q.s === der.q.s) { carte.rep = der.i; corriger(der.q, der.i, !!der.ok); }
    else { poserQuestion(der.q, { mode: 'multi', actif: false, prefixe: tr('zone.' + der.z) + ' ·' }); carte.rep = der.i; corriger(der.q, der.i, !!der.ok); }
    (hist[der.s] = hist[der.s] || []).push(!!der.ok);
    lancerTir(der.z, !!der.ok);
    // À mon tour de choisir la zone : la carte se vide après la correction.
    setTimeout(() => { if (session === 'ligne' && vue && vue.ph === 'z' && partie && partie.monTour()) poserAttente(); }, 2200);
    setTimeout(() => {
      if (der.ok) { Son.but(); if (ev.moi) { cri(tr('cri.but')); confettis(40); } }
      else Son.arret();
      if (ev.auto && ev.moi) toast(tr('multi.auto'));
    }, 520);
    majPlaces();
  }
  function surFin(res) {
    if (!res) return;
    const gagne = res.classement[0] === partie.siege;
    if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: partie.manche || 1 });
    resultatSalon = { res, manche: partie.manche || 1, gagne };
    if (gagne) { Son.victoire(); confettis(100); } else Son.defaite();
    if (partie.mode !== 'en-ligne') {
      // Partie sur l'appareil (réseau perdu) : classement montré, puis manche suivante.

    }
  }
  function surSieges() {
    const s = siegesActuels();
    s.forEach((x, i) => {
      const h = x.humain && !x.moi;
      if (humainsAvant[i] !== undefined && h !== humainsAvant[i]) {
        toast(h && !x.nom ? tr('multi.arriveAnonyme') : tr(h ? 'multi.arrive' : 'multi.part', { nom: x.nom || tr('place.joueur') }));
        if (h) Son.arrive();
      }
    });
    humainsAvant = s.map((x) => x.humain && !x.moi);
  }

  // Salon d'attente : le premier joueur arrivé lance la manche.
  const salonOuvert = () => $('voile-salon').classList.contains('actif');
  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); }
    fermerVoile('voile-fin');
    const r = resultatSalon;

        const rg = document.createElement('span'); rg.className = 'rangc'; rg.textContent = nb(k + 1);
        l.appendChild(rg);
        l.insertAdjacentHTML('beforeend', maillotSiege(s));
        const tg = document.createElement('div'); tg.className = 'tag';

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    const zp = $('salon-places');
    if (zp.children.length !== PLACES) {
      zp.innerHTML = '';
      for (let s = 0; s < PLACES; s++) { const d = document.createElement('div'); d.className = 'salon-place'; d.id = 'salon-place-' + s; d.innerHTML = maillotSiege(s) + '<div class="tag"></div>'; zp.appendChild(d); }
    }
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        remplirTag(d.querySelector('.tag'), role, nom + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
        d.setAttribute('aria-label', tr('salon.place.' + role, { couleur: tr('couleur.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomSiege(partie.chef) });
    } else if (partie.mode !== 'en-ligne') message = tr('salon.local');
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const b = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    b.hidden = !chef;
    b.disabled = lancement;
    const txt = tr(resultatSalon || (partie.manche || 0) > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (b.textContent !== txt) b.textContent = txt;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';

  }
  setInterval(() => { if (salonOuvert()) majSalon(false); }, 500);

  // ------------------------------------------------------------------
  //  Affiche (jaquette) et images du jeu
  // ------------------------------------------------------------------
  function joueurAffiche(c, x, y, s) {
    // Jeune joueur en pleine frappe, de trois quarts : jambe droite tendue vers le ballon.
    const peau = '#e9b48a', ombre = 'rgba(0,0,0,.25)';
    c.save(); c.translate(x, y);
    c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(s * 0.05, s * 0.58, s * 0.4, s * 0.05, 0, 0, Math.PI * 2); c.fill();
    // Traits de vitesse derrière la jambe de frappe.
    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = s * 0.012; c.lineCap = 'round';
    [0, 1, 2].forEach((k) => { c.beginPath(); c.arc(s * 0.2, s * 0.12, s * (0.3 + k * 0.05), -0.9, -0.2); c.stroke(); });
    c.lineCap = 'round'; c.lineJoin = 'round';
    // Jambe d'appui.
    c.strokeStyle = '#13213f'; c.lineWidth = s * 0.09;
    c.beginPath(); c.moveTo(-s * 0.05, s * 0.05); c.lineTo(-s * 0.1, s * 0.32); c.stroke();
    c.strokeStyle = '#ffcf3f'; c.lineWidth = s * 0.08; c.beginPath(); c.moveTo(-s * 0.1, s * 0.32); c.lineTo(-s * 0.12, s * 0.52); c.stroke();
    c.fillStyle = '#111'; c.beginPath(); c.ellipse(-s * 0.08, s * 0.55, s * 0.09, s * 0.04, 0, 0, Math.PI * 2); c.fill();
    // Jambe de frappe.
    c.strokeStyle = '#13213f'; c.lineWidth = s * 0.09;
    c.beginPath(); c.moveTo(s * 0.06, s * 0.04); c.lineTo(s * 0.28, s * 0.18); c.stroke();
    c.strokeStyle = '#ffcf3f'; c.lineWidth = s * 0.08; c.beginPath(); c.moveTo(s * 0.28, s * 0.18); c.lineTo(s * 0.46, s * 0.12); c.stroke();
    c.fillStyle = '#111'; c.beginPath(); c.ellipse(s * 0.5, s * 0.11, s * 0.08, s * 0.04, -0.3, 0, Math.PI * 2); c.fill();
    // Short.
    c.fillStyle = '#13213f'; c.beginPath(); c.moveTo(-s * 0.13, -s * 0.06); c.lineTo(s * 0.13, -s * 0.06); c.lineTo(s * 0.15, s * 0.1); c.lineTo(-s * 0.15, s * 0.1); c.closePath(); c.fill();
    // Maillot avec bande.
    c.fillStyle = '#ffcf3f'; c.beginPath(); c.moveTo(-s * 0.16, -s * 0.42); c.lineTo(s * 0.16, -s * 0.42); c.lineTo(s * 0.15, -s * 0.04); c.lineTo(-s * 0.15, -s * 0.04); c.closePath(); c.fill();
    c.fillStyle = '#13213f'; c.fillRect(-s * 0.155, -s * 0.26, s * 0.31, s * 0.06);
    c.strokeStyle = ombre; c.lineWidth = s * 0.01; c.stroke();
    // Bras : l'un levé pour l'équilibre, l'autre en arrière.
    c.strokeStyle = '#ffcf3f'; c.lineWidth = s * 0.07;
    c.beginPath(); c.moveTo(-s * 0.15, -s * 0.38); c.lineTo(-s * 0.34, -s * 0.5); c.stroke();
    c.beginPath(); c.moveTo(s * 0.15, -s * 0.38); c.lineTo(s * 0.3, -s * 0.26); c.stroke();
    c.strokeStyle = peau; c.lineWidth = s * 0.06;
    c.beginPath(); c.moveTo(-s * 0.34, -s * 0.5); c.lineTo(-s * 0.44, -s * 0.62); c.stroke();
    c.beginPath(); c.moveTo(s * 0.3, -s * 0.26); c.lineTo(s * 0.38, -s * 0.14); c.stroke();
    // Cou, puis tête : cheveux, oreille, visage tourné vers le ballon et sourire.
    c.fillStyle = peau; c.fillRect(-s * 0.035, -s * 0.47, s * 0.07, s * 0.07);
    c.fillStyle = peau; c.beginPath(); c.arc(s * 0.01, -s * 0.54, s * 0.12, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#0b1630'; c.lineWidth = s * 0.008; c.stroke();
    c.fillStyle = '#d9996e'; c.beginPath(); c.arc(-s * 0.06, -s * 0.53, s * 0.025, 0, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(255,120,120,.35)'; c.beginPath(); c.arc(s * 0.09, -s * 0.5, s * 0.022, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#3b2412'; c.beginPath(); c.arc(s * 0.0, -s * 0.58, s * 0.125, Math.PI * 1.02, Math.PI * 2.05); c.fill();
    c.beginPath(); c.moveTo(-s * 0.12, -s * 0.6); c.quadraticCurveTo(-s * 0.16, -s * 0.72, -s * 0.02, -s * 0.7); c.fill();
    c.fillStyle = '#1b1f2a'; c.beginPath(); c.arc(s * 0.045, -s * 0.555, s * 0.013, 0, Math.PI * 2); c.fill(); c.beginPath(); c.arc(s * 0.095, -s * 0.555, s * 0.013, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#3b2412'; c.lineWidth = s * 0.01; c.beginPath(); c.moveTo(s * 0.025, -s * 0.585); c.lineTo(s * 0.06, -s * 0.592); c.moveTo(s * 0.08, -s * 0.592); c.lineTo(s * 0.115, -s * 0.585); c.stroke();
    c.strokeStyle = '#7a3a1a'; c.lineWidth = s * 0.012; c.beginPath(); c.arc(s * 0.07, -s * 0.49, s * 0.035, 0.2, Math.PI - 0.2); c.stroke();
    // Contour lumineux du projecteur.
    c.restore();
  }
  function dessinerAffiche() {
    const { w, h } = ajuster(cvFond);
    const c = cvFond.getContext('2d');
    dessinerFond(true);
    // Faisceaux des projecteurs.
    [[0.12, 0.08], [0.88, 0.08]].forEach(([fx, fy]) => {
      const g = c.createLinearGradient(fx * w, fy * h, w * 0.5, h * 0.7);
      g.addColorStop(0, 'rgba(255,250,210,.35)'); g.addColorStop(1, 'rgba(255,250,210,0)');
      c.fillStyle = g; c.beginPath(); c.moveTo(fx * w, fy * h); c.lineTo(w * 0.25, h * 0.95); c.lineTo(w * 0.75, h * 0.95); c.closePath(); c.fill();
    });
    // But au fond à droite, gardien qui plonge.
    const gx = w * 0.5, gy = h * 0.42, gw = w * 0.46, gh = h * 0.2;
    c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(gx, gy, gw, gh);
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1;
    for (let x = gx; x <= gx + gw; x += gw / 14) { c.beginPath(); c.moveTo(x, gy); c.lineTo(x, gy + gh); c.stroke(); }
    for (let y = gy; y <= gy + gh; y += gh / 6) { c.beginPath(); c.moveTo(gx, y); c.lineTo(gx + gw, y); c.stroke(); }
    c.fillStyle = '#fff'; c.fillRect(gx - 5, gy - 5, gw + 10, 6); c.fillRect(gx - 5, gy - 5, 6, gh + 5); c.fillRect(gx + gw - 1, gy - 5, 6, gh + 5);
    c.save(); c.translate(gx + gw * 0.62, gy + gh * 0.55); c.rotate(-0.9);
    c.fillStyle = '#22c3a6'; c.fillRect(-w * 0.025, -h * 0.05, w * 0.05, h * 0.08);
    c.fillStyle = '#f1c7a0'; c.beginPath(); c.arc(0, -h * 0.065, w * 0.022, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#22c3a6'; c.lineWidth = w * 0.014; c.lineCap = 'round'; c.beginPath(); c.moveTo(-w * 0.02, -h * 0.04); c.lineTo(-w * 0.06, -h * 0.09); c.stroke();
    c.fillStyle = '#ffcf3f'; c.beginPath(); c.arc(-w * 0.065, -h * 0.095, w * 0.014, 0, Math.PI * 2); c.fill();
    c.restore();
    // Ballon en vol avec sa traînée, vers la lucarne.
    const bx = w * 0.66, by = h * 0.38;
    for (let k = 6; k > 0; k--) { c.fillStyle = `rgba(255,240,180,${0.05 * k})`; c.beginPath(); c.arc(bx - k * w * 0.035, by + k * h * 0.03, w * 0.035 * (1 - k * 0.08), 0, Math.PI * 2); c.fill(); }
    ballon(c, bx, by, w * 0.045, 0.6);
    // Héros : un jeune joueur qui vient de frapper, au premier plan.
    const s = h * 0.5;
    const halo = c.createRadialGradient(w * 0.34, h * 0.52, 10, w * 0.34, h * 0.52, s * 0.8);
    halo.addColorStop(0, 'rgba(255,230,150,.45)'); halo.addColorStop(1, 'rgba(255,230,150,0)');
    c.fillStyle = halo; c.fillRect(0, 0, w, h);
    joueurAffiche(c, w * 0.32, h * 0.56, s);
    // Premier plan : trophée doré coupé par le bord, confettis.
    trophee(c, w * 0.9, h * 0.72, w * 0.32);
    const al = graine(7);
    for (let i = 0; i < 70; i++) { c.fillStyle = ['#ffcf3f', '#ffffff', '#5ab0ff', '#ff6b5b', '#7bd389'][i % 5]; c.save(); c.translate(al() * w, al() * h * 0.7); c.rotate(al() * 6); c.fillRect(-4, -2, 8, 4); c.restore(); }
  }

  function ouvrirApercu(k) {
    // Une vraie partie, figée : 1 début de saison, 2 milieu de saison, 3 fin de saison (ordinateur).
    const n = k === 1 ? 0 : k === 2 ? 8 : 15;
    demarrerMatch(n, true);
    clearTimeout(minuterie);
    match.sc = k === 1 ? [1, 0] : k === 2 ? [1, 1] : [2, 1];
    match.qi = k === 1 ? 3 : k === 2 ? 6 : 10;
    match.p = k === 1 ? 1 : k === 2 ? 2 : match.cfg.L;
    match.nous = true;
    vueTerrain.bx = vueTerrain.cible = posBallon(match.p, match.cfg.L);
    const al = graine(k * 31);
    const types = k === 1 ? ['nat'] : k === 2 ? ['maillot'] : ['indices'];
    const q = B.question(al, { d: k === 1 ? 1 : k === 2 ? 2 : 3, types, choix: match.cfg.ch, deja: [] });
    match.deja.push(q.s);
    poserQuestion(q, {
      mode: 'solo', actif: true, prefixe: k === 3 ? tr('carte.tir') : '',
      progression: tr('match.question', { n: match.qi + 1, total: match.cfg.Q }),
      chrono: match.cfg.chr ? { total: match.cfg.chr * 1000, reste: match.cfg.chr * 600 } : null,
      onReponse: () => {}
    });
    carte.figer = true;
    $('toast').classList.remove('vu');
    majEtat(); majTableau();
    majChronoAffichage();
  }

  document.querySelectorAll('.retour').forEach((b) => b.addEventListener('click', () => { Son.clic(); allerAccueil(); }));
  document.querySelectorAll('#diffs .btn').forEach((b) => b.addEventListener('click', () => { choixEntr.diff = +b.dataset.diff; Son.activer(); Son.clic(); ouvrirEntrainement(); }));
  $('btn-lancer-entr').addEventListener('click', () => { Son.activer(); Son.clic(); lancerEntrainement(); });
  $('btn-son').addEventListener('click', basculerSon);
  $('btn-son-titre').addEventListener('click', basculerSon);
  $('btn-pause').addEventListener('click', () => { Son.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { Son.clic(); reprendre(); });
  $('btn-recommencer').addEventListener('click', () => {
    Son.clic(); fermerVoile('voile-pause'); enPause = false;
    if (session === 'solo' && match) demarrerMatch(match.niv, true);
    else if (session === 'entr') lancerEntrainement();
  });
  $('btn-accueil').addEventListener('click', () => { Son.clic(); allerAccueil(); });
  $('btn-lancer').addEventListener('click', () => {
    if (partie && !lancement && partie.lancerManche()) { lancement = true; Son.clic(); majSalon(true); }
  });
  $('btn-quitter-salon').addEventListener('click', () => { Son.clic(); allerAccueil(); });
  document.addEventListener('pointerdown', () => Son.activer(), { once: true });

  document.addEventListener('keydown', (ev) => {
    const k = ev.code;
    if (k === 'Escape' || k === 'KeyP') {
      if ($('voile-pause').classList.contains('actif')) reprendre();
      else if (ecranActuel === 'jeu' && !voileOuvert()) ouvrirPause();
      else if (ecranActuel !== 'titre' && ecranActuel !== 'jeu' && !voileOuvert()) allerAccueil();
      ev.preventDefault();
      return;
    }
    if (voileOuvert() || ecranActuel !== 'jeu') return;
    const m = /^(?:Digit|Numpad)([1-4])$/.exec(k);
    if (m) { toucherReponse(+m[1] - 1); ev.preventDefault(); return; }
    if (k === 'KeyJ') { joker5050(); return; }
    if (k === 'KeyR') { jokerRetrait(); return; }
    // Duel : zones au clavier (Q, W ou flèches puis Entrée).
    const btns = [...document.querySelectorAll('#reponses .rep:not(:disabled)')].length ? [...document.querySelectorAll('#reponses .rep')] : [...document.querySelectorAll('#zones .zone:not(:disabled)')];
    if (!btns.length) return;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowUp') {
      const sens = k === 'ArrowRight' || k === 'ArrowDown' ? 1 : -1;
      focusRep = (focusRep + sens + btns.length) % btns.length;
      try { btns[focusRep].focus(); } catch (e) { /* rien */ }
      ev.preventDefault();
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && ecranActuel === 'jeu' && (session === 'solo' || session === 'entr') && !voileOuvert()) ouvrirPause();
  });
  JEL_SAVE.surFermeture(() => { if (session === 'solo' && match && match.enCours && !match.fini) enregistrer(match.niv + 1); });
  window.addEventListener('resize', redimensionner);
  if (I.surChangement) I.surChangement(() => { majTitre(); majBoutonsSon(); remplirTitre(); });

  function remplirTitre() {
    const h = $('titre-jeu');
    h.textContent = '';
    const morceaux = tr('titre.jeu').split('|');
    morceaux.forEach((m, k) => { const s = document.createElement('span'); if (k === 1) s.className = 'or'; s.textContent = m; h.appendChild(s); if (k < morceaux.length - 1) h.appendChild(document.createElement('br')); });
  }

  // ------------------------------------------------------------------
  //  Démarrage
  // ------------------------------------------------------------------
  majBoutonsSon();
  remplirTitre();
  majTitre();
  if (AFFICHE) {
    $('app').style.display = 'none';
    document.querySelectorAll('.jel-langue').forEach((x) => { x.style.display = 'none'; });
    setTimeout(() => document.querySelectorAll('.jel-langue').forEach((x) => { x.style.display = 'none'; }), 300);
    dessinerAffiche();
    return;
  }
  dessinerFond(false);
  dessinerLogo();
  requestAnimationFrame(boucle);
  if (APERCU) {
    prog.tutos = BRUT.map((b) => b.nv).filter(Boolean).concat(['tirs']);
    ouvrirApercu(APERCU);
    return;
  }
  // Mode test (?debug=1 dans l'adresse du lanceur) : la question en cours est lisible.
  if (window.JEL_DEBUG) window.JEL_TEST = { carte: () => carte, match: () => match, prog };
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();

</script>
</body>
</html>
