      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  function remplirTag(tag, role) {
    if (tag.dataset.role === role) return;
    tag.dataset.role = role;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = tr('place.' + role);
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  // État montré par les cartes : celui d'avant la nuit tant qu'elle se joue.
  const etatCartes = () => (nuitAnim ? nuitAnim.avant : vue);

  function majPlaces() {
    const e = etatCartes(), sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !nuitAnim && !e.fini ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const viande = e ? e.vi[s] : 0, ch = e ? e.ch[s] : 0, la = e ? e.la[s] : 0;
      const ptsTxt = ICONES.v + '<span>' + nb(viande) + '</span>';
      const pts = d.querySelector('.pts');
      if (pts.dataset.v !== String(viande)) { pts.innerHTML = ptsTxt; pts.dataset.v = String(viande); }
      const miniCle = ch + ':' + la;
      const mini = d.querySelector('.mini');
      if (mini.dataset.v !== miniCle) {
        mini.innerHTML = '<span style="color:' + COUL_F[s] + '">' + ICONES.c + nb(ch) + '</span><span>' + ICONES.l + nb(la) + '</span>';
        mini.dataset.v = miniCle;
      }
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('morte', !!e && ch === 0);
      const cleDessin = (info.moi ? 'moi' + prog.chef : 'emb');
      const cv = d.querySelector('canvas.emb');
      if (cv.dataset.v !== cleDessin) { const c = cv.getContext('2d'); c.clearRect(0, 0, 80, 80); medaillon(c, s, 40, 40, 38, !!info.moi); cv.dataset.v = cleDessin; }
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role);
      d.setAttribute('aria-label', tr('place.aria.' + role, { tribu: tr('tribu.nom.' + s), viande: viande, chasseurs: ch }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  // Réserve de ta tribu (sous la ligne d'info).
  function majReserve() {
    const e = etatCartes(), moi = moiSiege(), boite = $('reserve');
    if (!e || moi < 0) { if (boite.textContent) boite.textContent = ''; return; }
    const reste = !nuitAnim && !e.fini ? e.rest[moi] : 0;
    const cle = [e.vi[moi], e.pe[moi], e.si[moi], e.la[moi], reste].join(':');
    if (boite.dataset.v === cle) return;
    boite.dataset.v = cle;
    boite.innerHTML = '';
    [['v', e.vi[moi], 'reserve.viande'], ['p', e.pe[moi], 'reserve.peaux'], ['s', e.si[moi], 'reserve.silex'], ['l', e.la[moi], 'reserve.lances'], ['c', reste, 'reserve.aPoser']].forEach((x) => {
      const sp = document.createElement('span');
      sp.innerHTML = ICONES[x[0]];
      sp.appendChild(document.createTextNode(nb(x[1])));
      sp.setAttribute('aria-label', tr(x[2], { n: x[1] }));
      sp.title = tr(x[2], { n: x[1] });
      boite.appendChild(sp);
    });
  }

  function peutJouer() {
    return !!partie && !enPause && !attenteTuto && !nuitAnim && !fileVue.length && partie.monTour() && !!vue && !vue.fini;
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    if (nuitAnim) {
      const m = nuitAnim.msgs, k = Math.max(0, Math.min(0.999, (performance.now() - nuitAnim.t0) / nuitAnim.D));
      return m[Math.min(m.length - 1, Math.floor(k * m.length))];
    }
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    if (e.fini) return tr('jeu.depart');
    const moi = partie.siege;
    if (moi < 0) return tr('multi.attente');
    if (e.ch[moi] === 0) return tr('tour.mort');
    const s = R.aQui(e);
    if (s === moi) return tr('tour.toi', { n: e.rest[moi] });
    if (e.rest[moi] === 0) return tr('tour.fini');
    return tr('tour.autre', { tribu: tr('tribu.nom.' + s) });
  }

  function majInfos() {
    let info = '';
    const e = etatCartes();
    const jour = e ? tr('jeu.jour', { n: Math.min(e.j, e.J), total: e.J }) : '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length }) + (jour ? ' · ' + jour : '');
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche }) + (jour ? ' · ' + jour : '');
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  // Panneau du bas : ce que rapporte la case choisie et ses dangers.
  function majPanneau() {
    const e = vue, moi = moiSiege(), boite = $('case-texte');
    const jouer = peutJouer();
    let lignes = [];
    if (e && !nuitAnim && choix >= 0 && choix < e.W * e.H) {
      const ch = e.c.charAt(choix), x = O.info(e, choix);
      if (!x) lignes.push(['b', tr('case.roc')],['', tr('case.rocher')]);
      else {
        const gain = tr('gain.' + x.r, { n: x.n }) + (x.abri ? ' · ' + tr('gain.abri') : '');
        lignes.push(['b', tr('case.' + ch) + ' · ' + gain]);
        if (e.zf[choix] === 2) lignes.push(['alerte', tr('case.cratere')]);
        else if (e.feu[choix] === 1) lignes.push(['alerte', tr('case.feu')]);
        else if (e.feu[choix] === 2) lignes.push(['alerte', tr('case.cendres')]);
        else {
          const libres = x.cap - O.occupants(e.pl, choix);
          lignes.push([libres ? '' : 'alerte', libres ? tr('case.places', { n: libres, cap: x.cap }) : tr('case.pleine')]);
          if (e.zf[choix] === 1) lignes.push(['alerte', x.abri ? tr('case.menaceAbri') : tr('case.menace')]);
          if (x.bruit) lignes.push(['', tr('case.bruyant')]);
          if (ch === 'f' && O.voisins(e, choix).some((k) => e.feu[k] === 1)) lignes.push(['alerte', tr('case.braises')]);
          if (x.abri) lignes.push(['bien', tr('case.abri')]);
          else if (moi >= 0 && e.pr.length) {
            const dest = O.prevoir(e, libres && jouer ? e.pl.concat([[choix, moi]]) : e.pl);
            const venus = e.pr.filter((p, k) => dest[k] === choix);
            if (venus.length) lignes.push(['alerte', tr(venus.some((p) => p.t === 'C') ? 'case.dangerC' : 'case.dangerR')]);
            else if (libres && jouer) lignes.push(['bien', tr('case.calme')]);
          }
          if (e.ar.some((a) => a[1] === choix && a[2] === e.j + 1)) lignes.push(['alerte', tr('case.traces')]);
        }
      }
    } else if (e && !nuitAnim) {
      lignes.push(['', tr('case.aide')]);
      if (e.met && !e.fini) {
        if (e.j < e.met.j) lignes.push(['alerte', tr('meteo.dans', { n: e.met.j - e.j })]);
        else if (e.zm >= 0) lignes.push(['alerte', tr('meteo.active')]);
      }
    } else if (nuitAnim) lignes.push(['', tr('nuit.titre')]);
    const html = lignes.map((l) => l[0] === 'b' ? '<b></b>' : '<span class="' + l[0] + '"></span>').join('');
    const cle = JSON.stringify(lignes);
    if (boite.dataset.v !== cle) {
      boite.dataset.v = cle;
      boite.innerHTML = html;
      Array.from(boite.children).forEach((el, k) => { el.textContent = lignes[k][1]; });
    }
    // boutons
    const bp = $('btn-poser'), bc = $('btn-camp');
    const okPoser = jouer && choix >= 0 && O.libre(e, choix);
    bp.disabled = !okPoser;
    const n = e && moi >= 0 ? O.artisanat(e, moi) : 0;
    const texteCamp = n > 0 ? tr('camp.lances', { n: n }) : tr('camp.repos');
    const cleB = texteCamp + '|' + tr('bouton.poser');
    if (bc.dataset.v !== cleB) {
      bc.dataset.v = cleB;
      bc.innerHTML = ICONES.camp; bc.appendChild(document.createTextNode(texteCamp));
      bp.innerHTML = ICONES.poser; bp.appendChild(document.createTextNode(tr('bouton.poser')));
    }
    bc.disabled = !jouer;
  }

  function majInterface() {
    majPlaces();
    majReserve();
    majInfos();
    majPanneau();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fini && !nuitAnim) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle() {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const t = performance.now();
    if (nuitAnim) {
      const k = (t - nuitAnim.t0) / nuitAnim.D;
      sonsNuit(nuitAnim, k);
      if (k >= 1) finirNuit();
    }
    dessinerJeu(t);
    majTemps();
    majCompte();
    majInterface();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    const base = nuitAnim ? nuitAnim.avant : vue;
    geo = geometrie(base, w, h, Math.max(8, Math.min(w, h) * 0.025));
    effetsJour = effetsJour.filter((f) => t - f.t0 < 1500);
    let sc;
    if (nuitAnim) sc = sceneNuit(nuitAnim, geo, t);
    else {
      const moi = moiSiege(), jouer = peutJouer();
      const valides = [];
      if (jouer) for (let i = 0; i < vue.W * vue.H; i++) if (O.libre(vue, i)) valides.push(i);
      const prevision = jouer && choix >= 0 && O.libre(vue, choix) ? vue.pl.concat([[choix, moi]]) : vue.pl;
      sc = sceneJour(vue, geo, t, { poses: poses, effets: effetsJour, choix: choix, choixCamp: choix === CAMP, valides: jouer ? valides : null, prevision: vue.fini ? null : prevision });
    }
    dessinerScene(c, sc, geo, t);
  }

  // ---------------------------------------------------------------------
  //  File d'affichage : les actions sont montrées une par une ; une nuit
  //  se joue en entier avant l'action suivante.
  // ---------------------------------------------------------------------

  function pomperVue() {
    clearTimeout(minuteurVue);
    if (nuitAnim || enPause || !partie) return;
    while (fileVue.length) {
      const ev = fileVue.shift();
      montrerAction(ev);
      if (nuitAnim) return;
      if (fileVue.length) { minuteurVue = setTimeout(pomperVue, 280); return; }
    }
    apresFile();
  }

  function montrerAction(ev) {
    const t = performance.now();
    debutTour = Date.now();
    dernierTic = -1;
    if (ev.apres.nuit !== ev.avant.nuit) {
      // La nuit tombe : on garde l'état d'avant (avec le dernier chasseur posé) le temps de l'animation.
      const avant = JSON.parse(JSON.stringify(ev.avant));
      if (ev.action === CAMP) avant.pl.push([-1, ev.siege]); else avant.pl.push([ev.action, ev.siege]);
      nuitAnim = { avant: avant, apres: JSON.parse(JSON.stringify(ev.apres)), t0: t, D: dureeNuit(ev.apres.ev), fait: {}, msgs: messagesNuit(ev.apres) };
      vue = nuitAnim.apres;
      choix = -1;
      sons.pose();
      if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
      relancerBoucle();
      return;
    }
    vue = JSON.parse(JSON.stringify(ev.apres));
    poses[vue.pl.length - 1] = t;
    const h = vue.pl[vue.pl.length - 1];
    if (h && geo) {
      if (h[0] >= 0) { const q = centre(vue, geo, h[0]); effetsJour.push({ k: 'anneau', x: q[0], y: q[1] + geo.s * 0.3, t0: t }); }
    }
    sons.pose();
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (choix >= 0 && choix !== CAMP && !O.libre(vue, choix)) choix = -1;
    if (partie && partie.phase === 'jeu' && !vue.fini && R.aQui(vue) === partie.siege && !ev.moi) sons.tour();
  }

  function finirNuit() {
    const an = nuitAnim;
    nuitAnim = null;
    poses = {};
    if (an && vue && !vue.fini && partie && R.aQui(vue) === partie.siege) sons.tour();
    pomperVue();
  }

  function apresFile() {
    if (finEnAttente) {
      const j = jeton;
      setTimeout(() => {
        if (j !== jeton || !partie || !finEnAttente || nuitAnim || fileVue.length) return;
        finEnAttente = false;
        if (partie.mode === 'en-ligne') afficherFinEnLigne(); else afficherFin();
      }, 500);
    }
  }

  // Ce que dit le message pendant la nuit.
  function messagesNuit(ap) {
    const m = [tr('nuit.tombe')];
    const vu = {};
    ap.ev.forEach((x) => {
      let t = '';
      if (x.k === 'mort') t = tr('nuit.mort.' + x.par, { tribu: nomTribu(x.p) });
      else if (x.k === 'tue') t = tr('nuit.tue', { tribu: nomTribu(x.p) });
      else if (x.k === 'lance') t = tr('nuit.lance', { tribu: nomTribu(x.p) });
      else if (x.k === 'repli') t = tr('nuit.repli');
      else if (x.k === 'feu' && !vu.feu) { vu.feu = 1; t = tr('nuit.feu'); }
      else if (x.k === 'pluie' && !vu.pluie) { vu.pluie = 1; t = tr('nuit.pluie'); }
      else if (x.k === 'fuite' && !vu['f' + x.p]) { vu['f' + x.p] = 1; t = tr('nuit.fuite', { tribu: nomTribu(x.p) }); }
      else if (x.k === 'impact') t = tr('nuit.impact');
      else if (x.k === 'ecrase') t = tr('nuit.ecrase');
      else if (x.k === 'arrive') t = tr('nuit.arrive.' + x.t);
      else if (x.k === 'lances' && x.p === moiSiege()) t = tr('nuit.lances', { n: x.n });
      if (t) m.push(t);
    });
    if (m.length === 1) m.push(tr('nuit.calme'));
    const moi = moiSiege();
    if (moi >= 0) {
      let v = 0;
      ap.ev.forEach((x) => { if (x.k === 'gain' && x.p === moi && x.r === 'v') v += x.n; });
      m.push(tr('nuit.bilan', { n: v }));
    }
    return m;
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': fileVue.push(ev); pomperVue(); break;
      case 'fin': surFin(); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.joueurArrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function viderVue() {
    fileVue.length = 0;
    clearTimeout(minuteurVue);
    nuitAnim = null;
    poses = {};
    effetsJour = [];
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    viderVue();
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let lancement = false;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;            // le résultat de la manche ouvrira le salon
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), cle = role + (info.chef ? '+chef' : '');
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44, !!info.moi);
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role);
        d.setAttribute('aria-label', tr('salon.place.' + role, { tribu: tr('tribu.nom.' + s) }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { tribu: tr('tribu.nom.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const estChef = enSalon && partie.estChef();
    bouton.hidden = !estChef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    viderVue();
    vue = JSON.parse(JSON.stringify(partie.etat));
    debutTour = Date.now();
    dernierTic = -1;
    choix = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.joueurArrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.joueurPart(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    finEnAttente = true;
    if (!nuitAnim && !fileVue.length) apresFile();
  }

  // Résultat vu par le joueur de l'appareil : gagné (premier, égalité comprise), survivants.
  function bilan(e) {
    const moi = partie ? partie.siege : -1;
    const res = R.fin(e) || { classement: [0, 1, 2, 3] };
    const premier = res.classement[0];
    const gagne = moi >= 0 && e.vi[moi] === e.vi[premier] && e.ch[moi] === e.ch[premier];
    const egalite = gagne && premier !== moi;
    return { moi: moi, gagne: gagne, egalite: egalite, res: res };
  }

  function afficherFinEnLigne() {
    const e = partie.etat;
    if (!e) return;
    const b = bilan(e);
    if (b.moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: b.gagne, level: e.n + 1 });
    remplirClassement(e, b.moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: b.gagne, manche: partie.manche };
    if (b.gagne) { sons.victoire(); braises(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  // Étoiles : seulement si ta tribu finit première ; 3 sans perte, 2 avec un chasseur perdu, 1 sinon.
  function etoilesPour(e, moi, gagne) {
    if (!gagne) return 0;
    const pertes = e.ini - e.ch[moi];
    return pertes === 0 ? 3 : pertes === 1 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const ordre = (R.fin(e) || { classement: [0, 1, 2, 3] }).classement;
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      const cle = e.vi[s] + ':' + e.ch[s];
      if (cle !== prec) { rang = k + 1; prec = cle; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; medaillon(cv.getContext('2d'), s, 30, 30, 28, s === moi);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('tribu.court.' + s) + ' · ' + tr('place.' + role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.innerHTML = ICONES.v; n.appendChild(document.createTextNode(nb(e.vi[s]) + ' '));
      const sp = document.createElement('span'); sp.innerHTML = ICONES.c; sp.style.color = COUL_F[s]; n.appendChild(sp); n.appendChild(document.createTextNode(nb(e.ch[s])));
      n.setAttribute('aria-label', tr('fin.ligneAria', { viande: e.vi[s], chasseurs: e.ch[s] }));
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const b = bilan(e), moi = b.moi, gagne = b.gagne;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, siegesActuels(), $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.points', { n: e.vi[moi] }) : '';
    $('fin-survie').textContent = moi >= 0 ? tr('fin.survie', { n: e.ch[moi], total: e.ini }) : '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(e, moi, gagne);
      const pts = moi >= 0 ? e.vi[moi] : 0;
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      const peinturesAvant = SEUILS_PEINTURES.filter((x, k) => peintureOuverte(k)).length;
      const chefsAvant = NIVEAUX_CHEFS.filter((x, k) => chefOuvert(k)).length;
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
      }
      const nouvPeinture = SEUILS_PEINTURES.filter((x, k) => peintureOuverte(k)).length > peinturesAvant;
      const nouveauChef = NIVEAUX_CHEFS.filter((x, k) => chefOuvert(k)).length > chefsAvant;
      $('fin-titre').textContent = gagne ? tr(b.egalite ? 'fin.egalite' : 'fin.gagne') : tr(moi >= 0 && e.ch[moi] === 0 ? 'fin.decimee' : 'fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      const extra = [];
      if (gagne && niveau === NIVEAUX.length) extra.push(tr('fin.dernier'));
      else if (debloque) extra.push(tr('fin.debloque', { n: niveau + 1 }));
      if (nouveauChef) extra.push(tr('fin.chef'));
      if (nouvPeinture) extra.push(tr('fin.peinture'));
      if (!gagne) extra.push(tr('fin.conseil'));
      $('fin-debloque').textContent = extra.join(' ');
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); braises(); } else sons.defaite();
    ouvrirVoile('voile-fin');  }

  // Compte à rebours avant la manche suivante (partie en ligne repassée en solo).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Pluie de braises dorées à la victoire.
  function braises() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: h + Math.random() * h * 0.3, vx: (Math.random() - 0.5) * 60, vy: -(140 + Math.random() * 220), r: 2 + Math.random() * 4, coul: ['#ffd36a', '#ff8a3d', '#ffb31a', COUL[i % 4]][i % 4] });
    let debut = 0, prec = 0;
    const j = ++braises.n;
    function pas(t) {
      if (j !== braises.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt + Math.sin(t / 300 + b.r) * 0.6; b.y += b.vy * dt;
        c.globalAlpha = Math.max(0, Math.min(1, b.y / h + 0.3));
        c.fillStyle = b.coul; rond(c, b.x, b.y, b.r); c.fill();
      });
      c.globalAlpha = 1;
      if (t - debut < 2800) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  braises.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux, grotte
  // ---------------------------------------------------------------------

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    viderVue();
    vue = null;
    choix = -1;
    bandeau('');
    fermerVoile('voile-pause');
    fermerVoile('voile-fin');
    fermerTuto();
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  function apercu(n) {
    const e = O.preparer(NIVEAUX[n - 1], PLACES);
    e.n = n - 1;
    O.debutJour(e);
    return e;
  }

  // Parcours solo : niveau n contre 3 tribus robots (force croissante).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    finEnAttente = false;
    viderVue();
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = apercu(niveau);
    choix = -1;
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const grille = $('grille-niveaux');
    grille.textContent = '';
    NIVEAUX.forEach((_, i) => {
      const n = i + 1, ouvert = n <= prog.debloque;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
      b.append(num, et);
      b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
      else b.disabled = true;
      grille.appendChild(b);
    });
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
  }

  function ouvrirGrotte() {
    const chefs = $('grille-chefs');
    chefs.textContent = '';
    NIVEAUX_CHEFS.forEach((nv, k) => {
      const b = document.createElement('button');
      b.type = 'button';
      const ouvert = chefOuvert(k);
      b.className = 'chef-btn' + (prog.chef === k ? ' choisi' : '');
      const cv = document.createElement('canvas'); cv.width = 108; cv.height = 108;
      const c = cv.getContext('2d');
      if (ouvert) chef(c, k, 54, 54, 52, 0);
      else { c.fillStyle = '#4f3d2e'; rond(c, 54, 54, 52); c.fill(); c.fillStyle = '#d8c5ab'; rr(c, 38, 52, 32, 26, 5); c.fill(); c.strokeStyle = '#d8c5ab'; c.lineWidth = 6; c.beginPath(); c.arc(54, 52, 10, Math.PI, 0); c.stroke(); }
      const nom = document.createElement('span');
      nom.textContent = ouvert ? tr('chef.' + k) : tr('chef.ferme', { n: nv });
      b.append(cv, nom);
      b.setAttribute('aria-pressed', prog.chef === k ? 'true' : 'false');
      b.setAttribute('aria-label', ouvert ? tr('chef.aria', { nom: tr('chef.' + k) }) : tr('chef.ferme', { n: nv }));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); prog.chef = k; sauverReglages(); ouvrirGrotte(); });
      else b.disabled = true;
      chefs.appendChild(b);
    });
    const pein = $('grille-peintures');
    pein.textContent = '';
    SEUILS_PEINTURES.forEach((seuil, k) => {
      const d = document.createElement('div');
      const ouvert = peintureOuverte(k);
      d.className = 'peinture' + (ouvert ? '' : ' ferme');
      const cv = document.createElement('canvas'); cv.width = 320; cv.height = 240;
      peinture(cv.getContext('2d'), k, 320, 240, ouvert);
      cv.setAttribute('aria-hidden', 'true');
      const nom = document.createElement('span');
      nom.textContent = ouvert ? tr('peinture.' + k) : tr('peinture.ferme', { n: seuil });
      d.append(cv, nom);
      pein.appendChild(d);
    });
    $('grotte-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('grotte');
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  let debutPause = 0;
  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    debutPause = performance.now();
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    if (nuitAnim) nuitAnim.t0 += performance.now() - debutPause;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    relancerBoucle();
    pomperVue();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés : une petite vallée jouée avec les vraies règles
  // ---------------------------------------------------------------------

  // Étapes : ['pose', case, tribu] (main si tribu 0), ['camp', tribu], ['refus', case], ['nuit'].
  const TUTOS = {
    base: { g: ['tpr'], etapes: [['pose', 0, 0], ['pose', 2, 1], ['pose', 1, 2], ['nuit']] },
    place: { g: ['tp'], etapes: [['pose', 0, 1], ['pose', 0, 2], ['refus', 0], ['pose', 1, 0], ['nuit']] },
    raptor: { g: ['ptp'], pr: [['R', '0,0']], etapes: [['pose', 2, 0], ['pose', 1, 1], ['pose', 1, 2], ['nuit']] },
    lance: { g: ['fts'], pr: [['R', '0,0']], ini: { pe: 1, si: 1 }, etapes: [['camp', 0], ['nuit'], ['pose', 1, 0], ['nuit']] },
    carnivore: { g: ['ptp'], pr: [['C', '0,0']], ini: { la: 1 }, etapes: [['pose', 1, 0], ['pose', 1, 1], ['nuit']] },
    grotte: { g: ['gtp'], pr: [['R', '0,2']], etapes: [['pose', 0, 0], ['pose', 1, 1], ['nuit']] },
    arrivee: { g: ['ptp'], ar: [['R', '0,2', 2]], etapes: [['pose', 0, 0], ['nuit']] },
    feu: { g: ['ffp'], feu: ['0,0'], etapes: [['pose', 1, 1], ['pose', 2, 0], ['nuit']] },
    geant: { g: ['tpm'], pr: [['R', '0,1']], ini: { la: 1 }, etapes: [['pose', 0, 1], ['pose', 2, 0], ['nuit']] },
    meteorite: { g: ['gp', 'tp'], met: { j: 1, c: [0] }, etapes: [['pose', 2, 1], ['pose', 0, 0], ['nuit']] },
    pluie: { g: ['fpt'], met: { j: 1, c: [] }, pluie: 1, etapes: [['pose', 0, 1], ['pose', 2, 0], ['nuit']] }
  };

  let tuto = null;            // { cle, e, etape, t0, nuit, apres }
  function nouvelleSceneTuto(d) {
    const e = O.preparer({ g: d.g, j: 9, ch: 3, pr: d.pr, ar: d.ar, feu: d.feu, met: d.met, pluie: d.pluie }, PLACES);
    if (d.ini) Object.keys(d.ini).forEach((k) => { e[k][0] = d.ini[k]; });
    O.debutJour(e);
    return e;
  }

  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    tuto = { cle: cle, d: d, e: nouvelleSceneTuto(d), etape: 0, t0: performance.now(), nuit: null, effets: [], poses: {}, apres: apres, id: 0 };
    const pas = () => {
      if (!tuto) return;
      const t = performance.now();
      imageTuto(t);
      tuto.id = requestAnimationFrame(pas);
    };
    tuto.id = requestAnimationFrame(pas);
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); terminerTuto(); };
    $('voile-tuto').onclick = () => { audio(); terminerTuto(); };
  }

  function fermerTuto() {
    if (tuto) cancelAnimationFrame(tuto.id);
    tuto = null;
    fermerVoile('voile-tuto');
    $('btn-tuto-ok').onclick = null;
    $('voile-tuto').onclick = null;
  }
  function terminerTuto() {
    const apres = tuto && tuto.apres;
    fermerTuto();
    if (apres) apres();
  }

  const DUREE_GESTE = 1250;
  function imageTuto(t) {
    const T = tuto, d = T.d, cv = $('tuto-demo'), c = cv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, 560, 360);
    const g = geometrie(T.e, 560, 360, 24);
    // avance des étapes
    const et = d.etapes[T.etape];
    if (T.nuit) {
      if (t - T.nuit.t0 > T.nuit.D) { T.e = T.nuit.apres; T.nuit = null; T.etape++; T.t0 = t; T.poses = {}; }
    } else if (!et) {
      if (t - T.t0 > 1500) { T.e = nouvelleSceneTuto(d); T.etape = 0; T.t0 = t; T.effets = []; T.poses = {}; }
    } else if (et[0] === 'nuit') {
      if (t - T.t0 > 500) {
        const avant = JSON.parse(JSON.stringify(T.e));
        const e2 = JSON.parse(JSON.stringify(T.e));
        O.nuit(e2, () => 0.3);
        T.nuit = { avant: avant, apres: e2, t0: t, D: dureeNuit(e2.ev), fait: {} };
      }
    } else {
      const mien = (et[0] === 'pose' && et[2] === 0) || et[0] === 'camp' || et[0] === 'refus';
      const duree = mien ? DUREE_GESTE : 650;
      if (t - T.t0 > duree) {
        if (et[0] === 'pose') { T.e.pl.push([et[1], et[2]]); T.poses[T.e.pl.length - 1] = t; }
        else if (et[0] === 'camp') T.e.pl.push([-1, et[1]]);
        else if (et[0] === 'refus') { const q = centre(T.e, g, et[1]); T.effets.push({ k: 'non', x: q[0], y: q[1], t0: t }); }
        T.etape++; T.t0 = t;
      }
    }
    let sc;
    if (T.nuit) sc = sceneNuit(T.nuit, g, t);
    else sc = sceneJour(T.e, g, t, { poses: T.poses, effets: T.effets, prevision: T.e.pl, choix: -1 });
    dessinerScene(c, sc, g, t);
    // la main qui montre le geste du joueur
    const et2 = d.etapes[T.etape];
    if (!T.nuit && et2 && ((et2[0] === 'pose' && et2[2] === 0) || et2[0] === 'camp' || et2[0] === 'refus')) {
      let cible;
      if (et2[0] === 'camp') cible = [g.camp.x + g.camp.h * 0.6, g.camp.y + g.camp.h * 0.5];
      else cible = centre(T.e, g, et2[1]);
      const q = Math.min(1, (t - T.t0) / (DUREE_GESTE * 0.6));
      const x = lerp(520, cible[0], q), y = lerp(350, cible[1], q);
      main(c, x, y, 1.5, q >= 1 ? Math.min(1, (t - T.t0 - DUREE_GESTE * 0.6) / 150) : 0);
    }
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#2d1c10'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function caseSous(px, py) {
    if (!vue || !geo) return -1;
    const cp = geo.camp;
    if (px >= cp.x && px <= cp.x + cp.w && py >= cp.y && py <= cp.y + cp.h) return CAMP;
    const col = Math.floor((px - geo.ox) / geo.s), lig = Math.floor((py - geo.oy) / geo.s);
    if (col < 0 || lig < 0 || col >= vue.W || lig >= vue.H) return -1;
    return lig * vue.W + col;
  }

  // Poser un chasseur sur la case a (ou au camp).
  function poser(a) {
    if (!partie || enPause || attenteTuto || nuitAnim) return;
    if (!peutJouer()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu' && vue && !vue.fini) { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (a !== CAMP && !O.libre(vue, a)) {
      sons.non();
      if (geo && a >= 0) { const q = centre(vue, geo, a); effetsJour.push({ k: 'non', x: q[0], y: q[1], t0: performance.now() }); }
      return;
    }
    if (partie.jouer(a)) { choix = -1; sons.clic(); }
  }

  // Un toucher choisit la case (et montre ses dangers) ; un 2e toucher y pose le chasseur.
  function toucher(a) {
    audio();
    if (a === CAMP) { if (choix === CAMP) poser(CAMP); else { choix = CAMP; sons.clic(); } return; }
    if (a < 0) { choix = -1; return; }
    if (choix === a && peutJouer() && O.libre(vue, a)) { poser(a); return; }
    choix = a;
    sons.clic();
  }

  const plateau = $('plateau');
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  plateau.addEventListener('pointerup', (ev) => {
    const p = point(ev);
    toucher(caseSous(p[0], p[1]));
  });

  function deplacerChoix(dx, dy) {
    if (!vue) return;
    if (choix === CAMP) { if (dy < 0) choix = (vue.H - 1) * vue.W; sons.clic(); return; }
    if (choix < 0) { choix = Math.floor(vue.H / 2) * vue.W + Math.floor(vue.W / 2); sons.clic(); return; }
    let c = choix % vue.W + dx, l = Math.floor(choix / vue.W) + dy;
    if (l >= vue.H) { choix = CAMP; sons.clic(); return; }
    c = Math.max(0, Math.min(vue.W - 1, c)); l = Math.max(0, Math.min(vue.H - 1, l));
    choix = l * vue.W + c;
    sons.clic();
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) { ev.preventDefault(); audio(); deplacerChoix(dirs[ev.code][0], dirs[ev.code][1]); }
    else if (ev.code === 'KeyC') { ev.preventDefault(); audio(); poser(CAMP); }
    else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (choix === -1) { deplacerChoix(0, 0); return; }
      poser(choix);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-grotte').addEventListener('click', () => { audio(); sons.clic(); ouvrirGrotte(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('grotte-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-poser').addEventListener('click', () => { audio(); if (choix >= 0 && choix !== CAMP) poser(choix); });
  $('btn-camp').addEventListener('click', () => { audio(); poser(CAMP); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.vi[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'titre') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');})();
</script>
</body>
