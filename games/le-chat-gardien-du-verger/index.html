<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +

    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },

    selecteurs.forEach(function (s) { s.maj(); });

  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).

    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);

    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }

        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {

      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

    try { texte = JSON.stringify(tout); } catch (e) { return false; }

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }

  }

  function texte(cle, vars) {

  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>

  h1 { margin: 4px 0 6px; font-size: clamp(1.7rem, 7vw, 2.5rem); line-height: 1.05; color: var(--cerise-f);

<body>
<canvas id="scene"></canvas>

<!-- Interface pendant la partie -->

      <div class="barre xp" id="barre-xp"><div class="rempli"></div></div>

  </div>
</div>

      <button id="b-niveaux" class="bouton petit" type="button" data-i18n="bouton.niveaux"></button>
      <button id="b-cabane" class="bouton petit" type="button" data-i18n="bouton.cabane"></button>

    </div>
  </div>
</div>

<!-- Sélection des niveaux -->
<div id="ecran-niveaux" class="ecran cache">
  <div class="panneau">

        c.strokeStyle = '#4aa3ff'; c.lineWidth = 3; c.lineCap = 'round'; [[-22, -2], [-24, 6], [-20, 14]].forEach(([a, b]) => { c.beginPath(); c.moveTo(a, b); c.lineTo(a + 9, b); c.stroke(); });

  // Fond du verger (pré-dessiné à chaque changement de taille ou de niveau)
  let fondPret = null;
  function preparerFond(saison, gr) {
    const cv = document.createElement('canvas');
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    const c = cv.getContext('2d');
    c.setTransform(DPR * K, 0, 0, DPR * K, 0, 0);
    const herbes = [['#86cf5c', '#6cb54a'], ['#7cc552', '#5ea83f'], ['#3f6b45', '#2c5236'], ['#b3b552', '#8e9a3f']][saison];
    const g = c.createLinearGradient(0, 0, 0, WH); g.addColorStop(0, herbes[0]); g.addColorStop(1, herbes[1]);
    c.fillStyle = g; c.fillRect(0, 0, WW, WH);
    // bandes de tonte
    c.fillStyle = 'rgba(255,255,255,.05)';
    for (let x = -WH; x < WW; x += 70) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 35, 0); c.lineTo(x + 35 + WH * 0.5, WH); c.lineTo(x + WH * 0.5, WH); c.fill(); }

    const fleurs = [['#fff', '#ffe04a'], ['#ffb3c7', '#fff'], ['#ffe04a', '#e8893a'], ['#b9a7ff', '#fff']];
    const n = Math.round(WW * WH / 900);
    for (let i = 0; i < n; i++) {
      const x = r() * WW, y = r() * WH;
      if (r() < 0.75) {
        c.strokeStyle = saison === 2 ? 'rgba(20,50,30,.5)' : 'rgba(40,100,30,.45)'; c.lineWidth = 1.4;
        c.beginPath(); c.moveTo(x - 3, y); c.lineTo(x - 4, y - 6); c.moveTo(x, y); c.lineTo(x, y - 8); c.moveTo(x + 3, y); c.lineTo(x + 4, y - 6); c.stroke();
      } else {
        const f = fleurs[Math.floor(r() * fleurs.length)];
        if (saison === 3 && r() < 0.6) { c.fillStyle = ['#d9622b', '#e8a23a', '#b8461c'][Math.floor(r() * 3)]; ellipse(c, x, y, 4, 2, r() * 3); c.fill(); continue; }
        c.fillStyle = f[0]; for (let k = 0; k < 5; k++) { rond(c, x + Math.cos(k * 1.26) * 2.6, y + Math.sin(k * 1.26) * 2.6, 2); c.fill(); }

    [HAUT - 6, WH - 14].forEach((yy) => {
      c.fillRect(0, yy - 12, WW, 4); c.fillRect(0, yy - 2, WW, 4);
      for (let x = 8; x < WW; x += 26) { c.beginPath(); c.rect(x, yy - 20, 7, 24); c.fill(); c.stroke(); }
    });
    return cv;
  }

  // =====================================================================
  //  État de la partie
  // =====================================================================
  let ecran = 'titre';  // titre, jeu, choix, pause, nouveau, fin, menu
  let jeu = null;
  let temps = 0;

  function nouveauJeu(n, demo) {
    const L = NIVEAUX[n];
    const tr = terrain();
    const r = graine(1000 + n * 97);
    const nbCerises = 7 + (demo ? 0 : prog.amelio.robustes);
    // Cerisiers : on tire des points bien espacés (meilleur candidat)
    const arbres = [];
    for (let i = 0; i < L.arbres; i++) {
      let mieux = null, md = -1;
      for (let k = 0; k < 40; k++) {
        const x = lerp(tr.x0 + 50, tr.x1 - 50, r()), y = lerp(tr.y0 + 140, tr.y1 - 30, r());
        let d = Infinity;
        arbres.forEach((a) => { d = Math.min(d, Math.hypot((a.x - x) * 0.8, a.y - y)); });
        d = Math.min(d, Math.hypot(x - (tr.x0 + tr.x1) / 2, (y - tr.y1 + 40)) * 1.4 + 20);
        d = Math.min(d, (x - tr.x0) * 1.5, (tr.x1 - x) * 1.5, (y - tr.y0 - 100) * 2.2);
        if (d > md) { md = d; mieux = { x, y }; }
      }
      const places = PLACES.map(() => ({ la: false, morsure: 0, prise: null }));
      for (let k = 0; k < nbCerises; k++) places[k].la = true;
      arbres.push({ x: mieux.x, y: mieux.y, places, miaou: 0, attaques: 0, lanterne: !!L.nuit });
    }
    arbres.sort((a, b) => a.y - b.y);
    // Haies, loin des arbres
    const haies = [];
    for (let i = 0; i < (L.haies || 0); i++) {
      let mieux = null, md = -1;
      for (let k = 0; k < 50; k++) {
        const hor = r() < 0.5, lg = 100 + r() * 50;
        const h = { x: lerp(tr.x0 + 70, tr.x1 - 70, r()), y: lerp(tr.y0 + 60, tr.y1 - 60, r()), w: hor ? lg : 24, h: hor ? 24 : lg };
        let d = Infinity;
        arbres.forEach((a) => { d = Math.min(d, Math.hypot(a.x - h.x, a.y - h.y) - lg / 2, Math.hypot(a.x - h.x, a.y - HAUTEUR_FEUILLAGE - h.y) - lg / 2); });
        haies.forEach((o) => { d = Math.min(d, Math.hypot(o.x - h.x, o.y - h.y) - lg); });
        d = Math.min(d, Math.hypot(h.x - (tr.x0 + tr.x1) / 2, h.y - (tr.y1 - 40)) - lg / 2);
        if (d > md) { md = d; mieux = h; }
      }
      if (md > 30) haies.push(mieux);
    }
    const total = arbres.length * nbCerises;
    jeu = {
      n, L, demo: !!demo, t: 0, fin: false, total,
      arbres, haies,
      chat: { x: (tr.x0 + tr.x1) / 2, y: tr.y1 - 40, dir: 1, pas: 0, bond: null, recharge: 0.5, vx: 0, vy: 0, ang: 0 },
      cible: null,
      oiseaux: [], etoiles: [], tombees: [], pelotes: [], chatons: [], epouvantails: [], lucioles: [], particules: [], anneaux: [], jets: [], flottants: [], nuages: [], retours: [],
      pouvoirs: {}, speciaux: {}, xp: 0, paliers: 0, choixEnAttente: 0,
      vague: 0, calme: 0, accu: 0, chef: null, chefVenu: false, vent: { force: 0, dir: 1, prochain: 6, duree: 0 },
      lumiere: 0, prochaineLuciole: 4, secousse: 0, perdues: 0, sauvees: 0, chasses: 0,
      timers: { clochette: 1, pelotes: 1, epouvantail: 1, arrosoir: 1, averse: 3 },
    };
    // Vagues
    const nbV = L.vagues || 3;
    const calme = 3.5;
    jeu.vagues = [];
    if (L.chef) jeu.vagues.push({ debut: 0, fin: 1e9 });
    else {
      const lg = (L.duree - calme * (nbV - 1)) / nbV;
      for (let i = 0; i < nbV; i++) jeu.vagues.push({ debut: i * (lg + calme), fin: i * (lg + calme) + lg });
    }
    alea = Math.random;
    fondPret = null;
    return jeu;
  }
  const cerisesEnJeu = () => {
    let n = 0;
    jeu.arbres.forEach((a) => a.places.forEach((p) => { if (p.la) n++; }));
    n += jeu.tombees.length;
    jeu.oiseaux.forEach((o) => { if (o.porte) n++; });
    if (jeu.chef && jeu.chef.porte) n++;
    return n;
  };
  const cerisesSauvees = () => { let n = 0; jeu.arbres.forEach((a) => a.places.forEach((p) => { if (p.la) n++; })); return n + jeu.tombees.length; };
  const niv = (cle) => jeu.pouvoirs[cle] || 0;

  // Caractéristiques du chat (talents et améliorations)
  function vitesseChat() { return 185 * (1 + 0.13 * niv('vitesse') + 0.06 * (jeu.demo ? 0 : prog.amelio.pattes)); }
  function rayonBond() { return 72 + 16 * niv('bond') + 8 * (jeu.demo ? 0 : prog.amelio.tigre); }
  function rechargeBond() { return 0.85 * (1 - 0.1 * niv('bond')) * (1 - 0.06 * (jeu.demo ? 0 : prog.amelio.tigre)); }
  function rayonAimant() { return 55 + 38 * niv('moustaches'); }
  function rayonLumiere() { return 125 + 16 * niv('moustaches') + (jeu.lumiere > 0 ? 90 : 0); }

  // ---------- Oiseaux ----------
  function placeDe(a, i) { return { x: a.x + PLACES[i][0], y: a.y - HAUTEUR_FEUILLAGE + PLACES[i][1] }; }
  function choisirPlace(o, prefArbre) {
    const libres = [];
    jeu.arbres.forEach((a, ia) => a.places.forEach((p, ip) => {
      if (p.la && !p.prise) {
        const pl = placeDe(a, ip);
        let poids = 1 / (1 + Math.hypot(pl.x - o.x, pl.y - o.y) / 300);
        if (ia === prefArbre) poids *= 6;
        libres.push({ ia, ip, poids });
      }
    }));
    if (!libres.length) return false;
    let tot = libres.reduce((s, l) => s + l.poids, 0), x = alea() * tot;
    let choix = libres[0];
    for (const l of libres) { x -= l.poids; if (x <= 0) { choix = l; break; } }
    o.ia = choix.ia; o.ip = choix.ip;
    jeu.arbres[choix.ia].places[choix.ip].prise = o;
    return true;
  }
  function libererPlace(o) {
    if (o.ia == null) return;
    const p = jeu.arbres[o.ia] && jeu.arbres[o.ia].places[o.ip];
    if (p && p.prise === o) { p.prise = null; if (p.la && p.morsure < 0.5) p.morsure = 0; }
    o.ia = null; o.ip = null;
  }
  function bord(xHint, yHint) {
    // point d'entrée ou de sortie juste hors de l'écran
    const tr = terrain();
    const cote = alea();
    if (cote < 0.4) return { x: -40, y: yHint != null ? yHint : lerp(tr.y0, tr.y1, alea()) };
    if (cote < 0.8) return { x: WW + 40, y: yHint != null ? yHint : lerp(tr.y0, tr.y1, alea()) };
    return { x: xHint != null ? xHint : lerp(0, WW, alea()), y: -40 };
  }
  function sortieProche(x, y) {
    const opts = [{ x: -60, y: y - 80 }, { x: WW + 60, y: y - 80 }, { x, y: -60 }];
    opts.sort((a, b) => dist2(a.x, a.y, x, y) - dist2(b.x, b.y, x, y));
    return opts[0];
  }
  function creerOiseau(type, opts) {
    opts = opts || {};
    const B = BETES[type];
    const tr = terrain();
    let p;
    if (opts.x != null) p = { x: opts.x, y: opts.y };
    else if (B.sol) p = { x: alea() < 0.5 ? -30 : WW + 30, y: lerp(tr.y0 + 120, tr.y1 - 20, alea()) };
    else p = bord();
    const o = {
      type, x: p.x, y: p.y, etat: B.sol ? 'court' : 'arrive', t: 0, mangees: 0, dir: 1, phase: alea() * 10,
      v: B.v * (jeu.L.vitesse || 1) * (1 + jeu.n * 0.012) * (opts.v || 1), retour: opts.retour != null ? opts.retour : (B.retour || 0),
      ia: null, ip: null, porte: false, vx: 0, vy: 0, groupe: opts.groupe, decal: opts.decal || 0,
    };
    if (!choisirPlace(o, opts.arbre)) { o.etat = 'part'; o.sortie = sortieProche(o.x, o.y); }
    jeu.oiseaux.push(o);
    return o;
  }
  function apparition() {
    const mix = jeu.L.mix, cles = Object.keys(mix);
    let tot = cles.reduce((s, k) => s + mix[k], 0), x = alea() * tot, type = cles[0];
    for (const k of cles) { x -= mix[k]; if (x <= 0) { type = k; break; } }
    const max = 13 + jeu.n;
    if (jeu.oiseaux.length >= max) return;
    if (type === 'etourneau') {
      // une nuée de 5 qui arrive ensemble
      const b = bord(); const g = {};
      const premier = creerOiseau('etourneau', { x: b.x, y: b.y, groupe: g });
      for (let i = 1; i < 5; i++) creerOiseau('etourneau', { x: b.x + (alea() - 0.5) * 40, y: b.y + (alea() - 0.5) * 40, groupe: g, arbre: premier.ia, decal: i });
    } else creerOiseau(type);
  }

  // Chasser un oiseau (il s'envole, sans être blessé)
  function effrayer(o, sx, sy, source) {
    if (o.etat === 'fuit') return false;
    if (o.type === 'ecureuil' && (o.etat === 'grimpe' || o.etat === 'mange') && source === 'bond') return false;
    // une cerise presque mangée, ou portée par une pie, tombe
    const pl = o.ia != null ? jeu.arbres[o.ia].places[o.ip] : null;
    const arbreO = o.ia != null ? jeu.arbres[o.ia] : null;
    const enHaut = o.type === 'ecureuil' && (o.etat === 'grimpe' || o.etat === 'mange');
    if (o.etat === 'mange' && pl && pl.la && pl.morsure >= 0.5 && jeu.n >= NIV_TOMBEES) {
      const pp = placeDe(jeu.arbres[o.ia], o.ip);
      pl.la = false; pl.morsure = 0;
      ajouterTombee(pp.x, pp.y, jeu.arbres[o.ia].y + 8 + alea() * 14);
    }
    libererPlace(o);
    if (o.porte) {
      o.porte = false;
      if (jeu.n >= NIV_TOMBEES) ajouterTombee(o.x, o.y, clamp(o.y + 40, terrain().y0 + 10, terrain().y1));
      else remettreCerise(o.x, o.y);
    }
    o.etat = 'fuit'; o.t = 0;
    const dx = o.x - sx, dy = o.y - sy, d = Math.hypot(dx, dy) || 1;
    o.vx = dx / d * 220 + (alea() - 0.5) * 60; o.vy = (dy / d) * 120 - 160; o.dir = o.vx < 0 ? -1 : 1;
    if (o.type === 'ecureuil') { o.vy = 0; o.vx = (o.x < WW / 2 ? -1 : 1) * 210; if (enHaut && arbreO) { o.x = arbreO.x; o.y = arbreO.y; } o.dir = o.vx < 0 ? -1 : 1; }
    // étoiles laissées
    const B = BETES[o.type];
    for (let i = 0; i < B.etoiles; i++) ajouterEtoile(o.x + (alea() - 0.5) * 16, o.y, o.y + 26 + alea() * 18);
    plumes(o.x, o.y, o.type);
    jeu.chasses++;
    if (!jeu.demo) { Son.piaille(); if (o.type === 'chouette') Son.hou(); }
    return true;
  }
  function plumes(x, y, type) {
    const col = { moineau: '#c9955f', pie: '#ffffff', corbeau: '#3a3d55', chouette: '#d9bf8f', etourneau: '#5a5180', ecureuil: '#e09050' }[type] || '#fff';
    for (let i = 0; i < 6; i++) jeu.particules.push({ type: 'plume', x, y, vx: (alea() - 0.5) * 120, vy: -alea() * 80, vie: 1.2 + alea() * 0.5, max: 1.6, rot: alea() * 6, c: col });
    for (let i = 0; i < 4; i++) jeu.particules.push({ type: 'etincelle', x, y, vx: (alea() - 0.5) * 200, vy: (alea() - 0.5) * 200, vie: 0.4, max: 0.4, c: '#fff6b0' });
  }
  function ajouterEtoile(x, y, sol) { jeu.etoiles.push({ x, y, sol, vy: -60, t: 0, rot: alea() * 6 }); }
  function ajouterTombee(x, y, sol) { jeu.tombees.push({ x, y, sol, vy: -40, t: 0 }); }
  function remettreCerise(x, y) {
    // la cerise retourne dans l'arbre le plus proche qui a une place libre
    let mieux = null, md = Infinity;
    jeu.arbres.forEach((a, ia) => a.places.forEach((p, ip) => {
      if (!p.la && !p.prise) { const pp = placeDe(a, ip); const d = dist2(pp.x, pp.y, x, y); if (d < md) { md = d; mieux = { a, p, pp }; } }
    }));
    if (mieux) { mieux.p.la = true; mieux.p.morsure = 0; }
    jeu.sauvees++;
    flottant(x, y - 10, T('flot.sauvee'), '#2f9a3a');
    if (!jeu.demo) Son.sauvee();
  }
  function cerisePerdue(x, y) {
    jeu.perdues++;
    jeu.secousse = Math.min(0.35, jeu.secousse + 0.18);
    for (let i = 0; i < 5; i++) jeu.particules.push({ type: 'jus', x, y, vx: (alea() - 0.5) * 90, vy: -alea() * 70, vie: 0.6, max: 0.6, c: '#d7263d' });
    if (!jeu.demo) Son.perdue();
  }
  function flottant(x, y, txt, c) { jeu.flottants.push({ x, y, txt, c, vie: 1.2 }); }

  // Le chef de volée (fin de saison)
  function arriveeChef() {
    const C = CHEFS[jeu.L.chef];
    jeu.chef = { cle: jeu.L.chef, x: WW / 2, y: -80, etat: 'entree', t: 0, ang: -Math.PI / 2, courage: C.courage, max: C.courage, invuln: 0, appel: 3, pique: 7, porte: false, dir: 1, ia: null, ip: null, mangees: 0 };
    jeu.chefVenu = true;
    banniere(T('banniere.chef.' + jeu.L.chef));
    if (!jeu.demo) Son.chef();
  }
  function toucherChef(sx, sy) {
    const c = jeu.chef;
    if (!c || c.invuln > 0 || c.etat === 'fuit' || c.etat === 'entree') return false;
    c.courage--; c.invuln = 1.1;
    libererPlace(c);
    if (c.porte) { c.porte = false; ajouterTombee(c.x, c.y, clamp(c.y + 40, terrain().y0 + 10, terrain().y1)); }
    plumes(c.x, c.y, CHEFS[c.cle].couleur);
    for (let i = 0; i < 3; i++) ajouterEtoile(c.x + (alea() - 0.5) * 30, c.y, c.y + 30 + alea() * 20);
    if (!jeu.demo) Son.touche();
    jeu.secousse = 0.15;
    if (c.courage <= 0) {
      c.etat = 'fuit'; c.t = 0; c.vx = (c.x < WW / 2 ? -1 : 1) * 200; c.vy = -220;
      jeu.oiseaux.forEach((o) => { if (o.etat !== 'fuit') effrayer(o, c.x, c.y, 'chef'); });
      banniere(T('banniere.chefPart'));
      if (!jeu.demo) Son.victoire();
    } else { c.etat = 'secoue'; c.t = 0; const dx = c.x - sx, dy = c.y - sy, d = Math.hypot(dx, dy) || 1; c.vx = dx / d * 260; c.vy = dy / d * 260 - 80; }
    return true;
  }

  // Tout ce qui peut chasser autour d'un point (onde de clochette, jet, pelote…)
  function chasserZone(x, y, r, source, filtre) {
    let n = 0;
    const r2 = r * r;
    jeu.oiseaux.forEach((o) => {
      if (o.etat === 'fuit' || o.x < -10 || o.x > WW + 10 || o.y < 0) return;
      if (dist2(o.x, o.y, x, y) <= r2 && (!filtre || filtre(o))) { if (effrayer(o, x, y, source)) n++; }
    });
    if (jeu.chef && dist2(jeu.chef.x, jeu.chef.y, x, y) <= (r + 14) * (r + 14) && (!filtre || filtre(jeu.chef))) toucherChef(x, y);
    return n;
  }
  function anneau(x, y, r, c) { jeu.anneaux.push({ x, y, r, vie: 0.5, max: 0.5, c: c || '#ffe36b' }); }

  // ---------- Pouvoirs ----------
  function gagnerPouvoir(cle) {
    if (SPECIAUX[cle]) { jeu.speciaux[cle] = true; if (cle === 'chorale') ajouterChaton(); }
    else if (cle === 'secours') { for (let i = 0; i < 2; i++) remettreCerise(jeu.chat.x, jeu.chat.y - 20); }
    else {
      jeu.pouvoirs[cle] = (jeu.pouvoirs[cle] || 0) + 1;
      if (cle === 'chaton') { while (jeu.chatons.length < nbChatons()) ajouterChaton(); }
      if (cle === 'epouvantail') placerEpouvantails();
    }
  }
  const nbChatons = () => (niv('chaton') ? P.chaton.nb[niv('chaton') - 1] : 0) + (jeu.speciaux.chorale ? 1 : 0);
  function ajouterChaton() { jeu.chatons.push({ x: jeu.chat.x - 20, y: jeu.chat.y + 10, dir: 1, pas: 0, bond: null, recharge: 1, lance: 2, cible: null }); }
  function placerEpouvantails() {
    const nb = niv('epouvantail') ? P.epouvantail.nb[niv('epouvantail') - 1] : 0;
    const tri = jeu.arbres.map((a, i) => ({ i, att: a.attaques + jeu.oiseaux.filter((o) => o.ia === i).length * 3 })).sort((a, b) => b.att - a.att);
    const anciens = jeu.epouvantails;
    jeu.epouvantails = [];
    for (let k = 0; k < nb && k < tri.length; k++) {
      const a = jeu.arbres[tri[k].i];
      const tr = terrain();
      const e = { arbre: tri[k].i, x: clamp(a.x + 44, tr.x0 + 10, tr.x1 - 10), y: clamp(a.y + 6, tr.y0 + 60, tr.y1), t: alea() * 2, agite: 0, ang: 0 };
      const ancien = anciens.find((x) => x.arbre === e.arbre);
      if (ancien) { e.t = ancien.t; e.ang = ancien.ang; } else poussiere(e.x, e.y - 20);
      jeu.epouvantails.push(e);
    }
    jeu.prochainEpouv = 10;
  }
  function poussiere(x, y) { for (let i = 0; i < 10; i++) jeu.particules.push({ type: 'nuage', x, y, vx: (alea() - 0.5) * 120, vy: (alea() - 0.5) * 80, vie: 0.6, max: 0.6, c: '#fff' }); }

  function cartesProposees() {
    const pool = [];
    ACTIFS.forEach((k) => { if (niv(k) < 3) pool.push(k); });
    PASSIFS.forEach((k) => { if (niv(k) < 3) pool.push(k); });
    const speciaux = Object.keys(SPECIAUX).filter((k) => !jeu.speciaux[k] && SPECIAUX[k].every((p) => niv(p) >= 3));
    // tant que le chat a peu de pouvoirs, les pouvoirs actifs passent d'abord
    const actifsTenus = ACTIFS.filter((k) => niv(k) > 0).length;
    const tirer = (liste) => liste.splice(Math.floor(alea() * liste.length), 1)[0];
    const res = [];
    if (speciaux.length) res.push(tirer(speciaux));
    const actifsLibres = pool.filter((k) => ACTIFS.indexOf(k) >= 0);
    if (res.length < 2 && actifsTenus < 2 && actifsLibres.length) { const k = tirer(actifsLibres); res.push(k); pool.splice(pool.indexOf(k), 1); }
    while (res.length < 2 && pool.length) res.push(tirer(pool));
    while (res.length < 2) res.push('secours');
    if (res[0] === res[1]) res[1] = 'secours';
    return res;
  }

  // =====================================================================
  //  Mise à jour de la partie
  // =====================================================================
  function majJeu(dt) {
    const J = jeu, L = J.L, tr = terrain();
    J.t += dt;
    if (J.secousse > 0) J.secousse = Math.max(0, J.secousse - dt);

    // --- Vagues et apparitions ---
    if (!J.fin) {
      const progres = L.chef ? clamp(J.t / 90, 0, 1) : clamp(J.t / L.duree, 0, 1);
      let enVague = -1;
      J.vagues.forEach((v, i) => { if (J.t >= v.debut && J.t < v.fin) enVague = i; });
      if (enVague > 0 && enVague !== J.vague - 1 && !J.demo) {
        J.vague = enVague + 1;
        banniere(T('banniere.vague', { n: J.vague, total: J.vagues.length }));
      } else if (enVague >= 0) J.vague = enVague + 1;
      // la démo de l'écran titre recommence quand la journée est finie
      if (J.demo && !L.chef && J.t >= L.duree) { nouveauJeu(J.n, true); return; }
      if (enVague >= 0) {
        let rythme = lerp(L.rythme[0], L.rythme[1], progres);
        if (L.chef && J.chef && J.chef.etat !== 'fuit') rythme *= 0.55;
        J.accu += rythme * dt;
        while (J.accu >= 1) { J.accu -= 1; apparition(); }
      }
      if (L.chef && !J.chefVenu && J.t > (J.demo ? 2 : 16)) arriveeChef();
      // victoire au temps (récolte)
      if (!L.chef && J.t >= L.duree && !J.demo) finNiveau(true);
    }

    // --- Vent ---
    if (L.vent) {
      const V = J.vent;
      V.prochain -= dt;
      if (V.duree > 0) { V.duree -= dt; V.force = lerp(V.force, 75, dt * 3); if (V.duree <= 0) V.prochain = 5 + alea() * 4; }
      else { V.force = lerp(V.force, 0, dt * 2); if (V.prochain <= 0) { V.duree = 3.2; V.dir = alea() < 0.5 ? -1 : 1; if (!J.demo) Son.vent(); } }
      if (V.force > 8 && alea() < dt * V.force * 0.25) J.particules.push({ type: 'feuille', x: V.dir > 0 ? -10 : WW + 10, y: lerp(tr.y0, tr.y1, alea()), vx: V.dir * (180 + alea() * 80), vy: (alea() - 0.5) * 40, vie: 3, max: 3, rot: alea() * 6, c: ['#d9622b', '#e8a23a', '#b8461c'][Math.floor(alea() * 3)] });
    }
    const vent = L.vent ? J.vent.force * J.vent.dir : 0;

    // --- Le chat ---
    majChat(dt, vent);

    // --- Pouvoirs ---
    majPouvoirs(dt, vent);

    // --- Oiseaux ---
    for (let i = J.oiseaux.length - 1; i >= 0; i--) {
      const o = J.oiseaux[i];
      if (majOiseau(o, dt, vent)) J.oiseaux.splice(i, 1);
    }
    // corbeaux qui reviennent
    for (let i = J.retours.length - 1; i >= 0; i--) {
      const r = J.retours[i]; r.t -= dt;
      if (r.t <= 0) { J.retours.splice(i, 1); if (!J.fin) creerOiseau('corbeau', { retour: r.retour }); }
    }
    if (J.chef) majChef(dt, vent);

    // --- Étoiles, cerises tombées, lucioles ---
    const ch = J.chat, aim = rayonAimant();
    for (let i = J.etoiles.length - 1; i >= 0; i--) {
      const e = J.etoiles[i];
      e.t += dt; e.rot += dt * 2;
      if (e.y < e.sol) { e.vy += 400 * dt; e.y = Math.min(e.sol, e.y + e.vy * dt); }
      const d = Math.hypot(ch.x - e.x, ch.y - 12 - e.y);
      if (d < aim && e.t > 0.3) { const k = Math.min(1, 420 * dt / d); e.x += (ch.x - e.x) * k; e.y += (ch.y - 12 - e.y) * k; e.sol = e.y; }
      if (d < 22 && e.t > 0.3) {
        J.etoiles.splice(i, 1); J.xp++;
        if (!J.demo) Son.etoile();
        for (let k = 0; k < 3; k++) J.particules.push({ type: 'etincelle', x: e.x, y: e.y, vx: (alea() - 0.5) * 140, vy: -alea() * 140, vie: 0.35, max: 0.35, c: '#ffe36b' });
        verifierPalier();
        continue;
      }
      if (e.t > 14) J.etoiles.splice(i, 1);
    }
    for (let i = J.tombees.length - 1; i >= 0; i--) {
      const c = J.tombees[i];
      c.t += dt;
      if (c.y < c.sol) { c.vy += 500 * dt; c.y = Math.min(c.sol, c.y + c.vy * dt); }
      if (Math.hypot(ch.x - c.x, ch.y - 8 - c.y) < 28 && !J.demo) { J.tombees.splice(i, 1); remettreCerise(c.x, c.y); continue; }
      if (J.demo && c.t > 3) { J.tombees.splice(i, 1); remettreCerise(c.x, c.y); continue; }
      if (c.t > 9 && !J.fin) { J.tombees.splice(i, 1); cerisePerdue(c.x, c.y); }
    }
    if (L.lucioles) {
      J.prochaineLuciole -= dt;
      if (J.prochaineLuciole <= 0 && J.lucioles.length < 3) { J.prochaineLuciole = 6 + alea() * 3; J.lucioles.push({ x: lerp(tr.x0 + 30, tr.x1 - 30, alea()), y: lerp(tr.y0 + 40, tr.y1 - 20, alea()), t: 0, ph: alea() * 6 }); }
      for (let i = J.lucioles.length - 1; i >= 0; i--) {
        const l = J.lucioles[i]; l.t += dt;
        l.x += Math.cos(l.t * 0.9 + l.ph) * 30 * dt; l.y += Math.sin(l.t * 1.3 + l.ph) * 24 * dt;
        if (Math.hypot(ch.x - l.x, ch.y - 15 - l.y) < 30) { J.lucioles.splice(i, 1); J.lumiere = 10; if (!J.demo) Son.luciole(); anneau(l.x, l.y, 60, '#d8ff7a'); continue; }
        if (l.t > 16) J.lucioles.splice(i, 1);
      }
    }
    if (J.lumiere > 0) J.lumiere -= dt;

    // --- Effets ---
    for (let i = J.particules.length - 1; i >= 0; i--) {
      const p = J.particules[i];
      p.vie -= dt; if (p.vie <= 0) { J.particules.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.type === 'plume') { p.vy += 40 * dt; p.vx *= 0.97; p.rot += dt * 3; }
      else if (p.type === 'eau' || p.type === 'jus') p.vy += 300 * dt;
      else if (p.type === 'petale' || p.type === 'feuille') { p.rot += dt * 2; p.vy += Math.sin(p.vie * 3) * 10 * dt; }
    }
    for (let i = J.anneaux.length - 1; i >= 0; i--) { const a = J.anneaux[i]; a.vie -= dt; if (a.vie <= 0) J.anneaux.splice(i, 1); }
    for (let i = J.jets.length - 1; i >= 0; i--) { const a = J.jets[i]; a.vie -= dt; if (a.vie <= 0) J.jets.splice(i, 1); }
    for (let i = J.flottants.length - 1; i >= 0; i--) { const f = J.flottants[i]; f.vie -= dt; f.y -= 30 * dt; if (f.vie <= 0) J.flottants.splice(i, 1); }
    for (let i = J.nuages.length - 1; i >= 0; i--) { const n = J.nuages[i]; n.vie -= dt; if (n.vie <= 0) J.nuages.splice(i, 1); }

    // --- Défaite ---
    if (!J.fin && cerisesEnJeu() === 0) {
      if (J.demo) { nouveauJeu(J.n, true); return; }
      finNiveau(false);
    }
  }

  function majChat(dt, vent) {
    const J = jeu, ch = J.chat, tr = terrain();
    ch.recharge -= dt;
    if (ch.bond) {
      const b = ch.bond; b.t += dt;
      const k = clamp(b.t / 0.22, 0, 1), e = 1 - (1 - k) * (1 - k);
      ch.x = lerp(b.x0, b.x1, e); ch.y = lerp(b.y0, b.y1, e);
      if (k >= 1) {
        ch.bond = null; ch.recharge = rechargeBond();
        if (b.chef) toucherChef(ch.x, ch.y); else if (b.cible && b.cible.etat !== 'fuit') effrayer(b.cible, ch.x, ch.y, 'bond');
        anneau(ch.x, ch.y - 10, 30, '#ffffff');
      }
      return;
    }
    // direction voulue : clavier, sinon doigt / souris, sinon pilote (démo)
    let dx = 0, dy = 0;
    if (touches.gauche) dx -= 1; if (touches.droite) dx += 1; if (touches.haut) dy -= 1; if (touches.bas) dy += 1;
    if (J.demo || auto) {
      const cible = cibleAuto();
      if (cible) J.cible = cible;
    }
    let vit = vitesseChat();
    if (dx || dy) { const d = Math.hypot(dx, dy); dx /= d; dy /= d; J.cible = null; }
    else if (J.cible) {
      const ex = J.cible.x - ch.x, ey = J.cible.y - ch.y, d = Math.hypot(ex, ey);
      if (d > 5) { dx = ex / d; dy = ey / d; vit = Math.min(vit, d / dt); } else if (!pointeurActif && !J.demo && !auto) J.cible = null;
    }
    ch.vx = lerp(ch.vx, dx * vit, Math.min(1, dt * 14)); ch.vy = lerp(ch.vy, dy * vit, Math.min(1, dt * 14));
    ch.x += (ch.vx + vent * 0.3) * dt; ch.y += ch.vy * dt;
    const v = Math.hypot(ch.vx, ch.vy);
    if (v > 10) { ch.pas += dt * v / 10; if (Math.abs(ch.vx) > 6) ch.dir = ch.vx < 0 ? -1 : 1; ch.ang = Math.atan2(ch.vy, ch.vx); }
    ch.x = clamp(ch.x, tr.x0, tr.x1); ch.y = clamp(ch.y, tr.y0 + 30, tr.y1);
    collisionHaies(ch, 14);
    // bond automatique sur l'oiseau le plus proche
    if (ch.recharge <= 0) {
      const R = rayonBond(), R2 = R * R;
      let mieux = null, md = R2, chef = false;
      J.oiseaux.forEach((o) => {
        if (o.etat === 'fuit' || o.x < tr.x0 - 10 || o.x > tr.x1 + 10 || o.y < tr.y0 - 40) return;
        if (o.type === 'ecureuil' && (o.etat === 'grimpe' || o.etat === 'mange')) return;
        const d = dist2(o.x, o.y, ch.x, ch.y - 12);
        if (d < md) { md = d; mieux = o; }
      });
      const c = J.chef;

      ajouterTombee(A[2].x + 20, A[2].y + 14, A[2].y + 14); J.tombees[0].t = 2;
    } else {
      J.t = 50; J.vague = 3; J.xp = 9; J.paliers = 6;
      J.pouvoirs = { chaton: 3, epouvantail: 2, arrosoir: 1, moustaches: 1, bond: 1 };
      J.chat.x = lerp(tr.x0, tr.x1, 0.45); J.chat.y = lerp(tr.y0, tr.y1, 0.68);
      collisionHaies(J.chat, 14);
      ajouterChaton(); ajouterChaton();
      J.chatons[0].x = J.chat.x + 110; J.chatons[0].y = J.chat.y - 20;
      J.chatons[1].x = J.chat.x - 120; J.chatons[1].y = J.chat.y + 10;
      placerEpouvantails();
      J.particules = [];
      placer('chouette', 0, 1); placer('chouette', 2, 3); placer('moineau', 1, 0); placer('ecureuil', 3, 5, 'mange'); placer('corbeau', 3, 1);
      enVol('chouette', tr.x1 - 90, tr.y0 + 80); enVol('chouette', tr.x0 + 80, tr.y0 + 140);
      J.lucioles.push({ x: J.chat.x + 60, y: J.chat.y - 50, t: 0, ph: 1 }, { x: tr.x1 - 160, y: tr.y1 - 60, t: 0, ph: 2 });
      J.lumiere = 6;
      jetEau(J.chat.x, J.chat.y - 14, -0.5, 155, 0.45);
      J.oiseaux.forEach((o) => { if (o.etat === 'fuit') { o.x = o.x; } });
      ajouterEtoile(J.chat.x + 40, J.chat.y - 20, J.chat.y - 20);
      J.etoiles.forEach((e) => { e.t = 1; });
      for (let k = 0; k < 4; k++) A[k].places[k + 2].la = false;
    }
    majHud();
    // coupe la barre de vague/récolte pour qu'elle reste fixe
  }
  // majHud fonctionne aussi pour les images : ecran 'apercu' n'est pas une démo

  // =====================================================================
  //  Boutons
  // =====================================================================
  function brancher() {
    document.querySelectorAll('.b-son').forEach((b) => b.appendChild(svg(ICONES.son)));
    document.querySelectorAll('.ico-cerise').forEach((s) => s.appendChild(svg(ICONES.cerise)));
    $('b-pause').appendChild(svg(ICONES.pause));
    ['b-niv-retour', 'b-cab-retour', 'b-col-retour'].forEach((id) => $(id).appendChild(svg(ICONES.retour)));
    majBoutonsSon();
    $('b-jouer').addEventListener('click', () => {
      Son.init(); Son.clic(); chargerProgression(); majBoutonsSon();
      if (!window.JEL_SAVE) { lancerNiveau(0); return; }
      window.JEL_SAVE.reprise({
        jeu: JEU,
        onContinuer: (d) => lancerNiveau(clamp(Math.floor(Number(d.niveau) || 1), 1, NIVEAUX.length) - 1),
        onNouvelle: () => lancerNiveau(0),
        onEffacer: () => { remettreAZero(); lancerNiveau(0); },
      });
    });
    $('b-niveaux').addEventListener('click', () => { Son.init(); Son.clic(); montrerNiveaux(); });
    $('b-cabane').addEventListener('click', () => { Son.init(); Son.clic(); montrerCabane(); });
    $('b-collection').addEventListener('click', () => { Son.init(); Son.clic(); montrerCollection(); });
    ['b-niv-retour', 'b-cab-retour', 'b-col-retour'].forEach((id) => $(id).addEventListener('click', () => { Son.clic(); montrerTitre(); }));
    $('b-pause').addEventListener('click', () => { Son.init(); Son.clic(); mettrePause(); });
    $('b-reprendre').addEventListener('click', () => { Son.clic(); reprendre(); });
    $('b-p-recommencer').addEventListener('click', () => { Son.clic(); if (jeu) lancerNiveau(jeu.n); });
    $('b-p-niveaux').addEventListener('click', () => { Son.clic(); if (jeu && !jeu.fin) sauver(jeu.n + 1); enPartie = false; montrerNiveaux(); $('hud').classList.add('cache'); });
    $('b-p-accueil').addEventListener('click', () => { Son.clic(); if (jeu && !jeu.fin) sauver(jeu.n + 1); enPartie = false; montrerTitre(); });
    $('b-compris').addEventListener('click', () => { Son.init(); Son.clic(); fermerNouveaute(); });
    $('b-fin-principal').addEventListener('click', () => {
      Son.clic();
      const a = $('b-fin-principal').dataset.action;
      if (a === 'suivant') lancerNiveau(jeu.n + 1);
      else if (a === 'bilan') montrerBilan();
      else lancerNiveau(jeu.n);
    });
    $('b-fin-rejouer').addEventListener('click', () => { Son.clic(); lancerNiveau(jeu.n); });
    $('b-fin-niveaux').addEventListener('click', () => { Son.clic(); $('hud').classList.add('cache'); montrerNiveaux(); });
    $('b-fin-cabane').addEventListener('click', () => { Son.clic(); $('hud').classList.add('cache'); montrerCabane(); });
    $('b-bilan-collection').addEventListener('click', () => { Son.clic(); montrerCollection(); });
    $('b-bilan-niveaux').addEventListener('click', () => { Son.clic(); montrerNiveaux(); });
    $('b-bilan-accueil').addEventListener('click', () => { Son.clic(); montrerTitre(); });
    document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', () => {
      prog.son = !prog.son; sauverReglage(); majBoutonsSon(); Son.init(); Son.clic();
    }));
  }
  function majBoutonsSon() {
    document.querySelectorAll('.b-son').forEach((b) => { b.classList.toggle('coupe', !prog.son); b.setAttribute('aria-pressed', prog.son ? 'false' : 'true'); });
  }

  // =====================================================================
  //  Démarrage
  // =====================================================================
  function cacherLangue() { document.querySelectorAll('jel-langue, .jel-langue').forEach((e) => { e.style.display = 'none'; }); }
  function demarrer() {
    try { const s = localStorage.getItem('fmg-chat-verger-son'); if (s === '0') prog.son = false; } catch (e) { /* stockage refusé */ }
    chargerProgression();
    redimensionner();
    window.addEventListener('resize', redimensionner);
    document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });
    if (AFFICHE) {
      tousEcrans.forEach((e) => $(e).classList.add('cache'));
      cacherLangue(); setTimeout(cacherLangue, 300);
      requestAnimationFrame(boucle);
      return;
    }
    brancher();
    if (APERCU) {
      ouvrirApercu(APERCU);
      tousEcrans.forEach((e) => $(e).classList.add('cache'));
      cacherLangue(); setTimeout(cacherLangue, 300);
      requestAnimationFrame(boucle);
      return;
    }
    if (window.JEL_SAVE) window.JEL_SAVE.surFermeture(() => { if (enPartie && jeu && !jeu.demo && !jeu.fin) sauver(jeu.n + 1); });
    if (DEBUG) {
      window.JEL_TEST = { lancer: (i) => lancerNiveau(i), auto: (v) => { auto = v !== false; }, etat: () => jeu && { n: jeu.n, t: jeu.t, cerises: cerisesEnJeu(), total: jeu.total, fin: jeu.fin, ecran, pouvoirs: jeu.pouvoirs, choix: jeu.choixEnAttente }, choisir: (i) => choisirCarte(i), compris: () => fermerNouveaute(), vite: (x) => { vitesseTest = x; } };
    }
    montrerTitre();
    requestAnimationFrame(boucle);
  }
  demarrer();
})();
</script>
