  "journal.fermee": "Page arrachée. Gagne la nuit {n} pour la lire.",
  "journal.p1": "La voiture est tombée en panne sur la route de la forêt. J'ai voulu couper à travers les arbres. Je ne retrouve plus la route.",
  "journal.p2": "Il y a des yeux dans les arbres. Ils clignent tous en même temps. Le feu est la seule chose qu'ils craignent.",
  "journal.p3": "Quelque chose rampe sous les fougères. Ça recule dès que la flamme grandit. Ça attend que je baisse la garde.",
  "journal.p4": "Les plus grands ne fuient pas au premier tison. Il faut frapper deux fois. J'ai compté mes bûches trois fois ce soir.",
  "journal.p5": "Ce matin, il y avait des silhouettes debout autour du camp. Elles n'avaient pas bougé. Je ne les ai jamais vues bouger.",
  "journal.p6": "Le tas de bois est presque vide. La forêt en laisse tomber au bord de la lumière, comme un appât.",
  "journal.p7": "Les papillons sont venus par centaines. Ils ne veulent pas de moi. Ils veulent le feu.",
  "journal.p8": "La pluie. Le feu siffle et se tasse. Dans l'éclair, j'ai vu tout ce qui m'entourait. Il y en avait beaucoup trop.",
  "journal.p9": "Sous une pierre du foyer, j'ai trouvé un carnet plus vieux que le mien. Quelqu'un a tenu ce feu avant moi.",
  "journal.p10": "Pas de lune cette nuit. Hors du cercle, il ne reste que les yeux. Je parle tout haut pour ne pas entendre les pas.",
  "journal.p11": "Certains ne viennent pas jusqu'à moi. Ils soufflent de loin un vent glacé qui vole ma flamme.",
  "journal.p12": "Une ombre aussi large que la clairière a couvert le ciel. Ses ailes portaient des yeux dessinés. Elle pondait en volant.",
  "journal.p13": "Le vieux carnet dit : « Le feu ne doit jamais s'éteindre. Pas pour te protéger, toi. Pour la garder, elle, dehors. »",
  "journal.p14": "De petites mains me volent mes bûches. Elles rient. On veut que je sois à court, j'en suis sûr.",
  "journal.p15": "Le brouillard monte du sol et mange la lumière. Le cercle rétrécit puis revient, comme une respiration.",
  "journal.p16": "L'orage a duré toute la nuit. Chaque éclair montrait les arbres un peu plus près qu'avant.",
  "journal.p17": "Les silhouettes ont des visages, maintenant. Toujours le même. Le mien, je crois.",
  "journal.p18": "Elle est là. La Chose dont parle le vieux carnet. Elle fait le tour de la clairière et ses bras cherchent le feu.",
  "journal.p19": "Plus de lune, une pluie qui ne s'arrête plus, aucun silence. Toute la forêt est venue. Je tiens encore.",
  "journal.p20": "Ses yeux se sont fermés un à un. À l'aube, j'ai vu la route, juste derrière les arbres. Elle y a toujours été.",

  "journal.page": "Page {n}",
  "journal.fermee": "Torn-out page. Win night {n} to read it.",
  "journal.p1": "The car broke down on the forest road. I tried to cut through the trees. Now I can't find the road again.",
  "journal.p2": "There are eyes in the trees. They all blink at the same time. Fire is the only thing they fear.",
  "journal.p3": "Something crawls under the ferns. It backs off whenever the flame grows. It's waiting for me to drop my guard.",
  "journal.p4": "The big ones don't run from the first firebrand. You have to hit them twice. I counted my logs three times tonight.",
  "journal.p5": "This morning, there were figures standing around the camp. They hadn't moved. I've never seen them move.",
  "journal.p6": "The woodpile is almost empty. The forest drops logs at the edge of the light, like bait.",
  "journal.p7": "The moths came by the hundreds. They don't want me. They want the fire.",
  "journal.p8": "Rain. The fire hisses and shrinks. In the lightning, I saw everything around me. There were far too many.",
  "journal.p9": "Under a stone of the fire pit, I found a notebook older than mine. Someone kept this fire before me.",
  "journal.p10": "No moon tonight. Outside the circle, only the eyes remain. I talk out loud so I can't hear the footsteps.",
  "journal.p11": "Some of them don't come all the way. They blow an icy wind from afar that steals my flame.",
  "journal.p12": "A shadow as wide as the clearing covered the sky. Its wings had eyes painted on them. It laid eggs as it flew.",
  "journal.p13": "The old notebook says: \"The fire must never go out. Not to protect you. To keep her outside.\"",
  "journal.p14": "Little hands are stealing my logs. They laugh. Someone wants me to run out, I'm sure of it.",
  "journal.p15": "The fog rises from the ground and eats the light. The circle shrinks, then comes back, like breathing.",
  "journal.p16": "The storm lasted all night. Every flash showed the trees a little closer than before.",
  "journal.p17": "The figures have faces now. Always the same one. Mine, I think.",
  "journal.p18": "She's here. The Thing from the old notebook. She circles the clearing and her arms reach for the fire.",
  "journal.p19": "No moon, rain that never stops, no silence. The whole forest has come. I'm still holding on.",
  "journal.p20": "Her eyes closed one by one. At dawn I saw the road, just behind the trees. It had always been there.",

  "journal.fermee": "Página arrancada. Gana la noche {n} para leerla.",
  "journal.p1": "El coche se averió en la carretera del bosque. Quise atajar entre los árboles. Ya no encuentro la carretera.",
  "journal.p2": "Hay ojos entre los árboles. Parpadean todos a la vez. El fuego es lo único que temen.",
  "journal.p3": "Algo se arrastra bajo los helechos. Retrocede en cuanto la llama crece. Espera a que baje la guardia.",
  "journal.p4": "Los más grandes no huyen con el primer tizón. Hay que golpear dos veces. Esta noche conté mis troncos tres veces.",
  "journal.p5": "Esta mañana había siluetas de pie alrededor del campamento. No se habían movido. Nunca las he visto moverse.",
  "journal.p6": "La pila de leña está casi vacía. El bosque deja caer troncos al borde de la luz, como un cebo.",
  "journal.p7": "Las polillas llegaron por cientos. No me quieren a mí. Quieren el fuego.",
  "journal.p8": "La lluvia. El fuego silba y se encoge. Con el relámpago vi todo lo que me rodeaba. Eran demasiados.",
  "journal.p9": "Bajo una piedra del fogón encontré una libreta más vieja que la mía. Alguien cuidó este fuego antes que yo.",
  "journal.p10": "No hay luna esta noche. Fuera del círculo solo quedan los ojos. Hablo en voz alta para no oír los pasos.",
  "journal.p11": "Algunos no llegan hasta mí. Soplan desde lejos un viento helado que me roba la llama.",
  "journal.p12": "Una sombra tan ancha como el claro cubrió el cielo. Sus alas tenían ojos dibujados. Ponía huevos mientras volaba.",
  "journal.p13": "La vieja libreta dice: «El fuego no debe apagarse nunca. No para protegerte a ti. Para dejarla a ella fuera».",
  "journal.p14": "Unas manitas me roban los troncos. Se ríen. Alguien quiere que me quede sin leña, estoy seguro.",
  "journal.p15": "La niebla sube del suelo y se come la luz. El círculo se encoge y luego vuelve, como una respiración.",
  "journal.p16": "La tormenta duró toda la noche. Cada relámpago mostraba los árboles un poco más cerca que antes.",
  "journal.p17": "Ahora las siluetas tienen cara. Siempre la misma. La mía, creo.",
  "journal.p18": "Está aquí. La Cosa de la vieja libreta. Da vueltas al claro y sus brazos buscan el fuego.",
  "journal.p19": "Sin luna, una lluvia que no para, ningún silencio. Todo el bosque ha venido. Sigo aguantando.",
  "journal.p20": "Sus ojos se cerraron uno a uno. Al amanecer vi la carretera, justo detrás de los árboles. Siempre estuvo ahí.",

  "nouv.rodeur.texte": "Avanzan rápido en la oscuridad y despacio en la luz. Un tizón los hace huir chillando.",
  "nouv.rampant.titre": "Los reptantes",
  "nouv.rampant.texte": "Huyen de la luz y se lanzan en cuanto la llama baja. Mantén el fuego grande o golpéalos cuando cargan.",

  "nouv.silhouette.titre": "Las siluetas",
  "nouv.silhouette.texte": "Solo se mueven en la sombra. El destello de un tizón las congela un instante. Nunca retroceden.",
  "nouv.lisiere.titre": "Troncos en el borde",
  "nouv.lisiere.texte": "Tienes poca leña. Caen troncos al borde de la luz: tócalos rápido para traerlos antes de que la oscuridad se los trague.",
  "nouv.papillon.titre": "Las polillas",
  "nouv.papillon.texte": "Atraídas por la llama, la ahogan si la alcanzan. Una explosión atrapa a varias de golpe.",
  "nouv.pluie.titre": "La lluvia",
  "nouv.pluie.texte": "La llama se consume más rápido. Los relámpagos lo iluminan todo y congelan lo que se esconde.",
  "nouv.sansLune.titre": "Noche sin luna",
  "nouv.sansLune.texte": "Ya no hay luz fuera y el círculo es más pequeño. Lejos del fuego solo ves los ojos.",
  "nouv.souffleur.titre": "Los sopladores",
  "nouv.souffleur.texte": "Se quedan al borde de la luz y soplan un viento helado que vacía tu llama. Derríbalos primero.",
  "nouv.mere.titre": "La madre de las polillas",
  "nouv.mere.texte": "Da vueltas al claro y pone polillas. Doce golpes para ahuyentarla.",
  "nouv.voleur.titre": "Los ladrones de troncos",
  "nouv.voleur.texte": "Corren hacia tu leña y se la llevan a la oscuridad. Si los derribas, sueltan el tronco.",
  "nouv.brouillard.titre": "La niebla",
  "nouv.brouillard.texte": "A oleadas, se come un tercio de tu luz.",
  "nouv.orage.titre": "La tormenta",

  "nouv.chose.titre": "La Cosa",

  "tuto.1": "Desliza desde el fuego hacia los ojos, o tócalos: un tizón sale volando en arco.",

  "journal.titre": "Diário do sobrevivente",
  "journal.page": "Página {n}",
  "journal.fermee": "Página arrancada. Vença a noite {n} para ler.",
  "journal.p1": "O carro quebrou na estrada da floresta. Tentei cortar caminho pelas árvores. Agora não acho mais a estrada.",
  "journal.p2": "Tem olhos nas árvores. Todos piscam ao mesmo tempo. O fogo é a única coisa que eles temem.",
  "journal.p3": "Alguma coisa rasteja embaixo das samambaias. Recua assim que a chama cresce. Está esperando eu baixar a guarda.",
  "journal.p4": "Os maiores não fogem do primeiro tição. É preciso acertar duas vezes. Contei minha lenha três vezes esta noite.",
  "journal.p5": "Hoje de manhã, havia vultos de pé em volta do acampamento. Não tinham se mexido. Nunca vi eles se mexerem.",
  "journal.p6": "A pilha de lenha está quase vazia. A floresta deixa cair toras na beira da luz, como uma isca.",
  "journal.p7": "As mariposas vieram às centenas. Não querem a mim. Querem o fogo.",
  "journal.p8": "A chuva. O fogo chia e encolhe. No relâmpago, vi tudo o que me cercava. Eram muitos demais.",
  "journal.p9": "Embaixo de uma pedra da fogueira, achei um caderno mais velho que o meu. Alguém cuidou deste fogo antes de mim.",
  "journal.p10": "Sem lua esta noite. Fora do círculo, só restam os olhos. Falo alto para não ouvir os passos.",
  "journal.p11": "Alguns não chegam até mim. De longe, sopram um vento gelado que rouba minha chama.",
  "journal.p12": "Uma sombra do tamanho da clareira cobriu o céu. As asas tinham olhos desenhados. Ela botava ovos enquanto voava.",
  "journal.p13": "O caderno velho diz: \"O fogo nunca pode apagar. Não para proteger você. Para manter ela lá fora.\"",
  "journal.p14": "Mãozinhas roubam minha lenha. Elas riem. Alguém quer que eu fique sem nada, tenho certeza.",
  "journal.p15": "A neblina sobe do chão e come a luz. O círculo encolhe e depois volta, como uma respiração.",
  "journal.p16": "A tempestade durou a noite inteira. Cada relâmpago mostrava as árvores um pouco mais perto que antes.",
  "journal.p17": "Os vultos têm rosto agora. Sempre o mesmo. O meu, eu acho.",
  "journal.p18": "Ela está aqui. A Coisa do caderno velho. Ela dá voltas na clareira e os braços dela procuram o fogo.",
  "journal.p19": "Sem lua, uma chuva que não para, nenhum silêncio. A floresta inteira veio. Eu ainda aguento.",
  "journal.p20": "Os olhos dela fecharam um por um. No amanhecer, vi a estrada, logo atrás das árvores. Ela sempre esteve lá.",

  "nouv.rodeur.titre": "Os rondadores",
  "nouv.rodeur.texte": "Avançam rápido no escuro e devagar na luz. Um tição faz eles fugirem gritando.",
  "nouv.rampant.titre": "Os rastejantes",
  "nouv.rampant.texte": "Fogem da luz e atacam assim que a chama baixa. Mantenha o fogo grande ou acerte eles quando avançarem.",
  "nouv.grand.titre": "Os grandes rondadores",
  "nouv.grand.texte": "São precisos dois tições para espantá-los. Cada golpe faz eles recuarem.",
  "nouv.silhouette.titre": "Os vultos",
  "nouv.silhouette.texte": "Só se mexem na sombra. O clarão de um tição congela eles por um instante. Nunca recuam.",
  "nouv.lisiere.titre": "Toras na beira",
  "nouv.lisiere.texte": "Você tem pouca lenha. Caem toras na beira da luz: toque nelas rápido para trazê-las antes que o escuro as engula.",
  "nouv.papillon.titre": "As mariposas",
  "nouv.papillon.texte": "Atraídas pela chama, elas a abafam se chegarem até ela. Uma explosão pega várias de uma vez.",
  "nouv.pluie.titre": "A chuva",
  "nouv.pluie.texte": "A chama derrete mais rápido. Os relâmpagos iluminam tudo e congelam o que se esconde.",
  "nouv.sansLune.titre": "Noite sem lua",
  "nouv.sansLune.texte": "Nenhuma luz lá fora e um círculo menor. Longe do fogo, você só vê os olhos.",
  "nouv.souffleur.titre": "Os sopradores",
  "nouv.souffleur.texte": "Ficam na beira da luz e sopram um vento gelado que esvazia sua chama. Derrube eles primeiro.",
  "nouv.mere.titre": "A mãe das mariposas",
  "nouv.mere.texte": "Ela dá voltas na clareira e bota mariposas. Doze golpes para espantá-la.",
  "nouv.voleur.titre": "Os ladrões de lenha",
  "nouv.voleur.texte": "Correm até sua lenha e a levam para o escuro. Derrubados, soltam a tora.",

<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
(function () {
'use strict';
/* ==========================================================================
   Le Dernier Feu — garder le dernier feu de camp d'une forêt maudite.
   Canvas 2D, sons Web Audio, aucun fichier externe.
   Monde : coordonnées en « unités » centrées sur le feu (u pixels = 1 unité).

const JEU = 'le-dernier-feu';
const I = window.JEL_I18N;
const t = (cle, vars) => (I ? I.t(cle, vars) : cle);

const $ = (id) => document.getElementById(id);

const TAU = Math.PI * 2;
const ECH = 1.45; // les créatures sont dessinées plus grandes que leur zone de contact
const alea = (a, b) => a + Math.random() * (b - a);
const borne = (x, a, b) => Math.max(a, Math.min(b, x));

/* ---------------------------- Données ------------------------------------ */
// Créatures : pv, vitesse dans le noir / dans la lumière (négatif = fuit), taille, dégâts au feu, points.
const TYPES = {
  rodeur:     { pv: 1, vNoir: 0.19, vLum: 0.05, taille: 0.15, degats: 12, pts: 10, recul: 0.25 },
  grand:      { pv: 2, vNoir: 0.13, vLum: 0.04, taille: 0.22, degats: 18, pts: 25, recul: 0.35 },
  rampant:    { pv: 1, vNoir: 0.38, vLum: -0.24, taille: 0.13, degats: 10, pts: 15, recul: 0.2 },
  silhouette: { pv: 2, vNoir: 0.26, vLum: 0, taille: 0.19, degats: 20, pts: 30, recul: 0 },
  papillon:   { pv: 1, vNoir: 0.2, vLum: 0.3, taille: 0.09, degats: 7, pts: 8, recul: 0.1 },
  souffleur:  { pv: 2, vNoir: 0.14, vLum: -0.1, taille: 0.18, degats: 8, pts: 35, recul: 0.25 },
  voleur:     { pv: 1, vNoir: 0.34, vLum: 0.2, taille: 0.11, degats: 0, pts: 20, recul: 0.2 },
  mere:       { pv: 12, vNoir: 0, vLum: 0, taille: 0.34, degats: 0, pts: 250, recul: 0 },
  bras:       { pv: 3, vNoir: 0.21, vLum: 0.06, taille: 0.14, degats: 22, pts: 40, recul: 0.4 },
  oeil:       { pv: 1, vNoir: 0, vLum: 0, taille: 0.16, degats: 0, pts: 60, recul: 0 },
};
// Les 20 nuits. taux = créatures par minute (la cadence monte au fil de la nuit).
const NIVEAUX = [
  { duree: 70,  buches: 10, taux: { rodeur: 11 }, nouv: 'rodeur' },
  { duree: 80,  buches: 9,  taux: { rodeur: 18 }, paires: true },
  { duree: 85,  buches: 9,  taux: { rodeur: 12, rampant: 9 }, nouv: 'rampant' },
  { duree: 90,  buches: 9,  taux: { rodeur: 13, rampant: 7, grand: 5 }, nouv: 'grand' },
  { duree: 90,  buches: 9,  taux: { rodeur: 10, rampant: 6, silhouette: 7 }, nouv: 'silhouette' },
  { duree: 95,  buches: 3,  lisiere: 6.5, taux: { rodeur: 14, grand: 5, silhouette: 4 }, nouv: 'lisiere' },
  { duree: 95,  buches: 4,  lisiere: 7, taux: { rodeur: 9, papillon: 16, rampant: 5 }, nouv: 'papillon' },
  { duree: 100, buches: 5,  lisiere: 6, pluie: 1, taux: { rodeur: 12, rampant: 8, papillon: 8 }, nouv: 'pluie' },
  { duree: 100, buches: 4,  lisiere: 6.5, taux: { silhouette: 8, rampant: 10, papillon: 9, grand: 5 } },
  { duree: 105, buches: 5,  lisiere: 6.5, sansLune: true, taux: { rodeur: 14, silhouette: 6, grand: 6 }, nouv: 'sansLune' },
  { duree: 105, buches: 4,  lisiere: 6, taux: { souffleur: 4, rodeur: 12, papillon: 8 }, nouv: 'souffleur' },
  { duree: 110, buches: 5,  lisiere: 6, boss: 'mere', taux: { papillon: 5, rodeur: 12, rampant: 5 }, nouv: 'mere' },
  { duree: 110, buches: 5,  lisiere: 6, sansLune: true, pluie: 1, taux: { rampant: 12, silhouette: 8, souffleur: 3 } },
  { duree: 110, buches: 4,  lisiere: 5, taux: { voleur: 9, rodeur: 14, grand: 6 }, nouv: 'voleur' },
  { duree: 115, buches: 5,  lisiere: 5.5, brouillard: true, taux: { rodeur: 13, papillon: 10, souffleur: 4, silhouette: 6 }, nouv: 'brouillard' },
  { duree: 115, buches: 5,  lisiere: 5, pluie: 2, taux: { rampant: 12, grand: 7, voleur: 6, papillon: 10 }, nouv: 'orage' },
  { duree: 120, buches: 5,  lisiere: 5.5, sansLune: true, taux: { silhouette: 13, souffleur: 5, rodeur: 12 } },
  { duree: 120, buches: 5,  lisiere: 5, chose: 1, taux: { rodeur: 12, rampant: 8, papillon: 6 }, nouv: 'chose' },
  { duree: 120, buches: 5,  lisiere: 5, sansLune: true, pluie: 2, brouillard: true, taux: { rodeur: 10, rampant: 8, silhouette: 7, papillon: 8, souffleur: 3, voleur: 4, grand: 4 } },
  { duree: 125, buches: 6,  lisiere: 5, sansLune: true, chose: 2, taux: { rodeur: 10, silhouette: 6, papillon: 6, souffleur: 3, grand: 4 }, nouv: 'chosefinale' },
];
window.JEL_NIVEAUX = NIVEAUX.length;
const MAX_ETOILES = NIVEAUX.length * 3;

// Pouvoirs de l'aube (rang maximal).
const POUVOIRS = {
  explosif: 3, braises: 2, lanterne: 2, boisSec: 2, econome: 2, foyer: 3, portee: 2,
  double: 1, cendres: 2, fagot: 2, ecorce: 1, embrasement: 2, guetteur: 1,
};
// Couleurs du feu (débloquées par le total d'étoiles) et lanternes (nuits gagnées).
const FEUX = {
  orange: { seuil: 0,  coeur: '#fff4c8', milieu: '#ffb347', bord: '#ff5a1f', lum: [255, 150, 60] },
  bleu:   { seuil: 15, coeur: '#eafcff', milieu: '#7fd8ff', bord: '#2f6dff', lum: [120, 190, 255] },
  vert:   { seuil: 30, coeur: '#f2ffe2', milieu: '#a2ff7a', bord: '#22b24c', lum: [140, 255, 140] },
  blanc:  { seuil: 45, coeur: '#ffffff', milieu: '#f2eeff', bord: '#b0a6ff', lum: [235, 230, 255] },
};
const LANTERNES = { aucune: 0, fer: 5, verre: 10, luciole: 15 };

/* ---------------------------- Progression -------------------------------- */
const prog = { etoiles: new Array(20).fill(0), records: new Array(20).fill(0), kit: {}, feu: 'orange', lanterne: 'aucune', son: true };
function lireSauvegarde() {
  let d = null;
  try { d = window.JEL_SAVE ? JEL_SAVE.load(JEU) : null; } catch (e) { d = null; }
  if (!d) return;
  if (Array.isArray(d.etoiles)) for (let i = 0; i < 20; i++) prog.etoiles[i] = borne(d.etoiles[i] | 0, 0, 3);
  if (Array.isArray(d.records)) for (let i = 0; i < 20; i++) prog.records[i] = Math.max(0, d.records[i] | 0);
  if (d.kit && typeof d.kit === 'object') for (const k in POUVOIRS) if (d.kit[k]) prog.kit[k] = borne(d.kit[k] | 0, 0, POUVOIRS[k]);
  if (FEUX[d.feu]) prog.feu = d.feu;
  if (d.lanterne in LANTERNES) prog.lanterne = d.lanterne;
  if (d.options && typeof d.options.son === 'boolean') prog.son = d.options.son;
}
function enregistrer(niveau, score) {
  if (apercu || affiche || !window.JEL_SAVE) return;
  try {
    JEL_SAVE.save(JEU, { niveau: borne(niveau, 1, 20), score: score | 0, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
      kit: Object.assign({}, prog.kit), feu: prog.feu, lanterne: prog.lanterne, options: { son: prog.son } });
  } catch (e) { /* sauvegarde impossible : le jeu continue */ }
}
// Réglages seuls (camp, son) : seulement si une sauvegarde existe déjà, pour ne jamais en créer une depuis le titre.
function enregistrerReglages() {
  try { localStorage.setItem('le-dernier-feu-son', prog.son ? '1' : '0'); } catch (e) { /* cadre isolé */ }
  try { if (window.JEL_SAVE && JEL_SAVE.existe(JEU)) JEL_SAVE.save(JEU, { feu: prog.feu, lanterne: prog.lanterne, options: { son: prog.son } }); } catch (e) { /* rien */ }
}
const rang = (k) => prog.kit[k] | 0;
const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);
const nuitOuverte = (n) => n === 1 || prog.etoiles[n - 2] > 0;
const feuDebloque = (k) => totalEtoiles() >= FEUX[k].seuil;
const lanterneDebloquee = (k) => LANTERNES[k] === 0 || prog.etoiles[LANTERNES[k] - 1] > 0;

/* ---------------------------- Canvas ------------------------------------- */
const cv = $('jeu');
const ctx = cv.getContext('2d');
const nuitC = document.createElement('canvas');
const nctx = nuitC.getContext('2d');
const fondC = document.createElement('canvas');
const fctx = fondC.getContext('2d');
let W = 0, H = 0, DPR = 1, u = 100, cx = 0, cy = 0;
const apercu = window.JEL_APERCU ? (window.JEL_APERCU | 0) : 0;
const affiche = !!window.JEL_AFFICHE;

function redimensionner() {
  W = window.innerWidth || 390; H = window.innerHeight || 844;
  DPR = Math.min(window.devicePixelRatio || 1, 1.75);
  for (const c of [cv, nuitC, fondC]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  u = Math.min(W / 3.1, H / 3.6);
  cx = W / 2; cy = H * 0.53;
  construireFond();
}
const px = (x) => cx + x * u;
const py = (y) => cy + y * u;
// Distance du feu au bord de l'écran dans une direction (en unités).
function bordDist(a) {
  const dx = Math.cos(a), dy = Math.sin(a);
  let d = 99;
  if (Math.abs(dx) > 1e-4) d = Math.min(d, (dx > 0 ? W - cx : cx) / u / Math.abs(dx));
  if (Math.abs(dy) > 1e-4) d = Math.min(d, (dy > 0 ? H - cy : cy) / u / Math.abs(dy));
  return d;
}

// Hasard fixe pour le décor (même forêt à chaque dessin).
function graine(s) { return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// Décor de la clairière, dessiné une fois par taille d'écran.
function construireFond() {
  const g = fctx; const R = graine(77);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#33291d'; g.fillRect(0, 0, W, H);
  // Sol de forêt : taches de terre, mousse et feuilles.
  for (let i = 0; i < (W * H) / 900; i++) {
    const x = R() * W, y = R() * H, r = 4 + R() * 26;
    const c = ['#3d3222', '#2c2418', '#3a4426', '#46391f', '#2f3a20', '#4b3a24'][(R() * 6) | 0];
    g.fillStyle = c; g.globalAlpha = 0.5 + R() * 0.5;
    g.beginPath(); g.ellipse(x, y, r, r * (0.5 + R() * 0.5), R() * TAU, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  // Clairière.
  const cl = g.createRadialGradient(cx, cy, 0, cx, cy, 1.75 * u);
  cl.addColorStop(0, '#6a5234'); cl.addColorStop(0.45, '#57472c'); cl.addColorStop(0.8, 'rgba(70,82,44,.85)'); cl.addColorStop(1, 'rgba(60,70,40,0)');
  g.fillStyle = cl; g.beginPath(); g.arc(cx, cy, 1.75 * u, 0, TAU); g.fill();
  // Herbes.
  for (let i = 0; i < 260; i++) {
    const a = R() * TAU, d = (0.5 + R() * 1.4) * u, x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d;
    g.strokeStyle = ['#6d7a3a', '#55652c', '#7f8644'][(R() * 3) | 0]; g.lineWidth = 1.5;
    for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(x + k * 2, y); g.lineTo(x + k * 2 + (R() - 0.5) * 6, y - 5 - R() * 7); g.stroke(); }
  }
  // Feuilles mortes.
  for (let i = 0; i < (W * H) / 500; i++) {
    const x = R() * W, y = R() * H;
    g.fillStyle = ['#8a4a1c', '#a0662a', '#6a3a18', '#b4823a'][(R() * 4) | 0]; g.globalAlpha = 0.55;
    g.beginPath(); g.ellipse(x, y, 3 + R() * 3, 1.5 + R() * 1.5, R() * TAU, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  // Arbres (vus de dessus : souche, racines, mousse) et fougères, autour de la clairière jusqu'aux bords.
  const pas = 0.5;
  const xmin = -cx / u - 0.5, xmax = (W - cx) / u + 0.5, ymin = -cy / u - 0.5, ymax = (H - cy) / u + 0.5;
  const arbres = [];
  for (let gx = xmin; gx < xmax; gx += pas) for (let gy = ymin; gy < ymax; gy += pas) {
    const x = gx + (R() - 0.5) * pas * 0.9, y = gy + (R() - 0.5) * pas * 0.9;
    const d = Math.hypot(x, y);
    if (d < 1.75 + R() * 0.35) continue;
    if (R() < 0.35) { // fougère
      fougere(g, px(x), py(y), (0.12 + R() * 0.12) * u, R);
      continue;
    }
    arbres.push({ x, y, r: (0.08 + R() * 0.1) * u });
  }
  for (const a of arbres) {
    const X = px(a.x), Y = py(a.y);
    g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(X + a.r * 0.4, Y + a.r * 0.5, a.r * 1.6, a.r * 1.2, 0, 0, TAU); g.fill();

    for (let k = 0; k < 5; k++) {
      const an = R() * TAU, l = a.r * (1.3 + R() * 1.4);
      g.lineWidth = a.r * 0.35; g.beginPath(); g.moveTo(X, Y);
      g.quadraticCurveTo(X + Math.cos(an + 0.4) * l * 0.6, Y + Math.sin(an + 0.4) * l * 0.6, X + Math.cos(an) * l, Y + Math.sin(an) * l); g.stroke();
    }
    g.fillStyle = '#5a3e24'; g.beginPath(); g.arc(X, Y, a.r, 0, TAU); g.fill();
    g.fillStyle = '#7a5532'; g.beginPath(); g.arc(X, Y, a.r * 0.75, 0, TAU); g.fill();
    g.strokeStyle = '#5e4128'; g.lineWidth = 1;
    for (let k = 1; k < 4; k++) { g.beginPath(); g.arc(X, Y, a.r * 0.18 * k, 0, TAU); g.stroke(); }
    g.fillStyle = '#4f6a2a'; g.globalAlpha = 0.8; g.beginPath(); g.arc(X - a.r * 0.5, Y - a.r * 0.4, a.r * 0.45, 0, TAU); g.fill(); g.globalAlpha = 1;
  }

    cr: [], tisons: [], flashs: [], braises: [], logs: [], parts: [], acc: {},

    brouillard: 0, brouillardT: 14, coeurT: 0, criT: 0, lancer: 0, lancerA: 0, finT: 0,
    mere: null, chose: def.chose ? { pv: 14, pvMax: 14, brasT: 9, oeilT: 12, rot: 0 } : null,

// Rayon de lumière du feu (unités).

// Sources de lumière de l'image en cours (calculées une fois par image).

function calculerLumieres() {

/* ---------------------------- Créatures ---------------------------------- */
let idCr = 0;

    const p = Math.min(1, ti.p);
    ti.x = ti.x0 + (ti.tx - ti.x0) * p; ti.y = ti.y0 + (ti.ty - ti.y0) * p; ti.z = Math.sin(Math.PI * p) * ti.h;
    if (Math.random() < 0.7) particule(ti.x, ti.y - ti.z, alea(-0.1, 0.1), alea(-0.1, 0.1), 0.35, 'etincelle');
    if (ti.p >= 1) { ti.fini = true; impact(ti.tx, ti.ty); }
  }
  S.tisons = S.tisons.filter((ti) => !ti.fini);
}
function impact(x, y) {
  const r = 0.17 * (1 + 0.35 * rang('explosif'));
  eclat(x, y, 0.5 + r, 0.75);
  SON.boum();
  for (let i = 0; i < 18; i++) particule(x, y, alea(-1.2, 1.2), alea(-1.2, 1.2), alea(0.3, 0.7), 'etincelle');
  for (const c of S.cr.slice()) {
    const T = TYPES[c.type];
    if (Math.hypot(c.x - x, c.y - y) < r + T.taille * 1.1) blesser(c, c.x - x || c.x, c.y - y || c.y, 1);
  }
  if (rang('braises')) S.braises.push({ x, y, vie: 1.5 + 1.5 * rang('braises'), tick: 0.6 });
}
function eclat(x, y, r, vie) { S.flashs.push({ x, y, r, vie, max: vie }); }
function majEffets(dt) {
  for (const f of S.flashs) f.vie -= dt;
  S.flashs = S.flashs.filter((f) => f.vie > 0);
  for (const b of S.braises) {
    b.vie -= dt; b.tick -= dt;
    if (Math.random() < dt * 8) particule(b.x + alea(-0.08, 0.08), b.y + alea(-0.08, 0.08), 0, -0.3, 0.5, 'etincelle');
    if (b.tick <= 0) { b.tick = 0.8; for (const c of S.cr.slice()) if (c.type !== 'oeil' && c.type !== 'mere' && Math.hypot(c.x - b.x, c.y - b.y) < 0.17 + TYPES[c.type].taille * 0.8) blesser(c, c.x - b.x, c.y - b.y, 0.5); }
  }
  S.braises = S.braises.filter((b) => b.vie > 0);
  for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vie -= dt; if (p.type === 'fumee') { p.vx *= 0.96; p.vy -= 0.2 * dt; } }
  S.parts = S.parts.filter((p) => p.vie > 0);
  if (S.parts.length > 500) S.parts.splice(0, S.parts.length - 500);
}
function particule(x, y, vx, vy, vie, type) { S.parts.push({ x, y, vx, vy, vie, max: vie, type }); }
function ajouterBuche() {
  if (phase !== 'jeu') return;
  if (S.buches <= 0) { message(t('msg.bois')); SON.erreur(); return; }
  S.buches--;
  S.flamme = Math.min(100, S.flamme + 24 + 6 * rang('boisSec'));
  SON.buche(); eclat(0, 0, Lcur + 0.4, 0.5);
  for (let i = 0; i < 24; i++) particule(alea(-0.1, 0.1), alea(-0.1, 0.1), alea(-0.6, 0.6), alea(-1.4, -0.3), alea(0.5, 1.1), 'etincelle');
}
function ramasser(l) {
  if (l.tire) return;
  l.tire = 0.001; SON.ramasse();
}
function majLisiere(dt) {
  if (S.def.lisiere && S.temps < S.def.duree - 4) {
    S.lisT -= dt;
    if (S.lisT <= 0 && S.logs.length < 3) {
      S.lisT = S.def.lisiere * alea(0.8, 1.25);
      for (let essai = 0; essai < 12; essai++) {
        const a = Math.random() * TAU;
        const d = Math.min(Lcur + 0.3, bordDist(a) - 0.25);
        const x = Math.cos(a) * d, y = Math.sin(a) * d;
        if (py(y) < 120 || py(y) > H - 110 || d < 0.6) continue;
        S.logs.push({ x, y, vie: 13, tire: 0 });
        if (!S.lisVu) { S.lisVu = true; message(t('msg.lisiere')); }
        break;
      }
    }
  }
  for (const l of S.logs) {
    if (l.tire) {
      l.tire += dt;
      const d = Math.hypot(l.x + 0.42, l.y - 0.3);
      const v = 2.4 * dt;
      if (d < v) { l.fini = true; S.buches++; SON.buche(); }
      else { l.x += (-0.42 - l.x) / d * v; l.y += (0.3 - l.y) / d * v; }
    } else { l.vie -= dt; if (l.vie <= 0) l.fini = true; }
  }
  S.logs = S.logs.filter((l) => !l.fini);
}

/* ---------------------------- Boucle de la nuit -------------------------- */
function majNuit(dt) {
  S.temps += dt;
  S.recharge = Math.max(0, S.recharge - dt);
  S.embrRech = Math.max(0, S.embrRech - dt);
  S.lancer = Math.max(0, S.lancer - dt);
  // météo
  if (S.def.pluie) {
    S.eclairT -= dt;
    if (S.eclairT <= 0) { S.eclair = 0.28; S.eclairT = S.def.pluie === 2 ? alea(4, 8) : alea(9, 15); SON.tonnerre(); }
  }
  S.eclair = Math.max(0, S.eclair - dt);
  if (S.def.brouillard) {
    S.brouillardT -= dt;
    const cible = S.brouillardT < 0 ? 1 : 0;
    if (S.brouillardT < -8) S.brouillardT = alea(10, 16);
    S.brouillard += (cible - S.brouillard) * Math.min(1, dt * 0.8);
  }
  // le feu baisse tout seul
  let pluie = S.def.pluie === 2 ? 2 : S.def.pluie === 1 ? 1.6 : 1;
  if (rang('ecorce')) pluie = 1 + (pluie - 1) / 2;
  S.flamme -= 0.85 * (0.55 + 0.9 * S.flamme / 100) * (1 - 0.12 * rang('foyer')) * pluie * dt;
  calculerLumieres();
  apparitions(dt);
  majCreatures(dt);
  majTisons(dt);
  majEffets(dt);
  majLisiere(dt);
  S.flamme = borne(S.flamme, 0, 100);
  S.cumul += S.flamme * dt;
  // alertes
  if (S.flamme < 25) {
    S.coeurT -= dt; if (S.coeurT <= 0) { S.coeurT = 0.5 + S.flamme / 40; SON.coeur(); }
    if (!S.avertiBasse || S.temps - S.avertiBasse > 12) { S.avertiBasse = S.temps; message(t('msg.flammeBasse')); }
  }
  if (S.buches === 0 && !S.avertiBois && !S.def.lisiere) { S.avertiBois = true; message(t('msg.bois')); }
  if (S.flamme <= 0) { finNuit(false); return; }
  if (S.temps >= S.def.duree) finNuit(true);
}
function moyenneFlamme() { return S.temps > 0 ? S.cumul / S.temps : S.flamme; }
function etoilesDe(moy) { return moy >= 55 ? 3 : moy >= 35 ? 2 : 1; }

function finNuit(victoire) {
  if (phase !== 'jeu') return;
  S.victoire = victoire;
  S.finT = 0;
  phase = victoire ? 'aube' : 'extinction';
  if (victoire) {
    SON.aube();
    for (const c of S.cr) for (let i = 0; i < 6; i++) particule(c.x, c.y, alea(-0.5, 0.5), alea(-0.5, 0.5), 0.9, 'fumee');
    S.cr = []; S.tisons = [];
  } else {
    SON.defaite();
  }
  $('hud').classList.add('cache');
}
function majFinAnimation(dt) {
  S.finT += dt;
  majEffets(dt);
  if (phase === 'extinction') { S.flamme = 0; for (const c of S.cr) { const d = Math.hypot(c.x, c.y) || 1; c.x -= c.x / d * 0.6 * dt; c.y -= c.y / d * 0.6 * dt; } }
  calculerLumieres();
  if (S.finT > 2) afficherFin();
}

// Lance une nuit : présentation, puis tutoriel (nuit 1) ou partie.

function commencerNuit() {

}

// Écran de fin de nuit.
function afficherFin() {
  phase = 'fin';
  const n = S.n, v = S.victoire;
  const moy = Math.round(moyenneFlamme());
  let et = 0, nouveauRecord = false, premiere = false;
  const annonces = [];
  if (v) {
    S.score += Math.round(moy) * 5 + S.buches * 10;
    et = etoilesDe(moy);
    premiere = prog.etoiles[n - 1] === 0;
    const avantTotal = totalEtoiles();
    if (et > prog.etoiles[n - 1]) prog.etoiles[n - 1] = et;
    if (S.score > prog.records[n - 1]) { nouveauRecord = true; prog.records[n - 1] = S.score; }
    if (premiere) annonces.push(t('fin.page', { n }));
    for (const k in FEUX) if (FEUX[k].seuil > avantTotal && FEUX[k].seuil <= totalEtoiles()) annonces.push(t('fin.feu', { nom: t('feu.' + k) }));
    if (premiere) for (const k in LANTERNES) if (LANTERNES[k] === n) annonces.push(t('fin.lanterne', { nom: t('lanterne.' + k) }));
    enregistrer(Math.min(20, n + 1), S.score);
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: n });
    if (prog.etoiles.every((e) => e > 0)) { if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: MAX_ETOILES }); }
  } else {
    if (S.score > prog.records[n - 1]) { nouveauRecord = true; prog.records[n - 1] = S.score; }
    enregistrer(n, S.score);
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: n });
  }
  $('finTitre').textContent = v ? t('fin.victoire') : t('fin.defaite');
  $('finSous').textContent = v ? (S.choseVaincue ? t('fin.choseVaincue') : t('fin.victoireSous', { n })) : t('fin.defaiteSous', { n, pct: Math.round(100 * S.temps / S.def.duree) });
  const fe = $('finEtoiles'); fe.innerHTML = v ? [0, 1, 2].map(() => etoileSVG(true, 58)).join('') : '';
  if (v) [0, 1, 2].forEach((i) => setTimeout(() => { if (i < et && phase === 'fin') { fe.children[i].classList.add('on'); SON.etoile(i); } }, 400 + i * 380));
  const st = $('finStats'); st.innerHTML = '';
  const ligne = (txt, cls) => { const p = document.createElement('p'); p.textContent = txt; if (cls) p.className = cls; st.appendChild(p); return p; };
  const pScore = ligne(t('fin.score', { n: nb(0) }));
  const cible = S.score; const debut = performance.now();
  const compter = () => { const k = Math.min(1, (performance.now() - debut) / 900); pScore.textContent = t('fin.score', { n: nb(Math.round(cible * k)) }); if (k < 1 && phase === 'fin') requestAnimationFrame(compter); };
  requestAnimationFrame(compter);
  if (nouveauRecord && S.score > 0) ligne(t('fin.nouveauRecord'), 'record'); else ligne(t('fin.record', { n: nb(prog.records[n - 1]) }));
  if (v) ligne(t('fin.flamme', { n: moy }));
  ligne(t('fin.repousses', { n: nb(S.repousses) }));
  if (v) { const p = ligne(t('fin.etoilesAide')); p.className = 'petit'; }
  // choix d'un pouvoir (première victoire des nuits 1 à 19)
  const zc = $('finChoix'); zc.innerHTML = '';
  const za = $('finAnnonces'); za.innerHTML = '';
  for (const a of annonces) { const p = document.createElement('p'); p.className = 'annonce'; p.textContent = a; za.appendChild(p); }
  if (v && n === 20) { const p = document.createElement('p'); p.className = 'annonce'; p.textContent = t('fin.toutFini'); za.appendChild(p); }
  const boutons = () => {
    const zb = $('finBoutons'); zb.innerHTML = '';
    const bouton = (cle, f, sec) => { const b = document.createElement('button'); b.className = 'btn' + (sec ? ' sec' : ''); b.textContent = t(cle); b.addEventListener('click', () => { SON.clic(); f(); }); zb.appendChild(b); return b; };
    let premier;
    if (v && n < 20) premier = bouton('btn.suivante', () => lancerNuit(n + 1));
    if (!v) premier = bouton('btn.reessayer', () => lancerNuit(n));
    const r = bouton('btn.rejouer', () => lancerNuit(v ? n : 1), true);
    bouton('btn.niveaux', ouvrirNuits, true);
    if (!v) bouton('btn.accueil', allerTitre, true);
    focaliser(premier || r);
  };
  const offre = v && premiere && n < 20 ? tirerPouvoirs() : [];
  if (offre.length) {
    const h = document.createElement('h3'); h.textContent = t('fin.choix'); h.style.color = '#ffcf8a'; zc.appendChild(h);
    const box = document.createElement('div'); box.className = 'cartes-pouvoir'; zc.appendChild(box);
    for (const k of offre) {
      const b = document.createElement('button');
      const tb = document.createElement('b'); tb.textContent = t('pouvoir.' + k + '.nom') + (POUVOIRS[k] > 1 ? ' · ' + t('camp.rang', { n: rang(k) + 1, max: POUVOIRS[k] }) : '');
      const sd = document.createElement('span'); sd.textContent = t('pouvoir.' + k + '.desc');
      b.appendChild(tb); b.appendChild(sd);
      b.addEventListener('click', () => {
        prog.kit[k] = rang(k) + 1; SON.choix();
        zc.innerHTML = ''; const p = document.createElement('p'); p.className = 'annonce'; p.textContent = t('fin.choisi', { nom: t('pouvoir.' + k + '.nom') }); zc.appendChild(p);
        enregistrer(Math.min(20, n + 1), S.score); boutons();
      });
      box.appendChild(b);
    }
    $('finBoutons').innerHTML = '';
    focaliser(box.firstChild);
  } else boutons();
  montrer('ecranFin');
}
function tirerPouvoirs() {
  const libres = Object.keys(POUVOIRS).filter((k) => rang(k) < POUVOIRS[k]);
  for (let i = libres.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [libres[i], libres[j]] = [libres[j], libres[i]]; }
  return libres.slice(0, 2);
}

let toastT = null;

  clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('vu'), 2200);

let hudCache = {};
function majHud(force) {
  if (!S) return;
  const vals = {
    nuit: t('hud.nuit', { n: S.n }), fl: Math.round(S.flamme), b: S.buches,
    aube: Math.min(100, (100 * S.temps) / S.def.duree).toFixed(1),
  };
  if (force || hudCache.nuit !== vals.nuit) $('hudNuit').textContent = vals.nuit;
  if (force || hudCache.fl !== vals.fl) { $('hudFlamme').textContent = t('hud.flamme', { n: vals.fl }); $('flammeBarre').style.width = vals.fl + '%'; $('jaugeFlamme').classList.toggle('basse', vals.fl < 25); }
  if (force || hudCache.b !== vals.b) { $('bucheNb').textContent = nb(vals.b); $('btnBuche').classList.toggle('vide', vals.b <= 0); }

/* ---------------------------- Boucle principale -------------------------- */
let dernier = performance.now();
function boucle(maintenant) {
  const dt = Math.min(0.05, (maintenant - dernier) / 1000); dernier = maintenant;
  horloge += dt; secousse = Math.max(0, secousse - dt);
  if (phase === 'jeu') { majNuit(dt); majReticule(dt); if (phase === 'jeu') majHud(); }
  else if (phase === 'aube' || phase === 'extinction') majFinAnimation(dt);
  if (AC && S && phase === 'jeu') {
    volumeBoucle(crepit, prog.son ? 0.04 + 0.12 * S.flamme / 100 : 0);
    volumeBoucle(pluieSon, prog.son && S.def.pluie ? (S.def.pluie === 2 ? 0.25 : 0.14) : 0);
    volumeBoucle(ventSon, prog.son && S.cr.some((c) => c.souffle) ? 0.2 : 0);
    if (Math.random() < dt * 3 && prog.son) souffle('highpass', 3000, 0, 0.03, 0.06 + 0.1 * S.flamme / 100);
  } else if (AC) { volumeBoucle(crepit, prog.son && phase !== 'pause' ? 0.05 : 0); volumeBoucle(pluieSon, 0); volumeBoucle(ventSon, 0); }
  if (S && (phase === 'apercu' || phase === 'tuto' || phase === 'intro')) calculerLumieres();
  dessinerScene(horloge);
  if (phase === 'intro') dessinerIntro(horloge);
  requestAnimationFrame(boucle);
}
