  cape.bezierCurveTo(...P(-0.2, -0.62), ...P(-0.3, -0.42), ...P(-0.27, -0.22));
  cape.quadraticCurveTo(...P(-0.16, -0.27), ...P(-0.08, -0.24));
  cape.quadraticCurveTo(...P(0.02, -0.3), ...P(0.12, -0.26));
  cape.bezierCurveTo(...P(0.13, -0.45), ...P(0.15, -0.65), ...P(0.1, -0.8));
  cape.closePath();
  g.fillStyle = '#3a2c52'; g.fill(cape);
  const lum = g.createLinearGradient(...P(-0.1, 0), ...P(0.16, 0));
  lum.addColorStop(0, 'rgba(255,140,60,0)'); lum.addColorStop(1, 'rgba(255,150,70,.7)');
  g.fillStyle = lum; g.fill(cape);
  g.strokeStyle = 'rgba(20,12,30,.6)'; g.lineWidth = 2;
  for (const f of [-0.15, -0.05, 0.05]) { g.beginPath(); g.moveTo(...P(f * 0.6, -0.72)); g.quadraticCurveTo(...P(f, -0.5), ...P(f * 1.3, -0.27)); g.stroke(); }
  g.strokeStyle = 'rgba(170,180,255,.75)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(...P(-0.1, -0.8)); g.bezierCurveTo(...P(-0.2, -0.62), ...P(-0.3, -0.42), ...P(-0.27, -0.22)); g.stroke();
  g.strokeStyle = 'rgba(255,170,90,.9)';
  g.beginPath(); g.moveTo(...P(0.12, -0.26)); g.bezierCurveTo(...P(0.13, -0.45), ...P(0.15, -0.65), ...P(0.1, -0.8)); g.stroke();
  // lanterne (source de lumière)
  const [lx, ly] = P(-0.2, -0.42);
  let gl = g.createRadialGradient(lx, ly, 0, lx, ly, k * 0.22);
  gl.addColorStop(0, 'rgba(255,230,150,.9)'); gl.addColorStop(1, 'rgba(255,200,100,0)');
  g.fillStyle = gl; g.beginPath(); g.arc(lx, ly, k * 0.22, 0, TAU); g.fill();
  g.strokeStyle = '#2a2018'; g.lineWidth = 3; g.strokeRect(lx - k * 0.03, ly - k * 0.04, k * 0.06, k * 0.08);
  g.beginPath(); g.moveTo(lx, ly - k * 0.04); g.lineTo(...P(-0.19, -0.48)); g.stroke();
  g.fillStyle = '#fff2b0'; g.fillRect(lx - k * 0.02, ly - k * 0.03, k * 0.04, k * 0.06);
  // bras droit levé qui vient de lancer le tison
  g.strokeStyle = '#3a2c52'; g.lineWidth = k * 0.06;
  g.beginPath(); g.moveTo(...P(0.08, -0.76)); g.quadraticCurveTo(...P(0.17, -0.9), hx, hy); g.stroke();
  g.strokeStyle = 'rgba(255,170,90,.9)'; g.lineWidth = 3; g.stroke();
  g.fillStyle = '#e8b890'; g.beginPath(); g.arc(hx, hy, k * 0.032, 0, TAU); g.fill();
  // capuche pointue, visage de profil éclairé par le feu
  const [tX, tY] = P(0.01, -0.87);
  g.fillStyle = '#2a2040';
  g.beginPath(); g.moveTo(tX - k * 0.03, tY - k * 0.09); g.quadraticCurveTo(tX - k * 0.16, tY - k * 0.06, tX - k * 0.13, tY + k * 0.1);
  g.lineTo(tX + k * 0.08, tY + k * 0.08); g.quadraticCurveTo(tX + k * 0.1, tY - k * 0.06, tX - k * 0.03, tY - k * 0.09); g.fill();
  g.fillStyle = '#d29a70'; g.beginPath(); g.moveTo(tX + k * 0.01, tY - k * 0.04); g.quadraticCurveTo(tX + k * 0.08, tY - k * 0.02, tX + k * 0.075, tY + k * 0.02);
  g.lineTo(tX + k * 0.09, tY + k * 0.03); g.lineTo(tX + k * 0.065, tY + k * 0.05); g.quadraticCurveTo(tX + k * 0.04, tY + k * 0.08, tX + k * 0.0, tY + k * 0.07); g.fill();
  g.fillStyle = '#1a1020'; g.beginPath(); g.arc(tX + k * 0.05, tY - k * 0.005, k * 0.008, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(170,180,255,.75)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(tX - k * 0.03, tY - k * 0.09); g.quadraticCurveTo(tX - k * 0.16, tY - k * 0.06, tX - k * 0.13, tY + k * 0.1); g.stroke();
  g.restore();
  // troncs du premier plan, coupés par le bord
  for (const [X, l] of [[-w * 0.02, w * 0.12], [w * 0.97, w * 0.14]]) {
    g.fillStyle = '#120c14'; g.fillRect(X - l / 2, 0, l, h);
    g.fillStyle = 'rgba(255,130,60,.35)'; g.fillRect(X > w / 2 ? X - l / 2 : X + l / 2 - 5, 0, 5, h);
  }
  // papillons qui volent vers la flamme
  for (let i = 0; i < 5; i++) {
    const X = fx + (R() - 0.5) * w * 0.5, Y = h * (0.55 + R() * 0.12);
    g.fillStyle = '#d8ccb4'; g.beginPath(); g.ellipse(X - 6, Y, 7, 5, -0.5, 0, TAU); g.ellipse(X + 6, Y, 7, 5, 0.5, 0, TAU); g.fill();
  }
}

/* ---------------------------- Aperçus (images de la page du jeu) --------- */
function ouvrirApercu(k) {
  const n = k === 1 ? 1 : k === 2 ? 8 : 20;
  nouvelleNuit(n);
  phase = 'apercu';
  montrer(null);
  $('hud').classList.remove('cache');
  const plan = {
    1: { temps: 18, flamme: 72, buches: 8, cr: [['rodeur', -0.6, 0.98], ['rodeur', 2.4, 1.05], ['rodeur', 0.85, 1.6], ['rodeur', 4.0, 1.5], ['rodeur', 5.2, 2.0]], tison: [0.75, -0.95, 0.6] },
    2: { temps: 55, flamme: 48, buches: 3, cr: [['rampant', 0.3, 0.92], ['papillon', 4.1, 0.62], ['papillon', 4.25, 0.72], ['papillon', 3.95, 0.8], ['rodeur', 1.5, 0.95], ['silhouette', 2.43, 1.0], ['grand', 5.4, 1.3]], tison: [-0.9, -0.5, 0.7], logs: [[1.15, 1.05]] },
    3: { temps: 78, flamme: 58, buches: 4, cr: [['bras', 0.4, 1.05], ['bras', 3.6, 1.2], ['oeil', 2.0, 1.9], ['souffleur', 5.0, 1.0], ['silhouette', 1.25, 0.78], ['papillon', 4.4, 0.7], ['rodeur', 5.8, 1.5]], tison: [0.1, 1.2, 0.5] },
  }[k] || null;
  if (!plan) return;
  S.temps = plan.temps; S.flamme = plan.flamme; S.buches = plan.buches; S.cumul = plan.flamme * plan.temps; S.score = k * 230;
  if (k === 3) { prog.kit = { lanterne: 1, braises: 1 }; S.chose.annonce = true; S.chose.pv = 9; }
  for (const [type, a, d] of plan.cr) { const c = creer(type, a, d); if (type === 'bras') { c.d = d; c.x = Math.cos(a) * d; c.y = Math.sin(a) * d; } if (type === 'oeil') c.vie = 2.5; c.ang = a + Math.PI; }
  if (plan.logs) for (const [a, d] of plan.logs) S.logs.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, vie: 9, tire: 0 });
  const [tx, ty, p] = plan.tison;
  S.tisons.push({ x0: 0.05, y0: -0.05, tx, ty, x: tx * p, y: ty * p, z: Math.sin(Math.PI * p) * 0.4, p, duree: 1, h: 0.4, rot: 1 });
  if (k === 3) S.braises.push({ x: -0.8, y: 0.6, vie: 99, tick: 99 });
  if (k === 2) eclat(-0.7, 0.6, 0.7, 0.7);
  calculerLumieres();
  majHud(true);
  $('btnEmbrase').classList.toggle('cache', k !== 3);
}

/* ---------------------------- Démarrage ---------------------------------- */
lireSauvegarde();
try { const s = localStorage.getItem('le-dernier-feu-son'); if (s === '0') prog.son = false; } catch (e) { /* cadre isolé */ }
redimensionner();
window.addEventListener('resize', () => { redimensionner(); if (affiche) dessinerAffiche(horloge); });
for (let i = 0; i < 6; i++) decorYeux.push({ t: alea(0, 6), x: 2, y: 0 });
iconeSon();

if (affiche) {
  phase = 'affiche';
  montrer(null); $('hud').classList.add('cache');
  const cacherLangue = () => document.querySelectorAll('.jel-langue, [class*="jel-langue"], #langueTitre, #languePause').forEach((e) => { e.style.display = 'none'; });
  cacherLangue(); document.addEventListener('DOMContentLoaded', cacherLangue);
  const anime = (m) => { horloge = m / 1000; dessinerAffiche(horloge); requestAnimationFrame(anime); };
  requestAnimationFrame(anime);
  return;
}
if (apercu) {
  ouvrirApercu(apercu);
  const anime = (m) => { horloge = m / 1000; dessinerScene(horloge); requestAnimationFrame(anime); };
  requestAnimationFrame(anime);
  return;
}
allerTitre();
requestAnimationFrame(boucle);
})();
