  "esp.meduzo": "Quallino",
  "esp.cornichou": "Hörnchen",
  "esp.helico": "Heli",
  "esp.papillo": "Flatterli",
  "esp.ronflon": "Schnarchi",
  "esp.etoilou": "Sternchen",
  "esp.lunabelle": "Lunabella"
 }
}
</script>
<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>
  :root {
    --nuit: #0b0820;
    --carte: #1d1640;
    --bord: rgba(255, 255, 255, 0.22);
    --lavande: #b9a8ff;
    --or: #ffd34d;
    --texte: #f4f0ff;
    --doux: #c9c0ea;
    --hud: 0px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--nuit); color: var(--texte);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: none;
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ---------- Écrans ---------- */
  .ecran {
    position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center;
    padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  }
  .ecran.actif { display: flex; }
  .voile { background: rgba(8, 5, 24, 0.74); justify-content: center; }
  .defile { overflow-y: auto; touch-action: pan-y; }

  button {
    font: inherit; font-weight: 800; font-size: 17px; color: var(--texte);
    min-height: 44px; min-width: 44px; padding: 8px 16px; border-radius: 14px;
    border: 2px solid var(--bord); background: #2b2160; cursor: pointer; line-height: 1.15;
  }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
  button[disabled] { opacity: 0.45; cursor: default; }
  .principal {
    background: linear-gradient(#ffe68a, #ffbf2e); color: #3a2300; border-color: #fff3c0;
    box-shadow: 0 4px 0 #b97c00, 0 0 22px rgba(255, 211, 77, 0.35);
  }
  .gros { font-size: 26px; padding: 14px 40px; min-width: 220px; border-radius: 20px; }
  .rond { width: 44px; height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; }
  .rond svg { width: 24px; height: 24px; }
  .rangee { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }

  /* Écran titre : le dessin du canevas reste visible au milieu */
  #ecran-titre { justify-content: space-between; }
  .titre-haut { text-align: center; max-width: 520px; }
  h1 {
    margin: 6px 0 8px; font-size: clamp(30px, 8.6vw, 50px); line-height: 1.04; color: #fff;
    text-shadow: 0 0 18px rgba(255, 211, 77, 0.55), 0 3px 0 #5b3cc4;
  }
  .consigne {
    margin: 0 auto; font-size: 16px; line-height: 1.35; padding: 8px 12px; border-radius: 14px;
    background: rgba(10, 6, 30, 0.6); color: var(--doux); max-width: 30em;
  }
  .titre-bas { display: flex; flex-direction: column; gap: 10px; align-items: center; width: 100%; }
  .titre-bas .rangee button:not(.rond) { background: rgba(43, 33, 96, 0.92); }

  /* Barre de jeu */
  #hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 4; display: none;
    padding: max(4px, env(safe-area-inset-top)) 6px 4px;
    background: linear-gradient(rgba(8, 5, 24, 0.95), rgba(8, 5, 24, 0.75));
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  #hud.actif { display: block; }
  .hud-ligne { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
  .hud-ligne + .hud-ligne { margin-top: 4px; min-height: 28px; }
  .puce {
    display: flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.09); font-weight: 800; font-size: 15px; white-space: nowrap;
  }
  .puce svg { width: 18px; height: 18px; flex: none; }
  #hud-boucliers svg { width: 17px; height: 19px; }
  #hud-boucliers svg.perdu { opacity: 0.22; }
  #hud-carbu { display: none; align-items: center; gap: 5px; }
  #hud-carbu.actif { display: flex; }
  .jauge { width: 92px; height: 12px; border-radius: 6px; background: #2a2050; overflow: hidden; border: 1px solid rgba(255,255,255,.25); }
  #jauge-carbu { height: 100%; width: 100%; background: linear-gradient(90deg, #ff6b6b, #ffd34d 45%, #6fe08a); transition: width 0.15s linear; }
  #hud-carbu.bas .jauge { animation: clignote 0.6s infinite alternate; }
  @keyframes clignote { from { box-shadow: 0 0 0 0 rgba(255, 90, 90, 0); } to { box-shadow: 0 0 10px 2px rgba(255, 90, 90, 0.9); } }
  #hud-abord { display: flex; gap: 5px; align-items: center; }
  .chip {
    width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: conic-gradient(var(--anneau, transparent) var(--p, 0%), rgba(255, 255, 255, 0.14) 0);
  }
  .chip i { display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--c); border: 2px solid rgba(0,0,0,.35); }

  #toast {
    position: fixed; left: 50%; top: calc(var(--hud) + 12px); transform: translate(-50%, -8px); z-index: 6;
    padding: 8px 16px; border-radius: 999px; background: rgba(20, 14, 50, 0.92); border: 2px solid var(--or);
    font-weight: 800; font-size: 16px; text-align: center; max-width: 92vw; opacity: 0; pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
  }
  #toast.vu { opacity: 1; transform: translate(-50%, 0); }

  .carte {
    width: 100%; max-width: 430px; max-height: 100%; overflow-y: auto; touch-action: pan-y;
    background: linear-gradient(#271d55, #1a1340); border: 2px solid var(--bord); border-radius: 22px;
    padding: 16px; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }
  .carte h2 { margin: 2px 0 8px; font-size: 26px; color: #fff; }
  .carte p { margin: 6px 0; line-height: 1.35; }

    ctx.fillStyle = '#1b1030'; ctx.beginPath(); ctx.arc(ex + er * 0.2, ey + er * 0.15, er * 0.5, 0, TAU); ctx.fill();
  });
  // bouche
  ctx.strokeStyle = '#1b1030'; ctx.lineWidth = 1;
  ctx.beginPath();
  if (o.boude) ctx.arc(0, -3.2, 2, 1.15 * Math.PI, 1.85 * Math.PI);
  else ctx.arc(0, -5.6, 2.2, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();
  ctx.restore();
}

// Taxi volant ; (x, y) = centre ; patins à +PIEDS
function dessinerTaxi(ctx, x, y, a, s, ci, flamme, t, passagers) {
  const C = CARROSSERIES[ci] || CARROSSERIES[0];
  ctx.save();
  ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s);
  // flamme du réacteur
  if (flamme > 0) {
    const L = 8 + 16 * flamme + Math.sin(t * 55) * 2.5;
    const g = ctx.createLinearGradient(0, 7, 0, 7 + L);
    g.addColorStop(0, '#fff7c2'); g.addColorStop(0.35, '#ffb53a'); g.addColorStop(1, 'rgba(255,80,60,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(-5.5, 7); ctx.quadraticCurveTo(0, 7 + L * 1.25, 5.5, 7); ctx.closePath(); ctx.fill();
  }
  // patins
  ctx.strokeStyle = '#a7b0c8'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-9, 6); ctx.lineTo(-13, 12); ctx.moveTo(9, 6); ctx.lineTo(13, 12);
  ctx.moveTo(-17, 12); ctx.lineTo(-9, 12); ctx.moveTo(9, 12); ctx.lineTo(17, 12);
  ctx.stroke();
  // dôme de verre et passagers
  ctx.save();
  ctx.beginPath(); ctx.arc(0, -3, 11.5, Math.PI, 0); ctx.closePath(); ctx.clip();
  ctx.fillStyle = 'rgba(160,215,255,.28)'; ctx.fillRect(-12, -15, 24, 13);
  (passagers || []).slice(0, 3).forEach((p, k, l) => {
    const dx = l.length === 1 ? 0 : (k - (l.length - 1) / 2) * 7.5;
    dessinerAlien(ctx, dx, -1, 0.62, p.esp, p.coul, t, { graine: k, boude: p.retard });
  });
  ctx.restore();
  ctx.strokeStyle = 'rgba(220,240,255,.85)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, -3, 11.5, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(-5, -10, 3, 1.4, -0.6, 0, TAU); ctx.fill();
  // carrosserie
  ctx.lineWidth = 1.6; ctx.strokeStyle = C.c2;
  const corps = ctx.createLinearGradient(0, -4, 0, 9);
  corps.addColorStop(0, '#ffffff'); corps.addColorStop(0.18, C.c1); corps.addColorStop(1, C.c2);
  ctx.fillStyle = corps;
  if (C.forme === 'soucoupe') {
    ctx.beginPath(); ctx.ellipse(0, 3, 22, 6.8, 0, 0, TAU); ctx.fill(); ctx.stroke();
    for (let k = -2; k <= 2; k++) {
      ctx.fillStyle = ((Math.floor(t * 4) + k) % 2 === 0) ? '#fff6a8' : '#ff9ad0';
      ctx.beginPath(); ctx.arc(k * 8, 4.5, 1.5, 0, TAU); ctx.fill();
    }
  } else if (C.forme === 'fusee') {
    ctx.fillStyle = C.c2;
    ctx.beginPath(); ctx.moveTo(-14, 2); ctx.lineTo(-22, 11); ctx.lineTo(-12, 8); ctx.closePath();
    ctx.moveTo(14, 2); ctx.lineTo(22, 11); ctx.lineTo(12, 8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = corps; rr(ctx, -16, -5, 32, 14, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(13, 2, 2, 0, TAU); ctx.fill();
  } else {
    rr(ctx, -19, -4, 38, 13, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff6c9'; ctx.beginPath(); ctx.arc(17, 1.5, 1.8, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff7070'; ctx.beginPath(); ctx.arc(-17, 1.5, 1.6, 0, TAU); ctx.fill();
  }
  // décor
  if (C.deco === 'damier') {
    for (let k = 0; k < 10; k++) {
      ctx.fillStyle = k % 2 ? '#2b2140' : '#ffffff';
      ctx.fillRect(-15 + k * 3, 1, 3, 2.2); ctx.fillStyle = k % 2 ? '#ffffff' : '#2b2140'; ctx.fillRect(-15 + k * 3, 3.2, 3, 2.2);
    }
  } else if (C.deco === 'bande') {
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(-14, 2, 28, 2.6);
  } else if (C.deco === 'points') {
    ctx.fillStyle = 'rgba(40,20,40,.65)';
    [[-11, 4], [-4, 2], [4, 5], [11, 3]].forEach(([px, py]) => { ctx.beginPath(); ctx.arc(px, py, 1.8, 0, TAU); ctx.fill(); });
  } else if (C.deco === 'etoiles') {
    ctx.fillStyle = '#fff6b0';
    [[-10, 3], [0, 5], [10, 2]].forEach(([px, py], k) => { cheminEtoile(ctx, px, py, 2.4 + Math.sin(t * 4 + k) * 0.4, 1, 4); ctx.fill(); });
  }
  // feu de toit du taxi (lumière, sans inscription)
  if (C.forme !== 'soucoupe') {
    ctx.fillStyle = '#ffb02e'; rr(ctx, -4, -17.5, 8, 4, 1.5); ctx.fill();
    ctx.fillStyle = 'rgba(255,200,80,' + (0.18 + 0.14 * Math.sin(t * 5)) + ')';
    ctx.beginPath(); ctx.ellipse(0, -16, 7, 4, 0, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = '#ccd'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, -14.5); ctx.lineTo(0, -19); ctx.stroke();
    ctx.fillStyle = '#ff6fae'; ctx.beginPath(); ctx.arc(0, -19.5, 2, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// Main du tutoriel (pointe vers le bas)
function dessinerMain(ctx, x, y, s, appuie) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (appuie) {
    ctx.fillStyle = 'rgba(255,211,77,.35)'; ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fill();
  }
  ctx.translate(0, appuie ? 2 : -4);
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#4b3c8a'; ctx.lineWidth = 1.6;
  rr(ctx, -3.5, -2, 7, 16, 3.5); ctx.fill(); ctx.stroke();
  rr(ctx, -9, 10, 18, 15, 6); ctx.fill(); ctx.stroke();
  ctx.restore();
}

// Astéroïde (forme bosselée qui tourne)
function dessinerRocher(ctx, x, y, r, rot, coul) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = coul[0]; ctx.strokeStyle = coul[1]; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let k = 0; k < 9; k++) {
    const a = k / 9 * TAU, rr2 = r * (0.85 + 0.15 * Math.sin(k * 2.7));
    if (k) ctx.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); else ctx.moveTo(Math.cos(a) * rr2, Math.sin(a) * rr2);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = coul[1];
  ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.2, r * 0.22, 0, TAU); ctx.arc(r * 0.35, r * 0.3, r * 0.15, 0, TAU); ctx.fill();
  ctx.restore();
}

// Planète sous une plateforme, ou planète-rocher
function dessinerPlanete(ctx, cx, cy, R, couleurs, graine) {
  const g = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.1, cx, cy, R);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.12, couleurs[0]); g.addColorStop(1, couleurs[1]);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.14)';
  for (let k = 0; k < 4; k++) {
    const a = graine * 2.1 + k * 1.7, d = R * (0.3 + 0.12 * k);
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d * 0.8, R * (0.13 - k * 0.015), 0, TAU); ctx.fill();
  }
}

/* =========================================================================
   ÉTAT DU JEU
   ========================================================================= */
const canvas = $('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0, hudH = 0;
let etat = 'titre';   // titre, niveaux, garage, tuto, jeu, pause, fin
let N = 0;            // index du niveau joué
let jeu = null;       // état du niveau en cours
let horloge = 0;      // temps d'animation (figé en pause)
let particules = [];
let confettis = [];
const etoilesFond = Array.from({ length: 150 }, (_, i) => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + 0.3, p: Math.random() * TAU, v: 0.5 + Math.random() * 2 }));
const entree = { doigt: null, x0: 0, incl: 0, poussee: false, cG: false, cD: false, cP: false };
let partieEnCours = false;

const ecransJeu = ['jeu', 'pause', 'tuto', 'fin'];
function afficher(id) {
  document.querySelectorAll('.ecran').forEach((e) => e.classList.toggle('actif', e.id === id));
}
function montrerHud(oui) {
  $('hud').classList.toggle('actif', oui);
  mesurer();
}
function mesurer() {
  hudH = $('hud').classList.contains('actif') ? $('hud').offsetHeight : 0;
  document.documentElement.style.setProperty('--hud', hudH + 'px');
  const dispo = H - hudH;
  S = Math.min(W / LW, dispo / LH);
  OX = (W - LW * S) / 2;
  OY = hudH + (dispo - LH * S) / 2;
}
function redimensionner() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  mesurer();
}

/* ---------- Messages ---------- */
let toastMinuteur = 0;
function toast(texte, duree) {
  const el = $('toast');
  el.textContent = texte; el.classList.add('vu');
  clearTimeout(toastMinuteur);
  toastMinuteur = setTimeout(() => el.classList.remove('vu'), duree || 1600);
}

/* ---------- Construction d'un niveau ---------- */
function especesDuNiveau(i) {
  const pool = [];
  for (let k = 0; k <= i; k++) (NIVEAUX[k].esp || []).forEach((e) => { if (!pool.includes(e)) pool.push(e); });
  return pool;
}
function construire(i) {
  const def = NIVEAUX[i];
  const pads = def.pads.map((p, k) => ({
    i: k, x: p[0], y: p[1], w: p[2], c: p[3], R: p[4], mob: p[5] || null,
    x0: p[0], y0: p[1], vx: 0, vy: 0, py: p[1],
  }));
  const pool = especesDuNiveau(i);
  const nouvelles = def.esp || [];
  const courses = def.courses.map((c, k) => ({
    de: c[0], a: c[1], presse: c[2] || 0,
    esp: k < nouvelles.length ? nouvelles[k] : pool[(k * 5 + i * 3) % pool.length],
  }));
  const dep = pads[def.depart];
  return {
    def, pads, courses,
    obst: def.obst || [], murs: def.murs || [],
    portes: (def.portes || []).map((p) => ({ ...p, ouvert: false, reste: 0, ouv: 0 })),
    boutons: (def.boutons || []).map((b) => ({ ...b, allume: 0 })),
    ast: (def.ast || []).map((a) => ({ ...a, x: a.x1, y: a.y1, rot: Math.random() * TAU })),
    orb: (def.orb || []).map((a) => ({ ...a, x: a.cx, y: a.cy, rot: 0 })),
    zones: def.zones || [], vents: (def.vents || []).map((v) => ({ ...v, dir: 1, alerte: false })),
    taxi: { x: dep.x + dep.w * 0.32, y: dep.y - PIEDS, vx: 0, vy: 0, a: 0, pose: dep.i, offx: dep.w * 0.32, flamme: 0, visible: true, invincible: 0 },
    carbu: def.carbu ? def.carbu.depart : 100, avecCarbu: !!def.carbu, alerteCarbu: false,
    cap: def.cap || 1, simul: def.simul || 1,
    attente: [], abord: [], prochaine: 0, prochainDans: 0.5,
    livres: 0, pieces: 0, crash: 0, boucliers: 3, douces: 0, posees: 0,
    poseDoux: false, poseDepuis: 0, dernierPad: dep.i, reapparition: 0, fin: null,
    t: 0, nouvellesEspeces: 0, sautes: [], textes: [],
    secousse: 0, sonPlein: 0,
  };
}

/* ---------- Lancement d'un niveau ---------- */
function lancerNiveau(i) {
  N = borner(i, 0, NIVEAUX.length - 1);
  jeu = construire(N);
  particules = []; confettis = [];
  entree.doigt = null; entree.incl = 0; entree.cG = entree.cD = entree.cP = false;
  partieEnCours = true;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  montrerHud(true);
  $('hud-carbu').classList.toggle('actif', jeu.avecCarbu);
  majHud();
  const aMontrer = (NIVEAUX[N].tuto || []).filter((k) => !prog.tutos[k]);
  if (aMontrer.length) ouvrirTuto(aMontrer);
  else demarrer();
}
function demarrer() {
  etat = 'jeu';
  afficher('');
  const def = NIVEAUX[N];
  toast(tr('intro', { n: N + 1, galaxie: tr(GALAXIES[def.gal].cle) }) + ' · ' + tr('objectif', { n: def.courses.length }), 2400);
}

/* =========================================================================
   PHYSIQUE ET RÈGLES
   ========================================================================= */
function graviteEn(x) {
  for (const z of jeu.zones) if (x >= z[0] && x < z[1]) return z[2];
  return jeu.def.g;
}
function cercleRect(cx, cy, r, x, y, w, h) {
  const px = borner(cx, x, x + w), py = borner(cy, y, y + h);
  return (cx - px) ** 2 + (cy - py) ** 2 < r * r;
}
const centrePlanete = (p) => ({ x: p.x + p.w / 2, y: p.y + 4 + p.R });
const centrePad = (p) => ({ x: p.x + p.w / 2, y: p.y });

function maj(dt) {
  const J = jeu;
  J.t += dt;
  const T = J.taxi;

  // plateformes mobiles
  J.pads.forEach((p) => {
    p.py = p.y;
    if (!p.mob) return;
    const ph = Math.sin(J.t * TAU / p.mob.per) * p.mob.amp;
    const nx = p.mob.ax === 'x' ? p.x0 + ph : p.x0, ny = p.mob.ax === 'y' ? p.y0 + ph : p.y0;
    p.vx = (nx - p.x) / dt; p.vy = (ny - p.y) / dt; p.x = nx; p.y = ny;
  });
  // astéroïdes
  J.ast.forEach((a) => {
    const f = (1 - Math.cos(J.t * TAU / a.p)) / 2;
    a.x = a.x1 + (a.x2 - a.x1) * f; a.y = a.y1 + (a.y2 - a.y1) * f; a.rot += dt * 0.8;
  });
  J.orb.forEach((a) => {
    const ang = a.ph + a.v * J.t;
    a.x = a.cx + Math.cos(ang) * a.ray; a.y = a.cy + Math.sin(ang) * a.ray; a.rot += dt * 1.2;
  });
  // vents (les rafales changent de sens ; les traînées clignotent juste avant)
  J.vents.forEach((v) => {
    if (!v.alt) return;
    const cycle = J.t / v.alt;
    v.dir = Math.floor(cycle) % 2 === 0 ? 1 : -1;
    v.alerte = cycle - Math.floor(cycle) > 0.8;
  });
  // portes à minuterie
  J.portes.forEach((p) => {
    if (p.ouvert && p.min > 0) {
      p.reste -= dt;
      if (p.reste <= 0 && !(T.visible && cercleRect(T.x, T.y, RAYON_TAXI + 2, p.x, p.y, p.l, p.h))) {
        p.ouvert = false; son('fermee'); toast(tr('porteFermee'));
      }
    }
    p.ouv += ((p.ouvert ? 1 : 0) - p.ouv) * Math.min(1, dt * 8);
  });
  J.boutons.forEach((b) => { b.allume = Math.max(0, b.allume - dt); });

  // passagers pressés
  [...J.attente, ...J.abord].forEach((p) => {
    if (!p.presse || p.retard) return;
    const avant = p.reste;
    p.reste -= dt;
    if (avant > 5 && p.reste <= 5) son('presse');
    if (p.reste <= 0) { p.reste = 0; p.retard = true; son('trop-tard'); toast(tr('tropTard')); }
  });

  // nouveaux passagers
  if (J.prochaine < J.courses.length && J.attente.length + J.abord.length < J.simul) {
    J.prochainDans -= dt;
    if (J.prochainDans <= 0) {
      const c = J.courses[J.prochaine++];
      J.attente.push({ de: c.de, a: c.a, esp: c.esp, coul: J.pads[c.a].c, presse: c.presse, reste: c.presse, retard: false, graine: Math.random() * 9 });
      J.prochainDans = 0.7;
      if (c.presse) toast(tr('estPresse'));
    }
  }

  // fin de niveau programmée
  if (J.fin) {
    J.fin.dans -= dt;
    if (J.fin.dans <= 0) { const f = J.fin; J.fin = null; if (f.type === 'victoire') victoire(); else defaite(f.type); return; }
  }

  // réapparition après un accident
  if (J.reapparition > 0) {
    J.reapparition -= dt;
    if (J.reapparition <= 0 && !J.fin) {
      const p = J.pads[J.dernierPad];
      Object.assign(T, { x: p.x + p.w * 0.35, y: p.y - PIEDS, vx: 0, vy: 0, a: 0, pose: p.i, offx: p.w * 0.35, visible: true, invincible: 1.5 });
      J.poseDepuis = 0; J.poseDoux = true; J.attendRelache = true;
    }
    majParticules(dt);
    return;
  }
  T.invincible = Math.max(0, T.invincible - dt);

  // commandes
  const veutPousser = entree.poussee || entree.cP;
  let incl = entree.incl;
  if (entree.cG) incl = -1;
  if (entree.cD) incl = 1;
  const peutPousser = veutPousser && (!J.avecCarbu || J.carbu > 0);
  T.flamme += ((peutPousser ? 1 : 0) - T.flamme) * Math.min(1, dt * 12);
  if (souffleGain) {
    souffleGain.gain.setTargetAtTime(peutPousser && !prog.muet ? 0.32 : 0, AC.currentTime, 0.05);
    souffleFiltre.frequency.setTargetAtTime(500 + 500 * T.flamme, AC.currentTime, 0.05);
  }

  if (T.pose >= 0) {
    // posé : le taxi suit sa plateforme
    const p = J.pads[T.pose];
    T.x = p.x + T.offx; T.y = p.y - PIEDS; T.a *= 0.8;
    J.poseDepuis += dt;
    if (p.c === 'S' && J.avecCarbu && J.carbu < 100) {
      J.carbu = Math.min(100, J.carbu + 45 * dt);
      J.sonPlein -= dt;
      if (J.sonPlein <= 0) { son('plein'); J.sonPlein = 0.45; }
      if (J.carbu >= 100) toast(tr('plein'));
      if (Math.random() < 0.3) bulle(T.x + (Math.random() - 0.5) * 20, T.y, '#6fe08a');
    }
    if (J.poseDepuis > 0.2) gererArret(p);
    if (J.avecCarbu && J.carbu <= 0 && p.c !== 'S' && !J.fin) { J.fin = { type: 'carburant', dans: 1 }; toast(tr('vide'), 2000); }
    // on redécolle après avoir lâché le doigt (ou en le gardant appuyé 1 seconde) :
    // un atterrissage fait doigt appuyé ne repart pas avant la dépose du passager
    if (!veutPousser) J.attendRelache = false;
    if (peutPousser && J.poseDepuis > 0.35 && (!J.attendRelache || J.poseDepuis > 1)) {
      T.pose = -1; T.vy = p.vy - 30; T.vx = p.vx; J.dernierPad = p.i;
    } else { majParticules(dt); return; }
  }

  // en vol
  const g = graviteEn(T.x);
  const cible = incl * INCLINAISON_MAX;
  if (incl !== 0) T.a += borner(cible - T.a, -4.2 * dt, 4.2 * dt);
  else T.a += borner(-T.a, -2.6 * dt, 2.6 * dt);
  let ax = 0, ay = g;
  if (peutPousser) {
    ax += Math.sin(T.a) * POUSSEE; ay -= Math.cos(T.a) * POUSSEE;
    if (J.avecCarbu) {
      J.carbu = Math.max(0, J.carbu - J.def.carbu.conso * dt);
      if (J.carbu < 25 && !J.alerteCarbu) { J.alerteCarbu = true; son('alerte'); toast(tr('reservoir')); }
    }
    if (Math.random() < 0.7) fumee(T);
  }
  if (J.avecCarbu && J.carbu > 40) J.alerteCarbu = false;
  J.vents.forEach((v) => {
    if (T.x > v.x1 && T.x < v.x2 && T.y > v.y1 && T.y < v.y2) ax += v.fx * v.dir;
  });
  T.vx += ax * dt; T.vy += ay * dt;
  T.vx *= 1 - 0.3 * dt;
  T.vx = borner(T.vx, -170, 170); T.vy = borner(T.vy, -170, 210);
  const yAvant = T.y;
  T.x += T.vx * dt; T.y += T.vy * dt;

  // atterrissage : les patins traversent le dessus d'une plateforme
  for (const p of J.pads) {
    if (yAvant + PIEDS <= p.py + 2 && T.y + PIEDS >= p.y && T.x >= p.x - 6 && T.x <= p.x + p.w + 6) {
      atterrir(p);
      break;
    }
  }
  if (T.pose < 0) collisions();
  majParticules(dt);
}

function atterrir(p) {
  const J = jeu, T = J.taxi;
  const rvy = T.vy - p.vy, rvx = Math.abs(T.vx - p.vx), aa = Math.abs(T.a);
  if (rvy > CORRECT.vy || rvx > CORRECT.vx || aa > CORRECT.a) { accident(); return; }
  const doux = rvy <= DOUX.vy && rvx <= DOUX.vx && aa <= DOUX.a;
  T.x = borner(T.x, p.x + 4, p.x + p.w - 4);
  T.pose = p.i; T.offx = T.x - p.x; T.y = p.y - PIEDS; T.vx = 0; T.vy = 0;
  J.dernierPad = p.i; J.poseDepuis = 0; J.poseDoux = doux; J.posees++; J.attendRelache = true;
  if (doux) {
    J.douces++; son('doux'); toast(tr('doux'), 1100);
    for (let k = 0; k < 12; k++) etincelle(T.x + (Math.random() - 0.5) * 30, T.y + PIEDS, '#fff6a8');
  } else {
    son('pose'); toast(tr('pose'), 1100); J.secousse = 0.15;
    for (let k = 0; k < 8; k++) poussiere(T.x + (Math.random() - 0.5) * 30, T.y + PIEDS);
  }
}

function collisions() {
  const J = jeu, T = J.taxi;
  // bords du monde : on rebondit doucement sur les côtés et le haut
  if (T.x < 14) { T.x = 14; T.vx = Math.abs(T.vx) * 0.4; }
  if (T.x > LW - 14) { T.x = LW - 14; T.vx = -Math.abs(T.vx) * 0.4; }
  if (T.y < 14) { T.y = 14; T.vy = Math.max(0, T.vy); }
  if (T.y > LH + 24) { accident(); return; }
  // boutons des portes
  J.boutons.forEach((b) => {
    if ((T.x - b.x) ** 2 + (T.y - b.y) ** 2 < (RAYON_TAXI + 13) ** 2) {
      if (b.allume <= 0) {
        let ouvre = false;
        J.portes.forEach((p) => {
          if (p.id !== b.id) return;
          if (!p.ouvert) ouvre = true;
          p.ouvert = true; p.reste = p.min;
        });
        son('bouton');
        if (ouvre) { son('porte'); toast(tr('porteOuverte')); }
        for (let k = 0; k < 8; k++) etincelle(b.x, b.y, '#7fe0ff');
      }
      b.allume = 0.5;
    }
  });
  if (T.invincible > 0) { murs(); return; }
  const cx = T.x, cy = T.y + 1, r = RAYON_TAXI;
  // plateformes (côtés et dessous), planètes, rochers
  for (const p of J.pads) {
    const h = p.R > 0 ? 8 : 16;
    if (cercleRect(cx, cy, r, p.x, p.y + 3, p.w, h - 3)) { accident(); return; }
    if (p.R > 0) {
      const c = centrePlanete(p);
      if ((cx - c.x) ** 2 + (cy - c.y) ** 2 < (p.R - 3 + r) ** 2) { accident(); return; }
    }
  }
  for (const o of J.obst) if ((cx - o[0]) ** 2 + (cy - o[1]) ** 2 < (o[2] - 3 + r) ** 2) { accident(); return; }
  for (const a of [...J.ast, ...J.orb]) if ((cx - a.x) ** 2 + (cy - a.y) ** 2 < (a.r - 2 + r) ** 2) { accident(); return; }
  murs();
}
function murs() {
  const J = jeu, T = J.taxi;
  const cx = T.x, cy = T.y + 1, r = RAYON_TAXI;
  for (const m of J.murs) if (cercleRect(cx, cy, r, m[0], m[1], m[2], m[3])) { accident(true); return; }
  for (const p of J.portes) if (p.ouv < 0.5 && cercleRect(cx, cy, r, p.x, p.y, p.l, p.h)) { accident(true); return; }
}

function accident(mur) {
  const J = jeu, T = J.taxi;
  if (J.reapparition > 0 || J.fin) return;
  if (mur && T.invincible > 0) {
    // juste après une réapparition : on repousse au lieu de casser
    T.vy = -T.vy * 0.5; T.vx = -T.vx * 0.5; return;
  }
  J.crash++; J.boucliers--;
  son('crash'); J.secousse = 0.5;
  for (let k = 0; k < 22; k++) etincelle(T.x, T.y, ['#ffd34d', '#ff8fc4', '#7fe0ff', '#ffffff'][k % 4], 140);
  T.visible = false; T.flamme = 0; T.pose = -1;
  J.reapparition = 1.4;
  majHud();
  if (J.boucliers <= 0) { J.fin = { type: 'boucliers', dans: 1.2 }; return; }
  if (J.avecCarbu && J.carbu <= 0) { J.fin = { type: 'carburant', dans: 1.2 }; return; }
  toast(tr('oups'));
}

// À l'arrêt sur une plateforme : dépose puis prise en charge
function gererArret(p) {
  const J = jeu, T = J.taxi;
  for (let k = J.abord.length - 1; k >= 0; k--) {
    const q = J.abord[k];
    if (q.a !== p.i) continue;
    J.abord.splice(k, 1);
    livrer(q, p);
  }
  for (let k = 0; k < J.attente.length; k++) {
    const q = J.attente[k];
    if (q.de !== p.i) continue;
    if (J.abord.length >= J.cap) { if (!J.pleinDit) { toast(tr('complet')); J.pleinDit = true; } break; }
    J.attente.splice(k, 1); k--;
    q.priseDouce = J.poseDoux; q.tPrise = J.t;
    J.abord.push(q);
    J.sautes.push({ esp: q.esp, coul: q.coul, x0: p.x + p.w * 0.72, y0: p.y, x1: T.x, y1: T.y, t: 0, monte: true });
    son('monte'); klaxon(prog.klaxon); toast(tr('monte'), 1000);
    J.pleinDit = false;
    majHud();
  }
}

function livrer(q, p) {
  const J = jeu, T = J.taxi;
  const de = centrePad(J.pads[q.de]), a = centrePad(p);
  const dist = Math.hypot(a.x - de.x, a.y - de.y);
  const par = 3.5 + dist / 48;
  const duree = J.t - q.tPrise;
  let tip = 2;
  if (q.priseDouce) tip += 2;
  if (J.poseDoux) tip += 2;
  if (duree <= par) tip += 2; else if (duree <= par * 1.7) tip += 1;
  if (q.presse && !q.retard) tip += 3;
  J.pieces += tip; J.livres++;
  if (!prog.especes[q.esp]) { prog.especes[q.esp] = true; J.nouvellesEspeces++; setTimeout(() => toast(tr('nouvelleEspece')), 900); }
  J.sautes.push({ esp: q.esp, coul: q.coul, x0: T.x, y0: T.y, x1: p.x + p.w * 0.8, y1: p.y, t: 0, monte: false });
  J.textes.push({ x: T.x, y: T.y - 26, t: 0, txt: tr('pourboire', { n: tip }) });
  for (let k = 0; k < Math.min(8, tip); k++) piece(T.x, T.y - 10);
  son('depose'); setTimeout(() => son('piece'), 200);
  majHud();
  if (J.livres >= J.courses.length && !J.fin) J.fin = { type: 'victoire', dans: 1.1 };
}

/* ---------- Particules ---------- */
function etincelle(x, y, c, v) {
  const a = Math.random() * TAU, s = (v || 70) * (0.3 + Math.random());
  particules.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, vie: 0.8, max: 0.8, c, r: 2 + Math.random() * 2, type: 'etoile', g: 40 });
}
function poussiere(x, y) {
  particules.push({ x, y, vx: (Math.random() - 0.5) * 60, vy: -Math.random() * 25, vie: 0.6, max: 0.6, c: 'rgba(220,210,255,.6)', r: 3 + Math.random() * 3, type: 'rond', g: 0 });
}
function fumee(T) {
  const a = T.a + Math.PI / 2 + (Math.random() - 0.5) * 0.4;
  particules.push({ x: T.x - Math.sin(T.a) * 10, y: T.y + Math.cos(T.a) * 10, vx: Math.cos(a) * 60 + T.vx * 0.3, vy: Math.sin(a) * 60 + T.vy * 0.3, vie: 0.45, max: 0.45, c: 'rgba(255,190,110,.5)', r: 2.5, type: 'rond', g: 0 });
}
function bulle(x, y, c) {
  particules.push({ x, y, vx: (Math.random() - 0.5) * 10, vy: -30, vie: 0.7, max: 0.7, c, r: 2, type: 'rond', g: 0 });
}
function piece(x, y) {
  particules.push({ x: x + (Math.random() - 0.5) * 16, y, vx: (Math.random() - 0.5) * 80, vy: -90 - Math.random() * 60, vie: 1.1, max: 1.1, c: '#ffd34d', r: 4, type: 'piece', g: 160 });
}
function majParticules(dt) {
  particules.forEach((p) => { p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; });
  particules = particules.filter((p) => p.vie > 0);
  if (jeu) {
    jeu.sautes.forEach((s) => { s.t += dt * 2; });
    jeu.sautes = jeu.sautes.filter((s) => s.t < 1 || (!s.monte && s.t < 2.2));
    jeu.textes.forEach((s) => { s.t += dt; s.y -= dt * 22; });
    jeu.textes = jeu.textes.filter((s) => s.t < 1.4);
    jeu.secousse = Math.max(0, jeu.secousse - dt);
  }
}

/* =========================================================================
   AFFICHAGE
   ========================================================================= */
function dessinerFond(gal, t) {
  const G = GALAXIES[gal];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, G.haut); g.addColorStop(1, G.bas);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // nébuleuses
  [[0.2, 0.25, 0.55, 0], [0.85, 0.65, 0.5, 1], [0.5, 0.95, 0.45, 0]].forEach(([x, y, r, k]) => {
    const rg = ctx.createRadialGradient(x * W, y * H, 0, x * W, y * H, r * Math.max(W, H));
    rg.addColorStop(0, G.neb[k]); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  });
  // étoiles qui scintillent
  etoilesFond.forEach((e) => {
    ctx.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(t * e.v + e.p));
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(e.x * W, e.y * H, e.r, e.r);
  });
  ctx.globalAlpha = 1;
}
function versMonde() {
  let sx = 0, sy = 0;
  if (jeu && jeu.secousse > 0) { sx = (Math.random() - 0.5) * 8 * jeu.secousse; sy = (Math.random() - 0.5) * 8 * jeu.secousse; }
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * (OX + sx), DPR * (OY + sy));
}

// ctx : canevas du jeu par défaut, ou celui du tutoriel
function dessinerPad(p, G, t, ctx = canvas.getContext('2d')) {
  const coul = p.c === 'S' ? null : COULEURS[p.c];
  if (p.R > 0) {
    const c = centrePlanete(p);
    dessinerPlanete(ctx, c.x, c.y, p.R, G.planete, p.i + 1);
    if (coul) {
      ctx.globalAlpha = 0.9;
      dessinerForme(ctx, coul.forme, c.x, c.y + 4, Math.min(14, p.R * 0.36), coul.c);
      ctx.globalAlpha = 1;
    }
  } else {
    // plateforme flottante : petits réacteurs dessous
    ctx.fillStyle = '#4a4f72'; rr(ctx, p.x + 6, p.y + 6, p.w - 12, 10, 4); ctx.fill();
    ctx.fillStyle = 'rgba(127,224,255,' + (0.5 + 0.3 * Math.sin(t * 9)) + ')';
    ctx.beginPath(); ctx.arc(p.x + 16, p.y + 19, 3, 0, TAU); ctx.arc(p.x + p.w - 16, p.y + 19, 3, 0, TAU); ctx.fill();
    if (coul) dessinerForme(ctx, coul.forme, p.x + p.w / 2, p.y + 11, 4.5, coul.c);
  }
  // dessus de la plateforme
  if (p.c === 'S') {
    ctx.save(); rr(ctx, p.x, p.y, p.w, 8, 3); ctx.clip();
    for (let k = -1; k < p.w / 8 + 1; k++) { ctx.fillStyle = k % 2 ? '#2d2a3a' : '#6fe08a'; ctx.beginPath(); ctx.moveTo(p.x + k * 8, p.y + 8); ctx.lineTo(p.x + k * 8 + 8, p.y); ctx.lineTo(p.x + k * 8 + 16, p.y); ctx.lineTo(p.x + k * 8 + 8, p.y + 8); ctx.fill(); }
    ctx.restore();
    // pompe
    const px = p.x + p.w - 14;
    ctx.fillStyle = '#e8edf8'; rr(ctx, px, p.y - 18, 10, 18, 2); ctx.fill();
    ctx.fillStyle = '#6fe08a'; ctx.fillRect(px + 2, p.y - 15, 6, 5);
    ctx.strokeStyle = '#e8edf8'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(px, p.y - 10); ctx.quadraticCurveTo(px - 6, p.y - 10, px - 5, p.y - 3); ctx.stroke();
    ctx.fillStyle = '#6fe08a'; ctx.beginPath(); ctx.moveTo(px + 5, p.y - 30); ctx.quadraticCurveTo(px + 10, p.y - 23, px + 5, p.y - 21); ctx.quadraticCurveTo(px, p.y - 23, px + 5, p.y - 30); ctx.fill();
  } else {
    ctx.fillStyle = coul.f; rr(ctx, p.x, p.y + 2, p.w, 7, 3); ctx.fill();
    ctx.fillStyle = coul.c; rr(ctx, p.x, p.y, p.w, 6, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(p.x + 5, p.y + 1, p.w - 10, 1.5);
  }
  // feux clignotants aux bouts
  const on = Math.sin(t * 4 + p.i) > 0;
  ctx.fillStyle = on ? '#ffffff' : 'rgba(255,255,255,.3)';
  ctx.beginPath(); ctx.arc(p.x + 3, p.y - 2, 1.8, 0, TAU); ctx.arc(p.x + p.w - 3, p.y - 2, 1.8, 0, TAU); ctx.fill();
}

function dessinerNiveau() {
  const J = jeu, G = GALAXIES[J.def.gal], t = horloge;
  dessinerFond(J.def.gal, t);
  versMonde();
  // bords du ciel (lignes pointillées discrètes)
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1; ctx.setLineDash([4, 8]);
  ctx.strokeRect(0.5, 0.5, LW - 1, LH - 1); ctx.setLineDash([]);
  // zones de gravité
  J.zones.forEach((z) => {
    const g = z[2], leger = g < 35, lourd = g > 55;
    ctx.fillStyle = leger ? 'rgba(127,224,255,.07)' : lourd ? 'rgba(255,110,110,.08)' : 'rgba(255,255,255,.02)';
    ctx.fillRect(z[0], 0, z[1] - z[0], LH);
    const n = leger ? 1 : lourd ? 3 : 2;
    ctx.strokeStyle = leger ? 'rgba(127,224,255,.35)' : lourd ? 'rgba(255,130,130,.4)' : 'rgba(255,255,255,.18)';
    ctx.lineWidth = 2.5;
    for (let y = 60; y < LH; y += 150) {
      const cx = (z[0] + z[1]) / 2, dec = ((t * (g / 25)) % 1) * 8;
      for (let k = 0; k < n; k++) {
        const yy = y + k * 9 + dec;
        ctx.beginPath(); ctx.moveTo(cx - 9, yy); ctx.lineTo(cx, yy + 7); ctx.lineTo(cx + 9, yy); ctx.stroke();
      }
    }
  });
  // vents
  J.vents.forEach((v, iv) => {
    ctx.fillStyle = v.alerte && Math.sin(t * 30) > 0 ? 'rgba(255,240,150,.16)' : 'rgba(255,154,77,.08)';
    ctx.fillRect(v.x1, v.y1, v.x2 - v.x1, v.y2 - v.y1);
    ctx.strokeStyle = 'rgba(255,200,120,.45)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    const sens = Math.sign(v.fx) * v.dir;
    for (let k = 0; k < 9; k++) {
      const yy = v.y1 + ((k * 37 + iv * 13) % Math.max(10, v.y2 - v.y1));
      const larg = v.x2 - v.x1;
      let xx = ((k * 71 + t * 120) % (larg + 60)) - 30;
      xx = sens > 0 ? v.x1 + xx : v.x2 - xx;
      ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx - 22 * sens, yy); ctx.stroke();
    }
  });
  // planètes-rochers
  J.obst.forEach((o, k) => dessinerPlanete(ctx, o[0], o[1], o[2], G.rocher, k + 7));
  // murs (poutres)
  J.murs.forEach((m) => {
    ctx.fillStyle = '#596085'; ctx.fillRect(m[0], m[1], m[2], m[3]);
    ctx.strokeStyle = '#8890b8'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let x = m[0]; x < m[0] + m[2]; x += 14) { ctx.moveTo(x, m[1]); ctx.lineTo(Math.min(x + 14, m[0] + m[2]), m[1] + m[3]); }
    ctx.stroke(); ctx.strokeRect(m[0], m[1], m[2], m[3]);
  });
  // portes magnétiques
  J.portes.forEach((p) => {
    ctx.fillStyle = '#3c4266';
    ctx.fillRect(p.x - 3, p.y - 4, 7, p.h + 8); ctx.fillRect(p.x + p.l - 4, p.y - 4, 7, p.h + 8);
    const a = 1 - p.ouv;
    if (a > 0.02) {
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(127,224,255,.25)'; ctx.fillRect(p.x, p.y, p.l, p.h);
      ctx.strokeStyle = '#bff3ff'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let k = 0; k < 3; k++) {
        const yy = p.y + p.h * (k + 1) / 4;
        ctx.moveTo(p.x, yy);
        for (let x = p.x; x <= p.x + p.l; x += 8) ctx.lineTo(x, yy + Math.sin(x * 0.4 + t * 20 + k) * 2);
      }
      ctx.stroke(); ctx.globalAlpha = 1;
    } else {
      ctx.setLineDash([3, 6]); ctx.strokeStyle = 'rgba(127,224,255,.3)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(p.x, p.y + p.h / 2); ctx.lineTo(p.x + p.l, p.y + p.h / 2); ctx.stroke(); ctx.setLineDash([]);
    }
  });
  // boutons
  J.boutons.forEach((b) => {
    const porte = J.portes.find((p) => p.id === b.id);
    const ouvert = porte && porte.ouvert;
    ctx.fillStyle = '#3c4266'; ctx.beginPath(); ctx.arc(b.x, b.y, 13, 0, TAU); ctx.fill();
    ctx.fillStyle = ouvert ? '#2a9fbf' : '#7fe0ff';
    ctx.beginPath(); ctx.arc(b.x, b.y + (ouvert ? 1 : 0), 8.5, 0, TAU); ctx.fill();
    if (!ouvert) { ctx.strokeStyle = 'rgba(127,224,255,' + (0.3 + 0.3 * Math.sin(t * 5)) + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, 17 + Math.sin(t * 5) * 2, 0, TAU); ctx.stroke(); }
    if (porte && porte.ouvert && porte.min > 0) {
      ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x, b.y, 16, -Math.PI / 2, -Math.PI / 2 + TAU * Math.max(0, porte.reste / porte.min)); ctx.stroke();
    }
  });
  // plateformes
  J.pads.forEach((p) => dessinerPad(p, G, t));
  // flèches au-dessus des destinations des passagers à bord
  J.abord.forEach((q, k) => {
    const p = J.pads[q.a], c = COULEURS[q.coul];
    const x = p.x + p.w / 2 + (k - (J.abord.length - 1) / 2) * 4, y = p.y - 34 - Math.abs(Math.sin(t * 4 + k)) * 8;
    ctx.fillStyle = c.c; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x - 9, y); ctx.lineTo(x + 9, y); ctx.lineTo(x, y + 11); ctx.closePath(); ctx.fill(); ctx.stroke();
  });
  // passagers qui attendent
  const parPad = {};
  J.attente.forEach((q) => {
    const p = J.pads[q.de]; const k = parPad[q.de] = (parPad[q.de] || 0) + 1;
    const x = p.x + p.w - 14 - (k - 1) * 15, y = p.y;
    if (q.presse && !q.retard) {
      ctx.strokeStyle = q.reste < 6 && Math.sin(t * 16) > 0 ? '#ff6b6b' : '#ffd34d'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(x, y - 9, 13, -Math.PI / 2, -Math.PI / 2 + TAU * q.reste / q.presse); ctx.stroke();
    }
    dessinerAlien(ctx, x, y, 1.05, q.esp, q.coul, t, { salue: true, saut: q.presse && !q.retard, boude: q.retard, graine: q.graine });
  });
  // passagers qui montent ou descendent
  J.sautes.forEach((s) => {
    const u = Math.min(1, s.t);
    const x = s.x0 + (s.x1 - s.x0) * u, y = s.y0 + (s.y1 - s.y0) * u - Math.sin(u * Math.PI) * 22;
    ctx.globalAlpha = s.monte ? 1 - u * 0.5 : Math.max(0, 1 - Math.max(0, s.t - 1.4) / 0.8);
    dessinerAlien(ctx, x, y, s.monte ? 1.05 - u * 0.4 : 1.05, s.esp, s.coul, horloge, { salue: !s.monte && u >= 1 });
    ctx.globalAlpha = 1;
  });
  // astéroïdes
  J.ast.forEach((a) => dessinerRocher(ctx, a.x, a.y, a.r, a.rot, G.rocher));
  J.orb.forEach((a) => dessinerRocher(ctx, a.x, a.y, a.r, a.rot, G.rocher));
  // taxi
  const T = J.taxi;
  // aide à l'atterrissage : ligne vers la plateforme du dessous,
  // verte = en douceur, orange = correct, rouge = trop vite ou trop penché
  if (T.visible && T.pose < 0) {
    const sous = J.pads.find((p) => T.x >= p.x - 6 && T.x <= p.x + p.w + 6 && p.y > T.y && p.y - T.y < 150);
    if (sous) {
      const rvy = T.vy - sous.vy, rvx = Math.abs(T.vx - sous.vx), aa = Math.abs(T.a);
      const coul = rvy <= DOUX.vy && rvx <= DOUX.vx && aa <= DOUX.a ? '#6fe08a'
        : rvy <= CORRECT.vy && rvx <= CORRECT.vx && aa <= CORRECT.a ? '#ffb347' : '#ff5b5b';
      ctx.strokeStyle = coul; ctx.lineWidth = 2; ctx.setLineDash([3, 5]); ctx.globalAlpha = 0.8;
      ctx.beginPath(); ctx.moveTo(T.x, T.y + PIEDS + 4); ctx.lineTo(T.x, sous.y - 1); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = coul; ctx.beginPath(); ctx.ellipse(T.x, sous.y - 1, 9, 2.5, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

// Écran titre : un grand taxi au milieu des planètes (sert aussi de jaquette)

  // astéroïde qui passe
