function dessinerConfettis(dt) {
  if (!confettis.length) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  confettis.forEach((c) => {
    c.vie -= dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 120 * dt; c.rot += c.vr * dt;
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.globalAlpha = Math.max(0, Math.min(1, c.vie));
    if (c.etoile) { cheminEtoile(ctx, 0, 0, 7, 3, 5); ctx.fillStyle = c.c; ctx.fill(); }
    else { ctx.fillStyle = c.c; ctx.fillRect(-4, -2.5, 8, 5); }
    ctx.restore();
  });
  ctx.globalAlpha = 1;
  confettis = confettis.filter((c) => c.vie > 0 && c.y < H + 30);
}
function lancerConfettis() {
  const cs = ['#ffd34d', '#ff6fae', '#5ab8ff', '#6fe08a', '#b58cff', '#ff9a4d'];
  for (let k = 0; k < 90; k++) {
    confettis.push({ x: W / 2 + (Math.random() - 0.5) * W * 0.6, y: H * 0.2 + Math.random() * 40, vx: (Math.random() - 0.5) * 320, vy: -150 - Math.random() * 250, rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 10, c: cs[k % 6], vie: 3 + Math.random(), etoile: k % 5 === 0 });
  }
}

/* ---------- Boucle principale ---------- */
let dernier = 0;
function boucle(ts) {
  const dt = Math.min(0.033, Math.max(0, (ts - dernier) / 1000));
  dernier = ts;
  if (etat !== 'pause') horloge += dt;
  try {
    if (etat === 'jeu') { maj(dt); majHudVol(); }
    else if (souffleGain && AC) souffleGain.gain.setTargetAtTime(0, AC.currentTime, 0.05);
    if (etat === 'fin' && jeu) majParticules(dt);
    if (ecransJeu.includes(etat) && jeu) dessinerNiveau();
    else if (etat === 'titre') dessinerTitre();
    else dessinerFond(etat === 'garage' ? 2 : 1, horloge);
    if (etat === 'tuto') dessinerTuto();
    dessinerConfettis(etat === 'pause' ? 0 : dt);
  } finally {
    requestAnimationFrame(boucle);
  }
}

      c.strokeStyle = 'rgba(255,200,120,.7)'; c.lineWidth = 2;
      for (let i = 0; i < 8; i++) { let x = (i * 47 + t * 120) % 290 - 15; if (dir < 0) x = 260 - x; const y = 48 + (i * 19) % 56; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 20 * dir, y); c.stroke(); }
      dessinerTaxi(c, 130, 75, -0.4 * dir, 1.3, ci, 0.9, t, []);
      break;
    }
    default: break;
  }
}

/* =========================================================================
   FINS DE NIVEAU
   ========================================================================= */
function piecesMax() { return jeu.courses.reduce((s, c) => s + 8 + (c.presse ? 3 : 0), 0); }
function arretPartie() {
  partieEnCours = false;
  entree.doigt = null; entree.poussee = false; entree.cP = entree.cG = entree.cD = false;
  if (souffleGain && AC) souffleGain.gain.setTargetAtTime(0, AC.currentTime, 0.03);
}
function victoire() {
  const J = jeu;
  arretPartie();
  etat = 'fin';
  const ratio = J.pieces / piecesMax();
  const etoiles = 1 + (ratio >= 0.5 ? 1 : 0) + (ratio >= 0.75 && J.crash === 0 ? 1 : 0);
  const avantTotal = totalEtoiles();
  const ancienRecord = prog.record[N];
  prog.etoiles[N] = Math.max(prog.etoiles[N], etoiles);
  prog.record[N] = Math.max(prog.record[N], J.pieces);
  if (N + 1 < NIVEAUX.length) prog.debloque = Math.max(prog.debloque, N + 1);
  const apresTotal = totalEtoiles();
  garderProg();
  if (window.FMG) window.FMG.reportEnd({ completed: true, level: N + 1 });
  JEL_SAVE.save(JEU, { niveau: Math.min(N + 2, NIVEAUX.length), score: totalPieces(), prog });

  $('fin-titre').textContent = tr(N === NIVEAUX.length - 1 ? 'fin.galaxies' : (N % 5 === 4 ? 'fin.galaxie' : 'fin.bravo'));
  $('fin-sous').textContent = N === NIVEAUX.length - 1 ? tr('fin.toutFini', { n: nb(apresTotal), max: nb(MAX_ETOILES) }) : tr('fin.niveau', { n: nb(N + 1) });
  montrerEtoiles(etoiles);
  compterPieces(J.pieces);
  remplirDetails([
    tr('fin.passagers', { a: nb(J.livres), b: nb(J.courses.length) }),
    tr('fin.douces', { a: nb(J.douces), b: nb(J.posees) }),
    tr('fin.accidents', { n: nb(J.crash) }),
  ].concat(etoiles < 3 ? [tr('fin.astuce')] : []));
  const rec = $('fin-record');
  rec.classList.toggle('nouveau', J.pieces > ancienRecord);
  rec.textContent = J.pieces > ancienRecord ? tr('fin.record') : tr('fin.recordAncien', { n: ancienRecord });
  const deb = $('fin-debloque'); deb.innerHTML = '';
  CARROSSERIES.forEach((c) => { if (c.etoiles > avantTotal && c.etoiles <= apresTotal) ajouterLigne(deb, tr('fin.carrosserie', { nom: tr('carr.' + c.cle) })); });
  KLAXONS.forEach((c) => { if (c.etoiles > avantTotal && c.etoiles <= apresTotal) ajouterLigne(deb, tr('fin.klaxon', { nom: tr('klax.' + c.cle) })); });
  if (J.nouvellesEspeces) ajouterLigne(deb, tr('fin.especes', { n: J.nouvellesEspeces }));
  boutonsFin(true);
  afficher('ecran-fin');
  son('victoire'); lancerConfettis();
}
function defaite(raison) {
  const J = jeu;
  arretPartie();
  etat = 'fin';
  if (window.FMG) window.FMG.reportEnd({ completed: false, level: N + 1 });
  $('fin-titre').textContent = tr('fin.oh');
  $('fin-sous').textContent = tr(raison === 'carburant' ? 'fin.carburant' : 'fin.boucliers');
  montrerEtoiles(0);
  $('fin-pieces').textContent = tr('fin.pieces', { n: J.pieces });
  remplirDetails([tr('fin.passagers', { a: nb(J.livres), b: nb(J.courses.length) }), tr('fin.conseil')]);
  $('fin-record').classList.remove('nouveau');
  $('fin-record').textContent = prog.record[N] ? tr('fin.recordAncien', { n: prog.record[N] }) : '';
  $('fin-debloque').innerHTML = '';
  boutonsFin(false);
  afficher('ecran-fin');
  son('defaite');
}
function ajouterLigne(parent, texte) { const p = document.createElement('p'); p.textContent = texte; parent.appendChild(p); }
function remplirDetails(lignes) {
  const ul = $('fin-details'); ul.innerHTML = '';
  lignes.forEach((l) => { const li = document.createElement('li'); li.textContent = l; ul.appendChild(li); });
}
function montrerEtoiles(n) {
  const sp = $('fin-etoiles').querySelectorAll('span');
  sp.forEach((s) => s.classList.remove('on'));
  $('fin-etoiles').setAttribute('aria-label', tr('fin.etoilesAria', { n }));
  for (let k = 0; k < n; k++) setTimeout(() => { if (etat === 'fin') { sp[k].classList.add('on'); son('etoile'); } }, 450 + k * 380);
}
let compteur = 0;
function compterPieces(total) {
  cancelAnimationFrame(compteur);
  const debut = performance.now();
  const pas = () => {
    const u = Math.min(1, (performance.now() - debut) / 1000);
    $('fin-pieces').textContent = tr('fin.pieces', { n: Math.round(total * u) });
    if (u < 1) compteur = requestAnimationFrame(pas);
  };
  pas();
}
function boutonsFin(gagne) {
  const dernierNiveau = N >= NIVEAUX.length - 1;
  $('b-suivant').hidden = !gagne || dernierNiveau;
  $('b-reessayer').hidden = gagne;
  $('b-rejouer').hidden = !gagne;
  setTimeout(() => { const b = gagne && !dernierNiveau ? $('b-suivant') : gagne ? $('b-rejouer') : $('b-reessayer'); if (etat === 'fin') b.focus({ preventScroll: true }); }, 50);
}

/* =========================================================================
   PAUSE, ACCUEIL, NIVEAUX, GARAGE
   ========================================================================= */
function mettrePause() {
  if (etat !== 'jeu' && etat !== 'tuto') return;
  etatAvantPause = etat;
  etat = 'pause';
  entree.doigt = null; entree.poussee = false; entree.cP = entree.cG = entree.cD = false;
  if (souffleGain && AC) souffleGain.gain.setTargetAtTime(0, AC.currentTime, 0.02);
  afficher('ecran-pause');
  setTimeout(() => $('b-reprendre').focus({ preventScroll: true }), 30);
}
let etatAvantPause = 'jeu';
function reprendre() {
  if (etat !== 'pause') return;
  if (etatAvantPause === 'tuto') { etat = 'tuto'; afficher('ecran-tuto'); tutoDebut = horloge; return; }
  etat = 'jeu'; afficher('');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function allerAccueil() {
  arretPartie();
  jeu = null; confettis = [];
  etat = 'titre';
  montrerHud(false);
  afficher('ecran-titre');
}

function ouvrirNiveaux() {
  arretPartie();
  etat = 'niveaux'; montrerHud(false); confettis = [];
  afficher('ecran-niveaux');
  $('niv-total').textContent = '★ ' + tr('total', { n: nb(totalEtoiles()), max: nb(MAX_ETOILES) });
  const liste = $('liste-niveaux'); liste.innerHTML = '';
  GALAXIES.forEach((G, g) => {
    const bloc = document.createElement('div'); bloc.className = 'galaxie';
    const h = document.createElement('h3'); h.textContent = tr(G.cle); bloc.appendChild(h);
    const grille = document.createElement('div'); grille.className = 'grille';
    for (let i = g * 5; i < g * 5 + 5 && i < NIVEAUX.length; i++) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'niv';
      if (i <= prog.debloque) {
        const n = document.createElement('span'); n.textContent = nb(i + 1); b.appendChild(n);
        const e = document.createElement('span'); e.className = 'et';
        for (let s = 0; s < 3; s++) { const st = document.createElement('span'); st.textContent = '★'; if (s >= prog.etoiles[i]) st.className = 'off'; e.appendChild(st); }
        b.appendChild(e);
        b.setAttribute('aria-label', tr('niveauAria', { n: nb(i + 1), e: prog.etoiles[i] }));
        b.addEventListener('click', () => { audio(); son('clic'); lancerNiveau(i); });
      } else {
        b.classList.add('ferme'); b.disabled = true;
        b.innerHTML = '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="9" width="12" height="9" rx="2" fill="currentColor"/><path d="M7 9V6a3 3 0 0 1 6 0v3" stroke="currentColor" stroke-width="2" fill="none"/></svg>';
        b.setAttribute('aria-label', tr('verrouille'));
      }
      grille.appendChild(b);
    }
    bloc.appendChild(grille); liste.appendChild(bloc);
  });
  $('ecran-niveaux').scrollTop = 0;
}

let ongletGarage = 'carrosseries';
function ouvrirGarage(onglet) {
  ongletGarage = onglet || ongletGarage;
  etat = 'garage'; montrerHud(false);
  afficher('ecran-garage');
  const total = totalEtoiles();
  $('garage-total').textContent = '★ ' + tr('total', { n: nb(total), max: nb(MAX_ETOILES) });
  document.querySelectorAll('[data-onglet]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.onglet === ongletGarage ? 'true' : 'false'));
  const grille = $('garage-grille'); grille.innerHTML = '';
  const info = $('garage-info');
  if (ongletGarage === 'carrosseries') {
    info.textContent = tr('garage.infoCarr');
    CARROSSERIES.forEach((c, i) => {
      const ouvert = total >= c.etoiles;
      const b = objetGarage(tr('carr.' + c.cle), ouvert, c.etoiles, i === prog.carrosserie);
      const cv = b.querySelector('canvas'), x = cv.getContext('2d');
      x.setTransform(2, 0, 0, 2, 0, 0); dessinerTaxi(x, 44, 33, 0, 1.55, i, 0, 1.2, []);
      if (ouvert) b.addEventListener('click', () => { audio(); son('clic'); prog.carrosserie = i; garderProg(); ouvrirGarage(); });
      grille.appendChild(b);
    });
  } else if (ongletGarage === 'klaxons') {
    info.textContent = tr('garage.infoKlax');
    KLAXONS.forEach((k, i) => {
      const ouvert = total >= k.etoiles;
      const b = objetGarage(tr('klax.' + k.cle), ouvert, k.etoiles, i === prog.klaxon);
      const cv = b.querySelector('canvas'), x = cv.getContext('2d');
      x.setTransform(2, 0, 0, 2, 0, 0);
      x.fillStyle = ouvert ? '#ffd34d' : '#6d6499';
      x.beginPath(); x.moveTo(26, 26); x.lineTo(34, 26); x.lineTo(48, 16); x.lineTo(48, 46); x.lineTo(34, 36); x.lineTo(26, 36); x.closePath(); x.fill();
      x.strokeStyle = x.fillStyle; x.lineWidth = 2.5; x.lineCap = 'round';
      for (let n = 0; n <= i % 3; n++) { x.beginPath(); x.arc(48, 31, 7 + n * 6, -0.7, 0.7); x.stroke(); }
      if (ouvert) b.addEventListener('click', () => { audio(); prog.klaxon = i; garderProg(); klaxon(i); ouvrirGarage(); });
      grille.appendChild(b);
    });
  } else {
    const vus = prog.especes.filter(Boolean).length;
    info.textContent = tr('garage.album', { n: nb(vus), max: nb(ESPECES.length) });
    ESPECES.forEach((e, i) => {
      const vu = prog.especes[i];
      const b = objetGarage(vu ? tr('esp.' + e.cle) : tr('garage.inconnu'), true, 0, false);
      const cv = b.querySelector('canvas'), x = cv.getContext('2d');
      x.setTransform(2, 0, 0, 2, 0, 0);
      if (vu) dessinerAlien(x, 44, 54, 2.3, i, i % COULEURS.length, 1 + i, { salue: true });
      else { x.globalAlpha = 0.35; dessinerAlien(x, 44, 54, 2.3, i, { c: '#3a3366', f: '#29234d' }, 1, {}); x.globalAlpha = 1; }
      b.addEventListener('click', () => { if (vu) { audio(); son('monte'); } });
      grille.appendChild(b);
    });
  }
}
function objetGarage(nom, ouvert, etoiles, choisi) {
  const b = document.createElement('button'); b.type = 'button';
  b.className = 'objet' + (choisi ? ' choisi' : '') + (ouvert ? '' : ' ferme');
  const cv = document.createElement('canvas'); cv.width = 176; cv.height = 124; b.appendChild(cv);
  const n = document.createElement('span'); n.textContent = nom; b.appendChild(n);
  if (!ouvert) { const r = document.createElement('span'); r.className = 'req'; r.textContent = '★ ' + tr('garage.requis', { n: nb(etoiles) }); b.appendChild(r); }
  else if (choisi) { const r = document.createElement('span'); r.className = 'req'; r.textContent = tr('garage.choisi'); b.appendChild(r); }
  b.setAttribute('aria-pressed', choisi ? 'true' : 'false');
  return b;
}

/* =========================================================================
   COMMANDES : doigt (appuyer = réacteur, glisser = pencher), clavier, souris
   ========================================================================= */
canvas.addEventListener('pointerdown', (e) => {
  audio();
  if (etat !== 'jeu') return;
  e.preventDefault();
  entree.doigt = e.pointerId; entree.x0 = e.clientX; entree.incl = 0; entree.poussee = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* rien */ }
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== entree.doigt) return;
  const dx = e.clientX - entree.x0;
  entree.incl = Math.abs(dx) < 6 ? 0 : borner(dx / 50, -1, 1);
  // si le doigt va trop loin, le point de départ le suit (on peut revenir vite)
  if (dx > 60) entree.x0 = e.clientX - 60;
  if (dx < -60) entree.x0 = e.clientX + 60;
});
function finDoigt(e) {
  if (e.pointerId !== entree.doigt) return;
  entree.doigt = null; entree.poussee = false; entree.incl = 0;
}
canvas.addEventListener('pointerup', finDoigt);
canvas.addEventListener('pointercancel', finDoigt);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

const TOUCHES_POUSSEE = ['ArrowUp', 'Space', 'KeyW'];
const TOUCHES_G = ['ArrowLeft', 'KeyA'];
const TOUCHES_D = ['ArrowRight', 'KeyD'];
document.addEventListener('keydown', (e) => {
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (etat === 'jeu' || etat === 'tuto') { e.preventDefault(); audio(); mettrePause(); return; }
    if (etat === 'pause') { e.preventDefault(); reprendre(); return; }
  }
  if (etat === 'tuto' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp')) { e.preventDefault(); suiteTuto(); return; }
  if (etat !== 'jeu') return;
  audio();
  if (TOUCHES_POUSSEE.includes(e.code)) { entree.cP = true; e.preventDefault(); }
  if (TOUCHES_G.includes(e.code)) { entree.cG = true; e.preventDefault(); }
  if (TOUCHES_D.includes(e.code)) { entree.cD = true; e.preventDefault(); }
  if (e.code === 'KeyH' && !e.repeat) klaxonner();
});
document.addEventListener('keyup', (e) => {
  if (TOUCHES_POUSSEE.includes(e.code)) entree.cP = false;
  if (TOUCHES_G.includes(e.code)) entree.cG = false;
  if (TOUCHES_D.includes(e.code)) entree.cD = false;
});
window.addEventListener('blur', () => { entree.cP = entree.cG = entree.cD = false; entree.doigt = null; entree.poussee = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });

function klaxonner() {
  audio(); klaxon(prog.klaxon);
  if (!jeu) return;
  // les passagers qui attendent sautent de joie
  jeu.attente.forEach((q) => { const p = jeu.pads[q.de]; for (let k = 0; k < 3; k++) etincelle(p.x + p.w - 14, p.y - 20, '#fff6a8', 40); });
}

$('ecran-tuto').addEventListener('click', (e) => { if (e.target.closest('jel-langue, .jel-langue')) return; suiteTuto(); });
$('b-jouer').addEventListener('click', () => {
  audio(); son('clic');
  JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => {
      const n = borner(((d && d.niveau) || 1) - 1, 0, NIVEAUX.length - 1);
      prog.debloque = Math.max(prog.debloque, n);
      lancerNiveau(n);
    },
    onNouvelle: () => lancerNiveau(0),
  });
});
$('b-niveaux').addEventListener('click', () => { audio(); son('clic'); ouvrirNiveaux(); });
$('b-garage').addEventListener('click', () => { audio(); son('clic'); ouvrirGarage('carrosseries'); });
$('b-niv-retour').addEventListener('click', () => { son('clic'); allerAccueil(); });
$('b-garage-retour').addEventListener('click', () => { son('clic'); allerAccueil(); });
document.querySelectorAll('[data-onglet]').forEach((b) => b.addEventListener('click', () => { audio(); son('clic'); ouvrirGarage(b.dataset.onglet); }));
$('b-pause').addEventListener('click', () => { audio(); son('clic'); mettrePause(); });
$('b-klaxon').addEventListener('click', () => { klaxonner(); if (document.activeElement) document.activeElement.blur(); });
$('b-reprendre').addEventListener('click', () => { audio(); son('clic'); reprendre(); });
$('b-recommencer').addEventListener('click', () => { audio(); son('clic'); lancerNiveau(N); });
$('b-accueil').addEventListener('click', () => { son('clic'); allerAccueil(); });
$('b-suivant').addEventListener('click', () => { audio(); son('clic'); lancerNiveau(N + 1); });
$('b-rejouer').addEventListener('click', () => { audio(); son('clic'); lancerNiveau(N); });
$('b-reessayer').addEventListener('click', () => { audio(); son('clic'); lancerNiveau(N); });
$('b-fin-niveaux').addEventListener('click', () => { son('clic'); ouvrirNiveaux(); });
$('b-fin-accueil').addEventListener('click', () => { son('clic'); allerAccueil(); });
document.querySelectorAll('.son').forEach((b) => b.addEventListener('click', () => { audio(); basculerSon(); son('clic'); }));

// Sauvegarde à la fermeture de la page, seulement pendant une partie
JEL_SAVE.surFermeture(() => {
  if (partieEnCours && jeu) JEL_SAVE.save(JEU, { niveau: N + 1, score: totalPieces(), prog });
});

// Changement de langue sur place : textes écrits par le script
if (window.JEL_I18N && window.JEL_I18N.surChangement) {
  window.JEL_I18N.surChangement(() => {
    majHud();
    if (etat === 'niveaux') ouvrirNiveaux();
    if (etat === 'garage') ouvrirGarage();
    if (etat === 'tuto' || (etat === 'pause' && etatAvantPause === 'tuto')) majTuto();
  });
}

window.addEventListener('resize', redimensionner);
redimensionner();
majBoutonsSon();
afficher('ecran-titre');
requestAnimationFrame(boucle);
</script>
