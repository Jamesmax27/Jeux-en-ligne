  // ------------------------------------------------------------------------
  function peutEntrer(m, e, i) {
    if (i < 0 || !passeRoyal(m, i, e.role)) return false;
    if (m.t[i] === CACHE && m.royaux.some((o) => o !== e && (o.cache === i || (o.n === i)))) return false;
    return true;
  }
  function visibleParRats(m, e) { return e.cache < 0 && !e.refuge && (e.etat === 'suivre' || e.joueur); }

  function departRoyal(m, e) {
    // On quitte la case e.c vers e.n
    if (e.cache >= 0) { e.cache = -1; m.ev.push({ type: 'sortCache', role: e.role, i: e.c }); }
    if (e.refuge) e.refuge = false;
    if (m.t[e.c] === PORTE) { e.porteRecente = e.c; e.porteT = m.temps; }
  }

  function arriveeRoyal(m, e) {
    const i = e.c;
    e.prec = e.precTmp; 
    e.pas++;
    m.ev.push({ type: 'pas', role: e.role, joueur: e.joueur, i });
    if (m.cles.has(i)) {
      m.cles.delete(i);
      m.ev.push({ type: 'cle', i, joueur: e.joueur });
      if (m.cles.size === 0 && !m.herseOuverte) { m.herseOuverte = true; m.ev.push({ type: 'herse', i: m.carte.herse }); }
    }
    if (i === m.joyau && !m.joyauPris) { m.joyauPris = true; m.ev.push({ type: 'joyau', i, joueur: e.joueur }); }
    if (m.fromagesSol.has(i) && e.role === 'reine') { m.fromagesSol.delete(i); e.stock++; m.ev.push({ type: 'fromageSol', i, joueur: e.joueur }); }
    if (m.t[i] === PARQUET) bruit(m, i, CONFIG.BRUIT_PARQUET, 'parquet');
    if (m.t[i] === CACHE) entrerCache(m, e, i);
    if (m.t[i] === HERSE && m.herseOuverte) { e.refuge = true; m.ev.push({ type: 'refuge', joueur: e.joueur }); }
    if (m.t[i] === SECRET) for (const r of m.rats) if (r.vis[i] && !r.aveugle && !r.connus[i]) { r.connus[i] = 1; m.ev.push({ type: 'secretAppris', i }); }
  }

  function entrerCache(m, e, i) {
    e.cache = i;
    e.cacheVoulue = e.joueur && !m.bot ? true : (e.mode === 'fuir' || e.mode === 'cache' || e.mode === 'attend');
    m.ev.push({ type: 'cache', role: e.role, joueur: e.joueur, i });
    // Le rat l'a-t-il vu entrer ?
    for (const r of m.rats) {
      if (r.aveugle || !r.vis[i]) continue;
      if (r.etat === 'etourdi' || r.etat === 'transport' || (r.etat === 'leurre' && r.sous === 'grignote')) continue;
      lancerFouille(m, r, i);
      r.suspect = i;
      r.sous = '';
      m.ev.push({ type: 'vuEntrer', i });
    }
  }

  // Bruit : le rat qui patrouille ou fouille l'entend
  function bruit(m, i, rayon, nature) {
    m.ev.push({ type: 'bruit', i, rayon, nature });
    for (const r of m.rats) {
      if (r.etat !== 'patrouille' && r.etat !== 'fouille' && r.etat !== 'alerte') continue;
      if (distCases(m, caseDe(m, r), i) > rayon) continue;
      r.etat = 'alerte'; r.sous = ''; r.but = i; r.t = 0;
      m.ev.push({ type: 'ratAlerte', id: r.id });
    }
  }

  // Action du personnage : feulement (roi), fromage ou verrou (reine)
  function action(m, e) {
    if (e.role === 'roi') return feuler(m, e);
    const p = porteVerrouillable(m, e);
    if (p >= 0) return verrouiller(m, p, e);
    return poserFromage(m, e);
  }
  function actionPossible(m, e) { // pour l'icône du bouton
    if (e.role === 'roi') return { type: 'feule', pret: e.recharge <= 0, jauge: 1 - e.recharge / CONFIG.FEULE_RECHARGE };
    if (porteVerrouillable(m, e) >= 0) return { type: 'verrou', pret: true, jauge: 1 };
    return { type: 'fromage', pret: e.stock > 0, stock: e.stock, jauge: e.stock > 0 ? 1 : 0 };
  }
  function feuler(m, e) {
    if (e.recharge > 0) { m.ev.push({ type: 'feuleRate', joueur: e.joueur }); return false; }
    const touches = m.rats.filter((r) => r.etat !== 'etourdi' && hypot(r.x - e.x, r.y - e.y) <= CONFIG.FEULE_RAYON);
    m.ev.push({ type: 'feule', i: caseDe(m, e), joueur: e.joueur, touche: touches.length > 0 });
    if (!touches.length) return false;
    for (const r of touches) etourdir(m, r);
    e.recharge = CONFIG.FEULE_RECHARGE;
    return true;
  }
  function etourdir(m, r) {
    if (r.etat === 'transport' && r.porte) liberer(m, r.porte, caseDe(m, r));
    r.porte = null;
    r.etat = 'etourdi'; r.sous = ''; r.t = CONFIG.ETOURDI; r.proie = null;
    m.ev.push({ type: 'etourdi', id: r.id });
  }
  function porteVerrouillable(m, e) {
    if (e.n >= 0 && e.p > 0.35) return -1;
    for (let d = 0; d < 4; d++) {
      const v = voisin(m, e.c, d);
      if (v < 0 || m.t[v] !== PORTE || m.verrou[v] > 0) continue;
      if (m.rats.some((r) => caseDe(m, r) === v || r.n === v && r.p > 0.5)) continue;
      if (m.royaux.some((o) => o !== e && caseDe(m, o) === v)) continue;
      return v;
    }
    return -1;
  }
  function verrouiller(m, p, e) {
    m.verrou[p] = CONFIG.VERROU;
    for (const r of m.rats) if (r.n === p) demiTour(m, r);
    m.ev.push({ type: 'verrou', i: p, joueur: e.joueur });
    bruit(m, p, CONFIG.BRUIT_PORTE, 'porte');
    return true;
  }
  function poserFromage(m, e) {
    if (e.stock <= 0) { m.ev.push({ type: 'fromageVide', joueur: e.joueur }); return false; }
    const i = caseDe(m, e);
    if (m.fromages.some((f) => f.i === i)) return false;
    e.stock--;
    m.fromages.push({ i, rat: -1, ignores: new Set() });
    m.ev.push({ type: 'fromage', i, joueur: e.joueur });
    return true;
  }

  // Ordre à l'allié : « Suis-moi » / « Cache-toi », puis « Viens ! » quand la herse est ouverte
  function ordre(m) {
    const a = m.allie;
    if (m.herseOuverte) a.ordre = 'viens';
    else a.ordre = a.ordre === 'cache' ? 'suis' : 'cache';
    a.reflexion = 0;
    m.ev.push({ type: 'ordre', ordre: a.ordre });
  }

  function liberer(m, a, i) {
    a.etat = 'suivre'; a.refuge = false; a.cache = -1;
    a.c = i; a.n = -1; a.p = 0; positionner(m, a);
    a.reflexion = 0;
    m.ev.push({ type: 'libere', i });
  }

  // Joueur : direction tenue (0…3, ou -1), avec mémoire de direction
  function majJoueur(m, entree, dt) {
    const e = m.joueur;
    e.recharge = Math.max(0, e.recharge - dt);
    if (entree.action) action(m, e);
    if (entree.ordre) ordre(m);
    if (entree.partir && e.refuge && !m.allie.refuge) m.partirSeul = true;
    const d = entree.dir;
    m.dirVoulue = d;
    // Demi-tour immédiat entre deux cases
    if (e.n >= 0 && d >= 0 && e.dirMouv >= 0 && (d + 2) % 4 === e.dirMouv) demiTour(m, e);
    // Poussées et contacts contre une case bloquée
    if (e.n < 0 && d >= 0) contact(m, e, voisin(m, e.c, d), dt);
    else { e.pousse = 0; e.pousseCase = -1; }
    avancer(m, e, CONFIG.VITESSE * e.vitesse, dt, choisirJoueur, arriveeRoyal);
  }
  function choisirJoueur(m, e) {
    if (m.bot) m.dirVoulue = entreeBot(m, true).dir; // le joueur automatique décide à chaque case
    const d = m.dirVoulue;
    if (d < 0 || d === undefined) { e.bloqueDir = -1; return -1; }
    // Entré dans une cachette : on y reste tant que la même direction est tenue
    if (e.cache >= 0 && e.bloqueDir === d && !m.bot) return -1;
    e.bloqueDir = -1;
    const v = voisin(m, e.c, d);
    if (peutEntrer(m, e, v)) return v;
    if (e.dirMouv >= 0 && (d + e.dirMouv) % 2 === 1) {
      const v2 = voisin(m, e.c, e.dirMouv);
      if (peutEntrer(m, e, v2)) return v2;
    }
    return -1;
  }
  // Pousser un mur fissuré, ouvrir la cage, tirer un levier
  function contact(m, e, v, dt) {
    if (v < 0) return;
    const type = m.t[v];
    if (type === SECRET && !m.ouvert[v]) {
      if (e.pousseCase !== v) { e.pousseCase = v; e.pousse = 0; }
      e.pousse += dt;
      if (e.pousse >= CONFIG.POUSSE_SECRET) {
        m.ouvert[v] = 1; e.pousse = 0; e.pousseCase = -1;
        m.ev.push({ type: 'secret', i: v, joueur: e.joueur });
        for (const r of m.rats) if (r.vis[caseDe(m, e)] && !r.aveugle) r.connus[v] = 1;
      }
      return;
    }
    e.pousse = 0; e.pousseCase = -1;
    if (type === CAGE && v === m.cage && m.allie.etat === 'cage') {
      liberer(m, m.allie, e.c);
      return;
    }
    if (type === LEVIER) {
      if (m.temps - (m.levierT || -9) < 0.6) return;
      m.levierT = m.temps;
      for (let i = 0; i < m.biblio.length; i++) if (m.t[i] === BIBLIO) m.biblio[i] = m.biblio[i] ? 0 : 1;
      // Une bibliothèque qui se referme sur quelqu'un le pousse dehors : on la laisse ouverte
      for (const o of m.royaux.concat(m.rats)) {
        const i = caseDe(m, o);
        if (m.t[i] === BIBLIO && !m.biblio[i]) m.biblio[i] = 1;
      }
      m.ev.push({ type: 'levier', i: v });
    }
  }

  // ------------------------------------------------------------------------
  // IA_RAT : machine à états
  // ------------------------------------------------------------------------
  function vitesseRat(m, r) {
    const base = CONFIG.VITESSE * m.multRat;
    switch (r.etat) {
      case 'poursuite': return base * r.vPoursuite;
      case 'alerte': return base * Math.min(r.vPoursuite, r.vPatrouille * 1.15);
      case 'ruee': return r.sous === 'charge' ? base * CONFIG.RUEE_VITESSE : 0;
      default: return base * r.vPatrouille;
    }
  }

  // Ce que voit le rat (cases), recalculé à chaque image
  function calculerVue(m, r) {
    r.vis.fill(0);
    if (r.aveugle) return;
    const rx = Math.round(r.x), ry = Math.round(r.y);
    const R = r.portee;
    const x1 = Math.max(0, rx - R - 1), x2 = Math.min(m.w - 1, rx + R + 1);
    const y1 = Math.max(0, ry - R - 1), y2 = Math.min(m.h - 1, ry + R + 1);
    for (let y = y1; y <= y2; y++) {
      for (let x = x1; x <= x2; x++) {
        const vx = x - r.x, vy = y - r.y;
        const d = hypot(vx, vy);
        const i = y * m.w + x;
        let portee = R + 0.5;
        if (m.ombre[i] && !m.lumiere[i]) portee = Math.min(portee, CONFIG.OMBRE_VUE + 0.5);
        if (m.ombre[caseDe(m, r)] && !m.lumiere[caseDe(m, r)]) portee = Math.min(portee, CONFIG.OMBRE_VUE + 1);
        if (d > portee) continue;
        if (d > CONFIG.VUE_PROCHE + 0.2 && Math.abs(angleDiff(Math.atan2(vy, vx), r.ang)) > CONFIG.CONE / 2) continue;
        if (!ligneLibre(m, rx, ry, x, y)) continue;
        r.vis[i] = 1;
        m.vuQuand[i] = m.temps;
      }
    }
  }
  function royalVu(m, r) {
    let meilleur = null, dm = 1e9;
    for (const e of m.royaux) {
      if (!visibleParRats(m, e)) continue;
      const i = caseDe(m, e);
      if (!r.vis[i]) continue;
      const d = hypot(e.x - r.x, e.y - r.y);
      if (d < dm) { dm = d; meilleur = e; }
    }
    return meilleur;
  }

  // Aller vers une case (chemin le plus court sur les cases du rat)
  function choisirRat(m, r) {
    if (r.but < 0) return -1;
    if (r.but === r.c) return -1;
    const res = bfs(m, r.c, (j) => passeRat(m, j, r));
    let cible = r.but;
    if (res.dist[cible] < 0) {
      // But inaccessible (cachette, chatière…) : case accessible la plus proche
      let best = -1, bd = 1e9;
      for (const j of res.ordre) { const d = distCases(m, j, r.but) * 10 + res.dist[j] * 0.1; if (d < bd) { bd = d; best = j; } }
      cible = best;
      if (cible === r.c) return -1;
    }
    return premierPas(res.prev, r.c, cible);
  }
  function arriveeRat(m, r) {
    // un rat qui marche sur un passage secret ouvert le connaît déjà
  }

  function lancerFouille(m, r, centre) {
    r.etat = 'fouille'; r.sous = ''; r.centre = centre;
    r.finFouille = m.temps + CONFIG.FOUILLE_MIN + m.rng() * (CONFIG.FOUILLE_MAX - CONFIG.FOUILLE_MIN);
    r.but = -1; r.cible = -1; r.proie = null;
  }
  function lancerPoursuite(m, r, e) {
    if (r.etat !== 'poursuite' && r.etat !== 'ruee') {
      // Surprise seulement quand il découvre un royal en patrouille : en fouille ou en alerte, il s'y attendait
      const surpris = r.etat === 'patrouille';
      r.etat = 'poursuite'; r.sous = surpris ? 'surprise' : ''; r.t = surpris ? CONFIG.SURPRISE : 0;
      m.poursuiteVue = true; m.stats.poursuites++;
      m.ev.push({ type: 'poursuite', id: r.id, joueur: e.joueur });
    }
    r.proie = e; r.derniere = caseDe(m, e); r.perteT = 0; r.but = r.derniere;
  }

  // Case voisine du rat d'où il peut renifler une cachette
  function placeDevant(m, r, cache) {
    const res = bfs(m, r.c, (j) => passeRat(m, j, r));
    let best = -1, bd = 1e9;
    for (let d = 0; d < 4; d++) {
      const v = voisin(m, cache, d);
      if (v >= 0 && res.dist[v] >= 0 && res.dist[v] < bd) { bd = res.dist[v]; best = v; }
    }
    return best;
  }

  function prochainButFouille(m, r) {
    // Cachette suspecte d'abord, puis cachettes proches au hasard, puis cases au hasard
    let cache = -1;
    if (r.suspect >= 0) { cache = r.suspect; r.suspect = -1; }
    else if (m.rng() < CONFIG.INSPECTION) {
      const choix = m.carte.caches.filter((h) => distCases(m, h, r.centre) <= 6.5 && m.temps - (r.inspectees.get(h) || -99) > 10);
      if (choix.length) cache = choix[Math.floor(m.rng() * choix.length)];
    }
    if (cache >= 0) {
      const devant = placeDevant(m, r, cache);
      if (devant >= 0) { r.cible = cache; r.but = devant; r.sous = 'inspecte'; return; }
    }
    const res = bfs(m, r.centre >= 0 ? r.centre : r.c, (j) => passeRat(m, j, r), CONFIG.FOUILLE_RAYON);
    const choix = [];
    for (const j of res.ordre) if (res.dist[j] >= 2) choix.push(j);
    r.cible = -1; r.sous = 'cherche';
    r.but = choix.length ? choix[Math.floor(m.rng() * choix.length)] : r.c;
  }

  function prochainButPatrouille(m, r) {
    if (r.ronde.length) { r.but = r.ronde[r.rondeK % r.ronde.length]; r.rondeK++; return; }
    // Au hasard, de préférence vers les coins qu'il n'a pas regardés depuis longtemps
    const res = bfs(m, r.c, (j) => passeRat(m, j, r));
    let best = r.c, bs = -1e9;
    const cand = res.ordre;
    for (let k = 0; k < 18 && cand.length; k++) {
      const j = cand[Math.floor(m.rng() * cand.length)];
      if (res.dist[j] < 4) continue;
      // Au début, le rat part d'abord fouiller loin du départ des royaux
      if (m.temps < 12 && distCases(m, j, m.carte.P) < 7) continue;
      const s = Math.min(40, m.temps - m.vuQuand[j]) + res.dist[j] * 0.3 + m.rng() * 6;
      if (s > bs) { bs = s; best = j; }
    }
    r.but = best;
  }

  function fromageSenti(m, r) {
    for (const f of m.fromages) {
      if (f.ignores.has(r.id)) continue;
      if (f.rat >= 0 && f.rat !== r.id) continue;
      if (hypot(cx(m, f.i) - r.x, cy(m, f.i) - r.y) > CONFIG.LEURRE_RAYON) continue;
      const res = bfs(m, r.c, (j) => passeRat(m, j, r));
      let ok = res.dist[f.i] >= 0;
      if (!ok) for (let d = 0; d < 4; d++) { const v = voisin(m, f.i, d); if (v >= 0 && res.dist[v] >= 0) ok = true; }
      if (!ok) { f.ignores.add(r.id); continue; }
      return f;
    }
    return null;
  }

  function attraper(m, r, e) {
    if (e.joueur) {
      m.fin = 'defaite';
      m.ev.push({ type: 'attrape', id: r.id, joueur: true });
      return;
    }
    m.stats.captureAllie++;
    e.cache = -1; e.refuge = false;
    if (m.cage >= 0 && !m.bot) {
      e.etat = 'porte'; e.n = -1;
      r.etat = 'transport'; r.sous = ''; r.porte = e; r.proie = null;
      r.but = placeDevant(m, r, m.cage);
      m.ev.push({ type: 'attrape', id: r.id, joueur: false, cage: true });
    } else if (m.cage >= 0) {
      e.etat = 'porte'; r.etat = 'transport'; r.porte = e; r.proie = null; r.but = placeDevant(m, r, m.cage);
      m.ev.push({ type: 'attrape', id: r.id, joueur: false, cage: true });
    } else {
      e.etat = 'sonne'; e.t = CONFIG.SONNE; e.n = -1; positionner(m, e);
      m.ev.push({ type: 'attrape', id: r.id, joueur: false, cage: false });
      lancerFouille(m, r, caseDe(m, r));
    }
  }

  function majRat(m, r, dt) {
    r.cdRuee -= dt;
    r.aveugle = m.temps < CONFIG.AVEUGLE_DEPART;
    calculerVue(m, r);
    const vu = royalVu(m, r);

    // Fromage : il attire le rat dans presque tous les états
    if (r.etat === 'patrouille' || r.etat === 'alerte' || r.etat === 'fouille' || (r.etat === 'poursuite' && r.sous !== 'surprise')) {
      const f = fromageSenti(m, r);
      if (f) {
        r.etat = 'leurre'; r.sous = 'va'; r.fromage = f; f.rat = r.id; r.proie = null;
        r.but = f.i;
        m.ev.push({ type: 'ratFromage', id: r.id });
      }
    }

    switch (r.etat) {
      case 'etourdi':
        r.t -= dt;
        if (r.t <= 0) lancerFouille(m, r, caseDe(m, r));
        break;
      case 'transport': {
        const a = r.porte;
        if (!a) { lancerFouille(m, r, caseDe(m, r)); break; }
        if (r.n < 0 && r.c === r.but) {
          a.etat = 'cage'; a.c = m.cage; a.n = -1; positionner(m, a);
          r.porte = null;
          m.ev.push({ type: 'cage', i: m.cage });
          lancerFouille(m, r, r.c);
        }
        break;
      }
      case 'leurre': {
        const f = r.fromage;
        if (!f || m.fromages.indexOf(f) < 0) { lancerFouille(m, r, caseDe(m, r)); break; }
        if (r.sous === 'va') {
          const pres = hypot(cx(m, f.i) - r.x, cy(m, f.i) - r.y) <= 1.05 && r.n < 0;
          if (pres || r.c === f.i) { r.sous = 'grignote'; r.t = CONFIG.GRIGNOTE; r.angCible = Math.atan2(cy(m, f.i) - r.y, cx(m, f.i) - r.x); m.ev.push({ type: 'grignote', id: r.id }); }
          else r.but = f.i;
        } else {
          r.t -= dt;
          if (r.t <= 0) {
            m.fromages.splice(m.fromages.indexOf(f), 1);
            r.fromage = null;
            lancerFouille(m, r, caseDe(m, r));
          }
        }
        break;
      }
      case 'ruee':
        if (r.sous === 'prep') {
          r.t -= dt;
          r.angCible = r.rueeDir * Math.PI / 2 - Math.PI / 2;
          if (r.t <= 0) { r.sous = 'charge'; m.ev.push({ type: 'rueeCharge', id: r.id }); }
        } else if (r.sous === 'recup') {
          r.t -= dt;
          if (r.t <= 0) { if (vu) lancerPoursuite(m, r, vu); else { r.etat = 'poursuite'; r.sous = ''; r.perteT = 0; } }
        }
        break;
      case 'poursuite':
        if (r.sous === 'surprise') {
          r.t -= dt;
          if (r.proie) r.angCible = Math.atan2(r.proie.y - r.y, r.proie.x - r.x);
          if (r.t <= 0) r.sous = '';
          break;
        }
        if (vu) { r.proie = vu; r.derniere = caseDe(m, vu); r.perteT = 0; }
        else r.perteT += dt;
        r.but = r.derniere;
        // Ruée : royal en ligne droite tout près
        if (vu && r.ruee && r.cdRuee <= 0 && r.n < 0) {
          const d = ligneDroite(m, r, vu);
          if (d >= 0) {
            r.etat = 'ruee'; r.sous = 'prep'; r.t = CONFIG.RUEE_PREP; r.rueeDir = d; r.cdRuee = CONFIG.RUEE_RECHARGE;
            m.ev.push({ type: 'rueePrep', id: r.id });
            break;
          }
        }
        if (r.perteT >= CONFIG.PERTE_VUE || (!vu && r.c === r.derniere && r.n < 0 && r.perteT > 0.4)) {
          lancerFouille(m, r, r.derniere >= 0 ? r.derniere : caseDe(m, r));
        }
        break;
      case 'alerte':
        if (vu) { lancerPoursuite(m, r, vu); break; }
        if (r.n < 0 && (r.c === r.but || distCases(m, r.c, r.but) < 1.5)) lancerFouille(m, r, r.c);
        break;
      case 'fouille':
        if (vu) { lancerPoursuite(m, r, vu); break; }
        if (m.temps > r.finFouille && r.sous !== 'renifle' && r.sous !== 'secoue') { r.etat = 'patrouille'; r.sous = ''; r.but = -1; break; }
        if (r.sous === 'renifle') {
          r.t -= dt;
          if (r.cible >= 0) r.angCible = Math.atan2(cy(m, r.cible) - r.y, cx(m, r.cible) - r.x);
          if (r.t <= 0) {
            r.inspectees.set(r.cible, m.temps);
            const dedans = m.royaux.find((e) => e.cache === r.cible);
            r.sous = 'secoue'; r.t = CONFIG.SECOUE;
            m.ev.push({ type: 'secoue', i: r.cible, trouve: !!dedans });
            if (dedans) { attraper(m, r, dedans); if (m.fin) return; }
          }
          break;
        }
        if (r.sous === 'secoue') {
          r.t -= dt;
          if (r.t <= 0) { r.sous = ''; r.cible = -1; r.but = -1; }
          break;
        }
        if (r.sous === 'regarde') {
          r.t -= dt;
          r.angCible = r.regard + Math.sin(m.temps * 5) * 1.4;
          if (r.t <= 0) { r.sous = ''; r.but = -1; }
          break;
        }
        if (r.but < 0) prochainButFouille(m, r);
        if (r.n < 0 && r.c === r.but) {
          if (r.sous === 'inspecte') { r.sous = 'renifle'; r.t = CONFIG.RENIFLE; m.ev.push({ type: 'renifle', i: r.cible, id: r.id }); }
          else { r.sous = 'regarde'; r.t = 0.5 + m.rng() * 0.6; r.regard = r.ang; }
        }
        break;
      default: // patrouille
        if (vu) { lancerPoursuite(m, r, vu); break; }
        if (r.but < 0 || (r.n < 0 && r.c === r.but)) prochainButPatrouille(m, r);
    }
    if (r.etat === 'transport' && r.porte) { r.porte.x = r.x; r.porte.y = r.y - 0.2; }

    // Déplacement
    const bloque = (r.etat === 'etourdi') || (r.etat === 'poursuite' && r.sous === 'surprise') ||
      (r.etat === 'ruee' && r.sous !== 'charge') || (r.etat === 'leurre' && r.sous === 'grignote') ||
      (r.etat === 'fouille' && (r.sous === 'renifle' || r.sous === 'secoue' || r.sous === 'regarde'));
    if (!bloque) {
      if (r.etat === 'ruee') {
        avancer(m, r, vitesseRat(m, r), dt, choisirRuee, () => {});
        if (r.n < 0 && r.sous === 'charge' && choisirRuee(m, r) < 0) { r.sous = 'recup'; r.t = CONFIG.RUEE_RECUP; m.ev.push({ type: 'rueeChoc', id: r.id }); }
      } else avancer(m, r, vitesseRat(m, r), dt, choisirRat, arriveeRat);
      if (r.bouge && r.n >= 0) r.angCible = Math.atan2(cy(m, r.n) - cy(m, r.c), cx(m, r.n) - cx(m, r.c));
    }
    // Le regard tourne en douceur
    const da = angleDiff(r.angCible, r.ang);
    const vrot = 9 * dt;
    r.ang += Math.abs(da) < vrot ? da : Math.sign(da) * vrot;
    r.ang = angleDiff(r.ang, 0);
  }

  function ligneDroite(m, r, e) {
    const rc = caseDe(m, r), ec = caseDe(m, e);
    const dx = cx(m, ec) - cx(m, rc), dy = cy(m, ec) - cy(m, rc);
    if (dx !== 0 && dy !== 0) return -1;
    const dist = Math.abs(dx) + Math.abs(dy);
    if (dist < 1 || dist > CONFIG.RUEE_DIST) return -1;
    const d = dx > 0 ? 1 : dx < 0 ? 3 : dy > 0 ? 2 : 0;
    let j = rc;
    for (let k = 0; k < dist; k++) { j = voisin(m, j, d); if (j < 0 || !passeRat(m, j, r)) return -1; }
    return d;
  }
  function choisirRuee(m, r) {
    if (r.sous !== 'charge') return -1;
    const v = voisin(m, r.c, r.rueeDir);
    return v >= 0 && passeRat(m, v, r) ? v : -1;
  }

  // ------------------------------------------------------------------------
  // IA_ALLIE : machine à états de l'allié (et du joueur automatique du mode test)
  // ------------------------------------------------------------------------
  function ratsDangereux(m, e) {
    const liste = [];
    for (const r of m.rats) {
      if (r.etat === 'transport') continue;
      if (r.etat === 'etourdi') { if (hypot(r.x - e.x, r.y - e.y) <= 3.5) liste.push(r); continue; }
      if (r.etat === 'leurre' && r.sous === 'grignote') { if (hypot(r.x - e.x, r.y - e.y) <= 1.6) liste.push(r); continue; }
      const voit = r.vis[caseDe(m, e)] && visibleParRats(m, e);
      if (voit || (r.etat === 'poursuite' && r.proie === e)) { liste.push(r); continue; }
      // Rat tout proche par le chemin (pas à travers les murs)
      if (hypot(r.x - e.x, r.y - e.y) > CONFIG.ALLIE_DANGER + 0.5) continue;
      const res = bfs(m, caseDe(m, r), (j) => passeRat(m, j, r) || j === caseDe(m, e), CONFIG.ALLIE_DANGER);
      if (res.dist[caseDe(m, e)] >= 0) liste.push(r);
    }
    return liste;
  }
  function distRatMin(m, e) {
    let d = 1e9;
    for (const r of m.rats) if (r.etat !== 'etourdi') d = Math.min(d, hypot(r.x - e.x, r.y - e.y));
    return d;
  }

  // Fuite : cases que l'on atteint avant le rat, la plus sûre d'abord
  function choisirFuite(m, e, menaces) {
    const n = m.w * m.h;
    const dR = new Int16Array(n).fill(-1);
    for (const r of menaces) {
      const res = bfs(m, caseDe(m, r), (j) => passeRat(m, j, r));
      for (let i = 0; i < n; i++) if (res.dist[i] >= 0 && (dR[i] < 0 || res.dist[i] < dR[i])) dR[i] = res.dist[i];
    }
    // Une cachette est à la portée du rat dès qu'il atteint une case voisine (il la fouille)
    for (const h of m.carte.caches) {
      let best = -1;
      for (let d = 0; d < 4; d++) { const v = voisin(m, h, d); if (v >= 0 && dR[v] >= 0 && (best < 0 || dR[v] + 1 < best)) best = dR[v] + 1; }
      dR[h] = best;
    }
    const vR = Math.max(...menaces.map((r) => r.vPoursuite * m.multRat), 0.5);
    const rapport = vR / Math.max(0.3, e.vitesse);
    const depart = e.c;
    // BFS « sûre » : on n'avance que dans des cases atteintes avant le rat
    const dist = new Int16Array(n).fill(-1), prev = new Int32Array(n).fill(-1), file = new Int32Array(n);
    let a = 0, b = 0;
    dist[depart] = 0; file[b++] = depart;
    while (a < b) {
      const i = file[a++];
      if (dist[i] > 14) continue;
      for (let k = 0; k < 4; k++) {
        const j = voisin(m, i, k);
        if (j < 0 || dist[j] >= 0 || !peutEntrer(m, e, j)) continue;
        const dA = dist[i] + 1;
        if (dR[j] >= 0 && dA * rapport >= dR[j] - 0.7) continue;
        dist[j] = dA; prev[j] = i; file[b++] = j;
      }
    }
    const vuMaintenant = menaces.some((r) => r.vis[caseDe(m, e)]);
    let best = -1, bs = -1e9;
    for (let k = 0; k < b; k++) {
      const j = file[k];
      let s = dR[j] < 0 ? 30 : Math.min(dR[j], 25);
      if (m.t[j] === CACHE && !vuMaintenant && !menaces.some((r) => r.vis[j])) s += 7;
      if (m.t[j] === CHATIERE) s += 4;
      s -= dist[j] * 0.25;
      if (menaces.some((r) => r.vis[j])) s -= 4;
      if (s > bs) { bs = s; best = j; }
    }
    if (best >= 0 && best !== depart) return premierPas(prev, depart, best);
    // Coincé : la case voisine la plus éloignée du rat
    let v = -1, vd = dR[depart];
    for (let k = 0; k < 4; k++) {
      const j = voisin(m, depart, k);
      if (j < 0 || !peutEntrer(m, e, j)) continue;
      const d = dR[j] < 0 ? 99 : dR[j];
      if (d > vd) { vd = d; v = j; }
    }
    return v;
  }

  // Coût d'un pas pour l'allié : éviter la vue du rat, ses abords et le parquet
  function coutPrudent(m, e) {
    return function (j) {
      let c = 1;
      for (const r of m.rats) {
        if (r.etat === 'etourdi') continue;
        if (r.vis[j]) c += 5;
        const d = hypot(cx(m, j) - r.x, cy(m, j) - r.y);
        if (d < 3) c += (3 - d) * 3;
      }
      if (m.t[j] === PARQUET) c += 3;
      if (m.t[j] === CACHE && e.cache !== j) c += 6;
      if (j === e.prec) c += 4; // pas de va-et-vient
      return c;
    };
  }
  function pasVers(m, e, but, prudent) {
    if (but < 0 || but === e.c) return -1;
    const res = dijkstra(m, e.c, (j) => peutEntrer(m, e, j), prudent ? coutPrudent(m, e) : () => 1);
    if (!isFinite(res.dist[but])) return -1;
    return premierPas(res.prev, e.c, but);
  }
  function cacheProche(m, e) {
    const res = dijkstra(m, e.c, (j) => peutEntrer(m, e, j), coutPrudent(m, e));
    let best = -1, bd = Infinity;
    for (const h of m.carte.caches) {
      if (!isFinite(res.dist[h])) continue;
      if (m.royaux.some((o) => o !== e && o.cache === h)) continue;
      if (m.rats.some((r) => r.vis[h])) continue;
      if (res.dist[h] < bd) { bd = res.dist[h]; best = h; }
    }
    if (best < 0) return -1;
    return best === e.c ? e.c : premierPas(res.prev, e.c, best);
  }

  function capacitesAllie(m, a, menaces) {
    if (a.role === 'roi') {
      if (a.recharge <= 0 && m.rats.some((r) => r.etat !== 'etourdi' && hypot(r.x - a.x, r.y - a.y) <= CONFIG.FEULE_RAYON - 0.3)) feuler(m, a);
      return;
    }
    // Reine : fromage quand le rat la talonne, verrou derrière elle
    if (a.cdFromage <= 0 && a.stock > 0 && menaces.some((r) => r.etat === 'poursuite' && r.proie === a && hypot(r.x - a.x, r.y - a.y) <= 4)) {
      if (poserFromage(m, a)) a.cdFromage = 4;
    }
    if (a.porteRecente >= 0 && m.temps - a.porteT < 1.5 && m.verrou[a.porteRecente] <= 0 && menaces.length) {
      const p = porteVerrouillable(m, a);
      if (p === a.porteRecente) { verrouiller(m, p, a); a.porteRecente = -1; }
    }
  }

  // Prudence commune à l'allié et au joueur automatique : rester caché, fuir.
  // Renvoie { n } si la sécurité décide, sinon null.
  function prudence(m, e, resterCache) {
    const menaces = ratsDangereux(m, e);
    if (e.cache >= 0 && e.cacheVoulue) {
      const flaire = m.rats.some((r) => r.etat === 'fouille' && (r.sous === 'renifle' || r.sous === 'inspecte') && r.cible === e.cache);
      if (flaire) { e.mode = 'fuir'; return { n: choisirFuite(m, e, m.rats.filter((r) => r.etat !== 'etourdi')) }; }
      if (resterCache) { e.mode = 'cache'; return { n: -1 }; }
      if (!e.joueur && m.joueur.cache >= 0 && !m.bot) { e.mode = 'attend'; return { n: -1 }; }
      if (distRatMin(m, e) <= CONFIG.ALLIE_CALME || e.calme < CONFIG.ALLIE_CALME_T) { e.mode = 'cache'; return { n: -1 }; }
      return null;
    }
    if (menaces.length) { e.mode = 'fuir'; e.fuiteJusqua = m.temps + 1.2; e.menaces = menaces; return { n: choisirFuite(m, e, menaces) }; }
    // On continue de fuir un instant, sans revenir sur ses pas
    if (m.temps < (e.fuiteJusqua || 0) && e.menaces) { e.mode = 'fuir'; return { n: choisirFuite(m, e, e.menaces) }; }
    return null;
  }

  // Décision de l'allié : renvoie la case suivante (ou -1 : rester)
  function choisirAllie(m, a) {
    if (a.etat !== 'suivre' || a.refuge) return -1;
    a.mode = '';
    const p = prudence(m, a, a.ordre === 'cache' && !m.herseOuverte);
    if (p) return p.n;
    if (a.ordre === 'cache' && !m.herseOuverte) { a.mode = 'cache'; return cacheProche(m, a); }
    const j = m.joueur;
    if (m.herseOuverte && (j.refuge || a.ordre === 'viens' || a.versSortie)) {
      a.mode = 'sortie';
      return pasVers(m, a, m.carte.herse, true);
    }
    // Ramasser une clé toute proche si le rat est loin
    if (m.cles.size && distRatMin(m, a) > CONFIG.ALLIE_CLE_RAT) {
      const res = bfs(m, a.c, (q) => peutEntrer(m, a, q), CONFIG.ALLIE_CLE);
      for (const k of m.cles) if (res.dist[k] >= 0) { a.mode = 'cle'; return k === a.c ? -1 : premierPas(res.prev, a.c, k); }
    }
    // Le joueur s'est caché : l'allié se cache aussi, près de lui
    if (j.cache >= 0 && !m.bot) {
      a.mode = 'attend';
      if (a.cache >= 0) return -1;
      const n = cacheProche(m, a);
      if (n >= 0 || a.cache >= 0) return n;
    }
    // Suivre le joueur à 2 à 4 cases
    a.mode = 'suit';
    const res = dijkstra(m, a.c, (q) => peutEntrer(m, a, q), coutPrudent(m, a));
    const cj = j.n >= 0 && j.p > 0.5 ? j.n : j.c;
    const d = res.dist[cj];
    if (!isFinite(d)) return -1;
    const pas = bfs(m, a.c, (q) => peutEntrer(m, a, q)).dist[cj];
    if (pas <= 2 || (pas <= 3 && !a.bouge)) return -1;
    if (m.t[cj] === CACHE && pas <= 3) return -1;
    return premierPas(res.prev, a.c, cj);
  }

  function majAllie(m, dt) {
    const a = m.allie;
    a.recharge = Math.max(0, a.recharge - dt);
    a.cdFromage -= dt;
    if (a.etat === 'sonne') {
      a.t -= dt;
      if (a.t <= 0) { a.etat = 'suivre'; a.reflexion = 0; m.ev.push({ type: 'reveil' }); }
      return;
    }
    if (a.etat !== 'suivre' || a.refuge) return;
    if (a.ordre === 'viens' && !m.herseOuverte) a.ordre = 'suis';
    if (m.herseOuverte && a.ordre === 'cache') a.ordre = 'suis';
    const menaces = ratsDangereux(m, a);
    if (a.cache >= 0) a.calme = (distRatMin(m, a) > CONFIG.ALLIE_CALME && !menaces.length) ? a.calme + dt : 0;
    capacitesAllie(m, a, menaces);
    // Demi-tour si l'on file droit sur le rat
    if (a.n >= 0 && menaces.length) {
      const r = menaces[0];
      const dN = hypot(cx(m, a.n) - r.x, cy(m, a.n) - r.y), dC = hypot(cx(m, a.c) - r.x, cy(m, a.c) - r.y);
      if (dN < dC - 0.3 && dN < 2.5) demiTour(m, a);
    }
    // À l'arrêt, on ne réfléchit que toutes les 0,15 s
    if (a.n < 0) {
      a.reflexion -= dt;
      if (a.reflexion > 0 && !menaces.length) { positionner(m, a); return; }
      a.reflexion = 0.15;
    }
    avancer(m, a, CONFIG.VITESSE * a.vitesse, dt, choisirAllie, arriveeRoyal);
  }

  // ------------------------------------------------------------------------
  // PAS : une image de simulation
  // entree : { dir: -1…3, action, ordre, partir }
  // ------------------------------------------------------------------------
  function pas(m, entree, dt) {
    if (m.fin) return;
    dt = dt || CONFIG.DT;
    m.temps += dt;
    for (const ent of m.royaux.concat(m.rats)) { ent.px = ent.x; ent.py = ent.y; }
    // Portes qui se rouvrent
    for (let i = 0; i < m.verrou.length; i++) if (m.verrou[i] > 0) { m.verrou[i] -= dt; if (m.verrou[i] <= 0) { m.verrou[i] = 0; m.ev.push({ type: 'deverrou', i }); } }
    if (m.herseOuverte) m.herseT = Math.min(1, m.herseT + dt / 0.8);
    if (m.bot) entree = entreeBot(m);
    majJoueur(m, entree || {}, dt);
    if (m.fin) return;
    majAllie(m, dt);
    for (const r of m.rats) { majRat(m, r, dt); if (m.fin) return; }
    // Captures au contact
    for (const r of m.rats) {
      if (r.etat === 'etourdi' || (r.etat === 'ruee' && r.sous === 'prep')) continue;
      const rayon = r.etat === 'ruee' ? CONFIG.ATTRAPE + 0.15 : CONFIG.ATTRAPE;
      for (const e of m.royaux) {
        if (!visibleParRats(m, e) && !(e.joueur && e.cache < 0 && !e.refuge)) continue;
        if (e.cache >= 0 || e.refuge) continue;
        if (!e.joueur && e.etat !== 'suivre') continue;
        if (hypot(e.x - r.x, e.y - r.y) <= rayon) {
          if (r.etat === 'transport' && !e.joueur) continue;
          attraper(m, r, e);
          if (m.fin) return;
        }
      }
    }
    // Victoire
    if (m.joueur.refuge && (m.allie.refuge || m.partirSeul)) {
      m.fin = 'victoire';
      m.deux = m.allie.refuge;
      m.ev.push({ type: 'victoire', deux: m.deux });
    }
  }

  function etoiles(m) {
    if (m.fin !== 'victoire') return 0;
    return 1 + (m.deux ? 1 : 0) + (m.joyauPris ? 1 : 0);
  }

  // ------------------------------------------------------------------------
  // DEBUG : joueur automatique (parties simulées du mode test)
  // Il ramasse les clés, fuit et se cache comme l'allié, puis va à la herse.
  // ------------------------------------------------------------------------
  function entreeBot(m, aLaCase) {
    const e = m.joueur;
    const entree = { dir: -1 };
    if (!aLaCase && e.cache >= 0) e.calme = (distRatMin(m, e) > CONFIG.ALLIE_CALME && !ratsDangereux(m, e).length) ? e.calme + CONFIG.DT : 0;
    if (e.n >= 0) { entree.dir = m.botDir === undefined ? -1 : m.botDir; return entree; }
    if (e.role === 'roi' && e.recharge <= 0 && m.rats.some((r) => r.etat !== 'etourdi' && hypot(r.x - e.x, r.y - e.y) <= 1.8)) entree.action = true;
    if (e.refuge) {
      m.botAttente = m.botAttente || m.temps;
      const limite = m.allie.etat === 'suivre' ? 25 : 3;
      if (m.temps - m.botAttente > limite) entree.partir = true;
      return entree;
    }
    let n = -1;
    const p = prudence(m, e, false);
    if (p) n = p.n;
    else {
      // Objectif gardé jusqu'à ce qu'il soit atteint : clé la plus proche, cage, herse
      if (m.botCible === undefined || !m.cles.has(m.botCible)) m.botCible = -1;
      if (m.botCible < 0 && m.cles.size) {
        const res = bfs(m, e.c, (q) => peutEntrer(m, e, q));
        let bd = 1e9;
        for (const k of m.cles) if (res.dist[k] >= 0 && res.dist[k] < bd) { bd = res.dist[k]; m.botCible = k; }
      }
      if (m.botCible >= 0) n = pasVers(m, e, m.botCible, true);
      else if (m.allie.etat === 'cage' && m.cage >= 0) {
        const devant = [0, 1, 2, 3].map((d) => voisin(m, m.cage, d)).find((v) => v >= 0 && peutEntrer(m, e, v));
        if (e.c === devant) { entree.dir = dirVers(m, e.c, m.cage); return entree; }
        n = pasVers(m, e, devant, true);
      } else n = pasVers(m, e, m.carte.herse, true);
    }
    entree.dir = n >= 0 ? dirVers(m, e.c, n) : -1;
    m.botDir = entree.dir;
    return entree;
  }

  function simuler(def, opts) {
    const m = creerMonde(def, Object.assign({ bot: true }, opts));
    const duree = (opts && opts.duree) || 150;
    let tCapture = -1;
    while (!m.fin && m.temps < duree) {
      pas(m, {}, CONFIG.DT);
      if (tCapture < 0 && m.stats.captureAllie) tCapture = m.temps;
      m.ev.length = 0;
    }
    return { fin: m.fin || 'temps', temps: m.temps, etoiles: etoiles(m), allieCapture: m.stats.captureAllie > 0, tCapture, poursuites: m.stats.poursuites, cles: m.nbCles - m.cles.size };
  }

  // ------------------------------------------------------------------------
  // DEBUG : validateur de niveaux (cahier, section 7.4)
  // ------------------------------------------------------------------------
  function valider(def, k) {
    const erreurs = [], avis = [];
    const c = lireCarte(def);
    const nom = 'N' + (k + 1);
    const err = (code, details) => erreurs.push({ niveau: k + 1, code, details: details || '' });
    // Format
    const largeurs = new Set(def.carte.map((l) => l.length));
    if (largeurs.size !== 1) err('largeur', [...largeurs].join('/'));
    for (const u of c.inconnus) err('caractere', u.ch + '@' + u.x + ',' + u.y);
    if ((c.compte.P || 0) !== 1) err('P', String(c.compte.P || 0));
    if ((c.compte.A || 0) !== 1) err('A', String(c.compte.A || 0));
    if ((c.compte.E || 0) !== 1) err('E', String(c.compte.E || 0));
    if (c.rats.length < 1) err('R', '0');

      dessinerRoyal(c, { role: 'reine', dir: 1, bouge: p < 0.5 }, 60 + lisse(p * 2) * 160, 120, k, { phase: tps, joie: p > 0.5 });

      const x = 50 + p * 200;

      if (x > 80 && x < 210) { c.strokeStyle = 'rgba(255,240,200,.8)'; c.lineWidth = 2.5; for (let q = 1; q <= 3; q++) { c.beginPath(); c.arc(x, 135, q * 10 + (tps * 30) % 10, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); } }
      const rx = 300 - lisse((p - 0.4) * 2) * 70;

  // Petit bouton dessiné dans une fiche (mêmes icônes que les vrais boutons)
  const imagesIcones = {};

      imagesIcones[nom] = img;

    return imagesIcones[nom];
  }

    c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 2; c.stroke();

  // Fin de niveau
  function finirNiveau() {
    const gagne = m.fin === 'victoire';
    const n = niveauIdx + 1;
    const et = S.etoiles(m);
    finDonnee = { gagne, et, deux: !!m.deux, joyau: m.joyauPris, record: false, sansVu: false, bonus: -1 };
    if (gagne) {
      const bonusAvant = BONUS.map((q) => niveauOuvert(q));
      finDonnee.record = et > prog.etoiles[niveauIdx];
      prog.etoiles[niveauIdx] = Math.max(prog.etoiles[niveauIdx], et);
      if (m.joyauPris) prog.joyaux[niveauIdx] = true;
      prog.gagnes[niveauIdx] = true;
      if (!m.poursuiteVue) { finDonnee.sansVu = true; prog.sansVu[niveauIdx] = true; }
      finDonnee.bonus = BONUS.findIndex((q, b) => !bonusAvant[b] && niveauOuvert(q));
      const ip = PRINCIPAUX.indexOf(niveauIdx);
      if (ip >= 0) prog.atteint = Math.max(prog.atteint, Math.min(PRINCIPAUX.length, ip + 2));
      // Sauvegarde : niveau suivant (N + 1), étoiles et trésors
      sauver(ip >= 0 ? Math.min(PRINCIPAUX.length, ip + 2) : niveauReprise());
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: n });
      if (prog.gagnes.every(Boolean) && window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NB * 3 });
    } else {
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: n });

  // --------------------------------------------------------------------------
  // Événements de la simulation : sons, effets, messages
  // --------------------------------------------------------------------------
  function traiterEvenements() {
    for (const ev of m.ev) {
      const pos = ev.i !== undefined && ev.i >= 0 ? { x: ev.i % m.w, y: (ev.i / m.w) | 0 } : null;
      switch (ev.type) {
        case 'pas':
          if (ev.joueur) Son.jouer(ev.role === 'roi' ? 'pasRoi' : 'pasReine');
          if (pos && Math.random() < 0.6) ajouterParticules(pos.x, pos.y + 0.35, 2, 'poussiere');
          break;
        case 'cle':
          Son.jouer('cle'); if (pos) ajouterParticules(pos.x, pos.y, 12, 'eclat', '#ffe066');
          if (!ev.joueur) message(m.allie.role === 'roi' ? 'msg.cleRoi' : 'msg.cleReine');
          break;
        case 'herse': Son.jouer('herse'); message('msg.herse'); secousse = 0.3; break;
        case 'joyau': Son.jouer('joyau'); if (pos) ajouterParticules(pos.x, pos.y, 16, 'etoile', '#ff9be0'); message('msg.joyau'); break;
        case 'cache': if (ev.joueur) Son.jouer('cache'); break;
        case 'sortCache': if (ev.joueur) Son.jouer('sortCache'); break;
        case 'vuEntrer': if (m.joueur.cache === ev.i) message('msg.vuEntrer'); break;
        case 'feule': Son.jouer(ev.touche ? 'feule' : 'feuleVide'); break;
        case 'fromage': Son.jouer('fromage'); break;
        case 'fromageVide': break;
        case 'verrou': Son.jouer('verrou'); break;
        case 'poursuite': Son.jouer('grogne'); if (ev.joueur) secousse = Math.max(secousse, 0.15); break;
        case 'rueePrep': Son.jouer('griffes'); break;
        case 'rueeCharge': secousse = 0.5; break;
        case 'renifle': Son.jouer('renifle'); break;
        case 'secoue': Son.jouer('secoue'); break;
        case 'etourdi': Son.jouer('etourdi'); break;
        case 'grignote': Son.jouer('grignote'); break;
        case 'attrape':
          if (!ev.joueur) { Son.jouer('attrapeAllie'); message(ev.cage ? (m.allie.role === 'roi' ? 'msg.allieCageRoi' : 'msg.allieCageReine') : (m.allie.role === 'roi' ? 'msg.allieSonneRoi' : 'msg.allieSonneReine')); }
          break;
        case 'libere': Son.jouer('libere'); if (pos) ajouterParticules(pos.x, pos.y, 10, 'etoile'); break;
        case 'secret': Son.jouer('secret'); secousse = 0.25; if (pos) ajouterParticules(pos.x, pos.y, 14, 'poussiere'); break;
        case 'ordre': Son.jouer('bouton'); message('msg.ordre.' + ev.ordre + '.' + m.allie.role); break;
        default: break;
      }
    }
    m.ev.length = 0;
  }

  // --------------------------------------------------------------------------
  // BOUCLE : simulation à pas fixe (60 Hz), affichage interpolé
  // --------------------------------------------------------------------------
  let accu = 0, avant = performance.now(), couineT = 3;
  const ECRANS_DEMO = ['titre', 'niveaux', 'perso', 'galerie', 'tenues'];
  function boucle(maintenant) {
    const dt = Math.min(0.1, Math.max(0, (maintenant - avant) / 1000));
    avant = maintenant;
    tps += dt;
    secousse = Math.max(0, secousse - dt);
    if (messageTimer > 0) { messageTimer -= dt; if (messageTimer <= 0) $('message').classList.remove('vu'); }
    let alpha = 1;
    if (ecran === 'jeu' && m && !APERCU) {
      accu += dt;
      let n = 0;
      while (accu >= S.CONFIG.DT && n < 6) {
        const e = { dir: directionTenue(), action: entree.action, ordre: entree.ordre, partir: entree.partir };
        entree.action = entree.ordre = entree.partir = false;
        if (!m.fin) S.pas(m, e, S.CONFIG.DT);
        traiterEvenements();
        accu -= S.CONFIG.DT; n++;
      }
      if (n >= 6) accu = 0;
      alpha = accu / S.CONFIG.DT;
      couineT -= dt;
      if (couineT <= 0) { couineT = 5 + Math.random() * 6; if (m.rats.some((r) => r.etat === 'patrouille')) Son.jouer('couine'); }
      if (m.fin && finTimer < 0) finTimer = m.fin === 'victoire' ? 1.1 : 0.8;
      if (finTimer > 0) { finTimer -= dt; if (finTimer <= 0) finirNiveau(); }
      majHud();
    } else if (ECRANS_DEMO.includes(ecran) && demo) {
      accu += dt;
      while (accu >= S.CONFIG.DT) { S.pas(demo, {}, S.CONFIG.DT); demo.ev.length = 0; accu -= S.CONFIG.DT; }
      alpha = accu / S.CONFIG.DT;
      if (demo.fin || demo.temps > 120) demo = S.creerMonde(S.NIVEAUX[(Math.random() * S.NIVEAUX.length) | 0], { bot: true, graine: (Math.random() * 1e9) | 0, perso: Math.random() < 0.5 ? 'roi' : 'reine' });
    }
    majParticules(dt);
    const monde = ECRANS_DEMO.includes(ecran) ? demo : m;
    if (monde) {
      if (monde === demo) calculerZone();
      suivreCamera(monde, monde === m ? m.joueur : null, dt, false);
      dessinerMonde(monde, alpha, monde === demo ? { sansFleche: true, sansAnneau: true } : {});
    }
    if (ecran === 'fiche') dessinerFiche(dt);
    if (ecran === 'fin') dessinerFin();
    if (ecran === 'galerie') dessinerGalerie();
    if (ecran === 'tenues') dessinerTenues();
    let tension = 0;
    if (ecran === 'jeu' && m && !m.fin) for (const r of m.rats) tension = Math.max(tension, r.etat === 'poursuite' || r.etat === 'ruee' ? 1 : r.etat === 'fouille' || r.etat === 'alerte' ? 0.5 : 0);
    Son.majMusique((ecran === 'jeu' && m && !m.fin) || ecran === 'titre', tension);
    if (DEBUG) majDebugLigne(dt);
    requestAnimationFrame(boucle);
  }

  document.addEventListener('visibilitychange', () => { if (document.hidden) ouvrirPause(); });

  // --------------------------------------------------------------------------
  // DEBUG : validateur de niveaux et parties simulées (?debug=1)
  // --------------------------------------------------------------------------
  let debugLigneT = 0;
  function majDebugLigne(dt) {
    debugLigneT -= dt;
    if (debugLigneT > 0 || $('debug').hidden || !m) return;
    debugLigneT = 0.25;
    const r = m.rats[0];
    $('debugSortie').dataset.etat = r ? r.etat + '/' + r.sous : '';
  }
  function ouvrirDebug() {
    $('debug').hidden = false;
    validerDebug();
  }
  function validerDebug() {
    const rapport = S.validerTout();
    const sortie = $('debugSortie');
    sortie.textContent = '';
    const p = document.createElement('div');
    p.textContent = rapport.erreurs.length ? t('debug.erreurs', { n: rapport.erreurs.length }) : t('debug.toutBon', { n: S.NIVEAUX.length });
    p.className = rapport.erreurs.length ? 'ko' : '';
    sortie.appendChild(p);
    for (const e of rapport.erreurs) {
      const l = document.createElement('div'); l.className = 'ko';
      l.textContent = t('debug.ligne', { n: e.niveau, code: e.code, details: e.details });
      sortie.appendChild(l);
    }
    console.log('[fuyez-majestes] validateur', rapport);
    return rapport;
  }
  function simulerDebug() {
    const sortie = $('debugSortie');
    sortie.textContent = '';
    const N = 12;
    S.NIVEAUX.forEach((def, k) => {
      for (const perso of ['roi', 'reine']) {
        let v = 0, cap = 0, et = 0;
        for (let g = 1; g <= N; g++) {
          const r = S.simuler(def, { perso, graine: g * 7919 + k });
          if (r.fin === 'victoire') v++;
          if (r.allieCapture) cap++;
          et += r.etoiles;
        }
        const l = document.createElement('div');
        l.textContent = t('debug.simLigne', { n: k + 1, perso: t('perso.' + perso), v, total: N, survie: Math.round(100 * (N - cap) / N), e: (et / N).toFixed(1) });
        sortie.appendChild(l);
      }
    });
  }
  $('bDebugValider').addEventListener('click', validerDebug);
  $('bDebugSimuler').addEventListener('click', simulerDebug);
  $('bDebugFermer').addEventListener('click', () => { $('debug').hidden = true; });

  // --------------------------------------------------------------------------
  // DEMARRAGE
  // --------------------------------------------------------------------------
  function demarrer() {
    chargerProg();
    if (AFFICHE) { dessinerAffiche(); return; }
    redimensionner();
    window.addEventListener('resize', redimensionner);
    majSon();
    if (APERCU) { ouvrirApercu(APERCU); return; }
    montrerTitre();
    if (DEBUG) { ouvrirDebug(); window.FM_TEST = { ouvrirFiche, lancerNiveau, prog }; }
    requestAnimationFrame((q) => { avant = q; boucle(q); });
  }

  // --------------------------------------------------------------------------
  // IMAGES DU JEU (window.JEL_APERCU = 1, 2 ou 3, posé par le robot) : un vrai
  // moment de partie, avec l'interface, puis la partie reste figée.
  // --------------------------------------------------------------------------
  function ouvrirApercu(n) {
    const choix = { 1: { k: 0, perso: 'reine', t: 7 }, 2: { k: 8, perso: 'roi', t: 16 }, 3: { k: 17, perso: 'reine', t: 22 } }[n] || { k: 0, perso: 'roi', t: 8 };
    const k = Math.min(choix.k, NB - 1);
    for (const f of Object.keys(FICHES)) prog.fiches[f] = true;
    prog.perso = choix.perso;
    let meilleur = null;
    for (let g = 1; g <= 12 && !meilleur; g++) {
      const monde = S.creerMonde(S.NIVEAUX[k], { perso: choix.perso, bot: true, graine: g * 977 + n });
      let vu = false;
      while (monde.temps < choix.t + 14 && !monde.fin) {
        S.pas(monde, {}, S.CONFIG.DT);
        monde.ev.length = 0;
        if (monde.temps < choix.t) continue;
        // Un rat assez près pour qu'on le voie, mais pas en train d'attraper
        const proche = monde.rats.some((r) => Math.hypot(r.x - monde.joueur.x, r.y - monde.joueur.y) < 6 && Math.hypot(r.x - monde.joueur.x, r.y - monde.joueur.y) > 2);
        if (proche && monde.joueur.cache < 0 && monde.cles.size < monde.nbCles) { vu = true; break; }
      }
      if (!monde.fin && (vu || g === 12)) meilleur = monde;
    }
    niveauIdx = k;
    m = meilleur || S.creerMonde(S.NIVEAUX[k], { perso: choix.perso, graine: 1 });
    m.bot = false;
    for (const e of m.royaux.concat(m.rats)) { e.px = e.x; e.py = e.y; }
    $('hNiveau').textContent = nomLong(k);
    montrer('jeu');
    calculerZone();
    suivreCamera(m, m.joueur, 0, true);
    majHud();
    const image = () => { calculerZone(); suivreCamera(m, m.joueur, 0, true); tps += 1 / 60; dessinerMonde(m, 1); requestAnimationFrame(image); };
    requestAnimationFrame(image);
  }

  // --------------------------------------------------------------------------
  // AFFICHE (window.JEL_AFFICHE, posé par le robot) : la jaquette du jeu,
  // sans interface ni texte.
  // --------------------------------------------------------------------------
  function dessinerAffiche() {
    for (const el of document.querySelectorAll('.jel-langue, .ecran, #hud, #commandes, #debug, #message, #bPartir')) el.style.display = 'none';
    const peindre = () => {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth; H = window.innerHeight;
      toile.width = Math.round(W * dpr); toile.height = Math.round(H * dpr);
      const c = ctx;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      const u = Math.min(W / 600, H / 800);
      // Fond : galerie du château, arches et clair de lune
      const fondG = c.createLinearGradient(0, 0, 0, H);
      fondG.addColorStop(0, '#2a1d4f'); fondG.addColorStop(0.55, '#4a3580'); fondG.addColorStop(1, '#2b1f47');
      c.fillStyle = fondG; c.fillRect(0, 0, W, H);
      const pierre = (x, y, w, h, coul) => { c.fillStyle = coul; rr(c, x, y, w, h, 6 * u); c.fill(); };
      for (let y = 0, ry = 0; y < H * 0.62; y += 46 * u, ry++) for (let x = -((ry % 2) * 45 * u); x < W; x += 90 * u) pierre(x + 3 * u, y + 3 * u, 84 * u, 40 * u, hache(Math.round(x), ry) < 0.5 ? '#3d2c6a' : '#46337a');
      // Fenêtre et lune
      c.fillStyle = '#16204a'; c.beginPath(); c.moveTo(W * 0.12, H * 0.34); c.lineTo(W * 0.12, H * 0.14); c.quadraticCurveTo(W * 0.21, H * 0.03, W * 0.3, H * 0.14); c.lineTo(W * 0.3, H * 0.34); c.closePath(); c.fill();
      const lune = c.createRadialGradient(W * 0.24, H * 0.16, 2, W * 0.24, H * 0.16, W * 0.22);
      lune.addColorStop(0, 'rgba(255,250,220,.95)'); lune.addColorStop(0.12, 'rgba(255,245,210,.9)'); lune.addColorStop(0.16, 'rgba(190,200,255,.35)'); lune.addColorStop(1, 'rgba(160,170,255,0)');
      c.fillStyle = lune; c.fillRect(0, 0, W * 0.6, H * 0.45);
      c.strokeStyle = '#2a1d4f'; c.lineWidth = 7 * u; c.beginPath(); c.moveTo(W * 0.21, H * 0.06); c.lineTo(W * 0.21, H * 0.34); c.moveTo(W * 0.12, H * 0.22); c.lineTo(W * 0.3, H * 0.22); c.stroke();
      // Bannières
      for (const [bx, coul] of [[W * 0.78, '#a3283f'], [W * 0.92, '#2d4f9a']]) {
        c.fillStyle = coul; c.beginPath(); c.moveTo(bx - 28 * u, H * 0.05); c.lineTo(bx + 28 * u, H * 0.05); c.lineTo(bx + 28 * u, H * 0.3); c.lineTo(bx, H * 0.26); c.lineTo(bx - 28 * u, H * 0.3); c.closePath(); c.fill();
        c.fillStyle = '#f4c55c'; c.beginPath(); c.moveTo(bx, H * 0.1); c.lineTo(bx + 13 * u, H * 0.15); c.lineTo(bx, H * 0.2); c.lineTo(bx - 13 * u, H * 0.15); c.closePath(); c.fill();
      }
      // Sol en perspective (carrelage des cuisines)
      const sol0 = H * 0.6;
      for (let r = 0; r < 9; r++) {
        const y1 = sol0 + Math.pow(r / 9, 1.6) * (H - sol0), y2 = sol0 + Math.pow((r + 1) / 9, 1.6) * (H - sol0);
        for (let q = -8; q <= 8; q++) {
          const f1 = 0.35 + (y1 - sol0) / (H - sol0) * 1.4, f2 = 0.35 + (y2 - sol0) / (H - sol0) * 1.4;
          c.fillStyle = (q + r) % 2 ? '#d9a06e' : '#c28758';
          c.beginPath(); c.moveTo(W / 2 + q * 70 * u * f1, y1); c.lineTo(W / 2 + (q + 1) * 70 * u * f1, y1); c.lineTo(W / 2 + (q + 1) * 70 * u * f2, y2); c.lineTo(W / 2 + q * 70 * u * f2, y2); c.closePath(); c.fill();
        }
      }
      c.fillStyle = '#5b4590'; c.fillRect(0, sol0 - 18 * u, W, 20 * u);
      // Le rat géant qui surgit, et son regard qui balaie la salle
      const rx = W * 0.56, ry = H * 0.25;
      const cone = c.createRadialGradient(rx, ry, 10, rx, ry + H * 0.15, H * 0.5);
      cone.addColorStop(0, 'rgba(255,236,140,.55)'); cone.addColorStop(1, 'rgba(255,220,120,0)');
      c.fillStyle = cone; c.beginPath(); c.moveTo(rx - 30 * u, ry + 40 * u); c.lineTo(rx - W * 0.42, H * 0.8); c.lineTo(rx + W * 0.42, H * 0.8); c.lineTo(rx + 30 * u, ry + 40 * u); c.closePath(); c.fill();
      dessinerRat(c, { etat: 'poursuite', sous: '', ang: Math.PI / 2 + 0.08, bouge: true, id: 0 }, rx, ry, 150 * u);
      dessinerBulle(c, { etat: 'poursuite', sous: '', ang: 0 }, rx + 150 * u, ry - 20 * u, 70 * u);
      // Les deux héros qui filent, contour clair
      const halo = c.createRadialGradient(W * 0.5, H * 0.56, 20, W * 0.5, H * 0.56, W * 0.55);
      halo.addColorStop(0, 'rgba(255,240,200,.45)'); halo.addColorStop(1, 'rgba(255,240,200,0)');
      c.fillStyle = halo; c.fillRect(0, H * 0.25, W, H * 0.6);
      const ombreHeros = (x, y, kk, role, o) => {
        c.save(); c.shadowColor = 'rgba(255,245,210,.9)'; c.shadowBlur = 18 * u;
        dessinerRoyal(c, { role, dir: 2, bouge: true }, x, y, kk, Object.assign({ phase: tps }, o));
        c.restore();
      };
      ombreHeros(W * 0.33, H * 0.6, 118 * u, 'roi', { peur: true, bouge: true });
      ombreHeros(W * 0.68, H * 0.62, 112 * u, 'reine', { peur: false, joie: true, bouge: true });
      // La clé brandie et le joyau qui brille
      dessinerCle(c, W * 0.17, H * 0.5, 70 * u, 0.4);
      for (let q = 0; q < 3; q++) eclat(c, W * (0.1 + q * 0.06), H * (0.44 + (q % 2) * 0.06), 18 * u);
      dessinerJoyau(c, W * 0.86, H * 0.48, 60 * u, 0.3);
      // Premier plan : armoire et tonneau coupés par les bords
      dessinerCache(c, { def: { aile: 1 } }, 1, W * 0.02, H * 0.86, 120 * u, false, true);
      dessinerCache(c, { def: { aile: 1 } }, 2, W * 1.0, H * 0.88, 110 * u, false, false);
      // Poussière de course
      c.fillStyle = 'rgba(255,240,210,.5)';
      for (let q = 0; q < 14; q++) { rond(c, W * (0.2 + hache(q, 3) * 0.6), H * (0.7 + hache(q, 7) * 0.08), (3 + hache(q, 9) * 6) * u); c.fill(); }
      const vg = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
      vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,5,25,.45)');
      c.fillStyle = vg; c.fillRect(0, 0, W, H);
    };
    peindre();
    window.addEventListener('resize', peindre);
  }
  demarrer();
})();
</script>
</body>
