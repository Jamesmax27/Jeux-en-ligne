<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,

      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);

// =====================================================================
// bpm : tempo ; voies : nombre de grenouilles ; duree : secondes de chant ;

  { bpm: 96,  voies: 4, duree: 70, dens: .62, croches: .12, longues: .14, accords: .14, feuilles: .22, dorees: .06, trajet: 1900, rate: 8, fen: 1, nouveau: 'voie4' },

// =====================================================================

  tenue(freq) {
    if (!ac || !rec.son) return () => {};

// =====================================================================

const cv = document.getElementById('scene');

  g.addColorStop(0, '#3d4f8a'); g.addColorStop(.25, '#1f4a63'); g.addColorStop(1, '#0d2a33');

  // Reflet de lune
  d.fillStyle = 'rgba(255,244,207,.12)';
  for (let i = 0; i < 6; i++) d.fillRect(lx - 30 + i * 3, horizon + 8 + i * 9, 60 - i * 6, 2);
  // Rides
  d.strokeStyle = 'rgba(255,255,255,.06)'; d.lineWidth = 1.5;
  for (let i = 0; i < 18; i++) {
    const y = horizon + 20 + al() * (H - horizon), x = al() * W, l = 20 + al() * 50;
    d.beginPath(); d.moveTo(x - l, y); d.quadraticCurveTo(x, y - 3, x + l, y); d.stroke();
  }
  // Roseaux sur les côtés
  const roseau = (x, haut, pench) => {
    d.strokeStyle = '#1d4d34'; d.lineWidth = 3;
    d.beginPath(); d.moveTo(x, H); d.quadraticCurveTo(x + pench * .5, H - haut * .5, x + pench, H - haut); d.stroke();
    d.fillStyle = '#6b3f22';
    d.beginPath(); d.ellipse(x + pench, H - haut + 12, 4.5, 14, pench * .01, 0, 7); d.fill();
  };
  for (let i = 0; i < 5; i++) { roseau(4 + i * 7, H * .35 + al() * H * .2, -10 + al() * 20); roseau(W - 4 - i * 7, H * .35 + al() * H * .2, -10 + al() * 20); }
}

// =====================================================================
// 5. Génération des partitions (graine fixe : un niveau s'apprend)
// =====================================================================
function alea(graine) {
  let s = graine * 9301 + 49297;
  return () => (s = (s * 16807) % 2147483647) / 2147483647;
}
// Hauteur d'une note : la voie donne la note, la mesure fait évoluer la mélodie.
function frequence(voie, voies, beat, ton0) {
  const decal = [0, 1, 2, 1][Math.floor(beat / 4) % 4];
  const deg = Math.min(PENTA.length - 1, voie * (voies === 2 ? 2 : 1) + decal + 1);
  return 261.63 * Math.pow(2, (PENTA[deg] + ton0) / 12);
}
function genererPartition(i) {
  const def = NIVEAUX[i], r = alea(i * 131 + 17);
  const beatMs = 60000 / def.bpm, voies = def.voies;
  const total = Math.round(def.bpm * def.duree / 60 / 4) * 4;
  const notes = [];
  let derniere = Math.floor(voies / 2), dernierBeat = -9, occupe = 0;
  const ajouter = (b, voie, type, len) => {
    const n = { t: b * beatMs, beat: b, voie, type, etat: 0, freq: frequence(voie, voies, b, TONALITES[i]) };
    if (type === 'longue') n.fin = (b + len) * beatMs;
    notes.push(n); return n;
  };
  for (let b = 4; b < total; b += .5) {
    const surTemps = b % 1 === 0;
    if ((b - 4) % 16 >= 14) continue;                  // respiration en fin de phrase
    if (b < occupe) continue;                          // une note tenue occupe la mare
    const p = surTemps ? def.dens : (def.croches || 0);
    if (r() >= p) {
      // Temps libre : parfois une feuille morte qui tombe (à ne pas toucher)
      if (def.feuilles && surTemps && r() < def.feuilles && b - dernierBeat >= 1) {
        let v = Math.floor(r() * voies);
        if (v === derniere) v = (v + 1 + Math.floor(r() * (voies - 1))) % voies;
        ajouter(b, v, 'feuille');
      }
      continue;
    }
    // Mélodie : surtout des petits pas d'une voie à la voisine
    let v = derniere + [-1, 0, 1][Math.floor(r() * 3)];
    if (r() < .25) v = Math.floor(r() * voies);
    if (b - dernierBeat <= .5 && v === derniere) v = derniere + (r() < .5 ? -1 : 1);
    if (v < 0) v = 1; if (v >= voies) v = voies - 2;
    let type = 'simple';
    const finPhrase = 4 + Math.floor((b - 4) / 16) * 16 + 14;
    if (def.longues && surTemps && r() < def.longues && b + 2.5 < finPhrase) type = 'longue';
    else if (def.tetards && r() < def.tetards && b - dernierBeat >= 1) type = 'tetard';
    else if (def.dorees && r() < def.dorees) type = 'doree';
    const len = type === 'longue' ? (r() < .5 ? 1 : 2) : 0;
    const n = ajouter(b, v, type, len);
    if (type === 'tetard') {
      n.de = (v + 1 + Math.floor(r() * (voies - 1))) % voies;   // voie de départ différente
    }
    if (type === 'longue') occupe = b + len + 1;
    // Accord : une deuxième luciole en même temps, sur une autre voie
    else if (def.accords && surTemps && type !== 'tetard' && r() < def.accords) {
      let v2 = (v + 1 + Math.floor(r() * (voies - 1))) % voies;
      ajouter(b, v2, 'simple').accord = true;
      n.accord = true;
    }
    derniere = v; dernierBeat = b;
  }
  notes.sort((a, b) => a.t - b.t);
  return { notes, total };
}

// Tutoriels : petite partition jouée toute seule, avec une main qui montre le geste
// (titre et textes : traductions tuto.<clé>.titre et tuto.<clé>.<étape>).
// Notes : [temps, voie, type, longueur, voie de départ]
const TUTOS = {
  base: { voies: 2, notes: [[0, 0], [2, 1], [4, 0], [5, 1], [6, 0]] },
  voie3: { voies: 3, notes: [[0, 0], [1, 1], [2, 2], [3, 1], [4, 0]] },
  longue: { voies: 3, notes: [[0, 1], [2, 0, 'longue', 2], [5, 2, 'longue', 1]] },
  doree: { voies: 3, notes: [[0, 1], [1, 0], [2, 2, 'doree'], [3, 1], [4, 0, 'doree']] },
  accord: { voies: 3, notes: [[0, 0, 'accord'], [0, 2, 'accord'], [2, 1], [3, 0, 'accord'], [3, 1, 'accord']] },
  feuille: { voies: 3, notes: [[0, 0], [1, 2, 'feuille'], [2, 1], [3, 0, 'feuille'], [4, 2]] },
  voie4: { voies: 4, notes: [[0, 0], [1, 1], [2, 2], [3, 3], [4, 2]] },
  tetard: { voies: 4, notes: [[0, 1, 'tetard', 0, 3], [2, 2, 'tetard', 0, 0], [4, 0, 'tetard', 0, 2]] }
};

// =====================================================================
// 6. La partie en cours
// =====================================================================
let P = null;               // partie (ou démonstration) en cours
let ecran = 'accueil';
const grenouilles = [0, 1, 2, 3].map(() => ({ chant: 0, triste: 0, saut: 0, appui: false }));
const particules = [], textes = [], lucioles = [];
let secousse = 0, finTuto = null, tutoDebut = 0;

function creerPartie(opt) {
  const p = Object.assign({
    t: -600, score: 0, scoreAff: 0, combo: 0, maxCombo: 0, energie: 100, credit: 0,
    compte: { P: 0, B: 0, O: 0, R: 0 }, dernierBeat: -1, actif: true, enPause: false, tenues: [], arrets: [], decompte: null
  }, opt);
  p.beatMs = 60000 / p.bpm;
  p.total = p.notes.filter((n) => n.type !== 'feuille').length;
  p.fin = Math.max(...p.notes.map((n) => n.fin || n.t)) + p.beatMs * 2;
  p.fenP = 55 * p.fen; p.fenB = 110 * p.fen; p.fenO = 170 * p.fen;
  grenouilles.forEach((g) => { g.chant = 0; g.triste = 0; g.appui = false; });
  return p;
}
function demarrerPartie(i) {
  const def = NIVEAUX[i];
  const part = genererPartition(i);
  P = creerPartie({ niv: i, def, bpm: def.bpm, voies: def.voies, trajet: def.trajet, fen: def.fen, notes: part.notes, beats: part.total, demo: false });
  montrer(null);
  document.getElementById('btPause').classList.remove('cache');
  ecran = 'jeu';
}
function lancerNiveau(i) {
  const def = NIVEAUX[i];
  if (def.nouveau && !rec.tutos.includes(def.nouveau)) lancerTuto(def.nouveau, () => demarrerPartie(i));
  else demarrerPartie(i);
}
function lancerTuto(cle, suite) {
  const tu = TUTOS[cle];
  const bpm = 90, beatMs = 60000 / bpm, trajet = 2200, depart = trajet + 600;
  const notes = tu.notes.map(([b, voie, type, len, de]) => {
    const n = { t: depart + b * beatMs, voie, type: type === 'accord' ? 'simple' : (type || 'simple'), etat: 0,
      freq: frequence(voie, tu.voies, b, 0), beat: b };
    if (type === 'longue') n.fin = n.t + len * beatMs;
    if (type === 'tetard') n.de = de;
    return n;
  });
  P = creerPartie({ niv: -1, bpm, voies: tu.voies, trajet, fen: 1.3, notes, beats: 0, demo: true, tuto: tu, tutoCle: cle });
  P.t = 0;
  P.premiere = notes[0].t;
  document.getElementById('tutoTitre').textContent = t('tuto.' + cle + '.titre');
  const clav = { 2: '← →', 3: '← ↓ →', 4: '← ↓ ↑ →' }[tu.voies];
  document.getElementById('tutoClavier').textContent = t('auClavier', { touches: clav });
  document.getElementById('bulle').dataset.etape = '';
  majBulle(0);
  finTuto = () => {
    if (!rec.tutos.includes(cle)) { rec.tutos.push(cle); sauver(); }
    suite();
  };
  tutoDebut = performance.now();
  montrer('tuto');
  ecran = 'tuto';
}
function majBulle(etape) {
  const b = document.getElementById('bulle');
  if (b.dataset.etape === String(etape)) return;
  b.dataset.etape = etape;
  b.querySelector('.etape').textContent = t('etape', { n: etape + 1 });
  b.querySelector('.texte').textContent = t('tuto.' + P.tutoCle + '.' + etape);
}
function passerTuto() {
  if (ecran !== 'tuto' || performance.now() - tutoDebut < 500) return;
  arreterTenues();
  son.clic();
  const f = finTuto; finTuto = null;
  if (f) f();
}

// Position des voies à l'écran
function dispo(voies) {
  const lz = Math.min(W - 16, 460);
  const x0 = (W - lz) / 2, lw = lz / voies;
  const ligneY = H - Math.max(120, Math.min(175, H * .2));
  const r = Math.min(lw * .34, 44);
  return { x0, lw, ligneY, hautY: 92, r, x: (i) => x0 + lw * (i + .5) };
}

// Le joueur appuie sur une voie
function presser(voie) {
  if (!P || !P.actif || P.enPause || voie < 0 || voie >= P.voies) return;
  const g = grenouilles[voie];
  g.appui = true;
  const t = P.t;
  let cible = null, ecart = Infinity;
  for (const n of P.notes) {
    if (n.t - t > P.fenO) break;
    if (n.etat !== 0 || n.type === 'feuille' || n.voie !== voie) continue;
    const d = Math.abs(t - n.t);
    if (d <= P.fenO && d < ecart) { cible = n; ecart = d; }
  }
  const D = dispo(P.voies);
  if (cible) {
    const q = ecart <= P.fenP ? 'P' : ecart <= P.fenB ? 'B' : 'O';
    if (cible.type === 'longue') {
      cible.etat = 1; cible.q = q;
      P.tenues[voie] = cible;
      P.arrets[voie] = son.tenue(cible.freq);
      g.chant = 1;
      texte(D.x(voie), D.ligneY - D.r * 1.5, window.JEL_I18N.t(TEXTES[q]), COULEURS_LUCIOLES[voie]);
    } else {
      cible.etat = 2;
      reussite(cible, q, 1);
    }
    return;
  }
  // Pas de luciole : une feuille morte touchée ?
  for (const n of P.notes) {
    if (n.t - t > P.fenO) break;
    if (n.etat === 0 && n.type === 'feuille' && n.voie === voie && Math.abs(t - n.t) <= P.fenO * .85) {
      n.etat = 3;
      if (!P.demo) { P.energie -= 12; P.combo = 0; }
      son.feuille();
      g.triste = 1; secousse = 8;
      texte(D.x(voie), D.ligneY - D.r * 1.5, window.JEL_I18N.t('feuille'), '#ffb36b');
      eclats(D.x(voie), D.ligneY, '#c9772e', 14);
      return;
    }
  }
  // Toucher dans le vide : petit son doux, rien de perdu
  son.vide(frequence(voie, P.voies, Math.max(0, t / P.beatMs), P.niv >= 0 ? TONALITES[P.niv] : 0));
  g.saut = .5;
}
function relacher(voie) {
  if (!P || voie < 0 || voie >= 4) return;
  grenouilles[voie].appui = false;
  const n = P.tenues && P.tenues[voie];
  if (!n) return;
  const D = dispo(P.voies);
  if (P.t >= n.fin - P.fenB) finirTenue(n, voie, 1);
  else {
    const frac = Math.max(0, (P.t - n.t) / (n.fin - n.t));
    finirTenue(n, voie, frac);
    texte(D.x(voie), D.ligneY - D.r * 2.2, t('tropTot'), '#ffb36b');
  }
}
function finirTenue(n, voie, frac) {
  n.etat = 2;
  P.tenues[voie] = null;
  if (P.arrets[voie]) { P.arrets[voie](); P.arrets[voie] = null; }
  if (frac >= 1) reussite(n, n.q, 1, true);
  else {
    P.credit += CREDIT[n.q] * frac;
    P.compte.O++;
    P.score += Math.round(50 * frac * (n.fin - n.t) / P.beatMs);
    if (!P.demo) P.combo = 0;
  }
}
function arreterTenues() {
  if (!P) return;
  for (let v = 0; v < 4; v++) {
    if (P.arrets[v]) { P.arrets[v](); P.arrets[v] = null; }
    P.tenues[v] = null; grenouilles[v].appui = false;
  }
}
// Une note réussie : points, combo, énergie, effets
function reussite(n, q, frac, tenue) {
  const D = dispo(P.voies), x = D.x(n.voie), y = D.ligneY;
  P.combo++; P.maxCombo = Math.max(P.maxCombo, P.combo);
  P.compte[q]++;
  const mult = 1 + Math.min(3, Math.floor(P.combo / 10)) * .5;
  let pts = POINTS[q] * (n.type === 'doree' ? 3 : 1) * mult;
  if (tenue) pts += 50 * (n.fin - n.t) / P.beatMs;
  P.score += Math.round(pts);
  P.credit += CREDIT[q] * frac;
  P.energie = Math.min(100, P.energie + (q === 'P' ? 3 : 2) + (n.type === 'doree' ? 15 : 0));
  const g = grenouilles[n.voie];
  g.chant = 1; g.saut = 1;
  if (!tenue) son.chant(n.freq, q === 'O' ? .14 : .2);
  if (n.type === 'doree') {
    son.doree(n.freq);
    eclats(x, y, '#ffd65c', 26, true);
    texte(x, y - D.r * 1.5, t('dore'), '#ffd65c');
  } else {
    eclats(x, y, COULEURS_LUCIOLES[n.voie], q === 'P' ? 16 : 9);
    if (!tenue) texte(x, y - D.r * 1.5, t(TEXTES[q]), q === 'P' ? '#fff3c4' : '#d8f7c8');
    else texte(x, y - D.r * 1.5, t('bravo'), '#fff3c4');
  }
  if (P.combo > 0 && P.combo % 10 === 0 && !P.demo) {
    texte(W / 2, H * .42, t('combo', { n: P.combo }), '#ffd65c', 34);
    eclats(W / 2, H * .42, '#ffd65c', 20, true);
  }
}
function rate(n) {
  n.etat = 2;
  const D = dispo(P.voies);
  P.compte.R++;
  if (!P.demo) { P.combo = 0; P.energie -= P.def.rate; secousse = 5; }
  grenouilles[n.voie].triste = 1;
  son.rate();
  texte(D.x(n.voie), D.ligneY - D.r * 1.5, t('rate'), '#9fb4d9');
}

// Un temps de musique : batterie douce, basse, décompte au début
function surBeat(k) {
  grenouilles.forEach((g) => { g.saut = Math.max(g.saut, .25); });
  if (P.demo) { if (k % 2 === 0) son.kick(); son.charleston(); return; }
  if (k < 4) {
    P.decompte = { texte: ['3', '2', '1', t('chantez')][k], t: P.t };
    son.decompte(k === 3);
    return;
  }
  if (k >= P.beats) return;
  if (k % 2 === 0) son.kick();
  son.charleston();
  if (k % 4 === 0) son.basse(130.81 * Math.pow(2, (BASSES[(k / 4) % 4] + TONALITES[P.niv]) / 12), P.beatMs * 3.5 / 1000);
}

function miseAJour(dt) {
  if (!P || !P.actif || P.enPause) return;
  P.t += dt;
  const t = P.t;
  const k = Math.floor(t / P.beatMs);
  while (P.dernierBeat < k) { P.dernierBeat++; if (P.dernierBeat >= 0) surBeat(P.dernierBeat); }

  // Démonstration : le jeu joue tout seul, au temps parfait
  if (P.demo) {
    for (let v = 0; v < 4; v++) grenouilles[v].appui = !!P.tenues[v];
    for (const n of P.notes) {
      if (n.t > t) break;
      if (n.etat === 0 && n.type !== 'feuille') presser(n.voie);
    }
    const e = t < P.premiere - 1300 ? 0 : t < P.premiere - 150 ? 1 : 2;
    majBulle(e);
  }
  // Notes tenues : terminées quand la traîne arrive au rond
  for (let v = 0; v < 4; v++) {
    const n = P.tenues[v];
    if (!n) continue;
    if (t >= n.fin) { finirTenue(n, v, 1); if (P.demo) grenouilles[v].appui = false; }
    else if (Math.random() < .3) { const D = dispo(P.voies); eclats(D.x(v), D.ligneY, COULEURS_LUCIOLES[v], 1); grenouilles[v].chant = 1; }
  }
  // Lucioles passées sans être touchées
  for (const n of P.notes) {
    if (n.t > t) break;
    if (n.etat === 0 && t - n.t > P.fenO) {
      if (n.type === 'feuille') { n.etat = 2; if (!P.demo) P.score += 10; }
      else rate(n);
    }
  }
  // Fin
  if (P.demo) {
    if (t > P.fin + 600) {             // la démonstration recommence
      P.notes.forEach((n) => { n.etat = 0; });
      P.t = 0; P.dernierBeat = -1;
    }
    return;
  }
  if (P.energie <= 0) { P.energie = 0; terminer(false); }
  else if (t >= P.fin) terminer(true);
}

// =====================================================================
// 7. Effets : étincelles, textes, confettis
// =====================================================================
function eclats(x, y, couleur, nb, etoile) {
  for (let i = 0; i < nb; i++) {
    const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 4;
    particules.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, vie: 1, duree: 600 + Math.random() * 500,
      couleur, taille: 2 + Math.random() * 3, etoile: !!etoile, g: .08 });
  }
}
function confettis(nb) {
  const cs = ['#ffd65c', '#ff8fb1', '#8fe3ff', '#c6a0ff', '#9ad14f'];
  for (let i = 0; i < nb; i++) {
    particules.push({ x: Math.random() * W, y: -10 - Math.random() * H * .4, vx: (Math.random() - .5) * 2, vy: 1 + Math.random() * 2,
      vie: 1, duree: 3500, couleur: cs[i % cs.length], taille: 4 + Math.random() * 4, confetti: true, rot: Math.random() * 6, g: .02 });
  }
}
function texte(x, y, txt, couleur, taille) {
  textes.push({ x, y, txt, couleur, taille: taille || 22, vie: 1 });
}

// =====================================================================
// 8. Dessin de la scène
// =====================================================================
function grenouille(x, y, s, i, g, temps) {
  const coul = COULEURS_GRENOUILLES[i];
  const saut = g.saut * s * .25;
  // Nénuphar
  cx.fillStyle = '#2f8a4e';
  cx.beginPath(); cx.ellipse(x, y + s * .8, s * 1.3, s * .42, 0, .25, Math.PI * 2 - .05); cx.lineTo(x, y + s * .8); cx.fill();
  cx.fillStyle = '#3fa45e';
  cx.beginPath(); cx.ellipse(x, y + s * .74, s * 1.15, s * .32, 0, .3, Math.PI * 2 - .1); cx.lineTo(x, y + s * .74); cx.fill();
  if (g.appui) {
    cx.fillStyle = 'rgba(255,255,255,.18)';
    cx.beginPath(); cx.ellipse(x, y + s * .78, s * 1.35, s * .46, 0, 0, 7); cx.fill();
  }
  y -= saut;
  const gonfle = 1 + g.chant * .08;
  // Corps et pattes
  cx.fillStyle = coul;
  cx.beginPath(); cx.ellipse(x - s * .7, y + s * .55, s * .32, s * .18, -.3, 0, 7); cx.fill();
  cx.beginPath(); cx.ellipse(x + s * .7, y + s * .55, s * .32, s * .18, .3, 0, 7); cx.fill();
  cx.beginPath(); cx.ellipse(x, y + s * .2, s * .92 * gonfle, s * .62, 0, 0, 7); cx.fill();
  // Ventre
  cx.fillStyle = 'rgba(255,255,220,.35)';
  cx.beginPath(); cx.ellipse(x, y + s * .35, s * .55, s * .35, 0, 0, 7); cx.fill();
  // Sac vocal qui se gonfle quand elle chante
  if (g.chant > .05) {
    cx.fillStyle = `rgba(255,230,190,${.55 + g.chant * .4})`;
    cx.beginPath(); cx.ellipse(x, y + s * .2, s * .42 * g.chant + s * .05, s * .3 * g.chant + s * .04, 0, 0, 7); cx.fill();
  }
  // Yeux
  for (const c of [-1, 1]) {
    const ex = x + c * s * .42, ey = y - s * .35;
    cx.fillStyle = coul; cx.beginPath(); cx.arc(ex, ey, s * .27, 0, 7); cx.fill();
    cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(ex, ey, s * .19, 0, 7); cx.fill();
    cx.fillStyle = '#1b1b2f'; cx.beginPath(); cx.arc(ex, ey - s * .05, s * .1, 0, 7); cx.fill();
    cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(ex + s * .03, ey - s * .09, s * .035, 0, 7); cx.fill();
  }
  // Joues
  cx.fillStyle = 'rgba(255,140,170,.55)';
  cx.beginPath(); cx.arc(x - s * .55, y + s * .02, s * .1, 0, 7); cx.arc(x + s * .55, y + s * .02, s * .1, 0, 7); cx.fill();
  // Bouche

function luciole(x, y, r, couleur, temps, alpha) {

// Main du tutoriel
function main(x, y, appui) {
  cx.save(); cx.translate(x, y); const s = appui ? .88 : 1; cx.scale(s, s);
  cx.fillStyle = '#ffe2c4'; cx.strokeStyle = '#6b4a2e'; cx.lineWidth = 2.5;

  cx.moveTo(-6, 0); cx.lineTo(-6, 30);
  cx.quadraticCurveTo(-6, 38, -14, 36); cx.quadraticCurveTo(-24, 34, -18, 46);
  cx.lineTo(-6, 66); cx.quadraticCurveTo(4, 78, 22, 72);
  cx.quadraticCurveTo(34, 66, 30, 44); cx.lineTo(28, 30); cx.quadraticCurveTo(26, 24, 18, 26);
  cx.lineTo(6, 26); cx.lineTo(6, 0); cx.quadraticCurveTo(0, -8, -6, 0);

let tempsGlobal = 0;
function dessiner(dt) {
  tempsGlobal += dt;
  const T = tempsGlobal;
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (secousse > 0) { cx.translate((Math.random() - .5) * secousse, (Math.random() - .5) * secousse); secousse *= .85; if (secousse < .3) secousse = 0; }
  if (decor) cx.drawImage(decor, 0, 0, W, H);

  // Lucioles d'ambiance
  while (lucioles.length < 22) lucioles.push({ x: Math.random() * W, y: H * .2 + Math.random() * H * .6, a: Math.random() * 6, v: .2 + Math.random() * .4 });
  for (const l of lucioles) {
    l.a += .01 * l.v * dt / 16; l.x += Math.cos(l.a) * l.v; l.y += Math.sin(l.a * 1.3) * l.v * .6;
    if (l.x < 0) l.x = W; if (l.x > W) l.x = 0; if (l.y < H * .15) l.y = H * .8; if (l.y > H) l.y = H * .2;
    cx.fillStyle = `rgba(255,240,150,${.25 + .25 * Math.sin(T / 400 + l.a * 5)})`;
    cx.beginPath(); cx.arc(l.x, l.y, 2, 0, 7); cx.fill();
  }

  const voies = P ? P.voies : 4;
  const D = dispo(voies);
  const t = P ? P.t : 0;

  if (P) {
    // Couloirs et ronds
    for (let v = 0; v < voies; v++) {
      const x = D.x(v);
      cx.strokeStyle = 'rgba(255,255,255,.08)'; cx.lineWidth = 2; cx.setLineDash([4, 10]);
      cx.beginPath(); cx.moveTo(x, D.hautY); cx.lineTo(x, D.ligneY - D.r * .7); cx.stroke();
      cx.setLineDash([]);
      const pulse = 1 + (grenouilles[v].saut > .2 ? .06 : 0);
      cx.strokeStyle = grenouilles[v].appui ? COULEURS_LUCIOLES[v] : 'rgba(255,255,255,.55)';
      cx.lineWidth = grenouilles[v].appui ? 5 : 3;
      cx.beginPath(); cx.arc(x, D.ligneY, D.r * .66 * pulse, 0, 7); cx.stroke();
      if (grenouilles[v].appui) {
        cx.fillStyle = 'rgba(255,255,255,.12)'; cx.beginPath(); cx.arc(x, D.ligneY, D.r * .66, 0, 7); cx.fill();
      }
    }
    // Notes, de la plus lointaine à la plus proche
    const yDe = (temps) => D.ligneY - (temps - t) / P.trajet * (D.ligneY - D.hautY);
    for (let k = P.notes.length - 1; k >= 0; k--) {
      const n = P.notes[k];
      if (n.etat === 2 || n.etat === 3) continue;
      if (n.t - t > P.trajet * 1.08) continue;
      let y = yDe(n.t);
      const alpha = Math.max(0, Math.min(1, (y - D.hautY + 30) / 40));
      let x = D.x(n.voie);
      const r = D.r * .62;
      if (n.type === 'longue') {
        const yFin = Math.max(D.hautY - 20, yDe(n.fin));
        if (n.etat === 1) y = D.ligneY;
        cx.globalAlpha = alpha * (n.etat === 1 ? .85 : .55);
        cx.fillStyle = COULEURS_LUCIOLES[n.voie];
        const l = r * .7;
        cx.beginPath(); cx.roundRect ? cx.roundRect(x - l / 2, yFin, l, y - yFin, l / 2) : cx.rect(x - l / 2, yFin, l, y - yFin); cx.fill();
        cx.globalAlpha = 1;
        cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(x, yFin, l * .55, 0, 7); cx.fill();
        luciole(x, y, r, COULEURS_LUCIOLES[n.voie], T, alpha);
      } else if (n.type === 'doree') {
        cx.globalAlpha = alpha;
        const g = cx.createRadialGradient(x, y, 1, x, y, r * 1.5);
        g.addColorStop(0, 'rgba(255,214,92,.9)'); g.addColorStop(1, 'rgba(255,214,92,0)');
        cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r * 1.5, 0, 7); cx.fill();
        cx.fillStyle = '#ffd65c'; cx.strokeStyle = '#fff6c9'; cx.lineWidth = 2;
        etoileForme(x, y, r * .85, r * .4, 5, T / 300); cx.fill(); cx.stroke();
        cx.globalAlpha = 1;
      } else if (n.type === 'feuille') {
        feuille(x + Math.sin(T / 250 + k) * 4, y, r, T, alpha);
      } else if (n.type === 'tetard') {
        const tSaut = n.t - P.trajet * .45;
        const pj = Math.max(0, Math.min(1, (t - tSaut) / 260));
        const e = pj * pj * (3 - 2 * pj);
        x = D.x(n.de) + (D.x(n.voie) - D.x(n.de)) * e;
        y -= Math.sin(pj * Math.PI) * D.r * 1.2;
        tetard(x, y, r, COULEURS_LUCIOLES[pj < .5 ? n.de : n.voie], T, alpha);
      } else {
        luciole(x, y, r, COULEURS_LUCIOLES[n.voie], T, alpha);
      }
      if (n.accord && alpha > .5 && n.etat === 0) {
        cx.strokeStyle = 'rgba(255,255,255,.7)'; cx.lineWidth = 2;
        cx.beginPath(); cx.arc(x, y, r * 1.05, 0, 7); cx.stroke();
      }
    }
  }
  // Grenouilles
  for (let v = 0; v < voies; v++) {
    const g = grenouilles[v];
    grenouille(D.x(v), D.ligneY + D.r * .95, D.r, v, g, T);
    g.chant = Math.max(0, g.chant - dt / 300);
    g.triste = Math.max(0, g.triste - dt / 600);
    g.saut = Math.max(0, g.saut - dt / 180);
  }
  // À l'accueil, les grenouilles chantonnent en silence
  if (!P && Math.random() < .02) { const v = Math.floor(Math.random() * 4); grenouilles[v].chant = 1; grenouilles[v].saut = 1; eclats(D.x(v), D.ligneY, COULEURS_LUCIOLES[v], 5); }

  // Main du tutoriel
  if (P && P.demo) {
    const proch = P.notes.filter((n) => (n.etat === 0 && n.type !== 'feuille') || n.etat === 1);
    const feuilleProche = P.notes.find((n) => n.etat === 0 && n.type === 'feuille' && n.t - t < 700 && n.t - t > -200);
    if (proch.length) {
      const n = proch[0];
      if (P.mainX === undefined) P.mainX = D.x(n.voie);
      P.mainX += (D.x(n.voie) - P.mainX) * Math.min(1, dt / 120);
      const appui = n.etat === 1 || Math.abs(n.t - t) < 110;
      let yMain = D.ligneY + D.r * .4 + (appui ? 0 : 14 + Math.sin(T / 200) * 6);
      if (feuilleProche && !appui && feuilleProche.t < n.t) yMain += 40;
      main(P.mainX, yMain, appui);
      const autre = proch.find((m) => m !== n && m.t === n.t);
      if (autre) main(D.x(autre.voie), yMain, appui);
    }
    if (feuilleProche) {
      const x = D.x(feuilleProche.voie), y = D.ligneY - D.r * 1.6;
      cx.strokeStyle = '#ff6b6b'; cx.lineWidth = 6; cx.lineCap = 'round';
      cx.beginPath(); cx.moveTo(x - 12, y - 12); cx.lineTo(x + 12, y + 12); cx.moveTo(x + 12, y - 12); cx.lineTo(x - 12, y + 12); cx.stroke();
    }
  }

  // Particules
  for (let i = particules.length - 1; i >= 0; i--) {
    const p = particules[i];
    p.vie -= dt / p.duree;
    if (p.vie <= 0) { particules.splice(i, 1); continue; }
    p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.vy += p.g * dt / 16;
    if (p.confetti) p.vx += Math.sin(T / 300 + i) * .02;
    cx.globalAlpha = Math.min(1, p.vie * 2);
    cx.fillStyle = p.couleur;
    if (p.confetti) {
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot + T / 200); cx.fillRect(-p.taille / 2, -p.taille / 4, p.taille, p.taille / 2); cx.restore();
    } else if (p.etoile) {
      etoileForme(p.x, p.y, p.taille * 1.6, p.taille * .7, 5, T / 200); cx.fill();
    } else { cx.beginPath(); cx.arc(p.x, p.y, p.taille, 0, 7); cx.fill(); }
  }
  cx.globalAlpha = 1;
  // Textes flottants
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (let i = textes.length - 1; i >= 0; i--) {
    const s = textes[i];
    s.vie -= dt / 800; s.y -= dt * .04;
    if (s.vie <= 0) { textes.splice(i, 1); continue; }
    const echelle = s.vie > .85 ? 1 + (s.vie - .85) * 2 : 1;
    cx.globalAlpha = Math.min(1, s.vie * 2.5);
    cx.font = `900 ${Math.round(s.taille * echelle)}px system-ui, sans-serif`;
    cx.lineWidth = 5; cx.strokeStyle = 'rgba(20,15,51,.85)'; cx.strokeText(s.txt, s.x, s.y);
    cx.fillStyle = s.couleur; cx.fillText(s.txt, s.x, s.y);
  }
  cx.globalAlpha = 1;

  if (P && !P.demo) dessinerHUD(dt);
}

function dessinerHUD(dt) {
  // Barre d'avancement du chant
  cx.fillStyle = 'rgba(255,255,255,.15)'; cx.fillRect(8, 3, W - 16, 4);
  cx.fillStyle = '#b8f5a8'; cx.fillRect(8, 3, (W - 16) * Math.max(0, Math.min(1, P.t / P.fin)), 4);
  cx.textBaseline = 'middle';
  // Niveau
  cx.textAlign = 'left'; cx.fillStyle = '#fff8e8';
  cx.font = '800 16px system-ui, sans-serif'; cx.fillText(t('niveau', { n: P.niv + 1 }), 12, 26);
  cx.font = '600 12px system-ui, sans-serif'; cx.globalAlpha = .75;
  cx.fillText(t('nom.' + P.niv), 12, 44); cx.globalAlpha = 1;
  // Score qui défile
  P.scoreAff += (P.score - P.scoreAff) * Math.min(1, dt / 120);
  if (Math.abs(P.score - P.scoreAff) < 1) P.scoreAff = P.score;
  cx.textAlign = 'center';
  cx.font = '900 28px system-ui, sans-serif'; cx.fillStyle = '#fff3c4';
  cx.fillText(String(Math.round(P.scoreAff)), W / 2, 27);
  if (P.combo >= 3) {
    const mult = 1 + Math.min(3, Math.floor(P.combo / 10)) * .5;
    cx.font = `800 ${14 + Math.min(6, P.combo / 10)}px system-ui, sans-serif`; cx.fillStyle = '#ffd65c';
    cx.fillText(t('comboMult', { n: P.combo, m: mult }), W / 2, 52);
  }

  cx.fillStyle = 'rgba(0,0,0,.35)'; cx.fillRect(bx, by, bw, bh);
  const e = Math.max(0, P.energie) / 100;
  cx.fillStyle = e > .5 ? '#7ee07a' : e > .25 ? '#ffc04d' : '#ff6b6b';
  cx.fillRect(bx, by, bw * e, bh);
  cx.strokeStyle = 'rgba(255,255,255,.5)'; cx.lineWidth = 1.5; cx.strokeRect(bx, by, bw, bh);
  cx.font = '700 11px system-ui, sans-serif'; cx.fillStyle = '#fff'; cx.textAlign = 'left';
  cx.fillText(t('energie'), bx + 4, by + bh + 9);
  // Décompte « 3, 2, 1, Chantez ! »
  if (P.decompte && P.t - P.decompte.t < P.beatMs) {
    const a = 1 - (P.t - P.decompte.t) / P.beatMs;
    cx.globalAlpha = a; cx.textAlign = 'center';
    cx.font = `900 ${Math.round(60 + (1 - a) * 20)}px system-ui, sans-serif`;
    cx.lineWidth = 8; cx.strokeStyle = '#1d4d34'; cx.strokeText(P.decompte.texte, W / 2, H * .4);
    cx.fillStyle = '#fff3c4'; cx.fillText(P.decompte.texte, W / 2, H * .4);
    cx.globalAlpha = 1;
  }
}

const ECRANS = ['accueil', 'carte', 'tuto', 'pause', 'bilan'];
function montrer(nom) {
  ECRANS.forEach((e) => document.getElementById(e).classList.toggle('cache', e !== nom));
}
function allerAccueil() {
  arreterTenues(); P = null; ecran = 'accueil';
  document.getElementById('btPause').classList.add('cache');
  const tot = totalEtoiles();
  document.getElementById('resume').textContent = tot ? t('resume', { e: tot, max: NIVEAUX.length * 3, n: Math.min(NIVEAUX.length, rec.debloque + 1) }) : t('aChanter', { n: NIVEAUX.length });
  montrer('accueil');
}
function allerCarte() {
  arreterTenues(); P = null; ecran = 'carte';
  document.getElementById('btPause').classList.add('cache');
  const gr = document.getElementById('grille');
  gr.innerHTML = '';
  NIVEAUX.forEach((def, i) => {
    const b = document.createElement('button');
    b.className = 'case';
    const ok = i <= rec.debloque;
    b.disabled = !ok;
    const e = rec.etoiles[i] || 0;
    const etoiles = ok ? '★'.repeat(e) + `<span class="vide">${'★'.repeat(3 - e)}</span>` : '<span class="vide">— —</span>';
    b.innerHTML = `<b>${i + 1}</b><span>${t('nom.' + i)}</span><i>${etoiles}</i>`;
    b.setAttribute('aria-label', t('niveauNom', { n: i + 1, nom: t('nom.' + i) }));
    b.addEventListener('click', () => { initAudio(); son.clic(); lancerNiveau(i); });
    gr.appendChild(b);
  });
  document.getElementById('totalEtoiles').textContent = t('totalEtoiles', { e: totalEtoiles(), max: NIVEAUX.length * 3 });
  montrer('carte');
}
function terminer(reussi) {
  P.actif = false;
  arreterTenues();
  document.getElementById('btPause').classList.add('cache');
  ecran = 'bilan';
  const i = P.niv;
  const prec = P.total ? P.credit / P.total : 0;
  const etoiles = reussi ? (prec >= .9 ? 3 : prec >= .75 ? 2 : 1) : 0;
  const ancien = rec.meilleur[i] || 0;
  const record = reussi && P.score > ancien;
  if (reussi) {
    rec.etoiles[i] = Math.max(rec.etoiles[i] || 0, etoiles);
    rec.meilleur[i] = Math.max(ancien, P.score);
    rec.debloque = Math.min(NIVEAUX.length - 1, Math.max(rec.debloque, i + 1));
    sauver();
  }
  const dernier = i === NIVEAUX.length - 1;
  document.getElementById('bilanTitre').textContent = !reussi ? t('fatiguee')
    : dernier ? t('concert') : [t('bienJoue'), t('superChant'), t('magnifique')][etoiles - 1];
  const spans = document.querySelectorAll('#etoiles span');
  spans.forEach((s) => s.classList.remove('pleine'));
  for (let k = 0; k < etoiles; k++) {
    setTimeout(() => { spans[k].classList.add('pleine'); son.etoile(k); confettis(12); }, 500 + k * 450);
  }
  document.getElementById('record').classList.toggle('cache', !record);
  let details = t('details', { p: Math.round(prec * 100), a: P.compte.P, b: P.compte.B, c: P.compte.O, d: P.compte.R, m: P.maxCombo });
  if (!reussi) details += '<br>' + t('echecDetail', { p: Math.round(Math.min(1, P.t / P.fin) * 100) });
  else details += '<br>' + t('recordNiveau', { n: rec.meilleur[i] });
  if (reussi && dernier) details += '<br>' + t('total', { e: totalEtoiles(), max: NIVEAUX.length * 3 });
  document.getElementById('bilanDetails').innerHTML = details;
  document.getElementById('btSuivant').classList.toggle('cache', !reussi || dernier);
  // Le score défile jusqu'au total
  const el = document.getElementById('bilanScore'), cible = P.score, debut = performance.now();
  const defile = () => {
    const a = Math.min(1, (performance.now() - debut) / 1200);
    el.textContent = Math.round(cible * a * (2 - a));
    if (a < 1 && ecran === 'bilan') requestAnimationFrame(defile);
  };
  defile();
  if (reussi) { son.victoire(); confettis(70); } else son.echec();
  montrer('bilan');
}
function mettrePause() {
  if (!P || P.demo || !P.actif || P.enPause) return;
  P.enPause = true; arreterTenues();
  ecran = 'pause'; montrer('pause');
}
function reprendre() {
  if (!P) return;
  montrer(null); ecran = 'jeu';
  // On recule un peu pour laisser le temps de se replacer
  P.t -= 1000; P.enPause = false;
  P.dernierBeat = Math.floor(P.t / P.beatMs);
  P.notes.forEach((n) => { if (n.etat === 1) n.etat = 2; });
}

// =====================================================================
// 10. Commandes : doigt, souris, clavier
// =====================================================================
const doigts = new Map();
function voieDe(x) {
  const D = dispo(P.voies);
  return Math.max(0, Math.min(P.voies - 1, Math.floor((x - D.x0) / D.lw)));
}
cv.addEventListener('pointerdown', (e) => {
  initAudio();
  if (!P || P.demo || ecran !== 'jeu') return;
  e.preventDefault();
  const v = voieDe(e.clientX);
  doigts.set(e.pointerId, v);
  presser(v);
});
const lever = (e) => {
  if (!doigts.has(e.pointerId)) return;
  const v = doigts.get(e.pointerId); doigts.delete(e.pointerId);
  if ([...doigts.values()].includes(v)) return;   // un autre doigt tient encore la voie
  relacher(v);
};
window.addEventListener('pointerup', lever);
window.addEventListener('pointercancel', lever);
document.getElementById('tuto').addEventListener('pointerdown', (e) => { initAudio(); if (e.target.id !== 'btPasser') passerTuto(); });

const CLAVIER = {
  2: [['ArrowLeft', 'KeyD', 'KeyF'], ['ArrowRight', 'KeyJ', 'KeyK']],
  3: [['ArrowLeft', 'KeyD'], ['ArrowDown', 'ArrowUp', 'KeyF', 'KeyJ'], ['ArrowRight', 'KeyK']],
  4: [['ArrowLeft', 'KeyD'], ['ArrowDown', 'KeyF'], ['ArrowUp', 'KeyJ'], ['ArrowRight', 'KeyK']]
};
const touchesTenues = new Map();
window.addEventListener('keydown', (e) => {
  initAudio();
  if (ecran === 'tuto' && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); passerTuto(); return; }
  if (ecran !== 'jeu' || !P) return;
  if (e.code === 'Escape' || e.code === 'KeyP') { mettrePause(); return; }
  if (e.repeat) { e.preventDefault(); return; }
  let v = CLAVIER[P.voies].findIndex((l) => l.includes(e.code));
  if (v < 0 && (e.code === 'Space' || e.code === 'Enter')) {
    // Espace : touche la luciole la plus proche, quelle que soit sa voie
    let mieux = Infinity; v = -1;
    for (const n of P.notes) {
      if (n.etat !== 0 || n.type === 'feuille') continue;
      const d = Math.abs(n.t - P.t);
      if (d < mieux) { mieux = d; v = n.voie; }
      if (n.t > P.t + 400) break;
    }
    if (v < 0) v = 0;
  }
  if (v < 0) return;
  e.preventDefault();
  touchesTenues.set(e.code, v);
  presser(v);
});
window.addEventListener('keyup', (e) => {
  if (!touchesTenues.has(e.code)) return;
  const v = touchesTenues.get(e.code); touchesTenues.delete(e.code);
  if (![...touchesTenues.values()].includes(v)) relacher(v);
});

// Boutons
const clic = (id, f) => document.getElementById(id).addEventListener('click', () => { initAudio(); son.clic(); f(); });
clic('btJouer', () => {
  // Le premier niveau sans étoile, sinon le dernier débloqué
  let i = 0;
  while (i < rec.debloque && rec.etoiles[i]) i++;
  lancerNiveau(i);
});
clic('btNiveaux', allerCarte);
clic('btRetour', allerAccueil);
clic('btPasser', passerTuto);
clic('btPause', mettrePause);
clic('btReprendre', reprendre);
clic('btRecommencer', () => demarrerPartie(P.niv));
clic('btPauseNiveaux', allerCarte);
clic('btSuivant', () => lancerNiveau(P.niv + 1));
clic('btRejouer', () => demarrerPartie(P.niv));
clic('btBilanNiveaux', allerCarte);
const btSon = document.getElementById('btSon');
function majSon() {
  btSon.classList.toggle('muet', !rec.son);
  if (maitre) maitre.gain.value = rec.son ? .8 : 0;
}
btSon.addEventListener('click', () => { initAudio(); rec.son = !rec.son; sauver(); majSon(); son.clic(); });
majSon();
document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });
window.addEventListener('resize', redimensionner);

// =====================================================================
// 11. Boucle principale
// =====================================================================
let avant = performance.now();
function boucle(maintenant) {
  const dt = Math.min(50, maintenant - avant);
  avant = maintenant;
  miseAJour(dt);
  dessiner(dt);
  requestAnimationFrame(boucle);
}
redimensionner();
allerAccueil();
requestAnimationFrame(boucle);</script>
