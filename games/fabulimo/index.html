<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
'use strict';
/* ================= TRADUCTION =================
   Tous les textes visibles passent par T('cle', { variables }) : module commun
   jel-i18n (window.JEL_I18N). La langue est fixée au chargement de la page
   (un changement de langue relance le jeu), on peut donc traduire les données
   dès leur création. */
const T=(cle,vars)=>window.JEL_I18N.t(cle,vars);

'use strict';
/* ================= UTILITAIRES ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const rnd=Math.random;
function rint(a,b){return a+Math.floor(rnd()*(b-a+1))}
function pick(a){return a[Math.floor(rnd()*a.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function makeNoise(seed){
  const r=mulberry32(seed),P=new Uint8Array(512),V=new Float32Array(256);
  for(let i=0;i<256;i++){P[i]=i;V[i]=r()}
  for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));const t=P[i];P[i]=P[j];P[j]=t}
  for(let i=0;i<256;i++)P[i+256]=P[i];
  const sm=t=>t*t*(3-2*t);
  return (x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,X=xi&255,Y=yi&255;
    const a=V[P[P[X]+Y]],b=V[P[P[X+1]+Y]],c=V[P[P[X]+Y+1]],d=V[P[P[X+1]+Y+1]];
    const u=sm(xf),v=sm(yf);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v};
}
function fbm(n,x,y){return n(x,y)*0.6+n(x*2.1+17,y*2.1+9)*0.3+n(x*4.3+3,y*4.3+31)*0.1}
function shade(hex,amt){ // amt -1..1
  let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');
  let r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  if(amt<0){r*=1+amt;g*=1+amt;b*=1+amt}else{r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt}
  return '#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
}
function mix(h1,h2,t){const a=shade(h1,0),b=shade(h2,0);const p=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));
  const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}

/* ================= TYPES ================= */

const SHAPE_ST={round:[.32,.22,.24,.22],quad:[.25,.29,.22,.24],bird:[.22,.25,.18,.35],tall:[.26,.28,.27,.19],serpent:[.24,.28,.2,.28],bug:[.22,.25,.24,.29],fish:[.26,.25,.21,.28],blob:[.3,.23,.25,.22]};
(function buildSpecies(){
  let id=1;
  FAMILIES.forEach((line,fi)=>{
    const [ns,ts,shape,c1,c2]=line.split('|');const names=ns.split(',');const types=ts.split('/');
    const fam={i:fi,ids:[],types,shape,legend:fi>=LEGEND_START,starter:fi<3};FAMS.push(fam);
    const h=hashStr(names[0]);
    const L1=fam.starter?16:(names.length===3?14+h%8:20+h%9), L2=fam.starter?34:32+(h>>>3)%9;
    names.forEach((n,si)=>{
      const stage=si+1, size=names.length;
      let total=fam.legend?470:size===1?330:size===2?(stage===1?240:350):[0,220,310,400][stage];
      const ar=SHAPE_ST[shape];const hh=hashStr(n);
      const j=k=>1+(((hh>>>(k*5))&15)-7.5)/80;
      const base={hp:Math.round(total*ar[0]*j(0)),atk:Math.round(total*ar[1]*j(1)),def:Math.round(total*ar[2]*j(2)),spd:Math.round(total*ar[3]*j(3))};
      const sp={id,name:n,types,shape,c1,c2,stage,fam:fi,famSize:size,base,h:hh,legend:fam.legend,
        exp:fam.legend?300:size===1?170:[0,64,145,230][stage]+(size===2&&stage===2?30:0),
        catchRate:fam.legend?12:size===2?(stage===1?150:70):[0,190,90,45][stage]};
      sp.desc=T(stage===3||fam.legend?'desc.stage3':stage===2?'desc.stage2':(size>1?'desc.evolves':'desc.noevo'),{phrase:DESC_T[types[0]][hh%3]});
      if(fam.legend)sp.desc=T('desc.legend',{phrase:DESC_T[types[0]][hh%3]});
      SPECIES[id]=sp;fam.ids.push(id);id++;
    });
    fam.ids.forEach((sid,k)=>{if(k<fam.ids.length-1)SPECIES[sid].evo={to:fam.ids[k+1],lvl:k===0?L1:L2}});
  });
  // apprentissage des attaques
  for(let i=1;i<SPECIES.length;i++){const sp=SPECIES[i];const t1=sp.types[0];
    let cov=sp.types[1]||(t1==='normal'?TYPE_KEYS[1+sp.h%9]:(['feu','eau','plante'].includes(t1)?'normal':TYPE_KEYS[1+(sp.h>>>4)%9]));
    if(cov===t1)cov='normal';
    const L=[[1,'charge'],[1,TIER[t1][0]],[4,sp.h%2?'cri':'armure'],[8,TIER[cov][0]],[12,STATUSM[t1][0]],[16,TIER[t1][1]],
      [21,sp.shape==='bird'||sp.shape==='bug'?'vif':'coupTete'],[26,TIER[cov][1]],[31,STATUSM[t1][1]],[36,TIER[t1][2]],
      [42,sp.h%3===0?'repos':TIER[cov][2]],[48,TIER[t1][3]],[55,TIER[cov][3]]];
    const seen=new Set();sp.learn=L.filter(([l,m])=>{if(seen.has(m))return false;seen.add(m);return true});
  }
})();

/* ===== pools de rencontres ===== */
const POOLS={},FISH={};
function buildPools(){
  const count={};REGIONS.forEach(r=>{POOLS[r.k]=[];count[r.k]=0});
  const home={};
  const fams=FAMS.filter(f=>!f.legend&&!f.starter);
  // ordonner pour répartir
  fams.forEach((f,idx)=>{let cands=REGIONS.filter(r=>r.k!=='A'&&AFF[r.b].includes(f.types[0]));if(!cands.length)cands=REGIONS.filter(r=>r.k!=='A'&&AFF[r.b].includes(f.types[1]));if(!cands.length)cands=REGIONS.filter(r=>r.k!=='A');
    cands.sort((a,b)=>count[a.k]-count[b.k]||((hashStr(f.ids[0]+a.k)%7)-(hashStr(f.ids[0]+b.k)%7)));const r=cands[0];count[r.k]++;home[f.i]=r.k;POOLS[r.k].push({f:f.i,w:3})});
  // les régions voisines partagent un peu
  REGIONS.forEach((r,i)=>{if(i>0){const prev=REGIONS[i-1];POOLS[prev.k].slice(0,2).forEach(e=>{if(!POOLS[r.k].some(x=>x.f===e.f))POOLS[r.k].push({f:e.f,w:1})})}});
  // Bourg-Plume : quelques familles faciles
  POOLS.A=POOLS.B.slice(0,3).map(e=>({f:e.f,w:2}));
  // pêche
  const eauF=FAMS.filter(f=>!f.legend&&!f.starter&&f.types.includes('eau'));
  REGIONS.forEach((r,i)=>{FISH[r.k]=[eauF[i%eauF.length],eauF[(i*3+1)%eauF.length],eauF[(i*5+2)%eauF.length]].map(f=>({f:f.i,w:1}))});
  POOLS._home=home;
}
function rollWild(rk,fish){const pool=fish?FISH[rk]:POOLS[rk];const r=RK[rk];let tot=0;for(const e of pool)tot+=e.w;let x=rnd()*tot,e=pool[0];for(const p of pool){x-=p.w;if(x<=0){e=p;break}}
  const lv=rint(r.lv[0],r.lv[1])+(fish?1:0);return makeMon(speciesAtLevel(FAMS[e.f].ids[0],lv),lv)}

/* ================= INTÉRIEURS ================= */
function interiorFor(b){

  const pal=kind==='arena'?{floor:shade(TYPES[b.gymType].c,0.55),wall:shade(TYPES[b.gymType].c,0.1),accent:TYPES[b.gymType].c}:kind==='ligue'?{floor:'#3a2a5a',wall:'#6a4ab8',accent:'#ffd23a'}:

  while(team.length<g.n){const f=fams[Math.floor(r()*fams.length)];if(used.has(f.i)&&used.size<fams.length)continue;used.add(f.i);const lv=g.lv-(g.n-1-team.length);team.push([speciesAtLevel(f.ids[0],lv+4),lv])}return team}
function ligueTeam(k){const m=LIGUE[k];const r=mulberry32(k*313+7);const team=[];

  const used=new Set();while(team.length<(k===4?6:5)){const f=fams[Math.floor(r()*fams.length)];if(used.has(f.i))continue;used.add(f.i);team.push([f.ids[f.ids.length-1],m.lv-(k===4?5:4)+team.length])}return team}
function rivalTeam(n,starterFam){const counter=[1,2,0][starterFam];const sf=FAMS[counter];

  team.push([sf.ids[2],58]);return team}

const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyZ:'up',KeyS:'down',KeyA:'left',KeyQ:'left',KeyD:'right',

  if(b==='RUN'){G.running=true;return}

function getMap(id){if(id==='world')return WORLD;if(MAPS[id])return MAPS[id];const b=WORLD.blds.find(b=>b.id===id);return b?interiorFor(b):WORLD}
function curRegion(){if(G.map===WORLD)return REGIONS[WORLD.reg[S.y*WW+S.x]];return RK[G.map.region]||RK.A}
function npcAt(M,x,y){return M.npcs.find(n=>!n.gone&&n.x===x&&n.y===y)}
function itemAt(M,x,y,hiddenToo){return M.items.find(it=>it.x===x&&it.y===y&&!S.taken[it.id]&&(hiddenToo||!it.hidden))}
function walkable(M,x,y,forNpc){if(x<0||y<0||x>=M.w||y>=M.h)return false;const i=y*M.w+x;if(tileSolid(M.g[i])||M.solidX[i])return false;
  if(npcAt(M,x,y))return false;if(itemAt(M,x,y))return false;if(forNpc&&(M.warps[x+','+y]||M.road&&M.gates[x+','+y]))return false;
  if(forNpc&&S.x===x&&S.y===y)return false;return true}
function applyMapState(M){
  for(const n of M.npcs){if(n.ligue!=null&&S.beat[n.id]&&!n.moved){M.g[n.y*M.w+4]=T_DARK;n.x=4;n.moved=1}
    if(n.id==='rival1'&&!S.flags.starter)n.gone=1;else if(n.id==='rival1')n.gone=0;}
}

function setMap(id,x,y,dir){G.map=getMap(id);S.map=G.map.id;S.x=x;S.y=y;if(dir!=null)S.dir=dir;TILE_PAL=G.map.pal||null;TILE_CACHE.clear();applyMapState(G.map);
  G.walk=null;onRegionMaybeChanged(true);playMusic(G.map.outdoor?(curRegion().town?'town':'route'):(G.map.music||'town'))}
async function warpTo(id,x,y,dir){G.lock++;sfx('door');await fade(true);setMap(id,x,y,dir);await fade(false);G.lock--;saveGame(true)}
function tryMove(dirName){
  const [dx,dy,d]=DIRS[dirName];
  if(S.dir!==d&&!G.walk&&G.heldT<0.09){S.dir=d;return}
  S.dir=d;const M=G.map,nx=S.x+dx,ny=S.y+dy;
  const gate=M.gates&&M.gates[nx+','+ny];
  if(gate){const ok=gate.req==='starter'?S.flags.starter:S.badges.filter(Boolean).length>=gate.req;
    if(!ok){bump();const guard=M.npcs.find(n=>n.guard===gate.req);talkGuardBlock(guard);return}}
  if(!walkable(M,nx,ny)){bump();return}
  G.walk={fx:S.x,fy:S.y,tx:nx,ty:ny,p:0,speed:G.running||touchRun?8.5:4.6};
}
function bump(){if(G.t-G.lastBump>0.35){sfx('bump');G.lastBump=G.t}}
async function talkGuardBlock(g){G.lock++;held.clear();G.heldDir=null;await say(g?g.lines[0]:T('e.gate.blocked'),{name:g?g.name:''});G.lock--}
async function afterStep(){
  const M=G.map;S.steps++;if(S.repel>0){S.repel--;if(S.repel===0)toast(T('e.repel.end'))}
  const key=S.x+','+S.y;
  const w=M.warps[key];
  if(w){if(w.bld){const b=WORLD.blds.find(b=>b.id===w.bld);const IM=interiorFor(b);await warpTo(IM.id,IM.entry.x,IM.entry.y,1);return}
    await warpTo(w.map,w.x,w.y,w.dir);return}
  if(M===WORLD)onRegionMaybeChanged();
  if(await checkTrainerSight())return;
  const t=M.g[S.y*M.w+S.x];
  if(tileTall(t)&&!G.lock){const lead=S.team.find(m=>m.hp>0);const rate=0.09;
    if(rnd()<rate){const r=curRegion();const wild=rollWild(r.k);if(S.repel>0&&lead&&wild.lvl<lead.lvl){}else{await startWildBattle(wild);return}}}
}

  if(!S.visited[r.k]){S.visited[r.k]=1;addTXP(15,T('e.region.new'),true)}}
function frontTile(){const [dx,dy]=DIRV[S.dir];return [S.x+dx,S.y+dy]}

/* ================= DRESSEURS ================= */
async function checkTrainerSight(){
  const M=G.map;
  for(const n of M.npcs){if(!n.trainer||n.gone||S.beat[n.id]||!n.sight)continue;if(n.id==='rival2'&&S.badges.filter(Boolean).length<8)continue;
    const [dx,dy]=DIRV[n.dir];let x=n.x,y=n.y;
    for(let s=1;s<=n.sight;s++){x+=dx;y+=dy;if(x===S.x&&y===S.y){await trainerApproach(n,s);return true}
      const i=y*M.w+x;if(x<0||y<0||x>=M.w||y>=M.h||tileSolid(M.g[i])||M.solidX[i]||npcAt(M,x,y))break}}
  return false;
}
async function trainerApproach(n,dist){
  G.lock++;held.clear();G.heldDir=null;sfx('alert');G.emotes.push({npc:n,t:0.9});await wait(800);
  const [dx,dy]=DIRV[n.dir];for(let s=1;s<dist;s++){await npcStep(n,dx,dy)}
  S.dir=[1,0,3,2][n.dir];G.lock--;await talk(n);
}

/* ================= INTERACTIONS ================= */
async function interact(){
  const M=G.map;let [fx,fy]=frontTile();
  if(fx<0||fy<0||fx>=M.w||fy>=M.h)return;
  let n=npcAt(M,fx,fy);const ft=M.g[fy*M.w+fx];
  if(!n&&(ft===T_COUNTER||ft===T_TABLE)){const [dx,dy]=DIRV[S.dir];n=npcAt(M,fx+dx,fy+dy)}
  if(n){return talk(n)}
  const it=itemAt(M,fx,fy,true);if(it)return pickItem(it);
  const key=fx+','+fy;
  if(ft===T_SIGN){G.lock++;await say(M.signs[key]||T('e.sign.blank'));G.lock--;return}
  if(ft===T_BERRY)return harvest(key);
  if(ft===T_SHRINE)return shrine(M.shrines[key]);
  if(ft===T_PC){G.lock++;sfx('menu');await say(T('e.pc.on'));await pcScreen();G.lock--;return}
  if(ft===T_TV){G.lock++;await say(T('e.tv.'+rint(0,2)));G.lock--;return}
  if(ft===T_SHELF){G.lock++;await say(T('e.shelf.'+rint(0,2)));G.lock--;return}
  if(ft===T_STATUE&&G.map.kind==='arena'){G.lock++;const g=GYMS[RK[G.map.region].gym];await say(T(S.badges[RK[G.map.region].gym]?'e.statue.arenaWon':'e.statue.arena',{region:RK[G.map.region].n,champion:g.leader,nom:S.name}));G.lock--;return}
  if(tileWater(ft)&&S.bag.canne)return fish();
  if(tileWater(ft)){G.lock++;await say(T('e.water.look'));G.lock--}
}

    else{ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(dx+T/2,dy+T*0.78,T*0.22,T*0.07,0,0,7);ctx.fill();drawCapsuleIcon(ctx,dx+T/2,dy+T/2+Math.sin(G.t*3+it.x)*T*0.03,T*0.22,'#ff6a8a')}}
  // personnages triés
  const chars=[];
  for(const n of M.npcs){if(n.gone)continue;let x=n.x,y=n.y;const a=G.npcAnim[n.id];if(a){x=a.fx+(n.x-a.fx)*a.p;y=a.fy+(n.y-a.fy)*a.p}
    if(x<x0-1||x>x1+1||y<y0-1||y>y1+1)continue;chars.push({x,y,look:n.look,dir:n.dir,fr:a?(a.p<0.5?1:3):0,n})}

function drawChest(ctx,x,y,T,open){const u=T/32;ctx.save();ctx.translate(x,y);ctx.scale(u,u);ctx.lineWidth=1.6;ctx.strokeStyle='#2a2034';

async function startTrainerBattle(npc){

function effStat(m,k){let v=m.st[k]*stageMul(m.stg?m.stg[k]:0);if(k==='spd'&&m.status==='para')v*=0.5;if(k==='atk'&&m.status==='burn')v*=0.5;return v}
async function battle(opt){
  const music=opt.trainer?(opt.trainer.leader!=null||opt.trainer.ligue!=null||opt.trainer.rival?'boss':'battle'):(opt.legend?'boss':'battle');

  B.foe=B.foes[0];
  const lead=S.team.findIndex(m=>m.hp>0);B.mi=lead<0?0:lead;B.me=S.team[B.mi];
  for(const m of [...S.team,...B.foes]){m.stg={atk:0,def:0,spd:0};m.sleepT=0}
  buildBattleUI();
  B.part.add(B.me.uid);
  if(B.wild){await bsay(T(opt.legend?'b.legend.appears':B.foe.shiny?'b.wild.appearsShiny':'b.wild.appears',{nom:SPECIES[B.foe.sp].name}),1300)}
  else{await bsay(T('b.trainer.wants',{dresseur:B.trainer.name}),1200);await bsay(T('b.trainer.sends',{dresseur:B.trainer.name,nom:monName(B.foe)}),900)}

async function battleLoop(){

    const act=await chooseAction();
    let r=await doTurn(act);if(r)return r;
  }

function aiPick(m,t){const opts=m.moves.filter(x=>x.pp>0);if(!opts.length)return 'lutte';
  if(B.wild&&rnd()<0.35)return pick(opts).id;
  let best=null,bs=-1;for(const mv of opts){const M=MOVES[mv.id];let s;
    if(M.p)s=M.p*typeEff(M.t,SPECIES[t.sp].types)*(SPECIES[m.sp].types.includes(M.t)?1.5:1)*(M.acc||100)/100;
    else if(M.fx==='heal')s=m.hp<m.st.hp*0.45?120:0;
    else if(['sleep','para','burn','poison'].includes(M.fx))s=t.status?0:55;
    else s=25;
    s*=0.8+rnd()*0.4;if(s>bs){bs=s;best=mv.id}}return best}
async function doTurn(act){
  const foeAct={kind:'move',id:aiPick(B.foe,B.me)};
  // actions non-attaque du joueur
  if(act.kind==='run'){if(B.trainer){await bsay(T('b.run.trainer'));return null}
    B.escapes++;const ok=B.legend?rnd()<0.5:(effStat(B.me,'spd')>=effStat(B.foe,'spd')||rnd()<0.6+B.escapes*0.15);
    if(ok){sfx('run');await bsay(T('b.run.ok'),800);return 'run'}await bsay(T('b.run.fail'),900)}
  else if(act.kind==='switch'){await switchTo(act.i,false)}
  else if(act.kind==='item'){const r=await useItemBattle(act);if(r)return r}
  if(act.kind==='move'){
    const myMove=act.i<0?'lutte':B.me.moves[act.i].id;
    const pr=x=>MOVES[x].fx==='prio'?1:0;
    let meFirst=pr(myMove)!==pr(foeAct.id)?pr(myMove)>pr(foeAct.id):effStat(B.me,'spd')>=effStat(B.foe,'spd')*(0.95+rnd()*0.1);
    const order=meFirst?[['me',myMove],['foe',foeAct.id]]:[['foe',foeAct.id],['me',myMove]];
    for(const [side,mid] of order){const a=side==='me'?B.me:B.foe,d=side==='me'?B.foe:B.me;if(a.hp<=0||d.hp<=0)continue;
      if(side==='me'&&act.i>=0)B.me.moves[act.i].pp--;else if(side==='foe'){const mv=B.foe.moves.find(x=>x.id===mid);if(mv)mv.pp--}
      await performMove(side,mid);
      const r=await checkFaints();if(r)return r;if(r===false)break}
  } else {if(B.foe.hp>0&&B.me.hp>0){await performMove('foe',foeAct.id);const r=await checkFaints();if(r)return r}}
  // fin de tour : brûlure / poison
  for(const side of ['me','foe']){const m=side==='me'?B.me:B.foe;if(m.hp<=0)continue;
    if(m.status==='burn'||m.status==='poison'){const d=Math.max(1,Math.floor(m.st.hp/(m.status==='burn'?16:10)));const from=m.hp;m.hp=Math.max(0,m.hp-d);
      await bsay(T(m.status==='burn'?'b.hurt.burn':'b.hurt.poison',{qui:who(side)}),800);await animHp(side,from,m.hp);const r=await checkFaints();if(r)return r}}
  return null;
}
function who(side){const m=side==='me'?B.me:B.foe;return side==='me'?monName(m):T(B.wild?'b.who.wild':'b.who.foe',{nom:monName(m)})}
async function performMove(side,mid){
  const a=side==='me'?B.me:B.foe,d=side==='me'?B.foe:B.me,ds=side==='me'?'foe':'me';const M=MOVES[mid];
  // statut bloquant
  if(a.status==='sleep'){a.sleepT=(a.sleepT||rint(1,3))-1;if(a.sleepT<=0){a.status=null;updInfo(side);await bsay(T('b.wake',{qui:who(side)}),800)}else{await bsay(T('b.sleeping',{qui:who(side)}),900);return}}
  if(a.status==='frz'){if(rnd()<0.3||M.t==='feu'){a.status=null;updInfo(side);await bsay(T('b.thaw',{qui:who(side)}),800)}else{await bsay(T('b.frozen',{qui:who(side)}),900);return}}
  if(a.status==='para'&&rnd()<0.25){await bsay(T('b.para.stuck',{qui:who(side)}),1000);return}
  await bsay(T('b.uses',{qui:who(side),attaque:M.n}),700);
  if(M.acc&&rnd()*100>=M.acc){await sprFx(side,'atk',300);await bsay(T('b.miss'),800);return}
  const fx=M.fx||'';
  if(M.p>0){
    await sprFx(side,'atk',280);sfx('hit');
    const eff=typeEff(M.t,SPECIES[d.sp].types);const stab=SPECIES[a.sp].types.includes(M.t)?1.5:1;const crit=rnd()<0.0625?1.5:1;
    let dmg=Math.floor((Math.floor(2*a.lvl/5)+2)*M.p*effStat(a,'atk')/Math.max(1,effStat(d,'def'))/50)+2;
    dmg=Math.max(1,Math.floor(dmg*eff*stab*crit*(0.85+rnd()*0.15)));if(mid==='lutte')dmg=Math.max(1,Math.floor(dmg*0.8));
    const from=d.hp;d.hp=Math.max(0,d.hp-dmg);hitFlash(ds,M.t);await sprFx(ds,'hit',380);await animHp(ds,from,d.hp);
    if(crit>1)await bsay(T('b.crit'),700);
    if(eff>1)await bsay(T('b.super'),800);else if(eff<1)await bsay(T('b.notvery'),800);
    if(fx==='drain'&&a.hp>0){const h=Math.max(1,Math.floor(dmg/2));const f2=a.hp;a.hp=Math.min(a.st.hp,a.hp+h);await animHp(side,f2,a.hp);await bsay(T('b.drain',{qui:who(side)}),700)}
    if(mid==='lutte'&&a.hp>0){const f2=a.hp;a.hp=Math.max(0,a.hp-Math.ceil(a.st.hp/8));await animHp(side,f2,a.hp)}
    const m=fx.match(/^(burn|para|frz):(\d+)$/);if(m&&d.hp>0&&rnd()*100<+m[2])await applyStatus(ds,m[1]);
  } else {
    await sprFx(side,'buff',350);
    if(fx==='heal'){const f2=a.hp;a.hp=Math.min(a.st.hp,a.hp+Math.floor(a.st.hp/2));sfx('heal');await animHp(side,f2,a.hp);await bsay(T('b.heal',{qui:who(side)}),800)}
    else if(['burn','para','sleep','poison','frz'].includes(fx)){await applyStatus(ds,fx,true)}
    else{const p=fx.split(':');const tgt=p[0]==='self'?a:d;const ts=p[0]==='self'?side:ds;const k=p[1],n=+p[2];
      const old=tgt.stg[k];tgt.stg[k]=clamp(old+n,-6,6);
      if(old===tgt.stg[k])await bsay(T('b.stat.'+k+'.max',{qui:who(ts)}),800);
      else{sfx(n>0?'buff':'debuff');await sprFx(ts,n>0?'buff':'debuffed',300);await bsay(T('b.stat.'+k+'.'+(n>0?(n>1?'up2':'up'):(n<-1?'down2':'down')),{qui:who(ts)}),850)}}
  }
}
async function applyStatus(side,st,announceFail){const m=side==='me'?B.me:B.foe;const types=SPECIES[m.sp].types;
  const immune=(st==='burn'&&types.includes('feu'))||(st==='frz'&&types.includes('glace'))||(st==='para'&&types.includes('elec'));
  if(m.status||immune||m.hp<=0){if(announceFail)await bsay(T('b.noeffect'),800);return}

function applyItem(m,id){const I=ITEMS[id];let from=null,msg='';

async function throwBall(id){const I=ITEMS[id];const m=B.foe;
  await bsay(T('b.ball.throw',{nom:S.name,objet:I.n}),600);
  const sc=B.el.querySelector('.bt-scene');const ball=document.createElement('canvas');const bs=Math.round(46*G.dpr);ball.width=ball.height=bs;
  drawCapsuleIcon(ball.getContext('2d'),bs/2,bs/2,bs*0.36,id==='etoileCapsule'?'#ffd23a':id==='hyperCapsule'?'#3a3a4a':id==='superCapsule'?'#3a7ae8':'#2ab0c8');
  ball.className='ballfx';const scR=sc.getBoundingClientRect(),fr=B.el.querySelector('.bt-spr.foe').getBoundingClientRect();
  ball.style.setProperty('--x0',(scR.width*0.12)+'px');ball.style.setProperty('--y0',(scR.height*0.78)+'px');ball.style.setProperty('--x1',(fr.left-scR.left+fr.width/2-23)+'px');ball.style.setProperty('--y1',(fr.top-scR.top+fr.height*0.6)+'px');
  sc.appendChild(ball);sfx('throw');
  await wait(650);await sprFx('foe','absorb',400);
  const rate=SPECIES[m.sp].catchRate;const stb=m.status==='sleep'||m.status==='frz'?2:m.status?1.5:1;
  let p=((3*m.st.hp-2*m.hp)*rate*I.ball*stb)/(3*m.st.hp)/255*1.35;if(I.ball>100)p=1;
  const caught=rnd()<p;const shakes=caught?3:Math.min(2,Math.floor(rnd()*3*Math.max(p,0.3)+0.5));
  ball.classList.add('land');
  for(let i=0;i<shakes;i++){await wait(450);ball.classList.remove('wob');void ball.offsetWidth;ball.classList.add('wob');sfx('shake')}
  await wait(500);
  if(caught){sfx('catch');ball.classList.add('done');await bsay(T('b.caught',{nom:SPECIES[m.sp].name}),1400);
    const isNew=!S.dex.caught[m.sp];m.stg=null;m.status=m.status;const where=addMon(m);ball.remove();
    if(isNew)await bsay(T('b.dex.new',{nom:SPECIES[m.sp].name}),1100);
    if(where==='box')await bsay(T('b.box',{nom:SPECIES[m.sp].name}),1300);
    await giveXP(m);await addTXPq(isNew?40:20);return 'caught'}
  ball.remove();showSprite('foe',true);await bsay(T('b.escape.'+Math.min(2,shakes)),1000);return null}

    sfx('evo');playMusic('evo');el.classList.add('run');
    setTimeout(()=>{el.classList.add('done');sfx('fanfare');const oldName=monName(m);m.sp=to.id;if(m.nick)m.nick=null;refreshStats(m);markDex(to.id,true);
      el.querySelector('.evo-msg').textContent=T('b.evo.done',{ancien:oldName,nouveau:to.name});
      const pop=pushHandler(b=>{if(b==='A'||b==='B')fin()});el.onclick=fin;let done=0;function fin(){if(done)return;done=1;pop();el.remove();res()}},3600)});

const $=s=>document.querySelector(s);
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function fmt(n){return window.JEL_I18N.nombre(Math.floor(n))}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function focusFirst(el){const b=el.querySelector('button:not([disabled]):not([data-back]),input')||el.querySelector('button:not([disabled])');if(b)b.focus({preventScroll:true})}
function navHandler(el,onBack){return btn=>{
  const items=[...el.querySelectorAll('button:not([disabled]),input,.navi')].filter(b=>b.offsetParent!==null);
  if(!items.length){if(btn==='B'||btn==='MENU')onBack&&onBack();return}
  let cur=document.activeElement;if(!items.includes(cur))cur=null;
  if(btn==='A'){if(cur){if(cur.tagName==='INPUT')return;sfx('menu');cur.click()}else items[0].focus();return}
  if(btn==='B'||btn==='MENU'){onBack&&onBack();return}
  if(!cur){items[0].focus();return}
  const r0=cur.getBoundingClientRect(),cx=r0.left+r0.width/2,cy=r0.top+r0.height/2;let best=null,bs=1e9;
  for(const b of items){if(b===cur)continue;const r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,dx=x-cx,dy=y-cy;
    let p,s;if(btn==='up'){if(dy>=-4)continue;p=-dy;s=Math.abs(dx)}else if(btn==='down'){if(dy<=4)continue;p=dy;s=Math.abs(dx)}else if(btn==='left'){if(dx>=-4)continue;p=-dx;s=Math.abs(dy)}else{if(dx<=4)continue;p=dx;s=Math.abs(dy)}
    const sc=p+s*2.2;if(sc<bs){bs=sc;best=b}}
  if(best){best.focus();best.scrollIntoView({block:'nearest'});sfx('tick')}}}
function openScreen(cls,html,onBack){const el=document.createElement('div');el.className='screen '+cls;el.innerHTML=html;document.getElementById('screens').appendChild(el);
  const pop=pushHandler(navHandler(el,()=>{const b=el.querySelector('[data-back]');if(b)b.click();else if(onBack)onBack()}));el._pop=pop;setTimeout(()=>focusFirst(el),30);return el}
function closeScreen(el){if(!el)return;el._pop&&el._pop();el.remove()}
function monCanvas(sp,size,shiny,sil){const c=document.createElement('canvas');const s=creatureCanvas(sp,Math.round(size*G.dpr),false,shiny,sil);c.width=s.width;c.height=s.height;c.style.width=c.style.height=size+'px';c.getContext('2d').drawImage(s,0,0);return c}
function typeChips(types){return types.map(t=>`<span class="tchip" style="--tc:${TYPES[t].c}">${TYPES[t].n}</span>`).join('')}

/* ================= DIALOGUE ================= */
let dlgHideT=null;
let dlgChain=Promise.resolve();
function say(text,opt){const p=dlgChain.then(()=>_say(text,opt||{}));dlgChain=p.catch(()=>{});return p}
function ask(text,choices){const p=dlgChain.then(()=>_ask(text,choices));dlgChain=p.catch(()=>{});return p}
function _say(text,opt={}){return new Promise(res=>{
  const d=$('#dialog');clearTimeout(dlgHideT);d.hidden=false;d.classList.remove('asking');$('#dlgName').textContent=opt.name||'';$('#dlgName').hidden=!opt.name;$('#dlgChoices').innerHTML='';
  const tEl=$('#dlgText');tEl.textContent='';let i=0;const full=String(text);let typing=true;sfx('blip');
  const speed=S&&S.opts.fast?2:1;
  const iv=setInterval(()=>{i+=speed*2;tEl.textContent=full.slice(0,i);if(i>=full.length){clearInterval(iv);typing=false;d.classList.add('ready')}},18);
  d.classList.remove('ready');
  const go=()=>{if(typing){clearInterval(iv);tEl.textContent=full;typing=false;d.classList.add('ready');return}pop();d.onclick=null;sfx('tick');dlgHideT=setTimeout(()=>{d.hidden=true},60);res()};
  const pop=pushHandler(b=>{if(b==='A'||b==='B')go()});d.onclick=go;})}
function _ask(text,choices){return new Promise(res=>{
  const d=$('#dialog');clearTimeout(dlgHideT);d.hidden=false;d.classList.add('asking','ready');$('#dlgName').hidden=true;$('#dlgText').textContent=text;sfx('blip');
  const ch=$('#dlgChoices');ch.innerHTML=choices.map((c,i)=>`<button data-i="${i}">${esc(c)}</button>`).join('');d.onclick=null;
  const pick=i=>{pop();ch.innerHTML='';d.classList.remove('asking');dlgHideT=setTimeout(()=>{d.hidden=true},60);sfx('menu');res(i)};
  ch.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();pick(+b.dataset.i)});
  const nav=navHandler(ch,()=>pick(choices.length-1));const pop=pushHandler(nav);setTimeout(()=>focusFirst(ch),20)})}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
function banner(t){const el=$('#banner');el.textContent=t;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
function fade(on,ms=280){const f=$('#fade');f.style.transitionDuration=ms+'ms';f.classList.toggle('on',on);return wait(ms+20)}
async function flashTransition(){const f=$('#flash');for(let i=0;i<3;i++){f.classList.add('on');await wait(90);f.classList.remove('on');await wait(90)}}

function bagScreen(mode){return new Promise(res=>{
  let cat=mode==='battle'?'soin':(BAG_CATS.find(([c])=>Object.keys(S.bag).some(k=>ITEMS[k].cat===c))||['soin'])[0];
  const el=openScreen('bag',`<div class="panel"><div class="ph"><h2>${T('ui.bag.title')}</h2><button class="x" data-back>${T('ui.back')}</button></div><div class="tabs"></div><div class="item-list"></div></div>`);
  const tabs=el.querySelector('.tabs'),list=el.querySelector('.item-list');
  const done=v=>{closeScreen(el);res(v)};el.querySelector('[data-back]').onclick=()=>done(null);
  const draw=()=>{tabs.innerHTML=BAG_CATS.map(([c])=>`<button class="tab ${c===cat?'on':''}" data-c="${c}">${T('cat.'+c)}</button>`).join('');
    tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cat=b.dataset.c;draw();const t=tabs.querySelector('.on');t&&t.focus()});
    const items=Object.keys(S.bag).filter(k=>ITEMS[k].cat===cat&&S.bag[k]>0);
    list.innerHTML=items.length?items.map(k=>`<button class="item-row" data-k="${k}"><span class="iic" data-it="${k}"></span><span><b>${ITEMS[k].n}</b><small>${ITEMS[k].d}</small></span><span class="qty">× ${S.bag[k]}</span></button>`).join(''):`<p class="empty">${T('ui.bag.empty')}</p>`;
    list.querySelectorAll('.iic').forEach(drawItemIcon);
    list.querySelectorAll('.item-row').forEach(b=>b.onclick=()=>use(b.dataset.k))};
  async function use(k){const I=ITEMS[k];

      await say(T('ui.bag.notNow'));return}
    if(I.ball){await say(T('ui.bag.ballHint'));return}
    if(k==='carte'){await mapScreen();return}
    if(k==='canne'){await say(I.d);return}
    if(I.cat==='tresor'){await say(T('ui.bag.sellHint',{n:Math.floor(I.sell)}));return}
    if(I.repel){S.repel=I.repel;addItem(k,-1);sfx('item');await say(T('ui.bag.repel'));draw();return}
    const t=await teamScreen('item:'+k);if(t==null)return;const m=S.team[t];

    else{const r=applyItem(m,k);sfx('heal');await say(r.msg)}
    draw();}
  draw();})}
function drawItemIcon(span){const k=span.dataset.it;const I=ITEMS[k];const c=document.createElement('canvas');const s=Math.round(34*G.dpr);c.width=c.height=s;c.style.width=c.style.height='34px';const x=c.getContext('2d');
  if(I.ball)drawCapsuleIcon(x,s/2,s/2,s*0.36,k==='etoileCapsule'?'#ffd23a':k==='hyperCapsule'?'#3a3a4a':k==='superCapsule'?'#3a7ae8':'#2ab0c8');
  else{const col=I.cat==='soin'?(I.revive?'#ffd23a':I.cure?'#5ac06a':I.ppAll?'#5a9ae8':k==='baie'?'#ff4a7a':'#b07aff'):I.cat==='boost'?(k==='bonbon'?'#5ad0ff':k==='pierreEveil'?'#ffaa2a':'#ff6a5a'):I.cat==='tresor'?'#ffd23a':I.cat==='outil'?'#8a8a9a':'#c89a6a';
    x.lineWidth=s*0.06;x.strokeStyle='#2a2034';x.fillStyle=col;
    if(I.cat==='soin'&&!I.revive&&k!=='baie'){x.beginPath();x.roundRect(s*0.3,s*0.28,s*0.4,s*0.6,s*0.1);x.fill();x.stroke();x.fillStyle='#fff';x.fillRect(s*0.36,s*0.14,s*0.28,s*0.16);x.strokeRect(s*0.36,s*0.14,s*0.28,s*0.16)}

    else{x.beginPath();x.arc(s/2,s/2,s*0.32,0,7);x.fill();x.stroke();x.fillStyle='rgba(255,255,255,.6)';x.beginPath();x.arc(s*0.4,s*0.4,s*0.09,0,7);x.fill()}}
  span.appendChild(c)}

function dexScreen(){return new Promise(res=>{
  const seen=Object.keys(S.dex.seen).length,caught=Object.keys(S.dex.caught).length;
  const el=openScreen('dex',`<div class="panel wide"><div class="ph"><h2>${T('ui.dex.title')}</h2><span class="pill">${T('ui.dex.count',{seen,caught,total:NSPECIES})}</span><button class="x" data-back>${T('ui.back')}</button></div><div class="dex-grid"></div></div>`);
  const grid=el.querySelector('.dex-grid');
  let html='';for(let i=1;i<=NSPECIES;i++){const s=S.dex.seen[i],c=S.dex.caught[i];html+=`<button class="dex-cell ${s?'seen':''} ${c?'caught':''}" data-i="${i}"><small>${String(i).padStart(3,'0')}</small><span class="spr" ${s?`data-sp="${i}"`:''}>${s?'':'?'}</span><b>${s?SPECIES[i].name:'???'}</b></button>`}
  grid.innerHTML=html;

let MAP_BASE=null;
function buildMapBase(){const c=document.createElement('canvas');c.width=WW;c.height=WH;const x=c.getContext('2d');const img=x.createImageData(WW,WH);
  const hex=h=>{const v=shade(h,0);return [1,3,5].map(i=>parseInt(v.substr(i,2),16))};const cache={};
  for(let i=0;i<WW*WH;i++){const g=WORLD.g[i];let col;if(WORLD.solidX[i])col='#e8604a';else if(g>=100)col=g===T_TOWN?'#d8d2c8':'#8a8a8a';else{const B=BIOMES[g>>3],k=g&7;
      col=k===K_GROUND||k===K_DECO?B.g:k===K_TALL?B.tall:k===K_OBST||k===K_HEDGE?shade(B.leaf||B.g,-0.35):k===K_WATER?B.water:k===K_PATH?B.path:'#b07a48'}
    const rgb=cache[col]||(cache[col]=hex(col));img.data[i*4]=rgb[0];img.data[i*4+1]=rgb[1];img.data[i*4+2]=rgb[2];img.data[i*4+3]=255}
  x.putImageData(img,0,0);MAP_BASE=c}
function mapScreen(){return new Promise(res=>{if(!MAP_BASE)buildMapBase();
  const el=openScreen('mapscr',`<div class="panel wide"><div class="ph"><h2>${T('ui.map.title')}</h2><span class="pill">${T('ui.map.regions',{n:Object.keys(S.visited).length,total:REGIONS.length})}</span><button class="x" data-back>${T('ui.back')}</button></div><div class="map-wrap"><canvas></canvas></div><p class="small">${T('ui.map.hint')}</p></div>`);
  const cv=el.querySelector('canvas');const wrap=el.querySelector('.map-wrap');const W=Math.min(wrap.clientWidth||600,900);const sc=W/WW;const H=WH*sc;
  cv.width=Math.round(W*G.dpr);cv.height=Math.round(H*G.dpr);cv.style.width=W+'px';cv.style.height=H+'px';const x=cv.getContext('2d');
  const fog=document.createElement('canvas');fog.width=WW;fog.height=WH;{const fx=fog.getContext('2d');const im=fx.createImageData(WW,WH);for(let i=0;i<WW*WH;i++){if(!S.visited[REGIONS[WORLD.reg[i]].k]){im.data[i*4]=20;im.data[i*4+1]=14;im.data[i*4+2]=36;im.data[i*4+3]=205}}fx.putImageData(im,0,0)}
  for(const r of REGIONS){if(!S.visited[r.k])continue;const l=document.createElement('span');l.className='map-label';l.textContent=r.n;l.style.left=(r.x/WW*100)+'%';l.style.top=((r.y-6)/WH*100)+'%';wrap.appendChild(l)}
  let alive=true;const draw=()=>{if(!alive)return;const s=sc*G.dpr;x.imageSmoothingEnabled=false;x.drawImage(MAP_BASE,0,0,WW*s,WH*s);
    // brouillard
    x.drawImage(fog,0,0,WW*s,WH*s);
    x.textAlign='center';x.textBaseline='middle';
    for(const r of REGIONS){if(!S.visited[r.k]||!r.town)continue;x.lineWidth=2*G.dpr;x.strokeStyle='#2a2034';x.fillStyle=r.gym!=null&&S.badges[r.gym]?'#ffd23a':'#ffffff';x.beginPath();x.arc(r.x*s,r.y*s,4*G.dpr,0,7);x.fill();x.stroke()}
    if(G.map===WORLD&&Math.floor(performance.now()/400)%2){x.fillStyle='#ff3a4a';x.strokeStyle='#fff';x.lineWidth=2*G.dpr;x.beginPath();x.arc((S.x+0.5)*s,(S.y+0.5)*s,5*G.dpr,0,7);x.fill();x.stroke()}
    requestAnimationFrame(draw)};draw();
  el.querySelector('[data-back]').onclick=()=>{alive=false;closeScreen(el);res()}})}

let touchRun=false;
function setupTouch(){
  const pad=$('#dpad');let active=null;
  const dirFrom=(e)=>{const r=pad.getBoundingClientRect();const x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;if(Math.hypot(x,y)<r.width*0.12)return null;return Math.abs(x)>Math.abs(y)?(x>0?'right':'left'):(y>0?'down':'up')};
  const setDir=d=>{if(d===active)return;if(active)held.delete(active);active=d;pad.dataset.dir=d||'';if(d){held.add(d);G.heldDir=d;G.heldT=0;press(d)}else G.heldDir=[...held].pop()||null};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();pad.setPointerCapture(e.pointerId);setDir(dirFrom(e))});
  pad.addEventListener('pointermove',e=>{if(active!==null||e.buttons)setDir(dirFrom(e))});
  const end=e=>{setDir(null)};pad.addEventListener('pointerup',end);pad.addEventListener('pointercancel',end);
  for(const [id,b] of [['#btnA','A'],['#btnB','B'],['#btnMenu','MENU']]){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();el.classList.add('down');press(b)});
    el.addEventListener('pointerup',()=>el.classList.remove('down'));el.addEventListener('pointerleave',()=>el.classList.remove('down'))}
  const run=$('#btnRun');run.addEventListener('pointerdown',e=>{e.preventDefault();touchRun=!touchRun;run.classList.toggle('on',touchRun)});
  const showTouch=()=>document.body.classList.add('touch');if(matchMedia('(pointer:coarse)').matches)showTouch();window.addEventListener('touchstart',showTouch,{once:true,passive:true});
}

/* ================= TUTORIEL ANIMÉ =================
   3 étapes : marcher, parler (A), herbes hautes et menu (B). Une main animée
   montre le geste ; un toucher (ou Entrée) passe à l'étape suivante. */
function tutoriel(){return new Promise(res=>{let etape=0,t0=performance.now(),fini=false;
  const el=openScreen('tuto',`<div class="panel tuto-panel"><div class="ph"><h2>${T('ui.tuto.title')}</h2><span class="pill tuto-step"></span></div>
    <canvas class="tuto-cv"></canvas><p class="tuto-text"></p><div class="tuto-btns"><button class="tuto-skip" data-back>${T('ui.tuto.skip')}</button><button class="tuto-next"></button></div></div>`);
  const cv=el.querySelector('canvas'),x=cv.getContext('2d');const W=Math.min(520,innerWidth-64),H=Math.round(W*0.5);
  cv.width=Math.round(W*G.dpr);cv.height=Math.round(H*G.dpr);cv.style.width=W+'px';cv.style.height=H+'px';
  const texte=el.querySelector('.tuto-text'),num=el.querySelector('.tuto-step'),suivant=el.querySelector('.tuto-next');
  const montrer=()=>{texte.textContent=T('ui.tuto.'+(etape+1));num.textContent=T('ui.tuto.step',{n:etape+1,total:3});suivant.textContent=T(etape<2?'ui.tuto.next':'ui.tuto.go');t0=performance.now()};
  const fin=()=>{if(fini)return;fini=true;closeScreen(el);res()};
  const avancer=()=>{if(etape<2){etape++;montrer();sfx('tick')}else fin()};
  suivant.onclick=avancer;el.querySelector('.tuto-skip').onclick=fin;cv.onclick=avancer;
  const look=S&&S.gender==='f'?LOOKS.hero_f:LOOKS.hero_m;const ts=Math.round(H/3.2*G.dpr);
  const main=(px,py,appui)=>{x.save();x.translate(px,py);x.scale(G.dpr,G.dpr);x.rotate(-0.35);x.fillStyle='#ffd9b8';x.strokeStyle='#2a2034';x.lineWidth=2.5;
    x.beginPath();x.roundRect(-7,-4-(appui?0:6),14,30,7);x.fill();x.stroke();x.beginPath();x.roundRect(-14,18-(appui?0:6),30,26,10);x.fill();x.stroke();x.restore()};
  const bouton=(bx,by,r,col,actif,forme)=>{x.save();x.fillStyle=actif?shade(col,0.25):col;x.strokeStyle='#2a2034';x.lineWidth=3*G.dpr;x.beginPath();x.arc(bx,by,r,0,7);x.fill();x.stroke();
    x.fillStyle='#fff';if(forme==='a'){x.beginPath();x.arc(bx,by,r*0.32,0,7);x.fill()}else if(forme==='b'){x.fillRect(bx-r*0.4,by-r*0.12,r*0.8,r*0.24)}x.restore()};
  const croix=(cx,cy,r,dir)=>{x.save();x.fillStyle='rgba(42,32,52,.8)';x.beginPath();x.roundRect(cx-r*0.3,cy-r,r*0.6,r*2,8);x.roundRect(cx-r,cy-r*0.3,r*2,r*0.6,8);x.fill();
    x.fillStyle='#ffd23a';if(dir==='r'){x.beginPath();x.moveTo(cx+r*0.9,cy);x.lineTo(cx+r*0.5,cy-r*0.25);x.lineTo(cx+r*0.5,cy+r*0.25);x.fill()}x.restore()};
  const dessiner=now=>{if(fini||!el.isConnected)return;const t=(now-t0)/1000,w=cv.width,h=cv.height;x.clearRect(0,0,w,h);
    const sol=Math.floor(h-ts*1.2);for(let i=0;i*ts<w;i++){x.drawImage(tileCanvas(0,ts,i%3,0),i*ts,sol);x.drawImage(tileCanvas(0,ts,(i+1)%3,0),i*ts,sol-ts)}
    if(etape===0){const p=(t*0.8)%1;const px=w*0.38+p*w*0.45;x.drawImage(personCanvas(look,3,Math.floor(t*6)%4,ts),px,sol-ts*0.95);
      croix(w*0.16,h*0.42,h*0.22,'r');main(w*0.16+h*0.2,h*0.42+6*G.dpr,Math.sin(t*6)>0)}
    else if(etape===1){x.drawImage(personCanvas(look,3,0,ts),w*0.42,sol-ts*0.95);x.drawImage(personCanvas(LOOKS.prof,2,0,ts),w*0.42+ts*1.05,sol-ts*0.95);
      const appui=(t%1.6)<0.4;bouton(w*0.16,h*0.42,h*0.16,'#ff6a5a',appui,'a');main(w*0.16+h*0.08,h*0.42+h*0.06,appui);
      if((t%1.6)>0.4){x.save();x.fillStyle='#fff';x.strokeStyle='#2a2034';x.lineWidth=3*G.dpr;const bx=w*0.42+ts*0.3,by=sol-ts*1.9;x.beginPath();x.roundRect(bx,by,ts*1.6,ts*0.75,ts*0.2);x.fill();x.stroke();
        x.fillStyle='#2a2034';for(let i=0;i<3;i++){x.beginPath();x.arc(bx+ts*(0.45+i*0.35),by+ts*0.37,ts*0.07,0,7);x.fill()}x.restore()}}
    else{const herbe=Math.floor(w*0.55/ts);for(let i=herbe;i*ts<w;i++)x.drawImage(tileCanvas(1,ts,0,0),i*ts,sol);
      const p=Math.min(1,(t%3)/1.6);const px=w*0.3+p*w*0.28;x.drawImage(personCanvas(look,3,p<1?Math.floor(t*6)%4:0,ts),px,sol-ts*0.95);
      if((t%3)>1.7){const s2=Math.min(1,((t%3)-1.7)*3);const c=creatureCanvas(FAMS[4].ids[0],Math.round(ts*1.5*s2)+1);x.drawImage(c,w*0.8-c.width/2,sol-c.height*0.9)}
      bouton(w*0.14,h*0.36,h*0.14,'#4aa6f5',(t%1.2)<0.3,'b')}
    requestAnimationFrame(dessiner)};
  montrer();requestAnimationFrame(dessiner)})}

function audioUnlock(){if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=0.55;MASTER.connect(AC.destination);
    MUS=AC.createGain();MUS.gain.value=0.16;MUS.connect(MASTER);SFXG=AC.createGain();SFXG.gain.value=0.5;SFXG.connect(MASTER);
    const len=AC.sampleRate*0.3;NOISE=AC.createBuffer(1,len,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    if(pendingSong){const s=pendingSong;pendingSong=null;playMusic(s)}}catch(e){AC=null}}
function tone(f,dur,type='square',vol=0.25,when=0,slide=0,dest){if(!AC)return;const t=AC.currentTime+when;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);o.connect(g);g.connect(dest||SFXG);o.start(t);o.stop(t+dur+0.02)}
function noise(dur,vol=0.3,when=0,hp=800,dest){if(!AC)return;const t=AC.currentTime+when;const s=AC.createBufferSource();s.buffer=NOISE;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(dest||SFXG);s.start(t);s.stop(t+dur)}

function playMusic(name){if(!AC){pendingSong=name;return}if(curSong===name&&seqT)return;stopMusic();curSong=name;if(SON.muet||!S||!S.opts.music)return;
  const song=SONGS[name]||SONGS.town;const step=60/song.bpm/2;let i=0,next=AC.currentTime+0.1;
  seqT=setInterval(()=>{if(!AC)return;while(next<AC.currentTime+0.2){const k=i%song.lead.length;const n=song.lead[k];
      if(n>0){let len=1;while(song.lead[(k+len)%song.lead.length]===-1&&len<8)len++;tone(mf(n),step*len*0.95,'square',0.22,next-AC.currentTime,0,MUS)}
      const b=song.bass[i%song.bass.length];if(b>0){let len=1;while(song.bass[(i+len)%song.bass.length]===-1&&len<8)len++;tone(mf(b),step*len*0.9,'triangle',0.5,next-AC.currentTime,0,MUS)}
      if(song.drum&&i%2===0)noise(0.04,i%4===0?0.25:0.12,next-AC.currentTime,i%4===0?200:5000,MUS);
      i++;next+=step}},40)}
function stopMusic(){if(seqT){clearInterval(seqT);seqT=null}}

function migrate(s){if(s.name==='Sacha')s.name=s.gender==='f'?'Lila':'Milo';const d=newState(s.name||'Milo',s.gender||'m');const o=Object.assign(d,s);o.opts=Object.assign(d.opts,s.opts||{});
  let mx=0;for(const m of [...o.team,...o.box]){mx=Math.max(mx,m.uid||0);if(!m.bonus)m.bonus={};if(!m.ot)m.ot=o.name;if(!m.status)m.status=null;if(!m.shiny)m.shiny=false;
    const pv=typeof m.hp==='number'?m.hp:null;m.st=calcStats(m);m.hp=pv==null?m.st.hp:clamp(pv,0,m.st.hp)}UID=Math.max(UID,mx+1);return o}
async function start(hotState){
  let r;
  if(hotState){r={cont:hotState}}else r=await titleScreen();
  if(r.cont){S=migrate(r.cont)}else{S=newState(r.name,r.gender);S.map='A1';S.x=5;S.y=6;S.dir=0}
  G.started=true;
  try{setMap(S.map,S.x,S.y,S.dir)}catch(e){console.error(e);setMap('world',RK.A.x+5,RK.A.y-1,0)}
  $('#hint').classList.add('show');setTimeout(()=>$('#hint').classList.remove('show'),9000);
  if(!r.cont){G.lock++;await wait(500);
    await say(T('m.welcome',{name:S.name}));
    await say(T('m.intro'));
    await say(T('m.mom',{name:S.name}));
    await tutoriel();
    G.lock--;S.visited.A=1;saveGame(true)}
}

  WORLD=genWorld();for(const b of WORLD.blds)WORLD.warps[b.door.x+','+b.door.y]={bld:b.id};
  setupTrades();setupTouch();pushHandler(worldHandler);

  $('#btnSound').classList.toggle('muted',SON.muet);$('#btnSound').addEventListener('click',()=>{audioUnlock();setMuet(!SON.muet)});
