<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};

    var isole = !!(coin || options.isole);

    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;

      element.className = 'jel-langue';

      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }

      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');

    style.textContent = CSS_SELECTEUR;

  }

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {

    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },

    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);

    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];

    tout.date = Date.now();

    try { texte = JSON.stringify(tout); } catch (e) { return false; }

      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }

    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];

  }

  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');

  }

  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }

      b.classList.remove('armer');
      clear(jeu);

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)

    if (!d) { nouvelle(); return false; }

    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');

    detail.textContent = options.sansNiveau

    var bNouvelle = bouton('', texte('nouvelle'));

    h.ombre.appendChild(fond);

      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);

      },
    };

    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    var boutons = [bContinuer, bNouvelle, bEffacer];

      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;

      var i = boutons.indexOf(actif);

    });

    try { bContinuer.focus(); } catch (e) { /* rien */ }

  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {

  //                 après chacune ; le chef peut lancer, sinon lancement seul dans reste ms) ;
  //                 { type: 'manche' } (nouvelle manche, etat de départ) ;
  //                 { type: 'action', siege, action, avant, apres, auto, moi } ;
  //                 { type: 'fin', resultat } (fin(etat) des règles) ;
  //                 { type: 'sieges' } (un vrai joueur arrive ou part, ou le chef change) ; { type: 'refus' }
  //   enLigne       false : directement contre des robots sur l'appareil (sinon : en ligne
  //                 si le lanceur du site le permet, robots locaux à défaut)

  // Lecture : partie.mode, partie.etat, partie.siege (place du joueur, -1 en attente),
  // partie.phase ('attente', 'salon', 'jeu', 'pause'), partie.sieges() ([{ humain, moi, chef, nom }] ;
  // nom : pseudo d'un vrai joueur en ligne, ou null — robot, ou joueur sans profil : libellé du jeu),
  // partie.chef (place du chef), partie.estChef(), partie.monTour(). Commandes : lancer(),

  // (solo), quitter(). La dernière partie lancée est aussi dans JEL_MULTI.derniere.

  function dansLanceur() {

  }

  // Invitation du bouton « Rejoindre » (window.JEL_REJOINDRE = { partie }, posé par le
  // lanceur) : { partie } ou null. Elle ne sert qu'une fois (première partie en ligne).

  function Partie(o) {

    this.r = completer(this.o.regles);
    this.mode = 'arret';
    this.etat = null;
    this.n = 0;
    this.manche = 0;
    this.phase = 'attente';
    this.siege = -1;
    this.humains = [];
    this.noms = [];            // pseudo des vrais joueurs par place (en ligne), ou null
    this.chef = -1;            // place du chef du salon (en ligne)
    this.options = null;
    this.file = [];            // messages reçus, joués un par un
    this.libreA = 0;           // heure à partir de laquelle le message suivant peut être joué
    this.rattrapage = false;   // coups accumulés pendant une pause en ligne : rejoués vite
    this.minuteur = 0;
    this.enPause = false;
    this.debutPause = 0;
    this.attendEcho = false;   // action envoyée, pas encore revenue
    this.versSolo = false;     // connexion coupée : bascule en solo une fois la file vidée
    this.local = null;         // arbitre local (solo)

  Partie.prototype.signaler = function (e) {

  Partie.prototype.changerMode = function (mode, raison) {

  Partie.prototype.lancer = function () {

      this.changerMode('connexion');
      racine.addEventListener('message', this.ecoute);
      var demande = { type: 'jel-multi', op: 'rejoindre', proto: PROTOCOLE };
      var inv = invitation();
      if (inv) { demande.partie = inv.partie; invitationUtilisee = true; }   // partie d'un ami (« Rejoindre »)
      try { racine.parent.postMessage(demande, '*'); } catch (e) { /* pas de lanceur */ }

      this.minuteurConnexion = setTimeout(function () { moi.passerSolo('delai'); }, DELAI_CONNEXION);

  // Arrête tout (connexion, robots locaux, file) sans rien annoncer.
  Partie.prototype.arreter = function () {

    clearTimeout(this.minuteurReveil);
    clearTimeout(this.minuteurConnexion);
    racine.removeEventListener('message', this.ecoute);

    var a = this.creerArbitreLocal();
    var sieges = [];
    for (var s = 0; s < this.r.places; s++) sieges.push(s === this.siege ? 'moi' : null);

      phase: this.phase, finManche: Date.now() + this.r.pauseManche, echeance: null, options: this.options,

  Partie.prototype.programmerReveil = function () {

    var t = this.local.prochainReveil();
    if (t === null || !isFinite(t)) return;
    var moi = this;
    this.minuteurReveil = setTimeout(function () {
      if (!moi.local || moi.enPause) return;
      moi.local.reveil();
      moi.programmerReveil();

  };

  // Joue les messages reçus un par un : les coups des autres sont espacés de
  // delaiBot, pour qu'on les voie.
  Partie.prototype.pomper = function () {

    clearTimeout(this.minuteur);
    while (this.file.length) {
      var attente = this.libreA - Date.now();
      if (attente > 0) {

        return;
      }

      this.libreA = Date.now() + (this.rattrapage ? Math.min(delai, DELAI_RATTRAPAGE) : delai);
    }

  Partie.prototype.traiter = function (m) {
    var r = this.r;

      case 'bienvenue':
        this.siege = m.siege;
        this.humains = m.sieges || [];
        this.chef = typeof m.chef === 'number' ? m.chef : -1;
        this.n = m.n;
        this.manche = m.manche;
        this.options = m.o || null;
        this.etat = m.etat;
        this.phase = m.phase;
        this.attendEcho = false;
        this.signaler({ type: 'debut', reste: m.reste || 0 });
        return 0;
      case 'manche':
        this.etat = r.depart(hasard(m.g), r.places, copie(m.o));
        this.n = m.n;
        this.manche = m.manche;
        this.options = m.o || null;

        this.attendEcho = false;

        if (moi) this.attendEcho = false;
        this.signaler({ type: 'action', siege: m.s, action: m.a, avant: avant, apres: apres, auto: !!m.auto, moi: moi });
        var resultat = r.fin(apres);

          this.phase = 'pause';
          this.signaler({ type: 'fin', resultat: resultat });
        }

      }
      case 'sieges':
        this.humains = m.sieges || [];
        if (typeof m.chef === 'number') this.chef = m.chef;
        this.signaler({ type: 'sieges' });
        return 0;
      case 'salon':
        this.phase = 'salon';
        if (typeof m.chef === 'number') this.chef = m.chef;
        this.attendEcho = false;
        this.signaler({ type: 'salon', reste: m.reste || 0 });
        return 0;
      case 'place':
        this.siege = m.siege;
        this.signaler({ type: 'sieges' });
        return 0;
      case 'noms':
        this.noms = [];
        for (var k = 0; k < r.places; k++) {
          var x = Array.isArray(m.noms) ? m.noms[k] : null;
          this.noms.push(typeof x === 'string' && x ? x.slice(0, NOM_MAX) : null);
        }

        return 0;
      case 'refus':
        this.attendEcho = false;
        this.signaler({ type: 'refus' });
        return 0;
      default:
        return 0;
    }
  };

  // Messages perdus ou incohérents : en ligne, on redemande l'état au serveur.
  Partie.prototype.resynchroniser = function () {
    this.file = [];
    if (this.mode === 'en-ligne') {

    }
  };

  Partie.prototype.sieges = function () {
    var liste = [];

      var humain = this.humains[s] === true;
      var nom = this.mode === 'en-ligne' && humain && typeof this.noms[s] === 'string' ? this.noms[s] : null;
      liste.push({ humain: humain, moi: s === this.siege, chef: this.mode === 'en-ligne' && s === this.chef, nom: nom });
    }

  };

  // Pseudo du vrai joueur de la place s (en ligne), ou null.
  Partie.prototype.nom = function (s) {
    var info = this.sieges()[s];

  };

  // Le joueur de l'appareil peut-il lancer la manche ? (en ligne, dans le salon, s'il est le chef)
  Partie.prototype.estChef = function () {
    return this.mode === 'en-ligne' && this.phase === 'salon' && this.siege >= 0 && this.siege === this.chef;
  };

  // Le chef lance la manche depuis le salon. Renvoie true si la demande part.
  Partie.prototype.lancerManche = function () {
    if (!this.estChef() || this.file.length) return false;
    try { racine.parent.postMessage({ type: 'jel-multi', op: 'envoyer', m: { t: 'lancer' } }, '*'); } catch (e) { return false; }
    return true;
  };

  Partie.prototype.monTour = function () {
    if (this.phase !== 'jeu' || !this.etat || this.siege < 0 || this.attendEcho || this.file.length) return false;
    if (this.mode !== 'solo' && this.mode !== 'en-ligne') return false;
    try { return this.r.aQui(this.etat) === this.siege; } catch (e) { return false; }
  };

  // Action du joueur de l'appareil. Renvoie true si elle part (elle sera jouée
  // à son retour, comme celles des autres).
  Partie.prototype.jouer = function (action) {
    if (!this.monTour()) return false;
    try { if (this.r.valide(copie(this.etat), this.siege, copie(action)) !== true) return false; } catch (e) { return false; }
    this.attendEcho = true;
    var m = { t: 'action', n: this.n, a: copie(action) };
    if (this.mode === 'solo') {
      this.local.recevoir('moi', m);
      this.programmerReveil();
    } else {
      try { racine.parent.postMessage({ type: 'jel-multi', op: 'envoyer', m: m }, '*'); } catch (e) { this.attendEcho = false; return false; }
    }
    return true;
  };

  // Pause (menu, écran caché) : la file et les robots locaux s'arrêtent. En
  // ligne, la partie continue sur le serveur : les coups attendent la reprise.
  Partie.prototype.pause = function (oui) {
    if (oui === this.enPause) return;
    this.enPause = oui;
    if (oui) {
      this.debutPause = Date.now();
      clearTimeout(this.minuteur);
      clearTimeout(this.minuteurReveil);

      if (this.local.finManche) this.local.finManche += duree;
      if (this.local.echeance) this.local.echeance.quand += duree;
    }
    if (this.mode === 'en-ligne') { this.libreA = 0; this.rattrapage = true; }   // rattraper vite les coups joués pendant la pause
    this.pomper();
    this.programmerReveil();
  };

  // Solo : nouvelle manche tout de suite (niveau suivant, rejouer…).
  Partie.prototype.recommencer = function (options) {
    if (this.mode !== 'solo' || !this.local) return false;
    if (options) { this.o.options = options; this.local.reglages.options = options; }
    this.file = [];
    this.libreA = 0;
    this.local.nouvelleManche();
    this.programmerReveil();
    return true;
  };

  racine.JEL_MULTI = {
    PROTOCOLE: PROTOCOLE,
    hasard: hasard,
    copie: copie,
    completer: completer,
    problemesRegles: problemesRegles,

  ];

  function preparer(L, miroir, places) {
    var H = L.g.length, W = L.g[0].length, t = '', p = [], pos = [], x, y, s;
    for (y = 0; y < H; y++) {
      var ligne = L.g[y];
      if (miroir) ligne = ligne.split('').reverse().join('');
      for (x = 0; x < W; x++) {
        var ch = ligne.charAt(x) || '.', c = y * W + x;

          ch = '.';
        }
        t += ch;
      }

    var an = [];
    (L.a || []).forEach(function (d) {
      var xx = miroir ? W - 1 - d[1] : d[1];
      var dx = d[3] || 0;
      an.push({ e: CODE[d[0]], c: d[2] * W + xx, dx: miroir && dx ? -dx : dx, dy: d[4] || 0, v: d[5] || 1, pr: -1 });
    });
    var e = { W: W, H: H, t: t, p: p, pos: [], jum: [], sc: [], rar: [], ph: [], an: an, tour: 0, prem: 0, tt: L.tours, tours: L.tours, n: 0, nuit: L.nuit ? 1 : 0, der: null };
    for (s = 0; s < places; s++) {
      var c0 = pos[s];
      if (c0 === undefined) { // départ manquant : première case libre
        for (c0 = 0; c0 < W * H; c0++) if (t.charAt(c0) === '.' && pos.indexOf(c0) < 0 && !an.some(function (b) { return b.c === c0; })) break;
        pos[s] = c0; p[c0] = s;

    }

  }

  function colonne(e, c) { return c % e.W; }
  function ligneDe(e, c) { return Math.floor(c / e.W); }
  function cheb(e, a, b) { return Math.max(Math.abs(colonne(e, a) - colonne(e, b)), Math.abs(ligneDe(e, a) - ligneDe(e, b))); }

  function voisins(e, c) {

    if (y < e.H - 1) l.push(c + e.W);

  // Cases où la jeep de la place s peut aller : voisines libres (une tuile y
  // est posée), ou jusqu'à 3 cases le long des pistes si elle est sur une piste.
  function atteignables(e, s) {
    var de = e.pos[s], vu = {}, res = [];
    voisins(e, de).forEach(function (c) { if (libre(e, c) && !vu[c]) { vu[c] = 1; res.push(c); } });
    if (e.p[de] >= 0) {
      var file = [[de, 0]], deja = {};
      deja[de] = 1;
      while (file.length) {
        var q = file.shift();
        if (q[1] >= 3) continue;
        voisins(e, q[0]).forEach(function (c) {
          if (deja[c] || e.p[c] < 0 || !libre(e, c)) return;
          deja[c] = 1;
          if (!vu[c]) { vu[c] = 1; res.push(c); }
          file.push([c, q[1] + 1]);
        });
      }
    }
    res.sort(function (a, b) { return a - b; });
    return res;
  }

  // Portée de la photo : 1 case, +1 avec les jumelles, +1 sur une colline le jour.
  function portee(e, s) {
    var r = 1 + (e.jum[s] ? 1 : 0);
    if (!e.nuit && e.t.charAt(e.pos[s]) === '^') r++;
    return r;
  }

  function animalPeut(e, c) {
    var ch = e.t.charAt(c);
    return (ch === '.' || ch === '=' || ch === '^') && jeepEn(e, c) < 0 && animalEn(e, c) < 0;
  }

  // Un animal timide s'enfuit de 2 cases au plus, le plus loin possible de la jeep.
  function fuir(e, i, de) {
    var b = e.an[i], W = e.W, x = colonne(e, b.c), y = ligneDe(e, b.c);
    var best = b.c, bd = cheb(e, b.c, de), bm = -1;
    for (var yy = y - 2; yy <= y + 2; yy++) {
      for (var xx = x - 2; xx <= x + 2; xx++) {
        if (xx < 0 || yy < 0 || xx >= W || yy >= e.H) continue;
        var c = yy * W + xx;
        if (c === b.c || !animalPeut(e, c)) continue;
        var d = cheb(e, c, de), m = Math.abs(xx - colonne(e, de)) + Math.abs(yy - ligneDe(e, de));

  function forceNiveau(n) {

    return Math.round((0.15 + 0.7 * k) * 100) / 100;

  function potentiel(e, s) {
    var r = portee(e, s), total = 0;
    for (var i = 0; i < e.an.length; i++) {

      var d = cheb(e, b.c, e.pos[s]) - r;

    delaiBot: 650,
    delaiJoueur: 20000,
    pauseManche: 8000,
    remplacement: 'tour',
    forceEnLigne: 0.55,

      e.mir = mir ? 1 : 0;
      if (solo) e.fr = forceNiveau(idx + 1);

    bot: function (e, place, alea, force) {

  .salon-place .tag { font-size: .72rem; font-weight: 800; display: inline-flex; gap: 3px; align-items: center; padding: 1px 6px; border-radius: 8px; background: #0000000f; min-height: 20px; max-width: 100%; overflow: hidden; }
  .salon-place .tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .salon-place .tag svg { width: 14px; height: 14px; flex: none; }

  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition-duration: .01s !important; } }

<script>
(function () {
  'use strict';

  // =====================================================================
  //  L'expédition photo de la savane — aventure et stratégie à 4 jeeps
  //  À son tour, on avance sa jeep d'une case (une tuile de piste est posée)
  //  ou on roule sur les pistes ; la jeep photographie l'animal le plus rare
  //  qu'elle voit. Solo : 20 niveaux contre 3 robots. En ligne : de vrais
  //  joueurs remplacent les robots (moteur commun JEL_MULTI).
  //  Les règles (et les terrains) sont dans le bloc jel-regles.
  // =====================================================================

  const JEU = 'l-expedition-photo-de-la-savane';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = R.niveaux;                // mêmes données que les règles
  window.JEL_NIVEAUX = NIVEAUX.length;
  const ESP = R.especes;
  const PLACES = R.places;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);

  // Une couleur de jeep par place : 0 rouge, 1 bleue, 2 violette, 3 verte.
  const COUL = ['#e2452f', '#2f73e0', '#9548d6', '#1c9a56'];
  const COUL_F = ['#8f2414', '#163f8f', '#552083', '#0d5730'];
  // Peintures de jeep à débloquer (étoiles nécessaires).
  const PEINTURES = [0, 6, 12, 20, 28, 36, 46, 56];
  // Paysages : un tous les 5 niveaux.
  const PAYS = [
    { herbe: '#e8c96a', herbe2: '#dfbf5e', touffe: '#b38d34', fond: '#e9c97a' },   // plaine
    { herbe: '#a9cf72', herbe2: '#9fc668', touffe: '#5f9638', fond: '#b9d68a' },   // marais
    { herbe: '#cdb86c', herbe2: '#c3ae61', touffe: '#8e7a35', fond: '#d6c482' },   // collines
    { herbe: '#86b75e', herbe2: '#7daf56', touffe: '#3f7a2c', fond: '#98c272' }    // forêt
  ];

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#fff"/><circle cx="10.4" cy="8" r="1.6" fill="#fff"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#fff"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';

  // Tutoriels : mini-savane de 5 × 3 cases, jeep à gauche en haut ; « pas » :
  // cases touchées une à une par la main (x, y) ; pistes déjà posées ; jum : la
  // jeep a déjà ses jumelles ; tr : les troupeaux avancent après chaque pas.
  const TUTOS = {
    base: { g: ['0....', '.....', '.....'], a: [['zebre', 3, 0], ['gazelle', 4, 2]], pas: [[1, 0], [2, 0]] },
    piste: { g: ['0....', '.....', '.....'], pistes: [[1, 0], [2, 0], [3, 0]], a: [['girafe', 4, 1]], pas: [[3, 0]] },
    valeur: { g: ['0....', '.....', '.....'], a: [['zebre', 1, 1], ['elephant', 2, 1], ['gnou', 4, 2]], pas: [[1, 0]] },
    rare: { g: ['0....', '.....', '.....'], a: [['gazelle', 1, 1], ['lion', 2, 1], ['zebre', 4, 0]], pas: [[1, 0]] },
    troupeau: { g: ['0....', '.....', '.....'], a: [['zebre', 4, 1, -1, 0, 1]], pas: [[1, 0], [2, 0]], tr: true },
    jumelles: { g: ['0j...', '.....', '.....'], a: [['rhino', 3, 2]], pas: [[1, 0]] },

  // ---------------------------------------------------------------------
  //  Le plateau (jeu, tutoriels)
  // ---------------------------------------------------------------------

  let voile = null;   // canvas hors écran pour la nuit

  function paysDe(e) { return PAYS[Math.min(3, Math.floor((e.n || 0) / 5))]; }

  function centre(g, e, i) { return [g.ox + (i % e.W + 0.5) * g.s, g.oy + (Math.floor(i / e.W) + 0.5) * g.s]; }

  // Position affichée (avec animation) d'une jeep ou d'un animal.
  function posAnimee(g, e, i, an, t) {
    if (an && t < an.t0 + an.d) {
      const k = Math.max(0, (t - an.t0) / an.d), q = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const a = centre(g, e, an.de), b = centre(g, e, an.a);

    }
    const p = centre(g, e, i);
    return [p[0], p[1], false];
  }

  // opt : t, anims ({ jeeps: {s: anim}, animaux: {i: anim}, flash: {i: t0} }), moi,
  // peinture, cibles (cases possibles), survol, curseur, apercu ({ animal, r, case }),
  // sens (sens de chaque jeep : true = vers la gauche)
  function dessinerPlateau(c, e, g, opt) {
    const s = g.s, t = opt.t || 0, W = e.W, H = e.H, pay = paysDe(e);
    const anims = opt.anims || { jeeps: {}, animaux: {}, flash: {} };

    for (let i = 0; i < W * H; i++) herbe(c, g.ox + (i % W) * s, g.oy + Math.floor(i / W) * s, s, i, pay);
    for (let i = 0; i < W * H; i++) {
      const ch = e.t.charAt(i), r = Math.floor(i / W), col = i % W, x = g.ox + col * s, y = g.oy + r * s;
      if (ch === '~' || ch === '=') eau(c, e, x, y, s, r, col, t);

      const x = g.ox + (i % W) * s, y = g.oy + Math.floor(i / W) * s;

      c.strokeStyle = 'rgba(255,255,255,' + (a + 0.3).toFixed(2) + ')'; c.lineWidth = Math.max(2, s * 0.05);

    });

      const x = g.ox + cx * s, y = g.oy + cy * s;

    }

  function geometrie(e, w, h, marge) {
    const s = Math.min((w - 2 * marge) / e.W, (h - 2 * marge) / e.H, 96);
    return { s: s, ox: (w - s * e.W) / 2, oy: (h - s * e.H) / 2 };
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#3b2710'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();

  // ---------------------------------------------------------------------
  //  Écran titre : la savane au soleil couchant (sert aussi de jaquette)
  // ---------------------------------------------------------------------

  function dessinerTitre() {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const large = w > h * 1.05;
    const sw = Math.min(w, h * 0.85), ox = (w - sw) / 2, u = Math.min(sw, h * 0.75) / 10 * (large ? 0.62 : 1), hz = h * (large ? 0.36 : 0.44);
    const yj = large ? 2.5 : 2.9;   // hauteur de la jeep sous l'horizon (au-dessus des boutons)
    let g = c.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, '#ff9a4a'); g.addColorStop(0.55, '#ffc76b'); g.addColorStop(1, '#ffe7a6');

    c.fillStyle = '#ffe28a'; rond(c, sx, sy, sr); c.fill();
    // oiseaux
    c.strokeStyle = '#7a3b16'; c.lineWidth = 2;
    [[0.2, 0.18], [0.27, 0.15], [0.33, 0.2]].forEach((p) => { const x = ox + sw * p[0], y = h * p[1]; c.beginPath(); c.moveTo(x - 7, y); c.quadraticCurveTo(x - 3, y - 4, x, y); c.quadraticCurveTo(x + 3, y - 4, x + 7, y); c.stroke(); });

    c.fillStyle = '#d99a52';
    c.beginPath(); c.moveTo(0, hz); c.bezierCurveTo(w * 0.2, hz - u * 0.9, w * 0.4, hz - u * 0.2, w * 0.6, hz - u * 0.6); c.bezierCurveTo(w * 0.8, hz - u, w * 0.9, hz - u * 0.3, w, hz - u * 0.5); c.lineTo(w, hz + u); c.lineTo(0, hz + u); c.fill();

    acacia(c, ox + sw * 0.12, hz + u * 0.1, u * 2.2, true);
    acacia(c, ox + sw * 0.86, hz + u * 0.15, u * 1.6, true);
    g = c.createLinearGradient(0, hz, 0, h);
    g.addColorStop(0, '#e9c160'); g.addColorStop(1, '#c99a3e');
    c.fillStyle = g; c.fillRect(0, hz + u * 0.2, w, h);

    const al = graineHasard(11);

    }
    // les animaux de la savane
    const K = (k) => ESP.findIndex((x) => x.c === k);
    dessinerAnimal(c, K('girafe'), ox + sw * 0.78, hz + u * 0.9, u * 3.4, 0, true);
    dessinerAnimal(c, K('elephant'), ox + sw * 0.25, hz + u * 1.1, u * 3.0, 0, false);
    dessinerAnimal(c, K('zebre'), ox + sw * 0.52, hz + u * 1.5, u * 2.0, 0, true);
    dessinerAnimal(c, K('zebre'), ox + sw * 0.62, hz + u * 1.8, u * 1.7, 0, true);
    dessinerAnimal(c, K('lion'), ox + sw * 0.12, hz + u * 2.4, u * 2.0, 0, false);
    dessinerAnimal(c, K('gazelle'), ox + sw * 0.9, hz + u * 2.3, u * 1.6, 0, true);
    // la jeep des explorateurs, au premier plan
    dessinerJeep(c, ox + sw * 0.44, hz + u * yj, u * 3.4, 0, prog.peinture, false, 0, true);
    acacia(c, ox + sw * 0.96, hz + u * (yj + 0.7), u * 3.0, false);
  }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (parcours de 20 niveaux) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // partie solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)
  let geo = null;
  let survol = -1, curseur = -1, clavier = false;
  let dernierAttends = 0;
  let anims = { jeeps: {}, animaux: {}, flash: {} };
  let sens = [false, false, true, true];
  let nouveauxAlbum = [];     // espèces ajoutées à l'album pendant la manche
  let apercuCache = { cle: '', val: null };
  const particules = [];

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'album', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom !== 'jeu') dessinerTitre();
    if (nom === 'titre') majTitre();
    if (nom === 'jeu') relancerBoucle();
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    // Au-dessus d'une fenêtre (salon, fin) : en haut de l'écran, pour ne cacher aucun bouton.
    const fenetre = salonOuvert() || $('voile-fin').classList.contains('actif');
    el.classList.toggle('haut', fenetre);
    // En partie : juste en haut du plateau (les jeeps des joueurs partent du bas).
    if (!fenetre && ecran === 'jeu') { el.style.top = Math.round($('zone').getBoundingClientRect().top + 6) + 'px'; el.style.bottom = 'auto'; }
    else { el.style.top = ''; el.style.bottom = ''; }
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  function couronne(c, x, y, k) {
    c.save(); c.translate(x, y); c.scale(k / 22, k / 22);
    c.fillStyle = '#ffc21a'; c.strokeStyle = '#7a4f00'; c.lineWidth = 2.5; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-20, 0); c.lineTo(-23, -22); c.lineTo(-10, -10); c.lineTo(0, -26); c.lineTo(10, -10); c.lineTo(23, -22); c.lineTo(20, 0); c.closePath();
    c.fill(); c.stroke();
    c.fillStyle = '#e23b2e'; rond(c, 0, -10, 3.5); c.fill();
    c.restore();
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  function moi() { return partie ? partie.siege : -1; }
  function peintureDe(s) { return s === moi() ? prog.peinture : 0; }

  // Cartes des 4 places, en haut de l'écran.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'jeep'; cv.width = 104; cv.height = 72;
      const pts = document.createElement('span'); pts.className = 'pts';
      const tag = document.createElement('span'); tag.className = 'tag';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 26, 36, 24);
      d.append(cv, pts, tag, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 128; cv.height = 112;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  function peindreCarte(cv, s, jum) {
    const cle = s + '|' + peintureDe(s) + '|' + (jum ? 1 : 0);
    if (cv.dataset.cle === cle) return;
    cv.dataset.cle = cle;
    const c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    dessinerJeep(c, cv.width / 2 + 4, cv.height * 0.92, cv.width * 0.78, s, peintureDe(s), false, 0, false);
    if (jum) dessinerJumelles(c, cv.width * 0.14, cv.height * 0.3, cv.width * 0.26, 0);
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const pts = e ? e.sc[s] : 0;
      peindreCarte(d.querySelector('canvas.jeep'), s, e && e.jum[s]);
      const txt = nb(pts);
      if (d.querySelector('.pts').textContent !== txt) d.querySelector('.pts').textContent = txt;
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria.' + role, { jeep: tr('jeep.' + s), points: pts }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function ciblesMoi() {
    if (!vue || !partie || !partie.monTour() || enPause || attenteTuto) return [];
    return O.atteignables(vue, moi());
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    const s = R.aQui(e);
    if (moi() < 0) return tr('multi.attente');
    if (s === moi()) return O.atteignables(e, s).length ? tr('tour.toi') : tr('tour.coince');
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.' + s);
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if (vue && partie && partie.phase === 'jeu') {
      if (vue.nuit) info += ' · ' + tr('jeu.nuit');
      info += ' · ' + tr('jeu.tours', { n: Math.max(0, vue.tt) });
    }
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  function majInterface() {
    majPlaces();
    majInfos();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === moi() && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    majInfos();
    rafId = requestAnimationFrame(boucle);
  }

  // Ce que donnerait la case visée : animal photographié et portée.
  function apercu(caseVisee) {
    if (!vue || caseVisee < 0) return null;
    const m = moi();
    const cle = caseVisee + '|' + m + '|' + JSON.stringify(vue.pos) + '|' + vue.tt + '|' + vue.tour;
    if (apercuCache.cle === cle) return apercuCache.val;
    const copie = O.deplacer(JSON.parse(JSON.stringify(vue)), m, caseVisee);
    const val = { case: caseVisee, animal: copie.der.ph, r: O.portee(copie, m) };
    apercuCache = { cle: cle, val: val };
    return val;
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    zone.style.background = paysDe(vue).fond;
    geo = geometrie(vue, w, h, Math.max(8, Math.min(w, h) * 0.025));
    const cibles = ciblesMoi();
    let vise = -1;
    if (clavier && cibles.indexOf(curseur) >= 0) vise = curseur;
    else if (cibles.indexOf(survol) >= 0) vise = survol;
    dessinerPlateau(c, vue, geo, {
      t: t, anims: anims, moi: moi(), peinture: prog.peinture, cibles: cibles, sens: sens,
      apercu: vise >= 0 ? apercu(vise) : null, curseur: clavier && partie && partie.monTour() ? curseur : -1
    });
    // particules (étoiles)
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      if (p.retard > 0) { p.retard -= dt; continue; }
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      etincelle(c, p.x, p.y, p.k);
      c.globalAlpha = 1;
    }
  }

  function jaillir(i, qui, retard, rare) {
    if (!vue || !geo) return;
    const p = centre(geo, vue, i);
    const n = rare ? 26 : 14;
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 180;
      particules.push({ x: p[0], y: p[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v - 160, vie: 0.7 + Math.random() * 0.4, k: geo.s * (0.07 + Math.random() * 0.07), coul: k % 2 ? COUL[qui] : '#ffe066', retard: retard || 0 });
    }
  }

  function flash() {
    const f = $('flash');
    f.classList.add('actif');
    setTimeout(() => f.classList.remove('actif'), 60);
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function nouvelleVue(etat) {
    vue = etat ? JSON.parse(JSON.stringify(etat)) : null;
    anims = { jeeps: {}, animaux: {}, flash: {} };
    sens = [false, false, true, true];
    if (vue) vue.pos.forEach((p, k) => { sens[k] = (p % vue.W) >= vue.W / 2; });
    particules.length = 0;
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    nouvelleVue(partie.etat);
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (moi() < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + peintureDe(s);
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 128, 112);
        dessinerJeep(c, 66, 100, 104, s, peintureDe(s), false, 0, false);
        if (info.chef) couronne(c, 64, 32, 24);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { jeep: tr('jeep.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (moi() < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { jeep: nomChef ? nomChef + ' · ' + tr('jeep.' + partie.chef) : tr('jeep.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    nouvelleVue(partie.etat);
    debutTour = Date.now();
    dernierTic = -1;
    curseur = vue ? vue.pos[Math.max(0, moi())] : -1;
    nouveauxAlbum = [];
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (moi() >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  // Ajoute une espèce à l'album (photo prise par le joueur de l'appareil).
  function ajouterAlbum(k) {
    if (prog.album.indexOf(k) >= 0) return false;
    prog.album.push(k);
    if (nouveauxAlbum.indexOf(k) < 0) nouveauxAlbum.push(k);
    return true;
  }

  function surAction(ev) {
    const t = performance.now(), j = jeton;
    const av = ev.avant, ap = ev.apres, s = ev.siege, d = ap.der || {};
    vue = JSON.parse(JSON.stringify(ap));
    apercuCache = { cle: '', val: null };
    debutTour = Date.now();
    dernierTic = -1;
    if (av.pos[s] !== ap.pos[s]) {
      anims.jeeps[s] = { de: av.pos[s], a: ap.pos[s], t0: t, d: 380 };
      const x1 = av.pos[s] % ap.W, x2 = ap.pos[s] % ap.W;
      if (x2 !== x1) sens[s] = x2 < x1;
      sons.moteur();
    }
    (d.fu || []).forEach((f) => {
      anims.animaux[f[0]] = { de: f[1], a: f[2], t0: t + 260, d: 420 };
      setTimeout(() => { if (j === jeton) sons.fuite(); }, 260);
      if (ev.moi) toast(tr('fuite', { animal: tr('esp.' + ESP[ap.an[f[0]].e].c) }), 2200);
    });
    if (d.jm) {
      setTimeout(() => { if (j === jeton) sons.jumelles(); }, 300);
      if (ev.moi) toast(tr('jumelles.prises'), 2600);
    }
    if (d.ph >= 0) {
      const b = ap.an[d.ph], v = ESP[b.e].v;
      anims.flash[d.ph] = t + 420;
      setTimeout(() => {
        if (j !== jeton) return;
        sons.photo();
        if (v >= 3) sons.rare();
        if (ev.moi) flash();
        const carte = $('place-' + s);
        carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
      }, 420);
      jaillir(b.c, s, 0.42, v >= 3);
      if (ev.moi) {
        const neuf = ajouterAlbum(b.e);
        toast(tr(neuf ? 'photo.nouvelle' : 'photo.toi', { animal: tr('esp.' + ESP[b.e].c), n: v }), 2400);
      }
    }
    if (d.tr && d.tr.length) {
      d.tr.forEach((m) => { anims.animaux[m[0]] = { de: m[1], a: m[2], t0: t + 450, d: 420 }; });
      setTimeout(() => { if (j === jeton) sons.troupeau(); }, 450);
    }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && R.aQui(vue) === moi() && !ev.moi && vue.tt > 0) sons.tour();
    if (clavier && vue && moi() >= 0 && R.aQui(vue) === moi()) curseur = vue.pos[moi()];
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (moi() >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1000);
  }

  // Fin d'une manche en ligne : le classement, puis le salon (même fenêtre).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const m = moi();
    const gagne = m >= 0 && R.fin(e) && R.fin(e).classement[0] === m;
    if (m >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    if (nouveauxAlbum.length) sauverPetit();
    remplirClassement(e, m, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function raresDuNiveau(e) { return e.an.filter((b) => ESP[b.e].v >= 3).length; }
  function totalPoints(e) { return e.an.reduce((a, b) => a + ESP[b.e].v, 0); }

  // Étoiles : 1 pour la victoire, +1 pour une photo rare, +1 pour deux photos
  // rares (niveaux 1 et 2, sans animal rare : 35 % puis 50 % des points).
  function etoilesPour(e, m, gagne) {
    if (!gagne || m < 0) return 0;
    const nR = raresDuNiveau(e), mes = e.rar[m];
    if (!nR) { const p = e.sc[m] / Math.max(1, totalPoints(e)); return 1 + (p >= 0.35 ? 1 : 0) + (p >= 0.5 ? 1 : 0); }
    return 1 + (mes >= 1 ? 1 : 0) + (mes >= Math.min(2, nR) ? 1 : 0);
  }

  function remplirClassement(e, m, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      const cleRang = e.sc[s] + '|' + e.rar[s];
      if (cleRang !== prec) { rang = k + 1; prec = cleRang; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === m ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 88; cv.height = 60;
      dessinerJeep(cv.getContext('2d'), 46, 54, 72, s, peintureDe(s), false, 0, false);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === m ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = role === 'joueur' && info.nom ? info.nom : tr('jeep.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.pointsCourt', { n: e.sc[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  const peinturesOuvertes = (n) => PEINTURES.filter((x) => x <= n).length;

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const m = moi(), sieges = siegesActuels();
    const pts = m >= 0 ? e.sc[m] : 0;
    const res = R.fin(e);
    const gagne = m >= 0 && res && res.classement[0] === m;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, m, sieges, $('fin-classement'));
    $('fin-points').textContent = m >= 0 ? tr('fin.points', { n: pts }) : '';
    const nR = raresDuNiveau(e);
    $('fin-rares').textContent = m >= 0 && nR ? tr('fin.rares', { n: e.rar[m], total: nR }) : '';
    $('fin-album').textContent = nouveauxAlbum.length ? tr('fin.album', { liste: nouveauxAlbum.map((k) => tr('esp.' + ESP[k].c)).join(', ') }) : '';
    $('fin-peinture').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(e, m, gagne);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      const avantPeint = peinturesOuvertes(totalEtoiles());
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else if (nouveauxAlbum.length) sauverPetit();
      const apresPeint = peinturesOuvertes(totalEtoiles());
      if (apresPeint > avantPeint) $('fin-peinture').textContent = tr('fin.peinture', { nom: tr('peinture.' + (apresPeint - 1)) });
      $('fin-titre').textContent = gagne ? tr('fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : (gagne ? '' : tr('fin.conseil')));
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil.
      if (m >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      if (nouveauxAlbum.length) sauverPetit();
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 5 === 4 ? '#ffd34d' : COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  let attenteTuto = false;

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    bandeau('');
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon'].forEach(fermerVoile);
