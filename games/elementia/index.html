  "aide.regles.t": "Rules",
  "aide.regles": "Only one power is equipped at a time. Every shot has a visible cast time: everything can be dodged, and the stronger a power is, the easier it is to see coming. In the open world, beating a player drops 3 crystals; being knocked out costs nothing. “In combat” lasts 15 seconds after a hit: portals are locked and your health doesn't come back. In the zone of your element, your powers recharge 10% faster.",

<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

#pPause{color:var(--gold);border-color:rgba(255,210,74,.5)}
.box h2{flex:0 1 auto} .box header #pCry{margin-left:auto}
#feed{display:flex;flex-direction:column;gap:2px;margin-top:2px}
#feed div{font-size:11.5px;font-weight:600;color:#dfe3fa;text-shadow:0 1px 2px #000,0 0 4px #000;opacity:.92;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#feed .me{color:#fff3a0} #feed .bad{color:#ff9a8f} #feed .sys{color:#aab2d8} #feed .gold{color:var(--gold)}
#tr{position:absolute;right:calc(10px + var(--sr));top:calc(10px + var(--st));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{width:132px;height:132px;border-radius:50%;background:rgba(8,10,22,.6);border:2px solid rgba(255,255,255,.25);pointer-events:auto;cursor:pointer}
.btns{display:flex;gap:6px}
.ib{width:44px;height:44px;border-radius:13px;background:var(--bg);border:1px solid var(--line);font-size:20px;display:grid;place-items:center;position:relative}
.ib:active{transform:scale(.94)}
.ib.on{border-color:var(--good);color:var(--good)} .ib.off{border-color:var(--bad);color:var(--bad)}
.ib .dot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:#221a00;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
#bAlly span.n{position:absolute;right:50px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:var(--good);white-space:nowrap;text-shadow:0 1px 3px #000;text-align:right;line-height:1.15}
#bossBar{position:absolute;left:50%;top:calc(12px + var(--st));transform:translateX(-50%);width:min(360px,42vw);text-align:center;font-weight:800;font-size:13px;color:var(--gold);text-shadow:0 1px 3px #000}
.bb{height:12px;border-radius:7px;background:rgba(8,10,22,.8);border:2px solid rgba(255,210,74,.6);overflow:hidden;margin-top:3px}
.bb i{display:block;height:100%;background:linear-gradient(#ff8a5a,#e23b3b)}
#announce{position:absolute;left:50%;top:31%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .35s;width:92vw}
#announce.on{opacity:1}
#announce b{display:block;font-size:clamp(22px,4.2vw,38px);font-weight:900;letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 18px rgba(0,0,0,.7)}
#announce span{display:block;font-size:clamp(13px,2vw,17px);font-weight:700;color:#e6eaff;text-shadow:0 1px 3px #000;margin-top:2px}
#tuto{position:absolute;left:50%;top:calc(64px + var(--st));transform:translateX(-50%);background:var(--bg);border:2px solid var(--acc);border-radius:16px;padding:10px 14px;width:min(430px,60vw);text-align:center;pointer-events:auto}
#tuto p{margin:0 0 6px;font-size:14px;font-weight:700;line-height:1.35}
#tuto button{font-size:12px;color:var(--mut);text-decoration:underline}
#toasts{position:absolute;left:50%;bottom:calc(150px + var(--sb));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(480px,70vw)}
.toast{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-size:13.5px;font-weight:700;text-align:center;animation:pop .2s;pointer-events:auto}
.toast.good{border-color:rgba(89,227,106,.7);color:#d2ffd8}
.toast .tb{display:flex;gap:8px;justify-content:center;margin-top:7px}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
#hint{position:absolute;left:50%;bottom:calc(96px + var(--sb));transform:translateX(-50%);background:var(--bg2);border:2px solid var(--gold);color:#fff3c4;border-radius:999px;padding:10px 20px;font-size:14.5px;font-weight:800;pointer-events:auto;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#hint.info{border-color:var(--line);color:var(--txt);font-weight:700}
#hint.act{cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#joy{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3)}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.55)}
#ctl{transform:scale(var(--bs,1));transform-origin:100% 100%;position:absolute;right:calc(14px + var(--sr));bottom:calc(14px + var(--sb));display:grid;grid-template-columns:auto auto auto;grid-template-areas:". glide mount" ". dodge atk";gap:10px;align-items:end;justify-items:end}
.ab{position:relative;border-radius:50%;background:var(--bg2);border:3px solid rgba(255,255,255,.35);display:grid;place-items:center;overflow:hidden;touch-action:none}
.ab .ic{font-size:30px;display:grid;place-items:center;position:relative;z-index:1}
.ab em{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-style:normal;font-size:9.5px;font-weight:800;color:rgba(255,255,255,.75);z-index:1}
.ab .cd{position:absolute;inset:0;background:conic-gradient(rgba(5,6,16,.78) calc(var(--cd,0)*360deg),transparent 0);border-radius:50%}
.ab.big{width:92px;height:92px;grid-area:atk;border-color:var(--el);box-shadow:0 0 0 4px rgba(0,0,0,.25),inset 0 0 18px color-mix(in srgb,var(--el) 45%,transparent)}

.ab.big.aim u{opacity:.85}
.ab.mid{width:66px;height:66px;grid-area:dodge} .ab.small{width:54px;height:54px} .ab.small .ic{font-size:24px}
#bMount{grid-area:mount} #bGlide{grid-area:glide}
.ab.active{border-color:var(--good);box-shadow:0 0 14px rgba(89,227,106,.7)}
.ab.dis{opacity:.45}
.ab:active{transform:scale(.95)}
body.pc .ab.big{width:70px;height:70px} body.pc .ab.big .ic{font-size:32px} body.pc .ab.mid{width:56px;height:56px} body.pc .ab.small{width:48px;height:48px}
body.touch .ab em{display:none}
body.pc #toasts{bottom:calc(120px + var(--sb))}

/* ---------- Panneaux ---------- */
#panel{position:fixed;inset:0;background:rgba(6,7,16,.6);display:grid;place-items:center;padding:calc(8px + var(--st)) calc(8px + var(--sr)) calc(8px + var(--sb)) calc(8px + var(--sl));z-index:20}

.tab{padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.07);font-weight:800;font-size:13.5px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;border:2px solid transparent}

#pBody h3{margin:14px 0 8px;font-size:14px;font-weight:900;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}

#pBody p{margin:0 0 10px}
.it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid var(--line);margin-bottom:8px}
.it.on{border-color:var(--good);background:rgba(89,227,106,.1)}
.it.lock{opacity:.6}
.it .g{flex:1;min-width:0}
.it .n{font-weight:800;font-size:15px}
.it .d{font-size:12.5px;color:var(--mut)}
.it .badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:900;flex:none;background:rgba(255,255,255,.08)}
.it .act{display:flex;flex-direction:column;gap:5px;align-items:stretch;flex:none}
.btn{padding:9px 14px;min-height:44px;border-radius:12px;background:rgba(255,255,255,.12);font-weight:800;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;border:1px solid var(--line)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(#ffc93c,#f59e0b);color:#2a1a00;border:0;box-shadow:0 3px 0 #a86408}
.btn.go{background:linear-gradient(#6ff07f,#2fae48);color:#06270d;border:0;box-shadow:0 3px 0 #1c7a30}
.btn.buy{background:linear-gradient(#7df9ff,#22b8cf);color:#00272e;border:0;box-shadow:0 3px 0 #0f7f91}
.btn.bad{background:linear-gradient(#ff8a7a,#e23b3b);color:#2a0000;border:0}
.btn.xl{font-size:19px;padding:14px 34px;border-radius:16px}
.btn:disabled,.btn.dis{filter:grayscale(1);opacity:.5;box-shadow:none}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.pips i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18)} .pips i.on{background:var(--gold)}
.pb{height:9px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:5px} .pb i{display:block;height:100%;background:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.hub button{padding:14px 8px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.hub button svg{font-size:26px}
.lb{width:100%;border-collapse:collapse;font-size:14px}
.lb td{padding:7px 8px;border-bottom:1px solid var(--line)} .lb td:first-child{width:36px;font-weight:900;color:var(--mut)} .lb td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.lb tr.me td{background:rgba(125,249,255,.12);color:#fff} .lb tr.top td:first-child{color:var(--gold)}
.seg{display:inline-flex;background:rgba(255,255,255,.07);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{padding:6px 12px;border-radius:8px;font-weight:800;font-size:13px} .seg button.on{background:rgba(255,255,255,.2)}
.rar{font-weight:800}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:14px} .kv b{text-align:right;font-variant-numeric:tabular-nums}
#bigMap{width:min(100%,62vh,560px);aspect-ratio:1;display:block;margin:0 auto;border-radius:16px;background:#0d0b14}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
input[type=range]{width:100%;accent-color:var(--acc)}

/* ---------- Écrans ---------- */
.screen{position:fixed;inset:0;display:flex;z-index:15;padding:calc(12px + var(--st)) calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sl));background:radial-gradient(ellipse at 50% 34%,rgba(30,34,90,.5),rgba(10,11,30,.82) 75%);overflow-y:auto;touch-action:pan-y}

#title{background:radial-gradient(ellipse at 50% 34%,rgba(30,34,90,.5),rgba(10,11,30,.82) 75%)}
.tw{text-align:center}
.tw h1{font-size:clamp(46px,11vw,104px);margin:0;font-weight:900;letter-spacing:-.02em;line-height:1;background:linear-gradient(100deg,#ff6a2b,#ffd93b 22%,#6fdc9c 44%,#7fdcf5 62%,#2f9bff 80%,#b48cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}

#elPick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
#elPick button{padding:12px 6px;border-radius:14px;background:rgba(255,255,255,.06);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:15px}
#elPick button svg{font-size:30px;color:var(--c)}
#elPick button small{font-weight:600;font-size:11.5px;color:var(--mut);line-height:1.2}
#elPick button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,transparent)}
.overlay{position:fixed;inset:0;display:grid;place-items:center;z-index:25;background:rgba(10,4,8,.55);text-align:center;padding:16px}
#death h2{font-size:clamp(34px,8vw,64px);margin:0;color:#ff6b6b;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.5)}
#death p{font-size:16px;font-weight:700;margin:8px 0}
.card{background:linear-gradient(#22264a,#14173a);border:3px solid var(--rc,#fff);border-radius:24px;padding:18px 22px;width:min(380px,100%);box-shadow:0 0 50px color-mix(in srgb,var(--rc,#fff) 45%,transparent)}
.card h2{margin:4px 0 0;font-size:24px;font-weight:900}

#lootRar{font-size:15px;font-weight:900;color:var(--rc);text-transform:uppercase;letter-spacing:.1em}

@media (max-height:520px){
  #elPick{grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px} #elPick button{padding:8px 3px;font-size:13px} #elPick button svg{font-size:22px} #elPick button small{font-size:10px}
  .cw{padding:12px 14px;width:min(760px,100%)} .cw h2{font-size:18px;margin-bottom:6px} .cw label{margin:6px 0 4px;font-size:12.5px} .cw input{padding:8px 12px;font-size:15px} .btn.xl{font-size:16px;padding:10px 26px}
  #tuto{width:min(380px,48vw);padding:7px 10px} #tuto p{font-size:12.5px;margin-bottom:3px}
}

  #mini{width:104px;height:104px} .hp{height:19px} #tuto{top:calc(48px + var(--st))} #toasts{bottom:calc(118px + var(--sb))}
  .ab.big{width:82px;height:82px} .box header{padding:8px 12px} #pBody{padding:10px 12px}
}
@media (max-width:520px){ #mini{width:100px;height:100px} #ctl{gap:8px} .it{flex-wrap:wrap} .it .act{flex-direction:row;width:100%} .it .act .btn{flex:1} }

/* ---- Site : écrans des épreuves, son, astuces animées ---- */
.pill{white-space:normal}
#tr .pill{max-width:62vw;text-align:right;justify-content:flex-end}
#hud .ib,#hud .btns{pointer-events:auto}
.ib.snd.off{border-color:var(--bad);color:var(--bad)}
.rowb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:12px}
.rowb.big{justify-content:flex-start;margin:0 0 6px}
.tw .how{max-width:520px;margin:16px auto 0;font-size:14px;font-weight:600;line-height:1.4}
.tw .rowb{margin-top:18px}
#tutoSkip{min-height:44px;padding:0 10px}
#pClose{min-width:44px;min-height:44px}
.tab,.seg button{min-height:44px}
#elPick button b{font-size:15px}
.card.wide{width:min(470px,100%);max-height:100%;overflow-y:auto}
.card .goal{font-weight:800;font-size:16px;color:var(--acc);margin:8px 0}
.stars{color:var(--gold);font-weight:800;letter-spacing:.06em}
.stars.big{font-size:44px;line-height:1.1;margin:6px 0;text-shadow:0 0 18px rgba(255,210,74,.6);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
#endGain{font-size:20px;font-weight:900;color:var(--acc)}
#endAll{color:var(--gold);font-weight:800}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.tip{display:flex;align-items:center;gap:10px;text-align:left;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin:8px 0}
.tip svg{width:108px;height:54px;flex:none;background:rgba(8,10,26,.6);border-radius:10px}
.tip p{margin:0;font-size:13.5px;font-weight:700;line-height:1.3}
.tip .hero{fill:#59e36a;stroke:#fff;stroke-width:2}.tip .foe{fill:#ff6a2b;stroke:#7d210a;stroke-width:2}.tip .ally{fill:#59c9e3;stroke:#fff;stroke-width:2}
.tip .shot{fill:#fff3a0}.tip .ring{fill:none;stroke:rgba(255,255,255,.5);stroke-width:2}.tip .knob{fill:rgba(255,255,255,.85)}
.tip .gem{fill:#7df9ff}.tip .zone{fill:rgba(255,90,60,.18);stroke:#ff6a4a;stroke-width:2}.tip .rock{fill:#8b93a8;stroke:#4a5068;stroke-width:2}
.tip .arr,.tip .hand{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tip .flame{fill:#ffb03c}.tip .bolt{fill:#ffd93b}.tip .star{fill:#ffd24a}.tip .dark{fill:#05061a}.tip .lite{fill:rgba(255,255,255,.16)}.tip .dim{opacity:.35}
.tip .knob{animation:tKnob 1.6s ease-in-out infinite}.tip .walk{animation:tWalk 1.6s ease-in-out infinite}.tip .walkTo{animation:tWalkTo 1.8s ease-in-out infinite}
.tip .fly{animation:tFly 1.1s linear infinite}.tip .hit{animation:tHit 1.1s linear infinite}.tip .foeShot{animation:tFoeShot 1.4s linear infinite}
.tip .dash{animation:tDash 1.4s ease-in-out infinite}.tip .dashFoe{animation:tDashFoe 1.1s ease-in-out infinite}.tip .bob{animation:tBob 1.2s ease-in-out infinite}
.tip .flick{animation:tFlick .5s ease-in-out infinite alternate;transform-origin:50% 60%}.tip .fill{animation:tFill 1.6s linear infinite;transform-origin:center;transform-box:fill-box}
.tip .late{animation-delay:.6s}.tip .flee{animation:tFlee 1.6s ease-in-out infinite}.tip .stop{animation:tStop 1.4s linear infinite}.tip .cross{animation:tCross 1.2s linear infinite}
.tip .fall{animation:tFall 1.5s linear infinite}.tip .hand{animation:tHand 3s linear infinite;transform-origin:60px 30px}
@keyframes tKnob{0%,100%{transform:translate(0,0)}50%{transform:translate(9px,-5px)}}
@keyframes tWalk{0%,100%{transform:translate(-8px,4px)}50%{transform:translate(12px,-6px)}}
@keyframes tWalkTo{0%{transform:translate(0,0)}70%,100%{transform:translate(52px,0)}}
@keyframes tFly{from{transform:translate(0,0)}to{transform:translate(58px,0)}}
@keyframes tHit{0%,80%{opacity:1}90%{opacity:.3}100%{opacity:1}}
@keyframes tFoeShot{from{transform:translate(0,0)}to{transform:translate(-90px,34px)}}
@keyframes tDash{0%,35%{transform:translate(0,0)}55%,100%{transform:translate(34px,6px)}}
@keyframes tDashFoe{0%,40%{transform:translate(0,0)}60%,100%{transform:translate(0,-16px)}}
@keyframes tBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes tFlick{from{transform:scale(.9)}to{transform:scale(1.12)}}
@keyframes tFill{from{transform:scale(.1);opacity:.9}to{transform:scale(1);opacity:.5}}
@keyframes tFlee{0%,30%{transform:translate(0,0)}70%,100%{transform:translate(44px,14px)}}
@keyframes tStop{0%{transform:translate(0,0);opacity:1}55%{transform:translate(14px,0);opacity:1}60%,100%{transform:translate(14px,0);opacity:0}}
@keyframes tCross{from{transform:translate(0,0)}to{transform:translate(52px,-2px)}}
@keyframes tFall{from{transform:translateY(-10px);opacity:1}to{transform:translateY(34px);opacity:.2}}
@keyframes tHand{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.hubw{width:min(720px,100%)}
.hubw header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.hubw header h2{margin:0;flex:1}
#lvGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

<script>'use strict';

/* ==== 00a-i18n.js ==== */
/* Textes : tout passe par le module commun du site (JEL_I18N). Sans lui (essais hors navigateur), la clé est rendue telle quelle. */
const JEU = 'elementia';

const traduire = (k, v) => I18 ? I18.t(k, v) : k;
const nombre = (x, o) => I18 ? I18.nombre(x, o) : String(x);

const nommer = (list, pre, fields = ['name']) => list.forEach(o => fields.forEach(f => { o[f] = traduire(pre + '.' + o.id + (f === 'name' ? '' : '.' + f)); }));

/* ==== 01-util.js ==== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const dist2 = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  let fx = x - xi, fy = y - yi;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}
const fmt = n => nombre(Math.floor(n));
function fmtDur(sec) {
  sec = Math.max(0, Math.floor(sec));
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60, z = x => String(x).padStart(2, '0');
  if (d > 0) return traduire('duree.j', { d, h });
  if (h > 0) return traduire('duree.h', { h, m: z(m) });
  if (m > 0) return traduire('duree.m', { m, s: z(s) });
  return traduire('duree.s', { s });
}
const realNow = () => Date.now();
const dayId = (ms = realNow()) => { const d = new Date(ms); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
// Identifiant de semaine : horodatage du lundi 00 h (heure locale).
const weekId = (ms = realNow()) => {

  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.getTime();
};

function makeRoster() {

const Save = {
  live: false, mem: null,
  read() {
    if (!SV) return this.mem;
    try { return SV.existe(JEU) ? SV.load(JEU) : null; } catch (e) { return null; }
  },
  /* d : données lues (ou passées par la fenêtre de reprise). Une sauvegarde réduite à { niveau, score } donne un personnage neuf à ce niveau. */
  load(d) {
    if (d === undefined) d = this.read();
    const o = d && d.etat, base = newSave();
    if (o && o.v === 1) {
      S = Object.assign(base, o);
      S.settings = Object.assign(newSave().settings, o.settings || {});
      S.camp = Object.assign(newSave().camp, o.camp || {});
      ELEMENTS.forEach(e => { if (S.tiers[e.id] == null) S.tiers[e.id] = 0; if (!S.upg[e.id]) S.upg[e.id] = [0, 0, 0]; });
    } else S = base;
    if (!S.bots || S.bots.length < CFG.server.roster) S.bots = makeRoster();
    if (!S.ach) S.ach = {};
    if (!Array.isArray(S.camp.stars)) S.camp.stars = [];
    const n = d && Number.isFinite(d.niveau) ? Math.floor(d.niveau) : 1;
    S.camp.lvl = clamp(Math.max(S.camp.lvl || 1, n), 1, LEVELS.length);

    if (!SV) { this.mem = data; return true; }

  fresh() { const set = S ? S.settings : null; this.mem = null; this.load(null); if (set) S.settings = set; return S; },

/* ==== 04-audio.js ==== */
/* Sons synthétisés (Web Audio), sans fichier externe. */
const Sfx = {
  ctx: null, master: null, last: {},
  unlock() {
    if (this.ctx || typeof window === 'undefined') { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = S ? S.settings.sound : 0.6;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  volume(v) { if (this.master) this.master.gain.value = v; },
  tone(type, f0, f1, dur, vol, delay = 0) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, vol, freq = 1200, delay = 0) {
    const c = this.ctx; if (!c) return;
    const n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    s.buffer = buf; g.gain.value = vol; s.connect(f); f.connect(g); g.connect(this.master); s.start(c.currentTime + delay);
  },
  // vol : atténuation selon la distance (0 à 1)
  play(name, vol = 1) {
    if (!this.ctx || vol <= 0.03 || !S || S.settings.sound <= 0) return;
    const now = this.ctx.currentTime;
    if (this.last[name] && now - this.last[name] < 0.04) return;
    this.last[name] = now;
    const v = vol;
    switch (name) {
      case 'feu': this.noise(0.18, 0.22 * v, 700); this.tone('sawtooth', 220, 90, 0.16, 0.10 * v); break;
      case 'eau': this.tone('sine', 520, 180, 0.2, 0.18 * v); this.noise(0.12, 0.08 * v, 1800); break;
      case 'glace': this.tone('triangle', 1400, 700, 0.14, 0.14 * v); this.tone('sine', 2100, 1200, 0.1, 0.07 * v, 0.03); break;
      case 'terre': this.tone('square', 130, 60, 0.18, 0.13 * v); this.noise(0.14, 0.14 * v, 300); break;
      case 'vent': this.noise(0.26, 0.2 * v, 2400); break;
      case 'foudre': this.tone('sawtooth', 1200, 200, 0.1, 0.12 * v); this.noise(0.1, 0.16 * v, 3600); break;
      case 'hit': this.tone('square', 240, 110, 0.09, 0.14 * v); break;
      case 'hurt': this.tone('sawtooth', 180, 70, 0.16, 0.2 * v); this.noise(0.1, 0.12 * v, 500); break;
      case 'boom': this.noise(0.45, 0.4 * v, 220); this.tone('sine', 120, 40, 0.4, 0.3 * v); break;
      case 'dodge': this.noise(0.14, 0.16 * v, 3000); break;
      case 'crystal': this.tone('sine', 1250, 1900, 0.09, 0.14 * v); this.tone('sine', 1900, 2500, 0.1, 0.09 * v, 0.05); break;
      case 'kill': this.tone('triangle', 520, 780, 0.1, 0.2 * v); this.tone('triangle', 780, 1170, 0.16, 0.2 * v, 0.09); break;
      case 'death': this.tone('sawtooth', 330, 60, 0.6, 0.25 * v); break;
      case 'buy': this.tone('triangle', 660, 660, 0.08, 0.2 * v); this.tone('triangle', 990, 990, 0.08, 0.2 * v, 0.08); this.tone('triangle', 1320, 1320, 0.16, 0.2 * v, 0.16); break;
      case 'click': this.tone('sine', 700, 900, 0.05, 0.12 * v); break;
      case 'deny': this.tone('square', 160, 120, 0.14, 0.14 * v); break;
      case 'alert': this.tone('triangle', 880, 880, 0.12, 0.2 * v); this.tone('triangle', 1175, 1175, 0.2, 0.2 * v, 0.14); break;
      case 'portal': this.tone('sine', 300, 1200, 0.5, 0.2 * v); break;
      case 'loot': [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone('triangle', f, f, 0.16, 0.2 * v, i * 0.09)); break;
      case 'shield': this.tone('sine', 900, 500, 0.12, 0.1 * v); break;
    }
  }
};

/* Cœur de la simulation : combattants, pouvoirs, projectiles, cristaux. Aucun accès au DOM ici. */
const G = { time: 0, map: null, lobby: null, inst: null, view: null, player: null, scene: 'title', cam: { x: 0, y: 0, zoom: 1, shake: 0 } };

/* Effets visuels et sonores : enregistrés seulement pour le monde affiché. */
const FX = {
  burst(w, x, y, color, n = 8, speed = 140, life = 0.45, size = 4) {
    if (w !== G.view || w.parts.length > 420) return;
    for (let i = 0; i < n; i++) {
      const a = rnd(TAU), s = rnd(speed * 0.3, speed);
      w.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, size: rnd(size * 0.5, size), color });
    }
  },
  trail(w, x, y, color, size = 3, life = 0.35, vy = 0) {
    if (w !== G.view || w.parts.length > 420) return;
    w.parts.push({ x: x + rnd(-4, 4), y: y + rnd(-4, 4), vx: rnd(-14, 14), vy: vy + rnd(-14, 14), life, max: life, size, color });
  },
  text(w, x, y, str, color = '#fff', size = 15) {
    if (w !== G.view || w.texts.length > 60) return;
    w.texts.push({ x: x + rnd(-8, 8), y, str, color, size, life: 0.9, max: 0.9 });
  },
  ring(w, x, y, r, color, life = 0.4) { if (w === G.view) w.rings.push({ x, y, r, color, life, max: life }); },
  bolt(w, x1, y1, x2, y2, color) { if (w === G.view) w.bolts.push({ x1, y1, x2, y2, color, life: 0.18 }); },
  shake(a) { if (S && S.settings.shake) G.cam.shake = Math.max(G.cam.shake, a); },
  sound(w, name, x, y, base = 1) {
    if (w !== G.view) return;
    const d = dist(x, y, G.cam.x, G.cam.y);
    Sfx.play(name, base * clamp(1 - d / 950, 0, 1));
  }
};

          if (e.dead || e.sleep || !this.hostile(s.src, e)) continue;
          const rr = e.r + s.r, dx = e.x - s.x, dy = e.y - s.y;

            }
            if (e.shield > 0) { this.damage(s.src, e, 0, {}); end = true; break; }
            this.damage(s.src, e, s.dmg, { p: s.p, ang: s.ang, fxs: s.fxs });

        FX.burst(this, s.x, s.y, c.c, s.p.splash ? 12 : 5, s.p.splash ? 200 : 110, 0.3, s.p.splash ? 5 : 3);
        if (s.p.splash) FX.ring(this, s.x, s.y, s.p.splash, c.c, 0.25);

  }
  stepCrystals(dt) {

    for (let i = C.length - 1; i >= 0; i--) {
      const c = C[i];
      c.life -= dt; c.age += dt;
      if (c.life <= 0) { C.splice(i, 1); continue; }
      const kd = Math.exp(-4 * dt);

    // Le familier ramasse les cristaux proches de son maître.
    let tx = f.x - Math.cos(f.face) * 34 - Math.sin(f.face) * 18, ty = f.y - Math.sin(f.face) * 34 + Math.cos(f.face) * 18;
    let c = f.petTarget;

    if (c) {
      tx = c.x; ty = c.y; sp = 9;
      if (dist2(f.px, f.py, c.x, c.y) < 22 * 22) {
        const i = this.crystals.indexOf(c);
        if (i >= 0) { this.crystals.splice(i, 1); if (this.onPickup) this.onPickup(f, c); }
        f.petTarget = null;
      }

  }
  stepFx(dt) {
    const P = this.parts;
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i]; p.life -= dt;
      if (p.life <= 0) { P[i] = P[P.length - 1]; P.pop(); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94;

    for (let i = this.texts.length - 1; i >= 0; i--) { const t = this.texts[i]; t.life -= dt; t.y -= 34 * dt; if (t.life <= 0) this.texts.splice(i, 1); }
    for (let i = this.rings.length - 1; i >= 0; i--) { this.rings[i].life -= dt; if (this.rings[i].life <= 0) this.rings.splice(i, 1); }
    for (let i = this.bolts.length - 1; i >= 0; i--) { this.bolts[i].life -= dt; if (this.bolts[i].life <= 0) this.bolts.splice(i, 1); }
  }
}

/* ==== 06-map.js ==== */
/* Carte ouverte : 10 zones, obstacles, portails, entrées de donjon, camps de PNJ, bordure en montagnes. */
const MAP = { size: CFG.map.size, cx: CFG.map.size / 2, cy: CFG.map.size / 2, R: CFG.map.radius, seeds: [], portals: [], doors: [], camps: [], water: 4350 };
(function initSeeds() {
  MAP.seeds[0] = { x: MAP.cx, y: MAP.cy, a: 0 };
  for (let i = 1; i < 10; i++) {
    const a = -Math.PI / 2 + (i - 1) * TAU / 9;
    MAP.seeds[i] = { x: MAP.cx + Math.cos(a) * 3700, y: MAP.cy + Math.sin(a) * 3700, a };
  }
})();
function zoneAt(x, y) {
  const wx = x + (vnoise(x * 0.0016, y * 0.0016, 11) - 0.5) * 560, wy = y + (vnoise(x * 0.0016, y * 0.0016, 47) - 0.5) * 560;
  let best = 0, bd = 1e18;
  for (let i = 0; i < 10; i++) { const s = MAP.seeds[i], dx = wx - s.x, dy = wy - s.y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }
  return best;
}
function isWater(x, y, z) {
  if ((z === undefined ? zoneAt(x, y) : z) !== 7) return false;
  return dist(x, y, MAP.cx, MAP.cy) > MAP.water + (vnoise(x * 0.004, y * 0.004, 5) - 0.5) * 260;
}

const OBS_DEF = {
  tree: [15, 52], pine: [13, 46], palm: [11, 44], mangrove: [16, 50], deadtree: [10, 36], cactus: [13, 26],
  rock: [30, 30], ice: [28, 28], crystal: [26, 26], stalag: [20, 20], pillar: [20, 20], wall: [32, 32],
  basalt: [34, 34], mesa: [66, 66], rod: [9, 30]

function npcPow(el, ranged, dmg) {
  return ranged
    ? { shape: 'proj', cast: 0.5, cd: 1.5, dmg: dmg * 0.85, speed: 370, range: 440, r: 8, el, tier: 1, mast: 0.6 }
    : { shape: 'melee', cast: 0.45, cd: 1.0, dmg, range: 48, el, tier: 1, mast: 0.6 };
}
function makeNpc(name, el, x, y, o = {}) {
  const ranged = !!o.ranged;
  return new Fighter(Object.assign({
    kind: 'npc', faction: 'n', name, el, x, y, r: 17, speed: CFG.npc.speed * (ranged ? 0.9 : 1.05),
    maxHp: o.hp || CFG.npc.hp, hp: o.hp || CFG.npc.hp, pow: npcPow(el, ranged, o.dmg || CFG.npc.dmg),
    ai: { type: 'npc', home: { x, y }, ranged, t: rnd(0.3), aggro: o.aggro || CFG.npc.aggro, leash: o.leash || CFG.npc.leash, target: null, wt: 0, wx: x, wy: y },
    crystals: o.crystals == null ? CFG.npc.crystals : o.crystals, look: o.look || (ranged ? 2 : 1)

}

  return new Fighter({
    kind: 'boss', faction: 'n', boss: true, name, el, x, y, r: o.r || 44, speed: o.speed || 105, maxHp: hp, hp,

      P('meteor', { cast: 0.7, cd: 1.8, range: 800, r: 120, count: o.meteors || 3, delay: 1.1 }),
      P('nova', { cast: 1.2, cd: 1.6, range: 250, dmg: dmg * 1.2 })
    ],
    ai: { type: 'boss', home: { x, y }, t: 0, target: null, aggro: o.aggro || 620, leash: o.leash || 900, seq: 0, hits: {} },
    crystals: o.crystals || 0, world_boss: !!o.world
