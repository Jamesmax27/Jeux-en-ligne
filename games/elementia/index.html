  act(a, d) {
    const A = this.arg;
    switch (a) {
      case 'tab': A.tab = d.id; $('pBody').scrollTop = 0; this.render(); Sfx.play('click'); break;
      case 'open': this.open(d.id); break;
      case 'close': this.close(); break;
      case 'mute': this.mute(); break;
      case 'restart': { const c = Camp.cur; this.close(); if (c) Main.level(c.n); break; }
      case 'levels': this.close(); Main.toHub(); break;
      case 'home': this.close(); Main.toTitle(); break;
      case 'buyTier': Shop.buyTier(d.el); this.elColor(); break;
      case 'equip': Shop.equip(d.el, +d.t); this.elColor(); break;
      case 'try': this.close(); Lobby.tryPower(d.el, +d.t); this.elColor(); break;
      case 'buyUpg': Shop.buyUpg(d.el, +d.k); break;
      case 'buyAura': Shop.buyAura(d.id); break;
      case 'setAura': Shop.setAura(d.id || null); break;
      case 'buyItem': Shop.buyItem(d.id); break;
      case 'setItem': Shop.setItem(d.type, d.id || null); break;
      case 'claim': if (Sys.claimQuest(+d.i)) this.toast(traduire('quete.recu'), 'good'); this.render(); break;
      case 'period': A.period = d.id; this.render(); break;
      case 'allyOpen': Sys.setAllyOpen(!S.allyOpen); Save.write(); break;
      case 'allyAsk': {
        const e = Sys.online.find(o => o.rb.id === d.id);
        if (e && Sys.requestAlly(e.f)) this.toast(traduire('allie.envoye', { nom: esc(e.rb.name) })); else this.toast(traduire('allie.impossible'));
        this.render(); break;
      }
      case 'allyDrop': { const e = Sys.online.find(o => o.rb.id === d.id); if (e) Sys.unally(e.f); this.render(); break; }
      case 'duel': this.close(); Arena.start(+d.l); break;
      case 'quality': S.settings.quality = +d.q; R.resize(); Save.write(); this.render(); break;
      case 'aim': S.settings.aim = !S.settings.aim; Save.write(); this.render(); break;
      case 'shake': S.settings.shake = !S.settings.shake; Save.write(); this.render(); break;
      case 'bots': S.settings.bots = +d.q; Sys.retune(); Save.write(); this.render(); break;
      case 'renfort': S.settings.renfort = !S.settings.renfort; Save.write(); this.render(); break;
      case 'btn': S.settings.btn = +d.q; this.applyBtn(); Save.write(); this.render(); break;
      case 'reset1': A.confirm = true; this.render(); break;
      case 'reset2': this.close(); Main.wipe(); break;
      case 'quit': this.close(); if (G.scene === 'arena') Arena.quit(); else if (G.scene === 'dungeon') { this.toast(traduire('donjon.abandon')); Sys.toLobby(); } break;
    }
  }
};

/* ---------- Contenu des panneaux ---------- */
const pips = (n, max = 3) => '<span class="pips">' + Array.from({ length: max }, (_, i) => '<i' + (i < n ? ' class="on"' : '') + '></i>').join('') + '</span>';
const lobbyOnly = () => Shop.safe() ? '' : '<p class="mut">' + traduire('boutique.lobbyAide') + '</p>';
const onOff = v => traduire(v ? 'regl.oui' : 'regl.non');
function itemRows(types) {
  const list = ITEMS.filter(i => types.indexOf(i.type) >= 0), at = Shop.safe();
  const rank = i => owns(i.id) ? 0 : i.src === 'shop' ? 1 : 2;
  list.sort((a, b) => rank(a) - rank(b) || a.rar - b.rar);
  let h = '';
  for (const it of list) {
    const own = owns(it.id), eq = S[it.type] === it.id, rc = RARITIES[it.rar];
    let d = '<span class="rar" style="color:' + rc.c + '">' + rc.name + '</span> · ';
    if (it.type === 'mount') d += traduire('objet.d.mount', { n: Math.round(((it.rar >= 3 ? CFG.mount.legend : CFG.mount.epic) - 1) * 100) });
    else if (it.type === 'glider') d += traduire('objet.d.glider', { s: CFG.glider.gauge, n: Math.round((CFG.glider.speed - 1) * 100) });
    else if (it.type === 'pet') d += traduire('objet.d.pet');
    else d += traduire('objet.d.trail');
    if (!own && it.src === 'loot') d += ' · ' + traduire('objet.butin');
    if (!own && it.src === 'excl') d += ' · ' + traduire('objet.exclusif', { nom: DUNGEONS.find(x => x.excl === it.id).name });
    let act;

  }

/* ==== 14-input.js ==== */
/* Commandes : clavier et souris sur PC, joystick et boutons sur téléphone et tablette. */
const Input = {
  touch: false, keys: {}, mx: 0, my: 0, down: false,
  joy: { id: null, ox: 0, oy: 0, dx: 0, dy: 0 },
  atk: { id: null, ox: 0, oy: 0, dx: 0, dy: 0, manual: false, t: 0 }, tapT: 0, wantDodge: false,
  init() {
    const cv = $('cv'), self = this;
    this.setMode(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
    window.addEventListener('keydown', e => {
      if (e.target && e.target.tagName === 'INPUT') return;
      if (e.code === 'Escape' || e.code === 'KeyP') { if (UI.cur) { if (e.code === 'Escape' || UI.cur === 'pause') UI.close(); } else if (Main.started && !Camp.over()) UI.open('pause'); return; }
      if (UI.cur || !Main.started) return;
      this.keys[e.code] = true;
      if (e.code === 'Space') { this.wantDodge = true; e.preventDefault(); }
      else if (e.code === 'KeyE') { const n = Sys.near; if (n && n.kind === 'stand') UI.openStand(n.poi); }
      else if (e.code === 'KeyM') UI.toggle('map');
      else if (e.code === 'KeyR') this.mount();
      else if (e.code === 'KeyF') this.glide();
      else if (e.code === 'Tab' || e.code.indexOf('Arrow') === 0) e.preventDefault();
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { this.keys = {}; this.down = false; });
    document.addEventListener('mouseleave', () => { this.down = false; });
    cv.addEventListener('pointerdown', e => {
      Sfx.unlock();
      if (e.pointerType === 'mouse') { this.setMode(false); this.mx = e.clientX; this.my = e.clientY; if (e.button === 0) this.down = true; return; }
      this.setMode(true);
      if (this.joy.id == null && e.clientX < window.innerWidth * 0.6) {
        this.joy.id = e.pointerId; this.joy.ox = e.clientX; this.joy.oy = e.clientY; this.joy.dx = this.joy.dy = 0;
        const j = $('joy'); j.style.left = e.clientX + 'px'; j.style.top = e.clientY + 'px'; j.classList.remove('hidden'); j.firstElementChild.style.transform = '';
      }
    });
    window.addEventListener('pointermove', e => {
      if (e.pointerType === 'mouse') { this.mx = e.clientX; this.my = e.clientY; return; }
      if (e.pointerId === this.joy.id) {
        let dx = e.clientX - this.joy.ox, dy = e.clientY - this.joy.oy; const l = Math.hypot(dx, dy), M = 52;
        if (l > M) { dx *= M / l; dy *= M / l; }
        this.joy.dx = dx / M; this.joy.dy = dy / M;
        $('joy').firstElementChild.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      } else if (e.pointerId === this.atk.id) {
        const a = this.atk; a.dx = e.clientX - a.ox; a.dy = e.clientY - a.oy;
        if (!a.manual && Math.hypot(a.dx, a.dy) > 16) { a.manual = true; $('bAtk').classList.add('aim'); }
        if (a.manual) { const l = Math.hypot(a.dx, a.dy), k = Math.min(1, 34 / l); $('bAtk').querySelector('u').style.transform = 'translate(' + a.dx * k + 'px,' + a.dy * k + 'px)'; }
      }
    });
    const up = e => {
      if (e.pointerType === 'mouse') { if (e.button === 0) this.down = false; return; }
      if (e.pointerId === this.joy.id) { this.joy.id = null; this.joy.dx = this.joy.dy = 0; $('joy').classList.add('hidden'); }
      if (e.pointerId === this.atk.id) {
        const a = this.atk;
        if (!a.manual && G.time - a.t < 0.3) this.tapT = 0.3;
        a.id = null; a.manual = false; $('bAtk').classList.remove('aim'); $('bAtk').querySelector('u').style.transform = '';
      }
    };
    window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    $('bAtk').addEventListener('pointerdown', e => {
      Sfx.unlock(); e.preventDefault();
      if (e.pointerType === 'mouse') { this.tapT = 0.3; return; }
      this.setMode(true);
      const a = this.atk; a.id = e.pointerId; a.ox = e.clientX; a.oy = e.clientY; a.dx = a.dy = 0; a.manual = false; a.t = G.time;
    });
    $('bDodge').addEventListener('pointerdown', e => { Sfx.unlock(); e.preventDefault(); this.wantDodge = true; });
    $('bMount').addEventListener('pointerdown', e => { e.preventDefault(); this.mount(); });
    $('bGlide').addEventListener('pointerdown', e => { e.preventDefault(); this.glide(); });
    window.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('gesturestart', e => e.preventDefault());
  },
  setMode(t) { if (this.touch === t && document.body.className) return; this.touch = t; document.body.className = t ? 'touch' : 'pc'; },
  mount() {
    const p = G.player; if (!p || p.dead || !p.mount || G.scene === 'lobby' || p.cast || p.beam || p.gliding) return;
    p.mounted = !p.mounted; Sfx.play('click');
  },
  glide() {
    const p = G.player; if (!p || p.dead || !p.glider || G.scene !== 'map' || p.cast || p.beam) return;
    if (p.gliding) p.gliding = false;
    else if (p.gauge < 1.2) UIH.toast(traduire('planeur.jauge'));
    else { p.gliding = true; p.mounted = false; p.channel = 0; Sfx.play('dodge'); }
  },
  /* Visée automatique (tactile) : la cible hostile la plus pertinente à portée, avec anticipation. */
  autoAim(p, w) {
    const pw = powOf(p), R2 = pw.range * 1.12;
    let best = null, bs = 1e9;
    for (const e of w.fighters) {
      if (e.dead || e.sleep || !w.hostile(p, e)) continue;
      const d = dist(p.x, p.y, e.x, e.y); if (d > R2 + e.r) continue;
      const sc = d + Math.abs(angDiff(p.face, Math.atan2(e.y - p.y, e.x - p.x))) * 60 + (e.shield > 0 ? 400 : 0) + (e.kind === 'dummy' ? 50 : 0);
      if (sc < bs) { bs = sc; best = e; }
    }
    if (!best) return null;
    const tt = pw.speed ? dist(p.x, p.y, best.x, best.y) / pw.speed + pw.cast * 0.5 : 0, sp = best.moving ? speedOf(best) : 0;
    return Math.atan2(best.y + best.my * sp * tt * 0.85 - p.y, best.x + best.mx * sp * tt * 0.85 - p.x);
  },
  apply(dt) {
    const p = G.player, w = p && p.world;
    if (!p || !w) return;
    if (this.tapT > 0) this.tapT -= dt;
    if (p.dead || UI.cur) { p.mx = p.my = 0; R.aimLine = null; this.wantDodge = false; if (UI.cur) this.down = false; return; }
    const K = this.keys;
    let mx = (K.KeyD || K.ArrowRight ? 1 : 0) - (K.KeyA || K.ArrowLeft ? 1 : 0), my = (K.KeyS || K.ArrowDown ? 1 : 0) - (K.KeyW || K.ArrowUp ? 1 : 0);
    if (this.joy.id != null) { const l = Math.hypot(this.joy.dx, this.joy.dy); if (l > 0.18) { mx = this.joy.dx; my = this.joy.dy; } }
    p.mx = mx; p.my = my;
    let ang = null, want = false;
    if (!this.touch) {
      ang = Math.atan2((this.my - R.H / 2) / R.zoom + G.cam.y - p.y, (this.mx - R.W / 2) / R.zoom + G.cam.x - p.x);
      R.aimLine = { a: ang, strong: false }; want = this.down || this.tapT > 0;
    } else {
      const a = this.atk;
      want = a.id != null || this.tapT > 0;
      if (a.id != null && a.manual) { ang = Math.atan2(a.dy, a.dx); R.aimLine = { a: ang, strong: true }; }
      else {
        R.aimLine = null;
        if (want || p.cast || p.beam) ang = S.settings.aim ? this.autoAim(p, w) : null;
        if (ang == null) ang = (p.cast || p.beam) ? p.aim : p.face;
      }
    }
    if ((p.cast || p.beam) && ang != null) p.aim = ang;
    if (want && p.cd <= 0 && !p.cast && !p.beam && ang != null) { if (w.attack(p, ang)) this.tapT = 0; }
    if (this.wantDodge) { this.wantDodge = false; w.dodge(p, mx, my); }
  }
};

/* ==== 15-main.js ==== */
/* Démarrage, écrans (titre, personnage, liste des épreuves) et boucle principale.
   mode : title (écran titre), create (choix de l'élément), hub (liste des épreuves), play (épreuve ou monde libre). */
const Main = {
  mode: 'title', started: false, last: 0, saveT: 0, specT: 0, frozen: false,
  boot() {
    Sys.init();
    Sys.startServer(); Sys.makePlayer();
    Sys.move(G.player, G.lobby, G.lobby.spawn.x, G.lobby.spawn.y);
    R.init(); UI.init(); Input.init();
    G.view = G.map; G.scene = 'title'; this.spectate();
    $('titleInfo').textContent = traduire(Input.touch ? 'accueil.regles.tactile' : 'accueil.regles.clavier');
    $('play').onclick = () => {
      Sfx.unlock(); Sfx.play('click');
      JEL_SAVE.reprise({ jeu: JEU, onContinuer: d => this.resume(d), onNouvelle: () => this.fresh(), onEffacer: () => this.erased() });
    };
    // Sauvegarde à la fermeture de la page, seulement pendant une partie (jamais depuis l'écran titre).
    JEL_SAVE.surFermeture(() => { if (this.mode !== 'title') Save.write(); });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { this.last = performance.now(); return; }
      if (this.started && !UI.cur && !Camp.over() && !G.player.dead) UI.open('pause');
    });
    if (window.JEL_AFFICHE) { Poster.draw(); return; }
    if (window.JEL_APERCU) { Preview.open(window.JEL_APERCU); return; }
    requestAnimationFrame(t => { this.last = t; this.loop(t); });
  },
  show(id) { for (const k of ['title', 'create', 'hub']) $(k).classList.toggle('hidden', k !== id); },
  spectate() {
    const c = Sys.online.filter(e => e.where === 'map' && !e.f.dead);
    G.spectate = c.length ? pick(c).f : null;
    if (G.spectate) { G.cam.x = G.spectate.x; G.cam.y = G.spectate.y; }
  },
  /* Remet le monde à neuf autour de l'état S (nouvelle partie, sauvegarde effacée). */
  rebuild() {
    Sys.rollWeek(); Sys.rollDay();
    Sys.startServer(); Sys.makePlayer();
    Sys.move(G.player, G.lobby, G.lobby.spawn.x, G.lobby.spawn.y);
    G.view = G.map; G.scene = 'title'; this.spectate(); UI.sound(); UI.applyBtn(); UI.tutoState = null;
  },
  /* « Nouvelle partie » : état neuf si une progression existait, puis choix de l'élément. */
  fresh() {
    if (S.el || S.camp.lvl > 1 || Camp.stars() > 0) { Save.fresh(); this.rebuild(); }
    Save.live = true; this.create(1);
  },
  /* « Continuer » : reprise à l'épreuve enregistrée. */
  resume(d) {
    if (d && Number.isFinite(d.niveau)) S.camp.lvl = clamp(Math.max(S.camp.lvl, Math.floor(d.niveau)), 1, LEVELS.length);
    Save.live = true;
    if (!S.el) this.create(S.camp.lvl);
    else if (Camp.done()) this.toHub();
    else this.level(S.camp.lvl);
  },
  erased() { Save.live = false; Save.fresh(); this.rebuild(); },
  wipe() { Save.clear(); Save.live = false; Save.fresh(); this.leave(); this.rebuild(); this.mode = 'title'; this.show('title'); },
  create(n) {
    const pickEl = $('elPick'), start = $('start');
    let el = ELEMENTS[0].id;
    this.mode = 'create'; this.show('create');
    pickEl.innerHTML = ELEMENTS.map(e => '<button data-el="' + e.id + '" class="' + (e.id === el ? 'on' : '') + '" style="--c:' + e.c + '">' + ico(e.id) + '<b>' + e.name + '</b><small>' + e.effect + '</small></button>').join('');
    pickEl.onclick = ev => { const b = ev.target.closest('button'); if (!b) return; el = b.dataset.el; pickEl.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); Sfx.play('click'); };
    start.onclick = () => {
      S.el = el; S.tiers[el] = Math.max(1, S.tiers[el]); S.equip = { el, tier: 1 };
      Sys.applyLoadout(); Save.write(); Sfx.play('buy'); this.level(n);
    };
  },
  /* Lance une épreuve (présentation, puis « C'est parti »). */
  level(n) {
    UI.close(); this.show(null); G.spectate = null; this.mode = 'play'; this.started = true;
    $('hud').classList.remove('hidden');
    Camp.start(n); UI.elColor();
  },
  /* Monde libre : lobby, carte, donjons. */
  world() {
    UI.close(); this.show(null); G.spectate = null; this.mode = 'play'; this.started = true;
    $('hud').classList.remove('hidden');
    Sys.applyLoadout(); Sys.toLobby(true); UI.elColor();
    if (Sys.loginReward) setTimeout(() => UIH.login(), 900);
  },
  /* Quitte la partie en cours : le joueur attend au lobby, la caméra suit un joueur de la carte. */
  leave() {
    UI.close();
    for (const k of ['hud', 'brief', 'end', 'death', 'loot']) $(k).classList.add('hidden');
    if (Dungeon.cur) Dungeon.release();
    Arena.cur = null; Lobby.trial = null; Camp.quit();
    const p = G.player; Sys.move(p, G.lobby, G.lobby.spawn.x, G.lobby.spawn.y); p.streak = 0; G.inst = null;
    G.view = G.map; G.scene = 'title'; this.started = false; this.spectate();
  },
  toHub() {
    if (!S.el) { this.create(S.camp.lvl); return; }
    this.leave(); this.mode = 'hub'; Save.write(); UI.hub(); this.show('hub');
  },
  toTitle() { this.leave(); Save.write(); Save.live = false; this.mode = 'title'; this.show('title'); },
  /* Pause : fenêtre de présentation ou de fin d'épreuve, menu pause partout, autres panneaux hors du lobby. */
  paused() {
    if (!this.started) return false;
    if (Camp.over()) return true;
    return !!UI.cur && (G.scene !== 'lobby' || UI.cur === 'pause') && !G.player.dead;
  },
  step(dt) {
    G.time += dt;
    // Pendant une épreuve, le monde libre attend : rien d'autre ne s'affiche ni ne consomme de calcul.
    if (G.scene !== 'level') { Sys.update(dt); G.map.update(dt); G.lobby.update(dt); }
    if (G.inst) G.inst.update(dt);
    Dungeon.update(dt); Lobby.update(dt); Camp.update(dt);
  },
  loop(t) {
    const dt = Math.min(0.05, Math.max(0.001, (t - this.last) / 1000)); this.last = t;
    if (!document.hidden) {
      const paused = this.paused();
      if (!paused) {
        if (this.started) Input.apply(dt);
        this.step(dt);
        if (!this.started) { if ((this.specT += dt) > 9 || !G.spectate || G.spectate.dead || G.spectate.world !== G.map) { this.specT = 0; this.spectate(); } }
      }
      R.frame(paused ? 0 : dt);
      if (this.started) { UI.hud(dt); if (!paused) S.playSec += dt; if ((this.saveT += dt) > 10) { this.saveT = 0; Save.write(); } }
    }
    requestAnimationFrame(tt => this.loop(tt));
  }
};
window.addEventListener('load', () => { Main.boot(); });

/* ==== 16-affiche.js ==== */
/* Affiche (jaquette du site) et images du jeu : le jeu les prépare lui-même, sans menu ni texte.
   JEL_AFFICHE : scène composée, héros en grand face à un colosse. JEL_APERCU 1 à 3 : une épreuve en pleine action, figée. */
const Preview = {
  open(n) {
    const P = { 1: { lvl: 1, el: 'feu', tier: 1, wave: 1, t: 2.6, cry: 35 }, 2: { lvl: 10, el: 'glace', tier: 3, wave: 1, t: 3.4, cry: 640 }, 3: { lvl: 20, el: 'foudre', tier: 4, wave: 2, t: 3.6, cry: 2480 } }[+n] || { lvl: 1, el: 'feu', tier: 1, wave: 0, t: 2.6, cry: 35 };
    Main.show(null); G.spectate = null; Main.mode = 'play'; Main.started = true;
    S.el = P.el; S.tiers[P.el] = P.tier; S.equip = { el: P.el, tier: P.tier }; S.crystals = P.cry; S.camp.lvl = P.lvl;
    for (let i = 0; i < P.lvl - 1; i++) S.camp.stars[i] = 3 - (i % 3 === 2 ? 1 : 0);
    if (P.lvl > 1) { S.auras.vitesse = 2; S.aura = 'vitesse'; S.items.push('p_renard', 't_etoiles'); S.pet = 'p_renard'; S.trail = 't_etoiles'; }
    $('hud').classList.remove('hidden');
    Camp.start(P.lvl, true, P.wave); UI.elColor(); $('announce').classList.remove('on'); clearTimeout(UI.annT);
    const p = G.player, c = Camp.cur;
    p.ai = Camp.botAi(0.85);
    for (let i = 0; i < P.t * 30; i++) {
      G.time += 1 / 30; G.inst.update(1 / 30); Camp.update(1 / 30);
      if (p.hp < 62) p.hp = 62; c.hp = p.hp; c.taken = Math.min(c.taken, c.L.s3 - 2);
      if (c.end || !Camp.cur) break;
    }
    p.ai = null;
    for (let i = 0; i < 12; i++) R.frame(0.1);
    R.frame(0); UI.hud(1); UI.hudT = 0; UI.hud(1);
  }
};
