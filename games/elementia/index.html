}

function buildMap() {
  const w = new World('map', MAP.size, MAP.size);
  const rng = mulberry(20261127);
  MAP.portals = []; MAP.doors = []; MAP.camps = [];
  const C = MAP.cx, clear = [];
  // Portails de retour : un par zone
  ZONES.forEach((z, i) => {
    const s = MAP.seeds[i];
    const p = i === 0 ? { x: s.x, y: s.y + 330 } : { x: s.x - Math.cos(s.a) * 420, y: s.y - Math.sin(s.a) * 420 };
    p.zone = i; p.r = 46; MAP.portals.push(p); clear.push({ x: p.x, y: p.y, r: 210 });
  });
  // Entrées de donjon
  DUNGEONS.forEach((d, k) => {
    const zi = ZONES.findIndex(z => z.id === d.zone), s = MAP.seeds[zi];
    let x, y;
    if (d.id === 'bateau') { x = C + Math.cos(s.a - 0.13) * 4560; y = C + Math.sin(s.a - 0.13) * 4560; }
    else if (d.id === 'epave') { x = C + Math.cos(s.a + 0.16) * 4960; y = C + Math.sin(s.a + 0.16) * 4960; }
    else {
      const a = { chateau: 0.7, labyrinthe: 3.7, mine: 2.2, temple: 1.6, forge: 4.0, tour: 0.4, forteresse: 3.5, pyramide: 5.0, palais: 2.9, manoir: 1.2, observatoire: 4.6 }[d.id] || k * 2.4;
      let dd = 860;
      do { x = s.x + Math.cos(a) * dd; y = s.y + Math.sin(a) * dd; dd -= 90; } while (dd > 200 && (zoneAt(x, y) !== zi || dist(x, y, C, C) > MAP.R - 520));
    }
    const door = { x, y, def: d, zone: zi, r: 64, busyT: 0, by: null };
    MAP.doors.push(door); clear.push({ x, y, r: 290 });
  });
  // Camps de PNJ
  ZONES.forEach((z, i) => {
    const s = MAP.seeds[i];
    for (let k = 0; k < CFG.npc.campsPerZone; k++) {
      let x, y, dd = i === 0 ? 1050 : 1250, ok = false, a = k * TAU / 3 + i * 1.3 + 0.4, tries = 0;
      while (!ok && tries++ < 40) {
        x = s.x + Math.cos(a) * dd; y = s.y + Math.sin(a) * dd;
        ok = zoneAt(x, y) === i && dist(x, y, C, C) < MAP.R - 560 && !isWater(x, y, i) && !clear.some(c => dist(x, y, c.x, c.y) < c.r + 320);
        if (!ok) { dd -= 80; if (dd < 300) { dd = 1100; a += 0.5; } }
      }
      const camp = { x, y, zone: i, npcs: [], respawn: [] };
      MAP.camps.push(camp); clear.push({ x, y, r: 230 });
      for (let n = 0; n < CFG.npc.perCamp; n++) {
        const an = n * TAU / CFG.npc.perCamp + k;
        const npc = makeNpc(z.npc, z.el, x + Math.cos(an) * 80, y + Math.sin(an) * 80, { ranged: n === CFG.npc.perCamp - 1 });
        npc.camp = camp; npc.zone = i; camp.npcs.push(npc); w.add(npc);
      }
    }
  });
  // Obstacles : grille perturbée, densité par zone, clairières par bruit
  const step = 215;
  for (let gy = 0; gy < MAP.size; gy += step) for (let gx = 0; gx < MAP.size; gx += step) {
    const x = gx + rng() * step, y = gy + rng() * step, r1 = rng(), r2 = rng(), r3 = rng();
    const d = dist(x, y, C, C);
    if (d > MAP.R - 90) continue;
    const zi = zoneAt(x, y), z = ZONES[zi];
    const mask = vnoise(x * 0.0021, y * 0.0021, 91);
    if (r1 > z.dens * 0.62 * (0.25 + mask * 1.3)) continue;
    if (clear.some(c => dist2(x, y, c.x, c.y) < c.r * c.r)) continue;
    let tot = 0; for (const o of z.obs) tot += o[1];
    let pickv = r2 * tot, type = z.obs[0][0];
    for (const o of z.obs) { pickv -= o[1]; if (pickv <= 0) { type = o[0]; break; } }
    if (isWater(x, y, zi)) { if (type === 'palm') type = 'rock'; if (r3 < 0.5) continue; }
    const def = OBS_DEF[type], sc = 0.8 + r3 * 0.5;
    w.addObs({ x, y, r: def[0] * sc, vr: def[1] * sc, type, v: Math.floor(r3 * 1000) });
  }
  w.cdBonus = f => (f.faction === 'p' && ZONES[zoneAt(f.x, f.y)].el === f.el) ? 1 - CFG.map.zoneBonus : 1;
  w.bound = mapBound;
  return w;
}
/* Bordure : la pente freine progressivement, la montagne arrête, une projection hors zone élimine. */
function mapBound(f, vx, vy, dt) {
  const dx = f.x - MAP.cx, dy = f.y - MAP.cy, R = MAP.R, sl = CFG.map.slope;
  let d = Math.hypot(dx, dy);
  if (d < R - sl) return;
  const ox = dx / d, oy = dy / d, out = vx * ox + vy * oy, t = clamp((d - (R - sl)) / sl, 0, 1);
  if (out > 0) { const cut = out * dt * (0.1 + t * 0.85); f.x -= ox * cut; f.y -= oy * cut; d -= cut; }
  if (d > R) {
    if (Math.hypot(f.kx, f.ky) < 90) { f.x = MAP.cx + ox * R; f.y = MAP.cy + oy * R; }
    else if (d > R + CFG.map.ringOut) Sys.outOfBounds(f);
  }
}
/* Point d'apparition : tiré parmi les points les plus éloignés des joueurs présents. */
function findSpawn(w) {
  let best = null, bs = -1;
  for (let i = 0; i < CFG.spawn.tries; i++) {
    const a = rnd(TAU), d = Math.sqrt(Math.random()) * (MAP.R - 700), x = MAP.cx + Math.cos(a) * d, y = MAP.cy + Math.sin(a) * d;
    if (w.blocked(x, y, 30)) continue;
    let m = 1e9;
    for (const f of w.fighters) { if (f.dead || f.faction === 'd') continue; const dd = dist(x, y, f.x, f.y) * (f.faction === 'p' ? 1 : 2.2); if (dd < m) m = dd; }
    for (const p of MAP.doors) { const dd = dist(x, y, p.x, p.y) * 3; if (dd < m) m = dd; }
    if (m > bs) { bs = m; best = { x, y }; }
  }
  return best || { x: MAP.cx, y: MAP.cy };
}

/* ==== 07-ai.js ==== */
/* Intelligence des PNJ, des boss et des joueurs simulés (bots). */
const AI = {
  run(w, f, dt) {
    const a = f.ai;
    if (a.type === 'bot') this.bot(w, f, a, dt);
    else if (a.type === 'npc') this.npc(w, f, a, dt);
    else if (a.type === 'boss') this.boss(w, f, a, dt);
    else if (a.type === 'lobby') this.lobby(w, f, a, dt);
  },
  moveTo(f, x, y, k = 1) {
    const dx = x - f.x, dy = y - f.y, d = Math.hypot(dx, dy);
    if (d < 4) { f.mx = 0; f.my = 0; return d; }
    f.mx = dx / d * k; f.my = dy / d * k; return d;
  },
  valid(w, f, e) { return e && !e.dead && !e.gone && e.world === w && w.hostile(f, e); },

  /* ---------- PNJ des camps et gardes de donjon ---------- */
  npc(w, f, a, dt) {
    a.t -= dt;
    let tg = a.target;
    if (a.t <= 0) {
      a.t = 0.25;
      const hd = dist(f.x, f.y, a.home.x, a.home.y);
      if (!this.valid(w, f, tg) || dist(tg.x, tg.y, a.home.x, a.home.y) > a.leash + 150) tg = null;
      if (!tg && this.valid(w, f, f.lastHitBy) && G.time - f.lastHitT < 4) tg = f.lastHitBy;
      if (!tg) {
        let bd = a.aggro * a.aggro;
        for (const e of w.fighters) {
          if (e.faction !== 'p' || e.dead || e.gliding) continue;
          const d = dist2(f.x, f.y, e.x, e.y); if (d < bd) { bd = d; tg = e; }
        }
      }
      if (hd > a.leash) { tg = null; a.ret = true; }
      a.target = tg;
    }
    if (a.ret) {
      if (this.moveTo(f, a.home.x, a.home.y, 1) < 40) a.ret = false;
      f.hp = Math.min(f.maxHp, f.hp + f.maxHp * 0.4 * dt);
      return;
    }
    if (tg && !tg.dead) {
      const dx = tg.x - f.x, dy = tg.y - f.y, d = Math.hypot(dx, dy) || 1, ang = Math.atan2(dy, dx), p = f.pow;
      if (a.ranged) {
        const k = d > 330 ? 1 : d < 190 ? -0.8 : 0;
        a.st = a.st || (Math.random() < 0.5 ? 1 : -1);
        if ((a.sT = (a.sT || 0) - dt) <= 0) { a.sT = rnd(1, 2.5); a.st = -a.st; }
        f.mx = Math.cos(ang) * k - Math.sin(ang) * a.st * 0.45; f.my = Math.sin(ang) * k + Math.cos(ang) * a.st * 0.45;
      } else if (d > p.range * 0.75 + tg.r) { f.mx = dx / d; f.my = dy / d; } else { f.mx = 0; f.my = 0; }
      if (f.cd <= 0 && !f.cast && d < (a.ranged ? p.range * 0.9 : p.range + tg.r)) w.attack(f, ang);
    } else {
      // Ronde tranquille autour du camp
      if ((a.wt -= dt) <= 0) { a.wt = rnd(2, 5); const an = rnd(TAU), r = rnd(90); a.wx = a.home.x + Math.cos(an) * r; a.wy = a.home.y + Math.sin(an) * r; }
      this.moveTo(f, a.wx, a.wy, 0.35);
    }
  },

  /* ---------- Boss (mondial et de donjon) ---------- */
  boss(w, f, a, dt) {
    a.t -= dt;
    let tg = a.target;
    if (a.t <= 0) {
      a.t = 0.35;
      if (!this.valid(w, f, tg) || dist(tg.x, tg.y, f.x, f.y) > a.leash) tg = null;
      let bd = a.aggro * a.aggro;
      if (tg) bd = dist2(f.x, f.y, tg.x, tg.y) * 0.6;
      for (const e of w.fighters) {
        if (e.faction !== 'p' || e.dead) continue;
        const d = dist2(f.x, f.y, e.x, e.y); if (d < bd) { bd = d; tg = e; }
      }
      a.target = tg;
    }
    if (f.hp < f.maxHp * 0.3 && f.cd > 0) f.cd -= dt * 0.45;
    if (!tg || tg.dead) {
      if (this.moveTo(f, a.home.x, a.home.y, 0.6) < 30) { f.mx = 0; f.my = 0; }
      return;
    }
    const dx = tg.x - f.x, dy = tg.y - f.y, d = Math.hypot(dx, dy) || 1, ang = Math.atan2(dy, dx);
    if (dist(f.x, f.y, a.home.x, a.home.y) > a.leash * 0.8) this.moveTo(f, a.home.x, a.home.y, 0.8);
    else if (d > 240) { f.mx = dx / d * 0.8; f.my = dy / d * 0.8; } else { f.mx = 0; f.my = 0; }
    if (f.cd <= 0 && !f.cast) {
      let p = f.pows[a.seq++ % f.pows.length];
      if (p.shape === 'nova' && d > p.range + 60) p = f.pows[0];
      f.pow = p; f._pk = null;
      w.attack(f, ang);
    }
  },

  /* ---------- Bots présents au lobby ---------- */
  lobby(w, f, a, dt) {
    if ((a.wt -= dt) <= 0 || !a.dst) {
      a.wt = rnd(3, 7);
      const p = pick(w.pois);
      a.dst = { x: p.x + rnd(-70, 70), y: p.y + (p.r || 60) + rnd(20, 90) };
    }
    if (a.leave) a.dst = { x: w.portal.x, y: w.portal.y + 30 };
    this.moveTo(f, a.dst.x, a.dst.y, 0.7);
  },

  /* ---------- Bots : joueurs simulés ---------- */
  bot(w, f, a, dt) {
    a.t -= dt; a.strafeT -= dt; a.goalT -= dt; if (a.react > 0) a.react -= dt;
    if (a.t <= 0) { a.t = 0.16 + Math.random() * 0.12; this.think(w, f, a); }
    // Détection de blocage contre un obstacle
    a.stuckT += dt;
    if (a.stuckT > 0.9) {
      if (dist2(f.x, f.y, a.sx, a.sy) < 22 * 22 && (f.mx || f.my) && a.state !== 'fight') { a.detour = Math.random() < 0.5 ? 1 : -1; a.detourT = 0.9; }
      a.stuckT = 0; a.sx = f.x; a.sy = f.y;
    }
    const tg = a.target;
    switch (a.state) {
      case 'fight': case 'flee': {
        if (!this.valid(w, f, tg)) { a.state = 'roam'; a.target = null; f.mx = f.my = 0; break; }
        const dx = tg.x - f.x, dy = tg.y - f.y, d = Math.hypot(dx, dy) || 1, ang = Math.atan2(dy, dx), p = powOf(f);
        if (a.strafeT <= 0) { a.strafeT = rnd(0.7, 2.2); a.strafe = -a.strafe; }
        let rad;
        if (a.state === 'flee') rad = -1;
        else {
          const want = p.shape === 'nova' ? p.range * 0.72 : p.shape === 'beam' ? p.range * 0.5 : Math.min(p.range * 0.5, 300);
          rad = d > want + 40 ? 1 : d < want - 70 ? -0.75 : 0;
        }
        const st = a.state === 'flee' ? 0.25 : 0.75;
        f.mx = Math.cos(ang) * rad - Math.sin(ang) * a.strafe * st; f.my = Math.sin(ang) * rad + Math.cos(ang) * a.strafe * st;
        // Visée avec anticipation et erreur selon l'habileté
        const tt = p.speed ? d / p.speed : 0.1, ts = tg.moving ? speedOf(tg) : 0;
        const ax = tg.x + tg.mx * ts * tt * a.lead - f.x, ay = tg.y + tg.my * ts * tt * a.lead - f.y;
        const aim = Math.atan2(ay, ax) + a.err;
        if (f.cast || f.beam) f.aim += angDiff(f.aim, aim) * Math.min(1, dt * (3 + a.skill * 9));
        else if (f.cd <= 0 && a.react <= 0 && tg.shield <= 0 && d < (p.shape === 'nova' ? p.range * 0.9 + tg.r : p.range * 0.95)) {
          a.err = (Math.random() - Math.random()) * (1 - a.skill) * 0.3;
          if (w.attack(f, aim + a.err)) a.react = 0.1 + (1 - a.skill) * CFG.bot.reactK;
        }
        if (a.state === 'flee' && d < 260 && f.dodgeCd <= 0) w.dodge(f, -dx, -dy);
        this.botDodge(w, f, a);
        f.mounted = false;
        break;
      }
      case 'loot': {
        const c = a.loot;
        if (!c || c.life <= 0 || w.crystals.indexOf(c) < 0) { a.state = 'roam'; a.loot = null; a.t = 0; break; }
        this.steer(f, a, c.x, c.y, dt);
        break;
      }
      case 'follow': {
        const L = a.leader;
        if (!L || L.dead || L.world !== w) { a.state = 'roam'; break; }
        const d = dist(f.x, f.y, L.x, L.y);
        if (d > 150) { this.steer(f, a, L.x + a.offx, L.y + a.offy, dt); this.ride(f, d); } else { f.mx = f.my = 0; f.mounted = false; }
        break;
      }
      default: this.roam(w, f, a, dt);
    }
    // Sortir d'une zone d'attaque annoncée au sol
    if (a.skill > 0.25) this.escape(w, f);
  },
  escape(w, f) {
    let ex = 0, ey = 0;
    for (const e of w.fighters) {
      const c = e.cast;
      if (!c || c.p.shape !== 'nova' || e === f || !w.hostile(e, f)) continue;
      const dx = f.x - e.x, dy = f.y - e.y, d = Math.hypot(dx, dy) || 1;
      if (d < c.p.range + f.r + 30) { ex += dx / d; ey += dy / d; }
    }
    for (const z of w.aoes) {
      if (!w.hostile(z.src, f)) continue;
      const dx = f.x - z.x, dy = f.y - z.y, d = Math.hypot(dx, dy) || 1;
      if (d < z.r + f.r + 24) { ex += dx / d; ey += dy / d; }
    }
    if (ex || ey) { const l = Math.hypot(ex, ey) || 1; f.mx = ex / l; f.my = ey / l; }
  },
  steer(f, a, x, y, dt) {
    const d = this.moveTo(f, x, y, 1);
    if (a.detourT > 0) { a.detourT -= dt; const mx = f.mx, my = f.my; f.mx = mx * 0.3 - my * a.detour; f.my = my * 0.3 + mx * a.detour; }
    return d;
  },
  ride(f, d) {
    if (f.combatT > 0) { f.mounted = false; return; }
    if (f.glider && !f.gliding && d > 1800 && f.gauge >= CFG.glider.gauge) f.gliding = true;
    else if (f.mount && !f.mounted && !f.gliding && d > 700) f.mounted = true;
    if (d < 250) { f.mounted = false; f.gliding = false; }
  },
  think(w, f, a) {
    const leader = a.leader && !a.leader.dead && a.leader.world === w ? a.leader : null;
    const sight = CFG.bot.sight, inDun = w.type !== 'map';
    let tg = null, best = sight;
    for (const e of w.fighters) {
      if (e.dead || e.sleep || e.kind === 'dummy' || !w.hostile(f, e)) continue;
      const d = dist(f.x, f.y, e.x, e.y); if (d > sight) continue;
      const riposte = e === f.lastHitBy && G.time - f.lastHitT < 5;
      let sc = d;
      if (riposte) sc -= 320;
      if (e.faction === 'n') { if (e.boss) sc -= 80; else if (!inDun && !a.farm && e.ai.target !== f && !riposte) sc += 450; else sc += 60; }
      else {
        if (a.peace && !riposte) continue;
        if (e.kind === 'player' && a.truceT > G.time && !riposte) continue;   // trêve après un donjon fait ensemble
        if (e.shield > 0) sc += 500;
        if (e.gliding) sc += 300;
        if (e.hp < 35) sc -= 80;
        if (Sys.bounty === e) sc -= 120;
        if (e.kind === 'player') sc += a.shy;
      }
      if (leader && !inDun) {
        const rel = riposte || ((e.foe === leader || leader.foe === e || e.foe === f) && G.time - Math.max(e.foeT, leader.foeT) < 7);
        if (!rel) sc += 700;
      }
      if (sc < best) { best = sc; tg = e; }
    }
    a.target = tg;
    if (tg) {
      const hr = f.hp / f.maxHp;
      a.state = (!leader && !inDun && !a.brave && hr < a.fleeAt && tg.hp / tg.maxHp > hr * 0.9 && !tg.boss) ? 'flee' : 'fight';
      return;
    }
    if (leader) { a.state = 'follow'; return; }
    if (w.crystals.length && !inDun) {
      let c = null, bd = 400 * 400;
      for (const k of w.crystals) { const d = dist2(f.x, f.y, k.x, k.y); if (d < bd) { bd = d; c = k; } }
      if (c) { a.state = 'loot'; a.loot = c; return; }
    }
    a.state = 'roam';
  },
  botDodge(w, f, a) {
    if (f.dodgeCd > 0) return;
    for (const s of w.shots) {
      if (s.tried && s.tried[f.id]) continue;
      if (!w.hostile(s.src, f)) continue;
      const rx = f.x - s.x, ry = f.y - s.y, v2 = s.vx * s.vx + s.vy * s.vy, t = (rx * s.vx + ry * s.vy) / v2;
      if (t < 0 || t > 0.36) continue;
      const cx = rx - s.vx * t, cy = ry - s.vy * t, rr = f.r + s.r + 8;
      if (cx * cx + cy * cy > rr * rr) continue;
      (s.tried = s.tried || {})[f.id] = 1;
      if (Math.random() < a.dodgeP) { const side = (rx * s.vy - ry * s.vx) > 0 ? -1 : 1; w.dodge(f, -s.vy * side, s.vx * side); return; }
    }
    for (const e of w.fighters) {
      const c = e.cast;
      if (!c || c.p.shape !== 'nova' || c.tried === f.id || !w.hostile(e, f)) continue;
      if (c.dur - c.t < 0.4 && dist2(e.x, e.y, f.x, f.y) < (c.p.range + f.r) * (c.p.range + f.r)) {
        c.tried = f.id;
        if (Math.random() < a.dodgeP + 0.15) { w.dodge(f, f.x - e.x, f.y - e.y); return; }
      }
    }
    for (const z of w.aoes) {
      if (z.tried === f.id || z.delay - z.t > 0.45 || !w.hostile(z.src, f)) continue;
      if (dist2(z.x, z.y, f.x, f.y) < (z.r + f.r) * (z.r + f.r)) { z.tried = f.id; if (Math.random() < a.dodgeP + 0.2) { w.dodge(f, f.x - z.x, f.y - z.y); return; } }
    }
  },
  roam(w, f, a, dt) {
    if (w.type !== 'map') {
      // Arène ou donjon sans cible : avancer vers le chef ou le centre
      if (w.type === 'dungeon') { if (a.leader) this.steer(f, a, a.leader.x + a.offx, a.leader.y + a.offy, dt); else this.steer(f, a, w.w / 2, f.y - 200, dt); }
      else this.moveTo(f, w.w / 2 + Math.cos(G.time * 0.7 + f.id) * 160, w.h / 2 + Math.sin(G.time * 0.9 + f.id) * 160, 0.6);
      return;
    }
    let g = a.goal;
    if (!g || a.goalT <= 0) g = a.goal = this.pickGoal(w, f, a);
    if (g.type === 'rain' && !Sys.rain) { a.goal = null; return; }
    if (g.type === 'boss') { if (!Sys.boss || Sys.boss.dead) { a.goal = null; return; } g.x = Sys.boss.x; g.y = Sys.boss.y; }
    const d = this.steer(f, a, g.x, g.y, dt);
    this.ride(f, d);
    if (d > (g.r || 90)) return;
    f.mx = f.my = 0;
    switch (g.type) {
      case 'camp': a.farm = true; if ((g.wait = (g.wait || 0) + dt) > 9) { a.goal = null; a.farm = false; } break;
      case 'door': {
        g.wait = (g.wait || 0) + dt;
        const door = g.door;
        if (g.wait > a.patience) {
          if (f.combatT <= 0 && door.busyT <= G.time && !door.by) Sys.botEnterDungeon(f, door);
          else if (g.wait > a.patience + 12) a.goal = null;
        }
        break;
      }
      case 'portal':
        if (f.combatT > 0) { g.wait = 0; break; }
        if ((g.wait = (g.wait || 0) + dt) > CFG.map.portalChannel) Sys.botToLobby(f, true);
        break;
      case 'rain': this.moveTo(f, g.x + Math.cos(G.time + f.id) * 200, g.y + Math.sin(G.time * 1.3 + f.id) * 200, 0.8); break;
      default: a.goal = null;
    }
  },
  pickGoal(w, f, a) {
    a.goalT = 70; a.farm = false;
    const r = Math.random();
    if (Sys.rain && r < 0.6) return { type: 'rain', x: Sys.rain.x + rnd(-200, 200), y: Sys.rain.y + rnd(-200, 200), r: 260 };
    if (Sys.boss && !Sys.boss.dead && r < 0.45) return { type: 'boss', x: Sys.boss.x, y: Sys.boss.y, r: 380 };
    const next = f.level < 5 ? CFG.prices[f.level] : 1e9;
    if (a.bot.crystals >= next && r < 0.7 || r < 0.04) {
      let p = MAP.portals[0], bd = 1e18;
      for (const q of MAP.portals) { const d = dist2(f.x, f.y, q.x, q.y); if (d < bd) { bd = d; p = q; } }
      return { type: 'portal', x: p.x, y: p.y, r: 40 };
    }
    if (r < 0.2) {
      const open = MAP.doors.filter(d => dist(f.x, f.y, d.x, d.y) < 5200);
      if (open.length) { const d = pick(open); return { type: 'door', x: d.x + rnd(-50, 50), y: d.y + 110 + rnd(40), r: 70, door: d }; }
    }
    if (r < 0.42) {
      let c = pick(MAP.camps);
      for (let i = 0; i < 3; i++) { const k = pick(MAP.camps); if (dist2(f.x, f.y, k.x, k.y) < dist2(f.x, f.y, c.x, c.y)) c = k; }
      return { type: 'camp', x: c.x + rnd(-120, 120), y: c.y + rnd(-120, 120), r: 230 };
    }
    // Balade vers un autre joueur ou un point au hasard, avec un biais vers le centre
    // Chasse : rejoindre un des joueurs les plus proches
    const others = w.fighters.filter(e => e.faction === 'p' && e !== f && !e.dead && !(f.alliance && e.alliance === f.alliance));
    if (others.length && Math.random() < CFG.bot.hunt * (CFG.bot.huntK[S.settings.bots] || 1) && !a.peace) {
      others.sort((p, q) => dist2(f.x, f.y, p.x, p.y) - dist2(f.x, f.y, q.x, q.y));
      const o = others[Math.floor(Math.random() * Math.min(3, others.length))];
      return { type: 'wander', x: o.x + rnd(-200, 200), y: o.y + rnd(-200, 200), r: 220 };
    }
    const an = rnd(TAU), dd = Math.sqrt(Math.random()) * (MAP.R - 900);
    return { type: 'wander', x: MAP.cx + Math.cos(an) * dd, y: MAP.cy + Math.sin(an) * dd, r: 160 };
  }
};

/* ==== 08-systems.js ==== */
/* Règles du jeu : serveur simulé, cristaux, alliances, primes, pluie de cristaux, boss mondial,
   quêtes, classements, événements tournants, succès, boutique. */
const UIH = { toast() {}, announce() {}, feed() {}, death() {}, allyAsk() {}, changed() {}, loot() {}, scene() {}, login() {}, levelIntro() {}, levelEnd() {} };

/* Événements tournants : aucun lien avec une date réelle, ils s'enchaînent pendant la partie. */
const Events = {
  cur: null, next: null, nextT: 0, order: [], none: {},
  reset() { this.cur = null; this.order = []; this.nextT = CFG.events.first; this.next = this.draw(); },
  draw() {
    if (!this.order.length) this.order = CFG.events.list.slice().sort(() => Math.random() - 0.5);
    return this.order.pop();
  },
  fx() { return this.cur ? this.cur.def.fx : this.none; },
  update(dt) {
    if (this.cur && (this.cur.t -= dt) <= 0) { UIH.feed(traduire('ev.fini', { nom: this.cur.def.name }), 'sys'); this.cur = null; UIH.changed(); }
    if ((this.nextT -= dt) <= 0) {
      this.cur = { def: this.next, t: CFG.events.dur }; this.next = this.draw(); this.nextT = CFG.events.every;
      UIH.announce(traduire('ev.debut', { nom: this.cur.def.name }), this.cur.def.text); Sfx.play('alert', 0.7); UIH.changed();
    }
  },
  label() { return this.cur ? traduire('ev.encours', { nom: this.cur.def.name, duree: fmtDur(this.cur.t) }) : this.next ? traduire('ev.prochain', { nom: this.next.name, duree: fmtDur(this.nextT) }) : ''; }
};

const Sys = {
  queue: [], online: [], tracks: {}, locks: {}, lbLog: {}, alliances: {}, nextAl: 1,
  rain: null, rainT: 0, boss: null, bossT: 0, bossWarned: false, bounty: null, slowT: 0, rollT: 0, scatterT: 0, churnT: 0, askT: 0,
  pending: [], loginReward: null,

  /* ---------- Démarrage ---------- */
  init() { Save.load(); this.rollWeek(); this.offline(); this.rollDay(); },
  rollWeek() {
    const wk = weekId();
    if (S.week.id === wk) return;
    const gap = wk - S.week.id;
    const holders = {};
    if (gap > 0 && gap < 8.5 * 86400000) for (const b of LB_BOARDS) holders[b.id] = this.board(b.id, 'week').slice(0, 3).filter(e => e.v > 0).map(e => e.name);
    S.crowns = { week: wk, holders };
    S.week = { id: wk, kills: 0, streak: 0, dungeons: 0, crystals: 0 };
    for (const b of S.bots) b.week = { kills: 0, streak: 0, dungeons: 0, crystals: 0 };
  },
  offline() {
    const h = clamp((realNow() - S.lastSeen) / 3.6e6, 0, 168);
    if (h < 0.05) return;
    for (const b of S.bots) {
      const k = Math.round(h * b.act * 1.1 * rnd(0.5, 1.5)), d = Math.round(h * b.act * 0.12 * rnd(0.3, 1.7)), c = k * 4 + d * 90 + Math.round(h * b.act * 20);
      b.week.kills += k; b.total.kills += k; b.week.dungeons += d; b.total.dungeons += d; b.week.crystals += c; b.total.crystals += c;
      if (k > 3) { b.week.streak = Math.max(b.week.streak, rndi(2, 3 + Math.floor(b.skill * 7))); b.total.streak = Math.max(b.total.streak, b.week.streak); }
    }
  },
  rollDay() {
    const d = dayId();
    if (S.quests.day !== d) {
      const r = mulberry(d * 7 + 3); let pool = QUESTS.slice(); const list = [];
      for (let i = 0; i < CFG.quests.perDay && pool.length; i++) {
        const q = pool[Math.floor(r() * pool.length)];
        list.push({ id: q.id, p: 0, done: false, claimed: false });
        pool = pool.filter(x => x.type !== q.type);
      }
      S.quests = { day: d, list };
    }
    if (S.login.day !== d) {
      S.login.streak = S.login.day === dayId(realNow() - 86400000) ? S.login.streak + 1 : 1;
      S.login.day = d;
      const reward = CFG.login.base + CFG.login.perDay * Math.min(S.login.streak, CFG.login.maxDays);
      S.crystals += reward; this.loginReward = { reward, streak: S.login.streak };
    }
  },
  hasCrown(name) {
    if (!S.crowns || S.crowns.week !== weekId()) return false;
    for (const k in S.crowns.holders) if (S.crowns.holders[k].indexOf(name) >= 0) return true;
    return false;
  },
  startServer() {
    G.time = 0; this.queue = []; this.online = []; this.tracks = {}; this.locks = {}; this.lbLog = {}; this.alliances = {}; this.pending = [];
    this.rain = null; this.boss = null; this.bounty = null;
    G.map = buildMap(); G.lobby = buildLobby(); G.inst = null;
    G.map.onKill = (v, k) => this.mapKill(v, k);
    G.map.onPickup = (f, c) => this.pickup(f, c);
    G.map.onDamage = (s, t) => { if (t.boss && s === G.player) t.ai.byPlayer = true; };
    const pool = S.bots.slice().sort(() => Math.random() - 0.5);
    for (let i = 0; i < CFG.server.players - 1; i++) this.join(pool[i], i < 16 ? 'map' : 'lobby');
    const mb = this.online.filter(e => e.where === 'map').map(e => e.f);
    this.ally(mb[0], mb[1]); this.ally(mb[2], mb[3]); this.ally(mb[4], mb[5]); this.ally(mb[4], mb[6]);
    this.rainT = CFG.hot.rainFirst; this.bossT = CFG.hot.bossFirst; this.bossWarned = false; Events.reset(); this.achT = 3;
    this.churnT = rnd(CFG.server.churnMin, CFG.server.churnMax); this.askT = rnd(70, 130);
    for (let i = 0; i < CFG.hot.scatter; i++) this.scatterOne();
  },

  /* ---------- Joueur ---------- */
  makePlayer() {
    const f = new Fighter({ kind: 'player', name: traduire('moi') });
    G.player = f; this.applyLoadout(); return f;
  },
  applyLoadout() {
    const f = G.player; if (!f) return;
    f.name = traduire('moi'); f.el = S.equip.el || 'feu'; f.tier = S.equip.tier || 1; f.level = playerLevel(); f.upg = S.upg[f.el].slice(); f._pk = null;
    f.aura = S.aura; f.auraLvl = S.aura ? (S.auras[S.aura] || 0) : 0;
    f.pet = S.pet; f.trail = S.trail; f.mount = S.mount; f.glider = S.glider; f.crown = this.hasCrown(ME);
    if (!f.mount) f.mounted = false; if (!f.glider) f.gliding = false;
  },
  reset(f) {
    f.hp = f.maxHp; f.dead = false; f.gone = false; f.cast = null; f.beam = null; f.cd = 0; f.dodgeT = 0; f.invuln = 0; f.shield = 0;
    f.burnT = 0; f.slowT = 0; f.stunT = 0; f.airT = 0; f.ccImm = 0; f.kx = 0; f.ky = 0; f.mx = 0; f.my = 0; f.combatT = 0;
    f.lastHitBy = null; f.mounted = false; f.gliding = false; f.channel = 0; f.gauge = CFG.glider.gauge; f.petInit = false; f.foe = null;
  },
  move(f, w, x, y) {
    if (f.world && f.world !== w) f.world.remove(f);
    this.reset(f); f.x = x; f.y = y; w.add(f);
  },
  view(w, scene) { G.view = w; G.scene = scene; G.cam.x = G.player.x; G.cam.y = G.player.y; UIH.scene(scene); },
  toLobby(silent) {
    const p = G.player, L = G.lobby;
    if (Dungeon.cur) Dungeon.release();
    Arena.cur = null; Camp.quit();
    this.move(p, L, L.spawn.x + rnd(-40, 40), L.spawn.y + rnd(-20, 20));
    G.inst = null; p.streak = 0; this.view(L, 'lobby'); Save.write();
    if (!silent) Sfx.play('portal', 0.6);
  },
  toMap() {
    const p = G.player, s = findSpawn(G.map);
    this.move(p, G.map, s.x, s.y); p.shield = CFG.spawn.shield; p.face = Math.atan2(MAP.cy - s.y, MAP.cx - s.x);
    this.view(G.map, 'map'); Sfx.play('portal', 0.7);
    UIH.toast(traduire('carte.bouclier', { n: CFG.spawn.shield }));
  },
  earn(n, lb = true) { S.crystals += n; if (lb) { S.total.crystals += n; S.week.crystals += n; } UIH.changed(); },
  playerDied(k) {
    S.deaths++; G.player.streak = 0;
    FX.sound(G.view, 'death', G.player.x, G.player.y);
    UIH.death(k ? k.name : null);
    const w = G.player.world;
    setTimeout(() => { if (G.player.dead && G.player.world === w) this.toLobby(true); }, 1900);
  },
  outOfBounds(f) {
    if (f.dead || f.gone) return;
    const k = f.combatT > 0 && f.lastHitBy && G.time - f.lastHitT < CFG.combat.credit ? f.lastHitBy : null;
    if (f.combatT > 0) { G.map.kill(f, k); return; }
    if (f === G.player) { UIH.toast(traduire('carte.hors')); this.queue.push(() => this.toLobby()); }
    else if (f.entry) this.botToLobby(f);
  },
  /* Portails et portes de donjon : rester dedans quelques secondes, hors combat pour le portail. */
  playerTick(dt) {
    const p = G.player; this.near = null;
    if (G.scene !== 'map' || p.dead) return;
    for (const q of MAP.portals) if (dist2(p.x, p.y, q.x, q.y) < 70 * 70) { this.near = { kind: 'portal', q, max: CFG.map.portalChannel, blocked: p.combatT > 0 ? traduire('portail.combat') : null }; break; }
    if (!this.near) for (const d of MAP.doors) if (dist2(p.x, p.y, d.x, d.y + 70) < 80 * 80) {
      const blocked = d.by ? traduire('porte.occupe', { nom: d.by.name }) : d.busyT > G.time ? traduire('porte.reinit', { n: Math.ceil(d.busyT - G.time) }) : null;
      this.near = { kind: 'door', q: d, max: CFG.dungeon.channel, blocked }; break;
    }
    const n = this.near;
    if (!n || n.blocked || p.gliding) { p.channel = 0; return; }
    p.channel += dt;
    if (p.channel >= n.max) {
      p.channel = 0;
      if (n.kind === 'portal') { this.quest('portal', 1); this.queue.push(() => this.toLobby()); }
      else this.queue.push(() => Dungeon.enter(n.q));
    }
  },

  /* ---------- Bots ---------- */
  makeBot(rb) {
    const pl = playerLevel(), lo = Math.max(1, pl - 1), hi = Math.min(5, pl + 1);
    if (!(rb.level >= lo && rb.level <= hi)) { const r = Math.random(); rb.level = clamp(r < 0.3 ? pl - 1 : r < 0.75 ? pl : pl + 1, lo, hi); }
    const skill = 0.3, lv = rb.level;
    const f = new Fighter({ kind: 'bot', name: rb.name, el: rb.el, level: lv, tier: Math.random() < 0.45 ? rndi(1, lv) : lv, upg: [rndi(0, Math.min(3, lv - 1)), rndi(0, Math.min(3, lv - 1)), 0], crown: this.hasCrown(rb.name) });
    f.botAi = {
      type: 'bot', bot: rb, skill, state: 'roam', t: rnd(0.3), strafe: Math.random() < 0.5 ? 1 : -1, strafeT: 0, goalT: 0, goal: null, react: 0, err: 0,
      lead: 0.72 + skill * 0.28, dodgeP: 0.1 + skill * 0.6, fleeAt: rnd(0.12, 0.3), brave: Math.random() < 0.5, peace: Math.random() < 0.12, shy: Math.max(0, 4 - pl) * 80,
      patience: rnd(4, 12), stuckT: 0, sx: 0, sy: 0, detour: 1, detourT: 0, offx: rnd(-90, 90), offy: rnd(-90, 90), leader: null, target: null, loot: null, farm: false
    };
    f.ai = f.botAi; this.tuneBot(f);
    if (Math.random() < 0.15 + lv * 0.1) { f.aura = pick(AURAS).id; f.auraLvl = rndi(1, Math.min(3, lv)); }
    if (Math.random() < 0.4) f.pet = pick(ITEMS.filter(i => i.type === 'pet' && i.rar <= Math.max(1, lv - 1))).id;
    if (Math.random() < 0.45) f.trail = pick(ITEMS.filter(i => i.type === 'trail')).id;
    if (lv >= 2 && Math.random() < 0.12 * lv) f.mount = pick(ITEMS.filter(i => i.type === 'mount')).id;
    if (lv >= 4 && Math.random() < 0.06) f.glider = 'g_cosmique';
    return f;
  },
  /* Habileté d'un bot : suit le niveau du joueur et le réglage « Force des bots ». Jamais trop forts. */
  tuneBot(f) {
    const a = f.botAi, B = CFG.bot, pl = playerLevel(), k = S.settings.bots;
    const skill = clamp(a.bot.skill * (B.skillBase + pl * B.skillPerLevel) * (B.strength[k] || 1), 0.08, 0.92);
    a.skill = skill; a.lead = 0.72 + skill * 0.28; a.dodgeP = 0.1 + skill * 0.6;
    a.shy = Math.max(0, Math.max(B.shyMin, (4 - pl) * 80) + (B.shyAdd[k] || 0));
  },
  retune() { for (const e of this.online) this.tuneBot(e.f); },
  join(rb, where) {
    const f = this.makeBot(rb), e = { rb, f, where, t: 0, door: null, leaving: false };
    f.entry = e; this.online.push(e);
    if (where === 'map') this.botToMap(e); else this.botInLobby(e, rnd(3, 10));
    return e;
  },
  botToMap(e) {
    const f = e.f, a = f.botAi, s = findSpawn(G.map);
    f.ai = a; a.state = 'roam'; a.goal = null; a.target = null; a.loot = null; a.leader = this.leaderOf(f);
    e.where = 'map'; this.move(f, G.map, s.x, s.y); f.shield = CFG.spawn.shield;
  },
  botInLobby(e, t) {
    const f = e.f, L = G.lobby;
    e.where = 'lobby'; e.t = t; f.ai = { type: 'lobby', wt: 0, dst: null, leave: false };
    this.move(f, L, L.spawn.x + rnd(-80, 80), L.spawn.y + rnd(-30, 40));
  },
  botToLobby(f) {
    const e = f.entry; if (!e || e.moving) return;
    e.moving = true;
    this.queue.push(() => {
      e.moving = false;
      const rb = e.rb, cap = Math.min(5, playerLevel() + 1);
      // Le niveau du serveur suit celui du joueur
      if (rb.level < playerLevel() - 1) rb.level = playerLevel() - 1;
      while (rb.level < cap && rb.crystals >= CFG.prices[rb.level]) { rb.crystals -= CFG.prices[rb.level]; rb.level++; }
      f.level = rb.level; f.tier = Math.random() < 0.45 ? rndi(1, rb.level) : rb.level; f._pk = null; f.streak = 0; this.tuneBot(f);
      if (e.leaving) { this.leave(e); return; }
      this.botInLobby(e, rnd(CFG.bot.lobbyMin, CFG.bot.lobbyMax));
    });
  },
  botEnterDungeon(f, door) {
    const e = f.entry; if (!e || e.moving) return;
    e.moving = true; door.by = f; door.busyT = G.time + 9999;
    this.queue.push(() => {
      e.moving = false; G.map.remove(f); e.where = 'dungeon'; e.door = door; e.t = rnd(CFG.bot.dungeonMin, CFG.bot.dungeonMax);
    });
  },
  botLeaveDungeon(e) {
    const f = e.f, door = e.door, rb = e.rb, D = CFG.dungeon.diff[door.def.diff];
    door.by = null; door.busyT = G.time + CFG.dungeon.reset; e.door = null;
    if (Math.random() < 0.55 + rb.skill * 0.35 - door.def.diff * 0.12) {
      const c = rndi(D.crystals[0], D.crystals[1]);
      rb.crystals += c; rb.total.crystals += c; rb.week.crystals += c; rb.total.dungeons++; rb.week.dungeons++;
      e.where = 'map'; f.ai = f.botAi; f.botAi.state = 'roam'; f.botAi.goal = null;
      this.move(f, G.map, door.x + rnd(-40, 40), door.y + 120); f.shield = CFG.dungeon.exitShield;
    } else this.botInLobby(e, rnd(CFG.bot.lobbyMin, CFG.bot.lobbyMax));
  },
  leave(e) {
    const i = this.online.indexOf(e); if (i >= 0) this.online.splice(i, 1);
    this.unally(e.f); if (e.f.world) e.f.world.remove(e.f);
    if (e.door) { e.door.by = null; e.door.busyT = G.time + CFG.dungeon.reset; }
    UIH.feed(traduire('serveur.quitte', { nom: e.rb.name }), 'sys');
    const off = S.bots.filter(b => !this.online.some(o => o.rb === b));
    if (off.length) { const rb = pick(off); this.join(rb, 'lobby'); UIH.feed(traduire('serveur.rejoint', { nom: rb.name }), 'sys'); }
  },
  churn() {
    const pa = G.player ? G.player.alliance : 0;
    const c = this.online.filter(e => !pa || e.f.alliance !== pa);
    if (!c.length) return;
    const e = pick(c), f = e.f;
    if (e.where === 'map' && f.combatT > 0 && !f.dead) {
      // Déconnexion en combat : elle compte comme une mort, les cristaux apparaissent sur place.
      e.leaving = true;
      G.map.kill(f, f.lastHitBy && G.time - f.lastHitT < CFG.combat.credit ? f.lastHitBy : null);
    } else if (e.where !== 'dungeon' && !e.moving) this.queue.push(() => this.leave(e));
  },

  /* ---------- Éliminations et cristaux ---------- */
  mapKill(v, k) {
    const w = G.map;
    if (v.kind === 'npc') {
      w.dropCrystals(v.x, v.y, v.crystals * (Events.fx().npc || 1), { spread: 110 });
      v.gone = true; if (v.camp) v.camp.respawn.push({ t: G.time + CFG.npc.respawn, npc: v });
      if (k === G.player) { S.npcKills++; this.quest('npc', 1); }
      return;
    }
    if (v.kind === 'boss') {
      w.dropCrystals(v.x, v.y, v.crystals, { spread: 420, life: 90 });
      v.gone = true; this.boss = null; this.bossT = CFG.hot.bossEvery; this.bossWarned = false;
      UIH.announce(traduire('mboss.vaincu'), traduire('mboss.vaincu.text', { nom: v.name }));
      if (v.ai.byPlayer) { S.bossKills++; this.quest('boss', 1); }
      return;
    }
    const killer = k && k.faction === 'p' ? k : null;
    let n = 0, primed = false;
    if (killer) {
      n = CFG.combat.perKill;
      primed = this.bounty === v;
      if (primed) n += Math.min(CFG.bounty.max, v.streak * CFG.bounty.perStreak);
      if (killer.level - v.level >= CFG.weakVictim.levelGap) n = Math.min(n, CFG.weakVictim.crystals);
      // Anti-abus : à partir de la 7e élimination de suite sur le même joueur, plus de cristaux pendant 5 minutes.
      const key = killer.name + '>' + v.name, tr = this.tracks[killer.name] || (this.tracks[killer.name] = { last: null, n: 0 });
      if (this.locks[key] && this.locks[key] <= G.time) { delete this.locks[key]; tr.n = 0; }
      if (tr.last === v.name) tr.n++; else { tr.last = v.name; tr.n = 1; }
      if (tr.n >= CFG.antiAbuse.sameVictim && !this.locks[key]) this.locks[key] = G.time + CFG.antiAbuse.lockSec;
      if (this.locks[key]) { n = 0; if (killer === G.player) UIH.toast(traduire('abus.meme', { nom: v.name })); }
      killer.streak++;
      this.countKill(killer, v, primed);
    }
    if (n > 0) w.dropCrystals(v.x, v.y, n);
    UIH.feed((killer === G.player ? traduire('feed.moi', { b: v.name }) : v === G.player ? traduire(k ? 'feed.toi' : 'feed.carteToi', { a: k ? k.name : '' }) : traduire(k ? 'feed.ko' : 'feed.carte', { a: k ? k.name : '', b: v.name })) + (primed ? ' ' + traduire('feed.prime') : ''), killer === G.player ? 'me' : v === G.player ? 'bad' : '');
    v.streak = 0;
    if (this.bounty === v) this.bounty = null;
    if (v === G.player) this.playerDied(k); else if (v.entry) this.botToLobby(v);
  },
  /* Règles de classement : même victime 10 fois par heure au plus, victime inactive non comptée. */
  countKill(killer, v, primed) {
    const key = killer.name + '>' + v.name, log = this.lbLog[key] || (this.lbLog[key] = []);
    while (log.length && G.time - log[0] > 3600) log.shift();
    const counted = G.time - v.activeT <= CFG.antiAbuse.lbInactive && log.length < CFG.antiAbuse.lbPerHour;
    if (counted) log.push(G.time);
    if (killer === G.player) {
      if (counted) {
        S.total.kills++; S.week.kills++; S.total.streak = Math.max(S.total.streak, killer.streak); S.week.streak = Math.max(S.week.streak, killer.streak);
        // Alerte d'éliminations arrangées : plus de la moitié sur la même victime, qui ne riposte presque jamais,
        // alors que d'autres joueurs sont présents. Deux joueurs qui se battent vraiment ne sont pas concernés.
        const C = CFG.collusion, wk = S.week, vk = wk.vk || (wk.vk = {}), e = vk[v.name] || (vk[v.name] = [0, 0]);
        e[0]++; if (!(v.foe === killer && G.time - v.foeT < 20)) e[1]++;
        if (!wk.flag && wk.kills >= C.minKills && e[0] > wk.kills * C.share && e[1] > e[0] * C.passive && G.map.fighters.filter(f => f.faction === 'p' && !f.dead).length >= 4) {
          wk.flag = true; UIH.toast(traduire('abus.passif'));
        }
      }
      this.quest('kill', 1); this.quest('streak', killer.streak, true); if (primed) this.quest('bounty', 1);
      Sfx.play('kill'); UIH.toast(killer.streak > 1 ? traduire('ko.serie', { nom: v.name, n: killer.streak }) : traduire('feed.moi', { b: v.name }), 'good');
    } else if (killer.entry && counted) {
      const rb = killer.entry.rb;
      rb.total.kills++; rb.week.kills++; rb.week.streak = Math.max(rb.week.streak, killer.streak); rb.total.streak = Math.max(rb.total.streak, killer.streak);
    }
  },
  pickup(f, c) {
    if (f === G.player) {
      this.earn(c.val); FX.sound(G.view, 'crystal', f.x, f.y); FX.text(G.view, f.x, f.y - 34, '+' + c.val, '#7df9ff', 14);
      this.quest('crystal', c.val); if (c.rain) this.quest('rain', c.val);
    } else if (f.entry) { const rb = f.entry.rb; rb.crystals += c.val; rb.total.crystals += c.val; rb.week.crystals += c.val; }
  },
  scatterOne() {
    const a = rnd(TAU), d = Math.sqrt(Math.random()) * (MAP.R - 400), x = MAP.cx + Math.cos(a) * d, y = MAP.cy + Math.sin(a) * d;
    if (G.map.blocked(x, y, 20)) return;
    G.map.crystals.push({ x, y, vx: 0, vy: 0, life: 400, val: 1, rain: false, age: 1, sc: true });
  },

  /* ---------- Alliances (3 joueurs au maximum, pas de dégâts entre alliés) ---------- */
  allies(f) { return f.alliance ? (this.alliances[f.alliance] || []).filter(x => x !== f) : []; },
  leaderOf(f) { const m = this.alliances[f.alliance]; if (!m || m[0] === f) return null; return m.indexOf(G.player) >= 0 ? G.player : m[0]; },
  ally(a, b) {
    if (!a || !b || a === b) return false;
    const ma = this.alliances[a.alliance] || [a];
    if (ma.length >= 3 || ma.indexOf(b) >= 0) return false;
    this.unally(b);
    if (!a.alliance) { a.alliance = this.nextAl++; this.alliances[a.alliance] = [a]; }
    this.alliances[a.alliance].push(b); b.alliance = a.alliance;
    for (const m of this.alliances[a.alliance]) if (m.botAi) m.botAi.leader = this.leaderOf(m);
    return true;
  },
  unally(f) {
    const id = f.alliance; if (!id) return;
    const m = this.alliances[id]; f.alliance = 0; if (f.botAi) f.botAi.leader = null;
    if (!m) return;
    const i = m.indexOf(f); if (i >= 0) m.splice(i, 1);
    if (m.length < 2) { for (const x of m) { x.alliance = 0; if (x.botAi) x.botAi.leader = null; } delete this.alliances[id]; }
    else for (const x of m) if (x.botAi) x.botAi.leader = this.leaderOf(x);
  },
  requestAlly(f) {
    if (!S.allyOpen || this.allies(G.player).length >= 2 || this.pending.some(p => p.f === f)) return false;
    this.pending.push({ f, t: rnd(1.4, 3) }); return true;
  },
  answerAlly(f) {
    const p = G.player;
    const hostile = (f.lastHitBy === p && G.time - f.lastHitT < 20) || (p.lastHitBy === f && G.time - p.lastHitT < 20);
    const ok = !hostile && !f.dead && f.entry && this.allies(p).length < 2 && Math.random() < (f.alliance ? 0.4 : 0.78);
    if (ok && this.ally(p, f)) { UIH.toast(traduire('allie.accepte', { nom: f.name }), 'good'); Sfx.play('buy', 0.6); }
    else UIH.toast(traduire('allie.refuse', { nom: f.name }));
    UIH.changed();
  },
  setAllyOpen(v) {
    S.allyOpen = v;
    if (!v) { for (const a of this.allies(G.player)) this.unally(a); this.unally(G.player); }
    UIH.changed();
  },

  /* ---------- Quêtes ---------- */
  quest(type, n, abs) {
    for (const q of S.quests.list) {
      const d = QUEST[q.id]; if (!d || d.type !== type || q.done) continue;
      q.p = abs ? Math.max(q.p, n) : q.p + n;
      if (q.p >= d.n) { q.p = d.n; q.done = true; UIH.toast(traduire('quete.finie', { nom: d.text }), 'good'); Sfx.play('alert', 0.6); }
    }
  },
  claimQuest(i) {
    const q = S.quests.list[i]; if (!q || !q.done || q.claimed) return false;
    q.claimed = true; this.earn(QUEST[q.id].reward); Sfx.play('buy'); Save.write(); return true;
  },

  /* ---------- Succès ---------- */
  checkAch() {
    if (!S.el) return;
    for (const a of ACHIEVEMENTS) {
      if (S.ach[a.id] || a.v() < a.n) continue;
      S.ach[a.id] = 1; this.earn(a.reward, false);
      UIH.toast(traduire('succes.gagne', { nom: a.name, n: a.reward }), 'good'); Sfx.play('loot', 0.6);
    }
  },

  /* ---------- Classements ---------- */
  board(id, period) {
    const out = [];
    for (const b of S.bots) out.push({ name: b.name, v: b[period === 'week' ? 'week' : 'total'][id] || 0, me: false });
    if (S.el && !(period === 'week' && S.week.flag)) out.push({ name: ME, v: S[period === 'week' ? 'week' : 'total'][id] || 0, me: true });
    return out.sort((a, b) => b.v - a.v || (a.me ? -1 : 1));
  },

  /* ---------- Boucle ---------- */
  update(dt) {
    if (this.queue.length) { const q = this.queue; this.queue = []; for (const fn of q) fn(); }
    Events.update(dt);
    const fx = Events.fx();
    // Pluie de cristaux
    this.rainT -= dt;
    if (!this.rain && this.rainT <= CFG.hot.rainWarn) {
      const zi = rndi(0, 9), s = MAP.seeds[zi], a = rnd(TAU), d = rnd(150, 600);
      this.rain = { x: s.x + Math.cos(a) * d, y: s.y + Math.sin(a) * d, zone: zi, t: -CFG.hot.rainWarn, left: Math.round(CFG.hot.rainCount * (fx.rain || 1)), acc: 0 };
      this.rain.total = this.rain.left;
      UIH.announce(traduire('pluie.titre'), traduire('pluie.text', { zone: ZONES[zi].name, n: CFG.hot.rainWarn })); Sfx.play('alert', 0.7);
    }
    if (this.rain) {
      const r = this.rain; r.t += dt;
      if (r.t >= 0 && r.left > 0) {
        r.acc += r.total / CFG.hot.rainDur * dt;
        while (r.acc >= 1 && r.left > 0) {
          r.acc--; r.left--;
          const a = rnd(TAU), d = Math.sqrt(Math.random()) * CFG.hot.rainRadius;
          G.map.crystals.push({ x: r.x + Math.cos(a) * d, y: r.y + Math.sin(a) * d, vx: 0, vy: 0, life: 50, val: 1, rain: true, age: 0, fall: 0.5 });
        }
      }
      if (r.t > CFG.hot.rainDur + 22) { this.rain = null; this.rainT = CFG.hot.rainEvery; }
    }
    // Boss mondial
    if (!this.boss) {
      this.bossT -= dt * (fx.boss || 1);
      if (this.bossT <= 30 && !this.bossWarned) {
        this.bossWarned = true; this.bossZone = rndi(0, 9);
        UIH.announce(traduire('mboss.approche'), traduire('pluie.text', { zone: ZONES[this.bossZone].name, n: 30 })); Sfx.play('alert', 0.7);
      }
      if (this.bossT <= 0) {
        const z = ZONES[this.bossZone], s = MAP.seeds[this.bossZone];
        const nom = traduire('mboss.' + z.el);
        let x = s.x + 380, y = s.y - 320;
        for (let i = 0; i < 20 && G.map.blocked(x, y, 60); i++) { x += 60; y -= 30; }
        this.boss = G.map.add(makeBoss(nom, z.el, x, y, CFG.hot.bossHp, 14, { world: true, crystals: CFG.hot.bossCrystals, burst: 14, meteors: 4 }));
        this.boss.life = 260;
        UIH.announce(traduire('mboss.titre'), traduire('mboss.apparu', { nom, zone: z.name }));
      }
    } else {
      this.boss.life -= dt;
      if (this.boss.life <= 0 && this.boss.combatT <= 0) { this.boss.gone = true; this.boss = null; this.bossT = CFG.hot.bossEvery; this.bossWarned = false; UIH.feed(traduire('mboss.parti'), 'sys'); }
    }
    // Bots hors de la carte (lobby, donjon)
    for (let i = this.online.length - 1; i >= 0; i--) {
      const e = this.online[i];
      if (e.where === 'lobby') {
        e.t -= dt; if (e.t < 3.5) e.f.ai.leave = true;
        if (e.t <= 0) { G.lobby.remove(e.f); this.botToMap(e); }
      } else if (e.where === 'dungeon') { e.t -= dt; if (e.t <= 0) this.botLeaveDungeon(e); }
    }
    // Réponses aux demandes d'alliance
    for (let i = this.pending.length - 1; i >= 0; i--) { const p = this.pending[i]; p.t -= dt; if (p.t <= 0) { this.pending.splice(i, 1); this.answerAlly(p.f); } }
    // Un bot propose une alliance au joueur
    this.askT -= dt;
    if (this.askT <= 0) {
      this.askT = rnd(110, 220);
      const p = G.player;
      if (p && S.allyOpen && G.scene === 'map' && !p.dead && this.allies(p).length < 2) {
        const c = this.online.filter(e => e.where === 'map' && !e.f.alliance && !e.f.dead && dist2(e.f.x, e.f.y, p.x, p.y) < 560 * 560 && e.f.lastHitBy !== p && p.lastHitBy !== e.f);
        if (c.length) UIH.allyAsk(pick(c).f);
      }
    }
    this.churnT -= dt; if (this.churnT <= 0) { this.churnT = rnd(CFG.server.churnMin, CFG.server.churnMax); this.churn(); }
    this.slowT -= dt; if (this.slowT <= 0) { this.slowT = 0.5; this.slow(); }
    if (G.player) this.playerTick(dt);
  },
  slow() {
    const w = G.map, F = w.fighters;
    // Camps : réapparition des PNJ et mise en sommeil loin des joueurs
    for (const c of MAP.camps) {
      for (let i = c.respawn.length - 1; i >= 0; i--) if (c.respawn[i].t <= G.time) {
        const n = c.respawn[i].npc; c.respawn.splice(i, 1);
        this.reset(n); n.x = n.ai.home.x; n.y = n.ai.home.y; n.ai.target = null; n.ai.ret = false; w.add(n);
      }
      let near = false;
      for (const f of F) if (f.faction === 'p' && !f.dead && dist2(f.x, f.y, c.x, c.y) < 1150 * 1150) { near = true; break; }
      for (const n of c.npcs) { if (!near && !n.sleep) { n.hp = n.maxHp; n.ai.target = null; n.mx = n.my = 0; } n.sleep = !near; }
    }
    // Prime : la plus longue série en cours
    let b = null;
    for (const f of F) if (f.faction === 'p' && !f.dead && f.streak >= CFG.bounty.minStreak && (!b || f.streak > b.streak)) b = f;
    if (b !== this.bounty) { this.bounty = b; if (b) UIH.feed(b === G.player ? traduire('prime.moi', { n: b.streak }) : traduire('prime.feed', { nom: b.name, n: b.streak }), 'gold'); }
    // Cristaux dispersés
    this.scatterT -= 0.5;
    if (this.scatterT <= 0) {
      const k = Events.fx().scatter || 1; this.scatterT = CFG.hot.scatterEvery; let n = 0; for (const c of w.crystals) if (c.sc) n++;
      for (let i = 0; i < (k > 1 ? 6 : 1) && n + i < CFG.hot.scatter * k; i++) this.scatterOne();
    }
    if ((this.achT -= 0.5) <= 0) { this.achT = 2; this.checkAch(); }
    this.rollT -= 0.5;
    if (this.rollT <= 0) { this.rollT = 30; this.rollWeek(); this.rollDay(); if (this.loginReward && G.scene === 'lobby') UIH.login(); if (G.player) G.player.crown = this.hasCrown(ME); }
  }
};

const Shop = {
  safe() { return G.scene === 'lobby' || Main.mode === 'hub'; },
  atLobby() { if (!this.safe()) { UIH.toast(traduire('boutique.lobby')); Sfx.play('deny'); return false; } return true; },
  pay(n) { if (S.crystals < n) { UIH.toast(traduire('boutique.manque', { n: fmt(n - S.crystals) })); Sfx.play('deny'); return false; } S.crystals -= n; return true; },
  done(msg) { Sys.applyLoadout(); Save.write(); Sfx.play('buy'); if (msg) UIH.toast(msg, 'good'); UIH.changed(); return true; },
  tierPrice(el) { const t = S.tiers[el]; return t >= 5 ? null : CFG.prices[t]; },
  buyTier(el) {
    if (!this.atLobby()) return false;

/* ==== 09-dungeon.js ==== */
/* Donjons scellés : même modèle technique pour les 13 (porte, salles de gardes, boss, coffres). */
const Dungeon = {
  cur: null,
  enter(door) {
    const def = door.def, p = G.player;
    if (this.cur || door.by || door.busyT > G.time || p.dead || p.world !== G.map) return;
    const allies = Sys.allies(p).filter(a => a.world === G.map && !a.dead && dist(a.x, a.y, door.x, door.y) < 520);
    // Renfort : quand on entre seul, le bot libre le plus proche accompagne le joueur (réglage désactivable).
    let helper = null;
    if (!allies.length && S.settings.renfort) {
      let bd = 1e18;
      for (const e of Sys.online) {
        const f = e.f; if (e.where !== 'map' || e.moving || e.leaving || f.dead || f.alliance || f.world !== G.map) continue;
        const d = dist2(f.x, f.y, door.x, door.y) + (f.combatT > 0 ? 1e12 : 0); if (d < bd) { bd = d; helper = f; }
      }
    }
    const party = [p].concat(allies); if (helper) party.push(helper);
    const w = this.build(def, party.length);
    door.by = p; door.busyT = G.time + 99999;
    this.cur = { door, def, w, party, helper, done: false, exit: null, t: 0 };
    party.forEach((f, i) => {
      if (f.entry) { f.entry.where = 'inst'; f.ai = f.botAi; f.botAi.state = 'follow'; f.botAi.goal = null; f.botAi.target = null; f.botAi.leader = p; }
      Sys.move(f, w, w.w / 2 + (i - (party.length - 1) / 2) * 70, w.h - 120);
      f.face = -Math.PI / 2;
    });
    G.inst = w; Sys.view(w, 'dungeon');
    UIH.announce(def.name, traduire('donjon.entree', { diff: CFG.dungeon.diff[def.diff].name }));
    Sfx.play('portal', 0.7);
    if (helper) UIH.toast(traduire('donjon.renfort', { nom: esc(helper.name) }), 'good');
  },
  build(def, n) {
    const D = CFG.dungeon.diff[def.diff], W = 1100, RH = 760, EN = 280, rooms = D.rooms + 1, H = EN + rooms * RH + 60;
    const w = new World('dungeon', W, H);
    w.pvp = false; w.def = def; w.rooms = []; w.gates = []; w.entryH = EN; w.roomH = RH;
    const scale = 1 + 0.45 * (n - 1);
    for (let j = 1; j <= rooms; j++) {
      const y1 = H - EN - (j - 1) * RH, y0 = y1 - RH, room = { j, y0, y1, guards: [], boss: null };
      w.rooms.push(room);
      if (j < rooms) w.gates.push({ y: y0, open: false, room: j, t: 0 });
      // Piliers
      for (const [px, py] of [[0.27, 0.3], [0.73, 0.3], [0.27, 0.72], [0.73, 0.72]]) w.addObs({ x: W * px + rnd(-30, 30), y: y0 + RH * py + rnd(-30, 30), r: 26, vr: 26, type: 'pillar', v: rndi(0, 999) });
      if (j < rooms) {
        const cnt = D.guards + (n - 1);
        for (let k = 0; k < cnt; k++) {
          const g = makeNpc(traduire('donjon.garde'), def.el, 160 + rnd(W - 320), y0 + 120 + rnd(RH - 330), { ranged: k % 3 === 2, hp: D.guardHp, dmg: D.guardDmg, aggro: CFG.dungeon.guardAggro, leash: 5000, crystals: 1, look: k % 3 === 2 ? 2 : 3 });
          g.room = j; g.sleep = j > 1; room.guards.push(g); w.add(g);
        }
      } else {
        const b = makeBoss(def.boss, def.el, W / 2, y0 + RH * 0.42, Math.round(D.bossHp * scale), D.bossDmg, { aggro: 520, leash: 5000, burst: 10 + def.diff * 3, meteors: 2 + def.diff });
        b.room = j; b.sleep = rooms > 1; room.boss = b; w.boss = b; w.add(b);
      }
    }
    w.gateBlock = (x0, y0, x1, y1) => { for (const g of w.gates) if (!g.open && (y0 - g.y) * (y1 - g.y) <= 0) return true; return false; };
    w.bound = f => {
      f.x = clamp(f.x, 56 + f.r, W - 56 - f.r); f.y = clamp(f.y, 50 + f.r, H - 44 - f.r);
      let gy = -1; for (const g of w.gates) if (!g.open && g.y > gy) gy = g.y;
      if (gy > 0 && f.y < gy + f.r + 10) f.y = gy + f.r + 10;
    };
    w.onKill = (v, k) => this.kill(v, k);
    w.onPickup = (f, c) => Sys.pickup(f, c);
    return w;
  },
  kill(v, k) {
    const c = this.cur; if (!c) return;
    if (v.faction === 'n') {
      v.gone = true;
      if (v.boss) { this.bossDown(v); return; }
      if (k === G.player) { S.npcKills++; Sys.quest('npc', 1); }
      c.w.dropCrystals(v.x, v.y, v.crystals, { spread: 90 });
      const room = c.w.rooms[v.room - 1];
      if (room.guards.every(g => g.dead)) this.openGate(v.room);
      return;
    }
    if (v === G.player) { Sys.playerDied(k); return; }
    if (v.entry) Sys.botToLobby(v);
  },
  openGate(j) {
    const w = this.cur.w, g = w.gates.find(x => x.room === j); if (!g || g.open) return;
    g.open = true;
    const next = w.rooms[j]; if (next) { for (const n of next.guards) n.sleep = false; if (next.boss) next.boss.sleep = false; }
    // Salle nettoyée : le groupe récupère de la vie
    for (const f of this.cur.party) if (!f.dead && f.world === w) { f.hp = Math.min(f.maxHp, f.hp + CFG.dungeon.roomHeal); FX.text(w, f.x, f.y - 40, traduire('pv.plus', { n: CFG.dungeon.roomHeal }), '#8dff9a', 15); }
    FX.ring(w, w.w / 2, g.y, 200, '#ffe9a0', 0.6); Sfx.play('alert', 0.6);
    UIH.toast(traduire(next && next.boss ? 'donjon.grilleBoss' : 'donjon.grille'), 'good');
  },
  bossDown(b) {
    const c = this.cur, w = c.w, def = c.def;
    c.done = true;
    S.total.dungeons++; S.week.dungeons++; S.bossKills++; S.dunDone[def.id] = (S.dunDone[def.id] || 0) + 1;
    Sys.quest('dungeon', 1); Sys.quest('boss', 1);
    if (S.badges.indexOf(def.id) < 0) S.badges.push(def.id);
    // Un coffre par joueur entré dans le donjon
    const n = c.party.length, y = b.ai.home.y - 150;
    c.party.forEach((f, i) => w.chests.push({ x: w.w / 2 + (i - (n - 1) / 2) * 130, y, owner: f, open: false, t: 0 }));
    c.exit = { x: w.w / 2, y: y - 130, r: 50 };
    for (const s of w.shots) s.life = 0; w.aoes.length = 0;
    UIH.announce(traduire('donjon.bossVaincu'), traduire('donjon.bossVaincu.text')); Sfx.play('loot', 0.8);
    Save.write();
  },
  update(dt) {
    const c = this.cur; if (!c) return;
    const w = c.w, p = G.player; c.t += dt; Sys.near = null;
    for (const g of w.gates) if (g.open && g.t < 1) g.t = Math.min(1, g.t + dt * 2);
    if (!c.done || p.dead) return;
    for (const ch of w.chests) {
      if (ch.open) { ch.t += dt; continue; }
      if (ch.owner === p) {
        if (dist2(p.x, p.y, ch.x, ch.y) < 62 * 62) { ch.open = true; const loot = this.roll(c.def); Sfx.play('loot'); FX.burst(w, ch.x, ch.y, RARITIES[loot.rar].c, 30, 260, 0.8, 5); UIH.loot(loot, c.def); Save.write(); }
      } else if (c.t > 0 && !ch.owner.dead && (ch.wait = (ch.wait || 0) + dt) > 2.5) { ch.open = true; FX.burst(w, ch.x, ch.y, '#ffe28a', 16, 200, 0.6, 4); }
    }
    const mine = w.chests.find(ch => ch.owner === p);
    if (c.exit && dist2(p.x, p.y, c.exit.x, c.exit.y) < 64 * 64) {
      Sys.near = { kind: 'exit', max: 1.2, blocked: mine && !mine.open ? traduire('donjon.coffreDabord') : null };
      if (!Sys.near.blocked) { p.channel += dt; if (p.channel >= 1.2) { p.channel = 0; Sys.queue.push(() => this.exit()); } } else p.channel = 0;
    } else p.channel = 0;
  },
  /* Tirage du butin : rareté selon la difficulté, objet exclusif du donjon, garantie anti-malchance. */
  roll(def) {
    const D = CFG.dungeon, odds = D.odds[def.diff];
    let r = Math.random(), rar = 0, pity = false;
    for (let i = 0; i < 5; i++) { r -= odds[i]; if (r <= 0) { rar = i; break; } }
    if (S.pity >= D.pity && rar < 1) { rar = 1; pity = true; }
    if (rar >= 1) S.pity = 0; else S.pity++;
    const ex = ITEM[def.excl];
    let item = null;
    if (ex.rar === rar && !owns(ex.id) && Math.random() < D.exclusiveChance) item = ex;
    if (!item) {
      let pool = ITEMS.filter(i => i.rar === rar && (i.src === 'loot' || i === ex));
      const fresh = pool.filter(i => !owns(i.id));
      if (fresh.length) pool = fresh;
      item = pick(pool);
    }
    const crystals = Math.round(rndi(CFG.dungeon.diff[def.diff].crystals[0], CFG.dungeon.diff[def.diff].crystals[1]) * (Events.fx().chest || 1));
    let dup = 0;
    if (owns(item.id)) dup = D.dupCrystals[item.rar]; else S.items.push(item.id);
    Sys.earn(crystals + dup);
    return { item, rar, crystals, dup, pity };
  },
  release() {
    const c = this.cur; if (!c) return;
    c.door.by = null; c.door.busyT = G.time + CFG.dungeon.reset;
    for (const f of c.party) {
      if (f === G.player || !f.entry || f.entry.where !== 'inst') continue;
      const e = f.entry; e.where = 'map'; f.ai = f.botAi; f.botAi.state = 'roam'; f.botAi.goal = null; f.botAi.target = null;
      f.botAi.leader = Sys.leaderOf(f); f.botAi.truceT = G.time + CFG.dungeon.truce;
      Sys.move(f, G.map, c.door.x + rnd(-70, 70), c.door.y + 130 + rnd(30)); f.shield = CFG.dungeon.exitShield;
    }
    this.cur = null; G.inst = null;
  },
  exit() {
    const c = this.cur; if (!c) return;
    const door = c.door, p = G.player;
    this.release();
    Sys.move(p, G.map, door.x, door.y + 140); p.shield = CFG.dungeon.exitShield; p.face = Math.PI / 2;
    Sys.view(G.map, 'map'); Sfx.play('portal', 0.7);
    UIH.toast(traduire('donjon.bouclier', { n: CFG.dungeon.exitShield }));
    Save.write();
  }
};

/* Lobby : zone sans combat, stands, terrain d'essai avec mannequins, arène de duel, portail vers la carte. */
function buildLobby() {
  const w = new World('lobby', 2000, 1400);
  w.pvp = false;
  w.spawn = { x: 1000, y: 350 };
  w.portal = { x: 1000, y: 200, r: 74 };
  w.pois = [
    { id: 'powers', x: 560, y: 360, r: 46, c: '#ff7a3c' },
    { id: 'auras', x: 790, y: 290, r: 46, c: '#c79bff' },
    { id: 'pets', x: 1210, y: 290, r: 46, c: '#7dd36b' },
    { id: 'cosmetics', x: 1440, y: 360, r: 46, c: '#ff7ad9' },
    { id: 'stable', x: 1600, y: 600, r: 46, c: '#d9a441' },
    { id: 'quests', x: 400, y: 600, r: 46, c: '#5ad1ff' },
    { id: 'events', x: 420, y: 850, r: 46, c: '#ffd93b' },
    { id: 'ranks', x: 1000, y: 610, r: 78, c: '#ffd700' },
    { id: 'arena', x: 600, y: 1130, r: 96, c: '#ff5f5f' }
  ];
  nommer(w.pois, 'stand');
  for (const p of w.pois) w.addObs({ x: p.x, y: p.y, r: p.r, vr: p.r, type: 'none', v: 0 });
  w.test = { x0: 1330, y0: 830, x1: 1900, y1: 1320 };
  // Arbres en bordure de l'île
  for (let i = 0; i < 48; i++) {
    const a = i / 48 * TAU, x = 1000 + Math.cos(a) * 915, y = 715 + Math.sin(a) * 590;
    if (Math.abs(x - 1000) < 230 && y < 400) continue;
    if (x > w.test.x0 - 70 && y > w.test.y0 - 70) continue;
    if (w.pois.some(p => dist(x, y, p.x, p.y) < p.r + 110)) continue;
    const sc = 0.95 + (i * 37 % 10) / 25;
    w.addObs({ x, y, r: 15 * sc, vr: 50 * sc, type: i % 3 ? 'tree' : 'pine', v: i });
  }
  for (const [x, y] of [[1520, 1010], [1720, 960], [1700, 1170]]) {
    w.add(new Fighter({ kind: 'dummy', faction: 'd', name: traduire('lobby.mannequin'), x, y, r: 18, fixed: true, el: 'terre', speed: 0 }));
  }
  const inTest = f => f.x > w.test.x0 && f.x < w.test.x1 && f.y > w.test.y0 && f.y < w.test.y1;
  w.inTest = inTest;
  w.canAttack = f => f === G.player && inTest(f);
  w.onKill = v => { if (v.kind === 'dummy') { v.dead = false; v.hp = v.maxHp; v.burnT = 0; FX.text(w, v.x, v.y - 46, traduire('lobby.ko'), '#ffe28a', 16); } };
  w.bound = f => { f.x = clamp(f.x, 70, w.w - 70); f.y = clamp(f.y, 120, w.h - 70); };
  return w;
}
const Lobby = {
  trial: null, podium: [], podT: 0,
  update(dt) {
    const w = G.lobby, p = G.player;
    if ((this.podT -= dt) <= 0) { this.podT = 4; this.podium = Sys.board('kills', 'week').slice(0, 3); }
    if (G.scene !== 'lobby') return;

  quit() { if (this.cur) { this.cur = null; Sys.toLobby(true); } }
};

if (typeof window !== 'undefined') window.JEL_NIVEAUX = LEVELS.length;

const Camp = {
  cur: null,
  stars() { let n = 0; for (const s of S.camp.stars) n += s || 0; return n; },
  done() { for (let i = 0; i < LEVELS.length; i++) if (!(S.camp.stars[i] > 0)) return false; return true; },
  over() { const c = this.cur; return !!c && (c.intro || !!(c.end && c.shown)); },
  goalText(L, c) {
    if (L.goal === 'survive') return traduire('but.survive', { n: L.time });
    if (L.goal === 'collect') return traduire('but.collect', { n: L.need });
    if (L.goal === 'boss') return traduire('but.boss', { nom: this.bossName(L.boss[L.boss.length - 1]) });
    return traduire('but.clear');
  },
  bossName(b) { return traduire(b.final ? 'cboss.final' : 'mboss.' + b.el); },

  /* ---------- Construction de l'arène ---------- */
  build(n) {
    const L = LEVELS[n - 1], z = ZONES[L.th], tall = typeof R !== 'undefined' && R.H > R.W * 1.1, W = tall ? 1000 : 1300, H = tall ? 1300 : 1000, w = new World('level', W, H), rng = mulberry(n * 7919 + 13);
    const rgb = a => 'rgb(' + a[0] + ',' + a[1] + ',' + a[2] + ')';
    w.pvp = true; w.lvl = n; w.dark = !!L.dark;
    w.def = { floor: [rgb(z.a), rgb(z.b)], el: z.el, i: n };
    w.bound = f => { f.x = clamp(f.x, 56 + f.r, W - 56 - f.r); f.y = clamp(f.y, 50 + f.r, H - 44 - f.r); };
    const type = z.obs[0][0] === 'mesa' ? 'rock' : z.obs[0][0], od = OBS_DEF[type] || [24, 24];
    for (let i = 0, tries = 0; i < (L.obs || 0) && tries < 200; tries++) {
      const x = 170 + rng() * (W - 340), y = 150 + rng() * (H - 420);
      if (dist(x, y, W / 2, H / 2) < 130 || w.blocked(x, y, 110)) continue;
      w.addObs({ x, y, r: od[0], vr: od[1], type, v: Math.floor(rng() * 999) }); i++;
    }
    w.onKill = (v, k) => this.kill(v, k);
    w.onPickup = (f, c) => { Sys.pickup(f, c); if (f === G.player && this.cur && c.goal) this.cur.got += c.val; };
    return w;
  },
  botAi(skill, leader) {
    return {
      type: 'bot', bot: { crystals: 0 }, skill, state: leader ? 'follow' : 'roam', t: 0.4, strafe: 1, strafeT: 0, goalT: 0, goal: null, react: 1, err: 0,
      lead: 0.72 + skill * 0.28, dodgeP: 0.1 + skill * 0.6, fleeAt: 0, brave: true, peace: false, shy: 0, patience: 5, stuckT: 0, sx: 0, sy: 0, detour: 1, detourT: 0,
      offx: 70, offy: 40, leader: leader || null, target: null, loot: null, farm: false
    };
  },
  /* Point d'apparition : loin du joueur, hors des obstacles. */
  spot(w, far = 380) {
    const p = G.player;
    for (let i = 0; i < 40; i++) {
      const x = 110 + Math.random() * (w.w - 220), y = 100 + Math.random() * (w.h - 220);
      if (dist(x, y, p.x, p.y) > far - i * 4 && !w.blocked(x, y, 30)) return { x, y };
    }
    return { x: w.w / 2, y: 130 };
  },
  spawn(kind, bi) {
    const c = this.cur, w = c.w, L = c.L, z = ZONES[L.th], s = this.spot(w, kind === 'B' ? 460 : 380);
    let f;
    if (kind === 'd') f = new Fighter({ kind: 'dummy', faction: 'd', name: traduire('lobby.mannequin'), x: s.x, y: s.y, r: 18, fixed: true, el: 'terre', speed: 0, maxHp: 30, hp: 30 });
    else if (kind === 'm' || kind === 'r') f = makeNpc(z.npc, z.el, s.x, s.y, { ranged: kind === 'r', hp: L.hp, dmg: L.dmg, aggro: 5000, leash: 5000, crystals: 1 });
    else if (kind === 'b') {
      const el = ELEMENTS[(c.n + c.made) % ELEMENTS.length].id, R = L.rival;
      f = new Fighter({ kind: 'bot', name: traduire('rival.' + el), el, level: R.tier, tier: R.tier, x: s.x, y: s.y });
      f.botAi = f.ai = this.botAi(R.skill); f.ai.shy = R.shy || 0; f.maxHp = f.hp = R.hp || 100; f.alliance = L.ffa ? 0 : 900; f.crystals = 3;
    } else {
      const B = L.boss[bi % L.boss.length];
      f = makeBoss(this.bossName(B), B.el, s.x, Math.min(s.y, 300), B.hp, B.dmg, { aggro: 5000, leash: 5000, burst: B.burst, meteors: B.meteors, crystals: 12 });
    }
    f.foeLvl = true; c.made++; c.alive++; w.add(f);
    FX.ring(w, f.x, f.y, 70, EL[f.el].c, 0.5);
    return f;
  },
  wave() {
    const c = this.cur, list = c.L.waves[c.wave]; let bi = 0;
    for (const [kind, n] of list) for (let i = 0; i < n; i++) this.spawn(kind, bi++);
    if (c.L.waves.length > 1 && c.wave > 0) { UIH.announce(traduire('niv.vague', { n: c.wave + 1, total: c.L.waves.length }), ''); Sfx.play('alert', 0.5); }
  },

  /* ---------- Déroulement ---------- */
  start(n, quiet, wave0) {
    n = clamp(n | 0, 1, LEVELS.length);
    const p = G.player, L = LEVELS[n - 1];
    if (this.cur) this.quit();
    if (Dungeon.cur) Dungeon.release();
    Arena.cur = null; Lobby.trial = null; Sys.applyLoadout();
    const w = this.build(n);
    const c = this.cur = { n, L, w, wave: wave0 || 0, alive: 0, made: 0, taken: 0, hp: p.maxHp, t: 0, left: L.time || 0, got: 0, spT: 1.2, stT: 3, rainT: 0.5, nextT: 0, intro: !quiet, end: null, ally: null, prevAl: p.alliance, haz: null };
    p.alliance = 901;
    Sys.move(p, w, w.w / 2, w.h - 150); p.face = -Math.PI / 2; p.streak = 0;
    G.inst = w; Sys.near = null; Sys.view(w, 'level');
    if (L.ally) {
      const el = ELEMENTS[(n + 2) % ELEMENTS.length].id;
      const a = new Fighter({ kind: 'bot', name: traduire('niv.allie'), el, level: L.ally.tier, tier: L.ally.tier, x: p.x + 80, y: p.y + 20, face: -Math.PI / 2 });
      a.botAi = a.ai = this.botAi(L.ally.skill, p); a.alliance = 901; c.ally = a; w.add(a);
    }
    c.haz = new Fighter({ kind: 'npc', faction: 'n', name: traduire('niv.orage'), el: 'foudre' });
    if (L.waves) this.wave();
    else for (let i = 0; i < 3; i++) this.spawn(Math.random() < L.mix ? 'r' : 'm');
    if (!quiet) UIH.levelIntro(c);
  },
  go() { const c = this.cur; if (!c || !c.intro) return; c.intro = false; G.player.shield = 1.5; if (c.ally) c.ally.shield = 1.5; Sfx.play('portal', 0.5); UIH.changed(); },
  kill(v, k) {
    const c = this.cur; if (!c || c.end) return;
    if (v === G.player) { this.finish(false); return; }
    v.gone = true;
    if (v === c.ally) { UIH.toast(traduire('niv.allieKo')); return; }
    if (!v.foeLvl) return;
    c.alive--;
    if (v.crystals) c.w.dropCrystals(v.x, v.y, v.crystals, { spread: 80 });
    if (k === G.player) {
      if (v.boss) { S.bossKills++; Sys.quest('boss', 1); } else if (v.kind === 'npc') { S.npcKills++; Sys.quest('npc', 1); }
    }
    if (v.boss) FX.shake(c.w, 10, v.x, v.y);
  },
  update(dt) {
    const c = this.cur; if (!c || c.intro || c.end) return;
    const p = G.player, L = c.L, w = c.w;
    c.t += dt;
    if (p.hp < c.hp) c.taken += c.hp - p.hp;
    c.hp = p.hp;
    // Orage : éclairs annoncés au sol, sur le joueur et au hasard
    if (L.storm && (c.stT -= dt) <= 0) {
      c.stT = L.storm;
      const P = { shape: 'meteor', el: 'foudre', tier: 1, mast: 0.6, dmg: Math.round((L.dmg || 6) * 1.6), r: 100, delay: 1.35 };
      w.aoes.push({ x: p.x + p.mx * 60, y: p.y + p.my * 60, r: P.r, t: 0, delay: P.delay, dmg: P.dmg, src: c.haz, p: P });
      w.aoes.push({ x: 150 + Math.random() * (w.w - 300), y: 130 + Math.random() * (w.h - 260), r: P.r, t: 0, delay: P.delay + 0.3, dmg: P.dmg, src: c.haz, p: P });
    }
    if (L.goal === 'survive' || L.goal === 'collect') {
      if ((c.spT -= dt) <= 0) { c.spT = L.every; if (c.alive < L.cap) this.spawn(Math.random() < L.mix ? 'r' : 'm'); }
      if (L.goal === 'survive') { c.left -= dt; if (c.left <= 0) { this.finish(true); return; } }
      else {
        if ((c.rainT -= dt) <= 0) {
          c.rainT = 0.55; let n = 0; for (const k of w.crystals) if (k.goal) n++;
          if (n < 9) w.crystals.push({ x: 130 + Math.random() * (w.w - 260), y: 120 + Math.random() * (w.h - 250), vx: 0, vy: 0, life: 14, val: 1, rain: false, age: 0, fall: 0.5, goal: true });
        }
        if (c.got >= L.need) { this.finish(true); return; }
      }
      return;
    }
    if (c.alive <= 0) {
      if (c.wave + 1 >= L.waves.length) { if ((c.nextT += dt) > 0.7) this.finish(true); return; }
      if ((c.nextT += dt) > 1.3) { c.nextT = 0; c.wave++; const heal = c.n >= 16 ? 35 : 25; p.hp = Math.min(p.maxHp, p.hp + heal); c.hp = p.hp; FX.text(w, p.x, p.y - 40, traduire('pv.plus', { n: heal }), '#8dff9a', 15); this.wave(); }
    }
  },
  /* Texte de l'objectif en cours, pour le bandeau du haut. */
  status() {
    const c = this.cur; if (!c) return '';
    const L = c.L, st = c.taken <= L.s3 ? '★★★' : c.taken <= L.s2 ? '★★☆' : '★☆☆';
    let s;
    if (L.goal === 'survive') s = traduire('niv.reste', { n: Math.max(0, Math.ceil(c.left)) });
    else if (L.goal === 'collect') s = traduire('niv.cristaux', { n: Math.min(c.got, L.need), total: L.need });
    else s = traduire('niv.etat', { vague: c.wave + 1, total: L.waves.length, n: Math.max(0, c.alive) });
    return traduire('niv.num', { n: c.n }) + ' · ' + s + ' · ' + st;
  },
  finish(win) {
    const c = this.cur; if (!c || c.end) return;
    const n = c.n, L = c.L, w = c.w;
    for (const s of w.shots) s.life = 0; w.aoes.length = 0;
    const r = c.end = { win, n, stars: 0, gain: 0, first: false, best: S.camp.stars[n - 1] || 0, taken: Math.round(c.taken), time: c.t, all: false };
    if (win) {
      r.stars = c.taken <= L.s3 ? 3 : c.taken <= L.s2 ? 2 : 1;
      r.first = !(S.camp.stars[n - 1] > 0);
      r.gain = r.first ? L.gain : Math.max(5, Math.round(L.gain * 0.2));
      if (r.stars > r.best) S.camp.stars[n - 1] = r.stars;
      for (let i = 0; i < LEVELS.length; i++) if (S.camp.stars[i] == null) S.camp.stars[i] = 0;
      if (n >= S.camp.lvl) S.camp.lvl = Math.min(LEVELS.length, n + 1);
      Sys.earn(r.gain); r.all = this.done();
      for (const f of w.fighters) if (f.foeLvl && !f.dead) f.gone = true;
      Sfx.play('loot', 0.8);
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: n });
      if (r.all) { if (window.FMG) window.FMG.reportComplete({ stars: this.stars(), maxStars: LEVELS.length * 3 }); }
    } else {
      S.deaths++; Sfx.play('death', 0.8);
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: n });
    }
    Save.write();
    UIH.levelEnd(r);
  },
  quit() {
    const c = this.cur; if (!c) return;
    G.player.alliance = c.prevAl || 0; this.cur = null; G.inst = null;
  }
};

/* ==== 11-sprites.js ==== */
/* Dessins générés par le code : sols, obstacles, bâtiments. Aucune image externe. */
const GFX = {
  cache: {}, chunks: new Map(), chunkQueue: [], res: 256,
  mk(w, h, fn) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); fn(c.getContext('2d'), w, h); return c; },
  shade(hex, k) {
    const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
    if (k < 0) { r *= 1 + k; g *= 1 + k; b *= 1 + k; } else { r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
    return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
  },
  glow(color) {
    const k = 'glow' + color;
    if (!this.cache[k]) this.cache[k] = this.mk(64, 64, g => {
      const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, color); gr.addColorStop(0.35, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.globalAlpha = 0.9; g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    });
    return this.cache[k];
  },

  /* ---------- Obstacles (unité de base : rayon visuel 40) ---------- */
  obs(type, v) {
    const k = type + (v % 3);
    if (this.cache[k]) return this.cache[k];
    const S = 2;
    return this.cache[k] = this.mk(128 * S, 150 * S, g => {
      g.scale(S, S); g.translate(64, 110);
      const r = mulberry(v % 3 * 77 + type.length * 13 + type.charCodeAt(0));
      const ell = (x, y, a, b, c) => { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, a, b, 0, 0, TAU); g.fill(); };
      const poly = (pts, c) => { g.fillStyle = c; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fill(); };
      const circ = (x, y, rr, c) => ell(x, y, rr, rr, c);
      const sh = (w = 28, h = 9) => ell(2, 5, w, h, 'rgba(0,0,0,.22)');
      switch (type) {
        case 'tree': {
          const base = ['#2f6b34', '#35743a', '#2a6238'][v % 3], mid = ['#3d8642', '#479148', '#3a7f4a'][v % 3], top = ['#56a455', '#62ad58', '#4f9a5c'][v % 3];
          sh(30, 10); g.fillStyle = '#6b4a2b'; g.fillRect(-5, -24, 10, 28);
          circ(0, -46, 31, base); circ(-15, -36, 20, mid); circ(14, -40, 21, mid); circ(-2, -56, 21, top); circ(-9, -62, 9, 'rgba(255,255,255,.14)'); break;
        }
        case 'pine':
          sh(24, 8); g.fillStyle = '#5a3f28'; g.fillRect(-4, -12, 8, 16);
          for (let i = 0; i < 3; i++) {
            const y = -6 - i * 22, w = 32 - i * 6;
            poly([[0, y - 40], [w, y], [-w, y]], '#1f5a3c'); poly([[0, y - 40], [0, y], [-w, y]], '#2a7049');
            poly([[0, y - 40], [7, y - 26], [-7, y - 26]], 'rgba(255,255,255,.75)');
          }
          break;
        case 'palm':
          sh(22, 7); g.strokeStyle = '#8a6a44'; g.lineWidth = 7; g.lineCap = 'round'; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(-8, -30, 8, -56); g.stroke();
          for (let i = 0; i < 7; i++) { const a = i * TAU / 7 + 0.3; g.save(); g.translate(8, -58); g.rotate(a); ell(20, 0, 22, 6.5, i % 2 ? '#3fae5a' : '#2f9a4c'); g.restore(); }
          circ(8, -58, 5, '#7a5a34'); break;
        case 'mangrove':
          sh(28, 9); g.strokeStyle = '#4f3d2c'; g.lineWidth = 4; g.lineCap = 'round';
          for (let i = -2; i <= 2; i++) { g.beginPath(); g.moveTo(0, -20); g.quadraticCurveTo(i * 8, -8, i * 10, 4); g.stroke(); }
          circ(0, -40, 27, '#27503a'); circ(-14, -32, 18, '#2f6146'); circ(13, -36, 19, '#2f6146'); circ(0, -50, 17, '#3a7352'); break;
        case 'deadtree':
          sh(16, 6); g.strokeStyle = '#4e3d30'; g.lineCap = 'round';
          g.lineWidth = 7; g.beginPath(); g.moveTo(0, 0); g.lineTo(2, -36); g.stroke();

  itemArt(g, it, x, y, k) {
    const z = R.zoom; R.zoom = 1;
    if (it.type === 'pet') R.critter(g, it.look, x, y, 4.2 * k, 0, 0.3, true);
    else if (it.type === 'mount') R.critter(g, it.look, x, y, 4.6 * k, 0, 0.3, true);
    else if (it.type === 'glider') {
      const gr = g.createLinearGradient(x - 70 * k, 0, x + 70 * k, 0); gr.addColorStop(0, it.look.c1); gr.addColorStop(0.5, it.look.c2); gr.addColorStop(1, it.look.c1);
      g.fillStyle = gr; g.beginPath(); g.moveTo(x, y - 34 * k); g.lineTo(x + 76 * k, y + 22 * k); g.lineTo(x + 44 * k, y + 30 * k); g.lineTo(x, y + 6 * k); g.lineTo(x - 44 * k, y + 30 * k); g.lineTo(x - 76 * k, y + 22 * k); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 2; g.stroke();
    } else {
      const r = mulberry(it.id.length * 7 + it.id.charCodeAt(3));
      for (let i = 0; i < 16; i++) { g.globalAlpha = 0.35 + r() * 0.65; g.fillStyle = it.look.k === 'rainbow' ? 'hsl(' + i * 22 + ',95%,65%)' : it.look.c; g.beginPath(); g.arc(x - 80 * k + i * 10.5 * k, y + Math.sin(i * 0.9) * 14 * k + r() * 8, (3 + r() * 6) * k, 0, TAU); g.fill(); }
      g.globalAlpha = 1;
    }
    R.zoom = z;
  },


  /* ---------- HUD ---------- */
  hud(dt) {
    const p = G.player; if (!p) return;
    const pw = powOf(p);
    $('bAtk').style.setProperty('--cd', p.cast ? 1 - p.cast.t / p.cast.dur : p.beam ? 1 : clamp(p.cd / (pw.cd || 1), 0, 1));

    this.hudT = 0.1;

    else if (p.combatT > 0) { st.textContent = traduire('hud.combat', { n: Math.ceil(p.combatT) }); st.className = 'pill fight'; }

    // Événement en cours ou prochain, avec compte à rebours (au lobby ; sur la carte seulement s'il est en cours)

      this.evT = 5;

      ev.classList.toggle('hidden', !show); if (show) ev.textContent = Events.label();
    }
    // Boutons contextuels
    $('bMount').classList.toggle('hidden', !p.mount || G.scene === 'lobby'); $('bMount').classList.toggle('active', p.mounted);
    $('bGlide').classList.toggle('hidden', !p.glider || G.scene !== 'map'); $('bGlide').classList.toggle('active', p.gliding);
    const al = Sys.allies(p), ba = $('bAlly');
    ba.className = 'ib ' + (S.allyOpen ? 'on' : 'off') + (G.scene === 'level' || G.scene === 'arena' ? ' hidden' : '');
    ba.innerHTML = ico('ally') + (al.length ? '<span class="n">' + al.map(a => esc(a.name)).join('<br>') + '</span>' : '');
    const qd = S.quests.list.filter(q => q.done && !q.claimed).length;
    $('bQuest').innerHTML = ico('quest') + (qd ? '<span class="dot">' + qd + '</span>' : '');
    // Indication contextuelle
    const n = Sys.near, h = $('hint');
    let txt = null, cls = 'info';
    if (n && !this.cur && !p.dead && G.scene !== 'level') {
      if (n.kind === 'stand') { txt = (n.poi.id === 'arena' ? traduire('hint.duel') : traduire('hint.ouvrir', { nom: n.poi.name })) + (Input.touch ? '' : ' (E)'); cls = 'act'; }
      else if (n.kind === 'toMap') txt = traduire('hint.versCarte');
      else if (n.kind === 'portal') txt = n.blocked ? traduire('hint.bloque', { txt: n.blocked, n: Math.ceil(p.combatT) }) : traduire('hint.versLobby');
      else if (n.kind === 'door') txt = traduire('hint.porte', { nom: n.q.def.name, etat: n.blocked || traduire('hint.porteOuvre') });
      else if (n.kind === 'exit') txt = n.blocked || traduire('hint.sortie');
    }
    if (txt) { h.textContent = txt; h.className = cls; } else h.className = 'hidden';
    // Barre du boss le plus proche
    let boss = null, bd = 950 * 950;
    for (const f of G.view.fighters) if (f.boss && !f.dead && !f.sleep) { const d = dist2(f.x, f.y, p.x, p.y); if (d < bd) { bd = d; boss = f; } }

  /* Tutoriel du monde libre : portail, déplacement, tir, esquive, cristaux, retour. */
  tuto() {
    const p = G.player, el = $('tuto'), k = Input.touch ? '.tactile' : '.clavier';
    if (S.tuto >= 99 || (G.scene !== 'lobby' && G.scene !== 'map')) { if (this.tutoState) { this.tutoState = null; el.classList.add('hidden'); } return; }
    const steps = [
      ['tuto.lobby', () => G.scene === 'map'],
      ['tuto.bouger' + k, s => (s.d = (s.d || 0) + (p.moving ? 0.1 : 0)) > 2],
      ['tuto.tirer' + k, s => { if (p.cast) s.n = (s.n || 0) + 1; return s.n > 3; }],
      ['tuto.esquive' + k, () => p.dodgeT > 0],
      ['tuto.cristaux', s => { if (s.c == null) s.c = S.total.crystals; return S.total.crystals >= s.c + 3; }],

    if (steps[S.tuto][1](this.tutoState)) {
      S.tuto++; Sfx.play('alert', 0.5);

  /* ---------- Panneaux ---------- */

  open(id, arg) {

    $('pTabs').innerHTML = tabs.map(b => '<button class="tab' + (b.id === this.arg.tab ? ' on' : '') + '" style="--tc:' + (b.c || '') + '" data-a="tab" data-id="' + b.id + '">' + b.label + '</button>').join('');
