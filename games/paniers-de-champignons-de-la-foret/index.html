    c.fillStyle = '#4a2e16';
    c.beginPath(); c.ellipse(x - r * 0.55, y, r * 0.22, r * 0.1, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(x + r * 0.35, y, r * 0.22, r * 0.1, 0, 0, Math.PI * 2); c.fill();
    if (st !== undefined && st !== null) panier(c, x + r * 1.0, y - r * 0.15, r * 0.48, st, o.plein || 0);
    c.restore();
  }

  function feuille(c, x, y, r, a, coul) {
    c.save(); c.translate(x, y); c.rotate(a);
    c.fillStyle = coul;
    c.beginPath(); c.moveTo(0, -r); c.quadraticCurveTo(r * 0.8, -r * 0.3, 0, r); c.quadraticCurveTo(-r * 0.8, -r * 0.3, 0, -r); c.fill();
    c.strokeStyle = '#00000030'; c.lineWidth = Math.max(0.8, r * 0.1); c.beginPath(); c.moveTo(0, -r * 0.8); c.lineTo(0, r * 0.9); c.stroke();
    c.restore();
  }

  function couronne(c, x, y, k) {
    c.save();
    c.fillStyle = '#ffd45a'; c.strokeStyle = '#8a5a00'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(x - k, y); c.lineTo(x - k, y - k * 0.7); c.lineTo(x - k * 0.5, y - k * 0.3); c.lineTo(x, y - k * 0.95);
    c.lineTo(x + k * 0.5, y - k * 0.3); c.lineTo(x + k, y - k * 0.7); c.lineTo(x + k, y); c.closePath(); c.fill(); c.stroke();
    c.restore();
  }

  // Arbre rond (feuillage de saison) ou sapin.
  function arbre(c, x, y, h, sa, k, sapin) {
    c.save();
    c.fillStyle = '#5a3a1e'; c.fillRect(x - h * 0.05, y - h * 0.35, h * 0.1, h * 0.35);
    if (sapin) {
      c.fillStyle = sa.neige ? '#3f6b5a' : '#2f6b3a';
      for (let j = 0; j < 3; j++) {
        c.beginPath(); c.moveTo(x - h * (0.32 - j * 0.07), y - h * (0.25 + j * 0.22)); c.lineTo(x, y - h * (0.62 + j * 0.2)); c.lineTo(x + h * (0.32 - j * 0.07), y - h * (0.25 + j * 0.22)); c.fill();
        if (sa.neige) { c.fillStyle = '#ffffff'; c.beginPath(); c.moveTo(x - h * 0.08, y - h * (0.56 + j * 0.2)); c.lineTo(x, y - h * (0.62 + j * 0.2)); c.lineTo(x + h * 0.08, y - h * (0.56 + j * 0.2)); c.fill(); c.fillStyle = '#3f6b5a'; }
      }
    } else {
      const cc = sa.arbres;
      [[0, -0.62, 0.3], [-0.2, -0.48, 0.22], [0.2, -0.5, 0.23], [0, -0.82, 0.2]].forEach((p, i) => {
        c.fillStyle = cc[(i + k) % cc.length]; rond(c, x + p[0] * h, y + p[1] * h, p[2] * h); c.fill();
      });
      if (sa.neige) { c.fillStyle = '#ffffffcc'; rond(c, x, y - h * 0.93, h * 0.1); c.fill(); }
    }
    c.restore();
  }

  // Petite cabane du garde-manger.
  function gardeManger(c, x, y, h) {
    c.save();
    c.fillStyle = '#8f5a2a'; c.fillRect(x - h * 0.4, y - h * 0.55, h * 0.8, h * 0.55);
    c.fillStyle = '#00000025'; for (let k = 1; k < 4; k++) c.fillRect(x - h * 0.4, y - h * 0.55 + k * h * 0.14, h * 0.8, 2);
    c.fillStyle = '#b84a2a'; c.beginPath(); c.moveTo(x - h * 0.52, y - h * 0.52); c.lineTo(x, y - h * 0.95); c.lineTo(x + h * 0.52, y - h * 0.52); c.fill();
    c.fillStyle = '#3a230f'; rr(c, x - h * 0.13, y - h * 0.36, h * 0.26, h * 0.36, h * 0.12); c.fill();
    c.fillStyle = '#ffd45a'; rond(c, x + h * 0.07, y - h * 0.18, h * 0.025); c.fill();
    c.restore();
  }

  // Fond de la clairière d'une saison (titre et partie).
  function clairiere(c, w, h, sa, ySol) {
    const g = c.createLinearGradient(0, 0, 0, ySol);
    g.addColorStop(0, sa.ciel[0]); g.addColorStop(1, sa.ciel[1]);
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.fillStyle = sa.loin;
    c.beginPath(); c.moveTo(0, ySol);
    for (let x = 0; x <= w; x += w / 8) c.quadraticCurveTo(x + w / 16, ySol - h * 0.12 - (x * 37 % 23), x + w / 8, ySol - h * 0.03);
    c.lineTo(w, ySol); c.fill();
    const n = Math.max(4, Math.round(w / 70)), m = Math.min(w, h);
    for (let k = 0; k < n; k++) arbre(c, (k + 0.5) * w / n + ((k * 53) % 21) - 10, ySol + 4, m * (0.24 + ((k * 31) % 9) / 60), sa, k, k % 3 === 1);
    const gs = c.createLinearGradient(0, ySol, 0, h);
    gs.addColorStop(0, sa.sol); gs.addColorStop(1, sa.sol2);
    c.fillStyle = gs; c.fillRect(0, ySol, w, h - ySol);
    c.fillStyle = '#ffffff1c';
    for (let k = 0; k < 40; k++) { const px = (k * 97) % w, py = ySol + ((k * 61) % Math.max(1, h - ySol)); rond(c, px, py, 2 + (k % 3)); c.fill(); }
  }

  // ---------------------------------------------------------------------
  //  Écran titre (sert aussi de jaquette : aucun texte dans le dessin)
  // ---------------------------------------------------------------------

  let rafTitre = 0;
  const feuillesTitre = [];
  for (let i = 0; i < 18; i++) feuillesTitre.push({ x: Math.random(), y: Math.random(), v: 0.03 + Math.random() * 0.05, a: Math.random() * 6, va: (Math.random() - 0.5) * 2, k: i % 3 });

  function dessinerTitre(t) {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    // Portrait : la scène tient dans la bande libre entre le titre et la consigne.
    const portrait = h > w * 1.2;
    const sa = SAISONS[1], ySol = h * (portrait ? 0.37 : 0.48);
    clairiere(c, w, h, sa, ySol);
    // soleil couchant
    const gs = c.createRadialGradient(w * 0.78, h * 0.16, 4, w * 0.78, h * 0.16, h * 0.18);
    gs.addColorStop(0, '#fff6c4'); gs.addColorStop(1, '#fff6c400');
    c.fillStyle = gs; c.fillRect(0, 0, w, ySol);
    const u = Math.min(w, h * 0.62) / 100;
    gardeManger(c, w * 0.84, ySol + u * 6, u * 22);
    // tronc moussu au milieu
    const yL = h * (portrait ? 0.47 : 0.62);
    c.fillStyle = '#7a4e2a'; rr(c, w * 0.08, yL - u * 5, w * 0.84, u * 10, u * 5); c.fill();
    c.fillStyle = '#5fa64a'; rr(c, w * 0.1, yL - u * 6, w * 0.8, u * 3, u * 1.5); c.fill();
    c.fillStyle = '#c9925a'; c.beginPath(); c.ellipse(w * 0.08 + u * 2, yL, u * 3, u * 5, 0, 0, Math.PI * 2); c.fill();
    // champignons sur le tronc
    const esp = ['cepe', 'girolle', 'tachete', 'rose', 'dore', 'coulemelle', 'pin', 'morille'];
    const nC = w < 500 ? 6 : 8;
    for (let k = 0; k < nC; k++) champ(c, w * 0.16 + k * (w * 0.68 / (nC - 1)), yL - u * 6.5, u * 4.6, esp[k], { t: t });
    escargot(c, w * 0.6, yL - u * 13.5, u * 2.6);
    // quatre hérissons avec leurs paniers
    const pos = portrait ? [[0.2, 0.585], [0.42, 0.565], [0.64, 0.575], [0.86, 0.6]] : [[0.1, 0.8], [0.25, 0.76], [0.74, 0.77], [0.89, 0.8]];
    pos.forEach((p, s) => {
      const hop = Math.max(0, Math.sin(t / 380 + s * 1.7)) * u * 1.6;
      herisson(c, w * p[0] - u * 6, h * p[1] - hop, u * 9.5, COUL[s], s === 0 ? prog.panier : s % PANIERS.length, { plein: 0.4 + s * 0.2, joie: true });
    });
    // feuilles qui tombent
    feuillesTitre.forEach((f) => {
      f.y += f.v * 0.016; f.a += f.va * 0.016;
      if (f.y > 1.05) { f.y = -0.05; f.x = Math.random(); }
      feuille(c, f.x * w + Math.sin(t / 900 + f.a) * 18, f.y * h, u * 2.2, f.a, sa.feuilles[f.k]);
    });
  }
  function animerTitre(t) {
    if (ecran === 'jeu') { rafTitre = 0; return; }
    dessinerTitre(t);
    rafTitre = requestAnimationFrame(animerTitre);
  }

  // ---------------------------------------------------------------------
  //  État de l'écran
  // ---------------------------------------------------------------------

  let ecran = 'titre';
  let partie = null;
  let session = null;          // 'solo' (parcours de niveaux) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let vue = null;              // état affiché (peut être en retard d'un coup pendant une animation)
  let sel = [];                // champignons choisis (indices qui se suivent)
  let curseur = 0;             // champignon visé au clavier
  let clavier = false;         // le curseur ne s'affiche qu'après une flèche du clavier
  let enPartie = false;
  let enPause = false;
  let attenteTuto = false;
  let anim = null;             // coup en cours d'affichage
  let jeton = 0;
  let humainsAvant = null;
  let gainsPartie = [];        // pages d'herbier gagnées pendant la manche
  let debutTour = Date.now();
  let finManche = 0;
  let rafJeu = 0;

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'herbier', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom !== 'jeu') { dessinerTitre(performance.now()); if (!rafTitre) rafTitre = requestAnimationFrame(animerTitre); }
    if (nom === 'titre') majTitre();
    if (nom === 'jeu') { decorCle = ''; relancerBoucle(); }
  }

  function toast(texte, duree) {
    const el = $('toast');

  function monTour() {
    return !!(partie && vue && !vue.fini && !attenteTuto && !enPause && partie.phase === 'jeu' && partie.siege >= 0 && R.aQui(vue) === partie.siege && partie.monTour() && !anim);
  }

  function toucherChamp(i) {
    if (!monTour()) { sons.non(); if (partie && partie.phase === 'jeu' && vue && !vue.fini) toast(tr('jeu.attends')); return; }
    const it = vue.row[i];
    curseur = i;
    if (!it) return;
    if (it.g) { sons.non(); toast(tr('jeu.gele'), 2200); secouer(i); return; }
    const ln = vue.ln;
    if (sel.indexOf(i) >= 0) {
      // reposer un champignon : seulement aux bouts de la suite
      if (i === sel[0] || i === sel[sel.length - 1]) { sel = sel.filter((x) => x !== i); sons.efface(); }
      else { sel = [i]; sons.choix(0); }
    } else if (sel.length && (i === sel[0] - 1 || i === sel[sel.length - 1] + 1)) {
      if (sel.length >= ln) { sons.non(); toast(tr('jeu.max', { n: ln }), 2000); secouer(i); return; }
      sel.push(i); sel.sort((a, b) => a - b); sons.choix(sel.length - 1);

  // Expression de la suite choisie : « 4 + 3 − 2 + 2×2 ».
  function expression(items) {

      if (k === 0) s = (it.k === 't' ? '−' : '') + v;

    });
    return s;
  }

  function majCalcul() {

  let particules = [];

  function fxCanvas() {

  function eclat(x, y, coul, n, type) {

  function dessinerFx(dt) {

      }

    particules.forEach((p) => {
      if (!enPause || !p.doux) {
        p.age += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 2;
        if (p.doux) p.x += Math.sin(p.age * 2 + p.rot) * 0.6;
      }
      c.globalAlpha = Math.max(0, Math.min(1, (p.vie - p.age) * 2));
      if (p.type === 'feuille') feuille(c, p.x, p.y, p.r, p.rot, p.coul);
      else if (p.type === 'goutte') { c.strokeStyle = p.coul; c.lineWidth = 2; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - 3, p.y - 12); c.stroke(); }
      else if (p.type === 'flocon') flocon(c, p.x, p.y, p.r * 0.8);
      else { c.fillStyle = p.coul; c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillRect(-p.r / 2, -p.r / 2, p.r, p.r); c.restore(); }
    });
    c.globalAlpha = 1;
  }

  function relancerBoucle() { if (!rafJeu) { tPrec = 0; rafJeu = requestAnimationFrame(boucle); } }
  let tPrec = 0;
  function boucle(t) {
    rafJeu = 0;
    const dt = tPrec ? Math.min(0.05, (t - tPrec) / 1000) : 0.016;
    tPrec = t;
    if (ecran === 'jeu') { dessinerDecor(); majTemps(); majCompte(); }
    dessinerFx(dt);
    if (ecran === 'jeu' || particules.length) rafJeu = requestAnimationFrame(boucle);
    else fxCanvas().clearRect(0, 0, window.innerWidth, window.innerHeight);
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majMeteo();
    majRangee();
    majCalcul();
    majGrand();
  }

  function majTemps() {
    const barre = $('temps');
    const visible = session === 'ligne' && partie && partie.mode === 'en-ligne' && partie.phase === 'jeu' && vue && !vue.fini && monTour();
    barre.style.visibility = visible ? 'visible' : 'hidden';
    if (!visible) return;
    const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
    barre.firstElementChild.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
    barre.firstElementChild.style.background = reste < 0.25 ? '#ff8a5a' : '#9be27a';
  }

  // ---------------------------------------------------------------------
  //  Affichage d'un coup : la suite s'allume, s'envole vers le panier, puis l'effet
  // ---------------------------------------------------------------------

  // Coup pas fini d'afficher quand un autre arrive : ses effets tout de suite.
  function finirAnim() {
    if (!anim) return;
    clearTimeout(anim.m1); clearTimeout(anim.m2);
    const a = anim;
    anim = null;
    vue = a.apres;
    rangeeCle = '';
    effetCoup({ d: a.coup, apres: a.apres, jeton: a.jeton });
  }
  // Nouvelle manche ou partie quittée : on oublie le coup en cours.
  function annulerAnim() {
    if (!anim) return;
    clearTimeout(anim.m1); clearTimeout(anim.m2);
    anim = null;
  }

  function montrerCoup(d) {
    const qui = nomPhrase(d.s);
    const moi = partie && d.s === partie.siege ? '.toi' : '';
    $('coup').style.setProperty('--c', COUL[d.s]);
    $('coup-qui').textContent = tr('coup.qui' + moi, { nom: qui });
    $('coup-calc').textContent = expression(d.pris) + ' = ' + nb(d.somme);
    let effet = '';
    if (d.plein === 2) effet = tr('coup.dore' + moi, { nom: qui });
    else if (d.plein) effet = tr('coup.plein' + moi, { nom: qui });
    else if (d.renv) effet = tr('coup.renverse' + moi, { nom: qui });
    else effet = tr('jauge', { c: nb(d.apres), T: nb(vue ? vue.T : 10) });
    $('coup-effet').textContent = effet;
    $('coup').classList.add('actif');
    clearTimeout(montrerCoup.m);
    montrerCoup.m = setTimeout(() => $('coup').classList.remove('actif'), 1500);
  }

  function voler(d) {
    const cible = $('place-' + d.s);
    if (!cible) return;
    const [cx, cy] = centre(cible);
    const boutons = $('rangee').querySelectorAll('.champ');
    for (let k = d.d; k < d.d + d.n; k++) {
      const b = boutons[k];
      if (!b) continue;
      const r = b.getBoundingClientRect();
      const el = document.createElement('div');
      el.className = 'vol';
      el.style.left = (r.left + r.width / 2 - 20) + 'px';
      el.style.top = (r.top + 4) + 'px';
      const cv = document.createElement('canvas'); cv.width = 80; cv.height = 88;
      champ(cv.getContext('2d'), 40, 58, 26, especeDe(d.pris[k - d.d]));
      el.appendChild(cv);
      document.body.appendChild(el);
      const dx = cx - (r.left + r.width / 2), dy = cy - (r.top + 26);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        el.style.transitionDelay = ((k - d.d) * 70) + 'ms';
        el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.35) rotate(' + (dx > 0 ? 200 : -200) + 'deg)';
        el.style.opacity = '0.2';
      }));
      setTimeout(() => el.remove(), 800 + (k - d.d) * 70);
    }
  }

  // Effet sur le panier une fois les champignons arrivés, puis le tour de table.
  function effetCoup(a) {
    const d = a.d;
    const place = $('place-' + d.s);
    if (place) {
      const p = centre(place);
      if (d.plein) {
        place.classList.remove('bond'); void place.offsetWidth; place.classList.add('bond');
        eclat(p[0], p[1], d.plein === 2 ? '#ffd45a' : COUL[d.s], d.plein === 2 ? 40 : 24);
        if (d.plein === 2) sons.dore(); else sons.plein();
      } else if (d.renv) {
        place.classList.remove('renverse'); void place.offsetWidth; place.classList.add('renverse');
        eclat(p[0], p[1] + 10, '#c98b4a', 14, 'feuille');
        sons.renverse();
      } else sons.tombe();
    }
    const ev = a.apres.ev;
    if (ev) {
      let t = 250;
      if (ev.pluie) { setTimeout(() => { if (a.jeton !== jeton) return; averse(); sons.pluie(); toast(tr('ev.pluie'), 2200); }, t); t += 500; }
      if (ev.grignote.length) setTimeout(() => { if (a.jeton !== jeton) return; sons.croque(); if (ev.mange.length) toast(tr('ev.mange'), 2200); else if (!ev.pluie) toast(tr('ev.escargot'), 1800); }, t);
      if (ev.givre) setTimeout(() => { if (a.jeton !== jeton) return; scintiller(); sons.givre(); }, t + 300);
    }
    majInterface();
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    anim = null; sel = []; rangeeCle = ''; meteoCle = '';
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // Salon d'attente (en ligne) : le premier joueur arrivé lance la manche.
  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + panierDe(s);
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 120, 96);
        c.fillStyle = COUL[s] + '33'; rond(c, 60, 56, 38); c.fill();
        herisson(c, 44, 84, 30, COUL[s], panierDe(s), { joie: role !== 'robot' });
        if (info.chef) couronne(c, 46, 26, 16);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { herisson: tr('herisson.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomChef ? nomChef : tr('herisson.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    annulerAnim();
    vue = JSON.parse(JSON.stringify(partie.etat));
    anim = null; sel = []; curseur = 0; rangeeCle = ''; meteoCle = ''; nouveaux = []; marques = {};
    debutTour = Date.now();
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    gainsPartie = [];
    if (partie.siege >= 0) bandeau('');
    decorCle = '';
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche }) + ' · ' + tr('meteo.panier', { T: nb(vue.T) })); sons.tour(); }
    else {
      enPartie = true;
      const d = NIVEAUX[niveau - 1];
      toast(tr('debut.objectif', { T: nb(d.T), n: d.obj }), 3000);
    }
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    if (partie.siege >= 0 && R.aQui(vue) === partie.siege) setTimeout(() => sons.tour(), 400);
  }

  function surAction(ev) {
    finirAnim();
    const avant = ev.avant, apres = ev.apres, d = apres.der;
    debutTour = Date.now();
    if (!d) { vue = JSON.parse(JSON.stringify(apres)); return; }
    // phase 1 : la suite prise s'allume à la couleur du hérisson (sur la rangée d'avant)
    vue = JSON.parse(JSON.stringify(avant));
    vue.der = null;
    anim = { s: d.s, d: d.d, n: d.n, phase: 1, apres: JSON.parse(JSON.stringify(apres)), jeton: jeton, coup: d };
    if (ev.moi && d) gagnerHerbier(d);
    const attente = ev.moi ? 120 : 480;
    rangeeCle = '';
    majRangee();
    montrerCoup(d);
    anim.m1 = setTimeout(() => {
      if (!anim || anim.jeton !== jeton) return;
      voler(d);
      // phase 2 : la rangée se resserre, de nouveaux champignons poussent
      const ap = anim.apres;
      nouveaux = [];
      for (let k = ap.row.length - d.n; k < ap.row.length; k++) nouveaux.push(k);
      if (ap.ev) {
        ap.ev.grignote.forEach((i) => { marques[i] = 'grignote'; });
        ap.ev.mange.forEach((i) => { if (nouveaux.indexOf(i) < 0) nouveaux.push(i); });
        if (ap.ev.pluie) ap.row.forEach((_, i) => { if (!marques[i]) marques[i] = 'mouille'; });
      }
      vue = ap;
      anim.phase = 2;
      rangeeCle = '';
      majInterface();
      anim.m2 = setTimeout(() => {
        if (!anim || anim.jeton !== jeton) return;
        const fini = anim;
        anim = null;
        effetCoup({ d: fini.coup, apres: fini.apres, jeton: fini.jeton });
        if (partie && partie.phase === 'jeu' && !vue.fini && R.aQui(vue) === partie.siege && partie.siege >= 0) { sons.tour(); curseur = Math.min(curseur, vue.row.length - 1); }
        majInterface();
      }, 520);
    }, attente);
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (apres.rd > avant.rd && !apres.fini && apres.rd === apres.tours - 1) { const j = jeton; setTimeout(() => { if (j === jeton) toast(tr('ev.dernier'), 2000); }, 1400); }
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (anim) finirAnim();
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1700);
  }

  // ---------------------------------------------------------------------
  //  Herbier
  // ---------------------------------------------------------------------

  function noterEspece(id) {
    const avant = prog.herbier[id] || 0;
    prog.herbier[id] = Math.min(9999, avant + 1);
    if (avant === 0) {
      if (gainsPartie) gainsPartie.push(id);
      setTimeout(() => { toast(tr('herbier.nouveau', { nom: tr('esp.' + id) }), 3000); sons.herbier(); }, 1100);
      return true;
    }
    return false;
  }
  function gagnerHerbier(d) {
    let nouveau = false;
    d.pris.forEach((it) => {
      if (noterEspece(especeDe(it))) nouveau = true;
      if (it.m === 1 && it.k !== 'p' && noterEspece('grignote')) nouveau = true;
    });
    // En ligne, rien d'autre n'est sauvegardé : on garde la page d'herbier tout de suite.
    if (nouveau && session === 'ligne' && window.JEL_SAVE.existe(JEU)) sauver(prog.reprise, 0);
  }

  // ---------------------------------------------------------------------
  //  Fins de niveau : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function premier(e, moi) {
    const res = R.fin(e);
    if (!res || moi < 0) return false;
    const t = res.classement[0];
    return t === moi || (e.pp[t] === e.pp[moi] && e.c[t] === e.c[moi] && e.rv[t] === e.rv[moi]);
  }

  function etoilesPour(e, moi, gagne) {
    if (!gagne) return 0;
    const obj = NIVEAUX[e.n].obj;
    if (e.pp[moi] >= obj && e.rv[moi] === 0) return 3;
    return e.pp[moi] >= obj ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      const cle = e.pp[s] + '|' + e.c[s] + '|' + e.rv[s];
      if (cle !== prec) { rang = k + 1; prec = cle; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 88; cv.height = 60;
      herisson(cv.getContext('2d'), 32, 56, 24, COUL[s], panierDe(s), { joie: rang === 1 });
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.court', { n: e.pp[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = premier(e, moi);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.pp[moi] : 0;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.paniers', { n: pts }) + (e.rv[moi] ? ' · ' + tr('fin.renverses', { n: e.rv[moi] }) : '') : '';
    if (session === 'solo') {
      const gagne = premier(e, moi) && pts >= 1;
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(e, moi, gagne);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      const paniersAvant = PANIERS.filter((x) => x.etoiles <= totalEtoiles()).length;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else sauver(niveau, pts);
      const paniersApres = PANIERS.filter((x) => x.etoiles <= totalEtoiles()).length;
      $('fin-titre').textContent = gagne ? tr('fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      let deb = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      if (gagne && niveau % 5 === 0 && niveau < NIVEAUX.length && debloque) deb = tr('fin.saison', { saison: tr('saison.' + saisonDe(niveau + 1)) });
      if (paniersApres > paniersAvant) deb += (deb ? ' ' : '') + tr('fin.panier');

    }

  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés : une rangée, une main qui touche les champignons,
  //  la somme qui s'écrit et le panier qui se remplit.
  // ---------------------------------------------------------------------

  // row : [type, nombre, gelé] ; c0 : panier au départ ; choix : champignons pris.
  const TUTOS = {
    base: { row: [['c', 3], ['c', 4], ['c', 2], ['c', 1], ['c', 4]], T: 10, c0: 4, choix: [1, 2] },
    trois: { row: [['c', 2], ['c', 3], ['c', 1], ['c', 4], ['c', 2]], T: 10, c0: 2, choix: [1, 2, 3] },
    quinze: { row: [['c', 5], ['c', 4], ['c', 6], ['c', 2], ['c', 3]], T: 15, c0: 5, choix: [1, 2] },
    tachete: { row: [['c', 4], ['t', 2], ['c', 3], ['c', 5], ['c', 1]], T: 10, c0: 9, choix: [1, 2] },
    escargot: { row: [['c', 3], ['c', 2], ['c', 4], ['c', 5]], T: 10, c0: 6, choix: [0, 1], escargot: 1 },
    vingt: { row: [['c', 6], ['c', 7], ['c', 3], ['c', 5], ['c', 2]], T: 20, c0: 10, choix: [1, 2] },
    pluie: { row: [['c', 2], ['c', 3], ['c', 4], ['c', 1]], T: 10, c0: 5, choix: [2], pluie: true },
    pin: { row: [['c', 3], ['p', 2], ['c', 1], ['c', 6]], T: 10, c0: 5, choix: [1, 2] },
    dore: { row: [['c', 2], ['o', 3], ['c', 4], ['c', 5]], T: 10, c0: 3, choix: [1, 2] },
    givre: { row: [['c', 4], ['c', 6, 1], ['c', 2], ['c', 3, 1], ['c', 1]], T: 10, c0: 8, choix: [2], refus: 1 }
  };

  let tutoNumero = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    const numero = ++tutoNumero;
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const W = 560, H = 330, n = d.row.length, dx = 96, x0 = W / 2 - (n - 1) * dx / 2, yC = 150;
    const debut = performance.now();
    // Temps : pluie ou escargot (0-1400), refus d'un gelé, choix, envol, panier.
    const T0 = d.pluie || d.escargot !== undefined ? 1500 : 300;
    const TR = d.refus !== undefined ? 900 : 0;
    const T_CH = 800;
    const T_GO = T0 + TR + d.choix.length * T_CH + 400;
    const T_FIN = T_GO + 900, T_BOUCLE = T_FIN + 2200;
    const valeur = (i, t) => {
      let v = d.row[i][1];
      if (d.pluie && t > 900) v += 1;
      if (d.escargot === i && t > 900) v -= 1;
      return v;
    };
    const apportT = (i, t) => { const k = d.row[i][0], v = valeur(i, t); return k === 't' ? -v : (k === 'p' ? 2 * v : v); };
    function image(now) {
      if (!$('voile-tuto').classList.contains('actif') || numero !== tutoNumero) return;
      const t = (now - debut) % T_BOUCLE;
      c.setTransform(1, 0, 0, 1, 0, 0);
      clairiere(c, W, H, SAISONS[1], 110);
      c.fillStyle = '#7a4e2a'; rr(c, 20, yC + 32, W - 40, 22, 11); c.fill();
      c.fillStyle = '#5fa64a'; rr(c, 26, yC + 29, W - 52, 6, 3); c.fill();
      if (d.pluie && t < 1300 && t > 200) {
        nuage(c, W / 2, 40, 40, false);
        c.strokeStyle = '#7fb6ff'; c.lineWidth = 3;
        for (let k = 0; k < 14; k++) { const px = W / 2 - 60 + k * 9, py = 70 + ((t / 2 + k * 37) % 90); c.beginPath(); c.moveTo(px, py); c.lineTo(px - 3, py - 12); c.stroke(); }
      }
      // choisis jusqu'ici
      let pris = 0;
      const tc = t - T0 - TR;
      if (tc > 0) pris = Math.min(d.choix.length, Math.floor(tc / T_CH) + (tc % T_CH > T_CH * 0.7 ? 1 : 0));
      const envol = t > T_GO ? Math.min(1, (t - T_GO) / 700) : 0;
      const panierX = W - 80, panierY = 270;
      for (let i = 0; i < n; i++) {
        const k = d.row[i][0], idx = d.choix.indexOf(i), choisi = idx >= 0 && idx < pris;
        let x = x0 + i * dx, y = yC + 20;
        if (choisi && envol > 0) { x += (panierX - x) * envol; y += (panierY - 30 - y) * envol - Math.sin(envol * Math.PI) * 80; }
        if (choisi && envol >= 1) continue;
        if (choisi && !envol) { c.fillStyle = '#ffd45a66'; rr(c, x - 38, y - 70, 76, 108, 14); c.fill(); c.strokeStyle = '#ffd45a'; c.lineWidth = 3; c.stroke(); }
        if (d.row[i][2]) { c.fillStyle = '#cfe9ff88'; rr(c, x - 38, y - 70, 76, 108, 14); c.fill(); c.strokeStyle = '#bfe4ff'; c.lineWidth = 3; c.stroke(); }
        const esp = k === 't' ? 'tachete' : k === 'p' ? 'pin' : k === 'o' ? 'dore' : NORMAUX[Math.max(1, Math.min(7, valeur(i, t))) - 1];
        const sh = d.refus === i && t > T0 && t < T0 + TR ? Math.sin(t / 30) * 5 : 0;
        champ(c, x + sh, y - 14, 38 * (1 - envol * 0.5), esp, { t: now, croque: d.escargot === i && t > 900, fondCroque: '#c99a5a' });
        if (d.escargot === i && t < 1100) escargot(c, x - 4, y - 74, 16);
        if (!(choisi && envol > 0)) {
          c.fillStyle = k === 't' ? '#ffd9d4' : '#fff8ea'; rr(c, x - 30, y + 4, 60, 34, 10); c.fill();
          c.fillStyle = k === 't' ? '#8f1f15' : '#3a2200'; c.font = '900 26px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
          c.fillText((k === 't' ? '−' : '') + nb(valeur(i, t)) + (k === 'p' ? '×2' : ''), x, y + 22);
        }
      }
      // panier et jauge
      let somme = 0;
      for (let q = 0; q < pris; q++) somme += apportT(d.choix[q], t);
      const rempli = envol >= 1 ? d.c0 + somme : d.c0;
      const plein = envol >= 1 && rempli === d.T;
      panier(c, panierX, panierY, 46, prog.panier, rempli / d.T);
      c.fillStyle = '#00000066'; rr(c, 40, 286, 360, 22, 11); c.fill();
      c.fillStyle = plein ? '#9be27a' : '#ffd45a'; rr(c, 40, 286, 360 * Math.min(1, rempli / d.T), 22, 11); c.fill();
      c.fillStyle = '#fff8ea'; c.font = '900 22px system-ui, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
      c.fillText(nb(rempli) + ' / ' + nb(d.T), 50, 266);
      if (pris > 0) {
        // panier de départ, puis chaque champignon pris : « 9 − 2 + 3 = 10 »
        let txt = nb(d.c0);
        for (let q = 0; q < pris; q++) {
          const i = d.choix[q], k = d.row[i][0], v = valeur(i, t);
          txt += (k === 't' ? ' − ' : ' + ') + nb(v) + (k === 'p' ? '×2' : '');
        }
        if (pris === d.choix.length) txt += ' = ' + nb(d.c0 + somme);
        c.fillStyle = '#2a1c10dd'; rr(c, W / 2 - 170, 8, 340, 46, 14); c.fill();
        c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#ffd45a'; c.font = '900 30px system-ui, sans-serif';
        c.fillText(txt, W / 2, 32);
      }
      if (plein) {
        const p = Math.min(1, (t - T_FIN) / 600);
        for (let k = 0; k < 10; k++) { c.fillStyle = k % 2 ? '#ffd45a' : '#9be27a'; c.fillRect(panierX + Math.cos(k) * p * 70, panierY - 20 - p * 60 + Math.sin(k * 2) * 20, 6, 6); }
        if (d.row.some((x) => x[0] === 'o')) panier(c, panierX - 100, panierY, 36, prog.panier, 1);
      }
      // main qui touche
      let hx = W / 2, hy = 330, appui = false;
      const cible = (i) => [x0 + i * dx + 6, yC + 26];
      if (d.refus !== undefined && t > T0 && t < T0 + TR) { const p = cible(d.refus); hx = p[0]; hy = p[1]; appui = true; }
      else if (tc > 0 && t < T_GO) {
        const q = Math.min(d.choix.length - 1, Math.floor(tc / T_CH)), k = (tc % T_CH) / T_CH;
        const p1 = cible(d.choix[q]), p0 = q > 0 ? cible(d.choix[q - 1]) : [W / 2, 330];
        hx = p0[0] + (p1[0] - p0[0]) * Math.min(1, k * 1.4); hy = p0[1] + (p1[1] - p0[1]) * Math.min(1, k * 1.4); appui = k > 0.7;
      }
      if (t < T_GO) main(c, hx, hy, appui);
      requestAnimationFrame(image);
    }
    requestAnimationFrame(image);
    $('btn-tuto-ok').onclick = () => {
      audio();
      $('btn-tuto-ok').onclick = null;
      fermerVoile('voile-tuto');
      sons.clic();
      apres();
    };
  }

  // Main dessinée (index tendu) pour les tutoriels.
  function main(c, x, y, appui) {
    c.save(); c.translate(x, y); c.scale(appui ? 0.92 : 1, appui ? 0.92 : 1);
    c.fillStyle = '#ffe0c2'; c.strokeStyle = '#7a4a2a'; c.lineWidth = 2.5;
    c.beginPath();
    c.moveTo(-6, 0); c.lineTo(-6, 24); c.quadraticCurveTo(-18, 22, -16, 36); c.lineTo(-4, 52); c.lineTo(20, 52);
    c.quadraticCurveTo(28, 40, 26, 26); c.lineTo(26, 18); c.quadraticCurveTo(20, 14, 16, 18); c.lineTo(16, 14);
    c.quadraticCurveTo(10, 10, 6, 14); c.lineTo(6, 0); c.quadraticCurveTo(0, -8, -6, 0); c.closePath();
    c.fill(); c.stroke();
    if (appui) { c.strokeStyle = '#ffd45a'; c.lineWidth = 3; rond(c, 0, -6, 16); c.stroke(); }
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Commandes : toucher et clavier
  // ---------------------------------------------------------------------

  document.addEventListener('pointerdown', () => { if (clavier) { clavier = false; rangeeCle = ''; } }, true);
  $('btn-cueillir').addEventListener('click', () => { audio(); cueillir(); });
  $('btn-effacer').addEventListener('click', () => { audio(); effacer(); });

  function focusChamp(i) {
    if (!vue) return;
    curseur = Math.max(0, Math.min(vue.row.length - 1, i));
    majRangee(true);
    const b = $('rangee').querySelector('[data-i="' + curseur + '"]');
    if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape' || ev.code === 'NumpadEnter') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const actif = document.activeElement;
    const surChamp = actif && actif.classList && actif.classList.contains('champ');
    if (ev.code === 'ArrowLeft' || ev.code === 'ArrowRight') {
      ev.preventDefault(); audio();
      clavier = true;
      focusChamp((surChamp ? Number(actif.dataset.i) : curseur) + (ev.code === 'ArrowLeft' ? -1 : 1));
      return;
    }
    if (ev.code === 'Space') {
      if (surChamp) return;              // le bouton du champignon fait le travail
      ev.preventDefault(); audio(); toucherChamp(curseur); return;
    }
    if (ev.code === 'Backspace' || ev.code === 'Delete') { ev.preventDefault(); audio(); effacer(); return; }
    if (ev.code === 'Enter' || ev.code === 'NumpadEnter') {
      if (actif && actif.tagName === 'BUTTON' && !surChamp && actif !== $('btn-cueillir')) return;
      ev.preventDefault(); audio(); cueillir();
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-herbier').addEventListener('click', () => { audio(); sons.clic(); ouvrirHerbier(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('herbier-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.pp[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { decorCle = ''; if (ecran !== 'jeu') dessinerTitre(performance.now()); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
