  o.boutons.forEach(([cle, cls, f]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'bouton ' + cls; b.textContent = tr(cle); b.addEventListener('click', () => { sons.toucher(); f(); }); zb.appendChild(b); });
  $('voile-fin').classList.add('actif');
  // Score qui défile, puis étoiles une à une.
  const debut = performance.now();
  const pas = (now) => { const k = Math.min(1, (now - debut) / 900); $('score-fin').textContent = nb(Math.round(E.score * k)); if (k < 1) requestAnimationFrame(pas); };
  requestAnimationFrame(pas);
  ge.querySelectorAll('svg').forEach((s, i) => { if (i < o.etoiles) setTimeout(() => { s.classList.add('gagne'); sons.etoile(i); }, 500 + i * 350); });
  setTimeout(() => { const b = zb.querySelector('button'); if (b) b.focus(); }, 200);
}
function fermerVoiles() { document.querySelectorAll('.voile').forEach((v) => v.classList.remove('actif')); }

/* ---------- Navigation ---------- */
function allerTitre() {
  arreterConcert(); montrer('titre'); majTitre();
  setTimeout(() => $('btn-jouer').focus(), 50);
}
function allerConcerts() {
  arreterConcert(); construireConcerts(); montrer('concerts');
  setTimeout(() => { const d = document.querySelector('.pupitre.dernier') || document.querySelector('.pupitre'); if (d) d.focus(); }, 50);
}
function arreterConcert() {
  annulerTout(); fermerVoiles(); cacherTuto(); quitterPause(true); introCourante = null;
  E.enConcert = false; E.question = null; E.joue = false;
  if (ctx) nouveauCanal();
}

/* ---------- Pause ---------- */
function mettrePause() {
  if (ecran !== 'jeu' || enPause || !E.enConcert) return;
  enPause = true;
  figerMinuteurs();
  if (ctx) ctx.suspend().catch(() => {});
  document.body.classList.add('fige');
  $('voile-pause').classList.add('actif');
  setTimeout(() => $('btn-reprendre').focus(), 30);
}
function quitterPause(sansReprise) {
  if (!enPause) return;
  enPause = false;
  document.body.classList.remove('fige');
  $('voile-pause').classList.remove('actif');
  if (ctx) ctx.resume().catch(() => {});
  if (!sansReprise) relancerMinuteurs();
}

/* ---------- Fiches « Nouveau ! » (tutoriel animé) ---------- */
function introsPour(niv) {
  const liste = [], vus = progres.vus;
  const marquer = (...cles) => cles.forEach((c) => { if (!vus.includes(c)) vus.push(c); });
  const nouveauxInstr = niv.instr.filter((i) => !vus.includes(i));
  niv.types.filter((t, i, l) => l.indexOf(t) === i).forEach((t) => {
    if (t === 'famille') {
      if (!vus.includes('famille')) { liste.push(intro('famille', niv.instr)); marquer('famille', ...niv.instr); }
      else if (nouveauxInstr.length) { liste.push(intro('instruments', nouveauxInstr)); marquer(...nouveauxInstr); }
    } else if (t === 'melodie') {
      if (niv.formes === 4 && !vus.includes('formes')) { liste.push(intro('formes')); marquer('formes', 'melodie'); }
      else if (!vus.includes('melodie')) { liste.push(intro('melodie')); marquer('melodie'); }
    } else if (t === 'pareil') {
      if (niv.diff === 'petite' && !vus.includes('petite')) { liste.push(intro('petite')); marquer('petite', 'pareil'); }
      else if (!vus.includes('pareil')) { liste.push(intro('pareil')); marquer('pareil'); }
    } else if (!vus.includes(t)) { liste.push(intro(t, niv.instr)); marquer(t); }
  });
  // Nouvel instrument dans un concert sans question « famille » : présenté quand même.
  const restants = niv.instr.filter((i) => !vus.includes(i));
  if (restants.length && vus.includes('famille')) { liste.push(intro('instruments', restants)); marquer(...restants); }
  if (liste.length) ecrireProgres();
  return liste;
}
// Démonstration : chaque carte s'éclaire pendant qu'on entend le son qui lui correspond.
function intro(type, instr) {
  const ins = (instr || []).filter((i) => !INSTRUMENTS[i].perc);
  const mel = ins.length ? ins[ins.length - 1] : 'xylophone';
  const poly = (instr || []).filter((i) => POLYVALENTS.includes(i)).pop() || 'xylophone';
  switch (type) {
    case 'famille': case 'instruments':
      return { titre: tr('intro.' + type + '.titre'), texte: tr('intro.' + type + '.texte'), demos: instr.map((i) => ({ carte: carteInstr(i), jouer: (t) => phrase(i, t) })) };
    case 'hauteur':
      return { titre: tr('intro.hauteur.titre'), texte: tr('intro.hauteur.texte'), demos: [
        { carte: carteRep('aigu'), jouer: (t) => { note(poly, 86, t, 0.6); note(poly, 86, t + 0.7, 0.6); return 1.8; } },
        { carte: carteRep('grave'), jouer: (t) => { note(poly, 50, t, 0.6); note(poly, 50, t + 0.7, 0.6); return 1.8; } }] };
    case 'melodie':
      return { titre: tr('intro.melodie.titre'), texte: tr('intro.melodie.texte'), demos: [
        { carte: carteRep('monte'), jouer: (t) => suite(mel, [0, 2, 4, 7].map((d) => 67 + degre(d)), t) },
        { carte: carteRep('descend'), jouer: (t) => suite(mel, [7, 4, 2, 0].map((d) => 67 + degre(d)), t) }] };
    case 'formes':
      return { titre: tr('intro.formes.titre'), texte: tr('intro.formes.texte'), demos: [
        { carte: carteRep('monte'), jouer: (t) => suite(mel, [0, 2, 4, 6].map((d) => 67 + degre(d)), t) },
        { carte: carteRep('descend'), jouer: (t) => suite(mel, [6, 4, 2, 0].map((d) => 67 + degre(d)), t) },
        { carte: carteRep('colline'), jouer: (t) => suite(mel, [0, 2, 4, 2, 0].map((d) => 67 + degre(d)), t) },
        { carte: carteRep('vallee'), jouer: (t) => suite(mel, [6, 4, 2, 4, 6].map((d) => 67 + degre(d)), t) }] };
    case 'compare':
      return { titre: tr('intro.compare.titre'), texte: tr('intro.compare.texte'), demos: [
        { carte: carteRep('plusAigu'), jouer: (t) => { note(poly, 64, t, 0.6); note(poly, 74, t + 0.85, 0.7); return 2; } },
        { carte: carteRep('plusGrave'), jouer: (t) => { note(poly, 72, t, 0.6); note(poly, 62, t + 0.85, 0.7); return 2; } }] };
    case 'compte':
      return { titre: tr('intro.compte.titre'), texte: tr('intro.compte.texte'), demos: [2, 3].map((k) => ({
        carte: { id: 'n' + k, dessin: () => dessinPoints(k), etiquette: () => nb(k) },
        jouer: (t) => { for (let i = 0; i < k; i++) note(mel, 72, t + i * 0.5, 0.3); return k * 0.5 + 0.5; } })) };
    case 'tempo':
      return { titre: tr('intro.tempo.titre'), texte: tr('intro.tempo.texte'), demos: [
        { carte: carteRep('lent'), jouer: (t) => suite(mel, [0, 2, 4, 2, 0].map((d) => 67 + degre(d)), t, 0.62) },
        { carte: carteRep('rapide'), jouer: (t) => suite(mel, [0, 2, 4, 2, 0, 2, 4, 2, 0].map((d) => 67 + degre(d)), t, 0.17) }] };
    case 'pareil': case 'petite': {
      const ecart = type === 'petite' ? 2 : 7;
      return { titre: tr('intro.' + type + '.titre'), texte: tr('intro.' + type + '.texte'), demos: [
        { carte: carteRep('pareil'), jouer: (t) => { suite(mel, [67, 71, 74], t, 0.36); suite(mel, [67, 71, 74], t + 1.5, 0.36); return 3; } },
        { carte: carteRep('different'), jouer: (t) => { suite(mel, [67, 71, 74], t, 0.36); suite(mel, [67, 71 + ecart, 74], t + 1.5, 0.36); return 3; } }] };
    }
    case 'silence': {
      const membres = (instr || ['tambour', 'flute', 'violon']).slice(0, 3);
      return { titre: tr('intro.silence.titre'), texte: tr('intro.silence.texte'), demos: membres.map((i) => ({
        carte: { id: i, dessin: () => svgAnimal(INSTRUMENTS[i].animal, i), etiquette: ETIQ('instr.' + i) },
        jouer: (t) => { partie(i, t, 0, 0.9); return 2.3; } })) };
    }
  }
  return null;
}
let introCourante = null;
function montrerIntro(def, suite) {
  if (!def) { suite(); return; }
  introCourante = { def, suite, minuteurs: [] };
  $('titre-intro').textContent = def.titre;
  $('texte-intro').textContent = def.texte;
  const demo = $('demo-intro');
  demo.className = 'demo n' + def.demos.length;
  demo.innerHTML = '';
  def.demos.forEach((d, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'carte'; b.tabIndex = -1;
    b.innerHTML = d.carte.dessin() + `<span class="etiquette">${d.carte.etiquette()}</span>`;
    b.setAttribute('aria-label', d.carte.etiquette());
    b.addEventListener('click', () => jouerDemo(i));
    demo.appendChild(b);
  });
  $('main-intro').innerHTML = svg('0 0 100 100', ICONES.main);
  $('voile-intro').classList.add('actif');
  sons.nouveau();
  setTimeout(() => $('btn-compris').focus(), 30);
  introCourante.minuteurs.push(attendre(900, () => demoEnChaine(0)));
}
// Une démonstration après l'autre, la main se posant sur chaque carte.
function demoEnChaine(i) {
  if (!introCourante) return;
  const def = introCourante.def;
  if (i >= def.demos.length) { $('main-intro').classList.remove('visible'); $('btn-compris').classList.add('secousse'); return; }
  const duree = jouerDemo(i);
  introCourante.minuteurs.push(attendre(duree * 1000 + 450, () => demoEnChaine(i + 1)));
}
function jouerDemo(i) {
  if (!introCourante || !audio()) return 1;
  const cartes = $('demo-intro').querySelectorAll('.carte');
  cartes.forEach((c, k) => c.classList.toggle('eclaire', k === i));
  const c = cartes[i], main = $('main-intro'), boite = main.parentElement.getBoundingClientRect(), r = c.getBoundingClientRect();
  main.style.left = (r.left - boite.left + r.width * 0.55) + 'px';
  main.style.top = (r.top - boite.top + r.height * 0.45) + 'px';
  main.classList.add('visible');
  nouveauCanal();
  const duree = introCourante.def.demos[i].jouer(ctx.currentTime + 0.05);
  const ici = introCourante;
  ici.minuteurs.push(attendre(duree * 1000, () => { if (introCourante === ici) c.classList.remove('eclaire'); }));
  return duree;
}
function fermerIntro() {
  if (!introCourante) return;
  const { suite, minuteurs: m } = introCourante;
  m.forEach(annuler);
  introCourante = null;
  $('btn-compris').classList.remove('secousse');
  $('main-intro').classList.remove('visible');
  $('voile-intro').classList.remove('actif');
  if (ctx) nouveauCanal();
  sons.toucher();
  suite();
}
function revoirIntro() {
  if (!introCourante) return;
  introCourante.minuteurs.forEach(annuler); introCourante.minuteurs = [];
  demoEnChaine(0);
}

/* ---------- Tutoriel du premier concert : la main montre le geste ---------- */
function montrerTuto() {
  if (!E.enConcert || E.iq !== 0) return;
  E.tuto = true;
  const main = $('main-tuto'), bulle = $('bulle-tuto'), app = $('app').getBoundingClientRect();
  main.innerHTML = svg('0 0 100 100', ICONES.main);
  const placer = (el, texte) => {
    if (!E.tuto) return;
    const r = el.getBoundingClientRect();
    main.style.left = (r.left - app.left + r.width * 0.6) + 'px'; main.style.top = (r.top - app.top + r.height * 0.4) + 'px';
    main.classList.add('visible');
    bulle.textContent = texte; bulle.style.top = Math.max(8, r.top - app.top - 60) + 'px'; bulle.classList.add('visible');
  };
  placer($('btn-ecouter'), tr('tuto.ecoute'));
  const etape2 = () => {
    if (!E.tuto) return;
    if (!E.peutRepondre) { attendre(400, etape2); return; }
    placer($('reponses'), tr('tuto.touche'));
  };
  attendre(1800, etape2);
}
function cacherTuto(fait) {
  if (E.tuto && fait && !progres.vus.includes('tuto')) { progres.vus.push('tuto'); ecrireProgres(); }
  E.tuto = false;
  $('main-tuto').classList.remove('visible'); $('bulle-tuto').classList.remove('visible');
}

/* ---------- Salle de répétition ---------- */
let instrRepet = 'flute';
const COULEURS_TOUCHES = ['#e5585a', '#f59a3e', '#f4c64e', '#8fd16a', '#3fb37f', '#4ab3d9', '#4a7fd9', '#8e6bd6'];
function construireRepet() {
  if (!instrumentDebloque(instrRepet)) instrRepet = 'flute';
  const z = $('tuiles'); z.innerHTML = '';
  ORDRE_INSTR.forEach((i) => {
    const b = document.createElement('button'); b.type = 'button';
    const ok = instrumentDebloque(i);
    b.className = 'tuile' + (ok ? '' : ' fermee') + (i === instrRepet ? ' choisie' : '');
    const b2 = INSTRUMENTS[i].bonus;
    b.innerHTML = dessinInstr(i) + `<span>${ok ? tr('instr.' + i) : (b2 ? tr('bonusFerme', { n: nb(b2) }) : tr('instrFerme'))}</span>`;
    b.setAttribute('aria-label', ok ? tr('instr.' + i) : tr('instr.' + i) + ' · ' + (b2 ? tr('bonusFerme', { n: nb(b2) }) : tr('instrFerme')));
    b.disabled = !ok;
    b.addEventListener('click', () => { instrRepet = i; construireRepet(); audio(); phrase(i, ctx ? ctx.currentTime + 0.02 : 0); });
    z.appendChild(b);
  });
  $('scene-repet').innerHTML = svgAnimal(INSTRUMENTS[instrRepet].animal, instrRepet) + dessinInstr(instrRepet);
  $('aide-repet').textContent = tr('repet.aide');
  const c = $('clavier');
  if (!c.children.length) {
    COULEURS_TOUCHES.forEach((col, k) => {
      const t = document.createElement('button'); t.type = 'button'; t.className = 'touche'; t.style.background = col;
      t.dataset.k = k;
      t.addEventListener('pointerdown', (e) => { e.preventDefault(); toucheRepet(k); });
      t.addEventListener('click', (e) => { if (e.detail === 0) toucheRepet(k); });
      c.appendChild(t);
    });
  }
  c.querySelectorAll('.touche').forEach((t, k) => t.setAttribute('aria-label', tr('toucheN', { n: nb(k + 1) })));
}
function noteRepet(k) { const i = instrRepet, info = INSTRUMENTS[i]; return info.perc ? 38 + k * 3 : info.base + degre(k); }
function toucheRepet(k, t) {
  if (!audio()) return;
  note(instrRepet, noteRepet(k), t || ctx.currentTime + 0.01, 0.45, 1, sortie);
  const touche = $('clavier').children[k];
  const delai = t ? (t - ctx.currentTime) * 1000 : 0;
  setTimeout(() => { touche.classList.add('appuie'); setTimeout(() => touche.classList.remove('appuie'), 180); }, Math.max(0, delai));
  const s = $('scene-repet').firstElementChild;
  if (s) { s.classList.remove('secousse'); void s.getBoundingClientRect(); s.classList.add('secousse'); }
}
// Le chef joue un petit air (composé pour le jeu) sur l'instrument choisi.
const AIR = [[0, 0], [2, 1], [4, 2], [4, 3], [5, 4], [4, 5], [2, 6], [4, 7], [7, 8.5], [5, 9.5], [4, 10.5], [2, 11.5], [0, 12.5]];
function airDuChef() {
  if (!audio()) return;
  const t0 = ctx.currentTime + 0.1;
  AIR.forEach(([k, b]) => toucheRepet(k, t0 + b * 0.3));
}

/* ---------- Clavier ---------- */
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const code = e.code;
  if ($('voile-intro').classList.contains('actif') && !enPause) {
    if (code === 'KeyP') { e.preventDefault(); mettrePause(); return; }
    if (code === 'Enter' || code === 'Space' || code === 'Escape') { e.preventDefault(); fermerIntro(); }
    return;
  }
  if (ecran === 'jeu') {
    if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); if (enPause) { quitterPause(); } else mettrePause(); return; }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const m = /^(?:Digit|Numpad)([1-6])$/.exec(code);
    if (m) { const c = $('reponses').querySelectorAll('.carte')[+m[1] - 1]; if (c) { e.preventDefault(); c.click(); } return; }
    if (code === 'KeyR' || (code === 'Space' && !(document.activeElement && document.activeElement.classList.contains('carte')))) { e.preventDefault(); if (E.question && E.question.entendu) ecouter(true); return; }
    if (code.startsWith('Arrow')) {
      const cartes = [...$('reponses').querySelectorAll('.carte')]; if (!cartes.length) return;
      e.preventDefault();
      let i = cartes.indexOf(document.activeElement);
      const d = code === 'ArrowLeft' || code === 'ArrowUp' ? -1 : 1;
      i = i < 0 ? 0 : (i + d + cartes.length) % cartes.length;
      cartes[i].focus();
    }
    if (code === 'KeyM') basculerSon();
    return;
  }
  if (ecran === 'repet') {
    const m = /^(?:Digit|Numpad)([1-8])$/.exec(code);
    if (m) { e.preventDefault(); toucheRepet(+m[1] - 1); return; }
    if (code === 'Escape') { allerTitre(); return; }
  }
  if (ecran === 'concerts' && code === 'Escape') { allerTitre(); return; }
  if (code === 'KeyM') basculerSon();
});

/* ---------- Boutons ---------- */
function demarrer() {
  audio(); sons.toucher();
  JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => { const n = Math.max(1, Math.min(NIVEAUX.length, parseInt(d.niveau, 10) || 1)); if (progres.debloque < n) { progres.debloque = n; ecrireProgres(); } lancerConcert(n); },
    onNouvelle: () => lancerConcert(1),
  });
}
$('btn-jouer').addEventListener('click', demarrer);
$('btn-concerts').addEventListener('click', () => { audio(); sons.toucher(); allerConcerts(); });
$('btn-repet').addEventListener('click', () => { audio(); sons.toucher(); construireRepet(); montrer('repet'); });
$('retour-concerts').addEventListener('click', () => { sons.toucher(); allerTitre(); });
$('retour-repet').addEventListener('click', () => { sons.toucher(); allerTitre(); });
$('btn-air').addEventListener('click', airDuChef);
document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
$('btn-son-pause').addEventListener('click', basculerSon);
$('btn-pause').addEventListener('click', () => { sons.toucher(); mettrePause(); });
$('btn-reprendre').addEventListener('click', () => { quitterPause(); sons.toucher(); });
$('btn-recommencer').addEventListener('click', () => { const n = E.niveau; quitterPause(true); sons.toucher(); lancerConcert(n); });
$('btn-accueil-pause').addEventListener('click', () => { quitterPause(true); sons.toucher(); allerTitre(); });
$('btn-ecouter').addEventListener('click', () => { if (E.question && E.question.entendu) ecouter(true); else ecouter(false); });
$('btn-compris').addEventListener('click', fermerIntro);
$('btn-revoir').addEventListener('click', revoirIntro);
document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });

// Sauvegarde à la fermeture de la page, seulement pendant un concert.
JEL_SAVE.surFermeture(() => {
  if (E.enConcert && ecran === 'jeu') JEL_SAVE.save(JEU, { niveau: E.niveau, score: E.score, progres });
});

// Changement de langue sur place : textes fabriqués par le script.
window.JEL_I18N.surChangement(() => {
  majSon(); majTitre();
  if (ecran === 'concerts') construireConcerts();
  if (ecran === 'repet') construireRepet();
  if (ecran === 'jeu') {
    majBarre(); majEcouter();
    if (E.question) {
      $('question').textContent = tr(E.question.texte);
      $('reponses').querySelectorAll('.carte').forEach((b, i) => { const c = E.question.choix[i]; b.querySelector('.etiquette').textContent = c.etiquette(); b.setAttribute('aria-label', c.etiquette()); });
    }
  }
});

iconesFixes();
construireTitre();
</script>
