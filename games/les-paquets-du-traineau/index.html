      const sx = Math.min(...p.solCells.map((q) => q[0])), sy = Math.min(...p.solCells.map((q) => q[1]));
      const tx0 = GEO.gx + (sx + a[0] + 0.5) * cs, ty0 = GEO.gy + (sy + a[1] + 0.5) * cs;
      const x = lerp(fx, tx0, k), y = lerp(fy, ty0, k);
      if (k > 0 && k < 1) { g.save(); g.globalAlpha = 0.55; dessinerPaquet(g, demo, x - (a[0] + 0.5) * cs, y - (a[1] + 0.5) * cs, cs, { sansOmbre: true }); g.restore(); }
      main(g, x, y, Math.max(40, cs * 0.9), ph > 0.12 && ph < 0.72);
    } else if (N.index === 1 && N.rotations === 0) {
      const vis = etabliVisible(); if (!vis.length) return;
      const p = N.pieces[vis[0]], c = cibleAff(p); if (!c) return;
      const pw = Math.max(...p.forme.map((k) => k[0])) + 1, ph2 = Math.max(...p.forme.map((k) => k[1])) + 1;
      const ph = (horloge % 1.4) / 1.4;
      main(g, c.x + (pw * c.s) / 2, c.y + (ph2 * c.s) / 2, 44, ph < 0.3);
    }
  }

  // =====================================================================
  //  Écran titre (dessin qui sert aussi de jaquette)
  // =====================================================================
  function dessinerTitre(dt) {
    ciel(g, W, H, 0);
    lunePleine(g, W * 0.78, H * 0.3, Math.min(W, H) * 0.12);
    collines(g, W, H * 0.68, H * 0.32);
    const sol = H * 0.93;
    const ms = Math.min(1.3, W / 400);
    [[0.02, '#c2584e'], [0.28, '#6a8fc8'], [0.56, '#d9a44a'], [0.8, '#7cae6b']].forEach(([fx, coul], i) => maison(g, W * fx, sol, 70 * ms, (50 + (i % 2) * 16) * ms, coul, ms));
    // sapins
    for (const [fx, sc] of [[0.18, 1], [0.48, 0.8], [0.73, 1.1], [0.97, 0.9]]) {
      const x = W * fx, s = 60 * sc * ms;
      g.fillStyle = '#1f6b44'; sapinChemin(g, x, sol - s * 0.55, s); g.fill();
      g.fillStyle = '#f4f8ff'; g.beginPath(); g.arc(x, sol - s * 1.12, s * 0.06, 0, 7); g.fill();
    }
    g.fillStyle = '#eef4ff'; g.fillRect(0, sol, W, H - sol);
    // traîneau qui vole
    const s = Math.min(1.9, W / 300);
    const x = W * 0.5 - 60 * s, y = H * 0.5 + Math.sin(horloge * 1.6) * 10;
    if (Math.random() < 0.5) eclats.push({ x: x - 50 * s, y: y + 18 * s, vx: -50 - Math.random() * 30, vy: 10 + Math.random() * 20, vie: 0, max: 1, type: 'etoile', coul: Math.random() < 0.5 ? '#ffe07a' : '#fff', r: 2 + Math.random() * 3, rot: 0 });
    majEclats(g, dt);
    traineauCote(g, x, y, s, horloge, optionsDeco());
    // paquets au sol
    const pqS = Math.min(34, W / 12);
    dessinerPaquet(g, faux([[0, 0], [1, 0], [0, 1]], { papier: 0, motif: 2 }), W * 0.06, sol - 2 * pqS + 6, pqS);
    dessinerPaquet(g, faux([[0, 0], [0, 1]], { papier: 2, motif: 0 }), W * 0.06 + pqS, sol - 2 * pqS + 6, pqS);
    dessinerPaquet(g, faux([[0, 0], [1, 0]], { fragile: true }), W - 2.4 * pqS, sol - pqS + 6, pqS);
    neige(g, W, H, true, dt);
  }

  // =====================================================================
  //  Sélection des niveaux et « Mon traîneau »
  // =====================================================================
  function ouvrirNiveaux() {
    etat = 'niveaux';
    $('hud').hidden = true;
    $('niv-stats').textContent = tx('niveaux.stats', { etoiles: nb(totalEtoiles()), max: nb(MAX_ETOILES), grelots: nb(sauve.grelots) });
    const liste = $('liste-niveaux'); liste.innerHTML = '';
    let courant = null;
    VILLAGES.forEach((v, vi) => {
      const bloc = document.createElement('div'); bloc.className = 'village';
      const h3 = document.createElement('h3');
      const pastille = document.createElement('i'); pastille.style.background = v.teinte; h3.appendChild(pastille);
      h3.appendChild(document.createTextNode(tx('village.' + v.cle)));
      bloc.appendChild(h3);
      const grille = document.createElement('div'); grille.className = 'grille-niveaux';
      for (let i = vi * 6; i < vi * 6 + 6; i++) {
        const b = document.createElement('button'); b.className = 'case-niveau';
        const ouvert = i < sauve.debloque;
        if (ouvert) {
          const e = sauve.etoiles[i] || 0;
          b.innerHTML = '<span>' + nb(i + 1) + '</span><span class="mini-etoiles">' + etoileSVG(e >= 1) + etoileSVG(e >= 2) + etoileSVG(e >= 3) + '</span>';
          b.setAttribute('aria-label', tx('niveaux.niveau', { n: nb(i + 1) }) + ', ' + tx('niveaux.etoiles', { n: e }));
          b.addEventListener('click', () => { son('clic'); lancerNiveau(i); });
          if (i === sauve.debloque - 1 && !e) { b.classList.add('courant'); courant = b; }
        } else {
          b.classList.add('ferme');
          b.innerHTML = '<svg class="cadenas" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
          b.setAttribute('aria-label', tx('niveaux.ferme', { n: nb(i + 1) }));
          b.addEventListener('click', () => { son('refus'); });
        }
        grille.appendChild(b);
      }
      bloc.appendChild(grille); liste.appendChild(bloc);
    });
    montrer('ecran-niveaux');
    if (courant) courant.focus(); else $('b-niv-retour').focus();
  }
  function dessinerPeluche(cv, p, gagnee) {
    const c = cv.getContext('2d'); const w = cv.width, h = cv.height;
    c.clearRect(0, 0, w, h);
    c.save(); c.translate(w / 2, h / 2 + 4); c.scale(w / 64, h / 64);
    const corps = gagnee ? (p.id === 'etincelle' ? '#e8b84a' : '#a8703c') : '#4a5378';
    const clair = gagnee ? (p.id === 'etincelle' ? '#fff0a8' : '#e8d2b0') : '#6a7398';
    // bois
    c.strokeStyle = gagnee ? '#d9b483' : '#5a6388'; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-8, -14); c.lineTo(-14, -26); c.moveTo(-11, -20); c.lineTo(-18, -20); c.moveTo(8, -14); c.lineTo(14, -26); c.moveTo(11, -20); c.lineTo(18, -20); c.stroke();
    c.fillStyle = corps;
    c.beginPath(); c.ellipse(-15, -10, 6, 3.5, -0.5, 0, 7); c.fill(); c.beginPath(); c.ellipse(15, -10, 6, 3.5, 0.5, 0, 7); c.fill();
    c.beginPath(); c.arc(0, 0, 16, 0, 7); c.fill();
    c.fillStyle = clair; c.beginPath(); c.ellipse(0, 7, 9, 7, 0, 0, 7); c.fill();
    c.fillStyle = '#2a1a10'; c.beginPath(); c.arc(-6, -3, 2.4, 0, 7); c.arc(6, -3, 2.4, 0, 7); c.fill();
    c.beginPath(); c.ellipse(0, 5, 3.5, 2.5, 0, 0, 7); c.fill();
    c.fillStyle = gagnee ? p.echarpe : '#3a4268';
    c.beginPath(); rr(c, -14, 13, 28, 7, 3.5); c.fill(); c.fillRect(6, 15, 6, 12);
    if (gagnee && p.id === 'etincelle') { c.fillStyle = '#fff'; etoileChemin(c, 16, -16, 4, 1.8); c.fill(); }
    c.restore();
  }
  function dessinerIconeDeco(cv, id, ok) {
    const c = cv.getContext('2d'); const w = cv.width, h = cv.height;
    c.clearRect(0, 0, w, h); c.save(); c.scale(w / 44, h / 32);
    c.globalAlpha = ok ? 1 : 0.4;
    if (id === 'houx') { c.fillStyle = '#1f8a45'; c.beginPath(); c.ellipse(15, 16, 10, 5, -0.5, 0, 7); c.fill(); c.beginPath(); c.ellipse(29, 16, 10, 5, 0.5, 0, 7); c.fill(); c.fillStyle = '#ff3b3b'; c.beginPath(); c.arc(20, 14, 3.5, 0, 7); c.arc(25, 18, 3.5, 0, 7); c.fill(); }
    else if (id === 'guirlande') { const cols = ['#ff5a5a', '#ffd34d', '#5ad1ff', '#7dff9a']; c.strokeStyle = '#2f5a2a'; c.lineWidth = 2; c.beginPath(); c.moveTo(2, 10); c.quadraticCurveTo(22, 24, 42, 10); c.stroke(); for (let i = 0; i < 5; i++) { c.fillStyle = cols[i % 4]; c.beginPath(); c.arc(6 + i * 8, 12 + Math.sin((i / 4) * Math.PI) * 6, 3.5, 0, 7); c.fill(); } }
    else if (id === 'clochettes') { for (const x of [14, 30]) { c.fillStyle = '#ffd34d'; c.beginPath(); c.moveTo(x - 8, 24); c.quadraticCurveTo(x - 8, 6, x, 6); c.quadraticCurveTo(x + 8, 6, x + 8, 24); c.closePath(); c.fill(); c.fillStyle = '#b9821b'; c.beginPath(); c.arc(x, 25, 2.5, 0, 7); c.fill(); } }
    else if (id === 'lanterne') { c.fillStyle = 'rgba(255,220,120,.4)'; c.beginPath(); c.arc(22, 17, 14, 0, 7); c.fill(); c.fillStyle = '#ffe69a'; c.fillRect(16, 9, 12, 16); c.strokeStyle = '#4a3a2a'; c.lineWidth = 2; c.strokeRect(16, 9, 12, 16); c.beginPath(); c.moveTo(22, 9); c.lineTo(22, 3); c.stroke(); }
    else if (id === 'etoile') { c.fillStyle = '#ffd34d'; etoileChemin(c, 22, 17, 13, 5.5); c.fill(); }
    else if (id === 'aurore') { ['#7dffbe', '#7dc8ff', '#c88cff'].forEach((col, i) => { c.strokeStyle = col; c.lineWidth = 4; c.beginPath(); for (let x = 2; x <= 42; x += 4) c.lineTo(x, 10 + i * 6 + Math.sin(x * 0.25 + i) * 3); c.stroke(); }); }
    c.restore();
  }
  let traineauCanvasAnime = false;
  function ouvrirTraineau(retour) {
    etat = 'traineau';
    traineauRetour = retour || 'titre';
    $('tr-grelots').textContent = tx('traineau.grelots', { n: sauve.grelots });
    const ld = $('liste-decos'); ld.innerHTML = '';
    DECOS.forEach((d) => {
      const ok = decoDebloquee(d);
      const b = document.createElement('button'); b.className = 'deco' + (ok ? '' : ' ferme');
      const cv = document.createElement('canvas'); cv.width = 88; cv.height = 64; dessinerIconeDeco(cv, d.id, ok);
      b.appendChild(cv);
      const nom = document.createElement('span'); nom.textContent = tx('deco.' + d.id); b.appendChild(nom);
      if (ok) {
        b.setAttribute('aria-pressed', decoActive(d.id) ? 'true' : 'false');
        b.addEventListener('click', () => {
          sauve.decos[d.id] = !decoActive(d.id); enregistrer();
          b.setAttribute('aria-pressed', decoActive(d.id) ? 'true' : 'false');
          if (decoActive(d.id)) grelot(0, 1500); else son('clic');
        });
      } else {
        const sm = document.createElement('small'); sm.textContent = tx('traineau.prix', { n: d.prix - sauve.grelots }); b.appendChild(sm);
        b.addEventListener('click', () => son('refus'));
      }
      ld.appendChild(b);
    });
    const lp = $('liste-peluches'); lp.innerHTML = '';
    const gagnees = peluchesGagnees();
    PELUCHES.forEach((p) => {
      const ok = gagnees.includes(p.id);
      const d = document.createElement('div'); d.className = 'peluche';
      const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128; dessinerPeluche(cv, p, ok);
      d.appendChild(cv);
      const nom = document.createElement('span'); nom.textContent = ok ? tx('peluche.' + p.id) : tx('traineau.peluche.mystere'); d.appendChild(nom);
      if (!ok) { const sm = document.createElement('small'); sm.textContent = p.village >= 0 ? tx('traineau.peluche.village', { village: tx('village.' + VILLAGES[p.village].cle) }) : tx('traineau.peluche.or'); d.appendChild(sm); }
      lp.appendChild(d);
    });
    montrer('ecran-traineau');
    traineauCanvasAnime = true;
    $('b-tr-retour').focus();
  }
  let traineauRetour = 'titre';
  function dessinerTraineauCanvas() {
    const cv = $('traineau-canvas');
    const r = cv.getBoundingClientRect();
    const w = Math.max(10, Math.round(r.width * DPR)), h = Math.max(10, Math.round(r.height * DPR));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    const c = cv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.scale(DPR, DPR);
    const lw = r.width, lh = r.height;
    ciel(c, lw, lh, 0);
    lunePleine(c, lw * 0.85, lh * 0.25, 18);
    c.fillStyle = '#eef4ff'; c.fillRect(0, lh * 0.86, lw, lh);
    const s = Math.min(1.1, lw / 300);
    traineauCote(c, lw * 0.36 - 40 * s, lh * 0.62 + Math.sin(horloge * 1.5) * 4, s, horloge, optionsDeco());
  }

  // =====================================================================
  //  Boutons
  // =====================================================================
  let audioPret = false;
  function premiereAction() { audioPret = true; initAudio(); }
  document.addEventListener('pointerdown', premiereAction, true);
  function majSon() {
    document.querySelectorAll('.b-son').forEach((b) => {
      b.classList.toggle('eteint', !sauve.son);
      b.setAttribute('aria-pressed', sauve.son ? 'true' : 'false');
      b.querySelector('.onde').style.display = sauve.son ? '' : 'none';
      b.querySelector('.barre').style.display = sauve.son ? 'none' : '';
    });
    if (maitre) maitre.gain.value = sauve.son ? 0.55 : 0;
  }
  function basculerSon() { sauve.son = !sauve.son; enregistrer(); majSon(); son('clic'); }
  $('b-son').addEventListener('click', basculerSon);
  $('b-son-titre').addEventListener('click', basculerSon);
  $('b-pause').addEventListener('click', () => pause());
  $('b-indice').addEventListener('click', () => donnerIndice());
  $('b-annuler').addEventListener('click', () => annuler());
  $('b-jouer').addEventListener('click', () => {
    son('clic');
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => {
        const i = Math.max(1, Math.min(NIVEAUX.length, d.niveau)) - 1;
        sauve.debloque = Math.max(sauve.debloque, i + 1);
        sauve.grelots = Math.max(sauve.grelots, d.score);
        lancerNiveau(i);
      },
      onNouvelle: () => { if (sauve.debloque <= 1 && !sauve.etoiles[0]) lancerNiveau(0); else ouvrirNiveaux(); },
    });
  });
  $('b-traineau').addEventListener('click', () => { son('clic'); ouvrirTraineau('titre'); });
  $('b-tr-retour').addEventListener('click', () => { son('clic'); traineauCanvasAnime = false; if (traineauRetour === 'finale') afficherFinale(); else allerTitre(); });
  $('b-niv-retour').addEventListener('click', () => { son('clic'); allerTitre(); });
  $('b-reprendre').addEventListener('click', () => reprendre());
  $('b-recommencer').addEventListener('click', () => { enPause = false; if (audio) audio.resume().catch(() => {}); lancerNiveau(N.index); });
  $('b-aide').addEventListener('click', () => {
    enPause = false; if (audio) audio.resume().catch(() => {}); montrer(null);
    const types = ['glisser', 'tourner'].concat(NIVEAUX.slice(0, N.index + 1).flatMap((d) => d.tuto || []).filter((x) => x !== 'glisser' && x !== 'tourner'));
    const vus = Array.from(new Set(types)).slice(-3);
    ouvrirTuto(vus);
  });
  $('b-pause-niveaux').addEventListener('click', () => { enPause = false; if (audio) audio.resume().catch(() => {}); ouvrirNiveaux(); });
  $('b-pause-accueil').addEventListener('click', () => { enPause = false; if (audio) audio.resume().catch(() => {}); allerTitre(); });
  $('b-suivant').addEventListener('click', () => {
    son('clic');
    if (N.index + 1 >= NIVEAUX.length) afficherFinale(); else lancerNiveau(N.index + 1);
  });
  $('b-reessayer').addEventListener('click', () => { son('clic'); lancerNiveau(N.index); });
  $('b-rejouer').addEventListener('click', () => { son('clic'); lancerNiveau(N.index); });
  $('b-fin-niveaux').addEventListener('click', () => { son('clic'); ouvrirNiveaux(); });
  $('b-fin-accueil').addEventListener('click', () => { son('clic'); allerTitre(); });
  $('b-finale-traineau').addEventListener('click', () => { son('clic'); ouvrirTraineau('finale'); });
  $('b-finale-rejouer').addEventListener('click', () => { son('clic'); lancerNiveau(N ? N.index : 0); });
  $('b-finale-niveaux').addEventListener('click', () => { son('clic'); ouvrirNiveaux(); });
  $('b-passer').addEventListener('click', () => { son('clic'); if (VOL) VOL.t = VOL.duree; });
  function allerTitre() {
    etat = 'titre'; N = null; VOL = null; enPause = false; drag = null; kb.tenu = null;
    $('hud').hidden = true; $('bonus-hud').hidden = true; $('bonus-consigne').hidden = true;
    effacerTitre.maj();
    montrer('ecran-titre');
    $('b-jouer').focus();
  }

  // Textes qui dépendent de la langue (si elle change sans relancer le jeu)
  function majTextes() {
    document.title = tx('titre');
    majHud();
    if (etat === 'niveaux') ouvrirNiveaux();
    if (etat === 'traineau') ouvrirTraineau(traineauRetour);
  }
  if (I.surChangement) I.surChangement(majTextes);

  // =====================================================================
  //  Boucle principale
  // =====================================================================
  let avant = performance.now();
  function boucle(maintenant) {
    let dt = Math.min(0.05, (maintenant - avant) / 1000);
    avant = maintenant;
    if (enPause || tutoOuvert) dt = tutoOuvert && !enPause ? dt : 0;
    const fige = enPause || tutoOuvert;
    if (!enPause) horloge += dt;
    // délais du jeu
    if (!fige) for (let i = minuteries.length - 1; i >= 0; i--) { const m = minuteries[i]; m.t -= dt; if (m.t <= 0) { minuteries.splice(i, 1); m.fn(); } }
    if (minuteToast > 0 && !enPause) { minuteToast -= dt; if (minuteToast <= 0) $('toast').classList.remove('visible'); }
    placerToast();
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    try {
      if (etat === 'jeu' && N) {
        if (!fige && !N.fini) {
          if (N.croissance > 0) N.croissance = Math.max(0, N.croissance - dt * 1.2);
          if (N.indice) { N.indice.t -= dt; if (N.indice.t <= 0) N.indice = null; }
          if (N.chrono) {
            N.temps -= dt;
            const s = Math.ceil(N.temps);
            if (N.temps <= 10 && s !== N.ticPrec) { N.ticPrec = s; son('tic'); }
            if (N.temps <= 30 && !N.alerte) { N.alerte = true; toast(tx('msg.aube')); son('alerte'); }
            if (N.temps <= 0) { N.temps = 0; defaite('aube'); }
            majHud();
          }
        }
        dessinerJeu(fige ? 0 : dt);
      } else if ((etat === 'vol' || etat === 'bonus') && VOL) {
        majVol(fige ? 0 : dt);
      } else if (etat === 'fin' && N) {
        if (resultat && resultat.gagne && VOL) majVol(0.6 * dt); else dessinerJeu(dt);
      } else {
        dessinerTitre(dt);
      }
      if (tutoOuvert) { tutoT += dt; const cv = $('tuto-canvas'); dessinerDemo(cv.getContext('2d'), cv.width, cv.height, tutoT); }
      if (etat === 'traineau' && traineauCanvasAnime) dessinerTraineauCanvas();
    } catch (err) {
      console.error(err);
    }
    requestAnimationFrame(boucle);
  }

  // Démarrage
  document.title = tx('titre');
  majSon();
  allerTitre();
  requestAnimationFrame(boucle);
})();
