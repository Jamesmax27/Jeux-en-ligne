  // ---------------------------------------------------------------------
  // Une tournée
  // ---------------------------------------------------------------------
  function lancerNiveau(i) {
    i = Math.max(0, Math.min(NIVEAUX.length - 1, i));
    annulerMinuteries();
    fermerVoiles();
    const N = NIVEAUX[i];
    etat.niveau = i;
    etat.niveauReprise = i + 1;
    etat.enPartie = true;
    etat.maisons = fabriquerMaisons(N);
    etat.taches = fabriquerTaches(N, etat.maisons.length);
    etat.idx = 0; etat.erreurs = 0; etat.coups = 0; etat.coeurs = 3;
    etat.scoreNiveau = 0; etat.colisPos = 0; etat.timbres = [];
    etat.phase = 'apercu';
    etat.apercuTotal = N.apercu * 1000;
    etat.apercuReste = etat.apercuTotal;

    montrerEcran('jeu');
    etat.enPartie = true;
    $('info-tournee').textContent = t('jeu.tournee', { n: i + 1 });
    $('info-quartier').textContent = t('quartier.' + N.q) + (N.nuit ? ' · ' + t('jeu.deNuit') : '');
    const rue = $('rue');
    rue.className = 'q-' + N.q + (N.nuit ? ' soir' : '');
    $('decor').innerHTML = svgDecor(N.q);
    $('voile').innerHTML = N.nuit ? svgEtoilesNuit() : '';
    $('fleches').innerHTML = '';
    construireRue();
    majCoeurs();
    $('enveloppe').innerHTML = svgFacteur(progres.velo, progres.sacoche, false);
    $('message').textContent = t('msg.regarde');
    $('jauge').classList.remove('cache');
    $('jauge-plein').style.width = '100%';
    $('b-pret').classList.remove('cache');
    $('b-coup').classList.add('cache');
    placerFacteur(-1);

    // Nouveauté de cette tournée, présentée à la première visite.
    if (N.intro && !progres.vus[N.intro]) montrerTuto(N.intro, () => { progres.vus[N.intro] = true; sauverProgres(); });
  }

  function construireRue() {
    const N = NIVEAUX[etat.niveau];
    const haut = $('rangee-haut'), bas = $('rangee-bas');
    haut.innerHTML = ''; bas.innerHTML = '';
    const deux = N.rangs.length > 1;
    $('trottoir-bas').classList.toggle('cache', !deux);
    bas.classList.toggle('cache', !deux);
    let k = 0;
    N.rangs.forEach((nbR, r) => {
      const rangee = r === 0 ? haut : bas;
      for (let j = 0; j < nbR; j++, k++) {
        const m = etat.maisons[k];
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'maison';
        b.dataset.k = k;
        b.dataset.rang = r;
        b.setAttribute('aria-label', deux ? t(r === 0 ? 'jeu.maisonHaut' : 'jeu.maisonBas', { n: j + 1 }) : t('jeu.maison', { n: j + 1 }));
        b.innerHTML = svgMaison(m, N.q, N.f, 'couleur', N.nuit, 'calque c')
          + svgMaison(m, N.q, N.f, N.nuit ? 'nuit' : 'gris', N.nuit, 'calque g')
          + svgMaison(m, N.q, N.f, 'habitant', N.nuit, 'calque h')
          + '<span class="halo"></span>';
        b.addEventListener('click', () => toucherMaison(+b.dataset.k));
        rangee.appendChild(b);
      }
    });
    mettreEnPage();
  }

  function mettreEnPage() {
    if (etat.ecran !== 'jeu') return;
    const N = NIVEAUX[etat.niveau];
    const rue = $('rue');
    const W = rue.clientWidth, H = rue.clientHeight;
    const lignes = N.rangs.length;
    const parLigne = Math.max(...N.rangs);
    const fixe = 54 + 14 + 10 * lignes + 16;
    let lm = Math.min((W - 16) / parLigne - 8, (H - fixe) / (lignes * 1.3), 130);
    lm = Math.max(44, Math.floor(lm));
    document.documentElement.style.setProperty('--lm', lm + 'px');
    placerFacteur(etat.facteurSur === undefined ? -1 : etat.facteurSur);
  }

  function placerFacteur(k) {
    etat.facteurSur = k;
    const f = $('facteur-route');
    if (!f.innerHTML) f.innerHTML = svgFacteur(progres.velo, progres.sacoche, true);
    const route = $('route').getBoundingClientRect();
    let x = 6;
    if (k >= 0) {
      const b = maisonBouton(k);
      if (b) { const r = b.getBoundingClientRect(); x = r.left + r.width / 2 - route.left - 32; }
    }
    const ancien = parseFloat(f.style.left) || 6;
    f.classList.toggle('retourne', x < ancien - 2);
    f.style.left = Math.max(0, Math.min(route.width - 64, x)) + 'px';
  }
  const maisonBouton = (k) => document.querySelector(`#rue .maison[data-k="${k}"]`);

  function majCoeurs() {
    const c = $('coeurs');
    c.innerHTML = '';
    for (let i = 0; i < 3; i++) c.insertAdjacentHTML('beforeend', svgCoeur(i < etat.coeurs ? '' : 'perdu'));
    c.setAttribute('role', 'img');
    c.setAttribute('aria-label', t('jeu.coeurs', { n: etat.coeurs }));
  }
  function majBoutonCoup() {
    const reste = NIVEAUX[etat.niveau].coups - etat.coups;
    $('txt-coup').textContent = t('bouton.coup', { n: reste });
    $('b-coup').disabled = reste <= 0;
    $('b-coup').style.opacity = reste <= 0 ? '.5' : '1';
  }

  // Fin de l'aperçu : les couleurs s'effacent.
  function effacer() {
    if (etat.phase !== 'apercu') return;
    const N = NIVEAUX[etat.niveau];
    etat.phase = 'transition';
    son.efface();
    const rue = $('rue');
    rue.classList.add('efface');
    if (N.nuit) { rue.classList.remove('soir'); rue.classList.add('nuit'); }
    $('jauge').classList.add('cache');
    $('b-pret').classList.add('cache');
    $('b-coup').classList.remove('cache');
    majBoutonCoup();
    $('message').textContent = t(N.nuit ? 'msg.nuitTombe' : 'msg.efface');
    plusTard(900, tacheSuivante);
  }

  function tacheSuivante() {
    if (etat.idx >= etat.taches.length) { victoire(); return; }
    const N = NIVEAUX[etat.niveau];
    const tache = etat.taches[etat.idx];
    const env = $('enveloppe');
    env.classList.remove('arrive'); void env.offsetWidth; env.classList.add('arrive');
    if (tache.type === 'lettre') {
      env.innerHTML = svgEnveloppe(etat.maisons[tache.cible], N.q, N.f, false);
      env.setAttribute('role', 'img');
      env.setAttribute('aria-label', t('jeu.enveloppe'));
      etat.phase = 'jeu';
      $('message').textContent = t('msg.lettre', { n: etat.idx + 1, total: etat.taches.length });
      focusSiClavier();
    } else if (tache.type === 'dem') {
      env.innerHTML = svgEnveloppe(etat.maisons[tache.de], N.q, N.f, true);
      env.setAttribute('aria-label', t('jeu.enveloppeDem'));
      etat.phase = 'evenement';
      $('message').textContent = t('msg.demenage');
      son.demenage();
      dessinerFleche(tache.de, tache.vers);
      plusTard(2800, () => {
        $('fleches').innerHTML = '';
        etat.phase = 'jeu';
        $('message').textContent = t('msg.demenageLettre');
        focusSiClavier();
      });
    } else {
      etat.colisPos = 0;
      env.innerHTML = svgColis(0, tache.chemin.length);
      env.setAttribute('aria-label', t('jeu.colis', { n: tache.chemin.length }));
      montrerChemin(tache);
    }
  }

  // Le facteur montre le chemin du colis : les maisons s'allument dans l'ordre.
  function montrerChemin(tache) {
    etat.phase = 'evenement';
    $('message').textContent = t('msg.colisRegarde', { n: tache.chemin.length });
    tache.chemin.forEach((k, i) => {
      plusTard(700 + i * 800, () => {
        const b = maisonBouton(k);
        if (!b) return;
        b.classList.add('chemin');
        son.chemin(i);
        plusTard(600, () => b.classList.remove('chemin'));
      });
    });
    plusTard(700 + tache.chemin.length * 800 + 200, () => {
      etat.phase = 'jeu';
      $('message').textContent = t('msg.colisATtoi');
      focusSiClavier();
    });
  }

  function dessinerFleche(de, vers) {
    const svg = $('fleches');
    const rue = $('rue').getBoundingClientRect();
    const c = (k) => { const r = maisonBouton(k).getBoundingClientRect(); return [r.left + r.width / 2 - rue.left, r.top + r.height * 0.45 - rue.top]; };
    const [x1, y1] = c(de), [x2, y2] = c(vers);
    const mx = (x1 + x2) / 2, my = Math.min(y1, y2) - 50 - Math.abs(x2 - x1) * 0.15;
    svg.setAttribute('viewBox', `0 0 ${rue.width} ${rue.height}`);
    const ang = Math.atan2(y2 - my, x2 - mx);
    const p = (a, l) => `${(x2 - Math.cos(ang + a) * l).toFixed(1)},${(y2 - Math.sin(ang + a) * l).toFixed(1)}`;
    svg.innerHTML = `<path class="trait" d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}"/>`
      + `<polygon points="${x2},${y2} ${p(0.45, 22)} ${p(-0.45, 22)}" fill="#ffd23f" stroke="#b88a00" stroke-width="2" style="animation: apparait .3s 1s both"/>`
      + `<g class="carton"><g transform="translate(${x2 - 15} ${y2 - 58})"><rect x="0" y="6" width="30" height="24" fill="#c98b4a" stroke="#8a5a2b" stroke-width="2"/><rect x="12" y="6" width="6" height="24" fill="#e8c27a"/><polygon points="0,6 6,0 36,0 30,6" fill="#dca065" stroke="#8a5a2b" stroke-width="2"/></g></g>`;
  }

  function focusSiClavier() {
    if (!etat.clavier) return;
    const actif = document.activeElement;
    if (actif && actif.classList && actif.classList.contains('maison')) return;
    const b = maisonBouton(0);
    if (b) b.focus({ preventScroll: true });
  }

  // Le joueur touche une maison.
  function toucherMaison(k) {
    if (etat.pause || etat.tuto) return;
    const b = maisonBouton(k);
    if (etat.phase === 'apercu') { if (b) { b.classList.remove('attends'); void b.offsetWidth; b.classList.add('attends'); } return; }
    if (etat.phase !== 'jeu') return;
    const tache = etat.taches[etat.idx];
    let attendue;
    if (tache.type === 'lettre') attendue = tache.cible;
    else if (tache.type === 'dem') attendue = tache.vers;
    else attendue = tache.chemin[etat.colisPos];

    if (k !== attendue) { erreur(k, tache); return; }

    son.sonnette();
    placerFacteur(k);
    if (tache.type === 'colis') {
      etat.colisPos++;
      $('enveloppe').innerHTML = svgColis(etat.colisPos, tache.chemin.length);
      b.classList.add('ok');
      envolerVers(b, true);
      gagnerTimbre(k);
      eclats(b, 6);
      if (etat.colisPos >= tache.chemin.length) {
        etat.phase = 'anim';
        etat.scoreNiveau += 150;
        plusTard(350, () => son.colis());
        $('message').textContent = t('msg.colisFini');
        plusTard(1300, () => {
          document.querySelectorAll('#rue .maison.ok').forEach((x) => x.classList.remove('ok'));
          etat.idx++;
          tacheSuivante();
        });
      } else {
        $('message').textContent = t('msg.colisSuite', { n: tache.chemin.length - etat.colisPos });
      }
      return;
    }
    // Lettre livrée
    etat.phase = 'anim';
    etat.scoreNiveau += tache.type === 'dem' ? 120 : 100;
    envolerVers(b, false);
    plusTard(450, () => {
      son.lettre();
      b.classList.add('revele');
      gagnerTimbre(tache.type === 'dem' ? tache.de : k);
      eclats(b, 10);
      $('message').textContent = t('msg.merci.' + (1 + hasard(4)));
      plusTard(1200, () => {
        b.classList.remove('revele');
        etat.idx++;
        tacheSuivante();
      });
    });
  }

  function erreur(k, tache) {
    const b = maisonBouton(k);
    etat.erreurs++;
    etat.coeurs--;
    son.erreur();
    if (b) { b.classList.remove('non'); void b.offsetWidth; b.classList.add('non'); }
    majCoeurs();
    const perdu = $('coeurs').children[etat.coeurs];
    if (perdu) perdu.classList.add('tombe');
    if (etat.coeurs <= 0) {
      etat.phase = 'anim';
      $('message').textContent = t('msg.plusDeCoeurs');
      plusTard(900, defaite);
      return;
    }
    if (tache.type === 'colis') {
      $('message').textContent = t('msg.colisErreur');
      etat.colisPos = 0;
      document.querySelectorAll('#rue .maison.ok').forEach((x) => x.classList.remove('ok'));
      $('enveloppe').innerHTML = svgColis(0, tache.chemin.length);
      etat.phase = 'evenement';
      plusTard(900, () => montrerChemin(tache));
    } else {
      $('message').textContent = t('msg.erreur');
    }
  }

  function coupDoeil() {
    const N = NIVEAUX[etat.niveau];
    if (etat.pause || etat.tuto || etat.phase !== 'jeu' || etat.coups >= N.coups) return;
    etat.coups++;
    son.coup();
    majBoutonCoup();
    const rue = $('rue');
    rue.classList.add('coup');
    $('message').textContent = t('msg.coup');
    plusTard(1500, () => rue.classList.remove('coup'));
  }

  function pret() {
    if (etat.phase !== 'apercu' || etat.pause || etat.tuto) return;
    son.clic();
    etat.scoreNiveau += Math.round(etat.apercuReste / 100);
    etat.apercuReste = 0;
    effacer();
  }

  // ---------------------------------------------------------------------
  // Effets
  // ---------------------------------------------------------------------
  function envolerVers(b, colis) {
    const depart = $('enveloppe').getBoundingClientRect();
    const arrivee = b.getBoundingClientRect();
    const v = document.createElement('div');
    v.className = 'vol';
    v.innerHTML = colis
      ? '<svg viewBox="0 0 54 40" aria-hidden="true"><rect x="10" y="4" width="34" height="32" fill="#c98b4a" stroke="#8a5a2b" stroke-width="2"/><rect x="24" y="4" width="6" height="32" fill="#e2453c"/></svg>'
      : '<svg viewBox="0 0 54 40" aria-hidden="true"><rect x="2" y="4" width="50" height="32" rx="4" fill="#fffdf6" stroke="#c9b48c" stroke-width="2"/><polyline points="3,6 27,22 51,6" fill="none" stroke="#c9b48c" stroke-width="2"/></svg>';
    v.style.left = (depart.left + depart.width / 2 - 27) + 'px';
    v.style.top = (depart.top + depart.height / 2 - 20) + 'px';
    document.body.appendChild(v);
    const dx = arrivee.left + arrivee.width / 2 - (depart.left + depart.width / 2);
    const dy = arrivee.top + arrivee.height * 0.8 - (depart.top + depart.height / 2);
    if (v.animate) {
      const a = v.animate([
        { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 60}px) scale(.9) rotate(-15deg)`, opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) scale(.4) rotate(10deg)`, opacity: 0.2 },
      ], { duration: 450, easing: 'ease-in-out' });
      a.onfinish = () => v.remove();
    } else setTimeout(() => v.remove(), 450);
  }
  function eclats(b, n) {
    const rue = $('rue');
    const rr = rue.getBoundingClientRect(), r = b.getBoundingClientRect();
    for (let i = 0; i < n; i++) {
      const e = document.createElement('div');
      e.className = 'eclat';
      e.innerHTML = i % 2 ? svgEtoile(true) : svgCoeur();
      const ang = (i / n) * Math.PI * 2;
      e.style.left = (r.left + r.width / 2 - rr.left - 9) + 'px';
      e.style.top = (r.top + r.height * 0.4 - rr.top - 9) + 'px';
      e.style.setProperty('--dx', Math.cos(ang) * 50 + 'px');
      e.style.setProperty('--dy', Math.sin(ang) * 50 - 20 + 'px');
      rue.appendChild(e);
      setTimeout(() => e.remove(), 950);
    }
  }
  function confettis(n) {
    const couleurs = ['#e2453c', '#2f74d8', '#f4c32c', '#33a352', '#9b55d4', '#f08a24'];
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = couleurs[i % couleurs.length];
      c.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
      c.style.animationDelay = (Math.random() * 0.5) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4200);
    }
  }
  function gagnerTimbre(k) {
    const q = NIVEAUX[etat.niveau].q;
    const a = etat.maisons[k].animal;
    const cle = q + '-' + a;
    progres.timbres[cle] = (progres.timbres[cle] | 0) + 1;
    etat.timbres.push(a);
    sauverProgres();
    plusTard(250, son.timbre);
  }

  // ---------------------------------------------------------------------
  // Fins de tournée
  // ---------------------------------------------------------------------
  function objetsDebloques(total) {
    return VELOS.filter((o) => o.e <= total).length + SACOCHES.filter((o) => o.e <= total).length + SONNETTES.filter((o) => o.e <= total).length;
  }
  function victoire() {
    const i = etat.niveau;
    const N = NIVEAUX[i];
    etat.phase = 'fin';
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
    const etoiles = Math.max(1, 3 - etat.erreurs - etat.coups);
    etat.scoreNiveau += etat.coeurs * 50;
    etat.scoreTotal += etat.scoreNiveau;
    const avant = totalEtoiles();
    const record = etat.scoreNiveau > progres.records[i];
    const ancienRecord = progres.records[i];
    if (record) progres.records[i] = etat.scoreNiveau;
    progres.etoiles[i] = Math.max(progres.etoiles[i], etoiles);
    progres.debloque = Math.max(progres.debloque, Math.min(NIVEAUX.length, i + 2));
    sauverProgres();
    const nouveauxObjets = objetsDebloques(totalEtoiles()) - objetsDebloques(avant);
    etat.niveauReprise = Math.min(i + 2, NIVEAUX.length);
    window.JEL_SAVE.save(JEU, { niveau: etat.niveauReprise, score: etat.scoreTotal });

    son.victoire();
    confettis(i === NIVEAUX.length - 1 ? 90 : 40);
    const dernier = i === NIVEAUX.length - 1;
    const carte = $('carte-fin');
    let h = `<h2>${echapper(t(dernier ? 'fin.finalTitre' : 'fin.bravo'))}</h2>`;
    h += `<div class="grandes-etoiles">${[0, 1, 2].map((s) => svgEtoile(s < etoiles, s < etoiles ? 'gagnee' : '')).join('')}</div>`;
    h += `<p class="score-fin" id="compteur">0</p>`;
    h += `<p>${echapper(t('fin.detail', { erreurs: etat.erreurs, coups: etat.coups }))}</p>`;
    h += `<p class="record">${echapper(record && ancienRecord > 0 ? t('fin.record') : record ? t('fin.premierRecord') : t('fin.recordGarde', { n: progres.records[i] }))}</p>`;
    if (etat.timbres.length) {
      h += `<p>${echapper(t('fin.timbres', { n: etat.timbres.length }))}</p><div class="timbres-fin">`;
      etat.timbres.slice(0, 12).forEach((a, k) => { h += svgTimbre(N.q, a, false).replace('<svg ', `<svg style="animation-delay:${0.6 + k * 0.08}s" `); });
      h += '</div>';
    }
    if (nouveauxObjets > 0) h += `<p class="debloque">${echapper(t('fin.debloque'))}</p>`;
    if (dernier) h += `<p>${echapper(t('fin.final', { etoiles: totalEtoiles(), timbres: totalTimbres() }))}</p>`;
    h += '<div class="colonne">';
    if (!dernier) h += `<button class="bouton principal" type="button" id="f-suivant">${echapper(t('bouton.suivant'))}</button>`;
    h += `<button class="bouton" type="button" id="f-rejouer">${echapper(t('bouton.rejouer'))}</button>`;
    h += `<button class="bouton" type="button" id="f-niveaux">${echapper(t('bouton.tournees'))}</button></div>`;
    carte.innerHTML = h;
    ouvrirVoile('ov-fin');
    if (!dernier) $('f-suivant').addEventListener('click', () => { son.clic(); lancerNiveau(i + 1); });
    $('f-rejouer').addEventListener('click', () => { son.clic(); lancerNiveau(i); });
    $('f-niveaux').addEventListener('click', () => { son.clic(); fermerVoiles(); afficherNiveaux(); });
    (dernier ? $('f-rejouer') : $('f-suivant')).focus({ preventScroll: true });
    for (let s = 0; s < etoiles; s++) setTimeout(() => son.etoile(s), 300 + s * 250);
    compter($('compteur'), etat.scoreNiveau);
  }

  function defaite() {
    const i = etat.niveau;
    etat.phase = 'fin';
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: i + 1 });
    son.defaite();
    const livrees = etat.taches.slice(0, etat.idx).length;
    const carte = $('carte-fin');
    let h = `<h2>${echapper(t('fin.perdu'))}</h2>`;
    h += `<div class="grandes-etoiles">${[0, 1, 2].map(() => svgEtoile(false)).join('')}</div>`;
    h += `<p class="score-fin" id="compteur">0</p>`;
    h += `<p>${echapper(t('fin.perduDetail', { n: livrees, total: etat.taches.length }))}</p>`;
    h += `<p>${echapper(t('fin.conseil'))}</p>`;
    if (progres.records[i] > 0) h += `<p class="record">${echapper(t('fin.recordGarde', { n: progres.records[i] }))}</p>`;
    h += `<div class="colonne"><button class="bouton principal" type="button" id="f-reessayer">${echapper(t('bouton.reessayer'))}</button>`;
    h += `<button class="bouton" type="button" id="f-niveaux">${echapper(t('bouton.tournees'))}</button>`;
    h += `<button class="bouton" type="button" id="f-accueil">${echapper(t('bouton.accueil'))}</button></div>`;
    carte.innerHTML = h;
    ouvrirVoile('ov-fin');
    $('f-reessayer').addEventListener('click', () => { son.clic(); lancerNiveau(i); });
    $('f-niveaux').addEventListener('click', () => { son.clic(); fermerVoiles(); afficherNiveaux(); });
    $('f-accueil').addEventListener('click', () => { son.clic(); afficherTitre(); });
    $('f-reessayer').focus({ preventScroll: true });
    compter($('compteur'), etat.scoreNiveau);
  }

  function compter(el, fin) {
    const debut = performance.now();
    const pas = (m) => {
      const p = Math.min(1, (m - debut) / 900);
      el.textContent = t('fin.score', { n: Math.round(fin * p) });
      if (p < 1 && el.isConnected) requestAnimationFrame(pas);
    };
    requestAnimationFrame(pas);
  }
  function echapper(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // ---------------------------------------------------------------------
  // Fenêtres : pause, tutoriel
  // ---------------------------------------------------------------------
  function ouvrirVoile(id) { $(id).classList.add('actif'); }
  function fermerVoiles() {
    document.querySelectorAll('.voile-ecran').forEach((v) => v.classList.remove('actif'));
    etat.pause = false;
    etat.tuto = false;
    document.body.classList.remove('en-pause');
  }
  function mettreEnPause() {
    if (etat.ecran !== 'jeu' || etat.pause || etat.phase === 'fin') return;
    etat.pause = true;
    document.body.classList.add('en-pause');
    if (ac) ac.suspend().catch(() => {});
    ouvrirVoile('ov-pause');
    $('b-reprendre').focus({ preventScroll: true });
  }
  function reprendre() {
    if (!etat.pause) return;
    etat.pause = false;
    document.body.classList.remove('en-pause');
    $('ov-pause').classList.remove('actif');
    if (ac && progres.son) ac.resume().catch(() => {});
    son.clic();
    dernierTemps = performance.now();
  }

  // Démonstration animée d'une mécanique (rue miniature, main qui montre le geste).
  const DEMOS = {
    base:      { q: 'village', f: [P], cible: 2 },
    volets:    { q: 'village', f: [P, V], cible: 1 },
    animal:    { q: 'village', f: [P, V, A], cible: 0 },
    sosies:    { q: 'village', f: [P, V, A], cible: 2, sosies: true },
    colis:     { q: 'port', f: [P], colis: true },
    demenage:  { q: 'port', f: [P, V], cible: 2, dem: true },
    toit:      { q: 'port', f: TOUT, cible: 1 },
    deuxcotes: { q: 'ville', f: [P, V, A], cible: 4, deux: true },
    nuit:      { q: 'montagne', f: [P, V], cible: 1, nuit: true },
  };
  function demoHTML(type) {
    const d = DEMOS[type];
    const maisons = [
      { porte: 0, volets: 1, toit: 0, animal: 'chat', allumee: true },
      { porte: 1, volets: 3, toit: 1, animal: 'chien', allumee: false },
      { porte: 3, volets: 2, toit: 3, animal: 'lapin', allumee: true },
      { porte: 2, volets: 5, toit: 2, animal: 'poule' },
      { porte: 4, volets: 0, toit: 4, animal: 'hibou' },
      { porte: 5, volets: 4, toit: 0, animal: 'souris' },
    ];
    if (d.sosies) { maisons[2] = Object.assign({}, maisons[1], { animal: 'souris', allumee: true }); }
    const n = d.deux ? 6 : 3;
    const w = d.deux ? 40 : 56, hh = Math.round(w * 1.3), gap = 14;
    const largeur = 3 * w + 2 * gap, x0 = Math.round((236 - largeur) / 2);
    let s = `<div class="demo${d.nuit ? ' d-nuit' : ''}${d.colis ? ' d-colis' : ''}" aria-hidden="true">`;
    const pos = [];
    for (let i = 0; i < n; i++) {
      const r = d.deux ? Math.floor(i / 3) : 0, c = i % 3;
      const x = x0 + c * (w + gap), y = d.deux ? (r === 0 ? 6 : 84) : 34;
      pos.push([x, y]);
      const m = maisons[i];
      const ordre = d.colis ? ` o${[1, 2, 0][i]}` : '';
      s += `<div class="dm${i === d.cible ? ' cible' : ''}${ordre}" style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px">`
        + svgMaison(m, d.q, d.f, 'couleur', d.nuit, 'c')
        + svgMaison(m, d.q, d.f, d.nuit ? 'nuit' : 'gris', d.nuit, 'g')
        + svgMaison(m, d.q, d.f, 'habitant', d.nuit, 'h')
        + (d.colis ? '<span class="halo"></span>' : '') + '</div>';
    }
    const routeY = d.deux ? 6 + hh + 4 : 34 + hh;
    s += `<div class="d-route" style="top:${routeY}px;height:${d.deux ? 84 - 6 - hh - 8 : 20}px"></div>`;
    if (d.dem) {
      const [ax, ay] = pos[0], [bx, by] = pos[2];
      const x1 = ax + w / 2, y1 = ay + 30, x2 = bx + w / 2, y2 = by + 30;
      s += `<svg class="d-fleche" viewBox="0 0 236 200"><path d="M${x1} ${y1} Q118 -10 ${x2} ${y2}"/><g class="carton-d"><rect x="${x2 - 11}" y="${y2 - 36}" width="22" height="18" fill="#c98b4a" stroke="#8a5a2b" stroke-width="2"/></g></svg>`;
    }
    if (d.colis) {
      s += `<div class="d-env">${svgColis(0, 3)}</div>`;
      // ordre du chemin : maison 2, puis 0, puis 1
      const cx = (k) => pos[k][0] + w / 2 - 8;
      s += `<div class="main" style="--x0:${cx(2)}px;--x1:${cx(0)}px;--x2:${cx(1)}px;--y:${pos[0][1] + hh / 2}px">${ICONES.main}</div>`;
    } else {
      const m = d.dem ? maisons[0] : maisons[d.cible];
      s += `<div class="d-env">${svgEnveloppe(m, d.q, d.f, !!d.dem)}</div>`;
      const [cx, cy] = pos[d.cible];
      s += `<div class="main" style="--x:${cx + w / 2 - 8}px;--y:${cy + hh / 2}px">${ICONES.main}</div>`;
    }
    return s + '</div>';
  }

  function montrerTuto(type, fini) {
    etat.tuto = true;
    const carte = $('carte-tuto');
    let h = `<h2>${echapper(t('intro.' + type + '.titre'))}</h2><div class="tuto-demo">${demoHTML(type)}</div>`;
    if (type === 'base') {
      h += `<ol class="tuto-etapes"><li>${echapper(t('intro.base.etape1'))}</li><li>${echapper(t('intro.base.etape2'))}</li><li>${echapper(t('intro.base.etape3'))}</li></ol>`;
    } else {
      h += `<p>${echapper(t('intro.' + type + '.texte'))}</p>`;
    }
    h += `<div class="colonne"><button class="bouton principal" type="button" id="t-ok">${echapper(t('bouton.compris'))}</button></div>`;
    h += `<p class="toucher-suite">${echapper(t('intro.toucher'))}</p>`;
    carte.innerHTML = h;
    ouvrirVoile('ov-tuto');
    const fermer = () => {
      if (!etat.tuto) return;
      son.clic();
      $('ov-tuto').classList.remove('actif');
      etat.tuto = false;
      dernierTemps = performance.now();
      if (fini) fini();
    };
    $('t-ok').addEventListener('click', (e) => { e.stopPropagation(); fermer(); });
    $('ov-tuto').onclick = fermer;
    $('t-ok').focus({ preventScroll: true });
  }

  // ---------------------------------------------------------------------
  // Commandes
  // ---------------------------------------------------------------------
  function jouer() {
    son.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => {
        const n = Math.max(1, Math.min(NIVEAUX.length, d.niveau | 0 || 1));
        progres.debloque = Math.max(progres.debloque, n);
        sauverProgres();
        etat.scoreTotal = Math.max(0, d.score | 0);
        lancerNiveau(n - 1);
      },
      onNouvelle: () => {
        etat.scoreTotal = 0;
        lancerNiveau(0);
      },
    });
  }

  JEL_SAVE.surFermeture(() => {
    if (etat.enPartie) window.JEL_SAVE.save(JEU, { niveau: etat.niveauReprise, score: etat.scoreTotal });
  });

  $('b-jouer').addEventListener('click', jouer);
  $('b-tournees').addEventListener('click', () => { son.clic(); afficherNiveaux(); });
  $('b-album').addEventListener('click', () => { son.clic(); afficherAlbum(); });
  $('b-garage').addEventListener('click', () => { son.clic(); afficherGarage(); });
  document.querySelectorAll('.b-retour').forEach((b) => { b.innerHTML = ICONES.retour; b.addEventListener('click', () => { son.clic(); afficherTitre(); }); });
  document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('b-pause').innerHTML = ICONES.pause;
  $('b-pause').addEventListener('click', () => { son.clic(); mettreEnPause(); });
  $('b-reprendre').addEventListener('click', reprendre);
  $('b-recommencer').addEventListener('click', () => { son.clic(); lancerNiveau(etat.niveau); });
  $('b-accueil').addEventListener('click', () => { son.clic(); afficherTitre(); });
  $('b-pret').addEventListener('click', pret);
  $('b-coup').addEventListener('click', coupDoeil);
  $('ic-loupe').innerHTML = ICONES.loupe;
  $('ic-tournees').innerHTML = ICONES.carte;
  $('ic-album').innerHTML = ICONES.album;
  $('ic-garage').innerHTML = ICONES.garage;
  majBoutonsSon();

  document.addEventListener('pointerdown', () => { etat.clavier = false; }, true);
  document.addEventListener('keydown', (e) => {
    etat.clavier = true;
    const code = e.code;
    if (etat.ecran === 'jeu') {
      if (code === 'Escape' || code === 'KeyP') {
        e.preventDefault();
        if (etat.tuto) return;
        if (etat.pause) reprendre(); else mettreEnPause();
        return;
      }
      if (etat.pause || etat.tuto || $('ov-fin').classList.contains('actif')) return;
      const actif = document.activeElement;
      const surMaison = actif && actif.classList && actif.classList.contains('maison');
      if (code.startsWith('Arrow')) {
        e.preventDefault();
        const toutes = [...document.querySelectorAll('#rue .maison')];
        if (!surMaison) { if (toutes[0]) toutes[0].focus(); return; }
        const r = +actif.dataset.rang;
        const memeRang = toutes.filter((b) => +b.dataset.rang === r);
        const pos = memeRang.indexOf(actif);
        let cible = null;
        if (code === 'ArrowLeft') cible = memeRang[pos - 1];
        if (code === 'ArrowRight') cible = memeRang[pos + 1];
        if (code === 'ArrowUp' || code === 'ArrowDown') {
          const autre = toutes.filter((b) => +b.dataset.rang === (code === 'ArrowUp' ? r - 1 : r + 1));
          if (autre.length) cible = autre[Math.min(pos, autre.length - 1)];
        }
        if (cible) cible.focus();
        return;
      }
      if ((code === 'Enter' || code === 'Space') && etat.phase === 'apercu' && !surMaison) { e.preventDefault(); pret(); return; }
      if (code === 'KeyL' || code === 'KeyC') { coupDoeil(); return; }
    } else if (etat.ecran === 'titre') {
      if ((code === 'Enter' || code === 'Space') && (document.activeElement === document.body || !document.activeElement)) { e.preventDefault(); jouer(); }
    } else if (code === 'Escape') {
      afficherTitre();
    }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) mettreEnPause(); });
  window.addEventListener('resize', () => { mettreEnPage(); });

  document.title = t('titre');
  afficherTitre();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
