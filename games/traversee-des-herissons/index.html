  // ------------------------------------------------------------------
  const SVG_ETOILE = (plein) => '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17.1 6.1 20.3l1.3-6.5L2.5 9.3l6.6-.8z" fill="' + (plein ? '#f5c443' : '#d8cfc2') + '"/></svg>';
  const SVG_CADENAS = '<svg class="cadenas" viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3" fill="none" stroke="#9a8b7a" stroke-width="2.4"/><rect x="5" y="11" width="14" height="10" rx="2.5" fill="#9a8b7a"/></svg>';
  let ecranRetour = 'ecran-titre';
  function ouvrirNiveaux() {
    const grille = $('grille-niveaux'); grille.innerHTML = '';
    NIVEAUX.forEach((n, i) => {
      const b = document.createElement('button'); b.className = 'case-niveau t' + n.theme;
      const ouvert = i < prog.debloque;
      if (!ouvert) { b.classList.add('ferme'); b.innerHTML = SVG_CADENAS; b.setAttribute('aria-label', tr('niveaux.ferme', { n: i + 1 })); }
      else {
        const num = document.createElement('span'); num.textContent = nombre(i + 1); b.appendChild(num);
        const et = document.createElement('span'); et.className = 'mini-etoiles';
        for (let k = 0; k < 3; k++) et.innerHTML += SVG_ETOILE(k < (prog.etoiles[i] || 0));
        b.appendChild(et);
        b.setAttribute('aria-label', tr('niveaux.case', { n: i + 1, e: prog.etoiles[i] || 0 }));
        b.addEventListener('click', () => { son('clic'); lancerNiveau(i); });
      }
      grille.appendChild(b);
    });
    $('niveaux-total').innerHTML = SVG_ETOILE(true);
    $('niveaux-total').appendChild(document.createTextNode(tr('niveaux.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 })));
    ecranRetour = P.actif ? 'fin' : 'ecran-titre';
    P.actif = false;
    montrer('ecran-niveaux');
  }
  function ouvrirNids() {
    const grille = $('grille-nids'); grille.innerHTML = '';
    const total = totalEtoiles();
    NIDS.forEach((n, i) => {
      const b = document.createElement('button'); b.className = 'carte-nid';
      const ouvert = total >= n.seuil;
      if (!ouvert) b.classList.add('ferme');
      if (i === prog.nid) b.classList.add('choisi');
      const cv = document.createElement('canvas'); cv.width = 144; cv.height = 120;
      const gg = cv.getContext('2d'); gg.fillStyle = '#93cf6c'; rondRect(gg, 0, 0, 144, 120, 18); gg.fill();
      if (ouvert) dessinerTas(gg, 72, 62, 110, i, 0, false); else { gg.fillStyle = 'rgba(0,0,0,.12)'; ellipse(gg, 72, 70, 50, 26); gg.fill(); }
      b.appendChild(cv);
      const nom = document.createElement('span'); nom.textContent = tr('nid.' + n.cle); b.appendChild(nom);
      const info = document.createElement('small');
      info.textContent = ouvert ? (i === prog.nid ? tr('nids.choisi') : tr('nids.choisir')) : tr('nids.seuil', { n: n.seuil });
      b.appendChild(info);
      b.addEventListener('click', () => {
        if (!ouvert) { son('refus'); return; }
        prog.nid = i; son('maison');
        try { window.JEL_SAVE.save(JEU, { nid: i }); } catch (e) { /* rien */ }
        ouvrirNids();
      });
      grille.appendChild(b);
    });
    montrer('ecran-nids');
  }
  function ouvrirAlbum() {
    const grille = $('grille-album'); grille.innerHTML = '';
    $('album-compte').textContent = tr('album.compte', { n: prog.sauves.length, max: totalPetits });
    for (let id = 0; id < totalPetits; id++) {
      let niv = 0; while (niv + 1 < NIVEAUX.length && DECALAGES[niv + 1] <= id) niv++;
      const connu = prog.sauves.indexOf(id) >= 0;
      const d = document.createElement('div'); d.className = 'carte-petit' + (connu ? '' : ' inconnu');
      const cv = document.createElement('canvas'); cv.width = 144; cv.height = 120;
      const gg = cv.getContext('2d');
      gg.fillStyle = connu ? '#e3f0d3' : '#ddd5ca'; rondRect(gg, 0, 0, 144, 120, 18); gg.fill();
      const st = stylePetit(id, 0);
      if (!connu) { st.piquants = '#a89a8a'; st.piquants2 = '#958778'; st.corps = '#c4b8a8'; st.accessoire = null; }
      dessinerHerisson(gg, 66, 66, 38, Object.assign(st, { face: 1, dort: !connu }));
      d.appendChild(cv);
      const nom = document.createElement('span'); nom.textContent = connu ? tr('nom.' + (id % NB_NOMS)) : tr('album.inconnu'); d.appendChild(nom);
      const info = document.createElement('small'); info.textContent = tr('album.jardin', { n: niv + 1 }); d.appendChild(info);
      grille.appendChild(d);
    }
    montrer('ecran-album');
  }
  function allerAccueil() {
    P.actif = false; P.pause = false;
    montrer('ecran-titre');
  }

  function mettrePause() {
    if (!P.actif || P.pause || !$('ecran-fin').hidden || !$('ecran-nouveau').hidden) return;
    P.pause = true; son('clic'); montrer('ecran-pause');
  }
  function reprendre() { if (!P.pause) return; P.pause = false; son('clic'); montrer(null); }

  // ------------------------------------------------------------------
  // Décor de l'écran titre (sert aussi de jaquette)
  // ------------------------------------------------------------------
  function dessinerDecor() {
    const cv = $('decor'); if ($('ecran-titre').hidden) return;
    const r = cv.getBoundingClientRect();
    if (cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  }
  function peindreDecor() {
    dessinerDecor();
    const cv = $('decor'), gd = cv.getContext('2d');
    const W = cv.width / dpr, H = cv.height / dpr; if (!W) return;
    gd.setTransform(dpr, 0, 0, dpr, 0, 0);
    const ciel = gd.createLinearGradient(0, 0, 0, H * 0.45);
    ciel.addColorStop(0, '#8fd0f2'); ciel.addColorStop(1, '#d8f0e0');
    gd.fillStyle = ciel; gd.fillRect(0, 0, W, H);
    // Soleil
    gd.fillStyle = '#ffe48a'; ellipse(gd, W * 0.82, H * 0.1, 34, 34); gd.fill();
    gd.fillStyle = 'rgba(255,228,138,.35)'; ellipse(gd, W * 0.82, H * 0.1, 50 + Math.sin(horloge) * 4, 50 + Math.sin(horloge) * 4); gd.fill();
    // Nuages
    gd.fillStyle = 'rgba(255,255,255,.9)';
    [[0.18, 0.12], [0.5, 0.06]].forEach(([x, y], i) => { const dx = ((horloge * 6 + i * 200) % (W + 200)) - 100; ellipse(gd, x * W + dx * 0.2, y * H, 40, 14); gd.fill(); ellipse(gd, x * W + dx * 0.2 + 26, y * H - 8, 26, 14); gd.fill(); });
    // Collines et herbe
    gd.fillStyle = '#7cc25a'; gd.beginPath(); gd.moveTo(0, H * 0.42); gd.quadraticCurveTo(W * 0.3, H * 0.34, W * 0.6, H * 0.42); gd.quadraticCurveTo(W * 0.85, H * 0.48, W, H * 0.4); gd.lineTo(W, H); gd.lineTo(0, H); gd.fill();
    gd.fillStyle = '#93cf6c'; gd.fillRect(0, H * 0.5, W, H * 0.5);
    gd.fillStyle = '#88c661';
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if ((x + y) % 2) gd.fillRect(x * W / 8, H * 0.5 + y * H * 0.0625, W / 8, H * 0.0625);
    // Haie au fond
    for (let i = 0; i < 9; i++) { gd.fillStyle = i % 2 ? '#3f8a4a' : '#2f6e3a'; ellipse(gd, i * W / 8, H * 0.47, W / 10, 26); gd.fill(); }
    // Allée de pas japonais
    gd.fillStyle = '#d8c8a8';
    for (let i = 0; i < 6; i++) { ellipse(gd, W * (0.22 + i * 0.11), H * (0.86 - i * 0.045), 18, 9); gd.fill(); }
    const c = Math.min(W / 5, H / 7.5);
    // Tas de feuilles à droite
    dessinerTas(gd, W * 0.8, H * 0.6, c * 1.5, prog.nid, horloge, true);
    // Pot de fleurs, pommes, chien endormi
    dessinerPot(gd, W * 0.12, H * 0.6, c * 0.9);
    dessinerPomme(gd, W * 0.3, H * 0.58, c * 0.8, horloge);
    dessinerChien(gd, W * 0.5, H * 0.56, c * 0.95, horloge, false);
    // Famille de hérissons en marche
    const pasT = horloge * 6, base = H * (W < H ? 0.665 : 0.74);
    const f = FAMILLES[0];
    dessinerHerisson(gd, W * 0.62, base, c * 0.5, { piquants: f.piquants, piquants2: f.piquants2, corps: f.corps, face: 1, pas: pasT });
    [0, 1, 2].forEach((k) => {
      const st = stylePetit(k * 3 + 1, 0);
      dessinerHerisson(gd, W * (0.44 - k * 0.14), base + c * 0.12 - Math.abs(Math.sin(pasT + k)) * 4, c * 0.32, Object.assign(st, { face: 1, pas: pasT + k }));
    });
    // Feuilles qui tombent
    for (let i = 0; i < 7; i++) {
      const y = ((horloge * 22 + i * 97) % (H * 0.9)), x = W * hasard(i + 2) + Math.sin(horloge + i) * 20;
      gd.fillStyle = NIDS[0].couleurs[i % 4]; ellipse(gd, x, y, 8, 4, horloge + i); gd.fill();
    }
  }

  // ------------------------------------------------------------------
  // Boucle d'affichage
  // ------------------------------------------------------------------
  function boucle(ms) {
    const dt = Math.min(0.05, (ms - derniere) / 1000 || 0); derniere = ms;
    const enPause = P.pause || document.hidden;
    if (!enPause) horloge += dt;
    if (!$('ecran-titre').hidden) peindreDecor();
    if (!$('ecran-nouveau').hidden && demo.fixe) animerDemo();
    if (P.actif && !$('zone').hidden) {
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const W = canvas.width / dpr, H = canvas.height / dpr;
      g.clearRect(0, 0, W, H);
      g.fillStyle = THEMES[NIVEAUX[P.index].theme].fond; g.fillRect(0, 0, W, H);
      const p = P.avant ? Math.min(1, (horloge - P.t0) / P.duree) : 1;
      let dx = 0;
      if (secousse > 0 && !enPause) { secousse -= dt; dx = Math.sin(horloge * 70) * 6 * Math.max(0, secousse) / 0.4; }
      let main = null;
      if (P.tuto) { const ind = indicesSelection(); if (ind && ind.length) { const m = P.etat.meres[P.selection]; main = ind.find((q) => q.y < m.y) || ind[0]; } }
      dessinerJardin(g, geo.ox + dx, geo.oy, geo.c, {
        fixe: P.fixe, avant: P.avant, apres: P.etat, p, theme: NIVEAUX[P.index].theme, nid: prog.nid, temps: horloge,
        apercu: P.apercu, selection: P.selection, indices: p >= 1 ? indicesSelection() : null, faces: P.faces, main, decalage: DECALAGES[P.index]
      });
      if (!enPause) majParticules(g, dt); else majParticules(g, 0);
    }
    requestAnimationFrame(boucle);
  }

  // ------------------------------------------------------------------
  // Commandes
  // ------------------------------------------------------------------
  canvas.addEventListener('pointerdown', (ev) => {
    if (!P.actif || P.pause || P.etat.fin) return;
    ev.preventDefault();
    const r = canvas.getBoundingClientRect();
    const x = Math.floor((ev.clientX - r.left - geo.ox) / geo.c), y = Math.floor((ev.clientY - r.top - geo.oy) / geo.c);
    const e = P.etat;
    // Toucher une maman : la choisir
    for (let i = 0; i < e.meres.length; i++) { const m = e.meres[i]; if (!m.maison && m.x === x && m.y === y) { choisirMere(i); return; } }
    const m = e.meres[P.selection]; if (!m || m.maison) return;
    const dx = x - m.x, dy = y - m.y;
    if (!dx && !dy) return;
    let d;
    if (Math.abs(dx) >= Math.abs(dy)) d = dx > 0 ? 1 : 3; else d = dy > 0 ? 2 : 0;
    if (Math.abs(dx) + Math.abs(dy) > 1 && Math.abs(dx) === Math.abs(dy)) return; // diagonale : on ne devine pas
    jouer({ t: 'pas', d });
  });
  $('bulle').addEventListener('click', () => { P.tuto = 0; majBulle(); son('clic'); });
  $('b-attendre').addEventListener('click', () => jouer({ t: 'attendre' }));
  $('b-annuler').addEventListener('click', annuler);
  $('b-repos').addEventListener('click', () => { if (P.etat && P.etat.repos > 0) { P.reposArme = !P.reposArme; son('clic'); majHud(); if (P.reposArme) afficherToast(tr('ui.reposArme')); } });
  $('b-changer').addEventListener('click', mereSuivante);
  $('b-pause').addEventListener('click', mettrePause);
  $('b-reprendre').addEventListener('click', reprendre);
  $('b-recommencer').addEventListener('click', () => { son('clic'); lancerNiveau(P.index); });
  $('b-accueil').addEventListener('click', () => { son('clic'); allerAccueil(); });
  $('b-nouveau-ok').addEventListener('click', () => { son('clic'); montrer(null); demarrerTuto(); });
  $('ecran-nouveau').addEventListener('click', (e) => { if (e.target === $('ecran-nouveau')) { son('clic'); montrer(null); demarrerTuto(); } });
  document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', basculerSon));
  document.querySelectorAll('[data-retour]').forEach((b) => b.addEventListener('click', () => {
    son('clic');
    if (ecranRetour === 'fin' && b.closest('#ecran-niveaux')) { ecranRetour = 'ecran-titre'; }
    montrer('ecran-titre');
  }));
  $('b-niveaux').addEventListener('click', () => { son('clic'); ouvrirNiveaux(); });
  $('b-nids').addEventListener('click', () => { son('clic'); ouvrirNids(); });
  $('b-album').addEventListener('click', () => { son('clic'); ouvrirAlbum(); });
  $('b-jouer').addEventListener('click', () => {
    son('clic');
    if (!window.JEL_SAVE) { lireProg(); lancerNiveau(0); return; }
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { lireProg(); lancerNiveau(Math.min(NIVEAUX.length, Math.max(1, d.niveau | 0)) - 1); },
      onNouvelle: () => { lireProg(); lancerNiveau(0); },
      onEffacer: () => { lireProg(); majBoutonsSon(); lancerNiveau(0); }
    });
  });

  document.addEventListener('keydown', (ev) => {
    const code = ev.code;
    if (!$('ecran-nouveau').hidden && (code === 'Enter' || code === 'Space')) { ev.preventDefault(); $('b-nouveau-ok').click(); return; }
    if (!P.actif) return;
    if (code === 'Escape' || code === 'KeyP') { ev.preventDefault(); if (P.pause) reprendre(); else mettrePause(); return; }
    if (P.pause || !$('ecran-fin').hidden || !$('ecran-nouveau').hidden) return;
    const dirs = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
    if (dirs[code] !== undefined) { ev.preventDefault(); jouer({ t: 'pas', d: dirs[code] }); }
    else if (code === 'Space') { ev.preventDefault(); jouer({ t: 'attendre' }); }
    else if (code === 'Tab' || code === 'KeyC') { ev.preventDefault(); mereSuivante(); }
    else if (code === 'KeyR') { ev.preventDefault(); $('b-repos').click(); }
    else if (code === 'KeyU' || code === 'Backspace') { ev.preventDefault(); annuler(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });
  window.addEventListener('resize', redimensionner);

  if (window.JEL_SAVE) window.JEL_SAVE.surFermeture(() => { if (P.actif && P.etat && !P.etat.fin) ecrireProg(P.index + 1); });

  // ------------------------------------------------------------------
  // Démarrage
  // ------------------------------------------------------------------
  lireProg(true);
  majBoutonsSon();
  montrer('ecran-titre');
  redimensionner();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
