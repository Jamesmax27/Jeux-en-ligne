<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>
  :root {
    --fond: #2f4a2a;

    --rouge: #d9483b;

  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; cursor: pointer; border: none; }
  .bouton { min-height: 48px; padding: 10px 18px; border-radius: 16px; background: var(--carte); color: var(--encre); font-weight: 700; font-size: 17px; box-shadow: 0 4px 0 rgba(0,0,0,.25); transition: transform .08s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; line-height: 1.15; }
  .bouton:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .bouton.principal { background: var(--orange); color: #fff; font-size: 22px; min-height: 60px; padding: 12px 34px; }
  .bouton.vert { background: var(--vert); color: #fff; }
  .panneau .bouton:not(.principal):not(.vert) { background: #efe2c9; }
  .bouton:focus-visible, .rond:focus-visible, .case-niveau:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
  .rond { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,248,236,.92); display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 rgba(0,0,0,.25); flex: none; }
  .rond svg { width: 24px; height: 24px; }
  .ecran { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; z-index: 20; overflow-y: auto; }
  .ecran[hidden], [hidden] { display: none !important; }
  .voile { background: rgba(28,40,24,.72); }
  .panneau { background: var(--carte); border-radius: 24px; padding: 20px 18px; width: min(420px, 100%); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.35); animation: arrivee .28s ease-out; max-height: 100%; overflow-y: auto; }
  @keyframes arrivee { from { transform: scale(.85) translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
  .panneau h2 { margin: 2px 0 8px; font-size: 26px; color: var(--vert-fonce); }
  .panneau p { margin: 6px 0; font-size: 17px; line-height: 1.35; }
  .pile { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .ligne { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

  /* Écran titre */
  #ecran-titre { justify-content: flex-start; padding: 0; overflow: hidden; }
  #decor { position: absolute; inset: 0; width: 100%; height: 100%; }
  .titre-haut { position: relative; z-index: 1; text-align: center; padding: max(18px, env(safe-area-inset-top)) 16px 0; width: 100%; }
  .titre-haut h1 { margin: 34px 0 6px; font-size: clamp(32px, 9vw, 52px); line-height: 1.05; color: #fff; text-shadow: 0 3px 0 #2f6e24, 0 6px 14px rgba(0,0,0,.35); letter-spacing: .5px; }
  .titre-haut p { margin: 0 auto; max-width: 420px; font-size: 17px; line-height: 1.35; color: #fff; background: rgba(40,60,30,.55); padding: 8px 12px; border-radius: 14px; }
  .titre-bas { position: relative; z-index: 1; margin-top: auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 16px max(18px, env(safe-area-inset-bottom)); }
  .titre-bas .ligne .bouton { font-size: 15px; padding: 8px 12px; }
  .coin-titre { position: absolute; top: max(10px, env(safe-area-inset-top)); right: 10px; z-index: 2; display: flex; gap: 8px; align-items: center; }
  #place-langue-titre { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; z-index: 2; }

  /* Partie */
  #hud { display: flex; align-items: center; gap: 8px; padding: max(8px, env(safe-area-inset-top)) 10px 6px; background: rgba(0,0,0,.18); color: #fff; }
  .hud-info { flex: 1; min-width: 0; text-align: center; line-height: 1.15; }

  #hud-tours { font-size: 14px; opacity: .95; }
  .pastille { background: rgba(255,248,236,.92); color: var(--encre); border-radius: 23px; height: 46px; padding: 0 10px; display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 16px; flex: none; }
  .pastille svg { width: 26px; height: 26px; }
  #nuit { height: 6px; margin: 4px auto 0; width: 80%; max-width: 220px; background: rgba(255,255,255,.25); border-radius: 3px; overflow: hidden; }
  #nuit-barre { height: 100%; width: 0; background: linear-gradient(90deg, #f5c443, #f08a3c, #5b4aa8); transition: width .3s; }
  #zone { flex: 1; position: relative; min-height: 0; }
  #plateau { position: absolute; left: 0; top: 0; touch-action: none; }
  #actions { display: flex; gap: 8px; justify-content: center; padding: 8px 8px max(10px, env(safe-area-inset-bottom)); background: rgba(0,0,0,.18); }
  .action { flex: 1 1 0; max-width: 120px; min-height: 56px; border-radius: 16px; background: var(--carte); box-shadow: 0 4px 0 rgba(0,0,0,.25); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; font-weight: 700; padding: 4px 2px; line-height: 1.1; text-align: center; }
  .action svg { width: 24px; height: 24px; }
  .action:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .action:disabled { opacity: .45; }
  .action.arme { background: #ffe9a8; box-shadow: 0 0 0 3px var(--or), 0 4px 0 rgba(0,0,0,.25); }
  #bulle { position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; width: min(360px, 92%); background: var(--carte); border-radius: 16px; padding: 10px 14px; font-size: 16px; font-weight: 600; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.3); z-index: 5; }
  #bulle small { display: block; font-weight: 400; color: var(--doux); font-size: 13px; margin-top: 2px; }
  #toast { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); background: #3b2a1c; color: #fff; padding: 8px 14px; border-radius: 14px; font-weight: 700; font-size: 15px; z-index: 6; max-width: 92%; text-align: center; animation: arrivee .2s ease-out; }

  /* Niveaux */
  #grille-niveaux { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0; }
  .case-niveau { min-height: 62px; border-radius: 14px; background: #e9f3dc; border: 2px solid #b9d7a2; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 19px; padding: 2px; }
  .case-niveau .mini-etoiles { display: flex; gap: 1px; }
  .case-niveau .mini-etoiles svg { width: 13px; height: 13px; }
  .case-niveau.ferme { background: #ddd5ca; border-color: #c4b8a8; color: #9a8b7a; }
  .case-niveau.ferme svg.cadenas { width: 22px; height: 22px; }
  .case-niveau.t1 { background: #f3ebcf; border-color: #d8c58c; }
  .case-niveau.t2 { background: #dceff0; border-color: #9ccbd0; }
  .case-niveau.t3 { background: #f6e0cc; border-color: #e0ad7d; }
  .total { font-weight: 800; display: inline-flex; align-items: center; gap: 6px; font-size: 18px; }
  .total svg { width: 22px; height: 22px; }

  /* Fin de niveau */
  #fin-etoiles { display: flex; justify-content: center; gap: 8px; margin: 8px 0; }
  #fin-etoiles svg { width: 54px; height: 54px; transform: scale(0); }
  #fin-etoiles svg.allumee { animation: pop .45s cubic-bezier(.3,1.7,.6,1) forwards; }
  #fin-etoiles svg.eteinte { animation: pop .3s ease-out forwards; }
  @keyframes pop { to { transform: scale(1); } }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; font-size: 15px; }
  .stats div { background: #f1e7d6; border-radius: 10px; padding: 6px; }
  .stats b { display: block; font-size: 20px; }
  .bravo { color: var(--orange); font-weight: 800; }

  .carte-nid.ferme { opacity: .6; }
  .carte-nid small, .carte-petit small { font-weight: 400; color: var(--doux); font-size: 12px; }
  .carte-petit.inconnu { opacity: .55; }
  #ecran-nids .panneau, #ecran-album .panneau, #ecran-niveaux .panneau { width: min(520px, 100%); }
</style>

<div id="app">
  <header id="hud" hidden>
    <button id="b-pause" class="rond" data-i18n-aria="ui.pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#3b2a1c"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#3b2a1c"/></svg></button>
    <div class="hud-info">
      <div id="hud-niveau"></div>
      <div id="hud-tours"></div>

<script>
'use strict';
// ==========================================================================
// La traversée des hérissons — jeu de stratégie au tour par tour.
// Une maman hérisson traverse le jardin avec ses petits jusqu'au tas de
// feuilles ; après chaque pas, le jardin bouge (tondeuses, arroseurs).
// ==========================================================================
const JEU = 'traversee-des-herissons';

// <LOGIQUE> — règles pures du jardin (aucun dessin, aucun son)
var DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // haut, droite, bas, gauche
var PENTES = { '^': 0, '>': 1, 'v': 2, '<': 3 };
// Tondeuses : caractère de la carte → [direction de départ, vitesse]
var TONDEUSES_CAR = { '1': [1, 1], '2': [3, 1], '3': [0, 1], '4': [2, 1], '5': [1, 2], '6': [3, 2], '7': [0, 2], '8': [2, 2] };

// Lit la carte d'un niveau : partie fixe (sol, chiens, arroseurs) et état de départ.
// Carte : . herbe, # obstacle, ~ bassin, F tas de feuilles, H/G mamans, b petit
// perdu, a pomme, p pot, D chien, O arroseur, 1 à 8 tondeuses, ^ > v < pentes.
function creerJardin(def) {
  var carte = def.carte, h = carte.length, l = carte[0].length;
  var fixe = { l: l, h: h, sol: [], chiens: [], arroseurs: [], limite: def.limite || 99 };
  var e = { meres: [], perdus: [], pommes: [], pots: [], tondeuses: [], tic: 0, repos: 0, tours: 0, fin: null, cause: null, ici: null };
  var ia = 0, nb = 0;
  for (var y = 0; y < h; y++) {
    var ligne = [];
    for (var x = 0; x < l; x++) {
      var c = carte[y][x], s = '.';
      if ('#~^>v<F'.indexOf(c) >= 0) s = c;
      else if (c === 'H' || c === 'G') e.meres.push({ x: x, y: y, fam: c === 'H' ? 0 : 1, maison: false, petits: [] });
      else if (c === 'b') e.perdus.push({ x: x, y: y, id: nb++ });
      else if (c === 'a') e.pommes.push({ x: x, y: y, id: e.pommes.length });
      else if (c === 'p') e.pots.push({ x: x, y: y });
      else if (c === 'D') { fixe.chiens.push({ x: x, y: y }); s = 'D'; }
      else if (c === 'O') { var a = def.arroseurs[ia++]; fixe.arroseurs.push({ x: x, y: y, dir: a.dir, long: a.long, sens: a.sens || 1 }); s = 'O'; }
      else if (TONDEUSES_CAR[c]) { var tc = TONDEUSES_CAR[c]; e.tondeuses.push({ x: x, y: y, dx: DIRS[tc[0]][0], dy: DIRS[tc[0]][1], vit: tc[1] }); }
      ligne.push(s);
    }
    fixe.sol.push(ligne);
  }
  return { fixe: fixe, etat: e };
}

function copier(e) { return JSON.parse(JSON.stringify(e)); }
function dedans(f, x, y) { return x >= 0 && y >= 0 && x < f.l && y < f.h; }
function trouver(liste, x, y) { for (var i = 0; i < liste.length; i++) if (liste[i].x === x && liste[i].y === y) return i; return -1; }

// Hérisson (maman ou petit qui suit) présent sur la case ?
function herissonSur(e, x, y) {
  for (var i = 0; i < e.meres.length; i++) {
    var m = e.meres[i];
    if (m.maison) continue;
    if (m.x === x && m.y === y) return true;
    if (trouver(m.petits, x, y) >= 0) return true;
  }
  return false;
}

function meresActives(e) { var n = 0; for (var i = 0; i < e.meres.length; i++) if (!e.meres[i].maison) n++; return n; }

// Direction du jet d'un arroseur au tic donné (il tourne d'un quart de tour par tic).
function dirJet(a, tic) { return ((a.dir + a.sens * tic) % 4 + 4) % 4; }

// Cases mouillées par les arroseurs au tic donné (le jet s'arrête sur un obstacle ou un pot).
function casesJet(f, e, tic) {
  var res = [];
  for (var i = 0; i < f.arroseurs.length; i++) {
    var a = f.arroseurs[i], d = DIRS[dirJet(a, tic)];
    for (var k = 1; k <= a.long; k++) {
      var x = a.x + d[0] * k, y = a.y + d[1] * k;
      if (!dedans(f, x, y)) break;
      var s = f.sol[y][x];
      if (s === '#' || s === 'D' || s === 'O' || trouver(e.pots, x, y) >= 0) break;
      res.push({ x: x, y: y, a: i });
    }
  }
  return res;
}

// La tondeuse peut-elle rouler sur cette case ?
function libreTondeuse(f, e, x, y) {
  if (!dedans(f, x, y)) return false;
  var s = f.sol[y][x];
  if (s === '#' || s === '~' || s === 'D' || s === 'O' || s === 'F') return false;
  if (trouver(e.pots, x, y) >= 0 || trouver(e.perdus, x, y) >= 0 || trouver(e.tondeuses, x, y) >= 0) return false;
  return true;
}

// La maman peut-elle entrer sur cette case ? (un pot seulement s'il peut glisser)
// Renvoie '' si oui, sinon la raison du refus.
function obstacleMere(f, e, x, y, dx, dy, pousser) {
  if (!dedans(f, x, y)) return 'bord';
  var s = f.sol[y][x];
  if (s === '#' || s === '~' || s === 'O') return 'mur';
  if (s === 'D') return 'chien';
  if (trouver(e.tondeuses, x, y) >= 0) return 'tondeuse';
  if (herissonSur(e, x, y)) return 'herisson';
  if (s === 'F' && e.perdus.length > 0 && meresActives(e) === 1) return 'petits';
  if (trouver(e.pots, x, y) >= 0) {
    if (!pousser) return 'pot';
    var px = x + dx, py = y + dy;
    if (!dedans(f, px, py)) return 'pot';
    if (f.sol[py][px] !== '.') return 'pot';
    if (trouver(e.pots, px, py) >= 0 || trouver(e.tondeuses, px, py) >= 0 || trouver(e.perdus, px, py) >= 0 || trouver(e.pommes, px, py) >= 0 || herissonSur(e, px, py)) return 'pot';
  }
  return '';
}

// Déplace la maman d'une case (déjà vérifiée) : petits qui suivent, ramassages, maison.
function avancer(f, e, m, x, y, ev) {
  var pos = [{ x: m.x, y: m.y }];
  for (var i = 0; i < m.petits.length; i++) pos.push({ x: m.petits[i].x, y: m.petits[i].y });
  for (i = 0; i < m.petits.length; i++) { m.petits[i].x = pos[i].x; m.petits[i].y = pos[i].y; }
  var ib = trouver(e.perdus, x, y);
  if (ib >= 0) {
    var b = e.perdus.splice(ib, 1)[0];
    var q = pos[m.petits.length];
    m.petits.push({ x: q.x, y: q.y, id: b.id });
    ev.push({ t: 'petit', x: x, y: y, id: b.id });
  }
  var ip = trouver(e.pommes, x, y);
  if (ip >= 0) { e.pommes.splice(ip, 1); e.repos++; ev.push({ t: 'pomme', x: x, y: y }); }
  m.x = x; m.y = y;
  if (f.sol[y][x] === 'F') { m.maison = true; ev.push({ t: 'maison', x: x, y: y, fam: m.fam }); }
}

// Un hérisson dans les 8 cases autour d'un chien le réveille.
function verifierChiens(f, e, ev) {
  for (var c = 0; c < f.chiens.length; c++) {
    var ch = f.chiens[c];
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      if ((dx || dy) && herissonSur(e, ch.x + dx, ch.y + dy)) {
        e.fin = 'perdu'; e.cause = 'chien'; e.ici = { x: ch.x, y: ch.y };
        ev.push({ t: 'chien', x: ch.x, y: ch.y });
        return;
      }
    }
  }
}

// Le jardin bouge : tondeuses (une ou deux cases), puis arroseurs.
// trace (facultatif) reçoit les cases traversées par les tondeuses.
function tourDuJardin(f, e, ev, trace) {
  for (var i = 0; i < e.tondeuses.length; i++) {
    var t = e.tondeuses[i];
    for (var s = 0; s < t.vit; s++) {
      var nx = t.x + t.dx, ny = t.y + t.dy;
      if (!libreTondeuse(f, e, nx, ny)) {
        t.dx = -t.dx; t.dy = -t.dy; nx = t.x + t.dx; ny = t.y + t.dy;
        if (!libreTondeuse(f, e, nx, ny)) continue;
      }
      t.x = nx; t.y = ny;
      if (trace) trace.push({ x: nx, y: ny, i: i });
      if (herissonSur(e, nx, ny)) { e.fin = 'perdu'; e.cause = 'tondeuse'; e.ici = { x: nx, y: ny }; ev.push({ t: 'tondeuse', x: nx, y: ny }); return; }
    }
  }
  e.tic++;
  var j = casesJet(f, e, e.tic);
  for (i = 0; i < j.length; i++) {
    if (herissonSur(e, j[i].x, j[i].y)) { e.fin = 'perdu'; e.cause = 'eau'; e.ici = { x: j[i].x, y: j[i].y }; ev.push({ t: 'eau', x: j[i].x, y: j[i].y }); return; }
  }
}

// Ce que fera le jardin au prochain tour (aperçu montré au joueur).
function apercuJardin(f, e) {
  var c = copier(e); c.meres = [];
  var trace = [];
  tourDuJardin(f, c, [], trace);
  return { tondues: trace, mouillees: casesJet(f, c, c.tic) };
}

// Joue un tour. action : { t: 'pas', m: n° de maman, d: 0..3, repos: bool } ou { t: 'attendre' }.
// Renvoie { etat, ev } ou { refus: raison }.
function jouerTour(f, e0, action) {
  if (e0.fin) return { refus: 'fin' };
  var e = copier(e0), ev = [];
  if (action.t === 'pas') {
    var m = e.meres[action.m];
    if (!m || m.maison) return { refus: 'maman' };
    var d = DIRS[action.d], x = m.x + d[0], y = m.y + d[1];
    var ob = obstacleMere(f, e, x, y, d[0], d[1], true);
    if (ob) return { refus: ob };
    var ip = trouver(e.pots, x, y);
    if (ip >= 0) { e.pots[ip].x += d[0]; e.pots[ip].y += d[1]; ev.push({ t: 'pousse', x: e.pots[ip].x, y: e.pots[ip].y }); }
    avancer(f, e, m, x, y, ev);
    ev.push({ t: 'pas', m: action.m, d: action.d });
    // Pente : le hérisson se roule en boule et dévale.
    var garde = 0;
    while (!m.maison && PENTES[f.sol[m.y][m.x]] !== undefined && garde < 40) {
      var pd = DIRS[PENTES[f.sol[m.y][m.x]]], rx = m.x + pd[0], ry = m.y + pd[1];
      if (obstacleMere(f, e, rx, ry, pd[0], pd[1], false)) break;
      avancer(f, e, m, rx, ry, ev);
      garde++;
    }
    if (garde) ev.push({ t: 'boule', m: action.m });
  }
  var repos = action.t === 'pas' && action.repos && e.repos > 0;
  if (repos) { e.repos--; ev.push({ t: 'repos' }); }
  e.tours++;
  verifierChiens(f, e, ev);
  if (!e.fin && meresActives(e) === 0 && e.perdus.length === 0) { e.fin = 'gagne'; ev.push({ t: 'gagne' }); return { etat: e, ev: ev }; }
  if (!e.fin && !repos) tourDuJardin(f, e, ev);
  if (!e.fin && e.tours >= f.limite) { e.fin = 'perdu'; e.cause = 'nuit'; ev.push({ t: 'nuit' }); }
  return { etat: e, ev: ev };
}
// </LOGIQUE>

// <NIVEAUX> — 20 jardins. theme : 0 potager, 1 verger, 2 parc, 3 automne.
// par : nombre minimal de tours (calculé par un solveur) ; nouveau : mécanique présentée.
var NIVEAUX = [
  { theme: 0, nouveau: 'pas', carte: ['##F##', '#...#', '#.#.#', '#.#.#', '#...#', '#.#.#', '#.H.#'] },
  { theme: 0, nouveau: 'tondeuse', carte: ['##F##', '#...#', '#.#.#', '1....', '#.#.#', '#...#', '##H##'] },
  { theme: 0, nouveau: 'petits', carte: ['######', '#b..F#', '#.##.#', '#..#.#', '##.b.#', '#..#.#', '#H..b#', '######'] },
  { theme: 0, carte: ['#######', '#..F..#', '#.b...#', '2......', '#.#.#.#', '......1', '#b...b#', '#..H..#', '#######'] },
  { theme: 0, nouveau: 'arroseur', carte: ['###F###', '#.....#', '#.....#', '#..O..#', '#.....#', '#.....#', '#..b..#', '#..H..#', '#######'], arroseurs: [{ dir: 2, long: 3 }] },
  { theme: 1, nouveau: 'pomme', carte: ['###F###', '##...##', '##1..##', '##..2##', '##...##', '#..a..#', '#.#.#.#', '#..H..#', '#######'] },
  { theme: 1, nouveau: 'chien', carte: ['#######', '#F...b#', '#.#.#.#', '#.....#', '##.D..#', '#.....#', '#.#.#.#', '#..H.b#', '#######'] },
  { theme: 1, carte: ['#######', '#F....#', '#.....#', '1......', '#..D..#', '......2', '#.bab.#', '#..H..#', '#######'] },
  { theme: 1, carte: ['#######', '#..b.F#', '#.....#', '#.O.D.#', '#.....#', '#b....#', '#..#..#', '#..H.b#', '#######'], arroseurs: [{ dir: 0, long: 1 }] },
  { theme: 1, carte: ['#######', '#..F.b#', '1......', '#.#D#.#', '#..O..#', '#.#.#.#', '......2', '#b.H.a#', '#######'], arroseurs: [{ dir: 1, long: 2 }] },
  { theme: 2, nouveau: 'pot', carte: ['#######', '#.F...#', '#.....#', '#..p..#', '#..O..#', '#.....#', '#..p..#', '#..H..#', '#######'], arroseurs: [{ dir: 3, long: 3 }] },
  { theme: 2, carte: ['#######', '#..F..#', '#.....#', '1.....#', '#.#p#.#', '......2', '#.#p#.#', '#b.H.b#', '#######'] },
  { theme: 2, carte: ['#######', '#F...##', '#....D#', '#.###.#', '#..O..#', '#.p...#', '#.b.b.#', '#bH...#', '#######'], arroseurs: [{ dir: 1, long: 2 }] },
  { theme: 2, nouveau: 'rapide', carte: ['#######', '#.F.b.#', '5......', '#.#.#.#', '#.a...#', '......6', '#.#.#.#', '#b.H..#', '#######'] },
  { theme: 2, carte: ['#######', '#F...b#', '1......', '#.#.#.#', '#..O..#', '#.p..D#', '......6', '#b.aH.#', '#######'], arroseurs: [{ dir: 2, long: 2 }] },
  { theme: 3, nouveau: 'pente', carte: ['#######', '#F...b#', '#..^..#', '1..^...', '#..^..#', '#..^..#', '#.....#', '#b.H..#', '#######'] },
  { theme: 3, carte: ['#######', '#F.b..#', '5......', '#.#.#^#', '#.D..^#', '#....^#', '#<<<..#', '#b..H.#', '#######'] },
  { theme: 3, nouveau: 'familles', carte: ['#######', '#..F..#', '#.....#', '#.#.#.#', '1......', '#.#.#.#', '#b...b#', '#H...G#', '#######'] },
  { theme: 3, carte: ['#######', '#F...F#', '#..b..#', '#.pOp.#', '#.....#', '......1', '#.#.#.#', '#H.b.G#', '#######'], arroseurs: [{ dir: 2, long: 3 }] },
  { theme: 3, carte: ['#######', '#F.b.F#', '5......', '#.^#p.#', '#.^.O.#', '#.^.D.#', '#a....6', '#H.b.G#', '#######'], arroseurs: [{ dir: 3, long: 2 }] }
];
// Nombre minimal de tours de chaque jardin, calculé par un solveur (recherche en largeur sur tous les états).
var PARS = [8, 8, 14, 16, 9, 9, 12, 15, 18, 16, 8, 29, 14, 16, 26, 13, 16, 16, 20, 15];
NIVEAUX.forEach(function (n, i) { n.par = PARS[i]; });
// </NIVEAUX>
window.JEL_NIVEAUX = NIVEAUX.length;
</script>
<script>
'use strict';
(function () {
  const $ = (id) => document.getElementById(id);
  const tr = (cle, vars) => window.JEL_I18N.t(cle, vars);
  const nombre = (x) => window.JEL_I18N.nombre(x);

  // ------------------------------------------------------------------
  // Réglages
  // ------------------------------------------------------------------
  NIVEAUX.forEach((n) => { n.limite = n.par * 2 + 6; });
  const THEMES = [

      if (v === 0) { g.fillStyle = '#f7f1a8'; ellipse(g, cx + c * 0.15, cy - c * 0.1, c * 0.06, c * 0.06); g.fill(); ellipse(g, cx - c * 0.18, cy + c * 0.05, c * 0.05, c * 0.05); g.fill(); }

        g.fillStyle = '#d9a86a'; ellipse(g, x + c * 0.82, cy + c * 0.01, c * 0.1, c * 0.2); g.fill();
        g.strokeStyle = '#8a5a2b'; g.lineWidth = c * 0.03; g.beginPath(); g.arc(x + c * 0.82, cy + c * 0.01, c * 0.06, 0, Math.PI * 2); g.stroke();

        g.fillStyle = '#f0953a'; ellipse(g, cx, cy + c * 0.08, c * 0.18, c * 0.32); g.fill();
        g.strokeStyle = '#b85d17'; g.lineWidth = c * 0.03; g.beginPath(); g.ellipse(cx, cy + c * 0.08, c * 0.3, c * 0.32, 0, 0, Math.PI * 2); g.stroke();

  function dessinerTondeuse(g, cx, cy, c, dx, dy, vit, temps) {
    g.save(); g.translate(cx, cy);

    g.strokeStyle = '#555'; g.lineWidth = c * 0.05; g.beginPath(); g.moveTo(-c * 0.25, 0); g.lineTo(-c * 0.48, 0); g.stroke();

    ellipse(g, c * 0.2, -c * 0.27, c * 0.1, c * 0.07); g.fill(); ellipse(g, c * 0.2, c * 0.27, c * 0.1, c * 0.07); g.fill();
    g.fillStyle = '#d9483b'; rondRect(g, -c * 0.3, -c * 0.25, c * 0.62, c * 0.5, c * 0.12); g.fill();
    g.fillStyle = '#b8352a'; rondRect(g, -c * 0.12, -c * 0.15, c * 0.3, c * 0.3, c * 0.08); g.fill();
    if (vit > 1) { g.fillStyle = '#f5c443'; g.fillRect(-c * 0.28, -c * 0.06, c * 0.58, c * 0.05); g.fillRect(-c * 0.28, c * 0.03, c * 0.58, c * 0.05); }
    g.fillStyle = '#c9c9c9'; rondRect(g, c * 0.28, -c * 0.2, c * 0.08, c * 0.4, c * 0.03); g.fill();
    g.restore();
  }

  function dessinerArroseur(g, cx, cy, c, angle) {
    g.fillStyle = 'rgba(0,0,0,.2)'; ellipse(g, cx, cy + c * 0.18, c * 0.3, c * 0.1); g.fill();
    g.fillStyle = '#7d8a96'; ellipse(g, cx, cy + c * 0.05, c * 0.3, c * 0.22); g.fill();
    g.fillStyle = '#4f6070'; ellipse(g, cx, cy, c * 0.18, c * 0.18); g.fill();
    g.save(); g.translate(cx, cy); g.rotate(angle);
    g.fillStyle = '#3c8fd8'; rondRect(g, -c * 0.06, -c * 0.06, c * 0.36, c * 0.12, c * 0.05); g.fill();
    g.restore();
    g.fillStyle = '#9fd3ff'; ellipse(g, cx, cy, c * 0.07, c * 0.07); g.fill();
  }

  function dessinerChien(g, cx, cy, c, temps, reveille) {
    const souffle = 1 + Math.sin(temps * 2.2) * 0.03;
    g.fillStyle = 'rgba(0,0,0,.18)'; ellipse(g, cx, cy + c * 0.3, c * 0.42, c * 0.12); g.fill();
    g.save(); g.translate(cx, cy + c * 0.05); g.scale(souffle, souffle);
    g.fillStyle = '#d9b27c'; ellipse(g, 0, 0, c * 0.42, c * 0.28); g.fill();
    g.fillStyle = '#c49a62'; ellipse(g, -c * 0.32, -c * 0.02, c * 0.1, c * 0.18, 0.6); g.fill(); // queue
    g.fillStyle = '#e8c895'; ellipse(g, c * 0.2, -c * 0.06, c * 0.2, c * 0.17); g.fill(); // tête
    g.fillStyle = '#8a5a2b'; ellipse(g, c * 0.1, -c * 0.12, c * 0.08, c * 0.15, 0.5); g.fill(); // oreille
    g.fillStyle = '#2a1d14'; ellipse(g, c * 0.37, -c * 0.02, c * 0.05, c * 0.04); g.fill();
    if (reveille) { g.fillStyle = '#2a1d14'; ellipse(g, c * 0.24, -c * 0.1, c * 0.035, c * 0.04); g.fill(); }
    else { g.strokeStyle = '#2a1d14'; g.lineWidth = Math.max(1, c * 0.025); g.beginPath(); g.arc(c * 0.24, -c * 0.1, c * 0.035, 0.2, Math.PI - 0.2); g.stroke(); }
    g.fillStyle = '#c49a62'; ellipse(g, -c * 0.05, c * 0.14, c * 0.16, c * 0.08); g.fill(); // pattes
    g.restore();
    if (!reveille) { // bulles de sommeil
      for (let i = 0; i < 3; i++) {
        const p = (temps * 0.5 + i / 3) % 1;
        g.fillStyle = 'rgba(255,255,255,' + (0.8 * (1 - p)) + ')';
        ellipse(g, cx + c * 0.3 + p * c * 0.15, cy - c * 0.2 - p * c * 0.35, c * (0.03 + p * 0.05), c * (0.03 + p * 0.05)); g.fill();

    } else {
      g.fillStyle = '#f5c443'; g.beginPath();
      for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2, rr = i % 2 ? c * 0.08 : c * 0.18; g.lineTo(cx + c * 0.32 + Math.cos(a) * rr, cy - c * 0.32 + Math.sin(a) * rr); }
      g.closePath(); g.fill();
    }
  }

  function dessinerPot(g, cx, cy, c) {
    g.fillStyle = 'rgba(0,0,0,.18)'; ellipse(g, cx, cy + c * 0.34, c * 0.3, c * 0.09); g.fill();
    g.fillStyle = '#c4643a'; g.beginPath(); g.moveTo(cx - c * 0.28, cy - c * 0.02); g.lineTo(cx + c * 0.28, cy - c * 0.02); g.lineTo(cx + c * 0.2, cy + c * 0.34); g.lineTo(cx - c * 0.2, cy + c * 0.34); g.closePath(); g.fill();
    g.fillStyle = '#d97a4c'; rondRect(g, cx - c * 0.32, cy - c * 0.1, c * 0.64, c * 0.13, c * 0.04); g.fill();
    g.strokeStyle = '#4f9a3c'; g.lineWidth = c * 0.04; g.beginPath(); g.moveTo(cx, cy - c * 0.1); g.lineTo(cx, cy - c * 0.28); g.stroke();
    g.fillStyle = '#4f9a3c'; ellipse(g, cx - c * 0.1, cy - c * 0.18, c * 0.09, c * 0.04, -0.5); g.fill();
    g.fillStyle = '#e6779c';
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; ellipse(g, cx + Math.cos(a) * c * 0.08, cy - c * 0.32 + Math.sin(a) * c * 0.08, c * 0.07, c * 0.07); g.fill(); }
    g.fillStyle = '#f5c443'; ellipse(g, cx, cy - c * 0.32, c * 0.05, c * 0.05); g.fill();
  }

  function dessinerPomme(g, cx, cy, c, temps) {
    const b = Math.sin(temps * 3 + cx) * c * 0.03;
    g.fillStyle = 'rgba(0,0,0,.15)'; ellipse(g, cx, cy + c * 0.25, c * 0.2, c * 0.06); g.fill();
    g.fillStyle = '#d9483b'; ellipse(g, cx - c * 0.07, cy + b, c * 0.15, c * 0.18); g.fill(); ellipse(g, cx + c * 0.07, cy + b, c * 0.15, c * 0.18); g.fill();
    g.fillStyle = 'rgba(255,255,255,.45)'; ellipse(g, cx - c * 0.1, cy - c * 0.06 + b, c * 0.04, c * 0.06); g.fill();
    g.strokeStyle = '#6b4a2f'; g.lineWidth = c * 0.035; g.beginPath(); g.moveTo(cx, cy - c * 0.14 + b); g.lineTo(cx + c * 0.03, cy - c * 0.26 + b); g.stroke();
    g.fillStyle = '#4f9a3c'; ellipse(g, cx + c * 0.1, cy - c * 0.23 + b, c * 0.08, c * 0.04, -0.4); g.fill();
  }

  function dessinerMain(g, x, y, c, presse) {
    g.save(); g.translate(x, y); const s = c / 60; g.scale(s, s);
    if (presse) { g.fillStyle = 'rgba(255,255,255,.55)'; ellipse(g, 0, 0, 22, 22); g.fill(); }
    g.translate(4, 6);
    g.fillStyle = '#fff'; g.strokeStyle = '#3b2a1c'; g.lineWidth = 3;
    g.beginPath();
    g.moveTo(0, 0); g.lineTo(0, 26); g.quadraticCurveTo(-10, 22, -10, 30); g.lineTo(2, 46); g.lineTo(24, 46); g.quadraticCurveTo(30, 38, 30, 28); g.lineTo(30, 20);
    g.quadraticCurveTo(30, 15, 25, 15); g.quadraticCurveTo(22, 12, 18, 14); g.quadraticCurveTo(15, 10, 11, 12); g.lineTo(11, 0); g.quadraticCurveTo(11, -6, 5.5, -6); g.quadraticCurveTo(0, -6, 0, 0);
    g.closePath(); g.fill(); g.stroke();
    g.restore();
  }

  // Dessine un jardin complet. vue : { fixe, avant, apres, p (0..1), theme, nid, temps, apercu, selection, indices, main }
  function dessinerJardin(g, ox, oy, c, v) {
    const f = v.fixe, ap = v.apres, av = v.avant || ap, p = v.p, th = THEMES[v.theme], temps = v.temps;
    const lerp = (a, b) => a + (b - a) * p;
    // Fond et herbe
    g.fillStyle = 'rgba(0,0,0,.25)'; rondRect(g, ox - c * 0.12, oy - c * 0.08, f.l * c + c * 0.24, f.h * c + c * 0.24, c * 0.3); g.fill();
    g.fillStyle = th.herbe; rondRect(g, ox, oy, f.l * c, f.h * c, c * 0.22); g.fill();
    for (let y = 0; y < f.h; y++) for (let x = 0; x < f.l; x++) {
      const px = ox + x * c, py = oy + y * c, s = f.sol[y][x];
      if ((x + y) % 2 && s !== '#') { g.fillStyle = th.herbe2; g.fillRect(px, py, c, c); }
      if (s === '.' && hasard(x * 31 + y * 17 + v.theme) > 0.55) {
        g.strokeStyle = th.touffe; g.lineWidth = Math.max(1, c * 0.03);
        const tx = px + c * (0.2 + hasard(x + y * 9) * 0.6), ty = py + c * (0.3 + hasard(x * 5 + y) * 0.5);
        g.beginPath(); g.moveTo(tx - c * 0.06, ty - c * 0.08); g.lineTo(tx, ty); g.lineTo(tx + c * 0.06, ty - c * 0.09); g.moveTo(tx, ty); g.lineTo(tx, ty - c * 0.11); g.stroke();
      }
      if (s === '~') {
        g.fillStyle = '#4aa3df'; rondRect(g, px + 1, py + 1, c - 2, c - 2, c * 0.22); g.fill();
        g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = Math.max(1, c * 0.04);
        const o = Math.sin(temps * 2 + x + y) * c * 0.05;
        g.beginPath(); g.moveTo(px + c * 0.2 + o, py + c * 0.4); g.quadraticCurveTo(px + c * 0.35 + o, py + c * 0.3, px + c * 0.5 + o, py + c * 0.4); g.stroke();
        g.beginPath(); g.moveTo(px + c * 0.45 - o, py + c * 0.65); g.quadraticCurveTo(px + c * 0.6 - o, py + c * 0.55, px + c * 0.75 - o, py + c * 0.65); g.stroke();
      }
      if (PENTES[s] !== undefined) {
        g.fillStyle = '#c8a26a'; g.fillRect(px, py, c, c);
        g.fillStyle = '#b48b52'; g.fillRect(px, py + c * 0.85, c, c * 0.15);
        const d = DIRS[PENTES[s]];
        g.save(); g.translate(px + c / 2, py + c / 2); g.rotate(Math.atan2(d[1], d[0]));
        g.strokeStyle = 'rgba(255,255,240,.85)'; g.lineWidth = c * 0.07; g.lineCap = 'round'; g.lineJoin = 'round';
        const dec = ((temps * 0.8) % 1) * c * 0.25;
        for (let k = -1; k <= 0; k++) { const bx = k * c * 0.25 + dec; g.beginPath(); g.moveTo(bx - c * 0.08, -c * 0.16); g.lineTo(bx + c * 0.06, 0); g.lineTo(bx - c * 0.08, c * 0.16); g.stroke(); }
        g.restore();
      }
    }
    // Zones des chiens
    f.chiens.forEach((ch) => {
      g.fillStyle = 'rgba(140,90,220,.2)';
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const x = ch.x + dx, y = ch.y + dy;
        if ((dx || dy) && dedans(f, x, y) && f.sol[y][x] !== '#') { g.fillRect(ox + x * c + 2, oy + y * c + 2, c - 4, c - 4); }
      }
      g.strokeStyle = 'rgba(110,60,190,.55)'; g.lineWidth = Math.max(1.5, c * 0.04); g.setLineDash([c * 0.12, c * 0.08]);
      rondRect(g, ox + (ch.x - 1) * c + 3, oy + (ch.y - 1) * c + 3, c * 3 - 6, c * 3 - 6, c * 0.3); g.stroke();
      g.setLineDash([]);
    });
    // Aperçu du prochain tour
    if (v.apercu) {
      g.strokeStyle = 'rgba(200,40,30,.7)'; g.lineWidth = Math.max(1.5, c * 0.035);
      v.apercu.tondues.forEach((q) => { g.fillStyle = 'rgba(235,60,50,.3)'; rondRect(g, ox + q.x * c + 3, oy + q.y * c + 3, c - 6, c - 6, c * 0.18); g.fill(); g.stroke(); });
      g.strokeStyle = 'rgba(40,110,210,.75)'; g.lineWidth = Math.max(1.5, c * 0.045); g.setLineDash([c * 0.1, c * 0.07]);
      v.apercu.mouillees.forEach((q) => { rondRect(g, ox + q.x * c + 4, oy + q.y * c + 4, c - 8, c - 8, c * 0.18); g.stroke(); });
      g.setLineDash([]);
    }
    // Jets d'eau actuels
    casesJet(f, ap, ap.tic).forEach((q) => {
      const px = ox + q.x * c, py = oy + q.y * c;
      g.fillStyle = 'rgba(80,170,240,.35)'; rondRect(g, px + 2, py + 2, c - 4, c - 4, c * 0.2); g.fill();
      for (let k = 0; k < 4; k++) {
        const ph = (temps * 1.6 + k / 4 + q.x * 0.3) % 1;
        g.fillStyle = 'rgba(255,255,255,' + (0.9 - ph * 0.6) + ')';
        ellipse(g, px + c * (0.2 + hasard(k + q.x) * 0.6), py + c * (0.2 + ph * 0.6), c * 0.05, c * 0.07); g.fill();
      }
    });
    // Tas de feuilles
    for (let y = 0; y < f.h; y++) for (let x = 0; x < f.l; x++) if (f.sol[y][x] === 'F') {
      const plein = ap.meres.some((m) => m.maison && m.x === x && m.y === y);
      dessinerTas(g, ox + x * c + c / 2, oy + y * c + c / 2, c, v.nid || 0, temps, plein);
    }
    // Obstacles
    for (let y = 0; y < f.h; y++) for (let x = 0; x < f.l; x++) if (f.sol[y][x] === '#') dessinerObstacle(g, ox + x * c, oy + y * c, c, v.theme, x, y);
    // Pots (glissent pendant l'animation)
    ap.pots.forEach((q, i) => { const a = av.pots[i] || q; dessinerPot(g, ox + lerp(a.x, q.x) * c + c / 2, oy + lerp(a.y, q.y) * c + c / 2, c); });
    // Pommes (celles mangées rétrécissent)
    av.pommes.forEach((q) => {
      const reste = trouver(ap.pommes, q.x, q.y) >= 0;
      const s = reste ? 1 : 1 - p;
      if (s > 0.02) { g.save(); g.translate(ox + q.x * c + c / 2, oy + q.y * c + c / 2); g.scale(s, s); dessinerPomme(g, 0, 0, c, temps); g.restore(); }
    });
    // Petits perdus, cachés sous une feuille
    ap.perdus.forEach((q) => {
      const cx = ox + q.x * c + c / 2, cy = oy + q.y * c + c / 2;
      dessinerHerisson(g, cx, cy + c * 0.08, c * 0.22, Object.assign(stylePetit((v.decalage || 0) + q.id, 0), { boule: true }));
      g.fillStyle = '#e8a33a'; ellipse(g, cx - c * 0.05, cy - c * 0.02, c * 0.26, c * 0.13, -0.4); g.fill();
      g.strokeStyle = '#b8732a'; g.lineWidth = Math.max(1, c * 0.025); g.beginPath(); g.moveTo(cx - c * 0.28, cy + c * 0.1); g.lineTo(cx + c * 0.18, cy - c * 0.14); g.stroke();
      const sc = 0.5 + 0.5 * Math.sin(temps * 4 + q.x * 2);
      g.fillStyle = 'rgba(255,250,200,' + sc + ')';
      const sx = cx + c * 0.3, sy = cy - c * 0.3, r = c * 0.08 * (0.6 + sc * 0.4);
      g.beginPath(); g.moveTo(sx, sy - r); g.lineTo(sx + r * 0.3, sy - r * 0.3); g.lineTo(sx + r, sy); g.lineTo(sx + r * 0.3, sy + r * 0.3); g.lineTo(sx, sy + r); g.lineTo(sx - r * 0.3, sy + r * 0.3); g.lineTo(sx - r, sy); g.lineTo(sx - r * 0.3, sy - r * 0.3); g.closePath(); g.fill();
    });
    // Chiens
    f.chiens.forEach((ch) => dessinerChien(g, ox + ch.x * c + c / 2, oy + ch.y * c + c / 2, c, temps, ap.cause === 'chien'));
    // Arroseurs (le bec tourne pendant l'animation)
    f.arroseurs.forEach((a) => {
      const d0 = dirJet(a, av.tic), d1 = dirJet(a, ap.tic);
      let a0 = Math.atan2(DIRS[d0][1], DIRS[d0][0]), a1 = Math.atan2(DIRS[d1][1], DIRS[d1][0]);
      while (a1 - a0 > Math.PI) a1 -= Math.PI * 2; while (a0 - a1 > Math.PI) a1 += Math.PI * 2;
      dessinerArroseur(g, ox + a.x * c + c / 2, oy + a.y * c + c / 2, c, a0 + (a1 - a0) * p);
    });
    // Tondeuses
    ap.tondeuses.forEach((t, i) => {
      const a = av.tondeuses[i] || t;
      dessinerTondeuse(g, ox + lerp(a.x, t.x) * c + c / 2, oy + lerp(a.y, t.y) * c + c / 2, c, t.dx, t.dy, t.vit, temps);
    });
    // Hérissons : petits qui suivent, puis mamans
    ap.meres.forEach((m, i) => {
      const ma = av.meres[i] || m, fam = FAMILLES[m.fam];
      const peur = ap.fin === 'perdu';
      if (ma.maison) return;
      m.petits.forEach((q) => {
        let a = ma.petits.find((z) => z.id === q.id);
        if (!a) a = av.perdus.find((z) => z.id === q.id) || q;
        const x = lerp(a.x, q.x), y = lerp(a.y, q.y);
        const saut = Math.sin(p * Math.PI) * c * 0.1;
        const st = stylePetit((v.decalage || 0) + q.id, m.fam);
        dessinerHerisson(g, ox + x * c + c / 2, oy + y * c + c / 2 - saut, c * 0.26, Object.assign(st, { face: (v.faces && v.faces[i]) || 1, peur: peur, pas: p * Math.PI * 2 }));
      });
      const x = lerp(ma.x, m.x), y = lerp(ma.y, m.y);
      const roule = Math.abs(m.x - ma.x) + Math.abs(m.y - ma.y) > 1 && p < 1;
      const disparait = m.maison ? 1 - Math.max(0, (p - 0.6) / 0.4) : 1;
      if (disparait <= 0.02) return;
      const cx = ox + x * c + c / 2, cy = oy + y * c + c / 2;
      if (v.selection === i && !m.maison && !ap.fin) {
        g.strokeStyle = fam.halo; g.lineWidth = Math.max(2, c * 0.06);
        ellipse(g, cx, cy + c * 0.05, c * 0.46 + Math.sin(temps * 5) * c * 0.03, c * 0.44); g.stroke();
      }
      g.save(); g.translate(cx, cy); g.scale(disparait, disparait);
      dessinerHerisson(g, 0, 0, c * 0.36, { piquants: fam.piquants, piquants2: fam.piquants2, corps: fam.corps, face: (v.faces && v.faces[i]) || 1, boule: roule, rot: p * 12, peur: peur, pas: p * Math.PI * 2 });
      g.restore();
    });
    // Indices de déplacement autour de la maman choisie
    if (v.indices) v.indices.forEach((q) => {
      const cx = ox + q.x * c + c / 2, cy = oy + q.y * c + c / 2;
      g.fillStyle = 'rgba(255,255,255,' + (0.45 + 0.25 * Math.sin(temps * 5)) + ')';
      ellipse(g, cx, cy, c * 0.12, c * 0.12); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = Math.max(1.5, c * 0.035); ellipse(g, cx, cy, c * 0.2, c * 0.2); g.stroke();
    });
    // Repère de l'endroit du problème
