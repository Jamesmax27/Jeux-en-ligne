  // ==========================================================================
  // 3. Progression du joueur (sauvegardée avec save.js)
  // ==========================================================================

  const CLE_SON = 'jel-bataille-coffres-son';
  function lireSon() {
    try { const v = localStorage.getItem(CLE_SON); if (v !== null) return v === '1'; } catch (e) { /* stockage indisponible */ }
    return true;
  }
  function ecrireSon(v) { try { localStorage.setItem(CLE_SON, v ? '1' : '0'); } catch (e) { /* stockage indisponible */ } }

  function progressionNeuve() {
    return {
      niveauMax: 1, etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0),
      cartes: DEPART.slice(), paquet: DEPART.slice(), chapeau: 'tricorne', voile: 'blanche', vus: {}, son: lireSon(),
    };
  }
  // Relit une sauvegarde (elle peut être partielle : seulement niveau et score).
  function progressionDepuis(d) {
    const p = progressionNeuve();
    if (!d) return p;
    const nombres = (liste, max) => NIVEAUX.map((_, i) => {
      const v = Array.isArray(liste) ? Number(liste[i]) : 0;
      return isFinite(v) && v > 0 ? Math.min(max, Math.floor(v)) : 0;
    });
    p.etoiles = nombres(d.etoiles, 3);
    p.records = nombres(d.records, 999);
    if (Array.isArray(d.cartes)) p.cartes = Array.from(new Set(DEPART.concat(d.cartes.filter((id) => CARTES[id]))));
    // Les cartes des îles déjà conquises sont forcément gagnées.
    p.etoiles.forEach((e, i) => { if (e > 0 && !p.cartes.includes(RECOMPENSES[i])) p.cartes.push(RECOMPENSES[i]); });
    if (Array.isArray(d.paquet)) {
      const paquet = Array.from(new Set(d.paquet.filter((id) => p.cartes.includes(id))));
      p.paquet = paquet.length === TAILLE_PAQUET ? paquet : paquetConseille(p.cartes);
    } else p.paquet = paquetConseille(p.cartes);
    const derniere = p.etoiles.reduce((m, e, i) => (e > 0 ? i + 2 : m), 1);
    p.niveauMax = Math.min(NIVEAUX.length, Math.max(1, derniere, Math.floor(Number(d.niveauMax) || 1), Math.floor(Number(d.niveau) || 1)));
    if (CHAPEAUX.some((c) => c.id === d.chapeau)) p.chapeau = d.chapeau;
    if (VOILES.some((v) => v.id === d.voile)) p.voile = d.voile;
    if (d.vus && typeof d.vus === 'object') for (const k in d.vus) if (d.vus[k] === true) p.vus[k] = true;
    if (d.options && typeof d.options.son === 'boolean') p.son = d.options.son;
    // Un chapeau ou une voile encore fermés reviennent aux premiers.
    if (totalEtoiles(p) < chapeauDef(p.chapeau).etoiles) p.chapeau = 'tricorne';
    if (totalEtoiles(p) < (VOILES.find((v) => v.id === p.voile) || VOILES[0]).etoiles) p.voile = 'blanche';
    return p;
  }
  function totalEtoiles(p) { return (p || P).etoiles.reduce((a, b) => a + b, 0); }
  function scoreTotal() { return P.records.reduce((a, b) => a + b, 0); }

  // Paquet conseillé : toutes les bourses, 2 tourbillons au plus, puis les plus fortes.
  function paquetConseille(cartes) {
    const liste = cartes.slice();
    const bourses = liste.filter((id) => CARTES[id].e === 'bourse');
    const tourb = liste.filter((id) => CARTES[id].e === 'tourbillon').slice(0, 2);
    const normales = liste.filter((id) => !CARTES[id].e).sort((a, b) => CARTES[b].f - CARTES[a].f);
    return bourses.concat(tourb, normales).slice(0, TAILLE_PAQUET);
  }
  // Nouvelle carte : elle prend la place de la plus faible carte sans effet.
  function gagnerCarte(id) {
    if (P.cartes.includes(id)) return false;
    P.cartes.push(id);
    if (P.paquet.length < TAILLE_PAQUET) { P.paquet.push(id); return true; }
    let k = -1, min = 99;
    P.paquet.forEach((p, i) => { const c = CARTES[p]; if (!c.e && c.f < min) { min = c.f; k = i; } });
    if (k >= 0 && (CARTES[id].e || CARTES[id].f > min)) P.paquet[k] = id;
    return true;
  }

  function donneesSauvegarde(niveau) {
    return {
      niveau, score: scoreTotal(), niveauMax: P.niveauMax, etoiles: P.etoiles.slice(), records: P.records.slice(),
      cartes: P.cartes.slice(), paquet: P.paquet.slice(), chapeau: P.chapeau, voile: P.voile, vus: Object.assign({}, P.vus),
      options: { son: P.son },
    };
  }
  // Réglages (paquet, navire, son) : écrits seulement si une partie est déjà sauvegardée.
  function enregistrerReglages() {
    try {
      if (window.JEL_SAVE && JEL_SAVE.existe(JEU)) {
        JEL_SAVE.save(JEU, { cartes: P.cartes.slice(), paquet: P.paquet.slice(), chapeau: P.chapeau, voile: P.voile, options: { son: P.son } });
      }
    } catch (e) { /* sauvegarde indisponible */ }
  }

  let P = null;
  try { P = progressionDepuis(window.JEL_SAVE && JEL_SAVE.existe(JEU) ? JEL_SAVE.load(JEU) : null); }
  catch (e) { P = progressionNeuve(); }

  // ==========================================================================
  // 4. Sons (Web Audio, rien avant le premier geste)
  // ==========================================================================

  let audio = null;
  function preparerAudio() {
    if (audio) { if (audio.state === 'suspended') audio.resume().catch(() => {}); return; }
    try { const C = window.AudioContext || window.webkitAudioContext; if (C) audio = new C(); } catch (e) { audio = null; }
  }
  window.addEventListener('pointerdown', preparerAudio, { passive: true });
  window.addEventListener('keydown', preparerAudio);

  function note(freq, duree, type, vol, retard, versFreq) {
    if (!audio || !P.son) return;
    try {
      const t0 = audio.currentTime + (retard || 0);
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      if (versFreq) o.frequency.exponentialRampToValueAtTime(versFreq, t0 + duree);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
      o.connect(g).connect(audio.destination);
      o.start(t0); o.stop(t0 + duree + 0.05);
    } catch (e) { /* son impossible */ }
  }
  function bruit(duree, vol, freq, retard, versFreq) {
    if (!audio || !P.son) return;
    try {
      const t0 = audio.currentTime + (retard || 0);
      const n = Math.floor(audio.sampleRate * duree);
      const buf = audio.createBuffer(1, n, audio.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      const src = audio.createBufferSource(); src.buffer = buf;
      const f = audio.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(freq || 1000, t0);
      if (versFreq) f.frequency.exponentialRampToValueAtTime(versFreq, t0 + duree);
      const g = audio.createGain();
      g.gain.setValueAtTime(vol || 0.1, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
      src.connect(f).connect(g).connect(audio.destination);
      src.start(t0); src.stop(t0 + duree);
    } catch (e) { /* son impossible */ }
  }
  const SONS = {
    bouton: () => note(660, 0.06, 'triangle', 0.08),
    poser: () => { bruit(0.08, 0.12, 2200); note(220, 0.08, 'triangle', 0.1); },
    retourner: () => { bruit(0.12, 0.1, 3000, 0, 1200); },
    piece: () => { note(988, 0.08, 'square', 0.06); note(1319, 0.22, 'square', 0.06, 0.07); },
    perdu: () => { note(330, 0.16, 'sawtooth', 0.05); note(247, 0.3, 'sawtooth', 0.05, 0.13); },
    egal: () => { note(440, 0.12, 'triangle', 0.08); note(440, 0.12, 'triangle', 0.08, 0.16); },
    vent: () => bruit(1.0, 0.12, 500, 0, 2400),
    tourbillon: () => note(900, 0.6, 'sine', 0.1, 0, 180),
    tempete: () => { bruit(1.3, 0.25, 160); bruit(0.4, 0.3, 90, 0.25); note(60, 0.8, 'sawtooth', 0.08, 0.2, 40); },
    coffre: () => [523, 659, 784, 1047].forEach((f, i) => note(f, 0.18, 'triangle', 0.1, i * 0.09)),
    bourse: () => [1319, 1568, 1319, 1760].forEach((f, i) => note(f, 0.1, 'square', 0.05, i * 0.06)),
    victoire: () => [523, 659, 784, 659, 784, 1047].forEach((f, i) => note(f, i === 5 ? 0.5 : 0.16, 'triangle', 0.12, i * 0.14)),
    defaite: () => [392, 349, 311, 262].forEach((f, i) => note(f, 0.28, 'triangle', 0.1, i * 0.2)),
    etoile: () => { note(1568, 0.12, 'sine', 0.12); note(2093, 0.3, 'sine', 0.1, 0.08); },
    nouveau: () => [784, 988, 1175, 1568].forEach((f, i) => note(f, 0.14, 'sine', 0.1, i * 0.08)),
    erreur: () => note(180, 0.15, 'square', 0.05),
  };
  function son(nom) { if (SONS[nom]) SONS[nom](); }

  function majBoutonsSon() {
    document.querySelectorAll('.b-son').forEach((b) => {
      b.innerHTML = P.son ? ICONES.sonOui : ICONES.sonNon;
      b.setAttribute('aria-label', traduire(P.son ? 'couperSon' : 'remettreSon'));
      b.setAttribute('aria-pressed', P.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    P.son = !P.son;
    ecrireSon(P.son);
    majBoutonsSon();
    enregistrerReglages();
    son('bouton');
  }

  // ==========================================================================
  // 5. Temps du jeu (s'arrête pendant la pause)
  // ==========================================================================

  let pause = false;
  let jeton = 0;               // change quand on quitte un duel : les attentes en cours sont oubliées
  const minuteurs = [];
  let avant = performance.now();
  function boucle(t) {
    const dt = Math.min(100, t - avant);
    avant = t;
    if (!pause) {
      for (const m of minuteurs.slice()) {
        m.reste -= dt;
        if (m.reste <= 0) { minuteurs.splice(minuteurs.indexOf(m), 1); m.f(); }
      }
    }
    requestAnimationFrame(boucle);
  }
  requestAnimationFrame(boucle);
  function delai(ms) {
    const j = jeton;
    return new Promise((ok) => minuteurs.push({ reste: ms, f: () => { if (j === jeton) ok(); } }));
  }
  function oublierAttentes() { jeton++; minuteurs.length = 0; choixEnAttente = null; tutoEnAttente = null; }

  // ==========================================================================
  // 6. Écrans
  // ==========================================================================

  let ecranCourant = 'titre';
  function montrer(nom) {
    document.querySelectorAll('.ecran').forEach((s) => s.classList.toggle('actif', s.id === 'ecran-' + nom));
    ecranCourant = nom;
  }
  function ouvrirFenetre(id) { $(id).classList.add('ouvert'); }
  function fermerFenetre(id) { $(id).classList.remove('ouvert'); }
  function fenetreOuverte(id) { return $(id).classList.contains('ouvert'); }

  function majEtoilesAffichees() {
    const html = svgEtoile(true) + `<span>${attr(traduire('etoilesTotal', { n: totalEtoiles(), max: NIVEAUX.length * 3 }))}</span>`;
    ['etoiles-titre', 'etoiles-carte', 'etoiles-navire'].forEach((id) => { $(id).innerHTML = html; });
    $('etoiles-titre').setAttribute('aria-label', traduire('etoilesAria', { n: totalEtoiles(), max: NIVEAUX.length * 3 }));
  }

  function allerTitre() {
    oublierAttentes();
    enPartie = false;
    pause = false;
    document.body.classList.remove('en-pause');
    ['f-pause', 'f-fin', 'f-tuto', 'f-ile'].forEach(fermerFenetre);
    $('scene-titre').innerHTML = svgSceneTitre();
    majEtoilesAffichees();
    montrer('titre');
    setTimeout(() => $('b-jouer').focus({ preventScroll: true }), 30);
  }

  function lancerDepuisTitre() {
    son('bouton');
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => {
        P = progressionDepuis(d);
        const n = Math.min(NIVEAUX.length, Math.max(1, d.niveau || 1));
        P.niveauMax = Math.max(P.niveauMax, n);
        lancerNiveau(n - 1);
      },
      onNouvelle: () => {
        const sonActif = P.son;
        P = progressionNeuve();
        P.son = sonActif;
        lancerNiveau(0);
      },
      onEffacer: () => {
        const sonActif = P.son;
        P = progressionNeuve();
        P.son = sonActif;
        allerTitre();
      },
    });
  }

  // ---------- Carte des mers ----------
  const POSITIONS = NIVEAUX.map((_, i) => {
    const ligne = Math.floor(i / 4), col = i % 4;
    const c = ligne % 2 ? 3 - col : col;
    return { x: 13 + c * 24.6 + (ligne % 2 ? -2 : 2), y: 9 + ligne * 20.5 + (col % 2 ? 3 : 0) };
  });
  let ileChoisie = 0;
  function allerCarte() {
    oublierAttentes();
    enPartie = false; pause = false;
    document.body.classList.remove('en-pause');
    ['f-pause', 'f-fin', 'f-tuto', 'f-ile'].forEach(fermerFenetre);
    majEtoilesAffichees();
    const zone = $('carte-mers');
    let route = '';
    POSITIONS.forEach((p, i) => { route += (i ? ' L' : 'M') + p.x + ' ' + p.y; });
    let html = `<svg class="route" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="${route}" fill="none" stroke="#fff6e0" stroke-width="2.5" stroke-dasharray="5 6" vector-effect="non-scaling-stroke" opacity=".8"/></svg>`;
    NIVEAUX.forEach((_, i) => {
      const fermee = i + 1 > P.niveauMax, gagnee = P.etoiles[i] > 0;
      const p = POSITIONS[i];
      let etoiles = '';
      if (!fermee) for (let k = 0; k < 3; k++) etoiles += svgEtoile(k < P.etoiles[i]);
      const aria = fermee ? traduire('ileFermee', { n: i + 1 }) : traduire('ileAria', { n: i + 1, nom: traduire('ile.' + (i + 1)), e: P.etoiles[i] });
      html += `<button type="button" class="ile ${fermee ? 'fermee' : ''} ${i + 1 === P.niveauMax && !gagnee ? 'courante' : ''}" data-i="${i}" style="left:${p.x}%;top:${p.y}%" aria-label="${attr(aria)}">${svgIle(i, gagnee, fermee)}<span class="num">${nb(i + 1)}</span><span class="mini-etoiles">${etoiles}</span></button>`;
    });
    zone.innerHTML = html;
    zone.querySelectorAll('.ile').forEach((b) => b.addEventListener('click', () => ouvrirFicheIle(Number(b.dataset.i))));
    montrer('carte');
    ileChoisie = Math.min(P.niveauMax, NIVEAUX.length) - 1;
    setTimeout(() => { const b = zone.querySelector(`[data-i="${ileChoisie}"]`); if (b) b.focus({ preventScroll: true }); }, 30);
  }

  function mecaniques(def) {
    const l = ['base'];
    if (def.ia === 1) l.push('malin');
    if (def.ia === 2) l.push('memoire');
    if (def.vent === 'fixe') l.push('vent');
    else if (def.vent) l.push('ventTourne');
    if (def.tourb) l.push('tourbillon');
    if (def.coffre) l.push('coffre');
    if (def.tempetes.length) l.push('tempete');
    if (def.bourse) l.push('bourse');
    if (def.brume) l.push('brouillard');
    if (def.tresors.length) l.push('tresor');
    return l;
  }
  const ICONES_MECA = {
    base: () => svgPiece(), malin: () => ICONES.malin, memoire: () => ICONES.carnet, vent: () => ICONES.girouette, ventTourne: () => ICONES.girouette,
    tourbillon: () => EFFETS.tourbillon, coffre: () => ICONES.tresorMarque, tempete: () => ICONES.nuage, bourse: () => EFFETS.bourse,
    brouillard: () => DESSIN_DOS, tresor: () => ICONES.tresorMarque,
  };
  function htmlMecas(def) {
    const neuves = def.neuf.map((n) => (n === 'vent' && def.vent !== 'fixe' ? 'ventTourne' : n));
    return mecaniques(def).map((m) => `<span class="meca ${neuves.includes(m) && m !== 'base' ? 'neuve' : ''}">${ICONES_MECA[m]()}${attr(traduire('meca.' + m))}</span>`).join('');
  }

  function ouvrirFicheIle(i) {
    if (i + 1 > P.niveauMax) { son('erreur'); toast(traduire('ileFermeeMsg')); return; }
    son('bouton');
    ileChoisie = i;
    const def = NIVEAUX[i];
    let etoiles = '';
    for (let k = 0; k < 3; k++) etoiles += svgEtoile(k < P.etoiles[i]);
    $('ile-contenu').innerHTML =
      `<div class="portrait">${svgVisage(CAPITAINES[i])}</div>` +
      `<h2 id="t-ile">${attr(traduire('ileTitre', { n: i + 1, nom: traduire('ile.' + (i + 1)) }))}</h2>` +
      `<p>${attr(traduire('capitaineDe', { nom: traduire('cap.' + (i + 1)) }))}</p>` +
      `<div class="etoiles-fin" style="margin:4px 0">${etoiles}</div>` +
      `<p>${attr(traduire('manches', { n: def.r }))}</p>` +
      `<div class="mecas">${htmlMecas(def)}</div>` +
      `<p>${attr(traduire('objectifs', { e2: def.e2, e3: def.e3 }))}</p>` +
      `<p>${attr(P.records[i] ? traduire('record', { n: P.records[i] }) : traduire('pasDeRecord'))}</p>` +
      `<div class="boutons"><button class="bouton or" type="button" id="b-hisser">${attr(traduire('hisser'))}</button><button class="bouton" type="button" id="b-fermer-ile">${attr(traduire('fermer'))}</button></div>`;
    ouvrirFenetre('f-ile');
    $('b-hisser').addEventListener('click', () => { fermerFenetre('f-ile'); lancerNiveau(i); });
    $('b-fermer-ile').addEventListener('click', () => { son('bouton'); fermerFenetre('f-ile'); const b = document.querySelector(`.ile[data-i="${i}"]`); if (b) b.focus(); });
    setTimeout(() => $('b-hisser').focus(), 30);
  }

  let minuteurToast = null;
  function toast(texte) {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const d = document.createElement('div');
    d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = texte;
    document.body.appendChild(d);
    clearTimeout(minuteurToast);
    minuteurToast = setTimeout(() => d.remove(), 2200);
  }

  // ---------- Mon paquet ----------
  let retourPaquet = 'titre';
  function allerPaquet(depuis) {
    retourPaquet = depuis || 'titre';
    son('bouton');
    dessinerCollection();
    montrer('paquet');
  }
  function dessinerCollection() {
    const ordre = Object.keys(CARTES).sort((a, b) => COULEURS.indexOf(CARTES[a].c) - COULEURS.indexOf(CARTES[b].c) || CARTES[a].f - CARTES[b].f || (CARTES[a].e ? 1 : 0) - (CARTES[b].e ? 1 : 0));
    let html = '';
    ordre.forEach((id) => {
      const modele = CARTES[id];
      if (!P.cartes.includes(id)) {
        const ile = RECOMPENSES.indexOf(id) + 1;
        html += `<button type="button" class="carte inconnue mini" data-id="${id}" aria-label="${attr(traduire('carteInconnue', { n: ile }))}"><span class="fond"></span><span class="dessin" style="top:24%;height:50%">${ICONES.cadenas}</span></button>`;
        return;
      }
      const dans = P.paquet.includes(id);
      html += htmlCarte(nouvelleCarte(modele, id), { bouton: true, sansPieces: true, idCarte: id, classe: 'mini ' + (dans ? 'dans' : 'hors'), coche: dans, suffixe: dans ? ' — ' + traduire('dansPaquet') : '' });
    });
    $('collection').innerHTML = html;
    const n = P.paquet.length;
    $('compte-paquet').textContent = traduire('paquetCompte', { n, max: TAILLE_PAQUET });
    $('compte-paquet').classList.toggle('ko', n !== TAILLE_PAQUET);
  }
  $('collection').addEventListener('click', (ev) => {
    const b = ev.target.closest('.carte');
    if (!b) return;
    const id = b.dataset.id;
    if (!P.cartes.includes(id)) { son('erreur'); toast(traduire('carteInconnue', { n: RECOMPENSES.indexOf(id) + 1 })); return; }
    const k = P.paquet.indexOf(id);
    if (k >= 0) { P.paquet.splice(k, 1); son('bouton'); }
    else if (P.paquet.length >= TAILLE_PAQUET) { son('erreur'); toast(traduire('paquetPlein')); return; }
    else { P.paquet.push(id); son('poser'); }
    dessinerCollection();
    const nb2 = $('collection').querySelector(`[data-id="${id}"]`);
    if (nb2) nb2.focus({ preventScroll: true });
    if (P.paquet.length === TAILLE_PAQUET) enregistrerReglages();
  });
  $('b-conseille').addEventListener('click', () => {
    P.paquet = paquetConseille(P.cartes);
    son('nouveau');
    dessinerCollection();
    enregistrerReglages();
  });
  function quitterPaquet() {
    if (P.paquet.length !== TAILLE_PAQUET) {
      P.paquet = paquetConseille(P.cartes);
      toast(traduire('paquetComplete'));
    }
    enregistrerReglages();
    if (retourPaquet === 'carte') allerCarte(); else allerTitre();
  }

  // ---------- Mon navire ----------
  function allerNavire() {
    son('bouton');
    dessinerNavire();
    montrer('navire');
  }
  function dessinerNavire() {
    majEtoilesAffichees();
    $('navire-vue').innerHTML = svgNavire(P.voile, P.chapeau);
    const total = totalEtoiles();
    const option = (type, o, dessin) => {
      const ferme = total < o.etoiles;
      const choisi = (type === 'chapeau' ? P.chapeau : P.voile) === o.id;
      const nom = traduire(type + '.' + o.id);
      const aria = ferme ? traduire('optionFermee', { nom, n: o.etoiles }) : nom + (choisi ? ' — ' + traduire('choisi') : '');
      return `<button type="button" class="option ${ferme ? 'ferme' : ''} ${choisi ? 'choisi' : ''}" data-type="${type}" data-id="${o.id}" aria-pressed="${choisi}" aria-label="${attr(aria)}">${dessin}<span>${attr(nom)}</span>${ferme ? `<span class="verrou">${svgEtoile(true)}${attr(traduire('nEtoiles', { n: o.etoiles }))}</span>` : ''}</button>`;
    };
    $('options-chapeaux').innerHTML = CHAPEAUX.map((c) => option('chapeau', c, svgChapeauSeul(c.id))).join('');
    $('options-voiles').innerHTML = VOILES.map((v) => option('voile', v, `<svg viewBox="40 18 120 82" aria-hidden="true">${svgVoile(v.id, 'M50 28 Q100 20 150 28 Q158 60 150 94 Q100 86 50 94 Q42 60 50 28 Z')}</svg>`)).join('');
  }
  $('ecran-navire').addEventListener('click', (ev) => {
    const b = ev.target.closest('.option');
    if (!b) return;
    const liste = b.dataset.type === 'chapeau' ? CHAPEAUX : VOILES;
    const o = liste.find((x) => x.id === b.dataset.id);
    if (totalEtoiles() < o.etoiles) { son('erreur'); toast(traduire('optionFermee', { nom: traduire(b.dataset.type + '.' + o.id), n: o.etoiles })); return; }
    if (b.dataset.type === 'chapeau') P.chapeau = o.id; else P.voile = o.id;
    son('nouveau');
    dessinerNavire();
    enregistrerReglages();
    const nouveau = document.querySelector(`.option[data-type="${b.dataset.type}"][data-id="${o.id}"]`);
    if (nouveau) nouveau.focus({ preventScroll: true });
  });

  // ==========================================================================
  // 7. Le duel
  // ==========================================================================

  let e = null;              // partie en cours
  let niv = 0;               // index du niveau
  let enPartie = false;
  let choixEnAttente = null; // fonction qui reçoit la carte choisie
  let tutoEnAttente = null;
  let selection = 0;         // carte choisie au clavier
  let carteCapPosee = null, carteJPosee = null, capCachee = false;
  let conseil = null;        // carte montrée par le doigt (1re île)

  function lancerNiveau(i) {
    oublierAttentes();
    ['f-pause', 'f-fin', 'f-tuto', 'f-ile'].forEach(fermerFenetre);
    pause = false;
    document.body.classList.remove('en-pause');
    niv = i;
    if (P.paquet.length !== TAILLE_PAQUET) P.paquet = paquetConseille(P.cartes);
    e = nouvellePartie(NIVEAUX[i], P.paquet);
    enPartie = true;
    carteCapPosee = carteJPosee = null; capCachee = false;
    selection = 0;
    montrer('duel');
    majDuelComplet();
    derouler(jeton);
  }

  function nomCap() { return traduire('cap.' + (niv + 1)); }

  function majDuelComplet() {
    const def = e.def;
    $('d-ile').textContent = traduire('barreIle', { n: niv + 1, max: NIVEAUX.length, nom: traduire('ile.' + (niv + 1)) });
    $('d-portrait').innerHTML = svgVisage(CAPITAINES[niv]);
    $('d-cap-nom').textContent = nomCap();
    $('d-nom-table').textContent = nomCap();
    let badges = '';
    if (def.ia === 1) badges += `<span class="badge">${ICONES.malin}${attr(traduire('meca.malin'))}</span>`;
    if (def.ia === 2) badges += `<span class="badge">${ICONES.carnet}${attr(traduire('meca.memoire'))}</span>`;
    $('d-badges').innerHTML = badges;
    $('d-avatar').innerHTML = svgMoussaillon(P.chapeau);
    $('d-vs').innerHTML = ICONES.vs;
    $('d-coffre').innerHTML = def.coffre ? `<div class="coffre-dessin" id="coffre-dessin">${svgCoffre()}</div><div class="suite" id="d-suite"></div>` : '';
    if (def.coffre) $('d-coffre').setAttribute('aria-label', traduire('coffreAria', { n: def.coffre }));
    majInfos();
    majOr(false);
    majMain();
    majTable();
  }

  function majInfos() {
    const def = e.def;
    const vent = $('d-vent');
    if (e.vent) {
      vent.classList.remove('cache');
      vent.innerHTML = `<span class="girouette" id="girouette">${ICONES.girouette}</span><span class="mini-coul carte c-${e.vent}" style="border-width:2px">${svgCouleur(e.vent)}</span><span class="vent-plus">${attr(traduire('plusVent', { n: BONUS_VENT }))}</span>`;
      vent.setAttribute('aria-label', traduire('ventAria', { couleur: nomCouleur(e.vent), n: BONUS_VENT }));
      vent.setAttribute('role', 'img');
    } else { vent.classList.add('cache'); vent.innerHTML = ''; }
    let piste = '';
    for (let m = 0; m < def.r; m++) {
      const r = e.resultats[m];
      const cls = r === undefined ? (m === e.manche ? 'courant' : '') : r === 1 ? 'gagne' : r === -1 ? 'perdu' : 'egal';
      let marque = '';
      if (def.tempetes.includes(m + 1)) marque = ICONES.nuage;
      else if (def.tresors.includes(m + 1)) marque = ICONES.tresorMarque;
      piste += `<span class="pas ${cls}">${marque ? `<span class="marque">${marque}</span>` : ''}</span>`;
    }
    $('d-piste').innerHTML = piste;
    $('d-piste').setAttribute('role', 'img');
    $('d-piste').setAttribute('aria-label', traduire('mancheAria', { n: Math.min(e.manche + 1, def.r), max: def.r }));
    const cag = $('d-cagnotte');
    if (e.cagnotte > 0) {
      cag.innerHTML = `<div class="cagnotte" role="img" aria-label="${attr(traduire('cagnotteAria', { n: e.cagnotte }))}">${svgPiece()}${svgPiece()}<span>${nb(e.cagnotte)}</span></div>`;
    } else cag.innerHTML = '';
    if (def.coffre && $('d-suite')) {
      let s = '';
      for (let k = 0; k < def.coffre; k++) s += `<span class="${k < e.suite.length ? 'plein' : ''}">${k < e.suite.length ? nb(e.suite[k]) : ''}</span>`;
      $('d-suite').innerHTML = s;
    }
    $('d-main-cap').innerHTML = e.mainC.map(() => '<span class="mini-dos"></span>').join('');
    $('d-main-cap').setAttribute('aria-label', traduire('mainCap', { n: e.mainC.length }));
    $('d-main-cap').setAttribute('role', 'img');
    $('d-pioche').textContent = traduire('piocheReste', { n: e.piocheJ.length });
  }

  function majOr(anime, qui) {
    $('d-or-c').innerHTML = svgPiece() + `<span>${nb(e.orC)}</span>`;
    $('d-or-j').innerHTML = svgPiece() + `<span>${nb(e.orJ)}</span>`;
    $('d-or-c').setAttribute('aria-label', traduire('orAria', { nom: nomCap(), n: e.orC }));
    $('d-or-j').setAttribute('aria-label', traduire('orAria', { nom: traduire('toi'), n: e.orJ }));
    if (anime) {
      const el = $(qui === 'j' ? 'd-or-j' : 'd-or-c');
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    }
  }

  function majMain(nouvelles) {
    const main = $('d-main');
    main.classList.toggle('attend', !!choixEnAttente);
    selection = Math.min(selection, Math.max(0, e.mainJ.length - 1));
    // La carte déjà posée sur la table quitte la main tout de suite.
    main.innerHTML = e.mainJ.filter((c) => c !== carteJPosee).map((c, k) => htmlCarte(c, { bouton: true, uid: true, vent: e.vent, classe: (k === selection && choixEnAttente ? 'choisie ' : '') + (nouvelles && nouvelles.includes(c.uid) ? 'arrive' : '') })).join('');
    if (conseil && choixEnAttente) {
      const b = main.querySelector(`[data-uid="${conseil.uid}"]`);
      if (b) {
        const d = document.createElement('span');
        d.className = 'doigt';
        d.innerHTML = ICONES.main;
        d.style.left = (b.offsetLeft + b.offsetWidth / 2 - 12) + 'px';
        d.style.top = (b.offsetTop - 30) + 'px';
        main.appendChild(d);
      }
    }
  }

  function majTable(classes) {
    classes = classes || {};
    $('slot-cap').innerHTML = carteCapPosee ? htmlCarte(carteCapPosee, { vent: e.vent, cachee: capCachee, brume: capCachee, classe: classes.cap || '' }) : '';
    $('slot-j').innerHTML = carteJPosee ? htmlCarte(carteJPosee, { vent: e.vent, classe: classes.j || '' }) : '';
    $('slot-cap').style.setProperty('--taille', 'var(--lt)');
    $('slot-j').style.setProperty('--taille', 'var(--lt)');
  }

  function message(texte) {
    const m = $('d-message');
    m.textContent = texte;
    m.classList.remove('flash'); void m.offsetWidth; m.classList.add('flash');
  }
  function secouer(el) { if (!el) return; el.classList.remove('secoue'); void el.offsetWidth; el.classList.add('secoue'); }
  function sauter(el) { if (!el) return; el.classList.remove('saute'); void el.offsetWidth; el.classList.add('saute'); }

  // Pièces qui volent de la table vers le compteur du gagnant.
  function envolerPieces(n, versJoueur) {
    const depart = $('d-table').getBoundingClientRect();
    const cible = $(versJoueur ? 'd-or-j' : 'd-or-c').getBoundingClientRect();
    for (let k = 0; k < Math.min(n, 8); k++) {
      const p = document.createElement('span');
      p.className = 'piece-vol';
      p.innerHTML = svgPiece();
      const x0 = depart.left + depart.width / 2 - 13 + (k - n / 2) * 10, y0 = depart.top + depart.height / 2 - 13;
      p.style.left = x0 + 'px'; p.style.top = y0 + 'px';
      document.body.appendChild(p);
      setTimeout(() => {
        p.style.transform = `translate(${cible.left + cible.width / 2 - 13 - x0}px, ${cible.top + cible.height / 2 - 13 - y0}px) scale(.7)`;
        p.style.opacity = '.4';
      }, 30 + k * 70);
      setTimeout(() => p.remove(), 900 + k * 70);
    }
  }

  function confettis(n) {
    const couleurs = ['#f5c542', '#e94b3c', '#3fae5a', '#3d8fd6', '#fff6e0', '#9b59b6'];
    for (let k = 0; k < n; k++) {
      const c = document.createElement('span');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = couleurs[k % couleurs.length];
      c.style.animationDelay = (Math.random() * 0.6) + 's';
      c.style.animationDuration = (1.8 + Math.random() * 1.2) + 's';
      c.style.borderRadius = k % 3 ? '2px' : '50%';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3800);
    }
  }

  // Attente d'un choix du joueur (toucher, clic ou clavier).
  function attendreChoix() {
    return new Promise((ok) => {
      const j = jeton;
      choixEnAttente = (carte) => { if (j === jeton) ok(carte); };
      majMain();
    });
  }
  function jouerCarte(uid) {
    if (!choixEnAttente || pause || !e) return;
    const carte = e.mainJ.find((c) => c.uid === uid);
    if (!carte) return;
    const f = choixEnAttente;
    choixEnAttente = null;
    conseil = null;
    f(carte);
  }
  $('d-main').addEventListener('click', (ev) => {
    const b = ev.target.closest('.carte');
    if (!b) return;
    if (!choixEnAttente) { secouer(b); return; }
    jouerCarte(Number(b.dataset.uid));
  });

  // Déroulé d'un duel, manche après manche.
  async function derouler(j) {
    const def = e.def;
    // Présentation de l'île et du capitaine.
    const bandeau = document.createElement('div');
    bandeau.className = 'bandeau';
    bandeau.innerHTML = `<div class="portrait">${svgVisage(CAPITAINES[niv], 'rit')}</div><div class="grand">${attr(traduire('ileTitre', { n: niv + 1, nom: traduire('ile.' + (niv + 1)) }))}</div><div>${attr(traduire('contre', { nom: nomCap() }))}</div><div style="margin-top:6px;font-size:14px">${attr(traduire('objectifs', { e2: def.e2, e3: def.e3 }))}</div>`;
    $('ecran-duel').appendChild(bandeau);
    message(traduire('contre', { nom: nomCap() }));
    await delai(2000);
    bandeau.remove();
    if (j !== jeton) return;
    // Tutoriels des nouveautés, à leur première apparition.
    for (const cle of def.neuf) {
      if (!P.vus[cle]) { await montrerTuto(cle); P.vus[cle] = true; if (j !== jeton) return; }
    }
    while (!finie(e)) {
      await jouerManche();
      if (j !== jeton) return;
    }
    finDuel();
  }

  async function jouerManche() {
    const def = e.def;
    const evts = debutManche(e);
    carteCapPosee = carteJPosee = null; capCachee = false;
    majInfos(); majTable(); majMain();
    if (evts.vent) {
      son('vent');
      message(traduire('msgVent', { couleur: nomCouleur(e.vent) }));
      const g = $('girouette'); if (g) g.classList.add('tourne');
      await delai(1300);
    }
    if (evts.tempete) {
      son('tempete');
      message(traduire('msgTempete'));
      $('ecran-duel').classList.remove('orage'); void $('ecran-duel').offsetWidth; $('ecran-duel').classList.add('orage');
      $('d-main').classList.add('melange');
      await delai(1300);
      $('d-main').classList.remove('melange');
      majMain();
    }
    if (def.tresors.includes(e.manche + 1)) { message(traduire('msgTresor', { n: VALEUR_TRESOR })); son('bourse'); await delai(1100); }
    else if (e.manche === def.r - 1) { message(traduire('msgDernier')); await delai(700); }

    let cJ, cC;
    const aideJoueur = niv === 0 && e.manche < 3;
    if (meneurCapitaine(e)) {
      message(traduire('msgReflechit', { nom: nomCap() }));
      await delai(800);
      cC = choisir(e, e.mainC, null, def.ia, cartesInconnuesJoueur(e));
      capCachee = brumeuse(e);
      carteCapPosee = cC; // la carte reste dans sa main jusqu'à la résolution
      majTable({ cap: 'pose-haut' });
      if ($('d-main-cap').lastChild) $('d-main-cap').lastChild.remove();
      son('poser');
      message(capCachee ? traduire('msgOuvreCapBrume', { nom: nomCap() }) : traduire('msgOuvreCap', { nom: nomCap() }));
      if (aideJoueur) conseil = choisir(e, e.mainJ, cC, 1);
      cJ = await attendreChoix();
      carteJPosee = cJ;
      majTable({ cap: '', j: 'pose' });
      son('poser');
      majMain();
      if (capCachee) {
        await delai(600);
        capCachee = false;
        son('retourner');
        majTable({ cap: 'retourne' });
      }
    } else {
      message(traduire('msgOuvreJ'));
      if (aideJoueur) conseil = choisir(e, e.mainJ, null, 1);
      cJ = await attendreChoix();
      carteJPosee = cJ;
      majTable({ j: 'pose' });
      son('poser');
      majMain();
      message(traduire('msgReflechit', { nom: nomCap() }));
      await delai(800);
      cC = choisir(e, e.mainC, cJ, def.ia, cartesInconnuesJoueur(e));
      carteCapPosee = cC;
      majTable({ cap: 'pose-haut' });
      son('poser');
    }
    await delai(650);

    // Résolution.
    const r = resoudre(e, cJ, cC);
    if (r.deuxTourbillons) { message(traduire('msgDeuxTourbillons')); son('egal'); await delai(1100); }
    else if (r.inverse) { message(traduire('msgTourbillon')); son('tourbillon'); await delai(1100); }
    majTable();
    $('slot-cap').classList.toggle('gagnant', r.res === -1);
    $('slot-cap').classList.toggle('perdant', r.res === 1);
    $('slot-j').classList.toggle('gagnant', r.res === 1);
    $('slot-j').classList.toggle('perdant', r.res === -1);
    if (r.res === 1) {
      son('piece');
      if (r.bourse) setTimeout(() => son('bourse'), 250);
      message(r.bourse ? traduire('msgGagneBourse', { n: r.gain }) : traduire('msgGagne', { n: r.gain }));
      envolerPieces(r.gain, true);
      $('d-portrait').innerHTML = svgVisage(CAPITAINES[niv], 'oh');
      secouer($('d-portrait'));
      sauter($('d-avatar'));
      $('d-avatar').innerHTML = svgMoussaillon(P.chapeau, 'rit');
    } else if (r.res === -1) {
      son('perdu');
      message(r.bourse ? traduire('msgPerdBourse', { nom: nomCap(), n: r.gain }) : traduire('msgPerd', { nom: nomCap(), n: r.gain }));
      envolerPieces(r.gain, false);
      $('d-portrait').innerHTML = svgVisage(CAPITAINES[niv], 'rit');
      sauter($('d-portrait'));
      secouer($('slot-j'));
    } else {
      son('egal');
      message(traduire('msgEgal'));
    }
    await delai(750);
    majOr(r.res !== 0, r.res === 1 ? 'j' : 'c');
    majInfos();
    if (r.coffre) {
      const cd = $('coffre-dessin');
      if (cd) cd.classList.add('ouvert');
      son('coffre');
      message(traduire('msgCoffre', { n: BONUS_COFFRE }));
      envolerPieces(BONUS_COFFRE, true);
      await delai(1200);
      majOr(true, 'j');
      if (cd) cd.classList.remove('ouvert');
    }
    await delai(700);
    $('d-portrait').innerHTML = svgVisage(CAPITAINES[niv]);
    $('d-avatar').innerHTML = svgMoussaillon(P.chapeau);
    ['slot-cap', 'slot-j'].forEach((id) => $(id).classList.remove('gagnant', 'perdant'));
    const nouvelles = piocher(e);
    carteCapPosee = carteJPosee = null;
    majTable();
    majInfos();
    majMain(nouvelles);
  }

  function finDuel() {
    enPartie = false;
    const def = e.def;
    const etoiles = etoilesPour(def, e.orJ, e.orC);
    const gagne = etoiles > 0;
    if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niv + 1 });
    const totalAvant = totalEtoiles();
    const ancienRecord = P.records[niv];
    const record = gagne && e.orJ > ancienRecord;
    let carteGagnee = null;
    if (gagne) {
      P.etoiles[niv] = Math.max(P.etoiles[niv], etoiles);
      if (record) P.records[niv] = e.orJ;
      if (gagnerCarte(RECOMPENSES[niv])) carteGagnee = RECOMPENSES[niv];
      P.niveauMax = Math.min(NIVEAUX.length, Math.max(P.niveauMax, niv + 2));
      try { JEL_SAVE.save(JEU, donneesSauvegarde(Math.min(NIVEAUX.length, niv + 2))); } catch (er) { /* sauvegarde indisponible */ }
      // Jeu terminé (tous les duels gagnés, maintenant ou avant) : total des meilleures étoiles.
      if (P.etoiles.every((x) => x > 0)) {
        if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
      }
    }
    const totalApres = totalEtoiles();
    const debloques = [];
    CHAPEAUX.forEach((c) => { if (c.etoiles > totalAvant && c.etoiles <= totalApres) debloques.push(traduire('debloqueChapeau', { nom: traduire('chapeau.' + c.id) })); });
    VOILES.forEach((v) => { if (v.etoiles > totalAvant && v.etoiles <= totalApres) debloques.push(traduire('debloqueVoile', { nom: traduire('voile.' + v.id) })); });

    const dernier = niv === NIVEAUX.length - 1;
    let titre = gagne ? traduire('victoire') : e.orJ === e.orC ? traduire('egaliteFin') : traduire('defaite');
    let html = `<div class="portrait portrait-fin">${svgVisage(CAPITAINES[niv], gagne ? 'oh' : 'rit')}</div><h2 id="t-fin">${attr(titre)}</h2>`;
    html += `<p>${attr(traduire('bilanOr', { j: e.orJ, nom: nomCap(), c: e.orC }))}</p>`;
    html += `<div class="etoiles-fin" id="etoiles-fin">${svgEtoile(false)}${svgEtoile(false)}${svgEtoile(false)}</div>`;
    if (gagne) html += `<p class="ligne-record">${attr(record ? traduire('nouveauRecord', { n: e.orJ }) : traduire('record', { n: P.records[niv] }))}</p>`;
    else html += `<p>${attr(traduire('conseilDefaite'))}</p>`;
    if (!gagne && ancienRecord) html += `<p>${attr(traduire('record', { n: ancienRecord }))}</p>`;
    if (carteGagnee) {
      html += `<div class="recompense">${htmlCarte(nouvelleCarte(CARTES[carteGagnee], carteGagnee), {})}<p>${attr(traduire('nouvelleCarte'))}</p></div>`;
    }
    debloques.forEach((t) => { html += `<p class="ligne-record">${attr(t)}</p>`; });
    if (gagne && dernier) html += `<p class="ligne-record">${attr(traduire('finVoyage'))}</p>`;
    html += '<div class="boutons">';
    if (gagne && !dernier) html += `<button class="bouton or" type="button" id="fin-suivant">${attr(traduire('niveauSuivant'))}</button>`;
    if (!gagne) html += `<button class="bouton or" type="button" id="fin-reessayer">${attr(traduire('reessayer'))}</button>`;
    if (gagne) html += `<button class="bouton" type="button" id="fin-rejouer">${attr(traduire('rejouer'))}</button>`;
    html += `<div class="rangee"><button class="bouton petit" type="button" id="fin-niveaux">${attr(traduire('niveaux'))}</button><button class="bouton petit" type="button" id="fin-paquet">${attr(traduire('monPaquet'))}</button></div>`;
    html += '</div>';
    $('fin-contenu').innerHTML = html;
    ouvrirFenetre('f-fin');
    const lier = (id, f) => { const b = $(id); if (b) b.addEventListener('click', () => { son('bouton'); f(); }); };
    lier('fin-suivant', () => lancerNiveau(niv + 1));
    lier('fin-reessayer', () => lancerNiveau(niv));
    lier('fin-rejouer', () => lancerNiveau(niv));
    lier('fin-niveaux', () => allerCarte());
    lier('fin-paquet', () => { fermerFenetre('f-fin'); allerPaquet('carte'); });
    const premier = $('fin-suivant') || $('fin-reessayer') || $('fin-rejouer');
    setTimeout(() => premier && premier.focus({ preventScroll: true }), 50);
    if (gagne) {
      son('victoire');
      confettis(60);
      const etoilesEl = $('etoiles-fin').querySelectorAll('svg');
      for (let k = 0; k < etoiles; k++) {
        setTimeout(() => {
          if (!etoilesEl[k]) return;
          etoilesEl[k].outerHTML = svgEtoile(true, 'allumee');
          son('etoile');
        }, 500 + k * 380);
      }
      if (carteGagnee) setTimeout(() => son('nouveau'), 600 + etoiles * 380);
    } else {
      son('defaite');
      secouer($('fin-contenu'));
    }
  }

  // ---------- Pause ----------
  function ouvrirPause() {
    if (ecranCourant !== 'duel' || pause || fenetreOuverte('f-fin')) return;
    pause = true;
    document.body.classList.add('en-pause');
    ouvrirFenetre('f-pause');
    setTimeout(() => $('p-reprendre').focus({ preventScroll: true }), 30);
  }
  function fermerPause() {
    if (!pause) return;
    pause = false;
    document.body.classList.remove('en-pause');
    fermerFenetre('f-pause');
    son('bouton');
  }
  $('b-pause').addEventListener('click', () => { son('bouton'); ouvrirPause(); });
  $('p-reprendre').addEventListener('click', fermerPause);
  $('p-recommencer').addEventListener('click', () => { son('bouton'); lancerNiveau(niv); });
  $('p-carte').addEventListener('click', () => { son('bouton'); allerCarte(); });
  $('p-accueil').addEventListener('click', () => { son('bouton'); allerTitre(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') ouvrirPause(); });

  // ---------- Tutoriels animés ----------
  function sceneTuto(cle) {
    const C = (c, f, e, x, y, extra, o) => `<div style="left:${x}px;top:${y}px;${extra || ''}" class="demo">${htmlCarte({ c, f, e: e || null }, Object.assign({ classe: '' }, o || {}))}</div>`;
    const doigt = (x, y, anim) => `<span class="doigt" style="left:${x}px;top:${y}px;animation:${anim}">${ICONES.main}</span>`;
    const piece = (x, y, anim) => `<span style="position:absolute;left:${x}px;top:${y}px;width:24px;height:24px;animation:${anim}">${svgPiece()}</span>`;
    switch (cle) {
      case 'base':
        return C('ancre', 3, null, 60, 8, '') +
          C('perroquet', 2, null, 30, 82, '') + C('canot', 5, null, 90, 82, 'animation:demoPose 3s ease-in-out infinite') + C('tresor', 1, null, 150, 82, '') +
          doigt(110, 108, 'demoDoigt 3s ease-in-out infinite') + piece(118, 20, 'demoPiece 3s ease-in-out infinite');
      case 'vent':
        return `<span style="position:absolute;left:20px;top:20px;width:60px;height:60px;animation:tourne 2.5s ease-in-out infinite">${ICONES.girouette}</span>` +
          `<span class="mini-coul carte c-canot" style="position:absolute;left:30px;top:90px;width:44px;height:44px;border-radius:10px">${svgCouleur('canot')}</span>` +
          C('canot', 4, null, 110, 24, 'animation:demoPulse 1.6s ease-in-out infinite', { vent: 'canot' }) + C('ancre', 5, null, 180, 24, '');
      case 'malin':
        return `<div style="position:absolute;left:20px;top:30px;width:80px;height:80px;border-radius:50%;overflow:hidden;border:3px solid #f5c542">${svgVisage(CAPITAINES[3], 'rit')}</div>` +
          C('ancre', 3, null, 130, 20, '') + C('canot', 4, null, 190, 20, 'animation:demoBrille 2.4s infinite');
      case 'tourbillon':
        return C('perroquet', 2, 'tourbillon', 60, 20, 'animation:demoBrille 2.4s infinite') + C('ancre', 6, null, 150, 20, '') +
          `<span style="position:absolute;left:115px;top:50px;width:30px;height:30px;animation:tourne 2s linear infinite">${EFFETS.tourbillon}</span>` + piece(70, 120, 'demoPulse 1.2s infinite');
      case 'coffre':
        return C('canot', 3, null, 14, 20, 'animation:demoSuite 3s infinite') + C('perroquet', 4, null, 70, 20, 'animation:demoSuite 3s .5s infinite backwards') + C('ancre', 5, null, 126, 20, 'animation:demoSuite 3s 1s infinite backwards') +
          `<div class="coffre-dessin" style="position:absolute;left:186px;top:40px;width:64px">${svgCoffre().replace('class="couvercle"', 'class="couvercle" style="animation:demoOuvre 3s infinite;transform-origin:6px 22px"')}</div>`;
      case 'tempete':
        return `<span style="position:absolute;left:100px;top:6px;width:60px;height:50px">${ICONES.nuage}</span><span style="position:absolute;inset:0;background:#fff;animation:demoEclair 2.5s infinite"></span>` +
          C('canot', 7, null, 40, 70, 'animation:demoEchange 2.5s infinite') + C('perroquet', 2, null, 100, 70, 'animation:demoEchange 2.5s .15s infinite') + C('ancre', 5, null, 160, 70, 'animation:demoEchange 2.5s .3s infinite');
      case 'memoire':
        return `<div style="position:absolute;left:20px;top:30px;width:80px;height:80px;border-radius:50%;overflow:hidden;border:3px solid #f5c542">${svgVisage(CAPITAINES[10])}</div>` +
          `<span style="position:absolute;left:200px;top:20px;width:50px;height:50px">${ICONES.carnet}</span>` +
          C('tresor', 8, null, 110, 70, 'animation:demoVole 2.4s infinite') + C('canot', 6, null, 150, 90, 'animation:demoVole 2.4s .8s infinite');
      case 'bourse':
        return C('tresor', 5, 'bourse', 60, 20, 'animation:demoBrille 2.4s infinite') + C('canot', 3, null, 150, 20, '') +
          piece(70, 110, 'demoPulse 1s infinite') + piece(100, 110, 'demoPulse 1s .2s infinite') + piece(130, 110, 'demoPulse 1s .4s infinite');
      case 'brouillard':
        return `<div style="position:absolute;left:60px;top:20px;animation:demoCache 3s infinite">${htmlCarte({ c: 'ancre', f: 6 }, { cachee: true, brume: true }).replace('class="carte', 'style="position:relative;width:50px;--taille:50px" class="carte')}</div>` +
          `<div style="position:absolute;left:60px;top:20px;animation:demoMontre 3s infinite">${htmlCarte({ c: 'ancre', f: 6 }, {}).replace('class="carte', 'style="position:relative;width:50px;--taille:50px" class="carte')}</div>` +
          C('perroquet', 7, null, 150, 20, 'animation:demoBrille 3s infinite');
      case 'tresor':
        return `<div style="position:absolute;left:30px;top:30px;display:flex;gap:8px">${[0, 1, 2, 3, 4].map((k) => `<span class="pas" style="${k === 2 ? 'border-color:#f5c542' : ''}">${k === 2 ? `<span class="marque">${ICONES.tresorMarque}</span>` : ''}</span>`).join('')}</div>` +
          piece(60, 80, 'demoPulse 1s infinite') + piece(100, 80, 'demoPulse 1s .2s infinite') + piece(140, 80, 'demoPulse 1s .4s infinite');
      default: return '';
    }
  }
  const ETAPES_TUTO = { base: 3, vent: 3, malin: 2, tourbillon: 3, coffre: 3, tempete: 3, memoire: 3, bourse: 3, brouillard: 3, tresor: 3 };
  function montrerTuto(cle) {
    return new Promise((ok) => {
      const j = jeton;
      let etapes = '';
      for (let k = 1; k <= ETAPES_TUTO[cle]; k++) etapes += `<li>${attr(traduire('tuto.' + cle + '.' + k))}</li>`;
      $('tuto-contenu').innerHTML = `<h2 id="t-tuto">${attr(traduire('tuto.' + cle + '.titre'))}</h2><div class="scene">${sceneTuto(cle)}</div><ol class="etapes">${etapes}</ol>` +
        `<div class="boutons"><button class="bouton or" type="button" id="tuto-ok">${attr(traduire('compris'))}</button></div><p class="passer">${attr(traduire('toucherPourPasser'))}</p>`;
      $('tuto-contenu').querySelectorAll('.demo').forEach((d) => { d.style.position = 'absolute'; d.style.width = '50px'; });
      ouvrirFenetre('f-tuto');
      tutoEnAttente = () => { fermerFenetre('f-tuto'); tutoEnAttente = null; if (j === jeton) ok(); };
      setTimeout(() => { const b = $('tuto-ok'); if (b) b.focus({ preventScroll: true }); }, 30);
    });
  }
  $('f-tuto').addEventListener('click', () => { if (tutoEnAttente) { son('bouton'); tutoEnAttente(); } });

  // Bouton « Revoir les règles » : les tutoriels de cette île, en pause.
  let aideOuverte = false;
  $('b-aide').addEventListener('click', async () => {
    if (aideOuverte || pause || !e || ecranCourant !== 'duel') return;
    son('bouton');
    aideOuverte = true;
    pause = true;
    const liste = mecaniques(e.def).map((m) => (m === 'ventTourne' ? 'vent' : m));
    const j = jeton;
    const ancienTuto = tutoEnAttente;
    for (const cle of liste) {
      await new Promise((ok) => {
        let etapes = '';
        for (let k = 1; k <= ETAPES_TUTO[cle]; k++) etapes += `<li>${attr(traduire('tuto.' + cle + '.' + k))}</li>`;
        $('tuto-contenu').innerHTML = `<h2 id="t-tuto">${attr(traduire('tuto.' + cle + '.titre'))}</h2><div class="scene">${sceneTuto(cle)}</div><ol class="etapes">${etapes}</ol><div class="boutons"><button class="bouton or" type="button" id="tuto-ok">${attr(traduire('compris'))}</button></div><p class="passer">${attr(traduire('toucherPourPasser'))}</p>`;
        $('tuto-contenu').querySelectorAll('.demo').forEach((d) => { d.style.position = 'absolute'; d.style.width = '50px'; });
        ouvrirFenetre('f-tuto');
        tutoEnAttente = () => { fermerFenetre('f-tuto'); ok(); };
        setTimeout(() => { const b = $('tuto-ok'); if (b) b.focus({ preventScroll: true }); }, 30);
      });
      if (j !== jeton) break;
    }
    tutoEnAttente = ancienTuto;
    aideOuverte = false;
    if (j === jeton) pause = false;
  });

  // ==========================================================================
  // 8. Clavier
  // ==========================================================================

  document.addEventListener('keydown', (ev) => {
    const k = ev.key;
    if (fenetreOuverte('f-tuto') && tutoEnAttente && (k === 'Enter' || k === ' ' || k === 'Escape')) {
      ev.preventDefault(); son('bouton'); tutoEnAttente(); return;
    }
    if (ecranCourant === 'duel') {
      if (k === 'Escape' || k === 'p' || k === 'P') {
        ev.preventDefault();
        if (fenetreOuverte('f-fin')) return;
        if (pause && fenetreOuverte('f-pause')) fermerPause(); else ouvrirPause();
        return;
      }
      if (pause || fenetreOuverte('f-fin') || !e) return;
      if (k === 'ArrowLeft' || k === 'ArrowRight') {
        ev.preventDefault();
        if (!e.mainJ.length) return;
        selection = (selection + (k === 'ArrowRight' ? 1 : e.mainJ.length - 1)) % e.mainJ.length;
        majMain();
        son('bouton');
        return;
      }
      if ((k === 'Enter' || k === ' ') && choixEnAttente && document.activeElement && !document.activeElement.closest('.barre')) {
        ev.preventDefault();
        const c = e.mainJ[selection];
        if (c) jouerCarte(c.uid);
        return;
      }
      if (/^[1-4]$/.test(k) && choixEnAttente) {
        const c = e.mainJ[Number(k) - 1];
        if (c) { ev.preventDefault(); jouerCarte(c.uid); }
      }
      return;
    }
    if (ecranCourant === 'carte' && !fenetreOuverte('f-ile')) {
      const dirs = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 4, ArrowUp: -4 };
      if (dirs[k] !== undefined) {
        ev.preventDefault();
        ileChoisie = Math.max(0, Math.min(NIVEAUX.length - 1, ileChoisie + dirs[k]));
        const b = document.querySelector(`.ile[data-i="${ileChoisie}"]`);
        if (b) b.focus();
      }
      if (k === 'Escape') allerTitre();
      return;
    }
    if (ecranCourant === 'carte' && fenetreOuverte('f-ile') && k === 'Escape') { fermerFenetre('f-ile'); return; }
    if ((ecranCourant === 'paquet') && k === 'Escape') { quitterPaquet(); return; }
    if ((ecranCourant === 'navire') && k === 'Escape') { allerTitre(); }
  });

  // ==========================================================================
  // 9. Boutons et démarrage
  // ==========================================================================

  $('b-jouer').addEventListener('click', lancerDepuisTitre);
  $('b-carte').addEventListener('click', () => { son('bouton'); allerCarte(); });
  $('b-paquet').addEventListener('click', () => allerPaquet('titre'));
  $('b-navire').addEventListener('click', allerNavire);
  document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', basculerSon));
  document.querySelectorAll('#ecran-carte .b-retour').forEach((b) => { b.innerHTML = ICONES.maison; b.addEventListener('click', () => { son('bouton'); allerTitre(); }); });
  document.querySelectorAll('#ecran-paquet .b-retour').forEach((b) => { if (b.classList.contains('rond')) b.innerHTML = ICONES.retour; b.addEventListener('click', () => { son('bouton'); quitterPaquet(); }); });
  document.querySelectorAll('#ecran-navire .b-retour').forEach((b) => { b.innerHTML = ICONES.retour; b.addEventListener('click', () => { son('bouton'); allerTitre(); }); });
  $('b-pause').innerHTML = ICONES.pause;
  $('b-aide').innerHTML = ICONES.aide;

  // Sauvegarde à la fermeture de la page, seulement pendant un duel.
  JEL_SAVE.surFermeture(() => {
    if (enPartie && e) JEL_SAVE.save(JEU, donneesSauvegarde(niv + 1));
  });

  majBoutonsSon();
  allerTitre();
})();
</script>
</body>
</html>
