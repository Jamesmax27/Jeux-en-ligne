  // ---------- Ciel : trois couches d'étoiles « pixel » (1 024², cuites une fois) ----------
  function cuireEtoiles(graine, nombre, taille, couleurs) {
    const cv = creerCanvas(1024, 1024), ctx = cv.getContext('2d'), al = alea32(graine);
    for (let k = 0; k < nombre; k++) {
      const x = Math.floor(al() * 1024), y = Math.floor(al() * 1024), s = taille + (al() < 0.2 ? 1 : 0);
      ctx.fillStyle = rgba(couleurs[Math.floor(al() * couleurs.length)], 0.35 + al() * 0.65);

      if (s >= 3 && al() < 0.5) { ctx.fillRect(x - 1, y + 1, 1, 1); ctx.fillRect(x + s, y + 1, 1, 1); }
    }
    return cv;
  }

  // ---------- Sprites précuits (jamais de dégradé ni de shadowBlur par image) ----------
  // Planche d'une flotte : le vaisseau et sa traînée cuits dans ROTATIONS directions (une seule copie axée par flotte à l'image :
  // un drawImage tourné coûte quatre fois plus cher qu'un drawImage droit sur un processeur de téléphone).
  const ROTATIONS = 24, CELLULE_SPRITE = 96;
  function spriteFlotte(couleur, couleur2, glyphe) {
    const C = CELLULE_SPRITE, cv = creerCanvas(C * ROTATIONS, C), ctx = cv.getContext('2d');
    for (let k = 0; k < ROTATIONS; k++) {
      ctx.setTransform(1, 0, 0, 1, k * C + C / 2, C / 2);
      ctx.rotate(k * TAU / ROTATIONS);
      // Traînée : deux lueurs derrière la coque, puis halo de la coque (dégradés cuits ici, jamais par image).
      for (const [d, r, a] of [[-26, 10, 0.18], [-16, 13, 0.3]]) {
        const g = ctx.createRadialGradient(d, 0, 0, d, 0, r);
        g.addColorStop(0, rgba(couleur, a)); g.addColorStop(1, rgba(couleur, 0));
        ctx.fillStyle = g; ctx.fillRect(d - r, -r, 2 * r, 2 * r);
      }

      halo.addColorStop(0, rgba(couleur, 0.55)); halo.addColorStop(0.6, rgba(couleur, 0.12)); halo.addColorStop(1, rgba(couleur, 0));
      ctx.fillStyle = halo; ctx.fillRect(-26, -26, 52, 52);

      ctx.beginPath(); ctx.moveTo(17, 0); ctx.quadraticCurveTo(4, -13, -10, -9); ctx.quadraticCurveTo(-15, 0, -10, 9); ctx.quadraticCurveTo(4, 13, 17, 0); ctx.closePath();

    ctx.setTransform(1, 0, 0, 1, 0, 0);

  }
  // Lueur douce (traînée, renfort, éclat) : disque dégradé d'une couleur.
  function spriteLueur(couleur, S = 48) {
    const cv = creerCanvas(S, S), ctx = cv.getContext('2d'), c = S / 2;
    const gr = ctx.createRadialGradient(c, c, 0, c, c, c);
    gr.addColorStop(0, rgba(couleur, 0.9)); gr.addColorStop(0.35, rgba(couleur, 0.45)); gr.addColorStop(1, rgba(couleur, 0));
    ctx.fillStyle = gr; ctx.fillRect(0, 0, S, S);

  }

    const S = 256, cv = creerCanvas(S, S), ctx = cv.getContext('2d'), c = S / 2;
    const gr = ctx.createRadialGradient(c, c, 10, c, c, c);

  }
  // Horizon courbe de la planète sous la carte : disque de rayon 500 dans 1 024², trois traits d'atmosphère ; une seule
  // copie mise à l'échelle par image (aucun dégradé, aucun arc tracé par image).
  function spriteHorizon() {
    const S = 1024, cv = creerCanvas(S, S), ctx = cv.getContext('2d'), c = S / 2, r = 500;
    ctx.fillStyle = rgba(PAL.surface, 0.95); ctx.beginPath(); ctx.arc(c, c, r, 0, TAU); ctx.fill();
    for (const [ep, al] of [[0.16, 0.06], [0.06, 0.16], [0.02, 0.4]]) { ctx.lineWidth = r * ep; ctx.strokeStyle = rgba(PAL.lilas, al); ctx.beginPath(); ctx.arc(c, c, r - r * ep / 2, 0, TAU); ctx.stroke(); }
    return cv;
  }
  function spritePlanete(couleur, couleurOmbre, S = 72) {
    const cv = creerCanvas(S, S), ctx = cv.getContext('2d'), c = S / 2, r = S * 0.36;
    const gr = ctx.createRadialGradient(c - r * 0.5, c - r * 0.5, r * 0.1, c, c, r);
    gr.addColorStop(0, couleur); gr.addColorStop(0.7, couleurOmbre); gr.addColorStop(1, melange(couleurOmbre, PAL.nuit, 0.7));

  // ---------- Atlas de chiffres (le seul texte du canvas) ----------
  const CARACTERES = '0123456789 .,-%   ';
  function creerAtlas(taillePx, couleur) {
    const lw = Math.max(2, taillePx * 0.16), marge = Math.ceil(lw) + 2;
    const cv = creerCanvas(CARACTERES.length * (taillePx + 2 * marge + 2), taillePx * 1.5 + 2 * marge), ctx = cv.getContext('2d');
    ctx.font = police(taillePx); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = rgba(PAL.nuit, 0.85);
    const pos = [], larg = [], h = cv.height;
    let x = 0;
    for (let k = 0; k < CARACTERES.length; k++) {
      const ch = CARACTERES[k], w = Math.ceil(ctx.measureText(ch).width);
      ctx.strokeText(ch, x + marge, h / 2); ctx.fillStyle = couleur; ctx.fillText(ch, x + marge, h / 2);
      pos.push(x); larg.push(w); x += w + 2 * marge;

  // ====================================================================================

    })();

    let dpr = 1, W = 1, H = 1, Wc = 1, Hc = 1;           // taille en pixels de l'appareil (W, H) et en pixels CSS (Wc, Hc)
    const camera = { x: 2048, y: 2048, z: 0.2 };          // centre en unités, zoom en pixels CSS par unité

    const neutre = { couleur: PAL.ardoise, couleur2: PAL.ardoiseFond, glyphe: 0, fond: PAL.ardoiseFond, lisiere: PAL.ardoise, lisiereClaire: melange(PAL.ardoise, PAL.craie, 0.35), sprite: null, lueur: null, trainee: null };

    const motifs = new Map();                              // hachures : clé `${couleur}|${glyphe}|${T}` → CanvasPattern

    // --- Scènes : 'carte', 'dezoom', 'horizon', 'fige' ---

    // --- Mesures ---
    const mesures = { msImage: 0, msImageMax: 0, sprites: 0, particules: 0, recuissons: 0 };
    let maxFenetre = 0, maxCompte = 0;

    const rendu = { camera, mesures, mouvementsReduits: false, marges: { haut: 0, bas: 0, gauche: 0, droite: 0 } };

      return factionsCamp[camp];
    }
    function preparerFaction(fa, camp) {
      const f = (donnees && donnees.factions && donnees.factions[fa]) || { couleur: ['#5ad7c8', '#c9693a', '#d8c08a', '#e2a23a', '#9be34a', '#9b6be0'][camp % 6], couleur2: null, glyphe: (camp % 12) + 1 };
      const couleur = f.couleur || PAL.lilas, couleur2 = f.couleur2 || melange(couleur, PAL.nuit, 0.6);

        fond: melange(couleur2, PAL.surface, 0.35), lisiere: couleur, lisiereClaire: melange(couleur, PAL.craie, 0.45),
        sprite: spriteFlotte(couleur, couleur2, f.glyphe || 1), lueur: spriteLueur(couleur) };
    }
    function preparerCamps(etat) {

      for (let c = 0; c < nnCamps; c++) factionsCamp.push(preparerFaction(etat.c[c].fa, c));
    }
    const estEnnemi = (etat, c) => (etat.eq && etat.eq.length ? etat.eq[c] !== etat.eq[0] : c !== 0);

    // ---------- Caméra ----------
    function calculerZooms() {
      if (!geo) return;

      zoomMax = Math.max(zoomMin * 3, 220 / Math.max(1, geo.cellule));
    }
    // Cadre toute la carte dans la zone libre de l'écran : rendu.marges = { haut, bas, gauche, droite } en pixels CSS
    // (bandeau et boutons du HUD, panneau du tutoriel) ; pe-jeu les pose avant d'appeler cadrer(). Sans marges : tout l'écran.
    function cadrer(marges) {

      const libreW = Math.max(44, Wc - gauche - droite), libreH = Math.max(44, Hc - haut - bas);

      const p = versCarte(px, py);

        if (d < dmin) { dmin = d; meilleur = i; }

      if (meilleur < 0) return -1;
      if (dansCellule(geo, meilleur, p.x, p.y)) return meilleur;
      return Math.sqrt(dmin) * camera.z <= LIM.choixPx ? meilleur : -1;

      refSiege.clear(); selectionI = -1; flecheCour = null; scene = 'carte'; anim = null; carteCuite = null; tAttache = -1; eclaireurI = -1;

    // Dessine la cellule i (en unités : le contexte porte déjà l'échelle zp). lod 0 : tout ; 1 : polygone + lisière ; 2 : disque.
    function dessinerCellule(c, i, lod, zp, proprio, bati, capitale, avecMotif) {

      const [x0, y0, x1, y1] = geo.bbox;
      const wDep = (x1 - x0) * zDep, hDep = (y1 - y0) * zDep;
      const pxDep = (x0 - dep.x) * zDep + W / 2, pyDep = (y0 - dep.y) * zDep + H / 2;
      const echelleFin = Math.max(0.03, (noeud.taille ? noeud.taille * 2.4 : rayon * 0.08) / Math.max(wDep, hDep));
      const s = anim.reduit ? 1 : 1 + (echelleFin - 1) * e;
      const w = wDep * s, h = hDep * s;
      const cxDep = pxDep + wDep / 2, cyDep = pyDep + hDep / 2;
      const px = cxDep + (noeud.px - cxDep) * e, py = cyDep + (noeud.py - cyDep) * e;
      ctx.globalAlpha = anim.reduit ? 1 - e : 1;
      ctx.drawImage(img, px - w / 2, py - h / 2, w, h);
      // Anneau du médaillon quand la carte est presque réduite.
      if (e > 0.85 && !anim.reduit) { ctx.globalAlpha = (e - 0.85) / 0.15; ctx.strokeStyle = factionDe(0).lisiereClaire; ctx.lineWidth = Math.max(1.5, dpr * 2); ctx.beginPath(); ctx.arc(px, py, Math.max(w, h) / 2 + 3 * dpr, 0, TAU); ctx.stroke(); }
      ctx.globalAlpha = 1;
      if (t >= 1 && !anim.fini) {
        anim.fini = true;
        const onFin = anim.onFin;
        if (horizonAR) { scene = 'carte'; anim = null; carteCuite = null; cuisson = null; }
        else scene = 'fige';
        if (onFin) onFin();
      }
    }

    // ---------- Une image ----------
    function dessiner(tMs) {
      const debut = performance.now();
      if (Wc <= 1 || canvas.width !== W) redimensionner();
      textesImage = 0; mesures.sprites = 0;
      let consommes = [];
      if (partie && partie.etat && !geo && partie.etat.m) attacher(partie);
      const etat = partie && partie.etat;
      if (etat && partie.prendreEv) { consommes = partie.prendreEv() || []; }
      if (!etat || !geo) {
        dessinerCiel(tMs, null); dessinerCargo(tMs);
      } else if (scene === 'dezoom' || scene === 'horizon') {
        if (consommes.length) traiterEvenements(etat, consommes);
        dessinerAnim(tMs);
      } else if (scene === 'fige') {
        // Image finale du dézoom, figée (le jeu enchaîne par attacher() ou cadrer()).
        anim.t0 = -1e9; dessinerAnim(tMs);
      } else {
        const prof = rendu.profil, tp = prof ? [performance.now()] : null;
        const etape = () => { if (tp) tp.push(performance.now()); };
        majInterpolation(etat);
        if (consommes.length) traiterEvenements(etat, consommes);
        majMenaces(etat);
        dessinerCiel(tMs, null); etape();
        dessinerDecor(tMs); etape();
        entretenirCuisson(etat, tMs); etape();
        const z = camera.z * dpr, k = z / cuisson.zp;
        ctx.drawImage(cuisson.cv, 0, 0, cuisson.w, cuisson.h, (cuisson.ox - camera.x) * z + W / 2, (cuisson.oy - camera.y) * z + H / 2, cuisson.w * k, cuisson.h * k); etape();
        dessinerLisieres(etat, tMs);
        dessinerCibles(etat, tMs);
        dessinerSieges(etat, tMs);
        dessinerEffets(etat, tMs); etape();
        dessinerFlottes(etat, partie.alpha ? partie.alpha() : 1, tMs); etape();
        dessinerNombres(etat); etape();
        avancerParticules(Math.min(50, tMs - (rendu._tPrec || tMs)));
        dessinerFleche();
        dessinerCargo(tMs); dessinerEclaireur(etat, tMs); etape();
        if (tp) {   // profil par phase (sommes, à diviser par prof.images), seulement quand rendu.profil est posé par le harnais
          const noms = ['ciel', 'decor', 'cuisson', 'statique', 'effets', 'flottes', 'nombres', 'reste'];
          for (let i = 0; i < noms.length; i++) prof[noms[i]] = (prof[noms[i]] || 0) + (tp[i + 1] - tp[i]);
          prof.images = (prof.images || 0) + 1;
        }
      }
      rendu._tPrec = tMs;
      // Mesures et réduction automatique des particules.
      const ms = performance.now() - debut;
      mesures.msImage = mesures.msImage ? mesures.msImage * 0.9 + ms * 0.1 : ms;
      maxFenetre = Math.max(maxFenetre, ms);
      if (++maxCompte >= 120) { mesures.msImageMax = maxFenetre; maxFenetre = 0; maxCompte = 0; }
      if (ms > LIM.imageLente) { if (++imagesLentes >= 2) { plafondParticules = Math.max(100, plafondParticules - 100); imagesLentes = 0; } } else imagesLentes = 0;
      if (tMs - tCompte >= 1000) { recuissonsSeconde = recuissonsCompte; recuissonsCompte = 0; tCompte = tMs; }
      mesures.recuissons = recuissonsSeconde;
      return consommes;
    }

    // ---------- Interface ----------
    function selection(i) {
      selectionI = typeof i === 'number' ? i : -1;
      voisinsSel = []; ciblesSel = [];
      if (selectionI < 0 || !geo || !partie || !partie.etat) return;
      const etat = partie.etat;
      voisinsSel = (geo.vois[selectionI] || []).slice();
      const t = etat.c && etat.c[0] ? etat.c[0].t : 0;
      if ((t & bitTransfert) && sim && sim.chemin && etat.p[selectionI] === 0) {
        for (let j = 0; j < geo.n; j++) {
          if (j === selectionI || voisinsSel.indexOf(j) >= 0) continue;
          let ch = null;
          try { ch = sim.chemin(etat, 0, selectionI, j); } catch (e) { ch = null; }
          if (ch) ciblesSel.push(j);
        }
      }
    }
    function fleche(f) { flecheCour = f && typeof f.de === 'number' ? f : null; }
    function fantome(de, vers, n) {
      if (!geo || de < 0 || vers < 0) return;
      let L = 10;
      if (sim && sim.duree && partie && partie.etat) { try { L = sim.duree(partie.etat, de, vers) || 10; } catch (e) { L = 10; } }
      fantomes.push({ d: de, v: vers, n, L, t0: -1 });
    }
    function effet(nom, i) {
      if (!geo || i < 0) return;
      const f = factionDe(partie && partie.etat ? partie.etat.p[i] : 0);
      if (nom === 'prise') { eclat(i, f.lisiereClaire, 24); ajouterEffet('prise', i, f.lisiere, 700); }
      else if (nom === 'perte') ajouterEffet('perte', i, PAL.rouge, 600);
      else if (nom === 'bati') ajouterEffet('bati', i, PAL.lilas, 700);
      else ajouterEffet('capacite', i, PAL.or, 900);
    }
    function menace() {
      const out = [];
      if (!geo) return out;
      for (let i = 0; i < geo.n; i++) {
        if (menaces[i] <= 0) continue;
        const e = versEcran(geo.x[i], geo.y[i]);
        const R = geo.R * camera.z;
        if (e.px < -R || e.py < -R || e.px > Wc + R || e.py > Hc + R) out.push({ i, px: e.px, py: e.py });
      }
      return out;
    }
    function detruire() {
      partie = null; geo = null; cuisson = null; carteCuite = null; effets = []; particules = []; fantomes = [];
      atlas.clear(); motifs.clear(); cielCache = null; factionsCamp = [];
    }

    Object.assign(rendu, { attacher, redimensionner, dessiner, cadrer, panoramique, zoomer, versCarte, versEcran, territoireA,
      selection, fleche, fantome, effet, menace, horizon, dezoom, medaillon, silhouettePosition, detruire,
      passer: () => { if (anim && !anim.fini) anim.t0 = -1e9; } });
    redimensionner();
    return rendu;
  }

  window.PE_RENDU = { creer, VERSION: 2, PALETTE: PAL };
})();
</script>
<script id="pe-son">
/* ==========================================================================
   Poussière d'Empire — pe-son : sons courts synthétisés (Web Audio seul)

   const son = window.PE_SON.creer();
   son.init()            à appeler depuis un gestionnaire d'évènement (premier geste) :
                         crée l'AudioContext ; jamais de son avant.
   son.jouer(nom)        'depart' | 'arrivee' | 'prise' | 'perte' | 'siege' | 'capacite' |
                         'etoile' | 'clic' | 'victoire' | 'defaite' | 'annonce' | 'horizon'
   son.muet(bool) / son.estMuet()   le choix est mémorisé par le jeu (options.son)

   Chaque son est une petite partition : oscillateurs à enveloppe, un filtre
   doux, pas de fichier audio. Les sons fréquents (départ, arrivée, siège)
   sont limités à une poignée par 100 ms pour ne pas saturer.
   ========================================================================== */
(function () {
  'use strict';

  function creer() {
    let ctx = null;        // AudioContext, créé au premier geste
    let maitre = null;     // gain général
    let filtre = null;     // adoucit les aigus
    let coupe = false;     // son coupé ?
    const dernier = {};    // nom → dernier instant joué (anti-rafale)
    const LIMITE_MS = { depart: 70, arrivee: 90, siege: 160, prise: 60, perte: 120 };

    function init() {
      if (ctx) { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); return; }
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        ctx = new Ctx();
        maitre = ctx.createGain();
        maitre.gain.value = coupe ? 0 : 0.5;
        filtre = ctx.createBiquadFilter();
        filtre.type = 'lowpass';
        filtre.frequency.value = 5200;
        filtre.connect(maitre);
        maitre.connect(ctx.destination);
      } catch (e) { ctx = null; }
    }

    // Une note : oscillateur de type `type`, fréquence f0 (glissant vers f1), enveloppe en secondes.
    function note(type, f0, f1, debut, attaque, tenue, chute, gain) {
      if (!ctx) return;
      const t0 = ctx.currentTime + debut;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t0);
      if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + attaque + tenue + chute);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + attaque);
      g.gain.setValueAtTime(gain, t0 + attaque + tenue);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + attaque + tenue + chute);
      o.connect(g);
      g.connect(filtre);
      o.start(t0);
      o.stop(t0 + attaque + tenue + chute + 0.02);
    }

    // Souffle court (bruit filtré) pour les départs et les sièges.
    function souffle(debut, duree, gain, freq) {
      if (!ctx) return;
      const n = Math.floor(ctx.sampleRate * duree);
      const tampon = ctx.createBuffer(1, n, ctx.sampleRate);
      const d = tampon.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = ctx.createBufferSource();
      src.buffer = tampon;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = freq;
      bp.Q.value = 1.2;
      const g = ctx.createGain();
      const t0 = ctx.currentTime + debut;
      g.gain.setValueAtTime(gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
      src.connect(bp); bp.connect(g); g.connect(filtre);
      src.start(t0);
    }

    const PARTITIONS = {
      clic: () => { note('triangle', 880, 660, 0, 0.005, 0.02, 0.06, 0.18); },
      depart: () => { souffle(0, 0.16, 0.16, 1400); note('sine', 520, 780, 0, 0.01, 0.03, 0.10, 0.12); },
      arrivee: () => { note('triangle', 660, 660, 0, 0.005, 0.03, 0.08, 0.14); },
      siege: () => { souffle(0, 0.12, 0.08, 600); note('square', 180, 160, 0, 0.005, 0.04, 0.08, 0.05); },
      prise: () => {   // carillon : trois notes montantes
        note('sine', 659, 659, 0, 0.005, 0.05, 0.18, 0.20);
        note('sine', 880, 880, 0.07, 0.005, 0.05, 0.20, 0.18);
        note('sine', 1318, 1318, 0.14, 0.005, 0.06, 0.28, 0.15);
      },
      perte: () => {   // note grave qui descend
        note('triangle', 220, 150, 0, 0.01, 0.10, 0.30, 0.22);
        note('sine', 110, 90, 0, 0.01, 0.10, 0.30, 0.12);
      },
      capacite: () => {   // accord lumineux
        note('sine', 523, 523, 0, 0.01, 0.12, 0.30, 0.16);
        note('sine', 659, 659, 0.02, 0.01, 0.12, 0.30, 0.14);
        note('sine', 784, 784, 0.04, 0.01, 0.14, 0.35, 0.14);
        note('triangle', 1046, 1046, 0.10, 0.01, 0.10, 0.40, 0.10);
      },
      etoile: () => { note('sine', 1046, 1568, 0, 0.005, 0.04, 0.22, 0.18); },
      victoire: () => {   // petite fanfare douce
        [523, 659, 784, 1046].forEach((f, i) => note('triangle', f, f, i * 0.11, 0.01, 0.10, 0.25, 0.16));
        note('sine', 1318, 1318, 0.46, 0.01, 0.20, 0.50, 0.14);
      },
      defaite: () => {
        [392, 349, 311].forEach((f, i) => note('triangle', f, f * 0.98, i * 0.16, 0.01, 0.12, 0.30, 0.16));
        note('sine', 98, 90, 0.3, 0.02, 0.2, 0.5, 0.12);
      },
      annonce: () => {   // onde d'alerte : deux pulsations
        note('square', 330, 330, 0, 0.01, 0.06, 0.12, 0.08);
        note('square', 330, 330, 0.18, 0.01, 0.06, 0.12, 0.08);
      },
      horizon: () => {   // glissando vers le lointain
        note('sine', 440, 110, 0, 0.02, 0.6, 0.6, 0.14);
        note('triangle', 660, 220, 0.05, 0.02, 0.5, 0.6, 0.06);
      },
    };

    function jouer(nom) {
      if (!ctx || coupe) return;
      const partition = PARTITIONS[nom];
      if (!partition) return;
      const limite = LIMITE_MS[nom];
      if (limite) {
        const maintenant = performance.now();
        if (dernier[nom] && maintenant - dernier[nom] < limite) return;
        dernier[nom] = maintenant;
      }
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      try { partition(); } catch (e) { /* contexte fermé : silence */ }
    }

    function muet(valeur) {
      coupe = !!valeur;
      if (maitre) maitre.gain.value = coupe ? 0 : 0.5;
    }

    return { init, jouer, muet, estMuet: () => coupe };
  }

  window.PE_SON = { creer };
})();
</script>
<script id="pe-jeu">
/* ==========================================================================
   Poussière d'Empire — pe-jeu : écrans, HUD, commandes, campagne, sauvegarde, profil

   Contrat : CONTRAT-LOT1.md, section 8. Cadrage : docs/cadrage-poussiere-d-empire.md,
   sections 3, 5, 6, 7, 9, 10, 11 et 13.

   Ce bloc ne touche jamais à l'état de la simulation : il passe par
   partie.ordonner(ordre) et lit partie.etat, partie.k(), partie.resultat.
   Les blocs se parlent par window.* : PE_DONNEES, JEL_SIM, PE_PILOTE, PE_RENDU, PE_SON,
   et les modules communs JEL_I18N et JEL_SAVE.

   Fonctions pures (sauvegarde, campagne, part de l'univers) exposées dans
   window.PE_JEU.pur pour les tests en Node : le reste ne s'exécute qu'avec un document.
   ========================================================================== */
(function () {
  'use strict';

  const JEU = 'poussiere-d-empire';
  const VERSION = 1;
  const NB_MISSIONS = 8;     // missions publiées au lot 1 (acte 1)
  const NB_TOTAL = 33;       // missions de la campagne entière
  const NB_ACTES = 5;
  const TAILLE_ACTES = [8, 7, 7, 6, 5];            // missions par acte
  // Tailles maximales des cinq échelles (cadrage, section 5) : la « part de l'univers connu »
  // compte les régions du joueur sur le produit de ces tailles.
  const TAILLES_ECHELLES = [40, 24, 80, 120, 120];
  const PRODUIT_UNIVERS = TAILLES_ECHELLES.reduce((a, b) => a * b, 1);
  const SAUVE_TOUS_LES = 300;                     // ticks entre deux sauvegardes (30 s)
  const SAUVE_MAX = 60000;                        // au-delà, la mission en cours n'est pas gardée
  const RESULTAT_AUTO_MS = 6000;                  // départ automatique de la mission suivante
  const APPUI_LONG_MS = 480;                      // appui long = construire
  const SEUIL_GLISSER_PX = 8;
  const BITS_TYPE_BATIMENT = { 1: 2, 2: 16, 3: 32 };   // type de bâtiment → bit de la capacité

  window.JEL_NIVEAUX = NB_MISSIONS;

  const zeros = (n) => { const a = []; for (let i = 0; i < n; i++) a.push(0); return a; };
  const borne = (v, a, b) => (v < a ? a : v > b ? b : v);
  const entier = (v, defaut) => (Number.isFinite(Number(v)) ? Math.floor(Number(v)) : defaut);

  // ---------- Données (tolérantes : un bloc absent n'empêche pas les écrans de s'afficher) ----------
  const D = window.PE_DONNEES || null;
  const CAPACITES = (D && Array.isArray(D.capacites)) ? D.capacites : [];
  const capaciteParId = (id) => CAPACITES.find((c) => c.id === id) || null;
  const capaciteParBit = (bit) => CAPACITES.find((c) => c.bit === bit) || null;
  const ficheMission = (m) => (D && Array.isArray(D.missions) ? D.missions[m - 1] || null : null);

  // ========================================================================
  // Fonctions pures : campagne, sauvegarde, chiffres
  // ========================================================================

  // Masque des capacités gagnées d'après les missions gagnées (missions publiées seulement).
  function techDe(et) {
    let tech = 0;
    for (const c of CAPACITES) if (c.mission >= 1 && c.mission <= NB_TOTAL && et[c.mission - 1] > 0) tech |= c.bit;
    return tech;
  }

  // Première mission non gagnée (1 à 33 ; 34 si tout est gagné).
  function niveauDe(et) {
    for (let i = 0; i < NB_TOTAL; i++) if (!(et[i] > 0)) return i + 1;
    return NB_TOTAL + 1;
  }

  const scoreDe = (et) => et.reduce((a, b) => a + (b > 0 ? b : 0), 0);
  const ventDe = (echecs) => Math.min(30, 10 * Math.max(0, echecs | 0));
  const acteDe = (m) => { let s = 0; for (let a = 0; a < NB_ACTES; a++) { s += TAILLE_ACTES[a]; if (m <= s) return a + 1; } return NB_ACTES; };

  // Campagne relue depuis une sauvegarde JEL_SAVE (ou rien).
  // Sauvegarde sans « camp » (celle du robot : { v: 1, niveau: 3, score, options: {} }) :
  // missions 1 à niveau − 1 gagnées à 1 étoile.
  function campagneDepuis(d) {
    // t : meilleur temps (ticks) de chaque mission gagnée, 0 si aucun ; absent des anciennes sauvegardes (lecture tolérante).
    const C = { et: zeros(NB_TOTAL), ec: zeros(NB_TOTAL), t: zeros(NB_TOTAL), tech: 0, actes: [], titre: 0 };
    if (d && d.camp && typeof d.camp === 'object' && !Array.isArray(d.camp)) {
      const camp = d.camp;
      if (Array.isArray(camp.et)) for (let i = 0; i < NB_TOTAL; i++) C.et[i] = borne(entier(camp.et[i], 0), 0, 3);
      if (Array.isArray(camp.ec)) for (let i = 0; i < NB_TOTAL; i++) C.ec[i] = borne(entier(camp.ec[i], 0), 0, 3);
      if (Array.isArray(camp.t)) for (let i = 0; i < NB_TOTAL; i++) C.t[i] = Math.max(0, entier(camp.t[i], 0));
      if (Array.isArray(camp.actes)) {
        C.actes = camp.actes.filter((a) => a && typeof a === 'object' && Number.isInteger(a.a))
          .map((a) => ({ a: a.a, g: entier(a.g, 0), p: typeof a.p === 'string' ? a.p.slice(0, 150) : '', e: borne(entier(a.e, 0), 0, 24) }));
      }
      C.tech = (entier(camp.tech, 0) | 0) | techDe(C.et);
      C.titre = borne(entier(camp.titre, 0), 0, NB_ACTES);
    } else if (d) {
      const n = borne(entier(d.niveau, 1), 1, NB_TOTAL + 1);
      for (let i = 0; i < n - 1; i++) C.et[i] = 1;
      C.tech = techDe(C.et);
      C.titre = n > TAILLE_ACTES[0] ? 1 : 0;
    }
    return C;
  }

  // Options relues (son activé, vitesse, aide).
  function optionsDepuis(d) {
    const o = (d && d.options && typeof d.options === 'object') ? d.options : {};
    return { son: o.son !== false, vitesse: o.vitesse === 2 ? 2 : 1, aide: o.aide !== false };
  }

  // Données complètes à écrire (format du cadrage, section 11, exactement).
  //   C : campagne ; O : options ; lu : sauvegarde actuelle (JEL_SAVE.load) ; mission : null | { m, g, v, k, snap, h }
  function construireSauvegarde(C, O, lu, mission) {
    let niveau = Math.min(NB_TOTAL, niveauDe(C.et));
    const niveauLu = lu ? entier(lu.niveau, 1) : 1;
    if (niveauLu > niveau && niveauLu <= NB_TOTAL) niveau = niveauLu;   // jamais un niveau inférieur à celui lu
    let m = null;
    if (mission && Number.isInteger(mission.m) && mission.snap) {
      m = { m: mission.m, g: mission.g | 0, v: mission.v | 0, k: mission.k | 0, snap: mission.snap, h: String(mission.h || '') };
      let taille = 0;
      try { taille = JSON.stringify(m).length; } catch (e) { taille = Infinity; }
      if (taille > SAUVE_MAX) m = null;
    }
    return {
      v: 1,
      niveau,
      score: scoreDe(C.et),
      options: { son: !!O.son, vitesse: O.vitesse === 2 ? 2 : 1, aide: !!O.aide },
      camp: { ver: 1, et: C.et.slice(), ec: C.ec.slice(), t: C.t.slice(), tech: C.tech | 0, actes: C.actes.map((a) => ({ a: a.a, g: a.g, p: a.p, e: a.e })), titre: C.titre | 0 },
      mission: m,
    };
  }

  // Part de l'univers connu, en pour cent (nombre), pour n territoires possédés.
  const partUnivers = (n) => (Math.max(0, n) / PRODUIT_UNIVERS) * 100;
  // Position sur la barre logarithmique à cinq graduations (0 à 1).
  const jaugeUnivers = (n) => (n <= 1 ? (n <= 0 ? 0 : 0.02) : Math.min(1, Math.log10(n) / Math.log10(PRODUIT_UNIVERS)));

  // Chrono « m:ss » depuis des ticks (10 par seconde). Chiffres seulement.
  function chrono(ticks) {
    const s = Math.max(0, Math.floor((ticks | 0) / 10));
    const mn = Math.floor(s / 60), sec = s % 60;
    return mn + ':' + (sec < 10 ? '0' : '') + sec;
  }

  // Propriétaires finaux en une chaîne (base 36 : 0 à 5 les camps, « x » neutre), un caractère par territoire.
  function chainePropietaires(p) {
    let s = '';
    for (let i = 0; i < p.length && i < 150; i++) s += p[i] < 0 ? 'x' : (p[i] | 0).toString(36);
    return s;
  }

  const PUR = { techDe, niveauDe, scoreDe, ventDe, acteDe, campagneDepuis, optionsDepuis, construireSauvegarde, partUnivers, jaugeUnivers, chrono, chainePropietaires, NB_MISSIONS, NB_TOTAL, PRODUIT_UNIVERS, SAUVE_MAX };

  // ========================================================================
  // Le jeu (seulement avec un document)
  // ========================================================================

  let partie = null;      // PiloteLocal de la mission en cours
  let rendu = null;       // PE_RENDU (créé au premier lancement)
  let son = null;
  let C = campagneDepuis(null);
  let O = optionsDepuis(null);
  // Mission en cours : { m, g, vent, fini, derniereSauvK, resultat }
  let M = null;
  let enMission = false;
  let pct = 50;           // part envoyée choisie
  let sel = -1;           // territoire choisi (origine)
  let curseur = -1;       // territoire visé au clavier
  let derniereCible = -1; // dernier territoire ennemi touché (Frappe, Pont)
  let rafId = 0;

  const I18N = window.JEL_I18N || null;
  const t = (cle, vars) => (I18N ? I18N.t(cle, vars) : cle);
  const nombre = (x, o) => (I18N ? I18N.nombre(x, o) : String(x));
  // Nombres du canvas : le module commun crée un Intl.NumberFormat à chaque appel (30 % d'une image à ×4 sur
  // la mission 8, profil du 17 novembre) ; le rendu écrit les mêmes entiers à chaque image, on garde leur chaîne.
  const nombresCanvas = new Map();
  function nombreCanvas(x) {
    let s = nombresCanvas.get(x);
    if (s === undefined) { if (nombresCanvas.size > 4096) nombresCanvas.clear(); s = nombre(x); nombresCanvas.set(x, s); }
    return s;
  }
  if (I18N && typeof I18N.surChangement === 'function') I18N.surChangement(() => nombresCanvas.clear());
  const a = (cle) => (I18N && I18N.has ? I18N.has(cle) : false);

  function sauver(avecMission) {
    if (!window.JEL_SAVE) return false;
    let mission = null;
    if (avecMission && partie && enMission && M && !M.fini) {
      try {
        const inst = partie.instantane();
        if (inst && inst.etat) {
          const snap = (inst.etat.m && window.JEL_SIM && window.JEL_SIM.exporter) ? window.JEL_SIM.exporter(inst.etat) : inst.etat;
          mission = { m: M.m, g: M.g, v: M.vent, k: inst.k | 0, snap, h: partie.hachage ? partie.hachage() : '' };
        }
      } catch (e) { mission = null; }
    }
    const lu = window.JEL_SAVE.load(JEU);
    return window.JEL_SAVE.save(JEU, construireSauvegarde(C, O, lu, mission));
  }

  function charger() {
    if (!window.JEL_SAVE) return null;
    const d = window.JEL_SAVE.existe(JEU) ? window.JEL_SAVE.load(JEU) : null;
    C = campagneDepuis(d);
    O = optionsDepuis(d);
    if (son) son.muet(!O.son);
    return d;
  }

  if (typeof document === 'undefined' || !document.getElementById || !document.getElementById('ecran-titre')) {
    // Node (tests) : seules les fonctions pures sont utiles.
    window.PE_JEU = { partie: () => partie, rendu: null, sauver, charger, allerMission: () => false, VERSION, pur: PUR };
    return;
  }

  const $ = (id) => document.getElementById(id);
  const MR = (() => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
  const E = {
    titre: $('ecran-titre'), campagne: $('ecran-campagne'), jeu: $('ecran-jeu'), pause: $('ecran-pause'),
    resultat: $('ecran-resultat'), dezoom: $('ecran-dezoom'), canvas: $('carte'), tuto: $('tuto'), mesures: $('panneau-mesures'),
  };
  const SIM = window.JEL_SIM || window.PE_SIM || null;
  const PIL = window.PE_PILOTE || null;
  const moteurPret = () => !!(D && SIM && PIL && PIL.PiloteLocal && window.PE_RENDU);

  // ---------- Écrans ----------
  function montrer(nom) {
    // Pause et résultat se posent sur l'écran de jeu (HUD visible dessous) ; le dézoom n'a que le canvas et son bandeau.
    for (const k of ['titre', 'campagne', 'jeu', 'pause', 'resultat', 'dezoom']) {
      if (E[k]) E[k].hidden = k !== nom && !(nom === 'pause' && k === 'jeu') && !(nom === 'resultat' && k === 'jeu');
    }
    if (nom !== 'pause' && E.pause) E.pause.hidden = true;
    if (nom !== 'resultat' && E.resultat) E.resultat.hidden = true;
    if (nom !== 'dezoom' && E.dezoom) E.dezoom.hidden = true;
    document.body.dataset.ecran = nom;
  }

  // ---------- Son ----------
  function creerSon() {
    if (son || !window.PE_SON) return;
    son = window.PE_SON.creer();
    son.muet(!O.son);
  }
  const jouerSon = (nom) => { if (son) son.jouer(nom); };
  function basculerSon() {
    O.son = !O.son;
    if (son) son.muet(!O.son);
    majBoutonsSon();
    if (O.son) jouerSon('clic');
    sauver(enMission && !(M && M.fini));   // choix gardé aussi depuis l'écran titre (le niveau lu n'est jamais abaissé)
  }
  function majBoutonsSon() {
    for (const id of ['bt-son-titre', 'bt-son-pause']) { const b = $(id); if (b) b.classList.toggle('muet', !O.son); }
    const texte = $('son-pause-texte');
    if (texte) texte.textContent = t(O.son ? 'son.actif' : 'son.coupe');
    const bt = $('bt-son-titre');
    if (bt) bt.setAttribute('aria-pressed', O.son ? 'true' : 'false');
  }

  // ---------- Écran titre ----------
  function majTitre() {
    const rang = $('titre-rang');
    if (rang) { rang.hidden = !(C.titre > 0); if (C.titre > 0) rang.textContent = t('titre.rang', { titre: t('titre.' + C.titre) }); }
    const btC = $('bt-campagne');
    if (btC) btC.hidden = false;   // la carte des cinq actes est visible dès le premier lancement (cadrage, section 6)
    for (let i = 1; i <= 2; i++) { const an = E.titre.querySelector('.embleme-anneau.a' + i); if (an) an.classList.toggle('allume', C.actes.length >= i); }
    majBoutonsSon();
    if (effacerTitre && effacerTitre.maj) effacerTitre.maj();
  }
  let effacerTitre = null;

  function jouer() {
    creerSon(); if (son) son.init();
    jouerSon('clic');
    if (!window.JEL_SAVE) { allerMission(1); return; }
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => {
        charger();
        const mi = d && d.mission;
        if (mi && Number.isInteger(mi.m) && mi.m >= 1 && mi.m <= NB_MISSIONS && mi.snap && Number.isInteger(mi.k)) {
          allerMission(mi.m, { reprise: mi });
          return;
        }
        const n = niveauDe(C.et);
        if (n <= NB_MISSIONS) allerMission(n); else ouvrirCampagne();
      },
      onNouvelle: () => { charger(); if (C.et.some((e) => e > 0)) ouvrirCampagne(); else allerMission(1); },
      onEffacer: () => { charger(); majTitre(); montrer('titre'); },   // retour au titre : rien n'est réécrit (« Jouer » relance la mission 1)
    });
  }

  // ---------- Mesures (trois touchers sur le numéro de version) ----------
  let touchersVersion = [];
  let mesuresOuvertes = false;
  function toucherVersion() {
    const maintenant = performance.now();
    touchersVersion = touchersVersion.filter((x) => maintenant - x < 1500);
    touchersVersion.push(maintenant);
    if (touchersVersion.length >= 3) { touchersVersion = []; mesuresOuvertes = !mesuresOuvertes; E.mesures.hidden = !mesuresOuvertes; majMesures(); }
  }
  function majMesures() {
    if (!mesuresOuvertes) return;
    const r = rendu ? rendu.mesures : null, p = partie ? partie.mesures : null;
    const f1 = (x) => nombre(Math.round((x || 0) * 100) / 100);
    $('m-image').textContent = f1(r && r.msImage); $('m-image-max').textContent = f1(r && r.msImageMax);
    $('m-tick').textContent = f1(p && p.msTick); $('m-tick-max').textContent = f1(p && p.msTickMax);
    $('m-ticks').textContent = nombre((p && p.ticks) || (partie && partie.k ? partie.k() : 0) || 0);
    $('m-sprites').textContent = nombre((r && r.sprites) || 0); $('m-particules').textContent = nombre((r && r.particules) || 0);
    $('m-recuissons').textContent = nombre((r && r.recuissons) || 0);
  }

  // ---------- Capacités : icônes et libellés ----------
  function puceCapacite(cap, ombre) {
    const s = document.createElement('span');
    s.className = 'cap-puce' + (ombre ? ' ombre' : '');
    s.setAttribute('role', 'listitem');
    const nom = a('capacite.' + cap.id + '.nom') ? t('capacite.' + cap.id + '.nom') : cap.id;
    const effet = a('capacite.' + cap.id + '.effet') ? t('capacite.' + cap.id + '.effet') : '';
    s.title = ombre ? nom + ' — ' + t('capacite.verrou') : nom + ' — ' + effet;
    s.setAttribute('aria-label', s.title);
    const ico = document.createElement('span'); ico.className = 'cap-ico ' + cap.id; ico.setAttribute('aria-hidden', 'true');
    s.appendChild(ico);
    return s;
  }

  // ---------- Carte de campagne ----------
  // Positions des étoiles d'un acte (pourcentages dans son ciel) : deux rangées en zigzag (30 % et 72 %), pour que
  // deux boutons de 44 px voisins restent à 48 px au moins l'un de l'autre à 360 px (8 étoiles sur 334 px).
  function positionsEtoiles(n) {
    const pos = [];
    for (let i = 0; i < n; i++) {
      const x = 5 + ((i + 0.5) * 90) / n;
      const y = i % 2 === 0 ? 30 : 72;
      pos.push([Math.round(x * 10) / 10, y]);
    }
    return pos;
  }

  function ouvrirCampagne() {
    arreterMission();
    construireCampagne();
    montrer('campagne');
    const bt = $('bt-campagne-jouer');
    if (bt) bt.focus();
  }

  function construireCampagne() {
    const total = $('campagne-total');
    if (total) total.textContent = t('campagne.etoiles', { n: C.et.slice(0, NB_MISSIONS).reduce((x, y) => x + y, 0), max: 3 * NB_MISSIONS });
    const caps = $('campagne-capacites');
    caps.textContent = '';
    for (const cap of CAPACITES) caps.appendChild(puceCapacite(cap, !(C.tech & cap.bit)));
    const niveau = niveauDe(C.et);
    const conteneur = $('campagne-actes');
    conteneur.textContent = '';
    let m = 1;
    for (let acte = 1; acte <= NB_ACTES; acte++) {
      const n = TAILLE_ACTES[acte - 1];
      const sec = document.createElement('section');
      const verrou = m > NB_MISSIONS;
      sec.className = 'acte' + (verrou ? ' verrou' : '');
      const nom = document.createElement('div'); nom.className = 'acte-nom';
      const b = document.createElement('b'); b.textContent = t('campagne.acte' + acte); nom.appendChild(b);
      if (verrou) { const s = document.createElement('span'); s.className = 'bientot'; s.textContent = t('campagne.bientot', { n: acte }); nom.appendChild(s); }
      sec.appendChild(nom);
      const ciel = document.createElement('div'); ciel.className = 'acte-ciel';
      const pos = positionsEtoiles(n);
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 100 100'); svg.setAttribute('preserveAspectRatio', 'none'); svg.setAttribute('aria-hidden', 'true');
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pos.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' '));
      svg.appendChild(path); ciel.appendChild(svg);
      for (let i = 0; i < n; i++, m++) {
        const mi = m;
        const bt = document.createElement('button');
        bt.type = 'button';
        const et = C.et[mi - 1] | 0;
        const jouable = mi <= NB_MISSIONS && (et > 0 || mi === niveau);
        bt.className = 'etoile-mission' + (et > 0 ? ' e' + et : '') + (mi === niveau && mi <= NB_MISSIONS ? ' encours' : '') + (jouable ? '' : ' verrou');
        bt.style.left = pos[i][0] + '%'; bt.style.top = pos[i][1] + '%';
        const titre = a('mission.' + mi + '.titre') ? t('mission.' + mi + '.titre') : String(mi);
        const meilleur = et > 0 && C.t[mi - 1] > 0 ? chrono(C.t[mi - 1]) : '';
        bt.setAttribute('aria-label', jouable
          ? t('aria.mission', { n: mi, titre }) + (et > 0 ? ', ' + t('aria.etoiles', { n: et }) : mi === niveau ? ', ' + t('campagne.encours') : '')
            + (meilleur ? ', ' + t('campagne.temps', { t: meilleur }) : '')
          : t('aria.missionVerrou', { n: mi, titre }));
        bt.title = bt.getAttribute('aria-label');
        const num = document.createElement('span'); num.className = 'etoile-nombre'; num.textContent = nombre(mi); bt.appendChild(num);
        if (jouable) bt.addEventListener('click', () => { jouerSon('clic'); allerMission(mi); });
        else bt.disabled = true;
        ciel.appendChild(bt);
        // Meilleur temps d'une mission gagnée, en chiffres à côté de l'étoile (à gauche pour la dernière de la
        // rangée) ; posé dans le ciel, hors du bouton, dont la zone de toucher reste 44 px (libellé complet en infobulle).
        if (meilleur) {
          const tp = document.createElement('span');
          tp.className = 'etoile-temps' + (i === n - 1 ? ' gauche' : '');
          tp.setAttribute('aria-hidden', 'true'); tp.textContent = meilleur;
          tp.style.left = pos[i][0] + '%'; tp.style.top = pos[i][1] + '%';
          ciel.appendChild(tp);
        }
      }
      sec.appendChild(ciel);
      conteneur.appendChild(sec);
    }
    const btJ = $('bt-campagne-jouer');
    btJ.hidden = niveau > NB_MISSIONS;
    const btR = $('bt-revoir');
    btR.hidden = !C.actes.length;
  }

  // ---------- Mission ----------
  function arreterMission() {
    enMission = false;
    if (partie) { try { partie.quitter(); } catch (e) { /* déjà arrêtée */ } }
    partie = null; M = null; sel = -1; curseur = -1; derniereCible = -1;
    cacherTuto();
    cacherBandeau();   // le bandeau de la mission précédente ne reste pas sous le tutoriel de la suivante
    if (rendu) { try { rendu.attacher(null); } catch (e) { /* rien */ } }
    annulerAuto();
  }

  // Graine d'une mission : fixe pour les missions 1 à 3 (fiche), tirée ici pour les autres (jamais dans la simulation).
  function graineDe(fiche) {
    if (fiche && fiche.graine) return fiche.graine | 0;
    return 1 + Math.floor(Math.random() * 2147483000);
  }

  // Lance la mission m. options : { reprise: { g, v, k, snap, h } } pour reprendre au tick près,
  // { graine, vent } pour relancer la même carte (Réessayer, Recommencer).
  function allerMission(m, options) {
    options = options || {};
    m = borne(entier(m, 1), 1, NB_TOTAL);
    if (m > NB_MISSIONS) { ouvrirCampagne(); return false; }
    if (!moteurPret()) { afficherErreurMoteur(); return false; }
    const fiche = ficheMission(m);
    if (!fiche || fiche.verrou) { ouvrirCampagne(); return false; }
    arreterMission();
    creerSon();
    if (!rendu) {
      rendu = window.PE_RENDU.creer({ canvas: E.canvas, donnees: D, sim: SIM, nombre: nombreCanvas });
      rendu.mouvementsReduits = MR;
    }
    const reprise = options.reprise || null;
    const g = reprise ? (reprise.g | 0) : (Number.isInteger(options.graine) ? options.graine : graineDe(fiche));
    const vent = reprise ? borne(reprise.v | 0, 0, 30) : (Number.isInteger(options.vent) ? options.vent : ventDe(C.ec[m - 1]));
    let config;
    try { config = SIM.configMission(m, { graine: g, vent }); } catch (e) { console.error(e); afficherErreurMoteur(); return false; }
    partie = new PIL.PiloteLocal({ sim: SIM, surEvenement: surEvenementPartie });
    let repris = false;
    if (reprise) {
      try {
        partie.local({ graine: g, config, camp: 0, snap: { k: reprise.k | 0, etat: reprise.snap } });
        repris = partie.hachage() === reprise.h && partie.k() === (reprise.k | 0);
      } catch (e) { repris = false; }
      if (!repris) {
        try { partie.quitter(); } catch (e) { /* rien */ }
        partie = new PIL.PiloteLocal({ sim: SIM, surEvenement: surEvenementPartie });
      }
    }
    if (!repris) partie.local({ graine: g, config, camp: 0 });
    if (O.vitesse === 2 && partie.vitesse) partie.vitesse(2);
    majVitesse();
    M = { m, g, vent, fini: false, derniereSauvK: partie.k(), resultat: null, debutK: repris ? (reprise.k | 0) : 0 };
    enMission = true;
    rendu.attacher(partie);
    rendu.redimensionner();
    pct = 50;
    majBoutonsPct();
    construireBoutonsCapacites();
    majHud(true);
    montrer('jeu');
    majMarges();
    try { rendu.cadrer(); } catch (e) { /* rien */ }
    if (!repris) sauver(true);          // écriture au départ (k = 0)
    // Tutoriel (missions 1 à 3 et première capacité) à la première partie de la mission seulement, jamais
    // deux fois dans la même session (Réessayer, Recommencer) ; le bandeau de mission vient après lui
    // (les deux occupent le haut de la carte).
    const tuto = !repris && O.aide && !(C.et[m - 1] > 0) && !tutoVus.has(m) && lancerTuto(m);
    tutoVus.add(m);   // reprise comprise : la mission a déjà été commencée
    if (!tuto) afficherBandeau(m, vent);
    if (!rafId) rafId = requestAnimationFrame(boucle);
    return true;
  }

  function afficherErreurMoteur() {
    annoncer(t('erreur.moteur'), 4000);
    montrer('titre');
  }

  function surEvenementPartie(e) {
    if (!e) return;
    if (e.type === 'fin' && e.resultat && M && !M.fini) finMission(e.resultat);
  }

  // Condition de la 2e étoile : sous le temps visé ; mission « tenir » (objectifs 5, 6, 8, dont la victoire arrive
  // toujours à la fin du compte à rebours) : finir avec au moins autant de régions qu'au départ (règle de pe-sim, deuxiemeEtoile).
  const missionTenir = (etat) => !!(etat && etat.o && (etat.o.t === 5 || etat.o.t === 6 || etat.o.t === 8));
  function texteVise() {
    const etat = partie && partie.etat;
    if (!etat || !M) return '';
    if (missionTenir(etat)) { const fc = D && D.missions[etat.mi - 1] && D.missions[etat.mi - 1].camps; return t('hud.garder', { n: (fc && fc[0] && fc[0].terr) || 1 }); }
    return etat.tv ? t('hud.vise', { t: chrono(etat.tv) }) : '';
  }
  function majVitesse() { const v = $('vitesse-valeur'); if (v) v.textContent = '×' + nombre(O.vitesse); }

  // Bandeau de mission : quelques lignes en haut de la carte (titre, objectif, ★ secondaire, ★★ temps visé,
  // nouveauté), 4 s puis disparaît (toucher : tout de suite) ; semi-transparent, les capitales du haut restent lisibles.
  const BANDEAU_MS = 4000;
  let bandeauMinuteur = 0;
  function afficherBandeau(m, vent) {
    const b = $('bandeau');
    clearTimeout(bandeauMinuteur);
    b.classList.remove('sortie');
    $('bandeau-titre').textContent = t('hud.mission', { n: m }) + ' · ' + t('mission.' + m + '.titre');
    $('bandeau-objectif').textContent = t('mission.' + m + '.objectif') + (vent ? ' ' + t('hud.vent', { n: vent }) : '');
    const sec = $('bandeau-secondaire');
    sec.textContent = a('mission.' + m + '.secondaire') ? t('mission.' + m + '.secondaire') : '';
    sec.hidden = !sec.textContent;
    const vise = $('bandeau-vise');
    vise.textContent = texteVise();
    vise.hidden = !vise.textContent;
    const nouv = $('bandeau-nouveaute');
    nouv.textContent = a('mission.' + m + '.nouveaute') ? t('hud.nouveaute', { texte: t('mission.' + m + '.nouveaute') }) : '';
    nouv.hidden = !nouv.textContent;
    b.hidden = false;
    bandeauMinuteur = setTimeout(cacherBandeau, BANDEAU_MS);
  }
  function cacherBandeau() {
    const b = $('bandeau');
    if (b.hidden) return;
    clearTimeout(bandeauMinuteur);
    b.classList.add('sortie');
    bandeauMinuteur = setTimeout(() => { b.hidden = true; b.classList.remove('sortie'); }, MR ? 10 : 500);
  }
  $('bandeau').addEventListener('click', cacherBandeau);

  // Annonce courte au milieu de l'écran (objectif atteint, secondaire perdu…).
  let annonceMinuteur = 0;
  function annoncer(texte, ms) {
    const el = $('annonce');
    el.textContent = texte; el.hidden = false;
    clearTimeout(annonceMinuteur);
    annonceMinuteur = setTimeout(() => { el.hidden = true; }, ms || 2200);
  }

  // ---------- HUD ----------
  let secondairePerdu = false;
  function majHud(force) {
    if (!partie || !partie.etat || !M) return;
    const etat = partie.etat;
    if (force) {
      $('hud-mission').textContent = t('hud.mission', { n: M.m });
      $('hud-objectif-texte').textContent = t('mission.' + M.m + '.objectif');
      secondairePerdu = false;
      const sec = $('hud-secondaire');
      sec.hidden = !(etat.s2 && etat.s2.t);
      sec.classList.remove('perdu');
      sec.title = a('mission.' + M.m + '.secondaire') ? t('mission.' + M.m + '.secondaire') : t('hud.secondaire');
    }
    const o = etat.o || {};
    let av = '';
    if (o.t === 1) av = nombre(o.x | 0) + ' / ' + nombre(o.n | 0) + ' %';
    else if (o.t === 2 || o.t === 3 || o.t === 8) av = nombre(o.x | 0) + ' / ' + nombre(o.t === 2 ? (o.n | 0) : (o.l ? o.l.length : o.n | 0));
    else if (o.t === 4 || o.t === 9) av = nombre(o.x | 0) + ' / ' + nombre(1);
    else if (o.t === 5 || o.t === 6) av = chrono(o.d | 0);
    else if (o.t === 7) av = t('hud.rivaux', { n: o.x | 0 });
    $('hud-avancement').textContent = av;
    let nb = 0;
    for (let i = 0; i < etat.nn; i++) if (etat.p[i] === 0) nb++;
    $('hud-territoires').textContent = t('hud.territoires', { n: nb });
    const k = partie.k();
    const ch = $('hud-chrono');
    ch.textContent = chrono(k);
    ch.classList.toggle('depasse', !!(etat.tv && k > etat.tv && !missionTenir(etat)));
    ch.title = (missionTenir(etat) ? '' : texteVise()) || t('hud.chrono');
    if (etat.s2 && etat.s2.t && etat.s2.ok === 0 && !secondairePerdu) { secondairePerdu = true; $('hud-secondaire').classList.add('perdu'); }
    majEtatCapacites(etat);
  }

  function majBoutonsPct() {
    for (const b of document.querySelectorAll('.bt.pct')) {
      const v = Number(b.dataset.pct);
      b.classList.toggle('actif', v === pct);
      b.setAttribute('aria-pressed', v === pct ? 'true' : 'false');
      b.setAttribute('aria-label', t('aria.pct', { n: v }));
    }
  }
  function choisirPct(v) { pct = v; majBoutonsPct(); jouerSon('clic'); if (sel >= 0 && curseur >= 0) majFlecheClavier(); }
  for (const b of document.querySelectorAll('.bt.pct')) b.addEventListener('click', () => choisirPct(Number(b.dataset.pct)));

  // Boutons de capacité selon le masque du joueur (actives : bouton ; passives : témoin).
  // Une capacité est « active » si elle a son propre ordre (2 à 7) ; Transfert (ordre 1 : un envoi
  // plus loin, au geste habituel) et Arrière-pays (ordre 0, passif) ne sont que des témoins.
  const boutonsCap = [];
  const capaciteActive = (cap) => (cap.ordre | 0) >= 2;
  function construireBoutonsCapacites() {
    const zone = $('capacites');
    zone.textContent = ''; boutonsCap.length = 0;
    if (!partie || !partie.etat || !partie.etat.c || !partie.etat.c[0]) return;
    const tech = partie.etat.c[0].t | 0;
    let n = 0;
    for (const cap of CAPACITES) {
      if (!(tech & cap.bit) || n >= 4) continue;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'bt cap' + (capaciteActive(cap) ? '' : ' passif');
      const nom = a('capacite.' + cap.id + '.nom') ? t('capacite.' + cap.id + '.nom') : cap.id;
      b.setAttribute('aria-label', t('aria.capacite', { nom }));
      b.title = nom + (a('capacite.' + cap.id + '.effet') ? ' — ' + t('capacite.' + cap.id + '.effet') : '');
      const ico = document.createElement('span'); ico.className = 'cap-ico ' + cap.id; ico.setAttribute('aria-hidden', 'true');
      const lib = document.createElement('span'); lib.textContent = nom;
      b.append(ico, lib);
      if (capaciteActive(cap)) b.addEventListener('click', () => utiliserCapacite(cap));
      else b.disabled = true;
      zone.appendChild(b);
      boutonsCap.push({ cap, b });
      n++;
    }
  }
  function ordreCapacite(cap) {
    const etat = partie && partie.etat;
    if (!etat) return null;
    switch (cap.ordre) {
      case 3: return sel >= 0 ? [3, sel] : null;
      case 2: return sel >= 0 ? [2, sel, cap.id === 'relais' ? 2 : cap.id === 'chantier' ? 3 : 1] : null;
      case 4: return derniereCible >= 0 ? [4, derniereCible] : null;
      case 5: return sel >= 0 && derniereCible >= 0 ? [5, sel, derniereCible] : null;
      case 6: return [6];
      case 7: return [7, etat.c[0].es ? 0 : 1];
      default: return null;
    }
  }
  function majEtatCapacites(etat) {
    for (const { cap, b } of boutonsCap) {
      if (!capaciteActive(cap)) continue;
      const o = ordreCapacite(cap);
      let ok = false;
      if (o) { try { ok = !!SIM.valide(etat, 0, o); } catch (e) { ok = false; } }
      b.setAttribute('aria-disabled', ok ? 'false' : 'true');
    }
  }
  function utiliserCapacite(cap) {
    if (!partie || !enMission || partie.enPause) return;
    const o = ordreCapacite(cap);
    if (!o) { jouerSon('clic'); return; }
    let ok = false;
    try { ok = !!SIM.valide(partie.etat, 0, o); } catch (e) { ok = false; }
    if (!ok) { jouerSon('clic'); return; }
    partie.ordonner(o);
    jouerSon('capacite');
    if (o[1] >= 0 && rendu) rendu.effet(cap.ordre === 2 ? 'bati' : 'capacite', o[1]);
  }

  // Flèches de bord d'écran vers les menaces hors champ.
  function majMenaces() {
    const zone = $('menaces');
    if (!rendu || !enMission) { zone.textContent = ''; return; }
    let liste = [];
    try { liste = rendu.menace() || []; } catch (e) { liste = []; }
    const W = window.innerWidth, H = window.innerHeight;
    const marge = 26, haut = 90, bas = 120;
    while (zone.children.length > liste.length) zone.removeChild(zone.lastChild);
    while (zone.children.length < liste.length) { const f = document.createElement('span'); f.className = 'menace'; zone.appendChild(f); }
    liste.forEach((mn, i) => {
      const cx = W / 2, cy = H / 2;
      const dx = mn.px - cx, dy = mn.py - cy;
      const ang = Math.atan2(dy, dx);
      // Point du bord dans la direction de la menace.
      const sx = (W / 2 - marge) / Math.max(1e-6, Math.abs(Math.cos(ang))), sy = (H / 2 - (dy < 0 ? haut : bas)) / Math.max(1e-6, Math.abs(Math.sin(ang)));
      const d = Math.min(sx, sy);
      const px = cx + Math.cos(ang) * d, py = cy + Math.sin(ang) * d;
      const f = zone.children[i];
      f.style.left = (px - 10) + 'px'; f.style.top = (py - 14) + 'px';
      f.style.transform = 'rotate(' + Math.round((ang * 180) / Math.PI - 90) + 'deg)';
    });
  }

  // ---------- Boucle d'images ----------
  let dernierHud = 0, derniereMenace = 0, dernieresMesures = 0;
  function boucle(tMs) {
    rafId = requestAnimationFrame(boucle);
    if (!rendu) return;
    let evs = [];
    try { evs = rendu.dessiner(tMs) || []; } catch (e) { console.error(e); }
    if (enMission && partie && M && !M.fini) {
      if (evs.length) traiterEvenements(evs);
      if (tMs - dernierHud > 120) { majHud(false); dernierHud = tMs; }
      if (tMs - derniereMenace > 400) { majMenaces(); derniereMenace = tMs; }
      const k = partie.k();
      if (k - M.derniereSauvK >= SAUVE_TOUS_LES && !partie.enPause) { M.derniereSauvK = k; sauver(true); }
      if (partie.resultat) finMission(partie.resultat);
    }
    if (mesuresOuvertes && tMs - dernieresMesures > 500) { majMesures(); dernieresMesures = tMs; }
  }

  // Événements du tick (contrat 4.5) → sons et HUD. evs : [[k, ev], …], ev = liste d'événements du tick.
  function traiterEvenements(evs) {
    for (const paire of evs) {
      const ev = paire && paire[1];
      if (!Array.isArray(ev)) continue;
      const liste = Array.isArray(ev[0]) ? ev : [ev];
      for (const e of liste) {
        switch (e[0]) {
          case 1: if (e[2] === 0) jouerSon('prise'); else if (e[3] === 0) jouerSon('perte'); break;
          case 3: if (e[2] === 0) jouerSon('arrivee'); break;
          case 4: if (e[2] === 0 || (partie.etat && partie.etat.p[e[1]] === 0)) jouerSon('siege'); break;
          case 6: jouerSon('capacite'); break;
          case 7: if (e[3] === 0) jouerSon('capacite'); break;
          case 8: {   // offensive annoncée [8, camp, dansTicks] : son et annonce avec le nom de la faction
            const cc = partie.etat && partie.etat.c[e[1]], fa = cc && D ? D.factions[cc.fa] : null;
            annoncer(t('hud.offensive', { camp: fa && a('faction.' + fa.id) ? t('faction.' + fa.id) : '' }), 3000);
            jouerSon('annonce');
            break;
          }
          case 9:
            if (e[1] === 1) { annoncer(t('hud.objectifAtteint')); jouerSon('etoile'); }
            else if (e[1] === 2) { annoncer(t('hud.secondairePerdu')); jouerSon('perte'); }
            break;
          case 10: break;
          case 11: if (e[2] === 0) jouerSon('capacite'); break;
          default: break;
        }
      }
    }
  }

  // ---------- Fin de mission ----------
  function finMission(res) {
    if (!M || M.fini) return;
    M.fini = true; M.resultat = res;
    try { majHud(false); } catch (e) { /* rien */ }   // le HUD derrière le résultat montre le dernier tick (6 / 6, pas 5 / 6)
    enMission = false;
    cacherTuto(); cacherBandeau();
    rendu.selection(-1); rendu.fleche(null);
    const m = M.m;
    const etat = partie.etat;
    const victoire = !!(res && (res.gagnant === 0 || (etat.eq && res.gagnant === etat.eq[0])));
    const etoiles = victoire ? borne(entier(res.etoiles, 1), 1, 3) : 0;
    if (window.FMG) window.FMG.reportEnd({ completed: victoire, level: m });
    let nouvelleCap = null;
    const fiche = ficheMission(m);
    if (victoire) {
      C.et[m - 1] = Math.max(C.et[m - 1] | 0, etoiles);
      const kFin = Math.max(1, partie.k() | 0);
      C.t[m - 1] = C.t[m - 1] > 0 ? Math.min(C.t[m - 1], kFin) : kFin;   // meilleur temps (carte de campagne)
      if (fiche && fiche.capacite) {
        const cap = capaciteParId(fiche.capacite);
        if (cap) { if (!(C.tech & cap.bit)) nouvelleCap = cap; C.tech |= cap.bit; }
      }
      if (m === TAILLE_ACTES[0] && !C.actes.some((x) => x.a === 1)) {
        C.actes.push({ a: 1, g: M.g, p: chainePropietaires(etat.p), e: C.et.slice(0, TAILLE_ACTES[0]).reduce((x, y) => x + y, 0) });
      }
      if (m === TAILLE_ACTES[0]) C.titre = Math.max(C.titre, 1);
      C.ec[m - 1] = 0;   // le vent dans le dos ne compte que les échecs d'affilée sur la mission (cadrage, section 13)
      if (C.et.slice(0, NB_MISSIONS).every((e) => e > 0)) { if (window.FMG) window.FMG.reportComplete({ stars: C.et.slice(0, NB_MISSIONS).reduce((x, y) => x + y, 0), maxStars: 3 * NB_MISSIONS }); }
    } else {
      C.ec[m - 1] = Math.min(3, (C.ec[m - 1] | 0) + 1);
    }
    sauver(false);           // campagne à jour, mission remise à null
    jouerSon(victoire ? 'victoire' : 'defaite');
    afficherResultat(victoire, etoiles, res, nouvelleCap);
  }

  let autoMinuteur = 0, autoIntervalle = 0;
  function annulerAuto() { clearTimeout(autoMinuteur); clearInterval(autoIntervalle); autoMinuteur = 0; autoIntervalle = 0; const el = $('resultat-auto'); if (el) el.hidden = true; }

  function afficherResultat(victoire, etoiles, res, nouvelleCap) {
    const m = M.m, etat = partie.etat;
    const panneau = E.resultat.querySelector('.panneau');
    panneau.classList.toggle('defaite', !victoire);
    $('resultat-mission').textContent = t('hud.mission', { n: m }) + ' · ' + t('mission.' + m + '.titre');
    $('resultat-titre').textContent = t(victoire ? 'resultat.victoire' : 'resultat.defaite');
    const raison = $('resultat-raison');
    // Raison de la défaite : 1 objectif échoué (mission « tenir » : la capitale ou une région à tenir est tombée),
    // 2 éliminé, 3 temps écoulé, 4 allié tombé, 5 course perdue (contrat, 4.6).
    let cle = 'resultat.raison' + (res && res.raison);
    if (res && res.raison === 1 && missionTenir(etat)) cle = etat.c && etat.c[0] && etat.c[0].cap === -1 ? 'resultat.raisonCapitale' : 'resultat.raisonRegion';
    raison.hidden = victoire || !a(cle);
    if (!raison.hidden) raison.textContent = t(cle);
    if (victoire && m === TAILLE_ACTES[0]) { raison.hidden = false; raison.textContent = t('resultat.acteFini'); }
    // Étoiles une à une.
    const spans = $('resultat-etoiles').querySelectorAll('.etoile');
    spans.forEach((s, i) => { s.classList.remove('gagnee'); void s.offsetWidth; if (i < etoiles) s.classList.add('gagnee'); });
    if (spans[1]) spans[1].title = t(missionTenir(etat) ? 'resultat.etoile2Tenir' : 'resultat.etoile2');
    $('resultat-etoiles').setAttribute('aria-label', t('aria.etoiles', { n: etoiles }));
    for (let i = 0; i < etoiles; i++) setTimeout(() => jouerSon('etoile'), MR ? 50 : 300 + i * 500);
    const k = partie.k();
    const vise = missionTenir(etat) ? '' : texteVise();
    $('resultat-temps').textContent = t('resultat.temps', { t: chrono(k) }) + (vise ? ' · ' + vise : '');
    // Carte de capacité retournée (première fois seulement).
    const carte = $('resultat-carte');
    carte.hidden = !nouvelleCap;
    if (nouvelleCap) {
      $('carte-ico').className = 'cap-ico ' + nouvelleCap.id;
      $('carte-nom').textContent = a('capacite.' + nouvelleCap.id + '.nom') ? t('capacite.' + nouvelleCap.id + '.nom') : nouvelleCap.id;
      $('carte-effet').textContent = a('capacite.' + nouvelleCap.id + '.effet') ? t('capacite.' + nouvelleCap.id + '.effet') : '';
      // Relance l'animation de retournement.
      for (const f of carte.querySelectorAll('.carte-face')) { const x = f.style.animation; f.style.animation = 'none'; void f.offsetWidth; f.style.animation = x; }
      setTimeout(() => jouerSon('capacite'), MR ? 50 : 1300);
    }
    // Part de l'univers connu.
    let n = 0;
    for (let i = 0; i < etat.nn; i++) if (etat.p[i] === 0) n++;
    const jauge = $('univers-jauge');
    jauge.style.width = '0%';
    requestAnimationFrame(() => { jauge.style.width = (jaugeUnivers(n) * 100).toFixed(2) + '%'; });
    // « 6 régions sur 1 105 920 000 » : plus parlant qu'un pourcentage à huit décimales (la barre donne l'échelle).
    $('univers-part').textContent = t('univers.part', { n, total: nombre(PRODUIT_UNIVERS) });
    $('resultat-univers').title = t('univers.aide');
    // Vent dans le dos (défaite).
    const vent = $('resultat-vent');
    const prochainVent = ventDe(C.ec[m - 1]);
    vent.hidden = victoire || !prochainVent;
    if (!vent.hidden) vent.textContent = t('resultat.vent', { n: prochainVent });
    // Boutons : après une défaite, « Réessayer » suffit (« Rejouer » ferait la même chose).
    const btS = $('bt-suivant');
    btS.textContent = victoire ? (m >= NB_MISSIONS ? t('bt.plusGrand') : t('bt.suivant')) : t('bt.reessayer');
    $('bt-resultat-rejouer').hidden = !victoire;
    const auto = $('resultat-auto');
    annulerAuto();
    // Départ automatique seulement sans carte de capacité à lire.
    if (victoire && m < NB_MISSIONS && !nouvelleCap) {
      let reste = RESULTAT_AUTO_MS / 1000;
      auto.hidden = false; auto.textContent = t('resultat.auto', { n: reste });
      autoIntervalle = setInterval(() => { reste--; if (reste > 0) auto.textContent = t('resultat.auto', { n: reste }); }, 1000);
      autoMinuteur = setTimeout(() => { annulerAuto(); suivant(); }, RESULTAT_AUTO_MS);
    }
    montrer('resultat');
    btS.focus();
  }

  function suivant() {
    if (!M) return;
    annulerAuto();
    const m = M.m, victoire = !!(M.resultat && (M.resultat.gagnant === 0));
    if (!victoire) { allerMission(m, { graine: M.g, vent: ventDe(C.ec[m - 1]) }); return; }
    if (m >= NB_MISSIONS) { lancerDezoom(); return; }
    allerMission(m + 1);
  }

  // Tout toucher ou toute touche sur l'écran de résultat annule le départ automatique.
  E.resultat.addEventListener('pointerdown', () => { if (autoMinuteur) annulerAuto(); }, true);
  E.resultat.addEventListener('keydown', () => { if (autoMinuteur) annulerAuto(); }, true);

  // ---------- Dézoom de fin d'acte ----------
  let dezoomEnCours = null;
  function lancerDezoom() {
    const acte = M ? acteDe(M.m) : 1;
    $('dezoom-acte').textContent = t('dezoom.acteFini', { n: acte });
    $('dezoom-titre').textContent = t('dezoom.titre', { titre: t('titre.' + Math.max(1, Math.min(NB_ACTES, acte))) });
    $('dezoom-suite').textContent = t('campagne.acte' + Math.min(NB_ACTES, acte + 1)) + ' · ' + t('dezoom.suite', { n: acte + 1 });
    montrer('dezoom');
    jouerSon('horizon');
    let fini = false;
    const terminer = () => { if (fini) return; fini = true; dezoomEnCours = null; ouvrirCampagne(); };
    try {
      dezoomEnCours = rendu && partie ? rendu.dezoom({ silhouette: D.silhouette2, dureeMs: MR ? 1000 : 4000, onFin: terminer }) : null;
      if (!dezoomEnCours) setTimeout(terminer, MR ? 1000 : 4000);
    } catch (e) { setTimeout(terminer, 1000); }

  }
  $('bt-passer').addEventListener('click', () => {
    if (dezoomEnCours && typeof dezoomEnCours.passer === 'function') dezoomEnCours.passer();

  });
  // « Revoir » depuis la carte de campagne : le rendu n'a plus de partie, on rejoue la dernière mission de l'acte
  // en mémoire (sans la lancer) pour cuire la carte, puis le dézoom.
  $('bt-revoir').addEventListener('click', () => {
    if (!moteurPret() || !C.actes.length) return;
    const acte = C.actes[0];
    try {
      creerSon(); if (son) son.init();
      if (!rendu) { rendu = window.PE_RENDU.creer({ canvas: E.canvas, donnees: D, sim: SIM, nombre: nombreCanvas }); rendu.mouvementsReduits = MR; }
      const m = TAILLE_ACTES[0];
      const config = SIM.configMission(m, { graine: acte.g | 0, vent: 0 });
      partie = new PIL.PiloteLocal({ sim: SIM, surEvenement: () => {} });
      partie.local({ graine: acte.g | 0, config, camp: 0 });
      partie.pause(true);
      // Propriétaires finaux relus de la chaîne gardée : la carte revue est celle de la victoire.
      if (partie.etat && typeof acte.p === 'string') for (let i = 0; i < partie.etat.nn && i < acte.p.length; i++) { const c = acte.p[i]; partie.etat.p[i] = c === 'x' ? -1 : parseInt(c, 36); }
      M = { m, g: acte.g | 0, vent: 0, fini: true, derniereSauvK: 0, resultat: null, debutK: 0 };
      enMission = false;
      rendu.attacher(partie);
      rendu.redimensionner();
      if (!rafId) rafId = requestAnimationFrame(boucle);
      lancerDezoom();
    } catch (e) { console.error(e); ouvrirCampagne(); }
  });

  // ---------- Horizon ----------
  let horizonEnCours = false;
  function horizon() {
    if (!rendu || !partie || horizonEnCours || !enMission) return;
    horizonEnCours = true;
    jouerSon('horizon');
    const b = $('horizon-bandeau');
    b.hidden = false;
    const fin = () => { horizonEnCours = false; b.hidden = true; };
    try {
      const h = rendu.horizon({ silhouette: D.silhouette2, dureeMs: 1500, onFin: fin });

    } catch (e) { fin(); }
    setTimeout(() => { if (horizonEnCours) fin(); }, 2600);   // filet de sécurité
  }
  $('bt-horizon').addEventListener('click', horizon);

  // ---------- Pause ----------
  function mettreEnPause(oui) {
    if (!partie || !enMission || !M || M.fini) return;

  $('bt-reprendre').addEventListener('click', () => { jouerSon('clic'); mettreEnPause(false); });
  $('bt-recommencer').addEventListener('click', () => { if (!M) return; jouerSon('clic'); const m = M.m, g = M.g, v = M.vent; allerMission(m, { graine: g, vent: v }); });
  $('bt-vitesse').addEventListener('click', () => {
    O.vitesse = O.vitesse === 2 ? 1 : 2;
