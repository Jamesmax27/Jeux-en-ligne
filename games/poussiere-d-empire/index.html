  $('bt-son-pause').addEventListener('click', basculerSon);
  $('bt-son-titre').addEventListener('click', () => { creerSon(); if (son) son.init(); basculerSon(); });
  $('bt-pause-accueil').addEventListener('click', () => { jouerSon('clic'); sauver(true); arreterMission(); majTitre(); montrer('titre'); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && enMission && M && !M.fini) { sauver(true); mettreEnPause(true); } });

  // ---------- Résultat : boutons ----------
  $('bt-suivant').addEventListener('click', () => { jouerSon('clic'); suivant(); });
  $('bt-resultat-rejouer').addEventListener('click', () => { if (!M) return; jouerSon('clic'); annulerAuto(); allerMission(M.m, { graine: M.g, vent: ventDe(C.ec[M.m - 1]) }); });
  $('bt-resultat-campagne').addEventListener('click', () => { jouerSon('clic'); annulerAuto(); ouvrirCampagne(); });

  // ---------- Titre et campagne : boutons ----------
  $('bt-jouer').addEventListener('click', jouer);
  $('bt-campagne').addEventListener('click', () => { creerSon(); if (son) son.init(); jouerSon('clic'); charger(); ouvrirCampagne(); });
  $('bt-campagne-accueil').addEventListener('click', () => { jouerSon('clic'); majTitre(); montrer('titre'); });
  $('bt-campagne-jouer').addEventListener('click', () => { jouerSon('clic'); const n = niveauDe(C.et); if (n <= NB_MISSIONS) allerMission(n); });
  $('version').addEventListener('click', toucherVersion);
  $('bt-mesures-fermer').addEventListener('click', () => { mesuresOuvertes = false; E.mesures.hidden = true; });

  // ---------- Tutoriel animé ----------
  // Étapes : { cle, anim } ; anim : 'toucher' | 'glisser' | 'regarder' | 'appui'.
  let tutoEtapes = [], tutoIndex = 0, tutoActif = false;
  const tutoVus = new Set();      // missions dont le tutoriel a déjà été montré dans cette session
  function etapesTuto(m) {
    const e = [];
    if (m === 1) e.push({ cle: 'tuto.m1.1', anim: 'toucher' }, { cle: 'tuto.m1.2', anim: 'glisser' }, { cle: 'tuto.m1.3', anim: 'regarder' });
    else if (m === 2) e.push({ cle: 'tuto.m2.1', anim: 'regarder' }, { cle: 'tuto.m2.2', anim: 'toucher' });
    else if (m === 3) e.push({ cle: 'tuto.m3.1', anim: 'regarder' }, { cle: 'tuto.m3.2', anim: 'glisser' });
    else if (m === 5) e.push({ cle: 'tuto.m5.1', anim: 'toucher' });   // le siège : Rallier pour défendre
    // Première apparition d'une capacité : celle gagnée à la mission précédente.
    const tech = partie && partie.etat && partie.etat.c && partie.etat.c[0] ? partie.etat.c[0].t | 0 : 0;
    for (const cap of CAPACITES) {
      if (cap.mission === m - 1 && (tech & cap.bit) && a('tuto.cap.' + cap.id)) {
        e.push({ cle: 'tuto.cap.' + cap.id, anim: cap.id === 'fortin' ? 'appui' : cap.id === 'arrierepays' ? 'regarder' : cap.id === 'transfert' ? 'glisser' : 'toucher' });
      }
    }
    return e.slice(0, 3);
  }
  // Lance le tutoriel de la mission m (3 étapes au plus, simulation en pause) ; false s'il n'y en a pas.
  // Le panneau est en haut de l'écran : il ne couvre jamais la capitale du joueur, en bas de la carte.
  function lancerTuto(m) {
    tutoEtapes = etapesTuto(m);
    if (!tutoEtapes.length) return false;
    tutoIndex = 0; tutoActif = true;
    if (partie) partie.pause(true);
    montrerEtapeTuto();
    return true;
  }
  function montrerEtapeTuto() {
    const e = tutoEtapes[tutoIndex];
    E.tuto.className = 'tuto ' + e.anim;
    $('tuto-etape').textContent = t('tuto.etape', { n: tutoIndex + 1, max: tutoEtapes.length });
    $('tuto-texte').textContent = t(e.cle);
    E.tuto.hidden = false;
    $('bt-compris').focus();
  }
  function cacherTuto() { tutoActif = false; E.tuto.hidden = true; }
  $('bt-compris').addEventListener('click', () => {
    jouerSon('clic');
    tutoIndex++;
    if (tutoIndex < tutoEtapes.length) { montrerEtapeTuto(); return; }
    cacherTuto();
    if (partie && enMission && M && !M.fini) {
      afficherBandeau(M.m, M.vent);
      if (E.pause.hidden) partie.pause(false);
    }
  });

  // ---------- Commandes sur la carte ----------
  const pointeurs = new Map();    // pointerId → { x, y, x0, y0, i0, bouge }
  let mode = null;                // 'glisser' | 'pan' | 'pincer'
  let appuiLong = 0;
  let pinceDist = 0;
  let pinceHorizon = false;       // pincement passé sous le zoom minimal : Horizon au relâcher
  let versCourant = -1;

  const etatJeu = () => (partie && partie.etat) || null;
  const estMien = (i) => { const e = etatJeu(); return !!e && i >= 0 && e.p[i] === 0; };
  const commandesActives = () => enMission && partie && M && !M.fini && !partie.enPause && !horizonEnCours && !tutoActif;

  // Forces qui partiraient de « de » avec la part choisie.
  function forcesPartantes(de) {
    const e = etatJeu();
    if (!e || de < 0) return 0;
    const f = e.f[de] | 0;
    if (f < 2) return 0;
    return Math.min(f - 1, Math.max(1, Math.floor((f * pct) / 100)));
  }
  function envoiValide(de, vers) {
    const e = etatJeu();
    if (!e || de < 0 || vers < 0 || de === vers) return false;
    try { return !!SIM.valide(e, 0, [1, de, vers, pct]); } catch (err) { return false; }
  }
  function envoyer(de, vers, part) {
    if (!commandesActives()) return false;
    const p = part || pct;
    const e = etatJeu();
    let ok = false;
    try { ok = !!SIM.valide(e, 0, [1, de, vers, p]); } catch (err) { ok = false; }
    if (!ok) { jouerSon('clic'); return false; }
    const f = e.f[de] | 0;
    const n = Math.min(f - 1, Math.max(1, Math.floor((f * p) / 100)));
    partie.ordonner([1, de, vers, p]);
    rendu.fantome(de, vers, n);
    jouerSon('depart');
    if (!estMien(vers)) derniereCible = vers;
    return true;
  }
  function choisir(i) {
    sel = i;
    rendu.selection(i);
    if (i >= 0) jouerSon('clic');
  }
  function construireSur(i) {
    const e = etatJeu();
    if (!e || !estMien(i)) return;
    const tech = e.c[0].t | 0;
    // Premier bâtiment permis par les capacités (fortin, puis relais, chantier).
    for (const type of [1, 2, 3]) {
      if (!(tech & BITS_TYPE_BATIMENT[type])) continue;
      const o = [2, i, type];
      let ok = false;
      try { ok = !!SIM.valide(e, 0, o); } catch (err) { ok = false; }
      if (ok) { partie.ordonner(o); rendu.effet('bati', i); jouerSon('capacite'); return; }
    }
    jouerSon('clic');
  }

  function positionLocale(ev) {
    const r = E.canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }

  E.canvas.addEventListener('pointerdown', (ev) => {
    if (!rendu) return;
    creerSon(); if (son) son.init();
    cacherBandeau();
    const p = positionLocale(ev);
    try { E.canvas.setPointerCapture(ev.pointerId); } catch (e) { /* rien */ }
    const i0 = commandesActives() ? rendu.territoireA(p.x, p.y) : -1;
    pointeurs.set(ev.pointerId, { x: p.x, y: p.y, x0: p.x, y0: p.y, i0, bouge: false });
    clearTimeout(appuiLong); appuiLong = 0;
    if (pointeurs.size >= 2) {
      mode = 'pincer';
      rendu.fleche(null);
      const [p1, p2] = [...pointeurs.values()];
      pinceDist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      return;
    }
    if (ev.button === 2) return;   // clic droit : traité au contextmenu
    if (i0 >= 0 && estMien(i0)) {
      mode = 'glisser';
      versCourant = -1;
      choisir(i0);
      appuiLong = setTimeout(() => {
        appuiLong = 0;
        const pt = pointeurs.get(ev.pointerId);
        if (pt && !pt.bouge && mode === 'glisser') { construireSur(i0); mode = null; rendu.fleche(null); }
      }, APPUI_LONG_MS);
    } else {
      mode = 'pan';
    }
  });

  E.canvas.addEventListener('pointermove', (ev) => {
    const pt = pointeurs.get(ev.pointerId);
    if (!pt || !rendu) return;
    const p = positionLocale(ev);
    const dx = p.x - pt.x, dy = p.y - pt.y;
    pt.x = p.x; pt.y = p.y;
    if (!pt.bouge && Math.hypot(p.x - pt.x0, p.y - pt.y0) > SEUIL_GLISSER_PX) { pt.bouge = true; clearTimeout(appuiLong); appuiLong = 0; }
    if (mode === 'pincer' && pointeurs.size >= 2) {
      const [p1, p2] = [...pointeurs.values()];
      const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      if (pinceDist > 0 && d > 0) {
        // Pincer au-delà du zoom minimal : l'Horizon (cadrage, section 6), une fois par geste.
        const auPlancher = rendu.camera && rendu.zoomMin && rendu.camera.z <= rendu.zoomMin * 1.001;
        if (d < pinceDist * 0.92 && auPlancher && commandesActives()) { pinceHorizon = true; }
        else rendu.zoomer(d / pinceDist, (p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
      }
      pinceDist = d;
      return;
    }
    if (mode === 'glisser') {
      if (!pt.bouge) return;
      const vers = rendu.territoireA(p.x, p.y);
      versCourant = vers;
      const de = pt.i0;
      const ok = vers >= 0 && vers !== de && envoiValide(de, vers);
      rendu.fleche({ de, px: p.x, py: p.y, n: forcesPartantes(de), ok: ok ? 1 : 0, vers: vers >= 0 && vers !== de ? vers : -1 });
    } else if (mode === 'pan') {
      if (pt.bouge) rendu.panoramique(dx, dy);
    }
  });

  function finPointeur(ev) {
    const pt = pointeurs.get(ev.pointerId);
    pointeurs.delete(ev.pointerId);
    clearTimeout(appuiLong); appuiLong = 0;
    if (!pt || !rendu) { mode = pointeurs.size ? mode : null; return; }
    if (mode === 'pincer') {
      if (pointeurs.size < 2) { mode = pointeurs.size ? 'pan' : null; if (!pointeurs.size && pinceHorizon) { pinceHorizon = false; horizon(); } }
      return;
    }
    const p = positionLocale(ev);
    if (mode === 'glisser') {
      rendu.fleche(null);
      const de = pt.i0;
      if (pt.bouge) {
        const vers = rendu.territoireA(p.x, p.y);
        if (vers >= 0 && vers !== de) envoyer(de, vers);
        choisir(de >= 0 && estMien(de) ? de : -1);
      }
      // Simple toucher : la région reste choisie (origine des prochains envois).
    } else if (mode === 'pan' && !pt.bouge && commandesActives()) {
      const i = rendu.territoireA(p.x, p.y);
      if (i >= 0 && sel >= 0 && i !== sel) { if (envoyer(sel, i)) choisir(sel); }
      else if (i >= 0 && !estMien(i)) { derniereCible = i; }
      else if (i < 0) choisir(-1);
    }
    mode = null;
  }
  E.canvas.addEventListener('pointerup', finPointeur);
  E.canvas.addEventListener('pointercancel', finPointeur);
  E.canvas.addEventListener('lostpointercapture', (ev) => { if (pointeurs.has(ev.pointerId)) finPointeur(ev); });

  // Clic droit : envoyer 100 % depuis la région choisie vers la cible.
  E.canvas.addEventListener('contextmenu', (ev) => {
    ev.preventDefault();
    if (!rendu || !commandesActives()) return;
    const p = positionLocale(ev);
    const i = rendu.territoireA(p.x, p.y);
    if (i >= 0 && sel >= 0 && i !== sel) envoyer(sel, i, 100);
  });
  // Molette : zoom au point.
  E.canvas.addEventListener('wheel', (ev) => {
    if (!rendu) return;
    ev.preventDefault();
    const p = positionLocale(ev);
    rendu.zoomer(ev.deltaY < 0 ? 1.15 : 1 / 1.15, p.x, p.y);
  }, { passive: false });

  // ---------- Clavier ----------
  function territoiresTries() {
    const e = etatJeu();
    if (!e || !e.m) return [];
    const liste = [];
    for (let i = 0; i < e.nn; i++) liste.push(i);
    liste.sort((p, q) => (e.m.y[p] - e.m.y[q]) || (e.m.x[p] - e.m.x[q]));
    return liste;
  }
  function voisinDirection(depuis, dx, dy) {
    const e = etatJeu();
    if (!e || !e.m) return -1;
    if (depuis < 0) return territoiresTries()[0] ?? -1;
    let meilleur = -1, score = Infinity;
    for (let i = 0; i < e.nn; i++) {
      if (i === depuis) continue;
      const vx = e.m.x[i] - e.m.x[depuis], vy = e.m.y[i] - e.m.y[depuis];
      const prod = vx * dx + vy * dy;
      if (prod <= 0) continue;
      const d = Math.hypot(vx, vy);
      const s = d * (2 - prod / Math.max(1, d));   // préfère la direction demandée, puis la proximité
      if (s < score) { score = s; meilleur = i; }
    }
    return meilleur;
  }
  function placerCurseur(i) {
    curseur = i;
    if (i >= 0 && rendu) {
      const e = etatJeu();
      // Garde le curseur visible : recadrage doux si hors écran.
      const pe = rendu.versEcran(e.m.x[i], e.m.y[i]);
      const W = window.innerWidth, H = window.innerHeight;
      if (pe.px < 40 || pe.py < 90 || pe.px > W - 40 || pe.py > H - 120) rendu.panoramique(W / 2 - pe.px, H / 2 - pe.py);
      if (sel < 0) rendu.selection(i);
    }
    majFlecheClavier();
  }
  function majFlecheClavier() {
    if (!rendu) return;
    if (sel >= 0 && curseur >= 0 && curseur !== sel) {
      const e = etatJeu();
      const pe = rendu.versEcran(e.m.x[curseur], e.m.y[curseur]);
      rendu.fleche({ de: sel, px: pe.px, py: pe.py, n: forcesPartantes(sel), ok: envoiValide(sel, curseur) ? 1 : 0, vers: curseur });
    } else rendu.fleche(null);
  }
  document.addEventListener('keydown', (ev) => {
    const code = ev.code;
    if (code === 'Escape' || code === 'KeyP') {
      if (!E.pause.hidden) { ev.preventDefault(); mettreEnPause(false); return; }
      if (enMission && M && !M.fini && E.resultat.hidden && !tutoActif) { ev.preventDefault(); mettreEnPause(true); return; }
      return;
    }
    if (!commandesActives()) return;
    const e = etatJeu();
    if (!e) return;
    if (code === 'Tab') {
      ev.preventDefault();
      const miens = territoiresTries().filter((i) => e.p[i] === 0);
      if (!miens.length) return;
      const pos = miens.indexOf(curseur);
      placerCurseur(miens[(pos + (ev.shiftKey ? miens.length - 1 : 1)) % miens.length]);
    } else if (code === 'ArrowUp' || code === 'ArrowDown' || code === 'ArrowLeft' || code === 'ArrowRight') {
      ev.preventDefault();
      const d = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[code];
      const i = voisinDirection(curseur, d[0], d[1]);
      if (i >= 0) placerCurseur(i);
    } else if (code === 'Space') {
      ev.preventDefault();
      if (curseur >= 0 && estMien(curseur)) { choisir(sel === curseur ? -1 : curseur); majFlecheClavier(); }
    } else if (code === 'Enter' || code === 'NumpadEnter') {
      ev.preventDefault();
      if (sel >= 0 && curseur >= 0 && curseur !== sel) envoyer(sel, curseur);
    } else if (/^(Digit|Numpad)[1-4]$/.test(code)) {
      choisirPct([25, 50, 75, 100][Number(code.slice(-1)) - 1]);
    } else if (code === 'KeyR') {
      const cap = capaciteParBit(1); if (cap && (e.c[0].t & 1)) utiliserCapacite(cap);
    } else if (code === 'KeyF' || code === 'KeyB') {
      if (sel >= 0) construireSur(sel);
    } else if (code === 'KeyH') {
      horizon();
    } else if (code === 'Equal' || code === 'NumpadAdd') {
      rendu.zoomer(1.2, window.innerWidth / 2, window.innerHeight / 2);
    } else if (code === 'Minus' || code === 'NumpadSubtract') {
      rendu.zoomer(1 / 1.2, window.innerWidth / 2, window.innerHeight / 2);
    }
  });

  // ---------- Fenêtre ----------
  // Zone libre de la carte : le HUD du haut, et celui du bas (portrait) ou de droite (paysage) ; le rendu
  // cadre et borne la caméra entre ces marges (la capitale, en bas de la carte, reste sous aucun bouton).
  function majMarges() {
    if (!rendu || !rendu.marges) return;
    const W = window.innerWidth, H = window.innerHeight;
    const rh = $('hud-haut').getBoundingClientRect(), rb = $('hud-bas').getBoundingClientRect();
    const paysage = rb.height > H * 0.5 && rb.width < W * 0.6;
    rendu.marges = { haut: Math.min(H * 0.3, rh.height), bas: paysage ? 0 : Math.min(H * 0.3, rb.height), gauche: 0, droite: paysage ? Math.min(W * 0.4, rb.width) : 0 };
  }
  function redimensionner() { if (rendu) { try { rendu.redimensionner(); if (enMission) { majMarges(); rendu.cadrer(); } } catch (e) { /* rien */ } } }
  window.addEventListener('resize', redimensionner);
  window.addEventListener('orientationchange', redimensionner);

  // ---------- Langue ----------
  if (I18N && I18N.surChangement) {
    I18N.surChangement(() => {
      majTitre(); majBoutonsSon(); majBoutonsPct();
      if (!E.campagne.hidden) construireCampagne();
      if (enMission) { construireBoutonsCapacites(); majHud(true); }
    });
  }

  // ---------- Sauvegarde à la fermeture ----------
  if (window.JEL_SAVE) {
    window.JEL_SAVE.surFermeture(() => { if (enMission && partie && M && !M.fini) sauver(true); });
    effacerTitre = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('zone-effacer'), apres: () => { charger(); majTitre(); } });
  }

  // ---------- Démarrage ----------
  charger();
  majTitre();
  majVitesse();   // ×1 ou ×2 selon les options relues
  montrer('titre');
  if (!rafId) rafId = requestAnimationFrame(boucle);

  window.PE_JEU = {
    partie: () => partie,
    get rendu() { return rendu; },
    sauver, charger, allerMission,
    campagne: () => C,
    VERSION,
    pur: PUR,
  };
})();
</script>
</body>
</html>
