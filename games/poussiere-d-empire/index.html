<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();

  radial-gradient(ellipse 22% 9% at 62% 30%, rgba(255, 216, 138, .45), transparent 70%),
  radial-gradient(ellipse 14% 8% at 48% 18%, rgba(242, 239, 250, .35), transparent 70%); }
.soleil-titre { position: absolute; right: 8%; top: 9%; width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, #fff3c4, var(--or) 45%, rgba(255, 216, 138, 0) 72%); box-shadow: 0 0 60px 20px rgba(255, 216, 138, .25); }
.soeur { position: absolute; border-radius: 50%; opacity: .9; }
.soeur.s1 { left: 10%; top: 16%; width: 26px; height: 26px; background: radial-gradient(circle at 35% 35%, #e8d7ff, #8a73c9 60%, #3a2f6b); }
.soeur.s2 { left: 24%; top: 30%; width: 14px; height: 14px; background: radial-gradient(circle at 35% 35%, #ffd9b8, #c98a5a 60%, #5a3a24); }
.titre-haut, .titre-centre, .titre-bas { position: relative; z-index: 1; }
.titre-haut { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.titre-centre { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 520px; }
.consigne { font-size: 17px; color: var(--craie); max-width: 36ch; }
.rang { color: var(--or); font-weight: 700; }
/* Bas de l'écran titre : texte craie sur un léger voile sombre (il est posé sur la planète turquoise) */
.titre-bas { width: 100%; display: flex; justify-content: space-between; align-items: center; color: var(--craie); font-size: 13px; text-shadow: 0 1px 3px rgba(7, 10, 20, .9); }
.titre-bas > * { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 999px; background: rgba(7, 10, 20, .45); }
.version { background: none; border: 0; color: var(--craie); font: inherit; font-weight: 700; min-width: 44px; min-height: 44px; padding: 0 8px; cursor: pointer; }
.embleme { position: relative; width: 72px; height: 72px; margin-bottom: 4px; }
.embleme-disque { position: absolute; inset: 18px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #9df0e6, var(--turquoise) 50%, #1b6e66); box-shadow: 0 0 24px rgba(90, 215, 200, .6); }
.embleme-anneau { position: absolute; inset: 4px; border-radius: 50%; border: 2px solid var(--or); opacity: 0; transform: rotateX(62deg); }
.embleme-anneau.allume { opacity: .9; }
.embleme-anneau.a2 { inset: -4px; }
.place-langue { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; }

/* --- Carte de campagne --- */
#ecran-campagne { padding: calc(8px + var(--sat)) 12px calc(10px + var(--sab)); gap: 8px; background:
  radial-gradient(circle at 80% 10%, rgba(196, 181, 253, .12), transparent 40%), var(--nuit); }
.campagne-haut { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; }
.campagne-haut .bt { flex-shrink: 0; }   /* « Hauptmenü » ne se coupe pas */
.campagne-haut h2 { flex: 1; font-size: 18px; text-align: center; min-width: 0; }
.total { color: var(--or); font-weight: 700; min-width: 64px; text-align: right; white-space: nowrap; }
/* Téléphone : « Hauptmenü … 5 / 24 Sterne » sur une ligne, le titre centré dessous (sinon le total sort de l'écran) */
@media (max-width: 599px) { .campagne-haut h2 { flex: 1 1 100%; order: 3; } .campagne-haut .total { flex: 1; } }
.campagne-capacites { display: flex; align-items: center; gap: 6px; }
/* Les 10 capacités sur une seule ligne dès 352 px : les actes gardent leur hauteur pour deux rangées d'étoiles */
#campagne-capacites { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; width: 100%; }
.cap-puce { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--orbite); color: var(--lilas); position: relative; }
.cap-puce .cap-ico { width: 16px; height: 16px; }
.cap-puce.ombre { opacity: .35; filter: grayscale(1); }
.campagne-aide { text-align: center; color: var(--craie-douce); font-size: 13px; }
.campagne-actes { flex: 1; display: grid; grid-template-rows: repeat(5, 1fr); gap: 4px; min-height: 0; }
.acte { position: relative; display: flex; flex-direction: column; min-height: 0; border-radius: 14px; background: rgba(26, 22, 56, .5); border: 1px solid rgba(90, 102, 136, .35); }
.acte.verrou { opacity: .55; }
/* Nom de l'acte sur sa propre ligne : il ne recouvre jamais la première étoile ni ses points */
.acte-nom { padding: 4px 10px 0; font-size: 13px; line-height: 1.2; color: var(--lilas); font-weight: 700; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.acte-nom .bientot { color: var(--craie-douce); font-weight: 500; }
.acte-ciel { position: relative; flex: 1; min-height: 72px; margin-bottom: 6px; }
.acte-ciel svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.acte-ciel svg path { fill: none; stroke: rgba(196, 181, 253, .35); stroke-width: 1.5; stroke-dasharray: 3 5; }
.etoile-mission { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.etoile-mission::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--orbite); box-shadow: 0 0 0 2px rgba(90, 102, 136, .4); transition: transform .2s ease; }
.etoile-mission.e1::before { background: #cfe9ff; box-shadow: 0 0 10px 2px rgba(207, 233, 255, .5); }
.etoile-mission.e2::before { background: #ffe9b0; box-shadow: 0 0 14px 3px rgba(255, 233, 176, .55); }
.etoile-mission.e3::before { background: var(--or); box-shadow: 0 0 18px 5px rgba(255, 216, 138, .65); }
/* Compteur d'étoiles au-dessus du disque : un, deux ou trois points dorés (teinte seule trop proche entre 2 et 3) */
.etoile-mission.e1::after, .etoile-mission.e2::after, .etoile-mission.e3::after { content: ""; position: absolute; top: 3px; left: 50%; transform: translateX(-50%); height: 6px; background: radial-gradient(circle, var(--or) 1.8px, transparent 2.4px) 0 0 / 6px 6px repeat-x; }
.etoile-mission.e1::after { width: 6px; }
.etoile-mission.e2::after { width: 12px; }
.etoile-mission.e3::after { width: 18px; }
/* Meilleur temps : à droite du disque (à gauche pour la dernière étoile de la rangée, au bord du ciel) */
.etoile-temps { position: absolute; margin-left: 14px; transform: translateY(-50%); font-size: 10px; color: var(--craie-douce); line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none; }
.etoile-temps.gauche { margin-left: -14px; transform: translate(-100%, -50%); }
.etoile-mission.encours::before { background: var(--lilas); box-shadow: 0 0 0 4px rgba(196, 181, 253, .35), 0 0 18px 6px rgba(196, 181, 253, .5); animation: pulser 1.4s ease-in-out infinite; }
.etoile-mission.verrou { cursor: default; }
.etoile-mission.verrou::before { width: 10px; height: 10px; opacity: .6; }
.etoile-mission.verrou::after { content: ""; position: absolute; width: 8px; height: 6px; border: 1.5px solid var(--craie-douce); border-top-left-radius: 4px; border-top-right-radius: 4px; border-bottom: 0; top: 10px; opacity: .7; }
.etoile-mission:focus-visible { outline: 3px solid var(--or); outline-offset: -4px; }
.etoile-mission:hover:not(.verrou)::before { transform: scale(1.25); }
.etoile-nombre { position: absolute; bottom: 0; font-size: 11px; color: var(--craie-douce); line-height: 1; }
.campagne-bas { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
@keyframes pulser { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }

/* --- HUD de jeu --- */
.hud-haut { position: absolute; left: 0; right: 0; top: 0; padding: calc(6px + var(--sat)) calc(8px + var(--sar)) 6px calc(8px + var(--sal)); display: flex; flex-direction: column; gap: 4px;
  background: linear-gradient(180deg, rgba(7, 10, 20, .85), rgba(7, 10, 20, 0)); pointer-events: none; }
.hud-objectif { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 14px; line-height: 1.25; }
.hud-mission { color: var(--lilas); font-weight: 700; white-space: nowrap; }
.hud-objectif-texte { flex: 1 1 200px; min-width: 0; }
.hud-avancement { font-weight: 700; color: var(--or); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hud-chiffres { display: flex; gap: 14px; align-items: center; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--craie-douce); }
.hud-territoires { color: var(--turquoise); font-weight: 700; }
.hud-chrono { margin-left: auto; font-weight: 700; color: var(--craie); }
.hud-chrono.depasse { color: var(--rouge); }
.hud-secondaire { display: inline-flex; align-items: center; gap: 4px; }
.etoile-mini { display: inline-block; width: 12px; height: 12px; background: var(--or); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.hud-secondaire.perdu .etoile-mini { background: var(--orbite); }
.hud-secondaire.perdu { text-decoration: line-through; }

/* Bandeau de mission : semi-transparent (les capitales du haut restent lisibles), 4 s, un toucher le ferme */
.bandeau { position: absolute; left: 12px; right: 12px; top: calc(74px + var(--sat)); padding: 10px 14px; border-radius: 14px; background: rgba(26, 22, 56, .74); border: 1px solid rgba(196, 181, 253, .8); box-shadow: var(--ombre);
  display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 15px; animation: glisser-haut .4s ease; text-shadow: 0 1px 2px rgba(7, 10, 20, .8); }
.bandeau strong { color: var(--lilas); }
.bandeau-secondaire { color: var(--or); font-size: 13px; }
.bandeau-secondaire::before { content: "★ "; }
.bandeau-vise { color: var(--or); font-size: 13px; opacity: .85; }
.bandeau-vise::before { content: "★★ "; }
.bandeau-nouveaute { flex-basis: 100%; color: var(--craie-douce); font-size: 13px; }
.bandeau.sortie { animation: fondu-sortie .5s ease forwards; }
@keyframes glisser-haut { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
@keyframes fondu-sortie { to { opacity: 0; transform: translateY(-8px); } }
.annonce { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); padding: 10px 18px; border-radius: 999px; background: rgba(26, 22, 56, .92); border: 1px solid var(--or); color: var(--or); font-weight: 700; animation: annonce .35s ease; pointer-events: none; text-align: center; max-width: 90vw; }
@keyframes annonce { from { opacity: 0; transform: translate(-50%, -50%) scale(.85); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

#menaces { position: absolute; inset: 0; pointer-events: none; }
.menace { position: absolute; width: 0; height: 0; border: 10px solid transparent; border-bottom: 18px solid var(--rouge); transform-origin: 50% 70%; filter: drop-shadow(0 0 6px rgba(255, 123, 123, .8)); animation: pulser .8s ease-in-out infinite; }

.hud-bas { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px calc(8px + var(--sar)) calc(8px + var(--sab)) calc(8px + var(--sal)); display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap;
  background: linear-gradient(0deg, rgba(7, 10, 20, .85), rgba(7, 10, 20, 0)); }
.pcts { display: flex; gap: 4px; }
.bt.pct { min-width: 46px; padding: 8px 6px; font-variant-numeric: tabular-nums; border-color: var(--orbite); }
.bt.pct.actif { background: var(--lilas); color: var(--nuit); border-color: var(--lilas); }
.capacites { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
.capacites:empty { display: none; }
/* Téléphone en portrait : les capacités (jusqu'à 4) sur leur propre ligne, au-dessus des pourcentages */
@media (max-width: 599px) and (orientation: portrait) {
  .capacites { flex: 1 0 100%; order: -1; justify-content: flex-end; }
}
.bt.cap { padding: 6px 10px; gap: 6px; border-color: var(--or); font-size: 13px; }
.bt.cap.passif, .bt.cap.passif[disabled] { border-color: var(--orbite); color: var(--craie-douce); opacity: .85; cursor: default; }
.bt.cap .cap-ico { width: 20px; height: 20px; }
.hud-outils { display: flex; gap: 6px; margin-left: auto; }

.horizon-bandeau { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); text-align: center; padding: 12px 22px; border-radius: 16px; background: rgba(26, 22, 56, .9); border: 1px solid var(--orbite); display: flex; flex-direction: column; gap: 4px; animation: annonce .4s ease; pointer-events: none; }
.horizon-bandeau strong { font-size: 20px; color: var(--craie-douce); }
.horizon-bandeau span { color: var(--craie-douce); font-size: 14px; }
/* Paysage et ordinateur : la planète de la silhouette est au centre de l'écran, l'étiquette monte au-dessus des orbites. */
@media (orientation: landscape) { .horizon-bandeau { top: 17%; } }

/* Tutoriel : main qui touche puis glisse */
.tuto { position: absolute; left: 12px; right: 12px; top: calc(84px + var(--sat)); padding: 12px 14px 14px; border-radius: 16px; background: rgba(26, 22, 56, .95); border: 1px solid var(--lilas); box-shadow: var(--ombre); display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; z-index: 20; }
.tuto-scene { position: relative; width: 180px; height: 84px; }
.tuto-hex { position: absolute; top: 22px; width: 44px; height: 40px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--turquoise); opacity: .9; }
.tuto-hex.a { left: 20px; }
.tuto-hex.b { left: 116px; background: var(--orbite); }
.tuto.glisser .tuto-hex.b { animation: hex-prendre 2.8s ease-in-out infinite; }
.tuto-main { position: absolute; left: 28px; top: 28px; animation: main-glisser 2.8s ease-in-out infinite; }
.tuto.toucher .tuto-main { animation: main-toucher 1.8s ease-in-out infinite; }
.tuto.appui .tuto-main { animation: main-appui 2.4s ease-in-out infinite; }
.tuto.regarder .tuto-main { display: none; }
.tuto.regarder .tuto-hex.a { animation: hex-produire 1.6s ease-in-out infinite; }
@keyframes main-glisser { 0% { transform: translate(0, 14px) scale(1); opacity: 0; } 12% { opacity: 1; transform: translate(0, 0) scale(.92); } 60% { transform: translate(96px, 0) scale(.92); opacity: 1; } 75% { transform: translate(96px, 12px) scale(1); opacity: 1; } 100% { transform: translate(96px, 12px) scale(1); opacity: 0; } }
@keyframes main-toucher { 0%, 100% { transform: translateY(14px) scale(1); opacity: .6; } 40%, 60% { transform: translateY(0) scale(.9); opacity: 1; } }
@keyframes main-appui { 0% { transform: translateY(14px); opacity: .6; } 20%, 80% { transform: translateY(0) scale(.9); opacity: 1; } 100% { transform: translateY(14px); opacity: .6; } }
@keyframes hex-prendre { 0%, 60% { background: var(--orbite); } 80%, 100% { background: var(--turquoise); } }
@keyframes hex-produire { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); filter: brightness(1.25); } }
.tuto-etape { color: var(--lilas); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
.tuto-texte { font-size: 15px; max-width: 42ch; }

/* --- Panneaux (pause, résultat) --- */
.panneau { width: min(420px, 100%); max-height: calc(100% - 16px); overflow: auto; padding: 20px 18px 16px; border-radius: 22px; background: var(--surface); border: 1px solid var(--orbite); box-shadow: var(--ombre); display: flex; flex-direction: column; gap: 10px; text-align: center; animation: annonce-panneau .3s ease; }
@keyframes annonce-panneau { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.panneau .bt { width: 100%; }
.ligne-bas { display: flex; gap: 10px; align-items: center; }
.ligne-bas .bt { flex: 1; }
.ligne-boutons { display: flex; flex-direction: column; gap: 8px; }
#vitesse-valeur { color: var(--or); font-variant-numeric: tabular-nums; }

.resultat h2 { font-size: 28px; }
.resultat.defaite h2 { color: var(--rouge); }
.resultat .temps { font-variant-numeric: tabular-nums; color: var(--craie-douce); }
.etoiles { display: flex; justify-content: center; gap: 10px; min-height: 48px; }
.etoile { width: 44px; height: 44px; background: var(--orbite); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); opacity: .4; transform: scale(.8); }
.etoile.gagnee { background: var(--or); opacity: 1; animation: etoile-pop .5s cubic-bezier(.3, 1.6, .5, 1) forwards; }
.etoile.gagnee:nth-child(2) { animation-delay: .5s; }
.etoile.gagnee:nth-child(3) { animation-delay: 1s; }
@keyframes etoile-pop { 0% { transform: scale(.3) rotate(-30deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; filter: drop-shadow(0 0 10px rgba(255, 216, 138, .8)); } }
.carte-capacite { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.carte3d { position: relative; width: 150px; height: 96px; perspective: 600px; }
.carte-face { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; }
.carte-face.dos { background: linear-gradient(135deg, var(--surface-claire), var(--nuit)); border: 1px solid var(--orbite); animation: carte-dos 1.2s ease 1.2s forwards; }
.carte-face.recto { background: linear-gradient(135deg, #3a2f6b, var(--surface)); border: 1px solid var(--or); color: var(--or); transform: rotateY(180deg); animation: carte-recto 1.2s ease 1.2s forwards; }
.carte-face.recto strong { color: var(--craie); font-size: 16px; }
.carte-face.recto span:not(.cap-ico) { color: var(--craie-douce); font-size: 11px; line-height: 1.2; }
.carte-face .cap-ico { width: 24px; height: 24px; }
@keyframes carte-dos { to { transform: rotateY(180deg); } }
@keyframes carte-recto { to { transform: rotateY(360deg); } }
.univers { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.barre-log { position: relative; width: 100%; height: 10px; border-radius: 999px; background: var(--nuit); border: 1px solid var(--orbite); overflow: visible; }
.barre-log .grad { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--orbite); }
.barre-log .grad:nth-child(1) { left: 20%; } .barre-log .grad:nth-child(2) { left: 40%; } .barre-log .grad:nth-child(3) { left: 60%; } .barre-log .grad:nth-child(4) { left: 80%; } .barre-log .grad:nth-child(5) { left: 100%; }
.barre-log .jauge { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--turquoise), var(--or)); transition: width 1.2s ease .6s; min-width: 3px; }
.part { font-variant-numeric: tabular-nums; color: var(--craie); font-weight: 700; }
.auto { color: var(--lilas); }

/* Dézoom */
#ecran-dezoom { align-items: center; justify-content: flex-end; padding: 16px 16px calc(24px + var(--sab)); gap: 14px; }
.dezoom-bandeau { text-align: center; padding: 14px 22px; border-radius: 18px; background: rgba(26, 22, 56, .88); border: 1px solid var(--or); animation: annonce-panneau .6s ease; display: flex; flex-direction: column; gap: 4px; max-width: 480px; }
.dezoom-bandeau h2 { color: var(--or); }
.bt.passer { border-color: var(--orbite); }

/* Mesures */
.mesures { position: fixed; left: 8px; bottom: calc(8px + var(--sab)); z-index: 50; padding: 10px 12px; border-radius: 12px; background: rgba(7, 10, 20, .92); border: 1px solid var(--orbite); font-size: 12px; font-variant-numeric: tabular-nums; max-width: 260px; }
.mesures h3 { font-size: 13px; margin-bottom: 6px; }
.mesures dl { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin: 0 0 8px; }
.mesures dd { margin: 0; color: var(--or); text-align: right; }
.mesures .bt { min-height: 44px; padding: 4px 12px; font-size: 12px; }

/* Paysage téléphone : la carte prend la largeur, les boutons à droite */
@media (orientation: landscape) and (max-height: 520px) {
  .hud-bas { left: auto; right: 0; top: 0; bottom: 0; width: auto; flex-direction: column; align-items: flex-end; justify-content: flex-end; background: linear-gradient(270deg, rgba(7, 10, 20, .85), rgba(7, 10, 20, 0)); padding-top: 60px; }
  .pcts { flex-direction: column; }
  .capacites { flex-direction: column; align-items: flex-end; flex: 0; }
  .hud-outils { margin-left: 0; flex-direction: column; }
  .hud-haut { right: 120px; }
  .tuto { left: 12px; right: 130px; top: 58px; }
  .bandeau { right: 130px; top: calc(56px + var(--sat)); }
  .annonce, .horizon-bandeau { left: calc(50% - 60px); }
  .campagne-actes { grid-template-rows: 1fr; grid-template-columns: repeat(5, 1fr); }
  .campagne-capacites { display: none; }
}
/* Grand écran */
@media (min-width: 900px) {
  .hud-objectif, .hud-chiffres { font-size: 16px; }
  .hud-haut { padding-left: 16px; padding-right: 16px; }
  .hud-bas { padding: 12px 16px; }
  .bt.cap { font-size: 15px; }
  .tuto { left: 50%; right: auto; transform: translateX(-50%); width: 440px; top: calc(76px + var(--sat)); }
  #ecran-campagne { padding: 16px 10vw; }
  .campagne-actes { gap: 8px; }
}
/* Mouvements réduits */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; }
  .etoile.gagnee { animation: none; transform: scale(1); }
  .carte-face.dos { display: none; }
  .carte-face.recto { transform: none; animation: none; }
  .tuto-main { animation: none; }
}
</style>
</head>
<body>
<!-- Poussière d'Empire — écrans HTML. Tout texte visible passe par data-i18n ; le script remplit le reste. -->
<canvas id="carte" data-i18n-aria="aria.carte"></canvas>

<!-- Écran titre -->

  <div class="titre-haut">

  </div>
  <div class="titre-centre">

    <p class="consigne" data-i18n="titre.consigne"></p>

<!-- Carte de campagne : 33 étoiles en 5 groupes -->
<section id="ecran-campagne" class="ecran" hidden>
  <header class="campagne-haut">
    <button type="button" id="bt-campagne-accueil" class="bt" data-i18n="bt.accueil"></button>

    <div id="campagne-capacites"></div>
  </div>
  <p class="campagne-aide" data-i18n="campagne.rejouer"></p>
  <div id="campagne-actes" class="campagne-actes"></div>
  <footer class="campagne-bas">
    <button type="button" id="bt-revoir" class="bt" data-i18n="bt.revoir" hidden></button>
    <button type="button" id="bt-campagne-jouer" class="bt principal" data-i18n="bt.jouer"></button>
  </footer>
</section>

<!-- Écran de jeu : HUD au-dessus du canvas -->
<section id="ecran-jeu" class="ecran transparent" hidden>
  <div id="hud-haut" class="hud-haut">
    <div class="hud-objectif">
      <span id="hud-mission" class="hud-mission"></span>
      <span id="hud-objectif-texte" class="hud-objectif-texte"></span>
      <span id="hud-avancement" class="hud-avancement"></span>
    </div>
    <div class="hud-chiffres">
      <span id="hud-secondaire" class="hud-secondaire" data-i18n-title="hud.secondaire"><span class="etoile-mini" aria-hidden="true"></span></span>
      <span id="hud-territoires" class="hud-territoires"></span>
      <span id="hud-chrono" class="hud-chrono" data-i18n-title="hud.chrono">0:00</span>
    </div>
  </div>
  <div id="bandeau" class="bandeau" hidden>
    <strong id="bandeau-titre"></strong>
    <span id="bandeau-objectif"></span>
    <span id="bandeau-secondaire" class="bandeau-secondaire"></span>
    <span id="bandeau-vise" class="bandeau-vise" hidden></span>
    <span id="bandeau-nouveaute" class="bandeau-nouveaute" hidden></span>
  </div>
  <div id="annonce" class="annonce" hidden></div>
  <div id="menaces" aria-hidden="true"></div>
  <div id="hud-bas" class="hud-bas">
    <div class="pcts" role="group" data-i18n-aria="hud.pct">
      <button type="button" class="bt pct" data-pct="25">25</button>
      <button type="button" class="bt pct actif" data-pct="50">50</button>
      <button type="button" class="bt pct" data-pct="75">75</button>
      <button type="button" class="bt pct" data-pct="100">100</button>
    </div>
    <div id="capacites" class="capacites"></div>
    <div class="hud-outils">
      <button type="button" id="bt-horizon" class="bt rond" data-i18n-title="bt.horizon" data-i18n-aria="bt.horizon"><span class="ico-horizon" aria-hidden="true"></span></button>

    <strong data-i18n="horizon.titre"></strong>
    <span data-i18n="horizon.verrou"></span>

  <!-- Tutoriel animé : une main qui touche puis glisse -->

      <span class="tuto-hex a"></span><span class="tuto-hex b"></span>
      <svg class="tuto-main" viewBox="0 0 64 80" width="56" height="70">
        <path d="M22 44 V18 a6 6 0 0 1 12 0 v18 l2-10 a5 5 0 0 1 10 0 l-1 12 2-8 a5 5 0 0 1 10 1 l-2 10 2-5 a4 4 0 0 1 8 1 l-6 26 c-3 9-9 12-18 12 c-9 0-14-3-18-10 L12 50 a5 5 0 0 1 8-6 Z" fill="#f2effa" stroke="#1a1638" stroke-width="2"/>
      </svg>
    </div>

<!-- Pause -->

</div>
<script id="pe-outils">
/* ==========================================================================
   Poussière d'Empire — pe-outils : outils entiers du moteur temps réel
   Recopie mot pour mot de public/temps-reel/moteur.js (jel-tr v2, lignes 66 et
   84 à 251 : copie, tirer, aleaDe, racineEntiere, div, SINUS, sinus, cosinus,
   hacher, premierFlottant, ordreBienForme, trierOrdres). Ne rien modifier ici :
   à la bascule multijoueur, window.JEL_TR prend la place sans rien changer
   (const TR = window.JEL_TR || window.PE_OUTILS dans les autres blocs).
   ========================================================================== */
(function (racine) {
  'use strict';
  var ORDRE_MAX = 200;               // nombres d'un ordre, au plus (type compris : unités choisies d'un jeu de stratégie)


  function copie(x) { return x === undefined ? undefined : JSON.parse(JSON.stringify(x)); }

  // Hasard gardé dans l'état (mulberry32 sur etat.a) : renvoie un entier 32 bits non signé.
  function tirer(etat) {
    var a = ((etat.a >>> 0) + 0x6D2B79F5) >>> 0;
    etat.a = a;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return (t ^ (t >>> 14)) >>> 0;
  }

  // alea(n) : entier de 0 à n − 1 (n ≥ 1), tiré du hasard de l'état.
  function aleaDe(etat) {
    return function (n) { n = n | 0; return n > 1 ? tirer(etat) % n : 0; };
  }

  // Racine carrée entière (Newton), sans Math.sqrt : même résultat partout.
  function racineEntiere(n) {
    if (!(n > 0)) return 0;
    var x = n, y = Math.floor((x + 1) / 2);
    while (y < x) { x = y; y = Math.floor((x + Math.floor(n / x)) / 2); }
    return x;
  }

  // Division entière tronquée (vers zéro).
  function div(a, b) { return b ? Math.trunc(a / b) : 0; }

  // Sinus et cosinus entiers : table de 64 directions, valeurs × 1024 (calculées une fois,
  // écrites en dur : aucune fonction trigonométrique, dont le résultat varie d'un moteur à l'autre).
  var SINUS = [0, 100, 200, 297, 392, 483, 569, 650, 724, 792, 851, 903, 946, 980, 1004, 1019, 1024,
    1019, 1004, 980, 946, 903, 851, 792, 724, 650, 569, 483, 392, 297, 200, 100, 0,
    -100, -200, -297, -392, -483, -569, -650, -724, -792, -851, -903, -946, -980, -1004, -1019, -1024,
    -1019, -1004, -980, -946, -903, -851, -792, -724, -650, -569, -483, -392, -297, -200, -100];
  function sinus(i) { return SINUS[((i % 64) + 64) % 64]; }
  function cosinus(i) { return SINUS[(((i + 16) % 64) + 64) % 64]; }

  // --- Hachage et contrôle de l'état ----------------------------------------

  // Empreinte d'un état (deux hachages FNV-1a de 32 bits). Les clés des objets sont
  // parcourues triées : le résultat ne dépend jamais de l'ordre d'insertion.
  var VUE = typeof DataView === 'function' ? new DataView(new ArrayBuffer(8)) : null;
  function hacher(x) {
    var h1 = 0x811c9dc5 | 0, h2 = 0x050c5d1f | 0;
    function melanger(v) {
      v = v | 0;
      for (var i = 0; i < 4; i++) {
        var o = (v >>> (i * 8)) & 0xff;
        h1 = Math.imul(h1 ^ o, 16777619);
        h2 = Math.imul(h2 ^ o, 0x01000193) ^ (h2 >>> 15);
      }
    }
    function parcourir(y) {
      if (y === null || y === undefined) { melanger(1); return; }
      if (typeof y === 'function') { melanger(8); return; }
      if (typeof y === 'boolean') { melanger(y ? 2 : 3); return; }
      if (typeof y === 'number') {
        melanger(4);
        if (Number.isInteger(y)) { melanger(y % 4294967296); melanger(Math.floor(y / 4294967296)); }
        else if (y !== y || !VUE) { melanger(0x7fc00000); }
        // nombre à virgule : ses 64 bits exacts (« + 0 » : −0 et 0 donnent la même empreinte)
        else { VUE.setFloat64(0, y + 0); melanger(VUE.getUint32(0)); melanger(VUE.getUint32(4)); }
        return;
      }
      if (typeof y === 'string') { melanger(5); melanger(y.length); for (var c = 0; c < y.length; c++) melanger(y.charCodeAt(c)); return; }
      if (Array.isArray(y)) { melanger(6); melanger(y.length); for (var i = 0; i < y.length; i++) parcourir(y[i]); return; }
      var cles = Object.keys(y).filter(function (c) { return y[c] !== undefined; }).sort();
      melanger(7); melanger(cles.length);
      for (var j = 0; j < cles.length; j++) { parcourir(cles[j]); parcourir(y[cles[j]]); }
    }
    parcourir(x);
    return ('0000000' + (h1 >>> 0).toString(16)).slice(-8) + ('0000000' + (h2 >>> 0).toString(16)).slice(-8);
  }

  // Chemin du premier nombre non entier (ou non fini) de l'état, ou null. Sert aux tests.
  function premierFlottant(x, chemin) {
    chemin = chemin || 'etat';
    if (typeof x === 'number') return Number.isInteger(x) && Math.abs(x) <= 9007199254740991 ? null : chemin + ' = ' + x;
    if (!x || typeof x !== 'object') return null;
    if (Array.isArray(x)) {
      for (var i = 0; i < x.length; i++) { var p = premierFlottant(x[i], chemin + '[' + i + ']'); if (p) return p; }
      return null;
    }

  // Un ordre de joueur bien formé : [type ≥ 1, a, b, …] (entiers, ORDRE_MAX au plus).
  function ordreBienForme(o) {
    if (!Array.isArray(o) || o.length < 1 || o.length > ORDRE_MAX) return false;

  }

  // ne gêne pas : les contrôles sont joués à part, avant).
  function trierOrdres(liste) {
    return liste.slice().sort(function (x, y) { return x[0] - y[0] || x[1] - y[1]; });
