     bon moment (les ordres d'un tick émettent des événements AVANT pas()).
   - m.lv (parallèle à m.vois : L0 de chaque arête), m.dmoy (distance moyenne
     des arêtes, pour le Pont stellaire) et m.mir (miroir de la carte « ligne »)
     ajoutés à la carte générée.
   - Robots (cadrage section 8, précisé après mesure) : les niveaux 2 et 3
     attaquent en groupe (toutes les sources voisines d'une cible réunies :
     PE_DONNEES.robots[n].groupe), engagent tout ce qu'ils ont de disponible
     contre un nœud ennemi (robots[n].tout : à 1,1 ou 1,3 fois la défense, le
     plus petit pourcentage qui suffit laisse 1 à 3 forces, reprises aussitôt),
     se concentrent par Rallier quand aucune attaque n'est possible, ne rallient
     en défense que la capitale ou un nœud à tenir, font couler la logistique de
     proche en proche vers le front, gardent le double de garnison sur la
     capitale ; le robot assis à la place du joueur tient compte de l'objectif
     affiché (nœuds à prendre, à tenir, rivaux hors objectif).
   - Carte « ligne » : les deux camps reçoivent PE_DONNEES.ligne.tech (7 :
     Rallier, Fortin, Transfert), sinon les niveaux ne se distingueraient pas.
   - Mission 5 « Le siège » (17 novembre 2026) : un camp d'une fiche peut porter
     sa propre personnalité (camps[c].perso) ; perso.cibles 3 = n'attaque qu'en
     offensive, perso.offensive.cible 1 = offensive dirigée vers la capitale du
     joueur (tête de pont, vague à 100 %, voir offensiveDirigee) ; sélecteur
     d'objectif 'cratereProche' ; 2e étoile des objectifs à durée fixe (5, 6, 8)
     = finir avec au moins terr régions ; le robot qui tient sa capitale rallie
     dès l'annonce d'une offensive (même information que le bandeau ev 8) et ne
     dégarnit jamais la capitale à tenir (défense, concentration).
   ========================================================================== */
(function (racine) {
  'use strict';
  const TR = racine.JEL_TR || racine.PE_OUTILS;
  const D = racine.PE_DONNEES;
  const div = TR.div, racineEntiere = TR.racineEntiere, copie = TR.copie;

  // ---- Constantes de structure (pas d'équilibrage : tout est dans PE_DONNEES) --
  const NMAX = 512;                    // nœuds au plus (scratch) ; acte 4 : 120
  const B_RALLIER = 1, B_FORTIN = 2, B_TRANSFERT = 4, B_ARRIERE = 8, B_RELAIS = 16,
    B_CHANTIER = 32, B_FRAPPE = 64, B_PONT = 128, B_ESSAIMAGE = 256, B_SURSAUT = 512;
  const PCTS = [25, 50, 75, 100];
  const TRANSFERT_MAX = 3;             // arêtes au plus d'un Transfert (cadrage section 7)
  const VIDE = [];                     // liste d'ordres vide (jamais modifiée)
  // Grille hexagonale axiale, sommets en haut (pointe en haut) : rayon 256 unités,
  // colonnes espacées de 444 (≈ 256 × √3), rangées de 384 (= 1,5 × 256).
  const HEX_R = 256, HEX_DX = 444, HEX_DX2 = 222, HEX_DY = 384, CENTRE = 2048, CELLULE = 444;
  const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];

  // Capacités par identifiant et par type de bâtiment.
  const CAP = {};
  D.capacites.forEach(function (c) { CAP[c.id] = c; });
  const BATIMENTS = [null, CAP.fortin, CAP.relais, CAP.chantier];   // b : 1 fortin, 2 relais, 3 chantier

  // Scratch (réutilisé : aucune allocation dans pas() ni bot()).
  const VIS = new Int32Array(NMAX);    // marque de visite (tampon)
  const PREV = new Int32Array(NMAX);   // prédécesseur (chemins)
  const FILE = new Int32Array(NMAX);   // file des parcours en largeur
  const MEN = new Int32Array(NMAX);    // menace par nœud (robots)
  const FRONT = new Int32Array(NMAX);  // voisins non possédés par nœud (robots)
  const PRES = new Int32Array(NMAX);   // forces ennemies adjacentes par nœud (robots)
  const VOL = new Int32Array(NMAX);    // mes forces en vol vers chaque nœud (robots)
  const DISPO = new Int32Array(NMAX);  // forces disponibles de chaque source (robots)
  const SCORE = new Int32Array(NMAX);  // score V / C de chaque cible (0 : pas une cible, ou déjà traitée)
  const VAL = new Int32Array(NMAX);    // valeur V de chaque cible
  const LMIN = new Int32Array(NMAX);   // route la plus courte d'une de mes sources vers la cible
  const SRC = new Int32Array(24);      // sources réunies autour d'une cible (attaque groupée)
  const SRCD = new Int32Array(24);     // forces disponibles de chaque source réunie
  const DIST = new Int32Array(NMAX);   // distance au front par mes territoires (logistique)
  const CIB = new Int32Array(NMAX);    // cibles de mission du camp du joueur : 1 à prendre, 2 à tenir
  const DCAP = new Int32Array(NMAX);   // distances à la capitale du joueur (secondaire, offensive dirigée)
  const DCIB = new Int32Array(NMAX);   // distances à la cible d'une offensive dirigée
  const CNT = new Int32Array(16);      // territoires par camp
  const FOR = new Int32Array(16);      // forces par camp
  const VIF = new Int32Array(16);      // camp vivant (territoire, flotte ou siège)
  let tampon = 1;

  // ---- Lecture de la carte et des types -------------------------------------
  // Tables par acte (prod, def, cap, vit par index de type) : aucune recherche de chaîne dans pas() ni bot().
  const TABLES = [];
  function tables(acte) {
    if (!TABLES[acte]) {
      const e = D.echelles[acte], t = { prod: [], def: [], cap: [], vit: [] };
      for (let x = 0; x < e.liste.length; x++) { const ty = e.types[e.liste[x]]; t.prod.push(ty.prod); t.def.push(ty.def); t.cap.push(ty.cap); t.vit.push(ty.vit); }
      TABLES[acte] = t;
    }
    return TABLES[acte];
  }
  function indexType(acte, id) { return D.echelles[acte].liste.indexOf(id); }

  // L0 de l'arête i → j (j voisin de i), ou 0.
  function longueur(m, i, j) {
    const v = m.vois[i];
    for (let x = 0; x < v.length; x++) if (v[x] === j) return m.lv[i][x];
    return 0;
  }
  function voisins(m, i, j) { return longueur(m, i, j) > 0; }

  // Défense effective d'un nœud en % (type + fortin ; 0 pendant une Frappe).
  function defense(etat, i) {
    if (etat.aff[i] > 0) return 0;
    return tables(etat.ac).def[etat.m.t[i]] + (etat.b[i] === 1 ? CAP.fortin.bonus : 0);
  }

  // Un tick de siège : A assaillant contre f défenseur (def en %). Renvoie [f, A].
  // Formule du cadrage (section 4), les deux pertes calculées sur les valeurs du
  // début du tick : à forces égales en plaine, le défenseur tient (15 ticks, 40 %).
  function tickSiege(A, f, def) {
    const Dd = div(f * (100 + def), 100);
    const perteF = Math.max(1, div(A * 10, 100 + def));
    const perteA = Math.max(1, div(Dd * 12, 100));
    return [f - perteF, A - perteA];
  }

  // Prévision d'un siège complet (aide pure) : { prise, ticks, reste }.
  function prevision(A, f, def) {
    let ticks = 0;
    while (ticks < 100000) {
      const r = tickSiege(A, f, def);
      f = r[0]; A = r[1]; ticks++;
      if (f <= 0) return { prise: 1, ticks: ticks, reste: Math.max(1, A) };
      if (A <= 0) return { prise: 0, ticks: ticks, reste: f };
    }
    return { prise: 0, ticks: ticks, reste: f };
  }

  // ---- Générateur de cartes (acte 1 : hexagones ; carte « ligne ») -----------
  // carte : { forme, rayon, mers, montagnes, crateres, calottes, camps, balise, ligne }
  // (carteDe(mi) construit cet objet depuis la fiche). Tout est tiré d'un hasard
  // propre à la graine ; positions entières ; graphe connexe et, tant que le quota
  // de mers le permet, sans case d'articulation (pas de passage d'une seule case) ;
  // capitales à ≥ 3 arêtes l'une de l'autre ; capitale du joueur en bas, rivaux le
  // plus loin possible du joueur (au nord), calottes et balise au nord.
  function distHex(q1, r1, q2, r2) {
    const dq = q1 - q2, dr = r1 - r2, ds = dq + dr;
    return Math.max(Math.abs(dq), Math.abs(dr), Math.abs(ds));
  }

  function generer(graine, carte, acte) {
    const e = { a: (graine >>> 0) ^ 0x5bd1e995 };
    const alea = TR.aleaDe(e);
    const R = carte.rayon | 0, L = 2 * R + 1;
    const nCamps = Math.max(1, carte.camps | 0);
    const ligne = carte.ligne === 1;
    const liste = D.echelles[acte].liste;
    const V = D.vitesse.V[acte];

    // 1. Cellules (q, r) triées par rangée puis colonne : l'index croît du nord au sud.
    const cq = [], cr = [], idx = new Int32Array(L * L).fill(-1);
    for (let r = -R; r <= R; r++) {
      for (let q = Math.max(-R, -r - R); q <= Math.min(R, -r + R); q++) {
        idx[(q + R) * L + (r + R)] = cq.length;
        cq.push(q); cr.push(r);
      }
    }
    const n0 = cq.length;
    const present = new Uint8Array(n0).fill(1);
    const indexDe = function (q, r) { return distHex(q, r, 0, 0) > R ? -1 : idx[(q + R) * L + (r + R)]; };
    const miroir = function (i) { return indexDe(-cq[i], -cr[i]); };
    const voisinsDe = function (i, sortie) {
      let k = 0;
      for (let d = 0; d < 6; d++) {
        const j = indexDe(cq[i] + DIRS[d][0], cr[i] + DIRS[d][1]);
        if (j >= 0 && present[j]) sortie[k++] = j;
      }
      return k;
    };
    const tmp6 = new Int32Array(6);

    // 2. Repères : capitale du joueur en bas (rangée r = R), balise au nord.
    const caps = [indexDe(div(-R, 2), R)];
    let balise = -1;
    if (carte.balise === 1 && !ligne) balise = indexDe(div(R, 2), -R);
    if (ligne) {
      caps.push(miroir(caps[0]));
    } else {
      // Rivaux : le plus loin possible du joueur (au nord, vers le haut de l'écran), à 3 cases au moins
      // des autres repères (rivaux déjà posés, balise) ; égalités tirées. Un rival posé « au plus loin de
      // tout » se retrouvait sur le flanc du joueur et lui disputait ses premiers neutres pendant que
      // l'autre s'étendait seul : le joueur perdait la course d'expansion une partie sur deux (mission 8).
      for (let c = 1; c < nCamps; c++) {
        let meilleur = -1, best = -1, egaux = 0;
        for (let i = 0; i < n0; i++) {
          if (caps.indexOf(i) >= 0 || i === balise) continue;
          let dmin = 1000;
          for (let x = 1; x < caps.length; x++) dmin = Math.min(dmin, distHex(cq[i], cr[i], cq[caps[x]], cr[caps[x]]));
          if (balise >= 0) dmin = Math.min(dmin, distHex(cq[i], cr[i], cq[balise], cr[balise]));
          if (dmin < 3) continue;
          const d0 = distHex(cq[i], cr[i], cq[caps[0]], cr[caps[0]]);
          if (d0 > best) { best = d0; meilleur = i; egaux = 1; }
          else if (d0 === best) { egaux++; if (alea(egaux) === 0) meilleur = i; }
        }
        if (meilleur < 0) {
          // Carte trop petite pour l'écart de 3 : la cellule la plus loin de tous les repères.
          for (let i = 0; i < n0; i++) {
            if (caps.indexOf(i) >= 0 || i === balise) continue;
            let dmin = 1000;
            for (let x = 0; x < caps.length; x++) dmin = Math.min(dmin, distHex(cq[i], cr[i], cq[caps[x]], cr[caps[x]]));
            if (balise >= 0) dmin = Math.min(dmin, distHex(cq[i], cr[i], cq[balise], cr[balise]));
            if (dmin > best) { best = dmin; meilleur = i; egaux = 1; }
            else if (dmin === best) { egaux++; if (alea(egaux) === 0) meilleur = i; }
          }
        }
        caps.push(meilleur);
      }
    }
    const fixe = function (i) { return caps.indexOf(i) >= 0 || i === balise; };

    // Connexité des cellules présentes, et chaque repère garde ≥ 2 voisins.
    const connexe = function () {
      tampon++;
      let tete = 0, queue = 0, total = 0;
      for (let i = 0; i < n0; i++) if (present[i]) total++;
      FILE[queue++] = caps[0]; VIS[caps[0]] = tampon;
      let vus = 1;
      while (tete < queue) {
        const i = FILE[tete++];
        const k = voisinsDe(i, tmp6);
        for (let x = 0; x < k; x++) { const j = tmp6[x]; if (VIS[j] !== tampon) { VIS[j] = tampon; vus++; FILE[queue++] = j; } }
      }
      if (vus !== total) return false;
      for (let x = 0; x < caps.length; x++) if (voisinsDe(caps[x], tmp6) < 2) return false;
      if (balise >= 0 && voisinsDe(balise, tmp6) < 1) return false;
      return true;
    };

    // Aucune case d'articulation (une case dont la perte couperait la carte en deux) : un passage d'une
    // seule case entre deux camps enlise la partie, chacun y entasse une pile que l'autre ne peut plus
    // prendre (mission 8 : 6 parties sur 20 figées jusqu'à tmax derrière une montagne fortifiée).
    // Parcours en profondeur (Tarjan) sur les cellules présentes, depuis la capitale du joueur.
    const disc = new Int32Array(n0), low = new Int32Array(n0);
    let horloge = 0, articule = false;
    const parcours = function (u, pere) {
      horloge++; disc[u] = horloge; low[u] = horloge;
      let enfants = 0;
      for (let d = 0; d < 6 && !articule; d++) {
        const v = indexDe(cq[u] + DIRS[d][0], cr[u] + DIRS[d][1]);
        if (v < 0 || !present[v]) continue;
        if (disc[v] === 0) {
          enfants++;
          parcours(v, u);
          if (low[v] < low[u]) low[u] = low[v];
          if ((pere >= 0 && low[v] >= disc[u]) || (pere < 0 && enfants > 1)) articule = true;
        } else if (v !== pere && disc[v] < low[u]) low[u] = disc[v];
      }
    };
    const sansGoulot = function () {
      for (let i = 0; i < n0; i++) disc[i] = 0;
      horloge = 0; articule = false;
      parcours(caps[0], -1);
      return !articule;
    };

    // 3. Mers : cellules retirées une à une (par paires symétriques pour la « ligne »),
    //    jamais un repère, jamais une cellule qui déconnecte (tirage répété). Phase 0 : la carte reste
    //    aussi sans case d'articulation ; phase 1 (si le quota n'est pas atteint ainsi) : connexe seulement.
    let aRetirer = carte.mers | 0;
    const refus = new Uint8Array(n0);
    for (let phase = 0; phase < 2 && aRetirer > 0; phase++) {
      refus.fill(0);
      let essais = 0;
      while (aRetirer > 0 && essais < 400) {
        essais++;
        let nCand = 0;
        for (let i = 0; i < n0; i++) if (present[i] && !fixe(i) && !refus[i] && (!ligne || miroir(i) > i || (miroir(i) === i && aRetirer % 2 === 1))) nCand++;
        if (nCand === 0) break;
        let choix = alea(nCand), cible = -1;
        for (let i = 0; i < n0; i++) if (present[i] && !fixe(i) && !refus[i] && (!ligne || miroir(i) > i || (miroir(i) === i && aRetirer % 2 === 1))) { if (choix === 0) { cible = i; break; } choix--; }
        const paire = ligne ? miroir(cible) : cible;
        if (ligne && paire !== cible && aRetirer < 2) { refus[cible] = 1; continue; }
        present[cible] = 0; present[paire] = 0;
        if (connexe() && (phase === 1 || sansGoulot())) { aRetirer -= (paire === cible ? 1 : 2); }
        else { present[cible] = 1; present[paire] = 1; refus[cible] = 1; }
      }
    }

    // 4. Renumérotation des cellules présentes.
    const nouv = new Int32Array(n0).fill(-1);
    const m = { n: 0, x: [], y: [], t: [], vois: [], lv: [], ar: [], R: HEX_R, forme: 1, cap: [], balise: -1, cellule: CELLULE, bbox: [0, 0, 0, 0], dmoy: 0 };
    for (let i = 0; i < n0; i++) {
      if (!present[i]) continue;
      nouv[i] = m.n++;
      m.x.push(CENTRE + HEX_DX * cq[i] + HEX_DX2 * cr[i]);
      m.y.push(CENTRE + HEX_DY * cr[i]);
      m.t.push(0);
      m.vois.push([]); m.lv.push([]);
    }
    const n = m.n;
    for (let c = 0; c < caps.length; c++) m.cap.push(nouv[caps[c]]);
    if (balise >= 0) m.balise = nouv[balise];
    const mir = new Int32Array(n);
    for (let i = 0; i < n0; i++) if (present[i]) mir[nouv[i]] = ligne ? nouv[miroir(i)] : nouv[i];

    // 5. Arêtes (a < b) : L0 = max(5, min(40, dist × 10 / V)) ; voisins triés croissants.
    let sommeDist = 0;
    for (let i = 0; i < n0; i++) {
      if (!present[i]) continue;
      const k = voisinsDe(i, tmp6);
      for (let x = 0; x < k; x++) {
        const j = tmp6[x];
        if (j <= i) continue;
        const a = nouv[i], b = nouv[j];
        const dx = m.x[a] - m.x[b], dy = m.y[a] - m.y[b];
        const dist = racineEntiere(dx * dx + dy * dy);
        sommeDist += dist;
        m.ar.push([a, b, Math.max(5, Math.min(40, div(dist * 10, V)))]);
      }
    }
    for (let x = 0; x < m.ar.length; x++) ajouterArete(m, m.ar[x][0], m.ar[x][1], m.ar[x][2], true);
    m.dmoy = m.ar.length ? div(sommeDist, m.ar.length) : CELLULE;

    // 6. Types : capitales, calottes au nord, montagnes en chaîne, cratères (loin des capitales).
    const tCap = liste.length - 1;
    const tMont = liste.indexOf('montagne'), tCrat = liste.indexOf('cratere'), tCal = liste.indexOf('calotte');
    const pris = new Uint8Array(n);
    for (let c = 0; c < m.cap.length; c++) { m.t[m.cap[c]] = tCap; pris[m.cap[c]] = 1; }
    if (m.balise >= 0) pris[m.balise] = 1;
    const poser = function (i, type) { m.t[i] = type; pris[i] = 1; if (ligne) { m.t[mir[i]] = type; pris[mir[i]] = 1; } };
    const libre = function (i) { return !pris[i] && (!ligne || !pris[mir[i]]); };
    const tirerLibre = function (filtre) {
      let nb = 0;
      for (let i = 0; i < n; i++) if (libre(i) && (!filtre || filtre(i))) nb++;
      if (!nb) return -1;
      let choix = alea(nb);
      for (let i = 0; i < n; i++) if (libre(i) && (!filtre || filtre(i))) { if (choix === 0) return i; choix--; }
      return -1;
    };
    // Calottes : rangées du nord, la dernière rangée entamée tirée au hasard.
    if (tCal >= 0 && !ligne) {
      let reste = carte.calottes | 0;
      for (let y = m.y[0]; reste > 0 && y <= m.y[n - 1]; y += HEX_DY) {
        const rangee = [];
        for (let i = 0; i < n; i++) if (m.y[i] === y && libre(i)) rangee.push(i);
        while (reste > 0 && rangee.length) {
          const x = alea(rangee.length);
          poser(rangee[x], tCal); reste--;
          rangee.splice(x, 1);
        }
      }
    }
    // Montagnes en chaîne : on prolonge depuis la dernière posée, sinon nouveau départ.
    if (tMont >= 0) {
      let reste = carte.montagnes | 0, dernier = -1;
      while (reste > 0) {
        let i = -1;
        if (dernier >= 0 && !ligne) {
          const v = m.vois[dernier], cand = [];
          for (let x = 0; x < v.length; x++) if (libre(v[x])) cand.push(v[x]);
          if (cand.length) i = cand[alea(cand.length)];
        }
        if (i < 0) i = tirerLibre(null);
        if (i < 0) break;
        poser(i, tMont); dernier = i; reste -= (ligne && mir[i] !== i) ? 2 : 1;
      }
    }
    // Cratères : loin des capitales si possible.
    if (tCrat >= 0) {
      let reste = carte.crateres | 0;
      const loin = function (i) { for (let c = 0; c < m.cap.length; c++) if (voisins(m, i, m.cap[c])) return false; return true; };
      while (reste > 0) {
        let i = tirerLibre(loin);
        if (i < 0) i = tirerLibre(null);
        if (i < 0) break;
        poser(i, tCrat); reste -= (ligne && mir[i] !== i) ? 2 : 1;
      }
    }

    // 7. Rectangle englobant.
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i < n; i++) { x0 = Math.min(x0, m.x[i]); y0 = Math.min(y0, m.y[i]); x1 = Math.max(x1, m.x[i]); y1 = Math.max(y1, m.y[i]); }
    m.bbox = [x0 - HEX_R, y0 - HEX_R, x1 + HEX_R, y1 + HEX_R];
    m.mir = Array.from(mir);
    return m;
  }

  // Ajoute l'arête a—b (L0) aux listes de voisins (triées croissantes). ar déjà posée si dansAr.
  function ajouterArete(m, a, b, L0, dansAr) {
    if (voisins(m, a, b)) return;
    if (!dansAr) m.ar.push([Math.min(a, b), Math.max(a, b), L0]);
    inserer(m, a, b, L0); inserer(m, b, a, L0);
  }
  function inserer(m, a, b, L0) {
    const v = m.vois[a], l = m.lv[a];
    let x = 0;
    while (x < v.length && v[x] < b) x++;
    v.splice(x, 0, b); l.splice(x, 0, L0);
  }

  // Carte d'une mission (mi ≥ 1) ou de la « ligne » (mi = 0) : fiche + camps + balise.
  function carteDe(mi) {
    if (mi === 0) {
      const l = D.ligne;
      return { forme: l.carte.forme, rayon: l.carte.rayon, mers: l.carte.mers, montagnes: l.carte.montagnes,
        crateres: l.carte.crateres, calottes: l.carte.calottes, camps: 2, balise: 0, ligne: 1 };
    }
    const f = D.missions[mi - 1];
    if (!f || f.verrou) return null;
    return { forme: f.carte.forme, rayon: f.carte.rayon, mers: f.carte.mers, montagnes: f.carte.montagnes,
      crateres: f.carte.crateres, calottes: f.carte.calottes, camps: f.camps.length, balise: f.balise | 0, ligne: 0 };
  }

  // ---- Configuration d'une mission (aide pure pour pe-jeu et les tests) --------
  function configMission(m, o) {
    o = o || {};
    const fiche = D.missions[m - 1];
    if (!fiche || fiche.verrou) return null;
    const ctl = fiche.camps.map(function (c) { return c.ctl; });
    while (ctl.length < 2) ctl.push(0);
    if (Array.isArray(o.ctl)) for (let c = 0; c < ctl.length; c++) if (Number.isInteger(o.ctl[c]) && o.ctl[c] >= 0 && o.ctl[c] <= 3) ctl[c] = o.ctl[c];
    const graine = fiche.graine || ((o.graine >>> 0) || 1);
    const vent = Math.max(0, Math.min(30, o.vent | 0));
    return { mission: m, graine: graine, vent: vent, ctl: ctl, camps: ctl.length };
  }

  // ---- État de départ ------------------------------------------------------------
  function depart(graine, config) {
    config = config || {};
    graine = graine >>> 0;
    const ligne = !config.mission;
    const mi = ligne ? 0 : config.mission | 0;
    const fiche = ligne ? null : D.missions[mi - 1];
    const acte = ligne ? 1 : fiche.acte;
    const m = generer(graine, carteDe(mi), acte);
    const n = m.n;
    const tirage = { a: graine ^ 0x9e3779b9 };    // hasard des forces de départ (l'état repart de la graine)
    const alea = TR.aleaDe(tirage);
    const neutres = ligne ? D.ligne.neutres : fiche.neutres;
    const nCamps = Math.max(2, Number.isInteger(config.camps) ? config.camps : (ligne ? 2 : fiche.camps.length));
    const vent = ligne ? 0 : Math.max(0, Math.min(30, config.vent | 0));

    const etat = {
      a: graine, k: 0, ctl: [], mi: mi, g: graine, ve: vent, ac: acte, nn: n,
      p: [], f: [], acc: [], b: [], aff: [], fer: [], ang: [], rav: [],
      fl: [], nf: 1, sg: [], pont: [], c: [], eq: [],
      o: { t: 0, n: 0, x: 0, d: 0, ok: 1, l: [] }, s2: { t: 0, n: 0, x: 0, ok: 1, l: [] },
      tv: 0, tmax: 0, st: { perdus: 0, capIntacte: 1, maxT: 0, pris: 0 }, ev: [], ne: 0, m: m,
    };
    for (let i = 0; i < n; i++) {
      etat.p.push(-1); etat.f.push(neutres[0] + alea(neutres[1] - neutres[0] + 1));
      etat.acc.push(0); etat.b.push(0); etat.aff.push(0); etat.fer.push(0); etat.ang.push(0); etat.rav.push(1);
    }
    for (let c = 0; c < nCamps; c++) {
      etat.ctl.push(Array.isArray(config.ctl) && Number.isInteger(config.ctl[c]) ? config.ctl[c] : 0);
      etat.eq.push(c);
      const fc = ligne ? { fa: c === 0 ? 0 : 1, forces: D.ligne.forces, terr: D.ligne.terr } : fiche.camps[c];
      const tech = ligne ? (D.ligne.tech | 0) : (c === 0 ? fiche.tech : fiche.techRobots);
      etat.c.push({ fa: fc ? fc.fa : c, t: tech, r: [0, 0, 0], s: 0, v: fc ? 1 : 0, cap: fc ? m.cap[c] : -1, es: 0, mem: [0, 0, 0, 0] });
      if (!fc) continue;
      // Territoires de départ : la capitale, puis les plus proches (ordre des anneaux, égalités tirées).
      const cap = m.cap[c];
      etat.p[cap] = c; etat.f[cap] = fc.forces;
      let reste = (fc.terr | 0) - 1;
      tampon++; VIS[cap] = tampon;
      let tete = 0, queue = 0; FILE[queue++] = cap;
      while (reste > 0 && tete < queue) {
        const debut = tete, fin = queue;                 // anneau courant
        const cand = [];
        for (let x = debut; x < fin; x++) {
          const v = m.vois[FILE[x]];
          for (let y = 0; y < v.length; y++) { const j = v[y]; if (VIS[j] !== tampon) { VIS[j] = tampon; FILE[queue++] = j; if (etat.p[j] < 0 && m.cap.indexOf(j) < 0) cand.push(j); } }
        }
        tete = fin;
        while (reste > 0 && cand.length) {
          const x = alea(cand.length);
          etat.p[cand[x]] = c; etat.f[cand[x]] = neutres[0]; reste--;
          cand.splice(x, 1);
        }
      }
      if (c === 0 && vent > 0) for (let i = 0; i < n; i++) if (etat.p[i] === 0) etat.f[i] = div(etat.f[i] * (100 + vent), 100);
      // Ligne : forces symétriques (les neutres du camp 1 reflètent ceux du camp 0).
    }
    if (ligne) {
      for (let i = 0; i < n; i++) if (etat.p[i] < 0 && m.mir[i] > i) etat.f[m.mir[i]] = etat.f[i];
      etat.tmax = D.ligne.tmax;
    } else {
      const ob = fiche.objectif, sec = fiche.secondaire || { t: 0 };
      etat.o = { t: ob.t | 0, n: ob.n | 0, x: 0, d: ob.d | 0, ok: 1, l: resoudre(etat, ob) };
      etat.s2 = { t: sec.t | 0, n: sec.n | 0, x: 0, ok: 1, l: resoudre(etat, sec) };
      etat.tv = fiche.tvise | 0; etat.tmax = fiche.tmax | 0;
      compterCamps(etat);
      majObjectif(etat, false);
      if (ob.t === 5 || ob.t === 6 || ob.t === 8) { etat.o.d = ob.d | 0; etat.o.x = 0; }   // le compte à rebours commence au tick 1
      etat.ev.length = 0; etat.ne = 0;
    }
    return etat;
  }

  // Liste de territoires (ou de camps) d'un objectif, résolue sur la carte.
  function resoudre(etat, ob) {
    if (!ob) return [];
    if (Array.isArray(ob.l)) return ob.l.slice();
    const m = etat.m, l = [];
    if (ob.sel === 'cap0') return [m.cap[0]];
    if (ob.sel === 'balise') return m.balise >= 0 ? [m.balise] : [];
    if (ob.sel === 'cratereProche') {
      // Le cratère riche le plus proche de la capitale du joueur (en arêtes ; égalité : plus petit index) ;
      // sans cratère sur la carte, la région rivale la plus proche. Résolu une fois, à depart().
      const dist = distancesDepuis(m, m.cap[0], DCAP);
      const tCrat = indexType(etat.ac, 'cratere');
      let best = -1;
      for (let i = 0; i < m.n; i++) if (m.t[i] === tCrat && dist[i] > 0 && (best < 0 || dist[i] < dist[best])) best = i;
      if (best < 0) for (let i = 0; i < m.n; i++) if (etat.p[i] > 0 && dist[i] > 0 && (best < 0 || dist[i] < dist[best])) best = i;
      return best >= 0 ? [best] : [];
    }
    if (typeof ob.sel === 'string') {
      const ti = indexType(etat.ac, ob.sel);
      if (ti >= 0) for (let i = 0; i < m.n; i++) if (m.t[i] === ti) l.push(i);
    }
    return l;
  }

  // Distance en arêtes de chaque nœud à la source (toute la carte, −1 : inaccessible), écrite dans le
  // tableau de travail dist (DCAP ou DCIB) et renvoyée.
  function distancesDepuis(m, source, dist) {
    const n = m.n;
    for (let i = 0; i < n; i++) dist[i] = -1;
    let tete = 0, queue = 0;
    dist[source] = 0; FILE[queue++] = source;
    while (tete < queue) {
      const a = FILE[tete++], v = m.vois[a];
      for (let x = 0; x < v.length; x++) { const j = v[x]; if (dist[j] < 0) { dist[j] = dist[a] + 1; FILE[queue++] = j; } }
    }
    return dist;
  }

  // ---- Trajets ----------------------------------------------------------------------
  // Chemin de de vers vers : voisin direct, ou (Transfert) ≤ 3 arêtes par mes territoires.
  function chemin(etat, camp, de, vers) {
    const m = etat.m, n = etat.nn;
    if (!(de >= 0 && de < n && vers >= 0 && vers < n) || de === vers) return null;
    if (voisins(m, de, vers)) return [de, vers];
    const cc = etat.c[camp];
    if (!cc || !(cc.t & B_TRANSFERT)) return null;
    tampon++;
    let tete = 0, queue = 0;
    FILE[queue++] = de; VIS[de] = tampon; PREV[de] = -1;
    let prof = 0, finNiveau = queue;
    while (tete < queue && prof < TRANSFERT_MAX) {
      const i = FILE[tete++];
      const v = m.vois[i];
      for (let x = 0; x < v.length; x++) {
        const j = v[x];
        if (VIS[j] === tampon) continue;
        VIS[j] = tampon; PREV[j] = i;
        if (j === vers) {
          const ch = [vers];
          let k = i;
          while (k >= 0) { ch.push(k); k = PREV[k]; }
          ch.reverse();
          return ch;
        }
        if (etat.p[j] === camp) FILE[queue++] = j;   // on ne traverse que ses territoires
      }
      if (tete === finNiveau) { prof++; finNiveau = queue; }
    }
    return null;
  }

  // Ticks du trajet (chemin du propriétaire de de), ou null.
  function duree(etat, de, vers) {
    const camp = etat.p[de];
    const ch = camp >= 0 ? chemin(etat, camp, de, vers) : (voisins(etat.m, de, vers) ? [de, vers] : null);
    if (!ch) return null;
    let somme = 0;
    for (let x = 1; x < ch.length; x++) somme += longueur(etat.m, ch[x - 1], ch[x]);
    const vit = tables(etat.ac).vit[etat.m.t[de]];
    let t = div(somme * 100, vit);
    if (etat.b[de] === 2) t = div(t, 2);
    return Math.max(1, t);
  }

  // ---- Ordres ----------------------------------------------------------------------------
  function valide(etat, camp, o) {
    if (!Array.isArray(o) || o.length < 1 || o.length > 4) return false;
    const cc = etat.c[camp];
    if (!cc || cc.v !== 1) return false;
    const n = etat.nn, type = o[0];
    if (type === 1) {
      if (o.length !== 4) return false;
      const de = o[1], vers = o[2], pct = o[3];
      if (!(de >= 0 && de < n && vers >= 0 && vers < n) || vers === de) return false;
      if (etat.p[de] !== camp || etat.f[de] < 2 || PCTS.indexOf(pct) < 0) return false;
      return chemin(etat, camp, de, vers) !== null;
    }
    if (type === 2) {
      if (o.length !== 3) return false;
      const i = o[1], bt = o[2];
      if (!(i >= 0 && i < n) || !(bt >= 1 && bt <= 3)) return false;
      const cap = BATIMENTS[bt];
      return etat.p[i] === camp && etat.b[i] === 0 && (cc.t & cap.bit) !== 0 && etat.f[i] > cap.cout;
    }
    if (type === 3) {
      if (o.length !== 2) return false;
      const i = o[1];
      return i >= 0 && i < n && (cc.t & B_RALLIER) !== 0 && etat.p[i] === camp;
    }
    if (type === 4) {
      if (o.length !== 2) return false;
      const i = o[1];
      if (!(i >= 0 && i < n) || !(cc.t & B_FRAPPE) || cc.r[0] !== 0 || etat.p[i] === camp) return false;
      const v = etat.m.vois[i];
      for (let x = 0; x < v.length; x++) if (etat.p[v[x]] === camp) return true;
      for (let x = 0; x < etat.sg.length; x++) if (etat.sg[x].i === i && etat.sg[x].c === camp) return true;
      return false;
    }
    if (type === 5) {
      if (o.length !== 3) return false;
      const a = o[1], b = o[2];
      if (!(a >= 0 && a < n && b >= 0 && b < n) || a === b || !(cc.t & B_PONT) || cc.r[2] !== 0) return false;
      if (etat.p[a] !== camp || etat.p[b] !== camp || voisins(etat.m, a, b) || etat.f[a] <= CAP.pont.cout) return false;
      const dx = etat.m.x[a] - etat.m.x[b], dy = etat.m.y[a] - etat.m.y[b];
      return racineEntiere(dx * dx + dy * dy) <= div(etat.m.dmoy * 150, 100);
    }
    if (type === 6) return o.length === 1 && (cc.t & B_SURSAUT) !== 0 && cc.r[1] === 0;
    if (type === 7) return o.length === 2 && (cc.t & B_ESSAIMAGE) !== 0 && (o[1] === 0 || o[1] === 1);
    return false;
  }

  // Les ordres d'un tick arrivent AVANT pas() : si ev tient encore les événements du
  // tick précédent (ne > 0), on le vide d'abord.
  function preparerEv(etat) {
    if (etat.ne > 0) { etat.ev.length = 0; etat.ne = 0; }
  }

  // Départ d'une flotte (ordre 1 et Rallier) : n forces de de vers vers.
  function envoyer(etat, camp, de, vers, n) {
    const L = duree(etat, de, vers);
    if (L === null || n < 1) return;
    etat.f[de] -= n;
    const fl = { i: etat.nf++, c: camp, n: n, d: de, v: vers, q: 0, L: L };
    etat.fl.push(fl);
    etat.ev.push([2, fl.i, de, vers, camp, n]);
  }

  function ordre(etat, camp, o) {
    preparerEv(etat);
    const cc = etat.c[camp], type = o[0];
    if (type === 1) {
      const de = o[1];
      let n = Math.max(1, div(etat.f[de] * o[3], 100));
      n = Math.min(n, etat.f[de] - 1);
      envoyer(etat, camp, de, o[2], n);
    } else if (type === 2) {
      const i = o[1], cap = BATIMENTS[o[2]];
      etat.f[i] -= cap.cout; etat.b[i] = o[2];
      etat.ev.push([6, i, o[2]]);
    } else if (type === 3) {
      const i = o[1], v = etat.m.vois[i];
      let nb = 0;
      for (let x = 0; x < v.length; x++) {
        const j = v[x];
        if (etat.p[j] !== camp || etat.f[j] < 2) continue;
        const n = Math.min(Math.max(1, div(etat.f[j] * 50, 100)), etat.f[j] - 1);
        envoyer(etat, camp, j, i, n); nb++;
      }
      etat.ev.push([11, i, camp, nb]);
    } else if (type === 4) {
      etat.aff[o[1]] = CAP.frappe.duree; cc.r[0] = CAP.frappe.recharge;
      etat.ev.push([7, 4, o[1], camp]);
    } else if (type === 5) {
      const a = o[1], b = o[2], m = etat.m;
      const dx = m.x[a] - m.x[b], dy = m.y[a] - m.y[b];
      const L0 = Math.max(5, Math.min(40, div(racineEntiere(dx * dx + dy * dy) * 10, D.vitesse.V[etat.ac])));
      etat.f[a] -= CAP.pont.cout; cc.r[2] = CAP.pont.recharge;
      etat.pont.push([Math.min(a, b), Math.max(a, b), L0]);
      ajouterArete(m, a, b, L0, false);
      etat.ev.push([7, 5, a, camp]);
    } else if (type === 6) {
      cc.s = CAP.sursaut.duree; cc.r[1] = CAP.sursaut.recharge;
      etat.ev.push([7, 6, -1, camp]);
    } else if (type === 7) {
      cc.es = o[1];
      etat.ev.push([7, 7, o[1], camp]);
    }
  }

  // ---- Un tick ------------------------------------------------------------------------------
  function compterCamps(etat) {
    const nc = etat.c.length;
    for (let c = 0; c < nc; c++) { CNT[c] = 0; FOR[c] = 0; VIF[c] = 0; }
    for (let i = 0; i < etat.nn; i++) { const c = etat.p[i]; if (c >= 0) { CNT[c]++; FOR[c] += etat.f[i]; VIF[c] = 1; } }
    for (let x = 0; x < etat.fl.length; x++) { const f = etat.fl[x]; FOR[f.c] += f.n; VIF[f.c] = 1; }
    for (let x = 0; x < etat.sg.length; x++) { const s = etat.sg[x]; FOR[s.c] += s.n; VIF[s.c] = 1; }
  }

  function insererSiege(etat, i, c, n) {
    const sg = etat.sg;
    let x = 0;
    while (x < sg.length && (sg[x].i < i || (sg[x].i === i && sg[x].c < c))) x++;
    sg.splice(x, 0, { i: i, c: c, n: n });
  }

  function pas(etat, alea) {
    const m = etat.m, n = etat.nn, p = etat.p, f = etat.f, acc = etat.acc, b = etat.b, c = etat.c, eq = etat.eq;
    const T = tables(etat.ac), PROD = T.prod, CAPM = T.cap;
    const k1 = etat.k + 1;
    // 1. Événements : vidés s'ils datent du tick précédent (sinon ce sont ceux des ordres de ce tick).
    preparerEv(etat);
    const ev = etat.ev;

    // 2. Production (plafond cap ; bonus Arrière-pays, Chantier, Sursaut ; demi-production sans ravitaillement).
    for (let i = 0; i < n; i++) {
      const cp = p[i];
      if (cp < 0) continue;
      const capi = CAPM[m.t[i]];
      if (f[i] >= capi) continue;
      let bonus = 0;
      const cc = c[cp];
      if (cc.t & B_ARRIERE) {
        const v = m.vois[i];
        let tous = 1;
        for (let x = 0; x < v.length; x++) if (p[v[x]] !== cp) { tous = 0; break; }
        if (tous) bonus += CAP.arrierepays.bonus;
      }
      if (b[i] === 3) bonus += CAP.chantier.bonus;
      let gain = div(PROD[m.t[i]] * (100 + bonus), 100);
      if (cc.s > 0) gain = div(gain * (100 + CAP.sursaut.bonus), 100);
      if (etat.rav[i] === 0) gain = div(gain, 2);
      let a = acc[i] + gain;
      while (a >= 1000 && f[i] < capi) { a -= 1000; f[i]++; }
      acc[i] = a;
    }

    // 3. Flottes : un tick de plus ; 4. arrivées (q ≥ L) dans l'ordre des identifiants.
    const fl = etat.fl;
    let w = 0;
    for (let x = 0; x < fl.length; x++) {
      const t = fl[x];
      t.q += 1;
      if (t.q < t.L) { fl[w++] = t; continue; }
      const v = t.v, pv = p[v];
      if (pv >= 0 && eq[pv] === eq[t.c]) {
        f[v] += t.n;
        ev.push([3, v, t.c, t.n]);
      } else {
        let trouve = false;
        for (let y = 0; y < etat.sg.length; y++) {
          const s = etat.sg[y];
          if (s.i === v && s.c === t.c) { s.n += t.n; ev.push([4, v, t.c, s.n]); trouve = true; break; }
        }
        if (!trouve) { insererSiege(etat, v, t.c, t.n); ev.push([4, v, t.c, t.n]); }
      }
    }
    fl.length = w;

    // 5. Sièges (ordre des territoires puis des camps), formule du cadrage.
    const sg = etat.sg;
    for (let x = 0; x < sg.length; x++) {
      const s = sg[x], i = s.i, pi = p[i];
      if (pi >= 0 && eq[pi] === eq[s.c]) {        // le nœud est passé à mon équipe : renfort
        f[i] += s.n; ev.push([3, i, s.c, s.n]);
        sg.splice(x, 1); x--; continue;
      }
      const def = defense(etat, i);
      const Dd = div(f[i] * (100 + def), 100);
      f[i] -= Math.max(1, div(s.n * 10, 100 + def));
      s.n -= Math.max(1, div(Dd * 12, 100));
      if (f[i] <= 0) {
        const ancien = pi;
        p[i] = s.c; f[i] = Math.max(1, s.n); acc[i] = 0;
        if (b[i] === 1) { b[i] = 0; ev.push([10, i]); }
        if (ancien >= 0) {
          if (ancien === 0) etat.st.perdus++;
          if (c[ancien].cap === i) { c[ancien].cap = -1; if (ancien === 0) etat.st.capIntacte = 0; }
        }
        if (s.c === 0) etat.st.pris++;
        if (c[s.c].cap === -1 && m.cap[s.c] === i) c[s.c].cap = i;   // capitale reprise
        ev.push([1, i, s.c, ancien, f[i]]);
        sg.splice(x, 1); x--;
      } else if (s.n <= 0) {
        ev.push([5, i, s.c]);
        sg.splice(x, 1); x--;
      }
    }

    // 6. Recharges, Frappes, Sursauts, fermetures, orbites (acte 2 : m.per absent au lot 1).
    for (let x = 0; x < c.length; x++) {
      const cc = c[x];
      if (cc.r[0] > 0) cc.r[0]--;
      if (cc.r[1] > 0) cc.r[1]--;
      if (cc.r[2] > 0) cc.r[2]--;
      if (cc.s > 0) cc.s--;
    }
    for (let i = 0; i < n; i++) {
      if (etat.aff[i] > 0) etat.aff[i]--;
      if (etat.fer[i] > 0) etat.fer[i]--;
    }
    if (m.forme === 2 && m.per) for (let i = 0; i < n; i++) if (m.per[i] > 0 && k1 % m.per[i] === 0) etat.ang[i] = (etat.ang[i] + 1) % 64;
    // Essaimage : un envoi automatique par camp et par tick (territoire au plafond → voisin neutre le plus faible).
    for (let x = 0; x < c.length; x++) {
      const cc = c[x];
      if (!cc.es || !(cc.t & B_ESSAIMAGE) || !cc.v) continue;
      for (let y = 0; y < n; y++) {
        const i = (k1 + y) % n;
        if (p[i] !== x || f[i] < CAPM[m.t[i]]) continue;
        const v = m.vois[i];
        let cible = -1;
        for (let z = 0; z < v.length; z++) if (p[v[z]] < 0 && (cible < 0 || f[v[z]] < f[cible])) cible = v[z];
        if (cible < 0) continue;
        envoyer(etat, x, i, cible, Math.min(Math.max(1, div(f[i] * 25, 100)), f[i] - 1));
        break;
      }
    }

    // 7. Tous les 10 ticks : ravitaillement (actes ≥ 3), vivants, mémoire des robots.
    compterCamps(etat);
    if (k1 % 10 === 0) {
      if (etat.ac >= 3) {
        for (let x = 0; x < c.length; x++) {
          const cc = c[x];
          if (!VIF[x]) continue;
          tampon++;
          if (cc.cap >= 0 && p[cc.cap] === x) {
            let tete = 0, queue = 0;
            FILE[queue++] = cc.cap; VIS[cc.cap] = tampon;
            while (tete < queue) {
              const i = FILE[tete++], v = m.vois[i];
              for (let y = 0; y < v.length; y++) { const j = v[y]; if (p[j] === x && VIS[j] !== tampon && etat.fer[j] === 0) { VIS[j] = tampon; FILE[queue++] = j; } }
            }
          }
          for (let i = 0; i < n; i++) if (p[i] === x) etat.rav[i] = VIS[i] === tampon ? 1 : 0;
        }
      } else {
        for (let i = 0; i < n; i++) etat.rav[i] = 1;
      }
      for (let x = 0; x < c.length; x++) {
        const cc = c[x];
        cc.v = VIF[x] ? 1 : 0;
        if (cc.mem[1] > 0) cc.mem[1] = Math.max(0, cc.mem[1] - 10);
        if (cc.mem[3] > 0) cc.mem[3] = Math.max(0, cc.mem[3] - 10);
        // Offensives annoncées (personnalités à offensive : lot 2).
        const perso = personnalite(etat, x);
        if (cc.v && etat.ctl[x] > 0 && perso.offensive) {
          if (cc.mem[2] <= 0) cc.mem[2] = perso.offensive.periode;
          cc.mem[2] -= 10;
          if (cc.mem[2] === perso.offensive.annonce) ev.push([8, x, perso.offensive.annonce]);
          if (cc.mem[2] <= 0) { cc.mem[3] = perso.offensive.duree; cc.mem[2] = perso.offensive.periode; }
        }
      }
    }

    // 8. Objectifs et statistiques.
    if (etat.mi > 0) majObjectif(etat, true);
    etat.ne = ev.length;
  }

  // Objectif atteint ?
  function atteint(etat) {
    const o = etat.o;
    switch (o.t) {
      case 1: case 2: return o.x >= o.n;
      case 3: return o.l.length > 0 && o.x >= o.l.length;
      case 4: case 9: return o.x === 1;
      case 5: case 8: return o.d === 0;
      case 6: return o.d === 0 && o.x >= o.n;
      case 7: return o.x === 0;
    }
    return false;
  }
  function secondaireAtteint(etat) {
    const s = etat.s2;
    if (!s.t || !s.ok) return false;
    if (s.t === 3) return s.l.length > 0 && etat.p[s.l[0]] === 0;
    return true;
  }

  // Avancement des objectifs (CNT déjà compté). ev : émettre les événements [9, …].
  function majObjectif(etat, ev) {
    const o = etat.o, s = etat.s2, p = etat.p, k1 = etat.k + 1, n0 = CNT[0];
    const avant = atteint(etat), xAvant = o.x;
    etat.st.maxT = Math.max(etat.st.maxT, n0);
    switch (o.t) {
      case 1: o.x = div(n0 * 100, etat.nn); break;
      case 2: o.x = n0; break;
      case 3: { let x = 0; for (let i = 0; i < o.l.length; i++) if (p[o.l[i]] === 0) x++; o.x = x; break; }
      case 4: o.x = p[o.l[0]] === 0 ? 1 : 0; break;
      case 5: case 8: {
        let tous = 1;
        for (let i = 0; i < o.l.length; i++) if (p[o.l[i]] !== 0) { tous = 0; break; }
        if (tous) { if (o.d > 0) o.d--; o.x++; } else o.ok = 0;
        break;
      }
      case 6: if (o.d > 0) { o.d--; o.x = 0; } else o.x = div(n0 * 100, etat.nn); break;
      case 7: { let x = 0; for (let i = 0; i < o.l.length; i++) if (etat.c[o.l[i]] && etat.c[o.l[i]].v) x++; o.x = x; break; }
      case 9: {
        const pr = p[o.l[0]];
        o.x = pr === 0 ? 1 : 0;
        if (pr > 0 && etat.eq[pr] !== etat.eq[0]) o.ok = 0;
        break;
      }
    }
    // Secondaire.
    if (s.t === 1 && !etat.st.capIntacte) s.ok = 0;
    else if (s.t === 2 && k1 > 300 && n0 < s.n) s.ok = 0;
    else if (s.t === 3) s.x = s.l.length && p[s.l[0]] === 0 ? 1 : 0;
    else if (s.t === 4 && etat.st.perdus > s.n) s.ok = 0;
    if (ev) {
      if (!avant && atteint(etat)) etat.ev.push([9, 1]);
      else if (o.x !== xAvant) etat.ev.push([9, 3, o.x]);
      if (s.t && !s.ok && s.x !== -1) { etat.ev.push([9, 2]); s.x = -1; }   // perdu : signalé une fois
    }
  }

  // ---- Fin de partie -----------------------------------------------------------------------
  function scores(etat) {
    compterCamps(etat);
    const l = [];
    for (let c = 0; c < etat.c.length; c++) l.push(10 * CNT[c] + div(FOR[c], 10));
    return l;
  }
  function meilleurRival(etat) {
    compterCamps(etat);
    let best = -1, bs = -1;
    for (let c = 1; c < etat.c.length; c++) { const s = 10 * CNT[c] + div(FOR[c], 10); if (VIF[c] && s > bs) { bs = s; best = c; } }
    return best;
  }
  // Deuxième étoile : sous le temps visé (tv). Objectifs à durée fixe (5, 6, 8 : « tenir ») : la victoire
  // arrive toujours à d ticks, le temps ne dit rien ; l'étoile récompense alors un camp qui finit avec au
  // moins autant de territoires qu'au départ (terr de la fiche). « Aucune région perdue » a été mesuré et
  // écarté le 17 novembre : la première vague de la mission 5 prend toujours la région qui sépare le rival
  // de la capitale (tortue 4 / 20 par chance de carte, robot de niveau 2 0 / 16). CNT à jour (scores).
  function deuxiemeEtoile(etat) {
    const t = etat.o.t;
    if (t === 5 || t === 6 || t === 8) {
      const fiche = D.missions[etat.mi - 1], fc = fiche && fiche.camps ? fiche.camps[0] : null;
      return CNT[0] >= ((fc && fc.terr) | 0 || 1) ? 1 : 0;
    }
    return etat.k <= etat.tv ? 1 : 0;
  }
  function resultat(etat, gagnant, raison) {
    const sc = scores(etat);
    let etoiles = 0;
    if (gagnant === 0 && etat.mi > 0) etoiles = 1 + deuxiemeEtoile(etat) + (secondaireAtteint(etat) ? 1 : 0);
    return { gagnant: gagnant, scores: sc, raison: raison, etoiles: etoiles };
  }

  function fin(etat) {
    const c = etat.c;
    if (etat.mi === 0) {
      compterCamps(etat);
      let vivants = 0, dernier = -1;
      for (let x = 0; x < c.length; x++) if (VIF[x]) { vivants++; dernier = x; }
      if (vivants <= 1) return resultat(etat, dernier, 6);
      if (etat.tmax > 0 && etat.k >= etat.tmax) {
        let best = 0, bs = -1;
        for (let x = 0; x < c.length; x++) { const s = 10 * CNT[x] + div(FOR[x], 10); if (s > bs) { bs = s; best = x; } }
        return resultat(etat, best, 3);
      }
      return null;
    }
    if (atteint(etat) && etat.o.ok) return resultat(etat, 0, 1);
    // Joueur éliminé (compté au tick, sans attendre le contrôle des 10 ticks).
    compterCamps(etat);
    if (!VIF[0]) return resultat(etat, meilleurRival(etat), 2);
    if (!etat.o.ok) return resultat(etat, meilleurRival(etat), etat.o.t === 9 ? 5 : 1);
    for (let x = 1; x < c.length; x++) if (etat.eq[x] === etat.eq[0] && x < etat.m.cap.length && !VIF[x]) return resultat(etat, meilleurRival(etat), 4);
    if (etat.tmax > 0 && etat.k >= etat.tmax) return resultat(etat, meilleurRival(etat), 3);
    return null;
  }

  // ---- Export, import, empreinte ----------------------------------------------------------------
  function exporter(e) {
    const fl = [], sg = [], c = [];
    for (let x = 0; x < e.fl.length; x++) { const t = e.fl[x]; fl.push([t.i, t.c, t.n, t.d, t.v, t.q, t.L]); }
    for (let x = 0; x < e.sg.length; x++) { const s = e.sg[x]; sg.push([s.i, s.c, s.n]); }
    for (let x = 0; x < e.c.length; x++) { const y = e.c[x]; c.push({ fa: y.fa, t: y.t, r: y.r.slice(), s: y.s, v: y.v, cap: y.cap, es: y.es, mem: y.mem.slice() }); }
    return {
      a: e.a, k: e.k, ctl: e.ctl.slice(), mi: e.mi, g: e.g, ve: e.ve, ac: e.ac, nn: e.nn,
      p: e.p.slice(), f: e.f.slice(), acc: e.acc.slice(), b: e.b.slice(), aff: e.aff.slice(), fer: e.fer.slice(), ang: e.ang.slice(), rav: e.rav.slice(),
      fl: fl, nf: e.nf, sg: sg, pont: copie(e.pont), c: c, eq: e.eq.slice(),
      o: { t: e.o.t, n: e.o.n, x: e.o.x, d: e.o.d, ok: e.o.ok, l: e.o.l.slice() },
      s2: { t: e.s2.t, n: e.s2.n, x: e.s2.x, ok: e.s2.ok, l: e.s2.l.slice() },
      tv: e.tv, tmax: e.tmax, st: { perdus: e.st.perdus, capIntacte: e.st.capIntacte, maxT: e.st.maxT, pris: e.st.pris },
      ev: copie(e.ev), ne: e.ne,
    };
  }

  function importer(d) {
    const m = generer(d.g, carteDe(d.mi), d.ac);
    const pont = Array.isArray(d.pont) ? copie(d.pont) : [];
    for (let x = 0; x < pont.length; x++) ajouterArete(m, pont[x][0], pont[x][1], pont[x][2], false);
    const fl = [], sg = [], c = [];
    for (let x = 0; x < d.fl.length; x++) { const t = d.fl[x]; fl.push(Array.isArray(t) ? { i: t[0], c: t[1], n: t[2], d: t[3], v: t[4], q: t[5], L: t[6] } : copie(t)); }
    for (let x = 0; x < d.sg.length; x++) { const s = d.sg[x]; sg.push(Array.isArray(s) ? { i: s[0], c: s[1], n: s[2] } : copie(s)); }
    for (let x = 0; x < d.c.length; x++) { const y = d.c[x]; c.push({ fa: y.fa, t: y.t, r: y.r.slice(), s: y.s, v: y.v, cap: y.cap, es: y.es | 0, mem: y.mem.slice() }); }
    return {
      a: d.a, k: d.k | 0, ctl: Array.isArray(d.ctl) ? d.ctl.slice() : [], mi: d.mi, g: d.g, ve: d.ve, ac: d.ac, nn: d.nn,
      p: d.p.slice(), f: d.f.slice(), acc: d.acc.slice(), b: d.b.slice(), aff: d.aff.slice(), fer: d.fer.slice(), ang: d.ang.slice(), rav: d.rav.slice(),
      fl: fl, nf: d.nf, sg: sg, pont: pont, c: c, eq: d.eq.slice(),
      o: { t: d.o.t, n: d.o.n, x: d.o.x, d: d.o.d, ok: d.o.ok, l: d.o.l.slice() },
      s2: { t: d.s2.t, n: d.s2.n, x: d.s2.x, ok: d.s2.ok, l: d.s2.l.slice() },
      tv: d.tv, tmax: d.tmax, st: { perdus: d.st.perdus, capIntacte: d.st.capIntacte, maxT: d.st.maxT, pris: d.st.pris },
      ev: copie(d.ev) || [], ne: d.ne | 0, m: m,
    };
  }

  function empreinte(etat) { return exporter(etat); }

  // ---- Robots (cadrage section 8) -----------------------------------------------------------------
  // Personnalité d'un camp : celle de sa faction ; sans personnalité (joueur tenu par un robot,
  // rivaux de l'acte 5), une des factions 1 à 4, tirée de la graine et du camp.
  function personnalite(etat, camp) {
    const cc = etat.c[camp];
    // Personnalité propre à la mission (fiche : camps[camp].perso), par exemple les Cendrés assiégeants de la
    // mission 5, qui lancent des offensives sans changer la faction des autres missions.
    if (etat.mi > 0) {
      const fiche = D.missions[etat.mi - 1], fc = fiche && fiche.camps ? fiche.camps[camp] : null;
      if (fc && fc.perso) return fc.perso;
    }
    const fa = D.factions[cc.fa];
    if (fa && fa.perso) return fa.perso;
    if (cc.fa === 0) return D.factions[1].perso;
    return D.factions[1 + ((etat.g + camp) % 4)].perso;
  }

  // Plus petit pourcentage dont le départ n(pct) = min(max(1, f × pct / 100), f − 1) atteint besoin
  // sans dépasser dispo ; 0 si aucun.
  function pourcentage(f, besoin, dispo) {
    for (let x = 0; x < PCTS.length; x++) {
      const n = Math.min(Math.max(1, div(f * PCTS[x], 100)), f - 1);
      if (n >= besoin && n <= dispo) return PCTS[x];
    }
    return 0;
  }

  // Plus grand pourcentage dont le départ reste ≤ dispo et atteint besoin ; 0 si aucun (engagement total).
  function plusGrand(f, besoin, dispo) {
    for (let x = PCTS.length - 1; x >= 0; x--) {
      const n = Math.min(Math.max(1, div(f * PCTS[x], 100)), f - 1);
      if (n <= dispo && n >= besoin) return PCTS[x];
    }
    return 0;
  }

  function siegeDe(etat, i, camp) {
    const sg = etat.sg;
    for (let x = 0; x < sg.length; x++) if (sg[x].i === i && sg[x].c === camp) return sg[x].n;
    return 0;
  }

  // Cibles de mission du camp du joueur (ou d'un allié) : ce que la fiche affiche au joueur, rien de plus.
  // CIB[j] : 1 nœud à prendre (+300 dans la valeur d'une cible), 2 nœud à tenir (jamais une source d'attaque,
  // tout voisin ennemi compte comme une menace, la logistique le renforce d'abord). Renvoie le mode (0, 1, 2).
  // Éliminer des camps (o.t 7) : les nœuds des autres rivaux valent 3 (hors objectif : un tiers de leur valeur,
  // on ne se disperse pas sur un second front) ; ceux du camp visé ne sont pas marqués (attaquer l'ennemi
  // avant de s'étendre fait perdre).
  function ciblesMission(etat, camp) {
    const n = etat.nn;
    for (let i = 0; i < n; i++) CIB[i] = 0;
    if (etat.mi === 0 || etat.eq[camp] !== etat.eq[0]) return 0;
    const o = etat.o, l = o.l;
    if (o.t === 7) { for (let i = 0; i < n; i++) { const pi = etat.p[i]; if (pi > 0 && etat.eq[pi] !== etat.eq[camp] && l.indexOf(pi) < 0) CIB[i] = 3; } return 1; }
    if (o.t === 3 || o.t === 4 || o.t === 9) { for (let x = 0; x < l.length; x++) CIB[l[x]] = 1; return 1; }
    if (o.t === 5 || o.t === 8) { for (let x = 0; x < l.length; x++) CIB[l[x]] = 2; return 2; }
    return 0;
  }

  // Décision d'un robot (cadrage section 8) : fonction pure, 8 ordres au plus, trois passes (attaque, défense,
  // logistique). Il ne voit que ce que voit le joueur : propriétaires, forces, bâtiments, flottes, sièges, routes.
  function bot(etat, camp, niveau, alea) {
    const cc = etat.c[camp];
    if (!cc || cc.v !== 1) return VIDE;
    const rob = D.robots[niveau] || D.robots[1];
    const perso = personnalite(etat, camp);
    const offensive = cc.mem[3] > 0;
    // Offensive dirigée (perso.offensive.cible 1) : pendant la fenêtre, le camp ne fait que ça, sans sauter de
    // décision (une offensive annoncée doit arriver) ; la capitale du joueur perdue ou reprise par un allié,
    // le robot reprend son jeu habituel.
    if (offensive && perso.offensive && perso.offensive.cible === 1 && etat.mi > 0 && etat.eq[camp] !== etat.eq[0]) {
      const cap0 = etat.c[0].cap;
      if (cap0 >= 0 && etat.p[cap0] === 0) return offensiveDirigee(etat, camp, cap0);
    }
    if (rob.saute > 0 && alea(rob.saute) === 0) return VIDE;
    if (perso.decideUnSurDeux && alea(2) === 0) return VIDE;
    const m = etat.m, n = etat.nn, p = etat.p, f = etat.f, eq = etat.eq;
    const liste = D.echelles[etat.ac].liste, PROD = tables(etat.ac).prod;
    const tech = cc.t, actives = rob.actives & tech, groupe = rob.groupe === 1;
    const ratio = rob.ratio + perso.ratioDelta;
    const tCeinture = perso.cibles === 2 ? liste.indexOf('ceinture') : -1;
    const ordres = [];
    const ennemi = function (j) { const pj = p[j]; return pj >= 0 && eq[pj] !== eq[camp]; };
    const tenir = ciblesMission(etat, camp) === 2;
    // Personnalité à offensive dirigée, hors fenêtre : tête de pont = mon nœud le plus proche de la capitale du
    // joueur (égalité : le plus garni) ; la logistique y concentre tout, la prochaine offensive part de là. Le
    // joueur voit la pile grossir à sa frontière : « des flottes ennemies en route ».
    let tete = -1;
    if (perso.offensive && perso.offensive.cible === 1 && etat.mi > 0 && eq[camp] !== eq[0] && etat.c[0].cap >= 0 && p[etat.c[0].cap] === 0) {
      distancesDepuis(m, etat.c[0].cap, DCAP);
      for (let i = 0; i < n; i++) if (p[i] === camp && DCAP[i] > 0 && (tete < 0 || DCAP[i] < DCAP[tete] || (DCAP[i] === DCAP[tete] && f[i] > f[tete]))) tete = i;
    }

    // Ce que voit le joueur : menace réelle (flottes ennemies en approche, sièges), pression des voisins
    // ennemis, nombre de voisins non possédés (front), mes propres flottes en vol vers chaque nœud.
    for (let i = 0; i < n; i++) { MEN[i] = 0; PRES[i] = 0; FRONT[i] = 0; VOL[i] = 0; SCORE[i] = 0; VAL[i] = 0; LMIN[i] = 0; }
    for (let i = 0; i < n; i++) {
      if (p[i] !== camp) continue;
      const v = m.vois[i];
      for (let x = 0; x < v.length; x++) { const j = v[x]; if (p[j] !== camp && (p[j] < 0 || eq[p[j]] !== eq[camp])) { FRONT[i]++; if (ennemi(j)) PRES[i] += f[j]; } }
    }
    for (let x = 0; x < etat.fl.length; x++) {
      const t = etat.fl[x];
      if (t.c === camp) VOL[t.v] += t.n;
      else if (p[t.v] === camp && eq[t.c] !== eq[camp]) MEN[t.v] += t.n;
    }
    for (let x = 0; x < etat.sg.length; x++) { const s = etat.sg[x]; if (p[s.i] === camp && eq[s.c] !== eq[camp]) MEN[s.i] += s.n; }
    compterCamps(etat);                                   // FOR[c] : forces visibles de chaque camp
    if (tenir) for (let i = 0; i < n; i++) if (CIB[i] === 2 && p[i] === camp) MEN[i] += PRES[i];
    // Offensive annoncée par un rival (le bandeau ev 8 que voit le joueur) : un camp qui tient sa capitale la
    // rallie tant qu'elle ne tiendrait pas face aux forces ennemies à deux arêtes d'elle (la vague enchaîne la
    // région intermédiaire puis la capitale en quelques secondes : rallier à l'arrivée du siège est trop tard).
    let rallieCap = false;
    if (tenir && (actives & B_RALLIER) && cc.cap >= 0 && p[cc.cap] === camp && offensiveAnnoncee(etat, camp)) {
      distancesDepuis(m, cc.cap, DCIB);
      let proche = 0;
      for (let i = 0; i < n; i++) if (DCIB[i] > 0 && DCIB[i] <= 2 && ennemi(i)) proche += f[i];
      for (let x = 0; x < etat.fl.length; x++) { const t = etat.fl[x]; if (eq[t.c] !== eq[camp] && DCIB[t.v] >= 0 && DCIB[t.v] <= 1) proche += t.n; }
      if (div(f[cc.cap] * (100 + defense(etat, cc.cap)), 100) < proche) { ordres.push([3, cc.cap]); rallieCap = true; }
    }

    // Passe 1a : valeur de chaque cible (nœud non possédé voisin d'un des miens ; à 2 arêtes par un des miens
    // avec Transfert et portée 2) et forces disponibles de chaque source. V = poidsProd × prod + 300 (capitale,
    // cible de mission) + 50 × voisins à moi + 200 (cible mémorisée, ceinture) + 100 (neutre), ÷ 3 hors objectif ;
    // C = D × 110 / 100 + 2 × L (route la plus courte depuis une de mes sources) + 1 ; score = V × 1000 / C.
    const portee2 = rob.portee >= 2 && (actives & B_TRANSFERT) !== 0;
    // cibles 3 (assiégeant de la mission 5) : aucune attaque hors offensive dirigée ; le camp défend, fait
    // couler ses forces vers le front et attend l'offensive suivante (son économie reste celle de la fiche).
    const cible = function (j) { return perso.cibles !== 3 && !(p[j] === camp || (p[j] >= 0 && eq[p[j]] === eq[camp])) && !(perso.cibles === 1 && p[j] >= 0 && f[j] > 3); };
    const noter = function (j, L) {
      if (SCORE[j] === 0) {
        let V = perso.poidsProd * PROD[m.t[j]] + 50 * voisinsPossedes(etat, j, camp);
        if (m.t[j] === liste.length - 1 || m.cap.indexOf(j) >= 0 || CIB[j] === 1) V += 300;
        if (j === cc.mem[0] && cc.mem[1] > 0) V += 200;
        if (tCeinture >= 0 && m.t[j] === tCeinture) V += 200;
        if (p[j] < 0) V += 100;                      // un neutre ne rend pas les coups plus tard
        if (CIB[j] === 3) V = div(V, 3);             // rival hors objectif : second front à éviter
        VAL[j] = V; LMIN[j] = L; SCORE[j] = 1;
      } else if (L < LMIN[j]) LMIN[j] = L;
    };
    // Forces de la source i disponibles pour attaquer j. Garnison : prud % des forces (cadrage section 8) ; la
    // capitale en garde le double (et 5 au moins) : la perdre coûte la 3e étoile, le ravitaillement (acte 3) et
    // souvent la partie ; menacé (flottes en approche, sièges), on garde de quoi tenir face à ce qui arrive.
    // assaut : tout sauf 2 (coup de grâce sur un camp deux fois plus faible : garder 30 % d'une pile de 8 000
    // devant la dernière place forte d'un rival à 4 000 ne finit jamais la partie).
    const dispoVers = function (i, j, assaut) {
      if (offensive) return f[i] - 1;
      const def = defense(etat, i);
      let g = assaut ? 2 : Math.max(2, div(f[i] * perso.prud, 100));
      if (i === cc.cap) g = Math.max(5, 2 * g);
      if (MEN[i] > 0) g = Math.max(g, div(MEN[i] * 100, 100 + def) + 1);
      return f[i] - g;
    };
    for (let i = 0; i < n; i++) {
      DISPO[i] = 0;
      if (p[i] !== camp || f[i] < 2 || (tenir && CIB[i] === 2)) continue;
      const dispo = dispoVers(i, -1);
      if (dispo < 1) continue;
      DISPO[i] = dispo;
      const v = m.vois[i];
      for (let x = 0; x < v.length; x++) {
        const j = v[x];
        if (cible(j)) noter(j, m.lv[i][x]);
        else if (portee2 && p[j] === camp) {
          const vj = m.vois[j];
          for (let y = 0; y < vj.length; y++) { const k = vj[y]; if (k !== i && !voisins(m, i, k) && cible(k)) noter(k, m.lv[i][x] + m.lv[j][y]); }
        }
      }
    }
    for (let j = 0; j < n; j++) {
      if (SCORE[j] === 0) continue;
      const Dj = div(f[j] * (100 + defense(etat, j)), 100);
      SCORE[j] = Math.max(1, div(VAL[j] * 1000, div(Dj * 110, 100) + 2 * LMIN[j] + 1));
    }

    // Besoin pour prendre j : D × ratio / 100 + 1, moins le siège déjà en cours et mes flottes en vol.
    const besoinDe = function (j, def) { return div(div(f[j] * (100 + def), 100) * ratio, 100) + 1 - siegeDe(etat, j, camp) - VOL[j]; };
    // Part envoyée par la source i vers j : neutre, le plus petit pourcentage qui suffit ; ennemi (robots
    // « tout »), tout ce qui est disponible, pour ne pas laisser une conquête à 1 force reprise aussitôt.
    const envoi = function (i, j, part, dispo) {
      const pct = offensive ? 100 : (rob.tout === 1 && p[j] >= 0) ? plusGrand(f[i], part, dispo) : pourcentage(f[i], part, dispo);
      if (!pct) return false;
      ordres.push([1, i, j, pct]);
      DISPO[i] = 0; cc.mem[0] = j; cc.mem[1] = 50;
      return true;
    };
    let nAttaques = 0, frappe = cc.r[0] !== 0 || !(actives & B_FRAPPE);

    if (!groupe) {
      // Passe 1b, niveau 1 : chaque source attaque seule sa meilleure cible si ses forces suffisent (et laisse des trous).
      for (let i = 0; i < n && ordres.length < 6; i++) {
        if (DISPO[i] === 0) continue;
        const v = m.vois[i];
        let best = -1, bs = 0;
        for (let x = 0; x < v.length; x++) { const j = v[x]; if (SCORE[j] > bs) { bs = SCORE[j]; best = j; } }
        if (best < 0) continue;
        const besoin = besoinDe(best, defense(etat, best)), dispo = dispoVers(i, best);
        if (besoin >= 1 && dispo >= besoin && envoi(i, best, besoin, dispo)) nAttaques++;
      }
    } else {
      // Passe 1b, niveaux 2 et 3 : cibles par score décroissant ; toutes mes sources voisines (et à 2 arêtes avec
      // la portée 2) encore libres mettent leurs forces en commun ; attaque si la somme suffit, chacune envoie
      // sa part. Niveau 3 : Frappe avant une forteresse (def ≥ 50) quand elle rend l'attaque possible.
      let essais = 0;
      while (ordres.length < 6 && essais < 12) {
        let j = -1, bs = 0;
        for (let x = 0; x < n; x++) if (SCORE[x] > bs) { bs = SCORE[x]; j = x; }
        if (j < 0) break;
        SCORE[j] = 0; essais++;
        // Sources : mes voisins de j, puis (portée 2) mes voisins de mes voisins de j.
        let ns = 0, somme = 0;
        const vj = m.vois[j];
        for (let x = 0; x < vj.length; x++) { const a = vj[x]; if (p[a] === camp && DISPO[a] > 0) { const d = dispoVers(a, j); if (d >= 1) { SRC[ns] = a; SRCD[ns++] = d; somme += d; } } }
        if (portee2) for (let x = 0; x < vj.length; x++) {
          const a = vj[x];
          if (p[a] !== camp) continue;
          const va = m.vois[a];
          for (let y = 0; y < va.length && ns < 24; y++) { const b = va[y]; if (p[b] === camp && DISPO[b] > 0 && b !== j && !voisins(m, b, j)) { let vu = false; for (let z = 0; z < ns; z++) if (SRC[z] === b) { vu = true; break; } if (!vu) { SRC[ns] = b; SRCD[ns++] = DISPO[b]; somme += DISPO[b]; } } }
        }
        if (ns === 0) continue;
        const def = defense(etat, j);
        let besoin = besoinDe(j, def);
        if (besoin < 1) continue;                     // assez de forces déjà engagées
        if (somme < besoin && ennemi(j) && FOR[camp] >= 2 * FOR[p[j]]) {
          // Coup de grâce : le rival vaut moins de la moitié de mes forces, les sources voisines y vont presque entières.
          let tout = 0;
          for (let x = 0; x < ns; x++) tout += (x < vj.length || !portee2 ? dispoVers(SRC[x], j, true) : SRCD[x]);
          if (tout >= besoin) { somme = 0; for (let x = 0; x < ns; x++) { SRCD[x] = dispoVers(SRC[x], j, true); somme += SRCD[x]; } }
        }
        if (somme < besoin && !frappe && def >= 50) {
          const b0 = besoinDe(j, 0);
          if (somme >= b0 && valide(etat, camp, [4, j])) { ordres.push([4, j]); frappe = true; besoin = b0; }
        }
        if (somme < besoin) continue;
        for (let x = 0; x < ns && ordres.length < 6; x++) {
          const i = SRC[x], d = SRCD[x];
          const part = Math.max(1, div(besoin * d + somme - 1, somme));   // ceil(besoin × dispo / somme)
          if (envoi(i, j, part, d)) nAttaques++;
        }
      }
    }
    if ((actives & B_SURSAUT) && cc.r[1] === 0 && nAttaques >= 3) ordres.push([6]);

    // Passe 1c : concentration. Sans attaque possible, Rallier (capacité active) sur la source voisine de la
    // meilleure cible dont les voisins réunis (50 % de chacun) rendraient l'attaque possible : la décision
    // suivante attaque avec les forces rassemblées. Une seule concentration par décision.
    if (nAttaques === 0 && groupe && (actives & B_RALLIER) && ordres.length < 6) {
      let bi = -1, bs = 0;
      for (let j = 0; j < n; j++) {
        if (SCORE[j] === 0 && VAL[j] === 0) continue;
        if (!cible(j)) continue;
        const besoin = besoinDe(j, defense(etat, j));
        if (besoin < 1) continue;
        const vj = m.vois[j];
        for (let x = 0; x < vj.length; x++) {
          const s = vj[x];
          if (p[s] !== camp || DISPO[s] === 0 || (tenir && CIB[s] === 2)) continue;
          // Rallier prend 50 % de tous les voisins du nœud rallié : jamais à côté de la capitale à tenir.
          if (tenir && cc.cap >= 0 && CIB[cc.cap] === 2 && voisins(m, s, cc.cap)) continue;
          let reuni = dispoVers(s, j);
          const vs = m.vois[s];
          for (let y = 0; y < vs.length; y++) { const a = vs[y]; if (p[a] === camp && f[a] >= 2 && MEN[a] === 0 && (!tenir || CIB[a] !== 2)) reuni += div(f[a], 2); }
          if (reuni < besoin) continue;
          const sc = div(VAL[j] * 1000, besoin);
          if (sc > bs) { bs = sc; bi = s; cc.mem[0] = j; }
        }
      }
      if (bi >= 0) { ordres.push([3, bi]); cc.mem[1] = 50; }
    }

    // Passe 2 : défense. Un nœud menacé (flottes en approche, sièges) au-delà de sa défense effective :
    // Rallier (capacité active) pour la capitale ou un nœud à tenir, sinon 50 % de deux voisins sûrs (ni
    // menacés ni au front : dégarnir le front pour sauver un nœud offre deux nœuds à l'ennemi).
    for (let j = 0; j < n && ordres.length < 8; j++) {
      if (p[j] !== camp || MEN[j] === 0) continue;
      const Dj = div(f[j] * (100 + defense(etat, j)), 100);
      if (MEN[j] <= Dj) continue;
      if ((actives & B_RALLIER) && (j === cc.cap || CIB[j] === 2)) { if (!(j === cc.cap && rallieCap)) ordres.push([3, j]); continue; }
      const v = m.vois[j];
      let nb = 0;
      for (let x = 0; x < v.length && nb < 2 && ordres.length < 8; x++) {
        const i = v[x];
        // La capitale peut dégarnir pour sauver un voisin, sauf si c'est elle qu'il faut tenir (mission « tenir »).
        if (p[i] === camp && f[i] >= 4 && MEN[i] === 0 && (FRONT[i] === 0 || (i === cc.cap && !(tenir && CIB[i] === 2)))) { ordres.push([1, i, j, 50]); nb++; }
      }
    }
    // Fortins sur le front (personnalités prudentes), chantiers à l'intérieur (Hégémonie).
    if ((tech & B_FORTIN) && perso.fortinDes > 0) {
      for (let j = 0; j < n && ordres.length < 8; j++) {
        if (p[j] === camp && etat.b[j] === 0 && (FRONT[j] > 0 || CIB[j] === 2) && f[j] >= perso.fortinDes && f[j] > CAP.fortin.cout + 2) ordres.push([2, j, 1]);
      }
    }
    if ((tech & B_CHANTIER) && perso.fortinDes >= 60) {
      for (let j = 0; j < n && ordres.length < 8; j++) {
        if (p[j] === camp && etat.b[j] === 0 && FRONT[j] === 0 && f[j] > CAP.chantier.cout + 20) ordres.push([2, j, 3]);
      }
    }

    // Passe 3 : logistique. Un nœud intérieur avec f > 20 envoie 50 % (la capitale 25 %) vers le front : le
    // nœud de front le plus menacé (forces ennemies adjacentes, flottes en approche, voisins à prendre ; nœud à
    // tenir d'abord) à ≤ 3 arêtes par mes territoires avec Transfert, sinon le voisin le plus proche du front
    // (distance par mes territoires : les forces coulent de proche en proche jusqu'à la ligne).
    const poids = function (j) { return 2 * (MEN[j] + PRES[j]) + 10 * FRONT[j] + (CIB[j] === 2 ? 1000 : 0); };
    tampon++;
    let debutFile = 0, queue = 0;
    if (tete >= 0) { VIS[tete] = tampon; DIST[tete] = 0; FILE[queue++] = tete; }   // tête de pont : seul « front »
    else for (let i = 0; i < n; i++) if (p[i] === camp && (FRONT[i] > 0 || (tenir && CIB[i] === 2))) { VIS[i] = tampon; DIST[i] = 0; FILE[queue++] = i; }
    while (debutFile < queue) {
      const a = FILE[debutFile++], va = m.vois[a];
      for (let x = 0; x < va.length; x++) { const j = va[x]; if (p[j] === camp && VIS[j] !== tampon) { VIS[j] = tampon; DIST[j] = DIST[a] + 1; FILE[queue++] = j; } }
    }
    const marqueFront = tampon;
    for (let i = 0; i < n && ordres.length < 8; i++) {
      if (p[i] !== camp || (FRONT[i] > 0 && tete < 0) || f[i] <= 20 || (tenir && CIB[i] === 2) || VIS[i] !== marqueFront || DIST[i] === 0) continue;
      let cible = -1, bs = 0;
      if (actives & B_TRANSFERT) {
        tampon++;
        let t2 = 0, q2 = 0; FILE[q2++] = i; VIS[i] = tampon; PREV[i] = 0;
        while (t2 < q2) {
          const a = FILE[t2++];
          if (PREV[a] >= TRANSFERT_MAX) continue;
          const va = m.vois[a];
          for (let x = 0; x < va.length; x++) {
            const j = va[x];
            if (p[j] !== camp || VIS[j] === tampon) continue;
            VIS[j] = tampon; PREV[j] = PREV[a] + 1; FILE[q2++] = j;
            const sc = poids(j);
            if (sc > bs) { bs = sc; cible = j; }
          }
        }
      }
      if (cible < 0) {
        // Voisin le plus proche du front (puis le plus menacé).
        const v = m.vois[i];
        let bd = DIST[i];
        for (let x = 0; x < v.length; x++) { const j = v[x]; if (p[j] !== camp) continue; const sc = poids(j); if (DIST[j] < bd || (DIST[j] === bd && cible >= 0 && sc > bs)) { bd = DIST[j]; bs = sc; cible = j; } }
      }
      if (cible >= 0) ordres.push([1, i, cible, i === cc.cap ? 25 : 50]);
    }
    return ordres;
  }

  // Un rival vivant a-t-il une offensive annoncée ou en cours ? C'est l'information du bandeau (ev 8, émis
  // annonce ticks avant l'offensive) : le robot ne lit rien que le joueur ne voie.
  function offensiveAnnoncee(etat, camp) {
    for (let x = 0; x < etat.c.length; x++) {
      const cx = etat.c[x];
      if (x === camp || !cx.v || etat.ctl[x] === 0 || etat.eq[x] === etat.eq[camp]) continue;
      const po = personnalite(etat, x).offensive;
      if (po && (cx.mem[3] > 0 || (cx.mem[2] > 0 && cx.mem[2] <= po.annonce))) return true;
    }
    return false;
  }

  function voisinsPossedes(etat, j, camp) {
    const v = etat.m.vois[j];
    let nb = 0;
    for (let x = 0; x < v.length; x++) if (etat.p[v[x]] === camp) nb++;
    return nb;
  }

  // Offensive dirigée vers la capitale du joueur (mission 5 « Le siège », personnalités à offensive.cible 1).
  // Cible T : la capitale si l'un de mes nœuds la touche, sinon le nœud non possédé voisin de l'un des miens
  // le plus proche d'elle (en arêtes ; à distance égale, un neutre avant une région du joueur : le siège rampe
  // par les neutres, et un joueur compact peut finir sans perdre une région ; puis plus petit index). Mes
  // nœuds voisins de T y envoient 100 %
  // (il reste 1 force), les plus gros d'abord ; les autres poussent 75 % vers mon voisin le plus proche de T
  // (par mes territoires), de proche en proche : la vague s'étage sur la fenêtre de l'offensive. 8 ordres au
  // plus, fonction pure, rien de caché (le joueur voit chaque flotte partir).
  function offensiveDirigee(etat, camp, cap0) {
    const m = etat.m, n = etat.nn, p = etat.p, f = etat.f, eq = etat.eq;
    const dist = distancesDepuis(m, cap0, DCAP);
    let T = -1;
    const vc = m.vois[cap0];
    for (let x = 0; x < vc.length; x++) if (p[vc[x]] === camp) { T = cap0; break; }
    if (T < 0) {
      for (let j = 0; j < n; j++) {
        if (dist[j] <= 0 || p[j] === camp || (p[j] >= 0 && eq[p[j]] === eq[camp])) continue;
        if (voisinsPossedes(etat, j, camp) === 0) continue;
        const sj = 2 * dist[j] + (p[j] >= 0 ? 1 : 0);
        if (T < 0 || sj < 2 * dist[T] + (p[T] >= 0 ? 1 : 0)) T = j;
      }
    }
    if (T < 0) return VIDE;
    const dT = T === cap0 ? dist : distancesDepuis(m, T, DCIB);
    // Sources : mes nœuds à f ≥ 2, triés par forces décroissantes (tri par insertion sur ≤ 8 + 1 candidats).
    const ordres = [];
    let ns = 0;
    for (let i = 0; i < n; i++) if (p[i] === camp && f[i] >= 2) { SRC[ns] = i; ns++; if (ns === 24) break; }
    for (let a = 1; a < ns; a++) { const v = SRC[a]; let b = a - 1; while (b >= 0 && f[SRC[b]] < f[v]) { SRC[b + 1] = SRC[b]; b--; } SRC[b + 1] = v; }
    for (let x = 0; x < ns && ordres.length < 8; x++) if (voisins(m, SRC[x], T)) ordres.push([1, SRC[x], T, 100]);
    for (let x = 0; x < ns && ordres.length < 8; x++) {
      const i = SRC[x];
      if (voisins(m, i, T) || f[i] < 4) continue;
      const v = m.vois[i];
      let suivant = -1;
      for (let y = 0; y < v.length; y++) { const j = v[y]; if (p[j] === camp && dT[j] >= 0 && dT[j] < dT[i] && (suivant < 0 || dT[j] < dT[suivant])) suivant = j; }
      if (suivant >= 0) ordres.push([1, i, suivant, 75]);
    }
    return ordres;
  }

  // ---- Humain d'essai (robot de contrôle) ------------------------------------------------------------
  // Expansion gloutonne vers le voisin neutre le plus faible, puis attaque du rival le plus faible
  // (paisible : expansion seulement). Ne modifie jamais l'état ; le hasard vient du test.
  function essaisOrdres(etat, camp, alea, paisible) {
    const cc = etat.c[camp];
    if (!cc || cc.v !== 1) return [];
    const m = etat.m, n = etat.nn, p = etat.p, f = etat.f, eq = etat.eq;
    const ordres = [];
    const interieurs = [];
    for (let i = 0; i < n && ordres.length < 8; i++) {
      if (p[i] !== camp || f[i] < 4) continue;
      const v = m.vois[i];
      let cible = -1, cd = 0, front = false;
      for (let x = 0; x < v.length; x++) {
        const j = v[x];
        if (p[j] === camp || (p[j] >= 0 && eq[p[j]] === eq[camp])) continue;
        front = true;
        if (p[j] >= 0 && paisible) continue;
        const Dj = div(f[j] * (100 + defense(etat, j)), 100) + (p[j] >= 0 ? 1000 : 0);   // neutres d'abord
        if (cible < 0 || Dj < cd) { cible = j; cd = Dj; }
      }
      if (!front) { interieurs.push(i); continue; }
      if (cible < 0) continue;
      const Dj = div(f[cible] * (100 + defense(etat, cible)), 100);
      const besoin = Math.max(1, div(Dj * 120, 100) + 1 - siegeDe(etat, cible, camp));
      const pct = pourcentage(f[i], besoin, f[i] - 1);
      if (pct) ordres.push([1, i, cible, pct]);
      else if ((cc.t & B_RALLIER) && f[i] >= 10 && alea(4) === 0) ordres.push([3, i]);
    }
    // Nœuds intérieurs : la moitié vers un voisin de front (au hasard du test).
    for (let x = 0; x < interieurs.length && ordres.length < 8; x++) {
      const i = interieurs[x];
      if (f[i] < 8) continue;
      const v = m.vois[i], fronts = [];
      for (let y = 0; y < v.length; y++) if (p[v[y]] === camp && voisinsLibres(etat, v[y], camp)) fronts.push(v[y]);
      if (fronts.length) ordres.push([1, i, fronts[alea(fronts.length)], 50]);
    }
    return ordres;
  }
  function voisinsLibres(etat, j, camp) {
    const v = etat.m.vois[j];
    for (let x = 0; x < v.length; x++) if (etat.p[v[x]] !== camp) return true;
    return false;
  }

  function variete(etat) { return { p: etat.p.slice(), f: etat.f.slice() }; }

  racine.JEL_SIM = racine.PE_SIM = {
    camps: D.camps, periodeBot: 5, reglages: { tickMs: 100, delaiEntree: 1 },
    depart: depart, valide: valide, ordre: ordre, pas: pas, bot: bot, fin: fin,
    exporter: exporter, importer: importer, empreinte: empreinte,
    essais: { ordres: essaisOrdres, variete: variete, parties: 12, equite: 30, ticksFin: 20000 },
    configMission: configMission, chemin: chemin, duree: duree, defense: defense, prevision: prevision, generer: generer,
    carteDe: carteDe, tickSiege: tickSiege,
    SILHOUETTE: 0,
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script id="pe-pilote">
/* ==========================================================================
   Poussière d'Empire — pe-pilote : pilote local de la simulation (solo)
   window.PE_PILOTE = { PiloteLocal, Simulation }. Même interface que
   JEL_TR.Partie.local (contrat du lot 1, section 5) : à la bascule multijoueur,
   JEL_TR.Partie prend la place sans changer la simulation ni le jeu.

   Simulation est la recopie de la classe du moteur public/temps-reel/moteur.js
   (jel-tr v2 : constructeur, avancer, instantane, hachage, restaurer, k, hashDe,
   avec exporterEtat, importerEtat, empreinte, precedent, campsDe, REGLAGES) :
   même ordre dans le tick (contrôles, humains triés, robots (k + 3 × c) %
   periodeBot === 0, pas), hachage tous les 50 ticks, instantané tous les 300.
   Seule l'horloge (setTimeout, performance.now) est propre au pilote : jamais
   dans un calcul d'état.
   ========================================================================== */
(function (racine) {
  'use strict';
  const TR = racine.JEL_TR || racine.PE_OUTILS;
  const copie = TR.copie, aleaDe = TR.aleaDe, hacher = TR.hacher, ordreBienForme = TR.ordreBienForme, trierOrdres = TR.trierOrdres;

  // --- Recopie du moteur : réglages et simulation ---------------------------
  var T_CONTROLE = 0;                // type réservé aux ordres de contrôle (camp système)
  var REGLAGES = {
    tickMs: 100,                     // durée d'un tick
    delaiEntree: 2,                  // un ordre reçu au tick k est joué au tick k + delaiEntree
    hashTous: 50,                    // hachage de l'état tous les N ticks
    instantaneTous: 300,             // instantané gardé tous les N ticks (30 s)
    rattrapageMax: 50,               // ticks rejoués au plus par appel de la boucle (jamais de gel)
  };
  var RATTRAPAGE_LOCAL = 10;         // pilote local : rattrapage de 10 ticks au plus (contrat section 5)

  // Instantané, rebâti et empreinte d'un état (crochets facultatifs de la simulation).
  function exporterEtat(sim, etat) { return typeof sim.exporter === 'function' ? sim.exporter(etat) : copie(etat); }
  function importerEtat(sim, donnees) { return typeof sim.importer === 'function' ? sim.importer(copie(donnees)) : copie(donnees); }
  function empreinte(sim, etat) { return hacher(typeof sim.empreinte === 'function' ? sim.empreinte(etat) : etat); }
  // État précédent (interpolation du rendu) : seulement pour un état JSON simple.
  function precedent(sim, etat) { return typeof sim.exporter === 'function' ? null : copie(etat); }
  // config : { camps (nombre de camps de cette partie, sim.camps par défaut), ctl: [0 | 1..3 par
  // camp], … (propre au jeu : mode, carte, niveau…) }
  function campsDe(sim, config) {
    var n = config && config.camps;
    return Number.isInteger(n) && n >= 2 && n <= sim.camps ? n : sim.camps;
  }

  function Simulation(sim, graine, config, reglages) {
    this.sim = sim;
    this.r = Object.assign({}, REGLAGES, reglages || {});
    this.config = copie(config || {});
    var etat = sim.depart(graine >>> 0, copie(this.config));
    etat.k = 0;
    if (!Number.isInteger(etat.a)) etat.a = graine >>> 0;
    etat.ctl = [];
    for (var c = 0; c < campsDe(sim, this.config); c++) etat.ctl.push(Array.isArray(this.config.ctl) && Number.isInteger(this.config.ctl[c]) && this.config.ctl[c] >= 0 && this.config.ctl[c] <= 3 ? this.config.ctl[c] : 0);
    this.etat = etat;
    this.prec = precedent(sim, etat);
    this.resultat = sim.fin(etat);
    this.journal = [];               // [[k, ordres], …] depuis le plus ancien instantané gardé
    this.instantanes = [{ k: 0, etat: exporterEtat(sim, etat) }];
    this.hashes = [];                // [[k, h], …] (les 20 derniers)

    const dx = Math.abs(x - geo.x[i]), dy = Math.abs(y - geo.y[i]);
    if (geo.forme !== 1) return dx * dx + dy * dy <= geo.R * geo.R;
    // Hexagone pointe en haut : côtés verticaux en ±R·√3/2, pentes en |dy| ≤ R − |dx|/√3.
    return dx <= geo.R * SQ3 / 2 && dy <= geo.R - dx / SQ3;
  }

  // ---------- Motifs de terrain (couche cuite, en unités) ----------
  // Le chemin de la cellule est courant à l'appel (pour la teinte et le découpage) ; sombre (nuit) et clair (craie, or)
  // pour rester lisible sous la couleur de tout propriétaire. lod 0 : motif complet ; lod 1 : teinte de la calotte seule.
  function peindreTerrain(c, genre, cx, cy, R, lod) {
    if (genre === 3) {                      // calotte polaire : teinte glacée, puis hachures blanches
      c.fillStyle = 'rgba(207,238,255,0.16)'; c.fill();
      if (lod !== 0) return;
      c.save(); c.clip();
      c.lineWidth = R * 0.05; c.strokeStyle = rgba(PAL.craie, 0.38); c.lineCap = 'round'; c.beginPath();
      for (let k = -2; k <= 2; k++) { const d = k * R * 0.36; c.moveTo(cx - R + d, cy + R * 0.9); c.lineTo(cx + R * 0.9 + d, cy - R); }
      c.stroke(); c.restore();

      c.save(); c.clip();

      c.beginPath();
      c.moveTo(cx - R * 0.8, yb); c.lineTo(cx - R * 0.46, cy + R * 0.08); c.lineTo(cx - R * 0.2, yb - R * 0.14);
      c.lineTo(cx + R * 0.02, cy - R * 0.08); c.lineTo(cx + R * 0.26, yb - R * 0.12); c.lineTo(cx + R * 0.5, cy + R * 0.16); c.lineTo(cx + R * 0.8, yb); c.closePath();

      c.lineWidth = R * 0.04; c.lineJoin = 'round'; c.strokeStyle = rgba(PAL.craie, 0.6); c.stroke();
      c.beginPath(); c.moveTo(cx + R * 0.02, cy - R * 0.08); c.lineTo(cx + R * 0.13, cy + R * 0.08); c.lineTo(cx - R * 0.09, cy + R * 0.08); c.closePath();
      c.fillStyle = rgba(PAL.craie, 0.85); c.fill();

      c.lineWidth = R * 0.13; c.strokeStyle = rgba(PAL.nuit, 0.5); c.beginPath(); c.arc(cx, cyc, r, 0, TAU); c.stroke();
      c.lineWidth = R * 0.03; c.strokeStyle = rgba(PAL.craie, 0.35); c.beginPath(); c.arc(cx, cyc, r - R * 0.05, 0, TAU); c.stroke();
      c.lineWidth = R * 0.09; c.strokeStyle = rgba(PAL.or, 0.95); c.lineCap = 'round'; c.beginPath(); c.arc(cx, cyc, r, Math.PI * 1.12, Math.PI * 1.42); c.stroke();

    }

  // Balise (mission 6) : fanion doré planté à droite du glyphe, au-dessus du nombre ; la cible pulse par ailleurs en or.
  function peindreBalise(c, cx, cy, R) {

    c.lineWidth = R * 0.045; c.strokeStyle = PAL.craie; c.stroke();
