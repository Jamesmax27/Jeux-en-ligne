// ---------- 5. Génération de la cave ----------
function bfs(grid, W, H, sx, sy) {
  const dist = new Int16Array(W * H).fill(-1);
  const file = [sy * W + sx]; dist[file[0]] = 0;
  for (let k = 0; k < file.length; k++) {
    const i = file[k], x = i % W, y = (i / W) | 0;
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy, j = ny * W + nx;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H || grid[j] === 0 || dist[j] >= 0) continue;
      dist[j] = dist[i] + 1; file.push(j);
    }
  }
  return dist;
}
function essaiCave(cfg) {
  const W = cfg.taille, H = cfg.taille;
  const grid = new Uint8Array(W * H);   // 0 mur, 1 sol, 2 escalier, 3 escalier fermé (grille)
  const salles = [];
  for (let k = 0; k < 600 && salles.length < cfg.salles; k++) {
    const w = ri(4, 8), h = ri(4, 7), x = ri(1, W - w - 1), y = ri(1, H - h - 1);
    if (salles.some((r) => x < r.x + r.w + 1 && x + w + 1 > r.x && y < r.y + r.h + 1 && y + h + 1 > r.y)) continue;
    salles.push({ x, y, w, h, cx: x + (w >> 1), cy: y + (h >> 1) });
    for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) grid[yy * W + xx] = 1;
  }
  if (salles.length < 4) return null;
  // Couloirs en L : chaque salle est reliée à la plus proche des précédentes, plus deux boucles.
  const relier = (a, b) => {
    let x = a.cx, y = a.cy;
    const horiz = () => { while (x !== b.cx) { x += Math.sign(b.cx - x); grid[y * W + x] = 1; } };
    const vert = () => { while (y !== b.cy) { y += Math.sign(b.cy - y); grid[y * W + x] = 1; } };
    if (Math.random() < 0.5) { horiz(); vert(); } else { vert(); horiz(); }
  };
  for (let i = 1; i < salles.length; i++) {
    let best = 0, bd = 1e9;
    for (let j = 0; j < i; j++) {
      const d = Math.abs(salles[i].cx - salles[j].cx) + Math.abs(salles[i].cy - salles[j].cy);
      if (d < bd) { bd = d; best = j; }
    }
    relier(salles[i], salles[best]);
  }
  for (let k = 0; k < 2; k++) { const a = pick(salles), b = pick(salles); if (a !== b) relier(a, b); }
  const dep = salles[0];
  const dist = bfs(grid, W, H, dep.cx, dep.cy);
  let fin = salles[1], fd = -1;
  for (const r of salles) { const d = dist[r.cy * W + r.cx]; if (d > fd) { fd = d; fin = r; } }
  if (fd < Math.min(14, cfg.taille * 0.6)) return null;
  return { W, H, grid, salles, dep, fin, dist };
}
function genererCave(cfg) {
  for (let k = 0; k < 80; k++) { const c = essaiCave(cfg); if (c) return c; }
  return essaiCave({ ...cfg, salles: 4, taille: cfg.taille + 4 }) || essaiCave({ ...cfg, salles: 4, taille: 40 });
}

const COUL_GEMMES = ['#5ad1ff', '#ff6fae', '#7dff8a', '#ffd75a', '#c18bff'];
function nouvelEnnemi(t, x, y) {
  return { t, x, y, px: x, py: y, pv: TYPES[t], max: TYPES[t], n: 0, s: 0, cd: 0, eveil: false, charge: false, ax: 0, ay: 0, flash: 0 };
}
function peupler(cfg, cave) {
  const { W, grid, salles, dep, fin, dist } = cave;
  const occ = new Set([dep.cy * W + dep.cx]);
  const items = new Map(), ens = [], piq = new Map();
  const hors = salles.filter((r) => r !== dep);
  const dansSalle = (i) => { const x = i % W, y = (i / W) | 0; return salles.some((r) => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h); };
  // Une case libre au hasard dans une des salles données, assez loin du départ.
  const caseLibre = (liste, dmin = 2) => {
    for (let k = 0; k < 300; k++) {
      const r = pick(liste), x = ri(r.x, r.x + r.w - 1), y = ri(r.y, r.y + r.h - 1), i = y * W + x;
      if (grid[i] !== 1 || occ.has(i) || dist[i] < dmin) continue;
      occ.add(i); return i;
    }
    return -1;
  };
  const poser = (it, liste, dmin) => { const i = caseLibre(liste, dmin); if (i >= 0) items.set(i, it); return i; };
  const reste = { ...cfg.ennemis };

  // La sortie, ou le Gardien qui garde le Cristal.
  const iS = fin.cy * W + fin.cx; occ.add(iS);
  if (cfg.boss) ens.push(nouvelEnnemi('gardien', fin.cx, fin.cy));
  else grid[iS] = cfg.cles ? 3 : 2;

  if (cfg.cles) {
    const autres = salles.filter((r) => r !== dep && r !== fin);
    const iC = poser({ t: 'cle' }, autres.length ? autres : hors, 6);
    // Un champignon garde la clé de la grille.
    if (iC >= 0 && reste.champi > 0) {
      const kx = iC % W, ky = (iC / W) | 0;
      const voisins = DIRS.map(([dx, dy]) => (ky + dy) * W + kx + dx).filter((j) => grid[j] === 1 && !occ.has(j));
      if (voisins.length) { const j = pick(voisins); occ.add(j); ens.push(nouvelEnnemi('champi', j % W, (j / W) | 0)); reste.champi--; }
    }
    for (let k = 0; k < (cfg.coffre || 0); k++) { poser({ t: 'coffre' }, hors, 4); poser({ t: 'cle' }, hors, 4); }
  }
  // Armes : l'épée de fer de l'étage 3 est près du départ.
  for (const a of cfg.armes || []) {
    const proches = hors.slice().sort((p, q) => dist[p.cy * W + p.cx] - dist[q.cy * W + q.cx]);
    poser({ t: 'arme', a }, a === 'fer' ? [proches[0]] : hors, 3);
  }
  let gemmes = 0;
  for (let k = 0; k < cfg.gemmes; k++) if (poser({ t: 'gemme', c: pick(COUL_GEMMES) }, salles, 2) >= 0) gemmes++;
  for (let k = 0; k < (cfg.potions || 0); k++) poser({ t: 'potion' }, hors, 3);
  for (let k = 0; k < (cfg.parchemins || 0); k++) poser({ t: 'parchemin' }, salles, 2);
  for (const t of Object.keys(reste)) {
    for (let k = 0; k < reste[t]; k++) {
      const i = caseLibre(hors, 7);
      if (i >= 0) ens.push(nouvelEnnemi(t, i % W, (i / W) | 0));
    }
  }
  // Dalles à piques, surtout dans les couloirs.
  for (let k = 0, essais = 0; k < (cfg.piques || 0) && essais < 3000; essais++) {
    const i = ri(0, grid.length - 1);
    if (grid[i] !== 1 || occ.has(i) || dist[i] < 3) continue;
    if (dansSalle(i) && Math.random() < 0.65) continue;
    occ.add(i); piq.set(i, ri(0, 1)); k++;
  }
  return { items, ens, piq, gemmes };
}

// ---------- 6. Tours de jeu ----------
let S = null;            // état de la partie en cours
let ecranCourant = 'accueil';
let dernAction = 0;
const idx = (x, y) => y * S.W + x;

function lancer(mode, n, report) {
  const cfg = mode === 'prof' ? cfgProf(n) : ETAGES[n - 1];
  const cave = genererCave(cfg);
  const pop = peupler(cfg, cave);
  S = {
    mode, n, cfg, W: cave.W, H: cave.H, grid: cave.grid,
    seen: new Uint8Array(cave.W * cave.H), vis: new Uint8Array(cave.W * cave.H), dist: null,
    items: pop.items, ens: pop.ens, piq: pop.piq, gemmesTot: pop.gemmes,
    h: { x: cave.dep.cx, y: cave.dep.cy, px: cave.dep.cx, py: cave.dep.cy, dir: 1, ax: 0, ay: 0 },
    pv: cfg.pv, pvMax: cfg.pv, arme: ARMES[cfg.arme], potions: 0, parchemins: 0, cles: 0,
    gemmes: 0, vaincus: 0, perdu: 0, score: 0, tour: 0, fini: false, vue: 4,
    part: [], textes: [], secousse: 0, flash: 0, banniere: 1, debut: performance.now(),
  };
  if (report) { // Profondeurs : on garde cœurs, arme, potions et score d'un étage à l'autre
    S.pvMax = report.pvMax; S.pv = Math.min(report.pvMax, report.pv + 1);
    S.arme = report.arme; S.potions = report.potions; S.parchemins = report.parchemins; S.scoreAvant = report.score;
  } else if (mode === 'prof') { S.potions = 2; S.scoreAvant = 0; }
  calcVue();
  montrer('jeu');
  redimensionner();
  majHud(true);
  msg(objectif());
  // Tutoriel et nouvelles mécaniques jamais vues
  const aVoir = (cfg.intros || []).filter((k) => !sauv.vus[k]);
  if (aVoir.length) montrerIntros(aVoir);
}
function objectif() {
  if (S.cfg.boss) return t('objBoss');
  if (S.cfg.cles) return t('objCle');
  return t('objEscalier');
}
function peutJouer() {
  return S && ecranCourant === 'jeu' && !S.fini && $('intro').classList.contains('cache') && $('pause').classList.contains('cache');
}
function marchable(x, y) { return x >= 0 && y >= 0 && x < S.W && y < S.H && S.grid[idx(x, y)] !== 0; }
function ennemiA(x, y) { return S.ens.find((e) => e.x === x && e.y === y); }
function occupe(x, y) { return !!ennemiA(x, y) || (S.h.x === x && S.h.y === y); }

// Ce que la lanterne éclaire : lignes de vue jusqu'à S.vue cases.
function ligneDeVue(x0, y0, x1, y1) {
  let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx + dy, x = x0, y = y0;
  while (!(x === x1 && y === y1)) {
    if (!(x === x0 && y === y0) && S.grid[idx(x, y)] === 0) return false;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x += sx; }
    if (e2 <= dx) { err += dx; y += sy; }
  }
  return true;
}
function calcVue() {
  const R = S.vue, hx = S.h.x, hy = S.h.y;
  S.vis.fill(0);
  for (let y = Math.max(0, hy - R); y <= Math.min(S.H - 1, hy + R); y++) {
    for (let x = Math.max(0, hx - R); x <= Math.min(S.W - 1, hx + R); x++) {
      if ((x - hx) ** 2 + (y - hy) ** 2 > R * R + R) continue;
      if (ligneDeVue(hx, hy, x, y)) { const i = idx(x, y); S.vis[i] = 1; S.seen[i] = 1; }
    }
  }
}
function piqueLevee(x, y) {
  const ph = S.piq.get(idx(x, y));
  return ph !== undefined && (S.tour + ph) % 2 === 0;
}

// Action du joueur : un pas (dx, dy), ou attendre (0, 0).
function action(dx, dy) {
  if (!peutJouer()) return;
  const now = performance.now();
  if (now - dernAction < 110) return;
  dernAction = now;
  const h = S.h;
  if (dx || dy) {
    if (dx) h.dir = dx;
    const nx = h.x + dx, ny = h.y + dy, e = ennemiA(nx, ny);
    if (e) frapper(e, dx, dy);
    else if (!marchable(nx, ny)) { SON.mur(); h.ax = dx * 0.15; h.ay = dy * 0.15; return; }
    else if (S.grid[idx(nx, ny)] === 3) {
      if (S.cles > 0) {
        S.cles--; S.grid[idx(nx, ny)] = 2; SON.grille(); etincelles(nx, ny, '#ffcf5a', 18);
        msg(t('grilleOuvre')); pulse('cCle');
      } else { SON.mur(); h.ax = dx * 0.15; h.ay = dy * 0.15; msg(t('grilleFermee')); return; }
    } else {
      h.x = nx; h.y = ny; SON.pas();
      ramasser();
      if (S.fini) return;
      if (S.grid[idx(nx, ny)] === 2) { victoire(); return; }
    }
  } else texte(h.x, h.y - 0.2, 'Zz', '#bfc6e0');
  if (piqueLevee(h.x, h.y)) { SON.piques(); blesser(1); msg(t('aiePiques')); }
  finTour();
}
function finTour() {
  if (S.pv <= 0) { defaite(); return; }
  S.tour++;
  calcVue();
  S.dist = bfs(S.grid, S.W, S.H, S.h.x, S.h.y);
  for (const e of S.ens) if (S.vis[idx(e.x, e.y)] || (e.t === 'follet' && Math.abs(e.x - S.h.x) + Math.abs(e.y - S.h.y) <= 5)) e.eveil = true;
  for (const e of S.ens.slice()) { if (S.pv <= 0) break; agir(e); }
  calcVue();
  majHud();
  if (S.pv <= 0) defaite();
}
function frapper(e, dx, dy) {
  const h = S.h;
  h.ax = dx * 0.35; h.ay = dy * 0.35;
  e.pv -= S.arme.deg; e.flash = 1; e.eveil = true;
  SON.coup();
  texte(e.x, e.y - 0.3, '-' + S.arme.deg, '#ffffff');
  if (e.pv <= 0) {
    S.ens.splice(S.ens.indexOf(e), 1);
    SON.dissipe();
    bulles(e.x, e.y, COUL_ENNEMI[e.t]);
    const pts = e.t === 'gardien' ? 100 : 15;
    S.score += pts; S.vaincus++;
    texte(e.x, e.y, '+' + pts, '#ffe27a');
    if (e.t === 'gardien') {
      S.items.set(idx(e.x, e.y), { t: 'cristal' });
      S.secousse = 12;
      msg(t('gardienDissipe'));
      for (const g of S.ens.slice()) if (g.t === 'gluant') { S.ens.splice(S.ens.indexOf(g), 1); bulles(g.x, g.y, COUL_ENNEMI.gluant); }
    } else if (S.vaincus === 1 && S.mode === 'etage' && S.n <= 3) msg(t('pouf'));
  }
}
function blesser(n) {
  if (S.fini) return;
  S.pv -= n; S.perdu += n;
  S.secousse = 8; S.flash = 1;
  SON.aie();
  texte(S.h.x, S.h.y - 0.3, '-' + n, '#ff6b6b');
  if (S.pv === 1) msg(t('unCoeur'));
}
function ramasser() {
  const i = idx(S.h.x, S.h.y), it = S.items.get(i);
  if (!it) return;
  const { x, y } = S.h;
  switch (it.t) {
    case 'gemme':
      S.items.delete(i); S.gemmes++; S.score += 10; SON.gemme(); etincelles(x, y, it.c, 14); texte(x, y, '+10', '#ffe27a');
      if (S.gemmes === S.gemmesTot) { msg(t('toutesGemmes')); confettis(40); }
      break;
    case 'potion':
      S.items.delete(i); S.potions++; SON.potion(); texte(x, y, t('fxPotion'), '#ff9ab0'); pulse('bPotion');
      msg(t('potionMsg'));
      break;
    case 'cle':
      S.items.delete(i); S.cles++; SON.cle(); texte(x, y, t('fxCle'), '#ffcf5a'); pulse('cCle');
      msg(S.grid.includes(3) ? t('cleGrille') : t('cleCoffre'));
      break;
    case 'arme':
      S.items.delete(i);
      if (ARMES[it.a].rang > S.arme.rang) {
        S.arme = ARMES[it.a]; SON.arme(); etincelles(x, y, '#cfe8ff', 20); pulse('cArme');
        msg(t('armeMsg', { nom: t(S.arme.nom), n: S.arme.deg }));
      } else { S.score += 5; texte(x, y, '+5', '#ffe27a'); SON.gemme(); }
      break;
    case 'parchemin':
      S.items.delete(i); S.parchemins++; SON.cle(); pulse('bParch');
      msg(t('parcheminMsg'));
      break;
    case 'coffre':
      if (S.cles > 0) {
        S.cles--; it.t = 'ouvert'; S.score += 50; S.potions++; SON.coffre();
        etincelles(x, y, '#ffd75a', 26); texte(x, y, '+50', '#ffe27a'); pulse('bPotion');
        msg(t('coffreMsg'));
      } else msg(t('coffreFerme'));
      break;
    case 'cristal':
      S.items.delete(i); etincelles(x, y, '#c59bff', 30); victoire();
      break;
  }
}
function boirePotion() {
  if (!peutJouer()) return;
  if (S.potions <= 0) { msg(t('pasPotion')); SON.mur(); return; }
  if (S.pv >= S.pvMax) { msg(t('coeursPleins')); return; }
  S.potions--; S.pv = Math.min(S.pvMax, S.pv + 2);
  SON.potion(); etincelles(S.h.x, S.h.y, '#ff7a95', 16); texte(S.h.x, S.h.y - 0.3, '+2', '#ff9ab0');
  finTour();
}
function lireParchemin() {
  if (!peutJouer()) return;
  if (S.parchemins <= 0) { msg(t('pasParchemin')); SON.mur(); return; }
  S.parchemins--;
  for (let i = 0; i < S.grid.length; i++) {
    if (S.grid[i] !== 0) { S.seen[i] = 1; continue; }
    const x = i % S.W, y = (i / S.W) | 0;
    if (DIRS.some(([dx, dy]) => marchable(x + dx, y + dy))) S.seen[i] = 1;
  }
  SON.parchemin(); S.flash = -1;
  msg(t('lumiere'));
  majHud();
}

// Tour d'un Brumelin : chacun a son caractère.
function adjacent(e) { return Math.abs(e.x - S.h.x) + Math.abs(e.y - S.h.y) === 1; }
function attaque(e, n) { e.ax = (S.h.x - e.x) * 0.4; e.ay = (S.h.y - e.y) * 0.4; blesser(n); }
function approcher(e) {
  const d0 = S.dist[idx(e.x, e.y)];
  let best = null, bd = d0 < 0 ? 1e9 : d0;
  for (const [dx, dy] of melange(DIRS)) {
    const nx = e.x + dx, ny = e.y + dy;
    if (!marchable(nx, ny) || occupe(nx, ny) || S.grid[idx(nx, ny)] >= 2) continue;
    const d = S.dist[idx(nx, ny)];
    if (d >= 0 && d < bd) { bd = d; best = [nx, ny]; }
  }
  if (best) { e.x = best[0]; e.y = best[1]; }
}
function errer(e) {
  const opts = DIRS.filter(([dx, dy]) => marchable(e.x + dx, e.y + dy) && !occupe(e.x + dx, e.y + dy) && S.grid[idx(e.x + dx, e.y + dy)] < 2);
  if (opts.length) { const [dx, dy] = pick(opts); e.x += dx; e.y += dy; }
}
function voler(e) { // le feu follet passe à travers les murs
  let best = null, bd = Math.abs(e.x - S.h.x) + Math.abs(e.y - S.h.y);
  for (const [dx, dy] of melange(DIRS)) {
    const nx = e.x + dx, ny = e.y + dy;
    if (nx < 1 || ny < 1 || nx >= S.W - 1 || ny >= S.H - 1 || occupe(nx, ny)) continue;
    const d = Math.abs(nx - S.h.x) + Math.abs(ny - S.h.y);
    if (d < bd) { bd = d; best = [nx, ny]; }
  }
  if (best) { e.x = best[0]; e.y = best[1]; }
}
function ligneVers(e, portee) { // le crapaud voit-il le lutin en ligne droite ?
  const h = S.h;
  if (e.x !== h.x && e.y !== h.y) return null;
  const d = Math.abs(h.x - e.x) + Math.abs(h.y - e.y);
  if (d > portee) return null;
  const dx = Math.sign(h.x - e.x), dy = Math.sign(h.y - e.y);
  for (let k = 1; k < d; k++) if (S.grid[idx(e.x + dx * k, e.y + dy * k)] === 0) return null;
  return [dx, dy];
}
function cracher(e) {
  const [dx, dy] = e.dirTir;
  let x = e.x, y = e.y, touche = false;
  for (let k = 1; k <= 6; k++) {
    if (!marchable(x + dx, y + dy)) break;
    x += dx; y += dy;
    if (x === S.h.x && y === S.h.y) { touche = true; break; }
  }
  SON.crache();
  S.part.push({ tir: true, x0: e.x, y0: e.y, x1: x, y1: y, v: 0.25, max: 0.25 });
  if (touche) { blesser(1); msg(t('crapaud')); }
}
function agir(e) {
  e.n++;
  switch (e.t) {
    case 'gluant': // lent : un tour sur deux
      if (e.n % 2) return;
      if (adjacent(e)) attaque(e, 1);
      else if (e.eveil) approcher(e);
      else if (Math.random() < 0.3) errer(e);
      break;
    case 'chauve': // rapide, vole à moitié au hasard
      if (adjacent(e) && Math.random() < 0.75) attaque(e, 1);
      else if (e.eveil && Math.random() < 0.5) approcher(e);
      else errer(e);
      break;
    case 'champi': // immobile, frappe un tour sur deux quand on est à côté
      e.alerte = adjacent(e);
      if (e.alerte && e.n % 2 === 0) attaque(e, 1);
      break;
    case 'crapaud': // gonfle quand il est aligné, puis crache au tour suivant
      if (e.charge) { cracher(e); e.charge = false; e.cd = 2; return; }
      if (e.cd > 0) e.cd--;
      if (e.eveil && e.cd === 0) {
        const l = ligneVers(e, 6);
        if (l) { e.charge = true; e.dirTir = l; SON.gonfle(); return; }
      }
      if (e.eveil && Math.abs(e.x - S.h.x) + Math.abs(e.y - S.h.y) > 3) approcher(e);
      else if (Math.random() < 0.4) errer(e);
      break;
    case 'follet': // traverse les murs, deux tours sur trois
      if (e.n % 3 === 0) return;
      if (adjacent(e)) attaque(e, 1);
      else if (e.eveil) voler(e);
      break;
    case 'gardien': // lent, frappe fort, appelle des gluants
      if (!e.eveil) return;
      e.s++;
      if (e.s % 6 === 0 && S.ens.filter((g) => g.t === 'gluant').length < 4) {
        const libres = DIRS.map(([dx, dy]) => [e.x + dx, e.y + dy]).filter(([x, y]) => marchable(x, y) && !occupe(x, y));
        if (libres.length) {
          const [x, y] = pick(libres), g = nouvelEnnemi('gluant', x, y);
          g.eveil = true; S.ens.push(g); SON.appel(); bulles(x, y, COUL_ENNEMI.gluant);
          msg(t('appelGluant'));
        }
        return;
      }
      if (e.n % 2) return;
      if (adjacent(e)) attaque(e, 2);
      else approcher(e);
      break;
  }
}

// Fin d'étage
// 3e étoile : peu de cœurs perdus (un peu plus de marge contre le Gardien, qui frappe fort)
const coeursToleres = () => (S.cfg.boss ? 3 : 1);
function etoilesGagnees() { return 1 + (S.gemmes >= S.gemmesTot ? 1 : 0) + (S.perdu <= coeursToleres() ? 1 : 0); }
function victoire() {
  S.fini = true;
  SON.victoire();
  const bonusCoeurs = S.pv * 10;
  S.score += 50 + bonusCoeurs;
  const et = etoilesGagnees();
  let record = false;
  if (S.mode === 'etage') {
    const k = S.n - 1;
    const ancien = sauv.scores[k] || 0;
    if (S.score > ancien) { record = ancien > 0; sauv.scores[k] = S.score; }
    sauv.etoiles[k] = Math.max(sauv.etoiles[k] || 0, et);
    if (S.n < NB_ETAGES) sauv.debloque = Math.max(sauv.debloque, S.n + 1);
    else sauv.fini = true;
    // Étage réussi : on reprendra au suivant (le 10e reste le dernier).
    JEL_SAVE.save(JEU, { niveau: Math.min(S.n + 1, NB_ETAGES), score: 0 });
  } else {
    const total = S.scoreAvant + S.score;
    if (S.n > sauv.prof) { sauv.prof = S.n; record = true; }
    if (total > sauv.profScore) { sauv.profScore = total; record = true; }
  }
  sauver();
  confettis(90);
  setTimeout(() => montrerBilan(true, et, bonusCoeurs, record), 900);
}
function defaite() {
  if (S.fini) return;
  S.fini = true; S.pv = 0;
  majHud();
  SON.epuise();
  bulles(S.h.x, S.h.y, '#ffb38a');
  let record = false;
  if (S.mode === 'prof') {
    const total = S.scoreAvant + S.score;
    if (total > sauv.profScore) { sauv.profScore = total; record = true; sauver(); }
  }
  setTimeout(() => montrerBilan(false, 0, 0, record), 1100);
}

// ---------- 7. Rendu ----------
const cv = $('cv'), ctx = cv.getContext('2d');
let cw = 0, ch = 0, ts = 40, dpr = 1;
function redimensionner() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const z = $('zone');
  cw = z.clientWidth; ch = z.clientHeight;
  cv.width = Math.max(1, Math.round(cw * dpr)); cv.height = Math.max(1, Math.round(ch * dpr));
  ts = Math.max(30, Math.min(64, Math.floor(Math.min(cw / 9, ch / 10))));
  const art = $('art');
  art.width = Math.round(art.clientWidth * dpr); art.height = Math.round(art.clientHeight * dpr);
  const fx = $('fx');
  fx.width = Math.round(fx.clientWidth * dpr); fx.height = Math.round(fx.clientHeight * dpr);
}
window.addEventListener('resize', redimensionner);

// Effets : étincelles, bulles, textes qui s'envolent
function etincelles(x, y, coul, n) {
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 2.5;
    S.part.push({ x: x + 0.5, y: y + 0.5, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5, g: 4, v: 0.7, max: 0.7, c: coul, r: 0.05 + Math.random() * 0.05, etoile: k % 3 === 0 });
  }
}
function bulles(x, y, coul) {
  for (let k = 0; k < 14; k++) {
    const a = Math.random() * Math.PI * 2, v = 0.4 + Math.random() * 1.2;
    S.part.push({ x: x + 0.5, y: y + 0.5, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.8, g: -0.5, v: 0.9, max: 0.9, c: coul, r: 0.06 + Math.random() * 0.1, bulle: true });
  }
}
function texte(x, y, t, c) { S.textes.push({ x: x + 0.5, y: y + 0.2, t, c, v: 1 }); }

function dessinerJeu(t, dt) {
  const c = ctx;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = '#07080f'; c.fillRect(0, 0, cw, ch);
  if (!S) return;
  const k = Math.min(1, dt / 70);
  const h = S.h;
  h.px += (h.x - h.px) * k; h.py += (h.y - h.py) * k;
  h.ax *= 0.8; h.ay *= 0.8;
  S.secousse *= 0.88;
  const sx = (Math.random() - 0.5) * S.secousse, sy = (Math.random() - 0.5) * S.secousse;
  const camX = h.px * ts + ts / 2 - cw / 2 + sx, camY = h.py * ts + ts / 2 - ch / 2 + sy;
  c.save(); c.translate(-Math.round(camX), -Math.round(camY));
  const x0 = Math.max(0, Math.floor(camX / ts) - 1), x1 = Math.min(S.W - 1, Math.ceil((camX + cw) / ts) + 1);
  const y0 = Math.max(0, Math.floor(camY / ts) - 1), y1 = Math.min(S.H - 1, Math.ceil((camY + ch) / ts) + 1);
  // Décor (seulement ce qui a déjà été vu : la mémoire de la cave)
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const i = idx(x, y);
      if (!S.seen[i]) continue;
      const g = S.grid[i], px = x * ts, py = y * ts;
      if (g === 0) dessMur(c, px, py, ts, y + 1 < S.H && S.grid[i + S.W] !== 0 && S.seen[i + S.W]);
      else {
        dessSol(c, px, py, ts, x, y);
        if (g >= 2) dessEscalier(c, px, py, ts, g === 3);
        if (S.piq.has(i)) dessPiques(c, px, py, ts, piqueLevee(x, y));
      }
    }
  }
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const i = idx(x, y);
      if (!S.seen[i]) continue;
      const it = S.items.get(i);
      if (it) dessItem(c, it, x * ts + ts / 2, y * ts + ts / 2, ts, t);
      if (!S.vis[i]) { c.fillStyle = 'rgba(6,8,18,.6)'; c.fillRect(x * ts, y * ts, ts + 0.5, ts + 0.5); }
    }
  }
  // Brumelins visibles
  for (const e of S.ens) {
    e.px += (e.x - e.px) * k; e.py += (e.y - e.py) * k; e.ax *= 0.8; e.ay *= 0.8;
    if (!S.vis[idx(e.x, e.y)]) continue;
    const ex = (e.px + e.ax + 0.5) * ts, ey = (e.py + e.ay + 0.5) * ts;
    DESS_ENNEMI[e.t](c, ex, ey, ts, t, e.t === 'crapaud' ? e.charge : e.alerte);
    if (e.flash > 0) {
      c.globalAlpha = e.flash; disque(c, ex, ey, ts * 0.42, 'rgba(255,255,255,.8)'); c.globalAlpha = 1;
      e.flash = Math.max(0, e.flash - dt / 250);
    }
    if (e.pv < e.max) { // points de vie restants
      const w = ts * 0.7, by = ey - ts * (e.t === 'gardien' ? 0.85 : 0.52);
      c.fillStyle = '#0009'; c.fillRect(ex - w / 2, by, w, ts * 0.08);
      c.fillStyle = '#ff7a6e'; c.fillRect(ex - w / 2, by, w * e.pv / e.max, ts * 0.08);
    }
  }
  // Le lutin
  dessHeros(c, (h.px + h.ax + 0.5) * ts, (h.py + h.ay + 0.5) * ts, ts, t, h.dir);
  // Particules et tirs
  for (const p of S.part) {
    p.v -= dt / 1000;
    if (p.tir) {
      const q = 1 - p.v / p.max;
      disque(c, (p.x0 + (p.x1 - p.x0) * q + 0.5) * ts, (p.y0 + (p.y1 - p.y0) * q + 0.5) * ts, ts * 0.12, '#a8f0d6');
      continue;
    }
    p.vy += p.g * dt / 1000; p.x += p.vx * dt / 1000; p.y += p.vy * dt / 1000;
    c.globalAlpha = Math.max(0, p.v / p.max);
    if (p.bulle) { c.strokeStyle = p.c; c.lineWidth = 2; c.beginPath(); c.arc(p.x * ts, p.y * ts, p.r * ts, 0, Math.PI * 2); c.stroke(); }
    else if (p.etoile) { c.fillStyle = p.c; c.font = `${ts * 0.35}px system-ui, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('★', p.x * ts, p.y * ts); }
    else disque(c, p.x * ts, p.y * ts, p.r * ts, p.c);
    c.globalAlpha = 1;
  }
  S.part = S.part.filter((p) => p.v > 0);
  c.font = `900 ${Math.round(ts * 0.42)}px system-ui, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const tx of S.textes) {
    tx.v -= dt / 1000; tx.y -= dt / 1000 * 0.9;
    c.globalAlpha = Math.max(0, Math.min(1, tx.v * 2));

    const ok = n <= sauv.debloque, e = sauv.etoiles[n - 1] || 0;
    b.disabled = !ok;
    b.setAttribute('aria-label', t('etageN', { n }));
    b.innerHTML = `<small>${t('etage')}</small><b>${n}</b><span class="ets">${'<i>★</i>'.repeat(e)}${'★'.repeat(3 - e)}</span>`;
    if (!ok) b.querySelector('.ets').textContent = t('ferme');
    b.addEventListener('click', () => { SON.clic(); lancer('etage', n); });
    g.appendChild(b);
  }
  const p = document.createElement('button');
  p.className = 'niv prof';
  p.disabled = !sauv.fini;
  p.innerHTML = sauv.fini ? `<b>${t('profondeurs')}</b><small>${sauv.prof ? t('recordProfN', { n: sauv.prof }) : t('recordAucun')}</small>` : `<b>${t('profondeurs')}</b><small>${t('apres10')}</small>`;
  p.addEventListener('click', () => { SON.clic(); lancer('prof', 1); });
  g.appendChild(p);
}
// Cœurs, gemmes, score et sac
let pvAffiche = -1;
function majHud(tout) {
  if (!S) return;
  const zc = $('coeurs');
  if (tout || zc.children.length !== S.pvMax || pvAffiche !== S.pv) {
    zc.textContent = '';
    for (let k = 0; k < S.pvMax; k++) {
      const im = document.createElement('img');
      im.src = k < S.pv ? ICONES.coeur : ICONES.vide; im.alt = '';
      if (!tout && k >= S.pv && k < pvAffiche) im.className = 'perdu';
      zc.appendChild(im);
    }
    pvAffiche = S.pv;
  }
  $('hEtage').textContent = nomEtage();
  $('hGem').textContent = `${S.gemmes}/${S.gemmesTot}`;
  $('hScore').textContent = (S.scoreAvant || 0) + S.score;
  $('iArme').src = ICONES[Object.keys(ARMES).find((a) => ARMES[a] === S.arme)];
  $('tArme').textContent = t('force', { n: S.arme.deg });
  $('tCle').textContent = S.cles;
  $('tPotion').textContent = S.potions;
  $('tParch').textContent = S.parchemins;
  $('bPotion').classList.toggle('vide', S.potions === 0);
  $('bParch').classList.toggle('vide', S.parchemins === 0);
}
function pulse(id) { const e = $(id); e.classList.remove('pulse'); void e.offsetWidth; e.classList.add('pulse'); majHud(); }
let minuterieMsg = 0;
function msg(t) {
  const m = $('msg');
  m.textContent = fr(t); m.style.opacity = 1;
  clearTimeout(minuterieMsg);
  minuterieMsg = setTimeout(() => { m.style.opacity = 0; }, 4000);
}

// Bilan de fin d'étage : étoiles une à une et score qui défile
function montrerBilan(gagne, et, bonusCoeurs, record) {
  if (ecranCourant !== 'jeu' || !S) return;
  const prof = S.mode === 'prof';
  $('bTitre').textContent = gagne
    ? (S.cfg.boss && !prof ? t('cristalRapporte') : t(prof ? 'reussiProf' : 'reussiEtage', { n: S.n }))
    : t('epuise');
  const spans = $('bEtoiles').querySelectorAll('span');
  spans.forEach((s) => s.classList.remove('on'));
  $('bEtoiles').style.display = gagne ? '' : 'none';
  const lignes = [];
  if (gagne) {
    lignes.push(`<i>★</i> ${t('sortie')}`);
    lignes.push(`${S.gemmes >= S.gemmesTot ? '<i>★</i>' : '☆'} ${t('gemmes', { a: S.gemmes, b: S.gemmesTot })}`);
    lignes.push(`${S.perdu <= coeursToleres() ? '<i>★</i>' : '☆'} ${t('coeursPerdus', { a: S.perdu, b: coeursToleres() })}`);
    lignes.push(t('dissipes', { a: S.vaincus, b: bonusCoeurs }));
    if (S.cfg.boss && !prof) lignes.push(t('profOuvertes'));
  } else {
    lignes.push(t('bilanDefaite', { a: S.gemmes, b: S.gemmesTot, c: S.vaincus }));
    lignes.push(prof ? t('profArrive', { n: S.n, r: sauv.prof || 0 }) : t('astuce'));
  }
  $('bDetail').innerHTML = fr(lignes.join('<br>'));
  const total = prof ? S.scoreAvant + S.score : S.score;
  const rec = prof ? sauv.profScore : sauv.scores[S.n - 1] || 0;
  $('bRecord').textContent = record ? t('nouveauRecord') : (rec ? t('recordN', { n: rec }) : '');
  $('bSuivant').classList.toggle('cache', !gagne);
  $('bSuivant').textContent = prof ? t('suivantBas') : (S.n === NB_ETAGES ? t('lesProfondeurs') : t('suivant'));
  $('bilan').classList.remove('cache');
  // Compteur qui défile
  const deb = performance.now();
  const tour = (now) => {
    const q = Math.min(1, (now - deb) / 1100);
    $('bPts').textContent = Math.round(total * (1 - (1 - q) ** 3));
    if (q < 1 && !$('bilan').classList.contains('cache')) requestAnimationFrame(tour);
  };
  requestAnimationFrame(tour);
  for (let k = 0; k < et; k++) setTimeout(() => { spans[k].classList.add('on'); SON.etoile(k); confettis(25); }, 450 + k * 450);
  if (record) setTimeout(() => confettis(60), 450 + et * 450);
}
$('bSuivant').addEventListener('click', () => {
  SON.clic();
  if (S.mode === 'prof') lancer('prof', S.n + 1, { pv: S.pv, pvMax: S.pvMax, arme: S.arme, potions: S.potions, parchemins: S.parchemins, score: S.scoreAvant + S.score });
  else if (S.n < NB_ETAGES) lancer('etage', S.n + 1);
  else lancer('prof', 1);
});
$('bRejouer').addEventListener('click', () => { SON.clic(); if (S.mode === 'prof') lancer('prof', 1); else lancer('etage', S.n); });
$('bCarte').addEventListener('click', () => { SON.clic(); montrer('etages'); });
$('bPause').addEventListener('click', () => { if (!S || S.fini) return; SON.clic(); $('pause').classList.remove('cache'); });
$('bReprendre').addEventListener('click', () => { SON.clic(); $('pause').classList.add('cache'); });
$('bRecommencer').addEventListener('click', () => { SON.clic(); if (S.mode === 'prof') lancer('prof', 1); else lancer('etage', S.n); });
$('bQuitter').addEventListener('click', () => { SON.clic(); montrer('etages'); });
$('bJouer').addEventListener('click', () => {
  SON.clic();
  JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => lancer('etage', Math.max(1, Math.min(d.niveau, NB_ETAGES))),
    onNouvelle: () => {
      // Reprend au premier étage pas encore réussi.
      let n = 1;
      while (n < sauv.debloque && sauv.etoiles[n - 1]) n++;
      lancer('etage', Math.min(n, NB_ETAGES));
    },
  });
});
$('bEtages').addEventListener('click', () => { SON.clic(); montrer('etages'); });
$('bProf').addEventListener('click', () => { SON.clic(); lancer('prof', 1); });
$('bRetour').addEventListener('click', () => { SON.clic(); montrer('accueil'); });

// Bouton du son (choix mémorisé)
function majSon() {
  $('btnSon').innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="#f3eee2"/>${sauv.son
    ? '<path d="M16 9 Q18.5 12 16 15 M18.5 6.5 Q23 12 18.5 17.5" stroke="#f3eee2" stroke-width="2" fill="none" stroke-linecap="round"/>'
    : '<path d="M16 9 L22 15 M22 9 L16 15" stroke="#ff7a6e" stroke-width="2.4" stroke-linecap="round"/>'}</svg>`;
  $('btnSon').setAttribute('aria-label', sauv.son ? t('sonCouper') : t('sonRemettre'));
}
$('btnSon').addEventListener('click', (ev) => { ev.stopPropagation(); sauv.son = !sauv.son; sauver(); majSon(); SON.clic(); });

// ---------- 11. Confettis ----------
const fx = $('fx'), fctx = fx.getContext('2d');
let confs = [];
function confettis(n) {
  const w = fx.clientWidth;
  for (let k = 0; k < n; k++) {
    confs.push({ x: Math.random() * w, y: -10 - Math.random() * 80, vx: (Math.random() - 0.5) * 80, vy: 80 + Math.random() * 160,
      r: Math.random() * 6, vr: (Math.random() - 0.5) * 10, c: pick(['#ffcf5a', '#ff6fae', '#5ad1ff', '#7dff8a', '#c18bff']), w: 5 + Math.random() * 5 });
  }
}
function dessinerConfettis(dt) {
  if (!confs.length) { if (fx.dataset.vide !== '1') { fctx.setTransform(1, 0, 0, 1, 0, 0); fctx.clearRect(0, 0, fx.width, fx.height); fx.dataset.vide = '1'; } return; }
  fx.dataset.vide = '0';
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, fx.width, fx.height);
  const h = fx.clientHeight;
  for (const p of confs) {
    p.x += p.vx * dt / 1000; p.y += p.vy * dt / 1000; p.r += p.vr * dt / 1000;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.fillStyle = p.c; fctx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); fctx.restore();
  }
  confs = confs.filter((p) => p.y < h + 20);
}

// ---------- 12. Démarrage ----------
let tPrec = performance.now();
function boucle(t) {
  const dt = Math.min(60, t - tPrec); tPrec = t;
  if (ecranCourant === 'jeu') dessinerJeu(t, dt);
  else if (ecranCourant === 'accueil') dessinerArt(t);
  dessinerIntro(t);
  dessinerConfettis(dt);
  requestAnimationFrame(boucle);
}
charger();
preparerIcones();
$('iGem').src = ICONES.gemme; $('iCle').src = ICONES.cle; $('iPotion').src = ICONES.potion; $('iParch').src = ICONES.parchemin;
majSon();
effacerSauvegarde = JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('accueil') });
montrer('accueil');
redimensionner();
requestAnimationFrame(boucle);
</script>
