<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],

    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }

      return Promise.resolve(c);

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +

    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });

  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });

      menu.append(li);

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)

        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);

      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();

      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();

    });

    });
    bouton.addEventListener('keydown', function (e) {

      e.stopPropagation();

      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {

    }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.

    try { texte = JSON.stringify(tout); } catch (e) { return false; }

      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? texte('score', { n: d.score })
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>
  :root {
    --fond: #0d0f1c;
    --carte: #1b1f33;
    --bouton: #2b3150;
    --or: #ffcf5a;
    --texte: #f3eee2;
    --doux: #aab1c9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--fond); color: var(--texte);
    font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #app { position: fixed; inset: 0; max-width: 540px; margin: 0 auto; overflow: hidden;
    background: radial-gradient(ellipse at 50% 0%, #252a4a 0%, #11132a 55%, #090a14 100%); }
  .ecran { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .cache { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; min-height: 44px; min-width: 44px; border-radius: 14px; }
  button:focus { outline: none; }
  .gros {
    background: linear-gradient(#ffdc78, #f0a830); color: #3a2306; font-weight: 800; font-size: 1.45rem;
    padding: 14px 40px; box-shadow: 0 5px 0 #b87314, 0 8px 20px #0008;
  }
  .gros:active, .second:active { transform: translateY(3px); }
  .second { background: var(--bouton); color: var(--texte); font-weight: 700; padding: 10px 18px; box-shadow: 0 4px 0 #161a2c; }
  .second[disabled] { opacity: .45; }
  #btnSon { position: absolute; top: 6px; right: 6px; z-index: 50; background: #2b3150dd; width: 44px; height: 44px;
    display: grid; place-items: center; padding: 0; }
  #btnSon svg { width: 26px; height: 26px; }
  #coinLangue { position: absolute; top: 6px; right: 56px; z-index: 50; }

  /* ---------- Accueil ---------- */
  #accueil { align-items: center; justify-content: center; gap: 12px; padding: 16px; text-align: center; }
  #art { width: min(92vw, 380px); height: min(56vw, 230px); }
  h1 { margin: 0; font-size: clamp(2.2rem, 10vw, 3.3rem); line-height: 1.02; letter-spacing: .5px;
    color: var(--or); text-shadow: 0 3px 0 #8a4b10, 0 0 24px #ffcf5a55; }
  .regle { margin: 0; max-width: 340px; color: var(--doux); font-size: 1.05rem; line-height: 1.35; }
  .ligne { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #recAccueil { margin: 0; color: var(--doux); font-size: .95rem; min-height: 1.2em; }

  /* ---------- Étages ---------- */
  #etages { padding: 12px 14px; gap: 12px; align-items: center; }
  .barre { display: flex; align-items: center; gap: 12px; width: 100%; padding-right: 100px; }
  .barre h2 { margin: 0; font-size: 1.5rem; color: var(--or); }
  #grilleNiv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 420px; }
  .niv { background: var(--carte); border: 2px solid #343a5c; padding: 8px 4px; display: flex; flex-direction: column;
    align-items: center; gap: 2px; min-height: 84px; box-shadow: 0 4px 0 #0b0d18; }
  .niv b { font-size: 1.7rem; }
  .niv small { color: var(--doux); font-size: .78rem; }
  .niv .ets { font-size: 1.05rem; letter-spacing: 1px; color: #3d4364; }
  .niv .ets i { font-style: normal; color: var(--or); }
  .niv[disabled] { opacity: .45; }
  .niv.prof { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 10px; min-height: 60px;
    background: linear-gradient(90deg, #2b1f4a, #1b2346); border-color: #6a4fb0; }

  /* ---------- Jeu ---------- */
  #hud { display: flex; align-items: center; gap: 8px; padding: 4px 104px 2px 6px; height: 54px; flex: none; }
  #bPause { background: var(--bouton); padding: 0; display: grid; place-items: center; }
  #bPause svg { width: 20px; height: 20px; }
  .hmil { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  #coeurs { display: flex; gap: 1px; height: 20px; }
  #coeurs img { width: 20px; height: 20px; }
  #coeurs img.perdu { animation: tremble .4s; }
  .hinfo { display: flex; gap: 10px; font-size: .9rem; color: var(--doux); align-items: center; white-space: nowrap; }
  .hinfo img { width: 18px; height: 18px; vertical-align: -4px; }
  .hinfo b { color: var(--texte); }
  .hscore { text-align: right; line-height: 1; }
  .hscore small { display: block; color: var(--doux); font-size: .72rem; }
  .hscore b { font-size: 1.35rem; color: var(--or); }
  #msg { flex: none; height: 24px; text-align: center; font-size: .92rem; color: #ffe6a6; padding: 0 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .4s; }
  #zone { flex: 1; position: relative; min-height: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #bas { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px 10px; }
  #inv { display: grid; grid-template-columns: repeat(2, 62px); gap: 8px; }
  .case { position: relative; width: 62px; height: 62px; background: var(--carte); border: 2px solid #343a5c;
    border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; }
  .case img { width: 34px; height: 34px; }
  .case span { font-size: .8rem; font-weight: 700; color: var(--texte); line-height: 1; }
  button.case { border-color: #6a5fb0; box-shadow: 0 3px 0 #0b0d18; }
  button.case.vide { opacity: .4; }
  .case.pulse { animation: pulse .5s; }
  #pad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); gap: 4px; }
  #pad button { background: var(--bouton); padding: 0; display: grid; place-items: center; box-shadow: 0 3px 0 #11142a; }
  #pad button:active { background: #3d4575; transform: translateY(2px); }
  #pad svg { width: 26px; height: 26px; }
  .pH { grid-column: 2; grid-row: 1; } .pG { grid-column: 1; grid-row: 2; } .pA { grid-column: 2; grid-row: 2; }
  .pD { grid-column: 3; grid-row: 2; } .pB { grid-column: 2; grid-row: 3; }

  /* ---------- Fenêtres ---------- */
  .voile { position: absolute; inset: 0; z-index: 40; background: #05060ecc; display: flex; align-items: center;
    justify-content: center; padding: 14px; }
  .carteF { width: 100%; max-width: 370px; background: linear-gradient(#262b48, #171a2e); border: 2px solid #3f4775;
    border-radius: 22px; padding: 16px 16px 18px; text-align: center; box-shadow: 0 10px 40px #000a; animation: entree .35s; }
  .carteF h2 { margin: 0 0 8px; color: var(--or); font-size: 1.45rem; }
  #demo { width: 230px; height: 138px; border-radius: 12px; background: #090a14; }
  #introTexte { min-height: 3.9em; margin: 10px 0 12px; font-size: 1.05rem; line-height: 1.3; }
  #bEtoiles { font-size: 3.2rem; letter-spacing: 6px; color: #343a5c; margin: 2px 0; }
  #bEtoiles span { display: inline-block; }
  #bEtoiles span.on { color: var(--or); animation: pop .45s; text-shadow: 0 0 18px #ffcf5a99; }
  #bDetail { color: var(--doux); font-size: .95rem; line-height: 1.5; }
  #bDetail i { font-style: normal; color: var(--or); }
  #bScore { font-size: 1.2rem; margin-top: 6px; }
  #bScore b { font-size: 2rem; color: var(--or); }
  #bRecord { min-height: 1.4em; color: #8ff0b0; font-weight: 700; }
  .boutons { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 10px; }
  .boutons .ligne button { min-width: 120px; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

  @keyframes pop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.35); } 100% { transform: scale(1); } }
  @keyframes entree { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pulse { 50% { transform: scale(1.18); border-color: var(--or); } }
  @keyframes tremble { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  @media (max-height: 640px) {
    #pad { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); }
    .case { width: 54px; height: 54px; } #inv { grid-template-columns: repeat(2, 54px); }
    #art { height: 150px; }
  }
</style>
</head>
<body>
<div id="app">
  <button id="btnSon"></button>
  <div id="coinLangue"></div>

  <!-- Écran d'accueil -->
  <section id="accueil" class="ecran">
    <canvas id="art"></canvas>
    <h1 data-i18n-html="titreHtml">Les Caves<br>de Brumefer</h1>
    <p class="regle" data-i18n="regle">Guide le lutin dans les caves brumeuses&nbsp;: ramasse les gemmes, trouve l'escalier, et fonce sur les Brumelins pour les faire éclater&nbsp;!</p>
    <button class="gros" id="bJouer" data-i18n="jouer">Jouer</button>
    <div class="ligne">
      <button class="second" id="bEtages" data-i18n="lesEtages">Les étages</button>
      <button class="second" id="bProf"></button>
    </div>
    <p id="recAccueil"></p>
  </section>

  <!-- Choix de l'étage -->
  <section id="etages" class="ecran cache">
    <div class="barre"><button class="second" id="bRetour" data-i18n="retour">Retour</button><h2 data-i18n="lesEtages">Les étages</h2></div>
    <div id="grilleNiv"></div>
  </section>

  <!-- Partie -->
  <section id="jeu" class="ecran cache">
    <header id="hud">
      <button id="bPause" aria-label="Pause" data-i18n-aria="pause"><svg viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1.5" fill="#f3eee2"/><rect x="12" y="3" width="4" height="14" rx="1.5" fill="#f3eee2"/></svg></button>
      <div class="hmil">
        <div id="coeurs"></div>
        <div class="hinfo"><span id="hEtage"></span><span><img id="iGem" alt=""> <b id="hGem">0/0</b></span></div>
      </div>
      <div class="hscore"><small data-i18n="score">Score</small><b id="hScore">0</b></div>
    </header>
    <div id="msg"></div>
    <div id="zone"><canvas id="cv"></canvas></div>
    <footer id="bas">
      <div id="inv">
        <div class="case" id="cArme"><img id="iArme" alt=""><span id="tArme"></span></div>
        <div class="case" id="cCle"><img id="iCle" alt=""><span id="tCle">0</span></div>
        <button class="case" id="bPotion" aria-label="Boire une potion" data-i18n-aria="boirePotion"><img id="iPotion" alt=""><span id="tPotion">0</span></button>
        <button class="case" id="bParch" aria-label="Lire un parchemin" data-i18n-aria="lireParchemin"><img id="iParch" alt=""><span id="tParch">0</span></button>
      </div>
      <div id="pad">
        <button class="pH" data-d="0,-1" aria-label="Haut" data-i18n-aria="haut"><svg viewBox="0 0 24 24"><path d="M12 5 L20 17 H4 Z" fill="#f3eee2"/></svg></button>
        <button class="pG" data-d="-1,0" aria-label="Gauche" data-i18n-aria="gauche"><svg viewBox="0 0 24 24"><path d="M5 12 L17 4 V20 Z" fill="#f3eee2"/></svg></button>
        <button class="pA" data-d="0,0" aria-label="Attendre un tour" data-i18n-aria="attendre"><svg viewBox="0 0 24 24"><path d="M6 3 H18 M6 21 H18 M7 3 C7 9 12 10 12 12 C12 14 7 15 7 21 M17 3 C17 9 12 10 12 12 C12 14 17 15 17 21" stroke="#f3eee2" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
        <button class="pD" data-d="1,0" aria-label="Droite" data-i18n-aria="droite"><svg viewBox="0 0 24 24"><path d="M19 12 L7 4 V20 Z" fill="#f3eee2"/></svg></button>
        <button class="pB" data-d="0,1" aria-label="Bas" data-i18n-aria="bas"><svg viewBox="0 0 24 24"><path d="M12 19 L20 7 H4 Z" fill="#f3eee2"/></svg></button>
      </div>
    </footer>
  </section>

  <!-- Tutoriel et nouvelles mécaniques -->
  <div id="intro" class="voile cache">
    <div class="carteF">
      <h2 id="introTitre"></h2>
      <canvas id="demo"></canvas>
      <p id="introTexte"></p>
      <button class="gros" id="bCompris" data-i18n="compris">Compris !</button>
    </div>
  </div>

  <!-- Bilan de fin d'étage -->
  <div id="bilan" class="voile cache">
    <div class="carteF">
      <h2 id="bTitre"></h2>
      <div id="bEtoiles"><span>★</span><span>★</span><span>★</span></div>
      <div id="bDetail"></div>
      <div id="bScore" data-i18n-html="scoreBilan">Score : <b id="bPts">0</b></div>
      <div id="bRecord"></div>
      <div class="boutons">
        <button class="gros" id="bSuivant"></button>
        <div class="ligne"><button class="second" id="bRejouer" data-i18n="rejouer">Rejouer</button><button class="second" id="bCarte" data-i18n="etages">Étages</button></div>
      </div>
    </div>
  </div>

  <!-- Pause -->
  <div id="pause" class="voile cache">

<script>
'use strict';
// ==========================================================================
// Les Caves de Brumefer — petit roguelike au tour par tour pour enfants.
// Un lutin à lanterne explore des caves générées au hasard, ramasse gemmes,
// clés, potions et armes, et dissipe les Brumelins (créatures de brume).
// Sections : 1. outils et sauvegarde  2. sons  3. dessins  4. étages
//            5. génération  6. tours de jeu  7. rendu  8. commandes
//            9. tutoriel animé  10. écrans  11. confettis  12. démarrage
// ==========================================================================

// ---------- 1. Outils et sauvegarde ----------
const $ = (id) => document.getElementById(id);
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (t) => t[Math.floor(Math.random() * t.length)];
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
// Typographie française : espace insécable avant ! ? : ; (pas de signe seul en début de ligne)
const fr = (t) => (window.JEL_I18N.getLang() === 'fr' ? String(t).replace(/ ([!?:;…])/g, ' $1') : String(t));
function melange(t) {
  const r = t.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

const CLE_SAUVE = 'caves-de-brumefer-v1';
const sauv = { debloque: 1, etoiles: [], scores: [], prof: 0, profScore: 0, son: true, vus: {}, fini: false };
function charger() {
  try {
    const t = localStorage.getItem(CLE_SAUVE);
    if (t) Object.assign(sauv, JSON.parse(t));
  } catch (e) { /* stockage indisponible : on joue sans sauvegarde */ }
}
function sauver() {
  try { localStorage.setItem(CLE_SAUVE, JSON.stringify(sauv)); } catch (e) { /* pas grave */ }
}

// Sauvegarde de la progression (module JEL_SAVE) : « Continuer » reprend
// directement à l'étage sauvegardé (1 à 10). Le score compte par étage ;
// les Profondeurs (mode sans fin) ne sont pas sauvegardées.
const JEU = 'caves-de-brumefer';
let effacerSauvegarde = null; // bouton de l'écran d'accueil, créé au démarrage
JEL_SAVE.surFermeture(() => {
  if (S && S.mode === 'etage' && !S.fini && ecranCourant === 'jeu') JEL_SAVE.save(JEU, { niveau: S.n, score: 0 });
});

// ---------- 2. Sons (Web Audio, aucun fichier) ----------
let actx = null, bufBruit = null;
function reveillerAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
}
function ton(f, d, type = 'sine', v = 0.12, f2 = null, delai = 0) {
  if (!sauv.son || !actx) return;
  const t = actx.currentTime + delai;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + d + 0.03);
}
function bruit(d, v = 0.1, freq = 1500, delai = 0) {
  if (!sauv.son || !actx) return;
  if (!bufBruit) {
    bufBruit = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
    const ch = bufBruit.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  const t = actx.currentTime + delai;
  const s = actx.createBufferSource(), fl = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = bufBruit; fl.type = 'lowpass'; fl.frequency.value = freq;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(fl).connect(g).connect(actx.destination);
  s.start(t); s.stop(t + d + 0.03);
}
const SON = {
  pas() { ton(210, 0.05, 'triangle', 0.035, 150); },
  mur() { ton(110, 0.08, 'square', 0.035, 80); },
  gemme() { ton(988, 0.08, 'sine', 0.11); ton(1480, 0.16, 'sine', 0.09, null, 0.07); },
  potion() { ton(300, 0.35, 'sine', 0.11, 900); ton(450, 0.3, 'triangle', 0.04, 1200, 0.05); },
  cle() { ton(1320, 0.1, 'triangle', 0.09); ton(1760, 0.22, 'triangle', 0.07, null, 0.08); },
  grille() { ton(170, 0.35, 'sawtooth', 0.05, 90); bruit(0.25, 0.07, 700); ton(880, 0.2, 'triangle', 0.06, null, 0.25); },
  coffre() { [523, 659, 784, 1047].forEach((f, i) => ton(f, 0.15, 'triangle', 0.08, null, i * 0.07)); },
  coup() { bruit(0.08, 0.14, 1800); ton(240, 0.08, 'square', 0.05, 120); },
  dissipe() { ton(1200, 0.3, 'sine', 0.08, 300); bruit(0.2, 0.05, 4000, 0.05); },
  aie() { ton(330, 0.25, 'sawtooth', 0.07, 110); },
  gonfle() { ton(150, 0.22, 'sine', 0.1, 320); },
  crache() { bruit(0.2, 0.12, 2500); ton(500, 0.15, 'sine', 0.04, 200); },
  piques() { ton(700, 0.06, 'square', 0.05, 1200); },
  parchemin() { [660, 880, 1100, 1320].forEach((f, i) => ton(f, 0.4, 'sine', 0.05, null, i * 0.06)); },
  appel() { ton(80, 0.6, 'sawtooth', 0.07, 60); ton(120, 0.5, 'square', 0.03, 90, 0.1); },
  arme() { ton(500, 0.12, 'square', 0.04, 1500); ton(1500, 0.3, 'sine', 0.06, null, 0.1); },
  victoire() { [523, 659, 784, 1047, 1319].forEach((f, i) => ton(f, 0.25, 'triangle', 0.09, null, i * 0.1)); },
  epuise() { [392, 330, 262, 196].forEach((f, i) => ton(f, 0.3, 'triangle', 0.08, null, i * 0.16)); },
  etoile(i) { ton(880 + i * 220, 0.2, 'sine', 0.11); ton(1320 + i * 220, 0.25, 'sine', 0.05, null, 0.05); },
  clic() { ton(660, 0.05, 'triangle', 0.05); },
};

// ---------- 3. Dessins (tout est dessiné au canvas) ----------
// Chaque fonction reçoit le contexte c, le centre (cx, cy) de la case, sa taille s et le temps t.
function rondRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function disque(c, x, y, r, coul) { c.fillStyle = coul; c.beginPath(); c.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); c.fill(); }
function ombre(c, cx, cy, r) { c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(cx, cy, r, r * 0.35, 0, 0, Math.PI * 2); c.fill(); }
function yeux(c, cx, cy, s, ecart = 0.1, r = 0.065, regard = 0) {
  for (const k of [-1, 1]) {
    disque(c, cx + k * ecart * s, cy, r * s, '#fff');
    disque(c, cx + k * ecart * s + regard * r * s * 0.4, cy + r * s * 0.15, r * s * 0.55, '#1b1630');
  }
}
function coeur(c, cx, cy, r, coul) {
  c.fillStyle = coul; c.beginPath();
  c.moveTo(cx, cy + r * 0.9);
  c.bezierCurveTo(cx - r * 1.4, cy - r * 0.1, cx - r * 0.7, cy - r * 1.15, cx, cy - r * 0.45);
  c.bezierCurveTo(cx + r * 0.7, cy - r * 1.15, cx + r * 1.4, cy - r * 0.1, cx, cy + r * 0.9);
  c.fill();
}

function dessHeros(c, cx, cy, s, t, dir = 1) {
  const b = Math.sin(t / 180) * s * 0.015;
  ombre(c, cx, cy + s * 0.36, s * 0.26);
  // lueur de la lanterne
  const lx = cx + dir * s * 0.3, ly = cy + s * 0.12 + b;
  const g = c.createRadialGradient(lx, ly, 0, lx, ly, s * 0.45);
  g.addColorStop(0, 'rgba(255,220,120,.55)'); g.addColorStop(1, 'rgba(255,220,120,0)');
  c.fillStyle = g; c.fillRect(lx - s * 0.5, ly - s * 0.5, s, s);
  // cape
  c.fillStyle = '#d9643a'; c.beginPath();
  c.moveTo(cx - s * 0.27, cy + s * 0.35);
  c.quadraticCurveTo(cx, cy - s * 0.3 + b, cx + s * 0.27, cy + s * 0.35); c.closePath(); c.fill();
  // tête
  disque(c, cx, cy - s * 0.06 + b, s * 0.17, '#ffdcb5');
  // capuche pointue
  c.fillStyle = '#b8452a'; c.beginPath();
  c.moveTo(cx - s * 0.2, cy - s * 0.03 + b);
  c.quadraticCurveTo(cx - s * 0.2, cy - s * 0.3 + b, cx - dir * s * 0.08, cy - s * 0.44 + b);
  c.quadraticCurveTo(cx + s * 0.2, cy - s * 0.3 + b, cx + s * 0.2, cy - s * 0.03 + b);
  c.quadraticCurveTo(cx, cy - s * 0.2 + b, cx - s * 0.2, cy - s * 0.03 + b); c.fill();
  // visage
  disque(c, cx - s * 0.055 + dir * s * 0.03, cy - s * 0.04 + b, s * 0.028, '#2a1d14');
  disque(c, cx + s * 0.055 + dir * s * 0.03, cy - s * 0.04 + b, s * 0.028, '#2a1d14');
  disque(c, cx - s * 0.1 + dir * s * 0.03, cy + s * 0.02 + b, s * 0.03, '#ff9d8a');
  disque(c, cx + s * 0.1 + dir * s * 0.03, cy + s * 0.02 + b, s * 0.03, '#ff9d8a');
  // lanterne
  c.fillStyle = '#5a4630'; c.fillRect(lx - s * 0.01, ly - s * 0.13, s * 0.02, s * 0.06);
  c.fillStyle = '#ffd86b'; rondRect(c, lx - s * 0.07, ly - s * 0.08, s * 0.14, s * 0.16, s * 0.03); c.fill();
  c.fillStyle = '#7a5a34'; c.fillRect(lx - s * 0.08, ly - s * 0.09, s * 0.16, s * 0.03);
}

function dessGluant(c, cx, cy, s, t) {
  const q = Math.sin(t / 250) * 0.05;
  ombre(c, cx, cy + s * 0.32, s * 0.3);
  const w = s * (0.34 + q), h = s * (0.32 - q), base = cy + s * 0.32;
  c.fillStyle = '#62c95d'; c.beginPath();
  c.moveTo(cx - w, base); c.bezierCurveTo(cx - w, base - h * 1.7, cx + w, base - h * 1.7, cx + w, base); c.closePath(); c.fill();
  disque(c, cx - w * 0.4, base - h * 0.95, s * 0.06, 'rgba(255,255,255,.45)');
  yeux(c, cx, base - h * 0.55, s, 0.1, 0.07);
}
function dessChauve(c, cx, cy, s, t) {
  const f = Math.sin(t / 70), by = cy + Math.sin(t / 160) * s * 0.05 - s * 0.05;
  ombre(c, cx, cy + s * 0.36, s * 0.18);
  c.fillStyle = '#8a6ad6';
  for (const k of [-1, 1]) {
    c.beginPath(); c.moveTo(cx + k * s * 0.1, by);
    c.lineTo(cx + k * s * 0.44, by - s * 0.18 * f - s * 0.04);
    c.lineTo(cx + k * s * 0.36, by + s * 0.1);
    c.lineTo(cx + k * s * 0.22, by + s * 0.05); c.closePath(); c.fill();
  }
  c.fillStyle = '#5d3f9e';
  for (const k of [-1, 1]) { c.beginPath(); c.moveTo(cx + k * s * 0.05, by - s * 0.12); c.lineTo(cx + k * s * 0.13, by - s * 0.27); c.lineTo(cx + k * s * 0.15, by - s * 0.08); c.fill(); }
  disque(c, cx, by, s * 0.17, '#5d3f9e');
  for (const k of [-1, 1]) disque(c, cx + k * s * 0.065, by - s * 0.02, s * 0.04, '#ffe680');
  disque(c, cx, by + s * 0.07, s * 0.025, '#2a1d40');
}
function dessChampi(c, cx, cy, s, t, alerte) {
  const sx = alerte ? Math.sin(t / 30) * s * 0.03 : 0;
  ombre(c, cx, cy + s * 0.36, s * 0.24);
  c.fillStyle = '#f1e3c6'; rondRect(c, cx - s * 0.15 + sx, cy - s * 0.02, s * 0.3, s * 0.36, s * 0.07); c.fill();
  c.fillStyle = '#d8433b'; c.beginPath(); c.ellipse(cx + sx, cy + s * 0.02, s * 0.38, s * 0.34, 0, Math.PI, 0); c.closePath(); c.fill();
  for (const [dx, dy, r] of [[-0.2, -0.08, 0.06], [0.05, -0.2, 0.07], [0.22, -0.06, 0.05]]) disque(c, cx + dx * s + sx, cy + dy * s, r * s, '#fff3e6');
  if (alerte) yeux(c, cx + sx, cy + s * 0.14, s, 0.07, 0.045);
  else {
    c.strokeStyle = '#4a3420'; c.lineWidth = s * 0.03; c.beginPath();
    c.moveTo(cx - s * 0.1, cy + s * 0.14); c.lineTo(cx - s * 0.03, cy + s * 0.14);
    c.moveTo(cx + s * 0.03, cy + s * 0.14); c.lineTo(cx + s * 0.1, cy + s * 0.14); c.stroke();
  }
}
function dessCrapaud(c, cx, cy, s, t, charge) {
  const g = charge ? 1.15 + Math.sin(t / 60) * 0.04 : 1;
  ombre(c, cx, cy + s * 0.34, s * 0.3);
  c.fillStyle = '#3fa58f'; c.beginPath(); c.ellipse(cx, cy + s * 0.13, s * 0.33 * g, s * 0.22 * g, 0, 0, Math.PI * 2); c.fill();
  disque(c, cx - s * 0.15, cy - s * 0.08, s * 0.1, '#3fa58f');
  disque(c, cx + s * 0.15, cy - s * 0.08, s * 0.1, '#3fa58f');
  yeux(c, cx, cy - s * 0.08, s, 0.15, 0.06);
  if (charge) disque(c, cx, cy + s * 0.22, s * 0.13, '#a8f0d6');
  c.strokeStyle = '#1f5a4c'; c.lineWidth = s * 0.03; c.beginPath(); c.arc(cx, cy + s * 0.08, s * 0.12, 0.2, Math.PI - 0.2); c.stroke();
  if (charge) {
    disque(c, cx + s * 0.28, cy - s * 0.34, s * 0.15, '#ffd84a');
    c.fillStyle = '#3a2306'; c.font = `900 ${s * 0.24}px system-ui, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('!', cx + s * 0.28, cy - s * 0.33);
  }
}
function dessFollet(c, cx, cy, s, t) {
  const by = cy + Math.sin(t / 200) * s * 0.06;
  c.save(); c.globalAlpha = 0.88;
  c.fillStyle = '#a6e6ff'; c.beginPath();
  c.moveTo(cx - s * 0.2, by);
  for (let k = 0; k <= 4; k++) c.lineTo(cx - s * 0.2 + k * s * 0.1, by + s * 0.3 + (k % 2 ? -s * 0.08 : 0) + Math.sin(t / 120 + k) * s * 0.03);
  c.lineTo(cx + s * 0.2, by); c.fill();
  const g = c.createRadialGradient(cx, by - s * 0.05, 0, cx, by - s * 0.05, s * 0.32);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#bdefff'); g.addColorStop(1, 'rgba(120,210,255,0)');
  c.fillStyle = g; c.beginPath(); c.arc(cx, by - s * 0.05, s * 0.32, 0, Math.PI * 2); c.fill();
  disque(c, cx, by - s * 0.02, s * 0.2, '#d8f6ff');
  c.restore();
  disque(c, cx - s * 0.07, by - s * 0.04, s * 0.035, '#2c4a6a');
  disque(c, cx + s * 0.07, by - s * 0.04, s * 0.035, '#2c4a6a');
  disque(c, cx, by + s * 0.05, s * 0.025, '#2c4a6a');
}
function dessGardien(c, cx, cy, s, t) {
  const z = s * 1.3, y0 = cy - s * 0.12 + Math.sin(t / 400) * s * 0.02;
  ombre(c, cx, cy + s * 0.4, s * 0.45);
  disque(c, cx - z * 0.4, y0 + z * 0.12, z * 0.14, '#55526a');
  disque(c, cx + z * 0.4, y0 + z * 0.12, z * 0.14, '#55526a');
  c.fillStyle = '#6b6880'; rondRect(c, cx - z * 0.32, y0 - z * 0.25, z * 0.64, z * 0.62, z * 0.16); c.fill();
  c.strokeStyle = '#4c4a5e'; c.lineWidth = z * 0.025; c.beginPath();
  c.moveTo(cx - z * 0.2, y0 + z * 0.2); c.lineTo(cx - z * 0.08, y0 + z * 0.1); c.lineTo(cx - z * 0.12, y0 + z * 0.3); c.stroke();
  c.fillStyle = '#b98cff'; c.beginPath();
  c.moveTo(cx, y0 - z * 0.46); c.lineTo(cx + z * 0.09, y0 - z * 0.3); c.lineTo(cx, y0 - z * 0.2); c.lineTo(cx - z * 0.09, y0 - z * 0.3); c.fill();
  const lu = 0.7 + Math.sin(t / 150) * 0.3;
  c.fillStyle = `rgba(214,180,255,${lu})`;
  c.fillRect(cx - z * 0.17, y0 - z * 0.08, z * 0.11, z * 0.06); c.fillRect(cx + z * 0.06, y0 - z * 0.08, z * 0.11, z * 0.06);
}
const DESS_ENNEMI = { gluant: dessGluant, chauve: dessChauve, champi: dessChampi, crapaud: dessCrapaud, follet: dessFollet, gardien: dessGardien };
const COUL_ENNEMI = { gluant: '#7be276', chauve: '#a98af0', champi: '#ff7a6e', crapaud: '#66d6bb', follet: '#c7f1ff', gardien: '#c9a4ff' };

// Objets posés au sol
function dessGemme(c, cx, cy, s, t, coul = '#5ad1ff') {
  const by = cy + Math.sin(t / 300 + cx) * s * 0.04;
  ombre(c, cx, cy + s * 0.3, s * 0.16);
  c.fillStyle = coul; c.beginPath();
  c.moveTo(cx - s * 0.19, by - s * 0.06); c.lineTo(cx - s * 0.09, by - s * 0.19); c.lineTo(cx + s * 0.09, by - s * 0.19);
  c.lineTo(cx + s * 0.19, by - s * 0.06); c.lineTo(cx, by + s * 0.21); c.closePath(); c.fill();
  c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath();
  c.moveTo(cx - s * 0.09, by - s * 0.19); c.lineTo(cx, by - s * 0.06); c.lineTo(cx - s * 0.19, by - s * 0.06); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = s * 0.015; c.beginPath();
  c.moveTo(cx - s * 0.19, by - s * 0.06); c.lineTo(cx + s * 0.19, by - s * 0.06); c.stroke();
}
function dessPotion(c, cx, cy, s) {
  ombre(c, cx, cy + s * 0.3, s * 0.18);
  c.fillStyle = '#cfe8ff'; c.fillRect(cx - s * 0.06, cy - s * 0.2, s * 0.12, s * 0.14);
  disque(c, cx, cy + s * 0.08, s * 0.19, '#cfe8ff');
  disque(c, cx, cy + s * 0.1, s * 0.15, '#ef4f78');
  disque(c, cx - s * 0.06, cy + s * 0.04, s * 0.04, 'rgba(255,255,255,.6)');
  c.fillStyle = '#8a5a34'; rondRect(c, cx - s * 0.08, cy - s * 0.27, s * 0.16, s * 0.09, s * 0.03); c.fill();
}
function dessCle(c, cx, cy, s) {
  ombre(c, cx, cy + s * 0.28, s * 0.2);
  c.strokeStyle = '#f2c14e'; c.lineWidth = s * 0.07; c.lineCap = 'round';
  c.beginPath(); c.arc(cx - s * 0.13, cy, s * 0.1, 0, Math.PI * 2); c.stroke();
  c.beginPath(); c.moveTo(cx - s * 0.03, cy); c.lineTo(cx + s * 0.24, cy);
  c.moveTo(cx + s * 0.18, cy); c.lineTo(cx + s * 0.18, cy + s * 0.1);
  c.moveTo(cx + s * 0.08, cy); c.lineTo(cx + s * 0.08, cy + s * 0.08); c.stroke();
  c.lineCap = 'butt';
}
function dessArme(c, cx, cy, s, t, sorte = 'fer') {
  ombre(c, cx, cy + s * 0.3, s * 0.2);
  c.save(); c.translate(cx, cy); c.rotate(-Math.PI / 4);
  if (sorte === 'baton') {
    c.fillStyle = '#9a6a3c'; rondRect(c, -s * 0.04, -s * 0.34, s * 0.08, s * 0.66, s * 0.04); c.fill();
    disque(c, 0, -s * 0.34, s * 0.07, '#7cd06c');
  } else {
    c.fillStyle = sorte === 'cristal' ? '#8fe6ff' : '#d3d9e4';
    c.beginPath(); c.moveTo(-s * 0.05, s * 0.08); c.lineTo(-s * 0.05, -s * 0.28); c.lineTo(0, -s * 0.36); c.lineTo(s * 0.05, -s * 0.28); c.lineTo(s * 0.05, s * 0.08); c.fill();
    c.fillStyle = 'rgba(255,255,255,.55)'; c.fillRect(-s * 0.015, -s * 0.28, s * 0.02, s * 0.34);
    c.fillStyle = '#f2c14e'; c.fillRect(-s * 0.15, s * 0.08, s * 0.3, s * 0.06);

  { taille: 36, salles: 9, gemmes: 11, ennemis: { gluant: 3, chauve: 3, champi: 2, crapaud: 4 }, potions: 3, cles: true, coffre: 2, piques: 12, parchemins: 2, armes: ['cristal'], pv: 6, arme: 'fer', intros: ['parchemin', 'cristal'] },
  { taille: 38, salles: 10, gemmes: 12, ennemis: { gluant: 3, chauve: 3, champi: 2, crapaud: 3, follet: 4 }, potions: 4, cles: true, coffre: 2, piques: 12, parchemins: 1, armes: ['cristal'], pv: 6, arme: 'fer', intros: ['follet'] },

// Profondeurs : étages sans fin qui mélangent tout, de plus en plus chargés.
function cfgProf(p) {
  const types = p < 3 ? ['gluant', 'chauve', 'champi', 'crapaud'] : ['gluant', 'chauve', 'champi', 'crapaud', 'follet'];
  const ennemis = {};
  for (let k = 0; k < 6 + Math.min(p, 12); k++) { const t = pick(types); ennemis[t] = (ennemis[t] || 0) + 1; }
  const boss = p % 5 === 0;
  return {
    taille: 30 + Math.min(p * 2, 10), salles: 7 + Math.min(p, 4), gemmes: 8 + Math.min(p, 5), ennemis,
    potions: p % 2 ? 2 : 1, cles: !boss && p % 2 === 0, coffre: !boss && p % 2 === 0 ? 1 : 0, boss,
