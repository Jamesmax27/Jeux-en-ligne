<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS

      element: element,
      maj: function () {

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },

    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +

    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>

    { ciel: ['#2b3f7a', '#7d9fd6', '#d8e6f5'], sol: '#8a7a68', solFonce: '#5f5246', piste: 'rgba(26,36,70,.84)', couverture: ['#2e86c1', '#e67e22'], gamme: [0, 2, 4, 7, 9], base: 392, instr: 'flute' },
    { ciel: ['#2f86c9', '#8fd0f0', '#ffe9b8'], sol: '#a0703c', solFonce: '#6e4a26', piste: 'rgba(14,52,76,.84)', couverture: ['#16a085', '#ecf0f1'], gamme: [0, 2, 3, 5, 7, 9, 10], base: 220, instr: 'acier' },
    { ciel: ['#120b33', '#3b1f66', '#7a3b78'], sol: '#6b5a7a', solFonce: '#43365a', piste: 'rgba(40,18,62,.86)', couverture: ['#e84393', '#fdcb6e'], gamme: [0, 2, 4, 5, 7, 9, 11], base: 261.63, instr: 'carillon' },
  ];
  const COULEURS_PISTES = ['#4fd1c5', '#f6c445', '#ff7aa8'];
  const VIOLET = '#b07cff';

  // ---------------------------------------------------------------------------
  // Les 20 niveaux. r : contrée ; bpm : tempo au début et à la fin (pont) ;
  // mes : mesures de 4 temps ; dens : chance d'une note sur un temps ;
  // lg / ac / gl / vo : chances d'une note longue, d'un accord, d'une glissade,

    if (i % 5 === 0) montrerMessage(tr('intro.instrument', { region: tr('region.' + def.r), instrument: tr('instr.' + def.r) }), 3);
    else if (def.tem && def.bru) montrerMessage(tr('alerte.tout'), 2.6);
    else if (def.tem) montrerMessage(tr('alerte.tempete'), 2.4);
    else if (def.bru) montrerMessage(tr('alerte.brume'), 2.4);
    else if (def.bpm[1] > def.bpm[0]) montrerMessage(tr('alerte.pont'), 2.4);
    else montrerMessage(tr('intro.etape', { n: i + 1, region: tr('region.' + def.r) }), 2.2);
    if (aMontrer.length) ouvrirTuto(aMontrer);
  }

  // Piste d'une note à un instant donné (notes voyageuses et glissades)
  function changementVoy(n) { return n.t - partie.def.app * 0.45; }
  function pisteA(n, s) {
    if (n.type === 'voy') {
      const c = changementVoy(n);
      return s < c ? n.piste : s > c + 0.25 ? n.piste2 : lerp(n.piste, n.piste2, (s - c) / 0.25);
    }
    if (n.type === 'glisse') return lerp(n.piste, n.piste2, limiter((s - n.t) / (n.fin - n.t), 0, 1));
    return n.piste;
  }

  // ---------------------------------------------------------------------------
  // Jugement des notes
  // ---------------------------------------------------------------------------
  function appuyer(piste, source) {
    if (!partie || partie.pause || partie.etat !== 'jeu' || partie.attente > 0) return;
    lumieres[piste] = 1;
    const s = partie.temps;
    let meilleure = null;
    for (const n of partie.notes) {
      if (n.etat !== 0) continue;
      if (n.t - s > FEN_B) break;
      if (Math.abs(n.t - s) > FEN_B) continue;
      if (Math.round(pisteA(n, s)) !== piste) continue;
      if (!meilleure || Math.abs(n.t - s) < Math.abs(meilleure.t - s)) meilleure = n;
    }
    if (!meilleure) { Son.note(frequence(partie.def.r, DEG_PISTE[piste]) * 0.5, REGIONS[partie.def.r].instr, 0); return; }
    const ecart = Math.abs(meilleure.t - s);
    const qualite = ecart <= FEN_P ? 'parfait' : 'bien';
    juger(meilleure, qualite, piste);
    Son.note(frequence(partie.def.r, meilleure.deg), REGIONS[partie.def.r].instr, 0, meilleure.type === 'long' || meilleure.type === 'glisse');
    if (meilleure.type === 'long' || meilleure.type === 'glisse') { meilleure.etat = 1; meilleure.tenue = source; meilleure.hors = 0; }
    else meilleure.etat = 2;
  }

  function juger(n, qualite, piste) {
    const P = partie;
    const mult = 1 + Math.min(3, Math.floor(P.combo / 10));
    const x = G.pisteX + (piste + 0.5) * G.largeur;
    if (qualite === 'parfait' || qualite === 'tenu') {
      P.parfaits++; P.combo++; P.score += (qualite === 'tenu' ? 60 : 100) * mult; P.moral = Math.min(100, P.moral + 1.5);
      etiquette(tr(qualite === 'tenu' ? 'jug.tenu' : 'jug.parfait'), x, '#ffe08a');
      eclater(x, G.frappe, COULEURS_PISTES[piste], 14);
      if (qualite === 'parfait') Son.parfait();
      elan = 1;
    } else if (qualite === 'bien') {
      P.biens++; P.combo++; P.score += 50 * mult; P.moral = Math.min(100, P.moral + 0.8);
      etiquette(tr('jug.bien'), x, '#bfefff');
      eclater(x, G.frappe, COULEURS_PISTES[piste], 7);
      elan = Math.max(elan, 0.7);
    } else {
      // Le moral baisse un peu plus à chaque contrée (5 au début, 9 à la fin)
      P.rates++; P.combo = 0; P.moral -= (qualite === 'lache' ? 0.75 : 1) * (5 + P.i * 0.2);
      etiquette(tr(qualite === 'lache' ? 'jug.lache' : 'jug.rate'), x, '#ff8a8a');
      P.secousse = 0.25;
      Son.rate();
    }
    P.comboMax = Math.max(P.comboMax, P.combo);
    majHud();
    if (P.moral <= 0) { P.moral = 0; terminer(false); }
  }

  // Une note tenue l'est-elle encore ? (doigt sur le ruban, ou touche du clavier)
  function tenueValide(n, s) {
    const cible = pisteA(n, s);
    if (n.tenue === 'clavier') { for (const l of touches) if (Math.abs(l - cible) < 0.8) return true; return false; }
    const pos = appuis.get(n.tenue);
    return pos !== undefined && Math.abs(pos - cible) < 0.85;
  }

  function relacher() { /* la vérification se fait à chaque image */ }

  // ---------------------------------------------------------------------------
  // Marché : écouter l'air une fois, puis le rejouer
  // ---------------------------------------------------------------------------
  function ouvrirMarche(m) {
    const P = partie;
    P.etat = 'marche';
    P.marche = { m, phase: 'ecoute', idx: 0, chrono: 1.3, essais: 3, erreurs: 0, saisie: 0, rejoue: false, premier: true };
    appuis.clear(); touches.clear();
    P.notes.forEach((n) => { if (n.etat === 1) { n.etat = 2; } });
    montrerMessage(tr('marche.ecoute'), 0);
    Son.clochette();
  }
  function majMarche(dt) {
    const P = partie, M = P.marche;
    if (M.phase === 'ecoute') {
      M.chrono -= dt;
      if (M.chrono <= 0) {
        if (M.idx < M.m.seq.length) {
          const l = M.m.seq[M.idx];
          lumieres[l] = 1;
          Son.note(frequence(P.def.r, DEG_PISTE[l] + 2), REGIONS[P.def.r].instr, 0);
          M.idx++;
          M.chrono = limiter(0.72 - P.i * 0.012, 0.5, 0.72);
        } else {
          M.phase = 'joue'; M.saisie = 0;
          montrerMessage(tr('marche.joue', { n: 0, total: M.m.seq.length }), 0);
        }
      }
    } else if (M.phase === 'conclu') {
      M.chrono -= dt;
      if (M.chrono <= 0) {
        M.m.fait = true; P.marche = null; P.etat = 'jeu'; P.attente = 1.0;
        montrerMessage(tr('marche.route'), 1.2);
      }
    }
  }
  function saisieMarche(l) {
    const P = partie, M = P.marche;
    if (!M || M.phase !== 'joue') return;
    lumieres[l] = 1;
    Son.note(frequence(P.def.r, DEG_PISTE[l] + 2), REGIONS[P.def.r].instr, 0);
    const x = G.pisteX + (l + 0.5) * G.largeur;
    if (l === M.m.seq[M.saisie]) {
      M.saisie++;
      eclater(x, G.frappe, COULEURS_PISTES[l], 8);
      if (M.saisie >= M.m.seq.length) {
        const n = M.m.seq.length;
        if (M.premier) P.parfaits += n; else P.biens += n;
        P.score += (M.premier ? 150 : 90) * n; P.moral = Math.min(100, P.moral + 12);
        P.bonus = true; elan = 1;
        M.phase = 'conclu'; M.chrono = 1.8;
        montrerMessage(tr('marche.reussi'), 1.8);
        Son.succes();
        for (let j = 0; j < 3; j++) eclater(G.pisteX + (j + 0.5) * G.largeur, G.frappe - 60, COULEURS_PISTES[j], 14);
        majHud();
      } else montrerMessage(tr('marche.joue', { n: M.saisie, total: M.m.seq.length }), 0);
    } else {
      Son.erreur();
      M.essais--; M.erreurs++; M.premier = false;
      P.moral -= 6; P.secousse = 0.3;
      if (P.moral <= 0) { P.moral = 0; terminer(false); return; }
      if (M.essais <= 0) {
        P.rates += M.m.seq.length; P.combo = 0;
        M.phase = 'conclu'; M.chrono = 1.8;
        montrerMessage(tr('marche.rate'), 1.8);
      } else if (M.erreurs === 2 && !M.rejoue) {
        M.rejoue = true; M.phase = 'ecoute'; M.idx = 0; M.chrono = 1.4;
        montrerMessage(tr('marche.rejoue'), 0);
      } else {
        M.saisie = 0;
        montrerMessage(tr('marche.erreur', { essais: tr('marche.essais', { n: M.essais }) }), 0);
      }
      majHud();
    }
  }

  // ---------------------------------------------------------------------------
  // Boucle de mise à jour
  // ---------------------------------------------------------------------------
  function majPartie(dt) {
    const P = partie;
    if (!P || P.pause || P.etat === 'fin' || ecran !== 'jeu' || ecranTuto) return;
    if (P.etat === 'marche') { majMarche(dt); return; }
    if (P.attente > 0) { P.attente -= dt; return; }
    P.temps += dt;
    const s = P.temps;
    // Accompagnement (demi-temps)
    while (P.demi < P.T.length && P.T[P.demi] < s + 0.12) {
      const bt = P.T[P.demi];
      if (bt >= s - 0.05 && bt <= P.fin - 1) Son.percu(P.demi, bt - s, P.def.ct > 0, P.demi % 8 === 0 ? frequence(P.def.r, 0) : 0);
      P.demi++;
    }
    // Marché ?
    for (const m of P.marches) if (!m.fait && s >= m.t) { ouvrirMarche(m); return; }
    // Notes manquées et notes tenues
    for (const n of P.notes) {
      if (n.etat === 0 && s > n.t + FEN_B) { n.etat = 2; juger(n, 'rate', Math.round(pisteA(n, s))); if (P.etat === 'fin') return; if (n.type === 'long' || n.type === 'glisse') { P.rates++; } }
      else if (n.etat === 1) {
        if (s >= n.fin) { n.etat = 2; juger(n, 'tenu', Math.round(pisteA(n, n.fin))); if (P.etat === 'fin') return; }
        else if (!tenueValide(n, s)) {
          n.hors += dt;
          if (n.hors > 0.18) { n.etat = 2; if (n.fin - s < 0.12) juger(n, 'tenu', Math.round(pisteA(n, s))); else juger(n, 'lache', Math.round(pisteA(n, s))); if (P.etat === 'fin') return; }
        } else {
          n.hors = 0;
          if (Math.random() < dt * 20) eclater(G.pisteX + (pisteA(n, s) + 0.5) * G.largeur, G.frappe, COULEURS_PISTES[n.piste], 1);
        }
      }
    }
    // Fin du niveau
    if (s >= P.fin && P.notes.every((n) => n.etat === 2) && P.marches.every((m) => m.fait)) terminer(true);
    $('avance').style.width = (limiter(s / P.fin, 0, 1) * 100).toFixed(1) + '%';
  }

  function maj(dt) {
    temps += dt;
    majPartie(dt);
    const actif = !partie || !partie.pause;
    if (actif) {
      elan = Math.max(0, elan - dt * 1.2);
      const vitesse = ecran === 'jeu' ? elan : 0.6;
      pasCaravane += dt * 7 * vitesse;
      decorAvance += dt * 55 * vitesse;
      for (let l = 0; l < 3; l++) lumieres[l] = Math.max(0, lumieres[l] - dt * 4);
      for (let j = parts.length - 1; j >= 0; j--) {
        const q = parts[j]; q.vie -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 420 * dt;
        if (q.vie <= 0) parts.splice(j, 1);
      }
      for (let j = etiquettes.length - 1; j >= 0; j--) { const e = etiquettes[j]; e.vie -= dt; e.y -= 40 * dt; if (e.vie <= 0) etiquettes.splice(j, 1); }
      if (partie) partie.secousse = Math.max(0, partie.secousse - dt);
    }
    if (msgVie > 0) { msgVie -= dt; if (msgVie <= 0) $('message').classList.add('cache'); }
  }

  // ---------------------------------------------------------------------------
  // Effets
  // ---------------------------------------------------------------------------
  function eclater(x, y, couleur, n) {
    for (let j = 0; j < n; j++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 220;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 160, vie: 0.5 + Math.random() * 0.4, c: couleur, r: 2 + Math.random() * 3 });
    }
  }
  function etiquette(texte, x, c) { etiquettes.push({ texte, x, y: G.frappe - G.rayon - 18, vie: 0.7, c }); }
  let msgVie = 0;
  function montrerMessage(texte, duree) {
    const m = $('message'); m.textContent = texte; m.classList.remove('cache');
    msgVie = duree > 0 ? duree : 0;
    placerMessage();
  }
  function cacherMessage() { $('message').classList.add('cache'); msgVie = 0; }
  function placerMessage() { $('message').style.top = (G.sceneH + 14) + 'px'; }

  // ---------------------------------------------------------------------------
  // Dessin du décor (contrées) et de la caravane — aucun texte dans les dessins
  // ---------------------------------------------------------------------------
  function dessinerDecor(r, h, avance, pont) {
    const R = REGIONS[r];
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, R.ciel[0]); g.addColorStop(0.6, R.ciel[1]); g.addColorStop(1, R.ciel[2]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, h);
    const sol = h * 0.8;
    if (r === 0) {
      // Désert : soleil couchant et dunes
      ctx.fillStyle = 'rgba(255,230,150,.9)'; ctx.beginPath(); ctx.arc(W * 0.72, h * 0.5, h * 0.16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,190,.25)'; ctx.beginPath(); ctx.arc(W * 0.72, h * 0.5, h * 0.24, 0, Math.PI * 2); ctx.fill();
      dune(h * 0.62, h * 0.06, 0.008, avance * 0.15, '#d98a5a');
      dune(h * 0.7, h * 0.07, 0.011, avance * 0.35, '#e6a564');
      dune(sol, h * 0.05, 0.014, avance * 0.7, R.sol);
      // Palmiers lointains
      for (let k = 0; k < 3; k++) { const x = ((k * 260 - avance * 0.35) % (W + 300) + W + 300) % (W + 300) - 100; palmier(x, h * 0.7, h * 0.18); }
    } else if (r === 1) {
      // Montagnes enneigées
      montagnes(h * 0.76, h * 0.48, avance * 0.12, '#56679e', true);
      montagnes(h * 0.8, h * 0.22, avance * 0.3, '#3f4f7d', false);
      for (let k = 0; k < 6; k++) { const x = ((k * 130 - avance * 0.6) % (W + 160) + W + 160) % (W + 160) - 60; sapin(x, sol + 4, h * 0.12); }
      ctx.fillStyle = R.sol; ctx.fillRect(0, sol, W, h - sol);
    } else if (r === 2) {
      // Port : mer, voiliers, phare, mouettes
      ctx.fillStyle = '#2a7fb0'; ctx.fillRect(0, h * 0.58, W, h * 0.42);
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
      for (let k = 0; k < 4; k++) { ctx.beginPath(); for (let x = 0; x <= W; x += 12) { const y = h * (0.63 + k * 0.05) + Math.sin(x * 0.05 + temps * 2 + k) * 2; if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); } ctx.stroke(); }
      for (let k = 0; k < 3; k++) { const x = ((k * 230 - avance * 0.25) % (W + 260) + W + 260) % (W + 260) - 90; voilier(x, h * 0.62 + Math.sin(temps * 1.5 + k) * 2, h * 0.2, k); }
      phare(((W * 0.85 - avance * 0.1) % (W + 200) + W + 200) % (W + 200) - 60, h * 0.6, h * 0.36);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      for (let k = 0; k < 4; k++) { const x = (k * 97 + temps * 30) % (W + 40) - 20, y = h * 0.2 + k * 11 + Math.sin(temps * 3 + k) * 4; ctx.beginPath(); ctx.moveTo(x - 7, y - 3); ctx.quadraticCurveTo(x - 3, y - 6, x, y); ctx.quadraticCurveTo(x + 3, y - 6, x + 7, y - 3); ctx.stroke(); }
      ctx.fillStyle = R.sol; ctx.fillRect(0, sol, W, h - sol);
      ctx.strokeStyle = R.solFonce; ctx.lineWidth = 2;
      for (let x = -((avance * 1) % 28); x < W; x += 28) { ctx.beginPath(); ctx.moveTo(x, sol); ctx.lineTo(x, h); ctx.stroke(); }
    } else {
      // Cité en fête : étoiles, dômes, lanternes, feux d'artifice
      for (let k = 0; k < 40; k++) { const x = (k * 71.3) % W, y = (k * 37.7) % (h * 0.5); ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + 0.4 * Math.sin(temps * 2 + k)) + ')'; ctx.fillRect(x, y, 2, 2); }
      feuxArtifice(h);
      cite(h * 0.78, h * 0.45, avance * 0.2);
      guirlande(h * 0.18, avance * 0.5);
      ctx.fillStyle = R.sol; ctx.fillRect(0, sol, W, h - sol);
      ctx.fillStyle = R.solFonce;
      for (let x = -((avance * 1) % 36); x < W; x += 36) ctx.fillRect(x, sol + 6, 30, 4);
    }
    if (pont) pontDeCorde(sol, h, avance);
  }
  function dune(base, amp, freq, dec, couleur) {
    ctx.fillStyle = couleur; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 10; x += 10) ctx.lineTo(x, base - Math.sin((x + dec) * freq) * amp - Math.sin((x + dec) * freq * 2.3) * amp * 0.4);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }
  function montagnes(base, haut, dec, couleur, neige) {
    ctx.fillStyle = couleur; ctx.beginPath(); ctx.moveTo(0, base + 200);
    const pts = [];
    for (let x = -40; x <= W + 40; x += 8) {
      const u = (x + dec) * 0.012;
      const y = base - haut * (0.55 + 0.45 * Math.abs(Math.sin(u)) * (0.6 + 0.4 * Math.sin(u * 0.37 + 1)));
      pts.push([x, y]); ctx.lineTo(x, y);
    }
    ctx.lineTo(W + 40, base + 200); ctx.closePath(); ctx.fill();
    if (neige) {
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      for (let j = 1; j < pts.length - 1; j++) {
        const [x, y] = pts[j];
        if (y < pts[j - 1][1] && y <= pts[j + 1][1] && y < base - haut * 0.8) { ctx.beginPath(); ctx.moveTo(x - 18, y + 14); ctx.lineTo(x, y); ctx.lineTo(x + 18, y + 14); ctx.closePath(); ctx.fill(); }
      }
    }
  }
  function palmier(x, y, h) {
    ctx.strokeStyle = '#7a4a2a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 8, y - h * 0.5, x + 4, y - h); ctx.stroke();
    ctx.fillStyle = '#2f7d4a';
    for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + (k - 2) * 0.6; ctx.beginPath(); ctx.ellipse(x + 4 + Math.cos(a) * h * 0.22, y - h + Math.sin(a) * h * 0.12 + 4, h * 0.24, h * 0.06, a, 0, Math.PI * 2); ctx.fill(); }
  }
  function sapin(x, y, h) { ctx.fillStyle = '#24543f'; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(x, y - h + k * h * 0.25); ctx.lineTo(x - h * 0.3, y - h * 0.35 + k * h * 0.25); ctx.lineTo(x + h * 0.3, y - h * 0.35 + k * h * 0.25); ctx.closePath(); ctx.fill(); } }
  function voilier(x, y, h, k) {
    ctx.fillStyle = '#6b3a1f'; ctx.beginPath(); ctx.moveTo(x - h * 0.5, y); ctx.lineTo(x + h * 0.5, y); ctx.lineTo(x + h * 0.38, y + h * 0.18); ctx.lineTo(x - h * 0.38, y + h * 0.18); ctx.closePath(); ctx.fill();
    ctx.fillStyle = ['#fff4e0', '#ffd0d0', '#d8f0ff'][k % 3];
    ctx.beginPath(); ctx.moveTo(x, y - h); ctx.lineTo(x + h * 0.4, y - 4); ctx.lineTo(x, y - 4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 2, y - h * 0.8); ctx.lineTo(x - h * 0.32, y - 4); ctx.lineTo(x - 2, y - 4); ctx.closePath(); ctx.fill();
  }
  function phare(x, y, h) {
    ctx.fillStyle = '#f2f2f2'; ctx.beginPath(); ctx.moveTo(x - h * 0.1, y); ctx.lineTo(x + h * 0.1, y); ctx.lineTo(x + h * 0.06, y - h); ctx.lineTo(x - h * 0.06, y - h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#d64545'; for (let k = 0; k < 3; k++) ctx.fillRect(x - h * 0.09 + k * h * 0.012, y - h * (0.25 + k * 0.25), h * (0.18 - k * 0.024), h * 0.08);
    ctx.fillStyle = 'rgba(255,240,150,' + (0.5 + 0.5 * Math.sin(temps * 3)) + ')'; ctx.beginPath(); ctx.arc(x, y - h - 6, 7, 0, Math.PI * 2); ctx.fill();
  }
  function cite(base, haut, dec) {
    ctx.fillStyle = '#2a1846';
    for (let k = 0; k < 8; k++) {
      const x = ((k * 90 - dec) % (W + 180) + W + 180) % (W + 180) - 90;
      const hh = haut * (0.5 + ((k * 37) % 5) / 10);
      ctx.fillRect(x, base - hh, 60, hh);
      ctx.beginPath(); ctx.arc(x + 30, base - hh, 30, Math.PI, 0); ctx.fill();
      ctx.fillRect(x + 28, base - hh - 44, 4, 16);
      ctx.fillStyle = 'rgba(255,210,120,.8)';
      for (let f = 0; f < 3; f++) ctx.fillRect(x + 10 + f * 16, base - hh * 0.6, 7, 11);
      ctx.fillStyle = '#2a1846';
    }
  }
  function guirlande(y, dec) {
    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1.5; ctx.beginPath();
    for (let x = 0; x <= W; x += 10) { const yy = y + Math.sin((x + dec) * 0.02) * 10 + 10; if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy); }
    ctx.stroke();
    const couleurs = ['#ff6b6b', '#ffd36b', '#6be3d0', '#c38bff'];
    for (let x = -((dec) % 50); x < W; x += 50) { const yy = y + Math.sin((x + dec) * 0.02) * 10 + 18; ctx.fillStyle = couleurs[Math.abs(Math.floor((x + dec) / 50)) % 4]; ctx.beginPath(); ctx.ellipse(x, yy, 7, 9, 0, 0, Math.PI * 2); ctx.fill(); }
  }
  function feuxArtifice(h) {
    for (let k = 0; k < 3; k++) {
      const periode = 2.6 + k * 0.7, ph = ((temps + k * 1.1) % periode) / periode;

    cacherMessage();
    const jugees = P.parfaits + P.biens + P.rates;
    const justesse = jugees ? (P.parfaits + 0.6 * P.biens) / jugees : 0;
    const pct = Math.round(justesse * 100);
    const etoiles = gagne ? (justesse >= 0.92 ? 3 : justesse >= 0.78 ? 2 : 1) : 0;
    let nouveauRecord = false, objet = -1, bonus = -1;
    const ancienRecord = prog.r[P.i];
    if (gagne) {

      const b = BONUS_MARCHE[P.i];

      prog.d = Math.max(prog.d, Math.min(NB, P.i + 2));
      JEL_SAVE.save(JEU, donneesSauvegarde(P.i + 2));
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: P.i + 1 });
      if (toutGagne()) { if (window.FMG) window.FMG.reportComplete({ stars: etoilesTotal(), maxStars: NB * 3 }); }

      for (let k = 0; k < 40; k++) setTimeout(() => eclater(Math.random() * W, H * 0.3, COULEURS_PISTES[k % 3], 3), k * 30);

    zone.classList.toggle('cache', !gagne);
    zone.setAttribute('role', 'img'); zone.setAttribute('aria-label', tr('etoiles.aria', { n: etoiles }));
    for (let k = 0; k < 3; k++) { const d = document.createElement('span'); d.innerHTML = svgEtoile(k < etoiles); const sv = d.firstChild; zone.appendChild(sv); if (k < etoiles) setTimeout(() => { sv.classList.add('vue'); Son.etoile(k); }, 300 + k * 320); else setTimeout(() => sv.classList.add('vue'), 300 + k * 320); }
    // compteur de score qui défile
    const cible = P.score; const debut = performance.now();
    const defiler = (m) => { const k = limiter((m - debut) / 900, 0, 1); $('fin-score').textContent = tr('fin.score', { n: nb(Math.round(cible * k)) }); if (k < 1 && ecran === 'fin') requestAnimationFrame(defiler); };
    requestAnimationFrame(defiler);
    $('fin-justesse').textContent = tr('fin.justesse', { n: pct });
    $('fin-details').textContent = tr('fin.details', { p: P.parfaits, b: P.biens, r: P.rates });
    $('fin-record').textContent = gagne ? (nouveauRecord ? tr('fin.record') : tr('fin.meilleur', { n: nb(prog.r[P.i]) })) : (ancienRecord ? tr('fin.meilleur', { n: nb(ancienRecord) }) : '');
    const zo = $('fin-objet'); zo.innerHTML = '';
    if (objet >= 0) { const cv = document.createElement('canvas'); dessinerObjet(cv, objet, true); const s = document.createElement('span'); s.textContent = tr('fin.objet', { objet: tr('objet.' + objet) }); zo.appendChild(cv); zo.appendChild(s); }
    const zb = $('fin-bonus'); zb.innerHTML = '';
    if (bonus >= 0) { const cv = document.createElement('canvas'); dessinerObjet(cv, bonus, true); const s = document.createElement('span'); s.textContent = tr('fin.bonus', { objet: tr('objet.' + bonus) }); zb.appendChild(cv); zb.appendChild(s); }
    $('fin-texte').textContent = gagne ? (P.i === NB - 1 ? tr('victoire.derniere') : tr('victoire.texte', { region: tr('region.' + NIVEAUX[Math.min(NB - 1, P.i + 1)].r) })) : tr('defaite.texte');
    const dernier = P.i === NB - 1;
    $('b-suivant').classList.toggle('cache', !gagne || dernier);
    $('b-bilan').classList.toggle('cache', !gagne || !dernier);
    $('b-reessayer').classList.toggle('cache', gagne);
    $('b-rejouer').classList.toggle('cache', !gagne);
    $('ecran-fin').classList.remove('cache');
    const principal = [$('b-suivant'), $('b-bilan'), $('b-reessayer')].find((b) => !b.classList.contains('cache'));
    if (principal) principal.focus({ preventScroll: true });
  }
  function ouvrirBilan() {
    cacherTout(); ecran = 'bilan';
    $('bilan-etoiles').textContent = tr('bilan.etoiles', { n: etoilesTotal(), total: NB * 3 });
    $('bilan-objets').textContent = tr('bilan.objets', { n: prog.o.length, total: OBJETS.length });
    $('bilan-score').textContent = tr('bilan.score', { n: nb(prog.r.reduce((a, b) => a + b, 0)) });
    $('ecran-bilan').classList.remove('cache');
    Son.succes();
  }

  function majHud() {
    const P = partie; if (!P) return;
    $('hud-etape').textContent = tr('hud.etape', { n: P.i + 1, region: tr('region.' + P.def.r) });
    $('hud-score').textContent = tr('hud.score', { n: nb(P.score) });
    $('moral').style.width = limiter(P.moral, 0, 100) + '%';
  }
  function majBoutonsSon() {
    document.querySelectorAll('.b-son').forEach((b) => {
      b.setAttribute('aria-label', sonCoupe ? tr('aria.sonOff') : tr('aria.sonOn'));
      b.setAttribute('aria-pressed', sonCoupe ? 'true' : 'false');
      b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/>' + (sonCoupe ? '<path d="M16 9l5 6M21 9l-5 6" stroke="#ff8a8a" stroke-width="2.5" stroke-linecap="round"/>' : '<path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>') + '</svg>';
    });
  }
  function basculerSon() {
    sonCoupe = !sonCoupe; Son.appliquerVolume(); majBoutonsSon();
    try { localStorage.setItem('caravane-melodies-son', sonCoupe ? '0' : '1'); } catch (e) { /* stockage refusé */ }
    // seulement si une sauvegarde existe déjà (jamais d'écriture neuve depuis l'accueil)
    try { if (JEL_SAVE.existe(JEU)) JEL_SAVE.save(JEU, { options: { sonCoupe } }); } catch (e) { /* rien */ }
  }

  // ---------------------------------------------------------------------------
  // Commandes : doigt, souris, clavier
  // ---------------------------------------------------------------------------
  function pisteDeX(x) { return (x - G.pisteX) / G.largeur - 0.5; }
  toile.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    Son.init();
    if (ecran !== 'jeu' || !partie || partie.pause || ecranTuto) return;
    if (e.clientY < G.sceneH * 0.5) return;
    const pos = pisteDeX(e.clientX);
    if (pos < -1.2 || pos > 3.2) return;
    const piste = limiter(Math.round(pos), 0, 2);
    appuis.set(e.pointerId, pos);
    if (partie.etat === 'marche') { saisieMarche(piste); return; }
    appuyer(piste, e.pointerId);
  });
  toile.addEventListener('pointermove', (e) => { if (appuis.has(e.pointerId)) appuis.set(e.pointerId, pisteDeX(e.clientX)); });
  const lever = (e) => { appuis.delete(e.pointerId); relacher(); };
  toile.addEventListener('pointerup', lever);
  toile.addEventListener('pointercancel', lever);
  toile.addEventListener('pointerleave', lever);
  toile.addEventListener('contextmenu', (e) => e.preventDefault());

  const TOUCHES = { ArrowLeft: 0, KeyA: 0, ArrowDown: 1, ArrowUp: 1, KeyS: 1, Space: 1, ArrowRight: 2, KeyD: 2 };
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (ecran === 'jeu' && partie && !ecranTuto) { e.preventDefault(); if (partie.pause) reprendre(); else mettreEnPause(); }
      return;
    }
    if (ecranTuto && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); fermerTuto(); return; }
    if (ecran === 'jeu' && partie && !partie.pause && TOUCHES[e.code] !== undefined) {
      e.preventDefault();
      if (e.repeat) return;
      Son.init();
      const l = TOUCHES[e.code];
      touches.add(l);
      if (partie.etat === 'marche') saisieMarche(l); else appuyer(l, 'clavier');
    }
  });
  document.addEventListener('keyup', (e) => {
    const l = TOUCHES[e.code];
    if (l === undefined) return;
    // une autre touche de la même piste peut rester tenue
    const encore = Object.keys(TOUCHES).some((k) => k !== e.code && TOUCHES[k] === l && touchesBas.has(k));
    if (!encore) touches.delete(l);
  });
  const touchesBas = new Set();
  document.addEventListener('keydown', (e) => touchesBas.add(e.code), true);
  document.addEventListener('keyup', (e) => touchesBas.delete(e.code), true);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') mettreEnPause(); });
  window.addEventListener('blur', () => { touches.clear(); touchesBas.clear(); });

  // Boutons
  document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', () => { Son.init(); basculerSon(); Son.clic(); }));
  $('b-pause').addEventListener('click', () => { Son.init(); mettreEnPause(); });
  $('b-jouer').addEventListener('click', () => {
    Son.init(); Son.clic();
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => {
        chargerProgres();
        const n = limiter(parseInt(d && d.niveau, 10) || 1, 1, NB);
        if (n > prog.d) prog.d = n;
        lancerNiveau(n - 1);
      },
      // relit la progression : elle a pu être effacée dans la fenêtre de reprise
      onNouvelle: () => { chargerProgres(); lancerNiveau(0); },
    });
  });
  $('b-niveaux').addEventListener('click', () => { Son.init(); Son.clic(); ouvrirNiveaux(); });
  $('b-sacoche').addEventListener('click', () => { Son.init(); Son.clic(); ouvrirSacoche('titre'); });
  $('b-niveaux-retour').addEventListener('click', () => { Son.clic(); allerAccueil(); });
  $('b-sacoche-retour').addEventListener('click', () => { Son.clic(); if (retourSacoche === 'bilan') ouvrirBilan(); else allerAccueil(); });
  $('b-tuto-ok').addEventListener('click', (e) => { e.stopPropagation(); fermerTuto(); });
  $('ecran-tuto').addEventListener('click', () => fermerTuto());
  $('b-reprendre').addEventListener('click', () => { Son.clic(); reprendre(); });
  $('b-recommencer').addEventListener('click', () => { Son.degeler(); Son.clic(); lancerNiveau(partie ? partie.i : 0); });
  $('b-pause-niveaux').addEventListener('click', () => { Son.clic(); ouvrirNiveaux(); });
  $('b-accueil').addEventListener('click', () => { Son.clic(); allerAccueil(); });
  $('b-suivant').addEventListener('click', () => { Son.clic(); lancerNiveau(partie.i + 1); });
  $('b-reessayer').addEventListener('click', () => { Son.clic(); lancerNiveau(partie.i); });
  $('b-rejouer').addEventListener('click', () => { Son.clic(); lancerNiveau(partie.i); });
  $('b-bilan').addEventListener('click', () => { Son.clic(); ouvrirBilan(); });
  $('b-fin-niveaux').addEventListener('click', () => { Son.clic(); ouvrirNiveaux(); });
  $('b-fin-accueil').addEventListener('click', () => { Son.clic(); allerAccueil(); });
  $('b-bilan-sacoche').addEventListener('click', () => { Son.clic(); ouvrirSacoche('bilan'); });
  $('b-bilan-rejouer').addEventListener('click', () => { Son.clic(); lancerNiveau(NB - 1); });
  $('b-bilan-niveaux').addEventListener('click', () => { Son.clic(); ouvrirNiveaux(); });
  $('b-bilan-accueil').addEventListener('click', () => { Son.clic(); allerAccueil(); });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie
  JEL_SAVE.surFermeture(() => { if (partieEnCours && partie) JEL_SAVE.save(JEU, donneesSauvegarde(partie.i + 1)); });

  // Changement de langue sur place : textes calculés par le jeu
  I18N.surChangement(() => {
    majBoutonsSon(); majHud();
    if (ecran === 'niveaux') construireNiveaux();
    if (ecran === 'sacoche') construireSacoche();
    if (ecranTuto && tutoType) { $('tuto-titre').textContent = tr('tuto.titre'); $('tuto-texte').textContent = tr('tuto.' + tutoType); }
  });

  // ---------------------------------------------------------------------------
  // Démarrage
  // ---------------------------------------------------------------------------
  chargerProgres();
  miseEnPage();
  majBoutonsSon();
  let avant = performance.now();
  function boucle(m) {
    const dt = Math.min(0.05, Math.max(0, (m - avant) / 1000)); avant = m;
    maj(dt);
    if (ecran === 'jeu' && partie) dessinerPartie();
    else if (partie && (ecran === 'fin')) dessinerPartie();
    else dessinerTitre();
    if (ecranTuto) dessinerDemo();
    requestAnimationFrame(boucle);
  }
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
