<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;

  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));

  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);

  }

  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120d0b; color: #f1e6d2;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none;
    user-select: none; -webkit-user-select: none; }
  canvas#jeu { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .cache { display: none !important; }

  /* --- Barre de jeu --- */
  #hud { position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; justify-content: space-between;
    gap: 8px; padding: max(8px, env(safe-area-inset-top)) 10px 0; pointer-events: none; z-index: 5; }
  #hud .groupe { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
  .rond { width: 46px; height: 46px; border-radius: 50%; border: 2px solid rgba(255, 214, 150, .45);
    background: rgba(24, 15, 10, .72); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .rond svg { width: 24px; height: 24px; }
  .rond:active { transform: scale(.94); }
  #hudCentre { text-align: center; pointer-events: none; text-shadow: 0 2px 4px #000; flex: 1; min-width: 0; }
  #hudGalerie { font-weight: 700; font-size: 14px; opacity: .92; }
  #hudTemps { font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
  #hudTemps.depasse { color: #ff9b7a; }
  #hudDroite { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; pointer-events: none;
    text-shadow: 0 2px 4px #000; font-weight: 800; }
  #hudVies { display: flex; gap: 3px; }
  #hudVies svg { width: 16px; height: 22px; }
  #hudReliques { display: flex; align-items: center; gap: 5px; font-size: 16px; }
  #hudReliques svg { width: 18px; height: 18px; }
  #bulle { position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: rgba(20, 12, 8, .78); border: 1px solid rgba(255, 210, 140, .35); padding: 10px 16px; border-radius: 999px;
    font-weight: 700; font-size: 16px; pointer-events: none; z-index: 5; text-align: center; max-width: 92vw;
    transition: opacity .3s; }

  /* --- Écrans --- */
  .ecran { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    padding: 16px; overflow: auto; }
  .ecran.voile { background: rgba(8, 5, 4, .62); backdrop-filter: blur(2px); }
  .carte { background: linear-gradient(#2b1d15, #1a110c); border: 2px solid rgba(232, 180, 110, .5); border-radius: 22px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .6), inset 0 0 40px rgba(255, 170, 80, .07); padding: 20px 18px;
    width: min(440px, 100%); text-align: center; max-height: calc(100% - 8px); overflow: auto; }
  .carte.large { width: min(760px, 100%); }
  h1, h2 { margin: 0 0 8px; font-weight: 900; letter-spacing: .01em; }
  h2 { font-size: 26px; color: #ffd38a; text-shadow: 0 2px 0 #4a2a12; }
  p { margin: 8px 0; line-height: 1.4; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 10px 22px; margin: 6px;
    border-radius: 16px; border: 2px solid #f6b45a; background: linear-gradient(#e98d2c, #b35716); color: #fff8ec;
    font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 #5e2a08, 0 8px 20px rgba(0, 0, 0, .35); max-width: 100%; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #5e2a08; }
  .btn.gros { font-size: 24px; min-height: 64px; padding: 12px 40px; }
  .btn.sec { background: linear-gradient(#4b3426, #2d1f16); border-color: #a77c52; box-shadow: 0 4px 0 #160d08; }
  .btn:focus-visible, .rond:focus-visible, .case:focus-visible, .choix:focus-visible { outline: 3px solid #ffe08a; outline-offset: 3px; }
  .rangee { display: flex; flex-wrap: wrap; justify-content: center; }

  /* Titre */
  #titre { flex-direction: column; justify-content: space-between; padding: max(18px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
  #titre .haut { text-align: center; margin-top: 4vh; padding: 10px 16px 14px; border-radius: 30px;
    background: radial-gradient(ellipse at center, rgba(12, 7, 4, .6), rgba(12, 7, 4, 0) 72%); }
  #titre h1 { font-size: clamp(34px, 9vw, 72px); line-height: 1.02; color: #ffd38a;
    text-shadow: 0 3px 0 #5a2c0d, 0 0 30px rgba(255, 150, 60, .45), 0 8px 24px #000; }
  #titre .age { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 999px; background: rgba(120, 20, 20, .7);
    border: 1px solid #ff8a7a; font-weight: 800; font-size: 14px; }
  #titre .accroche { font-size: 18px; max-width: 520px; margin: 12px auto 0; text-shadow: 0 2px 6px #000; font-weight: 600; }
  #titre .bas { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #titre .aide { font-size: 14px; opacity: .85; text-shadow: 0 2px 4px #000; text-align: center; }
  #titre .coin { position: absolute; top: max(10px, env(safe-area-inset-top)); right: 10px; display: flex; gap: 8px; align-items: center; }
  #titre .total { font-weight: 800; color: #ffd38a; text-shadow: 0 2px 4px #000; }

  /* Galeries */
  .etage { margin: 10px 0 4px; text-align: left; font-weight: 800; color: #ffcf87; font-size: 15px; }
  .grille { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .case { min-height: 64px; border-radius: 14px; border: 2px solid #8d6440; background: #3a281b; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 4px 2px; font-weight: 900; font-size: 20px; }
  .case .ets { display: flex; gap: 1px; margin-top: 2px; }
  .case .ets svg { width: 13px; height: 13px; }
  .case.ferme { opacity: .5; cursor: not-allowed; }
  .case.ferme svg.cad { width: 22px; height: 22px; }
  .case.actuelle { border-color: #ffd38a; box-shadow: 0 0 14px rgba(255, 200, 110, .5); }

  /* Équipement */
  #apercuEquip { width: 140px; height: 140px; display: block; margin: 0 auto; }
  .choix-ligne { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 6px; }
  .choix { min-height: 64px; border-radius: 12px; border: 2px solid #7a573a; background: #33241a; padding: 6px 4px;
    font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    overflow-wrap: anywhere; }
  .choix .pastille { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .5); }
  .choix.actif { border-color: #ffd38a; background: #5a3a20; }
  .choix.ferme { opacity: .55; }

  /* Fin de galerie */
  .etoiles-fin { display: flex; justify-content: center; gap: 10px; margin: 8px 0 4px; }
  .etoiles-fin svg { width: 58px; height: 58px; transform: scale(0); transition: transform .35s cubic-bezier(.3, 1.8, .5, 1); }
  .etoiles-fin svg.vue { transform: scale(1); }
  .lignes { text-align: left; display: inline-block; font-size: 16px; }
  .lignes div { margin: 3px 0; }
  .record { color: #8dff9b; font-weight: 800; }
  .crit { font-size: 13px; opacity: .85; }

  /* Tutoriel */
  #demo { width: 100%; max-width: 320px; height: 170px; display: block; margin: 6px auto; border-radius: 14px;
    background: #140d09; border: 1px solid rgba(255, 200, 130, .3); }
  .etapes { display: flex; justify-content: center; gap: 6px; margin: 4px 0; }
  .etapes i { width: 10px; height: 10px; border-radius: 50%; background: #5a4030; }
  .etapes i.on { background: #ffd38a; }
  #langue-pause, #langue-titre { display: inline-flex; }
</style>
</head>
<body>
<canvas id="jeu"></canvas>

<!-- Barre de jeu -->
<div id="hud" class="cache">
  <div class="groupe">
    <button class="rond" id="bPause" type="button" data-i18n-aria="aria.pause"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1" fill="#ffd38a"/><rect x="14" y="4" width="4" height="16" rx="1" fill="#ffd38a"/></svg></button>
    <button class="rond btn-son" type="button" data-i18n-aria="aria.son"></button>
  </div>
  <div id="hudCentre"><div id="hudGalerie"></div><div id="hudTemps"></div></div>
  <div id="hudDroite"><div id="hudVies"></div><div id="hudReliques"></div></div>
</div>
<div id="bulle" class="cache"></div>

<!-- Écran titre -->
<div id="titre" class="ecran cache">
  <div class="coin"><span class="total" id="totalTitre"></span><button class="rond btn-son" type="button" data-i18n-aria="aria.son"></button><span id="langue-titre"></span></div>
  <div class="haut">
    <h1 data-i18n="titre"></h1>
    <div class="age" data-i18n="age"></div>
    <p class="accroche" data-i18n="accroche"></p>
  </div>
  <div class="bas">
    <button class="btn gros" id="bJouer" type="button" data-i18n="jouer"></button>
    <div class="rangee">
      <button class="btn sec" id="bGaleries" type="button" data-i18n="galeries"></button>
      <button class="btn sec" id="bEquip" type="button" data-i18n="equipement"></button>
    </div>
    <div class="aide" data-i18n="aide"></div>
  </div>
</div>

<!-- Sélection des galeries -->
<div id="ecranGaleries" class="ecran voile cache">
  <div class="carte large">
    <h2 data-i18n="choisir"></h2>
    <div id="totalGaleries" class="crit"></div>
    <div id="listeGaleries"></div>
    <button class="btn sec" type="button" data-retour data-i18n="retour"></button>
  </div>
</div>

<!-- Équipement -->
<div id="ecranEquip" class="ecran voile cache">
  <div class="carte large">
    <h2 data-i18n="equipement"></h2>
    <canvas id="apercuEquip" width="280" height="280"></canvas>
    <div id="totalEquip" class="crit"></div>
    <div class="etage" data-i18n="equip.tenues"></div><div class="choix-ligne" id="lTenues"></div>
    <div class="etage" data-i18n="equip.cordes"></div><div class="choix-ligne" id="lCordes"></div>
    <div class="etage" data-i18n="equip.grappins"></div><div class="choix-ligne" id="lGrappins"></div>
    <button class="btn sec" type="button" data-retour data-i18n="retour"></button>
  </div>
</div>

<!-- Pause -->
<div id="ecranPause" class="ecran voile cache">
  <div class="carte">
    <h2 data-i18n="pause"></h2>
    <div class="rangee" style="flex-direction:column;align-items:center">
      <button class="btn gros" id="bReprendre" type="button" data-i18n="reprendre"></button>
      <button class="btn sec" id="bRecommencer" type="button" data-i18n="recommencer"></button>
      <button class="btn sec" id="bAccueil" type="button" data-i18n="accueil"></button>
    </div>
    <div style="margin-top:8px"><span id="langue-pause"></span></div>
  </div>
</div>

<!-- Tutoriel -->
<div id="ecranTuto" class="ecran voile cache">
  <div class="carte">
    <h2 id="tutoTitre"></h2>
    <canvas id="demo" width="640" height="340"></canvas>
    <p id="tutoTexte"></p>
    <div class="etapes" id="tutoEtapes"></div>
    <button class="btn gros" id="bCompris" type="button"></button>
  </div>
</div>

<!-- Fin de galerie -->
<div id="ecranFin" class="ecran voile cache">
  <div class="carte">
    <h2 id="finTitre"></h2>
    <div class="etoiles-fin" id="finEtoiles"></div>
    <p id="finTexte" class="crit"></p>
    <div class="lignes" id="finLignes"></div>
    <div class="rangee" id="finBoutons"></div>
  </div>
</div>

<script>
/* ===========================================================================
   Le Grappin des Catacombes — jeu de plateforme au grappin (13 ans et +)
   La partie « SIM » (galeries et physique) ne touche ni à la page ni au son :
   elle peut être rejouée par un script de mise au point.
   =========================================================================== */
/*SIM-DEBUT*/
var SIM = (function () {
  'use strict';
  var FOND = 600;          // profondeur de la galerie : en dessous, la fosse
  var G = 1500;            // pesanteur (unités du monde par seconde²)
  var RAYON = 12;          // rayon du personnage
  var TIR = 0.07;          // durée du vol du grappin (s)
  var ROUILLE = 2;         // un crochet rouillé cède 2 s après l'accroche
  var CORNICHE_Y = 420;    // hauteur des corniches de pierre

  // Générateur pseudo-aléatoire (xorshift) : une galerie = une graine.
  function alea(graine) {
    var s = (graine >>> 0) || 1;
    return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }
  function entre(r, a, b) { return a + (b - a) * r(); }
  function borne(v, a, b) { return v < a ? a : v > b ? b : v; }

  /* Réglages des 20 galeries. etage : 0 ossuaire, 1 égouts, 2 mines, 3 temple.
     n : nombre de crochets ; dx, y : écart horizontal et hauteur des crochets ;
     ro, ch, ra, sp : part des crochets rouillés, à chaîne, sur rail, spectraux ;
     po, la, nu, va : part des trous avec pointes, lame, nuée, vapeur ;
     repos : une corniche tous les N crochets (0 = aucune) ; rel : reliques ;
     noir : obscurité ; cr : vitesse de la créature (0 = absente) ; tuto : nouveauté. */
  var NIVEAUX = [
    { etage: 0, g: 101, n: 8,  dx: [140, 175], y: [120, 190], rel: 2, repos: 0, tuto: 'base' },
    { etage: 0, g: 202, n: 11, dx: [150, 195], y: [110, 210], rel: 4, repos: 6, tuto: 'relique' },
    { etage: 0, g: 303, n: 12, dx: [150, 195], y: [110, 210], rel: 4, repos: 6, ro: 0.4, tuto: 'rouille' },
    { etage: 0, g: 404, n: 13, dx: [155, 200], y: [100, 210], rel: 4, repos: 7, ro: 0.2, ch: 0.4, tuto: 'chaine' },
    { etage: 0, g: 505, n: 15, dx: [160, 205], y: [100, 220], rel: 5, repos: 8, ro: 0.25, ch: 0.25, po: 0.45, tuto: 'pointes' },
    { etage: 1, g: 606, n: 14, dx: [165, 205], y: [100, 210], rel: 4, repos: 7, la: 0.4, tuto: 'lame' },
    { etage: 1, g: 707, n: 16, dx: [165, 210], y: [100, 215], rel: 5, repos: 8, ro: 0.35, la: 0.35, po: 0.2 },
    { etage: 1, g: 808, n: 16, dx: [165, 210], y: [100, 215], rel: 5, repos: 8, ch: 0.2, nu: 0.45, tuto: 'nuee' },
    { etage: 1, g: 909, n: 17, dx: [170, 215], y: [100, 220], rel: 5, repos: 8, ro: 0.2, va: 0.35, po: 0.3, tuto: 'vapeur' },
    { etage: 1, g: 1010, n: 20, dx: [170, 220], y: [95, 225], rel: 6, repos: 10, ro: 0.25, ch: 0.2, la: 0.25, nu: 0.25, va: 0.2, po: 0.2 },
    { etage: 2, g: 1111, n: 17, dx: [170, 215], y: [100, 215], rel: 5, repos: 8, ra: 0.4, po: 0.25, tuto: 'rail' },
    { etage: 2, g: 1212, n: 19, dx: [175, 220], y: [95, 220], rel: 5, repos: 9, ra: 0.3, ro: 0.2, la: 0.22, nu: 0.25 },
    { etage: 2, g: 1313, n: 18, dx: [170, 215], y: [100, 215], rel: 5, repos: 9, ra: 0.2, po: 0.3, noir: true, tuto: 'noir' },
    { etage: 2, g: 1414, n: 20, dx: [175, 222], y: [95, 222], rel: 6, repos: 10, ro: 0.35, ch: 0.3, la: 0.2, noir: true },
    { etage: 2, g: 1515, n: 22, dx: [185, 230], y: [90, 225], rel: 6, repos: 11, ro: 0.25, ch: 0.2, ra: 0.25, la: 0.25, nu: 0.25, va: 0.2, po: 0.25, noir: true },
    { etage: 3, g: 1616, n: 20, dx: [170, 215], y: [100, 215], rel: 5, repos: 0, ro: 0.15, po: 0.2, cr: 200, tuto: 'creature' },
    { etage: 3, g: 1717, n: 22, dx: [175, 220], y: [95, 220], rel: 6, repos: 0, ro: 0.25, ch: 0.2, la: 0.25, cr: 215 },
    { etage: 3, g: 1818, n: 21, dx: [175, 220], y: [95, 220], rel: 6, repos: 10, sp: 0.4, po: 0.25, tuto: 'spectre' },
    { etage: 3, g: 1919, n: 24, dx: [180, 225], y: [95, 222], rel: 6, repos: 0, sp: 0.3, ro: 0.2, nu: 0.35, cr: 225 },
    { etage: 3, g: 2020, n: 28, dx: [185, 232], y: [90, 225], rel: 7, repos: 0, sp: 0.2, ro: 0.2, ch: 0.2, ra: 0.15, la: 0.25, nu: 0.25, va: 0.15, po: 0.2, cr: 240 }
  ];

  /* Construction d'une galerie à partir de ses réglages. */
  function construire(i) {
    var p = NIVEAUX[i], r = alea(p.g * 7919 + 13);
    var L = { num: i, etage: p.etage, noir: !!p.noir, creature: p.cr || 0,
      crochets: [], corniches: [], reliques: [], pointes: [], lames: [], nuees: [], vapeurs: [], decor: [] };
    L.corniches.push({ x: -200, w: 330, y: CORNICHE_Y });
    var x = 130, y = 160, precedent = null, dernierType = 'n';
    var trous = []; // espaces entre deux crochets (pour les pièges et les reliques)
    for (var k = 0; k < p.n; k++) {
      // Repos : une corniche sous un trou, puis un crochet plus haut.
      if (p.repos && k > 0 && k % p.repos === 0) {
        L.corniches.push({ x: x + 60, w: 170, y: CORNICHE_Y });
        // Un crochet solide au-dessus de la corniche : on peut toujours en repartir.
        var cr = { x: x + 130, y: 150, type: 'n', casse: false, tAcc: 0 };
        L.crochets.push(cr);
        if (precedent) trous.push({ a: precedent, b: cr });
        precedent = cr; dernierType = 'n';
        x += 190;
      }
      var dx = k === 0 ? 30 : entre(r, p.dx[0], p.dx[1]);
      x += dx;
      y = borne(y + (r() - 0.5) * 120, p.y[0], p.y[1]);
      // Type de crochet : jamais deux pièges du même genre de suite au début.
      var type = 'n', t = r(), cumul = 0;
      var parts = [['r', p.ro || 0], ['c', p.ch || 0], ['rail', p.ra || 0], ['s', p.sp || 0]];
      if (k > 0 && k < p.n - 1) {
        for (var j = 0; j < parts.length; j++) { cumul += parts[j][1] * 0.75; if (t < cumul) { type = parts[j][0]; break; } }
        if (type !== 'n' && type === dernierType && r() < 0.6) type = 'n';
      }
      var c = { x: x, y: y, type: type, casse: false, tAcc: 0 };
      if (type === 'c') { c.lc = entre(r, 110, 150); c.px = x; c.py = Math.max(0, y - c.lc); c.amp = entre(r, 0.35, 0.55); c.per = entre(r, 2.2, 3.0); c.ph = r() * 6.28; c.y = c.py + c.lc; }
      if (type === 'rail') { c.x0 = x - 70; c.x1 = x + 70; c.per = entre(r, 3.0, 4.2); c.ph = r() * 6.28; }
      if (type === 's') { c.per = entre(r, 2.6, 3.4); c.ph = r() * 10; }
      L.crochets.push(c);
      if (precedent) trous.push({ a: precedent, b: c });
      precedent = c; dernierType = type;
    }
    // Pièges dans les trous (jamais dans le premier ni dans le dernier).
    for (var q = 1; q < trous.length - 1; q++) {
      var a = trous[q].a, b = trous[q].b, mx = (a.x + b.x) / 2, haut = Math.min(a.y, b.y);
      if (Math.abs(b.x - a.x) > 240) continue; // trou de repos
      var surCorniche = false;
      for (var z = 0; z < L.corniches.length; z++) if (mx > L.corniches[z].x - 40 && mx < L.corniches[z].x + L.corniches[z].w + 40) surCorniche = true;
      if (surCorniche) continue;
      var tir = r();
      var cu = 0;
      cu += (p.la || 0) * 0.8;
      if (tir < cu) { L.lames.push({ x: mx, lb: entre(r, 230, 270), amp: entre(r, 0.4, 0.55), per: entre(r, 2.8, 3.6), ph: r() * 6.28 }); continue; }
      cu += (p.nu || 0) * 0.8;
      if (tir < cu) { L.nuees.push({ x: mx, y0: entre(r, 150, 200), y1: entre(r, 380, 440), per: entre(r, 3.2, 4.4), ph: r() * 6.28, rr: 38 }); continue; }
      cu += (p.va || 0) * 0.8;
      if (tir < cu) { L.vapeurs.push({ x: mx - 50, w: 100, per: entre(r, 2.8, 3.6), ph: r() * 6.28 }); L.pointes.push({ x: mx - 45, y: 0, w: 90, h: 34, bas: false }); continue; }
      cu += (p.po || 0) * 0.8;
      if (tir < cu) {
        if (r() < 0.5 && haut > 110) L.pointes.push({ x: mx - 35, y: 0, w: 70, h: Math.min(haut - 60, entre(r, 50, 80)), bas: false });
        else L.pointes.push({ x: mx - 40, y: 520, w: 80, h: FOND - 520, bas: true });
      }
    }
    // Reliques : sur la trajectoire d'un vol, au milieu d'un trou.
    var libres = trous.slice(1).filter(function (tr) { return Math.abs(tr.b.x - tr.a.x) < 240; });
    for (var m = 0; m < p.rel && libres.length; m++) {
      var idx = Math.floor(r() * libres.length), tr2 = libres.splice(idx, 1)[0];
      var rx = (tr2.a.x + tr2.b.x) / 2 + entre(r, -20, 20);
      var ry = Math.max(tr2.a.y, tr2.b.y) + entre(r, 90, 170);
      L.reliques.push({ x: rx, y: borne(ry, 140, 400), sorte: m % 3, prise: false });
    }
    // Sortie : une large corniche avec la porte.

  /* ---------- Dessin du décor ---------- */
  function dessinerFond(gg, th, camx, top, visW, visH, temps) {
    // Ciel de la galerie (coordonnées du monde, l'appelant a posé la transformation).

    gr.addColorStop(0, th.haut); gr.addColorStop(0.55, th.bas); gr.addColorStop(1, th.fosse);

      gg.fillStyle = th.mur2;

      gg.moveTo(ax, 560); gg.lineTo(ax, 150); gg.quadraticCurveTo(ax + pas / 2, 20, ax + pas, 150); gg.lineTo(ax + pas, 560);

  function dessinerPlafondEtFosse(gg, th, camx, top, visW, visH, temps) {

  function dessinerCrane(gg, x, y, s, coul, alpha) {

  function dessinerCrochet(gg, c, p, t, th, cible) {

  function dessinerViseur(gg, x, y, t) {

  function dessinerLame(gg, l, t) {

  var tempsGlobal = 0;

    if (P.sol) return 0;
    return Math.max(-0.7, Math.min(0.7, P.vx * 0.0007));
  }
  function dessinerScene(S, mortK) {
    var th = THEMES[S.L.etage], t = tempsGlobal;
    var sx = cam.secousse > 0 ? (Math.random() - 0.5) * cam.secousse * 14 : 0, sy = cam.secousse > 0 ? (Math.random() - 0.5) * cam.secousse * 14 : 0;
    g.setTransform(DPR * cam.s, 0, 0, DPR * cam.s, (-cam.x * cam.s + sx) * DPR, (-cam.top * cam.s + sy) * DPR);

    for (var v = 0; v < L.vapeurs.length; v++) if (L.vapeurs[v].x > gauche - 100 && L.vapeurs[v].x < droite) dessinerVapeur(g, L.vapeurs[v], S.t, th);

  function finGalerie(gagne) {
    finFaite = true; ent.tenir = false; cacherBulle();
    var etoiles = 0, lignes = [], score = 0, recordBattu = false, ancienRecord = prog.records[niv];
    var L = S.L, tps = Math.round(S.chrono * 10) / 10, totAvant = totalEtoiles();
    if (gagne) {
      var e2 = tps <= L.tref, e3 = S.reliques >= L.reliques.length;
      etoiles = 1 + (e2 ? 1 : 0) + (e3 ? 1 : 0);
      score = 500 + S.reliques * 150 + S.parfaits * 40 + S.vies * 60 + Math.max(0, Math.round((L.tref - tps) * 25));
      if (!ancienRecord || tps < ancienRecord) { recordBattu = !!ancienRecord; prog.records[niv] = tps; }
      prog.etoiles[niv] = Math.max(prog.etoiles[niv], etoiles);
      prog.scores[niv] = Math.max(prog.scores[niv], score);
      prog.debloque = Math.max(prog.debloque, Math.min(NB, niv + 2));
      ecrire(Math.min(NB, niv + 2));
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: niv + 1 });
      var toutes = true; for (var k = 0; k < NB; k++) if (prog.etoiles[k] < 1) toutes = false;
      if (toutes) { if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NB * 3 }); }
      SONS.victoire();
      for (var c = 0; c < 40; c++) eclat(S.j.x, S.j.y - 20, 1, ['#ffd257', '#fff1b0', '#e8dab8'][c % 3], 380, 5, 500);
      $('finTitre').textContent = niv === NB - 1 ? tr('fin.finale') : tr('fin.victoire');
      $('finTexte').textContent = tr('fin.criteres');
      lignes.push('<div>' + esc(tr('fin.temps', { t: formatTemps(tps), r: formatTemps(L.tref) })) + '</div>');
      lignes.push('<div>' + esc(tr('fin.reliques', { a: S.reliques, b: L.reliques.length })) + '</div>');
      lignes.push('<div>' + esc(tr('fin.parfaits', { n: S.parfaits })) + '</div>');
      lignes.push('<div>' + esc(tr('fin.lanternes', { n: S.vies })) + '</div>');
      lignes.push('<div><b id="finScore">' + esc(tr('fin.score', { n: nb(0) })) + '</b></div>');
      lignes.push('<div class="record">' + esc(recordBattu ? tr('fin.record') : (ancienRecord ? tr('fin.recordAncien', { t: formatTemps(prog.records[niv]) }) : tr('fin.premier'))) + '</div>');
      if (niv === NB - 1) lignes.push('<div class="record">' + esc(tr('fin.total', { n: totalEtoiles(), m: NB * 3 })) + '</div>');
      var deb = debloqueAvecEtoiles(totAvant, totalEtoiles());
      if (deb) lignes.push('<div class="record">' + esc(tr('fin.equipement')) + '</div>');
    } else {
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: niv + 1 });
      SONS.defaite();
      $('finTitre').textContent = tr('fin.defaite');
      $('finTexte').textContent = tr('fin.defaiteTexte', { p: Math.max(0, Math.min(99, Math.round(maxX / L.fin * 100))) });
      lignes.push('<div>' + esc(tr('fin.temps', { t: formatTemps(tps), r: formatTemps(L.tref) })) + '</div>');
      lignes.push('<div>' + esc(tr('fin.reliques', { a: S.reliques, b: L.reliques.length })) + '</div>');
    }
    $('finLignes').innerHTML = lignes.join('');
    var etoilesEl = $('finEtoiles'); etoilesEl.innerHTML = gagne ? SVG_ETOILE(etoiles >= 1) + SVG_ETOILE(etoiles >= 2) + SVG_ETOILE(etoiles >= 3) : '';
    var boutons = $('finBoutons'); boutons.innerHTML = '';
    function bouton(cle, gros, action) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'btn' + (gros ? ' gros' : ' sec'); b.textContent = tr(cle);
      b.addEventListener('click', function () { SONS.clic(); action(); }); boutons.appendChild(b); return b;
    }
    if (gagne && niv < NB - 1) bouton('fin.suivant', true, function () { lancer(niv + 1); });
    if (!gagne) bouton('fin.reessayer', true, function () { lancer(niv); });
    else bouton('fin.rejouer', niv === NB - 1, function () { lancer(niv); });
    if (!gagne) bouton('fin.rejouer', false, function () { lancer(niv); });
    bouton('galeries', false, ouvrirGaleries);
    bouton('accueil', false, allerTitre);
    setTimeout(function () {
      $('ecranFin').classList.remove('cache');
      var svgs = etoilesEl.querySelectorAll('svg');
      for (var s = 0; s < svgs.length; s++) (function (k) { setTimeout(function () { svgs[k].classList.add('vue'); if (k < etoiles) SONS.etoile(k); }, 250 + k * 300); })(s);
      if (gagne) defiler($('finScore'), score);
      var premier = boutons.querySelector('button'); if (premier) premier.focus();
    }, gagne ? 700 : 300);
  }
  function debloqueAvecEtoiles(avant, apres) {
    var listes = [TENUES, CORDES, GRAPPINS];
    for (var l = 0; l < 3; l++) for (var k = 0; k < listes[l].length; k++) if (listes[l][k].seuil > avant && listes[l][k].seuil <= apres) return true;
    return false;
  }
  function defiler(el, cible) {
    if (!el) return; var t0 = performance.now();
    (function pasDef() {
      var u = Math.min(1, (performance.now() - t0) / 900);
      el.textContent = tr('fin.score', { n: nb(Math.round(cible * u)) });
      if (u < 1) requestAnimationFrame(pasDef);
    })();
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* --- Événements de la simulation : sons et effets --- */
  function traiterEvenements() {
    for (var k = 0; k < S.ev.length; k++) {
      var e = S.ev[k];
      switch (e.e) {
        case 'tir': SONS.tir(); cacherBulle(); break;
        case 'accroche': SONS.accroche(e.type); eclat(e.x, e.y, 6, '#ffe7a8', 120, 3, 300); break;
        case 'lache': if (!e.force) SONS.lache(); break;
        case 'parfait': SONS.parfait(); eclat(e.x, e.y, 18, '#ffd257', 260, 4, 200); flotter(e.x, e.y - 30, tr('flot.parfait')); break;
        case 'casse': SONS.casse(); eclat(e.x, e.y, 14, '#b0582a', 200, 4, 800); flotter(e.x, e.y + 30, tr('flot.casse'), '#ffab7a'); cam.secousse = 0.4; break;
        case 'efface': SONS.accroche('s'); eclat(e.x, e.y, 12, '#9ff0ff', 140, 3, -50); break;
        case 'coupe': SONS.coupe(); eclat(e.x, e.y, 16, '#eef3f8', 260, 3, 400); flotter(e.x, e.y, tr('flot.coupe'), '#ffab7a'); cam.secousse = 0.5; break;
        case 'relique': SONS.relique(); eclat(e.x, e.y, 22, '#ffd257', 220, 4, 100); flotter(e.x, e.y - 24, tr('flot.relique')); break;
        case 'mort': SONS.mort(e.cause); cam.secousse = 1; mortT = 0; eclat(e.x, e.y, 20, '#2a1a20', 240, 5, 300);
          if (navigator.vibrate) { try { navigator.vibrate(120); } catch (er) { /* rien */ } } break;
        case 'pose': SONS.pose(); eclat(e.x, e.y, 8, '#8a7a6a', 120, 3, 400); break;
        case 'reprise': SONS.reprise(); break;
        case 'gagne': break;
      }
    }
    S.ev.length = 0;
  }

  /* --- Commandes --- */
  cv.addEventListener('pointerdown', function (e) {
    if (etat !== 'jeu' || pause || tutoOuvert || finFaite) return;
    initAudio(); pointeurs++; ent.tenir = true;
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
    e.preventDefault();
  });
  function relache() { pointeurs = Math.max(0, pointeurs - 1); if (!pointeurs && !toucheTenir()) ent.tenir = false; }
  cv.addEventListener('pointerup', relache);
  cv.addEventListener('pointercancel', relache);
  cv.addEventListener('lostpointercapture', function () { pointeurs = 0; if (!toucheTenir()) ent.tenir = false; });
  var TENIR = { Space: 1, ArrowUp: 1, KeyW: 1, KeyZ: 1, Enter: 1, NumpadEnter: 1 };
  function toucheTenir() { for (var k in TENIR) if (touches[k]) return true; return false; }
  function majDir() { ent.dir = ((touches.ArrowRight || touches.KeyD) ? 1 : 0) - ((touches.ArrowLeft || touches.KeyA || touches.KeyQ) ? 1 : 0); }
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (etat === 'jeu' && !finFaite && !tutoOuvert) { if (pause) reprendrePartie(); else mettrePause(); e.preventDefault(); }
      return;
    }
    var surBouton = document.activeElement && document.activeElement.tagName === 'BUTTON';
    if (etat === 'jeu' && !pause && !tutoOuvert && !finFaite) {
      if (TENIR[e.code] || e.code.indexOf('Arrow') === 0 || e.code === 'KeyA' || e.code === 'KeyD' || e.code === 'KeyQ') {
        if (surBouton) document.activeElement.blur();
        initAudio(); touches[e.code] = true; if (TENIR[e.code]) ent.tenir = true; majDir(); e.preventDefault();
      }
    } else if (etat === 'titre' && !surBouton && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); $('bJouer').click(); }
  });
  window.addEventListener('keyup', function (e) {
    touches[e.code] = false; majDir();
    if (TENIR[e.code] && !toucheTenir() && !pointeurs) ent.tenir = false;
  });
  window.addEventListener('blur', function () { touches = {}; pointeurs = 0; ent.tenir = false; ent.dir = 0; });

  /* --- Boucle principale --- */
  var dernier = 0, reste = 0, PAS = 1 / 120, sonGoutte = 0;
  function boucle(now) {
    requestAnimationFrame(boucle);
    var dt = dernier ? Math.min(0.05, (now - dernier) / 1000) : 0.016; dernier = now;
    if (AFFICHE) return;
    tempsGlobal += dt;
    cam.secousse = Math.max(0, cam.secousse - dt * 2.5);
    if (etat === 'jeu' && S) {
      var actifJeu = !pause && !tutoOuvert && !fige && !finFaite;
      if (actifJeu) {
        if (S.j.mort) {
          mortT += dt;
          if (mortT > 1.0) {
            if (S.vies <= 0) finGalerie(false);
            else { SIM.reprendre(S); traiterEvenements(); majCamera(S, 0, true); montrerBulle(tr('bulle.reprise')); }
          }
        } else {
          reste += dt;
          while (reste >= PAS) { SIM.pas(S, PAS, ent); reste -= PAS; if (S.j.mort || S.gagne) { reste = 0; break; } }
          traiterEvenements();
          if (S.j.x > maxX) maxX = S.j.x;
          if (S.gagne) finGalerie(true);
          sonGoutte -= dt; if (sonGoutte < 0) { sonGoutte = 2 + Math.random() * 4; SONS.goutte(); }
        }
        majHud();
      } else if (!fige) traiterEvenements();
      majParticules(dt);
      if (!S.j.mort && !fige) majCamera(S, dt, false);
      dessinerScene(S, mortT);
      if (tutoOuvert) dessinerDemo();
    } else if (titreS) {
      // Écran titre et menus : un explorateur traverse l'ossuaire tout seul.
      var cmd = piloter(titreS, titreMemo);
      reste += dt;
      while (reste >= PAS) { SIM.pas(titreS, PAS, cmd); reste -= PAS; }
      titreS.ev.length = 0;
      if (titreS.j.mort || titreS.gagne || titreS.t > 60) { titreS = SIM.creer(0, 340); cam.x = -200; }
      majCamera(titreS, dt, false);
      var Ssave = S; S = null; dessinerScene(titreS, 0); S = Ssave;
      if (etat === 'menu' && !$('ecranEquip').classList.contains('cache')) dessinerApercuEquip();
    }
  }

  /* ---------- Affiche (jaquette) ---------- */
  function dessinerAffiche() {
    document.querySelectorAll('.jel-langue, jel-langue').forEach(function (el) { el.style.display = 'none'; });
    var th = THEMES[0];
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    var k = Math.min(W / 600, H / 800);
    g.fillStyle = '#2a1c14'; g.fillRect(0, 0, W, H);
    g.translate((W - 600 * k) / 2, (H - 800 * k) / 2); g.scale(k, k);
    // Fond : voûte de l'ossuaire éclairée par une torche.
    var gr = g.createLinearGradient(0, 0, 0, 800);
    gr.addColorStop(0, '#6a4a34'); gr.addColorStop(0.5, '#4a3324'); gr.addColorStop(0.8, '#1d1410'); gr.addColorStop(1, '#0c0807');
    g.fillStyle = gr; g.fillRect(-200, 0, 1000, 800);
    for (var a = -1; a < 4; a++) {
      var ax = a * 200 + 20;
      g.fillStyle = '#3e2c21';
      g.beginPath(); g.moveTo(ax, 700); g.lineTo(ax, 250); g.quadraticCurveTo(ax + 100, 110, ax + 200, 250); g.lineTo(ax + 200, 700);
      g.lineTo(ax + 176, 700); g.lineTo(ax + 176, 260); g.quadraticCurveTo(ax + 100, 150, ax + 24, 260); g.lineTo(ax + 24, 700); g.fill();
      for (var r = 0; r < 4; r++) for (var c = 0; c < 2; c++) if (hash(a * 11 + r * 2 + c) < 0.7) dessinerCrane(g, ax + 70 + c * 60, 300 + r * 70, 1, '#d8c7a2', 0.32);
    }
    // Grande lueur de torche (source visible en haut à gauche) et lueur verte de la fosse.
    g.save(); g.globalCompositeOperation = 'lighter';
    var tg = g.createRadialGradient(110, 180, 10, 110, 180, 420);
    tg.addColorStop(0, 'rgba(255,170,80,.75)'); tg.addColorStop(0.4, 'rgba(255,130,50,.25)'); tg.addColorStop(1, 'rgba(255,120,40,0)');
    g.fillStyle = tg; g.fillRect(-300, -240, 840, 840);
    var vg = g.createRadialGradient(330, 800, 20, 330, 800, 380);
    vg.addColorStop(0, 'rgba(90,255,170,.45)'); vg.addColorStop(1, 'rgba(90,255,170,0)');
    g.fillStyle = vg; g.fillRect(-60, 420, 780, 760);
    g.restore();
    g.fillStyle = '#2a1a10'; g.fillRect(104, 186, 12, 50);
    g.fillStyle = '#ff9a3c'; g.beginPath(); g.moveTo(92, 190); g.quadraticCurveTo(112, 120, 128, 190); g.fill();
    g.fillStyle = '#fff1b8'; g.beginPath(); g.moveTo(102, 190); g.quadraticCurveTo(112, 150, 120, 190); g.fill();
    // Plafond.
    g.fillStyle = '#5e4636'; g.beginPath(); g.moveTo(-10, 0);
    for (var x = -10; x < 620; x += 36) { g.lineTo(x, 22); g.lineTo(x + 18, 40 + hash(x) * 40); }
    g.lineTo(620, 0); g.fill();
    // Fosse et mains griffues.
    var fg = g.createLinearGradient(0, 560, 0, 800); fg.addColorStop(0, 'rgba(5,10,8,0)'); fg.addColorStop(1, 'rgba(5,10,8,.9)');
    g.fillStyle = fg; g.fillRect(-10, 560, 620, 260);
    g.save(); g.translate(330, 0); g.scale(1.25, 1.25); dessinerMains(g, 0, 690 / 1.25, 0.42, 0.3); g.restore();
    g.save(); g.translate(130, 0); g.scale(0.9, 0.9); dessinerMains(g, 0, 840, 0.5, 1.2); g.restore();
    g.save(); g.globalAlpha = 1;
    g.fillStyle = 'rgba(255,220,90,.95)';
    [[210, 690], [228, 690], [470, 720], [488, 720], [380, 760], [396, 760]].forEach(function (o) { g.beginPath(); g.ellipse(o[0], o[1], 6, 3.2, 0, 0, 7); g.fill(); });
    g.restore();
    // Crochet rouillé, chaîne, corde et héros en grand.
    var hx = 452, hy = 120;
    g.strokeStyle = '#7d7b80'; g.lineWidth = 6;
    for (var m = 0; m < 7; m++) { g.beginPath(); g.ellipse(hx, 18 + m * 14, m % 2 ? 4 : 8, m % 2 ? 8 : 4, 0, 0, 7); g.stroke(); }
    g.save(); g.translate(hx, hy); g.scale(2.6, 2.6);
    dessinerCrochet(g, { type: 'r', casse: false, tAcc: 1.3 }, { x: 0, y: 0 }, 0.3, th, true);
    g.restore();
    var jx = 255, jy = 420;
    // Traînée de mouvement.
    g.strokeStyle = 'rgba(255,230,170,.25)'; g.lineWidth = 3;
    for (var s2 = 0; s2 < 5; s2++) { g.beginPath(); g.arc(hx, hy, 340 + s2 * 12, 2.05, 2.45); g.stroke(); }
    var ra = Math.atan2(hx - jx, -(hy - jy));
    dessinerCorde(g, jx + (2 * Math.cos(ra) + 26 * Math.sin(ra)) * 6.2, jy + (2 * Math.sin(ra) - 26 * Math.cos(ra)) * 6.2, hx, hy + 10, CORDES[0], true);
    g.save(); g.globalCompositeOperation = 'lighter';
    var lg2 = g.createRadialGradient(jx + 30, jy + 20, 10, jx + 30, jy + 20, 230);
    lg2.addColorStop(0, 'rgba(255,200,110,.6)'); lg2.addColorStop(1, 'rgba(255,170,70,0)');
    g.fillStyle = lg2; g.fillRect(jx - 220, jy - 220, 500, 500); g.restore();
    // Contour clair du héros.
    g.save(); g.shadowColor = 'rgba(255,220,160,.9)'; g.shadowBlur = 18;
    dessinerJoueur(g, jx, jy, Math.atan2(hx - jx, -(hy - jy)), TENUES[0], { vol: true, att: true, echarpe: 1 }, 0.4, 6.2);
    g.restore();
    // Relique dorée qui scintille sur la trajectoire.
    dessinerRelique(g, { x: 500, y: 330, sorte: 1 }, 0.2, 2.2);
    // Premier plan : crânes et ossements, colonne coupée à gauche.
    g.fillStyle = '#2a1d15'; g.fillRect(-10, 0, 46, 800);
    g.fillStyle = 'rgba(255,170,80,.25)'; g.fillRect(30, 0, 6, 800);
    for (var o = 0; o < 9; o++) dessinerCrane(g, 20 + o * 70 + hash(o) * 20, 760 + hash(o * 3) * 30, 2.2, '#c9b893', 0.9);
    g.setTransform(1, 0, 0, 1, 0, 0);
  }

  /* ---------- Images de la page du jeu ---------- */
  function ouvrirApercu(n) {
    var choix = [null, { niv: 0, k: 3, t: 6.2, rel: 1, ang: 0.55, v: 520, cr: 0 }, { niv: 7, k: 7, t: 23.4, rel: 2, ang: 0.6, v: 560, cr: 0 },
      { niv: 16, k: 9, t: 31.7, rel: 3, ang: 0.5, v: 600, cr: 1 }][n];
    lancer(choix.niv);
    tutoOuvert = false; cacher('ecranTuto'); cacherBulle(); bulle.classList.add('cache');
    // Image 2 : le crochet juste avant une nuée de chauves-souris.
    if (n === 2 && S.L.nuees.length) {
      var nu = S.L.nuees[Math.min(1, S.L.nuees.length - 1)];
      for (var q = 0; q < S.L.crochets.length; q++) if (S.L.crochets[q].x < nu.x - 40 && S.L.crochets[q].type === 'n') choix.k = q;
    }
    var c = S.L.crochets[choix.k];
    S.t = choix.t; S.chrono = choix.t - 1.5; S.demarre = true;
    var p = SIM.position(c, S.t, { x: 0, y: 0 }), Lr = 150;
    S.j.attente = false; S.j.sol = false; S.j.att = c; S.j.L = Lr; S.j.Lcible = Lr;
    S.j.x = p.x + Math.sin(choix.ang) * Lr; S.j.y = p.y + Math.cos(choix.ang) * Lr;
    S.j.vx = Math.cos(choix.ang) * choix.v; S.j.vy = -Math.sin(choix.ang) * choix.v;
    for (var r = 0; r < S.L.reliques.length && r < choix.rel; r++) { S.L.reliques[r].prise = true; S.reliques++; }
    if (n === 3) { S.vies = 3; S.creatureX = S.j.x - 175; }
    if (n === 2) S.vies = 4;
    majCamera(S, 0, true); majHud(true);
    if (n === 3) cam.x -= 110;
    if (n === 2 && S.L.nuees.length) {
      // La nuée bien en vue, à mi-hauteur.
      for (var tt = 0; tt < 800; tt++) {
        var t2 = S.t + tt * 0.01, pn = SIM.nueePos(nu, t2, { x: 0, y: 0 }), loin = true;
        for (var w = 0; w < S.L.nuees.length; w++) {
          var pw = SIM.nueePos(S.L.nuees[w], t2, { x: 0, y: 0 });
          if (Math.abs(pw.x - S.j.x) < 140 && Math.abs(pw.y - S.j.y) < 140) loin = false;
        }
        if (loin && pn.y > 240 && pn.y < 340) { S.t = t2; break; }
      }
    }
    fige = true;
  }

  /* ---------- Démarrage ---------- */
  function majTextes() { majBoutonsSon(); if (etat === 'titre') $('totalTitre').textContent = tr('total', { n: totalEtoiles(), m: NB * 3 }); }
  if (window.JEL_I18N.surChangement) window.JEL_I18N.surChangement(majTextes);
  window.addEventListener('resize', taille);
  chargerProg();
  taille();
  majBoutonsSon();
  window.JEL_SAVE.surFermeture(function () { if (etat === 'jeu' && S && !finFaite) ecrire(niv + 1); });
  if (AFFICHE) { dessinerAffiche(); return; }
  if (NUM_APERCU) { ouvrirApercu(NUM_APERCU); requestAnimationFrame(boucle); return; }
  allerTitre();
  requestAnimationFrame(boucle);
})();
</script>
