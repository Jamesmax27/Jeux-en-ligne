    if(peutLier){const b=document.createElement('button');b.className='btn principal';b.style.fontSize='1em';b.textContent=t('fin.lier');b.onclick=()=>lier(e);rangee.appendChild(b);const b2=document.createElement('button');b2.className='btn';b2.textContent=t('fin.laisser');b2.onclick=()=>quitterRencontre();rangee.appendChild(b2)}
    else{const b=document.createElement('button');b.className='btn principal';b.style.fontSize='1em';b.textContent=t('fin.continuer');b.onclick=()=>quitterRencontre();rangee.appendChild(b)}
    fin.appendChild(rangee);fin.className='on';document.querySelectorAll('.posture').forEach(x=>x.disabled=true);focusPremier(fin)},delai||300)}
function lier(e){if(S.compagnons.length>=COMPAGNONS_MAX){const parti=S.compagnons.shift();toast(t('fin.compagnonParti',{nom:t('esp.'+parti)}))}S.compagnons.push(e.id);X.liens.push(e.id);sfx('victoire');toast(t('fin.compagnon',{nom:t('esp.'+e.id)}));quitterRencontre()}
function quitterRencontre(){if(!X||!X.r)return;X.r=null;montrer('carte');majHudCarte();
  if(X.blessures>=BLESSURES_MAX){return echouer()}
  journal(pick([t('j.suite1'),t('j.suite2')]));verifierObjectif()}

/* ---------- fin d'expédition ---------- */
function reussir(){if(!X||X.fini)return;
  if (window.FMG) window.FMG.reportEnd({ completed: true, level: X.n });
  X.fini=true;X.reussi=true;const n=X.n;const etoiles=1+(X.blessuresRecues===0?1:0)+(X.pas<=X.niv.par?1:0);
  const avant=S.etoiles[n]||0;S.etoiles[n]=Math.max(avant,etoiles);S.debloque=Math.max(S.debloque,Math.min(NIVEAUX.length,n+1));if(n===NIVEAUX.length)S.fini=true;
  sauver(Math.min(NIVEAUX.length,n+1));sfx('victoire');
  const nbEsp=Object.keys(X.notesExp).length;const fiches=LISTE_ESPECES.filter(e=>fiche(e.id).notes>=NOTES_MAX).length;
  const html=`<span class="etiquette">${esc(t('bilan.reussite'))}</span><h2>${esc(nomNiveau(n))}</h2>
   <div class="grosses-etoiles">${[1,2,3].map(i=>`<span class="${i<=etoiles?'':'vide'}">★</span>`).join('')}</div>
   <p>${esc(t(n===NIVEAUX.length?'bilan.finalTexte':etoiles===3?'bilan.parfait':etoiles===2?'bilan.bien':'bilan.ok'))}</p>
   <div class="stats"><div><span>${esc(t('bilan.pas'))}</span><b>${NB(X.pas)} / ${NB(X.niv.par)}</b></div><div><span>${esc(t('bilan.blessures'))}</span><b>${NB(X.blessuresRecues)}</b></div><div><span>${esc(t('bilan.especes'))}</span><b>${NB(nbEsp)}</b></div><div><span>${esc(t('bilan.fiches'))}</span><b>${NB(fiches)} / ${NB(LISTE_ESPECES.length)}</b></div></div>
   ${etoiles>avant&&avant>0?`<p class="record">${esc(t('bilan.record'))}</p>`:''}<p>${esc(t('bilan.total',{n:totalEtoiles(),max:NIVEAUX.length*3}))}</p>
   <div class="rangee">${n<NIVEAUX.length?`<button class="btn principal" data-a="suivant">${esc(t('bilan.suivant'))}</button>`:''}<button class="btn" data-a="rejouer">${esc(t('bilan.rejouer'))}</button><button class="btn" data-a="niveaux">${esc(t('bilan.niveaux'))}</button></div>`;
  afficherBilan(html,true)}
function echouer(){if(!X||X.fini)return;
  if (window.FMG) window.FMG.reportEnd({ completed: false, level: X.n });
  X.fini=true;sauver(X.n);sfx('defaite');const n=X.n;
  const html=`<span class="etiquette">${esc(t('bilan.echec'))}</span><h2>${esc(nomNiveau(n))}</h2><p>${esc(t('bilan.echecTexte'))}</p>
   <div class="stats"><div><span>${esc(t('bilan.pas'))}</span><b>${NB(X.pas)}</b></div><div><span>${esc(t('bilan.especes'))}</span><b>${NB(Object.keys(X.notesExp).length)}</b></div></div>
   <div class="rangee"><button class="btn principal" data-a="rejouer">${esc(t('bilan.reessayer'))}</button><button class="btn" data-a="niveaux">${esc(t('bilan.niveaux'))}</button></div>`;
  afficherBilan(html,false)}
function afficherBilan(html,ok){const c=$('bilan-carte');c.className='carte-ui'+(ok?' parchemin':'');c.innerHTML=html;superposer('ecran-bilan',true);
  c.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{superposer('ecran-bilan',false);const a=b.dataset.a;if(a==='suivant')lancerExpedition(X.n+1);else if(a==='rejouer')lancerExpedition(X.n);else{X=null;battement(false);ouvrirNiveaux()}});focusPremier(c)}

/* ---------- niveaux et carnet ---------- */
function ouvrirNiveaux(){chargerS();montrer('niveaux');const el=$('liste-niveaux');el.innerHTML='';$('total-niveaux').textContent=t('niveaux.total',{n:totalEtoiles(),max:NIVEAUX.length*3});
  NIVEAUX.forEach(niv=>{const n=niv.num;const ouvert=n<=S.debloque;const et=S.etoiles[n]||0;const b=document.createElement('button');b.className='niv'+(ouvert?'':' ferme')+(et?' fait':'');b.style.setProperty('--teinte',ZONES[niv.zone].teinte);
    b.innerHTML=`<span class="num">${ouvert?NB(n):'🔒'}</span><span class="zone">${esc(nomNiveau(n))}</span><span class="etoiles">${[1,2,3].map(i=>`<span class="${i<=et?'':'vide'}">★</span>`).join('')}</span>`;
    b.setAttribute('aria-label',t('niv.n',{n})+' · '+nomNiveau(n)+(ouvert?'':' · '+t('niveaux.ferme')));if(!ouvert)b.disabled=true;b.onclick=()=>{audioDebloque();sfx('clic');lancerExpedition(n)};el.appendChild(b)})}
function ouvrirCarnet(){chargerS();G.carnetRetour=G.ecran;montrer('carnet');const el=$('liste-carnet');el.innerHTML='';let completes=0,vues=0;
  LIGNEES.forEach(l=>{const h=document.createElement('h3');h.className='lignee';h.textContent=t('lignee.'+l)+' · '+t('talent.'+l);el.appendChild(h);
    PAR_LIGNEE[l].forEach(e=>{const f=fiche(e.id);if(f.notes>=NOTES_MAX)completes++;if(f.vu)vues++;const d=document.createElement('div');d.className='fiche'+(f.vu?'':' inconnue');
      const cv=document.createElement('canvas');vignetteBete(cv,e,!f.vu,{w:64,h:48});d.appendChild(cv);
      const txt=document.createElement('div');txt.className='txt';const comp=S.compagnons.includes(e.id);
      const detail=f.vu?[t('tempe.'+e.tempe),t('act.'+e.act),e.zones.map(z=>t('zone.'+z)).join(', '),t('taille.'+e.taille)].join(' · '):t('carnet.inconnueDetail');
      txt.innerHTML=`<div class="nom">${esc(f.vu?t('esp.'+e.id):t('carnet.inconnue'))}${comp?' 🐾':''}</div><div class="latin">${esc(f.vu?e.latin:'—')}</div><div class="detail">${esc(detail)}</div><div class="notes">${Array.from({length:NOTES_MAX},(_,i)=>`<span class="${i<f.notes?'':'vide'}">●</span>`).join('')}${f.lien?` <span class="lien">${'♥'.repeat(f.lien)}</span>`:''}</div>`;
      d.appendChild(txt);el.appendChild(d)})});
  $('carnet-resume').textContent=t('carnet.resume',{vues,completes,total:LISTE_ESPECES.length})}
function fermerCarnet(){const r=G.carnetRetour||'titre';if(r==='carte'&&X)montrer('carte');else if(r==='niveaux')ouvrirNiveaux();else montrer('titre')}

/* ---------- pause ---------- */
function mettrePause(on){if(on&&!(G.ecran==='carte'||G.ecran==='rencontre')||!X)return;if(on&&G.fiche)return;G.pause=!!on;superposer('ecran-pause',on);if(on){$('pause-info').textContent=t('niv.n',{n:X.n})+' · '+nomNiveau(X.n);majBoutonsSon();focusPremier($('ecran-pause'))}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&X&&!X.fini&&(G.ecran==='carte'||G.ecran==='rencontre'))mettrePause(true)});

/* ---------- tutoriel animé et notes de terrain ---------- */
const TUTO_ETAPES=['carte','posture','jauges'];
function montrerTuto(apres){G.tuto={etape:0,apres,t0:performance.now()};superposer('tuto',true);$('tuto-etiquette').textContent=t('tuto.etiquette');etapeTuto();G.tuto.timer=setInterval(()=>{if(G.tuto&&performance.now()-G.tuto.t0>3600)suiteTuto()},300)}
function etapeTuto(){const k=G.tuto.etape;const cle=TUTO_ETAPES[k];$('tuto-titre').textContent=t('tuto.'+cle+'.titre');$('tuto-texte').textContent=t('tuto.'+cle+'.texte');$('bt-tuto-suite').textContent=t(k===TUTO_ETAPES.length-1?'tuto.partir':'tuto.suite');
  $('tuto-points').innerHTML=TUTO_ETAPES.map((_,i)=>`<span class="${i===k?'on':''}"></span>`).join('');G.tuto.t0=performance.now();$('tuto-main').hidden=false}
function suiteTuto(){if(!G.tuto)return;G.tuto.etape++;if(G.tuto.etape>=TUTO_ETAPES.length){clearInterval(G.tuto.timer);const a=G.tuto.apres;G.tuto=null;superposer('tuto',false);if(a)a();return}etapeTuto()}
const TUTO_CARTE=(()=>{const lieux=[{x:.5,y:.85,type:'depart',vu:true,visite:true},{x:.3,y:.5,type:'point',vu:true},{x:.7,y:.5,type:'cache',vu:true},{x:.5,y:.15,type:'but',vu:false}];return {zone:'contreforts',seed:3,lieux,aretes:[[0,1],[0,2],[1,3],[2,3]],couches:3}})();
function dessinerDemo(T){const cv=$('cv-demo');if(!cv||!(G.tuto||G.fiche))return;const {w,h,d}=tailleCanvas(cv);const ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);const main=$('tuto-main');
  const k=G.tuto?TUTO_ETAPES[G.tuto.etape]:G.fiche;const ph=((T*1000)%3600)/3600;
  if(k==='carte'||k==='traces'||k==='carnet'){const vis=ph>.5;TUTO_CARTE.lieux[1].visite=vis;TUTO_CARTE.lieux[3].vu=vis;TUTO_CARTE.lieux[1].traces=k==='traces';dessinerCarte(cv,TUTO_CARTE,{courant:vis?1:0,atteignables:vis?[3,0]:[1,2],surligne:-1,temps:T});
    if(G.tuto){main.hidden=false;const x=lerp(.5,.3,clamp(ph*2.2,0,1)),y=lerp(.85,.5,clamp(ph*2.2,0,1));main.style.left=(x*100)+'%';main.style.top=(y*100)+'%';main.style.transform=`translate(-50%,-30%) scale(${ph>.4&&ph<.55?.85:1})`}else main.hidden=true;return}
  const bete=k==='ancien'?ESPECES['cerf-aux-cent-bois']:k==='meute'?ESPECES['loup-blanc-du-col']:k==='nuit'?ESPECES['grand-duc-de-suie']:k==='viande'?ESPECES['panthere-de-suie']:k==='lien'?ESPECES['loup-gris-de-brume']:k==='pluie'?ESPECES['serpent-de-vase']:k==='charognards'?ESPECES['scarabee-fossoyeur']:k==='froid'||k==='neige'?ESPECES['once-des-neiges']:k==='blessure'?ESPECES['ours-des-tourbes']:ESPECES['vorrak-des-landes'];
  const agro=k==='posture'?(ph<.5?70:20):k==='jauges'?30+Math.sin(T*2)*25:45;
  dessinerScene(ctx,w,h,{zone:k==='ancien'?'faille':k==='froid'||k==='neige'?'glacier':k==='pluie'||k==='charognards'||k==='blessure'?'tourbiere':k==='nuit'||k==='viande'||k==='lien'?'foret':'contreforts',heure:k==='nuit'||k==='charognards'||k==='ancien'?'nuit':'crepuscule',meteo:k==='pluie'?'pluie':k==='neige'?'neige':'clair',bete,agro,peur:k==='posture'&&ph>.5?80:30,temps:T,lanterne:k==='nuit'});
  if(k==='jauges'||k==='posture'){ // jauges dessinées : agressivité, peur, sang-froid
    const vals=[[agro,'#c75a3a'],[k==='posture'&&ph>.5?80:30,'#7f9ccf'],[70,'#c9a65a']];vals.forEach(([v,c],i)=>{ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(10,10+i*14,w*.4,8);ctx.fillStyle=c;ctx.fillRect(10,10+i*14,w*.4*v/100,8)})}
  if(k==='posture'){main.hidden=false;main.style.left=(ph<.5?'35%':'62%');main.style.top='82%';main.style.transform=`translate(-50%,-30%) scale(${(ph%.5)<.08?.85:1})`;
    ctx.fillStyle='rgba(29,35,45,.9)';ctx.strokeStyle='#5a6688';for(let i=0;i<4;i++){const x=8+i*(w-16)/4;ctx.fillRect(x,h-40,(w-16)/4-6,32);ctx.strokeRect(x,h-40,(w-16)/4-6,32)}ctx.font='18px system-ui';ctx.textAlign='center';['👁️','🥾','🔔','🤫'].forEach((s,i)=>ctx.fillText(s,8+i*(w-16)/4+(w-16)/8-3,h-16))}
  else if(k==='jauges'){main.hidden=false;main.style.left='18%';main.style.top=(14+Math.floor(ph*3)*9)+'%';main.style.transform='translate(-50%,-30%)'}
  else main.hidden=true}
function montrerFiche(k){if(!S)return;S.mecs[k]=1;G.fiche=k;superposer('tuto',true);$('tuto-etiquette').textContent=t('fiche.etiquette');$('tuto-titre').textContent=t('mec.'+k+'.titre');$('tuto-texte').textContent=t('mec.'+k+'.texte');$('tuto-points').innerHTML='';$('bt-tuto-suite').textContent=t('fiche.compris');focusPremier($('tuto'))}
function fermerFiche(){G.fiche=null;superposer('tuto',false)}

/* ---------- carte : dimensions, toucher, clavier ---------- */
function redimCarte(){const cv=$('cv-carte');tailleCanvas(cv)}
function redimScene(){tailleCanvas($('cv-scene'))}
function lieuSous(x,y){if(!X)return -1;const cv=$('cv-carte');const r=cv.getBoundingClientRect();let best=-1,bd=1e9;X.M.lieux.forEach((l,i)=>{const dx=l.x*r.width-x,dy=l.y*r.height-y;const d=dx*dx+dy*dy;if(d<bd){bd=d;best=i}});return bd<32*32?best:-1}
(function brancherCarte(){const cv=$('cv-carte');let debut=null;
  cv.addEventListener('pointerdown',e=>{debut=[e.clientX,e.clientY];e.preventDefault()});
  cv.addEventListener('pointerup',e=>{if(!debut)return;const [x0,y0]=debut;debut=null;if(Math.hypot(e.clientX-x0,e.clientY-y0)>14)return;const r=cv.getBoundingClientRect();const i=lieuSous(e.clientX-r.left,e.clientY-r.top);if(i<0)return;audioDebloque();
    if(atteignables().includes(i)){allerA(i)}else if(X&&i===X.courant){toast(t('j.ici'))}else if(X&&X.M.lieux[i].vu){toast(t('j.tropLoin'))}});
  cv.addEventListener('pointercancel',()=>{debut=null})})();

/* ---------- entrées clavier ---------- */
window.addEventListener('keydown',e=>{const c=e.code;if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  if(G.tuto){if(c==='Enter'||c==='Space'){e.preventDefault();suiteTuto()}return}
  if(G.fiche){if(c==='Enter'||c==='Space'||c==='Escape'){e.preventDefault();fermerFiche()}return}
  if($('ecran-bilan').classList.contains('actif')){if(c==='Enter'){const b=$('bilan-carte').querySelector('.btn.principal');if(b){e.preventDefault();b.click()}}return}
  if(G.pause){if(c==='Escape'||c==='KeyP'||c==='Enter'){e.preventDefault();mettrePause(false)}return}
  if(G.ecran==='titre'){if(c==='Enter'||c==='Space'){e.preventDefault();$('bt-jouer').click()}return}
  if(G.ecran==='carnet'){if(c==='Escape'){e.preventDefault();fermerCarnet()}return}
  if(G.ecran==='carte'){const at=atteignables();if(c==='Escape'||c==='KeyP'){e.preventDefault();mettrePause(true)}
    else if(c==='ArrowLeft'||c==='ArrowUp'||c==='ArrowRight'||c==='ArrowDown'||c==='Tab'&&false){e.preventDefault();if(!at.length)return;let k=at.indexOf(G.surligne);k=(c==='ArrowLeft'||c==='ArrowUp')?(k<=0?at.length-1:k-1):(k+1)%at.length;G.surligne=at[k];majHudCarte()}
    else if(c==='Enter'||c==='Space'){if(e.target&&e.target.tagName==='BUTTON')return;e.preventDefault();if(G.surligne>=0)allerA(G.surligne)}
    else if(c==='KeyB'){e.preventDefault();reposer()}else if(c==='KeyC'){e.preventDefault();ouvrirCarnet()}return}
  if(G.ecran==='rencontre'){if(c==='Escape'||c==='KeyP'){e.preventDefault();mettrePause(true);return}const m=/^(?:Digit|Numpad)([1-9])$/.exec(c);if(m){const b=document.querySelectorAll('#postures .posture')[+m[1]-1];if(b&&!b.disabled){e.preventDefault();b.click()}}
    else if(c==='Enter'||c==='Space'){const b=$('fin-rencontre').querySelector('.btn.principal');if(b&&!(e.target&&e.target.tagName==='BUTTON')){e.preventDefault();b.click()}}}
});

/* ---------- boucle d'animation ---------- */
function boucle(now){requestAnimationFrame(boucle);const dt=Math.min(.1,(now-(G.derniereImage||now))/1000);G.derniereImage=now;if(!G.pause)G.temps+=dt;const T=G.temps;
  if(G.tuto||G.fiche){if(now-(G.imgDemo||0)>40){G.imgDemo=now;dessinerDemo(T)}}
  if(G.pause&&G.ecran!=='titre')return;
  if(G.ecran==='titre'){if(now-(G.imgTitre||0)>50){G.imgTitre=now;dessinerTitre($('cv-titre'),T)}}
  else if(G.ecran==='carte'&&X){if(now-(G.imgCarte||0)>40){G.imgCarte=now;dessinerCarte($('cv-carte'),X.M,{courant:X.courant,atteignables:atteignables(),surligne:G.surligne,temps:T})}}
  else if(G.ecran==='rencontre'&&X&&X.r){if(now-(G.imgScene||0)>40){G.imgScene=now;const cv=$('cv-scene');const {w,h,d}=tailleCanvas(cv);const ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);const r=X.r;
    dessinerScene(ctx,w,h,{zone:X.niv.zone,heure:heure(),meteo:X.meteo,bete:r.fini==='fuite'||r.fini==='cede'||r.fini==='lasse'?null:r.e,agro:r.agro,peur:r.peur,temps:T,lanterne:r.lanterne,compagnon:S.compagnons[0]})}}}

/* ---------- ambiance sonore selon l'écran ---------- */
setInterval(()=>{if(!SON.ctx)return;if(G.pause||G.ecran==='titre'||G.ecran==='niveaux'||G.ecran==='carnet'){ambiance({vent:G.ecran==='titre'?.12:0,pluie:0});return}
  if(!X){ambiance({vent:0,pluie:0});return}const Z=ZONES[X.niv.zone];ambiance({vent:.1+Z.froid*.08+(G.ecran==='rencontre'?.08:0),pluie:X.meteo==='pluie'?.08:0})},800);

/* ---------- démarrage ---------- */
function demarrerNouvelle(){S=nouvelEtat();montrerTuto(()=>lancerExpedition(1))}
function init(){try{JEL_I18N.appliquer(document)}catch(e){}majBoutonsSon();
  $('bt-jouer').addEventListener('click',()=>{audioDebloque();sfx('clic');try{JEL_SAVE.reprise({jeu:JEU,onContinuer:d=>{S=etatDepuis(d);const n=clamp(parseInt(d&&d.niveau,10)||1,1,NIVEAUX.length);lancerExpedition(n)},onNouvelle:demarrerNouvelle,onEffacer:demarrerNouvelle})}catch(e){demarrerNouvelle()}});
  $('bt-niveaux-titre').addEventListener('click',()=>{audioDebloque();sfx('page');ouvrirNiveaux()});
  $('bt-carnet-titre').addEventListener('click',()=>{audioDebloque();sfx('page');ouvrirCarnet()});
  document.querySelectorAll('[data-ouvrir-carnet]').forEach(b=>b.addEventListener('click',()=>{sfx('page');ouvrirCarnet()}));
  document.querySelectorAll('[data-retour]').forEach(b=>b.addEventListener('click',()=>{sfx('clic');montrer(b.dataset.retour)}));
  $('bt-fermer-carnet').addEventListener('click',()=>{sfx('clic');fermerCarnet()});
  $('bt-carnet-carte').addEventListener('click',()=>{if(X&&!X.r){sfx('page');ouvrirCarnet()}});
  $('bt-pause-carte').addEventListener('click',()=>mettrePause(true));
  $('bt-reprendre').addEventListener('click',()=>mettrePause(false));
  $('bt-recommencer').addEventListener('click',()=>{if(!X)return;const n=X.n;mettrePause(false);battement(false);lancerExpedition(n)});
  $('bt-accueil').addEventListener('click',()=>{if(X)sauver(X.n);mettrePause(false);battement(false);X=null;montrer('titre')});
  document.querySelectorAll('#bt-son-titre,#bt-son-carte,#bt-son-pause').forEach(b=>b.addEventListener('click',()=>{audioDebloque();setMuet(!SON.muet);if(!SON.muet)sfx('clic')}));
  $('bt-bivouac').addEventListener('click',reposer);
  $('bt-aller').addEventListener('click',()=>{audioDebloque();if(G.surligne>=0)allerA(G.surligne)});
  $('bt-tuto-suite').addEventListener('click',()=>{audioDebloque();sfx('clic');if(G.fiche)fermerFiche();else suiteTuto()});
  try{JEL_I18N.surChangement(()=>{majBoutonsSon();if(X)majHudCarte();if(G.ecran==='niveaux')ouvrirNiveaux();if(G.ecran==='carnet')ouvrirCarnet()})}catch(e){}
  window.addEventListener('resize',()=>{if(G.ecran==='carte')redimCarte();if(G.ecran==='rencontre')redimScene()});
  // sauvegarde à la fermeture : seulement pendant une partie (jamais depuis l'écran titre)
  JEL_SAVE.surFermeture(()=>{if(S)sauver(X?X.n:S.debloque)});
  requestAnimationFrame(boucle)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
</body>
</html>
