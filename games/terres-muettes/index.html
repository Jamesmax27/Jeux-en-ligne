  "tuto.carte.titre": "Lève la carte",
  "tuto.carte.texte": "Touche un lieu cerclé pour t'y rendre. Chaque pas fait avancer l'heure ; la nuit, les bêtes changent.",
  "tuto.posture.titre": "Face à une bête, une posture par tour",
  "tuto.posture.texte": "Tenir le regard, reculer, faire du bruit, rester immobile… Chaque espèce réagit à sa manière : observe, et retiens.",
  "tuto.jauges.titre": "Trois jauges",
  "tuto.jauges.texte": "Agressivité à 72 : elle charge. Peur à 100 : elle fuit. Agressivité basse et peur basse : elle cède. Ton sang-froid à zéro : tu paniques.",
  "tuto.suite": "Suite",

  "fiche.etiquette": "Note de terrain",
  "fiche.compris": "Compris",
  "mec.postures.titre": "Première rencontre",
  "mec.postures.texte": "Une bête craintive fuit si tu fais du bruit, et cède si tu restes immobile. Une bête territoriale veut te voir reculer. Un prédateur n'aime ni la lumière ni le regard. Le sang-froid baisse à chaque tour : ne traîne pas.",
  "mec.carnet.titre": "Le carnet de terrain",
  "mec.carnet.texte": "Chaque tour tenu face à une bête remplit sa fiche. Six notes : fiche complète. Le carnet se consulte depuis la carte. Une espèce « observée » compte dès la première note.",
  "mec.traces.titre": "Lire les traces",
  "mec.traces.texte": "Un lieu marqué d'empreintes révèle les repaires de la carte et l'espèce qui y vit. Entrer dans un repaire, c'est être sûr de la rencontrer, chez elle, plus agressive.",
  "mec.nuit.titre": "La nuit",
  "mec.nuit.texte": "La nuit, d'autres bêtes sortent et ton sang-froid fond plus vite. Lever la lanterne coûte une huile mais effraie beaucoup plus dans le noir. Sans huile, la nuit te pèse.",
  "mec.viande.titre": "Les prédateurs",
  "mec.viande.texte": "Un prédateur devient plus agressif si tu recules : il te prend pour une proie. Lancer de la viande fait tomber son agressivité d'un coup. Les charognards aussi se vendent pour un morceau.",
  "mec.lien.titre": "Le lien",
  "mec.lien.texte": "Faire céder la même espèce deux fois te permet de lui proposer le lien : elle marche alors avec toi (deux compagnons au plus). Chaque lignée a son talent, lu dans le carnet, et la posture « Appeler le compagnon » effraie presque tout.",
  "mec.pluie.titre": "La pluie",
  "mec.pluie.texte": "Sous la pluie, la lanterne effraie moitié moins et la tension monte plus vite. Les serpents, eux, sortent davantage.",
  "mec.blessure.titre": "Les blessures",
  "mec.blessure.texte": "Une charge peut te blesser : ton sang-froid maximal baisse de 20 à chaque blessure. Trois blessures, et la Compagnie te rapatrie. Au bivouac, une bande soigne une blessure.",
  "mec.charognards.titre": "Les charognards",
  "mec.charognards.texte": "Les charognards sortent la nuit. Ils ont peu de courage : un bruit, un coup au sol ou une lanterne suffisent souvent. Mais les arthropodes chargent sans prévenir si tu les laisses approcher.",
  "mec.froid.titre": "Le froid d'altitude",
  "mec.froid.texte": "Dans les pierriers et sur le glacier, chaque pas de nuit te coûte du sang-froid. Repère les bivouacs avant la tombée du jour.",
  "mec.meute.titre": "La meute",
  "mec.meute.texte": "Une bête grégaire peut venir en meute : son agressivité remonte à chaque tour et ses charges font plus mal. Fais-la fuir vite, ou cède-lui le terrain.",
  "mec.neige.titre": "La neige",
  "mec.neige.texte": "La neige cache les traces et le brouillard du glacier réduit ce que tu vois. Avance prudemment : les lieux ne se révèlent qu'un à un.",
  "mec.ancien.titre": "Les anciennes",
  "mec.ancien.texte": "Les aberrations de la Faille n'ont pas peur du bruit, et la lanterne les gêne à peine. Leur tension use ton sang-froid plus vite. Tiens le regard, nourris-les, reste immobile : elles se lassent au bout de huit tours."
 },

  "tuto.etiquette": "Tutorial",
  "tuto.carte.titre": "Chart the map",
  "tuto.carte.texte": "Tap a circled place to go there. Each step moves the hour forward; at night, the beasts change.",
  "tuto.posture.titre": "Facing a beast, one stance per turn",
  "tuto.posture.texte": "Hold its gaze, back off, make noise, stay still… Each species reacts in its own way: watch, and remember.",
  "tuto.jauges.titre": "Three gauges",
  "tuto.jauges.texte": "Aggression at 72: it charges. Fear at 100: it flees. Low aggression and low fear: it yields. Your nerve at zero: you panic.",
  "tuto.suite": "Next",
  "tuto.partir": "Set off",
  "fiche.etiquette": "Field note",
  "fiche.compris": "Got it",
  "mec.postures.titre": "First encounter",
  "mec.postures.texte": "A skittish beast flees if you make noise, and yields if you stay still. A territorial beast wants to see you back off. A predator likes neither light nor your gaze. Nerve drops every turn: don't linger.",
  "mec.carnet.titre": "The field notebook",
  "mec.carnet.texte": "Every turn held against a beast fills its entry. Six notes: entry complete. The notebook opens from the map. A species counts as \"observed\" from the first note.",
  "mec.traces.titre": "Reading tracks",
  "mec.traces.texte": "A place marked with prints reveals the lairs on the map and the species living there. Entering a lair means meeting it for sure, at home, more aggressive.",
  "mec.nuit.titre": "The night",
  "mec.nuit.texte": "At night, other beasts come out and your nerve melts faster. Raising the lantern costs one oil but frightens much more in the dark. Without oil, the night weighs on you.",
  "mec.viande.titre": "Predators",
  "mec.viande.texte": "A predator gets more aggressive if you back off: it takes you for prey. Throwing meat drops its aggression at once. Scavengers can be bought for a piece too.",
  "mec.lien.titre": "The bond",
  "mec.lien.texte": "Making the same species yield twice lets you offer it the bond: it then walks with you (two companions at most). Each line has its talent, listed in the notebook, and the stance \"Call your companion\" frightens almost anything.",
  "mec.pluie.titre": "Rain",
  "mec.pluie.texte": "In the rain, the lantern frightens half as much and tension rises faster. Serpents, though, come out more.",
  "mec.blessure.titre": "Injuries",
  "mec.blessure.texte": "A charge can injure you: your maximum nerve drops by 20 with each injury. Three injuries, and the Company brings you home. At camp, a bandage treats one injury.",
  "mec.charognards.titre": "Scavengers",
  "mec.charognards.texte": "Scavengers come out at night. They have little courage: a noise, a stamp on the ground or a lantern is often enough. But arthropods charge without warning if you let them get close.",
  "mec.froid.titre": "Mountain cold",
  "mec.froid.texte": "On the screes and the glacier, every step at night costs you nerve. Spot the camps before nightfall.",
  "mec.meute.titre": "The pack",
  "mec.meute.texte": "A pack animal may come with its pack: its aggression climbs back every turn and its charges hurt more. Make it flee fast, or give up the ground.",
  "mec.neige.titre": "Snow",
  "mec.neige.texte": "Snow hides the tracks and the glacier fog narrows what you see. Advance carefully: places reveal themselves one at a time.",
  "mec.ancien.titre": "The ancients",
  "mec.ancien.texte": "The aberrations of the Rift are not afraid of noise, and the lantern barely bothers them. Their tension wears your nerve down faster. Hold their gaze, feed them, stay still: they lose interest after eight turns."

  "tuto.carte.titre": "Levanta el mapa",
  "tuto.carte.texte": "Toca un lugar rodeado por un círculo para ir. Cada paso hace avanzar la hora; de noche, las bestias cambian.",
  "tuto.posture.titre": "Frente a una bestia, una postura por turno",
  "tuto.posture.texte": "Sostener la mirada, retroceder, hacer ruido, quedarse inmóvil… Cada especie reacciona a su manera: observa y recuerda.",
  "tuto.jauges.titre": "Tres barras",
  "tuto.jauges.texte": "Agresividad a 72: carga. Miedo a 100: huye. Agresividad baja y miedo bajo: cede. Tu sangre fría a cero: entras en pánico.",
  "tuto.suite": "Siguiente",
  "tuto.partir": "Partir",
  "fiche.etiquette": "Nota de campo",
  "fiche.compris": "Entendido",
  "mec.postures.titre": "Primer encuentro",
  "mec.postures.texte": "Una bestia asustadiza huye si haces ruido y cede si te quedas inmóvil. Una bestia territorial quiere verte retroceder. A un depredador no le gustan ni la luz ni la mirada. La sangre fría baja en cada turno: no te entretengas.",
  "mec.carnet.titre": "El cuaderno de campo",
  "mec.carnet.texte": "Cada turno aguantado frente a una bestia llena su ficha. Seis notas: ficha completa. El cuaderno se consulta desde el mapa. Una especie cuenta como «observada» desde la primera nota.",
  "mec.traces.titre": "Leer las huellas",
  "mec.traces.texte": "Un lugar marcado con huellas revela las guaridas del mapa y la especie que vive allí. Entrar en una guarida es encontrarla seguro, en su casa, más agresiva.",
  "mec.nuit.titre": "La noche",
  "mec.nuit.texte": "De noche salen otras bestias y tu sangre fría se funde más rápido. Alzar el farol cuesta un aceite, pero asusta mucho más en la oscuridad. Sin aceite, la noche te pesa.",
  "mec.viande.titre": "Los depredadores",
  "mec.viande.texte": "Un depredador se vuelve más agresivo si retrocedes: te toma por una presa. Lanzar carne hace caer su agresividad de golpe. Los carroñeros también se venden por un trozo.",
  "mec.lien.titre": "El vínculo",
  "mec.lien.texte": "Hacer ceder dos veces a la misma especie te permite proponerle el vínculo: entonces camina contigo (dos compañeros como máximo). Cada linaje tiene su talento, se lee en el cuaderno, y la postura «Llamar al compañero» asusta a casi todo.",
  "mec.pluie.titre": "La lluvia",
  "mec.pluie.texte": "Bajo la lluvia, el farol asusta la mitad y la tensión sube más rápido. Las serpientes, en cambio, salen más.",
  "mec.blessure.titre": "Las heridas",
  "mec.blessure.texte": "Una carga puede herirte: tu sangre fría máxima baja 20 con cada herida. Tres heridas, y la Compañía te repatría. En el campamento, una venda cura una herida.",
  "mec.charognards.titre": "Los carroñeros",
  "mec.charognards.texte": "Los carroñeros salen de noche. Tienen poco valor: un ruido, un golpe en el suelo o un farol suelen bastar. Pero los artrópodos cargan sin avisar si los dejas acercarse.",
  "mec.froid.titre": "El frío de altura",
  "mec.froid.texte": "En los pedregales y en el glaciar, cada paso de noche te cuesta sangre fría. Localiza los campamentos antes de que caiga el día.",
  "mec.meute.titre": "La manada",
  "mec.meute.texte": "Una bestia gregaria puede venir en manada: su agresividad vuelve a subir en cada turno y sus cargas duelen más. Hazla huir rápido, o cédele el terreno.",
  "mec.neige.titre": "La nieve",
  "mec.neige.texte": "La nieve oculta las huellas y la niebla del glaciar reduce lo que ves. Avanza con cuidado: los lugares solo se revelan uno a uno.",
  "mec.ancien.titre": "Las antiguas",
  "mec.ancien.texte": "Las aberraciones de la Falla no temen al ruido, y el farol apenas las molesta. Su tensión desgasta tu sangre fría más rápido. Sostén la mirada, aliméntalas, quédate inmóvil: se cansan al cabo de ocho turnos."

  "mec.postures.titre": "Primeiro encontro",
  "mec.postures.texte": "Uma fera assustadiça foge se você faz barulho e cede se você fica imóvel. Uma fera territorial quer ver você recuar. Um predador não gosta nem da luz nem do olhar. O sangue-frio cai a cada turno: não demore.",

  "mec.carnet.texte": "Cada turno aguentado diante de uma fera preenche a ficha dela. Seis anotações: ficha completa. O caderno é consultado a partir do mapa. Uma espécie conta como \"observada\" desde a primeira anotação.",
  "mec.traces.titre": "Ler os rastros",
  "mec.traces.texte": "Um lugar marcado com pegadas revela os covis do mapa e a espécie que vive lá. Entrar em um covil é ter certeza de encontrá-la, na casa dela, mais agressiva.",

  "mec.viande.texte": "Um predador fica mais agressivo se você recua: ele toma você por uma presa. Jogar carne derruba a agressividade dele de uma vez. Os carniceiros também se vendem por um pedaço.",

  "mec.pluie.titre": "A chuva",
  "mec.pluie.texte": "Na chuva, o lampião assusta a metade e a tensão sobe mais rápido. As serpentes, por sua vez, saem mais.",

  "mec.blessure.texte": "Um ataque pode ferir você: seu sangue-frio máximo cai 20 a cada ferimento. Três ferimentos, e a Companhia traz você de volta. No acampamento, uma bandagem trata um ferimento.",
  "mec.charognards.titre": "Os carniceiros",
  "mec.charognards.texte": "Os carniceiros saem à noite. Têm pouca coragem: um barulho, uma batida no chão ou um lampião costumam bastar. Mas os artrópodes atacam sem avisar se você os deixa chegar perto.",
  "mec.froid.titre": "O frio da altitude",
  "mec.froid.texte": "Nos pedregais e na geleira, cada passo à noite custa sangue-frio. Localize os acampamentos antes de o dia acabar.",
  "mec.meute.titre": "A alcateia",
  "mec.meute.texte": "Uma fera gregária pode vir em alcateia: a agressividade dela volta a subir a cada turno e seus ataques doem mais. Faça-a fugir rápido, ou ceda o terreno.",

  "mec.ancien.titre": "As antigas",
  "mec.ancien.texte": "As aberrações da Fenda não têm medo de barulho, e o lampião mal as incomoda. A tensão delas desgasta seu sangue-frio mais rápido. Sustente o olhar, alimente-as, fique imóvel: elas se cansam depois de oito turnos."

<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {

  function pluriel(valeur, lang, variables) {

  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;

      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],

    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');

  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;

    prevenir();
  }

  function setLang(code) {

    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }

    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;

  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }

  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {

    var d = lireDonnees(jeu);

    if (ouverte) ouverte.fermer();

    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);

    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>

.carte-ui .etiquette{display:inline-block;font-size:.75em;letter-spacing:.14em;text-transform:uppercase;color:var(--braise2)}
.carte-ui .record{color:var(--braise2);font-weight:600}

#tuto .carte-ui{gap:10px}
.demo{width:100%;height:170px;border-radius:12px;background:#0b0e13;position:relative;overflow:hidden;border:1px solid var(--brume)}
.demo canvas{width:100%;height:100%;display:block}
.main{position:absolute;width:38px;height:38px;border-radius:50% 50% 50% 12px;background:radial-gradient(circle at 40% 35%,#f6dcc0,#cfa07c);box-shadow:0 4px 12px rgba(0,0,0,.6);transform:translate(-50%,-30%);pointer-events:none}
.main::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid rgba(242,176,92,.9);opacity:0;animation:onde 1.2s infinite}
@keyframes onde{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.points{display:flex;gap:6px;justify-content:center}
.points span{width:8px;height:8px;border-radius:50%;background:var(--brume)}

#toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,20px);background:rgba(42,33,24,.95);color:#f1e7cf;border:1px solid rgba(217,201,162,.5);border-radius:10px;padding:8px 14px;font-size:.9em;opacity:0;transition:opacity .25s,transform .25s;z-index:30;pointer-events:none;max-width:90%;text-align:center;font-family:Georgia,serif;font-style:italic}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>
<div id="app">

<!-- écran titre -->

      <button id="bt-niveaux-titre" class="btn" data-i18n="bt.expeditions"></button>

  <div id="liste-niveaux"></div>

  <div class="entete">
    <button id="bt-pause-carte" class="btn icone" data-i18n-aria="aria.pause" aria-label="">॥</button>

function ambiance(opts){const c=audioCtx();if(!c)return;try{

  const now=c.currentTime;SON.vent.gain.cancelScheduledValues(now);SON.vent.gain.linearRampToValueAtTime(opts.vent||0,now+1.2);SON.pluie.gain.cancelScheduledValues(now);SON.pluie.gain.linearRampToValueAtTime(opts.pluie||0,now+1.2)}catch(e){}}

<script>

const DPR=()=>Math.min(2,window.devicePixelRatio||1);

/* ---------- traits de pinceau : fourrure, écailles, plaques ---------- */
function fourrure(ctx,clip,r,couleur,densite,long,dir){ctx.save();ctx.clip(clip);ctx.lineCap='round';ctx.lineWidth=.006;

function taches(ctx,clip,r,couleur,n){ctx.save();ctx.clip(clip);ctx.fillStyle=rgba(couleur,.5);const b=clip.__bbox;for(let i=0;i<n;i++){const x=b.x+r()*b.w,y=b.y+r()*b.h,s=0.02+r()*0.035;ctx.beginPath();ctx.ellipse(x,y,s,s*.7,r()*3,0,7);ctx.fill()}ctx.restore()}

/* ---------- la bête ----------

  const c1=opts.silhouette?'#1a1612':e.c1,c2=opts.silhouette?'#1a1612':e.c2;const lx=opts.lx==null?-.9:opts.lx,ly=opts.ly==null?.9:opts.ly;

    const L={cerf:{lon:.95,hau:.32,jam:.6,epj:.07,cou:.5,tete:.23,garrot:.05,mus:1.15,hcou:.75},

    const {lon,hau,jam,epj,cou,tete,garrot,mus,hcou}=L;const accroupi=e.lignee==='felin'?agro/100*.1:0;const bosse=has('bosse')?.08:0;
    const y0=.12+accroupi;const yDos=y0-hau;const xf=-lon*.5,xr=lon*.5;const pas=Math.sin(T*1.1)*0.012;
    // pattes : hanche ou épaule, genou ou jarret, pied ; les pattes éloignées d'abord, plus sombres
    const jambe=(xh,yh,xk,yk,xp,yp,eh,ek,ep)=>{const p=new Path2D();p.moveTo(xh-eh,yh);p.quadraticCurveTo(xk-ek*1.2,(yh+yk)/2,xk-ek,yk);p.lineTo(xp-ep,yp);p.lineTo(xp+ep,yp+.012);p.lineTo(xk+ek,yk);p.quadraticCurveTo(xh+eh*1.15,(yh+yk)/2,xh+eh,yh);p.closePath();bboxPath(p,Math.min(xh,xk,xp)-eh,yh,Math.abs(xh-xp)+eh*2,yp-yh);return p};

    const pattes=[[lon*.33+.07,y0-hau*.25,lon*.44+.07,y0+hau*.2+jam*.5,lon*.37+.07+pas,yPied,epj*1.9,epj*.8,epj*.6,1],
                  [-lon*.38-.05,y0-hau*.35,-lon*.41-.05,y0+hau*.2+jam*.5,-lon*.43-.05-pas,yPied,epj*1.5,epj*.75,epj*.6,1],
                  [lon*.33,y0-hau*.25,lon*.44,y0+hau*.2+jam*.5,lon*.37-pas,yPied,epj*1.9,epj*.8,epj*.6,0],

    const loin=[];pattes.forEach(a=>{const p=jambe(...a.slice(0,9));if(a[9])loin.push(p);else parties.push(p)});
    // corps : garrot, dos, croupe, ventre, poitrail
    const b=new Path2D();b.moveTo(xf+.05,yDos-garrot-bosse);b.bezierCurveTo(xf+lon*.3,yDos-garrot*.5-bosse*1.4,lon*.1,yDos-.02,xr-.08,yDos-.03);
    b.bezierCurveTo(xr+.06,yDos+.02,xr+.08,y0-hau*.5,xr-.02,y0-hau*.15);b.bezierCurveTo(xr-.06,y0+hau*.18,lon*.15,y0+hau*.3+resp,0,y0+hau*.27+resp);
    b.bezierCurveTo(-lon*.25,y0+hau*.24+resp,xf+.02,y0+hau*.12,xf-.06,y0-hau*.3);b.bezierCurveTo(xf-.09,y0-hau*.65,xf-.02,yDos-garrot*.6,xf+.05,yDos-garrot-bosse);b.closePath();
    bboxPath(b,xf-.1,yDos-garrot-bosse-.05,lon+.2,hau*1.4+garrot);parties.push(b);

    const hx=xf-cou*.75,hy=yDos-cou*hcou+baisse;

    const h=new Path2D();h.moveTo(hx+tete*.35,hy-tete*.4);h.quadraticCurveTo(hx,hy-tete*.5,hx-tete*.15,hy-tete*.42);h.quadraticCurveTo(hx-tete*mus*.8,hy-tete*.3,hx-tete*mus,hy-tete*.02);

  if(sc.heure==='nuit'){const r=mulberry32(7);ctx.fillStyle='rgba(255,255,255,.6)';for(let i=0;i<60;i++){const x=r()*W,y=r()*H*.5;if(sc.meteo==='clair'||r()<.3){ctx.globalAlpha=.3+Math.sin(T*2+i)*.25;ctx.fillRect(x,y,1.2,1.2)}}ctx.globalAlpha=1}
  // montagnes lointaines en couches de brume
  const n=bruit('mont'+sc.zone);
  for(let L=0;L<4;L++){const base=H*(.42+L*.1);const amp=H*(.22-L*.04);ctx.fillStyle=rgba(shade(Z.loin,-L*.12-nuit*.3),.55+L*.14);ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=6){const y=base-fbm(n,x/W*(2.2+L)+L*9+T*.004*L,L*3.3)*amp;ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.closePath();ctx.fill()}
  // sol
  const gs=ctx.createLinearGradient(0,H*.72,0,H);gs.addColorStop(0,rgba(shade(Z.sol,-.2-nuit*.3),1));gs.addColorStop(1,shade(Z.sol,-.6));ctx.fillStyle=gs;ctx.fillRect(0,H*.72,W,H*.28);
  // végétation ou rochers au sol
  const r2=mulberry32(hashStr(sc.zone)+3);ctx.fillStyle=rgba('#000',.45);for(let i=0;i<40;i++){const x=r2()*W,y=H*.74+r2()*H*.22,s=4+r2()*10;
    if(Z.arbres==='roseau'||Z.arbres==='rond'){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.sin(T+i)*2,y-s*2.2);ctx.lineTo(x+1.5,y);ctx.fill()}else if(Z.arbres==='sapin'){ctx.beginPath();ctx.moveTo(x-s*.5,y);ctx.lineTo(x,y-s*2.5);ctx.lineTo(x+s*.5,y);ctx.fill()}else if(Z.arbres==='os'){ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+s*.4,y-s*1.4,x+s*.1,y-s*2);ctx.lineTo(x+2,y-s*2);ctx.quadraticCurveTo(x+s*.5,y-s*1.4,x+3,y);ctx.fill()}else{ctx.beginPath();ctx.ellipse(x,y,s,s*.5,0,0,7);ctx.fill()}}
  // la bête
  const e=sc.bete;if(e){const sc2=Math.min(W,H*.8)*(0.26+e.taille*0.055)*(e.forme==='serpent'?.9:1);const by=H*(e.forme==='oiseau'||e.forme==='chauve'?.5:.66);
    // ombre portée
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(W/2,H*.79,sc2*.9,sc2*.12,0,0,7);ctx.fill();
    ctx.save();ctx.translate(W/2,by);ctx.scale(sc2,sc2);
    const lx=(sc.lx||W*.5)/sc2-W/2/sc2,ly=(H*.95-by)/sc2;
    dessinerBete(ctx,e,{agro:sc.agro,peur:sc.peur,temps:T,lx,ly,souffle:Z.froid>0});ctx.restore()}
  // compagnon : silhouette au bord
  if(sc.compagnon){const c=ESPECES[sc.compagnon];const s=Math.min(W,H)*.14;ctx.save();ctx.translate(W*.14,H*.84);ctx.scale(-s,s);ctx.globalAlpha=.85;dessinerBete(ctx,c,{silhouette:false,lx:-.5,ly:.5,temps:T,agro:30});ctx.restore()}
  // pluie ou neige
  if(sc.meteo==='pluie'){ctx.strokeStyle='rgba(200,215,230,.25)';ctx.lineWidth=1;const r=mulberry32(11);for(let i=0;i<110;i++){const x=(r()*W+T*260)%W,y=(r()*H+T*900+i*7)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3,y+14);ctx.stroke()}}
  if(sc.meteo==='neige'){ctx.fillStyle='rgba(240,245,250,.7)';const r=mulberry32(13);for(let i=0;i<90;i++){const x=(r()*W+Math.sin(T+i)*20)%W,y=(r()*H+T*60+i*5)%H;ctx.beginPath();ctx.arc(x,y,1+r()*1.6,0,7);ctx.fill()}}
  // nappes de brume
  const nb=sc.meteo==='brume'?7:4;for(let i=0;i<nb;i++){const y=H*(.55+i*.07),x=((T*(8+i*4))%(W*1.5))-W*.25+i*90;const gg=ctx.createRadialGradient(x,y,0,x,y,W*.4);gg.addColorStop(0,`rgba(${sc.zone==='faille'?'120,90,100':'170,180,195'},${sc.meteo==='brume'?.16:.09})`);gg.addColorStop(1,'rgba(170,180,195,0)');ctx.fillStyle=gg;ctx.fillRect(0,0,W,H)}
  // lanterne du joueur : lueur chaude en bas, vacillante
  const vac=1+Math.sin(T*9)*.04+Math.sin(T*23)*.02;const lx=W*.5,ly=H*1.02;const gl=ctx.createRadialGradient(lx,ly,10,lx,ly,H*.75*vac*(sc.lanterne?1.25:1));gl.addColorStop(0,`rgba(255,190,110,${sc.lanterne?.55:.38})`);gl.addColorStop(.4,'rgba(255,150,70,.12)');gl.addColorStop(1,'rgba(255,150,70,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);
  // vignette sombre
  const gv=ctx.createRadialGradient(W/2,H*.5,H*.3,W/2,H*.5,H*.9);gv.addColorStop(0,'rgba(0,0,0,0)');gv.addColorStop(1,`rgba(0,0,0,${.55+nuit*.25})`);ctx.fillStyle=gv;ctx.fillRect(0,0,W,H);
}

/* ---------- écran titre : cordillère, lanterne et silhouette cornue ---------- */
function dessinerTitre(cv,T){const {w,h,d}=tailleCanvas(cv);const ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);
  dessinerScene(ctx,w,h,{zone:'contreforts',heure:'nuit',meteo:'brume',temps:T,bete:null});
  // silhouette du Roi-ramure au loin, dans la brume
  const e=ESPECES['roi-ramure'];const s=Math.min(w,h*.7)*.42;ctx.save();ctx.translate(w*.6,h*.5);ctx.scale(s,s);ctx.globalAlpha=.92;dessinerBete(ctx,e,{silhouette:true,oeil:true,temps:T,agro:40});ctx.restore();
  // lanterne tenue au premier plan, à gauche
  const lx=w*.17,ly=h*.78;const g=ctx.createRadialGradient(lx,ly,2,lx,ly,w*.5);g.addColorStop(0,'rgba(255,210,140,.55)');g.addColorStop(.3,'rgba(255,160,80,.12)');g.addColorStop(1,'rgba(255,160,80,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#0a0a0c';ctx.beginPath();ctx.roundRect?ctx.roundRect(lx-12,ly-22,24,36,4):ctx.rect(lx-12,ly-22,24,36);ctx.fill();ctx.fillStyle=`rgba(255,200,120,${.8+Math.sin(T*9)*.1})`;ctx.fillRect(lx-7,ly-16,14,24);ctx.fillStyle='#0a0a0c';ctx.fillRect(lx-2,ly-32,4,10);ctx.fillRect(lx-14,ly+14,28,5);
  // main et bras qui tiennent la lanterne
  ctx.fillStyle='#0a0a0c';ctx.beginPath();ctx.moveTo(lx-6,ly-34);ctx.quadraticCurveTo(lx-30,ly-10,lx-60,h);ctx.lineTo(lx+10,h);ctx.quadraticCurveTo(lx+8,ly,lx+6,ly-34);ctx.fill();
}

/* ---------- carte d'expédition sur parchemin ---------- */
const ICONES_LIEU={depart:'tente',bivouac:'tente',cache:'coffre',traces:'empreintes',repaire:'grotte',caravane:'chariot',but:'drapeau',point:'point',col:'col'};
function dessinerCarte(cv,M,etat){
  const {w,h,d}=tailleCanvas(cv);const ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);const Z=ZONES[M.zone];const T=etat.temps||0;
  // fond du parchemin : dessiné une fois par taille, gardé en mémoire
  const cle=w+'x'+h+'x'+d;if(M._fondCle!==cle){M._fond=fondCarte(M,w,h,d);M._fondCle=cle}ctx.drawImage(M._fond,0,0,w,h);
  dessinerCarteDynamique(ctx,w,h,M,etat,T,Z)}
function fondCarte(M,w,h,d){
  const cv=document.createElement('canvas');cv.width=Math.round(w*d);cv.height=Math.round(h*d);const ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);const Z=ZONES[M.zone];
  // papier
  ctx.fillStyle=Z.papier;ctx.fillRect(0,0,w,h);const np=bruit('papier');const img=12;
  for(let y=0;y<h;y+=img)for(let x=0;x<w;x+=img){const v=fbm(np,x/90,y/90);ctx.fillStyle=`rgba(90,60,20,${(v-.35)*.25})`;ctx.fillRect(x,y,img,img)}
  // taches et bord brûlé
  const gb=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.35,w/2,h/2,Math.max(w,h)*.75);gb.addColorStop(0,'rgba(60,40,10,0)');gb.addColorStop(1,'rgba(60,40,10,.45)');ctx.fillStyle=gb;ctx.fillRect(0,0,w,h);
  // courbes de niveau à l'encre
  const nr=bruit('relief'+M.seed);ctx.strokeStyle='rgba(70,50,25,.32)';ctx.lineWidth=.8;
  for(let lvl=.3;lvl<.8;lvl+=.07){ctx.beginPath();for(let y=0;y<h;y+=5){for(let x=0;x<w;x+=5){const v=fbm(nr,x/160,y/160);const v2=fbm(nr,(x+5)/160,y/160);if((v<lvl)!==(v2<lvl)){ctx.moveTo(x,y);ctx.lineTo(x+4,y+3)}}}ctx.stroke()}
  // hachures des pentes et symboles du terrain
  const rs=mulberry32(M.seed+9);ctx.strokeStyle='rgba(50,35,15,.55)';ctx.fillStyle='rgba(50,35,15,.55)';ctx.lineWidth=1;
  for(let i=0;i<110;i++){const x=rs()*w,y=rs()*h;const v=fbm(nr,x/160,y/160);
    if(v>.62){for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(x+k*4,y);ctx.lineTo(x+k*4+3,y+7);ctx.stroke()}}
    else if(Z.arbres==='sapin'&&v<.5){ctx.beginPath();ctx.moveTo(x-4,y+4);ctx.lineTo(x,y-6);ctx.lineTo(x+4,y+4);ctx.fill()}
    else if(Z.arbres==='rond'&&v<.48){ctx.beginPath();ctx.arc(x,y,3.5,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y+3);ctx.lineTo(x,y+7);ctx.stroke()}
    else if(Z.arbres==='roseau'&&v<.5){ctx.beginPath();ctx.moveTo(x-3,y+3);ctx.lineTo(x+3,y+3);ctx.moveTo(x-1,y+3);ctx.lineTo(x-2,y-5);ctx.moveTo(x+1,y+3);ctx.lineTo(x+2,y-6);ctx.stroke()}
    else if(Z.arbres==='glace'&&v<.5){ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x+5,y);ctx.moveTo(x-3,y+3);ctx.lineTo(x+3,y+3);ctx.stroke()}
    else if(Z.arbres==='roc'&&v<.5){ctx.beginPath();ctx.moveTo(x-4,y+3);ctx.lineTo(x-1,y-3);ctx.lineTo(x+2,y+1);ctx.lineTo(x+4,y+3);ctx.closePath();ctx.stroke()}
    else if(Z.arbres==='os'&&v<.5){ctx.beginPath();ctx.moveTo(x,y+4);ctx.lineTo(x,y-5);ctx.moveTo(x-3,y-5);ctx.lineTo(x+3,y-5);ctx.stroke()}}
  // rose des vents (sans lettres)
  ctx.save();ctx.translate(w-34,36);ctx.strokeStyle='rgba(42,33,24,.7)';ctx.fillStyle='rgba(42,33,24,.7)';ctx.lineWidth=1;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(4,0);ctx.lineTo(0,18);ctx.lineTo(-4,0);ctx.closePath();if(i%2)ctx.stroke();else ctx.fill();ctx.rotate(Math.PI/4)}ctx.restore();
  // bord du parchemin
  ctx.strokeStyle='rgba(42,33,24,.5)';ctx.lineWidth=3;ctx.strokeRect(6,6,w-12,h-12);
  return cv}
function dessinerCarteDynamique(ctx,w,h,M,etat,T,Z){
  const P=n=>[n.x*w,n.y*h];
  // chemins
  M.aretes.forEach(([a,b])=>{const A=M.lieux[a],B=M.lieux[b];const connu=(A.vu&&B.vu);if(!connu&&!(A.visite||B.visite))return;const [ax,ay]=P(A),[bx,by]=P(B);ctx.setLineDash([5,6]);ctx.lineWidth=1.6;ctx.strokeStyle=A.visite&&B.visite?'rgba(42,33,24,.85)':'rgba(42,33,24,.45)';ctx.beginPath();ctx.moveTo(ax,ay);const mx=(ax+bx)/2+Math.sin(a*3+b)*14,my=(ay+by)/2+Math.cos(a+b*2)*10;ctx.quadraticCurveTo(mx,my,bx,by);ctx.stroke();ctx.setLineDash([])});
  // lieux
  M.lieux.forEach((n,i)=>{const [x,y]=P(n);const courant=i===etat.courant;const atteignable=etat.atteignables.includes(i);
    if(!n.vu){ // terre inconnue : nuage de brume hachuré
      ctx.save();ctx.globalAlpha=.9;ctx.fillStyle=Z.papier;ctx.beginPath();ctx.ellipse(x,y,30,22,0,0,7);ctx.fill();ctx.strokeStyle='rgba(42,33,24,.25)';ctx.lineWidth=1;for(let k=-24;k<24;k+=6){ctx.beginPath();ctx.moveTo(x+k,y-14);ctx.lineTo(x+k+10,y+14);ctx.stroke()}ctx.restore();return}
    if(atteignable){const pulse=1+Math.sin(T*3)*.08;ctx.strokeStyle=rgba('#b8692a',.9);ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,17*pulse,0,7);ctx.stroke();if(i===etat.surligne){ctx.strokeStyle='#f2b05c';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,22,0,7);ctx.stroke()}}
    ctx.fillStyle=n.visite?'rgba(42,33,24,.9)':Z.papier;ctx.strokeStyle='rgba(42,33,24,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill();ctx.stroke();
    dessinerIconeLieu(ctx,x,y,n.visite||n.type==='depart'||n.type==='but'||n.type==='bivouac'?n.type:(n.devine?n.type:'point'),n.visite?Z.papier:'rgba(42,33,24,.95)');
    if(n.traces&&!n.visite){dessinerEmpreintes(ctx,x+16,y-14,'rgba(42,33,24,.7)')}
  });
  // le pisteur : petit personnage à la lanterne
  if(etat.courant!=null){const [x,y]=P(M.lieux[etat.courant]);const gl=ctx.createRadialGradient(x,y,4,x,y,44);gl.addColorStop(0,'rgba(255,190,110,.5)');gl.addColorStop(1,'rgba(255,190,110,0)');ctx.fillStyle=gl;ctx.fillRect(x-50,y-50,100,100);
    ctx.fillStyle='#2a2118';ctx.beginPath();ctx.arc(x,y-24,5,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x-6,y-18);ctx.lineTo(x+6,y-18);ctx.lineTo(x+4,y-4);ctx.lineTo(x-4,y-4);ctx.fill();ctx.fillStyle='#f2b05c';ctx.fillRect(x+7,y-16,4,6)}
}
function dessinerIconeLieu(ctx,x,y,type,coul){ctx.save();ctx.strokeStyle=coul;ctx.fillStyle=coul;ctx.lineWidth=1.6;ctx.lineCap='round';ctx.lineJoin='round';
  switch(ICONES_LIEU[type]||'point'){
    case 'tente':ctx.beginPath();ctx.moveTo(x-6,y+4);ctx.lineTo(x,y-6);ctx.lineTo(x+6,y+4);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.moveTo(x,y-6);ctx.lineTo(x,y+4);ctx.stroke();break;
    case 'coffre':ctx.strokeRect(x-5,y-3,10,7);ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x+5,y);ctx.stroke();break;
    case 'empreintes':dessinerEmpreintes(ctx,x-3,y,coul);break;
    case 'grotte':ctx.beginPath();ctx.arc(x,y+2,6,Math.PI,0);ctx.lineTo(x+6,y+5);ctx.lineTo(x-6,y+5);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.arc(x,y+3,2.5,Math.PI,0);ctx.fill();break;
    case 'chariot':ctx.strokeRect(x-6,y-4,12,6);ctx.beginPath();ctx.arc(x-3,y+4,2,0,7);ctx.arc(x+3,y+4,2,0,7);ctx.stroke();break;
    case 'drapeau':ctx.beginPath();ctx.moveTo(x-3,y+6);ctx.lineTo(x-3,y-6);ctx.lineTo(x+5,y-4);ctx.lineTo(x-3,y-1);ctx.stroke();break;
    case 'col':ctx.beginPath();ctx.moveTo(x-7,y+4);ctx.lineTo(x-3,y-4);ctx.lineTo(x,y+1);ctx.lineTo(x+3,y-5);ctx.lineTo(x+7,y+4);ctx.stroke();break;
    default:ctx.beginPath();ctx.arc(x,y,2.2,0,7);ctx.fill();
  }ctx.restore()}
function dessinerEmpreintes(ctx,x,y,coul){ctx.save();ctx.fillStyle=coul;for(let i=0;i<2;i++){const ox=x+i*7,oy=y-i*6;ctx.beginPath();ctx.ellipse(ox,oy,2.4,3,0,0,7);ctx.fill();for(let k=-1;k<=1;k++){ctx.beginPath();ctx.arc(ox+k*2.4,oy-4,1.1,0,7);ctx.fill()}}ctx.restore()}
</script>

<script>
'use strict';
/* =====================================================================
   LOGIQUE : partie, expéditions, carte, face-à-face, carnet, sauvegarde
   ===================================================================== */
const G={ecran:'titre',pause:false,temps:0,derniereImage:0,surligne:-1,tuto:null,fiche:null,boucleId:0};
let S=null;   // la partie : progression gardée par save.js
let X=null;   // l'expédition en cours (jamais sauvegardée : on la recommence)

function nouvelEtat(){return {v:1,etoiles:{},debloque:1,carnet:{},compagnons:[],mecs:{},fini:false}}
function etatDepuis(d){const e=d&&d.etat&&typeof d.etat==='object'?d.etat:null;const s=nouvelEtat();if(!e)return s;
  if(e.etoiles&&typeof e.etoiles==='object')s.etoiles=e.etoiles;s.debloque=clamp(parseInt(e.debloque,10)||1,1,NIVEAUX.length);
  if(e.carnet&&typeof e.carnet==='object')s.carnet=e.carnet;if(Array.isArray(e.compagnons))s.compagnons=e.compagnons.filter(id=>ESPECES[id]).slice(0,COMPAGNONS_MAX);
  if(e.mecs&&typeof e.mecs==='object')s.mecs=e.mecs;s.fini=!!e.fini;return s}
function totalEtoiles(){return Object.values(S?S.etoiles:{}).reduce((a,b)=>a+(+b||0),0)}
function fiche(id){if(!S)return {notes:0,lien:0,vu:0};return S.carnet[id]||(S.carnet[id]={notes:0,lien:0,vu:0})}
function sauver(niveau){if(!S)return;try{JEL_SAVE.save(JEU,{niveau:clamp(niveau,1,NIVEAUX.length),score:totalEtoiles(),options:{muet:SON.muet?1:0},etat:S})}catch(e){}}
function chargerS(){if(S)return;try{S=etatDepuis(JEL_SAVE.load(JEU))}catch(e){S=nouvelEtat()}}

/* ---------- écrans ---------- */
function montrer(id){document.querySelectorAll('section.ecran').forEach(el=>el.classList.toggle('actif',el.id==='ecran-'+id));G.ecran=id;window.scrollTo(0,0);
  if(id==='carte')redimCarte();if(id==='rencontre')redimScene()}
function superposer(id,on){const el=$(id);if(el)el.classList.toggle('actif',!!on)}
let toastTimer=null;function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),2600)}
function focusPremier(el){const b=el&&el.querySelector('button:not([hidden]):not([disabled])');if(b)try{b.focus({preventScroll:true})}catch(e){}}
function nomNiveau(n){return t('niv.'+n+'.nom')}
function texteObjectif(niv,progres){const o=niv.obj;switch(o.type){
  case 'atteindre':return t(o.final?'obj.final':'obj.atteindre');
  case 'relever':return t('obj.relever',{n:o.n})+(progres?' · '+t('obj.progres',{a:progres.a,b:o.n}):'');
  case 'pister':return t('obj.pister',{esp:t('esp.'+o.esp)});
  case 'lier':return t('obj.lier',{lignee:t('lignee.'+o.lignee)});
  case 'secourir':return t(progres&&progres.caravane?'obj.secourir2':'obj.secourir');
  case 'cartographier':return t('obj.cartographier',{n:Math.round(o.part*100)})+(progres?' · '+t('obj.progres',{a:progres.a,b:progres.b}):'');
  case 'tenir':return t('obj.tenir',{esp:t('esp.'+o.esp),n:TOURS_MAX});
  }return ''}

/* ---------- génération d'une expédition ---------- */
function genCarte(niv){const seed=hashStr('tm-'+niv.num);const r=mulberry32(seed);const N=niv.lieux;
  // couches du bas (départ) vers le haut (but) : 1 lieu aux extrémités, 1 à 3 entre les deux
  const milieu=Math.max(1,Math.ceil((N-2)/2.3));const couches=milieu+2;const parCouche=new Array(couches).fill(0);parCouche[0]=1;parCouche[couches-1]=1;
  let reste=N-2,idx=1;while(reste>0){if(parCouche[idx]<3){parCouche[idx]++;reste--}idx++;if(idx>=couches-1)idx=1}
  const lieux=[],aretes=[];const niveauxIdx=[];
  for(let k=0;k<couches;k++){const n=parCouche[k];const ids=[];for(let j=0;j<n;j++){const x=n===1?.5:.18+(j/(n-1))*.64;const y=.9-(k/(couches-1))*.8;
      lieux.push({x:clamp(x+(r()-.5)*.1,.1,.9),y:clamp(y+(r()-.5)*.05,.08,.94),type:'point',vu:false,visite:false,couche:k});ids.push(lieux.length-1)}niveauxIdx.push(ids)}
  for(let k=0;k<couches-1;k++){const A=niveauxIdx[k],B=niveauxIdx[k+1];const lie=new Set();
    A.forEach(a=>{const cibles=B.slice().sort((p,q)=>Math.abs(lieux[p].x-lieux[a].x)-Math.abs(lieux[q].x-lieux[a].x));const nb=1+(r()<.45&&cibles.length>1?1:0);for(let i=0;i<nb;i++){aretes.push([a,cibles[i]]);lie.add(cibles[i])}});
