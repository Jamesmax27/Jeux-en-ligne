  function toursRestants() {
    if (!vue) return 0;
    return Math.ceil((vue.tmax - vue.t) / PLACES);
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) return sel >= 0 ? tr('tour.marmite') : tr('tour.toi');
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.robot.' + s);
  }

  function majInfos() {
    let info = '';
    const reste = toursRestants();
    const cloche = vue ? ' · ' + tr('jeu.cloche', { n: reste }) : '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length }) + cloche;
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche }) + cloche;
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');

  function texteItem(it) {
    const W = O.POIDS;
    if (it.l) return tr('item.louche', { p: it.l });
    if (it.a.length === 2) {
      const a = W[it.a.charAt(0)], b = W[it.a.charAt(1)];
      return tr(it.x === 2 ? 'item.panierEpice' : 'item.panier', { a: a, b: b });
    }
    return tr(it.x === 2 ? 'item.epice' : 'item.simple', { p: W[it.a] });
  }
  function nomIngredients(it) {
    if (it.l) return tr('ing.l');
    return it.a.split('').map((ch) => tr('ing.' + ch)).join(' + ') + (it.x === 2 ? ' · ' + tr('ing.epice') : '');
  }

  function monTour() { return !!(partie && partie.monTour() && !attenteTuto && !enPause && vue); }

  // Marmites dans lesquelles le joueur peut verser.
  function mesPots() {
    if (!vue || !partie) return [];
    const moi = partie.siege;
    const l = [];
    vue.m.forEach((p, i) => { if (p.o === moi || p.o === -1) l.push(i); });
    return l;
  }

  // Reconstruit les boutons des marmites quand leur nombre change.
  function construireMarmites() {
    const part = $('partagees'), mes = $('mes');
    if (!vue || !partie) { part.textContent = ''; mes.textContent = ''; return; }
    const moi = partie.siege;
    const cle = vue.m.map((p) => (p.o === -1 ? 'p' : p.o === moi ? 'm' : 'x')).join('') + moi;
    if (part.dataset.cle === cle) return;
    part.dataset.cle = cle;
    part.textContent = ''; mes.textContent = '';
    vue.m.forEach((p, i) => {
      if (p.o !== -1 && p.o !== moi) return;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'marmite'; b.dataset.m = String(i);
      b.style.setProperty('--c', p.o === -1 ? PARTAGE : COUL[Math.max(0, moi)]);
      const cv = document.createElement('canvas'); cv.width = 300; cv.height = 168; cv.setAttribute('aria-hidden', 'true');
      const nom = document.createElement('span'); nom.className = 'nom';
      const poids = document.createElement('span'); poids.className = 'poids';

  function majMarmites() {
    construireMarmites();
    if (!vue) return;
    const it = sel >= 0 ? vue.et[sel] : null;

    document.querySelectorAll('.marmite').forEach((b) => {

      let ind = '';

      elInd.classList.toggle('commande', !!p.q);
      if (elInd.textContent !== ind) elInd.textContent = ind;
      const ok = jouable && it && O.versable(p, it);
      b.classList.toggle('cible', !!ok);
      b.classList.toggle('terne', !!(jouable && it && !O.versable(p, it)));

    });

  function majEtal() {
    const etal = $('etal');

    etal.classList.toggle('inactif', !jouable);
    etal.querySelectorAll('.ingredient').forEach((b) => {
      const i = +b.dataset.i;

      b.style.visibility = it ? 'visible' : 'hidden';

      if (b.dataset.cle !== cle) {

      }

      b.setAttribute('aria-pressed', i === sel ? 'true' : 'false');

  function majInterface() {

  // Dessins animés des marmites et de l'étal (bulles, vapeur, feu).
  function dessinerZone(t) {
    if (!vue) return;
    document.querySelectorAll('.marmite').forEach((b) => {
      const i = +b.dataset.m, p = vue.m[i];
      if (!p) return;
      const cv = b.querySelector('canvas'), c = cv.getContext('2d');
      dessinerMarmite(c, p, cv.width, cv.height, t, { coul: p.o === -1 ? PARTAGE : COUL[Math.max(0, partie ? partie.siege : 0)] });
    });
    document.querySelectorAll('#etal .ingredient').forEach((b) => {
      const it = vue.et[+b.dataset.i];
      if (!it) return;
      const cv = b.querySelector('canvas');
      if (it.x === 2 || b.dataset.dessin !== b.dataset.cle) { b.dataset.dessin = b.dataset.cle; dessinerItem(cv.getContext('2d'), it, cv.width, cv.height, t); }
    });

  // ---------------------------------------------------------------------
  //  Gestes : choisir un ingrédient, puis une marmite
  // ---------------------------------------------------------------------

  function attends() {
    if (Date.now() - dernierAttends > 1500 && partie && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
  }

  function choisirItem(i) {
    if (!vue || !partie) return;
    if (!monTour()) { attends(); return; }
    if (!vue.et[i]) return;
    sel = sel === i ? -1 : i;
    if (sel >= 0) sons.choix(); else sons.clic();
    majInterface();
    // au clavier, on passe tout de suite aux marmites
    if (sel >= 0 && clavierActif) {
      const premiere = document.querySelector('.marmite.cible');
      if (premiere) premiere.focus({ preventScroll: true });
    }
  }

  function choisirMarmite(m) {
    if (!vue || !partie) return;
    if (!monTour()) { attends(); return; }
    if (sel < 0) { toast(tr('tour.dabord'), 1600); sons.non(); return; }
    const p = vue.m[m];
    if (!p || !O.versable(p, vue.et[sel])) { toast(tr('tour.louchePas'), 1800); sons.non(); return; }
    jouerCoup({ i: sel, m: m });
  }

  function donnerAuxPoules() {
    if (!vue || !partie) return;
    if (!monTour()) { attends(); return; }
    if (sel < 0) { toast(tr('tour.dabord'), 1600); sons.non(); return; }
    jouerCoup({ i: sel, m: -1 });
  }

  function jouerCoup(a) {
    if (partie.jouer(a)) { sel = -1; majInterface(); }
  }

  // ---------------------------------------------------------------------
  //  Effets : ingrédient qui vole, textes qui s'envolent, particules
  // ---------------------------------------------------------------------

  const particules = [];
  function centre(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }

  function voler(it, depuis, vers, duree) {
    const cv = document.createElement('canvas'); cv.className = 'vole'; cv.width = 128; cv.height = 92;
    dessinerItem(cv.getContext('2d'), it, 128, 92, 0);
    document.body.appendChild(cv);
    const dx = vers[0] - depuis[0], dy = vers[1] - depuis[1];
    const a = cv.animate([
      { transform: 'translate(' + (depuis[0] - 32) + 'px,' + (depuis[1] - 23) + 'px) scale(1)' },
      { transform: 'translate(' + (depuis[0] - 32 + dx * 0.5) + 'px,' + (depuis[1] - 23 + dy * 0.5 - 70) + 'px) scale(1.15) rotate(20deg)' },
      { transform: 'translate(' + (vers[0] - 32) + 'px,' + (vers[1] - 23) + 'px) scale(.5) rotate(40deg)', opacity: 0.6 }
    ], { duration: duree, easing: 'ease-in' });
    a.onfinish = () => cv.remove();
    setTimeout(() => cv.remove(), duree + 200);
  }

  // genre : '' (réussite, vert), 'rouge' (débordement), 'neutre' (versé, poules)
  function flottant(texte, x, y, genre) {
    const d = document.createElement('div');
    d.className = 'flottant' + (genre ? ' ' + genre : '');
    x = Math.max(50, Math.min(window.innerWidth - 50, x));
    y = Math.max(70, y);
    d.textContent = texte;
    d.style.left = x + 'px'; d.style.top = y + 'px';
    document.body.appendChild(d);
    const a = d.animate([{ transform: 'translate(-50%,-50%) scale(.6)', opacity: 0 }, { transform: 'translate(-50%,-110%) scale(1.15)', opacity: 1, offset: 0.25 }, { transform: 'translate(-50%,-260%) scale(1)', opacity: 0 }], { duration: 1300, easing: 'ease-out' });
    a.onfinish = () => d.remove();
    setTimeout(() => d.remove(), 1500);
  }

  function gerbe(x, y, couleurs, n, etoile) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 200;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 180, vie: 0.7 + Math.random() * 0.5, k: 4 + Math.random() * 5, coul: couleurs[k % couleurs.length], etoile: etoile && k % 2 === 0 });
    }
    relancerBoucle();
  }

  function confettis() {
    const w = window.innerWidth;
    for (let i = 0; i < 90; i++) particules.push({ x: Math.random() * w, y: -20 - Math.random() * 200, vx: (Math.random() - 0.5) * 80, vy: 60 + Math.random() * 120, vie: 2.5 + Math.random(), k: 5 + Math.random() * 5, coul: COUL[i % 4], rect: true, rot: Math.random() * 6 });
    relancerBoucle();
  }

  function dessinerEffets(dt) {
    const cv = $('effets'), w = window.innerWidth, h = window.innerHeight;
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    const c = cv.getContext('2d');
    c.clearRect(0, 0, w, h);
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.rect ? 40 : 420) * dt;
      if (p.vie <= 0 || p.y > h + 40) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      if (p.rect) { p.rot += dt * 5; c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillRect(-p.k / 2, -p.k / 4, p.k, p.k / 2); c.restore(); }
      else if (p.etoile) etincelle(c, p.x, p.y, p.k, p.coul);
      else { rond(c, p.x, p.y, p.k * 0.6); c.fill(); }
      c.globalAlpha = 1;
    }
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerEffets(dt);
    if (ecran === 'jeu' && !enPause) {
      dessinerZone(performance.now());
      majTemps();
      majCompte();
    }
    if ((ecran === 'jeu' && !enPause) || particules.length) rafId = requestAnimationFrame(boucle);
    else tPrec = 0;
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    sel = -1;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44, info.moi ? prog.tenue : null);
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { cuisinier: tr('cuisinier.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { cuisinier: nomChef ? nomChef + ' · ' + tr('cuisinier.' + partie.chef) : tr('cuisinier.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    sel = -1;
    particules.length = 0;
    debutTour = Date.now();
    dernierTic = -1;
    nouveauxLivre = [];
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    $('partagees').dataset.cle = '';
  }

  // Un coup vient d'être joué (par toi, un robot ou un autre joueur) : on l'anime.
  function surAction(ev) {
    const avant = ev.avant, apres = ev.apres, a = ev.action;
    vue = JSON.parse(JSON.stringify(apres));
    debutTour = Date.now();
    dernierTic = -1;
    const it = avant.et[a.i], der = apres.der || {};
    const slot = document.querySelector('#etal .ingredient[data-i="' + a.i + '"]');
    const depart = slot ? centre(slot) : [window.innerWidth / 2, window.innerHeight * 0.8];
    // destination : une marmite affichée en grand, sinon la carte du cuisinier
    let cible = null;
    if (a.m >= 0) {
      cible = document.querySelector('.marmite[data-m="' + a.m + '"]');
      if (!cible || avant.m[a.m].o !== apres.m[a.m].o) cible = $('place-' + ev.siege);
      if (avant.m[a.m].o >= 0 && avant.m[a.m].o !== (partie ? partie.siege : -1)) cible = $('place-' + ev.siege);
    }
    const arrivee = cible ? centre(cible) : [24, window.innerHeight - 30];
    voler(it, depart, arrivee, 520);
    if (it.x === 2) sons.epice();
    if (it.l) sons.louche();
    const j = jeton;
    setTimeout(() => {
      if (j !== jeton) return;
      const x = arrivee[0], y = arrivee[1];
      if (der.r === 'poules') { sons.poules(); flottant(tr('effet.poules'), x + 30, y - 10, 'neutre'); return; }
      sons.plouf();
      if (cible && cible.classList.contains('marmite')) { cible.classList.remove('secoue', 'brille'); void cible.offsetWidth; }
      if (der.r === 'ok') {
        sons.reussi();
        if (der.p && avant.m[a.m].d) sons.doree();
        flottant(tr('effet.points', { n: der.p }), x, y);
        gerbe(x, y, ['#ffe066', '#ffffff', COUL[ev.siege], SAUCES[der.k % SAUCES.length]], 22, true);
        if (cible && cible.classList.contains('marmite')) { cible.classList.add('brille'); setTimeout(() => cible.classList.remove('brille'), 900); }
        const carte = $('place-' + ev.siege);
        carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
        if (ev.moi && der.k >= 0) {
          if (!prog.livre[der.k]) nouveauxLivre.push(der.k);
          prog.livre[der.k] += 1;
          if (session === 'ligne') sauverExtra();
        }
      } else if (der.r === 'plein' || der.r === 'refus') {
        if (der.r === 'plein') sons.deborde(); else sons.refus();
        flottant(tr(der.r === 'plein' ? 'effet.deborde' : 'effet.refus'), x, y, 'rouge');
        gerbe(x, y, [SAUCES[avant.m[a.m].k % SAUCES.length], '#ffffff'], 18, false);
        if (cible && cible.classList.contains('marmite')) cible.classList.add('secoue');
      } else {
        flottant(it.l ? tr('effet.moins', { n: it.l }) : tr('effet.plus', { n: O.poidsItem(it) }), x, y - 20, 'neutre');
      }
    }, 500);
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && R.aQui(vue) === partie.siege && !ev.moi && !R.fin(vue)) {
      setTimeout(() => { if (j === jeton) sons.tour(); }, 650);
    }
    if (apres.t === apres.tmax - PLACES) toast(tr('jeu.dernierTour'), 2000);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    $('partagees').dataset.cle = '';
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    sel = -1;
    setTimeout(() => { if (j === jeton) sons.cloche(); }, 550);
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1500);
  }

  function gagnant(e, moi) {
    if (moi < 0) return false;
    return e.sc[moi] === Math.max.apply(null, e.sc);
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = gagnant(e, moi);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de marché : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(e, moi, gagne, obj) {
    if (!gagne) return 0;
    if (e.rc[moi] < obj) return 1;
    return e.rv[moi] === 0 ? 3 : 2;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      if (e.sc[s] !== prec) { rang = k + 1; prec = e.sc[s]; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64; medaillon(cv.getContext('2d'), s, 32, 32, 30, s === moi ? prog.tenue : null);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('cuisinier.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.pointsCourt', { n: e.sc[s] });
      const sm = document.createElement('small'); sm.textContent = tr('fin.recettesCourt', { n: e.rc[s] });
      n.appendChild(sm);
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.sc[moi] : 0;
    const gagne = gagnant(e, moi);
    const egalite = gagne && e.sc.filter((x) => x === pts).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.points', { n: pts, r: e.rc[moi] }) : '';
    // cadeaux : recettes nouvelles du livre, toque ou tablier débloqué
    const cadeaux = [];
    nouveauxLivre.forEach((k) => cadeaux.push(tr('fin.nouvelleRecette', { recette: tr('recette.' + k) })));
    if (session === 'solo') {
      const i = niveau - 1, obj = NIVEAUX[i].obj;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(e, moi, gagne, obj);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      if (gagne) {
        const toquesAvant = toquesOuvertes(), tabliersAvant = tabliersOuverts();
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (toquesOuvertes() > toquesAvant) cadeaux.push(tr('fin.toque'));
        if (tabliersOuverts() > tabliersAvant) cadeaux.push(tr('fin.tablier'));
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (tous les marchés gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else {
        sauver(niveau, pts);
      }
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      let conseil = '';
      if (gagne && etoiles < 3) conseil = etoiles === 1 ? tr('fin.conseilObj', { n: obj }) : tr('fin.conseilPropre');
      if (!gagne) conseil = tr('fin.conseilPerdu');
      $('fin-record').textContent = (record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) })) + (conseil ? ' · ' + conseil : '');
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      sauverExtra();
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    $('fin-cadeaux').textContent = cadeaux.join(' · ');
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (partie en ligne repassée en solo).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux
  // ---------------------------------------------------------------------

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    sel = -1;
    bandeau('');
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon'].forEach(fermerVoile);
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    $('partagees').dataset.cle = '';
  }

  // Parcours solo : marché n contre 3 robots (force croissante, donnée par le marché).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    sel = -1;
    nouveauxLivre = [];
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = null;
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : salon, manches, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    nouveauxLivre = [];
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const grille = $('grille-niveaux');
    grille.textContent = '';
    NIVEAUX.forEach((_, i) => {
      const n = i + 1, ouvert = n <= prog.debloque;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
      b.append(num, et);
      b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
      else b.disabled = true;
      grille.appendChild(b);
    });
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
    const actuel = grille.querySelector('.actuel');
    if (actuel) try { actuel.focus({ preventScroll: false }); } catch (e) { /* rien */ }
  }

  // Vestiaire : toques et tabliers débloqués par les étoiles.
  function ouvrirVestiaire() {
    const total = totalEtoiles();
    $('vest-total').textContent = tr('etoiles.total', { n: total, max: NIVEAUX.length * 3 });
    const apercu = $('vest-apercu').getContext('2d');
    const dessinerApercu = () => {
      apercu.clearRect(0, 0, 300, 300);
      apercu.fillStyle = '#ffe9c4'; rond(apercu, 150, 160, 130); apercu.fill();
      cuisinier(apercu, 0, 150, 150, 90, prog.tenue, true);
    };
    dessinerApercu();
    [['toque', TOQUES, $('grille-toques')], ['tablier', TABLIERS, $('grille-tabliers')]].forEach(([genre, seuils, grille]) => {
      grille.textContent = '';
      seuils.forEach((seuil, v) => {
        const ouvert = total >= seuil;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tenue' + (ouvert ? '' : ' ferme') + (prog.tenue[genre] === v ? ' choisi' : '');
        const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128;
        const c = cv.getContext('2d');
        c.save(); c.translate(64, genre === 'toque' ? 108 : 6); c.scale(1.5, 1.5);
        if (genre === 'toque') dessinerToque(c, v, COUL[0], 0); else dessinerTablier(c, v, COUL[0]);
        c.restore();
        const nom = document.createElement('span'); nom.textContent = ouvert ? tr(genre + '.' + v) : tr('vestiaire.seuil', { n: seuil });
        b.append(cv, nom);
        b.setAttribute('aria-pressed', prog.tenue[genre] === v ? 'true' : 'false');
        b.setAttribute('aria-label', ouvert ? tr(genre + '.' + v) : tr('vestiaire.fermeAria', { nom: tr(genre + '.' + v), n: seuil }));
        b.addEventListener('click', () => {
          audio();
          if (!ouvert) { sons.non(); toast(tr('vestiaire.seuil', { n: seuil }), 1600); return; }
          sons.choix();
          prog.tenue[genre] = v;
          sauverExtra();
          grille.querySelectorAll('.tenue').forEach((x, j) => { x.classList.toggle('choisi', j === v); x.setAttribute('aria-pressed', j === v ? 'true' : 'false'); });
          dessinerApercu();
        });
        grille.appendChild(b);
      });
    });
    afficherEcran('vestiaire');
  }

  // Livre de recettes : chaque sorte de recette réussie au moins une fois.
  function ouvrirLivre() {
    const grille = $('grille-livre');
    grille.textContent = '';
    let faites = 0;
    prog.livre.forEach((n, k) => {
      const d = document.createElement('div');
      d.className = 'recette-livre' + (n ? ' faite' : ' cachee');
      const cv = document.createElement('canvas'); cv.width = 140; cv.height = 112;
      dessinerMarmite(cv.getContext('2d'), { c: 10, v: n ? 9 : 0, k: k, n: 0, q: 0, d: 0 }, 140, 112, 500, { coul: n ? '#3fae4a' : '#b8a27a' });
      const nom = document.createElement('span'); nom.textContent = n ? tr('recette.' + k) : tr('livre.inconnue');
      const compte = document.createElement('span'); compte.className = 'compte'; compte.textContent = n ? tr('livre.fois', { n: n }) : '';
      d.append(cv, nom, compte);
      grille.appendChild(d);
      if (n) faites++;
    });
    $('livre-total').textContent = tr('livre.total', { n: faites, max: prog.livre.length });
    afficherEcran('livre');
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
    majInterface();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés : une main touche l'ingrédient, puis la marmite
  // ---------------------------------------------------------------------

  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(47,111,224,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#3b2412'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const W = 560, H = 360;
    const nouveau = () => ({
      etal: d.etal.map((x) => Object.assign({ x: 1 }, x)),
      pots: d.pots.map((p) => ({ c: p.c, v: p.v, n: p.n || 0, q: p.q || 0, k: p.k || 0, d: p.d || 0, o: p.o === -1 ? -1 : 0 })),
      pris: [], res: d.pots.map(() => null)
    });
    let sc = nouveau(), debut = 0, fait = 0;
    const PAS = 2300, j = ++tutoAnim;
    const np = d.pots.length;
    const potRect = (m) => { const pw = Math.min(250, (W - 60) / np - 20); return { x: W / 2 + (m - (np - 1) / 2) * (pw + 24) - pw / 2, y: 18, w: pw, h: 150 }; };
    const slotRect = (i) => ({ x: W / 2 + (i - 1) * 150 - 64, y: 250, w: 128, h: 92 });
    const item = document.createElement('canvas'); item.width = 128; item.height = 92;
    const potCv = document.createElement('canvas'); potCv.width = 250; potCv.height = 130;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ecoule = t - debut;
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      if (k >= d.gestes.length + 1) { sc = nouveau(); fait = 0; debut = t; }
      else if (k >= fait && fait < d.gestes.length && dans >= 1500) {
        const g = d.gestes[fait], pot = sc.pots[g[1]], it = sc.etal[g[0]];
        sc.res[g[1]] = { r: O.verser(pot, it), t: t, avant: g[1] };
        if (sc.res[g[1]].r === 'ok') pot.v = pot.c;
        sc.pris.push(g[0]);
        fait++;
      }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, W, H);
      c.fillStyle = '#f6e2b8'; c.fillRect(0, 0, W, H);
      // marmites
      sc.pots.forEach((p, m) => {
        const r = potRect(m);
        c.fillStyle = p.d ? '#fff6c8' : '#fffaf0'; c.strokeStyle = p.o === -1 ? PARTAGE : COUL[0]; c.lineWidth = 4;
        rr(c, r.x, r.y, r.w, r.h + 44, 18); c.fill(); c.stroke();
        dessinerMarmite(potCv.getContext('2d'), p, 250, 130, t, { coul: p.o === -1 ? PARTAGE : COUL[0] });
        c.drawImage(potCv, r.x + (r.w - 250 * 0.9) / 2, r.y + 2, 250 * 0.9, 130 * 0.9);
        c.fillStyle = '#3b2412'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.font = '900 28px system-ui, sans-serif';
        c.fillText(tr('marmite.poids', { v: p.v, c: p.c }), r.x + r.w / 2, r.y + 140);
        c.font = '700 19px system-ui, sans-serif';
        let ind = '';
        if (p.q) ind = tr('marmite.commande', { n: p.n, q: p.q });
        else if (d.ind) ind = tr('marmite.manque', { n: p.c - p.v });
        if (ind) { c.fillStyle = p.q ? '#7a2fb0' : '#2b6a2f'; c.fillText(ind, r.x + r.w / 2, r.y + 172); }
        const res = sc.res[m];
        if (res && t - res.t < 1200) {
          const q = (t - res.t) / 1200;
          if (res.r === 'ok') for (let s = 0; s < 6; s++) etincelle(c, r.x + r.w / 2 + Math.cos(s) * 90 * q, r.y + 60 + Math.sin(s * 2) * 50 * q, 14 * (1 - q), '#ffd84d');
          else if (res.r === 'plein' || res.r === 'refus') { c.fillStyle = 'rgba(224,80,58,' + (0.5 * (1 - q)).toFixed(2) + ')'; rr(c, r.x, r.y, r.w, r.h + 44, 18); c.fill(); }
        }
        if (res && res.r === 'ok') etincelle(c, r.x + r.w - 20, r.y + 20, 12 + 3 * Math.sin(t / 150), '#f5c518');
      });
      // étal
      sc.etal.forEach((it, i) => {
        const r = slotRect(i);
        const pris = sc.pris.indexOf(i) >= 0;
        c.globalAlpha = pris ? 0.3 : 1;
        c.fillStyle = '#fffdf6'; c.strokeStyle = '#b8834a'; c.lineWidth = 3;
        rr(c, r.x, r.y, r.w, r.h, 14); c.fill(); c.stroke();
        dessinerItem(item.getContext('2d'), it, 128, 92, t);
        c.drawImage(item, r.x, r.y - 4, 128, 72);
        c.fillStyle = it.l ? '#1a5aa8' : it.x === 2 ? '#b3261e' : '#3b2412';
        c.font = '900 19px system-ui, sans-serif'; c.textAlign = 'center';
        c.fillText(texteItem(it), r.x + r.w / 2, r.y + r.h - 12);
        c.globalAlpha = 1;
      });
      // la main : vers l'ingrédient (sélection), puis vers la marmite
      if (fait < d.gestes.length && k === fait) {
        const g = d.gestes[fait];
        const s = slotRect(g[0]), p = potRect(g[1]);
        const sx = s.x + s.w / 2, sy = s.y + s.h / 2, px = p.x + p.w / 2, py = p.y + p.h / 2;
        let x, y, appui = 0;
        if (dans < 600) { const q = dans / 600; x = W - 30 + (sx - W + 30) * q; y = H + (sy - H) * q; }
        else if (dans < 900) { x = sx; y = sy; appui = (dans - 600) / 300; c.strokeStyle = '#2f6fe0'; c.lineWidth = 5; rr(c, s.x - 4, s.y - 4, s.w + 8, s.h + 8, 16); c.stroke(); }
        else if (dans < 1400) { const q = (dans - 900) / 500; x = sx + (px - sx) * q; y = sy + (py - sy) * q; c.strokeStyle = '#2f6fe0'; c.lineWidth = 5; rr(c, s.x - 4, s.y - 4, s.w + 8, s.h + 8, 16); c.stroke(); }
        else { x = px; y = py; appui = Math.min(1, (dans - 1400) / 100); }
        main(c, x, y, 1.5, appui);
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Clavier : 1, 2, 3 (ingrédient), flèches (déplacer), Entrée (valider),
  //  0 (donner aux poules), Échap (annuler le choix, ou pause), P (pause)
  // ---------------------------------------------------------------------

  let clavierActif = false;
  document.addEventListener('pointerdown', () => { clavierActif = false; }, true);

  function deplacerFocus(dx, dy) {
    const etal = Array.from(document.querySelectorAll('#etal .ingredient, #btn-poules'));
    const pots = Array.from(document.querySelectorAll('.marmite'));
    const actif = document.activeElement;
    let liste = sel >= 0 ? pots : etal;
    if (dy < 0 && etal.indexOf(actif) >= 0 && pots.length) liste = pots;
    else if (dy > 0 && pots.indexOf(actif) >= 0) liste = etal;
    const ici = liste.indexOf(actif);
    let suivant;
    if (ici < 0) suivant = liste[0];
    else suivant = liste[(ici + (dx || 0) + liste.length) % liste.length];
    if (suivant) { suivant.focus({ preventScroll: true }); sons.clic(); }
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    clavierActif = true;
    if (ev.code === 'KeyP' || (ev.code === 'Escape' && sel < 0)) {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    if (ev.code === 'Escape') { ev.preventDefault(); sel = -1; majInterface(); sons.clic(); return; }
    const chiffres = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 };
    if (chiffres[ev.code] !== undefined) { ev.preventDefault(); audio(); choisirItem(chiffres[ev.code]); return; }
    if (ev.code === 'Digit0' || ev.code === 'Numpad0') { ev.preventDefault(); audio(); donnerAuxPoules(); return; }
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) { ev.preventDefault(); audio(); deplacerFocus(dirs[ev.code][0], dirs[ev.code][1]); }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  document.querySelectorAll('#etal .ingredient').forEach((b) => b.addEventListener('click', () => { audio(); choisirItem(+b.dataset.i); }));
  $('btn-poules').addEventListener('click', () => { audio(); donnerAuxPoules(); });
  poule($('btn-poules').querySelector('canvas').getContext('2d'), 44, 42, 34);

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-vestiaire').addEventListener('click', () => { audio(); sons.clic(); ouvrirVestiaire(); });
  $('btn-livre').addEventListener('click', () => { audio(); sons.clic(); ouvrirLivre(); });
  ['niv-retour', 'vest-retour', 'livre-retour'].forEach((id) => $(id).addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); }));
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'titre') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
