        { texte: t('tuto.3.2'), cible: () => centre(Z.tuiles.carotte) },
      ],
      4: [
        { texte: t('tuto.4.0'), cible: () => ({ x: W / 2, y: Z.champ.y + Z.champ.h / 2 }), demo: (c, t) => dessinerEtoileDoree(c, W / 2, Z.champ.y + Z.champ.h / 2, 22, t) },
        { texte: t('tuto.4.1'), cible: null, main: false },
      ],
      5: [
        { texte: t('tuto.5.0'), cible: () => ({ x: W - 73, y: 43 }), r: 30, main: false },
        { texte: t('tuto.5.1'), cible: () => centre(Z.graines.radis) },
        { texte: t('tuto.5.2'), cible: null, main: false },
      ],
      6: [
        { texte: t('tuto.6.0'), cible: () => Z.oeufs[0], demo: (c) => dessinerProduit(c, 'oeuf', Z.oeufs[0].x, Z.oeufs[0].y, 30) },
        { texte: t('tuto.6.1'), cible: () => centre(Z.tuiles.oeuf), main: false },
      ],
      7: [
        { texte: t('tuto.7.0'), cible: () => ({ x: W * 0.3, y: Z.champ.y + Z.champ.h * 0.5 }), demo: (c, t) => dessinerLapin(c, W * 0.3, Z.champ.y + Z.champ.h * 0.5, 54 * Z.k, t, 1, true), main: false },
        { texte: t('tuto.7.1'), cible: () => ({ x: W * 0.3, y: Z.champ.y + Z.champ.h * 0.5 }), demo: (c, t) => dessinerLapin(c, W * 0.3, Z.champ.y + Z.champ.h * 0.5, 54 * Z.k, t, 1, false) },
      ],
      8: [
        { texte: t('tuto.8.0'), cible: () => centre(Z.graines.ble) },
        { texte: t('tuto.8.1'), cible: () => Z.vache },
        { texte: t('tuto.8.2'), cible: () => Z.lait, demo: (c) => dessinerProduit(c, 'lait', Z.lait.x, Z.lait.y, 34) },
      ],
      9: [
        { texte: t('tuto.9.0'), cible: null, main: false, demo: (c, t) => { partie.meteo = { type: 'pluie', t: 1 }; dessinerMeteo(c, t); partie.meteo = null; } },
        { texte: t('tuto.9.1'), cible: null, main: false, demo: (c, t) => { partie.meteo = { type: 'canicule', t: 1 }; dessinerMeteo(c, t); partie.meteo = null; } },
      ],
      10: [
        { texte: t('tuto.10.0'), cible: () => centre(Z.commande), main: false, demo: (c) => dessinerCommande(c, { items: { fraise: 2, ble: 1 }, prime: 47, t: 40, d: 40 }, Z.commande) },
        { texte: t('tuto.10.1'), cible: () => centre(Z.commande), demo: (c) => dessinerCommande(c, { items: { fraise: 2, ble: 1 }, prime: 47, t: 40, d: 40 }, Z.commande) },
      ],
    };
    if (M[n]) etapes.push(...M[n]);
  }
  return { n, conf, etapes, i: 0, t: 0 };
}

function etapeSuivante() {
  if (!tuto) return;
  jouerSon('clic');
  tuto.i++; tuto.t = 0;
  if (tuto.i >= tuto.etapes.length) {
    if (!sauvegarde.vus.includes(tuto.n)) { sauvegarde.vus.push(tuto.n); sauver(); }
    tuto = null;
    banniere(t('cestParti'), '#2e7d32');
  }
}

function dessinerTuto(c) {
  const e = tuto.etapes[tuto.i], t = tuto.t, traduire = window.JEL_I18N.t;   // ici, « t » = temps de l'étape
  if (e.carte) {
    c.fillStyle = 'rgba(30,40,15,.55)'; c.fillRect(0, 0, W, H);
    const conf = tuto.conf, w = Math.min(W - 32, 360), h = 250, x = (W - w) / 2, y = H * 0.42 - h / 2;
    const k = Math.min(1, t * 5), dy = (1 - k) * 40;
    c.globalAlpha = k;
    rr(c, x, y + dy, w, h, 22); c.fillStyle = '#fffaeb'; c.fill(); c.strokeStyle = '#f0a500'; c.lineWidth = 4; c.stroke();
    texte(c, traduire('niveauN', { n: tuto.n }), W / 2, y + dy + 30, 18, '#8d6235');
    texte(c, conf.titre, W / 2, y + dy + 62, 25, '#e8742a', 'center', 900);
    c.font = '600 16px system-ui, sans-serif';
    lignesDe(c, conf.nouveau, w - 36).slice(0, 3).forEach((l, i) => texte(c, l, W / 2, y + dy + 98 + i * 21, 16, '#4a3320', 'center', 600));
    const obj = traduire('objectifTuto', { obj: conf.obj, d: conf.duree });
    c.font = '800 16px system-ui, sans-serif';
    const ox = W / 2 - (c.measureText(obj).width + 26) / 2;
    dessinerPiece(c, ox + 10, y + dy + 172, 10);
    texte(c, obj, ox + 26, y + dy + 173, 16, '#4a3320', 'left', 800);
    for (let i = 0; i < 3; i++) {
      const ex = x + w / 2 - 110 + i * 80;
      cheminEtoile(c, ex, y + dy + 206, 10, 0.45); c.fillStyle = '#ffc107'; c.fill();
      texte(c, `${Math.round(conf.obj * SEUILS[i])}`, ex + 14, y + dy + 207, 15, '#8d6235', 'left');
    }
    texte(c, traduire('toucheCommencer'), W / 2, y + dy + h - 12, 13, '#a1887f', 'center', 600);
    c.globalAlpha = 1;
    return;
  }
  const cible = e.cible ? e.cible() : null, r = e.r || 62;
  c.fillStyle = 'rgba(20,30,10,.6)';
  c.beginPath(); c.rect(0, 0, W, H);
  if (cible) { c.moveTo(cible.x + r, cible.y); c.arc(cible.x, cible.y, r, 0, Math.PI * 2, true); }
  c.fill('evenodd');
  if (cible) { c.beginPath(); c.arc(cible.x, cible.y, r, 0, Math.PI * 2); c.strokeStyle = 'rgba(255,235,59,.9)'; c.lineWidth = 3; c.stroke(); }
  if (e.demo) e.demo(c, T);
  if (cible && e.main !== false) {
    const p = (t % 1.6) / 1.6;
    let hx = cible.x + 6, hy = cible.y + 8, k = 1;
    if (p < 0.45) { const q = p / 0.45, ee = 1 - (1 - q) * (1 - q); hx = lerp(cible.x + 70, cible.x + 6, ee); hy = lerp(cible.y + 90, cible.y + 8, ee); }
    else if (p < 0.7) {
      k = 0.88;
      c.beginPath(); c.arc(cible.x, cible.y, 10 + (p - 0.45) * 160, 0, Math.PI * 2);
      c.strokeStyle = `rgba(255,255,255,${1 - (p - 0.45) * 4})`; c.lineWidth = 4; c.stroke();
    }
    dessinerMain(c, hx, hy, k);
  }
  // Bulle de texte, du côté opposé à la cible
  const enHaut = !cible || cible.y > H * 0.5;
  c.font = '800 19px system-ui, sans-serif';
  const lignes = lignesDe(c, e.texte, W - 64), bh = 30 + lignes.length * 25 + 22, by = enHaut ? 74 : H - bh - 20;
  rr(c, 16, by, W - 32, bh, 18); c.fillStyle = '#fffaeb'; c.fill(); c.strokeStyle = '#f0a500'; c.lineWidth = 3; c.stroke();
  lignes.forEach((l, i) => texte(c, l, W / 2, by + 26 + i * 25, 19, '#4a3320'));
  const nb = tuto.etapes.length - 1;
  texte(c, traduire('toucheContinuer', { i: tuto.i, nb }), W / 2, by + bh - 16, 13, '#a1887f', 'center', 600);
}

// ---------- Entrées ----------
function toucher(x, y) {
  const P = partie, conf = P.conf;
  // Étoile dorée
  if (P.etoile && Math.hypot(x - P.etoile.x, y - P.etoile.y) < 44) {
    const e = P.etoile; P.etoile = null;
    jouerSon('magie');
    eclat(e.x, e.y, ['#ffd740', '#fff59d', '#ffffff'], 30, 'etoile', 260);
    P.parcelles.forEach((pc, i) => {
      if (pc.culture && !pc.fanee && pc.pousse < 1) {
        pc.pousse = Math.min(1, pc.pousse + 0.4); pc.soif = false; pc.soifT = 0; pc.pulse = 1;
        pc.seuils = pc.seuils.filter((s) => s > pc.pousse);
        const ct = centre(Z.parcelles[i]); eclat(ct.x, ct.y, ['#ffd740', '#ffffff'], 6, 'etoile', 100);
      }
    });
    banniere(t('magie'), '#f57f17');
    return;
  }
  // Lapins
  for (const l of P.lapins) {
    if (l.etat !== 'fuit' && Math.hypot(x - l.x, y - (l.y - 10)) < 46) {
      l.etat = 'fuit'; l.dir = l.x < W / 2 ? -1 : 1;
      jouerSon('boing'); eclat(l.x, l.y - 10, ['#ffffff', '#c9b79c'], 10, 'rond', 140);
      gagner(2, l.x, l.y - 30);
      return;
    }
  }
  // Animaux
  if (Z.animaux && dans(Z.animaux, x, y)) {
    for (let i = 0; i < 3; i++) {
      const o = Z.oeufs[i];
      if (P.oeufs[i] && Math.hypot(x - o.x, y - o.y) < o.r + 6) { ramasser('oeuf', o.x, o.y); P.oeufs[i] = null; return; }
    }
    if (P.laitPret && Math.hypot(x - Z.lait.x, y - Z.lait.y) < Z.lait.r + 8) { P.laitPret = false; P.vache.etat = 'faim'; ramasser('lait', Z.lait.x, Z.lait.y); return; }
    if (conf.vache && Math.hypot(x - Z.vache.x, y - Z.vache.y) < Z.vache.r + 6) { nourrirVache(); return; }
    if (Math.hypot(x - Z.poule.x, y - Z.poule.y) < 40) { P.poule.agite = 0.4; jouerSon('oeuf'); flottant(t('cotcot'), Z.poule.x, Z.poule.y - 40, '#5d4037', 16); return; }
    return;
  }
  // Parcelles
  for (let i = 0; i < Z.parcelles.length; i++) if (dans(Z.parcelles[i], x, y)) { actionParcelle(i); return; }
  // Graines
  for (const k of conf.cultures) {
    if (Z.graines[k] && dans(Z.graines[k], x, y)) { choisirGraine(k); return; }
  }
  // Commande
  if (Z.commande && dans(Z.commande, x, y)) { if (P.commande) livrerCommande(); return; }
  // Marché
  for (const k of P.produits) if (Z.tuiles[k] && dans(Z.tuiles[k], x, y)) { vendre(k); return; }
}

function choisirGraine(k) {
  partie.graine = k; jouerSon('clic');
  const b = Z.graines[k];
  eclat(b.x + b.w / 2, b.y + b.h / 2, ['#fff59d', '#ffd740'], 6, 'etoile', 70);
}
function ramasser(k, x, y) {
  jouerSon(k === 'oeuf' ? 'oeuf' : 'recolter');
  eclat(x, y, ['#fff59d', '#ffffff'], 10, 'etoile', 120);
  const tu = Z.tuiles[k], cible = centre(tu);
  vols.push({ type: k, x0: x, y0: y, x1: cible.x, y1: cible.y, t: 0, d: 0.55, fin: () => { partie.panier[k]++; partie.pulseTuile[k] = 1; } });
}
function nourrirVache() {
  const P = partie, v = P.vache;
  if (v.etat === 'faim') {
    if (P.panier.ble > 0) { P.panier.ble--; v.etat = 'mange'; v.t = 5; jouerSon('meuh'); eclat(Z.vache.x, Z.vache.y, ['#f2c14e', '#ffffff'], 10, 'rond', 100); }
    else { jouerSon('meuh'); banniere(t('vacheBle'), '#8d6235'); }
  } else if (v.etat === 'mange') { flottant(t('miam'), Z.vache.x, Z.vache.y - 50, '#5d4037', 16); }
  else { flottant(t('ramasseLait'), Z.vache.x - 40, Z.vache.y - 50, '#1565c0', 15); }
}

scene.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  if (tuto) { if (tuto.t > 0.25) etapeSuivante(); return; }
  if (etat !== 'jeu' || !partie || partie.fini) return;
  const r = scene.getBoundingClientRect();
  partie.clavier = false;
  toucher(e.clientX - r.left, e.clientY - r.top);
});
document.addEventListener('pointerdown', initAudio, true);

document.addEventListener('keydown', (e) => {
  initAudio();
  if (tuto) { e.preventDefault(); if (tuto.t > 0.25) etapeSuivante(); return; }
  if (etat === 'jeu' && partie && !partie.fini) {
    const P = partie, n = P.parcelles.length;
    const deplacer = (d) => { P.curseur = (P.curseur + d + n) % n; P.clavier = true; };
    switch (e.key) {
      case 'ArrowLeft': deplacer(-1); break;
      case 'ArrowRight': deplacer(1); break;
      case 'ArrowUp': deplacer(-Z.cols); break;
      case 'ArrowDown': deplacer(Z.cols); break;
      case ' ': case 'Enter': P.clavier = true; actionParcelle(P.curseur); break;
      case 'v': case 'V': if (P.conf.marche) toutVendre(); break;
      case 'c': case 'C': livrerCommande(); break;
      case 'Escape': case 'p': case 'P': mettreEnPause(); break;
      default: {
        const i = parseInt(e.key, 10) - 1;
        if (i >= 0 && i < P.conf.cultures.length) choisirGraine(P.conf.cultures[i]);
        else return;
      }
    }
    e.preventDefault();
    return;
  }
  // Sur les écrans : Entrée ou Espace = bouton principal
  if ((e.key === ' ' || e.key === 'Enter') && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) {
    const b = document.querySelector('.ecran:not(.cache) .principal');
    if (b && b.offsetParent) { e.preventDefault(); b.click(); }
  }
});

// ---------- Écrans ----------
const ECRANS = ['accueil', 'niveaux', 'pause', 'bilan'];
function montrerEcran(nom) {
  for (const n of ECRANS) $('#ecran-' + n).classList.toggle('cache', n !== nom);
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function totalEtoiles() { return sauvegarde.etoiles.reduce((a, b) => a + (b || 0), 0); }

function allerAccueil() {
  etat = 'accueil'; partie = null; tuto = null;
  miseEnPage();
  $('#b-pause').style.display = 'none';
  $('#acc-record').textContent = t('accRecord', { e: totalEtoiles(), max: NB_NIVEAUX * 3, n: sauvegarde.niveauMax, nb: NB_NIVEAUX });
  montrerEcran('accueil');
}
function allerNiveaux() {
  etat = 'niveaux';
  const g = $('#grille-niv'); g.textContent = '';
  for (let n = 1; n <= NB_NIVEAUX; n++) {
    const b = document.createElement('button'), e = sauvegarde.etoiles[n - 1] || 0;
    b.className = 'niv';
    b.disabled = n > sauvegarde.niveauMax;
    b.setAttribute('aria-label', t('niveauN', { n }));
    const num = document.createElement('b'); num.textContent = n;
    const et = document.createElement('span');
    et.textContent = '★'.repeat(e);
    const vides = document.createElement('i'); vides.textContent = '★'.repeat(3 - e); et.appendChild(vides);
    b.append(num, et);
    b.addEventListener('click', () => { jouerSon('clic'); lancerNiveau(n); });
    g.appendChild(b);
  }
  montrerEcran('niveaux');
}
function mettreEnPause() {
  if (etat !== 'jeu' || !partie || partie.fini || tuto) return;
  etat = 'pause';
  $('#pause-rappel').textContent = t('pauseRappel', { n: partie.n, txt: partie.conf.nouveau });
  montrerEcran('pause');
}

function afficherBilan(score, etoiles, battu, ancien) {
  const P = partie, n = P.n;
  etat = 'bilan';
  $('#b-pause').style.display = 'none';
  const fin = n === NB_NIVEAUX && etoiles > 0;
  $('#bil-titre').textContent = t(fin ? 'finJeu' : etoiles === 3 ? 'parfait' : etoiles > 0 ? 'bravo' : 'presque');
  $('#bil-detail').textContent = t('bilObj', { obj: P.conf.obj }) + (P.reste ? ' · ' + t('bilPanier', { r: P.reste }) : '') + ' · ' + t('bilRecoltes', { n: P.recolte });
  const rec = $('#bil-record');
  rec.className = 'record' + (battu && ancien > 0 ? ' battu' : '');
  rec.textContent = battu ? (ancien > 0 ? t('nouveauRecord', { a: ancien }) : t('premierRecord')) : t('recordPieces', { n: Math.max(ancien, score) });
  let info = '';
  if (fin) info = t('toutesEtoiles', { e: totalEtoiles(), max: NB_NIVEAUX * 3 });
  else if (etoiles > 0 && CONFS[n].parc > P.conf.parc) info = t('terrain', { n: CONFS[n].parc });
  else if (etoiles > 0) info = t('prochain', { titre: CONFS[n].titre });
  else info = t('uneEtoile') + ' ' + t(P.conf.marche ? 'astuceVends' : 'astuceReplante');
  $('#bil-terrain').textContent = info;
  const suivant = $('#b-suivant');
  suivant.style.display = etoiles > 0 && n < NB_NIVEAUX ? '' : 'none';
  suivant.classList.toggle('principal', etoiles > 0 && n < NB_NIVEAUX);
  $('#b-rejouer').classList.toggle('principal', !(etoiles > 0 && n < NB_NIVEAUX));
  const ets = document.querySelectorAll('#ecran-bilan .et');
  ets.forEach((el) => el.classList.remove('on'));
  montrerEcran('bilan');
  // Compteur qui défile, puis les étoiles une à une
  const debut = performance.now(), dureeAnim = 1000, champ = $('#bil-pieces');
  const anim = (m) => {
    const k = Math.min(1, (m - debut) / dureeAnim);
    champ.textContent = Math.round(score * (1 - (1 - k) * (1 - k)));
    if (k < 1 && etat === 'bilan') requestAnimationFrame(anim);
  };
  requestAnimationFrame(anim);
  for (let i = 0; i < etoiles; i++) setTimeout(() => { if (etat === 'bilan') { ets[i].classList.add('on'); jouerSon('etoile'); } }, 1000 + i * 380);
  setTimeout(() => {
    if (etat !== 'bilan') return;
    if (etoiles > 0) { jouerSon('victoire'); confettis(); } else jouerSon('echec');
  }, 1000 + etoiles * 380);
}

$('#b-jouer').addEventListener('click', () => { jouerSon('clic'); lancerNiveau(Math.min(sauvegarde.niveauMax, NB_NIVEAUX)); });
$('#b-niveaux').addEventListener('click', () => { jouerSon('clic'); allerNiveaux(); });
$('#b-retour').addEventListener('click', () => { jouerSon('clic'); allerAccueil(); });
$('#b-pause').addEventListener('click', () => { jouerSon('clic'); mettreEnPause(); });
$('#b-reprendre').addEventListener('click', () => { jouerSon('clic'); etat = 'jeu'; montrerEcran(null); });
$('#b-recommencer').addEventListener('click', () => { jouerSon('clic'); lancerNiveau(partie.n); });
$('#b-menu-pause').addEventListener('click', () => { jouerSon('clic'); allerAccueil(); });
$('#b-suivant').addEventListener('click', () => { jouerSon('clic'); lancerNiveau(Math.min(NB_NIVEAUX, partie.n + 1)); });
$('#b-rejouer').addEventListener('click', () => { jouerSon('clic'); lancerNiveau(partie.n); });
$('#b-menu').addEventListener('click', () => { jouerSon('clic'); allerAccueil(); });

function majBoutonSon() {
  $('#son-ondes').style.display = sauvegarde.muet ? 'none' : '';
  $('#son-coupe').style.display = sauvegarde.muet ? '' : 'none';
  $('#b-son').setAttribute('aria-label', t(sauvegarde.muet ? 'sonRemettre' : 'sonCouper'));
}
$('#b-son').addEventListener('click', () => {
  sauvegarde.muet = !sauvegarde.muet; sauver(); majBoutonSon();
  jouerSon('clic');
  $('#b-son').blur();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) mettreEnPause(); });

// ---------- Boucle principale ----------
let dernier = performance.now();
function boucle(m) {
  const dt = Math.min(0.05, Math.max(0, (m - dernier) / 1000)); dernier = m; T += dt;
  if (tuto) {
    tuto.t += dt;
    const e = tuto.etapes[tuto.i];
    if (tuto.t > (e.duree || 4.5)) etapeSuivante();
  } else if (etat === 'jeu' && partie && !partie.fini) majPartie(dt);
  majEffets(dt);
  cs.setTransform(DPR, 0, 0, DPR, 0, 0); cs.clearRect(0, 0, W, H);
  if (partie) dessinerPartie(cs, T); else dessinerDecor(cs, T);
  cf.setTransform(DPR, 0, 0, DPR, 0, 0); cf.clearRect(0, 0, W, H);
  dessinerEffets(cf);
  if (tuto) dessinerTuto(cf);
  requestAnimationFrame(boucle);
}

redimensionner();
majBoutonSon();
allerAccueil();
requestAnimationFrame(boucle);
</script>
