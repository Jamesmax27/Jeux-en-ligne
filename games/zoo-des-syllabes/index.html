  // Prépare la pancarte et l'animal du nom suivant.
  function preparerNom() {
    const item = etat.noms[etat.iNom];
    etat.nom = item;
    etat.fautesNom = 0;
    etat.mode = item.manege ? 'manege' : 'oiseaux';
    etat.depuisBonne = 0;
    etat.minuterie = .4;
    const a = item.animal;
    const animal = $('#animal');
    animal.className = '';
    animal.textContent = a.emoji;
    void animal.offsetWidth;
    animal.classList.add('arrive');
    if (item.ombre) animal.classList.add('ombre');
    // Cases : { s (attendue), mot, val (affichée), donnee, fausse }
    etat.cases = [];
    a.mots.forEach((m, im) => m.forEach((s) => etat.cases.push({ s, mot: im, val: null, donnee: false, fausse: false })));
    if (item.ombre) {
      // Une ou deux syllabes déjà posées, jamais toutes.
      const n = etat.cases.length;
      const nbDonnees = n >= 4 ? 2 : 1;
      const ordre = melanger(etat.cases.map((_, i) => i)).slice(0, nbDonnees);
      ordre.forEach((i) => { etat.cases[i].val = etat.cases[i].s; etat.cases[i].donnee = true; });
    }
    if (item.corriger) {
      etat.cases.forEach((c) => { c.val = c.s; c.donnee = true; });
      const i = hasard(etat.cases.length);
      const fausses = piegesDe(etat.cases[i].s, a.syll);
      etat.cases[i].val = fausses.length ? choisir(fausses) : choisir(RESERVE.filter((x) => !a.syll.includes(x)));
      etat.cases[i].fausse = true;
    }
    etat.phase = item.corriger ? 'corriger' : 'jeu';
    dessinerPancarte();
    viderCiel();
    if (item.corriger) {
      // Le ciel reste vide : une consigne y montre la pancarte.
      const c = document.createElement('div'); c.className = 'consigne-ciel';
      c.innerHTML = '<span class="grand" aria-hidden="true">👇</span>';
      c.appendChild(document.createTextNode(t('msg.corriger')));
      ciel.appendChild(c);
    } else {
      if (etat.mode === 'manege') creerManege();
      if (item.ombre) montrerMessage(t('msg.ombre'), '');
    }
    majProgres();
  }

  function indexProchaine() { return etat.cases.findIndex((c) => c.val === null); }
  function syllabeAttendue() { const i = indexProchaine(); return i < 0 ? null : etat.cases[i].s; }

  function dessinerPancarte() {
    const p = $('#pancarte');
    p.innerHTML = '';
    const prochaine = indexProchaine();
    const nbMots = etat.nom.animal.mots.length;
    let motCourant = -1, divMot = null;
    etat.cases.forEach((c, i) => {
      if (c.mot !== motCourant) { motCourant = c.mot; divMot = document.createElement('div'); divMot.className = 'mot'; p.appendChild(divMot); }
      let el;
      if (etat.phase === 'corriger') {
        el = document.createElement('button'); el.type = 'button';
        el.className = 'case fausse-cible donnee';
        el.addEventListener('pointerdown', (e) => { e.preventDefault(); toucherCase(i, el); });
        el.addEventListener('click', (e) => { if (e.detail === 0) toucherCase(i, el); });
      } else el = document.createElement('div');
      el.classList.add('case');
      el.dataset.i = i;
      if (c.val !== null) {
        el.textContent = c.val;
        el.classList.add(c.donnee ? 'donnee' : 'pleine');
      } else {
        if (etat.def.modele) { const m = document.createElement('span'); m.className = 'modele'; m.textContent = c.s; el.appendChild(m); }
        if (i === prochaine) el.classList.add('prochaine');
      }
      divMot.appendChild(el);
    });
    p.setAttribute('aria-label', t('jeu.pancarte', { n: nb(etat.cases.length) }));
    // Taille des cases : tout doit tenir sur la largeur.
    const largeur = ($('#enclos').clientWidth || 360) - 40;
    const parMot = etat.cases.length + (nbMots - 1) * 2;
    const taille = Math.max(44, Math.min(60, Math.floor(largeur / parMot) - 6));
    p.querySelectorAll('.case').forEach((c) => { c.style.minWidth = taille + 'px'; c.style.height = Math.max(46, Math.min(56, taille)) + 'px'; c.style.fontSize = (taille < 50 ? 18 : 22) + 'px'; });
  }

  // Syllabes pièges : elles ressemblent à s (lettre voisine, lettres inversées, son proche).
  const PAIRES = [['M', 'N'], ['P', 'B'], ['T', 'D'], ['F', 'V'], ['S', 'Z'], ['C', 'G'], ['U', 'O'], ['I', 'Y'], ['É', 'È']];
  const SONS = [['ON', 'OU'], ['AN', 'ON'], ['IN', 'UN'], ['CH', 'S'], ['QU', 'C'], ['PH', 'F'], ['EAU', 'O'], ['AU', 'O'], ['EU', 'OU'], ['GN', 'N']];
  function piegesDe(s, interdites) {
    const res = new Set();
    if (s.length === 2) res.add(s[1] + s[0]);
    for (let i = 0; i < s.length; i++) for (const [a, b] of PAIRES) {
      if (s[i] === a) res.add(s.slice(0, i) + b + s.slice(i + 1));
      else if (s[i] === b) res.add(s.slice(0, i) + a + s.slice(i + 1));
    }
    for (const [a, b] of SONS) { if (s.includes(a)) res.add(s.replace(a, b)); else if (s.includes(b) && b.length > 1) res.add(s.replace(b, a)); }
    if (s.length >= 4) res.add(s.slice(0, -1));
    return Array.from(res).filter((x) => x && x !== s && x.length <= 6 && !INTERDITS.has(x) && !(interdites || []).includes(x));
  }

  // Choisit le contenu d'une nouvelle bulle (simple ou changeante).
  function nouvelleBulle(forcerBonne) {
    const attendue = syllabeAttendue();
    const nom = etat.nom.animal.syll;
    const def = etat.def;
    const autresDuNom = etat.cases.filter((c) => c.val === null && c.s !== attendue).map((c) => c.s);
    let s, piege = false;
    const visibles = compterAttendue();
    if (!attendue) return { vals: [choisir(RESERVE.filter((x) => !nom.includes(x)))], k: 0, piege: false };
    if (forcerBonne || (visibles < 1 && etat.depuisBonne > 1.2)) s = attendue;
    else {
      const r = Math.random();
      if (r < 1 - def.intrus) {
        // Bulle « du nom » : la syllabe attendue, ou une autre syllabe du nom (piège de l'ordre).
        if (autresDuNom.length && (visibles >= 2 || Math.random() < .4)) s = choisir(autresDuNom);
        else if (visibles < 2) s = attendue;
      }
      else if (Math.random() < def.pieges) {
        const cible = Math.random() < .7 ? attendue : choisir(nom);
        const ps = piegesDe(cible, nom);
        if (ps.length) { s = choisir(ps); piege = true; }
      }
      if (!s) s = choisir(RESERVE.filter((x) => !nom.includes(x) && !INTERDITS.has(x)));
    }
    // Bulle changeante : alterne la syllabe choisie avec une autre qui lui ressemble.
    if (def.changeantes && Math.random() < def.changeantes) {
      let autre;
      if (s === attendue) { const ps = piegesDe(attendue, nom); autre = ps.length ? choisir(ps) : choisir(RESERVE.filter((x) => !nom.includes(x))); }
      else if (Math.random() < .5) autre = attendue;
      else autre = choisir(RESERVE.filter((x) => !nom.includes(x) && x !== s));
      return { vals: melanger([s, autre]), k: 0, piege, horloge: .9 + Math.random() * .5 };
    }
    return { vals: [s], k: 0, piege };
  }
  const valeur = (b) => b.vals[b.k];

  function compterAttendue() {
    const a = syllabeAttendue();
    let n = 0;
    etat.oiseaux.forEach((o) => { if (o.bulle && !o.bulle.pris && o.bulle.vals.includes(a)) n++; });
    if (etat.manege) etat.manege.places.forEach((p) => { if (p.bulle && !p.bulle.pris && p.bulle.vals.includes(a)) n++; });
    return n;
  }

  // Bouton d'une bulle (toucher au doigt, clic de souris, Entrée au clavier).
  function creerBoutonBulle(b) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'bulle' + (b.vals.length > 1 ? ' changeante' : '');
    el.style.setProperty('--c', choisir(COULEURS_BULLES));
    el.innerHTML = '<span></span>';
    el.firstChild.textContent = valeur(b);
    el.setAttribute('aria-label', t('jeu.bulle', { s: valeur(b) }));
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); toucherBulle(b); });
    el.addEventListener('click', (e) => { if (e.detail === 0) toucherBulle(b); });
    b.el = el;
    return el;
  }
  function changerBulle(b) {
    b.k = (b.k + 1) % b.vals.length;
    const sp = document.createElement('span'); sp.textContent = valeur(b);
    b.el.innerHTML = ''; b.el.appendChild(sp);
    b.el.setAttribute('aria-label', t('jeu.bulle', { s: valeur(b) }));
  }

  function oiseauSVG(c) {
    return '<svg class="oiseau-svg" viewBox="0 0 60 44" aria-hidden="true"><path d="M10 22 L0 15 L3 28 Z" fill="' + c[1] + '"/>'
      + '<ellipse cx="28" cy="25" rx="17" ry="13" fill="' + c[0] + '"/><circle cx="42" cy="17" r="10" fill="' + c[0] + '"/>'
      + '<ellipse cx="27" cy="30" rx="10" ry="6" fill="#fff" opacity=".45"/><path d="M51 15 L59 18.5 L51 22 Z" fill="#f7a531"/>'
      + '<circle cx="45" cy="15" r="2.8" fill="#222"/><circle cx="45.9" cy="14.1" r="1" fill="#fff"/>'
      + '<g class="aile"><path d="M16 21 Q25 2 37 19 Z" fill="' + c[1] + '"/></g></svg>';
  }

  // --- Oiseaux -------------------------------------------------------------
  function couloirs() {
    const n = etat.def.couloirs === 3 && etat.H >= 330 ? 3 : 2;
    const hOiseau = 120;
    const marge = 6;
    const libre = Math.max(0, etat.H - hOiseau - marge * 2);
    const ys = [];
    // Couloirs resserrés vers le milieu du ciel (2 : au tiers et aux deux tiers ; 3 : haut, milieu, bas).
    const parts = n === 3 ? [0, .5, 1] : [.22, .78];
    for (let i = 0; i < n; i++) ys.push(marge + libre * parts[i]);
    return ys;
  }
  function creerOiseau(couloir, forcerBonne) {
    const ys = couloirs();
    const sens = etat.def.sens === 2 ? (couloir % 2 === 0 ? 1 : -1) : 1;
    const b = nouvelleBulle(forcerBonne);
    const o = { couloir, sens, y: ys[couloir], v: etat.def.vitesse * etat.W * (1 + couloir * .1), bulle: b, phase: Math.random() * 6, fuite: false };
    const el = document.createElement('div');
    el.className = 'oiseau' + (sens < 0 ? ' gauche' : '');
    el.innerHTML = oiseauSVG(choisir(COULEURS_OISEAUX)) + '<div class="fil"></div>';
    el.appendChild(creerBoutonBulle(b));
    ciel.appendChild(el);
    o.el = el; o.w = el.offsetWidth || 70;
    o.x = sens > 0 ? -o.w / 2 - 10 : etat.W + o.w / 2 + 10;
    etat.oiseaux.push(o);
    placerOiseau(o);
    if (Math.random() < .3) jouer('piou');
  }
  function placerOiseau(o) {
    const bob = Math.sin(o.phase) * 6;
    o.el.style.transform = 'translate(' + (o.x - o.w / 2).toFixed(1) + 'px,' + (o.y + bob).toFixed(1) + 'px)';
  }
  // Apparitions : un couloir libre près de son bord d'entrée.
  function apparitions(dt) {
    const def = etat.def;
    etat.minuterie -= dt;
    const actifs = etat.oiseaux.filter((o) => !o.fuite).length;
    const besoin = compterAttendue() === 0 && etat.depuisBonne > 1.5;
    if ((etat.minuterie <= 0 && actifs < def.max) || (besoin && actifs < def.max + 1 && etat.minuterie <= def.intervalle * .5)) {
      const ys = couloirs();
      const libres = [];
      for (let c = 0; c < ys.length; c++) {
        const sens = def.sens === 2 ? (c % 2 === 0 ? 1 : -1) : 1;
        const bord = sens > 0 ? 0 : etat.W;
        const proche = etat.oiseaux.some((o) => o.couloir === c && !o.fuite && Math.abs(o.x - bord) < 130);
        if (!proche) libres.push(c);
      }
      if (libres.length) { creerOiseau(choisir(libres), besoin); etat.minuterie = def.intervalle * (.8 + Math.random() * .4); }
    }
  }
  function deplacerOiseaux(dt) {
    for (const o of etat.oiseaux) {
      o.phase += dt * 3;
      o.x += o.sens * o.v * (o.fuite ? 3.2 : 1) * dt;
      if (o.fuite) o.y -= 120 * dt;
      if (o.bulle && o.bulle.vals.length > 1 && !o.bulle.pris) {
        o.bulle.horloge -= dt;
        if (o.bulle.horloge <= 0) { o.bulle.horloge = 1.1; changerBulle(o.bulle); }
      }
      placerOiseau(o);
    }
    etat.oiseaux = etat.oiseaux.filter((o) => {
      const dehors = o.x < -o.w - 20 || o.x > etat.W + o.w + 20 || o.y < -160;
      if (dehors) retirerElement(o.el);
      return !dehors;
    });
  }
  function retirerElement(el) {
    if (!el) return;
    const focus = el.contains(document.activeElement);
    el.remove();
    if (focus) focusVoisin(0);
  }
  function viderCiel() {
    etat.oiseaux.forEach((o) => { o.fuite = true; if (o.bulle && o.bulle.el) o.bulle.el.classList.add('eclate'); o.bulle && (o.bulle.pris = true); });
    if (etat.manege) { etat.manege.el.remove(); etat.manege.places.forEach((p) => p.el && p.el.remove()); etat.manege = null; }
  }

  // --- Manège --------------------------------------------------------------
  function creerManege() {
    const n = etat.cases.length >= 4 ? 7 : 6;
    const m = { angle: 0, places: [], horloge: 2.5, el: document.createElement('div') };
    m.el.className = 'manege-deco';
    ciel.appendChild(m.el);
    for (let i = 0; i < n; i++) {
      const p = { a0: (i / n) * Math.PI * 2, bulle: null, el: null, attente: 0 };
      m.places.push(p);
    }
    etat.manege = m;
    dessinerManege();
    // Bulles : au moins une bonne au départ.
    m.places.forEach((p, i) => remplirPlace(p, i === 0));
  }
  function geometrieManege() {
    const cx = etat.W / 2, cy = etat.H * .56;
    const rx = Math.min(etat.W * .37, 190), ry = Math.min(etat.H * .26, rx * .55);
    return { cx, cy, rx, ry };
  }
  function dessinerManege() {
    const g = geometrieManege();
    const m = etat.manege;
    const haut = Math.max(10, g.cy - g.ry - 96);
    m.el.innerHTML = '<svg width="' + etat.W + '" height="' + etat.H + '" aria-hidden="true">'
      + '<ellipse cx="' + g.cx + '" cy="' + (g.cy + g.ry * .25) + '" rx="' + (g.rx + 30) + '" ry="' + (g.ry + 24) + '" fill="rgba(255,255,255,.35)" stroke="#fff" stroke-width="4"/>'
      + '<rect x="' + (g.cx - 5) + '" y="' + (haut + 40) + '" width="10" height="' + (g.cy - haut - 30) + '" fill="#d9a441"/>'
      + '<path d="M' + (g.cx - 70) + ' ' + (haut + 46) + ' L' + g.cx + ' ' + haut + ' L' + (g.cx + 70) + ' ' + (haut + 46) + ' Z" fill="#ff6b8b"/>'
      + '<path d="M' + (g.cx - 23) + ' ' + (haut + 46) + ' L' + g.cx + ' ' + haut + ' L' + (g.cx + 23) + ' ' + (haut + 46) + ' Z" fill="#fff"/>'
      + '<rect x="' + (g.cx - 74) + '" y="' + (haut + 44) + '" width="148" height="10" rx="5" fill="#ffd34d"/>'
      + '<circle cx="' + g.cx + '" cy="' + (haut - 4) + '" r="7" fill="#ffd34d"/></svg>';
  }
  function remplirPlace(p, forcerBonne) {
    if (p.el) p.el.remove();
    p.bulle = nouvelleBulle(forcerBonne);
    const conteneur = document.createElement('div');
    conteneur.className = 'manege-bulle';
    conteneur.appendChild(creerBoutonBulle(p.bulle));
    ciel.appendChild(conteneur);
    p.el = conteneur; p.w = conteneur.offsetWidth || 70;
    placerPlace(p, geometrieManege());
    conteneur.firstChild.animate([{ opacity: 0, transform: 'scale(.3)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 250 });
  }
  function placerPlace(p, g) {
    const a = p.a0 + etat.manege.angle;
    const prof = (Math.sin(a) + 1) / 2; // 0 au fond, 1 devant
    const x = g.cx + Math.cos(a) * g.rx;
    const y = g.cy + Math.sin(a) * g.ry;
    const ech = .82 + prof * .22;
    p.el.style.transform = 'translate(' + (x - p.w / 2).toFixed(1) + 'px,' + (y - 32).toFixed(1) + 'px) scale(' + ech.toFixed(3) + ')';
    p.el.style.zIndex = String(10 + Math.round(prof * 10));
  }
  // actif = faux pendant la danse ou une pancarte à corriger : le manège ne tourne pas.
  function majManege(dt, actif) {
    const m = etat.manege; if (!m) return;
    if (!actif) dt = 0;
    m.angle += etat.def.vManege * dt;
    const g = geometrieManege();
    // Une bonne bulle doit toujours tourner : sinon, la place la plus au fond la reçoit.
    m.horloge -= dt;
    const fond = m.places.reduce((best, p) => (Math.sin(p.a0 + m.angle) < Math.sin(best.a0 + m.angle) ? p : best), m.places[0]);
    if (actif && compterAttendue() === 0 && etat.depuisBonne > 1 && fond.attente <= 0) { remplirPlace(fond, true); etat.depuisBonne = 0; }
    else if (actif && m.horloge <= 0 && fond.attente <= 0 && fond.bulle && !fond.bulle.vals.includes(syllabeAttendue())) { remplirPlace(fond, false); m.horloge = 2.2; }
    m.places.forEach((p) => {
      if (actif && p.attente > 0) { p.attente -= dt; if (p.attente <= 0) remplirPlace(p, false); }
      if (!p.el) return;
      placerPlace(p, g);
      if (actif && p.bulle && p.bulle.vals.length > 1 && !p.bulle.pris) {
        p.bulle.horloge -= dt;
        if (p.bulle.horloge <= 0) { p.bulle.horloge = 1.1; changerBulle(p.bulle); }
      }
    });
  }

  // --- Brume ---------------------------------------------------------------
  function majBrume(dt) {
    if (!etat.def.brume) return;
    etat.prochaineBrume -= dt;
    if (etat.prochaineBrume <= 0) {
      etat.prochaineBrume = 3.5 + Math.random() * 2.5;
      const el = document.createElement('div'); el.className = 'brume';
      const sens = Math.random() < .5 ? 1 : -1;
      const b = { el, sens, x: sens > 0 ? -220 : etat.W + 20, y: Math.random() * Math.max(10, etat.H - 130), v: 40 + Math.random() * 30 };
      ciel.appendChild(el);
      etat.brumes.push(b);
    }
    etat.brumes.forEach((b) => { b.x += b.sens * b.v * dt; b.el.style.transform = 'translate(' + b.x.toFixed(1) + 'px,' + b.y.toFixed(1) + 'px)'; });
    etat.brumes = etat.brumes.filter((b) => { const d = b.x < -240 || b.x > etat.W + 40; if (d) b.el.remove(); return !d; });
  }

  // ------------------------------------------------------------------------
  // 6. Touchers, fautes, aide, fin de niveau
  // ------------------------------------------------------------------------
  function toucherBulle(b) {
    if (!etat.enCours || etat.enPause || b.pris) return;
    premierGeste = true;
    if (etat.phase === 'corriger') { montrerMessage(t('msg.corriger'), ''); jouer('toucher'); return; }
    if (etat.phase !== 'jeu') return;
    const s = valeur(b);
    const attendue = syllabeAttendue();
    if (s === attendue) bonneBulle(b);
    else {
      const type = b.piege || piegesDe(attendue, []).includes(s) ? 'piege'
        : etat.cases.some((c) => c.val === null && c.s === s) ? 'ordre' : 'intrus';
      b.el.classList.remove('secoue'); void b.el.offsetWidth; b.el.classList.add('secoue');
      faute(t('msg.' + type));
      // La bulle fautive éclate ; son oiseau s'envole.
      b.pris = true;
      setTimeout(() => { if (b.el) b.el.classList.add('eclate'); }, 250);
      liberer(b, .9);
    }
  }

  // Libère l'oiseau ou la place du manège qui portait cette bulle.
  function liberer(b, attente) {
    const o = etat.oiseaux.find((x) => x.bulle === b);
    if (o) { o.fuite = true; return; }
    if (etat.manege) {
      const p = etat.manege.places.find((x) => x.bulle === b);
      if (p) { p.attente = attente; setTimeout(() => { if (p.bulle === b && p.el) p.el.style.visibility = 'hidden'; }, 300); }
    }
  }

  function bonneBulle(b) {
    const i = indexProchaine();
    const c = etat.cases[i];
    b.pris = true;
    c.val = c.s;
    etat.score += 10;
    etat.depuisBonne = 0;
    jouer('bonne', i);
    const focusEtait = b.el && b.el.contains(document.activeElement);
    // La bulle file vers sa case.
    voler(b.el, '#pancarte .case[data-i="' + i + '"]', c.s);
    b.el.classList.add('vide');
    liberer(b, .6);
    if (focusEtait) setTimeout(() => focusVoisin(0), 30);
    dessinerPancarte();
    majScore();
    if (indexProchaine() < 0) nomReussi();
    else if (Math.random() < .35) montrerMessage(t('msg.bravo.' + hasard(4)), 'bon');
  }

  function voler(depuis, versSel, texte) {
    const vers = $(versSel);
    if (!depuis || !vers) return;
    const r1 = depuis.getBoundingClientRect(), r2 = vers.getBoundingClientRect();
    const v = document.createElement('div');
    v.className = 'bulle volante';
    v.style.cssText = 'left:' + r1.left + 'px;top:' + r1.top + 'px;width:' + r1.width + 'px;height:' + r1.height + 'px;--c:#fff';
    v.textContent = texte;
    document.body.appendChild(v);
    requestAnimationFrame(() => {
      v.style.transform = 'translate(' + (r2.left + r2.width / 2 - r1.left - r1.width / 2) + 'px,' + (r2.top + r2.height / 2 - r1.top - r1.height / 2) + 'px) scale(.8)';
      v.style.opacity = '.2';
    });
    setTimeout(() => v.remove(), 480);
  }

  function toucherCase(i, el) {
    if (!etat.enCours || etat.enPause || etat.phase !== 'corriger') return;
    premierGeste = true;
    const c = etat.cases[i];
    if (c.fausse) {
      jouer('decroche');
      el.classList.add('tombe');
      $$('#ciel .consigne-ciel').forEach((x) => x.remove());
      montrerMessage(t('msg.decroche'), 'bon');
      etat.phase = 'decroche';
      attendre(550, () => {
        c.val = null; c.donnee = false; c.fausse = false;
        etat.phase = 'jeu'; etat.depuisBonne = 2;
        dessinerPancarte();
        if (etat.mode === 'manege') creerManege();
      });
    } else {
      el.classList.remove('secoue'); void el.offsetWidth; el.classList.add('secoue');
      faute(t('msg.juste'));
    }
  }

  function faute(texte) {
    etat.erreurs++; etat.fautesNom++;
    etat.biscuits = Math.max(0, etat.biscuits - 1);
    jouer('faute');
    setTimeout(() => jouer('croque'), 180);
    const spans = $$('#biscuits span');
    const s = spans[etat.biscuits];
    if (s) s.classList.add('croque');
    $('#biscuits').setAttribute('aria-label', t('jeu.biscuits', { n: nb(etat.biscuits) }));
    const enclos = $('#enclos'); enclos.classList.remove('secousse'); void enclos.offsetWidth; enclos.classList.add('secousse');
    if (etat.biscuits <= 0) { etat.phase = 'fin'; montrerMessage(texte, 'mauvais'); attendre(900, defaite); return; }
    montrerMessage(etat.biscuits <= 2 ? texte + ' ' + t('msg.biscuits', { n: nb(etat.biscuits) }) : texte, 'mauvais');
  }

  function aide() {
    if (!etat.enCours || etat.enPause) return;
    premierGeste = true;
    if (etat.phase === 'corriger') {
      const i = etat.cases.findIndex((c) => c.fausse);
      const el = $('#pancarte .case[data-i="' + i + '"]');
      if (el) { el.classList.add('brille'); setTimeout(() => el.classList.remove('brille'), 3000); }
      etat.aides++; jouer('aide'); montrerMessage(t('msg.aide.case'), '');
      return;
    }
    if (etat.phase !== 'jeu') return;
    etat.aides++;
    jouer('aide');
    etat.aideJusqua = etat.temps + 3;
    etat.depuisBonne = 5;
    montrerMessage(t('msg.aide'), '');
  }
  function majAide() {
    const a = syllabeAttendue();
    const actif = etat.temps < etat.aideJusqua;
    const bulles = etat.oiseaux.map((o) => o.bulle).concat(etat.manege ? etat.manege.places.map((p) => p.bulle) : []);
    bulles.forEach((b) => { if (b && b.el) b.el.classList.toggle('brille', actif && !b.pris && valeur(b) === a); });
  }

  // Nom terminé : l'animal sort, danse et rejoint l'album.
  function nomReussi() {
    etat.phase = 'danse';
    etat.score += 30 + (etat.fautesNom === 0 ? 20 : 0);
    majScore();
    const a = etat.nom.animal;
    const animal = $('#animal');
    animal.classList.remove('ombre', 'arrive');
    jouer('nom');
    viderCiel();
    const nouveau = !prog.album.includes(a.id);
    if (nouveau) prog.album.push(a.id);
    if (!etat.gagnes.includes(a.emoji)) etat.gagnes.push(a.emoji);
    montrerMessage(nouveau ? t('msg.nouveau', { nom: a.nom }) : a.nom + ' !', 'bon');
    confettis(18);
    attendre(500, () => {
      jouer('danse');
      void animal.offsetWidth; animal.classList.add('danse');
      notes();
    });
    attendre(2500, () => {
      etat.iNom++;
      majProgres();
      if (etat.iNom >= etat.noms.length) victoire();
      else preparerNom();
    });
  }
  function notes() {
    const enclos = $('#enclos');
    ['♪', '♫', '♪', '♬'].forEach((n, i) => {
      setTimeout(() => {
        if (!etat.enCours) return;
        const s = document.createElement('span'); s.className = 'note-musique'; s.textContent = n;
        s.style.left = (30 + Math.random() * 40) + '%'; s.style.bottom = (40 + Math.random() * 40) + 'px';
        enclos.appendChild(s); setTimeout(() => s.remove(), 1300);
      }, i * 280);
    });
  }

  function etoilesDe(fautes) { return fautes === 0 ? 3 : fautes <= 2 ? 2 : 1; }

  function victoire() {
    etat.phase = 'fin';
    const i = etat.niveau;
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
    const fautes = etat.erreurs + etat.aides;
    const etoiles = etoilesDe(fautes);
    etat.score += etat.biscuits * 15;
    const avantEtoiles = totalEtoiles();
    const ancienRecord = prog.records[i];
    const record = etat.score > ancienRecord;
    if (record) prog.records[i] = etat.score;
    prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
    scorePartie += etat.score;
    prog.niveau = Math.max(prog.niveau, Math.min(NIVEAUX.length, i + 2));
    sauver(i + 2);
    etat.enCours = false;
    // Annonces : nouvelle allée, nouveaux décors.
    const annonces = [];
    if ((i + 1) % 4 === 0 && i + 1 < NIVEAUX.length && ancienRecord === 0) annonces.push(t('fin.allee', { allee: t(ALLEES[(i + 1) / 4].cle) }));
    DECORS.forEach((d) => { if (avantEtoiles < d.seuil && totalEtoiles() >= d.seuil) { annonces.push(t('fin.decor', { decor: t('decor.' + d.id) })); if (!reglages.decors.includes(d.id)) reglages.decors.push(d.id); } });
    if (annonces.length) enregistrerReglages();
    const dernier = i === NIVEAUX.length - 1;
    afficherFin({
      gagne: true, etoiles, score: etat.score, record, ancienRecord,
      texte: t('fin.fautes', { n: nb(fautes) }), annonces,
      principal: dernier ? t('fin.bilan') : t('fin.suivant'),
      action: dernier ? afficherBilan : () => lancerNiveau(i + 1)
    });
    jouer('victoire');
    confettis(36);
  }

  function defaite() {
    const i = etat.niveau;
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: i + 1 });
    etat.enCours = false;
    viderCiel();
    jouer('defaite');
    afficherFin({
      gagne: false, etoiles: 0, score: etat.score, record: false, ancienRecord: prog.records[i],
      texte: t('fin.defaite.texte'), annonces: [],
      principal: t('fin.reessayer'), action: () => lancerNiveau(i)
    });
  }

  function afficherFin(o) {
    const c = $('#calque-fin');
    $('#fin-titre').textContent = o.gagne ? t('fin.victoire') : t('fin.defaite');
    $('#fin-texte').textContent = o.texte;
    const etoiles = $$('#fin-etoiles span');
    etoiles.forEach((s) => s.classList.remove('on'));
    $('#fin-etoiles').setAttribute('aria-label', t('fin.etoiles', { n: nb(o.etoiles) }));
    etoiles.forEach((s, k) => { if (k < o.etoiles) setTimeout(() => { s.classList.add('on'); jouer('etoile', k); }, 450 + k * 380); });
    // Score qui défile.
    const sc = $('#fin-score');
    const debut = performance.now();
    const dure = 900;
    const anim = (now) => {
      const p = Math.min(1, (now - debut) / dure);
      sc.textContent = t('fin.score', { n: nb(Math.round(o.score * p)) });
      if (p < 1 && c.classList.contains('visible')) requestAnimationFrame(anim);
    };
    sc.textContent = t('fin.score', { n: nb(0) });
    requestAnimationFrame(anim);
    const rec = $('#fin-record');
    rec.className = 'record' + (o.record ? ' nouveau' : '');
    rec.textContent = o.record ? t('fin.record.nouveau') : t('fin.record', { n: nb(Math.max(o.ancienRecord, 0)) });
    $('#fin-gains').textContent = o.gagne ? etat.gagnes.join('') : '';
    const an = $('#fin-annonce');
    an.hidden = !o.annonces.length; an.textContent = o.annonces.join(' ');
    if (o.annonces.length) setTimeout(() => jouer('debloque'), 1600);
    const bp = $('#fin-principal');
    bp.textContent = o.principal;
    bp.onclick = () => { jouer('toucher'); c.classList.remove('visible'); o.action(); };
    // Victoire : « Rejouer » ce niveau ; défaite (« Réessayer » le rejoue déjà) : « Accueil ».
    const br = $('#fin-rejouer');
    br.textContent = o.gagne ? t('fin.rejouer') : t('pause.accueil');
    br.onclick = () => { jouer('toucher'); if (o.gagne) lancerNiveau(etat.niveau); else afficherTitre(); };
    c.classList.add('visible');
    setTimeout(() => { try { bp.focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 50);
  }

  let minuterieMessage = null;
  function montrerMessage(texte, genre) {
    const m = $('#message');
    m.textContent = texte;
    m.className = 'visible ' + (genre || '');
    clearTimeout(minuterieMessage);
    minuterieMessage = setTimeout(() => { m.className = ''; }, 2200);
  }

  function confettis(n) {
    const couleurs = ['#ff6b6b', '#ffd34d', '#6bd968', '#5ab7e8', '#a57ae8', '#ff9ff3'];
    const r = document.getElementById('app').getBoundingClientRect();
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div'); c.className = 'confetti';
      c.style.left = (r.left + Math.random() * r.width) + 'px';
      c.style.top = (r.top + Math.random() * r.height * .3) + 'px';
      c.style.background = choisir(couleurs);
      c.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
      c.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      c.style.animationDelay = (Math.random() * .3) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 1900);
    }
  }

  // ------------------------------------------------------------------------
  // 7. Tutoriels animés (démonstration du geste, se ferme d'un toucher)
  // ------------------------------------------------------------------------
  const bulle = (s, style, c) => '<div class="d d-bulle" style="' + (style || '') + (c ? ';--c:' + c : '') + '">' + s + '</div>';
  const cases = (liste, style) => '<div class="d d-pancarte" style="' + style + '">' + liste.map((x) => x === '|' ? '<span class="esp"></span>' : '<span class="d-case' + (x ? ' pleine' : '') + '">' + (x || '') + '</span>').join('') + '</div>';
  const main = (style) => '<div class="d d-main" style="' + style + ';animation:d-main 3s infinite">👆</div>';
  const bete = (e, style, ombre) => '<div class="d d-bete' + (ombre ? ' ombre' : '') + '" style="' + style + '">' + e + '</div>';
  const versCase = (s, depart, vx, vy) => bulle(s, depart + ';--vx:' + vx + 'px;--vy:' + vy + 'px;animation:d-vers-case 3s infinite');
  const DEMOS = {
    base: () => bete('🐷', 'left:18px;top:86px') + cases(['CO', ''], 'left:90px;top:96px') + versCase('CHON', 'left:150px;top:14px', -10, 84) + main('left:162px;top:40px'),
    intrus: () => bete('🐰', 'left:18px;top:86px') + cases(['LA', ''], 'left:90px;top:96px') + versCase('PIN', 'left:150px;top:14px', -10, 84) + bulle('TU', 'left:220px;top:20px', '#c9f2d0') + '<div class="d" style="left:236px;top:6px;font-size:22px;animation:d-croix 3s infinite">❌</div>' + main('left:162px;top:40px'),
    deuxSens: () => '<div class="d" style="top:10px;left:0;animation:d-droite 4s linear infinite">' + bulle('MOU', 'position:relative', '#cfe0ff') + '</div><div class="d" style="top:56px;left:0;animation:d-gauche 4.6s linear infinite">' + bulle('TON', 'position:relative', '#fff0a8') + '</div>' + bete('🐑', 'left:18px;top:96px'),
    sansModele: () => bete('🐮', 'left:22px;top:86px') + '<div class="d d-pancarte" style="left:100px;top:96px"><span class="d-case"><span style="opacity:.4;animation:d-pale 3s infinite">VA</span></span><span class="d-case"><span style="opacity:.4;animation:d-pale 3s infinite">CHE</span></span></div>' + bulle('VA', 'left:120px;top:16px') + bulle('CHE', 'left:190px;top:24px', '#c9f2d0'),
    pieges: () => bete('🦙', 'left:16px;top:86px') + cases(['LA', ''], 'left:90px;top:96px') + bulle('NA', 'left:116px;top:16px', '#c9f2d0') + versCase('MA', 'left:178px;top:16px', -48, 84) + '<div class="d" style="left:118px;top:52px;font-size:26px;animation:d-loupe 3s infinite">🔍</div>' + main('left:190px;top:42px'),
    trois: () => bete('🦒', 'left:12px;top:84px') + cases(['GI', 'RA', ''], 'left:76px;top:96px') + versCase('FE', 'left:190px;top:14px', -36, 84) + main('left:200px;top:40px'),
    changeantes: () => bete('🦓', 'left:18px;top:86px') + cases(['', 'BRE'], 'left:96px;top:96px') + '<div class="d" style="left:150px;top:14px"><div class="d d-bulle" style="position:relative;animation:d-alterne-a 1.5s infinite">ZÈ</div><div class="d d-bulle" style="top:0;left:0;animation:d-alterne-b 1.5s infinite;--c:#fff0a8">SÈ</div></div>' + main('left:160px;top:44px'),
    manege: () => '<div class="d" style="left:90px;top:6px;width:120px;height:120px;animation:d-rond 5s linear infinite">'
      + ['PHO', 'QUE', 'BO', 'FO'].map((s, i) => '<div class="d" style="left:' + [40, 80, 40, 0][i] + 'px;top:' + [0, 40, 80, 40][i] + 'px;animation:d-contre 5s linear infinite">' + bulle(s, 'position:relative', COULEURS_BULLES[i]) + '</div>').join('') + '</div>' + bete('🦭', 'left:14px;top:90px'),
    brume: () => bulle('DAU', 'left:70px;top:20px') + bulle('PHIN', 'left:170px;top:30px', '#c9f2d0') + '<div class="d" style="top:0;left:0;width:150px;height:90px;border-radius:50%;background:radial-gradient(ellipse,#fff 0 45%,rgba(255,255,255,0) 70%);animation:d-brume 3.2s linear infinite"></div>' + bete('🐬', 'left:14px;top:90px'),
    ombre: () => bete('🐼', 'left:20px;top:82px', true) + cases(['PAN', ''], 'left:96px;top:96px') + versCase('DA', 'left:170px;top:14px', -24, 84) + main('left:182px;top:40px'),
    quatre: () => bete('🐊', 'left:4px;top:86px') + cases(['CRO', 'CO', 'DI', ''], 'left:58px;top:98px') + versCase('LE', 'left:210px;top:12px', -10, 86) + main('left:220px;top:38px'),
    corriger: () => bete('🐬', 'left:20px;top:86px') + '<div class="d d-pancarte" style="left:100px;top:96px"><span class="d-case pleine">DAU</span><span class="d-case pleine" style="animation:d-tombe 3s infinite;color:#b33">FIN</span></div><div class="d d-main" style="left:150px;top:118px;animation:d-main 3s infinite">👆</div>' + bulle('PHIN', 'left:170px;top:16px;animation:d-pop 3s infinite', '#c9f2d0'),
    deuxMots: () => bete('🦝', 'left:6px;top:88px') + cases(['RA', 'TON', '|', 'LA', ''], 'left:62px;top:98px') + versCase('VEUR', 'left:200px;top:10px', 6, 88) + main('left:212px;top:38px'),
    presses: () => [0, 1, 2].map((k) => '<div class="d" style="top:' + (6 + k * 40) + 'px;left:0;animation:' + (k % 2 ? 'd-gauche' : 'd-droite') + ' ' + (1.8 + k * .3) + 's linear infinite">' + bulle(['LOUP', 'GRIS', 'BO'][k], 'position:relative', COULEURS_BULLES[k + 2]) + '</div>').join(''),
    cinq: () => bete('🦛', 'left:110px;top:6px') + cases(['HIP', 'PO', 'PO', 'TA', ''], 'left:22px;top:96px') + bulle('ME', 'left:226px;top:30px;animation:d-saut 1s infinite', '#c9f2d0')
  };
  let suiteTuto = null;
  function montrerTuto(type, suite) {
    etat.phase = 'tuto';
    suiteTuto = suite;
    $('#tuto-titre').textContent = t('tuto.' + type + '.titre');
    $('#tuto-texte').textContent = t('tuto.' + type + '.texte');
    $('#tuto-demo').innerHTML = DEMOS[type] ? DEMOS[type]() : '';
    $('#calque-tuto').classList.add('visible');
    setTimeout(() => { try { $('#tuto-ok').focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 50);
  }
  function fermerTuto() {
    if (!$('#calque-tuto').classList.contains('visible')) return;
    premierGeste = true;
    jouer('toucher');
    $('#calque-tuto').classList.remove('visible');
    const s = suiteTuto; suiteTuto = null;
    if (s) s();
  }

  // ------------------------------------------------------------------------
  // 8. Boucle, pause, clavier
  // ------------------------------------------------------------------------
  let dernier = 0;
  function boucle(ts) {
    const dt = Math.min(.05, Math.max(0, (ts - dernier) / 1000));
    dernier = ts;
    if (etat.enCours && !etat.enPause && ecranActif === 'ecran-jeu' && etat.phase !== 'tuto') {
      etat.temps += dt;
      // Attentes programmées (elles s'arrêtent pendant la pause).
      const prets = [];
      etat.attentes.forEach((a) => { a.reste -= dt; if (a.reste <= 0) prets.push(a); });
      if (prets.length) { etat.attentes = etat.attentes.filter((a) => !prets.includes(a)); prets.forEach((a) => a.f()); }
      if (etat.enCours) {
        etat.depuisBonne += dt;
        if (compterAttendue() > 0) etat.depuisBonne = 0;
        if (etat.phase === 'jeu' && etat.mode === 'oiseaux') apparitions(dt);
        deplacerOiseaux(dt);
        majManege(dt, etat.phase === 'jeu');
        if (etat.phase === 'jeu' || etat.phase === 'corriger') majBrume(dt);
        majAide();
      }
    }
    requestAnimationFrame(boucle);
  }

  function pause(oui) {
    if (!etat.enCours || ecranActif !== 'ecran-jeu') return;
    if ($('#calque-tuto').classList.contains('visible')) return;
    etat.enPause = oui;
    $('#calque-pause').classList.toggle('visible', oui);
    document.getElementById('app').classList.toggle('pause-anim', oui);
    if (ctx) { if (oui) ctx.suspend().catch(() => {}); else if (sonActif) ctx.resume().catch(() => {}); }
    if (oui) setTimeout(() => { try { $('#pause-reprendre').focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30);
  }

  // Clavier : flèches pour passer d'une bulle (ou d'une case) à l'autre, Entrée ou Espace pour la prendre.
  function cibles() {
    if (etat.phase === 'corriger') return $$('#pancarte button.case');
    const liste = $$('#ciel .bulle').filter((b) => !b.classList.contains('vide') && !b.classList.contains('eclate'));
    return liste.map((b) => ({ b, r: b.getBoundingClientRect() })).filter((x) => x.r.right > 0 && x.r.width > 0)
      .sort((a, c) => a.r.left - c.r.left).map((x) => x.b);
  }
  function focusVoisin(pas) {
    if (ecranActif !== 'ecran-jeu' || !etat.enCours) return;
    const l = cibles();
    if (!l.length) return;
    const i = l.indexOf(document.activeElement);
    const j = i < 0 ? 0 : (i + pas + l.length) % l.length;
    try { l[j].focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }

  document.addEventListener('keydown', (e) => {
    if (document.getElementById('jel-sauvegarde')) return; // fenêtre de reprise ouverte
    premierGeste = true;
    const code = e.code, cle = e.key;
    if ($('#calque-tuto').classList.contains('visible')) {
      if (cle === 'Enter' || cle === ' ' || cle === 'Escape') { e.preventDefault(); fermerTuto(); }
      return;
    }
    if (ecranActif === 'ecran-jeu' && etat.enCours) {
      if (cle === 'Escape' || code === 'KeyP') { e.preventDefault(); pause(!etat.enPause); return; }
      if (etat.enPause) return;
      if (code === 'KeyH') { e.preventDefault(); aide(); return; }
      if (cle === 'ArrowRight' || cle === 'ArrowDown') { e.preventDefault(); focusVoisin(1); return; }
      if (cle === 'ArrowLeft' || cle === 'ArrowUp') { e.preventDefault(); focusVoisin(-1); return; }
      if ((cle === 'Enter' || cle === ' ') && (!document.activeElement || document.activeElement === document.body)) { e.preventDefault(); focusVoisin(0); }
      return;
    }
    if (ecranActif === 'ecran-titre' && cle === 'Enter' && (!document.activeElement || document.activeElement === document.body)) { e.preventDefault(); $('#btn-jouer').click(); }
    if (cle === 'Escape' && ['ecran-plan', 'ecran-album', 'ecran-decors'].includes(ecranActif)) afficherTitre();
  });
  document.addEventListener('pointerdown', () => { premierGeste = true; }, { capture: true });
  document.addEventListener('visibilitychange', () => { if (document.hidden && etat.enCours && !etat.enPause) pause(true); });
  window.addEventListener('resize', () => {
    if (ecranActif !== 'ecran-jeu') return;
    mesurerCiel();
    const ys = couloirs();
    etat.oiseaux.forEach((o) => { if (!o.fuite) o.y = ys[Math.min(o.couloir, ys.length - 1)]; });
    if (etat.manege) dessinerManege();
    if (etat.nom) dessinerPancarte();
  });

  // Boutons
  $('#btn-jouer').addEventListener('click', () => {
    premierGeste = true; jouer('toucher');
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => {
        const n = Math.max(1, Math.min(NIVEAUX.length, d.niveau | 0 || 1));
        scorePartie = d.score | 0;
        prog.niveau = Math.max(prog.niveau, n);
        lancerNiveau(n - 1);
      },
      onNouvelle: () => {
        scorePartie = 0;
        if (debloques() <= 1 && !prog.etoiles[0]) lancerNiveau(0); else afficherPlan();
      },
      onEffacer: () => { viderProgression(); scorePartie = 0; afficherTitre(); }
    });
  });
  $('#btn-plan').addEventListener('click', () => { premierGeste = true; jouer('toucher'); afficherPlan(); });
  $('#btn-album').addEventListener('click', () => { premierGeste = true; jouer('toucher'); afficherAlbum(); });
  $('#btn-decors').addEventListener('click', () => { premierGeste = true; jouer('toucher'); afficherDecors(); });
  $$('.retour-accueil').forEach((b) => b.addEventListener('click', () => { jouer('toucher'); afficherTitre(); }));
  $$('.bouton-son').forEach((b) => b.addEventListener('click', () => { premierGeste = true; basculerSon(); }));
  $('#btn-pause').addEventListener('click', () => { jouer('toucher'); pause(true); });
  $('#btn-aide').addEventListener('click', aide);
  $('#pause-reprendre').addEventListener('click', () => { pause(false); jouer('toucher'); });
  $('#pause-recommencer').addEventListener('click', () => { const i = etat.niveau; pause(false); jouer('toucher'); lancerNiveau(i); });
  $('#pause-plan').addEventListener('click', () => { pause(false); jouer('toucher'); afficherPlan(); });
  $('#pause-accueil').addEventListener('click', () => { pause(false); jouer('toucher'); afficherTitre(); });
  $('#fin-plan').addEventListener('click', () => { jouer('toucher'); afficherPlan(); });
  $('#bilan-album-btn').addEventListener('click', () => { jouer('toucher'); afficherAlbum(); });
  $('#bilan-plan').addEventListener('click', () => { jouer('toucher'); afficherPlan(); });
  $('#bilan-accueil').addEventListener('click', () => { jouer('toucher'); afficherTitre(); });
  $('#tuto-ok').addEventListener('click', (e) => { e.stopPropagation(); fermerTuto(); });
  $('#calque-tuto').addEventListener('click', fermerTuto);

  // Fermeture de la page pendant une partie : on garde le niveau en cours.
  JEL_SAVE.surFermeture(() => {
    if (ecranActif === 'ecran-jeu' && (etat.enCours || etat.phase === 'tuto')) sauver(etat.niveau + 1);
  });

  // Démarrage
  chargerProgression();
  majBoutonsSon();
  $$('.oiseau-deco').forEach((d, i) => { d.innerHTML = oiseauSVG(COULEURS_OISEAUX[i]) + '<div class="fil"></div><div class="bulle-deco"></div>'; });
  boutonEffacer = JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('.titre-bas'), apres: () => { viderProgression(); } });
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
