<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>
  :root {

  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3dfbf; color: var(--brun);

  .bouton:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(74,44,23,.35); }
  .bouton.principal { background: linear-gradient(#f6b450, #e08a2c); color: #fff; border-color: #a95f1c; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .bouton.gros { font-size: 26px; padding: 14px 44px; border-radius: 24px; }
  .rond { width: 44px; height: 44px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    background: rgba(255, 250, 242, .92); box-shadow: var(--ombre); flex: none; }
  .rond svg { width: 26px; height: 26px; }

  /* ---------- Écran titre ---------- */
  #ecran-titre { flex-direction: column; background: linear-gradient(#bfe3f7, #f7e9cf 70%); }
  #dessin-titre { flex: 1 1 auto; min-height: 0; position: relative; background: linear-gradient(#9ed4f2, #e9f5f8); overflow: hidden; }

  /* ---------- Sélection des niveaux ---------- */

    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 22px; font-weight: 800; }

  @keyframes brise { 30% { transform: scale(1.5) rotate(-15deg); } 60% { transform: scale(.7) rotate(10deg); } }
  .compteur { display: flex; align-items: center; gap: 4px; font-weight: 800; font-size: 16px; }
  .compteur svg { width: 22px; height: 22px; }
  .compteur.saute { animation: saute .4s; }
  @keyframes saute { 40% { transform: scale(1.3); } }
  .aide { flex: none; min-height: 28px; padding: 4px 10px; text-align: center; font-size: 15px; font-weight: 700; background: #fff3dc; border-bottom: 2px solid #e9cfa5; line-height: 1.25; }

  /* Comptoir */
  .comptoir { flex: 1 1 auto; min-height: 120px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 6px 6px 0;
    background: linear-gradient(rgba(255, 246, 230, 0) 55%, rgba(233, 207, 165, .55)),

  .bulle { position: relative; background: #fff; border-radius: 16px; padding: 4px 6px; display: flex; gap: 2px; box-shadow: 0 2px 0 rgba(0,0,0,.12); margin-bottom: 6px; min-height: 44px; align-items: center; }

  .visage { width: clamp(60px, 25vw, 128px); height: auto; max-height: 62%; flex: 0 1 auto; min-height: 0; }
  .comptoir .decor { position: absolute; left: 0; right: 0; top: 0; height: 46%; pointer-events: none; }

  .place { z-index: 1; }
  .patience { width: 80%; height: 8px; border-radius: 4px; background: rgba(0,0,0,.15); overflow: hidden; margin: 3px 0 2px; flex: none; }
  .patience i { display: block; height: 100%; width: 100%; background: var(--vert); border-radius: 4px; }
  .place.arrive .client-corps { animation: arrive .5s ease-out; }

  .place.part-content .client-corps { animation: partContent .9s forwards; }

  @keyframes partFache { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 100% { transform: translateX(80px); opacity: 0; } }
  .client-corps { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 100%; height: 100%; }

  /* Panier */
  .panier-zone { flex: none; position: relative; height: 58px; display: flex; align-items: center; justify-content: center; background: #e7c48f; overflow: hidden; }

  /* Four */
  .four { flex: none; display: flex; justify-content: center; gap: 8px; padding: 8px 10px 10px; background:
    linear-gradient(#a9532f, #8d4024); border-top: 4px solid #6f2f18; border-bottom: 4px solid #6f2f18; position: relative;
    background-image: linear-gradient(rgba(0,0,0,.12) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,.12) 2px, transparent 2px);
    background-size: 36px 18px; background-color: #a24d2b; }

  .creneau { flex: 0 1 120px; min-width: 76px; height: clamp(74px, 11vh, 96px); border-radius: 50px 50px 10px 10px; background: radial-gradient(ellipse at 50% 100%, #ff9a3c 0%, #5a1d0c 60%, #2b0c05 100%);
    border: 4px solid #3b150a; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 4px 6px 6px; position: relative; }
  .creneau svg.pain { width: 72px; height: 46px; flex: none; }
  .creneau .cuisson { width: 100%; height: 9px; border-radius: 5px; background: rgba(255,255,255,.25); position: relative; overflow: hidden; flex: none; }
  .creneau .cuisson i { position: absolute; left: 0; top: 0; bottom: 0; background: #ffe08a; }
  .creneau .cuisson b { position: absolute; top: 0; bottom: 0; background: rgba(76, 175, 106, .75); }
  .creneau.cuit { animation: brille 1s infinite; }
  @keyframes brille { 50% { box-shadow: 0 0 14px 4px #ffd36a; } }
  .creneau.brule .fumee { position: absolute; top: -4px; left: 50%; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: rgba(90, 90, 90, .7); animation: fumee 1.4s infinite; }

  /* Plan de travail */

  .moulin { flex: 0 0 86px; border-radius: 16px; background: rgba(255,255,255,.4); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; }

  .fiche { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }

  .fiche-nom svg { width: 34px; height: 26px; flex: none; }

  .formes { flex: none; display: flex; gap: 5px; justify-content: center; padding: 2px 8px 4px; background: #d9ae72; flex-wrap: wrap; }
  .formes[hidden] { display: none; }
  .forme { width: 46px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.6); box-shadow: var(--ombre); }
  .forme svg { width: 100%; height: 100%; }
  .forme:disabled { opacity: .45; }
  .forme.choisie { background: #d8f2dd; outline: 3px solid var(--vert); }

  /* Étagère */
  .carnet { flex: none; display: flex; gap: 5px; justify-content: center; padding: 6px 8px 2px; background: #c8925a; }
  .recette { flex: 0 1 60px; min-width: 44px; height: 46px; border-radius: 12px; background: var(--farine); box-shadow: var(--ombre); padding: 2px; }
  .recette svg { width: 100%; height: 100%; }
  .recette.choisie { background: #ffe6a8; outline: 3px solid #e08a2c; }
  .etagere { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 5px 8px calc(8px + env(safe-area-inset-bottom)); background: #c8925a; }
  .ingredient { height: clamp(46px, 6.8vh, 60px); border-radius: 12px; background: #fff7ea; box-shadow: var(--ombre); position: relative; display: flex; align-items: center; justify-content: center; }
  .ingredient svg { height: 86%; width: auto; max-width: 90%; }

  .ingredient.plop svg { animation: saute .3s; }
  .secoue { animation: secoue .35s; }
  @keyframes secoue { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

  /* Messages volants */
  .toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); background: rgba(74, 44, 23, .92); color: #fff;
    padding: 8px 14px; border-radius: 14px; font-weight: 800; font-size: 16px; z-index: 30; pointer-events: none; max-width: 90%; text-align: center; animation: toast 1.8s forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 12% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -10px); } }
  .vole { position: absolute; z-index: 31; pointer-events: none; font-weight: 900; font-size: 22px; color: #c47b12; text-shadow: 0 2px 0 #fff;
    display: flex; align-items: center; gap: 3px; animation: vole 1.1s ease-out forwards; }
  .vole svg { width: 24px; height: 24px; }
  @keyframes vole { to { transform: translateY(-70px) scale(1.2); opacity: 0; } }
  .humeur-pop { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 34px; height: 34px; z-index: 5; animation: vole 1.2s forwards; }
  .confetti { position: absolute; top: -20px; width: 10px; height: 14px; z-index: 60; pointer-events: none; animation: tombe linear forwards; }
  @keyframes tombe { to { transform: translateY(110vh) rotate(720deg); } }

  /* Couches (pause, fin, tutoriel, annonce) */
  .couche { position: absolute; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(60, 34, 16, .55); padding: 16px; }

  .carte { background: var(--creme); border-radius: 26px; padding: 18px 18px 20px; width: min(92vw, 380px); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.3);
    display: flex; flex-direction: column; gap: 12px; align-items: center; border: 3px solid var(--bois); max-height: 94vh; overflow-y: auto; }
  .carte h2 { margin: 0; font-size: 26px; color: #8a3f12; }

  .grandes-etoiles svg.eteinte { animation: etoileEteinte .4s forwards; }
  @keyframes etoile { 60% { transform: scale(1.3) rotate(20deg); } 100% { transform: scale(1); } }
  @keyframes etoileEteinte { to { transform: scale(.85); } }
  .bilan { display: flex; flex-direction: column; gap: 4px; font-size: 17px; font-weight: 700; }
  .record { color: #c4441a; font-weight: 900; animation: saute .6s 2; }
  #couche-tuto { background: rgba(60, 34, 16, .35); cursor: pointer; align-items: flex-end; }
  #bulle-tuto { position: absolute; left: 50%; transform: translateX(-50%); width: min(92vw, 380px); background: #fff; border-radius: 20px; padding: 12px 14px; font-size: 18px; font-weight: 700;
    text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.3); border: 3px solid #e08a2c; z-index: 2; }
  #bulle-tuto small { display: block; margin-top: 6px; font-size: 14px; color: #8a6a4a; font-weight: 600; }
  #main-tuto { position: absolute; width: 64px; height: 64px; z-index: 3; pointer-events: none; transition: left .7s ease-in-out, top .7s ease-in-out; }
  #main-tuto svg { width: 100%; height: 100%; animation: tape 1s ease-in-out infinite; transform-origin: 30% 10%; }
  @keyframes tape { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-4px, -10px) scale(.92); } }
  #cercle-tuto { position: absolute; border: 4px solid #ffcf4a; border-radius: 20px; z-index: 1; pointer-events: none; box-shadow: 0 0 0 4000px rgba(60, 34, 16, .35); transition: all .6s ease-in-out; }
  #annonce { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 35; background: var(--creme); border: 3px solid var(--bois); border-radius: 22px;
    padding: 12px 22px; text-align: center; font-weight: 800; box-shadow: 0 8px 24px rgba(0,0,0,.3); pointer-events: none; display: none; }
  #annonce.actif { display: block; animation: toast 2.2s forwards; }
  #annonce b { display: block; font-size: 26px; color: #8a3f12; }
  @media (min-width: 700px) {
    #ecran-jeu { max-width: 520px; left: 50%; transform: translateX(-50%); box-shadow: 0 0 30px rgba(0,0,0,.25); }
  }
  @media (max-height: 680px) {
    .petrin { min-height: 80px; }
    .petrin .bol { width: 66px; height: 66px; }
    .moulin svg { width: 54px; height: 54px; }
    .creneau { height: 70px; }
    .creneau svg.pain { width: 60px; height: 38px; }
    .ingredient { height: 46px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }

<body>
<div id="app">

  <!-- Écran titre : le dessin sert aussi de jaquette -->
  <section id="ecran-titre" class="ecran actif">
    <div id="dessin-titre"></div>
    <div class="titre-texte">
      <h1 data-i18n="titre"></h1>
      <p class="consigne" data-i18n="consigne"></p>

      <div class="rangee">

        <button id="b-son-titre" class="rond" data-action="son"></button>

  <!-- Sélection des niveaux -->

      </div>
      <button id="b-son" class="rond" data-action="son"></button>
    </header>
    <div id="aide" class="aide" aria-live="polite"></div>
    <div id="comptoir" class="comptoir"></div>
    <div id="panier-zone" class="panier-zone">
      <div id="panier" class="panier"></div>
      <button id="chat" class="chat" data-action="chat" hidden></button>
    </div>
    <div id="four" class="four"></div>
    <div class="travail">
      <button id="moulin" class="moulin" data-action="moulin"></button>

          <button id="b-oeil" class="rond" data-action="oeil" data-i18n-aria="oeil" hidden></button>

  </section>

  <!-- Pause -->
  <div id="couche-pause" class="couche">
    <div class="carte">
      <h2 data-i18n="pauseTitre"></h2>
      <div class="boutons">
        <button class="bouton principal" data-action="reprendre" data-i18n="reprendre"></button>
        <button class="bouton" data-action="recommencer" data-i18n="recommencer"></button>
        <button class="bouton" data-action="accueil" data-i18n="accueil"></button>
      </div>
      <div class="rangee">
        <button class="rond" data-action="son" id="b-son-pause"></button>

      </div>
    </div>
  </div>

  <!-- Fin de niveau (victoire, défaite, bilan) -->

      <h2 id="fin-titre"></h2>

      <div class="bilan" id="fin-bilan"></div>

  <!-- Tutoriel animé -->

    <div id="bulle-tuto"></div>
  </div>
</div>

<script>
'use strict';
/* ======================================================================
   La boulangerie du quartier
   Des clients commandent des pains ; le joueur met les ingrédients dans le
   pétrin, pétrit, façonne, enfourne, sort le pain doré et sert le client
   avant qu'il perde patience. 24 niveaux, 3 cœurs par niveau.
   Tous les textes passent par tr() (module commun JEL_I18N).
   ====================================================================== */
(function () {
  var I18N = window.JEL_I18N;
  function tr(cle, vars) { return I18N ? I18N.t(cle, vars) : cle; }
  function nombre(n) { return I18N && I18N.nombre ? I18N.nombre(n) : String(n); }
  var JEU = 'boulangerie-du-quartier';

  // ---------------------------------------------------------------------
  // 1. Données du jeu
  // ---------------------------------------------------------------------

  // Ingrédients de l'étagère (ordre fixe : l'enfant les retrouve au même endroit).
  var INGREDIENTS = ['farine', 'eau', 'sel', 'levure', 'beurre', 'sucre', 'oeuf', 'lait', 'chocolat', 'raisins'];
  var FORMES = ['long', 'boule', 'lune', 'tresse', 'carre', 'spirale', 'couronne'];

  // Recettes : ingrédients, forme, temps de cuisson (s) et prix (pièces).
  var RECETTES = {
    baguette:  { ingr: ['farine', 'eau', 'sel'],              forme: 'long',     cuisson: 6, prix: 2 },
    boule:     { ingr: ['farine', 'eau', 'sel', 'levure'],    forme: 'boule',    cuisson: 8, prix: 3 },
    croissant: { ingr: ['farine', 'beurre', 'sucre'],         forme: 'lune',     cuisson: 5, prix: 2 },
    brioche:   { ingr: ['farine', 'oeuf', 'sucre', 'beurre'], forme: 'tresse',   cuisson: 7, prix: 4 },
    painchoc:  { ingr: ['farine', 'beurre', 'chocolat'],      forme: 'carre',    cuisson: 5, prix: 3 },
    escargot:  { ingr: ['farine', 'beurre', 'raisins', 'sucre'], forme: 'spirale', cuisson: 6, prix: 4 },
    couronne:  { ingr: ['farine', 'lait', 'sucre', 'oeuf'],   forme: 'couronne', cuisson: 9, prix: 5 }
  };
  var ORDRE_RECETTES = ['baguette', 'boule', 'croissant', 'brioche', 'painchoc', 'escargot', 'couronne'];

  var PANIER_MAX = 4;
  var FARINE_MAX = 6;
  var FARINE_MOULUE = 3;
  var TOURS_MOULIN = 4;
  var TAPES_PETRIR = 6;
  var MARGE_DORE = 1.8;     // le pain brûle à cuisson × 1,8 (× 1,5 quand le four chauffe fort)
  var COEURS = 3;

  // Niveaux. Chaque ligne ajoute ses nouveautés à celles d'avant (voir construireNiveaux).
  //   c : clients, s : clients en même temps, i : secondes entre deux arrivées, p : patience (s)
  //   r : recette ajoutée, four : places du four, tuto : démonstrations à montrer
  var LIGNES = [
    { c: 3,  s: 1, i: 3,   p: 70, r: 'baguette', tuto: ['base'] },
    { c: 5,  s: 2, i: 9,   p: 60, tuto: ['patience'] },
    { c: 5,  s: 2, i: 9,   p: 60, moulin: true, tuto: ['moulin'] },
    { c: 6,  s: 2, i: 9,   p: 60, r: 'boule', tuto: ['recette'] },
    { c: 7,  s: 3, i: 8,   p: 60, four: 2, tuto: ['four2'] },
    { c: 7,  s: 3, i: 8,   p: 62, formes: true, tuto: ['formes'] },
    { c: 8,  s: 3, i: 8,   p: 60, r: 'croissant', tuto: ['recette'] },
    { c: 8,  s: 3, i: 7.5, p: 58, presse: 0.3, tuto: ['presse'] },
    { c: 8,  s: 3, i: 7.5, p: 62, petrir: true, tuto: ['petrir'] },
    { c: 9,  s: 3, i: 7.5, p: 62, r: 'brioche', tuto: ['recette'] },
    { c: 9,  s: 3, i: 7.5, p: 62, gourmand: 0.25, tuto: ['gourmand'] },
    { c: 10, s: 3, i: 6.5, p: 56, four: 3, tuto: ['four3'] },
    { c: 10, s: 3, i: 6.5, p: 58, r: 'painchoc', tuto: ['recette'] },
    { c: 10, s: 3, i: 6.5, p: 58, chat: true, tuto: ['chat'] },
    { c: 11, s: 3, i: 5,   p: 54, tuto: ['pointe'] },
    { c: 11, s: 3, i: 6,   p: 58, r: 'escargot', tuto: ['recette'] },
    { c: 11, s: 3, i: 6,   p: 56, fourChaud: true, tuto: ['fourChaud'] },
    { c: 12, s: 3, i: 5.5, p: 54, presse: 0.35, gourmand: 0.3, tuto: ['melange'] },
    { c: 11, s: 3, i: 6,   p: 58, memoire: true, tuto: ['memoire'] },
    { c: 12, s: 3, i: 5.5, p: 54, tuto: ['melange'] },
    { c: 12, s: 3, i: 5.5, p: 56, r: 'couronne', tuto: ['recette'] },
    { c: 13, s: 3, i: 5.2, p: 54, tuto: ['melange'] },
    { c: 14, s: 3, i: 5,   p: 52, presse: 0.4, tuto: ['melange'] },
    { c: 15, s: 3, i: 4.8, p: 50, gourmand: 0.35, tuto: ['fete'] }
  ];
  // Niveaux où le four chauffe fort et où la recette se fait de mémoire (pas à tous les niveaux suivants).
  var FOUR_CHAUD = { 17: true, 18: true, 20: true, 22: true, 24: true };
  var MEMOIRE = { 19: true, 20: true, 23: true, 24: true };

  function construireNiveaux() {
    var liste = [];
    var cumul = { recettes: [], four: 1, moulin: false, formes: false, petrir: false, presse: 0, gourmand: 0, chat: false };
    LIGNES.forEach(function (l, i) {
      var n = i + 1;
      if (l.r) cumul.recettes = cumul.recettes.concat([l.r]);
      if (l.four) cumul.four = l.four;
      if (l.moulin) cumul.moulin = true;
      if (l.formes) cumul.formes = true;
      if (l.petrir) cumul.petrir = true;
      if (l.presse !== undefined) cumul.presse = l.presse;
      if (l.gourmand !== undefined) cumul.gourmand = l.gourmand;
      if (l.chat) cumul.chat = true;
      liste.push({
        numero: n, clients: l.c, simultanes: l.s, intervalle: l.i, patience: l.p,
        recettes: cumul.recettes.slice(), nouvelle: l.r || null, four: cumul.four,
        moulin: cumul.moulin, formes: cumul.formes, petrir: cumul.petrir,
        presse: cumul.presse, gourmand: cumul.gourmand, chat: cumul.chat,
        fourChaud: !!FOUR_CHAUD[n], memoire: !!MEMOIRE[n], tuto: l.tuto || []
      });
    });
    return liste;
  }
  var NIVEAUX = construireNiveaux();
  window.JEL_NIVEAUX = NIVEAUX.length;

  // ---------------------------------------------------------------------
  // 2. Dessins (SVG, sans aucun texte)
  // ---------------------------------------------------------------------

  var COULEURS_PAIN = {
    pate:  { fond: '#f7e8c9', bord: '#d8bf96', clair: '#fff6e2', fonce: '#e3cda4' },
    cuit:  { fond: '#d9953f', bord: '#9c5a22', clair: '#f3c47a', fonce: '#b06a2a' },
    brule: { fond: '#4a3426', bord: '#22150d', clair: '#6b4c38', fonce: '#2e1f15' }
  };

  // Dessin d'un pain selon sa forme et son état (pâte, cuit, brûlé).
  function painSVG(recette, etat, classe) {
    var forme = RECETTES[recette] ? RECETTES[recette].forme : recette;
    return '<svg viewBox="0 0 100 64" class="' + (classe || 'pain') + '" aria-hidden="true">' + formeSVG(forme, etat || 'cuit', recette) + '</svg>';
  }
  function formeSVG(forme, etat, recette) {
    var c = COULEURS_PAIN[etat] || COULEURS_PAIN.cuit;
    var choco = etat === 'brule' ? '#1a0f08' : '#5a2e17';
    var s = '';
    switch (forme) {
      case 'long':
        s = '<g transform="rotate(-12 50 34)"><ellipse cx="50" cy="34" rx="46" ry="13" fill="' + c.fond + '" stroke="' + c.bord + '" stroke-width="3"/>' +
          '<path d="M22 30 l10 6 M40 27 l10 7 M58 27 l10 7 M75 29 l8 5" stroke="' + c.clair + '" stroke-width="4" stroke-linecap="round"/></g>';
        break;

  // ---------------------------------------------------------------------
  // 3. Sons (Web Audio, aucun fichier ; rien avant la première action)
  // ---------------------------------------------------------------------
  var audio = null;
  var sonActif = true;
  try { if (localStorage.getItem('boulangerie-son') === '0') sonActif = false; } catch (e) { /* pas de stockage */ }
  function ctxAudio() {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
    if (audio && audio.state === 'suspended') { try { audio.resume(); } catch (e) { /* rien */ } }
    return audio;
  }
  function note(freq, duree, type, vol, retard, freqFin) {
    if (!sonActif || pauseActive) return;
    var ctx = ctxAudio(); if (!ctx) return;
    var t0 = ctx.currentTime + (retard || 0);
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (freqFin) o.frequency.exponentialRampToValueAtTime(freqFin, t0 + duree);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + duree + 0.05);
  }
  var SONS = {

    plop: function () { note(420, 0.12, 'sine', 0.18, 0, 180); },

  // ---------------------------------------------------------------------
  // 4. Sauvegarde (module commun JEL_SAVE) et progression
  // ---------------------------------------------------------------------
  var progres = { etoiles: [], records: [], debloque: 1, tresor: 0 };
  function lireProgres() {
    var d = window.JEL_SAVE ? window.JEL_SAVE.load(JEU) : null;
    progres = { etoiles: [], records: [], debloque: 1, tresor: 0 };
    if (d) {
      if (Array.isArray(d.etoiles)) progres.etoiles = d.etoiles.map(function (x) { return Math.max(0, Math.min(3, x | 0)); });
      if (Array.isArray(d.records)) progres.records = d.records.map(function (x) { return Math.max(0, x | 0); });
      progres.debloque = Math.max(1, Math.min(NIVEAUX.length, (d.debloque | 0) || 1, NIVEAUX.length));
      if ((d.niveau | 0) > progres.debloque) progres.debloque = Math.min(NIVEAUX.length, d.niveau | 0);
      progres.tresor = Math.max(0, d.score | 0);
      if (d.options && d.options.son === false) sonActif = false;
      if (d.options && d.options.son === true) sonActif = true;
    }
  }
  function totalEtoiles() { var s = 0; for (var i = 0; i < NIVEAUX.length; i++) s += progres.etoiles[i] || 0; return s; }
  function toutGagne() { for (var i = 0; i < NIVEAUX.length; i++) if (!(progres.etoiles[i] > 0)) return false; return true; }
  function sauver(niveauReprise) {
    if (!window.JEL_SAVE) return;
    window.JEL_SAVE.save(JEU, { niveau: niveauReprise, score: progres.tresor, options: { son: sonActif },
      etoiles: progres.etoiles.slice(), records: progres.records.slice(), debloque: progres.debloque });
  }

  var P = null;              // état de la partie en cours
  var pauseActive = false;
  var tutoActif = false;
  var dernierTemps = 0;
  var boucleId = 0;
  var idClient = 0;

  function arreterPartie() {
    P = null;
    pauseActive = false; tutoActif = false;
    $('couche-pause').classList.remove('actif');
    $('couche-fin').classList.remove('actif');
    $('couche-tuto').classList.remove('actif');
    if (boucleId) cancelAnimationFrame(boucleId);
    boucleId = 0;
  }

  function lancerNiveau(idx) {
    arreterPartie();
    idx = Math.max(0, Math.min(NIVEAUX.length - 1, idx));
    var N = NIVEAUX[idx];
    P = {
      idx: idx, N: N, temps: 0, aSpawner: N.clients, prochaineArrivee: 1, places: [null, null, null],
      coeurs: COEURS, pieces: 0, servis: 0, partis: 0,
      recette: null, bol: [], petri: 0, forme: null,
      four: [], panier: [],
      farine: N.moulin ? 3 : Infinity, moulinTours: 0, angleMoulin: 0,
      chat: null, prochainChat: 12 + Math.random() * 6,
      memoireJusqua: 0, memoireVisible: true,
      fini: false, premiereCommande: true, prochaineAide: 0
    };
    for (var f = 0; f < N.four; f++) P.four.push(null);
    montrerEcran('jeu');
    construireInterface();
    majTout();
    // Le premier client est déjà là : le tutoriel peut le montrer.
    placerClient();
    P.prochaineArrivee = Math.min(N.intervalle, 4);
    var tutos = N.tuto.slice();
    if (tutos.length) demarrerTuto(tutos);
    else annoncer();
    dernierTemps = performance.now();
    boucleId = requestAnimationFrame(boucle);

  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ----- Construction de l'interface d'un niveau -----
  var elPlaces = [], elCreneaux = [];

  function humeurDe(c) {

      if (s.etat === 'cuisson' && s.t >= s.T) { s.etat = 'cuit'; jouer('dore'); changement = true; }
      else if (s.etat === 'cuit' && s.t >= s.T * MARGE_DORE_EFF()) { s.etat = 'brule'; jouer('brule'); toast(tr('msg.brule')); changement = true; }
      majCuisson(s);
    });
    if (changement) { majFour(); majAide(); }
    // Chat gourmand.
    if (N.chat) majChat(dt);
    // Mode mémoire : la fiche se cache après quelques secondes.
    if (N.memoire && P.recette && P.memoireVisible !== ingredientsVisibles()) { majPetrin(); majAide(); }
    // Fin du niveau : tout le monde est passé.
    if (P.aSpawner <= 0 && !P.places.some(Boolean)) finNiveau(true);
  }
  function majChat(dt) {
    var el = $('chat');
    var zone = $('panier-zone').getBoundingClientRect();
    var largeur = zone.width;
    if (!P.chat) {
      if (P.temps >= P.prochainChat) {
        P.chat = { x: 1, fuite: false };
        el.hidden = false;
        el.className = 'chat';
        jouer('miaou');
        majAide();
      }
      return;
    }
    if (P.chat.fuite) {
      if (P.temps >= P.chat.finFuite) {
        P.chat = null; el.hidden = true;
        P.prochainChat = P.temps + 13 + Math.random() * 9;
        majAide();
      }
      return;
    }
    // Il avance vers le panier en 5 secondes environ.
    P.chat.x -= dt / 5.2;
    var cible = 0.62;
    var x = cible + (P.chat.x) * (1 - cible);
    el.style.left = (x * largeur - 20) + 'px';
    if (P.chat.x <= 0) {
      if (P.panier.length) {
        P.panier.pop();
        majPanier();
        toast(tr('msg.chatVole'));
        jouer('miaou');
      }
      P.chat.fuite = true;
      P.chat.finFuite = P.temps + 0.6;
      el.classList.add('fuit');
      majAide();
    }
  }

  // ----- Fin de niveau -----
  function finNiveau(gagne) {
    if (!P) return;
    P.fini = true;
    var idx = P.idx;
    var etoiles = gagne ? Math.max(1, P.coeurs) : 0;
    var ancienRecord = progres.records[idx] || 0;
    var record = gagne && P.pieces > ancienRecord;
    if (gagne) {
      progres.etoiles[idx] = Math.max(progres.etoiles[idx] || 0, etoiles);
      if (record) progres.records[idx] = P.pieces;
      progres.tresor += P.pieces;
      progres.debloque = Math.max(progres.debloque, Math.min(NIVEAUX.length, idx + 2));
      sauver(idx + 2);
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: idx + 1 });
      if (toutGagne()) { if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 }); }
      jouer('victoire');
      confettis();
    } else {
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: idx + 1 });
      jouer('defaite');
    }
    afficherFin(gagne, etoiles, record, ancienRecord);
  }
  function afficherFin(gagne, etoiles, record, ancienRecord) {
    var idx = P.idx;
    var dernier = idx === NIVEAUX.length - 1;
    $('fin-titre').textContent = gagne ? (dernier ? tr('finJeuTitre') : tr('victoireTitre')) : tr('defaiteTitre');
    var et = $('fin-etoiles');
    et.innerHTML = '';
    if (gagne) {
      for (var k = 0; k < 3; k++) {
        var s = document.createElement('span');
        s.innerHTML = etoileSVG(k < etoiles);
        var svg = s.firstChild;
        et.appendChild(svg);
        (function (svg, k) {
          setTimeout(function () { svg.classList.add(k < etoiles ? 'allume' : 'eteinte'); if (k < etoiles) jouer('etoile'); }, 350 + k * 380);
        })(svg, k);
      }
    }
    $('fin-message').textContent = gagne ? (dernier ? tr('finJeuMessage') : tr('victoireMessage' + etoiles)) : tr('defaiteMessage');
    var bilan = '<span>' + escapeHtml(tr('bilanClients', { n: P.servis, max: P.N.clients })) + '</span>' +
      '<span>' + escapeHtml(tr('bilanPieces', { n: 0 })).replace(nombre(0), '<b id="defile">' + nombre(0) + '</b>') + '</span>';
    if (gagne && record) bilan += '<span class="record">' + escapeHtml(tr('nouveauRecord')) + '</span>';
    else bilan += '<span>' + escapeHtml(tr('bilanRecord', { n: Math.max(ancienRecord, gagne ? P.pieces : 0) })) + '</span>';
    if (gagne && dernier) bilan += '<span>' + escapeHtml(tr('totalEtoiles', { n: totalEtoiles(), max: NIVEAUX.length * 3 })) + '</span>';
    $('fin-bilan').innerHTML = bilan;
    // Le compteur de pièces défile.
    var cible = P.pieces, valeur = 0;
    var defile = $('defile');
    var pas = Math.max(1, Math.ceil(cible / 20));
    var minuteur = setInterval(function () {
      valeur = Math.min(cible, valeur + pas);
      if (defile) defile.textContent = nombre(valeur);
      if (valeur >= cible) clearInterval(minuteur);
    }, 45);
    var b = $('fin-boutons');
    b.innerHTML = '';
    function ajouter(cle, action, principal) {
      var x = document.createElement('button');
      x.className = 'bouton' + (principal ? ' principal' : '');
      x.textContent = tr(cle);
      x.dataset.action = action;
      b.appendChild(x);
      return x;
    }
    var premier;
    if (gagne) {
      if (!dernier) premier = ajouter('suivant', 'suivant', true);
      var rj = ajouter('rejouer', 'rejouer', dernier);
      if (!premier) premier = rj;
      ajouter('niveaux', 'niveaux');
    } else {
      premier = ajouter('reessayer', 'rejouer', true);
      ajouter('niveaux', 'niveaux');
      ajouter('accueil', 'accueil');
    }
    setTimeout(function () {
      $('couche-fin').classList.add('actif');
      try { premier.focus({ preventScroll: true }); } catch (e) { /* rien */ }
    }, gagne ? 600 : 900);
  }

  // ----- Pause -----
  function mettrePause() {
    if (!P || P.fini || pauseActive || tutoActif) return;
    pauseActive = true;
    $('couche-pause').classList.add('actif');
    majBoutonsSon();
    setTimeout(function () { var b = $('couche-pause').querySelector('.bouton'); try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30);
  }
  function reprendre() {
    pauseActive = false;
    $('couche-pause').classList.remove('actif');
    dernierTemps = performance.now();
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) mettrePause(); });

  // ---------------------------------------------------------------------
  // 7. Tutoriel animé : une main montre le geste (une ou deux étapes par nouveauté)
  // ---------------------------------------------------------------------
  function cibleClient() {
    for (var i = 0; i < 3; i++) if (P.places[i]) return elPlaces[i];
    return $('comptoir');
  }
  var TUTOS = {
    base: [
      { cible: cibleClient, texte: 'tuto.base1' },
      { cible: function () { return $('etagere'); }, texte: 'tuto.base2' },
      { cible: function () { return $('four'); }, texte: 'tuto.base3' }
    ],
    patience: [{ cible: function () { return $('comptoir'); }, texte: 'tuto.patience' }],
    moulin: [{ cible: function () { return $('moulin'); }, texte: 'tuto.moulin' }],
    recette: [{ cible: function () { return $('carnet'); }, texte: 'tuto.recette' }, { cible: function () { return $('etagere'); }, texte: 'tuto.recette2' }],
    four2: [{ cible: function () { return $('four'); }, texte: 'tuto.four2' }],
    formes: [{ cible: function () { return $('formes'); }, texte: 'tuto.formes' }],
    presse: [{ cible: function () { return $('comptoir'); }, texte: 'tuto.presse' }],
    petrir: [{ cible: function () { return $('petrin'); }, texte: 'tuto.petrir' }],
    gourmand: [{ cible: function () { return $('comptoir'); }, texte: 'tuto.gourmand' }],
    four3: [{ cible: function () { return $('four'); }, texte: 'tuto.four3' }],
    chat: [{ cible: function () { return $('panier-zone'); }, texte: 'tuto.chat' }],
    pointe: [{ cible: function () { return $('comptoir'); }, texte: 'tuto.pointe' }],
    fourChaud: [{ cible: function () { return $('four'); }, texte: 'tuto.fourChaud' }],
    melange: [{ cible: function () { return $('comptoir'); }, texte: 'tuto.melange' }],
    memoire: [{ cible: function () { return $('petrin'); }, texte: 'tuto.memoire1' }, { cible: function () { return $('petrin'); }, texte: 'tuto.memoire2' }],
    fete: [{ cible: function () { return $('comptoir'); }, texte: 'tuto.fete' }]
  };
  var etapesTuto = [], etapeTuto = 0, minuteurTuto = 0;
  function demarrerTuto(cles) {
    etapesTuto = [];
    cles.forEach(function (c) { (TUTOS[c] || []).forEach(function (e) { etapesTuto.push(e); }); });
    if (!etapesTuto.length) return;
    tutoActif = true;
    etapeTuto = 0;
    $('main-tuto').innerHTML = mainSVG();
    $('couche-tuto').classList.add('actif');
    montrerEtapeTuto();
  }
  function montrerEtapeTuto() {
    var e = etapesTuto[etapeTuto];
    var cible = e.cible();
    var zone = $('app').getBoundingClientRect();
    var r = cible.getBoundingClientRect();
    var cercle = $('cercle-tuto');
    cercle.style.left = (r.left - zone.left - 4) + 'px';
    cercle.style.top = (r.top - zone.top - 4) + 'px';
    cercle.style.width = (r.width + 8) + 'px';
    cercle.style.height = (r.height + 8) + 'px';
    var main = $('main-tuto');
    main.style.left = (r.left - zone.left + r.width / 2 - 16) + 'px';
    main.style.top = (r.top - zone.top + r.height / 2 - 6) + 'px';
    var vars = { pain: P.N.nouvelle ? tr('pain.' + P.N.nouvelle) : '', ingr: P.N.nouvelle ? RECETTES[P.N.nouvelle].ingr.map(function (x) { return tr('ing.' + x); }).join(', ') : '' };
    var bulle = $('bulle-tuto');
    bulle.innerHTML = escapeHtml(tr(e.texte, vars)) + '<small>' + escapeHtml(tr(etapeTuto < etapesTuto.length - 1 ? 'tutoSuite' : 'tutoFin')) + '</small>';
    // La bulle se place au-dessus ou au-dessous de la cible, là où il y a de la place.
    var milieu = r.top - zone.top + r.height / 2;
    if (milieu > zone.height / 2) { bulle.style.top = '12px'; bulle.style.bottom = ''; }
    else { bulle.style.top = ''; bulle.style.bottom = '16px'; }
    clearTimeout(minuteurTuto);
    if (etapeTuto < etapesTuto.length - 1) minuteurTuto = setTimeout(suiteTuto, 3600);
  }
  function suiteTuto() {
    clearTimeout(minuteurTuto);
    if (etapeTuto < etapesTuto.length - 1) { etapeTuto++; montrerEtapeTuto(); return; }
    tutoActif = false;
    $('couche-tuto').classList.remove('actif');
    dernierTemps = performance.now();
    annoncer();
  }

  // ---------------------------------------------------------------------
  // 8. Commandes : doigt, souris, clavier
  // ---------------------------------------------------------------------
  function lancerPartie() {
    lireProgres();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: function (d) { lireProgres(); lancerNiveau(Math.max(1, Math.min(NIVEAUX.length, d.niveau | 0)) - 1); },
      onNouvelle: function () { lireProgres(); lancerNiveau(0); }
    });
  }
  $('b-jouer').addEventListener('click', function () { jouer('clic'); lancerPartie(); });
  $('b-niveaux').addEventListener('click', function () { jouer('clic'); afficherNiveaux(); });
  $('b-retour-niveaux').addEventListener('click', function () { jouer('clic'); afficherTitre(); });

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!el) return;
    ctxAudio();
    var a = el.dataset.action;
    if (a === 'son') { basculerSon(); return; }
    if (a === 'tuto') { suiteTuto(); return; }
    if (a === 'reprendre') { jouer('clic'); reprendre(); return; }
    if (a === 'recommencer' || a === 'rejouer') { jouer('clic'); if (P) lancerNiveau(P.idx); return; }
    if (a === 'suivant') { jouer('clic'); if (P) lancerNiveau(P.idx + 1); return; }
    if (a === 'niveaux') { jouer('clic'); afficherNiveaux(); return; }
    if (a === 'accueil') { jouer('clic'); afficherTitre(); return; }
    if (!P || P.fini) return;
    if (a === 'pause') { jouer('clic'); mettrePause(); return; }
    if (pauseActive || tutoActif) return;
    switch (a) {
      case 'client': actionClient(+el.dataset.i); break;
      case 'recette': selectionnerRecette(el.dataset.recette, el); break;
      case 'ingredient': actionIngredient(el.dataset.ingr, el); break;
      case 'petrin': actionPetrin(); break;
      case 'forme': actionForme(el.dataset.forme, el); break;
      case 'four': actionFour(+el.dataset.i); break;
      case 'moulin': actionMoulin(); break;
      case 'chat': actionChat(); break;
      case 'oeil': P.memoireJusqua = P.temps + 3; jouer('clic'); majPetrin(); majAide(); break;
      case 'vider': actionVider(); break;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented) return;
    ctxAudio();
    if (tutoActif && (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Escape')) { e.preventDefault(); suiteTuto(); return; }
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (ecranActif !== 'jeu' || !P) return;
      e.preventDefault();
      if (pauseActive) reprendre(); else mettrePause();
      return;
    }
    // Chiffres : ingrédients de l'étagère.
    var m = /^(Digit|Numpad)([0-9])$/.exec(e.code);
    if (m && ecranActif === 'jeu' && P && !P.fini && !pauseActive && !tutoActif) {
      var n = +m[2]; var k = n === 0 ? 9 : n - 1;
      var b = $('etagere').querySelectorAll('.ingredient')[k];
      if (b) { e.preventDefault(); b.click(); }
      return;
    }
    // Flèches : passer d'un bouton à l'autre (Entrée ou Espace pour toucher).
    if (/^Arrow/.test(e.code)) {
      var racine = $('couche-fin').classList.contains('actif') ? $('couche-fin') : pauseActive ? $('couche-pause') : $('ecran-' + ecranActif);
      var liste = Array.prototype.filter.call(racine.querySelectorAll('button'), function (x) { return !x.disabled && !x.hidden && x.offsetParent !== null; });
      if (!liste.length) return;
      e.preventDefault();
      var i = liste.indexOf(document.activeElement);
      var avant = e.code === 'ArrowLeft' || e.code === 'ArrowUp';
      i = i < 0 ? 0 : (i + (avant ? -1 : 1) + liste.length) % liste.length;
      try { liste[i].focus({ preventScroll: true }); } catch (err) { /* rien */ }
    }
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie.
  window.JEL_SAVE.surFermeture(function () {
    if (P && !P.fini && ecranActif === 'jeu') sauver(P.idx + 1);
  });

  // ---------------------------------------------------------------------
  // 9. Démarrage
  // ---------------------------------------------------------------------
  $('dessin-titre').innerHTML = dessinTitre();
  var effacerAccueil = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('effacer-accueil') });
  lireProgres();
  majBoutonsSon();
})();
</script>
</body>
</html>
