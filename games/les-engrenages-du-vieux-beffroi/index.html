<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());

    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];

  function appliquer(racine) {
    racine = racine || document;

      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],

  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })

  }

    }

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);

    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);

  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {

    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
'use strict';
/* ==========================================================================
   Les engrenages du vieux beffroi — jeu de plates-formes (Free Micro Games)
   Tic, l'apprenti horloger, grimpe les 20 étages du beffroi pour remettre
   l'horloge en marche avant midi. Tout est dessiné dans le canvas ; les textes
   passent par t() (5 langues).
   ========================================================================== */

const JEU = 'les-engrenages-du-vieux-beffroi';
const traduire = (cle, v) => window.JEL_I18N.t(cle, v);
const nombre = (x) => window.JEL_I18N.nombre(x);

// ---------------------------------------------------------------------------
// Réglages de la physique (unités du monde : la tour fait 420 de large)
// ---------------------------------------------------------------------------
const LARGEUR = 420;          // largeur de la tour
const MUR = 24;               // épaisseur des murs
const GAUCHE = MUR, DROITE = LARGEUR - MUR;
const GRAVITE = 1700;
const SAUT = -680;            // vitesse du saut (hauteur ≈ 136)
const COURSE = 170;           // vitesse de course
const ENTRAINEMENT = 140;     // vitesse donnée par une roue dentée
const RESSORT = -1100;        // bond d'un ressort (hauteur ≈ 356)
const TIC_L = 22, TIC_H = 32; // taille de Tic
const CHUTE_MAX = 400;        // chute sous la lanterne qui coûte un cœur

// ---------------------------------------------------------------------------
// Les 20 étages. Chaque lettre est une étape de l'ascension :
//  s saut court · S saut long · r roue dentée · R roue + levier (vide à franchir
//  avec l'élan de la roue) · c contrepoids · b balancier · p ressort ·
//  a aiguille du cadran · f vieilles planches · m automate · v vent
// ---------------------------------------------------------------------------
const NIVEAUX = [
  { q: 0, suite: 'ssssssss', tuto: ['base'], temps: 1.25 },
  { q: 0, suite: 'sssSssSsss', tuto: ['lanterne'], temps: 1.2 },
  { q: 0, suite: 'ssrsrsrss', tuto: ['roue'], temps: 1.2 },
  { q: 0, suite: 'srrsSrsrrss', tuto: [], temps: 1.15 },
  { q: 0, suite: 'ssRsrRsrsRss', tuto: ['levier'], temps: 1.15 },
  { q: 1, suite: 'sscsrcsscs', tuto: ['contrepoids'], temps: 1.15 },
  { q: 1, suite: 'ssbsbscsbss', tuto: ['balancier'], temps: 1.15 },
  { q: 1, suite: 'srbcRbsscbs', tuto: [], temps: 1.1 },
  { q: 1, suite: 'sspsspcpsbs', tuto: ['ressort'], temps: 1.1 },
  { q: 1, suite: 'spRbcsprbcspss', tuto: [], temps: 1.05 },
  { q: 2, suite: 'ssasaspasas', tuto: ['aiguille'], temps: 1.1 },
  { q: 2, suite: 'ssffsafsfpas', tuto: ['fragile'], temps: 1.1 },
  { q: 2, suite: 'ssmsmsamsms', tuto: ['automate'], temps: 1.05, auto: 55 },
  { q: 2, suite: 'smRfmbsmaRss', tuto: [], temps: 1.05, auto: 62 },
  { q: 2, suite: 'spamfbcmRsamss', tuto: [], temps: 1.0, auto: 68 },
  { q: 3, suite: 'ssvsvbsvpsvs', tuto: ['vent'], temps: 1.05, vent: 300 },
  { q: 3, suite: 'svmrvfvRmbvas', tuto: [], temps: 1.0, auto: 72, vent: 310 },
  { q: 3, suite: 'spvcmafvbRmvpss', tuto: [], temps: 0.95, auto: 76, vent: 320 },
  { q: 3, suite: 'sbvamfRpcvmbafvss', tuto: [], temps: 0.95, auto: 80, vent: 330 },
  { q: 3, suite: 'spRvbmacfvmpbRvamss', tuto: [], temps: 0.92, auto: 84, vent: 340, final: true },
];
window.JEL_NIVEAUX = NIVEAUX.length;
const MAX_ETOILES = NIVEAUX.length * 3;

// Temps (secondes) estimé pour chaque type d'étape
const DUREE_ETAPE = { s: 4, S: 5, r: 5, R: 9, c: 8, b: 7, p: 5, a: 8, f: 6, m: 6, v: 7, h: 4 };

// Tenues (débloquées avec les étoiles) et outils (avec les cloches d'argent)
const TENUES = [
  { etoiles: 0, chapeau: 'casquette', col: '#3b6fd8', tablier: '#b9773d' },
  { etoiles: 8, chapeau: 'casquette', col: '#3d9b57', tablier: '#5fae63' },
  { etoiles: 18, chapeau: 'beret', col: '#d8463b', tablier: '#efe0bf' },
  { etoiles: 30, chapeau: 'melon', col: '#2b2430', tablier: '#8e5cc4' },
  { etoiles: 45, chapeau: 'haut', col: '#24263f', tablier: '#3b4a8f' },
];
const OUTILS = [
  { cloches: 0 }, { cloches: 2 }, { cloches: 5 }, { cloches: 9 }, { cloches: 14 }, { cloches: 20 },
];

// Couleurs des quartiers : cave, salle des poids, cadran, clocher
const QUARTIERS = [
  { haut: '#2b2130', bas: '#171119', pierre: '#4f4248', joint: '#3a2f35', lueur: 'rgba(255,160,70,' },
  { haut: '#3a2a22', bas: '#1e1612', pierre: '#5f4a3a', joint: '#47362a', lueur: 'rgba(255,190,110,' },
  { haut: '#2e3550', bas: '#1a1c2c', pierre: '#59586b', joint: '#424153', lueur: 'rgba(255,225,150,' },
  { haut: '#7fb6e6', bas: '#f3c98e', pierre: '#8f7f73', joint: '#6e6058', lueur: 'rgba(255,240,200,' },
];

// ---------------------------------------------------------------------------
// Petits outils
// ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const borne = (v, a, b) => Math.max(a, Math.min(b, v));
function graine(n) { // générateur pseudo-aléatoire reproductible (mulberry32)
  let a = n >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let x = a;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------------------------------------------------------------------------
// Progression (sauvegarde JEL_SAVE + copie locale)
// ---------------------------------------------------------------------------
let prog = { etoiles: [], records: [], cloches: [], tenue: 0, outil: 0 };
let sonCoupe = false;

function lireProgression() {
  let d = null;
  try { d = window.JEL_SAVE ? window.JEL_SAVE.load(JEU) : null; } catch (e) { d = null; }
  const p = { etoiles: [], records: [], cloches: [], tenue: 0, outil: 0 };
  if (d) {
    if (Array.isArray(d.etoiles)) p.etoiles = d.etoiles.map((x) => borne(Math.floor(Number(x) || 0), 0, 3)).slice(0, NIVEAUX.length);
    if (Array.isArray(d.records)) p.records = d.records.map((x) => Math.max(0, Math.floor(Number(x) || 0))).slice(0, NIVEAUX.length);
    if (Array.isArray(d.cloches)) p.cloches = d.cloches.map((x) => !!x).slice(0, NIVEAUX.length);
    if (d.options && typeof d.options === 'object') {

// ---------------------------------------------------------------------------
// Fabrication d'un étage (toujours le même grâce à la graine)
// ---------------------------------------------------------------------------
function fabriquerEtage(index) {
  const cfg = NIVEAUX[index];
  const hasard = graine(9871 + index * 7919);
  const entre = (a, b) => a + hasard() * (b - a);
  const E = {
    poutres: [], roues: [], leviers: [], balanciers: [], ressorts: [], contrepoids: [], aiguilles: [],
    planches: [], automates: [], vents: [], rouages: [], lanternes: [], cloche: null, porte: null,
    candidats: [], hauteur: 0, temps: 10, q: cfg.q, etapes: 0,
  };
  let sensPrevu = 1; // sens des roues attendu (les leviers l'inversent)
  // Poutre de départ (sol de l'étage) : y grandit vers le bas, on part de y = 0 et on monte (y négatif)
  const sol = { x: GAUCHE, y: 0, w: DROITE - GAUCHE, sol: true };
  E.poutres.push(sol);
  let L = { x: GAUCHE + 120, y: 0, w: 140 };
  let compte = 0;
  let duree = 8;

  function poser(p) { E.poutres.push(p); compte++; if (compte % 5 === 0 && !p.large) E.lanternes.push({ x: p.x + p.w / 2, y: p.y, allumee: false }); return p; }

  function vers(depuis, xc, dyMin, dyMax, w, ecartMax) {

    let nx = xc - w / 2;
    nx = borne(nx, depuis.x - ecartMax - w, depuis.x + depuis.w + ecartMax);
    nx = borne(nx, GAUCHE, DROITE - w);
    return { x: nx, y: depuis.y - dy, w: w };
  }
  function auHasardX(w) { return entre(GAUCHE + w / 2, DROITE - w / 2); }
  function cote(p) { return p.x + p.w / 2 < LARGEUR / 2 ? -1 : 1; }
  // Amène l'ascension contre un mur (poutre étroite collée au mur) : utile avant les grands vides
  function allerAuBord(sensMur) {
    for (let k = 0; k < 4; k++) {
      const cible = sensMur < 0 ? GAUCHE + 35 : DROITE - 35;
      const p = vers(L, cible, 50, 80, 70, 70);
      L = poser(p); duree += DUREE_ETAPE.h;
      if ((sensMur < 0 && p.x <= GAUCHE + 1) || (sensMur > 0 && p.x + p.w >= DROITE - 1)) return;
    }

      const roue = { cx: seg.x + seg.w / 2, cy: seg.y + r + 5, r: r, dir: hasard() < 0.5 ? -1 : 1, angle: 0, v: 85 };
      E.roues.push(roue);
      L = { x: seg.x, y: seg.y, w: seg.w, roue: roue };
      candidat(roue.cx, seg.y - 75);

      const r = entre(38, 46);
      const cx = sensMur < 0 ? GAUCHE + 6 + r * 0.75 : DROITE - 6 - r * 0.75;

        L = poser({ x: va > 0 ? bordL + G : bordL - G - w, y: L.y - 80, w: w });

      }
      L.x = borne(L.x, GAUCHE, DROITE - L.w);    } else if (c === 'p') {
      poutreSolide();
      const sx = borne(L.x + L.w / 2 + (hasard() < 0.5 ? -1 : 1) * L.w * 0.25, GAUCHE + 20, DROITE - 20);
      E.ressorts.push({ x: sx, y: L.y, comp: 0 });
      const w = entre(85, 105);
      const xc = borne(sx + entre(-60, 60), GAUCHE + w / 2, DROITE - w / 2);
      L = poser({ x: xc - w / 2, y: L.y - entre(230, 290), w: w });

    } else if (c === 'f') {
      for (let k = 0; k < 2; k++) {
        const p = vers(L, auHasardX(56), 45, 75, 56, 55);
        p.fragile = true; p.etat = 0; p.chrono = 0; p.oy = p.y;

    } else if (c === 'm') {
      const w = entre(205, 250);
      const p = vers(L, auHasardX(w), 55, 85, w, 60);
      p.large = true;
      L = poser(p);
      const vit = cfg.auto || 55;
      E.automates.push({ x: p.x + 20 + hasard() * (w - 40), y: p.y, min: p.x + 14, max: p.x + w - 14, v: (hasard() < 0.5 ? -1 : 1) * vit, sorte: E.automates.length % 3, pas: 0 });
      candidat(p.x + w / 2, p.y - 95);

      E.vents.push({ haut: L.y - 70, bas: depart.y + 10, dir: hasard() < 0.5 ? -1 : 1, force: cfg.vent || 300, phase: hasard() * 3.8, actif: false, filets: [] });

  // Trois rouages dorés, répartis sur l'ascension

  for (let k = 0; k < 3; k++) {
    const i = borne(Math.floor((k + 0.5) * nc / 3), 0, nc - 1);

  for (const r of etage.roues) { const w = r.r * 1.5; L.push({ x: r.cx - w / 2, y: r.cy - r.r - 5, w: w, py: r.cy - r.r - 5, dx: 0, ref: r, roue: r }); }
  for (const c of etage.contrepoids) L.push({ x: c.x, y: c.y, w: c.w, py: c.py, dx: 0, ref: c });
  for (const a of etage.aiguilles) L.push({ x: a.x - a.w / 2, y: a.y, w: a.w, py: a.py, dx: a.x - a.pxx, ref: a });
  for (const p of etage.planches) if (p.etat < 2) L.push({ x: p.x, y: p.y, w: p.w, py: p.py === undefined ? p.y : p.py, dx: 0, ref: p, planche: p });
  return L;
}

function bougerMecanismes(dt) {
  const t = horloge;
  for (const r of etage.roues) r.angle += r.dir * sensRoues * (r.v / r.r) * dt;
  for (const c of etage.contrepoids) {
    c.py = c.y;
    const k = (1 - Math.cos(t * 6.283 / c.periode + c.phase)) / 2; // 0 en bas, 1 en haut
    c.y = c.bas + (c.haut - c.bas) * k;
  }
  for (const a of etage.aiguilles) {
    a.py = a.y; a.pxx = a.x;
    const ang = a.sens * t * 6.283 / a.periode + a.phase;
    a.x = a.cx + Math.cos(ang) * a.R; a.y = a.cy + Math.sin(ang) * a.R;
  }
  for (const b of etage.balanciers) {
    const w = 6.283 / b.periode;
    const th = b.amp * Math.sin(t * w + b.phase);
    const om = b.amp * w * Math.cos(t * w + b.phase);
    b.th = th;
    b.bx = b.px + Math.sin(th) * b.long; b.by = b.py + Math.cos(th) * b.long;
    b.vx = Math.cos(th) * om * b.long; b.vy = -Math.sin(th) * om * b.long;
  }
  for (const p of etage.planches) {
    p.py = p.y;
    if (p.etat === 1) { p.chrono += dt; if (p.chrono > 0.6) { p.etat = 2; p.chrono = 0; p.vy = 0; jouerSon('craque'); } }
    else if (p.etat === 2) { p.chrono += dt; p.vy += GRAVITE * 0.6 * dt; p.y += p.vy * dt; if (p.chrono > 2.6) { p.etat = 0; p.chrono = 0; p.y = p.oy; p.py = p.y; } }
  }
  for (const m of etage.automates) {
    m.x += m.v * dt; m.pas += dt;
    if (m.x < m.min) { m.x = m.min; m.v = Math.abs(m.v); }
    if (m.x > m.max) { m.x = m.max; m.v = -Math.abs(m.v); }
  }
  for (const v of etage.vents) {
    const cyc = (t + v.phase) % 3.8;
    const avant = v.actif;
    v.actif = cyc < 2.0;
    if (v.actif && !avant && Math.abs(tic.y - (v.haut + v.bas) / 2) < 260) jouerSon('rafale');
  }
  for (const r of etage.ressorts) r.comp = Math.max(0, r.comp - dt * 4);
  for (const l of etage.leviers) l.bascule = Math.max(0, l.bascule - dt * 3);
}

function blesser(depuisX) {
  if (tic.invinc > 0) return;
  coeurs--;
  tic.invinc = 1.6;
  secousse = 0.35;
  jouerSon('choc');
  tic.vx = (tic.x < depuisX ? -1 : 1) * 260; tic.vy = -380; tic.sol = null; tic.auSol = false;
  eclats(tic.x, tic.y - 16, '#ff8a7a', 10);
  majHud();
  if (coeurs <= 0) perdre('coeurs');
}

function majTic(dt) {
  const T = tic;
  const dir = directionVoulue();
  if (dir) T.face = dir;
  T.invinc = Math.max(0, T.invinc - dt);
  T.lache = Math.max(0, T.lache - dt);
  demandeSaut = Math.max(0, demandeSaut - dt);
  const plats = plateformes();

  // Accroché à un balancier
  if (T.accroche) {
    const b = T.accroche;
    T.x = b.bx; T.y = b.by + TIC_H - 6; T.vx = b.vx; T.vy = b.vy;
    if (demandeSaut > 0) {
      demandeSaut = 0; T.accroche = null; T.lache = 0.35;
      T.vx = b.vx * 1.05 + dir * 60; T.vy = Math.min(b.vy, 0) - 430;
      jouerSon('saut');
    }
  } else {
    physiqueTic(T, dt, dir, plats);
  }
  interactionsTic(T);
}

function physiqueTic(T, dt, dir, plats) {
  // Porté par une plate-forme : il suit son mouvement
  if (T.auSol && T.sol) {
    const s = plats.find((p) => p.ref === T.sol);
    if (s) {
      T.y = s.y;
      T.x += s.dx;
      if (s.roue) T.x += s.roue.dir * sensRoues * s.roue.v * dt;
    }
  }

  // Vent
  let poussee = 0;
  for (const v of etage.vents) if (v.actif && T.y > v.haut && T.y - TIC_H < v.bas) poussee += v.dir * v.force;

  // Vitesse horizontale
  if (T.auSol) {
    const cible = dir * COURSE;
    const acc = 2400 * dt;
    T.vx = Math.abs(cible - T.vx) < acc ? cible : T.vx + Math.sign(cible - T.vx) * acc;
    T.x += poussee * 0.13 * dt;
  } else {
    if (dir) {
      const cible = dir * COURSE;
      if (!(Math.sign(T.vx) === dir && Math.abs(T.vx) > COURSE)) {
        const acc = 1100 * dt;
        T.vx = Math.abs(cible - T.vx) < acc ? cible : T.vx + Math.sign(cible - T.vx) * acc;
      }
    }
    T.vx += poussee * dt;
  }

  // Saut (avec un petit délai de grâce après avoir quitté une poutre)
  T.coyote = T.auSol ? 0.1 : Math.max(0, T.coyote - dt);
  if (demandeSaut > 0 && (T.auSol || T.coyote > 0)) {
    demandeSaut = 0;
    let elan = 0;
    if (T.sol && T.sol.cx !== undefined && T.sol.r) elan = T.sol.dir * sensRoues * T.sol.v;
    T.vx += elan;
    T.vy = SAUT;
    T.auSol = false; T.sol = null; T.coyote = 0;
    jouerSon('saut');
    poussiere(T.x, T.y, 6);
  }

  // Gravité et déplacement
  T.py = T.y;
  if (!T.auSol) T.vy = Math.min(T.vy + GRAVITE * dt, 950);
  T.x += T.vx * dt;
  if (T.x < GAUCHE + TIC_L / 2) { T.x = GAUCHE + TIC_L / 2; if (T.vx < 0) T.vx = 0; }
  if (T.x > DROITE - TIC_L / 2) { T.x = DROITE - TIC_L / 2; if (T.vx > 0) T.vx = 0; }
  if (!T.auSol) T.y += T.vy * dt;

  // Toujours sur sa plate-forme ?
  if (T.auSol) {
    const s = plats.find((p) => p.ref === T.sol);
    if (!s || T.x + TIC_L / 2 < s.x + 2 || T.x - TIC_L / 2 > s.x + s.w - 2) { T.auSol = false; T.sol = null; T.vy = 0; }
  }
  // Atterrissage (les poutres se traversent par-dessous)
  if (!T.auSol && T.vy >= 0) {
    for (const p of plats) {
      if (T.x + TIC_L / 2 < p.x + 2 || T.x - TIC_L / 2 > p.x + p.w - 2) continue;
      if (T.py <= p.py + 2 && T.y >= p.y) {
        const chute = T.vy;
        T.y = p.y; T.vy = 0; T.auSol = true; T.sol = p.ref;
        if (p.roue) T.vx = 0; // la roue donne son propre élan
        if (chute > 420) { poussiere(T.x, T.y, 5); jouerSon('pose'); }
        if (p.planche && p.planche.etat === 0) { p.planche.etat = 1; p.planche.chrono = 0; jouerSon('craque'); }
        break;
      }
    }
  }
  if (T.auSol && T.sol && T.sol.fragile && T.sol.etat === 0) { T.sol.etat = 1; T.sol.chrono = 0; }

  // Ressorts
  for (const r of etage.ressorts) {
    if (Math.abs(T.x - r.x) < 17 && T.y >= r.y - 18 && T.y <= r.y + 2 && T.vy >= 0) {
      T.vy = RESSORT; T.auSol = false; T.sol = null; T.y = r.y - 18;
      r.comp = 1; jouerSon('ressort'); eclats(r.x, r.y - 14, '#ffe08a', 8);
    }
  }
  // Balanciers : on s'y accroche en l'air
  if (!T.auSol && T.lache <= 0) {
    for (const b of etage.balanciers) {
      if (Math.hypot(T.x - b.bx, T.y - TIC_H / 2 - b.by) < 26) { T.accroche = b; jouerSon('accroche'); break; }
    }
  }
  // Animation des pas
  if (T.auSol && Math.abs(T.vx) > 10) T.pas += dt * 12; else if (T.auSol) T.pas = 0;
}

// Ce que Tic touche : leviers, automates, rouages, cloche, lanternes, porte, chute
function interactionsTic(T) {
  // Leviers
  for (const l of etage.leviers) {
    const dedans = Math.abs(T.x - l.x) < 16 && Math.abs(T.y - l.y) < 30;
    if (dedans && !l.dedans) {
      sensRoues = -sensRoues; l.bascule = 1; jouerSon('levier'); secousse = 0.1;
      toast(traduire('message.levier'));
    }
    l.dedans = dedans;
  }
  // Automates
  for (const m of etage.automates) {
    if (Math.abs(T.x - m.x) < (TIC_L / 2 + 12) && T.y > m.y - 40 && T.y <= m.y + 2) {
      if (T.vy > 60 && T.py <= m.y - 30) {
        T.vy = -560; T.auSol = false; T.sol = null; jouerSon('rebond'); eclats(T.x, T.y, '#bfe3ff', 8);
      } else blesser(m.x);
    }
  }
  // Rouages, cloche, lanternes
  for (const g of etage.rouages) {
    if (!g.pris && Math.hypot(T.x - g.x, T.y - TIC_H / 2 - g.y) < 26) {
      g.pris = true; jouerSon('rouage'); eclats(g.x, g.y, '#ffd34d', 18); majHud();
      toast(traduire('message.rouage', { n: etage.rouages.filter((r) => r.pris).length }));
    }
  }
  const cl = etage.cloche;
  if (cl && !cl.prise && Math.hypot(T.x - cl.x, T.y - TIC_H / 2 - cl.y) < 26) {
    cl.prise = true; jouerSon('cloche'); eclats(cl.x, cl.y, '#e8f2ff', 22); toast(traduire('message.cloche'));
  }
  for (const l of etage.lanternes) {
    if (!l.allumee && Math.abs(T.x - l.x) < 22 && Math.abs(T.y - l.y) < 40) {
      l.allumee = true; T.reprise = { x: l.x, y: l.y }; jouerSon('lanterne'); eclats(l.x, l.y - 30, '#ffb347', 10);
      toast(traduire('message.lanterne'));
    }
  }
  // Porte de sortie
  const po = etage.porte;
  if (Math.abs(T.x - po.x) < 20 && Math.abs(T.y - po.y) < 8 && T.auSol) gagner();

  // Chute trop longue : retour à la dernière lanterne
  if (T.y > T.reprise.y + CHUTE_MAX && !finPartie) {
    coeurs--; secousse = 0.3; jouerSon('choc'); majHud();
    if (coeurs <= 0) { perdre('coeurs'); return; }
    const r = T.reprise;
    tic = nouveauTic(r.x, r.y); tic.reprise = r; tic.invinc = 1.2;
    toast(traduire('message.chute'));
  }
}

function mettreAJour(dt) {
  if (mode !== 'jeu' || finPartie) { majParticules(dt); return; }
  horloge += dt;
  tempsRestant -= dt;
  if (tempsRestant <= 10 && Math.floor(tempsRestant) !== dernierTic && tempsRestant > 0) { dernierTic = Math.floor(tempsRestant); jouerSon('tic'); }
  if (tempsRestant <= 0) { tempsRestant = 0; majHud(); perdre('temps'); return; }
  bougerMecanismes(dt);
  // Deux petits pas de calcul pour des collisions sûres
  majTic(dt / 2);
  if (!finPartie && mode === 'jeu') majTic(dt / 2);
  for (const g of etage.rouages) g.angle += dt * 1.5;
  majParticules(dt);
  secousse = Math.max(0, secousse - dt);
  // Caméra
  const cible = tic.y - VUE_H * 0.62;
  camY += (cible - camY) * Math.min(1, dt * 6);
  majHudTemps();
}

// ---------------------------------------------------------------------------
// Particules et messages
// ---------------------------------------------------------------------------
function eclats(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = 60 + Math.random() * 160;
    particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, vie: 0.6 + Math.random() * 0.5, col: col, t: 3 + Math.random() * 3, etoile: Math.random() < 0.4 });
  }
}
function poussiere(x, y, n) {
  for (let i = 0; i < n; i++) particules.push({ x: x + (Math.random() - 0.5) * 14, y: y, vx: (Math.random() - 0.5) * 90, vy: -Math.random() * 50, vie: 0.35, col: 'rgba(220,200,170,.8)', t: 3, etoile: false });
}
function confettis() {
  const cols = ['#ffd34d', '#ff7aa8', '#7ad3ff', '#9ff0a6', '#c79bff'];
  for (let i = 0; i < 90; i++) particules.push({ x: Math.random() * LARGEUR, y: camY - 20 - Math.random() * 200, vx: (Math.random() - 0.5) * 80, vy: 60 + Math.random() * 120, vie: 3 + Math.random() * 2, col: cols[i % cols.length], t: 4, etoile: false, confetti: true, rot: Math.random() * 6 });
}
function majParticules(dt) {
  for (const p of particules) {
    p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.confetti) { p.rot += dt * 5; p.vx += Math.sin(p.rot) * 20 * dt; } else p.vy += 300 * dt;
  }
  particules = particules.filter((p) => p.vie > 0);
}
let toastMinuteur = 0;
function toast(txt) {
  const el = $('toast');
  el.textContent = txt; el.classList.add('vu');
  clearTimeout(toastMinuteur);
  toastMinuteur = setTimeout(() => el.classList.remove('vu'), 1600);
}

// ---------------------------------------------------------------------------
// Dessin
// ---------------------------------------------------------------------------
function chemin(f) { ctx.beginPath(); f(); }
function roueDentee(c, x, y, r, angle, dents, col, colFonce, trou) {
  c.save(); c.translate(x, y); c.rotate(angle);
  c.fillStyle = col;
  c.beginPath();
  for (let i = 0; i < dents; i++) {
    const a0 = (i / dents) * 6.283, a1 = ((i + 0.5) / dents) * 6.283;
    const e = r + Math.max(4, r * 0.16);
    c.lineTo(Math.cos(a0 - 0.12) * r, Math.sin(a0 - 0.12) * r);
    c.lineTo(Math.cos(a0) * e, Math.sin(a0) * e);
    c.lineTo(Math.cos(a1 - 0.25) * e, Math.sin(a1 - 0.25) * e);
    c.lineTo(Math.cos(a1 - 0.1) * r, Math.sin(a1 - 0.1) * r);
  }
  c.closePath(); c.fill();
  c.strokeStyle = colFonce; c.lineWidth = Math.max(1.5, r * 0.06); c.stroke();
  c.beginPath(); c.arc(0, 0, r * 0.72, 0, 6.283); c.strokeStyle = colFonce; c.stroke();
  // rayons
  c.lineWidth = Math.max(2, r * 0.12);
  for (let i = 0; i < 4; i++) { const a = i * 1.5708; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7); c.stroke(); }
  c.beginPath(); c.arc(0, 0, r * (trou || 0.2), 0, 6.283); c.fillStyle = colFonce; c.fill();
  c.restore();
}

function dessinerFond(q, cy) {
  const Q = QUARTIERS[q];
  const g = ctx.createLinearGradient(0, 0, 0, LH);
  g.addColorStop(0, Q.haut); g.addColorStop(1, Q.bas);
  ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);
  ctx.save();
  ctx.scale(ECH, ECH);
  ctx.translate(DECAL_X, 0);
  const par = cy * 0.35; // parallaxe
  if (q === 3) {
    // Ciel par les arches du clocher, nuages
    for (let i = 0; i < 6; i++) {
      const nx = ((i * 137 + horloge * 8) % 600) - 100, ny = ((i * 211 - par * 0.4) % 900 + 900) % 900 - 100;
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      chemin(() => { ctx.arc(nx, ny, 26, 0, 6.283); ctx.arc(nx + 28, ny + 6, 20, 0, 6.283); ctx.arc(nx - 26, ny + 8, 18, 0, 6.283); }); ctx.fill();
    }
    // piliers d'arches
    // arches de pierre qui défilent
    ctx.strokeStyle = 'rgba(140,115,100,.55)'; ctx.lineWidth = 16;
    const a0 = ((-par % 360) + 360) % 360 - 360;
    for (let yy = a0; yy < VUE_H + 360; yy += 360) {
      chemin(() => { ctx.moveTo(40, yy + 360); ctx.lineTo(40, yy + 160); ctx.arc(LARGEUR / 2, yy + 160, LARGEUR / 2 - 40, Math.PI, 0); ctx.lineTo(LARGEUR - 40, yy + 360); }); ctx.stroke();
    }
  } else if (q === 2) {
    // Grand cadran éclairé derrière (sans chiffres)
    const fy = ((-par * 0.6) % 900 + 900) % 900 + 120;
    for (const yy of [fy - 900, fy]) {
      const rg = ctx.createRadialGradient(LARGEUR / 2, yy, 20, LARGEUR / 2, yy, 260);
      rg.addColorStop(0, 'rgba(255,230,160,.55)'); rg.addColorStop(1, 'rgba(255,200,120,.06)');
      ctx.fillStyle = rg; chemin(() => ctx.arc(LARGEUR / 2, yy, 240, 0, 6.283)); ctx.fill();
      ctx.strokeStyle = 'rgba(80,60,40,.6)'; ctx.lineWidth = 5;
      chemin(() => ctx.arc(LARGEUR / 2, yy, 240, 0, 6.283)); ctx.stroke();
      for (let i = 0; i < 12; i++) {
        const a = i * 0.5236;
        ctx.lineWidth = i % 3 === 0 ? 8 : 4;
        chemin(() => { ctx.moveTo(LARGEUR / 2 + Math.cos(a) * 205, yy + Math.sin(a) * 205); ctx.lineTo(LARGEUR / 2 + Math.cos(a) * 230, yy + Math.sin(a) * 230); }); ctx.stroke();
      }
      ctx.save(); ctx.translate(LARGEUR / 2, yy); ctx.strokeStyle = 'rgba(60,40,30,.55)'; ctx.lineCap = 'round';
      ctx.lineWidth = 9; ctx.rotate(horloge * 0.05); chemin(() => { ctx.moveTo(0, 0); ctx.lineTo(0, -150); }); ctx.stroke();
      ctx.lineWidth = 6; ctx.rotate(horloge * 0.4); chemin(() => { ctx.moveTo(0, 0); ctx.lineTo(0, -195); }); ctx.stroke();
      ctx.restore();
    }
  } else {
    // Grands engrenages dans l'ombre
    const col = q === 0 ? 'rgba(90,70,80,.45)' : 'rgba(120,90,60,.45)';
    const fonce = q === 0 ? 'rgba(40,30,38,.5)' : 'rgba(60,40,25,.5)';
    for (let i = 0; i < 6; i++) {
      const gx = (i % 2 ? 330 : 90) + (i % 3) * 20;
      const gy = (((i * 260 - par) % 1560) + 1560) % 1560 - 200;
      roueDentee(ctx, gx, gy, 70 + (i % 3) * 25, horloge * 0.2 * (i % 2 ? 1 : -1), 14, col, fonce, 0.25);
    }
    if (q === 1) {
      // chaînes qui pendent
      ctx.strokeStyle = 'rgba(160,140,120,.35)'; ctx.lineWidth = 3;
      for (const cx of [140, 280]) { for (let y = (-par % 16) - 16; y < VUE_H; y += 16) { chemin(() => ctx.ellipse(cx, y, 4, 7, 0, 0, 6.283)); ctx.stroke(); } }
    }
  }
  ctx.restore();
}

function dessinerMurs(q, cy) {
  const Q = QUARTIERS[q];
  ctx.fillStyle = Q.pierre;
  // marges (écran large) et murs de la tour
  ctx.fillRect(-DECAL_X - 10, cy - 10, DECAL_X + 10 + MUR, VUE_H + 20);
  ctx.fillRect(DROITE, cy - 10, DECAL_X + 10 + MUR, VUE_H + 20);
  ctx.strokeStyle = Q.joint; ctx.lineWidth = 2;
  const y0 = Math.floor(cy / 22) * 22;
  for (let y = y0; y < cy + VUE_H + 22; y += 22) {
    const dec = (Math.round(y / 22) % 2) * 14;
    chemin(() => { ctx.moveTo(-DECAL_X, y); ctx.lineTo(MUR, y); ctx.moveTo(DROITE, y); ctx.lineTo(LARGEUR + DECAL_X, y); }); ctx.stroke();
    for (let x = -DECAL_X - 28 + dec; x < MUR; x += 28) { chemin(() => { ctx.moveTo(x, y); ctx.lineTo(x, y + 22); }); ctx.stroke(); }
    for (let x = DROITE + dec; x < LARGEUR + DECAL_X; x += 28) { chemin(() => { ctx.moveTo(x, y); ctx.lineTo(x, y + 22); }); ctx.stroke(); }
  }
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(MUR - 4, cy - 10, 4, VUE_H + 20); ctx.fillRect(DROITE, cy - 10, 4, VUE_H + 20);
  // torches des murs (cave) / lucarnes (clocher)
  if (q === 0) {
    for (let y = Math.floor(cy / 300) * 300; y < cy + VUE_H + 300; y += 300) {
      for (const x of [MUR - 2, DROITE + 2]) {
        const f = 0.6 + Math.sin(horloge * 9 + y) * 0.15;
        const rg = ctx.createRadialGradient(x, y, 2, x, y, 70);
        rg.addColorStop(0, Q.lueur + (0.45 * f) + ')'); rg.addColorStop(1, Q.lueur + '0)');
        ctx.fillStyle = rg; ctx.fillRect(x - 70, y - 70, 140, 140);
        ctx.fillStyle = '#ffb347'; chemin(() => ctx.ellipse(x, y - 4, 4, 8 * f + 2, 0, 0, 6.283)); ctx.fill();
      }
    }
  }
}

function dessinerPoutre(p, q) {
  if (p.sol) {
    ctx.fillStyle = '#4a3326'; ctx.fillRect(p.x, p.y, p.w, 40);
    ctx.fillStyle = '#6d4a33'; ctx.fillRect(p.x, p.y, p.w, 8);
    return;
  }
  const bois = q === 2 ? '#8a5a35' : q === 3 ? '#9a6a3d' : '#7a4f30';
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(p.x + 3, p.y + 4, p.w, 14);

}

function fleche(x, y, dir, col) {

  ctx.restore();
}

function dessinerRoue(r) {

}
function dessinerBalancier(b) {
  ctx.fillStyle = '#4a3a30'; ctx.fillRect(b.px - 14, b.py - 8, 28, 8);
  ctx.strokeStyle = '#c9a25a'; ctx.lineWidth = 3;
  chemin(() => { ctx.moveTo(b.px, b.py); ctx.lineTo(b.bx, b.by); }); ctx.stroke();
  const rg = ctx.createRadialGradient(b.bx - 4, b.by - 4, 2, b.bx, b.by, 16);

}

  chemin(() => { ctx.moveTo(r.x - 10, r.y); for (let i = 1; i <= 5; i++) ctx.lineTo(r.x + (i % 2 ? 10 : -10), r.y - (h * i) / 5); }); ctx.stroke();

function dessinerContrepoids(c) {

function dessinerAiguille(a) {
  ctx.save();

  ctx.strokeStyle = '#d7a64a'; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = '#d7a64a'; chemin(() => ctx.arc(a.cx, a.cy, 5, 0, 6.283)); ctx.fill();

}
function dessinerPlanche(p) {

function dessinerAutomate(m) {
  const x = m.x, y = m.y, dir = Math.sign(m.v) || 1;

    ctx.fillStyle = '#f6d4b8'; chemin(() => ctx.arc(0, -32, 8, 0, 6.283)); ctx.fill();
    ctx.fillStyle = '#6b3b2a'; chemin(() => ctx.arc(0, -38, 6, 0, 6.283)); ctx.fill();
    ctx.strokeStyle = '#f6d4b8'; ctx.lineWidth = 3; chemin(() => { ctx.moveTo(0, -24); ctx.lineTo(-12, -32 - Math.sin(m.pas * 6) * 4); ctx.moveTo(0, -24); ctx.lineTo(12, -32 + Math.sin(m.pas * 6) * 4); }); ctx.stroke();

    ctx.fillStyle = '#e0533d'; ctx.fillRect(-9, -48, 18, 6);

}
function dessinerVent(v) {
  const h = v.bas - v.haut;

  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = 0; i < 9; i++) {
    const yy = v.haut + ((i * 37) % h);
    const avance = ((horloge * (v.actif ? 260 : 40) + i * 83) % (LARGEUR + 120)) - 60;

  c.fillStyle = '#8e99a8'; c.beginPath(); c.arc(0, 13, 3.5, 0, 6.283); c.fill();
  c.beginPath(); c.arc(0, -15, 3, 0, 6.283); c.fill();

}
function dessinerLanterne(l) {
  if (l.allumee) {

    rg.addColorStop(0, 'rgba(255,190,90,.6)'); rg.addColorStop(1, 'rgba(255,190,90,0)');

  ctx.fillStyle = '#3a2d26'; ctx.fillRect(l.x - 2, l.y - 24, 4, 24);

  ctx.fillStyle = '#2d2226'; chemin(() => { ctx.moveTo(l.x - 10, l.y - 42); ctx.lineTo(l.x + 10, l.y - 42); ctx.lineTo(l.x, l.y - 50); ctx.closePath(); }); ctx.fill();
}
function dessinerPorte(p, finale) {
  const x = p.x, y = p.y;
  const rg = ctx.createRadialGradient(x, y - 30, 4, x, y - 30, 70);
  rg.addColorStop(0, 'rgba(255,230,150,.45)'); rg.addColorStop(1, 'rgba(255,230,150,0)');
  ctx.fillStyle = rg; ctx.fillRect(x - 70, y - 100, 140, 120);

  chemin(() => { ctx.moveTo(x - 20, y); ctx.lineTo(x - 20, y - 40); ctx.arc(x, y - 40, 20, Math.PI, 0); ctx.lineTo(x + 20, y); ctx.closePath(); }); ctx.fill();
  ctx.strokeStyle = '#c99a4e'; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 2;

  roueDentee(ctx, x, y - 42, 7, horloge, 8, '#ffd34d', '#8a5a18', 0.3);
  if (finale) dessinerCloche(ctx, x, y - 92, 1.6 + Math.sin(horloge * 3) * 0.05, '#ffd98a');

// Tic, l'apprenti horloger
function dessinerTic(c, x, y, face, pas, tenue, outil, accroche, clignote) {
  const T = TENUES[tenue] || TENUES[0];
  c.save(); c.translate(x, y);
  if (clignote && Math.floor(horloge * 12) % 2) c.globalAlpha = 0.45;
  c.scale(face, 1);
  const jambe = Math.sin(pas) * 6;
  // jambes
  c.strokeStyle = '#3b2a22'; c.lineWidth = 4; c.lineCap = 'round';
  if (accroche) { c.beginPath(); c.moveTo(-3, -10); c.lineTo(-6, 0); c.moveTo(3, -10); c.lineTo(5, 0); c.stroke(); }
  else { c.beginPath(); c.moveTo(-3, -10); c.lineTo(-3 + jambe, 0); c.moveTo(3, -10); c.lineTo(3 - jambe, 0); c.stroke(); }
  // corps et tablier
  c.fillStyle = '#f2e6d0'; c.fillRect(-8, -22, 16, 13);
  c.fillStyle = T.tablier; c.fillRect(-7, -20, 14, 13);
  c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(-3, -14, 6, 4);
  // bras (et outil)
  c.strokeStyle = '#f2c9a0'; c.lineWidth = 3.5;
  c.beginPath();
  if (accroche) { c.moveTo(0, -20); c.lineTo(0, -32); } else { c.moveTo(5, -18); c.lineTo(10, -12 - jambe * 0.3); }
  c.stroke();
  if (!accroche && outil > 0) dessinerOutil(c, 11, -12, outil);
  // tête
  c.fillStyle = '#f6d1a8'; c.beginPath(); c.arc(0, -29, 8.5, 0, 6.283); c.fill();
  c.fillStyle = '#1d1620'; c.beginPath(); c.arc(3.5, -30, 1.6, 0, 6.283); c.fill();
  c.fillStyle = '#e8907a'; c.beginPath(); c.arc(5, -26, 1.6, 0, 6.283); c.fill();
  // cheveux et chapeau
  c.fillStyle = '#6b3b22'; c.beginPath(); c.arc(-3, -31, 6, Math.PI * 0.8, Math.PI * 1.6); c.fill();
  c.fillStyle = T.col;
  if (T.chapeau === 'casquette') { c.beginPath(); c.arc(0, -32, 8.6, Math.PI, 0); c.fill(); c.fillRect(2, -33, 10, 3); }
  else if (T.chapeau === 'beret') { c.beginPath(); c.ellipse(-1, -36, 10, 4.5, -0.15, 0, 6.283); c.fill(); c.fillRect(-1, -42, 2, 3); }
  else if (T.chapeau === 'melon') { c.beginPath(); c.arc(0, -35, 7, Math.PI, 0); c.fill(); c.fillRect(-10, -36, 20, 2.5); }
  else { c.fillRect(-6, -48, 12, 13); c.fillRect(-10, -36, 20, 2.5); c.fillStyle = '#ffd34d'; c.fillRect(-6, -39, 12, 2.5); }
  // loupe d'horloger sur l'œil (outil 4)
  if (outil === 4) { c.fillStyle = '#2d2226'; c.beginPath(); c.arc(4, -30, 3.5, 0, 6.283); c.fill(); c.fillStyle = '#9fd8ff'; c.beginPath(); c.arc(4, -30, 2.2, 0, 6.283); c.fill(); }
  c.restore();
}
function dessinerOutil(c, x, y, o) {
  c.save(); c.translate(x, y);
  if (o === 1) { c.fillStyle = '#e0533d'; c.fillRect(-2, -2, 4, 7); c.fillStyle = '#c0c6cf'; c.fillRect(-1, -10, 2, 8); }
  else if (o === 2) { c.fillStyle = '#c99a4e'; c.beginPath(); c.arc(0, 2, 4, 0, 6.283); c.fill(); c.strokeStyle = '#c99a4e'; c.lineWidth = 2; c.beginPath(); c.moveTo(2, 0); c.lineTo(9, -6); c.stroke(); }
  else if (o === 3) { c.strokeStyle = '#c0c6cf'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 4); c.lineTo(0, -6); c.stroke(); c.beginPath(); c.arc(0, -8, 3.5, 0.6, 5.7); c.stroke(); }
  else if (o === 4) { c.fillStyle = '#c99a4e'; c.fillRect(-1, -6, 2, 10); }
  else if (o === 5) { roueDentee(c, 0, -2, 4.5, horloge * 3, 6, '#ffd34d', '#8a5a18', 0.3); }
  c.restore();
}

function dessinerJeu() {
  const q = etage ? etage.q : 0;
  const sec = secousse > 0 ? (Math.random() - 0.5) * 8 * secousse / 0.35 : 0;
  dessinerFond(q, camY);
  ctx.save();
  ctx.scale(ECH, ECH);
  ctx.translate(DECAL_X + sec, -camY);
  const haut = camY - 80, bas = camY + VUE_H + 80;
  const visible = (y) => y > haut && y < bas;
  for (const v of etage.vents) if (v.bas > haut && v.haut < bas) dessinerVent(v);
  dessinerMurs(q, camY);
  for (const a of etage.aiguilles) if (visible(a.cy)) dessinerAiguille(a);
  for (const c of etage.contrepoids) if (c.y > haut - 300 && c.y < bas + 300) dessinerContrepoids(c);
  for (const r of etage.roues) if (visible(r.cy)) dessinerRoue(r);
  for (const p of etage.poutres) if (visible(p.y)) dessinerPoutre(p, q);
  for (const p of etage.planches) if (visible(p.y)) dessinerPlanche(p);
  for (const b of etage.balanciers) if (visible(b.py)) dessinerBalancier(b);
  for (const r of etage.ressorts) if (visible(r.y)) dessinerRessort(r);
  for (const l of etage.leviers) if (visible(l.y)) dessinerLevier(l);
  for (const l of etage.lanternes) if (visible(l.y)) dessinerLanterne(l);
  dessinerPorte(etage.porte, NIVEAUX[niv].final);
  for (const m of etage.automates) if (visible(m.y)) dessinerAutomate(m);
  for (const g of etage.rouages) if (!g.pris && visible(g.y)) dessinerRouage(g);
  if (etage.cloche && !etage.cloche.prise && visible(etage.cloche.y)) {
    const cl = etage.cloche;
    const rg = ctx.createRadialGradient(cl.x, cl.y, 2, cl.x, cl.y, 24);
    rg.addColorStop(0, 'rgba(230,240,255,.55)'); rg.addColorStop(1, 'rgba(230,240,255,0)');
    ctx.fillStyle = rg; ctx.fillRect(cl.x - 24, cl.y - 24, 48, 48);
    dessinerCloche(ctx, cl.x, cl.y + Math.sin(horloge * 2.5) * 2, 0.8);
  }
  if (tic) dessinerTic(ctx, tic.x, tic.y, tic.face, tic.pas, prog.tenue, prog.outil, !!tic.accroche, tic.invinc > 0);
  dessinerParticules();
  ctx.restore();
  // voile chaud du clocher
  if (q === 3) { ctx.fillStyle = 'rgba(255,200,120,.06)'; ctx.fillRect(0, 0, LW, LH); }
}
function dessinerParticules() {
  for (const p of particules) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.vie * 2));
    ctx.fillStyle = p.col;
    if (p.confetti) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-3, -5, 6, 10); ctx.restore(); }
    else if (p.etoile) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.vie * 4); ctx.fillRect(-p.t / 2, -0.8, p.t, 1.6); ctx.fillRect(-0.8, -p.t / 2, 1.6, p.t); ctx.restore(); }
    else { chemin(() => ctx.arc(p.x, p.y, p.t / 2, 0, 6.283)); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

// Écran titre : la tour, son cadran (sans chiffres), les roues et Tic
function dessinerTitre() {
  const t = horloge;
  const g = ctx.createLinearGradient(0, 0, 0, LH);
  g.addColorStop(0, '#f6b26b'); g.addColorStop(0.55, '#e88a7a'); g.addColorStop(1, '#5a3b5e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);
  ctx.save();
  // la scène (tour, cadran, roues, Tic) tient dans le haut de l'écran, au-dessus de la carte du titre
  const s = Math.min(LW / 420, (LH * 0.5) / 640);
  ctx.translate(LW / 2, 0); ctx.scale(s, s);
  const H = LH / s;
  const nMaisons = Math.ceil(LW / s / 2 / 46) + 1;
  // soleil
  const soleil = ctx.createRadialGradient(-120, 120, 10, -120, 120, 120);
  soleil.addColorStop(0, 'rgba(255,245,200,1)'); soleil.addColorStop(0.3, 'rgba(255,230,150,.8)'); soleil.addColorStop(1, 'rgba(255,230,150,0)');
  ctx.fillStyle = soleil; ctx.fillRect(-260, 0, 280, 260);
  // toits de la ville ancienne
  ctx.fillStyle = '#7a4a5e';
  const sol = 560; // pied des maisons (unités de la scène)
  for (let i = -nMaisons; i <= nMaisons; i++) {
    const x = i * 46 + ((i * 29) % 3) * 6, h = 90 + ((i * 37) % 7 + 7) % 7 * 22;
    ctx.fillRect(x - 20, sol - h, 40, h + H);

function dessinerTuto(dt) {

    else { tx = 236; ty = 120; mx = 200; }
    roueDentee(c, 270, 92, 9, tutoT * 1.5, 8, '#ffd34d', '#a8701a', 0.3);
  } else if (k === 'lanterne') {

    const l = { x: 150, y: 160, allumee: tx > 150 };
    dessinerAvec(c, () => dessinerLanterne(l));
    dessinerCloche(c, 260, 70 + Math.sin(tutoT * 3) * 3, 0.9);
    mx = -50;
  } else if (k === 'roue') {

    const r = { cx: 160, cy: 160, r: 40, angle: tutoT * 3.5, dir: 1, elan: false };
    dessinerAvec(c, () => { const m = sensRoues; sensRoues = 1; dessinerRoue(r); sensRoues = m; });
    poutre(250, 120, 60);

    else if (t < 1.3) { const u = (t - 0.8) / 0.5; tx = 80 + u * 60; ty = 160 - Math.sin(u * Math.PI) * 50 - u * 5; appui = t < 1 ? 1 : 0; }
    else if (t < 2.6) { tx = 140 + (t - 1.3) * 28; ty = 115; }
    else if (t < 3.2) { const u = (t - 2.6) / 0.6; tx = 176 + u * 100; ty = 115 - Math.sin(u * Math.PI) * 60 + u * 5; appui = t < 2.8 ? 1 : 0; }

    dessinerAvec(c, () => { const m = sensRoues; sensRoues = bas ? -1 : 1; dessinerRoue(r1); dessinerLevier({ x: 130, y: 160, bascule: 0 }); sensRoues = m; });

    tx = 165; ty = cp.y; mx = -50;

    dessinerAvec(c, () => dessinerAutomate(m));

    ty = 160 + saute(1.2, 0.9, 70);
    appui = t > 1.15 && t < 1.4 ? 1 : 0; mx = 160; my = 190;
  } else if (k === 'vent') {
    poutre(10, 160, 90); poutre(210, 120, 90);

    if (t < 2.2) { tx = 70; ty = 160; }
    else if (t < 3) { const u = (t - 2.2) / 0.8; tx = 70 + u * 170; ty = 160 - Math.sin(u * Math.PI) * 70 - u * 40; appui = u < 0.3 ? 1 : 0; }
    else { tx = 240; ty = 120; }
    mx = 160; my = 190;
  }

// Dessine avec les fonctions du jeu dans un autre contexte
function dessinerAvec(c, f) {

  ctx = c;
  try { f(); } finally { ctx = vrai; }

let suiteBilan = null;

  if (finPartie) return;

  mode = 'bilan';
  const pris = etage.rouages.filter((r) => r.pris).length;
  const reste = Math.ceil(tempsRestant);
  let etoiles = 1;
  if (pris === 3) etoiles++;
  if (tempsRestant >= etage.temps * 0.3) etoiles++;
  const cloche = !!(etage.cloche && etage.cloche.prise);
  const score = pris * 100 + reste * 10 + coeurs * 50 + (cloche ? 250 : 0);
  const avantE = totalEtoiles(), avantC = totalCloches();
  const ancien = prog.records[niv] || 0;
  const nouveauRecord = score > ancien;
  prog.etoiles[niv] = Math.max(prog.etoiles[niv] || 0, etoiles);
  if (nouveauRecord) prog.records[niv] = score;
  if (cloche) prog.cloches[niv] = true;
  for (let i = 0; i < NIVEAUX.length; i++) { if (prog.etoiles[i] === undefined) prog.etoiles[i] = 0; if (prog.records[i] === undefined) prog.records[i] = 0; if (prog.cloches[i] === undefined) prog.cloches[i] = false; }
  const suivant = Math.min(niv + 2, NIVEAUX.length);
  sauver(suivant, score);
  if (window.FMG) window.FMG.reportEnd({ completed: true, level: niv + 1 });
  if (tousGagnes()) { if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: MAX_ETOILES }); }
  // Débloqués
  const plus = [];
  TENUES.forEach((te, i) => { if (te.etoiles > avantE && te.etoiles <= totalEtoiles()) plus.push(traduire('deblocage.tenue', { nom: traduire('tenue.' + i) })); });
  OUTILS.forEach((o, i) => { if (o.cloches > avantC && o.cloches <= totalCloches()) plus.push(traduire('deblocage.outil', { nom: traduire('outil.' + i) })); });
  const final = !!NIVEAUX[niv].final;
  jouerSon(final ? 'midi' : 'victoire');
  confettis();
  afficherBilan({
    titre: traduire(final ? 'victoire.finTitre' : 'victoire.titre'),
    raison: traduire(final ? 'victoire.fin' : 'victoire.texte'),
    etoiles: etoiles, pris: pris, reste: reste, score: score, record: nouveauRecord ? -1 : ancien, cloche: cloche, plus: plus,
    gagne: true,
  });
}
function perdre(raison) {
  if (finPartie) return;
  finPartie = true;
  mode = 'bilan';
  const pris = etage.rouages.filter((r) => r.pris).length;
  if (window.FMG) window.FMG.reportEnd({ completed: false, level: niv + 1 });
  jouerSon('defaite');
  secousse = 0.3;
  afficherBilan({ titre: traduire('defaite.titre'), raison: traduire('defaite.' + raison), etoiles: 0, pris: pris, reste: 0, score: pris * 100, record: prog.records[niv] || 0, gagne: false, plus: [] });
}
function afficherBilan(b) {
  $('bilan-titre').textContent = b.titre;
  $('bilan-raison').textContent = b.raison;
  const ze = $('bilan-etoiles'); ze.innerHTML = '';
  ze.classList.toggle('cache', !b.gagne);
  for (let k = 0; k < 3; k++) {
    const e = document.createElement('span'); e.className = 'etoile' + (k < b.etoiles ? ' pleine' : '');
    ze.appendChild(e);
    setTimeout(() => { e.classList.add('vue'); if (k < b.etoiles) note(880 + k * 220, 0.2, 'triangle', 0.1); }, 300 + k * 350);
  }
  ze.setAttribute('aria-label', traduire('aria.etoiles', { n: b.etoiles }));
  $('bilan-rouages').textContent = traduire('bilan.rouages', { n: b.pris });
  $('bilan-temps').textContent = b.gagne ? traduire('bilan.temps', { n: nombre(b.reste) }) : '';
  // score qui défile
  const zs = $('bilan-score');
  let affiche = 0;
  const pas = Math.max(1, Math.ceil(b.score / 30));
  const defile = () => { affiche = Math.min(b.score, affiche + pas); zs.textContent = traduire('bilan.score', { n: nombre(affiche) }); if (affiche < b.score && mode === 'bilan') setTimeout(defile, 30); };
  defile();
  const zr = $('bilan-record');
  zr.className = '';
  if (b.gagne && b.record === -1) { zr.textContent = traduire('bilan.nouveauRecord'); zr.className = 'record'; }
  else zr.textContent = b.record ? traduire('bilan.record', { n: nombre(b.record) }) : '';
  const lignes = [];
  if (b.cloche) lignes.push(traduire('bilan.cloche'));
  for (const p of b.plus) lignes.push(p);
  $('bilan-plus').textContent = lignes.join(' · ');
  const bs = $('b-suivant');
  if (b.gagne) {
    if (niv < NIVEAUX.length - 1) { bs.textContent = traduire('bouton.suivant'); suiteBilan = () => demarrerEtage(niv + 1, true); }
    else { bs.textContent = traduire('bouton.accueil'); suiteBilan = allerTitre; }
  } else { bs.textContent = traduire('bouton.reessayer'); suiteBilan = () => demarrerEtage(niv, false); }
  $('b-rejouer').classList.toggle('cache', !b.gagne);
  $('hud').classList.add('cache');
  setTimeout(() => { if (mode === 'bilan') montrer('bilan'); }, b.gagne ? 650 : 450);
}

// ---------------------------------------------------------------------------
// Boutons
// ---------------------------------------------------------------------------
function lancerPartie() {
  jouerSon('clic');
  lireProgression();
  window.JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => { lireProgression(); demarrerEtage(borne(Math.floor(Number(d.niveau) || 1), 1, NIVEAUX.length) - 1, true); },
    onNouvelle: () => demarrerEtage(0, true),
    onEffacer: () => { prog = { etoiles: [], records: [], cloches: [], tenue: 0, outil: 0 }; demarrerEtage(0, true); },
  });
}
$('b-jouer').addEventListener('click', lancerPartie);
$('b-niveaux').addEventListener('click', ouvrirNiveaux);
$('b-atelier').addEventListener('click', ouvrirAtelier);
$('b-cloches').addEventListener('click', ouvrirCloches);
for (const id of ['b-niveaux-retour', 'b-atelier-retour', 'b-cloches-retour']) $(id).addEventListener('click', () => { jouerSon('clic'); allerTitre(); });
function basculerSon() {
  sonCoupe = !sonCoupe;
  if (!sonCoupe) { ctxAudio(); jouerSon('clic'); }
  majBoutonsSon(); sauverReglages();
}
for (const id of ['b-son', 'b-son-hud', 'b-son-pause']) $(id).addEventListener('click', basculerSon);
$('b-pause').addEventListener('click', mettrePause);
$('b-reprendre').addEventListener('click', reprendre);
$('b-recommencer').addEventListener('click', () => { jouerSon('clic'); demarrerEtage(niv, false); });
$('b-accueil').addEventListener('click', () => { jouerSon('clic'); allerTitre(); });
$('b-tuto').addEventListener('click', fermerTuto);
$('tuto').addEventListener('pointerdown', (e) => { if (e.target === $('tuto')) fermerTuto(); });
$('b-suivant').addEventListener('click', () => { jouerSon('clic'); if (suiteBilan) suiteBilan(); });
$('b-rejouer').addEventListener('click', () => { jouerSon('clic'); demarrerEtage(niv, false); });
$('b-bilan-niveaux').addEventListener('click', ouvrirNiveaux);
$('b-bilan-accueil').addEventListener('click', () => { jouerSon('clic'); allerTitre(); });

// Sauvegarde à la fermeture, seulement pendant une partie
JEL_SAVE.surFermeture(() => {
  if (etage && (mode === 'jeu' || mode === 'pause' || mode === 'tuto')) {
    sauver(niv + 1, prog.records[niv] || 0);
  }
});

// ---------------------------------------------------------------------------
// Boucle principale
// ---------------------------------------------------------------------------
let avant = performance.now();
function boucle(maintenant) {
  const dt = Math.min(0.033, Math.max(0, (maintenant - avant) / 1000));
  avant = maintenant;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (etage) {
    if (mode === 'jeu') mettreAJour(dt);
    else { majParticules(dt); if (mode === 'bilan') horloge += dt; }
    dessinerJeu();
  } else {
    horloge += dt;
    dessinerTitre();
  }
  if (mode === 'tuto') dessinerTuto(dt);
  requestAnimationFrame(boucle);
}
lireProgression();
majBoutonsSon();
window.JEL_I18N.surChangement(() => { majBoutonsSon(); majHud(); });
requestAnimationFrame(boucle);
</script>
