      const tSauv = temps; temps = 0; dessinerZone(c, z, t); temps = tSauv;
      crepe = u < 0.25 ? { x: 135, y: sol - 50 } : (u < 0.6 ? { x: 135, y: sol - 50 - (u - 0.25) / 0.35 * 150 } : sauter(135, sol - 200, 240, 30, -30, Math.min(1, (u - 0.6) / 0.25)));
      geste = u > 0.6 && u < 0.85 ? 'droite' : null;
      break;
    }
    case 'glace': {
      planBas(-10, 340); dessinerPlateforme(c, { type: 'glace', x: 40, y: sol - 24, w: 250 }, piece, t);
      const x = u < 0.3 ? glisse(60, 130, u / 0.3) : 130 + 140 * (1 - Math.pow(1 - Math.min(1, (u - 0.3) / 0.6), 3));
      crepe = { x, y: sol - 24 }; geste = u < 0.3 ? 'droite' : 'gauche';
      break;
    }
    case 'fragile': {
      planBas(-10, 80); planBas(250, 90);
      const tombe = u > 0.55;
      const fp = { type: 'frag', x: 120, y: tombe ? sol - 20 + (u - 0.55) * 500 : sol - 20, w: 80, etat: u > 0.3 ? (tombe ? 'tombe' : 'tremble') : 'ok' };
      dessinerPlateforme(c, fp, piece, t);
      crepe = u < 0.2 ? { x: glisse(30, 70, u / 0.2), y: sol } : (u < 0.3 ? sauter(70, sol, 150, sol - 20, 40, (u - 0.2) / 0.1) : (u < 0.45 ? { x: 150, y: sol - 20 } : sauter(150, sol - 20, 280, sol, 60, Math.min(1, (u - 0.45) / 0.25))));
      geste = (u > 0.18 && u < 0.24) || (u > 0.43 && u < 0.5) ? 'saut' : 'droite';
      break;
    }
    case 'pois': {
      planBas(-10, 340);
      const d = { type: 'pois', x: 260 - u * 220, y: sol, rot: -u * 30 };
      dessinerDanger(c, d, t);
      const k = (u - 0.32) / 0.3;
      crepe = { x: 140, y: k > 0 && k < 1 ? sol - Math.sin(k * Math.PI) * 70 : sol };
      geste = k > -0.08 && k < 0.15 ? 'saut' : null;
      break;
    }
    default: {
      planBas(-10, 340); dessinerPlateforme(c, { type: 'cas', x: 150, y: 90, w: 80 }, piece, t);
      crepe = sauter(60, sol, 190, 90, 60, Math.min(1, u * 1.4)); break;
    }
  }
  dessinerCrepe(c, crepe.x, crepe.y, Object.assign({ garniture: progres.garniture }, opts));
  dessinerBoutonsDemo(c, geste, t);
  c.setTransform(1, 0, 0, 1, 0, 0);
}
/* Petits boutons et main animée dans la scène de démonstration */
function dessinerBoutonsDemo(c, geste, t) {
  const bouton = (x, y, w, actif, dessin) => {
    c.fillStyle = actif ? '#ffd98a' : 'rgba(245,198,107,0.9)'; rectArrondi(c, x, y + (actif ? 2 : 0), w, 24, 8); c.fill();
    c.strokeStyle = '#6b3a17'; c.lineWidth = 3; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); dessin(x + w / 2, y + 12 + (actif ? 2 : 0)); c.stroke(); c.lineCap = 'butt';
  };
  bouton(8, 152, 30, geste === 'gauche', (x, y) => { c.moveTo(x + 4, y - 7); c.lineTo(x - 4, y); c.lineTo(x + 4, y + 7); });
  bouton(44, 152, 30, geste === 'droite', (x, y) => { c.moveTo(x - 4, y - 7); c.lineTo(x + 4, y); c.lineTo(x - 4, y + 7); });
  bouton(262, 152, 50, geste === 'saut', (x, y) => { c.moveTo(x - 8, y + 4); c.lineTo(x, y - 5); c.lineTo(x + 8, y + 4); });
  if (!geste) return;
  const cible = geste === 'gauche' ? [23, 164] : geste === 'droite' ? [59, 164] : [287, 164];
  const appui = Math.sin(t * 10) > 0 ? 3 : 0;
  c.save(); c.translate(cible[0] + 6, cible[1] + 4 + appui);
  c.fillStyle = '#ffe0c2'; c.strokeStyle = '#8a5a3a'; c.lineWidth = 1.6;
  c.beginPath(); rectArrondi(c, -4, -12, 8, 18, 4); c.fill(); c.stroke();
  c.beginPath(); rectArrondi(c, -6, 2, 20, 16, 6); c.fill(); c.stroke();
  c.restore();
}

/* ==========================================================================
   Barre du haut et bulles
   ========================================================================== */
function majHud() {
  const j = joueur;
  const coeurs = $('hud-coeurs'), pep = $('hud-pepites');
  const nC = j ? Math.max(0, j.coeurs) : 3, nP = j ? j.pepites : 0;
  coeurs.innerHTML = SVG_COEUR.repeat(3);
  coeurs.querySelectorAll('svg').forEach((s, k) => { if (k >= nC) s.classList.add('vide'); });
  coeurs.setAttribute('aria-label', tr('coeurs_aria', { n: nC }));
  pep.innerHTML = SVG_PEPITE.repeat(3);
  pep.querySelectorAll('svg').forEach((s, k) => { if (k < nP) s.classList.add('pleine'); });
  pep.setAttribute('aria-label', tr('pepites_aria', { n: nP }));
  $('hud-sucre').textContent = nb(j ? j.sucre : 0);
  $('hud-sucre-bloc').setAttribute('aria-label', tr('sucre_aria', { n: j ? j.sucre : 0 }));
  $('hud-niveau').textContent = monde ? tr('hudNiveau', { n: indexNiveau + 1, nom: tr('nom_' + (indexNiveau + 1)) }) : '';
}
let minuterieBulle = 0;
function bulle(texte) {
  const b = $('bulle');
  b.textContent = texte; b.classList.add('visible');
  clearTimeout(minuterieBulle);
  minuterieBulle = setTimeout(() => b.classList.remove('visible'), 1500);
}
function majBoutonsSon() {
  for (const id of ['btn-son', 'btn-son-titre', 'btn-son-pause']) {
    const b = $(id); b.innerHTML = sonActif ? SVG_SON : SVG_MUET;
    b.setAttribute('aria-label', tr(sonActif ? 'son_couper' : 'son_remettre'));
    b.setAttribute('aria-pressed', sonActif ? 'false' : 'true');
  }
}
function basculerSon() {
  sonActif = !sonActif;
  try { localStorage.setItem(CLE_SON, sonActif ? 'oui' : 'non'); } catch (e) { /* rien */ }
  majBoutonsSon();
  initAudio(); jouer('clic');
}

/* ==========================================================================
   Écrans
   ========================================================================== */
const ECRANS = ['ecran-titre', 'ecran-niveaux', 'ecran-garnitures', 'ecran-intro', 'ecran-pause', 'ecran-fin'];
function cacherEcrans() { ECRANS.forEach((id) => { $(id).hidden = true; }); }
function montrer(id) { cacherEcrans(); $(id).hidden = false; }
/* Barre du haut et commandes cachées sur les menus (titre, niveaux, garnitures) */
function modeMenu(oui) {
  if (document.body.classList.contains('menu') === oui) return;
  document.body.classList.toggle('menu', oui);
  redimensionner();
}
function focusPremier(id) { setTimeout(() => { const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus(); } catch (e) { /* rien */ } }, 30); }

function allerTitre() {
  partieEnCours = false; monde = null; joueur = null; intro = null;
  etat = 'titre'; montrer('ecran-titre'); modeMenu(true); majHud();
  setTimeout(() => { try { $('btn-jouer').focus(); } catch (e) { /* rien */ } }, 30);
}

function ouvrirNiveaux(depuis) {
  etat = 'niveaux'; modeMenu(true);
  ouvrirNiveaux.depuis = depuis;
  const liste = $('liste-niveaux');
  liste.innerHTML = '';
  $('niveaux-total').textContent = tr('etoilesTotal', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
  PIECES.forEach((piece, k) => {
    const titre = document.createElement('div');
    titre.className = 'piece-titre'; titre.textContent = tr('piece_' + piece);
    liste.appendChild(titre);
    const grille = document.createElement('div'); grille.className = 'grille-niveaux';
    for (let i = k * 5; i < k * 5 + 5 && i < NIVEAUX.length; i++) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn-niveau';
      if (niveauOuvert(i)) {
        b.innerHTML = `<span>${nb(i + 1)}</span><span class="etoiles-mini">${[0, 1, 2].map((s) => SVG_ETOILE(s < progres.etoiles[i] ? '#ffc93c' : '#e8d6b4')).join('')}</span>`;
        b.setAttribute('aria-label', tr('niveauBouton_aria', { n: i + 1, nom: tr('nom_' + (i + 1)), etoiles: progres.etoiles[i] }));
        b.addEventListener('click', () => { initAudio(); jouer('clic'); lancerNiveau(i); });
      } else {
        b.classList.add('ferme'); b.innerHTML = SVG_CADENAS;
        b.setAttribute('aria-label', tr('niveauFerme_aria', { n: i + 1 }));
        b.addEventListener('click', () => { initAudio(); jouer('aie'); });
      }
      grille.appendChild(b);
    }
    liste.appendChild(grille);
  });
  montrer('ecran-niveaux');
  focusPremier('ecran-niveaux');
}

function ouvrirGarnitures() {
  etat = 'garnitures'; modeMenu(true);
  const liste = $('liste-garn'); liste.innerHTML = '';
  $('garn-total').textContent = tr('etoilesTotal', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
  for (const g of GARNITURES) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn-garn';
    const dispo = garnitureDispo(g);
    if (!dispo) b.classList.add('ferme');
    if (progres.garniture === g.id) b.classList.add('choisie');
    const cv = document.createElement('canvas'); cv.width = 168; cv.height = 112;
    const c = cv.getContext('2d');
    c.setTransform(2, 0, 0, 2, 0, 0);
    if (dispo) dessinerCrepe(c, 42, 40, { garniture: g.id, sx: 1.4, sy: 1.4 });
    else { c.globalAlpha = 0.5; dessinerCrepe(c, 42, 40, { garniture: 'nature', sx: 1.4, sy: 1.4 }); c.globalAlpha = 1; c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#8d7a63'; c.fillRect(70, 48, 28, 24); c.strokeStyle = '#8d7a63'; c.lineWidth = 5; c.beginPath(); c.arc(84, 48, 9, Math.PI, 0); c.stroke(); }
    const nom = document.createElement('span'); nom.textContent = tr('garn_' + g.id);
    b.append(cv, nom);
    if (!dispo) { const s = document.createElement('small'); s.textContent = tr('garnFermee', { n: g.etoiles }); b.appendChild(s); }
    else if (progres.garniture === g.id) { const s = document.createElement('small'); s.textContent = tr('garnChoisie'); b.appendChild(s); }
    b.setAttribute('aria-pressed', progres.garniture === g.id ? 'true' : 'false');
    b.addEventListener('click', () => {
      initAudio();
      if (!dispo) { jouer('aie'); return; }
      progres.garniture = g.id; garderProgresLocal(); jouer('garniture'); ouvrirGarnitures();
    });
    liste.appendChild(b);
  }
  montrer('ecran-garnitures');
  focusPremier('ecran-garnitures');
}

function mettrePause() {
  if (etat !== 'jeu' && etat !== 'intro') return;
  etatAvantPause = etat;
  touches.gauche = touches.droite = touches.saut = false;
  etat = 'pause';
  $('ecran-pause').hidden = false;
  focusPremier('ecran-pause');
}
function reprendre() {
  if (etat !== 'pause') return;
  $('ecran-pause').hidden = true;
  etat = etatAvantPause;
  if (etat === 'intro' && !intro) etat = 'jeu';
}

/* ---------- Fin de niveau ---------- */
let finInfo = null;
function finNiveau(gagne) {
  if (etat === 'fin') return;
  const j = joueur;
  etat = 'fin';
  touches.gauche = touches.droite = touches.saut = false;
  const i = indexNiveau;
  let etoiles = 0, score = scoreNiveau;
  if (gagne) {
    etoiles = Math.max(1, j.pepites);
    const bonusTemps = Math.max(0, Math.round(300 - temps * 3));
    score = scoreNiveau + j.coeurs * 50 + bonusTemps;
  }
  const ancienRecord = progres.records[i];
  const record = gagne && score > ancienRecord;
  const avantTotal = totalEtoiles();
  if (gagne) {
    progres.etoiles[i] = Math.max(progres.etoiles[i], etoiles);
    progres.records[i] = Math.max(ancienRecord, score);
    progres.atteint = Math.max(progres.atteint, Math.min(NIVEAUX.length, i + 2));
    garderProgresLocal();
    try {
      JEL_SAVE.save(JEU, { niveau: Math.min(i + 2, NIVEAUX.length), score: totalScore(), etoiles: progres.etoiles, records: progres.records, garniture: progres.garniture, atteint: progres.atteint, options: { son: sonActif } });
    } catch (e) { /* rien */ }
  }
  const nouvelleGarn = GARNITURES.find((g) => g.etoiles > avantTotal && g.etoiles <= totalEtoiles());
  partieEnCours = gagne ? false : true;
  finInfo = { gagne, etoiles, score, record, ancienRecord, nouvelleGarn };
  setTimeout(() => afficherFin(), gagne ? 200 : 700);
  if (!gagne) jouer('defaite');
}
function totalScore() { return progres.records.reduce((a, b) => a + b, 0); }

function afficherFin() {
  const f = finInfo, i = indexNiveau;
  if (!f) return;
  const dernier = i === NIVEAUX.length - 1;
  $('fin-titre').textContent = f.gagne ? tr(dernier ? 'final_titre' : 'victoire_titre') : tr('defaite_titre');
  $('fin-texte').textContent = f.gagne ? (dernier ? tr('final_texte', { n: totalEtoiles(), max: NIVEAUX.length * 3 }) : tr('victoire_texte')) : tr('defaite_texte');
  const et = $('fin-etoiles'); et.innerHTML = [0, 1, 2].map(() => SVG_ETOILE()).join('');
  et.setAttribute('role', 'img'); et.setAttribute('aria-label', tr('etoiles_n', { n: f.etoiles }));
  et.hidden = !f.gagne;
  $('fin-pepites').textContent = tr('pepitesBilan', { n: joueur ? joueur.pepites : 0 });
  $('fin-record').className = f.record ? 'record' : '';
  $('fin-record').textContent = f.gagne ? (f.record ? tr('nouveauRecord', { n: f.score }) : tr('record', { n: progres.records[i] })) : (progres.records[i] ? tr('record', { n: progres.records[i] }) : '');
  const g = $('fin-garn');
  g.hidden = !f.nouvelleGarn;
  if (f.nouvelleGarn) g.textContent = tr('garnitureDebloquee', { nom: tr('garn_' + f.nouvelleGarn.id) });
  const principal = $('btn-fin-principal');
  if (f.gagne) principal.textContent = tr(dernier ? 'garnitures' : 'niveauSuivant');
  else principal.textContent = tr('reessayer');
  principal.dataset.action = f.gagne ? (dernier ? 'garnitures' : 'suivant') : 'reessayer';
  $('btn-fin-rejouer').hidden = !f.gagne;
  montrer('ecran-fin');
  // Le score défile, puis les étoiles s'allument une à une
  const cible = f.score; const debut = performance.now();
  const sc = $('fin-score');
  const defile = () => {
    if (etat !== 'fin') return;
    const k = Math.min(1, (performance.now() - debut) / 900);
    sc.textContent = tr('score', { n: Math.round(cible * k) });
    if (k < 1) requestAnimationFrame(defile);
  };
  defile();
  if (f.gagne) {
    et.querySelectorAll('svg').forEach((s, k) => {
      if (k < f.etoiles) setTimeout(() => { s.classList.add('allumee'); jouer('etoile', k); }, 350 + k * 380);
    });
    if (f.nouvelleGarn) setTimeout(() => jouer('garniture'), 350 + f.etoiles * 380 + 200);
  }
  focusPremier('ecran-fin');
}

/* ==========================================================================
   Commandes : doigt, souris, clavier
   ========================================================================== */
function brancherBouton(id, cle) {
  const b = $(id);
  const pointeurs = new Set();
  const maj = () => { touches[cle] = pointeurs.size > 0; b.classList.toggle('appuye', touches[cle]); };
  b.addEventListener('pointerdown', (e) => {
    e.preventDefault(); initAudio();
    pointeurs.add(e.pointerId); try { b.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
    if (cle === 'saut') sautDemande = true;
    maj();
  });
  const relache = (e) => { pointeurs.delete(e.pointerId); maj(); };
  b.addEventListener('pointerup', relache);
  b.addEventListener('pointercancel', relache);
  b.addEventListener('lostpointercapture', relache);
  b.addEventListener('contextmenu', (e) => e.preventDefault());
  b.addEventListener('click', (e) => e.preventDefault());
}
brancherBouton('btn-gauche', 'gauche');
brancherBouton('btn-droite', 'droite');
brancherBouton('btn-saut', 'saut');

// Taper sur la scène fait aussi sauter
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault(); initAudio();
  if (etat === 'jeu') { sautDemande = true; touches.saut = true; }
});
window.addEventListener('pointerup', () => { if (!$('btn-saut').classList.contains('appuye')) touches.saut = false; });

const TOUCHES = {
  ArrowLeft: 'gauche', KeyA: 'gauche', KeyQ: 'gauche',
  ArrowRight: 'droite', KeyD: 'droite',
  Space: 'saut', ArrowUp: 'saut', KeyW: 'saut', KeyZ: 'saut',
};
window.addEventListener('keydown', (e) => {
  initAudio();
  if (e.code === 'Escape' || e.code === 'KeyP') {
    e.preventDefault();
    if (etat === 'jeu' || etat === 'intro') mettrePause(); else if (etat === 'pause') reprendre();
    return;
  }
  if (etat === 'intro' && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); passerIntro(); return; }
  if (etat !== 'jeu') return;
  const cle = TOUCHES[e.code];
  if (!cle) return;
  e.preventDefault();
  if (cle === 'saut' && !e.repeat) sautDemande = true;
  touches[cle] = true;
});
window.addEventListener('keyup', (e) => {
  const cle = TOUCHES[e.code];
  if (cle) touches[cle] = false;
});
window.addEventListener('blur', () => { touches.gauche = touches.droite = touches.saut = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });

/* Boutons des écrans */
function clic(id, f) { $(id).addEventListener('click', () => { initAudio(); jouer('clic'); f(); }); }
clic('btn-jouer', () => {
  JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => { fusionnerProgres(d); lancerNiveau(Math.max(1, Math.min(NIVEAUX.length, d.niveau | 0)) - 1); },
    onNouvelle: () => lancerNiveau(0),
    onEffacer: () => {
      progres = { etoiles: new Array(NIVEAUX.length).fill(0), records: new Array(NIVEAUX.length).fill(0), garniture: 'nature', atteint: 1 };
      garderProgresLocal(); lancerNiveau(0);
    },
  });
});
clic('btn-niveaux-titre', () => ouvrirNiveaux('titre'));
clic('btn-garnitures', ouvrirGarnitures);
clic('btn-niveaux-retour', allerTitre);
clic('btn-garn-retour', allerTitre);
clic('btn-intro', passerIntro);
$('ecran-intro').addEventListener('click', (e) => { if (e.target === $('ecran-intro')) passerIntro(); });
demoCanvas.addEventListener('click', passerIntro);
clic('btn-pause', mettrePause);
clic('btn-reprendre', reprendre);
clic('btn-recommencer', () => lancerNiveau(indexNiveau, false));
clic('btn-pause-niveaux', () => { partieEnCours = false; ouvrirNiveaux('pause'); });
clic('btn-accueil', allerTitre);
$('btn-son').addEventListener('click', basculerSon);
$('btn-son-titre').addEventListener('click', basculerSon);
$('btn-son-pause').addEventListener('click', basculerSon);
clic('btn-fin-principal', () => {
  const a = $('btn-fin-principal').dataset.action;
  if (a === 'suivant') lancerNiveau(indexNiveau + 1);
  else if (a === 'garnitures') { partieEnCours = false; ouvrirGarnitures(); }
  else lancerNiveau(indexNiveau, false);
});
clic('btn-fin-rejouer', () => lancerNiveau(indexNiveau, false));
clic('btn-fin-niveaux', () => { partieEnCours = false; ouvrirNiveaux('fin'); });

/* Sauvegarde à la fermeture, seulement pendant une partie */
JEL_SAVE.surFermeture(() => {
  if (partieEnCours && monde) {
    JEL_SAVE.save(JEU, { niveau: indexNiveau + 1, score: totalScore(), etoiles: progres.etoiles, records: progres.records, garniture: progres.garniture, atteint: progres.atteint, options: { son: sonActif } });
  }
});

/* ==========================================================================
   Boucle principale
   ========================================================================== */
let avant = performance.now();
function boucle(maintenant) {
  let dt = Math.min(0.05, Math.max(0, (maintenant - avant) / 1000));
  avant = maintenant;
  if (etat !== 'pause') tempsGlobal += dt;
  if (etat === 'jeu' && monde) {
    const pas = 1 / 120;
    while (dt > 0) {
      const d = Math.min(pas, dt); dt -= d;
      majMonde(d); majJoueur(d);
      if (etat !== 'jeu') break;
    }
    secousse = Math.max(0, secousse - 1 / 60);
    placerCamera(false);
  }
  if (etat === 'fin' && monde && joueur) {
    majParticules(Math.min(0.05, 1 / 60));
    if (joueur.gagne > 0 && finInfo === null) majVictoire(1 / 60);
  } else if (etat !== 'pause') {
    majParticules(Math.min(0.05, 1 / 60));
  }
  dessinerJeu(tempsGlobal);
  if (etat === 'intro' || (etat === 'pause' && intro)) dessinerDemo(tempsGlobal - (intro ? intro.debut : 0));
  requestAnimationFrame(boucle);
}

/* ---------- Démarrage ---------- */
chargerProgres();
redimensionner();
window.addEventListener('resize', redimensionner);
majBoutonsSon();
majHud();
if (window.JEL_I18N && JEL_I18N.surChangement) JEL_I18N.surChangement(() => { majBoutonsSon(); majHud(); });
requestAnimationFrame(boucle);
</script>
