  /* ---------------- Tutoriel animé (carte du niveau) ---------------- */
  let demoDebut = 0;
  const demoCv = $('introDemo'), dc = demoCv.getContext('2d');
  const lerp = (a, b, u) => a + (b - a) * u;
  const doux = (u) => u * u * (3 - 2 * u);
  function main(c, x, y, appui) {
    c.save(); c.translate(x, y);
    c.fillStyle = '#ffe0c4'; c.strokeStyle = '#7a4a2a'; c.lineWidth = 2;
    c.beginPath(); c.ellipse(4, 18, 11, 13, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    c.beginPath(); rondRect(c, -3, -6 + (appui ? 3 : 0), 9, 24, 4); c.fill(); c.stroke();
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; c.beginPath(); c.arc(1, -8, 10, 0, Math.PI * 2); c.stroke(); }
    c.restore();
  }
  function dessinerDemo(t) {
    const c = dc, w = demoCv.width, h = demoCv.height;
    const cfg = G.cfg, co = COURTS[cfg.court];
    const n = TUTOS[cfg.tuto], tt = t - demoDebut, per = 2.6;
    const etape = Math.floor(tt / per) % n, u = (tt % per) / per;
    [...$('introEtapes').children].forEach((li, i) => li.classList.toggle('on', i === etape));
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = co.tour; c.fillRect(0, 0, w, h);
    c.fillStyle = co.sol; c.fillRect(50, 22, w - 100, h - 44);
    c.strokeStyle = '#fff'; c.lineWidth = 3; c.strokeRect(50, 22, w - 100, h - 44);
    c.beginPath(); c.moveTo(w / 2, 22); c.lineTo(w / 2, h - 22); c.stroke();
    const look = P.look, kidY = h / 2 + 10;
    const enfant = (x, y, bouge, objets, tient) => dEnfant(c, x, y, 14, look, 1, 0, t, bouge, objets, tient);
    const joueur = (x, y, coul, extra) => dJoueur(c, Object.assign({ i: 0, cote: 'bas', couleur: coul, swing: 0, joie: 0, refus: 0 }, extra || {}), x, y, 16, t);
    const anneau = (x, y, f) => {
      c.strokeStyle = 'rgba(255,255,255,.8)'; c.setLineDash([4, 3]); c.lineWidth = 2; c.beginPath(); c.arc(x, y, 18, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
      const r = 60 * (1 - f); c.strokeStyle = Math.abs(r - 18) < 7 ? '#6dff5a' : '#ffe14a'; c.lineWidth = 4; c.beginPath(); c.arc(x, y, Math.max(2, r), 0, Math.PI * 2); c.stroke();
    };
    const vol = (x0, y0, x1, y1, f, usee) => { if (f <= 0 || f >= 1) return; dBalle(c, lerp(x0, x1, f), lerp(y0, y1, f) - 40 * f * (1 - f) * 4, 7, usee); };
    const k = cfg.tuto;
    if (k === 'base' || k === 'finaleGazon' || k === 'finaleSalle' || k === 'rapide') {
      const e = k === 'base' ? etape : 2;
      if (e === 0) { const x = lerp(80, w - 110, doux(u)); enfant(x, kidY, u < 0.95); main(c, x + 26, kidY + 14, true); }
      else if (e === 1) { const x = lerp(70, w / 2, doux(Math.min(1, u * 1.5))); if (u < 0.66) dBalle(c, w / 2, kidY + 8, 7, false); else for (let i = 0; i < 6; i++) etoileDessin(c, w / 2 + Math.cos(i) * 20 * (u - 0.6) * 4, kidY + Math.sin(i) * 20 * (u - 0.6) * 4, 4, '#ffe66a'); enfant(x, kidY, u < 0.66); }
      else {
        const sx = w - 80, sy = h / 2, f = k === 'base' ? u : (u * 1.6) % 1;
        joueur(sx, sy, '#2f6fe0'); anneau(sx, sy, Math.min(f / 0.75, 1));
        enfant(80, kidY, false);
        if (f > 0.72 && f < 0.85) main(c, sx + 14, sy + 20, true);
        vol(80, kidY, sx, sy, (f - 0.75) / 0.2, false);
      }
    } else if (k === 'gene') {
      const bx = lerp(90, w - 90, (Math.sin(tt * 3) + 1) / 2);
      joueur(70, h / 2, '#e04f4f'); joueur(w - 70, h / 2, '#2f6fe0');
      dBalle(c, bx, h / 2 - 20 - Math.abs(Math.sin(tt * 3)) * 20, 6, false);
      if (etape === 0) { enfant(lerp(w / 2, w / 2, u), h - 30, false); c.strokeStyle = '#ff5a4a'; c.lineWidth = 5; c.beginPath(); c.moveTo(w / 2 - 14, 30); c.lineTo(w / 2 + 14, 58); c.moveTo(w / 2 + 14, 30); c.lineTo(w / 2 - 14, 58); c.stroke(); }
      else { const y = lerp(h - 44, h - 8, doux(u)); enfant(w / 2, y, u < 0.9); }
    } else if (k === 'lignes' || k === 'flaques' || k === 'gazon') {
      if (k === 'gazon' && etape === 0) {
        const bx = lerp(80, w - 70, doux(u)); dBalle(c, bx, h / 2, 7, false);
        enfant(lerp(60, w - 110, doux(Math.max(0, u - 0.15))), h / 2 + 6, true);
      } else {
        const typ = k === 'flaques' ? 'flaque' : k === 'gazon' ? 'motte' : 'balai';
        const tx = w / 2, ty = 22, f = clamp((u - 0.35) / 0.5, 0, 1);
        if (f < 1) {
          c.fillStyle = typ === 'flaque' ? 'rgba(150,200,255,.85)' : typ === 'motte' ? '#7a4a24' : 'rgba(150,60,25,.95)';
          c.beginPath(); c.ellipse(tx, ty, 18 * (1 - f * 0.5), 10, 0, 0, Math.PI * 2); c.fill();
        } else for (let i = 0; i < 6; i++) etoileDessin(c, tx + Math.cos(i) * 22, ty + 10 + Math.sin(i) * 12, 4, '#fff');
        c.strokeStyle = '#b6ff8a'; c.lineWidth = 4; c.beginPath(); c.arc(tx, ty, 22, -Math.PI / 2, -Math.PI / 2 + f * Math.PI * 2); c.stroke();
        enfant(lerp(70, tx, doux(Math.min(1, u * 3))), lerp(h - 40, ty + 14, doux(Math.min(1, u * 3))), u < 0.33);
      }
    } else if (k === 'faute') {
      const sx = w - 70, sy = h / 2;
      joueur(sx, sy, '#2f6fe0');
      if (etape === 0) { vol(sx, sy, w / 2, sy + 10, u * 1.4, false); if (u > 0.72) dBalle(c, w / 2 + 6, sy + 12, 7, false); enfant(80, kidY, false); }
      else { dBalle(c, w / 2 + 6, sy + 12, 7, false); anneau(sx, sy, Math.min(u / 0.75, 1)); enfant(80, kidY, false); vol(80, kidY, sx, sy, (u - 0.75) / 0.2, false); if (u > 0.72 && u < 0.85) main(c, sx + 14, sy + 20, true); }
    } else if (k === 'serviettes' || k === 'gourdes' || k === 'raquette') {
      const obj = k === 'gourdes' ? 'gourde' : k === 'raquette' ? 'raquette' : 'serviette';
      const boiteX = 70, jx = w - 70;
      c.fillStyle = '#7a5332'; rondRect(c, boiteX - 20, h / 2 + 14, 40, 26, 6); c.fill(); dObjet(c, obj, boiteX, h / 2 + 22, 10);
      joueur(jx, h / 2, '#2f6fe0', { joie: etape === n - 1 && u > 0.7 ? 1 : 0 });
      if (k === 'gourdes') { joueur(jx - 70, h / 2, '#e04f4f'); bulle(c, jx - 70, h / 2 - 40, 15, (x, y) => dObjet(c, 'serviette', x, y, 8)); }
      if (!(etape === n - 1 && u > 0.7)) bulle(c, jx, h / 2 - 40, 15, (x, y) => dObjet(c, k === 'raquette' ? 'cassee' : obj, x, y, 8));
      let x, porte = false;
      if (etape === 0) { x = lerp(w / 2, boiteX, doux(u)); porte = u > 0.85; }
      else { x = lerp(boiteX, jx - 30, doux(u)); porte = u < 0.7; }
      enfant(x, h / 2 + 4, true, porte ? [obj] : null);
    } else if (k === 'pluie') {
      c.fillStyle = '#2c7a4b'; c.fillRect(40, 22, 10, h - 44);
      let bx = 50;
      if (etape === 0) enfant(lerp(w / 2, 46, doux(u)), h / 2, true);
      else if (etape === 1) { bx = lerp(50, w - 50, doux(u)); c.fillStyle = 'rgba(40,130,80,.85)'; c.fillRect(45, 22, bx - 45, h - 44); enfant(bx, h / 2, true, null, true); }
      else { bx = w - 50; c.fillStyle = 'rgba(40,130,80,.85)'; c.fillRect(45, 22, bx - 45, h - 44); enfant(w - 30, h / 2, false); for (let i = 0; i < 5; i++) etoileDessin(c, w / 2 + i * 20 - 40, 40 + Math.sin(tt * 5 + i) * 6, 5, '#fff'); }
      c.strokeStyle = 'rgba(200,225,255,.8)'; c.lineWidth = 1.5; c.beginPath();
      for (let i = 0; i < 40; i++) { const x = (i * 47 + tt * 40) % w, y = (i * 23 + tt * 300) % h; c.moveTo(x, y); c.lineTo(x - 3, y + 10); }
      c.stroke();
    } else if (k === 'public') {
      if (etape === 0) { vol(w + 10, 0, w / 2, h / 2 + 6, u * 1.3, false); if (u > 0.77) dBalle(c, w / 2, h / 2 + 6, 7, false); enfant(70, h / 2, false); }
      else { if (u < 0.6) dBalle(c, w / 2, h / 2 + 6, 7, false); enfant(lerp(70, w / 2, doux(Math.min(1, u * 1.7))), h / 2, u < 0.6); }
    } else if (k === 'usees') {
      const bacX = w - 60;
      c.fillStyle = '#5b6470'; rondRect(c, bacX - 22, h / 2 - 14, 44, 30, 6); c.fill();
      if (etape === 0) { dBalle(c, w / 2 - 30, h / 2, 9, false); dBalle(c, w / 2 + 30, h / 2, 9, true); c.strokeStyle = '#ff9a7a'; c.lineWidth = 3; c.beginPath(); c.arc(w / 2 + 30, h / 2, 16 + Math.sin(tt * 6) * 2, 0, Math.PI * 2); c.stroke(); enfant(60, h / 2, false); }
      else if (etape === 1) { enfant(lerp(60, bacX, doux(u)), h / 2 + 4, true); dBalle(c, lerp(60, bacX, doux(u)), h / 2 - 22, 7, true); }
      else { const sx = w / 2; joueur(sx, h / 2, '#2f6fe0', { refus: u > 0.5 ? 1 : 0 }); enfant(70, kidY, false); vol(70, kidY, sx, h / 2, u * 2, true); }
    } else if (k === 'double') {
      const sx = w - 80, sy = h / 2; joueur(sx, sy, '#2f6fe0');
      bulle(c, sx + 26, sy - 34, 18, (x, y) => { dBalle(c, x - 7, y, 6, false); if (etape === 0) dBalle(c, x + 7, y, 6, false); });
      anneau(sx, sy, Math.min(u / 0.75, 1)); enfant(80, kidY, false); vol(80, kidY, sx, sy, (u - 0.75) / 0.2, false);
    } else if (k === 'oiseau') {
      const ox = w / 2, oy = h / 2 - (etape === 1 ? u * 70 : 0);
      c.fillStyle = '#8a5a3a'; c.beginPath(); c.ellipse(ox, oy, 10, 7, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#c9a07a'; c.beginPath(); c.arc(ox, oy - 8, 6, 0, Math.PI * 2); c.fill();
      if (etape === 1) { const a = Math.sin(tt * 30) * 8; c.fillStyle = '#6b4329'; c.beginPath(); c.ellipse(ox - 10, oy - a * 0.3, 10, 4 + Math.abs(a) * 0.3, -0.4, 0, Math.PI * 2); c.ellipse(ox + 10, oy - a * 0.3, 10, 4 + Math.abs(a) * 0.3, 0.4, 0, Math.PI * 2); c.fill(); }
      enfant(etape === 0 ? lerp(60, ox - 40, doux(u)) : ox - 40, h / 2 + 6, etape === 0);
    } else if (k === 'rebonds') {
      if (etape === 0) { const x = lerp(70, w - 70, u), y = h / 2 + Math.sin(u * Math.PI * 4) * 35 - Math.abs(Math.sin(u * Math.PI * 6)) * 12; dBalle(c, x, y, 7, false); enfant(60, h - 36, false); }
      else { dBalle(c, w - 80, 40, 7, false); dBalle(c, w / 2, h - 34, 7, false); enfant(lerp(60, w / 2 - 10, doux(u)), h - 40, true); }
    } else if (k === 'crepuscule' || k === 'nuit') {
      joueur(70, h / 2, '#e04f4f'); joueur(w - 70, h / 2, '#2f6fe0');
      const sp = k === 'nuit' ? 8 : 5.5, f = (Math.sin(tt * sp) + 1) / 2;
      dBalle(c, lerp(90, w - 90, f), h / 2 - 16 - Math.abs(Math.cos(tt * sp)) * 18, 6, false);
      enfant(w / 2, h - 12, false);
      c.fillStyle = 'rgba(8,12,40,' + (k === 'nuit' ? 0.5 : 0.28) + ')'; c.fillRect(0, 0, w, h);
      for (const [lx, ly] of [[8, 8], [w - 8, 8], [8, h - 8], [w - 8, h - 8]]) { c.fillStyle = '#fffbe0'; c.beginPath(); c.arc(lx, ly, 5, 0, Math.PI * 2); c.fill(); }
    }
  }

  /* ---------------- Commandes ---------------- */
  function versMonde(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left - OX) / S, y: (e.clientY - r.top - OY) / S };
  }
  let glisse = false;
  cv.addEventListener('pointerdown', (e) => {
    Son.init();
    if (ecran !== 'jeu' || !G) return;
    e.preventDefault();
    const m = versMonde(e);
    const sv = serveur();
    if (G.phase === 'attente' && dist(m.x, m.y, sv.x, sv.y) < 0.2 && sv.recu + volsVers(sv) < sv.demande) { lancer(); return; }
    glisse = true;
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* rien */ }
    G.cible = { x: clamp(m.x, -MX + 0.05, 1 + MX - 0.05), y: clamp(m.y, -MY + 0.05, L + MY - 0.05) };
  });
  cv.addEventListener('pointermove', (e) => {
    if (!glisse || ecran !== 'jeu' || !G) return;
    const m = versMonde(e);
    G.cible = { x: clamp(m.x, -MX + 0.05, 1 + MX - 0.05), y: clamp(m.y, -MY + 0.05, L + MY - 0.05) };
  });
  const finGlisse = () => { glisse = false; };
  cv.addEventListener('pointerup', finGlisse);
  cv.addEventListener('pointercancel', finGlisse);
  $('btnLancer').addEventListener('pointerdown', (e) => { e.preventDefault(); Son.init(); lancer(); });

  const CODES = { ArrowUp: 'h', KeyW: 'h', ArrowDown: 'b', KeyS: 'b', ArrowLeft: 'g', KeyA: 'g', ArrowRight: 'd', KeyD: 'd' };
  window.addEventListener('keydown', (e) => {
    Son.init();
    const surBouton = e.target && e.target.tagName === 'BUTTON';
    if (ecran === 'jeu') {
      if (CODES[e.code]) { touches[CODES[e.code]] = true; e.preventDefault(); return; }
      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') { e.preventDefault(); if (!e.repeat) lancer(); return; }
      if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); pause(); return; }
    } else if (ecran === 'pause') {
      if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); reprendre(); }
    } else if (ecran === 'intro') {
      if ((e.code === 'Space' || e.code === 'Enter') && !surBouton) { e.preventDefault(); partir(); }
    }
  });
  window.addEventListener('keyup', (e) => { if (CODES[e.code]) touches[CODES[e.code]] = false; });
  window.addEventListener('blur', () => { for (const k in touches) touches[k] = false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (ecran === 'jeu') pause(); Son.pluieFin(); } });

  const clic = (id, fn) => $(id).addEventListener('click', () => { Son.init(); Son.clic(); fn(); });
  clic('btnJouer', () => {
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { chargerProg(); demarrer(clamp((d && d.niveau) | 0, 1, NIVEAUX.length) - 1); },
      onNouvelle: () => demarrer(0),
      onEffacer: () => { P = progDefaut(); demarrer(0); },
    });
  });
  clic('btnNiveaux', afficherNiveaux);
  clic('btnVestiaire', afficherVestiaire);
  clic('btnNiveauxRetour', allerTitreSansDemo);
  clic('btnVestRetour', allerTitreSansDemo);
  clic('btnPartir', partir);
  $('carteIntro').addEventListener('click', (e) => { if (e.target === $('btnPartir')) return; partir(); });
  clic('btnPause', pause);
  clic('btnReprendre', reprendre);
  clic('btnRecommencer', () => demarrer(G.n));
  clic('btnAccueil', allerTitre);
  clic('btnBilanVest', afficherVestiaire);
  clic('btnBilanNiveaux', afficherNiveaux);
  clic('btnBilanAccueil', allerTitre);
  for (const id of ['btnSon', 'btnSonTitre', 'btnSonPause']) $(id).addEventListener('click', basculerSon);
  function allerTitreSansDemo() {
    if (!G || !G.demo) { allerTitre(); return; }
    montrer('titre');
  }

  // Sauvegarde à la fermeture, seulement pendant une partie
  window.JEL_SAVE.surFermeture(() => { if (enCours && G && !G.demo) ecrireProg(G.n + 1); });

  // Mode test (?debug=1 dans le lanceur) : pilote automatique pour vérifier les niveaux
  if (window.JEL_DEBUG) {
    window.__coulisses = {
      demarrer(n) { demarrer(n); partir(); G.auto = true; },
      avance(sec) {
        for (let i = 0; i < sec * 60 && ecran === 'jeu'; i++) maj(1 / 60);
        return { ecran, points: G.points, jauge: Math.round(G.jauge), sans: G.sansAttente, total: G.cfg.points, gene: G.gene, rates: G.rates };
      },
    };
  }

  /* ---------------- Démarrage ---------------- */
  chargerProg();
  majBoutonsSon();
  nouveauMatch(0, true);
  requestAnimationFrame(boucle);
})();
</script>
