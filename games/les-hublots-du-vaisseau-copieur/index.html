          const ajout = (svg, n) => { const sp = document.createElement('span'); sp.style.display = 'inline-flex'; sp.style.alignItems = 'center'; sp.innerHTML = svg; if (n > 1) sp.appendChild(document.createTextNode(String(nb(n)))); jet.appendChild(sp); };
          if (e.ox[s] > 0) ajout(ICONE_OXY, e.ox[s]);
          if (e.sa[s] > 0) ajout(ICONE_SAS, e.sa[s]);
          if (e.bl[s] > 0) ajout(ICONE_BLOQUE, 1);
        }
      }
      d.setAttribute('aria-label', tr('place.aria.' + role, { equipe: tr('equipe.' + s), points: pts }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : '') + (e && e.bl[s] > 0 ? ' · ' + tr('place.bloque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) {
      if (ciblage) return tr('sas.choisir');
      if (e.rev.length) return e.res === 'copie' ? tr('tour.copie') : tr('tour.fermer');
      if (e.pick >= 0) return tr('tour.toi2');
      return rejoue ? tr('tour.rejoue') : tr('tour.toi');
    }
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.' + s);
  }

  function nomSecteur(e, q) {
    const noms = e.ns === 2 ? ['avant', 'arriere'] : ['avant', 'centre', 'arriere'];
    return tr('secteur.' + (noms[q] || 'centre'));
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
    const lp = vue && vue.ns > 1 && vue.pe > 0 && partie && partie.phase === 'jeu' ? tr('panne.info', { secteur: nomSecteur(vue, vue.ps), n: vue.pn }) : '';
    if ($('ligne-panne').textContent !== lp) $('ligne-panne').textContent = lp;
    const bs = $('btn-sas');
    const voir = peutSceller();
    bs.hidden = !voir;
    bs.classList.toggle('actif', ciblage && voir);
    $('aide').style.display = voir ? 'none' : '';
  }

  function majInterface() {
    majPlaces();
    majInfos();
    programmerFermeture();
  }

  // Après une paire ratée ou un copieur, les hublots restent ouverts un instant,
  // puis se referment tout seuls (ou dès qu'on touche la grille).
  function programmerFermeture() {
    if (minuteurFermer || !partie || !vue || !vue.rev.length || !partie.monTour()) return;
    const j = jeton;
    minuteurFermer = setTimeout(() => {
      minuteurFermer = 0;
      if (j !== jeton || enPause) return;
      if (partie && vue && vue.rev.length && partie.monTour()) partie.jouer('f');
    }, vue.res === 'copie' ? 2200 : 1600);
  }
  function annulerFermeture() { clearTimeout(minuteurFermer); minuteurFermer = 0; }

  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    programmerFermeture();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    geo = geometrie(vue, w, h);
    const jouable = !!(partie && partie.monTour() && !vue.rev.length && !ciblage);
    dessinerPlateau(c, vue, geo, { t: t, anims: anims, survol: survol, curseur: clavier ? curseur : -1, cible: jouable });
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }

  function surAction(ev) {

  function surSieges() {

      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;

      if (j !== jeton || !partie) return;

    }, 900);
  }

  function gagnant(e, moi) { return moi >= 0 && R.fin(e) && e.sc[moi] === Math.max.apply(null, e.sc); }

  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(erreurs, paires, gagne) {
    if (!gagne) return 0;
    if (erreurs <= Math.ceil(paires / 2)) return 3;
    if (erreurs <= paires) return 2;
    return 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      if (e.sc[s] !== prec) { rang = k + 1; prec = e.sc[s]; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; casque(cv.getContext('2d'), s, 30, 33, 25);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      // Le casque donne la couleur de l'équipe : « Toi », le pseudo du joueur, ou l'équipe du robot.
      const nom = document.createElement('span'); nom.textContent = role === 'robot' ? tr('equipe.' + s) : nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.sauvesCourt', { n: e.sc[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {

    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function vaisseauxDebloques() { return VAISSEAUX.filter((v) => totalEtoiles() >= v.seuil).length; }

    const pts = moi >= 0 ? e.sc[moi] : 0;

    const boutons = $('fin-boutons');
    boutons.textContent = '';

    const paires = NIVEAUX[e.n] ? NIVEAUX[e.n].p : 0;
    $('fin-points').textContent = moi >= 0 ? tr('fin.sauves', { n: pts, total: paires }) : '';
    $('fin-erreurs').textContent = moi >= 0 ? tr('fin.erreurs', { n: e.er[moi] }) : '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(e.er[moi], paires, gagne);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      const messages = [];
      if (gagne) {
        const avantV = vaisseauxDebloques();
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; messages.push(tr('fin.debloque', { n: niveau + 1 })); }
        if (niveau === NIVEAUX.length) { messages.push(tr('fin.dernier')); if (ouvrirFiche('coeur')) messages.push(tr('fin.fiche')); }
        if (vaisseauxDebloques() > avantV) messages.push(tr('fin.vaisseau', { nom: tr('vaisseau.' + VAISSEAUX[vaisseauxDebloques() - 1].cle) }));
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {

        }
      }

      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';

        zone.appendChild(sp);

      zone.style.display = '';

      $('fin-debloque').textContent = messages.join(' ');
      $('fin-compte').textContent = gagne ? '' : tr('fin.conseil');
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();

  }

  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));

    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux, hangar, dossier
  // ---------------------------------------------------------------------

  let attenteTuto = false;

  function quitterPartie() {
    jeton++;
    annulerFermeture();

    partie = null;

    fermerVoile('voile-pause');

  // Aperçu d'un niveau (grille fermée) le temps du tutoriel.
  function apercu(n) {
    const e = O.preparer(NIVEAUX[n - 1], window.JEL_MULTI.hasard(n * 7919), PLACES);
    e.n = n - 1;
    return e;
  }

  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    annulerFermeture();
    enPartie = true;
    enPause = false;
    ciblage = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = apercu(niveau);
    anims = nouvellesAnims();
    particules.length = 0;

    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => {
        if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto);
        if (ouvrirFiche(TUTO_FICHE[tuto])) toast(tr('fiche.nouvelle'));
        attenteTuto = false;
        lancerNiveau();
      });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }

  function dessinerFiche(c, cle, w) {

    else if (cle === 'panne') { hublot(c, x, x, r, { ouv: 0, t: 0 }); c.fillStyle = 'rgba(0,0,0,.55)'; rond(c, x, x, r); c.fill(); c.fillStyle = '#ff3c46'; c.beginPath(); c.moveTo(x + r * 0.1, x - r * 0.6); c.lineTo(x - r * 0.3, x + r * 0.05); c.lineTo(x, x + r * 0.05); c.lineTo(x - r * 0.12, x + r * 0.6); c.lineTo(x + r * 0.32, x - r * 0.1); c.lineTo(x + r * 0.02, x - r * 0.1); c.closePath(); c.fill(); }

    else if (cle === 'oxygene') hublot(c, x, x, r, { ouv: 1, contenu: { t: 'o' }, t: 0 });
    else if (cle === 'sas') hublot(c, x, x, r, { ouv: 1, contenu: { t: 's' }, t: 0 });

      c.fillStyle = '#d8ff3a'; ell(c, x, x, r * 0.16, r * 0.07); c.fill();
      c.fillStyle = '#101400'; ell(c, x, x, r * 0.03, r * 0.065); c.fill();
    }
  }

  function jouerScene(c, sc, t) {
    const p = t % sc.boucle;
    coque(c, 560, 360, 21);
    const passees = sc.etapes.filter((st) => st.at <= p);
    const pos = (i) => [sc.cases[i][0], sc.cases[i][1]];
    // lampes de panne
    if (sc.lampes) {
      const eteintes = Math.min(3, Math.floor(p / 650));
      for (let k = 0; k < 3; k++) {
        c.fillStyle = '#0a0d10'; rond(c, 60, 210 + k * 26, 8); c.fill();
        c.fillStyle = k >= eteintes ? 'rgba(255,60,70,' + (eteintes === 2 ? 0.5 + 0.5 * Math.sin(t / 110) : 1).toFixed(2) + ')' : '#2b3138';
        rond(c, 60, 210 + k * 26, 5.5); c.fill();
      }
    }
    sc.cases.forEach((ca, i) => {
      let tOuv = -1, tFer = -1, lueur = null, coche = false, tm, ejecte = false, k = ca[2];
      passees.forEach((st) => {
        if (st.ouvre && st.ouvre.indexOf(i) >= 0) { tOuv = st.at; tFer = -1; }
        if (st.ferme && st.ferme.indexOf(i) >= 0) { tFer = st.at; }
        if (st.lueur && st.lueur.indexOf(i) >= 0 && tFer < 0) lueur = st.coul;
        if (st.coche && st.coche.indexOf(i) >= 0) coche = true;
        if (st.monstre === i) tm = st.at;
        if (st.ejecte === i) ejecte = st.at;
        if (st.noir && sc.ensuite && sc.ensuite[i] && p > st.at + 600) k = sc.ensuite[i];
      });
      let [x, y] = pos(i);
      const sw = passees.find((st) => st.echange && st.echange.indexOf(i) >= 0);
      if (sw) {
        const q = facile(Math.min(1, (p - sw.at) / 900));
        const autre = sw.echange[0] === i ? sw.echange[1] : sw.echange[0];
        const [x2, y2] = pos(autre);
        x = x + (x2 - x) * q; y = y + (y2 - y) * q - Math.sin(q * Math.PI) * 70 * (sw.echange[0] === i ? 1 : -1);
      }
      const nr = passees.find((st) => st.noir && st.noir.indexOf(i) >= 0 && p < st.at + 1400);
      if (nr) { x += (Math.random() - 0.5) * 8; y += (Math.random() - 0.5) * 8; }
      const o = { t: t, ouv: 0, contenu: k };
      if (tOuv >= 0 && tFer < 0) o.ouv = facile((p - tOuv) / 260);
      else if (tFer >= 0) o.ouv = Math.max(0, 1 - (p - tFer) / 260);
      if (tm !== undefined) o.morph = Math.max(0, Math.min(1, (p - tm) / 350));
      if (lueur) o.lueur = lueur;
      if (coche && tFer < 0) { o.coche = true; o.bord = COUL[0]; }
      if (ejecte !== false && o.ouv <= 0) o.vide = k.t === 'o' ? 'vide' : 'ejecte';
      hublot(c, x, y, sc.r, o);
      if (sw && p - sw.at < 900) { c.strokeStyle = 'rgba(216,255,58,.8)'; c.lineWidth = 3; rond(c, x, y, sc.r * 1.08); c.stroke(); }
    });
    // panne : noir sur la rangée du bas
    const noir = passees.find((st) => st.noir && p < st.at + 1400);
    if (noir) {
      c.fillStyle = 'rgba(2,3,6,' + (Math.random() < 0.15 ? 0.5 : 0.9) + ')'; c.fillRect(90, 190, 470, 120);
      c.fillStyle = 'rgba(255,40,60,.35)'; c.fillRect(90, 190, 470, 4);
    }
    // casque du joueur, et l'oxygène qui y vole
    if (sc.casques) {
      casque(c, 0, 280, 80, 36);
      const vol = passees.find((st) => st.vol !== undefined);
      if (vol) {
        const q = facile(Math.min(1, (p - vol.at) / 700));
        const [x0, y0] = pos(vol.vol);
        const bx = x0 + (330 - x0) * q, by = y0 + (60 - y0) * q, br = 40 - 24 * q;
        c.save(); rond(c, bx, by, br); c.clip(); bouteille(c, bx, by, br); c.restore();
      }
      if (passees.find((st) => st.rejoue)) {
        c.strokeStyle = '#5fd0ff'; c.lineWidth = 5; c.beginPath(); c.arc(280, 80, 50, -Math.PI * 0.2 + p / 300, Math.PI * 1.3 + p / 300); c.stroke();
      }
    }

    if (sc.sas) {
      casque(c, 0, 150, 110, 40);
      casque(c, 1, 410, 110, 40);
      const appuiBouton = p > 800;
      c.fillStyle = appuiBouton ? '#ffe9a8' : '#ffd166'; rr(c, 200, 240, 160, 60, 14); c.fill();
      c.save(); c.translate(240, 270); c.scale(1.4, 1.4); c.fillStyle = '#2b1300'; rr(c, -10, -10, 20, 20, 4); c.fill(); c.fillStyle = '#ffd166'; c.fillRect(-7, -8, 6, 16); c.fillRect(1, -8, 6, 16); c.restore();
      c.fillStyle = '#2b1300'; c.fillRect(270, 262, 70, 16);
      if (appuiBouton && p < 1600) { c.strokeStyle = '#ffd166'; c.lineWidth = 4; rond(c, 410, 110, 54 + 4 * Math.sin(p / 100)); c.stroke(); }
      if (p > 1600) {
        const q = facile(Math.min(1, (p - 1600) / 500));
        c.save(); rond(c, 410, 110, 50); c.clip();
        c.fillStyle = '#ffd166'; c.fillRect(360, 60, 50 * q, 100); c.fillRect(460 - 50 * q, 60, 50 * q, 100);
        c.fillStyle = '#2b1300'; c.fillRect(408, 60, 4 * q, 100);
        c.restore();
        if (q >= 1) { c.save(); c.translate(410, 110); c.scale(2, 2); c.fillStyle = '#c0262d'; rr(c, -8, -2, 16, 13, 3); c.fill(); c.strokeStyle = '#c0262d'; c.lineWidth = 3; c.beginPath(); c.arc(0, -3, 5, Math.PI, 0); c.stroke(); c.restore(); }
      }
    }
    // la main
    const mains = sc.etapes.filter((st) => st.main !== undefined);
    if (mains.length) {
      let a = null, b = null;
      for (const st of mains) { if (st.at <= p) a = st; else if (!b) b = st; }
      if (!a) a = mains[0];
      const xy = (st) => (Array.isArray(st.main) ? st.main : [pos(st.main)[0] + 4, pos(st.main)[1] + 8]);
      let [x, y] = xy(a);
      if (b) {
        const debutMouv = b.at - 600;
        if (p > debutMouv) { const q = facile((p - debutMouv) / 600); const [x2, y2] = xy(b); x += (x2 - x) * q; y += (y2 - y) * q; }
      }
      const appui = a.appui && p - a.at < 300 ? 1 - (p - a.at) / 300 : 0;
      main(c, x, y, 1.5, appui);
    }
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function caseJouable(i) {
    return !!(vue && i >= 0 && i < vue.o.length && vue.o[i] === -1 && visibles(vue).indexOf(i) < 0);
  }

  function caseSous(px, py) {
    if (!vue || !geo) return -1;
    const col = Math.floor((px - geo.ox) / geo.s), row = Math.floor((py - geo.oy) / geo.s);
    if (col < 0 || col >= vue.W || row < 0 || row >= vue.H) return -1;
    return row * vue.W + col;
  }

  function plusProche(depuis) {
    if (!vue) return -1;
    const W = vue.W;
    const m = depuis >= 0 ? [depuis % W, Math.floor(depuis / W)] : [(W - 1) / 2, (vue.H - 1) / 2];
    let best = -1, bd = Infinity;
    for (let i = 0; i < vue.o.length; i++) {
      if (!caseJouable(i)) continue;
      const d = Math.hypot(i % W - m[0], Math.floor(i / W) - m[1]);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  function deplacerCurseur(dx, dy) {
    if (!vue) return;
    if (!caseJouable(curseur)) { curseur = plusProche(curseur); return; }
    const W = vue.W, c0 = curseur % W, r0 = Math.floor(curseur / W);
    let best = -1, bd = Infinity;
    for (let i = 0; i < vue.o.length; i++) {
      if (!caseJouable(i) || i === curseur) continue;
      const vx = i % W - c0, vy = Math.floor(i / W) - r0;
      const avance = vx * dx + vy * dy;
      if (avance <= 0) continue;
      const score = avance + Math.abs(vx * dy - vy * dx) * 2.2;
      if (score < bd) { bd = score; best = i; }
    }
    if (best >= 0) { curseur = best; sons.clic(); }
  }

  function ouvrirCase(i) {
    if (!partie || enPause || attenteTuto) return;
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (vue && vue.rev.length) { annulerFermeture(); partie.jouer('f'); return; }
    if (ciblage) { ciblage = false; majInterface(); return; }
    if (!caseJouable(i)) return;
    partie.jouer(i);
  }

  function basculerCiblage() {
    if (!peutSceller()) return;
    audio(); sons.clic();
    ciblage = !ciblage;
    majInterface();
  }
  function choisirCible(s) {
    if (!ciblage) return;
    if (!cibleValide(s)) { sons.non(); return; }
    audio();
    ciblage = false;
    partie.jouer({ sas: s });
    majInterface();
  }

  const plateau = $('plateau');
  let appui = null;
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  plateau.addEventListener('pointerdown', (ev) => {
    audio();
    clavier = false;
    const p = point(ev);
    appui = { id: ev.pointerId };
    survol = caseSous(p[0], p[1]);
  });
  plateau.addEventListener('pointermove', (ev) => {
    const p = point(ev);
    if (appui || ev.pointerType === 'mouse') survol = caseSous(p[0], p[1]);
  });
  plateau.addEventListener('pointerup', (ev) => {
    const p = point(ev);
    const i = caseSous(p[0], p[1]);
    appui = null;
    if (ev.pointerType !== 'mouse') survol = -1;
    ouvrirCase(i);
  });
  plateau.addEventListener('pointercancel', () => { appui = null; survol = -1; });
  plateau.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') survol = -1; });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (ciblage && ev.code === 'Escape') { ciblage = false; majInterface(); return; }
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    if (ev.code === 'KeyS') { ev.preventDefault(); basculerCiblage(); return; }
    const chiffre = /^(?:Digit|Numpad)([1-4])$/.exec(ev.code);
    if (chiffre && ciblage) { ev.preventDefault(); choisirCible(Number(chiffre[1]) - 1); return; }
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) {
      ev.preventDefault(); audio();
      if (!clavier) { clavier = true; if (!caseJouable(curseur)) { curseur = plusProche(-1); return; } }
      deplacerCurseur(dirs[ev.code][0], dirs[ev.code][1]);
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (vue && vue.rev.length) { ouvrirCase(-1); return; }
      if (!clavier || !caseJouable(curseur)) { clavier = true; curseur = plusProche(curseur); return; }
      ouvrirCase(curseur);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); dessinerTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-hangar').addEventListener('click', () => { audio(); sons.clic(); ouvrirHangar(); });
  $('btn-dossier').addEventListener('click', () => { audio(); sons.clic(); ouvrirDossier(); });
  ['niv-retour', 'hangar-retour', 'dossier-retour'].forEach((id) => $(id).addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); }));
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-sas').addEventListener('click', basculerCiblage);
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'titre') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); dessinerTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
