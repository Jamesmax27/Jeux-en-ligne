      for (let k = -2; k <= 2; k++) { c.beginPath(); c.moveTo(bx + k * 6, hb * 0.18 + 46); c.lineTo(bx + k * 4, hb * 0.18 + 64); c.stroke(); }
      // ballon qui rebondit
      const by = hb - 18 - Math.abs(Math.sin(t * 2.6)) * hb * 0.35;
      c.fillStyle = '#f08a2a'; rond(c, w * 0.55, by, 11); c.fill();
      c.strokeStyle = '#7a3b10'; c.lineWidth = 1.5; rond(c, w * 0.55, by, 11); c.stroke();
      c.beginPath(); c.moveTo(w * 0.55 - 11, by); c.lineTo(w * 0.55 + 11, by); c.stroke();
      c.fillStyle = '#e0b06d'; c.fillRect(0, hb - 6, w, 6);
    } else {
      c.fillStyle = '#b7d9ff'; c.fillRect(0, 0, w, hb);
      c.fillStyle = '#ffffff'; c.strokeStyle = '#9cc3eb'; c.lineWidth = 2;
      [[0.2, 0.15, 0.32], [0.55, 0.05, 0.4], [0.88, 0.2, 0.3]].forEach((m) => {
        c.beginPath(); c.moveTo((m[0] - m[2]) * w, hb); c.lineTo(m[0] * w, m[1] * hb); c.lineTo((m[0] + m[2]) * w, hb); c.closePath(); c.fill(); c.stroke();
      });
      // télésiège
      c.strokeStyle = '#3a4d78'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(0, hb * 0.55); c.lineTo(w, hb * 0.15); c.stroke();
      const k = (t * 0.05) % 1;
      [0, 0.33, 0.66].forEach((d) => {
        const q = (k + d) % 1, x = q * w, y = hb * 0.55 - q * hb * 0.4;
        c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + 12); c.stroke();
        c.fillStyle = COUL[Math.round(d * 3) % 4]; rr(c, x - 8, y + 12, 16, 8, 3); c.fill();
      });
      // sapins
      for (let x = 12; x < w; x += 46) {
        const hS = 30 + hasard() * 18, y = hb - 2;
        c.fillStyle = '#1d6b3f'; c.beginPath(); c.moveTo(x, y - hS); c.lineTo(x - hS * 0.38, y); c.lineTo(x + hS * 0.38, y); c.closePath(); c.fill();
        c.fillStyle = '#ffffff'; c.beginPath(); c.moveTo(x, y - hS); c.lineTo(x - hS * 0.12, y - hS * 0.7); c.lineTo(x + hS * 0.12, y - hS * 0.7); c.closePath(); c.fill();
      }
    }
    c.restore();
  }

  // Décor animé du stade pendant la partie (flocons, bulles, confettis du public).
  const deco = [];
  function dessinerDecor(dt) {
    const cv = $('decor'), z = $('stade');
    const w = z.clientWidth, h = z.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    const st = vue ? vue.st : (session === 'solo' ? NIVEAUX[niveau - 1].st : 0);
    const piste = $('piste');
    toile(c, st, w, Math.max(40, piste.offsetTop - 6), performance.now() / 1000);
    while (deco.length < 26) deco.push({ x: Math.random() * w, y: Math.random() * h, v: 10 + Math.random() * 25, k: 1.5 + Math.random() * 3, p: Math.random() * 6 });
    deco.forEach((d) => {
      d.p += dt;
      if (st === 3) { d.y += d.v * dt; d.x += Math.sin(d.p) * 8 * dt; c.fillStyle = '#ffffffdd'; }
      else if (st === 1) { d.y -= d.v * dt; c.fillStyle = '#ffffff66'; }
      else if (st === 2) { d.y += d.v * 0.2 * dt; c.fillStyle = 'rgba(255,240,200,.25)'; }
      else { d.y += d.v * 0.15 * dt; c.fillStyle = 'rgba(255,255,255,.25)'; }
      if (d.y > h + 5) { d.y = -5; d.x = Math.random() * w; }
      if (d.y < -5) { d.y = h + 5; d.x = Math.random() * w; }
      rond(c, d.x, d.y, d.k); c.fill();
    });
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }
  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  // Nom d'une place pour les messages : « toi », le pseudo, ou le maillot.
  function nomCourt(s) {
    if (partie && s === partie.siege) return tr('place.toi');
    const info = siegesActuels()[s] || {};
    return info.humain && info.nom ? info.nom : tr('maillot.' + s);
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      // avant la création de la partie (tutoriel), la place 0 est déjà la tienne en solo
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: !partie && session === 'solo' && s === 0 };
      const pts = e ? e.sc[s] : 0, md = e ? e.md[s] : 0;
      d.querySelector('.pts').textContent = nb(pts);
      d.querySelector('.md').textContent = md ? '🏅' + nb(md) : '';
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      const nbl = e && e.mains[s] && !info.moi ? tr('place.lettres', { n: e.mains[s].length }) : '';
      if (d.querySelector('.nbl').textContent !== nbl) d.querySelector('.nbl').textContent = nbl;
      const mot = motifDe(s);
      const cv = d.querySelector('canvas.buste');
      if (cv.dataset.m !== mot) { cv.dataset.m = mot; const c = cv.getContext('2d'); c.clearRect(0, 0, 92, 92); buste(c, s, 46, 46, 44, mot); }
      d.setAttribute('aria-label', tr('place.aria.' + role, { maillot: tr('maillot.' + s), points: pts, n: md }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) return modeDon >= 0 ? tr('tour.don') : tr('tour.toi');
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.' + s);
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length }) + ' · ' + tr('stade.' + (vue ? vue.st : NIVEAUX[niveau - 1].st));
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');

    const m = texteMessage();

  function construirePiste() {
    const boite = $('cases');
    boite.textContent = '';
    for (let k = 0; k < O.MAX; k++) {
      const d = document.createElement('div');
      d.className = 'case'; d.id = 'case-' + k;
      d.innerHTML = HAIE_SVG;
      const l = document.createElement('span'); l.className = 'l';

      d.append(l, e);
      boite.appendChild(d);

  function candidatsVue() {
    if (!vue) return [];
    return O.candidatsDe(vue.st, O.prefixe(vue), vue.hz);
  }

  function majPiste() {
    const e = vue;
    const ecranJeu = $('ecran-jeu');
    const st = e ? e.st : (session === 'solo' ? NIVEAUX[niveau - 1].st : 0);
    for (let k = 0; k < 4; k++) ecranJeu.classList.toggle('stade-' + k, k === st);
    const cands = candidatsVue();
    const lmax = cands.reduce((a, w) => Math.max(a, w.length), e ? e.m.length : 0);
    for (let k = 0; k < O.MAX; k++) {
      const d = $('case-' + k), lettre = e ? e.m[k] : null;
      d.classList.toggle('pleine', !!lettre);
      d.classList.toggle('arbitre', !!lettre && lettre.p < 0);
      d.classList.toggle('sprint', !!lettre && !!lettre.s);
      d.classList.toggle('suivante', !!e && k === e.m.length && partie && partie.phase === 'jeu');
      d.classList.toggle('haie', !!e && e.hz.indexOf(k) >= 0);
      d.classList.toggle('echange', !!e && k === e.ez);
      d.classList.toggle('loin', !!e && k >= lmax && !lettre);
      d.style.setProperty('--c', lettre ? (lettre.p >= 0 ? COUL[lettre.p] : '#8a90a0') : '#3a4d78');
      const txt = lettre ? lettre.l : '';
      const span = d.querySelector('.l');
      if (span.textContent !== txt) span.textContent = txt;
      d.querySelector('.eclair').textContent = lettre && lettre.s ? '⚡' : '';
    }
    // le coureur qui porte le témoin, sous la case suivante
    const cr = $('coureur');
    if (e && partie && partie.phase === 'jeu') {
      const s = R.aQui(e);
      const k = Math.min(O.MAX - 1, e.m.length);
      cr.style.display = '';
      cr.style.left = ((k + 0.5) / O.MAX * 100) + '%';
      const cle = s + '|' + motifDe(s) + '|' + (s === (partie ? partie.siege : -1) ? prog.options.temoin : 'argent');
      if (cr.dataset.cle !== cle) {
        cr.dataset.cle = cle;
        cr.textContent = '';
        const cv = document.createElement('canvas'); cv.width = 68; cv.height = 80; cv.style.width = '100%'; cv.style.height = '100%';
        coureur(cv.getContext('2d'), s, 30, 78, 0.78, 0.8, motifDe(s), true, s === partie.siege ? prog.options.temoin : 'argent');
        cr.appendChild(cv);
      }
    } else cr.style.display = 'none';
    // mots en vue
    const envue = $('envue');
    const cle = e ? O.prefixe(e) + '|' + e.hz.join(',') + '|' + e.st : '';
    if (envue.dataset.cle !== cle) {
      envue.dataset.cle = cle;
      envue.textContent = '';
      if (e) {
        const t = document.createElement('span'); t.className = 'titre'; t.textContent = tr('envue.titre');
        envue.appendChild(t);
        const pre = O.prefixe(e);
        const liste = cands.slice().sort((a, b) => a.length - b.length || (a < b ? -1 : 1));
        liste.slice(0, 5).forEach((w) => {
          const p = document.createElement('span'); p.className = 'puce';
          const b = document.createElement('b'); b.textContent = w.slice(0, pre.length);
          p.append(b, document.createTextNode(w.slice(pre.length)));
          envue.appendChild(p);
        });
        if (liste.length > 5) { const p = document.createElement('span'); p.className = 'puce'; p.textContent = tr('envue.plus', { n: liste.length - 5 }); envue.appendChild(p); }
      }
    }
    // derniers mots gagnés
    const der = $('derniers');
    const cleD = e ? JSON.stringify(e.hist) : '';
    if (der.dataset.cle !== cleD) {
      der.dataset.cle = cleD;
      der.textContent = '';
      if (e && e.hist.length) {
        const t = document.createElement('span'); t.className = 'titre'; t.textContent = tr('derniers.titre');
        der.appendChild(t);
        e.hist.slice(-3).reverse().forEach((h) => {
          const p = document.createElement('span');
          if (h.p < 0) { p.className = 'puce range'; p.textContent = h.w || '—'; }
          else {
            p.className = 'puce ' + O.medaille(h.w.length);
            const i = document.createElement('i'); i.style.background = COUL[h.p];
            p.insertAdjacentHTML('afterbegin', medailleSVG(O.medaille(h.w.length), 14));
            p.append(i, document.createTextNode(h.w));
          }
          der.appendChild(p);
        });
      }
    }
  }

  // ---------------------------------------------------------------------
  //  La réserve du joueur
  // ---------------------------------------------------------------------

  function maMain() {
    if (!vue || !partie || partie.siege < 0) return [];
    return vue.mains[partie.siege] || [];
  }
  function monTour() { return !!(partie && vue && partie.phase === 'jeu' && !attenteTuto && !enPause && partie.monTour()); }

  function majReserve() {
    const boite = $('reserve'), main = maMain();
    const jou = vue ? O.jouables(vue) : '';
    const tour = monTour();
    const cle = JSON.stringify(main) + '|' + jou + '|' + tour + '|' + modeDon + '|' + sel;
    if (boite.dataset.cle !== cle) {
      boite.dataset.cle = cle;
      boite.textContent = '';
      main.forEach((x, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        const ok = modeDon >= 0 ? i !== modeDon : jou.indexOf(x.l) >= 0;
        b.className = 'lettre' + (x.s ? ' sprint' : '') + (tour ? (ok ? ' ok' : ' non') : '') + (i === modeDon ? ' choisie' : '') + (i === sel ? ' sel' : '');
        b.id = 'lettre-' + i;
        b.textContent = x.l;
        if (x.s) { const e = document.createElement('span'); e.className = 'eclair'; e.textContent = '⚡'; b.appendChild(e); }
        b.setAttribute('aria-label', tr(x.s ? 'lettre.ariaSprint' : 'lettre.aria', { l: x.l }) + (tour && !ok ? ' · ' + tr('lettre.ariaNon') : ''));
        b.addEventListener('click', () => { audio(); toucherLettre(i); });
        boite.appendChild(b);
      });
    }
    let consigne = '';
    if (partie && partie.siege >= 0 && vue && partie.phase === 'jeu') {
      if (modeDon >= 0) consigne = tr('echange.choisir', { nom: nomCourt((partie.siege + 1) % PLACES) });
      else if (tour) consigne = jou && main.some((x) => jou.indexOf(x.l) >= 0) ? (vue.m.length === vue.ez ? tr('echange.annonce') : vue.hz.indexOf(vue.m.length) >= 0 ? tr('haie.annonce') : tr('reserve.choisis')) : tr('reserve.aucune');
      else consigne = tr('reserve.attends');
    }
    const cm = $('consigne-main');
    if (cm.textContent !== consigne) cm.textContent = consigne;
    cm.classList.toggle('don', modeDon >= 0);
    const bp = $('btn-passer');
    bp.disabled = !tour || modeDon >= 0;
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majPiste();
    majReserve();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerDecor(dt);
    majTemps();
    majCompte();
    const cr = $('coureur').firstChild;
    if (cr) cr.style.transform = 'translateY(' + (Math.sin(t / 90) * 2).toFixed(1) + 'px)';
    rafId = requestAnimationFrame(boucle);
  }

  // ---------------------------------------------------------------------
  //  Effets : lettre qui vole, médaille, bannière, confettis
  // ---------------------------------------------------------------------

  function centre(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
  function voler(depuis, vers, contenu, classe, coul, apres) {
    if (!depuis || !vers) { if (apres) apres(); return; }
    const a = centre(depuis), b = centre(vers);
    const v = document.createElement('div');
    v.className = 'vol' + (classe ? ' ' + classe : '');
    if (classe === 'medaille') v.innerHTML = medailleSVG(contenu, 42); else v.textContent = contenu;
    if (coul) v.style.borderColor = coul;
    v.style.left = (a[0] - 22) + 'px'; v.style.top = (a[1] - 25) + 'px';
    document.body.appendChild(v);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      v.style.left = (b[0] - 22) + 'px'; v.style.top = (b[1] - 25) + 'px';
      v.style.transform = classe === 'medaille' ? 'scale(1.3) rotate(360deg)' : 'scale(.9)';
    }));
    setTimeout(() => { v.remove(); if (apres) apres(); }, classe === 'medaille' ? 950 : 480);
  }

  let minuteurBanniere = 0;
  function banniere(med, mot, qui) {
    const b = $('banniere');
    b.querySelector('.med').innerHTML = medailleSVG(med, 46);
    b.querySelector('.mot').textContent = mot;
    b.querySelector('.qui').textContent = qui;
    b.classList.add('actif');
    clearTimeout(minuteurBanniere);
    minuteurBanniere = setTimeout(() => b.classList.remove('actif'), 1700);
  }

  function confettis(peu) {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    const n = peu ? 40 : 90;
    for (let i = 0; i < n; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < (peu ? 1600 : 2600)) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    modeDon = -1; sel = -1;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // Salon d'attente (en ligne) : le premier joueur arrivé lance la course,
  // sinon elle part toute seule au bout du temps donné par le serveur.
  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + motifDe(s);
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        buste(c, s, 56, 62, 46, motifDe(s));
        if (info.chef) couronne(c, 56, 22, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { maillot: tr('maillot.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { qui: nomChef ? nomChef + ' · ' + tr('maillot.' + partie.chef) : tr('maillot.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    modeDon = -1; sel = -1;
    debutTour = Date.now();
    dernierTic = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche, stade: tr('stade.' + vue.st) })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    if (vue.arb === 'sifflet') setTimeout(() => sons.sifflet(), 300);
  }

  function surAction(ev) {
    const avant = ev.avant, apres = ev.apres, der = apres.der || {};
    const moi = partie.siege;
    vue = JSON.parse(JSON.stringify(apres));
    modeDon = -1; sel = -1;
    debutTour = Date.now();
    dernierTic = -1;
    const s = ev.siege;
    if (der.t === 'passe') {
      sons.passe();
      if (!ev.moi) toast(tr('passe.autre', { nom: nomCourt(s) }), 1400);
      else toast(tr('passe.toi', { n: der.n || 0 }), 1800);
      if (der.range !== undefined) { sons.range(); toast(tr('mot.range'), 2200); }
    } else if (der.t === 'pose') {
      const k = der.k;
      if (der.s) sons.sprint(); else sons.pose();
      const caseEl = $('case-' + Math.min(O.MAX - 1, k));
      if (!ev.moi) voler($('place-' + s), caseEl, der.l, '', COUL[s]);
      if (!der.ferme) { caseEl.classList.remove('pop'); void caseEl.offsetWidth; caseEl.classList.add('pop'); }
      if (der.don) {
        sons.echange();
        if (der.don.a === moi) toast(tr('echange.recu', { nom: nomCourt(s), l: der.don.l }), 2200);
        else if (!ev.moi) toast(tr('echange.autre', { nom: nomCourt(s), autre: nomCourt(der.don.a) }), 1600);
        voler($('place-' + s), $('place-' + der.don.a), der.don.l, '', COUL[s]);
      }
      if (der.ferme) {
        const f = der.ferme;
        sons.medaille(f.md);
        if (!ev.moi && moi >= 0) setTimeout(() => sons.rival(), 500);
        banniere(f.md, f.w, tr(s === moi ? 'medaille.toi' : 'medaille.autre', { nom: nomCourt(s), n: f.v, medaille: tr('medaille.' + f.md) }));
        voler($('banniere'), $('place-' + s), f.md, 'medaille', null, () => {
          const carte = $('place-' + s); carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
        });
        if (s === moi) confettis(true);
        if (der.arb === 'sifflet') setTimeout(() => { sons.sifflet(); toast(tr('sifflet.toast', { l: vue.m[0] ? vue.m[0].l : '' }), 2200); }, 900);
        else if (der.arb === 'chaine') setTimeout(() => { sons.sifflet(); toast(tr('chaine.toast', { l: vue.m[0] ? vue.m[0].l : '' }), 2200); }, 900);
      }
    }
    if (der.t === 'passe' && der.arb === 'sifflet') setTimeout(() => sons.sifflet(), 600);
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && R.aQui(vue) === moi && !ev.moi) setTimeout(() => sons.tour(), 250);
    void avant;
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1500);
  }

  // Fin d'une course en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = moi >= 0 && e.sc[moi] === Math.max.apply(null, e.sc);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de course : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(pts, total, gagne) {
    if (!gagne) return 0;
    const p = total ? pts / total : 0;
    return p >= 0.5 ? 3 : p >= 0.35 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      if (e.sc[s] !== prec) { rang = k + 1; prec = e.sc[s]; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64; buste(cv.getContext('2d'), s, 32, 32, 30, motifDe(s));
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.pointsCourt', { n: e.sc[s] }) + ' · 🏅' + nb(e.md[s]);
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  // Ce que la victoire vient de débloquer (maillot, témoin, coupe).
  function nouveautes(avant) {
    const apres = totalEtoiles(), l = [];
    MAILLOTS.forEach((m) => { if (m.seuil > avant && m.seuil <= apres) l.push(tr('cadeau.maillot', { nom: tr('maillotMotif.' + m.id) })); });
    TEMOINS.forEach((m) => { if (m.seuil > avant && m.seuil <= apres) l.push(tr('cadeau.temoin', { nom: tr('temoin.' + m.id) })); });
    return l;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.sc[moi] : 0;
    const total = e.sc.reduce((a, b) => a + b, 0);
    const gagne = moi >= 0 && pts === Math.max.apply(null, e.sc);
    const egalite = gagne && e.sc.filter((x) => x === pts).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.points', { n: pts, total: total, m: e.md[moi] }) : '';
    $('fin-cadeau').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(pts, total, gagne);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      const avantEtoiles = totalEtoiles();
      const coupesAvant = COUPES.map((_, k) => coupeGagnee(k));
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
        const cadeaux = nouveautes(avantEtoiles);
        COUPES.forEach((cp, k) => { if (!coupesAvant[k] && coupeGagnee(k)) cadeaux.push(tr('cadeau.coupe', { nom: tr('coupe.' + cp.id) })); });
        $('fin-cadeau').textContent = cadeaux.join(' ');
      } else if (record) sauver(niveau, pts);
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) + (niveau % 5 === 0 ? ' ' + tr('fin.nouveauStade', { stade: tr('stade.' + NIVEAUX[niveau].st) }) : '') : (gagne ? '' : tr('fin.conseil')));
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les courses s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la course suivante (partie en ligne repassée en solo).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux
  // ---------------------------------------------------------------------

  let attenteTuto = false;

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    modeDon = -1; sel = -1;
    bandeau('');
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon'].forEach(fermerVoile);
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  // Parcours solo : niveau n contre 3 robots (force croissante, donnée par le niveau).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = null;
    modeDon = -1; sel = -1;
    afficherEcran('jeu');
    const tutos = (NIVEAUX[niveau - 1].tuto || []).filter((x) => prog.tutos.indexOf(x) < 0);
    if (tutos.length) {
      attenteTuto = true;
      const suite = () => {
        const cle = tutos.shift();
        montrerTuto(cle, () => {
          if (prog.tutos.indexOf(cle) < 0) prog.tutos.push(cle);
          if (tutos.length) suite(); else { attenteTuto = false; lancerNiveau(); }
        });
      };
      suite();
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : courses qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const boite = $('grille-niveaux');
    boite.textContent = '';
    for (let st = 0; st < 4; st++) {
      const bloc = document.createElement('div'); bloc.className = 'bloc-stade';
      const h = document.createElement('h3');
      const pastille = document.createElement('i'); pastille.style.background = STADE_COUL[st];
      const titre = document.createElement('span'); titre.textContent = tr('stade.' + st);
      h.append(pastille, titre);
      const grille = document.createElement('div'); grille.className = 'grille';
      for (let i = st * 5; i < st * 5 + 5; i++) {
        const n = i + 1, ouvert = n <= prog.debloque;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'case-niv' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
        const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
        const et = document.createElement('small');
        for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
        b.append(num, et);
        b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
        if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
        else b.disabled = true;
        grille.appendChild(b);
      }
      bloc.append(h, grille);
      boite.appendChild(bloc);
    }
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
  }

  // Vestiaire : choisir son maillot et son témoin, voir ses coupes.
  function ouvrirVestiaire() {
    const tot = totalEtoiles();
    $('vest-total').textContent = tr('etoiles.total', { n: tot, max: NIVEAUX.length * 3 });
    const bm = $('vest-maillots'); bm.textContent = '';
    MAILLOTS.forEach((m) => {
      const ok = tot >= m.seuil;
      const b = document.createElement('button'); b.type = 'button';
      b.className = 'vest-choix' + (prog.options.maillot === m.id ? ' pris' : '') + (ok ? '' : ' ferme');
      const cv = document.createElement('canvas'); cv.width = 144; cv.height = 144;
      buste(cv.getContext('2d'), 0, 72, 72, 66, m.id);
      const nom = document.createElement('span'); nom.textContent = tr('maillotMotif.' + m.id);
      b.append(cv, nom);
      if (!ok) { const v = document.createElement('span'); v.className = 'verrou'; v.textContent = tr('vestiaire.seuil', { n: m.seuil }); b.appendChild(v); b.disabled = true; }
      b.setAttribute('aria-pressed', prog.options.maillot === m.id ? 'true' : 'false');
      b.addEventListener('click', () => { audio(); sons.clic(); prog.options.maillot = m.id; sauverOptions(); ouvrirVestiaire(); });
      bm.appendChild(b);
    });
    const bt = $('vest-temoins'); bt.textContent = '';
    TEMOINS.forEach((m) => {
      const ok = tot >= m.seuil;
      const b = document.createElement('button'); b.type = 'button';
      b.className = 'vest-choix' + (prog.options.temoin === m.id ? ' pris' : '') + (ok ? '' : ' ferme');
      const cv = document.createElement('canvas'); cv.width = 144; cv.height = 144;
      temoin(cv.getContext('2d'), m.id, 72, 72, 110, -0.5);
      const nom = document.createElement('span'); nom.textContent = tr('temoin.' + m.id);
      b.append(cv, nom);
      if (!ok) { const v = document.createElement('span'); v.className = 'verrou'; v.textContent = tr('vestiaire.seuil', { n: m.seuil }); b.appendChild(v); b.disabled = true; }
      b.setAttribute('aria-pressed', prog.options.temoin === m.id ? 'true' : 'false');
      b.addEventListener('click', () => { audio(); sons.clic(); prog.options.temoin = m.id; sauverOptions(); ouvrirVestiaire(); });
      bt.appendChild(b);
    });
    const bc = $('vest-coupes'); bc.textContent = '';
    COUPES.forEach((cp, k) => {
      const d = document.createElement('div'); d.className = 'coupe';
      const cv = document.createElement('canvas'); cv.width = 116; cv.height = 132;
      dessinerCoupe(cv.getContext('2d'), 58, 126, 118, cp.coul, coupeGagnee(k));
      const nom = document.createElement('span'); nom.textContent = tr('coupe.' + cp.id);
      d.append(cv, nom);
      d.setAttribute('aria-label', tr('coupe.' + cp.id) + ' · ' + tr(coupeGagnee(k) ? 'coupe.gagnee' : 'coupe.aGagner'));
      bc.appendChild(d);
    });
    afficherEcran('vestiaire');
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    majReserve();
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
    majInterface();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés (petite scène en HTML)
  // ---------------------------------------------------------------------

  let tutoJeton = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    const scene = $('tuto-scene');
    scene.className = 'stade-' + (d.stade || 0);
    const j = ++tutoJeton;
    const attendre = (ms) => new Promise((ok) => setTimeout(ok, ms));
    const doigt = $('tuto-doigt');
    const placerDoigt = (el) => {
      const r = el.getBoundingClientRect(), rs = scene.getBoundingClientRect();
      doigt.style.left = (r.left - rs.left + r.width / 2 - 14) + 'px';
      doigt.style.top = (r.top - rs.top + r.height / 2 - 6) + 'px';
    };
    async function jouerScene() {
      while (j === tutoJeton) {
        // mise en place
        $('tuto-avant').textContent = d.avant ? d.avant : '';
        const cases = $('tuto-cases'); cases.textContent = '';
        cases.className = 'stade-' + (d.stade || 0);
        const mot = d.mot.split('').map((l) => ({ l: l, p: 1 }));
        for (let k = 0; k < 6; k++) {
          const c = document.createElement('div'); c.className = 'case'; c.innerHTML = HAIE_SVG;
          const s = document.createElement('span'); s.className = 'l'; c.appendChild(s);
          cases.appendChild(c);
        }
        const peindre = () => {
          [...cases.children].forEach((c, k) => {
            const x = mot[k];
            c.classList.toggle('pleine', !!x);
            c.classList.toggle('arbitre', !!x && x.p < 0);
            c.classList.toggle('sprint', !!x && !!x.s);
            c.classList.toggle('suivante', k === mot.length);
            c.classList.toggle('haie', (d.haies || []).indexOf(k) >= 0);
            c.classList.toggle('echange', d.ez === k);
            c.style.setProperty('--c', x ? (x.p === 0 ? COUL[0] : x.p < 0 ? '#8a90a0' : COUL[1]) : '#3a4d78');
            c.querySelector('.l').textContent = x ? x.l : '';
          });
        };
        peindre();
        const mainEl = $('tuto-main'); mainEl.textContent = '';
        d.main.forEach((l, i) => {
          const b = document.createElement('div');
          const sp = (d.sprint || []).indexOf(i) >= 0;
          b.className = 'lettre' + (sp ? ' sprint' : '') + ((d.ok || []).indexOf(i) >= 0 ? ' ok' : ' non');
          b.textContent = l;
          if (sp) { const e = document.createElement('span'); e.className = 'eclair'; e.textContent = '⚡'; b.appendChild(e); }
          mainEl.appendChild(b);
        });
        $('tuto-effet').classList.remove('actif');
        doigt.style.transition = 'none'; doigt.style.left = '82%'; doigt.style.top = '78%';
        void doigt.offsetWidth; doigt.style.transition = '';
        await attendre(700); if (j !== tutoJeton) return;
        for (const et of d.etapes) {
          if (et.i !== undefined || et.don !== undefined) {
            const idx = et.i !== undefined ? et.i : et.don;
            const b = mainEl.children[idx];
            placerDoigt(b);
            await attendre(650); if (j !== tutoJeton) return;
            doigt.classList.add('appui'); await attendre(160); doigt.classList.remove('appui');
            b.classList.add('parti');
            if (et.i !== undefined) { mot.push({ l: d.main[idx], p: 0, s: (d.sprint || []).indexOf(idx) >= 0 }); sons.pose(); }
            else { sons.echange(); }
            peindre();
          } else if (et.rival) {
            await attendre(400); if (j !== tutoJeton) return;
            mot.push({ l: et.rival, p: 1 }); sons.pose(); peindre();
          } else if (et.arbitre || et.chaine) {
            await attendre(300); if (j !== tutoJeton) return;
            $('tuto-effet').textContent = '📣'; $('tuto-effet').classList.add('actif'); sons.sifflet();
            await attendre(500);
            mot.push({ l: et.arbitre || et.chaine, p: -1 }); peindre();
            await attendre(400); $('tuto-effet').classList.remove('actif');
          }
          await attendre(700); if (j !== tutoJeton) return;
        }
        if (d.gain) {
          if (d.gain === 'rival') $('tuto-effet').textContent = '😮'; else $('tuto-effet').innerHTML = medailleSVG(d.gain, 50);
          $('tuto-effet').classList.add('actif');
          if (d.gain !== 'rival') sons.medaille(d.gain);
        }
        await attendre(1600);
      }
    }
    ouvrirVoile('voile-tuto');
    jouerScene();
    const fermer = () => {
      tutoJeton++;
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function attends() {
    if (Date.now() - dernierAttends > 1500 && partie && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
  }

  function refuser(i, cle) {
    const b = $('lettre-' + i);
    if (b) { b.classList.remove('refus'); void b.offsetWidth; b.classList.add('refus'); }
    sons.non();
    toast(tr(cle), 1800);
  }

  function envoyer(action, i) {
    const b = $('lettre-' + i);
    const lettre = (maMain()[i] || {}).l || '';
    const cible = $('case-' + Math.min(O.MAX - 1, vue.m.length));
    const coul = COUL[partie.siege];
    if (partie.jouer(action)) {
      if (b) voler(b, cible, lettre, '', coul);
      modeDon = -1; sel = -1;
      majReserve();
    } else refuser(i, 'lettre.non');
  }

  function toucherLettre(i) {
    if (!monTour()) { attends(); return; }
    const main = maMain();
    if (i < 0 || i >= main.length) return;
    if (modeDon >= 0) {
      if (i === modeDon) { modeDon = -1; sons.clic(); majInterface(); return; }
      sons.echange();
      envoyer({ i: modeDon, d: i }, modeDon);
      return;
    }
    const jou = O.jouables(vue), L = main[i].l;
    if (jou.indexOf(L) < 0) {
      const haie = vue.hz.indexOf(vue.m.length) >= 0 && !O.estVoyelle(L);
      refuser(i, haie ? 'lettre.haie' : 'lettre.non');
      return;
    }
    if (vue.m.length === vue.ez && main.length >= 2) { modeDon = i; sons.clic(); majInterface(); return; }
    envoyer({ i: i }, i);
  }

  function passer() {
    if (!monTour() || modeDon >= 0) { attends(); return; }
    if (partie.jouer({ p: 1 })) { sel = -1; majReserve(); }
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape' || (ev.code === 'KeyP' && !monTour())) {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const main = maMain();
    if (ev.code === 'ArrowLeft' || ev.code === 'ArrowRight') {
      ev.preventDefault(); audio();
      if (!main.length) return;
      sel = sel < 0 ? 0 : (sel + (ev.code === 'ArrowRight' ? 1 : -1) + main.length) % main.length;
      sons.clic(); majReserve();
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (sel < 0) { sel = 0; majReserve(); return; }
      toucherLettre(sel);
    } else if (ev.code === 'Backspace' || ev.code === 'Delete') {
      ev.preventDefault(); audio();
      if (modeDon >= 0) { modeDon = -1; majInterface(); } else passer();
    } else if (ev.key && ev.key.length === 1 && /[a-z]/i.test(ev.key)) {
      // taper la lettre au clavier : celle de la réserve qui va le mieux
      const L = ev.key.toUpperCase();
      const cand = main.map((x, k) => k).filter((k) => main[k].l === L && k !== modeDon);
      const sansSprint = cand.filter((k) => !main[k].s);
      const i = sansSprint.length ? sansSprint[0] : (cand.length ? cand[0] : -1);
      if (i < 0) { if (ev.code === 'KeyP') { audio(); ouvrirPause(); } return; }
      ev.preventDefault(); audio();
      sel = i;
      toucherLettre(i);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-vestiaire').addEventListener('click', () => { audio(); sons.clic(); ouvrirVestiaire(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('vest-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-passer').addEventListener('click', () => { audio(); sons.clic(); passer(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'titre') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  construirePiste();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
