  }
  function moi() { return partie ? partie.siege : -1; }

  // Le rôle d'une place : toi, un vrai joueur ou un robot.
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  // Nom d'un coureur dans les messages : pseudo, sinon son totem.
  function nomCoureur(s) {
    const info = siegesActuels()[s] || {};
    if (info.moi) return tr('place.toi');
    return info.humain && info.nom ? info.nom : tr('coureur.' + s);
  }
  function remplirTag(tag, role, nom) {
    if (tag.dataset.role === role && tag.dataset.nom === nom) return;
    tag.dataset.role = role;
    tag.dataset.nom = nom;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = nom;
    tag.appendChild(txt);
  }

  // Cartes des 5 places, en haut de l'écran, et les mêmes dans le salon.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'tete'; cv.width = 88; cv.height = 88;
      const tag = document.createElement('span'); tag.className = 'tag';
      const pips = document.createElement('span'); pips.className = 'pips';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 44; cour.height = 34;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 22, 31, 20);
      d.append(cv, tag, pips, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 96; cv.height = 96;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels(), m = moi();
    const tour = e && partie && partie.phase === 'jeu' ? e.tour : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const role = roleDe(info), nom = nomPlace(info, role);
      const av = e ? e.av[s] : 0, debout = !e || e.vi[s] === 1;
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', s === m);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('hors', !debout);
      remplirTag(d.querySelector('.tag'), role, nom);
      const cle = s + '|' + (s === m ? prog.tenue : '') + '|' + (debout ? 1 : 0);
      const cv = d.querySelector('canvas.tete');
      if (cv.dataset.cle !== cle) {
        cv.dataset.cle = cle;
        const c = cv.getContext('2d'); c.clearRect(0, 0, 88, 88);
        medaillon(c, s, 44, 44, 34, { tenue: s === m ? maTenue() : null });
      }
      const pips = d.querySelector('.pips');
      if (pips.dataset.n !== String(av)) {
        pips.dataset.n = String(av);
        pips.textContent = '';
        for (let k = 0; k < av; k++) pips.appendChild(document.createElement('i'));
      }
      const etat = debout ? tr('place.foulees', { n: av }) : tr('place.attrape');
      d.setAttribute('aria-label', tr('place.aria', { coureur: tr('coureur.' + s), qui: nom, etat: etat }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    if (moi() < 0) return tr('multi.attente');
    if (tourMoi) {
      if (tourMoi.phase === 'choix') return tr('tour.choix');
      if (tourMoi.phase === 'montre') return tr('tour.memorise');
      if (tourMoi.phase === 'masque') return tr('tour.masque');
      if (tourMoi.phase === 'saisie') return tr('tour.saisie', { n: tourMoi.vrai.length - tourMoi.idx });
      return tr('tour.envoi');
    }
    if (anim && anim.type === 'action') return tr('tour.court', { nom: nomCoureur(anim.ev.siege) });
    if (e.vi[moi()] === 0) return tr('tour.elimine');
    return tr('tour.attend', { nom: nomCoureur(e.tour) });
  }

  function texteAide() {
    if (tourMoi && tourMoi.phase === 'saisie') return tr('aide.saisie');
    if (tourMoi && (tourMoi.phase === 'montre' || tourMoi.phase === 'masque')) return tr('aide.montre');
    if (vue && partie && partie.phase === 'jeu') return tr('aide.tour', { n: vue.r, total: vue.q.mr });
    return '';
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.nuit', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
    const a = texteAide();
    if ($('aide').textContent !== a) $('aide').textContent = a;
  }

  function majInterface() { majPlaces(); majInfos(); }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && vue && partie.phase === 'jeu' && !anim && !fileAnim.length) {
      const s = vue.tour, sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === moi() && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Mon tour : choix (sprint), affichage des lanternes, masque, saisie
  // ---------------------------------------------------------------------

  const PAS_LANTERNE = 260;   // ms entre deux lanternes qui s'allument
  const PAS_MASQUE = 330;     // ms par case du faux coureur

  function commencerMonTour() {
    const e = copie(partie.etat), s = moi();
    tourMoi = { phase: 'choix', e: e, s: 0, vrai: e.ch, taps: [], pos: e.dep, idx: 0, err: 0, limite: Math.min(O.ERR_MAX, e.av[s]), t0: horloge, gourde: false };
    effets = { pas: [], erreurs: [] };
    curseur = -1;
    sons.tour();
    if (e.sp && e.ch2.length) { $('choix').classList.add('actif'); try { $('btn-normal').focus({ preventScroll: true }); } catch (err) { /* rien */ } }
    else lancerAffichage(0);
    majInterface();
  }

  function lancerAffichage(sp) {
    if (!tourMoi) return;
    $('choix').classList.remove('actif');
    const e = tourMoi.e;
    tourMoi.s = sp;
    tourMoi.vrai = sp ? e.ch.concat(e.ch2) : e.ch.slice();
    const vt = typeof e.q.vt === 'number' ? e.q.vt : 1;
    const n = tourMoi.vrai.length;
    tourMoi.pasL = PAS_LANTERNE * vt;
    tourMoi.D = (n * PAS_LANTERNE + 800 + 340 * n) * vt;
    tourMoi.phase = 'montre';
    tourMoi.t0 = horloge;
    tourMoi.allumees = -1;
    if (sp) { sons.sprint(); if (nuitStats) nuitStats.sprintTente = true; }
    majInterface();
  }

  // Lanternes visibles à l'instant tm du tour (ms depuis le début de l'affichage).
  function lanternesAffichage(e, vrai, tm, D, pasL, longueurCh) {
    const l = [], fin = Math.max(0, Math.min(1, (D + 350 - tm) / 350));
    if (tm > D + 350) return l;
    vrai.forEach((i, k) => {
      const t1 = k * pasL;
      if (tm < t1) return;
      let a = Math.min(1, (tm - t1) / 160) * fin;
      const r = Math.floor(i / e.W);
      if (e.br >= 0 && (r === e.br || r === e.br + 1)) a *= Math.max(0, 1 - (tm - t1 - 300) / 200);   // brume : un éclair
      l.push({ i: i, type: k >= longueurCh ? 'or' : 'vrai', a: a });
    });
    if (e.fx && e.fx.length) {
      const k0 = Math.max(0, e.ch.findIndex((x) => O.voisin(x, e.fx[0])));
      e.fx.forEach((i, k) => {
        const t1 = (k0 + 0.5 + k) * pasL;
        if (tm < t1) return;
        l.push({ i: i, type: 'faux', a: Math.min(1, (tm - t1) / 160) * fin });
      });
    }
    return l;
  }

  // Avance du tour (montre → masque → saisie) ; appelé à chaque image.
  function avancerMonTour() {
    const m = tourMoi;
    if (!m) return;
    const tm = horloge - m.t0;
    if (m.phase === 'montre') {
      const k = Math.min(m.vrai.length - 1, Math.floor(tm / m.pasL));
      if (k > m.allumees) { m.allumees = k; sons.lanterne(k); }
      if (tm > m.D + 350) {
        sons.eteint();
        if (m.e.mq) { m.phase = 'masque'; m.t0 = horloge; sons.masque(); }
        else commencerSaisie();
        majInfos();
      }
    } else if (m.phase === 'masque') {
      const trajet = trajetMasque(m.e);
      if (tm > trajet.length * PAS_MASQUE + 700) commencerSaisie();
    }
  }

  function trajetMasque(e) {
    const q = e.mq;
    return [e.dep].concat(e.ch.slice(0, q.k), [q.c], q.d || []);
  }

  function commencerSaisie() {
    const m = tourMoi;
    m.phase = 'saisie';
    m.t0 = horloge;
    m.pos = m.e.dep; m.idx = 0; m.err = 0; m.taps = [];
    majInfos();
  }

  // Le joueur touche la case x pendant la saisie.
  function taper(x) {
    const m = tourMoi;
    if (!m || m.phase !== 'saisie' || enPause) return;
    if (x < 0 || x >= O.W * O.H) return;
    if (!O.voisin(m.pos, x)) {
      if (x !== m.pos) { sons.non(); toast(tr('saisie.loin'), 1300); }
      return;
    }
    m.taps.push(x);
    if (x === m.vrai[m.idx]) {
      if (m.idx === m.e.rv && m.err === 0) { m.gourde = true; sons.gourde(); toast(tr('saisie.gourde'), 1500, 'or'); }
      m.pos = x; m.idx++;
      effets.pas.push({ i: x, t0: horloge, coul: m.idx > m.e.ch.length ? OR : LANTERNE });
      sons.pas(m.idx);
    } else {
      m.err++;
      effets.erreurs.push({ i: x, t0: horloge });
      sons.erreur();
      secouer($('place-' + moi()));
      pisteSecousse = horloge;
      const reste = m.e.av[moi()] - m.err;
      if (reste > 0) toast(tr(m.err >= m.limite ? 'saisie.stop' : 'saisie.travers', { n: reste }), 1700, 'rouge');
      if (vue) { vue = copie(vue); vue.av[moi()] = Math.max(0, m.e.av[moi()] - m.err); }
    }
    if (m.idx >= m.vrai.length || m.err >= m.limite) finirMonTour();
    majInterface();
  }

  function finirMonTour() {
    const m = tourMoi;
    m.phase = 'envoi';
    const action = { s: m.s, p: m.taps.slice() };
    if (!partie || !partie.jouer(action)) {
      // L'action n'est pas partie (tour passé entre-temps) : on attend l'état suivant.
      tourMoi = null;
    }
  }

  function secouer(el) { if (!el) return; el.classList.remove('secoue'); void el.offsetWidth; el.classList.add('secoue'); }

  // ---------------------------------------------------------------------
  //  File des animations : course des autres, fins de nuit
  // ---------------------------------------------------------------------

  function demarrerAnim(item) {
    if (item.type === 'fin') { anim = { type: 'fin', t0: horloge, dur: 700, res: item.res }; return; }
    const ev = item.ev;
    const propre = ev.moi && !ev.auto && tourMoi && tourMoi.phase === 'envoi';
    if (ev.moi && ev.auto) { tourMoi = null; $('choix').classList.remove('actif'); toast(tr('multi.autoToi'), 2200); }
    const n = ev.action.p.length;
    // Course d'un autre coureur : 1,9 s au plus (la file du jeu ne prend pas de retard).
    const pasDur = propre ? 0 : Math.min(170, 1350 / Math.max(1, n));
    anim = { type: 'action', ev: ev, t0: horloge, pasDur: pasDur, dur: propre ? 500 : n * pasDur + 550, propre: propre, joues: 0, pos: ev.avant.dep, idx: 0 };
    if (!propre) {
      vue = ev.avant;
      effets = { pas: [], erreurs: [] };
      if (ev.action.s === 1) { sons.sprint(); toast(tr('autre.sprint', { nom: nomCoureur(ev.siege) }), 1600); }
    }
    majInterface();
  }

  // Avance de l'animation en cours ; renvoie true quand elle est finie.
  function avancerAnim() {
    const a = anim;
    if (!a) return false;
    const tm = horloge - a.t0;
    if (a.type === 'action' && !a.propre) {
      const vrai = a.ev.action.s === 1 ? a.ev.avant.ch.concat(a.ev.avant.ch2) : a.ev.avant.ch;
      while (a.joues < a.ev.action.p.length && tm >= (a.joues + 1) * a.pasDur) {
        const x = a.ev.action.p[a.joues];
        if (x === vrai[a.idx]) { a.pos = x; a.idx++; effets.pas.push({ i: x, t0: horloge, coul: COUL[a.ev.siege] }); sons.pas(a.idx); }
        else { effets.erreurs.push({ i: x, t0: horloge }); sons.erreur(); secouer($('place-' + a.ev.siege)); pisteSecousse = horloge; }
        a.joues++;
      }
    }
    return tm >= a.dur;
  }

  function finirAnim() {
    const a = anim;
    anim = null;
    if (a.type === 'fin') { montrerFin(a.res); return; }
    const ev = a.ev, d = ev.apres.der;
    vue = ev.apres;
    debutTour = Date.now();
    dernierTic = -1;
    if (ev.moi) { tourMoi = null; if (!ev.auto) bilanMonTour(d); }
    if (d && d.el) {
      sons.attrape();
      toast(ev.moi ? tr('attrape.toi') : tr('attrape.autre', { nom: nomCoureur(ev.siege) }), 2600, 'rouge');
      const carte = $('place-' + ev.siege); secouer(carte);
    } else if (d && d.g > 0 && !ev.moi) {
      toast(tr('autre.gain', { nom: nomCoureur(ev.siege), n: d.g }), 1600, 'or');
    }
    if (d && d.g > 0) { const carte = $('place-' + ev.siege); carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond'); if (ev.moi) { sons.gourde(); toast(tr('gain.toi', { n: d.g }), 1800, 'or'); } }
    if (!ev.moi && d && d.err === 0 && !d.el) note(880, 0.1, { vol: 0.04 });
    // Solo : attrapé, la nuit est perdue tout de suite.
    if (session === 'solo' && ev.moi && d && d.el && !soloFini) {
      soloFini = true;
      enPartie = false;
      setTimeout(() => { if (session === 'solo' && soloFini) afficherFinSolo(false, 0, null); }, 900);
    }
    majInterface();
  }

  // Dossards et statistiques après chacun de mes tours.
  function bilanMonTour(d) {
    if (!d || !nuitStats) return;
    if (d.gourde) { prog.gourdes++; if (prog.gourdes >= 5) gagnerDossard('gourdes'); }
    if (d.complet && d.err === 0) {
      if (d.ch.length >= 8) gagnerDossard('parfait');
      if (d.fx) gagnerDossard('follet');
      if (d.brume) gagnerDossard('brume');
      if (d.mq) gagnerDossard('masque');
      if (d.sp) { nuitStats.sprints++; gagnerDossard('sprint'); if (nuitStats.sprints >= 2) gagnerDossard('double'); }
    }
  }

  function gagnerDossard(cle) {
    if (prog.dossards.indexOf(cle) >= 0) return;
    prog.dossards.push(cle);
    if (nuitStats) nuitStats.nouveaux.push(cle);
    sons.dossard();
    setTimeout(() => toast(tr('dossard.gagne', { nom: tr('dossard.' + cle + '.nom') }), 2600, 'or'), 400);
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu') return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    if (!enPause) {
      horloge += dt * 1000;
      if (!anim && fileAnim.length && !attenteTuto) demarrerAnim(fileAnim.shift());
      if (anim && avancerAnim()) finirAnim();
      if (!anim && !fileAnim.length && !tourMoi && partie && !soloFini && !attenteTuto && !voileOuvert() && partie.monTour()) commencerMonTour();
      avancerMonTour();
      if (salonDemande && !anim && !fileAnim.length) { salonDemande = false; ouvrirSalon(); }
    }
    dessinerJeu(dt);
    majTemps();
    majCompte();
    majInfos();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(dt) {
    const cv = $('ville'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    dessinerPiste(dt);
    const e = vue;
    if (!e) { c.fillStyle = '#0a0b14'; c.fillRect(0, 0, w, h); return; }
    const g = geometrie(e, w, h, 8);
    geo = g;
    const t = horloge;
    const o = { t: t, lanternes: [], pas: [], erreurs: [], coureurs: [], poste: -1, brume: -1, gourde: -1, gourdeA: 0, voisines: [], vise: -1 };
    // empreintes et éclats qui s'effacent
    effets.pas = effets.pas.filter((p) => t - p.t0 < 4000);
    effets.erreurs = effets.erreurs.filter((p) => t - p.t0 < 1400);
    o.pas = effets.pas.map((p) => ({ i: p.i, coul: p.coul, a: Math.max(0, 1 - (t - p.t0) / 4000) * 0.85 }));
    o.erreurs = effets.erreurs.map((p) => ({ i: p.i, a: Math.max(0, 1 - (t - p.t0) / 1400) }));
    const m = moi();
    if (tourMoi && tourMoi.phase !== 'choix') {
      const tt = tourMoi, ee = tt.e, tm = t - tt.t0;
      o.poste = ee.dep;
      o.brume = ee.br;
      if (tt.phase === 'montre') {
        o.lanternes = lanternesAffichage(ee, tt.vrai, tm, tt.D, tt.pasL, ee.ch.length);
        if (ee.rv >= 0) { o.gourde = ee.ch[ee.rv]; o.gourdeA = tm > ee.rv * tt.pasL ? Math.max(0, Math.min(1, (tt.D + 350 - tm) / 350)) : 0; }
        o.coureurs.push({ s: m, x: ee.dep % ee.W, y: Math.floor(ee.dep / ee.W), tenue: maTenue(), lueur: 'rgba(255,180,80,.4)' });
      } else if (tt.phase === 'masque') {
        const tr2 = trajetMasque(ee), k = Math.min(tr2.length - 1, tm / PAS_MASQUE), k0 = Math.floor(k), f = k - k0;
        const a1 = tr2[k0], a2 = tr2[Math.min(tr2.length - 1, k0 + 1)];
        const x = (a1 % ee.W) * (1 - f) + (a2 % ee.W) * f, y = Math.floor(a1 / ee.W) * (1 - f) + Math.floor(a2 / ee.W) * f;
        const fin = tm > tr2.length * PAS_MASQUE ? Math.max(0, 1 - (tm - tr2.length * PAS_MASQUE) / 600) : 1;
        // le Coureur pâle porte les couleurs d'un concurrent… mais ses yeux le trahissent
        o.coureurs.push({ s: ee.mq.q, x: x, y: y, a: (0.75 + 0.25 * Math.sin(t / 60)) * fin, lueur: 'rgba(230,235,255,.35)', anneau: COUL[ee.mq.q] });
        for (let i = 1; i <= Math.min(k0, tr2.length - 1); i++) o.pas.push({ i: tr2[i], coul: '#dfe6ff', a: 0.35 * fin });
        o.coureurs.push({ s: m, x: ee.dep % ee.W, y: Math.floor(ee.dep / ee.W), tenue: maTenue() });
      } else {
        o.coureurs.push({ s: m, x: tt.pos % ee.W, y: Math.floor(tt.pos / ee.W), tenue: maTenue(), lueur: 'rgba(255,180,80,.45)' });
        if (tt.phase === 'saisie') {
          o.voisines = O.voisins(tt.pos);
          o.vise = survol >= 0 ? survol : curseur;
        }
      }
    } else if (anim && anim.type === 'action' && !anim.propre) {
      const a = anim, av = a.ev.avant;
      o.poste = av.dep;
      o.brume = av.br;
      const tm = t - a.t0, k = a.joues;
      // le coureur glisse vers sa case suivante
      let x = a.pos % av.W, y = Math.floor(a.pos / av.W);
      const prochain = a.ev.action.p[k];
      if (prochain !== undefined && a.pasDur > 0) {
        // vers la bonne case : il y va ; vers une mauvaise : il s'élance puis revient
        const f = Math.max(0, Math.min(1, (tm - k * a.pasDur) / a.pasDur));
        const vrai = a.ev.action.s === 1 ? av.ch.concat(av.ch2) : av.ch;
        const bout = prochain === vrai[a.idx] ? f : Math.sin(f * Math.PI) * 0.35;
        x += (prochain % av.W - x) * bout; y += (Math.floor(prochain / av.W) - y) * bout;
      }
      const elim = a.ev.apres.der && a.ev.apres.der.el && tm > a.dur - 550;
      o.coureurs.push({ s: a.ev.siege, x: x, y: y, lueur: COUL[a.ev.siege] + '66', a: elim ? Math.max(0, 1 - (tm - (a.dur - 550)) / 450) : 1, tenue: a.ev.siege === m ? maTenue() : null });
      if (elim) o.coureurs.push({ s: a.ev.siege, x: x, y: y - 0.1, pale: true, a: Math.min(1, (tm - (a.dur - 550)) / 250) });
    } else if (e && partie && partie.phase === 'jeu' && e.vi[e.tour]) {
      // en attente du coureur suivant, posé sur son poste
      o.poste = e.dep;
      const pulse = 1 + 0.06 * Math.sin(t / 220);
      o.coureurs.push({ s: e.tour, x: e.dep % e.W, y: Math.floor(e.dep / e.W), k: pulse, lueur: COUL[e.tour] + '55', tenue: e.tour === m ? maTenue() : null });
    }
    dessinerVille(c, e, g, o, w, h, dpr);
  }

  // Piste de poursuite : le Coureur pâle à gauche, chaque coureur à sa distance.
  function dessinerPiste(dt) {
    const cv = $('piste'), w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    const e = vue;
    const g = c.createLinearGradient(0, 0, w, 0);
    g.addColorStop(0, '#1d1f33'); g.addColorStop(1, '#10121f');
    c.fillStyle = g; rr(c, 6, 4, w - 12, h - 8, 12); c.fill();
    const x0 = 34, x1 = w - 22, pas = (x1 - x0) / O.AV_MAX;
    c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 1;
    for (let k = 1; k <= O.AV_MAX; k++) { c.beginPath(); c.moveTo(x0 + k * pas, 10); c.lineTo(x0 + k * pas, h - 10); c.stroke(); }
    const sec = horloge - pisteSecousse < 400 ? Math.sin((horloge - pisteSecousse) / 30) * 3 : 0;
    coureurPale(c, 18 + sec, h - 6, h * 0.82, horloge / 140, 0.95);
    if (!e) return;
    for (let s = 0; s < PLACES; s++) {
      const cible = e.vi[s] ? e.av[s] : 0;
      if (pisteAff[s] === undefined) pisteAff[s] = cible;
      pisteAff[s] += (cible - pisteAff[s]) * Math.min(1, dt * 5);
    }
    // Coureurs à la même distance : côte à côte, en quinconce, pour les voir tous.
    const r = Math.min(h * 0.19, 11);
    const groupes = {};
    for (let s = 0; s < PLACES; s++) { const k = e.vi[s] ? e.av[s] : 0; (groupes[k] = groupes[k] || []).push(s); }
    for (let s = 0; s < PLACES; s++) {
      const grp = groupes[e.vi[s] ? e.av[s] : 0], j = grp.indexOf(s), n = grp.length;
      const x = x0 + pisteAff[s] * pas + (j - (n - 1) / 2) * r * 1.15;
      const y = h / 2 + (n > 1 ? (j % 2 ? r * 0.55 : -r * 0.55) : 0);
      c.save();
      if (!e.vi[s]) c.globalAlpha = 0.3;
      medaillon(c, s, x, y, r, { tenue: s === moi() ? maTenue() : null });
      c.restore();
      if (s === e.tour && partie && partie.phase === 'jeu') { c.strokeStyle = COUL[s]; c.lineWidth = 2; rond(c, x, y, r + 3); c.stroke(); }
      if (s === moi()) { c.fillStyle = '#ffd27a'; c.beginPath(); c.moveTo(x - 4, y - r - 7); c.lineTo(x + 4, y - r - 7); c.lineTo(x, y - r - 2); c.closePath(); c.fill(); }
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': if (!soloFini) fileAnim.push({ type: 'action', ev: ev }); break;
      case 'fin': if (!soloFini) { fileAnim.push({ type: 'fin', res: ev.resultat }); if (partie.mode === 'en-ligne') finEnAttente = true; } break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      case 'refus': if (tourMoi && tourMoi.phase === 'envoi') tourMoi = null; break;   // coup refusé : le tour reprendra au début
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? copie(partie.etat) : null;
    fileAnim = []; anim = null; tourMoi = null;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') bandeau(tr('manche.attente'));
    else if (moi() < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente || anim || fileAnim.length) { salonDemande = !finEnAttente; return; }
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    $('choix').classList.remove('actif');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + (info.moi ? prog.tenue : '');
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 96, 96);
        medaillon(c, s, 48, 54, 36, { tenue: info.moi ? maTenue() : null });
        if (info.chef) couronne(c, 48, 22, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { coureur: tr('coureur.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (moi() < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomChef || tr('coureur.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    vue = copie(partie.etat);
    fileAnim = []; anim = null; tourMoi = null;
    effets = { pas: [], erreurs: [] };
    pisteAff = [];
    debutTour = Date.now();
    dernierTic = -1;
    curseur = -1;
    $('choix').classList.remove('actif');
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    salonDemande = false;
    lancement = false;
    nuitStats = { sprints: 0, nouveaux: [], sprintTente: false };
    if (moi() >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (moi() >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de nuit : victoire, défaite, classement
  // ---------------------------------------------------------------------

  // Ai-je gagné ? Encore debout, avec la plus grande avance des coureurs debout.
  function gagnant(e, s) {
    if (s < 0 || !e.vi[s]) return false;
    let max = 0;
    for (let k = 0; k < e.vi.length; k++) if (e.vi[k]) max = Math.max(max, e.av[k]);
    return e.av[s] === max;
  }

  function etoilesPour(av, av0) { return av >= av0 ? 3 : av >= av0 - 1 ? 2 : 1; }

  function montrerFin(res) {
    const e = vue || (partie && partie.etat);
    if (!e || !partie) return;
    if (partie.mode === 'en-ligne') { afficherFinEnLigne(e, res); return; }
    const s = moi(), gagne = gagnant(e, s);
    if (session === 'solo') { if (!soloFini) afficherFinSolo(gagne, e.av[s] || 0, e); }
    else afficherFinRobots(e, gagne);
  }

  function remplirClassement(e, boite) {
    boite.textContent = '';
    const res = R.fin(e) || { classement: [0, 1, 2, 3, 4] };
    const sieges = siegesActuels(), m = moi();
    let rang = 0, prec = null;
    res.classement.forEach((s, k) => {
      const cleRang = e.vi[s] ? 'v' + e.av[s] : 'e' + k;
      if (cleRang !== prec) { rang = k + 1; prec = cleRang; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === m ? ' moi' : '') + (e.vi[s] ? '' : ' hors');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; medaillon(cv.getContext('2d'), s, 30, 30, 26, { tenue: s === m ? maTenue() : null });
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === m ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('coureur.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = e.vi[s] ? tr('place.foulees', { n: e.av[s] }) : tr('place.attrape');
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  // Fin d'une nuit solo (gagnée, ou perdue : attrapé, ou moins d'avance qu'un autre).
  function afficherFinSolo(gagne, av, e) {
    const i = niveau - 1, nuit = NIVEAUX[i];
    enPartie = false;
    tourMoi = null;
    $('choix').classList.remove('actif');
    if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    const ef = e || vue;
    if (ef) remplirClassement(ef, $('fin-classement')); else $('fin-classement').textContent = '';
    const zone = $('fin-etoiles');
    zone.textContent = '';
    let etoiles = 0, debloque = false, record = false;
    if (gagne) {
      etoiles = etoilesPour(av, nuit.av);
      record = av > prog.records[i];
      if (record) prog.records[i] = av;
      prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
      if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
      if (niveau === 1) gagnerDossard('premier');
      if (niveau === NIVEAUX.length) gagnerDossard('minuit');
      if (ef && ef.el.length === PLACES - 1) gagnerDossard('dernier');
      if (ef && ef.te[moi()] === 0) gagnerDossard('intact');
      sauver(Math.min(niveau + 1, NIVEAUX.length), av);
      // Parcours terminé (toutes les nuits gagnées, maintenant ou avant) : total des meilleures étoiles.
      if (prog.etoiles.every((x) => x > 0)) {
        if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
      }
    } else sauver(niveau, 0);
    for (let k = 0; k < 3; k++) {
      const sp = document.createElement('span'); sp.textContent = '★';
      if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
      zone.appendChild(sp);
    }
    zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
    zone.style.display = '';
    $('fin-titre').textContent = gagne ? tr('fin.gagne') : (soloFini ? tr('fin.attrape') : tr('fin.perdu'));
    $('fin-points').textContent = gagne ? tr('fin.avance', { n: av }) : (soloFini ? tr('fin.attrapeTexte') : tr('fin.perduTexte'));
    $('fin-record').textContent = gagne ? (record ? tr('fin.nouveauRecord') : tr('fin.record', { n: prog.records[i] })) : '';
    $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
    const nouveaux = nuitStats ? nuitStats.nouveaux : [];
    $('fin-dossards').textContent = nouveaux.length ? tr('fin.dossards', { liste: nouveaux.map((k) => tr('dossard.' + k + '.nom')).join(', ') }) : '';
    $('fin-compte').textContent = '';
    if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
    boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
    boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
    if (nuitStats) nuitStats.nouveaux = [];
  }

  // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil.
  function afficherFinRobots(e, gagne) {
    if (moi() >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: partie.manche || 1 });
    remplirClassement(e, $('fin-classement'));
    $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
    $('fin-etoiles').textContent = '';
    $('fin-etoiles').style.display = 'none';
    $('fin-points').textContent = '';
    $('fin-record').textContent = '';
    $('fin-debloque').textContent = '';
    $('fin-dossards').textContent = '';
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    majCompte();
    boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Fin d'une manche en ligne : le classement, puis le salon (même écran).
  function afficherFinEnLigne(e) {
    finEnAttente = false;
    const s = moi(), gagne = gagnant(e, s);
    if (s >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: partie.manche || 1 });
    if (s >= 0) gagnerDossard('meute');
    remplirClassement(e, $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    tourMoi = null;
    ouvrirSalon();
  }

  // Compte à rebours avant la manche suivante (partie repassée contre des robots).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const texte = $('voile-fin').classList.contains('actif') ? tr('manche.prochaine') : '';
    if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte;
  }

  // Cendres dorées de victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 110 + Math.random() * 150, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 3 ? COUL[i % 5] : OR, k: 5 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.shadowColor = b.coul; c.shadowBlur = 6; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, nuits, vestiaire
  // ---------------------------------------------------------------------

  function quitterPartie() {
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    soloFini = false;
    vue = null;
    fileAnim = []; anim = null; tourMoi = null;
    bandeau('');
    $('choix').classList.remove('actif');
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon'].forEach(fermerVoile);
    resultatSalon = null;
    finEnAttente = false;
    salonDemande = false;
    lancement = false;
  }

  // Nuit solo n contre 4 robots (force croissante, donnée par la nuit).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    quitterPartie();
    session = 'solo';
    enPartie = true;
    nuitStats = { sprints: 0, nouveaux: [], sprintTente: false };
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: NIVEAUX[niveau - 1].fr, options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Course avec d'autres joueurs : manches au salon, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    nuitStats = { sprints: 0, nouveaux: [], sprintTente: false };
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const grille = $('grille-niveaux');
    grille.textContent = '';
    NIVEAUX.forEach((nuit, i) => {
      const n = i + 1, ouvert = n <= prog.debloque;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
      b.append(num, et);
      if (nuit.tuto && ouvert) { const nv = document.createElement('span'); nv.className = 'neuf'; nv.textContent = tr('tuto.' + nuit.tuto + '.court'); b.appendChild(nv); }
      b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
      else b.disabled = true;
      grille.appendChild(b);
    });
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
  }

  function ouvrirVestiaire() {
    const gt = $('grille-tenues');
    gt.textContent = '';
    const total = totalEtoiles();
    TENUES.forEach((t) => {
      const ouvert = total >= t.seuil;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tenue' + (ouvert ? '' : ' ferme') + (prog.tenue === t.id ? ' choisie' : '');
      const cv = document.createElement('canvas'); cv.width = 128; cv.height = 144;
      const c = cv.getContext('2d');
      if (ouvert) coureur(c, 60, 136, 120, t.coul, 0.9, optionsTenue(t));
      else { c.globalAlpha = 0.35; coureur(c, 60, 136, 120, '#3a4060', 0.9); }
      const nom = document.createElement('b'); nom.textContent = tr('tenue.' + t.id);
      const sous = document.createElement('span');
      sous.textContent = ouvert ? (prog.tenue === t.id ? tr('tenue.portee') : tr('tenue.choisir')) : tr('tenue.seuil', { n: t.seuil });
      b.append(cv, nom, sous);
      b.setAttribute('aria-pressed', prog.tenue === t.id ? 'true' : 'false');
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); prog.tenue = t.id; sauverReglages(); ouvrirVestiaire(); });
      else b.disabled = true;
      gt.appendChild(b);
    });
    const gd = $('grille-dossards');
    gd.textContent = '';
    DOSSARDS.forEach((k) => {
      const oui = prog.dossards.indexOf(k) >= 0;
      const d = document.createElement('div');
      d.className = 'dossard' + (oui ? ' oui' : '');
      const cv = document.createElement('canvas'); cv.width = 124; cv.height = 124;
      dessinDossard(cv.getContext('2d'), k, 124, 124, oui);
      const nom = document.createElement('b'); nom.textContent = oui ? tr('dossard.' + k + '.nom') : tr('dossard.cache');
      const cond = document.createElement('span'); cond.textContent = tr('dossard.' + k + '.cond');
      d.append(cv, nom, cond);
      gd.appendChild(d);
    });
    $('ves-total').textContent = tr('vestiaire.compte', { n: prog.dossards.length, max: DOSSARDS.length });
    afficherEcran('vestiaire');
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés (mini-ville 4 × 4, main qui touche les cases)
  // ---------------------------------------------------------------------

  // Scènes : chemin ch depuis dep ; fx faux balisage ; br brume ; rv gourde ;
  // ch2 suite de sprint ; mq masque ; err : case où la main se trompe d'abord.
  const TUTOS = {
    base: { dep: 12, ch: [8, 9, 5, 6], err: 13 },
    faux: { dep: 12, ch: [8, 9, 10, 6], fx: [4, 0] },
    brume: { dep: 12, ch: [13, 9, 5, 6], br: 1 },
    gourde: { dep: 12, ch: [8, 9, 10, 11], rv: 2 },
    sprint: { dep: 12, ch: [8, 9, 5], ch2: [6, 7, 3] },
    vite: { dep: 12, ch: [13, 14, 10, 6, 2], vite: true },
    masque: { dep: 12, ch: [8, 9, 10, 6], mq: { k: 2, c: 5, d: [1] } },
    serre: { dep: 12, ch: [8, 4, 5, 6], piste: true }
  };

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const e = { W: 4, H: 4, br: d.br === undefined ? -1 : d.br, fx: d.fx || [], ch: d.ch, dep: d.dep };
    const vrai = d.ch2 ? d.ch.concat(d.ch2) : d.ch.slice();
    // mini-ville centrée (à gauche quand la piste de poursuite est montrée à droite)
    const g = d.piste ? { s: 74, ox: 24, oy: 52, W: 4, H: 4 } : { s: 84, ox: 112, oy: 32, W: 4, H: 4 };
    const pasL = d.vite ? 170 : 300, D = vrai.length * pasL + (d.vite ? 500 : 1100);
    const trajetMq = d.mq ? [d.dep].concat(d.ch.slice(0, d.mq.k), [d.mq.c], d.mq.d) : [];
    const T_MQ = d.mq ? trajetMq.length * 330 + 500 : 0;
    const gestes = d.err !== undefined ? [d.err].concat(vrai) : vrai.slice();
    const T_GESTE = 620;
    const total = D + 400 + T_MQ + gestes.length * T_GESTE + 1400;
    let debut = 0;
    const j = ++tutoAnim;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const tm = (t - debut) % total;
      const o = { t: t, fond: false, lanternes: [], pas: [], erreurs: [], coureurs: [], poste: d.dep, brume: e.br, gourde: -1, gourdeA: 0, voisines: [], vise: -1 };
      let pos = d.dep;
      if (tm < D + 400) {
        o.lanternes = lanternesAffichage(e, vrai, tm, D, pasL, d.ch.length);
        if (d.rv !== undefined) { o.gourde = d.ch[d.rv]; o.gourdeA = tm > d.rv * pasL ? Math.max(0, Math.min(1, (D + 350 - tm) / 350)) : 0; }
      } else if (tm < D + 400 + T_MQ) {
        const k = Math.min(trajetMq.length - 1, (tm - D - 400) / 330), k0 = Math.floor(k), f = k - k0;
        const a1 = trajetMq[k0], a2 = trajetMq[Math.min(trajetMq.length - 1, k0 + 1)];
        o.coureurs.push({ s: 2, x: (a1 % 4) * (1 - f) + (a2 % 4) * f, y: Math.floor(a1 / 4) * (1 - f) + Math.floor(a2 / 4) * f, a: 0.8, anneau: COUL[2], lueur: 'rgba(230,235,255,.35)' });
        if (k0 >= d.mq.k + 1) o.erreurs.push({ i: d.mq.c, a: 0.8 });
      } else {
        const tg = tm - D - 400 - T_MQ, k = Math.floor(tg / T_GESTE);
        let idx = 0;
        for (let q = 0; q < Math.min(k, gestes.length); q++) {
          const x = gestes[q];
          if (x === vrai[idx]) { o.pas.push({ i: x, coul: idx >= d.ch.length ? OR : LANTERNE, a: 0.9 }); pos = x; idx++; }
          else if (tg - q * T_GESTE < 1300) o.erreurs.push({ i: x, a: 1 - (tg - q * T_GESTE) / 1300 });
        }
        if (d.rv !== undefined && idx > d.rv) o.gourde = -1;
        if (k < gestes.length) {
          const cible = centre(g, gestes[k]), f = (tg - k * T_GESTE) / T_GESTE;
          o.main = { x: cible[0] + 60 * (1 - Math.min(1, f * 2)), y: cible[1] + 50 * (1 - Math.min(1, f * 2)), appui: f > 0.5 ? 1 : 0 };
        }
      }
      o.coureurs.push({ s: 0, x: pos % 4, y: Math.floor(pos / 4), tenue: maTenue(), lueur: 'rgba(255,180,80,.4)' });
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 400);
      dessinerVille(c, e, g, o, 560, 400, 1);
      if (d.piste) {
        // la piste : le Coureur pâle juste derrière, 3 foulées d'avance
        c.fillStyle = '#1d1f33'; rr(c, 344, 120, 200, 140, 14); c.fill();
        coureurPale(c, 368, 248, 110, t / 140, 1);
        for (let k = 0; k < 3; k++) { c.fillStyle = COUL[0]; c.shadowColor = COUL[0]; c.shadowBlur = 8; rond(c, 420 + k * 26, 190, 8); c.fill(); }
        c.shadowBlur = 0;
        medaillon(c, 0, 512, 190, 20, { tenue: maTenue() });
      }
      if (o.main) mainTuto(c, o.main.x, o.main.y, o.main.appui);
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // Main qui montre le geste (tutoriel).
  function mainTuto(c, x, y, appui) {
    c.save();
    c.translate(x, y); c.scale(1.5, 1.5);
    if (appui) { c.strokeStyle = 'rgba(255,210,122,.8)'; c.lineWidth = 3; rond(c, 0, 0, 16); c.stroke(); }
    c.fillStyle = '#f4d3b5'; c.strokeStyle = '#7a4a2a'; c.lineWidth = 2;
    c.beginPath();
    c.moveTo(-3, 0); c.lineTo(-3, 18); c.quadraticCurveTo(-14, 14, -13, 24); c.lineTo(-2, 40); c.lineTo(18, 40);
    c.quadraticCurveTo(24, 28, 22, 18); c.lineTo(20, 10); c.quadraticCurveTo(16, 7, 13, 10); c.quadraticCurveTo(10, 5, 6, 8);
    c.lineTo(5, 0); c.quadraticCurveTo(1, -5, -3, 0); c.closePath();
    c.fill(); c.stroke();
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  let geo = null, survol = -1;
  const ville = $('ville');
  function caseSous(ev) {
    if (!geo) return -1;
    const r = ville.getBoundingClientRect();
    const x = ev.clientX - r.left - geo.ox, y = ev.clientY - r.top - geo.oy;
    if (x < 0 || y < 0) return -1;
    const cx = Math.floor(x / geo.s), cy = Math.floor(y / geo.s);
    if (cx >= geo.W || cy >= geo.H) return -1;
    return cy * geo.W + cx;
  }
  ville.addEventListener('pointerdown', (ev) => {
    audio();
    survol = caseSous(ev);
    if (tourMoi && tourMoi.phase === 'saisie') { const x = caseSous(ev); if (x >= 0) taper(x); }
    else if (partie && partie.phase === 'jeu' && !tourMoi && vue && Date.now() - dernierAttends > 1500) {
      dernierAttends = Date.now();
      if (vue.vi[moi()] === 1) { toast(tr('tour.attends'), 1300); sons.non(); }
    }
  });
  ville.addEventListener('pointermove', (ev) => { if (ev.pointerType === 'mouse') survol = caseSous(ev); });
  ville.addEventListener('pointerleave', () => { survol = -1; });
  ville.addEventListener('pointerup', (ev) => { if (ev.pointerType !== 'mouse') survol = -1; });
  let dernierAttends = 0;

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert() || $('voile-fin').classList.contains('actif')) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else { audio(); ouvrirPause(); }
      return;
    }
    if (enPause) return;
    const dirs = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -O.W, ArrowDown: O.W, KeyA: -1, KeyD: 1, KeyW: -O.W, KeyS: O.W };
    if (tourMoi && tourMoi.phase === 'choix') {
      if (ev.code === 'ArrowLeft') { ev.preventDefault(); $('btn-normal').focus(); }
      else if (ev.code === 'ArrowRight') { ev.preventDefault(); $('btn-sprint').focus(); }
      return;
    }
    if (dirs[ev.code] !== undefined && tourMoi && tourMoi.phase === 'saisie') {
      ev.preventDefault(); audio();
      const p = tourMoi.pos, d = dirs[ev.code];
      const x = p + d;
      if (O.voisin(p, x)) { curseur = -1; taper(x); } else sons.non();
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-vestiaire').addEventListener('click', () => { audio(); sons.clic(); ouvrirVestiaire(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('ves-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-normal').addEventListener('click', () => { audio(); sons.clic(); lancerAffichage(0); });
  $('btn-sprint').addEventListener('click', () => { audio(); sons.clic(); lancerAffichage(1); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une nuit solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo' && !soloFini) sauver(niveau, vue && moi() >= 0 ? vue.av[moi()] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(performance.now()); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
