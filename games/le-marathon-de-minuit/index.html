    if (sansLune) { c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(0, 0, w, h); }
    // particules
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      if (p.etoile) etincelle(c, p.x, p.y, p.k); else { rond(c, p.x, p.y, p.k * 0.5); c.fill(); }
      c.globalAlpha = 1;
    }
    if (sc && moi >= 0 && aff && aff.el[moi] >= 0) { c.fillStyle = 'rgba(8,10,18,.25)'; c.fillRect(0, 0, w, h); }
  }

  // Résultat d'un tracé qui vient de finir, en surimpression qui s'estompe :
  // le vrai chemin en pointillés rouges et la case fautive, ou l'éclat du poste.
  function dessinerResultat(c, sc, a) {
    const g = sc.g, s = geo.s, L = g.ch.length - 1;
    c.save();
    c.globalAlpha = Math.max(0, Math.min(1, a));
    if (!sc.fin.ok) {
      c.strokeStyle = 'rgba(255,90,90,.6)'; c.lineWidth = s * 0.1; c.lineCap = 'round'; c.lineJoin = 'round';
      c.setLineDash([s * 0.12, s * 0.14]);
      c.beginPath(); g.ch.forEach((q, k) => { if (k) c.lineTo(cx(q), cy(q)); else c.moveTo(cx(q), cy(q)); }); c.stroke();
      c.setLineDash([]);
      const q = sc.fin.c;
      if (q >= 0) {
        c.fillStyle = 'rgba(255,60,60,.45)'; rr(c, geo.ox + (q % W) * s + 3, geo.oy + Math.floor(q / W) * s + 3, s - 6, s - 6, s * 0.12); c.fill();
        c.strokeStyle = '#ff6b6b'; c.lineWidth = s * 0.08;
        ligne(c, cx(q) - s * 0.2, cy(q) - s * 0.2, cx(q) + s * 0.2, cy(q) + s * 0.2);
        ligne(c, cx(q) + s * 0.2, cy(q) - s * 0.2, cx(q) - s * 0.2, cy(q) + s * 0.2);
      }
    } else {
      sc.pas.forEach((p) => { if (p.ok) empreinte(c, cx(p.c), cy(p.c), s * 0.5, 0.9); });
      lueur(c, cx(g.ch[L]), cy(g.ch[L]), s * 1.3, 'rgba(255,207,58,.55)');
    }
    c.restore();
  }

  function dessinerScene(c, sc, ph, t) {
    const g = sc.g, s = geo.s, L = g.ch.length - 1;
    const el = horloge - sc.t0 + (sc.saut || 0);
    const visible = (k) => {
      if (ph !== 'allume' || !g.cas || sc.robot) return true;
      const pasC = Math.min(260, (g.aff * 0.55) / (L + 1));
      return el >= (g.cas === 2 ? L - k : k) * pasC;
    };
    const fin = sc.fin, revele = fin && !fin.ok && horloge - fin.t < FIN_LEG_MS;
    if (ph === 'allume' || revele || (!sc.moi && ph === 'marche')) {
      const a = ph === 'allume' ? 1 : (revele ? 0.55 : 0.2);
      // traits entre les lanternes
      c.strokeStyle = revele ? 'rgba(255,90,90,.45)' : 'rgba(255,179,71,' + (0.32 * a) + ')';
      c.lineWidth = s * 0.1; c.lineCap = 'round'; c.lineJoin = 'round';
      if (revele) c.setLineDash([s * 0.12, s * 0.14]);
      c.beginPath();
      let ouvert = false;
      for (let k = 0; k <= L; k++) {
        if (!visible(k)) { ouvert = false; continue; }
        if (!ouvert) { c.moveTo(cx(g.ch[k]), cy(g.ch[k])); ouvert = true; } else c.lineTo(cx(g.ch[k]), cy(g.ch[k]));
      }
      c.stroke(); c.setLineDash([]);
      for (let k = 1; k <= L; k++) {
        if (!visible(k)) continue;
        const q = g.ch[k];
        if (k === L) poste(c, cx(q), cy(q), s * 0.36, '#ffcf3a', t);
        else if (g.mi === k) poste(c, cx(q), cy(q), s * 0.32, '#d7dce8', t);
        else if (ph !== 'allume' || g.br.indexOf(k) < 0 || sc.robot) lanterne(c, cx(q), cy(q), s * 0.2, t, LANTERNE, a);
        if (ph === 'allume' && g.rv.indexOf(k) >= 0) gobelet(c, cx(q) + s * 0.24, cy(q) - s * 0.22, s * 0.15);
      }
      if (ph === 'allume') {
        g.fx.forEach((q) => follet(c, cx(q), cy(q), s * 0.22, t));
        if (!sc.robot) g.br.forEach((k) => nappe(c, cx(g.ch[k]), cy(g.ch[k]), s * 0.62, t));
      }
    }
    if (ph === 'sosie' && g.ec) {
      // Le sosie : une silhouette de concurrent repasse un faux tracé.
      const q = Math.min(1, (el - g.aff) / SOSIE_MS), n = g.ec.length - 1, pos = q * n, k = Math.min(n, Math.floor(pos));
      for (let i = 1; i <= k; i++) lanterne(c, cx(g.ec[i]), cy(g.ec[i]), s * 0.2, t, LANTERNE, 0.85);
      const a = g.ec[k], bq = g.ec[Math.min(n, k + 1)], f = pos - k;
      const x = cx(a) + (cx(bq) - cx(a)) * f, y = cy(a) + (cy(bq) - cy(a)) * f;
      coureur(c, x, y + s * 0.36, s * 0.72, COUL[sc.leurre], t * 10, -1, true);
      palePerso(c, x + s * 0.06, y + s * 0.38, s * 0.74, t, 0.3);
    }
    // poste de départ, empreintes, coureur
    poste(c, cx(g.ch[0]), cy(g.ch[0]), s * 0.36, COUL[sc.s], t);
    sc.pas.forEach((p) => {
      if (!p.tire) return;
      if (p.ok) empreinte(c, cx(p.c), cy(p.c), s * 0.5, 0.9);
      else {
        const v = Math.max(0, 1 - (horloge - p.tt) / 1400);
        c.fillStyle = 'rgba(255,60,60,' + (0.25 + 0.4 * v) + ')'; rr(c, geo.ox + (p.c % W) * s + 3, geo.oy + Math.floor(p.c / W) * s + 3, s - 6, s - 6, s * 0.12); c.fill();
        c.strokeStyle = '#ff6b6b'; c.lineWidth = s * 0.08; c.lineCap = 'round';
        ligne(c, cx(p.c) - s * 0.2, cy(p.c) - s * 0.2, cx(p.c) + s * 0.2, cy(p.c) + s * 0.2);
        ligne(c, cx(p.c) + s * 0.2, cy(p.c) - s * 0.2, cx(p.c) - s * 0.2, cy(p.c) + s * 0.2);
      }
    });
    if (fin && fin.ok && horloge - fin.t < FIN_LEG_MS) lueur(c, cx(g.ch[L]), cy(g.ch[L]), s * (0.8 + (horloge - fin.t) / 900), 'rgba(255,207,58,.5)');
    // le coureur glisse d'une case à l'autre
    const k2 = Math.min(1, (horloge - sc.posT) / 150);
    const x = cx(sc.posDe) + (cx(sc.pos) - cx(sc.posDe)) * k2, y = cy(sc.posDe) + (cy(sc.pos) - cy(sc.posDe)) * k2;
    coureur(c, x, y + s * 0.36, s * 0.7, COUL[sc.s], k2 < 1 || ph === 'marche' ? t * 10 : t * 2, sc.s === moiSiege() ? prog.tenue : -1);
  }

  // ---------------------------------------------------------------------
  //  Effets planifiés et pas animés
  // ---------------------------------------------------------------------

  function planifier(t, f) { minuterie.push({ t: t, f: f }); }
  function viderMinuterie() { const l = minuterie; minuterie = []; l.forEach((x) => x.f()); }
  function avancerMinuterie() {
    if (!minuterie.length) return;
    const prets = minuterie.filter((x) => x.t <= horloge);
    if (!prets.length) return;
    minuterie = minuterie.filter((x) => x.t > horloge);
    prets.forEach((x) => x.f());
  }

  function jaillir(cell, coul, nbre, etoile) {
    if (!geo) return;
    for (let k = 0; k < nbre; k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 160;
      particules.push({ x: cx(cell), y: cy(cell), vx: Math.cos(a) * v, vy: Math.sin(a) * v - 90, g: 260, vie: 0.6 + Math.random() * 0.5, k: geo.s * (0.07 + Math.random() * 0.06), coul: k % 2 ? coul : '#ffe7a8', etoile: etoile && k % 3 !== 0 });
    }
  }

  // Un pas qui apparaît à l'écran (tout de suite pour un joueur, en différé pour un robot).
  function tirerPas(sc, p, k) {
    p.tire = true; p.tt = horloge;
    if (p.ok) {
      sc.posDe = sc.pos; sc.pos = p.c; sc.posT = horloge;
      sons.pas(k);
      if (sc.g.rv.indexOf(k) >= 0) { sons.ravito(); jaillir(p.c, '#5cc0ff', 12, true); toast(sc.s === moiSiege() ? tr('ravito.toi') : tr('ravito.autre', { nom: nomDe(sc.s) }), 2000, 2); }
      if (k === sc.g.ch.length - 1) {
        sons.poste(); jaillir(p.c, '#ffcf3a', 22, true);
        sc.fin = { t: horloge, ok: true };
        if (sc.g.sp) toast(sc.s === moiSiege() ? tr('sprint.reussiToi') : tr('sprint.reussi', { nom: nomDe(sc.s) }), 2200, 2);
      } else if (sc.g.mi === k) { sons.poste(); jaillir(p.c, '#d7dce8', 12, true); }
    } else {
      sons.faux(); secouer();
      jaillir(p.c, '#9ad7ff', 16, false);
      sc.fin = { t: horloge, ok: false, c: p.c };
      const carte = $('place-' + sc.s);
      carte.classList.remove('choc'); void carte.offsetWidth; carte.classList.add('choc');
      toast(sc.s === moiSiege() ? tr('erreur.toi') : tr('erreur.autre', { nom: nomDe(sc.s) }), 2400, 2);
    }
  }

  // Ce qui change entre deux états (éliminations, Coureur pâle pressé, tracé plus long).
  function annoncer(av, ap) {
    const moi = moiSiege();
    if (ap.r > av.r && ap.cfg.g && (ap.r - 1) % ap.cfg.g === 0 && O.vivants(ap) > 1) toast(tr('trace.allonge'), 2000, 1);
    if (ap.np > av.np && ap.pv >= 0) {
      sons.pale();
      const carte = $('place-' + ap.pv);
      carte.classList.remove('choc'); void carte.offsetWidth; carte.classList.add('choc');
      toast(ap.pv === moi ? tr('pale.presseToi') : tr('pale.presse', { nom: nomDe(ap.pv) }), 2600, 3);
    }
    for (let s = 0; s < PLACES; s++) {
      if (av.el[s] === -1 && ap.el[s] >= 0) {
        sons.elimine();
        toast(s === moi ? tr('elimine.toi') : tr('elimine.autre', { nom: nomDe(s) }), 2800, 4);
      }
    }
  }

  function appliquerAff(ap) {
    const av = aff;
    aff = copie(ap);
    if (av) annoncer(av, aff);
    majInterface();
    const moi = moiSiege();
    if (partie && partie.phase === 'jeu' && moi >= 0 && aff.el[moi] === -1 && aff.tour === moi && O.vivants(aff) > 1) sons.tour();
    // Solo : rattrapé, la nuit est perdue (inutile d'attendre la fin des robots).
    if (session === 'solo' && moi >= 0 && aff.el[moi] >= 0 && !finSoloLancee) {
      finSoloLancee = true;
      const etat = copie(aff), j = jeton;
      setTimeout(() => { if (j === jeton) finSoloPerdue(etat); }, 1300);
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      case 'refus': departEnvoye = false; break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800, 2);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? copie(partie.etat) : null;
    if (vue) aff = copie(vue);
    scene = null; minuterie = [];
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') bandeau(tr('manche.attente'));
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  function surAction(ev) {
    const a = ev.action || {}, av = ev.avant, ap = ev.apres, s = ev.siege, moi = moiSiege();
    vue = copie(ap);
    departEnvoye = false;
    departT = 0;
    if (O.vivants(av) <= 1) {
      // Le dernier coureur debout franchit la ligne d'arrivée.
      viderMinuterie();
      scene = null;
      sons.ligne();
      appliquerAff(ap);
      return;
    }
    if (!av.leg) { appliquerAff(ap); return; }
    let tFin = horloge;
    if (av.leg.k === 0) {
      // Départ d'un tracé (et, pour un robot, tout son tracé d'un coup).
      viderMinuterie();
      if (scene && scene.fin && horloge - scene.fin.t < FIN_LEG_MS) traceFin = scene;
      const e2 = copie(av);
      O.demarrer(e2, a.d);
      const g = e2.leg;
      const robot = Array.isArray(a.cs) && (s !== moi || ev.auto);
      let leurre = (s + 1 + Math.floor(Math.random() * (PLACES - 1))) % PLACES;
      scene = { s: s, g: g, t0: horloge, moi: s === moi && !robot, robot: robot, pas: [], pos: g.ch[0], posDe: g.ch[0], posT: 0, fin: null, saut: 0, leurre: leurre, sonnes: 0 };
      if (a.d === 1) { sons.sprint(); toast(s === moi ? tr('sprint.toi') : tr('sprint.autre', { nom: nomDe(s) }), 1800, 2); }
      else sons.allume();
      if (g.ec) planifier(horloge + (robot ? ROBOT_VUE : g.aff), () => { if (scene && scene.g === g && !robot) sons.sosie(); });
      if (!robot && scene.moi) planifier(horloge + g.aff + (g.ec ? SOSIE_MS : 0), () => { if (scene && scene.g === g && !scene.pas.length && !scene.saut) sons.eteint(); });
      if (Array.isArray(a.cs)) {
        const sc = scene;
        const n = a.cs.length, pasMs = Math.max(60, Math.min(200, (R.delaiBot - 260 - (robot ? ROBOT_VUE : 0)) / Math.max(1, n)));
        const t1 = horloge + (robot ? ROBOT_VUE : 0);
        for (let i = 0; i < n; i++) {
          const k = i + 1, p = { c: a.cs[i], ok: a.cs[i] === g.ch[k], tire: false };
          sc.pas.push(p);
          tFin = t1 + i * pasMs;
          planifier(tFin, () => tirerPas(sc, p, k));
          if (!p.ok) break;
        }
      }
    } else {
      // Pas d'un joueur (un par toucher).
      if (!scene || scene.s !== s) {
        const g = copie(av.leg);
        scene = { s: s, g: g, t0: horloge - 99999, moi: s === moi, robot: false, pas: [], pos: g.ch[av.leg.k - 1], posDe: g.ch[av.leg.k - 1], posT: 0, fin: null, saut: 0, leurre: 0, sonnes: 0 };
      }
      const sc = scene, suite = Array.isArray(a.cs) ? a.cs : [a.c];
      let k = av.leg.k;
      for (let i = 0; i < suite.length; i++) {
        const p = { c: suite[i], ok: suite[i] === av.leg.ch[k], tire: false }, kk = k;
        sc.pas.push(p);
        tFin = horloge + i * 140;
        if (i === 0) tirerPas(sc, p, kk); else planifier(tFin, () => tirerPas(sc, p, kk));
        if (!p.ok) break;
        k++;
      }
    }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'), 2000, 2);
    if (tFin > horloge) planifier(tFin + 30, () => appliquerAff(ap));
    else appliquerAff(ap);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surManche() {
    jeton++;
    vue = copie(partie.etat);
    aff = copie(vue);
    scene = null; minuterie = []; particules = [];
    departT = 0; departEnvoye = false; finSoloLancee = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche, nom: tr('nuit.' + (vue.n + 1)) }), 2600); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surFin(res) {
    if (session === 'solo' && finSoloLancee) return;   // déjà rattrapé : la défaite s'affiche
    const j = jeton;
    if (session === 'solo') enPartie = false;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    const etat = copie(partie.etat), moi = moiSiege();
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      viderMinuterie();
      if (enLigne) afficherFinEnLigne(etat, res);
      else afficherFin(!!res && res.classement[0] === moi, etat);
    }, 900);
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la course,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 92, 92);
        medaillon(c, s, 46, 50, 38, info.moi ? prog.tenue : undefined, false);
        if (info.chef) couronne(c, 46, 20, 24);
        remplirTag(d.querySelector('.tag'), role, nom, false);
        d.setAttribute('aria-label', tr('salon.place.' + role, { nom: tr('nom.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomChef || tr('nom.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  // Fin d'une course en ligne : le classement, puis le salon (même écran).
  function afficherFinEnLigne(e, res) {
    finEnAttente = false;
    if (!e) return;
    const moi = moiSiege();
    const gagne = moi >= 0 && !!res && res.classement[0] === moi;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de nuit : victoire, défaite, classement
  // ---------------------------------------------------------------------

  // Ordre de la course : coureurs debout (plus d'avance d'abord), puis rattrapés (le dernier rattrapé d'abord).
  function ordreCourse(e) {
    const l = [];
    for (let s = 0; s < PLACES; s++) if (e.el[s] !== -2) l.push(s);
    const cle = (s) => (e.el[s] === -1 ? 1000 + e.av[s] : e.el[s]);
    return l.sort((x, y) => (cle(y) - cle(x)) || (e.po[y] - e.po[x]) || (x - y));
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    ordreCourse(e).forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; medaillon(cv.getContext('2d'), s, 30, 30, 28, s === moi ? prog.tenue : undefined, e.el[s] >= 0);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = role === 'joueur' && info.nom ? info.nom : tr('nom.' + s) + ' · ' + tr('place.' + role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.postesCourt', { n: e.po[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function etoilesPour(av) { return av >= 3 ? 3 : av >= 2 ? 2 : 1; }

  // Solo : le joueur a été rattrapé.
  function finSoloPerdue(e) {
    if (session !== 'solo') return;
    jeton++;
    if (partie) { try { partie.quitter(); } catch (er) { /* rien */ } }
    partie = null;
    enPartie = false;
    viderMinuterie();
    afficherFin(false, e, 0);
  }

  function afficherFin(gagne, e, moiForce) {
    if (!e) return;
    const moi = moiForce !== undefined ? moiForce : moiSiege();
    const sieges = siegesActuels();
    const postes = moi >= 0 ? e.po[moi] : 0;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.postes', { n: postes }) : '';
    $('fin-dossard').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = gagne ? etoilesPour(e.av[moi]) : 0;
      const ancienRecord = prog.records[i];
      const record = postes > ancienRecord;
      if (record) prog.records[i] = postes;
      const tenuesAvant = TENUES.map((_, k) => tenueOuverte(k));
      const dossardAvant = dossardGagne(i);
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), postes);
        // Parcours solo terminé (toutes les nuits gagnées, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else if (record) sauver(niveau, postes);
      $('fin-titre').textContent = gagne ? tr('fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, postes) });
      if (!dossardAvant && dossardGagne(i)) {
        const cv = document.createElement('canvas'); cv.width = 72; cv.height = 80;
        dossard(cv.getContext('2d'), 36, 40, 60, i, true);
        const tx = document.createElement('span'); tx.textContent = tr('fin.dossard', { nom: tr('nuit.' + niveau) });
        $('fin-dossard').append(cv, tx);
      } else if (gagne && etoiles < 3 && !dossardGagne(i)) {
        $('fin-dossard').textContent = tr('fin.dossardManque');
      }
      const nouvelle = TENUES.findIndex((_, k) => tenueOuverte(k) && !tenuesAvant[k]);
      let ligneDeb = '';
      if (gagne && niveau === NIVEAUX.length) ligneDeb = tr('fin.dernier');
      else if (debloque) ligneDeb = tr('fin.debloque', { n: niveau + 1 });
      if (nouvelle >= 0) ligneDeb += (ligneDeb ? ' ' : '') + tr('fin.tenue', { nom: tr('tenue.' + nouvelle) });
      $('fin-debloque').textContent = ligneDeb;
      $('fin-compte').textContent = gagne ? '' : tr('fin.conseil.' + ((niveau + postes) % 4));
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Course « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les courses s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      $('fin-compte').textContent = tr('manche.prochaine');
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Cendres dorées de victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    const coul = ['#ffcf3a', '#ffb347', '#fff1c2', COUL[0], COUL[4]];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 60, vy: 90 + Math.random() * 140, r: Math.random() * 6, vr: (Math.random() - 0.5) * 6, coul: coul[i % coul.length], k: 3 + Math.random() * 5 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt + Math.sin(t / 300 + b.r) * 0.6; b.y += b.vy * dt; b.r += b.vr * dt;
        c.fillStyle = b.coul; c.globalAlpha = 0.85;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); etincelle(c, 0, 0, b.k); c.restore();
      });
      c.globalAlpha = 1;
      if (t - debut < 2800) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Interface de la course
  // ---------------------------------------------------------------------

  function monTourMarche() {
    if (!partie || enPause || attenteTuto || !vue || !vue.leg || vue.leg.k < 1) return false;
    const sc = scene;
    if (!sc || !sc.moi || sc.s !== partie.siege || sc.fin) return false;
    return phase(sc) === 'marche' && partie.monTour();
  }

  function texteTour(s) {
    const info = siegesActuels()[s] || {};
    return info.humain && info.nom ? tr('tour.nom', { nom: info.nom }) : tr('tour.' + s);
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    if (!vue || !aff || attenteTuto || partie.phase !== 'jeu') return '';
    if (partie.siege < 0) return tr('multi.attente');
    const moi = partie.siege;
    if (aff.el[moi] >= 0) return tr('tour.elimine');
    if (O.vivants(aff) <= 1) return tr('tour.ligne');
    const sc = scene;
    if (sc && !sc.fin) {
      if (sc.moi) { const ph = phase(sc); return ph === 'allume' ? tr('tour.retiens') : ph === 'sosie' ? tr('tour.sosie') : tr('tour.cours'); }
      return texteTour(sc.s);
    }
    if (aff.tour === moi) return tr('tour.toi');
    return texteTour(aff.tour);
  }

  function texteAide() {
    if (!partie || !vue || partie.phase !== 'jeu' || attenteTuto) return '';
    if ($('choix').classList.contains('actif')) return tr('aide.choix');
    const sc = scene;
    if (sc && sc.moi && !sc.fin) {
      const ph = phase(sc);
      if (ph === 'allume') return tr('aide.retiens');
      if (ph === 'sosie') return tr('aide.sosie');
      return tr('aide.marche');
    }
    return tr('aide.regarde');
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length, nom: tr('nuit.' + niveau) });
    else if (partie && partie.manche > 0 && vue) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche, nom: tr('nuit.' + (vue.n + 1)) });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
    const a = texteAide();
    if ($('aide').textContent !== a) $('aide').textContent = a;
  }

  function majInterface() {
    majPlaces();
    majInfos();
  }

  // Barre de temps : temps d'allumage restant.
  function majTemps() {
    const barre = $('temps'), sc = scene;
    let visible = false;
    if (sc && !sc.fin && phase(sc) === 'allume' && !sc.robot) {
      const reste = Math.max(0, 1 - (horloge - sc.t0 + sc.saut) / sc.g.aff);
      const div = barre.firstElementChild;
      div.style.setProperty('--c', COUL[sc.s]);
      div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
      barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
      visible = true;
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // Lanternes du tracé : un petit son à chaque lanterne qui s'allume (en cascade).
  function sonsCascade() {
    const sc = scene;
    if (!sc || !sc.moi || phase(sc) !== 'allume' || !sc.g.cas) return;
    const L = sc.g.ch.length - 1, pasC = Math.min(260, (sc.g.aff * 0.55) / (L + 1));
    const n = Math.min(L + 1, Math.floor((horloge - sc.t0 + sc.saut) / pasC) + 1);
    while (sc.sonnes < n) { sons.lanterne(sc.sonnes); sc.sonnes++; }
  }

  // À mon tour : départ automatique (ou choix du sprint), ou passage de la ligne d'arrivée.
  function gererMonTour() {
    const choix = $('choix');
    let montrer = false;
    if (partie && !enPause && !attenteTuto && vue && partie.monTour() && !minuterie.length && !(scene && scene.fin && horloge < scene.fin.t + 600)) {
      if (O.vivants(vue) <= 1) {
        if (!departEnvoye && partie.jouer({ d: 0 })) departEnvoye = true;
      } else if (vue.leg && vue.leg.k === 0) {
        if (vue.cfg.sp) montrer = true;
        else {
          if (!departT) departT = horloge + 450;
          if (horloge >= departT && !departEnvoye) { departT = 0; if (partie.jouer({ d: 0 })) departEnvoye = true; }
        }
      }
    }
    if (montrer !== choix.classList.contains('actif')) { choix.classList.toggle('actif', montrer); majInfos(); }
  }

  function choisirDepart(d) {
    if (!partie || !partie.monTour() || !vue || !vue.leg || vue.leg.k !== 0 || departEnvoye) return;
    audio(); sons.clic();
    if (partie.jouer({ d: d })) departEnvoye = true;
    $('choix').classList.remove('actif');
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0, majSalonT = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(now) {
    rafId = 0;
    if (ecran !== 'jeu') return;
    const dt = Math.min(0.05, tPrec ? (now - tPrec) / 1000 : 0.016);
    tPrec = now;
    if (!enPause && !attenteTuto) horloge += dt * 1000;
    avancerMinuterie();
    sonsCascade();
    gererMonTour();
    dessinerJeu(now / 1000, enPause ? 0 : dt);
    dessinerPeloton(now / 1000);
    majTemps();
    majInfos();
    if (now - majSalonT > 400) { majSalonT = now; majSalon(); }
    rafId = requestAnimationFrame(boucle);
  }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, nuits, vestiaire
  // ---------------------------------------------------------------------

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null; aff = null; scene = null; minuterie = [];
    bandeau('');
    $('choix').classList.remove('actif');
    fermerVoile('voile-pause');
    fermerVoile('voile-fin');
    fermerVoile('voile-tuto');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  // Parcours solo : nuit n contre des robots (force croissante).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    finSoloLancee = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = null; scene = null; minuterie = []; particules = [];
    // Aperçu des places de la nuit (mêmes règles, hasard fixe) en attendant le départ.
    aff = R.depart(() => 0.5, PLACES, { niveau: niveau });
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNuit(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Course avec d'autres joueurs : courses qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

    const grille = $('grille-niveaux');

      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
      b.append(num, et);
      if (dossardGagne(i)) { const cv = document.createElement('canvas'); cv.width = 52; cv.height = 60; dossard(cv.getContext('2d'), 26, 30, 44, i, true); b.appendChild(cv); }
      b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, nom: tr('nuit.' + n), n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
      else b.disabled = true;

    });
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });

  function ouvrirVestiaire() {
    const g = $('grille-tenues');
    g.textContent = '';
    TENUES.forEach((seuil, i) => {
      const ouvert = tenueOuverte(i);
      const b = document.createElement('button');

      b.className = 'tenue' + (ouvert ? '' : ' ferme') + (prog.tenue === i ? ' choisie' : '');
      const cv = document.createElement('canvas'); cv.width = 128; cv.height = 144;
      const c = cv.getContext('2d');
      if (ouvert) coureur(c, 60, 136, 118, COUL[0], 0.6, i);
      else { c.globalAlpha = 0.5; coureur(c, 60, 136, 118, '#3a4158', 0.6, i); c.globalAlpha = 1; }
      const nom = document.createElement('span'); nom.textContent = tr('tenue.' + i);
      const info = document.createElement('span'); info.textContent = ouvert ? (prog.tenue === i ? tr('tenue.portee') : tr('tenue.choisir')) : tr('tenue.ferme', { n: seuil });
      b.append(cv, nom, info);
      b.setAttribute('aria-pressed', prog.tenue === i ? 'true' : 'false');

      else b.disabled = true;

    });
    const dg = $('grille-dossards');

    let gagnes = 0;

      d.appendChild(cv);

      d.setAttribute('aria-label', texte);
      d.addEventListener('click', () => { audio(); sons.clic(); toast(texte, 2200); });
      dg.appendChild(d);
    });
    $('vest-dossards-aide').textContent = tr('vestiaire.aide', { n: gagnes, max: NIVEAUX.length });
    $('vest-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('vestiaire');
  }

  // Titre en une seule ligne par mot : on réduit la police si un mot est trop long (« Mitternachtsmarathon »).
  function ajusterTitre() {
    const h1 = document.querySelector('#ecran-titre h1');
    if (!h1) return;
    h1.style.fontSize = '';
    let taille = parseFloat(getComputedStyle(h1).fontSize) || 36;
    const mots = h1.textContent.split(/\s+/);
    const c = document.createElement('canvas').getContext('2d');
    const largeur = h1.clientWidth - 28;
    for (let k = 0; k < 14; k++) {
      c.font = '800 ' + taille + 'px system-ui, sans-serif';
      const plusLong = Math.max.apply(null, mots.map((m) => c.measureText(m).width + m.length * 0.5));
      if (plusLong <= largeur || taille <= 20) break;
      taille *= 0.92;
    }
    h1.style.fontSize = Math.round(taille) + 'px';
  }

  function majTitre() {
    ajusterTitre();
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function caseSous(px, py) {
    if (!geo) return -1;
    const x = Math.floor((px - geo.ox) / geo.s), y = Math.floor((py - geo.oy) / geo.s);
    if (x < 0 || y < 0 || x >= W || y >= H) return -1;
    return y * W + x;
  }

  // Passer l'allumage (j'ai tout retenu) : le sosie passe quand même.
  function sauter() {
    const sc = scene;
    if (!sc || !sc.moi || sc.fin) return false;
    if (phase(sc) !== 'allume') return false;
    const el = horloge - sc.t0 + sc.saut;
    sc.saut += Math.max(0, sc.g.aff - el);
    sons.eteint();
    return true;
  }

  function marcherVers(cell) {
    if (!partie || enPause || attenteTuto) return;
    if (scene && scene.moi && !scene.fin && phase(scene) === 'allume') { sauter(); return; }
    if (!monTourMarche()) {
      if (partie.phase === 'jeu' && Date.now() - dernierAttends > 1500 && !(scene && scene.moi && !scene.fin)) { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (cell < 0) return;
    const cur = scene.pos;
    if (vue.b.charAt(cell) === '#') { toast(tr('pas.ruine'), 1400); sons.non(); return; }
    if (!O.voisine(cur, cell)) { if (cell !== cur) { toast(tr('pas.voisine'), 1400); sons.non(); } return; }
    partie.jouer({ c: cell });
  }

  const plateau = $('plateau');
  plateau.addEventListener('pointerdown', (ev) => {
    audio();
    const r = plateau.getBoundingClientRect();
    marcherVers(caseSous(ev.clientX - r.left, ev.clientY - r.top));
  });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert() || $('voile-fin').classList.contains('actif')) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else { audio(); ouvrirPause(); }
      return;
    }
    if (enPause) return;
    if ($('choix').classList.contains('actif')) {
      if (ev.code === 'KeyS') { ev.preventDefault(); choisirDepart(1); return; }
      if (ev.code === 'KeyF' || ((ev.code === 'Enter' || ev.code === 'Space') && !(document.activeElement && document.activeElement.tagName === 'BUTTON'))) { ev.preventDefault(); choisirDepart(0); return; }
    }
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], KeyA: [-1, 0], KeyD: [1, 0], KeyW: [0, -1], KeyS: [0, 1] };
    if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      sauter();
      return;
    }
    if (dirs[ev.code]) {
      ev.preventDefault(); audio();
      if (scene && scene.moi && !scene.fin && phase(scene) === 'allume') { sauter(); return; }
      if (!monTourMarche()) { marcherVers(-1); return; }
      const cur = scene.pos, x = cur % W + dirs[ev.code][0], y = Math.floor(cur / W) + dirs[ev.code][1];
      if (x < 0 || y < 0 || x >= W || y >= H) { sons.non(); return; }
      marcherVers(y * W + x);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-vestiaire').addEventListener('click', () => { audio(); sons.clic(); ouvrirVestiaire(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('vest-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-foulee').addEventListener('click', () => choisirDepart(0));
  $('btn-sprint').addEventListener('click', () => choisirDepart(1));
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une nuit solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, aff && partie && partie.siege >= 0 ? aff.po[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') { ajusterTitre(); dessinerTitre(performance.now() / 1000); } });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
