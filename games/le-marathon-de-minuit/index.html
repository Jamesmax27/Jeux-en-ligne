    if (mon && mon.phase === 'montre' && mon.ch.m) { c.strokeStyle = COUL[mon.ch.m.c] + '66'; c.lineWidth = 3; rr(c, geo.ox - 2, geo.oy - 2, geo.s * GW + 4, geo.s * GH + 4, 12); c.stroke(); }
  }

  // Image du jeu sur un écran d'ordinateur (JEL_APERCU = 3) : la ville noyée de brume continue de part et
  // d'autre du plan (immeubles, lune, réverbères), le Coureur pâle rôde à gauche, deux rivaux fuient à droite.
  function decorLarge(c, w, h, g, t) {
    const gx0 = g.ox, gx1 = g.ox + g.s * g.W, sol = h * 0.58;
    const ciel = c.createLinearGradient(0, 0, 0, h);
    ciel.addColorStop(0, '#0e1430'); ciel.addColorStop(0.5, '#28305e'); ciel.addColorStop(0.58, '#363d6e'); ciel.addColorStop(1, '#141a2c');
    c.fillStyle = ciel; c.fillRect(0, 0, w, h);
    const hs = graineHasard(5);
    for (let i = 0; i < 80; i++) { c.fillStyle = `rgba(255,255,255,${0.25 + hs() * 0.5})`; c.fillRect(hs() * w, hs() * sol * 0.6, 1.6, 1.6); }
    const lx = gx1 + (w - gx1) * 0.62, ly = h * 0.17, lr = h * 0.075;
    const halo = c.createRadialGradient(lx, ly, lr * 0.5, lx, ly, lr * 5);
    halo.addColorStop(0, 'rgba(225,235,255,.55)'); halo.addColorStop(1, 'rgba(225,235,255,0)');
    c.fillStyle = halo; rond(c, lx, ly, lr * 5); c.fill();
    c.fillStyle = '#eef1fb'; rond(c, lx, ly, lr); c.fill();
    c.fillStyle = 'rgba(160,170,195,.35)'; rond(c, lx - lr * 0.3, ly - lr * 0.2, lr * 0.22); c.fill(); rond(c, lx + lr * 0.35, ly + lr * 0.3, lr * 0.15); c.fill();
    [['#2c3466', 0.8, 51], ['#161c36', 1, 53]].forEach(([coul, f, gr], n) => {
      const hb = graineHasard(gr);
      let x = -10;
      while (x < w + 10) {
        const bw = 46 + hb() * 70, bh = h * (0.12 + hb() * 0.3) * f;
        c.fillStyle = coul; c.fillRect(x, sol - bh, bw, bh + 4);
        if (hb() < 0.5) { c.beginPath(); c.moveTo(x, sol - bh); c.lineTo(x + bw / 2, sol - bh - 26); c.lineTo(x + bw, sol - bh); c.fill(); }
        for (let j = 0; j < 5; j++) if (hb() < (n ? 0.4 : 0.25)) { c.fillStyle = n ? 'rgba(255,196,110,.8)' : 'rgba(255,196,110,.4)'; c.fillRect(x + 8 + hb() * (bw - 20), sol - bh + 12 + hb() * bh * 0.6, 6, 8); }
        x += bw + 4 + hb() * 14;
      }
    });
    const rue = c.createLinearGradient(0, sol, 0, h);
    rue.addColorStop(0, '#2e355e'); rue.addColorStop(1, '#121726');
    c.fillStyle = rue; c.fillRect(0, sol, w, h - sol);
    c.strokeStyle = 'rgba(150,165,210,.14)'; c.lineWidth = 1;
    for (let k = 1; k < 8; k++) { const q = (k / 8) * (k / 8), yy = sol + (h - sol) * q; c.beginPath(); c.moveTo(0, yy); c.lineTo(w, yy); c.stroke(); }
    // réverbères à lanternes sur les deux trottoirs
    [[0.18, 0], [0.7, 3], [0.3, 1], [0.82, 4]].forEach(([f, k], i) => {
      const x = i < 2 ? gx0 * f : gx1 + (w - gx1) * f, y = sol + (h - sol) * 0.35;
      c.strokeStyle = '#0c0f1a'; c.lineWidth = 5; c.beginPath(); c.moveTo(x, y + 6); c.lineTo(x, y + h * 0.16); c.stroke();
      lanterne(c, x, y, h * 0.045, 'vraie', COUL[k], 1, t);
    });
    lanterne(c, gx1 + (w - gx1) * 0.48, sol + (h - sol) * 0.62, h * 0.04, 'froide', '#fff', 1, t);
    // le Coureur pâle rôde à gauche, deux rivaux fuient à droite
    pale(c, gx0 * 0.5, h * 0.96, h * 0.62, t, 0.95);
    coureur(c, gx1 + (w - gx1) * 0.3, h * 0.94, h * 0.36, COUL[1], -1, t / 110, false);
    coureur(c, gx1 + (w - gx1) * 0.66, h * 0.8, h * 0.24, COUL[2], -1, t / 110 + 2, false);
    for (let n = 0; n < 5; n++) {
      const yy = sol + (h - sol) * (0.15 + n * 0.2);
      const bg = c.createLinearGradient(0, yy - 30, 0, yy + 30);
      bg.addColorStop(0, 'rgba(185,195,220,0)'); bg.addColorStop(0.5, 'rgba(185,195,220,.12)'); bg.addColorStop(1, 'rgba(185,195,220,0)');
      c.fillStyle = bg; c.fillRect(0, yy - 30, w, 60);
    }
    // le plan de la ville se détache sur une dalle sombre
    c.fillStyle = 'rgba(8,10,18,.82)'; rr(c, gx0 - 10, g.oy - 10, gx1 - gx0 + 20, g.s * g.H + 20, 16); c.fill();
    c.strokeStyle = 'rgba(255,210,122,.25)'; c.lineWidth = 2; rr(c, gx0 - 10, g.oy - 10, gx1 - gx0 + 20, g.s * g.H + 20, 16); c.stroke();
  }

  function jaillir(i, coul, n) {
    if (!vue || !geo) return;
    const x = geo.ox + (i % GW + 0.5) * geo.s, y = geo.oy + (Math.floor(i / GW) + 0.5) * geo.s;
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 140;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, vie: 0.6 + Math.random() * 0.4, k: 1.5 + Math.random() * 2.5, coul: coul });
    }
  }

  // ---------------------------------------------------------------------
  //  Rejeu des pas d'un autre coureur, puis effets du résultat
  // ---------------------------------------------------------------------

  function lancerRejeu(ev) {
    const n = ev.action.p.length;
    // Juste après mon propre coup, on laisse mon résultat visible un instant.
    const now = performance.now();
    const retard = mon && mon.phase === 'envoye' && mon.finT ? Math.max(0, 600 - (now - mon.finT)) : 0;
    const dispo = Math.max(500, R.delaiBot - 450 - retard);
    rejeu = { s: ev.siege, ch: ev.avant.ch, p: ev.action.p, sp: ev.action.s, t0: now + 150 + retard, pasMs: Math.min(260, dispo / Math.max(1, n)), vus: 0, avant: ev.avant, apres: ev.apres, ev: ev };
    if (ev.action.s) sons.sprint();
  }

  function avancerRejeu(t) {
    if (!rejeu) return;
    const n = Math.min(rejeu.p.length, Math.floor((t - rejeu.t0) / rejeu.pasMs));
    while (rejeu.vus < n) {
      const k = rejeu.vus++, x = rejeu.p[k];
      if (x === rejeu.ch.p[k]) { sons.pas(k); jaillir(x, COUL[rejeu.s], 5); } else { sons.faux(); secousse = t; }
    }
    if (t - rejeu.t0 >= rejeu.pasMs * rejeu.p.length + 250) {
      const ev = rejeu.ev;
      rejeu = null;
      effetsResultat(ev);
      majInterface();
    }
  }

  function effetsResultat(ev) {
    const der = ev.apres.der;
    if (!der) return;
    const moi = moiSiege(), s = der.s, carte = $('place-' + s);
    if (der.ok) {
      sons.ok();
      carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
      if (der.sp) toast(s === moi ? tr('res.sprintToi') : tr('res.sprint', { nom: nomPhrase(s) }), 1800);
    } else {
      setTimeout(sons.pale, 200);
      gainPale = der.sp ? 2 : 1;
      carte.classList.remove('choc'); void carte.offsetWidth; carte.classList.add('choc');
      if (s === moi) toast(tr(der.sp ? 'res.fauxSprint' : 'res.faux'), 2000);
    }
    if (der.g) { sons.gourde(); if (s === moi) toast(tr('res.gourde'), 1800); }
    if (der.el) { setTimeout(sons.glas, 300); toast(s === moi ? tr('res.elimineToi') : tr('res.elimine', { nom: nomPhrase(s) }), 2600); }
    if (der.mi) {
      setTimeout(sons.cloche, der.el ? 1200 : 200);
      gainPale = Math.max(gainPale, 1);
      minuitNuit = true;
      setTimeout(() => toast(tr('res.minuit'), 2600), der.el ? 1500 : 300);
      (der.mo || []).forEach((q) => setTimeout(() => { sons.glas(); toast(q === moi ? tr('res.elimineToi') : tr('res.elimine', { nom: nomPhrase(q) }), 2600); }, 2200));
    }
    // Compteurs et dossards (mes tracés réussis, en solo comme en ligne ; pas ceux de mon robot).
    if (s === moi && moi >= 0 && !ev.auto) {
      const ch = ev.avant.ch;
      if (!der.ok) fauxNuit++;
      if (der.g) compter('gourde');
      if (der.ok) {
        if (der.sp) compter('sprint');
        if (ch.m) compter('masque');
        if (ch.r) compter('rebours');
        if (ch.f.length >= 3) gagnerDossard('froide');
        if (ch.b.length >= 2) gagnerDossard('brume');
      }
    }
    // Solo : rattrapé par le Coureur pâle → défaite tout de suite.
    const elimMoi = moi >= 0 && ev.apres.out[moi] && !ev.avant.out[moi];
    if (elimMoi && session === 'solo' && !finMontree && !R.fin(ev.apres)) {
      finMontree = true;
      const j = jeton;
      setTimeout(() => { if (j === jeton) afficherFin(false); }, 1800);
    }
    if (elimMoi && session === 'ligne') bandeau(tr('tour.elimine'));
  }

  // ---------------------------------------------------------------------
  //  Dossards maudits et compteurs
  // ---------------------------------------------------------------------

  let gainsNuit = [];
  function gagnerDossard(id) {
    if (prog.dossards.indexOf(id) >= 0) return;
    prog.dossards.push(id);
    gainsNuit.push(tr('fin.dossard', { nom: tr('dossard.' + id + '.nom') }));
    toast(tr('fin.dossard', { nom: tr('dossard.' + id + '.nom') }), 2600);
    if (session === 'ligne') sauverReglages();
  }
  function compter(cle) {
    prog.cpt[cle] = (prog.cpt[cle] || 0) + 1;
    if (prog.cpt[cle] >= COMPTEURS[cle]) gagnerDossard(cle);
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';

  function surManche() {
    jeton++;

  function surAction(ev) {

  function surSieges() {

  function etoilesPour(av, depart) { return av >= depart ? 3 : av >= 2 ? 2 : 1; }

      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; portrait(cv.getContext('2d'), s, 60, s === moi, !!e.out[s]);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};

  // gagneForce : false (rattrapé en solo), ou null (fin de manche : on lit le classement).
  function afficherFin(gagneForce) {
    const e = vue || (partie && partie.etat);
    if (!e) return;
    const moi = partie ? partie.siege : 0;
    const res = O.classement(e);

    const boutons = $('fin-boutons');

      const av = moi >= 0 ? e.av[moi] : 0;
      const etoiles = gagne ? etoilesPour(av, NIVEAUX[i].av) : 0;
      const ancienRecord = prog.records[i];
      const record = lanternes > ancienRecord;
      if (record) prog.records[i] = lanternes;
      let debloque = false;
      const tenuesAvant = TENUES.filter((x) => x.etoiles <= totalEtoiles()).length;

        sauver(Math.min(niveau + 1, NIVEAUX.length), lanternes);
        // Parcours terminé (toutes les nuits gagnées, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else sauver(niveau, lanternes);
      const tenuesApres = TENUES.filter((x) => x.etoiles <= totalEtoiles()).length;
      if (tenuesApres > tenuesAvant) gainsNuit.push(tr('fin.tenue', { nom: tr('tenue.' + TENUES[tenuesApres - 1].id) }));
      $('fin-titre').textContent = gagne ? tr('fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');

      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);

      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, lanternes) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      $('fin-compte').textContent = '';
      gainsNuit.forEach((g) => { const p = document.createElement('span'); p.textContent = g; gains.appendChild(p); });
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
      enPartie = false;

    } else {

      $('fin-debloque').textContent = '';

    }

  }

  // Compte à rebours avant la manche suivante (repli contre des robots).
  function majCompte() {
    majSalon();

    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));

  // Cendres dorées de la victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 70, vy: 90 + Math.random() * 150, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 3 ? '#ffd27a' : COUL[i % 5], k: 4 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2800) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];

    const CW = cv.width, CH = cv.height;
    const j = ++tutoAnim;
    let debut = 0;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ec = t - debut;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, CW, CH);
      c.fillStyle = '#0f1420'; c.fillRect(0, 0, CW, CH);
      if (d.minuit) demoMinuit(c, CW, CH, ec, t);
      else demoPlan(c, CW, CH, d, ec, t);
      animId = requestAnimationFrame(image);

    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(animId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = (ev) => { if (ev.target === $('voile-tuto')) { audio(); fermer(); } };
  }

  // Démonstration sur un mini-plan : allumage, extinction, puis la main rejoue le tracé.
  function demoPlan(c, CW, CH, d, ec, t) {
    const g = geometrie(CW, CH, d.W, d.H, 20);
    const ch = { d: d.d, p: d.p, k1: d.k1 || d.p.length, f: d.f, fT: d.fT || [], b: d.b, g: d.g, m: d.mq, r: d.r };
    const N = { aff: 520, ten: 1100 };
    const hor = horaire(ch, d.sp ? 1 : 0, N);
    const PAS = 650, finSaisie = hor.fin + 500 + hor.tot * PAS + 1400;
    const cycle = ec % finSaisie;
    const v = { lanternes: [], brume: ch.b.map((j) => ch.p[j]), pas: [], pasT: [], coureurs: [], depart: ch.d, gourde: -1, poste: -1, poste2: -1, faux: -1, cibles: [], coul: COUL[0] };
    let mainXY = null, appui = 0;
    const centre = (i) => [g.ox + (i % d.W + 0.5) * g.s, g.oy + (Math.floor(i / d.W) + 0.5) * g.s];
    if (cycle < hor.fin) {
      const eteint = cycle >= hor.fin - 260 ? Math.max(0, (hor.fin - cycle) / 260) : 1;
      for (let k = 0; k < hor.tot; k++) {
        if (ch.b.indexOf(k) >= 0) continue;
        const a = Math.min(1, (cycle - hor.quand[k]) / 160) * eteint;
        if (a > 0) v.lanternes.push({ i: ch.p[k], type: 'vraie', coul: COUL[0], a: a });
        if (k === ch.g && a > 0) v.gourde = ch.p[k];
      }
      if (ch.m) for (let k = ch.m.q; k < hor.tot; k++) { const cell = ch.m.p[k - ch.m.q]; if (cell === undefined) continue; const a = Math.min(1, (cycle - hor.quand[k]) / 160) * eteint; if (a > 0) v.lanternes.push({ i: cell, type: 'masque', coul: COUL[ch.m.c], a: a }); }
      ch.f.forEach((cell, k) => { const q = 350 + ch.fT[k] * hor.aff + hor.aff * 0.5; const a = Math.min(1, (cycle - q) / 160) * eteint; if (a > 0) v.lanternes.push({ i: cell, type: 'froide', coul: '#fff', a: a }); });
      if (cycle >= hor.quand[ch.k1 - 1]) v.poste = ch.p[ch.k1 - 1];
      if (d.sp && cycle >= hor.quand[hor.tot - 1]) v.poste2 = ch.p[hor.tot - 1];
      v.coureurs.push({ i: ch.d, coul: COUL[0], tenue: -1, ph: 0 });
    } else {
      const s2 = cycle - hor.fin - 500;
      const n = s2 < 0 ? 0 : Math.min(hor.tot, Math.floor(s2 / PAS) + 1);
      let pos = ch.d;
      for (let k = 0; k < n; k++) { v.pas.push(ch.p[k]); v.pasT.push(0); pos = ch.p[k]; }
      v.coureurs.push({ i: pos, coul: COUL[0], tenue: -1, ph: t / 120 });
      if (n < hor.tot && s2 >= -400) {
        const cible = centre(ch.p[n]), q = Math.max(0, Math.min(1, ((s2 < 0 ? 0 : s2 % PAS)) / (PAS * 0.7)));
        const dep = n === 0 ? [CW - 40, CH - 20] : centre(ch.p[n - 1]);
        mainXY = [dep[0] + (cible[0] - dep[0]) * q, dep[1] + (cible[1] - dep[1]) * q];
        appui = q >= 1 ? 1 : 0;
        v.survol = ch.p[n];
        v.cibles = voisinsMini(d, pos);
      }
    }
    dessinerPlan(c, g, d.m, v, t);
    if (mainXY) main(c, mainXY[0] + 6, mainXY[1] + 10, 1.5, appui);
  }

  // Cases voisines libres sur le mini-plan d'un tutoriel.
  function voisinsMini(d, i) {
    const r = Math.floor(i / d.W), c = i % d.W, l = [];
    if (r > 0) l.push(i - d.W);
    if (c < d.W - 1) l.push(i + 1);
    if (r < d.H - 1) l.push(i + d.W);
    if (c > 0) l.push(i - 1);
    return l.filter((j) => d.m.charAt(j) !== '#');
  }

  // Démonstration de minuit : la cloche sonne, le Coureur pâle avance sur tout le monde.
  function demoMinuit(c, CW, CH, ec, t) {
    const cycle = ec % 5200;
    const av = [3, 2, 4, 1, 3];
    const perte = cycle > 2200 ? Math.min(1, (cycle - 2200) / 700) : 0;
    const out = av.map((a) => (a - perte <= 0.01 && cycle > 2900 ? 1 : 0));
    const vals = av.map((a) => Math.max(0, a - perte));
    c.save(); c.translate(20, CH * 0.35);
    dessinerCourse(c, CW - 40, CH * 0.5, vals, out, 5, t, 0, perte);
    c.restore();
    if (cycle > 1200 && cycle < 3400) cloche(c, CW / 2, CH * 0.18, 46, t);
  }

  // Main qui montre le geste.
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k);
    if (appui > 0) { c.strokeStyle = `rgba(255,210,122,${0.8 * appui})`; c.lineWidth = 3; rond(c, -6, -18, 16 + 8 * appui); c.stroke(); }
    c.fillStyle = '#f5d6b4'; c.strokeStyle = '#6b4a2e'; c.lineWidth = 2;
    c.beginPath();
    c.moveTo(-10, -22); c.quadraticCurveTo(-10, -30, -4, -30); c.quadraticCurveTo(2, -30, 2, -22);
    c.lineTo(2, -6); c.quadraticCurveTo(8, -12, 13, -6); c.quadraticCurveTo(18, -1, 18, 8);
    c.quadraticCurveTo(18, 26, 2, 28); c.quadraticCurveTo(-14, 28, -16, 12); c.lineTo(-18, 0);
    c.quadraticCurveTo(-19, -6, -12, -5); c.lineTo(-10, -2); c.closePath();
    c.fill(); c.stroke();
    c.restore();
  }

  function caseSous(px, py) {
    if (!geo) return -1;
    const c = Math.floor((px - geo.ox) / geo.s), r = Math.floor((py - geo.oy) / geo.s);
    if (c < 0 || c >= GW || r < 0 || r >= GH) return -1;
    return r * GW + c;
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;

      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    if (mon && mon.phase === 'choix') {
      if (ev.code === 'Digit1' || ev.code === 'Numpad1') { ev.preventDefault(); audio(); sons.clic(); lancerAllumage(0); }
      else if (ev.code === 'Digit2' || ev.code === 'Numpad2') { ev.preventDefault(); audio(); sons.clic(); lancerAllumage(1); }
      return;
    }
    const dirs = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -GW, ArrowDown: GW, KeyA: -1, KeyD: 1, KeyW: -GW, KeyS: GW };
    if (dirs[ev.code] !== undefined) {
      ev.preventDefault(); audio();

      const dx = dirs[ev.code];
      const c = mon.pos % GW;
      if ((dx === -1 && c === 0) || (dx === 1 && c === GW - 1)) { sons.non(); return; }
      const cible = mon.pos + dx;
      if (cible < 0 || cible >= GW * GH) { sons.non(); return; }
      toucherCase(cible);
    }
  });

  function dessinerAffiche() {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    // Scène composée sur 600 × 800 ; sur un écran plus large ou plus haut, le décor continue jusqu'aux bords.
    const k = Math.min(w / 600, h / 800), ox = (w - 600 * k) / 2, oy = (h - 800 * k) / 2;
    c.setTransform(dpr * k, 0, 0, dpr * k, dpr * ox, dpr * oy);
    const X0 = -ox / k - 2, X1 = 600 + ox / k + 2, Y0 = -oy / k - 2, Y1 = 800 + oy / k + 2, LW = X1 - X0;
    const t = 1200, HZ = 372;
    // ciel
    const ciel = c.createLinearGradient(0, Y0, 0, HZ + 20);
    ciel.addColorStop(0, '#070a1c'); ciel.addColorStop(0.55, '#1b2150'); ciel.addColorStop(1, '#383d76');
    c.fillStyle = ciel; c.fillRect(X0, Y0, LW, HZ + 20 - Y0);
    const hs = graineHasard(11);
    for (let i = 0; i < 90; i++) { c.fillStyle = `rgba(255,255,255,${0.3 + hs() * 0.6})`; const r = 0.8 + hs() * 1.4; c.fillRect(X0 + hs() * LW, Y0 + hs() * (HZ - 120 - Y0), r, r); }
    // lune et son halo
    const lx = 462, ly = 128, lr = 66;
    const halo = c.createRadialGradient(lx, ly, lr * 0.6, lx, ly, lr * 5);
    halo.addColorStop(0, 'rgba(225,235,255,.7)'); halo.addColorStop(0.35, 'rgba(170,190,255,.25)'); halo.addColorStop(1, 'rgba(170,190,255,0)');
    c.fillStyle = halo; rond(c, lx, ly, lr * 5); c.fill();
    c.fillStyle = '#f3f5ff'; c.shadowColor = '#dfe8ff'; c.shadowBlur = 40 * k * dpr; rond(c, lx, ly, lr); c.fill(); c.shadowBlur = 0;
    c.fillStyle = 'rgba(165,175,205,.4)';
    [[-22, -14, 15], [20, 18, 11], [12, -26, 7], [-10, 26, 8]].forEach((q) => { rond(c, lx + q[0], ly + q[1], q[2]); c.fill(); });
    // ville engloutie : deux rangées d'immeubles, la plus lointaine pâlie par la brume
    [['#283062', 0.75, 41], ['#10152b', 1, 43]].forEach(([coul, f, g], n) => {
      const hb = graineHasard(g);
      let x = X0 - 10;
      while (x < X1 + 10) {
        const bw = 42 + hb() * 62, bh = (90 + hb() * 170) * f;
        const centre = x + bw / 2 > 220 && x + bw / 2 < 380;
        const hh = centre ? bh * 0.45 : bh;
        const pente = (hb() - 0.5) * 0.06;
        c.save(); c.translate(x + bw / 2, HZ); c.rotate(pente);
        c.fillStyle = coul; c.fillRect(-bw / 2, -hh, bw, hh + 6);
        if (hb() < 0.55) { c.beginPath(); c.moveTo(-bw / 2, -hh); c.lineTo(0, -hh - 22 - hb() * 18); c.lineTo(bw / 2, -hh); c.fill(); }
        for (let j = 0; j < 6; j++) if (hb() < (n ? 0.4 : 0.25)) { c.fillStyle = n ? 'rgba(255,196,110,.85)' : 'rgba(255,196,110,.45)'; c.fillRect(-bw / 2 + 7 + hb() * (bw - 18), -hh + 10 + hb() * hh * 0.7, 5, 7); }
        c.fillStyle = coul;
        c.restore();
        x += bw + 3 + hb() * 12;
      }
    });
    // rue pavée et mouillée en perspective
    const rue = c.createLinearGradient(0, HZ, 0, Y1);
    rue.addColorStop(0, '#2a3058'); rue.addColorStop(0.35, '#171c36'); rue.addColorStop(1, '#0b0f1e');
    c.fillStyle = rue; c.fillRect(X0, HZ, LW, Y1 - HZ);
    c.strokeStyle = 'rgba(170,185,230,.11)'; c.lineWidth = 1.4;
    for (let i = 1; i < 12; i++) { const q = (i / 12) * (i / 12), yy = HZ + (Y1 - HZ) * q; c.beginPath(); c.moveTo(X0, yy); c.lineTo(X1, yy); c.stroke(); }
    for (let i = -8; i <= 8; i++) { c.beginPath(); c.moveTo(300 + i * 6, HZ); c.lineTo(300 + i * 95, Y1); c.stroke(); }
    // reflet de la lune sur les pavés mouillés
    const ref = c.createLinearGradient(0, HZ, 0, Y1);
    ref.addColorStop(0, 'rgba(210,225,255,.26)'); ref.addColorStop(1, 'rgba(210,225,255,0)');
    c.fillStyle = ref; c.beginPath(); c.moveTo(lx - 10, HZ); c.lineTo(lx + 10, HZ); c.lineTo(lx + 70, Y1); c.lineTo(lx - 40, Y1); c.closePath(); c.fill();
    // brume lointaine sur l'horizon
    const bh = c.createLinearGradient(0, HZ - 70, 0, HZ + 60);
    bh.addColorStop(0, 'rgba(190,200,235,0)'); bh.addColorStop(0.55, 'rgba(190,200,235,.32)'); bh.addColorStop(1, 'rgba(190,200,235,0)');
    c.fillStyle = bh; c.fillRect(X0, HZ - 70, LW, 130);
    // tracé de lanternes qui serpente vers l'horizon, avec leurs reflets
    const trace = [[302, 384, 9], [326, 400, 11], [286, 421, 13], [336, 450, 16], [262, 487, 20], [318, 534, 25]];
    trace.forEach((p, i) => {
      const g = c.createLinearGradient(0, p[1], 0, p[1] + p[2] * 4);
      g.addColorStop(0, 'rgba(255,190,90,.35)'); g.addColorStop(1, 'rgba(255,190,90,0)');
      c.fillStyle = g; c.fillRect(p[0] - p[2] * 0.4, p[1], p[2] * 0.8, p[2] * 4);
      lanterne(c, p[0], p[1], p[2], 'vraie', COUL[(i + 1) % 5], 1, t);
    });
    // lanterne froide, qui ment, sur le bas-côté
    lanterne(c, 520, 468, 20, 'froide', '#fff', 1, t);
    // deux rivaux, plus loin sur le tracé
    coureur(c, 352, 418, 44, COUL[1], -1, 0.5, false);
    coureur(c, 238, 452, 58, COUL[2], -1, 2.6, false);
    // le Coureur pâle, grand et lumineux, la main tendue vers le héros
    const lueur = c.createRadialGradient(178, 380, 20, 178, 380, 280);
    lueur.addColorStop(0, 'rgba(160,205,255,.34)'); lueur.addColorStop(1, 'rgba(180,215,255,0)');
    c.fillStyle = lueur; rond(c, 178, 380, 280); c.fill();
    c.fillStyle = 'rgba(214,226,246,.28)';
    for (let i = 0; i < 4; i++) { ell(c, 120 - i * 40, 420 + i * 22, 70 - i * 8, 18, -0.2); c.fill(); }
    c.save(); c.shadowColor = '#9fd2ff'; c.shadowBlur = 16 * k * dpr;
    pale(c, 176, 586, 300, 820, 1);
    c.restore();
    pale(c, 176, 586, 300, 820, 1);
    // lambeaux qui flottent sous son buste, bouche fine sous les yeux de givre
    c.fillStyle = 'rgba(223,229,240,.85)';
    [[140, 18], [158, 26], [178, 20], [198, 30], [214, 16]].forEach(([x, l], i) => { c.beginPath(); c.moveTo(x - 7, 446); c.lineTo(x + 8, 446); c.lineTo(x - 10 - (i % 2) * 6, 446 + l); c.closePath(); c.fill(); });
    c.strokeStyle = '#5b6f8c'; c.lineWidth = 2.2;
    c.beginPath(); c.moveTo(173, 271); c.quadraticCurveTo(184, 276, 196, 270); c.stroke();
    // longs doigts blafards tendus vers le héros
    c.strokeStyle = '#d6dded'; c.lineWidth = 3.4; c.lineCap = 'round';
    [[-12, 0.5], [-5, 0.25], [2, 0.05], [8, -0.15]].forEach(([dy, a]) => { c.beginPath(); c.moveTo(305, 388 + dy * 0.4); c.quadraticCurveTo(318, 386 + dy, 330, 384 + dy + a * 14); c.stroke(); });
    // lanterne du tracé, au sol entre les deux coureurs
    lanterne(c, 222, 616, 26, 'vraie', COUL[4], 1, t);
    // le héros, en pleine foulée
    c.fillStyle = 'rgba(0,0,0,.4)'; ell(c, 392, 593, 78, 12); c.fill();
    const chaud = c.createRadialGradient(392, 560, 10, 392, 560, 150);
    chaud.addColorStop(0, 'rgba(255,180,90,.35)'); chaud.addColorStop(1, 'rgba(255,180,90,0)');
    c.fillStyle = chaud; rond(c, 392, 560, 150); c.fill();
    heroAffiche(c, 384, 588, 330);
    // poussière soulevée par la foulée
    c.fillStyle = 'rgba(200,210,235,.35)';
    [[300, 580, 16], [272, 570, 11], [250, 584, 8]].forEach((q) => { rond(c, q[0], q[1], q[2]); c.fill(); });
    // premier plan : grandes lanternes coupées par les bords, pierres effondrées, brume au sol
    lanterne(c, 548, 690, 62, 'vraie', COUL[0], 1, t);
    lanterne(c, 52, 724, 66, 'vraie', COUL[3], 1, t);
    for (let n = 0; n < 6; n++) {
      const yy = 560 + n * 46, dx = (n % 2 ? -1 : 1) * 30;
      const bg = c.createLinearGradient(0, yy - 40, 0, yy + 40);
      bg.addColorStop(0, 'rgba(190,200,225,0)'); bg.addColorStop(0.5, `rgba(190,200,225,${0.14 + n * 0.03})`); bg.addColorStop(1, 'rgba(190,200,225,0)');
      c.fillStyle = bg; c.fillRect(X0 + dx, yy - 40, LW, 80);
    }
    // vignette : les bords plongent dans la nuit
    const vig = c.createRadialGradient(300, 400, 260, 300, 400, 620);
    vig.addColorStop(0, 'rgba(4,6,14,0)'); vig.addColorStop(1, 'rgba(4,6,14,.55)');
    c.fillStyle = vig; c.fillRect(X0, Y0, LW, Y1 - Y0);
  }

  function cacherInterface() {
    document.querySelectorAll('.ecran, .voile, #toast, .rond, button, .jel-langue, jel-langue').forEach((el) => el.style.setProperty('display', 'none', 'important'));
  }
  function demarrerAffiche() {
    ecran = 'affiche';
    cacherInterface();
    // Le bouton de langue peut être créé après ce script : on le cache aussi un peu plus tard.
    setTimeout(cacherInterface, 50);
    setTimeout(cacherInterface, 400);
    setTimeout(cacherInterface, 1200);
    $('fond').style.display = 'block';
    dessinerAffiche();
    window.addEventListener('resize', dessinerAffiche);
  }

  // ---------------------------------------------------------------------
  //  Images du jeu (page du jeu)
  // ---------------------------------------------------------------------
  // Avec window.JEL_APERCU = 1, 2 ou 3 (posé par le robot du site, jamais par le jeu) : le jeu s'ouvre
  // directement en pleine nuit solo contre les 4 robots, avec sa vraie interface (places et foulées,
  // bande de la course, plan de la ville), sans écran titre, ni fenêtre « Continuer », ni tutoriel
  // (CONSIGNES-JEU.md, section 5). La nuit est jouée par les règles (jel-regles) avec un hasard à graine
  // fixe jusqu'au tour du joueur, puis figée : ni victoire, ni défaite, ni son, ni sauvegarde, ni réseau.
  //   1 = nuit 1 : le tracé s'allume en lanternes jusqu'au poste ;
  //   2 = nuit 8 : le joueur rejoue le tracé de mémoire entre les ruines, une case dans la brume ;
  //   3 = nuit 19, sur un écran d'ordinateur : sprint à deux postes, lanternes froides, brume, Coureur pâle
  //       masqué aux couleurs d'un rival, minuit a sonné et un coureur est déjà rattrapé.
  const SCENES_APERCU = {
    1: { nuit: 1, coups: 6, phase: 'montre', sp: 0, tenue: 0, ok: (e) => e.ch.k1 >= 4 && e.av.some((a) => a < 3) },
    2: { nuit: 8, coups: 9, phase: 'saisie', sp: 0, pas: 3, tenue: 2, ok: (e) => e.ch.b.length >= 1 && e.ch.b[0] >= 3 && e.ch.k1 >= 5 },
    3: { nuit: 19, coups: 14, phase: 'montre', sp: 1, tenue: 4, ok: (e) => e.ch.m && e.ch.f.length >= 2 && e.ch.b.length >= 1 && !e.ch.r && e.nOut >= 1 }
  };

  // Rejoue la nuit (robots aux 5 places, le joueur bien réglé) jusqu'à un tour du joueur qui montre la scène.
  function nuitApercu(sc) {
    for (let graine = 1; graine < 600; graine++) {
      const alea = graineHasard(graine * 7919 + sc.nuit * 104729);
      let e = R.depart(alea, PLACES, { niveau: sc.nuit });
      for (let coup = 0; coup < 120 && !R.fin(e) && !e.out[0]; coup++) {
        if (e.tour === 0 && coup >= sc.coups && sc.ok(e)) return e;
        const s = e.tour, a = R.bot(e, s, alea, s === 0 ? 0.97 : O.forceNiveau(sc.nuit));
        if (!R.valide(e, s, a)) break;
        e = R.jouer(e, s, a, alea);
      }
    }
    return null;
  }

  function ouvrirApercu(numero) {
    modeApercu = numero;
    const sc = SCENES_APERCU[numero];
    if (numero === 3) document.documentElement.classList.add('apercu-large');
    let e = nuitApercu(sc);
    if (!e) { e = R.depart(graineHasard(7), PLACES, { niveau: sc.nuit }); e.tour = 0; e.ch.s = 0; }
    prog.tenue = sc.tenue; // en mémoire seulement : rien n'est enregistré
    session = 'solo'; niveau = sc.nuit; enPartie = false;
    vue = JSON.parse(JSON.stringify(e));
    // Partie figée, sans moteur ni robots qui jouent : le joueur (place 0) est à son tour.
    partie = {
      siege: 0, phase: 'jeu', mode: 'solo', n: 0, manche: 0, chef: -1, etat: vue,
      sieges: () => { const l = []; for (let s = 0; s < PLACES; s++) l.push({ humain: s === 0, moi: s === 0, chef: false }); return l; },
      monTour: () => true, jouer: () => false, pause: () => {}, quitter: () => {}, estChef: () => false, lancerManche: () => false
    };
    affAv = vue.av.slice();
    const ch = vue.ch, hor = horaire(ch, sc.sp, NIVEAUX[vue.n]);
    mon = { n: 0, phase: sc.phase, sp: sc.sp, tt: 0, tot: hor.tot, allumees: hor.tot, pas: [], pasT: [], pos: ch.d, ch: ch, hor: hor };
    if (sc.phase === 'montre') mon.tt = hor.fin - 320; // tout le tracé est allumé, juste avant que la nuit l'avale
    else {
      const k = Math.min(sc.pas, hor.tot - 1);
      mon.pas = ch.p.slice(0, k); mon.pasT = mon.pas.map(() => -1e6);
      mon.pos = k ? ch.p[k - 1] : ch.d;
      survol = ch.p[k]; // le doigt sur la case suivante
    }
    afficherEcran('jeu');
    majInterface();
  }

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  const numeroApercu = Number(window.JEL_APERCU);
  if (window.JEL_AFFICHE) demarrerAffiche();
  else if (numeroApercu === 1 || numeroApercu === 2 || numeroApercu === 3) ouvrirApercu(numeroApercu);
  else {
    try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
    afficherEcran('titre');
    ajusterTitre();
    // Ouvert par le bouton « Rejoindre » d'un ami : directement dans le salon de sa partie en ligne.
    if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
  }
})();
