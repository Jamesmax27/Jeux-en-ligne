    } else {
      const w = s * 0.24, h = s * 0.3;
      c.fillStyle = '#2b1d10'; rr(c, x - w * 0.6, y - h * 0.75, w * 1.2, h * 0.18, 2); c.fill();
      c.fillStyle = '#ffd58a'; rr(c, x - w / 2, y - h * 0.58, w, h, w * 0.25); c.fill();
      c.strokeStyle = '#2b1d10'; c.lineWidth = Math.max(1, s * 0.025); c.stroke();
      c.fillStyle = '#ff8a1c';
      c.beginPath(); c.ellipse(x, y - h * 0.05, w * 0.18, h * 0.25 * vac, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#2b1d10'; c.beginPath(); c.moveTo(x, y - h * 0.75); c.lineTo(x, y - h * 0.95); c.stroke();
    }
    c.restore();
  }

  function gourde(c, x, y, s, a) {
    c.save(); c.globalAlpha = a === undefined ? 1 : a;
    lueur(c, x, y, s * 0.6, 'rgba(140,255,170,0.5)');
    c.fillStyle = '#3d7a4a'; rr(c, x - s * 0.13, y - s * 0.12, s * 0.26, s * 0.3, s * 0.1); c.fill();
    c.fillStyle = '#7fd08e'; rr(c, x - s * 0.1, y - s * 0.08, s * 0.08, s * 0.2, s * 0.04); c.fill();
    c.fillStyle = '#2b2b2b'; c.fillRect(x - s * 0.05, y - s * 0.22, s * 0.1, s * 0.1);
    c.restore();
  }

  function fanion(c, x, y, s, coul) {
    c.save();
    c.strokeStyle = '#d9d2c2'; c.lineWidth = Math.max(1.5, s * 0.04);
    c.beginPath(); c.moveTo(x - s * 0.18, y + s * 0.3); c.lineTo(x - s * 0.18, y - s * 0.32); c.stroke();
    c.fillStyle = coul || '#ff6f8e';
    c.beginPath(); c.moveTo(x - s * 0.17, y - s * 0.32); c.lineTo(x + s * 0.24, y - s * 0.2); c.lineTo(x - s * 0.17, y - s * 0.06); c.fill();
    c.restore();
  }

  // Réverbère du poste de départ.
  function poste(c, x, y, s, t) {
    lueur(c, x, y - s * 0.1, s * 0.75, 'rgba(255,214,140,0.45)');
    c.save();
    c.fillStyle = '#20253f'; c.fillRect(x - s * 0.04, y - s * 0.32, s * 0.08, s * 0.62);
    c.fillStyle = '#2d3354'; rr(c, x - s * 0.14, y + s * 0.26, s * 0.28, s * 0.08, 3); c.fill();
    c.fillStyle = '#ffe2a6'; rr(c, x - s * 0.1, y - s * 0.44, s * 0.2, s * 0.15, 3); c.fill();
    c.restore();
    void t;
  }

  function empreinte(c, x, y, s, coul, a, rot) {
    c.save(); c.globalAlpha = a; c.fillStyle = coul;
    c.translate(x, y); c.rotate(rot || 0);
    c.beginPath(); c.ellipse(-s * 0.1, -s * 0.06, s * 0.06, s * 0.1, -0.2, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(s * 0.1, s * 0.08, s * 0.06, s * 0.1, 0.2, 0, Math.PI * 2); c.fill();
    c.restore();
  }

  // Nuage de brume posé sur une case.
  function nuage(c, x, y, s, t, a) {
    c.save(); c.globalAlpha = a;
    for (let i = 0; i < 4; i++) {
      const ox = Math.cos(t / 900 + i * 1.7) * s * 0.18, oy = Math.sin(t / 1100 + i) * s * 0.1;
      lueur(c, x + ox, y + oy, s * (0.45 + i * 0.05), 'rgba(205,215,230,0.85)');
    }
    c.restore();
  }

  // Dessin d'un dossard maudit (aucun chiffre) : carré blanc et symbole.
  function dossard(c, id, x, y, s, gagne) {
    c.save();
    c.globalAlpha = gagne ? 1 : 0.35;
    c.translate(x, y); c.rotate(-0.06);
    c.fillStyle = '#f4f1e8'; rr(c, -s * 0.42, -s * 0.34, s * 0.84, s * 0.68, s * 0.07); c.fill();
    c.fillStyle = '#7a1530'; [[-0.34, -0.26], [0.34, -0.26], [-0.34, 0.26], [0.34, 0.26]].forEach((p) => { rond(c, p[0] * s, p[1] * s, s * 0.035); c.fill(); });
    c.fillStyle = '#7a1530'; c.strokeStyle = '#7a1530'; c.lineWidth = s * 0.05; c.lineCap = 'round';
    const k = s * 0.2;
    switch (id) {
      case 'lune': c.beginPath(); c.arc(0, 0, k, 0, Math.PI * 2); c.fill(); c.fillStyle = '#f4f1e8'; c.beginPath(); c.arc(k * 0.45, -k * 0.2, k * 0.85, 0, Math.PI * 2); c.fill(); break;
      case 'corbeau': c.beginPath(); c.moveTo(-k * 1.3, -k * 0.2); c.quadraticCurveTo(-k * 0.5, -k * 0.9, 0, 0); c.quadraticCurveTo(k * 0.5, -k * 0.9, k * 1.3, -k * 0.2); c.quadraticCurveTo(k * 0.4, -k * 0.3, 0, k * 0.5); c.quadraticCurveTo(-k * 0.4, -k * 0.3, -k * 1.3, -k * 0.2); c.fill(); break;
      case 'brume': for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(-k * 1.2, i * k * 0.6); c.bezierCurveTo(-k * 0.5, i * k * 0.6 - k * 0.4, k * 0.2, i * k * 0.6 + k * 0.4, k * 1.2, i * k * 0.6); c.stroke(); } break;
      case 'follet': c.fillStyle = '#1f6fa3'; c.beginPath(); c.moveTo(0, -k * 1.3); c.quadraticCurveTo(k, 0, 0, k); c.quadraticCurveTo(-k, 0, 0, -k * 1.3); c.fill(); break;
      case 'gourde': rr(c, -k * 0.6, -k * 0.6, k * 1.2, k * 1.5, k * 0.4); c.fill(); c.fillRect(-k * 0.25, -k * 1.1, k * 0.5, k * 0.5); break;
      case 'eclair': c.beginPath(); c.moveTo(k * 0.3, -k * 1.2); c.lineTo(-k * 0.6, k * 0.1); c.lineTo(0, k * 0.1); c.lineTo(-k * 0.3, k * 1.2); c.lineTo(k * 0.6, -k * 0.2); c.lineTo(0, -k * 0.2); c.closePath(); c.fill(); break;
      case 'masque': c.beginPath(); c.ellipse(0, 0, k * 1.1, k * 0.9, 0, 0, Math.PI * 2); c.fill(); c.fillStyle = '#f4f1e8'; c.beginPath(); c.ellipse(-k * 0.42, -k * 0.15, k * 0.25, k * 0.17, -0.2, 0, Math.PI * 2); c.fill(); c.beginPath(); c.ellipse(k * 0.42, -k * 0.15, k * 0.25, k * 0.17, 0.2, 0, Math.PI * 2); c.fill(); c.beginPath(); c.arc(0, k * 0.35, k * 0.3, Math.PI * 1.1, Math.PI * 1.9); c.fill(); break;
      case 'fil': c.beginPath(); c.moveTo(-k * 1.4, k * 0.4); c.lineTo(k * 1.4, k * 0.4); c.stroke(); rond(c, 0, -k * 0.2, k * 0.35); c.fill(); c.beginPath(); c.moveTo(0, k * 0.1); c.lineTo(0, k * 0.4); c.stroke(); break;
      case 'meute': rond(c, 0, k * 0.3, k * 0.5); c.fill(); [[-0.6, -0.35], [-0.2, -0.75], [0.2, -0.75], [0.6, -0.35]].forEach((p) => { rond(c, p[0] * k, p[1] * k, k * 0.22); c.fill(); }); break;
      case 'trois': for (let i = -1; i <= 1; i++) { const cx = i * k * 0.9; c.beginPath(); for (let j = 0; j < 10; j++) { const a = -Math.PI / 2 + j * Math.PI / 5, r = j % 2 ? k * 0.18 : k * 0.42; c.lineTo(cx + Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); c.fill(); } break;
      case 'aube': c.beginPath(); c.arc(0, k * 0.5, k * 0.7, Math.PI, 0); c.fill(); for (let i = 0; i < 5; i++) { const a = Math.PI + (i + 0.5) * Math.PI / 5; c.beginPath(); c.moveTo(Math.cos(a) * k, k * 0.5 + Math.sin(a) * k); c.lineTo(Math.cos(a) * k * 1.4, k * 0.5 + Math.sin(a) * k * 1.4); c.stroke(); } break;
      default: c.fillStyle = '#7a1530'; rr(c, -k * 0.45, -k * 0.7, k * 0.9, k * 1.2, k * 0.2); c.fill(); c.fillStyle = '#ffb347'; c.beginPath(); c.ellipse(0, -k * 0.1, k * 0.2, k * 0.35, 0, 0, Math.PI * 2); c.fill(); break;
    }
    c.restore();
  }

  // Écran titre (sert de jaquette) : rue pavée, lune, lanternes, coureurs et Coureur pâle.
  function dessinerTitre() {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const ciel = c.createLinearGradient(0, 0, 0, h);
    ciel.addColorStop(0, '#04050d'); ciel.addColorStop(0.45, '#151a38'); ciel.addColorStop(0.62, '#2c2a4a'); ciel.addColorStop(1, '#0a0b16');
    c.fillStyle = ciel; c.fillRect(0, 0, w, h);
    const al = graineHasard(13);
    for (let i = 0; i < 90; i++) { c.fillStyle = 'rgba(255,255,255,' + (0.2 + al() * 0.6) + ')'; c.fillRect(al() * w, al() * h * 0.5, 1.4, 1.4); }
    const m = Math.min(w, h);
    const portrait = h > w * 1.2;
    const lx = w * 0.74, ly = h * (portrait ? 0.3 : 0.2), lr = m * (portrait ? 0.1 : 0.12);
    lueur(c, lx, ly, lr * 3.2, 'rgba(240,235,210,0.35)');
    rond(c, lx, ly, lr); c.fillStyle = '#f2ecd2'; c.fill();
    c.fillStyle = '#ddd3b4'; [[-0.3, -0.2, 0.18], [0.25, 0.15, 0.22], [-0.05, 0.4, 0.12]].forEach((p) => { rond(c, lx + p[0] * lr, ly + p[1] * lr, p[2] * lr); c.fill(); });
    // horizon (point de fuite) et maisons
    const hz = h * (portrait ? 0.48 : 0.6), vx = w * 0.5;
    const maisons = (couleur, base, haut, graine) => {
      const a = graineHasard(graine);
      c.fillStyle = couleur;
      let x = -10;
      while (x < w + 10) {
        const lg = 30 + a() * 50, ht = haut * (0.6 + a() * 0.6);
        c.beginPath(); c.moveTo(x, base); c.lineTo(x, base - ht); c.lineTo(x + lg / 2, base - ht - lg * 0.45); c.lineTo(x + lg, base - ht); c.lineTo(x + lg, base); c.fill();
        if (a() < 0.5) c.fillRect(x + lg * 0.7, base - ht - lg * 0.4, lg * 0.12, lg * 0.3);
        for (let f = 0; f < 3; f++) if (a() < 0.35) { c.save(); c.fillStyle = 'rgba(255,190,90,0.75)'; c.fillRect(x + lg * (0.2 + f * 0.25), base - ht * (0.35 + a() * 0.4), lg * 0.12, lg * 0.14); c.restore(); }
        x += lg + 2;
      }
    };
    maisons('#1b1d33', hz, h * 0.13, 5);
    maisons('#11132a', hz + h * 0.02, h * 0.08, 9);
    // rue en perspective
    c.fillStyle = '#1a1c2c';
    c.beginPath(); c.moveTo(vx - w * 0.05, hz); c.lineTo(vx + w * 0.05, hz); c.lineTo(w * 1.1, h); c.lineTo(-w * 0.1, h); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(120,130,170,0.18)'; c.lineWidth = 1;
    for (let i = 1; i < 14; i++) { const k = i / 14, y = hz + (h - hz) * k * k; const dx = w * 0.05 + (w * 0.6) * k * k; c.beginPath(); c.moveTo(vx - dx, y); c.lineTo(vx + dx, y); c.stroke(); }
    for (let i = -5; i <= 5; i++) { c.beginPath(); c.moveTo(vx + i * w * 0.01, hz); c.lineTo(vx + i * w * 0.13, h); c.stroke(); }
    // brume lointaine
    for (let i = 0; i < 6; i++) lueur(c, w * (0.1 + i * 0.17), hz - h * 0.01, w * 0.22, 'rgba(190,200,225,0.25)');
    // lanternes de part et d'autre de la rue
    for (let i = 0; i < 5; i++) {
      const k = (i + 1) / 6, y = hz + (h - hz) * k * k * 0.95, dx = w * 0.06 + w * 0.5 * k * k, s = 14 + 60 * k * k;
      [-1, 1].forEach((sg) => {
        const x = vx + sg * dx;
        c.fillStyle = '#0b0c18'; c.fillRect(x - s * 0.04, y - s * 1.1, s * 0.08, s * 1.1);
        lanterne(c, x, y - s * 1.15, s, 0, false, 1);
      });
    }
    // Coureur pâle au loin, dans la brume (tailles mesurées sur la largeur en portrait)
    const k = Math.min(h, w * 1.15);
    const ph = k * 0.22;
    lueur(c, vx + w * 0.03, hz - ph * 0.4, ph * 1.1, 'rgba(225,235,240,0.4)');
    silhouette(c, vx + w * 0.03, hz + k * 0.02, ph, null, 0.6, { pale: true, alpha: 0.75 });
    // peloton qui fuit vers nous
    const coureurs = [[0.36, 0.03, 0.17, 0, 0.2], [0.62, 0.06, 0.19, 1, 1.9], [0.2, 0.1, 0.22, 3, 3.1], [0.8, 0.13, 0.24, 2, 4.2]];
    coureurs.forEach((p) => silhouette(c, w * p[0], hz + k * p[1] + k * p[2] * 0.55, k * p[2], COUL[p[3]], p[4]));
    // brume au premier plan
    for (let i = 0; i < 5; i++) lueur(c, w * (0.05 + i * 0.24), h * 0.97, w * 0.3, 'rgba(170,180,210,0.22)');
  }

  // ---------------------------------------------------------------------
  //  Écrans, messages
  // ---------------------------------------------------------------------

  let ecran = 'titre';
  let partie = null;
  let session = null;                 // 'solo' ou 'ligne'
  let niveau = 1;
  let vue = null;                     // copie de l'état affiché
  let enPartie = false, enPause = false;
  let humainsAvant = null;
  let generation = 0;                 // change à chaque nouvelle manche (annule les minuteries)
  let debutTour = 0, dernierTic = -1, finManche = 0;
  let tJeu = 0;                       // horloge du jeu (ms), arrêtée en pause
  let revele = null;                  // lanternes du tour : { cle, t0, mode, vt, tient, fin }
  let cleTour = '';                   // tour déjà préparé (révélation ou choix)
  let saisie = false;                 // le joueur peut refaire le chemin
  let effets = [];                    // flashs, secousses, Coureur pâle
  let particules = [];
  let secousse = 0;
  let stats = null;                   // statistiques du joueur pendant la nuit
  let finMontree = false;

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'vestiaire', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom !== 'jeu') dessinerTitre();
    if (nom === 'titre') majTitre();
    if (nom === 'jeu') relancerBoucle();
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    const voile = salonOuvert() || $('voile-fin').classList.contains('actif');
    el.classList.toggle('haut', voile);
    // Pendant la course : en haut du plateau, sans cacher les coureurs ni le message du tour.
    if (ecran === 'jeu' && !voile) { el.style.top = Math.round($('zone').getBoundingClientRect().top + 6) + 'px'; el.style.bottom = 'auto'; }
    else { el.style.top = ''; el.style.bottom = ''; }
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2400);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  function tenueDe(s, info) { return info && info.moi ? TENUES[prog.tenue] : null; }

  // Cartes des 5 coureurs, en haut de l'écran, et les mêmes dans le salon.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'jeton'; cv.width = 88; cv.height = 88;
      const av = document.createElement('span'); av.className = 'av';
      const tag = document.createElement('span'); tag.className = 'tag';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 44; cour.height = 34;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 22, 30, 20);
      d.append(cv, av, tag, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 100; cv.height = 100;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  // Nom d'un coureur dans les messages : pseudo d'un vrai joueur, sinon sa couleur.
  function nomCoureur(s) {
    const info = siegesActuels()[s] || {};
    return info.humain && !info.moi && info.nom ? info.nom : tr('coureur.' + s);
  }
  function remplirTag(tag, role, nom, mort) {
    const texte = mort ? '' : (nom || tr('place.' + role));
    const cle = role + '|' + texte + '|' + (mort ? 1 : 0);
    if (tag.dataset.cle === cle) return;
    tag.dataset.cle = cle;
    tag.innerHTML = mort ? ICONE_MORT : (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !e.fini ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const av = e ? e.av[s] : 0, mort = !!(e && e.mort[s]);
      const role = roleDe(info);
      const cle = role + '|' + prog.tenue;
      if (d.dataset.jeton !== cle) {
        d.dataset.jeton = cle;
        const c = d.querySelector('canvas.jeton').getContext('2d');
        c.clearRect(0, 0, 88, 88);
        jeton(c, s, 44, 44, 40, tenueDe(s, info));
      }
      const zone = d.querySelector('.av');
      const texteAv = nb(av);
      if (zone.dataset.v !== texteAv) { zone.dataset.v = texteAv; zone.innerHTML = ICONE_PAS; const sp = document.createElement('span'); sp.textContent = texteAv; zone.appendChild(sp); }
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('mort', mort);
      d.classList.toggle('danger', !!e && !mort && av === 1);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role), mort);
      d.setAttribute('aria-label', tr('place.aria.' + role, { coureur: tr('coureur.' + s), n: av }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (mort ? ' · ' + tr('place.elimine') : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || partie.phase !== 'jeu' || e.fini) return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (e.mort[partie.siege] && s !== partie.siege) return tr('tour.eliminePlace', { nom: nomCoureur(s) });
    if (s === partie.siege) {
      if (e.ph === 'choix') return tr('tour.choix');
      if (revele && !saisie) return tr('tour.memorise');
      return tr('tour.toi');
    }
    return tr('tour.nom', { nom: nomCoureur(s) });
  }

  function majInfos() {
    let info = '';
    const e = vue;
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: N });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if (e && !e.fini && partie && partie.phase === 'jeu') info += ' · ' + tr('jeu.poste', { n: Math.min(e.ronde, e.R), total: e.R });
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majChoix();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fini) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Le tour du joueur : lanternes, choix du sprint, saisie
  // ---------------------------------------------------------------------

  function monTourVue() {
    return !!(partie && vue && !vue.fini && partie.phase === 'jeu' && partie.siege >= 0 && R.aQui(vue) === partie.siege && !vue.mort[partie.siege]);
  }

  // Appelée après chaque événement : prépare le tour du joueur une seule fois.
  function verifierTour() {
    clore();
    if (!monTourVue() || attenteTuto || enPause) return;
    const e = vue;
    if (e.ph === 'choix') {
      const cle = 'c' + partie.manche + '.' + e.nt;
      if (cleTour !== cle) { cleTour = cle; revele = null; saisie = false; sons.tour(); majChoix(); }
      return;
    }
    const cle = 'r' + partie.manche + '.' + e.nt;
    if (cleTour === cle) return;
    cleTour = cle;
    demarrerRevelation(e);
  }

  // Course finie et c'est à moi (place 0) de clore la manche : tout de suite.
  function clore() {
    if (!partie || !vue || !vue.fini || vue.clos || clore.prevu) return;
    clore.prevu = true;
    setTimeout(() => {
      clore.prevu = false;
      if (!partie || partie.phase !== 'jeu' || !partie.etat || !partie.etat.fini || partie.etat.clos) return;
      try { if (partie.monTour()) partie.jouer(O.CLORE); } catch (e) { /* rien */ }
    }, 0);
  }

  // Lanternes du tracé : une par une (ou toutes d'un coup les nuits sans lune),
  // puis elles restent un instant et s'éteignent. Depuis le pas déjà fait (k).
  function demarrerRevelation(e) {
    const lv = NIVEAUX[e.n];
    const reste = e.ch.length - e.k;
    const vt = lv.vt;
    const lune = !!lv.lune;
    const duree = lune ? 300 : reste * vt;
    const tient = lune ? Math.round(reste * vt * 0.75 + 700) : 650 + 70 * reste;
    revele = { t0: tJeu + 250, mode: lune ? 'lune' : 'seq', vt: vt, tient: tient, depuis: e.k, allume: -1 };
    revele.fin = revele.t0 + duree + tient;
    saisie = false;
    sons.tour();
    majInfos();
  }

  // Indice (dans le tracé) allumé au temps t : -1 avant, sinon le dernier allumé.
  function etapeRevelation(t) {
    if (!revele) return -1;
    const e = vue;
    if (t < revele.t0) return revele.depuis - 1;
    if (revele.mode === 'lune') return e.ch.length - 1;
    return Math.min(e.ch.length - 1, revele.depuis + Math.floor((t - revele.t0) / revele.vt));
  }

  function avancerRevelation() {
    if (!revele || !vue) return;
    const e = vue;
    const i = etapeRevelation(tJeu);
    if (i > revele.allume) {
      for (let j = Math.max(revele.depuis, revele.allume + 1); j <= i; j++) {
        if (e.br.indexOf(j) >= 0) souffle(0.25, { de: 900, vers: 400, vol: 0.03 });
        else sons.lanterne(j);
        if (e.fx.some((f) => f[1] === j)) sons.follet();
        if (revele.mode === 'lune') break;
      }
      revele.allume = i;
    }
    if (!saisie && tJeu >= revele.fin) {
      saisie = true;
      sons.eteint();
      majInfos();
    }
  }

  function majChoix() {
    const montre = monTourVue() && vue.ph === 'choix' && !attenteTuto && !enPause;
    const p = $('choix');
    if (montre !== p.classList.contains('actif')) {
      p.classList.toggle('actif', montre);
      if (montre) try { $('btn-sprint').focus({ preventScroll: true }); } catch (e) { /* rien */ }
    }
  }

  function choisir(sprint) {
    if (!monTourVue() || vue.ph !== 'choix') return;
    audio();
    if (partie.jouer(sprint ? O.SPRINT : O.NORMAL)) { sons.clic(); if (sprint) sons.sprint(); $('choix').classList.remove('actif'); }
  }

  // Un pas vers la case c (au doigt, à la souris ou aux flèches).
  function pas(c) {
    if (!monTourVue() || vue.ph !== 'course') return;
    audio();
    if (!saisie) { if (revele) { toast(tr('jeu.attends'), 1200); sons.non(); } return; }
    const cur = O.courante(vue);
    if (c < 0 || !O.adjacent(vue, cur, c)) { sons.non(); effets.push({ type: 'voisins', t0: tJeu }); return; }
    partie.jouer(c);
  }

  // ---------------------------------------------------------------------
  //  Plateau : pavés, brume, lanternes, coureurs
  // ---------------------------------------------------------------------

  let geo = null;
  function geometrie(e, w, h) {
    const s = Math.floor(Math.min((w - 12) / e.W, (h - 12) / e.H));
    return { s: s, ox: Math.round((w - s * e.W) / 2), oy: Math.round((h - s * e.H) / 2) };
  }
  function centre(g, e, c) { return [g.ox + (c % e.W + 0.5) * g.s, g.oy + (Math.floor(c / e.W) + 0.5) * g.s]; }

  function dessinerPaves(c, e, g, t) {
    const al = graineHasard(7 + e.W * 13 + e.H);
    for (let i = 0; i < e.W * e.H; i++) {
      const p = centre(g, e, i), s = g.s;
      const v = Math.floor(al() * 18);
      c.fillStyle = 'rgb(' + (38 + v) + ',' + (42 + v) + ',' + (62 + v) + ')';
      rr(c, p[0] - s * 0.46, p[1] - s * 0.46, s * 0.92, s * 0.92, s * 0.16); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.04)';
      rr(c, p[0] - s * 0.4, p[1] - s * 0.42, s * 0.5, s * 0.3, s * 0.1); c.fill();
    }
    void t;
  }

  function dessinerBrume(c, w, h, t, force) {
    for (let i = 0; i < 6; i++) {
      const x = (w * (0.15 + 0.17 * i) + Math.sin(t / 4000 + i * 2.1) * w * 0.12 + w) % (w + 80) - 40;
      const y = h * (0.2 + 0.13 * ((i * 3) % 6)) + Math.cos(t / 5200 + i) * h * 0.05;
      lueur(c, x, y, Math.max(w, h) * 0.32, 'rgba(160,172,205,' + (0.1 * force) + ')');
    }
  }

  function dessinerJeu() {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const t = tJeu;
    const fondG = c.createLinearGradient(0, 0, 0, h);
    fondG.addColorStop(0, '#0b0e22'); fondG.addColorStop(1, '#05060e');
    c.fillStyle = fondG; c.fillRect(0, 0, w, h);
    const e = vue;
    if (!e) { dessinerBrume(c, w, h, t, 1.4); return; }
    const g = geometrie(e, w, h);
    geo = g;
    c.save();
    if (secousse > t) { const k = (secousse - t) / 350; c.translate(Math.sin(t / 18) * 6 * k, Math.cos(t / 23) * 4 * k); }
    dessinerPaves(c, e, g, t);
    const s = g.s;
    const tour = R.aQui(e);
    const moi = partie ? partie.siege : -1;
    const monTour = monTourVue();
    // Poste de départ du tracé
    const pp = centre(g, e, e.pos);
    poste(c, pp[0] - s * 0.28, pp[1], s, t);
    // Empreintes du tour (pas déjà faits)
    let prec = e.pos;
    for (let i = 0; i < e.k; i++) {
      const p = centre(g, e, e.ch[i]), q = centre(g, e, prec);
      empreinte(c, p[0], p[1], s, COUL[tour], 0.75, Math.atan2(p[1] - q[1], p[0] - q[0]) + Math.PI / 2);
      prec = e.ch[i];
    }
    // Lanternes (seulement pour le joueur dont c'est le tour)
    if (monTour && revele && e.ph === 'course') dessinerLanternes(c, e, g, t);
    // Cases voisines où l'on peut aller
    if (monTour && saisie && e.ph === 'course') {
      const cur = O.courante(e);
      const vif = effets.some((f) => f.type === 'voisins' && t - f.t0 < 600);
      O.voisins(e, cur).forEach((v) => {
        const p = centre(g, e, v.c);
        c.strokeStyle = vif ? 'rgba(255,210,122,0.9)' : 'rgba(255,210,122,' + (0.25 + 0.15 * Math.sin(t / 300)) + ')';
        c.lineWidth = 2.5;
        rr(c, p[0] - s * 0.42, p[1] - s * 0.42, s * 0.84, s * 0.84, s * 0.14); c.stroke();
      });
    }
    // Brume qui flotte sur la ville
    dessinerBrume(c, w, h, t, 1);
    // Coureur de la place qui joue, sur sa case
    if (!e.fini && !e.mort[tour]) {
      const p = centre(g, e, O.courante(e));
      const info = siegesActuels()[tour] || {};
      lueur(c, p[0], p[1], s * 0.7, COUL[tour] + '55');
      jeton(c, tour, p[0], p[1] + Math.sin(t / 160) * 1.5, s * 0.34, tenueDe(tour, info));
    }
    // Effets : faux pas, Coureur pâle, postes, éliminations
    dessinerEffets(c, e, g, t);
    c.restore();
    // Particules
    particules = particules.filter((p) => t - p.t0 < p.vie);
    particules.forEach((p) => {
      const k = (t - p.t0) / p.vie;
      c.globalAlpha = 1 - k;
      c.fillStyle = p.coul;
      rond(c, p.x + p.vx * k * p.vie / 1000, p.y + p.vy * k * p.vie / 1000 + 40 * k * k, p.r * (1 - k * 0.5)); c.fill();
      c.globalAlpha = 1;
    });
    void moi;
  }

  function dessinerLanternes(c, e, g, t) {
    const s = g.s, rv = revele;
    const i = etapeRevelation(t);
    let alpha = 1;
    if (t > rv.fin - 300) alpha = Math.max(0, (rv.fin - t) / 300);
    if (alpha <= 0) return;
    for (let j = rv.depuis; j <= i; j++) {
      const p = centre(g, e, e.ch[j]);
      if (e.br.indexOf(j) >= 0) { nuage(c, p[0], p[1], s, t, alpha); continue; }
      lanterne(c, p[0], p[1], s, t, false, alpha);
      if (j === e.rv) gourde(c, p[0] + s * 0.26, p[1] + s * 0.24, s * 0.7, alpha);
      if (j === e.mi) fanion(c, p[0] + s * 0.2, p[1], s, '#ff6f8e');
    }
    // feux follets : s'allument avec la lanterne d'où part leur branche
    e.fx.forEach((f) => {
      if (f[1] <= i && f[1] >= rv.depuis - 1) { const p = centre(g, e, f[0]); lanterne(c, p[0], p[1], s, t, true, alpha); }
    });
    // Masque : le Coureur pâle, déguisé en un autre coureur, court sur le faux chemin
    if (e.lr.length && rv.depuis === 0) {
      const vit = rv.mode === 'lune' ? 380 : rv.vt * 0.95;
      const av = Math.max(0, (t - rv.t0) / vit);
      const jusque = Math.min(e.lr.length - 1, Math.floor(av));
      const deguise = (e.tour + 1 + e.nt) % PLACES === e.tour ? (e.tour + 2) % PLACES : (e.tour + 1 + e.nt) % PLACES;
      let precL = e.pos;
      for (let j = 0; j <= jusque; j++) {
        const p = centre(g, e, e.lr[j]), q = centre(g, e, precL);
        empreinte(c, p[0] + s * 0.18, p[1] + s * 0.1, s * 0.8, '#d8f3ff', 0.55 * alpha, Math.atan2(p[1] - q[1], p[0] - q[0]) + Math.PI / 2);
        precL = e.lr[j];
      }
      const a = e.lr[Math.max(0, Math.min(e.lr.length - 1, Math.floor(av)))];
      const b = e.lr[Math.max(0, Math.min(e.lr.length - 1, Math.floor(av) + 1))];
      const pa = centre(g, e, a), pb = centre(g, e, b), f = Math.min(1, av - Math.floor(av));
      const x = pa[0] + (pb[0] - pa[0]) * f, y = pa[1] + (pb[1] - pa[1]) * f;
      lueur(c, x, y, s * 0.6, 'rgba(220,240,255,0.5)', alpha);
      c.globalAlpha = alpha * 0.92;
      jeton(c, deguise, x, y, s * 0.3, null, { masque: true });
      c.globalAlpha = 1;
    }
  }

  function dessinerEffets(c, e, g, t) {
    const s = g.s;
    effets = effets.filter((f) => t - f.t0 < (f.vie || 1200));
    effets.forEach((f) => {
      const k = (t - f.t0) / (f.vie || 1200);
      if (f.type === 'faux') {
        const p = centre(g, e, f.c);
        c.strokeStyle = 'rgba(255,70,100,' + (1 - k) + ')'; c.lineWidth = 4;
        rr(c, p[0] - s * 0.44, p[1] - s * 0.44, s * 0.88, s * 0.88, s * 0.15); c.stroke();
        if (f.bon >= 0) {
          const q = centre(g, e, f.bon);
          c.strokeStyle = 'rgba(140,255,170,' + (1 - k) + ')';
          rr(c, q[0] - s * 0.44, q[1] - s * 0.44, s * 0.88, s * 0.88, s * 0.15); c.stroke();
        }
      } else if (f.type === 'pale') {
        // Le Coureur pâle jaillit de la brume vers le coureur
        const p = centre(g, e, f.c);
        const q = Math.min(1, k * 2.2), fade = k < 0.6 ? 1 : 1 - (k - 0.6) / 0.4;
        const x = p[0] + (f.dx || 0) * (1 - q), y = p[1] + g.s * 2.6 * (1 - q) - s * 0.15;
        lueur(c, x, y, s * 1.4, 'rgba(230,240,245,0.55)', fade);
        c.globalAlpha = fade;
        silhouette(c, x, y + s * 0.6, s * 1.5, null, t / 80, { pale: true, alpha: 0.85 });
        c.globalAlpha = 1;
        c.fillStyle = 'rgba(0,0,0,' + (0.25 * fade) + ')';
        c.fillRect(0, 0, g.ox * 2 + g.s * e.W, g.oy * 2 + g.s * e.H);
      } else if (f.type === 'elimine') {
        const p = centre(g, e, f.c);
        nuage(c, p[0], p[1], s * (1 + k * 1.5), t, 1 - k);
        c.globalAlpha = Math.max(0, 1 - k * 1.4);
        jeton(c, f.p, p[0], p[1] - k * s * 0.5, s * 0.34 * (1 - k * 0.4), null);
        c.globalAlpha = 1;
      } else if (f.type === 'poste') {
        const p = centre(g, e, f.c);
        lueur(c, p[0], p[1], s * (0.6 + k), 'rgba(255,214,140,0.6)', 1 - k);
      }
    });
  }

  function etincelles(c, coul, n) {
    if (!geo || !vue) return;
    const p = centre(geo, vue, c);
    for (let i = 0; i < (n || 14); i++) {
      const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 120;
      particules.push({ x: p[0], y: p[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, r: 2 + Math.random() * 2.5, coul: coul, t0: tJeu, vie: 700 + Math.random() * 400 });
    }
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu') { tPrec = 0; return; }
    const dt = tPrec ? Math.min(100, t - tPrec) : 16;
    tPrec = t;
    if (!enPause && !attenteTuto) tJeu += dt;
    avancerRevelation();
    dessinerJeu();
    majTemps();
    majCompte();
    if (t - (boucle.dernierInfo || 0) > 400) { boucle.dernierInfo = t; majInfos(); }
    rafId = requestAnimationFrame(boucle);
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      case 'refus': break;
      default: break;
    }
    majInterface();
    verifierTour();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function nouvelleVue(etat) {
    vue = etat ? JSON.parse(JSON.stringify(etat)) : null;
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    nouvelleVue(partie.etat);
    effets = []; revele = null; saisie = false; cleTour = '';
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la course,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    $('choix').classList.remove('actif');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + prog.tenue;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 100, 100);
        jeton(c, s, 50, 56, 40, tenueDe(s, info));
        if (info.chef) couronne(c, 50, 20, 18);
        remplirTag(d.querySelector('.tag'), role, nom, false);
        d.setAttribute('aria-label', tr('salon.place.' + role, { coureur: tr('coureur.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomChef ? nomChef + ' · ' + tr('coureur.' + partie.chef) : tr('coureur.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function nouvellesStats() { return { faux: 0, gourdes: 0, sprints: 0, brumes: 0, postes: 0 }; }

  function surManche() {
    generation++;
    nouvelleVue(partie.etat);
    effets = []; particules = []; revele = null; saisie = false; cleTour = '';
    debutTour = Date.now();
    dernierTic = -1;
    finMontree = false;
    stats = nouvellesStats();
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surAction(ev) {
    const avant = ev.avant, apres = ev.apres, d = apres.der || {};
    nouvelleVue(apres);
    debutTour = Date.now();
    dernierTic = -1;
    const moi = ev.moi;
    const s = ev.siege;
    const fini = apres.nt !== avant.nt || apres.fini;   // le tour de s est terminé
    if (moi || fini) { revele = null; saisie = false; }
    if (d.t === 'choix') {
      if (!moi) toast(tr(d.s ? 'tour.sprintAutre' : 'tour.normalAutre', { nom: nomCoureur(s) }), 1600);
      if (moi && d.s && stats) stats.sprints++;
      if (moi) { cleTour = ''; }
    } else if (d.t === 'pas' || d.t === 'poste') {
      if (moi) sons.pas(avant.k); else sons.pasAutre();
      if (moi && stats) { if (d.b) stats.brumes++; }
      if (d.g) {
        sons.gourde(); etincelles(d.c, '#8cffaa', 18);
        if (moi) { if (stats) stats.gourdes++; toast(tr('jeu.gourde')); }
        bondir(s);
      }
      if (d.mi) { sons.poste(); etincelles(d.c, '#ff9db0', 12); }
      if (d.t === 'poste') {
        sons.poste();
        effets.push({ type: 'poste', c: d.c, t0: tJeu, vie: 900 });
        etincelles(d.c, COUL[s], 16);
        if (d.s) { toast(tr(moi ? 'jeu.sprintReussi' : 'jeu.sprintAutre', { nom: nomCoureur(s) })); bondir(s); if (moi && stats) stats.eclairs = (stats.eclairs || 0) + 1; }
        if (moi && stats) stats.postes++;
      }
      // le joueur a refait son tracé sans revoir les lanternes : il continue
      if (moi && d.t === 'pas') saisie = true;
    } else if (d.t === 'faux') {
      sons.faux();
      sons.pale();
      secousse = tJeu + 350;
      effets.push({ type: 'faux', c: d.c, bon: d.bon, t0: tJeu, vie: 1300 });
      effets.push({ type: 'pale', c: d.c, t0: tJeu, vie: 1100, dx: (Math.random() - 0.5) * 80 });
      bondir(s);
      if (moi && stats) stats.faux++;
      if (d.el) {
        effets.push({ type: 'elimine', c: d.c, p: s, t0: tJeu + 500, vie: 1400 });
        setTimeout(() => sons.elimine(), 450);
        if (moi) toast(tr(session === 'solo' ? 'jeu.eliminePerdu' : 'jeu.elimineToi'), 3200);
        else toast(tr('jeu.elimineAutre', { nom: nomCoureur(s) }), 2400);
      } else {
        toast(moi ? tr(d.f ? 'jeu.follet' : 'jeu.fauxPas') : tr('jeu.fauxAutre', { nom: nomCoureur(s) }), 1700);
        if (moi && apres.av[s] === 1) setTimeout(() => sons.coeur(), 700);
      }
    }
    if (ev.auto) toast(tr(moi ? 'multi.autoToi' : 'multi.auto'));
    // Solo : rattrapé par le Coureur pâle, la nuit est perdue tout de suite.
    if (session === 'solo' && partie.siege >= 0 && apres.mort[partie.siege] && !avant.mort[partie.siege]) {
      const etat = JSON.parse(JSON.stringify(apres));
      const j = generation;
      enPartie = false;
      try { partie.pause(true); } catch (e) { /* rien */ }
      setTimeout(() => { if (j !== generation) return; afficherFin(etat); }, 1700);
    }
  }

  function bondir(s) {
    const carte = $('place-' + s);
    if (!carte) return;
    carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = generation;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    const etat = JSON.parse(JSON.stringify(partie.etat));
    setTimeout(() => {
      if (j !== generation || !partie) return;
      if (enLigne) afficherFinEnLigne(etat); else afficherFin(etat);
    }, 1100);
  }

  // ---------------------------------------------------------------------
  //  Fins de nuit : victoire, défaite, classement, dossards
  // ---------------------------------------------------------------------

  function gagnant(e, moi) {
    if (moi < 0 || e.mort[moi]) return false;
    let haut = 0;
    for (let s = 0; s < e.av.length; s++) if (!e.mort[s]) haut = Math.max(haut, e.av[s]);
    return e.av[moi] === haut;
  }
  function etoilesPour(av, depart, gagne) {
    if (!gagne) return 0;
    return av >= depart ? 3 : av >= depart - 1 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    let ordre = res ? res.classement : null;
    if (!ordre) {
      const debout = [];
      for (let s = 0; s < PLACES; s++) if (!e.mort[s]) debout.push(s);
      debout.sort((a, b) => e.av[b] - e.av[a]);
      ordre = debout.concat(e.el.slice().reverse());
    }
    ordre.forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '') + (e.mort[s] ? ' mort' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60;
      const info = sieges[s] || {};
      jeton(cv.getContext('2d'), s, 30, 30, 27, s === moi ? TENUES[prog.tenue] : null);
      const qui = document.createElement('span'); qui.className = 'qui';
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('coureur.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = e.mort[s] ? tr('fin.elimine') : tr('fin.foulees', { n: e.av[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  // Compteurs et dossards gagnés après une nuit (solo ou en ligne).
  function gagnerDossards(e, gagne, enLigne) {
    const nouveaux = [];
    const st = stats || nouvellesStats();
    const lv = NIVEAUX[e.n];
    prog.cpt.brume += st.brumes;
    prog.cpt.gourde += st.gourdes;
    prog.cpt.eclair += st.eclairs || 0;
    if (gagne && lv.fx > 0 && !enLigne) prog.cpt.follet += 1;
    const moi = partie ? partie.siege : 0;
    const ajouter = (id) => { if (prog.dossards.indexOf(id) < 0) { prog.dossards.push(id); nouveaux.push(id); } };
    if (gagne && !enLigne) ajouter('lune');
    if (gagne && st.faux === 0) ajouter('corbeau');
    if (prog.cpt.brume >= OBJECTIFS.brume) ajouter('brume');
    if (prog.cpt.follet >= OBJECTIFS.follet) ajouter('follet');
    if (prog.cpt.gourde >= OBJECTIFS.gourde) ajouter('gourde');
    if (prog.cpt.eclair >= OBJECTIFS.eclair) ajouter('eclair');
    if (gagne && lv.mq) ajouter('masque');
    if (gagne && moi >= 0 && e.av[moi] === 1) ajouter('fil');
    if (gagne && enLigne) ajouter('meute');
    if (prog.etoiles.filter((x) => x === 3).length >= OBJECTIFS.trois) ajouter('trois');
    if (gagne && !enLigne && niveau === N) ajouter('aube');
    if (prog.etoiles.every((x) => x > 0)) ajouter('minuit');
    return nouveaux;
  }

  // Fin d'une manche en ligne : classement, puis le salon (même fenêtre).
  function afficherFinEnLigne(e) {
    finEnAttente = false;
    if (!e) return;
    const moi = partie.siege;
    const gagne = gagnant(e, moi);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    if (moi >= 0) {
      const nouveaux = gagnerDossards(e, gagne, true);
      sauver(prog.reprise, 0);
      if (nouveaux.length) setTimeout(() => toast(tr('fin.dossard', { nom: nouveaux.map((x) => tr('dossard.' + x + '.nom')).join(', ') }), 3500), 400);
    }
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  function afficherFin(e) {
    if (!e || finMontree) return;
    finMontree = true;
    $('choix').classList.remove('actif');
    const moi = partie ? partie.siege : 0, sieges = siegesActuels();
    const lv = NIVEAUX[e.n];
    const av = moi >= 0 && !e.mort[moi] ? e.av[moi] : 0;
    const gagne = gagnant(e, moi);
    const seul = O.vivants(e) === 1;
    const egalite = gagne && !seul && e.av.filter((x, s) => !e.mort[s] && x === av).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = gagne ? tr('fin.avance', { n: av }) : (e.mort[moi] ? tr('fin.rattrapeTexte') : tr('fin.distanceTexte', { n: av }));
    $('fin-dossards').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(av, lv.av, gagne);
      const ancienRecord = prog.records[i];
      const record = gagne && av > ancienRecord;
      if (record) prog.records[i] = av;
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < N && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
      }
      const nouveaux = gagnerDossards(e, gagne, false);
      if (gagne) {
        sauver(Math.min(niveau + 1, N), av);
        // Toutes les nuits gagnées (maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else if (nouveaux.length) sauver(prog.reprise, 0);
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : seul ? 'fin.dernier' : 'fin.aube') : tr(e.mort[moi] ? 'fin.rattrape' : 'fin.distance');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = gagne ? (record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, av) })) : tr('fin.conseil');
      $('fin-debloque').textContent = gagne && niveau === N ? tr('fin.derniere') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      if (nouveaux.length) $('fin-dossards').textContent = tr('fin.dossard', { nom: nouveaux.map((x) => tr('dossard.' + x + '.nom')).join(', ') });
      $('fin-compte').textContent = '';
      if (gagne && niveau < N) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      if (moi >= 0) { const nouveaux = gagnerDossards(e, gagne, true); sauver(prog.reprise, 0); if (nouveaux.length) $('fin-dossards').textContent = tr('fin.dossard', { nom: nouveaux.map((x) => tr('dossard.' + x + '.nom')).join(', ') }); }
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (manches « en ligne » jouées sur l'appareil).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Pluie de lumières de victoire (et aube rose).
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 110 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 5], k: 5 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function image(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      const k = Math.min(1, (t - debut) / 900);
      const aube = c.createLinearGradient(0, h, 0, h * 0.4);
      aube.addColorStop(0, 'rgba(255,170,150,' + (0.28 * k * Math.max(0, 1 - (t - debut) / 2600)) + ')'); aube.addColorStop(1, 'rgba(255,170,150,0)');
      c.fillStyle = aube; c.fillRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.shadowColor = b.coul; c.shadowBlur = 8; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(image); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(image);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, nuits, vestiaire
  // ---------------------------------------------------------------------

  let attenteTuto = false;

  function quitterPartie() {
    generation++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    revele = null; saisie = false; cleTour = '';
    bandeau('');
    $('choix').classList.remove('actif');
    fermerVoile('voile-pause');
    fermerVoile('voile-fin');
    fermerVoile('voile-tuto');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  // Parcours solo : nuit n contre 4 robots (force croissante, donnée par la nuit).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(N, n));
    quitterPartie();
    session = 'solo';
    enPartie = true;
    finMontree = false;
    stats = nouvellesStats();
    effets = []; particules = [];
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
    verifierTour();
  }

  // Course avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    stats = nouvellesStats();
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const grille = $('grille-niveaux');
    grille.textContent = '';
    NIVEAUX.forEach((_, i) => {
      const n = i + 1, ouvert = n <= prog.debloque;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, N) ? ' actuel' : '');
      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
      b.append(num, et);
      b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
      else b.disabled = true;
      grille.appendChild(b);
    });
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: N * 3 });
    afficherEcran('niveaux');
  }

  function ouvrirVestiaire() {
    const total = totalEtoiles();
    const gt = $('grille-tenues');
    gt.textContent = '';
    TENUES.forEach((te, i) => {
      const ouvert = total >= te.etoiles;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'carte-vest' + (ouvert ? '' : ' ferme') + (i === prog.tenue ? ' choisi' : '');
      const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128;
      jeton(cv.getContext('2d'), 0, 64, 64, 58, te);
      const nom = document.createElement('b'); nom.textContent = tr('tenue.' + te.id);
      const cond = document.createElement('span');
      cond.textContent = i === prog.tenue ? tr('vestiaire.portee') : ouvert ? tr('vestiaire.choisir') : tr('vestiaire.etoiles', { n: te.etoiles });
      b.append(cv, nom, cond);
      b.setAttribute('aria-pressed', i === prog.tenue ? 'true' : 'false');
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); prog.tenue = i; sauverReglages(); ouvrirVestiaire(); });
      else b.disabled = true;
      gt.appendChild(b);
    });
    const gd = $('grille-dossards');
    gd.textContent = '';
    DOSSARDS.forEach((id) => {
      const a = prog.dossards.indexOf(id) >= 0;
      const d = document.createElement('div');
      d.className = 'carte-vest' + (a ? ' gagne' : ' ferme');
      const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128;
      dossard(cv.getContext('2d'), id, 64, 64, 110, a);
      const nom = document.createElement('b'); nom.textContent = a ? tr('dossard.' + id + '.nom') : tr('vestiaire.cache');
      const cond = document.createElement('span');
      let txt = tr('dossard.' + id + '.cond');
      if (!a && OBJECTIFS[id]) {
        const v = id === 'trois' ? prog.etoiles.filter((x) => x === 3).length : prog.cpt[id];
        txt += ' ' + tr('vestiaire.progres', { n: Math.min(v, OBJECTIFS[id]), max: OBJECTIFS[id] });
      }
      cond.textContent = txt;
      d.append(cv, nom, cond);
      gd.appendChild(d);
    });
    $('vest-dossards-aide').textContent = tr('vestiaire.dossardsAide', { n: prog.dossards.length, max: DOSSARDS.length });
    $('vest-total').textContent = tr('etoiles.total', { n: total, max: N * 3 });
    afficherEcran('vestiaire');
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: N * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    majChoix();
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie && !finMontree) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
    majInterface();
    verifierTour();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés : mini-rue, lanternes, main qui refait le chemin
  // ---------------------------------------------------------------------

  // Scènes : grille W × H, poste p, tracé ch ([x, y]), feux follets fx,
  // brume br (indices), gourde rv, faux chemin lr, lune, vite, sprint (mi),
  // affame (foulées qui passent de 3 à 2).
  const TUTOS = {
    base: { W: 5, H: 3, p: [0, 2], ch: [[1, 2], [1, 1], [2, 1], [3, 1], [3, 0]], faux: true },
    faux: { W: 5, H: 3, p: [0, 2], ch: [[1, 2], [1, 1], [2, 1], [3, 1]], fx: [[[2, 0], 1], [[2, 2], 2]] },
    gourde: { W: 5, H: 3, p: [0, 2], ch: [[1, 2], [2, 2], [2, 1], [3, 1], [4, 1]], rv: 2 },
    brume: { W: 5, H: 3, p: [0, 1], ch: [[1, 1], [2, 1], [3, 1], [3, 0], [4, 0]], br: [1] },
    sprint: { W: 6, H: 3, p: [0, 2], ch: [[1, 2], [1, 1], [2, 1], [3, 1], [3, 0], [4, 0], [5, 0]], mi: 2 },
    vite: { W: 5, H: 3, p: [0, 2], ch: [[1, 2], [2, 2], [2, 1], [2, 0], [3, 0], [4, 0]], vite: true },
    masque: { W: 5, H: 3, p: [0, 2], ch: [[1, 2], [1, 1], [2, 1], [3, 1], [4, 1]], lr: [[1, 2], [1, 1], [1, 0], [2, 0], [3, 0]] },
    quartier: { W: 7, H: 4, p: [0, 3], ch: [[1, 3], [1, 2], [2, 2], [3, 2], [3, 1], [4, 1], [5, 1], [5, 0]] },
    lune: { W: 5, H: 3, p: [0, 2], ch: [[1, 2], [1, 1], [2, 1], [3, 1], [3, 0], [4, 0]], lune: true },
    affame: { W: 5, H: 3, p: [0, 2], ch: [[1, 2], [1, 1], [2, 1]], affame: true }
  };

  function main(c, x, y, k, appui) {
    c.save();
    c.translate(x, y); c.scale(k, k);
    c.fillStyle = '#ffe2c4'; c.strokeStyle = '#6b3d1a'; c.lineWidth = 2;
    const enfonce = appui * 4;
    c.beginPath();
    c.moveTo(-6, 6 + enfonce); c.lineTo(-6, -16 + enfonce); c.quadraticCurveTo(-6, -22 + enfonce, 0, -22 + enfonce); c.quadraticCurveTo(6, -22 + enfonce, 6, -16 + enfonce);
    c.lineTo(6, -2 + enfonce); c.lineTo(16, -2 + enfonce); c.quadraticCurveTo(22, -2 + enfonce, 22, 6 + enfonce); c.lineTo(20, 22 + enfonce); c.lineTo(-4, 22 + enfonce); c.lineTo(-12, 12 + enfonce); c.closePath();
    c.fill(); c.stroke();
    if (appui > 0.5) { c.strokeStyle = 'rgba(255,210,122,0.9)'; c.lineWidth = 3; rond(c, 0, -26, 10 + appui * 6); c.stroke(); }
    c.restore();
  }

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const W = d.W, H = d.H;
    const e = { W: W, H: H };
    const s = Math.floor(Math.min(520 / W, 320 / H));
    const g = { s: s, ox: Math.round((560 - s * W) / 2), oy: Math.round((360 - s * H) / 2) };
    const id = (p) => p[1] * W + p[0];
    const pos = id(d.p), ch = d.ch.map(id);
    const vt = d.vite ? 300 : 480;
    const T_REV = d.lune ? 300 : ch.length * vt, T_TIENT = 900, T_NOIR = 500, T_PAS = d.vite ? 520 : 700;
    const T_FIN = T_REV + T_TIENT + T_NOIR + ch.length * T_PAS + (d.faux ? 1800 : 1200);
    let debut = 0;
    const j = ++tutoAnim;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      let u = t - debut;
      if (u > T_FIN) { debut = t; u = 0; }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.fillStyle = '#0c0f22'; c.fillRect(0, 0, 560, 360);
      dessinerPaves(c, e, g, t);
      const pp = centre(g, e, pos);
      poste(c, pp[0] - s * 0.28, pp[1], s, t);
      // 1. lanternes
      const fin1 = T_REV + T_TIENT;
      if (u < fin1 + 300) {
        const a = u < fin1 ? 1 : 1 - (u - fin1) / 300;
        const n = d.lune ? ch.length : Math.min(ch.length, Math.floor(u / vt) + 1);
        for (let k = 0; k < n; k++) {
          const p = centre(g, e, ch[k]);
          if (d.br && d.br.indexOf(k) >= 0) { nuage(c, p[0], p[1], s, t, a); continue; }
          lanterne(c, p[0], p[1], s, t, false, a);
          if (d.rv === k) gourde(c, p[0] + s * 0.26, p[1] + s * 0.24, s * 0.7, a);
          if (d.mi === k) fanion(c, p[0] + s * 0.2, p[1], s, '#ff6f8e');
        }
        (d.fx || []).forEach((f) => { if (f[1] < n) { const p = centre(g, e, id(f[0])); lanterne(c, p[0], p[1], s, t, true, a); } });
        if (d.lr) {
          const lr = d.lr.map(id), av = Math.min(lr.length - 1, u / (vt * 0.95));
          for (let k = 0; k <= Math.floor(av); k++) { const p = centre(g, e, lr[k]); empreinte(c, p[0] + s * 0.18, p[1] + s * 0.1, s * 0.8, '#d8f3ff', 0.55 * a, 0); }
          const pa = centre(g, e, lr[Math.floor(av)]), pb = centre(g, e, lr[Math.min(lr.length - 1, Math.floor(av) + 1)]), f = av - Math.floor(av);
          c.globalAlpha = a; jeton(c, 2, pa[0] + (pb[0] - pa[0]) * f, pa[1] + (pb[1] - pa[1]) * f, s * 0.3, null, { masque: true }); c.globalAlpha = 1;
        }
      }
      if (d.br) d.br.forEach((k) => { const p = centre(g, e, ch[k]); nuage(c, p[0], p[1], s, t, 0.45); });
      // 3. la main refait le chemin
      const debut3 = fin1 + T_NOIR;
      let k3 = -1, dans = 0;
      if (u >= debut3) { k3 = Math.min(ch.length, Math.floor((u - debut3) / T_PAS)); dans = (u - debut3) - k3 * T_PAS; }
      const faits = Math.max(0, Math.min(ch.length, k3));
      let prec = pos;
      for (let k = 0; k < faits; k++) {
        const p = centre(g, e, ch[k]), q = centre(g, e, prec);
        empreinte(c, p[0], p[1], s, COUL[0], 0.8, Math.atan2(p[1] - q[1], p[0] - q[0]) + Math.PI / 2);
        prec = ch[k];
      }
      const cur = faits === 0 ? pos : ch[faits - 1];
      const pc = centre(g, e, cur);
      jeton(c, 0, pc[0], pc[1], s * 0.34, TENUES[prog.tenue]);
      if (k3 >= 0 && k3 < ch.length) {
        const p = centre(g, e, ch[k3]);
        const q = Math.min(1, dans / (T_PAS * 0.6));
        main(c, 520 + (p[0] - 520) * q, 340 + (p[1] + 12 - 340) * q, 1.4, q >= 1 ? 1 : 0);
      }
      // Faux pas (tutoriel de base) : le Coureur pâle jaillit
      if (d.faux && k3 >= ch.length) {
        const u2 = u - (debut3 + ch.length * T_PAS);
        const k = Math.min(1, u2 / 500), x = 60, y = 360 - 130 * k;
        lueur(c, x, y - 40, 120, 'rgba(230,240,245,0.5)', k);
        silhouette(c, x, y + 60, 150, null, t / 90, { pale: true, alpha: 0.8 * k });
      }
      // Coureur pâle affamé : les foulées passent de 3 à 2
      if (d.affame) {
        const n = u < T_FIN / 2 ? 3 : 2;
        for (let k = 0; k < 3; k++) { c.globalAlpha = k < n ? 1 : 0.2; empreinte(c, 470 + k * 26, 330, 70, '#ffa940', 1, 0); }
        c.globalAlpha = 1;
        const x = 420 - (n === 2 ? 40 : 0);
        silhouette(c, x - 80, 352, 90, null, t / 90, { pale: true, alpha: 0.7 });
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  const plateau = $('plateau');
  function caseSous(ev) {
    if (!geo || !vue) return -1;
    const r = plateau.getBoundingClientRect();
    const x = ev.clientX - r.left - geo.ox, y = ev.clientY - r.top - geo.oy;
    const cx = Math.floor(x / geo.s), cy = Math.floor(y / geo.s);
    if (cx < 0 || cy < 0 || cx >= vue.W || cy >= vue.H) return -1;
    return cy * vue.W + cx;
  }
  plateau.addEventListener('pointerdown', (ev) => { audio(); ev.preventDefault(); pas(caseSous(ev)); });

  const FLECHES = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, KeyW: 0, KeyD: 1, KeyS: 2, KeyA: 3 };
  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    if (monTourVue() && vue.ph === 'choix') {
      if (ev.code === 'ArrowLeft') { ev.preventDefault(); choisir(false); }
      else if (ev.code === 'ArrowRight') { ev.preventDefault(); choisir(true); }
      return;
    }
    if (FLECHES[ev.code] !== undefined) {
      ev.preventDefault();
      if (!vue) return;
      pas(O.voisinDir(vue, O.courante(vue), FLECHES[ev.code]));
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, N, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-vestiaire').addEventListener('click', () => { audio(); sons.clic(); ouvrirVestiaire(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('vest-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-normal').addEventListener('click', () => choisir(false));
  $('btn-sprint').addEventListener('click', () => choisir(true));
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une nuit solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.av[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
