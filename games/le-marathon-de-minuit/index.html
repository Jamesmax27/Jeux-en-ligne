<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');

    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');

      menu.append(li);
      return b;

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)

      if (isole && !coin && hote) {

      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];

      if (menu.hidden) return;

      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');

    });
    bouton.addEventListener('keydown', function (e) {

    document.addEventListener('pointerdown', function (e) {

      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };

      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {

        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);

      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });

        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {

    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {

  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);

  }

  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');

    ombre.appendChild(feuille);

    b.textContent = contenu;

  }

  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }

      b.classList.remove('armer');
      clear(jeu);
      fait();

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)

    var fond = document.createElement('div');

    var carte = document.createElement('div');

    carte.setAttribute('aria-modal', 'true');

    h.ombre.appendChild(fond);

      fermer: function () {

      },
    };

    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;

    if (this.phase === 'jeu' && this.echeance && t >= this.echeance.quand) {
      var s = this.echeance.siege;
      this.echeance = null;
      if (this.r.aQui(this.etat) === s && this.jouerRobot(s, true)) this.avancer(this.r.delaiBot);
    }
  };

  // --- Partie, côté jeu -----------------------------------------------------
  // o : {
  //   regles        window.JEL_REGLES
  //   surEvenement  function (e) : { type: 'mode', mode, raison } ('connexion', 'en-ligne', 'solo') ;
  //                 { type: 'debut', reste } (arrivée dans une partie : etat, siege, sieges,
  //                 phase : 'salon' le plus souvent) ;
  //                 { type: 'salon', reste } (salon d'attente, en ligne : avant la 1re manche et
  //                 après chacune ; le chef peut lancer, sinon lancement seul dans reste ms) ;
  //                 { type: 'manche' } (nouvelle manche, etat de départ) ;
  //                 { type: 'action', siege, action, avant, apres, auto, moi } ;
  //                 { type: 'fin', resultat } (fin(etat) des règles) ;
  //                 { type: 'sieges' } (un vrai joueur arrive ou part, ou le chef change) ; { type: 'refus' }
  //   enLigne       false : directement contre des robots sur l'appareil (sinon : en ligne
  //                 si le lanceur du site le permet, robots locaux à défaut)
  //   force         force des robots locaux (0 à 1)
  //   options       options des manches locales (ex. { niveau: 3 })
  //   enchainer     false : pas de nouvelle manche automatique en solo (jeu à niveaux)
  // }
  // Lecture : partie.mode, partie.etat, partie.siege (place du joueur, -1 en attente),
  // partie.phase ('attente', 'salon', 'jeu', 'pause'), partie.sieges() ([{ humain, moi, chef, nom }] ;
  // nom : pseudo d'un vrai joueur en ligne, ou null — robot, ou joueur sans profil : libellé du jeu),
  // partie.chef (place du chef), partie.estChef(), partie.monTour(). Commandes : lancer(),
  // lancerManche() (le chef, dans le salon), jouer(action), pause(oui), recommencer(options)
  // (solo), quitter(). La dernière partie lancée est aussi dans JEL_MULTI.derniere.

  function dansLanceur() {

  }

  function invitation() {
    if (invitationUtilisee) return null;
    var i = racine.JEL_REJOINDRE;
    return i && typeof i.partie === 'string' && RE_PARTIE.test(i.partie) ? { partie: i.partie } : null;

  function Partie(o) {
    this.o = o || {};
    this.r = completer(this.o.regles);
    this.mode = 'arret';
    this.etat = null;
    this.n = 0;
    this.manche = 0;
    this.phase = 'attente';
    this.siege = -1;
    this.humains = [];
    this.noms = [];            // pseudo des vrais joueurs par place (en ligne), ou null
    this.chef = -1;            // place du chef du salon (en ligne)
    this.options = null;
    this.file = [];            // messages reçus, joués un par un
    this.libreA = 0;           // heure à partir de laquelle le message suivant peut être joué
    this.rattrapage = false;   // coups accumulés pendant une pause en ligne : rejoués vite
    this.minuteur = 0;
    this.enPause = false;
    this.debutPause = 0;
    this.attendEcho = false;   // action envoyée, pas encore revenue
    this.versSolo = false;     // connexion coupée : bascule en solo une fois la file vidée
    this.local = null;         // arbitre local (solo)

  Partie.prototype.signaler = function (e) {

  };

  Partie.prototype.changerMode = function (mode, raison) {

  };

  Partie.prototype.lancer = function () {

      this.changerMode('connexion');
      racine.addEventListener('message', this.ecoute);
      var demande = { type: 'jel-multi', op: 'rejoindre', proto: PROTOCOLE };
      var inv = invitation();
      if (inv) { demande.partie = inv.partie; invitationUtilisee = true; }   // partie d'un ami (« Rejoindre »)
      try { racine.parent.postMessage(demande, '*'); } catch (e) { /* pas de lanceur */ }

      this.minuteurConnexion = setTimeout(function () { moi.passerSolo('delai'); }, DELAI_CONNEXION);

    }

  // Arrête tout (connexion, robots locaux, file) sans rien annoncer.
  Partie.prototype.arreter = function () {
    clearTimeout(this.minuteur);
    clearTimeout(this.minuteurReveil);
    clearTimeout(this.minuteurConnexion);
    racine.removeEventListener('message', this.ecoute);
    if (this.mode === 'connexion' || this.mode === 'en-ligne') {

  Partie.prototype.recevoirLanceur = function (e) {

  Partie.prototype.creerArbitreLocal = function () {

      envoyer: function (cle, m) { moi.file.push(m); moi.pomper(); },
      enchainer: this.o.enchainer !== false,
      delaiJoueur: Infinity,               // le joueur de l'appareil prend son temps

    });

  Partie.prototype.programmerReveil = function () {

    if (t === null || !isFinite(t)) return;
    var moi = this;
    this.minuteurReveil = setTimeout(function () {
      if (!moi.local || moi.enPause) return;
      moi.local.reveil();
      moi.programmerReveil();

  // Joue les messages reçus un par un : les coups des autres sont espacés de
  // delaiBot, pour qu'on les voie.
  Partie.prototype.pomper = function () {

        return;
      }

    }

  // Joue un message ; renvoie le temps à laisser avant le suivant (ms).
  Partie.prototype.traiter = function (m) {

        this.humains = m.sieges || [];
        this.chef = typeof m.chef === 'number' ? m.chef : -1;
        this.n = m.n;
        this.manche = m.manche;
        this.options = m.o || null;
        this.etat = m.etat;
        this.phase = m.phase;
        this.attendEcho = false;
        this.signaler({ type: 'debut', reste: m.reste || 0 });
        return 0;
      case 'manche':
        this.etat = r.depart(hasard(m.g), r.places, copie(m.o));
        this.n = m.n;
        this.manche = m.manche;

        this.attendEcho = false;

        try { apres = r.jouer(copie(avant), m.s, copie(m.a), hasard(m.g)); } catch (e) { this.resynchroniser(); return 0; }
        this.etat = apres;
        this.n = m.n;
        var moi = m.s === this.siege;
        if (moi) this.attendEcho = false;
        this.signaler({ type: 'action', siege: m.s, action: m.a, avant: avant, apres: apres, auto: !!m.auto, moi: moi });
        var resultat = r.fin(apres);
        if (resultat) {
          this.phase = 'pause';
          this.signaler({ type: 'fin', resultat: resultat });
        }
        return moi && !m.auto ? DELAI_MOI : r.delaiBot;
      }
      case 'sieges':
        this.humains = m.sieges || [];
        if (typeof m.chef === 'number') this.chef = m.chef;
        this.signaler({ type: 'sieges' });
        return 0;
      case 'salon':
        this.phase = 'salon';
        if (typeof m.chef === 'number') this.chef = m.chef;
        this.attendEcho = false;
        this.signaler({ type: 'salon', reste: m.reste || 0 });
        return 0;
      case 'place':
        this.siege = m.siege;
        this.signaler({ type: 'sieges' });
        return 0;
      case 'noms':
        this.noms = [];
        for (var k = 0; k < r.places; k++) {
          var x = Array.isArray(m.noms) ? m.noms[k] : null;

        return 0;
      case 'refus':
        this.attendEcho = false;
        this.signaler({ type: 'refus' });
        return 0;
      default:
        return 0;
    }
  };

  // Messages perdus ou incohérents : en ligne, on redemande l'état au serveur.
  Partie.prototype.resynchroniser = function () {
    this.file = [];
    if (this.mode === 'en-ligne') {
      try { racine.parent.postMessage({ type: 'jel-multi', op: 'envoyer', m: { t: 'resync' } }, '*'); } catch (e) { /* pas de lanceur */ }
    }
  };

  Partie.prototype.sieges = function () {
    var liste = [];
    for (var s = 0; s < this.r.places; s++) {
      var humain = this.humains[s] === true;
      var nom = this.mode === 'en-ligne' && humain && typeof this.noms[s] === 'string' ? this.noms[s] : null;
      liste.push({ humain: humain, moi: s === this.siege, chef: this.mode === 'en-ligne' && s === this.chef, nom: nom });
    }

  };

  // Pseudo du vrai joueur de la place s (en ligne), ou null.
  Partie.prototype.nom = function (s) {
    var info = this.sieges()[s];

  };

  // Le joueur de l'appareil peut-il lancer la manche ? (en ligne, dans le salon, s'il est le chef)
  Partie.prototype.estChef = function () {
    return this.mode === 'en-ligne' && this.phase === 'salon' && this.siege >= 0 && this.siege === this.chef;
  };

  // Le chef lance la manche depuis le salon. Renvoie true si la demande part.
  Partie.prototype.lancerManche = function () {
    if (!this.estChef() || this.file.length) return false;
    try { racine.parent.postMessage({ type: 'jel-multi', op: 'envoyer', m: { t: 'lancer' } }, '*'); } catch (e) { return false; }
    return true;
  };

  Partie.prototype.monTour = function () {
    if (this.phase !== 'jeu' || !this.etat || this.siege < 0 || this.attendEcho || this.file.length) return false;
    if (this.mode !== 'solo' && this.mode !== 'en-ligne') return false;
    try { return this.r.aQui(this.etat) === this.siege; } catch (e) { return false; }
  };

  // Action du joueur de l'appareil. Renvoie true si elle part (elle sera jouée
  // à son retour, comme celles des autres).
  Partie.prototype.jouer = function (action) {
    if (!this.monTour()) return false;
    try { if (this.r.valide(copie(this.etat), this.siege, copie(action)) !== true) return false; } catch (e) { return false; }
    this.attendEcho = true;
    var m = { t: 'action', n: this.n, a: copie(action) };
    if (this.mode === 'solo') {
      this.local.recevoir('moi', m);
      this.programmerReveil();
    } else {
      try { racine.parent.postMessage({ type: 'jel-multi', op: 'envoyer', m: m }, '*'); } catch (e) { this.attendEcho = false; return false; }
    }
    return true;
  };

  // Pause (menu, écran caché) : la file et les robots locaux s'arrêtent. En
  // ligne, la partie continue sur le serveur : les coups attendent la reprise.
  Partie.prototype.pause = function (oui) {
    if (oui === this.enPause) return;
    this.enPause = oui;
    if (oui) {
      this.debutPause = Date.now();

      clearTimeout(this.minuteurReveil);

      if (this.local.finManche) this.local.finManche += duree;
      if (this.local.echeance) this.local.echeance.quand += duree;
    }
    if (this.mode === 'en-ligne') { this.libreA = 0; this.rattrapage = true; }   // rattraper vite les coups joués pendant la pause
    this.pomper();
    this.programmerReveil();
  };

  // Solo : nouvelle manche tout de suite (niveau suivant, rejouer…).
  Partie.prototype.recommencer = function (options) {
    if (this.mode !== 'solo' || !this.local) return false;
    if (options) { this.o.options = options; this.local.reglages.options = options; }
    this.file = [];
    this.libreA = 0;
    this.local.nouvelleManche();
    this.programmerReveil();
    return true;
  };

  racine.JEL_MULTI = {
    PROTOCOLE: PROTOCOLE,
    hasard: hasard,
    copie: copie,
    completer: completer,
    problemesRegles: problemesRegles,
    Arbitre: Arbitre,
    Partie: Partie,
    creer: function (o) { return new Partie(o); },

<script id="jel-regles">
/* Règles du « Marathon de Minuit » : fonctions pures (docs/multijoueur.md).
   Les mêmes règles tournent sur le serveur et sur chaque appareil.
   Une ville en grille (W × H pavés). Chacun son tour, un coureur doit refaire
   de mémoire le chemin (cases voisines, sans retour) qui mène de la borne
   actuelle (cur) au prochain poste. Chaque case touchée qui n'est pas la bonne
   est un faux pas : le Coureur pâle gagne une foulée sur lui (av - 1). À 0, il
   est rattrapé : éliminé. Le dernier debout gagne ; sinon, après R tours de
   piste, les survivants sont classés par avance puis par faux pas.
   Action : { s: 0 | 1 (sprint : deux postes d'un coup), p: [cases touchées] }.
   État (JSON) : n (nuit), W, H, R (tours de piste), ronde, m (réglages de la
   nuit), av (avance de chaque place), el (ordre d'élimination, -1 = en course),
   err (faux pas), nets (chemins sans faute), jo (a déjà couru ce tour),
   ne (nombre d'éliminés), coups, cur (borne de départ), tour, der (dernier
   coup), seg (chemin du coureur dont c'est le tour : a, b, f, bz, rv, mi, mc, de),
   fr (force des robots, solo seulement). */
(function () {
  'use strict';

  var AV_MAX = 6;

  // Les 20 nuits. g : [colonnes, lignes] ; r : postes (tours de piste) ;
  // l : longueur du premier chemin (+1 case par tour), lm : longueur maximale ;
  // av : avance de départ ; po : poste d'arrivée visible après l'extinction ;
  // f : faux balisages (embranchements au plus) ; b : cases cachées par la brume ;
  // rv : chance d'un ravitaillement ; sp : sprint permis ; mi : chance de mimique ;
  // de : chance de désordre ; fr : force des robots ; v : ms par lanterne ;
  // t : ms où tout reste allumé ; tuto : démonstration à la première rencontre.
  function nuit(o) {

    Object.keys(o).forEach(function (k) { d[k] = o[k]; });

  }
  var NUITS = [
    nuit({ g: [5, 6], r: 3, l: 3, lm: 6, av: 4, po: 1, fr: 0.12, v: 430, t: 1500, tuto: 'base' }),
    nuit({ g: [5, 6], r: 4, l: 3, lm: 6, av: 4, po: 1, fr: 0.18, v: 410, t: 1400 }),
    nuit({ g: [5, 6], r: 4, l: 3, lm: 7, av: 4, po: 1, f: 1, fr: 0.24, v: 400, t: 1300, tuto: 'faux' }),
    nuit({ g: [5, 6], r: 4, l: 4, lm: 7, av: 3, f: 1, fr: 0.28, v: 390, t: 1250, tuto: 'poste' }),
    nuit({ r: 4, l: 4, lm: 7, b: 1, fr: 0.3, v: 380, t: 1200, tuto: 'brume' }),
    nuit({ l: 4, lm: 8, f: 2, b: 1, fr: 0.34, v: 370, t: 1150 }),
    nuit({ l: 4, lm: 8, rv: 0.6, fr: 0.38, v: 360, t: 1100, tuto: 'ravito' }),
    nuit({ l: 4, lm: 8, f: 2, b: 1, rv: 0.4, fr: 0.42, v: 350, t: 1050 }),
    nuit({ l: 4, lm: 8, sp: 1, fr: 0.45, v: 340, t: 1000, tuto: 'sprint' }),
    nuit({ l: 4, lm: 8, f: 2, rv: 0.4, sp: 1, fr: 0.48, v: 330, t: 980 }),
    nuit({ l: 5, lm: 9, f: 2, b: 2, rv: 0.4, sp: 1, fr: 0.52, v: 320, t: 950 }),
    nuit({ l: 4, lm: 8, mi: 0.6, fr: 0.55, v: 310, t: 930, tuto: 'mimique' }),
    nuit({ l: 4, lm: 8, f: 2, mi: 0.6, fr: 0.58, v: 300, t: 900 }),
    nuit({ l: 5, lm: 9, b: 2, rv: 0.4, sp: 1, mi: 0.5, fr: 0.6, v: 290, t: 880 }),
    nuit({ l: 4, lm: 8, de: 0.7, fr: 0.62, v: 285, t: 860, tuto: 'desordre' }),
    nuit({ l: 4, lm: 9, f: 2, b: 2, de: 0.6, fr: 0.66, v: 275, t: 830 }),
    nuit({ l: 5, lm: 9, rv: 0.4, sp: 1, de: 0.6, fr: 0.7, v: 265, t: 800 }),
    nuit({ l: 5, lm: 9, f: 2, b: 2, rv: 0.3, sp: 1, mi: 0.4, de: 0.4, fr: 0.75, v: 255, t: 780 }),
    nuit({ r: 6, l: 5, lm: 9, f: 3, b: 2, rv: 0.3, sp: 1, mi: 0.4, de: 0.4, fr: 0.8, v: 240, t: 740 }),
    nuit({ r: 6, l: 6, lm: 9, f: 3, b: 2, rv: 0.3, sp: 1, mi: 0.45, de: 0.45, fr: 0.85, v: 230, t: 700 })
  ];

  function voisins(e, i) {
    var W = e.W, H = e.H, r = Math.floor(i / W), c = i % W, l = [];
    if (r > 0) l.push(i - W);
    if (c < W - 1) l.push(i + 1);

  function auHasard(liste, alea) { return liste[Math.floor(alea() * liste.length) % liste.length]; }

  // Marche au hasard de n cases depuis la dernière case de base, sans repasser

  function chemin(e, base, n, interdit, alea) {

  // Chemin (et pièges) du coureur dont c'est le tour.
  function generer(e, alea) {
    var m = e.m, L = Math.min(m.lm, m.l + e.ronde - 1);
    var seg = { a: [], b: [], f: [], bz: [], rv: -1, mi: [], mc: -1, de: 0 };

    occupe[e.cur] = 1;
    seg.a.forEach(function (x) { occupe[x] = 1; });
    if (m.sp && seg.a.length) {
      seg.b = chemin(e, [e.cur].concat(seg.a), Math.max(3, L - 1), {}, alea);
      seg.b.forEach(function (x) { occupe[x] = 1; });
    }
    if (m.rv && seg.a.length >= 3 && alea() < m.rv) seg.rv = seg.a[1 + Math.floor(alea() * (seg.a.length - 2)) % (seg.a.length - 2)];

      if (mi.length >= Math.min(3, seg.a.length)) {
        seg.mi = mi;
        mi.forEach(function (x) { occupe[x] = 1; });

        for (i = 0; i < e.av.length; i++) if (i !== e.tour) autres.push(i);
        seg.mc = auHasard(autres, alea);

      for (var q = 0; q < nf; q++) {

        if (!libres.length) continue;

        if (alea() < 0.5) {
          var suite = voisins(e, x1).filter(function (v) { return !occupe[v]; });
          if (suite.length) { var x2 = auHasard(suite, alea); seg.f.push(x2); occupe[x2] = 1; }

      for (i = 1; i < suiteCases.length - 1; i++) {
        if (i === fin || suiteCases[i] === seg.rv) continue;
        if (suiteCases[i + 1] - suiteCases[i] === suiteCases[i] - suiteCases[i - 1]) cand.push(i);
      }

  }

  function cible(e, s) { return s ? e.seg.a.concat(e.seg.b) : e.seg.a; }

  // Rejoue les touchers d'une action ; null si elle n'est pas permise.
  function simuler(e, place, act) {

    places: 5,
    delaiBot: 1400,
    delaiJoueur: 45000,
    pauseManche: 7000,
    attenteSalon: 90000,
    remplacement: 'tour',
    forceEnLigne: 0.55,

    depart: function (alea, places, options) {
      var o = options || {}, solo = typeof o.niveau === 'number' && isFinite(o.niveau), idx;
      if (solo) idx = Math.max(0, Math.min(NUITS.length - 1, Math.floor(o.niveau) - 1));
      else idx = 5 + Math.floor(alea() * (NUITS.length - 5)) % (NUITS.length - 5);

      // En ligne : pièges d'une nuit tirée au hasard, mais course plus longue
      // (8 postes) qui commence doucement (chemin de 3 cases, 4 foulées d'avance).
      if (!solo) { m.av = 4; m.l = 3; m.lm = Math.min(m.lm, 7); m.r = 7; }
      var e = {
        n: idx, W: m.g[0], H: m.g[1], R: m.r, ronde: 1, m: m,
        av: [], el: [], err: [], nets: [], jo: [], ne: 0, coups: 0, cur: 0, tour: 0, der: null, seg: null, fini: 0

      for (var s = 0; s < places; s++) { e.av.push(m.av); e.el.push(-1); e.err.push(0); e.nets.push(0); e.jo.push(0); }
      if (solo) e.fr = m.fr;
      // borne de départ : loin des bords si possible

      var c = 1 + Math.floor(alea() * Math.max(1, e.W - 2)) % Math.max(1, e.W - 2);
      e.cur = r * e.W + c;
      // En solo, le joueur (place 0) part le premier. En ligne, le départ est
      // donné à la place 2 : les premiers arrivés (places 0 et 1) courent en

    valide: function (e, place, act) {

      }

    },

    fin: function (e) {

    },

    // Outils partagés avec l'écran du jeu (mêmes données de nuit).
    outils: {

      classement: classement, forceNiveau: forceNiveau, vivants: vivants
    }
  };
})();

  // Coureur vu de profil, pieds en (x, y), hauteur ~ 100 * k. ph : phase de la foulée.
  // tenue : 0 survêtement, 1 capuche, 2 rayures, 3 cape, 4 os phosphorescents, 5 linceul.
  function coureur(c, x, y, k, coul, coulF, tenue, ph, opts) {

    const a = Math.sin(ph) * 0.9, b = Math.sin(ph + Math.PI) * 0.9;
    c.lineCap = 'round'; c.lineJoin = 'round';

    c.strokeStyle = coulF; c.lineWidth = 7;
    trait(c, [0, -72, -Math.sin(a) * 16, -58, -Math.sin(a) * 16 + 8, -48]);
    // corps
    c.fillStyle = coul;
    rr(c, -10, -80, 20, 38, 9); c.fill();
    if (tenue === 2) { c.fillStyle = 'rgba(255,255,255,.75)'; c.fillRect(-10, -70, 20, 4); c.fillRect(-10, -60, 20, 4); c.fillRect(-10, -50, 20, 4); }
    if (tenue === 4) {
      c.strokeStyle = '#e9ffd2'; c.lineWidth = 2.2; c.shadowColor = '#c8ff9a'; c.shadowBlur = 8;
      trait(c, [0, -78, 0, -46]); for (let i = 0; i < 4; i++) { trait(c, [-8, -72 + i * 7, 8, -72 + i * 7]); }

    c.fillStyle = coulF; rond(c, 0, -65, 2.2); c.fill();

    c.strokeStyle = coul; c.lineWidth = 7;
    trait(c, [0, -72, Math.sin(a) * 18, -58, Math.sin(a) * 18 + 10, -66]);

    c.fillStyle = tenue === 5 ? '#dfe6ff' : '#f1c9a5'; rond(c, 4, -92, 11); c.fill();

  // Dossard maudit n° i (sans chiffre : un symbole), centré en (x, y), largeur w.
  function dossard(c, x, y, w, i, possede, coul) {

  function dessinerTitre(t) {

      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  // Le rôle d'une place : toi, un vrai joueur ou un robot.
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché : le pseudo d'un vrai joueur en ligne (partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  // Nom d'un coureur dans les phrases : pseudo d'un vrai joueur, sinon sa couleur.
  function nomCoureur(s) {
    const info = siegesActuels()[s] || {};
    if (info.moi) return tr('place.toi');
    return info.humain && info.nom ? info.nom : tr('coul.' + s);
  }
  function remplirTag(tag, role, nom) {
    if (tag.dataset.role === role && tag.dataset.nom === nom) return;
    tag.dataset.role = role;
    tag.dataset.nom = nom;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = nom;
    tag.appendChild(txt);
  }

  // En solo, le joueur est toujours à la place 0 (même avant le départ ou après la fin).
  function siegesActuels() {
    if (!partie) {
      if (session !== 'solo') return [];
      const l = [];
      for (let s = 0; s < PLACES; s++) l.push({ humain: s === 0, moi: s === 0, chef: false, nom: null });
      return l;
    }
    try { return partie.sieges(); } catch (e) { return []; }
  }
  const moiSiege = () => (partie ? partie.siege : (session === 'solo' ? 0 : -1));

  let derniereMajPlaces = 0;
  function majPlaces(force) {
    const t = maintenant();
    if (!force && t - derniereMajPlaces < 120) return;
    derniereMajPlaces = t;
    const e = vue, sieges = siegesActuels();
    const tour = spec ? spec.siege : (e && partie && partie.phase === 'jeu' ? R.aQui(e) : -1);
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const av = e ? Math.round(avanceAffichee(s)) : 0;
      const out = !!(e && e.el[s] >= 0);
      const pts = d.querySelector('.pts');
      const texte = String(av);
      if (pts.dataset.v !== texte) { pts.dataset.v = texte; pts.innerHTML = ICONE_FOULEE; const sp2 = document.createElement('span'); sp2.textContent = nb(av); pts.appendChild(sp2); }
      d.classList.toggle('actif', s === tour && !out);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('out', out);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      const aria = tr('place.aria.' + role, { coul: tr('coul.' + s), n: av }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (out ? ' · ' + tr('place.elimine') : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : '');
      if (d.getAttribute('aria-label') !== aria) d.setAttribute('aria-label', aria);
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    if (spec && spec.mine) {
      if (spec.phase === 'choix') return tr('tour.choix');
      if (spec.phase === 'revele') return tr(spec.de ? 'tour.regardeDesordre' : (e.seg.mi.length ? 'tour.regardeMimique' : 'tour.regarde'));
      if (spec.phase === 'trace') return tr('tour.trace');
      return '';
    }
    if (spec) return tr('tour.autre', { nom: nomCoureur(spec.siege) });
    const moi = moiSiege();
    if (moi < 0) return tr('multi.attente');
    if (e.el[moi] >= 0) return tr('jeu.spectateur');
    const s = R.aQui(e);
    if (s === moi) return tr('tour.pret');
    return tr('tour.attente', { nom: nomCoureur(s) });
  }

  function majInfos() {
    let info = '';
    const e = vue;
    const poste = e ? tr('jeu.poste', { n: Math.min(e.ronde, e.R), total: e.R }) : '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length }) + (poste ? ' · ' + poste : '');
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche }) + (poste ? ' · ' + poste : '');
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  function majInterface(force) {
    majPlaces(force);
    majInfos();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    let visible = false;
    const e = partie && partie.etat;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !R.fin(e)) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Tours : lanternes, pas, faux pas
  // ---------------------------------------------------------------------

  // Spectacle d'un tour : e = état AVANT le tour (chemin, borne de départ).
  // D : durée totale de l'animation du tour d'un autre coureur (ms).
  function nouveauSpec(e, siege, s, mine, D) {
    const cibleT = O.cible(e, s), n = cibleT.length, m = e.m, de = !!e.seg.de;
    D = D || 1000;
    const v = mine ? m.v : 0.25 * D / Math.max(1, n);
    const hold = mine ? m.t : 0.1 * D;
    const rev = de ? (mine ? 250 + hold + n * m.v * 0.55 : 0.35 * D) : n * v + hold;
    return {
      e: e, siege: siege, s: s ? 1 : 0, cible: cibleT, t0: undefined, v: v, rev: rev, de: de, pas: [], pos: e.cur, depart: e.cur,
      k: 0, av: e.av[siege], er: 0, net: true, hint: null, mine: mine, phase: 'revele', sonne: 0, pris: false,
      tenue: siege === moiSiege() ? prog.tenue : 0
    };
  }

  // Un pas (case touchée) dans un tour : mêmes calculs que simuler() des règles.
  function appliquerPas(sp, x) {
    const t = maintenant(), seg = sp.e.seg;
    if (x === sp.cible[sp.k]) {
      let rv = false;
      if (x === seg.rv && sp.net) { sp.av = Math.min(AV_MAX, sp.av + 1); rv = true; }
      sp.pas.push({ x: x, ok: true, t: t, rv: rv });
      sp.pos = x; sp.k++; sp.net = true;
      if (rv) { sons.ravito(); if (sp.mine) toast(tr('jeu.ravito'), 1500); } else if (sp.mine || sp.k % 2) sons.pas(sp.k);
    } else {
      sp.pas.push({ x: x, ok: false, t: t });
      sp.er++; sp.av--; sp.net = false;
      sp.hint = { x: sp.cible[sp.k], t: t };
      elanPale = 1;
      sons.faux();
      const carte = $('place-' + sp.siege);
      carte.classList.remove('choc'); void carte.offsetWidth; carte.classList.add('choc');
      if (sp.mine) { const z = $('zone'); z.classList.remove('secousse'); void z.offsetWidth; z.classList.add('secousse'); }
      if (sp.av <= 0) sp.pris = true;
    }
  }

  // Mon tour commence : choix du sprint (si permis), puis allumage.
  function commencerMonTour() {
    const e = JSON.parse(JSON.stringify(partie.etat));
    vue = e;
    debutTour = Date.now();
    const sp = nouveauSpec(e, partie.siege, 0, true);
    sp.coup = e.coups;
    spec = sp;
    if (e.m.sp && e.seg.b.length) {
      sp.phase = 'choix';
      $('choix').classList.add('actif');
      sons.aToi();
      try { $('btn-courir').focus({ preventScroll: true }); } catch (er) { /* rien */ }
    } else lancerRevelation(0);
    majInterface(true);
  }

  function lancerRevelation(s) {
    if (!spec || !spec.mine || (spec.phase !== 'choix' && spec.phase !== 'revele')) return;
    $('choix').classList.remove('actif');
    const ancien = spec;
    spec = nouveauSpec(ancien.e, ancien.siege, s, true);
    spec.coup = ancien.coup;
    spec.t0 = maintenant() + 350;
    if (s) sons.sprint(); else if (ancien.phase !== 'choix') sons.aToi();
    majInterface(true);
  }

  // Le joueur touche une case pendant son tour.
  function toucher(x) {
    const sp = spec;
    if (!sp || !sp.mine || sp.phase !== 'trace' || x < 0 || enPause) return;
    if (x === sp.pos || sp.pas.some((p) => p.ok && p.x === x)) return;   // case déjà faite : ignorée
    sp.taps.push(x);
    appliquerPas(sp, x);
    if (sp.k >= sp.cible.length || sp.av <= 0) terminerMonTour();
  }

  function terminerMonTour() {
    const sp = spec;
    sp.phase = 'fini';
    if (sp.av > 0 && sp.k >= sp.cible.length) {
      if (sp.s) { const bonus = sp.er === 0 ? 2 : 1; sp.av = Math.min(AV_MAX, sp.av + bonus); toast(tr('jeu.sprintReussi', { n: bonus }), 1800); }
      sons.poste();
      if (sp.er === 0) jaillir(sp.pos, sp.siege);
    } else sons.elimine();
    const ok = partie && partie.jouer({ s: sp.s, p: sp.taps.slice() });
    if (!ok) { spec = null; }
    majInterface(true);
  }

  // Étincelles autour d'une case (poste atteint sans faute).
  const particules = [];
  function jaillir(i, qui) {
    if (!vue || !geo) return;
    const p = centre(vue, geo, i);
    for (let k = 0; k < 16; k++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 170;
      particules.push({ x: p[0], y: p[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v - 150, vie: 0.7 + Math.random() * 0.4, k: geo.s * (0.06 + Math.random() * 0.06), coul: k % 2 ? COUL[qui] : '#ffcf6e' });
    }
  }

  // Avance de la file d'animations, et début de mon tour quand tout est montré.
  function majSpectacle() {
    const t = maintenant();
    const sp = spec;
    if (sp && sp.t0 !== undefined && t >= sp.t0) {
      // tintement des lanternes qui s'allument
      const n = sp.cible.length;
      if (sp.mine) {
        const allumees = sp.de ? n : Math.min(n, Math.floor((t - sp.t0) / sp.v) + 1);
        while (sp.sonne < allumees) { if (sp.de) { sons.lanterne(0); sp.sonne = n; break; } sons.lanterne(sp.sonne); sp.sonne++; }
        if (sp.e.seg.f.length && !sp.follet && t > sp.t0 + sp.v) { sp.follet = true; sons.follet(); }
        if (sp.phase === 'revele' && t >= sp.t0 + sp.rev) { sp.phase = 'trace'; sp.taps = []; sons.aToi(); majInterface(true); }
      } else if (sp.phase === 'revele') {
        if (t >= sp.t0 + sp.rev + 0.05 * sp.duree) { sp.phase = 'trace'; sp.tTrace = t; }
      } else if (sp.phase === 'trace') {
        const pas = sp.action.p, dtPas = 0.5 * sp.duree / Math.max(1, pas.length);
        while (sp.idx < pas.length && t >= sp.tTrace + sp.idx * dtPas) { appliquerPas(sp, pas[sp.idx]); sp.idx++; }
        if (sp.idx >= pas.length) { sp.phase = 'fini'; sp.finA = t + 0.08 * sp.duree; if (sp.pris) sons.elimine(); }
      } else if (sp.phase === 'fini' && t >= sp.finA) {
        finirSpectacle();
      }
    }
    if (sp && sp.mine && sp.phase === 'fini' && sp.echo && t >= sp.finA) finirSpectacle();
    // événement suivant de la file
    if (!spec && fileAnim.length && !enPause) traiterFile();
    // mon tour
    if (!spec && !fileAnim.length && partie && !attenteTuto && !enPause && t >= animFin && partie.monTour() && vue && !$('voile-fin').classList.contains('actif')) commencerMonTour();
  }

  // Fin de l'animation d'un tour : l'état d'après devient l'état affiché.
  function finirSpectacle() {
    const sp = spec;
    spec = null;
    if (!sp) return;
    if (sp.apres) vue = sp.apres;
    animFin = maintenant() + 150;
    if (sp.mine) { majInterface(true); return; }   // mon tour : déjà traité à son retour (finirApresMoiEcho)
    const d = vue && vue.der;
    if (d && d.pris) {
      const moi = moiSiege();
      if (d.p === moi) {
        if (session === 'solo') { finSolo(false); return; }
        toast(tr('jeu.elimineToi'), 3200);
      } else toast(tr('jeu.elimine', { nom: nomCoureur(d.p) }), 2200);
    }
    majInterface(true);
  }

  function traiterFile() {
    const ev = fileAnim.shift();
    if (ev.type === 'fin') { surFin(); return; }
    // une action : montrer le tour de ce coureur
    if (ev.moi && !ev.auto) {
      // mon propre coup, déjà montré pendant que je jouais
      vue = ev.apres;
      spec = null;
      finirApresMoi();
      return;
    }
    // durée de l'animation : un peu moins que l'écart entre deux coups ; plus court
    // quand d'autres coups attendent (rattrapage, coureur éliminé qui regarde la fin)
    const D = fileAnim.length ? 450 : R.delaiBot - 120;
    const sp = nouveauSpec(ev.avant, ev.siege, ev.action.s, false, D);
    sp.action = ev.action; sp.apres = ev.apres; sp.idx = 0; sp.duree = D;
    sp.t0 = maintenant();
    if (ev.auto && ev.siege === moiSiege()) toast(tr('multi.autoToi'), 2600);
    else if (ev.auto) toast(tr('multi.auto', { nom: nomCoureur(ev.siege) }), 2000);
    spec = sp;
    majInterface(true);
  }

  function finirApresMoi() {
    animFin = maintenant() + 400;
    const d = vue && vue.der, moi = moiSiege();
    if (d && d.pris && d.p === moi) {
      if (session === 'solo') { setTimeout(() => { if (session === 'solo') finSolo(false); }, 700); return; }
      toast(tr('jeu.elimineToi'), 3200);
    }
    majInterface(true);
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    majSpectacle();
    dessinerJeu(maintenant(), dt);
    dessinerPiste(maintenant(), dt);
    majTemps();
    majCompte();
    majInterface();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    const e = spec ? spec.e : vue;
    if (!e) { geo = null; return; }
    geo = geometrie(e, w, h, Math.max(10, Math.min(w, h) * 0.04));
    dessinerPlateau(c, e, geo, { t: t, sp: spec, poste: e.m.po });
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul; rond(c, p.x, p.y, p.k); c.fill();
      c.globalAlpha = 1;
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action':
        debutTour = Date.now(); dernierTic = -1;
        // tour perdu (un robot a couru à ma place, temps écoulé) : mon tour s'arrête là
        if (spec && spec.mine && spec.phase !== 'fini') { spec = null; $('choix').classList.remove('actif'); }
        if (ev.moi && !ev.auto && spec && spec.mine) { spec.echo = true; spec.apres = ev.apres; spec.finA = maintenant() + 700; vue = ev.apres; finirApresMoiEcho(); break; }
        fileAnim.push(ev);
        break;
      case 'fin':
        if (partie.mode === 'en-ligne') finEnAttente = true;
        fileAnim.push({ type: 'fin', resultat: ev.resultat });
        break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface(true);
  }

  function finirApresMoiEcho() {
    const d = vue && vue.der, moi = moiSiege();
    animFin = maintenant() + 700;
    if (d && d.pris && d.p === moi) {
      if (session === 'solo') { const j = jeton; setTimeout(() => { if (j === jeton && session === 'solo') finSolo(false); }, 900); return; }
      toast(tr('jeu.elimineToi'), 3200);
    }
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
    // la course continue sur l'appareil : on repart de l'état du moteur
    if (raison === 'coupe' && partie.etat) {
      if (!(spec && spec.mine)) spec = null;
      fileAnim = [];
      vue = JSON.parse(JSON.stringify(partie.etat));
    }
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    spec = null; fileAnim = [];
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    spec = null; fileAnim = [];
    particules.length = 0;
    for (let s = 0; s < PLACES; s++) avAff[s] = vue.av[s];
    debutTour = Date.now();
    dernierTic = -1;
    animFin = maintenant() + 900;
    $('choix').classList.remove('actif');
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    sons.cloche();
    if (session === 'ligne') toast(tr('manche.nouvelle', { n: partie.manche }));
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    if (session === 'solo') {
      const moi = moiSiege() >= 0 ? moiSiege() : 0;
      if (vue && vue.el[moi] < 0) finSolo(true);
      return;
    }
    finManche = Date.now() + R.pauseManche;
    if (partie && partie.mode === 'en-ligne') afficherFinEnLigne();
    else afficherFinRobots();
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la course,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;           // heure du lancement automatique (ms)
  let resultatSalon = null;   // classement de la manche qui vient de finir
  let lancement = false;      // le chef a demandé le lancement

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;            // le résultat de la manche ouvrira le salon
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    $('choix').classList.remove('actif');
    const r = resultatSalon;

  function majSalon(tout) {

  let finFaite = -1;          // jeton de la dernière fin montrée (une seule fois par nuit)

  function bouton(cle, classe, action) {

  function etoilesPour(av, depart) { return av >= depart ? 3 : av >= 2 ? 2 : 1; }

  // Fin d'une nuit solo : gagne = pas rattrapé à la ligne d'arrivée (ou dernier debout).
  function finSolo(gagne) {
    if (finFaite === jeton) return;
    finFaite = jeton;
    const e = vue;
    if (!e) return;
    const moi = 0;
    enPartie = false;
    spec = null; fileAnim = [];
    $('choix').classList.remove('actif');
    const p = partie; partie = null;
    if (p) { try { p.quitter(); } catch (er) { /* rien */ } }
    const i = niveau - 1, av = e.av[moi];
    if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
    const ancienRecord = prog.records[i];
    let etoiles = 0, record = false, debloque = false, nouveauDossard = false;
    const totalAvant = totalEtoiles();
    if (gagne) {
      etoiles = etoilesPour(av, NIVEAUX[i].av);
      record = av > ancienRecord;
      if (record) prog.records[i] = av;
      nouveauDossard = etoiles === 3 && prog.etoiles[i] < 3;
      prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
      if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
      sauver(Math.min(niveau + 1, NIVEAUX.length), av);
      // Parcours terminé (toutes les nuits gagnées, maintenant ou avant) : total des meilleures étoiles.
      if (prog.etoiles.every((x) => x > 0)) {
        if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
      }
    }
    const vivantsFin = O.vivants(e);
    $('fin-titre').textContent = gagne ? tr(vivantsFin === 1 ? 'fin.dernierDebout' : 'fin.arrivee') : tr('fin.rattrape');
    const zone = $('fin-etoiles');
    zone.textContent = '';
    for (let k = 0; k < 3; k++) {
      const sp = document.createElement('span'); sp.textContent = '★';
      if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
      zone.appendChild(sp);
    }
    zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
    zone.style.display = '';
    $('fin-points').textContent = gagne ? tr('fin.avance', { n: av }) : tr('fin.poste', { n: Math.min(e.ronde, e.R), total: e.R });
    const blocDossard = $('fin-dossard');
    blocDossard.classList.toggle('actif', nouveauDossard);
    if (nouveauDossard) {
      const c = blocDossard.querySelector('canvas').getContext('2d');
      c.clearRect(0, 0, 108, 100);
      dossard(c, 54, 50, 92, i, true, COUL[0]);
      blocDossard.querySelector('span').textContent = tr('fin.dossard', { nom: tr('dossard.' + i) });
    }
    remplirClassement(e, moi, [{ moi: true }], $('fin-classement'));
    $('fin-record').textContent = gagne ? (record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, av) })) : (ancienRecord > 0 ? tr('fin.record', { n: ancienRecord }) : '');
    $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier', { n: totalEtoiles(), max: NIVEAUX.length * 3 }) : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
    $('fin-compte').textContent = '';
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
    boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
    boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    // tenue débloquée par les nouvelles étoiles
    const nouvelle = TENUES.findIndex((seuil) => seuil > totalAvant && seuil <= totalEtoiles());
    if (nouvelle > 0) setTimeout(() => toast(tr('fin.tenue', { nom: tr('tenue.' + nouvelle) }), 3600), 900);
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).

  // Compte à rebours avant la manche suivante (contre des robots, après une coupure).

  // Confettis de victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 6 === 5 ? '#ffcf6e' : COUL[i % 5], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  // Aperçu d'une nuit (pendant le tutoriel) : la ville sans coureur.
  function apercu(n) {
    const m = NIVEAUX[n - 1];
    const e = { n: n - 1, W: m.g[0], H: m.g[1], R: m.r, ronde: 1, m: m, av: [], el: [], err: [], nets: [], jo: [], ne: 0, coups: 0, cur: m.g[0] + 1, tour: 0, der: null, seg: { a: [], b: [], f: [], bz: [], rv: -1, mi: [], mc: -1, de: 0 } };
    for (let s = 0; s < PLACES; s++) { e.av.push(m.av); e.el.push(-1); e.err.push(0); }
    return e;
  }

  // Parcours solo : nuit n contre 4 robots (force croissante, donnée par la nuit).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = apercu(niveau);
    spec = null; fileAnim = [];
    particules.length = 0;
    for (let s = 0; s < PLACES; s++) avAff[s] = vue.av[s];
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface(true);
  }

    if (session !== 'solo') return;

      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement

    partie.lancer();
    majInterface(true);
  }

  function montrerTuto(cle, apres) {
