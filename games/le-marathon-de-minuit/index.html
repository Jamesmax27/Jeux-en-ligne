    };
    const g = geometrie(e, 560, 360, 30);
    const cibleT = d.s ? d.a.concat(d.b) : d.a;
    const PAS_MAIN = 560;
    let sp = null, debut = 0;
    const j = ++tutoAnim;
    const nouveau = (t) => {
      sp = { e: e, siege: 0, s: d.s ? 1 : 0, cible: cibleT, t0: t + 300, v: 360, rev: d.de ? 1500 : cibleT.length * 360 + 900, de: !!d.de, pas: [], pos: e.cur, depart: e.cur, k: 0, av: 3, net: true, hint: null, mine: true, phase: 'revele', tenue: prog.tenue };
      debut = t;
    };
    function image(t) {
      if (j !== tutoAnim) return;
      if (!sp) nouveau(t);
      const debutMain = sp.t0 + sp.rev + 500;
      const k = Math.floor((t - debutMain) / PAS_MAIN);
      if (t >= debutMain && k >= 0 && sp.k < cibleT.length && k >= sp.k) {
        const x = cibleT[sp.k];
        sp.pas.push({ x: x, ok: true, t: t, rv: x === e.seg.rv });
        sp.pos = x; sp.k++;
      }
      if (sp.k >= cibleT.length && t > debutMain + cibleT.length * PAS_MAIN + 1400) nouveau(t);
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 360);
      dessinerPlateau(c, e, g, { t: t, sp: sp, poste: e.m.po });
      // la main refait le chemin
      if (t >= debutMain - 300 && sp.k < cibleT.length) {
        const de = sp.k === 0 ? centre(e, g, e.cur) : centre(e, g, cibleT[sp.k - 1]);
        const vers = centre(e, g, cibleT[sp.k]);
        const q = Math.max(0, Math.min(1, ((t - debutMain) - (sp.k - 1) * PAS_MAIN) / (PAS_MAIN * 0.8)));
        const x = de[0] + (vers[0] - de[0]) * q, y = de[1] + (vers[1] - de[1]) * q;
        main(c, x, y + 6, 1.4, q > 0.85 ? (q - 0.85) / 0.15 : 0);
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt (toucher ou glisser), souris, clavier
  // ---------------------------------------------------------------------

  // Case sous le doigt ; strict : seulement le cœur de la case (en glissant).
  function caseSous(px, py, strict) {
    const e = spec ? spec.e : vue;
    if (!e || !geo) return -1;
    const fx = (px - geo.ox) / geo.s, fy = (py - geo.oy) / geo.s;
    const cx = Math.floor(fx), cy = Math.floor(fy);
    if (cx < 0 || cy < 0 || cx >= e.W || cy >= e.H) return -1;
    if (strict) { const dx = fx - cx - 0.5, dy = fy - cy - 0.5; if (Math.abs(dx) > 0.36 || Math.abs(dy) > 0.36) return -1; }
    return cy * e.W + cx;
  }

  function horsDeMonTour() {
    if (!partie || partie.phase !== 'jeu') return;
    if (spec && spec.mine) {
      if (spec.phase === 'revele' && Date.now() - dernierAttends > 1200) { dernierAttends = Date.now(); toast(tr('tour.patience'), 1200); }
      return;
    }
    if (Date.now() - dernierAttends > 1500) { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
  }

  const plateau = $('plateau');
  let glisse = null;
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  plateau.addEventListener('pointerdown', (ev) => {
    audio();
    if (!spec || !spec.mine || spec.phase !== 'trace') { horsDeMonTour(); return; }
    const p = point(ev), x = caseSous(p[0], p[1], false);
    glisse = { id: ev.pointerId, der: x };
    try { plateau.setPointerCapture(ev.pointerId); } catch (e) { /* rien */ }
    toucher(x);
  });
  plateau.addEventListener('pointermove', (ev) => {
    if (!glisse || ev.pointerId !== glisse.id) return;
    const p = point(ev), x = caseSous(p[0], p[1], true);
    if (x >= 0 && x !== glisse.der) { glisse.der = x; toucher(x); }
  });
  const lacher = () => { glisse = null; };
  plateau.addEventListener('pointerup', lacher);
  plateau.addEventListener('pointercancel', lacher);

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    if (spec && spec.mine && spec.phase === 'choix') {
      if (ev.code === 'Digit1' || ev.code === 'Numpad1' || ev.code === 'KeyC' || ev.code === 'ArrowLeft') { ev.preventDefault(); audio(); $('btn-courir').click(); }
      else if (ev.code === 'Digit2' || ev.code === 'Numpad2' || ev.code === 'KeyS' || ev.code === 'ArrowRight') { ev.preventDefault(); audio(); $('btn-sprinter').click(); }
      return;
    }
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], KeyA: [-1, 0], KeyD: [1, 0], KeyW: [0, -1], KeyS: [0, 1] };
    if (dirs[ev.code]) {
      ev.preventDefault(); audio();
      if (!spec || !spec.mine || spec.phase !== 'trace') { horsDeMonTour(); return; }
      const e = spec.e, c0 = spec.pos % e.W, r0 = Math.floor(spec.pos / e.W);
      const cx = c0 + dirs[ev.code][0], cy = r0 + dirs[ev.code][1];
      if (cx < 0 || cy < 0 || cx >= e.W || cy >= e.H) { sons.non(); return; }
      toucher(cy * e.W + cx);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-vestiaire').addEventListener('click', () => { audio(); sons.clic(); ouvrirVestiaire(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('vest-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-courir').addEventListener('click', () => { audio(); sons.clic(); lancerRevelation(0); });
  $('btn-sprinter').addEventListener('click', () => { audio(); lancerRevelation(1); });
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une nuit solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue ? vue.av[0] : 0);
  });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa course en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
