    c.beginPath(); c.moveTo(3, -82); c.quadraticCurveTo(-18, -70 + 8 * p, -26, -58 + 10 * p); c.stroke();
    c.fillStyle = '#f2f5fa'; ell(c, 6, -96, 8, 11, 0.15); c.fill();
    c.restore();
  }

  // Un coureur (écran titre, vestiaire) : tenue, masque, en pleine foulée.
  function coureur(c, x, y, h, tenue, km, t) {
    const T = TENUES[tenue] || TENUES[0], k = h / 100, p = Math.sin((t || 0) / 180);
    c.save(); c.translate(x, y); c.scale(k, k);
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.fillStyle = 'rgba(0,0,0,.35)'; ell(c, 0, 2, 26, 5); c.fill();
    if (T.lueur) { c.shadowColor = T.c; c.shadowBlur = 16; }
    if (T.cape) { c.fillStyle = T.c2; c.beginPath(); c.moveTo(-4, -78); c.quadraticCurveTo(-34, -60, -40 - 6 * p, -30); c.lineTo(-10, -44); c.closePath(); c.fill(); }
    c.strokeStyle = T.c2; c.lineWidth = 9;
    c.beginPath(); c.moveTo(0, -46); c.lineTo(-14 - 10 * p, -24); c.lineTo(-6 - 16 * p, 0); c.stroke();
    c.beginPath(); c.moveTo(0, -46); c.lineTo(14 + 8 * p, -24); c.lineTo(20 + 6 * p, -4); c.stroke();
    c.strokeStyle = T.c; c.lineWidth = 13;
    c.beginPath(); c.moveTo(0, -46); c.lineTo(4, -78); c.stroke();
    if (T.linceul) {
      c.fillStyle = T.c; c.beginPath(); c.moveTo(-8, -82); c.lineTo(12, -82); c.lineTo(14, -40); c.lineTo(8, -34); c.lineTo(2, -42); c.lineTo(-4, -34); c.lineTo(-10, -42); c.closePath(); c.fill();
    }
    c.lineWidth = 7; c.strokeStyle = T.c;
    c.beginPath(); c.moveTo(4, -74); c.lineTo(20 + 8 * p, -60); c.lineTo(30 + 6 * p, -70); c.stroke();
    c.beginPath(); c.moveTo(4, -74); c.lineTo(-12 - 8 * p, -60); c.lineTo(-20 - 6 * p, -48); c.stroke();
    c.shadowBlur = 0;
    // dossard (sans chiffre)
    c.fillStyle = '#f4efe2'; rr(c, -5, -70, 16, 13, 2); c.fill();
    c.fillStyle = '#8a1e2b'; rond(c, 3, -63.5, 3); c.fill();
    if (T.etoiles) { c.fillStyle = T.c2; [[-2, -50], [8, -58], [0, -76]].forEach((q) => { rond(c, q[0], q[1], 1.6); c.fill(); }); }
    masque(c, km, 7, -90, 13);
    c.restore();
  }

  // Sceau d'un dossard maudit (dessin abstrait, ni lettre ni chiffre).
  function dossardDessin(c, k, w, h, ouvert) {
    c.clearRect(0, 0, w, h);
    c.save();
    c.fillStyle = ouvert ? '#efe7d2' : '#2a3248'; rr(c, 4, 6, w - 8, h - 12, 6); c.fill();
    c.fillStyle = ouvert ? '#9a8f75' : '#1b2233';
    [[10, 12], [w - 10, 12], [10, h - 12], [w - 10, h - 12]].forEach((q) => { rond(c, q[0], q[1], 2.5); c.fill(); });
    if (!ouvert) { c.restore(); return; }
    const x = w / 2, y = h / 2, r = Math.min(w, h) * 0.26;
    c.strokeStyle = '#7d1220'; c.fillStyle = '#7d1220'; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath();
    if (k === 0) { ell(c, x, y, r, r * 0.55); c.stroke(); rond(c, x, y, r * 0.3); c.fill(); }                 // œil
    else if (k === 1) { for (let a = 0; a < 12; a += 0.2) { const rr2 = r * a / 12; c.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); } c.stroke(); } // spirale
    else if (k === 2) { c.arc(x, y, r, 0.6, Math.PI * 2 - 0.6); c.stroke(); }                                // lune
    else if (k === 3) { for (let i = 0; i < 5; i++) { c.moveTo(x - r + i * r * 0.5, y + r); c.lineTo(x - r * 0.8 + i * r * 0.4, y - r * (0.4 + (i % 2) * 0.5)); } c.stroke(); } // main
    else if (k === 4) { c.moveTo(x - r, y - r); c.lineTo(x + r, y - r); c.lineTo(x - r, y + r); c.lineTo(x + r, y + r); c.closePath(); c.stroke(); } // sablier
    else if (k === 5) { c.moveTo(x - r, y); c.bezierCurveTo(x - r * 0.4, y - r, x, y + r, x + r * 0.5, y - r * 0.2); c.stroke(); rond(c, x + r * 0.6, y - r * 0.3, 3); c.fill(); } // serpent
    else if (k === 6) { rond(c, x - r * 0.45, y, r * 0.45); c.stroke(); rond(c, x + r * 0.45, y, r * 0.45); c.stroke(); } // chaîne
    else if (k === 7) { c.moveTo(x, y - r); c.lineTo(x, y + r); c.moveTo(x - r * 0.7, y - r * 0.3); c.lineTo(x + r * 0.7, y - r * 0.3); c.stroke(); rond(c, x, y + r, 3); c.fill(); } // croix penchée
    else if (k === 8) { for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; c.moveTo(x, y); c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } c.stroke(); rond(c, x, y, r * 0.25); c.fill(); } // soleil noir
    else { c.moveTo(x - r, y + r * 0.6); c.lineTo(x - r * 0.5, y - r * 0.6); c.lineTo(x, y + r * 0.2); c.lineTo(x + r * 0.5, y - r * 0.6); c.lineTo(x + r, y + r * 0.6); c.stroke(); } // couronne d'épines
    c.restore();
  }

  // ---- La ville ----
  function pave(c, x, y, s, i) {
    c.fillStyle = (i + Math.floor(i / 6)) % 2 ? '#1d2436' : '#1a2132'; c.fillRect(x, y, s + 0.5, s + 0.5);
    const al = graineHasard(i * 37 + 3);
    c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = Math.max(1, s * 0.02);
    for (let k = 0; k < 3; k++) {
      const yy = y + s * (0.18 + k * 0.32);
      c.beginPath(); c.moveTo(x, yy); c.lineTo(x + s, yy); c.stroke();
      const dx = (al() * 0.5 + (k % 2) * 0.25) * s;
      c.beginPath(); c.moveTo(x + dx, yy); c.lineTo(x + dx, yy + s * 0.32); c.stroke();
    }
    c.strokeStyle = 'rgba(160,180,220,.06)'; c.strokeRect(x + 1, y + 1, s - 2, s - 2);
  }
  function maison(c, x, y, s, i) {
    const al = graineHasard(i * 13 + 7);
    c.fillStyle = '#0c0f19'; c.fillRect(x, y, s + 0.5, s + 0.5);
    c.fillStyle = '#262c3d';
    c.beginPath(); c.moveTo(x + s * 0.1, y + s * 0.42); c.lineTo(x + s * 0.5, y + s * 0.1); c.lineTo(x + s * 0.9, y + s * 0.42); c.closePath(); c.fill();
    c.fillStyle = '#20263a'; c.fillRect(x + s * 0.16, y + s * 0.4, s * 0.68, s * 0.52);
    const allume = al() < 0.35;
    c.fillStyle = allume ? '#e8b25a' : '#0a0c13';
    c.fillRect(x + s * 0.28, y + s * 0.5, s * 0.16, s * 0.16);
    c.fillStyle = '#0a0c13'; c.fillRect(x + s * 0.56, y + s * 0.5, s * 0.16, s * 0.16);
    c.fillRect(x + s * 0.42, y + s * 0.72, s * 0.16, s * 0.2);
  }
  function arbre(c, x, y, s) {
    c.fillStyle = '#0f1420'; c.fillRect(x, y, s + 0.5, s + 0.5);
    c.strokeStyle = '#3a3a3a'; c.lineCap = 'round';
    c.lineWidth = s * 0.08; c.beginPath(); c.moveTo(x + s * 0.5, y + s * 0.92); c.lineTo(x + s * 0.5, y + s * 0.45); c.stroke();
    c.lineWidth = s * 0.04;
    [[0.5, 0.55, 0.22, 0.25], [0.5, 0.5, 0.8, 0.2], [0.5, 0.45, 0.4, 0.12], [0.36, 0.33, 0.18, 0.3], [0.68, 0.3, 0.86, 0.36]].forEach((q) => {
      c.beginPath(); c.moveTo(x + s * q[0], y + s * q[1]); c.lineTo(x + s * q[2], y + s * q[3]); c.stroke();
    });
  }
  function tombe(c, x, y, s) {
    c.fillStyle = '#121826'; c.fillRect(x, y, s + 0.5, s + 0.5);
    c.fillStyle = '#4a5268'; rr(c, x + s * 0.28, y + s * 0.28, s * 0.44, s * 0.6, [s * 0.22, s * 0.22, 2, 2]); c.fill();
    c.strokeStyle = '#2a3046'; c.lineWidth = s * 0.03;
    c.beginPath(); c.moveTo(x + s * 0.5, y + s * 0.38); c.lineTo(x + s * 0.5, y + s * 0.6); c.moveTo(x + s * 0.41, y + s * 0.46); c.lineTo(x + s * 0.59, y + s * 0.46); c.stroke();
    c.fillStyle = '#2f5b3a'; ell(c, x + s * 0.5, y + s * 0.9, s * 0.34, s * 0.06); c.fill();
  }
  function fontaine(c, x, y, s, t) {
    c.fillStyle = '#121826'; c.fillRect(x, y, s + 0.5, s + 0.5);
    c.fillStyle = '#3d4459'; ell(c, x + s * 0.5, y + s * 0.62, s * 0.4, s * 0.24); c.fill();
    c.fillStyle = '#1f3a52'; ell(c, x + s * 0.5, y + s * 0.6, s * 0.32, s * 0.17); c.fill();
    c.fillStyle = '#4b5470'; c.fillRect(x + s * 0.46, y + s * 0.25, s * 0.08, s * 0.35);
    const p = (t / 900) % 1;
    c.strokeStyle = 'rgba(160,200,255,' + (0.5 * (1 - p)).toFixed(2) + ')'; c.lineWidth = 1.5;
    ell(c, x + s * 0.5, y + s * 0.6, s * (0.05 + 0.25 * p), s * (0.03 + 0.12 * p)); c.stroke();
  }
  function grille(c, x, y, s) {
    c.fillStyle = '#0f1420'; c.fillRect(x, y, s + 0.5, s + 0.5);
    c.strokeStyle = '#5a3a2a'; c.lineWidth = s * 0.05;
    for (let k = 0; k < 5; k++) { const xx = x + s * (0.15 + k * 0.175); c.beginPath(); c.moveTo(xx, y + s * 0.9); c.lineTo(xx, y + s * (0.2 + (k % 2) * 0.08)); c.stroke(); }
    c.beginPath(); c.moveTo(x + s * 0.1, y + s * 0.4); c.lineTo(x + s * 0.9, y + s * 0.4); c.stroke();
  }
  function horloge(c, x, y, s) {
    c.fillStyle = '#0c0f19'; c.fillRect(x, y, s + 0.5, s + 0.5);
    c.fillStyle = '#262c3d'; c.fillRect(x + s * 0.2, y + s * 0.1, s * 0.6, s * 0.85);
    c.fillStyle = '#e8dcae'; rond(c, x + s * 0.5, y + s * 0.38, s * 0.2); c.fill();
    c.strokeStyle = '#1b1b1b'; c.lineWidth = s * 0.03;
    c.beginPath(); c.moveTo(x + s * 0.5, y + s * 0.38); c.lineTo(x + s * 0.5, y + s * 0.22); c.moveTo(x + s * 0.5, y + s * 0.38); c.lineTo(x + s * 0.52, y + s * 0.24); c.stroke();
  }

  function dessinerVille(c, plan, w, h, g, t) {
    const s = g.s;
    c.fillStyle = '#05070d'; c.fillRect(g.ox - 6, g.oy - 6, s * w + 12, s * h + 12);
    for (let i = 0; i < w * h; i++) {
      const x = g.ox + (i % w) * s, y = g.oy + Math.floor(i / w) * s, ch = plan.charAt(i);
      if (ch === '.') pave(c, x, y, s, i);
      else if (ch === 'm') maison(c, x, y, s, i);
      else if (ch === 'a') arbre(c, x, y, s);
      else if (ch === 't') tombe(c, x, y, s);
      else if (ch === 'f') fontaine(c, x, y, s, t);
      else if (ch === 'r') grille(c, x, y, s);
      else if (ch === 'h') horloge(c, x, y, s);
    }
  }

  // Brume qui dérive sur toute la ville.
  function brumeVille(c, g, w, h, t, k) {
    const s = g.s;
    c.save();
    for (let i = 0; i < 7; i++) {
      const al = graineHasard(i * 71 + 5);
      const x = g.ox + ((al() * w * s + t * (0.008 + al() * 0.01) * s) % (w * s + s * 2)) - s;
      const y = g.oy + al() * h * s;
      const gr = c.createRadialGradient(x, y, 0, x, y, s * (1.4 + al()));
      gr.addColorStop(0, 'rgba(170,185,210,' + (0.09 * k).toFixed(3) + ')');
      gr.addColorStop(1, 'rgba(170,185,210,0)');
      c.fillStyle = gr; c.fillRect(x - s * 3, y - s * 3, s * 6, s * 6);
    }
    c.restore();
  }

  function centre(g, i, w) { return [g.ox + (i % w + 0.5) * g.s, g.oy + (Math.floor(i / w) + 0.5) * g.s]; }

  // Lanterne allumée (k : intensité 0 à 1).
  function lanterne(c, x, y, s, k, coul) {
    if (k <= 0) return;
    const gr = c.createRadialGradient(x, y, 0, x, y, s * 0.62);
    gr.addColorStop(0, coul ? coul + 'cc' : 'rgba(255,196,96,' + (0.75 * k).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(255,160,60,0)');
    c.globalAlpha = Math.min(1, k);
    c.fillStyle = gr; c.fillRect(x - s * 0.7, y - s * 0.7, s * 1.4, s * 1.4);
    c.fillStyle = '#2a1a08'; c.fillRect(x - s * 0.02, y - s * 0.26, s * 0.04, s * 0.06);
    c.fillStyle = '#3a2a14'; rr(c, x - s * 0.1, y - s * 0.2, s * 0.2, s * 0.28, s * 0.04); c.fill();
    c.fillStyle = '#ffd88a'; rr(c, x - s * 0.07, y - s * 0.16, s * 0.14, s * 0.2, s * 0.03); c.fill();
    c.fillStyle = '#fff6d8'; rond(c, x, y - s * 0.06, s * 0.035); c.fill();
    c.globalAlpha = 1;

    [-0.15, 0, 0.15].forEach((d, i) => {
      c.fillStyle = '#e9f6ff'; c.beginPath(); c.moveTo(x + s * (d - 0.06), y - s * 0.16); c.lineTo(x + s * (d + 0.06), y - s * 0.16); c.lineTo(x + s * (d + 0.045), y + s * 0.02); c.lineTo(x + s * (d - 0.045), y + s * 0.02); c.fill();

  // Poste de contrôle : un poteau et sa grosse lanterne.
  function poste(c, x, y, s, allume, t) {

    c.fillStyle = '#2b2f3c'; c.fillRect(x - s * 0.03, y - s * 0.3, s * 0.06, s * 0.66);

  // Jeton d'un coureur sur la carte.
  function jeton(c, k, x, y, r, opt) {

  function geometrie(w, h, cw, ch, marge) {
    const s = Math.min((cw - 2 * marge) / w, (ch - 2 * marge) / h, 96);
    return { s: s, ox: (cw - s * w) / 2, oy: (ch - s * h) / 2 };
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#1b1b1b'; c.lineWidth = 2.5;

  }

  // ---- L'écran titre : rue pavée dans le brouillard, un coureur, le Coureur pâle au loin ----
  function dessinerTitre(t) {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    t = t || 0;
    const hz = h * 0.4, cx = w / 2, u = Math.min(w, h * 0.7) / 10;
    let g = c.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, '#05070f'); g.addColorStop(1, '#202a44');
    c.fillStyle = g; c.fillRect(0, 0, w, hz + 2);
    // lune voilée
    const lx = w * 0.78, ly = h * 0.2, lr = u * 0.9;
    g = c.createRadialGradient(lx, ly, lr * 0.4, lx, ly, lr * 3);
    g.addColorStop(0, 'rgba(220,230,255,.35)'); g.addColorStop(1, 'rgba(220,230,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, w, hz);
    c.fillStyle = '#e8ecf5'; rond(c, lx, ly, lr); c.fill();
    c.fillStyle = 'rgba(32,42,68,.55)'; rond(c, lx + lr * 0.35, ly - lr * 0.1, lr * 0.85); c.fill();
    // étoiles
    const al = graineHasard(3);
    for (let i = 0; i < 60; i++) { c.fillStyle = 'rgba(255,255,255,' + (0.2 + al() * 0.6).toFixed(2) + ')'; c.fillRect(al() * w, al() * hz * 0.8, 1.5, 1.5); }
    // maisons de chaque côté de la rue, des plus lointaines aux plus proches
    for (let i = 0; i < 7; i++) {
      const k = (i + 1) / 7, yb = hz + (h - hz) * k * k * 0.55, taille = u * (0.5 + 3.2 * k * k);
      for (let side = -1; side <= 1; side += 2) {
        const x = cx + side * (w * 0.07 + w * 0.5 * k * k) + side * taille * 0.45;
        const lg = taille * 0.95, ht = taille * (0.9 + 0.3 * ((i + (side > 0 ? 1 : 0)) % 2));
        c.fillStyle = i % 2 ? '#0f1322' : '#131a2c';
        c.fillRect(x - lg / 2, yb - ht, lg, ht);
        c.beginPath(); c.moveTo(x - lg * 0.58, yb - ht); c.lineTo(x, yb - ht - taille * 0.45); c.lineTo(x + lg * 0.58, yb - ht); c.closePath(); c.fill();
        c.fillStyle = '#0a0d17'; c.fillRect(x + side * lg * 0.2 - taille * 0.06, yb - ht - taille * 0.42, taille * 0.12, taille * 0.25);
        for (let f = 0; f < 2; f++) {
          c.fillStyle = al() < 0.4 ? '#e8b25a' : '#1d2336';
          c.fillRect(x - lg * 0.3 + f * lg * 0.42, yb - ht * 0.75, lg * 0.18, ht * 0.22);
        }
      }
    }
    // la rue qui file vers l'horizon
    g = c.createLinearGradient(0, hz, 0, h);
    g.addColorStop(0, '#1b2236'); g.addColorStop(1, '#0d1220');
    c.fillStyle = g;
    c.beginPath(); c.moveTo(cx - w * 0.06, hz); c.lineTo(cx + w * 0.06, hz); c.lineTo(cx + w * 0.9, h); c.lineTo(cx - w * 0.9, h); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1.5;
    for (let i = 1; i < 14; i++) { const k = i / 14, y = hz + (h - hz) * k * k; const dx = w * 0.06 + w * 0.84 * k * k; c.beginPath(); c.moveTo(cx - dx, y); c.lineTo(cx + dx, y); c.stroke(); }

    for (let i = 1; i < 6; i++) {
      const k = i / 6, y = hz + (h - hz) * k * k * 0.9;
      for (let side = -1; side <= 1; side += 2) {
        const x = cx + side * (w * 0.06 + w * 0.7 * k * k);
        const s = u * (0.5 + 2.4 * k * k);
        c.fillStyle = '#20232e'; c.fillRect(x - s * 0.03, y - s * 1.2, s * 0.06, s * 1.2);

      }
    }
    // le Coureur pâle au fond de la rue

  }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (20 nuits) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // nuit solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton2 = 0;             // change à chaque nouvelle partie (minuteries périmées)
  let geo = null;
  let attenteTuto = false;
  let finMontree = false;     // l'écran de fin de cette course est déjà montré
  let elimineAnnonce = false;
  const particules = [];
  let flash = 0, secousse = 0;

  // Mon tour : démonstration (show), tracé (trace), envoyé (envoye).
  let monT = null;
  // Coups des autres, rejoués un par un.
  const fileAnims = [];
  let anim = null;
  // Positions affichées sur la piste (lissées).
  const pisteX = [0, 0, 0, 0, 0];

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'vestiaire', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom !== 'jeu') { dessinerTitre(performance.now()); relancerTitre(); }
    if (nom === 'titre') majTitre();
    if (nom === 'jeu') relancerBoucle();
  }

  // Animation douce de l'écran titre (brume, lanternes).
  let titreId = 0;
  function relancerTitre() {
    if (titreId) return;
    const pas = (t) => {
      titreId = 0;
      if (ecran === 'jeu') return;
      dessinerTitre(t);
      titreId = requestAnimationFrame(pas);
    };
    titreId = requestAnimationFrame(pas);
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    const voile = salonOuvert() || $('voile-fin').classList.contains('actif');
    el.classList.toggle('haut', voile);
    el.classList.toggle('jeu', !voile && ecran === 'jeu');      // sur la ville, sous les places
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  // Cartes des 5 places, en haut de l'écran, et les mêmes dans le salon.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.width = 84; cv.height = 84; cv.className = 'med';
      masque(cv.getContext('2d'), s, 42, 42, 40);
      const tag = document.createElement('span'); tag.className = 'tag';
      const pieds = document.createElement('span'); pieds.className = 'pieds';
      for (let k = 0; k < O.AMAX; k++) pieds.appendChild(document.createElement('i'));
      const hors = document.createElement('span'); hors.className = 'hors'; hors.textContent = tr('place.rattrape');
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 26, 36, 24);
      d.append(cv, tag, pieds, hors, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 104; cv.height = 104;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  // Nom d'une place dans les phrases : pseudo, sinon l'animal du masque.
  function nomCourt(s) {
    const info = siegesActuels()[s] || {};
    if (partie && s === partie.siege) return tr('place.toi');
    return info.nom || tr('masque.' + s);
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !e.fini ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const av = e ? e.av[s] : O.A0, elim = e ? e.el[s] !== 0 : false;
      const pieds = d.querySelectorAll('.pieds i');
      pieds.forEach((p, k) => p.classList.toggle('oui', k < av));
      d.classList.toggle('actif', s === tour && !anim);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('elimine', elim);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr(elim ? 'place.aria.rattrape' : 'place.aria.' + role, { masque: tr('masque.' + s), n: av }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    if (e.fini) return tr('tour.aube');
    if (anim) return anim.siege === partie.siege ? tr('tour.courtToi') : tr('tour.court', { nom: nomCourt(anim.siege) });
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) {
      if (e.ph === 'choix') return tr('tour.choix');
      if (monT && monT.phase === 'show') return tr('tour.regarde');
      if (monT && monT.phase === 'trace') return tr('tour.refais');
      return tr('tour.toi');
    }
    return tr('tour.nom', { nom: nomCourt(s) });
  }

  function majInfos() {
    let info = '';
    const e = vue;
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if (e && partie && partie.phase === 'jeu') info += ' · ' + tr('jeu.tour', { n: Math.min(e.rd, e.rmax), total: e.rmax });
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
    let aide = tr('jeu.aide');
    if (monT && monT.phase === 'show') aide = tr('jeu.aideShow');
    else if (vue && vue.ph === 'choix') aide = tr('jeu.aideChoix');
    if ($('aide').textContent !== aide) $('aide').textContent = aide;
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majChoix();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fini) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Mon tour : démonstration, puis tracé
  // ---------------------------------------------------------------------

  // Durées de la démonstration du chemin seg (ms).
  function dureesShow(seg, v) {
    const n = seg.p.length;
    const allumage = (n + 1) * v;
    const tenue = 900 + n * 70;
    return { allumage: allumage, tenue: tenue, total: allumage + tenue + 450 };
  }

  function cleTour(e) { return (partie ? partie.n : 0) + ':' + e.tour + ':' + e.rd + ':' + e.ph; }

  // Le jeu regarde s'il doit commencer mon tour (après les animations des autres).
  function verifierMonTour() {
    if (!partie || !vue || enPause || attenteTuto || anim || fileAnims.length || finMontree) return;
    if (partie.phase !== 'jeu' || vue.fini || !partie.monTour()) return;
    if (vue.ph !== 'trace' || !vue.seg) return;
    const cle = cleTour(vue);
    if (monT && monT.cle === cle) return;
    monT = { cle: cle, phase: 'show', ecoule: 0, seg: vue.seg, trace: [], vu: {}, d: dureesShow(vue.seg, vue.o.v), son: -1 };
    monT.vu[vue.seg.s] = true;
    sons.demo();
    if (vue.seg.k === 2) toast(tr('tour.sprintShow'), 1800);
    majInterface();
  }

  function majChoix() {
    const montre = !!(partie && vue && !anim && !fileAnims.length && !enPause && !finMontree && partie.phase === 'jeu' && !vue.fini && vue.ph === 'choix' && partie.monTour());
    const boite = $('choix');
    if (boite.classList.contains('actif') !== montre) {
      boite.classList.toggle('actif', montre);
      if (montre) { sons.tour(); try { $('btn-normal').focus({ preventScroll: true }); } catch (e) { /* rien */ } }
    }
  }

  function choisir(c) {
    if (!partie || !vue || vue.ph !== 'choix' || !partie.monTour()) return;
    audio();
    if (partie.jouer({ c: c })) {
      $('choix').classList.remove('actif');
      if (c === 's') sons.sprint(); else sons.clic();
    }
  }

  // Un pas du joueur (doigt, souris ou flèche).
  function essayerPas(cell) {
    if (!monT || monT.phase !== 'trace' || enPause || !partie) return;
    const seg = monT.seg, i = monT.trace.length;
    const cur = i ? monT.trace[i - 1] : seg.s;
    if (cell === cur || cell < 0) return;
    if (!O.libre(vue.m, cell) || !O.adjacent(cur, cell) || monT.vu[cell]) return;   // pas permis : on ignore
    monT.trace.push(cell);
    monT.vu[cell] = true;
    const [x, y] = geo ? centre(geo, cell, W) : [0, 0];
    if (cell === seg.p[i]) {
      sons.pas(); sons.lanterne(i);
      monT.allume = monT.allume || {};
      monT.allume[cell] = performance.now();
      if (i === seg.r) { sons.ravito(); jaillir(x, y, '#7fe0ff', 16); toast(tr('effet.ravito'), 1500); }
      if (i === seg.mi) { sons.poste(); jaillir(x, y, '#ff7a5c', 14); }
      if (monT.trace.length === seg.p.length) {
        sons.poste(); jaillir(x, y, '#ffd27a', 26);
        envoyerTrace();
      }
    } else {
      monT.erreur = cell;
      sons.erreur();
      secousse = 1;
      envoyerTrace();
    }
  }

  function envoyerTrace() {
    const action = { p: monT.trace.slice() };
    monT.phase = 'envoye';
    monT.fin = performance.now();
    // Le moteur peut être occupé un instant (message en cours) : on réessaie.
    const moi = monT;
    const tenter = (k) => {
      if (!partie || monT !== moi) return;
      if (partie.jouer(action)) return;
      if (k < 20) setTimeout(() => tenter(k + 1), 150); else monT = null;
    };
    tenter(0);
    majInterface();
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    // avance de la démonstration (figée pendant la pause)
    if (monT && monT.phase === 'show') {
      monT.ecoule += dt * 1000;
      const v = vue.o.v, k = Math.floor(monT.ecoule / v);
      if (k !== monT.son && k < monT.seg.p.length) { monT.son = k; sons.lanterne(k); }
      if (monT.ecoule >= monT.d.total) { monT.phase = 'trace'; sons.extinction(); majInterface(); }
    }
    avancerAnim(dt);
    dessinerJeu(performance.now(), dt);
    dessinerPiste(performance.now(), dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  // Ordre d'allumage d'une démonstration : du coureur au poste, ou à rebours.
  function rangAllumage(seg, i) { return seg.inv ? seg.p.length - 1 - i : i; }

  function dessinerShow(c, g, seg, ecoule, v, d, t, moiK, plan, w) {
    const s = g.s, n = seg.p.length;
    const fondu = ecoule > d.allumage + d.tenue ? Math.max(0, 1 - (ecoule - d.allumage - d.tenue) / 450) : 1;
    const allume = (i) => { const r = rangAllumage(seg, i); return Math.max(0, Math.min(1, (ecoule - (r + 0.5) * v) / 220)) * fondu; };
    // le chemin du double (mêmes lanternes, porté par le double)
    if (seg.d) seg.d.forEach((cell, i) => { const q = centre(g, cell, w); lanterne(c, q[0], q[1], s, allume(i)); });
    seg.p.forEach((cell, i) => {
      const q = centre(g, cell, w);
      if (seg.b.indexOf(i) >= 0) return;
      lanterne(c, q[0], q[1], s, allume(i));
      if (i === seg.r && allume(i) > 0) { c.globalAlpha = allume(i); ravito(c, q[0], q[1] + s * 0.22, s * 0.7); c.globalAlpha = 1; }
    });
    // faux balisages : s'allument avec la case d'où ils partent
    (seg.f || []).forEach((cell, j) => {
      const q = centre(g, cell, w);
      const k = Math.max(0, Math.min(1, (ecoule - (Math.min(n, j + 1) + 0.3) * v) / 260)) * fondu;
      feuFollet(c, q[0], q[1], s, k, t);
    });
    // brume
    seg.b.forEach((i) => { const q = centre(g, seg.p[i], w); brumeCase(c, q[0], q[1], s, t); });
    // postes pendant la démonstration
    const fin = centre(g, seg.p[n - 1], w);
    poste(c, fin[0], fin[1], s, true, t);
    if (seg.mi >= 0) { const q = centre(g, seg.p[seg.mi], w); poste(c, q[0], q[1], s, true, t); }
    if (seg.d) { const q = centre(g, seg.d[seg.d.length - 1], w); poste(c, q[0], q[1], s, true, t); }
    // les porteurs de lanterne (le vrai coureur et, les nuits du double, son double pâle)
    const porteur = (chemin, pale) => {
      if (ecoule > d.allumage + 300 || !chemin.length) return;
      const ordre = seg.inv ? chemin.slice().reverse() : [seg.s].concat(chemin);
      const f = Math.min(ordre.length - 1, Math.max(0, ecoule / v - (seg.inv ? 0.5 : 0)));
      const i0 = Math.floor(f), i1 = Math.min(ordre.length - 1, i0 + 1), fr = f - i0;
      const pa = centre(g, ordre[i0], w), pb = centre(g, ordre[i1], w);
      const x = pa[0] + (pb[0] - pa[0]) * fr, y = pa[1] + (pb[1] - pa[1]) * fr;
      const sous = ordre[Math.round(f)];
      if (!pale && seg.b.some((i) => seg.p[i] === sous)) return;          // caché sous la brume
      jeton(c, moiK, x, y - s * 0.12, s * 0.2, { pale: pale, alpha: pale ? 0.8 : 1 });
    };
    if (seg.d) porteur(seg.d, true);
    porteur(seg.p, false);
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    geo = geometrie(W, H, w, h, Math.max(8, Math.min(w, h) * 0.025));
    const g = geo, s = g.s;
    c.save();
    if (secousse > 0) { c.translate((Math.random() - 0.5) * 10 * secousse, (Math.random() - 0.5) * 6 * secousse); secousse = Math.max(0, secousse - dt * 2.5); }
    dessinerVille(c, vue.m, W, H, g, t);
    const moi = partie ? partie.siege : -1;
    const masques = {};

    // Mon tour
    if (monT) {
      const seg = monT.seg;
      if (monT.phase === 'show') dessinerShow(c, g, seg, monT.ecoule, vue.o.v, monT.d, t, moi, vue.m, W);
      else {
        // tracé : lanternes rallumées sous mes pas, postes (sauf nuits du double)
        if (!seg.d) {
          const q = centre(g, seg.p[seg.p.length - 1], W); poste(c, q[0], q[1], s, false, t);
          if (seg.mi >= 0) { const q2 = centre(g, seg.p[seg.mi], W); poste(c, q2[0], q2[1], s, false, t); }
        }
        monT.trace.forEach((cell, i) => {
          const q = centre(g, cell, W);
          if (cell === monT.erreur) {
            c.fillStyle = 'rgba(255,60,60,' + (0.35 + 0.25 * Math.sin(t / 80)).toFixed(2) + ')';
            c.fillRect(q[0] - s / 2, q[1] - s / 2, s, s);
          } else {
            lanterne(c, q[0], q[1], s, 1);
            if (i === seg.r) ravito(c, q[0], q[1] + s * 0.22, s * 0.7);
          }
        });
        // cases où l'on peut poser le pied
        if (monT.phase === 'trace') {
          const cur = monT.trace.length ? monT.trace[monT.trace.length - 1] : seg.s;
          O.voisins(vue.m, cur).forEach((j) => {
            if (monT.vu[j]) return;
            const q = centre(g, j, W);
            c.strokeStyle = 'rgba(255,210,122,' + (0.35 + 0.2 * Math.sin(t / 200)).toFixed(2) + ')';
            c.lineWidth = 2; c.setLineDash([5, 5]);
            rr(c, q[0] - s * 0.42, q[1] - s * 0.42, s * 0.84, s * 0.84, s * 0.12); c.stroke();
            c.setLineDash([]);
          });
          if (clavierActif) { const q = centre(g, cur, W); c.strokeStyle = '#ffd27a'; c.lineWidth = 3; rr(c, q[0] - s * 0.47, q[1] - s * 0.47, s * 0.94, s * 0.94, s * 0.12); c.stroke(); }
        }
        if (monT.trace.length || monT.phase !== 'show') {
          const cur = monT.trace.length ? (monT.erreur !== undefined ? monT.trace[monT.trace.length - 2] : monT.trace[monT.trace.length - 1]) : seg.s;
          masques[moi] = cur === undefined ? seg.s : cur;
        }
      }
    }

    // Coup d'un autre en cours de rejeu
    if (anim && anim.trace) {
      const k = Math.min(anim.trace.length, Math.floor(anim.t / anim.pas));
      for (let i = 0; i < k; i++) {
        const cell = anim.trace[i], q = centre(g, cell, W);
        if (i === anim.trace.length - 1 && !anim.ok) {
          c.fillStyle = 'rgba(255,60,60,' + (0.3 + 0.25 * Math.sin(t / 80)).toFixed(2) + ')';
          c.fillRect(q[0] - s / 2, q[1] - s / 2, s, s);
        } else lanterne(c, q[0], q[1], s, 0.85, null);
      }
      const ok = anim.ok ? k : Math.min(k, anim.trace.length - 1);
      masques[anim.siege] = ok > 0 ? anim.trace[ok - 1] : anim.depart;
      if (anim.fin !== undefined) { const q = centre(g, anim.fin, W); poste(c, q[0], q[1], s, true, t); }
    }

    // Les coureurs (plusieurs sur une case : en petit cercle)
    const parCase = {};
    for (let k = 0; k < PLACES; k++) {
      if (vue.el[k] !== 0 && !(anim && anim.siege === k)) continue;
      const cell = masques[k] !== undefined ? masques[k] : vue.pos[k];
      (parCase[cell] = parCase[cell] || []).push(k);
    }
    Object.keys(parCase).forEach((cle) => {
      const l = parCase[cle], q = centre(g, +cle, W), n = l.length;
      l.forEach((k, j) => {
        const a = n > 1 ? (j / n) * Math.PI * 2 - Math.PI / 2 : 0, r = n > 1 ? s * 0.2 : 0;
        const tour = partie && partie.phase === 'jeu' && !vue.fini && R.aQui(vue) === k;
        const T = TENUES[prog.options.tenue];
        jeton(c, k, q[0] + Math.cos(a) * r, q[1] + Math.sin(a) * r, s * (n > 1 ? 0.19 : 0.27), {
          halo: tour || (anim && anim.siege === k), anneau: k === moi ? T.c : null, coulHalo: k === moi ? T.c : null
        });
      });
    });

    // Particules
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul; rond(c, p.x, p.y, p.k); c.fill();
      c.globalAlpha = 1;
    }
    brumeVille(c, g, W, H, t, 1);
    c.restore();
    // Flash pâle : le Coureur pâle gagne une foulée
    if (flash > 0) {
      c.fillStyle = 'rgba(225,235,255,' + (0.45 * flash).toFixed(3) + ')'; c.fillRect(0, 0, w, h);
      coureurPale(c, w * 0.5, h * 0.72, h * 0.5 * (1.2 - flash * 0.2), t, flash);
      flash = Math.max(0, flash - dt * 1.6);
    }
  }

  // La piste de poursuite : le Coureur pâle à gauche, chaque coureur selon son avance.
  function dessinerPiste(t, dt) {
    const cv = $('piste'), w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) return;
    const x0 = 34, x1 = w - 18, pasX = (x1 - x0) / O.AMAX, y = h * 0.55;
    c.strokeStyle = '#2a3248'; c.lineWidth = 4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(14, y); c.lineTo(x1, y); c.stroke();
    for (let k = 0; k <= O.AMAX; k++) { c.fillStyle = '#3a4460'; rond(c, x0 + k * pasX, y, 2.5); c.fill(); }
    const gr = c.createLinearGradient(0, 0, x0 + pasX * 0.8, 0);
    gr.addColorStop(0, 'rgba(220,230,255,.25)'); gr.addColorStop(1, 'rgba(220,230,255,0)');
    c.fillStyle = gr; c.fillRect(0, 0, x0 + pasX, h);
    coureurPale(c, 16, h - 1, h * 0.95, t, 0.95);
    const parPos = {};
    for (let s = 0; s < PLACES; s++) {
      const cible = vue.el[s] !== 0 ? 0 : vue.av[s];
      pisteX[s] += (cible - pisteX[s]) * Math.min(1, dt * 6);
      const cle = Math.round(pisteX[s] * 4);
      (parPos[cle] = parPos[cle] || []).push(s);
    }
    Object.keys(parPos).forEach((cle) => {
      parPos[cle].forEach((s, j, l) => {
        const x = x0 + pisteX[s] * pasX + (j - (l.length - 1) / 2) * 9;
        const elim = vue.el[s] !== 0;
        c.save(); if (elim) c.globalAlpha = 0.35;
        masque(c, s, x, y - 2, 8);
        if (partie && s === partie.siege) { c.strokeStyle = '#fff'; c.lineWidth = 1.5; rond(c, x, y - 2, 10); c.stroke(); }
        c.restore();
      });
    });
  }

  function jaillir(x, y, coul, n) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 150;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, vie: 0.6 + Math.random() * 0.5, k: 2 + Math.random() * 3, coul: k % 3 ? coul : '#fff3c4' });
    }
  }

  // ---------------------------------------------------------------------
  //  Coups rejoués et effets
  // ---------------------------------------------------------------------

  function avancerAnim(dt) {
    if (!anim) {
      if (fileAnims.length) demarrerAnim(fileAnims.shift());
      else { verifierMonTour(); majChoix(); }
      return;
    }
    const acc = fileAnims.length ? 2.2 : 1;
    const avant = anim.trace ? Math.floor(anim.t / anim.pas) : 0;
    anim.t += dt * 1000 * acc;
    if (anim.trace) {
      const k = Math.floor(anim.t / anim.pas);
      if (k !== avant && k <= anim.trace.length && k > 0) {
        const juste = anim.ok || k < anim.trace.length;
        if (juste) { sons.pas(); if (k - 1 === anim.rav) sons.ravito(); } else sons.erreur();
      }
    }
    if (anim.t >= anim.duree) terminerAnim();
  }

  function demarrerAnim(ev) {
    const a = ev.action || {};
    anim = { siege: ev.siege, t: 0, ev: ev, depart: ev.avant.seg ? ev.avant.seg.s : ev.avant.pos[ev.siege] };
    if (a.c) {
      anim.duree = 400;
      if (a.c === 's' && !ev.moi) { sons.sprint(); toast(tr('effet.sprint', { nom: nomCourt(ev.siege) }), 1600); }
    } else if (ev.moi && !ev.auto) {
      anim.duree = 450;                        // déjà vu pendant le tracé
    } else {
      const seg = ev.avant.seg;
      anim.trace = (a.p || []).slice();
      anim.ok = O.prefixe(seg, anim.trace) === seg.p.length;
      anim.rav = seg.r;
      anim.fin = seg.p[seg.p.length - 1];
      // rejeu qui tient dans le délai entre deux coups (delaiBot)
      anim.pas = Math.max(70, Math.min(160, (R.delaiBot - 250) / (anim.trace.length + 1)));
      anim.duree = anim.pas * (anim.trace.length + 1) + 200;
      if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
      if (ev.moi) monT = null;
    }
    majInterface();
  }

  function terminerAnim() {
    const ev = anim.ev;
    anim = null;
    vue = JSON.parse(JSON.stringify(ev.apres));
    if (ev.moi && !(ev.action && ev.action.c)) monT = null;
    debutTour = Date.now();
    dernierTic = -1;
    effetsCoup(ev);
    majInterface();
  }

  function effetsCoup(ev) {
    const d = ev.apres.der;
    if (!d || d.c) return;
    const s = ev.siege, carte = $('place-' + s);
    const q = geo ? centre(geo, ev.apres.pos[s], W) : [0, 0];
    if (d.rav && !ev.moi) jaillir(q[0], q[1], '#7fe0ff', 10);
    if (d.ok) {
      if (!ev.moi) { sons.poste(); jaillir(q[0], q[1], '#ffd27a', 12); }
      if (d.spr) toast(ev.moi ? tr('effet.sprintReussiToi') : tr('effet.sprintReussi', { nom: nomCourt(s) }), 1800);
    } else {
      sons.pale();
      flash = ev.moi ? 1 : 0.55;
      carte.classList.remove('perd'); void carte.offsetWidth; carte.classList.add('perd');
    }
    if (d.elim) annoncerRattrape(s);
    if (d.clo) {
      setTimeout(() => {
        if (!vue) return;
        sons.cloche();
        toast(tr('effet.cloche'), 2200);
        flash = 0.7;
        d.clo.forEach((k) => annoncerRattrape(k));
      }, 700);
    }
  }

  function annoncerRattrape(s) {
    const moi = partie && s === partie.siege;
    setTimeout(() => sons.rattrape(), 200);
    if (geo && vue) { const q = centre(geo, vue.pos[s], W); jaillir(q[0], q[1], '#e9eef6', 24); }
    if (moi) {
      flash = 1;
      if (session === 'solo' && !finMontree) {
        // Solo : la nuit est perdue tout de suite.
        finMontree = true;
        const j = jeton2;
        setTimeout(() => { if (j === jeton2 && partie) { partie.pause(true); afficherFin(false, true); } }, 1300);
      } else if (!elimineAnnonce) { elimineAnnonce = true; toast(tr('effet.moiRattrape'), 3500); }
    } else toast(tr('effet.rattrape', { nom: nomCourt(s) }), 2200);
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': fileAnims.push(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function viderAnims() { fileAnims.length = 0; anim = null; monT = null; }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    viderAnims();
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne)
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    $('choix').classList.remove('actif');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 104, 104);
        masque(c, s, 52, 58, 42);
        if (info.chef) couronne(c, 52, 22, 24);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { masque: tr('masque.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { qui: nomChef ? nomChef + ' · ' + tr('masque.' + partie.chef) : tr('masque.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton2++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    viderAnims();
    particules.length = 0;
    flash = 0;
    debutTour = Date.now();
    dernierTic = -1;
    finMontree = false;
    elimineAnnonce = false;
    for (let s = 0; s < PLACES; s++) pisteX[s] = O.A0;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche, nuit: tr('nuit.' + (vue.n + 1) + '.nom') }), 2600); sons.tour(); }
    else { enPartie = true; toast(tr('nuit.intro', { n: niveau, nom: tr('nuit.' + niveau + '.nom') }) + ' — ' + tr('nuit.' + niveau + '.texte'), 3600); }
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  // Fin de course : on attend que les derniers coups soient rejoués.
  function surFin() {
    const j = jeton2;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    const attendre = () => {
      if (j !== jeton2 || !partie) return;
      if (anim || fileAnims.length) { setTimeout(attendre, 200); return; }
      setTimeout(() => {
        if (j !== jeton2 || !partie) return;
        if (enLigne) afficherFinEnLigne();
        else if (!finMontree) afficherFin(null, false);
      }, 900);
    };
    attendre();
  }

  function etatFinal() { return vue && vue.fini ? vue : partie.etat; }

  // Ai-je gagné ? Premier du classement, ou à égalité avec lui (avance et distance).
  function aGagne(e, moi) {
    if (moi < 0 || !e) return false;
    const cl = O.rangs(e), p = cl[0];
    if (p === moi) return true;
    return e.el[moi] === 0 && e.el[p] === 0 && e.av[moi] === e.av[p] && e.di[moi] === e.di[p];
  }

  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = etatFinal();
    if (!e) return;
    const moi = partie.siege;
    const gagne = aGagne(e, moi);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de course : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(av) { return av >= 3 ? 3 : av === 2 ? 2 : 1; }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const ordre = O.rangs(e);
    ordre.forEach((s, k) => {
      const l = document.createElement('div');
      const elim = e.el[s] !== 0;
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '') + (elim ? ' elimine' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; masque(cv.getContext('2d'), s, 30, 30, 28);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('masque.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = elim ? tr('fin.rattrape') : tr('fin.foulees', { n: e.av[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  // gagneForce : null (d'après le classement) ou false (rattrapé en solo).
  function afficherFin(gagneForce, rattrape) {
    const e = rattrape ? vue : etatFinal();
    if (!e || !partie) return;
    finMontree = true;
    $('choix').classList.remove('actif');
    const moi = partie.siege, sieges = siegesActuels();
    const gagne = gagneForce === false ? false : aGagne(e, moi);
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    const pts = moi >= 0 ? O.score(e, moi) : 0;
    $('fin-points').textContent = moi >= 0 ? tr('fin.points', { n: pts, postes: e.po[moi], foulees: e.av[moi], cases: e.di[moi] }) : '';
    $('fin-cadeau').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = gagne ? etoilesPour(e.av[moi]) : 0;
      const ancienRecord = prog.records[i];
      const record = gagne && pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      const tenuesAvant = TENUES.map((_, k) => tenueOuverte(k));
      const dossardsAvant = DOSSARDS.map((_, k) => dossardGagne(k));
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Les 20 nuits gagnées (maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
        const cadeaux = [];
        DOSSARDS.forEach((_, k) => { if (!dossardsAvant[k] && dossardGagne(k)) cadeaux.push(tr('fin.dossard', { nom: tr('dossard.' + k + '.nom') })); });
        TENUES.forEach((_, k) => { if (!tenuesAvant[k] && tenueOuverte(k)) cadeaux.push(tr('fin.tenue', { nom: tr('tenue.' + k) })); });
        $('fin-cadeau').textContent = cadeaux.join(' ');
      }
      $('fin-titre').textContent = gagne ? tr(e.el[moi] !== 0 ? 'fin.gagneSurvivant' : 'fin.gagne') : tr(rattrape ? 'fin.rattrapeTitre' : 'fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : (ancienRecord ? tr('fin.record', { n: Math.max(ancienRecord, gagne ? pts : 0) }) : '');
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      $('fin-compte').textContent = gagne ? '' : tr(rattrape ? 'fin.conseilRattrape' : 'fin.conseilPerdu');
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Course « avec d'autres joueurs » repassée contre des robots sur l'appareil.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la course suivante (en ligne repassé en solo).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Confettis de lumière à la victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 110 + Math.random() * 150, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 3 ? COUL[i % 5] : '#ffd27a', k: 5 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.shadowColor = b.coul; c.shadowBlur = 8; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, nuits
  // ---------------------------------------------------------------------

  function quitterPartie() {
    jeton2++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    viderAnims();
    finMontree = false;
    bandeau('');
    $('choix').classList.remove('actif');
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon'].forEach(fermerVoile);
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  // Aperçu de la ville d'une nuit (avant le premier coup).
  function apercu(n) {
    const e = R.depart(() => 0.5, PLACES, { niveau: n });
    return e;
  }

  // Parcours solo : nuit n contre 4 robots.
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton2++;
    enPartie = true;
    enPause = false;
    finMontree = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = apercu(niveau);
    viderAnims();
    particules.length = 0;
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    const fr = NIVEAUX[niveau - 1].fr;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { partie.pause(false); majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: fr, options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Course avec d'autres joueurs : robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

    const grille = $('grille-niveaux');
    grille.textContent = '';
    NIVEAUX.forEach((_, i) => {
      const n = i + 1, ouvert = n <= prog.debloque;

      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const et = document.createElement('small');

      b.append(num, et);
      b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, nom: tr('nuit.' + n + '.nom'), n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));

  // Titre trop large (mot long, en allemand) : on réduit la police jusqu'à ce qu'il tienne.

    const h1 = document.querySelector('#ecran-titre h1');

    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  // ---------------------------------------------------------------------
  //  Tutoriels animés
  // ---------------------------------------------------------------------

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const j = ++tutoAnim;
    let debut = 0;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ecoule = t - debut;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.fillStyle = '#0d1220'; c.fillRect(0, 0, 560, 360);
      if (d.cloche) dessinerTutoCloche(c, ecoule, t);
      else if (dessinerTutoChemin(c, d, ecoule, t)) debut = t;
      tutoId = requestAnimationFrame(image);
    }
    let tutoId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // Démonstration d'un chemin sur une petite ville, puis la main le refait.
  // Renvoie true quand l'animation recommence.
  function dessinerTutoChemin(c, d, ecoule, t) {
    const w = 4, h = 3, g = geometrie(w, h, 560, 360, 26);
    const v = 420;
    const seg = { s: d.d, p: d.p, f: d.f || [], b: d.b || [], r: d.r === undefined ? -1 : d.r, d: d.dbl ? d.dbl : null, inv: !!d.inv, mi: d.mi === undefined ? -1 : d.mi, k: d.mi === undefined ? 1 : 2 };
    const durees = { allumage: (seg.p.length + 1) * v, tenue: 900 };
    durees.total = durees.allumage + durees.tenue + 450;
    const pasMain = 620, debutMain = durees.total + 300, finMain = debutMain + pasMain * seg.p.length;
    dessinerVille(c, d.plan, w, h, g, t);
    if (ecoule < durees.total) dessinerShow(c, g, seg, ecoule, v, durees, t, 0, d.plan, w);
    else {
      const fait = Math.max(0, Math.min(seg.p.length, Math.floor((ecoule - debutMain) / pasMain)));
      if (!seg.d) { const q = centre(g, seg.p[seg.p.length - 1], w); poste(c, q[0], q[1], g.s, false, t); }
      for (let i = 0; i < fait; i++) {
        const q = centre(g, seg.p[i], w);
        lanterne(c, q[0], q[1], g.s, 1);
        if (i === seg.r) ravito(c, q[0], q[1] + g.s * 0.22, g.s * 0.7);
      }
      const ici = fait > 0 ? seg.p[fait - 1] : seg.s;
      const qi = centre(g, ici, w);
      jeton(c, 0, qi[0], qi[1], g.s * 0.27, { halo: true });
      if (fait < seg.p.length) {
        const q = centre(g, seg.p[fait], w), dans = Math.max(0, (ecoule - debutMain) - fait * pasMain);
        const k = Math.min(1, dans / (pasMain * 0.6));
        main(c, qi[0] + (q[0] - qi[0]) * k + 6, qi[1] + (q[1] - qi[1]) * k + 4, 1.5, k >= 1 ? 1 : 0);
      }
    }
    if (ecoule < durees.total + 300 && ecoule >= 0) { const q = centre(g, seg.s, w); if (ecoule > durees.allumage + 300) jeton(c, 0, q[0], q[1], g.s * 0.27, {}); }
    return ecoule > finMain + 1200;
  }

  // Démonstration de la cloche : tous les coureurs reculent d'une foulée.
  function dessinerTutoCloche(c, ecoule, t) {
    const cycle = ecoule % 4200, x0 = 110, pas = 80, y = 230;
    c.strokeStyle = '#2a3248'; c.lineWidth = 8; c.lineCap = 'round';
    c.beginPath(); c.moveTo(40, y); c.lineTo(520, y); c.stroke();
    coureurPale(c, 52, y + 40, 120, t, 0.95);
    const recul = cycle > 1800 ? Math.min(1, (cycle - 1800) / 600) : 0;
    [[3, 0], [2, 1], [4, 2]].forEach((q, j) => { masque(c, q[1], x0 + (q[0] - recul) * pas, y - 8 - j * 2, 24); });
    // la cloche qui sonne
    const balance = cycle < 1800 ? Math.sin(cycle / 120) * 0.5 * (1 - cycle / 1800) : 0;
    c.save(); c.translate(400, 60); c.rotate(balance);
    c.fillStyle = '#c9a24a'; c.beginPath(); c.moveTo(-34, 70); c.quadraticCurveTo(-30, 10, 0, 6); c.quadraticCurveTo(30, 10, 34, 70); c.closePath(); c.fill();
    c.fillStyle = '#8a6a22'; c.fillRect(-38, 66, 76, 8); rond(c, 0, 82, 8); c.fill();
    c.restore();
    if (cycle > 1800 && cycle < 2600) { c.fillStyle = 'rgba(225,235,255,' + (0.3 * (1 - (cycle - 1800) / 800)).toFixed(2) + ')'; c.fillRect(0, 0, 560, 360); }
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  let clavierActif = false;
  const plateau = $('plateau');
  let appui = false;
  function caseSous(ev) {
    if (!geo) return -1;
    const r = plateau.getBoundingClientRect();
    const x = ev.clientX - r.left - geo.ox, y = ev.clientY - r.top - geo.oy;
    const col = Math.floor(x / geo.s), lig = Math.floor(y / geo.s);
    if (col < 0 || col >= W || lig < 0 || lig >= H) return -1;
    return lig * W + col;
  }
  plateau.addEventListener('pointerdown', (ev) => {
    audio();
    clavierActif = false;
    appui = true;
    try { plateau.setPointerCapture(ev.pointerId); } catch (e) { /* rien */ }
    if (monT && monT.phase === 'trace') essayerPas(caseSous(ev));
    else if (partie && partie.phase === 'jeu' && vue && !vue.fini && !partie.monTour()) {
      if (Date.now() - (plateau.dernierNon || 0) > 1500) { plateau.dernierNon = Date.now(); toast(tr('tour.attends'), 1300); sons.non(); }
    }
  });
  plateau.addEventListener('pointermove', (ev) => { if (appui && monT && monT.phase === 'trace') essayerPas(caseSous(ev)); });
  const lacher = () => { appui = false; };
  plateau.addEventListener('pointerup', lacher);
  plateau.addEventListener('pointercancel', lacher);

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    if ($('choix').classList.contains('actif')) {
      if (ev.code === 'Digit1' || ev.code === 'Numpad1') { ev.preventDefault(); choisir('n'); }
      else if (ev.code === 'Digit2' || ev.code === 'Numpad2') { ev.preventDefault(); choisir('s'); }
      return;
    }
    const dirs = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -W, ArrowDown: W, KeyA: -1, KeyD: 1, KeyW: -W, KeyS: W };
    if (dirs[ev.code] !== undefined) {
      ev.preventDefault(); audio();
      clavierActif = true;
      if (!monT || monT.phase !== 'trace') return;
      const cur = monT.trace.length ? monT.trace[monT.trace.length - 1] : monT.seg.s;
      const d = dirs[ev.code], cible = cur + d;
      if ((d === 1 || d === -1) && Math.floor(cible / W) !== Math.floor(cur / W)) return;
      if (cible < 0 || cible >= W * H) return;
      essayerPas(cible);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-vestiaire').addEventListener('click', () => { audio(); sons.clic(); ouvrirVestiaire(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('vest-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-normal').addEventListener('click', () => choisir('n'));
  $('btn-sprint').addEventListener('click', () => choisir('s'));
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une nuit solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo' && !finMontree) sauver(niveau, vue && partie && partie.siege >= 0 ? O.score(vue, partie.siege) : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(performance.now()); if (ecran === 'titre') ajusterTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami : directement dans le salon de sa partie.
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
