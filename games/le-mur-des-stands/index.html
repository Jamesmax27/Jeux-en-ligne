    const p0 = pos(-0.5), a0 = tan(-0.5);
    const n0 = [-Math.sin(a0), Math.cos(a0)];
    const ext = libre(p0[0] + n0[0] * s, p0[1] + n0[1] * s) >= libre(p0[0] - n0[0] * s, p0[1] - n0[1] * s) ? 1 : -1;
    const g = { ci: ci, w: w, h: h, s: s, P: P, L: L, l: C.l, pos: pos, tan: tan, dense: dense, coins: coins, cx: cx, cy: cy, ext: ext };
    cacheGeo[cle] = g;
    return g;
  }

  // ---------------------------------------------------------------------
  //  Décor et piste (couche fixe, préparée une fois)
  // ---------------------------------------------------------------------

  const DECOR = [
    { sol: '#2b3150', sol2: '#353c62', bord: '#596080', gravier: '#4a5175' },   // ville
    { sol: '#d99a55', sol2: '#e8b26a', bord: '#f0c88a', gravier: '#e3b880' },   // désert
    { sol: '#3f6b3c', sol2: '#4d7d47', bord: '#8c9a7a', gravier: '#7b8a66' },   // montagne
    { sol: '#1d5f94', sol2: '#2a7fb8', bord: '#e9d29a', gravier: '#e9d29a' }    // bord de mer
  ];

  function tracer(c, pts, ferme) {
    c.beginPath();
    pts.forEach((p, i) => { if (i) c.lineTo(p[0], p[1]); else c.moveTo(p[0], p[1]); });
    if (ferme) c.closePath();
  }

  function decor(c, g, ci, nuit) {
    const D = DECOR[ci], w = g.w, h = g.h, s = g.s;
    c.fillStyle = D.sol; c.fillRect(0, 0, w, h);
    const al = graineHasard(31 + ci * 7);
    const loin = (x, y, m) => { for (const q of g.dense) if (Math.hypot(q[0] - x, q[1] - y) < m) return false; return true; };
    if (ci === 3) {
      // l'île : sable sous la piste, la mer autour, quelques vagues
      c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 2;
      for (let i = 0; i < 40; i++) { const x = al() * w, y = al() * h; c.beginPath(); c.arc(x, y, s * 0.3, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); }
      c.lineJoin = 'round'; c.lineCap = 'round';
      c.strokeStyle = '#d8bf86'; c.lineWidth = s * 2.6; tracer(c, g.dense, true); c.stroke();
      c.strokeStyle = D.bord; c.lineWidth = s * 2.3; tracer(c, g.dense, true); c.stroke();
    } else {
      for (let i = 0; i < 26; i++) { c.fillStyle = D.sol2; ell(c, al() * w, al() * h, s * (0.6 + al() * 1.4), s * (0.3 + al() * 0.6), al() * 3); c.fill(); }
    }
    // objets du décor, loin de la piste
    for (let i = 0; i < 70; i++) {
      const x = al() * w, y = al() * h, k = s * (0.28 + al() * 0.25);
      if (!loin(x, y, s * 0.95)) continue;
      if (ci === 0) {
        // immeubles aux fenêtres allumées
        c.fillStyle = '#1b2040'; rr(c, x - k, y - k, k * 2, k * 2, k * 0.2); c.fill();
        c.fillStyle = 'rgba(255,214,120,.8)';
        for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) if (al() < 0.55) c.fillRect(x - k * 0.75 + a * k * 0.55, y - k * 0.75 + b * k * 0.55, k * 0.3, k * 0.3);
      } else if (ci === 1) {
        if (al() < 0.5) {
          c.fillStyle = '#3c8a4a'; rr(c, x - k * 0.15, y - k, k * 0.3, k * 1.6, k * 0.15); c.fill();
          rr(c, x - k * 0.6, y - k * 0.4, k * 0.45, k * 0.2, k * 0.1); c.fill(); rr(c, x - k * 0.6, y - k * 0.8, k * 0.2, k * 0.6, k * 0.1); c.fill();
          rr(c, x + k * 0.15, y - k * 0.2, k * 0.45, k * 0.2, k * 0.1); c.fill(); rr(c, x + k * 0.4, y - k * 0.6, k * 0.2, k * 0.6, k * 0.1); c.fill();
        } else { c.fillStyle = '#b67a3c'; ell(c, x, y, k * 0.7, k * 0.45); c.fill(); c.fillStyle = '#cf9550'; ell(c, x - k * 0.15, y - k * 0.12, k * 0.4, k * 0.22); c.fill(); }
      } else if (ci === 2) {
        if (al() < 0.75) {
          c.fillStyle = '#1f4a2a';
          c.beginPath(); c.moveTo(x, y - k * 1.2); c.lineTo(x + k * 0.6, y + k * 0.4); c.lineTo(x - k * 0.6, y + k * 0.4); c.closePath(); c.fill();
          c.fillStyle = '#2b6038'; c.beginPath(); c.moveTo(x, y - k * 1.2); c.lineTo(x + k * 0.3, y - k * 0.2); c.lineTo(x - k * 0.45, y + k * 0.1); c.closePath(); c.fill();
          c.fillStyle = '#5a3a1e'; c.fillRect(x - k * 0.08, y + k * 0.4, k * 0.16, k * 0.3);
        } else { c.fillStyle = '#8b8f99'; ell(c, x, y, k * 0.7, k * 0.5, 0.3); c.fill(); c.fillStyle = '#aab0bb'; ell(c, x - k * 0.2, y - k * 0.15, k * 0.3, k * 0.18, 0.3); c.fill(); }
      } else {
        if (!loin(x, y, s * 1.35) && al() < 0.8) {
          c.strokeStyle = '#7a5530'; c.lineWidth = k * 0.18; c.lineCap = 'round';
          c.beginPath(); c.moveTo(x, y + k * 0.8); c.quadraticCurveTo(x + k * 0.2, y, x - k * 0.05, y - k * 0.5); c.stroke();
          c.fillStyle = '#2f9e4a';
          for (let f = 0; f < 5; f++) { const a = f / 5 * Math.PI * 2; ell(c, x - k * 0.05 + Math.cos(a) * k * 0.4, y - k * 0.5 + Math.sin(a) * k * 0.25, k * 0.45, k * 0.14, a); c.fill(); }
        }
      }
    }
    // piste : bas-côté, vibreurs des virages, asphalte, cases
    c.lineJoin = 'round'; c.lineCap = 'round';
    c.strokeStyle = D.gravier; c.lineWidth = s * 1.08; tracer(c, g.dense, true); c.stroke();
    g.coins.forEach((v) => {
      const pts = [];
      const a = v.cases[0] - 0.55, b = v.cases[v.cases.length - 1] + 0.55;
      for (let x = a; x <= b + 1e-6; x += 0.1) pts.push(g.pos(x));
      c.lineCap = 'butt';
      c.strokeStyle = '#f2f2f6'; c.lineWidth = s * 0.92; tracer(c, pts, false); c.stroke();
      c.strokeStyle = '#e3263b'; c.setLineDash([s * 0.18, s * 0.18]); tracer(c, pts, false); c.stroke(); c.setLineDash([]);
      c.lineCap = 'round';
    });
    c.strokeStyle = '#33363f'; c.lineWidth = s * 0.76; tracer(c, g.dense, true); c.stroke();
    c.strokeStyle = '#3b3f4a'; c.lineWidth = s * 0.5; tracer(c, g.dense, true); c.stroke();
    // séparations des cases
    c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = Math.max(1, s * 0.035);
    for (let i = 0; i < g.L; i++) {
      const p = g.pos(i + 0.5), a = g.tan(i + 0.5), nx = -Math.sin(a) * s * 0.36, ny = Math.cos(a) * s * 0.36;
      c.beginPath(); c.moveTo(p[0] - nx, p[1] - ny); c.lineTo(p[0] + nx, p[1] + ny); c.stroke();
    }
    // ligne de départ en damier
    {
      const p = g.pos(-0.5), a = g.tan(-0.5);
      c.save(); c.translate(p[0], p[1]); c.rotate(a);
      const q = s * 0.76 / 6;
      for (let i = 0; i < 6; i++) for (let j = 0; j < 2; j++) { c.fillStyle = (i + j) % 2 ? '#111' : '#fff'; c.fillRect(-q + j * q, -s * 0.38 + i * q, q, q); }
      c.restore();
    }
    // mur des stands : une bande de garages éclairés le long de la ligne droite de départ
    for (let x = -2.6; x <= 1.6; x += 0.7) {
      const p = g.pos(x), a = g.tan(x), k = g.ext, nx = -Math.sin(a) * k, ny = Math.cos(a) * k;
      const mx = p[0] + nx * s * 0.72, my = p[1] + ny * s * 0.72;
      c.save(); c.translate(mx, my); c.rotate(a);
      c.fillStyle = '#c9cede'; c.fillRect(-s * 0.36, -s * 0.07, s * 0.72, s * 0.14);
      c.restore();
      const gx = p[0] + nx * s * 0.95, gy = p[1] + ny * s * 0.95;
      c.save(); c.translate(gx, gy); c.rotate(a);
      c.fillStyle = '#20264d'; c.fillRect(-s * 0.34, -s * 0.16, s * 0.68, s * 0.32);
      c.fillStyle = COUL[Math.round((x + 2.6) / 0.7) % 6]; c.fillRect(-s * 0.26, -s * 0.1, s * 0.52, s * 0.2);
      c.restore();
    }
    if (nuit) {
      c.fillStyle = 'rgba(4,6,22,.5)'; c.fillRect(0, 0, w, h);
    }
  }

  // Couche fixe dans une toile à part (dessinée une fois par circuit et par taille).
  let coucheFixe = null;
  function couche(g, nuit, dpr) {
    const cle = g.ci + '|' + g.w + '|' + g.h + '|' + (nuit ? 1 : 0) + '|' + dpr;
    if (coucheFixe && coucheFixe.cle === cle) return coucheFixe.cv;
    const cv = document.createElement('canvas');
    cv.width = Math.round(g.w * dpr); cv.height = Math.round(g.h * dpr);
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    decor(c, g, g.ci, nuit);
    coucheFixe = { cle: cle, cv: cv };
    return cv;
  }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (championnat) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // course solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle course (minuteries périmées)
  let choix = null;           // action choisie (aperçu), null = rien
  let attenteTuto = false;
  let dernierAttends = 0;
  let feux = 0;               // heure des feux de départ
  const aff = [], vrille = [], effets = [], fumees = [];

  function moi() { return partie ? partie.siege : -1; }

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'garage', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'titre' ? 'block' : 'none';
    if (nom === 'titre') { dessinerTitre(); majTitre(); }
    if (nom === 'jeu') relancerBoucle();
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    el.classList.toggle('haut', salonOuvert() || $('voile-fin').classList.contains('actif'));
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  // Cartes des 6 places, en haut de l'écran, et les mêmes dans le salon.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'tete'; cv.width = 76; cv.height = 76;
      const pos = document.createElement('span'); pos.className = 'pos';
      const tag = document.createElement('span'); tag.className = 'tag';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 26, 36, 24);
      d.append(cv, pos, tag, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 100; cv.height = 100;
      const eq = document.createElement('span'); eq.className = 'eq'; eq.textContent = tr('ecurie.' + s);
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, eq, tag);
      salon.appendChild(d);
    }
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom d'une place : le pseudo d'un vrai joueur en ligne (partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }
  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  const decorCasque = (s) => (s === moi() ? prog.casque : 0);

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !e.fini ? R.aQui(e) : -1;
    const ordre = e ? O.rang(e) : [];
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const p = ordre.indexOf(s) + 1;
      d.querySelector('.pos').textContent = p > 0 ? tr('pos.court', { n: p }) : '';
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      const cv = d.querySelector('canvas.tete'), dc = decorCasque(s);
      if (cv.dataset.d !== String(dc)) { cv.dataset.d = String(dc); const c = cv.getContext('2d'); c.clearRect(0, 0, 76, 76); casque(c, 38, 40, 32, COUL[s], dc); }
      d.setAttribute('aria-label', tr('place.aria.' + role, { ecurie: tr('ecurie.' + s), pos: p }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteApercu() {
    const m = moi();
    if (!vue || m < 0 || choix === null) return tr('tour.toi');
    if (choix === 0) return tr(O.opt(vue, 'c') ? 'apercu.standEssence' : 'apercu.stand');
    const tj = O.trajet(vue, m, choix);
    if (tj.tete) return tr('apercu.tete');
    if (tj.risques.length) return tr('apercu.risque');
    return tr(tj.asp ? 'apercu.aspi' : 'apercu.sur', { n: tj.dist });
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || e.fini) return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (O.arrivee(e, partie.siege)) return tr('tour.arrive', { n: O.rang(e).indexOf(partie.siege) + 1 });
    if (s === partie.siege) return texteApercu();
    if (e.at[partie.siege] > 0) return tr('tour.saute');
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.ecurie', { ecurie: tr('ecurie.' + s) });
  }

  function majInfos() {
    let info = '';
    const circ = vue ? tr('circuit.' + vue.c) : '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length, circuit: circ });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche, circuit: circ });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  // Tableau de bord : tour, place, pneus, essence, aspiration, météo.
  function majTableau() {
    const e = vue, m = moi();
    const ok = e && m >= 0;
    $('tableau').style.visibility = e ? 'visible' : 'hidden';
    if (!e) return;
    const s = ok ? m : O.rang(e)[0];
    const ob = $('hud-obj');
    ob.hidden = session !== 'solo';
    if (!ob.hidden) {
      const N = NIVEAUX[niveau - 1], t0 = tr(N.obj === 1 ? 'objectif.1' : 'objectif.n', { n: N.obj });
      if (ob.textContent !== t0) ob.textContent = t0;
    }
    const tour =Math.max(1, Math.min(e.tr, Math.floor(Math.max(0, e.d[s]) / e.L) + 1));
    const t1 = tr('hud.tour', { n: tour, total: e.tr });
    if ($('hud-tour').textContent !== t1) $('hud-tour').textContent = t1;
    const t2 = ok ? tr('hud.pos', { n: O.rang(e).indexOf(m) + 1, total: PLACES }) : '';
    if ($('hud-pos').textContent !== t2) $('hud-pos').textContent = t2;
    $('hud-pos').hidden = !ok;
    const pn = $('hud-pneus');
    pn.hidden = !ok || !O.opt(e, 'u');
    if (!pn.hidden) {
      const g = e.g[m], i = pn.querySelector('i');
      i.style.width = Math.round(g / O.GMAX * 100) + '%';
      i.style.background = g >= 4 ? '#3fd47a' : g >= 2 ? '#ff9a2e' : '#ff4d4d';
      pn.setAttribute('aria-label', tr('hud.pneus') + ' ' + g + '/' + O.GMAX);
      pn.classList.toggle('alerte', g < 2);
    }
    const es = $('hud-essence');
    es.hidden = !ok || !O.opt(e, 'c');
    if (!es.hidden) {
      const f = e.fu[m], i = es.querySelector('i');
      i.style.width = Math.round(f / e.fuMax * 100) + '%';
      i.style.background = f > 6 ? '#ffb020' : '#ff4d4d';
      es.setAttribute('aria-label', tr('hud.essence') + ' ' + f + '/' + e.fuMax);
      es.classList.toggle('alerte', f < 4);
    }
    const as = $('hud-aspi');
    as.hidden = !ok || !O.opt(e, 'a');
    if (!as.hidden) { const on = O.aspiration(e, m) > 0; as.classList.toggle('eteinte', !on); as.classList.toggle('vive', on); }
    $('hud-pluie').hidden = !e.pl;
    $('hud-sc').hidden = !(e.sR > 0);
  }

  // Main de cartes : couleur selon le danger, grisée hors de son tour.
  function construireCartes() {
    const boite = $('cartes');
    boite.textContent = '';
    for (let v = 1; v <= 6; v++) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'carte-v'; b.dataset.v = String(v);
      b.addEventListener('click', () => { audio(); toucherAction(v); });
      boite.appendChild(b);
    }
  }

  function etatCarte(e, m, v) {
    if (O.actions(e, m).indexOf(v) < 0) return v > O.carteMax(e) ? 'sc' : 'essence';
    const tj = O.trajet(e, m, v);
    return tj.tete ? 'tete' : (tj.risques.length ? 'risque' : 'sur');
  }

  function majMain() {
    const e = vue, m = moi();
    const monTour = !!(partie && e && m >= 0 && partie.monTour() && !enPause && !attenteTuto);
    if (choix !== null && !monTour) choix = null;
    const boutons = $('cartes').children;
    for (let k = 0; k < boutons.length; k++) {
      const b = boutons[k], v = k + 1;
      const visible = !!e && v <= e.cm;
      b.hidden = !visible;
      if (!visible) continue;
      const etat = m >= 0 ? etatCarte(e, m, v) : 'sur';
      const dispo = monTour && etat !== 'essence' && etat !== 'sc';
      const cle = etat + '|' + dispo + '|' + (choix === v) + '|' + (O.opt(e, 'c') ? O.cout(v) : 0);
      if (b.dataset.cle === cle) continue;
      b.dataset.cle = cle;
      b.disabled = !dispo;
      b.className = 'carte-v ' + (etat === 'essence' || etat === 'sc' ? '' : etat) + (choix === v ? ' choisie' : '');
      b.innerHTML = '';
      const n = document.createElement('span'); n.textContent = nb(v);
      b.appendChild(n);
      b.insertAdjacentHTML('beforeend', SIGNE[etat === 'essence' || etat === 'sc' ? 'non' : etat]);
      if (O.opt(e, 'c')) {
        const ct = document.createElement('span'); ct.className = 'cout';
        for (let i = 0; i < O.cout(v); i++) ct.appendChild(document.createElement('i'));
        b.appendChild(ct);
      }
      b.setAttribute('aria-label', tr('carte.aria', { n: v, etat: tr('etat.' + etat) }));
    }
    const st = $('btn-stand');
    st.hidden = !e || !O.opt(e, 's');
    $('actions').classList.toggle('seul', st.hidden);
    st.disabled = !monTour;
    st.classList.toggle('choisie', choix === 0);
    const r = $('btn-rouler');
    const texte = tr(choix === 0 ? 'bouton.auStand' : (choix ? 'bouton.rouler' : 'choix.aucun'));
    if (r.textContent !== texte) r.textContent = texte;
    r.disabled = !monTour || choix === null;
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majTableau();
    majMain();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fini) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;

  // ---------------------------------------------------------------------

  // Positions cibles des voitures (plusieurs sur une case : côte à côte, puis l'une derrière l'autre).

    const res = [];

  function placerVoitures(e, instant, dt) {

      const diff = c.d - aff[s].d, pas = Math.max(7, Math.abs(diff) * 3) * dt;

    }

  function dessinerJeu(t, dt) {

    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');

    }

    if (e.sR > 0) {
      const premier = O.rang(e).filter((q) => !O.arrivee(e, q))[0] || 0, x =aff[premier] ? aff[premier].d + 0.7 : e.d[premier] + 0.7;
      const p = g.pos(x), a = g.tan(x);

  let masque = null;
  function masqueNuit(w, h, dpr) {
    const W = Math.round(w * dpr), H = Math.round(h * dpr);

    if (masque.width !== W || masque.height !== H) { masque.width = W; masque.height = H; }
    return masque;
  }

  function jaillir(s, coul, n, etin) {
    if (!vue || !aff[s]) return;
    const zone = $('zone'), g = geoCircuit(vue.c, zone.clientWidth, zone.clientHeight);
    const p = g.pos(aff[s].d);
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = 20 + Math.random() * (etin ? 140 : 40);

    }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function copie(x) { return JSON.parse(JSON.stringify(x)); }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? copie(partie.etat) : null;
    if (vue) placerVoitures(vue, true, 0);
    debutTour = Date.now();
    choix = null;
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la course,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + decorCasque(s);
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');

        if (info.chef) couronne(c, 50, 22, 22);

        d.setAttribute('aria-label', tr('salon.place.' + role, { ecurie: tr('ecurie.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { qui: nomChef ? nomChef + ' · ' + tr('ecurie.' + partie.chef) : tr('ecurie.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {

    placerVoitures(vue, true, 0);

    choix = null;
    feux = performance.now();
    feuxDernier = -1;

    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;

    } else if (x.k === 't') {
      sons.moteur(x.v || 1); setTimeout(() => sons.crisse(), 180);
      vrille[s] = performance.now() + 250; texteEnvol(s, tr('popup.tete'), '#ff6b6b');
      setTimeout(() => jaillir(s, '#c9ccd8', 16, false), 300);

    } else {

      if (x.asp) { texteEnvol(s, tr('popup.aspi'), '#9fd8ff'); }
      if (x.dp > 0) { setTimeout(() => { sons.double(); texteEnvol(s, tr('popup.dep', { n: x.dp }), '#ffd23f'); jaillir(s, COUL[s], 10, true); }, 280); }
      else if (x.ri && s === m) setTimeout(() => texteEnvol(s, tr('popup.ouf'), '#7ef0a0'), 300);
    }
    // tours de piste de sa voiture
    if (s === m && m >= 0 && x.k === 'r') {
      const ta = Math.floor(Math.max(0, avant.d[m]) / avant.L), tb = Math.floor(Math.max(0, apres.d[m]) / apres.L);
      if (tb > ta && tb < apres.tr) toast(tb === apres.tr - 1 ? tr('evt.dernierTour') : tr('evt.tour', { n: tb + 1, total: apres.tr }));
    }
    // ligne d'arrivée : la première voiture, puis la sienne
    if (!avant.dr && apres.dr) {
      const nom = (siegesActuels()[s] || {}).nom;
      if (s !== m) setTimeout(() => toast(tr('evt.drapeau', { qui: nom || tr('ecurie.' + s) }), 2600), 300);
    }
    if (s === m && m >= 0 && avant.arr.indexOf(m) < 0 && apres.arr.indexOf(m) >= 0) {
      setTimeout(() => toast(tr('evt.arrivee', { n: apres.arr.indexOf(m) + 1 }), 2600), 300);
      setTimeout(() => jaillir(s, '#ffffff', 18, true), 250);
    }
    if (apres.rv && apres.rv.p === 1) { toast(tr('evt.pluie'), 3200); sons.pluie(); }
    if (apres.rv && apres.rv.p === -1) toast(tr('evt.pluieFin'));
    if (apres.rv && apres.rv.k) { toast(tr('evt.sc'), 3400); sons.sc(); }
    else if (avant.sR > 0 && apres.sR === 0) toast(tr('evt.scFin'));
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && !apres.fini && R.aQui(apres) === partie.siege && !ev.moi) sons.tour();
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1000);
  }

  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const m = moi(), res = R.fin(e);
    const gagne = m >= 0 && res && res.classement[0] === m;
    if (m >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.c + 1 });
    if (m >= 0) trophesCourse(e, m, false, gagne);
    remplirClassement(e, m, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de course : victoire, défaite, classement, trophées
  // ---------------------------------------------------------------------

  function remplirClassement(e, m, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e), ordre = res ? res.classement : O.rang(e);
    ordre.forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === m ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 56; cv.height = 56; casque(cv.getContext('2d'), 28, 30, 24, COUL[s], decorCasque(s));
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === m ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('ecurie.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = tr('fin.points', { n: res ? res.scores[s] : 0 }) + ' · ' + tr('fin.depCourt', { n: e.dp[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  // Trophées d'une course (solo ou en ligne) ; renvoie les nouveaux.
  function trophesCourse(e, m, solo, gagne) {
    const nouveaux = [];
    const donner = (id) => { if (prog.trophees.indexOf(id) < 0) { prog.trophees.push(id); nouveaux.push(id); } };
    if (e.dp[m] >= 5) donner('aspi');
    if (solo && gagne) {
      const place = O.rang(e).indexOf(m) + 1;
      for (let b = 0; b < 4; b++) if (prog.etoiles.slice(b * 5, b * 5 + 5).every((x) => x > 0)) donner('coupe' + b);
      if (place === 1 && niveau >= 6 && e.ts[m] === 0) donner('propre');
      if (e.tr >= 2 && O.opt(e, 'u') && e.st[m] === 0) donner('escale');
    }
    if (!solo && gagne && partie && partie.mode === 'en-ligne') donner('ligne');
    if (nouveaux.length && !solo) sauverReglages();
    return nouveaux;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const m = moi(), sieges = siegesActuels();
    const res = R.fin(e);
    const place = m >= 0 ? res.classement.indexOf(m) + 1 : PLACES;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, m, sieges, $('fin-classement'));
    const bilan = $('fin-bilan');
    bilan.textContent = '';
    const ajouter = (texte) => { const sp = document.createElement('span'); sp.textContent = texte; bilan.appendChild(sp); };
    $('fin-bonus').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1, N = NIVEAUX[i];
      const gagne = m >= 0 && place <= N.obj;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = gagne ? 1 + (place === 1 ? 1 : 0) + (e.dp[m] >= N.dep ? 1 : 0) : 0;
      const score = Math.max(0, (7 - place) * 100 + 25 * e.dp[m] - 20 * e.ts[m]);
      const ancienRecord = prog.records[i];
      const record = score > ancienRecord;
      if (record) prog.records[i] = score;
      const etoilesAvant = totalEtoiles(), casquesAvant = NIV_CASQUE.filter((_, k) => casqueOuvert(k)).length;
      let debloque = false, nouveaux = [];
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        nouveaux = trophesCourse(e, m, true, gagne);
        sauver(Math.min(niveau + 1, NIVEAUX.length), score);
        // Championnat terminé (tous les Grands Prix gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else {
        nouveaux = trophesCourse(e, m, true, gagne);
        if (nouveaux.length || record) sauver(niveau, score);
      }
      $('fin-titre').textContent = gagne ? tr('fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      ajouter(tr('fin.place', { n: place, total: PLACES }));
      ajouter(tr(N.obj === 1 ? 'objectif.1' : 'objectif.n', { n: N.obj }));
      ajouter(tr('fin.dep', { n: e.dp[m] }));
      ajouter(tr('fin.depObj', { n: N.dep }));
      ajouter(tr('fin.tetes', { n: e.ts[m] }));
      ajouter(tr('fin.stands', { n: e.st[m] }));
      ajouter(tr('fin.score', { n: score }));
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, score) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      const bonus = nouveaux.map((id) => tr('fin.trophee', { nom: tr('trophee.' + id + '.nom') }));
      if (SEUIL_LIVREE.some((sv) => etoilesAvant < sv && totalEtoiles() >= sv)) bonus.push(tr('fin.livree'));
      if (NIV_CASQUE.filter((_, k) => casqueOuvert(k)).length > casquesAvant) bonus.push(tr('fin.casque'));
      $('fin-bonus').textContent = bonus.join(' · ');
      if (bonus.length) setTimeout(() => sons.debloque(), 900);
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
      if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    } else {
      // Course « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les courses s'enchaînent seules.
      const gagne = m >= 0 && place === 1;
      if (m >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.c + 1 });
      if (m >= 0) trophesCourse(e, m, false, gagne);
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      if (m >= 0) { ajouter(tr('fin.place', { n: place, total: PLACES })); ajouter(tr('fin.dep', { n: e.dp[m] })); }
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
      if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    }
    ouvrirVoile('voile-fin');
  }

  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 100; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 3 ? COUL[i % 6] : (i % 2 ? '#fff' : '#111'), k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    choix = null;
    feux = 0;
    bandeau('');
    fermerVoile('voile-pause');
    fermerVoile('voile-fin');
    fermerVoile('voile-tuto');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  // Championnat solo : Grand Prix n contre 5 robots.
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    choix = null;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = R.depart(() => 0.5, PLACES, { niveau: niveau });
    placerVoitures(vue, true, 0);
    effets.length = 0; fumees.length = 0;
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Course avec d'autres joueurs : courses qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  // ---------------------------------------------------------------------

  const DEMO = [[40, 120], [100, 120], [160, 120], [220, 120], [280, 120], [340, 120], [398, 132], [440, 172], [458, 228], [462, 290]];
  const DEMO_EPINGLE = [[40, 110], [100, 110], [160, 110], [220, 110], [280, 110], [336, 116], [380, 148], [392, 196], [366, 238], [318, 252], [262, 252]];

  function bandeDemo(c, P, lims, s) {
    const pos = (x) => { const i = Math.floor(x), f = x - i, q = (k) => P[Math.max(0, Math.min(P.length - 1, k))]; return cr(q(i - 1), q(i), q(i + 1), q(i + 2), f); };
    const tan = (x) => { const a = pos(x - 0.05), b = pos(x + 0.05); return Math.atan2(b[1] - a[1], b[0] - a[0]); };
    const pts = [];
    for (let x = -0.4; x <= P.length - 1 + 0.4; x += 0.1) pts.push(pos(Math.max(0, Math.min(P.length - 1.001, x))));
    c.lineJoin = 'round'; c.lineCap = 'round';
    c.strokeStyle = '#4a5175'; c.lineWidth = s * 1.05; tracer(c, pts, false); c.stroke();
    // vibreurs
    let a = -1;
    for (let i = 0; i <= lims.length; i++) {
      const on = i < lims.length && lims[i] > 0;
      if (on && a < 0) a = i;
      if (!on && a >= 0) {
        const q = [];
        for (let x = a - 0.5; x <= i - 1 + 0.5; x += 0.1) q.push(pos(Math.max(0, Math.min(P.length - 1.001, x))));
        c.lineCap = 'butt'; c.strokeStyle = '#f2f2f6'; c.lineWidth = s * 0.9; tracer(c, q, false); c.stroke();
        c.strokeStyle = '#e3263b'; c.setLineDash([s * 0.18, s * 0.18]); tracer(c, q, false); c.stroke(); c.setLineDash([]); c.lineCap = 'round';
        a = -1;
      }
    }
    c.strokeStyle = '#33363f'; c.lineWidth = s * 0.76; tracer(c, pts, false); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 1.5;
    for (let i = 0; i < P.length - 1; i++) {
      const p = pos(i + 0.5), an = tan(i + 0.5), nx = -Math.sin(an) * s * 0.36, ny = Math.cos(an) * s * 0.36;
      c.beginPath(); c.moveTo(p[0] - nx, p[1] - ny); c.lineTo(p[0] + nx, p[1] + ny); c.stroke();
    }
    return { pos: pos, tan: tan };
  }

  function carteDemo(c, x, y, v, actif, couleur) {
    c.save();
    c.translate(x, y - (actif ? 6 : 0));
    c.fillStyle = '#eef1ff'; c.strokeStyle = couleur || '#8a93bf'; c.lineWidth = 3;
    rr(c, -20, -27, 40, 54, 8); c.fill(); c.stroke();
    if (actif) { c.strokeStyle = '#ffd23f'; c.lineWidth = 3; rr(c, -24, -31, 48, 62, 10); c.stroke(); }
    c.fillStyle = '#121735'; c.font = '900 26px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(nb(v), 0, 1);
    c.restore();
  }

  function cleDemo(c, x, y, actif) {
    c.save(); c.translate(x, y - (actif ? 6 : 0));
    c.fillStyle = '#20306e'; c.strokeStyle = actif ? '#ffd23f' : '#6c80e0'; c.lineWidth = 3;
    rr(c, -26, -24, 52, 48, 10); c.fill(); c.stroke();
    c.fillStyle = '#ffd23f'; c.save(); c.rotate(-0.7); rr(c, -4, -2, 22, 7, 3); c.fill(); rond(c, -6, 1.5, 9); c.fill(); c.fillStyle = '#20306e'; c.fillRect(-14, -1, 8, 5); c.restore();
    c.restore();
  }

  function mainDemo(c, x, y, appui) {
    c.save(); c.translate(x, y); c.scale(1.5, 1.5); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#121735'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  function jaugeDemo(c, x, y, k, coul, icone) {
    c.fillStyle = '#10142e'; rr(c, x, y, 130, 26, 8); c.fill();
    c.fillStyle = '#ffffff22'; rr(c, x + 30, y + 9, 92, 9, 4); c.fill();
    c.fillStyle = coul; rr(c, x + 30, y + 9, Math.max(0, 92 * k), 9, 4); c.fill();
    if (icone === 'pneu') { c.fillStyle = '#222'; rond(c, x + 15, y + 13, 9); c.fill(); c.fillStyle = '#bbb'; rond(c, x + 15, y + 13, 4); c.fill(); }
    else { c.fillStyle = '#ffb020'; rr(c, x + 9, y + 5, 11, 16, 2); c.fill(); }
  }

  // Une image du tutoriel cle au temps t (ms) ; boucle de 5,2 s.
  function demoTuto(c, cle, t) {
    const W = 560, H = 360, T = (t % 5200) / 1000;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, W, H);
    const nuit = cle === 'nuit';
    c.fillStyle = cle === 'six' ? '#d99a55' : cle === 'epingle' ? '#3f6b3c' : nuit ? '#0d1030' : '#2b3150';
    c.fillRect(0, 0, W, H);
    const P = cle === 'epingle' ? DEMO_EPINGLE : DEMO;
    const lims = cle === 'epingle' ? [0, 0, 0, 0, 0, 2, 2, 2, 2, 2, 0] : cle === 'six' ? [0, 0, 0, 0, 0, 0, 0, 0, 5, 5] : [0, 0, 0, 0, 0, 0, 3, 3, 3, 0];
    const s = 56;
    const B = bandeDemo(c, P, lims, s);
    const lisse = (a, b, x) => { const q = Math.max(0, Math.min(1, (x - a) / (b - a))); return q * q * (3 - 2 * q); };
    let limite = cle === 'epingle' ? 2 : cle === 'six' ? 5 : 3;
    if (cle === 'pluie' && T > 1.6) limite = 2;
    const badgeX = cle === 'epingle' ? 440 : 520, badgeY = cle === 'epingle' ? 196 : 180;
    let voitures = [];      // [d, couleur, angle en plus]
    let cartes = [];        // [v, actif, couleur]
    let mainA = null, stand = null, jauge = null;
    const cartesX = (k) => 50 + k * 50;
    const yC = 318;
    if (cle === 'base') {
      const d = 2 * lisse(1.2, 2.0, T) + 3 * lisse(3.2, 4.0, T) - 0.0;
      voitures.push([d + 0, COUL[0], 0]);
      cartes = [[1, false], [2, T > 0.7 && T < 2.2, '#2fb85a'], [3, T > 2.7 && T < 4.2, '#2fb85a'], [4, false, '#ff9a2e'], [5, false, '#e0263b']];
      mainA = T < 2.2 ? [cartesX(1), yC, T > 0.6 && T < 0.9] : [cartesX(2), yC, T > 2.6 && T < 2.9];
    } else if (cle === 'tete') {
      const d = 2 + 3.4 * lisse(1.2, 1.8, T);
      voitures.push([Math.min(d, 5.2), COUL[0], T > 1.8 ? Math.min(1, (T - 1.8) / 0.9) * Math.PI * 2 : 0]);
      cartes = [[1, false, '#2fb85a'], [2, false, '#2fb85a'], [3, false, '#2fb85a'], [4, false, '#ff9a2e'], [5, T > 0.7 && T < 2, '#e0263b']];
      mainA = [cartesX(4), yC, T > 0.6 && T < 0.9];
      if (T > 1.9 && T < 3.5) { c.fillStyle = 'rgba(200,204,216,.5)'; for (let i = 0; i < 6; i++) { const p = B.pos(5.2); rond(c, p[0] + Math.sin(i * 2 + T * 3) * 20, p[1] - (T - 1.9) * 30 - i * 6, 10 + i * 2); c.fill(); } }
    } else if (cle === 'pneus' || cle === 'carbu') {
      const hop = lisse(0.5, 1.0, T) + lisse(1.4, 1.9, T);
      voitures.push([hop * 2, COUL[0], 0]);
      const k = T < 2.6 ? 1 - hop * 0.38 : (T < 3.2 ? 0.24 : 1);
      jauge = [k, k < 0.4 ? '#ff4d4d' : (cle === 'carbu' ? '#ffb020' : '#3fd47a'), cle === 'carbu' ? 'essence' : 'pneu'];
      cartes = [[1, false, '#2fb85a'], [2, T > 0.3 && T < 2, '#2fb85a'], [3, false, '#2fb85a']];
      stand = [cartesX(3) + 20, yC, T > 2.6 && T < 3.6];
      mainA = T < 2.2 ? [cartesX(1), yC, T > 0.25 && T < 0.5] : [cartesX(3) + 20, yC, T > 2.5 && T < 2.8];
      if (T > 3.2 && T < 4.2) { c.fillStyle = '#ffd23f'; const p = B.pos(hop * 2); for (let i = 0; i < 6; i++) { const a = i + T * 6; etincelle(c, p[0] + Math.cos(a) * 34, p[1] + Math.sin(a) * 24, 7); } }
    } else if (cle === 'aspi') {
      const d = 1 + 4 * lisse(1.2, 2.1, T);
      voitures.push([3, COUL[1], 0]);
      voitures.push([d, COUL[0], 0]);
      cartes = [[1, false, '#2fb85a'], [2, false, '#2fb85a'], [3, T > 0.7 && T < 2.2, '#2fb85a']];
      mainA = [cartesX(2), yC, T > 0.6 && T < 0.9];
      if (T > 1.2 && T < 2.3) {
        c.strokeStyle = 'rgba(159,216,255,.8)'; c.lineWidth = 3;
        const p = B.pos(d);
        for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(p[0] - 40 - i * 8, p[1] - 10 + i * 10); c.lineTo(p[0] - 80 - i * 12, p[1] - 10 + i * 10); c.stroke(); }
      }
    } else if (cle === 'six') {
      const d = 6 * lisse(1.2, 2.3, T);
      voitures.push([d, COUL[0], 0]);
      cartes = [[3, false, '#2fb85a'], [4, false, '#2fb85a'], [5, false, '#2fb85a'], [6, T > 0.7 && T < 2.4, '#2fb85a']];
      mainA = [cartesX(3), yC, T > 0.6 && T < 0.9];
    } else if (cle === 'pluie') {
      voitures.push([4, COUL[0], 0]);
      cartes = [[1, false, '#2fb85a'], [2, false, T > 1.6 ? '#2fb85a' : '#2fb85a'], [3, false, T > 1.6 ? '#ff9a2e' : '#2fb85a']];
    } else if (cle === 'sc') {
      const q = lisse(1.2, 2.4, T);
      voitures.push([0.5 + 2.5 * q, COUL[2], 0], [2 + 1.5 * q, COUL[1], 0], [4.2, COUL[0], 0]);
      if (q > 0) voitures.push([4.2 + 0.75, '#f5f5f5', 0, true]);
      cartes = [[1, false, '#2fb85a'], [2, false, '#2fb85a'], [3, false, '#2fb85a'], [4, false, '#8a93bf'], [5, false, '#8a93bf']];
    } else if (cle === 'epingle') {
      const d = 3 + 2 * lisse(1.2, 1.9, T) + 2 * lisse(2.8, 3.5, T);
      voitures.push([d, COUL[0], 0]);
      cartes = [[1, false, '#2fb85a'], [2, (T > 0.7 && T < 2) || (T > 2.3 && T < 3.6), '#2fb85a'], [3, false, '#ff9a2e'], [4, false, '#e0263b']];
      mainA = T < 2.1 ? [cartesX(1), yC, T > 0.6 && T < 0.9] : [cartesX(1), yC, T > 2.3 && T < 2.6];
    } else if (cle === 'nuit') {
      const d = 3 * lisse(1.2, 2.2, T);
      voitures.push([d, COUL[0], 0]);
      cartes = [[1, false, '#2fb85a'], [2, false, '#2fb85a'], [3, T > 0.7 && T < 2.3, '#2fb85a']];
      mainA = [cartesX(2), yC, T > 0.6 && T < 0.9];
    }
    // badge de la limite
    badgeLimite(c, badgeX, badgeY, 18, limite, cle === 'pluie' ? 3 : limite, false);
    voitures.forEach((v) => {
      const p = B.pos(Math.max(0, Math.min(P.length - 1.001, v[0]))), a = B.tan(Math.max(0, Math.min(P.length - 1.001, v[0])));
      voiture(c, p[0], p[1], a + v[2], 38, v[1], 0, { casque: v[1] === COUL[0] ? '#ffd23f' : '#fff', phares: nuit });
      if (v[3]) { c.fillStyle = Math.floor(t / 250) % 2 ? '#ffb020' : '#ff4d4d'; rond(c, p[0], p[1], 5); c.fill(); }
    });
    if (nuit) {
      const p = B.pos(Math.max(0, voitures[0][0]));
      const g = c.createRadialGradient(p[0] + 60, p[1], 20, p[0] + 60, p[1], 240);
      g.addColorStop(0, 'rgba(2,3,14,0)'); g.addColorStop(0.55, 'rgba(2,3,14,.2)'); g.addColorStop(1, 'rgba(2,3,14,.93)');
      c.fillStyle = g; c.fillRect(0, 0, W, 280);
    }
    if (cle === 'pluie') {
      c.strokeStyle = 'rgba(180,215,255,.6)'; c.lineWidth = 1.5;
      const al = graineHasard(Math.floor(t / 70));
      for (let i = 0; i < 70; i++) { const x = al() * W, y = al() * 280; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 4, y + 12); c.stroke(); }
    }
    if (jauge) jaugeDemo(c, 16, 14, jauge[0], jauge[1], jauge[2]);
    cartes.forEach((k, i) => carteDemo(c, cartesX(i), yC, k[0], k[1], k[2]));
    if (stand) cleDemo(c, stand[0], stand[1], stand[2]);
    if (mainA) mainDemo(c, mainA[0] + 6, mainA[1] + 6, mainA[2] ? 1 : 0);
  }

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const c = $('tuto-demo').getContext('2d');
    const j = ++tutoAnim;
    let id = 0;
    function image(t) {
      if (j !== tutoAnim) return;
      demoTuto(c, cle, t);
      id = requestAnimationFrame(image);
    }
    id = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(id);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  // Toucher une carte (1 à 6) ou le stand (0) : 1er toucher = aperçu, 2e = on roule.
  function toucherAction(a) {
    if (!partie || enPause || attenteTuto || !vue) return;
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (O.actions(vue, moi()).indexOf(a) < 0) { sons.non(); return; }
    if (choix === a) { valider(); return; }
    choix = a;
    sons.carte();
    majInterface();
  }

  function valider() {
    if (!partie || choix === null || !partie.monTour()) return;
    const a = choix;
    if (partie.jouer(a)) { choix = null; majInterface(); }
    else sons.non();
  }

  function deplacerChoix(sens) {
    if (!partie || !vue || !partie.monTour()) return;
    const acts = O.actions(vue, moi()).slice().sort((x, y) => (x || 9) - (y || 9));
    let i = acts.indexOf(choix);
    if (i < 0) i = sens > 0 ? -1 : acts.length;
    i = (i + sens + acts.length) % acts.length;
    choix = acts[i];
    sons.carte();
    majInterface();
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const chiffre = /^(Digit|Numpad)([1-6])$/.exec(ev.code);
    if (chiffre) { ev.preventDefault(); audio(); const v = +chiffre[2]; if (choix === v) valider(); else toucherAction(v); return; }
    if (ev.code === 'KeyS' || ev.code === 'Digit0' || ev.code === 'Numpad0') { ev.preventDefault(); audio(); toucherAction(0); return; }
    if (ev.code === 'ArrowLeft' || ev.code === 'ArrowDown') { ev.preventDefault(); audio(); deplacerChoix(-1); return; }
    if (ev.code === 'ArrowRight' || ev.code === 'ArrowUp') { ev.preventDefault(); audio(); deplacerChoix(1); return; }
    if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (choix === null) deplacerChoix(1); else valider();
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-garage').addEventListener('click', () => { audio(); sons.clic(); ouvrirGarage(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('gar-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-stand').addEventListener('click', () => { audio(); toucherAction(0); });
  $('btn-rouler').addEventListener('click', () => { audio(); valider(); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une course solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'titre') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  construireCartes();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
