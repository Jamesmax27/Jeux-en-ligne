      if (libre(b, x, y, 76, 28, 2)) poser(M, b, 'conteneur', x, y, { z: pile ? 48 : 24, val: pile ? 44 : 26, v: Math.floor(alea() * 6) });
    }
    semer(M, b, R, [['caisse', 4], ['tonneau', 3], ['chariot', 1], ['etal', 1], ['cone', 2]], 9, alea, 3);
  }

  function remplirEntrepot(M, b, R, alea) {
    const g = gabarit('entrepot', R.w - 30, R.h / 2 + 10, alea);
    if (g) poser(M, b, 'entrepot', R.x + R.w / 2, R.y + g[1] / 2 + 16, { w: g[0], h: g[1], z: g[2], v: Math.floor(alea() * 6) });
    if (alea() < 0.6) poser(M, b, 'camion', R.x + R.w / 2, R.y + R.h - 40, { v: Math.floor(alea() * 8) });
    semer(M, b, R, [['caisse', 5], ['tonneau', 3], ['chariot', 2], ['conteneur', 1], ['cone', 1]], 10, alea, 3);
  }

  function remplirFete(M, b, R, alea) {
    const cx = R.x + R.w / 2, cy = R.y + R.h / 2;
    b.deco.push({ cercle: true, x: cx, y: cy, r: R.w * 0.4, c: 'rgba(196,91,255,.18)' });
    if (alea() < 0.5) poser(M, b, 'manege', cx, cy, { v: Math.floor(alea() * 6) }); else poser(M, b, 'chapiteau', cx, cy);
    for (let k = 0; k < 6; k++) {
      const an = (k * TAU) / 6 + 0.4, rx = cx + Math.cos(an) * R.w * 0.38, ry = cy + Math.sin(an) * R.w * 0.38;
      if (libre(b, rx, ry, 40, 28, 4)) poser(M, b, 'stand', rx, ry, { v: k });
    }
    semer(M, b, R, [['ballons', 3], ['barbe', 2], ['parasol', 1], ['table', 2], ['lampadaire', 2], ['poubelle', 1]], 9, alea, 3);
    for (let k = 0; k < 4; k++) ajouterFlaneur(M, b, R, alea);
  }

  // Canal : bateaux amarrés le long des quais, bittes d'amarrage
  function remplirCanal(M, alea) {
    M.eaux.forEach((e) => {
      for (let x = e.x + 30; x < e.x + e.w - 30; x += 60 + alea() * 40) {
        if (alea() < 0.65) { const o = objet('bateau', x, e.y + 13, { v: Math.floor(alea() * 4) }); M.statiques.push(o); }
        if (alea() < 0.65) { const o = objet('bateau', x + 20, e.y + e.h - 13, { a: Math.PI, v: Math.floor(alea() * 4) }); M.statiques.push(o); }
      }
      for (let x = e.x + 10; x < e.x + e.w; x += 42) { M.statiques.push(objet('bitte', x, e.y - 4)); M.statiques.push(objet('bitte', x + 20, e.y + e.h + 4)); }
    });
  }
  // Mer, sous la dernière rue : cargos et bateaux amarrés, voiliers qui naviguent
  function remplirMer(M, alea) {
    for (let x = 30; x < M.W - 20; x += 46) M.statiques.push(objet('bitte', x, M.H - 5));
    for (let x = 120; x < M.W - 120; x += 240 + alea() * 120) {
      if (alea() < 0.55) M.statiques.push(objet('cargo', x, M.H + 32, { v: Math.floor(alea() * 3) }));
      else { M.statiques.push(objet('bateau', x - 30, M.H + 13, { v: Math.floor(alea() * 4) })); M.statiques.push(objet('bateau', x + 30, M.H + 13, { a: Math.PI, v: Math.floor(alea() * 4) })); }
    }
    for (let k = 0; k < 4; k++) {
      const o = objet('voilier', 80 + alea() * (M.W - 160), M.H + 110 + k * 50, { v: k, mobile: 'voile', dir: alea() < 0.5 ? 1 : -1, vit: 18 + alea() * 14 });
      o.a = o.dir > 0 ? 0 : Math.PI;
      M.mobiles.push(o);
    }
  }

  // --- Passants ---------------------------------------------------------------
  // Un passant fait le tour de son pâté de maisons, sur le trottoir.
  const RETRAIT = 12;
  function posTour(M, b, s) {
    const cote = M.BS - 2 * RETRAIT, per = cote * 4;
    s = ((s % per) + per) % per;
    const x0 = b.x0 + RETRAIT, y0 = b.y0 + RETRAIT;
    const k = Math.floor(s / cote), d = s - k * cote;
    if (k === 0) return [x0 + d, y0, 0];
    if (k === 1) return [x0 + cote, y0 + d, Math.PI / 2];
    if (k === 2) return [x0 + cote - d, y0 + cote, Math.PI];
    return [x0, y0 + cote - d, -Math.PI / 2];
  }
  function ajouterPieton(M, b, alea) {
    const s = alea() * (M.BS - 2 * RETRAIT) * 4;
    const p = posTour(M, b, s);
    const o = objet('pieton', p[0], p[1], { v: Math.floor(alea() * 48), mobile: 'tour', bloc: b, s, dir: alea() < 0.5 ? 1 : -1, vit: 16 + alea() * 10, pause: 0 });
    o.a = p[2] + (o.dir < 0 ? Math.PI : 0);
    M.mobiles.push(o);
    return o;
  }
  // Un flâneur se promène sur une place ou à la fête foraine
  function ajouterFlaneur(M, b, R, alea) {
    const o = objet('pieton', R.x + alea() * R.w, R.y + alea() * R.h, { v: Math.floor(alea() * 48), mobile: 'flane', zone: R, cx: 0, cy: 0, vit: 14 + alea() * 8, pause: 0 });
    o.cx = o.x; o.cy = o.y;
    M.mobiles.push(o);
  }

  // --- Voitures -----------------------------------------------------------------
  // Une voiture roule sur une voie (axe 'h' ou 'v', numéro de rue, sens ±1) et
  // choisit à chaque carrefour d'aller tout droit, à droite ou à gauche.
  const routeX = (M, i) => i * M.P + ROUTE / 2;
  function positionVoiture(M, o) {
    if (o.axe === 'h') { o.x = o.pos; o.y = routeX(M, o.idx) + o.sens * VOIE; }
    else { o.y = o.pos; o.x = routeX(M, o.idx) - o.sens * VOIE; }
  }
  function prochainCarrefour(M, o) {
    const n = o.axe === 'h' ? M.cols : M.rows;
    let k = o.sens > 0 ? 0 : n;
    if (o.sens > 0) { while (k <= n && routeX(M, k) - VOIE <= o.pos) k++; }
    else { while (k >= 0 && routeX(M, k) + VOIE >= o.pos) k--; }
    o.k = k; choisirDirection(M, o);
  }
  // Directions possibles au carrefour o.k
  function choisirDirection(M, o) {
    const nMax = o.axe === 'h' ? M.cols : M.rows, nAutre = o.axe === 'h' ? M.rows : M.cols;
    const choix = [];
    if (o.k + o.sens >= 0 && o.k + o.sens <= nMax) choix.push(['droit', 6]);
    // à droite : depuis 'h' sens s → 'v' sens s ; depuis 'v' sens s → 'h' sens −s
    const sD = o.axe === 'h' ? o.sens : -o.sens, sG = -sD;
    const existe = (s) => { const j = o.idx + s; return j >= 0 && j <= nAutre; };
    // sur l'autre axe, aller dans le sens s depuis la rue o.idx demande un tronçon vers o.idx + s
    if (existe(sD)) choix.push(['droite', 2]);
    if (existe(sG)) choix.push(['gauche', 2]);
    o.choix = choix.length ? choisirPoids(Math.random, choix) : 'demi';
  }
  function tourner(M, o, versDroite) {
    const sD = o.axe === 'h' ? o.sens : -o.sens;
    const nouveauSens = versDroite ? sD : -sD;
    const k = o.k;
    if (o.axe === 'h') { o.axe = 'v'; o.pos = o.y; } else { o.axe = 'h'; o.pos = o.x; }
    o.idx = k; o.sens = nouveauSens;
    positionVoiture(M, o); prochainCarrefour(M, o);
  }
  function angleVoiture(o) { return o.axe === 'h' ? (o.sens > 0 ? 0 : Math.PI) : (o.sens > 0 ? Math.PI / 2 : -Math.PI / 2); }
  function ajouterVoiture(M, alea, loinDe) {
    const types = [['voiture', 70], ['camionnette', 20]];
    if (M.O.grands) types.push(['bus', 8], ['camion', 8]);
    const type = choisirPoids(alea, types);
    for (let essai = 0; essai < 20; essai++) {
      const axe = alea() < 0.5 ? 'h' : 'v';
      const nb = axe === 'h' ? M.rows : M.cols;
      const long = axe === 'h' ? M.W : M.H;
      const o = objet(type, 0, 0, { v: Math.floor(alea() * 8), mobile: 'route', axe, idx: Math.floor(alea() * (nb + 1)), sens: alea() < 0.5 ? 1 : -1, pos: ROUTE + alea() * (long - 2 * ROUTE), attente: 0 });
      o.vit = { voiture: 72, camionnette: 64, bus: 50, camion: 54 }[type] * (0.9 + alea() * 0.2);
      o.vitCour = o.vit;
      positionVoiture(M, o);
      if (loinDe && Math.hypot(o.x - loinDe.x, o.y - loinDe.y) < loinDe.r) continue;
      if (M.voitures.some((v) => v.axe === o.axe && v.idx === o.idx && v.sens === o.sens && Math.abs(v.pos - o.pos) < 110)) continue;
      prochainCarrefour(M, o);
      o.a = angleVoiture(o); o.ac = o.a;
      M.mobiles.push(o); M.voitures.push(o);
      return o;
    }
    return null;
  }

  // Points des rues (départs, bonus, réapparitions)
  function pointRoute(M, alea) {
    alea = alea || Math.random;
    if (alea() < 0.5) return { x: ROUTE + alea() * (M.W - 2 * ROUTE), y: routeX(M, Math.floor(alea() * (M.rows + 1))) };
    for (let essai = 0; essai < 10; essai++) {
      const p = { x: routeX(M, Math.floor(alea() * (M.cols + 1))), y: ROUTE + alea() * (M.H - 2 * ROUTE) };
      if (!dansEau(M, p.x, p.y)) return p;
    }
    return { x: routeX(M, 0), y: routeX(M, 0) };
  }
  function dansEau(M, x, y) {
    for (const e of M.eaux) if (x > e.x && x < e.x + e.w && y > e.y && y < e.y + e.h) return true;
    return false;
  }
  // Un trou ne sort pas de la ville et ne va pas dans l'eau
  function bloque(M, x, y) { return x < 4 || y < 4 || x > M.W - 4 || y > M.H - 4 || dansEau(M, x, y); }
  // Distance entre un objet sur l'eau et la terre la plus proche (0 sur la terre)
  function rive(M, o) {
    if (o.y > M.H - 4) return o.y - (M.H - 4);
    for (const e of M.eaux) if (o.x > e.x && o.x < e.x + e.w && o.y > e.y && o.y < e.y + e.h) return Math.min(o.y - e.y, e.y + e.h - o.y, o.x - e.x, e.x + e.w - o.x);
    return 0;
  }

  // =========================================================================
  // LES TROUS NOIRS : création, robots, déplacements
  // =========================================================================
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  function parametresRobot(f, geant) {
    return {
      vit: 0.64 + 0.3 * f + (geant ? 0.03 : 0),   // part de la vitesse maximale
      periode: 1.1 - 0.78 * f,                    // secondes entre deux décisions
      vision: 240 + 520 * f,                      // distance à laquelle il voit
      agressif: 0.06 + 0.5 * f,                   // envie de croquer un trou plus petit
      prudence: 0.25 + 0.7 * f,                   // envie de fuir un trou plus gros
      erreur: 0.5 * (1 - f)                       // choix au hasard
    };
  }
  function creerTrou(M, def) {
    const h = Object.assign({
      x: 0, y: 0, vx: 0, vy: 0, masse: 0, score: 0, invul: 0, bouclier: 0, aimant: 0, turbo: 0,
      miam: 0, cligne: 0, clignT: rand(1, 4), rx: 0, ry: 1, sens: Math.random() < 0.5 ? 1 : -1,
      combo: 0, comboT: 0, rang: 1, cible: null, decT: Math.random(), bloqueT: 0, avales: 0, trousCroques: 0
    }, def);
    h.R = rayonDe(h.masse); h.Rv = h.R;
    M.trous.push(h);
    return h;
  }
  const vitesseMax = (h) => (160 + h.R * 0.5) * (h.turbo > 0 ? 1.55 : 1);

  // Gloups au départ (carrefour du milieu), les robots aux carrefours éloignés
  function placerTrous(M, tenue, auto, forceAuto) {
    const L = M.L, centre = { x: M.W / 2, y: M.H / 2 };
    const carrefours = [];
    for (let a = 0; a <= M.cols; a++) for (let b = 0; b <= M.rows; b++) {
      const p = { x: routeX(M, a), y: routeX(M, b) };
      if (!dansEau(M, p.x, p.y)) carrefours.push(p);
    }
    carrefours.sort((p, q) => dist(p, centre) - dist(q, centre));
    const pj = carrefours[0];
    const T = TENUE[tenue] || TENUES[0];
    M.joueur = creerTrou(M, { joueur: true, auto: !!auto, nom: 'toi', a: T.a, b: T.b, arc: T.arc, etoiles: T.etoiles, x: pj.x, y: pj.y, p: auto ? parametresRobot(forceAuto == null ? 0.55 : forceAuto) : null });
    const autres = carrefours.slice(1).sort((p, q) => dist(q, pj) - dist(p, pj));
    const pris = [pj];
    const n = L.bots + (L.geants || 0);
    for (let k = 0; k < n; k++) {
      const geant = k >= L.bots;
      const pos = autres.find((p) => pris.every((q) => dist(p, q) > M.P * 1.1)) || autres[k % autres.length];
      pris.push(pos);
      const def = geant ? GEANTS[k - L.bots] : ROBOTS[k];
      creerTrou(M, { robot: true, geant, nom: def.id, a: def.a, b: def.b, x: pos.x, y: pos.y, masse: geant ? 170 + 50 * (k - L.bots) : Math.floor(Math.random() * 5), p: parametresRobot(L.force, geant) });
    }
    M.classement = M.trous.slice();
  }

  // --- Décision d'un robot : fuir, croquer un trou, manger, se promener ------------
  function decider(M, h) {
    const P = h.p;
    let fx = 0, fy = 0, danger = false;
    if (M.O.rivaux && h.invul <= 0 && h.bouclier <= 0) {
      for (const o of M.trous) {
        if (o === h || o.R < h.R * 1.18) continue;
        const dx = h.x - o.x, dy = h.y - o.y, d = Math.hypot(dx, dy) || 1;
        const zone = o.R * 2.2 + 150 * P.prudence;
        if (d < zone) { const k = (zone - d) / zone; fx += (dx / d) * k; fy += (dy / d) * k; danger = true; }
      }
    }
    if (danger && Math.random() < 0.45 + P.prudence * 0.55) {
      const n = Math.hypot(fx, fy) || 1;
      let tx = h.x + (fx / n) * 280, ty = h.y + (fy / n) * 280;
      if (bloque(M, clamp(tx, 6, M.W - 6), clamp(ty, 6, M.H - 6))) { const z = tx - h.x; tx = h.x - (ty - h.y); ty = h.y + z; }
      h.cible = { point: { x: tx, y: ty }, fuite: true };
      return;
    }
    let best = null, bestS = 0;
    if (M.O.rivaux) for (const o of M.trous) {
      if (o === h || h.R < o.R * 1.22 || o.invul > 0 || o.bouclier > 0) continue;
      const d = dist(o, h);
      if (d > P.vision) continue;
      const s = ((o.masse * 0.5 + 10) / (d + 60)) * P.agressif * 2.2;
      if (s > bestS) { bestS = s; best = { trou: o }; }
    }
    const lim = 2 * h.R * 0.95, cand = [];
    parcourir(M, h.x, h.y, P.vision, (o) => {
      if (o.taille >= lim) return;
      const ri = (o.y > M.H - 4 || M.eaux.length) ? rive(M, o) : 0;
      if (ri && ri > h.R - o.taille * 0.3 - 2) return;
      const d = Math.hypot(o.x - h.x, o.y - h.y);
      let s = (o.val * (o.or ? 3 : 1)) / (d + 70);
      if (o.lourd) s *= 0.6;
      if (o.type === 'etoile') s *= 3;
      if (s > bestS) { bestS = s; best = { obj: o }; }
      if (cand.length < 40 && o.val >= 2) cand.push(o);
    });
    for (const b of M.bonus) {
      if (b.type === 'sablier') continue;
      const s = 28 / (dist(b, h) + 70);
      if (s > bestS) { bestS = s; best = { bonus: b }; }
    }
    if (Math.random() < P.erreur && cand.length) best = { obj: cand[Math.floor(Math.random() * cand.length)] };
    h.cible = best || { point: pointRoute(M) };
  }
  // Point visé par un robot (avec le passage par un pont pour traverser le canal)
  function viseeRobot(M, h) {
    const c = h.cible;
    let tx, ty;
    if (!c) return null;
    if (c.obj) { if (c.obj.mort) return null; tx = c.obj.x; ty = c.obj.y; }
    else if (c.trou) { const o = c.trou; if (o.invul > 0 || o.bouclier > 0 || h.R < o.R * 1.2) return null; tx = o.x + o.vx * 0.35; ty = o.y + o.vy * 0.35; }
    else if (c.bonus) { if (!M.bonus.includes(c.bonus)) return null; tx = c.bonus.x; ty = c.bonus.y; }
    else { tx = c.point.x; ty = c.point.y; if (Math.hypot(tx - h.x, ty - h.y) < 24) return null; }
    if (M.canal >= 0) {
      const e0 = ROUTE + M.canal * M.P, e1 = e0 + M.BS;
      const cote = (y) => (y < e0 ? -1 : y > e1 ? 1 : 0);
      const a = cote(h.y), b = cote(ty);
      if (a !== 0 && b !== 0 && a !== b) {
        const i = clamp(Math.round(((h.x + tx) / 2 - ROUTE / 2) / M.P), 0, M.cols), bx = routeX(M, i);
        if (Math.abs(h.x - bx) > 10) { tx = bx; ty = a < 0 ? e0 - 22 : e1 + 22; }
        else { tx = bx; ty = a < 0 ? e1 + 30 : e0 - 30; }
      }
    }
    return [clamp(tx, 6, M.W - 6), clamp(ty, 6, M.H - 6)];
  }

  function majTrou(M, h, dt, entree) {
    // direction voulue
    let dx = 0, dy = 0, mag = 0;
    if (h.auto || h.robot) {
      h.decT -= dt;
      let v = viseeRobot(M, h);
      if (!v || h.decT <= 0) { decider(M, h); h.decT = h.p.periode * (0.7 + Math.random() * 0.6); v = viseeRobot(M, h); }
      if (v) {
        dx = v[0] - h.x; dy = v[1] - h.y;
        const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
        mag = clamp(d / 40, 0.35, 1) * h.p.vit;
      }
    } else if (entree) { dx = entree.dx; dy = entree.dy; mag = entree.mag; }
    const vm = vitesseMax(h);
    const k = Math.min(1, dt * (h.joueur && !h.auto ? 9 : 6));
    h.vx += (dx * mag * vm - h.vx) * k; h.vy += (dy * mag * vm - h.vy) * k;
    const ax = h.x, ay = h.y;
    let nx = h.x + h.vx * dt;
    if (bloque(M, nx, h.y)) { nx = h.x; h.vx *= 0.3; }
    let ny = h.y + h.vy * dt;
    if (bloque(M, nx, ny)) { ny = h.y; h.vy *= 0.3; }
    h.x = nx; h.y = ny;
    // robot coincé : il change d'idée
    if (h.robot || h.auto) {
      if (mag > 0.2 && Math.hypot(h.x - ax, h.y - ay) < vm * dt * 0.15) { h.bloqueT += dt; if (h.bloqueT > 1) { h.cible = { point: pointRoute(M) }; h.bloqueT = 0; } }
      else h.bloqueT = 0;
    }
    // regard, clignements, minuteries
    const sp = Math.hypot(h.vx, h.vy);
    if (sp > 8) { h.rx = lerp(h.rx, h.vx / sp, Math.min(1, dt * 6)); h.ry = lerp(h.ry, h.vy / sp, Math.min(1, dt * 6)); }
    h.clignT -= dt; if (h.clignT <= 0) { h.cligne = 0.14; h.clignT = rand(2, 5); }
    h.cligne = Math.max(0, h.cligne - dt); h.miam = Math.max(0, h.miam - dt);
    h.invul = Math.max(0, h.invul - dt); h.bouclier = Math.max(0, h.bouclier - dt);
    h.aimant = Math.max(0, h.aimant - dt); h.turbo = Math.max(0, h.turbo - dt);
    h.comboT = Math.max(0, h.comboT - dt); if (h.comboT === 0) h.combo = 0;
    h.Rv = lerp(h.Rv, h.R, Math.min(1, dt * 5));
    if (h.turbo > 0 && sp > 40 && Math.random() < dt * 30) particule(M, h.x - h.vx * 0.05 + rand(-h.R, h.R) * 0.5, h.y - h.vy * 0.05 + rand(-h.R, h.R) * 0.5, -h.vx * 0.2, -h.vy * 0.2, 0.4, h.R * 0.12, h.b, 'trait');
  }

  // --- Avaler les objets -------------------------------------------------------
  const multCombo = (n) => (n >= 25 ? 3 : n >= 10 ? 2 : 1);
  function avalerObjets(M, h, dt) {
    const R = h.R, lim = 2 * R;
    parcourir(M, h.x, h.y, R + 110, (o) => {
      const dx = o.x - h.x, dy = o.y - h.y, d2 = dx * dx + dy * dy;
      const touche = R + o.taille * 0.5;
      if (d2 > touche * touche) return;
      if (o.taille >= lim * 0.97) {
        // trop gros : l'objet dépasse du trou et tremble
        o.tremble = Math.max(o.tremble, 0.25);
        if (h.joueur && !h.auto && !M.vuTropGros && d2 < R * R * 0.6) { M.vuTropGros = true; message(t('msg.tropGros'), 2.4); }
        return;
      }
      const l2 = R - o.taille * 0.3;
      if (l2 <= 0 || d2 > l2 * l2) return;
      if (o.lourd) {
        if (M.tau - (o.chargeT || 0) > 0.15) o.charge = 0;
        o.charge += dt; o.chargeT = M.tau; o.tremble = 0.3;
        if (h.joueur && Math.random() < dt * 8) SON.tremble();
        if (h.joueur && !h.auto && !M.vuLourd) { M.vuLourd = true; message(t('msg.lourd'), 2.4); }
        if (o.charge < 0.9) return;
      }
      avaler(M, h, o);
    });
  }
  function avaler(M, h, o) {
    o.mort = true;
    const gain = o.val * (o.or ? 3 : 1);
    h.masse += gain; h.avales++;
    let pts = gain;
    if (M.O.combo) {
      const avant = multCombo(h.combo);

    h.R = rayonDe(h.masse); h.miam = 0.22;
    M.tombes.push({ o, h, k: 0, dx: o.x - h.x, dy: o.y - h.y, rot: (Math.random() - 0.5) * 3 });
    if (o.type === 'etoile') { for (let i = 0; i < 18; i++) particule(M, o.x, o.y, rand(-90, 90), rand(-90, 90), 0.8, rand(2, 4), '#ffd45c', 'etincelle'); }
    if (h === M.joueur && !M.demo) {
      SON.gloup(o.taille); if (o.or || o.type === 'etoile') SON.or();
      // un seul compteur « +N » au-dessus de Gloups, qui s'additionne
      const tx = M.texteJoueur;
      if (tx && tx.vie > 0.5 && M.textes.includes(tx)) { tx.n += pts; tx.vie = 0.9; tx.or = tx.or || o.or || pts > gain; }
      else { M.texteJoueur = { suit: h, x: h.x, y: h.y, n: pts, vie: 0.9, or: o.or || pts > gain }; M.textes.push(M.texteJoueur); if (M.textes.length > 8) M.textes.shift(); }
      M.texteJoueur.txt = t('plus', { n: nombre(M.texteJoueur.n) });
    }
    for (let i = 0; i < 3; i++) particule(M, o.x, o.y, rand(-30, 30), rand(-30, 30), 0.35, rand(1.5, 3), '#ffffff', 'poussiere');
  }

  // --- Un trou nettement plus gros avale un trou plus petit --------------------
  function duels(M) {
    if (!M.O.rivaux) return;
    for (const a of M.trous) for (const b of M.trous) {
      if (a === b || b.invul > 0 || b.bouclier > 0 || a.R < b.R * 1.2) continue;
      if (dist(a, b) < a.R - b.R * 0.45) croquer(M, a, b);
    }
  }
  function croquer(M, a, b) {
    const gain = b.masse * 0.35 + 8;
    a.masse += gain; a.score += Math.round(gain); a.R = rayonDe(a.masse); a.miam = 0.5; a.trousCroques++;
    for (let i = 0; i < 26; i++) { const an = Math.random() * TAU; particule(M, b.x, b.y, Math.cos(an) * rand(40, 160), Math.sin(an) * rand(40, 160), 0.7, rand(2, 4.5), b.a, 'etincelle'); }
    b.masse *= 0.5; b.R = rayonDe(b.masse); b.Rv = b.R * 0.4; b.invul = 3.5; b.combo = 0; b.vx = 0; b.vy = 0; b.cible = null;
    // réapparition loin des trous plus gros
    let mieux = null, mieuxD = -1;
    for (let k = 0; k < 24; k++) {
      const p = pointRoute(M);
      let dmin = Infinity;
      for (const o of M.trous) if (o !== b && o.R > b.R) dmin = Math.min(dmin, dist(p, o) - o.R);
      if (dmin > mieuxD) { mieuxD = dmin; mieux = p; }
    }
    b.x = mieux.x; b.y = mieux.y;
    if (M.demo) return;
    if (b === M.joueur) { message(t('msg.avale', { nom: nomTrou(a) }), 2.8, 'danger'); SON.avale(); M.secousse = 0.45; }
    if (a === M.joueur) { message(t('msg.croque', { nom: nomTrou(b) }), 2.2, 'bonus'); SON.croque(); M.secousse = 0.25; }
  }
  function nomTrou(h) { return t('nom.' + h.nom); }

  // --- Bonus : aimant, turbo, bouclier, sablier ---------------------------------
  function bonusDispo(M) {
    const l = [];
    if (M.O.aimant) l.push('aimant');
    if (M.O.turbo) l.push('turbo');
    if (M.O.bouclier) l.push('bouclier');
    if (M.O.sablier) l.push('sablier');
    return l;
  }
  function majBonus(M, dt) {
    const dispo = bonusDispo(M);
    if (!dispo.length) return;
    M.bonusT = (M.bonusT == null ? 3 : M.bonusT) - dt;
    if (M.bonus.length < 3 && M.bonusT <= 0) {
      let type = dispo[Math.floor(Math.random() * dispo.length)];
      if (type === 'sablier' && (M.sabliers || 0) >= 2) type = dispo[0];
      if (type === 'sablier') M.sabliers = (M.sabliers || 0) + 1;
      const p = pointRoute(M);
      M.bonus.push({ type, x: p.x, y: p.y, tau: Math.random() * 6 });
      M.bonusT = rand(7, 11);
    }
    for (let k = M.bonus.length - 1; k >= 0; k--) {
      const b = M.bonus[k];
      b.tau += dt;
      for (const h of M.trous) {
        if (b.type === 'sablier' && h !== M.joueur) continue;
        if (dist(b, h) < h.R + 12) { prendreBonus(M, h, b.type); M.bonus.splice(k, 1); break; }
      }
    }
  }
  function prendreBonus(M, h, type) {
    if (type === 'aimant') h.aimant = 8;
    else if (type === 'turbo') h.turbo = 6;
    else if (type === 'bouclier') h.bouclier = 8;
    else if (type === 'sablier') M.temps += 10;
    for (let i = 0; i < 14; i++) { const an = Math.random() * TAU; particule(M, h.x, h.y, Math.cos(an) * 90, Math.sin(an) * 90, 0.6, 3, '#ffffff', 'etincelle'); }
    if (h === M.joueur && !M.demo) { SON.bonus(); message(t('msg.' + type), 2, 'bonus'); }
  }
  // Aimant : les petits objets proches glissent vers le trou
  function majAimant(M, h, dt) {
    const r = h.R * 2.6 + 70, lim = 2 * h.R * 0.9;
    const attires = [];
    parcourir(M, h.x, h.y, r, (o) => {
      if (o.taille >= lim || o.lourd || o.mobile === 'voile') return;
      const d = Math.hypot(o.x - h.x, o.y - h.y);
      if (d > r || d < 1) return;
      attires.push(o);
    });
    for (const o of attires) {
      if (!o.mobile) {
        // l'objet quitte la grille des objets fixes pour celle des objets mobiles
        const cel = M.grille[indiceCellule(M, o.x, o.y)];
        const j = cel.indexOf(o); if (j >= 0) cel.splice(j, 1);
        o.mobile = 'aspire'; M.mobiles.push(o);
      }
      if (o.mobile === 'aspire' || o.mobile === 'tour' || o.mobile === 'flane' || o.mobile === 'route') {
        const dx = h.x - o.x, dy = h.y - o.y, d = Math.hypot(dx, dy) || 1;
        const v = (150 + h.R) * dt;
        o.x += (dx / d) * Math.min(v, d); o.y += (dy / d) * Math.min(v, d);
        if (o.mobile !== 'aspire') { o.mobile = 'aspire'; }
      }
    }
  }

  // --- Objets qui bougent : passants, voitures, voiliers -------------------------
  const voies = new Map();
  function majMobiles(M, dt) {
    // véhicule de devant, voie par voie
    voies.forEach((l) => { l.length = 0; });
    for (const o of M.voitures) {
      if (o.mort || o.mobile !== 'route') continue;
      const cle = (o.axe === 'h' ? 0 : 5000) + o.idx * 2 + (o.sens > 0 ? 1 : 0);
      let l = voies.get(cle); if (!l) { l = []; voies.set(cle, l); }
      l.push(o);
    }
    voies.forEach((l) => {
      l.sort((p, q) => (p.pos - q.pos) * p.sens);
      for (let k = 0; k < l.length; k++) l[k].devant = l[k + 1] || null;
    });
    for (const o of M.mobiles) {
      if (o.mort) continue;
      if (o.mobile === 'route') majVoiture(M, o, dt);
      else if (o.mobile === 'tour') majPieton(M, o, dt);
      else if (o.mobile === 'flane') majFlaneur(M, o, dt);
      else if (o.mobile === 'voile') {
        o.x += o.dir * o.vit * dt;
        if ((o.x < 70 && o.dir < 0) || (o.x > M.W - 70 && o.dir > 0)) o.dir *= -1;
        o.a = lerp(o.a, o.dir > 0 ? 0 : Math.PI, Math.min(1, dt * 1.5));
      }
    }
  }
  function majVoiture(M, o, dt) {
    let v = o.vit;
    const dv = o.devant;
    if (dv && !dv.mort && dv.mobile === 'route') {
      const ecart = (dv.pos - o.pos) * o.sens - (dv.w + o.w) / 2;
      if (ecart < 10) v = 0; else if (ecart < 40) v = Math.min(v, (dv.vitCour != null ? dv.vitCour : dv.vit) + 10);
    }
    if (v < 1) { o.attente += dt; if (o.attente > 2.2) v = o.vit; } else o.attente = 0;
    o.vitCour = v;
    o.pos += o.sens * v * dt;
    const xk = routeX(M, o.k), p1 = xk - o.sens * VOIE, p2 = xk + o.sens * VOIE;
    if (o.choix === 'droite' && (o.pos - p1) * o.sens >= 0) { o.pos = p1; positionVoiture(M, o); tourner(M, o, true); }
    else if (o.choix === 'gauche' && (o.pos - p2) * o.sens >= 0) { o.pos = p2; positionVoiture(M, o); tourner(M, o, false); }
    else if (o.choix === 'droit' && (o.pos - p2) * o.sens > 0) { o.k += o.sens; choisirDirection(M, o); }
    else if (o.choix === 'demi' && (o.pos - p1) * o.sens >= 0) { o.sens = -o.sens; prochainCarrefour(M, o); }
    positionVoiture(M, o);
    // virage en douceur
    const cible = angleVoiture(o);
    let d = cible - o.a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
    o.a += d * Math.min(1, dt * 9);
  }
  function menaceProche(M, o, portee) {
    for (const h of M.trous) {
      if (o.taille >= 2 * h.R * 0.97) continue;
      const d = Math.hypot(o.x - h.x, o.y - h.y);
      if (d < h.R + portee) return h;
    }
    return null;
  }
  function majPieton(M, o, dt) {
    let v = o.vit;
    if (M.O.fuite) {
      o.peurT = (o.peurT || 0) - dt;
      if (o.peurT <= 0) { o.peurT = 0.25; o.menace = menaceProche(M, o, 90); }
      if (o.menace) {
        v *= 2.8; o.pause = 0;
        const p1 = posTour(M, o.bloc, o.s + 4), p2 = posTour(M, o.bloc, o.s - 4);
        o.dir = Math.hypot(p1[0] - o.menace.x, p1[1] - o.menace.y) > Math.hypot(p2[0] - o.menace.x, p2[1] - o.menace.y) ? 1 : -1;
      }
    }
    if (o.pause > 0) { o.pause -= dt; return; }
    if (Math.random() < dt * 0.06) { o.pause = rand(0.8, 2.2); if (Math.random() < 0.3) o.dir = -o.dir; }
    o.s += o.dir * v * dt;

    o.pas = (o.pas || 0) + dt * v;
  }
  function majFlaneur(M, o, dt) {
    let v = o.vit;
    if (M.O.fuite) {
      o.peurT = (o.peurT || 0) - dt;
      if (o.peurT <= 0) { o.peurT = 0.25; const h = menaceProche(M, o, 90); if (h) { const z = o.zone; const dx = o.x - h.x, dy = o.y - h.y, d = Math.hypot(dx, dy) || 1; o.cx = clamp(o.x + (dx / d) * 80, z.x, z.x + z.w); o.cy = clamp(o.y + (dy / d) * 80, z.y, z.y + z.h); o.court = 0.6; o.pause = 0; } }
      if (o.court > 0) { o.court -= dt; v *= 2.6; }
    }
    if (o.pause > 0) { o.pause -= dt; return; }
    const dx = o.cx - o.x, dy = o.cy - o.y, d = Math.hypot(dx, dy);
    if (d < 4) { const z = o.zone; o.cx = z.x + Math.random() * z.w; o.cy = z.y + Math.random() * z.h; o.pause = rand(0.5, 2.5); return; }
    o.x += (dx / d) * v * dt; o.y += (dy / d) * v * dt; o.a = Math.atan2(dy, dx);
    o.pas = (o.pas || 0) + dt * v;
  }
  // La ville reste vivante : de nouveaux passants et de nouvelles voitures
  // arrivent loin de Gloups quand il en manque.
  function repeupler(M) {
    const j = M.joueur, loin = { x: j.x, y: j.y, r: 520 + j.R * 4 };
    M.mobiles = M.mobiles.filter((o) => !o.mort);
    M.voitures = M.voitures.filter((o) => !o.mort && o.mobile === 'route');
    let pietons = 0; M.mobiles.forEach((o) => { if (o.type === 'pieton' && o.mobile !== 'aspire') pietons++; });
    if (pietons < M.pietonsDepart * 0.6) {
      for (let k = 0; k < 2; k++) {
        const blocs = M.blocs.filter((b) => b.type !== 'eau' && Math.hypot(b.x0 + M.BS / 2 - j.x, b.y0 + M.BS / 2 - j.y) > loin.r);
        if (blocs.length) ajouterPieton(M, blocs[Math.floor(Math.random() * blocs.length)], Math.random);
      }
    }
    if (M.O.voitures && M.voitures.length < M.voituresDepart * 0.65) ajouterVoiture(M, Math.random, loin);
  }

  // --- Étoiles filantes (pluie d'étoiles, à partir du niveau 17) -------------------
  function majPluie(M, dt) {
    if (!M.O.pluie) return;
    M.pluieT = (M.pluieT == null ? 8 : M.pluieT) - dt;
    if (M.pluieT <= 0 && !M.etoileFilante) {
      M.pluieT = rand(12, 17);
      let p = null;
      for (let k = 0; k < 20 && !p; k++) { const q = { x: rand(80, M.W - 80), y: rand(80, M.H - 80) }; if (!dansEau(M, q.x, q.y)) p = q; }
      if (p) { M.etoileFilante = { x: p.x, y: p.y, k: 0 }; if (!M.demo) { SON.filante(); if (!M.vuEtoile) { M.vuEtoile = true; message(t('msg.etoile'), 2.4, 'bonus'); } } }
    }
    const e = M.etoileFilante;
    if (e) {
      e.k += dt / 1.6;
      if (e.k >= 1) {
        const o = objet('etoile', e.x, e.y); inserer(M, o); M.etoiles = (M.etoiles || []).filter((x) => !x.mort); M.etoiles.push(o);
        for (let i = 0; i < 22; i++) { const an = Math.random() * TAU; particule(M, e.x, e.y, Math.cos(an) * 110, Math.sin(an) * 110, 0.7, rand(2, 4), '#ffd45c', 'etincelle'); }
        M.etoileFilante = null; M.secousse = Math.max(M.secousse || 0, 0.15);
      }
    }
  }

  // --- Particules ---------------------------------------------------------------
  function particule(M, x, y, vx, vy, vie, taille, couleur, type) {
    if (M.particules.length > 320) M.particules.shift();
    M.particules.push({ x, y, vx, vy, vie, max: vie, taille, couleur, type });
  }

  // --- Un pas de la partie ---------------------------------------------------------
  function majMonde(M, dt, entree) {
    M.tau += dt; M.ecoule += dt;
    majMobiles(M, dt);
    for (const h of M.trous) majTrou(M, h, dt, h === M.joueur ? entree : null);
    for (const h of M.trous) if (h.aimant > 0) majAimant(M, h, dt);
    reconstruireMobiles(M);
    for (const h of M.trous) avalerObjets(M, h, dt);
    duels(M);
    majBonus(M, dt);
    majPluie(M, dt);
    // objets qui tombent dans les trous
    for (let k = M.tombes.length - 1; k >= 0; k--) { const f = M.tombes[k]; f.k += dt / 0.42; if (f.k >= 1) M.tombes.splice(k, 1); }
    // objets qui tremblent
    M.tremblent = (M.tremblent || 0) + dt;
    // particules et textes
    for (let k = M.particules.length - 1; k >= 0; k--) {
      const p = M.particules[k]; p.vie -= dt;
      if (p.vie <= 0) { M.particules.splice(k, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - dt * 2; p.vy *= 1 - dt * 2;
    }
    for (let k = M.textes.length - 1; k >= 0; k--) { const x = M.textes[k]; x.vie -= dt; if (x.vie <= 0) M.textes.splice(k, 1); }

    if (M.repT > 1.5) { M.repT = 0; repeupler(M); nettoyerGrille(M); }
    // classement par taille
    M.classT = (M.classT || 0) - dt;
    if (M.classT <= 0) {
      M.classT = 0.25;
      M.classement = M.trous.slice().sort((a, b) => b.masse - a.masse || b.score - a.score);
      M.classement.forEach((h, k) => { h.rang = k + 1; });
    }
  }

  // =========================================================================
  // RENDU
  // =========================================================================
  const cv = $('scene'), ctx = cv.getContext('2d');
  let LW = 390, LH = 844, DPR = 1, qualite = 1;
  function redimensionner() {
    LW = window.innerWidth || 390; LH = window.innerHeight || 844;
    DPR = Math.max(0.75, Math.min(window.devicePixelRatio || 1, 2) * qualite);
    cv.width = Math.round(LW * DPR); cv.height = Math.round(LH * DPR);
  }
  redimensionner();
  window.addEventListener('resize', () => { redimensionner(); if (mode === 'intro') dessinerIntroImage(); });

  let M = null;              // ville affichée (démo de l'écran titre ou niveau)
  let mode = 'titre';        // titre, menu, intro, jeu, pause, fin
  let apercu = 0;            // 1, 2 ou 3 : image du jeu figée pour sa page (window.JEL_APERCU), sinon 0
  const cam = { x: 0, y: 0, z: 1 };
  function zoomCible() {
    const m = Math.min(LW, LH);
    if (M.demo) return m / 300;
    return clamp(m / (M.joueur.Rv * 7 + 170), 0.1, 4.5);
  }
  function majCamera(dt, instant) {
    const j = M.joueur, k = instant ? 1 : Math.min(1, dt * 6);
    cam.x = lerp(cam.x, j.x, k); cam.y = lerp(cam.y, j.y, k);
    cam.z = lerp(cam.z, zoomCible(), instant ? 1 : Math.min(1, dt * 2.2));
  }

  // Taches de lumière (nuit) dessinées une fois
  function tache(c0, c1) {
    const t2 = document.createElement('canvas'); t2.width = t2.height = 64;
    const c = t2.getContext('2d'); const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, c0); g.addColorStop(0.55, c0.replace(/[\d.]+\)$/, '0.55)')); g.addColorStop(1, c1);
    c.fillStyle = g; c.fillRect(0, 0, 64, 64); return t2;
  }
  const TACHE = tache('rgba(0,0,0,1)', 'rgba(0,0,0,0)');
  const TACHE_CHAUDE = tache('rgba(255,214,130,0.9)', 'rgba(255,214,130,0)');
  let nuitCv = null, nuitCtx = null;

  // --- Sol de la ville : rues, trottoirs, pelouses, eau ----------------------------
  function dessinerSol(c, x0, y0, x1, y1, zoom) {
    const S = M.Q.sol, BS = M.BS;
    if (M.mer) {
      const g = c.createLinearGradient(0, M.H, 0, M.H + 500);
      g.addColorStop(0, '#3aa3e0'); g.addColorStop(1, '#1d5f9c');
      c.fillStyle = g; c.fillRect(-3000, M.H - 2, M.W + 6000, 3000);
      c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 2; c.beginPath();
      for (let y = M.H + 40; y < Math.min(M.H + 700, y1 + 40); y += 46) {
        for (let x = Math.max(-200, Math.floor(x0 / 90) * 90); x < Math.min(M.W + 200, x1 + 90); x += 90) {
          const d = ((y / 46) % 2) * 45 + Math.sin(M.tau * 1.2 + y) * 8;
          c.moveTo(x + d, y); c.quadraticCurveTo(x + d + 12, y - 5, x + d + 24, y);
        }
      }
      c.stroke();
    }
    c.fillStyle = S.route; c.fillRect(0, 0, M.W, M.H);
    c.strokeStyle = mix(S.route, '#000000', 0.25); c.lineWidth = 3; c.strokeRect(0, 0, M.W, M.H);
    for (const b of M.blocs) {
      if (b.x0 > x1 || b.x0 + BS < x0 || b.y0 > y1 || b.y0 + BS < y0) continue;
      if (b.type === 'eau') {
        c.fillStyle = '#3c9fdc'; c.fillRect(b.x0, b.y0, BS, BS);
        c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 2; c.beginPath();
        for (let y = b.y0 + 30; y < b.y0 + BS - 10; y += 34) for (let x = b.x0 + 14; x < b.x0 + BS - 30; x += 64) {
          const d = ((y / 34) % 2) * 30 + Math.sin(M.tau * 1.4 + x * 0.1) * 6;
          c.moveTo(x + d, y); c.quadraticCurveTo(x + d + 10, y - 4, x + d + 20, y);
        }
        c.stroke();
        c.strokeStyle = '#8a7f70'; c.lineWidth = 4; c.strokeRect(b.x0, b.y0, BS, BS);
        continue;
      }

      c.fillStyle = b.sol === 'herbe' ? S.herbe : b.sol === 'place' ? S.place : SOLS[b.sol] || S.place;
      c.fillRect(b.x0 + TROTTOIR, b.y0 + TROTTOIR, BS - 2 * TROTTOIR, BS - 2 * TROTTOIR);

        else { c.fillStyle = d.c; c.fillRect(d.x, d.y, d.w, d.h); }

  // =========================================================================
  // COMMANDES : doigt (manette qui suit le doigt), souris, clavier

  const touches = new Set();

  const entree = { dx: 0, dy: 0, mag: 0 };

  // =========================================================================
  // BOUCLE PRINCIPALE
  // =========================================================================
  let dernierTemps = performance.now(), moyenne = 16, lentT = 0, rapideT = 0, erreurVue = false;
  function majFin(dt) {
    M.tau += dt;
    for (let k = M.particules.length - 1; k >= 0; k--) { const p = M.particules[k]; p.vie -= dt; if (p.vie <= 0) { M.particules.splice(k, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - dt * 2; p.vy *= 1 - dt * 2; }
    for (let k = M.tombes.length - 1; k >= 0; k--) { const f = M.tombes[k]; f.k += dt / 0.42; if (f.k >= 1) M.tombes.splice(k, 1); }
    for (const h of M.trous) { h.Rv = lerp(h.Rv, h.R, Math.min(1, dt * 5)); h.miam = Math.max(0, h.miam - dt); }
    for (let k = M.textes.length - 1; k >= 0; k--) { M.textes[k].vie -= dt; if (M.textes[k].vie <= 0) M.textes.splice(k, 1); }
    M.secousse = Math.max(0, (M.secousse || 0) - dt);
  }
  function boucle(now) {

    if (!(dt > 0)) dt = 0.016;

    try {
      if (mode === 'jeu') { majMonde(M, dt, calculEntree()); majPartie(dt); }
      else if ((mode === 'titre' || mode === 'menu') && M.demo) { majMonde(M, dt, null); M.demoT += dt; if (M.demoT > 80 || M.joueur.R > 60) creerDemo(); }
      else if (mode === 'fin' || mode === 'pause' || mode === 'intro' || mode === 'menu') majFin(mode === 'pause' ? 0 : dt);
      majCamera(dt);
      dessiner(dt);
      if (mode === 'intro') dessinerIntro(now);
      // qualité d'image adaptée à la vitesse de l'appareil
      if (mode === 'jeu') {
        moyenne = moyenne * 0.95 + dt * 1000 * 0.05;
        if (moyenne > 25) { lentT += dt; rapideT = 0; } else if (moyenne < 15) { rapideT += dt; lentT = 0; } else { lentT = 0; rapideT = 0; }
        if (lentT > 1.5 && qualite > 0.55) { qualite -= 0.15; redimensionner(); lentT = 0; }
        if (rapideT > 6 && qualite < 1) { qualite = Math.min(1, qualite + 0.15); redimensionner(); rapideT = 0; }
      }
    } catch (e) {
      if (!erreurVue) { erreurVue = true; setTimeout(() => { throw e; }); }
    }
    requestAnimationFrame(boucle);
  }
  // =========================================================================
  // AFFICHE (jaquette du jeu)
  // Avec window.JEL_AFFICHE (posé par le robot du site, jamais par le jeu) : une
  // scène composée, sans interface ni texte, d'où sort la jaquette
  // (CONSIGNES-JEU.md, section 5). Gloups, en grand et couronné, aspire le
  // carrefour : un bus et des voitures glissent vers lui, des objets tombent en
  // tourbillon dans son trou, Mandarine, plus petite, le regarde de loin.
  // Repère de 600 × 800 (k = échelle), le décor de la ville continue jusqu'aux bords.
  // =========================================================================
  function dessinerAffiche() {
    redimensionner();
    const c = ctx, W = LW, H = LH;
    const k = Math.min(W / 600, H / 800);
    const ox = (W - 600 * k) / 2, oy = (H - 800 * k) / 2;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.fillStyle = '#79c95a'; c.fillRect(0, 0, W, H);
    c.setTransform(DPR * k, 0, 0, DPR * k, DPR * ox, DPR * oy);
    const X0 = -ox / k - 2, X1 = (W - ox) / k + 2, Y0 = -oy / k - 2, Y1 = (H - oy) / k + 2;
    const S = QUARTIERS[0].sol, E = 1.7;                 // E : échelle des objets (unités du monde → repère)
    const GX = 300, GY = 400, GR = 158;                   // Gloups : centre et rayon
    const P = 560, RW = 110, TR = 30;                     // pas des rues, largeur d'une rue, trottoir
    // Un objet de la ville, dessiné par le jeu, à l'échelle e
    const obj = (type, x, y, e, extra) => {
      const o = objet(type, 0, 0, extra);
      c.save(); c.translate(x, y); c.scale(e, e); if (o.a) c.rotate(o.a);
      try { TYPES[type].d(c, o); } catch (er) { /* rien */ }
      c.restore();
      return o;
    };

    c.globalAlpha = 1;
    g = c.createRadialGradient(GX, GY, 0, GX, GY, GR * 0.93);
    g.addColorStop(0, 'rgba(0,0,0,.8)'); g.addColorStop(0.5, 'rgba(0,0,0,.15)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(GX - GR, GY - GR, 2 * GR, 2 * GR);
    c.restore();
    // contour lumineux du trou
    c.save(); c.shadowColor = '#7fe0ff'; c.shadowBlur = 26;
    c.strokeStyle = 'rgba(214,240,255,.95)'; c.lineWidth = 5; c.beginPath(); c.arc(GX, GY, GR * 1.01, Math.PI * 0.95, Math.PI * 1.85); c.stroke();
    c.strokeStyle = 'rgba(200,180,255,.7)'; c.lineWidth = 3; c.beginPath(); c.arc(GX, GY, GR * 1.01, Math.PI * 1.95, Math.PI * 2.75); c.stroke();
    c.restore();
    // --- Ce qui glisse vers Gloups : le bus, des voitures, un passant ---
    obj('bus', 512, 420, E, { a: Math.PI - 0.32, v: 0 });

  function cacherPourAffiche() {
    for (const el of document.querySelectorAll('.ecran, #hud, #message, #astuce, button, .jel-langue, jel-langue')) el.style.setProperty('display', 'none', 'important');
  }
  function demarrerAffiche() {
    cacherPourAffiche();
    [50, 300, 900].forEach((d) => setTimeout(cacherPourAffiche, d));
    dessinerAffiche();
    window.addEventListener('resize', dessinerAffiche);
  }

  // =========================================================================
  // IMAGES DU JEU (page du jeu)
  // Avec window.JEL_APERCU = 1, 2 ou 3 (posé par le robot du site, jamais par le
  // jeu) : le jeu s'ouvre directement en pleine partie, avec sa vraie barre du
  // haut (temps, score, rang, taille), ses flèches et sa mini-carte, sans écran
  // titre, ni fenêtre « Continuer », ni carte du niveau (CONSIGNES-JEU.md,
  // section 5). La partie tourne un instant (Gloups mange), puis elle est figée
  // sans fenêtre de pause : ni victoire, ni défaite, ni son, ni sauvegarde.
  //   1 = niveau 1, les jardins : Gloups encore petit avale cônes et passants ;
  //   2 = niveau 9, le centre-ville : aimant, objets lourds, bus, trous rivaux ;
  //   3 = niveau 20, la ville la nuit : fête foraine, canal, géant, étoile filante.
  // =========================================================================
  const SCENES_APERCU = {
    1: { niveau: 0, masse: 120, score: 128, temps: 58, secondes: 2.2, rivauxApres: [[0, 30, 120, 150]] },
    2: { niveau: 8, masse: 760, score: 420, temps: 66, secondes: 1.6, aimant: 6, bonus: [['turbo', -150, -200]],
      rivaux: [[0, 1150, 300, 230], [1, 260, -220, 30], [2, 420, 40, 360]] },
    3: { niveau: 19, masse: 1900, score: 660, temps: 47, secondes: 1.4, bouclier: 5, bonus: [['sablier', 170, 230]],
      rivaux: [[6, 3600, -170, -390], [0, 600, 250, 160]], filante: [120, -250, 0.72], regard: true }
  };
  function ouvrirApercu(numero) {
    apercu = numero;
    const sc = SCENES_APERCU[numero];
    // Hasard fixe : la même image à chaque capture.
    let graine = 7654321 + numero * 7919;
    Math.random = () => { graine = (graine + 0x6D2B79F5) | 0; let x = Math.imul(graine ^ (graine >>> 15), 1 | graine); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };

    M = creerMonde(niv, false);
    placerTrous(M, 'nuit', false);
    const j = M.joueur;
    j.masse = sc.masse; j.score = sc.score; j.R = rayonDe(j.masse); j.Rv = j.R; j.avales = Math.round(sc.score / 6);
    // rivaux près de Gloups : [numéro du trou, masse, décalage x, décalage y]
    const robots = M.trous.filter((h) => h !== j);
    (sc.rivaux || []).forEach(([n, masse, dx, dy]) => {
      const h = robots[n]; if (!h) return;
      h.masse = masse; h.R = rayonDe(masse); h.Rv = h.R; h.score = Math.round(masse * 0.8);
      const x = clamp(j.x + dx, 20, M.W - 20), y = clamp(j.y + dy, 20, M.H - 20);
      if (!bloque(M, x, y)) { h.x = x; h.y = y; }
    });
    if (sc.aimant) j.aimant = sc.aimant;
    if (sc.bouclier) j.bouclier = sc.bouclier;
    (sc.bonus || []).forEach(([type, dx, dy]) => M.bonus.push({ type, x: j.x + dx, y: j.y + dy, tau: 0.5 }));
    M.bonusT = 30; M.pluieT = 30;
    if (sc.filante) M.etoileFilante = { x: j.x + sc.filante[0], y: j.y + sc.filante[1], k: sc.filante[2] };
    M.temps = sc.temps;
    // Gloups mange un instant tout seul (il garde son vrai rendu de joueur)
    j.auto = true; j.p = parametresRobot(0.8);
    mode = 'jeu'; montrer(null);
    viderSprites(); majCamera(0, true);
    const pas = Math.round(sc.secondes * 60);
    for (let n = 0; n < pas; n++) { majMonde(M, 1 / 60, null); majCamera(1 / 60); }
    if (sc.filante && !M.etoileFilante) M.etoileFilante = { x: j.x + sc.filante[0], y: j.y + sc.filante[1], k: sc.filante[2] };

    (sc.rivauxApres || []).forEach(([n, masse, dx, dy]) => {

    $('hud').classList.add('actif'); majHUD(true);
    hudBas = $('hud').getBoundingClientRect().bottom || 50;

  const numeroApercu = Number(window.JEL_APERCU);

})();
