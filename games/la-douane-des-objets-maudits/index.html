<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });

    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>
  /* =====================================================================
     La Douane des Objets Maudits — styles

     objets ; les écrans (titre, nuits, registre, pause, fins) sont du HTML
     posé par-dessus.
     ===================================================================== */

    touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { min-height: 48px; min-width: 48px; padding: 10px 18px; border-radius: 14px; border: 2px solid #8c7a55;
    background: linear-gradient(#3a3324, #2a2519); color: #f6ecd2; font-weight: 700; font-size: 17px;
    box-shadow: 0 3px 0 #120f09; transition: transform .08s; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #120f09; }

  /* Barre du haut pendant la nuit */
  #hud { position: fixed; left: 0; right: 0; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px;

  .gros-score { font-size: 34px; font-weight: 900; color: #fff; margin: 4px 0; }
  .record { color: #ffd27a; font-weight: 800; }

<script>

  const I = window.JEL_I18N;

  // ---------------------------------------------------------------------
  const COULEURS = { rouge: '#c63a4b', bleu: '#3f72d6', vert: '#3ea35e', dore: '#e0b44a' };

  const TYPES = {
    poupee:     { mat: 'porcelaine', couleurs: TOUTES, visage: 'peint',  depuis: 1 },
    tasse:      { mat: 'porcelaine', couleurs: TOUTES, visage: null,     depuis: 1 },

  // Signes : yeux, ombre, tache, reflet, lampe (change sous la lampe), bruit (caisse)

    { n: 20, vit: 5.6, inter: 1.6, maudit: 0.45, signes: S6, leurres: 0.3, caisses: 0.15, rafales: 0.3, emballe: true },
    { n: 18, vit: 5.8, inter: 1.8, maudit: 0.45, signes: S6, pannes: 2, nouveau: 'panne' },

      const a1 = t * 0.6, a2 = t * 4;
      c.beginPath(); c.moveTo(0, 0.05 * s); c.lineTo(Math.cos(a1) * 0.12 * s, 0.05 * s + Math.sin(a1) * 0.12 * s); c.stroke();
      c.lineWidth = s * 0.012;
      c.beginPath(); c.moveTo(0, 0.05 * s); c.lineTo(Math.cos(a2) * 0.18 * s, 0.05 * s + Math.sin(a2) * 0.18 * s); c.stroke();
    },
    cle({ c, s, col }) {
      c.save(); c.rotate(0.6);
      c.fillStyle = col;
      c.fillRect(-0.04 * s, -0.12 * s, 0.08 * s, 0.56 * s);
      c.fillRect(0.0, 0.3 * s, 0.14 * s, 0.05 * s); c.fillRect(0.0, 0.38 * s, 0.1 * s, 0.05 * s);
      c.restore();
      c.fillStyle = col; ellipse(c, -0.12 * s, -0.22 * s, 0.17 * s, 0.17 * s); c.fill();
      c.fillStyle = sombre(col, 0.45); ellipse(c, -0.12 * s, -0.22 * s, 0.07 * s, 0.07 * s); c.fill();
      c.fillStyle = clair(col, 0.4); for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; ellipse(c, -0.12 * s + Math.cos(a) * 0.13 * s, -0.22 * s + Math.sin(a) * 0.13 * s, 0.02 * s, 0.02 * s); c.fill(); }
    },
    boite({ c, s, col, t }) {
      c.fillStyle = sombre(col, 0.3); c.beginPath(); c.moveTo(-0.32 * s, -0.06 * s); c.lineTo(-0.26 * s, -0.3 * s); c.lineTo(0.26 * s, -0.3 * s); c.lineTo(0.32 * s, -0.06 * s); c.fill();
      c.fillStyle = '#c99a4c'; c.fillRect(-0.32 * s, -0.08 * s, 0.64 * s, 0.04 * s);
      c.fillStyle = col; c.fillRect(-0.32 * s, -0.04 * s, 0.64 * s, 0.42 * s);
      c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(-0.3 * s, -0.02 * s, 0.6 * s, 0.06 * s);
      c.fillStyle = '#c99a4c';
      for (const [xx, yy] of [[-0.32, -0.04], [0.26, -0.04], [-0.32, 0.32], [0.26, 0.32]]) c.fillRect(xx * s, yy * s, 0.06 * s, 0.06 * s);
      c.strokeStyle = '#c99a4c'; c.lineWidth = s * 0.03;
      c.beginPath(); c.moveTo(0.32 * s, 0.16 * s); c.lineTo(0.4 * s, 0.16 * s); c.lineTo(0.4 * s + Math.cos(t * 2) * 0.05 * s, 0.16 * s + Math.sin(t * 2) * 0.05 * s); c.stroke();
      c.fillStyle = '#f0d9e6'; ellipse(c, 0, -0.38 * s, 0.03 * s, 0.03 * s); c.fill();
      c.beginPath(); c.moveTo(0, -0.36 * s); c.lineTo(-0.06 * s, -0.27 * s); c.lineTo(0.06 * s, -0.27 * s); c.fill();
    },
    caisse({ c, s, t, o }) {
      const bois = '#8f683c';
      c.fillStyle = '#3a2614'; c.fillRect(-0.34 * s, -0.32 * s, 0.68 * s, 0.74 * s);
      for (let k = 0; k < 4; k++) {
        const y = -0.32 * s + k * 0.19 * s;
        const g = c.createLinearGradient(0, y, 0, y + 0.15 * s); g.addColorStop(0, '#a77b48'); g.addColorStop(1, bois);
        c.fillStyle = g; c.fillRect(-0.34 * s, y, 0.68 * s, 0.15 * s);
      }
      c.strokeStyle = '#5e4222'; c.lineWidth = s * 0.05;
      c.beginPath(); c.moveTo(-0.3 * s, -0.28 * s); c.lineTo(0.3 * s, 0.38 * s); c.stroke();
      c.fillStyle = '#5e4222'; c.fillRect(-0.36 * s, -0.34 * s, 0.07 * s, 0.78 * s); c.fillRect(0.29 * s, -0.34 * s, 0.07 * s, 0.78 * s);
      c.fillStyle = '#2b2b2b'; for (const [xx, yy] of [[-0.325, -0.28], [0.325, -0.28], [-0.325, 0.36], [0.325, 0.36]]) { ellipse(c, xx * s, yy * s, 0.015 * s, 0.015 * s); c.fill(); }
      // Caisse secouée : regard rouge entre les planches (maudite)
      if (o.revele > 0 && o.signe === 'bruit') {
        const a = Math.min(1, o.revele * 1.5);
        c.save(); c.globalAlpha = a; c.shadowColor = '#ff2020'; c.shadowBlur = s * 0.15; c.fillStyle = '#ff3a2a';
        const yy = -0.32 * s + 0.15 * s + 0.02 * s;
        ellipse(c, -0.1 * s, yy, 0.05 * s, 0.018 * s); c.fill(); ellipse(c, 0.1 * s, yy, 0.05 * s, 0.018 * s); c.fill();
        c.restore();
        c.strokeStyle = 'rgba(30,10,10,' + (0.7 * a) + ')'; c.lineWidth = s * 0.015;
        for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo((0.05 + k * 0.05) * s, 0.12 * s); c.lineTo((0.12 + k * 0.05) * s, 0.28 * s); c.stroke(); }
      }
    },
  };

  // Objet réveillé : l'objet sur des pattes d'araignée, les yeux rouges
  function dessinerRampant(c, r, s, t) {
    c.save(); c.translate(r.x, r.y);
    c.fillStyle = 'rgba(200,20,40,.18)'; ellipse(c, 0, s * 0.35, s * 0.6, s * 0.18); c.fill();
    c.strokeStyle = '#140a10'; c.lineWidth = s * 0.05; c.lineCap = 'round';
    for (let k = 0; k < 6; k++) {
      const cote = k < 3 ? -1 : 1, i = k % 3;
      const pas = Math.sin(t * 14 + k * 2.1 + r.ph) * 0.12;
      const hx = cote * s * 0.22, hy = s * (0.05 + i * 0.12);
      const gx = cote * s * (0.5 + i * 0.06), gy = hy - s * (0.22 - pas * 0.5);
      const px = cote * s * (0.62 + i * 0.05), py = s * (0.38 + i * 0.05) + pas * s * 0.2;
      c.beginPath(); c.moveTo(hx, hy); c.lineTo(gx, gy); c.lineTo(px, py); c.stroke();
    }
    c.lineCap = 'butt';
    c.rotate(Math.sin(t * 8 + r.ph) * 0.12);
    dessinerObjet(c, { type: r.type, couleur: r.couleur, ph: r.ph, mut: 1, signe: 'yeux' }, 0, 0, s * 0.85, { t, ombre: false });
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Partie
  // ---------------------------------------------------------------------
  let etat = 'titre'; // titre | niveaux | registre | jeu
  let J = null;
  let enPause = false, tutoOuvert = false;
  let apercu = 0;     // 1, 2 ou 3 : image du jeu préparée pour sa page (window.JEL_APERCU)
  let temps = 0, secousse = 0, affScore = 0, minuteToast = 0;
  let torche = { x: 0, y: 0, vu: -10 };
  const particules = [], popups = [];
  let compteur = 0;

  function toast(texte, classe, duree) {
    const el = $('toast'); el.textContent = texte; el.className = 'visible' + (classe ? ' ' + classe : ''); minuteToast = duree || 1.6;
  }
  function montrer(id) {
    for (const el of document.querySelectorAll('.ecran')) el.hidden = el.id !== id;
  }

  function creerPartie(i, demo) {
    const cfg = NIVEAUX[i];
    const duree = cfg.n * cfg.inter + cfg.vit;
    const pannes = [];
    for (let k = 0; k < (cfg.pannes || 0); k++) pannes.push(duree * (k + 1) / ((cfg.pannes || 0) + 1) + (rnd() - 0.5) * 2);
    const ordres = [];
    for (let k = 0; k < (cfg.ordres || 0); k++) ordres.push(Math.floor(cfg.n * k / cfg.ordres));
    return {
      idx: i, cfg, demo: !!demo, objets: [], rampants: [], spawnT: 0.6, spawned: 0, traites: 0, erreurs: 0, bougies: 3,
      score: 0, serie: 0, serieMax: 0, t: 0, tapisOff: 0, fini: false, miroir: i >= 3, regle: null, ordres, attenteRadio: 0,
      pannes, panne: 0, panneT: 0, emb: { prochain: 7 + rnd() * 4, alerte: 0, actif: 0 }, cageSec: 0, etagereSec: 0,
      cage: [], sursaut: 0, rampFait: false, vitesseBase: (L.fin - L.debut) / cfg.vit, chasses: 0, tutoFile: [],
    };
  }

  function typesNuit(i) { return Object.keys(TYPES).filter((k) => TYPES[k].depuis <= i + 1); }
  function correspond(o, r) { return r.attr === 'couleur' ? o.couleur === r.val : o.mat === r.val; }
  function attendu(o) { const r = J.regle; if (r && correspond(o, r)) return r.cote; return o.maudit ? 'd' : 'g'; }

  function nouvelObjet() {
    const cfg = J.cfg;
    let type = (cfg.caisses && rnd() < cfg.caisses) ? 'caisse' : pick(typesNuit(J.idx));
    // L'ordre du patron doit vraiment servir : un objet sur trois le concerne
    if (J.regle && rnd() < 0.35) {
      if (J.regle.attr === 'matiere') type = pick(Object.keys(TYPES).filter((k) => TYPES[k].mat === J.regle.val && (TYPES[k].depuis <= J.idx + 1 || k === 'caisse')));
      else if (type === 'caisse') type = pick(typesNuit(J.idx));
    }
    const def = TYPES[type];
    let couleur = def.couleurs.length ? pick(def.couleurs) : null;
    if (J.regle && J.regle.attr === 'couleur' && couleur && rnd() < 0.35) couleur = J.regle.val;
    const maudit = rnd() < cfg.maudit;
    let signe = null, leurre = null;
    if (type === 'caisse') signe = maudit ? 'bruit' : null;
    else if (maudit) signe = pick(cfg.signes);
    else if (cfg.leurres && rnd() < cfg.leurres) leurre = def.visage ? 'fausseTache' : pick(['fauxYeux', 'fausseTache']);
    return { id: ++compteur, type, couleur, mat: def.mat, maudit, signe, leurre, y: L.debut - L.os * 0.55, ph: rnd() * 6.28, mut: 0, secoue: 0, revele: 0, vol: null };
  }

  function devant() {
    let m = null;
    for (const o of J.objets) if (!o.vol && (!m || o.y > m.y)) m = o;
    return m;
  }

  function annoncerOrdre(premier) {
    const attrs = [['couleur', TOUTES], ['matiere', ['porcelaine', 'bois', 'metal', 'tissu']]];
    let r;
    do {
      const [attr, vals] = pick(attrs);
      r = { attr, val: pick(vals), cote: rnd() < 0.7 ? 'd' : 'g' };
    } while (J.regle && J.regle.attr === r.attr && J.regle.val === r.val);
    J.regle = r;
    const chose = T('chose.' + r.val);
    const texte = T(premier ? 'radio.ordre.' + r.cote : 'radio.change.' + r.cote, { chose });
    $('radio-texte').textContent = J.cfg.brouille ? texte + ' ' + T('radio.brouille') : texte;
    $('radio').classList.toggle('brouille', !!J.cfg.brouille);
    $('radio').hidden = false;
    J.radioT = 4.2;
    $('rappel').hidden = true;
    $('rappel').textContent = T('rappel.' + r.cote, { chose });
    J.attenteRadio = premier ? 1.4 : 2.2;
    SON.radio();
    prog.vus.patron = true;
  }

  function lancerNiveau(i) {
    i = clamp(i, 0, NB_NIVEAUX - 1);
    J = creerPartie(i, false);
    etat = 'jeu'; enPause = false;
    montrer(null);
    $('hud').hidden = false; $('radio').hidden = true; $('rappel').hidden = true;
    particules.length = 0; popups.length = 0; affScore = 0;
    majHud();
    if (apercu) return;
    // Tutoriels : le geste de base, puis la nouveauté de la nuit
    if (!prog.tutos.base) J.tutoFile.push('base');
    if (J.cfg.nouveau && J.cfg.nouveau !== 'base' && !prog.tutos[J.cfg.nouveau]) J.tutoFile.push(J.cfg.nouveau);
    suiteTutos();
  }
  function suiteTutos() {
    if (!J || !J.tutoFile.length) return;
    ouvrirTuto(J.tutoFile.shift(), suiteTutos);
  }

  // --- Tri -------------------------------------------------------------
  function trier(dir) {
    if (!J || J.demo || J.fini || enPause || tutoOuvert) return;
    const o = devant();
    if (!o) return;
    premierGeste = true;
    const att = attendu(o);
    const cible = dir === 'g' ? { x: L.gx, y: L.by } : { x: L.dx, y: L.by };
    o.vol = { dir, t: 0, x0: L.cx, y0: o.y, x1: cible.x, y1: cible.y, att };
    SON.glisse();
    noterVu(o);
    if (dir === att) {
      J.serie++; J.serieMax = Math.max(J.serieMax, J.serie);
      let pts = 100 + 20 * Math.min(J.serie - 1, 10);
      if (o.signe === 'lampe' || o.signe === 'bruit') pts += 30;
      J.score += pts;
      popups.push({ x: cible.x, y: cible.y - L.binH * 0.55, txt: T('plus', { n: NB(pts) }), t: 0, col: '#ffe39a' });
      if (dir === 'd' && o.maudit && o.signe) prog.cages[o.signe] = (prog.cages[o.signe] || 0) + 1;
      if (dir === 'g' && o.leurre) prog.cages[o.leurre] = (prog.cages[o.leurre] || 0) + 1;
      SON.bon();
    } else {
      J.erreurs++; J.serie = 0;
      SON.erreur();
      if (att === 'd') toast(T('toast.rate'), 'rouge');
      else toast(T(o.leurre ? 'toast.leurre' : 'toast.fausseAlerte'), 'rouge');
    }
    J.traites++;
    majHud();
  }
  function noterVu(o) {
    if (o.signe) prog.vus[o.signe] = true;
    if (o.leurre) prog.vus[o.leurre] = true;
  }
  function arriveeBac(o) {
    const v = o.vol;
    if (v.dir === 'd') {
      J.cageSec = 0.45; SON.cage();
      if (o.maudit) { setTimeout(() => SON.cri(), 90); J.cage.push(o); if (J.cage.length > 4) J.cage.shift(); }
      for (let k = 0; k < 10; k++) particules.push({ x: L.dx, y: L.by, vx: (rnd() - 0.5) * 220, vy: -rnd() * 200, vie: 0.6, max: 0.6, col: o.maudit ? '#b03ad8' : '#cfc4b0', r: 3 + rnd() * 3 });
    } else {
      J.etagereSec = 0.3; SON.pose();
      for (let k = 0; k < 8; k++) particules.push({ x: L.gx, y: L.by + L.binH * 0.3, vx: (rnd() - 0.5) * 160, vy: -rnd() * 90, vie: 0.5, max: 0.5, col: '#b6a88f', r: 2 + rnd() * 3 });
      if (v.att === 'd') reveiller(o, L.gx, L.by + L.binH * 0.2, 5.2);
    }
  }
  function tombeDuTapis(o) {
    noterVu(o);
    J.traites++; J.erreurs++; J.serie = 0;
    if (attendu(o) === 'd') { toast(T('toast.passe'), 'rouge'); reveiller(o, L.cx, L.fin, 3.6); }
    else { toast(T('toast.oubli'), 'rouge'); SON.erreur(); }
    majHud();
  }
  function reveiller(o, x, y, duree) {
    const d = Math.hypot(L.cx - x, L.poste - y);
    J.rampants.push({ x, y, type: o.type === 'caisse' ? 'boite' : o.type, couleur: o.couleur || 'rouge', ph: rnd() * 6, pv: effetSel(), v: d / duree * effetLent(), recul: 0, flash: 0 });
    SON.reveil();
    secousse = Math.max(secousse, 0.25);
    for (let k = 0; k < 14; k++) particules.push({ x, y, vx: (rnd() - 0.5) * 200, vy: (rnd() - 0.7) * 200, vie: 0.8, max: 0.8, col: '#5a1a6a', r: 4 + rnd() * 5 });
    if (!prog.tutos.sel && !J.rampFait && !apercu) { J.rampFait = true; ouvrirTuto('sel'); }
  }
  function secouer(o) {
    if (!o || o.type !== 'caisse' || o.vol || !J || J.fini || enPause || tutoOuvert) return;
    premierGeste = true;
    o.secoue = 0.6; o.revele = 2.4;
    if (o.signe === 'bruit') { SON.grogne(); prog.vus.bruit = true; }
    else {
      SON.cliquetis();
      for (let k = 0; k < 10; k++) particules.push({ x: L.cx + (rnd() - 0.5) * L.os * 0.6, y: o.y + L.os * 0.3, vx: (rnd() - 0.5) * 90, vy: -rnd() * 60, vie: 0.9, max: 0.9, col: '#c9b48e', r: 2 + rnd() * 3 });
    }
  }
  function frapper(r) {
    if (!J || J.fini || enPause || tutoOuvert) return;
    premierGeste = true;
    r.pv--; r.recul = 0.22; r.flash = 0.15;
    SON.sel();
    for (let k = 0; k < 16; k++) particules.push({ x: r.x, y: r.y, vx: (rnd() - 0.5) * 300, vy: (rnd() - 0.8) * 260, vie: 0.5, max: 0.5, col: '#f4f6ff', r: 2 + rnd() * 2 });
    if (r.pv <= 0) {
      J.rampants.splice(J.rampants.indexOf(r), 1);
      J.score += 50; J.chasses++;
      popups.push({ x: r.x, y: r.y - L.os * 0.5, txt: T('plus', { n: NB(50) }), t: 0, col: '#d8f3ff' });
      SON.chasse();
      for (let k = 0; k < 20; k++) particules.push({ x: r.x, y: r.y, vx: (rnd() - 0.5) * 160, vy: -rnd() * 160, vie: 1, max: 1, col: '#3b1a4a', r: 5 + rnd() * 6 });
      majHud();
    }
  }
  function selClavier() {
    if (!J || !J.rampants.length) return;
    let m = null;
    for (const r of J.rampants) if (!m || Math.hypot(r.x - L.cx, r.y - L.poste) < Math.hypot(m.x - L.cx, m.y - L.poste)) m = r;
    frapper(m);
  }

  // --- Mise à jour -------------------------------------------------------
  function maj(dt) {
    temps += dt;
    if (secousse > 0) secousse = Math.max(0, secousse - dt);
    if (!(J && J.fige)) for (let k = particules.length - 1; k >= 0; k--) {
      const p = particules[k]; p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
      if (p.vie <= 0) particules.splice(k, 1);
    }
    for (let k = popups.length - 1; k >= 0; k--) { popups[k].t += dt; if (popups[k].t > 1) popups.splice(k, 1); }
    if (minuteToast > 0) { minuteToast -= dt; if (minuteToast <= 0) $('toast').classList.remove('visible'); }
    if (!J || J.fige) return;
    if (J.radioT > 0) {
      J.radioT -= dt;
      if (J.radioT <= 0) { $('radio').hidden = true; if (!J.cfg.brouille && J.regle) $('rappel').hidden = false; }
    }
    if (J.cageSec > 0) J.cageSec -= dt;
    if (J.etagereSec > 0) J.etagereSec -= dt;
    if (J.sursaut > 0) J.sursaut -= dt;
    if (J.fini) return; // nuit terminée : le tapis s'arrête derrière l'écran de fin
    J.t += dt;
    const cfg = J.cfg;

    // Coupures de courant
    if (J.panne > 0) {
      J.panne -= dt;
      if (J.panne <= 0) { toast(T('toast.retour'), 'vert'); SON.bzz(); }
    } else if (J.pannes.length && J.t >= J.pannes[0]) {
      J.pannes.shift(); J.panne = 7.5; SON.panne(); toast(T('toast.panne'), 'rouge', 2);
    }
    // Tapis qui s'emballe
    let fEmb = 1;
    if (cfg.emballe) {
      const e = J.emb;
      if (e.actif > 0) { e.actif -= dt; fEmb = 1.75; }
      else if (e.alerte > 0) { e.alerte -= dt; if (e.alerte <= 0) e.actif = 2.2; }
      else { e.prochain -= dt; if (e.prochain <= 0) { e.alerte = 0.9; e.prochain = 8 + rnd() * 5; SON.moteur(); if (!J.demo) toast(T('toast.emballe'), '', 1.2); } }
    }
    const fProg = J.demo ? 1 : 1 + 0.35 * Math.min(1, J.spawned / cfg.n);
    const v = J.vitesseBase * fProg * fEmb * (J.demo ? 0.8 : 1);
    J.tapisOff += v * dt;

    // Ordres du patron
    if (J.attenteRadio > 0) J.attenteRadio -= dt;
    if (!J.demo && J.ordres.length && J.spawned >= J.ordres[0] && J.attenteRadio <= 0) {
      J.ordres.shift(); annoncerOrdre(!J.regle);
    }
    // Arrivée des objets
    J.spawnT -= dt;
    const dernier = J.objets.length ? J.objets[J.objets.length - 1] : null;
    const place = !dernier || dernier.vol || dernier.y > L.debut + L.os * 0.55;
    if (J.spawnT <= 0 && place && J.attenteRadio <= 0 && (J.demo || J.spawned < cfg.n)) {
      J.objets.push(nouvelObjet()); J.spawned++;
      const rafale = cfg.rafales && rnd() < cfg.rafales;
      J.spawnT = cfg.inter * (rafale ? 0.32 : 0.85 + rnd() * 0.3) / fProg;
    }
    // Lampe : un objet « qui change » se transforme dans la lumière
    const rT = rayonTorche();
    for (let k = J.objets.length - 1; k >= 0; k--) {
      const o = J.objets[k];
      if (o.secoue > 0) o.secoue -= dt;
      if (o.revele > 0) o.revele -= dt;
      if (o.vol) {
        o.vol.t += dt / 0.34;
        if (o.vol.t >= 1) { J.objets.splice(k, 1); if (!J.demo) arriveeBac(o); }
        continue;
      }
      o.y += v * dt;
      if (o.signe === 'lampe') {
        const eclaire = J.panne > 0 ? Math.hypot(torche.x - L.cx, torche.y - o.y) < rT * 0.85 : Math.abs(o.y - L.lampY) < L.zone * effetZone();
        o.mut = clamp(o.mut + (eclaire ? dt * 5 : -dt * 4), 0, 1);
      }
      if (J.demo && o === devant() && o.y > L.lampY + L.os * 0.25) {
        const dir = o.maudit ? 'd' : 'g';
        o.vol = { dir, t: 0, x0: L.cx, y0: o.y, x1: dir === 'g' ? L.gx : L.dx, y1: L.by, att: dir };
        if (dir === 'd') J.cageSec = 0.4;
        continue;
      }
      if (o.y >= L.fin) { J.objets.splice(k, 1); if (!J.demo) tombeDuTapis(o); }
    }
    // Torche : vise le doigt ou la souris, sinon l'objet le plus avancé
    const d = devant();
    if (temps - torche.vu > 1.2 && d) { torche.x = lerp(torche.x, L.cx, Math.min(1, dt * 6)); torche.y = lerp(torche.y, d.y, Math.min(1, dt * 6)); }
    // Objets réveillés
    for (let k = J.rampants.length - 1; k >= 0; k--) {
      const r = J.rampants[k];
      if (r.flash > 0) r.flash -= dt;
      const dx = L.cx - r.x, dy = L.poste - r.y, dist = Math.hypot(dx, dy);
      if (r.recul > 0) { r.recul -= dt; r.x -= dx / dist * 120 * dt; r.y -= dy / dist * 120 * dt; }
      else { r.x += dx / dist * r.v * dt; r.y += dy / dist * r.v * dt; }
      if (Math.floor((temps + r.ph) * 3) !== Math.floor((temps + r.ph - dt) * 3)) SON.gratte();
      if (dist < L.os * 0.35) {
        J.rampants.splice(k, 1);
        J.bougies--; J.sursaut = 0.8; J.sursautType = r; secousse = 0.6;
        SON.sursaut();
        majHud();
        if (J.bougies <= 0) { defaite(); return; }
      }
    }
    // Fin de la nuit
    if (!J.demo && !J.fini && J.spawned >= cfg.n && !J.objets.length && !J.rampants.length) victoire();
  }
  function rayonTorche() { return L.os * 1.25 * effetTorche(); }

  // --- Fins de nuit ------------------------------------------------------
  function calculerEtoiles() { return J.erreurs === 0 ? 3 : (J.erreurs <= 2 ? 2 : 1); }
  function victoire() {
    J.fini = true;
    const i = J.idx;
    const et = calculerEtoiles();
    const avant = totalEtoiles();
    const ancienRecord = prog.records[i] || 0;
    const record = J.score > ancienRecord;
    prog.etoiles[i] = Math.max(prog.etoiles[i] || 0, et);
    prog.records[i] = Math.max(ancienRecord, J.score);
    prog.debloque = Math.max(prog.debloque, Math.min(NB_NIVEAUX, i + 2));
    ecrireLocal();
    JEL_SAVE.save(JEU, donneesSauvegarde(Math.min(NB_NIVEAUX, i + 2)));
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
    if (prog.etoiles.filter((x) => x > 0).length >= NB_NIVEAUX) {
      if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NB_NIVEAUX * 3 });
    }
    const nouvelle = LAMPES.find((l) => l.seuil > avant && l.seuil <= totalEtoiles());
    $('hud').hidden = true; $('radio').hidden = true; $('rappel').hidden = true;
    setTimeout(() => {
      montrer('ecran-victoire');
      $('vic-titre').textContent = T('victoireTitre', { n: NB(i + 1) });
      const boite = $('vic-etoiles'); boite.innerHTML = '';
      for (let k = 0; k < 3; k++) {
        const e = etoileSvg(k < et); e.style.animationDelay = (0.25 + k * 0.28) + 's'; boite.appendChild(e);
        if (k < et) setTimeout(() => SON.etoile(k), 250 + k * 280);
      }
      compterScore($('vic-score'), J.score);
      $('vic-detail').textContent = T('victoireDetail', { e: NB(J.erreurs), s: NB(J.serieMax), c: NB(J.chasses) });
      $('vic-record').textContent = record ? T('nouveauRecord') : T('record', { n: NB(prog.records[i]) });
      $('vic-lampe').textContent = nouvelle ? T('lampeDebloquee', { nom: T('lampe.' + nouvelle.id) }) : '';
      $('b-suivant').textContent = i + 1 >= NB_NIVEAUX ? T('bilan') : T('suivant');
      SON.victoire(); confettis();
    }, 700);
  }
  function defaite() {
    J.fini = true;
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: J.idx + 1 });
    $('hud').hidden = true; $('radio').hidden = true; $('rappel').hidden = true;
    setTimeout(() => {
      montrer('ecran-defaite');
      $('def-texte').textContent = T('defaiteTexte', { n: NB(J.traites), total: NB(J.cfg.n) });
      compterScore($('def-score'), J.score);
      $('def-record').textContent = T('record', { n: NB(prog.records[J.idx] || 0) });
      SON.defaite();
    }, 900);
  }
  function compterScore(el, cible) {
    const debut = performance.now();
    const pas = () => {
      const k = Math.min(1, (performance.now() - debut) / 900);
      el.textContent = T('scoreFin', { n: NB(Math.round(cible * (1 - Math.pow(1 - k, 3)))) });
      if (k < 1) requestAnimationFrame(pas);
    };
    pas();
  }
  function confettis() {
    for (let k = 0; k < 70; k++) particules.push({ x: W / 2 + (rnd() - 0.5) * W * 0.6, y: H * 0.3, vx: (rnd() - 0.5) * 420, vy: -rnd() * 420, vie: 1.8, max: 1.8, col: pick(['#ffd27a', '#ff7a5c', '#8fe0a8', '#c9a2ff', '#fff3d6']), r: 3 + rnd() * 3, carre: true });
  }
  function etoileSvg(pleine) {
    const ns = 'http://www.w3.org/2000/svg';
    const e = document.createElementNS(ns, 'svg'); e.setAttribute('viewBox', '0 0 24 24');
    e.setAttribute('class', pleine ? 'pleine' : 'vide');
    const p = document.createElementNS(ns, 'path');
    p.setAttribute('d', 'M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z');
    p.setAttribute('fill', pleine ? '#ffd24a' : '#776c5a'); p.setAttribute('stroke', '#5a3a08'); p.setAttribute('stroke-width', '1');
    e.appendChild(p); return e;
  }

  // ---------------------------------------------------------------------
  //  Rendu de la scène
  // ---------------------------------------------------------------------
  function dessiner() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (secousse > 0) ctx.translate((rnd() - 0.5) * 14 * secousse * L.s, (rnd() - 0.5) * 14 * secousse * L.s);
    if (fondCv) ctx.drawImage(fondCv, 0, 0, W, H);
    const s = L.s;
    const panne = J && J.panne > 0;
    const lum = lampe().lumiere;
    dessinerBougies();
    // Repères de direction de chaque côté du tapis (chevrons, sans texte)
    for (const sens of [-1, 1]) {
      const x = L.cx + sens * (L.tapisL / 2 + 16 * s + (sens < 0 && J && J.miroir ? L.miroirW + 8 * s : 0));
      ctx.fillStyle = sens < 0 ? 'rgba(120,230,150,.35)' : 'rgba(255,90,80,.35)';
      for (let k = 0; k < 2; k++) {
        const xx = x + sens * (k * 13 * s + ((temps * 20) % 13) * s);
        ctx.beginPath(); ctx.moveTo(xx, L.lampY - 12 * s); ctx.lineTo(xx + sens * 10 * s, L.lampY); ctx.lineTo(xx, L.lampY + 12 * s); ctx.lineTo(xx + sens * 4 * s, L.lampY); ctx.fill();
      }
    }
    dessinerEtagere(); dessinerCage();
    dessinerTapis();
    if (J && J.miroir) dessinerMiroir();
    // Cône de la lampe d'inspection
    if (!panne) {
      const flick = 0.9 + Math.sin(temps * 31) * 0.04 + (Math.sin(temps * 3.1) > 0.97 ? -0.25 : 0);
      ctx.save(); ctx.globalAlpha = 0.28 * flick;
      const g = ctx.createLinearGradient(L.lx, L.ly, L.cx, L.lampY);
      g.addColorStop(0, lum); g.addColorStop(1, 'rgba(255,220,150,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(L.lx - 14 * s, L.ly); ctx.lineTo(L.lx + 14 * s, L.ly);
      ctx.lineTo(L.cx + L.tapisL * 0.9, L.lampY + L.zone); ctx.lineTo(L.cx - L.tapisL * 0.9, L.lampY - L.zone * 0.4); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 0.35 * flick;
      const g2 = ctx.createRadialGradient(L.cx, L.lampY, 4, L.cx, L.lampY, L.tapisL * 1.1);
      g2.addColorStop(0, lum); g2.addColorStop(1, 'rgba(255,220,150,0)');
      ctx.fillStyle = g2; ellipse(ctx, L.cx, L.lampY, L.tapisL * 1.1, L.zone * 1.3 * effetZone()); ctx.fill();
      ctx.restore();
    }
    // Objets
    if (J) {
      const d = devant();
      const liste = J.objets.slice().sort((a, b) => a.y - b.y);
      for (const o of liste) {
        if (o.vol) {
          const e = Math.min(1, o.vol.t), k = 1 - Math.pow(1 - e, 2);
          const x = lerp(o.vol.x0, o.vol.x1, k), y = lerp(o.vol.y0, o.vol.y1, k) - Math.sin(e * Math.PI) * L.os * 0.6;
          ctx.save(); ctx.translate(x, y); ctx.rotate((o.vol.dir === 'g' ? -1 : 1) * e * 0.8); ctx.scale(1 - 0.4 * e, 1 - 0.4 * e);
          dessinerObjet(ctx, o, 0, 0, L.os, { t: temps, ombre: false }); ctx.restore();
          continue;
        }
        if (o === d && !J.demo) {
          ctx.save(); ctx.strokeStyle = 'rgba(255,240,200,' + (0.45 + Math.sin(temps * 6) * 0.2) + ')'; ctx.lineWidth = 2.5 * s; ctx.setLineDash([7 * s, 5 * s]);
          ellipse(ctx, L.cx, o.y, L.os * 0.58, L.os * 0.6); ctx.stroke(); ctx.restore();
        }
        dessinerObjet(ctx, o, L.cx, o.y, L.os, { t: temps });
        if (o.type === 'caisse' && o === d && !J.demo && o.revele <= 0) { // petit signe « secoue-moi »
          ctx.save(); ctx.globalAlpha = 0.6 + Math.sin(temps * 5) * 0.3; ctx.strokeStyle = '#ffe3a6'; ctx.lineWidth = 2 * s;
          for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(L.cx + sx * L.os * 0.5, o.y - L.os * 0.1, 7 * s, sx < 0 ? 2 : -1.1, sx < 0 ? 4.2 : 1.1); ctx.stroke(); }
          ctx.restore();
        }
      }
    }
    // Lampe suspendue
    dessinerLampe(panne);
    // Pénombre autour de la zone éclairée
    const vg = ctx.createRadialGradient(L.cx, L.lampY, L.tapisL * 0.6, L.cx, L.lampY, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(5,6,14,0)'); vg.addColorStop(1, 'rgba(5,6,14,.5)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    // Objets réveillés
    if (J) for (const r of J.rampants) {
      dessinerRampant(ctx, r, L.os * 0.8, temps);
      if (r.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + r.flash * 4 + ')'; ellipse(ctx, r.x, r.y, L.os * 0.5, L.os * 0.4); ctx.fill(); }
    }
    // Panne : le noir, sauf la lampe torche et la veilleuse rouge de secours
    if (panne) dessinerNoir();
    // Particules et points
    for (const p of particules) {
      ctx.globalAlpha = Math.max(0, p.vie / p.max); ctx.fillStyle = p.col;
      if (p.carre) ctx.fillRect(p.x, p.y, p.r * 1.6, p.r); else { ellipse(ctx, p.x, p.y, p.r, p.r); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      ctx.globalAlpha = 1 - p.t; ctx.fillStyle = p.col; ctx.font = '800 ' + Math.round(20 * s + 4) + 'px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(p.txt, p.x, p.y - p.t * 40 * s);
    }
    ctx.globalAlpha = 1;
    // Voyant du tapis qui s'emballe
    if (J && J.cfg.emballe && (J.emb.alerte > 0 || J.emb.actif > 0)) {
      ctx.fillStyle = 'rgba(255,140,40,' + (0.5 + Math.sin(temps * 20) * 0.5) + ')';
      ellipse(ctx, L.cx - L.tapisL * 0.42, L.debut - 14 * s, 8 * s, 8 * s); ctx.fill(); ellipse(ctx, L.cx + L.tapisL * 0.42, L.debut - 14 * s, 8 * s, 8 * s); ctx.fill();
    }
    ctx.restore();
    // Sursaut : l'objet bondit sur le poste
    if (J && J.sursaut > 0 && J.sursautType) {
      const k = J.sursaut / 0.8;
      ctx.fillStyle = 'rgba(120,0,10,' + (0.55 * k) + ')'; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.globalAlpha = Math.min(1, k * 1.6);
      const taille = Math.min(W, H) * (0.55 + (1 - k) * 0.25);
      dessinerRampant(ctx, { x: W / 2, y: H * 0.45, type: J.sursautType.type, couleur: J.sursautType.couleur, ph: 0 }, taille, temps);
      ctx.restore();
    }
  }
  function dessinerBougies() {
    if (!J || J.demo) return;
    const s = L.s, by = L.fin + 26 * s;
    for (let k = 0; k < 3; k++) {
      const x = L.cx + 60 * s + k * 18 * s, y = by + 10 * s;
      ctx.fillStyle = '#efe6cf'; ctx.fillRect(x - 4 * s, y - 22 * s, 8 * s, 22 * s);
      ctx.fillStyle = '#6a5a3a'; ctx.fillRect(x - 6 * s, y, 12 * s, 3 * s);
      if (k < J.bougies) {
        const f = 1 + Math.sin(temps * 11 + k) * 0.15;
        ctx.fillStyle = 'rgba(255,190,80,.3)'; ellipse(ctx, x, y - 28 * s, 10 * s, 12 * s * f); ctx.fill();
        ctx.fillStyle = '#ffd36b'; ellipse(ctx, x, y - 27 * s, 3 * s, 6 * s * f); ctx.fill();
      } else {
        ctx.strokeStyle = 'rgba(160,160,170,.4)'; ctx.lineWidth = 1.5 * s; ctx.beginPath(); ctx.moveTo(x, y - 24 * s);
        ctx.quadraticCurveTo(x + Math.sin(temps * 2 + k) * 6 * s, y - 34 * s, x, y - 44 * s); ctx.stroke();
      }
    }
  }
  function dessinerTapis() {
    const s = L.s, x0 = L.cx - L.tapisL / 2, haut = L.debut - L.os * 0.75, bas = L.fin + 12 * s;
    // tunnel d'arrivée
    ctx.fillStyle = '#0c0d14'; rondRect(ctx, x0 - 16 * s, haut - 30 * s, L.tapisL + 32 * s, 44 * s, 10 * s); ctx.fill();
    ctx.fillStyle = '#4a4f63'; ctx.fillRect(x0 - 20 * s, haut - 34 * s, L.tapisL + 40 * s, 8 * s);
    // surface du tapis et ses nervures qui défilent
    const g = ctx.createLinearGradient(x0, 0, x0 + L.tapisL, 0);
    g.addColorStop(0, '#2c2e38'); g.addColorStop(0.5, '#4a4d5a'); g.addColorStop(1, '#2c2e38');
    ctx.fillStyle = g; ctx.fillRect(x0, haut, L.tapisL, bas - haut);
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 3 * s;
    const pas = 22 * s, off = J ? (J.tapisOff % pas) : (temps * 30 * s) % pas;
    for (let y = haut + off; y < bas; y += pas) { ctx.beginPath(); ctx.moveTo(x0 + 4, y); ctx.lineTo(x0 + L.tapisL - 4, y); ctx.stroke(); }
    // rails
    ctx.fillStyle = '#6b7286'; ctx.fillRect(x0 - 9 * s, haut, 9 * s, bas - haut); ctx.fillRect(x0 + L.tapisL, haut, 9 * s, bas - haut);
    ctx.fillStyle = '#9aa1b6'; ctx.fillRect(x0 - 9 * s, haut, 3 * s, bas - haut); ctx.fillRect(x0 + L.tapisL, haut, 3 * s, bas - haut);
    // rideau de lanières du tunnel
    ctx.fillStyle = 'rgba(40,44,60,.85)';
    for (let k = 0; k < 6; k++) ctx.fillRect(x0 + k * L.tapisL / 6 + 2, haut - 22 * s, L.tapisL / 6 - 4, 26 * s + Math.sin(temps * 2 + k) * 2 * s);
    // rouleau du bout
    ctx.fillStyle = '#444a5c'; rondRect(ctx, x0 - 12 * s, bas - 6 * s, L.tapisL + 24 * s, 14 * s, 7 * s); ctx.fill();
  }
  function dessinerMiroir() {
    const s = L.s, x = L.miroirX, w = L.miroirW, haut = L.debut - 10 * s, bas = L.fin;
    ctx.fillStyle = '#5a4430'; rondRect(ctx, x - w / 2 - 5 * s, haut - 5 * s, w + 10 * s, bas - haut + 10 * s, 8 * s); ctx.fill();
    const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    g.addColorStop(0, '#6f7d96'); g.addColorStop(0.5, '#aab6c9'); g.addColorStop(1, '#5f6c84');
    ctx.fillStyle = g; rondRect(ctx, x - w / 2, haut, w, bas - haut, 6 * s); ctx.fill();
    ctx.save(); rondRect(ctx, x - w / 2, haut, w, bas - haut, 6 * s); ctx.clip();
    for (const o of J.objets) {
      if (o.vol) continue;
      const decal = o.signe === 'reflet' ? -L.os * 0.85 + Math.sin(temps * 2 + o.ph) * L.os * 0.1 : 0;
      ctx.save(); ctx.globalAlpha = 0.75; ctx.translate(x, o.y + decal); ctx.scale(-0.38, 0.42);
      const reflet = o.signe === 'reflet' ? Object.assign({}, o, { signe: 'yeux' }) : o;
      dessinerObjet(ctx, reflet, 0, 0, L.os, { t: temps, ombre: false });
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x - w * 0.3, haut, w * 0.12, bas - haut);
    ctx.restore();
  }
  function dessinerLampe(panne) {
    const s = L.s, lum = lampe().lumiere;
    ctx.strokeStyle = '#151620'; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.moveTo(L.lx, 0); ctx.lineTo(L.lx, L.ly - 18 * s); ctx.stroke();
    ctx.save(); ctx.translate(L.lx, L.ly); ctx.rotate(0.55);
    ctx.fillStyle = '#3a4152'; ctx.beginPath(); ctx.moveTo(-10 * s, -20 * s); ctx.lineTo(10 * s, -20 * s); ctx.lineTo(26 * s, 8 * s); ctx.lineTo(-26 * s, 8 * s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5a6378'; ctx.fillRect(-26 * s, 6 * s, 52 * s, 4 * s);
    if (!panne) {
      ctx.fillStyle = lum; ctx.shadowColor = lum; ctx.shadowBlur = 24 * s; ellipse(ctx, 0, 10 * s, 13 * s, 7 * s); ctx.fill();
    } else { ctx.fillStyle = '#2a2a30'; ellipse(ctx, 0, 10 * s, 13 * s, 7 * s); ctx.fill(); }
    ctx.restore();
  }
  function dessinerEtagere() {
    const s = L.s, x = L.gx, y = L.by, w = L.binW, h = L.binH;
    const bond = J && J.etagereSec > 0 ? Math.sin(J.etagereSec * 30) * 3 * s : 0;
    ctx.save(); ctx.translate(x, y + bond);
    ctx.fillStyle = 'rgba(80,220,130,.18)'; ellipse(ctx, 0, -h * 0.2, w * 0.9, h * 0.6); ctx.fill();
    ctx.fillStyle = '#5c4130'; ctx.fillRect(-w / 2, -h / 2, 7 * s, h); ctx.fillRect(w / 2 - 7 * s, -h / 2, 7 * s, h);
    for (let k = 0; k < 3; k++) { ctx.fillStyle = '#7a5638'; ctx.fillRect(-w / 2, -h / 2 + k * h * 0.42, w, 7 * s); }
    // objets sûrs rangés (tasses, ours…) en petit
    const rang = [['tasse', 'bleu'], ['ours', 'dore'], ['vase', 'vert'], ['livre', 'rouge']];
    for (let k = 0; k < 4; k++) {
      const o = { type: rang[k][0], couleur: rang[k][1], ph: k };
      dessinerObjet(ctx, o, -w * 0.25 + (k % 2) * w * 0.5, -h / 2 + (Math.floor(k / 2) + 1) * h * 0.42 - L.os * 0.2, L.os * 0.38, { t: 0, ombre: false });
    }
    // lanterne verte
    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-6 * s, -h / 2 - 22 * s, 12 * s, 18 * s);
    ctx.fillStyle = '#7ef0a2'; ctx.shadowColor = '#7ef0a2'; ctx.shadowBlur = 16 * s; ctx.fillRect(-4 * s, -h / 2 - 19 * s, 8 * s, 12 * s); ctx.shadowBlur = 0;
    ctx.restore();
  }
  function dessinerCage() {
    const s = L.s, x = L.dx, y = L.by, w = L.binW, h = L.binH;
    const sec = J && J.cageSec > 0 ? Math.sin(J.cageSec * 50) * 5 * s * J.cageSec : 0;
    ctx.save(); ctx.translate(x + sec, y);
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, w);
    g.addColorStop(0, 'rgba(255,60,50,.35)'); g.addColorStop(1, 'rgba(255,60,50,0)');
    ctx.fillStyle = g; ellipse(ctx, 0, 0, w, h * 0.7); ctx.fill();
    ctx.fillStyle = '#120b10'; rondRect(ctx, -w / 2, -h / 2, w, h, 10 * s); ctx.fill();
    // ce qui s'agite dans la cage
    if (J) J.cage.forEach((o, k) => {
      ctx.save(); ctx.globalAlpha = 0.85;
      dessinerObjet(ctx, { type: o.type, couleur: o.couleur, ph: o.ph, mut: 0.6, signe: 'yeux' }, -w * 0.22 + (k % 2) * w * 0.44 + Math.sin(temps * 3 + k) * 3 * s, h * 0.18 - Math.floor(k / 2) * h * 0.34, L.os * 0.42, { t: temps, ombre: false });
      ctx.restore();
    });
    for (let k = 0; k < 3; k++) {
      const px = -w * 0.25 + k * w * 0.25, f = (Math.sin(temps * 0.7 + k * 2) + 1) / 2;
      if (f > 0.6) { ctx.fillStyle = 'rgba(255,40,40,' + (f - 0.6) * 2.2 + ')'; ellipse(ctx, px - 4 * s, -h * 0.28, 3 * s, 2 * s); ctx.fill(); ellipse(ctx, px + 4 * s, -h * 0.28, 3 * s, 2 * s); ctx.fill(); }
    }
    ctx.strokeStyle = '#8b8f9c'; ctx.lineWidth = 4 * s;

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------
  function pause(oui) {
    if (etat !== 'jeu' || !J || J.fini || apercu) return;
    if (oui && tutoOuvert) return;
    enPause = oui;
    SON.suspendre(oui);
    montrer(oui ? 'ecran-pause' : null);
    if (oui) $('b-reprendre').focus({ preventScroll: true });
  }

  // ---------------------------------------------------------------------
  //  Commandes : doigt, souris, clavier
  // ---------------------------------------------------------------------
  let geste = null;
  cv.addEventListener('pointerdown', (e) => {
    premierGeste = true;
    torche.x = e.clientX; torche.y = e.clientY; torche.vu = temps;
    if (etat !== 'jeu' || !J || J.fini || enPause || tutoOuvert) return;
    geste = { x: e.clientX, y: e.clientY, pris: false, id: e.pointerId };
    // un objet réveillé sous le doigt : du sel
    for (const r of J.rampants) if (Math.hypot(r.x - e.clientX, r.y - e.clientY) < L.os * 0.65) { frapper(r); geste.pris = true; return; }
    // une caisse sous le doigt : on la secoue
    for (const o of J.objets) if (!o.vol && o.type === 'caisse' && Math.abs(o.y - e.clientY) < L.os * 0.5 && Math.abs(L.cx - e.clientX) < L.os * 0.55) { secouer(o); break; }
  });
  cv.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse' || geste) { torche.x = e.clientX; torche.y = e.clientY; torche.vu = temps; }
  });
  window.addEventListener('pointerup', (e) => {
    if (!geste || geste.id !== e.pointerId) return;
    const g = geste; geste = null;
    if (g.pris) return;
    const dx = e.clientX - g.x, dy = e.clientY - g.y;
    if (Math.abs(dx) > Math.max(30, Math.min(W, 500) * 0.08) && Math.abs(dx) > Math.abs(dy) * 0.7) { trier(dx < 0 ? 'g' : 'd'); return; }
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
      if (Math.abs(e.clientX - L.gx) < L.binW * 0.6 && Math.abs(e.clientY - L.by) < L.binH * 0.6) trier('g');
      else if (Math.abs(e.clientX - L.dx) < L.binW * 0.6 && Math.abs(e.clientY - L.by) < L.binH * 0.6) trier('d');
    }
  });
  window.addEventListener('pointercancel', () => { geste = null; });
  window.addEventListener('keydown', (e) => {
    if (tutoOuvert && (e.code === 'Enter' || e.code === 'Space' || e.code === 'Escape')) { e.preventDefault(); fermerTuto(); return; }
    if (etat !== 'jeu' || !J || J.fini) return;
    if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); pause(!enPause); return; }
    if (enPause || tutoOuvert) return;
    if (e.repeat) return;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); trier('g'); }
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); trier('d'); }
    else if (e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      const d = devant();
      if (d && d.type === 'caisse') secouer(d);
      else { const c = J.objets.find((o) => !o.vol && o.type === 'caisse'); if (c) secouer(c); }
    } else if (e.code === 'Space') { e.preventDefault(); premierGeste = true; selClavier(); }
  });

  let avant = 0;

  }

      for (let k = 0; k < 14; k++) particules.push({ x: L.cx + L.binDX * 0.55, y: L.fin, vx: (rnd() - 0.5) * 200, vy: -rnd() * 150, vie: 9, max: 9, col: '#f4f6ff', r: 2 + rnd() * 2 });
      J.score = 5140; J.serie = 6; J.traites = 15; J.spawned = 18; J.bougies = 2;
      J.cage = [obj('masque', 'rouge', true, 'yeux', 0), obj('cle', 'dore', true, 'yeux', 0), obj('ours', 'vert', true, 'yeux', 0), obj('vase', 'bleu', true, 'yeux', 0)];
      J.ordres = [];
    }
    J.fige = true;
    affScore = J.score;
    majHud();
  }

  // ---------------------------------------------------------------------
  //  Démarrage
  // ---------------------------------------------------------------------
  const numeroApercu = Number(window.JEL_APERCU);
  if (window.JEL_AFFICHE) demarrerAffiche();
  else if (numeroApercu === 1 || numeroApercu === 2 || numeroApercu === 3) {
    redimensionner();
    majBoutonsSon();
    ouvrirApercu(numeroApercu);
    requestAnimationFrame(boucle);
  } else {
    chargerProgres();
    redimensionner();
    majBoutonsSon();
    allerTitre();
    requestAnimationFrame(boucle);
  }
})();
</script>
