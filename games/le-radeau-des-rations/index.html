    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + w * 0.6 + vent, y + h * 0.5, x, y + h); c.lineTo(x + w + vent * 0.5, y + h * 0.92); c.quadraticCurveTo(x + w * 1.15 + vent, y + h * 0.45, x + w * 0.9, y + h * 0.04); c.closePath(); c.stroke();
  }

  // Hameçon (trésor), centré en (x, y), taille k.
  function dessinHamecon(c, id, x, y, k) {
    const coul = { rouille: '#b5652a', os: '#efe6cf', argent: '#d6dde3', or: '#ffc21a', noir: '#2a2a2a', dent: '#f6f2e8' }[id] || '#b5652a';
    c.save(); c.translate(x, y); c.scale(k / 50, k / 50);
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.strokeStyle = '#00000088'; c.lineWidth = 11;
    c.beginPath(); c.moveTo(0, -40); c.lineTo(0, 14); c.arc(-14, 14, 14, 0, Math.PI * 0.95); c.stroke();
    c.strokeStyle = coul; c.lineWidth = 7;
    c.beginPath(); c.moveTo(0, -40); c.lineTo(0, 14); c.arc(-14, 14, 14, 0, Math.PI * 0.95); c.stroke();
    c.fillStyle = coul; c.beginPath(); c.moveTo(-28, 16); c.lineTo(-34, 2); c.lineTo(-22, 8); c.closePath(); c.fill();
    c.strokeStyle = coul; c.lineWidth = 5; rond(c, 0, -44, 6); c.stroke();

    if (id === 'or' || id === 'argent') { c.fillStyle = '#fff'; rond(c, -2, -20, 2.5); c.fill(); }
    c.restore();
  }

  // Mer animée.
  function mer(c, w, h, y0, t, agite, nuit) {
    const g = c.createLinearGradient(0, y0, 0, h);
    g.addColorStop(0, nuit ? '#123852' : '#1f6f8c'); g.addColorStop(1, nuit ? '#061722' : '#0b3346');
    c.fillStyle = g; c.fillRect(0, y0, w, h - y0);
    c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 2;
    for (let j = 0; j < 7; j++) {
      const y = y0 + 10 + j * (h - y0) / 7, amp = (3 + j) * (agite ? 2.2 : 1);
      c.beginPath();
      for (let x = 0; x <= w; x += 12) {
        const yy = y + Math.sin(x / 38 + t / (agite ? 260 : 700) + j * 1.7) * amp;
        if (x === 0) c.moveTo(x, yy); else c.lineTo(x, yy);
      }
      c.stroke();
    }
  }

  // Radeau de rondins, centré en (x, y), largeur L.
  function radeau(c, x, y, L, t, roulis) {
    const H = L * 0.36, a = Math.sin(t / 900) * 0.02 * roulis;
    c.save(); c.translate(x, y); c.rotate(a);
    c.fillStyle = 'rgba(0,0,0,.28)'; ell(c, 0, H * 0.62, L * 0.55, H * 0.25); c.fill();
    for (let i = 0; i < 7; i++) {
      const yy = -H / 2 + i * H / 7;
      c.fillStyle = i % 2 ? '#9c6b3a' : '#b07a42'; c.strokeStyle = '#5b3a19'; c.lineWidth = 2;
      rr(c, -L / 2, yy, L, H / 7 + 1, H / 14); c.fill(); c.stroke();
      c.fillStyle = '#e0b07a'; ell(c, -L / 2 + 4, yy + H / 14, 3, H / 16); c.fill(); ell(c, L / 2 - 4, yy + H / 14, 3, H / 16); c.fill();
    }
    c.strokeStyle = '#d9c49a'; c.lineWidth = 3;
    [-0.32, 0.32].forEach((p) => { c.beginPath(); c.moveTo(L * p, -H / 2 - 2); c.lineTo(L * p, H / 2 + 2); c.stroke(); });
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Écran titre (sert de jaquette)
  // ---------------------------------------------------------------------

  function ciel(c, w, h, hz) {
    const g = c.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, '#1b2d55'); g.addColorStop(0.55, '#c8556a'); g.addColorStop(1, '#ffb36b');
    c.fillStyle = g; c.fillRect(0, 0, w, hz + 2);
  }

  function dessinerTitre() {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const t = performance.now();
    const hz = h * 0.42;
    ciel(c, w, h, hz);
    // étoiles
    const al = graineHasard(11);
    c.fillStyle = 'rgba(255,255,255,.8)';
    for (let i = 0; i < 40; i++) { rond(c, al() * w, al() * hz * 0.5, al() * 1.4 + 0.3); c.fill(); }
    // soleil couchant
    const sr = Math.min(w, h) * 0.13;
    c.fillStyle = '#ffd36b'; rond(c, w * 0.72, hz, sr); c.fill();
    c.fillStyle = 'rgba(255,211,107,.25)'; rond(c, w * 0.72, hz, sr * 1.6); c.fill();
    // nuages
    c.fillStyle = 'rgba(255,190,170,.55)';
    [[0.15, 0.3, 1], [0.55, 0.22, 0.7], [0.85, 0.35, 0.8]].forEach((p) => { const k = sr * 0.6 * p[2]; ell(c, w * p[0], hz * p[1], k * 2, k * 0.5); c.fill(); ell(c, w * p[0] + k, hz * p[1] - k * 0.3, k * 1.2, k * 0.45); c.fill(); });
    mer(c, w, h, hz, t, false, false);
    // reflet du soleil
    c.fillStyle = 'rgba(255,211,107,.35)';
    for (let i = 0; i < 6; i++) { ell(c, w * 0.72, hz + 8 + i * 14, sr * (1 - i * 0.12), 3); c.fill(); }
    // caisses qui flottent
    const u = Math.min(w, h * 0.7);
    [[0.12, 0.62, 0.05, 0.3], [0.88, 0.7, 0.045, -0.4], [0.2, 0.86, 0.04, 0.6]].forEach((p) => {
      const x = w * p[0], y = h * p[1] + Math.sin(t / 800 + p[3] * 9) * 3, k = u * p[2];
      c.save(); c.translate(x, y); c.rotate(p[3]);
      c.fillStyle = '#b07a42'; c.strokeStyle = '#5b3a19'; c.lineWidth = 2; rr(c, -k, -k * 0.8, k * 2, k * 1.6, 3); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(-k, -k * 0.8); c.lineTo(k, k * 0.8); c.stroke();
      c.restore();
    });
    // requin
    aileron(c, w * 0.8 + Math.sin(t / 1500) * w * 0.06, h * 0.78, u / 260, -1);
    // le radeau et les six survivants
    // (entre le titre et la consigne : la jaquette est faite d'après cet écran)
    const L = Math.min(w * 0.8, h * 0.38), rx = w * 0.47, ry = h * 0.535;
    // mât et voile
    c.strokeStyle = '#5b3a19'; c.lineWidth = Math.max(3, L * 0.018);
    c.beginPath(); c.moveTo(rx - L * 0.05, ry - L * 0.05); c.lineTo(rx - L * 0.05, ry - L * 0.5); c.stroke();
    voile(c, prog.voile, rx - L * 0.04, ry - L * 0.48, L * 0.26, L * 0.34, t);
    radeau(c, rx, ry, L, t, 1);
    const r = L * 0.075;
    [[-0.32, -0.08, 1], [-0.12, -0.11, 4], [0.12, -0.1, 2], [0.33, -0.07, 5], [-0.2, 0.07, 0], [0.2, 0.08, 3]].forEach((p) => {
      survivant(c, p[2], rx + p[0] * L, ry + p[1] * L - r * 0.6, r, p[2] === 5 ? 'faim' : '', t);
    });
    // une caisse ouverte au centre
    c.fillStyle = '#c98b4a'; c.strokeStyle = '#5b3a19'; c.lineWidth = 2;
    rr(c, rx - r * 0.7, ry + L * 0.03, r * 1.4, r * 1.0, 3); c.fill(); c.stroke();
    c.fillStyle = '#e8c16a'; ell(c, rx, ry + L * 0.03, r * 0.6, r * 0.25); c.fill();
  }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (parcours de 20 niveaux) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // partie solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché
  let montre = -1;            // survivant dont on montre les caisses
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)
  let dernierAttends = 0;
  let attenteTuto = false;
  let bilanActif = false;     // bilan du jour affiché (en solo, la partie attend)
  let choixTroc = -1;         // rival visé au clavier pendant un troc
  const effets = { requin: null, eclair: 0, part: [], cibleChange: 0 };

  const moi = () => (partie ? partie.siege : (session === 'solo' ? 0 : -1));

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  function remplirTag(tag, role) {
    if (tag.dataset.role === role) return;
    tag.dataset.role = role;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = tr('place.' + role);

  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  // Ce qu'on sait du total d'un survivant (la brume cache celui des rivaux).
  function cache(e, s) { return !!(e && e.cfg.brume && s !== moi() && !e.fin); }

  function etatDe(e, s) {
    if (!e || !present(e, s)) return '';
    if (e.jr[s] === 0) return 'parti';
    if (e.mal[s] || (e.fini[s] && O.total(e.main[s]) > e.cible && !cache(e, s))) return 'mal';
    if (e.fini[s]) return 'garde';
    return '';
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !e.fin ? R.aQui(e) : -1;
    const troc = e && partie && partie.monTour() && e.att === 'ile' ? O.rivauxTroc(e, moi()) : [];
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: s === moi() };
      const la = !e || present(e, s);
      d.classList.toggle('absent', !la);
      if (!la) continue;
      const etat = etatDe(e, s);
      const cacheT = cache(e, s);
      const tot = e ? O.total(e.main[s]) : 0;
      const texteTot = !e || !e.main[s].length ? '' : (cacheT ? '?' : nb(tot));
      d.querySelector('.tot').textContent = texteTot;
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('parti', etat === 'parti');
      d.classList.toggle('mal', etat === 'mal');
      d.classList.toggle('choix', troc.indexOf(s) >= 0);
      d.classList.toggle('vise', choixTroc === s);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role);
      // tête redessinée seulement si l'humeur change
      const humeur = etat === 'mal' ? 'mal' : (etat === 'parti' ? 'parti' : '');
      const cv = d.querySelector('canvas.tete');
      if (cv.dataset.h !== humeur) {
        cv.dataset.h = humeur;
        const c = cv.getContext('2d'); c.clearRect(0, 0, 92, 92);
        medaillon(c, s, 46, 46, 44, humeur === 'mal' ? 'mal' : '');
      }
      // vivres
      const viv = d.querySelector('.vivres');
      const jr = e ? e.jr[s] : 3, max = e ? e.max : 3;
      const cleV = jr + '/' + max;
      if (viv.dataset.v !== cleV) {
        viv.dataset.v = cleV; viv.textContent = '';
        for (let k = 0; k < max; k++) { const i = document.createElement('i'); if (k >= jr) i.className = 'vide'; viv.appendChild(i); }
      }
      let texteEtat = '';
      if (etat === 'parti') texteEtat = tr('etat.parti');
      else if (etat === 'mal') texteEtat = tr('etat.malade');
      else if (etat === 'garde') texteEtat = cacheT ? tr('etat.gardeBrume') : tr('etat.garde');
      else if (s === tour) texteEtat = tr('etat.joue');
      d.querySelector('.etat').textContent = texteEtat;
      d.setAttribute('aria-label', tr('place.aria.' + role, { nom: tr('surv.' + s), n: jr }) + (texteTot ? ' · ' + tr('place.ariaTotal', { t: texteTot }) : '') + (texteEtat ? ' · ' + texteEtat : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    if (e.fin) return '';
    const s = R.aQui(e);
    if (moi() < 0) return tr('multi.attente');
    if (e.jr[moi()] === 0) return tr('tour.parti');
    if (s === moi()) {
      if (e.att === 'ile') return tr('tour.ile');
      if (e.att === 'deb') return tr('tour.deb');
      return e.main[s].length ? tr('tour.toi') : tr('tour.toiDebut');
    }
    return tr('tour.autre', { nom: tr('surv.' + s) });

  // Caisses montrées : celles de qui joue (ou vient de jouer), les miennes à mon tour.

  let mainDessinee = '';
  function majMain(nouvelle) {
    const e = vue;
    const boite = $('caisses');
    if (!e) { boite.textContent = ''; mainDessinee = ''; $('main-qui').textContent = ''; $('main-total').textContent = ''; $('jauge').firstElementChild.style.width = '0'; return; }
    let s = montre;
    if (partie && partie.monTour()) s = moi();
    if (s < 0 || !present(e, s)) s = moi() >= 0 && present(e, moi()) ? moi() : R.aQui(e);
    const main = e.main[s] || [];
    const cachee = cache(e, s);
    const cle = s + '|' + main.join(',') + '|' + cachee + '|' + e.jour;
    $('main-qui').textContent = s === moi() ? tr('jeu.main.toi') : tr('jeu.main.autre', { nom: tr('surv.' + s) });
    const t = O.total(main);
    const trop = !cachee && t > e.cible;
    $('main-total').textContent = cachee ? tr('jeu.totalCache') : tr('jeu.total', { t: nb(t), c: nb(e.cible) });
    $('main-total').classList.toggle('trop', trop);
    $('jauge').classList.toggle('trop', trop);
    $('jauge').firstElementChild.style.width = cachee ? '0' : Math.max(0, Math.min(100, t / Math.max(1, e.cible) * 100)) + '%';
    if (cle === mainDessinee) return;
    const ancien = mainDessinee.split('|');
    const memeSurv = ancien[0] === String(s) && ancien[3] === String(e.jour);
    const avant = memeSurv && ancien[1] ? ancien[1].split(',').length : 0;
    mainDessinee = cle;
    boite.textContent = '';
    main.forEach((c, i) => boite.appendChild(caisseEl(c, cachee, nouvelle && memeSurv && i >= avant)));
    if (!main.length) { const v = document.createElement('div'); v.className = 'caisse vide'; boite.appendChild(v); }
    boite.scrollLeft = boite.scrollWidth;
  }

  // La cale : nombre de caisses qui restent, par valeur (outil de calcul).
  let caleDessinee = '';
  function majCale() {
    const el = $('cale');
    const e = vue;
    const visible = !!e && e.n !== 0;
    el.classList.toggle('cache', !visible);
    if (!visible) return;
    const compte = {};
    e.pioche.forEach((c) => { compte[c] = (compte[c] || 0) + 1; });
    const cle = JSON.stringify(compte) + e.nc;
    if (cle === caleDessinee) return;
    caleDessinee = cle;
    const toutes = O.cargaison(e.cfg, () => 0);
    const ordre = [];
    toutes.forEach((c) => { if (ordre.indexOf(c) < 0) ordre.push(c); });
    ordre.sort((a, b) => {
      const na = a.charAt(0) === 'n', nb2 = b.charAt(0) === 'n';
      if (na && nb2) return O.valeur(a) - O.valeur(b);
      if (na) return -1; if (nb2) return 1;
      return 'friT'.indexOf(a) - 'friT'.indexOf(b);
    });
    el.textContent = '';
    const titre = document.createElement('span'); titre.className = 'titre-cale'; titre.textContent = tr('jeu.cale', { n: e.pioche.length });
    el.appendChild(titre);
    ordre.forEach((c) => {
      const n = compte[c] || 0;
      const p = document.createElement('span');
      const num = c.charAt(0) === 'n';
      p.className = 'puce' + (num && O.valeur(c) < 0 ? ' neg' : '') + (n ? '' : ' zero');
      if (num) p.textContent = nb(O.valeur(c));
      else p.innerHTML = ICONES_CALE[c];
      const sub = document.createElement('sub'); sub.textContent = tr('jeu.caleNb', { n: n });
      p.appendChild(sub);
      p.setAttribute('aria-label', tr('jeu.caleAria.' + (num ? 'n' : c), { v: num ? O.valeur(c) : 0, n: n }));
      el.appendChild(p);
    });
  }

  // Boutons d'action selon la situation.
  function majActions() {
    const e = vue, monT = !!(partie && partie.monTour() && e && !attenteTuto && !bilanActif);
    const att = e ? e.att : '';
    const s = moi();
    const p = $('btn-piocher'), g = $('btn-garder'), h = $('btn-hamecon'), m = $('btn-malade'), x = $('btn-passer');
    p.hidden = att === 'ile' || att === 'deb';
    g.hidden = att === 'ile' || att === 'deb';

    h.hidden = !(aHam && (att === 'deb' || att === ''));
    p.disabled = !monT;
    g.disabled = !monT || !(e && s >= 0 && e.main[s].length);
    h.disabled = !monT || !(e && s >= 0 && e.main[s].length);
    m.disabled = !monT; x.disabled = !monT;

  function majRation() {
    const e = vue;
    $('ration').style.display = e ? '' : 'none';
    if (!e) return;
    const t = nb(e.cible);
    if ($('ration-nb').textContent !== t) {
      $('ration-nb').textContent = t;
      const r = $('ration'); r.classList.remove('change'); void r.offsetWidth; r.classList.add('change');
    }

  function majInterface(nouvelle) {
    majPlaces();
    majInfos();
    majMain(nouvelle);
    majCale();
    majActions();
    majRation();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fin) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === moi() && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage et scène
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    if (ecran === 'jeu') {
      dessinerScene(performance.now(), dt);
      majTemps();
      majCompte();
    } else if (ecran === 'titre') {
      dessinerTitre();
    } else return;
    rafId = requestAnimationFrame(boucle);
  }

  // Places des survivants sur le radeau.
  function positions(w, h) {
    const L = Math.min(w * 0.86, h * 1.5), x = w / 2, y = h * 0.62;
    const pts = [[-0.3, -0.1], [0, -0.13], [0.3, -0.1], [-0.3, 0.1], [0, 0.07], [0.3, 0.1]];
    return { L: L, x: x, y: y, r: Math.min(L * 0.075, h * 0.12), p: pts.map((p) => [x + p[0] * L, y + p[1] * L]) };
  }

  function dessinerScene(t, dt) {
    const cv = $('scene'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const e = vue;
    const nuit = !!(e && (e.cfg.nuit || e.cfg.brume));
    const hz = h * 0.3;
    const g = c.createLinearGradient(0, 0, 0, hz);
    if (nuit) { g.addColorStop(0, '#0a1430'); g.addColorStop(1, '#3a4a6a'); } else { g.addColorStop(0, '#2b4a7a'); g.addColorStop(1, '#f2a36b'); }
    c.fillStyle = g; c.fillRect(0, 0, w, hz + 2);
    const agite = !!(e && t - effets.eclair < 2500);
    mer(c, w, h, hz, t, agite, nuit);
    // aileron qui tourne autour du radeau
    const P = positions(w, h);
    if (e && e.cfg.req) {
      const a = t / 2600;
      aileron(c, P.x + Math.cos(a) * P.L * 0.62, P.y + Math.sin(a) * P.L * 0.22 + P.L * 0.05, P.L / 420, Math.sin(a) > 0 ? -1 : 1);
    }
    // mât et voile
    c.strokeStyle = '#5b3a19'; c.lineWidth = Math.max(3, P.L * 0.015);
    c.beginPath(); c.moveTo(P.x + P.L * 0.14, P.y - P.L * 0.02); c.lineTo(P.x + P.L * 0.14, P.y - P.L * 0.48); c.stroke();
    voile(c, prog.voile, P.x + P.L * 0.15, P.y - P.L * 0.46, P.L * 0.2, P.L * 0.3, t);
    radeau(c, P.x, P.y, P.L * 0.95, t, agite ? 3 : 1);
    // survivants
    if (e) {
      const tour = partie && partie.phase === 'jeu' && !e.fin ? R.aQui(e) : -1;
      for (let s = 0; s < PLACES; s++) {
        if (!present(e, s)) continue;
        const pos = P.p[s];
        if (e.jr[s] === 0) {
          // il a quitté le radeau : son foulard flotte
          c.fillStyle = COUL[s]; c.globalAlpha = 0.7;
          ell(c, pos[0] + Math.sin(t / 900 + s) * 6, P.y + P.L * 0.3 + Math.sin(t / 600 + s) * 2, P.r * 0.5, P.r * 0.18); c.fill();
          c.globalAlpha = 1;
          continue;
        }
        if (s === tour) {
          c.strokeStyle = 'rgba(255,211,107,' + (0.5 + 0.4 * Math.sin(t / 200)).toFixed(2) + ')'; c.lineWidth = 4;
          ell(c, pos[0], pos[1] + P.r * 1.1, P.r * 1.2, P.r * 0.35); c.stroke();
        }
        const etat = etatDe(e, s);
        survivant(c, s, pos[0], pos[1] - P.r * 0.4, P.r, etat === 'mal' ? 'mal' : '', t);
        // petites caisses devant lui (nombre seulement)
        const n = e.main[s].length;
        for (let k = 0; k < Math.min(n, 6); k++) {
          c.fillStyle = e.main[s][k] === 'f' ? '#2d6a86' : (!cache(e, s) && O.valeur(e.main[s][k]) < 0 ? '#4f7d5c' : '#c98b4a');
          c.strokeStyle = '#3b2410'; c.lineWidth = 1;
          const cx = pos[0] - P.r * 0.9 + k * P.r * 0.36, cy = pos[1] + P.r * 0.95 - (k % 2) * 3;
          c.fillRect(cx, cy, P.r * 0.32, P.r * 0.28); c.strokeRect(cx, cy, P.r * 0.32, P.r * 0.28);
        }
      }
    }
    // requin qui fond sur une caisse
    if (effets.requin) {
      const q = effets.requin, p = Math.min(1, (t - q.t0) / 1300);
      if (p >= 1) effets.requin = null;
      else {
        const cible = q.a >= 0 ? P.p[q.a] : [P.x, P.y];
        const x0 = w + 40, y0 = P.y + P.L * 0.3;
        const x = x0 + (cible[0] - x0) * Math.sin(p * Math.PI * 0.5), y = y0 + (cible[1] + P.r * 1.4 - y0) * p;
        aileron(c, x, y, P.L / 300, 1);
        if (p > 0.6) { c.fillStyle = 'rgba(255,255,255,' + (1 - p).toFixed(2) + ')'; for (let k = 0; k < 8; k++) { rond(c, x + Math.cos(k) * 20 * p, y - Math.abs(Math.sin(k * 2)) * 24 * p, 3); c.fill(); } }
      }
    }
    // tempête : éclair et pluie
    if (t - effets.eclair < 2500) {
      const k = (t - effets.eclair) / 2500;
      if (k < 0.12 || (k > 0.2 && k < 0.26)) { c.fillStyle = 'rgba(255,255,240,.55)'; c.fillRect(0, 0, w, h); }
      c.strokeStyle = 'rgba(200,220,255,.5)'; c.lineWidth = 1.5;
      const al = graineHasard(Math.floor(t / 60));
      for (let i = 0; i < 60; i++) { const x = al() * w, y = al() * h; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 6, y + 16); c.stroke(); }
      if (k < 0.3) {
        c.strokeStyle = '#fff6c2'; c.lineWidth = 3; c.beginPath();
        let x = w * 0.25, y = 0; c.moveTo(x, y);
        for (let i = 0; i < 6; i++) { x += (i % 2 ? 14 : -10); y += hz / 5; c.lineTo(x, y); }
        c.stroke();
      }
    }
    // brume
    if (e && e.cfg.brume && !e.fin) {
      for (let i = 0; i < 4; i++) {
        c.fillStyle = 'rgba(210,220,228,' + (0.14 + 0.04 * i).toFixed(2) + ')';
        const x = ((t / (40 + i * 15)) % (w + 300)) - 150;
        ell(c, x, h * (0.35 + i * 0.12), w * 0.5, h * 0.1); c.fill();
        ell(c, w - x, h * (0.45 + i * 0.1), w * 0.4, h * 0.08); c.fill();
      }
    }
    // particules (écume, étoiles)
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 380 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }

  }

  function jaillir(s, coul, n) {
    const zone = $('zone'), w = zone.clientWidth, h = zone.clientHeight;
    if (!w || !h) return;
    const P = positions(w, h);
    const pos = s >= 0 ? P.p[s] : [P.x, P.y];
    for (let k = 0; k < (n || 16); k++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 170;
      particules.push({ x: pos[0], y: pos[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v - 150, vie: 0.6 + Math.random() * 0.5, k: 2 + Math.random() * 3, coul: k % 2 ? coul : '#ffffff' });
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    let nouvelle = false;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); nouvelle = true; break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface(nouvelle);
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    montre = -1;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerBilan();
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), cle = role + (info.chef ? '+chef' : '');
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 104, 104);

        if (info.chef) couronne(c, 52, 22, 24);
        remplirTag(d.querySelector('.tag'), role);
        d.setAttribute('aria-label', tr('salon.place.' + role, { nom: tr('surv.' + s) }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: tr('surv.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    montre = -1;
    particules.length = 0;
    debutTour = Date.now();
    dernierTic = -1;
    choixTroc = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    fermerBilan();
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  // Un coup joué (par moi, un robot ou un vrai joueur) : effets et messages.
  function surAction(ev) {
    const av = ev.avant, ap = ev.apres, s = ev.siege, x = ap.ev || {};
    vue = JSON.parse(JSON.stringify(ap));
    debutTour = Date.now();
    dernierTic = -1;
    montre = ap.jour !== av.jour ? -1 : s;      // nouveau jour : plus de caisses à montrer
    const nom = nomSurv(s);
    const cacheS = cache(ap, s);
    if (ap.nc !== av.nc) toast(tr('ev.cargaison'), 2200);
    if (x.k === 'caisse') {
      if (x.c === 'f') sons.filet(); else if (O.valeur(x.c) < 0 && !cacheS) sons.negative(); else sons.caisse();
      const deborde = ap.mal[s] || ap.att === 'deb';
      if (deborde) {
        const b = $('caisses'); b.classList.remove('secoue'); void b.offsetWidth; b.classList.add('secoue');
        if (ap.mal[s]) { sons.malade(); toast(tr(s === moi() ? 'ev.depasseToi' : 'ev.depasse', { nom: nom }), 2200); jaillir(s, '#a6f08a', 12); }
        else if (s === moi()) { sons.non(); }
      }
    } else if (x.k === 'requin') {
      sons.requin();
      if (x.vide) toast(tr('ev.requinVide', { nom: nom }), 2400);
      else {
        effets.requin = { a: x.a, t0: performance.now() };
        toast(tr(x.a === moi() ? 'ev.requinToi' : 'ev.requin', { nom: nom, victime: nomSurv(x.a), v: cache(ap, x.a) ? '?' : nb(O.valeur(x.c)) }), 3000);
        setTimeout(() => jaillir(x.a, '#7fd0ff', 18), 900);
      }
    } else if (x.k === 'tempete') {
      sons.tempete();
      effets.eclair = performance.now();
      toast(tr(x.d > 0 ? 'ev.tempeteHausse' : 'ev.tempeteBaisse', { nom: nom, c: nb(ap.cible), d: nb(Math.abs(x.d)) }), 3000);
    } else if (x.k === 'ile') {
      sons.ile();
      toast(tr(x.vide ? 'ev.ileVide' : (s === moi() ? 'ev.ileToi' : 'ev.ile'), { nom: nom }), 2600);
      if (s === moi() && !x.vide) choixTroc = -1;
    } else if (x.k === 'troc') {
      if (x.passe) toast(tr('ev.trocPasse', { nom: nom }), 2000);
      else {
        sons.troc();
        const brume = ap.cfg.brume && !ap.fin;
        const voit = s === moi() || x.a === moi() || !brume;
        toast(voit ? tr('ev.troc', { nom: nom, autre: nomSurv(x.a), donne: libelle(x.donne), prend: libelle(x.prend) }) : tr('ev.trocBrume', { nom: nom, autre: nomSurv(x.a) }), 3200);
        const carte = $('place-' + x.a); carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
      }
      if (ap.mal[s]) { sons.malade(); toast(tr(s === moi() ? 'ev.depasseToi' : 'ev.depasse', { nom: nom }), 2200); }
    } else if (x.k === 'hamecon') {

    const carte = $('place-' + s); carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
    // Fin de journée : bilan.
    if (ap.bilan && (ap.jour !== av.jour || (ap.fin && !av.fin))) montrerBilan(ap.bilan, ap);
    else if (partie.phase === 'jeu' && !ap.fin && R.aQui(ap) === moi() && R.aQui(av) !== moi()) sons.tour();
  }

  function libelle(c) { return c === 'f' ? tr('caisse.filetCourt') : nb(O.valeur(c)); }

  // Bilan d'une journée : qui est malade, affamé, parfait, qui quitte le radeau.
  let bilanMinuteur = 0;
  function montrerBilan(b, e) {
    $('bilan-titre').textContent = tr('bilan.titre', { n: b.jour });
    $('bilan-ration').textContent = tr('bilan.ration', { c: nb(b.cible) });
    const boite = $('bilan-lignes');
    boite.textContent = '';
    let pire = '';
    for (let s = 0; s < PLACES; s++) {
      if (!present(e, s)) continue;
      if (e.dep[s] > 0 && e.dep[s] < b.jour) continue;          // déjà parti avant ce jour
      const l = document.createElement('div'); l.className = 'ligne-bilan';
      const cv = document.createElement('canvas'); cv.width = 52; cv.height = 52;
      const mal = b.mal.indexOf(s) >= 0, faim = b.faim.indexOf(s) >= 0, parf = b.parf.indexOf(s) >= 0, part = b.part.indexOf(s) >= 0;
      medaillon(cv.getContext('2d'), s, 26, 26, 25, mal ? 'mal' : '');
      const n = document.createElement('span'); n.className = 'nom'; n.textContent = nomSurv(s);
      const v = document.createElement('span'); v.className = 'val'; v.textContent = nb(b.tot[s]);
      const vd = document.createElement('span');
      let cle = 'ok';
      if (part) cle = 'part'; else if (mal) cle = 'mal'; else if (faim) cle = 'faim'; else if (parf) cle = 'parf';
      vd.className = 'verdict ' + cle;
      vd.textContent = tr('bilan.' + cle);
      l.append(cv, n, v, vd);
      boite.appendChild(l);
      if (s === moi()) pire = cle;
    }
    if (pire === 'mal') sons.malade(); else if (pire === 'faim') sons.faim(); else if (pire === 'parf') sons.parfaite(); else if (pire === 'part') sons.part();
    else sons.garde();
    b.part.forEach((s) => { if (s !== moi()) setTimeout(() => sons.part(), 300); });
    if (b.parf.indexOf(moi()) >= 0) confettis(28);
    bilanActif = true;
    $('bilan').classList.add('actif');
    // En solo, la partie attend que le bilan soit lu.
    if (session === 'solo' && partie && partie.mode === 'solo' && !e.fin) partie.pause(true);
    clearTimeout(bilanMinuteur);
    bilanMinuteur = setTimeout(fermerBilan, e.fin ? 2200 : 3400);
  }

  function fermerBilan() {
    clearTimeout(bilanMinuteur);
    if (!bilanActif) return;
    bilanActif = false;
    $('bilan').classList.remove('actif');
    if (partie && session === 'solo' && !enPause) partie.pause(false);
    majInterface();
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.depart(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      fermerBilan();
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 2300);
  }

  function gagnant(e) { const f = R.fin(e); return f ? f.classement[0] : -1; }

  // Fin d'une manche en ligne : classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const m = moi();
    const gagne = m >= 0 && gagnant(e) === m;
    if (m >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: partie.manche });
    remplirClassement(e, m, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de partie : victoire, défaite, classement
  // ---------------------------------------------------------------------

  // Étoiles selon les jours tenus : tous ses jours → 3, un de perdu → 2, sinon 1.
  function etoilesPour(e, s, gagne) {
    if (!gagne) return 0;
    return e.jr[s] >= e.max ? 3 : (e.jr[s] === e.max - 1 ? 2 : 1);
  }
  const scoreDe = (e, s) => e.sc[s] + 20 * Math.max(0, e.jr[s]);

  function remplirClassement(e, m, sieges, boite) {
    boite.textContent = '';
    const f = R.fin(e);
    const ordre = f ? f.classement : [0, 1, 2, 3, 4, 5];
    let rang = 0;
    ordre.forEach((s) => {
      if (!present(e, s)) return;
      rang++;
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === m ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; medaillon(cv.getContext('2d'), s, 30, 30, 29, '');
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === m ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('surv.' + s) + ' · ' + tr('place.' + role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = e.jr[s] > 0 ? tr('fin.vivres', { n: e.jr[s] }) : tr('fin.partiJour', { n: e.dep[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const m = moi(), sieges = siegesActuels();
    const gagne = m >= 0 && gagnant(e) === m;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, m, sieges, $('fin-classement'));
    $('fin-tresor').textContent = '';
    $('fin-page').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      const score = m >= 0 ? scoreDe(e, m) : 0;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(e, m, gagne);
      const ancienRecord = prog.records[i];
      const record = gagne && score > ancienRecord;
      if (record) prog.records[i] = score;
      let debloque = false;
      const etoilesAvant = totalEtoiles(), premiereFois = prog.etoiles[i] === 0;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), score);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
        // Trésors débloqués
        const nouveaux = [];
        VOILES.forEach((v) => { if (v.etoiles > etoilesAvant && v.etoiles <= totalEtoiles()) nouveaux.push(tr('voile.' + v.id)); });
        HAMECONS.forEach((h) => { if (premiereFois && h.niveau === niveau) nouveaux.push(tr('hamecon.' + h.id)); });
        if (nouveaux.length) $('fin-tresor').textContent = tr('fin.tresor', { nom: nouveaux.join(', ') });
        if (premiereFois) $('fin-page').textContent = tr('carnet.' + niveau);
      }
      $('fin-titre').textContent = gagne ? tr('fin.gagne') : tr(e.jr[m] === 0 ? 'fin.perdu' : 'fin.perduJours');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-points').textContent = tr('fin.score', { n: score, jours: e.bilan ? e.bilan.jour : e.jour });
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, gagne ? score : 0) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil.
      if (m >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: partie.manche });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-points').textContent = '';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (partie en ligne passée en solo).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));

  // Confettis d'écume et de couleurs.
  function confettis(nb2) {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < (nb2 || 90); i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 3 ? COUL[i % 6] : '#ffffff', k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });

    }
    requestAnimationFrame(pas);

    function dessiner(nouvelle) {

      const viv = demo.querySelector('.d-vivres');

      if (etat.viv) for (let k = 0; k < etat.viv; k++) { const i = document.createElement('i'); if (k >= etat.viv - etat.perdus) i.className = 'vide'; viv.appendChild(i); }
      const lignes = [[demo.querySelector('.d-ligne.moi'), etat.moi, false]];

        const cs = l[0].querySelector('.d-caisses');

        cs.textContent = '';
        l[1].forEach((c, i) => cs.appendChild(caisseEl(c, l[2], nouvelle && i >= avant && i === l[1].length - 1)));
        const t = O.total(l[1]);

    function appliquer(et) {
      if (et.add) etat.moi.push(et.add);
      if (et.cale) { etat.cale.forEach((x) => { x[2] = 0; }); const v = O.valeur(et.add); etat.cale.forEach((x) => { if (x[0] === v) { x[1] = Math.max(0, x[1] - 1); x[2] = 1; } }); }
      if (et.requin && etat.riv && etat.riv.length) {
        let best = -1, k = -1, dans = null;
        [[etat.moi, 'm'], [etat.riv, 'r']].forEach((p) => p[0].forEach((c, i) => { if (O.valeur(c) > best) { best = O.valeur(c); k = i; dans = p[0]; } }));

      if (et.tempete) { etat.c += et.tempete; demo.querySelector('.flash').classList.remove('actif'); void demo.offsetWidth; demo.querySelector('.flash').classList.add('actif'); sons.tempete(); }
      if (et.maree) { etat.c = et.maree; etat.moi = []; }

      if (et.troc) { const a = etat.moi.pop(), b = etat.riv.pop(); etat.moi.push(b); etat.riv.push(a); demo.querySelector('.d-ligne.riv').classList.remove('choix'); sons.troc(); }
      if (et.brume) etat.brume = true;
      if (et.jette) { etat.moi.pop(); sons.hamecon(); }
      if (et.vivres) { etat.perdus = Math.max(0, etat.perdus - et.vivres); if (et.vivres > 0) sons.parfaite(); else sons.malade(); }

  function jouer(a) {
    if (!partie || enPause || attenteTuto || bilanActif) return false;

  function choisirRival(s) {

  function rivalSuivant(sens) {
    if (!vue) return;
    const l = O.rivauxTroc(vue, moi());

    const i = l.indexOf(choixTroc);
    choixTroc = l[(i + sens + l.length + (i < 0 && sens < 0 ? 1 : 0)) % l.length];

  $('btn-hamecon').addEventListener('click', () => { audio(); jouer('h'); });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert() || $('voile-fin').classList.contains('actif')) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else { audio(); ouvrirPause(); }
      return;
    }
    if (enPause) return;
    if (bilanActif && (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter')) { ev.preventDefault(); fermerBilan(); return; }
    const e = vue;
    if (!e) return;
    audio();
    if (e.att === 'ile') {
      if (ev.code === 'ArrowLeft' || ev.code === 'ArrowUp') { ev.preventDefault(); rivalSuivant(-1); }
      else if (ev.code === 'ArrowRight' || ev.code === 'ArrowDown') { ev.preventDefault(); rivalSuivant(1); }
      else if (/^Digit[1-6]$/.test(ev.code) || /^Numpad[1-6]$/.test(ev.code)) { ev.preventDefault(); choisirRival(parseInt(ev.code.slice(-1), 10) - 1); }
      else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') { ev.preventDefault(); if (choixTroc >= 0) choisirRival(choixTroc); else rivalSuivant(1); }
      else if (ev.code === 'KeyX' || ev.code === 'Backspace') { ev.preventDefault(); jouer('x'); }
      return;
    }
    if (e.att === 'deb') {
      if (ev.code === 'KeyH' || ev.code === 'Space' || ev.code === 'ArrowUp') { ev.preventDefault(); jouer('h'); }
      else if (ev.code === 'Enter' || ev.code === 'ArrowDown' || ev.code === 'NumpadEnter') { ev.preventDefault(); jouer('m'); }
      return;
    }
    // Espace et Entrée gardent leur sens du jeu même si un bouton d'action a le focus.
    const focus = document.activeElement;
    if (focus && focus.tagName === 'BUTTON' && (ev.code === 'Enter' || ev.code === 'Space')) {
      if (!$('actions').contains(focus)) return;
      focus.blur();
    }
    if (ev.code === 'Space' || ev.code === 'ArrowUp') { ev.preventDefault(); jouer('p'); }
    else if (ev.code === 'Enter' || ev.code === 'ArrowDown' || ev.code === 'NumpadEnter') { ev.preventDefault(); jouer('g'); }
    else if (ev.code === 'KeyH') { ev.preventDefault(); jouer('h'); }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); dessinerIconeHamecon(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-tresors').addEventListener('click', () => { audio(); sons.clic(); ouvrirTresors('voiles'); });
  ['voiles', 'hamecons', 'carnet'].forEach((o) => $('onglet-' + o).addEventListener('click', () => { audio(); sons.clic(); ouvrirTresors(o); }));
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('tre-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && moi() >= 0 ? scoreDe(vue, moi()) : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  dessinerIconeHamecon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); dessinerIconeHamecon(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
})();
</script>
</body>
</html>
