      if (nuit || g.etat === 1) {
        c.save(); c.shadowColor = g.etat === 1 ? '#7dff9a' : coul; c.shadowBlur = 14;
        c.fillStyle = g.etat === 1 ? '#c8ffd4' : '#fff';
        c.beginPath(); c.arc(px, g.y - 42, 3.2, 0, Math.PI * 2); c.fill(); c.restore();
      }
    });
    c.restore();
  }

  function dessinerSapin(c, x, y, s, neige) {
    c.save(); c.translate(x, y); c.scale(s, s);
    c.fillStyle = 'rgba(40,70,120,.2)'; ellipse(c, 8, 2, 22, 7); c.fill();
    c.fillStyle = '#6b4a2a'; c.fillRect(-3.5, -10, 7, 12);
    const etages = [[-60, 15, '#2a8456'], [-46, 21, '#237a4d'], [-30, 26, '#1f6b45']];
    for (let i = 0; i < 3; i++) {
      const [haut, larg, coul] = etages[i];
      c.fillStyle = coul;
      c.beginPath(); c.moveTo(0, haut - 6); c.lineTo(larg, haut + 22); c.lineTo(-larg, haut + 22); c.closePath(); c.fill();
      if (neige !== false) {
        c.fillStyle = '#f4fbff';
        c.beginPath(); c.moveTo(0, haut - 6); c.lineTo(larg * 0.42, haut + 6); c.lineTo(larg * 0.12, haut + 3); c.lineTo(-larg * 0.15, haut + 8); c.lineTo(-larg * 0.42, haut + 6); c.closePath(); c.fill();
      }
    }
    c.restore();
  }

  function dessinerFlocon(c, x, y, r, rot, coul, lueur) {
    c.save(); c.translate(x, y); c.rotate(rot);
    if (lueur) { c.shadowColor = '#ffd23f'; c.shadowBlur = 14; }
    c.strokeStyle = coul; c.lineWidth = Math.max(1.2, r * 0.18); c.lineCap = 'round';
    c.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3, ca = Math.cos(a), sa = Math.sin(a);
      c.moveTo(0, 0); c.lineTo(ca * r, sa * r);
      const bx = ca * r * 0.55, by = sa * r * 0.55;
      const a1 = a + 0.7, a2 = a - 0.7;
      c.moveTo(bx, by); c.lineTo(bx + Math.cos(a1) * r * 0.32, by + Math.sin(a1) * r * 0.32);
      c.moveTo(bx, by); c.lineTo(bx + Math.cos(a2) * r * 0.32, by + Math.sin(a2) * r * 0.32);
    }
    c.stroke();
    c.restore();
  }

  function dessinerMarmotte(c, m, temps) {
    c.save(); c.translate(m.x, m.y);
    // Terrier
    c.fillStyle = '#f4fbff'; ellipse(c, 0, 2, 17, 7); c.fill();
    c.fillStyle = '#5a4030'; ellipse(c, 0, 2, 12, 4.5); c.fill();
    const sortie = m.etat === 'cachee' ? 0 : m.etat === 'sort' ? m.k : m.etat === 'rentre' ? 1 - m.k : 1;
    if (sortie > 0) {
      const bond = m.etat === 'marche' ? Math.abs(Math.sin(temps * 9)) * 2 : 0;
      c.translate(m.etat === 'marche' ? 0 : 0, -sortie * 6 - bond);
      const dir = Math.cos(temps * m.sp + m.ph) >= 0 ? 1 : -1;
      c.scale(dir, 1);
      c.fillStyle = '#9a6a3c'; ellipse(c, 0, -6, 11, 9 * sortie); c.fill();
      c.fillStyle = '#d9b48a'; ellipse(c, 3, -5, 6, 6 * sortie); c.fill();
      c.fillStyle = '#9a6a3c'; c.beginPath(); c.arc(8, -14 * sortie, 6.5, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(5, -20 * sortie, 2.4, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#2b1d12'; c.beginPath(); c.arc(10, -15 * sortie, 1.4, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#3a2516'; c.beginPath(); c.arc(14, -13 * sortie, 1.6, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#7a5230'; ellipse(c, -11, -3, 5, 3); c.fill();
    }
    c.restore();
  }

  function dessinerBosses(c, b, xmin, xmax) {
    for (let x = Math.floor(xmin / 46) * 46; x < xmax; x += 46) {
      const dx = (Math.floor(x / 46) % 2) * 12;
      const gr = c.createLinearGradient(0, b.y - 16, 0, b.y + 12);
      gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.6, '#e4f1fb'); gr.addColorStop(1, '#a9c8e4');
      c.fillStyle = gr; ellipse(c, x + dx, b.y, 26, 13); c.fill();
      c.fillStyle = 'rgba(255,255,255,.9)'; ellipse(c, x + dx - 6, b.y - 6, 9, 3.5); c.fill();
    }
    // Petits fanions orange au bord pour annoncer la bosse
    [8, 392].forEach((px) => {
      c.fillStyle = '#ff8a1f'; c.fillRect(px - 1.5, b.y - 34, 3, 34);
      c.beginPath(); c.moveTo(px, b.y - 34); c.lineTo(px + (px < 200 ? 12 : -12), b.y - 30); c.lineTo(px, b.y - 26); c.fill();
    });
  }

  function dessinerGlace(c, g, temps) {
    c.save();
    const gr = c.createRadialGradient(g.x - g.rx * 0.3, g.y - g.ry * 0.3, 4, g.x, g.y, g.rx);
    gr.addColorStop(0, '#e9fbff'); gr.addColorStop(0.7, '#a9e2f7'); gr.addColorStop(1, '#86cdeb');
    c.fillStyle = gr; ellipse(c, g.x, g.y, g.rx, g.ry); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 2;
    const brillance = (Math.sin(temps * 2 + g.x) + 1) / 2;
    c.globalAlpha = 0.5 + brillance * 0.5;
    c.beginPath(); c.moveTo(g.x - g.rx * 0.5, g.y - g.ry * 0.1); c.lineTo(g.x - g.rx * 0.1, g.y - g.ry * 0.45);
    c.moveTo(g.x + g.rx * 0.1, g.y + g.ry * 0.3); c.lineTo(g.x + g.rx * 0.45, g.y - g.ry * 0.05); c.stroke();
    c.restore();
  }

  // Ligne de départ ou d'arrivée : deux poteaux et une banderole sans texte.
  function dessinerBanderole(c, y, arrivee, temps) {
    c.save();
    c.fillStyle = 'rgba(40,70,120,.18)'; c.fillRect(20, y, 360, 8);
    [20, 380].forEach((px) => { c.fillStyle = '#5b6b80'; c.fillRect(px - 3, y - 70, 6, 70); });
    const h = 22, top = y - 70;
    if (arrivee) {
      for (let i = 0; i < 24; i++) for (let j = 0; j < 2; j++) {
        c.fillStyle = (i + j) % 2 ? '#1b1f2a' : '#ffffff';
        c.fillRect(20 + i * 15, top + j * (h / 2), 15, h / 2);
      }
      // Ligne au sol
      for (let i = 0; i < 24; i++) { c.fillStyle = i % 2 ? '#e5383b' : '#ffffff'; c.fillRect(20 + i * 15, y - 3, 15, 6); }
    } else {
      const gr = c.createLinearGradient(20, 0, 380, 0);
      gr.addColorStop(0, '#2f6fe0'); gr.addColorStop(0.5, '#5aa2ff'); gr.addColorStop(1, '#2f6fe0');
      c.fillStyle = gr; c.fillRect(20, top, 360, h);
      for (let i = 0; i < 8; i++) dessinerFlocon(c, 45 + i * 44, top + h / 2, 7, temps * 0.5 + i, '#ffffff', false);
      c.fillStyle = '#2f6fe0'; c.fillRect(20, y - 3, 360, 6);
    }
    c.restore();
  }

  // Main animée des tutoriels (le bout du doigt est en x, y).
  function dessinerMain(c, x, y, s, appui) {
    c.save(); c.translate(x, y); c.scale(s, s);
    if (appui) {
      c.strokeStyle = 'rgba(47,111,224,.8)'; c.lineWidth = 3;
      c.beginPath(); c.arc(0, 0, 13, 0, Math.PI * 2); c.stroke();
    }
    c.fillStyle = '#ffdcbf'; c.strokeStyle = '#a0623c'; c.lineWidth = 2;
    rrect(c, -5.5, 0, 11, 28, 5.5); c.fill(); c.stroke();
    rrect(c, -13, 20, 30, 28, 11); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(5, 26); c.lineTo(5, 34); c.moveTo(11, 26); c.lineTo(11, 34); c.stroke();
    c.restore();
  }

  // ------------------------------------------------------------------------
  // 6. Course : état et mise à jour
  // ------------------------------------------------------------------------
  let mode = 'titre';          // titre, niveaux, vestiaire, tuto, decompte, course, pause, fin
  let course = null;           // partie en cours
  let horloge = 0;             // temps des animations (s)
  const entree = { gauche: false, droite: false, doigt: false, doigtX: 0, actif: false, debut: 0, x0: 0, y0: 0, id: null };
  const particules = [];       // particules du monde (neige, étincelles)
  const textes = [];           // textes flottants
  const confettis = [];        // confettis de l'écran
  let secousse = 0;

  function nouvelleCourse(n) {
    const N = NIVEAUX[n], P = piste(n);
    P.portes.forEach((g) => (g.etat = 0));
    P.flocons.forEach((f) => (f.pris = false));
    P.marmottes.forEach((m) => { m.etat = 'cachee'; m.k = 0; m.x = m.x0; });
    course = {
      n, N, P, x: 200, y: 60, vx: 0, v: 0, z: 0, vz: 0, temps: 0, depart: false, finie: false,
      passees: 0, ratees: 0, serie: 0, flocons: 0, chutes: 0, chute: 0, rot: 0, invul: 0, treb: 0, elan: 0,
      trace: [], enreg: [], prochainEnreg: 0, fantome: lireFantome(n), vent: 0, rafale: 0, finT: 0,
      sansFantomeBattu: true, ecartAff: 0,
    };
    particules.length = 0; textes.length = 0; confettis.length = 0;
  }

  function enGlace(x, y) {
    const G = course.P.glaces;
    for (let i = 0; i < G.length; i++) {
      const g = G[i], dx = (x - g.x) / g.rx, dy = (y - g.y) / g.ry;
      if (dx * dx + dy * dy < 1) return true;
    }
    return false;
  }

  function texteFlottant(x, y, txt, coul, taille) { textes.push({ x, y, txt, coul, taille: taille || 18, vie: 1.2 }); }
  function etincelles(x, y, coul, nb, vit) {
    for (let i = 0; i < nb; i++) {
      const a = Math.random() * Math.PI * 2, v = (vit || 120) * (0.4 + Math.random());
      particules.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, vie: 0.6 + Math.random() * 0.4, coul, t: 2 + Math.random() * 3, etoile: Math.random() < 0.4 });
    }
  }
  function lancerConfettis(nb) {
    const couls = ['#e5383b', '#2f6fe0', '#ffd23f', '#2fc26a', '#9b5cf0', '#ff8a1f'];
    for (let i = 0; i < nb; i++) {
      confettis.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.5, vx: (Math.random() - 0.5) * 80, vy: 80 + Math.random() * 160,
        r: Math.random() * 6, vr: (Math.random() - 0.5) * 10, coul: couls[i % couls.length], vie: 4 });
    }
  }

  // Saut (toucher rapide, bouton ou Espace).
  function sauter() {
    const C = course;
    if (!C || mode !== 'course' || !C.depart || C.finie || C.chute > 0 || C.z > 0) return;
    C.vz = SAUT; C.z = 0.01;
    SONS.saut();
    for (let i = 0; i < 8; i++) particules.push({ x: C.x + (Math.random() - 0.5) * 14, y: C.y + 4, vx: (Math.random() - 0.5) * 60, vy: -Math.random() * 40, vie: 0.5, coul: '#ffffff', t: 3 });
  }

  function tomber(motif, dx) {
    const C = course;
    C.chute = 1.1; C.chutes++; C.v *= 0.15; C.vx = 0; C.invul = 1.8; C.serie = 0;
    C.x = clamp(C.x + (dx >= 0 ? 12 : -12), 14, 386);
    secousse = 10;
    SONS.chute();
    texteFlottant(C.x, C.y - 50, T(motif), '#173a63', 20);
    for (let i = 0; i < 18; i++) particules.push({ x: C.x, y: C.y, vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 120, vie: 0.8, coul: '#ffffff', t: 4 });
  }

  function majCourse(dt) {
    const C = course, N = C.N, P = C.P;
    const vxm = vxMax(N);
    if (C.depart && !C.finie) C.temps += dt;
    if (C.finie) C.finT += dt;

    // Direction voulue : doigt (le skieur le suit) ou flèches.
    let voulu = 0;
    if (!C.finie && C.chute <= 0 && C.depart) {
      if (entree.gauche) voulu -= vxm;
      if (entree.droite) voulu += vxm;
      if (entree.doigt && entree.actif) voulu = clamp((entree.doigtX - C.x) * 7, -vxm, vxm);
    }
    const glace = C.z <= 0 && enGlace(C.x, C.y);
    const reac = glace ? 1.4 : C.z > 0 ? 4 : 10;
    C.vx += (voulu - C.vx) * Math.min(1, reac * dt);

    // Vent : la manche à air prévient une seconde avant la rafale.
    C.vent = 0; C.ventEtat = 0;
    if (N.vent && C.depart && !C.finie) {
      for (const r of P.rafales) {
        const d = C.temps - r.t;
        if (d > -1.1 && d < 0) { C.ventEtat = 1; C.ventDir = r.dir; }   // avertissement
        if (d >= 0 && d < r.d) {
          const env = Math.sin(Math.PI * d / r.d);
          C.vent = r.dir * 175 * env; C.ventEtat = 2; C.ventDir = r.dir;
          if (!r.joue) { r.joue = true; SONS.vent(); }
        }
        if (d > r.d + 1) r.joue = false;
      }
    }
    C.x += (C.vx + C.vent) * dt;
    if (C.x < 14) { C.x = 14; C.vx = Math.max(0, C.vx); }
    if (C.x > 386) { C.x = 386; C.vx = Math.min(0, C.vx); }

    // Vitesse vers l'avant
    if (C.chute > 0) {
      C.chute -= dt; C.rot += dt * 12;
      C.v = Math.max(0, C.v - 500 * dt);
      if (C.chute <= 0) C.rot = 0;
    } else if (C.finie) {
      C.v = Math.max(0, C.v - 320 * dt);
    } else if (C.depart) {
      // Les grands virages freinent : une trajectoire souple est plus rapide. Un flocon doré donne de l'élan.
      const vise = N.v * (1 - 0.18 * Math.pow(C.vx / vxm, 2)) * (C.treb > 0 ? 0.55 : 1) * (C.elan > 0 ? 1.12 : 1);
      if (C.elan > 0) C.elan -= dt;
      C.v += clamp(vise - C.v, -420 * dt, ACC * dt);
    }
    if (C.treb > 0) C.treb -= dt;
    if (C.invul > 0) C.invul -= dt;
    const yAvant = C.y;
    C.y += C.v * dt;

    // Saut
    if (C.z > 0) {
      C.vz -= GRAV * dt; C.z += C.vz * dt;
      if (C.z <= 0) {
        C.z = 0; C.vz = 0; SONS.atterrit();
        for (let i = 0; i < 10; i++) particules.push({ x: C.x + (Math.random() - 0.5) * 20, y: C.y + 3, vx: (Math.random() - 0.5) * 120, vy: -Math.random() * 60, vie: 0.5, coul: '#ffffff', t: 3 });
      }
    }

    // Gerbe de neige dans les virages
    if (C.z <= 0 && C.v > 60 && Math.abs(C.vx) > vxm * 0.35 && Math.random() < 0.7) {
      const sens = C.vx > 0 ? -1 : 1;
      particules.push({ x: C.x + sens * 8, y: C.y + 6, vx: sens * (40 + Math.random() * 80), vy: -20 - Math.random() * 60, vie: 0.45, coul: glace ? '#d7f5ff' : '#ffffff', t: 2.5 + Math.random() * 2 });
    }
    // Traces des skis
    if (C.z <= 0 && C.v > 1 && C.chute <= 0) {
      const dern = C.trace[C.trace.length - 1];
      if (!dern || C.y - dern.y > 10) C.trace.push({ x: C.x, y: C.y });
    } else if (C.trace.length && C.trace[C.trace.length - 1] !== null) C.trace.push(null);
    while (C.trace.length > 160) C.trace.shift();

    if (!C.finie) {
      // Portes franchies ?
      for (const g of P.portes) {
        if (g.etat !== 0 || g.y > C.y || g.y <= yAvant) continue;
        const cx = centrePorte(g, C.temps);
        if (Math.abs(C.x - cx) <= g.l / 2 - 3) {
          g.etat = 1; C.passees++; C.serie++;
          SONS.porte(C.serie);
          etincelles(C.x, g.y - 20, g.coul ? '#ff8a8a' : '#8ab8ff', 10, 110);
          if (C.serie > 0 && C.serie % 5 === 0) texteFlottant(C.x, g.y - 60, T('serie', { n: C.serie }), '#138a3e', 20);
          afficherEcart(g.y);
        } else {
          g.etat = 2; C.ratees++; C.serie = 0;
          SONS.ratee(); secousse = 5;
          texteFlottant(cx, g.y - 50, T('penalite', { s: PEN }), '#c62828', 22);
          const ch = $('chrono'); ch.classList.add('penalite'); setTimeout(() => ch.classList.remove('penalite'), 450);
          majHud(true);
          if (C.ratees >= N.rat) { finCourse(false); return; }
        }
        majHud(true);
      }
      // Bosses : il faut être en l'air quand on les passe.
      for (const b of P.bosses) {
        if (b.y > C.y || b.y <= yAvant) continue;
        if (C.z < 4 && C.chute <= 0) {
          C.treb = 0.7; C.v *= 0.5; C.vz = 120; C.z = 0.01; secousse = 4;
          SONS.bosse(); texteFlottant(C.x, C.y - 54, T('bosse_ratee'), '#173a63', 18);
        } else texteFlottant(C.x, C.y - 60, T('beau_saut'), '#2f6fe0', 16);
      }
      // Flocons dorés : seulement en l'air.
      for (const f of P.flocons) {
        if (f.pris || Math.abs(f.y - C.y) > 26) continue;
        if (Math.abs(f.x - C.x) < 32 && C.z > 20) {
          f.pris = true; C.flocons++; C.elan = 1.2;
          SONS.flocon(); etincelles(f.x, f.y - 42, '#ffd23f', 16, 140);
          texteFlottant(f.x, f.y - 70, T('flocon_pris'), '#b07a00', 18);
          majHud(true);
        }
      }
      // Sapins
      if (C.chute <= 0 && C.invul <= 0) {
        for (const s of P.sapins) {
          if (Math.abs(s.y - C.y) > 12) continue;
          const dx = C.x - s.x;
          if (Math.abs(dx) < 14 * s.s + 6) { tomber('oups_sapin', dx); break; }
        }
      }
      // Marmottes : elles sortent quand le skieur approche.
      for (const m of P.marmottes) {
        const devant = m.y - C.y;
        if (m.etat === 'cachee' && devant < 520 && devant > 0) { m.etat = 'sort'; m.k = 0; if (devant < 400) SONS.marmotte(); }
        if (m.etat === 'sort') { m.k += dt * 2.5; if (m.k >= 1) { m.etat = 'marche'; m.k = 0; SONS.marmotte(); } }
        if (m.etat === 'marche') {
          m.x = m.x0 + Math.sin(C.temps * m.sp + m.ph) * m.amp;
          if (devant < -60) { m.etat = 'rentre'; m.k = 0; }
          if (C.chute <= 0 && C.invul <= 0 && C.z < 16 && Math.abs(devant) < 10 && Math.abs(C.x - m.x) < 18) {
            tomber('oups_marmotte', C.x - m.x); m.etat = 'rentre'; m.k = 0; SONS.marmotte();
          }
        }
        if (m.etat === 'rentre') { m.k = Math.min(1, m.k + dt * 3); }
      }
      // Fantôme : enregistrement 10 fois par seconde
      if (C.depart && C.temps >= C.prochainEnreg) {
        C.enreg.push(Math.round(C.y), Math.round(C.x), Math.round(C.z));
        C.prochainEnreg += 0.1;
      }
      // Arrivée
      if (C.y >= P.arrivee) { finCourse(true); }
    }
    // Son de glisse
    const vol = C.z > 0 || C.chute > 0 || !C.depart ? 0 : clamp(C.v / 400, 0, 1) * (0.05 + 0.08 * Math.abs(C.vx) / vxm) * (glace ? 0.5 : 1);
    regierGlisse(vol, glace ? 2600 : 900 + Math.abs(C.vx) * 3);
  }

  // Écart avec le fantôme au passage d'une porte.
  function afficherEcart(yPorte) {
    const C = course, f = C.fantome;
    if (!f) return;
    let i = 0;
    while (i < f.length && f[i] < yPorte) i += 3;
    if (i >= f.length) return;
    const tf = (i / 3) * 0.1;
    const d = C.temps + C.ratees * PEN - tf;
    const el = $('ecart');
    el.textContent = d <= 0 ? T('ecart_avance', { s: fmtSec(-d) }) : T('ecart_retard', { s: fmtSec(d) });
    el.className = 'vu ' + (d <= 0 ? 'avance' : 'retard');
    clearTimeout(afficherEcart.minuteur);
    afficherEcart.minuteur = setTimeout(() => { el.className = ''; }, 1400);
  }

  function majParticules(dt) {
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 160 * dt;
      if (p.vie <= 0) particules.splice(i, 1);
    }
    for (let i = textes.length - 1; i >= 0; i--) { const t = textes[i]; t.vie -= dt; t.y -= 30 * dt; if (t.vie <= 0) textes.splice(i, 1); }
    for (let i = confettis.length - 1; i >= 0; i--) {
      const p = confettis[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      if (p.vie <= 0 || p.y > H + 20) confettis.splice(i, 1);
    }
    secousse = Math.max(0, secousse - dt * 30);
  }

  // ------------------------------------------------------------------------
  // 7. Rendu de la course
  // ------------------------------------------------------------------------
  let voileNuit = null;
  function rendreCourse() {
    const C = course, N = C.N, P = C.P;
    const S = Math.min(W / 400, H / 700);
    const offX = (W - 400 * S) / 2;
    const ySkieurEcran = H * 0.3;
    const camY = C.y - ySkieurEcran / S;
    const vueH = H / S;
    const xmin = -offX / S, xmax = (W - offX) / S;
    const sx = (Math.random() - 0.5) * secousse, sy = (Math.random() - 0.5) * secousse;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // Neige
    const fond = ctx.createLinearGradient(0, 0, 0, H);
    if (N.noire) { fond.addColorStop(0, '#dfe7f0'); fond.addColorStop(1, '#c7d4e3'); }
    else { fond.addColorStop(0, '#f3f9ff'); fond.addColorStop(1, '#dcecf9'); }
    ctx.fillStyle = fond; ctx.fillRect(0, 0, W, H);

    ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * (offX + sx), DPR * sy);
    ctx.translate(0, -camY);
    const yHaut = camY - 60, yBas = camY + vueH + 80;
    const visible = (y) => y > yHaut && y < yBas;

    // Texture de la neige (petits creux) et bords hors piste
    for (let ry = Math.floor(yHaut / 50); ry < yBas / 50; ry++) {
      for (let k = 0; k < 4; k++) {
        const h = hache(ry, k);
        const x = xmin + h * (xmax - xmin), y = ry * 50 + hache(k, ry) * 50;
        ctx.strokeStyle = N.noire ? 'rgba(90,110,140,.18)' : 'rgba(120,160,200,.2)'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(x, y, 6 + h * 8, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      }
    }
    if (xmin < 0) { ctx.fillStyle = 'rgba(190,215,235,.55)'; ctx.fillRect(xmin, yHaut, -xmin, yBas - yHaut); }
    if (xmax > 400) { ctx.fillStyle = 'rgba(190,215,235,.55)'; ctx.fillRect(400, yHaut, xmax - 400, yBas - yHaut); }
    // Filets de sécurité au bord de la piste
    [3, 397].forEach((px) => {
      ctx.strokeStyle = N.noire ? '#1b1f2a' : '#ff8a1f'; ctx.lineWidth = 2.5; ctx.setLineDash([10, 7]);
      ctx.beginPath(); ctx.moveTo(px, yHaut); ctx.lineTo(px, yBas); ctx.stroke(); ctx.setLineDash([]);
    });
    // Piste noire : losanges sombres sur les bords
    if (N.noire) {
      for (let y = Math.floor(yHaut / 300) * 300; y < yBas; y += 300) {
        [16, 384].forEach((px) => { ctx.fillStyle = '#1b1f2a'; ctx.beginPath(); ctx.moveTo(px, y - 9); ctx.lineTo(px + 7, y); ctx.lineTo(px, y + 9); ctx.lineTo(px - 7, y); ctx.fill(); });
      }
    }
    // Traces de ski
    ctx.strokeStyle = 'rgba(140,175,210,.45)'; ctx.lineWidth = 2;
    [-5.5, 5.5].forEach((d) => {
      ctx.beginPath(); let lev = true;
      for (const p of C.trace) { if (!p) { lev = true; continue; } if (lev) { ctx.moveTo(p.x + d, p.y + 8); lev = false; } else ctx.lineTo(p.x + d, p.y + 8); }
      ctx.stroke();
    });

    P.glaces.forEach((g) => { if (visible(g.y)) dessinerGlace(ctx, g, horloge); });
    P.bosses.forEach((b) => { if (visible(b.y)) dessinerBosses(ctx, b, Math.max(xmin, 0), Math.min(xmax, 400)); });
    if (visible(100)) dessinerBanderole(ctx, 100, false, horloge);
    if (visible(P.arrivee)) dessinerBanderole(ctx, P.arrivee, true, horloge);
    // Ombres des flocons dorés (pour savoir où sauter)
    P.flocons.forEach((f) => { if (!f.pris && visible(f.y)) { ctx.fillStyle = 'rgba(230,168,0,.22)'; ellipse(ctx, f.x, f.y + 2, 11, 4); ctx.fill(); } });

    // Objets triés de haut en bas : portes, sapins, marmottes, fantôme, skieur
    const objets = [];
    P.portes.forEach((g) => { if (visible(g.y)) objets.push({ y: g.y, f: () => dessinerPorte(ctx, g, centrePorte(g, C.temps), 1, horloge, N.nuit) }); });
    P.sapins.forEach((s) => { if (visible(s.y)) objets.push({ y: s.y, f: () => dessinerSapin(ctx, s.x, s.y, s.s) }); });
    P.marmottes.forEach((m) => { if (visible(m.y)) objets.push({ y: m.y, f: () => dessinerMarmotte(ctx, m, C.temps) }); });
    // Sapins décoratifs hors piste (écrans larges)
    for (let ry = Math.floor(yHaut / 90); ry < yBas / 90; ry++) {
      for (const cote of [-1, 1]) {
        const h = hache(ry * 2 + (cote > 0 ? 1 : 0), 77);
        const x = cote < 0 ? -30 - h * 200 : 430 + h * 200;
        if ((cote < 0 && x > xmin - 40) || (cote > 0 && x < xmax + 40)) objets.push({ y: ry * 90 + 40, f: () => dessinerSapin(ctx, x, ry * 90 + 40, 0.9 + h * 0.4) });
      }
    }
    const f = C.fantome;
    let fx = null;
    if (f && C.depart) {
      const k = C.temps / 0.1, i = Math.floor(k) * 3;
      if (i + 5 < f.length) {
        const a = k - Math.floor(k);
        fx = { y: lerp(f[i], f[i + 3], a), x: lerp(f[i + 1], f[i + 4], a), z: lerp(f[i + 2], f[i + 5], a) };
        fx.ang = Math.atan2(f[i + 4] - f[i + 1], Math.max(1, f[i + 3] - f[i])) ;
      }
    }
    if (fx && visible(fx.y)) objets.push({ y: fx.y, f: () => { ctx.save(); ctx.globalAlpha = 0.45; dessinerSkieur(ctx, fx.x, fx.y, fx.z, fx.ang, tenueActuelle(), { fantome: true, temps: horloge }); ctx.restore(); } });
    const ang = Math.atan2(C.vx, Math.max(40, C.v));
    objets.push({ y: C.y + 0.5, f: () => {
      ctx.save();
      if (C.invul > 0 && C.chute <= 0) ctx.globalAlpha = 0.55 + 0.45 * Math.sin(horloge * 30);
      dessinerSkieur(ctx, C.x, C.y, C.z, C.treb > 0 ? Math.sin(horloge * 30) * 0.3 : ang, tenueActuelle(), { chute: C.chute > 0 ? C.rot : 0, temps: horloge });
      ctx.restore();
      if (C.chute > 0) for (let i = 0; i < 3; i++) etoileForme(ctx, C.x + Math.cos(horloge * 6 + i * 2.1) * 16, C.y - 52 + Math.sin(horloge * 6 + i * 2.1) * 5, 5, '#ffd23f');
    } });
    objets.sort((a, b) => a.y - b.y).forEach((o) => o.f());

    // Flocons dorés en l'air
    const dessinerLesFlocons = () => P.flocons.forEach((fl) => {
      if (fl.pris || !visible(fl.y)) return;
      const yy = fl.y - 42 + Math.sin(horloge * 3 + fl.ph) * 4;
      dessinerFlocon(ctx, fl.x, yy, 11, horloge + fl.ph, '#f5b301', true);
    });
    dessinerLesFlocons();

    // Particules
    particules.forEach((p) => {
      ctx.globalAlpha = clamp(p.vie * 2, 0, 1);
      if (p.etoile) etoileForme(ctx, p.x, p.y, p.t * 1.4, p.coul);
      else { ctx.fillStyle = p.coul; ctx.beginPath(); ctx.arc(p.x, p.y, p.t, 0, Math.PI * 2); ctx.fill(); }
    });
    ctx.globalAlpha = 1;

    // Brouillard : le bas de l'écran est caché, seules les portes clignotent.
    const ecranY = (y) => (y - camY) * S + sy;
    if (N.brume) {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const debut = ySkieurEcran + 70 * S, plein = ySkieurEcran + 250 * S;
      const gr = ctx.createLinearGradient(0, debut, 0, plein);
      gr.addColorStop(0, 'rgba(232,238,244,0)'); gr.addColorStop(1, 'rgba(232,238,244,.97)');
      ctx.fillStyle = 'rgba(232,238,244,.18)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = gr; ctx.fillRect(0, debut, W, plein - debut);
      ctx.fillStyle = 'rgba(232,238,244,.97)'; ctx.fillRect(0, plein, W, H - plein);
      // Volutes
      for (let i = 0; i < 5; i++) {
        const vx = ((horloge * 20 + i * 170) % (W + 300)) - 150;
        ctx.fillStyle = 'rgba(255,255,255,.35)'; ellipse(ctx, vx, ySkieurEcran + 120 * S + i * 60, 160, 28); ctx.fill();
      }
      ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * (offX + sx), DPR * sy);
      ctx.translate(0, -camY);
      const clin = Math.sin(horloge * 7) > -0.2 ? 1 : 0.3;
      P.portes.forEach((g) => {
        if (!visible(g.y) || g.etat !== 0) return;
        const e = ecranY(g.y);
        const brume = clamp((e - debut) / (plein - debut), 0, 1);
        if (brume > 0.05) dessinerPorte(ctx, g, centrePorte(g, C.temps), brume * clin, horloge, true);
      });
    }

    // Nuit : seule la lanterne éclaire autour du skieur.
    if (N.nuit) {
      if (!voileNuit) voileNuit = document.createElement('canvas');
      if (voileNuit.width !== cv.width || voileNuit.height !== cv.height) { voileNuit.width = cv.width; voileNuit.height = cv.height; }
      const v = voileNuit.getContext('2d');
      v.setTransform(DPR, 0, 0, DPR, 0, 0);
      v.globalCompositeOperation = 'source-over';
      v.clearRect(0, 0, W, H);
      v.fillStyle = 'rgba(8,14,44,.9)'; v.fillRect(0, 0, W, H);
      v.globalCompositeOperation = 'destination-out';
      const lx = offX + C.x * S + sx, ly = ySkieurEcran + 40 * S;
      const rl = 210 * S;
      const gl = v.createRadialGradient(lx, ly, rl * 0.25, lx, ly, rl);
      gl.addColorStop(0, 'rgba(0,0,0,1)'); gl.addColorStop(1, 'rgba(0,0,0,0)');
      v.fillStyle = gl; v.beginPath(); v.arc(lx, ly, rl, 0, Math.PI * 2); v.fill();
      v.globalCompositeOperation = 'source-over';
      // Étoiles qui scintillent dans la nuit
      for (let i = 0; i < 40; i++) {
        const h = hache(i, 3), px = h * W, py = ((hache(3, i) * H * 1.2 - (camY * S * 0.15)) % H + H) % H;
        v.fillStyle = 'rgba(255,255,230,' + (0.3 + 0.7 * Math.abs(Math.sin(horloge * 1.5 + i))) + ')';
        v.beginPath(); v.arc(px, py, 1 + h * 1.3, 0, Math.PI * 2); v.fill();
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(voileNuit, 0, 0);
      // Lune
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.fillStyle = '#fff6cf'; ctx.beginPath(); ctx.arc(W - 46, 92, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(8,14,44,1)'; ctx.beginPath(); ctx.arc(W - 38, 86, 16, 0, Math.PI * 2); ctx.fill();
      // Ce qui brille : portes, flocons, banderole d'arrivée
      ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * (offX + sx), DPR * sy);
      ctx.translate(0, -camY);
      P.portes.forEach((g) => {
        if (!visible(g.y) || g.etat === 2) return;
        const cx = centrePorte(g, C.temps), coul = g.etat === 1 ? '#7dff9a' : g.coul ? '#ff6b6e' : '#6fa8ff';
        ctx.save(); ctx.shadowColor = coul; ctx.shadowBlur = 12; ctx.fillStyle = coul;
        [cx - g.l / 2, cx + g.l / 2].forEach((px) => { ctx.fillRect(px - 2, g.y - 40, 4, 40); ctx.beginPath(); ctx.arc(px, g.y - 42, 3.5, 0, Math.PI * 2); ctx.fill(); });
        ctx.restore();
      });
      dessinerLesFlocons();
      if (visible(P.arrivee)) {
        for (let i = 0; i < 12; i++) {
          ctx.save(); ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 10;
          ctx.fillStyle = i % 2 ? '#ffd23f' : '#ff6b6e'; ctx.beginPath(); ctx.arc(28 + i * 31, P.arrivee - 72, 3.5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        }
      }
    }

    // Textes flottants
    textes.forEach((t) => {
      ctx.globalAlpha = clamp(t.vie * 1.5, 0, 1);
      ctx.font = '900 ' + t.taille + 'px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(t.txt, t.x, t.y);
      ctx.fillStyle = t.coul; ctx.fillText(t.txt, t.x, t.y);
    });
    ctx.globalAlpha = 1;

    // Écran : lignes de vitesse (piste noire), vent, décompte, confettis
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (N.noire && C.v > 250 && !N.nuit) {
      ctx.strokeStyle = 'rgba(120,140,170,.35)'; ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const h = hache(i, Math.floor(horloge * 8)), x = h * W, y = ((horloge * 900 + i * 137) % (H + 100)) - 50;
        ctx.beginPath(); ctx.moveTo(x, H - y); ctx.lineTo(x, H - y - 40); ctx.stroke();
      }
    }
    // Barre de progression jusqu'à l'arrivée (point blanc = fantôme)
    const bx = 12, bw = W - 24, by = 54;
    const prog = (y) => clamp((y - 60) / (P.arrivee - 60), 0, 1);
    ctx.fillStyle = 'rgba(23,58,99,.25)'; rrect(ctx, bx, by, bw, 6, 3); ctx.fill();
    ctx.fillStyle = N.nuit ? '#ffd23f' : '#2f6fe0'; rrect(ctx, bx, by, Math.max(6, bw * prog(C.y)), 6, 3); ctx.fill();
    if (fx) { ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#2f6fe0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(bx + bw * prog(fx.y), by + 3, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
    if (C.ventEtat) dessinerVent(C.ventDir, C.ventEtat === 1);
    if (mode === 'decompte') dessinerDecompte();
    dessinerConfettis();
  }

  // Manche à air : annonce (elle clignote) puis rafale (traits de vent) ; dir = sens de la poussée.
  function dessinerVent(dir, annonce) {
    const x = W / 2, y = 84;
    ctx.save();
    ctx.globalAlpha = annonce ? 0.6 + 0.4 * Math.sin(horloge * 14) : 1;
    ctx.fillStyle = 'rgba(255,255,255,.9)'; rrect(ctx, x - 44, y - 22, 88, 44, 14); ctx.fill();
    ctx.fillStyle = '#5b6b80'; ctx.fillRect(x - dir * 30 - 2, y - 16, 4, 32);
    const gonfle = annonce ? 0.5 : 1;
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = i % 2 ? '#ffffff' : '#ff8a1f';
      const x0 = x - dir * 28 + dir * i * 12, ondule = Math.sin(horloge * 12 + i) * 2 * gonfle;
      ctx.beginPath();
      ctx.moveTo(x0, y - 9 + i * 1.5 * (1 - gonfle) + ondule);
      ctx.lineTo(x0 + dir * 12, y - 8 + (i + 1) * 1.5 * (1 - gonfle) + ondule);
      ctx.lineTo(x0 + dir * 12, y + 8 - (i + 1) * 1.5 * (1 - gonfle) + ondule);
      ctx.lineTo(x0, y + 9 - i * 1.5 * (1 - gonfle) + ondule);
      ctx.fill();
    }
    ctx.restore();
    if (!annonce) {
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (let i = 0; i < 9; i++) {
        const h = hache(i, 9), yy = 130 + h * (H - 200);
        const xx = ((horloge * 700 * dir + i * 211) % (W + 200) + W + 200) % (W + 200) - 100;
        ctx.beginPath(); ctx.moveTo(xx, yy); ctx.quadraticCurveTo(xx - dir * 30, yy - 8, xx - dir * 70, yy); ctx.stroke();
      }
    }
  }

  let decompte = 0;
  function dessinerDecompte() {
    const k = Math.ceil(decompte);
    const txt = k > 0 ? I18N.nombre(k) : T('partez');
    const frac = decompte - Math.floor(decompte);
    const sc = k > 0 ? 1 + frac * 0.6 : 1.2;
    ctx.save();
    ctx.translate(W / 2, H * 0.47); ctx.scale(sc, sc);
    ctx.font = '900 ' + (k > 0 ? 84 : 52) + 'px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 10; ctx.strokeStyle = '#ffffff'; ctx.strokeText(txt, 0, 0);
    ctx.fillStyle = k > 0 ? '#2f6fe0' : '#e5383b'; ctx.fillText(txt, 0, 0);
    ctx.restore();
  }
  function dessinerConfettis() {
    confettis.forEach((p) => {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.coul;
      ctx.fillRect(-5, -3, 10, 6); ctx.restore();
    });
  }

  // Décor de l'écran titre (et du fond des menus) : montagnes, sapins, skieur, neige.
  const neigeTitre = [];
  for (let i = 0; i < 70; i++) neigeTitre.push({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 3, v: 0.03 + Math.random() * 0.06, p: Math.random() * 6 });
  function rendreTitre(dt) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const ciel = ctx.createLinearGradient(0, 0, 0, H * 0.6);
    ciel.addColorStop(0, '#5fb0ef'); ciel.addColorStop(1, '#dff2ff');
    ctx.fillStyle = ciel; ctx.fillRect(0, 0, W, H);
    // Soleil
    const sx = W * 0.82, sy = H * 0.2;
    const gs = ctx.createRadialGradient(sx, sy, 10, sx, sy, 90);
    gs.addColorStop(0, 'rgba(255,240,170,1)'); gs.addColorStop(0.35, 'rgba(255,230,140,.6)'); gs.addColorStop(1, 'rgba(255,230,140,0)');
    ctx.fillStyle = gs; ctx.fillRect(sx - 90, sy - 90, 180, 180);
    // Montagnes (deux plans)
    const mont = (base, pics, coul, neige) => {
      ctx.fillStyle = coul; ctx.beginPath(); ctx.moveTo(0, H);
      pics.forEach(([px, ph]) => ctx.lineTo(px * W, base - ph * H));
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
      ctx.fillStyle = neige;
      for (let i = 1; i < pics.length - 1; i++) {
        const [px, ph] = pics[i], [ax, ah] = pics[i - 1], [bx, bh] = pics[i + 1];
        if (ph < ah || ph < bh) continue;
        const X = px * W, Y = base - ph * H, k = 0.3;
        ctx.beginPath(); ctx.moveTo(X, Y);
        ctx.lineTo(lerp(X, bx * W, k), lerp(Y, base - bh * H, k));
        ctx.lineTo(lerp(X, bx * W, k * 0.6), lerp(Y, base - bh * H, k) + 8);
        ctx.lineTo(X, Y + 14);
        ctx.lineTo(lerp(X, ax * W, k * 0.6), lerp(Y, base - ah * H, k) + 8);
        ctx.lineTo(lerp(X, ax * W, k), lerp(Y, base - ah * H, k));
        ctx.closePath(); ctx.fill();
      }
    };
    mont(H * 0.56, [[-0.05, 0.05], [0.12, 0.26], [0.28, 0.12], [0.45, 0.33], [0.62, 0.15], [0.8, 0.29], [1.05, 0.08]], '#9dbde3', '#ffffff');
    mont(H * 0.62, [[-0.05, 0.02], [0.2, 0.16], [0.38, 0.06], [0.58, 0.2], [0.78, 0.07], [0.95, 0.17], [1.1, 0.03]], '#7aa2d4', '#f4fbff');
    // Pente enneigée
    ctx.fillStyle = '#f6fbff';
    ctx.beginPath(); ctx.moveTo(0, H * 0.58); ctx.quadraticCurveTo(W * 0.5, H * 0.5, W, H * 0.6); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    const ombre = ctx.createLinearGradient(0, H * 0.55, 0, H);
    ombre.addColorStop(0, 'rgba(160,200,235,0)'); ombre.addColorStop(1, 'rgba(160,200,235,.45)');
    ctx.fillStyle = ombre; ctx.fillRect(0, H * 0.5, W, H * 0.5);
    // Sapins sur les côtés
    const echelle = Math.min(W, H * 0.6) / 400;
    [[0.06, 0.63, 1.1], [0.16, 0.67, 1.4], [0.02, 0.74, 1.8], [0.9, 0.64, 1.15], [0.97, 0.7, 1.6], [0.84, 0.76, 1.9], [0.12, 0.83, 2.2], [0.93, 0.86, 2.3]]
      .forEach(([px, py, s]) => dessinerSapin(ctx, px * W, py * H, s * echelle));
    // Portes qui descendent la pente (perspective)
    const portesTitre = [[0.36, 0.6, 0.55, 1], [0.6, 0.66, 0.75, 0], [0.38, 0.74, 1, 1], [0.64, 0.84, 1.3, 0]];
    portesTitre.forEach(([px, py, s, coul]) => {
      ctx.save(); ctx.translate(px * W, py * H); ctx.scale(s * echelle * 1.4, s * echelle * 1.4);
      dessinerPorte(ctx, { y: 0, l: 70, coul, etat: 0 }, 0, 1, horloge, false);
      ctx.restore();
    });
    // Skieur qui zigzague, avec gerbe de neige
    const zig = Math.sin(horloge * 1.3);
    const kx = W * (0.5 + zig * 0.16), ky = H * (W < 600 ? 0.6 : 0.64) + Math.cos(horloge * 2.6) * 6;
    const angT = Math.cos(horloge * 1.3) * 0.7;
    ctx.save();
    for (let i = 0; i < 6; i++) {
      const a = horloge * 5 + i;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + 0.5 * Math.sin(a)) + ')';
      ctx.beginPath(); ctx.arc(kx - angT * 40 * echelle - i * 6 * Math.sign(angT) * echelle, ky + 6 - i * 3, (5 - i * 0.6) * echelle * 1.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.translate(kx, ky); ctx.scale(echelle * 2.6, echelle * 2.6);
    dessinerSkieur(ctx, 0, 0, 0, angT, tenueActuelle(), { temps: horloge });
    ctx.restore();
    // Flocons dorés qui brillent
    [[0.25, 0.48], [0.7, 0.44], [0.52, 0.38]].forEach(([px, py], i) => dessinerFlocon(ctx, px * W, py * H + Math.sin(horloge * 2 + i) * 6, 12 * echelle * 1.4, horloge * 0.8 + i, '#f5b301', true));
    // Neige qui tombe
    ctx.fillStyle = '#ffffff';
    neigeTitre.forEach((f) => {
      f.y += f.v * dt; if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); }
      ctx.beginPath(); ctx.arc((f.x + Math.sin(horloge + f.p) * 0.01) * W, f.y * H, f.r, 0, Math.PI * 2); ctx.fill();
    });
    dessinerConfettis();
  }

  // ------------------------------------------------------------------------
  // 8. Écrans
  // ------------------------------------------------------------------------
  const ECRANS = ['ecran-titre', 'ecran-niveaux', 'ecran-vestiaire', 'ecran-tuto', 'ecran-pause', 'ecran-fin'];
  function montrer(id) { ECRANS.forEach((e) => { $(e).hidden = e !== id; }); }
  const ETOILE_SVG = (plein, taille) => '<svg viewBox="0 0 24 24" aria-hidden="true"' + (taille ? ' width="' + taille + '" height="' + taille + '"' : '') + '><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z" fill="' + (plein ? '#ffc61a' : '#d5dee8') + '" stroke="' + (plein ? '#d89a00' : '#b8c6d6') + '" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  const FLOCON_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><g stroke="#e6a800" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/></g></svg>';
  const CADENAS_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2.5" fill="#9fb2c6"/><path d="M8 10V7a4 4 0 018 0v3" stroke="#9fb2c6" stroke-width="2.6" fill="none"/></svg>';
  const RETOUR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="#173a63" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const totalEtoiles = () => NIVEAUX.reduce((s, _, i) => s + (save.etoiles[i] || 0), 0);
  const totalFlocons = () => NIVEAUX.reduce((s, _, i) => s + (save.flocons[i] || 0), 0);
  const maxFlocons = () => NIVEAUX.reduce((s, N) => s + (N.flocons || 0), 0);
  const debloque = (n) => n === 0 || (save.etoiles[n - 1] || 0) > 0;
  function prochainNiveau() {
    for (let i = 0; i < NIVEAUX.length; i++) if (!(save.etoiles[i] > 0)) return i;
    return NIVEAUX.length - 1;
  }
  const objetDispo = (o) => (o.etoiles ? totalEtoiles() >= o.etoiles : true) && (o.flocons ? totalFlocons() >= o.flocons : true);

  // Sauvegarde de la progression sur le site (module JEL_SAVE) : niveau où
  // reprendre (à partir de 1), écrit à chaque niveau réussi et à la fermeture
  // de la page pendant une course.
  const JEU = 'slalom-des-flocons';
  let effacerTitre = null;
  function majEffacerTitre() { if (effacerTitre) effacerTitre.maj(); }
  JEL_SAVE.surFermeture(() => {
    if (!course || !['course', 'decompte', 'pause', 'tuto', 'fin'].includes(mode)) return;
    if (course.finie && course.gagne) return; // déjà enregistré par finCourse
    JEL_SAVE.save(JEU, { niveau: course.n + 1 });
  });

  function allerTitre() {
    mode = 'titre';
    arreterHud();
    montrer('ecran-titre');
    if (!effacerTitre) {
      const zone = document.createElement('div');
      zone.style.cssText = 'text-align:center;margin-top:8px';
      document.querySelector('.panneau-titre .ligne').after(zone);
      effacerTitre = JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: zone });
    }
    majEffacerTitre();
    const e = totalEtoiles();
    $('titre-progres').textContent = e > 0 ? T('titre_progres', { e, max: NIVEAUX.length * 3, n: prochainNiveau() + 1 }) : '';
    $('b-jouer').focus({ preventScroll: true });
  }

  function compteursHtml() {
    return '<span>' + ETOILE_SVG(true, 18) + I18N.nombre(totalEtoiles()) + ' / ' + I18N.nombre(NIVEAUX.length * 3) + '</span>' +
      '<span>' + FLOCON_SVG + I18N.nombre(totalFlocons()) + ' / ' + I18N.nombre(maxFlocons()) + '</span>';
  }

  function allerNiveaux() {
    mode = 'niveaux';
    arreterHud();
    montrer('ecran-niveaux');
    $('niveaux-compteurs').innerHTML = compteursHtml();
    const liste = $('liste-niveaux');
    liste.innerHTML = '';
    const suivant = prochainNiveau();
    GROUPES.forEach((g) => {
      const div = document.createElement('div'); div.className = 'groupe';
      const h3 = document.createElement('h3');
      const forme = g.forme === 'losange' ? '<path d="M12 2l10 10-10 10L2 12z" fill="' + g.couleur + '"/>'
        : g.forme === 'lune' ? '<path d="M15 3a9 9 0 100 18 7 7 0 010-18z" fill="#ffd23f" stroke="' + g.couleur + '" stroke-width="2"/>'
        : '<circle cx="12" cy="12" r="10" fill="' + g.couleur + '"/>';
      h3.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + forme + '</svg>';
      const titre = document.createElement('span'); titre.textContent = T(g.cle); h3.appendChild(titre);
      div.appendChild(h3);
      if (g.cle === 'zone_nuit' && !debloque(g.de)) {
        const p = document.createElement('p'); p.className = 'petit'; p.style.margin = '0 4px 8px'; p.textContent = T('nuit_bloquee');
        div.appendChild(p);
      }
      const grille = document.createElement('div'); grille.className = 'grille';
      for (let n = g.de; n <= g.a; n++) {
        const b = document.createElement('button'); b.type = 'button';
        const ouvert = debloque(n);
        b.className = 'case-niveau' + (ouvert ? '' : ' ferme') + (ouvert && n === suivant && !(save.etoiles[n] > 0) ? ' suivant' : '');
        if (ouvert) {
          const et = save.etoiles[n] || 0;
          b.innerHTML = '<span class="num">' + I18N.nombre(n + 1) + '</span><span class="mini-etoiles">' + [0, 1, 2].map((k) => ETOILE_SVG(k < et)).join('') + '</span>' +
            (save.records[n] ? '<span class="rec">' + fmtTemps(save.records[n]) + '</span>' : '');
          b.setAttribute('aria-label', T('aria_niveau', { n: n + 1, nom: T('niv_' + (n + 1)), e: et }));
          b.addEventListener('click', () => { SONS.clic(); lancerNiveau(n); });
        } else {
          b.innerHTML = CADENAS_SVG;
          b.setAttribute('aria-label', T('aria_niveau_ferme', { n: n + 1 }));
          b.addEventListener('click', () => { SONS.ratee(); b.animate([{ transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'none' }], { duration: 200 }); });
        }
        grille.appendChild(b);
      }
      div.appendChild(grille);
      liste.appendChild(div);
    });
    const cible = liste.querySelector('.suivant');
    if (cible) { liste.scrollTop = Math.max(0, cible.offsetTop - liste.clientHeight / 2); cible.focus({ preventScroll: true }); }
  }

  // Vestiaire : aperçu animé et objets à débloquer
  function allerVestiaire() {
    mode = 'vestiaire';
    montrer('ecran-vestiaire');
    $('vestiaire-compteurs').innerHTML = compteursHtml();
    remplirVestiaire();
  }
  function conditionHtml(o) {
    if (o.etoiles) return '<span class="cond">' + ETOILE_SVG(true, 14) + I18N.nombre(o.etoiles) + '</span>';
    if (o.flocons) return '<span class="cond">' + FLOCON_SVG.replace(/18/g, '14') + I18N.nombre(o.flocons) + '</span>';
    return '';
  }
  function remplirVestiaire() {
    const remplir = (conteneur, items, choisi, nomCle, dessin, choisir) => {
      const div = $(conteneur); div.innerHTML = '';
      items.forEach((o) => {
        const b = document.createElement('button'); b.type = 'button';
        const dispo = objetDispo(o);
        b.className = 'objet' + (choisi(o) ? ' choisi' : '') + (dispo ? '' : ' ferme');
        const c = document.createElement('canvas'); c.width = 108; c.height = 88;
        const k = c.getContext('2d'); dessin(k, o, dispo);
        b.appendChild(c);
        const nom = document.createElement('span'); nom.textContent = T(nomCle(o)); b.appendChild(nom);
        if (!dispo) { const s = document.createElement('span'); s.innerHTML = conditionHtml(o); b.appendChild(s.firstChild); }
        b.setAttribute('aria-label', dispo ? T(nomCle(o)) : T('aria_objet_ferme', { nom: T(nomCle(o)) }));
        b.setAttribute('aria-pressed', choisi(o) ? 'true' : 'false');
        b.addEventListener('click', () => {
          if (!dispo) { SONS.ratee(); return; }
          choisir(o); sauver(); SONS.porte(2); remplirVestiaire();
        });
        div.appendChild(b);
      });
    };
    remplir('objets-mode', [{ id: 'skis' }, Object.assign({ id: 'luge' }, LUGE)], (o) => (o.id === 'luge') === !!save.luge,
      (o) => 'vest_mode_' + o.id,
      (k, o, dispo) => { k.translate(54, 70); k.scale(1.3, 1.3); k.globalAlpha = dispo ? 1 : 0.4; dessinerSkieur(k, 0, 0, 0, 0.25, { bonnet: save.bonnet, skis: couleurSkis(), luge: o.id === 'luge' }, { sansOmbre: true }); },
      (o) => { save.luge = o.id === 'luge'; });
    remplir('objets-bonnets', BONNETS, (o) => o.id === save.bonnet, (o) => 'bonnet_' + o.id,
      (k, o, dispo) => { k.translate(54, 54); k.scale(3.2, 3.2); k.globalAlpha = dispo ? 1 : 0.4; k.fillStyle = '#8a5a3c'; k.beginPath(); k.arc(0, 1, 7, 0, Math.PI * 2); k.fill(); dessinerBonnet(k, o.id, 7.4, 0); },
      (o) => { save.bonnet = o.id; });
    remplir('objets-skis', SKIS, (o) => o.id === save.skis, (o) => 'skis_' + o.id,
      (k, o, dispo) => { k.translate(54, 44); k.rotate(-0.5); k.globalAlpha = dispo ? 1 : 0.4; k.fillStyle = o.couleur; k.strokeStyle = 'rgba(0,0,0,.35)'; [-8, 8].forEach((dx) => { rrect(k, dx - 4, -34, 8, 68, 4); k.fill(); k.stroke(); }); },
      (o) => { save.skis = o.id; });
  }
  function rendreApercu() {
    const c = $('apercu'), k = c.getContext('2d');
    k.setTransform(1, 0, 0, 1, 0, 0); k.clearRect(0, 0, 300, 300);
    k.translate(150, 225); k.scale(3.4, 3.4);
    dessinerSkieur(k, 0, 0, Math.max(0, Math.sin(horloge * 2.2)) * 10, Math.sin(horloge * 1.5) * 0.5, tenueActuelle(), { temps: horloge });
  }

  // ---------- Lancement d'un niveau : tutoriels, puis décompte ----------
  let fileTutos = [];
  function lancerNiveau(n) {
    initAudio();
    nouvelleCourse(n);
    const N = NIVEAUX[n];
    fileTutos = N.nouv.filter((k) => !save.vus[k]);
    if (course.fantome && !save.vus.fantome) fileTutos.push('fantome');
    $('hud').hidden = false;
    $('b-saut').hidden = !(N.bosses || N.flocons || N.marmottes);
    majHud(true);
    montrer(null);
    if (fileTutos.length) montrerTuto(fileTutos.shift());
    else demarrerDecompte();
  }

  let tutoActuel = null, tutoDebut = 0;
  function montrerTuto(cle) {
    mode = 'tuto';
    tutoActuel = cle; tutoDebut = horloge;
    montrer('ecran-tuto');
    $('tuto-titre').textContent = T('tuto_' + cle + '_titre');
    const ol = $('tuto-etapes'); ol.innerHTML = '';
    for (let i = 1; i <= TUTOS[cle]; i++) { const li = document.createElement('li'); li.textContent = T('tuto_' + cle + '_' + i); ol.appendChild(li); }
  }
  function fermerTuto() {
    if (mode !== 'tuto' || horloge - tutoDebut < 0.4) return;
    SONS.clic();
    save.vus[tutoActuel] = true; sauver();
    if (fileTutos.length) { montrerTuto(fileTutos.shift()); return; }
    montrer(null);
    if (course && !course.depart) demarrerDecompte();
    else { mode = 'pause'; montrer('ecran-pause'); $('b-reprendre').focus({ preventScroll: true }); }
  }

  function demarrerDecompte() {
    mode = 'decompte';
    decompte = 3;
    montrer(null);
    const P = course.P;
    const b = $('bandeau');
    b.innerHTML = '';
    const titre = document.createElement('b'); titre.textContent = T('bandeau_niveau', { n: course.n + 1, nom: T('niv_' + (course.n + 1)) });
    const obj = document.createElement('span');
    obj.innerHTML = ETOILE_SVG(true) + ETOILE_SVG(true) + ETOILE_SVG(true);
    obj.appendChild(document.createTextNode(' ' + T('objectif_or', { t: fmtTemps(P.or) })));
    const obj2 = document.createElement('span'); obj2.textContent = T('objectif_portes', { n: P.portes.length, max: course.N.rat });
    b.append(titre, obj, document.createElement('br'), obj2);
    b.hidden = false;
    SONS.bip(false);
  }

  function majHud(force) {
    const C = course; if (!C) return;
    const txt = fmtTemps(C.temps + C.ratees * PEN);
    const ch = $('chrono');
    if (force || ch.textContent !== txt) ch.textContent = txt;
    if (force) {
      $('hud-portes').textContent = I18N.nombre(C.passees) + '/' + I18N.nombre(C.P.portes.length);
      const r = $('hud-ratees'); r.innerHTML = '';
      for (let i = 0; i < C.N.rat; i++) { const k = document.createElement('i'); if (i < C.ratees) k.className = 'plein'; r.appendChild(k); }
      r.setAttribute('aria-label', T('aria_ratees', { n: C.ratees, max: C.N.rat }));
      $('pastille-flocons').hidden = !C.P.totalFlocons;
      $('hud-flocons').textContent = I18N.nombre(C.flocons) + '/' + I18N.nombre(C.P.totalFlocons);
    }
  }
  function arreterHud() {
    $('hud').hidden = true; $('b-saut').hidden = true; $('bandeau').hidden = true; $('ecart').className = '';
    regierGlisse(0, 900);
  }

  // ---------- Pause ----------
  function mettrePause() {
    if (mode !== 'course' && mode !== 'decompte') return;
    mode = 'pause';
    pause.avant = course.depart ? 'course' : 'decompte';
    regierGlisse(0, 900);
    entree.gauche = entree.droite = entree.doigt = false;
    montrer('ecran-pause');
    $('b-reprendre').focus({ preventScroll: true });
  }
  const pause = { avant: 'course' };
  function reprendre() {
    if (mode !== 'pause') return;
    montrer(null);
    if (pause.avant === 'decompte' || !course.depart) demarrerDecompte();
    else mode = 'course';
  }

  // ---------- Fin de niveau ----------
  function finCourse(gagne) {
    const C = course;
    if (C.finie) return;
    C.finie = true;
    C.gagne = gagne;
    regierGlisse(0, 900);
    $('b-saut').hidden = true;
    const n = C.n, P = C.P, N = C.N;
    const total = C.temps + C.ratees * PEN;
    const res = { gagne, total, brut: C.temps, ratees: C.ratees, chutes: C.chutes, flocons: C.flocons, etoiles: 0 };
    if (gagne) {
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
      SONS.arrivee(); lancerConfettis(90);
      res.etoiles = 1;
      if (total <= P.argent) res.etoiles = 2;
      if (total <= P.or && C.ratees === 0) res.etoiles = 3;
      const avantE = totalEtoiles(), avantF = totalFlocons();
      const ancienRecord = save.records[n];
      res.ancienRecord = ancienRecord;
      res.record = !ancienRecord || total < ancienRecord;
      res.fantomeBattu = !!C.fantome && res.record;
      res.ancienesEtoiles = save.etoiles[n] || 0;
      if (res.record) { save.records[n] = Math.round(total * 10) / 10; ecrireFantome(n, C.enreg.slice()); }
      save.etoiles[n] = Math.max(save.etoiles[n] || 0, res.etoiles);
      save.flocons[n] = Math.max(save.flocons[n] || 0, C.flocons);
      res.nouveautes = [...BONNETS.map((o) => ['bonnet_', o]), ...SKIS.map((o) => ['skis_', o]), ['vest_mode_', Object.assign({ id: 'luge' }, LUGE)]]
        .filter(([, o]) => (o.etoiles || o.flocons) && objetDispo(o) && !((o.etoiles ? avantE >= o.etoiles : true) && (o.flocons ? avantF >= o.flocons : true)))
        .map(([p, o]) => T(p + o.id));
      res.dernier = n === NIVEAUX.length - 1;
      if (res.dernier) save.fini = true;
      sauver();
      JEL_SAVE.save(JEU, { niveau: Math.min(NIVEAUX.length, n + 2), etoiles: etoilesNiveaux() });
      // Jeu terminé (toutes les pistes gagnées, maintenant ou avant) : total des meilleures étoiles.
      if (etoilesNiveaux().every((e) => e > 0)) {
        if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
      }
    } else {
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: n + 1 });
      SONS.defaite(); secousse = 8;
      C.chute = 0.9; C.rot = 0;
    }
    setTimeout(() => { if (course === C && (mode === 'course' || mode === 'pause')) montrerFin(res); }, gagne ? 1300 : 1000);
  }

  function montrerFin(res) {
    if (!course) return;
    mode = 'fin';
    arreterHud();
    montrer('ecran-fin');
    const C = course, n = C.n, P = C.P;
    $('fin-titre').textContent = res.gagne ? T(res.etoiles === 3 ? 'victoire_3' : res.etoiles === 2 ? 'victoire_2' : 'victoire_1') : T('defaite_titre');
    const et = $('fin-etoiles'); et.innerHTML = [0, 1, 2].map((k) => ETOILE_SVG(k < res.etoiles)).join('');
    const svgs = et.querySelectorAll('svg');
    svgs.forEach((s, k) => setTimeout(() => { s.classList.add('vue'); if (k < res.etoiles) SONS.etoile(k); }, 350 + k * 380));
    // Chrono qui défile
    const tot = $('fin-total');
    const debut = performance.now(), cible = res.total;
    (function defiler() {
      const k = Math.min(1, (performance.now() - debut) / 900);
      tot.textContent = fmtTemps(cible * (1 - Math.pow(1 - k, 3)));
      if (k < 1 && mode === 'fin') requestAnimationFrame(defiler);
    })();
    const det = $('fin-details'); det.innerHTML = '';
    const ligne = (cle, val) => { const a = document.createElement('span'); a.textContent = T(cle); const b = document.createElement('b'); b.textContent = val; det.append(a, b); };
    ligne('fin_temps', fmtTemps(res.brut));
    ligne('fin_portes', I18N.nombre(C.passees) + '/' + I18N.nombre(P.portes.length));
    ligne('fin_penalites', T('penalite', { s: res.ratees * PEN }));
    if (P.totalFlocons) ligne('fin_flocons', I18N.nombre(res.flocons) + '/' + I18N.nombre(P.totalFlocons));
    ligne('fin_chutes', I18N.nombre(res.chutes));
    const notes = $('fin-notes'); notes.innerHTML = '';
    const note = (txt, cls) => { const p = document.createElement('p'); p.className = 'note ' + (cls || ''); p.textContent = txt; notes.appendChild(p); };
    if (res.gagne) {
      if (res.record && res.ancienRecord) { note(T('nouveau_record', { t: fmtTemps(res.ancienRecord) }), 'or'); setTimeout(SONS.record, 1500); }
      else if (res.record) note(T('premier_record'), 'or');
      else note(T('record_actuel', { t: fmtTemps(save.records[n]) }), 'bleu');
      if (res.fantomeBattu) note(T('fantome_battu'), 'vert');
      if (res.etoiles < 3) note(res.ratees > 0 ? T('conseil_3_portes', { t: fmtTemps(P.or) }) : T('conseil_3_temps', { t: fmtTemps(P.or) }), 'bleu');
      res.nouveautes.forEach((nom) => note(T('tenue_debloquee', { nom }), 'vert'));
      if (n === 19 && res.ancienesEtoiles === 0) note(T('nuit_debloquee'), 'vert');
    } else {
      note(T('defaite_texte', { n: res.ratees }), '');
      note(T(course.N.brume ? 'conseil_brume' : course.N.nuit ? 'conseil_nuit' : 'conseil_portes'), 'bleu');
    }
    const boutons = $('fin-boutons'); boutons.innerHTML = '';
    const bouton = (cle, cls, f) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'bouton ' + (cls || ''); b.textContent = T(cle); b.addEventListener('click', () => { SONS.clic(); f(); }); boutons.appendChild(b); return b; };
    let premier;
    if (res.gagne && res.dernier) {
      premier = bouton('voir_bilan', 'principal', () => montrerBilan());
      bouton('rejouer', 'bleu', () => lancerNiveau(n));
    } else if (res.gagne) {
      premier = bouton('niveau_suivant', 'principal', () => lancerNiveau(n + 1));
      bouton('rejouer', 'bleu', () => lancerNiveau(n));
    } else {
      premier = bouton('reessayer', 'principal', () => lancerNiveau(n));
    }
    const l = document.createElement('div'); l.className = 'ligne';
    boutons.appendChild(l);
    const b1 = bouton('niveaux', '', allerNiveaux), b2 = bouton('accueil', '', allerTitre);
    l.append(b1, b2);
    premier.focus({ preventScroll: true });
  }

  // Bilan final (après le niveau 24)
  function montrerBilan() {
    mode = 'fin';
    montrer('ecran-fin');
    lancerConfettis(160);
    SONS.record();
    $('fin-titre').textContent = T('bilan_titre');
    const e = totalEtoiles();
    $('fin-etoiles').innerHTML = [0, 1, 2].map((k) => ETOILE_SVG(e >= (k + 1) * 24)).join('');
    $('fin-etoiles').querySelectorAll('svg').forEach((s) => s.classList.add('vue'));
    const somme = NIVEAUX.reduce((s, _, i) => s + (save.records[i] || 0), 0);
    $('fin-total').textContent = fmtTemps(somme);
    const det = $('fin-details'); det.innerHTML = '';
    const ligne = (cle, val) => { const a = document.createElement('span'); a.textContent = T(cle); const b = document.createElement('b'); b.textContent = val; det.append(a, b); };
    ligne('bilan_etoiles', I18N.nombre(e) + '/' + I18N.nombre(NIVEAUX.length * 3));
    ligne('bilan_flocons', I18N.nombre(totalFlocons()) + '/' + I18N.nombre(maxFlocons()));
    ligne('bilan_trois', I18N.nombre(NIVEAUX.filter((_, i) => save.etoiles[i] === 3).length) + '/' + I18N.nombre(NIVEAUX.length));
    ligne('bilan_temps', fmtTemps(somme));
    const notes = $('fin-notes'); notes.innerHTML = '';
    const p = document.createElement('p'); p.className = 'note or'; p.textContent = T(e >= NIVEAUX.length * 3 ? 'bilan_parfait' : 'bilan_texte'); notes.appendChild(p);
    const boutons = $('fin-boutons'); boutons.innerHTML = '';
    const bouton = (cle, cls, f) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'bouton ' + (cls || ''); b.textContent = T(cle); b.addEventListener('click', () => { SONS.clic(); f(); }); boutons.appendChild(b); return b; };
    const premier = bouton('rejouer_tout', 'principal', () => lancerNiveau(0));
    bouton('niveaux', 'bleu', allerNiveaux);
    bouton('vestiaire', '', allerVestiaire);
    premier.focus({ preventScroll: true });
  }

  // ---------- Tutoriel animé : mini-scènes ----------
  function rendreTuto() {
    const c = $('tuto-canvas'), k = c.getContext('2d');
    const t = horloge - tutoDebut;
    k.setTransform(2, 0, 0, 2, 0, 0);
    const cle = tutoActuel;
    const nuit = cle === 'nuit';
    const gr = k.createLinearGradient(0, 0, 0, 180);
    gr.addColorStop(0, nuit ? '#1b2457' : '#f3f9ff'); gr.addColorStop(1, nuit ? '#0d1333' : '#d8ebf9');
    k.fillStyle = gr; k.fillRect(0, 0, 260, 180);
    // Monde miniature : 400 unités ramenées à 260 px
    const s = 0.65;
    k.save(); k.scale(s, s);
    const defil = (t * 160) % 480;
    const portesDemo = [{ y: 150, cx: 140, l: 130, coul: 0, etat: 0 }, { y: 390, cx: 260, l: 130, coul: 1, etat: 0 }];
    const yDemo = (y) => y - defil + (y - defil < -60 ? 480 : 0);
    let skX = 200 + Math.sin(t * 2) * 70, skZ = 0, ang = Math.cos(t * 2) * 0.6;
    const main = { x: null, y: 245, appui: false };
    if (cle === 'glisser' || cle === 'chicane' || cle === 'mobile' || cle === 'fantome' || cle === 'noire') {
      main.x = skX; main.appui = true;
    }
    if (cle === 'glisser' || cle === 'chicane' || cle === 'noire') {
      const serre = cle === 'chicane';
      for (let i = 0; i < (serre ? 4 : 2); i++) {
        const y = serre ? 80 + i * 120 : portesDemo[i].y;
        const g = { y: yDemo(y), cx: serre ? (i % 2 ? 250 : 150) : portesDemo[i].cx, l: 120, coul: i % 2, etat: 0 };
        dessinerPorte(k, g, g.cx, 1, horloge, false);
      }
      if (cle === 'noire') {
        k.strokeStyle = 'rgba(120,140,170,.5)'; k.lineWidth = 3;
        for (let i = 0; i < 6; i++) { const yy = ((t * 900 + i * 90) % 300); k.beginPath(); k.moveTo(40 + i * 60, 280 - yy); k.lineTo(40 + i * 60, 240 - yy); k.stroke(); }
        skX = 200 + Math.sin(t * 3) * 70; ang = Math.cos(t * 3) * 0.6; main.x = skX;
      }
    }
    if (cle === 'mobile') {
      const cxm = 200 + Math.sin(t * 2) * 60;
      dessinerPorte(k, { y: 170, l: 120, coul: 1, etat: 0 }, cxm, 1, horloge, false);
      skX = cxm; main.x = skX; ang = Math.cos(t * 2) * 0.5;
      k.strokeStyle = '#2f6fe0'; k.lineWidth = 3;
      k.beginPath(); k.moveTo(120, 190); k.lineTo(280, 190); k.moveTo(130, 184); k.lineTo(120, 190); k.lineTo(130, 196); k.moveTo(270, 184); k.lineTo(280, 190); k.lineTo(270, 196); k.stroke();
    }
    if (cle === 'fantome') {
      const fx = 200 + Math.sin(t * 2 - 0.5) * 70;
      k.save(); k.globalAlpha = 0.45; dessinerSkieur(k, fx, 120, 0, Math.cos(t * 2 - 0.5) * 0.6, tenueActuelle(), { fantome: true }); k.restore();
    }
    if (cle === 'bosse' || cle === 'flocon' || cle === 'marmotte') {
      // Cycle de 2 s : l'obstacle arrive, la main touche, le skieur saute.
      const cyc = t % 2;
      const yObj = 300 - cyc * 160;
      skX = 200; ang = 0;
      if (cle === 'bosse') dessinerBosses(k, { y: yObj }, 0, 400);
      if (cle === 'marmotte') dessinerMarmotte(k, { x: 200 + Math.sin(t * 3) * 30, y: yObj, etat: 'marche', k: 0, sp: 3, ph: 0 }, t);
      if (cle === 'flocon') { dessinerBosses(k, { y: yObj - 40 }, 0, 400); if (cyc < 1.35) dessinerFlocon(k, 200, yObj + 40 - 42, 11, t, '#f5b301', true); }
      const saut = cyc > 0.75 && cyc < 1.5 ? (cyc - 0.75) / 0.75 : -1;
      if (saut >= 0) skZ = Math.sin(saut * Math.PI) * 48;
      main.x = 290; main.y = 240; main.appui = cyc > 0.65 && cyc < 0.85;
    }
    if (cle === 'sapin') {
      const yS = 300 - (t % 2.4) * 140;
      dessinerSapin(k, 200, yS, 1);
      dessinerSapin(k, 60, yS + 60, 0.9);
      const ecart = clamp((260 - yS) / 120, 0, 1);
      skX = 200 + Math.sin(clamp((240 - yS) / 160, 0, 1) * Math.PI) * 90 * ecart * 1.2;
      ang = 0.5 * Math.cos(clamp((240 - yS) / 160, 0, 1) * Math.PI);
      main.x = skX; main.appui = true;
    }
    if (cle === 'glace') {
      dessinerGlace(k, { x: 200, y: 150, rx: 140, ry: 60 }, t);
      skX = 200 + Math.sin(t * 1.2) * 110; ang = Math.cos(t * 1.2) * 0.3;
      main.x = 200 + Math.sin(t * 2.4) * 110; main.appui = true;
    }
    if (cle === 'brouillard') {
      dessinerPorte(k, { y: 230, l: 120, coul: 0, etat: 0 }, 220, 1, horloge, false);
      k.fillStyle = 'rgba(232,238,244,.93)'; k.fillRect(0, 160, 400, 200);
      dessinerPorte(k, { y: 230, l: 120, coul: 0, etat: 0 }, 220, Math.sin(horloge * 7) > -0.2 ? 1 : 0.3, horloge, true);
      skX = 200 + Math.sin(t) * 20;
    }
    if (cle === 'nuit') {
      dessinerPorte(k, { y: 210, l: 120, coul: 1, etat: 0 }, 210, 1, horloge, true);
      dessinerFlocon(k, 110, 190, 11, t, '#f5b301', true);
    }
    if (cle === 'vent') {
      const cyc = t % 3;
      const pousse = cyc > 1 && cyc < 2.4 ? Math.sin((cyc - 1) / 1.4 * Math.PI) : 0;
      skX = 200 + pousse * 40 - (cyc > 1.2 && cyc < 2.4 ? 0 : 0);
      ang = -pousse * 0.6;
      main.x = 200 - pousse * 90; main.appui = pousse > 0.05;
      k.save(); k.translate(200, 40);
      k.fillStyle = '#5b6b80'; k.fillRect(-32, -16, 4, 32);
      for (let i = 0; i < 4; i++) { k.fillStyle = i % 2 ? '#fff' : '#ff8a1f'; k.fillRect(-28 + i * 12, -8 + (cyc < 1 ? i * 1.5 : 0), 12, 16 - (cyc < 1 ? i * 3 : 0)); }
      k.restore();
      if (pousse > 0) { k.strokeStyle = 'rgba(120,160,210,.8)'; k.lineWidth = 3; for (let i = 0; i < 4; i++) { const xx = ((t * 400 + i * 100) % 440) - 20; k.beginPath(); k.moveTo(xx, 80 + i * 40); k.lineTo(xx - 50, 80 + i * 40); k.stroke(); } }
    }
    dessinerSkieur(k, skX, 120, skZ, ang, tenueActuelle(), { temps: horloge });
    if (nuit) {
      const v = k.createRadialGradient(skX, 120, 30, skX, 120, 150);
      v.addColorStop(0, 'rgba(8,14,44,0)'); v.addColorStop(1, 'rgba(8,14,44,.88)');
      k.fillStyle = v; k.fillRect(0, 0, 400, 280);
      dessinerPorte(k, { y: 210, l: 120, coul: 1, etat: 0 }, 210, 0.9, horloge, true);
      dessinerFlocon(k, 110, 190, 11, t, '#f5b301', true);
      for (let i = 0; i < 12; i++) { k.fillStyle = 'rgba(255,255,220,' + Math.abs(Math.sin(t + i)) + ')'; k.beginPath(); k.arc(hache(i, 1) * 400, hache(1, i) * 280, 1.6, 0, 7); k.fill(); }
    }
    if (main.x !== null) dessinerMain(k, main.x, main.y, 1.2, main.appui);
    k.restore();
  }

  // ------------------------------------------------------------------------
  // 9. Commandes et boucle principale
  // ------------------------------------------------------------------------
  function versMondeX(clientX) {
    const S = Math.min(W / 400, H / 700), offX = (W - 400 * S) / 2;
    return (clientX - offX) / S;
  }
  cv.addEventListener('pointerdown', (e) => {
    initAudio();
    if (mode !== 'course' && mode !== 'decompte') return;
    entree.doigt = true; entree.id = e.pointerId; entree.debut = performance.now();
    entree.x0 = e.clientX; entree.y0 = e.clientY; entree.actif = false;
    entree.doigtX = versMondeX(e.clientX);
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
  });
  cv.addEventListener('pointermove', (e) => {
    if (!entree.doigt || e.pointerId !== entree.id) return;
    entree.doigtX = versMondeX(e.clientX);
    if (Math.abs(e.clientX - entree.x0) > 10 || Math.abs(e.clientY - entree.y0) > 10) entree.actif = true;
  });
  const finDoigt = (e) => {
    if (!entree.doigt || e.pointerId !== entree.id) return;
    const duree = performance.now() - entree.debut;
    const bouge = Math.abs(e.clientX - entree.x0) + Math.abs(e.clientY - entree.y0);
    if (duree < 230 && bouge < 14 && e.type === 'pointerup') sauter();     // toucher rapide = saut
    entree.doigt = false; entree.actif = false;
  };
  cv.addEventListener('pointerup', finDoigt);
  cv.addEventListener('pointercancel', finDoigt);

  $('b-saut').addEventListener('pointerdown', (e) => { e.preventDefault(); initAudio(); sauter(); });
  $('b-saut').addEventListener('click', (e) => { if (e.detail === 0) sauter(); });      // clavier (Entrée)
  $('b-pause').addEventListener('click', () => { SONS.clic(); mettrePause(); });
  document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('b-jouer').addEventListener('click', () => {
    initAudio(); SONS.clic();
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => lancerNiveau(Math.min(NIVEAUX.length, d.niveau) - 1),
      onNouvelle: () => lancerNiveau(prochainNiveau()),
      onEffacer: () => { majEffacerTitre(); lancerNiveau(prochainNiveau()); },
    });
  });
  $('b-niveaux-titre').addEventListener('click', () => { initAudio(); SONS.clic(); allerNiveaux(); });
  $('b-vestiaire-titre').addEventListener('click', () => { initAudio(); SONS.clic(); allerVestiaire(); });
  $('b-retour-niveaux').addEventListener('click', () => { SONS.clic(); allerTitre(); });
  $('b-retour-vestiaire').addEventListener('click', () => { SONS.clic(); allerTitre(); });
  $('b-retour-niveaux').innerHTML = RETOUR_SVG; $('b-retour-vestiaire').innerHTML = RETOUR_SVG;
  $('b-reprendre').addEventListener('click', () => { SONS.clic(); reprendre(); });
  $('b-recommencer').addEventListener('click', () => { SONS.clic(); lancerNiveau(course.n); });
  $('b-aide').addEventListener('click', () => {
    SONS.clic();
    const N = course.N;
    const liste = ['glisser'].concat(Object.keys(TUTOS).filter((k) => k !== 'glisser' && k !== 'fantome' && niveauA(N, k)));
    fileTutos = liste.slice(1);
    montrerTuto(liste[0]);
  });
  $('b-pause-niveaux').addEventListener('click', () => { SONS.clic(); allerNiveaux(); });
  $('b-pause-accueil').addEventListener('click', () => { SONS.clic(); allerTitre(); });
  $('ecran-tuto').addEventListener('click', fermerTuto);
  // Mécaniques présentes dans un niveau (pour revoir l'aide)
  function niveauA(N, k) {
    return ({ chicane: N.chic, bosse: N.bosses, flocon: N.flocons, sapin: N.sapins, glace: N.glace, brouillard: N.brume, noire: N.noire, marmotte: N.marmottes, mobile: N.mobiles, nuit: N.nuit, vent: N.vent })[k];
  }

  document.addEventListener('keydown', (e) => {
    initAudio();
    const c = e.code;
    if (mode === 'tuto') { if (c === 'Space' || c === 'Enter' || c === 'Escape') { e.preventDefault(); fermerTuto(); } return; }
    if (c === 'Escape' || c === 'KeyP') {
      if (mode === 'course' || mode === 'decompte') { e.preventDefault(); mettrePause(); }
      else if (mode === 'pause' && !e.repeat) { e.preventDefault(); reprendre(); }
      return;
    }
    if (mode !== 'course' && mode !== 'decompte') return;
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
    if (c === 'ArrowLeft' || c === 'KeyA') { entree.gauche = true; e.preventDefault(); }
    if (c === 'ArrowRight' || c === 'KeyD') { entree.droite = true; e.preventDefault(); }
    if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') { e.preventDefault(); if (!e.repeat) sauter(); }
    if (c === 'Enter' && document.activeElement === document.body) { e.preventDefault(); sauter(); }
  });
  document.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') entree.gauche = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') entree.droite = false;
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });
  window.addEventListener('blur', () => { entree.gauche = entree.droite = false; });
  window.addEventListener('resize', redimensionner);

  let dernier = performance.now();
  function boucle(maintenant) {
    const dt = Math.min(0.05, Math.max(0, (maintenant - dernier) / 1000));
    dernier = maintenant;
    horloge += dt;
    if (mode === 'course' || mode === 'decompte' || mode === 'pause' || mode === 'tuto' || mode === 'fin') {
      if (course) {
        if (mode === 'decompte') {
          const avant = Math.ceil(decompte);
          decompte -= dt;
          if (Math.ceil(decompte) !== avant && decompte > 0) SONS.bip(false);
          if (decompte <= 0) {
            mode = 'course'; course.depart = true; decompte = 0; SONS.bip(true); demarrerGlisse();
            $('bandeau').hidden = true;
            textes.push({ x: course.x, y: course.y - 60, txt: T('partez'), coul: '#e5383b', taille: 30, vie: 1 });
          }
          majCourse(dt);
        } else if (mode === 'course' || (mode === 'fin' && course.finie)) majCourse(dt);
        if (mode !== 'pause' && mode !== 'tuto') majParticules(dt);
        rendreCourse();
        if (mode === 'course') majHud(false);
      }
      if (mode === 'tuto') rendreTuto();
    } else {
      majParticules(dt);
      rendreTitre(dt);
      if (mode === 'vestiaire') rendreApercu();
    }
    requestAnimationFrame(boucle);
  }

  chargerSauvegarde();
  redimensionner();
  majSon();
  allerTitre();
  requestAnimationFrame(boucle);
})();
</script>
