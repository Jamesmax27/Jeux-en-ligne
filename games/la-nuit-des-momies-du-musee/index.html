<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>

   Le gardien est au centre de la salle. Ce que le faisceau de sa lampe

   Tout le monde du jeu est calculé en « unités » autour du gardien (0, 0) ;
   l'écran n'est qu'une transformation (échelle u, origine g).

(function () {

  /* ---------------------------------------------------------------
     Données : créatures, lampes, tenues, nuits
     --------------------------------------------------------------- */
  // v : vitesse (unités/s) ; pv : secondes de faisceau large pour la défaire.
  const TYPES = {

      if (s.scelle >= 1) { s.etat = 'ferme'; s.scelle = 0; s.ouvre = 0; g.pts += 150; flottant(g, s.x, s.y, 150); SON.scelle(); annonce(t('msg.scelle')); }
      else if (s.ouvre >= 1) {
        s.etat = 'ferme'; s.ouvre = 0; s.scelle = 0; s.ouvert = 1.2; SON.grince();
        const m = creer(Math.random() < 0.3 && g.n >= 9 ? 'rampante' : 'momie', s.x * 0.85, s.y * 0.85, vitesseNuit(g));
        m.pause = 0.4; g.ents.push(m);
        for (let i = 0; i < 14; i++) particule(g, s.x, s.y, '#c8b58a', 1);
      }
    }
    g.sarcos.forEach((s) => { if (s.ouvert) s.ouvert = Math.max(0, s.ouvert - dt); });

    // Boîtes de piles
    for (const b of g.boites) b.vie -= dt;
    g.boites = g.boites.filter((b) => b.vie > 0);

    // Amulette cachée
    if (g.amulette) {
      const a = g.amulette;
      a.vie -= dt;
      if (eclairage(g, a.x, a.y, 8) > 0) a.charge += dt;
      if (a.charge >= 0.8) {
        g.amTrouvee = true; g.amulette = null; SON.amulette(); annonce(t('msg.amulette'));
        for (let i = 0; i < 24; i++) particule(g, a.x, a.y, '#ffe08a', 3);
      } else if (a.vie <= 0) g.amulette = null;
    }

    // Particules et textes flottants
    for (const p of g.part) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.vie -= dt; }
    g.part = g.part.filter((p) => p.vie > 0);
    for (const x of g.txt) { x.y -= 22 * dt; x.vie -= dt; }
    g.txt = g.txt.filter((x) => x.vie > 0);
    g.secousse = Math.max(0, g.secousse - dt * 2.5);
    g.flash = Math.max(0, g.flash - dt * 2);
    g.vitrines.forEach((v) => { v.eclat = Math.max(0, v.eclat - dt); });

    if (g.t >= g.T) commencerAube();
  }

  function particule(g, x, y, col, force) {
    const a = Math.random() * TAU, v = (20 + Math.random() * 50) * (force || 1);
    g.part.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 0.5 + Math.random() * 0.7, max: 1.2, col, taille: 1.5 + Math.random() * 2.5 });
  }
  function flottant(g, x, y, n) { g.txt.push({ x, y: y - 16, s: t('plus', { n }), vie: 1.1 }); }

  function defaire(g, e) {
    e.mort = 0.001;
    g.pts += TYPES[e.type].pts; g.vus++;
    flottant(g, e.x, e.y, TYPES[e.type].pts);
    for (let i = 0; i < 18; i++) particule(g, e.x, e.y, i % 3 ? '#e8d8a8' : '#ffd36a', 1.2);
    SON.poussiere();
  }
  function toucherGardien(g, e) {
    e.parti = true;
    if (e.type === 'scarabee') {
      g.pile = Math.max(0, g.pile - 6); SON.ecrase(); annonce(t('msg.ronge'), true);
      g.secousse = Math.max(g.secousse, 0.3);
      return;
    }
    g.coeurs--; g.secousse = 1; g.flash = 1; SON.coeur();
    for (let i = 0; i < 20; i++) particule(g, 0, 0, '#d9483b', 1.5);
    if (g.coeurs <= 0) { finNuit(false); return; }
    annonce(t('msg.coeur'), true);
  }
  // Toucher : écraser un scarabée, chasser une âme, ramasser une boîte de piles.
  function frapper(g, x, y, rayonTouche) {
    let best = null, bd = rayonTouche;
    for (const e of g.ents) {
      if (e.mort || (e.type !== 'scarabee' && e.type !== 'ame')) continue;
      const d = Math.hypot(e.x - x, e.y - y) - e.r * 0.5;
      if (d < bd) { bd = d; best = e; }
    }
    for (const b of g.boites) { const d = Math.hypot(b.x - x, b.y - y) - 6; if (d < bd) { bd = d; best = b; } }
    if (!best) return false;
    if (best.vie !== undefined && best.type === undefined) {
      g.boites.splice(g.boites.indexOf(best), 1);
      const gain = 24; g.pile = Math.min(100, g.pile + gain); SON.recharge();
      annonce(t('msg.pileTrouvee', { n: gain }));
      for (let i = 0; i < 14; i++) particule(g, best.x, best.y, '#c8ef6f', 1.2);
      return true;
    }
    if (best.type === 'scarabee') {
      best.mort = 0.001; best.ecrase = true; g.pts += TYPES.scarabee.pts; flottant(g, best.x, best.y, TYPES.scarabee.pts);
      for (let i = 0; i < 8; i++) particule(g, best.x, best.y, '#2f8f6e', 0.8);
      SON.ecrase();
    } else {
      best.taps--; best.coup = 0.25; SON.ame();
      const d = Math.hypot(best.x, best.y) || 1;
      best.x += best.x / d * 30; best.y += best.y / d * 30;
      for (let i = 0; i < 8; i++) particule(g, best.x, best.y, '#bfe8ff', 0.8);
      if (best.taps <= 0) defaire(g, best);
    }
    return true;
  }

  /* ---------------------------------------------------------------
     Dessin
     --------------------------------------------------------------- */
  const COULEURS_AILE = {
    crypte:  { sol1: '#3b2f22', sol2: '#33281d', mur: '#1c150e', trait: '#5a4630', deco: '#8a6b3c' },
    statues: { sol1: '#34343b', sol2: '#2b2b31', mur: '#16161b', trait: '#55555f', deco: '#8a8a96' },
    reserve: { sol1: '#3a2a1c', sol2: '#302216', mur: '#1a120b', trait: '#5e4429', deco: '#7a5a34' },
    hall:    { sol1: '#2c2631', sol2: '#241f29', mur: '#120f15', trait: '#4c4253', deco: '#a3864a' },
  };

  function dessinerFond(g) {
    const cle = [W, H, DPR, U, g.L.aile, modeJeu].join(',');
    if (fond && fondCle === cle) return;
    fondCle = cle;
    fond = fond || document.createElement('canvas');
    fond.width = cv.width; fond.height = cv.height;
    const c = fond.getContext('2d');
    const C = COULEURS_AILE[g.L.aile];
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = C.mur; c.fillRect(0, 0, fond.width, fond.height);
    vue(c);
    // Murs hors de la salle : étagères et briques
    const x0 = -GX / U, x1 = (W - GX) / U, y0 = -GY / U, y1 = (H - GY) / U;
    c.strokeStyle = 'rgba(255,255,255,.04)'; c.lineWidth = 1;
    for (let y = y0; y < y1; y += 18) { c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke(); }
    // Sol
    c.save();
    c.beginPath(); c.rect(SALLE.g, SALLE.h, SALLE.d - SALLE.g, SALLE.b - SALLE.h); c.clip();
    const pas = g.L.aile === 'reserve' ? 22 : 40;
    const r = rng(77);
    for (let x = Math.floor(SALLE.g / pas) * pas; x < SALLE.d; x += pas) {
      for (let y = Math.floor(SALLE.h / pas) * pas; y < SALLE.b; y += pas) {
        const pair = (Math.round(x / pas) + Math.round(y / pas)) % 2 === 0;
        if (g.L.aile === 'reserve') { c.fillStyle = r() < 0.5 ? C.sol1 : C.sol2; c.fillRect(x, y, pas * 3, pas - 1); continue; }
        c.fillStyle = g.L.aile === 'statues' ? (pair ? C.sol1 : C.sol2) : (r() < 0.5 ? C.sol1 : C.sol2);
        c.fillRect(x + 0.5, y + 0.5, pas - 1, pas - 1);
      }
    }
    // Motif du sol : cercles autour du gardien (grand hall), frise (crypte)
    c.strokeStyle = C.trait; c.lineWidth = 2;
    if (g.L.aile === 'hall') {
      c.fillStyle = 'rgba(120, 28, 36, .55)'; c.beginPath(); c.arc(0, 0, 60, 0, TAU); c.fill();
      for (const rr of [60, 120, 200]) { c.beginPath(); c.arc(0, 0, rr, 0, TAU); c.stroke(); }
      for (let i = 0; i < 12; i++) { const a = i * TAU / 12; c.beginPath(); c.moveTo(Math.cos(a) * 60, Math.sin(a) * 60); c.lineTo(Math.cos(a) * 200, Math.sin(a) * 200); c.stroke(); }
    } else if (g.L.aile === 'crypte') {
      c.beginPath(); c.arc(0, 0, 46, 0, TAU); c.stroke();
    }
    // Frise sur le bord de la salle (motifs, aucun signe d'écriture)
    c.restore();
    c.fillStyle = C.mur;
    c.strokeStyle = C.deco; c.lineWidth = 3;
    c.strokeRect(SALLE.g + 1.5, SALLE.h + 1.5, SALLE.d - SALLE.g - 3, SALLE.b - SALLE.h - 3);
    c.lineWidth = 1.5;
    for (let x = SALLE.g + 8; x < SALLE.d - 8; x += 16) {
      c.beginPath(); c.moveTo(x, SALLE.h + 5); c.lineTo(x + 8, SALLE.h + 12); c.lineTo(x + 16, SALLE.h + 5); c.stroke();
      c.beginPath(); c.moveTo(x, SALLE.b - 5); c.lineTo(x + 8, SALLE.b - 12); c.lineTo(x + 16, SALLE.b - 5); c.stroke();
    }
    // Décor des coins selon l'aile
    const coins = [[SALLE.g + 26, SALLE.h + 30], [SALLE.d - 26, SALLE.h + 30], [SALLE.g + 26, SALLE.b - 30], [SALLE.d - 26, SALLE.b - 30]];
    coins.forEach(([x, y], i) => {
      if (g.L.aile === 'reserve') caisse(c, x, y, 16 + (i % 2) * 4);
      else if (g.L.aile === 'statues') { c.fillStyle = '#4a4a54'; c.fillRect(x - 10, y - 10, 20, 20); c.fillStyle = '#6c6c78'; c.beginPath(); c.arc(x, y, 7, 0, TAU); c.fill(); }
      else if (g.L.aile === 'crypte') jarre(c, x, y);
      else { c.fillStyle = '#3a3240'; c.beginPath(); c.arc(x, y, 12, 0, TAU); c.fill(); c.strokeStyle = C.deco; c.beginPath(); c.arc(x, y, 12, 0, TAU); c.stroke(); }
    });
  }
  function caisse(c, x, y, s) {
    c.fillStyle = '#6b4b2a'; c.fillRect(x - s, y - s * 0.8, s * 2, s * 1.6);
    c.strokeStyle = '#3d2914'; c.lineWidth = 2; c.strokeRect(x - s, y - s * 0.8, s * 2, s * 1.6);
    c.beginPath(); c.moveTo(x - s, y - s * 0.8); c.lineTo(x + s, y + s * 0.8); c.moveTo(x + s, y - s * 0.8); c.lineTo(x - s, y + s * 0.8); c.stroke();
  }
  function jarre(c, x, y) {
    c.fillStyle = '#8a5a32'; c.beginPath(); c.ellipse(x, y + 2, 9, 12, 0, 0, TAU); c.fill();
    c.fillStyle = '#6a4024'; c.fillRect(x - 4, y - 13, 8, 5);
    c.strokeStyle = '#c99a5a'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x - 8, y); c.lineTo(x + 8, y); c.stroke();
  }

  function dessinerPortes(c, g) {
    for (const p of g.portes) {
      c.save(); c.translate(p.x, p.y); c.rotate(p.a + PI / 2);
      const gr = c.createRadialGradient(0, -6, 2, 0, -6, 34);
      gr.addColorStop(0, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = gr; c.beginPath(); c.arc(0, -6, 34, 0, TAU); c.fill();
      c.fillStyle = '#050403'; c.beginPath(); c.moveTo(-18, 6); c.lineTo(-18, -12); c.arc(0, -12, 18, PI, 0); c.lineTo(18, 6); c.closePath(); c.fill();
      c.fillStyle = COULEURS_AILE[g.L.aile].deco; c.fillRect(-23, -14, 5, 22); c.fillRect(18, -14, 5, 22);
      c.restore();
    }
  }

  function dessinerPilier(c, p) {
    c.fillStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.ellipse(p.x + 4, p.y + 5, p.r + 2, p.r, 0, 0, TAU); c.fill();
    const gr = c.createRadialGradient(p.x - 5, p.y - 5, 2, p.x, p.y, p.r);
    gr.addColorStop(0, '#b4ab98'); gr.addColorStop(1, '#5f584b');
    c.fillStyle = gr; c.beginPath(); c.arc(p.x, p.y, p.r, 0, TAU); c.fill();
    c.strokeStyle = '#3f392f'; c.lineWidth = 2; c.beginPath(); c.arc(p.x, p.y, p.r - 4, 0, TAU); c.stroke();
  }

  function dessinerVitrine(c, v, tps) {
    c.fillStyle = '#4a3a28'; c.fillRect(v.x - 13, v.y - 4, 26, 16);
    c.fillStyle = '#2a2016'; c.fillRect(v.x - 13, v.y + 10, 26, 3);
    if (!v.casse) {
      // relique : vase doré
      c.fillStyle = '#e8c36a'; c.beginPath(); c.ellipse(v.x, v.y - 6, 6, 8, 0, 0, TAU); c.fill();
      c.fillStyle = '#a7832f'; c.fillRect(v.x - 3, v.y - 16, 6, 4);
      c.fillStyle = '#2a6f9e'; c.fillRect(v.x - 6, v.y - 7, 12, 2);
      c.fillStyle = 'rgba(180, 220, 255, .18)'; c.fillRect(v.x - 12, v.y - 20, 24, 18);
      c.strokeStyle = 'rgba(220, 240, 255, .55)'; c.lineWidth = 1.2; c.strokeRect(v.x - 12, v.y - 20, 24, 18);
      c.strokeStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.moveTo(v.x - 9, v.y - 17); c.lineTo(v.x - 5, v.y - 12); c.stroke();
    } else {
      c.strokeStyle = 'rgba(220, 240, 255, .45)'; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(v.x - 12, v.y - 4); c.lineTo(v.x - 8, v.y - 13); c.lineTo(v.x - 5, v.y - 6); c.moveTo(v.x + 12, v.y - 4); c.lineTo(v.x + 7, v.y - 15); c.stroke();
    }
  }

  function dessinerSarco(c, s, tps) {
    c.save(); c.translate(s.x, s.y); c.rotate(s.a + PI / 2);
    const tr = s.etat === 'alerte' ? Math.sin(tps * 40) * (1 + s.ouvre * 2.5) : 0;
    c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(-12, -23, 28, 50);
    c.fillStyle = '#2a1d10'; c.beginPath(); c.roundRect(-13, -25, 26, 50, [12, 12, 5, 5]); c.fill();
    c.translate(tr, (s.ouvert || 0) * -6);
    const gr = c.createLinearGradient(-12, 0, 12, 0);
    gr.addColorStop(0, '#a7832f'); gr.addColorStop(0.5, '#f0cf78'); gr.addColorStop(1, '#a7832f');
    c.fillStyle = gr; c.beginPath(); c.roundRect(-12, -24, 24, 48, [11, 11, 4, 4]); c.fill();
    c.fillStyle = '#2a5d8f'; for (let i = 0; i < 4; i++) c.fillRect(-11, 2 + i * 5, 22, 2);
    c.fillStyle = '#e9c98a'; c.beginPath(); c.ellipse(0, -13, 6, 7.5, 0, 0, TAU); c.fill();
    c.fillStyle = '#1a1208'; c.fillRect(-4, -15, 3, 1.6); c.fillRect(1, -15, 3, 1.6);
    c.fillStyle = '#2a5d8f'; c.fillRect(-9, -22, 3, 16); c.fillRect(6, -22, 3, 16);
    c.restore();
  }

  function dessinerMiroir(c, m, tps) {
    c.fillStyle = '#3d2c18'; c.fillRect(m.x - 3, m.y, 6, 12);
    c.fillStyle = '#2a1e10'; c.fillRect(m.x - 9, m.y + 11, 18, 4);
    const gr = c.createRadialGradient(m.x - 3, m.y - 4, 1, m.x, m.y - 2, 11);
    gr.addColorStop(0, m.allume ? '#fff4c8' : '#e0b26a'); gr.addColorStop(1, '#8a5a24');
    c.fillStyle = gr; c.beginPath(); c.arc(m.x, m.y - 2, 10, 0, TAU); c.fill();
    c.strokeStyle = '#5a3a14'; c.lineWidth = 2; c.stroke();
    // flèche de direction : vers quel couloir il renverra la lumière
    c.strokeStyle = m.allume ? 'rgba(255,240,180,.9)' : 'rgba(232,195,106,.55)'; c.lineWidth = 2; c.setLineDash([4, 4]);
    c.beginPath(); c.moveTo(m.x + Math.cos(m.dir) * 14, m.y - 2 + Math.sin(m.dir) * 14); c.lineTo(m.x + Math.cos(m.dir) * 34, m.y - 2 + Math.sin(m.dir) * 34); c.stroke();
    c.setLineDash([]);
  }

  function dessinerBoite(c, b, tps) {
    const p = 1 + Math.sin(tps * 6) * 0.08, a = b.vie < 2 ? (Math.sin(tps * 20) > 0 ? 1 : 0.3) : 1;
    c.save(); c.globalAlpha = a; c.translate(b.x, b.y); c.scale(p, p);
    c.fillStyle = '#2d5a2d'; c.fillRect(-9, -6, 18, 12);
    c.fillStyle = '#c8ef6f'; c.beginPath(); c.moveTo(1, -5); c.lineTo(-4, 1); c.lineTo(0, 1); c.lineTo(-1, 5); c.lineTo(4, -1); c.lineTo(0, -1); c.closePath(); c.fill();
    c.restore();
  }

  // Amulettes : 5 formes × 4 matières (aucun signe d'écriture).
  const MATIERES = ['#f2cf6a', '#49c6b5', '#3d64d8', '#d2553a'];
  function dessinerAmulette(c, i, x, y, s, alpha) {
    const forme = i % 5, col = MATIERES[Math.floor(i / 5) % 4];
    c.save(); c.translate(x, y); c.scale(s, s); c.globalAlpha = alpha == null ? 1 : alpha;
    c.fillStyle = col; c.strokeStyle = col; c.lineWidth = 2.6; c.lineCap = 'round';
    if (forme === 0) { // boucle et croix
      c.beginPath(); c.ellipse(0, -6, 4, 5, 0, 0, TAU); c.stroke();
      c.beginPath(); c.moveTo(0, -1); c.lineTo(0, 11); c.moveTo(-7, 2); c.lineTo(7, 2); c.stroke();
    } else if (forme === 1) { // œil
      c.beginPath(); c.moveTo(-10, 0); c.quadraticCurveTo(0, -9, 10, 0); c.quadraticCurveTo(0, 7, -10, 0); c.stroke();
      c.beginPath(); c.arc(0, -1, 3, 0, TAU); c.fill();
      c.beginPath(); c.moveTo(-2, 4); c.quadraticCurveTo(-4, 10, 1, 11); c.stroke();
    } else if (forme === 2) { // scarabée
      c.beginPath(); c.ellipse(0, 2, 5, 7, 0, 0, TAU); c.fill();
      c.beginPath(); c.arc(0, -6, 3, 0, TAU); c.fill();
      c.beginPath(); c.moveTo(-5, 0); c.quadraticCurveTo(-13, -4, -12, 4); c.moveTo(5, 0); c.quadraticCurveTo(13, -4, 12, 4); c.stroke();
    } else if (forme === 3) { // plume
      c.beginPath(); c.moveTo(0, 11); c.quadraticCurveTo(8, -2, 0, -11); c.quadraticCurveTo(-6, -2, 0, 11); c.fill();
      c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1; c.beginPath(); c.moveTo(0, 10); c.lineTo(1, -9); c.stroke();
    } else { // disque ailé
      c.beginPath(); c.arc(0, 0, 4.5, 0, TAU); c.fill();
      c.beginPath(); c.moveTo(-5, 0); c.quadraticCurveTo(-10, -6, -13, -2); c.quadraticCurveTo(-9, 1, -5, 2); c.fill();
      c.beginPath(); c.moveTo(5, 0); c.quadraticCurveTo(10, -6, 13, -2); c.quadraticCurveTo(9, 1, 5, 2); c.fill();
    }
    c.restore();
  }

  // --- Créatures ---
  function dessinerMomie(c, e, tps, pretre) {
    const gel = e.lit > 0, s = e.r / 13;
    const tr = gel ? Math.sin(tps * 50) * 0.6 : 0;
    const balance = gel ? 0 : Math.sin(e.anim * 5) * 0.12;
    c.save(); c.translate(e.x + tr, e.y); c.scale(s, s);
    if (e.mort) { c.globalAlpha = Math.max(0, 1 - e.mort / 0.6); c.scale(1 + e.mort, 1 - e.mort * 0.8); }
    c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(0, 13, 11, 4, 0, 0, TAU); c.fill();
    c.rotate(balance);
    const corps = pretre ? '#c9b98e' : '#d9ceb0', bande = pretre ? '#8e7d55' : '#a99a74';
    // jambes
    c.fillStyle = corps; c.fillRect(-6, 4, 5, 9); c.fillRect(1, 4, 5, 9);
    // corps
    c.beginPath(); c.roundRect(-8, -9, 16, 16, 5); c.fill();
    c.strokeStyle = bande; c.lineWidth = 1.2;
    for (let i = -7; i < 8; i += 3.5) { c.beginPath(); c.moveTo(-8, i); c.lineTo(8, i + 2); c.stroke(); }
    // bras tendus
    const bras = Math.sin(e.anim * 5) * 2;
    c.fillStyle = corps;
    c.save(); c.translate(-7, -6); c.rotate(-0.5 + bras * 0.05); c.fillRect(-3, -9, 4, 11); c.restore();
    c.save(); c.translate(7, -6); c.rotate(0.5 - bras * 0.05); c.fillRect(-1, -9, 4, 11); c.restore();
    // bandelette qui pend
    c.strokeStyle = corps; c.lineWidth = 1.6; c.beginPath(); c.moveTo(5, 2); c.quadraticCurveTo(10 + bras, 8, 8, 13); c.stroke();
    // tête
    c.fillStyle = corps; c.beginPath(); c.arc(0, -14, 6.5, 0, TAU); c.fill();
    c.strokeStyle = bande; c.beginPath(); c.moveTo(-6, -16); c.lineTo(6, -14); c.moveTo(-6, -12); c.lineTo(6, -11); c.stroke();
    c.fillStyle = '#120c06'; c.fillRect(-5, -15.5, 10, 3);
    if (pretre) {
      // coiffe rayée et bâton
      c.fillStyle = '#e8c36a'; c.beginPath(); c.moveTo(-8, -15); c.lineTo(-10, -5); c.lineTo(-5, -9); c.lineTo(5, -9); c.lineTo(10, -5); c.lineTo(8, -15); c.arc(0, -15, 8, 0, PI, true); c.fill();
      c.fillStyle = '#2a5d8f'; c.fillRect(-9, -11, 3, 2); c.fillRect(6, -11, 3, 2); c.fillRect(-7, -20, 14, 2);
      c.strokeStyle = '#6b4b2a'; c.lineWidth = 2; c.beginPath(); c.moveTo(12, -18); c.lineTo(12, 12); c.stroke();

  function dessinerScene(g, tps, titre) {
    dessinerFond(g);
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    g.sarcos.forEach((s) => dessinerSarco(ctx, s, tps));
    g.miroirs.forEach((m) => dessinerMiroir(ctx, m, tps));
    g.boites.forEach((b) => dessinerBoite(ctx, b, tps));
    g.piliers.forEach((p) => dessinerPilier(ctx, p));
    // les créatures de loin en premier
    const tri = g.ents.slice().sort((a, b) => a.y - b.y);
    tri.forEach((e) => { if (e.type !== 'scarabee' && e.type !== 'ame') dessinerCreature(ctx, e, tps); });
    dessinerGardien(ctx, g.aim, tenue(), tps, g.lampe && g.pile > 0);

    let amb = titre ? 0.84 : (coupure ? 0.975 : 0.9);
    if (g.aube > 0) amb *= 1 - g.aube;
    mctx.setTransform(1, 0, 0, 1, 0, 0);
    mctx.globalCompositeOperation = 'source-over';
    mctx.clearRect(0, 0, masque.width, masque.height);
    mctx.fillStyle = 'rgba(3, 2, 8,' + amb + ')';
    mctx.fillRect(0, 0, masque.width, masque.height);
    vue(mctx);
    mctx.translate(sx / DPR / U, sy / DPR / U);
    mctx.globalCompositeOperation = 'destination-out';
    const tinte = lampe().teinte;
    for (const f of g.faisceaux) {
      const gr = mctx.createRadialGradient(f.ox, f.oy, 4, f.ox, f.oy, f.R);
      gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.72, 'rgba(0,0,0,.92)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      mctx.fillStyle = gr;
      mctx.beginPath(); mctx.moveTo(f.ox, f.oy);
      for (let i = 0; i < f.rayons.length; i += 2) mctx.lineTo(f.rayons[i], f.rayons[i + 1]);
      mctx.closePath(); mctx.fill();

    gl.addColorStop(0, 'rgba(0,0,0,.75)'); gl.addColorStop(1, 'rgba(0,0,0,0)');

      gr.addColorStop(0, 'rgba(' + tinte.join(',') + ',.22)'); gr.addColorStop(1, 'rgba(' + tinte.join(',') + ',0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.moveTo(f.ox, f.oy);

    ctx.fillStyle = vg; ctx.fillRect(0, 0, cv.width, cv.height);
  }

  function sceneTitre() {
    const L = N({ aile: 'crypte', dur: 999, portes: [320, 20, 70, 290], poids: { momie: 1 }, i0: 9, i1: 9, reliques: 2, sarcos: [[235, 120]], piliers: [[60, 150]], miroirs: [] });
    const g = { n: 0, L, t: 0, T: 999, pile: 100, coeurs: 3, lampe: true, focus: false, focusDispo: false, aim: -PI / 2, ents: [], vitrines: [], piliers: [], miroirs: [], sarcos: [], boites: [], amulette: null,

  /* ---------------------------------------------------------------
     Boucle
     --------------------------------------------------------------- */
  let dernier = 0, tps = 0;
  const touches = {};
  function boucle(ms) {
    const dt = Math.min(0.05, (ms - (dernier || ms)) / 1000);
    dernier = ms; tps += dt;
    if (etat === 'jeu') {
      // clavier : rotation du faisceau
      const r = (touches.g ? -1 : 0) + (touches.d ? 1 : 0);
      if (r) G.aim += r * 3.1 * dt;
      maj(G, dt);
      majHud();
    } else if (etat === 'aube') {
      G.aube = Math.min(1, G.aube + dt / 1.8);
      for (const e of G.ents) if (!e.mort) { e.mort = 0.001; for (let i = 0; i < 6; i++) particule(G, e.x, e.y, '#ffd8a0', 1); }
      for (const e of G.ents) if (e.mort) e.mort += dt;
      for (const p of G.part) { p.x += p.vx * dt; p.y += p.vy * dt; p.vie -= dt; }
      G.part = G.part.filter((p) => p.vie > 0);
      calculerFaisceaux(G);
      if (G.aube >= 1) finNuit(true);
    } else if (G && (etat === 'titre' || etat === 'menu')) {
      // le faisceau balaie lentement la salle
      G.aim = -PI / 2 + Math.sin(tps * 0.5) * 0.55 - 0.15;
      G.ents.forEach((e) => { e.anim += dt * 0.4; });
      calculerFaisceaux(G);
      G.ents.forEach((e) => { e.lit = eclairage(G, e.x, e.y, e.r); });
      G.sarcos.forEach((s) => { s.tremble += dt; });
    }
    if (G) dessinerScene(G, tps, etat === 'titre' || etat === 'menu');
    requestAnimationFrame(boucle);
  }

  // Petite démonstration animée (main qui glisse, main qui touche…).
  const dc = $('#demo'), dctx = dc.getContext('2d');
  function main(c, x, y, appui) {
    c.save(); c.translate(x, y); c.scale(1.3, 1.3);
    c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(3, 22, 10, 4, 0, 0, TAU); c.fill();
    c.fillStyle = '#f4d3b0'; c.strokeStyle = '#7a5236'; c.lineWidth = 1.5;
    c.beginPath(); c.roundRect(-4, -2, 8, 16, 4); c.fill(); c.stroke();
    c.beginPath(); c.roundRect(-9, 8, 20, 16, 7); c.fill(); c.stroke();
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 2; c.beginPath(); c.arc(0, -4, 9, 0, TAU); c.stroke(); }
    c.restore();
  }
  function demo(dt) {
    demoT += dt;
    const c = dctx, k = dc.width / 320;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = '#120d08'; c.fillRect(0, 0, dc.width, dc.height);
    c.setTransform(k, 0, 0, k, 160 * k, 150 * k);
    const ty = demoType, tt = demoT;
    const fx = (a, h, R, ox, oy) => {
      ox = ox || 0; oy = oy || 0;
      const gr = c.createRadialGradient(ox, oy, 2, ox, oy, R);
      gr.addColorStop(0, 'rgba(255,236,170,.55)'); gr.addColorStop(1, 'rgba(255,236,170,0)');
      c.fillStyle = gr; c.beginPath(); c.moveTo(ox, oy); c.arc(ox, oy, R, a - h, a + h); c.closePath(); c.fill();
    };
    const crea = (type, x, y, lit, extra) => Object.assign({ type, x, y, r: TYPES[type].r * 1.3, pv: 1, pvMax: 1, lit: lit ? 1 : 0, anim: tt, dx: 0, dy: 1, taps: 3, mort: 0 }, extra || {});
    let aim = -PI / 2;
    if (ty === 'viser' || ty === 'momie' || ty === 'melange' || ty === 'final' || ty === 'tempete' || ty === 'nuee') {
      aim = -PI / 2 + Math.sin(tt * 1.4) * 0.7;
      fx(aim, 0.42, 150);
      const posM = [[-80, -95], [80, -95]];
      posM.forEach(([x, y]) => { const a = Math.atan2(y, x); const lit = Math.abs(angDiff(a, aim)) < 0.45; dessinerMomie(c, crea('momie', x, y + (lit ? 0 : Math.sin(tt) * 2), lit), tt, false); });
      main(c, Math.cos(aim) * 115, Math.sin(aim) * 115 + 10, true);
    } else if (ty === 'relique') {
      fx(aim, 0.42, 150);
      dessinerVitrine(c, { x: -70, y: -40, casse: false }, tt);
      dessinerVitrine(c, { x: 70, y: -40, casse: tt % 4 > 2 }, tt);
      dessinerMomie(c, crea('momie', 70, -110 + Math.min(1, (tt % 4) / 2) * 70, false), tt, false);
    } else if (ty === 'rampante') {
      aim = -PI / 2 + Math.sin(tt * 2) * 0.6; fx(aim, 0.42, 150);
      dessinerRampante(c, crea('rampante', -60 + ((tt * 40) % 120), -90, false, { dx: 1, dy: 0.2 }), tt);
      dessinerMomie(c, crea('momie', 60, -100, true), tt, false);
    } else if (ty === 'toucher' || ty === 'scarabee') {
      fx(aim, 0.42, 150);
      const ph = tt % 2;
      for (let i = 0; i < 4; i++) {
        const y = -110 + ((tt * 30 + i * 30) % 100);
        const ecr = i === 1 && ph > 1.2;
        dessinerScarabee(c, crea('scarabee', -60 + i * 40, y, false, { r: 9, mort: ecr ? 0.3 : 0, ecrase: true, dx: 0, dy: 1 }), tt);
      }
      main(c, -20, -70 + (ph > 1.2 ? 0 : -20) + 20, ph > 1.2);
    } else if (ty === 'dos' || ty === 'sarco') {
      const ph = (tt % 4) / 4;
      aim = ph < 0.35 ? -PI / 2 : -PI / 2 + Math.min(1, (ph - 0.35) * 4) * PI;
      dessinerSarco(c, { x: 0, y: 95, a: PI / 2, etat: ph < 0.6 ? 'alerte' : 'ferme', ouvre: 0.5 }, tt);
      fx(aim, 0.42, 150);
      if (ph < 0.6) { c.fillStyle = 'rgba(255,122,75,.8)'; c.beginPath(); c.moveTo(0, 46); c.lineTo(-7, 34); c.lineTo(7, 34); c.fill(); }
      main(c, Math.cos(aim) * 110, Math.sin(aim) * 110 + 10, true);
    } else if (ty === 'concentrer' || ty === 'pilier' || ty === 'statue') {
      const etroit = (tt % 3) > 1.5;
      fx(aim, etroit ? 0.2 : 0.42, etroit ? 200 : 130);
      dessinerPilier(c, { x: 45, y: -70, r: 16 });
      if (ty === 'statue') dessinerStatue(c, crea('statue', -20, -120, etroit), tt);
      else dessinerMomie(c, crea('momie', 0, -125, etroit), tt, false);
      dessinerMomie(c, crea('momie', 85, -125, false), tt, false);
      c.fillStyle = etroit ? '#6e541a' : '#2d241a'; c.strokeStyle = '#e8c36a'; c.lineWidth = 2;
      c.beginPath(); c.arc(120, 40, 22, 0, TAU); c.fill(); c.stroke();
      c.fillStyle = '#ffe9a8'; c.beginPath(); c.moveTo(114, 54); c.lineTo(119, 26); c.lineTo(121, 26); c.lineTo(126, 54); c.fill();
      main(c, 126, 52, etroit && (tt % 3) < 1.8);
    } else if (ty === 'coupure') {
      fx(aim, 0.42, 150);
      dessinerMomie(c, crea('momie', -50, -100, false), tt, false);
      if ((tt % 3) > 1.5) { c.fillStyle = 'rgba(0,0,0,.85)'; c.fillRect(-160, -150, 320, 200); c.fillStyle = '#ffb347'; c.beginPath(); c.arc(-53, -114, 2, 0, TAU); c.arc(-47, -114, 2, 0, TAU); c.fill(); }
    } else if (ty === 'pile') {
      fx(aim, 0.42, 150);
      const ph = tt % 2;
      if (ph < 1.3) dessinerBoite(c, { x: 60, y: -40, vie: 9 }, tt);
      main(c, 60, -30, ph > 1 && ph < 1.4);
    } else if (ty === 'miroir' || ty === 'deuxmiroirs') {
      const on = (tt % 3) > 1;
      aim = on ? -PI / 2 - 0.5 : -PI / 2 + 0.3;
      fx(aim, 0.42, 150);
      const m = { x: -70, y: -90, dir: 0, allume: on };
      if (on) fx(0, 0.2, 200, m.x, m.y - 2);
      dessinerMiroir(c, m, tt);
      dessinerMomie(c, crea('momie', 100, -92, on), tt, false);
    } else if (ty === 'pretre') {
      fx(aim + 0.9, 0.42, 150);
      dessinerMomie(c, crea('pretre', -40, -100, false), tt, true);
      for (let i = 0; i < 3; i++) dessinerScarabee(c, crea('scarabee', -60 + i * 20, -60 + ((tt * 25) % 40), false, { r: 9 }), tt);
    } else if (ty === 'hall') {
      aim = tt * 1.2;
      for (let i = 0; i < 6; i++) { const a = i * TAU / 6 - PI / 2; c.fillStyle = '#050403'; c.beginPath(); c.arc(Math.cos(a) * 120, Math.sin(a) * 120 * 0.8, 14, 0, TAU); c.fill(); }
      fx(aim, 0.42, 130);
      for (let i = 0; i < 3; i++) { const a = i * TAU / 3 + 0.4; dessinerMomie(c, crea('momie', Math.cos(a) * 80, Math.sin(a) * 70, Math.abs(angDiff(a, aim)) < 0.45), tt, false); }
    } else if (ty === 'ame') {
      const ph = tt % 4;
      aim = ph < 2 ? -PI / 2 : -PI / 2 + 1.2;
      fx(aim, 0.42, 150);
      const y = ph < 2 ? -120 + ph * 25 : -70;
      dessinerAme(c, crea('ame', 0, y, ph < 2, { taps: ph > 3 ? 2 : 3 }), tt);
      main(c, 0, y + 15, ph > 2.8 && ph < 3.2);
    }
    dessinerGardien(c, aim, tenue(), tt, true);
  }

  /* ---------- Interface de jeu ---------- */
  let hudCoeurs = -1, hudRel = -1;

  function finNuit(gagne) {
    if (etat === 'fin') return;
    const n = G.n, L = G.L;
    etat = 'fin';
    const intactes = G.vitrines.filter((v) => !v.casse).length;
    let etoiles = 0, e2 = false, e3 = false, score = G.pts;
    if (gagne) {
      etoiles = 1;
      e2 = G.pile >= L.seuil; if (e2) etoiles++;
      e3 = L.reliques > 0 ? intactes === L.reliques : G.coeurs === 3; if (e3) etoiles++;
      score += Math.round(G.pile) * 10 + intactes * 200 + G.coeurs * 150;
    }
    const ancienRecord = S.rec[n];
    const record = score > ancienRecord;
    let extra = '';
    if (gagne) {
      const avantE = totalEtoiles(), avantA = totalAmulettes();
      S.et[n] = Math.max(S.et[n], etoiles);
      if (record) S.rec[n] = score;
      if (G.amTrouvee) S.am[n] = true;
      // nouveautés débloquées au vestiaire
      const lampeNeuve = LAMPES.find((l) => l.req > avantE && l.req <= totalEtoiles());
      const tenueNeuve = TENUES.find((x) => x.req > avantA && x.req <= totalAmulettes());
      if (lampeNeuve) extra = t('fin.debloque', { nom: t('lampe.' + lampeNeuve.id) });
      else if (tenueNeuve) extra = t('fin.debloque', { nom: t('tenue.' + tenueNeuve.id) });
      S.niveau = Math.max(S.niveau, Math.min(n + 2, NIVEAUX.length));
      enregistrer(Math.min(n + 2, NIVEAUX.length));
      enPartie = false;
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
      if (S.et.every((x) => x > 0)) { if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: MAX_ETOILES }); }
    } else {
      enregistrer(n + 1);
      enPartie = false;
      SON.defaite();
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: n + 1 });
    }
    // Écran de fin
    $('#fin-titre').textContent = gagne ? t('fin.victoire') : t('fin.defaite');
    const box = $('#fin-etoiles'); box.innerHTML = [0, 1, 2].map(() => SVG_ETOILE(true)).join('');
    const svgs = box.querySelectorAll('svg');
    box.setAttribute('aria-label', t('fin.etoilesAria', { n: etoiles }));
    for (let i = 0; i < 3; i++) setTimeout(() => { if (i < etoiles) { svgs[i].classList.add('allumee'); SON.etoile(i); } else svgs[i].classList.add('vue'); }, 350 + i * 380);
    const fs = $('#fin-score'); let aff = 0;
    const pasScore = Math.max(1, Math.round(score / 40));
    const compter = () => { aff = Math.min(score, aff + pasScore); fs.textContent = t('fin.score', { n: aff }); if (aff < score && etat === 'fin') requestAnimationFrame(compter); };
    compter();
    const fr = $('#fin-record');
    fr.classList.toggle('nouveau', gagne && record && ancienRecord > 0 || (gagne && record && ancienRecord === 0));
    fr.textContent = gagne && record ? t('fin.record') : t('fin.recordAncien', { n: Math.max(ancienRecord, gagne ? S.rec[n] : 0) });
    const ok = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10" stroke="#7ee08a" stroke-width="3" fill="none"/></svg>';
    const non = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="#b9ab8a" stroke-width="3"/></svg>';
    const li = (b, txt) => '<li class="' + (b ? '' : 'non') + '">' + (b ? ok : non) + '<span>' + txt + '</span></li>';
    $('#fin-detail').innerHTML = li(gagne, t('fin.e1')) + li(e2, t('fin.e2', { seuil: L.seuil })) + li(e3, L.reliques > 0 ? t('fin.e3r', { n: intactes, max: L.reliques }) : t('fin.e3c'))
      + li(G.amTrouvee, G.amTrouvee ? t('fin.amulette', { nom: nomAmulette(n) }) : t('fin.amuletteNon'));
    if (gagne && n === NIVEAUX.length - 1) extra = (extra ? extra + ' · ' : '') + t('fin.bravo', { e: totalEtoiles(), max: MAX_ETOILES, a: totalAmulettes() });
    $('#fin-extra').textContent = extra;
    $('#fin-astuce').textContent = gagne ? '' : t('astuce.' + (Math.floor(Math.random() * 6) + 1));
    $('#b-suivant').hidden = !gagne || n === NIVEAUX.length - 1;
    $('#b-reessayer').hidden = gagne;
    $('#hud').hidden = true;
    montrer('e-fin');
  }

  /* ---------------------------------------------------------------
     Commandes
     --------------------------------------------------------------- */
  function versMonde(cx, cy) { return { x: (cx - GX) / U, y: (cy - GY) / U }; }
  let appui = null;
  cv.addEventListener('pointerdown', (ev) => {
    audio();
    if (etat !== 'jeu') return;
    ev.preventDefault();
    const p = versMonde(ev.clientX, ev.clientY);
    appui = ev.pointerId;
    try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* rien */ }
    const touche = frapper(G, p.x, p.y, ev.pointerType === 'mouse' ? 24 : 34);
    if (!touche && Math.hypot(p.x, p.y) > 10) G.aim = Math.atan2(p.y, p.x);
  });
  cv.addEventListener('pointermove', (ev) => {
    if (etat !== 'jeu') return;
    if (ev.pointerType === 'mouse' || appui === ev.pointerId) {
      const p = versMonde(ev.clientX, ev.clientY);
      if (Math.hypot(p.x, p.y) > 10) G.aim = Math.atan2(p.y, p.x);
    }
  });
  const lacher = (ev) => { if (appui === ev.pointerId) appui = null; };
  cv.addEventListener('pointerup', lacher);
  cv.addEventListener('pointercancel', lacher);

  window.addEventListener('keydown', (ev) => {
    const c = ev.code;
    if (etat === 'jeu') {
      if (c === 'ArrowLeft' || c === 'KeyA' || c === 'KeyQ') { touches.g = true; ev.preventDefault(); }
      else if (c === 'ArrowRight' || c === 'KeyD') { touches.d = true; ev.preventDefault(); }
      else if (c === 'ArrowUp' || c === 'KeyW' || c === 'KeyZ') { G.aim = -PI / 2; ev.preventDefault(); }
      else if (c === 'ArrowDown' || c === 'KeyS') { G.aim = PI / 2; ev.preventDefault(); }
      else if (c === 'Space') {
        ev.preventDefault();
        // écrase la cible touchable la plus proche du gardien
        let best = null, bd = 260;
        for (const e of G.ents) if (!e.mort && (e.type === 'scarabee' || e.type === 'ame')) { const d = Math.hypot(e.x, e.y); if (d < bd) { bd = d; best = e; } }
        for (const b of G.boites) { const d = Math.hypot(b.x, b.y); if (d < bd) { bd = d; best = b; } }
        if (best) frapper(G, best.x, best.y, 40);
      }
      else if (c === 'KeyC' || c === 'ShiftLeft' || c === 'ShiftRight') { basculerFocus(); ev.preventDefault(); }
      else if (c === 'KeyL' || c === 'KeyE') { basculerLampe(); ev.preventDefault(); }
      else if (c === 'Escape' || c === 'KeyP') { pause(); ev.preventDefault(); }
    } else if (etat === 'pause' && (c === 'Escape' || c === 'KeyP')) { reprendre(); ev.preventDefault(); }
    else if (etat === 'intro' && (c === 'Enter' || c === 'Space')) { commencer(); ev.preventDefault(); }
  });
  window.addEventListener('keyup', (ev) => {
    const c = ev.code;
    if (c === 'ArrowLeft' || c === 'KeyA' || c === 'KeyQ') touches.g = false;
    if (c === 'ArrowRight' || c === 'KeyD') touches.d = false;
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('blur', () => { touches.g = touches.d = false; });
  window.addEventListener('resize', () => { miseEnPage(); if (etat === 'jeu' || etat === 'pause' || etat === 'intro') calculerFaisceaux(G); });

  // Boutons
  const surClic = (sel, f) => $(sel).addEventListener('click', (e) => { e.stopPropagation(); f(); });
  surClic('#b-jouer', () => {
    audio(); SON.clic();
    if (!window.JEL_SAVE) { lancerNuit(0); return; }
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { S = Object.assign(normaliser(d), { lampe: S.lampe, tenue: S.tenue }); lancerNuit(clamp((Number(d.niveau) || 1) - 1, 0, NIVEAUX.length - 1)); },
      onNouvelle: () => lancerNuit(0),
      onEffacer: () => { S = normaliser(null); majTitre(); lancerNuit(0); },
    });
  });
  surClic('#b-nuits', () => { SON.clic(); ouvrirNuits(); });
  surClic('#b-vestiaire', () => { SON.clic(); ouvrirVestiaire(); });
  surClic('#b-amulettes', () => { SON.clic(); ouvrirAmulettes(); });
  document.querySelectorAll('[data-retour]').forEach((b) => b.addEventListener('click', () => { SON.clic(); allerTitre(); }));
  surClic('#b-son', basculerSon); surClic('#b-son-jeu', basculerSon); surClic('#b-son-pause', basculerSon);
  surClic('#b-go', commencer);
  $('#e-intro').addEventListener('click', (e) => { if (e.target === $('#e-intro')) commencer(); });
  surClic('#b-pause', pause);
  surClic('#b-lampe', basculerLampe);
  surClic('#b-focus', basculerFocus);
  surClic('#b-reprendre', reprendre);
  surClic('#b-recommencer', () => { SON.clic(); lancerNuit(G.n); });
  surClic('#b-accueil', () => { SON.clic(); if (enPartie) enregistrer(G.n + 1); allerTitre(); });
  surClic('#b-suivant', () => { SON.clic(); lancerNuit(Math.min(G.n + 1, NIVEAUX.length - 1)); });
  surClic('#b-reessayer', () => { SON.clic(); lancerNuit(G.n); });
  surClic('#b-rejouer', () => { SON.clic(); lancerNuit(G.n); });
  surClic('#b-fin-nuits', () => { SON.clic(); ouvrirNuits(); });
  surClic('#b-fin-accueil', () => { SON.clic(); allerTitre(); });

  if (window.JEL_SAVE) window.JEL_SAVE.surFermeture(() => { if (enPartie && G && G.T !== 999) window.JEL_SAVE.save(JEU, donnees(G.n + 1)); });

  // Animation de la démonstration (seulement quand l'écran d'intro est visible)
  let demoDernier = 0;
  function boucleDemo(ms) {
    const dt = Math.min(0.05, (ms - (demoDernier || ms)) / 1000); demoDernier = ms;
    if (etat === 'intro') demo(dt);
    requestAnimationFrame(boucleDemo);
  }

  majSon();
  allerTitre();
  requestAnimationFrame(boucle);
  requestAnimationFrame(boucleDemo);
})();
</script>
</body>
</html>
