// ---------------------------------------------------------------------------
// Démonstration (carte d'introduction) : main + anneau fantôme
// ---------------------------------------------------------------------------
const demo = { t: 0, vol: null, v: null, fini: 0 };
function choisirCibleDemo() {
  const def = S.def;
  let liste = S.cibles.filter((c) => !c.prise);
  if (def.demo === 'tapis' || def.demo === 'deuxTapis') liste = liste.filter((c) => c.mob.kind === 'tapis' && c.x > -0.9 && c.x < 0.3);
  else if (def.demo === 'riviere') liste = liste.filter((c) => c.mob.kind === 'riviere' && c.x > -0.9 && c.x < 0.4);
  else if (def.demo === 'canard') liste = liste.filter((c) => c.type === 'canard');
  else if (def.demo === 'cone') liste = liste.filter((c) => c.type === 'cone');
  else if (def.demo === 'manege') liste = liste.filter((c) => c.z > 0.9);
  else if (def.demo === 'plots') return { x: 0.28, z: 0.62, cible: null };
  if (!liste.length) liste = S.cibles.filter((c) => !c.prise);
  liste.sort((a, b) => a.z - b.z);
  const c = liste[0];
  if (!c) return { x: 0, z: 0.5, cible: null };
  // anticipe le mouvement de la cible pendant le vol (sauf pour le vent : on montre la dérive)
  let x = c.x;
  if (c.mob && c.mob.v) x += c.mob.v * (0.75 + 0.45 * c.z + 1.0);
  return { x, z: c.z, cible: c };
}
function viseePour(x, z) {
  const p = Math.max(0.1, Math.min(1, (z - 0.05) / 1.04));
  const zL = 0.05 + p * 1.04;
  const ang = Math.atan(x / ((zL - Z0) * 1.15));
  return { ang, p };
}
function majDemo(dt) {
  demo.t += dt;
  if (!demo.v || demo.t > 4.6) {
    demo.t = 0; demo.vol = null;
    const c = choisirCibleDemo();
    demo.v = viseePour(c.x, c.z);
  }
  if (demo.t >= 2.0 && !demo.vol) demo.vol = lancer(demo.v, true);
  if (demo.vol && !demo.vol.fin) {
    let reste = dt;
    while (reste > 0) {
      const d = Math.min(1 / 240, reste); reste -= d;
      const res = avancerAnneau(demo.vol, d, true);
      if (res !== 'vol') { demo.vol.fin = res; break; }
    }
  }
}
function dessinerDemo() {
  if (!demo.v) { dessinerDepart(null, null); return; }
  const o = proj(X0, Z0, H0);
  const D = demo.v.p * L.dMax;
  const fx = -Math.sin(demo.v.ang) * D, fy = Math.cos(demo.v.ang) * D;
  let k = 0, appuie = false;
  if (demo.t < 0.6) { k = 0; appuie = false; }
  else if (demo.t < 0.9) { k = 0; appuie = true; }
  else if (demo.t < 1.9) { k = Math.min(1, (demo.t - 0.9) / 0.8); appuie = true; }
  else { k = 1; appuie = false; }
  if (demo.t >= 0.9 && demo.t < 2.0) {
    dessinerVisee(demo.v, 1);
    dessinerDepart(null, { x: fx * k * 0.45, y: fy * k * 0.45 });
  } else if (demo.t < 0.9) dessinerDepart(null, null);
  if (demo.vol) {
    ctx.save(); ctx.globalAlpha = 0.85;
    if (!demo.vol.fin || demo.vol.fin === 'vol') dessinerAnneauMonde(demo.vol, 0.85);
    else if (demo.vol.fin === 'pris') {
      const c = demo.vol.pris, p = proj(c.x, c.z, hauteurCible(c) * 0.6);
      dessinerAnneau(ctx, p.x, p.y, R_VISU * L.demi * p.s, R_VISU * L.demi * p.s * 0.36, skinActuel(), temps);
      ctx.fillStyle = '#fff3c4';
      for (let i = 0; i < 6; i++) { const a = temps * 3 + i; ctx.fillRect(p.x + Math.cos(a) * 26, p.y + Math.sin(a) * 14 - 10, 4, 4); }
    } else dessinerAnneauMonde(demo.vol, 0.6);
    ctx.restore();
  }
  const mx = o.x + fx * k * 0.9 + 10, my = o.y + fy * k * 0.9 + 30;
  if (demo.t < 2.6) {
    const entree = Math.min(1, demo.t / 0.5);
    dessinerMain(mx + (1 - entree) * 80, my + (1 - entree) * 60, appuie);
  }
}

// ---------------------------------------------------------------------------
// Rendu d'une image
// ---------------------------------------------------------------------------
function dessinerMonde() {
  const allee = S ? S.def.allee : 3;
  dessinerCiel(allee);
  dessinerStand(allee);
  if (!S) return;
  const def = S.def;
  for (const tp of def.tapis || []) dessinerTapis(tp);
  if (def.riviere) dessinerRiviere(def.riviere);
  if (S.manege) dessinerManegeSol();
  // Objets triés du fond vers le devant
  const objets = [];
  for (const c of S.cibles) objets.push({ z: c.z, f: () => dessinerCible(c) });
  for (const p of S.plots) objets.push({ z: p.z, f: () => dessinerPlot(p) });
  if (S.manege) {
    for (const o of obstaclesManege()) {
      if (o.i === undefined) objets.push({ z: o.z, f: dessinerMat });
      else objets.push({ z: o.z, f: () => dessinerCheval(o) });
    }
  }
  for (const a of S.auSol) objets.push({ z: a.z, f: () => dessinerAnneauMonde({ x: a.x, z: a.z, h: 0, rot: 0, skin: a.skin }, Math.min(1, a.vie)) });
  if (S.anneau) objets.push({ z: S.anneau.z - 0.03, f: () => dessinerAnneauMonde(S.anneau) });
  objets.sort((a, b) => b.z - a.z);
  for (const o of objets) o.f();
  dessinerFanion();
  dessinerComptoir();
  // Visée et anneau de départ
  if (ecran === 'intro' && def.demo) dessinerDemo();
  else if (ecran === 'jeu' || ecran === 'pause') {
    const v = viseeActuelle();
    if (v && !S.anneau && S.anneaux > 0 && !S.fini) {
      dessinerVisee(v, def.visee);
      const D = v.p * L.dMax;
      dessinerDepart(v, { x: -Math.sin(v.ang) * D * 0.45, y: Math.cos(v.ang) * D * 0.45 });
    } else if (!S.anneau && S.anneaux > 0 && !S.fini) {
      dessinerDepart(null, null);
      // petite flèche qui invite à tirer vers le bas
      if (S.nbLances === 0) {
        const o = proj(X0, Z0, H0), k = (temps * 1.2) % 1;
        ctx.globalAlpha = 1 - k; ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.moveTo(o.x - 12, o.y + 30 + k * 30); ctx.lineTo(o.x + 12, o.y + 30 + k * 30); ctx.lineTo(o.x, o.y + 46 + k * 30); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }
  // Particules
  for (const p of S.parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.vie * 1.5)); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.t, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of S.popups) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.vie * 2));
    ctx.font = '900 ' + Math.round(Math.min(28, W * 0.065)) + 'px system-ui, sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(40,15,60,.85)'; ctx.strokeText(p.texte, p.x, p.y);
    ctx.fillStyle = p.c; ctx.fillText(p.texte, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

// Écran titre : un stand de démonstration qui vit tout seul
function preparerTitre() { S = null; }
function dessinerTitre() {
  dessinerCiel(1);
  dessinerStand(1);
  // Bouteilles, cônes et canards en pyramide
  const fauxS = S;
  const liste = [
    nouvelleCible('bouteille', -0.36, 0.75, 'r'), nouvelleCible('bouteille', -0.12, 0.75, 'j'), nouvelleCible('bouteille', 0.12, 0.75, 'b'), nouvelleCible('bouteille', 0.36, 0.75, 'v'),
    nouvelleCible('cone', -0.6, 0.5, 'b'), nouvelleCible('canard', -0.24, 0.45, 'j'), nouvelleCible('canard', 0.24, 0.45, 'r'), nouvelleCible('cone', 0.6, 0.5, 'r'),
    nouvelleCible('bouteille', 0, 0.3, 'r'),
  ];
  liste.forEach((c) => { c.apparition = 1; });
  liste.sort((a, b) => b.z - a.z).forEach((c) => dessinerCible(c));
  // Anneau qui vole en boucle vers la bouteille du milieu
  const k = (temps * 0.45) % 1;
  const x = 0.36 * (1 - k) * 0 + 0.12 * k, z = -0.1 + 0.85 * k, h = 0.15 + 1.3 * k * (1 - k) + 0.3 * k;
  const p = proj(x, z, h);
  dessinerAnneau(ctx, p.x, p.y, R_VISU * L.demi * p.s * 1.2, R_VISU * L.demi * p.s * 0.45, skinActuel(), temps);
  dessinerComptoir();
  // Peluches sur le comptoir
  const y = proj(0, -0.04).y + H * 0.08, tp = Math.min(W * 0.12, 62);
  [[L.cx - tp * 1.6, 0], [L.cx, 14], [L.cx + tp * 1.6, 11]].forEach(([xx, i], j) => {
    ctx.save(); ctx.translate(xx, y + Math.sin(temps * 2 + j) * 3); dessinerPeluche(ctx, 0, 0, tp, PELUCHES[i], true); ctx.restore();
  });
  void fauxS;
}

function boucle(ts) {
  const now = ts / 1000;
  let dt = boucle.dernier ? now - boucle.dernier : 0;
  boucle.dernier = now;
  dt = Math.min(0.05, Math.max(0, dt));
  if (!enPause) temps += dt;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (S && !enPause) {
    if (ecran === 'jeu') majStand(dt);
    else if (ecran === 'intro') { majCibles(dt); if (S.def.demo) majDemo(dt); }
    for (let i = S.parts.length - 1; i >= 0; i--) { const p = S.parts[i]; p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; if (p.vie <= 0) S.parts.splice(i, 1); }
    for (let i = S.popups.length - 1; i >= 0; i--) { const p = S.popups[i]; p.vie -= dt; p.y -= 40 * dt; if (p.vie <= 0) S.popups.splice(i, 1); }
  }
  if (!enPause) {
    for (let i = decor.feux.length - 1; i >= 0; i--) { decor.feux[i].vie -= dt; if (decor.feux[i].vie <= 0) decor.feux.splice(i, 1); }
    for (let i = decor.confettis.length - 1; i >= 0; i--) { const c = decor.confettis[i]; c.vie -= dt; c.x += c.vx * dt; c.y += c.vy * dt; c.r += c.vr * dt; if (c.vie <= 0 || c.y > H + 20) decor.confettis.splice(i, 1); }
  }
  ctx.save();
  if (S && S.secousse > 0) ctx.translate((Math.random() - 0.5) * 10 * S.secousse / 0.18, (Math.random() - 0.5) * 6 * S.secousse / 0.18);
  if (S) dessinerMonde(); else dessinerTitre();
  ctx.restore();
  for (const c of decor.confettis) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-4, -2, 8, 4); ctx.restore();
  }
  requestAnimationFrame(boucle);
}

// ---------------------------------------------------------------------------
// Peluches (dessin paramétré)
// ---------------------------------------------------------------------------
function dessinerPeluche(g, x, y, t, d, gagnee) {
  const gris = '#4a4266', gris2 = '#5a5278';
  const c = gagnee ? d.c : gris, c2 = gagnee ? d.c2 : gris2;
  const r = t * 0.3;
  g.save(); g.translate(x, y);
  g.lineWidth = Math.max(1, t * 0.025); g.strokeStyle = gagnee ? 'rgba(60,30,40,.45)' : 'rgba(0,0,0,.25)';
  const rond = (cx, cy, rr, col) => { g.fillStyle = col; g.beginPath(); g.arc(cx, cy, rr, 0, Math.PI * 2); g.fill(); g.stroke(); };
  const ovale = (cx, cy, rx, ry, col, a) => { g.fillStyle = col; g.beginPath(); g.ellipse(cx, cy, rx, ry, a || 0, 0, Math.PI * 2); g.fill(); g.stroke(); };
  // corps, pattes
  if (d.laine) for (let i = 0; i < 7; i++) rond(Math.cos(i) * r * 0.6, r * 1.15 + Math.sin(i) * r * 0.4, r * 0.38, c);
  ovale(0, r * 1.15, r * 0.78, r * 0.72, c);
  ovale(0, r * 1.25, r * 0.45, r * 0.42, c2);
  ovale(-r * 0.75, r * 1.0, r * 0.22, r * 0.38, c, 0.5);
  ovale(r * 0.75, r * 1.0, r * 0.22, r * 0.38, c, -0.5);
  ovale(-r * 0.4, r * 1.75, r * 0.3, r * 0.2, c);
  ovale(r * 0.4, r * 1.75, r * 0.3, r * 0.2, c);
  // oreilles derrière la tête
  const o = d.o;
  if (o === 'rond') { rond(-r * 0.72, -r * 0.7, r * 0.3, c); rond(r * 0.72, -r * 0.7, r * 0.3, c); if (gagnee) { rond(-r * 0.72, -r * 0.7, r * 0.15, d.panda ? c2 : c2); rond(r * 0.72, -r * 0.7, r * 0.15, d.panda ? c2 : c2); } }
  else if (o === 'long') { ovale(-r * 0.38, -r * 1.25, r * 0.2, r * 0.6, c, -0.12); ovale(r * 0.38, -r * 1.25, r * 0.2, r * 0.6, c, 0.12); if (gagnee) { ovale(-r * 0.38, -r * 1.25, r * 0.1, r * 0.42, c2, -0.12); ovale(r * 0.38, -r * 1.25, r * 0.1, r * 0.42, c2, 0.12); } }
  else if (o === 'pointu') {
    g.fillStyle = c;
    for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s * r * 0.85, -r * 0.2); g.lineTo(s * r * 0.7, -r * 1.15); g.lineTo(s * r * 0.15, -r * 0.75); g.closePath(); g.fill(); g.stroke(); }
  } else if (o === 'grandes') { rond(-r * 0.95, -r * 0.35, r * 0.5, c); rond(r * 0.95, -r * 0.35, r * 0.5, c); if (gagnee) { rond(-r * 0.95, -r * 0.35, r * 0.3, c2); rond(r * 0.95, -r * 0.35, r * 0.3, c2); } }
  else if (o === 'tombantes') { ovale(-r * 0.95, -r * 0.05, r * 0.25, r * 0.55, c2, 0.3); ovale(r * 0.95, -r * 0.05, r * 0.25, r * 0.55, c2, -0.3); }
  else if (o === 'criniere') { for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; rond(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.95, r * 0.32, c2); } }
  else if (o === 'plumes') { g.fillStyle = c; for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s * r * 0.8, -r * 0.4); g.lineTo(s * r * 0.75, -r * 1.05); g.lineTo(s * r * 0.3, -r * 0.8); g.closePath(); g.fill(); g.stroke(); } }
  else if (o === 'pics') { g.fillStyle = c2; for (let i = 0; i < 4; i++) { const xx = -r * 0.45 + i * r * 0.3; g.beginPath(); g.moveTo(xx - r * 0.14, -r * 0.82); g.lineTo(xx, -r * 1.2); g.lineTo(xx + r * 0.14, -r * 0.82); g.closePath(); g.fill(); g.stroke(); } }
  else if (o === 'cotes') { rond(-r * 0.95, 0, r * 0.3, c); rond(r * 0.95, 0, r * 0.3, c); if (gagnee) { rond(-r * 0.95, 0, r * 0.17, c2); rond(r * 0.95, 0, r * 0.17, c2); } }
  else if (o === 'yeux') { rond(-r * 0.42, -r * 0.82, r * 0.3, c); rond(r * 0.42, -r * 0.82, r * 0.3, c); }
  // tête
  rond(0, 0, r, c);
  if (d.laine && gagnee) for (let i = 0; i < 5; i++) rond(-r * 0.5 + i * r * 0.25, -r * 0.85, r * 0.22, c);
  if (!gagnee) { g.restore(); return; }
  if (d.rayures) { g.strokeStyle = '#3a2a20'; g.lineWidth = r * 0.1; for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s * r * 0.95, -r * 0.2); g.lineTo(s * r * 0.6, -r * 0.1); g.stroke(); } g.beginPath(); g.moveTo(0, -r); g.lineTo(0, -r * 0.65); g.stroke(); g.lineWidth = Math.max(1, t * 0.025); g.strokeStyle = 'rgba(60,30,40,.45)'; }
  if (d.corne) { g.fillStyle = '#ffd166'; g.beginPath(); g.moveTo(-r * 0.15, -r * 0.85); g.lineTo(0, -r * 1.6); g.lineTo(r * 0.15, -r * 0.85); g.closePath(); g.fill(); g.stroke(); }
  // museau / visage
  if (d.panda) { ovale(-r * 0.36, -r * 0.05, r * 0.22, r * 0.28, c2, 0.4); ovale(r * 0.36, -r * 0.05, r * 0.22, r * 0.28, c2, -0.4); }
  if (!d.bec && !d.trompe && !d.groin) ovale(0, r * 0.35, r * 0.42, r * 0.3, d.panda ? '#ffffff' : c2);
  const yeuxY = d.o === 'yeux' ? -r * 0.82 : -r * 0.08;
  const yeuxX = d.o === 'yeux' ? r * 0.42 : r * 0.36;
  if (d.o === 'yeux' || d.bec && d.id === 'chouette') { rond(-yeuxX, yeuxY, r * 0.2, '#fff'); rond(yeuxX, yeuxY, r * 0.2, '#fff'); }
  g.fillStyle = '#2a1a3a';
  g.beginPath(); g.arc(-yeuxX, yeuxY, r * 0.1, 0, Math.PI * 2); g.arc(yeuxX, yeuxY, r * 0.1, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(-yeuxX + r * 0.04, yeuxY - r * 0.04, r * 0.035, 0, Math.PI * 2); g.arc(yeuxX + r * 0.04, yeuxY - r * 0.04, r * 0.035, 0, Math.PI * 2); g.fill();
  if (d.bec) { g.fillStyle = '#ff9f1c'; g.beginPath(); g.moveTo(-r * 0.2, r * 0.18); g.lineTo(r * 0.2, r * 0.18); g.lineTo(0, r * 0.48); g.closePath(); g.fill(); g.stroke(); }
  else if (d.trompe) { g.strokeStyle = c; g.lineWidth = r * 0.28; g.lineCap = 'round'; g.beginPath(); g.moveTo(0, r * 0.2); g.quadraticCurveTo(r * 0.05, r * 0.85, r * 0.45, r * 0.75); g.stroke(); g.lineCap = 'butt'; }
  else if (d.groin) { ovale(0, r * 0.32, r * 0.32, r * 0.22, c2); g.fillStyle = '#9e3b54'; g.beginPath(); g.arc(-r * 0.1, r * 0.32, r * 0.06, 0, Math.PI * 2); g.arc(r * 0.1, r * 0.32, r * 0.06, 0, Math.PI * 2); g.fill(); }
  else {
    g.fillStyle = '#3a2230'; g.beginPath(); g.ellipse(0, r * (d.grosNez ? 0.25 : 0.22), r * (d.grosNez ? 0.2 : 0.1), r * (d.grosNez ? 0.15 : 0.07), 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#3a2230'; g.lineWidth = Math.max(1, r * 0.06);
    g.beginPath(); g.arc(-r * 0.09, r * 0.36, r * 0.09, 0.1, Math.PI - 0.3); g.arc(r * 0.09, r * 0.36, r * 0.09, 0.3, Math.PI - 0.1); g.stroke();
  }
  if (d.moust) { g.strokeStyle = '#3a2230'; g.lineWidth = 1; for (const s of [-1, 1]) for (const k of [-1, 1]) { g.beginPath(); g.moveTo(s * r * 0.2, r * 0.3); g.lineTo(s * r * 0.75, r * 0.3 + k * r * 0.12); g.stroke(); } }
  // joues
  g.fillStyle = 'rgba(255,120,150,.35)'; g.beginPath(); g.arc(-r * 0.6, r * 0.2, r * 0.12, 0, Math.PI * 2); g.arc(r * 0.6, r * 0.2, r * 0.12, 0, Math.PI * 2); g.fill();
  g.restore();
}

// ---------------------------------------------------------------------------
// Interface (écrans DOM)
// ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const ECRANS = ['titre', 'intro', 'niveaux', 'pause', 'victoire', 'defaite', 'bilan', 'etagere'];
function montrer(id) {
  for (const e of ECRANS) $(e).hidden = e !== id;
  const enStand = ['intro', 'jeu', 'pause'].includes(id) || id === null;
  $('hud').hidden = !enStand;
  $('infos').hidden = !(id === null || id === 'pause');
}
function nomStand(n) { return tr('stand.' + n); }
function majHud() {
  if (!S) return;
  $('hud-titre').innerHTML = '';
  const t1 = document.createElement('span'); t1.textContent = tr('hud.stand', { n: S.n, total: NIVEAUX.length });
  const t2 = document.createElement('small'); t2.textContent = nomStand(S.n);
  $('hud-titre').append(t1, t2);
  const reste = tr('hud.anneaux', { n: S.anneaux });
  $('objectif').textContent = (S.ordre ? tr('hud.commandes', { n: S.reussis, total: S.def.objectif }) : tr('hud.cibles', { n: S.reussis, total: S.def.objectif })) + ' · ' + reste;
  $('ordre').hidden = !S.ordre;
  if (S.ordre) dessinerCommande();
}
function bumpObjectif() { const o = $('objectif'); o.classList.remove('bump'); void o.offsetWidth; o.classList.add('bump'); }

function iconeType(t, couleur) {
  const f = couleur || '#3a2350';
  if (t === 'bouteille') return '<svg viewBox="0 0 20 20"><path d="M8 1h4v5l2 3v10H6V9l2-3z" fill="' + f + '"/></svg>';
  if (t === 'cone') return '<svg viewBox="0 0 20 20"><path d="M8.5 2h3L16 18H4z" fill="' + f + '"/><rect x="2" y="17" width="16" height="2" fill="' + f + '"/></svg>';
  return '<svg viewBox="0 0 20 20"><ellipse cx="9" cy="13" rx="8" ry="5" fill="' + f + '"/><circle cx="13" cy="6" r="4" fill="' + f + '"/><path d="M16 6l4 1-4 1z" fill="#ff9f1c"/></svg>';
}
function iconeCouleur(c) {
  const col = COULEURS[c];
  const formes = {
    r: '<path d="M10 17C2 11 3 4 7 4c1.8 0 2.6 1.3 3 2 .4-.7 1.2-2 3-2 4 0 5 7-3 13z" fill="#fff"/>',
    b: '<path d="M10 3l5 7-5 7-5-7z" fill="#fff"/>',
    j: '<path d="M10 2l2.3 5 5.4.4-4.1 3.6 1.3 5.3L10 13.5 5.1 16.3l1.3-5.3L2.3 7.4 7.7 7z" fill="#fff"/>',
    v: '<circle cx="10" cy="10" r="5" fill="#fff"/>',
  };
  void col;
  return '<svg viewBox="0 0 20 20">' + formes[c] + '</svg>';
}
function dessinerCommande() {
  if (!S || !S.ordre) return;
  const nom = S.def.ordres[S.ordre.i];
  const box = $('ordre-pastilles');
  box.innerHTML = '';
  if (!nom) { $('ordre-txt').textContent = tr('ordre.fini'); return; }
  const cmd = COMMANDES[nom];
  $('ordre-txt').textContent = tr('ordre.' + nom);
  cmd.items.forEach((it, i) => {
    const s = document.createElement('span');
    s.className = 'pastille' + (i < S.ordre.prog ? ' faite' : '');
    if (it.c) { s.style.background = COULEURS[it.c].fond; s.innerHTML = it.t ? iconeType(it.t, '#fff') : iconeCouleur(it.c); }
    else s.innerHTML = iconeType(it.t);
    box.appendChild(s);
  });
}

// Carte d'introduction
function montrerIntro() {
  ecran = 'intro';
  enPause = false;
  const n = S.n, def = S.def;
  $('intro-allee').textContent = tr('allee.' + def.allee);
  $('intro-titre').textContent = tr('hud.stand', { n, total: NIVEAUX.length }) + ' · ' + nomStand(n);
  $('intro-texte').textContent = tr('intro.' + n);
  $('intro-etapes').hidden = n !== 1;
  $('intro-but').textContent = def.ordres
    ? tr('but.commandes', { n: def.objectif, a: def.anneaux })
    : tr('but.cibles', { n: def.objectif, a: def.anneaux });
  demo.t = 0; demo.vol = null; demo.v = null;
  montrer('intro');
  $('infos').hidden = false;
  majHud();
}
function fermerIntro() {
  if (ecran !== 'intro') return;
  SONS.clic();
  ecran = 'jeu';
  montrer(null);
}
$('intro').addEventListener('pointerdown', (e) => { e.preventDefault(); audio(); fermerIntro(); });

// Pause
function pauser() {
  if (ecran !== 'jeu' || !S || !S.actif) return;
  enPause = true; ecran = 'pause'; visee.actif = false;
  try { if (AC) AC.suspend(); } catch (e) { /* rien */ }
  montrer('pause');
  try { $('b-reprendre').focus(); } catch (e) { /* rien */ }
}
function reprendre() {
  enPause = false; ecran = 'jeu';
  try { if (AC && P.son) AC.resume(); } catch (e) { /* rien */ }
  montrer(null);
}
$('b-pause').addEventListener('click', () => { SONS.clic(); if (ecran === 'intro') { fermerIntro(); } pauser(); });
$('b-reprendre').addEventListener('click', () => { reprendre(); SONS.clic(); });
$('b-recommencer').addEventListener('click', () => { reprendre(); SONS.clic(); demarrerStand(S.n); });
$('b-pause-accueil').addEventListener('click', () => { enPause = false; allerAccueil(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && ecran === 'jeu') pauser(); });

document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', () => {
  P.son = !P.son; garderLocal(); majBoutonsSon();
  if (P.son) SONS.clic();
}));

// Étoiles gagnées selon les anneaux économisés
function calculerEtoiles(def, reste) {
  const extra = def.anneaux - def.objectif;
  if (reste >= Math.ceil(extra * 0.5)) return 3;
  if (reste >= Math.ceil(extra * 0.2)) return 2;
  return 1;
}

function sauverPartie(niveau) {
  try { JEL_SAVE.save(JEU, { niveau, score: totalScore(), options: P }); } catch (e) { /* rien */ }
}

function victoire() {
  ecran = 'fin';
  if (window.FMG) window.FMG.reportEnd({ completed: true, level: S.n });
  const i = S.n - 1, def = S.def;
  const bonusReste = S.anneaux * 30;
  const score = S.score + bonusReste;
  const etoiles = calculerEtoiles(def, S.anneaux);
  const ancienRecord = P.records[i] || 0;
  const record = score > ancienRecord;
  const avantEtoiles = totalEtoiles();
  const nouvellePeluche = !P.peluches[i];
  P.etoiles[i] = Math.max(P.etoiles[i] || 0, etoiles);
  P.records[i] = Math.max(ancienRecord, score);
  P.peluches[i] = true;
  garderLocal();
  sauverPartie(S.n + 1);
  niveauOuvertSauvegarde = Math.max(niveauOuvertSauvegarde, S.n + 1);
  const debloque = ANNEAUX.find((a) => a.seuil > avantEtoiles && a.seuil <= totalEtoiles());

  $('v-titre').textContent = tr(etoiles === 3 ? 'victoire.titre3' : 'victoire.titre');
  $('v-detail').textContent = tr('victoire.detail', { n: S.anneaux, points: bonusReste });
  $('v-record').textContent = record ? tr('victoire.record') : tr('victoire.recordActuel', { n: ancienRecord });
  const spans = $('v-etoiles').querySelectorAll('span');
  spans.forEach((s) => s.classList.remove('on'));
  $('v-etoiles').setAttribute('aria-label', tr('aria.etoiles', { n: etoiles }));
  for (let k = 0; k < etoiles; k++) setTimeout(() => { spans[k].classList.add('on'); SONS.etoile(k); }, 500 + k * 380);
  // Score qui défile
  const el = $('v-score'); let v = 0; const pas = Math.max(1, Math.round(score / 40));
  const anim = () => { v = Math.min(score, v + pas); el.textContent = tr('victoire.score', { n: v }); if (v < score && ecran === 'fin') requestAnimationFrame(anim); };
  anim();
  // Peluche gagnée
  const zp = $('v-peluche');
  zp.hidden = !nouvellePeluche;
  if (nouvellePeluche) {
    const c = zp.querySelector('canvas'), g = c.getContext('2d');
    g.clearRect(0, 0, 140, 140); g.save(); dessinerPeluche(g, 70, 52, 120, PELUCHES[i], true); g.restore();
    zp.querySelector('p').textContent = tr('victoire.peluche', { nom: tr('peluche.' + PELUCHES[i].id) });
  }
  const zs = $('v-skin');
  zs.hidden = !debloque;
  if (debloque) {
    const c = zs.querySelector('canvas'), g = c.getContext('2d');
    g.clearRect(0, 0, 88, 60); dessinerAnneau(g, 44, 30, 30, 13, debloque, 1);
    zs.querySelector('p').textContent = tr('victoire.skin', { nom: tr('skin.' + debloque.id) });
  }
  $('b-suivant').textContent = S.n < NIVEAUX.length ? tr('bouton.suivant') : tr('bouton.bilan');
  SONS.victoire();
  confettis(70);
  montrer('victoire');
}
function defaite() {
  ecran = 'fin';
  if (window.FMG) window.FMG.reportEnd({ completed: false, level: S.n });
  const i = S.n - 1;
  $('d-detail').textContent = S.ordre
    ? tr('defaite.detailCommandes', { n: S.reussis, total: S.def.objectif })
    : tr('defaite.detail', { n: S.reussis, total: S.def.objectif });
  $('d-score').textContent = tr('victoire.score', { n: S.score });
  $('d-record').textContent = P.records[i] ? tr('victoire.recordActuel', { n: P.records[i] }) : '';
  SONS.defaite();
  montrer('defaite');
}
$('b-suivant').addEventListener('click', () => {
  SONS.clic();
  if (S.n < NIVEAUX.length) demarrerStand(S.n + 1);
  else montrerBilan();
});
$('b-v-rejouer').addEventListener('click', () => { SONS.clic(); demarrerStand(S.n); });
$('b-v-stands').addEventListener('click', () => { SONS.clic(); ouvrirStands(); });
$('b-reessayer').addEventListener('click', () => { SONS.clic(); demarrerStand(S.n); });
$('b-d-stands').addEventListener('click', () => { SONS.clic(); ouvrirStands(); });
$('b-d-accueil').addEventListener('click', () => { SONS.clic(); allerAccueil(); });

function montrerBilan() {
  ecran = 'fin';
  $('b-etoiles').textContent = tr('bilan.etoiles', { n: totalEtoiles(), total: TOTAL_ETOILES });
  $('b-peluches').textContent = tr('bilan.peluches', { n: nbPeluches(), total: PELUCHES.length });
  $('b-score').textContent = tr('bilan.score', { n: totalScore() });
  confettis(90);
  SONS.victoire();
  montrer('bilan');
}
$('b-bilan-etagere').addEventListener('click', () => { SONS.clic(); ouvrirEtagere('bilan'); });
$('b-bilan-rejouer').addEventListener('click', () => { SONS.clic(); demarrerStand(1); });
$('b-bilan-accueil').addEventListener('click', () => { SONS.clic(); allerAccueil(); });

// Accueil
function allerAccueil() {
  S = null; ecran = 'titre'; enPause = false;
  try { if (AC && P.son) AC.resume(); } catch (e) { /* rien */ }
  montrer('titre');
}

// Sélection des stands
let retourStands = 'titre';
function ouvrirStands() {
  retourStands = S ? 'stand' : 'titre';
  S = null; ecran = 'niveaux';
  const box = $('liste-stands'); box.innerHTML = '';
  for (let a = 0; a < 4; a++) {
    const t = document.createElement('div'); t.className = 'allee-t'; t.textContent = tr('allee.' + a);
    const g = document.createElement('div'); g.className = 'grille';
    for (let k = 0; k < 5; k++) {
      const i = a * 5 + k, n = i + 1;
      const b = document.createElement('button'); b.className = 'case';
      const ouvert = standOuvert(i);
      if (ouvert) {
        const num = document.createElement('span'); num.textContent = nombre(n);
        const et = document.createElement('span'); et.className = 'et'; et.textContent = '★'.repeat(P.etoiles[i]) + '☆'.repeat(3 - P.etoiles[i]);
        b.append(num, et);
        b.setAttribute('aria-label', tr('aria.standCase', { n, e: P.etoiles[i] }));
        b.addEventListener('click', () => { SONS.clic(); demarrerStand(n); });
      } else {
        b.disabled = true;
        b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3h1v11H6V10zm2 0h6V7a3 3 0 0 0-6 0z"/></svg>';
        b.setAttribute('aria-label', tr('aria.standFerme', { n }));
      }
      g.appendChild(b);
    }
    box.append(t, g);
  }
  montrer('niveaux');
}
$('b-stands').addEventListener('click', () => { audio(); SONS.clic(); ouvrirStands(); });
$('b-niveaux-retour').addEventListener('click', () => { SONS.clic(); allerAccueil(); });

// Étagère de la chambre
let retourEtagere = 'titre';
function ouvrirEtagere(depuis) {
  retourEtagere = depuis || 'titre';
  S = null; ecran = 'etagere';
  $('etagere-compte').textContent = tr('etagere.compte', { n: nbPeluches(), total: PELUCHES.length });
  dessinerEtagere();
  const box = $('liste-skins'); box.innerHTML = '';
  for (const sk of ANNEAUX) {
    const b = document.createElement('button'); b.className = 'skin' + (sk.id === P.skin ? ' choisi' : '');
    const c = document.createElement('canvas'); c.width = 88; c.height = 60;
    const g = c.getContext('2d'); dessinerAnneau(g, 44, 30, 30, 13, sk, 1);
    const nomS = document.createElement('span');
    const ok = skinDebloque(sk);
    nomS.textContent = ok ? tr('skin.' + sk.id) : tr('etagere.seuil', { n: sk.seuil });
    b.append(c, nomS);
    b.setAttribute('aria-pressed', sk.id === P.skin ? 'true' : 'false');
    if (!ok) { b.disabled = true; b.setAttribute('aria-label', tr('skin.' + sk.id) + ' · ' + tr('etagere.seuil', { n: sk.seuil })); }
    else b.addEventListener('click', () => { SONS.tink(); P.skin = sk.id; garderLocal(); ouvrirEtagere(retourEtagere); });
    box.appendChild(b);
  }
  montrer('etagere');
}
function dessinerEtagere() {
  const c = $('canvas-etagere'), g = c.getContext('2d');
  const w = c.width, h = c.height;
  // mur de la chambre
  const fond = g.createLinearGradient(0, 0, 0, h);
  fond.addColorStop(0, '#ffe7f1'); fond.addColorStop(1, '#ffd3e5');
  g.fillStyle = fond; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,.6)';
  for (let y = 30; y < h; y += 90) for (let x = (y / 90 % 2) * 45 + 20; x < w; x += 90) { g.beginPath(); g.arc(x, y, 7, 0, Math.PI * 2); g.fill(); }
  const rangs = 4, cols = 5, hr = h / rangs;
  for (let r = 0; r < rangs; r++) {
    const yb = (r + 1) * hr - 18;
    g.fillStyle = '#b07a4a'; g.fillRect(14, yb, w - 28, 18);
    g.fillStyle = '#8a5a30'; g.fillRect(14, yb + 18, w - 28, 8);
    for (let k = 0; k < cols; k++) {
      const i = r * cols + k;
      const x = 14 + (w - 28) * (k + 0.5) / cols;
      dessinerPeluche(g, x, yb - hr * 0.56, hr * 0.62, PELUCHES[i], !!P.peluches[i]);
    }
  }
}
$('b-etagere').addEventListener('click', () => { audio(); SONS.clic(); ouvrirEtagere('titre'); });
$('b-etagere-retour').addEventListener('click', () => {
  SONS.clic();
  if (retourEtagere === 'bilan') montrerBilan(); else allerAccueil();
});

// Bouton Jouer : reprise avec save.js
function boutonJouer() {
  audio(); SONS.clic();
  JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => {
      const n = Math.max(1, Math.min(NIVEAUX.length, Number(d.niveau) || 1));
      niveauOuvertSauvegarde = Math.max(niveauOuvertSauvegarde, n);
      demarrerStand(n);
    },
    onNouvelle: () => demarrerStand(1),
    onEffacer: () => {
      P = { etoiles: [], records: [], peluches: [], skin: 'classique', son: P.son };
      for (let i = 0; i < NIVEAUX.length; i++) { P.etoiles[i] = 0; P.records[i] = 0; P.peluches[i] = false; }
      niveauOuvertSauvegarde = 1;
      garderLocal();
      demarrerStand(1);
    },
  });
}
$('b-jouer').addEventListener('click', boutonJouer);

// Sauvegarde à la fermeture, seulement pendant un stand
JEL_SAVE.surFermeture(() => {
  if (S && (ecran === 'jeu' || ecran === 'intro' || ecran === 'pause')) sauverPartie(S.n);
});

// Démarrage
chargerProgression();
try { const d = JEL_SAVE.load(JEU); if (JEL_SAVE.existe(JEU)) niveauOuvertSauvegarde = Math.max(1, Math.min(NIVEAUX.length, Number(d.niveau) || 1)); } catch (e) { /* rien */ }
majBoutonsSon();
preparerTitre();
montrer('titre');
requestAnimationFrame(boucle);
</script>
