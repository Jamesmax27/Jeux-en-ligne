<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1033; color: #fff8ec;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  .gros { min-height: 56px; padding: 12px 26px; border: 0; border-radius: 999px; font-size: 22px; font-weight: 800;
    background: linear-gradient(180deg, #ffd166, #ff9f43); color: #4a1d00; box-shadow: 0 5px 0 #b35a00, 0 8px 18px rgba(0,0,0,.35); }
  .gros:active { transform: translateY(3px); box-shadow: 0 2px 0 #b35a00; }
  .moyen { min-height: 48px; padding: 10px 18px; border: 0; border-radius: 999px; font-size: 17px; font-weight: 700;
    background: #3b2a6b; color: #fff8ec; box-shadow: 0 4px 0 #22164a; }

  .rond { width: 48px; height: 48px; min-width: 48px; border: 0; border-radius: 50%; background: rgba(27,16,51,.72);

  button:focus-visible { outline: 3px solid #a8f0ff; outline-offset: 3px; }

  .ecran { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; z-index: 10; text-align: center; }
  .ecran[hidden] { display: none !important; }
  .voile { background: rgba(20,10,40,.62); }
  .carte { background: #fff6e6; color: #3a2350; border-radius: 26px; padding: 20px 20px 22px; width: min(92vw, 430px);

  .carte p { margin: 6px 0; font-size: 17px; line-height: 1.35; }
  .boutons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
  .carte .moyen { background: #5b3fa0; }

  /* Écran titre */
  #titre { justify-content: flex-start; padding: 14px 14px 22px; }
  #titre .bas { margin-top: auto; }
  #titre .haut { width: 100%; display: flex; justify-content: space-between; align-items: center; }
  #titre .bloc { margin-top: 2vh; }
  #titre h1 { margin: 0; font-size: clamp(30px, 9vw, 52px); line-height: 1.05; color: #fff3c4;
    text-shadow: 0 3px 0 #c2185b, 0 6px 16px rgba(0,0,0,.5); }
  #titre .consigne { margin: 10px auto 0; max-width: 420px; font-size: 18px; line-height: 1.35; font-weight: 600;
    background: rgba(27,16,51,.66); border-radius: 18px; padding: 10px 14px; }
  #titre .bas { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #titre .bas .ligne { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #titre .gros { font-size: 26px; padding: 14px 44px; }
  #langue-titre, #langue-pause { min-width: 48px; min-height: 48px; display: flex; align-items: center; justify-content: center; }

  /* Interface de jeu */
  #hud { position: fixed; left: 0; right: 0; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 8px 10px; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #hud[hidden], #infos[hidden] { display: none; }
  #hud-titre { flex: 1; text-align: center; font-weight: 800; font-size: 16px; line-height: 1.15;
    background: rgba(27,16,51,.72); border-radius: 16px; padding: 6px 10px; pointer-events: none; }
  #hud-titre small { display: block; font-weight: 600; font-size: 12px; color: #ffd98a; }
  #infos { position: fixed; top: 66px; left: 0; right: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; gap: 6px;
    pointer-events: none; padding: 0 10px; }
  #objectif { background: rgba(255,246,230,.94); color: #3a2350; font-weight: 800; border-radius: 999px; padding: 5px 14px; font-size: 16px;
    box-shadow: 0 3px 8px rgba(0,0,0,.25); }
  #objectif.bump { animation: bump .4s; }
  @keyframes bump { 40% { transform: scale(1.18); } }
  #ordre { display: flex; align-items: center; gap: 8px; background: #fff6e6; color: #3a2350; border-radius: 18px; padding: 6px 10px;

  #ordre[hidden] { display: none; }
  #ordre svg.forain { width: 38px; height: 38px; flex: none; }
  #ordre .txt { font-weight: 800; font-size: 15px; text-align: left; line-height: 1.15; }

  #ordre.oups { animation: oups .45s; }

  .pastille { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    border: 2px solid #3a2350; background: #fff; position: relative; }
  .pastille svg { width: 18px; height: 18px; }
  .pastille.faite::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 3px solid #28b463;
    background: rgba(40,180,99,.35); }

  /* Carte d'introduction d'un stand */
  #intro { justify-content: flex-start; padding-top: 70px; pointer-events: auto; }
  #intro .carte { width: min(92vw, 400px); padding: 14px 16px; background: rgba(255,246,230,.96); }
  #intro h2 { font-size: 21px; margin-bottom: 4px; }
  #intro .allee { font-size: 13px; font-weight: 700; color: #7b4dbb; text-transform: uppercase; letter-spacing: .04em; }
  #intro ol { text-align: left; margin: 6px 0 4px; padding-left: 22px; font-size: 16px; line-height: 1.35; }
  #intro .but { font-weight: 800; color: #c2185b; }
  #intro .touche { margin-top: 8px; font-size: 14px; font-weight: 700; color: #7b4dbb; animation: clign 1.4s infinite; }
  @keyframes clign { 50% { opacity: .45; } }

  /* Stands */
  #niveaux .carte { width: min(94vw, 520px); }
  .allee-t { margin: 12px 0 6px; font-weight: 800; color: #7b4dbb; font-size: 16px; text-align: left; }
  .grille { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .case { min-height: 64px; border: 0; border-radius: 16px; background: #ffd98a; color: #4a1d00; font-weight: 900; font-size: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 2px; box-shadow: 0 3px 0 #c98a1e; }
  .case .et { font-size: 12px; letter-spacing: 1px; color: #c2185b; }
  .case[disabled] { background: #d9d2e6; color: #8b80a3; box-shadow: none; cursor: default; }
  .case svg { width: 20px; height: 20px; fill: #8b80a3; }

  /* Victoire / défaite */
  .etoiles { font-size: 46px; letter-spacing: 6px; margin: 4px 0; min-height: 56px; }
  .etoiles span { display: inline-block; color: #d9d2e6; transform: scale(.6); transition: transform .35s, color .35s; }
  .etoiles span.on { color: #ffb400; transform: scale(1.1); text-shadow: 0 2px 0 #c97a00; }
  .score-g { font-size: 30px; font-weight: 900; color: #3a2350; }
  .record { font-weight: 800; color: #28b463; }
  .gain { display: flex; align-items: center; justify-content: center; gap: 10px; background: #ffeec8; border-radius: 16px; padding: 6px 10px; margin-top: 8px; }
  .gain canvas { width: 70px; height: 70px; }
  .gain p { margin: 0; font-weight: 700; text-align: left; }

  /* Étagère */
  #etagere .carte { width: min(94vw, 520px); }
  #canvas-etagere { width: 100%; height: auto; aspect-ratio: 5 / 4.4; display: block; border-radius: 16px; }
  .skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-top: 10px; }
  .skin { min-height: 72px; border: 3px solid transparent; border-radius: 16px; background: #efe4ff; color: #3a2350; font-size: 12px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 4px; }
  .skin.choisi { border-color: #c2185b; background: #ffe0ef; }
  .skin[disabled] { opacity: .55; cursor: default; }
  .skin canvas { width: 44px; height: 30px; }

<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------

  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier

  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +

    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +

    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

    selecteurs.forEach(function (s) { s.maj(); });

    var isole = !!(coin || options.isole);

      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';

    bouton.setAttribute('aria-expanded', 'false');

    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }

      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();

    function fermer(rendreFocus) {

      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    });

    });
    bouton.addEventListener('keydown', function (e) {

    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    var element = boite;

      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {

    var ok = false;
    if (direct) {

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {

    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

  r.vx += (S.vent || 0) * dt;
  const hAvant = r.h;
  r.x += r.vx * dt; r.z += r.vz * dt; r.h += r.vh * dt; r.vh -= r.g * dt;
  // Fond du stand et côtés
  if (r.z > 1.18) { r.z = 1.18; r.vz = -Math.abs(r.vz) * 0.25; r.vx *= 0.5; if (!fantome) SONS.toc(); }
  if (r.z < -0.3) { r.z = -0.3; r.vz = Math.abs(r.vz) * 0.3; }
  if (Math.abs(r.x) > 1.14) { r.x = Math.sign(r.x) * 1.14; r.vx = -r.vx * 0.4; }
  // Plots en caoutchouc : rebond élastique
  for (const p of S.plots) {
    if (r.h > PLOT_H) continue;
    const dx = r.x - p.x, dz = r.z - p.z, d = Math.hypot(dx, dz) || 0.001;
    if (d < PLOT_R + R_ANNEAU * 0.55) {
      const nx = dx / d, nz = dz / d, vn = r.vx * nx + r.vz * nz;
      r.x = p.x + nx * (PLOT_R + R_ANNEAU * 0.56); r.z = p.z + nz * (PLOT_R + R_ANNEAU * 0.56);
      if (vn < 0) { r.vx -= 2 * vn * nx; r.vz -= 2 * vn * nz; }
      r.vx *= 0.85; r.vz *= 0.85;
      r.vh = Math.max(r.vh, 1.5);
      r.rebond = true;
      if (!fantome) { p.boing = 1; SONS.boing(); popup(tr('popup.boing'), r.x, r.z, 0.6, '#ff8fd0'); }
    }
  }
  // Manège : les chevaux et le mât arrêtent l'anneau
  if (S.manege) {
    for (const o of obstaclesManege()) {
      if (r.h > o.h) continue;
      const dx = r.x - o.x, dz = r.z - o.z, d = Math.hypot(dx, dz) || 0.001;
      if (d < o.r + R_ANNEAU * 0.5) {
        const nx = dx / d, nz = dz / d;
        r.x = o.x + nx * (o.r + R_ANNEAU * 0.52); r.z = o.z + nz * (o.r + R_ANNEAU * 0.52);
        r.vx = nx * 0.35 + r.vx * 0.15; r.vz = -Math.abs(r.vz) * 0.25 + nz * 0.2;
        r.vh = Math.min(r.vh, 0.2);
        if (!fantome && !r.bonk) { r.bonk = true; SONS.bonk(); popup(tr('popup.bonk'), r.x, r.z, 0.7, '#ffd166'); }
      }
    }
  }
  // Goulots : l'anneau passe-t-il autour en descendant ?
  if (r.vh < 0) {
    for (const c of S.cibles) {
      if (c.prise || c.apparition < 0.9 || r.tape.has(c)) continue;
      const top = hauteurCible(c);
      if (hAvant > top && r.h <= top) {
        const dx = r.x - c.x, dz = (r.z - c.z) * 1.1, d = Math.hypot(dx, dz);
        const tol = TYPES[c.type].tol * S.def.tol;
        if (d < tol) {
          if (fantome) { r.pris = c; return 'pris'; }
          attraper(r, c);
          return 'pris';
        } else if (d < tol + TYPES[c.type].corps) {
          // Touche le bord : petit rebond de côté
          const nx = dx / (d || 1), nz = dz / (d || 1);
          r.vx = nx * 0.75 + r.vx * 0.25; r.vz = nz * 0.6 + r.vz * 0.2; r.vh = 0.8;
          r.tape.add(c);
          if (!fantome) { SONS.tink(); popup(tr('popup.presque'), c.x, c.z, 0.55, '#a8f0ff'); }
        }
      }
    }
  }
  if (r.h <= 0) { r.h = 0; return 'sol'; }
  return 'vol';
}

function obstaclesManege() {
  const m = S.manege; const liste = [{ x: m.x, z: m.z, r: 0.045, h: 1.2 }];
  for (let i = 0; i < m.n; i++) {
    const a = m.a + i * Math.PI * 2 / m.n;
    liste.push({ x: m.x + Math.cos(a) * m.r, z: m.z + Math.sin(a) * m.r * 0.45, r: CHEVAL_R, h: CHEVAL_H, a, i });
  }
  return liste;
}

function attraper(r, c) {
  c.prise = 0.0001;
  c.prisePar = skinActuel();
  S.anneau = null;
  S.serie++;
  const enMouvement = c.mob && c.mob.kind !== 'fixe';
  let points = 100;
  if (enMouvement) points += 50;
  if (r.rebond) points += 100;
  if (S.serie >= 3) points += 50;
  S.score += points;
  SONS.ding(S.serie);
  etincelles(c.x, c.z, hauteurCible(c), 22);
  let texte = tr('popup.bravo');
  if (r.rebond) texte = tr('popup.rebond');
  else if (S.serie >= 3) texte = tr('popup.serie', { n: S.serie });
  let bon = true;
  if (S.ordre) bon = gererCommande(c);
  else { S.reussis++; bumpObjectif(); }
  if (bon) popup(texte, c.x, c.z, 0.7, '#fff3c4');
  popup('+' + nombre(points), c.x, c.z, 0.45, '#ffd166');
  majHud();
  verifierFin();
}

function gererCommande(c) {
  const nom = S.def.ordres[S.ordre.i];
  const cmd = COMMANDES[nom];
  if (!cmd) return true;
  const besoin = cmd.items[S.ordre.prog];
  const ok = (it) => (!it.c || it.c === c.c) && (!it.t || it.t === c.type);
  const el = document.getElementById('ordre');
  const bon = ok(besoin);
  if (bon) {
    S.ordre.prog++;
    if (S.ordre.prog >= cmd.items.length) {
      S.reussis++;
      S.score += 200;
      SONS.commande();
      popup(tr('popup.commande'), 0, 0.5, 1.0, '#7dffb0');
      confettis(30);
      S.ordre.i++; S.ordre.prog = 0;
      bumpObjectif();
    }
  } else {
    SONS.oups();
    if (cmd.affilee && S.ordre.prog > 0) {
      S.ordre.prog = ok(cmd.items[0]) ? 1 : 0;
      popup(tr('popup.recommence'), 0, 0.5, 1.0, '#ffb3b3');
    } else {
      popup(tr('popup.pasCa'), 0, 0.5, 1.0, '#ffb3b3');
    }
    el.classList.remove('oups'); void el.offsetWidth; el.classList.add('oups');
  }
  dessinerCommande();
  return bon;
}

function rate(r) {
  S.anneau = null;
  S.serie = 0;
  S.auSol.push({ x: r.x, z: r.z, vie: 1.4, skin: skinActuel() });
  SONS.toc();
  S.secousse = 0.18;
  verifierFin();
}

function verifierFin() {
  if (S.fini) return;
  if (S.reussis >= S.def.objectif) { S.fini = true; S.gagne = true; S.finDans = 1.1; }
  else if (S.anneaux <= 0 && !S.anneau) { S.fini = true; S.gagne = false; S.finDans = 1.0; }
}

// ---------------------------------------------------------------------------
// Mise à jour du monde
// ---------------------------------------------------------------------------
function majCibles(dt) {
  for (const c of S.cibles) {
    if (c.apparition < 1) c.apparition = Math.min(1, c.apparition + dt * 2.5);
    const m = c.mob;
    if (m && (m.kind === 'tapis' || m.kind === 'riviere')) {
      c.x += m.v * dt;
      if (m.v > 0 && c.x > 1.25) c.x -= 2.5;
      if (m.v < 0 && c.x < -1.25) c.x += 2.5;
    }
    if (m && m.kind === 'riviere') {
      c.z = m.z + 0.035 * Math.sin(temps * 1.6 + m.phase);
      c.bob = 0.018 * Math.sin(temps * 2.4 + m.phase * 1.3);
    }
    if (c.prise) c.prise += dt;
  }
  // Les cibles prises remontent puis sont remplacées
  for (let i = S.cibles.length - 1; i >= 0; i--) {
    const c = S.cibles[i];
    if (c.prise > 1.0) {
      S.cibles.splice(i, 1);
      S.aRenaitre.push({ dans: 0.6, m: c.mob, x: c.x, type: c.type });
    }
  }
  for (let i = S.aRenaitre.length - 1; i >= 0; i--) {
    const a = S.aRenaitre[i];
    a.dans -= dt;
    if (a.dans > 0) continue;
    S.aRenaitre.splice(i, 1);
    const m = a.m;
    let type = a.type, x = a.x;
    if (m.kind === 'tapis') { type = choisirType(m.types); x = a.x - 2.5 * Math.sign(m.v); }
    else if (m.kind === 'riviere') { x = a.x - 2.5 * Math.sign(m.v); }
    else type = choisirType(['bouteille', 'cone', 'canard'], type);
    const n = nouvelleCible(type, x, m.kind === 'fixe' ? m.z : m.z, choisirCouleur(), m);
    n.apparition = m.kind === 'fixe' ? 0 : 1;
    S.cibles.push(n);
  }
  for (const p of S.plots) if (p.boing > 0) p.boing = Math.max(0, p.boing - dt * 2.5);
  if (S.manege) S.manege.a += S.manege.w * dt;
}
function choisirType(types, garde) {
  if (S && S.ordre) {
    const b = besoinActuel();
    if (b && b.t && types.includes(b.t) && hasard() < 0.5) return b.t;
  }
  if (garde && !(S && S.ordre)) return garde;
  return choisir(types);
}

function majStand(dt) {
  majCibles(dt);
  // Anneau en vol (sous-pas pour des collisions sûres)
  if (S.anneau) {
    const pas = 1 / 240;
    let reste = dt;
    while (reste > 0 && S.anneau) {
      const d = Math.min(pas, reste); reste -= d;
      const res = avancerAnneau(S.anneau, d);
      if (res === 'sol') { rate(S.anneau); break; }
    }
    if (!S.anneau) tirerVent();
  }
  for (let i = S.auSol.length - 1; i >= 0; i--) { S.auSol[i].vie -= dt; if (S.auSol[i].vie <= 0) S.auSol.splice(i, 1); }
  if (S.secousse > 0) S.secousse = Math.max(0, S.secousse - dt);
  if (S.fini && S.actif) {
    S.finDans -= dt;
    if (S.finDans <= 0) { S.actif = false; if (S.gagne) victoire(); else defaite(); }
  }
}

// Particules et messages flottants
function etincelles(x, z, h, n) {
  const p = proj(x, z, h);
  for (let i = 0; i < n; i++) {
    const a = hasard() * Math.PI * 2, v = 60 + hasard() * 160;
    S.parts.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, vie: 0.7 + hasard() * 0.4, c: choisir(['#fff3c4', '#ffd166', '#ff8fd0', '#a8f0ff']), t: 3 + hasard() * 3 });
  }
}
function confettis(n) {
  for (let i = 0; i < n; i++) decor.confettis.push({ x: hasard() * W, y: -20 - hasard() * H * 0.3, vx: (hasard() - 0.5) * 60, vy: 120 + hasard() * 160, r: hasard() * 6, vr: (hasard() - 0.5) * 10, c: choisir(['#ff5a5f', '#ffd166', '#3b82f6', '#2fb36b', '#ff8fd0', '#fff']), vie: 4 });
}
function popup(texte, x, z, h, couleur) {
  if (!S) return;
  const p = proj(x, z, h);
  S.popups.push({ texte, x: p.x, y: p.y, vie: 1.2, c: couleur });
}

// ---------------------------------------------------------------------------
// Dessin du décor (une allée tous les 5 stands)
// ---------------------------------------------------------------------------
const CIELS = [
  ['#7fd3ff', '#ffe6b3'],          // fanions : jour
  ['#ff9a5a', '#7b3f8f'],          // lampions : soir
  ['#5a3d8f', '#1f2457'],          // grande roue : crépuscule
  ['#0c0f2e', '#1b1340'],          // feu d'artifice : nuit
];
function dessinerCiel(allee) {
  const g = ctx.createLinearGradient(0, 0, 0, L.yFar);
  g.addColorStop(0, CIELS[allee][1]); g.addColorStop(1, CIELS[allee][0]);
  if (allee === 0) { g.addColorStop(0, CIELS[0][0]); g.addColorStop(1, CIELS[0][1]); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, L.yFar + 2);
  if (allee >= 2) { // étoiles
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 50; i++) {
      const x = (i * 137.5) % W, y = (i * 61.3) % (L.yFar * 0.8);
      ctx.globalAlpha = 0.3 + 0.5 * Math.abs(Math.sin(temps * 0.8 + i));
      ctx.fillRect(x, y, 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  if (allee === 0) { // nuages
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < 4; i++) {
      const x = ((i * 0.31 + temps * 0.01) % 1.2 - 0.1) * W, y = H * (0.08 + 0.05 * (i % 2));
      nuage(x, y, H * 0.03);
    }
  }
  // Tentes au loin
  for (let i = 0; i < 7; i++) {
    const x = (i / 6) * W, w = W * 0.2, y = L.yFar - H * 0.02;
    const c = i % 2 ? '#e94e77' : '#f6d55c';
    ctx.fillStyle = allee >= 2 ? assombrir(c, 0.45) : c;
    ctx.beginPath(); ctx.moveTo(x - w / 2, y); ctx.lineTo(x, y - H * 0.07); ctx.lineTo(x + w / 2, y); ctx.fill();
    ctx.fillStyle = allee >= 2 ? '#2a2050' : '#ffffff';
    ctx.fillRect(x - w * 0.4, y, w * 0.8, H * 0.02);
  }
  if (allee === 2 || allee === 3) grandeRoue(L.ox + L.pw * 0.12, L.yFar - H * 0.12, H * 0.14, allee === 3 ? 0.55 : 1);
  if (allee === 3) feuxArtifice();
  // Guirlande : fanions ou lampions
  guirlande(allee, H * 0.165);
}
function nuage(x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.arc(x + r, y - r * 0.4, r * 1.2, 0, Math.PI * 2); ctx.arc(x + r * 2.2, y, r, 0, Math.PI * 2); ctx.fill();
}
function assombrir(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function grandeRoue(x, y, r, alpha) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x - r * 0.5, y + r * 1.4); ctx.lineTo(x, y); ctx.lineTo(x + r * 0.5, y + r * 1.4); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  const a0 = temps * 0.25;
  for (let i = 0; i < 10; i++) {
    const a = a0 + i * Math.PI / 5, px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    ctx.strokeStyle = 'rgba(255,233,168,.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(px, py); ctx.stroke();
    ctx.fillStyle = ['#ff5a5f', '#ffd166', '#3b82f6', '#2fb36b', '#ff8fd0'][i % 5];
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(px - r * 0.11, py, r * 0.22, r * 0.18, 4) : ctx.rect(px - r * 0.11, py, r * 0.22, r * 0.18); ctx.fill();
    ctx.fillStyle = '#fff7c2'; ctx.beginPath(); ctx.arc(px, py, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function feuxArtifice() {
  if (hasard() < 0.02 && decor.feux.length < 6) {
    const x = L.ox + L.pw * (0.3 + hasard() * 0.65), y = H * (0.07 + hasard() * 0.15), c = choisir(['#ff5a5f', '#ffd166', '#7dffb0', '#a8f0ff', '#ff8fd0']);
    const bouquet = { x, y, c, vie: 1.6, eclats: [] };
    for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2; bouquet.eclats.push({ a, v: 0.6 + hasard() * 0.4 }); }
    decor.feux.push(bouquet);
  }
  for (const f of decor.feux) {
    const k = 1.6 - f.vie, R = H * 0.09 * Math.min(1, k * 1.6);
    ctx.globalAlpha = Math.max(0, f.vie / 1.6);
    ctx.fillStyle = f.c;
    for (const e of f.eclats) ctx.fillRect(f.x + Math.cos(e.a) * R * e.v, f.y + Math.sin(e.a) * R * e.v + k * k * 12, 3, 3);
  }
  ctx.globalAlpha = 1;
}
function guirlande(allee, y) {
  const n = 9, x0 = L.ox - 10, x1 = L.ox + L.pw + 10;
  ctx.strokeStyle = allee === 0 ? '#6b4b2a' : '#3a2a20'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= 40; i++) { const u = i / 40, x = x0 + (x1 - x0) * u, yy = y + Math.sin(u * Math.PI * 3) * H * 0.012 + H * 0.01; i ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); }
  ctx.stroke();
  const couleurs = ['#ff5a5f', '#ffd166', '#3b82f6', '#2fb36b', '#ff8fd0'];
  for (let i = 0; i < n * 2; i++) {
    const u = (i + 0.5) / (n * 2), x = x0 + (x1 - x0) * u, yy = y + Math.sin(u * Math.PI * 3) * H * 0.012 + H * 0.01;
    const c = couleurs[i % couleurs.length];
    if (allee === 0) {
      ctx.fillStyle = c;
      const bat = Math.sin(temps * 3 + i) * 2;
      ctx.beginPath(); ctx.moveTo(x - 8, yy); ctx.lineTo(x + 8, yy); ctx.lineTo(x + bat, yy + 16); ctx.fill();
    } else {
      const lueur = 0.6 + 0.4 * Math.sin(temps * 2 + i * 1.3);
      ctx.fillStyle = c; ctx.globalAlpha = 0.25 * lueur;
      ctx.beginPath(); ctx.arc(x, yy + 9, 16, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.ellipse(x, yy + 9, 7, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3a2a20'; ctx.fillRect(x - 4, yy, 8, 2); ctx.fillRect(x - 4, yy + 17, 8, 2);
    }
  }
}

// Stand : sol en planches, rideau du fond, poteaux, auvent, comptoir
function dessinerStand(allee) {
  const a = proj(-1.2, 1.2), b = proj(1.2, 1.2), c = proj(1.25, -0.05), d = proj(-1.25, -0.05);
  // Allée pavée de la fête, autour du stand
  const SOLS = [['#e8d3a6', '#c9a86f'], ['#b88a72', '#7d5a52'], ['#6a5a8a', '#3d3360'], ['#3a3463', '#221d40']];
  const gs = ctx.createLinearGradient(0, L.yFar - H * 0.01, 0, H);
  gs.addColorStop(0, SOLS[allee][0]); gs.addColorStop(1, SOLS[allee][1]);
  ctx.fillStyle = gs; ctx.fillRect(0, L.yFar - H * 0.01, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  for (let i = 0; i < 40; i++) { const x = (i * 97.3) % W, y = L.yFar + ((i * 53.7) % (H - L.yFar)); ctx.fillRect(x, y, 14, 3); }
  // Rideau du fond (rayures)
  const hr = H * 0.07;
  const n = 12;
  for (let i = 0; i < n; i++) {
    const x = a.x + (b.x - a.x) * i / n;
    ctx.fillStyle = i % 2 ? '#fff4e0' : (allee === 3 ? '#7b2cbf' : '#d7263d');
    ctx.fillRect(x, a.y - hr, (b.x - a.x) / n + 1, hr);
  }
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(a.x, a.y - 6, b.x - a.x, 6);
  // Sol
  const g = ctx.createLinearGradient(0, a.y, 0, c.y);
  g.addColorStop(0, '#9c6b3f'); g.addColorStop(1, '#d39b62');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(90,50,20,.35)'; ctx.lineWidth = 1.5;
  for (let i = 1; i < 10; i++) {
    const u = i / 10, p = proj(-1.2 + 2.4 * u, 1.2), q = proj(-1.25 + 2.5 * u, -0.05);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  }
  // Poteaux
  for (const sx of [-1, 1]) {
    const p = proj(sx * 1.2, 1.2), q = proj(sx * 1.25, -0.05);
    ctx.fillStyle = '#7a4a26';
    ctx.fillRect(p.x - 5, H * 0.16, 10, p.y - H * 0.16);
    ctx.fillStyle = '#8f5a30';
    ctx.fillRect(q.x - (sx > 0 ? 4 : 10), H * 0.16, 14, q.y - H * 0.16);
  }
  // Peluches suspendues aux poteaux (décor)
  const pl = proj(-1.2, 1.2), pr = proj(1.2, 1.2);
  const tp = Math.min(W * 0.09, 46);
  [[pl.x - tp * 0.75, 0], [pl.x - tp * 0.75, 3], [pr.x + tp * 0.75, 13], [pr.x + tp * 0.75, 1]].forEach(([x, idx], k) => {
    const y = H * 0.24 + (k % 2) * tp * 1.25;
    ctx.strokeStyle = '#6b4b2a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, H * 0.16); ctx.lineTo(x, y - tp * 0.45); ctx.stroke();
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(temps * 1.5 + k) * 0.08);
    dessinerPeluche(ctx, 0, 0, tp, PELUCHES[idx], true);
    ctx.restore();
  });
  // Auvent festonné
  const ya = H * 0.12, hb = H * 0.05, nb = 10;
  for (let i = 0; i < nb; i++) {
    const x = L.ox - 6 + (L.pw + 12) * i / nb, w = (L.pw + 12) / nb;
    ctx.fillStyle = i % 2 ? '#fff4e0' : (allee === 3 ? '#7b2cbf' : '#d7263d');
    ctx.fillRect(x, 0, w + 1, ya);
    ctx.beginPath(); ctx.moveTo(x, ya); ctx.lineTo(x + w + 1, ya); ctx.arc(x + w / 2, ya, w / 2, 0, Math.PI); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(L.ox - 6, ya - 4, L.pw + 12, 4);
  void hb;
}
function dessinerComptoir() {
  const p = proj(-1.3, -0.04), q = proj(1.3, -0.04);
  const y = p.y;
  const g = ctx.createLinearGradient(0, y, 0, H);
  g.addColorStop(0, '#c0392b'); g.addColorStop(0.08, '#e85a4f'); g.addColorStop(0.1, '#8e3b1f'); g.addColorStop(1, '#5e2512');
  ctx.fillStyle = g;
  ctx.fillRect(Math.min(p.x, 0), y, Math.max(q.x, W) - Math.min(p.x, 0), H - y);
  ctx.fillStyle = '#f6c453';
  for (let i = 0; i < 14; i++) { const x = L.ox + L.pw * (i + 0.5) / 14; ctx.beginPath(); ctx.arc(x, y + H * 0.1, 4, 0, Math.PI * 2); ctx.fill(); }
  // Anneaux qui restent, posés sur le comptoir
  if (S) {
    const sk = skinActuel();
    const n = Math.max(0, S.anneaux - (S.anneau ? 0 : 1));
    const r = Math.min(16, L.pw * 0.035);
    for (let i = 0; i < n; i++) {
      const x = L.ox + 18 + (i % 8) * r * 1.5, yy = y + H * 0.045 + Math.floor(i / 8) * r * 0.9;

}

function symbole(c, x, y, r, col) {
  // Petit motif peint, différent pour chaque couleur (aide à les distinguer)
  ctx.fillStyle = col || '#fff';
  ctx.beginPath();
  if (c === 'r') { // cœur
    ctx.moveTo(x, y + r * 0.8);
    ctx.bezierCurveTo(x - r * 1.4, y - r * 0.2, x - r * 0.6, y - r * 1.2, x, y - r * 0.35);
    ctx.bezierCurveTo(x + r * 0.6, y - r * 1.2, x + r * 1.4, y - r * 0.2, x, y + r * 0.8);
  } else if (c === 'b') { // losange
    ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.75, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.75, y); ctx.closePath();
  } else if (c === 'j') { // étoile
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.closePath();
  } else { // rond
    ctx.arc(x, y, r * 0.7, 0, Math.PI * 2);
  }
  ctx.fill();
}

function dessinerCible(c) {
  const base = proj(c.x, c.z, c.bob || 0);
  const s = base.s;
  const u = L.hEch * s, lx = L.demi * s;
  const col = COULEURS[c.c];
  let monte = 0;
  if (c.prise) monte = Math.max(0, c.prise - 0.45) * 1.6;   // la cible prise remonte
  const k = c.apparition < 1 ? (1 - Math.pow(1 - c.apparition, 3)) : 1;
  ctx.save();
  ctx.translate(base.x, base.y - monte * u);
  ctx.scale(k, k);
  if (c.prise) ctx.globalAlpha = Math.max(0, 1 - Math.max(0, c.prise - 0.6) * 2.5);
  // Ombre
  if (!(c.mob && c.mob.kind === 'riviere')) { ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0, 0, lx * 0.085, lx * 0.03, 0, 0, Math.PI * 2); ctx.fill(); }
  if (c.type === 'bouteille') {
    const w = lx * 0.075, hc = u * 0.2, hn = u * 0.33;
    const g = ctx.createLinearGradient(-w, 0, w, 0);
    g.addColorStop(0, col.sombre); g.addColorStop(0.35, col.clair); g.addColorStop(1, col.fond);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-w, 0); ctx.lineTo(-w, -hc); ctx.quadraticCurveTo(-w, -hc - u * 0.06, -w * 0.38, -hc - u * 0.08);
    ctx.lineTo(-w * 0.38, -hn); ctx.lineTo(w * 0.38, -hn); ctx.lineTo(w * 0.38, -hc - u * 0.08);
    ctx.quadraticCurveTo(w, -hc - u * 0.06, w, -hc); ctx.lineTo(w, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff6e6'; ctx.fillRect(-w, -hc * 0.75, w * 2, hc * 0.45);
    symbole(c.c, 0, -hc * 0.52, w * 0.4, col.fond);
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(-w * 0.6, -hc * 0.95, w * 0.22, hc * 0.18);
    ctx.fillStyle = '#ffd166'; ctx.fillRect(-w * 0.45, -hn - u * 0.02, w * 0.9, u * 0.03);
  } else if (c.type === 'cone') {
    const w = lx * 0.09, h = u * 0.28;
    ctx.fillStyle = '#5b4636'; ctx.fillRect(-w * 1.15, -u * 0.02, w * 2.3, u * 0.025);
    ctx.fillStyle = col.fond;
    ctx.beginPath(); ctx.moveTo(-w, -u * 0.02); ctx.lineTo(-w * 0.22, -h); ctx.lineTo(w * 0.22, -h); ctx.lineTo(w, -u * 0.02); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff6e6';
    ctx.beginPath(); ctx.moveTo(-w * 0.72, -h * 0.3); ctx.lineTo(-w * 0.55, -h * 0.5); ctx.lineTo(w * 0.55, -h * 0.5); ctx.lineTo(w * 0.72, -h * 0.3); ctx.closePath(); ctx.fill();
    symbole(c.c, 0, -h * 0.4, w * 0.18, col.fond);
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.moveTo(-w * 0.6, -u * 0.03); ctx.lineTo(-w * 0.18, -h * 0.95); ctx.lineTo(-w * 0.05, -h * 0.95); ctx.lineTo(-w * 0.35, -u * 0.03); ctx.fill();
  } else {
    // Canard en bois peint, avec son cou-piquet
    const w = lx * 0.12, dir = (c.mob && c.mob.v < 0) ? -1 : 1;
    ctx.scale(dir, 1);
    // corps rond posé sur un socle, tête juste au-dessus (le cou est le goulot)
    const hc = TYPES.canard.haut * u;   // haut de la tête
    ctx.fillStyle = '#7a4a26'; ctx.fillRect(-w * 0.8, -u * 0.015, w * 1.6, u * 0.015);
    ctx.fillStyle = col.fond;
    ctx.beginPath(); ctx.ellipse(0, -hc * 0.3, w, hc * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-w * 0.9, -hc * 0.35); ctx.lineTo(-w * 1.3, -hc * 0.62); ctx.lineTo(-w * 0.6, -hc * 0.5); ctx.fill();
    ctx.fillStyle = col.clair;
    ctx.beginPath(); ctx.ellipse(-w * 0.15, -hc * 0.34, w * 0.5, hc * 0.13, -0.15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = col.fond; ctx.fillRect(w * 0.3, -hc * 0.8, w * 0.32, hc * 0.35);
    ctx.beginPath(); ctx.arc(w * 0.46, -hc + w * 0.36, w * 0.36, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff9f1c'; ctx.beginPath(); ctx.ellipse(w * 0.92, -hc + w * 0.42, w * 0.24, w * 0.1, 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(w * 0.56, -hc + w * 0.3, w * 0.11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2a1a3a'; ctx.beginPath(); ctx.arc(w * 0.59, -hc + w * 0.3, w * 0.055, 0, Math.PI * 2); ctx.fill();
    ctx.scale(dir, 1);
    symbole(c.c, -w * 0.2 * dir, -hc * 0.32, w * 0.22, '#fff6e6');
  }
  ctx.restore();
  // Anneau gagné qui glisse autour du goulot
  if (c.prise) {
    const top = hauteurCible(c);
    const desc = Math.min(1, c.prise / 0.35);
    const h = top - desc * top * 0.45;
    const p = proj(c.x, c.z, h + (c.bob || 0));
    ctx.save();
    if (c.prise > 0.6) ctx.globalAlpha = Math.max(0, 1 - (c.prise - 0.6) * 2.5);
    const yy = p.y - monte * u;
    dessinerAnneau(ctx, p.x, yy, R_VISU * L.demi * s, R_VISU * L.demi * s * 0.36, c.prisePar || skinActuel(), temps);
    ctx.restore();
  }
}

function dessinerAnneau(g, x, y, rx, ry, sk, t) {
  const ep = Math.max(2.5, rx * 0.3);
  g.save();
  g.lineWidth = ep;
  if (sk.arc) {
    const cols = ['#ff5a5f', '#ff9f1c', '#ffd166', '#2fb36b', '#3b82f6', '#8e5cff'];
    for (let i = 0; i < 6; i++) {
      g.strokeStyle = cols[i];
      g.beginPath(); g.ellipse(x, y, rx, ry, 0, i * Math.PI / 3, (i + 1) * Math.PI / 3 + 0.05); g.stroke();
    }
  } else {
    g.strokeStyle = sk.a;
    g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.stroke();
    // bandes peintes
    g.strokeStyle = sk.b; g.lineWidth = ep * 0.55;
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + (t || 0) * 0.3;
      g.beginPath(); g.ellipse(x, y, rx, ry, 0, a, a + 0.45); g.stroke();
    }
  }
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = Math.max(1, ep * 0.22);
  g.beginPath(); g.ellipse(x, y - ep * 0.15, rx * 0.95, ry * 0.92, 0, Math.PI * 1.1, Math.PI * 1.65); g.stroke();
  if (sk.p) {
    g.fillStyle = '#fff';
    for (let i = 0; i < 6; i++) {
      const a = i * 1.05 + (t || 0) * 1.7;
      const tw = 0.5 + 0.5 * Math.sin((t || 0) * 6 + i * 2);
      g.globalAlpha = 0.4 + 0.6 * tw;
      const px = x + Math.cos(a) * rx, py = y + Math.sin(a) * ry, r = ep * 0.28 * (0.6 + tw);
      g.beginPath(); g.moveTo(px, py - r * 2); g.lineTo(px + r * 0.5, py); g.lineTo(px, py + r * 2); g.lineTo(px - r * 0.5, py); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(px - r * 2, py); g.lineTo(px, py + r * 0.5); g.lineTo(px + r * 2, py); g.lineTo(px, py - r * 0.5); g.closePath(); g.fill();
    }
  }
  g.restore();
}

function dessinerAnneauMonde(r, alpha) {
  const p = proj(r.x, r.z, r.h), sol = proj(r.x, r.z, 0);
  const rx = R_VISU * L.demi * p.s;
  ctx.save();
  ctx.globalAlpha = 0.25 * (alpha == null ? 1 : alpha);
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(sol.x, sol.y, rx * 0.9, rx * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  const tilt = 0.32 + 0.12 * Math.sin(r.rot || 0);
  dessinerAnneau(ctx, p.x, p.y, rx, rx * tilt, r.skin || skinActuel(), temps);
  ctx.restore();
}

function dessinerPlot(p) {
  const b = proj(p.x, p.z, 0), s = b.s, lx = L.demi * s, u = L.hEch * s;
  const ecr = 1 - 0.25 * Math.sin(p.boing * Math.PI * 3) * p.boing;

  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(b.x, b.y, w * 1.2, w * 0.4, 0, 0, Math.PI * 2); ctx.fill();
  const g = ctx.createLinearGradient(b.x - w, 0, b.x + w, 0);
  g.addColorStop(0, '#b0125b'); g.addColorStop(0.4, '#ff6fb5'); g.addColorStop(1, '#c2185b');
  ctx.fillStyle = g;
  ctx.fillRect(b.x - w, b.y - h, w * 2, h);
  ctx.beginPath(); ctx.ellipse(b.x, b.y, w, w * 0.35, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#ff9fd0'; ctx.beginPath(); ctx.ellipse(b.x, b.y - h, w, w * 0.35, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff6e6'; ctx.fillRect(b.x - w, b.y - h * 0.6, w * 2, h * 0.14);
}

function dessinerManegeSol() {
  // Plateau rond vu en perspective : même ellipse que le chemin des chevaux
  const m = S.manege, c = proj(m.x, m.z, 0), R = m.r + 0.11;
  const pt = (a, h) => proj(m.x + Math.cos(a) * R, m.z + Math.sin(a) * R * 0.45, h || 0);
  const tour = (h) => { ctx.beginPath(); for (let i = 0; i <= 40; i++) { const p = pt(i / 40 * Math.PI * 2, h); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); } ctx.closePath(); };
  ctx.fillStyle = '#7a3e9d'; tour(-0.03); ctx.fill();
  ctx.fillStyle = '#c084fc'; tour(0); ctx.fill();
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) {
    const p = pt(m.a + i * Math.PI / 6);
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(p.x, p.y); ctx.stroke();
  }
  ctx.fillStyle = '#ffd166';
  for (let i = 0; i < 16; i++) { const p = pt(m.a + i * Math.PI / 8, -0.015); ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); ctx.fill(); }
}
function dessinerCheval(o) {
  const b = proj(o.x, o.z, 0), s = b.s, u = L.hEch * s, lx = L.demi * s;
  const saut = Math.sin(temps * 3 + o.i * 1.6) * 0.04;
  // mât doré
  ctx.fillStyle = '#ffd166'; ctx.fillRect(b.x - 2.5, b.y - CHEVAL_H * u * 1.1, 5, CHEVAL_H * u * 1.1);
  const y = b.y - (0.55 + saut) * u;
  const dir = Math.sin(o.a) > 0 ? -1 : 1; // sens du mouvement à l'écran
  // Cheval de bois vu de profil (e : unité de dessin)
  const e = lx * 0.15;
  const cols = ['#ffffff', '#ffd6e8', '#d6ecff', '#fff1c1', '#e2ffd6'];
  const robe = cols[o.i % cols.length];
  ctx.save(); ctx.translate(b.x, y); ctx.scale(dir, 1);
  ctx.strokeStyle = '#7a3e9d'; ctx.lineWidth = Math.max(1.2, e * 0.06); ctx.lineCap = 'round';
  // pattes : celles de devant repliées, celles de derrière tendues

  ctx.beginPath(); ctx.moveTo(-e * 0.55, e * 0.15); ctx.lineTo(-e * 0.8, e * 0.6); ctx.moveTo(-e * 0.35, e * 0.15); ctx.lineTo(-e * 0.45, e * 0.62);
  ctx.moveTo(e * 0.5, e * 0.12); ctx.lineTo(e * 0.75, e * 0.35); ctx.lineTo(e * 0.62, e * 0.55);
  ctx.moveTo(e * 0.3, e * 0.15); ctx.lineTo(e * 0.5, e * 0.42); ctx.lineTo(e * 0.38, e * 0.6); ctx.stroke();
  // queue
  ctx.strokeStyle = '#ff5a5f'; ctx.lineWidth = e * 0.14;
  ctx.beginPath(); ctx.moveTo(-e * 0.85, -e * 0.08); ctx.quadraticCurveTo(-e * 1.25, 0, -e * 1.15, e * 0.45); ctx.stroke();
  ctx.lineWidth = Math.max(1.2, e * 0.06); ctx.strokeStyle = '#7a3e9d';
  // corps
  ctx.fillStyle = robe;
  ctx.beginPath(); ctx.ellipse(0, 0, e * 0.9, e * 0.32, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // cou et tête
  ctx.beginPath(); ctx.moveTo(e * 0.45, -e * 0.15); ctx.lineTo(e * 0.75, -e * 0.85); ctx.lineTo(e * 1.05, -e * 0.85); ctx.lineTo(e * 0.95, -e * 0.1); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(e * 1.12, -e * 0.72, e * 0.38, e * 0.18, 0.55, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(e * 0.82, -e * 0.95); ctx.lineTo(e * 0.86, -e * 1.15); ctx.lineTo(e * 0.98, -e * 0.95); ctx.fill(); ctx.stroke();
  // crinière
  ctx.fillStyle = '#ff5a5f';
  ctx.beginPath(); ctx.moveTo(e * 0.75, -e * 0.95); ctx.quadraticCurveTo(e * 0.4, -e * 0.6, e * 0.42, -e * 0.15); ctx.lineTo(e * 0.6, -e * 0.25); ctx.quadraticCurveTo(e * 0.62, -e * 0.6, e * 0.85, -e * 0.85); ctx.closePath(); ctx.fill();
  // œil, selle
  ctx.fillStyle = '#2a1a3a'; ctx.beginPath(); ctx.arc(e * 1.08, -e * 0.8, Math.max(1.5, e * 0.06), 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.ellipse(-e * 0.1, -e * 0.28, e * 0.35, e * 0.12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd166'; ctx.fillRect(-e * 0.15, -e * 0.2, e * 0.1, e * 0.45);
  ctx.lineCap = 'butt';
  ctx.restore();
}
function dessinerMat() {
  const m = S.manege, b = proj(m.x, m.z, 0), s = b.s, u = L.hEch * s;
  ctx.fillStyle = '#ffd166'; ctx.fillRect(b.x - 5, b.y - 1.2 * u, 10, 1.2 * u);
  ctx.fillStyle = '#ff5a5f';
  ctx.beginPath(); ctx.moveTo(b.x - 26 * s, b.y - 1.2 * u); ctx.lineTo(b.x, b.y - 1.38 * u); ctx.lineTo(b.x + 26 * s, b.y - 1.2 * u); ctx.closePath(); ctx.fill();
}

function dessinerTapis(tp) {
  const a = proj(-1.25, tp.z + 0.06), b = proj(1.25, tp.z + 0.06), c = proj(1.25, tp.z - 0.06), d = proj(-1.25, tp.z - 0.06);
  ctx.fillStyle = '#3d3b4f';
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#26243a'; ctx.fillRect(d.x, d.y, c.x - d.x, 6);
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2;
  const pas = 0.18, dec = ((temps * tp.v) % pas + pas) % pas;
  for (let x = -1.25 + dec; x < 1.25; x += pas) {
    const p = proj(x, tp.z + 0.03), q = proj(x + 0.04 * Math.sign(tp.v), tp.z), r2 = proj(x, tp.z - 0.03);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.lineTo(r2.x, r2.y); ctx.stroke();
  }
}
function dessinerRiviere(rv) {
  const z1 = rv.z + 0.1, z2 = rv.z - 0.1;
  ctx.fillStyle = '#2f80c9';
  ctx.beginPath();
  for (let i = 0; i <= 30; i++) { const x = -1.25 + 2.5 * i / 30; const p = proj(x, z1 + 0.012 * Math.sin(temps * 2 + x * 6)); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
  for (let i = 30; i >= 0; i--) { const x = -1.25 + 2.5 * i / 30; const p = proj(x, z2 + 0.012 * Math.sin(temps * 2.2 + x * 5)); ctx.lineTo(p.x, p.y); }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(200,240,255,.7)'; ctx.lineWidth = 2;
  for (let k = 0; k < 3; k++) {
    const z = rv.z - 0.06 + k * 0.06;
    ctx.beginPath();
    for (let i = 0; i <= 24; i++) { const x = -1.2 + 2.4 * i / 24; const p = proj(x, z + 0.015 * Math.sin(temps * 1.6 + x * 8 + k)); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
    ctx.globalAlpha = 0.5; ctx.stroke(); ctx.globalAlpha = 1;
  }
}
function dessinerFanion() {
  if (!S.def.vent) return;
  const base = { x: L.ox + L.pw - 28, y: H * 0.36 }, haut = H * 0.12;
  ctx.fillStyle = '#6b4b2a'; ctx.fillRect(base.x - 2, base.y - haut, 4, haut);
  const w = S.vent, long = 18 + Math.abs(w) * 70, dir = Math.sign(w) || 1;
  const y0 = base.y - haut;
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.moveTo(base.x, y0);
  for (let i = 0; i <= 8; i++) { const u = i / 8; ctx.lineTo(base.x + dir * long * u, y0 + 10 * u * 0.5 + Math.sin(temps * 10 + u * 6) * 3 * u); }
  for (let i = 8; i >= 0; i--) { const u = i / 8; ctx.lineTo(base.x + dir * long * u, y0 + 20 - 10 * u * 0.5 + Math.sin(temps * 10 + u * 6) * 3 * u); }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#c97a00'; ctx.lineWidth = 1.5; ctx.stroke();
  // traînées de vent
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const ph = (temps * Math.abs(w) * 1.6 + i * 0.23) % 1;
    const x = L.ox + L.pw * (dir > 0 ? ph : 1 - ph), y = H * (0.28 + i * 0.06);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - dir * (20 + Math.abs(w) * 40), y); ctx.stroke();
  }
}

// Pointillés de visée
function dessinerVisee(v, frac) {
  const vol = preparerVol(v);
  const dt = 1 / 30;
  const fin = vol.T * frac;
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  let t = 0, x = vol.x, z = vol.z, h = vol.h, vh = vol.vh, i = 0;
  while (t < fin) {
    t += dt; x += vol.vx * dt; z += vol.vz * dt; h += vh * dt; vh -= vol.g * dt; i++;
    const p = proj(x, z, h);
    ctx.globalAlpha = 0.95 - 0.6 * (t / Math.max(fin, 0.01));
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(2.5, 5 * p.s), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (frac >= 1) {
    const p = proj(vol.xL, vol.zL, 0), rx = R_VISU * L.demi * p.s;
    ctx.setLineDash([5, 4]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, rx, rx * 0.35, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }
}

// Anneau au départ (sur le comptoir) et élastique
function dessinerDepart(v, decal) {
  const o = proj(X0, Z0, H0);
  let x = o.x, y = o.y;
  if (decal) { x += decal.x; y += decal.y; }
  const rx = R_VISU * L.demi * o.s;
  if (decal) {
    ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(o.x - rx * 1.8, o.y); ctx.lineTo(x, y); ctx.lineTo(o.x + rx * 1.8, o.y); ctx.stroke();
  }
  dessinerAnneau(ctx, x, y, rx, rx * 0.38, skinActuel(), temps);
  void v;
}

// Main animée du tutoriel
function dessinerMain(x, y, appuie) {
  ctx.save(); ctx.translate(x, y); ctx.scale(appuie ? 0.92 : 1, appuie ? 0.92 : 1);
  ctx.fillStyle = '#ffe0c2'; ctx.strokeStyle = '#7a4a26'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-4, 0); ctx.lineTo(-4, -34); ctx.quadraticCurveTo(0, -42, 4, -34); ctx.lineTo(4, -12);
  ctx.quadraticCurveTo(10, -18, 14, -10); ctx.quadraticCurveTo(20, -14, 22, -6); ctx.quadraticCurveTo(28, -8, 28, 2);
  ctx.lineTo(26, 22); ctx.quadraticCurveTo(14, 34, -2, 26); ctx.lineTo(-14, 6); ctx.quadraticCurveTo(-16, -2, -8, 0); ctx.closePath();
  ctx.fill(); ctx.stroke();
  if (appuie) { ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, -38, 12, 0, Math.PI * 2); ctx.stroke(); }
