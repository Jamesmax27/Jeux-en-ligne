  // ===== DESSIN =====
  const ZONES = [
    { fond: '#16324a', sol: '#28506d', sol2: '#2c5776', mur: '#7d94ad', murHaut: '#a9bdd2', murOmbre: '#4b6079', cadre: '#0d2033' },
    { fond: '#3a2617', sol: '#5b412b', sol2: '#634730', mur: '#a08268', murHaut: '#c9ad93', murOmbre: '#6a513d', cadre: '#24170d' },
    { fond: '#173628', sol: '#2f5a43', sol2: '#336249', mur: '#7fa48a', murHaut: '#a9cdb3', murOmbre: '#4b6f56', cadre: '#0c2117' },
    { fond: '#1e1640', sol: '#372b66', sol2: '#3d3070', mur: '#8c84c0', murHaut: '#b6afe2', murOmbre: '#57508a', cadre: '#120c2a' },
  ];
  const COULEURS = { bleu: '#4ea8ff', bleuF: '#1f5f9e', vert: '#46c96b', vertF: '#1d6b34', rouge: '#ff5a5f', rougeF: '#9e2328', jaune: '#ffcf3d', jauneF: '#8f6a00', violet: '#b07cff', orange: '#ff9a3d' };

  function rondRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function dessinerRouage(ctx, x, y, r, angle, couleur, bord) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.beginPath();
    const n = 8;
    for (let k = 0; k < n * 2; k++) {
      const a0 = (k / (n * 2)) * Math.PI * 2, a1 = ((k + 1) / (n * 2)) * Math.PI * 2;
      const rr = k % 2 === 0 ? r : r * 0.76;
      ctx.lineTo(Math.cos(a0) * rr, Math.sin(a0) * rr);
      ctx.lineTo(Math.cos(a1) * rr, Math.sin(a1) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = couleur || '#ffd34d';
    ctx.fill();
    ctx.lineWidth = Math.max(1, r * 0.12);
    ctx.strokeStyle = bord || '#a8740a';
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.32, 0, Math.PI * 2);
    ctx.fillStyle = bord || '#a8740a';
    ctx.fill();
    ctx.restore();
  }
  function dessinerEclair(ctx, x, y, s, couleur) {
    ctx.beginPath();
    ctx.moveTo(x + s * 0.12, y - s * 0.5);
    ctx.lineTo(x - s * 0.28, y + s * 0.08);
    ctx.lineTo(x - s * 0.02, y + s * 0.08);
    ctx.lineTo(x - s * 0.12, y + s * 0.5);
    ctx.lineTo(x + s * 0.28, y - s * 0.08);
    ctx.lineTo(x + s * 0.02, y - s * 0.08);
    ctx.closePath();
    ctx.fillStyle = couleur;
    ctx.fill();
  }
  function dessinerTriangle(ctx, x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.lineTo(x + r * 0.95, y + r * 0.7);
    ctx.lineTo(x - r * 0.95, y + r * 0.7);
    ctx.closePath();
  }
  function dessinerCle(ctx, x, y, s, forme) {
    const coul = forme === 'rond' ? COULEURS.bleu : COULEURS.vert, fonce = forme === 'rond' ? COULEURS.bleuF : COULEURS.vertF;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.6);
    ctx.lineWidth = s * 0.07;
    ctx.strokeStyle = fonce;
    ctx.fillStyle = coul;
    // tige et dents
    rondRect(ctx, -s * 0.02, -s * 0.06, s * 0.4, s * 0.12, s * 0.04); ctx.fill(); ctx.stroke();
    ctx.fillRect(s * 0.22, s * 0.04, s * 0.07, s * 0.1);
    ctx.fillRect(s * 0.31, s * 0.04, s * 0.07, s * 0.07);
    // tête : rond ou triangle
    if (forme === 'rond') { ctx.beginPath(); ctx.arc(-s * 0.12, 0, s * 0.16, 0, Math.PI * 2); }
    else dessinerTriangle(ctx, -s * 0.12, s * 0.02, s * 0.19);
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(-s * 0.12, 0.01 * s, s * 0.05, 0, Math.PI * 2); ctx.fillStyle = fonce; ctx.fill();
    ctx.restore();
  }

  // Max, le robot : x, y = centre ; s = taille d'une case.
  function dessinerMax(ctx, x, y, s, o) {
    o = o || {};
    const regard = DIRS[o.regard || 'bas'] || [1, 0];
    const temps = o.temps || 0;
    ctx.save();
    ctx.translate(x, y);
    if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
    const ech = o.echelle || 1;
    ctx.scale(ech * (o.etire || 1), ech / (o.etire || 1));
    // ombre
    ctx.beginPath();
    ctx.ellipse(0, s * 0.38, s * 0.3, s * 0.07, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.fill();
    const saut = o.saut || 0;
    ctx.translate(0, -saut);
    // roues
    ctx.fillStyle = '#2c3e50';
    rondRect(ctx, -s * 0.27, s * 0.2, s * 0.16, s * 0.16, s * 0.06); ctx.fill();
    rondRect(ctx, s * 0.11, s * 0.2, s * 0.16, s * 0.16, s * 0.06); ctx.fill();
    // corps
    const g = ctx.createLinearGradient(0, -s * 0.4, 0, s * 0.3);
    g.addColorStop(0, '#9be7f2'); g.addColorStop(1, '#3fb2c9');
    ctx.fillStyle = g;
    ctx.strokeStyle = '#17606f';
    ctx.lineWidth = Math.max(1.2, s * 0.045);
    rondRect(ctx, -s * 0.33, -s * 0.3, s * 0.66, s * 0.56, s * 0.16); ctx.fill(); ctx.stroke();
    // antenne
    ctx.beginPath(); ctx.moveTo(0, -s * 0.3); ctx.lineTo(0, -s * 0.43); ctx.stroke();
    const lueur = 0.6 + 0.4 * Math.sin(temps / 220);
    ctx.beginPath(); ctx.arc(0, -s * 0.46, s * 0.065, 0, Math.PI * 2);
    ctx.fillStyle = o.alarme ? '#ff5a5f' : `rgba(255, 211, 77, ${lueur})`; ctx.fill();
    // écran du visage
    ctx.fillStyle = '#0f2a3a';
    rondRect(ctx, -s * 0.24, -s * 0.21, s * 0.48, s * 0.3, s * 0.1); ctx.fill();
    // yeux qui regardent dans la direction du mouvement
    const ox = regard[1] * s * 0.04, oy = regard[0] * s * 0.03;
    const cligne = (Math.floor(temps / 2600) % 4 === 0 && (temps % 2600) < 140) ? 0.25 : 1;
    ctx.fillStyle = o.alarme ? '#ffb3b5' : '#6ff2ff';
    const ry = s * 0.06 * (o.alarme ? 1.25 : cligne);
    ctx.beginPath(); ctx.ellipse(-s * 0.1 + ox, -s * 0.08 + oy, s * 0.05, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s * 0.1 + ox, -s * 0.08 + oy, s * 0.05, ry, 0, 0, Math.PI * 2); ctx.fill();
    // bouche
    ctx.strokeStyle = o.alarme ? '#ffb3b5' : '#6ff2ff';
    ctx.lineWidth = Math.max(1, s * 0.03);
    ctx.beginPath();
    if (o.alarme) ctx.arc(ox, s * 0.04 + oy, s * 0.04, 0, Math.PI * 2);
    else ctx.arc(ox, s * 0.0 + oy, s * 0.07, 0.2 * Math.PI, 0.8 * Math.PI);
    ctx.stroke();
    // petit voyant sur le ventre
    ctx.fillStyle = '#ffd34d';
    ctx.beginPath(); ctx.arc(0, s * 0.17, s * 0.035, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Drone gardien (gentil) : x, y = centre.
  function dessinerDrone(ctx, x, y, s, temps, vers) {
    ctx.save();
    ctx.translate(x, y + Math.sin(temps / 180) * s * 0.03);
    ctx.beginPath(); ctx.ellipse(0, s * 0.36, s * 0.22, s * 0.05, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fill();
    // hélice
    const h = Math.abs(Math.cos(temps / 40));
    ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = Math.max(1, s * 0.04);
    ctx.beginPath(); ctx.moveTo(0, -s * 0.2); ctx.lineTo(0, -s * 0.3); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -s * 0.32, s * 0.3 * h + 2, s * 0.04, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(220,235,250,.85)'; ctx.fill();
    // corps
    ctx.beginPath(); ctx.arc(0, 0, s * 0.26, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(-s * 0.08, -s * 0.1, s * 0.03, 0, 0, s * 0.28);
    g.addColorStop(0, '#ffc2d6'); g.addColorStop(1, '#ff6f9c');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = '#a3285a'; ctx.lineWidth = Math.max(1, s * 0.04); ctx.stroke();
    // yeux qui regardent où il va
    const ox = (vers ? vers[1] : 0) * s * 0.05, oy = (vers ? vers[0] : 0) * s * 0.04;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-s * 0.09 + ox, -s * 0.02 + oy, s * 0.07, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.09 + ox, -s * 0.02 + oy, s * 0.07, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a0d22';
    ctx.beginPath(); ctx.arc(-s * 0.09 + ox * 1.6, -s * 0.02 + oy * 1.6, s * 0.035, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.09 + ox * 1.6, -s * 0.02 + oy * 1.6, s * 0.035, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // --- Scène : un plateau dessiné dans un canvas (jeu ou démonstration) ---
  function creerScene(canvas) {
    return { canvas, ctx: canvas.getContext('2d'), def: null, N: null, etat: null, avant: null, anim: null,
      s: 40, dpr: 1, l: 0, h: 0, particules: [], secousse: 0, regard: 'droite', zone: 0, orient: [], surMarque: null, finAnim: null };
  }
  function chargerScene(sc, def) {
    sc.def = def;
    sc.N = analyser(def);
    sc.etat = etatInitial(sc.N);
    sc.avant = sc.etat;
    sc.anim = null;
    sc.particules = [];
    sc.zone = def.zone || 0;
    sc.regard = 'droite';
    // orientation des lasers : le rayon va d'un mur à l'autre
    const N = sc.N;
    const bloque = (r, c) => r < 0 || c < 0 || r >= N.h || c >= N.w || N.sol[r * N.w + c] === '#';
    sc.orient = N.sol.map((ch, i) => {
      if (ch !== 'l' && ch !== 'L') return null;
      const r = Math.floor(i / N.w), c = i % N.w;
      if (bloque(r - 1, c) && bloque(r + 1, c)) return 'v';
      if (bloque(r, c - 1) && bloque(r, c + 1)) return 'h';
      return 'v';
    });
  }
  function dimensionnerScene(sc, largeur, hauteur, max) {
    const N = sc.N;
    const s = Math.max(12, Math.floor(Math.min(largeur / N.w, hauteur / N.h, max || 72)));
    sc.s = s;
    sc.dpr = Math.min(3, window.devicePixelRatio || 1);
    sc.l = s * N.w; sc.h = s * N.h;
    sc.canvas.style.width = sc.l + 'px';
    sc.canvas.style.height = sc.h + 'px';
    sc.canvas.width = Math.round(sc.l * sc.dpr);
    sc.canvas.height = Math.round(sc.h * sc.dpr);
  }

  // Lance l'animation d'une action (évènements du moteur → étapes dans le temps).
  function animer(sc, ev) {
    const segs = [], caisses = [], marques = [];
    let tc = 0;
    for (const e of ev) {
      if (e.type === 'pas' || e.type === 'tapis' || e.type === 'huile') {
        const d = e.type === 'pas' ? 130 : 95;
        segs.push({ de: e.de, a: e.a, t0: tc, d, type: e.type });
        marques.push({ temps: tc, ev: e });
        tc += d;
      } else if (e.type === 'tele') {
        segs.push({ de: e.de, a: e.a, t0: tc, d: 320, type: 'tele' });
        marques.push({ temps: tc, ev: e });
        tc += 320;
      } else if (e.type === 'caisse') {
        caisses.push({ de: e.de, a: e.a, t0: tc, d: 130 });
        marques.push({ temps: tc, ev: e });
      } else if (e.type === 'attente') {
        marques.push({ temps: 0, ev: e });
        tc += 140;
      } else if (e.type === 'retour') {
        tc += 420;
        marques.push({ temps: tc, ev: e });
        tc += 120;
      } else if (e.type === 'touche') {
        tc = Math.max(tc, 150);
        marques.push({ temps: tc, ev: e });
      } else {
        marques.push({ temps: tc, ev: e });
      }
    }
    sc.anim = { debut: horloge, duree: Math.max(tc, 150), segs, caisses, marques, faits: 0, retour: ev.find((e) => e.type === 'retour') };
  }

  // Avance l'animation et déclenche les évènements arrivés à leur heure.
  function majScene(sc) {
    const a = sc.anim;
    if (!a) return;
    const el = horloge - a.debut;
    while (a.faits < a.marques.length && a.marques[a.faits].temps <= el) {
      const m = a.marques[a.faits++];
      if (sc.surMarque) sc.surMarque(sc, m.ev);
    }
    if (el >= a.duree) {
      while (a.faits < a.marques.length) { const m = a.marques[a.faits++]; if (sc.surMarque) sc.surMarque(sc, m.ev); }
      sc.anim = null;
      if (sc.finAnim) sc.finAnim(sc);
    }
  }

  function caseXY(sc, i) { return [(i % sc.N.w + 0.5) * sc.s, (Math.floor(i / sc.N.w) + 0.5) * sc.s]; }

  // Position de Max (pixels) selon l'animation.
  function posMax(sc) {
    const a = sc.anim;
    if (!a) { const [x, y] = caseXY(sc, sc.etat.pos); return { x, y, alpha: 1, etire: 1, glisse: false }; }
    const el = horloge - a.debut;
    let dernier = a.segs.length ? a.segs[a.segs.length - 1].a : sc.avant.pos;
    if (a.retour) {
      const tr = a.marques.find((m) => m.ev === a.retour).temps;
      if (el >= tr) { const [x, y] = caseXY(sc, sc.etat.pos); return { x, y, alpha: Math.min(1, (el - tr) / 120), etire: 1 }; }
      const [x, y] = caseXY(sc, dernier);
      return { x, y, alpha: Math.floor(el / 70) % 2 ? 0.35 : 1, etire: 1, alarme: true };
    }
    for (const sg of a.segs) {
      if (el < sg.t0) { const [x, y] = caseXY(sc, sg.de); return { x, y, alpha: 1, etire: 1 }; }
      if (el < sg.t0 + sg.d) {
        const k = (el - sg.t0) / sg.d;
        if (sg.type === 'tele') {
          const [x0, y0] = caseXY(sc, sg.de), [x1, y1] = caseXY(sc, sg.a);
          if (k < 0.5) return { x: x0, y: y0, alpha: 1 - k * 2, etire: 1, echelle: 1 - k };
          return { x: x1, y: y1, alpha: (k - 0.5) * 2, etire: 1, echelle: k };
        }
        const [x0, y0] = caseXY(sc, sg.de), [x1, y1] = caseXY(sc, sg.a);
        const kk = sg.type === 'pas' ? k * k * (3 - 2 * k) : k;
        return { x: x0 + (x1 - x0) * kk, y: y0 + (y1 - y0) * kk, alpha: 1, etire: sg.type === 'pas' ? 1 + Math.sin(k * Math.PI) * 0.08 : 1, saut: sg.type === 'pas' ? Math.sin(k * Math.PI) * sc.s * 0.06 : 0, glisse: sg.type !== 'pas' };
      }
    }
    const [x, y] = caseXY(sc, dernier);
    return { x, y, alpha: 1, etire: 1 };
  }

  // État visible (objets, interrupteur) : ce qui a déjà eu lieu dans l'animation.
  function visible(sc) {
    const a = sc.anim;
    if (!a) return { pris: sc.etat.pris, inter: sc.etat.inter, t: sc.etat.t };
    let pris = sc.avant.pris, inter = sc.avant.inter;
    for (let k = 0; k < a.faits; k++) {
      const e = a.marques[k].ev;
      if (e.type === 'rouage' || e.type === 'pile' || e.type === 'cleB' || e.type === 'cleV') {
        const o = sc.N.objets.find((x) => x.i === e.i);
        if (o) pris |= (1 << o.bit);
      }
      if (e.type === 'inter') inter = e.etat;
    }
    return { pris, inter, t: sc.etat.t };
  }

  function dessinerScene(sc) {
    const { ctx, N, s } = sc;
    if (!N) return;
    const Z = ZONES[sc.zone] || ZONES[0];
    ctx.setTransform(sc.dpr, 0, 0, sc.dpr, 0, 0);
    ctx.clearRect(0, 0, sc.l, sc.h);
    ctx.save();
    if (sc.secousse > 0) ctx.translate((Math.random() - 0.5) * sc.secousse, (Math.random() - 0.5) * sc.secousse);
    const vis = visible(sc);
    const e = sc.etat;
    const aCle = (type) => N.objets.some((o) => o.type === type && (vis.pris & (1 << o.bit)));
    const tempsAnim = horloge;
    // fond du plateau
    ctx.fillStyle = Z.cadre;
    rondRect(ctx, 0, 0, sc.l, sc.h, Math.min(14, s * 0.3)); ctx.fill();
    for (let i = 0; i < N.sol.length; i++) {
      const ch = N.sol[i];
      const c = i % N.w, r = Math.floor(i / N.w);
      const x = c * s, y = r * s;
      if (ch === '#') continue;
      ctx.fillStyle = (r + c) % 2 ? Z.sol : Z.sol2;
      ctx.fillRect(x, y, s, s);
      // petits rivets du sol
      ctx.fillStyle = 'rgba(255,255,255,.06)';
      ctx.fillRect(x + s * 0.08, y + s * 0.08, s * 0.06, s * 0.06);
      ctx.fillRect(x + s * 0.86, y + s * 0.86, s * 0.06, s * 0.06);
    }
    // éléments du sol
    for (let i = 0; i < N.sol.length; i++) {
      const ch = N.sol[i];
      const c = i % N.w, r = Math.floor(i / N.w);
      const x = c * s, y = r * s, cx = x + s / 2, cy = y + s / 2;
      if (ch === 'E') {
        const tous = N.objets.filter((o) => o.type === 'rouage').every((o) => vis.pris & (1 << o.bit));
        const p = 0.5 + 0.5 * Math.sin(tempsAnim / (tous ? 160 : 400));
        ctx.beginPath(); ctx.arc(cx, cy, s * 0.42, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 211, 77, ${0.15 + 0.25 * p})`; ctx.fill();
        ctx.beginPath(); ctx.arc(cx, cy, s * 0.34, 0, Math.PI * 2);
        ctx.fillStyle = '#20384f'; ctx.fill();
        ctx.lineWidth = s * 0.06; ctx.strokeStyle = tous ? '#ffd34d' : '#9fb7cf'; ctx.stroke();
        dessinerEclair(ctx, cx, cy, s * 0.5, tous ? '#ffd34d' : '#cfe0f0');
      } else if (TAPIS[ch]) {
        ctx.fillStyle = '#2b3440';
        ctx.fillRect(x + 1, y + 1, s - 2, s - 2);
        ctx.save();
        ctx.beginPath(); ctx.rect(x + 1, y + 1, s - 2, s - 2); ctx.clip();
        ctx.translate(cx, cy);
        ctx.rotate({ droite: 0, bas: Math.PI / 2, gauche: Math.PI, haut: -Math.PI / 2 }[TAPIS[ch]]);
        const dec = ((tempsAnim / 600) % 1) * s * 0.5;
        ctx.strokeStyle = '#ffcf3d'; ctx.lineWidth = s * 0.09; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        for (let k = -2; k <= 1; k++) {
          const px = k * s * 0.5 + dec;
          ctx.beginPath(); ctx.moveTo(px - s * 0.12, -s * 0.2); ctx.lineTo(px + s * 0.08, 0); ctx.lineTo(px - s * 0.12, s * 0.2); ctx.stroke();
        }
        ctx.restore();
        ctx.strokeStyle = '#11161c'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, s - 2, s - 2);
      } else if (ch === '~') {
        ctx.fillStyle = '#1a1424';
        ctx.beginPath(); ctx.ellipse(cx, cy, s * 0.47, s * 0.42, 0.3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(176, 124, 255, .35)';
        ctx.beginPath(); ctx.ellipse(cx - s * 0.12, cy - s * 0.12, s * 0.16, s * 0.06, -0.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(120, 220, 255, .25)';
        ctx.beginPath(); ctx.ellipse(cx + s * 0.14, cy + s * 0.12, s * 0.1, s * 0.04, -0.5, 0, Math.PI * 2); ctx.fill();
      } else if (ch === 'T' || ch === 'U') {
        const coul = ch === 'T' ? COULEURS.violet : COULEURS.orange;
        ctx.save(); ctx.translate(cx, cy);
        for (let k = 0; k < 3; k++) {
          ctx.rotate(tempsAnim / (700 + k * 300) + k);
          ctx.beginPath(); ctx.arc(0, 0, s * (0.38 - k * 0.1), 0.2, Math.PI * 1.5);
          ctx.strokeStyle = coul; ctx.lineWidth = s * 0.06; ctx.globalAlpha = 1 - k * 0.25; ctx.stroke();
        }
        ctx.restore();
        ctx.beginPath(); ctx.arc(cx, cy, s * 0.08, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
      } else if (ch === 'o') {
        ctx.beginPath(); ctx.arc(cx, cy, s * 0.36, 0, Math.PI * 2); ctx.fillStyle = '#56606c'; ctx.fill();
        ctx.beginPath(); ctx.arc(cx, cy, s * 0.26, 0, Math.PI * 2);
        ctx.fillStyle = vis.inter ? COULEURS.rouge : COULEURS.jaune; ctx.fill();
        ctx.lineWidth = s * 0.05; ctx.strokeStyle = vis.inter ? COULEURS.rougeF : COULEURS.jauneF; ctx.stroke();
        ctx.beginPath(); ctx.arc(cx - s * 0.08, cy - s * 0.08, s * 0.07, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fill();
      } else if (ch === 'X' || ch === 'x') {
        const ferme = ch === 'X' ? !vis.inter : vis.inter;
        const coul = ch === 'X' ? COULEURS.rouge : COULEURS.jaune;
        if (ferme) {
          ctx.save();
          rondRect(ctx, x + s * 0.06, y + s * 0.06, s * 0.88, s * 0.88, s * 0.12); ctx.clip();
          ctx.fillStyle = coul; ctx.fillRect(x, y, s, s);
          ctx.strokeStyle = ch === 'X' ? '#fff' : '#3a2e00'; ctx.lineWidth = s * 0.12;
          for (let k = -1; k < 3; k++) { ctx.beginPath(); ctx.moveTo(x + k * s * 0.4, y + s); ctx.lineTo(x + k * s * 0.4 + s, y); ctx.stroke(); }
          ctx.restore();
          ctx.lineWidth = s * 0.05; ctx.strokeStyle = ch === 'X' ? COULEURS.rougeF : COULEURS.jauneF;
          rondRect(ctx, x + s * 0.06, y + s * 0.06, s * 0.88, s * 0.88, s * 0.12); ctx.stroke();
        } else {
          ctx.setLineDash([s * 0.1, s * 0.08]);
          ctx.lineWidth = s * 0.05; ctx.strokeStyle = coul;
          rondRect(ctx, x + s * 0.12, y + s * 0.12, s * 0.76, s * 0.76, s * 0.1); ctx.stroke();
          ctx.setLineDash([]);
        }
      } else if (ch === 'K' || ch === 'J') {
        const ouverte = aCle(ch === 'K' ? 'cleB' : 'cleV');
        const coul = ch === 'K' ? COULEURS.bleu : COULEURS.vert, fonce = ch === 'K' ? COULEURS.bleuF : COULEURS.vertF;
        if (!ouverte) {
          ctx.fillStyle = coul;
          rondRect(ctx, x + s * 0.05, y + s * 0.05, s * 0.9, s * 0.9, s * 0.1); ctx.fill();
          ctx.lineWidth = s * 0.05; ctx.strokeStyle = fonce; ctx.stroke();
          ctx.fillStyle = fonce;
          if (ch === 'K') { ctx.beginPath(); ctx.arc(cx, cy, s * 0.17, 0, Math.PI * 2); ctx.fill(); }
          else { dessinerTriangle(ctx, cx, cy, s * 0.2); ctx.fill(); }
        } else {
          ctx.lineWidth = s * 0.05; ctx.strokeStyle = coul; ctx.globalAlpha = 0.6;
          rondRect(ctx, x + s * 0.08, y + s * 0.08, s * 0.84, s * 0.84, s * 0.1); ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
    }
    // murs (en relief)
    for (let i = 0; i < N.sol.length; i++) {
      if (N.sol[i] !== '#') continue;
      const x = (i % N.w) * s, y = Math.floor(i / N.w) * s;
      ctx.fillStyle = Z.murOmbre;
      rondRect(ctx, x + 1, y + 1, s - 2, s - 2, s * 0.14); ctx.fill();
      ctx.fillStyle = Z.mur;
      rondRect(ctx, x + 1, y + 1, s - 2, s * 0.8, s * 0.14); ctx.fill();
      ctx.fillStyle = Z.murHaut;
      rondRect(ctx, x + s * 0.12, y + s * 0.1, s * 0.76, s * 0.14, s * 0.07); ctx.fill();
      ctx.fillStyle = Z.murOmbre;
      ctx.beginPath(); ctx.arc(x + s * 0.24, y + s * 0.56, s * 0.05, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + s * 0.76, y + s * 0.56, s * 0.05, 0, Math.PI * 2); ctx.fill();
    }
    // objets
    for (const o of N.objets) {
      if (vis.pris & (1 << o.bit)) continue;
      const [cx, cy] = caseXY(sc, o.i);
      const flotte = Math.sin(tempsAnim / 300 + o.i) * s * 0.04;
      if (o.type === 'rouage') {
        ctx.beginPath(); ctx.arc(cx, cy + flotte, s * 0.36, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255, 211, 77, .18)'; ctx.fill();
        dessinerRouage(ctx, cx, cy + flotte, s * 0.28, tempsAnim / 900);
      } else if (o.type === 'pile') {
        ctx.save(); ctx.translate(cx, cy + flotte);
        ctx.fillStyle = COULEURS.vert; ctx.strokeStyle = COULEURS.vertF; ctx.lineWidth = s * 0.05;
        rondRect(ctx, -s * 0.18, -s * 0.28, s * 0.36, s * 0.54, s * 0.07); ctx.fill(); ctx.stroke();
        ctx.fillStyle = COULEURS.vertF; ctx.fillRect(-s * 0.07, -s * 0.34, s * 0.14, s * 0.06);
        dessinerEclair(ctx, 0, 0, s * 0.34, '#fff');
        ctx.restore();
      } else if (o.type === 'cleB') dessinerCle(ctx, cx, cy + flotte, s, 'rond');
      else if (o.type === 'cleV') dessinerCle(ctx, cx, cy + flotte, s, 'triangle');
    }
    // caisses
    const a = sc.anim;
    const elA = a ? horloge - a.debut : 0;
    e.caisses.forEach((ci) => {
      let [x, y] = caseXY(sc, ci);
      if (a) {
        const m = a.caisses.find((k) => k.a === ci);
        if (m && elA < m.t0 + m.d) {
          const k = Math.max(0, (elA - m.t0) / m.d);
          const [x0, y0] = caseXY(sc, m.de);
          x = x0 + (x - x0) * k; y = y0 + (y - y0) * k;
        }
      }
      ctx.fillStyle = '#c98b4a'; ctx.strokeStyle = '#6e4319'; ctx.lineWidth = s * 0.05;
      rondRect(ctx, x - s * 0.42, y - s * 0.42, s * 0.84, s * 0.84, s * 0.08); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - s * 0.34, y - s * 0.34); ctx.lineTo(x + s * 0.34, y + s * 0.34);
      ctx.moveTo(x + s * 0.34, y - s * 0.34); ctx.lineTo(x - s * 0.34, y + s * 0.34); ctx.stroke();
      ctx.strokeRect(x - s * 0.3, y - s * 0.3, s * 0.6, s * 0.6);
    });
    // lasers : on montre leur état au prochain pas (celui qui compte pour Max)
    for (let i = 0; i < N.sol.length; i++) {
      const ch = N.sol[i];
      if (ch !== 'l' && ch !== 'L') continue;
      const [cx, cy] = caseXY(sc, i);
      const vert = sc.orient[i] === 'v';
      const allume = laserAllume(ch, vis.t + 1);
      ctx.fillStyle = '#5b1d22';
      if (vert) { ctx.fillRect(cx - s * 0.16, cy - s * 0.5, s * 0.32, s * 0.1); ctx.fillRect(cx - s * 0.16, cy + s * 0.4, s * 0.32, s * 0.1); }
      else { ctx.fillRect(cx - s * 0.5, cy - s * 0.16, s * 0.1, s * 0.32); ctx.fillRect(cx + s * 0.4, cy - s * 0.16, s * 0.1, s * 0.32); }
      if (allume) {
        const p = 0.8 + 0.2 * Math.sin(tempsAnim / 60);
        ctx.save();
        ctx.shadowColor = '#ff2d3d';
        ctx.shadowBlur = s * 0.35;
        ctx.fillStyle = `rgba(255, 45, 60, ${0.55 * p})`;
        if (vert) ctx.fillRect(cx - s * 0.17, cy - s * 0.42, s * 0.34, s * 0.84); else ctx.fillRect(cx - s * 0.42, cy - s * 0.17, s * 0.84, s * 0.34);
        ctx.fillStyle = '#ff3b4a';
        if (vert) ctx.fillRect(cx - s * 0.08, cy - s * 0.42, s * 0.16, s * 0.84); else ctx.fillRect(cx - s * 0.42, cy - s * 0.08, s * 0.84, s * 0.16);
        ctx.restore();
        ctx.fillStyle = `rgba(255, 235, 235, ${p})`;
        if (vert) ctx.fillRect(cx - s * 0.03, cy - s * 0.42, s * 0.06, s * 0.84); else ctx.fillRect(cx - s * 0.42, cy - s * 0.03, s * 0.84, s * 0.06);
      } else {
        ctx.setLineDash([s * 0.06, s * 0.08]);
        ctx.strokeStyle = 'rgba(255, 120, 120, .45)'; ctx.lineWidth = s * 0.03;
        ctx.beginPath();
        if (vert) { ctx.moveTo(cx, cy - s * 0.4); ctx.lineTo(cx, cy + s * 0.4); } else { ctx.moveTo(cx - s * 0.4, cy); ctx.lineTo(cx + s * 0.4, cy); }
        ctx.stroke(); ctx.setLineDash([]);
      }
    }
    // drones (et petit rond : leur prochaine case)
    N.drones.forEach((cases) => {
      const tNow = e.t;
      const p1 = posDrone(cases, tNow), p2 = posDrone(cases, tNow + 1);
      let [x, y] = caseXY(sc, p1);
      if (a && elA < 160) {
        const [x0, y0] = caseXY(sc, posDrone(cases, sc.avant.t));
        const k = elA / 160;
        x = x0 + (x - x0) * k; y = y0 + (y - y0) * k;
      }
      const [nx, ny] = caseXY(sc, p2);
      if (p2 !== p1) {
        ctx.beginPath(); ctx.arc(nx, ny, s * 0.12, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 143, 177, .8)'; ctx.lineWidth = s * 0.05; ctx.setLineDash([s * 0.05, s * 0.05]); ctx.stroke(); ctx.setLineDash([]);
      }
      const ver = [Math.sign(ny - y), Math.sign(nx - x)];
      dessinerDrone(ctx, x, y, s, tempsAnim, ver);
    });
    // Max
    const pm = posMax(sc);
    const surLaser = !a && (N.sol[e.pos] === 'l' || N.sol[e.pos] === 'L') && laserAllume(N.sol[e.pos], e.t + 1);
    if (surLaser) {
      // le laser va toucher Max s'il reste là : cercle d'alerte
      const k = (tempsAnim % 600) / 600;
      ctx.beginPath(); ctx.arc(pm.x, pm.y, s * (0.4 + 0.25 * k), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255, 90, 95, ${1 - k})`; ctx.lineWidth = s * 0.07; ctx.stroke();
    }
    dessinerMax(ctx, pm.x, pm.y, s, { regard: sc.regard, temps: tempsAnim, alpha: pm.alpha, etire: pm.etire, echelle: pm.echelle, saut: pm.saut || (sc.joie ? Math.abs(Math.sin(tempsAnim / 110)) * s * 0.18 : 0), alarme: pm.alarme || surLaser });
    if (pm.glisse) {
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.beginPath(); ctx.arc(pm.x - (DIRS[sc.regard][1] * s * 0.4), pm.y - (DIRS[sc.regard][0] * s * 0.4), s * 0.08, 0, Math.PI * 2); ctx.fill();
    }
    // particules
    dessinerParticules(ctx, sc.particules);
    ctx.restore();
    // démonstration de l'énergie : petite jauge en haut à droite
    if (sc.jaugeDemo && N.energie) {
      for (let k = 0; k < N.energie; k++) {
        ctx.fillStyle = k < e.energie ? COULEURS.vert : 'rgba(255,255,255,.2)';
        rondRect(ctx, sc.l - (N.energie - k) * s * 0.3 - 4, 4, s * 0.24, s * 0.16, 3); ctx.fill();
      }
    }
  }

  // --- Particules ---
  function ajouterParticules(liste, x, y, n, couleur, forme, force) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = (force || 1) * (0.06 + Math.random() * 0.18);
      liste.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.05, vie: 1, duree: 500 + Math.random() * 500, couleur, forme: forme || 'point', taille: 2 + Math.random() * 4, rot: Math.random() * 6 });
    }
  }
  function majParticules(liste, dt) {
    for (let k = liste.length - 1; k >= 0; k--) {
      const p = liste[k];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.0004 * dt; p.rot += dt * 0.01;
      p.vie -= dt / p.duree;
      if (p.vie <= 0) liste.splice(k, 1);
    }
  }
  function dessinerParticules(ctx, liste) {
    for (const p of liste) {
      ctx.globalAlpha = Math.max(0, p.vie);
      ctx.fillStyle = p.couleur;
      if (p.forme === 'etoile') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.beginPath();
        for (let k = 0; k < 10; k++) { const r = k % 2 ? p.taille * 0.45 : p.taille * 1.2; const an = k * Math.PI / 5; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); }
        ctx.closePath(); ctx.fill(); ctx.restore();
      } else if (p.forme === 'carre') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.taille / 2, -p.taille / 4, p.taille, p.taille / 2); ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.taille / 2, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ===== ÉCRANS =====
  let ecran = 'titre';
  let horloge = 0;
  let enPause = false;
  let fenetre = null; // 'tuto', 'pause', 'victoire', 'defaite', 'bilan'
  const sc = creerScene($('plateau'));
  const scDemo = creerScene($('demo'));
  scDemo.jaugeDemo = true;
  let niveauCourant = 0;
  let tampon = undefined;
  let enPartie = false;

  function montrerEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    if (nom === 'titre') majTitre();
    if (nom !== 'jeu') enPartie = false;
  }
  function ouvrir(nom) {
    fermerFenetres();
    fenetre = nom;
    $('v-' + nom).classList.add('actif');
    const b = $('v-' + nom).querySelector('.btn.principal');
    if (b) setTimeout(() => { try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30);
  }
  function fermerFenetres() {
    ['tuto', 'pause', 'victoire', 'defaite', 'bilan'].forEach((n) => $('v-' + n).classList.remove('actif'));
    fenetre = null;
  }

  // --- Boutons son ---
  function majBoutonsSon() {
    ['b-son-titre', 'b-son-jeu'].forEach((id) => { $(id).innerHTML = sonActif ? ICONES.sonOui() : ICONES.sonNon(); $(id).setAttribute('aria-pressed', sonActif ? 'false' : 'true'); });
  }
  function basculerSon() {
    sonActif = !sonActif;
    sonTouche = true;
    try { localStorage.setItem('robot-max-son', sonActif ? 'oui' : 'non'); } catch (e) { /* pas de stockage */ }
    // dans le site, le choix passe par la sauvegarde commune (seulement pendant une partie)
    if (ecran === 'jeu' && enPartie) sauverProgres(niveauCourant + 1);
    majBoutonsSon();
    preparerAudio();
    son('clic');
  }

  // --- Écran titre : grand dessin animé (sert aussi de jaquette) ---
  const cTitre = $('dessin-titre');
  const ctxTitre = cTitre.getContext('2d');
  function majTitre() { dimensionnerTitre(); }
  function dimensionnerTitre() {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cTitre.width = Math.round(innerWidth * dpr);
    cTitre.height = Math.round(innerHeight * dpr);
  }
  function dessinerTitre() {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const W = innerWidth, H = innerHeight;
    const ctx = ctxTitre;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1b3f5e'); g.addColorStop(1, '#0d1f30');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // labyrinthe en fond
    const s = Math.max(40, Math.min(W, H) / 8);
    const motif = ['#.#..#.#.#', '...#....#.', '#.#.##.#..', '..#....#.#', '.##.#.##..', '....#....#', '#.##..#.#.', '...#.#....', '.#....##.#', '##.#.#....', '...#...#.#', '#.#..#....'];
    for (let r = 0; r * s < H + s; r++) {
      for (let c = 0; c * s < W + s; c++) {
        const ch = motif[r % motif.length][c % 10];
        if (ch === '#') {
          ctx.fillStyle = 'rgba(125, 148, 173, .22)';
          rondRect(ctx, c * s + 3, r * s + 3, s - 6, s - 6, s * 0.15); ctx.fill();
        } else {
          ctx.fillStyle = 'rgba(40, 80, 109, .25)';
          ctx.fillRect(c * s + 1, r * s + 1, s - 2, s - 2);
        }
      }
    }
    // borne de recharge, rouages et Max
    const cx = W / 2, cy = H * 0.47;
    const taille = Math.min(W * 0.5, H * 0.3, 260);
    const p = 0.5 + 0.5 * Math.sin(horloge / 300);
    ctx.beginPath(); ctx.arc(cx, cy + taille * 0.05, taille * (0.75 + 0.05 * p), 0, Math.PI * 2);
    const halo = ctx.createRadialGradient(cx, cy, taille * 0.1, cx, cy, taille * 0.8);
    halo.addColorStop(0, 'rgba(255, 211, 77, .35)'); halo.addColorStop(1, 'rgba(255, 211, 77, 0)');
    ctx.fillStyle = halo; ctx.fill();
    // socle (borne)
    ctx.beginPath(); ctx.ellipse(cx, cy + taille * 0.42, taille * 0.5, taille * 0.13, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#20384f'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = '#ffd34d'; ctx.stroke();
    // rouages qui tournent autour
    for (let k = 0; k < 3; k++) {
      const an = horloge / 1500 + k * (Math.PI * 2 / 3);
      const rx = cx + Math.cos(an) * taille * 0.85, ry = cy + Math.sin(an) * taille * 0.45 - taille * 0.05;
      dessinerRouage(ctx, rx, ry, taille * 0.14, horloge / 600 * (k % 2 ? -1 : 1));
    }
    // drone qui passe
    const dx = cx + Math.sin(horloge / 1300) * W * 0.32;
    dessinerDrone(ctx, dx, cy - taille * 0.85, taille * 0.45, horloge, [0, Math.sign(Math.cos(horloge / 1300))]);
    // clé et pile (sans sortir de l'écran)
    const ecart = Math.min(taille * 0.95, W / 2 - taille * 0.22);
    dessinerCle(ctx, cx - ecart, cy + taille * 0.55, taille * 0.5, 'rond');
    ctx.save(); ctx.translate(cx + ecart, cy + taille * 0.55);
    ctx.fillStyle = COULEURS.vert; ctx.strokeStyle = COULEURS.vertF; ctx.lineWidth = 4;
    rondRect(ctx, -taille * 0.09, -taille * 0.14, taille * 0.18, taille * 0.27, taille * 0.04); ctx.fill(); ctx.stroke();
    dessinerEclair(ctx, 0, 0, taille * 0.17, '#fff');
    ctx.restore();
    dessinerMax(ctx, cx, cy, taille, { regard: 'bas', temps: horloge, saut: Math.abs(Math.sin(horloge / 400)) * taille * 0.05 });
  }

  // --- Écran des niveaux ---
  function ouvrirNiveaux() {
    fermerFenetres();
    enPause = false;
    montrerEcran('niveaux');
    $('stats-niveaux').textContent = t('niveaux.stats', { etoiles: I.nombre(etoilesTotal()), max: I.nombre(NIVEAUX.length * 3), score: I.nombre(scoreTotal()) });
    const liste = $('liste-niveaux');
    liste.innerHTML = '';
    for (let z = 0; z < 4; z++) {
      const bloc = document.createElement('div');
      bloc.className = 'zone-niveaux';
      bloc.style.background = ZONES[z].fond;
      const h = document.createElement('h3');
      h.textContent = t('zone.' + z);
      bloc.appendChild(h);
      const grille = document.createElement('div');
      grille.className = 'grille-niveaux';
      NIVEAUX.forEach((def, i) => {
        if (def.zone !== z) return;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'case-niveau';
        if (i + 1 > progres.debloque) {
          b.classList.add('ferme');
          b.innerHTML = ICONES.cadenas();
          b.setAttribute('aria-label', t('niveaux.ferme', { n: I.nombre(i + 1) }));
          b.addEventListener('click', () => { son('choc'); });
        } else {
          const et = progres.etoiles[i] || 0;
          const num = document.createElement('span');
          num.textContent = I.nombre(i + 1);
          b.appendChild(num);
          const ets = document.createElement('span');
          ets.className = 'mini-etoiles';
          ets.innerHTML = [0, 1, 2].map((k) => ICONES.etoile(k < et)).join('');
          b.appendChild(ets);
          b.setAttribute('aria-label', t('niveaux.niveau', { n: I.nombre(i + 1) }) + ', ' + t('niveaux.etoiles', { n: et }));
          b.addEventListener('click', () => { son('clic'); lancerNiveau(i); });
        }
        grille.appendChild(b);
      });
      bloc.appendChild(grille);
      liste.appendChild(bloc);
    }
    const prochain = liste.querySelectorAll('.case-niveau:not(.ferme)');
    const cible = prochain[Math.min(prochain.length - 1, progres.debloque - 1)];
    if (cible) setTimeout(() => { try { cible.scrollIntoView({ block: 'center' }); cible.focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30);
  }

  // --- Partie ---
  function lancerNiveau(i) {
    fermerFenetres();
    enPause = false;
    niveauCourant = Math.max(0, Math.min(NIVEAUX.length - 1, i));
    const def = NIVEAUX[niveauCourant];
    chargerScene(sc, def);
    sc.joie = false;
    sc.dejaTapis = false;
    tampon = undefined;
    montrerEcran('jeu');
    enPartie = true;
    document.body.style.background = ZONES[def.zone].fond;
    $('barre-energie').classList.toggle('cache', !def.energie);
    redimensionner();
    majHud();
    message(t('msg.depart'));
    // tutoriel : à la première rencontre d'une mécanique
    if (def.tuto && !progres.tutos.includes(def.tuto)) {
      progres.tutos.push(def.tuto);
      ouvrirTuto([def.tuto]);
    }
  }
  function redimensionner() {
    if (ecran === 'titre') dimensionnerTitre();
    if (ecran !== 'jeu' || !sc.N) return;
    const z = $('zone-plateau').getBoundingClientRect();
    dimensionnerScene(sc, z.width - 12, z.height - 8, 76);
  }

  let minuterieMessage = null;
  function message(texte) {
    const m = $('message');
    m.textContent = texte;
    m.style.opacity = '1';
    clearTimeout(minuterieMessage);
  }

  function majHud() {
    const e = sc.etat, N = sc.N;
    $('hud-niveau').textContent = t('hud.niveau', { n: I.nombre(niveauCourant + 1) });
    const vis = visible(sc);
    const r = N.objets.filter((o) => o.type === 'rouage' && (vis.pris & (1 << o.bit))).length;
    $('hud-rouages').innerHTML = [0, 1, 2].map((k) => ICONES.rouage(k < r)).join('');
    $('hud-rouages').setAttribute('aria-label', t('hud.rouages', { n: I.nombre(r) }));
    // un cœur perdu ne disparaît qu'au moment du choc dans l'animation
    const attendu = sc.anim && sc.anim.marques.slice(sc.anim.faits).some((m) => m.ev.type === 'touche');
    const coeurs = attendu ? sc.avant.coeurs : e.coeurs;
    $('hud-coeurs').innerHTML = [0, 1, 2].map((k) => ICONES.coeur(k < coeurs)).join('');
    $('hud-coeurs').setAttribute('aria-label', t('hud.coeurs', { n: coeurs }));
    if (N.energie) {
      const k = e.energie / N.energie;
      $('jauge-remplie').style.width = (k * 100) + '%';
      $('jauge-remplie').classList.toggle('basse', e.energie <= 4);
      $('barre-energie').setAttribute('aria-label', t('hud.energie', { n: I.nombre(e.energie), max: I.nombre(N.energie) }));
    }
  }

  // Une action du joueur (direction ou null = attendre).
  function action(dir) {
    if (ecran !== 'jeu' || enPause || fenetre || !sc.etat || sc.etat.fini) return;
    preparerAudio();
    if (sc.anim) { tampon = dir; return; }
    jouerAction(dir);
  }
  function jouerAction(dir) {
    const res = jouer(sc.N, sc.etat, dir);
    if (!res.etat) {
      const c = res.ev[0];
      if (c && c.type === 'choc') {
        son('choc');
        sc.regard = c.dir;
        sc.secousse = 3;
        if (c.sur === 'K') message(t('msg.porteB'));
        else if (c.sur === 'J') message(t('msg.porteV'));
        else if (c.sur === 'X' || c.sur === 'x') message(t('msg.barriere'));
        else if (c.sur === 'C') message(t('msg.caisse'));
      }
      return;
    }
    sc.avant = sc.etat;
    sc.etat = res.etat;
    if (dir) sc.regard = dir;
    animer(sc, res.ev);
    majHud();
  }

  // Évènements de l'animation du jeu : sons, messages, effets.
  sc.surMarque = (s, e) => {
    const [x, y] = e.i !== undefined ? caseXY(s, e.i) : caseXY(s, s.etat.pos);
    switch (e.type) {
      case 'pas': son('pas'); break;
      case 'attente': son('attente'); break;
      case 'tapis': son('tapis'); if (!s.dejaTapis) { message(t('msg.tapis')); } s.dejaTapis = true; break;
      case 'huile': son('huile'); message(t('msg.huile')); break;
      case 'tele': son('tele'); message(t('msg.tele')); { const [tx, ty] = caseXY(s, e.a); ajouterParticules(s.particules, tx, ty, 16, COULEURS.violet, 'point', 0.8); } break;
      case 'caisse': son('caisse'); break;
      case 'porte': son('porte'); message(t('msg.porte')); { const [px, py] = caseXY(s, e.i); ajouterParticules(s.particules, px, py, 12, '#cfe8ff', 'carre', 0.8); } break;
      case 'inter': son('inter'); message(t('msg.inter')); s.secousse = 2; break;
      case 'rouage': {
        son('rouage');
        ajouterParticules(s.particules, x, y, 18, '#ffd34d', 'etoile', 1);
        const vus = s.N.objets.filter((o) => o.type === 'rouage' && (visible(s).pris & (1 << o.bit))).length;
        const encore = s.N.nbRouages - vus;
        message(encore > 0 ? t('msg.rouage', { n: encore }) : t('msg.tousRouages'));
        if (encore === 0) son('etoile');
        majHud();
        break;
      }
      case 'pile': son('pile'); message(t('msg.pile')); ajouterParticules(s.particules, x, y, 14, COULEURS.vert, 'point', 0.9); break;
      case 'cleB': son('cle'); message(t('msg.cleB')); ajouterParticules(s.particules, x, y, 14, COULEURS.bleu, 'etoile', 0.9); break;
      case 'cleV': son('cle'); message(t('msg.cleV')); ajouterParticules(s.particules, x, y, 14, COULEURS.vert, 'etoile', 0.9); break;
      case 'touche': {
        son('touche');
        s.secousse = 9;
        const [hx, hy] = caseXY(s, e.i);
        ajouterParticules(s.particules, hx, hy, 20, COULEURS.rouge, 'etoile', 1.2);
        message(t(e.cause === 'drone' ? 'msg.drone' : 'msg.laser'));
        majHud();
        break;
      }
      case 'retour': { const [rx, ry] = caseXY(s, s.etat.pos); ajouterParticules(s.particules, rx, ry, 12, '#9be7f2', 'point', 0.7); majHud(); break; }
      case 'defaite': causeDefaite = e.cause; break;
      default: break;
    }
  };
  let causeDefaite = 'panne';
  sc.finAnim = (s) => {
    majHud();
    const e = s.etat;
    if (e.fini === 'victoire') { s.joie = true; enPartie = false; setTimeout(victoire, 450); return; }
    if (e.fini === 'defaite') { enPartie = false; setTimeout(() => defaite(causeDefaite), 600); return; }
    if (s.N.energie && e.energie > 0 && e.energie <= 4 && s.avant.energie > 4) { son('alerte'); message(t('msg.energieBasse')); }
    // danger au prochain pas : laser qui s'allume sous Max, drone qui arrive sur lui
    const ch = s.N.sol[e.pos];
    if ((ch === 'l' || ch === 'L') && laserAllume(ch, e.t + 1)) { son('alerte'); message(t('msg.laserDanger')); }
    else if (s.N.drones.some((cases) => posDrone(cases, e.t + 1) === e.pos)) { son('alerte'); message(t('msg.droneDanger')); }
    if (tampon !== undefined) { const d = tampon; tampon = undefined; jouerAction(d); }
  };

  function scoreNiveau() {
    const e = sc.etat, N = sc.N;
    return rouagesPris(N, e) * 100 + e.coeurs * 50 + (N.energie ? e.energie * 10 : 0);
  }

  function victoire() {
    enPause = false;
    const i = niveauCourant;
    const r = rouagesPris(sc.N, sc.etat);
    const score = scoreNiveau();
    const ancien = progres.records[i] || 0;
    const record = score > ancien;
    progres.etoiles[i] = Math.max(progres.etoiles[i] || 0, r);
    if (record) progres.records[i] = score;
    progres.debloque = Math.max(progres.debloque, Math.min(NIVEAUX.length, i + 2));
    sauverProgres(Math.min(NIVEAUX.length, i + 2));
    son('victoire');
    confettis(r === 3 ? 140 : 70);
    $('fin-titre').textContent = r === 3 ? t('fin.parfait') : t('fin.victoire');
    const zoneEt = $('fin-etoiles');
    zoneEt.innerHTML = [0, 1, 2].map((k) => ICONES.etoile(k < r)).join('');
    zoneEt.setAttribute('role', 'img');
    zoneEt.setAttribute('aria-label', t('fin.etoiles', { n: r }));
    const svgs = zoneEt.querySelectorAll('svg');
    svgs.forEach((el, k) => setTimeout(() => { el.classList.add(k < r ? 'allumee' : 'eteinte'); if (k < r) son('etoile'); }, 350 + k * 330));
    // le score défile
    const sp = $('fin-score');
    const debut = performance.now();
    const tour = () => {
      const k = Math.min(1, (performance.now() - debut) / 900);
      sp.textContent = t('fin.score', { score: I.nombre(Math.round(score * k)) });
      if (k < 1 && fenetre === 'victoire') requestAnimationFrame(tour);
    };
    const rec = $('fin-record');
    rec.textContent = record ? t('fin.record') : t('fin.recordAncien', { score: I.nombre(ancien) });
    rec.classList.toggle('battu', record);
    $('fin-detail').textContent = t('fin.detail', { r: I.nombre(r), c: I.nombre(sc.etat.coeurs), p: I.nombre(sc.etat.pas) });
    const dernier = i === NIVEAUX.length - 1;
    $('b-suivant').textContent = dernier ? t('bouton.bilan') : t('bouton.suivant');
    ouvrir('victoire');
    requestAnimationFrame(tour);
  }

  function defaite(cause) {
    enPause = false;
    son('defaite');
    $('def-raison').textContent = t(cause === 'panne' ? 'defaite.panne' : cause === 'drone' ? 'defaite.drone' : 'defaite.laser');
    $('def-detail').textContent = t('defaite.detail', { r: I.nombre(rouagesPris(sc.N, sc.etat)) });
    const rec = progres.records[niveauCourant] || 0;
    $('def-record').textContent = rec ? t('fin.recordAncien', { score: I.nombre(rec) }) : '';
    ouvrir('defaite');
  }

  function bilan() {
    const et = etoilesTotal(), max = NIVEAUX.length * 3;
    $('bilan-etoiles').innerHTML = [0, 1, 2].map(() => ICONES.etoile(true)).join('');
    $('bilan-etoiles').querySelectorAll('svg').forEach((el, k) => setTimeout(() => el.classList.add('allumee'), 200 + k * 250));
    $('bilan-texte').textContent = t('bilan.texte', { etoiles: I.nombre(et), max: I.nombre(max), score: I.nombre(scoreTotal()) });
    $('bilan-conseil').textContent = et >= max ? t('bilan.tout') : t('bilan.encore');
    confettis(200);
    son('victoire');
    ouvrir('bilan');
  }

  // --- Pause ---
  function pause() {
    if (ecran !== 'jeu' || fenetre || (sc.etat && sc.etat.fini)) return;
    enPause = true;
    ouvrir('pause');
    if (audio && audio.state === 'running') audio.suspend().catch(() => {});
  }
  function reprendre() {
    enPause = false;
    fermerFenetres();
    if (audio) audio.resume().catch(() => {});
  }

  // --- Tutoriel animé ---
  let tutoListe = [], tutoIndex = 0, demoAttente = 0, demoPas = 0, tutoOuvertA = 0;
  function ouvrirTuto(liste) {
    tutoListe = liste.slice();
    tutoIndex = 0;
    ouvrir('tuto');
    montrerTuto();
  }
  function montrerTuto() {
    const nom = tutoListe[tutoIndex];
    $('tuto-titre').textContent = t('tuto.titre.' + nom);
    $('tuto-texte').textContent = t('tuto.' + nom);
    $('b-compris').textContent = tutoIndex < tutoListe.length - 1 ? t('bouton.suite') : t('bouton.compris');
    const d = DEMOS[nom];
    chargerScene(scDemo, Object.assign({ zone: NIVEAUX[niveauCourant] ? NIVEAUX[niveauCourant].zone : 0 }, d));
    const largeur = Math.min(320, innerWidth - 70);
    dimensionnerScene(scDemo, largeur, 150, 64);
    demoPas = 0;
    demoAttente = horloge + 900;
    tutoOuvertA = horloge;
  }
  function suiteTuto() {
    if (horloge - tutoOuvertA < 250) return;
    son('clic');
    if (tutoIndex < tutoListe.length - 1) { tutoIndex++; montrerTuto(); return; }
    fermerFenetres();
  }
  scDemo.surMarque = (s, e) => {
    const [x, y] = e.i !== undefined ? caseXY(s, e.i) : caseXY(s, s.etat.pos);
    if (e.type === 'rouage') ajouterParticules(s.particules, x, y, 10, '#ffd34d', 'etoile', 0.6);
    if (e.type === 'cleB' || e.type === 'cleV' || e.type === 'pile') ajouterParticules(s.particules, x, y, 10, '#cfe8ff', 'etoile', 0.6);
    if (e.type === 'victoire') s.joie = true;
  };
  scDemo.finAnim = () => {};
  function majDemo() {
    const s = scDemo;
    const d = DEMOS[tutoListe[tutoIndex]];
    if (!d || !s.N) return;
    majScene(s);
    if (s.anim || horloge < demoAttente) return;
    if (s.etat.fini || demoPas >= d.actions.length) {
      chargerScene(s, Object.assign({ zone: s.zone }, d));
      s.joie = false;
      demoPas = 0;
      demoAttente = horloge + 900;
      return;
    }
    const act = d.actions[demoPas++];
    const res = jouer(s.N, s.etat, act);
    if (res.etat) { s.avant = s.etat; s.etat = res.etat; if (act) s.regard = act; animer(s, res.ev); }
    demoAttente = horloge + (s.etat.fini ? 1300 : 650);
  }
  // Main qui montre le geste de la prochaine action.
  function dessinerMain() {
    const s = scDemo;
    const d = DEMOS[tutoListe[tutoIndex]];
    if (!d || !s.N || s.etat.fini || demoPas >= d.actions.length) return;
    const act = d.actions[demoPas];
    const ctx = s.ctx;
    const [x, y] = caseXY(s, s.etat.pos);
    const reste = Math.max(0, demoAttente - horloge);
    const k = 1 - Math.min(1, reste / 650);
    ctx.save();
    ctx.setTransform(s.dpr, 0, 0, s.dpr, 0, 0);
    if (act === null) {
      ctx.beginPath(); ctx.arc(x, y, s.s * (0.45 + 0.2 * k), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255, 211, 77, ${1 - k})`; ctx.lineWidth = 3; ctx.stroke();
    } else {
      const [dr, dc] = DIRS[act];
      const hx = x + dc * s.s * (0.2 + 0.5 * k), hy = y + dr * s.s * (0.2 + 0.5 * k) + s.s * 0.3;
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#13283d'; ctx.lineWidth = 2;
      rondRect(ctx, hx - s.s * 0.08, hy - s.s * 0.3, s.s * 0.16, s.s * 0.34, s.s * 0.08); ctx.fill(); ctx.stroke();
      rondRect(ctx, hx - s.s * 0.17, hy - s.s * 0.04, s.s * 0.34, s.s * 0.3, s.s * 0.1); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(255, 211, 77, .9)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x + dc * s.s * 0.15, y + dr * s.s * 0.15); ctx.lineTo(x + dc * s.s * 0.62, y + dr * s.s * 0.62); ctx.stroke();
    }
    ctx.restore();
  }

  // --- Confettis (victoire) ---
  const cConf = $('confettis');
  const ctxConf = cConf.getContext('2d');
  const confs = [];
  function confettis(n) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cConf.width = innerWidth * dpr; cConf.height = innerHeight * dpr;
    const couleurs = ['#ffd34d', '#4ea8ff', '#46c96b', '#ff6f9c', '#b07cff', '#ff9a3d'];
    for (let k = 0; k < n; k++) {
      confs.push({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.4, vx: (Math.random() - 0.5) * 0.12, vy: 0.12 + Math.random() * 0.2,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.02, coul: couleurs[k % couleurs.length], t: 5 + Math.random() * 6 });
    }
  }
  function majConfettis(dt) {
    if (!confs.length) return;
    const dpr = cConf.width / innerWidth || 1;
    ctxConf.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctxConf.clearRect(0, 0, innerWidth, innerHeight);
    for (let k = confs.length - 1; k >= 0; k--) {
      const c = confs[k];
      c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
      if (c.y > innerHeight + 30) { confs.splice(k, 1); continue; }
      ctxConf.save(); ctxConf.translate(c.x, c.y); ctxConf.rotate(c.rot);
      ctxConf.fillStyle = c.coul; ctxConf.fillRect(-c.t / 2, -c.t / 4, c.t, c.t / 2);
      ctxConf.restore();
    }
    if (!confs.length) ctxConf.clearRect(0, 0, innerWidth, innerHeight);
  }

  // ===== BOUCLE PRINCIPALE =====
  let avantT = performance.now();
  function boucle(maintenant) {
    const dt = Math.min(50, maintenant - avantT);
    avantT = maintenant;
    if (!enPause) horloge += dt;
    if (ecran === 'titre') dessinerTitre();
    if (ecran === 'jeu' && sc.N) {
      if (!enPause) {
        majScene(sc);
        majParticules(sc.particules, dt);
        sc.secousse = Math.max(0, sc.secousse - dt * 0.03);
      }
      dessinerScene(sc);
    }
    if (fenetre === 'tuto') {
      majDemo();
      majParticules(scDemo.particules, dt);
      dessinerScene(scDemo);
      dessinerMain();
    }
    majConfettis(dt);
    requestAnimationFrame(boucle);
  }

  // ===== COMMANDES =====
  // Glisser le doigt (ou la souris) sur le plateau : une case par geste ;
  // toucher une case : Max va dans sa direction.
  (function gestes() {
    const zone = $('zone-plateau');
    let depart = null, bouge = false;
    zone.addEventListener('pointerdown', (e) => {
      preparerAudio();
      depart = { x: e.clientX, y: e.clientY };
      bouge = false;
      try { zone.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
    });
    zone.addEventListener('pointermove', (e) => {
      if (!depart) return;
      const dx = e.clientX - depart.x, dy = e.clientY - depart.y;
      const seuil = Math.max(22, sc.s * 0.55);
      if (Math.abs(dx) < seuil && Math.abs(dy) < seuil) return;
      bouge = true;
      action(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'droite' : 'gauche') : (dy > 0 ? 'bas' : 'haut'));
      depart = { x: e.clientX, y: e.clientY };
    });
    const fin = (e) => {
      if (depart && !bouge && sc.N) {
        // toucher : direction depuis Max vers le point touché
        const r = sc.canvas.getBoundingClientRect();
        const [mx, my] = caseXY(sc, sc.etat.pos);
        const dx = e.clientX - r.left - mx, dy = e.clientY - r.top - my;
        if (Math.max(Math.abs(dx), Math.abs(dy)) > sc.s * 0.45) {
          action(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'droite' : 'gauche') : (dy > 0 ? 'bas' : 'haut'));
        }
      }
      depart = null;
    };
    zone.addEventListener('pointerup', fin);
    zone.addEventListener('pointercancel', () => { depart = null; });
  })();

  // Croix de boutons : appui maintenu = Max continue d'avancer.
  document.querySelectorAll('.croix button').forEach((b) => {
    const dir = b.dataset.dir === 'attendre' ? null : b.dataset.dir;
    let rep = null;
    const stop = () => { clearTimeout(rep); rep = null; b.classList.remove('appui'); };
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      preparerAudio();
      b.classList.add('appui');
      action(dir);
      const repeter = (delai) => { rep = setTimeout(() => { action(dir); repeter(170); }, delai); };
      if (dir) repeter(320);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((n) => b.addEventListener(n, stop));
    b.addEventListener('click', (e) => { if (e.detail === 0) action(dir); }); // clavier (Entrée sur le bouton)
  });
  $('b-haut').innerHTML = ICONES.fleche(0);
  $('b-droite').innerHTML = ICONES.fleche(90);
  $('b-bas').innerHTML = ICONES.fleche(180);
  $('b-gauche').innerHTML = ICONES.fleche(270);
  $('b-attendre').innerHTML = ICONES.attendre();
  $('icone-energie').innerHTML = ICONES.pile();
  $('b-pause').innerHTML = ICONES.pause();
  $('b-niv-retour').innerHTML = ICONES.retour();

  // Clavier : flèches, ZQSD / WASD (position des touches), Espace = attendre, Échap ou P = pause.
  const TOUCHES = { ArrowUp: 'haut', ArrowDown: 'bas', ArrowLeft: 'gauche', ArrowRight: 'droite', KeyW: 'haut', KeyS: 'bas', KeyA: 'gauche', KeyD: 'droite' };
  document.addEventListener('keydown', (e) => {
    preparerAudio();
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (fenetre === 'pause') { e.preventDefault(); reprendre(); return; }
      if (ecran === 'jeu' && !fenetre) { e.preventDefault(); pause(); return; }
      if (fenetre === 'tuto') { e.preventDefault(); fermerFenetres(); return; }
    }
    if (fenetre === 'tuto' && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); suiteTuto(); return; }
    if (ecran !== 'jeu' || fenetre) return;
    if (TOUCHES[e.code]) { e.preventDefault(); action(TOUCHES[e.code]); }
    else if (e.code === 'Space') { e.preventDefault(); action(null); }
  });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !fenetre) pause();
  });
  window.addEventListener('resize', () => { redimensionner(); if (fenetre === 'tuto') montrerTuto(); });

  // --- Boutons ---
  $('b-son-titre').addEventListener('click', basculerSon);
  $('b-son-jeu').addEventListener('click', basculerSon);
  $('b-jouer').addEventListener('click', () => {
    preparerAudio();
    son('clic');
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => {
        chargerProgres();
        const n = Math.max(1, Math.min(NIVEAUX.length, d.niveau));
        progres.debloque = Math.max(progres.debloque, n);
        lancerNiveau(n - 1);
      },
      onNouvelle: () => {
        chargerProgres();
        if (progres.debloque <= 1) lancerNiveau(0); else ouvrirNiveaux();      },
    });
  });
  $('b-niveaux-titre').addEventListener('click', () => { preparerAudio(); son('clic'); chargerProgres(); ouvrirNiveaux(); });
  $('b-niv-retour').addEventListener('click', () => { son('clic'); montrerEcran('titre'); });
  $('b-pause').addEventListener('click', () => { son('clic'); pause(); });
  $('b-reprendre').addEventListener('click', () => { son('clic'); reprendre(); });
  $('b-recommencer').addEventListener('click', () => { reprendre(); son('clic'); lancerNiveau(niveauCourant); });
  $('b-aide').addEventListener('click', () => { reprendre(); son('clic'); ouvrirTuto(mecaniquesDe(NIVEAUX[niveauCourant])); });
  $('b-pause-niveaux').addEventListener('click', () => { reprendre(); son('clic'); sauverEnCours(); ouvrirNiveaux(); });
  $('b-pause-accueil').addEventListener('click', () => { reprendre(); son('clic'); sauverEnCours(); montrerEcran('titre'); });
  $('b-compris').addEventListener('click', suiteTuto);
  $('v-tuto').addEventListener('click', (e) => { if (e.target === $('v-tuto')) suiteTuto(); });
  $('b-suivant').addEventListener('click', () => {
    son('clic');
    if (niveauCourant >= NIVEAUX.length - 1) { bilan(); return; }
    lancerNiveau(niveauCourant + 1);
  });
  $('b-rejouer').addEventListener('click', () => { son('clic'); lancerNiveau(niveauCourant); });
  $('b-vic-niveaux').addEventListener('click', () => { son('clic'); ouvrirNiveaux(); });
  $('b-reessayer').addEventListener('click', () => { son('clic'); lancerNiveau(niveauCourant); });
  $('b-def-niveaux').addEventListener('click', () => { son('clic'); ouvrirNiveaux(); });
  $('b-def-accueil').addEventListener('click', () => { son('clic'); fermerFenetres(); montrerEcran('titre'); });
  $('b-bilan-rejouer').addEventListener('click', () => { son('clic'); lancerNiveau(0); });
  $('b-bilan-niveaux').addEventListener('click', () => { son('clic'); ouvrirNiveaux(); });

  // Partie quittée en cours de niveau : on garde ce niveau pour « Continuer ».
  function sauverEnCours() {
    if (ecran === 'jeu' && enPartie) sauverProgres(niveauCourant + 1);
  }
  JEL_SAVE.surFermeture(() => {
    if (ecran === 'jeu' && enPartie) sauverProgres(niveauCourant + 1);
  });
  JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('effacer-titre') });

  // ===== DÉMARRAGE =====
  document.title = t('titre');
  chargerProgres();
  majBoutonsSon();
  dimensionnerTitre();
  requestAnimationFrame(boucle);

})();
</script>
</body>
</html>
