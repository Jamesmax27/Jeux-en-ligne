const DIR_DE = { D: [1, 0], G: [-1, 0], H: [0, -1], B: [0, 1] };

// ===========================================================================
// Progression (étoiles, records, apparence…), gardée avec la sauvegarde
// commune (save.js) et en double dans localStorage quand il existe.
// ===========================================================================
const CLE_PROG = JEU + '-progres';
const prog = { etoiles: new Array(NB).fill(0), records: new Array(NB).fill(0), debloque: 1, couleur: 0, antenne: 0, demos: {}, son: true, musique: true };

function fusionnerProg(src) {
  if (!src || typeof src !== 'object') return;
  for (let i = 0; i < NB; i++) {
    const e = Number(src.etoiles && src.etoiles[i]) || 0, r = Number(src.records && src.records[i]) || 0;
    prog.etoiles[i] = Math.max(prog.etoiles[i], Math.min(3, Math.max(0, e)));
    prog.records[i] = Math.max(prog.records[i], Math.max(0, r));
  }
  prog.debloque = Math.max(prog.debloque, Math.min(NB, Number(src.debloque) || 1));
  if (Number.isInteger(src.couleur) && COULEURS[src.couleur]) prog.couleur = src.couleur;
  if (Number.isInteger(src.antenne) && ANTENNES[src.antenne]) prog.antenne = src.antenne;
  if (src.demos && typeof src.demos === 'object') for (const k in src.demos) if (DEMOS[k]) prog.demos[k] = true;
  if (typeof src.son === 'boolean') prog.son = src.son;
  if (typeof src.musique === 'boolean') prog.musique = src.musique;
}

function chargerProg() {
  try { fusionnerProg(JSON.parse(localStorage.getItem(CLE_PROG) || 'null')); } catch (e) { /* pas de stockage */ }
  try {
    if (JEL_SAVE.existe(JEU)) {
      const d = JEL_SAVE.load(JEU);
      fusionnerProg(d.prog);
      prog.debloque = Math.max(prog.debloque, Math.min(NB, Number(d.niveau) || 1));
    }
  } catch (e) { /* sauvegarde illisible : valeurs par défaut */ }
}

// Garde la progression. La sauvegarde commune n'est complétée que si elle
// existe déjà (seule une partie y écrit le niveau où reprendre), sauf pour un
// réglage (son) : forcer = true. Le niveau déjà sauvegardé n'est jamais changé.
function garderProg(forcer) {
  try { localStorage.setItem(CLE_PROG, JSON.stringify(prog)); } catch (e) { /* pas de stockage */ }
  try { if (forcer || JEL_SAVE.existe(JEU)) JEL_SAVE.save(JEU, { prog }); } catch (e) { /* rien */ }
}

const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);
const totalScore = () => prog.records.reduce((a, b) => a + b, 0);
const salleOuverte = (i) => i === 0 || i < prog.debloque || prog.etoiles[i - 1] > 0;

// ===========================================================================
// Sons (Web Audio, aucun fichier) et musique en bips
// ===========================================================================
const Son = {
  ctx: null, maitre: null, musGain: null, minuteur: null, prochain: 0, pasMus: 0, quartier: 0, enMarche: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.maitre = this.ctx.createGain();
      this.maitre.gain.value = prog.son ? 1 : 0;
      this.maitre.connect(this.ctx.destination);
      this.musGain = this.ctx.createGain();
      this.musGain.gain.value = prog.musique ? 0.5 : 0;
      this.musGain.connect(this.maitre);
    } catch (e) { this.ctx = null; }
  },
  majVolume() {
    if (!this.ctx) return;
    this.maitre.gain.value = prog.son ? 1 : 0;
    this.musGain.gain.value = prog.musique ? 0.5 : 0;
  },
  bip(freq, duree, type, vol, vers, retard, sortie) {
    if (!this.ctx || !prog.son) return;
    try {
      const t0 = this.ctx.currentTime + (retard || 0);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t0);
      if (vers) o.frequency.exponentialRampToValueAtTime(vers, t0 + duree);
      g.gain.setValueAtTime(vol || 0.08, t0);
      g.gain.exponentialRampToValueAtTime(0.0008, t0 + duree);
      o.connect(g); g.connect(sortie || this.maitre);
      o.start(t0); o.stop(t0 + duree + 0.02);
    } catch (e) { /* rien */ }
  },
  jouer(nom) {
    const b = (f, d, t, v, vers, r) => this.bip(f, d, t, v, vers, r);
    switch (nom) {
      case 'pas': b(330, 0.05, 'square', 0.035); break;
      case 'mur': b(130, 0.09, 'square', 0.07, 80); break;
      case 'puce': b(880, 0.08, 'square', 0.06); b(1175, 0.08, 'square', 0.06, null, 0.07); b(1568, 0.14, 'square', 0.06, null, 0.14); break;
      case 'cle': b(660, 0.08, 'triangle', 0.12); b(990, 0.16, 'triangle', 0.12, null, 0.08); break;
      case 'porte': b(220, 0.18, 'square', 0.06, 440); b(660, 0.1, 'triangle', 0.08, null, 0.16); break;
      case 'porteFermee': b(160, 0.07, 'square', 0.07); b(140, 0.09, 'square', 0.07, null, 0.09); break;
      case 'pousse': b(150, 0.09, 'square', 0.06, 110); break;
      case 'pont': b(320, 0.2, 'triangle', 0.12, 90); b(520, 0.1, 'square', 0.05, null, 0.2); break;
      case 'efface': b(520, 0.12, 'triangle', 0.07, 160); break;
      case 'tele': b(300, 0.28, 'sine', 0.14, 1500); b(1500, 0.12, 'sine', 0.08, 700, 0.26); break;
      case 'touche': b(420, 0.35, 'square', 0.08, 70); break;
      case 'victoire': [523, 659, 784, 1047].forEach((f, i) => b(f, i === 3 ? 0.35 : 0.12, 'square', 0.07, null, i * 0.11)); break;
      case 'etoile': b(1046, 0.12, 'square', 0.06); b(1568, 0.16, 'triangle', 0.08, null, 0.06); break;
      case 'bouton': b(560, 0.05, 'square', 0.04); break;
      case 'compte': b(1200, 0.03, 'square', 0.025); break;
      case 'debloque': [784, 988, 1175, 1568].forEach((f, i) => b(f, 0.12, 'triangle', 0.1, null, i * 0.09)); break;
      case 'decollage': b(80, 1.6, 'sawtooth', 0.08, 400); b(300, 1.2, 'sine', 0.06, 1200, 0.4); break;
    }
  },
  // Musique : une petite boucle en bips par quartier, planifiée en avance.
  demarrerMusique(q) {
    this.quartier = q;
    this.enMarche = true;
    if (!this.ctx) return;
    if (!this.minuteur) {
      this.prochain = this.ctx.currentTime + 0.1;
      this.minuteur = setInterval(() => this.planifier(), 60);
    }
  },
  arreterMusique() {
    this.enMarche = false;
    if (this.minuteur) { clearInterval(this.minuteur); this.minuteur = null; }
  },
  planifier() {
    if (!this.ctx || !this.enMarche) return;
    const Q = QUARTIERS[this.quartier];
    if (this.prochain < this.ctx.currentTime) this.prochain = this.ctx.currentTime + 0.05;
    while (this.prochain < this.ctx.currentTime + 0.25) {
      const k = this.pasMus % 16;
      const retard = this.prochain - this.ctx.currentTime;
      const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
      if (prog.musique && prog.son) {
        if (Q.notes[k]) this.bip(hz(Q.notes[k]), Q.tempo * 0.9, 'square', 0.05, null, retard, this.musGain);
        if (Q.basse[k]) this.bip(hz(Q.basse[k]), Q.tempo * 1.8, 'triangle', 0.12, null, retard, this.musGain);
      }
      this.prochain += Q.tempo;
      this.pasMus++;
    }
  },
};

// ===========================================================================
// Dessins en gros pixels (aucun texte, aucune lettre, aucun chiffre)
// Chaque motif fait 10 × 10 pixels ; il est dessiné une fois dans un petit
// canvas, puis agrandi sans lissage.
// ===========================================================================
const MOTIFS = {
  robot: ['..........', '..........', '...DDDD...', '..DBBBBD..', '.DBWWBWWD.', '.DBWWBWWD.', '.DBBBBBBD.', '.DbLbbLbD.', '..DDDDDD..', '..DG..GD..'],
  balaiA: ['..........', '...DDDD...', '..DOOOOD..', '.DOWWWWOD.', '.DODWWDOD.', '.DOOOOOOD.', '..DooooD..', '.KKKKKKKK.', '.K.K..K.K.', '..........'],
  balaiB: ['..........', '...DDDD...', '..DOOOOD..', '.DOWWWWOD.', '.DODWWDOD.', '.DOOOOOOD.', '..DooooD..', '.KKKKKKKK.', '..K.KK.K..', '..........'],
  puce: ['..........', '...l..l...', '..YYYYYY..', '.lYyyyyYl.', '..YyWyyY..', '..YyyyyY..', '.lYyyyyYl.', '..YYYYYY..', '...l..l...', '..........'],
  cle: ['..........', '..........', '.KKK......', 'K...K.....', 'K...KKKKKK', 'K...K..K.K', '.KKK...K..', '..........', '..........', '..........'],
  porte: ['DDDDDDDDDD', 'DKKKKKKKKD', 'DKkkkkkkKD', 'DKkKKKKkKD', 'DKkKDDKkKD', 'DKkKDDKkKD', 'DKkKDDKkKD', 'DKkkkkkkKD', 'DKKKKKKKKD', 'DDDDDDDDDD'],
  bloc: ['DDDDDDDDDD', 'DHHHHHHHHD', 'DHMMMMMMmD', 'DHMDMMDMmD', 'DHMMMMMMmD', 'DHMMMMMMmD', 'DHMDMMDMmD', 'DHMMMMMMmD', 'DmmmmmmmmD', 'DDDDDDDDDD'],
  fusee: ['....RR....', '...RWWR...', '...RWWR...', '..RRRRRR..', '..RWCCWR..', '..RWCCWR..', '..RRRRRR..', '.RR.RR.RR.', '.R..YY..R.', '....YO....'],
  tele: ['..........', '...KKKK...', '..K....K..', '.K..kk..K.', '.K.k..k.K.', '.K.k..k.K.', '.K..kk..K.', '..K....K..', '...KKKK...', '..........'],
  main: ['...DD.....', '..DWWD....', '..DWWD....', '..DWWDDD..', '.DDWWWWWD.', 'DWDWWWWWWD', 'DWWWWWWWWD', '.DWWWWWWD.', '..DWWWWD..', '...DDDD...'],
};
const COULEUR_CLE = { a: ['#ff5a5a', '#a82e3a'], b: ['#5a9cff', '#2e4fa8'], y: ['#ffd23f', '#a8811e'] };
const COULEUR_TELE = { T: ['#c38bff', '#f0dcff'], U: ['#4fe08a', '#d0ffe0'] };
const SOMBRE = '#1b1630';

const cacheMotifs = new Map();
function motif(nom, pal, cleCache) {
  const k = cleCache || nom;
  let c = cacheMotifs.get(k);
  if (c) return c;
  const lignes = Array.isArray(nom) ? nom : MOTIFS[nom];
  c = document.createElement('canvas');
  c.width = lignes[0].length; c.height = lignes.length;
  const g = c.getContext('2d');
  for (let y = 0; y < lignes.length; y++) {
    for (let x = 0; x < lignes[y].length; x++) {
      const col = pal[lignes[y][x]];
      if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
    }
  }
  cacheMotifs.set(k, c);
  return c;
}

// Petit hasard fixe d'après une position (décor qui ne bouge pas).
function hache(x, y, s) { let h = (x * 374761393 + y * 668265263 + (s || 0) * 982451653) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

// Tuiles du décor d'un quartier, dessinées pixel par pixel.
function tuile(type, q, variante) {
  const k = `t-${type}-${q}-${variante}`;
  let c = cacheMotifs.get(k);
  if (c) return c;
  const Q = QUARTIERS[q];
  c = document.createElement('canvas'); c.width = 10; c.height = 10;
  const g = c.getContext('2d');
  const px = (x, y, col, w, h) => { g.fillStyle = col; g.fillRect(x, y, w || 1, h || 1); };
  if (type === 'sol' || type === 'dalle') {
    px(0, 0, type === 'dalle' ? Q.sol[2] : Q.sol[0], 10, 10);
    px(0, 9, Q.sol[1], 10, 1); px(9, 0, Q.sol[1], 1, 10);
    for (let i = 0; i < 3; i++) px(Math.floor(hache(i, variante, 7) * 8) + 1, Math.floor(hache(variante, i, 3) * 8) + 1, type === 'dalle' ? Q.sol[0] : Q.sol[2]);
    if (type === 'dalle') {
      [[1, 3], [2, 3], [3, 4], [4, 4], [5, 5], [6, 5], [7, 6], [8, 6], [3, 5], [3, 6], [6, 4], [6, 3]].forEach(([x, y]) => px(x, y, '#120d24'));
      px(0, 0, '#ffffff22', 10, 1);
    }
  } else if (type === 'mur') {
    px(0, 0, Q.mur[0], 10, 10);
    px(0, 0, Q.mur[1], 10, 1);
    px(0, 5, Q.mur[2], 10, 1);
    px(4, 1, Q.mur[2], 1, 4); px(8, 6, Q.mur[2], 1, 3); px(1, 6, Q.mur[2], 1, 3);
    px(2, 2, Q.mur[3]); px(6, 7, Q.mur[3]);
    if (variante === 1) px(0, 8, Q.mur[2], 10, 2); // pied d'ombre quand le bas est libre
  } else if (type === 'trou') {
    px(0, 0, '#05040c', 10, 10);
    px(0, 0, Q.sol[1], 10, 1); px(0, 1, '#0d0a1a', 10, 1);
    px(2, 5, '#0d0a1a'); px(7, 7, '#0d0a1a');
  } else if (type === 'vide') {
    px(0, 0, Q.vide, 10, 10);
    if (variante % 3 === 0) px(2 + (variante % 6), 2 + (variante % 5), '#ffffff88');
  }
  cacheMotifs.set(k, c);
  return c;
}

function motifRobot(couleur) {
  const C = COULEURS[couleur] || COULEURS[0];
  return motif('robot', { D: SOMBRE, B: C.corps, b: C.ombre, W: '#ffffff', L: '#ffe27a', G: '#8a8fb0' }, 'robot-' + couleur);
}
function motifAntenne(n) {
  const A = ANTENNES[n] || ANTENNES[0];
  return motif(A.motif, { Y: '#ffd45c', D: SOMBRE, C: '#7fe0ff', R: '#ff6b8b' }, 'antenne-' + n);
}

// Pixel : corps, antenne, yeux qui regardent dans la direction du pas.
function dessinerPixel(ctx, x, y, cs, opts) {
  const o = opts || {};
  const saut = o.saut || 0;
  ctx.drawImage(motifRobot(o.couleur ?? prog.couleur), x, y - saut, cs, cs);
  ctx.drawImage(motifAntenne(o.antenne ?? prog.antenne), 0, 0, 10, 3, x, y - saut, cs, cs * 0.3);
  const u = cs / 10;
  if (o.cligne) {
    ctx.fillStyle = (COULEURS[o.couleur ?? prog.couleur] || COULEURS[0]).corps;
    ctx.fillRect(x + 3 * u, y - saut + 4 * u, 5 * u, 2 * u);
    ctx.fillStyle = SOMBRE;
    ctx.fillRect(x + 3 * u, y - saut + 5 * u, 2 * u, u); ctx.fillRect(x + 6 * u, y - saut + 5 * u, 2 * u, u);
  } else {
    const dx = o.dx || 0, dy = o.dy || 0;
    const ex = dx > 0 ? 1 : 0, ey = dy < 0 ? 0 : 1;
    ctx.fillStyle = SOMBRE;
    ctx.fillRect(x + (3 + ex) * u, y - saut + (4 + ey) * u, u, u);
    ctx.fillRect(x + (6 + ex) * u, y - saut + (4 + ey) * u, u, u);
  }
}

const lisser = (k) => k * k * (3 - 2 * k);

// Dessin d'une salle complète. S : { e, niv, q, vis, vus, part, t }
function dessinerSalle(ctx, S, cs, ox, oy) {
  const e = S.e, q = S.q, t = S.t;
  const W = e.w, H = e.h;
  ctx.imageSmoothingEnabled = false;
  // 1. Décor
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const ch = e.g[y * W + x];
      const X = ox + x * cs, Y = oy + y * cs;
      if (ch === ' ') ctx.drawImage(tuile('vide', q, Math.floor(hache(x, y, 1) * 30)), X, Y, cs, cs);
      else if (ch === '#') {
        const bas = caseEn(e, x, y + 1);
        ctx.drawImage(tuile('mur', q, (bas === '#' || bas === ' ') ? 0 : 1), X, Y, cs, cs);
      } else if (ch === 'x') ctx.drawImage(tuile('trou', q, 0), X, Y, cs, cs);
      else if (ch === '~') ctx.drawImage(tuile('dalle', q, Math.floor(hache(x, y, 2) * 4)), X, Y, cs, cs);
      else ctx.drawImage(tuile('sol', q, Math.floor(hache(x, y, 2) * 4)), X, Y, cs, cs);
    }
  }
  // 2. Trajets des balais (pointillés)
  const u = cs / 10;
  e.cycles.forEach((cyc) => {
    ctx.fillStyle = 'rgba(255, 159, 67, .55)';
    cyc.forEach(([x, y]) => { ctx.fillRect(ox + x * cs + 4 * u, oy + y * cs + 4 * u, 2 * u, 2 * u); });
  });
  // 3. Objets
  const bob = (x, y) => Math.round(Math.sin(t / 260 + x + y * 0.7) * u * 0.8);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const ch = e.g[y * W + x];
      const X = ox + x * cs, Y = oy + y * cs;
      if (ch === 'c') {
        ctx.drawImage(motif('puce', { Y: '#e8b830', y: '#ffe27a', l: '#8a6510', W: '#ffffff' }), X, Y + bob(x, y), cs, cs);
        if (Math.floor(t / 180 + x * 3 + y) % 9 === 0) { ctx.fillStyle = '#ffffff'; ctx.fillRect(X + 7 * u, Y + 2 * u + bob(x, y), u, u); }
      } else if (ch === 'a' || ch === 'b' || ch === 'y') {
        const [K, k] = COULEUR_CLE[ch];
        ctx.drawImage(motif('cle', { K, k }, 'cle-' + ch), X, Y + 2 * u + bob(x, y), cs, cs);
      } else if (ch === 'A' || ch === 'B' || ch === 'Y') {
        const [K, k] = COULEUR_CLE[PORTE_DE[ch]];
        ctx.drawImage(motif('porte', { D: SOMBRE, K, k }, 'porte-' + ch), X, Y, cs, cs);
      } else if (ch === 'T' || ch === 'U') {
        const [K, k] = COULEUR_TELE[ch];
        const f = Math.floor(t / 200) % 2;
        ctx.drawImage(motif('tele', f ? { K, k } : { K: k, k: K }, `tele-${ch}-${f}`), X, Y, cs, cs);
        const a = t / 300;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(X + (4.5 + Math.cos(a) * 3.5) * u, Y + (4.5 + Math.sin(a) * 3.5) * u, u, u);
      } else if (ch === 'R' && !(S.vis && S.vis.pieceVole)) {
        const l = 0.35 + 0.25 * Math.sin(t / 200);
        ctx.fillStyle = `rgba(255, 212, 92, ${l})`;
        ctx.fillRect(X + u, Y + u, 8 * u, 8 * u);
        ctx.drawImage(motif('fusee', { R: '#ff5a5a', W: '#f4f1ff', C: '#7fe0ff', Y: '#ffd45c', O: '#ff8a3c' }), X, Y + bob(x, y), cs, cs);
      } else if (ch === 'O') {
        let bx = X, by = Y;
        const an = S.vis && S.vis.bloc;
        if (an && an.x1 === x && an.y1 === y) {
          const k = lisser(Math.min(1, (t - S.vis.t0) / DUREE_PAS));
          bx = ox + (an.x0 + (an.x1 - an.x0) * k) * cs; by = oy + (an.y0 + (an.y1 - an.y0) * k) * cs;
        }
        ctx.drawImage(motif('bloc', { D: '#22203a', H: '#d8deea', M: '#9aa3b8', m: '#5d6680' }), bx, by, cs, cs);
      }
    }
  }
  // Bloc qui tombe dans un trou : petit plongeon
  const vis = S.vis;
  if (vis && vis.pont && t - vis.t0 < 260) {
    const k = Math.min(1, (t - vis.t0) / 260);
    const s = cs * (1 - 0.5 * k);
    ctx.globalAlpha = 1 - k;
    ctx.drawImage(motif('bloc', { D: '#22203a', H: '#d8deea', M: '#9aa3b8', m: '#5d6680' }), ox + vis.pont.x * cs + (cs - s) / 2, oy + vis.pont.y * cs + (cs - s) / 2, s, s);
    ctx.globalAlpha = 1;
  }
  // 4. Balais
  const kb = vis ? lisser(Math.min(1, (t - vis.t0) / DUREE_PAS)) : 1;
  e.balais.forEach((idx, i) => {
    const p = e.cycles[i][idx];
    let bx = p[0], by = p[1];
    if (vis && vis.balais && vis.balais[i]) {
      const d = vis.balais[i];
      bx = d[0] + (p[0] - d[0]) * kb; by = d[1] + (p[1] - d[1]) * kb;
    }
    const f = Math.floor(t / 150) % 2 ? 'balaiA' : 'balaiB';
    ctx.drawImage(motif(f, { D: SOMBRE, O: '#ff9f43', o: '#c96f22', W: '#ffffff', K: '#f5d06a' }), ox + bx * cs, oy + by * cs, cs, cs);
  });
  // 5. Pixel
  if (vis) {
    let x = e.px, y = e.py;
    const k = lisser(Math.min(1, (t - vis.t0) / DUREE_PAS));
    let alpha = 1;
    if (vis.tele) {
      const kt = Math.min(1, (t - vis.t0) / (DUREE_PAS * 2.5));
      if (kt < 0.4) { const k2 = lisser(kt / 0.4); x = vis.de[0] + (vis.tele[0] - vis.de[0]) * k2; y = vis.de[1] + (vis.tele[1] - vis.de[1]) * k2; alpha = 1 - kt; }
      else if (kt < 0.6) alpha = 0;
      else alpha = (kt - 0.6) / 0.4;
    } else if (vis.de) { x = vis.de[0] + (e.px - vis.de[0]) * k; y = vis.de[1] + (e.py - vis.de[1]) * k; }
    const saut = (!vis.tele && k < 1) ? Math.sin(k * Math.PI) * u * 1.5 : 0;
    const cligne = Math.floor(t / 100) % 40 === 0;
    ctx.globalAlpha = alpha;
    dessinerPixel(ctx, ox + x * cs, oy + y * cs, cs, { dx: vis.dx, dy: vis.dy, saut, cligne });
    ctx.globalAlpha = 1;
    if (e.perdu) {
      // Petites étoiles qui tournent : Pixel est tout étourdi.
      for (let i = 0; i < 3; i++) {
        const a = t / 150 + i * 2.1;
        ctx.fillStyle = '#ffd45c';
        ctx.fillRect(ox + (e.px + 0.45 + Math.cos(a) * 0.35) * cs, oy + (e.py - 0.05 + Math.sin(a) * 0.12) * cs, u * 1.2, u * 1.2);
      }
    }
  }
  // 6. Noir : seule la lampe de Pixel éclaire
  if (S.noir && vis) {
    const k = lisser(Math.min(1, (t - vis.t0) / DUREE_PAS));
    const cx = vis.de && !vis.tele ? vis.de[0] + (e.px - vis.de[0]) * k : e.px;
    const cy = vis.de && !vis.tele ? vis.de[1] + (e.py - vis.de[1]) * k : e.py;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const d = Math.hypot(x - cx, y - cy);
        let a = d <= RAYON_LAMPE - 1 ? 0 : Math.min(0.985, (d - (RAYON_LAMPE - 1)) * 0.8);
        if (S.vus && S.vus.has(y * W + x)) a = Math.min(a, 0.7);
        if (a > 0) { ctx.fillStyle = `rgba(4, 3, 10, ${a})`; ctx.fillRect(ox + x * cs, oy + y * cs, cs, cs); }
      }
    }
    // Les yeux des balais brillent dans le noir.
    e.balais.forEach((idx, i) => {
      const p = e.cycles[i][idx];
      let bx = p[0], by = p[1];
      if (vis.balais && vis.balais[i]) { const d0 = vis.balais[i]; bx = d0[0] + (p[0] - d0[0]) * kb; by = d0[1] + (p[1] - d0[1]) * kb; }
      ctx.fillStyle = '#ffe27a';
      ctx.fillRect(ox + bx * cs + 3 * u, oy + by * cs + 4 * u, u, u);
      ctx.fillRect(ox + bx * cs + 6 * u, oy + by * cs + 4 * u, u, u);
    });
  }
  // 7. Pièce de fusée qui s'envole
  if (vis && vis.pieceVole) {
    const k = Math.min(1, (t - vis.pieceVole) / 700);
    ctx.globalAlpha = 1 - k * 0.6;
    ctx.drawImage(motif('fusee', { R: '#ff5a5a', W: '#f4f1ff', C: '#7fe0ff', Y: '#ffd45c', O: '#ff8a3c' }), ox + e.px * cs, oy + (e.py - k * 3) * cs, cs, cs);
    ctx.globalAlpha = 1;
  }
  // 8. Particules
  if (S.part) {
    for (const p of S.part) {
      ctx.globalAlpha = Math.max(0, p.vie);
      ctx.fillStyle = p.c;
      ctx.fillRect(ox + p.x, oy + p.y, p.s, p.s);
    }
    ctx.globalAlpha = 1;
  }
}

function ajouterParticules(part, x, y, n, couleurs, force) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.5 + Math.random()) * (force || 1);
    part.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.6, vie: 1, c: couleurs[i % couleurs.length], s: 3 + Math.random() * 3 });
  }
}
function majParticules(part, dt) {
  for (let i = part.length - 1; i >= 0; i--) {
    const p = part[i];
    p.x += p.vx * dt * 0.12; p.y += p.vy * dt * 0.12; p.vy += 0.004 * dt; p.vie -= dt / 900;
    if (p.vie <= 0) part.splice(i, 1);
  }
}

// --- Décor de l'écran titre et de la fusée réparée (60 × 80 pixels) ---
function dessinerFusee(g, x, y, complete, t) {
  const px = (a, b, col, w, h) => { g.fillStyle = col; g.fillRect(x + a, y + b, w || 1, h || 1); };
  const manque = (a, b, w, h) => {
    // Pièce manquante : seulement un contour en pointillés.
    for (let i = 0; i < w; i++) { if ((i + Math.floor(t / 300)) % 2 === 0) { px(a + i, b, '#6d63b8'); px(a + i, b + h - 1, '#6d63b8'); } }
    for (let j = 0; j < h; j++) { if ((j + Math.floor(t / 300)) % 2 === 0) { px(a, b + j, '#6d63b8'); px(a + w - 1, b + j, '#6d63b8'); } }
  };
  // Nez
  if (complete) { px(4, 0, '#ff5a5a', 2, 1); px(3, 1, '#ff5a5a', 4, 2); px(2, 3, '#ff5a5a', 6, 2); } else manque(2, 0, 6, 5);
  // Corps
  px(1, 5, '#f4f1ff', 8, 16); px(1, 5, '#c9c3e6', 1, 16); px(8, 5, '#b9b3e0', 1, 16);
  px(3, 8, '#2a2550', 4, 4); px(4, 9, '#7fe0ff', 2, 2); px(4, 9, '#d8f7ff', 1, 1);
  px(1, 14, '#ff5a5a', 8, 1); px(1, 18, '#ff5a5a', 8, 1);
  // Ailerons
  if (complete) { px(-2, 16, '#ff5a5a', 3, 5); px(-3, 19, '#ff5a5a', 1, 3); } else manque(-3, 16, 4, 6);
  px(9, 16, '#ff5a5a', 3, 5); px(12, 19, '#ff5a5a', 1, 3);
  // Tuyère
  if (complete) { px(2, 21, '#8a8fb0', 6, 2); } else manque(2, 21, 6, 2);
}

function dessinerScene(g, t, mode) {
  // mode : 'titre' (fusée en morceaux) ou 'final' (fusée qui décolle)
  const Wd = 60, Hd = 80;
  for (let y = 0; y < Hd; y++) {
    const k = y / Hd;
    g.fillStyle = k < 0.25 ? '#120f24' : k < 0.45 ? '#17132e' : k < 0.6 ? '#1d1838' : '#241d44';
    g.fillRect(0, y, Wd, 1);
  }
  // Étoiles qui scintillent
  for (let i = 0; i < 70; i++) {
    const x = Math.floor(hache(i, 1, 9) * Wd), y = Math.floor(hache(i, 2, 9) * 58);
    const on = (Math.floor(t / 400 + i * 7) % 11) !== 0;
    g.fillStyle = on ? (i % 9 === 0 ? '#ffd45c' : '#ffffff') : '#5b5487';
    g.fillRect(x, y, 1, 1);
  }
  // Planète à anneau
  const P = { x: 47, y: 13, r: 7 };
  for (let y = -P.r; y <= P.r; y++) for (let x = -P.r; x <= P.r; x++) {
    if (x * x + y * y <= P.r * P.r) { g.fillStyle = (x + y < -3) ? '#ffb07a' : (x + y > 4 ? '#b8562e' : '#f07a4a'); g.fillRect(P.x + x, P.y + y, 1, 1); }
  }
  g.fillStyle = '#ffd45c';
  for (let x = -11; x <= 11; x++) { const y = Math.round(x * 0.25); if (Math.abs(x) > 5 || y > 0) g.fillRect(P.x + x, P.y + y + 1, 1, 1); }
  // Petite lune
  g.fillStyle = '#b9b3e0'; g.fillRect(9, 9, 3, 3); g.fillStyle = '#ffffff'; g.fillRect(9, 9, 1, 1);
  // Sol du cratère
  g.fillStyle = '#3e3266'; g.fillRect(0, 57, Wd, 23);
  g.fillStyle = '#6b5a9e'; g.fillRect(0, 57, Wd, 1);
  g.fillStyle = '#2e2546';
  [[6, 64, 7], [40, 62, 9], [22, 72, 8], [50, 74, 6]].forEach(([x, y, w]) => { g.fillRect(x, y, w, 2); g.fillStyle = '#4b3f80'; g.fillRect(x, y + 2, w, 1); g.fillStyle = '#2e2546'; });
  for (let i = 0; i < 25; i++) { g.fillStyle = i % 2 ? '#4b3f80' : '#2e2546'; g.fillRect(Math.floor(hache(i, 5, 3) * Wd), 59 + Math.floor(hache(i, 6, 3) * 20), 1, 1); }
  if (mode === 'final') {
    const k = Math.min(1, (t % 4000) / 4000);
    const y = 34 - k * 70;
    // Flammes
    for (let i = 0; i < 6; i++) {
      g.fillStyle = i % 2 ? '#ffd45c' : '#ff8a3c';
      g.fillRect(25 + Math.floor(Math.random() * 6), y + 23 + i * 2, 2, 2);
    }
    dessinerFusee(g, 24, y, true, t);
    g.fillStyle = '#6d63b8';
    for (let i = 0; i < 8; i++) g.fillRect(14 + i * 4 + (Math.floor(t / 120) + i) % 3, 56 + (i % 2), 3, 1);
    return;
  }
  // Fusée en morceaux et Pixel devant
  dessinerFusee(g, 15, 33, false, t);
  // Pièces flottantes (puces dorées)
  [[30, 30], [44, 38], [33, 22]].forEach(([x, y], i) => {
    const b = Math.round(Math.sin(t / 400 + i * 2));
    g.fillStyle = '#8a6510'; g.fillRect(x - 1, y + b + 1, 5, 1);
    g.fillStyle = '#e8b830'; g.fillRect(x, y + b, 3, 3);
    g.fillStyle = '#ffe27a'; g.fillRect(x, y + b, 1, 1);
  });
  const saut = Math.round(Math.abs(Math.sin(t / 350)) * 1.5);
  g.imageSmoothingEnabled = false;
  g.drawImage(motifRobot(prog.couleur), 30, 37 - saut, 20, 20);
  g.drawImage(motifAntenne(prog.antenne), 0, 0, 10, 3, 30, 37 - saut, 20, 6);
  g.fillStyle = SOMBRE;
  g.fillRect(36, 47 - saut, 2, 2); g.fillRect(42, 47 - saut, 2, 2);
  // Ombre au sol
  g.fillStyle = '#2e2546'; g.fillRect(32, 57, 16, 1);
}

// ===========================================================================
// État de l'interface
// ===========================================================================
const el = (id) => document.getElementById(id);
const plateau = el('plateau'), ctx = plateau.getContext('2d');
const fondTitre = el('fond-titre'), ctxTitre = fondTitre.getContext('2d');
const fondFinal = el('fond-final'), ctxFinal = fondFinal.getContext('2d');
fondTitre.width = 60; fondTitre.height = 80;
// Téléphone : le décor remplit l'écran ; écran large : il est montré en entier, centré.
function cadrerTitre() { fondTitre.style.objectFit = window.innerWidth / Math.max(1, window.innerHeight) > 0.85 ? 'contain' : 'cover'; }
cadrerTitre();

let ecran = 'titre';
let courant = 0;            // salle en cours (0 à 19)
let etat = null;            // état de la salle (moteur)
let pile = [];              // états précédents (« Annuler le pas »)
let vis = null;             // animation du dernier pas
let vus = new Set();        // cases déjà éclairées (salles dans le noir)
const part = [];            // particules
let enPause = false;
let fileDir = null;         // pas demandé pendant une animation
let tJeu = 0;               // temps de jeu (s'arrête pendant la pause)
let secousse = { fin: 0, force: 0 };
let cs = 40;                // taille d'une case (px)
let finalActif = false;
let demo = null;
let minuteurs = [];
let jetonScore = 0;         // arrête le compteur de score d'une fenêtre précédente

function plusTard(f, ms) { const id = setTimeout(() => { minuteurs = minuteurs.filter((m) => m !== id); f(); }, ms); minuteurs.push(id); }
function annulerMinuteurs() { minuteurs.forEach(clearTimeout); minuteurs = []; }
const voileOuvert = () => !!document.querySelector('.voile.actif');

function montrer(nom) {
  ecran = nom;
  for (const s of document.querySelectorAll('.ecran')) s.classList.toggle('actif', s.id === 'ecran-' + nom);
  if (nom !== 'partie') Son.arreterMusique();
  if (nom === 'titre') { majTitre(); setTimeout(() => { try { el('b-jouer').focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30); }
  if (nom === 'salles') construireSalles();
  if (nom === 'garage') construireGarage();
}
function ouvrirVoile(id) { el(id).classList.add('actif'); const b = el(id).querySelector('.btn'); if (b) setTimeout(() => { try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30); }
function fermerVoile(id) { el(id).classList.remove('actif'); }
function fermerVoiles() { for (const v of document.querySelectorAll('.voile')) v.classList.remove('actif'); demo = null; finalActif = false; }

let minuteurBulle = 0;
function bulle(texte) {
  const b = el('bulle');
  b.textContent = texte; b.classList.add('vu');
  clearTimeout(minuteurBulle);
  minuteurBulle = setTimeout(() => b.classList.remove('vu'), 1600);
}
function bandeau(texte) {
  const b = el('bandeau');
  b.textContent = texte; b.classList.add('vu');
  setTimeout(() => b.classList.remove('vu'), 1700);
}

// --- Son : bouton commun à l'écran titre et à la partie ---
const SVG_SON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15 9c1.5 1.5 1.5 4.5 0 6M18 6c3 3 3 9 0 12" stroke="currentColor" stroke-width="2" fill="none"/></svg>';
const SVG_MUET = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15 15l6-6" stroke="currentColor" stroke-width="2.5"/></svg>';
function majBoutonsSon() {
  for (const b of document.querySelectorAll('.bouton-son')) {
    b.innerHTML = prog.son ? SVG_SON : SVG_MUET;
    b.setAttribute('aria-label', tr(prog.son ? 'son.couper' : 'son.activer'));
    b.setAttribute('aria-pressed', prog.son ? 'false' : 'true');
  }
  el('p-musique').textContent = tr(prog.musique ? 'pause.musiqueOui' : 'pause.musiqueNon');
}

// ===========================================================================
// Une salle
// ===========================================================================
function lancerSalle(i, rejouer) {
  annulerMinuteurs();
  fermerVoiles();
  courant = i;
  const niv = NIVEAUX[i];
  etat = creerEtat(niv);
  pile = [];
  vus = new Set();
  part.length = 0;
  fileDir = null;
  enPause = false;
  vis = { de: null, t0: tJeu - 1000, dx: 0, dy: 1, balais: null, bloc: null, tele: null, pont: null, pieceVole: 0 };
  marquerVus();
  montrer('partie');
  el('ecran-partie').setAttribute('aria-label', tr('salle.nom', { n: nombre(i + 1), quartier: tr('quartier.' + (quartierDe(i) + 1)) }));
  el('nom-salle').textContent = tr('salle.nom', { n: nombre(i + 1), quartier: tr('quartier.' + (quartierDe(i) + 1)) });
  el('astuce').textContent = tr('astuce.' + (i + 1));
  dimensionner();
  majHUD();
  Son.demarrerMusique(quartierDe(i));
  const annonce = () => { if (!rejouer && i % 5 === 0) bandeau(tr('quartier.' + (quartierDe(i) + 1))); };
  if (niv.demo && !prog.demos[niv.demo]) ouvrirDemo(niv.demo, annonce);
  else annonce();
}

function marquerVus() {
  if (!NIVEAUX[courant].noir || !etat) return;
  for (let y = 0; y < etat.h; y++) for (let x = 0; x < etat.w; x++) {
    if (Math.hypot(x - etat.px, y - etat.py) <= RAYON_LAMPE) vus.add(y * etat.w + x);
  }
}

function majHUD() {
  if (!etat) return;
  const ps = el('hud-puces').children;
  for (let k = 0; k < ps.length; k++) ps[k].classList.toggle('ok', k < etat.puces);
  const cles = el('hud-cles');
  cles.textContent = '';
  for (const k of ['a', 'b', 'y']) for (let n = 0; n < etat.cles[k]; n++) {
    const i = document.createElement('i'); i.style.background = COULEUR_CLE[k][0]; cles.appendChild(i);
  }
  el('hud-pas').textContent = tr('hud.pas', { n: etat.pas });
}

function dimensionner() {
  if (!etat) return;
  const z = el('zone-plateau').getBoundingClientRect();
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cs = Math.floor(Math.min((z.width - 12) / etat.w, (z.height - 8) / etat.h));
  cs = Math.max(14, Math.min(cs, 72));
  plateau.style.width = etat.w * cs + 'px';
  plateau.style.height = etat.h * cs + 'px';
  plateau.width = Math.round(etat.w * cs * dpr);
  plateau.height = Math.round(etat.h * cs * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

const dureeAnim = () => (vis && vis.tele ? DUREE_PAS * 2.5 : DUREE_PAS);

// Un pas demandé par le joueur (glissé, flèche, croix).
function essayer(dx, dy) {
  if (ecran !== 'partie' || enPause || voileOuvert() || !etat || etat.fini || etat.perdu) return;
  Son.init();
  if (tJeu - vis.t0 < dureeAnim()) { fileDir = [dx, dy]; return; }
  const r = pas(etat, dx, dy);
  vis.dx = dx; vis.dy = dy;
  if (!r.etat) { blocage(r.ev[0]); return; }
  const avant = etat;
  pile.push(avant);
  if (pile.length > 400) pile.shift();
  etat = r.etat;
  vis.de = [avant.px, avant.py];
  vis.t0 = tJeu;
  vis.balais = avant.balais.map((idx, i) => avant.cycles[i][idx]);
  vis.bloc = null; vis.tele = null; vis.pont = null;
  for (const ev of r.ev) reagir(ev);
  marquerVus();
  majHUD();
}

const centre = (x, y) => [(x + 0.5) * cs, (y + 0.5) * cs];
function reagir(ev) {
  switch (ev.t) {
    case 'pas': Son.jouer('pas'); break;
    case 'puce': Son.jouer('puce'); ajouterParticules(part, ...centre(ev.x, ev.y), 16, ['#ffd45c', '#ffe27a', '#ffffff'], 1.4); break;
    case 'cle': Son.jouer('cle'); ajouterParticules(part, ...centre(ev.x, ev.y), 12, [COULEUR_CLE[ev.k][0], '#ffffff'], 1.2); break;
    case 'porte': Son.jouer('porte'); ajouterParticules(part, ...centre(ev.x, ev.y), 14, [COULEUR_CLE[ev.k][0], COULEUR_CLE[ev.k][1]], 1.3); break;
    case 'pousse': Son.jouer('pousse'); vis.bloc = { x0: ev.x - ev.dx, y0: ev.y - ev.dy, x1: ev.x, y1: ev.y }; break;
    case 'pont': Son.jouer('pont'); vis.pont = { x: ev.x, y: ev.y }; ajouterParticules(part, ...centre(ev.x, ev.y), 12, ['#9aa3b8', '#d8deea'], 1); break;
    case 'efface': Son.jouer('efface'); ajouterParticules(part, ...centre(ev.x, ev.y), 10, [QUARTIERS[quartierDe(courant)].sol[2], '#120d24'], 0.8); break;
    case 'tele':
      Son.jouer('tele'); vis.tele = [ev.x, ev.y];
      ajouterParticules(part, ...centre(ev.x, ev.y), 12, ['#c38bff', '#ffffff', '#4fe08a'], 1);
      ajouterParticules(part, ...centre(ev.vx, ev.vy), 12, ['#c38bff', '#ffffff', '#4fe08a'], 1);
      break;
    case 'touche':
      Son.jouer('touche');
      secousse = { fin: tJeu + 400, force: 6 };
      plusTard(() => ouvrirDefaite(), 750);
      break;
    case 'fini':
      Son.jouer('victoire');
      vis.pieceVole = tJeu;
      ajouterParticules(part, ...centre(etat.px, etat.py), 40, ['#ffd45c', '#ff5a5a', '#7fe0ff', '#6cd67a', '#ffffff'], 2);
      plusTard(() => victoire(), 950);
      break;
  }
}

function blocage(ev) {
  if (!ev) return;
  Son.jouer(ev.t === 'porteFermee' ? 'porteFermee' : 'mur');
  secousse = { fin: tJeu + 120, force: 2 };
  if (ev.t === 'porteFermee') bulle(tr('bulle.porte.' + ev.k));
  else if (ev.t === 'blocCoince') bulle(tr('bulle.bloc'));
  else if (ev.t === 'bordTrou') bulle(tr('bulle.trou'));
}

function annuler() {
  if (ecran !== 'partie' || !pile.length || (etat && etat.fini)) return;
  if (enPause) return;
  if (document.querySelector('.voile.actif:not(#v-fin)')) return;
  annulerMinuteurs();
  fermerVoile('v-fin');
  etat = pile.pop();
  vis.de = null; vis.tele = null; vis.bloc = null; vis.pont = null; vis.balais = null; vis.t0 = tJeu - 1000;
  fileDir = null;
  Son.init(); Son.jouer('bouton');
  majHUD();
}

function recommencer() {
  if (ecran !== 'partie') return;
  Son.init(); Son.jouer('bouton');
  lancerSalle(courant, true);
}

// ===========================================================================
// Fin de salle
// ===========================================================================
function nouvellesRecompenses(avant, apres) {
  const l = [];
  COULEURS.forEach((c) => { if (c.seuil > avant && c.seuil <= apres) l.push(tr('debloque.couleur', { nom: tr(c.cle) })); });
  ANTENNES.forEach((a) => { if (a.seuil > avant && a.seuil <= apres) l.push(tr('debloque.antenne', { nom: tr(a.cle) })); });
  return l;
}

function victoire() {
  if (ecran !== 'partie' || !etat || !etat.fini) return;
  if (window.FMG) window.FMG.reportEnd({ completed: true, level: courant + 1 });
  const i = courant;
  const puces = etat.puces;
  const etoiles = Math.max(1, puces);
  const bonus = Math.max(0, 300 - 10 * Math.max(0, etat.pas - MINIMUMS[i]));
  const score = 500 + 150 * puces + bonus;
  const ancien = prog.records[i];
  const avant = totalEtoiles();
  prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
  prog.records[i] = Math.max(ancien, score);
  prog.debloque = Math.max(prog.debloque, Math.min(NB, i + 2));
  const recompenses = nouvellesRecompenses(avant, totalEtoiles());
  try { localStorage.setItem(CLE_PROG, JSON.stringify(prog)); } catch (e) { /* pas de stockage */ }
  JEL_SAVE.save(JEU, { niveau: Math.min(NB, i + 2), score: totalScore(), prog });
  // Jeu terminé (dernière salle gagnée, maintenant ou avant) : total des meilleures étoiles.
  if (prog.etoiles[NB - 1] > 0) {
    if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NB * 3 });
  }

  el('titre-fin').textContent = tr(i === NB - 1 ? 'fin.derniere' : 'fin.bravo');
  el('texte-fin').textContent = tr('fin.puces', { n: puces });
  const spans = el('fin-etoiles').children;
  for (const s of spans) s.classList.remove('on');
  for (let k = 0; k < etoiles; k++) plusTard(() => { spans[k].classList.add('on'); Son.jouer('etoile'); }, 350 + k * 380);
  el('fin-etoiles').style.visibility = '';
  // Score qui défile
  const sc = el('fin-score');
  const t0 = performance.now();
  const jeton = ++jetonScore;
  const compter = () => {
    if (jeton !== jetonScore) return;
    const k = Math.min(1, (performance.now() - t0) / 900);
    sc.textContent = tr('fin.score', { n: nombre(Math.round(score * k)) });
    if (k < 1 && el('v-fin').classList.contains('actif')) { if (Math.random() < 0.3) Son.jouer('compte'); requestAnimationFrame(compter); }
  };
  el('fin-record').textContent = score > ancien ? (ancien > 0 ? tr('fin.record') : '') : tr('fin.meilleur', { n: nombre(ancien) });
  el('fin-debloque').textContent = recompenses.join(' ');
  if (recompenses.length) plusTard(() => Son.jouer('debloque'), 1500);
  const boutons = [];
  if (i < NB - 1) boutons.push(['bouton.suivante', 'principal', () => lancerSalle(i + 1)]);
  else boutons.push(['bouton.fusee', 'principal', ouvrirFinal]);
  boutons.push(['bouton.rejouer', '', () => lancerSalle(i, true)]);
  boutons.push(['bouton.salles', '', () => { fermerVoiles(); montrer('salles'); }]);
  remplirBoutons(boutons);
  ouvrirVoile('v-fin');
  compter();
}

function ouvrirDefaite() {
  if (ecran !== 'partie' || !etat || !etat.perdu) return;
  if (window.FMG) window.FMG.reportEnd({ completed: false, level: courant + 1 });
  el('titre-fin').textContent = tr('fin.oups');
  el('texte-fin').textContent = tr('fin.balai');
  jetonScore++;
  for (const s of el('fin-etoiles').children) s.classList.remove('on');
  el('fin-etoiles').style.visibility = 'hidden';
  el('fin-score').textContent = '';
  el('fin-record').textContent = prog.records[courant] ? tr('fin.meilleur', { n: nombre(prog.records[courant]) }) : '';
  el('fin-debloque').textContent = '';
  remplirBoutons([
    ['bouton.annulerPas', 'principal', annuler],
    ['bouton.reessayer', '', () => lancerSalle(courant, true)],
    ['bouton.salles', '', () => { fermerVoiles(); montrer('salles'); }],
  ]);
  ouvrirVoile('v-fin');
}

function remplirBoutons(liste) {
  const zone = el('fin-boutons');
  zone.textContent = '';
  for (const [cle, classe, f] of liste) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn ' + classe;
    b.textContent = tr(cle);
    b.addEventListener('click', () => { Son.init(); Son.jouer('bouton'); f(); });
    zone.appendChild(b);
  }
}

function ouvrirFinal() {
  fermerVoiles();
  finalActif = true;
  el('final-etoiles').textContent = tr('final.etoiles', { n: nombre(totalEtoiles()), total: nombre(NB * 3) });
  Son.arreterMusique();
  Son.jouer('decollage');
  ouvrirVoile('v-final');
}

// Pause

function ouvrirPause() {
  if (ecran !== 'partie' || enPause || voileOuvert()) return;
  enPause = true;
  fileDir = null;
  Son.arreterMusique();
  majBoutonsSon();
  ouvrirVoile('v-pause');
}
function fermerPause() {
  if (!enPause) return;
  enPause = false;
  fermerVoile('v-pause');

}

// ===========================================================================
// Démonstrations animées des mécaniques
// ===========================================================================
const demoCanvas = el('demo-canvas'), demoCtx = demoCanvas.getContext('2d');
function ouvrirDemo(nom, apres) {
  const def = DEMOS[nom];
  el('titre-demo').textContent = tr('demo.' + nom + '.titre');
  const ul = el('demo-lignes');
  ul.textContent = '';
  def.lignes.forEach((cle, k) => {
    const li = document.createElement('li');
    const b = document.createElement('b'); b.textContent = nombre(k + 1); b.setAttribute('aria-hidden', 'true');
    li.append(b, document.createTextNode(tr(cle)));
    ul.appendChild(li);
  });
  const niv = { carte: def.carte, balais: def.balais };
  const w = def.carte[0].length, h = def.carte.length;
  const largeur = Math.min(300, window.innerWidth - 80);
  const c = Math.floor(Math.min(largeur / w, 150 / h, 56));
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  demoCanvas.style.width = w * c + 'px'; demoCanvas.style.height = h * c + 'px';
  demoCanvas.width = Math.round(w * c * dpr); demoCanvas.height = Math.round(h * c * dpr);
  demoCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  demo = { nom, def, niv, c, apres, e: null, vis: null, part: [], vus: new Set(), k: 0, prochain: 0 };
  remettreDemo(performance.now());
  ouvrirVoile('v-demo');
}
function remettreDemo(now) {
  const d = demo;
  d.e = creerEtat(d.niv);
  d.vis = { de: null, t0: now - 1000, dx: 1, dy: 0, balais: null, bloc: null, tele: null, pont: null, pieceVole: 0 };
  d.part.length = 0; d.vus = new Set(); d.k = 0; d.prochain = now + 900;
  vusDemo();
}
function vusDemo() {
  const d = demo;
  if (!d.def.noir) return;
  for (let y = 0; y < d.e.h; y++) for (let x = 0; x < d.e.w; x++) if (Math.hypot(x - d.e.px, y - d.e.py) <= RAYON_LAMPE) d.vus.add(y * d.e.w + x);
}
function majDemo(now, dt) {
  const d = demo;
  if (now >= d.prochain) {
    if (d.k < d.def.coups.length) {
      const [dx, dy] = DIR_DE[d.def.coups[d.k]];
      const r = pas(d.e, dx, dy);
      d.vis.dx = dx; d.vis.dy = dy;
      if (r.etat) {
        const avant = d.e;
        d.e = r.etat;
        Object.assign(d.vis, { de: [avant.px, avant.py], t0: now, balais: avant.balais.map((idx, i) => avant.cycles[i][idx]), bloc: null, tele: null, pont: null });
        for (const ev of r.ev) {
          if (ev.t === 'pousse') d.vis.bloc = { x0: ev.x - ev.dx, y0: ev.y - ev.dy, x1: ev.x, y1: ev.y };
          if (ev.t === 'pont') d.vis.pont = { x: ev.x, y: ev.y };
          if (ev.t === 'tele') d.vis.tele = [ev.x, ev.y];
          if (ev.t === 'fini') d.vis.pieceVole = now;
          if (ev.t === 'puce' || ev.t === 'cle' || ev.t === 'porte') ajouterParticules(d.part, (ev.x + 0.5) * d.c, (ev.y + 0.5) * d.c, 10, ['#ffd45c', '#ffffff'], 1);
        }
        vusDemo();
      }
      d.k++;
      d.prochain = now + 800;
    } else remettreDemo(now);
  }
  majParticules(d.part, dt);
  demoCtx.fillStyle = '#0e0c1e';
  demoCtx.fillRect(0, 0, d.e.w * d.c, d.e.h * d.c);
  dessinerSalle(demoCtx, { e: d.e, q: quartierDe(courant), vis: d.vis, vus: d.vus, part: d.part, noir: d.def.noir, t: now }, d.c, 0, 0);
  // Main animée qui montre le glissé du prochain pas.
  if (d.k < d.def.coups.length) {
    const reste = d.prochain - now;
    const phase = 1 - reste / 800;
    if (phase > 0.15 && phase < 0.95) {
      const [dx, dy] = DIR_DE[d.def.coups[d.k]];
      const k = lisser(Math.min(1, (phase - 0.15) / 0.6));
      const x = (d.e.px + 0.35 + dx * k * 0.8) * d.c, y = (d.e.py + 0.45 + dy * k * 0.8) * d.c;
      demoCtx.globalAlpha = Math.min(1, (0.95 - phase) * 5);
      demoCtx.drawImage(motif('main', { D: SOMBRE, W: '#ffffff' }), x, y, d.c * 0.8, d.c * 0.8);
      demoCtx.globalAlpha = 1;
    }
  }
}
function fermerDemo() {
  if (!demo) return;
  const d = demo;
  prog.demos[d.nom] = true;
  garderProg();
  demo = null;
  fermerVoile('v-demo');
  Son.init(); Son.jouer('bouton');
  if (d.apres) d.apres();
}

// ===========================================================================
// Écrans titre, salles, garage
// ===========================================================================
function majTitre() {
  const txt = tr('titre.etoiles', { n: nombre(totalEtoiles()), total: nombre(NB * 3) });
  el('titre-etoiles').textContent = txt;
  majBoutonsSon();
}

function etoilesTexte(n) {
  const s = document.createElement('span');
  s.className = 'et';
  s.setAttribute('aria-hidden', 'true');
  for (let k = 0; k < 3; k++) {
    const e = document.createElement('span');
    e.textContent = '★';
    if (k >= n) e.className = 'vide';
    s.appendChild(e);
  }
  return s;
}

function construireSalles() {
  el('salles-etoiles').textContent = tr('titre.etoiles', { n: nombre(totalEtoiles()), total: nombre(NB * 3) });
  const liste = el('liste-salles');
  liste.textContent = '';
  let premier = null;
  for (let q = 0; q < QUARTIERS.length; q++) {
    const bloc = document.createElement('div');
    bloc.className = 'quartier';
    const h = document.createElement('h3');
    const pastille = document.createElement('i'); pastille.style.background = QUARTIERS[q].teinte;
    h.append(pastille, document.createTextNode(tr('quartier.' + (q + 1))));
    const grille = document.createElement('div');
    grille.className = 'grille-salles';
    for (let j = 0; j < 5; j++) {
      const i = q * 5 + j;
      if (i >= NB) break;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'salle';
      if (salleOuverte(i)) {
        const n = document.createElement('span'); n.textContent = nombre(i + 1);
        b.append(n, etoilesTexte(prog.etoiles[i]));
        b.setAttribute('aria-label', tr('salles.aria', { n: i + 1, etoiles: prog.etoiles[i] }));
        b.addEventListener('click', () => { Son.init(); Son.jouer('bouton'); lancerSalle(i); });
        if (!premier || (prog.etoiles[i] === 0 && !premier.dataset.neuve)) { premier = b; if (prog.etoiles[i] === 0) b.dataset.neuve = '1'; }
      } else {
        b.classList.add('fermee');
        b.textContent = '🔒';
        b.setAttribute('aria-label', tr('salles.fermee', { n: i + 1 }));
        b.setAttribute('aria-disabled', 'true');
        b.addEventListener('click', () => { Son.init(); Son.jouer('mur'); bulle(tr('salles.fermeeAide')); });
      }
      grille.appendChild(b);
    }
    bloc.append(h, grille);
    liste.appendChild(bloc);
  }
  if (premier) setTimeout(() => { try { premier.focus({ preventScroll: false }); } catch (e) { /* rien */ } }, 30);
}

function apercuRobot(canvas, couleur, antenne) {
  const g = canvas.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, canvas.width, canvas.height);
  dessinerPixel(g, 0, 0, canvas.width, { couleur, antenne, dy: 1 });
}

function construireGarage() {
  const total = totalEtoiles();
  el('garage-etoiles').textContent = tr('titre.etoiles', { n: nombre(total), total: nombre(NB * 3) });
  const grand = el('apercu-pixel');
  apercuRobot(grand, prog.couleur, prog.antenne);
  const remplir = (zone, liste, choisi, f) => {
    zone.textContent = '';
    liste.forEach((obj, k) => {
      const b = document.createElement('button');
      b.type = 'button';
      const ouvert = total >= obj.seuil;
      const c = document.createElement('canvas'); c.width = 10; c.height = 10;
      f(c, k);
      const s = document.createElement('span');
      s.textContent = ouvert ? tr(obj.cle) : tr('garage.verrou', { n: nombre(obj.seuil) });
      b.append(c, s);
      b.setAttribute('aria-pressed', k === choisi ? 'true' : 'false');
      if (!ouvert) { b.classList.add('ferme'); b.setAttribute('aria-label', tr('garage.verrouAria', { nom: tr(obj.cle), n: obj.seuil })); }
      b.addEventListener('click', () => {
        Son.init();
        if (!ouvert) { Son.jouer('mur'); bulle(tr('garage.verrouAide', { n: nombre(obj.seuil) })); return; }
        Son.jouer('cle');
        if (liste === COULEURS) prog.couleur = k; else prog.antenne = k;
        garderProg();
        construireGarage();
      });
      zone.appendChild(b);
    });
  };
  remplir(el('choix-couleurs'), COULEURS, prog.couleur, (c, k) => apercuRobot(c, k, prog.antenne));
  remplir(el('choix-antennes'), ANTENNES, prog.antenne, (c, k) => apercuRobot(c, prog.couleur, k));
}

// ===========================================================================
// Boucle d'affichage
// ===========================================================================
let dernier = performance.now();
function boucle(now) {
  const dt = Math.min(50, now - dernier);
  dernier = now;
  if (!enPause) tJeu += dt;
  if (ecran === 'partie' && etat) {
    if (!enPause) majParticules(part, dt);
    if (fileDir && !enPause && tJeu - vis.t0 >= dureeAnim()) { const d = fileDir; fileDir = null; essayer(d[0], d[1]); }
    const Q = QUARTIERS[quartierDe(courant)];
    ctx.fillStyle = Q.vide;
    ctx.fillRect(0, 0, etat.w * cs, etat.h * cs);
    let sx = 0, sy = 0;
    if (tJeu < secousse.fin) { sx = (Math.random() - 0.5) * secousse.force; sy = (Math.random() - 0.5) * secousse.force; }
    dessinerSalle(ctx, { e: etat, q: quartierDe(courant), vis, vus, part, noir: NIVEAUX[courant].noir, t: tJeu }, cs, sx, sy);
  } else if (ecran === 'titre') {
    ctxTitre.imageSmoothingEnabled = false;
    dessinerScene(ctxTitre, now, 'titre');
  }
  if (demo) majDemo(now, dt);
  if (finalActif) { ctxFinal.imageSmoothingEnabled = false; dessinerScene(ctxFinal, now, 'final'); }
  requestAnimationFrame(boucle);
}

// ===========================================================================
// Commandes : glissé, croix, clavier
// ===========================================================================
(function glisser() {
  const zone = el('zone-plateau');
  let depart = null;
  zone.addEventListener('pointerdown', (e) => { depart = { x: e.clientX, y: e.clientY, id: e.pointerId }; Son.init(); try { zone.setPointerCapture(e.pointerId); } catch (er) { /* rien */ } });
  zone.addEventListener('pointermove', (e) => {
    if (!depart || e.pointerId !== depart.id) return;
    const dx = e.clientX - depart.x, dy = e.clientY - depart.y;
    const seuil = Math.max(22, cs * 0.55);
    if (Math.max(Math.abs(dx), Math.abs(dy)) < seuil) return;
    if (Math.abs(dx) > Math.abs(dy)) essayer(Math.sign(dx), 0); else essayer(0, Math.sign(dy));
    depart.x = e.clientX; depart.y = e.clientY; // on peut continuer à glisser : une case de plus
  });
  const fin = () => { depart = null; };
  zone.addEventListener('pointerup', fin);
  zone.addEventListener('pointercancel', fin);
})();

// Croix à l'écran : un toucher = un pas ; en gardant le doigt, Pixel continue.
for (const b of document.querySelectorAll('[data-dir]')) {
  const [dx, dy] = b.dataset.dir.split(',').map(Number);
  let rep = null;
  const stop = () => { clearTimeout(rep); clearInterval(rep); rep = null; };
  b.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    stop();
    essayer(dx, dy);
    rep = setTimeout(() => { rep = setInterval(() => essayer(dx, dy), 170); }, 360);
  });
  b.addEventListener('pointerup', stop);
  b.addEventListener('pointerleave', stop);
  b.addEventListener('pointercancel', stop);
  b.addEventListener('click', (e) => { if (e.detail === 0) essayer(dx, dy); }); // clavier (Entrée sur le bouton)
}

const TOUCHES = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0] };
document.addEventListener('keydown', (e) => {
  Son.init();
  if (ecran === 'partie') {
    if (e.code === 'Escape' || e.code === 'KeyP') {
      e.preventDefault();
      if (enPause) fermerPause(); else if (!voileOuvert()) ouvrirPause();
      return;
    }
    if (voileOuvert()) {
      if (el('v-fin').classList.contains('actif') && (e.code === 'KeyU' || e.code === 'Backspace')) { e.preventDefault(); annuler(); }
      return;
    }
    const d = TOUCHES[e.code];
    if (d) { e.preventDefault(); essayer(d[0], d[1]); return; }
    if (e.code === 'KeyU' || e.code === 'Backspace') { e.preventDefault(); annuler(); return; }
    if (e.code === 'KeyR') { e.preventDefault(); recommencer(); return; }
  } else if ((ecran === 'salles' || ecran === 'garage') && e.code === 'Escape') {
    montrer('titre');
  }
});

// Boutons
const clic = (id, f) => el(id).addEventListener('click', () => { Son.init(); Son.jouer('bouton'); f(); });
clic('b-jouer', () => {
  JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => {
      const n = Math.max(1, Math.min(NB, Number(d.niveau) || 1));
      prog.debloque = Math.max(prog.debloque, n);
      lancerSalle(n - 1);
    },
    onNouvelle: () => lancerSalle(0),
  });
});
clic('b-salles', () => montrer('salles'));
clic('b-garage', () => montrer('garage'));
clic('salles-retour', () => montrer('titre'));
clic('garage-retour', () => montrer('titre'));
clic('b-pause', ouvrirPause);
clic('b-annuler', annuler);
clic('b-recommencer', recommencer);
clic('p-reprendre', fermerPause);
clic('p-recommencer', () => { enPause = false; recommencer(); });
clic('p-musique', () => { prog.musique = !prog.musique; Son.majVolume(); majBoutonsSon(); garderProg(true); });
clic('p-salles', () => { enPause = false; fermerVoiles(); montrer('salles'); });
clic('p-accueil', () => { enPause = false; fermerVoiles(); montrer('titre'); });
clic('demo-ok', fermerDemo);
clic('final-salles', () => { fermerVoiles(); montrer('salles'); });
clic('final-rejouer', () => lancerSalle(NB - 1, true));
clic('final-garage', () => { fermerVoiles(); montrer('garage'); });
for (const b of document.querySelectorAll('.bouton-son')) {
  b.addEventListener('click', () => {
    prog.son = !prog.son;
    Son.init(); Son.majVolume();
    if (prog.son) Son.jouer('bouton');
    majBoutonsSon();
    garderProg(true);
  });
}

// Pause automatique quand l'écran est caché.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    if (ecran === 'partie' && !voileOuvert()) ouvrirPause();
    Son.arreterMusique();
  }
});
window.addEventListener('resize', () => { dimensionner(); cadrerTitre(); });

// Sauvegarde à la fermeture de la page, seulement pendant une partie.
JEL_SAVE.surFermeture(() => {
  if (ecran === 'partie' && etat && !etat.fini) JEL_SAVE.save(JEU, { niveau: courant + 1, score: totalScore(), prog });
});


// Démarrage
document.title = tr('titre');
chargerProg();
majTitre();
requestAnimationFrame(boucle);
/* JEU-FIN */
