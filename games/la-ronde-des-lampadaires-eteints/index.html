    boite.textContent = '';
    boite.style.setProperty('--n', String(q.ch.length));
    const large = q.k === 'm' || q.k === 'v';
    q.ch.forEach((_, j) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'choix' + (large ? ' large' : '');
      const cv = document.createElement('canvas'); cv.width = 120; cv.height = large ? 140 : 120;
      b.appendChild(cv);
      if (moi) { const kb = document.createElement('kbd'); kb.textContent = nb(j + 1); b.appendChild(kb); }
      b.setAttribute('aria-label', tr('q.choix', { n: j + 1 }));
      dessinerChoix(cv, q, j, qEtat.memoire);
      b.disabled = !moi;
      if (qEtat.memoire) b.classList.add('attente');
      b.addEventListener('click', () => { audio(); repondre(j); });
      boite.appendChild(b);
    });
    dessinerScene();
    el.classList.add('actif');
    majVise();
  }

  // Questions de mémoire : la rangée est montrée, puis elle change.
  function majMemoire() {
    if (!qEtat) return;
    if (qEtat.memoire && performance.now() - qEtat.debut >= qEtat.q.ms) {
      qEtat.memoire = false;
      $('q-titre').textContent = tr('q.' + qEtat.q.k);
      document.querySelectorAll('#q-choix .choix').forEach((b, j) => { b.classList.remove('attente'); const cv = b.querySelector('canvas'); if (cv) dessinerChoix(cv, qEtat.q, j, false); });
      sons.eteint();
    }
    if (memoire(qEtat.q)) dessinerScene();
  }

  function majVise() {
    document.querySelectorAll('#q-choix .choix').forEach((b, j) => b.classList.toggle('vise', !!(qEtat && qEtat.moi && clavier && j === qVise)));
  }

  function repondre(j) {
    if (!qEtat || !qEtat.moi || qEtat.repondu || qEtat.memoire || enPause) return;
    if (!partie || !partie.monTour() || !vue || vue.ph !== 'q') return;
    if (partie.jouer({ t: 'r', c: j })) { qEtat.repondu = true; sons.clic(); document.querySelectorAll('#q-choix .choix').forEach((b) => { b.disabled = true; }); }
  }

  // Montre la bonne réponse (et la mauvaise), puis ferme le panneau.
  function resultatQuestion(d, siege) {
    if (!qEtat) return;
    qEtat.repondu = true; qEtat.memoire = false; qEtat.revele = true;
    const boutons = document.querySelectorAll('#q-choix .choix');
    boutons.forEach((b, j) => { b.disabled = true; b.classList.remove('attente', 'vise'); if (j === d.a) b.classList.add('bon'); else if (j === d.c) b.classList.add('faux'); });
    const moi = siege === (partie ? partie.siege : -1);
    const res = $('q-res');
    if (d.ok) { res.textContent = tr(moi ? 'res.bon' : 'res.bonAutre', { n: d.v, nom: nomMessage(siege) }); res.className = 'bon'; }
    else { res.textContent = tr(moi ? 'res.faux' : 'res.fauxAutre', { nom: nomMessage(siege) }); res.className = 'faux'; }
    $('q-titre').textContent = tr('q.' + qEtat.q.k);
    dessinerScene();
    const j = jeton, q = qEtat;
    setTimeout(() => { if (j === jeton && qEtat === q) fermerQuestion(); }, moi ? 1200 : 950);
  }

  function fermerQuestion() {
    qEtat = null;
    $('question').classList.remove('actif');
  }

  // ---------------------------------------------------------------------
  //  L'Ombre surgit
  // ---------------------------------------------------------------------

  let alerteM = 0;
  function alerteOmbre(texte, fort) {
    const cv = $('alerte-cv'), c = cv.getContext('2d');
    c.clearRect(0, 0, 220, 270);
    ombre(c, 110, 262, 240, performance.now(), { bras: fort ? 1 : 0.5 });
    $('alerte-texte').textContent = texte;
    const el = $('alerte');
    el.classList.remove('actif'); void el.offsetWidth; el.classList.add('actif');
    if (fort) { const z = $('zone'); z.classList.remove('secoue'); void z.offsetWidth; z.classList.add('secoue'); }
    clearTimeout(alerteM);

  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    anims = { veil: {}, ombre: null, flash: {} };
    debutTour = Date.now();
    fermerQuestion();
    if (vue && vue.ph === 'q' && vue.q) ouvrirQuestion(vue.q, vue.tour);
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
    verifierMonTour(null);
  }

  // Salon d'attente (en ligne) : le premier joueur arrivé lance la manche.
  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    fermerQuestion();
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        visage(c, s, 56, 62, 40, {});
        if (info.chef) couronne(c, 56, 22, 22);
        remplirNom(d.querySelector('.nom'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { coul: tr('coul.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomChef ? nomChef + ' · ' + tr('coul.' + partie.chef) : tr('coul.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    anims = { veil: {}, ombre: null, flash: {} };
    particules.length = 0;
    debutTour = Date.now();
    dernierTic = -1;
    curseur = -1;
    nouvellesCles = [];
    fermerQuestion();
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    if (O.actif(vue, 'B')) { revele = performance.now() + 2600; sons.vent(); }
    verifierMonTour(null);
  }

  // Début de mon tour : petit son, et la ville se montre un instant dans le brouillard.
  function verifierMonTour(avant) {
    if (!partie || !vue || partie.phase !== 'jeu' || partie.siege < 0) return;
    const moi = partie.siege;
    const debut = R.aQui(vue) === moi && vue.ph === 'c' && vue.nt === 0 && vue.el[moi] === 0;
    const avantMoi = avant && R.aQui(avant) === moi && avant.ph === 'c' && avant.nt === 0;
    if (debut && !avantMoi) {
      if (avant) sons.tour();
      if (O.actif(vue, 'B')) revele = Math.max(revele, performance.now() + (NIVEAUX[vue.n].ms || 1600) + 300);
    }
  }

  function surAction(ev) {
    const t = performance.now();
    const a = ev.action, d = ev.apres.der || {}, s = ev.siege, av = ev.avant;
    vue = JSON.parse(JSON.stringify(ev.apres));
    debutTour = Date.now();
    dernierTic = -1;
    const moi = ev.moi;
    const nom = nomMessage(s);
    const monSiege = partie ? partie.siege : -1;
    // déplacements des veilleurs
    for (let k = 0; k < vue.v.length; k++) if (av.v[k] >= 0 && vue.v[k] >= 0 && av.v[k] !== vue.v[k]) anims.veil[k] = { de: av.v[k], t0: t };
    if (a.t === 'a') {
      sons.choisit();
      if (d.t === 'faux') {
        fermerQuestion();
        setTimeout(() => sons.fauxVeilleur(), 120);
        jaillir(d.p, '#b48cff', 24);
        setTimeout(() => alerteOmbre(tr(moi ? 'faux.toi' : 'faux.autre', { nom: nom }), true), 250);
      } else if (vue.q) {
        ouvrirQuestion(vue.q, s);
      }
    } else if (a.t === 'r') {
      resultatQuestion(d, s);
      if (d.ok) {
        sons.allume();
        anims.flash[d.p] = t;
        jaillir(d.p, '#ffe08a', 18);
        envolTexte(d.p, tr('fx.plus', { n: d.v }), '#ffe08a');
        if (d.fus && d.fus.length) {
          setTimeout(() => sons.fusible(), 250);
          d.fus.forEach((i) => { anims.flash[i] = t + 250; jaillir(i, '#fff4a0', 10); });
          toast(tr(moi ? 'fusible.toi' : 'fusible.autre', { nom: nom, n: d.fus.length }), 2000);
        }
        if (d.cles && d.cles.length) {
          setTimeout(() => sons.cle(), 420);
          if (moi && session === 'solo') d.cles.forEach((k) => { if (prog.cles.indexOf(k) < 0) { prog.cles.push(k); nouvellesCles.push(k); } });
          toast(tr(moi ? 'cle.toi' : 'cle.autre', { nom: nom, cle: tr('cle.' + d.cles[0]) }), 2200);
        }
        if (d.dissous && d.dissous.length) setTimeout(() => toast(tr('faux.dissous'), 1800), 900);
        if (d.auto !== undefined) setTimeout(() => toast(tr(moi ? 'garde.autoToi' : 'garde.auto', { nom: nom, n: d.auto }), 1800), 1100);
      } else {
        sons.faux();
        (d.perdus || []).forEach((i) => { jaillir(i, '#6a6a7a', 8); });
        if (d.perdu > 0) setTimeout(() => toast(tr(moi ? 'perdu.toi' : 'perdu.autre', { nom: nom, n: d.perdu }), 1800), 700);
      }
    } else if (a.t === 's') {
      if (d.v > 0) {
        sons.garde();
        const carte = $('place-' + s);
        carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
        toast(moi ? tr('garde.toi', { n: d.v }) : tr('garde.autre', { nom: nom, n: d.v }), 1600);
      } else toast(moi ? tr('passe.toi') : tr('passe.autre', { nom: nom }), 1400);
    }
    // l'Ombre
    if (d.om && d.om.length > 1) {
      anims.ombre = { chemin: d.om.slice(), t0: t + 350, repli: d.repli };
      setTimeout(() => sons.glisse(), 350);
    } else if (d.repli !== undefined) anims.ombre = null;
    if (d.souffle && d.souffle.length) setTimeout(() => { sons.eteint(); toast(tr('ombre.souffle'), 1800); }, 600);
    if (d.pris !== undefined && d.t !== 'faux') {
      const cible = d.pris, aMoi = cible === monSiege, nc = nomMessage(cible);
      const delai = 350 + (d.om ? (d.om.length - 1) * 260 : 0);
      setTimeout(() => {
        sons.pris();
        const texte = d.eteint === cible ? tr(aMoi ? 'ombre.eteintToi' : 'ombre.eteint', { nom: nc }) : tr(aMoi ? 'ombre.prisToi' : 'ombre.pris', { nom: nc });
        alerteOmbre(texte, true);
        const carte = $('place-' + cible);
        carte.classList.remove('tremble'); void carte.offsetWidth; carte.classList.add('tremble');
      }, delai);
    } else if (d.om && d.om.length > 1 && d.vise !== undefined) {
      const aMoi = d.vise === monSiege;
      setTimeout(() => alerteOmbre(tr(aMoi ? 'ombre.vientToi' : 'ombre.vient', { nom: nomMessage(d.vise), n: d.om.length - 1 }), false), 380);
    }
    if (d.t === 'faux' && d.eteint === s) setTimeout(() => { const carte = $('place-' + s); carte.classList.remove('tremble'); void carte.offsetWidth; carte.classList.add('tremble'); }, 300);
    if (d.fatigues && d.fatigues.length) setTimeout(() => { sons.eteint(); d.fatigues.forEach((i) => jaillir(i, '#8a8a9a', 6)); toast(tr('ampoule.eteinte', { n: d.fatigues.length }), 1700); }, 1300);
    if (ev.auto) toast(tr(moi ? 'multi.autoToi' : 'multi.auto'));
    // Mon veilleur s'éteint.
    if (d.eteint !== undefined && d.eteint === monSiege && monSiege >= 0) {
      if (session === 'solo') eliminationSolo();
      else setTimeout(() => toast(tr('eteint.ligne'), 3200), 2200);
    }
    verifierMonTour(av);
    if (curseur >= 0 && O.coups(vue, monSiege).indexOf(curseur) < 0) curseur = -1;
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    if (qEtat) qEtat.moi = qEtat.siege === partie.siege && qEtat.moi;
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      fermerQuestion();
      if (enLigne) afficherFinEnLigne(); else afficherFin(partie.etat, partie.siege, siegesActuels(), false);
    }, 1500);
  }

  // Solo : mon veilleur s'est éteint, la nuit est perdue tout de suite.
  function eliminationSolo() {
    const j = ++jeton;
    enPartie = false;
    const e = JSON.parse(JSON.stringify(vue)), moi = partie.siege, sieges = siegesActuels();
    const p = partie;
    partie = null;
    try { p.quitter(); } catch (er) { /* rien */ }
    setTimeout(() => { if (j !== jeton) return; fermerQuestion(); afficherFin(e, moi, sieges, true); }, 2300);
  }

  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const cl = O.classer(e);
    const gagne = moi >= 0 && cl[0] === moi;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); lucioles(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de nuit : victoire, défaite, classement
  // ---------------------------------------------------------------------

  // Étoiles : 1 pour la victoire, 2 et 3 selon les rues éclairées.
  function etoilesPour(pts, L, gagne) {
    if (!gagne) return 0;
    return 1 + (pts >= L.e2 ? 1 : 0) + (pts >= L.e3 ? 1 : 0);
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    O.classer(e).forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64; visage(cv.getContext('2d'), s, 32, 30, 26, { eteint: e.el[s] > 0 });
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nomEl = document.createElement('span'); nomEl.textContent = nomPlace(info, role);
      qui.appendChild(nomEl);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = e.el[s] > 0 ? tr('fin.ligneEteint', { n: e.sc[s] }) : tr('fin.ligne', { n: e.sc[s], f: e.fl[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin(e, moi, sieges, elimine) {
    if (!e) return;
    const cl = O.classer(e);
    const gagne = !elimine && moi >= 0 && cl[0] === moi;
    const pts = moi >= 0 ? e.sc[moi] : 0;
    const L = NIVEAUX[e.n];
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.points', { n: pts }) : '';
    $('fin-cle').textContent = nouvellesCles.length ? tr('fin.cles', { n: nouvellesCles.length }) : '';
    nouvellesCles = [];
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(pts, L, gagne);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      const avantEt = totalEtoiles();
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (toutes les nuits gagnées, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else sauver(niveau, pts);
      const nouvelleLanterne = LANTERNES.some((l) => l.etoiles > avantEt && l.etoiles <= totalEtoiles());
      $('fin-titre').textContent = gagne ? tr('fin.gagne') : tr(elimine ? 'fin.eteint' : 'fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';

  // Lucioles dorées de la victoire : la ville se rallume.
  function lucioles() {
    const cv = $('lucioles'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: h + Math.random() * h * 0.4, vx: (Math.random() - 0.5) * 50, vy: -(80 + Math.random() * 160), r: 2 + Math.random() * 4, ph: Math.random() * 6, coul: i % 4 ? '#ffd77a' : '#fff4c4' });
    let debut = 0, prec = 0;
    const j = ++lucioles.n;
    function pas(t) {
      if (j !== lucioles.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt + Math.sin(t / 300 + b.ph) * 0.8; b.y += b.vy * dt;
        halo(c, b.x, b.y, b.r * 4, 'rgba(255,214,120,0.5)', 0.6 + 0.4 * Math.sin(t / 120 + b.ph));
        c.fillStyle = b.coul; rond(c, b.x, b.y, b.r * 0.6); c.fill();
      });
      if (t - debut < 3200) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  lucioles.n = 0;

    if (session !== 'solo') return;

      for (let g = 1; g <= 2; g++) { c.globalAlpha = 0.25 / g; ombre(c, po[0] + 20 + g * 40, po[1] + 16, 90, t, {}); c.globalAlpha = 1; }
      ombre(c, po[0] + 20, po[1] + 16, 90, t, { bras: 0.8 });
    } },
    faux: { duree: 4800, scene: (c, t) => {
      const pts = [[100, 240], [260, 240], [420, 240]];
      miniRue(c, pts, [1, 0, 0], t, { anneaux: [1, 2] });
      veilleur(c, 0, pts[0][0] - 26, pts[0][1], 34, {});
      veilleur(c, 1, pts[1][0] - 26, pts[1][1], 34, { faux: true, alpha: 0.75 + 0.25 * Math.sin(t / 90) });
      if (t < 2200) { const m = aller([480, 350], [270, 250], t / 1000); main(c, m[0], m[1] + 30, 0.7, false); }
      else if (t < 3000) {
        main(c, 270, 280, 0.7, false);
        c.strokeStyle = '#ff4a3a'; c.lineWidth = 9; c.beginPath(); c.moveTo(220, 160); c.lineTo(300, 240); c.moveTo(300, 160); c.lineTo(220, 240); c.stroke();
      } else { const m = aller([270, 280], [430, 250], (t - 3000) / 800); main(c, m[0], m[1] + 30, 0.7, t > 3900); }
    } },
    flamme: { duree: 3000, scene: (c, t) => {
      lanterne(c, 0, 280, 170, 70, true);
      flammes(c, 240, 300, 2, 3);
      if (t % 1500 < 750) halo(c, 292, 300, 30, 'rgba(255,80,60,0.6)');
    } },
    brouillard: { duree: 4600, scene: (c, t) => {
      const pts = [[100, 120], [280, 120], [460, 120], [100, 280], [280, 280], [460, 280]];
      miniRue(c, pts, [1, 0, 1, 0, 1, 0], t, { rues: [[0, 1], [1, 2], [3, 4], [4, 5], [0, 3], [1, 4], [2, 5]] });
      veilleur(c, 0, pts[0][0] - 26, pts[0][1], 30, {});
      ombre(c, pts[5][0] + 20, pts[5][1] + 14, 80, t, {});
      const a = t < 1500 ? 0 : Math.min(0.94, (t - 1500) / 700);
      if (a > 0) {
        c.save();
        c.fillStyle = 'rgba(46,50,66,' + a.toFixed(2) + ')';
        c.beginPath(); c.rect(0, 0, 560, 360); c.arc(pts[0][0], pts[0][1], 110, 0, Math.PI * 2, true); c.fill('evenodd');
        c.restore();
        [0, 2, 4].forEach((i) => halo(c, pts[i][0] + 9, pts[i][1] - 30, 30, 'rgba(255,220,140,0.8)'));
      }
    } }
  };

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    let debut = 0, id = 0;
    const j = ++tutoAnim;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const tt = (t - debut) % d.duree;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 360);
      c.fillStyle = '#0b0d16'; c.fillRect(0, 0, 560, 360);
      try { d.scene(c, tt); } catch (e) { /* dessin impossible */ }
      id = requestAnimationFrame(image);
    }
    id = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(id);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function noeudSous(px, py) {
    if (!vue || !geo) return -1;
    let mieux = -1, md = geo.cell * 0.55;
    for (let i = 0; i < vue.w * vue.h; i++) {
      const p = posNoeud(geo, i), d = Math.hypot(px - p[0], py - (p[1] - geo.cell * 0.05));
      if (d < md) { md = d; mieux = i; }
    }
    return mieux;
  }

  function action(p) {
    if (!partie || enPause || attenteTuto || p < 0) return;
    if (!monTourChoix()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu' && !partie.monTour()) { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (O.coups(vue, partie.siege).indexOf(p) < 0) {
      if (Date.now() - dernierAttends > 900) { dernierAttends = Date.now(); toast(tr('tour.voisin'), 1500); sons.non(); }
      return;
    }
    if (partie.jouer({ t: 'a', p: p })) { survol = -1; curseur = -1; }
  }

  function garder() {
    if (!monTourChoix() || !vue) return;
    audio();
    partie.jouer({ t: 's' });
  }

  // Flèche : la rue dans cette direction depuis mon veilleur ; deux fois la même flèche = tenter.
  function fleche(dx, dy) {
    if (!monTourChoix() || qEtat) return;
    const moi = partie.siege, v = vue.v[moi];
    if (v < 0) return;
    const x = v % vue.w + dx, y = Math.floor(v / vue.w) + dy;
    if (x < 0 || y < 0 || x >= vue.w || y >= vue.h) { sons.non(); return; }
    const cible = y * vue.w + x;
    if (O.coups(vue, moi).indexOf(cible) < 0) { sons.non(); return; }
    if (clavier && curseur === cible) { action(cible); return; }
    clavier = true;
    curseur = cible;
    sons.clic();
  }

  const ville = $('ville');
  function point(ev) { const r = ville.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  ville.addEventListener('pointerdown', (ev) => { audio(); clavier = false; const p = point(ev); survol = noeudSous(p[0], p[1]); });
  ville.addEventListener('pointermove', (ev) => { const p = point(ev); if (ev.pointerType === 'mouse' || ev.buttons) survol = noeudSous(p[0], p[1]); });
  ville.addEventListener('pointerup', (ev) => {
    const p = point(ev);
    const i = noeudSous(p[0], p[1]);
    if (ev.pointerType !== 'mouse') survol = -1;
    action(i);
  });
  ville.addEventListener('pointercancel', () => { survol = -1; });
  ville.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') survol = -1; });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    // Question : chiffres, ou flèches et Entrée
    if (qEtat && qEtat.moi && !qEtat.repondu) {
      const n = qEtat.q.ch.length;
      const m = /^(?:Digit|Numpad)([1-9])$/.exec(ev.code);
      if (m) { ev.preventDefault(); audio(); if (Number(m[1]) <= n) repondre(Number(m[1]) - 1); return; }
      if (ev.code === 'ArrowLeft' || ev.code === 'ArrowUp') { ev.preventDefault(); clavier = true; qVise = (qVise + n - 1) % n; majVise(); sons.clic(); return; }
      if (ev.code === 'ArrowRight' || ev.code === 'ArrowDown') { ev.preventDefault(); clavier = true; qVise = (qVise + 1) % n; majVise(); sons.clic(); return; }
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
        ev.preventDefault(); audio();
        if (!clavier) { clavier = true; majVise(); return; }
        repondre(qVise); return;
      }
      return;
    }
    if (ev.code === 'KeyS') { ev.preventDefault(); garder(); return; }
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) { ev.preventDefault(); audio(); fleche(dirs[ev.code][0], dirs[ev.code][1]); }
    else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (!monTourChoix()) return;
      const l = O.coups(vue, partie.siege);
      if (!l.length) { garder(); return; }
      if (!clavier || curseur < 0 || l.indexOf(curseur) < 0) { clavier = true; curseur = l[0]; sons.clic(); return; }
      action(curseur);
    }
  });

  // ---------------------------------------------------------------------
  //  Affiche (jaquette du jeu)
  // ---------------------------------------------------------------------
  // Avec window.JEL_AFFICHE (posé par le robot du site, jamais par le jeu) : une scène composée, sans
  // interface ni texte, d'où sort la jaquette (CONSIGNES-JEU.md, section 5). Un veilleur à capuche rouge
  // vient de rallumer le lampadaire du coin : sa lumière dorée l'entoure, tandis que l'Ombre, immense,
  // se dresse devant la lune au bout de la rue éteinte et tend ses bras de fumée vers lui.

  function dessinerAffiche() {
    const cv = $('fond'), W = window.innerWidth, H = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const k = Math.min(W / 600, H / 800);
    const t = 1300;                       // instant figé des ondulations de l'Ombre
    const al = graineHasard(31);

    // Ciel violet de nuit, plus clair en haut
    const ciel = c.createLinearGradient(0, 0, 0, H);
    ciel.addColorStop(0, '#45347a'); ciel.addColorStop(0.32, '#2e2a5e'); ciel.addColorStop(0.58, '#181936'); ciel.addColorStop(1, '#08080f');
    c.fillStyle = ciel; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 90; i++) {
      c.fillStyle = 'rgba(230,226,255,' + (0.3 + al() * 0.6).toFixed(2) + ')';
      const s = (1.2 + al() * 1.6) * k;
      c.fillRect(al() * W, al() * H * 0.5, s, s);
    }

    // Pleine lune derrière la tête de l'Ombre : la silhouette se découpe dessus
    const ox = W * 0.68, lx = ox, ly = H * 0.25, lr = 150 * k;
    halo(c, lx, ly, lr * 3.8, 'rgba(176,130,255,0.6)');
    halo(c, lx, ly, lr * 1.9, 'rgba(236,226,255,0.7)');
    const lune = c.createRadialGradient(lx - lr * 0.3, ly - lr * 0.3, lr * 0.1, lx, ly, lr);
    lune.addColorStop(0, '#ffffff'); lune.addColorStop(1, '#d4c8f2');
    c.fillStyle = lune; rond(c, lx, ly, lr); c.fill();
    c.fillStyle = 'rgba(160,140,210,0.35)';
    [[-0.35, 0.25, 0.18], [0.3, -0.35, 0.12], [0.42, 0.3, 0.1], [-0.1, -0.5, 0.08]].forEach(([a, b, r]) => { rond(c, lx + a * lr, ly + b * lr, r * lr); c.fill(); });

    // La rue en perspective, qui file vers l'Ombre
    const hz = H * 0.6, cx = ox;
    const sol = c.createLinearGradient(0, hz, 0, H);
    sol.addColorStop(0, '#2a2648'); sol.addColorStop(1, '#0e0d18');
    c.fillStyle = sol;
    poly(c, [[cx - W * 0.05, hz], [cx + W * 0.05, hz], [W * 1.3, H], [-W * 0.4, H]]); c.fill();
    c.strokeStyle = 'rgba(150,140,200,0.35)'; c.lineWidth = 4 * k; c.setLineDash([16 * k, 20 * k]);
    c.beginPath(); c.moveTo(cx, hz); c.lineTo(cx - W * 0.12, H); c.stroke(); c.setLineDash([]);

    // Immeubles des deux côtés : fenêtres dorées à gauche (rue rallumée), éteintes ou violettes à droite
    for (let cote = -1; cote <= 1; cote += 2) {
      for (let n = 6; n >= 0; n--) {
        const p = 1 - n / 7, p2 = 1 - (n + 1) / 7;
        const xa = cx + cote * (W * 0.07 + W * 0.7 * p), xb = cx + cote * (W * 0.07 + W * 0.7 * p2);
        const ya = hz + H * 0.4 * p, yb = hz + H * 0.4 * p2;
        const ha = H * (0.1 + 0.42 * p), hb = H * (0.1 + 0.42 * p2);
        c.fillStyle = n % 2 ? '#25244a' : '#2d2b56';
        poly(c, [[xa, ya - ha], [xb, yb - hb], [xb, yb], [xa, ya]]); c.fill();
        // liseré de lune sur le toit
        c.strokeStyle = 'rgba(200,180,255,0.55)'; c.lineWidth = 2 * k;
        c.beginPath(); c.moveTo(xa, ya - ha); c.lineTo(xb, yb - hb); c.stroke();
        for (let f = 0; f < 3; f++) {
          for (let e = 0; e < 3; e++) {
            const r = al();
            if (r > 0.45) continue;
            const u = 0.2 + f * 0.28, v = 0.25 + e * 0.22;
            const fx = xa + (xb - xa) * u, fy = (ya - ha * (1 - v)) + ((yb - hb * (1 - v)) - (ya - ha * (1 - v))) * u;
            const tw = Math.abs(xb - xa) * 0.14, th = (ha * (1 - u) + hb * u) * 0.1;
            c.fillStyle = cote < 0 ? (r < 0.38 ? '#ffcf6a' : '#3a3660') : (r < 0.08 ? '#c8a0ff' : '#1a1934');
            c.fillRect(fx - tw / 2, fy, tw, th);
          }
        }
      }
    }

    // Brume violette au pied de l'Ombre
    for (let i = 0; i < 7; i++) halo(c, W * (0.15 + i * 0.13), hz + (i % 3) * 12 * k, W * 0.28, 'rgba(150,120,210,0.22)');

    // Lampadaires lointains : allumés derrière le veilleur, éteints du côté de l'Ombre
    for (let n = 6; n >= 2; n--) {
      const p = 1 - n / 7;
      for (let cote = -1; cote <= 1; cote += 2) {
        const x = cx + cote * (W * 0.06 + W * 0.5 * p), y = hz + H * 0.36 * p;
        const etat = cote < 0 && n <= 4 ? 1 : 0;
        lampadaire(c, x, y, H * 0.34 * p + 12 * k, etat, t);
        if (etat) halo(c, x, y, W * 0.16 * p + 10 * k, 'rgba(255,206,110,0.4)');
      }
    }

    // L'Ombre, immense, bras ouverts vers le veilleur
    halo(c, ox, H * 0.42, H * 0.36, 'rgba(120,60,220,0.45)');
    ombre(c, ox, H * 0.66, H * 0.54, t, { bras: 0.6 });
    // Contour violet vif sur la tête et les épaules, éclairées par la lune
    c.save();
    c.translate(ox, H * 0.66); c.scale(H * 0.0054, H * 0.0054);
    c.strokeStyle = 'rgba(205,150,255,0.9)'; c.lineWidth = 2.2; c.shadowColor = '#b06aff'; c.shadowBlur = 14 * k;
    c.beginPath(); c.moveTo(-24, -62); c.quadraticCurveTo(-14, -96, 0, -98); c.quadraticCurveTo(14, -96, 24, -62); c.stroke();
    // filets de fumée qui s'échappent de ses flancs
    c.shadowBlur = 0; c.lineCap = 'round';
    [[-28, -30, -44, -6, 1], [28, -36, 46, -14, -1], [-24, -10, -38, 6, 1], [26, -6, 40, 8, -1]].forEach(([x0, y0, x1, y1, sg]) => {
      c.strokeStyle = 'rgba(12,8,22,0.85)'; c.lineWidth = 3.2;
      c.beginPath(); c.moveTo(x0, y0); c.bezierCurveTo(x0 + sg * -6, y0 - 10, x1 + sg * 8, y1 - 4, x1, y1); c.stroke();
      c.strokeStyle = 'rgba(190,130,255,0.5)'; c.lineWidth = 0.8; c.stroke();
    });
    c.restore();
    // Volutes de fumée qui rampent vers le veilleur et éteignent la rue
    for (let i = 0; i < 5; i++) {
      c.save(); c.translate(ox - W * (0.04 + i * 0.07), H * (0.665 + (i % 2) * 0.012)); c.scale(1, 0.28);
      halo(c, 0, 0, (70 - i * 6) * k, 'rgba(12,6,24,0.85)');
      c.restore();
    }

    // Lampadaire du premier plan, que le veilleur vient de rallumer
    const lpX = W * -0.01, lpY = H * 0.86, lpH = H * 0.7, lpK = lpH / 100;
    const ampX = lpX + 17 * lpK, ampY = lpY - 75 * lpK;
    // cône de lumière vers le sol, sur le veilleur
    const cone = c.createLinearGradient(0, ampY, 0, H * 0.8);
    cone.addColorStop(0, 'rgba(255,226,150,0.55)'); cone.addColorStop(1, 'rgba(255,200,110,0.08)');
    c.fillStyle = cone;
    poly(c, [[ampX - 14 * k, ampY], [ampX + 14 * k, ampY], [ampX + W * 0.3, H * 0.8], [ampX - W * 0.22, H * 0.8]]); c.fill();
    halo(c, ampX, ampY, W * 0.6, 'rgba(255,200,100,0.45)');
    lampadaire(c, lpX, lpY, lpH, 1, t);
    halo(c, ampX, ampY + 6 * k, 60 * k, 'rgba(255,250,220,0.95)');
    // étincelles du rallumage
    for (let i = 0; i < 12; i++) {
      const a = i * 0.52 + 0.2, d = (60 + (i % 4) * 26) * k;
      c.fillStyle = i % 3 ? '#ffe08a' : '#fff6d0'; c.shadowColor = '#ffc94a'; c.shadowBlur = 12 * k;
      etoile(c, ampX + Math.cos(a) * d, ampY + Math.sin(a) * d * 0.8, (9 - (i % 4)) * k, (3.4 - (i % 4) * 0.4) * k, 4, a);
      c.fill();
    }
    c.shadowBlur = 0;
    // cœur blanc de l'ampoule rallumée
    c.fillStyle = '#fffbe8'; ell(c, ampX, ampY - lpK, 6 * lpK, 3.2 * lpK); c.fill();

    // Lucioles dorées dans la lumière (derrière le veilleur)
    for (let i = 0; i < 14; i++) {
      const x = W * (0.03 + al() * 0.45), y = H * (0.22 + al() * 0.5);
      halo(c, x, y, (7 + al() * 5) * k, 'rgba(255,214,120,0.6)');
      c.fillStyle = '#fff3c4'; rond(c, x, y, 1.8 * k); c.fill();
    }

    // Le veilleur, en grand, la peur au visage, lanterne levée vers l'Ombre
    const vx = W * 0.28, vy = H * 0.555, vr = 178 * k;
    c.fillStyle = 'rgba(0,0,0,0.45)'; ell(c, vx + vr * 0.5, vy + vr * 0.92, vr * 0.9, vr * 0.12, -0.08); c.fill();
    halo(c, vx + vr * 0.62, vy + vr * 0.42, vr * 0.8, 'rgba(255,170,60,0.5)');
    c.save();
    c.shadowColor = 'rgba(255,200,110,0.75)'; c.shadowBlur = 10 * k;
    veilleur(c, 0, vx, vy, vr, { peur: true, style: 0 });
    c.restore();

    // Premier plan : pavés du bas
    c.strokeStyle = 'rgba(120,110,170,0.12)'; c.lineWidth = 2 * k;
    for (let rg = 0; rg < 5; rg++) {
      const y = H * (0.8 + rg * 0.045), pas = (34 + rg * 10) * k;
      for (let x = ((rg % 2) * pas) / 2 - pas; x < W + pas; x += pas) { ell(c, x, y, pas * 0.42, (6 + rg * 2) * k); c.stroke(); }
    }
    // léger vignetage pour concentrer le regard
    const vig = c.createRadialGradient(W * 0.48, H * 0.45, Math.min(W, H) * 0.35, W * 0.48, H * 0.45, Math.max(W, H) * 0.75);
    vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.45)');
    c.fillStyle = vig; c.fillRect(0, 0, W, H);
  }

  function demarrerAffiche() {
    ecran = 'affiche';
    // Ni écran, ni bouton, ni bouton de langue, ni fenêtre : seulement la scène.
    const st = document.createElement('style');
    st.textContent = '.ecran, button, .rond, #toast, #lucioles, #alerte, .jel-langue { display: none !important; } #fond { display: block !important; }';
    document.head.appendChild(st);
    dessinerAffiche();
    window.addEventListener('resize', dessinerAffiche);
  }

  // ---------------------------------------------------------------------
  //  Images du jeu (window.JEL_APERCU = 1, 2 ou 3, posé par le robot seulement)
  // ---------------------------------------------------------------------
  // 1 : nuit 1, question « silhouette » ouverte sur la ville ; 2 : nuit 10, mon tour en cours
  // (rues en jeu, clés, fusibles, doubles, ampoules) ; 3 : nuit 16 sur ordinateur, faux veilleurs
  // et Ombre toute proche. La nuit est jouée d'avance par les robots des règles (hasard à graine
  // fixe : toujours la même image), puis figée : la partie affichée ne reçoit plus aucun coup.
  const MOMENTS_APERCU = {
    1: { niveau: 1, ok: (e) => e.ro >= 2 && e.ph === 'q' && e.q.k === 'o' && e.sc[0] >= 1 },
    2: { niveau: 10, ok: (e) => e.ro >= 2 && e.sc[0] >= 2 && e.ph === 'c' && e.nt >= 2 && O.coups(e, 0).length >= 2 && compte(e.F) >= 1 && compte(e.X) >= 1 && e.K.some((k) => k >= 0) },
    3: { niveau: 16, ok: (e) => e.ro >= 3 && e.ph === 'c' && e.nt >= 1 && O.coups(e, 0).length >= 2 && compte(e.M) >= 1 && compte(e.F) >= 1 && O.distances(e, e.o)[e.v[0]] === 2 }
  };
  function compte(l) { return l.filter((x) => x > 0).length; }

  // Joue la nuit avec les robots des règles (le veilleur rouge, le mien, joue bien) jusqu'au moment voulu.
  function nuitApercu(m) {
    for (let graine = 1; graine < 400; graine++) {
      let a = graine * 7919 + 17;
      const alea = () => { a = (a * 1103515245 + 12345) % 2147483648; return a / 2147483648; };
      const e = R.depart(alea, PLACES, { niveau: m.niveau });
      const fo = e.fo;
      for (let coup = 0; coup < 400; coup++) {
        const s = R.aQui(e);
        if (s === 0 && e.el.every((x) => x === 0) && e.fl[0] === NIVEAUX[e.n].fl && m.ok(e)) return e;
        e.fo = s === 0 ? 0.95 : fo;
        const act = R.bot(e, s, alea, e.fo);
        e.fo = fo;
        if (!R.valide(e, s, act)) break;
        R.jouer(e, s, act, alea);
        if (R.fin(e)) break;
      }
    }
    return null;
  }

  function ouvrirApercu(n) {
    const m = MOMENTS_APERCU[n];
    const e = nuitApercu(m);
    if (!e) return false;
    prog.options.son = false;                  // aucun son
    prog.lanterne = 0;
    majBoutonsSon();
    session = 'solo';
    niveau = m.niveau;
    enPartie = false;                          // rien d'écrit à la fermeture
    // Partie figée : la nuit solo contre les robots, sans réseau, qui n'accepte plus aucun coup.
    partie = {
      mode: 'solo', phase: 'jeu', siege: 0, manche: 0, chef: -1, etat: e,
      sieges: () => [0, 1, 2, 3].map((s) => ({ moi: s === 0, humain: s === 0, chef: false })),
      monTour: () => R.aQui(e) === 0, jouer: () => false, pause: () => {}, quitter: () => {},
      recommencer: () => false, lancerManche: () => false, estChef: () => false
    };
    vue = JSON.parse(JSON.stringify(e));
    anims = { veil: {}, ombre: null, flash: {} };
    particules.length = 0;
    afficherEcran('jeu');
    if (vue.ph === 'q' && vue.q) {
      ouvrirQuestion(vue.q, 0);
      $('question').style.animation = 'none';
    }
    majInterface();
    return true;
  }

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); dessinerTitre(performance.now()); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-trousseau').addEventListener('click', () => { audio(); sons.clic(); ouvrirTrousseau(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('tr-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-garder').addEventListener('click', () => garder());
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && !APERCU && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une nuit solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu' && ecran !== 'affiche') dessinerTitre(performance.now()); });

  document.title = tr('titre');
  chargerProgression();
  // Affiche du jeu (robot du site seulement) : la scène, sans écran titre, sans son ni boucle de jeu.
  if (window.JEL_AFFICHE) { demarrerAffiche(); return; }
  construirePlaces();
  majBoutonsSon();
  // Images du jeu (robot du site seulement) : directement en pleine nuit, sans écran titre ni fenêtre.
  if (APERCU && ouvrirApercu(APERCU)) return;
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
