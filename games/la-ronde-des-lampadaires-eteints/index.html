  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !e.fini ? e.tour : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const pts = e ? O.points(e, s) : 0;
      const fl = e ? e.fl[s] : 3, flMax = e ? NIVEAUX[e.n].fl : 3;
      const eteint = !!e && fl <= 0;
      const ptsEl = d.querySelector('.pts');
      if (ptsEl.textContent !== nb(pts)) ptsEl.textContent = nb(pts);
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('eteint', eteint);
      const cle = (eteint ? 'e' : 'v') + (info.moi ? 'm' : '') + lanterne().id;
      const cv = d.querySelector('canvas.tete');
      if (cv.dataset.cle !== cle) { cv.dataset.cle = cle; tete(cv.getContext('2d'), s, 80, eteint); }
      const flEl = d.querySelector('.flammes'), cleF = fl + '/' + flMax;
      if (flEl.dataset.cle !== cleF) {
        flEl.dataset.cle = cleF; flEl.textContent = '';
        for (let k = 0; k < flMax; k++) { const i = document.createElement('i'); if (k >= fl) i.className = 'morte'; flEl.appendChild(i); }
      }
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, eteint ? tr('place.eteint', { nom: nomPlace(info, role) }) : nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria', { couleur: tr('coul.' + s), qui: nomPlace(info, role), points: pts, flammes: fl }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || e.fini) return '';
    const s = e.tour, moi = moiSiege();
    if (moi < 0) return tr('multi.attente');
    if (s === moi) {
      if (e.ph === 'question') return tr('tour.reponds');
      if (e.serie > 0) return tr('tour.continuer', { n: e.prov.length });
      return O.cibles(e, moi).length ? tr('tour.toi') : tr('tour.bloque');
    }
    return e.ph === 'question' ? tr('tour.repond', { qui: nomQui(s) }) : tr('tour.autre', { qui: nomQui(s) });
  }

  function majInfos() {
    let info = '';
    const e = vue;
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if (e && !e.fini && partie && partie.phase === 'jeu') info += ' · ' + tr('jeu.ronde', { n: Math.min(e.ronde, e.cfg.rondes), total: e.cfg.rondes });
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
    // barre du bas : garder sa lumière, passer, aide
    const monTour = !!(partie && partie.monTour() && e && e.ph === 'choix' && !attenteTuto && !enPause);
    const garder = monTour && e.serie > 0;
    const passer = monTour && e.serie === 0 && !O.cibles(e, moiSiege()).length;
    const bg = $('btn-garder');
    bg.hidden = !garder;
    if (garder) { const tx = tr('bouton.garder', { n: e.prov.length }); if (bg.textContent !== tx) bg.textContent = tx; }
    $('btn-passer').hidden = !passer;
    const aide = $('aide');
    let ta = '';
    if (!garder && !passer) {
      if (monTour) ta = tr(e.cfg.brume ? 'jeu.aideBrume' : 'jeu.aide');
      else if (e && !e.fini && partie && partie.phase === 'jeu' && e.tour !== moiSiege()) ta = tr(e.om.length ? 'jeu.aideAttente' : 'jeu.aideAttenteSans');
    } else if (garder) ta = tr('jeu.aideGarder');
    aide.hidden = !ta;
    if (aide.textContent !== ta) aide.textContent = ta;
  }

  function majInterface() {
    majPlaces();
    majInfos();
    verifierQuestion();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fini) {
      const s = e.tour, sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === moiSiege() && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu') return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    if (!enPause) {
      dessinerJeu(performance.now(), dt);
      avancerQuestion(dt);
    }
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function ciblesVisibles() {
    if (!vue || !partie || attenteTuto || enPause) return [];
    if (!partie.monTour() || vue.ph !== 'choix') return [];
    return O.cibles(vue, moiSiege());
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; c.fillStyle = '#070a16'; c.fillRect(0, 0, w, h); return; }
    geo = geometrie(vue, w, h);
    const cibles = ciblesVisibles();
    let brume = 0;
    if (vue.cfg.brume && !vue.fini) {
      const moi = moiSiege();
      const depuis = t - brumeDebut;
      brume = vue.tour === moi && vue.ph === 'choix' ? Math.max(0, Math.min(1, (depuis - 1300) / 600)) : 1;
    }
    dessinerCarte(c, vue, geo, w, h, { t: t, dt: dt, moi: moiSiege(), cibles: cibles, curseur: clavier ? curseur : -1, survol: survol, brume: brume });
  }

  function jaillir(i, coul, n) {
    if (!vue || !geo) return;
    const x = posX(geo, vue, i), y = posY(geo, vue, i) - geo.s * 0.3;
    for (let k = 0; k < (n || 14); k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 150;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, vie: 0.6 + Math.random() * 0.4, k: geo.s * (0.05 + Math.random() * 0.05), coul: k % 2 ? coul : '#fff2b0' });
    }
  }

  function secouer() {
    const el = $('ecran-jeu');
    el.classList.remove('secoue'); void el.offsetWidth; el.classList.add('secoue');
  }

  // ---------------------------------------------------------------------
  //  Question en images (joueur de l'appareil)
  // ---------------------------------------------------------------------

  let qEtat = null;           // { qn, q, phase: 'scene' | 'reponse' | 'retour', ecoule, choisi }

  function titreQuestion(q, phase) {
    if (phase === 'scene') return tr('q.regarde.' + q.y);
    return tr('q.question.' + q.y);
  }

  function tuile(q, id, bouton) {
    const el = document.createElement(bouton ? 'button' : 'div');
    el.className = 'tuile';
    if (bouton) el.type = 'button';
    const cv = document.createElement('canvas'); cv.width = 200; cv.height = 200;
    dessinerImage(cv, q.y, id);
    el.appendChild(cv);
    return el;
  }

  function ouvrirQuestion(e) {
    const q = e.q;
    qEtat = { qn: e.qn, q: q, phase: 'scene', ecoule: 0, choisi: -1 };
    $('q-titre').textContent = titreQuestion(q, 'scene');
    const scene = $('q-scene');
    scene.textContent = '';
    scene.className = 'q-grille' + (q.k === 4 ? ' c2' : '') + (e.cfg.brume ? ' brume-scene' : '');
    q.s.forEach((id) => scene.appendChild(tuile(q, id, false)));
    $('q-options').textContent = '';
    $('q-temps').classList.remove('cache');
    $('q-temps').firstElementChild.style.transform = 'scaleX(1)';
    $('q-pret').hidden = false;
    $('q-aide').textContent = tr(e.c.charAt(e.cible) === 'x' ? 'q.aideDouble' : 'q.aideScene');
    ouvrirVoile('voile-q');
    sons.choix();
  }

  function montrerReponses() {
    if (!qEtat || qEtat.phase !== 'scene') return;
    const q = qEtat.q;
    qEtat.phase = 'reponse';
    $('q-titre').textContent = titreQuestion(q, 'reponse');
    $('q-temps').classList.add('cache');
    $('q-pret').hidden = true;
    const scene = $('q-scene'), opts = $('q-options');
    scene.textContent = ''; opts.textContent = '';
    scene.classList.remove('brume-scene');
    const choisir = (k, el) => repondre(k, el);
    if (q.y === 'panneau' || q.y === 'passant') {
      q.v.forEach((id) => scene.appendChild(tuile(q, id, false)));
      opts.className = 'q-options' + (q.o.length === 3 ? ' c3' : '');
      q.o.forEach((id, k) => {
        const b = tuile(q, id, true);
        b.setAttribute('aria-label', tr('q.reponseAria', { n: k + 1 }));
        b.addEventListener('click', () => choisir(k, b));
        opts.appendChild(b);
      });
      $('q-aide').textContent = tr('q.aideManque');
    } else {
      q.v.forEach((id, k) => {
        const b = tuile(q, id, true);
        b.setAttribute('aria-label', tr('q.reponseAria', { n: k + 1 }));
        b.addEventListener('click', () => choisir(k, b));
        scene.appendChild(b);
      });
      $('q-aide').textContent = tr(q.y === 'vitrine' ? 'q.aideVitrine' : 'q.aideIntrus');
    }
    const premier = document.querySelector('#voile-q button.tuile');
    if (premier) try { premier.focus({ preventScroll: true }); } catch (e) { /* rien */ }
    sons.tour();
  }

  function repondre(k, el) {
    if (!qEtat || qEtat.phase !== 'reponse' || enPause) return;
    if (!partie || !partie.monTour() || !vue || vue.ph !== 'question' || vue.qn !== qEtat.qn) return;
    audio();
    // La réponse peut revenir tout de suite (solo) : la fenêtre passe d'abord en « retour ».
    const etat = qEtat;
    etat.phase = 'retour';
    etat.choisi = k;
    if (!partie.jouer({ r: k })) { if (qEtat === etat) etat.phase = 'reponse'; return; }
    const bon = k === etat.q.b;
    document.querySelectorAll('#voile-q button.tuile').forEach((b, i) => { b.disabled = true; if (i === etat.q.b) b.classList.add('bon'); });
    if (!bon && el) el.classList.add('mauvais');
    $('q-titre').textContent = tr(bon ? 'q.bravo' : 'q.rate');
    $('q-aide').textContent = bon ? tr('q.bravoAide') : tr('q.rateAide');
    const j = jeton, qn = etat.qn;
    setTimeout(() => { if (j === jeton && qEtat && qEtat.qn === qn && qEtat.phase === 'retour') fermerQuestion(); }, bon ? 900 : 1500);
  }

  function fermerQuestion() {
    qEtat = null;
    fermerVoile('voile-q');
    try { $('plateau').focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }

  // Ouvre ou ferme la fenêtre de question selon l'état affiché.
  function verifierQuestion() {
    const e = vue;
    const pourMoi = !!(e && partie && partie.phase === 'jeu' && !e.fini && e.ph === 'question' && e.tour === moiSiege() && moiSiege() >= 0);
    if (pourMoi && !enPause) {
      if (!qEtat || qEtat.qn !== e.qn) { if (partie.monTour()) ouvrirQuestion(e); }
    } else if (qEtat && qEtat.phase !== 'retour') fermerQuestion();
  }

  function avancerQuestion(dt) {
    if (!qEtat || qEtat.phase !== 'scene') return;
    const avant = qEtat.ecoule;
    qEtat.ecoule += dt * 1000;
    const k = Math.max(0, 1 - qEtat.ecoule / qEtat.q.t);
    $('q-temps').firstElementChild.style.transform = 'scaleX(' + k.toFixed(3) + ')';
    const sec = Math.ceil((qEtat.q.t - qEtat.ecoule) / 1000), secAvant = Math.ceil((qEtat.q.t - avant) / 1000);
    if (sec !== secAvant && sec > 0) sons.tic();
    if (qEtat.ecoule >= qEtat.q.t) montrerReponses();
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche'), { roue: true, centre: true }); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? copie(partie.etat) : null;
    anims = { allume: {}, eteint: {}, ombres: [] };
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente'), { roue: true, centre: true }); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'), { roue: true, centre: true });
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    if (qEtat) fermerQuestion();
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        tete(c, s, 100, false);
        if (info.chef) couronne(c, 50, 22, 22);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place', { couleur: tr('coul.' + s), qui: nom }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { qui: nomQui(partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = copie(partie.etat);
    anims = { allume: {}, eteint: {}, ombres: [] };
    particules.length = 0;
    debutTour = Date.now();
    brumeDebut = performance.now();
    dernierTic = -1;
    curseur = -1;
    if (qEtat) fermerQuestion();
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    if (vue.tour === moiSiege()) sons.tour();
  }

  // Une action vient d'être jouée : on anime ce qu'elle a provoqué (liste ev des règles).
  function surAction(ev) {
    const t = performance.now(), moi = moiSiege();
    const avantTour = ev.avant.tour;
    vue = copie(ev.apres);
    debutTour = Date.now();
    dernierTic = -1;
    const qui = nomQui(ev.siege);
    let sonAllume = false, cheminO = {};
    (vue.ev || []).forEach((x) => {
      switch (x.k) {
        case 'choix':
          if (!ev.moi) { bandeau(tr(vue.c.charAt(x.i) === 'x' ? 'autre.choixDouble' : 'autre.choix', { qui: qui }), { roue: true }); sons.choix(); }
          break;
        case 'allume': anims.allume[x.i] = t; jaillir(x.i, COUL[x.s], 10); sonAllume = true; break;
        case 'bon':
          sons.bon();
          if (!ev.moi) bandeau(tr('autre.bon', { qui: qui }), { duree: 1400 });
          break;
        case 'rate':
          sons.rate();
          if (!ev.moi) bandeau(tr(x.double ? 'autre.rateDouble' : 'autre.rate', { qui: qui }), { duree: 1800 });
          else if (x.perdus > 0) toast(tr('toast.perdus', { n: x.perdus }));
          break;
        case 'perdu': anims.eteint[x.i] = t; break;
        case 'eteint': anims.eteint[x.i] = t; break;
        case 'grille': anims.eteint[x.i] = t; sons.grille(); if (x.s === moi) toast(tr('toast.grille')); break;
        case 'vol': sons.grille(); if (vue.l[x.i] === -1 && ev.avant.l[x.i] === moi) toast(tr('toast.vol')); break;
        case 'ombre':
        case 'repli':
          if (!cheminO[x.o]) cheminO[x.o] = [];
          cheminO[x.o].push({ de: x.de, a: x.a, saut: x.k === 'repli' });
          if (x.k === 'ombre') sons.ombre();
          break;
        case 'prise':
          sons.prise(); secouer();
          toast(x.s === moi ? tr('toast.priseToi', { n: vue.fl[x.s] }) : tr('toast.prise', { qui: nomQui(x.s) }), 3000);
          break;
        case 'elimine':
          toast(x.s === moi ? tr('toast.elimineToi') : tr('toast.elimine', { qui: nomQui(x.s) }), 3200);
          // Solo : ton veilleur est éteint, la nuit est perdue tout de suite (pas d'attente des robots).
          if (x.s === moi && session === 'solo' && !vue.fini) {
            const j = ++jeton;
            enPartie = false;
            setTimeout(() => { if (j === jeton && partie && session === 'solo') { partie.pause(true); if (qEtat) fermerQuestion(); afficherFin(); } }, 1800);
          }
          break;
        case 'cle': sons.cle(); jaillir(x.i, '#ff9a4a', 16); if (x.s === moi) toast(tr('toast.cle')); break;
        case 'fusible': sons.fusible(); if (x.s === moi) toast(tr('toast.fusible')); break;
        case 'demasque': sons.demasque(); jaillir(x.i, '#bfe9ff', 20); toast(x.s === moi ? tr('toast.demasqueToi') : tr('toast.demasque', { qui: qui })); break;
        case 'garde':
          if (x.n > 0) { sons.garde(); if (ev.moi) toast(tr(x.auto ? 'toast.gardeAuto' : 'toast.garde', { n: x.n })); else bandeau(tr('autre.garde', { qui: qui }), { duree: 1200 }); }
          break;
        case 'passe': if (!ev.moi) bandeau(tr('autre.passe', { qui: qui }), { duree: 1200 }); break;
        case 'ronde':
          if (!vue.fini) toast(tr('toast.ronde', { n: x.n, total: vue.cfg.rondes }), 1800);
          break;
        default: break;
      }
    });
    if (sonAllume) sons.allume();
    for (const o in cheminO) anims.ombres[o] = { t: t + 250, pas: cheminO[o] };
    const pts = $('place-' + ev.siege);
    if (pts && (vue.ev || []).some((x) => x.k === 'bon')) { pts.classList.remove('bond'); void pts.offsetWidth; pts.classList.add('bond'); }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto', { qui: qui }));
    // Début de mon tour : son, et en brouillard la ville se montre un instant.
    if (!vue.fini && vue.tour === moi && vue.ph === 'choix' && (avantTour !== moi || ev.avant.ph === 'question' || ev.avant.serie !== vue.serie)) {
      if (avantTour !== moi) { sons.tour(); brumeDebut = t; }
    }
    if (ev.moi && qEtat && vue.qn !== qEtat.qn && qEtat.phase !== 'retour') fermerQuestion();
    if (ev.moi && ev.auto && qEtat) fermerQuestion();
    const cs = ciblesVisibles();
    if (curseur >= 0 && cs.indexOf(curseur) < 0) curseur = cs.length ? plusProche(curseur, cs) : -1;
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (qEtat) fermerQuestion();
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1300);
  }

  // Clés gagnées pendant la manche : ajoutées à la collection (lanternes).
  function compterCles(e, moi) {
    if (moi < 0 || !e.cl) return { n: 0, nouvelles: [] };
    const n = Math.max(0, e.cl[moi] || 0);
    const avant = prog.cles;
    prog.cles += n;
    const nouvelles = LANTERNES.filter((l) => l.cles > avant && l.cles <= prog.cles);
    return { n: n, nouvelles: nouvelles };
  }

  function texteCles(k) {
    if (!k.n) return '';
    let s = tr('fin.cles', { n: k.n, total: prog.cles });
    if (k.nouvelles.length) s += ' ' + tr('fin.lanterne', { nom: tr('lanterne.' + k.nouvelles[k.nouvelles.length - 1].id) });
    return s;
  }

  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, res = R.fin(e);
    const gagne = moi >= 0 && res && res.classement[0] === moi;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    const k = compterCles(e, moi);
    if (k.n) { sauverOptions(); toast(texteCles(k), 3500); }
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(pts, gagne, cfg) {
    if (!gagne) return 0;
    return pts >= cfg.s3 ? 3 : pts >= cfg.s2 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    let res = R.fin(e);
    if (!res) {
      // Nuit pas finie (veilleur éteint en solo) : classement provisoire, éteints à la fin.
      const sc = [0, 1, 2, 3].map((s) => O.points(e, s));
      const cl = [0, 1, 2, 3].sort((a, b) => ((e.fl[b] > 0) - (e.fl[a] > 0)) || (sc[b] - sc[a]) || (a - b));
      res = { classement: cl, scores: sc };
    }
    res.classement.forEach((s, k) => {
      const l = document.createElement('div');
      const eteint = e.fl[s] <= 0;
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '') + (eteint ? ' eteint' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; tete(cv.getContext('2d'), s, 60, eteint);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = (role === 'joueur' && info.nom ? info.nom : tr('coul.' + s) + ' · ' + nomPlace(info, role)) + (eteint ? ' · ' + tr('fin.eteint') : '');
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.pointsCourt', { n: res.scores[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels(), res = R.fin(e);
    const pts = moi >= 0 ? O.points(e, moi) : 0;
    const gagne = moi >= 0 && !!res && res.classement[0] === moi;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.points', { n: pts, lampes: O.lampes(e, moi) }) : '';
    const k = compterCles(e, moi);
    $('fin-cles').textContent = texteCles(k);
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(pts, gagne, e.cfg);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (toutes les nuits gagnées, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else sauver(niveau, pts);
      sauverOptions();
      const seulDebout = res.classement.filter((s) => e.fl[s] > 0).length === 1;
      $('fin-titre').textContent = gagne ? tr(seulDebout ? 'fin.dernier' : 'fin.gagne') : tr(e.fl[moi] <= 0 ? 'fin.eteintToi' : 'fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let x = 0; x < 3; x++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (x < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + x * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      let deb = '';
      if (gagne && niveau === NIVEAUX.length) deb = tr('fin.toutFini');
      else if (debloque) deb = tr('fin.debloque', { n: niveau + 1 });
      else if (gagne && etoiles < 3) deb = tr('fin.objectif', { n: etoiles === 1 ? e.cfg.s2 : e.cfg.s3 });
      $('fin-debloque').textContent = deb;
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      if (k.n) sauverOptions();
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
  }

  // Confettis de lumière à la victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 80; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 60, vy: 90 + Math.random() * 140, k: 3 + Math.random() * 5, coul: i % 5 === 4 ? '#fff6c0' : COUL[i % 4] });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => { b.x += b.vx * dt + Math.sin(t / 300 + b.k) * 0.6; b.y += b.vy * dt; halo(c, b.x, b.y, b.k * 3, b.coul + '66'); etincelle(c, b.x, b.y, b.k, b.coul); });
      if (t - debut < 2800) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux, lanternes
  // ---------------------------------------------------------------------

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    qEtat = null;
    bandeau('');
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon', 'voile-q'].forEach(fermerVoile);
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  // Ville d'un niveau, sans partie (affichée pendant le tutoriel).
  function apercu(n) {
    const nv = NIVEAUX[n - 1], e = O.preparer(nv, PLACES);
    e.n = n - 1;
    e.cfg = { types: nv.types, k: nv.k, t: nv.t, rondes: nv.rondes, nuit: !!nv.nuit, brume: false, s2: nv.s2, s3: nv.s3 };
    e.v = e.vh.slice(); e.fl = [nv.fl, nv.fl, nv.fl, nv.fl]; e.bo = [0, 0, 0, 0]; e.cl = [0, 0, 0, 0];
    e.vh.forEach((i, s) => { e.l[i] = s; });
    e.om = e.od.slice(); e.prov = []; e.tour = -1; e.ronde = 1; e.ph = 'choix'; e.serie = 0; e.fini = false;
    return e;
  }

  // Parcours solo : nuit n contre 3 robots (force croissante, donnée par la ville).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    if (qEtat) fermerQuestion();
    vue = apercu(niveau);
    anims = { allume: {}, eteint: {}, ombres: [] };
    particules.length = 0;
    afficherEcran('jeu');
    const tutos = [NIVEAUX[niveau - 1].tuto].filter((x) => x && prog.tutos.indexOf(x) < 0);
    if (niveau === 1 && prog.tutos.indexOf('base') < 0) tutos.unshift('base');
    const suite = [...new Set(tutos)];
    if (suite.length) {
      attenteTuto = true;
      const enchainer = () => {
        const k = suite.shift();
        if (!k) { attenteTuto = false; lancerNiveau(); return; }
        montrerTuto(k, () => { if (prog.tutos.indexOf(k) < 0) prog.tutos.push(k); enchainer(); });
      };
      enchainer();
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    brumeDebut = performance.now();
    if (partie) partie.pause(false);
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const grille = $('grille-niveaux');
    grille.textContent = '';
    NIVEAUX.forEach((_, i) => {
      const n = i + 1, ouvert = n <= prog.debloque;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
      b.append(num, et);
      b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
      else b.disabled = true;
      grille.appendChild(b);
    });
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
  }

  function dessinerLanterne(cv, L, ouverte) {
    const c = cv.getContext('2d'), w = cv.width;
    c.clearRect(0, 0, w, w);
    c.fillStyle = '#0b1024'; rond(c, w / 2, w / 2, w * 0.48); c.fill();
    if (ouverte) halo(c, w / 2, w * 0.52, w * 0.45, L.flamme + 'aa');
    c.strokeStyle = '#59617f'; c.lineWidth = w * 0.04; c.beginPath(); c.arc(w / 2, w * 0.24, w * 0.1, Math.PI, 0); c.stroke();
    c.fillStyle = '#2b2f40'; rr(c, w * 0.34, w * 0.3, w * 0.32, w * 0.44, w * 0.05); c.fill();
    c.fillStyle = ouverte ? L.flamme : '#3a4060'; rr(c, w * 0.39, w * 0.36, w * 0.22, w * 0.32, w * 0.03); c.fill();
    if (ouverte) { c.fillStyle = L.coeur; ell(c, w / 2, w * 0.54, w * 0.05, w * 0.09); c.fill(); }
    if (ouverte && L.id === 'luciole') for (let i = 0; i < 4; i++) { c.fillStyle = L.flamme; rond(c, w * (0.22 + i * 0.18), w * (0.2 + (i % 2) * 0.6), w * 0.03); c.fill(); }
    if (ouverte && L.id === 'etoile') etincelle(c, w * 0.72, w * 0.26, w * 0.09, '#fff');
    if (!ouverte) cle(c, w / 2, w * 0.84, w * 0.12, 0);
  }

  function ouvrirLanternes() {
    const grille = $('grille-lanternes');
    grille.textContent = '';
    LANTERNES.forEach((L) => {
      const ouverte = prog.cles >= L.cles;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'lant' + (prog.lanterne === L.id ? ' choisie' : '') + (ouverte ? '' : ' fermee');
      const cv = document.createElement('canvas'); cv.width = 168; cv.height = 168;
      dessinerLanterne(cv, L, ouverte);
      const nom = document.createElement('span'); nom.textContent = tr('lanterne.' + L.id);
      const info = document.createElement('small');

  function carrefourSous(px, py) {
    const cs = ciblesVisibles();
    if (!vue || !geo || !cs.length) return -1;
    let best = -1, bd = Infinity;
    cs.forEach((i) => {
      const d = Math.hypot(px - posX(geo, vue, i), py - (posY(geo, vue, i) - geo.s * 0.12));
      if (d < bd) { bd = d; best = i; }

    return bd <= Math.max(28, geo.s * 0.5) ? best : -1;
  }

  function plusProche(depuis, cs) {
    if (!vue || !cs.length) return -1;
    const ref = depuis >= 0 ? depuis : vue.v[moiSiege()];
    const rx = ref >= 0 ? ref % vue.W : 0, ry = ref >= 0 ? Math.floor(ref / vue.W) : 0;
    let best = cs[0], bd = Infinity;
    cs.forEach((i) => { const d = Math.hypot(i % vue.W - rx, Math.floor(i / vue.W) - ry); if (d < bd) { bd = d; best = i; } });
    return best;
  }

  function deplacerCurseur(dx, dy) {
    const cs = ciblesVisibles();
    if (!cs.length) return;
    if (curseur < 0 || cs.indexOf(curseur) < 0) { curseur = plusProche(-1, cs); sons.clic(); return; }
    const cx = curseur % vue.W, cy = Math.floor(curseur / vue.W);
    let best = -1, bd = Infinity;
    cs.forEach((i) => {
      if (i === curseur) return;
      const vx = i % vue.W - cx, vy = Math.floor(i / vue.W) - cy;
      const avance = vx * dx + vy * dy;
      if (avance <= 0) return;
      const score = avance + Math.abs(vx * dy - vy * dx) * 2.2;
      if (score < bd) { bd = score; best = i; }
    });
    if (best >= 0) { curseur = best; sons.clic(); }
  }

      if (!clavier) { clavier = true; const cs = ciblesVisibles(); if (curseur < 0 || cs.indexOf(curseur) < 0) { curseur = plusProche(-1, cs); return; } }
      deplacerCurseur(dirs[ev.code][0], dirs[ev.code][1]);
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      const cs = ciblesVisibles();
      if (!clavier || curseur < 0 || cs.indexOf(curseur) < 0) { clavier = true; curseur = plusProche(curseur, cs); return; }
      choisir(curseur);
    } else if (ev.code === 'KeyG') {
      ev.preventDefault(); audio(); garder();
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-lanternes').addEventListener('click', () => { audio(); sons.clic(); ouvrirLanternes(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('lant-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-garder').addEventListener('click', () => { audio(); garder(); });
  $('btn-passer').addEventListener('click', () => { audio(); garder(); });
  $('q-pret').addEventListener('click', () => { audio(); sons.clic(); montrerReponses(); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? O.points(vue, partie.siege) : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(performance.now()); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
