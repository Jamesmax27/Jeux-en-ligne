  }

  // ====================================================================
  // 11. Œufs qui roulent et petit ptérodactyle
  // ====================================================================
  function deplacer(o, slot, duree) {
    const de = S.slots[o.slot], vers = S.slots[slot];
    o.slot = slot;
    placer(o.el, slot);
    const tours = (vers.x > de.x ? 1 : -1) * 360;
    animer(o.el, [
      { left: de.x + '%', top: de.y + '%', transform: 'translate(-50%,-50%) rotate(0deg)' },
      { left: vers.x + '%', top: vers.y + '%', transform: `translate(-50%,-50%) rotate(${tours}deg)` }
    ], { duration: duree, easing: 'ease-in-out' });
  }
  // Tous les œufs libres changent de place
  const mobiles = () => vivants().filter((o) => !o.cache && !o.reserve);
  function roulerTous(fini) {
    const libres = mobiles();
    if (libres.length < 2) { if (fini) fini(); return; }
    const places = libres.map((o) => o.slot);
    let nouv = melanger(places);
    if (nouv.every((s, k) => s === places[k])) nouv = places.slice(1).concat(places[0]);
    libres.forEach((o, k) => deplacer(o, nouv[k], 700));
    jouer('roule');
    apres(720, () => { if (fini) fini(); });
  }
  // Deux œufs échangent leur place, régulièrement
  function programmerRoulement() {
    annuler(S.minRoule);
    S.minRoule = apres(S.cfg.periode, () => {
      if (S.verrou || S.fin) { programmerRoulement(); return; }
      const libres = melanger(mobiles());
      if (libres.length >= 2) {
        const [a, b] = libres;
        const sa = a.slot, sb = b.slot;
        deplacer(a, sb, 650); deplacer(b, sa, 650);
        jouer('roule');
      }
      programmerRoulement();
    });
  }
  function programmerPtero() {
    annuler(S.minPtero);
    if (S.ptero) return;
    // premier passage assez tôt pour qu'on le voie dans chaque niveau
    const delai = S.pteroVu ? S.cfg.ptero * (0.8 + Math.random() * 0.4) : 2600;
    S.minPtero = apres(delai, lancerPtero);
  }
  function lancerPtero() {
    if (S.fin || S.ptero) return;
    if (S.verrou) { S.minPtero = apres(600, lancerPtero); return; }
    const libres = mobiles();
    if (libres.length < 2) { programmerPtero(); return; }
    const surCible = libres.filter((o) => o.lettre === S.cible);
    const autres = libres.filter((o) => o.lettre !== S.cible);
    const o = (surCible.length && Math.random() < 0.45) ? surCible[0] : choisirUn(autres.length ? autres : libres);
    const p = document.createElement('div');
    p.className = 'ptero';
    p.innerHTML = pteroSVG();
    const larg = S.taille * 1.6;
    p.style.width = larg + 'px'; p.style.height = (larg * 0.75) + 'px';
    const pos = S.slots[o.slot];
    p.style.left = pos.x + '%'; p.style.top = (pos.y - 6) + '%';
    nidEl.appendChild(p);
    S.ptero = { el: p, oeuf: o };
    S.pteroVu = true;
    o.reserve = true; // l'œuf visé ne roule plus pendant le vol
    jouer('ailes');
    animer(p, [
      { transform: 'translate(-50%,-50%) translate(260px,-320px) scale(.6)' },
      { transform: 'translate(-50%,-50%) translate(0,0) scale(1)' }
    ], { duration: 900, easing: 'ease-out' }, () => {
      if (!S.ptero || S.ptero.el !== p) return;
      if (o.eclos) { chasserPtero(false); return; }
      p.classList.add('pose');
      o.cache = true; o.el.classList.add('cache');
      o.el.setAttribute('aria-label', tr('aria.oeufCache'));
      apres(2300, () => chasserPtero(false));
    });
  }
  function chasserPtero(tout) {
    const pt = S.ptero;
    if (!pt) return;
    S.ptero = null;
    const o = pt.oeuf;
    if (o && o.el) {
      o.cache = false; o.reserve = false; o.el.classList.remove('cache');
      o.el.setAttribute('aria-label', tr('aria.oeuf', { lettre: lettreAff(o.lettre, S.cfg.maj === 'O') }));
    }
    if (tout) { pt.el.remove(); return; }
    pt.el.classList.remove('pose');
    jouer('ailes');
    animer(pt.el, [
      { transform: 'translate(-50%,-50%) translate(0,0) scale(1)' },
      { transform: 'translate(-50%,-50%) translate(-300px,-340px) scale(.6)' }
    ], { duration: 900, easing: 'ease-in', fill: 'forwards' }, () => pt.el.remove());
    if (!S.fin && S.cfg.ptero) programmerPtero();
  }

  // ====================================================================
  // 12. Affichage de la barre et des points
  // ====================================================================
  function majVies() {
    const v = $('vies');
    v.innerHTML = '';
    for (let k = 0; k < S.cfg.vies; k++) {
      v.insertAdjacentHTML('beforeend', ICONES.feuille);
      if (k >= S.vies) v.lastChild.classList.add('perdue');
    }
    v.setAttribute('aria-label', tr('aria.vies', { n: S.vies }));
  }
  function majPoints() {
    const p = $('points');
    p.innerHTML = '';
    for (let k = 0; k < S.total; k++) {
      const i = document.createElement('i');
      if (S.pointsEtat[k]) i.className = S.pointsEtat[k];
      p.appendChild(i);
    }
  }

  // ====================================================================
  // 13. Fins de niveau
  // ====================================================================
  function calculEtoiles() {
    const ratio = S.total ? S.premierCoup / S.total : 0;
    return ratio >= 0.999 ? 3 : ratio >= 0.6 ? 2 : 1;
  }

  function victoire() {
    if (S.fin) return;
    S.fin = true; S.verrou = true;
    chasserPtero(true);
    minuteurs = [];
    const i = S.n;
    const etoiles = calculEtoiles();
    const bonus = S.vies * 30;
    const score = S.score + bonus;
    const ancienRecord = P.records[i];
    const nouveauRecord = score > ancienRecord;
    const premiereFois = P.etoiles[i] === 0;
    const coinAvant = coinFini(S.cfg.coin);
    P.etoiles[i] = Math.max(P.etoiles[i], etoiles);
    P.records[i] = Math.max(P.records[i], score);
    const nidDebloque = !coinAvant && coinFini(S.cfg.coin);
    if (S.cfg.tuto) P.tutos[S.cfg.tuto] = true;
    P.niveau = Math.max(P.niveau, Math.min(NB, i + 2));
    sauver(Math.min(NB, i + 2));
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
    if (tousGagnes()) {
      if (window.FMG) window.FMG.reportComplete({ stars: etoilesTotal(), maxStars: NIVEAUX.length * 3 });
    }
    jouer('victoire');
    confettis();

    const c = $('fin-carte');
    c.innerHTML = '';
    const h = document.createElement('h2'); h.textContent = tr('fin.victoire'); c.appendChild(h);
    const et = document.createElement('div'); et.className = 'etoiles-fin';
    et.setAttribute('role', 'img'); et.setAttribute('aria-label', tr('aria.etoiles', { n: etoiles }));
    et.innerHTML = [0, 1, 2].map(() => etoileSVG(true)).join('');
    c.appendChild(et);
    const ajouter = (texte, classe) => { const p = document.createElement('p'); p.textContent = texte; if (classe) p.className = classe; c.appendChild(p); return p; };
    ajouter(tr('fin.premierCoup', { n: S.premierCoup, total: S.total }));
    const pScore = ajouter(tr('fin.score', { n: 0 }), 'gros-score');
    ajouter(nouveauRecord ? tr('fin.nouveauRecord') : tr('fin.record', { n: ancienRecord }), nouveauRecord ? 'nouveau' : 'record');
    if (premiereFois) {
      const b = bebeAlbum(i);
      const d = document.createElement('div'); d.className = 'fin-bebe rebond';
      d.innerHTML = dinoSVG(b.esp, b.coul, b.motif, false);
      c.appendChild(d);
      ajouter(tr('fin.bebe'));
    }
    if (nidDebloque) ajouter(tr('fin.nid', { nom: tr('nid.' + (S.cfg.coin + 1)) }), 'nouveau');
    const boutons = document.createElement('div'); boutons.className = 'boutons';
    if (i + 1 < NB) boutons.appendChild(bouton(tr('btn.suivant'), 'btn gros', () => lancerNiveau(i + 1)));
    else boutons.appendChild(bouton(tr('btn.bilan'), 'btn gros', () => { quitterJeu(); dessinerBilan(); }));
    boutons.appendChild(bouton(tr('btn.rejouer'), 'btn', () => lancerNiveau(i)));
    boutons.appendChild(bouton(tr('btn.niveaux'), 'btn second', () => { quitterJeu(); dessinerNiveaux(); }));
    c.appendChild(boutons);
    ouvrirVoile('f-fin');
    // étoiles une à une, score qui défile
    et.querySelectorAll('svg').forEach((s, k) => {
      if (k < etoiles) setTimeout(() => { s.classList.add('allumee'); jouer('etoile', k); }, 350 + k * 380);
      else s.innerHTML = etoileSVG(false).replace(/<svg[^>]*>|<\/svg>/g, '');
    });
    defiler(pScore, score);
  }

  function defaite() {
    if (S.fin) return;
    S.fin = true; S.verrou = true;
    chasserPtero(true);
    minuteurs = [];
    const i = S.n;
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: i + 1 });
    jouer('defaite');
    const c = $('fin-carte');
    c.innerHTML = '';
    const h = document.createElement('h2'); h.textContent = tr('fin.defaite'); c.appendChild(h);
    const d = document.createElement('div'); d.className = 'fin-bebe penche';
    d.innerHTML = dinoSVG(S.cfg.coin, COULEURS[COULEUR_MAMAN[S.cfg.coin]], 0, true);
    c.appendChild(d);
    const ajouter = (texte, classe) => { const p = document.createElement('p'); p.textContent = texte; if (classe) p.className = classe; c.appendChild(p); };
    ajouter(tr('fin.defaiteTexte'));
    ajouter(tr('fin.bebesNes', { n: S.faits, total: S.total }));
    ajouter(tr('fin.score', { n: S.score }), 'gros-score');
    ajouter(tr('fin.record', { n: P.records[i] }), 'record');
    const boutons = document.createElement('div'); boutons.className = 'boutons';
    boutons.appendChild(bouton(tr('btn.reessayer'), 'btn gros', () => lancerNiveau(i)));
    boutons.appendChild(bouton(tr('btn.niveaux'), 'btn second', () => { quitterJeu(); dessinerNiveaux(); }));
    c.appendChild(boutons);
    ouvrirVoile('f-fin');
  }

  function bouton(texte, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = classe; b.textContent = texte;
    b.addEventListener('click', () => { jouer('clic'); action(); });
    return b;
  }
  function defiler(el, cible) {
    const debut = performance.now();
    const pas = (t) => {
      const k = Math.min(1, (t - debut) / 900);
      el.textContent = tr('fin.score', { n: Math.round(cible * k) });
      if (k < 1) requestAnimationFrame(pas);
    };
    requestAnimationFrame(pas);
  }
  function confettis() {
    const app = $('app');
    const coul = ['#ffd84d', '#ff8fb8', '#8fe3ff', '#a8e07a', '#ffb36b', '#c9a2ff'];
    for (let k = 0; k < 36; k++) {
      const e = document.createElement('div');
      e.className = 'confetti';
      e.style.left = (Math.random() * 100) + '%';
      e.style.background = coul[k % coul.length];
      app.appendChild(e);
      const h = app.clientHeight + 40;
      try {
        const a = e.animate([{ transform: 'translateY(0) rotate(0)' }, { transform: `translate(${(Math.random() - 0.5) * 120}px, ${h}px) rotate(${Math.random() * 720}deg)` }], { duration: 1600 + Math.random() * 1200, delay: Math.random() * 400, easing: 'ease-in', fill: 'forwards' });
        a.onfinish = () => e.remove();
      } catch (er) { e.remove(); }
    }
  }

  // ====================================================================
  // 14. Pause, voiles, tutoriel
  // ====================================================================
  function ouvrirVoile(id) {
    const v = $(id);
    v.classList.add('ouvert');
    const b = v.querySelector('button');
    if (b) setTimeout(() => b.focus({ preventScroll: true }), 50);
  }
  function fermerVoiles() {
    document.querySelectorAll('.voile').forEach((v) => v.classList.remove('ouvert'));
    arreterMain();
  }
  function mettrePause() {
    if (!S.actif || S.pause || S.fin) return;
    S.pause = true;
    taire();
    figerAnimations();
    ouvrirVoile('f-pause');
  }
  function reprendre() {
    if (!S.pause) return;
    $('f-pause').classList.remove('ouvert');
    S.pause = false;
    relancerAnimations();
    if (S.tuto) $('tuto').classList.add('ouvert');
  }
  function quitterJeu() {
    S.gen++;
    S.actif = false; S.pause = false; S.tuto = false;
    minuteurs = [];
    taire();
    fermerVoiles();
    scene.querySelectorAll('.coureur, .ptero, .morceau, .flottant, .eclat').forEach((e) => e.remove());
  }
  function allerAccueil() { quitterJeu(); montrer('ecran-titre'); $('b-jouer').focus({ preventScroll: true }); }

  // Tutoriel : bulle d'explication + main animée sur le vrai nid
  let mainBoucle = null;
  function arreterMain() {
    if (mainBoucle) { clearTimeout(mainBoucle); mainBoucle = null; }
    const m = $('main'); m.style.display = 'none';
    m.getAnimations && m.getAnimations().forEach((a) => a.cancel());
  }
  function posDans(el) {
    const a = el.getBoundingClientRect(), b = $('ecran-jeu').getBoundingClientRect();
    return { x: a.left + a.width / 2 - b.left, y: a.top + a.height / 2 - b.top };
  }
  // Place finale d'un œuf (même s'il est en train de rouler)
  function posOeuf(o) {
    const n = nidEl.getBoundingClientRect(), b = $('ecran-jeu').getBoundingClientRect();
    const p = S.slots[o.slot];
    return { x: n.left - b.left + n.width * p.x / 100, y: n.top - b.top + n.height * p.y / 100 };
  }
  function ouvrirTuto(type) {
    S.tuto = true;
    $('tuto-texte').textContent = tr('tuto.' + type);
    const demo = $('tuto-demo');
    demo.innerHTML = '';
    if (type === 'jumelles' || type === 'jumelles2' || type === 'maj' || type === 'min') {
      const paires = { jumelles: ['b', 'd'], jumelles2: ['m', 'n'], maj: ['B', 'b'], min: ['g', 'G'] }[type];
      const a = document.createElement('span'); a.textContent = paires[0];
      const f = document.createElement('span'); f.className = 'fleche'; f.textContent = type === 'maj' || type === 'min' ? '→' : '≠';
      const b = document.createElement('span'); b.textContent = paires[1];
      demo.appendChild(a); demo.appendChild(f); demo.appendChild(b);
    }
    ouvrirVoile('tuto');
    const main = $('main');
    main.innerHTML = ICONES.main;
    // Une boucle de démonstration, répétée jusqu'au toucher
    const cycle = () => {
      if (!S.tuto) return;
      if (S.pause) { mainBoucle = setTimeout(cycle, 400); return; }
      if (main.getAnimations) main.getAnimations().forEach((a) => a.cancel());
      const bulle = posDans($('bulle'));
      let cibles = [];
      if (S.cfg.mot) {
        const lettres = normaliser(S.mots[S.motNum]).split('');
        cibles = lettres.map((l) => S.oeufs.find((o) => o.lettre === l)).filter(Boolean);
      } else {
        const bon = vivants().find((o) => o.lettre === S.cible);
        if ((type === 'jumelles' || type === 'jumelles2')) {
          const jum = vivants().find((o) => o.lettre === JUMELLES[S.cible]);
          if (jum) cibles.push(jum);
        }
        if (bon) cibles.push(bon);
      }
      if (type === 'roule' || type === 'roule2') {
        roulerTousDemo();
      }
      if (type === 'ptero') demoPtero();
      main.style.display = 'block';
      const images = [{ left: (bulle.x - 27) + 'px', top: (bulle.y - 10) + 'px', transform: 'scale(1)' }];
      const pts = cibles.map((o) => posOeuf(o));
      pts.forEach((p, k) => {
        images.push({ left: (p.x - 20) + 'px', top: (p.y - 6) + 'px', transform: 'scale(1)' });
        images.push({ left: (p.x - 20) + 'px', top: (p.y - 6) + 'px', transform: 'scale(.8)' });
        images.push({ left: (p.x - 20) + 'px', top: (p.y - 6) + 'px', transform: (cibles.length === 2 && k === 0 && !S.cfg.mot) ? 'scale(1) rotate(-20deg)' : 'scale(1)' });
      });
      const duree = 900 + pts.length * 900;
      const decale = type === 'roule' || type === 'roule2' ? 800 : type === 'ptero' ? 1000 : 0;
      try { main.animate(images, { duration: duree, delay: decale, easing: 'ease-in-out', fill: 'both' }); } catch (e) { /* rien */ }
      mainBoucle = setTimeout(cycle, duree + decale + 700);
    };
    cycle();
  }
  function roulerTousDemo() {
    const libres = vivants();
    if (libres.length < 2) return;
    const places = libres.map((o) => o.slot);
    const nouv = places.slice(1).concat(places[0]);
    libres.forEach((o, k) => deplacer(o, nouv[k], 700));
  }
  function demoPtero() {
    const libres = vivants().filter((o) => o.lettre !== S.cible);
    if (!libres.length) return;
    const o = libres[0];
    const p = document.createElement('div');
    p.className = 'ptero';
    p.innerHTML = pteroSVG();
    const larg = S.taille * 1.6;
    p.style.width = larg + 'px'; p.style.height = (larg * 0.75) + 'px';
    const pos = S.slots[o.slot];
    p.style.left = pos.x + '%'; p.style.top = (pos.y - 6) + '%';
    nidEl.appendChild(p);
    try {
      const a = p.animate([
        { transform: 'translate(-50%,-50%) translate(260px,-320px) scale(.6)' },
        { transform: 'translate(-50%,-50%) translate(0,0) scale(1)', offset: 0.35 },
        { transform: 'translate(-50%,-50%) translate(0,0) scale(1)', offset: 0.7 },
        { transform: 'translate(-50%,-50%) translate(-300px,-340px) scale(.6)' }
      ], { duration: 2600, easing: 'ease-in-out' });
      a.onfinish = () => p.remove();
    } catch (e) { p.remove(); }
  }
  function fermerTuto() {
    if (!S.tuto) return;
    const type = S.cfg.tuto;
    P.tutos[type] = true;
    S.tuto = false;
    arreterMain();
    $('tuto').classList.remove('ouvert');
    nidEl.querySelectorAll('.ptero').forEach((p) => { if (!S.ptero || S.ptero.el !== p) p.remove(); });
    jouer('clic');
    S.verrou = false;
    dire(S.cfg.mot ? S.mots[S.motNum] : S.cibleAff);
    lancerMinuteurs();
  }
  $('tuto').addEventListener('pointerdown', (e) => { e.preventDefault(); fermerTuto(); });

  // ====================================================================
  // 15. Clavier : flèches pour choisir un œuf, Entrée ou Espace pour le toucher
  // ====================================================================
  function majChoix() {
    S.oeufs.forEach((o, k) => o.el.classList.toggle('choisi', k === S.choix && !o.eclos));
  }
  function deplacerChoix(dx, dy) {
    const liste = S.oeufs.filter((o) => !o.eclos);
    if (!liste.length) return;
    const actuel = S.oeufs[S.choix];
    if (!actuel || actuel.eclos) { S.choix = S.oeufs.indexOf(liste[0]); majChoix(); return; }
    const pa = S.slots[actuel.slot];
    let meilleur = null, dist = Infinity;
    liste.forEach((o) => {
      if (o === actuel) return;
      const p = S.slots[o.slot];
      const vx = p.x - pa.x, vy = p.y - pa.y;
      if (dx && Math.sign(vx) !== dx) return;
      if (dy && Math.sign(vy) !== dy) return;
      const d = dx ? Math.abs(vx) + Math.abs(vy) * 2 : Math.abs(vy) + Math.abs(vx) * 0.5;
      if (d < dist) { dist = d; meilleur = o; }
    });
    if (!meilleur && dx) {
      // tour du nid : on repart de l'autre côté
      const tries = liste.slice().sort((a, b) => (S.slots[a.slot].y - S.slots[b.slot].y) * 10 + (S.slots[a.slot].x - S.slots[b.slot].x));
      const k = tries.indexOf(actuel);
      meilleur = tries[(k + dx + tries.length) % tries.length];
    }
    if (meilleur) { S.choix = S.oeufs.indexOf(meilleur); majChoix(); jouer('pop'); }
  }
  document.addEventListener('keydown', (e) => {
    const jeuVisible = $('ecran-jeu').classList.contains('actif');
    if (!jeuVisible) {
      if (e.code === 'Escape' && !$('ecran-titre').classList.contains('actif')) { e.preventDefault(); allerAccueil(); }
      return;
    }
    if (S.tuto && !S.pause) {
      if (e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter') { e.preventDefault(); fermerTuto(); }
      return;
    }
    if (e.code === 'Escape' || e.code === 'KeyP') {
      e.preventDefault();
      if (S.pause) reprendre(); else mettrePause();
      return;
    }
    if (S.pause || S.fin || !S.actif) return;
    if (e.code === 'KeyR') { e.preventDefault(); ecouter(); return; }
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[e.code]) { e.preventDefault(); deplacerChoix(dirs[e.code][0], dirs[e.code][1]); return; }
    if (e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter') {
      e.preventDefault();
      const o = S.oeufs[S.choix];
      if (o && !o.eclos) toucherOeuf(o);
      else deplacerChoix(1, 0);
    }
  });

  function ecouter() {
    contexte();
    if (S.cfg && S.cfg.mot) {
      const lettres = normaliser(S.mots[S.motNum] || '').split('');
      dire(S.motIdx < lettres.length ? lettres[S.motIdx] : S.mots[S.motNum]);
    } else dire(S.cibleAff);
    const c = $('cible');
    animer(c, [{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 400 });
  }

  // ====================================================================
  // 16. Boutons et démarrage
  // ====================================================================
  function commencer() {
    contexte();
    jouer('clic');
    const nouvelle = () => lancerNiveau(0);
    try {
      if (window.JEL_SAVE) {
        window.JEL_SAVE.reprise({
          jeu: JEU,
          onContinuer: (d) => { chargerProgression(); lancerNiveau(Math.max(0, Math.min(NB - 1, (Number(d.niveau) || 1) - 1))); },
          onNouvelle: nouvelle,
          onEffacer: () => { reinitialiser(); nouvelle(); }
        });
        return;
      }
    } catch (e) { /* sans sauvegarde */ }
    nouvelle();
  }
  function reinitialiser() {
    P.etoiles = new Array(NB).fill(0); P.records = new Array(NB).fill(0); P.nid = 0; P.tutos = {}; P.niveau = 1;
  }

  $('b-jouer').addEventListener('click', commencer);
  $('b-niveaux').addEventListener('click', () => { contexte(); jouer('clic'); dessinerNiveaux(); });
  $('b-album').addEventListener('click', () => { contexte(); jouer('clic'); dessinerAlbum(); });
  document.querySelectorAll('.b-retour').forEach((b) => {
    b.innerHTML = ICONES.retour;
    b.addEventListener('click', () => { jouer('clic'); montrer('ecran-titre'); $('b-jouer').focus({ preventScroll: true }); });
  });
  document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', () => { contexte(); basculerSon(); }));
  $('b-pause').innerHTML = ICONES.pause;
  $('b-pause').addEventListener('click', () => { jouer('clic'); mettrePause(); });
  $('b-ecouter').innerHTML = ICONES.ecouter;
  $('b-ecouter').addEventListener('click', ecouter);
  $('b-reprendre').addEventListener('click', () => { jouer('clic'); reprendre(); });
  $('b-recommencer').addEventListener('click', () => { jouer('clic'); lancerNiveau(S.n); });
  $('b-p-accueil').addEventListener('click', () => { jouer('clic'); allerAccueil(); });
  $('f-pause').addEventListener('pointerdown', (e) => { if (e.target === $('f-pause')) reprendre(); });

  // Pause automatique quand l'écran est caché
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && S.actif && !S.fin && !S.pause) mettrePause();
  });

  // Sauvegarde à la fermeture, seulement pendant une partie
  if (window.JEL_SAVE) {
    window.JEL_SAVE.surFermeture(() => {
      if (S.actif && !S.fin && $('ecran-jeu').classList.contains('actif')) sauver(S.n + 1);
    });
  }

  // Taille des œufs recalculée si l'écran change
  window.addEventListener('resize', () => {
    if (!S.actif || !S.slots) return;
    S.taille = tailleOeuf(S.slots.length);
    S.oeufs.forEach((o) => o.el.style.setProperty('--l', S.taille + 'px'));
  });

  chargerProgression();
  majBoutonsSon();
  dessinerTitre();
})();
</script>
