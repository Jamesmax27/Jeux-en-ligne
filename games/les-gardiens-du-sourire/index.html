  // ---------- Dessin : outils de forme ----------
  function rondRect(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
  }
  function etoile4(c, x, y, r, couleur) {
    c.fillStyle = couleur;
    c.beginPath();
    c.moveTo(x, y - r); c.quadraticCurveTo(x, y, x + r, y); c.quadraticCurveTo(x, y, x, y + r);
    c.quadraticCurveTo(x, y, x - r, y); c.quadraticCurveTo(x, y, x, y - r); c.fill();
  }

  // Une dent (haut, bas ou molaire)
  function dessinerDent(c, d, b, t) {
    const sx = d.secousse > 0 ? Math.sin(t * 60) * 2 * d.secousse : 0;
    c.save(); c.translate(sx, 0);
    const pointue = b.cle === 'dragon' && d.rang === 'h';
    const rH = d.rang === 'h' ? 6 : 12, rB = d.rang === 'h' ? (pointue ? d.w * 0.5 : 14) : 6;
    // forme : coins du haut et du bas différents
    c.beginPath();
    c.moveTo(d.x + rH, d.y); c.lineTo(d.x + d.w - rH, d.y); c.quadraticCurveTo(d.x + d.w, d.y, d.x + d.w, d.y + rH);
    c.lineTo(d.x + d.w, d.y + d.h - rB); c.quadraticCurveTo(d.x + d.w, d.y + d.h, d.x + d.w - rB, d.y + d.h);
    c.lineTo(d.x + rB, d.y + d.h); c.quadraticCurveTo(d.x, d.y + d.h, d.x, d.y + d.h - rB);
    c.lineTo(d.x, d.y + rH); c.quadraticCurveTo(d.x, d.y, d.x + rH, d.y); c.closePath();
    const sale = d.ternie ? 1 : d.salete * 0.55;
    const g = c.createLinearGradient(d.x, d.y, d.x + d.w, d.y + d.h);
    g.addColorStop(0, melange('#ffffff', '#f3e08a', sale));
    g.addColorStop(1, melange('#e3edf6', '#d2b85a', sale));
    c.fillStyle = g; c.fill();
    c.lineWidth = 1.6; c.strokeStyle = d.ternie ? '#b39b45' : '#c3d2e2'; c.stroke();
    if (d.rang === 'm') { c.strokeStyle = 'rgba(150,170,195,.6)'; c.lineWidth = 2; c.beginPath(); c.moveTo(d.x + 12, d.y + d.h / 2); c.quadraticCurveTo(d.x + d.w / 2, d.y + d.h / 2 + 8, d.x + d.w - 12, d.y + d.h / 2); c.stroke(); }
    if (!d.ternie) {
      c.fillStyle = 'rgba(255,255,255,.85)';
      c.beginPath(); c.ellipse(d.x + d.w * 0.3, d.y + d.h * (d.rang === 'h' ? 0.55 : 0.3), d.w * 0.09, d.h * 0.18, -0.3, 0, Math.PI * 2); c.fill();
      const scint = Math.sin(t * 2.2 + d.eclat * 3);
      if (scint > 0.75 || d.eclat < 0) {
        const r = d.eclat < 0 ? 12 * (-d.eclat) + 4 : (scint - 0.75) * 30;
        etoile4(c, d.x + d.w * 0.72, d.y + d.h * (d.rang === 'h' ? 0.72 : 0.25), r, '#ffffff');
      }
    } else {
      c.fillStyle = 'rgba(160,130,40,.35)';
      for (let k = 0; k < 3; k++) { c.beginPath(); c.arc(d.x + d.w * (0.3 + k * 0.2), d.y + d.h * (0.4 + (k % 2) * 0.2), 2.5, 0, Math.PI * 2); c.fill(); }
    }
    c.restore();
  }
  function melange(a, b, u) {
    u = borne(u, 0, 1);
    const pa = [1, 3, 5].map((k) => parseInt(a.substr(k, 2), 16)), pb = [1, 3, 5].map((k) => parseInt(b.substr(k, 2), 16));
    return 'rgb(' + pa.map((v, k) => Math.round(v + (pb[k] - v) * u)).join(',') + ')';
  }

  // Un grumeau de sucre rigolo
  const COULEURS_GRUMEAU = { n: ['#ffe3f2', '#f29ac6'], c: ['#ffc78f', '#e58a3a'], gl: ['#bfe9ff', '#4aa8e0'], s: ['#c9f7a6', '#5bb83a'], j: ['#e0cfff', '#9370e0'], r: ['#fff0a0', '#e0b020'] };
  function dessinerGrumeau(c, g, t, regardX, regardY) {
    const col = COULEURS_GRUMEAU[g.jumeau ? 'j' : g.k] || COULEURS_GRUMEAU.n;
    const r = g.r * (0.4 + 0.6 * easeOutBack(g.apparition));
    const sx = g.secousse > 0 ? Math.sin(t * 50) * 3 * g.secousse : 0;
    const x = g.x + sx, y = g.y;
    c.save();
    // corps tremblotant
    c.beginPath();
    for (let k = 0; k <= 12; k++) {
      const a = k / 12 * Math.PI * 2;
      const rr = r * (1 + 0.07 * Math.sin(g.phase * 1.3 + k * 1.9));
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr * 0.94;
      if (k) c.lineTo(px, py); else c.moveTo(px, py);
    }
    c.closePath();
    const grad = c.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.15, x, y, r);
    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.35, col[0]); grad.addColorStop(1, col[1]);
    c.fillStyle = grad; c.fill();
    c.lineWidth = 2; c.strokeStyle = 'rgba(90,30,70,.45)'; c.stroke();
    // grains de sucre
    const grains = ['#ff6fa8', '#6cc6ff', '#ffd23f', '#8de06a'];
    for (let k = 0; k < 5; k++) {
      const a = k * 1.3 + 0.4, rr = r * 0.62;
      c.fillStyle = grains[k % 4];
      c.save(); c.translate(x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.9); c.rotate(a);
      c.fillRect(-2.2, -1, 4.4, 2); c.restore();
    }
    // yeux qui regardent le tube
    const ax = borne((regardX - x) / 200, -1, 1) * r * 0.08, ay = borne((regardY - y) / 200, -1, 1) * r * 0.08;
    const clin = (Math.sin(g.phase * 0.7 + g.r) > 0.97) ? 0.2 : 1;
    [-1, 1].forEach((s) => {
      c.fillStyle = '#ffffff';
      c.beginPath(); c.ellipse(x + s * r * 0.32, y - r * 0.12, r * 0.22, r * 0.26 * clin, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#3a1030';
      c.beginPath(); c.arc(x + s * r * 0.32 + ax, y - r * 0.1 + ay, r * 0.11 * Math.max(clin, 0.4), 0, Math.PI * 2); c.fill();
    });
    // bouche : sourire espiègle, ou « oh » quand on le touche
    c.strokeStyle = '#3a1030'; c.lineWidth = Math.max(1.5, r * 0.1); c.lineCap = 'round';
    c.beginPath();
    if (g.secousse > 0) c.arc(x, y + r * 0.32, r * 0.13, 0, Math.PI * 2);
    else c.arc(x, y + r * 0.18, r * 0.28, 0.15 * Math.PI, 0.85 * Math.PI);
    c.stroke();
    // joues
    c.fillStyle = 'rgba(255,110,150,.35)';
    [-1, 1].forEach((s) => { c.beginPath(); c.ellipse(x + s * r * 0.55, y + r * 0.2, r * 0.14, r * 0.09, 0, 0, Math.PI * 2); c.fill(); });
    // sourcils du gros grumeau
    if (g.k === 'c' && g.hp > 1) {
      c.lineWidth = 2.4;
      [-1, 1].forEach((s) => { c.beginPath(); c.moveTo(x + s * r * 0.15, y - r * 0.42); c.lineTo(x + s * r * 0.48, y - r * 0.5); c.stroke(); });
    }
    // ressorts du sauteur
    if (g.k === 's') {
      c.strokeStyle = '#3f8f2a'; c.lineWidth = 2;
      [-1, 1].forEach((s) => { c.beginPath(); for (let k = 0; k < 4; k++) c.lineTo(x + s * r * 0.4 + (k % 2 ? 3 : -3), y + r * 0.85 + k * 3); c.stroke(); });
    }
    // flèches du glisseur
    if (g.k === 'gl') {
      c.fillStyle = 'rgba(40,110,170,.8)';
      [-1, 1].forEach((s) => { c.beginPath(); c.moveTo(x + s * (r + 9), y); c.lineTo(x + s * (r + 3), y - 4); c.lineTo(x + s * (r + 3), y + 4); c.fill(); });
    }
    // couronne du roi
    if (g.k === 'r') {
      c.fillStyle = '#ffd23f'; c.strokeStyle = '#b07800'; c.lineWidth = 2;
      c.beginPath();
      c.moveTo(x - r * 0.6, y - r * 0.75); c.lineTo(x - r * 0.6, y - r * 1.25); c.lineTo(x - r * 0.3, y - r * 0.95); c.lineTo(x, y - r * 1.35);
      c.lineTo(x + r * 0.3, y - r * 0.95); c.lineTo(x + r * 0.6, y - r * 1.25); c.lineTo(x + r * 0.6, y - r * 0.75); c.closePath();
      c.fill(); c.stroke();
      c.fillStyle = '#ff5c8a'; c.beginPath(); c.arc(x, y - r * 0.95, 2.6, 0, Math.PI * 2); c.fill();
      // cœurs de vie (points)
      for (let k = 0; k < g.hp; k++) { c.fillStyle = '#ff5c8a'; c.beginPath(); c.arc(x - (g.hp - 1) * 5 + k * 10, y + r + 8, 3.5, 0, Math.PI * 2); c.fill(); }
    }
    // coquille de bonbon collant
    if (g.coque) {
      const rc = r + 6;
      c.save();
      c.beginPath(); c.arc(x, y, rc, 0, Math.PI * 2); c.clip();
      c.fillStyle = 'rgba(255,60,110,.42)'; c.fillRect(x - rc, y - rc, rc * 2, rc * 2);
      c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 4;
      for (let k = -3; k <= 3; k++) { c.beginPath(); c.moveTo(x - rc + k * 9, y - rc); c.lineTo(x - rc + k * 9 + rc * 2, y + rc); c.stroke(); }
      c.restore();
      c.strokeStyle = '#d81b60'; c.lineWidth = 2.5; c.beginPath(); c.arc(x, y, rc, 0, Math.PI * 2); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.8)'; c.beginPath(); c.ellipse(x - rc * 0.4, y - rc * 0.5, rc * 0.25, rc * 0.12, -0.6, 0, Math.PI * 2); c.fill();
      // emballage tortillé de chaque côté
      c.fillStyle = '#ff7aa8';
      [-1, 1].forEach((s) => { c.beginPath(); c.moveTo(x + s * rc, y); c.lineTo(x + s * (rc + 9), y - 7); c.lineTo(x + s * (rc + 9), y + 7); c.closePath(); c.fill(); });
    }
    c.restore();
  }
  function easeOutBack(u) { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); }

  function dessinerAnneau(c, g, T) {
    if (!(T > 0) || g.terni || g.saut) return;
    const u = g.t / T;
    c.lineWidth = 3.5; c.lineCap = 'round';
    c.strokeStyle = 'rgba(255,255,255,.25)';
    c.beginPath(); c.arc(g.x, g.y, g.r + (g.coque ? 11 : 5), 0, Math.PI * 2); c.stroke();
    c.strokeStyle = u < 0.5 ? '#7fe07f' : u < 0.8 ? '#ffd23f' : '#ff8a3a';
    c.beginPath(); c.arc(g.x, g.y, g.r + (g.coque ? 11 : 5), -Math.PI / 2, -Math.PI / 2 + u * Math.PI * 2); c.stroke();
  }

  // Le tube de dentifrice (lanceur)
  function couleurBrosse(c, x0, x1) {
    const b = BROSSES[prog.brosse];
    if (b.c !== 'arc') return b.c;
    const g = c.createLinearGradient(x0, 0, x1, 0);
    ['#ff7e7e', '#ffd23f', '#8de06a', '#6cc6ff', '#c49bff'].forEach((col, k) => g.addColorStop(k / 4, col));
    return g;
  }
  function dessinerTube(c, x, y, angle, outil, t) {
    c.save(); c.translate(x, y); c.rotate(-angle + Math.PI / 2);
    // corps du tube (vers le bas), embout vers le haut
    c.fillStyle = couleurBrosse(c, -14, 14);
    c.beginPath(); c.moveTo(-15, -6); c.lineTo(15, -6); c.lineTo(18, 34); c.lineTo(-18, 34); c.closePath(); c.fill();
    c.strokeStyle = BROSSES[prog.brosse].c2; c.lineWidth = 2.5; c.stroke();
    c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(-18, 28, 36, 6);
    c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(-7, 12, 3, 12, 0, 0, Math.PI * 2); c.fill();
    // bande décorative (vague, sans texte)
    c.strokeStyle = '#ffffff'; c.lineWidth = 3; c.beginPath(); c.moveTo(-13, 8); c.quadraticCurveTo(-5, 2, 0, 8); c.quadraticCurveTo(6, 14, 13, 8); c.stroke();
    // embout et bouchon
    c.fillStyle = '#ffffff'; c.strokeStyle = '#9fb3c8'; c.lineWidth = 2;
    rondRect(c, -9, -20, 18, 15, 4); c.fill(); c.stroke();
    // ce qui sort de l'embout
    const gout = GOUTS[prog.gout];
    if (outil === 'bulle') {
      const r = 9 + Math.sin(t * 5) * 0.8;
      c.fillStyle = gout.c; c.globalAlpha = 0.85; c.beginPath(); c.arc(0, -28, r, 0, Math.PI * 2); c.fill(); c.globalAlpha = 1;
      c.strokeStyle = gout.bord; c.lineWidth = 2; c.stroke();
      c.fillStyle = '#fff'; c.beginPath(); c.ellipse(-3, -31, 3.2, 2, -0.5, 0, Math.PI * 2); c.fill();
    } else if (outil === 'eau') {
      c.fillStyle = '#7ccbff'; c.beginPath(); c.moveTo(0, -38); c.quadraticCurveTo(8, -28, 6, -24); c.arc(0, -25, 6, 0, Math.PI); c.quadraticCurveTo(-8, -28, 0, -38); c.fill();
    } else if (outil === 'fil') {
      c.strokeStyle = '#ffffff'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(0, -20); c.quadraticCurveTo(6, -30, 0, -40); c.stroke();
    }
    c.restore();
  }

  function dessinerBrosseGeante(c, x, y, fantome) {
    c.save();
    c.globalAlpha = fantome ? 0.55 : 1;
    // manche
    c.fillStyle = couleurBrosse(c, x - 160, x - 40);
    rondRect(c, x - 170, y - 9, 130, 18, 9); c.fill();
    c.strokeStyle = BROSSES[prog.brosse].c2; c.lineWidth = 2; c.stroke();
    // tête et poils
    c.fillStyle = '#ffffff'; rondRect(c, x - 44, y - 12, 54, 24, 8); c.fill(); c.strokeStyle = '#9fb3c8'; c.stroke();
    c.strokeStyle = '#bfe9ff'; c.lineWidth = 4; c.lineCap = 'round';
    for (let k = 0; k < 6; k++) { c.beginPath(); c.moveTo(x - 38 + k * 9, y - 12); c.lineTo(x - 38 + k * 9, y - 32); c.stroke(); c.beginPath(); c.moveTo(x - 38 + k * 9, y + 12); c.lineTo(x - 38 + k * 9, y + 32); c.stroke(); }
    c.restore();
  }

  function dessinerLangue(c, l, b) {
    c.save();
    c.fillStyle = b.langue; c.strokeStyle = 'rgba(120,20,60,.5)'; c.lineWidth = 2;
    rondRect(c, l.x - l.w / 2, l.y - l.h / 2, l.w, l.h, l.h / 2); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(160,30,80,.45)'; c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(l.x - l.w * 0.3, l.y); c.lineTo(l.x + l.w * 0.3, l.y); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.4)'; c.beginPath(); c.ellipse(l.x - l.w * 0.22, l.y - l.h * 0.22, 12, 4, 0, 0, Math.PI * 2); c.fill();
    c.restore();
  }
  function dessinerNuage(c, n) {
    const r = n.r * (1 + 0.15 * n.gonfle);
    c.save(); c.globalAlpha = 0.9;
    c.fillStyle = '#f2eef8';
    [[0, 0, 1], [-0.7, 0.2, 0.7], [0.7, 0.2, 0.7], [-0.3, -0.4, 0.65], [0.35, -0.35, 0.6]].forEach(([dx, dy, s]) => { c.beginPath(); c.arc(n.x + dx * r, n.y + dy * r, r * s, 0, Math.PI * 2); c.fill(); });
    c.fillStyle = 'rgba(160,150,190,.35)'; c.beginPath(); c.ellipse(n.x, n.y + r * 0.45, r * 0.9, r * 0.25, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(150,140,180,.6)'; c.lineWidth = 2;
    c.beginPath(); c.arc(n.x - r * 0.25, n.y, r * 0.18, Math.PI, Math.PI * 2.6); c.stroke();
    c.restore();
  }
  function dessinerCarie(c, ca, t) {
    const x = ca.sx + ca.dx, y = ca.sy + ca.dy;
    if (ca.reparee) {
      if (ca.eclat > 0) { ca.eclat = Math.max(0, ca.eclat - 0.01); etoile4(c, x, y, 6 + ca.eclat * 12, '#ffffff'); }
      c.fillStyle = 'rgba(190,240,255,.9)'; c.beginPath(); c.arc(x, y, 5, 0, Math.PI * 2); c.fill();
      return;
    }
    c.fillStyle = '#8a5a2b'; c.beginPath(); c.ellipse(x, y, 7, 6, 0.3, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#5e3a17'; c.beginPath(); c.arc(x + 1, y + 1, 3.5, 0, Math.PI * 2); c.fill();
    // cible clignotante : pile au milieu !
    c.strokeStyle = 'rgba(255,230,120,' + (0.5 + 0.4 * Math.sin(t * 5)) + ')'; c.lineWidth = 2;
    c.beginPath(); c.arc(x, y, 11, 0, Math.PI * 2); c.stroke();
  }
  function dessinerMain(c, x, y, appui, e) {
    e = e || 1;
    c.save(); c.translate(x, y); c.scale(e, e);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 3; c.beginPath(); c.arc(0, 0, 12 + appui * 8, 0, Math.PI * 2); c.stroke(); }
    c.fillStyle = '#fff6ee'; c.strokeStyle = '#5a2a48'; c.lineWidth = 2.5;
    rondRect(c, -7, 0, 14, 34, 7); c.fill(); c.stroke();
    rondRect(c, -16, 22, 36, 34, 12); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-6, 30); c.lineTo(-6, 40); c.moveTo(4, 30); c.lineTo(4, 40); c.moveTo(13, 30); c.lineTo(13, 40); c.stroke();
    c.restore();
  }

  // Décor d'une bouche (dans le repère du terrain)
  function dessinerBouche(c, b, t) {
    // fond de la bouche
    const g = c.createRadialGradient(W / 2, H * 0.48, 40, W / 2, H * 0.48, H * 0.62);
    g.addColorStop(0, b.gorge2); g.addColorStop(1, b.gorge);
    c.fillStyle = g; rondRect(c, 0, 0, W, H, 54); c.fill();
    c.save(); rondRect(c, 0, 0, W, H, 54); c.clip();
    // fond de gorge plus sombre, luette
    const gorge = c.createRadialGradient(W / 2, 250, 10, W / 2, 250, 150);
    gorge.addColorStop(0, 'rgba(40,0,20,.45)'); gorge.addColorStop(1, 'rgba(40,0,20,0)');
    c.fillStyle = gorge; c.beginPath(); c.ellipse(W / 2, 260, 150, 120, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = b.langue; c.globalAlpha = 0.75;
    c.beginPath(); c.moveTo(W / 2 - 14, 100); c.quadraticCurveTo(W / 2 - 16, 165, W / 2, 168); c.quadraticCurveTo(W / 2 + 16, 165, W / 2 + 14, 100); c.closePath(); c.fill();
    c.globalAlpha = 1;
    // reflets humides
    c.fillStyle = 'rgba(255,255,255,.07)';
    c.beginPath(); c.ellipse(70, 300, 20, 90, 0.15, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(W - 70, 300, 20, 90, -0.15, 0, Math.PI * 2); c.fill();
    // langue au fond, avec son sillon et ses reflets
    const lg = c.createLinearGradient(0, 400, 0, H);
    lg.addColorStop(0, b.langue); lg.addColorStop(1, melange(b.langue, '#7a1f3d', 0.35));
    c.fillStyle = lg;
    c.beginPath(); c.ellipse(W / 2, H + 40, 185, 205, 0, Math.PI, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(150,30,70,.35)'; c.lineWidth = 4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(W / 2, 470); c.quadraticCurveTo(W / 2 + 4, 530, W / 2, H); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.22)';
    c.beginPath(); c.ellipse(W / 2 - 60, 440, 34, 9, -0.25, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(W / 2 + 64, 446, 22, 6, 0.25, 0, Math.PI * 2); c.fill();
    // gencive du haut
    c.fillStyle = b.gencive;
    const bas = 14 + b.hDent * 0.4;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(W, 0); c.lineTo(W, bas);
    const n = b.haut, w = (332 - 4 * (n - 1)) / n;
    for (let k = n - 1; k >= 0; k--) { const x0 = 14 + k * (w + 4); c.quadraticCurveTo(x0 + w / 2, bas + 10, x0, bas); }
    c.lineTo(0, bas); c.closePath(); c.fill();
    // gencives du bas
    c.fillStyle = b.gencive;
    for (const gc of GENCIVES) { rondRect(c, gc.x - 6, gc.y - 8, gc.w + 12, H - gc.y + 20, 18); c.fill(); }
    c.restore();
    // lèvres
    c.lineWidth = 18; c.strokeStyle = b.levre; rondRect(c, -4, -4, W + 8, H + 8, 58); c.stroke();
    c.lineWidth = 4; c.strokeStyle = 'rgba(255,255,255,.35)'; rondRect(c, 2, 2, W - 4, H - 4, 52); c.stroke();
  }
  // Visage autour du terrain (écran entier)
  function dessinerVisage(c, b, t) {
    const g = c.createLinearGradient(0, 0, 0, vh);
    g.addColorStop(0, b.peau); g.addColorStop(1, b.peau2);
    c.fillStyle = g; c.fillRect(0, 0, vw, vh);
    c.fillStyle = 'rgba(255,255,255,.12)';
    for (let k = 0; k < 24; k++) {
      const x = (k * 97.3) % vw, y = (k * 151.7) % vh;
      if (b.cle === 'dragon') { c.beginPath(); c.arc(x, y, 14, Math.PI, Math.PI * 2); c.fill(); }
      else if (b.cle === 'hippo') { c.fillRect(x, y, 2, 8); }
      else { c.beginPath(); c.arc(x, y, 3, 0, Math.PI * 2); c.fill(); }
    }
  }

  function dessinerPointilles(c, pts, couleur) {
    c.save();
    c.strokeStyle = couleur; c.lineWidth = 3.5; c.lineCap = 'round';
    c.setLineDash([2, 11]); c.lineDashOffset = -temps * 30;
    c.beginPath(); pts.forEach((p, k) => { if (k) c.lineTo(p.x, p.y); else c.moveTo(p.x, p.y); }); c.stroke();
    c.restore();
  }

  // ---------- Dessin de la partie ----------
  function dessinerJeu() {
    const b = jeu.b, t = temps;
    dessinerVisage(ctx, b, t);
    ctx.save();
    const sk = jeu.secousse > 0 ? jeu.secousse * 8 : 0;
    ctx.translate(ox + (sk ? Math.sin(t * 70) * sk : 0), oy + (sk ? Math.cos(t * 60) * sk : 0));
    ctx.scale(echelle, echelle);
    dessinerBouche(ctx, b, t);
    ctx.save(); rondRect(ctx, 0, 0, W, H, 54); ctx.clip();
    for (const d of jeu.dents) dessinerDent(ctx, d, b, t);
    for (const ca of jeu.caries) dessinerCarie(ctx, ca, t);
    if (jeu.langue) dessinerLangue(ctx, jeu.langue, b);
    for (const g of jeu.grumeaux) dessinerAnneau(ctx, g, jeu.L.T);
    for (const g of jeu.grumeaux) dessinerGrumeau(ctx, g, t, LANCEUR.x, LANCEUR.y);
    for (const n of jeu.nuages) dessinerNuage(ctx, n);

    // Visée
    const montrerVisee = etat === 'jeu' && !occupe() && jeu.outil !== 'brosse' && (jeu.vise || jeu.viseClavier > 0);
    if (montrerVisee) {
      const pts = trajectoire();
      dessinerPointilles(ctx, pts, jeu.outil === 'eau' ? 'rgba(160,220,255,.95)' : jeu.outil === 'fil' ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.95)');
    }
    // Brosse : bande de balayage
    if (jeu.outil === 'brosse' && etat === 'jeu' && !jeu.brosse) {
      ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fillRect(MUR, jeu.brosseY - 34, W - 2 * MUR, 68);
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.setLineDash([8, 8]); ctx.lineWidth = 2;
      ctx.strokeRect(MUR, jeu.brosseY - 34, W - 2 * MUR, 68); ctx.setLineDash([]);
      dessinerBrosseGeante(ctx, 70 + Math.sin(t * 4) * 8, jeu.brosseY, true);
    }
    if (jeu.brosse && jeu.brosse.phase === 'balaye') dessinerBrosseGeante(ctx, jeu.brosse.x, jeu.brosse.y, false);

    // Tir
    const p = jeu.projectile;
    if (p) {
      const gout = GOUTS[prog.gout];
      p.traine.forEach((q, k) => {
        ctx.globalAlpha = (k + 1) / p.traine.length * 0.4;
        ctx.fillStyle = p.type === 'eau' ? '#9fd8ff' : gout.c;
        ctx.beginPath(); ctx.arc(q.x, q.y, p.r * (0.4 + k / p.traine.length * 0.5), 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;
      if (p.type === 'bulle') {
        ctx.fillStyle = gout.c; ctx.globalAlpha = 0.8; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
        ctx.strokeStyle = gout.bord; ctx.lineWidth = 2.2; ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(p.x - 4, p.y - 4, 4, 2.4, -0.6, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = '#6fc3ff'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e6f6ff'; ctx.beginPath(); ctx.arc(p.x - 3, p.y - 3, 3, 0, Math.PI * 2); ctx.fill();
      }
    }
    // Fil dentaire
    const f = jeu.fil;
    if (f) {
      const u = f.t < 0.22 ? f.t / 0.22 : Math.max(0, 1 - (f.t - 0.32) / 0.28);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(f.x0, f.y0); ctx.lineTo(f.x0 + (f.x1 - f.x0) * u, f.y0 + (f.y1 - f.y0) * u); ctx.stroke();
      ctx.strokeStyle = 'rgba(120,200,255,.6)'; ctx.lineWidth = 1; ctx.stroke();
    }
    dessinerTube(ctx, LANCEUR.x, LANCEUR.y, jeu.angle, jeu.outil === 'brosse' ? 'aucun' : jeu.outil, t);

    // Particules
    for (const q of jeu.particules) {
      const a = 1 - q.vie / q.max;
      ctx.globalAlpha = Math.max(0, a); ctx.fillStyle = q.c;
      if (q.forme === 'etoile') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); etoile4(ctx, 0, 0, q.taille * 1.4, q.c); ctx.restore(); }
      else { ctx.beginPath(); ctx.arc(q.x, q.y, q.taille, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    // Textes flottants (traduits)
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const tx of jeu.textes) {
      ctx.globalAlpha = Math.max(0, 1 - tx.vie / 1.3);
      ctx.font = '900 17px system-ui, sans-serif';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(70,10,45,.85)';
      const x = borne(tx.x, 60, W - 60);
      ctx.strokeText(tx.txt, x, tx.y); ctx.fillStyle = tx.c; ctx.fillText(tx.txt, x, tx.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.restore();
  }

  // ---------- Grand sourire (écran titre, portraits) ----------
  function dessinerSourire(c, cx, cy, l, b, t, o) {
    o = o || {};
    const h = l * 0.56;
    const gauche = cx - l / 2, droite = cx + l / 2, haut = cy - h * 0.32;
    const forme = () => {
      c.beginPath();
      c.moveTo(gauche, haut);
      c.quadraticCurveTo(cx, haut - h * 0.28, droite, haut);
      c.quadraticCurveTo(cx, cy + h * 0.95, gauche, haut);
      c.closePath();
    };
    // joues
    c.fillStyle = 'rgba(255,120,150,.28)';
    [-1, 1].forEach((s) => { c.beginPath(); c.ellipse(cx + s * l * 0.52, haut - h * 0.05, l * 0.13, l * 0.08, 0, 0, Math.PI * 2); c.fill(); });
    // détails du visage
    if (b.cle === 'enfant') { c.fillStyle = 'rgba(190,110,70,.35)'; [[-0.55, -0.28], [-0.47, -0.22], [-0.58, -0.16], [0.55, -0.28], [0.47, -0.22], [0.58, -0.16]].forEach(([dx, dy]) => { c.beginPath(); c.arc(cx + dx * l, haut + dy * l * 0.5, l * 0.012, 0, Math.PI * 2); c.fill(); }); }
    if (b.cle === 'hippo' || b.cle === 'dragon') { c.fillStyle = 'rgba(60,30,60,.45)'; [-1, 1].forEach((s) => { c.beginPath(); c.ellipse(cx + s * l * 0.12, haut - h * 0.42, l * 0.035, l * 0.05, s * 0.4, 0, Math.PI * 2); c.fill(); }); }
    if (b.cle === 'geant') {
      c.fillStyle = '#8a5a3a';
      [-1, 1].forEach((s) => { c.beginPath(); c.moveTo(cx, haut - h * 0.2); c.quadraticCurveTo(cx + s * l * 0.25, haut - h * 0.45, cx + s * l * 0.42, haut - h * 0.05); c.quadraticCurveTo(cx + s * l * 0.22, haut - h * 0.22, cx, haut - h * 0.12); c.fill(); });
    }
    if (b.cle === 'dragon') { c.fillStyle = '#ffd23f'; [-1, 1].forEach((s) => { c.beginPath(); c.moveTo(cx + s * l * 0.32, haut - h * 0.55); c.lineTo(cx + s * l * 0.4, haut - h * 0.95); c.lineTo(cx + s * l * 0.46, haut - h * 0.5); c.fill(); }); }
    // intérieur
    forme();
    const g = c.createRadialGradient(cx, cy, 5, cx, cy, l * 0.55);
    g.addColorStop(0, b.gorge2); g.addColorStop(1, b.gorge);
    c.fillStyle = g; c.fill();
    c.save(); forme(); c.clip();
    // langue
    c.fillStyle = b.langue; c.beginPath(); c.ellipse(cx, cy + h * 0.62, l * 0.32, h * 0.32, 0, 0, Math.PI * 2); c.fill();
    // dents du haut le long de la lèvre
    const n = b.haut + 2, eclat = o.eclat;
    for (let k = 0; k < n; k++) {
      const u = (k + 0.5) / n, x = gauche + u * l, y = haut - h * 0.28 * 4 * u * (1 - u) * 0.5 + 2;
      const dw = l / n - 3, dh = h * (b.cle === 'geant' ? 0.3 : 0.24) * (1 - Math.abs(u - 0.5) * 0.6);
      c.fillStyle = o.terne ? '#e9dca0' : '#ffffff'; c.strokeStyle = '#c3d2e2'; c.lineWidth = 1.2;
      rondRect(c, x - dw / 2, y - 4, dw, dh + 4, b.cle === 'dragon' ? dw / 2 : 5); c.fill(); c.stroke();
    }
    // dents du bas
    for (let k = 0; k < n - 2; k++) {
      const u = (k + 1.5) / n, x = gauche + u * l, y = cy + h * 0.66 * 4 * u * (1 - u) * 0.62 - 6;
      const dw = l / n - 4, dh = h * 0.16;
      c.fillStyle = o.terne ? '#e9dca0' : '#ffffff'; c.strokeStyle = '#c3d2e2';
      rondRect(c, x - dw / 2, y - dh, dw, dh + 6, 5); c.fill(); c.stroke();
    }
    c.restore();
    // lèvres
    forme(); c.lineWidth = Math.max(4, l * 0.045); c.strokeStyle = b.levre; c.lineJoin = 'round'; c.stroke();
    // éclats
    if (eclat) {
      for (let k = 0; k < 7; k++) {
        const a = k / 7 * Math.PI * 2 + t * 0.4, rr = l * (0.5 + 0.06 * Math.sin(t * 2 + k));
        etoile4(c, cx + Math.cos(a) * rr, cy - h * 0.1 + Math.sin(a) * rr * 0.55, l * 0.035 * (0.6 + 0.4 * Math.sin(t * 4 + k)), '#fff7c2');
      }
    }
  }
  function dessinerPortrait(c, k, w, h, brille, cache) {
    const b = BOUCHES[k];
    const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, b.peau); g.addColorStop(1, b.peau2);
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    dessinerSourire(c, w / 2, h * 0.55, w * 0.72, b, 1, { eclat: brille });
    if (cache) {
      // voile et cadenas dessiné
      c.fillStyle = 'rgba(240,225,235,.85)'; c.fillRect(0, 0, w, h);
      const r = h * 0.16, x = w / 2, y = h * 0.55;
      c.strokeStyle = '#a07890'; c.lineWidth = r * 0.35;
      c.beginPath(); c.arc(x, y - r * 0.6, r * 0.75, Math.PI, Math.PI * 2); c.stroke();
      c.fillStyle = '#a07890'; rondRect(c, x - r * 1.1, y - r * 0.6, r * 2.2, r * 1.7, r * 0.3); c.fill();
    }
  }

  function dessinerTitre() {
    const b = BOUCHES[0], t = temps;
    dessinerVisage(ctx, b, t);
    const l = Math.min(vw * 0.94, 560, vh * 0.75);
    const cy = vh * 0.53;
    // lumière douce
    const halo = ctx.createRadialGradient(vw / 2, cy, 10, vw / 2, cy, l * 0.8);
    halo.addColorStop(0, 'rgba(255,255,255,.35)'); halo.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = halo; ctx.fillRect(0, 0, vw, vh);
    dessinerSourire(ctx, vw / 2, cy, l, b, t, { eclat: true });
    // grumeaux rigolos sur les dents
    const h = l * 0.56, haut = cy - h * 0.32;
    const liste = [
      { k: 'n', x: vw / 2 - l * 0.24, y: haut + h * 0.12 }, { k: 'c', x: vw / 2 + l * 0.2, y: haut + h * 0.1 },
      { k: 'gl', x: vw / 2 - l * 0.02, y: cy + h * 0.32 }
    ];
    liste.forEach((q, k) => dessinerGrumeau(ctx, { k: q.k, x: q.x, y: q.y + Math.sin(t * 2 + k) * 2, r: l * (q.k === 'c' ? 0.05 : 0.04), apparition: 1, phase: t * 3 + k, secousse: 0, hp: 2 }, t, vw / 2, vh));
    // tube et bulles qui montent
    const tx = vw / 2 + l * 0.34, ty = cy + h * 0.72;
    ctx.save(); ctx.translate(tx, ty); ctx.scale(l / 300, l / 300);
    dessinerTube(ctx, 0, 0, Math.PI * 0.68, 'bulle', t);
    ctx.restore();
    for (let k = 0; k < 7; k++) {
      const u = ((t * 0.18 + k / 7) % 1);
      const x = tx - u * l * 0.55 + Math.sin(u * 8 + k) * 10, y = ty - l * 0.1 - u * l * 0.45;
      const r = l * (0.018 + 0.012 * (k % 3));
      ctx.globalAlpha = 1 - u * 0.7;
      const gout = GOUTS[k % GOUTS.length];
      ctx.fillStyle = gout.c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = gout.bord; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.25, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // petite brosse à dents qui salue
    ctx.save(); ctx.translate(vw / 2 - l * 0.42, cy + h * 0.78); ctx.rotate(-0.5 + Math.sin(t * 3) * 0.12); ctx.scale(l / 520, l / 520);
    dessinerBrosseGeante(ctx, 90, 0, false); ctx.restore();
  }

  function dessinerFondMenu() {
    const b = BOUCHES[0];
    dessinerVisage(ctx, b, temps);
    for (let k = 0; k < 14; k++) {
      const u = ((temps * 0.05 + k / 14) % 1);
      const x = ((k * 83) % vw), y = vh - u * (vh + 60);
      const gout = GOUTS[k % GOUTS.length];
      ctx.globalAlpha = 0.5; ctx.fillStyle = gout.c; ctx.beginPath(); ctx.arc(x, y, 10 + (k % 4) * 6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Petites animations des astuces ----------
  function dessinerAstuce(type, tt) {
    const toile = $('a-dessin'); const c = toile.getContext('2d');
    const w = toile.width, h = toile.height;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, w, h);
    c.save(); c.scale(w / 260, h / 190);
    const b = jeu ? jeu.b : BOUCHES[0];
    const g = c.createLinearGradient(0, 0, 0, 190); g.addColorStop(0, b.gorge2); g.addColorStop(1, b.gorge);
    c.fillStyle = g; c.fillRect(0, 0, 260, 190);
    const dent = (x, y, w2, h2, rang, terne) => dessinerDent(c, { x, y, w: w2, h: h2, rang, ternie: !!terne, salete: 0, eclat: 1, secousse: 0 }, b, tt);
    const grum = (k, x, y, extra) => dessinerGrumeau(c, Object.assign({ k, x, y, r: 12, apparition: 1, phase: tt * 3, secousse: 0, hp: 2 }, extra || {}), tt, 130, 180);
    const bulle = (x, y, r) => { const go = GOUTS[prog.gout]; c.fillStyle = go.c; c.globalAlpha = .85; c.beginPath(); c.arc(x, y, r || 8, 0, Math.PI * 2); c.fill(); c.globalAlpha = 1; c.strokeStyle = go.bord; c.lineWidth = 1.8; c.stroke(); c.fillStyle = '#fff'; c.beginPath(); c.arc(x - 2.5, y - 2.5, 2, 0, Math.PI * 2); c.fill(); };
    const pointilles = (pts) => { c.save(); c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; c.lineCap = 'round'; c.setLineDash([2, 9]); c.beginPath(); pts.forEach((p, k) => k ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke(); c.restore(); };
    const lerp = (a, b2, u) => a + (b2 - a) * u;
    const suivre = (pts, u) => { // position le long d'une ligne brisée
      let total = 0; const seg = [];
      for (let k = 1; k < pts.length; k++) { const l = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]); seg.push(l); total += l; }
      let d = u * total;
      for (let k = 0; k < seg.length; k++) { if (d <= seg[k]) { const v = d / seg[k]; return [lerp(pts[k][0], pts[k + 1][0], v), lerp(pts[k][1], pts[k + 1][1], v)]; } d -= seg[k]; }
      return pts[pts.length - 1];
    };
    const tube = (angle, outil) => { c.save(); c.translate(130, 178); c.scale(0.7, 0.7); dessinerTube(c, 0, 0, angle, outil, tt); c.restore(); };
    const etincelles = (x, y, u) => { for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2; etoile4(c, x + Math.cos(a) * u * 30, y + Math.sin(a) * u * 30, 5 * (1 - u) + 1, k % 2 ? '#fff3a6' : '#ffffff'); } };
    const cycle = 3.2, u = (tt % cycle) / cycle;
    // rangée de dents du haut commune
    const hautDents = () => { for (let k = 0; k < 6; k++) dent(10 + k * 41, 6, 37, 40, 'h'); };

    if (type === 'viser' || type === 'bouche') {
      hautDents();
      if (type === 'bouche') {
        c.restore(); c.save(); c.scale(w / 260, h / 190);
        const go = c.createLinearGradient(0, 0, 0, 190); go.addColorStop(0, b.peau); go.addColorStop(1, b.peau2);
        c.fillStyle = go; c.fillRect(0, 0, 260, 190);
        dessinerSourire(c, 130, 100, 200, b, tt, { eclat: true });
        c.restore(); return;
      }
      const cible = [130, 58];
      const ang = Math.PI / 2;
      if (u < 0.5) {
        const v = u / 0.5;
        const hx = lerp(150, cible[0] + 10, v), hy = lerp(170, 90, v);
        grum('n', cible[0], cible[1]);
        tube(ang, 'bulle');
        if (v > 0.2) pointilles([[130, 160], [cible[0], cible[1] + 12]]);
        dessinerMain(c, hx, hy, 0.4 + 0.3 * Math.sin(tt * 8), 0.9);
      } else if (u < 0.75) {
        const v = (u - 0.5) / 0.25;
        grum('n', cible[0], cible[1]);
        tube(ang, 'aucun');
        bulle(130, lerp(150, cible[1] + 14, v));
        dessinerMain(c, cible[0] + 10, 100 + v * 30, 0, 0.9);
      } else {
        const v = (u - 0.75) / 0.25;
        tube(ang, 'bulle');
        etincelles(cible[0], cible[1], v);
      }
    } else if (type === 'ternir') {
      dent(100, 20, 60, 70, 'h', u > 0.55);
      if (u < 0.85) {
        grum('n', 130, 102);
        c.lineWidth = 4; c.strokeStyle = u < 0.3 ? '#7fe07f' : u < 0.45 ? '#ffd23f' : '#ff8a3a';
        c.beginPath(); c.arc(130, 102, 18, -Math.PI / 2, -Math.PI / 2 + Math.min(1, u / 0.55) * Math.PI * 2); c.stroke();
      }
      if (u > 0.55 && u < 0.85) { c.fillStyle = 'rgba(255,230,120,.9)'; for (let k = 0; k < 3; k++) { c.beginPath(); c.arc(160 + k * 10, 60 - k * 8, 3, 0, Math.PI * 2); c.fill(); } }
      tube(Math.PI / 2, 'bulle');
      if (u > 0.85) etincelles(130, 102, (u - 0.85) / 0.15);
    } else if (type === 'costaud') {
      hautDents();
      const v = u;
      const r = v < 0.45 ? 18 : 12;
      if (v < 0.8) grum('c', 130, 46 + r, { r, hp: v < 0.45 ? 2 : 1, secousse: (v > 0.42 && v < 0.5) || (v > 0.72 && v < 0.8) ? 0.3 : 0 });
      tube(Math.PI / 2, 'bulle');
      if (v < 0.42) bulle(130, lerp(150, 70, v / 0.42));
      else if (v > 0.5 && v < 0.75) bulle(130, lerp(150, 62, (v - 0.5) / 0.25));
      if (v >= 0.8) etincelles(130, 58, (v - 0.8) / 0.2);
    } else if (type === 'rebond' || type === 'molaires') {
      hautDents();
      if (type === 'rebond') { dent(20, 140, 50, 50, 'b'); } else { dent(4, 110, 46, 40, 'm'); dent(210, 130, 46, 40, 'm'); }
      const gx = type === 'rebond' ? 45 : 27, gy = type === 'rebond' ? 128 : 98;
      const chemin = [[130, 160], [80, 52], [gx, gy - 4]];
      pointilles(chemin);
      tube(Math.atan2(160 - 52, 80 - 130), 'bulle');
      if (u < 0.75) { grum('n', gx, gy); const p = suivre(chemin, Math.min(1, u / 0.7)); if (u < 0.7) bulle(p[0], p[1]); }
      else etincelles(gx, gy, (u - 0.75) / 0.25);
      if (u > 0.3 && u < 0.4) etoile4(c, 80, 50, 8, '#ffffff');
    } else if (type === 'glisseur') {
      hautDents();
      const gxp = 130 + Math.sin(tt * 1.8) * 70;
      grum('gl', gxp, 58);
      tube(Math.PI / 2, 'bulle');
      c.fillStyle = 'rgba(255,255,255,.7)';
      const dir = Math.cos(tt * 1.8) > 0 ? 1 : -1;
      c.beginPath(); c.moveTo(gxp + dir * 40, 58); c.lineTo(gxp + dir * 28, 50); c.lineTo(gxp + dir * 28, 66); c.fill();
    } else if (type === 'collant') {
      hautDents();
      tube(Math.PI / 2, u < 0.45 ? 'eau' : 'bulle');
      if (u < 0.25) { grum('n', 130, 58, { coque: true }); const v = u / 0.25; c.fillStyle = '#6fc3ff'; c.beginPath(); c.arc(130, lerp(150, 70, v), 6, 0, Math.PI * 2); c.fill(); }
      else if (u < 0.45) { grum('n', 130, 58); for (let k = 0; k < 6; k++) { c.fillStyle = '#9fd8ff'; c.beginPath(); c.arc(130 + Math.cos(k) * (u - 0.25) * 200, 58 + Math.sin(k * 2) * (u - 0.25) * 120, 3, 0, Math.PI * 2); c.fill(); } }
      else if (u < 0.75) { grum('n', 130, 58); bulle(130, lerp(150, 72, (u - 0.45) / 0.3)); }
      else etincelles(130, 58, (u - 0.75) / 0.25);
      // bouton de l'eau qui appelle
      c.save(); c.translate(225, 160); c.scale(1 + 0.08 * Math.sin(tt * 6), 1 + 0.08 * Math.sin(tt * 6));
      c.fillStyle = '#fff'; rondRect(c, -18, -18, 36, 36, 9); c.fill(); c.strokeStyle = '#2a9fd6'; c.lineWidth = 3; c.stroke();
      c.fillStyle = '#6fc3ff'; c.beginPath(); c.moveTo(0, -11); c.quadraticCurveTo(10, 2, 8, 5); c.arc(0, 5, 8, 0, Math.PI); c.quadraticCurveTo(-10, 2, 0, -11); c.fill();
      c.restore();
    } else if (type === 'sauteur') {
      hautDents();
      dent(20, 140, 50, 50, 'b');
      const spots = [[50, 58], [173, 58], [45, 128]];
      const k = Math.floor(tt / 1.4) % 3, v = (tt % 1.4) / 1.4;
      const a = spots[k], bb = spots[(k + 1) % 3];
      let x = a[0], y = a[1];
      if (v > 0.65) { const s = (v - 0.65) / 0.35; x = lerp(a[0], bb[0], s); y = lerp(a[1], bb[1], s) - Math.sin(s * Math.PI) * 30; }
      grum('s', x, y);
      tube(Math.PI / 2, 'bulle');
    } else if (type === 'brosse') {
      hautDents();
      for (let k = 0; k < 4; k++) if (u < 0.45 || 20 + k * 60 > lerp(-60, 330, (u - 0.45) / 0.5) - 20) grum('n', 30 + k * 64, 58);
      if (u < 0.45) {
        const by = lerp(150, 58, Math.min(1, u / 0.35));
        c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(0, by - 22, 260, 44);
        dessinerMain(c, 200, by, 0.5, 0.8);
        c.save(); c.translate(0, 0); c.scale(0.6, 0.6); dessinerBrosseGeante(c, 110, by / 0.6, true); c.restore();
      } else if (u < 0.95) {
        c.save(); c.scale(0.6, 0.6); dessinerBrosseGeante(c, lerp(-60, 330, (u - 0.45) / 0.5) / 0.6, 58 / 0.6, false); c.restore();
      }
    } else if (type === 'langue') {
      hautDents();
      grum('n', 130, 58);
      const lx = 130 + Math.sin(tt * 2) * 70;
      dessinerLangue(c, { x: lx, y: 110, w: 70, h: 24 }, b);
      tube(Math.PI / 2, 'bulle');
      if (Math.abs(lx - 130) > 55) { pointilles([[130, 160], [130, 72]]); }
    } else if (type === 'fil') {
      hautDents();
      const cx2 = 130, cy2 = 46;
      tube(Math.PI / 2, 'fil');
      if (u < 0.5) dessinerCarie(c, { sx: cx2, sy: cy2, dx: 0, dy: -7, reparee: false }, tt);
      if (u > 0.2 && u < 0.6) { const v = Math.min(1, (u - 0.2) / 0.15); c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(130, 160); c.lineTo(130, lerp(160, cy2, v)); c.stroke(); }
      if (u >= 0.5) { dessinerCarie(c, { sx: cx2, sy: cy2, dx: 0, dy: -7, reparee: true, eclat: 0 }, tt); etincelles(cx2, cy2 - 7, Math.min(1, (u - 0.5) / 0.4)); }
    } else if (type === 'nuage') {
      hautDents();
      grum('n', 130, 58);
      const nx = ((tt * 50) % 380) - 60;
      dessinerNuage(c, { x: nx, y: 110, r: 20, gonfle: 0 });
      tube(Math.PI / 2, 'bulle');
      if (Math.abs(nx - 130) > 40) pointilles([[130, 160], [130, 72]]);
    } else if (type === 'jumeaux') {
      hautDents();
      if (u < 0.35) { grum('j', 130, 58); bulle(130, lerp(150, 72, u / 0.35)); }
      else { const v = Math.min(1, (u - 0.35) / 0.3); [-1, 1].forEach((s) => grum('n', 130 + s * 41 * v, 58 - Math.sin(v * Math.PI) * 30, { r: 10, jumeau: true })); }
      tube(Math.PI / 2, 'bulle');
    } else if (type === 'roi') {
      hautDents();
      const coque = u > 0.3 && u < 0.6;
      grum('r', 130, 66, { r: 18, hp: u < 0.3 ? 4 : 3, coque, secousse: u > 0.28 && u < 0.34 ? 0.3 : 0 });
      tube(Math.PI / 2, u > 0.4 && u < 0.6 ? 'eau' : 'bulle');
      if (u < 0.28) bulle(130, lerp(150, 90, u / 0.28));
      if (u > 0.45 && u < 0.6) { c.fillStyle = '#6fc3ff'; c.beginPath(); c.arc(130, lerp(150, 92, (u - 0.45) / 0.15), 6, 0, Math.PI * 2); c.fill(); }
    }
    c.restore();
  }

  // ---------- Boucle principale ----------
  let dernier = performance.now();
  function boucle(maintenant) {
    const dt = Math.min(0.05, Math.max(0, (maintenant - dernier) / 1000));
    dernier = maintenant;
    temps += dt;
    if (etat === 'jeu' && jeu) majJeu(dt);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (jeu && (etat === 'jeu' || etat === 'pause' || etat === 'astuce' || etat === 'fin')) dessinerJeu();
    else if (etat === 'titre') dessinerTitre();
    else dessinerFondMenu();
    if (etat === 'astuce' && astuceCourante) dessinerAstuce(astuceCourante, temps - debutAstuce);
    // confettis de victoire
    if (confettis.length) {
      for (const q of confettis) {
        q.vie += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
        ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillStyle = q.c; ctx.fillRect(-5, -3, 10, 6); ctx.restore();
      }
      confettis = confettis.filter((q) => q.vie < q.t && q.y < vh + 30);
    }
    requestAnimationFrame(boucle);
  }

  // ---------- Commandes : doigt et souris ----------
  function versMonde(e) { return { x: (e.clientX - ox) / echelle, y: (e.clientY - oy) / echelle }; }
  function viserVers(m) {
    const a = Math.atan2(LANCEUR.y - m.y, m.x - LANCEUR.x);
    jeu.angle = borne(a < -Math.PI / 2 ? Math.PI : a < 0 ? 0 : a, ANGLE_MIN, Math.PI - ANGLE_MIN);
  }
  let pointeurActif = null;
  canvas.addEventListener('pointerdown', (e) => {
    reveillerAudio();
    if (etat !== 'jeu' || !jeu || occupe()) return;
    e.preventDefault();
    pointeurActif = e.pointerId;
    try { canvas.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
    const m = versMonde(e);
    if (jeu.outil === 'brosse') { jeu.brosseY = borne(m.y, 60, 540); jeu.vise = true; return; }
    jeu.vise = true; viserVers(m);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pointeurActif || !jeu || !jeu.vise || etat !== 'jeu') return;
    const m = versMonde(e);
    if (jeu.outil === 'brosse') jeu.brosseY = borne(m.y, 60, 540); else viserVers(m);
  });
  const relacher = (e) => {
    if (e.pointerId !== pointeurActif) return;
    pointeurActif = null;
    if (!jeu || !jeu.vise || etat !== 'jeu') { if (jeu) jeu.vise = false; return; }
    jeu.vise = false;
    if (e.type === 'pointercancel') return;
    if (jeu.outil === 'brosse') lancerBrosse(); else tirer();
  };
  canvas.addEventListener('pointerup', relacher);
  canvas.addEventListener('pointercancel', relacher);

  function lancerBrosse() {
    if (occupe() || jeu.brosses <= 0) return;
    jeu.brosses--;
    jeu.brosse = { phase: 'balaye', x: -60, y: jeu.brosseY, chaine: 0 };
    jouerSon('brosse'); majOutils();
  }

  // ---------- Clavier ----------
  window.addEventListener('keydown', (e) => {
    reveillerAudio();
    const code = e.code;
    if (etat === 'jeu' && jeu) {
      if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); pause(); return; }
      if (code === 'ArrowLeft') { jeu.gauche = true; e.preventDefault(); }
      else if (code === 'ArrowRight') { jeu.droite = true; e.preventDefault(); }
      else if (code === 'ArrowUp') { jeu.haut = true; e.preventDefault(); if (jeu.outil !== 'brosse') jeu.viseClavier = 2.5; }
      else if (code === 'ArrowDown') { jeu.bas = true; e.preventDefault(); }
      else if (code === 'Space' || code === 'Enter') {
        e.preventDefault();
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        if (!e.repeat) { if (jeu.outil === 'brosse') lancerBrosse(); else tirer(); }
      } else if (/^(Digit|Numpad)[1-4]$/.test(code)) { choisirOutil(['bulle', 'eau', 'brosse', 'fil'][Number(code.slice(-1)) - 1]); }
      return;
    }
    if (etat === 'pause' && (code === 'Escape' || code === 'KeyP')) { e.preventDefault(); reprendre(); return; }
    if (etat === 'astuce' && (code === 'Escape')) { e.preventDefault(); fermerAstuce(); return; }
  });
  window.addEventListener('keyup', (e) => {
    if (!jeu) return;
    if (e.code === 'ArrowLeft') jeu.gauche = false;
    if (e.code === 'ArrowRight') jeu.droite = false;
    if (e.code === 'ArrowUp') jeu.haut = false;
    if (e.code === 'ArrowDown') jeu.bas = false;
  });

  // ---------- Boutons ----------
  document.addEventListener('pointerdown', reveillerAudio, true);
  const clic = (id, f) => $(id).addEventListener('click', () => { reveillerAudio(); jouerSon('clic'); f(); });
  clic('b-jouer', () => {
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { chargerProg(); demarrerNiveau(Math.max(0, Math.min(NIVEAUX.length, Math.floor(Number(d.niveau) || 1)) - 1)); },
      onNouvelle: () => { chargerProg(); demarrerNiveau(0); },
      onEffacer: () => { chargerProg(); demarrerNiveau(0); }
    });
  });
  clic('b-niveaux', () => { chargerProg(); allerNiveaux(); });
  clic('b-collection', () => { chargerProg(); allerCollection(); });
  clic('b-niveaux-retour', allerTitre);
  clic('b-collection-retour', allerTitre);
  $('b-astuce').addEventListener('click', () => { reveillerAudio(); fermerAstuce(); });
  $('ecran-astuce').addEventListener('click', (e) => { if (e.target === $('ecran-astuce')) fermerAstuce(); });
  clic('b-pause', pause);
  clic('b-reprendre', reprendre);
  clic('b-recommencer', () => demarrerNiveau(jeu.i));
  clic('b-pause-niveaux', () => { chargerProg(); allerNiveaux(); });
  clic('b-accueil', allerTitre);
  clic('b-suivant', () => demarrerNiveau(Math.min(NIVEAUX.length - 1, jeu.i + 1)));
  clic('b-reessayer', () => demarrerNiveau(jeu.i));
  clic('b-rejouer', () => demarrerNiveau(jeu.i));
  clic('b-fin-niveaux', allerNiveaux);
  clic('b-fin-accueil', allerTitre);
  document.querySelectorAll('.outil').forEach((b) => b.addEventListener('click', () => { reveillerAudio(); choisirOutil(b.dataset.outil); }));
  document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', () => {
    reveillerAudio();
    prog.son = !prog.son; majSon(); memoriserReglages();
    if (prog.son) { if (audio && audio.state === 'suspended' && etat !== 'pause') audio.resume().catch(() => {}); setTimeout(() => jouerSon('clic'), 30); }
  }));

  // Pause automatique quand l'écran est caché
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') pause(); });

  // Sauvegarde à la fermeture, seulement pendant une partie
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && jeu) window.JEL_SAVE.save(JEU, donneesSauvegarde(jeu.i + 1));
  });

  // Bouton « Effacer la sauvegarde » de l'écran titre
  window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('effacer-titre'), apres: () => { chargerProg(); } });

  // Changement de langue : textes de l'écran courant mis à jour
  I18N.surChangement(() => {
    if (jeu) majHud();
    if (etat === 'niveaux') allerNiveaux();
    if (etat === 'collection') allerCollection();
    if (etat === 'astuce') montrerAstuce();
  });

  // ---------- Démarrage ----------
  chargerProg();
  redimensionner();
  allerTitre();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
