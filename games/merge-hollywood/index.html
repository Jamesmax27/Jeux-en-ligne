        b.innerHTML = ICONES.cadenasPetit;
        b.setAttribute('aria-label', t('niveaux.ferme', { n: nombre(n) }));
        b.addEventListener('click', () => { debloquerAudio(); SONS.erreur(); b.classList.remove('secousse'); void b.offsetWidth; b.classList.add('secousse'); });
      }
      grille.appendChild(b);
    }
    liste.appendChild(groupe);
  });
  montrer('niveaux');
  const dernier = liste.querySelector('.dernier');
  if (dernier) dernier.scrollIntoView({ block: 'nearest' });
}

// ---------- Construction de la grille ----------
function construireGrille() {
  const grille = $('grille');
  grille.innerHTML = '';
  for (let i = 0; i < COLS * ROWS; i++) {
    const d = document.createElement('div');
    d.className = 'case';
    d.dataset.i = i;
    d.setAttribute('role', 'button');
    grille.appendChild(d);
    casesDom.push(d);
  }
}
function ajuster() {
  const z = $('zone-grille');
  if (!z || ecran !== 'jeu') return;
  // Place prise autour des cases : marge intérieure (2 × 5 px), bordure (2 × 2 px), écarts de 3 px.
  // La grille suit la hauteur réelle de l'écran : elle ne déborde jamais sur la barre du bas.
  const w = z.clientWidth - 14 - (COLS - 1) * 3, h = z.clientHeight - 14 - (ROWS - 1) * 3;
  const taille = Math.max(22, Math.floor(Math.min(w / COLS, h / ROWS)));
  document.documentElement.style.setProperty('--case', Math.min(taille, 78) + 'px');
}

function rendreCase(i) {
  const k = partie.cases[i], d = casesDom[i];
  const classes = ['case'];
  let html = '', label;
  if (!k.zone) { classes.push('fermee'); label = t('case.fermee'); }
  else {
    if (k.spot) classes.push('spot');
    if (k.v) {
      html = dessinCadenas(k.v) + `<span class="pips verrou">${Array.from({ length: k.v.max }, (_, j) => `<i class="${j < k.v.f ? '' : 'vide'}"></i>`).join('')}</span>`;
      label = t('case.cadenas', { n: k.v.max - k.v.f });
    } else if (k.malle) { html = DESSIN_MALLE; label = t('case.malle'); }
    else if (k.o) {
      html = dessinObjet(k.o);
      if (k.o.c !== J) html += `<span class="pips">${Array.from({ length: RANG_MAX }, (_, j) => `<i class="${j < k.o.n ? '' : 'vide'}"></i>`).join('')}</span>`;
      label = k.o.c === J ? nomObjet(k.o) : t('case.objet', { objet: nomObjet(k.o), n: nombre(k.o.n) });
    } else label = t('case.vide');
  }
  if (choix === i) classes.push('choisi');
  if (curseur === i) classes.push('curseur');
  if (glisse && glisse.actif && glisse.de === i) classes.push('origine');
  if (d._html !== html) { d.innerHTML = html; d._html = html; }
  d.className = classes.join(' ');
  d.setAttribute('aria-label', label);
}
function rendreGrille() { for (let i = 0; i < casesDom.length; i++) rendreCase(i); }

function rendreHud() {
  $('hud-titre').textContent = t('hud.tournage', { n: nombre(partie.n) });
  $('c-bobines').innerHTML = `${ICONES.bobine}<span>${nombre(partie.bobines)}</span>`;
  $('c-bobines').setAttribute('aria-label', t('hud.bobines', { n: nombre(partie.bobines) }));
  $('c-bobines').title = t('hud.bobines', { n: nombre(partie.bobines) });
  $('c-pieces').innerHTML = `${ICONES.piece}<span>${nombre(partie.pieces)}</span>`;
  $('c-pieces').setAttribute('aria-label', t('hud.pieces', { n: nombre(partie.pieces) }));
  $('c-pieces').title = t('hud.pieces', { n: nombre(partie.pieces) });
  // Barre d'expérience : carrière + tournage en cours.
  const xp = profil.xp + partie.xp, r = rangCarriere(xp, Math.max(profil.debloque, partie.n));
  $('xp-icone').innerHTML = ICONES_RANG[RANGS[r].id];
  $('xp-nom').textContent = nomRang(r);
  const bas = SEUILS[r], haut = r + 1 < SEUILS.length ? SEUILS[r + 1] : null;
  $('xp-rempli').style.width = haut === null ? '100%' : Math.min(100, Math.round(100 * (xp - bas) / Math.max(1, haut - bas))) + '%';
  $('xp-barre').setAttribute('aria-label', t('hud.xp', { n: nombre(xp) }));
  $('xp-barre').title = t('hud.xp', { n: nombre(xp) });
  // Barre du bas.
  const vente = partie.n >= DES.vente, boutique = partie.n >= DES.boutique;
  $('b-vendre').classList.toggle('cache', !vente);
  $('b-boutique').classList.toggle('cache', !boutique);
  $('b-generer').innerHTML = `${ICONES.generateur}<span>${t('barre.generer')}</span>`;
  $('b-vendre').innerHTML = `${ICONES.caisse}<span>${t('barre.vendre')}</span>`;
  $('b-boutique').innerHTML = `${ICONES.boutique}<span>${t('barre.boutique')}</span>`;
}

let commandesAffichees = [];
function rendreCommandes() {
  const zone = $('commandes');
  const vis = visibles(partie);
  const ids = vis.map((c) => c.k);
  const nouveaux = ids.filter((k) => !commandesAffichees.includes(k));
  commandesAffichees = ids;
  zone.innerHTML = '';
  const choisi = choix !== null && mobile(partie, choix) ? partie.cases[choix].o : null;
  vis.forEach((cmd, pos) => {
    const d = document.createElement('div');
    d.className = 'commande';
    d.dataset.k = cmd.k;
    d.setAttribute('role', 'button');
    if (nouveaux.includes(cmd.k)) d.classList.add('arrive');
    if (choisi && choisi.c === cmd.c && choisi.n === cmd.n) d.classList.add('prete');
    const gain = PIECES_COMMANDE[cmd.n] * (cmd.x > 0 ? 2 : 1);
    d.innerHTML = `<div class="haut">${dessinVisage(cmd.p)}<span class="objet">${dessinObjet({ c: cmd.c, n: cmd.n })}</span>${cmd.reste > 1 ? `<span class="qte">${t('cmd.fois', { n: nombre(cmd.reste) })}</span>` : ''}</div>
      <span class="nom">${t('perso.' + cmd.p)}</span>
      <span class="gain">${ICONES.piece}${t('cmd.gain', { n: nombre(gain) })}</span>
      ${cmd.x > 0 ? `<span class="badge-express">${ICONES.bobine}${nombre(cmd.x)}</span>` : ''}`;
    d.setAttribute('aria-label', t('cmd.aria', { perso: t('perso.' + cmd.p), objet: nomObjet({ c: cmd.c, n: cmd.n }), n: nombre(cmd.reste), touche: nombre(pos + 1) }));
    d.addEventListener('click', () => toucherCommande(cmd.k));
    zone.appendChild(d);
  });
  for (let k = vis.length; k < 3; k++) {
    const v = document.createElement('div');
    v.className = 'commande vide';
    zone.appendChild(v);
  }
}

function texteInfo(html, alerte) {
  const el = $('info');
  el.innerHTML = html;
  el.classList.remove('alerte');
  if (alerte) { void el.offsetWidth; el.classList.add('alerte'); }
}
function infoParDefaut() {
  if (!partie) return;
  if (choix !== null && mobile(partie, choix)) {
    const o = partie.cases[choix].o;
    const vente = partie.n >= DES.vente ? ' · ' + t('info.vaut', { n: nombre(valeurVente(o)) }) : '';
    texteInfo(`${dessinObjet(o)}<span><b>${nomObjet(o)}</b>${vente}</span>`);
    return;
  }
  const libres = casesLibres(partie);
  if (libres <= 2 && !partie.fin) { texteInfo(t('alerte.place', { n: libres }), true); return; }
  texteInfo(t('aide.jeu'));
}
function rendreTout() {
  rendreHud();
  rendreCommandes();
  rendreGrille();
}

/* ---------- Effets visuels ---------- */
function centre(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height };
}
function etincelles(x, y, couleurs, nb) {
  const eff = $('effets');
  for (let k = 0; k < nb; k++) {
    const s = document.createElement('span');
    s.className = 'etincelle';
    const a = Math.random() * Math.PI * 2, d = 25 + Math.random() * 45;
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.background = couleurs[k % couleurs.length];
    s.style.setProperty('--dx', Math.cos(a) * d + 'px');
    s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    eff.appendChild(s);
    setTimeout(() => s.remove(), 800);
  }
}
function flotter(x, y, html, classe) {
  const f = document.createElement('div');
  f.className = 'flot ' + (classe || '');
  f.innerHTML = html;
  f.style.left = x + 'px'; f.style.top = y + 'px';
  $('effets').appendChild(f);
  setTimeout(() => f.remove(), 1150);
}
function confettis(nb) {
  const eff = $('effets');
  const couleurs = ['#fde047', '#f472b6', '#60a5fa', '#34d399', '#f97316', '#a78bfa'];
  for (let k = 0; k < nb; k++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = couleurs[k % couleurs.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
    c.style.animationDelay = Math.random() * 0.5 + 's';
    c.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    c.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    eff.appendChild(c);
    setTimeout(() => c.remove(), 3800);
  }
}
function animerCase(i, classe) {
  const d = casesDom[i];
  d.classList.remove(classe); void d.offsetWidth; d.classList.add(classe);
  setTimeout(() => d.classList.remove(classe), 450);
}
function secouer(el) { el.classList.remove('secousse'); void el.offsetWidth; el.classList.add('secousse'); setTimeout(() => el.classList.remove('secousse'), 400); }
function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

/* ---------- Démarrer un tournage ---------- */
function arreterPartie() {
  partie = null; choix = null; glisse = null; enPause = false;
  document.body.classList.remove('en-pause');
  clearTimeout(finMinuteur);
  ['fen-objectif', 'fen-pause', 'fen-fin', 'fen-boutique'].forEach(fermer);
  fermerTuto();
  document.querySelectorAll('.fantome').forEach((f) => f.remove());
}
function demarrer(n) {
  arreterPartie();
  partie = creerPartie(n, rangCarriere(profil.xp, profil.debloque));
  choix = null; curseur = idx(0, 0); commandesAffichees = [];
  montrer('jeu');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  requestAnimationFrame(() => { ajuster(); rendreTout(); infoParDefaut(); });
  rendreTout();
  infoParDefaut();
  montrerObjectif();
}
function montrerObjectif() {
  const p = partie, def = p.def;
  $('but-titre').textContent = t('hud.tournage', { n: nombre(p.n) });
  $('but-nom').textContent = t('niv.' + p.n);
  $('but-liste').innerHTML = def.cmd.map(([pe, c, rg, q]) => `<li>${dessinVisage(pe)}${dessinObjet({ c, n: rg })}${(q || 1) > 1 ? t('cmd.fois', { n: nombre(q) }) : ''}</li>`).join('');
  $('but-liberer').style.display = def.lib ? '' : 'none';
  $('but-bobines').innerHTML = `${ICONES.bobine}<span>${t('but.bobines', { n: nombre(bobinesDepart(def)) })}</span>`;
  $('but-etoiles').innerHTML = `${ICONES.etoile(true)}${ICONES.etoile(true)}${ICONES.etoile(true)}<span>${t('but.etoiles', { n: def.par })}</span>`;
  const nv = $('but-nouveau');
  nv.innerHTML = `<b>${t('but.nouveau')}</b> ${t('nouv.' + def.nouv)}`;
  ouvrir('fen-objectif');
}
function action() {
  fermer('fen-objectif');
  debloquerAudio();
  SONS.clic();
  ajuster(); rendreTout(); infoParDefaut();
  if (!profil.etoiles[partie.n - 1]) setTimeout(() => { if (partie && !fenetreOuverte()) lancerTutoNiveau(); }, 250);
}

/* ---------- Actions du joueur ---------- */
function enJeu() { return ecran === 'jeu' && partie && !partie.fin && !enPause && !fenetreOuverte() && !tutoOuvert; }

function actionGenerer() {
  if (!enJeu()) return;
  debloquerAudio();
  const r = generer(partie);
  const bouton = $('b-generer');
  if (!r.ok) {
    SONS.erreur();
    if (r.raison === 'place') { secouer($('grille')); texteInfo(t('info.plusDePlace'), true); }
    else if (r.raison === 'bobines') { secouer($('c-bobines')); texteInfo(partie.n >= DES.boutique ? t('info.plusDeBobinesBoutique') : t('info.plusDeBobines'), true); }
    apres(false);
    return;
  }
  bouton.classList.remove('tourne'); void bouton.offsetWidth; bouton.classList.add('tourne');
  SONS.pose();
  rendreTout();
  animerCase(r.i, 'apparait');
  bump($('c-bobines'));
  const c = centre(casesDom[r.i]);
  etincelles(c.x, c.y, ['#fde047', '#fff'], 6);
  if (r.expirees.length) texteInfo(t('info.expressFini'), true);
  else infoParDefaut();
  apres(true);
}

function lacher(de, cible) {
  if (!partie || partie.fin) return;
  if (cible.type === 'cmd') return livrerVers(de, cible.k);
  if (cible.type === 'vente') return vendreCase(de);
  if (cible.type !== 'case') return;
  const vers = cible.i;
  const r = deposer(partie, de, vers);
  if (r.type === 'rien') { rendreGrille(); return; }
  if (r.type === 'refus') {
    SONS.erreur();
    secouer(casesDom[vers]);
    texteInfo(t('refus.' + r.raison), true);
    rendreGrille();
    return;
  }
  if (r.type === 'deplacement' || r.type === 'echange') {
    SONS.deplace();
    rendreTout(); infoParDefaut();
    return;
  }
  // Fusion !
  SONS.fusion(r.obj.n);
  rendreTout();
  animerCase(vers, 'pop');
  const c = centre(casesDom[vers]);
  const couleurs = r.obj.n >= 4 ? ['#fde047', '#f472b6', '#60a5fa', '#fff'] : ['#fde047', '#fff7c2', '#f59e0b'];
  etincelles(c.x, c.y, couleurs, 8 + r.obj.n * 4);
  if (r.xp) flotter(c.x, c.y - 10, t('flot.xp', { n: nombre(r.xp) }), 'xp');
  if (r.pieces) setTimeout(() => flotter(c.x + 16, c.y + 6, `${ICONES.piece}${t('flot.plus', { n: nombre(r.pieces) })}`), 160);
  bump($('c-pieces'));
  r.fissures.forEach((j) => { animerCase(j, 'fissure'); });
  if (r.fissures.length) SONS.fissure();
  r.ouverts.forEach((j) => { const cc = centre(casesDom[j]); etincelles(cc.x, cc.y, ['#cbd5e1', '#fde047', '#fff'], 14); animerCase(j, 'apparait'); });
  if (r.ouverts.length) setTimeout(() => SONS.ouvert(), 120);
  r.malles.forEach((j) => { const cc = centre(casesDom[j]); etincelles(cc.x, cc.y, ['#b45309', '#fde047'], 12); animerCase(j, 'pop'); });
  if (r.malles.length) setTimeout(() => SONS.malle(), 160);
  let msg = t('info.fusion', { objet: nomObjet(r.obj) });
  if (r.ouverts.length) msg = t('info.cadenasOuvert');
  else if (r.malles.length) msg = t('info.malleOuverte');
  else if (r.spot) msg = t('info.spot');
  texteInfo(`${dessinObjet(r.obj)}<span>${msg}</span>`);
  apres(true);
}

function livrerVers(de, k) {
  const r = livrer(partie, de, k);
  const carte = document.querySelector(`.commande[data-k="${k}"]`);
  if (!r.ok) {
    SONS.erreur();
    if (carte) secouer(carte);
    texteInfo(t('info.pasCommande'), true);
    rendreGrille();
    return;
  }
  SONS.livraison(r.express);
  if (carte) {
    const c = centre(carte);
    etincelles(c.x, c.y, ['#fde047', '#34d399', '#f472b6'], 16);
    flotter(c.x, c.y, `${ICONES.piece}${t('flot.plus', { n: nombre(r.pieces) })}`);
    setTimeout(() => flotter(c.x, c.y + 20, t('flot.xp', { n: nombre(r.xp) }), 'xp'), 180);
    if (r.termine) carte.classList.add('partie');
  }
  bump($('c-pieces'));
  const msg = r.express ? t('info.livreExpress') : r.termine ? t('info.merci', { perso: t('perso.' + partie.commandes[k].p) }) : t('info.encore');
  setTimeout(() => {
    if (!partie) return;
    rendreTout();
    texteInfo(msg);
    apres(true);
  }, r.termine ? 420 : 0);
  if (!r.termine) rendreGrille();
}

function vendreCase(i) {
  if (partie.n < DES.vente) { SONS.erreur(); texteInfo(t('info.venteBientot', { n: DES.vente }), true); rendreGrille(); return; }
  const r = vendre(partie, i);
  if (!r.ok) { rendreGrille(); return; }
  SONS.vente();
  const c = centre($('b-vendre'));
  flotter(c.x, c.y - 30, `${ICONES.piece}${t('flot.plus', { n: nombre(r.pieces) })}`);
  etincelles(c.x, c.y - 20, ['#fde047', '#fbbf24'], 8);
  rendreTout();
  bump($('c-pieces'));
  texteInfo(t('info.vendu', { n: r.pieces }));
  apres(false);
}

function toucherCase(i) {
  if (!enJeu()) return;
  debloquerAudio();
  const k = partie.cases[i];
  if (choix === null) {
    if (mobile(partie, i)) { choix = i; SONS.clic(); rendreTout(); infoParDefaut(); return; }
    if (!k.zone) texteInfo(t('info.zone'));
    else if (k.v) texteInfo(t('info.cadenas', { n: k.v.max - k.v.f }));
    else if (k.malle) texteInfo(t('info.malle'));
    else texteInfo(k.spot ? t('info.caseSpot') : t('info.vide'));
    animerCase(i, 'fissure');
    return;
  }
  if (choix === i) { choix = null; rendreTout(); infoParDefaut(); return; }
  const de = choix;
  choix = null;
  lacher(de, { type: 'case', i });
}
function toucherCommande(k) {
  if (!enJeu()) return;
  debloquerAudio();
  if (choix === null) {
    const cmd = partie.commandes[k];
    texteInfo(`${dessinObjet({ c: cmd.c, n: cmd.n })}<span>${t('info.commande', { perso: t('perso.' + cmd.p), objet: nomObjet(cmd) })}</span>`);
    return;
  }
  const de = choix;
  choix = null;
  livrerVers(de, k);
}
function toucherVendre() {
  if (!enJeu()) return;
  debloquerAudio();
  if (choix === null) { SONS.clic(); texteInfo(t('info.choisirAvant')); return; }
  const de = choix;
  choix = null;
  vendreCase(de);
}

// Après chaque action : alerte de place, victoire ou défaite.
function apres(avecInfo) {
  if (!partie) return;
  if (avecInfo !== true && avecInfo !== false) infoParDefaut();
  const fin = verifierFin(partie);
  if (!fin) {
    const libres = casesLibres(partie);
    if (libres <= 2 && avecInfo !== false) texteInfo(t('alerte.place', { n: libres }), true);
    return;
  }
  partie.fin = fin;
  choix = null;
  clearTimeout(finMinuteur);
  finMinuteur = setTimeout(() => terminer(fin), fin === 'victoire' ? 650 : 900);
}

/* ---------- Fin du tournage ---------- */
function terminer(fin) {
  if (!partie) return;
  const p = partie, n = p.n;
  const score = scoreDe(p);
  const rangAvant = rangCarriere(profil.xp, profil.debloque);
  profil.xp += p.xp;
  const ancienRecord = profil.records[n - 1] || 0;
  const record = score > ancienRecord;
  let etoiles = 0;
  if (fin === 'victoire') {
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: n });
    etoiles = etoilesDe(p);
    profil.etoiles[n - 1] = Math.max(profil.etoiles[n - 1] || 0, etoiles);
    if (record) profil.records[n - 1] = score;
    profil.debloque = Math.max(profil.debloque, Math.min(n + 1, NIVEAUX.length));
    sauver(n + 1, score);
    // Jeu terminé (tous les tournages gagnés au moins une fois) : total des meilleures étoiles.
    if (NIVEAUX.every((x, k) => (profil.etoiles[k] || 0) > 0)) {
      if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
    }
  } else {
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: n });
    sauver(n, score);
  }
  for (let k = 0; k < NIVEAUX.length; k++) if (profil.etoiles[k] === undefined) profil.etoiles[k] = 0;
  const rangApres = rangCarriere(profil.xp, profil.debloque);

  const gagne = fin === 'victoire';
  const dernier = gagne && n === NIVEAUX.length;
  $('fin-visuel').innerHTML = gagne ? dessinObjet({ c: G, n: dernier ? 4 : 3 }) : dessinObjet({ c: T, n: 1 });
  $('fin-titre').textContent = gagne ? (dernier ? t('fin.final') : t('fin.victoire')) : t('fin.defaite.' + fin);
  $('fin-aide').textContent = gagne
    ? (dernier ? t('fin.finalAide', { n: NIVEAUX.length, e: totalEtoiles(), max: NIVEAUX.length * 3 }) : t('fin.victoireAide', { n: nombre(n) }))
    : t('fin.defaite.' + fin + 'Aide');
  const zoneEt = $('fin-etoiles');
  zoneEt.innerHTML = '';
  if (gagne) {
    for (let k = 1; k <= 3; k++) {
      const holder = document.createElement('span');
      holder.innerHTML = ICONES.etoile(k <= etoiles);
      const s = holder.firstChild;
      s.style.animationDelay = (0.25 + k * 0.3) + 's';
      s.classList.add(k <= etoiles ? 'allumee' : 'eteinte');
      zoneEt.appendChild(s);
      if (k <= etoiles) setTimeout(() => SONS.etoile(k), 250 + k * 300);
    }
    zoneEt.setAttribute('aria-label', t('fin.etoiles', { n: etoiles }));
  }
  // Score qui défile.
  const elScore = $('fin-score');
  const debut = performance.now();
  const anim = (now) => {
    const f = Math.min(1, (now - debut) / 900);
    elScore.textContent = t('fin.score', { n: nombre(Math.round(score * f)) });
    if (f < 1 && $('fen-fin').classList.contains('ouverte')) requestAnimationFrame(anim);
  };
  requestAnimationFrame(anim);
  elScore.textContent = t('fin.score', { n: nombre(0) });
  $('fin-record').textContent = record && gagne ? t('fin.record') : t('fin.recordAncien', { n: nombre(Math.max(ancienRecord, gagne ? score : 0)) });
  $('fin-detail').innerHTML = `${ICONES.bobine}<span>${t('fin.bobines', { n: p.utilisees })}</span>`;
  // Nouveau rang ?
  const zr = $('fin-rang');
  zr.classList.remove('visible');
  if (rangApres > rangAvant) {
    const rg = RANGS[rangApres];
    zr.innerHTML = `${ICONES_RANG[rg.id]}<p><b>${t('rang.nouveau', { rang: nomRang(rangApres) })}</b></p>
      ${rg.chaine ? `<p class="ligne-info">${dessinObjet({ c: rg.chaine, n: 1 })}${t('rang.chaine', { chaine: t('chaine.' + rg.chaine) })}</p>` : ''}
      <p>${t('rang.zone', { c: rg.zone[0], r: rg.zone[1] })}</p>`;
    zr.classList.add('visible');
    setTimeout(() => SONS.rang(), 1500);
  }
  // Boutons.
  const bt = $('fin-boutons');
  bt.innerHTML = '';
  const ajouterBouton = (cle, classe, f) => {
    const b = document.createElement('button');
    b.className = 'btn ' + classe;
    b.textContent = t(cle);
    b.addEventListener('click', () => { debloquerAudio(); SONS.clic(); f(); });
    bt.appendChild(b);
  };
  if (gagne && !dernier) ajouterBouton('fin.suivant', '', () => demarrer(n + 1));
  if (gagne) ajouterBouton('rejouer', 'secondaire', () => demarrer(n));
  else ajouterBouton('reessayer', '', () => demarrer(n));
  ajouterBouton('niveaux', 'secondaire', afficherNiveaux);
  if (!gagne) ajouterBouton('accueil', 'secondaire', afficherTitre);
  ouvrir('fen-fin');
  if (gagne) { SONS.victoire(); confettis(dernier ? 120 : 60); }
  else { SONS.defaite(); secouer($('grille')); }
}

/* ---------- Pause ---------- */
function ouvrirPause() {
  if (ecran !== 'jeu' || !partie || partie.fin || enPause) return;
  annulerGlisse();
  enPause = true;
  document.body.classList.add('en-pause');
  if (audio && audio.state === 'running') audio.suspend().catch(() => {});
  ouvrir('fen-pause');
}
function reprendre() {
  enPause = false;
  document.body.classList.remove('en-pause');
  fermer('fen-pause');
  debloquerAudio();
}

/* ---------- Boutique ---------- */
function ouvrirBoutique() {
  if (!enJeu()) return;
  debloquerAudio();
  if (partie.n < DES.boutique) { SONS.erreur(); texteInfo(t('info.boutiqueBientot', { n: DES.boutique }), true); return; }
  SONS.clic();
  choix = null;
  $('boutique-message').textContent = '';
  rendreBoutique();
  ouvrir('fen-boutique');
}
function boutonAchat(contenu, prix, label, f, large) {
  const b = document.createElement('button');
  b.className = 'btn secondaire achat' + (large ? ' large' : '');
  b.innerHTML = `${contenu}<span class="prix">${ICONES.piece}${nombre(prix)}</span>`;
  b.setAttribute('aria-label', label + ' — ' + t('boutique.prix', { n: prix }));
  if (partie.pieces < prix) b.setAttribute('aria-disabled', 'true');
  b.addEventListener('click', f);
  return b;
}
function rendreBoutique() {
  const p = partie;
  $('boutique-pieces').innerHTML = `${ICONES.piece}<span>${t('boutique.pieces', { n: p.pieces })}</span>`;
  const liste = $('boutique-liste');
  liste.innerHTML = '';
  const rayon = (titreCle, aide) => {
    const r = document.createElement('div');
    r.className = 'rayon';
    r.innerHTML = `<h3>${t(titreCle)}</h3>${aide ? `<p>${aide}</p>` : ''}`;
    liste.appendChild(r);
    return r;
  };
  const r1 = rayon('boutique.objets', t('boutique.objetsAide'));
  const grille = document.createElement('div');
  grille.className = 'rayon-objets';
  p.def.ch.forEach((c) => {
    [1, 2].forEach((n) => {
      const quoi = n === 1 ? 'objet1' : 'objet2';
      grille.appendChild(boutonAchat(dessinObjet({ c, n }), prixDe(p, quoi), nomObjet({ c, n }), () => achat(quoi, c)));
    });
  });
  r1.appendChild(grille);
  const r2 = rayon('boutique.services');
  if (cadenasRestants(p)) r2.appendChild(boutonAchat(`${dessinCadenas({ f: 0, max: 3 })}<span>${t('boutique.cadenas')}</span>`, PRIX.cadenas, t('boutique.cadenas'), () => achat('cadenas'), true));
  r2.appendChild(boutonAchat(`${ICONES.bobine}<span>${t('boutique.bobines', { n: BOBINES_ACHAT })}</span>`, prixBobines(p), t('boutique.bobines', { n: BOBINES_ACHAT }), () => achat('bobines'), true));
  if (p.n >= DES.ameli) {
    if (p.ameli < PRIX.ameli.length) {
      r2.appendChild(boutonAchat(`${ICONES.generateur}<span>${t('boutique.ameli', { n: Math.round(AMELI_CHANCE[p.ameli + 1] * 100) })}</span>`, prixAmeli(p), t('boutique.ameli', { n: Math.round(AMELI_CHANCE[p.ameli + 1] * 100) }), () => achat('ameli'), true));
    } else {
      const m = document.createElement('p');
      m.textContent = t('boutique.ameliMax');
      r2.appendChild(m);
    }
  }
  if (p.n >= DES.joker) r2.appendChild(boutonAchat(`${dessinObjet({ c: J, n: 0 })}<span>${t('obj.joker')}</span>`, PRIX.joker, t('obj.joker'), () => achat('joker'), true));
}
function achat(quoi, chaine) {
  const r = acheter(partie, quoi, chaine);
  const msg = $('boutique-message');
  if (!r.ok) {
    SONS.erreur();
    msg.textContent = t('boutique.refus.' + (r.raison || 'pieces'));
    secouer(msg);
    return;
  }
  SONS.achat();
  msg.textContent = t('boutique.achete');
  rendreBoutique();
  rendreTout();
  if (r.i >= 0) animerCase(r.i, 'apparait');
  if (quoi === 'cadenas' && r.i >= 0) { const c = centre(casesDom[r.i]); etincelles(c.x, c.y, ['#cbd5e1', '#fde047'], 12); }
  apres(false);
  if (partie && partie.fin) fermer('fen-boutique');
}

/* ---------- Glisser-déposer (doigt et souris) ---------- */
function cibleSous(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  const cs = el.closest('.case');
  if (cs) return { type: 'case', i: +cs.dataset.i };
  const cmd = el.closest('.commande');
  if (cmd && cmd.dataset.k !== undefined) return { type: 'cmd', k: +cmd.dataset.k };
  if (el.closest('#b-vendre') && partie && partie.n >= DES.vente) return { type: 'vente' };
  return null;
}
function nettoyerSurvol() {
  document.querySelectorAll('.survol, .commande.cible, #b-vendre.cible').forEach((e) => e.classList.remove('survol', 'cible'));
}
function annulerGlisse() {
  if (glisse && glisse.fantome) glisse.fantome.remove();
  glisse = null;
  nettoyerSurvol();
  if (partie) rendreGrille();
}
function surPointerDown(e) {
  document.body.classList.remove('clavier');
  if (!enJeu()) return;
  const el = e.target.closest('.case');
  if (!el) return;
  e.preventDefault();
  debloquerAudio();
  glisse = { de: +el.dataset.i, x0: e.clientX, y0: e.clientY, actif: false, id: e.pointerId, fantome: null };
}
function surPointerMove(e) {
  if (!glisse || e.pointerId !== glisse.id) return;
  if (!glisse.actif) {
    if (Math.hypot(e.clientX - glisse.x0, e.clientY - glisse.y0) < 8) return;
    if (!mobile(partie, glisse.de) || !enJeu()) { glisse = null; return; }
    glisse.actif = true;
    choix = null;
    const f = document.createElement('div');
    f.className = 'fantome';
    f.innerHTML = dessinObjet(partie.cases[glisse.de].o);
    document.body.appendChild(f);
    glisse.fantome = f;
    rendreGrille();
    rendreCommandes();
  }
  glisse.fantome.style.left = e.clientX + 'px';
  glisse.fantome.style.top = e.clientY + 'px';
  nettoyerSurvol();
  const c = cibleSous(e.clientX, e.clientY);
  if (c && c.type === 'case' && c.i !== glisse.de) casesDom[c.i].classList.add('survol');
  else if (c && c.type === 'cmd') { const d = document.querySelector(`.commande[data-k="${c.k}"]`); if (d) d.classList.add('cible'); }
  else if (c && c.type === 'vente') $('b-vendre').classList.add('cible');
}
function surPointerUp(e) {
  if (!glisse || e.pointerId !== glisse.id) return;
  const g = glisse;
  glisse = null;
  nettoyerSurvol();
  if (g.actif) {
    g.fantome.remove();
    const c = cibleSous(e.clientX, e.clientY);
    if (c && enJeu()) lacher(g.de, c);
    else rendreGrille();
  } else {
    toucherCase(g.de);
  }
}

/* ---------- Clavier ---------- */
function surTouche(e) {
  const code = e.code;
  if (tutoOuvert) {
    if (['Enter', 'Space', 'Escape', 'NumpadEnter'].includes(code)) { e.preventDefault(); etapeTutoSuivante(); }
    return;
  }
  if (document.querySelector('jel-sauvegarde')) return; // fenêtre de reprise du module commun
  const fen = fenetreOuverte();
  if (fen) {
    if (code === 'Escape' || (code === 'KeyP' && fen === 'fen-pause')) {
      e.preventDefault();
      if (fen === 'fen-pause') reprendre();
      else if (fen === 'fen-boutique') fermer('fen-boutique');
      else if (fen === 'fen-objectif') action();
    }
    return;
  }
  const surBouton = e.target && e.target.closest && e.target.closest('button');
  if (ecran === 'titre') {
    if ((code === 'Enter' || code === 'Space') && !surBouton) { e.preventDefault(); jouer(); }
    return;
  }
  if (ecran === 'niveaux') {
    if (code === 'Escape') { e.preventDefault(); afficherTitre(); }
    return;
  }
  if (ecran !== 'jeu' || !partie) return;
  if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); ouvrirPause(); return; }
  if (!enJeu()) return;
  const fleches = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (fleches[code]) {
    e.preventDefault();
    document.body.classList.add('clavier');
    const [dx, dy] = fleches[code];
    const c = Math.min(COLS - 1, Math.max(0, (curseur % COLS) + dx));
    const r = Math.min(ROWS - 1, Math.max(0, Math.floor(curseur / COLS) + dy));
    curseur = idx(c, r);
    rendreGrille();
    return;
  }
  if ((code === 'Enter' || code === 'Space' || code === 'NumpadEnter') && !surBouton) {
    e.preventDefault();
    document.body.classList.add('clavier');
    toucherCase(curseur);
    return;
  }
  if (code === 'KeyG') { e.preventDefault(); actionGenerer(); return; }
  if (code === 'KeyV') { e.preventDefault(); toucherVendre(); return; }
  if (code === 'KeyB') { e.preventDefault(); ouvrirBoutique(); return; }
  const chiffre = /^(?:Digit|Numpad)([1-3])$/.exec(code);
  if (chiffre) {
    e.preventDefault();
    const vis = visibles(partie);
    const cmd = vis[Number(chiffre[1]) - 1];
    if (cmd) toucherCommande(cmd.k);
  }
}

/* ==========================================================================
   Tutoriel animé (3 étapes au plus, passe d'un toucher)
   ========================================================================== */
let tutoOuvert = false, tutoEtapes = [], tutoIndex = 0, tutoAnim = null;
function caseDe(c, r) { return () => casesDom[idx(c, r)]; }
function premiereCase(test) {
  return () => {
    for (let i = 0; i < partie.cases.length; i++) if (test(partie.cases[i])) return casesDom[i];
    return $('grille');
  };
}
function lancerTutoNiveau() {
  const nv = partie.def.nouv;
  const E = [];
  const gen = () => $('b-generer');
  const cmds = () => $('commandes');
  if (nv === 'fusion') {
    E.push({ texte: 'tuto.fusion', de: caseDe(2, 1), a: caseDe(0, 0) });
    E.push({ texte: 'tuto.generer', sur: gen });
    E.push({ texte: 'tuto.livrer', de: caseDe(0, 0), a: () => document.querySelector('.commande') });
  } else if (nv === 'commandes') {
    E.push({ texte: 'tuto.commandes', sur: cmds });
    E.push({ texte: 'tuto.rangs', sur: caseDe(3, 1) });
  } else if (nv === 'tournage') {
    E.push({ texte: 'tuto.chaine', vars: { chaine: t('chaine.tournage') }, sur: caseDe(0, 2) });
    E.push({ texte: 'tuto.toucher', de: caseDe(0, 2), a: caseDe(4, 2), toucher2: true });
  } else if (nv === 'cadenas') {
    E.push({ texte: 'tuto.cadenas', sur: caseDe(2, 2) });
    E.push({ texte: 'tuto.cadenas2', de: caseDe(1, 2), a: caseDe(3, 2) });
  } else if (nv === 'vente') {
    E.push({ texte: 'tuto.vente', de: caseDe(4, 4), a: () => $('b-vendre') });
    E.push({ texte: 'tuto.place', sur: () => $('grille') });
  } else if (nv === 'boutique') {
    E.push({ texte: 'tuto.boutique', sur: () => $('b-boutique') });
    E.push({ texte: 'tuto.pieces', sur: () => $('c-pieces') });
  } else if (['costume', 'gloire', 'musique'].includes(nv)) {
    E.push({ texte: 'tuto.rang', vars: { rang: nomRang(rangNominal(partie.n)) }, sur: () => $('xp') });
    E.push({ texte: 'tuto.chaine', vars: { chaine: t('chaine.' + nv) }, sur: premiereCase((k) => k.o && k.o.c === nv) });
  } else if (nv === 'ameli') {
    E.push({ texte: 'tuto.ameli', sur: () => $('b-boutique') });
  } else if (nv === 'malle') {
    E.push({ texte: 'tuto.malle', sur: premiereCase((k) => k.malle) });
  } else if (nv === 'rang4') {
    E.push({ texte: 'tuto.rang4', sur: () => document.querySelector('.commande') || cmds() });
  } else if (nv === 'express') {
    E.push({ texte: 'tuto.express', sur: () => document.querySelector('.badge-express') || cmds() });
  } else if (nv === 'spot') {
    E.push({ texte: 'tuto.spot', sur: premiereCase((k) => k.spot) });
  } else if (nv === 'joker') {
    E.push({ texte: 'tuto.joker', de: caseDe(0, 0), a: caseDe(3, 0) });
  } else if (nv === 'double') {
    E.push({ texte: 'tuto.double', sur: () => document.querySelector('.commande') || cmds() });
  } else if (nv === 'dore') {
    E.push({ texte: 'tuto.dore', sur: premiereCase((k) => k.v && k.v.max > 3) });
  }
  if (E.length) ouvrirTuto(E);
}
function ouvrirTuto(etapes) {
  tutoEtapes = etapes; tutoIndex = 0; tutoOuvert = true;
  $('tuto').classList.add('ouvert');
  $('tuto-main').innerHTML = DESSIN_MAIN;
  montrerEtape();
}
function montrerEtape() {
  const e = tutoEtapes[tutoIndex];
  if (!e) { fermerTuto(); return; }
  $('tuto-texte').textContent = t(e.texte, e.vars || {});
  const main = $('tuto-main');
  if (tutoAnim) { tutoAnim.cancel(); tutoAnim = null; }
  const cible = $('tuto-cible');
  const elA = (e.sur || e.de)();
  const a = elA ? elA.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
  const zoneEl = e.sur ? elA : (e.a ? e.a() : null);
  const z = zoneEl ? zoneEl.getBoundingClientRect() : a;
  cible.style.left = (z.left - 4) + 'px'; cible.style.top = (z.top - 4) + 'px';
  cible.style.width = (z.width + 8) + 'px'; cible.style.height = (z.height + 8) + 'px';
  const ax = a.left + a.width / 2 - 14, ay = a.top + a.height / 2 - 6;
  if (e.sur) {
    tutoAnim = main.animate([
      { transform: `translate(${ax}px, ${ay + 18}px) scale(1)` },
      { transform: `translate(${ax}px, ${ay}px) scale(.85)` },
      { transform: `translate(${ax}px, ${ay + 18}px) scale(1)` },
    ], { duration: 1100, iterations: Infinity });
  } else {
    const b = e.a ? e.a().getBoundingClientRect() : a;
    const bx = b.left + b.width / 2 - 14, by = b.top + b.height / 2 - 6;
    tutoAnim = main.animate([
      { transform: `translate(${ax}px, ${ay}px) scale(1)`, opacity: 0 },
      { transform: `translate(${ax}px, ${ay}px) scale(.85)`, opacity: 1, offset: 0.15 },
      { transform: `translate(${bx}px, ${by}px) scale(.85)`, opacity: 1, offset: e.toucher2 ? 0.2 : 0.7 },
      { transform: `translate(${bx}px, ${by}px) scale(1)`, opacity: 1, offset: 0.85 },
      { transform: `translate(${bx}px, ${by}px) scale(1)`, opacity: 0 },
    ], { duration: 1800, iterations: Infinity });
  }
  // La bulle se place à l'opposé de la cible.
  const bulle = $('tuto-bulle');
  const milieu = z.top + z.height / 2;
  if (milieu > innerHeight / 2) { bulle.style.top = '70px'; bulle.style.bottom = ''; }
  else { bulle.style.bottom = '90px'; bulle.style.top = ''; }
}
function etapeTutoSuivante() {
  SONS.clic();
  tutoIndex++;
  if (tutoIndex >= tutoEtapes.length) fermerTuto(); else montrerEtape();
}
function fermerTuto() {
  tutoOuvert = false;
  $('tuto').classList.remove('ouvert');
  if (tutoAnim) { tutoAnim.cancel(); tutoAnim = null; }
}

/* ==========================================================================
   Démarrage
   ========================================================================== */
function init() {
  chargerProfil();
  $('dessin-titre').innerHTML = dessinTitre();
  $('b-retour-niveaux').innerHTML = ICONES.retour;
  $('b-pause').innerHTML = ICONES.pause;
  majBoutonsSon();
  construireGrille();
  majTitre();

  $('b-jouer').addEventListener('click', jouer);
  $('b-niveaux').addEventListener('click', () => { debloquerAudio(); SONS.clic(); afficherNiveaux(); });
  $('b-retour-niveaux').addEventListener('click', () => { SONS.clic(); afficherTitre(); });
  $('b-son-titre').addEventListener('click', basculerSon);
  $('b-son').addEventListener('click', basculerSon);
  $('b-son-pause').addEventListener('click', basculerSon);
  $('b-pause').addEventListener('click', () => { debloquerAudio(); SONS.clic(); ouvrirPause(); });
  $('b-reprendre').addEventListener('click', () => { reprendre(); SONS.clic(); });
  $('b-recommencer').addEventListener('click', () => { const n = partie ? partie.n : 1; reprendre(); demarrer(n); });
  $('b-accueil').addEventListener('click', () => { reprendre(); afficherTitre(); });
  $('b-action').addEventListener('click', action);
  $('b-generer').addEventListener('click', actionGenerer);
  $('b-vendre').addEventListener('click', toucherVendre);
  $('b-boutique').addEventListener('click', ouvrirBoutique);
  $('b-fermer-boutique').addEventListener('click', () => { SONS.clic(); fermer('fen-boutique'); infoParDefaut(); });
  $('tuto').addEventListener('click', etapeTutoSuivante);

  const grille = $('grille');
  grille.addEventListener('pointerdown', surPointerDown);
  window.addEventListener('pointermove', surPointerMove);
  window.addEventListener('pointerup', surPointerUp);
  window.addEventListener('pointercancel', annulerGlisse);
  window.addEventListener('mousedown', () => document.body.classList.add('souris'), true);
  window.addEventListener('touchstart', () => document.body.classList.add('souris'), { capture: true, passive: true });
  window.addEventListener('keydown', (e) => { document.body.classList.remove('souris'); surTouche(e); });
  window.addEventListener('resize', () => { ajuster(); if (tutoOuvert) montrerEtape(); });
  // La zone de la grille peut changer de taille sans « resize » (barre du navigateur, commandes…).
  if (window.ResizeObserver) new ResizeObserver(() => ajuster()).observe($('zone-grille'));
  document.addEventListener('contextmenu', (e) => { if (ecran === 'jeu') e.preventDefault(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') ouvrirPause(); });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie.
  window.JEL_SAVE.surFermeture(() => {
    if (ecran === 'jeu' && partie && !partie.fin) sauver(partie.n, scoreDe(partie));
  });
  window.JEL_I18N.surChangement && window.JEL_I18N.surChangement(() => { majBoutonsSon(); majTitre(); if (partie) { rendreTout(); infoParDefaut(); } });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
