     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }

  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });

    window.addEventListener('beforeunload', appeler);

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }

    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');

    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {

    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;

    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });

    var carte = document.createElement('div');

    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')

    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();

      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }

  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();

.peinture.pris{outline:4px solid var(--vert);outline-offset:1px}
.peinture.ferme{opacity:.55}
.sous-titre{font-weight:900;text-align:left;margin:14px 0 6px;font-size:17px}

/* Carte de présentation (tutoriel et nouveautés) */
#carteCanvas{width:100%;max-width:440px;aspect-ratio:16/9;border-radius:18px;background:#cdeefc;display:block;margin:0 auto 10px}
.etapes{list-style:none;padding:0;margin:6px 0 10px;text-align:left}
.etapes li{padding:7px 10px;border-radius:12px;margin:4px 0;font-weight:700;font-size:16px;color:var(--encre-douce);display:flex;gap:8px;align-items:center}
.etapes li b{display:inline-flex;width:28px;height:28px;border-radius:50%;background:#e5ebf2;align-items:center;justify-content:center;flex:none}
.etapes li.active{background:#fff2df;color:var(--encre)}
.etapes li.active b{background:var(--accent);color:#fff}
#carteTexte{font-size:17px;font-weight:700;line-height:1.35;margin:4px 0 12px}

/* Fin de vol */
.medailles{display:flex;justify-content:center;gap:8px;margin:8px 0}
.medaille{flex:1;max-width:130px;border-radius:16px;background:#eef3f9;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:13px;color:#8a9bb0;transition:transform .3s,background .3s,color .3s;line-height:1.15}
.medaille svg{width:34px;height:34px;opacity:.45;transition:opacity .3s}
.medaille.gagne{background:#fff2c9;color:var(--encre);transform:scale(1.06)}
.medaille.gagne svg{opacity:1}
.etoiles-fin{display:flex;justify-content:center;gap:6px;margin:4px 0}
.etoiles-fin svg{width:56px;height:56px;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.etoiles-fin svg.vue{transform:scale(1)}
.score{font-size:28px;font-weight:900;margin:4px 0}
.petit{font-size:15px;font-weight:700;color:var(--encre-douce);margin:3px 0}
.bonus{font-size:16px;font-weight:900;color:var(--vert);margin:4px 0}
.raison{font-size:17px;font-weight:700;margin:4px 0 8px}
</style>

<script>
(function () {
'use strict';

/* =====================================================================
   L'Atterrissage du Géant — un doigt pour poser un avion-cargo énorme.
   Appuyé en vol : le nez se lève (on plane). Lâché : on descend.
   Au sol : appuyé = freins. Toucher en douceur, près de la ligne dorée,
   s'arrêter avant la fin de la piste, sans faire tomber la cargaison.
   ===================================================================== */

const JEU = 'atterrissage-du-geant';
const t = (cle, vars) => window.JEL_I18N.t(cle, vars);
const nombre = (x) => window.JEL_I18N.nombre(x);
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, k) => a + (b - a) * k;
const PI = Math.PI;

/* ---------------------------------------------------------------------
   Données : les 20 vols, 5 pays de 4 vols.
   piste : longueur (m) ; visee : ligne dorée après le seuil (m) ;
   A0 : altitude de départ (m) ; R0 : distance jusqu'au seuil (m) ;
   tol : écart permis autour de la ligne pour l'étoile « précision » (m) ;
   vent : vent de face (+) ou arrière (−) en m/s ; pente : pente de la piste ;
   rafales/amp : nombre et force des rafales ; oiseaux : vols d'oiseaux ;
   nuages : couche [bas, haut] en m ; thermiques : courants chauds ;
   navire : porte-avions (amp : houle en m, per : période en s) ;
   cargo : objets de la soute (« * » = fragile) ; intro : carte de nouveauté.
   --------------------------------------------------------------------- */
const NIVEAUX = [
  { pays: 0, piste: 1500, visee: 260, A0: 85, R0: 1100, tol: 60, cargo: ['girafe'], intro: 'base' },
  { pays: 0, piste: 1300, visee: 240, A0: 95, R0: 1250, tol: 50, cargo: ['girafe'], intro: 'visee' },
  { pays: 0, piste: 1050, visee: 220, A0: 105, R0: 1350, tol: 48, cargo: ['girafe', 'piano', 'gateau'], intro: 'cargo' },
  { pays: 0, piste: 1000, visee: 220, A0: 110, R0: 1400, tol: 45, cargo: ['girafe', 'piano'], rafales: 4, amp: 2.6, intro: 'rafales' },
  { pays: 1, piste: 950, visee: 210, A0: 110, R0: 1400, tol: 45, cargo: ['pingouins', 'gateau'], vent: -5, rafales: 2, amp: 2.2, intro: 'vent' },
  { pays: 1, piste: 950, visee: 200, A0: 115, R0: 1450, tol: 42, cargo: ['piano', 'girafe', 'pingouins'], pente: 0.025, intro: 'pente' },
  { pays: 1, piste: 900, visee: 200, A0: 115, R0: 1500, tol: 40, cargo: ['girafe', 'gateau', 'piano'], vent: -3, oiseaux: 3, intro: 'oiseaux' },
  { pays: 1, piste: 900, visee: 190, A0: 120, R0: 1500, tol: 40, cargo: ['gateau', 'pingouins', 'piano'], pente: -0.022, vent: -4, rafales: 4, amp: 2.6 },
  { pays: 2, piste: 1000, visee: 200, A0: 115, R0: 1450, tol: 40, cargo: ['pingouins', 'girafe'], neige: true, intro: 'neige' },
  { pays: 2, piste: 950, visee: 200, A0: 125, R0: 1500, tol: 40, cargo: ['piano', 'pingouins'], neige: true, nuages: [30, 85], intro: 'nuages' },
  { pays: 2, piste: 820, visee: 170, A0: 120, R0: 1500, tol: 36, cargo: ['girafe', 'gateau', 'pingouins'], neige: true, oiseaux: 4, rafales: 3, amp: 2.4, intro: 'courte' },
  { pays: 2, piste: 900, visee: 180, A0: 120, R0: 1500, tol: 36, cargo: ['aquarium*', 'girafe', 'piano'], neige: true, pente: 0.022, intro: 'fragile' },
  { pays: 3, piste: 850, visee: 180, A0: 115, R0: 1550, tol: 35, cargo: ['aquarium*', 'pingouins', 'gateau'], thermiques: 3, intro: 'thermiques' },
  { pays: 3, piste: 700, visee: 130, A0: 110, R0: 1500, tol: 32, cargo: ['vase*', 'piano', 'girafe'], thermiques: 2, rafales: 2, amp: 2.4 },
  { pays: 3, piste: 760, visee: 150, A0: 125, R0: 1600, tol: 32, cargo: ['gateau*', 'aquarium*', 'pingouins'], nuages: [28, 80], oiseaux: 4, vent: -5, thermiques: 2 },
  { pays: 3, piste: 780, visee: 150, A0: 120, R0: 1600, tol: 30, cargo: ['vase*', 'girafe', 'piano'], soir: true, thermiques: 3, rafales: 4, amp: 2.6, pente: -0.015, intro: 'soir' },
  { pays: 4, piste: 420, visee: 85, A0: 100, R0: 1450, tol: 30, cargo: ['girafe', 'piano', 'pingouins'], navire: { amp: 1.4, per: 7 }, intro: 'navire' },
  { pays: 4, piste: 400, visee: 85, A0: 105, R0: 1500, tol: 28, cargo: ['aquarium*', 'gateau', 'girafe'], navire: { amp: 3.0, per: 5.6 }, rafales: 4, amp: 2.4, intro: 'vagues' },
  { pays: 4, piste: 400, visee: 85, A0: 115, R0: 1550, tol: 28, cargo: ['vase*', 'pingouins', 'piano'], navire: { amp: 2.4, per: 6 }, nuages: [42, 95], oiseaux: 4 },
  { pays: 4, piste: 380, visee: 80, A0: 120, R0: 1600, tol: 26, cargo: ['aquarium*', 'gateau*', 'girafe'], navire: { amp: 3.4, per: 5 }, rafales: 5, amp: 2.8, oiseaux: 5, nuages: [45, 100], vent: -3 },
];
window.JEL_NIVEAUX = NIVEAUX.length;

// Les objets de la soute : raideur (k), amortissement (c), sensibilité au
// freinage (g) et aux chocs verticaux (v), angle au-delà duquel ils tombent.
const CARGOS = {
  girafe:    { k: 13, c: 2.0, g: 1.0, v: 1.25, max: 0.55 },
  piano:     { k: 24, c: 3.0, g: 0.85, v: 0.8, max: 0.42 },
  gateau:    { k: 18, c: 2.4, g: 1.0, v: 1.1, max: 0.42 },
  aquarium:  { k: 20, c: 2.6, g: 1.0, v: 1.0, max: 0.42 },
  pingouins: { k: 15, c: 2.0, g: 0.9, v: 1.2, max: 0.5 },
  vase:      { k: 20, c: 2.4, g: 1.0, v: 1.0, max: 0.4 },
};
const FRAGILE = 0.8; // un objet fragile tombe plus tôt

// Les avions du hangar (étoiles nécessaires, petites différences de pilotage).
const AVIONS = [
  { id: 'cargo', etoiles: 0, longueur: 1, freins: 1, decrochage: 44, coussin: 1, rebond: 3.1 },
  { id: 'helices', etoiles: 12, longueur: 0.86, freins: 1, decrochage: 40, coussin: 1.1, rebond: 3.1 },
  { id: 'postal', etoiles: 24, longueur: 0.72, freins: 1.15, decrochage: 44, coussin: 0.95, rebond: 3.0 },
  { id: 'hydravion', etoiles: 40, longueur: 0.9, freins: 0.95, decrochage: 43, coussin: 1.35, rebond: 3.3 },
];
const PEINTURES = [
  { id: 'bleu', etoiles: 0, corps: '#f4f7fb', ventre: '#c9d6e6', bande: '#2f6fd6', queue: '#2f6fd6' },
  { id: 'rouge', etoiles: 6, corps: '#e8473c', ventre: '#f6e9dc', bande: '#ffd34d', queue: '#b5281f' },
  { id: 'soleil', etoiles: 15, corps: '#ffd447', ventre: '#fff3c4', bande: '#ff7a1a', queue: '#ff7a1a' },
  { id: 'jungle', etoiles: 30, corps: '#4caf6a', ventre: '#d9f2c4', bande: '#1f6b3a', queue: '#ffcf3a' },
  { id: 'arcenciel', etoiles: 45, corps: '#ffffff', ventre: '#e6e9ff', bande: 'arc', queue: '#7d5cff' },
  { id: 'girafe', etoiles: 55, corps: '#f2c14e', ventre: '#fbe7b0', bande: '#8a5a2b', queue: '#8a5a2b', taches: true },
];

// Couleurs des pays.
const DECORS = [
  { ciel: ['#5fb4ef', '#d4f1ff'], loin: '#a9d8a0', milieu: '#7cc46d', sol: '#67b551', face: '#8a6440', herbe: '#4f9a3e', piste: '#5d6470', bord: '#47505c' },
  { ciel: ['#7aa8ec', '#f6dcf0'], loin: '#b9a7dc', milieu: '#93c27a', sol: '#86b85c', face: '#8c6a48', herbe: '#6b9c46', piste: '#5f6572', bord: '#4a505c' },
  { ciel: ['#8fbde8', '#eef6fd'], loin: '#cfdcea', milieu: '#7d9bb5', sol: '#f3f7fb', face: '#9aa9bb', herbe: '#dde7f1', piste: '#7f8796', bord: '#6a7282' },
  { ciel: ['#f5a85e', '#fde8bd'], loin: '#eab77b', milieu: '#d9a15e', sol: '#e9c582', face: '#b98a4c', herbe: '#d8b06a', piste: '#6d6660', bord: '#58524c' },
  { ciel: ['#5fb0ea', '#dcf3ff'], loin: '#8fc5d9', milieu: '#3a8fc9', sol: '#2e86c8', face: '#1f5f94', herbe: '#2e86c8', piste: '#6b7380', bord: '#525a66' },
];
const SOIR = { ciel: ['#23245a', '#d0688a'], loin: '#6b4f7a', milieu: '#7a5466', sol: '#a98a63', face: '#6e5338', herbe: '#957650', piste: '#3e3f48', bord: '#2f3038' };

/* ---------------------------------------------------------------------
   Petit générateur de hasard reproductible (le même vol est toujours le même).
   --------------------------------------------------------------------- */
function hasard(graine) {
  let a = graine >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let x = a;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
// Hachage d'un entier (décors posés le long du chemin).
function h01(n) { let x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

/* ---------------------------------------------------------------------
   Sauvegarde et progression
   --------------------------------------------------------------------- */
let prog = { niveau: 1, etoiles: [], records: [], avion: 'cargo', peinture: 'bleu', vus: [], son: true };

function lireSauvegarde() {
  let d = null;
  try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
  d = d || {};
  prog.niveau = clamp(parseInt(d.niveau, 10) || 1, 1, NIVEAUX.length);
  prog.etoiles = NIVEAUX.map((_, i) => clamp(parseInt((d.etoiles || [])[i], 10) || 0, 0, 3));
  prog.records = NIVEAUX.map((_, i) => Math.max(0, parseInt((d.records || [])[i], 10) || 0));
  prog.avion = AVIONS.some((a) => a.id === d.avion) ? d.avion : 'cargo';
  prog.peinture = PEINTURES.some((p) => p.id === d.peinture) ? d.peinture : 'bleu';
  prog.vus = Array.isArray(d.vus) ? d.vus.filter((x) => typeof x === 'string').slice(0, 40) : [];
  const o = d.options || {};
  prog.son = o.son !== false;
  // Un avion ou une peinture plus chers que les étoiles gagnées : on revient au départ.
  if (!debloque(AVIONS.find((a) => a.id === prog.avion))) prog.avion = 'cargo';
  if (!debloque(PEINTURES.find((p) => p.id === prog.peinture))) prog.peinture = 'bleu';
}
function totalEtoiles() { return prog.etoiles.reduce((a, b) => a + b, 0); }
function debloque(objet) { return !!objet && totalEtoiles() >= objet.etoiles; }
// Dernier vol ouvert : le vol où reprendre, ou celui qui suit le dernier réussi.
function dernierOuvert() {
  let n = prog.niveau;
  prog.etoiles.forEach((e, i) => { if (e > 0) n = Math.max(n, i + 2); });
  return clamp(n, 1, NIVEAUX.length);
}
function ecrireSauvegarde(extra) {
  if (apercu || affiche) return;
  const d = Object.assign({
    niveau: prog.niveau, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
    avion: prog.avion, peinture: prog.peinture, vus: prog.vus.slice(), options: { son: prog.son },
  }, extra || {});
  try { window.JEL_SAVE.save(JEU, d); } catch (e) { /* sauvegarde impossible : le jeu continue */ }
}

/* ---------------------------------------------------------------------
   Sons (Web Audio, rien avant le premier geste du joueur)
   --------------------------------------------------------------------- */
const Son = {
  ctx: null, maitre: null, bruitBuf: null, moteur: null,
  init() {
    if (this.ctx || apercu || affiche) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.maitre = this.ctx.createGain();
      this.maitre.gain.value = prog.son ? 0.8 : 0;
      this.maitre.connect(this.ctx.destination);
      const n = this.ctx.sampleRate * 1.5;
      this.bruitBuf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const c = this.bruitBuf.getChannelData(0);
      for (let i = 0; i < n; i++) c[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  muet() { if (this.maitre) this.maitre.gain.setTargetAtTime(prog.son ? 0.8 : 0, this.ctx.currentTime, 0.03); },
  ton(f, duree, type, vol, glisse, delai) {
    if (!this.ctx) return;
    try {
      const c = this.ctx, t0 = c.currentTime + (delai || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f, t0);
      if (glisse) o.frequency.exponentialRampToValueAtTime(Math.max(20, glisse), t0 + duree);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
      o.connect(g); g.connect(this.maitre);
      o.start(t0); o.stop(t0 + duree + 0.05);
    } catch (e) { /* son ignoré */ }
  },
  bruit(duree, vol, freq, type, delai) {
    if (!this.ctx) return;
    try {
      const c = this.ctx, t0 = c.currentTime + (delai || 0);
      const s = c.createBufferSource(); s.buffer = this.bruitBuf;
      const f = c.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq || 1000;
      const g = c.createGain();
      g.gain.setValueAtTime(vol || 0.2, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
      s.connect(f); f.connect(g); g.connect(this.maitre);
      s.start(t0, Math.random()); s.stop(t0 + duree + 0.05);
    } catch (e) { /* son ignoré */ }
  },
  clic() { this.ton(660, 0.08, 'triangle', 0.15); },
  // Moteur : ronronnement grave + souffle du vent, réglés à chaque image.
  demarrerMoteur() {
    if (!this.ctx || this.moteur) return;
    try {
      const c = this.ctx;
      const o1 = c.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 62;
      const o2 = c.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 124;
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380;
      const g = c.createGain(); g.gain.value = 0.0001;
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(this.maitre);
      const b = c.createBufferSource(); b.buffer = this.bruitBuf; b.loop = true;
      const fb = c.createBiquadFilter(); fb.type = 'bandpass'; fb.frequency.value = 700; fb.Q.value = 0.6;
      const gb = c.createGain(); gb.gain.value = 0.0001;
      b.connect(fb); fb.connect(gb); gb.connect(this.maitre);
      o1.start(); o2.start(); b.start();
      this.moteur = { o1, o2, f, g, b, fb, gb };
    } catch (e) { this.moteur = null; }
  },
  reglerMoteur(vitesse, enVol, frein) {
    const m = this.moteur; if (!m) return;
    const tt = this.ctx.currentTime;
    m.o1.frequency.setTargetAtTime(48 + vitesse * 0.55, tt, 0.1);
    m.o2.frequency.setTargetAtTime(96 + vitesse * 1.1, tt, 0.1);
    m.g.gain.setTargetAtTime(enVol ? 0.06 : 0.02 + vitesse * 0.0006, tt, 0.15);
    m.fb.frequency.setTargetAtTime(frein ? 2600 : 500 + vitesse * 8, tt, 0.1);
    m.gb.gain.setTargetAtTime(frein ? 0.05 + vitesse * 0.001 : 0.012 + vitesse * 0.0004, tt, 0.12);
  },
  arreterMoteur() {
    const m = this.moteur; if (!m) return;
    this.moteur = null;
    try {
      const tt = this.ctx.currentTime;
      m.g.gain.setTargetAtTime(0.0001, tt, 0.2); m.gb.gain.setTargetAtTime(0.0001, tt, 0.2);
      m.o1.stop(tt + 1); m.o2.stop(tt + 1); m.b.stop(tt + 1);
    } catch (e) { /* rien */ }
  },
  pneus(force) { this.bruit(0.35, 0.12 + force * 0.08, 2400, 'highpass'); this.ton(900, 0.18, 'square', 0.03, 500); },
  rebond() { this.ton(180, 0.35, 'sine', 0.3, 520); this.ton(240, 0.25, 'triangle', 0.12, 120, 0.12); },
  boum() { this.bruit(0.6, 0.4, 300, 'lowpass'); this.ton(90, 0.5, 'sine', 0.35, 40); },
  oiseau() { for (let i = 0; i < 3; i++) this.ton(1800 + i * 300, 0.09, 'square', 0.05, 2600, i * 0.07); this.bruit(0.25, 0.1, 3000); },
  decroche() { this.ton(880, 0.12, 'square', 0.08); this.ton(880, 0.12, 'square', 0.08, null, 0.18); },
  crochet() { this.ton(140, 0.4, 'sawtooth', 0.12, 60); this.bruit(0.5, 0.2, 800); },
  rafale() { this.bruit(0.9, 0.08, 500); },
  chute(type) {
    if (type === 'piano') { [196, 233, 277].forEach((f, i) => this.ton(f, 0.6, 'triangle', 0.12, null, i * 0.03)); this.boum(); }
    else if (type === 'aquarium') { this.bruit(0.7, 0.3, 1200); this.ton(500, 0.3, 'sine', 0.1, 1200, 0.1); }
    else if (type === 'gateau') { this.bruit(0.35, 0.3, 400, 'lowpass'); this.ton(300, 0.2, 'sine', 0.1, 120); }
    else if (type === 'vase') { this.ton(2400, 0.4, 'sine', 0.12); this.ton(3100, 0.35, 'sine', 0.1, null, 0.04); this.bruit(0.3, 0.2, 5000, 'highpass'); }
    else if (type === 'pingouins') { [900, 1100, 800].forEach((f, i) => this.ton(f, 0.12, 'square', 0.05, f * 0.7, i * 0.1)); }
    else { this.ton(900, 0.6, 'sine', 0.15, 200); } // girafe : sifflet qui glisse
  },
  vacille(type) {
    if (type === 'piano') this.ton([262, 294, 330, 349][Math.floor(Math.random() * 4)], 0.3, 'triangle', 0.05);
    else if (type === 'aquarium') this.bruit(0.25, 0.04, 900);
    else if (type === 'girafe') this.ton(420, 0.12, 'sine', 0.03, 520);
  },
  etoile(i) { this.ton(880 + i * 220, 0.25, 'triangle', 0.15); this.ton(1320 + i * 330, 0.3, 'sine', 0.08, null, 0.05); },
  victoire() { [523, 659, 784, 1046].forEach((f, i) => this.ton(f, 0.3, 'triangle', 0.15, null, i * 0.11)); },
  defaite() { [392, 370, 349, 262].forEach((f, i) => this.ton(f, i === 3 ? 0.6 : 0.25, 'sawtooth', 0.06, i === 3 ? 200 : null, i * 0.22)); },
  plouf() { this.bruit(0.9, 0.35, 900); this.ton(300, 0.4, 'sine', 0.15, 900); },
  filet() { this.ton(110, 0.5, 'sine', 0.3, 300); this.ton(160, 0.4, 'triangle', 0.15, 90, 0.2); },
};

/* ---------------------------------------------------------------------
   État du jeu
   --------------------------------------------------------------------- */
const cv = $('#jeu');
const ctx = cv.getContext('2d');
let W = 390, H = 844, dpr = 1;
let apercu = 0, affiche = false;

let phase = 'titre';    // titre, carte, vol, sol, arret, glissade, fin
let enPause = false;
let niv = 0;            // indice du vol joué
let L = null;           // vol construit
let P = null;           // l'avion
let cargo = [];         // objets de la soute
let appui = false;      // doigt (ou touche) appuyé
let tempsVol = 0, temps = 0;
let particules = [], confettis = [];
let cam = { s: 2, refY: 0, sx: 0.3, secousse: 0 };
let aides = {};         // aides déjà montrées pendant ce vol
let resultat = null;
let toastTimer = 0;

function avionChoisi() { return AVIONS.find((a) => a.id === prog.avion) || AVIONS[0]; }
function peintureChoisie() { return PEINTURES.find((p) => p.id === prog.peinture) || PEINTURES[0]; }
function decor() { return L && L.soir ? SOIR : DECORS[L ? L.pays : 0]; }

/* ---------------------------------------------------------------------
   Construction d'un vol
   --------------------------------------------------------------------- */
function construireNiveau(i) {
  const d = NIVEAUX[i];
  const r = hasard(1000 + i * 77);
  const n = Object.assign({ vent: 0, pente: 0, rafales: 0, amp: 0, oiseaux: 0, thermiques: 0, nuages: null, navire: null, neige: false, soir: false }, d);
  n.index = i;
  n.R1 = n.R0 + n.piste;
  n.aimX = n.R0 + n.visee;
  n.pontBase = n.navire ? 16 : 0;
  n.cableA = n.R0 + 45; n.cableB = n.R0 + 145;
  // Altitude du point visé et pente idéale (feux d'approche).
  // La pente idéale vise un peu avant la ligne : l'arrondi fait toucher juste dessus.
  n.papiX = n.aimX - 60;
  n.aimY = solBrut(n, n.papiX, 0);
  n.glisse = (n.A0 - n.aimY) / n.papiX;
  // Rafales : courtes poussées vers le haut ou le bas, sur l'approche.
  n.listeRafales = [];
  for (let k = 0; k < n.rafales; k++) {
    const x = n.R0 * (0.25 + 0.75 * (k + 0.3 + r() * 0.5) / n.rafales) - 60;
    n.listeRafales.push({ x, len: 60 + r() * 40, amp: (r() < 0.5 ? -1 : 1) * n.amp * (0.8 + r() * 0.4), vu: false });
  }
  // Courants chauds : colonnes qui soulèvent l'avion.
  n.listeThermiques = [];
  for (let k = 0; k < n.thermiques; k++) {
    const x = n.R0 * (0.3 + 0.62 * (k + 0.2 + r() * 0.6) / n.thermiques);
    n.listeThermiques.push({ x, len: 110 + r() * 60, force: 2.4 + r() * 0.8 });
  }
  // Oiseaux : petits groupes posés sur la pente idéale.
  n.listeOiseaux = [];
  for (let k = 0; k < n.oiseaux; k++) {
    const x = 280 + (n.R0 - 420) * (k + 0.2 + r() * 0.6) / n.oiseaux;
    const y = n.A0 - n.glisse * x + (r() * 14 - 5);
    const nb = 3 + Math.floor(r() * 3);
    const membres = [];
    for (let j = 0; j < nb; j++) membres.push({ dx: (j - nb / 2) * 6 + r() * 3, dy: Math.abs(j - nb / 2) * 2.2 + r() * 2, ph: r() * 6, fx: 0, fy: 0 });
    n.listeOiseaux.push({ x, y, membres, fuite: 0, touche: false });
  }
  return n;
}
// Hauteur du sol (m) au point x ; t : temps (houle du porte-avions).
function solBrut(n, x, tt) {
  if (n.navire) {
    if (x >= n.R0 && x <= n.R1) return n.pontBase + n.navire.amp * Math.sin(tt * 2 * PI / n.navire.per);
    return 0;
  }
  const p = n.pente;
  if (p >= 0) {
    if (x < n.R0) return 0;
    if (x <= n.R1) return (x - n.R0) * p;
    return (n.R1 - n.R0) * p;
  }
  const h0 = (n.R1 - n.R0) * -p;
  if (x < n.R0 - 340) return 0;
  if (x < n.R0) { const u = (x - (n.R0 - 340)) / 340; return h0 * u * u * (3 - 2 * u); }
  if (x <= n.R1) return h0 + (x - n.R0) * p;
  return 0;
}
function solY(x) { return solBrut(L, x, tempsVol); }
function vitesseSol() { // vitesse verticale du pont (houle)
  if (!L.navire) return 0;
  const w = 2 * PI / L.navire.per;
  return L.navire.amp * w * Math.cos(tempsVol * w);
}
function pentePiste(x) {
  if (L.navire || x < L.R0 || x > L.R1) return 0;
  return L.pente;
}
function surPiste(x) { return x >= L.R0 && x <= L.R1; }
function rafaleEn(x) {
  let a = 0;
  for (const g of L.listeRafales) {
    const u = (x - g.x) / g.len;
    if (u > 0 && u < 1) a += g.amp * Math.sin(PI * u) * 2.2;
  }
  return a;
}
function thermiqueEn(x) {
  let a = 0;
  for (const th of L.listeThermiques) {
    const u = (x - th.x) / th.len;
    if (u > 0 && u < 1) a += th.force * Math.sin(PI * u);
  }
  return a;
}

function nouvelAvion() {
  return { x: 0, y: L.A0, v: 66, vy: -2, pitch: 0, sol: false, frein: 0, decroche: 0, rebonds: 0,
    toucheX: null, toucheVy: null, crochet: false, tCrochet: 0, oiseaux: 0, plie: false, flotte: false, roue: 0, vPrec: 66 };
}
function nouvelleCargaison() {
  return L.cargo.map((c, i) => {
    const fragile = c.endsWith('*');
    const type = fragile ? c.slice(0, -1) : c;
    return { type, fragile, th: 0, om: 0, tombe: false, tTombe: 0, sens: i % 2 ? 1 : -1, eau: 0, vacille: 0 };
  });
}

/* ---------------------------------------------------------------------
   Déroulement : lancer un vol, cartes de nouveauté, fins
   --------------------------------------------------------------------- */
function lancerNiveau(i) {
  niv = clamp(i, 0, NIVEAUX.length - 1);
  L = construireNiveau(niv);
  P = nouvelAvion();
  cargo = nouvelleCargaison();
  particules = []; confettis = [];
  appui = false; tempsVol = 0; aides = {}; resultat = null;
  cam.s = echelleProche(); cam.refY = 0; cam.sx = 0.3; cam.secousse = 0;
  cacherEcrans();
  $('#hud').hidden = false;
  $('#hudTitre').textContent = t('hud.vol', { n: niv + 1 }) + ' · ' + t('pays.' + L.pays);
  enPause = false;
  const intro = L.intro;
  if (intro && prog.vus.indexOf(intro) < 0) montrerCarte(intro);
  else demarrerVol();
}
function demarrerVol() {
  $('#carte').hidden = true;
  phase = 'vol';
  Son.init(); Son.demarrerMoteur();
}
function cacherEcrans() { ['#ecranTitre', '#ecranVols', '#ecranHangar', '#carte', '#pause', '#fin'].forEach((s) => { $(s).hidden = true; }); }

// Cartes animées de présentation (tutoriel au vol 1, puis chaque nouveauté).
let carte = null;
function montrerCarte(cle) {
  phase = 'carte';
  carte = { cle, t: 0 };
  $('#carte').hidden = false;
  $('#carteTitre').textContent = t('carte.' + cle + '.titre');
  const ol = $('#carteEtapes');
  ol.innerHTML = '';
  if (cle === 'base') {
    for (let k = 1; k <= 3; k++) {

      li.append(b, s); ol.appendChild(li);
    }
    ol.hidden = false; $('#carteTexte').hidden = true;
  } else {
    ol.hidden = true; $('#carteTexte').hidden = false;
    $('#carteTexte').textContent = t('carte.' + cle + '.texte');
  }
  setTimeout(() => { try { $('#carteOk').focus(); } catch (e) { /* rien */ } }, 50);
}
function fermerCarte() {
  if (phase !== 'carte' || !carte) return;
  Son.init(); Son.clic();
  if (prog.vus.indexOf(carte.cle) < 0) prog.vus.push(carte.cle);
  carte = null;
  demarrerVol();
}

function echec(raison) {
  if (phase !== 'vol' && phase !== 'sol') return;
  resultat = { gagne: false, raison };
  phase = 'glissade';
  P.tGlisse = 0;
  cam.secousse = 0.6;
  if (raison === 'eau') { P.flotte = true; Son.plouf(); eclabousser(P.x, 0, 40); }
  else if (raison === 'sortie' && L.navire) { Son.filet(); }
  else if (raison === 'loin') { Son.ton(520, 0.5, 'sine', 0.15, 900); }
  else { P.plie = raison === 'dur' || raison === 'champ' || raison === 'coque'; Son.boum(); poussiere(P.x, solY(P.x), 30); }
  P.sol = raison !== 'loin';
  if (P.sol && !P.flotte) P.y = solY(P.x);
  if (raison === 'loin') P.pitch = 0.16;
  vibrer(80);
}
function reussite() {
  phase = 'arret';
  P.tArret = 0;
  const vr = Math.abs(P.toucheVy || 0);
  const ecart = Math.abs((P.toucheX || 0) - L.aimX);
  const av = avionChoisi();
  const doux = P.rebonds === 0 && vr <= 1.6;
  const precis = ecart <= L.tol;
  const intacte = cargo.every((c) => !c.tombe);
  let pts = 500;
  pts += Math.round(300 * clamp(1 - vr / av.rebond, 0, 1) * (P.rebonds ? 0.4 : 1));
  pts += Math.round(300 * clamp(1 - ecart / (L.tol * 3), 0, 1));
  for (const c of cargo) if (!c.tombe) pts += c.fragile ? 200 : 100;
  pts += Math.round(200 * clamp((L.R1 - P.x) / L.piste, 0, 1));
  pts -= 50 * P.oiseaux;
  pts = Math.max(100, pts);
  const crit = (doux ? 1 : 0) + (precis ? 1 : 0) + (intacte ? 1 : 0);
  resultat = { gagne: true, doux, precis, intacte, etoiles: Math.max(1, crit), score: pts };
  for (let k = 0; k < 90; k++) confettis.push(nouveauConfetti());
  Son.victoire();
}

function finirVol() {
  phase = 'fin';
  Son.arreterMoteur();
  $('#bulle').hidden = true;
  const r = resultat;
  const box = $('#fin');
  box.hidden = false;
  const avantTotal = totalEtoiles();
  $('#finBonus').hidden = true;
  $('#finHangar').hidden = true;
  if (r.gagne) {
    const ancien = prog.etoiles[niv];
    const ancienRecord = prog.records[niv];
    prog.etoiles[niv] = Math.max(ancien, r.etoiles);
    const record = r.score > ancienRecord;
    if (record) prog.records[niv] = r.score;
    prog.niveau = Math.max(prog.niveau, Math.min(NIVEAUX.length, niv + 2));
    ecrireSauvegarde({ niveau: prog.niveau, score: r.score });
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: niv + 1 });
    if (prog.etoiles.every((e) => e > 0)) {
      if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
    }
    $('#finTitre').textContent = t(r.etoiles === 3 ? 'fin.parfait' : 'fin.bravo');
    $('#finRaison').textContent = t('fin.pose', { n: niv + 1 });
    montrerMedailles(r);
    montrerEtoiles(r.etoiles);
    compterScore(r.score);
    $('#finRecord').textContent = record ? t('fin.record') : t('fin.meilleur', { n: nombre(prog.records[niv]) });
    // Avions et peintures débloqués par ce vol.
    const apres = totalEtoiles();
    const neufs = AVIONS.concat(PEINTURES).filter((o) => o.etoiles > avantTotal && o.etoiles <= apres);
    const derniers = niv === NIVEAUX.length - 1;
    if (derniers) {
      $('#finBonus').hidden = false;
      $('#finBonus').textContent = t('fin.tousLesVols', { n: apres, max: NIVEAUX.length * 3 });
      $('#finHangar').hidden = false;
    } else if (neufs.length) {
      $('#finBonus').hidden = false;
      $('#finBonus').textContent = t('fin.debloque');
      $('#finHangar').hidden = false;
    }
    $('#finSuivant').hidden = derniers;
    $('#finReessayer').hidden = true;
    $('#finRejouer').hidden = false;
    setTimeout(() => { try { (derniers ? $('#finRejouer') : $('#finSuivant')).focus(); } catch (e) { /* rien */ } }, 60);
  } else {
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: niv + 1 });
    Son.defaite();
    $('#finTitre').textContent = t('fin.rate');
    $('#finRaison').textContent = texteEchec(r.raison);
    $('#medailles').innerHTML = '';
    $('#finEtoiles').innerHTML = '';
    $('#finScore').textContent = '';
    $('#finRecord').textContent = t('fin.conseil.' + conseilEchec(r.raison));
    $('#finSuivant').hidden = true;
    $('#finReessayer').hidden = false;
    $('#finRejouer').hidden = true;
    setTimeout(() => { try { $('#finReessayer').focus(); } catch (e) { /* rien */ } }, 60);
  }
}
function texteEchec(raison) {
  if (raison === 'sortie') return t(L.navire ? 'echec.filet' : 'echec.sortie.' + (L.soir ? 3 : L.pays));
  if (raison === 'champ') return t('echec.champ.' + L.pays);
  return t('echec.' + raison);
}
function conseilEchec(raison) {
  return { sortie: 'freiner', champ: 'court', eau: 'court', coque: 'court', dur: 'arrondi', loin: 'long' }[raison] || 'arrondi';
}

const SVG_ETOILE = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="FILL" stroke="#c98a00" stroke-width="1.2" stroke-linejoin="round"/></svg>';
function etoileSvg(pleine) { return SVG_ETOILE.replace('FILL', pleine ? '#ffc928' : '#dfe6ee'); }
const ICONES = {

  cargaison: '<svg viewBox="0 0 40 40"><rect x="6" y="12" width="28" height="22" rx="3" fill="#c98a4b"/><path d="M6 19h28M20 12v22" stroke="#8a5a2b" stroke-width="2.5"/><path d="M13 12l4-6h6l4 6" fill="#e0a868"/></svg>',
};
function montrerMedailles(r) {

function compterScore(fin) {
  const el = $('#finScore');
  const t0 = performance.now();
  const pas = () => {
    const k = clamp((performance.now() - t0) / 1100, 0, 1);
    el.textContent = t('fin.score', { n: nombre(Math.round(fin * (1 - Math.pow(1 - k, 3)))) });
    if (k < 1 && phase === 'fin') requestAnimationFrame(pas);
  };

}

/* ---------------------------------------------------------------------
   Physique de l'avion
   --------------------------------------------------------------------- */
function physique(dt) {
  const av = avionChoisi();
  tempsVol += dt;
  if (P.sol) return physiqueSol(dt, av);
  // --- En vol ---
  const h = P.y - solY(P.x);
  // Décrochage : le nez tombe (moins fort tout près du sol, où l'avion se pose lourdement).
  const cible = P.decroche > 0 ? (h < 8 ? -3 : -9) : appui ? 9 : -5;
  P.pitch += clamp(cible - P.pitch, -22 * dt, 22 * dt);
  // Portance : plus l'avion est lent, moins il porte (on ne peut pas planer longtemps).
  const k = P.v / 62;
  let vyCible = 0.75 * P.pitch * k * k - 2.2 / Math.max(0.6, k);
  if (h < 10) vyCible += 0.9 * (1 - Math.max(0, h) / 10) * av.coussin; // effet de sol : l'air porte près du sol
  vyCible += thermiqueEn(P.x);
  P.vy += (vyCible - P.vy) * Math.min(1, dt * 1.7);
  const raf = rafaleEn(P.x);
  P.vy += raf * dt;
  P.vPrec = P.v;
  // Près de la piste, les moteurs passent au ralenti : l'avion perd de la vitesse.
  const ralenti = P.x > L.R0 - 150;
  P.v += (ralenti ? -2.4 - P.pitch * 0.3 : (66 - P.v) * 0.12 - P.pitch * 0.32) * dt;
  P.v = clamp(P.v, 30, 90);
  if (P.v < av.decrochage && P.decroche <= 0) { P.decroche = 1.1; if (h >= 8) Son.decroche(); }
  P.decroche = Math.max(0, P.decroche - dt);
  P.x += (P.v - L.vent) * dt;
  P.y += P.vy * dt;
  if (P.y > L.A0 + 140) { P.y = L.A0 + 140; P.vy = Math.min(P.vy, 0); }

  secouerCargo(dt, (P.vPrec - P.v) / dt, raf);
  // Rafale qui commence : petite secousse et souffle.
  for (const g of L.listeRafales) {
    if (!g.vu && P.x > g.x) { g.vu = true; Son.rafale(); for (const c of cargo) c.om += g.amp * 0.07 * c.sens; cam.secousse = Math.max(cam.secousse, 0.25); }
  }
  collisionsOiseaux();
  // Porte-avions : passer sous le niveau du pont avant le bord, c'est heurter la coque.
  const hSol = P.y - solY(P.x);
  if (L.navire && P.x >= L.R0 && P.x - (P.v - L.vent) * dt < L.R0 && hSol < -0.5) { echec('coque'); return; }

function toucher(av) {

  const vrel = P.vy - vSol;
  if (P.x > L.R1) { echec(L.navire ? 'sortie' : 'loin'); return; }
  if (!surPiste(P.x)) { echec(L.navire ? 'eau' : 'champ'); return; }
  if (P.toucheX === null) { P.toucheX = P.x; P.toucheVy = vrel; }
  cam.secousse = Math.max(cam.secousse, clamp(-vrel / 6, 0.1, 0.8));
  for (const c of cargo) c.om += c.sens * Math.abs(vrel) * 0.42 * CARGOS[c.type].v * (0.8 + 0.4 * h01(c.type.length + P.rebonds));
  fumee(P.x, solY(P.x), 8 + Math.abs(vrel) * 3);
  if (vrel < -7.5) { echec('dur'); return; }
  if (vrel < -av.rebond) {
    P.rebonds++;
    P.y = solY(P.x) + 0.05;
    P.vy = vSol + -vrel * 0.36;
    Son.rebond();
    toast(t('toast.rebond'));
    vibrer(40);
    return;
  }
  // Roues au sol !
  P.sol = true;
  P.v = Math.max(5, P.v - L.vent);
  P.y = solY(P.x);
  P.vy = 0;
  Son.pneus(Math.abs(vrel) / 3);
  if (L.navire && P.x >= L.cableA && P.x <= L.cableB) { P.crochet = true; Son.crochet(); toast(t('toast.crochet')); }
  else if (P.rebonds === 0 && Math.abs(vrel) <= 1.6) toast(t('toast.doux'));
  else if (Math.abs(P.toucheX - L.aimX) <= L.tol) toast(t('toast.ligne'));

}
function physiqueSol(dt, av) {
  P.pitch += clamp(0 - P.pitch, -14 * dt, 14 * dt);
  if (appui) P.frein = Math.min(1, P.frein + dt / 0.7); else P.frein = Math.max(0, P.frein - dt * 3);

  P.y = solY(P.x);
  P.roue += P.v * dt;
  secouerCargo(dt, dec, 0);
  // Fumée des freins.
  if (P.frein > 0.4 && P.v > 8 && Math.random() < dt * 30) fumee(P.x - 2, P.y, 3, true);
  if (L.neige && P.v > 6 && Math.random() < dt * 25) poudre(P.x - 3, P.y);

function collisionsOiseaux() {
  for (const g of L.listeOiseaux) {

    for (const m of g.membres) {
      const bx = g.x + m.dx, by = g.y + m.dy;
      if (Math.abs(bx - P.x - 4) < 30 && Math.abs(by - (P.y + 9)) < 8) {
        g.touche = true; g.fuite = 0.001;

        for (const c of cargo) c.om += 0.7 * c.sens;
        cam.secousse = 0.5;
        Son.oiseau();
        plumes(bx, by);
        toast(t('toast.oiseau'));
        vibrer(30);
        break;
      }
    }
    // Quand l'avion arrive tout près, les oiseaux s'envolent (ceux qu'on évite aussi).

function secouerCargo(dt, aLong, raf) {
  for (let i = 0; i < cargo.length; i++) {
    const c = cargo[i];
    if (c.tombe) { c.tTombe = Math.min(1, c.tTombe + dt * 2.5); continue; }
    const d = CARGOS[c.type];
    const F = aLong * 0.026 * d.g + raf * 0.02 * c.sens + 0.012 * Math.sin(temps * 1.7 + i * 2);
    c.om += (-d.k * (c.th - F) - d.c * c.om) * dt;

    if (Math.abs(c.th) > lim) {
      c.tombe = true; c.sens = c.th > 0 ? 1 : -1;

      toast(t('toast.tombe.' + c.type));
      vibrer(40);
    }

}
function majGlissade(dt) {
  P.tGlisse += dt;
  tempsVol += dt;
  if (resultat.raison === 'loin') {
    // Remise des gaz : l'avion repart vers le ciel.
    P.v = Math.min(P.v + dt * 6, 80);
    P.x += P.v * dt; P.y += 9 * dt; P.pitch = 12;
  } else {
    const dec = P.flotte ? 9 : resultat.raison === 'sortie' && L.navire ? 22 : 5.5;
    P.v = Math.max(0, P.v - dec * dt);
    P.x += P.v * dt;
    if (P.flotte) { P.y = Math.sin(tempsVol * 2.4) * 0.6 - 2.5; P.pitch = Math.sin(tempsVol * 1.7) * 3; }
    else { P.y = solY(P.x); P.pitch = Math.sin(P.tGlisse * 9) * (P.v > 1 ? 1.6 : 0) - (P.plie ? 2 : 0); }
    if (P.v > 3 && Math.random() < dt * 40) {
      if (P.flotte) eclabousser(P.x + 20, 0, 2);
      else poussiere(P.x - 5, solY(P.x), 2);
    }
  }
  secouerCargo(dt, P.v > 1 ? 4 : 0, 0);

}
function majArret(dt) {
  P.tArret += dt;
  tempsVol += dt;

  if (P.tArret > 1.6) finirVol();

/* ---------------------------------------------------------------------
   Particules
   --------------------------------------------------------------------- */
function ajouter(p) { if (particules.length < 400) particules.push(p); }
function fumee(x, y, n, frein) {
  for (let i = 0; i < n; i++) ajouter({ x: x + Math.random() * 4 - 2, y: y + 0.5, vx: -Math.random() * 6 - (frein ? 2 : 8), vy: Math.random() * 3 + 1, vie: 1, duree: 0.9 + Math.random() * 0.6, taille: 1.4 + Math.random() * 2, c: L.neige ? '#ffffff' : '#e9ecef', type: 'fumee' });
}
function poussiere(x, y, n) {
  const c = L.navire ? '#ffffff' : L.pays === 2 ? '#ffffff' : L.pays === 3 ? '#f1d08f' : '#c9a36a';
  for (let i = 0; i < n; i++) ajouter({ x: x + Math.random() * 8 - 4, y, vx: Math.random() * 10 - 3, vy: Math.random() * 7 + 2, vie: 1, duree: 1 + Math.random(), taille: 1.6 + Math.random() * 2.4, c, type: 'fumee' });
}
function poudre(x, y) { ajouter({ x, y, vx: -Math.random() * 8, vy: Math.random() * 4 + 1, vie: 1, duree: 0.8, taille: 1 + Math.random(), c: '#ffffff', type: 'fumee' }); }
function plumes(x, y) {
  for (let i = 0; i < 14; i++) ajouter({ x, y, vx: Math.random() * 16 - 8, vy: Math.random() * 10 - 2, vie: 1, duree: 1.6 + Math.random(), taille: 1, c: '#ffffff', type: 'plume', rot: Math.random() * 6 });
}
function eclabousser(x, y, n) {
  for (let i = 0; i < n; i++) ajouter({ x: x + Math.random() * 30 - 15, y, vx: Math.random() * 12 - 6, vy: Math.random() * 14 + 4, vie: 1, duree: 1 + Math.random() * 0.5, taille: 0.8 + Math.random() * 1.2, c: '#bfe6ff', type: 'goutte' });
}
function majParticules(dt) {
  for (const p of particules) {
    p.vie -= dt / p.duree;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === 'goutte') p.vy -= 25 * dt;
    else if (p.type === 'plume') { p.vy -= 2 * dt; p.vx *= 0.98; p.rot += dt * 3; }
    else { p.vx *= 0.97; p.vy *= 0.96; p.taille += dt * 3; }
  }
  particules = particules.filter((p) => p.vie > 0);
  for (const c of confettis) { c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 260 * dt; c.vx *= 0.99; c.r += c.vr * dt; c.vie -= dt / 2.6; }
  confettis = confettis.filter((c) => c.vie > 0 && c.y < H + 40);
  for (const g of (L ? L.listeOiseaux : [])) {
    if (g.fuite > 0) { g.fuite += dt; for (const m of g.membres) { m.fx += (8 + m.ph) * dt * 2; m.fy += (6 + m.ph * 1.5) * dt * 2; } }
    else g.x -= 5 * dt;
  }
}
function nouveauConfetti() {
  const cols = ['#ff8a1f', '#ffc928', '#35b26b', '#2f6fd6', '#e5484d', '#b56bff'];
  return { x: W / 2 + (Math.random() - 0.5) * W * 0.4, y: H * 0.35, vx: (Math.random() - 0.5) * 700, vy: -Math.random() * 600 - 200, r: Math.random() * 6, vr: Math.random() * 10 - 5, c: cols[Math.floor(Math.random() * cols.length)], vie: 1, w: 6 + Math.random() * 6 };
}

/* ---------------------------------------------------------------------
   Messages
   --------------------------------------------------------------------- */
function toast(txt) {
  const el = $('#toast');
  el.textContent = txt;
  el.hidden = false;
  el.classList.remove('montre');
  void el.offsetWidth;
  el.classList.add('montre');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 950);
}
function bulle(cle) {
  const el = $('#bulle');
  if (!cle) { el.hidden = true; el.dataset.cle = ''; return; }
  if (el.dataset.cle !== cle) { el.textContent = t(cle); el.dataset.cle = cle; }
  el.hidden = false;
}
function vibrer(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* rien */ } }

// Aides pendant le vol (surtout aux premiers vols).
function majAides() {
  if (apercu) return;
  let cle = '';
  const h = P.y - solY(P.x);
  const debut = niv < 2;
  if (phase === 'vol') {
    if (P.decroche > 0 && h >= 8) cle = 'aide.decroche';
    else if (debut && tempsVol < 3.5 && !aides.appuye) cle = 'aide.appuie';
    else if (debut && h < 24 && P.vy < -2.6 && !appui && (P.x > L.R0 - 120)) cle = 'aide.arrondi';
    else if (niv < 3 && P.x > L.R0 - 500 && P.x < L.aimX && h > (L.aimX - P.x) * L.glisse * 1.6 + 25) cle = 'aide.haut';
    else if (niv < 3 && P.x > 250 && P.x < L.R0 - 100 && h < 12) cle = 'aide.bas';
  } else if (phase === 'sol') {
    if ((debut || niv === 16) && !appui && P.v > 14 && !P.crochet) cle = 'aide.freine';
  }
  bulle(cle);
}

/* ---------------------------------------------------------------------
   Caméra
   --------------------------------------------------------------------- */
function zoneJeu() {
  const haut = 92;
  const soute = H > W * 1.2 ? clamp(Math.round(H * 0.25), 96, 230) : clamp(Math.round(H * 0.2), 92, 175);
  return { haut, bas: H - soute, soute };
}
function echelleProche() { return clamp(Math.min(W * 0.5, H * 0.3), 120, 360) / 60; }
function enVolVisible() { return phase === 'vol' || (phase === 'apercu' && !P.sol); }
function majCamera(dt) {
  const z = zoneJeu();
  const hz = z.bas - z.haut;
  const solEcran = z.bas - hz * 0.2;
  const ref = L.navire ? (P.x > L.R0 - 160 && P.x < L.R1 + 60 ? solBrut(L, Math.min(Math.max(P.x, L.R0), L.R1), tempsVol) : 0) : solY(P.x + 30);
  cam.refY = lerp(cam.refY, ref, Math.min(1, dt * 3));
  const h = Math.max(1, P.y - cam.refY);
  const sFit = (solEcran - (z.haut + hz * 0.24)) / (h + 16);
  const cible = clamp(Math.min(echelleProche(), sFit), 0.55, 6);
  cam.s = lerp(cam.s, cible, Math.min(1, dt * 2.2));
  const sxCible = P.sol || P.x > L.R0 - 200 ? 0.26 : 0.32;
  cam.sx = lerp(cam.sx, sxCible, Math.min(1, dt * 1.2));

function ecranX(x) { return W * cam.sx + (x - P.x) * cam.s + cam.dx; }
function ecranY(y) { return cam.solEcran - (y - cam.refY) * cam.s + cam.dy; }

/* ---------------------------------------------------------------------
   Dessin : avion (vu de côté, nez à droite). Origine = roues principales.
   Unités : mètres (ctx déjà mis à l'échelle).
   --------------------------------------------------------------------- */
function cheminFuselage(c, lg) {
  c.beginPath();
  c.moveTo(-20 * lg, -14.2);
  c.lineTo(18 * lg, -14.2);
  c.quadraticCurveTo(30 * lg, -14.2, 31 * lg, -9.6);
  c.quadraticCurveTo(31 * lg, -5.8, 24 * lg, -5.8);
  c.lineTo(-14 * lg, -5.8);
  c.quadraticCurveTo(-24 * lg, -6.6, -31 * lg, -12.6);
  c.lineTo(-31 * lg, -14.2);
  c.closePath();
}
function dessinerAvion(c, o) {
  const av = AVIONS.find((a) => a.id === o.type) || AVIONS[0];
  const pe = PEINTURES.find((p) => p.id === o.peinture) || PEINTURES[0];
  const lg = av.longueur;
  const tt = o.temps || 0;
  c.save();

  c.fill(); c.stroke();

    const roue = (x, r) => {

      c.fillStyle = '#9aa4b2'; c.beginPath(); c.arc(x, -r, r * 0.45, 0, 2 * PI); c.fill();

      c.strokeStyle = '#20242b'; c.lineWidth = 0.3;

  }

  c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(26.6 * lg, -12, 0.9, 0.35, -0.3, 0, 2 * PI); c.fill();

    c.fillStyle = 'rgba(60,70,90,.35)'; c.beginPath(); c.ellipse(31.6 * lg, -10, 0.7, 5.2 * Math.abs(Math.sin(tt * 40)) + 1.2, 0, 0, 2 * PI); c.fill();

/* ---------------------------------------------------------------------

  const y0 = z.bas, h = z.soute;

  for (let x = -decal; x < W + 60; x += 60) { ctx.beginPath(); ctx.moveTo(x, y0 + 4); ctx.lineTo(x, H); ctx.stroke(); }
  // Plancher
  const sol = H - Math.max(14, h * 0.13);

      ctx.beginPath(); ctx.moveTo(cx - 30 * k, sol); ctx.lineTo(cx + Math.sin(it.th) * 30 * k, sol - 26 * k); ctx.lineTo(cx + 30 * k, sol); ctx.stroke();

        etoileMini(cx + it.sens * 26 * k + Math.cos(a) * 16 * k, sol - 46 * k + Math.sin(a) * 5 * k, 4 * k);
      }

    if (it.fragile) dessinerFragile(ctx, cx + 26 * k, y0 + 18, Math.min(1, k * 0.9));
