      const lim = CARGOS[it.type].max * (it.fragile ? FRAGILE : 1);

      const bw = Math.min(70, larg * 0.5);

/* ---------------------------------------------------------------------
   Dessin d'une image complète du vol
   --------------------------------------------------------------------- */
function dessinerVol() {
  const z = zoneJeu();
  const D = decor();
  cam.dx = cam.secousse > 0 ? (Math.random() - 0.5) * cam.secousse * 14 : 0;
  cam.dy = cam.secousse > 0 ? (Math.random() - 0.5) * cam.secousse * 14 : 0;
  dessinerCiel(D, z.haut, cam.solEcran);
  dessinerDecorLoin(D, P.x * cam.s, ecranY(cam.refY) - clamp(cam.s * 10, 10, 46) * 0.8, z.haut);
  if (L.listeThermiques.length) dessinerThermiques();
  dessinerSol(D);
  // Ombre de l'avion au sol
  const hOmbre = P.y - solY(P.x);
  if (!P.flotte && hOmbre < 80 && !(L.navire && !surPiste(P.x))) {
    ctx.fillStyle = 'rgba(0,0,0,' + clamp(0.3 - hOmbre / 300, 0.04, 0.3) + ')';
    ctx.beginPath(); ctx.ellipse(ecranX(P.x + 6), ecranY(solY(P.x)), 30 * cam.s * (1 - hOmbre / 200), 3 * cam.s, 0, 0, 2 * PI); ctx.fill();
  }
  dessinerRafales();
  dessinerOiseaux();
  dessinerParticules();
  // L'avion
  ctx.save();
  ctx.translate(ecranX(P.x), ecranY(P.y));
  ctx.scale(cam.s, cam.s);
  dessinerAvion(ctx, { type: prog.avion, peinture: prog.peinture, pitch: P.pitch, cargo, temps, roue: P.roue, plie: P.plie });
  ctx.restore();
  if (P.flotte) { // vagues devant l'avion qui flotte
    ctx.fillStyle = 'rgba(61,153,214,.85)';
    ctx.fillRect(0, ecranY(-0.3), W, 6 * cam.s);
  }
  dessinerNuagesBas();
  dessinerNeigeQuiTombe();
  dessinerTrainees();
  if (L.soir) { ctx.fillStyle = 'rgba(30,20,70,.18)'; ctx.fillRect(0, 0, W, z.bas); }
  dessinerSoute(z, temps);
  dessinerIndicateurs(z);
  // Confettis (en coordonnées de l'écran)
  for (const c of confettis) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r);

    ctx.restore();

/* ---------------------------------------------------------------------
   Écran titre : un avion géant qui passe dans le ciel de la prairie
   --------------------------------------------------------------------- */
function dessinerTitre() {
  const D = DECORS[0];
  const sol = H * 0.82;
  const g = ctx.createLinearGradient(0, 0, 0, sol);
  g.addColorStop(0, D.ciel[0]); g.addColorStop(1, D.ciel[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let k = 0; k < 5; k++) {
    const per = W + 300;
    const x = ((h01(k) * per - temps * 12 * (k % 2 + 1)) % per + per) % per - 150;
    nuageDecor(x, 60 + h01(k + 4) * H * 0.4, 0.8 + h01(k + 2), 0.85);
  }
  ctx.fillStyle = D.loin;
  ctx.beginPath(); ctx.moveTo(0, sol);
  for (let sx = 0; sx <= W + 8; sx += 8) ctx.lineTo(sx, sol - 40 - Math.sin((sx + temps * 10) * 0.008) * 28);
  ctx.lineTo(W, sol); ctx.fill();
  ctx.fillStyle = D.sol; ctx.fillRect(0, sol, W, H - sol);

  const demo = [{ type: 'girafe', th: Math.sin(temps * 2) * 0.15, tombe: false }, { type: 'piano', th: Math.sin(temps * 2 + 1) * 0.1, tombe: false }, { type: 'gateau', th: Math.sin(temps * 2 + 2) * 0.12, tombe: false }];
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  dessinerAvion(ctx, { type: prog.avion, peinture: prog.peinture, pitch: 4 + Math.sin(temps * 0.8) * 2, cargo: demo, temps });
  ctx.restore();

/* ---------------------------------------------------------------------

function dessinerCarte(dt) {
  if (!carte) return;
  carte.t += dt;
  const c = cctx, w = cc.width, h = cc.height;
  const tt = carte.t;

  c.fillStyle = g; c.fillRect(0, 0, w, h);
  const sol = h * 0.78;
  const navire = cle === 'navire' || cle === 'vagues';
  if (navire) {
    c.fillStyle = '#2e86c8'; c.fillRect(0, sol - 20, w, h);
    const houle = Math.sin(tt * (cle === 'vagues' ? 2.2 : 1.3)) * (cle === 'vagues' ? 18 : 9);

    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 3;
    for (let r = 0; r < 3; r++) { c.beginPath(); for (let x = 0; x <= w; x += 20) c.lineTo(x, sol - 10 + r * 26 + Math.sin(x * 0.03 + tt * 3 + r) * 6); c.stroke(); }
  } else {
    c.fillStyle = cle === 'neige' ? '#f3f7fb' : D.sol; c.fillRect(0, sol, w, h - sol);
    const pente = cle === 'pente' ? -0.12 : 0;
    c.fillStyle = D.piste;
    c.beginPath(); c.moveTo(w * 0.3, sol); c.lineTo(w, sol + pente * w * 0.7); c.lineTo(w, sol + pente * w * 0.7 + 18); c.lineTo(w * 0.3, sol + 18); c.closePath(); c.fill();
    c.fillStyle = '#ffc928'; c.fillRect(w * 0.48, sol + pente * w * 0.18 - 2, 10, 22);
  }
  // Petit avion de démonstration
  let ax = w * 0.3, ay = sol - 110, pitch = 0, ap = false;

    $$('#carteEtapes li').forEach((li, i) => li.classList.toggle('active', i === phaseDemo));
    if (phaseDemo === 0) { ap = true; pitch = 9; ay = sol - 90 - u * 40; ax = w * 0.15 + u * w * 0.2; }
    else if (phaseDemo === 1) { ap = false; pitch = -5; ay = sol - 130 + u * 110; ax = w * 0.2 + u * w * 0.25; }
    else { ap = u > 0.2; pitch = 0; ay = sol; ax = w * 0.45 + (1 - Math.pow(1 - u, 2)) * w * 0.3; }
  } else if (cle === 'rafales') { ay = sol - 120 + Math.sin(tt * 4) * 20; ax = w * 0.35; pitch = Math.sin(tt * 4) * 4; }
  else if (cle === 'thermiques') { ax = w * 0.2 + u * w * 0.5; ay = sol - 70 - Math.sin(u * PI) * 50; pitch = 2; }

  if (cle === 'thermiques') {

    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 3;
    for (let k = 0; k < 3; k++) { c.beginPath(); for (let y = sol; y > 40; y -= 14) c.lineTo(w * 0.43 + k * 30 + Math.sin(y * 0.05 + tt * 5) * 6, y); c.stroke(); }
  }

      c.beginPath(); c.arc(x, y, 14, 0.2, PI * 1.4); c.stroke(); c.beginPath(); c.moveTo(x + 14, y); c.lineTo(x + 70, y); c.stroke();
    }

  }

  const demo = cle === 'fragile' ? [{ type: 'aquarium', th: Math.sin(tt * 3) * 0.2, tombe: false, eau: Math.sin(tt * 3) * 0.4 }]

  dessinerAvion(c, { type: prog.avion, peinture: prog.peinture, pitch, cargo: demo, temps: tt });

      c.beginPath(); c.moveTo(bx, by); c.lineTo(bx - 10, by - aile); c.lineTo(bx + 4, by - 2); c.fill(); c.stroke();

  }
  if (cle === 'nuages') {
    c.fillStyle = 'rgba(240,245,252,.96)'; c.fillRect(0, h * 0.42, w, h * 0.2);
    for (let k = 0; k < 10; k++) { c.beginPath(); c.arc(k * 100 - (tt * 30 % 100), h * 0.43, 34, 0, 2 * PI); c.arc(k * 100 + 50 - (tt * 30 % 100), h * 0.62, 30, 0, 2 * PI); c.fill(); }
  }
  if (cle === 'visee' || cle === 'nuages') {
    // Feux d'approche en grand : ils changent selon la hauteur
    const n = Math.floor(tt / 1.2) % 5;
    const blancs = [4, 3, 2, 1, 0][n];
    c.fillStyle = 'rgba(22,50,79,.8)'; c.beginPath(); arrondi(c, w - 220, 18, 200, 56, 28); c.fill();
    for (let i = 0; i < 4; i++) { c.fillStyle = i < blancs ? '#fff' : '#ff4d4d'; c.beginPath(); c.arc(w - 190 + i * 46, 46, 16, 0, 2 * PI); c.fill(); }
    if (blancs === 2) { c.strokeStyle = '#35b26b'; c.lineWidth = 6; c.beginPath(); arrondi(c, w - 224, 14, 208, 64, 32); c.stroke(); }
  }
  if (cle === 'fragile') dessinerFragile(c, ax + 20, ay - 110, 2.2);
  if (cle === 'soir') {
    c.fillStyle = 'rgba(255,243,176,.9)';
    for (let x = w * 0.32; x < w; x += 40) { c.beginPath(); c.arc(x, sol + 2, 5, 0, 2 * PI); c.arc(x, sol + 18, 5, 0, 2 * PI); c.fill(); }
  }
  if (cle === 'courte') {

    botteCarte(c, w * 0.8, sol); botteCarte(c, w * 0.88, sol);

}
function botteCarte(c, x, y) { c.fillStyle = '#e8c35a'; c.beginPath(); c.arc(x, y - 12, 16, 0, 2 * PI); c.fill(); }

/* ---------------------------------------------------------------------
   Affiche (jaquette du jeu) : window.JEL_AFFICHE
   --------------------------------------------------------------------- */
function dessinerAffiche() {
  const w = W, h = H;
  // Ciel de fin d'après-midi, soleil derrière l'avion
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#3f8fe0'); g.addColorStop(0.55, '#ffd9a0'); g.addColorStop(1, '#ffb877');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const sx = w * 0.7, sy = h * 0.3;
  const gl = ctx.createRadialGradient(sx, sy, 10, sx, sy, w * 0.6);
  gl.addColorStop(0, 'rgba(255,250,215,1)'); gl.addColorStop(0.25, 'rgba(255,236,170,.8)'); gl.addColorStop(1, 'rgba(255,236,170,0)');
  ctx.fillStyle = gl; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#fff8d8'; ctx.beginPath(); ctx.arc(sx, sy, w * 0.09, 0, 2 * PI); ctx.fill();
  // Rayons
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(temps * 0.05);
  ctx.fillStyle = 'rgba(255,255,230,.18)';
  for (let k = 0; k < 12; k++) { ctx.rotate(PI / 6); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(w, -40); ctx.lineTo(w, 40); ctx.fill(); }
  ctx.restore();
  // Nuages lointains
  nuageDecor(w * 0.04, h * 0.14, 1.4, 0.8); nuageDecor(w * 0.72, h * 0.08, 1.1, 0.7);
  // Collines lointaines
  ctx.fillStyle = '#b9c98f';
  ctx.beginPath(); ctx.moveTo(0, h * 0.74);
  for (let x = 0; x <= w; x += 10) ctx.lineTo(x, h * 0.66 - Math.sin(x * 0.012) * 18 - Math.sin(x * 0.03) * 8);
  ctx.lineTo(w, h * 0.74); ctx.fill();
  ctx.fillStyle = '#8fbf6a'; ctx.fillRect(0, h * 0.72, w, h);
  // Piste en perspective qui part vers le fond à droite
  ctx.fillStyle = '#5d6470';
  ctx.beginPath(); ctx.moveTo(-w * 0.2, h); ctx.lineTo(w * 0.55, h * 0.73); ctx.lineTo(w * 0.85, h * 0.73); ctx.lineTo(w * 1.1, h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffffff';
  for (let k = 0; k < 6; k++) {
    const u0 = k / 6, u1 = u0 + 0.06;
    const p = (u) => [lerp(w * 0.45, w * 0.7, u), lerp(h, h * 0.73, u)];
    const [x0, y0] = p(1 - Math.pow(1 - u0, 1.6)), [x1, y1] = p(1 - Math.pow(1 - u1, 1.6));
    const e0 = lerp(10, 2, u0), e1 = lerp(10, 2, u1);
    ctx.beginPath(); ctx.moveTo(x0 - e0, y0); ctx.lineTo(x1 - e1, y1); ctx.lineTo(x1 + e1, y1); ctx.lineTo(x0 + e0, y0); ctx.fill();
  }
  // Ligne dorée sur la piste
  ctx.fillStyle = '#ffc928';
  ctx.beginPath(); ctx.moveTo(w * 0.12, h * 0.87); ctx.lineTo(w * 0.96, h * 0.87); ctx.lineTo(w * 0.99, h * 0.895); ctx.lineTo(w * 0.07, h * 0.895); ctx.closePath(); ctx.fill();
  // Feux d'approche
  for (let i = 0; i < 4; i++) { ctx.fillStyle = i < 2 ? '#ffffff' : '#ff4d4d'; ctx.beginPath(); ctx.arc(w * 0.83 + i * 14, h * 0.755, 5, 0, 2 * PI); ctx.fill(); }
  // Oiseaux qui s'écartent
  for (let k = 0; k < 4; k++) {
    const bx = w * 0.12 + k * 34, by = h * 0.2 + Math.sin(k * 1.7) * 18, a = Math.sin(temps * 12 + k) * 9;
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#16324f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(bx, by, 9, 6, 0, 0, 2 * PI); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - 11, by - a); ctx.lineTo(bx + 4, by - 2); ctx.fill(); ctx.stroke();
  }
  // L'avion géant, nez levé, roues prêtes à toucher, la girafe qui regarde dehors
  const s = w / 66;
  const demo = [{ type: 'girafe', th: Math.sin(temps * 2) * 0.18 + 0.12, tombe: false }, { type: 'piano', th: 0.15, tombe: false }, { type: 'gateau', th: -0.2, tombe: false }];
  ctx.save(); ctx.translate(w * 0.47, h * 0.64); ctx.scale(s, s);
  // Halo de lumière autour (contour clair)
  ctx.shadowColor = 'rgba(255,245,200,.95)'; ctx.shadowBlur = 30;
  dessinerAvion(ctx, { type: 'cargo', peinture: 'bleu', pitch: 8, cargo: demo, temps, girafeK: 2.3 });
  ctx.shadowBlur = 0;
  ctx.restore();
  // Fumée des pneus qui touchent et étincelles d'or
  for (let k = 0; k < 9; k++) {
    ctx.fillStyle = 'rgba(255,255,255,' + (0.75 - k * 0.07) + ')';
    ctx.beginPath(); ctx.arc(w * 0.43 - k * 26, h * 0.655 - k * 4 + Math.sin(k + temps * 3) * 4, 16 + k * 5, 0, 2 * PI); ctx.fill();
  }
  for (let k = 0; k < 8; k++) etoileMini(w * 0.2 + h01(k) * w * 0.6, h * 0.14 + h01(k + 5) * h * 0.25, 6 + h01(k + 2) * 6);
  // Premier plan : coquelicots et herbes coupés par le bord
  for (let k = 0; k < 16; k++) {
    const x = h01(k + 30) * w, y = h * 0.93 + h01(k + 60) * h * 0.08;
    ctx.strokeStyle = '#3e7d34'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, h); ctx.quadraticCurveTo(x + 6, y + 20, x, y); ctx.stroke();
    ctx.fillStyle = '#e5484d'; ctx.beginPath(); ctx.arc(x, y, 12 + h01(k) * 8, 0, 2 * PI); ctx.fill();
    ctx.fillStyle = '#2b2230'; ctx.beginPath(); ctx.arc(x, y, 4, 0, 2 * PI); ctx.fill();
  }
  ctx.fillStyle = '#4f9a3e';
  ctx.beginPath(); ctx.moveTo(0, h);
  for (let x = 0; x <= w; x += 14) ctx.lineTo(x, h - 30 - (x / 14 % 2) * 26 - h01(x) * 20);
  ctx.lineTo(w, h); ctx.fill();
}

  else if (n === 2) { P.x = L.R0 + 120; P.y = solY(P.x) + 4.5; P.vy = -1.2; P.pitch = 8; tempsVol = 3; cargo.forEach((c, i) => { c.th = [0.28, -0.22, 0.12][i] || 0.1; }); }
  else { P.x = L.R0 - 70; P.y = L.pontBase + 14; P.vy = -2.2; P.pitch = 4; tempsVol = 1.2; cargo.forEach((c, i) => { c.th = [-0.18, 0.25, -0.1][i] || 0.1; c.eau = c.th * 2; }); }
  phase = 'apercu';

/* ---------------------------------------------------------------------
   Boucle principale
   --------------------------------------------------------------------- */
let dernier = performance.now();
function boucle(now) {
  const dt = clamp((now - dernier) / 1000, 0, 0.05);
  dernier = now;
  temps += dt;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (affiche) { dessinerAffiche(); requestAnimationFrame(boucle); return; }
  if (phase === 'apercu') {
    majParticules(0);
    dessinerVol();
    requestAnimationFrame(boucle); return;
  }
  if (!enPause && L) {
    if (phase === 'vol' || phase === 'sol') {
      if (appui) aides.appuye = true;
      const pas = 1 / 120;
      let reste = dt;
      while (reste > 1e-6 && (phase === 'vol' || phase === 'sol')) {
        const d = Math.min(pas, reste);
        physique(d);
        if (P.sol && phase === 'vol') phase = 'sol';
        reste -= d;
      }
      Son.reglerMoteur(P.v, phase === 'vol', P.sol && P.frein > 0.3);
      majAides();
    } else if (phase === 'glissade') { majGlissade(dt); bulle(''); }
    else if (phase === 'arret') { majArret(dt); bulle(''); }
    else if (phase === 'fin' || phase === 'carte') { secouerCargo(dt, 0, 0); }
    if (phase !== 'carte') majParticules(dt);
    majCamera(dt);
  }
  if (phase === 'titre' || !L) dessinerTitre();
  else dessinerVol();
  if (phase === 'carte') dessinerCarte(dt);
  requestAnimationFrame(boucle);
}

function redimensionner() {

}

});

const TOUCHES_VOL = ['Space', 'Enter', 'NumpadEnter', 'ArrowUp', 'KeyW', 'ArrowDown', 'KeyS'];
document.addEventListener('keydown', (e) => {
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (enPause) reprendre(); else mettrePause();
    e.preventDefault(); return;
  }
  if (e.code === 'KeyM') { basculerSon(); return; }
  if (enJeu() && TOUCHES_VOL.indexOf(e.code) >= 0) {
    e.preventDefault();
    if (!e.repeat) { Son.init(); appui = true; }
    return;
  }
  if (phase === 'carte' && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); fermerCarte(); }
});

  requestAnimationFrame(boucle);
  return;
}
if (window.JEL_APERCU) {
  apercu = Number(window.JEL_APERCU) || 1;
  ouvrirApercu(apercu);
  requestAnimationFrame(boucle);
  return;
}
montrerTitre();
requestAnimationFrame(boucle);
})();
