<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');

    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';

    menu.className = 'jel-langue-menu';
    menu.hidden = true;

      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');

      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {

      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);

      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];

    }

      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }

    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
(function () {
  'use strict';

  var JEU = 'balances-du-roi-barnabe';
  var I18 = window.JEL_I18N;
  var t = I18.t;
  function nb(x) { return I18.nombre(x); }
  function $(s) { return document.querySelector(s); }
  function f1(x) { return (Math.round(x * 10) / 10).toString(); }
  document.title = t('titre');

  // <logique>
  // ------------------------------------------------------------------------
  // Données des niveaux
  // Objets : lettre + poids. S = sac, L = lingot, F = fromage, P = poids du roi
  // (toujours fixe), C = coffret et J = jarre (poids caché, donné par « caches »).
  // Balance à plateaux : { t: 'p', g: [fixes à gauche], d: [fixes à droite] }
  // Levier : { t: 'l', n: crans, g: [[cran 1], [cran 2], …], d: [[…], …] }
  // Étage : sous: { cote: 'g' | 'd', cran: n (levier), b: balance suspendue }
  // Commandes du roi : c = max | exact | aucun | min | tous | maxobj, o = lettre
  // (« * » = tous les objets), n = nombre.
  // par = pesées pour 3 étoiles ; lim = chandelles (0 = sans limite).
  // ------------------------------------------------------------------------
  var SALLES = ['tresor', 'tour', 'cave', 'atelier', 'trone'];
  var NIVEAUX = [
    // Salle du trésor
    { salle: 0, nouv: 'base', b: [{ t: 'p', g: ['P3'], d: [] }], r: ['S1', 'S2', 'S4'], par: 1 },
    { salle: 0, nouv: 'leurres', b: [{ t: 'p', g: ['P7'], d: [] }], r: ['S2', 'S4', 'L5', 'S1', 'F3'], par: 1 },
    { salle: 0, nouv: 'deuxCotes', b: [{ t: 'p', g: ['P5'], d: ['P8'] }], r: ['S2', 'S1', 'F4', 'L6'], par: 1 },
    { salle: 0, nouv: 'deuxBalances', b: [{ t: 'p', g: ['P6'], d: [] }, { t: 'p', g: ['P9'], d: ['P4'] }], r: ['S2', 'S4', 'F5', 'S3', 'L1'], par: 1 },
    { salle: 0, nouv: 'commande', b: [{ t: 'p', g: ['P10'], d: ['P3'] }], r: ['S2', 'S2', 'F4', 'L5', 'S3', 'F1'], par: 1, cmd: [{ c: 'max', o: 'S', n: 1 }] },
    // Tour aux deux étages
    { salle: 1, nouv: 'etages', b: [{ t: 'p', g: ['P8'], d: [], sous: { cote: 'd', b: { t: 'p', g: ['P2'], d: [] } } }], r: ['S2', 'S4', 'F1', 'S3'], par: 1 },
    { salle: 1, b: [{ t: 'p', g: ['P12'], d: [], sous: { cote: 'd', b: { t: 'p', g: ['P3'], d: ['P1'] } } }], r: ['S2', 'S1', 'F3', 'L4', 'S2'], par: 1 },
    { salle: 1, b: [{ t: 'p', g: ['P9'], d: ['P2'], sous: { cote: 'g', b: { t: 'p', g: ['P1'], d: [] } } }], r: ['S1', 'S2', 'F3', 'L5', 'S4', 'F2'], par: 1, cmd: [{ c: 'maxobj', n: 3 }] },
    { salle: 1, b: [{ t: 'p', g: [], d: ['P5'], sous: { cote: 'g', b: { t: 'p', g: ['P2'], d: ['P4'] } } }], r: ['L3', 'L2', 'S1', 'F2', 'L1', 'S3'], par: 1, cmd: [{ c: 'exact', o: 'L', n: 2 }] },
    { salle: 1, b: [{ t: 'p', g: ['P5'], d: [], sous: { cote: 'd', b: { t: 'p', g: [], d: ['P3'] } } }], r: ['S1', 'S2', 'F2', 'L4', 'F1'], par: 1, cmd: [{ c: 'tous', o: '*' }] },
    // Cave aux secrets
    { salle: 2, nouv: 'cache', b: [{ t: 'p', g: ['C'], d: [] }], r: ['S1', 'S2', 'S3', 'S4', 'F2'], caches: { C: 5 }, par: 2 },
    { salle: 2, b: [{ t: 'p', g: ['C'], d: [] }, { t: 'p', g: ['C', 'C'], d: [] }], r: ['S1', 'S2', 'F3', 'L5', 'S1', 'L1'], caches: { C: 3 }, par: 2 },
    { salle: 2, nouv: 'cacheReserve', b: [{ t: 'p', g: ['P7'], d: [] }], r: ['C', 'C', 'S1', 'S2', 'F3', 'S4'], caches: { C: 2 }, par: 2, cmd: [{ c: 'tous', o: 'C' }] },
    { salle: 2, nouv: 'limite', b: [{ t: 'p', g: ['C'], d: ['J'] }, { t: 'p', g: ['P6'], d: ['J'] }], r: ['S1', 'S2', 'S3', 'F1', 'L4'], caches: { C: 5, J: 2 }, par: 2, lim: 4 },
    { salle: 2, b: [{ t: 'p', g: ['P10'], d: [], sous: { cote: 'd', b: { t: 'p', g: ['C'], d: [] } } }], r: ['S1', 'S2', 'S3', 'F1', 'L4'], caches: { C: 3 }, par: 2, lim: 4 },
    // Atelier des leviers
    { salle: 3, nouv: 'levier', b: [{ t: 'l', n: 3, g: [[], ['P6'], []], d: [[], [], []] }], r: ['S2', 'S3', 'S4', 'F1'], par: 1 },
    { salle: 3, b: [{ t: 'l', n: 3, g: [['P5'], [], ['P2']], d: [[], ['P3'], []] }], r: ['S1', 'F2', 'S3', 'L4', 'S2'], par: 1 },
    { salle: 3, b: [{ t: 'l', n: 3, g: [[], [], ['P4']], d: [['P2'], [], []] }], r: ['F2', 'F3', 'S1', 'S2', 'L3', 'F5'], par: 1, cmd: [{ c: 'aucun', o: 'F' }, { c: 'maxobj', n: 2 }] },
    { salle: 3, b: [{ t: 'l', n: 3, g: [[], ['C'], []], d: [[], [], []] }], r: ['S1', 'S2', 'S3', 'F1'], caches: { C: 4 }, par: 2 },
    { salle: 3, b: [{ t: 'l', n: 3, g: [['P3'], [], ['P3']], d: [[], ['P2'], []] }], r: ['S1', 'S2', 'S3', 'F1', 'L2'], par: 1, lim: 3, cmd: [{ c: 'exact', o: 'S', n: 2 }] },
    // Salle du trône
    { salle: 4, nouv: 'levierSous', b: [{ t: 'p', g: ['P10'], d: [], sous: { cote: 'd', b: { t: 'l', n: 2, g: [['P2'], []], d: [[], []] } } }], r: ['S1', 'S2', 'F1', 'L3', 'S4'], par: 1 },
    { salle: 4, nouv: 'crochet', b: [{ t: 'l', n: 3, g: [[], ['P4'], []], d: [[], [], []], sous: { cote: 'd', cran: 1, b: { t: 'p', g: ['P1'], d: [] } } }], r: ['S1', 'S2', 'S3', 'F2', 'L1'], par: 1, lim: 3, cmd: [{ c: 'max', o: 'S', n: 3 }] },
    { salle: 4, b: [{ t: 'p', g: ['J', 'J'], d: ['C'] }, { t: 'p', g: ['C'], d: ['P2'] }], r: ['S1', 'S2', 'F1', 'F3', 'L2'], caches: { C: 5, J: 2 }, par: 2, lim: 4, cmd: [{ c: 'aucun', o: 'L' }] },
    { salle: 4, b: [{ t: 'l', n: 3, g: [['C'], [], ['C']], d: [['J'], [], []] }], r: ['S1', 'S2', 'F1', 'L3', 'S3'], caches: { C: 2, J: 3 }, par: 2, lim: 4, cmd: [{ c: 'min', o: 'F', n: 1 }] },
    { salle: 4, b: [{ t: 'p', g: ['J', 'P4'], d: [], sous: { cote: 'd', b: { t: 'p', g: ['C'], d: [] } } }], r: ['S1', 'S2', 'S3', 'F1', 'L2', 'S2'], caches: { C: 4, J: 3 }, par: 2, lim: 3, cmd: [{ c: 'exact', o: 'S', n: 2 }] }
  ];

  // ------------------------------------------------------------------------
  // Modèle : construit les balances et les objets d'un niveau
  // ------------------------------------------------------------------------
  function construire(def) {
    var objets = [];
    var balances = [];
    var caches = def.caches || {};
    function creerObjet(code, fixe) {
      var k = code.charAt(0);
      var cache = (k === 'C' || k === 'J');
      var p = cache ? caches[k] : parseInt(code.slice(1), 10);
      var o = { id: objets.length, k: k, p: p, fixe: !!fixe, lieu: null, cache: cache, ordre: objets.length };
      objets.push(o);
      return o;
    }
    function creerBalance(d, parent) {
      var B = { id: balances.length, t: d.t, n: d.n || 1, emplacements: [], parent: parent || null, def: d };
      balances.push(B);
      [['g', -1], ['d', 1]].forEach(function (c) {
        var listes = d.t === 'l' ? d[c[0]] : [d[c[0]]];
        for (var i = 0; i < listes.length; i++) {
          var E = { cle: B.id + ':' + c[0] + (i + 1), balance: B, cote: c[1], dist: i + 1, enfant: null, accepte: true };
          B.emplacements.push(E);
          (listes[i] || []).forEach(function (code) { creerObjet(code, true).lieu = E.cle; });
        }
      });
      if (d.sous) {
        var cran = d.t === 'l' ? (d.sous.cran || 1) : 1;
        var cote = d.sous.cote === 'g' ? -1 : 1;
        var E2 = B.emplacements.filter(function (e) { return e.cote === cote && e.dist === cran; })[0];
        E2.enfant = creerBalance(d.sous.b, E2);
        if (d.t === 'l') E2.accepte = false; // le crochet porte la balance, pas de plateau
      }
      return B;
    }
    var racines = def.b.map(function (d) { return creerBalance(d, null); });
    (def.r || []).forEach(function (code) { creerObjet(code, false); });
    var emplacements = [];
    balances.forEach(function (B) { B.emplacements.forEach(function (E) { emplacements.push(E); }); });
    return { racines: racines, balances: balances, objets: objets, emplacements: emplacements, cmd: def.cmd || [] };
  }

  // Poids posé dans un emplacement (objets + balance suspendue) ; lieux[id] = clé ou null
  function poidsEmplacement(M, E, lieux) {
    var s = 0;
    for (var i = 0; i < M.objets.length; i++) if (lieux[i] === E.cle) s += M.objets[i].p;
    if (E.enfant) s += poidsBalance(M, E.enfant, lieux);
    return s;
  }
  function poidsBalance(M, B, lieux) {
    var s = 0;
    B.emplacements.forEach(function (E) { s += poidsEmplacement(M, E, lieux); });
    return s;
  }
  // Moment : > 0 si la droite penche, < 0 si la gauche penche
  function moment(M, B, lieux) {
    var s = 0;
    B.emplacements.forEach(function (E) { s += E.cote * E.dist * poidsEmplacement(M, E, lieux); });
    return s;
  }
  function lieuxActuels(M) { return M.objets.map(function (o) { return o.lieu; }); }

  // Nombre d'objets posés (non fixes) d'une sorte (« * » = tous)
  function compter(M, lieux, o) {
    var n = 0;
    for (var i = 0; i < M.objets.length; i++) {
      var ob = M.objets[i];
      if (!ob.fixe && lieux[i] !== null && (o === '*' || ob.k === o)) n++;
    }
    return n;
  }
  function totalSorte(M, o) {
    return M.objets.filter(function (ob) { return !ob.fixe && (o === '*' || ob.k === o); }).length;
  }
  function commandeRespectee(M, lieux, c) {
    if (c.c === 'max') return compter(M, lieux, c.o) <= c.n;
    if (c.c === 'exact') return compter(M, lieux, c.o) === c.n;
    if (c.c === 'aucun') return compter(M, lieux, c.o) === 0;
    if (c.c === 'min') return compter(M, lieux, c.o) >= c.n;
    if (c.c === 'tous') return compter(M, lieux, c.o) === totalSorte(M, c.o);
    if (c.c === 'maxobj') return compter(M, lieux, '*') <= c.n;
    return true;
  }
  function toutesDroites(M, lieux) {
    for (var i = 0; i < M.balances.length; i++) if (moment(M, M.balances[i], lieux) !== 0) return false;
    return true;
  }
  function estResolu(M, lieux) {
    if (!toutesDroites(M, lieux)) return false;
    for (var i = 0; i < M.cmd.length; i++) if (!commandeRespectee(M, lieux, M.cmd[i])) return false;
    return true;
  }

  // Solveur : solutions (au plus « max ») ; chaque objet libre va dans la
  // réserve (null) ou dans un emplacement qui accepte des objets.
  function resoudre(M, max) {
    var libres = M.objets.filter(function (o) { return !o.fixe; });
    var choix = [null].concat(M.emplacements.filter(function (E) { return E.accepte; }).map(function (E) { return E.cle; }));
    var lieux = lieuxActuels(M);
    libres.forEach(function (o) { lieux[o.id] = null; });
    var sol = [];
    max = max || 500;
    var maxObj = Infinity;
    M.cmd.forEach(function (c) { if (c.c === 'maxobj') maxObj = Math.min(maxObj, c.n); });
    function suivant(i, poses) {
      if (sol.length >= max) return;
      if (i === libres.length) {
        if (estResolu(M, lieux)) sol.push(lieux.slice());
        return;
      }
      var o = libres[i];
      for (var j = 0; j < choix.length; j++) {
        if (choix[j] !== null && poses >= maxObj) continue;
        lieux[o.id] = choix[j];
        suivant(i + 1, poses + (choix[j] !== null ? 1 : 0));
      }
      lieux[o.id] = null;
    }
    suivant(0, 0);
    return sol;
  }
  // </logique>

  window.JEL_NIVEAUX = NIVEAUX.length;

  // ------------------------------------------------------------------------
  // Progression : étoiles, records, récompenses (localStorage + JEL_SAVE)
  // ------------------------------------------------------------------------
  var CLE_LOCALE = 'balances-du-roi-barnabe-progres';
  var TAPIS = ['lion', 'foret', 'dragon', 'ciel', 'fromages', 'chateau'];
  var SEUILS_TAPIS = [5, 12, 20, 30, 45, 60];
  var BLASONS = ['tresor', 'tour', 'cave', 'atelier', 'trone', 'etoile', 'sage', 'defi'];

  function progresVide() {
    var zeros = NIVEAUX.map(function () { return 0; });
    return { etoiles: zeros.slice(), records: zeros.slice(), debloque: 1, unePesee: zeros.map(function () { return false; }), defi: { date: '', etoiles: 0, record: 0 }, defiReussis: 0, tapis: '', vus: {}, son: true };
  }
  function nettoyer(p) {
    var v = progresVide();
    v._vide = true;
    if (!p || typeof p !== 'object') return v;
    for (var i = 0; i < NIVEAUX.length; i++) {
      v.etoiles[i] = Math.max(0, Math.min(3, parseInt(p.etoiles && p.etoiles[i], 10) || 0));
      v.records[i] = Math.max(0, parseInt(p.records && p.records[i], 10) || 0);
      v.unePesee[i] = !!(p.unePesee && p.unePesee[i]);
    }
    v.debloque = Math.max(1, Math.min(NIVEAUX.length, parseInt(p.debloque, 10) || 1));
    if (p.defi && typeof p.defi === 'object') v.defi = { date: String(p.defi.date || ''), etoiles: parseInt(p.defi.etoiles, 10) || 0, record: parseInt(p.defi.record, 10) || 0 };
    v.defiReussis = parseInt(p.defiReussis, 10) || 0;
    v.tapis = TAPIS.indexOf(p.tapis) >= 0 ? p.tapis : '';
    if (p.vus && typeof p.vus === 'object') for (var k in p.vus) if (p.vus[k] === true) v.vus[k] = true;
    v.son = p.son !== false;
    v._vide = !p.debloque;
    return v;
  }
  // Garde le meilleur des deux copies (appareil et sauvegarde du site)
  function fusionner(a, b) {
    var v = progresVide();
    for (var i = 0; i < NIVEAUX.length; i++) {
      v.etoiles[i] = Math.max(a.etoiles[i], b.etoiles[i]);
      v.records[i] = Math.max(a.records[i], b.records[i]);
      v.unePesee[i] = a.unePesee[i] || b.unePesee[i];
    }
    v.debloque = Math.max(a.debloque, b.debloque);
    v.defi = a.defi.date > b.defi.date ? a.defi : (b.defi.date > a.defi.date ? b.defi : { date: a.defi.date, etoiles: Math.max(a.defi.etoiles, b.defi.etoiles), record: Math.max(a.defi.record, b.defi.record) });
    v.defiReussis = Math.max(a.defiReussis, b.defiReussis);
    v.tapis = a.tapis || b.tapis;
    var k;
    for (k in a.vus) v.vus[k] = true;
    for (k in b.vus) v.vus[k] = true;
    v.son = a._vide ? b.son : a.son;
    return v;
  }
  var P = (function () {
    var local = null, site = null;
    try { local = JSON.parse(localStorage.getItem(CLE_LOCALE) || 'null'); } catch (e) { local = null; }
    try { site = window.JEL_SAVE.load(JEU).progres; } catch (e) { site = null; }
    var p = fusionner(nettoyer(local), nettoyer(site));
    return p;
  })();
  function garderLocal() {
    try { localStorage.setItem(CLE_LOCALE, JSON.stringify(P)); } catch (e) { /* stockage refusé : la sauvegarde du site suffit */ }
  }
  // « Effacer la sauvegarde » : la progression repart de zéro (le son et la tapisserie restent)
  function effacerProgres() {
    var son = P.son, tapis = P.tapis;
    P = progresVide();
    P.son = son; P.tapis = tapis;
    garderLocal();
  }
  function totalEtoiles() { var s = 0; P.etoiles.forEach(function (e) { s += e; }); return s; }
  function scoreTotal() { var s = 0; P.records.forEach(function (e) { s += e; }); return s; }
  function tapisDebloque(i) { return totalEtoiles() >= SEUILS_TAPIS[i]; }
  function blasonGagne(id) {
    var i = SALLES.indexOf(id);
    if (i >= 0) return P.etoiles[i * 5 + 4] > 0;
    if (id === 'etoile') return P.etoiles.filter(function (e) { return e === 3; }).length >= 10;
    if (id === 'sage') return P.unePesee.filter(Boolean).length >= 8;
    if (id === 'defi') return P.defiReussis >= 1;
    return false;
  }
  function photoRecompenses() {
    return { tapis: TAPIS.map(function (x, i) { return tapisDebloque(i); }), blasons: BLASONS.map(blasonGagne), defi: P.debloque > 5 };
  }
  function dateDuJour() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function defiOuvert() { return P.debloque > 5; }

  // ------------------------------------------------------------------------
  // Sons (Web Audio, aucun fichier ; rien avant la première action)
  // ------------------------------------------------------------------------
  var SON = (function () {
    var ctx = null;

    ['g', 'd'].forEach(function (c) { $('#tapis-' + c).innerHTML = P.tapis ? svgTapis(P.tapis) : ''; });
  }

  // --- Mesures de l'écran -----------------------------------------------------
  function mesurer() {
    if (!etat.M) return;
    var z = $('#zone').getBoundingClientRect();
    var L = etat.L;
    L.W = Math.max(200, z.width); L.H = Math.max(240, z.height);
    var libres = etat.M.objets.filter(function (o) { return !o.fixe; }).length;
    // deux passes : la réserve dépend de la taille des objets, qui dépend de la place
    var S = 48, cols, rangs, haut;
    for (var passe = 0; passe < 2; passe++) {
      cols = Math.max(1, Math.floor((L.W - 20) / (S + 10)));
      rangs = Math.max(1, Math.ceil(libres / cols));
      L.RH = 24 + rangs * (S + 10) + 4;
      haut = L.H - L.RH;
      L.k = Math.max(0.8, Math.min(L.W / 360, haut / (etat.M.hauteur + 30), 1.7));
      S = Math.round(Math.max(40, 44 * L.k));
    }
    L.ox = (L.W - 360 * L.k) / 2;
    // dessin centré dans la hauteur libre (les chaînes descendent du plafond)
    L.oy = Math.max(0, (haut - (etat.M.hauteur + 10) * L.k) / 2);
    L.S = S;
    L.cell = S + 10; L.cols = cols;
    $('#zone').style.setProperty('--taille', L.S + 'px');
    $('#reserve-fond').style.height = (L.RH - 4) + 'px';
    rendre();
  }

  // --- Géométrie et dessin -----------------------------------------------------
  function geometrie() {
    var out = { plateaux: {}, balances: [] };
    function poser(B, px, py, depuis) {
      var a = etat.angles[B.id] || 0, c = Math.cos(a), s = Math.sin(a), G = B.g;
      var rec = { B: B, px: px, py: py, a: a, crochets: [], depuis: depuis };
      out.balances.push(rec);
      B.emplacements.forEach(function (E) {
        var d = B.t === 'p' ? G.bras : E.dist * G.esp;
        var hx = px + E.cote * d * c, hy = py + E.cote * d * s;
        var info = { E: E, hx: hx, hy: hy, x: hx, y: hy + G.pend };
        rec.crochets.push(info);
        out.plateaux[E.cle] = info;
      });
      rec.crochets.forEach(function (info) {
        var E = info.E;
        if (!E.enfant) return;
        if (B.t === 'l') poser(E.enfant, info.hx, info.hy + E.enfant.g.chaine, { x: info.hx, y: info.hy + 4 });
        else poser(E.enfant, info.x, info.y + 8 + E.enfant.g.chaine, { x: info.x, y: info.y + 9 });
      });
    }
    etat.M.racines.forEach(function (B) { poser(B, B.g.cx, B.g.cy, null); });
    return out;
  }

  function svgBalances(geo) {
    var L = etat.L;
    var haut = -L.oy / L.k;
    var s = '<defs><linearGradient id="gOrJeu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#c9921f"/></linearGradient></defs>';
    s += '<g transform="translate(' + f1(L.ox) + ' ' + f1(L.oy) + ') scale(' + L.k.toFixed(4) + ')">';
    s += '<rect class="plafond" x="' + f1(-L.ox / L.k - 2) + '" y="' + f1(haut) + '" width="' + f1(L.W / L.k + 4) + '" height="10"/>';
    s += '<rect class="plafond-bord" x="' + f1(-L.ox / L.k - 2) + '" y="' + f1(haut + 10) + '" width="' + f1(L.W / L.k + 4) + '" height="4"/>';
    geo.balances.forEach(function (rec) {
      var B = rec.B, G = B.g, px = rec.px, py = rec.py, deg = (rec.a * 180 / Math.PI).toFixed(2);
      var d0 = rec.depuis || { x: px, y: haut + 12 };
      if (!rec.depuis) s += '<circle class="crochet" cx="' + f1(px) + '" cy="' + f1(haut + 16) + '" r="5"/>';
      s += '<path class="chaine" d="M' + f1(d0.x) + ' ' + f1(d0.y) + ' L' + f1(px) + ' ' + f1(py - 9) + '"/>';
      rec.crochets.forEach(function (c) {
        if (!c.E.accepte) return;
        var w = G.largeur / 2;
        s += '<path class="ficelle" d="M' + f1(c.hx) + ' ' + f1(c.hy) + ' L' + f1(c.x - w + 5) + ' ' + f1(c.y) + ' M' + f1(c.hx) + ' ' + f1(c.hy) + ' L' + f1(c.x + w - 5) + ' ' + f1(c.y) + '"/>';
      });
      var lg = B.t === 'p' ? G.bras + 9 : B.n * G.esp + 11;
      s += '<g transform="rotate(' + deg + ' ' + f1(px) + ' ' + f1(py) + ')">';
      s += '<rect class="fleau" x="' + f1(px - lg) + '" y="' + f1(py - 5) + '" width="' + f1(2 * lg) + '" height="10" rx="5"/>';
      if (B.t === 'l') {
        for (var d = 1; d <= B.n; d++) {
          [-1, 1].forEach(function (cote) {
            var hx = px + cote * d * G.esp;
            s += '<circle class="crochet" cx="' + f1(hx) + '" cy="' + f1(py + 5) + '" r="3"/>';
            for (var j = 0; j < d; j++) s += '<circle class="point" cx="' + f1(hx + (j - (d - 1) / 2) * 7) + '" cy="' + f1(py) + '" r="2.4"/>';
          });
        }
      } else {
        s += '<circle class="pivot" cx="' + f1(px - G.bras) + '" cy="' + f1(py) + '" r="3.5"/><circle class="pivot" cx="' + f1(px + G.bras) + '" cy="' + f1(py) + '" r="3.5"/>';
      }
      var etatAig = etat.cale ? '' : (etat.droites[B.id] === true ? ' ok' : (etat.droites[B.id] === false ? ' non' : ''));
      s += '<path class="aiguille' + etatAig + '" d="M' + f1(px - 4.5) + ' ' + f1(py) + ' L' + f1(px) + ' ' + f1(py - 27) + ' L' + f1(px + 4.5) + ' ' + f1(py) + 'Z"/>';
      s += '</g>';
      s += '<circle class="pivot" cx="' + f1(px) + '" cy="' + f1(py) + '" r="8"/>';
      if (etat.cale) s += '<rect class="cale" x="' + f1(px - 3.5) + '" y="' + f1(py - 19) + '" width="7" height="34" rx="2"/><circle class="cale-tete" cx="' + f1(px) + '" cy="' + f1(py - 19) + '" r="4.5"/>';
      rec.crochets.forEach(function (c) {
        if (!c.E.accepte) return;
        var w = G.largeur / 2;
        var cible = etat.choisi !== null ? ' cible' : '';
        s += '<path class="plateau' + cible + '" d="M' + f1(c.x - w) + ' ' + f1(c.y) + ' Q' + f1(c.x) + ' ' + f1(c.y + 20) + ' ' + f1(c.x + w) + ' ' + f1(c.y) + 'Z"/>';
        s += '<path class="plateau-bord" d="M' + f1(c.x - w + 2) + ' ' + f1(c.y + 1) + ' H' + f1(c.x + w - 2) + '"/>';
      });
    });
    s += '</g>';
    return s;
  }

  function rendre() {
    if (!etat.M) return;
    var L = etat.L, geo = geometrie();
    $('#dessin').setAttribute('viewBox', '0 0 ' + Math.round(L.W) + ' ' + Math.round(L.H));
    $('#dessin').innerHTML = svgBalances(geo);
    // objets sur les plateaux
    var parLieu = {};
    etat.M.objets.forEach(function (o) { if (o.lieu) (parLieu[o.lieu] = parLieu[o.lieu] || []).push(o); });
    Object.keys(parLieu).forEach(function (cle) {
      var c = geo.plateaux[cle];
      var G = c.E.balance.g, cols = G.cols;
      var liste = parLieu[cle].sort(function (a, b) { return (a.fixe === b.fixe) ? a.ordre - b.ordre : (a.fixe ? -1 : 1); });
      liste.forEach(function (o, i) {
        var rang = Math.floor(i / cols), col = i % cols;
        var nRang = Math.min(cols, liste.length - rang * cols);
        var lx = c.x + (col - (nRang - 1) / 2) * 46;
        var ly = c.y - 22 - rang * 40;
        placerElement(o, L.ox + lx * L.k, L.oy + ly * L.k);
      });
    });
    // réserve
    var res = etat.M.objets.filter(function (o) { return !o.fixe && o.lieu === null; });
    var cols = L.cols, y0 = L.H - L.RH + 24;
    res.forEach(function (o, i) {
      var rang = Math.floor(i / cols), col = i % cols;
      var nRang = Math.min(cols, res.length - rang * cols);
      var x = L.W / 2 + (col - (nRang - 1) / 2) * L.cell;
      placerElement(o, x, y0 + rang * L.cell + L.cell / 2 - 2);
    });
    // zones des plateaux
    Object.keys(etat.cibles2).forEach(function (cle) {
      var c = geo.plateaux[cle], b = etat.cibles2[cle], G = c.E.balance.g;
      var w = (c.E.balance.t === 'l' ? G.esp - 2 : (G.cols === 1 ? 50 : 112)) * L.k;
      var h = 104 * L.k;
      b.style.left = Math.max(0, Math.min(L.W - w, L.ox + c.x * L.k - w / 2)) + 'px';
      b.style.top = (L.oy + (c.y + 18) * L.k - h) + 'px';
      b.style.width = w + 'px';
      b.style.height = h + 'px';
    });
  }
  function placerElement(o, x, y) {
    var b = etat.elems[o.id];
    if (!b || b.classList.contains('glisse')) return;
    var S = etat.L.S;
    b.style.left = (x - S / 2) + 'px';
    b.style.top = (y - S / 2) + 'px';
  }

  // --- Animation des fléaux -------------------------------------------------------
  function angleCible(B, m) {
    if (m === 0) return 0;
    var parUnite = B.t === 'l' ? 0.022 : 0.034;
    var a = Math.min(0.24, Math.max(0.05, Math.abs(m) * parUnite));
    return m > 0 ? a : -a;
  }
  function boucle() {
    etat.anim = 0;
    if (etat.pause || ecranActuel !== 'jeu' || !etat.M) return;
    var bouge = false;
    etat.M.balances.forEach(function (B) {
      var cible = etat.cale ? 0 : (etat.cibles[B.id] || 0);
      var a = etat.angles[B.id] || 0, v = etat.vit[B.id] || 0;
      v += (cible - a) * 0.08;
      v *= 0.86;
      a += v;
      if (Math.abs(v) < 0.0004 && Math.abs(cible - a) < 0.0008) { a = cible; v = 0; } else bouge = true;
      etat.angles[B.id] = a; etat.vit[B.id] = v;
    });
    rendre();
    if (bouge) etat.anim = requestAnimationFrame(boucle);
  }
  function demarrerAnim() { if (!etat.anim) etat.anim = requestAnimationFrame(boucle); }

  // ------------------------------------------------------------------------
  // Gestes : toucher, glisser-déposer
  // ------------------------------------------------------------------------
  function objetParId(id) { return etat.M.objets[id]; }
  function peutJouer() { return etat.actif && !etat.verrou && !etat.fini && !etat.pause && !voileOuvert(); }

  function toucherObjet(o) {
    if (!peutJouer()) return;
    if (o.lieu === null) {
      if (etat.choisi === o.id) { etat.choisi = null; SON.touche(); }
      else { etat.choisi = o.id; SON.prise(); }
      majObjets(); rendre();
      return;
    }
    if (etat.choisi !== null && etat.choisi !== o.id) { placer(objetParId(etat.choisi), o.lieu); return; }
    if (o.fixe) {
      secouer(etat.elems[o.id]); SON.erreur(); bulle(t('msg.fixe'));
      return;
    }
    retourReserve(o);
  }
  function toucherPlateau(E) {
    if (!peutJouer()) return;
    if (etat.choisi === null) {
      SON.touche();
      bulle(t('msg.choisir'));
      return;
    }
    placer(objetParId(etat.choisi), E.cle);
  }
  function capacite(cle) {
    var E = etat.M.emplacements.filter(function (e) { return e.cle === cle; })[0];
    return E.balance.g.cols === 1 ? 4 : 6;
  }
  function placer(o, cle, parIndice) {
    if (!o || o.fixe) return;
    var n = etat.M.objets.filter(function (x) { return x.lieu === cle && x !== o; }).length;
    if (n >= capacite(cle)) { SON.erreur(); bulle(t('msg.plein')); etat.choisi = null; majObjets(); rendre(); return; }
    voler(o);
    o.lieu = cle;
    o.ordre = ++etat.ordre;
    etat.choisi = null;
    SON.pose();
    changement();
    if (parIndice) eclatSur(etat.elems[o.id], 8);
  }
  function retourReserve(o) {
    if (!o || o.fixe) return;
    voler(o);
    o.lieu = null;
    etat.choisi = null;
    SON.retour();
    changement();
  }
  function voler(o) {
    var b = etat.elems[o.id];
    if (!b) return;
    b.classList.add('vol');
    clearTimeout(b._vol);
    b._vol = setTimeout(function () { b.classList.remove('vol'); }, 340);
  }
  // Après chaque déplacement : le trésorier recale les balances
  function changement() {
    etat.cale = true;
    etat.droites = {};
    majObjets();
    majBandeau();
    rendre();
    demarrerAnim();
  }
  function secouer(el) {
    if (!el) return;
    el.classList.remove('secoue');
    void el.offsetWidth;
    el.classList.add('secoue');
  }

  var glisse = null;
  function debutGlisser(e, o, b) {
    if (!peutJouer()) return;
    if (e.button !== undefined && e.button !== 0) return;
    glisse = { o: o, b: b, x0: e.clientX, y0: e.clientY, bouge: false, id: e.pointerId };
    try { b.setPointerCapture(e.pointerId); } catch (err) { /* rien */ }
  }
  function cibleSous(x, y) {
    var trouve = null;
    Object.keys(etat.cibles2).forEach(function (cle) {
      var r = etat.cibles2[cle].getBoundingClientRect();
      if (x >= r.left - 6 && x <= r.right + 6 && y >= r.top - 6 && y <= r.bottom + 6) trouve = cle;
    });
    return trouve;
  }
  document.addEventListener('pointermove', function (e) {
    if (!glisse || e.pointerId !== glisse.id) return;
    var dx = e.clientX - glisse.x0, dy = e.clientY - glisse.y0;
    if (!glisse.bouge && dx * dx + dy * dy < 64) return;
    if (!glisse.bouge) {
      glisse.bouge = true;
      glisse.b.classList.add('glisse');
      glisse.b.classList.remove('vol');
      etat.choisi = null; majObjets();
      SON.prise();
    }
    var z = $('#zone').getBoundingClientRect(), S = etat.L.S;
    glisse.b.style.left = (e.clientX - z.left - S / 2) + 'px';
    glisse.b.style.top = (e.clientY - z.top - S * 0.85) + 'px';
    var c = cibleSous(e.clientX, e.clientY - S * 0.35);
    Object.keys(etat.cibles2).forEach(function (cle) { etat.cibles2[cle].classList.toggle('survol', cle === c); });
  });
  function finGlisser(e, annule) {
    if (!glisse || e.pointerId !== glisse.id) return;
    var g = glisse;
    glisse = null;
    if (!g.bouge) return;
    etat.finGlisse = performance.now();
    g.b.classList.remove('glisse');
    Object.keys(etat.cibles2).forEach(function (cle) { etat.cibles2[cle].classList.remove('survol'); });
    if (annule || !peutJouer()) { voler(g.o); rendre(); return; }
    var c = cibleSous(e.clientX, e.clientY - etat.L.S * 0.35);
    var z = $('#zone').getBoundingClientRect();
    if (c) { if (c !== g.o.lieu) placer(g.o, c); else { voler(g.o); rendre(); } }
    else if (e.clientY - z.top > etat.L.H - etat.L.RH - 10) { if (g.o.lieu !== null) retourReserve(g.o); else { voler(g.o); rendre(); } }
    else { voler(g.o); rendre(); }
  }
  document.addEventListener('pointerup', function (e) { finGlisser(e, false); });
  document.addEventListener('pointercancel', function (e) { finGlisser(e, true); });

  // ------------------------------------------------------------------------
  // Bulle du roi
  // ------------------------------------------------------------------------
  var minuteurBulle = null;
  function bulle(texte, duree) {
    var b = $('#bulle');
    b.innerHTML = svgTeteRoi() + '<span></span>';
    b.querySelector('span').textContent = texte;
    b.classList.add('vu');
    clearTimeout(minuteurBulle);
    minuteurBulle = setTimeout(cacherBulle, duree || 3400);
  }
  function cacherBulle() { $('#bulle').classList.remove('vu'); }

  // ------------------------------------------------------------------------
  // Pesée
  // ------------------------------------------------------------------------
  function peser() {
    if (!peutJouer()) return;
    var M = etat.M, lieux = lieuxActuels(M);
    etat.pesees++;
    etat.verrou = true;
    etat.cale = false;
    etat.choisi = null;
    etat.droites = {};
    M.balances.forEach(function (B) { etat.cibles[B.id] = angleCible(B, moment(M, B, lieux)); });
    SON.pesee();
    if (etat.def.lim) setTimeout(SON.chandelle, 150);
    majObjets();
    majBandeau();
    demarrerAnim();
    plusTard(resultatPesee, 1000);
  }

  // Poids cachés déduits : une balance droite où il ne reste qu'une sorte inconnue
  function deduire() {
    var M = etat.M, lieux = lieuxActuels(M), nouveaux = [];
    function compterCaches(E, f, coef) {
      M.objets.forEach(function (o, i) { if (lieux[i] === E.cle && o.cache) coef[o.k] = (coef[o.k] || 0) + f; });
      if (E.enfant) E.enfant.emplacements.forEach(function (E2) { compterCaches(E2, f, coef); });
    }
    var change = true;
    while (change) {
      change = false;
      M.balances.forEach(function (B) {
        if (moment(M, B, lieux) !== 0) return;
        var coef = {};
        B.emplacements.forEach(function (E) { compterCaches(E, E.cote * E.dist, coef); });
        var inconnues = Object.keys(coef).filter(function (k) { return coef[k] !== 0 && !etat.revele[k]; });
        if (inconnues.length === 1) { etat.revele[inconnues[0]] = true; nouveaux.push(inconnues[0]); change = true; }
      });
    }
    return nouveaux;
  }

  function resultatPesee() {
    if (!etat.actif || !etat.M) return;
    var M = etat.M, lieux = lieuxActuels(M);
    var penchent = [];
    M.balances.forEach(function (B) {
      var m = moment(M, B, lieux);
      etat.droites[B.id] = (m === 0);
      if (m !== 0) penchent.push({ B: B, m: m });
    });
    var nouveaux = deduire();
    if (nouveaux.length) {
      SON.revele();
      M.objets.forEach(function (o) { if (o.cache && nouveaux.indexOf(o.k) >= 0) eclatSur(etat.elems[o.id], 10); });
    }
    majObjets();
    rendre();
    if (estResolu(M, lieux)) { victoire(); return; }
    etat.verrou = false;
    if (!penchent.length) {
      SON.erreur();
      bulle(t('msg.commande'), 4200);
      M.cmd.forEach(function (c, i) {
        if (!commandeRespectee(M, lieux, c)) { var el = document.querySelector('.cmd[data-cmd="' + i + '"]'); if (el) el.classList.add('alerte'); }
      });
    } else {
      SON.penche();
      if (penchent.length === 1) {
        var p = penchent[0], cote = p.m > 0 ? 'D' : 'G';
        if (p.B.parent) bulle(t('msg.basPenche' + cote));
        else if (M.racines.length === 2) bulle(t('msg.unePenche'));
        else bulle(t('msg.penche' + cote));
      } else bulle(t('msg.penchent', { n: penchent.length }));
    }
    if (nouveaux.length) setTimeout(function () { bulle(t('msg.revele')); }, 1600);
    if (etat.def.lim && etat.pesees >= etat.def.lim) {
      etat.verrou = true;
      plusTard(defaite, 1500);
    }
  }

  // ------------------------------------------------------------------------
  // Indice : déplace un objet vers une solution
  // ------------------------------------------------------------------------
  function indice() {
    if (!peutJouer()) return;
    var M = etat.M, sols = resoudre(M, 400);
    if (!sols.length) { bulle(t('msg.indiceRien')); return; }
    var cur = lieuxActuels(M), meilleure = sols[0], score = -1;
    sols.forEach(function (s) {
      var sc = 0;
      M.objets.forEach(function (o, i) { if (!o.fixe && s[i] === cur[i]) sc++; });
      if (sc > score) { score = sc; meilleure = s; }
    });
    var choix = null;
    M.objets.forEach(function (o, i) { if (!choix && !o.fixe && cur[i] !== null && meilleure[i] !== cur[i]) choix = { o: o, lieu: meilleure[i] }; });
    if (!choix) M.objets.forEach(function (o, i) { if (!choix && !o.fixe && cur[i] === null && meilleure[i] !== null) choix = { o: o, lieu: meilleure[i] }; });
    if (!choix) {
      bulle(t('msg.indicePeser'));
      var bp = $('#btn-peser'); bp.classList.remove('pulse'); void bp.offsetWidth; bp.classList.add('pulse');
      return;
    }
    var premier = !etat.indice;
    etat.indice = true;
    SON.indice();
    if (choix.lieu === null) { retourReserve(choix.o); eclatSur(etat.elems[choix.o.id], 8); }
    else placer(choix.o, choix.lieu, true);
    bulle(t(premier ? 'msg.indicePremier' : 'msg.indice'));
  }

  function toutReprendre() {
    if (!peutJouer()) return;
    var bouge = false;
    etat.M.objets.forEach(function (o) { if (!o.fixe && o.lieu !== null) { voler(o); o.lieu = null; bouge = true; } });
    etat.choisi = null;
    if (bouge) SON.retour(); else SON.touche();
    changement();
  }

  // ------------------------------------------------------------------------
  // Effets visuels
  // ------------------------------------------------------------------------
  function eclatSur(el, n) {
    if (!el) return;
    var r = el.getBoundingClientRect();
    eclats(r.left + r.width / 2, r.top + r.height / 2, n || 8);
  }
  function eclats(x, y, n) {
    var couche = $('#effets');
    for (var i = 0; i < n; i++) {

  // ------------------------------------------------------------------------
  // Fin de niveau
  // ------------------------------------------------------------------------
  function calculerEtoiles() {
    var d = etat.def, n = etat.pesees, e;
    if (n <= d.par) e = 3;
    else if (d.lim) e = n <= d.par + 1 ? 2 : 1;
    else e = n <= d.par + 2 ? 2 : 1;
    if (etat.indice) e = Math.min(e, 2);
    return e;
  }
  function sauverPartie(niveau) {
    var donnees = { niveau: niveau, score: scoreTotal(), progres: P, options: { son: P.son } };
    try { window.JEL_SAVE.save(JEU, donnees); } catch (e) { /* sauvegarde indisponible */ }
  }

  function victoire() {
    var M = etat.M;
    etat.fini = true; etat.actif = false; etat.verrou = true;
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: etat.defi ? null : etat.niv + 1 });
    M.objets.forEach(function (o) { if (o.cache) etat.revele[o.k] = true; });
    majObjets();
    SON.droite();
    M.balances.forEach(function (B) { var r = etat.L; var rec = geometrie().balances.filter(function (x) { return x.B === B; })[0]; var z = $('#zone').getBoundingClientRect(); if (rec) eclats(z.left + r.ox + rec.px * r.k, z.top + r.oy + rec.py * r.k, 10); });
    var avant = photoRecompenses();
    var etoiles = calculerEtoiles();
    var plafond = etat.def.lim || etat.def.par + 3;
    var score = 100 * etoiles + 25 * Math.max(0, plafond - etat.pesees);
    var ancien, record;
    if (!etat.defi) {
      var i = etat.niv;
      ancien = P.records[i] || 0;
      record = score > ancien;
      P.etoiles[i] = Math.max(P.etoiles[i] || 0, etoiles);
      P.records[i] = Math.max(ancien, score);
      if (etat.pesees === 1) P.unePesee[i] = true;
      P.debloque = Math.max(P.debloque, Math.min(NIVEAUX.length, i + 2));
      garderLocal();
      sauverPartie(Math.min(NIVEAUX.length, i + 2));
      // Jeu terminé (tous les niveaux gagnés, maintenant ou avant : P est sauvegardé) : total des meilleures étoiles.
      if (P.etoiles.every(function (e) { return e > 0; })) {
        if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
      }
    } else {
      var jour = dateDuJour();
      if (P.defi.date !== jour) P.defi = { date: jour, etoiles: 0, record: 0 };
      ancien = P.defi.record;
      record = score > ancien;
      P.defi.etoiles = Math.max(P.defi.etoiles, etoiles);
      P.defi.record = Math.max(P.defi.record, score);
      P.defiReussis++;
      garderLocal();
      try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { progres: P }); } catch (e) { /* rien */ }
    }
    var apres = photoRecompenses();
    var gains = [];
    TAPIS.forEach(function (id, j) { if (apres.tapis[j] && !avant.tapis[j]) gains.push(t('fin.tapis', { nom: t('tapis.' + id) })); });
    BLASONS.forEach(function (id, j) { if (apres.blasons[j] && !avant.blasons[j]) gains.push(t('fin.blason', { nom: t('blason.' + id) })); });
    if (apres.defi && !avant.defi) gains.push(t('fin.defiOuvert'));
    plusTard(function () {
      montrerFin(true, { etoiles: etoiles, score: score, ancien: ancien, record: record, gains: gains });
    }, 1100);
  }
  function defaite() {
    etat.fini = true; etat.actif = false; etat.verrou = true;

    SON.defaite();
    var ancien = etat.defi ? P.defi.record : (P.records[etat.niv] || 0);

  function montrerFin(gagne, info) {

    $('#fin-texte').textContent = gagne ? t(dernier ? 'fin.dernier' : (etat.defi ? 'fin.defi' : 'fin.droites')) : t('fin.chandelles');
    var et = $('#fin-etoiles');
    et.innerHTML = '';
    for (var i = 0; i < 3; i++) {
      var pleine = i < info.etoiles;
      et.insertAdjacentHTML('beforeend', etoileSVG(pleine, pleine ? 'animation-delay:' + (0.25 + i * 0.35) + 's' : ''));
      if (pleine) (function (k) { setTimeout(function () { SON.etoile(k); }, 250 + k * 350); })(i);
    }
    et.setAttribute('role', 'img');
    et.setAttribute('aria-label', t('aria.etoiles', { n: info.etoiles }));
    // score qui défile
    var sc = $('#fin-score'), debut = performance.now();
    sc.textContent = t('fin.score', { n: 0 });
    (function compte() {
      var p = Math.min(1, (performance.now() - debut) / 900);
      sc.textContent = t('fin.score', { n: Math.round(info.score * p) });
      if (p < 1) requestAnimationFrame(compte);
    })();
    $('#fin-pesees').textContent = t('fin.pesees', { n: etat.pesees });
    var rec = $('#fin-record');
    rec.className = 'fin-info' + (info.record ? ' fin-record' : '');
    rec.textContent = info.record ? t('fin.nouveauRecord') : t('fin.record', { n: info.ancien });
    var ul = $('#fin-recompenses');
    ul.innerHTML = '';
    info.gains.forEach(function (g) { var li = document.createElement('li'); li.textContent = g; ul.appendChild(li); });
    if (info.gains.length) setTimeout(SON.debloque, 900);
    var bt = $('#fin-boutons');
    bt.innerHTML = '';
    function ajouter(cle, ico, classe, action) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn' + (classe ? ' ' + classe : '');
      b.innerHTML = icone(ico) + '<span></span>';
      b.querySelector('span').textContent = t(cle);
      b.addEventListener('click', function () { SON.touche(); action(); });
      bt.appendChild(b);
      return b;
    }
    var premier;
    if (gagne) {
      if (!etat.defi && !dernier) premier = ajouter('niveauSuivant', 'suivant', '', niveauSuivant);
      var r = ajouter('rejouer', 'vider', 'sec', function () { lancerNiveau(etat.defi ? -1 : etat.niv); });
      if (!premier) premier = r;
      ajouter('niveaux', 'grille', 'sec', function () { fermerVoiles(); afficher('niveaux'); });
      if (dernier || etat.defi) ajouter('salleTrone', 'couronne', 'sec', function () { fermerVoiles(); afficher('tresor'); });
      confettis();
      SON.victoire();

      premier = ajouter('reessayer', 'vider', '', function () { lancerNiveau(etat.defi ? -1 : etat.niv); });
      ajouter('niveaux', 'grille', 'sec', function () { fermerVoiles(); afficher('niveaux'); });

    setTimeout(function () { try { premier.focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 50);
  }
