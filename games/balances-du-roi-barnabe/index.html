    c.innerHTML = h;
    c.querySelector('#tuto-titre').textContent = t('tuto.' + nom + '.titre');
    if (nom === 'base') {
      var li = c.querySelectorAll('li');
      li[0].textContent = t('tuto.base.1'); li[1].textContent = t('tuto.base.2'); li[2].textContent = t('tuto.base.3');
    } else c.querySelector('.tuto-texte').textContent = t('tuto.' + nom + '.texte');
    c.querySelector('#btn-tuto-ok span').textContent = t('tuto.ok');
    c.querySelector('#btn-tuto-ok').addEventListener('click', function (e) { e.stopPropagation(); fermerTuto(); });
    ouvrirVoile('voile-tuto');
    if (nom === 'base') {
      // la main montre : un sac de la réserve → le plateau de droite → Peser
      setTimeout(function () {
        if (!voile.classList.contains('ouvert')) return;
        var o = etat.M.objets.filter(function (x) { return !x.fixe; })[0];
        var plateau = etat.cibles2[etat.M.racines[0].id + ':d1'];
        if (o && plateau) lancerMain([centre(etat.elems[o.id]), centre(plateau), centre($('#btn-peser'))]);
      }, 200);
    }
    setTimeout(function () { try { c.querySelector('#btn-tuto-ok').focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 60);
  }
  function fermerTuto() {
    SON.touche();
    $('#voile-tuto').classList.remove('ouvert');
    arreterMain();
  }
  $('#voile-tuto').addEventListener('click', function (e) { if (e.target === e.currentTarget) fermerTuto(); });

  // ------------------------------------------------------------------------
  // Pause
  // ------------------------------------------------------------------------
  function mettrePause() {
    if (!etat.actif || etat.fini || etat.pause || ecranActuel !== 'jeu') return;
    if ($('#voile-tuto').classList.contains('ouvert')) return;
    etat.pause = true;
    if (etat.anim) { cancelAnimationFrame(etat.anim); etat.anim = 0; }
    try { document.getAnimations().forEach(function (a) { a.pause(); }); } catch (e) { /* rien */ }
    SON.suspendre();
    ouvrirVoile('voile-pause');
    setTimeout(function () { try { $('#btn-reprendre').focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 50);
  }
  function reprendre() {
    if (!etat.pause) return;
    etat.pause = false;
    $('#voile-pause').classList.remove('ouvert');
    try { document.getAnimations().forEach(function (a) { a.play(); }); } catch (e) { /* rien */ }
    SON.reprendre();
    demarrerAnim();
    var att = etat.attentes; etat.attentes = [];
    att.forEach(function (fn) { setTimeout(fn, 250); });
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') mettrePause(); });

  // ------------------------------------------------------------------------
  // Écran des niveaux
  // ------------------------------------------------------------------------
  function construireNiveaux() {
    $('#total-etoiles').innerHTML = etoileSVG(true) + '<span></span>';
    $('#total-etoiles span').textContent = t('totalEtoiles', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    var liste = $('#liste-niveaux');
    liste.innerHTML = '';
    // Défi du jour
    var defi = document.createElement('button');
    defi.type = 'button';
    defi.className = 'carte-defi' + (defiOuvert() ? '' : ' ferme');
    defi.innerHTML = icone(defiOuvert() ? 'soleil' : 'cadenas') + '<span><b></b><small></small></span>';
    defi.querySelector('b').textContent = t('defi');
    var jour = dateDuJour();
    defi.querySelector('small').textContent = !defiOuvert() ? t('defiFerme') : (P.defi.date === jour && P.defi.etoiles ? t('defiFait', { n: P.defi.etoiles }) : t('defiTexte'));
    defi.addEventListener('click', function () { lancerDefi(); });
    liste.appendChild(defi);
    SALLES.forEach(function (s, si) {
      var bloc = document.createElement('div');
      bloc.className = 'salle-bloc';
      bloc.innerHTML = '<h3></h3><p></p><div class="grille-niv"></div>';
      bloc.querySelector('h3').textContent = t('salle.' + s);
      bloc.querySelector('p').textContent = t('salleDesc.' + s);
      var g = bloc.querySelector('.grille-niv');
      for (var j = 0; j < 5; j++) {
        (function (i) {
          var b = document.createElement('button');
          b.type = 'button';
          var ferme = i >= P.debloque;
          b.className = 'niv' + (ferme ? ' ferme' : '');
          if (ferme) {
            b.innerHTML = icone('cadenas');
            b.setAttribute('aria-label', t('aria.niveauFerme', { n: i + 1 }));
          } else {
            b.innerHTML = '<span class="num"></span>' + etoilesHTML(P.etoiles[i] || 0);
            b.querySelector('.num').textContent = nb(i + 1);
            b.setAttribute('aria-label', t('aria.niveau', { n: i + 1 }) + ', ' + t('aria.etoiles', { n: P.etoiles[i] || 0 }));
          }
          b.addEventListener('click', function () {
            if (ferme) { SON.erreur(); secouer(b); return; }
            SON.touche();
            lancerNiveau(i);
          });
          g.appendChild(b);
        })(si * 5 + j);
      }
      liste.appendChild(bloc);
    });
  }
  function lancerDefi() {
    if (!defiOuvert()) {
      SON.erreur();
      if (ecranActuel !== 'niveaux') afficher('niveaux');
      secouer(document.querySelector('.carte-defi'));
      return;
    }
    SON.touche();
    lancerNiveau(-1);
  }

  // ------------------------------------------------------------------------
  // Salle du trône : tapisseries et blasons
  // ------------------------------------------------------------------------
  function construireTresor() {
    $('#tresor-scene').innerHTML = '<svg viewBox="0 70 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + scene(P.tapis, false) + '</svg>';
    $('#tresor-total').innerHTML = etoileSVG(true) + '<span></span>';
    $('#tresor-total span').textContent = t('totalEtoiles', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    var gt = $('#grille-tapis');
    gt.innerHTML = '';
    TAPIS.forEach(function (id, i) {
      var ouvert = tapisDebloque(i);
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tapis-carte' + (ouvert ? '' : ' ferme') + (P.tapis === id ? ' choisi' : '');
      b.innerHTML = svgTapis(id) + '<span class="nom"></span><span class="etat"></span>';
      b.querySelector('.nom').textContent = t('tapis.' + id);
      var etatTxt = b.querySelector('.etat');
      if (!ouvert) { etatTxt.innerHTML = icone('cadenas') + etoileSVG(true) + '<span></span>'; etatTxt.querySelector('span').textContent = nb(SEUILS_TAPIS[i]); }
      else etatTxt.textContent = P.tapis === id ? t('tapisAccrochee') : t('tapisAccrocher');
      b.setAttribute('aria-label', t('tapis.' + id) + ', ' + (ouvert ? (P.tapis === id ? t('tapisAccrochee') : t('tapisAccrocher')) : t('aria.tapisFerme', { n: SEUILS_TAPIS[i] })));
      b.addEventListener('click', function () {
        if (!ouvert) { SON.erreur(); secouer(b); return; }
        P.tapis = (P.tapis === id) ? '' : id;
        garderLocal();
        SON.debloque();
        construireTresor();
        try { gt.children[i].focus({ preventScroll: true }); } catch (e) { /* rien */ }
      });
      gt.appendChild(b);
    });
    var gb = $('#grille-blasons');
    gb.innerHTML = '';
    BLASONS.forEach(function (id) {
      var ok = blasonGagne(id);
      var d = document.createElement('div');
      d.className = 'blason' + (ok ? '' : ' ferme');
      d.innerHTML = svgBlason(id) + '<span></span><small></small>';
      d.querySelector('span').textContent = t('blason.' + id);
      d.querySelector('small').textContent = ok ? t('blasonGagne') : t('blasonCond.' + id);
      gb.appendChild(d);
    });
  }

  // ------------------------------------------------------------------------
  // Clavier : flèches pour se déplacer, Entrée ou Espace pour toucher
  // ------------------------------------------------------------------------
  function visibles(conteneur) {
    return Array.prototype.filter.call(conteneur.querySelectorAll('button'), function (b) {
      if (b.disabled) return false;
      var r = b.getBoundingClientRect();
      return r.width > 0 && r.height > 0;
    });
  }
  function naviguer(dx, dy) {
    var conteneur = voileOuvert() || document.getElementById('ecran-' + ecranActuel);
    var liste = visibles(conteneur);
    if (!liste.length) return;
    var cur = document.activeElement;
    if (liste.indexOf(cur) < 0) {
      var depart = conteneur.id === 'ecran-jeu' ? (liste.filter(function (b) { return b.classList.contains('objet') && !b.classList.contains('fixe'); })[0] || $('#btn-peser')) : liste[0];
      depart.focus();
      return;
    }
    var r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var meilleur = null, score = Infinity;
    liste.forEach(function (b) {
      if (b === cur) return;
      var q = b.getBoundingClientRect(), vx = q.left + q.width / 2 - cx, vy = q.top + q.height / 2 - cy;
      var avance = vx * dx + vy * dy;
      if (avance <= 4) return;
      var cote = Math.abs(vx * dy - vy * dx);
      var sc = avance + cote * 2.2;
      if (sc < score) { score = sc; meilleur = b; }
    });
    if (meilleur) meilleur.focus();
  }
  document.addEventListener('keydown', function (e) {
    var code = e.code;
    if (code === 'Escape' || code === 'KeyP') {
      if ($('#voile-tuto').classList.contains('ouvert')) { e.preventDefault(); fermerTuto(); return; }
      if (etat.pause) { e.preventDefault(); reprendre(); return; }
      if (ecranActuel === 'jeu' && !voileOuvert()) { e.preventDefault(); mettrePause(); return; }
      if (code === 'Escape' && (ecranActuel === 'niveaux' || ecranActuel === 'tresor') && !voileOuvert()) { e.preventDefault(); afficher('titre'); return; }
    }
    var fl = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[code];
    if (fl) { e.preventDefault(); naviguer(fl[0], fl[1]); return; }
    if ((code === 'Enter' || code === 'NumpadEnter') && ecranActuel === 'jeu' && !voileOuvert() && (document.activeElement === document.body || !document.activeElement)) {
      e.preventDefault(); peser(); return;
    }
    if ((code === 'Backspace' || code === 'Delete') && ecranActuel === 'jeu' && etat.choisi !== null) {
      e.preventDefault(); etat.choisi = null; SON.touche(); majObjets(); rendre();
    }
  });

  // ------------------------------------------------------------------------
  // Boutons
  // ------------------------------------------------------------------------
  document.querySelectorAll('[data-ico]').forEach(function (b) { b.insertAdjacentHTML('afterbegin', icone(b.getAttribute('data-ico'))); });
  document.querySelectorAll('.btn-son').forEach(function (b) { b.addEventListener('click', basculerSon); });
  majBoutonsSon();

  $('#btn-jouer').addEventListener('click', function () {
    SON.touche();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: function (d) {
        var n = Math.max(1, Math.min(NIVEAUX.length, d.niveau || 1));
        if (n > P.debloque) P.debloque = n;
        lancerNiveau(n - 1);
      },
      onNouvelle: function () { lancerNiveau(0); },
      onEffacer: function () { effacerProgres(); if (effacerTitre && effacerTitre.maj) effacerTitre.maj(); lancerNiveau(0); }
    });
  });
  $('#btn-niveaux').addEventListener('click', function () { SON.touche(); afficher('niveaux'); });
  $('#btn-tresor').addEventListener('click', function () { SON.touche(); afficher('tresor'); });
  $('#btn-defi').addEventListener('click', lancerDefi);
  document.querySelectorAll('.btn-retour').forEach(function (b) { b.addEventListener('click', function () { SON.touche(); afficher('titre'); }); });
  $('#btn-pause').addEventListener('click', function () { SON.touche(); mettrePause(); });
  $('#btn-reprendre').addEventListener('click', function () { reprendre(); SON.touche(); });
  $('#btn-recommencer').addEventListener('click', function () { etat.pause = false; reprendreAnimations(); lancerNiveau(etat.defi ? -1 : etat.niv); });
  $('#btn-accueil').addEventListener('click', function () { etat.pause = false; etat.actif = false; reprendreAnimations(); fermerVoiles(); afficher('titre'); });
  function reprendreAnimations() {
    try { document.getAnimations().forEach(function (a) { a.play(); }); } catch (e) { /* rien */ }
    SON.reprendre();
    etat.attentes = [];
  }
  $('#btn-peser').addEventListener('click', peser);
  $('#btn-indice').addEventListener('click', indice);
  $('#btn-vider').addEventListener('click', toutReprendre);
  $('#reserve-fond').addEventListener('click', function () {
    if (etat.choisi !== null && peutJouer()) { etat.choisi = null; SON.touche(); majObjets(); rendre(); }
  });
  window.addEventListener('resize', function () {
    if (ecranActuel === 'jeu') mesurer();
    else if (ecranActuel === 'titre') majTitre();
  });

  try {
    effacerTitre = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('#effacer-titre'), apres: function () { effacerProgres(); majTitre(); } });
  } catch (e) { effacerTitre = null; }

  // Sauvegarde à la fermeture de la page, seulement pendant une partie
  window.JEL_SAVE.surFermeture(function () {
    if (etat.actif && !etat.fini && !etat.defi) sauverPartie(etat.niv + 1);
  });

  majTitre();
})();
</script>
</body>
</html>
