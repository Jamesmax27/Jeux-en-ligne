<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c5a7a; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #zone { position: relative; flex: 1; min-height: 0; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Barre du haut pendant la partie */
  #hud { display: none; flex: none; padding: 6px 8px 4px; gap: 6px; background: linear-gradient(#063a52ee, #063a5299);
    border-bottom: 2px solid #ffffff22; }
  #app.en-jeu #hud { display: block; }
  .hud-ligne { display: flex; align-items: center; gap: 8px; }
  .hud-ligne + .hud-ligne { margin-top: 4px; }
  .hud-niv { font-weight: 800; font-size: 17px; flex: 1; min-width: 0; }
  .pastille { display: inline-flex; align-items: center; gap: 4px; background: #ffffff1f; border-radius: 14px;
    padding: 3px 10px; font-weight: 700; font-size: 15px; white-space: nowrap; }
  #hObj { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; line-height: 1.15; }
  #hObj canvas { flex: none; width: 30px; height: 30px; }
  #hObjTxt { min-width: 0; }
  #hObjAv { font-weight: 800; color: #ffe27a; white-space: nowrap; }
  .rond { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 2px solid #ffffff66; background: #ffffff22;
    color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .rond svg { width: 22px; height: 22px; fill: currentColor; }
  .rond:focus-visible, .btn:focus-visible, .case:focus-visible, .carte-deco:focus-visible { outline: 3px solid #ffe27a; outline-offset: 2px; }
  /* Écrans */
  .ecran { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 14px; overflow-y: auto; z-index: 5; }
  .ecran[hidden] { display: none; }
  .voile { background: #032433b3; }
  .carte { background: linear-gradient(#0f6d8ef2, #0a4d6af2); border: 3px solid #ffffff44; border-radius: 22px;
    padding: 16px 16px 18px; width: min(380px, 100%); text-align: center; box-shadow: 0 10px 30px #0006; }
  h1, h2 { margin: 0 0 8px; line-height: 1.1; text-shadow: 0 3px 0 #0005; }
  h1 { font-size: clamp(34px, 10vw, 52px); color: #fff4c9; letter-spacing: .5px; }
  h2 { font-size: 26px; color: #fff4c9; }
  p { margin: 6px 0; line-height: 1.35; }
  .btn { display: block; width: 100%; min-height: 48px; margin: 8px 0 0; border: 0; border-radius: 16px; cursor: pointer;
    font: inherit; font-size: 19px; font-weight: 800; color: #3b1e00; background: linear-gradient(#ffe27a, #ffb84d);
    box-shadow: 0 4px 0 #b86f1a; padding: 8px 12px; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b86f1a; }
  .btn.second { color: #fff; background: linear-gradient(#3fc1d6, #1b8fb0); box-shadow: 0 4px 0 #0b5a73; }
  .btn.second:active { box-shadow: 0 2px 0 #0b5a73; }
  .btn.gros { font-size: 24px; min-height: 60px; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .rangee { display: flex; gap: 8px; }
  .rangee .btn { flex: 1; font-size: 16px; }
  /* Écran titre : le dessin du fond reste visible */
  #eTitre { justify-content: space-between; padding: 18px 14px 14px; }
  .titre-haut { text-align: center; max-width: 420px; }
  .titre-haut p { font-size: 17px; font-weight: 600; text-shadow: 0 2px 4px #0008; background: #04304580; border-radius: 14px; padding: 6px 10px; }
  .titre-bas { width: min(360px, 100%); }
  .petit { font-size: 13px; background: #04304599; border-radius: 10px; padding: 3px 8px; text-align: center; }
  .outils { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  /* Niveaux */
  .grille { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin: 10px 0; }
  .case { min-height: 58px; border-radius: 14px; border: 2px solid #ffffff55; background: #ffffff22; color: #fff; font: inherit;
    font-weight: 800; font-size: 19px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; }
  .case .et { font-size: 11px; color: #ffe27a; letter-spacing: -1px; }
  .case.fermee { opacity: .45; cursor: default; }
  .case.fermee svg { width: 20px; height: 20px; fill: #fff; }
  /* Présentation d'une mécanique */
  #demo { width: 100%; max-width: 300px; aspect-ratio: 7 / 5; border-radius: 16px; background: #0a3d55; display: block; margin: 6px auto; }
  .etapes { text-align: left; margin: 6px 0 0; padding-left: 22px; }
  .etapes li { margin: 3px 0; font-weight: 600; }
  /* Fin de niveau */
  .etoiles { display: flex; justify-content: center; gap: 8px; margin: 6px 0; }
  .etoiles svg { width: 54px; height: 54px; fill: #ffffff33; transition: transform .3s; }
  .etoiles svg.on { fill: #ffd84a; animation: saute .5s ease; filter: drop-shadow(0 0 8px #ffd84a); }
  @keyframes saute { 0% { transform: scale(.2) rotate(-40deg); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .gros-score { font-size: 32px; font-weight: 900; color: #fff4c9; }
  .record { color: #ffe27a; font-weight: 800; }
  /* Carnet et décor */
  .liste { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; text-align: left; }
  .fiche { background: #ffffff18; border-radius: 14px; padding: 6px; display: flex; gap: 6px; align-items: center; }
  .fiche canvas { width: 52px; height: 52px; flex: none; }
  .fiche b { display: block; font-size: 14px; }
  .fiche span { font-size: 12px; opacity: .9; line-height: 1.2; display: block; }
  .carte-deco { background: #ffffff18; border: 3px solid transparent; border-radius: 14px; padding: 6px; color: #fff; font: inherit;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; }
  .carte-deco canvas { width: 72px; height: 56px; }
  .carte-deco.choisi { border-color: #ffe27a; }
  .carte-deco.fermee { opacity: .55; cursor: default; }
  .carte-deco small { font-size: 12px; }
  .liste.trois { grid-template-columns: repeat(3, 1fr); }
  h3 { margin: 10px 0 2px; font-size: 18px; color: #bff3ff; }
  /* Bannière et messages */
  #banniere { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); z-index: 4; pointer-events: none; text-align: center;
    background: #04304599; border-radius: 18px; padding: 10px 18px; width: max-content; max-width: 90%; opacity: 0; }
  #banniere.vue { animation: banniere 2.6s ease forwards; }
  #banniere b { display: block; font-size: 26px; color: #fff4c9; }
  @keyframes banniere { 0% { opacity: 0; transform: translate(-50%, 20px); } 12%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -10px); } }
  #toast { position: absolute; left: 50%; top: 12%; transform: translateX(-50%); z-index: 4; pointer-events: none; font-weight: 900;
    font-size: 22px; color: #fff4c9; text-shadow: 0 3px 0 #0006, 0 0 12px #3fd7ff; opacity: 0; white-space: nowrap; }
  #toast.vu { animation: toast 1.4s ease forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.7); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 75% { opacity: 1; transform: translate(-50%, -6px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
  #placeLangue, #placeLanguePause { display: inline-block; }
  .cache, [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-ligne">
      <button class="rond" id="bPause" data-i18n-aria="aria.pause" data-i18n-title="aria.pause">
        <svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>
      </button>
      <div class="hud-niv" id="hNiv"></div>
      <span class="pastille" id="hScore"></span>
      <button class="rond bSon" data-i18n-aria="aria.son" data-i18n-title="aria.son"></button>
    </div>
    <div class="hud-ligne">
      <div id="hObj"><canvas id="hObjIcone" width="60" height="60"></canvas><span id="hObjTxt"></span><span id="hObjAv"></span></div>
      <span class="pastille" id="hBulles"></span>
    </div>
  </div>
  <div id="zone">
    <canvas id="scene"></canvas>
    <div id="banniere"><b id="banTitre"></b><span id="banTexte"></span></div>
    <div id="toast"></div>

    <!-- Écran titre -->
    <section class="ecran" id="eTitre">
      <div class="titre-haut">
        <h1 data-i18n="titre"></h1>
        <p data-i18n="consigne"></p>
      </div>
      <div class="titre-bas">
        <button class="btn gros" id="bJouer" data-i18n="jouer"></button>
        <div class="rangee">
          <button class="btn second" id="bNiveaux" data-i18n="niveaux"></button>
          <button class="btn second" id="bSansFin" data-i18n="sansFin"></button>
        </div>
        <div class="rangee">
          <button class="btn second" id="bCarnet" data-i18n="carnet"></button>
          <button class="btn second" id="bDecor" data-i18n="decor"></button>
        </div>
        <div class="outils">
          <button class="rond bSon" data-i18n-aria="aria.son" data-i18n-title="aria.son"></button>
          <span id="placeLangue"></span>
          <span id="placeEffacer"></span>
        </div>
        <p class="petit" data-i18n="aideClavier"></p>
      </div>

<!-- =====================================================================
     Simulation des bulles : fonctions pures, sans accès à la page.
     Monde de 340 × 560 unités ; le bocal va de x = 20 à x = 320, son bord
     (ligne à ne pas dépasser) est à y = HAUT.
     ===================================================================== -->
<script id="bulles-sim">
(function () {
  'use strict';
  var W = 340, H = 560, HAUT = 120, Y_LACHER = 76, G = 1100;
  var NB = 10;                         // 10 créatures, de 0 (petit poisson) à 9 (baleine)
  var RAYONS = [];
  for (var i = 0; i < NB; i++) RAYONS.push(Math.round(16 * Math.pow(1.25, i) * 10) / 10);
  var R_DOREE = 18, R_OURSIN = 11;
  var POINTS = [1, 2, 5, 10, 20, 40, 80, 160, 320, 640];   // points pour la création d'une créature
  var POIDS = [6, 5, 4, 2, 1];                             // tirage des bulles lâchées

  // Formes des bocaux : ligne ouverte en haut (du bord gauche au bord droit).
  var BOCAUX = {
    droit: [[20, HAUT], [20, 530], [320, 530], [320, HAUT]],
    pente: [[20, HAUT], [20, 535], [320, 470], [320, HAUT]],
    penteG: [[20, HAUT], [20, 470], [320, 535], [320, HAUT]],
    entonnoir: [[20, HAUT], [20, 390], [148, 532], [192, 532], [320, 390], [320, HAUT]],
    bol: [[20, HAUT], [20, 420], [60, 500], [170, 535], [280, 500], [320, 420], [320, HAUT]]
  };

  // Les 20 niveaux. obj : objectif ; bulles : bulles disponibles ; e : bulles
  // utilisées au plus pour 2 et 3 étoiles ; pool : plus grosse créature tirée ;
  // rochers [x, y, r] ; oursins [x, y] ; courants { y1, y2, f, periode } ;
  // doree : une bulle dorée toutes les N bulles ; depart [créature, x, y].
  var NIVEAUX = [
    { obj: { type: 'creature', t: 3 }, bulles: 25, pool: 2, e: [16, 12], intro: 'base', graine: 101 },
    { obj: { type: 'creature', t: 4 }, bulles: 30, pool: 2, e: [19, 14], intro: 'bord', graine: 202 },
    { obj: { type: 'fusions', n: 14 }, bulles: 26, pool: 2, e: [23, 20], intro: 'fusions', graine: 303 },
    { obj: { type: 'creature', t: 4 }, bulles: 30, pool: 2, e: [19, 14], rochers: [[105, 395, 20], [238, 320, 18]], intro: 'rochers', graine: 404 },
    { obj: { type: 'creature', t: 5 }, bulles: 30, pool: 3, e: [22, 16], rochers: [[170, 430, 18]], intro: 'grosses', graine: 505 },
    { obj: { type: 'cascade', n: 3 }, bulles: 35, pool: 3, e: [22, 14], rochers: [[90, 360, 16], [252, 420, 18]], intro: 'cascade', graine: 606 },
    { obj: { type: 'creature', t: 4, n: 2 }, bulles: 38, pool: 3, e: [27, 21], courants: [{ y1: 190, y2: 290, f: 380 }], intro: 'courants', graine: 707 },
    { obj: { type: 'score', n: 400 }, bulles: 40, pool: 3, e: [35, 30], courants: [{ y1: 160, y2: 230, f: 380 }, { y1: 300, y2: 380, f: -380 }], rochers: [[170, 465, 16]], intro: 'score', graine: 808 },
    { obj: { type: 'creature', t: 6 }, bulles: 35, pool: 3, e: [24, 17], depart: [[5, 95, 470], [3, 235, 490], [2, 280, 440]], intro: 'depart', graine: 909 },
    { obj: { type: 'creature', t: 5 }, bulles: 40, pool: 3, e: [26, 19], oursins: [[33, 330], [307, 400]], intro: 'oursins', graine: 1010 },
    { obj: { type: 'fusions', n: 26 }, bulles: 40, pool: 3, e: [36, 31], oursins: [[33, 270], [307, 270]], courants: [{ y1: 200, y2: 300, f: -400 }], graine: 1111 },
    { obj: { type: 'creature', t: 6 }, bulles: 40, pool: 3, e: [26, 18], oursins: [[307, 330]], rochers: [[80, 380, 18], [205, 300, 14]], depart: [[5, 140, 480], [4, 265, 495]], graine: 1212 },
    { obj: { type: 'creature', t: 6 }, bulles: 40, pool: 3, e: [30, 23], doree: 6, depart: [[4, 85, 495], [4, 255, 495]], intro: 'doree', graine: 1313 },
    { obj: { type: 'score', n: 600 }, bulles: 45, pool: 3, e: [40, 34], doree: 7, courants: [{ y1: 170, y2: 240, f: 420 }, { y1: 320, y2: 400, f: -420 }], graine: 1414 },
    { obj: { type: 'cascade', n: 4 }, bulles: 45, pool: 3, e: [34, 24], doree: 8, oursins: [[33, 300], [307, 360]], graine: 1515 },
    { obj: { type: 'creature', t: 5, n: 2 }, bulles: 45, pool: 3, e: [38, 32], bocal: 'pente', intro: 'pente', graine: 1616 },
    { obj: { type: 'creature', t: 7 }, bulles: 50, pool: 3, e: [36, 27], bocal: 'penteG', rochers: [[235, 330, 16]], doree: 7, depart: [[6, 90, 430], [4, 240, 470]], graine: 1717 },
    { obj: { type: 'score', n: 850 }, bulles: 55, pool: 3, e: [48, 41], bocal: 'pente', courants: [{ y1: 180, y2: 280, f: 450, periode: 6 }], intro: 'alternance', graine: 1818 },
    { obj: { type: 'creature', t: 7 }, bulles: 50, pool: 3, e: [37, 28], bocal: 'entonnoir', oursins: [[33, 300], [307, 300]], doree: 8, depart: [[6, 170, 470], [3, 100, 360]], intro: 'entonnoir', graine: 1919 },
    { obj: { type: 'creature', t: 9 }, bulles: 60, pool: 3, e: [48, 38], bocal: 'bol', courants: [{ y1: 170, y2: 230, f: 300, periode: 8 }], oursins: [[307, 250], [33, 230]], depart: [[8, 120, 440], [7, 245, 400], [6, 230, 270]], intro: 'finale', graine: 2020 }
  ];
  var SANS_FIN = { sansFin: true, pool: 3, doree: 14, graine: 0 };

  // Hasard à graine (le même tirage à chaque essai d'un niveau).
  function alea(graine) {
    var s = (graine >>> 0) || 0x9e3779b9;
    return function () {
      s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  }

  function creer(def, options) {
    options = options || {};
    var g = def.sansFin ? (options.graine || 7) : def.graine;
    var forme = BOCAUX[def.bocal || 'droit'];
    var segs = [];
    // Les parois montent plus haut que le bord (invisibles) : rien ne sort par les côtés.
    var pts = [[forme[0][0], -40]].concat(forme).concat([[forme[forme.length - 1][0], -40]]);
    for (var i = 0; i < pts.length - 1; i++) {
      var ex = pts[i + 1][0] - pts[i][0], ey = pts[i + 1][1] - pts[i][1], l = Math.sqrt(ex * ex + ey * ey);
      if (l < 1e-6) continue;
      segs.push([pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], ey / l, -ex / l]);
    }
    var P = {
      def: def, sansFin: !!def.sansFin, forme: forme, segs: segs, corps: [], idSuiv: 1,
      rochers: (def.rochers || []).map(function (r, k) { return { x: r[0], y: r[1], r: r[2], k: k }; }),
      oursins: (def.oursins || []).map(function (o, k) { return { x: o[0], y: o[1], k: k }; }),
      courants: def.courants || [],
      temps: 0, acc: 0, score: 0, fusions: 0, combo: 0, maxCombo: 0, dernierFusion: -9, dernierLache: -9,
      lachees: 0, reste: def.sansFin ? Infinity : def.bulles, attente: 0, evts: [],
      creees: [], vus: [], fin: null, gagne: false, finDelai: 0, danger: 0, eclatees: 0, tirages: 0,
      geantes: 0, rng: alea(g), silence: false
    };
    for (i = 0; i < NB; i++) { P.creees.push(0); P.vus.push(false); }
    P.courante = tirer(P); P.suivante = tirer(P);
    // Bulles déjà posées : on les laisse se tasser avant le début.
    (def.depart || []).forEach(function (d) { var c = ajouter(P, d[1], d[2], d[0], false); c.age = 99; P.vus[d[0]] = true; });
    if (P.corps.length) {
      P.silence = true;
      for (i = 0; i < 360; i++) sous(P, 1 / 120);
      P.silence = false; P.temps = 0; P.evts.length = 0;
      P.corps.forEach(function (c) { c.px = c.x; c.py = c.y; c.haut = 0; });
    }
    return P;
  }

  function tirer(P) {
    P.tirages++;
    var d = P.def;
    if (d.doree && P.tirages > 2 && P.tirages % d.doree === 0) return { or: true, t: -1 };
    var pool = d.pool == null ? 3 : d.pool, total = 0, k;
    for (k = 0; k <= pool; k++) total += POIDS[k];
    var x = P.rng() * total;
    for (k = 0; k <= pool; k++) { x -= POIDS[k]; if (x < 0) return { or: false, t: k }; }
    return { or: false, t: 0 };
  }

  function rayonDe(c) { return c.or ? R_DOREE : RAYONS[c.t]; }

  function ajouter(P, x, y, t, or) {
    var r = or ? R_DOREE : RAYONS[t];
    var c = { id: P.idSuiv++, x: x, y: y, px: x, py: y, r: r, rc: r, t: t, or: !!or, age: 0, haut: 0, mort: false, k: (P.idSuiv * 1.7) % 6.28 };
    P.corps.push(c);
    return c;
  }

  // Bornes de la visée pour la bulle en main.
  function bornes(P) {
    var r = P.courante ? rayonDe(P.courante) : 12;
    return [20 + r + 2, 320 - r - 2];
  }

  // Lâche la bulle en main à l'abscisse x. Renvoie la bulle lâchée, ou null.
  function lacher(P, x) {
    if (P.fin || P.gagne || P.attente > 0 || P.reste <= 0) return null;
    var b = bornes(P);
    x = Math.max(b[0], Math.min(b[1], x));
    var c = P.courante;
    var corps = ajouter(P, x, Y_LACHER, c.t, c.or);
    P.reste--; P.lachees++;
    P.courante = P.suivante; P.suivante = tirer(P);
    P.attente = 0.45; P.dernierLache = P.temps; P.combo = 0;
    if (!c.or) P.vus[c.t] = true;
    P.evts.push({ type: 'lache', x: x, or: c.or });
    return corps;
  }

  function forceCourant(c, temps) {
    if (!c.periode) return 1;
    var s = Math.sin(temps * 2 * Math.PI / c.periode) * 2.4;
    return Math.max(-1, Math.min(1, s));
  }

  function compter(P, nt, x, y, cause) {
    if (P.silence) return;
    if (P.temps - P.dernierFusion > 1.2) P.combo = 0;
    P.combo++; P.dernierFusion = P.temps;
    if (P.combo > P.maxCombo) P.maxCombo = P.combo;
    var pts = Math.round(POINTS[nt] * (1 + (P.combo - 1) * 0.5));
    P.score += pts; P.fusions++;
    P.creees[nt]++;
    var nouveau = !P.vus[nt];
    P.vus[nt] = true;
    P.evts.push({ type: cause || 'fusion', t: nt, x: x, y: y, pts: pts, combo: P.combo, nouveau: nouveau });
  }

  function fusionner(P, a, b) {
    a.mort = b.mort = true;
    var ma = a.r * a.r, mb = b.r * b.r, m = ma + mb;
    var x = (a.x * ma + b.x * mb) / m, y = (a.y * ma + b.y * mb) / m;
    var vx = ((a.x - a.px) * ma + (b.x - b.px) * mb) / m, vy = ((a.y - a.py) * ma + (b.y - b.py) * mb) / m;
    if (a.t >= NB - 1) {
      // Deux baleines : bulle géante qui éclate en un gros bonus.
      if (!P.silence) { P.score += 2000; P.fusions++; P.geantes++; P.evts.push({ type: 'geante', x: x, y: y, pts: 2000 }); }
      return;
    }
    var nt = a.t + 1;
    var c = ajouter(P, x, y, nt, false);
    c.r = Math.max(a.r, b.r); c.px = x - vx; c.py = y - vy; c.age = Math.max(a.age, b.age);
    compter(P, nt, x, y, 'fusion');
  }

  function monter(P, o, g) {
    g.mort = true;
    if (o.t >= NB - 1) {
      if (!P.silence) { P.score += 300; P.evts.push({ type: 'doreeBaleine', x: o.x, y: o.y, pts: 300 }); }
      return;
    }
    o.t++; o.rc = RAYONS[o.t];
    compter(P, o.t, o.x, o.y, 'doree');
  }

  function resoudre(P) {
    var cs = P.corps, n = cs.length, i, j, a, b, dx, dy, d2, rr, d, o, ma, mb, k, s;
    for (i = 0; i < n; i++) {
      a = cs[i];
      for (j = i + 1; j < n; j++) {
        b = cs[j];
        dx = b.x - a.x; dy = b.y - a.y; rr = a.r + b.r;
        if (dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
        d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr) continue;
        if (d2 < 1e-6) { dx = 0.01; dy = 0.01; d2 = 0.0002; }
        d = Math.sqrt(d2); o = (rr - d) / d;
        ma = a.r * a.r; mb = b.r * b.r;
        var ka = mb / (ma + mb), kb = ma / (ma + mb);
        a.x -= dx * o * ka; a.y -= dy * o * ka;
        b.x += dx * o * kb; b.y += dy * o * kb;
      }
      for (k = 0; k < P.rochers.length; k++) {
        var ro = P.rochers[k];
        dx = a.x - ro.x; dy = a.y - ro.y; rr = a.r + ro.r; d2 = dx * dx + dy * dy;
        if (d2 < rr * rr) { d = Math.sqrt(d2) || 0.01; o = (rr - d) / d; a.x += dx * o; a.y += dy * o; }
      }
      // Parois : tous les bocaux sont convexes, chaque paroi est un demi-plan
      // (normale tournée vers l'intérieur) : une bulle ne peut jamais passer à travers.
      for (k = 0; k < P.segs.length; k++) {
        s = P.segs[k];
        var sd = (a.x - s[0]) * s[4] + (a.y - s[1]) * s[5];
        if (sd < a.r) { a.x += s[4] * (a.r - sd); a.y += s[5] * (a.r - sd); }
      }
    }
  }

  function chercherFusions(P) {
    var cs = P.corps, n = cs.length, i, j, a, b, dx, dy, rr;
    for (i = 0; i < n; i++) {
      a = cs[i]; if (a.mort) continue;
      for (j = i + 1; j < n; j++) {
        b = cs[j]; if (b.mort) continue;
        if (!a.or && !b.or && a.t !== b.t) continue;
        dx = b.x - a.x; dy = b.y - a.y; rr = a.r + b.r + 1.2;
        if (dx * dx + dy * dy > rr * rr) continue;
        if (a.or && b.or) { a.mort = true; b.t = 2; b.or = false; b.rc = RAYONS[2]; compter(P, 2, b.x, b.y, 'doree'); }
        else if (a.or) monter(P, b, a);
        else if (b.or) monter(P, a, b);
        else fusionner(P, a, b);
        break;
      }
    }
  }

  function sous(P, h) {
    P.temps += h;
    if (P.attente > 0) P.attente -= h;
    var cs = P.corps, i, k, b;
    for (i = 0; i < cs.length; i++) {
      b = cs[i];
      b.age += h;
      if (b.r !== b.rc) { b.r += (b.rc - b.r) * 0.2; if (Math.abs(b.rc - b.r) < 0.05) b.r = b.rc; }
      var ax = 0;
      for (k = 0; k < P.courants.length; k++) {
        var c = P.courants[k];
        if (b.y > c.y1 && b.y < c.y2) ax += c.f * forceCourant(c, P.temps);
      }
      var vx = (b.x - b.px) * 0.993, vy = (b.y - b.py) * 0.993;
      if (vx > 12) vx = 12; else if (vx < -12) vx = -12;
      if (vy > 14) vy = 14; else if (vy < -14) vy = -14;
      b.px = b.x; b.py = b.y;
      b.x += vx + ax * h * h; b.y += vy + G * h * h;
    }
    for (k = 0; k < 5; k++) resoudre(P);
    chercherFusions(P);
    // Oursins : une bulle qui les touche éclate.
    for (i = 0; i < cs.length; i++) {
      b = cs[i]; if (b.mort) continue;
      for (k = 0; k < P.oursins.length; k++) {
        var u = P.oursins[k], dx = b.x - u.x, dy = b.y - u.y, rr = b.r + R_OURSIN + 1;
        if (dx * dx + dy * dy < rr * rr) {
          b.mort = true;
          if (!P.silence) { P.eclatees++; P.evts.push({ type: 'pop', x: b.x, y: b.y, t: b.t, or: b.or, r: b.r }); }
          break;
        }
      }
    }
    for (i = cs.length - 1; i >= 0; i--) if (cs[i].mort || cs[i].y > H + 200) cs.splice(i, 1);
    if (P.silence || P.fin) return;
    // Bord du bocal : une bulle qui reste au-dessus trop longtemps fait déborder.
    var dmax = 0;
    for (i = 0; i < cs.length; i++) {
      b = cs[i];
      if (b.age > 1.3 && b.y - b.r < HAUT) b.haut += h; else b.haut = Math.max(0, b.haut - h * 2);
      if (b.haut > dmax) dmax = b.haut;
    }
    P.danger = Math.min(1, dmax / 2.5);
    if (!P.gagne && dmax >= 2.5) { P.fin = 'debordement'; P.evts.push({ type: 'fin', fin: P.fin }); return; }
    if (P.sansFin) return;
    var av = avancee(P);
    if (!P.gagne && av.a >= av.n) { P.gagne = true; P.finDelai = 1.1; P.evts.push({ type: 'objectif' }); }
    if (P.gagne) {
      P.finDelai -= h;

    var et = S.etoiles(P);
    var bonus = P.reste * 10;
    var score = P.score + bonus;
    var ancien = PROG.records[n];
    var record = score > ancien;
    if (record) PROG.records[n] = score;
    var avant = PROG.etoiles[n];
    var totalAvant = totalEtoiles();
    PROG.etoiles[n] = Math.max(avant, et);
    var totalApres = totalEtoiles();
    var nouveauDecor = BOCAUX_DECO.concat(FONDS).some(function (d) { return d.requis > totalAvant && d.requis <= totalApres; });
    for (var t = 0; t < S.NB; t++) if (P.vus[t]) PROG.vus[t] = true;
    var etaitSansFin = sansFinOuvert();
    sauver(Math.min(NIVEAUX.length, n + 2));
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
    var tout = PROG.etoiles.every(function (e) { return e > 0; });
    if (tout) { if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 }); }

    }
  }
  function eclabousser(x, y, n, couleur, force) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * TAU, v = (40 + Math.random() * 120) * (force || 1);
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, vie: 0.6 + Math.random() * 0.5, r: 1.5 + Math.random() * 3.5, c: couleur, bulle: true });
    }
  }
  var toastEl = $('toast');
  function toast(txt) { toastEl.textContent = txt; toastEl.classList.remove('vu'); void toastEl.offsetWidth; toastEl.classList.add('vu'); }

  function traiterEvenements() {
    var P = partie, ev = P.evts;
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      if (e.type === 'lache') SON.lache();
      else if (e.type === 'fusion' || e.type === 'doree') {
        if (e.type === 'doree') SON.doree(); else SON.fusion(e.t, e.combo);
        anneaux.push({ x: e.x, y: e.y, r: S.RAYONS[e.t], vie: 0 });
        eclabousser(e.x, e.y, 6 + e.t * 2, e.type === 'doree' ? '#ffe27a' : '#ffffff', 1 + e.t * 0.1);
        gains.push({ x: e.x, y: e.y - S.RAYONS[e.t], txt: T('gain', { n: e.pts }), vie: 0 });
        if (e.t >= 5) secousse = Math.max(secousse, 2 + (e.t - 5) * 1.5);
        if (e.combo >= 2) toast(T('cascadeToast', { n: e.combo }));
        if (e.nouveau) { SON.nouvelle(); plusTard(function (t) { return function () { if (etat === 'jeu') toast(T('nouvelleCreature', { nom: T('c' + t) })); }; }(e.t), e.combo >= 2 ? 1300 : 0); }
        if (e.t === S.NB - 1) { danse = 3; SON.baleine(); toast(T('baleineDanse')); }
      } else if (e.type === 'pop') { SON.pop(); eclabousser(e.x, e.y, 14, '#e2c6ff', 1.3); anneaux.push({ x: e.x, y: e.y, r: e.r, vie: 0, rouge: true }); }
      else if (e.type === 'geante') { SON.geante(); toast(T('geante', { n: e.pts })); secousse = 10; eclabousser(e.x, e.y, 60, '#bfe8ff', 2.5); confettis(); gains.push({ x: e.x, y: e.y, txt: T('gain', { n: e.pts }), vie: 0 }); }
      else if (e.type === 'doreeBaleine') { SON.doree(); gains.push({ x: e.x, y: e.y, txt: T('gain', { n: e.pts }), vie: 0 }); }
      else if (e.type === 'objectif') { toast(T('objectifAtteint')); SON.nouvelle(); }
    }
    ev.length = 0;
  }

  function majEffets(dt) {
    for (var i = particules.length - 1; i >= 0; i--) {
      var p = particules[i];
      p.vie -= dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.bulle) { p.vx *= 0.94; p.vy = p.vy * 0.94 - 40 * dt; } else p.vy += 120 * dt;
    }
    for (i = anneaux.length - 1; i >= 0; i--) { anneaux[i].vie += dt * 2.2; if (anneaux[i].vie >= 1) anneaux.splice(i, 1); }
    for (i = gains.length - 1; i >= 0; i--) { gains[i].vie += dt * 0.9; gains[i].y -= 30 * dt; if (gains[i].vie >= 1) gains.splice(i, 1); }
    secousse = Math.max(0, secousse - dt * 18);
    danse = Math.max(0, danse - dt);
  }

  // ------------------------------------------------------------------
  // Dessin d'une image
  // ------------------------------------------------------------------
  function dessiner() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var fond = FONDS[PROG.fond], deco = BOCAUX_DECO[PROG.bocal];
    dessinerFond(ctx, lw, lh, fond, tps);
    var P = (etat === 'titre' || etat === 'niveaux' || etat === 'carnet' || etat === 'decor') ? vitrine : partie;
    if (!P) return;
    var sx = secousse ? (Math.random() - 0.5) * secousse : 0, sy = secousse ? (Math.random() - 0.5) * secousse : 0;
    ctx.setTransform(dpr * echelle, 0, 0, dpr * echelle, dpr * (ox + sx * echelle), dpr * (oy + sy * echelle));
    dessinerBocal(ctx, P.forme, deco, tps, true);
    var i;
    for (i = 0; i < P.courants.length; i++) courant(ctx, P.courants[i], P.temps, 24, 316);
    for (i = 0; i < P.rochers.length; i++) rocher(ctx, P.rochers[i].x, P.rochers[i].y, P.rochers[i].r, P.rochers[i].k);
    var enJeu = P === partie && etat !== 'titre';
    // Ligne du bord
    var rouge = enJeu && P.danger > 0;
    ctx.save();
    ctx.setLineDash([8, 7]);
    ctx.strokeStyle = rouge ? (Math.sin(tps * 16) > 0 ? '#ff4d4d' : '#ffb3b3') : 'rgba(255,255,255,0.45)';
    ctx.lineWidth = rouge ? 3.5 : 2;
    ctx.beginPath(); ctx.moveTo(24, S.HAUT); ctx.lineTo(316, S.HAUT); ctx.stroke();
    ctx.restore();
    if (rouge) {
      ctx.fillStyle = 'rgba(255,60,60,' + (0.08 + 0.12 * P.danger) + ')';
      ctx.fillRect(24, S.HAUT - 40, 292, 40);
    }
    // Visée
    if (enJeu && etat === 'jeu' && !P.fin && !P.gagne && P.reste > 0 && P.courante) {
      var bo = S.bornes(P), x = Math.max(bo[0], Math.min(bo[1], viseeX));
      var rc = S.rayonDe(P.courante), apparition = P.attente > 0 ? 1 - P.attente / 0.45 : 1;
      ctx.save();
      ctx.setLineDash([4, 8]); ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, S.Y_LACHER + rc); ctx.lineTo(x, 525); ctx.stroke();
      ctx.restore();
      bulle(ctx, x, S.Y_LACHER + Math.sin(tps * 3) * 2, rc * (0.4 + 0.6 * apparition), P.courante.t < 0 ? 0 : P.courante.t, P.courante.or, tps, 0, 0.5 + 0.5 * apparition);
    }
    // Bulles
    for (i = 0; i < P.corps.length; i++) {
      var b = P.corps[i];
      if (b.t === S.NB - 1 && danse > 0 && !b.or) {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.sin(tps * 9) * 0.2 * Math.min(1, danse)); bulle(ctx, 0, 0, b.r, b.t, false, tps, b.k); ctx.restore();
      } else bulle(ctx, b.x, b.y, b.r, b.t < 0 ? 0 : b.t, b.or, tps, b.k);
    }
    for (i = 0; i < P.oursins.length; i++) oursin(ctx, P.oursins[i].x, P.oursins[i].y, tps, P.oursins[i].k);
    dessinerBocal(ctx, P.forme, deco, tps, false);
    // Bulle suivante
    if (enJeu && P.suivante && P.reste > 1) {
      ctx.save();
      ctx.fillStyle = 'rgba(4,48,69,0.55)'; ctx.beginPath(); ctx.arc(312, 24, 18, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();
      bulle(ctx, 312, 24, 13, P.suivante.t < 0 ? 0 : P.suivante.t, P.suivante.or, tps, 3);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.moveTo(284, 18); ctx.lineTo(291, 24); ctx.lineTo(284, 30); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // Effets
    for (i = 0; i < anneaux.length; i++) {
      var a = anneaux[i];
      ctx.strokeStyle = a.rouge ? 'rgba(220,170,255,' + (1 - a.vie) + ')' : 'rgba(255,255,255,' + (1 - a.vie) + ')';
      ctx.lineWidth = 4 * (1 - a.vie) + 1;
      ctx.beginPath(); ctx.arc(a.x, a.y, a.r * (1 + a.vie * 0.8), 0, TAU); ctx.stroke();
    }
    for (i = 0; i < particules.length; i++) {
      var p = particules[i];
      ctx.globalAlpha = Math.min(1, p.vie * 1.5);
      if (p.bulle) { ctx.strokeStyle = p.c; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke(); }
      else if (p.etoile) { ctx.save(); ctx.translate(p.x, p.y); eclat(ctx, p.r * 1.6, p.vie * 4); ctx.restore(); }
      else { ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.font = 'bold 18px system-ui, sans-serif';
    for (i = 0; i < gains.length; i++) {
      var gn = gains[i];
      ctx.globalAlpha = 1 - gn.vie;
      ctx.fillStyle = '#05374d'; ctx.fillText(gn.txt, gn.x + 1.5, gn.y + 1.5);
      ctx.fillStyle = '#fff4c9'; ctx.fillText(gn.txt, gn.x, gn.y);
    }
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------
  // Boucle principale
  // ------------------------------------------------------------------
  var dernierT = performance.now();
  function boucle(now) {
    var dt = Math.min(0.05, Math.max(0, (now - dernierT) / 1000));
    dernierT = now;
    if (etat !== 'pause') tps += dt;
    if (etat === 'jeu' && partie) {
      if (toucheG) viseeX -= 260 * dt;
      if (toucheD) viseeX += 260 * dt;
      var bo = S.bornes(partie); viseeX = Math.max(bo[0], Math.min(bo[1], viseeX));
      S.pas(partie, dt);
      traiterEvenements();
      if (partie.danger > 0.2) { alerteT -= dt; if (alerteT <= 0) { SON.alerte(); alerteT = 0.5; } } else alerteT = 0;
      majHud(false);
      if (partie.fin) {
        var f = partie.fin;
        if (modeSansFin) finSansFin();
        else if (f === 'victoire') finVictoire();
        else finDefaite(f);
      }
    } else if (vitrine && (etat === 'titre' || etat === 'niveaux' || etat === 'carnet' || etat === 'decor')) {
      S.pas(vitrine, dt); vitrine.evts.length = 0;
    }
    if (etat === 'victoire' || etat === 'defaite' || etat === 'finSF') { if (partie) S.pas(partie, dt * 0.3); if (partie) partie.evts.length = 0; }
    if (etat !== 'pause') majEffets(dt);
    dessiner();
    if (etat === 'intro') dessinerDemo(tps);
    requestAnimationFrame(boucle);
  }

  // ------------------------------------------------------------------
  // Commandes : doigt, souris, clavier
  // ------------------------------------------------------------------
  function versMonde(ev) {
    var r = canvas.getBoundingClientRect();
    return (ev.clientX - r.left - ox) / echelle;
  }
  function lacherIci() {
    if (etat !== 'jeu' || !partie) return;
    S.lacher(partie, viseeX);
  }
  canvas.addEventListener('pointerdown', function (ev) {
    audio();
    if (etat !== 'jeu') return;
    appui = true; viseeX = versMonde(ev);
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) { /* rien */ }
    ev.preventDefault();
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (etat !== 'jeu') return;
    if (appui || ev.pointerType === 'mouse') viseeX = versMonde(ev);
  });
  canvas.addEventListener('pointerup', function (ev) {
    if (etat !== 'jeu' || !appui) { appui = false; return; }
    appui = false; viseeX = versMonde(ev); lacherIci();
  });
  canvas.addEventListener('pointercancel', function () { appui = false; });

  document.addEventListener('keydown', function (ev) {
    audio();
    clavierUtilise = true;
    var c = ev.code;
    if (etat === 'intro') { if (c === 'Space' || c === 'Enter' || c === 'Escape') { ev.preventDefault(); introDebut = 0; fermerIntro(); } return; }
    if (etat === 'jeu') {
      if (c === 'Escape' || c === 'KeyP') { ev.preventDefault(); SON.clic(); pause(); return; }
      if (c === 'ArrowLeft' || c === 'KeyA') { toucheG = true; ev.preventDefault(); }
      else if (c === 'ArrowRight' || c === 'KeyD') { toucheD = true; ev.preventDefault(); }
      else if (c === 'Space' || c === 'Enter' || c === 'ArrowDown' || c === 'KeyS') { ev.preventDefault(); if (!ev.repeat) lacherIci(); }
      return;
    }
    if (etat === 'pause' && (c === 'Escape' || c === 'KeyP')) { ev.preventDefault(); reprendre(); return; }
    if ((etat === 'niveaux' || etat === 'carnet' || etat === 'decor') && c === 'Escape') { ev.preventDefault(); allerTitre(); }
  });
  document.addEventListener('keyup', function (ev) {
    if (ev.code === 'ArrowLeft' || ev.code === 'KeyA') toucheG = false;
    if (ev.code === 'ArrowRight' || ev.code === 'KeyD') toucheD = false;
  });

  // ------------------------------------------------------------------
  // Son : bouton couper / remettre, mémorisé
  // ------------------------------------------------------------------
  var ICONE_SON = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
  var ICONE_MUET = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
  function majSon() {
    document.querySelectorAll('.bSon').forEach(function (b) {
      b.innerHTML = PROG.son ? ICONE_SON : ICONE_MUET;
      b.setAttribute('aria-label', T(PROG.son ? 'aria.couper' : 'aria.remettre'));
      b.setAttribute('title', T(PROG.son ? 'aria.couper' : 'aria.remettre'));
      b.setAttribute('aria-pressed', PROG.son ? 'false' : 'true');
    });
  }
  document.querySelectorAll('.bSon').forEach(function (b) {
    b.addEventListener('click', function () {
      audio();
      PROG.son = !PROG.son;
      try { localStorage.setItem('bulles-du-lagon-son', PROG.son ? '1' : '0'); } catch (e) { /* pas de stockage */ }
      majSon(); SON.clic();
    });
  });

  // ------------------------------------------------------------------
  // Boutons de l'écran titre
  // ------------------------------------------------------------------
  $('bJouer').addEventListener('click', function () {
    audio(); SON.clic();
    if (!window.JEL_SAVE) { lancerNiveau(niveauMax() - 1); return; }
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: function (d) {
        PROG = chargerProg(); majSon();
        var n = Math.max(1, Math.min(NIVEAUX.length, d.niveau | 0 || 1));
        PROG.niveau = Math.max(PROG.niveau, n);
        lancerNiveau(n - 1);
      },
      onNouvelle: function () { lancerNiveau(0); },
      onEffacer: function () { PROG = nouvelleProg(); majSon(); lancerNiveau(0); }
    });
  });
  $('bNiveaux').addEventListener('click', function () { audio(); SON.clic(); allerNiveaux(); });
  $('bSansFin').addEventListener('click', function () { audio(); SON.clic(); lancerSansFin(); });
  $('bSansFin2').addEventListener('click', function () { audio(); SON.clic(); lancerSansFin(); });
  $('bRetourNiv').addEventListener('click', function () { audio(); SON.clic(); allerTitre(); });
  $('bCarnet').addEventListener('click', function () { audio(); SON.clic(); allerCarnet(); });
  $('bDecor').addEventListener('click', function () { audio(); SON.clic(); allerDecor(); });
  $('bRetourCarnet').addEventListener('click', function () { audio(); SON.clic(); allerTitre(); });
  $('bRetourDecor').addEventListener('click', function () { audio(); SON.clic(); allerTitre(); });

  var effaceur = null;
  if (window.JEL_SAVE) {
    effaceur = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('placeEffacer'), apres: function () { PROG = nouvelleProg(); majSon(); allerTitre(); } });
  }

  // Sauvegarde à la fermeture de la page, seulement pendant une partie.
  if (window.JEL_SAVE) {
    window.JEL_SAVE.surFermeture(function () {
      if (etat === 'jeu' || etat === 'pause' || etat === 'intro') {
        if (partie && partie.vus) for (var t = 0; t < S.NB; t++) if (partie.vus[t]) PROG.vus[t] = true;
        sauver(modeSansFin ? PROG.niveau : idxNiv + 1);
      }
    });
  }

  // ------------------------------------------------------------------
  // Démarrage
  // ------------------------------------------------------------------
  PROG = chargerProg();
  try { document.title = T('titre'); } catch (e) { /* rien */ }
  creerVitrine();
  majSon();
  allerTitre();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
