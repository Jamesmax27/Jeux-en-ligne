  "q.19": "What are the little signs written next to kanji to help you read them called?|Furigana|Mochi|Tatami|Kimono",
  "q.20": "How many writing systems does Japanese use?|Three|Just one|Two|Six",
  "q.21": "To read a Japanese manga from the start, you open it…|From what looks like the end to us|In the middle|At a random page|By the spine",

  "q.39": "Uma tigela de lámen é…|Uma sopa de macarrão|Um bolo de creme|Uma salada de frutas|Um crepe com açúcar",
  "q.40": "O taiyaki é um bolinho em forma de…|Peixe|Estrela|Carro|Casa",
  "q.41": "Os dangos são…|Bolinhas de arroz num palito|Meias|Lanternas|Pipas",
  "q.42": "No Japão, as carpas de pano que balançam ao vento festejam…|As crianças|A chuva|Os peixinhos dourados|As bruxas",
  "q.43": "O gato da sorte que levanta a pata se chama…|Maneki-neko|Sumô-neko|Ninja-neko|Kendô-neko",
  "q.44": "Na festa de Tanabata, as pessoas penduram nos bambus…|Papeizinhos com desejos|Sapatos|Cenouras|Sinos de vaca",
  "q.45": "O trem japonês muito rápido se chama…|Shinkansen|Tatame|Karaokê|Sudoku",
  "q.46": "A gente pinta um olho no boneco redondo “daruma” quando…|Faz um pedido|Está com fome|Está chovendo|Acorda",
  "q.47": "Um quimono leve que se usa no verão se chama…|Yukata|Caratê|Wasabi|Bonsai",
  "q.48": "Um bonsai é…|Uma árvore bem pequena num vaso|Um prato apimentado|Uma luta|Uma música",
  "q.49": "Nas escolas japonesas, quem costuma limpar a sala de aula?|Os próprios alunos|Robôs|Os pais|Ninguém",
  "q.50": "No Japão, o ano escolar começa em…|Abril|Setembro|Janeiro|Julho",
  "q.51": "O wasabi é uma pasta verde…|Muito picante|Muito doce|Que brilha no escuro|Com cheiro de morango",
  "q.52": "Nos contos japoneses, o kitsune é…|Uma raposa mágica|Um dragão de fogo|Um peixe gigante|Uma coruja sábia",
  "q.53": "Os yōkai são…|Criaturas das lendas japonesas|Balas|Escolas de desenho|Montanhas",
  "q.54": "De que país vem o manhwa, um tipo de quadrinho?|Da Coreia|Do México|Da Noruega|Do Marrocos",
  "q.55": "Como se chama o livro que reúne vários capítulos de um mangá?|Um volume|Um ingresso|Um pôster|Um folheto",
  "q.56": "Para chamar a atenção para um rosto surpreso, o mangaká costuma desenhar…|Linhas que vão todas para o centro|Coraçõezinhos|Uma grade|Folhas secas",
  "q.57": "Antigamente, os personagens de anime eram pintados em folhas…|Transparentes|De madeira|De tecido|De metal",
  "q.58": "O mangaká desenha primeiro a lápis e depois…|Cobre com tinta|Joga a página fora|Faz um aviãozinho|Molha a página",
  "q.59": "Onde as pessoas leem mangás e assistem a animes?|No mundo inteiro|Só no Japão|Só na praia|Só na Lua",
  "q.60": "No Japão, muitos mangás saem primeiro em revistas grossas que aparecem…|Toda semana|A cada dez anos|Só no Natal|Nunca",
  "v.1": "Um mangá japonês se lê da direita para a esquerda.|Sim! Começa-se no alto à direita da página.",
  "v.2": "Todos os mangás são impressos em cores.|Não: a maioria das páginas é em preto e branco.",
  "v.3": "A palavra “anime” quer dizer desenho animado japonês.|Sim, ela vem da palavra “animação”.",
  "v.4": "O mangá foi inventado na Itália.|Não: o mangá vem do Japão.",
  "v.5": "Um mangaká é um autor de mangá.|Sim, ele escreve e desenha a história.",
  "v.6": "Nos balões dos mangás japoneses, o texto costuma ser escrito de cima para baixo.|Sim, em colunas verticais.",
  "v.7": "Um chibi é um personagem desenhado bem alto e bem realista.|Não: um chibi é pequenininho, com uma cabeça grande e redonda.",
  "v.8": "Uma gota de suor grande na cabeça costuma mostrar que o personagem está sem graça.|Sim, é um sinal muito conhecido dos mangás.",
  "v.9": "Um balão em forma de nuvem quer dizer que o personagem está gritando.|Não: o balão de nuvem mostra um pensamento.",
  "v.10": "Os assistentes do mangaká costumam desenhar os cenários.|Sim, eles ajudam a terminar as páginas a tempo.",
  "v.11": "Fazer cosplay é se fantasiar como um personagem.|Sim! A palavra junta “fantasia” e “brincar” em inglês.",
  "v.12": "Os mangás são feitos só para crianças.|Não: existem mangás para todas as idades.",
  "v.13": "O japonês usa três sistemas de escrita.|Sim: os hiragana, os katakana e os kanji.",
  "v.14": "Num anime, um só desenho basta para um segundo inteiro.|Não: são precisos vários desenhos por segundo para dar movimento.",
  "v.15": "Os capítulos de um mangá costumam sair primeiro numa revista.|Sim, e depois são reunidos num livro.",
  "v.16": "“Arigatō” quer dizer obrigado em japonês.|Sim! A gente diz isso para agradecer.",
  "v.17": "Os sushis são bolos de chocolate.|Não: são bocadinhos de arroz, muitas vezes com peixe.",
  "v.18": "No Japão, as pessoas comem muitas vezes com hashis.|Sim, esses pauzinhos se chamam “hashi”.",
  "v.19": "O monte Fuji é um lago pequeno.|Não: é a montanha mais alta do Japão.",
  "v.20": "O taiyaki é um bolinho em forma de peixe.|Sim, muitas vezes recheado de pasta doce de feijão-vermelho.",
  "v.21": "“Sayōnara” quer dizer oi.|Não: “sayōnara” quer dizer tchau.",
  "v.22": "As linhas de velocidade mostram que um personagem está se mexendo rápido.|Sim, elas seguem o movimento.",
  "v.23": "Um webtoon se lê virando páginas da direita para a esquerda.|Não: ele se lê rolando a tela para baixo.",
  "v.24": "No Japão, os alunos costumam limpar a própria sala de aula.|Sim, cada um tem a sua tarefa.",
  "v.25": "A retícula serve para colar as páginas do livro.|Não: os pontinhos dela fazem cinzas e sombras.",
  "v.26": "O maneki-neko é um gato da sorte que levanta a pata.|Sim, ele aparece muito nas lojas.",
  "v.27": "Antigamente, os personagens de anime eram pintados em folhas transparentes.|Sim, depois elas eram colocadas sobre os cenários.",
  "v.28": "O Japão é um país sem mar.|Não: o Japão é formado por muitas ilhas.",
  "v.29": "Num mangá, um quadrinho bem grande costuma mostrar um momento importante.|Sim, ele chama a atenção na hora.",
  "v.30": "Em japonês, “kawaii” quer dizer assustador.|Não: “kawaii” quer dizer fofo.",

  "nv.qcm.texte": "Lies die Frage und tippe auf die richtige Antwort (Tastatur: Tasten 1, 2, 3). Nach drei Fehlern ist das Kapitel verloren!",
  "nv.vf.titre": "Wahr oder falsch",
  "nv.vf.texte": "Lies den Satz: Tippe auf Wahr, wenn er stimmt, sonst auf Falsch. Danach erklärt Mochi es dir.",

  "nv.emo.texte": "Mangas zeigen Gefühle mit Zeichen: Schweißtropfen, Zornesader, gestreifte Wangen … Rate, wie sich die Figur fühlt!",

  "nv.page.titre": "Die Leserichtung",
  "nv.page.texte": "Ein japanischer Manga wird von rechts nach links gelesen. Tippe die Bilder der Reihe nach an: oben rechts zuerst, dann nach links, dann die Reihe darunter.",
  "nv.chrono.titre": "Der Zeitbalken",
  "nv.chrono.texte": "Der Balken wird leer: Antworte, bevor er weg ist! Je schneller du antwortest, desto mehr Punkte bekommst du.",
  "nv.duel.titre": "Duell gegen Taro",
  "nv.duel.texte": "Taro der Tanuki antwortet auch! Antworte richtig, bevor sein oranger Balken leer ist. Wer zuerst seine Punktereihe füllt, gewinnt.",
  "nv.bulle.titre": "Sprechblasen",
  "nv.bulle.texte": "Jede Blasenform hat eine Bedeutung: rund zum Sprechen, als Wolke zum Denken, mit Zacken zum Schreien … Wähle die richtige!",
  "nv.mot.titre": "Kleine japanische Wörter",
  "nv.mot.texte": "In Animes hört man oft japanische Wörter. Finde heraus, was sie bedeuten!",
  "nv.ono.titre": "Geräusche im Manga",
  "nv.ono.texte": "Mangas schreiben Geräusche ganz groß: DOKI DOKI, KIRA KIRA … Rate, was sie erzählen, und hör dir dann den Ton an!",
  "nv.intrus.titre": "Was passt nicht?",
  "nv.intrus.texte": "Vier Wörter, aber eines passt nicht zu den anderen: Finde es!",
  "nv.eclair.titre": "Die Blitzfrage",
  "nv.eclair.texte": "Manchmal kommt eine goldene Frage: Ihr Zeitbalken ist sehr kurz, aber sie bringt doppelte Punkte!",
  "nv.effet.titre": "Zeicheneffekte",
  "nv.effet.texte": "Tempolinien, winzige Punkte, Blumen … Mangazeichner malen Effekte, um zu zeigen, was passiert. Was bedeuten sie?",

<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {

  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

    var c = valide(paramAdresse());

    c = valide(window.JEL_LANG) || valide(lireStockage());

    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];

  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };

    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +

    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +

    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +

      b.classList.remove('armer');
      clear(jeu);
      fait();

  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)

    if (!d) { nouvelle(); return false; }

    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });

    detail.textContent = options.sansNiveau

    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };

    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];

    try { bContinuer.focus(); } catch (e) { /* rien */ }

  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {

    boutonEffacer: boutonEffacer,
    texte: texte,
  };

/* ==========================================================================
   Ordre de lecture d'une planche : on coupe la page en morceaux
   (d'abord en haut / en bas, sinon à droite / à gauche, la droite d'abord).
   ========================================================================== */
function ordreLecture(rects, idx = rects.map((_, i) => i)) {
  if (idx.length <= 1) return idx;
  const bas = [...new Set(idx.map((i) => rects[i].y + rects[i].h))].sort((a, b) => a - b);
  for (const c of bas) {
    const haut = idx.filter((i) => rects[i].y + rects[i].h <= c + 0.5);
    const reste = idx.filter((i) => !haut.includes(i));
    if (haut.length && reste.length && reste.every((i) => rects[i].y >= c - 0.5)) return [...ordreLecture(rects, haut), ...ordreLecture(rects, reste)];
  }
  const gauches = [...new Set(idx.map((i) => rects[i].x))].sort((a, b) => b - a);
  for (const c of gauches) {
    const droite = idx.filter((i) => rects[i].x >= c - 0.5);
    const gauche = idx.filter((i) => !droite.includes(i));
    if (droite.length && gauche.length && gauche.every((i) => rects[i].x + rects[i].w <= c + 0.5)) return [...ordreLecture(rects, droite), ...ordreLecture(rects, gauche)];
  }
  return idx.slice().sort((a, b) => rects[a].y - rects[b].y || rects[b].x - rects[a].x);
}

/* ==========================================================================
   État de la partie
   ========================================================================== */
let E = null;              // chapitre en cours
let enPause = false;
let introOuverte = false;
const recents = [];        // questions vues récemment (pour varier d'une partie à l'autre)
let taches = [];           // attentes gérées par la boucle (figées pendant la pause)
function attendre(ms, f) { taches.push({ reste: ms, f }); }
const fige = () => enPause || introOuverte || !E || !E.enCours;

function cleQ(type, x) { return type + ':' + x.id; }
function tirer(type, pool, filtre = null) {
  const niv = E.niv;
  const libre = (x) => !E.utilises.has(cleQ(type, x));
  let cands = pool.filter((x) => x.d >= niv.d[0] && x.d <= niv.d[1] && libre(x));
  if (filtre) { const c2 = cands.filter(filtre); if (c2.length && Math.random() < 0.75) cands = c2; }
  if (!cands.length) cands = pool.filter(libre);
  if (!cands.length) cands = pool.slice();
  const frais = cands.filter((x) => !recents.includes(cleQ(type, x)));
  const x = choisir(frais.length ? frais : cands);
  const k = cleQ(type, x);
  E.utilises.add(k); recents.push(k); if (recents.length > 90) recents.shift();
  return x;
}
// Mauvaises réponses : n éléments différents de l'identifiant donné (avec un « proche » s'il faut piéger).
function autres(pool, id, n, proche = null) {
  const l = melanger(pool.filter((x) => x.id !== id && x.id !== proche)).slice(0, n);
  if (proche && n > 0) l[0] = pool.find((x) => x.id === proche);
  return l;
}

// Fabrique une question du type demandé.
function creerQuestion(type) {
  const niv = E.niv;
  const n = niv.choix;
  const q = { type, texte: '', visuel: '', choix: null, explication: '', son: null };
  if (type === 'qcm') {
    const x = tirer('qcm', QCM, niv.themes ? (y) => niv.themes.includes(y.th) : null);
    const p = morceaux('q.' + x.id);
    q.texte = p[0];
    q.choix = melanger([{ label: p[1], bon: true }, ...melanger(p.slice(2)).slice(0, n - 1).map((label) => ({ label }))]);
  } else if (type === 'vf') {
    const x = tirer('vf', VF);
    const p = morceaux('v.' + x.id);
    q.texte = p[0]; q.explication = p[1];
    q.choix = [{ label: tr('vrai'), bon: x.v, classe: 'vrai' }, { label: tr('faux'), bon: !x.v, classe: 'faux' }];
  } else if (type === 'emo') {
    const x = tirer('emo', EMOS);
    q.texte = tr('qEmo'); q.visuel = visageHasard(x.id);
    q.choix = melanger([{ label: tr('emo.' + x.id), bon: true }, ...autres(EMOS, x.id, n - 1, niv.pieges ? x.proche : null).map((y) => ({ label: tr('emo.' + y.id) }))]);
  } else if (type === 'bulle') {
    const x = tirer('bulle', BULLES);
    if (Math.random() < 0.55) {
      q.texte = tr('b.q.' + x.id);
      q.choix = melanger([{ svg: bulle(x.id), bon: true }, ...autres(BULLES, x.id, Math.min(n, 4) - 1).map((y) => ({ svg: bulle(y.id) }))]);
    } else {
      q.texte = tr('qBulleSens'); q.visuel = bulle(x.id);
      q.choix = melanger([{ label: tr('b.s.' + x.id), bon: true }, ...autres(BULLES, x.id, n - 1).map((y) => ({ label: tr('b.s.' + y.id) }))]);
    }
  } else if (type === 'mot') {
    const x = tirer('mot', MOTS);
    q.texte = tr('qMot'); q.visuel = `<div class="mot-jp">${tr('m.' + x.id)}</div>`;
    q.choix = melanger([{ label: tr('mm.' + x.id), bon: true }, ...autres(MOTS, x.id, n - 1).map((y) => ({ label: tr('mm.' + y.id) }))]);
  } else if (type === 'ono') {
    const x = tirer('ono', ONOS);
    q.texte = tr('qOno'); q.visuel = `<div class="ono c${hasard(4)}">${tr('o.' + x.id)}</div>`; q.son = x.id;
    q.choix = melanger([{ label: tr('om.' + x.id), bon: true }, ...autres(ONOS, x.id, n - 1).map((y) => ({ label: tr('om.' + y.id) }))]);
  } else if (type === 'intrus') {
    const x = tirer('intrus', INTRUS);
    const p = morceaux('i.' + x.id);
    q.texte = tr('qIntrus');
    q.choix = melanger([{ label: p[0], bon: true }, ...p.slice(1, 4).map((label) => ({ label }))]);
  } else if (type === 'effet') {
    const x = tirer('effet', EFFETS);
    if (Math.random() < 0.5) {
      q.texte = tr('qEffet'); q.visuel = effet(x.id);
      q.choix = melanger([{ label: tr('ef.' + x.id), bon: true }, ...autres(EFFETS, x.id, n - 1).map((y) => ({ label: tr('ef.' + y.id) }))]);
    } else {
      q.texte = tr('qEffetImage', { effet: tr('ef.' + x.id) });
      const faux = autres(EFFETS, x.id, 3).map((y) => y.id);
      if (x.id === 'chibi') faux[0] = 'realiste';
      q.choix = melanger([{ svg: effet(x.id), bon: true }, ...faux.map((id) => ({ svg: effet(id) }))]);
    }
  } else if (type === 'page') {
    const [a, b] = niv.pages;
    const pool = PAGES.filter((l) => l.length >= a && l.length <= b);
    let rects = choisir(pool.length ? pool : PAGES);
    if (Math.random() < 0.5) rects = rects.map((r) => ({ x: 100 - r.x - r.w, y: r.y, w: r.w, h: r.h }));
    q.texte = tr('qPage'); q.rects = rects; q.ordre = ordreLecture(rects); q.decor = rects.map(() => hasard(9));
  } else if (type === 'bulles') {
    const k = niv.d[1] >= 3 && Math.random() < 0.6 ? 4 : 3;
    const pos = [];
    if (k === 4 && Math.random() < 0.5) {
      [[74, 14], [28, 19], [70, 46], [24, 51]].forEach(([x, y]) => pos.push({ x: x + hasard(7) - 3, y: y + hasard(5) - 2 }));
    } else {
      for (let i = 0; i < k; i++) pos.push({ x: 76 - i * (52 / (k - 1)) + hasard(5) - 2, y: 13 + i * (44 / (k - 1)) + hasard(3) - 1 });
    }
    q.texte = tr('qBulles'); q.bulles = pos; q.formes = pos.map(() => choisir(['ronde', 'ronde', 'nuage', 'pointes', 'tremble']));
  }
  return q;
}

}

  $('resume-titre').textContent = t ? '⭐ ' + nb(t) + ' / ' + nb(NIVEAUX.length * 3) + '   🃏 ' + nb(cartesGagnees()) + ' / ' + nb(NIVEAUX.length) : '';
}
function majChapitres() {
  $('compteurs').textContent = '⭐ ' + nb(totalEtoiles()) + ' / ' + nb(NIVEAUX.length * 3);

      b.title = tr('nom.' + (i + 1));
      b.addEventListener('click', () => { SONS.toucher(); lancerNiveau(i + 1); });
    }
    g.appendChild(b);
  });
}
function majAlbum() {
  $('compte-album').textContent = tr('albumCompte', { n: cartesGagnees(), max: NIVEAUX.length });
  const g = $('grille-album'); g.innerHTML = '';

/* ==========================================================================
   Chapitre : démarrage, questions, réponses
   ========================================================================== */
function lancerNiveau(n) {
  n = Math.max(1, Math.min(NIVEAUX.length, n | 0));
  if (n > progres.debloque) { progres.debloque = n; ecrireProgres(); }
  const niv = NIVEAUX[n - 1];
  fermerVoiles();
  taches = [];
  E = {
    niveau: n, niv, enCours: true, idx: 0, score: 0, scoreAffiche: 0, erreurs: 0, bonnes: 0, serie: 0,
    coeurs: niv.coeurs, jokers: niv.joker ? 1 : 0, utilises: new Set(), types: [], q: null, repondu: true,
    chrono: 0, chronoMax: 0, dernierTic: 99, duel: !!niv.duel, moi: 0, taro: 0, taroT: 0, taroMax: 0,
  };
  // Liste des types de questions du chapitre (la nouveauté arrive dès la 1re ou 2e question, puis revient).
  const total = E.duel ? niv.duel.cible * 2 + 2 : niv.q;
  const neuf = niv.nouveau.map((x) => TYPE_DE_NOUVEAUTE[x]).filter(Boolean);
  for (let i = 0; i < total; i++) {
    let t = choisir(niv.types);
    for (let k = 0; k < 4 && i >= 2 && E.types[i - 1] === t && E.types[i - 2] === t; k++) t = choisir(niv.types);
    E.types.push(t);
  }
  if (neuf.length) { E.types[0] = neuf[0]; if (total > 4) E.types[2 + hasard(total - 3)] = neuf[0]; }
  // Chapitre qui présente la question éclair : la 2e question en est une, à coup sûr.
  E.eclairForce = niv.nouveau.includes('eclair') ? 1 : -1;
  if (E.eclairForce > 0) E.types[1] = 'qcm';
  afficherEcran('jeu');
  $('info-chapitre').textContent = tr('chapitre', { n }) + ' · ' + tr('nom.' + n);
  $('duel').classList.toggle('visible', E.duel);
  $('progres').classList.toggle('cache', E.duel);
  $('coeurs').classList.toggle('cache', E.duel);
  $('progres').innerHTML = E.duel ? '' : '<i></i>'.repeat(niv.q);
  if (E.duel) {
    $('tete-moi').innerHTML = svgMochi('content'); $('tete-taro').innerHTML = svgTaro('neutre');
    $('points-moi').innerHTML = '<i></i>'.repeat(niv.duel.cible); $('points-taro').innerHTML = '<i></i>'.repeat(niv.duel.cible);
    $('points-moi').setAttribute('aria-label', tr('duelMoi')); $('points-taro').setAttribute('aria-label', tr('duelTaro'));
  }
  majBarre();
  viderQuestion();
  // Fiches « Nouveau ! » pas encore vues (le tutoriel du niveau 1 compris), puis la première question.
  const aMontrer = niv.nouveau.filter((x) => !progres.vus.includes(x));
  if (!progres.vus.includes('qcm') && !aMontrer.includes('qcm')) aMontrer.unshift('qcm');
  montrerIntros(aMontrer, () => {
    banniere(tr('chapitre', { n }) + '\n' + tr('nom.' + n));
    SONS.page();
    attendre(900, () => afficherQuestion());
  });
}
function viderQuestion() {
  $('question').textContent = ''; $('visuel').innerHTML = ''; $('reponses').innerHTML = ''; $('retour-info').textContent = '';
  $('retour-info').className = ''; $('btn-suivant').classList.remove('visible'); $('carte').classList.remove('eclair');
  $('chrono').classList.remove('visible', 'urgent', 'taro'); $('mochi-mini').innerHTML = svgMochi('content');
  $('carte').classList.remove('sans-visuel');
}
// Expression de Mochi (petite tête, et grande Mochi quand la question n'a pas de dessin).
function mochiExpr(e) {
  $('mochi-mini').innerHTML = svgMochi(e);
  const g = $('mochi-grand');
  if (g) { g.innerHTML = svgMochi(e); g.classList.remove('saute'); void g.offsetWidth; g.classList.add('saute'); }
}
function majBarre() {
  if (!E) return;
  $('coeurs').innerHTML = Array.from({ length: E.niv.coeurs }, (_, i) => `<span class="${i < E.coeurs ? '' : 'perdu'}">❤️</span>`).join('');
  $('coeurs').setAttribute('aria-label', tr('coeursAria', { n: E.coeurs }));
  const j = $('btn-joker');

  effet: () => ({ html: `<div class="d-visuel large">${effet('vitesse')}</div><div class="d-grille">${pill('ok')}${pill()}${pill()}</div>`, cibles: ['.ok'] }),
  grandePage: () => ({ html: `<div class="d-page"><i class="c0" style="left:52%;top:0;height:100%"></i><i class="c1" style="left:0;top:0"></i><i class="c2" style="left:0;top:52%"></i></div>`, cibles: ['.c0', '.c1', '.c2'], numeros: true }),
  bullesOrdre: () => ({ html: `<div class="d-cadre"><div class="b b0" style="left:72%;top:22%">${bulle('ronde')}</div><div class="b b1" style="left:48%;top:50%">${bulle('nuage')}</div><div class="b b2" style="left:24%;top:78%">${bulle('ronde')}</div></div>`, cibles: ['.b0', '.b1', '.b2'], numeros: true }),
  fragile: () => ({ html: `<div class="d-coeurs"><span>❤️</span><span>❤️</span><span class="part">❤️</span></div>`, cibles: [] }),
};
let jetonDemo = 0;
function jouerDemo(id) {
  const box = $('demo-intro');
  const d = (DEMOS[id] || DEMOS.qcm)();
  box.innerHTML = d.html + '<div class="main-demo" aria-hidden="true">👆</div>';
  const main = box.querySelector('.main-demo');
  const jeton = ++jetonDemo;
  const cibles = d.cibles.map((s) => box.querySelector(s)).filter(Boolean);
  const vivant = () => jeton === jetonDemo && introOuverte;
  let etape = 0;
  const placer = (el) => {
    const b = box.getBoundingClientRect(); const r = el.getBoundingClientRect();
    main.style.transform = `translate(${r.left - b.left + r.width / 2 - 12}px, ${r.top - b.top + r.height / 2 - 4}px)`;
  };
  const tour = () => {
    if (!vivant()) return;
    if (!cibles.length) { box.classList.toggle('anime'); main.style.display = 'none'; setTimeout(tour, 1400); return; }
    if (etape >= cibles.length) {
      setTimeout(() => { if (!vivant()) return; cibles.forEach((c) => { c.classList.remove('fait'); const n = c.querySelector('.d-num'); if (n) n.remove(); }); box.className = 'demo'; etape = 0; main.style.transform = 'translate(240px, 150px)'; setTimeout(tour, 600); }, 1300);
      return;
    }
    const el = cibles[etape];
    placer(el);
    setTimeout(() => {
      if (!vivant()) return;
      main.classList.remove('tape'); void main.offsetWidth; main.classList.add('tape');
      el.classList.add('fait'); box.classList.add('etape-' + etape);
      if (d.numeros) { const n = document.createElement('b'); n.className = 'd-num'; n.textContent = nb(etape + 1); el.appendChild(n); }
      etape++;
      setTimeout(tour, 500);
    }, 650);
  };
  main.style.transform = 'translate(240px, 150px)';
  box.className = 'demo';
  setTimeout(tour, 400);
}
function montrerIntros(liste, apres) {
  if (!liste.length) { apres(); return; }
  const id = liste[0];
  introOuverte = true;
  $('titre-intro').textContent = tr('nv.' + id + '.titre');
  $('texte-intro').textContent = tr('nv.' + id + '.texte');
  $('voile-intro').classList.add('ouvert');
  SONS.nouveau();
  jouerDemo(id);
  const fermer = () => {
    $('btn-compris').onclick = null;
    $('voile-intro').classList.remove('ouvert');
    introOuverte = false; jetonDemo++;
    if (!progres.vus.includes(id)) { progres.vus.push(id); ecrireProgres(); }
    SONS.toucher();
    montrerIntros(liste.slice(1), apres);
  };
  $('btn-compris').onclick = fermer;
  $('btn-revoir').onclick = () => { SONS.toucher(); jouerDemo(id); };
  try { $('btn-compris').focus({ preventScroll: true }); } catch (e) { /* rien */ }
}

/* ==========================================================================
   Pause
   ========================================================================== */
function mettrePause() {
  if (!E || !E.enCours || enPause || introOuverte) return;
  enPause = true;
  $('voile-pause').classList.add('ouvert');
  majBoutonsSon();
  try { $('btn-reprendre').focus({ preventScroll: true }); } catch (e) { /* rien */ }
}
function reprendre() {
  enPause = false; $('voile-pause').classList.remove('ouvert');
}
function fermerVoiles() {
  enPause = false; introOuverte = false; jetonDemo++;
  document.querySelectorAll('.voile').forEach((v) => v.classList.remove('ouvert'));
}
function quitterVersAccueil() {
  if (E && E.enCours) { try { JEL_SAVE.save(JEU, { niveau: E.niveau, score: E.score, progres }); } catch (e) { /* rien */ } }
  if (E) E.enCours = false;
  taches = [];
  fermerVoiles();
  afficherEcran('titre');
}

/* ==========================================================================
   Boucle : chrono, barre de Taro, attentes (tout est figé en pause)
   ========================================================================== */
let dernier = 0;
function boucle(t) {
  const dt = dernier ? Math.min(100, t - dernier) : 0; dernier = t;
  if (!fige()) {
    const prets = [];
    taches.forEach((x) => { x.reste -= dt; if (x.reste <= 0) prets.push(x); });
    taches = taches.filter((x) => x.reste > 0);
    prets.forEach((x) => x.f());
    if (E && E.q && !E.repondu) {
      if (E.duel && E.taroMax) {
        E.taroT -= dt;
        $('chrono-barre').style.transform = `scaleX(${Math.max(0, E.taroT / E.taroMax)})`;
        if (E.taroT <= 0) taroRepond();
      } else if (E.chronoMax) {
        E.chrono -= dt;
        const r = Math.max(0, E.chrono / E.chronoMax);
        $('chrono-barre').style.transform = `scaleX(${r})`;
        const s = Math.ceil(E.chrono / 1000);
        $('chrono').classList.toggle('urgent', s <= 3);
        if (s <= 3 && s < E.dernierTic && s > 0) { E.dernierTic = s; SONS.tic(); }
        if (E.chrono <= 0) tempsEcoule();
      }
    }
  }
  requestAnimationFrame(boucle);
}

/* ==========================================================================
   Commandes : doigt, souris et clavier
   ========================================================================== */
function demarrer() {
  SONS.toucher();
  JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => lancerNiveau(Math.max(1, Math.min(NIVEAUX.length, d.niveau | 0))),
    onNouvelle: () => lancerNiveau(1),
    onEffacer: () => afficherEcran('titre'),
  });
}
$('btn-jouer').addEventListener('click', demarrer);
$('btn-chapitres').addEventListener('click', () => { SONS.toucher(); afficherEcran('chapitres'); });
$('btn-album').addEventListener('click', () => { SONS.toucher(); afficherEcran('album'); });
$('retour-chapitres').addEventListener('click', () => { SONS.toucher(); afficherEcran('titre'); });
$('retour-album').addEventListener('click', () => { SONS.toucher(); afficherEcran('titre'); });
document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
$('btn-son-pause').addEventListener('click', basculerSon);
$('btn-pause').addEventListener('click', () => { SONS.toucher(); mettrePause(); });
$('btn-reprendre').addEventListener('click', () => { SONS.toucher(); reprendre(); });
$('btn-recommencer').addEventListener('click', () => { SONS.toucher(); lancerNiveau(E ? E.niveau : 1); });
$('btn-accueil-pause').addEventListener('click', () => { SONS.toucher(); quitterVersAccueil(); });
$('btn-joker').addEventListener('click', utiliserJoker);
$('btn-suivant').addEventListener('click', () => { if (!E || fige() || !E.repondu) return; SONS.toucher(); suivante(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') mettrePause(); });

document.addEventListener('keydown', (e) => {
  if (e.target && e.target.closest && e.target.closest('.jel-langue')) return;
  const code = e.code;
  // Fiche « Nouveau ! »
  if (introOuverte) { if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') { e.preventDefault(); $('btn-compris').click(); } return; }
  if ($('voile-pause').classList.contains('ouvert')) { if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); reprendre(); } return; }
  if ($('voile-fin').classList.contains('ouvert')) return;
  const ecranJeu = $('ecran-jeu').classList.contains('actif');
  if (!ecranJeu) {
    if ($('ecran-titre').classList.contains('actif') && (code === 'Enter' || code === 'Space') && document.activeElement === document.body) { e.preventDefault(); demarrer(); }
    return;
  }
  if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); mettrePause(); return; }
  if (!E || !E.q) return;
  if (E.repondu) {
    if ((code === 'Enter' || code === 'Space' || code === 'NumpadEnter') && $('btn-suivant').classList.contains('visible')) { e.preventDefault(); $('btn-suivant').click(); }
    return;
  }
  const m = /^(?:Digit|Numpad)([1-6])$/.exec(code);
  if (m && E.q.choix) { e.preventDefault(); choisirReponse(+m[1] - 1); return; }
  if (code === 'KeyJ') { e.preventDefault(); utiliserJoker(); return; }
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(code)) {
    const boutons = [...document.querySelectorAll('#reponses .rep:not([disabled]):not(.retire), #visuel .case, #visuel .bulle-o')];
    if (!boutons.length) return;
    e.preventDefault();
    const i = boutons.indexOf(document.activeElement);
    const pas = code === 'ArrowLeft' || code === 'ArrowUp' ? -1 : 1;
    boutons[i < 0 ? 0 : (i + pas + boutons.length) % boutons.length].focus();
  }
});
// Le premier geste réveille le son (jamais de son avant).
['pointerdown', 'keydown'].forEach((t) => document.addEventListener(t, () => { if (progres.son && ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch (e) { /* rien */ } } }, { passive: true }));

// Sauvegarde à la fermeture de la page, seulement pendant une partie.
JEL_SAVE.surFermeture(() => {
  if (E && E.enCours) JEL_SAVE.save(JEU, { niveau: E.niveau, score: E.score, progres });
});

/* ---------- Démarrage ---------- */
lireProgres();
// Textes fixes de la page repassés par tr() (espace insécable avant « ! ? : »).
const retraduire = () => document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = tr(el.getAttribute('data-i18n')); });
retraduire();
document.addEventListener('DOMContentLoaded', retraduire);
setTimeout(retraduire, 0);
$('dessin-titre').innerHTML = dessinTitre();
$('dessin-titre').firstElementChild.setAttribute('aria-label', tr('sceneAria'));
majBoutonsSon();
majTitre();
requestAnimationFrame(boucle);
</script>
