  S.bus = nouveauBus(N.v); S.bus2 = null; S.acteurs = []; S.particules = []; S.train = false;
  // Passagers déjà assis au départ
  for (let k = 0; k < S.plan.depart.haut; k++) asseoir(S.bus, 'haut', nouvellePersonne());
  for (let k = 0; k < S.plan.depart.tot - S.plan.depart.haut; k++) asseoir(S.bus, 'bas', nouvellePersonne());
  S.decor = nouveauDecor(N.v === 'car' ? 'montagne' : VEH[N.v].decor, false);
  S.poteau = null;
  afficherEcran('jeu');
  $('reponses').innerHTML = ''; $('pieces').innerHTML = ''; $('explication').textContent = '';
  message('obs.depart');
  majHud();
  requestAnimationFrame(() => ajuster(toile));
  // Présentation des nouveautés de cette ligne
  for (const k of N.nouv) {
    if (P.vus.includes(k)) continue;
    await montrerTuto(k);
    if (tok !== S.jeton) return;
    if (!P.vus.includes(k)) P.vus.push(k);
  }
  for (let i = 0; i < N.arrets; i++) {
    S.arret = i; majHud();
    await jouerArret(S.plan.liste[i], tok);
    if (tok !== S.jeton) return;
    if (S.erreurs >= 3) { finDefaite(); return; }
  }
  message('obs.terminus');
  klaxonner();
  await attendre(700);
  if (tok !== S.jeton) return;
  finVictoire();
}

function asseoir(bus, etage, pers) {
  const liste = etage === 'haut' ? bus.haut : bus.bas;
  const libres = []; liste.forEach((p, i) => { if (!p) libres.push(i); });
  if (!libres.length) return false;
  liste[pick(libres)] = pers; return true;
}
function lever(bus, etage) {
  const liste = etage === 'haut' ? bus.haut : bus.bas;
  const occ = []; liste.forEach((p, i) => { if (p) occ.push(i); });
  if (!occ.length) return nouvellePersonne();
  const i = pick(occ); const p = liste[i]; liste[i] = null; return p;
}

/* Prépare la file d'attente sur le trottoir (ou sur le quai du train) */
function placerFile(st, g, corresp) {
  const files = [[], []];
  const curseur = corresp ? [TRAIN_PORTE - 4, TRAIN_PORTE - 4] : g.portes.map((p) => p.cx + 20);
  const sens = corresp ? -1 : 1;
  const unites = st.mont.map((u) => ({ ...u, restant: false })).concat(st.restants.map((u) => ({ ...u, restant: true })));
  for (const u of unites) {
    const porte = corresp ? 0 : Math.min(u.porte, g.portes.length - 1);
    const taille = u.membres.length;
    // Classe en sortie (5 enfants, casquettes jaunes) ou famille (un adulte, un enfant)
    const style = (k) => (taille === 5 ? { taille: 0.8, chapeau: '#ffd23f', habit: '#3b7fe0' } : (taille === 2 ? { taille: k === 0 ? 1 : 0.8 } : null));
    if (sens < 0) curseur[porte] -= taille * 13 + 9;
    const base = curseur[porte];
    u.acteurs = u.membres.map((et, k) => {
      const a = nouvellePersonne(style(k));
      a.etage = et;
      a.x = base + k * 13; // le premier membre est toujours le plus à gauche
      a.y = 248 + ((files[porte].length + k) % 2) * 5;
      S.acteurs.push(a);
      return a;
    });
    for (let k = 0; k + 1 < u.acteurs.length; k++) u.acteurs[k].lien = u.acteurs[k + 1];
    if (sens > 0) curseur[porte] += taille * 13 + 9;
    files[porte].push(u);
  }
  return unites;
}

async function porte(bus, ouvert, tok) {
  if (ouvert) SONS.porte();
  const de = bus.portes.slice();
  await anim(300, (p) => { bus.portes = de.map((d) => lerp(d, ouvert ? 1 : 0, p)); });
  return tok === S.jeton;
}

async function marcher(acteurs, dx, vit, cibleX) {
  const departs = acteurs.map((a) => a.x);
  const dist = Math.abs(cibleX - departs[0]);
  const duree = Math.max(200, (dist / (110 * vit)) * 1000);
  acteurs.forEach((a) => { a.marche = true; });
  await anim(duree, (p) => { acteurs.forEach((a, k) => { a.x = departs[k] + (cibleX - departs[0]) * p; }); });
  acteurs.forEach((a) => { a.marche = false; });
  void dx;
}

async function entrer(bus, a, g, porteIdx) {
  const d = g.portes[porteIdx] || g.portes[0];
  a.marche = true;
  const x0 = a.x;
  await anim(Math.max(120, Math.abs(d.cx - x0) * 7), (p) => { a.x = lerp(x0, d.cx, p); });
  await anim(170, (p) => { a.a = 1 - p; a.y = 248 - 10 * p; });
  a.marche = false;
  SONS.pas();
  const pers = { peau: a.peau, cheveux: a.cheveux, habit: a.habit, chapeau: a.chapeau };
  if (a.etage === 'haut') {
    const e = { p: 0, pers }; bus.escalier.push(e);
    await anim(480, (p) => { e.p = p; });
    bus.escalier.splice(bus.escalier.indexOf(e), 1);
    asseoir(bus, 'haut', pers);
  } else asseoir(bus, 'bas', pers);
}

async function sortir(bus, etage, g, porteIdx, versX, vit) {
  const pers = lever(bus, etage);
  if (etage === 'haut') {
    const e = { p: 1, pers }; bus.escalier.push(e);
    await anim(420, (p) => { e.p = 1 - p; });
    bus.escalier.splice(bus.escalier.indexOf(e), 1);
  }
  const d = g.portes[porteIdx] || g.portes[0];
  const a = nouvellePersonne({ habit: pers.habit }); a.peau = pers.peau; a.cheveux = pers.cheveux; a.chapeau = pers.chapeau || null;
  a.x = d.cx; a.y = 236; a.a = 0;
  S.acteurs.push(a);
  SONS.pas();
  await anim(170, (p) => { a.a = p; a.y = 236 + 24 * p; });
  return a;
}

async function descendre(st, g, tok, corresp) {
  const vit = vitesse();
  const sorties = [];
  for (let i = 0; i < st.desc.length; i++) {
    const u = st.desc[i];
    const porteIdx = corresp ? 0 : (st.deuxPortes ? i % 2 : 0);
    const groupe = [];
    for (const et of u.membres) {
      const a = await sortir(S.bus, et, g, porteIdx, 0, vit);
      if (tok !== S.jeton) return;
      groupe.push(a);
      if (groupe.length > 1) groupe[groupe.length - 2].lien = a;
      await attendre(90 / vit);
    }
    // Le groupe s'en va : vers la gauche, ou vers le train pour une correspondance
    const cible = corresp ? TRAIN_PORTE : -60 - groupe.length * 14;
    sorties.push((async () => {
      await marcher(groupe, 0, vit, cible);
      if (corresp) await anim(170, (p) => groupe.forEach((a) => { a.a = 1 - p; }));
      groupe.forEach((a) => { a.a = 0; });
    })());
    // Avec deux portes, deux groupes sortent presque en même temps
    await attendre((st.deuxPortes && i % 2 === 0 ? 90 : 260) / vit);
  }
  await Promise.all(sorties);
  S.acteurs = S.acteurs.filter((a) => a.a > 0.01);
}

async function monter(unites, bus, g, tok) {
  const vit = vitesse();
  const groupes = unites.map((u, i) => (async () => {
    await attendre(i * 330 / vit);
    if (tok !== S.jeton) return;
    const d = g.portes[Math.min(u.porte, g.portes.length - 1)] || g.portes[0];
    await marcher(u.acteurs, 0, vit, d.cx + 14);
    for (const a of u.acteurs) {
      await entrer(bus, a, g, Math.min(u.porte, g.portes.length - 1));
      if (tok !== S.jeton) return;
    }
  })());
  await Promise.all(groupes);
  S.acteurs = S.acteurs.filter((a) => a.a > 0.01);
}

async function jouerArret(st, tok) {
  const N = NIVEAUX[S.niv];
  const corresp = st.type === 'corresp';
  S.decor = nouveauDecor(N.v === 'car' ? 'montagne' : VEH[N.v].decor, corresp);
  S.train = corresp;
  S.acteurs = []; S.bus2 = null;
  S.bus.teinteBas = st.cacheBas; S.bus.teinteHaut = st.cacheHaut; S.bus.payeur = null;
  const cible = corresp ? 22 : Math.round((420 - VEH[N.v].long) / 2);
  const g = geo(N.v, cible);
  S.poteau = corresp ? null : g.portes[0].cx - 26;
  const unites = placerFile(st, g, corresp);
  $('reponses').innerHTML = ''; $('pieces').innerHTML = ''; $('explication').textContent = '';
  message(corresp ? 'obs.corresp' : 'obs.arrivee');
  // Arrivée
  S.bus.x = 460; S.bus.portes = [0, 0];
  SONS.moteur();
  await anim(1300 / vitesse(), (p) => { S.bus.x = lerp(460, cible, 1 - Math.pow(1 - p, 3)); });
  if (tok !== S.jeton) return;
  if (!(await porte(S.bus, true, tok))) return;
  // Descente
  if (st.d > 0) {
    message('obs.descente');
    await descendre(st, g, tok, corresp);
    if (tok !== S.jeton) return;
  }
  // Questions posées avant la montée
  if (st.q === 'places' || st.q === 'trottoir') {
    await poserQuestion(st, tok);
    if (tok !== S.jeton) return;
  }
  // Montée
  const montants = unites.filter((u) => !u.restant);
  const payeur = st.type === 'monnaie' ? montants.pop() : null;
  if (montants.length) {
    message('obs.montee');
    await monter(montants, S.bus, g, tok);
    if (tok !== S.jeton) return;
  }
  if (payeur) {
    message('obs.monnaie');
    const d = g.portes[0];
    await marcher(payeur.acteurs, 0, vitesse(), d.cx + 16);
    if (tok !== S.jeton) return;
    S.bus.payeur = payeur.acteurs[0];
    await poserQuestion(st, tok);
    if (tok !== S.jeton) return;
    SONS.pieces();
    S.bus.payeur = null;
    await entrer(S.bus, payeur.acteurs[0], g, 0);
    if (tok !== S.jeton) return;
  }
  if (!(await porte(S.bus, false, tok))) return;
  // Question posée après la montée
  if (st.q !== 'places' && st.q !== 'trottoir' && st.q !== 'monnaie') {
    await poserQuestion(st, tok);
    if (tok !== S.jeton) return;
  }
  if (S.erreurs >= 3) return;
  await roulerPuce(st.apres.tot, st.apres.haut);
  if (tok !== S.jeton) return;
  const restants = unites.filter((u) => u.restant);
  // Dernier arrêt sans deuxième bus : le véhicule reste au terminus
  if (st === S.plan.liste[S.plan.liste.length - 1] && !restants.length) return;
  // Départ
  message('obs.depart');
  klaxonner();
  SONS.moteur();
  const x0 = S.bus.x;
  await anim(1000 / vitesse(), (p) => { S.bus.x = lerp(x0, -VEH[N.v].long - 30, p * p); });
  if (tok !== S.jeton) return;
  // Deuxième bus pour ceux qui restent
  if (restants.length) {
    message('obs.deuxieme');
    S.bus2 = nouveauBus(N.v); S.bus2.couleur = '#9fb3c8'; S.bus2.casquette = 'marine';
    SONS.moteur();
    await anim(1100 / vitesse(), (p) => { S.bus2.x = lerp(460, cible, 1 - Math.pow(1 - p, 3)); });
    if (!(await porte(S.bus2, true, tok))) return;
    restants.forEach((u) => u.acteurs.forEach((a) => { a.etage = 'bas'; }));
    await monter(restants, S.bus2, g, tok);
    if (!(await porte(S.bus2, false, tok))) return;
    klaxonner('pouet');
    const x2 = S.bus2.x;
    await anim(900 / vitesse(), (p) => { S.bus2.x = lerp(x2, -VEH[N.v].long - 30, p * p); });
    S.bus2 = null;
  }
}

/* ---------- Questions et réponses ---------- */
function texteQuestion(st) {
  switch (st.q) {
    case 'haut': return tr('q.haut');
    case 'places': return tr('q.places');
    case 'trottoir': return tr('q.trottoir');
    case 'change': return tr('q.change');
    case 'monnaie': return tr('q.monnaie', { prix: tr('pieces', { n: st.prix }), nom: st.nom, donne: tr('pieces', { n: st.donne }) });
    default: return tr('q.total');
  }
}

function propositions(rep, st) {
  const N = NIVEAUX[S.niv];
  const ecarts = [1, -1, 2, -2];
  if ((N.g || []).includes(2)) ecarts.push(2, -2);
  if ((N.g || []).includes(5)) ecarts.push(5, -5);
  if (st.q === 'total' || st.q === 'haut') { ecarts.push(st.d || 1, -(st.m || 1)); }
  const choix = new Set([rep]);
  const essais = melanger(ecarts.slice());
  for (const e of essais) { if (choix.size >= 3) break; const v = rep + e; if (v >= 0 && e !== 0) choix.add(v); }
  for (let v = rep + 1; choix.size < 3; v++) choix.add(v);
  return melanger([...choix]);
}

function attendreReponse(st) {
  return new Promise((resoudre) => {
    const z = $('reponses'); z.innerHTML = '';
    const repondre = (v) => {
      if (S.pause || !S.attente) return;
      S.attente = null;
      z.querySelectorAll('button').forEach((b) => { b.disabled = true; });
      resoudre(v);
    };
    S.attente = { st, repondre };
    if (st.mode === 'ouinon') {
      for (const [v, cle] of [['oui', 'r.oui'], ['non', 'r.non']]) {
        const b = document.createElement('button'); b.className = 'rep texte'; b.textContent = tr(cle); b.dataset.v = v;
        b.addEventListener('click', () => { SONS.clic(); repondre(v); }); z.appendChild(b);
      }
    } else if (st.mode === 'compteur') {
      let val = st.q === 'total' ? S.abord : (st.q === 'haut' ? S.haut : 0);
      const boite = document.createElement('div'); boite.className = 'compteur';
      const moins = document.createElement('button'); moins.className = 'fl'; moins.setAttribute('aria-label', tr('moins'));
      moins.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 9l7 8 7-8z" fill="#1f2a44"/></svg>';
      const aff = document.createElement('span'); aff.className = 'val'; aff.setAttribute('role', 'status');
      const plus = document.createElement('button'); plus.className = 'fl'; plus.setAttribute('aria-label', tr('plus'));
      plus.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 15l7-8 7 8z" fill="#1f2a44"/></svg>';
      const ok = document.createElement('button'); ok.className = 'fl ok'; ok.setAttribute('aria-label', tr('valider'));
      ok.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 12l5 5 11-11" fill="none" stroke="#1f2a44" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const maj = () => { aff.textContent = nb(val); aff.setAttribute('aria-label', tr('compteur', { n: val })); };
      const changer = (dv) => { if (S.pause || !S.attente) return; val = borne(val + dv, 0, 60); SONS.fleche(dv > 0); maj(); };
      moins.addEventListener('click', () => changer(-1));
      plus.addEventListener('click', () => changer(1));
      ok.addEventListener('click', () => { SONS.clic(); repondre(val); });
      maj();
      boite.append(moins, aff, plus, ok); z.appendChild(boite);
      S.attente.changer = changer; S.attente.valider = () => { SONS.clic(); repondre(val); };
    } else {
      propositions(st.reponse, st).forEach((v) => {
        const b = document.createElement('button'); b.className = 'rep'; b.textContent = nb(v); b.dataset.v = String(v);
        b.addEventListener('click', () => { SONS.clic(); repondre(v); }); z.appendChild(b);
      });
    }
    // Pièces dessinées pour la monnaie
    if (st.q === 'monnaie') {
      const p = $('pieces'); p.innerHTML = '';
      const tasPrix = document.createElement('div'); tasPrix.className = 'tas';
      tasPrix.innerHTML = '<svg class="ic" viewBox="0 0 30 20"><use href="#ic-ticket"/></svg>' + '<i class="piece vide"></i>'.repeat(st.prix);
      const tasDonne = document.createElement('div'); tasDonne.className = 'tas';
      tasDonne.innerHTML = '<svg class="ic" viewBox="0 0 24 24"><use href="#ic-main"/></svg>' + '<i class="piece"></i>'.repeat(st.donne);
      p.append(tasPrix, tasDonne);
    }
  });
}

function explication(st) {
  switch (st.q) {
    case 'places': return tr('calc.places', { attente: st.attente, libres: st.libres });
    case 'trottoir': return tr('calc.trottoir', { attente: st.attente, libres: st.libres, reste: st.reponse });
    case 'monnaie': return tr('calc.monnaie', { donne: st.donne, prix: st.prix, rendu: st.reponse });
    case 'change': return tr('calc.change', { descendus: st.d, montes: st.m, total: st.reponse });
    case 'haut': {
      const montesHaut = st.apres.haut - st.avant.haut + st.desc.reduce((s, u) => s + u.membres.filter((m) => m === 'haut').length, 0);
      const descHaut = st.desc.reduce((s, u) => s + u.membres.filter((m) => m === 'haut').length, 0);
      return tr(descHaut ? 'calc.total' : 'calc.plus', { depart: st.avant.haut, montes: montesHaut, descendus: descHaut, total: st.reponse });
    }
    default: return tr(st.d ? 'calc.total' : 'calc.plus', { depart: st.avant.tot, montes: st.m, descendus: st.d, total: st.reponse });
  }
}

async function poserQuestion(st, tok) {
  $('msg').textContent = texteQuestion(st);
  $('explication').textContent = '';
  const choix = await attendreReponse(st);
  if (tok !== S.jeton) return;
  const bon = choix === st.reponse;
  // Bouton juste en vert, mauvais choix en rouge
  $('reponses').querySelectorAll('.rep').forEach((b) => {
    if (b.dataset.v === String(st.reponse)) b.classList.add('bon');
    else if (b.dataset.v === String(choix)) b.classList.add('faux');
  });
  if (bon) {
    S.tickets++; P.tickets++;
    $('msg').textContent = tr('bravo' + rand(1, 4)) + ' ' + tr('ticketGagne');
    SONS.bon(); setTimeout(() => SONS.ticket(), 250);
    confettis();
    const t = $('hud-tickets'); t.classList.remove('saute'); void t.offsetWidth; t.classList.add('saute');
  } else {
    S.erreurs++;
    if (st.q === 'places') $('msg').textContent = tr(st.reponse === 'oui' ? 'oupsOui' : 'oupsNon');
    else $('msg').textContent = tr('oups', { n: st.reponse });
    SONS.erreur();
    const sc = $('scene'); sc.classList.remove('secoue'); void sc.offsetWidth; sc.classList.add('secoue');
  }
  $('explication').textContent = explication(st);
  majHud();
  await attendre(bon ? 1300 : 2900);
  if (tok !== S.jeton) return;
  $('reponses').innerHTML = ''; $('pieces').innerHTML = ''; $('explication').textContent = '';
}

function confettis() {
  const coul = ['#e5533d', '#3b7fe0', '#34a866', '#ffd23f', '#ee77ab', '#8d5fd3'];
  for (let i = 0; i < 26; i++) S.particules.push({ x: 210 + rand(-60, 60), y: 90, vx: (Math.random() - 0.5) * 0.3, vy: -0.15 - Math.random() * 0.2, vie: 1100, couleur: pick(coul), rot: Math.random() * 6, forme: i % 6 === 0 ? 'etoile' : 'conf' });
  S.particules.push({ x: 210, y: 120, vx: 0.18, vy: -0.22, vie: 900, rot: 0, forme: 'ticket', cible: true });
}
function majParticules(dt) {
  for (const p of S.particules) {
    p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.forme === 'ticket') { p.x = lerp(p.x, 410, 0.04); p.y = lerp(p.y, -10, 0.04); p.rot += 0.004 * dt; }
    else { p.vy += 0.0006 * dt; p.rot += 0.01 * dt; }
  }
  S.particules = S.particules.filter((p) => p.vie > 0);
}

/* ---------- Fins de ligne ---------- */
function objetsDebloques(avant, apres) {
  const liste = [];
  for (const [l, cle] of [[COULEURS, 'couleur'], [KLAXONS, 'klaxon'], [CASQUETTES, 'casquette']]) {
    for (const o of l) if (o.prix > avant && o.prix <= apres) liste.push(tr(cle + '.' + o.id));
  }
  return liste;
}

function finVictoire() {
  const n = S.niv, N = NIVEAUX[n];
  S.enJeu = false;
  const etoiles = Math.max(1, 3 - S.erreurs);
  P.etoiles[n] = Math.max(P.etoiles[n], etoiles);
  const ancienRecord = P.records[n];
  const record = S.tickets > ancienRecord;
  P.records[n] = Math.max(P.records[n], S.tickets);
  P.debloque = Math.min(NIVEAUX.length, Math.max(P.debloque, n + 2));
  enregistrer(Math.min(NIVEAUX.length, n + 2));
  if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
  const toutFini = P.etoiles.every((e) => e > 0);
  if (toutFini) { if (window.FMG) window.FMG.reportComplete({ stars: etoilesTotal(), maxStars: NIVEAUX.length * 3 }); }
  SONS.victoire();
  confettis(); confettis();
  ouvrirFin(true, { etoiles, record, ancienRecord, nouveaux: objetsDebloques(S.ticketsDebut, P.tickets), dernier: n === NIVEAUX.length - 1, toutFini, arrets: N.arrets });
}

function finDefaite() {
  const n = S.niv;
  S.enJeu = false;
  enregistrer(n + 1);
  if (window.FMG) window.FMG.reportEnd({ completed: false, level: n + 1 });
  SONS.defaite();
  ouvrirFin(false, { nouveaux: objetsDebloques(S.ticketsDebut, P.tickets), arrets: NIVEAUX[n].arrets, ancienRecord: P.records[n] });
}

function ouvrirFin(gagne, info) {
  const n = S.niv;
  $('fin-titre').textContent = gagne ? tr('fin.victoire', { n: n + 1 }) : tr('fin.defaite');
  $('fin-texte').textContent = gagne ? '' : tr('fin.defaiteTexte');
  const et = $('fin-etoiles'); et.innerHTML = '';
  if (gagne) {
    for (let i = 0; i < 3; i++) { et.insertAdjacentHTML('beforeend', SVG_ETOILE(i < info.etoiles)); }
    et.setAttribute('aria-label', tr('etoilesN', { n: info.etoiles }));
    et.querySelectorAll('svg').forEach((s, i) => setTimeout(() => { s.classList.add('vue'); if (i < info.etoiles) note(660 + i * 220, 0.15, { type: 'triangle', vol: 0.1 }); }, 300 + i * 350));
  }
  $('fin-tickets').textContent = tr('fin.tickets', { n: S.tickets, max: info.arrets });
  $('fin-record').textContent = gagne && info.record ? tr('fin.record') : tr('fin.recordAncien', { n: Math.max(info.ancienRecord, gagne ? S.tickets : 0) });
  $('fin-debloque').textContent = info.nouveaux.length ? tr('fin.debloque', { liste: info.nouveaux.join(', ') }) : '';
  $('fin-bilan').textContent = gagne && info.dernier ? tr('fin.jeuFini', { lignes: NIVEAUX.length, n: etoilesTotal(), max: NIVEAUX.length * 3 }) : '';
  const b1 = $('b-fin-1'), b2 = $('b-fin-2'), b3 = $('b-fin-3');
  if (gagne) {
    if (info.dernier) { b1.textContent = tr('album'); b1.onclick = () => { SONS.clic(); fermerVoiles(); afficherEcran('album'); }; }
    else { b1.textContent = tr('suivant'); b1.onclick = () => { SONS.clic(); lancerNiveau(n + 1); }; }
    b2.textContent = tr('rejouer'); b2.onclick = () => { SONS.clic(); lancerNiveau(n); };
    b3.textContent = tr('lignes'); b3.onclick = () => { SONS.clic(); fermerVoiles(); afficherEcran('lignes'); };
  } else {
    b1.textContent = tr('reessayer'); b1.onclick = () => { SONS.clic(); lancerNiveau(n); };
    b2.textContent = tr('lignes'); b2.onclick = () => { SONS.clic(); fermerVoiles(); afficherEcran('lignes'); };
    b3.textContent = tr('accueil'); b3.onclick = () => { SONS.clic(); fermerVoiles(); afficherEcran('titre'); };
  }
  $('voile-fin').hidden = false;
  setTimeout(() => { try { b1.focus(); } catch (e) { /* rien */ } }, 50);
}

function fermerVoiles() { ['voile-fin', 'voile-pause', 'voile-tuto'].forEach((id) => { $(id).hidden = true; }); S.pause = false; }

/* ---------- Pause ---------- */
function pauser() {
  if (S.ecran !== 'jeu' || !S.enJeu || S.pause || S.tutoOuvert || !$('voile-fin').hidden) return;
  S.pause = true; $('voile-pause').hidden = false;
  setTimeout(() => { try { $('b-reprendre').focus(); } catch (e) { /* rien */ } }, 30);
}
function reprendre() { S.pause = false; $('voile-pause').hidden = true; }

/* =========================================================================
   TUTORIELS ANIMÉS (mini-scènes dessinées + main)
   ========================================================================= */
const TUTOS = {
  base:       { v: 'bus', assis: 2, etapes: ['tuto.base1', 'tuto.base2', 'tuto.base3'], flux: [{ t: 'monte', n: 3 }], main: 'suivre' },
  descente:   { v: 'bus', assis: 6, etapes: ['m.descente'], flux: [{ t: 'descend', n: 2 }], main: 'porte' },
  compteur:   { v: 'bus', assis: 4, etapes: ['m.compteur'], flux: [], main: 'fleches' },
  portes:     { v: 'bus', assis: 4, teinte: true, etapes: ['m.portes'], flux: [{ t: 'monte', n: 2 }], main: 'porte' },
  minibus:    { v: 'minibus', assis: 3, etapes: ['m.vehicule'], vehicule: 'minibus', flux: [{ t: 'monte', n: 1 }], main: 'porte' },
  groupes2:   { v: 'minibus', assis: 2, etapes: ['m.groupes2'], flux: [{ t: 'monte', n: 2, groupe: true }, { t: 'monte', n: 2, groupe: true }], main: 'suivre' },
  groupes5:   { v: 'minibus', assis: 1, etapes: ['m.groupes5'], flux: [{ t: 'monte', n: 5, groupe: true, classe: true }], main: 'suivre' },
  places:     { v: 'minibus', assis: 6, etapes: ['m.places'], flux: [{ t: 'attend', n: 4 }], main: 'sieges', deuxieme: true },
  trottoir:   { v: 'minibus', assis: 6, etapes: ['m.trottoir'], flux: [{ t: 'monte', n: 2 }, { t: 'attend', n: 2 }], main: 'file' },
  etage:      { v: 'etage', assis: 4, assisHaut: 5, etapes: ['m.vehicule', 'm.etage'], vehicule: 'etage', flux: [{ t: 'monte', n: 2, haut: true }], main: 'etages' },
  haut:       { v: 'etage', assis: 4, assisHaut: 4, teinteHaut: true, etapes: ['m.haut'], flux: [{ t: 'monte', n: 2, haut: true }], main: 'escalier' },
  tram:       { v: 'tram', assis: 5, etapes: ['m.vehicule'], vehicule: 'tram', flux: [{ t: 'monte', n: 2 }], main: 'porte' },
  monnaie:    { v: 'tram', assis: 5, etapes: ['m.monnaie'], flux: [{ t: 'paie', n: 1 }], main: 'pieces' },
  deuxPortes: { v: 'tram', assis: 5, etapes: ['m.deuxPortes'], flux: [{ t: 'monte', n: 2, porte: 0 }, { t: 'monte', n: 2, porte: 1 }], main: 'deuxportes' },
  car:        { v: 'car', assis: 5, etapes: ['m.vehicule'], vehicule: 'car', flux: [{ t: 'monte', n: 1 }], main: 'porte' },
  corresp:    { v: 'car', assis: 6, etapes: ['m.corresp'], train: true, flux: [{ t: 'versTrain', n: 2 }, { t: 'depuisTrain', n: 2 }], main: 'train' },
};
const TUTO = { cle: null, etat: null, etape: 0, debut: 0, fin: null, minuteur: null };

function preparerDemo(cle) {
  const d = TUTOS[cle];
  const train = !!d.train;
  const bus = nouveauBus(d.v); bus.x = train ? 22 : Math.round((420 - VEH[d.v].long) / 2); bus.portes = [1, 1];
  bus.teinteBas = !!d.teinte; bus.teinteHaut = !!(d.teinte || d.teinteHaut);
  for (let k = 0; k < (d.assis || 0); k++) asseoir(bus, 'bas', nouvellePersonne());
  for (let k = 0; k < (d.assisHaut || 0); k++) asseoir(bus, 'haut', nouvellePersonne());
  const g = geo(d.v, bus.x);
  const acteurs = [];
  const flux = [];
  d.flux.forEach((f, fi) => {
    const membres = [];
    for (let k = 0; k < f.n; k++) {
      const a = nouvellePersonne(f.classe ? { taille: 0.8, chapeau: '#ffd23f', habit: '#3b7fe0' } : (f.groupe ? { taille: k % 2 ? 0.8 : 1 } : null));
      membres.push(a); acteurs.push(a);
    }
    if (f.groupe) for (let k = 0; k + 1 < membres.length; k++) membres[k].lien = membres[k + 1];
    flux.push({ ...f, membres, fi });
  });
  return { d, bus, g, acteurs, flux, decor: nouveauDecor(d.v === 'car' ? 'montagne' : VEH[d.v].decor, train), train };
}

function animerDemo(e, ms) {
  const T = 3600, t = ms % T, p = t / T;
  const g = e.g, d0 = g.portes[0], d1 = g.portes[1] || g.portes[0];
  let main = null;
  e.bus.escalier = [];
  e.bus2 = null;
  e.flux.forEach((f) => {
    f.membres.forEach((a, k) => {
      a.a = 1; a.marche = false;
      const porteF = f.porte === 1 ? d1 : d0;
      const debut = 0.08 + k * 0.1 + f.fi * 0.15;
      const q = borne((p - debut) / 0.35, 0, 1);
      if (f.t === 'monte' || f.t === 'paie') {
        const x0 = porteF.cx + 24 + k * 14 + f.fi * (f.porte !== undefined ? 0 : 30);
        a.x = lerp(x0, porteF.cx, q); a.y = 248; a.marche = q > 0 && q < 1;
        if (f.t === 'paie') { a.x = lerp(x0, porteF.cx + 16, q); }
        if (q >= 1 && f.t === 'monte') {
          const r = borne((p - debut - 0.35) / 0.08, 0, 1); a.a = 1 - r; a.y = 248 - 10 * r;
          if (f.haut && r >= 1) { const sp = borne((p - debut - 0.43) / 0.15, 0, 1); if (sp < 1) e.bus.escalier.push({ p: sp, pers: a }); }
        }
      } else if (f.t === 'descend') {
        a.x = lerp(d0.cx, -40, q); a.y = 260; a.marche = q > 0 && q < 1; a.a = q > 0 ? 1 : 0;
      } else if (f.t === 'versTrain') {
        a.x = lerp(d0.cx, TRAIN_PORTE, q); a.y = 262; a.marche = q > 0 && q < 1; a.a = q > 0 && q < 1 ? 1 : 0;
      } else if (f.t === 'depuisTrain') {
        a.x = lerp(TRAIN_PORTE - 4, d0.cx, q); a.y = 248; a.marche = q > 0 && q < 1; a.a = q < 1 ? 1 : 0;
      } else if (f.t === 'attend') {
        a.x = d0.cx + 24 + k * 14 + f.fi * 30; a.y = 248;
      }
    });
  });
  if (e.d.deuxieme && p > 0.55) { // deuxième minibus qui arrive
    e.bus2 = e.bus2Obj || (e.bus2Obj = nouveauBus(e.d.v));
    e.bus2.couleur = '#9fb3c8'; e.bus2.portes = [1, 0];
    e.bus2.x = lerp(460, 220, borne((p - 0.55) / 0.3, 0, 1));
  }
  const tap = Math.sin(ms * 0.012) > 0.3;
  const premier = e.flux[0] && e.flux[0].membres[0];
  switch (e.d.main) {
    case 'suivre': { const v = e.acteurs.find((a) => a.a > 0.5 && a.x > 0) || premier; if (v) main = { x: v.x + 6, y: v.y - 54, appui: tap }; break; }
    case 'porte': main = { x: d0.cx + 4, y: d0.y0 - 10, appui: tap }; break;
    case 'deuxportes': main = { x: (p < 0.5 ? d0 : d1).cx + 4, y: d0.y0 - 10, appui: tap }; break;
    case 'sieges': main = { x: g.sieges.bas[(Math.floor(ms / 500) % 2) + 6].x, y: g.yBas + 26, appui: tap }; break;
    case 'file': main = { x: d0.cx + 30 + 14 * 3, y: 196, appui: tap }; break;
    case 'etages': main = { x: g.sieges.haut[4].x, y: (Math.floor(ms / 900) % 2 ? g.rangY[1] : g.rangY[0]) + 26, appui: tap }; break;
    case 'escalier': { const s = g.segs.find((x) => x.t === 'D'); main = { x: s.x + s.w / 2, y: g.rangY[0] + 40, appui: tap }; break; }
    case 'pieces': main = { x: d0.cx + 20, y: d0.y1 - 30, appui: tap }; break;
    case 'train': main = { x: (p < 0.5 ? TRAIN_PORTE : d0.cx) + 4, y: 170, appui: tap }; break;
    case 'fleches': main = { x: 210 + (p < 0.5 ? 34 : -34), y: 236, appui: tap, fleches: true }; break;
    default: break;
  }
  e.main = main;
  e.payeur = e.d.main === 'pieces' && e.flux[0] && borne((p - 0.08) / 0.35, 0, 1) >= 1;
}

function dessinerTuto(ms) {
  const e = TUTO.etat; if (!e) return;
  animerDemo(e, ms - TUTO.debut);
  monde(ctxTuto, toileTuto);
  e.bus.payeur = e.payeur ? {} : null;
  dessinerScene(ctxTuto, { decor: e.decor, poteau: e.train ? null : e.g.portes[0].cx - 26, train: e.train, bus: e.bus, bus2: e.bus2, acteurs: e.acteurs }, ms);
  const c = ctxTuto;
  if (e.main && e.main.fleches) { // compteur dessiné (sans chiffre)
    c.fillStyle = 'rgba(255,255,255,.92)'; rr(c, 130, 214, 160, 44, 12); c.fill();
    c.fillStyle = '#ffe27a'; rr(c, 140, 219, 34, 34, 8); c.fill(); rr(c, 246, 219, 34, 34, 8); c.fill();
    c.fillStyle = '#1f2a44';
    c.beginPath(); c.moveTo(148, 230); c.lineTo(166, 230); c.lineTo(157, 244); c.fill();
    c.beginPath(); c.moveTo(254, 244); c.lineTo(272, 244); c.lineTo(263, 230); c.fill();
    const n = 3 + Math.floor(((ms - TUTO.debut) % 3600) / 900);
    for (let i = 0; i < n; i++) { c.beginPath(); c.arc(190 + (i % 4) * 11, 230 + Math.floor(i / 4) * 11, 4, 0, 7); c.fill(); }
  }
  if (e.main) dessinerMain(c, e.main.x, e.main.y, e.main.appui);
}

function montrerTuto(cle) {
  return new Promise((resoudre) => {
    const d = TUTOS[cle];
    TUTO.cle = cle; TUTO.etat = preparerDemo(cle); TUTO.etape = 0; TUTO.debut = performance.now();
    $('tuto-titre').textContent = cle === 'base' ? tr('tuto.titre') : tr('nouveau');
    const majEtape = () => {
      const k = d.etapes[TUTO.etape];
      $('tuto-texte').textContent = tr(k, { nom: tr('vehicule.' + (d.vehicule || d.v)), n: VEH[d.v].cap });
      $('tuto-points').innerHTML = d.etapes.length > 1 ? d.etapes.map((_, i) => '<i class="' + (i === TUTO.etape ? 'on' : '') + '"></i>').join('') : '';
    };
    majEtape();
    clearInterval(TUTO.minuteur);
    TUTO.minuteur = setInterval(() => { if (S.pause) return; if (TUTO.etape < d.etapes.length - 1) { TUTO.etape++; majEtape(); } }, 2400);
    $('voile-tuto').hidden = false;
    S.tutoOuvert = true;
    TUTO.fin = () => {
      clearInterval(TUTO.minuteur); TUTO.etat = null; TUTO.fin = null; S.tutoOuvert = false;
      $('voile-tuto').hidden = true; resoudre();
    };
    setTimeout(() => { try { $('b-compris').focus(); } catch (e) { /* rien */ } }, 30);
  });
}
function fermerTuto() { if (TUTO.fin) { SONS.clic(); TUTO.fin(); } }

/* =========================================================================
   BOUCLE D'AFFICHAGE
   ========================================================================= */
let derniere = 0;
function boucle(ms) {
  const dt = Math.min(50, ms - (derniere || ms)); derniere = ms;
  if (S.ecran === 'jeu' && !S.pause && !S.tutoOuvert) {
    majTaches(dt);
    majParticules(dt);
    for (const a of S.acteurs) if (a.marche) a.phase += dt * 0.018 * vitesse();
  }
  for (const a of TITRE.acteurs) a.phase += dt * 0.004;
  if (S.ecran === 'jeu') {
    monde(ctx, toile);
    dessinerScene(ctx, { decor: S.decor, poteau: S.poteau, train: S.train, bus: S.bus, bus2: S.bus2, acteurs: S.acteurs, particules: S.particules }, ms);
  } else if (S.ecran === 'titre') dessinerTitre(ms);
  if (TUTO.etat && !$('voile-tuto').hidden) {
    if (TUTO.etat.acteurs) for (const a of TUTO.etat.acteurs) if (a.marche) a.phase += dt * 0.018;
    dessinerTuto(ms);
  }
  requestAnimationFrame(boucle);
}

/* =========================================================================
   COMMANDES
   ========================================================================= */
function jouer() {
  SONS.clic();
  JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => {
      const n = borne(Math.round(Number(d && d.niveau) || 1), 1, NIVEAUX.length);
      P.debloque = Math.max(P.debloque, n);
      lancerNiveau(n - 1);
    },
    onNouvelle: () => lancerNiveau(0),
    onEffacer: () => { const son = P.son; P = defautP(); P.son = son; majSon(); lancerNiveau(0); },
  });
}

$('b-jouer').addEventListener('click', jouer);
$('b-lignes').addEventListener('click', () => { SONS.clic(); afficherEcran('lignes'); });
$('b-album').addEventListener('click', () => { SONS.clic(); afficherEcran('album'); });
document.querySelectorAll('.retour').forEach((b) => b.addEventListener('click', () => { SONS.clic(); afficherEcran('titre'); }));
document.querySelectorAll('.son').forEach((b) => b.addEventListener('click', basculerSon));
$('b-pause').addEventListener('click', () => { SONS.clic(); pauser(); });
$('b-reprendre').addEventListener('click', () => { SONS.clic(); reprendre(); });
$('b-recommencer').addEventListener('click', () => { SONS.clic(); lancerNiveau(S.niv); });
$('b-accueil').addEventListener('click', () => {
  SONS.clic();
  if (S.enJeu) enregistrer(S.niv + 1);
  S.enJeu = false; annulerTout(); fermerVoiles(); afficherEcran('titre');
});
$('b-klaxon').addEventListener('click', () => { if (!S.pause) klaxonner(); });
$('b-compris').addEventListener('click', (e) => { e.stopPropagation(); fermerTuto(); });
$('voile-tuto').addEventListener('click', fermerTuto);

document.addEventListener('keydown', (e) => {
  const code = e.code;
  if (!$('voile-tuto').hidden) { if (code === 'Enter' || code === 'Space' || code === 'Escape') { e.preventDefault(); fermerTuto(); } return; }
  if (S.ecran === 'jeu') {
    if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); if (S.pause) reprendre(); else pauser(); return; }
    if (S.pause || !$('voile-fin').hidden) return;
    if (code === 'KeyK') { klaxonner(); return; }
    const at = S.attente;
    if (!at) return;
    if (at.st.mode === 'compteur') {
      if (code === 'ArrowUp' || code === 'ArrowRight') { e.preventDefault(); at.changer(1); }
      else if (code === 'ArrowDown' || code === 'ArrowLeft') { e.preventDefault(); at.changer(-1); }
      else if (code === 'Enter' || code === 'NumpadEnter') { e.preventDefault(); at.valider(); }
    } else {
      const boutons = [...$('reponses').querySelectorAll('button')];
      const m = /^(Digit|Numpad)([1-3])$/.exec(code);
      if (m && boutons[Number(m[2]) - 1]) { e.preventDefault(); boutons[Number(m[2]) - 1].click(); return; }
      if (code === 'ArrowLeft' || code === 'ArrowRight') {
        e.preventDefault();
        const i = boutons.indexOf(document.activeElement);
        const j = i < 0 ? 0 : (i + (code === 'ArrowRight' ? 1 : boutons.length - 1)) % boutons.length;
        boutons[j].focus();
      }
    }
  } else if (S.ecran === 'titre' && (code === 'Enter' || code === 'Space') && document.activeElement === document.body) {
    e.preventDefault(); jouer();
  }
});

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') pauser(); });

JEL_SAVE.surFermeture(() => { if (S.enJeu) enregistrer(S.niv + 1); });

if (window.JEL_I18N && window.JEL_I18N.surChangement) window.JEL_I18N.surChangement(() => { majSon(); if (S.ecran === 'jeu') majHud(); if (S.ecran === 'lignes') construireLignes(); if (S.ecran === 'album') construireAlbum(); });

/* Démarrage */
P = chargerP();
majSon();
preparerTitre();
window.addEventListener('resize', () => { ajuster(toile); ajuster(toileTitre); });
requestAnimationFrame(boucle);
</script>
