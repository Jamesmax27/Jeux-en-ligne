    fer: (on) => `<svg viewBox="0 0 24 24" class="${on ? '' : 'perdu'}"><path d="M6 21v-9a6 6 0 0 1 12 0v9" fill="none" stroke="#8a6d3b" stroke-width="4.4" stroke-linecap="round"/><g fill="#5b4520"><circle cx="6" cy="14" r=".9"/><circle cx="6" cy="18" r=".9"/><circle cx="18" cy="14" r=".9"/><circle cx="18" cy="18" r=".9"/></g></svg>`,
    noeud: '<svg class="noeud-svg" viewBox="0 0 40 40"><path d="M6 14c8 6 20 6 28 0M6 26c8-6 20-6 28 0" stroke="#6b4423" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="20" cy="20" r="7" fill="#8b5a2b" stroke="#5a3a1a" stroke-width="2"/><path d="M15 17c3 2 7 2 10 0M15 23c3-2 7-2 10 0" stroke="#5a3a1a" stroke-width="1.6" fill="none"/></svg>',
    sabot: '<svg class="sabot" viewBox="0 0 20 20"><path d="M4 18V10a6 6 0 0 1 12 0v8" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><path d="M4 18V10a6 6 0 0 1 12 0v8" fill="none" stroke="#5b3a22" stroke-width="1.6" stroke-linecap="round"/></svg>',
    brille: '<svg class="brille" viewBox="0 0 12 12"><path d="M6 0l1.5 4.5L12 6 7.5 7.5 6 12 4.5 7.5 0 6l4.5-1.5z" fill="#fff"/></svg>',
    main: '<svg viewBox="0 0 54 54"><path d="M20 6c2.5 0 4 2 4 4v15l2-.5c0-2.5 1.5-4 3.6-4s3.4 1.6 3.4 3.6l1.6-.3c.6-2 2-3 3.8-3 2 0 3.6 1.7 3.6 3.8v1c.6-1.2 1.8-2 3.2-2 2 0 3.4 1.6 3.4 3.6V38c0 7-5 12-12 12h-6c-4 0-7-2-9-5l-9-13c-1.2-1.8-.7-4 1-5 1.7-1 3.6-.6 4.8 1L16 31V10c0-2.2 1.6-4 4-4z" fill="#fff" stroke="#3b2a20" stroke-width="2.2" stroke-linejoin="round"/></svg>',
    porte: '<svg viewBox="0 0 30 30"><path d="M3 28V10h24v18" fill="none" stroke="#fff" stroke-width="3"/><path d="M3 10l12-6 12 6" fill="#e5484d"/><path d="M3 15h24M3 20h24" stroke="#fff" stroke-width="2"/><path d="M3 15h24M3 20h24" stroke="#e5484d" stroke-width="2" stroke-dasharray="3 3"/></svg>',
    concours: (i) => [
      '<svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="13" fill="#a6d98a"/><path d="M5 18c3-6 6-6 9 0 3-6 6-6 9 0" stroke="#3f9d4a" stroke-width="2.4" fill="none"/><circle cx="20" cy="8" r="3" fill="#f5c542"/></svg>',
      '<svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="13" fill="#e7c9a0"/><path d="M5 12l9-6 9 6v10H5z" fill="#a0522d"/><rect x="11" y="15" width="6" height="7" fill="#5a3a1a"/></svg>',
      '<svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="13" fill="#cdeaff"/><path d="M5 20h18M8 12v8M20 12v8" stroke="#fff" stroke-width="3"/><path d="M6 15h16" stroke="#e5484d" stroke-width="3" stroke-dasharray="4 3"/></svg>',
      '<svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="13" fill="#3d4a86"/><path d="M8 8h12v4a6 6 0 0 1-12 0z" fill="#f5c542"/><path d="M14 18v4M10 22h8" stroke="#f5c542" stroke-width="2.6" stroke-linecap="round"/></svg>',
    ][i],
  };

  // Flot de champion (rosette). couleur : couleur du centre ; grand : flot de concours.
  function svgFlot(couleur, grand) {
    const plis = [];
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      plis.push(`<ellipse cx="${30 + Math.cos(a) * 15}" cy="${28 + Math.sin(a) * 15}" rx="7" ry="4" transform="rotate(${(a * 180) / Math.PI} ${30 + Math.cos(a) * 15} ${28 + Math.sin(a) * 15})" fill="${couleur}" stroke="rgba(0,0,0,.18)" stroke-width="1"/>`);
    }
    return `<svg class="flot ${grand ? 'grand' : ''}" viewBox="0 0 60 78"><path d="M20 40l-6 36 9-6 5 7 4-36z" fill="${couleur}" stroke="rgba(0,0,0,.2)"/><path d="M40 40l6 36-9-6-5 7-4-36z" fill="${couleur}" stroke="rgba(0,0,0,.2)"/>${plis.join('')}<circle cx="30" cy="28" r="11" fill="#fff8e1" stroke="${couleur}" stroke-width="3"/>${grand ? '<path d="M30 21l2 4.3 4.7.6-3.4 3.2.9 4.6-4.2-2.3-4.2 2.3.9-4.6-3.4-3.2 4.7-.6z" fill="#f5c542"/>' : '<circle cx="30" cy="28" r="4" fill="' + couleur + '"/>'}</svg>`;
  }
  const COULEURS_FLOTS = ['#cd7f32', '#a8b4c0', '#f2b705'];               // bronze, argent, or (selon les étoiles)
  const COULEURS_CONCOURS = ['#22a447', '#3b82f6', '#e5484d', '#7c3aed']; // pré, manège, carrière, grand prix

  // Points de la crête de l'encolure (crinière) dans le dessin de Pépite.
  const CRETE = [[126, 44], [144, 52], [159, 66], [171, 83], [180, 102], [187, 122], [192, 142], [195, 162]];
  function pointsCrete(n) {
    const longueurs = [0];
    for (let i = 1; i < CRETE.length; i++) longueurs.push(longueurs[i - 1] + Math.hypot(CRETE[i][0] - CRETE[i - 1][0], CRETE[i][1] - CRETE[i - 1][1]));
    const total = longueurs[longueurs.length - 1];
    const res = [];
    for (let k = 0; k < n; k++) {
      const d = total * (0.06 + 0.88 * (n === 1 ? 0.5 : k / (n - 1)));
      let i = 1; while (i < CRETE.length - 1 && longueurs[i] < d) i++;
      const f = (d - longueurs[i - 1]) / (longueurs[i] - longueurs[i - 1]);
      const x = CRETE[i - 1][0] + (CRETE[i][0] - CRETE[i - 1][0]) * f;
      const y = CRETE[i - 1][1] + (CRETE[i][1] - CRETE[i - 1][1]) * f;
      const angle = Math.atan2(CRETE[i][1] - CRETE[i - 1][1], CRETE[i][0] - CRETE[i - 1][0]) * 180 / Math.PI;
      res.push({ x, y, angle });
    }
    return res;
  }

  function pompon(cx, cy, c, r) {
    if (!c) return '';
    const couleurs = c === 'arc' ? ['#ef4444', '#f59e0b', '#facc15', '#22c55e', '#3b82f6', '#8b5cf6'] : [c, c, c, c, c, c];
    let s = '';
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      s += `<circle cx="${cx + Math.cos(a) * r * 0.75}" cy="${cy + Math.sin(a) * r * 0.75}" r="${r * 0.6}" fill="${couleurs[i]}" stroke="rgba(0,0,0,.12)"/>`;
    }
    return s + `<circle cx="${cx}" cy="${cy}" r="${r * 0.65}" fill="${c === 'arc' ? '#fff' : c}" stroke="rgba(0,0,0,.12)"/>`;
  }

  // Pépite, tête et encolure, tournée vers la gauche.
  // o : { robe, ruban, pompon, places (nombre de tresses), pleines (tableau de booléens), nouvelle (indice qui pousse), flot }
  function svgPepite(o) {
    const R = ROBES.find((r) => r.id === o.robe) || ROBES[0];
    const ruban = (RUBANS.find((r) => r.id === o.ruban) || RUBANS[0]).c;
    const pc = (POMPONS.find((p) => p.id === o.pompon) || POMPONS[0]).c;
    const pts = pointsCrete(o.places);
    let tresses = '';
    pts.forEach((p, i) => {
      const pleine = o.pleines[i];
      const classe = 'tresse' + (pleine ? ' pleine' : '') + (o.nouvelle === i ? ' pousse' : '');
      let corps;
      if (pleine) {
        corps = `<g class="${classe}" data-i="${i}"><circle cx="0" cy="-8" r="8.5" fill="${R.crin}" stroke="rgba(0,0,0,.25)" stroke-width="1.2"/>`
          + `<path d="M-5 -11q5 3 10 0M-5 -6q5 3 10 0" stroke="rgba(255,255,255,.35)" stroke-width="1.3" fill="none"/>`
          + `<path d="M0 -15l-7 -6 1 8zM0 -15l7 -6 -1 8z" fill="${ruban}" stroke="rgba(0,0,0,.2)" stroke-width=".8"/><circle cx="0" cy="-15" r="2.4" fill="${ruban}"/>`
          + (o.brille ? `<circle cx="5" cy="-12" r="1.6" fill="#fff"/>` : '') + '</g>';
      } else {
        corps = `<g class="${classe}" data-i="${i}"><path d="M-6 -2q-4 -12 2 -20M0 -2q-2 -12 5 -19M5 -2q2 -10 8 -15" stroke="${R.crin}" stroke-width="3.2" fill="none" stroke-linecap="round"/></g>`;
      }
      tresses += `<g transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${p.angle.toFixed(1)}) scale(${o.echelle || 1})">${corps}</g>`;
    });
    const taches = R.taches ? `<path d="M150 120c10-8 26-4 30 10s-6 30-20 28-20-24-10-38z" fill="${R.taches}"/><path d="M108 58c8-2 14 6 10 12s-14 4-14-2 0-9 4-10z" fill="${R.taches}"/>` : '';
    const flot = o.flot ? `<g transform="translate(118 120) scale(.75)">${svgFlot(o.flot, true).replace('<svg class="flot grand" viewBox="0 0 60 78">', '').replace('</svg>', '')}</g>` : '';
    return `<svg viewBox="0 0 220 180" aria-hidden="true">
      <path d="M126 44C150 52 176 80 188 116C194 136 196 158 196 180" stroke="${R.crin}" stroke-width="13" fill="none" stroke-linecap="round"/>
      <path d="M204 180C200 140 188 104 162 74C150 60 138 48 122 42C108 37 94 41 84 51L40 99C30 111 33 127 48 130C60 133 71 127 79 117C94 121 106 129 112 141C118 154 119 168 117 180Z" fill="${R.corps}"/>
      ${taches}
      <path d="M79 117C94 121 106 129 112 141C118 154 119 168 117 180" stroke="${R.ombre}" stroke-width="3" fill="none"/>
      <circle cx="100" cy="100" r="17" fill="${R.ombre}" opacity=".45"/>
      <path d="M92 52L58 98L65 102L98 58Z" fill="#fff" opacity=".85"/>
      <ellipse cx="52" cy="116" rx="18" ry="13" fill="#000" opacity=".1"/>
      <ellipse cx="46" cy="110" rx="3.6" ry="5.6" fill="#2a1a12" transform="rotate(-20 46 110)"/>
      <path d="M45 126Q56 125 66 120" stroke="#2a1a12" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M128 46L134 14L144 44Z" fill="${R.ombre}"/>
      <path d="M112 44L114 12L127 40Z" fill="${R.corps}" stroke="${R.ombre}" stroke-width="2" stroke-linejoin="round"/>
      <path d="M116 38L117 20L123 37Z" fill="#f4b6a6"/>
      <ellipse cx="97" cy="66" rx="7" ry="8" fill="#2a1a12"/>
      <circle cx="95" cy="63" r="2.4" fill="#fff"/>
      <path d="M89 58Q97 52 105 59" stroke="#2a1a12" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M118 44q-6 6-14 10M122 44q-4 9-10 14M120 44q-9 4-18 4" stroke="${R.crin}" stroke-width="4" fill="none" stroke-linecap="round"/>
      ${pc ? pompon(121, 38, pc, 7) : ''}
      ${tresses}
      ${flot}
    </svg>`;
  }

  // Le poulain farceur (petit poney de profil).
  const SVG_POULAIN = '<svg viewBox="0 0 80 64"><path d="M18 26c0-8 8-12 22-12s22 4 22 12-6 12-22 12-22-4-22-12z" fill="#d9a066"/><path d="M58 22c2-8 6-14 12-15 4 0 6 4 5 8l-3 8c-1 3-4 4-6 3l-6-2z" fill="#d9a066"/><path d="M68 7l1-6 4 6z" fill="#b5793f"/><circle cx="71" cy="12" r="1.6" fill="#2a1a12"/><path d="M62 14c-3 2-5 6-5 10" stroke="#7a4a2a" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M18 24c-6 0-10 4-10 10" stroke="#7a4a2a" stroke-width="3.4" fill="none" stroke-linecap="round"/><g stroke="#b5793f" stroke-width="5" stroke-linecap="round"><path d="M26 36l-3 22M34 37l2 21M48 37l-2 21M56 35l4 22"/></g><circle cx="40" cy="22" r="4" fill="#fff" opacity=".6"/></svg>';

  // Décor des concours (scène du jeu) : pré, manège, carrière, grand prix.
  function decorScene(c) {
    const barriere = (y, couleur) => `<g stroke="${couleur}" stroke-width="4"><path d="M0 ${y}h400M0 ${y + 12}h400"/>${Array.from({ length: 11 }, (_, i) => `<path d="M${i * 40 + 6} ${y - 6}v26"/>`).join('')}</g>`;
    if (c === 0) return `<circle cx="345" cy="28" r="16" fill="#ffe066"/><path d="M0 78c60-20 120-20 200-6s140 10 200-6v70H0z" fill="#8cc874"/>${barriere(86, '#ffffff')}<g fill="#fff" opacity=".9"><ellipse cx="70" cy="30" rx="22" ry="8"/><ellipse cx="250" cy="22" rx="18" ry="6"/></g><g fill="#e85d75"><circle cx="40" cy="118" r="3"/><circle cx="330" cy="114" r="3"/><circle cx="300" cy="122" r="3"/></g>`;
    if (c === 1) return `<g stroke="#a0703c" stroke-width="6"><path d="M20 0v80M120 0v80M280 0v80M380 0v80"/></g><path d="M0 8h400" stroke="#8a5a2b" stroke-width="10"/><g fill="#fff3c4"><circle cx="70" cy="22" r="6"/><circle cx="200" cy="22" r="6"/><circle cx="330" cy="22" r="6"/></g>${barriere(84, '#c48a4a')}`;
    if (c === 2) return `<circle cx="60" cy="26" r="14" fill="#ffe066"/><path d="M0 70l60-22 70 18 80-26 90 22 100-14v20H0z" fill="#9fc9e8"/>${barriere(80, '#ffffff')}<g><path d="M60 118v-22M110 118v-22" stroke="#fff" stroke-width="4"/><path d="M58 102h54" stroke="#e5484d" stroke-width="5" stroke-dasharray="8 6"/><path d="M290 118v-24M340 118v-24" stroke="#fff" stroke-width="4"/><path d="M288 100h54" stroke="#3b82f6" stroke-width="5" stroke-dasharray="8 6"/></g>`;
    return `<g fill="#fff" opacity=".8"><circle cx="40" cy="20" r="1.5"/><circle cx="120" cy="12" r="1.2"/><circle cx="210" cy="26" r="1.5"/><circle cx="300" cy="10" r="1.2"/><circle cx="370" cy="30" r="1.5"/></g><g fill="#ffe7a3"><path d="M30 0l14 40h-28z" opacity=".25"/><path d="M370 0l14 40h-28z" opacity=".25"/></g>${barriere(80, '#ffffff')}<g fill="#e5484d"><path d="M0 60l20-8 20 8 20-8 20 8 20-8 20 8 20-8 20 8 20-8 20 8 20-8 20 8 20-8 20 8 20-8 20 8 20-8 20 8 20-8 20 8v4H0z" opacity=".9"/></g>`;
  }

  // Décor de l'écran titre (sert aussi de jaquette : aucun texte).
  function decorTitre() {
    const flots = '';
    return `<circle cx="330" cy="70" r="34" fill="#ffe066"/><circle cx="330" cy="70" r="46" fill="#ffe066" opacity=".25"/>
      <g fill="#fff"><ellipse cx="80" cy="60" rx="40" ry="12"/><ellipse cx="110" cy="50" rx="26" ry="12"/><ellipse cx="250" cy="120" rx="34" ry="9"/></g>
      <path d="M0 330c80-40 170-40 240-14s120 14 160-10v394H0z" fill="#a6d98a"/>
      <g stroke="#fff" stroke-width="7"><path d="M0 352h400M0 380h400"/>${Array.from({ length: 9 }, (_, i) => `<path d="M${i * 50 + 10} 336v60"/>`).join('')}</g>
      <g transform="translate(300 250)"><path d="M0 0v80M70 0v80" stroke="#fff" stroke-width="6"/><path d="M-4 30h78" stroke="#e5484d" stroke-width="9" stroke-dasharray="14 10"/><path d="M-4 55h78" stroke="#3b82f6" stroke-width="9" stroke-dasharray="14 10"/></g>
      ${flots}
      <g fill="#e85d75"><circle cx="40" cy="640" r="6"/><circle cx="360" cy="620" r="6"/><circle cx="330" cy="660" r="5"/></g><g fill="#fff59d"><circle cx="70" cy="670" r="5"/><circle cx="380" cy="680" r="5"/></g>`;
  }

  /* ======================================================================
     Écrans et textes
     ====================================================================== */
  const $ = (id) => document.getElementById(id);
  const app = $('app');
  let ecranCourant = 'ecran-titre';
  function montrer(id) {
    document.querySelectorAll('.ecran').forEach((e) => e.classList.toggle('actif', e.id === id));
    ecranCourant = id;
  }

  function majSon() {
    document.querySelectorAll('.bouton-son').forEach((b) => {
      b.innerHTML = prog.son ? ICONES.sonOn : ICONES.sonOff;
      const cle = prog.son ? 'son.couper' : 'son.remettre';
      b.setAttribute('aria-label', t(cle)); b.title = t(cle);
      b.setAttribute('aria-pressed', prog.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    prog.son = !prog.son;
    try { localStorage.setItem('fmg-criniere-son', prog.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    retoucheSauvegarde({ options: { son: prog.son } });
    majSon(); SONS.clic();
  }

  function dessinerTitre() {
    $('titre-decor').innerHTML = decorTitre();
    $('titre-flots').innerHTML = COULEURS_CONCOURS.map((c) => svgFlot(c, true)).join('');
    $('titre-pepite').innerHTML = svgPepite({ robe: prog.robe, ruban: prog.ruban, pompon: prog.pompon, places: 7, pleines: [1, 1, 1, 1, 1, 1, 1], brille: true });
  }

  function nomConcours(i) { return t('concours.' + (i + 1)); }

  function dessinerNiveaux() {
    const liste = $('liste-niveaux');
    liste.innerHTML = '';
    for (let c = 0; c < CONCOURS; c++) {
      const bloc = document.createElement('div');
      bloc.className = 'concours-bloc';
      const h = document.createElement('h3');
      h.innerHTML = ICONES.concours(c);
      h.append(document.createTextNode(nomConcours(c)));
      bloc.append(h);
      const g = document.createElement('div');
      g.className = 'grille-niveaux';
      for (let k = 0; k < 5; k++) {
        const n = c * 5 + k + 1;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'case-niveau';
        const ouvert = n <= prog.debloque;
        if (!ouvert) {
          b.classList.add('ferme'); b.disabled = true;
          b.innerHTML = ICONES.cadenas;
          b.setAttribute('aria-label', t('niveau.ferme', { n }));
        } else {
          const e = prog.etoiles[n - 1] || 0;
          b.textContent = nb(n);
          const m = document.createElement('span');
          m.className = 'etoiles-mini';
          m.innerHTML = [0, 1, 2].map((i) => ICONES.etoile(i < e)).join('');
          b.append(m);
          b.setAttribute('aria-label', t('niveau.aria', { n }) + ', ' + t('etoiles', { n: e }));
          b.addEventListener('click', () => { SONS.clic(); lancerNiveau(n); });
        }
        g.append(b);
      }
      bloc.append(g);
      liste.append(bloc);
    }
  }

  function dessinerVestiaire() {
    const total = totalEtoiles();
    $('vestiaire-pepite').innerHTML = svgPepite({ robe: prog.robe, ruban: prog.ruban, pompon: prog.pompon, places: 5, pleines: [1, 1, 1, 1, 1] });
    $('vestiaire-info').textContent = t('vestiaire.etoiles', { n: total, max: NIVEAUX.length * 3 });
    const c = $('vestiaire-contenu');
    c.innerHTML = '';
    const section = (cleTitre, liste, champ, pastille) => {
      const h = document.createElement('h3'); h.className = 'section-titre'; h.textContent = t(cleTitre); c.append(h);
      const r = document.createElement('div'); r.className = 'rangee-choix'; c.append(r);
      liste.forEach((obj) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'choix';
        const ouvert = total >= obj.etoiles;
        const nom = t(champ + '.' + obj.id);
        const p = document.createElement('span'); p.className = 'pastille'; pastille(p, obj); b.append(p);
        const l = document.createElement('span');
        l.textContent = ouvert ? nom : t('vestiaire.verrou', { n: obj.etoiles });
        b.append(l);
        if (!ouvert) { b.classList.add('verrou'); b.disabled = true; b.setAttribute('aria-label', nom + ' : ' + t('vestiaire.verrou', { n: obj.etoiles })); }
        if (prog[champ] === obj.id) { b.classList.add('actif'); b.setAttribute('aria-pressed', 'true'); } else b.setAttribute('aria-pressed', 'false');
        b.addEventListener('click', () => {
          prog[champ] = obj.id; SONS.clic();
          retoucheSauvegarde({ apparence: { robe: prog.robe, ruban: prog.ruban, pompon: prog.pompon } });
          dessinerVestiaire(); dessinerTitre();
        });
        r.append(b);
      });
    };
    section('vestiaire.robes', ROBES, 'robe', (p, o) => { p.style.background = o.corps; p.style.boxShadow = `inset -6px 0 0 ${o.crin}`; });
    section('vestiaire.rubans', RUBANS, 'ruban', (p, o) => { p.style.background = o.c; });
    section('vestiaire.pompons', POMPONS, 'pompon', (p, o) => {
      if (!o.c) { p.style.background = 'transparent'; p.style.borderStyle = 'dashed'; }
      else p.style.background = o.c === 'arc' ? 'conic-gradient(#ef4444, #f59e0b, #facc15, #22c55e, #3b82f6, #8b5cf6, #ef4444)' : o.c;
    });
    // Vitrine des flots
    const h = document.createElement('h3'); h.className = 'section-titre'; h.textContent = t('vestiaire.flots'); c.append(h);
    const v = document.createElement('div'); v.className = 'vitrine'; v.setAttribute('role', 'img');
    let gagnes = 0;
    for (let k = 0; k < CONCOURS; k++) {
      const fait = [0, 1, 2, 3, 4].every((j) => (prog.etoiles[k * 5 + j] || 0) > 0);
      const s = document.createElement('span'); s.innerHTML = svgFlot(COULEURS_CONCOURS[k], true);
      if (!fait) s.firstChild.classList.add('vide'); else gagnes++;
      v.append(s);
    }
    for (let n = 0; n < NIVEAUX.length; n++) {
      const e = prog.etoiles[n] || 0;
      const s = document.createElement('span'); s.innerHTML = svgFlot(COULEURS_FLOTS[Math.max(0, e - 1)], false);
      if (!e) s.firstChild.classList.add('vide'); else gagnes++;
      v.append(s);
    }
    v.setAttribute('aria-label', t('vestiaire.flotsAria', { n: gagnes, max: NIVEAUX.length + CONCOURS }));
    c.append(v);
  }

  /* ======================================================================
     Partie
     ====================================================================== */
  const J = {
    n: 1, def: null, l: 0, h: 0, cases: [], mots: [], chemin: [], score: 0, fers: FERS_MAX,
    enJeu: false, pause: false, fini: false, temps: 0, tempsMax: 0, poulainT: 0, paires: [], curseur: 0,
    dernierTic: -1, intro: false, glisse: false, deplace: false, taille: 48, ecart: 6,
  };

  function aleatoire(n) { return Math.floor(Math.random() * n); }
  function melanger(a) { for (let i = a.length - 1; i > 0; i--) { const j = aleatoire(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function voisins(i, l, h) {
    const x = i % l, y = Math.floor(i / l), r = [];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < l && ny < h) r.push(ny * l + nx);
    }
    return r;
  }
  function adjacents(a, b, l) { return a !== b && Math.abs((a % l) - (b % l)) <= 1 && Math.abs(Math.floor(a / l) - Math.floor(b / l)) <= 1; }

  // Place chaque mot en chemin de cases voisines libres (recherche avec retour en arrière).
  function placerMots(def) {
    const l = def.l, h = def.h, total = l * h;
    const textes = def.mots.map((m) => (typeof m === 'string' ? m : m.m));
    const ordre = textes.map((_, i) => i).sort((a, b) => textes[b].length - textes[a].length);
    for (let essai = 0; essai < 600; essai++) {
      const occupe = new Array(total).fill(-1);
      const chemins = [];
      let ok = true;
      for (const w of ordre) {
        const mot = textes[w];
        let trouve = null, pas = 0;
        const dfs = (pos, k, chemin) => {
          if (++pas > 3000) return false;
          chemin.push(pos); occupe[pos] = w;
          if (k === mot.length - 1) { trouve = chemin.slice(); return true; }
          for (const v of melanger(voisins(pos, l, h))) if (occupe[v] === -1 && dfs(v, k + 1, chemin)) return true;
          chemin.pop(); occupe[pos] = -1;
          return false;
        };
        for (const depart of melanger([...Array(total).keys()])) {
          if (occupe[depart] !== -1) continue;
          if (dfs(depart, 0, [])) break;
          if (pas > 3000) break;
        }
        if (!trouve) { ok = false; break; }
        chemins[w] = trouve;
      }
      if (ok) return chemins;
    }
    return null;
  }

  function preparerGrille(def) {
    let chemins = placerMots(def);
    // Repli (jamais vu en pratique) : une rangée de plus jusqu'à ce que tous les mots tiennent.
    while (!chemins) { def = Object.assign({}, def, { h: def.h + 1 }); chemins = placerMots(def); }
    const l = def.l, h = def.h;
    const cases = [];
    for (let i = 0; i < l * h; i++) cases.push({ i, lettre: LETTRES_REMPLISSAGE[aleatoire(LETTRES_REMPLISSAGE.length)], mot: -1, trouve: false, noeud: false, dore: false, melange: -1, couleur: COULEURS_RUBANS[aleatoire(COULEURS_RUBANS.length)] });
    const mots = def.mots.map((m, w) => ({ texte: typeof m === 'string' ? m : m.m, img: typeof m !== 'string' && m.img, chemin: chemins[w], trouve: false, aide: 0 }));
    mots.forEach((m, w) => m.chemin.forEach((c, k) => { cases[c].lettre = m.texte[k]; cases[c].mot = w; }));
    // Nœuds : jamais sur le premier mot ; un nœud du mot k touche toujours une case d'un mot plus ancien (ordre de résolution garanti).
    let aPoser = def.noeuds || 0;
    const ordreMots = melanger(mots.map((_, w) => w).filter((w) => w > 0));
    for (let tour = 0; tour < 2 && aPoser > 0; tour++) {
      for (const w of ordreMots) {
        if (aPoser <= 0) break;
        const deja = mots[w].chemin.filter((c) => cases[c].noeud).length;
        if (deja >= (tour === 0 ? 1 : 2) || deja >= mots[w].chemin.length - 1) continue;
        const candidats = mots[w].chemin.filter((c) => !cases[c].noeud && voisins(c, l, h).some((v) => cases[v].mot >= 0 && cases[v].mot < w));
        if (!candidats.length) continue;
        cases[candidats[aleatoire(candidats.length)]].noeud = true;
        aPoser--;
      }
    }
    // Rubans dorés : au plus un par mot, jamais noué.
    let dores = def.dores || 0;
    for (const w of melanger(mots.map((_, k) => k))) {
      if (dores <= 0) break;
      const libres = mots[w].chemin.filter((c) => !cases[c].noeud);
      if (!libres.length) continue;
      cases[libres[aleatoire(libres.length)]].dore = true;
      dores--;
    }
    return { cases, mots, l, h };
  }

  function lancerNiveau(n) {
    n = Math.max(1, Math.min(NIVEAUX.length, n | 0));
    const def = NIVEAUX[n - 1];
    const g = preparerGrille(def);
    Object.assign(J, {
      n, def, l: g.l, h: g.h, cases: g.cases, mots: g.mots, chemin: [], score: 0, fers: FERS_MAX,
      enJeu: true, pause: false, fini: false, temps: 0, tempsMax: def.temps || 0, paires: [], curseur: 0, dernierTic: -1,
      poulainT: def.poulain ? def.poulain.tous * 0.7 : 0, glisse: false, deplace: false, motsSansAide: 0,
    });
    fermerVoiles();
    montrer('ecran-jeu');
    const c = Math.floor((n - 1) / 5);
    $('scene').className = 'scene c' + (c + 1);
    $('scene-decor').innerHTML = decorScene(c);
    $('poulain').innerHTML = SVG_POULAIN; $('poulain').classList.remove('trotte');
    $('chrono').classList.toggle('visible', !!J.tempsMax);
    $('chrono-porte').innerHTML = ICONES.porte.replace(/^<svg[^>]*>/, '').replace('</svg>', '');
    $('chrono-tete').innerHTML = svgPepite({ robe: prog.robe, ruban: prog.ruban, pompon: 'aucun', places: 0, pleines: [] });
    document.documentElement.style.setProperty('--ruban', (RUBANS.find((r) => r.id === prog.ruban) || RUBANS[0]).c);
    majEntete(); dessinerPepiteJeu(-1); dessinerMots(); construirePlateau(); majFers(); majChrono(); majCheminUI();
    message('');
    // Présentation des nouveautés (une fois), puis tutoriel du niveau 1.
    const nouveautes = [];
    if (def.tuto) nouveautes.push('tuto');
    if (def.dores && !prog.vus.dore) nouveautes.push('dore');
    if (def.noeuds && !prog.vus.noeud) nouveautes.push('noeud');
    if (def.mots.some((m) => typeof m !== 'string') && !prog.vus.image) nouveautes.push('image');
    if (def.poulain && !prog.vus.poulain) nouveautes.push('poulain');
    if (def.temps && !prog.vus.chrono) nouveautes.push('chrono');
    presenter(nouveautes);
  }

  function majEntete() {
    $('jeu-niveau').textContent = t('jeu.niveau', { n: J.n, max: NIVEAUX.length });
    $('jeu-concours').textContent = nomConcours(Math.floor((J.n - 1) / 5));
    $('jeu-score').textContent = t('jeu.score', { n: J.score });
  }

  function dessinerPepiteJeu(nouvelle) {
    $('pepite-jeu').innerHTML = svgPepite({ robe: prog.robe, ruban: prog.ruban, pompon: prog.pompon, places: J.mots.length, pleines: J.mots.map((m) => m.trouve), nouvelle, brille: true, echelle: J.mots.length <= 4 ? 1.45 : J.mots.length <= 5 ? 1.3 : 1.15 });
  }

  function dessinerMots() {
    const z = $('liste-mots');
    z.innerHTML = '';
    J.mots.forEach((m, w) => {
      const d = document.createElement('div');
      d.className = 'mot' + (m.trouve ? ' trouve' : '');
      d.setAttribute('role', 'listitem');
      d.dataset.w = w;
      if (m.img && !m.trouve) {
        d.innerHTML = IMAGES[m.texte];
        const cases = document.createElement('span'); cases.className = 'cases';
        for (let k = 0; k < m.texte.length; k++) { const s = document.createElement('span'); s.textContent = k < m.aide ? m.texte[k] : ''; cases.append(s); }
        d.append(cases);
        d.setAttribute('aria-label', t('mot.image', { n: m.texte.length }));
      } else {
        if (m.img) d.innerHTML = IMAGES[m.texte];
        d.append(document.createTextNode(m.texte));
        d.setAttribute('aria-label', t(m.trouve ? 'mot.trouve' : 'mot.chercher', { mot: m.texte }));
      }
      z.append(d);
    });
  }

  // Taille des rubans d'après la place disponible.
  function dimensionner() {
    const zone = $('zone-grille');
    const W = zone.clientWidth - 12, H = zone.clientHeight - 14;
    if (W <= 0 || H <= 0) return;
    const ecart = J.l >= 6 ? 6 : 8;
    let taille = Math.floor(Math.min((W - ecart * (J.l - 1)) / J.l, (H - ecart * (J.h - 1)) / J.h, 78));
    taille = Math.max(34, taille);
    J.taille = taille; J.ecart = ecart;
    const p = $('plateau');
    p.style.gridTemplateColumns = `repeat(${J.l}, ${taille}px)`;
    p.style.gridAutoRows = taille + 'px';
    p.style.gap = ecart + 'px';
    p.style.fontSize = Math.round(taille * 0.5) + 'px';
    dessinerFil();
  }

  function construirePlateau() {
    const p = $('plateau');
    p.querySelectorAll('.ruban').forEach((b) => b.remove());
    J.cases.forEach((c) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'ruban'; b.tabIndex = -1;
      b.dataset.i = c.i;
      p.append(b);
      c.el = b;
      majCase(c);
    });
    dimensionner();
  }

  function majCase(c) {
    const b = c.el; if (!b) return;
    b.className = 'ruban' + (c.trouve ? ' trouve' : '') + (c.noeud ? ' noeud' : '') + (c.dore && !c.trouve ? ' dore' : '') + (c.melange >= 0 ? ' melange' : '')
      + (J.chemin.includes(c.i) ? ' chemin' : '') + (J.curseur === c.i && J.clavier ? ' curseur' : '') + (c.aide && !c.trouve ? ' aide' : '');
    b.style.setProperty('--c', c.couleur);
    b.textContent = c.lettre;
    if (c.noeud) b.insertAdjacentHTML('beforeend', ICONES.noeud);
    if (c.melange >= 0) b.insertAdjacentHTML('beforeend', ICONES.sabot);
    if (c.dore && !c.trouve) b.insertAdjacentHTML('beforeend', ICONES.brille);
    const cle = c.noeud ? 'ruban.noue' : c.melange >= 0 ? 'ruban.melange' : c.trouve ? 'ruban.tresse' : 'ruban.aria';
    b.setAttribute('aria-label', t(cle, { lettre: c.lettre }));
  }
  function majToutes() { J.cases.forEach(majCase); }

  function majFers() {
    const f = $('fers');
    f.innerHTML = Array.from({ length: FERS_MAX }, (_, i) => ICONES.fer(i < J.fers)).join('');
    f.setAttribute('aria-label', t('jeu.patience', { n: J.fers, max: FERS_MAX }));
  }

  function majChrono() {
    if (!J.tempsMax) return;
    const reste = Math.max(0, J.tempsMax - J.temps);
    const f = Math.min(1, J.temps / J.tempsMax);
    $('chrono-rempli').style.width = (f * 100) + '%';
    $('chrono-tete').style.left = (f * 100) + '%';
    $('chrono').classList.toggle('urgent', reste <= 20);
    const piste = $('chrono-piste');
    piste.setAttribute('aria-valuenow', Math.round(f * 100));
    piste.setAttribute('aria-valuetext', t('jeu.reste', { n: Math.ceil(reste) }));
  }

  function message(txt, genre) {
    const m = $('message');
    m.textContent = txt;
    m.className = 'message' + (genre ? ' ' + genre : '');
    clearTimeout(message.minuteur);
    if (txt) message.minuteur = setTimeout(() => { if (m.textContent === txt) m.textContent = ''; }, 2600);
  }

  /* ----- Chemin du doigt ----- */
  function centre(i) {
    const x = i % J.l, y = Math.floor(i / J.l);
    return { x: x * (J.taille + J.ecart) + J.taille / 2, y: y * (J.taille + J.ecart) + J.taille / 2 };
  }
  function dessinerFil() {
    const s = $('fil');
    if (J.chemin.length < 2) { s.innerHTML = ''; return; }
    const pts = J.chemin.map((i) => { const c = centre(i); return c.x.toFixed(1) + ',' + c.y.toFixed(1); }).join(' ');
    s.innerHTML = `<polyline points="${pts}" fill="none" stroke="#fff" stroke-width="${Math.round(J.taille * 0.3)}" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><polyline points="${pts}" fill="none" stroke="var(--ruban)" stroke-width="${Math.round(J.taille * 0.16)}" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>`;
  }
  function majCheminUI() {
    const l = $('lettres-en-cours');
    const mot = J.chemin.map((i) => J.cases[i].lettre).join('');
    l.textContent = mot;
    l.classList.toggle('visible', mot.length > 0);
    $('b-valider').hidden = !(J.chemin.length >= 2 && !J.glisse);
    $('b-effacer').hidden = !(J.chemin.length >= 1 && !J.glisse);
    dessinerFil();
  }
  function choisissable(c) { return !c.trouve && !c.noeud && c.melange < 0; }

  // Ajoute (ou retire en revenant en arrière) une case au chemin. Renvoie true si le chemin change.
  function toucherCase(i) {
    const c = J.cases[i];
    const ch = J.chemin;
    if (ch.length >= 2 && ch[ch.length - 2] === i) { const r = ch.pop(); majCase(J.cases[r]); majCase(c); SONS.clic(); return true; }
    if (ch.includes(i)) return false;
    if (!choisissable(c)) return false;
    if (ch.length && !adjacents(ch[ch.length - 1], i, J.l)) return false;
    ch.push(i); majCase(c); SONS.lettre(ch.length - 1);
    return true;
  }
  function viderChemin() {
    const anciens = J.chemin; J.chemin = [];
    anciens.forEach((i) => majCase(J.cases[i]));
    majCheminUI();
  }

  // Case sous le doigt (seulement près du centre : les diagonales restent faciles).
  function caseSous(x, y, strict) {
    const r = $('plateau').getBoundingClientRect();
    const px = x - r.left, py = y - r.top, pas = J.taille + J.ecart;
    const cx = Math.floor(px / pas), cy = Math.floor(py / pas);
    if (cx < 0 || cy < 0 || cx >= J.l || cy >= J.h) return -1;
    const i = cy * J.l + cx;
    const c = centre(i);
    if (strict && Math.hypot(px - c.x, py - c.y) > J.taille * 0.46) return -1;
    return i;
  }

  function surAppui(e) {
    if (!J.enJeu || J.pause || J.fini || J.intro) return;
    ctx();
    const i = caseSous(e.clientX, e.clientY, false);
    if (i < 0) return;
    e.preventDefault();
    J.clavier = false;
    const c = J.cases[i];
    J.glisse = true; J.deplace = false; J.retirer = false;
    try { $('plateau').setPointerCapture(e.pointerId); } catch (err) { /* rien */ }
    const ch = J.chemin;
    if (c.melange >= 0) { remettrePaire(c.melange); J.glisse = false; viderChemin(); return; }
    if (c.noeud) { message(t('msg.noeud'), 'mauvais'); SONS.erreur(); shake(c.el); J.glisse = false; return; }
    if (c.trouve) { J.glisse = false; return; }
    if (ch.length && ch[ch.length - 1] === i) { J.retirer = true; }
    else if (ch.length && adjacents(ch[ch.length - 1], i, J.l) && !ch.includes(i)) { toucherCase(i); }
    else { viderChemin(); toucherCase(i); }
    majCheminUI();
  }
  function surGlisse(e) {
    if (!J.glisse) return;
    const i = caseSous(e.clientX, e.clientY, true);
    if (i < 0) return;
    if (toucherCase(i)) { J.deplace = true; J.retirer = false; majCheminUI(); }
  }
  function surLacher() {
    if (!J.glisse) return;
    J.glisse = false;
    if (J.deplace) { valider(true); return; }
    if (J.retirer) { const r = J.chemin.pop(); if (r !== undefined) majCase(J.cases[r]); }
    majCheminUI();
  }
  function shake(el) { if (!el) return; el.classList.remove('retourne'); void el.offsetWidth; el.classList.add('retourne'); }

  /* ----- Validation d'un mot ----- */
  function valider(parGlisse) {
    const mot = J.chemin.map((i) => J.cases[i].lettre).join('');
    if (mot.length < 3) {
      if (!parGlisse && mot.length) message(t('msg.court'));
      viderChemin(); return;
    }
    const w = J.mots.findIndex((m) => !m.trouve && m.texte === mot);
    if (w >= 0) { motTrouve(w, J.chemin.slice()); viderChemin(); return; }
    if (J.mots.some((m) => m.trouve && m.texte === mot)) { message(t('msg.deja')); viderChemin(); return; }
    // Erreur : Pépite perd un peu patience.
    J.fers--; majFers();
    SONS.erreur();
    const p = $('plateau'); p.classList.remove('secoue'); void p.offsetWidth; p.classList.add('secoue');
    message(t('msg.pasDansListe'), 'mauvais');
    viderChemin();
    if (J.fers <= 0) { J.fini = true; setTimeout(() => finNiveau(false, 'patience'), 500); }
  }

  function motTrouve(w, cheminJoueur) {
    const m = J.mots[w];
    // Un ruban du mot mélangé par le poulain : il est remis en place.
    m.chemin.forEach((ci) => { if (J.cases[ci].melange >= 0) remettrePaire(J.cases[ci].melange, true); });
    m.trouve = true;
    const sansAide = m.aide === 0;
    if (sansAide) J.motsSansAide++;
    let dores = 0;
    m.chemin.forEach((ci) => { const c = J.cases[ci]; if (c.dore) dores++; c.trouve = true; c.aide = false; });
    let points = m.texte.length * 10 * Math.pow(2, dores) + (sansAide ? 50 : 0);
    J.score += points;
    majToutes(); majEntete();
    dessinerMots();
    const nouveau = $('liste-mots').querySelector(`[data-w="${w}"]`);
    if (nouveau) nouveau.classList.add('flash');
    SONS.mot();
    if (dores) { setTimeout(SONS.dore, 250); message(t('msg.dore'), 'bon'); }
    else message(t('msg.bravo.' + (1 + aleatoire(3))), 'bon');
    // Effets : étincelles sur le chemin, points qui montent, tresse qui pousse.
    const r = $('plateau').getBoundingClientRect(), ra = app.getBoundingClientRect();
    (cheminJoueur.length ? cheminJoueur : m.chemin).forEach((ci, k) => {
      const c = centre(ci);
      setTimeout(() => etincelles(r.left - ra.left + c.x, r.top - ra.top + c.y, 6, dores ? '#f5c542' : '#ffd166'), k * 40);
    });
    const mil = centre(m.chemin[Math.floor(m.chemin.length / 2)]);
    flottant(r.left - ra.left + mil.x, r.top - ra.top + mil.y - 10, '+' + nb(points));
    envolRuban(r.left - ra.left + mil.x, r.top - ra.top + mil.y, w);
    // Nœuds voisins qui se défont.
    let defaits = 0;
    J.cases.forEach((c) => {
      if (!c.noeud) return;
      if (voisins(c.i, J.l, J.h).some((v) => J.cases[v].trouve)) {
        c.noeud = false; defaits++;
        const svg = c.el.querySelector('.noeud-svg');
        if (svg) { c.el.classList.add('defait'); setTimeout(() => majCase(c), 600); } else majCase(c);
        const cc = centre(c.i);
        etincelles(r.left - ra.left + cc.x, r.top - ra.top + cc.y, 8, '#c08552');
      }
    });
    if (defaits) { setTimeout(SONS.noeud, 300); setTimeout(() => message(t('msg.noeudDefait'), 'bon'), 900); }
    if (J.mots.every((x) => x.trouve)) {
      J.fini = true;
      setTimeout(() => finNiveau(true), 1100);
    }
  }

  function envolRuban(x, y, w) {
    const cible = $('pepite-jeu').getBoundingClientRect(), ra = app.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'particule';
    d.style.cssText += `left:${x}px;top:${y}px;width:22px;height:12px;border-radius:4px;background:var(--ruban);box-shadow:0 0 8px #fff;`;
    app.append(d);
    const tx = cible.left - ra.left + cible.width * 0.7 - x, ty = cible.top - ra.top + cible.height * 0.35 - y;
    const a = d.animate([{ transform: 'translate(0,0) rotate(0)' }, { transform: `translate(${tx}px,${ty}px) rotate(540deg) scale(.5)` }], { duration: 650, easing: 'ease-in' });
    a.onfinish = () => { d.remove(); dessinerPepiteJeu(w); };
  }

  function etincelles(x, y, n, couleur) {
    for (let k = 0; k < n; k++) {
      const p = document.createElement('div');
      p.className = 'particule';
      p.style.left = x + 'px'; p.style.top = y + 'px'; p.style.background = k % 2 ? couleur : '#fff';
      app.append(p);
      const a = Math.random() * Math.PI * 2, d = 20 + Math.random() * 30;
      const an = p.animate([{ transform: 'translate(-50%,-50%) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d - 5}px,${Math.sin(a) * d - 5}px) scale(.2)`, opacity: 0 }], { duration: 600 + Math.random() * 300, easing: 'ease-out' });
      an.onfinish = () => p.remove();
    }
  }
  function flottant(x, y, txt) {
    const f = document.createElement('div');
    f.className = 'flottant'; f.textContent = txt;
    f.style.left = (x - 20) + 'px'; f.style.top = y + 'px';
    app.append(f); setTimeout(() => f.remove(), 1000);
  }
  function confettis() {
    const couleurs = ['#e5484d', '#3b82f6', '#f5c542', '#22a447', '#ec4899', '#8b5cf6'];
    for (let k = 0; k < 46; k++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%';
      c.style.background = couleurs[k % couleurs.length];
      c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
      c.style.animationDelay = (Math.random() * 0.5) + 's';
      app.append(c);
      setTimeout(() => c.remove(), 3800);
    }
  }

  /* ----- Aide (brosse) ----- */
  function aide() {
    if (!J.enJeu || J.pause || J.fini || J.intro) return;
    ctx();
    // Premier mot non trouvé et sans nœud (il en existe toujours un).
    const libres = J.mots.filter((m) => !m.trouve);
    let m = libres.find((x) => x.aide > 0 && x.aide < x.texte.length && x.chemin.every((c) => !J.cases[c].noeud))
      || libres.find((x) => x.chemin.every((c) => !J.cases[c].noeud)) || libres[0];
    if (!m) return;
    if (m.aide < m.texte.length) m.aide++;
    J.cases.forEach((c) => { c.aide = false; });
    m.chemin.slice(0, m.aide).forEach((c) => { J.cases[c].aide = true; });
    majToutes(); dessinerMots();
    SONS.aide();
    message(t('msg.aide'));
  }

  /* ----- Poulain farceur ----- */
  function farceDuPoulain() {
    const libres = J.cases.filter((c) => c.mot >= 0 && !c.trouve && !c.noeud && c.melange < 0 && !J.chemin.includes(c.i));
    if (libres.length < 2) return false;
    melanger(libres);
    let a = null, b = null;
    for (let x = 0; x < libres.length && !b; x++) for (let y = x + 1; y < libres.length; y++) {
      if (libres[x].lettre !== libres[y].lettre) { a = libres[x]; b = libres[y]; break; }
    }
    if (!a || !b) return false;
    const pz = $('poulain');
    pz.classList.remove('trotte'); void pz.offsetWidth; pz.classList.add('trotte');
    SONS.hennit();
    setTimeout(() => {
      if (!J.enJeu || J.fini || J.pause || a.trouve || b.trouve || a.noeud || b.noeud) return;
      if (J.chemin.includes(a.i) || J.chemin.includes(b.i) || a.melange >= 0 || b.melange >= 0) return;
      const id = J.paires.length ? Math.max(...J.paires.map((p) => p.id)) + 1 : 0;
      [a.lettre, b.lettre] = [b.lettre, a.lettre];
      a.melange = id; b.melange = id;
      J.paires.push({ id, a: a.i, b: b.i });
      shake(a.el); shake(b.el);
      majCase(a); majCase(b);
      message(t('msg.melange'), 'mauvais');
    }, 800);
    return true;
  }
  function remettrePaire(id, discret) {
    const k = J.paires.findIndex((p) => p.id === id);
    if (k < 0) return;
    const p = J.paires[k];
    const a = J.cases[p.a], b = J.cases[p.b];
    [a.lettre, b.lettre] = [b.lettre, a.lettre];
    a.melange = -1; b.melange = -1;
    J.paires.splice(k, 1);
    majCase(a); majCase(b); shake(a.el); shake(b.el);
    if (!discret) { SONS.remis(); message(t('msg.remis'), 'bon'); }
  }

  /* ----- Boucle (chrono, poulain) ----- */
  let avant = 0;
  function boucle(maintenant) {
    const dt = Math.min(0.1, (maintenant - avant) / 1000 || 0);
    avant = maintenant;
    if (J.enJeu && !J.pause && !J.fini && !J.intro && ecranCourant === 'ecran-jeu') {
      if (J.tempsMax) {
        J.temps += dt;
        const reste = J.tempsMax - J.temps;
        if (reste <= 10 && Math.ceil(reste) !== J.dernierTic) { J.dernierTic = Math.ceil(reste); SONS.tic(); if (J.dernierTic === 10) message(t('msg.vite'), 'mauvais'); }
        majChrono();
        if (reste <= 0) { J.fini = true; viderChemin(); finNiveau(false, 'temps'); }
      }
      if (J.def.poulain && !J.fini) {
        J.poulainT -= dt;
        if (J.poulainT <= 0) {
          if (J.paires.length < J.def.poulain.paires) farceDuPoulain();
          J.poulainT = J.def.poulain.tous * (0.8 + Math.random() * 0.4);
        }
      }
    }
    requestAnimationFrame(boucle);
  }

  /* ----- Pause ----- */
  function mettrePause() {
    if (!J.enJeu || J.fini || J.pause || ecranCourant !== 'ecran-jeu') return;
    J.pause = true; J.glisse = false;
    app.classList.add('en-pause');
    $('v-pause').classList.add('visible');
    $('b-reprendre').focus();
  }
  function reprendre() {
    J.pause = false;
    app.classList.remove('en-pause');
    $('v-pause').classList.remove('visible');
  }
  function fermerVoiles() {
    document.querySelectorAll('.voile').forEach((v) => v.classList.remove('visible'));
    app.classList.remove('en-pause');
    $('tuto').classList.remove('visible');
    J.intro = false; J.pause = false;
  }

  /* ----- Présentations (tutoriel et nouvelles mécaniques) ----- */
  function presenter(liste) {
    if (!liste.length) { J.intro = false; return; }
    J.intro = true;
    const cle = liste.shift();
    if (cle === 'tuto') { tutoriel(() => presenter(liste)); return; }
    prog.vus[cle] = true;
    $('intro-titre').textContent = t('intro.' + cle + '.titre');
    $('intro-texte').textContent = t('intro.' + cle + '.texte');
    $('intro-demo').innerHTML = demo(cle);
    animerDemo(cle);
    $('v-intro').classList.add('visible');
    $('b-intro-ok').focus();
    $('b-intro-ok').onclick = () => { SONS.clic(); $('v-intro').classList.remove('visible'); presenter(liste); };
  }
  function demo(cle) {
    const mini = (x, c, extra) => `<div class="mini" style="left:${x}px;--c:${c}">${extra || ''}</div>`;
    if (cle === 'dore') return mini(30, '#e5484d') + mini(98, '#e3a91b', ICONES.brille) + mini(166, '#3b82f6') + `<div class="main">${ICONES.main}</div>`;
    if (cle === 'noeud') return mini(30, '#22a447') + mini(98, '#e5484d') + `<div class="mini nd" style="left:166px;--c:#8b5cf6">${ICONES.noeud}</div><div class="main">${ICONES.main}</div>`;
    if (cle === 'image') return `<div style="position:absolute;left:20px;top:30px;width:60px;height:60px">${IMAGES.POMME}</div>` + mini(98, '#ec4899') + mini(166, '#14b8a6') + `<div class="main">${ICONES.main}</div>`;
    if (cle === 'poulain') return mini(30, '#e5484d', ICONES.sabot) + mini(98, '#3b82f6') + mini(166, '#22a447', ICONES.sabot) + `<div class="poulain trotte" style="display:block;bottom:2px">${SVG_POULAIN}</div><div class="main">${ICONES.main}</div>`;
    return `<div style="position:absolute;left:16px;right:16px;top:52px;height:16px;border-radius:8px;background:#e9d6b4"><div class="rempli-demo" style="height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#8bd17c,#f5c542)"></div></div><div class="tete-demo" style="position:absolute;top:40px;left:4px;width:40px;height:40px">${svgPepite({ robe: prog.robe, ruban: prog.ruban, pompon: 'aucun', places: 0, pleines: [] })}</div><div style="position:absolute;right:6px;top:44px;width:30px;height:30px">${ICONES.porte}</div>`;
  }
  function animerDemo(cle) {
    const z = $('intro-demo');
    const main = z.querySelector('.main');
    const opts = { duration: 2400, iterations: Infinity, easing: 'ease-in-out' };
    if (cle === 'chrono') {
      z.querySelector('.rempli-demo').animate([{ width: '0%' }, { width: '100%' }], { duration: 3000, iterations: Infinity });
      z.querySelector('.tete-demo').animate([{ transform: 'translateX(0)' }, { transform: 'translateX(170px)' }], { duration: 3000, iterations: Infinity });
      return;
    }
    if (cle === 'noeud') {
      main.animate([{ transform: 'translate(30px,0)' }, { transform: 'translate(98px,0)' }, { transform: 'translate(98px,0)' }, { transform: 'translate(30px,0)' }], opts);
      const nd = z.querySelector('.nd .noeud-svg');
      if (nd) nd.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 1, transform: 'scale(1)', offset: 0.5 }, { opacity: 0, transform: 'scale(1.6) rotate(90deg)', offset: 0.75 }, { opacity: 0 }], opts);
      return;
    }
    if (cle === 'poulain') {
      main.animate([{ transform: 'translate(30px,0) scale(1)' }, { transform: 'translate(30px,0) scale(1)', offset: 0.5 }, { transform: 'translate(30px,-8px) scale(.9)', offset: 0.6 }, { transform: 'translate(30px,0) scale(1)' }], opts);
      z.querySelector('.poulain').style.animationIterationCount = 'infinite';
      return;
    }
    main.animate([{ transform: 'translate(30px,0)' }, { transform: 'translate(98px,0)' }, { transform: 'translate(166px,0)' }, { transform: 'translate(166px,0)' }], opts);
  }

  function tutoriel(suite) {
    const tz = $('tuto');
    const m = J.mots[0];
    tz.classList.add('visible');
    const main = $('tuto-main');
    main.innerHTML = ICONES.main;
    let etape = 0, anim = null;
    const majEtape = () => {
      $('tuto-texte').textContent = t('tuto.' + (etape + 1));
      $('tuto-etapes').querySelectorAll('span').forEach((s, k) => s.classList.toggle('on', k === etape));
    };
    majEtape();
    const r = $('plateau').getBoundingClientRect(), ra = app.getBoundingClientRect();
    const pts = m.chemin.map((ci) => { const c = centre(ci); return { x: r.left - ra.left + c.x - 12, y: r.top - ra.top + c.y - 8 }; });
    const images = pts.map((p, k) => ({ transform: `translate(${p.x}px,${p.y}px)`, offset: 0.15 + 0.6 * (k / Math.max(1, pts.length - 1)) }));
    anim = main.animate([{ transform: `translate(${pts[0].x}px,${pts[0].y}px)`, offset: 0 }, ...images, { transform: `translate(${pts[pts.length - 1].x}px,${pts[pts.length - 1].y}px)`, offset: 1 }], { duration: 3200, iterations: Infinity, easing: 'ease-in-out' });
    const minuteur = setInterval(() => { etape = (etape + 1) % 3; majEtape(); }, 1600);
    const fermer = (e) => {
      if (e) e.preventDefault();
      clearInterval(minuteur); if (anim) anim.cancel();
      tz.classList.remove('visible');
      tz.removeEventListener('pointerdown', fermer);
      document.removeEventListener('keydown', clavierTuto, true);
      ctx(); SONS.clic();
      suite();
    };
    const clavierTuto = (e) => { if (['Enter', 'Space', 'Escape'].includes(e.code) || e.key === 'Enter' || e.key === ' ') { e.stopPropagation(); fermer(e); } };
    tz.addEventListener('pointerdown', fermer);
    document.addEventListener('keydown', clavierTuto, true);
  }

  /* ----- Fin de niveau ----- */
  function finNiveau(gagne, raison) {
    if (!J.enJeu) return;
    J.enJeu = false; J.fini = true; J.glisse = false;
    $('poulain').classList.remove('trotte');
    const n = J.n, idx = n - 1;
    const boutons = $('fin-boutons');
    boutons.innerHTML = '';
    const ajouterBouton = (cle, classe, action) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn ' + (classe || ''); b.textContent = t(cle);
      b.addEventListener('click', () => { SONS.clic(); action(); });
      boutons.append(b); return b;
    };
    $('fin-debloques').textContent = '';
    $('fin-detail').textContent = '';
    if (gagne) {
      if (J.tempsMax) { const bonus = Math.ceil(Math.max(0, J.tempsMax - J.temps)) * 5; J.score += bonus; $('fin-detail').textContent = t('fin.bonusTemps', { n: bonus }); }
      const total = J.mots.length;
      const ratio = J.motsSansAide / total;
      const etoiles = ratio >= 1 ? 3 : ratio >= 0.5 ? 2 : 1;
      const avantEtoiles = totalEtoiles();
      const ancienRecord = prog.records[idx] || 0;
      const premiereFois = !(prog.etoiles[idx] > 0);
      prog.etoiles[idx] = Math.max(prog.etoiles[idx] || 0, etoiles);
      prog.records[idx] = Math.max(ancienRecord, J.score);
      prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, n + 1));
      try { window.JEL_SAVE.save(JEU, donneesSauvegarde(n + 1, totalScore())); } catch (e) { /* rien */ }
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: n });
      if (prog.etoiles.slice(0, NIVEAUX.length).filter((x) => x > 0).length === NIVEAUX.length) {
        if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
      }
      // Objets débloqués et flot du concours.
      const apres = totalEtoiles();
      const nouveaux = [];
      [[ROBES, 'robe'], [RUBANS, 'ruban'], [POMPONS, 'pompon']].forEach(([liste, champ]) => liste.forEach((o) => { if (o.etoiles > avantEtoiles && o.etoiles <= apres) nouveaux.push(t(champ + '.' + o.id)); }));
      const c = Math.floor(idx / 5);
      const concoursFini = n % 5 === 0 && premiereFois && [0, 1, 2, 3, 4].every((j) => (prog.etoiles[c * 5 + j] || 0) > 0);
      let lignes = [];
      if (concoursFini) lignes.push(t('fin.flot', { concours: nomConcours(c) }));
      if (nouveaux.length) lignes.push(t('fin.debloque', { objets: nouveaux.join(', ') }));
      $('fin-debloques').textContent = lignes.join(' ');
      const dernier = n === NIVEAUX.length;
      $('fin-titre').textContent = dernier ? t('bilan.titre') : t('fin.victoire');
      $('fin-dessin').innerHTML = svgPepite({ robe: prog.robe, ruban: prog.ruban, pompon: prog.pompon, places: J.mots.length, pleines: J.mots.map(() => true), brille: true, flot: concoursFini || dernier ? COULEURS_CONCOURS[c] : COULEURS_FLOTS[etoiles - 1] });
      if (dernier) $('fin-detail').textContent = ($('fin-detail').textContent + ' ' + t('bilan.texte', { n: totalEtoiles(), max: NIVEAUX.length * 3 })).trim();
      afficherEtoiles(etoiles, t('fin.sansAide', { n: J.motsSansAide, total }));
      compteur($('fin-score'), J.score);
      const rec = $('fin-record');
      if (J.score > ancienRecord) { rec.textContent = t('fin.recordNouveau'); rec.className = 'record nouveau'; }
      else { rec.textContent = t('fin.record', { n: ancienRecord }); rec.className = 'record'; }
      const premier = n < NIVEAUX.length ? ajouterBouton('fin.suivant', 'principal', () => lancerNiveau(n + 1)) : null;
      const rejouer = ajouterBouton('fin.rejouer', premier ? '' : 'principal', () => lancerNiveau(n));
      ajouterBouton('fin.niveaux', '', () => { fermerVoiles(); dessinerNiveaux(); montrer('ecran-niveaux'); });
      SONS.victoire(); confettis();
      setTimeout(() => (premier || rejouer).focus(), 50);
    } else {
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: n });
      $('fin-titre').textContent = t(raison === 'temps' ? 'fin.defaiteTemps' : 'fin.defaitePatience');
      $('fin-dessin').innerHTML = svgPepite({ robe: prog.robe, ruban: prog.ruban, pompon: prog.pompon, places: J.mots.length, pleines: J.mots.map((m) => m.trouve) });
      $('fin-etoiles').innerHTML = ''; $('fin-etoiles').removeAttribute('aria-label');
      $('fin-score').textContent = t('fin.score', { n: J.score });
      const ancien = prog.records[idx] || 0;
      $('fin-record').textContent = ancien ? t('fin.record', { n: ancien }) : '';
      $('fin-record').className = 'record';
      $('fin-detail').textContent = t('fin.motsTrouves', { n: J.mots.filter((m) => m.trouve).length, total: J.mots.length });
      const b = ajouterBouton('fin.reessayer', 'principal', () => lancerNiveau(n));
      ajouterBouton('fin.niveaux', '', () => { fermerVoiles(); dessinerNiveaux(); montrer('ecran-niveaux'); });
      SONS.defaite();
      setTimeout(() => b.focus(), 50);
    }
    $('v-fin').classList.add('visible');
  }
  function afficherEtoiles(n, label) {
    const z = $('fin-etoiles');
    z.innerHTML = [0, 1, 2].map(() => ICONES.etoile(true)).join('');
    z.setAttribute('aria-label', t('etoiles', { n }) + ' · ' + label);
    z.querySelectorAll('svg').forEach((s, k) => { if (k < n) setTimeout(() => { s.classList.add('gagnee'); SONS.etoile(k); }, 400 + k * 350); });
    $('fin-detail').textContent = ($('fin-detail').textContent + ' ' + label).trim();
  }
  function compteur(el, cible) {
    const debut = performance.now();
    const pas = (m) => {
      const f = Math.min(1, (m - debut) / 900);
      el.textContent = t('fin.score', { n: Math.round(cible * f) });
      if (f < 1) requestAnimationFrame(pas);
    };
    requestAnimationFrame(pas);
  }

  /* ======================================================================
     Clavier
     ====================================================================== */
  function deplacerCurseur(dx, dy) {
    const x = J.curseur % J.l, y = Math.floor(J.curseur / J.l);
    const nx = Math.max(0, Math.min(J.l - 1, x + dx)), ny = Math.max(0, Math.min(J.h - 1, y + dy));
    const ancien = J.curseur; J.curseur = ny * J.l + nx; J.clavier = true;
    majCase(J.cases[ancien]); majCase(J.cases[J.curseur]);
  }
  function selectionClavier() {
    const c = J.cases[J.curseur];
    if (c.melange >= 0) { remettrePaire(c.melange); return; }
    if (c.noeud) { message(t('msg.noeud'), 'mauvais'); SONS.erreur(); return; }
    const ch = J.chemin;
    if (ch.length && ch[ch.length - 1] === c.i) { ch.pop(); majCase(c); }
    else if (!ch.length || adjacents(ch[ch.length - 1], c.i, J.l)) toucherCase(c.i);
    else { viderChemin(); toucherCase(c.i); }
    majCheminUI();
  }
  document.addEventListener('keydown', (e) => {
    ctx();
    const code = e.code;
    if (ecranCourant === 'ecran-jeu') {
      if (code === 'Escape' || code === 'KeyP') {
        e.preventDefault();
        if ($('v-pause').classList.contains('visible')) reprendre(); else mettrePause();
        return;
      }
      if (!J.enJeu || J.pause || J.fini || J.intro) return;
      if (code === 'ArrowLeft') { e.preventDefault(); deplacerCurseur(-1, 0); }
      else if (code === 'ArrowRight') { e.preventDefault(); deplacerCurseur(1, 0); }
      else if (code === 'ArrowUp') { e.preventDefault(); deplacerCurseur(0, -1); }
      else if (code === 'ArrowDown') { e.preventDefault(); deplacerCurseur(0, 1); }
      else if (code === 'Space') { e.preventDefault(); selectionClavier(); }
      else if (code === 'Enter' || code === 'NumpadEnter') { e.preventDefault(); if (J.chemin.length >= 2) valider(false); else selectionClavier(); }
      else if (code === 'Backspace') { e.preventDefault(); const r = J.chemin.pop(); if (r !== undefined) majCase(J.cases[r]); majCheminUI(); }
      else if (code === 'KeyH') { e.preventDefault(); aide(); }
    } else if (ecranCourant === 'ecran-titre' && (code === 'Enter' || code === 'Space') && document.activeElement === document.body) {
      e.preventDefault(); jouer();
    } else if ((ecranCourant === 'ecran-niveaux' || ecranCourant === 'ecran-vestiaire') && code === 'Escape') {
      e.preventDefault(); retourTitre();
    }
  });

  /* ======================================================================
     Démarrage
     ====================================================================== */
  function retourTitre() { fermerVoiles(); J.enJeu = false; dessinerTitre(); montrer('ecran-titre'); }
  function jouer() {
    ctx(); SONS.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { lireProgression(); lancerNiveau(Math.min(NIVEAUX.length, Math.max(1, d.niveau | 0))); },
      onNouvelle: () => lancerNiveau(1),
      onEffacer: () => { reinitialiserProgression(); dessinerTitre(); lancerNiveau(1); },
    });
  }

  function textesDynamiques() {
    majSon();
    document.querySelectorAll('.b-retour').forEach((b) => { b.innerHTML = ICONES.retour; b.setAttribute('aria-label', t('bouton.retour')); });
    $('b-pause').innerHTML = ICONES.pause; $('b-pause').setAttribute('aria-label', t('pause.bouton'));
    $('b-aide').innerHTML = ICONES.aide; $('b-aide').setAttribute('aria-label', t('jeu.aide')); $('b-aide').title = t('jeu.aide');
    if (ecranCourant === 'ecran-niveaux') dessinerNiveaux();
    if (ecranCourant === 'ecran-vestiaire') dessinerVestiaire();
    if (ecranCourant === 'ecran-jeu' && J.def) { majEntete(); dessinerMots(); majToutes(); majFers(); majChrono(); }
  }

  function init() {
    lireProgression();
    textesDynamiques();
    dessinerTitre();
    $('b-jouer').addEventListener('click', jouer);
    $('b-niveaux').addEventListener('click', () => { SONS.clic(); dessinerNiveaux(); montrer('ecran-niveaux'); });
    $('b-vestiaire').addEventListener('click', () => { SONS.clic(); dessinerVestiaire(); montrer('ecran-vestiaire'); });
    document.querySelectorAll('.b-retour').forEach((b) => b.addEventListener('click', () => { SONS.clic(); retourTitre(); }));
    document.querySelectorAll('.bouton-son').forEach((b) => b.addEventListener('click', () => { ctx(); basculerSon(); }));
    $('b-pause').addEventListener('click', () => { SONS.clic(); mettrePause(); });
    $('b-reprendre').addEventListener('click', () => { SONS.clic(); reprendre(); });
    $('b-recommencer').addEventListener('click', () => { SONS.clic(); lancerNiveau(J.n); });
    $('b-accueil').addEventListener('click', () => { SONS.clic(); if (J.enJeu && !J.fini) { try { window.JEL_SAVE.save(JEU, donneesSauvegarde(J.n, totalScore())); } catch (e) { /* rien */ } } retourTitre(); });
    $('b-aide').addEventListener('click', aide);
    $('b-valider').addEventListener('click', () => valider(false));
    $('b-effacer').addEventListener('click', () => { SONS.clic(); viderChemin(); });
    const p = $('plateau');
    p.addEventListener('pointerdown', surAppui);
    p.addEventListener('pointermove', surGlisse);
    p.addEventListener('pointerup', surLacher);
    p.addEventListener('pointercancel', surLacher);
    p.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('resize', () => { if (ecranCourant === 'ecran-jeu') dimensionner(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });
    window.JEL_SAVE.surFermeture(() => {
      if (J.enJeu && !J.fini) window.JEL_SAVE.save(JEU, donneesSauvegarde(J.n, totalScore()));
    });
    if (I18N.surChangement) I18N.surChangement(textesDynamiques);
    requestAnimationFrame(boucle);
  }
  init();
})();
</script>
</body>
</html>
