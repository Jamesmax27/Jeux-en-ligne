    pause: (oui) => SON_BRUT.pause(oui),
    jouer: (nom, options) => { if (!modeDemo) SON_BRUT.jouer(nom, options); },
    ambiance: (niveau, intensite) => SON_BRUT.ambiance(niveau, intensite),
    battement: (force) => SON_BRUT.battement(force),
  };
  const $ = (id) => document.getElementById(id);
  const TPS = 1000 / SIM.reglages.tickMs;

  const TAU = Math.PI * 2;
  const borner = (x, a, b) => (x < a ? a : x > b ? b : x);
  const melange = (a, b, k) => a + (b - a) * k;
  const hasard = (a, b) => a + Math.random() * (b - a);
  // Différence d'angles ramenée entre −π et π.
  const ecartAngle = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

  // Écran tactile : deviné au chargement, et confirmé au premier toucher (dans le cadre isolé du site,
  // le navigateur ne dit pas toujours la vérité au chargement).
  let TACTILE = (() => { try { return matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window; } catch (e) { return false; } })();
  let tirAutoChoisi = false;    // le joueur a réglé lui-même le tir automatique
  if (TACTILE) document.body.classList.add('tactile');
  window.addEventListener('touchstart', () => {
    if (TACTILE) return;
    TACTILE = true;
    document.body.classList.add('tactile');
    if (!tirAutoChoisi) meta.options.tirAuto = true;
    if (typeof surPassageTactile === 'function') surPassageTactile();
  }, { passive: true, capture: true });

  // Types d'aliens, armes, capacités : identifiants de la simulation.
  const ALIENS = D.aliens, ARMES = D.armes, CAPACITES = D.capacites, CARTE = D.carte;
  const NOMS_ALIENS = ['rampant', 'guerrier', 'cracheur', 'blinde', 'bombardier', 'matriarche', 'oeuf'];
  const HAUTEUR_YEUX = 1.62;

  // ------------------------------------------------------------------------
  // Sauvegarde, réglages, grades
  // ------------------------------------------------------------------------
  // Expérience à atteindre pour chaque grade (grade 1 au départ).
  const GRADES_XP = [0, 400, 1000, 2000, 3500, 5500, 8000, 11500, 16000, 22000];
  const OPTIONS_DEFAUT = { muet: false, volume: 8, sens: 10, tirAuto: TACTILE, inverse: false, qualite: true, tuto: false };

  const meta = { xp: 0, record: { vague: 0, score: 0 }, options: Object.assign({}, OPTIONS_DEFAUT) };

  function lireSauvegarde() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (!d) return {};
    if (Number.isFinite(d.xp) && d.xp >= 0) meta.xp = Math.floor(d.xp);
    if (d.record && Number.isFinite(d.record.vague)) meta.record = { vague: Math.floor(d.record.vague) || 0, score: Math.floor(d.record.score) || 0 };
    if (d.options && typeof d.options === 'object') {
      for (const k in OPTIONS_DEFAUT) if (typeof d.options[k] === typeof OPTIONS_DEFAUT[k]) meta.options[k] = d.options[k];
      if (typeof d.options.tirAuto === 'boolean') tirAutoChoisi = true;
    }
    return d;
  }

  // Écrit la sauvegarde. extra : { niveau, score, partie } (la progression de la partie en cours).
  function ecrireSauvegarde(extra) {
    const donnees = Object.assign({ xp: meta.xp, record: meta.record, options: meta.options }, extra || {});
    try { window.JEL_SAVE.save(JEU, donnees); } catch (e) { /* sans stockage : le jeu continue */ }
  }

  function gradeDe(xp) {
    let g = 1;
    for (let i = 1; i < GRADES_XP.length; i++) if (xp >= GRADES_XP[i]) g = i + 1;
    return g;
  }

  // Ce que débloque un grade (clés de textes), d'après les données de la simulation.
  function deblocagesDe(grade) {
    const liste = [];
    for (let i = 1; i < D.boutique.length; i++) {
      const b = D.boutique[i];
      if (b.grade === grade && grade > 1) liste.push(t('article.' + b.id));
      if (b.gradeNiveau3 === grade) liste.push(t('article.niveau3'));
    }
    for (const c of CAPACITES) if (c.grade === grade) liste.push(t('capacite.' + c.id));
    if (grade > 1) liste.push(t('grade.prime', { n: (grade - 1) * D.joueur.creditsParGrade }));
    return liste;
  }

  // ------------------------------------------------------------------------
  // Pilote local de la simulation (même interface que JEL_TR.Partie du moteur
  // temps réel du site : la version coopérative branchera la même simulation
  // sur ce moteur). Un tick toutes les 50 ms, ordres joués au tick suivant.
  // ------------------------------------------------------------------------
  function tirerHasard(etat) {
    const a = ((etat.a >>> 0) + 0x6D2B79F5) >>> 0;
    etat.a = a;
    let x = a;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return (x ^ (x >>> 14)) >>> 0;
  }
  const copie = (x) => JSON.parse(JSON.stringify(x));

  class PartieLocale {
    constructor(sim) {
      this.sim = sim;
      this.mode = 'arret';
      this.camp = 0;
      this.connexion = null;
      this.etat = null;
      this.prec = null;
      this.resultat = null;
      this.enPause = false;
      this.attente = [];
      this.tDernier = 0;
      this.minuteur = 0;
      this.battement = () => this.boucle();
    }

    // p : { graine, config, etat (reprise d'une partie gardée) }
    local(p) {
      this.quitter();
      const etat = p.etat ? copie(p.etat) : this.sim.depart((p.graine >>> 0) || 1, copie(p.config || {}));
      if (!Number.isInteger(etat.k)) etat.k = 0;
      etat.ctl = [0, 0, 0, 0];
      if (!Array.isArray(etat.fx)) etat.fx = [];
      this.etat = etat;
      this.prec = copie(etat);
      this.resultat = this.sim.fin(etat);
      this.attente = [];
      this.mode = 'local';
      this.enPause = false;
      this.tDernier = performance.now();
      this.minuteur = setTimeout(this.battement, 16);
    }

    quitter() { clearTimeout(this.minuteur); this.mode = 'arret'; this.attente = []; }

    ordre(o) {
      if (this.mode !== 'local' || this.resultat) return false;
      if (this.enPause) {
        // Temps arrêté (boutique, seul) : l'ordre est appliqué tout de suite, sans avancer d'un tick.
        let ok = false;
        try { ok = this.sim.valide(this.etat, this.camp, o) === true; } catch (e) { ok = false; }
        if (ok) this.sim.ordre(this.etat, this.camp, o.slice());
        return ok;
      }
      this.attente.push(o.slice());
      return true;
    }

    pause(oui) {
      oui = !!oui;
      if (oui === this.enPause) return;
      this.enPause = oui;
      if (!oui && this.mode === 'local') { this.tDernier = performance.now(); clearTimeout(this.minuteur); this.minuteur = setTimeout(this.battement, 0); }
    }

    alpha() {
      if (!this.etat || this.enPause || this.mode !== 'local') return 1;
      return borner((performance.now() - this.tDernier) / this.sim.reglages.tickMs, 0, 1);
    }

    instantane() { return copie(this.etat); }

    avancer() {
      const sim = this.sim, etat = this.etat;
      this.prec = copie(etat);
      const ordres = this.attente;
      this.attente = [];
      for (const o of ordres) {
        let ok = false;
        try { ok = sim.valide(etat, this.camp, o) === true; } catch (e) { ok = false; }
        if (ok) sim.ordre(etat, this.camp, o);
      }
      const alea = (n) => (n > 1 ? tirerHasard(etat) % n : 0);
      // Camps tenus par un robot (démonstration de l'écran titre), comme dans le moteur temps réel.
      for (let c = 0; c < sim.camps; c++) {
        if (etat.ctl[c] === 0 || (etat.k + 1 + c * 3) % sim.periodeBot !== 0) continue;
        let siens = [];
        try { siens = sim.bot(etat, c, etat.ctl[c], alea) || []; } catch (e) { siens = []; }
        for (const o of siens) if (sim.valide(etat, c, o) === true) sim.ordre(etat, c, o);
      }
      sim.pas(etat, alea);
      etat.k += 1;
      if (!this.resultat) this.resultat = sim.fin(etat);
    }

    boucle() {
      clearTimeout(this.minuteur);
      if (this.mode !== 'local') return;
      const maintenant = performance.now(), tick = this.sim.reglages.tickMs;
      if (this.enPause || this.resultat) { this.tDernier = maintenant; if (this.resultat) { this.mode = 'fin'; return; } }
      else {
        let dus = Math.floor((maintenant - this.tDernier) / tick);
        // Un long retard (onglet endormi) n'est pas rattrapé : la partie reprend où elle était.
        if (dus > 10) { dus = 1; this.tDernier = maintenant - tick; }
        while (dus > 0 && !this.resultat) { this.avancer(); this.tDernier += tick; dus--; }
      }
      this.minuteur = setTimeout(this.battement, 12);
    }
  }

  // ==========================================================================
  // 2. Le monde : moteur 3D, décor, aliens, tourelles, effets
  // Repère de la simulation (x, y) → monde 3D (x, hauteur, z = y).
  // ==========================================================================
  const toile = $('vue');
  let moteur = null;            // SAS_GL
  let CREA = null;              // modèles des aliens
  const MAILLES = {};           // maillages du décor et des objets
  let partie = null;            // pilote de la simulation
  let tempsJeu = 0;             // secondes écoulées (avancées par la boucle, figées en pause)
  let dtImage = 0.016;

  // Caméra de l'image en cours (pour les sons et les effets).
  const cam = { x: 0, y: HAUTEUR_YEUX, z: 8, lacet: 0, tangage: 0, fov: 70, secousse: 0 };
  let secousse = 0;

  // Vue de chaque alien (lissage, éclair du coup reçu, naissance) : id → objet.
  const vues = new Map();
  const cadavres = [];          // aliens qui s'effondrent : { type, x, z, lacet, t, echelle }
  const projectiles = [];       // grenades et plasma en vol : { genre, x0, z0, y0, x1, z1, t, duree }
  const tirsTourelles = [0, 0, 0, 0, 0, 0];   // heure du dernier tir (recul)
  let dernierFx = 0;            // dernier tick dont les effets ont été montrés
  let nuitVue = 0;              // 0..1 lissé
  let brecheVue = 0;
  const precParId = new Map();
  let precK = -1;

  function chargerMoteur() {
    let modeles = null;
    try { modeles = JSON.parse($('sas-modeles').textContent); } catch (e) { modeles = null; }
    moteur = modeles && window.SAS_GL ? window.SAS_GL.creer(toile, { modeles }) : null;
    if (!moteur) return false;
    CREA = window.SAS_CREATURES.creer(moteur);
    for (const nom of Object.keys(modeles.modeles)) MAILLES[nom] = moteur.modele(nom);
    fabriquerObjets();
    construireDecor();
    return true;
  }

  // Petits objets fabriqués par le code (mine, boule de plasma).
  function fabriquerObjets() {
    let g = moteur.geo();
    g.couleur(0.25, 0.27, 0.33); g.cylindre(0.34, 0.27, 0.13, 8);
    g.deplacer(0, 0.13, 0); g.couleur(1, 0.2, 0.15); g.emissif(1); g.cylindre(0.09, 0.06, 0.07, 6);
    MAILLES.mine = g.maillage();
    g = moteur.geo();
    g.couleur(0.55, 0.88, 1); g.emissif(1); g.sphere(0.3, 8, 5);
    MAILLES.plasma = g.maillage();

    // Barricade : trois blocs de béton, bandes de signalisation, poutres croisées tournées vers le nord.
    g = moteur.geo();
    const bloc = (x, lacet) => {
      g.pousser(); g.deplacer(x, 0.6, 0); g.tournerY(lacet);
      g.couleur(0.4, 0.4, 0.46); g.boite(1.25, 1.2, 0.85, 0.62, 0.5);
      g.couleur(0.95, 0.72, 0.12); g.deplacer(0, 0.62, 0); g.boite(0.8, 0.06, 0.44);
      g.depiler();
    };
    bloc(-1.3, 0.22); bloc(0, 0); bloc(1.3, -0.22);
    g.couleur(0.2, 0.2, 0.25);
    for (const x of [-0.65, 0.65]) {
      g.pousser(); g.deplacer(x, 0.75, 0.75); g.tournerX(-0.75); g.boite(0.13, 2.1, 0.13); g.depiler();
      g.pousser(); g.deplacer(x, 0.75, 0.75); g.tournerX(0.75); g.boite(0.13, 2.1, 0.13); g.depiler();
    }
    MAILLES.barricade = g.maillage();

    // Le sas : porte blindée à deux vantaux, cadre épais, bandes de danger, joint et rampe lumineux.
    g = moteur.geo();
    const dl = CARTE.sas.demiLargeur;
    g.couleur(0.2, 0.21, 0.27);
    for (const s of [-1, 1]) { g.pousser(); g.deplacer(s * (dl + 0.4), 2.25, 0); g.boite(0.8, 4.5, 1); g.depiler(); }
    g.pousser(); g.deplacer(0, 4.2, 0); g.boite(dl * 2 + 1.6, 0.75, 1); g.depiler();
    for (const s of [-1, 1]) {
      g.couleur(0.34, 0.36, 0.44);
      g.pousser(); g.deplacer(s * dl / 2, 1.92, 0.12); g.boite(dl - 0.04, 3.84, 0.36); g.depiler();
      g.couleur(0.45, 0.47, 0.56);
      for (const y of [1.1, 2, 2.9]) { g.pousser(); g.deplacer(s * dl / 2, y, 0.34); g.boite(dl - 0.5, 0.2, 0.12); g.depiler(); }
      for (let i = 0; i < 7; i++) {
        g.couleur(i % 2 ? 0.14 : 0.95, i % 2 ? 0.14 : 0.74, i % 2 ? 0.16 : 0.1);
        g.pousser(); g.deplacer(s * (0.25 + i * (dl - 0.3) / 7 + 0.18), 0.3, 0.33); g.boite((dl - 0.3) / 7, 0.42, 0.1); g.depiler();
      }
    }
    g.couleur(0.45, 0.92, 1); g.emissif(1);
    g.pousser(); g.deplacer(0, 2.1, 0.3); g.boite(0.09, 3.4, 0.1); g.depiler();
    g.pousser(); g.deplacer(0, 4.2, 0.53); g.boite(dl * 1.1, 0.16, 0.08); g.depiler();
    MAILLES.sas = g.maillage();
  }

  // ------------------------------------------------------------------------
  // Décor fixe : [maillage, x, hauteur, z, lacet, échelle] (échelle : nombre ou [x, y, z])
  // ------------------------------------------------------------------------
  const DECOR = [];
  function decor(nom, x, h, z, lacet, echelle, teinte) {
    const m = MAILLES[nom];
    if (!m) return;
    const e = Array.isArray(echelle) ? echelle : [echelle, echelle, echelle];
    const mat = new Float32Array(16);
    moteur.mat.trs(mat, x, h, z, lacet || 0, e[0], e[1], e[2]);
    DECOR.push({ m, mat, t: teinte || [1, 1, 1] });
  }

  function dessinerDecor() {
    for (let i = 0; i < DECOR.length; i++) {
      const d = DECOR[i];
      moteur.poserMat(d.m, d.mat, d.t[0], d.t[1], d.t[2], 0, 0, 0, 0, 1);
    }
  }

  // ------------------------------------------------------------------------
  // Sons placés dans l'espace
  // ------------------------------------------------------------------------
  function son3d(nom, x, y, volume, hauteur) {
    const dx = x - cam.x, dz = y - cam.z;
    const d = Math.sqrt(dx * dx + dz * dz);
    const angle = ecartAngle(cam.lacet, Math.atan2(dx, dz));
    SON.jouer(nom, { volume: volume === undefined ? 1 : volume, pan: borner(Math.sin(angle) * Math.min(1, d / 6), -1, 1), distance: d, hauteur: hauteur || 1 });
  }

  // ------------------------------------------------------------------------
  // Particules : gestes courants
  // ------------------------------------------------------------------------
  function giclee(x, h, z, n, r, v, b, force) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, f = (force || 3) * (0.3 + Math.random());
      moteur.particule(x, h, z, Math.cos(a) * f, 1 + Math.random() * 3.5, Math.sin(a) * f, 0.35 + Math.random() * 0.4, 0.16 + Math.random() * 0.14, 0.03, r, v, b, 0.95, -11, 0);
    }
  }
  function etincelles(x, h, z, n, r, v, b, force) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, f = (force || 5) * (0.3 + Math.random());
      moteur.particule(x, h, z, Math.cos(a) * f, Math.random() * f, Math.sin(a) * f, 0.2 + Math.random() * 0.3, 0.09, 0.01, r, v, b, 1, -9, 1);
    }
  }
  function poussiere(x, h, z, n, taille) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, f = 0.5 + Math.random() * 1.5;
      moteur.particule(x + Math.cos(a) * 0.4, h + Math.random() * 0.4, z + Math.sin(a) * 0.4, Math.cos(a) * f, 0.6 + Math.random(), Math.sin(a) * f, 0.7 + Math.random() * 0.7, (taille || 0.5) * 0.6, (taille || 0.5) * 2.2, 0.62, 0.38, 0.26, 0.4, 0.4, 0);
    }
  }
  function explosionFx(x, z, rayon, genre) {
    const gros = rayon >= 6, n = Math.round(14 + rayon * 5);
    // genre 0 : crachat qui s'écrase (acide) ; 3 : bombardier (orange et vert) ; 5 : plasma (bleu) ; sinon feu.
    let c = [1, 0.62, 0.22];
    if (genre === 0) c = [0.7, 1, 0.25];
    if (genre === 5) c = [0.45, 0.8, 1];
    if (genre === 0) { giclee(x, 0.6, z, 8, 0.55, 0.95, 0.2, 2.5); moteur.tache(x, z, 0.8, 0.45, 0.8, 0.15, 0.55, 6); return; }
    moteur.lumiere(x, 1.5, z, c[0] * 3, c[1] * 3, c[2] * 3, rayon * 3.2);
    moteur.particule(x, 1, z, 0, 0.5, 0, 0.22, rayon * 0.9, rayon * 2.6, c[0], c[1], c[2], 0.95, 0, 1);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, f = rayon * (0.5 + Math.random() * 1.6), e = Math.random();
      moteur.particule(x, 0.4 + Math.random(), z, Math.cos(a) * f, 1.5 + Math.random() * rayon * 1.3, Math.sin(a) * f, 0.35 + Math.random() * 0.55, rayon * 0.28, rayon * 0.05, melange(c[0], 1, e * 0.5), melange(c[1], 0.9, e * 0.4), c[2], 1, -6, 1);
    }
    for (let i = 0; i < n / 2; i++) {
      const a = Math.random() * TAU, f = rayon * (0.2 + Math.random() * 0.7);
      moteur.particule(x + Math.cos(a) * f, 0.6 + Math.random() * 1.5, z + Math.sin(a) * f, Math.cos(a) * 1.2, 1.2 + Math.random() * 2, Math.sin(a) * 1.2, 1 + Math.random() * 1.2, rayon * 0.35, rayon * 0.95, 0.2, 0.17, 0.2, 0.55, 0.6, 0);
    }
    if (genre === 3) giclee(x, 0.8, z, 16, 0.6, 1, 0.2, 5);
    moteur.tache(x, z, rayon * 0.75, 0.08, 0.05, 0.05, 0.6, gros ? 30 : 16);
    const d = Math.hypot(x - cam.x, z - cam.z);
    secousse = Math.max(secousse, borner((gros ? 1.3 : 0.75) * (1 - d / (rayon * 7)), 0, 1));
  }

  // ------------------------------------------------------------------------
  // Effets envoyés par la simulation (etat.fx) : images, sons, affichage
  // ------------------------------------------------------------------------
  const COULEUR_SANG = [[0.5, 1, 0.2], [0.95, 0.3, 0.8], [0.8, 1, 0.25], [0.4, 0.7, 1], [1, 0.55, 0.15], [0.6, 1, 0.3], [0.7, 0.5, 1]];
  const SON_MORT = ['mort_rampant', 'mort_guerrier', 'mort_guerrier', 'mort_gros', 'mort_rampant', 'mort_gros', 'mort_rampant'];

  function traiterEffets() {
    const E = partie.etat;
    if (!E || !E.fx) return;
    for (let i = 0; i < E.fx.length; i++) {
      const f = E.fx[i];
      if (f[0] <= dernierFx) continue;
      effet(f, E);
    }
    dernierFx = Math.max(dernierFx, E.k);
  }

  function effet(f, E) {
    const code = f[1], moi = partie.camp;
    switch (code) {
      case FX.TIR: {
        if (f[2] === moi && !modeDemo) break;            // mon tir est déjà montré, sans attendre
        const J = E.j[f[2]];
        moteur.traceur(J.x, 1.3, J.y, f[4], 0.9, f[5], 0.05, 1, 0.75, 0.35, 0.09);
        moteur.lumiere(J.x, 1.4, J.y, 2.5, 1.6, 0.6, 6);
        son3d(['tir_pistolet', 'tir_fusil', 'tir_dispersion', 'tir_precision', 'tir_plasma'][f[3]] || 'tir_pistolet', J.x, J.y, 0.7);
        break;
      }
      case FX.TOUCHE: {
        const v = vues.get(f[2]);
        if (v) v.eclat = 1;
        break;
      }
      case FX.MORT: {
        const type = f[2], x = f[3], y = f[4], v = vues.get(f[6]);
        const c = COULEUR_SANG[type] || COULEUR_SANG[0], A = ALIENS[type];
        cadavres.push({ type, x, z: y, lacet: v ? v.lacet : 0, t: 0, echelle: v ? v.echelle : 1 });
        vues.delete(f[6]);
        giclee(x, A.hauteur * 0.5, y, type === 5 ? 60 : type === 3 ? 26 : 9, c[0], c[1], c[2], type >= 3 && type !== 4 ? 6 : 3.5);
        moteur.tache(x, y, A.rayon * (1.2 + Math.random() * 0.8), c[0] * 0.5, c[1] * 0.6, c[2] * 0.4, 0.6, 22);
        son3d(SON_MORT[type], x, y, type === 5 ? 1 : 0.8);
        if (f[5] === moi) compterTue(type);
        if (type === 5) { son3d('explosion_grosse', x, y, 1); annoncer(t('annonce.bossMort'), '', false); }
        break;
      }
      case FX.EXPLOSION: {
        const genre = f[5];
        explosionFx(f[2], f[3], f[4], genre);
        if (genre === 0) son3d('crachat_impact', f[2], f[3], 0.6);
        else if (genre === 6) son3d('explosion', f[2], f[3], 0.55, 1.3);
        else son3d(genre === 4 || genre === 7 ? 'explosion_grosse' : 'explosion', f[2], f[3], 1);
        break;
      }
      case FX.TOURELLE: {
        const T = E.tu[f[2]], p = CARTE.tourelles[f[2]], lourde = T.t === 2;
        const h = lourde ? 1.5 : 1.25;
        moteur.traceur(p[0] + T.dx * 0.9, h, p[1] + T.dy * 0.9, f[3], 0.7, f[4], lourde ? 0.12 : 0.045, 1, lourde ? 0.5 : 0.8, 0.3, lourde ? 0.16 : 0.07);
        moteur.lumiere(p[0] + T.dx, h, p[1] + T.dy, 2.2, 1.4, 0.5, lourde ? 9 : 5);
        etincelles(p[0] + T.dx * 1.1, h, p[1] + T.dy * 1.1, lourde ? 8 : 2, 1, 0.8, 0.4, 3);
        tirsTourelles[f[2]] = tempsJeu;
        son3d(lourde ? 'tourelle_lourde_tir' : 'tourelle_tir', p[0], p[1], 0.5);
        break;
      }
      case FX.CRACHAT: son3d('crachat', f[2], f[3], 0.7); break;
      case FX.COUP_SAS:
        son3d('porte_coup', CARTE.sas.x, CARTE.sas.y, 0.9);
        etincelles(hasard(-3, 3), hasard(0.5, 3), 1.1, 6, 1, 0.7, 0.3, 4);
        sasTouche();
        break;
      case FX.COUP_JOUEUR:
        if (f[2] === moi) joueurTouche(f[3], f[4], f[5]);
        break;
      case FX.A_TERRE:
        if (f[2] === moi) { SON.jouer('a_terre'); annoncer(t('annonce.aTerre'), E.nj === 1 ? t('annonce.secondeChance') : t('annonce.attendsAide'), true); }
        break;
      case FX.REANIME:
        if (f[2] === moi) { SON.jouer('reanime'); recalerJoueur(); }
        break;
      case FX.VAGUE:
        debutVague(f[2], f[3], f[4]);
        break;
      case FX.FIN_VAGUE:
        finVagueVue(f[2], f[3]);
        break;
      case FX.EVENEMENT:
        if (f[2] === 1) {
          const g = CARTE.galeries[3];
          annoncer(t('annonce.breche'), t('annonce.brecheDetail'), true);
          son3d('breche', g[0], g[1], 1);
          poussiere(g[0], 0.2, g[1], 40, 1.6);
          secousse = Math.max(secousse, 0.8);
        } else if (f[2] === 2) { annoncer(t('annonce.ruee'), t('annonce.rueeDetail'), true); SON.jouer('cri_alien'); }
        break;
      case FX.MUE: {
        son3d('mue', f[3], f[4], 0.9);
        giclee(f[3], 1, f[4], 10, 0.9, 1, 0.3, 3);
        const v = vues.get(f[2]);
        if (v) v.eclat = 1;
        if (!mueVue) { mueVue = true; fil(t('fil.mue'), true); }
        break;
      }
      case FX.PONTE: son3d('boss_ponte', f[2], f[3], 0.9); break;
      case FX.ECLOSION: giclee(f[2], 0.4, f[3], 8, 0.7, 0.5, 1, 3); son3d('mort_rampant', f[2], f[3], 0.35, 1.5); break;
      case FX.TOURELLE_PERDUE: {
        const p = CARTE.tourelles[f[2]];
        explosionFx(p[0], p[1], 3, 1);
        son3d('tourelle_detruite', p[0], p[1], 1);
        fil(t('fil.tourellePerdue'), true);
        break;
      }
      case FX.BARRICADE_PERDUE: {
        const p = CARTE.barricades[f[2]];
        poussiere(p[0], 0.5, p[1], 24, 1.2);
        etincelles(p[0], 1, p[1], 20, 1, 0.8, 0.5, 6);
        son3d('tourelle_detruite', p[0], p[1], 0.8, 0.8);
        fil(t('fil.barricadePerdue'), true);
        break;
      }
      case FX.COUP_TOURELLE: { const p = CARTE.tourelles[f[2]]; etincelles(p[0], 1.2, p[1], 4, 1, 0.8, 0.4, 3); break; }
      case FX.COUP_BARRICADE: { const p = CARTE.barricades[f[2]]; etincelles(p[0] + hasard(-1, 1), 1, p[1] + hasard(-1, 1), 3, 1, 0.8, 0.4, 3); son3d('porte_coup', p[0], p[1], 0.3, 1.5); break; }
      case FX.ACHAT:
        if (f[2] === moi) achatVu(f[3], f[4]);
        break;
      case FX.OBJET: objetVu(f[2], f[3], f[4], f[5], E); break;
      case FX.PLASMA: {
        const J = E.j[f[2]];
        projectiles.push({ genre: 5, x0: J.x, z0: J.y, y0: 1.3, x1: f[3], z1: f[4], t: 0, duree: f[5] / TPS });
        break;
      }
      case FX.DEFAITE: break;                               // montrée par la boucle (fin de partie)
      case FX.PHASE_BOSS:
        SON.jouer('boss_rugissement');
        secousse = Math.max(secousse, 0.9);
        annoncer(t('annonce.bossPhase' + f[3]), '', true);
        break;
      case FX.CREDITS: break;
      default: break;
    }
  }

  function objetVu(camp, objet, x, y, E) {
    const J = E.j[camp], moi = camp === partie.camp;
    if (objet === 1) {
      projectiles.push({ genre: 1, x0: J.x, z0: J.y, y0: 1.4, x1: x, z1: y, t: 0, duree: D.grenade.vol });
      son3d('grenade_lancer', J.x, J.y, 0.8);
    } else if (objet === 2) son3d('mine_pose', x, y, 0.9);
    else if (objet === 3) { if (moi) { SON.jouer('kit_soins'); eclairSoin = 1; } }
    else if (objet === 4) { son3d('bouclier', x, y, 1); for (let i = 0; i < 30; i++) { const a = i / 30 * TAU; moteur.particule(x + Math.cos(a) * 1.2, 0.2, y + Math.sin(a) * 1.2, 0, 2.5, 0, 0.8, 0.25, 0.05, 0.4, 0.9, 1, 1, 0, 1); } }
    else if (objet === 5) { son3d('frappe_aerienne', x, y, 1); projectiles.push({ genre: 4, x0: x, z0: y, y0: 60, x1: x, z1: y, t: 0, duree: CAPACITES[1].delai }); }
    else if (objet === 6) {
      son3d('ralentissement', x, y, 1);
      for (let i = 0; i < 60; i++) { const a = Math.random() * TAU, r = Math.random() * CAPACITES[2].rayon; moteur.particule(x + Math.cos(a) * r, 0.3, y + Math.sin(a) * r, 0, 0.8, 0, 1.4, 0.3, 0.6, 0.5, 0.6, 1, 0.8, 0, 1); }
      zoneRalentie = { x, y, fin: tempsJeu + CAPACITES[2].duree };
    } else if (objet === 7) {
      son3d('soin', x, y, 1);
      for (let i = 0; i < 50; i++) { const a = Math.random() * TAU, r = Math.random() * CAPACITES[3].rayon; moteur.particule(x + Math.cos(a) * r, 0.2, y + Math.sin(a) * r, 0, 2 + Math.random() * 2, 0, 1.1, 0.2, 0.05, 0.5, 1, 0.5, 1, 0, 1); }
      if (moi) eclairSoin = 1;
    }
  }
  let zoneRalentie = null, eclairSoin = 0, mueVue = false, modeDemo = false;

  // ------------------------------------------------------------------------
  // Dessin d'une image du monde
  // ------------------------------------------------------------------------
  function majPrecedents(P) {
    if (!P || P.k === precK) return;
    precK = P.k;
    precParId.clear();
    for (let i = 0; i < P.e.length; i++) precParId.set(P.e[i].i, P.e[i]);
  }

  const MARCHE = [7, 4.2, 4.5, 2.4, 6, 1.6, 0];       // pas des pattes par mètre parcouru
  function nomMaille(e) {
    if (e.t === 1 && e.st === 2) return CREA.guerrierMue;
    return CREA[NOMS_ALIENS[e.t]];
  }

  function dessinerAliens(E, P, a) {
    const vus = E.k;
    for (let i = 0; i < E.e.length; i++) {
      const e = E.e[i];
      if (e.mo) continue;
      const p = precParId.get(e.i);
      const x = p ? melange(p.x, e.x, a) : e.x, z = p ? melange(p.y, e.y, a) : e.y;
      let v = vues.get(e.i);
      if (!v) {
        v = { lacet: Math.atan2(e.dx, e.dy), eclat: 0, ne: tempsJeu, vu: vus, x, z, echelle: 1 };
        if (e.t === 5) v.echelle = 1 + Math.min(0.5, Math.floor((E.v - 1) / 5) * 0.08);
        vues.set(e.i, v);
        if (e.t !== 6) poussiere(x, 0.2, z, e.t === 5 ? 20 : 3, e.t === 5 ? 2 : 0.6);
      }
      v.vu = vus; v.x = x; v.z = z;
      v.lacet += ecartAngle(v.lacet, Math.atan2(e.dx, e.dy)) * Math.min(1, dtImage * 9);
      if (v.eclat > 0) v.eclat = Math.max(0, v.eclat - dtImage * 6);
      const C = nomMaille(e), A = ALIENS[e.t];
      if (!C) continue;
      const age = tempsJeu - v.ne;
      let ech = v.echelle * (age < 0.4 ? 0.35 + age / 0.4 * 0.65 : 1);
      let h = 0, marche = C.foulee ? e.d * TAU / C.foulee : e.d * MARCHE[e.t], ampli = 1;
      if (e.st === 1) { marche += tempsJeu * 14; ampli = 0.7; h = Math.abs(Math.sin(tempsJeu * 9 + e.i)) * 0.12 * A.hauteur; }   // il frappe
      if (e.t === 6) { ech *= 1 + Math.sin(tempsJeu * 8 + e.i) * 0.08 * (1 - e.tm / 70); ampli = 0; }
      if (e.t === 4) ech *= 1 + Math.sin(tempsJeu * 10 + e.i) * 0.06;
      // Ralenti : teinte bleutée ; boss enragé : rouge.
      let tr = 1, tv = 1, tb = 1, emissif = 0;
      if (e.sl > 0) { tr = 0.6; tv = 0.75; tb = 1.5; }
      if (e.t === 5 && e.ph === 3) { tr = 1.6; tv = 0.6; tb = 0.6; emissif = 0.25; }
      moteur.poser(C.maillage, x, h, z, v.lacet, ech, tr, tv, tb, v.eclat, marche, ampli, emissif, 1);
      moteur.disque(x, z, A.rayon * 1.25 * ech, 0, 0, 0, 0.38);
    }
    // Vues des aliens disparus sans effet de mort (éclosion, fin de partie) : oubliées.
    if (vues.size > E.e.length + 40) for (const [id, v] of vues) if (v.vu < vus - 40) vues.delete(id);
  }

  function dessinerCadavres() {
    for (let i = cadavres.length - 1; i >= 0; i--) {
      const c = cadavres[i];
      c.t += dtImage;
      const k = c.t / 0.55;
      if (k >= 1) { cadavres.splice(i, 1); continue; }
      const C = CREA[NOMS_ALIENS[c.type]];
      if (!C) continue;
      moteur.poserMat(C.maillage, matriceTrs(c.x, -k * 0.2, c.z, c.lacet, c.echelle * (1 + k * 0.25), c.echelle * (1 - k * 0.8), c.echelle * (1 + k * 0.25)), 0.7, 1, 0.7, 0.4 * (1 - k), 0, 0, 0, 1 - k * 0.7);
    }
  }
  const matTemp = new Float32Array(16);
  function matriceTrs(x, h, z, lacet, ex, ey, ez) { moteur.mat.trs(matTemp, x, h, z, lacet, ex, ey, ez); return matTemp; }

  function dessinerObjets(E, a) {
    let i;
    // Crachats.
    for (i = 0; i < E.p.length; i++) {
      const p = E.p[i];
      const x = p.x + p.vx * a / TPS, z = p.y + p.vy * a / TPS;
      moteur.poser(CREA.crachat.maillage, x, 1.1, z, Math.atan2(p.vx, p.vy), 1, 1, 1, 1, 0, 0, 0, 1, 1);
      if (Math.random() < 0.6) moteur.particule(x, 1.1, z, 0, 0.3, 0, 0.3, 0.22, 0.02, 0.7, 1, 0.25, 0.8, 0, 1);
      moteur.disque(x, z, 0.4, 0.5, 1, 0.2, 0.25);
    }
    // Mines.
    for (i = 0; i < E.m.length; i++) {
      const m = E.m[i];
      moteur.poser(MAILLES.mine, m.x, 0, m.y, m.i, 1, 1, 1, 1, 0, 0, 0, m.t > 0 || Math.sin(tempsJeu * 6 + m.i) > 0.6 ? 0.9 : 0, 1);
    }
    // Explosions annoncées (frappe aérienne : cercle au sol).
    for (i = 0; i < E.x.length; i++) {
      const x = E.x[i];
      if (x.g === 4) { moteur.anneau(x.x, x.y, x.r, 0.25, 1, 0.3, 0.2, 0.9); moteur.disque(x.x, x.y, x.r * (1 - x.t / (CAPACITES[1].delai * TPS)), 1, 0.3, 0.1, 0.25); }
    }
    // Grenades, plasma et frappes en vol.
    for (i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      p.t += dtImage;
      const k = p.t / p.duree;
      if (k >= 1) { projectiles.splice(i, 1); continue; }
      const x = melange(p.x0, p.x1, k), z = melange(p.z0, p.z1, k);
      if (p.genre === 1) {
        const h = melange(p.y0, 0.2, k) + Math.sin(k * Math.PI) * 3.2;
        moteur.poser(MAILLES['grenade-a'], x, h, z, k * 20, 1.6, 1, 1, 1, 0, 0, 0, 0.2, 1);
        moteur.disque(x, z, 0.3, 0, 0, 0, 0.4);
      } else if (p.genre === 5) {
        moteur.poser(MAILLES.plasma, x, 1.3, z, tempsJeu * 9, 1, 1, 1, 1, 0, 0, 0, 1, 1);
        moteur.lumiere(x, 1.3, z, 0.6, 1.2, 2.2, 7);
        for (let n = 0; n < 2; n++) moteur.particule(x, 1.3, z, hasard(-1, 1), hasard(-1, 1), hasard(-1, 1), 0.3, 0.35, 0.02, 0.45, 0.8, 1, 0.9, 0, 1);
      } else if (p.genre === 4) {
        const h = melange(p.y0, 0, k * k);
        moteur.traceur(x + 6, h + 14, z + 4, x, h, z, 0.5, 1, 0.5, 0.2, 0.05);
        moteur.lumiere(x, 2, z, 1.5 * k, 0.6 * k, 0.3 * k, 14);
      }
    }
    if (zoneRalentie) {
      if (tempsJeu > zoneRalentie.fin) zoneRalentie = null;
      else moteur.anneau(zoneRalentie.x, zoneRalentie.y, CAPACITES[2].rayon, 0.2, 0.5, 0.6, 1, 0.5);
    }
  }

  function dessinerDefenses(E) {
    let i;
    const prepa = E.ph === 0;
    for (i = 0; i < E.tu.length; i++) {
      const T = E.tu[i], p = CARTE.tourelles[i];
      if (!T.t) {
        if (prepa) moteur.anneau(p[0], p[1], 1.2, 0.12, 1, 0.65, 0.25, 0.55 + Math.sin(tempsJeu * 3) * 0.2);
        continue;
      }
      const lourde = T.t === 2, D2 = D.tourelles[T.t];
      const ech = (lourde ? 2.9 : 1.9) * (1 + (T.n - 1) * 0.12);
      const recul = Math.max(0, 1 - (tempsJeu - tirsTourelles[i]) * (lourde ? 3 : 14));
      const lacet = Math.atan2(T.dx, T.dy);
      // La tourelle lourde est plus grosse et sombre ; le niveau 3 est doré.
      const teinte = lourde ? (T.n === 3 ? [0.85, 0.6, 0.4] : [0.55, 0.5, 0.62]) : (T.n === 3 ? [1.2, 1.05, 0.7] : [1, 1, 1]);
      moteur.poser(MAILLES['turret-double'], p[0] - T.dx * recul * 0.12, 0, p[1] - T.dy * recul * 0.12, lacet + ORIENTATION_TOURELLE, ech, teinte[0], teinte[1], teinte[2], recul * 0.25, 0, 0, 0, 1);
      moteur.disque(p[0], p[1], 1.5, 0, 0, 0, 0.4);
      const sante = T.pv / D2.pv[T.n - 1];
      if (sante < 0.45 && Math.random() < 0.25) moteur.particule(p[0] + hasard(-0.3, 0.3), 1.4, p[1] + hasard(-0.3, 0.3), 0, 1.6, 0, 1.2, 0.3, 0.9, 0.15, 0.13, 0.15, 0.5, 0.3, 0);
      if (prepa) moteur.anneau(p[0], p[1], D2.portee[T.n - 1], 0.08, 0.45, 0.85, 1, 0.22);
    }
    for (i = 0; i < E.ba.length; i++) {
      const B = E.ba[i], p = CARTE.barricades[i];
      if (B.pv <= 0) { if (prepa && gradeJoueur >= D.boutique[12].grade) moteur.anneau(p[0], p[1], 1.6, 0.1, 0.5, 0.9, 1, 0.4); continue; }
      const sante = B.pv / D.barricade.pv;
      moteur.poser(MAILLES.barricade, p[0], 0, p[1], 0, 1.15, 1, 0.55 + sante * 0.45, 0.55 + sante * 0.45, 0, 0, 0, 0, 1);
      moteur.disque(p[0], p[1], 2.2, 0, 0, 0, 0.35);
    }
    // Le sas : lueur d'alarme quand il est presque détruit.
    const pv = E.sas / E.sasMax;
    if (pv < 0.3 && Math.sin(tempsJeu * 7) > 0) moteur.lumiere(0, 3, 2.5, 2.4, 0.2, 0.2, 14);
    else moteur.lumiere(0, 3.2, 2.6, 0.25, 0.7, 0.9, 10);
    if (pv < 0.6 && Math.random() < (0.6 - pv) * 0.5) etincelles(hasard(-3, 3), hasard(0.5, 3.4), 1.2, 2, 1, 0.8, 0.5, 2.5);
  }
  let ORIENTATION_TOURELLE = 0;   // réglé avec le décor (sens du modèle Kenney)

  function dessinerEquipe(E, P, a) {
    for (let c = 0; c < 4; c++) {
      if (c === partie.camp && !modeDemo) continue;
      const J = E.j[c];
      if (!J.on) continue;
      const p = P ? P.j[c] : J;
      const x = melange(p.x, J.x, a), z = melange(p.y, J.y, a);
      const m = MAILLES['astronaut-a'];
      if (!m) continue;
      if (J.at === 0) moteur.poser(m, x, 0, z, J.la + ORIENTATION_ASTRONAUTE, 2.25, COULEURS_JOUEURS[c][0], COULEURS_JOUEURS[c][1], COULEURS_JOUEURS[c][2], 0, 0, 0, J.bo > 0 ? 0.35 : 0, 1);
      else moteur.poserMat(m, matriceCouche(x, z, J.la), 0.7, 0.7, 0.7, 0, 0, 0, 0, J.at === 2 ? 0.4 : 1);
      moteur.disque(x, z, 0.6, 0, 0, 0, 0.4);
      if (J.bo > 0) moteur.anneau(x, z, 1, 0.08, 0.4, 0.9, 1, 0.8);
    }
  }
  let ORIENTATION_ASTRONAUTE = 0;
  const COULEURS_JOUEURS = [[1, 1, 1], [0.6, 1, 0.7], [1, 0.8, 0.5], [0.8, 0.7, 1]];
  const matCouche = new Float32Array(16), matRot = new Float32Array(16);
  function matriceCouche(x, z, lacet) {
    moteur.mat.trs(matCouche, x, 0.3, z, lacet, 2.25, 2.25, 2.25);
    moteur.mat.rotX(matRot, Math.PI / 2);
    moteur.mat.mul(matTemp, matCouche, matRot);
    return matTemp;
  }

  // Une image : caméra déjà posée dans cam.
  function dessinerMonde() {
    const E = partie.etat, P = partie.prec, a = partie.alpha();
    majPrecedents(P);
    // Nuit et brèche : transitions douces.
    nuitVue += ((E.nuit ? 1 : 0) - nuitVue) * Math.min(1, dtImage * 0.8);
    brecheVue += ((E.br ? 1 : 0) - brecheVue) * Math.min(1, dtImage * 2);
    moteur.ambiance({ nuit: nuitVue });
    if (secousse > 0) secousse = Math.max(0, secousse - dtImage * 2.2);
    cam.secousse = secousse;
    cam.temps = tempsJeu;
    moteur.debut(cam);
    dessinerDecor();
    dessinerBreche();
    dessinerDefenses(E);
    dessinerAliens(E, P, a);
    dessinerCadavres();
    dessinerObjets(E, a);
    dessinerEquipe(E, P, a);
  }

  // ==========================================================================
  // 2 bis. Le décor : bunker et son sas, canyon, galeries des aliens, rochers
  // Modèles Kenney (CC0) mis à l'échelle ; rien ici ne touche à la simulation
  // (les obstacles, eux, sont dans ses données : CARTE.obstacles).
  // ==========================================================================
  function construireDecor() {
    // Hasard répétable : le décor est le même à chaque partie.
    let graine = 20261112;
    const h = () => { graine = (graine * 1103515245 + 12345) & 0x7fffffff; return graine / 0x7fffffff; };
    const TEINTE_ROCHE = [0.78, 0.5, 0.42], TEINTE_SOMBRE = [0.55, 0.36, 0.34];

    // --- Bunker : façade au sud, sur toute la largeur ------------------------
    const L = 4, H = 4.6;
    for (let i = -6; i < 6; i++) {
      const x = i * L + L / 2;
      if (Math.abs(x) < 4) continue;                       // la place du sas
      decor(i % 3 === 0 ? 'st-wall-pillar' : 'st-wall', x, 0, 0.2, 0, [L, H, 3.2]);
      decor(i % 2 === 0 ? 'st-wall-banner' : 'st-wall', x, H, -0.4, 0, [L, H * 0.8, 3.2], [0.85, 0.85, 0.9]);
    }
    decor('st-wall-door-wide', 0, 0, 0.2, 0, [8, H, 3.2]);
    decor('st-wall-banner', -2, H, -0.4, 0, [L, H * 0.8, 3.2], [0.85, 0.85, 0.9]);
    decor('st-wall-banner', 2, H, -0.4, 0, [L, H * 0.8, 3.2], [0.85, 0.85, 0.9]);
    // Le sas lui-même (sa couleur change avec ses dégâts : dessiné à part, dessinerSas).
    // Toit : antennes et machines.
    decor('satellite-dish-large', -11, H * 1.8, -2.5, 0.5, 5);
    decor('satellite-dish-detailed', 15, H * 1.8, -2.5, -0.7, 3.4);
    decor('chimney-detailed', 8, H * 1.8, -2.5, 0, 2.2);
    decor('machine-generator-large', -4, H * 1.8, -2.6, 0, 3);
    // Dalle devant le bunker.
    for (let i = -3; i < 3; i++) decor('platform-large', i * 8 + 4, -0.05, 3.2, 0, [4, 1.2, 2.6], [0.42, 0.4, 0.47]);
    // Matériel au pied de la façade.
    decor('st-container-tall', -20.5, 0, 2.6, 0.2, 3);
    decor('st-container-wide', -17.6, 0, 2.4, -0.1, 2.8);
    decor('st-container', -18.6, 2, 2.5, 0.4, 2.6);
    decor('barrels', 20, 0, 2.6, 0.3, 3.2);
    decor('barrel', 17.8, 0, 2.2, 0, 3.4);
    decor('machine-generator', 12.5, 0, 2.3, Math.PI, 3.2);
    decor('machine-barrel-large', -12.5, 0, 2.4, 0, 2.8);
    decor('rover', 21.5, 0, 7, -0.9, 4.2);
    decor('st-computer-system', 5.6, 0, 1.9, Math.PI, 2.4);

    // --- Emplacements de tourelle : une dalle ---------------------------------
    for (const p of CARTE.tourelles) decor('platform-large', p[0], 0.02, p[1], 0, [1.25, 1.4, 1.25], [0.6, 0.6, 0.68]);

    // --- Obstacles de la simulation : rochers, cristaux, caisses, épave -------
    const MODELES_OBSTACLES = ['rock-large-a', 'rock-crystals-large-a', 'craft-cargo-a', 'rock-large-b', 'rock-crystals-large-b', 'meteor-detailed',
      'st-container-wide', 'st-container-wide', 'rock-large-a', 'rock-large-b', 'rock-crystals-large-a', 'rock-large-a'];
    CARTE.obstacles.forEach((O, i) => {
      const nom = MODELES_OBSTACLES[i % MODELES_OBSTACLES.length], m = MAILLES[nom];
      if (!m) return;
      const large = Math.max(m.max[0] - m.min[0], m.max[2] - m.min[2]);
      const e = O[2] * 2.15 / large;
      const caisse = nom.startsWith('st-'), epave = nom.startsWith('craft');
      decor(nom, O[0], epave ? -0.3 : 0, O[1], h() * TAU, caisse ? [e * 0.9, e * 0.55, e * 0.9] : epave ? e * 0.85 : [e, e * (1.3 + h() * 0.9), e], caisse || epave ? [1, 1, 1] : TEINTE_ROCHE);
      if (!caisse && !epave) decor('rocks-small-a', O[0] + O[2] * 1.1, 0, O[1] + O[2] * 0.6, h() * TAU, 2.6, TEINTE_ROCHE);
    });

    // --- Parois du canyon : gros rochers tout autour ----------------------------
    const paroi = (x, z) => {
      const e = 9 + h() * 9;
      decor(h() < 0.5 ? 'rock-large-a' : 'rock-large-b', x + (h() - 0.5) * 3, -0.5, z + (h() - 0.5) * 3, h() * TAU, [e, e * (1.2 + h() * 1.6), e], h() < 0.3 ? TEINTE_SOMBRE : TEINTE_ROCHE);
    };
    for (let z = 2; z <= 64; z += 6.5) { paroi(-29.5, z); paroi(29.5, z); }
    for (let x = -24; x <= 24; x += 6.5) { if (Math.abs(x) > 5) paroi(x, 66); }
    for (let i = 0; i < 10; i++) paroi((h() < 0.5 ? -1 : 1) * (36 + h() * 14), h() * 70);
    // Petits cailloux et cristaux semés sur l'esplanade (sans collision).
    for (let i = 0; i < 26; i++) {
      const x = (h() - 0.5) * 44, z = 6 + h() * 50;
      decor(h() < 0.7 ? 'rocks-small-b' : 'rocks-small-a', x, 0, z, h() * TAU, 1.2 + h() * 1.6, TEINTE_ROCHE);
    }
    decor('bones', -15, 0, 33, 1.2, 3.4, [0.9, 0.85, 0.8]);
    decor('bones', 17, 0, 46, -0.6, 2.8, [0.9, 0.85, 0.8]);

    // --- Galeries des aliens : cratères sombres encadrés de cristaux --------------
    for (let i = 0; i < 3; i++) {
      const G = CARTE.galeries[i];
      decor('crater-large', G[0], 0, G[1], h() * TAU, 9.5, TEINTE_SOMBRE);
      decor('rock-crystals-large-a', G[0] - 5, 0, G[1] + 1.5, h() * TAU, 7, TEINTE_SOMBRE);
      decor('rock-crystals-large-b', G[0] + 5, 0, G[1] + 1.5, h() * TAU, 7, TEINTE_SOMBRE);
    }

    ORIENTATION_TOURELLE = 0;
    ORIENTATION_ASTRONAUTE = 0;
    // Arme en main : [modèle, échelle, x, y, z, rotation Y, bouche du canon x, y, z] (repère de la caméra).
    VUE_ARMES.push(
      ['blaster-b', 0.4, 0.17, -0.15, 0.42, Math.PI, 0, 0.03, 0.12],
      ['blaster-d', 0.4, 0.17, -0.16, 0.48, Math.PI, 0, 0.03, 0.22],
      ['blaster-q', 0.42, 0.17, -0.16, 0.46, Math.PI, 0, 0.03, 0.2],
      ['blaster-e', 0.36, 0.16, -0.15, 0.6, Math.PI, 0, 0.03, 0.52],
      ['blaster-o', 0.5, 0.18, -0.17, 0.44, Math.PI, 0, 0.03, 0.2]
    );
  }

  // Le sas : il s'assombrit et rougit quand il est abîmé.
  function dessinerSas(E) {
    const pv = borner(E.sas / E.sasMax, 0, 1);
    moteur.poser(MAILLES.sas, 0, 0, 0.7, 0, 1, 0.8 + (1 - pv) * 0.9, 0.45 + pv * 0.55, 0.45 + pv * 0.55, 0, 0, 0, 0, 1);
  }

  // La brèche près du sas : elle sort de terre quand la vague l'ouvre.
  function dessinerBreche() {
    dessinerSas(partie.etat);
    // Fond sombre des galeries.
    for (let i = 0; i < 3; i++) { const G = CARTE.galeries[i]; moteur.disque(G[0], G[1], 3.4, 0.03, 0.01, 0.04, 0.92); }
    if (brecheVue < 0.02) return;
    const G = CARTE.galeries[3], m = MAILLES['crater-large'];
    if (m) moteur.poser(m, G[0], -0.4 * (1 - brecheVue), G[1], 1.3, 8 * brecheVue, 0.55, 0.36, 0.34, 0, 0, 0, 0, 1);
    moteur.disque(G[0], G[1], 2.9 * brecheVue, 0.03, 0.01, 0.04, 0.92);
    if (Math.random() < 0.2) moteur.particule(G[0] + hasard(-2, 2), 0.3, G[1] + hasard(-2, 2), 0, 1.5, 0, 1.4, 0.4, 1.2, 0.3, 0.2, 0.2, 0.35, 0.3, 0);
  }

  // ==========================================================================
  // 3. Le joueur : commandes (clavier, souris, tactile), déplacement, tir
  // Le joueur est maître de son corps : il bouge ici sans attendre, puis envoie
  // sa position à la simulation (ordre BOUGER). C'est aussi son appareil qui
  // calcule qui il touche (ordre TIRER).
  // ==========================================================================
  const moi = {
    x: 0, y: 7, lacet: 0, tangage: 0,
    vx: 0, vy: 0, balancement: 0, pas: 0,
    recul: 0,                   // recul de l'arme (0..1)
    arme: 0,                    // arme tenue (prédite)
    chargeur: [0, 0, 0, 0, 0],  // munitions prédites
    recharge: 0,                // heure de fin de recharge (tempsJeu), 0 = pas de recharge
    prochainTir: 0,
    derniereAction: 0,          // dernière action d'arme (au-delà de 0,4 s, on se recale sur la simulation)
    changement: 0,              // heure du dernier changement d'arme (animation)
    dernierEnvoi: 0, envoiX: 0, envoiY: 0, envoiLacet: 0,
    cibleVue: null,             // alien sous le viseur
    rafale: 0,                  // dispersion qui monte en tir continu
    tirs: 0, touches: 0,        // statistiques de la partie
    tues: [0, 0, 0, 0, 0, 0, 0],
  };

  const touches = new Set();    // codes des touches enfoncées
  const entree = { avance: 0, cote: 0, tir: false, sprint: false, pointeur: false };
  const manette = { id: -1, x0: 0, y0: 0, dx: 0, dy: 0 };
  const regard = { id: -1, x: 0, y: 0 };
  let tirTactile = false;

  // --- Clavier ---------------------------------------------------------------
  const TOUCHES_ARMES = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5'];
  const TOUCHES_CAPACITES = ['KeyC', 'KeyF', 'KeyX', 'KeyV'];

  function surTouche(e, enfoncee) {
    const code = e.code;
    if (etatJeu !== 'jeu') {
      if (enfoncee && !e.repeat) toucheMenu(code, e);
      return;
    }
    if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'ShiftLeft', 'ShiftRight', 'Tab'].includes(code)) e.preventDefault();
    if (enfoncee) touches.add(code); else touches.delete(code);
    if (!enfoncee || e.repeat) return;
    const i = TOUCHES_ARMES.indexOf(code);
    if (i >= 0) changerArme(i);
    else if (code === 'KeyR') recharger();
    else if (code === 'KeyG') lancerGrenade();
    else if (code === 'KeyT') poserMine();
    else if (code === 'KeyH') utiliserKit();
    else if (code === 'KeyQ') armeSuivante(1);
    else if (TOUCHES_CAPACITES.includes(code)) utiliserCapacite(TOUCHES_CAPACITES.indexOf(code));
    else if (code === 'KeyB' || code === 'KeyE') { if (partie.etat.ph === 0) ouvrirBoutique(emplacementProche()); }
    else if (code === 'Enter' || code === 'NumpadEnter') pret();
    else if (code === 'Escape' || code === 'KeyP') ouvrirPause();
  }
  window.addEventListener('keydown', (e) => surTouche(e, true));
  window.addEventListener('keyup', (e) => surTouche(e, false));
  window.addEventListener('blur', () => { touches.clear(); entree.tir = false; });

  // --- Souris (pointeur verrouillé) --------------------------------------------
  function pointeurVerrouille() { return document.pointerLockElement === toile; }
  function verrouillerPointeur() {
    if (TACTILE || pointeurVerrouille() || !toile.requestPointerLock) return;
    try { const p = toile.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* refusé : visée à la souris en glissant */ }
  }
  let sortieVoulue = false;
  function libererPointeur() {
    if (!pointeurVerrouille()) return;
    sortieVoulue = true;
    try { document.exitPointerLock(); } catch (e) { /* rien */ }
  }
  document.addEventListener('pointerlockchange', () => {
    entree.pointeur = pointeurVerrouille();
    if (!entree.pointeur) {
      entree.tir = false;
      // Échap fait sortir le pointeur : c'est la pause.
      if (!sortieVoulue && etatJeu === 'jeu') ouvrirPause();
    }
    sortieVoulue = false;
  });
  document.addEventListener('pointerlockerror', () => { entree.pointeur = false; });

  function tournerRegard(dx, dy) {
    const s = meta.options.sens / 10;
    moi.lacet += dx * 0.0023 * s;
    moi.tangage = borner(moi.tangage - dy * 0.0023 * s * (meta.options.inverse ? -1 : 1), -1.2, 1.2);
    if (moi.lacet > Math.PI) moi.lacet -= TAU; else if (moi.lacet < -Math.PI) moi.lacet += TAU;
  }

  toile.addEventListener('mousedown', (e) => {
    if (TACTILE || etatJeu !== 'jeu') return;
    if (!pointeurVerrouille()) verrouillerPointeur();
    if (e.button === 0) entree.tir = true;
    SON.demarrer();
  });
  window.addEventListener('mouseup', (e) => { if (e.button === 0) entree.tir = false; });
  window.addEventListener('mousemove', (e) => {
    if (TACTILE || etatJeu !== 'jeu') return;
    // Pointeur verrouillé : tout mouvement vise. Sinon (verrou refusé) : on vise en glissant, bouton enfoncé.
    if (pointeurVerrouille() || e.buttons) tournerRegard(e.movementX || 0, e.movementY || 0);
  });
  toile.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('wheel', (e) => { if (etatJeu === 'jeu') armeSuivante(e.deltaY > 0 ? 1 : -1); }, { passive: true });

  // --- Tactile : manette à gauche, regard ailleurs, boutons ----------------------
  const elManette = $('manette');
  function debutToucher(e) {
    if (etatJeu !== 'jeu') return;
    SON.demarrer();
    for (const p of e.changedTouches) {
      const gauche = p.clientX < innerWidth * 0.45 && p.clientY > innerHeight * 0.42;
      if (gauche && manette.id < 0) {
        manette.id = p.identifier; manette.x0 = p.clientX; manette.y0 = p.clientY; manette.dx = 0; manette.dy = 0;
        elManette.style.left = p.clientX + 'px'; elManette.style.top = p.clientY + 'px'; elManette.classList.add('on');
        elManette.firstElementChild.style.transform = '';
      } else if (regard.id < 0) { regard.id = p.identifier; regard.x = p.clientX; regard.y = p.clientY; }
    }
    e.preventDefault();
  }
  function bougeToucher(e) {
    if (etatJeu !== 'jeu') return;
    for (const p of e.changedTouches) {
      if (p.identifier === manette.id) {
        let dx = p.clientX - manette.x0, dy = p.clientY - manette.y0;
        const l = Math.hypot(dx, dy), max = 52;
        if (l > max) { dx = dx / l * max; dy = dy / l * max; }
        manette.dx = dx / max; manette.dy = dy / max;
        elManette.firstElementChild.style.transform = `translate(${dx}px, ${dy}px)`;
      } else if (p.identifier === regard.id || p.identifier === tirId) {
        const ref = p.identifier === regard.id ? regard : tirPos;
        tournerRegard((p.clientX - ref.x) * 2.1, (p.clientY - ref.y) * 2.1);
        ref.x = p.clientX; ref.y = p.clientY;
      }
    }
    e.preventDefault();
  }
  function finToucher(e) {
    for (const p of e.changedTouches) {
      if (p.identifier === manette.id) { manette.id = -1; manette.dx = 0; manette.dy = 0; elManette.classList.remove('on'); }
      if (p.identifier === regard.id) regard.id = -1;
      if (p.identifier === tirId) { tirId = -1; tirTactile = false; $('b-tir').classList.remove('actif'); }
    }
  }
  toile.addEventListener('touchstart', debutToucher, { passive: false });
  toile.addEventListener('touchmove', bougeToucher, { passive: false });
  toile.addEventListener('touchend', finToucher);
  toile.addEventListener('touchcancel', finToucher);

  // Bouton de tir : maintenu, et le doigt qui le tient peut aussi viser en glissant.
  let tirId = -1;
  const tirPos = { x: 0, y: 0 };
  $('b-tir').addEventListener('touchstart', (e) => {
    const p = e.changedTouches[0];
    tirId = p.identifier; tirPos.x = p.clientX; tirPos.y = p.clientY; tirTactile = true;
    $('b-tir').classList.add('actif');
    SON.demarrer();
    e.preventDefault();
  }, { passive: false });
  $('b-tir').addEventListener('touchmove', bougeToucher, { passive: false });
  $('b-tir').addEventListener('touchend', finToucher);
  $('b-tir').addEventListener('touchcancel', finToucher);
  $('b-tir').addEventListener('mousedown', () => { entree.tir = true; });

  function boutonTactile(id, action) {
    const b = $(id);
    const faire = (e) => { e.preventDefault(); SON.demarrer(); if (etatJeu === 'jeu') action(); };
    b.addEventListener('touchstart', faire, { passive: false });
    b.addEventListener('click', (e) => { if (!TACTILE) faire(e); });
  }
  boutonTactile('b-recharge', () => recharger());
  boutonTactile('b-arme', () => armeSuivante(1));
  boutonTactile('b-grenade', () => lancerGrenade());
  boutonTactile('b-kit', () => utiliserKit());
  boutonTactile('b-mine', () => poserMine());

  // ------------------------------------------------------------------------
  // Déplacement
  // ------------------------------------------------------------------------
  function monEtat() { return partie.etat.j[partie.camp]; }

  function recalerJoueur() {
    const J = monEtat();
    moi.x = J.x; moi.y = J.y; moi.vx = 0; moi.vy = 0;
  }

  function deplacer(dt) {
    const E = partie.etat, J = monEtat();
    let avance = 0, cote = 0;
    if (touches.has('KeyW') || touches.has('ArrowUp')) avance += 1;
    if (touches.has('KeyS') || touches.has('ArrowDown')) avance -= 1;
    if (touches.has('KeyD') || touches.has('ArrowRight')) cote += 1;
    if (touches.has('KeyA') || touches.has('ArrowLeft')) cote -= 1;
    avance += -manette.dy; cote += manette.dx;
    let l = Math.hypot(avance, cote);
    if (l > 1) { avance /= l; cote /= l; l = 1; }
    const sprint = (touches.has('ShiftLeft') || touches.has('ShiftRight') || (manette.id >= 0 && l > 0.96)) && avance > 0.3 && !tirDemande();
    entree.sprint = sprint;
    const vitesse = J.at !== 0 ? 0 : sprint ? D.joueur.sprint : D.joueur.vitesse;
    const s = Math.sin(moi.lacet), c = Math.cos(moi.lacet);
    // avant = (sin, cos), droite = (cos, −sin)
    const vxVoulu = (s * avance + c * cote) * vitesse, vyVoulu = (c * avance - s * cote) * vitesse;
    const k = Math.min(1, dt * 12);
    moi.vx += (vxVoulu - moi.vx) * k; moi.vy += (vyVoulu - moi.vy) * k;
    let x = moi.x + moi.vx * dt, y = moi.y + moi.vy * dt;
    x = borner(x, CARTE.xMin, CARTE.xMax); y = borner(y, CARTE.yMin, CARTE.yMax);
    const R = D.joueur.rayon;
    const pousser = (ox, oy, r) => {
      const dx = x - ox, dy = y - oy, d2 = dx * dx + dy * dy, rr = r + R;
      if (d2 < rr * rr && d2 > 1e-6) { const d = Math.sqrt(d2); x = ox + dx / d * rr; y = oy + dy / d * rr; }
    };
    for (const O of CARTE.obstacles) pousser(O[0], O[1], O[2]);
    for (let i = 0; i < E.ba.length; i++) if (E.ba[i].pv > 0) pousser(CARTE.barricades[i][0], CARTE.barricades[i][1], CARTE.rayonBarricade);
    for (let i = 0; i < E.tu.length; i++) if (E.tu[i].t) pousser(CARTE.tourelles[i][0], CARTE.tourelles[i][1], CARTE.rayonTourelle);
    const parcouru = Math.hypot(x - moi.x, y - moi.y);
    moi.x = x; moi.y = y;
    // Balancement de la marche et bruit des pas.
    if (parcouru > 0.001) {
      moi.balancement += parcouru * (sprint ? 1.5 : 1.9);
      moi.pas += parcouru;
      if (moi.pas > 2.4) { moi.pas = 0; SON.jouer('pas', { volume: 0.35 }); }
    }
    // Position envoyée à la simulation : 10 fois par seconde au plus, et un signe de vie toutes les 2 s.
    const depuis = tempsJeu - moi.dernierEnvoi;
    const bouge = Math.abs(moi.x - moi.envoiX) > 0.02 || Math.abs(moi.y - moi.envoiY) > 0.02 || Math.abs(ecartAngle(moi.lacet, moi.envoiLacet)) > 0.02;
    if (J.at === 0 && ((bouge && depuis >= 0.095) || depuis >= 2)) {
      partie.ordre([1, Math.round(moi.x * 100), Math.round(moi.y * 100), Math.round(moi.lacet * 1000), sprint ? 1 : 0]);
      moi.dernierEnvoi = tempsJeu; moi.envoiX = moi.x; moi.envoiY = moi.y; moi.envoiLacet = moi.lacet;
    }
    // La simulation a refusé un déplacement (très rare) : on se recale si l'écart dure.
    if (J.at === 0 && Math.hypot(J.x - moi.x, J.y - moi.y) > 4) { moi.ecart = (moi.ecart || 0) + dt; if (moi.ecart > 0.6) { recalerJoueur(); moi.ecart = 0; } } else moi.ecart = 0;
  }

  // ------------------------------------------------------------------------
  // Viser : rayon du regard contre les aliens, les rochers et le sol
  // ------------------------------------------------------------------------
  const rayon = { ox: 0, oy: 0, oz: 0, dx: 0, dy: 0, dz: 0 };
  function rayonDuRegard(ecartLacet, ecartTangage) {
    const la = moi.lacet + (ecartLacet || 0), ta = moi.tangage + (ecartTangage || 0);
    const ct = Math.cos(ta);
    rayon.ox = moi.x; rayon.oy = moi.y; rayon.oz = cam.y;
    rayon.dx = Math.sin(la) * ct; rayon.dy = Math.cos(la) * ct; rayon.dz = Math.sin(ta);
    return rayon;
  }

  // Distance le long du rayon jusqu'à un cylindre debout (centre cx, cy ; rayon r ; hauteur h), ou −1.
  // zone : hauteur relative du point touché (0 pieds, 1 sommet), rendue dans touche.zone.
  const touche = { zone: 0 };
  function rayonCylindre(R, cx, cy, r, h) {
    const hl2 = R.dx * R.dx + R.dy * R.dy;
    if (hl2 < 1e-6) return -1;
    const t0 = ((cx - R.ox) * R.dx + (cy - R.oy) * R.dy) / hl2;
    if (t0 < 0) return -1;
    const px = R.ox + R.dx * t0 - cx, py = R.oy + R.dy * t0 - cy;
    const d2 = px * px + py * py;
    if (d2 > r * r) return -1;
    const tEntree = Math.max(0, t0 - Math.sqrt((r * r - d2) / hl2));
    const hEntree = R.oz + R.dz * tEntree, hMilieu = R.oz + R.dz * t0;
    if ((hEntree < -0.1 || hEntree > h + 0.15) && (hMilieu < -0.1 || hMilieu > h + 0.15)) return -1;
    touche.zone = borner((hMilieu >= -0.1 && hMilieu <= h + 0.15 ? hMilieu : hEntree) / h, 0, 1);
    return tEntree;
  }

  // Premier obstacle du décor sur le rayon (rochers, barricades, sol), au plus loin à « portee ».
  function rayonDecor(R, portee) {
    let tMin = portee;
    if (R.dz < -1e-4) { const tSol = -R.oz / R.dz; if (tSol < tMin) tMin = tSol; }
    for (const O of CARTE.obstacles) { const tt = rayonCylindre(R, O[0], O[1], O[2] * 0.92, O[2] * 1.25); if (tt >= 0 && tt < tMin) tMin = tt; }
    const E = partie.etat;
    for (let i = 0; i < E.ba.length; i++) if (E.ba[i].pv > 0) { const tt = rayonCylindre(R, CARTE.barricades[i][0], CARTE.barricades[i][1], CARTE.rayonBarricade * 0.9, 1.9); if (tt >= 0 && tt < tMin) tMin = tt; }
    return tMin;
  }

  // Aliens sur le rayon, du plus proche au plus loin : [{ e, t, zone }].
  const surRayon = [];
  function aliensSurRayon(R, portee, marge) {
    surRayon.length = 0;
    const E = partie.etat;
    for (let i = 0; i < E.e.length; i++) {
      const e = E.e[i];
      if (e.mo) continue;
      const v = vues.get(e.i), A = ALIENS[e.t];
      const ech = v ? v.echelle : 1;
      const tt = rayonCylindre(R, v ? v.x : e.x, v ? v.z : e.y, A.rayon * marge * ech, A.hauteur * ech);
      if (tt >= 0 && tt <= portee) surRayon.push({ e, t: tt, zone: touche.zone });
    }
    surRayon.sort((a, b) => a.t - b.t);
    return surRayon;
  }

  // ------------------------------------------------------------------------
  // Armes
  // ------------------------------------------------------------------------
  const DISPERSION = [0.008, 0.016, 0.085, 0.001, 0];      // radians
  const SONS_TIR = ['tir_pistolet', 'tir_fusil', 'tir_dispersion', 'tir_precision', 'tir_plasma'];
  const margeVisee = () => (TACTILE ? 1.5 : 1.15);

  function tirDemande() { return entree.tir || tirTactile || (meta.options.tirAuto && moi.cibleVue !== null); }

  function changerArme(n) {
    const J = monEtat();
    if (n === moi.arme || !(J.ar & (1 << n)) || J.at !== 0) return;
    moi.arme = n; moi.recharge = 0; moi.changement = tempsJeu; moi.derniereAction = tempsJeu;
    moi.prochainTir = Math.max(moi.prochainTir, tempsJeu + 0.25);
    partie.ordre([4, n]);
    SON.jouer('changement_arme');
  }
  function armeSuivante(sens) {
    const J = monEtat();
    for (let i = 1; i <= ARMES.length; i++) {
      const n = (moi.arme + sens * i + ARMES.length * 2) % ARMES.length;
      if (J.ar & (1 << n)) { changerArme(n); return; }
    }
  }
  function recharger() {
    const J = monEtat(), A = ARMES[moi.arme];
    if (J.at !== 0 || moi.recharge > 0 || moi.chargeur[moi.arme] >= A.chargeur || J.re[moi.arme] === 0) return;
    moi.recharge = tempsJeu + A.recharge; moi.derniereAction = moi.recharge;
    partie.ordre([5]);
    SON.jouer('recharge');
  }

  function tirer() {
    const a = moi.arme, A = ARMES[a];
    moi.chargeur[a] -= 1;
    moi.prochainTir = tempsJeu + 1 / A.cadence;
    moi.derniereAction = tempsJeu;
    moi.recul = 1; moi.tirs += 1;
    moi.rafale = Math.min(1, moi.rafale + 0.18);
    SON.jouer(SONS_TIR[a]);
    // Bouche du canon (pour l'éclair et le départ du trait).
    const s = Math.sin(moi.lacet), c = Math.cos(moi.lacet);
    const bx = moi.x + s * 0.7 + c * 0.2, bz = moi.y + c * 0.7 - s * 0.2, by = cam.y - 0.16;
    moteur.lumiere(bx, by, bz, 3, 2, 0.8, 7);
    eclairBouche = 1;
    moi.tangage = Math.min(1.2, moi.tangage + (a === 3 ? 0.03 : a === 2 ? 0.035 : 0.006));

    if (A.rayon) {                                         // lance-plasma : point visé
      const R = rayonDuRegard(0, 0);
      let tt = rayonDecor(R, A.portee);
      const L = aliensSurRayon(R, tt, margeVisee());
      if (L.length) tt = L[0].t;
      partie.ordre([3, a, Math.round((R.ox + R.dx * tt) * 100), Math.round((R.oy + R.dy * tt) * 100)]);
      return;
    }
    const ordre = [2, a];
    const disp = DISPERSION[a] * (a === 1 ? 0.6 + moi.rafale : 1) * (entree.sprint ? 1.6 : 1);
    let aTouche = false, critique = false;
    for (let p = 0; p < A.plombs; p++) {
      const R = rayonDuRegard((Math.random() - 0.5) * 2 * disp, (Math.random() - 0.5) * 2 * disp);
      let tFin = rayonDecor(R, A.portee);
      const L = aliensSurRayon(R, tFin, p === 0 ? margeVisee() : 1.1);
      const n = Math.min(L.length, A.perce);
      for (let i = 0; i < n; i++) {
        const h = L[i], e = h.e, AL = ALIENS[e.t];
        const zone = h.zone > 0.62 && e.t !== 3 && e.t !== 6 ? 1 : 0;
        ordre.push(e.i * 4 + zone);
        aTouche = true; if (zone) critique = true;
        // Effet immédiat sur ce que je vois : éclair de l'alien, giclée, bruit.
        const v = vues.get(e.i);
        if (v) v.eclat = 1;
        const ix = R.ox + R.dx * h.t, iy = R.oy + R.dy * h.t, iz = R.oz + R.dz * h.t;
        const blinde = AL.armure && ((moi.x - e.x) * e.dx + (moi.y - e.y) * e.dy) / (Math.hypot(moi.x - e.x, moi.y - e.y) || 1) > 0.25;
        if (blinde) { etincelles(ix, iz, iy, 5, 0.8, 0.9, 1, 4); if (p === 0) son3d('impact_carapace', ix, iy, 0.8); }
        else { const col = COULEUR_SANG[e.t]; giclee(ix, iz, iy, zone ? 5 : 3, col[0], col[1], col[2], 2.2); if (p === 0) son3d(zone ? 'critique' : 'impact_chair', ix, iy, 0.7); }
        if (i === n - 1 && n >= A.perce) tFin = h.t;      // le trait s'arrête au dernier alien traversé
      }
      if (!L.length && tFin < A.portee - 0.01 && p < 3) {
        // Impact dans le décor : poussière.
        poussiere(R.ox + R.dx * tFin, Math.max(0.05, R.oz + R.dz * tFin), R.oy + R.dy * tFin, 2, 0.25);
      }
      if (p < 4 || a !== 2) moteur.traceur(bx, by, bz, R.ox + R.dx * tFin, R.oz + R.dz * tFin, R.oy + R.dy * tFin, a === 3 ? 0.09 : 0.035, a === 3 ? 0.5 : 1, a === 3 ? 0.9 : 0.75, a === 3 ? 1 : 0.35, a === 3 ? 0.22 : 0.07);
    }
    if (aTouche) { moi.touches += 1; marqueurTouche(critique); }
    partie.ordre(ordre);
  }
  let eclairBouche = 0;

  function majArmes(dt) {
    const J = monEtat(), a = moi.arme, A = ARMES[a];
    // Recalage sur la simulation quand rien ne s'est passé depuis un moment.
    if (tempsJeu - moi.derniereAction > 0.4) {
      for (let i = 0; i < ARMES.length; i++) moi.chargeur[i] = J.mu[i];
      if (J.ac !== moi.arme && (J.ar & (1 << J.ac))) moi.arme = J.ac;
    }
    if (!(J.ar & (1 << moi.arme))) moi.arme = 0;
    if (moi.recharge > 0 && tempsJeu >= moi.recharge) {
      // Fin de recharge : le chargeur prédit se remplit (la simulation fait pareil).
      const besoin = A.chargeur - moi.chargeur[a];
      moi.chargeur[a] += J.re[a] < 0 ? besoin : Math.min(besoin, J.re[a]);
      moi.recharge = 0; moi.derniereAction = tempsJeu;
    }
    moi.recul = Math.max(0, moi.recul - dt * (a === 3 || a === 4 ? 3.5 : 9));
    moi.rafale = Math.max(0, moi.rafale - dt * 1.4);
    if (eclairBouche > 0) eclairBouche = Math.max(0, eclairBouche - dt * 14);

    // Alien sous le viseur (viseur orange, tir automatique).
    const R = rayonDuRegard(0, 0);
    const portee = A.portee;
    const L = aliensSurRayon(R, rayonDecor(R, portee), margeVisee() * (meta.options.tirAuto ? 1.25 : 1));
    moi.cibleVue = L.length ? L[0].e : null;

    if (J.at !== 0 || partie.etat.ph === 3) return;
    if (tirDemande() && tempsJeu >= moi.prochainTir && moi.recharge === 0) {
      if (moi.chargeur[a] > 0) tirer();
      else if (J.re[a] !== 0) recharger();
      else {
        // Plus de munitions : retour au pistolet.
        SON.jouer('arme_vide'); moi.prochainTir = tempsJeu + 0.4;
        if (a !== 0) { fil(t('fil.plusDeMunitions'), true); changerArme(0); }
      }
    }
    if (moi.chargeur[a] === 0 && moi.recharge === 0 && J.re[a] !== 0 && tempsJeu >= moi.prochainTir) recharger();
  }

  // --- Objets et capacités -------------------------------------------------------
  // Point du sol visé (au plus loin à « portee »).
  function pointVise(portee) {
    const R = rayonDuRegard(0, 0);
    let tt = rayonDecor(R, portee);
    const L = aliensSurRayon(R, tt, 1.2);
    if (L.length) tt = L[0].t;
    return [R.ox + R.dx * tt, R.oy + R.dy * tt];
  }
  function lancerGrenade() {
    const J = monEtat();
    if (J.at !== 0) return;
    if (J.gr <= 0) { SON.jouer('refus'); return; }
    const p = pointVise(D.grenade.portee);
    partie.ordre([7, 1, Math.round(p[0] * 100), Math.round(p[1] * 100)]);
  }
  function poserMine() {
    const J = monEtat();
    if (J.at !== 0) return;
    if (J.mn <= 0) { SON.jouer('refus'); return; }
    partie.ordre([7, 2, 0, 0]);
  }
  function utiliserKit() {
    const J = monEtat();
    if (J.at !== 0) return;
    if (J.ki <= 0 || J.pv >= D.joueur.pv) { SON.jouer('refus'); return; }
    partie.ordre([7, 3, 0, 0]);
  }
  function utiliserCapacite(n) {
    const J = monEtat(), C = CAPACITES[n];
    if (J.at !== 0 || gradeJoueur < C.grade) return;
    if (J.ca[n] > 0) { SON.jouer('refus'); return; }
    const p = n === 1 || n === 2 ? pointVise(n === 1 ? 60 : 45) : [0, 0];
    partie.ordre([7, 4 + n, Math.round(p[0] * 100), Math.round(p[1] * 100)]);
  }
  function pret() {
    if (partie.etat.ph === 0 && !monEtat().pr) { partie.ordre([8]); SON.jouer('clic'); }
  }

  // Emplacement de tourelle ou de barricade tout proche (préparation) : { genre, n } ou null.
  function emplacementProche() {
    let mieux = null, md = 3.2 * 3.2;
    CARTE.tourelles.forEach((p, n) => { const d = (p[0] - moi.x) ** 2 + (p[1] - moi.y) ** 2; if (d < md) { md = d; mieux = { genre: 'tourelle', n }; } });
    CARTE.barricades.forEach((p, n) => { const d = (p[0] - moi.x) ** 2 + (p[1] - moi.y) ** 2; if (d < md) { md = d; mieux = { genre: 'barricade', n }; } });
    return mieux;
  }

  // ------------------------------------------------------------------------
  // Caméra et arme en main
  // ------------------------------------------------------------------------
  const matArme = new Float32Array(16), matA = new Float32Array(16), matB = new Float32Array(16);
  // Réglages de l'arme en main par modèle : [maillage, échelle, x, y, z, rotation Y] (repère de la caméra).
  const VUE_ARMES = [];

  function poserCamera() {
    const J = monEtat();
    const bob = Math.sin(moi.balancement * 2) * 0.035;
    cam.x = moi.x; cam.z = moi.y;
    cam.y = (J.at !== 0 ? 0.55 : HAUTEUR_YEUX) + bob;
    cam.lacet = moi.lacet; cam.tangage = moi.tangage + (J.at !== 0 ? -0.15 : 0);
    const aspect = innerWidth / Math.max(1, innerHeight);
    // Champ vertical : assez large pour garder au moins 52° à l'horizontale en portrait.
    cam.fov = borner(2 * Math.atan(Math.tan(26 * Math.PI / 180) / aspect) * 180 / Math.PI, 66, 96) + (entree.sprint ? 4 : 0);
  }

  function dessinerArme() {
    const J = monEtat();
    if (J.at !== 0) return;
    const V = VUE_ARMES[moi.arme];
    if (!V || !MAILLES[V[0]]) return;
    const sortie = borner((tempsJeu - moi.changement) / 0.25, 0, 1);
    const enRecharge = moi.recharge > 0 ? Math.sin(borner(1 - (moi.recharge - tempsJeu) / ARMES[moi.arme].recharge, 0, 1) * Math.PI) : 0;
    const bx = Math.cos(moi.balancement) * 0.012, by = Math.abs(Math.sin(moi.balancement)) * 0.012;
    const portrait = innerWidth < innerHeight;
    const x = V[2] * (portrait ? 0.62 : 1) + bx, y = V[3] - by - (1 - sortie) * 0.35 - enRecharge * 0.22, z = V[4] - moi.recul * 0.07;
    moteur.mat.trs(matA, x, y, z, V[5], V[1], V[1], V[1]);
    moteur.mat.rotX(matB, moi.recul * 0.12 - enRecharge * 0.7 - (1 - sortie) * 0.6);
    moteur.mat.mul(matArme, matA, matB);
    moteur.vueArme(MAILLES[V[0]], matArme, eclairBouche * 0.25);
    if (eclairBouche > 0.05) {
      const c = moi.arme === 3 ? [0.5, 0.9, 1] : moi.arme === 4 ? [0.5, 0.8, 1] : [1, 0.8, 0.4];
      moteur.eclairArme(x + V[6], y + V[7], z + V[8], (0.16 + Math.random() * 0.08) * (moi.arme === 2 ? 1.6 : 1), c[0], c[1], c[2], eclairBouche);
    }
  }

  // ==========================================================================
  // 4. Interface : affichage tête haute, annonces, boutique, écrans
  // ==========================================================================
  let etatJeu = 'titre';        // titre, jeu, pause, boutique, aide, options, fin
  let gradeJoueur = 1;          // grade au début de la partie (il ouvre la boutique)
  const ecrans = { titre: $('ecran-titre'), pause: $('ecran-pause'), boutique: $('ecran-boutique'), aide: $('ecran-aide'), options: $('ecran-options'), fin: $('ecran-fin') };

  function montrerEcran(nom) {
    for (const k in ecrans) ecrans[k].hidden = k !== nom;
    $('ath').hidden = nom === 'titre' || modeDemo;
  }

  // Écrit un texte seulement s'il a changé (l'affichage est mis à jour à chaque image).
  const cacheTextes = new Map();
  function ecrire(el, texte) {
    if (cacheTextes.get(el) === texte) return;
    cacheTextes.set(el, texte);
    el.textContent = texte;
  }
  function jauge(el, part, seuil) {
    const p = borner(part, 0, 1);
    const cle = Math.round(p * 200);
    if (cacheTextes.get(el) === cle) return;
    cacheTextes.set(el, cle);
    el.firstElementChild.style.transform = `scaleX(${p})`;
    el.classList.toggle('bas', p < (seuil || 0.3));
  }

  // ------------------------------------------------------------------------
  // Annonces et fil d'informations
  // ------------------------------------------------------------------------
  let finAnnonce = 0;
  function annoncer(titre, detail, alerte, duree) {
    if (modeDemo) return;
    const el = $('annonce');
    $('annonce-titre').textContent = titre;
    $('annonce-detail').textContent = detail || '';
    el.classList.toggle('alerte', !!alerte);
    el.hidden = true; void el.offsetWidth; el.hidden = false;      // relance l'animation
    finAnnonce = tempsJeu + (duree || 3);
  }
  function fil(texte, mal) {
    if (modeDemo) return;
    const d = document.createElement('div');
    d.textContent = texte;
    if (mal) d.className = 'mal';
    const f = $('fil');
    f.appendChild(d);
    while (f.children.length > 4) f.removeChild(f.firstChild);
    setTimeout(() => { if (d.parentNode) d.parentNode.removeChild(d); }, 3300);
  }

  let eclairRouge = 0, angleCoup = 0, forceCoup = 0, dernierBattement = 0;
  function joueurTouche(degats, ox, oy) {
    eclairRouge = Math.min(1, eclairRouge + 0.35 + degats / 60);
    angleCoup = ecartAngle(moi.lacet, Math.atan2(ox - moi.x, oy - moi.y));
    forceCoup = 1;
    secousse = Math.max(secousse, 0.35);
    SON.jouer('degat_joueur');
  }
  let dernierCoupSas = -10;
  function sasTouche() {
    if (tempsJeu - dernierCoupSas > 6) fil(t('fil.sasAttaque'), true);
    dernierCoupSas = tempsJeu;
  }
  function marqueurTouche(critique) {
    const el = $('touche');
    el.classList.remove('oui'); void el.offsetWidth;
    el.classList.toggle('crit', !!critique);
    el.classList.add('oui');
  }
  function compterTue(type) { moi.tues[type] += 1; }

  // ------------------------------------------------------------------------
  // Vagues
  // ------------------------------------------------------------------------
  let aliensVus = 0;            // types déjà rencontrés (bits), pour présenter les nouveaux
  function compositionVague(v) {
    // Nombre d'aliens de chaque type de la vague (vagues écrites seulement), comme le calcule la simulation.
    if (v > D.vagues.length) return null;
    const E = partie.etat, def = D.vagues[v - 1], compte = [0, 0, 0, 0, 0, 0];
    const facteur = 1 + D.vague.aliensParJoueur * (E.nj - 1);
    const densite = v <= 2 ? 1 : D.vague.densite + D.vague.densiteParVague * v;
    for (const g of def.g) compte[g[0]] += g[0] === 5 ? g[1] : Math.max(1, Math.round(g[1] * facteur * densite));
    return compte;
  }
  function texteComposition(v) {
    const c = compositionVague(v);
    if (!c) return t('prep.inconnue');
    const morceaux = [];
    for (let i = 0; i < c.length; i++) if (c[i]) morceaux.push(t('alien.' + NOMS_ALIENS[i], { n: c[i] }));
    return morceaux.join(' · ');
  }

  function debutVague(v, boss, nuit) {
    if (modeDemo) return;
    instantaneVague = { vs: VERSION_ETAT, etat: partie.instantane() };
    const c = compositionVague(v);
    let conseil = '';
    if (c) for (let i = 0; i < c.length; i++) if (c[i] && !(aliensVus & (1 << i))) { aliensVus |= 1 << i; if (!conseil) conseil = t('conseil.' + NOMS_ALIENS[i]); }
    annoncer(boss ? t('annonce.boss') : t('annonce.vague', { n: v }), conseil || (nuit ? t('annonce.nuit') : ''), !!boss, conseil ? 5.5 : 3);
    SON.jouer('vague_debut');
    SON.jouer(boss ? 'boss_rugissement' : 'cri_alien', { volume: 0.8 });
    SON.ambiance(boss ? 3 : 2, borner(v / 20, 0.15, 1));
    $('prep').hidden = true;
  }

  function finVagueVue(v, prime) {
    if (modeDemo) return;
    instantaneVague = null;
    annoncer(t('annonce.vagueFinie', { n: v }), t('annonce.prime', { n: prime }), false);
    SON.jouer('vague_fin');
    SON.ambiance(1, 0);
    if (!modeDemo && partie.etat.nj === 1) {
      // Partie gardée : « Continuer » reprendra à la préparation de la vague suivante.
      const E = partie.etat;
      ecrireSauvegarde({ niveau: E.v, score: E.j[partie.camp].sc, partie: { vs: VERSION_ETAT, etat: partie.instantane() } });
    }
    if (!modeDemo && window.FMG) window.FMG.reportEnd({ completed: false, level: v });
    if (meta.record.vague < v && !modeDemo) fil(t('fil.record', { n: v }), false);
  }

  // ------------------------------------------------------------------------
  // Affichage tête haute (à chaque image)
  // ------------------------------------------------------------------------
  const elCapacites = [];
  function construireCapacites() {
    const bloc = $('bloc-capacites');
    bloc.textContent = '';
    elCapacites.length = 0;
    const icones = ['i-bouclier', 'i-frappe', 'i-ralenti', 'i-soin'], lettres = ['C', 'F', 'X', 'V'];
    CAPACITES.forEach((C, n) => {
      if (gradeJoueur < C.grade) { elCapacites.push(null); return; }
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'capacite';
      b.setAttribute('aria-label', t('capacite.' + C.id));
      b.innerHTML = `<svg><use href="#${icones[n]}"/></svg><i class="voile-cd"></i><kbd>${lettres[n]}</kbd>`;
      const faire = (e) => { e.preventDefault(); if (etatJeu === 'jeu') utiliserCapacite(n); };
      b.addEventListener('touchstart', faire, { passive: false });
      b.addEventListener('click', (e) => { if (!TACTILE) faire(e); });
      bloc.appendChild(b);
      elCapacites.push(b);
    });
  }

  let jaugeBoss = null, compteurRadar = 0;
  function majAffichage() {
    const E = partie.etat, J = monEtat();
    // Vague, aliens restants, sas.
    ecrire($('vague-nom'), E.ph === 0 ? t('ath.preparation') : t('ath.vague', { n: E.v }));
    const reste = E.ph === 1 ? E.e.length + (E.q.length - E.qi) : 0;
    $('vague-reste').style.visibility = E.ph === 1 ? 'visible' : 'hidden';
    ecrire($('vague-reste-n'), nombre(reste));
    jauge($('jauge-sas'), E.sas / E.sasMax, 0.3);
    ecrire($('sas-pv'), Math.ceil(E.sas / E.sasMax * 100) + ' %');
    $('bloc-sas').classList.toggle('alerte', E.sas / E.sasMax < 0.3 && E.ph === 1);
    // Boss : sa barre de vie sous le nom de la vague.
    let boss = null;
    for (let i = 0; i < E.e.length; i++) if (E.e[i].t === 5 && !E.e[i].mo) { boss = E.e[i]; break; }
    if (boss && !jaugeBoss) { jaugeBoss = document.createElement('div'); jaugeBoss.className = 'jauge'; jaugeBoss.style.cssText = 'margin-top:4px;max-width:220px'; jaugeBoss.innerHTML = '<i style="background:#ff5aa8"></i>'; $('bloc-vague').appendChild(jaugeBoss); }
    if (jaugeBoss) { if (boss) jauge(jaugeBoss, boss.pv / boss.pm, 0); else { jaugeBoss.remove(); cacheTextes.delete(jaugeBoss); jaugeBoss = null; } }

    // Vie, objets, crédits.
    jauge($('jauge-vie'), J.pv / D.joueur.pv, 0.35);
    ecrire($('vie-pv'), String(Math.ceil(J.pv)));
    ecrire($('credits'), nombre(J.cr));
    ecrire($('n-kits'), String(J.ki));
    ecrire($('n-grenades'), String(J.gr));
    ecrire($('n-mines'), String(J.mn));
    $('c-mines').hidden = gradeJoueur < D.boutique[8].grade && J.mn === 0;
    $('b-mine').hidden = J.mn === 0;
    $('b-kit').classList.toggle('actif', J.pv < 45 && J.ki > 0);

    // Arme.
    const a = moi.arme, A = ARMES[a];
    ecrire($('arme-nom'), moi.recharge > 0 ? t('ath.recharge') : t('arme.' + A.id));
    ecrire($('mun-chargeur'), String(Math.max(0, moi.chargeur[a])));
    ecrire($('mun-reserve'), J.re[a] < 0 ? '/ ∞' : '/ ' + J.re[a]);
    $('arme-munitions').classList.toggle('vide', moi.chargeur[a] <= Math.ceil(A.chargeur * 0.2));
    const liste = $('arme-liste');
    if (cacheTextes.get(liste) !== J.ar * 8 + a) {
      cacheTextes.set(liste, J.ar * 8 + a);
      liste.textContent = '';
      for (let i = 0; i < ARMES.length; i++) if (J.ar & (1 << i)) { const el = document.createElement('i'); if (i === a) el.className = 'a'; liste.appendChild(el); }
    }
    // Capacités.
    for (let n = 0; n < elCapacites.length; n++) {
      const b = elCapacites[n];
      if (!b) continue;
      const part = J.ca[n] / (CAPACITES[n].recharge * TPS);
      const cle = Math.round(part * 50);
      if (cacheTextes.get(b) !== cle) { cacheTextes.set(b, cle); b.children[1].style.height = part * 100 + '%'; b.classList.toggle('attente', part > 0); }
    }
    // Viseur : écart selon la dispersion, orange sur une cible.
    $('viseur').style.setProperty('--ecart', 5 + moi.rafale * 9 + (entree.sprint ? 6 : 0) + moi.recul * 4 + 'px');
    $('viseur').classList.toggle('cible', moi.cibleVue !== null);
    $('viseur').style.visibility = J.at === 0 ? 'visible' : 'hidden';

    // Coups reçus, vie basse.
    const bas = J.at === 0 && J.pv < 35 ? (1 - J.pv / 35) * (0.35 + Math.sin(tempsJeu * 5) * 0.12) : 0;
    eclairRouge = Math.max(0, eclairRouge - dtImage * 1.6);
    $('rouge').style.opacity = String(Math.min(1, Math.max(eclairRouge, bas) + (J.at !== 0 ? 0.6 : 0)));
    if (eclairSoin > 0) { eclairSoin = Math.max(0, eclairSoin - dtImage * 2); $('rouge').style.filter = `hue-rotate(${Math.round(eclairSoin * 110)}deg)`; if (eclairSoin > 0) $('rouge').style.opacity = String(eclairSoin * 0.6); } else $('rouge').style.filter = '';
    forceCoup = Math.max(0, forceCoup - dtImage * 1.2);
    $('direction').style.opacity = String(forceCoup);
    if (forceCoup > 0) $('direction').style.transform = `rotate(${angleCoup}rad)`;
    $('nuit-voile').style.opacity = String(nuitVue);
    const force = J.at === 0 && J.pv < 30 ? 1 - J.pv / 30 : 0;
    if (Math.abs(force - dernierBattement) > 0.1 || (force === 0 && dernierBattement !== 0)) { dernierBattement = force; SON.battement(force); }

    // Préparation : panneau, compte à rebours.
    const prep = $('prep');
    if (E.ph === 0 && etatJeu === 'jeu') {
      if (prep.hidden) { prep.hidden = false; ecrire($('prep-aliens'), texteComposition(E.v)); ecrire($('prep-titre'), t('prep.titre', { n: E.v })); }
      ecrire($('prep-compte'), J.pr ? t('prep.attente') : t('prep.compte', { n: Math.ceil(E.tp / TPS) }));
      const s = Math.ceil(E.tp / TPS);
      if (s <= 5 && s !== dernierTic) { dernierTic = s; SON.jouer('compte_a_rebours'); }
    } else if (!prep.hidden) prep.hidden = true;

    // Invite : emplacement tout proche pendant la préparation, ou joueur à terre.
    const invite = $('invite');
    let texteInvite = '';
    if (J.at !== 0) texteInvite = E.nj === 1 && J.sv === 1 ? t('invite.secondeChance') : t('invite.aTerre');
    else if (E.ph === 0) { const emp = emplacementProche(); if (emp) texteInvite = TACTILE ? t('invite.emplacementTactile') : t('invite.emplacement'); }
    if (texteInvite) { ecrire(invite, texteInvite); invite.hidden = false; } else invite.hidden = true;

    if (!$('annonce').hidden && tempsJeu > finAnnonce) $('annonce').hidden = true;

  let dernierTic = 0;
