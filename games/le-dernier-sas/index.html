      const w = mVP[3] * x + mVP[7] * y + mVP[11] * z + mVP[15];
      const k = w !== 0 ? 1 / Math.abs(w) : 0;
      sortie[0] = ((mVP[0] * x + mVP[4] * y + mVP[8] * z + mVP[12]) * k * 0.5 + 0.5) * largeurCss;
      sortie[1] = (0.5 - (mVP[1] * x + mVP[5] * y + mVP[9] * z + mVP[13]) * k * 0.5) * hauteurCss;
      sortie[2] = w;
      return sortie;
    }

    function reglerScene(pr, vp, densite) {
      const u = pr.u;
      gl.useProgram(pr.p);
      gl.uniformMatrix4fv(u.uVP, false, vp);
      gl.uniform3f(u.uCam, camX, camY, camZ);
      gl.uniform1f(u.uTemps, temps);
      gl.uniform3fv(u.uSoleilDir, E.soleilDir);
      gl.uniform3fv(u.uSoleilCoul, E.soleil);
      gl.uniform3fv(u.uAmbCiel, E.ambCiel);
      gl.uniform3fv(u.uAmbSol, E.ambSol);
      gl.uniform3fv(u.uContre, E.contre);
      gl.uniform4f(u.uBrume, E.brume[0], E.brume[1], E.brume[2], densite);
      gl.uniform1i(u.uNbLum, nbLum);
      if (nbLum) { gl.uniform4fv(u.uLum, lumPos); gl.uniform3fv(u.uLumCoul, lumCoul); }
    }
    function dessinerInstances(m, donnees, n) {
      gl.bindVertexArray(m.vao);
      gl.bindBuffer(gl.ARRAY_BUFFER, m.ivbo);
      if (donnees.length > m._cap) { m._cap = donnees.length; gl.bufferData(gl.ARRAY_BUFFER, m._cap * 4, gl.DYNAMIC_DRAW); }
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, donnees, 0, n * NI);
      gl.drawElementsInstanced(gl.TRIANGLES, m._i.length, m._i.BYTES_PER_ELEMENT === 4 ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT, 0, n);
      st.appels++;
    }

    function fin() {
      st.instances = 0; st.appels = 0; st.particules = nbPart;
      if (perdu || detruit || !P) return;
      const W = canvas.width, H = canvas.height;
      gl.viewport(0, 0, W, H);
      gl.disable(gl.BLEND);
      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LESS);
      gl.depthMask(true);
      gl.clearColor(E.brumeEcran[0], E.brumeEcran[1], E.brumeEcran[2], 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.enable(gl.CULL_FACE);
      gl.cullFace(gl.BACK);
      gl.frontFace(gl.CW);

      // 1. maillages, un appel par maillage, les fixes puis les animés
      for (let passe = 0; passe < 2; passe++) {
        let pret = false;
        for (let i = 0; i < nbUtilises; i++) {
          const m = utilises[i];
          if (m.anime !== (passe === 1) || !m.n || !m.vao) continue;
          if (!pret) { reglerScene(passe ? P.maillageAnime : P.maillage, mVP, A.densiteBrume); pret = true; }
          dessinerInstances(m, m.inst, m.n);
          st.instances += m.n;
        }
      }

      // 2. sol
      gl.disable(gl.CULL_FACE);
      reglerScene(P.sol, mVP, A.densiteBrume);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, P.bruit);
      gl.uniform1i(P.sol.u.uBruit, 0);
      gl.bindVertexArray(P.solVao);
      gl.drawElements(gl.TRIANGLES, P.solNb, gl.UNSIGNED_SHORT, 0);
      st.appels++;

      // 3. ciel, au fond
      gl.depthFunc(gl.LEQUAL);
      gl.depthMask(false);
      let u = P.ciel.u;
      gl.useProgram(P.ciel.p);
      const th = Math.tan((fov * Math.PI) / 360), ta = th * (W / Math.max(1, H));
      gl.uniform3f(u.uAvant, avX, avY, avZ);
      gl.uniform3f(u.uDroite, drX * ta, drY * ta, drZ * ta);
      gl.uniform3f(u.uHaut, haX * th, haY * th, haZ * th);
      gl.uniform3fv(u.uCielHaut, E.cielHaut);
      gl.uniform3fv(u.uCielBas, E.cielBas);
      gl.uniform3fv(u.uBrume, E.brume);
      gl.uniform3fv(u.uMont, E.mont);
      gl.uniform3fv(u.uSoleilDir, E.soleilDir);
      gl.uniform3fv(u.uSoleilCoul, E.soleilCiel);
      gl.uniform1f(u.uNuit, A.nuit);
      gl.uniform1f(u.uTemps, temps);
      gl.uniform4fv(u.uAstreP, E.astreP);
      gl.uniform3fv(u.uAstreR, E.astreR);
      gl.uniform3fv(u.uAstreU, E.astreU);
      gl.uniform3fv(u.uAstreS, E.astreS);
      gl.bindVertexArray(P.cielVao);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      st.appels++;

      // 4. taches, disques et anneaux du sol
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      let nt = 0;
      for (let i = nbTaches - 1; i >= 0; i--) {
        const o = i * NTA, age = temps - taches[o + 7], vie = taches[o + 8];
        if (age >= vie || age < 0) continue;
        const k = age / vie, q = (MAX_TACHES - ++nt) * ND;
        tamponD[q] = taches[o]; tamponD[q + 1] = taches[o + 1];
        tamponD[q + 2] = taches[o + 2] * (0.55 + 0.45 * Math.min(1, age * 2.5));
        tamponD[q + 3] = 0;
        tamponD[q + 4] = taches[o + 3]; tamponD[q + 5] = taches[o + 4]; tamponD[q + 6] = taches[o + 5];
        tamponD[q + 7] = taches[o + 6] * (1 - k * k);
        tamponD[q + 8] = taches[o + 9];
      }
      if (nt + nbDecalques > 0) {
        u = P.decalque.u;
        gl.useProgram(P.decalque.p);
        gl.uniformMatrix4fv(u.uVP, false, mVP);
        gl.uniform3f(u.uCam, camX, camY, camZ);
        gl.uniform4f(u.uBrume, 0, 0, 0, A.densiteBrume);
        gl.bindVertexArray(P.decVao);
        gl.bindBuffer(gl.ARRAY_BUFFER, P.decVbo);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, tamponD, (MAX_TACHES - nt) * ND, (nt + nbDecalques) * ND);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, nt + nbDecalques);
        st.appels++;
      }

      // 5. traceurs
      if (nbTrac > 0) {
        for (let i = 0; i < nbTrac; i++) {
          const o = i * NTC, q = i * NT;
          tamponT[q] = trac[o]; tamponT[q + 1] = trac[o + 1]; tamponT[q + 2] = trac[o + 2]; tamponT[q + 3] = trac[o + 6];
          tamponT[q + 4] = trac[o + 3]; tamponT[q + 5] = trac[o + 4]; tamponT[q + 6] = trac[o + 5];
          tamponT[q + 7] = 1 - trac[o + 10] / trac[o + 11];
          tamponT[q + 8] = trac[o + 7]; tamponT[q + 9] = trac[o + 8]; tamponT[q + 10] = trac[o + 9];
        }
        u = P.traceur.u;
        gl.useProgram(P.traceur.p);
        gl.uniformMatrix4fv(u.uVP, false, mVP);
        gl.uniform3f(u.uCam, camX, camY, camZ);
        gl.bindVertexArray(P.tracVao);
        gl.bindBuffer(gl.ARRAY_BUFFER, P.tracVbo);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, tamponT, 0, nbTrac * NT);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, nbTrac);
        st.appels++;
      }

      // 6. halos puis particules, d'un seul appel
      let q = nbHalos * NP;
      for (let i = 0; i < nbPart; i++, q += NP) {
        const o = i * NPC, k = part[o + 6] / part[o + 7], add = part[o + 15];
        tamponP[q] = part[o]; tamponP[q + 1] = part[o + 1]; tamponP[q + 2] = part[o + 2];
        tamponP[q + 3] = part[o + 8] + (part[o + 9] - part[o + 8]) * k;
        tamponP[q + 4] = part[o + 10]; tamponP[q + 5] = part[o + 11]; tamponP[q + 6] = part[o + 12];
        tamponP[q + 7] = part[o + 13] * (add ? 1 - k : (1 - k) * Math.min(1, k * 10));
        tamponP[q + 8] = add; tamponP[q + 9] = 0; tamponP[q + 10] = 0;
      }
      u = P.particule.u;
      gl.useProgram(P.particule.p);
      gl.uniform3f(u.uCam, camX, camY, camZ);
      gl.uniform3f(u.uDroite, drX, drY, drZ);
      gl.uniform3f(u.uHaut, haX, haY, haZ);
      gl.uniform3fv(u.uFumee, E.fumee);
      gl.uniform4f(u.uBrume, E.brumeEcran[0], E.brumeEcran[1], E.brumeEcran[2], A.densiteBrume);
      gl.bindVertexArray(P.partVao);
      gl.bindBuffer(gl.ARRAY_BUFFER, P.partVbo);
      if (nbHalos + nbPart > 0) {
        gl.uniformMatrix4fv(u.uVP, false, mVP);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, tamponP, 0, (nbHalos + nbPart) * NP);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, nbHalos + nbPart);
        st.appels++;
      }

      // 7. arme en vue subjective, par-dessus le monde
      if (nbArmes > 0 || nbEclairs > 0) {
        gl.disable(gl.BLEND);
        gl.depthMask(true);
        gl.depthFunc(gl.LESS);
        gl.clear(gl.DEPTH_BUFFER_BIT);
        gl.enable(gl.CULL_FACE);
        for (let i = 0; i < nbArmes; i++) {
          const a = armes[i];
          if (!a.m.vao) continue;
          reglerScene(a.m.anime ? P.maillageAnime : P.maillage, mVPArme, 0);
          dessinerInstances(a.m, a.inst, 1);
          st.instances++;
        }
        if (nbEclairs > 0) {
          gl.disable(gl.CULL_FACE);
          gl.enable(gl.BLEND);
          gl.depthMask(false);
          gl.useProgram(P.particule.p);
          gl.uniformMatrix4fv(u.uVP, false, mVPArme);
          gl.uniform4f(u.uBrume, 0, 0, 0, 0);
          gl.bindVertexArray(P.partVao);
          gl.bindBuffer(gl.ARRAY_BUFFER, P.partVbo);
          gl.bufferSubData(gl.ARRAY_BUFFER, 0, eclairs, 0, nbEclairs * NP);
          gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, nbEclairs);
          st.appels++;
        }
      }
      gl.bindVertexArray(null);
      gl.depthMask(true);
      gl.disable(gl.BLEND);
    }

    function vider() { nbPart = 0; nbTrac = 0; nbTaches = 0; tourPart = tourTrac = tourTaches = 0; }
    function detruire() {
      if (detruit) return;
      detruit = true;
      canvas.removeEventListener('webglcontextlost', surPerte, false);
      canvas.removeEventListener('webglcontextrestored', surRetour, false);
      if (!perdu && P) {
        for (const m of maillages) { if (m.vao) { gl.deleteVertexArray(m.vao); gl.deleteBuffer(m.vbo); gl.deleteBuffer(m.ibo); gl.deleteBuffer(m.ivbo); m.vao = null; } }
        for (const k of ['maillage', 'maillageAnime', 'sol', 'ciel', 'decalque', 'particule', 'traceur']) gl.deleteProgram(P[k].p);
        for (const k of ['quad', 'quadT', 'cielVbo', 'solVbo', 'solIbo', 'partVbo', 'decVbo', 'tracVbo']) gl.deleteBuffer(P[k]);
        for (const k of ['cielVao', 'solVao', 'partVao', 'decVao', 'tracVao']) gl.deleteVertexArray(P[k]);
        gl.deleteTexture(P.bruit);
      }
      maillages.length = 0; cacheModeles.clear(); P = null;
    }

    const moteur = {
      mat, perdu: false,
      redimensionner, modele, geo: () => new Geo(fabrique), ambiance, debut, poser, poserMat,
      disque, anneau, tache, particule, traceur, lumiere, vueArme, eclairArme, projeter, fin,
      stats: () => st, liberer, vider, detruire,
    };

    calculerAmbiance();
    if (gl.isContextLost()) { perdu = true; moteur.perdu = true; }
    else if (!initGL()) { detruire(); return null; }
    redimensionner(largeurCss, hauteurCss, 1);
    return moteur;
  }

  const SAS_GL = { creer, mat, erreur: '' };
  window.SAS_GL = SAS_GL;
})();
</script>
<script id="sas-creatures">
/*
 * Le Dernier Sas : modèles des aliens (window.SAS_CREATURES), fabriqués par le code avec moteur.geo().
 *
 *   const C = SAS_CREATURES.creer(moteur);
 *   C.<nom> = { maillage, rayon, hauteur, foulee, lueur: [r, v, b] }
 *     rayon, hauteur : cylindre de collision en mètres (pieds à y = 0, sauf « crachat », centré sur son origine)
 *     foulee : mètres parcourus pour un cycle de marche ; donner au moteur
 *              marche = distance parcourue x 2 PI / foulee pour que les pieds ne glissent pas
 *     lueur : couleur des parties lumineuses (pour les particules, les taches, les éclairs du jeu)
 *   Noms : rampant, guerrier, guerrierMue, cracheur, blinde, bombardier, matriarche, crachat, oeuf.
 *
 * Tous regardent vers +z. Les poches et les mandibules bougent toutes seules (elles suivent le temps) ;
 * les pattes, les bras et le balancement du corps suivent « marche » et « ampli » de moteur.poser.
 * Pour désynchroniser des objets immobiles (œufs), leur donner des « marche » différentes.
 */
(function () {
  'use strict';
  const PI = Math.PI;

  // Patte en trois points (hanche, genou, pied), pointe au sol ; phase en radians.
  function patte(g, hanche, genou, pied, r, phase, balance, lever, cotes) {
    g.patte(hanche, pied, phase, balance, lever);
    const mi = [genou[0] + (pied[0] - genou[0]) * 0.55, genou[1] + (pied[1] - genou[1]) * 0.55, genou[2] + (pied[2] - genou[2]) * 0.55];
    g.tube([hanche, genou, mi, pied], [r, r * 0.92, r * 0.5, 0], cotes || 4);
    g.fixe();
  }
  // Arcs passant par le haut d'un ellipsoïde (nervures, veines).
  function nervures(g, c, rx, ry, rz, nb, r, e0, e1, tour) {
    for (let k = 0; k < nb; k++) {
      const psi = (k / nb) * PI + (tour || 0), pts = [];
      const pas = 5;
      for (let i = 0; i <= pas; i++) {
        const e = e0 + ((e1 - e0) * i) / pas;
        pts.push([c[0] + rx * Math.cos(e) * Math.cos(psi), c[1] + ry * Math.sin(e), c[2] + rz * Math.cos(e) * Math.sin(psi)]);
      }
      g.tube(pts, r, 3);
    }
  }
  const yeux = (g, liste, n) => { for (const o of liste) g.pousser().deplacer(o[0], o[1], o[2]).sphere(o[3], n || 5, 3).depiler(); };

  // ---------------------------------------------------------------- rampant
  function rampant(moteur) {
    const g = moteur.geo();
    const chitine = [0.17, 0.27, 0.26], plaque = [0.27, 0.42, 0.36], os = [0.80, 0.78, 0.58], acide = [0.40, 1.0, 0.12];
    g.bruit(0.012).glissement([0, 1, 0], 0, 0.018, 2);
    g.couleur(...chitine);
    g.pousser().deplacer(0, 0.29, -0.2).tournerX(0.1).ellipsoide(0.25, 0.16, 0.32, 8, 4).depiler();
    g.couleur(...plaque);
    for (let k = 0; k < 3; k++) g.pousser().deplacer(0, 0.33 - k * 0.012, -0.03 - k * 0.15).tournerX(0.32).ellipsoide(0.245 - k * 0.035, 0.13, 0.12, 6, 2, 0.05, 1).depiler();
    g.couleur(...chitine);
    g.pousser().deplacer(0, 0.27, 0.14).ellipsoide(0.2, 0.14, 0.2, 8, 4).depiler();
    g.couleur(...plaque);
    g.pousser().deplacer(0, 0.25, 0.36).tournerX(-0.15).ellipsoide(0.15, 0.1, 0.15, 6, 3).depiler();
    g.couleur(...os).pointe([0, 0.36, -0.42], [0, 0.42, -0.56], 0.045, 4);
    g.bruit(0).emissif(1).couleur(...acide);
    g.symetrie(() => yeux(g, [[0.085, 0.295, 0.445, 0.048], [0.04, 0.325, 0.475, 0.028], [0.125, 0.265, 0.40, 0.026]]));
    g.emissif(0).lueur(0, 0.31, 0.47, 0.55, ...acide, 0.55);
    g.symetrie(() => {
      g.balancier([0.07, 0.21, 0.45], [0, 1, 0], 0, 0.38, 9, true);
      g.couleur(...os).tube([[0.075, 0.21, 0.44], [0.135, 0.19, 0.55], [0.045, 0.165, 0.655]], [0.036, 0.03, 0], 4, 0.6, [0, 1, 0]);
    });
    g.couleur(...chitine);
    g.symetrie((c) => {
      const d = c < 0 ? PI : 0;
      patte(g, [0.15, 0.26, 0.25], [0.35, 0.50, 0.42], [0.48, 0, 0.60], 0.04, d, 0.42, 0.5);
      patte(g, [0.18, 0.26, 0.11], [0.45, 0.53, 0.10], [0.62, 0, 0.08], 0.042, d + PI, 0.42, 0.5);
      patte(g, [0.16, 0.26, -0.04], [0.40, 0.50, -0.28], [0.52, 0, -0.50], 0.04, d, 0.42, 0.5);
    });
    return { maillage: g.maillage(), rayon: 0.45, hauteur: 0.6, foulee: 0.9, lueur: acide };
  }

  // ---------------------------------------------------------------- guerrier et guerrier après sa mue
  function guerrier(moteur, mue) {
    const g = moteur.geo();
    const chitine = mue ? [0.52, 0.34, 0.36] : [0.25, 0.13, 0.29];
    const plaque = mue ? [0.66, 0.47, 0.44] : [0.38, 0.20, 0.40];
    const vieille = [0.17, 0.10, 0.20];
    const os = [0.90, 0.82, 0.68], magenta = [1.0, 0.16, 0.72], voile = [0.92, 0.12, 0.62], bile = [0.62, 1.0, 0.16];
    g.bruit(0.02).glissement([0, 1, 0], 0, 0.03, 2);
    // abdomen long et bas
    g.couleur(...chitine);
    g.pousser().deplacer(0, 0.57, -0.44).tournerX(0.1).ellipsoide(0.27, 0.22, 0.46, 8, 5).depiler();
    g.pointe([0, 0.50, -0.80], [0, 0.58, -0.97], 0.09, 4);
    if (!mue) {
      g.couleur(...plaque);
      for (let k = 0; k < 3; k++) g.pousser().deplacer(0, 0.62 - k * 0.012, -0.24 - k * 0.19).tournerX(0.3).ellipsoide(0.265 - k * 0.035, 0.19, 0.14, 6, 2, 0.1, 1).depiler();
    } else {
      // vieille carapace fendue, ouverte de chaque côté
      g.couleur(...vieille);
      g.symetrie(() => {
        g.pousser().deplacer(0.12, 0.60, -0.44).tournerZ(0.6).tournerX(0.1).ellipsoide(0.28, 0.25, 0.48, 8, 3, 0.3, 1).depiler();
        g.pousser().deplacer(0.09, 0.95, 0.14).tournerZ(0.7).tournerX(-0.85).ellipsoide(0.2, 0.19, 0.3, 6, 2, 0.35, 1).depiler();
      });
    }
    // thorax dressé, comme une mante
    g.couleur(...chitine).tube([[0, 0.58, -0.10], [0, 0.82, 0.13], [0, 1.07, 0.29], [0, 1.2, 0.37]], [0.22, 0.215, 0.16, 0.12], 6);
    g.couleur(...plaque);
    g.pousser().deplacer(0, 0.86, 0.27).tournerX(1.0).ellipsoide(0.2, 0.07, 0.2, 6, 2, 0, 1).depiler();
    // tête triangulaire
    g.pousser().deplacer(0, 1.25, 0.46).tournerX(-0.55).ellipsoide(0.21, 0.10, 0.17, 6, 2).depiler();
    g.pointe([0, 1.21, 0.55], [0, 1.07, 0.66], 0.075, 4);
    g.bruit(0);
    g.emissif(1).couleur(...magenta);
    g.symetrie(() => yeux(g, [[0.175, 1.29, 0.50, mue ? 0.05 : 0.072]], 6));
    g.emissif(0);
    if (!mue) {
      // crête dorsale et sa voile lumineuse, fentes des flancs, taches de la poitrine
      const crete = [[1.10, 0.25, 0.26], [0.92, 0.10, 0.30], [0.78, -0.12, 0.30], [0.77, -0.40, 0.26], [0.71, -0.66, 0.20]];
      const pointes = crete.map(([y, z, h]) => [[0, y - 0.05, z], [0, y + h * 0.85, z - h * 0.6]]);
      g.couleur(...plaque);
      for (const [a, b] of pointes) g.tube([a, b], [0.07, 0], 4, 0.4, [1, 0, 0]);
      g.emissif(0.6).couleur(...voile);
      const mi = (p, k) => [0, p[0][1] + (p[1][1] - p[0][1]) * k, p[0][2] + (p[1][2] - p[0][2]) * k];
      for (let i = 0; i + 1 < pointes.length; i++) g.face([pointes[i][0], mi(pointes[i], 0.62), mi(pointes[i + 1], 0.62), pointes[i + 1][0]], null, true);
      g.emissif(1).couleur(...magenta);
      g.symetrie(() => {
        for (let k = 0; k < 3; k++) g.pousser().deplacer(0.245 - k * 0.03, 0.58 - k * 0.012, -0.24 - k * 0.19).tournerY(0.2).boite(0.05, 0.06, 0.13).depiler();
        yeux(g, [[0.10, 0.84, 0.33, 0.04], [0.085, 1.0, 0.41, 0.034]], 5);
      });
      g.emissif(0);
      g.lueur(0, 1.28, 0.54, 0.8, ...magenta, 0.5).lueur(0, 1.0, -0.15, 1.3, ...magenta, 0.22);
    } else {
      // gorge gonflée
      const c = [0, 0.97, 0.46];
      g.emissif(0.95).couleur(...bile).pulsation([0, 0.97, 0.36], 0, 0.09, 4.5);
      g.pousser().deplacer(c[0], c[1], c[2]).ellipsoide(0.22, 0.24, 0.21, 8, 4).depiler();
      g.emissif(0).couleur(...vieille);
      nervures(g, c, 0.228, 0.248, 0.218, 2, 0.018, -0.9, PI + 0.9, 0.4);
      g.glissement([0, 1, 0], 0, 0.03, 2);
      g.emissif(0.8).couleur(...bile);
      g.symetrie(() => { for (let k = 0; k < 3; k++) g.pousser().deplacer(0.25 - k * 0.03, 0.58 - k * 0.012, -0.24 - k * 0.19).tournerY(0.2).boite(0.05, 0.07, 0.14).depiler(); });
      g.emissif(0);
      g.lueur(0, 0.98, 0.52, 1.3, ...bile, 0.5).lueur(0, 1.28, 0.54, 0.45, ...magenta, 0.35);
    }
    // mandibules
    g.symetrie(() => {
      g.balancier([0.05, 1.13, 0.6], [0, 1, 0], 1, 0.3, 7, true);
      g.couleur(...os).tube([[0.05, 1.14, 0.60], [0.09, 1.06, 0.69], [0.02, 1.0, 0.75]], [0.03, 0.025, 0], 4, 0.6, [0, 1, 0]);

    // bras-faux levés
    g.symetrie((c) => {
      const epaule = [0.19, 1.0, 0.28], coude = mue ? [0.50, 1.16, 0.34] : [0.50, 1.36, 0.36];
      g.balancier(epaule, [1, 0, 0], c < 0 ? PI : 0, 0.22, 1, false);
      g.couleur(...chitine).tube([epaule, coude], [0.08, 0.065], 5);
      g.couleur(...os);
      const lame = mue

      patte(g, [0.2, 0.56, -0.3], [0.52, 0.80, -0.52], [0.60, 0, -0.8], 0.075, d + PI, 0.36, 0.42);

  }

  // ---------------------------------------------------------------- cracheur
  function cracheur(moteur) {
    const g = moteur.geo();
    const corps = [0.31, 0.33, 0.15], plaque = [0.46, 0.46, 0.21], sombre = [0.13, 0.15, 0.06], bile = [0.62, 1.0, 0.16];
    g.bruit(0.018).glissement([0, 1, 0], 0, 0.02, 2);

    g.pousser().deplacer(0, 0.42, -0.2).ellipsoide(0.30, 0.24, 0.40, 8, 4).depiler();
    g.pointe([0, 0.36, -0.52], [0, 0.22, -0.7], 0.09, 4);
    g.tube([[0, 0.42, 0.06], [0, 0.80, 0.20], [0, 1.12, 0.17], [0, 1.33, 0.27]], [0.23, 0.20, 0.17, 0.15], 6);

    // gueule en tube
    g.tube([[0, 1.32, 0.24], [0, 1.385, 0.44], [0, 1.34, 0.66]], [0.155, 0.12, 0.10], 6);
    g.pousser().deplacer(0, 1.34, 0.64).tournerX(-1.57 - 0.2).cylindre(0.10, 0.14, 0.06, 6).depiler();
    g.bruit(0).emissif(1).couleur(...bile);
    g.pousser().deplacer(0, 1.333, 0.69).tournerX(-1.57 - 0.2).cylindre(0.085, 0.085, 0.01, 6).depiler();
    g.symetrie(() => yeux(g, [[0.115, 1.43, 0.36, 0.04], [0.09, 1.47, 0.27, 0.028]]));
    // poche dorsale
    const c = [0, 1.13, -0.2];
    g.pulsation(c, 0, 0.065, 2.6).emissif(0.9);
    g.pousser().deplacer(c[0], c[1], c[2]).ellipsoide(0.34, 0.41, 0.34, 9, 5).depiler();
    g.emissif(0).couleur(...sombre);
    nervures(g, c, 0.352, 0.428, 0.352, 3, 0.03, -0.45, PI + 0.45, 0.3);
    g.emissif(0).lueur(0, 1.15, -0.2, 1.9, ...bile, 0.42).lueur(0, 1.34, 0.72, 0.45, ...bile, 0.5);

    });
    return { maillage: g.maillage(), rayon: 0.5, hauteur: 1.6, foulee: 0.7, lueur: bile };
  }

  // ---------------------------------------------------------------- blindé
  function blinde(moteur) {
    const g = moteur.geo();
    const acier = [0.20, 0.46, 0.74], clair = [0.40, 0.70, 0.95], sombre = [0.11, 0.25, 0.44];
    const chair = [0.84, 0.56, 0.46], chairClaire = [0.98, 0.76, 0.58], orange = [1.0, 0.55, 0.10], membre = [0.17, 0.21, 0.30], os = [0.82, 0.80, 0.74];
    g.glissement([0, 1, 0], 0, 0.03, 2);
    // corps tendre (point faible), visible de côté, de dos et de dessus
    g.bruit(0.05).couleur(...chair);
    g.pousser().deplacer(0, 0.95, -0.42).tournerX(-0.06).ellipsoide(0.92, 0.64, 1.16, 10, 5).depiler();
    g.pointe([0, 0.9, -1.45], [0, 0.72, -1.6], 0.2, 5);
    g.couleur(...chairClaire).emissif(0.25).bruit(0.02);
    [[0, 1.50, -1.0, 0.30], [0.36, 1.50, -0.5, 0.33], [-0.36, 1.50, -0.5, 0.33], [0, 1.52, 0.0, 0.30], [0.62, 1.2, -1.0, 0.24], [-0.62, 1.2, -1.0, 0.24]].forEach(([x, y, z, r], i) => {
      g.pulsation([x, y - 0.15, z], i * 1.7, 0.07, 2.2);
      g.pousser().deplacer(x, y, z).ellipsoide(r, r * 0.62, r, 7, 3).depiler();
    });
    g.emissif(0).glissement([0, 1, 0], 0, 0.03, 2);
    // tête basse, sous le bouclier
    g.bruit(0.02).couleur(...sombre);
    g.pousser().deplacer(0, 0.56, 1.12).ellipsoide(0.44, 0.30, 0.40, 8, 3).depiler();
    g.bruit(0).emissif(1).couleur(...orange);
    g.symetrie(() => yeux(g, [[0.15, 0.62, 1.47, 0.06], [0.30, 0.58, 1.37, 0.045]], 5));
    g.emissif(0).lueur(0, 0.62, 1.52, 0.8, ...orange, 0.5);
    g.symetrie(() => {
      g.balancier([0.14, 0.42, 1.4], [0, 1, 0], 0, 0.25, 5, true);
      g.couleur(...os).tube([[0.16, 0.44, 1.38], [0.24, 0.34, 1.52], [0.10, 0.28, 1.6]], [0.06, 0.05, 0], 4, 0.6, [0, 1, 0]);
    });
    // bouclier frontal : calotte à grandes facettes, pôle vers l'avant
    g.glissement([0, 1, 0], 0, 0.03, 2).bruit(0.03);
    g.pousser().deplacer(0, 1.22, 0.60).tournerX(-PI / 2 + 0.30);
    g.couleur(...acier).ellipsoide(1.30, 0.97, 0.90, 8, 3, 0.17, 1);
    g.couleur(...clair).pousser().deplacer(0, 0.06, -0.12).ellipsoide(0.70, 0.99, 0.52, 6, 2, 0.45, 1).depiler();
    g.couleur(...sombre).ellipsoide(1.36, 0.30, 0.96, 8, 1, -0.2, 0.55);
    g.depiler();
    g.bruit(0);
    g.symetrie(() => {
      g.couleur(...os);
      g.pointe([0.82, 1.78, 0.86], [1.22, 2.10, 1.28], 0.13, 4);
      g.pointe([1.20, 1.2, 0.74], [1.60, 1.22, 1.14], 0.11, 4);
      g.pointe([0.34, 1.98, 0.90], [0.42, 2.12, 1.22], 0.09, 4);
    });
    // pattes épaisses, genouillères d'acier
    g.symetrie((c) => {
      const d = c < 0 ? PI : 0;
      [[0.45, 0.2], [-0.3, 0], [-1.0, -0.25]].forEach(([z, dz], i) => {
        const hanche = [0.72, 0.8, z], genou = [1.22, 1.14, z + dz * 0.5], pied = [1.36, 0, z + dz];
        g.couleur(...membre);
        patte(g, hanche, genou, pied, 0.17, d + (i % 2) * PI, 0.32, 0.26, 5);
        g.patte(hanche, pied, d + (i % 2) * PI, 0.32, 0.26);
        g.couleur(...acier).pousser().deplacer(genou[0] + 0.03, genou[1] + 0.02, genou[2]).ellipsoide(0.23, 0.19, 0.23, 5, 2, 0, 1).depiler();
        g.fixe();
      });
    });
    return { maillage: g.maillage(), rayon: 1.3, hauteur: 2.1, foulee: 1.0, lueur: orange };
  }

  // ---------------------------------------------------------------- bombardier
  function bombardier(moteur) {
    const g = moteur.geo();
    const braise = [1.0, 0.33, 0.07], vif = [1.0, 0.80, 0.25], sombre = [0.20, 0.06, 0.06], membre = [0.20, 0.12, 0.14];
    const c = [0, 0.74, 0];
    g.pulsation(c, 0, 0.07, 6).bruit(0.02).emissif(0.85).couleur(...braise);
    g.pousser().deplacer(c[0], c[1], c[2]).ellipsoide(0.41, 0.40, 0.41, 9, 6).depiler();
    g.bruit(0).emissif(1).couleur(...vif);
    [[0.25, 0.25, 0.25], [-0.3, 0.1, 0.2], [0.1, -0.2, 0.34], [-0.15, 0.32, -0.2], [0.3, -0.05, -0.28], [-0.33, -0.15, -0.15]].forEach(([x, y, z]) => {
      g.pousser().deplacer(c[0] + x, c[1] + y, c[2] + z).sphere(0.085, 6, 3).depiler();
    });
    g.emissif(0).couleur(...sombre);
    nervures(g, c, 0.425, 0.415, 0.425, 3, 0.028, -1.2, PI + 1.2, 0.5);
    g.pointe([0, 1.1, 0], [0, 1.2, -0.03], 0.05, 4).pointe([0.12, 1.06, 0.1], [0.2, 1.17, 0.14], 0.04, 4).pointe([-0.13, 1.07, -0.08], [-0.22, 1.16, -0.14], 0.04, 4);
    g.lueur(0, 0.74, 0, 1.8, ...braise, 0.5);
    // petite tête sous la boule
    g.glissement([0, 1, 0], 0, 0.02, 2).couleur(...membre);
    g.pousser().deplacer(0, 0.44, 0.33).tournerX(-0.3).ellipsoide(0.13, 0.09, 0.15, 6, 3).depiler();
    g.emissif(1).couleur(...vif);
    g.symetrie(() => yeux(g, [[0.07, 0.47, 0.44, 0.03]]));
    g.emissif(0).couleur(...membre);
    g.symetrie((s) => {
      const d = s < 0 ? PI : 0;
      patte(g, [0.18, 0.46, 0.14], [0.50, 0.78, 0.36], [0.56, 0, 0.52], 0.034, d, 0.4, 0.5);
      patte(g, [0.18, 0.46, -0.14], [0.50, 0.78, -0.36], [0.56, 0, -0.52], 0.034, d + PI, 0.4, 0.5);

    return { maillage: g.maillage(), rayon: 0.5, hauteur: 1.2, foulee: 1.0, lueur: braise };
  }

  // ---------------------------------------------------------------- matriarche
  function matriarche(moteur) {
    const g = moteur.geo();
    const chitine = [0.30, 0.10, 0.18], plaque = [0.47, 0.16, 0.26], voile = [0.62, 0.14, 0.30];
    const os = [0.86, 0.77, 0.63], poche = [0.86, 0.36, 1.0], vert = [0.45, 1.0, 0.25];
    g.bruit(0.06).glissement([0, 1, 0], 0, 0.05, 2);
    // abdomen et ses plaques
    g.couleur(...chitine);
    g.pousser().deplacer(0, 1.75, -1.1).tournerX(-0.12).ellipsoide(1.35, 1.2, 1.85, 10, 6).depiler();
    g.couleur(...plaque);
    for (let k = 0; k < 4; k++) g.pousser().deplacer(0, 2.2 - k * 0.08, 0.1 - k * 0.72).tournerX(0.25).ellipsoide(1.2 - k * 0.14, 0.85, 0.52, 8, 2, 0.15, 1).depiler();
    g.couleur(...os).bruit(0);
    for (let k = 0; k < 5; k++) g.pointe([0, 2.9 - k * 0.1, 0.0 - k * 0.6], [0, 3.45 - k * 0.14, -0.3 - k * 0.66], 0.13, 4);
    g.pointe([0, 1.3, -2.75], [0, 0.6, -3.0], 0.3, 5);
    // poches lumineuses de l'abdomen
    const poches = [];
    for (let i = 0; i < 4; i++) {
      const z = -0.25 - i * 0.62, k = 1 - i * 0.07;
      poches.push([1.18 * k, 1.5 + (i % 2) * 0.28, z, 0.40 - i * 0.02], [-1.18 * k, 1.5 + (i % 2) * 0.28, z, 0.40 - i * 0.02]);
    }
    poches.push([0.5, 1.25, -2.55, 0.36], [-0.5, 1.25, -2.55, 0.36], [0, 2.0, -2.8, 0.34], [0.75, 0.75, -1.2, 0.34], [-0.75, 0.75, -1.2, 0.34]);
    g.emissif(0.92).couleur(...poche);
    poches.forEach(([x, y, z, r], i) => {
      g.pulsation([x * 0.8, y, z], i * 1.3, 0.09, 2.4);
      g.pousser().deplacer(x, y, z).ellipsoide(r, r, r, 6, 4).depiler();
    });
    g.emissif(0).glissement([0, 1, 0], 0, 0.05, 2);
    g.lueur(1.4, 1.6, -1.2, 3.4, ...poche, 0.3).lueur(-1.4, 1.6, -1.2, 3.4, ...poche, 0.3).lueur(0, 1.6, -2.9, 2.6, ...poche, 0.3);
    // thorax, cou, tête
    g.bruit(0.05).couleur(...chitine);
    g.pousser().deplacer(0, 2.05, 0.95).ellipsoide(1.0, 0.9, 0.95, 8, 5).depiler();
    g.tube([[0, 2.2, 1.5], [0, 2.5, 1.9]], [0.6, 0.5], 6);
    g.couleur(...plaque);
    g.pousser().deplacer(0, 2.58, 2.05).tournerX(-0.3).ellipsoide(0.62, 0.52, 0.68, 8, 4).depiler();
    g.bruit(0);
    // collerette : pointes en éventail et voile entre elles
    const centre = [0, 2.75, 1.5], rayons = [];
    for (let i = 0; i < 9; i++) {
      const a = ((i - 4) / 4) * 2.05, l = 1.75 - Math.abs(i - 4) * 0.07;
      const base = [centre[0] + Math.sin(a) * 0.55, centre[1] + Math.cos(a) * 0.45, centre[2] + 0.1];
      const bout = [centre[0] + Math.sin(a) * (l + 0.2), centre[1] + Math.cos(a) * l, centre[2] - 0.55];
      rayons.push([base, bout]);
    }
    g.balancier(centre, [1, 0, 0], 0, 0.06, 1.3, true);
    g.couleur(...os);
    for (const [a, b] of rayons) g.tube([a, b], [0.14, 0], 4, 0.4, [0, 0, 1]);
    g.couleur(...voile).emissif(0.3);
    for (let i = 0; i + 1 < rayons.length; i++) {
      const a = rayons[i], b = rayons[i + 1];
      const m = (p, k) => [p[0][0] + (p[1][0] - p[0][0]) * k, p[0][1] + (p[1][1] - p[0][1]) * k, p[0][2] + (p[1][2] - p[0][2]) * k];
      g.face([a[0], m(a, 0.8), m(b, 0.8), b[0]], null, true);
    }
    g.emissif(0).glissement([0, 1, 0], 0, 0.05, 2);
    // grappe d'yeux verts
    g.emissif(1).couleur(...vert);
    g.symetrie(() => yeux(g, [[0.2, 2.78, 2.62, 0.115], [0.42, 2.62, 2.42, 0.095], [0.13, 2.56, 2.72, 0.085], [0.36, 2.93, 2.38, 0.075]], 6));
    yeux(g, [[0, 2.98, 2.48, 0.07]], 6);
    g.emissif(0).lueur(0, 2.75, 2.7, 1.9, ...vert, 0.5);
    // mandibules géantes
    g.symetrie(() => {
      g.balancier([0.4, 2.3, 2.4], [0, 1, 0], 0, 0.22, 2.2, true);
      g.couleur(...os).tube([[0.42, 2.3, 2.38], [0.86, 2.0, 2.78], [0.60, 1.56, 2.98], [0.16, 1.3, 2.9]], [0.2, 0.18, 0.11, 0], 4, 0.45, [0, 1, 0]);
      g.balancier([0.2, 2.2, 2.5], [0, 1, 0], 1.5, 0.3, 3.1, true);
      g.tube([[0.2, 2.22, 2.55], [0.36, 2.0, 2.8], [0.1, 1.8, 2.86]], [0.09, 0.075, 0], 4, 0.5, [0, 1, 0]);
    });
    // dix pattes
    g.couleur(...chitine);
    g.symetrie((c) => {
      const d = c < 0 ? PI : 0;
      [[1.45, 0.7], [0.85, 0.3], [0.2, 0], [-0.5, -0.3], [-1.2, -0.7]].forEach(([z, dz], i) => {
        const hanche = [0.85, 1.75, z], genou = [2.0 + (i % 2) * 0.15, 3.0 - Math.abs(i - 2) * 0.12, z + dz * 0.6], pied = [2.65 + (i % 2) * 0.1, 0, z + dz * 1.5];
        const ph = d + (i % 2) * PI;
        g.patte(hanche, pied, ph, 0.26, 0.22);
        const cheville = [genou[0] + 0.5, 1.3, genou[2] + dz * 0.5];
        g.couleur(...chitine).tube([hanche, genou, cheville], [0.24, 0.19, 0.12], 5);
        g.couleur(...os).tube([cheville, pied], [0.12, 0], 4);
        g.fixe();
      });
    });
    return { maillage: g.maillage(), rayon: 2.2, hauteur: 4.5, foulee: 2.4, lueur: poche };
  }

  // ---------------------------------------------------------------- crachat (centré sur son origine)
  function crachat(moteur) {
    const g = moteur.geo();
    const bile = [0.62, 1.0, 0.16];
    g.emissif(1).couleur(...bile).pulsation([0, 0, 0.05], 0, 0.12, 14);
    g.pousser().deplacer(0, 0, 0.06).ellipsoide(0.09, 0.09, 0.11, 6, 4).depiler();
    g.tube([[0, 0, 0.03], [0, 0, -0.08], [0, 0, -0.18]], [0.078, 0.045, 0], 6);
    g.pousser().deplacer(0.03, 0.03, -0.13).sphere(0.025, 4, 2).depiler();
    g.pousser().deplacer(-0.035, -0.02, -0.16).sphere(0.02, 4, 2).depiler();
    g.emissif(0).lueur(0, 0, 0.03, 0.8, ...bile, 0.55);
    return { maillage: g.maillage(), rayon: 0.18, hauteur: 0.35, foulee: 1, lueur: bile };
  }

  // ---------------------------------------------------------------- œuf
  function oeuf(moteur) {
    const g = moteur.geo();
    const coque = [0.40, 0.23, 0.50], racine = [0.20, 0.10, 0.24], veine = [0.92, 0.42, 1.0];
    const c = [0, 0.3, 0];
    g.pulsation([0, 0.1, 0], 0, 0.04, 2.2).bruit(0.012).couleur(...coque);
    g.tube([[0, 0.0, 0], [0, 0.07, 0], [0, 0.2, 0], [0, 0.34, 0], [0, 0.5, 0], [0, 0.63, 0], [0, 0.71, 0]], [0.12, 0.2, 0.258, 0.262, 0.215, 0.13, 0], 8);
    g.bruit(0).emissif(1).couleur(...veine);
    for (let k = 0; k < 5; k++) {
      const a = (k / 5) * PI * 2, pts = [];
      for (let i = 0; i <= 5; i++) {
        const e = -0.9 + i * 0.42, b = a + (i % 2) * 0.28 + i * 0.07, ry = e < 0 ? 0.31 : 0.42;
        pts.push([c[0] + 0.268 * Math.cos(e) * Math.cos(b), c[1] + ry * Math.sin(e), c[2] + 0.268 * Math.cos(e) * Math.sin(b)]);
      }
      g.tube(pts, [0.02, 0.018, 0.016, 0.013, 0.01, 0], 3);

<script id="sas-son">
/* ==========================================================================
   Le Dernier Sas : module de sons (Web Audio seulement, aucun fichier audio).

     pause(oui)                 fige tout (contexte suspendu) ou reprend
     jouer(nom, options)        options : { volume, pan, hauteur, distance }

     battement(force)           cœur du joueur presque mort (0 = arrêt)
     noms()                     liste des sons

   ========================================================================== */
(function () {
  'use strict';

  const CA = window.AudioContext || window.webkitAudioContext || null;
  const MAX_VOIX = 28;      // voix en même temps, au plus
  const ECART_MIN = 35;     // ms entre deux lectures du même son
  const ZERO = 0.003;       // « presque rien », -50 dB (une rampe exponentielle ne peut ni partir de 0 ni y arriver)

  let ctx = null;           // contexte audio (créé par demarrer)
  let maitre = null, muet = null, busSons = null, busAmb = null, busCoeur = null, rythme = null;
  let coupe = false, enPause = false, vol = 1, dernierDemarrage = -1e9;
  const voix = [];          // sons en cours
  const dernier = {};       // nom du son -> heure de sa dernière lecture
  let courbeDist = null;    // courbe de saturation, partagée
  const bruitBrut = {};     // données des bruits, calculées une fois
  const bruits = {};        // tampons des bruits, partagés
  const rendus = {};        // nom du son -> versions rendues d'avance (tampons)
  let fileRendu = null, direct = false;

  // Ambiance
  let niveau = 0, intensite = 0, fond = null, minuteur = 0, finFond = 0;
  let pasN = 0, pasT = 0, coeur = 0, coeurT = 0;

  const borne = (v, a, b) => (v < a ? a : v > b ? b : v);
  const al = (a, b) => a + Math.random() * (b - a);
  const horloge = () => (window.performance && performance.now ? performance.now() : Date.now());

  /* ---------- Bruits : blanc, rose (vent, souffles), brun (grondements) ---------- */

  function donneesBruit(couleur) {
    if (bruitBrut[couleur]) return bruitBrut[couleur];
    const n = 88200, fondu = 4000, brut = new Float32Array(n + fondu), d = new Float32Array(n);
    let b0 = 0, b1 = 0, b2 = 0, br = 0, max = 0;
    for (let i = 0; i < n + fondu; i++) {
      const w = Math.random() * 2 - 1;
      let x = w;
      if (couleur === 'rose') {
        b0 = 0.99765 * b0 + w * 0.099046; b1 = 0.963 * b1 + w * 0.2965164; b2 = 0.57 * b2 + w * 1.0526913;
        x = b0 + b1 + b2 + w * 0.1848;
      } else if (couleur === 'brun') {
        br = (br + 0.02 * w) / 1.02; x = br;
      }
      brut[i] = x;
    }
    // La fin se fond dans le début : la boucle ne claque pas.
    for (let i = 0; i < n; i++) {
      d[i] = i < fondu ? brut[i] * (i / fondu) + brut[n + i] * (1 - i / fondu) : brut[i];
      if (Math.abs(d[i]) > max) max = Math.abs(d[i]);
    }
    for (let i = 0; i < n; i++) d[i] /= max;
    bruitBrut[couleur] = d;
    return d;

  // Un tampon par couleur, créé une fois et partagé par tous les sons (un tampon audio ne dépend pas de son contexte).
  function tampon(c, couleur) {
    if (!bruits[couleur]) {
      const d = donneesBruit(couleur), t = c.createBuffer(1, d.length, c.sampleRate);
      t.getChannelData(0).set(d);

  function courbeSaturation() {
    if (!courbeDist) {
      courbeDist = new Float32Array(1024);
      for (let i = 0; i < 1024; i++) courbeDist[i] = Math.tanh((i / 511.5 - 1) * 1.6) / Math.tanh(1.6);
    }

  /* ---------- Courbes d'automatisation ----------
     Une courbe est un nombre (valeur fixe) ou un tableau [v0, t1, v1, t2, v2…] :
     temps en secondes depuis le début, rampe exponentielle vers chaque valeur ;
     un temps écrit en négatif demande une rampe linéaire (montées lentes, paliers). */
  function courbe(p, t, c, mult, max) {
    const m = mult || 1, lim = max || 1e9;
    if (typeof c === 'number') { p.value = Math.min(c * m, lim); return; }
    p.setValueAtTime(Math.min((c[0] || ZERO) * m, lim), t);
    for (let i = 1; i < c.length; i += 2) {
      const dt = c[i], v = Math.min((c[i + 1] || ZERO) * m, lim);

  /* ---------- Trousse : fabrique les nœuds d'un son et les libère à la fin ---------- */
  class Trousse {
    constructor(c, sortie, t, h) {

    lancer(src, t, dur, decalage) {

    o(type, dt, dur, f, g, dest) {

      courbe(ga.gain, t, g);

      this.n.push(os, ga);
      this.lancer(os, t, dur);
      return os;
    }
    // Bruit : couleur, départ, durée, filtre [type, fréquence, Q] ou null, gain, destination.

      n.connect(ga); ga.connect(dest || this.s);

      this.lancer(s, t, dur, Math.random() * 1.5);
      return ga;
    }
    // Gain seul (bus, enveloppe commune).
    g(g, dest, dt) {
      const ga = this.c.createGain();
      courbe(ga.gain, this.t + (dt || 0), g);
      ga.connect(dest || this.s); this.n.push(ga);
      return ga;
    }
    // Filtre.
    f(type, f, q, dest, dt) {
      const fi = this.c.createBiquadFilter();
      fi.type = type; courbe(fi.frequency, this.t + (dt || 0), f, this.h, this.max); fi.Q.value = q || 0.7;
      fi.connect(dest || this.s); this.n.push(fi);

    }

    d(pousse, dest) {

    }
    // Modulation d'amplitude (voix rauque, stridulation) : cadence, profondeur 0..0,5.
    am(dt, dur, f, prof, dest, type) {

      this.n.push(g, os, p);
      this.lancer(os, t, dur);
      return g;
    }
    // Grésillement : gain piloté par un bruit très lent (acide, soudure).
    gresil(dt, dur, cadence, force, dest) {
      const c = this.c, t = this.t + dt, g = c.createGain(), s = c.createBufferSource(), f = c.createBiquadFilter(), p = c.createGain(), w = c.createWaveShaper();

    }

      for (const s of this.src) { try { s.stop(t); } catch (e) { /* déjà finie */ } }
    }

      if (this.libre) return;
      this.libre = true;
      for (const n of this.n) { try { n.disconnect(); } catch (e) { /* rien */ } }

        k.o('sawtooth', i * 0.11, lg, f, i === 3 ? [0, -0.01, 0.3, -0.4, 0.26, 0.79, 0] : [0, -0.01, 0.3, 0.155, 0], lp);
        k.o('square', i * 0.11, lg, f * 2, [0, -0.01, 0.08, lg - 0.01, 0], lp);
      });
      k.o('sine', 0.33, 0.8, 1567.98, [0, -0.02, 0.18, 0.78, 0]);                              // scintillement
      k.o('sine', 0.33, 0.8, 2349.3, [0, -0.02, 0.07, 0.6, 0]);
      k.b('blanc', 0.33, 0.6, ['highpass', 7500, 0.7], [0.12, 0.55, 0]);
    }],
    record: [0, 0.597, 1.4, (k) => {
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {                             // montée de cloches
        const p = k.o('sine', i * 0.08, 0.3, f, [0, -0.006, 0.3, 0.28, 0]);
        k.o('sine', i * 0.08, 0.3, f * 3, [f * 0.6, 0.2, 10], p.frequency);
      });
      const lp = k.f('lowpass', 3000, 1);
      [523.25, 659.25, 783.99, 1046.5].forEach((f) => {                                        // accord final
        k.o('triangle', 0.42, 0.95, f, [0, -0.02, 0.2, -0.5, 0.17, 0.93, 0]);
        k.o('sawtooth', 0.42, 0.95, f * 1.003, [0, -0.02, 0.07, 0.9, 0], lp);
      });
      k.o('sine', 0.42, 0.9, 2093, [0, -0.02, 0.1, 0.8, 0]);
      k.b('blanc', 0.42, 0.7, ['highpass', 7500, 0.7], [0.12, 0.65, 0]);
    }],
    defaite: [0, 0.533, 2.5, (k) => {
      const lp = k.f('lowpass', [2200, 2.4, 110], 2);
      [73.42, 87.31, 103.83, 146.83, 207.65].forEach((f, i) => {                               // accord diminué qui s'effondre
        k.o('sawtooth', 0, 2.48, [f, 0.5, f * 0.97, 2.45, f * (0.5 - i * 0.02)], [0, -0.03, 0.25, 1.4, 0.2, 2.46, 0], lp);
      });
      k.o('sine', 0, 0.6, [80, 0.4, 30], [0.9, 0.55, 0]);
      k.o('triangle', 0, 2.4, [146.83, 2.4, 60], [0, -0.03, 0.2, 2.38, 0]);
      k.b('brun', 0, 2.4, ['lowpass', [800, 2.3, 100], 1], [0.4, 2.38, 0]);
    }]
  };

  /* ---------- Contexte et chaîne de sortie ---------- */

  // sons, ambiance, cœur -> volume général -> compresseur -> écrêteur doux -> coupure -> sortie
  function construire() {
    ctx = new CA();
    const comp = ctx.createDynamicsCompressor(), avant = ctx.createGain(), doux = ctx.createWaveShaper();
    const pts = new Float32Array(2048);
    maitre = ctx.createGain(); muet = ctx.createGain();
    busSons = ctx.createGain(); busAmb = ctx.createGain(); busCoeur = ctx.createGain(); rythme = ctx.createGain();
    maitre.gain.value = vol; muet.gain.value = coupe ? 0 : 1;
    busSons.gain.value = 0.9; busAmb.gain.value = 0.3; busCoeur.gain.value = 0.45; rythme.gain.value = 0;
    comp.threshold.value = -8; comp.knee.value = 6; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.16;
    // Le compresseur ne touche pas un son seul, il tasse les sons qui s'empilent (son gain de rattrapage est repris ici).
    // Écrêteur : sans effet sous 0,5, puis arrondi ; la sortie ne dépasse jamais 0,95.
    avant.gain.value = 0.5 * 0.63;
    for (let i = 0; i < 2048; i++) {
      const x = (i / 1023.5 - 1) * 2, a = Math.abs(x);
      pts[i] = a <= 0.5 ? x : (x < 0 ? -1 : 1) * (0.5 + 0.45 * Math.tanh((a - 0.5) / 0.45));
    }
    doux.curve = pts;
    busSons.connect(maitre); busAmb.connect(maitre); busCoeur.connect(maitre); rythme.connect(busAmb);
    maitre.connect(comp); comp.connect(avant); avant.connect(doux); doux.connect(muet); muet.connect(ctx.destination);
    // Un tampon vide joué dans le geste : débloque le son des anciens iPhone.
    const vide = ctx.createBufferSource();
    vide.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
    vide.connect(ctx.destination); vide.start(0);
  }

  /* Sons rendus d'avance : dès demarrer(), chaque son est calculé hors ligne dans un tampon, l'un après l'autre.
     Jouer un son rendu ne coûte presque rien (une source, un gain) ; tant qu'il n'est pas prêt, ou si le
     rendu hors ligne manque, le son est fabriqué en direct, nœud par nœud : même résultat. */
  function preparer() {
    const CH = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!CH || fileRendu) return;
    const noms = Object.keys(SONS);
    fileRendu = noms.concat(noms.filter((n) => SONS[n][2] < 1.2));   // puis une deuxième version des sons courts (leurs hasards changent)
    const suivant = () => {
      const nom = fileRendu.shift();
      if (!nom || !ctx) return;
      let fait = false;
      const fin = (t) => {
        if (fait) return;
        fait = true;
        if (t) (rendus[nom] || (rendus[nom] = [])).push(t);
        setTimeout(suivant, 0);
      };
      try {
        const fe = ctx.sampleRate, c = new CH(1, Math.ceil(fe * (SONS[nom][2] + 0.04)), fe);
        SONS[nom][3](new Trousse(c, c.destination, 0, 1));
        c.oncomplete = (e) => fin(e.renderedBuffer);
        const p = c.startRendering();
        if (p && p.then) p.then(fin, () => fin(null));
      } catch (e) { fin(null); }
    };
    suivant();
  }

  function demarrer() {
    if (!CA) return;
    dernierDemarrage = horloge();
    if (!ctx) {
      try { construire(); } catch (e) { ctx = null; return; }
      if (enPause && ctx.suspend) silence(ctx.suspend());
      if (niveau) appliquerAmbiance();
      preparer();
    }
    if (!enPause && ctx.state !== 'running' && ctx.resume) silence(ctx.resume());
    reglerMinuteur();
  }

  function couper(oui) {
    coupe = !!oui;
    if (ctx) muet.gain.setTargetAtTime(coupe ? 0 : 1, ctx.currentTime, 0.012);
  }

  function volume(v) {
    vol = borne(+v || 0, 0, 1);
    if (ctx) maitre.gain.setTargetAtTime(vol, ctx.currentTime, 0.02);
  }

  function pause(oui) {
    enPause = !!oui;
    if (ctx) {
      if (enPause) { if (ctx.suspend) silence(ctx.suspend()); } else {
        if (ctx.resume) silence(ctx.resume());
        dernierDemarrage = horloge();
      }
    }
    reglerMinuteur();
  }

  /* ---------- Lecture d'un son ---------- */

  // Coupe la voix la moins utile : faible, ou presque finie.
  function faireDeLaPlace(t) {
    let pire = null, note = Infinity;
    for (const v of voix) {
      const n = v.poids * (0.2 + Math.max(0, v.finT - t) / v.duree);
      if (n < note) { note = n; pire = v; }
    }
    if (!pire) return;
    const i = voix.indexOf(pire);
    voix.splice(i, 1);
    pire.s.gain.setTargetAtTime(0, t, 0.005);
    pire.arreter(t + 0.03);
    setTimeout(() => pire.liberer(), 120);
  }

  function jouer(nom, options) {
    const def = Object.prototype.hasOwnProperty.call(SONS, nom) ? SONS[nom] : null;
    if (!def || !ctx || coupe || enPause) return;
    const maint = horloge();
    if (ctx.state && ctx.state !== 'running' && maint - dernierDemarrage > 400) return;
    if (maint - (dernier[nom] || -1e9) < ECART_MIN) return;
    dernier[nom] = maint;
    const o = options || {}, t = ctx.currentTime + 0.003;
    const v = o.volume === undefined ? 1 : borne(+o.volume || 0, 0, 1);
    const pan = borne(+o.pan || 0, -1, 1), dist = Math.max(0, +o.distance || 0);
    const h = borne(+o.hauteur || 1, 0.25, 4) * (1 + (Math.random() * 2 - 1) * def[0]);   // légère variation à chaque lecture
    const att = dist ? 0.1 + 0.9 * Math.pow(1 - Math.min(dist, 60) / 60, 1.7) : 1;
    if (v * att < 0.002) return;
    // Voix restées après leur fin (évènement « ended » manqué) : libérées ici.
    for (let i = voix.length - 1; i >= 0; i--) if (t > voix[i].finT + 0.3) voix[i].liberer();
    while (voix.length >= MAX_VOIX) faireDeLaPlace(t);
    const g = ctx.createGain(), k = new Trousse(ctx, g, t, h);
    let fin = g;
    g.gain.value = v * att * def[1];
    k.n.push(g);
    if (dist > 2) {                                   // le son lointain perd ses aigus
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = Math.min(k.max, Math.max(700, 17000 * Math.exp(-dist / 19)));
      fin.connect(lp); fin = lp; k.n.push(lp);
    }
    if (pan && ctx.createStereoPanner) {
      const p = ctx.createStereoPanner();
      p.pan.value = pan; fin.connect(p); fin = p; k.n.push(p);
    }
    fin.connect(busSons);
    k.poids = v * att * (def[2] >= 1 ? 2 : 1);        // les sons longs (alertes, boss, motifs) sont coupés en dernier
    k.duree = def[2]; k.finT = t + def[2];
    voix.push(k);
    const prets = direct ? null : rendus[nom];
    if (prets) {                                       // son rendu d'avance : la hauteur change la vitesse de lecture
      const s = ctx.createBufferSource();
      s.buffer = prets[(Math.random() * prets.length) | 0]; s.playbackRate.value = h; s.connect(g);
      k.n.push(s); k.src.push(s); k.reste = 1; k.duree = def[2] / h; k.finT = t + k.duree;
      s.onended = () => k.liberer();
      s.start(t);
    } else {
      try { def[3](k); } catch (e) { k.arreter(0); k.liberer(); }
    }
  }

  /* ---------- Ambiance ---------- */

  const vers = (p, v, tc) => p.setTargetAtTime(v, ctx.currentTime, tc);

  // Couches continues : vent du désert et bourdon grave.
  function construireFond() {
    const k = new Trousse(ctx, busAmb, ctx.currentTime + 0.02, 1);
    const vent = k.g(0, busAmb), bourdon = k.g(0, busAmb);
    const bp = k.f('bandpass', 520, 0.7, k.am(0, 0, 0.13, 0.25, vent));          // le vent respire lentement
    k.b('rose', 0, 0, null, 1.5, bp);
    k.o('sine', 0, 0, 0.09, 260, bp.frequency);
    const sif = k.f('bandpass', 1700, 9, vent);                                   // sifflement dans les tôles
    k.b('blanc', 0, 0, null, 0.16, sif);
    k.o('sine', 0, 0, 0.053, 600, sif.frequency);
    const lp = k.f('lowpass', 210, 2.5, bourdon), f = [55, 55.4, 82.41, 27.5];
    const osc = [k.o('sawtooth', 0, 0, f[0], 0.5, lp), k.o('sawtooth', 0, 0, f[1], 0.4, lp),
      k.o('sine', 0, 0, f[2], 0.25, bourdon), k.o('sine', 0, 0, f[3], 0.3, bourdon)];
    k.o('sine', 0, 0, 0.06, 55, lp.frequency);
    const aigu = k.am(0, 0, 0.21, 0.5, bourdon);                                  // deux notes voisines, très loin : l'inquiétude
    k.o('sine', 0, 0, 1318.5, 0.014, aigu);
    k.o('sine', 0, 0, 1396.9, 0.01, aigu);
    fond = { k, vent, bourdon, lp, osc, f };
  }

  function detruireFond() {
    finFond = 0;
    if (!fond) return;
    fond.k.arreter(0);
    fond.k.liberer();
    fond = null;
  }

  // Trousse d'une note d'ambiance (hors des 28 voix).
  const note = (dest, t) => new Trousse(ctx, dest, t, 1);

  // Défaite : tout retombe, puis le silence.
  function retombee() {
    const k = note(busAmb, ctx.currentTime + 0.02), lp = k.f('lowpass', [900, 5, 80], 2);
    k.o('sawtooth', 0, 5.6, [110, 5.5, 41], [0, -0.4, 0.3, 4, 0.2, 5.55, 0], lp);
    k.o('sawtooth', 0, 5.6, [82.41, 5.5, 31], [0, -0.4, 0.3, 4, 0.2, 5.55, 0], lp);
    k.o('sine', 0, 5.6, [164.8, 5.5, 62], [0, -0.4, 0.1, 5.55, 0]);
    k.o('sine', 0, 0.8, [75, 0.5, 30], [0.7, 0.75, 0]);
    k.b('brun', 0, 5, ['lowpass', [500, 5, 90], 1], [0, -0.5, 0.35, 4.95, 0]);
  }

  function appliquerAmbiance() {
    if (!ctx) return;
    const n = niveau, vif = n === 2 || n === 3;
    if (finFond) { clearTimeout(finFond); finFond = 0; }
    if (n > 0 && n < 4 && !fond) construireFond();
    if (fond) {
      const tc = n === 4 ? 1.6 : n === 0 ? 0.35 : 0.6;
      vers(fond.vent.gain, [0, 0.6, 0.3, 0.2, 0][n], tc);
      vers(fond.bourdon.gain, [0, 0.5, 0.42, 0.75, 0][n], tc);
      if (n > 0 && n < 4) {
        vers(fond.lp.frequency, [0, 210, 260, 330][n], 1);
        fond.osc.forEach((o, i) => vers(o.frequency, fond.f[i] * (n === 3 ? 0.749 : 1), 0.8));   // le boss tire tout vers le grave
      }
    }
    vers(rythme.gain, vif ? 1 : 0, vif ? 0.05 : 0.25);
    if (vif) { pasN = 0; pasT = 0; }
    if (n === 4) retombee();
    if (n === 0 || n === 4) finFond = setTimeout(detruireFond, n ? 9000 : 2500);
    reglerMinuteur();
  }

  function ambiance(n, i) {
    n = n | 0;
    if (n < 0 || n > 4) n = 0;
    intensite = borne(+i || 0, 0, 1);
    if (n === niveau) return;
    niveau = n;
    if (ctx) appliquerAmbiance();
  }

  // Vague : un pas = une double-croche. Mi, mi, fa, ré : la seconde mineure met mal à l'aise.
  function pasVague(n, t, I, d) {
    const p = n % 16, mes = (n >> 4) % 4, f = [82.41, 82.41, 87.31, 73.42][mes], k = note(rythme, t);
    if (p === 0 || p === 8 || (p === 6 && I > 0.35) || ((p === 11 || p === 14) && I > 0.7)) {   // percussion sourde
      k.o('sine', 0, 0.22, [125, 0.08, 46], [0.8, 0.2, 0]);
      k.o('triangle', 0, 0.1, [250, 0.06, 95], [0.25, 0.09, 0]);
      k.b('brun', 0, 0.05, ['lowpass', 500, 1], [0.4, 0.045, 0]);
    }
    if (mes === 3 && p >= 12 && I > 0.2) k.o('sine', 0, 0.16, [[170, 150, 125, 100][p - 12], 0.12, 70], [0.45, 0.15, 0]); // roulement
    if (p % 2 === 0 || I > 0.55) {                                                              // basse synthétique
      const fb = f * (p % 8 === 6 || (p % 4 === 3 && I > 0.55) ? 2 : 1);
      k.o('sawtooth', 0, d * 0.95, fb, [0.3, d * 0.92, 0], k.f('lowpass', [fb * (3 + 6 * I), d * 0.9, fb * 1.3], 5));
    }
    if ((p % 4 === 2 && I > 0.25) || (p % 2 === 1 && I > 0.8)) k.b('blanc', 0, 0.035, ['highpass', 7000, 0.7], [0.1 + 0.08 * I, 0.03, 0]);
    if (p % 4 === 0) k.o('square', 0, 0.1, f * 2, [0.09, 0.09, 0], k.f('lowpass', 650 + 500 * I, 1)); // pulsation
    if (I > 0.6 && mes % 2 === 1 && (p === 8 || p === 10)) k.o('triangle', 0, d * 1.8, p === 8 ? 659.25 : 698.46, [0, -0.01, 0.06, d * 1.7, 0]);
    if (p === 0 && mes === 2 && I > 0.4) {                                                      // nappe dissonante
      const lg = d * 16, lp = k.f('lowpass', 1000, 1), env = [0, -lg * 0.6, 0.05, lg * 0.98, 0];
      k.o('sawtooth', 0, lg, 246.94, env, lp);
      k.o('sawtooth', 0, lg, 261.63, env, lp);
    }
  }

  // Boss : battement lent et lourd, bourdon qui s'ouvre, triton, métal lointain.
  function pasBoss(n, t, I, d) {
    const p = n % 16, mes = (n >> 4) % 4, f = [73.42, 73.42, 77.78, 69.3][mes], k = note(rythme, t);
    if (p === 0 || p === 3 || p === 8 || (p === 11 && I > 0.5)) {
      const g = p === 0 || p === 8 ? 1 : 0.6;
      k.o('sine', 0, 0.5, [105, 0.16, 36], [g, 0.48, 0]);
      k.o('triangle', 0, 0.25, [210, 0.12, 72], [g * 0.35, 0.23, 0]);
      k.b('brun', 0, 0.2, ['lowpass', 320, 1], [g * 0.7, 0.18, 0]);
    }
    if (p === 0) {
      const lg = d * 16, lp = k.f('lowpass', [190, lg * 0.5, 600 + 300 * I, lg, 190], 4), env = [0, -0.06, 0.22, -lg * 0.9, 0.2, lg, 0];
      k.o('sawtooth', 0, lg, f, env, lp);
      k.o('sawtooth', 0, lg, f * 1.008, env, lp);
      k.o('square', 0, lg, f / 2, [0, -0.06, 0.14, lg, 0], lp);
    }
    if (p === 8 && mes % 2 === 1) {
      const lp = k.f('lowpass', 1200, 1);
      k.o('sawtooth', 0, d * 6.1, f * 2, [0.1, d * 6, 0], lp);
      k.o('sawtooth', 0, d * 6.1, f * 2.8284, [0.08, d * 6, 0], lp);
    }
    if (p === 12) k.o('sine', 0, 0.7, 541, [300, 0.5, 20], k.o('sine', 0, 0.7, 196, [0.05, 0.68, 0]).frequency);
    if (mes === 3 && p >= 13) k.o('sine', 0, 0.2, [[120, 100, 82][p - 13], 0.15, 50], [0.5, 0.19, 0]);
    if (mes === 3 && p === 12) k.b('blanc', 0, d * 4, ['bandpass', [300, d * 4, 2600], 2], [0, -d * 3.9, 0.12, d * 4, 0]);
  }

  // Cœur : deux coups sourds.
  function battre(t, f) {
    const k = note(busCoeur, t), lp = k.f('lowpass', 420, 1);
    [0, 0.17].forEach((dt, i) => {
      const g = (0.3 + 0.45 * f) * (i ? 0.65 : 1);
      k.o('sine', dt, 0.2, [i ? 62 : 72, 0.09, 40], [g, 0.18, 0], lp);
      k.o('triangle', dt, 0.13, [i ? 150 : 185, 0.07, 90], [g * 0.5, 0.12, 0], lp);
    });
  }

  // Programme les notes un peu à l'avance (0,2 s), sur l'horloge du contexte.
  function tic() {
    if (!ctx || enPause || coupe || (ctx.state && ctx.state !== 'running')) return;
    const t = ctx.currentTime;
    if (niveau === 2 || niveau === 3) {
      if (pasT < t) pasT = t + 0.06;
      while (pasT < t + 0.2) {
        const d = 15 / (niveau === 2 ? 92 + 56 * intensite : 62 + 16 * intensite);
        (niveau === 2 ? pasVague : pasBoss)(pasN, pasT, intensite, d);
        pasT += d; pasN++;
      }
    }
    if (coeur > 0) {
      if (coeurT < t) coeurT = t + 0.05;
      while (coeurT < t + 0.2) { battre(coeurT, coeur); coeurT += 60 / (62 + 48 * coeur); }
    }
  }

  function reglerMinuteur() {
    const besoin = !!ctx && !enPause && (niveau === 2 || niveau === 3 || coeur > 0);
    if (besoin && !minuteur) { minuteur = setInterval(tic, 40); tic(); }
    else if (!besoin && minuteur) { clearInterval(minuteur); minuteur = 0; }
  }

  function battement(force) {
    coeur = borne(+force || 0, 0, 1);
    reglerMinuteur();
  }

  /* ---------- Essais : rendu d'un son hors ligne, sans la chaîne de sortie ---------- */
  function rendre(nom, options) {
    const CH = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const def = Object.prototype.hasOwnProperty.call(SONS, nom) ? SONS[nom] : null;
    if (!def || !CH) return Promise.resolve(null);
    const o = options || {}, c = new CH(1, Math.ceil(44100 * (def[2] + 0.3)), 44100), g = c.createGain();
    g.gain.value = (o.brut ? 1 : def[1]) * (o.volume === undefined ? 1 : o.volume);
    g.connect(c.destination);
    def[3](new Trousse(c, g, 0, (o.hauteur || 1) * (1 + (Math.random() * 2 - 1) * def[0])));
    return c.startRendering().then((t) => t.getChannelData(0));
  }

  window.SAS_SON = {
    demarrer, couper, estCoupe: () => coupe, volume, pause, jouer, ambiance, battement,
    noms: () => Object.keys(SONS),
    essai: {
      contexte: () => ctx, sortie: () => muet, voix: () => voix.length, fond: () => !!fond,
      rendus: () => rendus, prets: () => Object.keys(rendus).length, attente: () => (fileRendu ? fileRendu.length : -1), direct: (oui) => { direct = !!oui; },
      octets: () => Object.keys(rendus).reduce((a, n) => a + rendus[n].reduce((b, t) => b + t.length * 4, 0), 0),
      duree: (nom) => (SONS[nom] ? SONS[nom][2] : 0), rendre
    }
  };
})();
</script>
