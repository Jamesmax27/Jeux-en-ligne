  // Radar : vue de dessus centrée sur le joueur, l'avant en haut.
  const ctxRadar = $('radar').getContext('2d');
  function dessinerRadar(E) {
    const c = ctxRadar, T = 132, m = T / 2, portee = 42, k = m / portee;
    c.clearRect(0, 0, T, T);
    c.save();
    c.beginPath(); c.arc(m, m, m - 1, 0, TAU); c.clip();
    c.translate(m, m);
    c.rotate(moi.lacet);
    const X = (x) => (x - moi.x) * k, Y = (y) => -(y - moi.y) * k;
    // Façade du bunker et sas.
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(X(-24), Y(0.6)); c.lineTo(X(24), Y(0.6)); c.stroke();
    c.fillStyle = '#6fe3ff'; c.fillRect(X(-3.2), Y(0.6) - 3, 6.4 * k, 6);
    c.fillStyle = 'rgba(120,70,50,.6)';
    for (const O of CARTE.obstacles) { c.beginPath(); c.arc(X(O[0]), Y(O[1]), O[2] * k, 0, TAU); c.fill(); }
    for (let i = 0; i < E.tu.length; i++) if (E.tu[i].t) { c.fillStyle = '#ff9d3c'; c.fillRect(X(CARTE.tourelles[i][0]) - 3, Y(CARTE.tourelles[i][1]) - 3, 6, 6); }
    for (let i = 0; i < E.ba.length; i++) if (E.ba[i].pv > 0) { c.fillStyle = '#b9c2d6'; c.fillRect(X(CARTE.barricades[i][0]) - 4, Y(CARTE.barricades[i][1]) - 2, 8, 4); }
    for (let i = 0; i < E.e.length; i++) {
      const e = E.e[i];
      if (e.mo) continue;
      c.fillStyle = e.t === 5 ? '#ff5aa8' : e.t === 4 ? '#ffb347' : e.t === 3 ? '#7fb3ff' : '#ff4d4d';
      const r = e.t === 5 ? 6 : e.t === 3 ? 4 : e.t === 0 || e.t === 6 ? 1.8 : 2.6;
      c.beginPath(); c.arc(X(e.x), Y(e.y), r, 0, TAU); c.fill();
    }
    for (let j = 0; j < 4; j++) if (j !== partie.camp && E.j[j].on) { c.fillStyle = '#9dff5a'; c.beginPath(); c.arc(X(E.j[j].x), Y(E.j[j].y), 3, 0, TAU); c.fill(); }
    c.restore();
    // Le joueur : un triangle au centre.
    c.fillStyle = '#fff';
    c.beginPath(); c.moveTo(m, m - 6); c.lineTo(m + 4.5, m + 5); c.lineTo(m - 4.5, m + 5); c.closePath(); c.fill();
  }

  // ------------------------------------------------------------------------

  const boutique = { onglet: 'defenses', choix: null };

    else if (etat === 'ferme') droite = `<svg><use href="#i-cadenas"/></svg>${t('boutique.grade', { n: prix })}`;
    else if (etat === 'plein') droite = t('boutique.plein');

    b.innerHTML = `<svg><use href="#${ICONES_ARTICLES[id] || 'i-credits'}"/></svg><span class="nom"></span><span class="prix">${droite}</span><span class="desc"></span>`;
    b.querySelector('.nom').textContent = nom;
    b.querySelector('.desc').textContent = desc;
    if (etat !== 'achat') b.disabled = true;

  function acheter(article, emp) {
    const J = monEtat(), B = D.boutique[article];
    const o = [6, article, emp === undefined ? 0 : emp];
    if (!SIM.valide(partie.etat, partie.camp, o)) {
      const prix = Array.isArray(B.prix) ? 0 : B.prix;

    partie.ordre(o);

  function achatVu(article, emp) {

  function rendreBoutique() {
    if (etatJeu !== 'boutique') return;

    ecrire($('boutique-credits'), nombre(J.cr));

    for (const o of document.querySelectorAll('.onglet')) o.classList.toggle('a', o.dataset.onglet === boutique.onglet);
    corps.textContent = '';
    const etatDe = (B, possede, plein) => (J.gd < B.grade ? 'ferme' : possede ? 'possede' : plein ? 'plein' : 'achat');

    if (boutique.onglet === 'armes') {
      for (let i = 1; i <= 4; i++) {
        const B = D.boutique[i];

        corps.appendChild(carteArticle(B.id, t('article.' + B.id), t('desc.' + B.id), etat === 'ferme' ? B.grade : B.prix, etat, () => acheter(i)));
      }
      const M = D.boutique[5];
      let manque = false;
      for (let i = 1; i < ARMES.length; i++) if ((J.ar & (1 << i)) && (J.re[i] < ARMES[i].reserve || J.mu[i] < ARMES[i].chargeur)) manque = true;
      corps.appendChild(carteArticle('munitions', t('article.munitions'), t('desc.munitions'), M.prix, J.ar === 1 ? 'plein' : manque ? 'achat' : 'plein', () => acheter(5)));

      }

      corps.appendChild(carteArticle('reparation', t('article.reparation') + ' (' + Math.ceil(E.sas / E.sasMax * 100) + ' %)', t('desc.reparation'), R.prix, E.sas >= E.sasMax ? 'plein' : 'achat', () => acheter(13)));
      return;
    }

    // Défenses : plan de l'esplanade, emplacements à toucher.
    const plan = document.createElement('div');
    plan.id = 'plan';
    const PX = (x) => (x + 24) / 48 * 100 + '%', PY = (y) => (1 - y / 44) * 100 + '%';
    for (const O of CARTE.obstacles) {
      if (O[1] > 44) continue;
      const r = document.createElement('i'); r.className = 'roche';
      r.style.cssText = `left:${PX(O[0])};top:${PY(O[1])};width:${O[2] * 2 / 48 * 100}%;aspect-ratio:1`;

    const porte = document.createElement('i'); porte.className = 'porte'; plan.appendChild(porte);
    const place = (genre, n, p) => {

      let icone = genre === 'barricade' ? 'i-barricade' : 'i-tourelle', pose = false, niv = 0, vie = 0;
      if (genre === 'tourelle') { const T = E.tu[n]; if (T.t) { pose = true; niv = T.n; icone = T.t === 2 ? 'i-lourde' : 'i-tourelle'; vie = T.pv / D.tourelles[T.t].pv[T.n - 1]; } }
      else if (E.ba[n].pv > 0) { pose = true; vie = E.ba[n].pv / D.barricade.pv; }

      b.innerHTML = `<svg><use href="#${icone}"/></svg>` + (niv ? '<span class="niv">' + '<i></i>'.repeat(niv) + '</span>' : '') + (pose ? `<span class="vie"><i style="width:${Math.round(vie * 100)}%"></i></span>` : '');
      b.addEventListener('click', () => { boutique.choix = { genre, n }; messageBoutique(''); SON.jouer('clic'); rendreBoutique(); });
      plan.appendChild(b);
    };
    CARTE.tourelles.forEach((p, n) => place('tourelle', n, p));

  function sauvegardeExiste() { try { return window.JEL_SAVE.existe(JEU); } catch (e) { return false; } }
  $('o-sens').addEventListener('input', (e) => { meta.options.sens = Number(e.target.value) || 10; });
  $('o-volume').addEventListener('input', (e) => { meta.options.volume = Number(e.target.value) || 0; appliquerOptions(); SON.demarrer(); SON.jouer('clic'); });
  for (const [id, cle] of [['o-tirauto', 'tirAuto'], ['o-inverse', 'inverse'], ['o-qualite', 'qualite']]) {
    $(id).addEventListener('click', () => { meta.options[cle] = !meta.options[cle]; if (cle === 'tirAuto') tirAutoChoisi = true; majOptions(); appliquerOptions(); SON.jouer('clic'); });
  }
  $('b-options-ok').addEventListener('click', () => {
    garderOptions();
    SON.jouer('clic');
    if (retourOptions === 'pause') { etatJeu = 'pause'; montrerEcran('pause'); } else { etatJeu = 'titre'; montrerEcran('titre'); }
  });

  function majSon() {
    const icone = meta.options.muet ? '#i-muet' : '#i-son';
    $('b-son-titre').firstElementChild.firstElementChild.setAttribute('href', icone);
    $('b-son-pause').firstElementChild.firstElementChild.setAttribute('href', icone);
    $('son-pause-texte').textContent = t(meta.options.muet ? 'son.coupe' : 'son.actif');
  }
  function basculerSon() {
    meta.options.muet = !meta.options.muet;
    SON.demarrer();
    SON.couper(meta.options.muet);
    majSon();
    garderOptions();
    if (!meta.options.muet) SON.jouer('clic');
  }
  $('b-son-titre').addEventListener('click', basculerSon);
  $('b-son-pause').addEventListener('click', basculerSon);

  // ------------------------------------------------------------------------
  // Pause
  // ------------------------------------------------------------------------
  function ouvrirPause() {
    if (etatJeu !== 'jeu') return;
    etatJeu = 'pause';
    touches.clear(); entree.tir = false; tirTactile = false;
    partie.pause(true);
    SON.pause(true);
    libererPointeur();
    desarmerRecommencer();
    montrerEcran('pause');
  }
  function reprendre() {
    if (etatJeu !== 'pause') return;
    etatJeu = 'jeu';
    montrerEcran(null);
    SON.pause(false);
    partie.pause(false);
    verrouillerPointeur();
  }
  let recommencerArme = false;
  function desarmerRecommencer() { recommencerArme = false; $('b-recommencer').textContent = t('pause.recommencer'); }
  $('b-pause').addEventListener('click', ouvrirPause);
  $('b-reprendre').addEventListener('click', () => { pleinEcran(); reprendre(); });
  $('b-recommencer').addEventListener('click', () => {
    // Deux touchers : la partie en cours est perdue.
    if (!recommencerArme) { recommencerArme = true; $('b-recommencer').textContent = t('pause.confirmer'); return; }
    SON.pause(false);
    nouvellePartie(1, null, 0);
  });
  $('b-pause-options').addEventListener('click', () => ouvrirOptions('pause'));
  $('b-pause-aide').addEventListener('click', () => ouvrirAide('pause'));
  $('b-accueil').addEventListener('click', () => { garderPartie(); SON.pause(false); allerAccueil(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && etatJeu === 'jeu') ouvrirPause(); });

  // Touches dans les menus.
  function toucheMenu(code, e) {
    if (etatJeu === 'pause' && (code === 'Escape' || code === 'KeyP')) { e.preventDefault(); reprendre(); }
    else if (etatJeu === 'boutique' && (code === 'Escape' || code === 'KeyB' || code === 'KeyE')) { e.preventDefault(); fermerBoutique(); }
    else if (etatJeu === 'boutique' && (code === 'Enter' || code === 'NumpadEnter') && document.activeElement === document.body) { fermerBoutique(); pret(); }
    else if (etatJeu === 'aide' && code === 'Escape') fermerAide();
  }

  // ------------------------------------------------------------------------
  // Écran titre : grade, record
  // ------------------------------------------------------------------------
  function majTitre() {
    const g = gradeDe(meta.xp);
    $('grade-nom').textContent = t('grade.titre', { n: g, nom: t('grade.nom.' + g) });
    const bas = GRADES_XP[g - 1], haut = g < GRADES_XP.length ? GRADES_XP[g] : null;
    $('grade-xp').textContent = haut ? t('grade.xp', { n: nombre(meta.xp), max: nombre(haut) }) : t('grade.max');
    $('jauge-grade').firstElementChild.style.transform = `scaleX(${haut ? borner((meta.xp - bas) / (haut - bas), 0, 1) : 1})`;
    const suite = g < GRADES_XP.length ? deblocagesDe(g + 1) : [];
    $('grade-suite').textContent = suite.length ? t('grade.suite', { n: g + 1, liste: suite.join(', ') }) : '';
    $('record').textContent = meta.record.vague > 0 ? t('titre.record', { n: meta.record.vague, score: nombre(meta.record.score) }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }
  let boutonEffacer = null;

  // ------------------------------------------------------------------------
  // Fin de partie
  // ------------------------------------------------------------------------
  function montrerFin() {
    const E = partie.etat, J = E.j[partie.camp];
    etatJeu = 'fin';
    libererPointeur();
    const gagnees = E.v - 1;                                   // vagues gagnées (la dernière est perdue)
    const gain = Math.round(J.sc / 10) + gagnees * 20;
    const avant = gradeDe(meta.xp);
    const record = E.v > meta.record.vague || (E.v === meta.record.vague && J.sc > meta.record.score);
    meta.xp += gain;
    if (record) meta.record = { vague: E.v, score: J.sc };
    const apres = gradeDe(meta.xp);
    // La partie est finie : plus rien à reprendre, on garde l'expérience, le record et les réglages.
    ecrireSauvegarde({ niveau: 1, score: 0, partie: null });
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: E.v });

    $('fin-titre').textContent = t('fin.titre');
    $('fin-raison').textContent = t(E.rf === 1 ? 'fin.sas' : 'fin.equipe');
    $('fin-vague').textContent = t('fin.vague', { n: E.v });
    $('fin-record').textContent = record ? t('fin.record') : meta.record.vague ? t('fin.recordActuel', { n: meta.record.vague }) : '';
    const stats = $('fin-stats');
    stats.textContent = '';
    const ligne = (cle, valeur) => { const a = document.createElement('span'); a.textContent = t(cle); const b = document.createElement('b'); b.textContent = valeur; stats.append(a, b); };
    ligne('fin.score', nombre(J.sc));
    ligne('fin.tues', nombre(J.tu));
    ligne('fin.precision', moi.tirs ? Math.round(moi.touches / moi.tirs * 100) + ' %' : '—');
    ligne('fin.temps', Math.floor(tempsPartie / 60) + ' min ' + String(Math.floor(tempsPartie % 60)).padStart(2, '0') + ' s');
    $('fin-grade').textContent = t('grade.titre', { n: apres, nom: t('grade.nom.' + apres) });
    $('fin-xp-gain').textContent = t('fin.xp', { n: nombre(gain) });
    const bas = GRADES_XP[apres - 1], haut = apres < GRADES_XP.length ? GRADES_XP[apres] : null;
    const j = $('jauge-fin').firstElementChild;
    j.style.transform = 'scaleX(0)';
    setTimeout(() => { j.style.transform = `scaleX(${haut ? borner((meta.xp - bas) / (haut - bas), 0, 1) : 1})`; }, 60);
    let debloque = '';
    if (apres > avant) {
      const liste = [];
      for (let g = avant + 1; g <= apres; g++) liste.push(...deblocagesDe(g));
      debloque = t('fin.promotion', { liste: liste.join(', ') });
      setTimeout(() => SON.jouer('grade'), 900);
    } else if (record) setTimeout(() => SON.jouer('record'), 900);
    $('fin-debloque').textContent = debloque;
    montrerEcran('fin');
  }
  $('b-rejouer').addEventListener('click', () => { pleinEcran(); SON.demarrer(); nouvellePartie(1, null, 0); });
  $('b-fin-accueil').addEventListener('click', allerAccueil);

  // ==========================================================================
  // 5. Parties, écran titre animé, boucle des images, démarrage
  // ==========================================================================
  const VERSION_ETAT = 1;       // format de la partie gardée (une autre version : on repart du début de la vague)
  let tempsPartie = 0;          // secondes jouées dans cette partie
  let instantaneVague = null;   // état au début de la vague en cours (c'est lui qu'on garde pendant une vague)
  let finPrevue = 0;            // heure (tempsJeu) d'affichage de l'écran de fin, 0 = pas de fin en cours

  // Premier toucher sur un appareil qui ne s'était pas annoncé tactile : les commandes au doigt apparaissent.
  function surPassageTactile() {
    libererPointeur();
    if (etatJeu !== 'titre' && !modeDemo) { $('tactile').hidden = false; construireCapacites(); cacheTextes.clear(); }
    if (etatJeu === 'aide') montrerEtapeAide(aideEtape);
    redimensionner();
  }

  // Sur téléphone, la partie se joue en plein écran (rien du site autour, pas de retour en arrière par mégarde).
  // Le navigateur ne l'accorde que dans un geste du joueur ; s'il refuse (iPhone), le jeu continue tel quel.
  function pleinEcran() {
    if (!TACTILE) return;
    try {
      const el = document.documentElement;
      if (document.fullscreenElement || document.webkitFullscreenElement) return;
      const f = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!f) return;
      const p = f.call(el, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(() => {});
    } catch (e) { /* refusé */ }
  }

  function partieEnCours() { return !!partie && !modeDemo && partie.mode !== 'arret' && etatJeu !== 'titre' && etatJeu !== 'fin'; }

  function viderMonde() {
    vues.clear(); cadavres.length = 0; projectiles.length = 0;
    precParId.clear(); precK = -1;
    zoneRalentie = null; eclairSoin = 0; secousse = 0; eclairRouge = 0; forceCoup = 0;
    finPrevue = 0; instantaneVague = null;
    if (moteur.vider) moteur.vider();
    $('fil').textContent = '';
    $('annonce').hidden = true;
    $('prep').hidden = true;
    SON.battement(0);
  }

  // Types d'aliens déjà rencontrés avant la vague v (pour ne présenter que les nouveaux).
  function aliensAvant(v) {
    let bits = 0;
    for (let i = 0; i < Math.min(v - 1, D.vagues.length); i++) for (const g of D.vagues[i].g) bits |= 1 << g[0];
    return bits;
  }

  // Nouvelle partie à la vague donnée, ou reprise d'une partie gardée (etatGarde).
  function nouvellePartie(vague, etatGarde, score) {
    modeDemo = false;
    viderMonde();
    gradeJoueur = gradeDe(meta.xp);
    let etat = null;
    if (etatGarde && etatGarde.vs === VERSION_ETAT && etatGarde.etat && Array.isArray(etatGarde.etat.j) && Array.isArray(etatGarde.etat.e)) etat = etatGarde.etat;
    const graine = (Math.random() * 4294967296) >>> 0;
    partie.local({ graine, config: { joueurs: 1, vague: Math.max(1, Math.floor(vague) || 1) }, etat });
    const E = partie.etat, J = E.j[0];
    if (!etat) {
      partie.ordre([9, gradeJoueur]);
      if (score > 0) J.sc = Math.floor(score);            // reprise sans partie gardée : le score est repris
    } else gradeJoueur = J.gd;
    dernierFx = E.k;
    aliensVus = aliensAvant(E.v + (E.ph === 1 ? 1 : 0));
    mueVue = E.v > 8;
    Object.assign(moi, { x: J.x, y: J.y, lacet: 0, tangage: 0, vx: 0, vy: 0, recul: 0, arme: J.ac, recharge: 0, prochainTir: 0, derniereAction: -1, changement: -1, dernierEnvoi: -1, rafale: 0, tirs: 0, touches: 0, cibleVue: null });
    moi.chargeur = J.mu.slice(); moi.tues = [0, 0, 0, 0, 0, 0, 0];
    tempsPartie = 0;
    instantaneVague = E.ph === 1 ? { vs: VERSION_ETAT, etat: partie.instantane() } : null;
    construireCapacites();
    cacheTextes.clear();
    etatJeu = 'jeu';
    montrerEcran(null);
    $('tactile').hidden = !TACTILE;
    SON.ambiance(E.ph === 1 ? 2 : 1, 0.3);
    if (meta.options.tuto) verrouillerPointeur();
    if (!meta.options.tuto) {
      // Première partie : la démonstration animée d'abord, le temps arrêté.
      meta.options.tuto = true;
      partie.pause(true);
      ouvrirAide('jeu', () => { etatJeu = 'jeu'; montrerEcran(null); partie.pause(false); verrouillerPointeur(); });
    }
  }

  // Garde la partie en cours (fermeture de la page, retour à l'accueil).
  function garderPartie() {
    if (!partieEnCours() || partie.etat.nj !== 1 || partie.resultat) return;
    const E = partie.etat;
    const garde = E.ph === 0 ? { vs: VERSION_ETAT, etat: partie.instantane() } : instantaneVague;
    ecrireSauvegarde({ niveau: E.v, score: E.j[partie.camp].sc, partie: garde });
  }

  function allerAccueil() {
    partie.quitter();
    SON.battement(0);
    etatJeu = 'titre';
    lancerDemo();
    montrerEcran('titre');
    majTitre();
    SON.ambiance(1, 0);
  }

  function effacerProgression() {
    meta.xp = 0; meta.record = { vague: 0, score: 0 };
    majTitre();
  }

  // --- Écran titre : la simulation joue toute seule derrière le titre -------------
  function lancerDemo() {
    modeDemo = true;
    viderMonde();
    partie.local({ graine: (Math.random() * 4294967296) >>> 0, config: { joueurs: 1, vague: 8 } });
    const E = partie.etat, J = E.j[0];
    E.ctl[0] = 3;                                          // le personnage est tenu par le robot
    J.ar = 3; J.ac = 1; J.mu[1] = ARMES[1].chargeur; J.re[1] = 9999; J.pv = 100000;
    for (const [n, type, niveau] of [[0, 1, 1], [1, 2, 1]]) { E.tu[n].t = type; E.tu[n].n = niveau; E.tu[n].pv = 100000; }
    E.sas = 1e9; E.sasMax = 1e9;
    E.tp = 30;
    dernierFx = E.k;
  }

  function cameraDemo() {
    const a = tempsJeu * 0.05;
    // Vue du défenseur : dos au sas, les tourelles devant, les aliens qui arrivent du fond du canyon.
    cam.x = 2.6 + Math.sin(a) * 2.2; cam.z = 2.9 + Math.cos(a * 0.8) * 0.4; cam.y = 3.1 + Math.sin(a * 1.3) * 0.3;
    cam.lacet = -0.1 + Math.sin(a * 0.7) * 0.14; cam.tangage = 0.02;
    const aspect = innerWidth / Math.max(1, innerHeight);
    cam.fov = borner(2 * Math.atan(Math.tan(26 * Math.PI / 180) / aspect) * 180 / Math.PI, 60, 92);
  }

  // --- Taille de l'image et qualité -------------------------------------------------
  let echelleRendu = 1, cumulImages = 0, nImages = 0;
  function redimensionner() {
    if (!moteur) return;
    const max = meta.options.qualite ? (TACTILE ? 1.75 : 2) : 1;
    moteur.redimensionner(innerWidth, innerHeight, Math.min(window.devicePixelRatio || 1, max) * echelleRendu);
  }
  window.addEventListener('resize', redimensionner);
  window.addEventListener('orientationchange', redimensionner);

  // --- Une image ------------------------------------------------------------------------
  let dernierTemps = 0;
  function image(ts) {
    requestAnimationFrame(image);
    const dtReel = Math.min(0.1, (ts - dernierTemps) / 1000 || 0.016);
    dernierTemps = ts;
    if (!moteur || moteur.perdu) return;
    const fige = partie.enPause;
    const dt = fige ? 0 : Math.min(0.05, dtReel);
    dtImage = dt;
    tempsJeu += dt;

    // Appareil trop lent : on dessine moins de points (une fois ou deux, pas plus).
    cumulImages += dtReel; nImages += 1;
    if (nImages >= 90) {
      if (cumulImages / nImages > 0.03 && echelleRendu > 0.6 && !document.hidden) { echelleRendu *= 0.8; redimensionner(); }
      cumulImages = 0; nImages = 0;
    }

    if (modeDemo) {
      if (partie.resultat || partie.mode !== 'local') lancerDemo();
      cameraDemo();
    } else {
      if (etatJeu === 'jeu' && !partie.resultat) { tempsPartie += dt; deplacer(dt); majArmes(dt); }
      poserCamera();
    }
    if (!fige) traiterEffets();
    dessinerMonde();
    if (!modeDemo) dessinerArme();
    moteur.fin();
    if (modeDemo) return;
    majAffichage();

    // Défaite : deux secondes pour voir ce qui se passe, puis le bilan.
    if (partie.resultat && etatJeu === 'jeu') {
      if (!finPrevue) {
        finPrevue = tempsJeu + 2.4;
        annoncer(t(partie.etat.rf === 1 ? 'annonce.sasTombe' : 'annonce.equipeTombee'), '', true, 4);
        SON.jouer('defaite'); SON.ambiance(4, 0); SON.battement(0);
        secousse = 1;
      } else if (tempsJeu >= finPrevue) montrerFin();
    }
  }

  // --- Démarrage ------------------------------------------------------------------------
  function demarrer() {
    lireSauvegarde();
    if (!chargerMoteur()) {
      document.querySelectorAll('.ecran').forEach((e) => { e.hidden = true; });
      $('ecran-incompatible').hidden = false;
      return;
    }
    partie = new PartieLocale(SIM);
    SON.volume(meta.options.volume / 10);
    SON.couper(meta.options.muet);
    majSon();
    redimensionner();

    $('b-jouer').addEventListener('click', () => {
      pleinEcran();
      SON.demarrer();
      SON.jouer('clic');
      let d = null;
      try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
      // Une partie est gardée : « Continuer » (à la vague gardée) ou « Nouvelle partie ».
      if (d && (d.niveau > 1 || d.partie)) {
        window.JEL_SAVE.reprise({
          jeu: JEU,
          onContinuer: (s) => nouvellePartie(s.niveau, s.partie, s.score),
          onNouvelle: () => nouvellePartie(1, null, 0),
          onEffacer: effacerProgression,
        });
      } else nouvellePartie(1, null, 0);
    });
    $('b-aide').addEventListener('click', () => { SON.demarrer(); ouvrirAide('titre'); });
    $('b-options').addEventListener('click', () => { SON.demarrer(); ouvrirOptions('titre'); });
    boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('zone-effacer'), apres: effacerProgression });
    window.JEL_SAVE.surFermeture(() => { if (partieEnCours()) garderPartie(); });

    majTitre();
    lancerDemo();
    montrerEcran('titre');
    requestAnimationFrame(image);
  }
  // Poignée pour les essais automatiques (aucun effet sur le jeu).
  window.SAS_JEU = { partie: () => partie, moi, meta, cam, etat: () => etatJeu, moteur: () => moteur };
  demarrer();

})();
</script>
</body>
</html>
