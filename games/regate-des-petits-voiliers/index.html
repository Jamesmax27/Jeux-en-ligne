<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }

    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });

  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {

    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);

    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {

        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);

    }

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

    try { texte = JSON.stringify(tout); } catch (e) { return false; }

      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }

    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }

  }

  function texte(cle, vars) {

  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {

      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
'use strict';
/* ==========================================================================
   La régate des petits voiliers — Free Micro Games
   Un petit voilier fait la course contre trois bateaux rigolos. On oriente la
   voile en glissant le doigt (ou flèches ← →) : le bateau suit sa voile et va
   plus vite quand elle suit la flèche du vent. 20 courses, 4 mers.

   ========================================================================== */

const lerp = (a, b, u) => a + (b - a) * u;
function hasardGraine(graine) { // générateur pseudo-aléatoire à graine fixe (mulberry32)
  let s = graine >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const $ = (id) => document.getElementById(id);

// ---------- Réglages ----------
const LARG = 360;          // largeur du monde (unités)
const PAS = 40;            // pas des bords de mer

const MARGE_HAUT = 1300;   // …jusqu'à l'arrivée + 1300
const VMAX = 110;          // vitesse maximale du voilier (unités / s)
const VOILE_MAX = 1.13;    // angle maximal de la voile (65°)
const SEGMENT = 440;       // longueur d'un tronçon de course

// Les 4 mers (une nouvelle tous les 5 courses)

// ---------- Progression (sauvegarde save.js) ----------
const P = {
  etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), scores: NIVEAUX.map(() => 0),
  coq: 0, achats: { c: [0], v: [0], f: [0] }, equipe: { c: 0, v: 0, f: 0 }, niveauMax: 1, muet: false, scoreSauve: 0,
};
function liste(x, n, defaut) { // tableau de nombres sûr
  const r = [];
  for (let i = 0; i < n; i++) { const v = Array.isArray(x) ? Number(x[i]) : NaN; r.push(isFinite(v) && v >= 0 ? v : defaut); }
  return r;
}
function chargerProgres() {
  let d = null;
  try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
  if (!d) return;
  P.etoiles = liste(d.etoiles, NIVEAUX.length, 0).map((v) => clamp(Math.floor(v), 0, 3));
  P.records = liste(d.records, NIVEAUX.length, 0);
  P.scores = liste(d.scores, NIVEAUX.length, 0);
  P.coq = isFinite(Number(d.coq)) ? Math.max(0, Math.floor(Number(d.coq))) : 0;
  for (const k of ['c', 'v', 'f']) {
    const a = d.achats && Array.isArray(d.achats[k]) ? d.achats[k].filter((n) => Number.isInteger(n) && n >= 0 && n < 6) : [];
    P.achats[k] = Array.from(new Set([0].concat(a)));
    const e = d.equipe ? Number(d.equipe[k]) : 0;
    P.equipe[k] = P.achats[k].includes(e) ? e : 0;
  }
  let max = Math.max(1, Math.floor(Number(d.niveau) || 1), Math.floor(Number(d.niveauMax) || 1));
  P.etoiles.forEach((e, i) => { if (e > 0) max = Math.max(max, i + 2); });
  P.niveauMax = clamp(max, 1, NIVEAUX.length);
  if (d.options && typeof d.options.muet === 'boolean') P.muet = d.options.muet;
  P.scoreSauve = Math.max(0, Math.floor(Number(d.score) || 0));
}
function reinitialiserProgres() {
  P.etoiles = NIVEAUX.map(() => 0); P.records = NIVEAUX.map(() => 0); P.scores = NIVEAUX.map(() => 0);
  P.coq = 0; P.achats = { c: [0], v: [0], f: [0] }; P.equipe = { c: 0, v: 0, f: 0 }; P.niveauMax = 1; P.scoreSauve = 0;
}
// score total : somme des meilleurs scores (ou score d'une sauvegarde plus ancienne)
const scoreTotal = () => Math.max(P.scores.reduce((a, b) => a + b, 0), P.scoreSauve);
function donnees(niveau) {
  return {
    niveau, score: scoreTotal(), etoiles: P.etoiles.slice(), records: P.records.slice(), scores: P.scores.slice(),
    coq: P.coq, achats: { c: P.achats.c.slice(), v: P.achats.v.slice(), f: P.achats.f.slice() },
    equipe: Object.assign({}, P.equipe), niveauMax: P.niveauMax, options: { muet: P.muet },
  };
}
// Écriture hors fin de niveau (atelier) : sans toucher au niveau de reprise.
function sauverSansNiveau() {
  try {
    const d = donnees(1); delete d.niveau;
    window.JEL_SAVE.save(JEU, d);

}

const Son = {
  ctx: null,
  init() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } }
    if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) { /* rien */ } }
  },
  pret() { return this.ctx && !P.muet && !enPause; },
  note(f, d, type = 'sine', vol = 0.12, f2 = null, delai = 0) {
    if (!this.pret()) return;
    const c = this.ctx, t0 = c.currentTime + delai;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + d + 0.05);
  },
  bruit(d, vol = 0.1, freq = 800, freq2 = null, delai = 0) {
    if (!this.pret()) return;
    const c = this.ctx, t0 = c.currentTime + delai;
    const n = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, n, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t0); f.Q.value = 0.8;
    if (freq2) f.frequency.exponentialRampToValueAtTime(freq2, t0 + d);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + d * 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    s.connect(f).connect(g).connect(c.destination); s.start(t0); s.stop(t0 + d + 0.05);
  },
  clic() { this.note(660, 0.07, 'triangle', 0.08); },
  voile() { this.bruit(0.12, 0.05, 1800); },
  bip(fin) { this.note(fin ? 880 : 520, fin ? 0.45 : 0.18, 'square', 0.06); },
  coquillage() { this.note(1320, 0.08, 'sine', 0.1); this.note(1760, 0.12, 'sine', 0.09, null, 0.07); },
  boueeOk() { this.note(988, 0.3, 'triangle', 0.1); this.note(1480, 0.35, 'sine', 0.06, null, 0.05); },
  boueeKo() { this.note(220, 0.35, 'sawtooth', 0.06, 120); },
  choc() { this.bruit(0.2, 0.12, 300); this.note(110, 0.2, 'sine', 0.15, 60); },
  vague() { this.bruit(0.45, 0.07, 500, 200); },
  rafale() { this.bruit(0.9, 0.09, 400, 1600); },
  dauphin() { this.note(900, 0.12, 'sine', 0.08, 1700); this.note(1500, 0.16, 'sine', 0.07, 1000, 0.13); },
  remous() { this.note(180, 0.6, 'triangle', 0.08, 90); },
  courant() { this.bruit(0.5, 0.05, 700, 400); },
  etoile(i) { this.note(1046 + i * 200, 0.18, 'triangle', 0.1); },
  arrivee() { [523, 659, 784, 1046].forEach((f, i) => this.note(f, 0.28, 'triangle', 0.1, null, i * 0.13)); },
  defaite() { [523, 440, 392, 330].forEach((f, i) => this.note(f, 0.3, 'sine', 0.08, null, i * 0.18)); },
  achat() { [784, 988, 1175, 1568].forEach((f, i) => this.note(f, 0.15, 'triangle', 0.08, null, i * 0.07)); },
  non() { this.note(200, 0.18, 'square', 0.05, 160); },
};

// ---------- Fabrication d'une course ----------
function bordAt(tab, y) {
  const f = (Y_BAS - y) / PAS;
  const k = clamp(Math.floor(f), 0, tab.length - 2);
  return lerp(tab[k], tab[k + 1], clamp(f - k, 0, 1));
}
const bordG = (c, y) => bordAt(c.bg, y);
const bordD = (c, y) => bordAt(c.bd, y);

function genererCourse(i) {
  const N = NIVEAUX[i];
  const r = hasardGraine(1013 + i * 7919);
  const c = {
    i, long: N.long, mer: MERS[N.mer], rochers: [], bouees: [], portes: [], vagues: [], courants: [], remous: [],
    dauphins: [], rafales: [], coqs: [], passages: [], route: [], deco: [],
  };
  const n = Math.ceil((Y_BAS + N.long + MARGE_HAUT) / PAS) + 2;
  c.bg = new Float32Array(n); c.bd = new Float32Array(n);
  const a1 = r() * 10, a2 = r() * 10;
  for (let k = 0; k < n; k++) {
    c.bg[k] = 24 + 11 * Math.sin(k * 0.23 + a1) + 6 * Math.sin(k * 0.61 + a2);
    c.bd[k] = LARG - (24 + 11 * Math.sin(k * 0.19 + a2) + 6 * Math.sin(k * 0.53 + a1));
  }
  const coq = (x, y) => c.coqs.push({ x, y, pris: false, ph: r() * 6 });
  let ventCour = N.vent;
  const rafale = (y) => {
    const signe = ventCour > 0.05 ? -1 : ventCour < -0.05 ? 1 : (r() < 0.5 ? 1 : -1);
    ventCour = signe * (0.35 + r() * 0.35);
    c.rafales.push({ y, dir: ventCour, annonce: false, faite: false });
  };
  const bouee = (x, y, cote) => c.bouees.push({ x, y, cote, passee: false, ok: false });
  const vagues = (x1, x2, y1, y2) => c.vagues.push({ x1, x2, y1, y2 });

  const placer = (type, yb, yh) => {
    const ym = (yb + yh) / 2;
    switch (type) {
      case 'rien': coq(90 + r() * 180, ym); break;
      case 'coquillages': {
        const x0 = 80 + r() * 60, dx = (r() < 0.5 ? 1 : -1) * 28;
        for (let k = 0; k < 5; k++) coq(clamp(x0 + (dx > 0 ? 0 : 200) + dx * k, 60, 300), ym + 120 - k * 60);
        break;
      }
      case 'ilot': {
        const rr = 34 + r() * 10, x = 120 + r() * 120;
        c.rochers.push({ x, y: ym, r: rr, ilot: true, g: r() * 100 });
        coq(x < 180 ? x + rr + 40 : x - rr - 40, ym);
        break;
      }
      case 'rochers': {
        const pts = [];
        for (let essai = 0; essai < 40 && pts.length < 4; essai++) {
          const p = { x: 70 + r() * 220, y: yb - 70 - r() * (SEGMENT - 140), r: 12 + r() * 6 };
          if (pts.every((q) => Math.hypot(q.x - p.x, q.y - p.y) > 85)) pts.push(p);
        }
        pts.forEach((p) => c.rochers.push({ x: p.x, y: p.y, r: p.r, ilot: false, g: r() * 100 }));
        coq(180, ym - 150);
        break;
      }
      case 'bouee': {
        const x = 130 + r() * 100, cote = r() < 0.5 ? -1 : 1;
        bouee(x, ym, cote); coq(x + cote * 50, ym + 70);
        break;
      }
      case 'vagues': {
        const gauche = r() < 0.5; // trou à gauche ou à droite
        vagues(gauche ? 125 : 0, gauche ? LARG : 235, ym - 110, ym + 110);
        coq(gauche ? 75 : 285, ym);
        break;
      }
      case 'vagues+dauphin': {
        const gauche = r() < 0.5;
        vagues(gauche ? 95 : 0, gauche ? LARG : 265, ym - 120, ym + 90);
        c.dauphins.push({ x: 120 + r() * 120, y: ym + 150, pris: false, ph: r() });
        coq(gauche ? 60 : 300, ym - 40);
        break;
      }
      case 'dauphin':
        c.dauphins.push({ x: 100 + r() * 160, y: ym, pris: false, ph: r() });
        coq(180, ym - 120);
        break;
      case 'rafale': rafale(ym + 60); coq(100 + r() * 160, ym - 80); break;
      case 'passage': {
        const cx = 135 + r() * 90, w = Math.max(92, 118 - i * 1.3);
        creuserPassage(c, cx, w, yb - 20, yh + 20);
        coq(cx, ym);
        break;
      }
      case 'passage+remous': {
        const cx = 140 + r() * 80, w = Math.max(92, 118 - i * 1.3);
        creuserPassage(c, cx, w, yb - 10, ym - 10);
        const cote = cx < 180 ? 1 : -1;
        c.remous.push({ x: cx + cote * 70, y: yh + 70, r: 40 });
        coq(cx - cote * 40, yh + 60);
        break;
      }
      case 'courant': {
        const force = (r() < 0.5 ? -1 : 1) * (34 + i * 0.8);
        c.courants.push({ y1: ym - 95, y2: ym + 95, force });
        coq(180 - Math.sign(force) * 60, ym);
        break;
      }
      case 'courant+bouee': {
        const force = (r() < 0.5 ? -1 : 1) * (34 + i * 0.8);
        c.courants.push({ y1: ym - 120, y2: ym + 120, force });
        const x = 150 + r() * 60;
        bouee(x, ym - 20, -Math.sign(force)); // il faut passer contre le courant
        coq(x - Math.sign(force) * 50, ym + 80);
        break;
      }
      case 'porte': {
        const x = 115 + r() * 130, larg = Math.max(84, 108 - i);
        c.portes.push({ x, larg, y: ym, passee: false, ok: false });
        coq(x, ym + 70);
        break;
      }
      case 'remous':
        c.remous.push({ x: 110 + r() * 140, y: ym, r: 42 });
        coq(180, ym - 140);
        break;
    }
  };

  // Tronçons : le premier montre la nouveauté de la course
  const premier = { rochers: 'rochers', bouee: 'bouee', vagues: 'vagues', rafale: 'rafale', dauphin: 'dauphin', passage: 'passage', courant: 'courant', porte: 'porte', remous: 'remous', large: 'rafale' }[N.nouveau];
  let y = -420, idx = 0, avant = '';
  while (y - SEGMENT > -N.long + 380) {
    let type;
    if (idx === 0 && premier) type = premier;
    else {
      let essai = 0;
      do { type = N.pool[Math.floor(r() * N.pool.length)]; essai++; } while (type === avant && N.pool.length > 1 && essai < 10);
    }
    placer(type, y, y - SEGMENT);
    avant = type; y -= SEGMENT; idx++;
  }
  // Grand large : le vent tourne aussi tout seul de temps en temps
  if (N.mer === 3) for (let yy = -900; yy > -N.long + 600; yy -= 1500) if (!c.rafales.some((f) => Math.abs(f.y - yy) < 400)) rafale(yy);
  c.rafales.sort((a, b) => b.y - a.y);

  // Décor des rives (palmiers, sapins, phares, rochers)
  for (let yy = Y_BAS; yy > -N.long - MARGE_HAUT + 100; yy -= 130) {
    const g = r() < 0.5;
    c.deco.push({ y: yy - r() * 60, gauche: g, t: r(), s: 0.8 + r() * 0.5 });
  }
  construireRoute(c);
  c.rivaux = RIVAUX.map((R, k) => ({ ...R, f: N.riv[k] }));
  c.tempsRivaux = c.rivaux.map((R, k) => simulerRival(c, R.f, k));
  // Temps cible (3e étoile) : un peu mieux que le rival le plus rapide
  c.cible = Math.ceil(Math.min(...c.tempsRivaux) * 0.96);
  return c;
}

function creuserPassage(c, cx, w, yb, yh) {
  const rampe = 110;
  for (let k = 0; k < c.bg.length; k++) {
    const y = Y_BAS - k * PAS;
    if (y > yb || y < yh) continue;
    const f = clamp(Math.min((yb - y) / rampe, (y - yh) / rampe), 0, 1);
    const s = f * f * (3 - 2 * f);
    c.bg[k] = Math.max(c.bg[k], lerp(c.bg[k], cx - w / 2, s));
    c.bd[k] = Math.min(c.bd[k], lerp(c.bd[k], cx + w / 2, s));
  }
  c.passages.push({ cx, w, yb, yh });
}

// Route des rivaux : points de passage (bon côté des bouées, portes, passages…)
function construireRoute(c) {
  const pts = [{ y: 200, x: 180 }, { y: 0, x: 180 }];
  c.bouees.forEach((b) => pts.push({ y: b.y + 50, x: b.x + b.cote * 46 }, { y: b.y - 50, x: b.x + b.cote * 46 }));
  c.portes.forEach((p) => pts.push({ y: p.y + 40, x: p.x }, { y: p.y - 40, x: p.x }));
  c.passages.forEach((p) => pts.push({ y: p.yb - 80, x: p.cx }, { y: (p.yb + p.yh) / 2, x: p.cx }, { y: p.yh + 80, x: p.cx }));
  c.rochers.forEach((o) => {
    if (!o.ilot) return;
    const gG = o.x - o.r - bordG(c, o.y), gD = bordD(c, o.y) - o.x - o.r;
    const x = gG > gD ? (bordG(c, o.y) + o.x - o.r) / 2 : (bordD(c, o.y) + o.x + o.r) / 2;
    pts.push({ y: o.y + o.r + 20, x }, { y: o.y - o.r - 20, x });
  });
  c.remous.forEach((o) => {
    const x = o.x > 180 ? o.x - o.r - 45 : o.x + o.r + 45;
    pts.push({ y: o.y + 40, x }, { y: o.y - 40, x });
  });
  pts.push({ y: -c.long - 600, x: 180 });
  pts.sort((a, b) => b.y - a.y);
  c.route = pts;
}
function routeX(c, y) {
  const p = c.route;
  for (let k = 0; k < p.length - 1; k++) {
    if (y <= p[k].y && y >= p[k + 1].y) {
      const u = (p[k].y - y) / ((p[k].y - p[k + 1].y) || 1);
      return lerp(p[k].x, p[k + 1].x, u * u * (3 - 2 * u));
    }
  }

}
function dansVagues(c, x, y) { return c.vagues.some((v) => x > v.x1 && x < v.x2 && y > v.y1 && y < v.y2); }
function vitesseRival(c, f, x, y, t, k) {
  let v = VMAX * f * (1 + 0.05 * Math.sin(t * 0.7 + k * 2));
  if (dansVagues(c, x, y)) v *= 0.7;
  return v;
}
function simulerRival(c, f, k) {
  let y = 40, t = 0, v = 0;
  while (y > -c.long && t < 600) {
    const x = routeX(c, y);
    v = lerp(v, vitesseRival(c, f, x, y, t, k), 0.05 * 1.6);
    y -= v * 0.05; t += 0.05;
  }
  return t;
}

// ---------- État de la partie ----------
let etat = 'titre';        // titre, niveaux, atelier, carte, decompte, course, arrivee, fin
let enPause = false;
let partieEnCours = false;
let niveauReprise = 1;     // niveau écrit par la sauvegarde à la fermeture
let course = null;         // course en cours (genererCourse)
let niv = 0;               // index de la course
let J = null;              // le voilier du joueur
let rivaux = [];
let vent = { dir: 0, cible: 0, force: 1, forceT: 0 };
let chrono = 0, decompte = 0, finT = 0;
let particules = [], confettis = [], nuages = [], traits = [];
let temps = 0;             // temps d'animation
let resultat = null;
const touches = { g: false, d: false };

function nouveauJoueur() {
  return { x: 150, y: 40, cap: 0, voile: 0, v: 0, eff: 1, elan: 0, cale: 0, bord: 0, choc: 0, secousse: 0,
    fini: false, temps: 0, coq: 0, dansVague: false, dansRemous: false, dansCourant: false, sonVoile: 0, voileSon: 0 };
}

function lancerNiveau(i) {
  niv = clamp(i, 0, NIVEAUX.length - 1);
  course = genererCourse(niv);
  J = nouveauJoueur();
  const departs = [80, 220, 290];
  rivaux = course.rivaux.map((R, k) => ({ ...R, x: departs[k], x0: departs[k], y: 40, v: 0, temps: null, k, lane: (k - 1) * 28, cap: 0 }));
  vent = { dir: NIVEAUX[niv].vent, cible: NIVEAUX[niv].vent, force: 1, forceT: 0 };
  J.voile = J.cap = vent.dir;
  chrono = 0; finT = 0; resultat = null; particules = []; confettis = []; traits = [];
  creerNuages();
  partieEnCours = true; niveauReprise = niv + 1; enPause = false;
  touches.g = touches.d = false;
  afficherEcran(null);
  $('hud').hidden = false;
  majHud();
  const N = NIVEAUX[niv];
  // Carte de la nouveauté : tant que la course n'a pas été gagnée
  if (N.nouveau && !(P.etoiles[niv] > 0)) ouvrirCartes(CARTES[N.nouveau]);
  else demarrerDecompte();
}

function demarrerDecompte() {
  etat = 'decompte'; decompte = 3.2;
  afficherEcran(null);
}

// ---------- Mise à jour ----------
function maj(dt) {
  if (enPause) return; // la pause fige tout : temps, mouvements, nuages, sons
  temps += dt;
  majNuages(dt);
  if (etat === 'titre' || etat === 'niveaux' || etat === 'atelier') { majParticules(dt); return; }
  if (!course || enPause || etat === 'carte') return;

  if (etat === 'decompte') {
    const avant = Math.ceil(decompte);
    decompte -= dt;
    const apres = Math.ceil(decompte);
    if (apres !== avant && apres >= 1 && apres <= 3) { montrerDecompte(nb(apres)); Son.bip(false); }
    if (decompte <= 0) { etat = 'course'; montrerDecompte(tr('partez')); Son.bip(true); setTimeout(() => { if (etat !== 'decompte') $('decompte').textContent = ''; }, 800); }
    majVoileEntree(dt);
    J.cap = J.voile;
    J.eff = efficacite(J.cap);
    majParticules(dt);
    return;
  }

  if (etat === 'course' || etat === 'arrivee' || etat === 'fin') chrono += dt;
  majVent(dt);
  majJoueur(dt);
  majRivaux(dt);
  majParticules(dt);
  if (etat === 'arrivee') {
    finT += dt;
    if (finT > 1.6) afficherFin();
  }
  majHud();
}

function majVent(dt) {
  vent.dir += (vent.cible - vent.dir) * Math.min(1, dt * 7);
  if (vent.forceT > 0) { vent.forceT -= dt; vent.force = 1.2; } else vent.force = lerp(vent.force, 1, dt * 2);
  if (!J.fini) for (const f of course.rafales) {
    if (!f.annonce && J.y < f.y + 330) { f.annonce = true; bandeau(tr('msg.rafale'), ''); Son.rafale(); nuages.push(nuageGris()); }
    if (!f.faite && J.y < f.y) { f.faite = true; vent.cible = f.dir; vent.forceT = 2.5; bandeau(tr('msg.tourne'), ''); Son.voile(); }
  }
}

function efficacite(cap) {
  const diff = Math.abs(cap - vent.dir);
  return clamp(1 - Math.max(0, diff - 0.15) / 0.95, 0, 1);
}

function majVoileEntree(dt) {
  if (touches.g) J.voile -= 2.0 * dt;
  if (touches.d) J.voile += 2.0 * dt;
  J.voile = clamp(J.voile, -VOILE_MAX, VOILE_MAX);
  // petit bruit de voile quand elle tourne
  J.sonVoile -= dt;
  if (Math.abs(J.voile - J.voileSon) > 0.25 && J.sonVoile <= 0) { Son.voile(); J.voileSon = J.voile; J.sonVoile = 0.2; }
}

function majJoueur(dt) {
  const c = course;
  if (!J.fini) majVoileEntree(dt);
  // le bateau suit sa voile
  J.cap += (J.voile - J.cap) * Math.min(1, dt * 4);
  J.eff = efficacite(J.cap);
  let cible = VMAX * (0.3 + 0.7 * J.eff) * vent.force;

  // vagues
  const vague = dansVagues(c, J.x, J.y);
  if (vague && !J.dansVague) { Son.vague(); if (J.elan <= 0) bandeau(tr('msg.vagues'), 'mal'); }
  J.dansVague = vague;
  if (vague && J.elan <= 0) { cible *= 0.5; if (Math.random() < dt * 12) eclabousser(J.x, J.y, 2, '#ffffff'); }

  // remous : le bateau tourne et ralentit
  let remous = null;
  for (const o of c.remous) if (Math.hypot(J.x - o.x, J.y - o.y) < o.r) remous = o;
  if (remous && !J.dansRemous) { Son.remous(); bandeau(tr('msg.remous'), 'mal'); }
  J.dansRemous = !!remous;
  if (remous) {
    cible *= 0.55;
    J.voile = clamp(J.voile + 1.5 * dt, -VOILE_MAX, VOILE_MAX); J.cap += 2.2 * dt;
    J.x += (remous.x - J.x) * dt * 0.6; J.y += (remous.y - J.y) * dt * 0.3;
  }

  // courant
  let pousse = 0;
  for (const k of c.courants) if (J.y > k.y1 && J.y < k.y2) pousse = k.force;
  if (pousse && !J.dansCourant) { Son.courant(); bandeau(tr('msg.courant'), ''); }
  J.dansCourant = !!pousse;

  if (J.bord > 0) { J.bord -= dt; cible *= 0.75; }
  if (J.elan > 0) { J.elan -= dt; cible *= 1.45; if (Math.random() < dt * 20) eclabousser(J.x, J.y + 14, 1, '#bff6ff'); }
  if (J.cale > 0) { J.cale -= dt; cible *= 0.15; }
  if (J.fini) cible *= 0.3;

  const acc = cible > J.v ? 1.2 : 2.6;
  J.v += (cible - J.v) * Math.min(1, dt * acc);
  const ancienY = J.y;
  J.x += Math.sin(J.cap) * J.v * dt + pousse * dt;
  J.y -= Math.cos(J.cap) * J.v * dt;

  // rives
  const g = bordG(c, J.y) + 14, d = bordD(c, J.y) - 14;
  if (J.x < g || J.x > d) {
    if (J.bord <= 0 && J.v > 30) { bandeau(tr('msg.bord'), 'mal'); eclabousser(J.x, J.y, 6, '#f3dfa2'); }
    J.x = clamp(J.x, g, d); J.bord = 0.3;
  }

  // rochers et îlots
  if (J.choc > 0) J.choc -= dt;
  for (const o of c.rochers) {
    const dx = J.x - o.x, dy = J.y - o.y, dist = Math.hypot(dx, dy), min = o.r + 14;
    if (dist < min) {
      const nx = dx / (dist || 1), ny = dy / (dist || 1);
      J.x = o.x + nx * min; J.y = o.y + ny * min;
      if (J.choc <= 0) {
        J.v *= 0.25; J.choc = 0.6; J.secousse = 0.35;
        Son.choc(); bandeau(tr('msg.choc'), 'mal'); eclabousser(J.x, J.y, 10, '#ffffff');
      }
    }
  }

  if (!J.fini) {
    // bouées : passer du bon côté
    for (const b of c.bouees) {
      if (!b.passee && ancienY >= b.y && J.y < b.y) {
        b.passee = true;
        b.ok = Math.sign(J.x - b.x) === b.cote;
        if (b.ok) { Son.boueeOk(); bandeau(tr('msg.boueeOk'), 'bien'); J.elan = Math.max(J.elan, 0.6); etincelles(b.x, b.y, '#7dff9a'); }
        else { Son.boueeKo(); bandeau(tr('msg.boueeKo'), 'mal'); J.cale = 2; J.secousse = 0.25; }
      }
    }
    // portes : passer entre les deux bouées jaunes
    for (const p of c.portes) {
      if (!p.passee && ancienY >= p.y && J.y < p.y) {
        p.passee = true;
        p.ok = Math.abs(J.x - p.x) < p.larg / 2;
        if (p.ok) { Son.boueeOk(); bandeau(tr('msg.porteOk'), 'bien'); J.elan = Math.max(J.elan, 0.6); etincelles(p.x, p.y, '#ffe066'); }
        else { Son.boueeKo(); bandeau(tr('msg.porteKo'), 'mal'); J.cale = 2; J.secousse = 0.25; }
      }
    }
    // dauphins : un élan
    for (const dph of c.dauphins) {
      if (!dph.pris && Math.hypot(J.x - dph.x, J.y - dph.y) < 36) {
        dph.pris = true; dph.t = 0; J.elan = 2.5;
        Son.dauphin(); bandeau(tr('msg.dauphin'), 'bien'); etincelles(dph.x, dph.y, '#bff6ff');
      }
    }
    // coquillages
    for (const q of c.coqs) {
      if (!q.pris && Math.hypot(J.x - q.x, J.y - q.y) < 26) {
        q.pris = true; J.coq++; Son.coquillage(); etincelles(q.x, q.y, '#ffc7d9');
        const el = $('hud-coq'); el.classList.remove('secoue'); void el.offsetWidth; el.classList.add('secoue');
      }
    }
    // arrivée
    if (J.y <= -c.long) {
      J.fini = true; J.temps = chrono; etat = 'arrivee'; finT = 0;
      Son.arrivee(); lancerConfettis(70);
    }
  }
  if (J.secousse > 0) J.secousse -= dt;

  // sillage
  if (J.v > 20 && Math.random() < dt * 30) {
    const sx = J.x - Math.sin(J.cap) * 16, sy = J.y + Math.cos(J.cap) * 16;
    particules.push({ x: sx + (Math.random() - 0.5) * 6, y: sy, vx: 0, vy: 0, vie: 1.1, max: 1.1, coul: '#ffffff', r: 2 + Math.random() * 2, type: 'sillage' });
  }
  // la voile bien placée scintille
  if (J.eff > 0.85 && J.v > 60 && Math.random() < dt * 6) etincelles(J.x + (Math.random() - 0.5) * 20, J.y - 26, '#b4ffbf', 1);
}

function majRivaux(dt) {
  const c = course;
  for (const R of rivaux) {
    if (etat === 'decompte') continue;
    const v = vitesseRival(c, R.f, R.x, R.y, chrono, R.k);
    R.v = lerp(R.v, v, Math.min(1, dt * 1.6));
    const ancienX = R.x;
    R.y -= R.v * dt;
    const parcours = clamp((40 - R.y) / 300, 0, 1);
    let cx = lerp(R.x0, routeX(c, R.y) + R.lane, parcours);
    cx = clamp(cx, bordG(c, R.y) + 14, bordD(c, R.y) - 14);
    R.x = cx;
    const visee = Math.atan2(R.x - ancienX, Math.max(0.01, R.v * dt));
    R.cap = lerp(R.cap, clamp(visee, -0.8, 0.8), Math.min(1, dt * 4));
    if (R.temps === null && R.y <= -c.long) R.temps = chrono;
    if (R.v > 20 && Math.random() < dt * 18) {
      particules.push({ x: R.x - Math.sin(R.cap) * 14, y: R.y + 14, vx: 0, vy: 0, vie: 0.9, max: 0.9, coul: '#ffffff', r: 2 + Math.random() * 1.5, type: 'sillage' });
    }
  }
}

function placeActuelle() {
  if (J.fini) return 1 + rivaux.filter((R) => R.temps !== null && R.temps < J.temps).length;
  return 1 + rivaux.filter((R) => R.y < J.y).length;
}

// ---------- Effets ----------
function eclabousser(x, y, n, coul) {
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, s = 20 + Math.random() * 50;
    particules.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vie: 0.6, max: 0.6, coul, r: 1.5 + Math.random() * 2, type: 'goutte' });
  }
}
function etincelles(x, y, coul, n = 12) {
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, s = 30 + Math.random() * 70;
    particules.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vie: 0.8, max: 0.8, coul, r: 2 + Math.random() * 2, type: 'etoile' });
  }
}
function majParticules(dt) {
  for (const p of particules) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.vie -= dt; }
  particules = particules.filter((p) => p.vie > 0);
  if (particules.length > 400) particules.splice(0, particules.length - 400);
  for (const q of confettis) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 160 * dt; q.rot += q.vr * dt; q.vie -= dt; }
  confettis = confettis.filter((q) => q.vie > 0 && q.y < H + 20);
}
function lancerConfettis(n) {
  const couls = ['#ff8a3d', '#ffd23f', '#3fb56b', '#3b7be0', '#f59ac0', '#ffffff'];
  for (let k = 0; k < n; k++) {
    confettis.push({ x: W * Math.random(), y: -10 - Math.random() * 60, vx: (Math.random() - 0.5) * 120, vy: 40 + Math.random() * 120,
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10, coul: couls[k % couls.length], vie: 4 });
  }
}

// Nuages qui filent dans le sens du vent (coordonnées écran)
function creerNuages() {
  nuages = [];
  for (let k = 0; k < 5; k++) nuages.push({ x: Math.random() * W, y: Math.random() * H, r: 14 + Math.random() * 10, gris: false });
}
function nuageGris() { return { x: W * (0.2 + Math.random() * 0.6), y: -60, r: 28, gris: true }; }
function majNuages(dt) {
  const d = (etat === 'titre' || etat === 'niveaux' || etat === 'atelier') ? 0.5 : vent.dir;
  const v = (25 + 25 * vent.force) * (enPause ? 0 : 1);
  const defil = (J && (etat === 'course' || etat === 'arrivee') && !enPause) ? Math.cos(J.cap) * J.v * ECH * 0.35 : 12;
  for (const n of nuages) {
    n.x += Math.sin(d) * v * dt;
    n.y += (-Math.cos(d) * v * 0.4 + defil) * dt;
    if (n.y > H + 80) { if (n.gris) n.mort = true; n.y = -70; n.x = Math.random() * W; }
    if (n.y < -90) n.y = H + 70;
    if (n.x > W + 80) n.x = -70; if (n.x < -80) n.x = W + 70;
  }
  nuages = nuages.filter((n) => !n.mort);
  // traits de vent sur l'eau
  if (Math.random() < dt * 8) traits.push({ x: Math.random() * W, y: Math.random() * H, vie: 1 });
  for (const t of traits) { t.x += Math.sin(d) * 140 * dt; t.y += (-Math.cos(d) * 140 + defil) * dt; t.vie -= dt; }
  traits = traits.filter((t) => t.vie > 0);
}

// ---------- Dessin : éléments du monde ----------
function couleurCoque(id) {
  const c = BOUTIQUE.c[id] || BOUTIQUE.c[0];
  return c.coul;
}
function remplirArc(g, x1, y1, x2, y2) {
  const gr = g.createLinearGradient(x1, y1, x2, y2);
  ['#ff5a5a', '#ffa53d', '#ffe24d', '#57d36b', '#4aa3ff', '#9a6bff'].forEach((c, k) => gr.addColorStop(k / 5, c));
  return gr;
}
function formeCoque(g) {
  g.beginPath();
  g.moveTo(0, -20);
  g.bezierCurveTo(10, -13, 11, 8, 8, 16);
  g.lineTo(-8, 16);
  g.bezierCurveTo(-11, 8, -10, -13, 0, -20);
  g.closePath();
}
// Voile en fausse 3D : du pied du mât au haut du mât, puis jusqu'au bout de la bôme
function dessinerVoile(g, mx, my, hx, hy, bx, by, eff, motif, t) {
  const flot = eff < 0.35 ? Math.sin(t * 28) * 3 * (1 - eff / 0.35) : 0;
  const gonfle = 3 + eff * 9 + flot;
  const midX = (hx + bx) / 2, midY = (hy + by) / 2;
  let nx = -(by - hy), ny = bx - hx; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
  if ((midX - mx) * nx + (midY - my) * ny < 0) { nx = -nx; ny = -ny; }
  g.save();
  g.beginPath(); g.moveTo(mx, my); g.lineTo(hx, hy);
  g.quadraticCurveTo(midX + nx * gonfle * 2, midY + ny * gonfle * 2, bx, by); g.closePath();
  const minX = Math.min(mx, hx, bx) - 25, maxX = Math.max(mx, hx, bx) + 25, minY = Math.min(my, hy, by) - 25, maxY = Math.max(my, hy, by) + 25;
  if (motif && motif[0] === '#') g.fillStyle = motif;
  else if (motif === 'soleil') { const gr = g.createLinearGradient(0, minY, 0, maxY); gr.addColorStop(0, '#ffcf5a'); gr.addColorStop(0.5, '#ff8a5a'); gr.addColorStop(1, '#e85a9a'); g.fillStyle = gr; }
  else if (motif === 'arcenciel') g.fillStyle = remplirArc(g, minX, 0, maxX, 0);
  else if (motif === 'etoilee') g.fillStyle = '#23336e';
  else if (motif === 'pois') g.fillStyle = '#ffd84d';
  else g.fillStyle = '#fffaf0';
  g.fill();
  g.clip();

}

// ---------- Dessin : la course ----------
function dessinerCourse() {

function dessinerCiel() {

// ---------- Boucle ----------
let derniere = performance.now();
function boucle(maintenant) {
  const dt = Math.min(0.05, Math.max(0, (maintenant - derniere) / 1000));
  derniere = maintenant;
  maj(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (course && J && (etat === 'carte' || etat === 'decompte' || etat === 'course' || etat === 'arrivee' || etat === 'fin')) dessinerCourse();
  else dessinerTitre();
  if (etat === 'carte') dessinerApercu();
  requestAnimationFrame(boucle);
}

  carteT = 0;
  $('carte-titre').textContent = tr('carte.' + id + '.titre');
  $('carte-texte').textContent = tr('carte.' + id + '.texte');
  const pts = $('carte-points'); pts.textContent = '';
  if (cartes.length > 1) cartes.forEach((_, k) => { const s = document.createElement('span'); if (k === carteIdx) s.className = 'on'; pts.appendChild(s); });
  $('b-carte').textContent = carteIdx < cartes.length - 1 ? tr('carte.suivant') : tr('carte.go');
  $('b-carte').focus({ preventScroll: true });
}
function carteSuivante() {
  if (etat !== 'carte') return;
  Son.clic();
  carteIdx++;
  if (carteIdx >= cartes.length) demarrerDecompte();
  else montrerCarte();
}
const apercu = $('apercu');
const actx = apercu.getContext('2d');
function dessinerApercu() {
  carteT += 1 / 60;
  const id = cartes[carteIdx], t = carteT, g = actx;
  g.setTransform(2, 0, 0, 2, 0, 0); // 240 × 150 unités
  const mer = course ? course.mer : MERS[0];
  g.fillStyle = mer.eau; g.fillRect(0, 0, 240, 150);
  dessinerMer(g, mer, 0, 150, t);
  const boucleT = t % 3;
  const bat = (x, y, cap, eff, dv) => dessinerBateau(g, { x, y, cap, eff, type: 'joueur', look: P.equipe }, t, dv, 1.2);
  const main = (x, y) => {
    g.save(); g.translate(x, y);
    g.fillStyle = '#ffd9b8'; g.strokeStyle = '#8a5a3c'; g.lineWidth = 1.5;
    g.beginPath(); g.ellipse(0, 12, 9, 11, 0, 0, 7); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(0, -2, 3.5, 9, 0, 0, 7); g.fill(); g.stroke();
    g.restore();
  };
  const fleche = (x, y, dir) => {
    g.save(); g.translate(x, y); g.rotate(dir); g.fillStyle = '#2a7bd6';
    g.beginPath(); g.moveTo(0, -16); g.lineTo(9, -4); g.lineTo(4, -4); g.lineTo(4, 13); g.lineTo(-4, 13); g.lineTo(-4, -4); g.lineTo(-9, -4); g.closePath(); g.fill(); g.restore();
  };
  if (id === 'glisser') {
    const a = Math.sin(t * 2) * 0.8;
    bat(120, 70, a, 0.8, 0);
    main(120 + Math.sin(t * 2) * 55, 118);
    g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 2; g.setLineDash([4, 4]);
    g.beginPath(); g.moveTo(60, 112); g.lineTo(180, 112); g.stroke(); g.setLineDash([]);
  } else if (id === 'vent') {
    const dv = 0.5, a = boucleT < 1.2 ? lerp(-0.6, dv, boucleT / 1.2) : dv;
    fleche(36, 36, dv);
    bat(120, 85, a, boucleT < 1.2 ? 0.2 : 1, dv);
    if (boucleT >= 1.2) { g.strokeStyle = 'rgba(140,255,160,0.9)'; g.lineWidth = 3; g.beginPath(); g.arc(120, 85, 34 + Math.sin(t * 12) * 2, 0, 7); g.stroke(); for (let k = 0; k < 3; k++) { g.strokeStyle = 'rgba(255,255,255,0.8)'; g.beginPath(); g.moveTo(110 - k * 8, 110 + k * 8); g.lineTo(98 - k * 8, 126 + k * 8); g.stroke(); } }
  } else if (id === 'arrivee') {
    dessinerLigne(g, 26, 10, 230, true);
    const y = 140 - boucleT * 40;
    dessinerBateau(g, { x: 60, y: y + 22, cap: 0, eff: 0.8, type: 'canard', voile: RIVAUX[0].voile }, t, 0, 1);
    dessinerBateau(g, { x: 170, y: y + 30, cap: 0, eff: 0.8, type: 'noisette', voile: RIVAUX[2].voile }, t, 0, 1);
    bat(115, y, 0, 1, 0);
    g.fillStyle = '#ffd23f'; for (let k = 0; k < 3; k++) etoileForme(g, 196 + k * 14, 132, 6);
  } else if (id === 'rochers') {
    dessinerRocher(g, { x: 120, y: 45, r: 20, ilot: false, g: 3 }, mer, t);
    const y = boucleT < 1.4 ? lerp(140, 75, boucleT / 1.4) : 75 + Math.min(1, boucleT - 1.4) * 22;
    bat(120, y, 0, 1, 0);
    if (boucleT > 1.4 && boucleT < 1.9) { g.fillStyle = '#ffe066'; for (let k = 0; k < 4; k++) etoileForme(g, 120 + Math.cos(k * 1.6 + t * 4) * 22, 64 + Math.sin(k * 1.6 + t * 4) * 10, 4); }
  } else if (id === 'bouee') {
    dessinerBouee(g, { x: 140, y: 70, cote: -1, passee: boucleT > 1.6, ok: true }, t);
    const y = lerp(150, -10, boucleT / 3), x = 140 - 45 * Math.sin(clamp(boucleT / 3, 0, 1) * Math.PI);
    bat(x, y, -0.2, 1, 0);
  } else if (id === 'vagues') {
    dessinerVagues(g, { x1: 70, x2: 240, y1: 30, y2: 110 }, t, mer);
    const y = lerp(150, -10, boucleT / 3), x = 40;
    bat(x, y, 0, 1, 0);
    dessinerBateau(g, { x: 150, y: lerp(150, 40, boucleT / 3), cap: 0, eff: 0.3, type: 'noisette', voile: RIVAUX[2].voile }, t, 0, 1);
  } else if (id === 'rafale') {
    const dv = boucleT < 1.5 ? -0.5 : 0.5;
    fleche(36, 40, dv);
    g.fillStyle = 'rgba(150,160,180,0.85)'; nuageForme(g, 170 - boucleT * 20, 34, 16);
    const a = boucleT < 1.5 ? -0.5 : lerp(-0.5, 0.5, clamp((boucleT - 1.7) / 0.6, 0, 1));
    bat(120, 95, a, Math.abs(a - dv) < 0.3 ? 1 : 0.2, dv);
    if (boucleT < 1.5) main(120 + Math.sin(t * 3) * 20, 130);
  } else if (id === 'dauphin') {
    dessinerDauphin(g, { x: 120, y: 60, ph: 0, pris: false }, t);
    const y = lerp(150, 10, boucleT / 3);
    bat(120, y, 0, 1, 0);
    if (y < 70) { g.strokeStyle = 'rgba(190,250,255,0.9)'; g.lineWidth = 2; g.beginPath(); g.arc(120, y, 30, 0, 7); g.stroke(); }
  } else if (id === 'passage') {
    for (let y = 0; y < 150; y += 18) for (const x of [70 - Math.max(0, 40 - Math.abs(y - 75)), 170 + Math.max(0, 40 - Math.abs(y - 75))]) { g.fillStyle = '#7f858f'; g.beginPath(); g.arc(x - (x < 120 ? 30 : -30), y, 14, 0, 7); g.fill(); }
    g.fillStyle = '#7f858f'; g.fillRect(0, 0, 30, 150); g.fillRect(210, 0, 30, 150);
    bat(120, lerp(150, -10, boucleT / 3), 0, 1, 0);
  } else if (id === 'courant') {
    dessinerCourant(g, { y1: 40, y2: 110, force: 40 }, t, 0, 240);
    const u = boucleT / 3, y = lerp(150, -10, u), x = 80 + clamp((u - 0.25) / 0.5, 0, 1) * 70;
    bat(x, y, 0, 1, 0);
  } else if (id === 'porte') {
    dessinerPorte(g, { x: 120, y: 60, larg: 90, passee: boucleT > 1.7, ok: true }, t);
    bat(120 + Math.sin(boucleT) * 10, lerp(150, -10, boucleT / 3), 0, 1, 0);
  } else if (id === 'remous') {
    dessinerRemous(g, { x: 120, y: 70, r: 38 }, t);
    const a = boucleT * 3;
    bat(120 + Math.cos(a) * 18, 70 + Math.sin(a) * 18, a, 0.3, 0);
  } else if (id === 'large') {
    const dv = Math.sin(Math.floor(t / 0.8) * 2.3) * 0.6;
    fleche(36, 40, dv);
    fleche(204, 40, -dv);
    bat(120, 95, dv, 1, dv);
  }
}

// ---------- Fin de course ----------
function afficherFin() {
  if (etat === 'fin') return;
  etat = 'fin';
  const c = course;
  const place = placeActuelle();
  const gagne = place <= 3;
  let etoiles = 0;
  if (gagne) etoiles = (place === 1 ? 2 : 1) + (J.temps <= c.cible ? 1 : 0);
  etoiles = clamp(etoiles, 0, 3);
  const bonus = etoiles * 2;
  const gainCoq = J.coq + bonus;
  const points = gagne ? Math.round((place === 1 ? 500 : place === 2 ? 300 : 200) + Math.max(0, c.cible - J.temps) * 20 + J.coq * 10) : 0;
  const ancienRecord = P.records[niv];
  const record = gagne && (ancienRecord === 0 || J.temps < ancienRecord);
  P.coq += gainCoq;
  if (gagne) {
    P.etoiles[niv] = Math.max(P.etoiles[niv], etoiles);
    P.scores[niv] = Math.max(P.scores[niv], points);
    if (record) P.records[niv] = Math.round(J.temps * 10) / 10;
    P.niveauMax = Math.max(P.niveauMax, Math.min(niv + 2, NIVEAUX.length));
    niveauReprise = Math.min(niv + 2, NIVEAUX.length);
    // sauvegarde à chaque course gagnée (N = niv + 1 → reprise à N + 1)
    try { window.JEL_SAVE.save(JEU, donnees(niveauReprise)); } catch (e) { /* sans stockage */ }
  } else {
    niveauReprise = niv + 1;
    try { window.JEL_SAVE.save(JEU, donnees(niveauReprise)); } catch (e) { /* sans stockage */ }
  }
  try { if (window.FMG && window.FMG.reportEnd) window.FMG.reportEnd({ completed: gagne, level: niv + 1 }); } catch (e) { /* rien */ }

  // résultats
  const lignes = [{ nom: tr('moi'), temps: J.temps, moi: true }].concat(rivaux.map((R) => ({
    nom: tr('rival.' + R.id),
    temps: R.temps !== null ? R.temps : chrono + Math.max(0, R.y + c.long) / Math.max(10, VMAX * R.f * 0.95),
  })));
  lignes.sort((a, b) => a.temps - b.temps);
  const estDerniere = niv === NIVEAUX.length - 1;
  $('fin-titre').textContent = gagne ? (estDerniere ? tr('fin.toutes') : place === 1 ? tr('fin.premier') : tr('fin.podium', { place: tr('place.' + place) })) : tr('fin.defaite');
  $('fin-temps').textContent = tr('fin.temps', { s: nb(Math.round(J.temps * 10) / 10) });
  $('fin-cible').textContent = tr('fin.cible', { s: nb(c.cible) });
  $('fin-points').textContent = gagne ? tr('fin.points', { n: nb(points) }) : '';
  const rec = $('fin-record');
  rec.className = record ? 'record' : '';
  rec.textContent = record ? tr('fin.record') : (ancienRecord > 0 ? tr('fin.ancienRecord', { s: nb(ancienRecord) }) : '');
  $('fin-conseil').textContent = gagne ? (etoiles < 3 ? tr('fin.conseilEtoile', { s: nb(c.cible) }) : '') : tr('fin.conseil');
  const ol = $('classement'); ol.textContent = '';
  lignes.forEach((l, k) => {
    const li = document.createElement('li'); if (l.moi) li.className = 'moi';
    const a = document.createElement('span'); a.textContent = tr('place.' + (k + 1)) + ' · ' + l.nom;
    const b = document.createElement('span'); b.textContent = tr('hud.temps', { s: nb(Math.round(l.temps * 10) / 10) });
    li.append(a, b); ol.appendChild(li);
  });
  // étoiles qui s'allument une à une
  const spans = $('fin-etoiles').querySelectorAll('span');
  spans.forEach((s) => s.classList.remove('gagnee'));
  $('fin-etoiles').setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
  for (let k = 0; k < etoiles; k++) setTimeout(() => { spans[k].classList.add('gagnee'); Son.etoile(k); }, 400 + k * 350);
  // compteur de coquillages qui défile
  const el = $('fin-coq'); let n = 0;
  el.textContent = tr('fin.coq', { n: nb(0) });
  const pas = () => { n = Math.min(gainCoq, n + 1); el.textContent = tr('fin.coq', { n: nb(n) }); if (n < gainCoq) setTimeout(pas, 50); };
  setTimeout(pas, 500);
  $('b-suivant').hidden = !gagne || estDerniere;
  $('b-reessayer').hidden = gagne;
  $('b-rejouer').hidden = !gagne;
  if (gagne) lancerConfettis(estDerniere ? 160 : 90); else Son.defaite();
  $('hud').hidden = true;
  afficherEcran('ecran-fin');
  const bp = gagne ? (estDerniere ? $('b-rejouer') : $('b-suivant')) : $('b-reessayer');
  setTimeout(() => bp.focus({ preventScroll: true }), 50);
}

// ---------- Pause ----------
function mettrePause() {
  if (enPause || !(etat === 'course' || etat === 'decompte' || etat === 'arrivee')) return;
  enPause = true;
  touches.g = touches.d = false;
  afficherEcran('ecran-pause');
  $('b-reprendre').focus({ preventScroll: true });
}
function reprendre() {
  if (!enPause) return;
  enPause = false; afficherEcran(null); derniere = performance.now();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') mettrePause(); });

// ---------- Commandes ----------
let glisse = null;
toile.addEventListener('pointerdown', (e) => {
  if (!(etat === 'course' || etat === 'decompte') || enPause) return;
  glisse = { id: e.pointerId, x: e.clientX, voile: J.voile, t: performance.now(), bouge: false };
  try { toile.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
});
toile.addEventListener('pointermove', (e) => {
  if (!glisse || e.pointerId !== glisse.id || enPause || J.fini) return;
  const dx = e.clientX - glisse.x;
  if (Math.abs(dx) > 6) glisse.bouge = true;
  J.voile = clamp(glisse.voile + dx / (W * 0.38) * VOILE_MAX, -VOILE_MAX, VOILE_MAX);
});
const finGlisse = (e) => {
  if (!glisse || e.pointerId !== glisse.id) return;
  // simple toucher : petit coup de voile du côté touché
  if (!glisse.bouge && performance.now() - glisse.t < 350 && J && !J.fini && !enPause) {
    const r = toile.getBoundingClientRect();
    J.voile = clamp(J.voile + (e.clientX - r.left < r.width / 2 ? -0.3 : 0.3), -VOILE_MAX, VOILE_MAX);
  }
  glisse = null;
};
toile.addEventListener('pointerup', finGlisse);
toile.addEventListener('pointercancel', finGlisse);

window.addEventListener('keydown', (e) => {
  const code = e.code;
  if (etat === 'carte' && (code === 'Space' || code === 'Enter' || code === 'NumpadEnter')) { e.preventDefault(); carteSuivante(); return; }
  if (code === 'Escape' || code === 'KeyP') {
    if (enPause) reprendre(); else mettrePause();
    e.preventDefault(); return;
  }
  if (etat === 'course' || etat === 'decompte') {
    if (code === 'ArrowLeft' || code === 'KeyA' || code === 'KeyQ') { touches.g = true; e.preventDefault(); }
    if (code === 'ArrowRight' || code === 'KeyD') { touches.d = true; e.preventDefault(); }
  }
  if (etat === 'titre' && (code === 'Enter' || code === 'Space') && (document.activeElement === document.body || !document.activeElement)) { e.preventDefault(); $('b-jouer').click(); }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA' || e.code === 'KeyQ') touches.g = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') touches.d = false;
});
window.addEventListener('blur', () => { touches.g = touches.d = false; });

// Boutons
$('b-jouer').addEventListener('click', () => {
  Son.init(); Son.clic();
  window.JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => {
      const n = clamp(Math.floor(Number(d.niveau) || 1), 1, NIVEAUX.length);
      P.niveauMax = Math.max(P.niveauMax, n);
      lancerNiveau(n - 1);
    },
    onNouvelle: () => lancerNiveau(0),
    onEffacer: () => { reinitialiserProgres(); majTitre(); },
  });
});
$('b-courses').addEventListener('click', () => { Son.clic(); ouvrirNiveaux(); });
$('b-atelier').addEventListener('click', () => { Son.clic(); ouvrirAtelier(); });
$('b-niveaux-retour').addEventListener('click', () => { Son.clic(); allerTitre(); });
$('b-atelier-retour').addEventListener('click', () => { Son.clic(); allerTitre(); });
document.querySelectorAll('[data-onglet]').forEach((b) => b.addEventListener('click', () => { onglet = b.dataset.onglet; Son.clic(); $('atelier-message').textContent = ''; remplirAtelier(); }));
$('b-son').addEventListener('click', basculerSon);
$('b-son-titre').addEventListener('click', basculerSon);
$('b-pause').addEventListener('click', () => { Son.clic(); mettrePause(); });
$('b-reprendre').addEventListener('click', () => { reprendre(); Son.clic(); });
$('b-recommencer').addEventListener('click', () => { enPause = false; Son.clic(); lancerNiveau(niv); });
$('b-pause-courses').addEventListener('click', () => { enPause = false; Son.clic(); ouvrirNiveaux(); });
$('b-pause-accueil').addEventListener('click', () => { enPause = false; Son.clic(); allerTitre(); });
$('b-carte').addEventListener('click', (e) => { e.stopPropagation(); carteSuivante(); });
$('ecran-carte').addEventListener('click', () => carteSuivante());
$('b-suivant').addEventListener('click', () => { Son.clic(); lancerNiveau(niv + 1); });
$('b-reessayer').addEventListener('click', () => { Son.clic(); lancerNiveau(niv); });
$('b-rejouer').addEventListener('click', () => { Son.clic(); lancerNiveau(niv); });
$('b-fin-courses').addEventListener('click', () => { Son.clic(); ouvrirNiveaux(); });
$('b-fin-accueil').addEventListener('click', () => { Son.clic(); allerTitre(); });

// Sauvegarde à la fermeture de la page, seulement pendant une partie
window.JEL_SAVE.surFermeture(() => {
  if (partieEnCours) window.JEL_SAVE.save(JEU, donnees(niveauReprise));
});

// Aperçu de l'atelier animé
(function animerAtelier() { dessinerApercuBateau(); requestAnimationFrame(animerAtelier); })();

// Départ
majTitre();
creerNuages();
requestAnimationFrame(boucle);
</script>
