    etat = 'tuto'; montrer('ecran-tuto');
    $('tuto-titre').textContent = tr('tuto.' + tuto.cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + tuto.cle + '.texte');
    try { $('b-tuto').focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }
  function fermerTuto() {
    if (!tuto) return;
    const t = tuto; tuto = null; SON.clic();
    if (t.reste.length) montrerTuto(t.reste, t.suite); else t.suite();
  }
  $('b-tuto').addEventListener('click', (e) => { e.stopPropagation(); audio(); fermerTuto(); });
  $('ecran-tuto').addEventListener('click', (e) => { if (e.target.id === 'ecran-tuto' || e.target.id === 'tuto-canvas') { audio(); fermerTuto(); } });

  function dessinerTuto(dt) {
    if (!tuto) return;
    tuto.temps += dt;
    const c = $('tuto-canvas').getContext('2d'), w = 680, h = 340, k = tuto.cle;
    const per = k === 'echo' ? 5 : k === 'coeur' || k === 'etoile' || k === 'spirale' ? 4.5 : 2.6;
    const u = (tuto.temps % per) / per, t = tuto.temps % per;
    const fond = c.createLinearGradient(0, 0, 0, h); fond.addColorStop(0, k === 'spirale' || k === 'contre' || k === 'voyage' ? '#1a2160' : '#5fb8ff'); fond.addColorStop(1, k === 'spirale' || k === 'contre' || k === 'voyage' ? '#4a3a90' : '#d4f1ff');
    c.fillStyle = fond; c.fillRect(0, 0, w, h);
    const ax = 170, ay = 190, v = 330; // avion, vitesse des notes (px/s)
    const pe = PEINTURES.find((p) => p.id === P.peinture);
    const fumee = couleurFumee(P.fumee, Math.floor(tuto.temps * 5));
    const note = (type, tArr, y, extra) => { const x = ax + 30 + (tArr - t) * v; if (x > ax + 18 && x < w + 40) dessinerNote(c, Object.assign({ type, h: extra && extra.h ? 1 : 0 }, extra || {}), x, y, 22, { temps: tuto.temps, xFin: x + ((extra && extra.long) || 0) * v, alpha: 1, jumeau: extra && extra.jumeau }); };
    const puff = (tArr, y, coul) => { const d = t - tArr; if (d >= 0 && d < 0.6) { c.globalAlpha = 1 - d / 0.6; c.fillStyle = coul || fumee; for (let i = 0; i < 6; i++) { c.beginPath(); c.arc(ax - 10 - d * 120 - i * 9, y + Math.sin(i * 2) * 16 * d * 3, 12 + d * 30, 0, 7); c.fill(); } c.globalAlpha = 1; } };
    const main = (tArr, mode) => { const d = t - tArr; let mx = ax + 150, my = 300, ap = Math.abs(d) < 0.15; if (mode === 'up' && d > -0.1 && d < 0.4) my -= clamp((d + 0.1) / 0.3, 0, 1) * 70; if (mode === 'down' && d > -0.1 && d < 0.4) my -= 70 - clamp((d + 0.1) / 0.3, 0, 1) * 70; if (mode === 'down' && !(d > -0.1 && d < 0.4)) my -= 70; if (mode === 'hold') ap = d > -0.05 && d < 1.1; dessinerMain(c, mx, my, 1.6, ap); };
    if (k === 'tap' || k === 'croches' || k === 'bouquet' || k === 'or') {
      const arr = k === 'croches' ? [1.2, 1.5] : [1.3];
      arr.forEach((ta) => { note('tap', ta, ay, { or: k === 'or' }); puff(ta, ay); });
      main(arr[0]); if (k === 'croches') main(arr[1]);
      if (k === 'bouquet' && t > 1.3 && t < 2.3) { const d = t - 1.3; for (let i = 0; i < 14; i++) { const a = i / 14 * 6.28; c.fillStyle = 'hsl(' + (i * 25) + ',100%,65%)'; c.globalAlpha = 1 - d; c.beginPath(); c.arc(480 + Math.cos(a) * d * 120, 90 + Math.sin(a) * d * 120 + d * d * 40, 5, 0, 7); c.fill(); } c.globalAlpha = 1; }
      dessinerAvion(c, ax, ay, 0, 2, pe, tuto.temps * 30, 1);
    } else if (k === 'swipe') {
      note('up', 1.3, ay - 50); puff(1.3, ay - 50);
      const yAv = t < 1.0 ? ay + 50 : t < 1.3 ? lerp(ay + 50, ay - 50, doux((t - 1.0) / 0.3)) : ay - 50;
      dessinerAvion(c, ax, yAv, t > 1.0 && t < 1.3 ? -0.5 : 0, 2, pe, tuto.temps * 30, 1);
      main(1.3, 'up');
    } else if (k === 'hold') {
      note('hold', 1.0, ay, { h: 1, long: 1.0 });
      const d = t - 1.0;
      let x = ax, y = ay, ang = 0;
      if (d > 0 && d < 1.0) { const phi = d * Math.PI * 2; x = ax + 55 * Math.sin(phi); y = ay - 55 * (1 - Math.cos(phi)); ang = -phi; }
      if (d > 0) { c.strokeStyle = fumee; c.globalAlpha = 0.8; c.lineWidth = 10; c.lineCap = 'round'; c.beginPath(); for (let a = 0; a <= Math.min(1, d) * 6.28; a += 0.15) c.lineTo(ax + 55 * Math.sin(a) - (d - a / 6.28) * 40, ay - 55 * (1 - Math.cos(a))); c.stroke(); c.globalAlpha = 1; }
      dessinerAvion(c, x, y, ang, 2, pe, tuto.temps * 30, 1);
      main(1.0, 'hold');
    } else if (k === 'nuage' || k === 'voyage') {
      note('tap', 1.4, ay); puff(1.4, ay);
      const z0 = k === 'voyage' ? 290 + Math.sin(tuto.temps * 1.6) * 110 : 330;
      for (let x = z0; x < z0 + (k === 'voyage' ? 220 : 400); x += 40) for (let y = 70; y < 310; y += 46) nuageDessin(c, x, y + Math.sin(x + tuto.temps) * 4, 1.1, 0.96);
      dessinerAvion(c, ax, ay, 0, 2, pe, tuto.temps * 30, 1);
      main(1.4);
    } else if (k === 'rafale') {
      const vv = t < 1.2 ? 1 : 1.6;
      c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 3;
      for (let i = 0; i < 8; i++) { const x = (w - ((tuto.temps * 500 * vv + i * 97) % (w + 100))); const y = 40 + i * 36; c.beginPath(); c.moveTo(x, y); c.lineTo(x + 60, y); c.stroke(); }
      [0.9, 1.4, 1.75, 2.1].forEach((ta) => { note('tap', ta, ay); puff(ta, ay); });
      dessinerAvion(c, ax, ay + Math.sin(tuto.temps * 9) * 3, 0, 2, pe, tuto.temps * 30, 1);
      main(1.4); main(1.75);
    } else if (k === 'echo') {
      // l'avion jumeau joue 2 notes, puis elles reviennent en gris pour toi
      const jx = ax, jy = 110;
      if (t < 2.4) {
        [1.0, 1.6].forEach((ta, i) => { const x = ax + 30 + (ta - t) * v; if (x > ax + 18 && x < w + 40) dessinerNote(c, { type: i ? 'up' : 'tap' }, x, jy, 22, { temps: tuto.temps, jumeau: true }); puff(ta, jy, '#3fc7a8'); });
        dessinerAvion(c, jx, jy, 0, 1.7, PEINTURE_JUMEAU, tuto.temps * 30, 1);
      }
      [3.4, 4.0].forEach((ta, i) => { const x = ax + 30 + (ta - t) * v; if (x > ax + 18 && x < w + 40) dessinerNote(c, { type: i ? 'up' : 'tap', masque: true }, x, ay + 40, 22, { temps: tuto.temps }); puff(ta, ay + 40); });
      dessinerAvion(c, ax, ay + 40, 0, 2, pe, tuto.temps * 30, 1);
      if (t > 2.8) { main(3.4); main(4.0, 'up'); }
    } else if (k === 'coeur' || k === 'etoile' || k === 'spirale') {
      const pts = FIGURES[k === 'coeur' ? 'H' : k === 'etoile' ? 'S' : 'P'];
      const cxF = 470, cyF = 170, S = 220;
      c.setLineDash([6, 8]); c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 4; c.beginPath();
      pts.forEach((p, i) => { const X = cxF + (p[0] - 0.5) * S, Y = cyF + (p[1] - 0.5) * S; if (i) c.lineTo(X, Y); else c.moveTo(X, Y); }); c.stroke(); c.setLineDash([]);
      const fait = Math.floor(clamp(t / (per * 0.8), 0, 1) * (pts.length - 1));
      c.strokeStyle = fumee; c.lineWidth = 12; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath();
      for (let i = 0; i <= fait; i++) { const p = pts[i]; const X = cxF + (p[0] - 0.5) * S, Y = cyF + (p[1] - 0.5) * S; if (i) c.lineTo(X, Y); else c.moveTo(X, Y); } c.stroke();
      dessinerAvion(c, ax, ay - 20 + Math.sin(tuto.temps * 4) * 30, 0, 2, pe, tuto.temps * 30, 1);
      dessinerMain(c, ax + 150, 300, 1.6, (t * 3) % 1 < 0.2);
    } else if (k === 'contre') {
      [0.8, 1.3, 1.8, 2.3].forEach((tb, i) => { const d = Math.abs(t - tb); c.fillStyle = d < 0.08 ? '#ffd75a' : 'rgba(255,255,255,.35)'; c.beginPath(); c.arc(260 + i * 90, 310, 14, 0, 7); c.fill(); });
      [1.05, 1.55].forEach((ta) => { note('tap', ta, ay); puff(ta, ay); });
      dessinerAvion(c, ax, ay, 0, 2, pe, tuto.temps * 30, 1);
      main(1.05); main(1.55);
    }
  }

  // ------------------------------------------------------------------------
  // Une partie (un spectacle)
  // ------------------------------------------------------------------------
  function lancerNiveau(n) {
    arreterNoteTenue();
    particules = [];
    const comp = composerNiveau(n);
    const joueur = comp.notes.filter((x) => !x.auto);
    partie = Object.assign(comp, {
      evenements: null, ie: 0, ib: 0, in: 0, base: 0, pauseA: 0, st: -9,
      score: 0, combo: 0, comboMax: 0, ambiance: 0.6, comptes: { parfait: 0, bien: 0, rate: 0 }, credit: 0,
      total: joueur.length, joueur, jumeauNotes: comp.notes.filter((x) => x.auto), pj: 0, pa: 0,
      tenue: null, glisse: null, textes: [], secousse: 0, termine: false, finPrevue: 0,
      avion: { x: xVisee(), y: yDe(7), ang: 0, ecart: 0 }, jumeau: { vis: 0, x: W + 80, y: yDe(9) },
      parfaitF: n < 5 ? 0.085 : 0.075, bienF: n < 5 ? 0.17 : 0.15, penalite: 0.075 + n * 0.0028,
    });
    partie.tFin = comp.chrono.temps(comp.finBattement) + 0.6;
    cielDecor = partie.L.c;
    $('hud-nom').textContent = tr('hud.spectacle', { n: n + 1, nom: tr('n.' + (n + 1)) });
    $('pause-nom').textContent = tr('hud.spectacle', { n: n + 1, nom: tr('n.' + (n + 1)) });
    majHud();
    montrerTuto(partie.L.tu.slice(), demarrer);
  }
  function demarrer() {
    if (!partie) return;
    audio();
    if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) { /* rien */ } }
    partie.evenements = preparerOrchestre(partie);
    partie.ie = 0;
    const t0 = partie.chrono.temps(-4) - 0.6;
    partie.base = performance.now() - t0 * 1000;
    partie.st = t0;
    etat = 'jeu'; montrer(null);
    try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (e) { /* rien */ }
  }
  const tempsMaintenant = () => partie ? (performance.now() - partie.base) / 1000 : 0;

  function majHud() {
    if (!partie) return;
    $('hud-score').textContent = nombre(partie.score);
    $('hud-combo').textContent = partie.combo >= 5 ? tr('hud.combo', { n: partie.combo }) : '';
    $('jauge-rempli').style.width = Math.round(clamp(partie.ambiance, 0, 1) * 100) + '%';
  }
  let banniereMinuteur = 0;
  function banniere(texte) {
    const b = $('banniere'); b.textContent = texte; b.classList.add('vu');
    clearTimeout(banniereMinuteur); banniereMinuteur = setTimeout(() => b.classList.remove('vu'), 2000);
  }
  function texteFlottant(cle, x, y, coul, vars) { if (partie) partie.textes.push({ txt: tr(cle, vars), x, y, coul, vie: 0 }); }

  // Résultat d'une note
  function noter(n, qualite, x, y) {
    if (n.juge) return;
    n.juge = qualite;
    const p = partie;
    const pts = qualite === 'parfait' ? 100 : qualite === 'bien' ? 60 : 0;
    const cred = qualite === 'parfait' ? 1 : qualite === 'bien' ? 0.6 : 0;
    p.credit += cred;
    p.comptes[qualite]++;
    const ax = x == null ? p.avion.x : x, ay = y == null ? p.avion.y : y;
    if (qualite === 'rate') {
      p.combo = 0;
      p.ambiance -= p.penalite * (n.or ? 1.6 : 1);
      p.secousse = 0.25;
      SON.rate();
      texteFlottant('juge.rate', ax, ay - 34, '#ffffff');
    } else {
      p.combo++; p.comboMax = Math.max(p.comboMax, p.combo);
      const mult = Math.min(3, 1 + Math.floor(p.combo / 10) * 0.5);
      p.score += Math.round(pts * mult * (n.or ? 3 : 1));
      p.ambiance += (qualite === 'parfait' ? 0.035 : 0.02) * (n.or ? 2.5 : 1);
      const coulF = couleurFumee(P.fumee, n.i);
      bouffee(ax - 6, ay, n.or ? '#ffd84a' : coulF, n.or ? 16 : 10, n.or ? 1.4 : 1);
      if (qualite === 'parfait') { etincelles(ax, ay, 8); SON.parfait(); }
      if (n.or) etincelles(ax, ay, 18, 45);
      if (n.feu) feuArtifice(W * (0.45 + Math.random() * 0.5), H * (0.1 + Math.random() * 0.22));
      texteFlottant(qualite === 'parfait' ? 'juge.parfait' : 'juge.bien', ax, ay - 34, qualite === 'parfait' ? '#ffe27a' : '#bff3ff');
      if (p.combo > 0 && p.combo % 10 === 0) { SON.palier(); texteFlottant('combo.palier', W * 0.55, hautPiste() - 26, '#ffd75a', { m: nombre(mult) }); }
    }
    if (n.figure !== undefined) { const f = p.figures[n.figure]; f.faits[n.segment] = qualite !== 'rate'; }
    p.ambiance = clamp(p.ambiance, 0, 1);
    majHud();
    if (p.ambiance <= 0 && !p.termine) { p.termine = true; p.finPrevue = performance.now() + 700; p.gagne = false; arreterNoteTenue(); }
  }
  function sonNote(n) { const m = midiDe(n.deg, partie.tonique); jouerInstrument(P.instrument, m, AC ? AC.currentTime : 0, 0.32, n.or ? 0.4 : 0.32); }

  // Recherche de la note la plus proche d'un geste
  function noteProche(t) {
    const p = partie; let best = null, bd = 1e9;
    while (p.in < p.notes.length && p.notes[p.in].juge) p.in++;
    for (let i = p.in; i < p.notes.length; i++) {
      const n = p.notes[i];
      if (n.t - t > p.bienF) break;
      if (n.auto || n.juge || n.enCours) continue;
      const d = Math.abs(n.t - t);
      if (d <= p.bienF && d < bd) { bd = d; best = n; }
    }
    return best;
  }
  const qualiteDe = (dt) => Math.abs(dt) <= partie.parfaitF ? 'parfait' : Math.abs(dt) <= partie.bienF ? 'bien' : 'rate';

  // Note longue : le son tient tant qu'on appuie
  let sonTenu = null;
  function arreterNoteTenue() { if (sonTenu) { try { sonTenu.arreter(AC ? AC.currentTime : 0); } catch (e) { /* rien */ } sonTenu = null; } }
  function commencerTenue(n, t, source) {
    const p = partie;
    n.enCours = true;
    p.tenue = { n, q: qualiteDe(t - n.t), source, debut: t };
    if (AC) sonTenu = jouerInstrument(P.instrument, midiDe(n.deg, p.tonique), AC.currentTime, n.fin - n.t, 0.3, true);
    bouffee(p.avion.x, p.avion.y, couleurFumee(P.fumee, n.i), 8);
  }
  function finirTenue(t) {
    const p = partie, h = p.tenue; if (!h) return;
    p.tenue = null; arreterNoteTenue();
    const n = h.n; n.enCours = false;
    const ratio = clamp((t - n.t) / Math.max(0.05, n.fin - n.t), 0, 1);
    let q = h.q;
    if (ratio < 0.85) q = ratio >= 0.4 ? 'bien' : 'rate';
    if (ratio < 0.85 && q !== 'rate') texteFlottant('juge.lache', p.avion.x, p.avion.y + 40, '#ffffff');
    noter(n, q);
  }

  // Gestes : appui (tap), glisser (up / down), relâcher
  function appui(t, geste, source, fausseExclue) {
    if (!partie || etat !== 'jeu' || partie.termine || partie.st < partie.chrono.temps(-0.5)) return null;
    const p = partie;
    const n = noteProche(t);
    if (!n) {
      // Fausse note (toucher loin de toute note) : le combo s'arrête et le
      // public s'impatiente un peu. Taper au hasard ne rapporte donc rien.
      if (!fausseExclue) {
        p.combo = 0; p.ambiance = clamp(p.ambiance - 0.025, 0, 1); majHud();
        texteFlottant('juge.fausse', p.avion.x + 10, p.avion.y + 46, '#ffd0dc');
        if (p.ambiance <= 0 && !p.termine) { p.termine = true; p.finPrevue = performance.now() + 700; p.gagne = false; }
      }
      return null;
    }
    if (n.type === 'hold') { commencerTenue(n, t, source); return 'pris'; }
    if (n.type === 'tap') { noter(n, qualiteDe(t - n.t)); sonNote(n); return 'pris'; }
    // flèche
    if (geste === 'tap') {
      if (source === 'doigt') { p.glisse = { n, t0: t }; return 'glisse'; }
      noter(n, 'rate'); texteFlottant('juge.glisse', p.avion.x + 40, p.avion.y + 40, '#ffe27a'); return 'pris';
    }
    if (geste === n.type) { noter(n, qualiteDe(t - n.t)); sonNote(n); }
    else { noter(n, 'rate'); texteFlottant('juge.glisse', p.avion.x + 40, p.avion.y + 40, '#ffe27a'); }
    return 'pris';
  }
  function glissement(sens) { // le doigt a glissé
    const p = partie; if (!p || !p.glisse) return;
    const g = p.glisse; p.glisse = null;
    if (g.n.juge) return;
    if (sens === g.n.type) { noter(g.n, qualiteDe(g.t0 - g.n.t)); sonNote(g.n); }
    else { noter(g.n, 'rate'); texteFlottant('juge.glisse', p.avion.x + 40, p.avion.y + 40, '#ffe27a'); }
  }
  function relache(t, source) {
    const p = partie; if (!p) return;
    if (p.tenue && p.tenue.source === source) finirTenue(t);
    if (source === 'doigt' && p.glisse) { const g = p.glisse; p.glisse = null; if (!g.n.juge) { noter(g.n, 'rate'); texteFlottant('juge.glisse', p.avion.x + 40, p.avion.y + 40, '#ffe27a'); } }
  }

  const doigts = new Map();
  cv.addEventListener('pointerdown', (e) => {
    audio();
    if (etat !== 'jeu') return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
    const d = { x: e.clientX, y: e.clientY, fait: false };
    doigts.set(e.pointerId, d);
    if (appui(tempsMaintenant(), 'tap', 'doigt') === 'pris') d.fait = true;
  });
  cv.addEventListener('pointermove', (e) => {
    const d = doigts.get(e.pointerId); if (!d || d.fait || etat !== 'jeu') return;
    const dy = e.clientY - d.y;
    if (Math.abs(dy) >= 22) {
      d.fait = true;
      const sens = dy < 0 ? 'up' : 'down';
      if (partie && partie.glisse) glissement(sens);
      else appui(tempsMaintenant(), sens, 'doigt', true);
    }
  });
  const finDoigt = (e) => { if (!doigts.has(e.pointerId)) return; doigts.delete(e.pointerId); relache(tempsMaintenant(), 'doigt'); };
  cv.addEventListener('pointerup', finDoigt);
  cv.addEventListener('pointercancel', finDoigt);

  const touchesEnfoncees = new Set();
  document.addEventListener('keydown', (e) => {
    const code = e.code;
    if (etat === 'tuto' && (code === 'Space' || code === 'Enter')) { e.preventDefault(); audio(); fermerTuto(); return; }
    if (etat === 'jeu' || etat === 'reprise') {
      if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); mettrePause(); return; }
    } else if (etat === 'pause' && (code === 'Escape' || code === 'KeyP')) { e.preventDefault(); reprendre(); return; }
    if (etat !== 'jeu') return;
    let geste = null;
    if (code === 'Space' || code === 'Enter' || code === 'NumpadEnter') geste = 'tap';
    else if (code === 'ArrowUp' || code === 'KeyW') geste = 'up';
    else if (code === 'ArrowDown' || code === 'KeyS') geste = 'down';
    if (!geste) return;
    e.preventDefault();
    if (e.repeat || touchesEnfoncees.has(code)) return;
    touchesEnfoncees.add(code);
    audio();
    appui(tempsMaintenant(), geste, 'touche:' + code);
  });
  document.addEventListener('keyup', (e) => {
    if (!touchesEnfoncees.has(e.code)) return;
    touchesEnfoncees.delete(e.code);
    relache(tempsMaintenant(), 'touche:' + e.code);
  });

  // Pause
  function mettrePause() {
    if (!partie || (etat !== 'jeu' && etat !== 'reprise')) return;
    if (partie.tenue) finirTenue(tempsMaintenant());
    if (etat === 'jeu') partie.pauseA = performance.now();
    etat = 'pause'; montrer('ecran-pause');
    if (AC && AC.state === 'running') { try { AC.suspend(); } catch (e) { /* rien */ } }
    try { $('b-reprendre').focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }
  function reprendre() {
    if (!partie || etat !== 'pause') return;
    SON.clic();
    etat = 'reprise'; montrer(null);
    partie.repriseFin = performance.now() + 1800;
  }
  $('b-pause').addEventListener('click', (e) => { e.stopPropagation(); audio(); mettrePause(); });
  $('b-reprendre').addEventListener('click', () => reprendre());
  $('b-recommencer').addEventListener('click', () => { if (AC) try { AC.resume(); } catch (e) { /* rien */ } SON.clic(); lancerNiveau(partie ? partie.n : 0); });
  $('b-accueil-pause').addEventListener('click', () => { if (AC) try { AC.resume(); } catch (e) { /* rien */ } if (partie) sauver(partie.n + 1, partie.score); allerTitre(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && (etat === 'jeu' || etat === 'reprise')) mettrePause(); });

  // Sauvegarde à la fermeture, seulement pendant un spectacle.
  window.JEL_SAVE.surFermeture(() => {
    if (partie && (etat === 'jeu' || etat === 'pause' || etat === 'reprise' || etat === 'tuto')) sauver(partie.n + 1, partie.score);
  });

  // ------------------------------------------------------------------------
  // Mise à jour d'une image de spectacle
  // ------------------------------------------------------------------------
  function majPartie(maintenant) {
    const p = partie;
    if (etat === 'reprise') {
      if (maintenant >= p.repriseFin) {
        p.base += maintenant - p.pauseA; etat = 'jeu';
        if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) { /* rien */ } }
      } else return;
    }
    if (etat !== 'jeu') return;
    const st = (maintenant - p.base) / 1000;
    p.st = st;
    // orchestre : on programme ce qui arrive dans les 0,15 s
    if (AC && p.evenements && !p.termine) {
      while (p.ie < p.evenements.length && p.evenements[p.ie].t < st + 0.15) {
        const ev = p.evenements[p.ie++];
        if (ev.t < st - 0.1) continue;
        try { ev.f(AC.currentTime + Math.max(0, ev.t - st)); } catch (e) { /* rien */ }
      }
    }
    // bannières
    while (p.ib < p.bannieres.length && p.bannieres[p.ib].t <= st) {
      const b = p.bannieres[p.ib++];
      if (!p.termine) { banniere(tr(b.cle)); if (b.vent) SON.vent(); }
    }
    // notes du jumeau, notes manquées, fin des notes longues
    while (p.in < p.notes.length && p.notes[p.in].juge) p.in++;
    for (let i = p.in; i < p.notes.length; i++) {
      const n = p.notes[i];
      if (n.t > st + 0.5) break;
      if (n.juge) continue;
      if (n.auto) { if (st >= n.t) { n.juge = 'jumeau'; bouffee(p.jumeau.x - 6, p.jumeau.y, '#3fc7a8', 8); } continue; }
      if (n.enCours) continue;
      if (p.glisse && p.glisse.n === n) { if (st > p.glisse.t0 + 0.4) { p.glisse = null; noter(n, 'rate'); } continue; }
      if (st > n.t + p.bienF) noter(n, 'rate');
    }
    if (p.tenue) {
      const n = p.tenue.n;
      const k = Math.floor(st * 40);
      if (k !== p.tenue.k) { p.tenue.k = k; traine(p.avion.x - 24, p.avion.y, couleurFumee(P.fumee, k), -vitesse() * 0.12, 2.2); }
      if (st >= n.fin) finirTenue(st);
    }
    // figures terminées
    for (const f of p.figures) {
      if (!f.fini && st > f.t1 + 0.2) {
        f.fini = true;
        let ok = 0; for (let k = 0; k < f.n; k++) if (f.faits[k]) ok++;
        if (ok === f.n) { p.score += 300; p.ambiance = clamp(p.ambiance + 0.12, 0, 1); banniere(tr('banniere.figureOk', { n: 300 })); SON.palier(); const c = centreFigure(); confettis(30); etincelles(c.x, c.y, 40, 300); majHud(); }
      }
    }
    // fin du spectacle
    if (!p.termine && st >= p.tFin) {
      p.termine = true; p.gagne = p.credit / Math.max(1, p.total) >= 0.5;
      p.finPrevue = maintenant + 400;
    }
    if (p.termine && maintenant >= p.finPrevue && etat === 'jeu') finirNiveau(p.gagne);
  }
  const vitesse = () => (W - xVisee() + 40) / partie.L.app;
  function centreFigure() {
    const S = taillefigure();
    return portrait() ? { x: W * 0.6, y: Math.max(70 + S / 2, hautPiste() - S / 2 - 18) } : { x: W * 0.74, y: hautPiste() + S * 0.45 };
  }
  const taillefigure = () => portrait() ? clamp(Math.min(W * 0.4, hautPiste() - 110), 70, 150) : clamp(H * 0.34, 70, 150);

  // Position de l'avion : il suit la hauteur des notes, fait des loopings.
  function positionAvion(st) {
    const p = partie, ns = p.joueur;
    while (p.pj < ns.length && (ns[p.pj].fin || ns[p.pj].t) < st) p.pj++;
    const nx = ns[p.pj], pv = ns[p.pj - 1];
    const mid = yDe(7);
    let y;
    if (!nx) y = pv ? yDe(pv.deg) : mid;
    else if (nx.t <= st) y = yDe(nx.deg);
    else if (!pv) y = lerp(mid, yDe(nx.deg), doux(clamp((st - (nx.t - 1.2)) / 1.2, 0, 1)));
    else {
      const a = pv.fin || pv.t, b = nx.t;
      let u = clamp((st - a) / Math.max(0.05, b - a), 0, 1);
      if (nx.type === 'up' || nx.type === 'down') u = clamp((u - 0.55) / 0.45, 0, 1);
      y = lerp(yDe(pv.deg), yDe(nx.deg), doux(u));
    }
    return y;
  }
  function positionJumeau(st) {
    const p = partie, ns = p.jumeauNotes;
    if (!ns.length) return null;
    while (p.pa < ns.length && (ns[p.pa].fin || ns[p.pa].t) < st) p.pa++;
    const nx = ns[p.pa], pv = ns[p.pa - 1];
    const proche = (nx && nx.t - st < 1.6 && (!pv || nx.b - pv.b < 4)) || (pv && st - (pv.fin || pv.t) < 0.5);
    let y = p.jumeau.y;
    if (nx && pv && nx.b - pv.b < 4) { const a = pv.fin || pv.t; y = lerp(yDe(pv.deg), yDe(nx.deg), doux(clamp((st - a) / Math.max(0.05, nx.t - a), 0, 1))); }
    else if (nx) y = yDe(nx.deg);
    else if (pv) y = yDe(pv.deg);
    return { proche: !!proche, y };
  }

  // ------------------------------------------------------------------------
  // Dessin d'une image de spectacle
  // ------------------------------------------------------------------------
  function dessinerPartie(dt) {
    const p = partie, c = cx;
    const st = etat === 'jeu' ? p.st : p.st; // figé en pause
    const v = vitesse(), xv = xVisee(), r = rayonNote();
    const bat = p.chrono.battement(st);
    c.save();
    if (p.secousse > 0) { const s = p.secousse * 14; c.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s); p.secousse = Math.max(0, p.secousse - dt); }
    dessinerCiel(c, CIELS[p.L.c], Math.max(0, st) * v, performance.now() / 1000, bat, p.ambiance);
    // vent des rafales
    const spbBase = 60 / p.L.bpm, spb = p.chrono.spb(bat);
    const vent = spbBase / spb - 1;
    if (Math.abs(vent) > 0.01) {
      c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 2.5; c.lineCap = 'round';
      const vit = vent > 0 ? 900 : 260;
      for (let i = 0; i < 12; i++) { const x = W - ((st * vit + i * 173) % (W + 160)); const y = hautPiste() - 30 + ((i * 71) % Math.max(60, basPiste() - hautPiste() + 60)); c.beginPath(); c.moveTo(x, y); c.lineTo(x + (vent > 0 ? 70 : 30), y); c.stroke(); }
    }
    // ligne de visée
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 3; c.setLineDash([4, 10]);
    c.beginPath(); c.moveTo(xv, hautPiste() - 30); c.lineTo(xv, basPiste() + 30); c.stroke(); c.setLineDash([]);
    // figures en fumée
    for (const f of p.figures) {
      if (st < f.t0 - 2.5 || st > f.t1 + 2.5) continue;
      const a = clamp(Math.min((st - (f.t0 - 2.5)) / 0.6, (f.t1 + 2.5 - st) / 0.8), 0, 1);
      const pts = FIGURES[f.lettre], S = taillefigure(), ce = centreFigure();
      const P2 = (q) => [ce.x + (q[0] - 0.5) * S, ce.y + (q[1] - 0.5) * S];
      c.globalAlpha = a * 0.8; c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 3; c.setLineDash([5, 7]);
      c.beginPath(); pts.forEach((q, i) => { const [X, Y] = P2(q); if (i) c.lineTo(X, Y); else c.moveTo(X, Y); }); c.stroke(); c.setLineDash([]);
      c.lineCap = 'round'; c.lineJoin = 'round';
      for (let k = 0; k < f.n; k++) {
        if (!f.faits[k]) continue;
        const [X0, Y0] = P2(pts[k]), [X1, Y1] = P2(pts[k + 1]);
        c.globalAlpha = a; c.strokeStyle = couleurFumee(P.fumee, k * 3); c.lineWidth = 10;
        c.beginPath(); c.moveTo(X0, Y0); c.lineTo(X1, Y1); c.stroke();
      }
      // segment à venir qui clignote
      const suiv = p.notes.find((n) => n.figure === f.id && !n.juge);
      if (suiv) { const [X0, Y0] = P2(pts[suiv.segment]), [X1, Y1] = P2(pts[suiv.segment + 1]); c.globalAlpha = a * (0.4 + 0.4 * Math.sin(performance.now() / 120)); c.strokeStyle = '#ffffff'; c.lineWidth = 6; c.beginPath(); c.moveTo(X0, Y0); c.lineTo(X1, Y1); c.stroke(); }
      c.globalAlpha = 1;
    }
    // zones de nuages
    const zones = [];
    for (const z of p.nuages) {
      if (st > z.t1 + 0.1 || st < z.t0 - p.L.app - 0.2) continue;
      const xs = xv + (z.t0 - st) * v, xe = xv + (z.t1 - st) * v;
      let a0, a1;
      const L2 = W - xv;
      if (z.mode === 'voyage') { const ph = Math.sin(st * 1.7); a0 = xv + L2 * (0.18 + 0.3 * (ph + 1) / 2); a1 = a0 + L2 * 0.42; }
      else { a0 = xv + L2 * 0.42; a1 = W + 80; }
      const g0 = Math.max(a0, xs), g1 = Math.min(a1, xe + r * 2);
      if (g1 > g0) zones.push({ x0: a0, x1: a1, g0, g1 });
    }
    const cache = (n, x) => n.nuage !== false && zones.some((zn) => x >= zn.x0 - r && x <= zn.x1) && p.nuages.some((z) => n.b >= z.b0 && n.b < z.b1);
    // notes
    const tps = performance.now() / 1000;
    for (let i = p.notes.length - 1; i >= 0; i--) {
      const n = p.notes[i];
      if (n.t - st > p.L.app + 0.3) continue;
      const fin = n.fin || n.t;
      if (fin < st - 0.4) continue;
      let x = xv + (n.t - st) * v;
      const y = yDe(n.deg);
      const xFin = n.h ? xv + (n.fin - st) * v : x;
      if (n.auto) {
        if (n.juge) continue;
        dessinerNote(c, n, x, y, r * 0.85, { temps: tps, jumeau: true, xFin });
        continue;
      }
      if (n.enCours) { dessinerNote(c, n, xv, y, r, { temps: tps, xFin }); continue; }
      if (n.juge === 'rate') { const d = st - n.t; if (d < 0.4 && !n.h) dessinerNote(c, n, x, y, r, { temps: tps, alpha: 0.4 * (1 - d / 0.4), xFin, revele: true }); continue; }
      if (n.juge) continue;
      if (cache(n, x)) continue;
      dessinerNote(c, n, x, y, r, { temps: tps, xFin });
    }
    // nuages dessinés par-dessus les notes cachées
    for (const zn of zones) bancNuages(c, zn, st, v, tps, p.L.c === 3);
    // avions
    let ya = positionAvion(st);
    const av = p.avion;
    const jum = positionJumeau(st);
    const visCible = jum && jum.proche ? 1 : 0;
    p.jumeau.vis = lerp(p.jumeau.vis, visCible, clamp(dt * 3, 0, 1));
    // pendant la phrase du jumeau, ton avion se range un peu en arrière et en dessous
    av.ecart = lerp(av.ecart, visCible ? 1 : 0, clamp(dt * 6, 0, 1));
    let x = xv - av.ecart * Math.min(34, xv * 0.25), ang;
    ya += av.ecart * 36;
    if (p.tenue) {
      const n = p.tenue.n, phi = clamp((st - n.t) / Math.max(0.05, n.fin - n.t), 0, 1) * Math.PI * 2;
      const R = clamp((basPiste() - hautPiste()) * 0.18, 30, 60), vers = ya - 2 * R < 70 ? 1 : -1;
      x = xv + R * Math.sin(phi); ya = ya + vers * R * (1 - Math.cos(phi)); ang = vers < 0 ? -phi : phi;
    } else {
      const y2 = positionAvion(st + 0.04);
      ang = clamp(Math.atan2(y2 - ya, v * 0.04 * 0.6), -0.55, 0.55);
      ang = lerp(av.ang, ang, clamp(dt * 12, 0, 1));
    }
    av.x = x; av.y = ya; av.ang = ang;
    if (etat === 'jeu' && Math.floor(st * 24) !== av.k) { av.k = Math.floor(st * 24); traine(x - 40, ya + Math.sin(ang) * -30, 'rgba(255,255,255,.8)', -v * 0.9, 0.7); }
    majParticules(etat === 'jeu' ? dt : 0);
    dessinerParticules(c);
    const echelle = clamp(Math.min(W, H) / 330, 1.05, 1.6);
    if (jum && p.jumeau.vis > 0.02) {
      const jx = xv + (1 - p.jumeau.vis) * W * 0.6;
      p.jumeau.x = jx; p.jumeau.y = jum.y;
      dessinerAvion(c, jx - 30 * echelle, jum.y, 0, echelle * 0.9, PEINTURE_JUMEAU, tps * 40, p.jumeau.vis);
    }
    dessinerAvion(c, x - 30 * echelle, ya, ang, echelle, PEINTURES.find((q) => q.id === P.peinture), tps * 40, 1);
    // textes flottants (Parfait !, Bien !…)
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (const t of p.textes) {
      t.vie += dt;
      c.globalAlpha = clamp(1 - t.vie / 0.9, 0, 1);
      c.font = '900 ' + Math.round(clamp(W * 0.05, 18, 26)) + 'px system-ui, sans-serif';
      c.lineWidth = 5; c.strokeStyle = 'rgba(20,30,80,.75)';
      c.strokeText(t.txt, t.x, t.y - t.vie * 40); c.fillStyle = t.coul; c.fillText(t.txt, t.x, t.y - t.vie * 40);
    }
    c.globalAlpha = 1;
    p.textes = p.textes.filter((t) => t.vie < 0.9);
    // décompte
    let compte = null;
    if (etat === 'reprise') compte = nombre(Math.max(1, Math.ceil((p.repriseFin - performance.now()) / 600)));
    else if (st < 0) { const b = Math.floor(bat); compte = b < -4 ? tr('compte.pret') : b === -1 ? tr('compte.go') : nombre(-b - 1); }
    if (compte) {
      c.font = '900 ' + Math.round(clamp(W * 0.12, 40, 76)) + 'px system-ui, sans-serif';
      c.lineWidth = 8; c.strokeStyle = 'rgba(20,30,80,.8)'; c.strokeText(compte, W / 2, H * 0.5); c.fillStyle = '#fff'; c.fillText(compte, W / 2, H * 0.5);
    }
    c.restore();
  }

  // Banc de nuages : bouffées accrochées au ciel (elles défilent avec les
  // notes), ombre douce dessous, bords fondus.
  function bancNuages(c, zn, st, v, tps, nuit) {
    const haut = hautPiste() - 40, bas = basPiste() + 40, pas = 34, decal = st * v;
    const k0 = Math.floor((zn.g0 - 40 + decal) / pas), k1 = Math.ceil((zn.g1 + 40 + decal) / pas);
    for (let passe = 0; passe < 2; passe++) {
      c.fillStyle = passe ? (nuit ? '#d5d9f3' : '#ffffff') : (nuit ? '#8e95c8' : '#c6d1ea');
      for (let k = k0; k <= k1; k++) {
        const x = k * pas - decal;
        const a = clamp((x - zn.g0 + 14) / 34, 0, 1) * clamp((zn.g1 - x + 14) / 34, 0, 1);
        if (a <= 0) continue;
        for (let rang = 0, y = haut; y <= bas; y += 38, rang++) {
          const h = Math.abs(((k * 73856093) ^ (rang * 19349663)) % 7);
          const r = 24 + h * 3.5, yy = y + ((h * 5) % 11) - 5 + Math.sin(tps * 0.8 + k + rang) * 3;
          c.globalAlpha = a * (passe ? 0.97 : 0.85);
          c.beginPath(); c.arc(x + (passe ? 0 : 4), yy + (passe ? 0 : 8), r, 0, 7); c.fill();
        }
      }
    }
    c.globalAlpha = 1;
  }

  // Décor des écrans de menu : l'avion fait des figures dans le ciel.
  let demo = { t: 0, k: 0 };
  function dessinerDemo(dt) {
    demo.t += dt;
    const c = cx, ciel = CIELS[cielDecor];
    dessinerCiel(c, ciel, demo.t * 60, demo.t, demo.t * 1.6, 0.8);
    const a = demo.t * 0.9;
    const x = W * 0.5 + W * 0.32 * Math.sin(a), y = H * 0.5 + H * 0.09 * Math.sin(2 * a);
    const x2 = W * 0.5 + W * 0.32 * Math.sin(a + 0.02), y2 = H * 0.5 + H * 0.09 * Math.sin(2 * (a + 0.02));
    const ang = Math.atan2(y2 - y, x2 - x);
    const k = Math.floor(demo.t * 30);
    if (k !== demo.k) { demo.k = k; const coul = cielDecor === 0 && etat === 'titre' ? 'hsl(' + ((k * 7) % 360) + ',95%,66%)' : couleurFumee(P.fumee, k); particules.push({ x: x - Math.cos(ang) * 34, y: y - Math.sin(ang) * 34, vx: 0, vy: 0, r: 7, croit: 9, vie: 0, max: 2.2, coul, g: 0 }); }
    majParticules(dt);
    dessinerParticules(c);
    const flip = Math.cos(ang) < 0;
    c.save(); c.translate(x, y); if (flip) c.scale(-1, 1);
    dessinerAvion(c, 0, 0, flip ? Math.PI - ang : ang, clamp(Math.min(W, H) / 280, 1.2, 2), PEINTURES.find((q) => q.id === P.peinture), demo.t * 40, 1);
    c.restore();
  }

  // ------------------------------------------------------------------------
  // Fin d'un spectacle : victoire ou défaite
  // ------------------------------------------------------------------------
  function finirNiveau(gagne) {
    const p = partie; if (!p) return;
    arreterNoteTenue();
    const n = p.n;
    const prec = p.credit / Math.max(1, p.total);
    const etoiles = gagne ? (prec >= 0.9 ? 3 : prec >= 0.75 ? 2 : 1) : 0;
    const avant = totalEtoiles();
    const ancienRecord = P.records[n];
    const record = p.score > ancienRecord;
    if (record) P.records[n] = p.score;
    etat = 'fin';
    const deblocages = [];
    if (gagne) {
      P.etoiles[n] = Math.max(P.etoiles[n], etoiles);
      P.debloque = Math.max(P.debloque, Math.min(NIVEAUX.length, n + 2));
      const apres = totalEtoiles();
      [[FUMEES, 'fumee.'], [PEINTURES, 'peinture.'], [INSTRUMENTS, 'instr.']].forEach(([liste, cle]) => liste.forEach((it) => { if (it.seuil > avant && it.seuil <= apres) deblocages.push(tr(cle + it.id)); }));
      sauver(Math.min(n + 2, NIVEAUX.length), p.score);
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
      if (P.etoiles.every((e) => e >= 1)) {
        if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
      }
      SON.victoire(); confettis(90);
      if (p.L.fin) for (let i = 0; i < 5; i++) setTimeout(() => { if (etat === 'fin') feuArtifice(W * (0.2 + Math.random() * 0.6), H * (0.15 + Math.random() * 0.25)); }, 300 + i * 380);
    } else {
      sauver(n + 1, p.score);
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: n + 1 });
      SON.defaite();
    }
    // Écran
    $('fin-titre').textContent = tr(gagne ? 'fin.bravo' : 'fin.rate');
    $('fin-message').textContent = gagne ? tr('fin.reussi') : (p.ambiance <= 0 ? tr('fin.dort') : tr('fin.moitie'));
    const spans = $('fin-etoiles').children;
    for (let k = 0; k < 3; k++) spans[k].classList.remove('on');
    $('fin-etoiles').setAttribute('aria-label', tr('fin.etoilesAria', { n: etoiles }));
    $('fin-etoiles').setAttribute('role', 'img');
    for (let k = 0; k < etoiles; k++) setTimeout(() => { if (etat === 'fin') { spans[k].classList.add('on'); SON.etoile(k); } }, 500 + k * 380);
    // score qui défile
    const cible = p.score, debut = performance.now();
    const defile = () => { const u = clamp((performance.now() - debut) / 900, 0, 1); $('fin-score').textContent = nombre(Math.round(cible * doux(u))); if (u < 1 && etat === 'fin') requestAnimationFrame(defile); };
    defile();
    $('fin-precision').textContent = tr('fin.precision', { p: nombre(Math.round(prec * 100)) });
    $('fin-record').textContent = record && cible > 0 ? tr('fin.record') : tr('fin.recordAncien', { n: nombre(P.records[n]) });
    $('fin-record').className = record && cible > 0 ? 'record' : 'petit';
    $('fin-detail').textContent = tr('fin.detail', { a: p.comptes.parfait, b: p.comptes.bien, c: p.comptes.rate });
    $('fin-combo').textContent = tr('fin.combo', { n: p.comboMax });
    const zd = $('fin-debloque'); zd.textContent = '';
    deblocages.forEach((nom) => { const e = document.createElement('p'); e.textContent = tr('fin.debloque', { nom }); zd.appendChild(e); });
    if (deblocages.length) setTimeout(() => SON.deblocage(), 1600);
    const dernier = gagne && n === NIVEAUX.length - 1;
    $('fin-final').hidden = !dernier;
    if (dernier) { $('fin-final-texte').textContent = tr('fin.finalTexte', { n: totalEtoiles(), max: NIVEAUX.length * 3 }); confettis(120); }
    const zb = $('fin-boutons'); zb.textContent = '';
    const bouton = (cle, classe, f) => { const b = document.createElement('button'); b.className = 'bouton ' + classe; b.textContent = tr(cle); b.addEventListener('click', () => { audio(); SON.clic(); f(); }); zb.appendChild(b); return b; };
    let premier;
    if (gagne) {
      if (n < NIVEAUX.length - 1) premier = bouton('bouton.suivant', 'principal', () => lancerNiveau(n + 1));
      const r2 = bouton('bouton.rejouer', premier ? 'discret' : 'principal', () => lancerNiveau(n)); premier = premier || r2;
      bouton('bouton.spectacles', 'discret', ouvrirNiveaux);
      if (dernier) bouton('bouton.accueil', 'discret', allerTitre);
    } else {
      premier = bouton('bouton.reessayer', 'principal', () => lancerNiveau(n));
      bouton('bouton.spectacles', 'discret', ouvrirNiveaux);
      bouton('bouton.accueil', 'discret', allerTitre);
    }
    montrer('ecran-fin');
    try { premier.focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }

  // ------------------------------------------------------------------------
  // Boucle principale
  // ------------------------------------------------------------------------
  let derniere = performance.now();
  function boucle(maintenant) {
    requestAnimationFrame(boucle);
    const dt = clamp((maintenant - derniere) / 1000, 0, 0.05);
    derniere = maintenant;
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    try {
      if (partie && (etat === 'jeu' || etat === 'pause' || etat === 'reprise')) { majPartie(maintenant); if (partie) dessinerPartie(etat === 'jeu' ? dt : 0); }
      else {
        if (etat === 'fin' && partie) cielDecor = partie.L.c;
        dessinerDemo(dt);
      }
      if (etat === 'tuto') dessinerTuto(dt);
      if (etat === 'hangar') dessinerApercu(dt);
    } catch (e) {
      // une erreur ne doit pas figer le jeu : on la signale une seule fois
      if (!boucle.signale) { boucle.signale = true; setTimeout(() => { throw e; }, 0); }
    }
  }

  // Démarrage
  majBoutonsSon();
  majTitre();
  if (window.JEL_I18N.surChangement) window.JEL_I18N.surChangement(() => { majBoutonsSon(); majTitre(); });
  requestAnimationFrame(boucle);
})();
</script>
