    c.restore();
    return { x, y };
  }

  function dessinerVapeur(ge) {
    const c = ctx, x = ecranX(ge.x), y = ecranY(ge.y);
    if (ge.etat === 'alerte') {
      c.fillStyle = 'rgba(255,255,255,.8)';
      for (let k = 0; k < 4; k++) { const p = (tGlobal * 1.5 + k / 4) % 1; ellipse(c, x + Math.sin(k * 3 + tGlobal * 4) * 6, y - p * 24, 3 + p * 2, 3 + p * 2); c.fill(); }
    } else if (ge.etat === 'souffle') {
      const p = 1 - ge.t / 0.6;
      for (let k = 0; k < 7; k++) {
        c.fillStyle = 'rgba(255,255,255,' + (0.85 - p * 0.6) + ')';
        ellipse(c, x + Math.sin(k * 2.3) * 8, y - k * RP * 0.07 - p * 20, RP * (0.05 + k * 0.012), RP * (0.045 + k * 0.01)); c.fill();
      }
      c.strokeStyle = 'rgba(255,255,255,' + (1 - p) + ')'; c.lineWidth = 3;
      ellipse(c, x, y, ge.r * RP * (0.5 + p), ge.r * RP * SY * (0.5 + p)); c.stroke();
    }
  }

  function dessinerParticules() {
    const c = ctx;
    for (const p of particules) {
      const a = Math.max(0, p.vie / p.max);
      c.globalAlpha = a;
      if (p.t === 'rond') { c.fillStyle = p.c; ellipse(c, p.x, p.y, p.taille * (1.5 - a * 0.5), p.taille * (1.5 - a * 0.5)); c.fill(); }
      else if (p.t === 'etoile') etoileForme(c, p.x, p.y, p.taille, p.c);
      else if (p.t === 'trait') { c.strokeStyle = p.c; c.lineWidth = 2; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.12, p.y - p.vy * 0.12); c.stroke(); }
      else {
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.c;
        if (p.t === 'feuille') { ellipse(c, 0, 0, p.taille, p.taille * 0.45); c.fill(); }
        else c.fillRect(-p.taille / 2, -p.taille / 4, p.taille, p.taille / 2);
        c.restore();
      }
    }
    c.globalAlpha = 1;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (const p of popups) {
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.font = '900 ' + Math.round(Math.max(18, RP * 0.1)) + 'px ui-rounded, system-ui, sans-serif';
      c.lineWidth = 5; c.strokeStyle = '#4a2c12'; c.strokeText(p.txt, p.x, p.y);
      c.fillStyle = p.c; c.fillText(p.txt, p.x, p.y);
    }
    c.globalAlpha = 1;
  }

  function dessinerBanniere() {
    if (!banniere) return;
    const c = ctx;
    const p = Math.min(1, banniere.t * 4);
    const taille = Math.round(Math.min(W * 0.11, 54) * (0.6 + 0.4 * p));
    c.save();
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = '900 ' + taille + 'px ui-rounded, system-ui, sans-serif';
    const txt = t(banniere.cle);
    const y = CY - RP * SY - RP * 0.35;
    c.lineWidth = 8; c.strokeStyle = '#4a2c12'; c.lineJoin = 'round';
    // texte trop large : on réduit
    let w = c.measureText(txt).width;
    if (w > W * 0.92) { c.font = '900 ' + Math.floor(taille * W * 0.92 / w) + 'px ui-rounded, system-ui, sans-serif'; }
    c.strokeText(txt, CX, y); c.fillStyle = banniere.couleur; c.fillText(txt, CX, y);
    c.restore();
  }

  // Animation du tutoriel : main, halo et démonstration.
  function dessinerTuto() {
    const etape = tutoEtapes[tutoI];
    if (!etape) return;
    const c = ctx;
    const cyc = (tTuto % 2.2) / 2.2;
    const jx = ecranX(joueur.x), jy = ecranY(joueur.y);
    const adv = dinos.find((d) => d.camp === 'adv');
    const ax = adv ? ecranX(adv.x) : CX + RP * 0.4, ay = adv ? ecranY(adv.y) : CY;
    const main = (x, y, appui) => {
      c.save(); c.translate(x, y); c.scale(1.1, 1.1);
      c.fillStyle = '#ffe0c2'; c.strokeStyle = '#6b3f1d'; c.lineWidth = 2.5;
      rr(c, -9, -4, 22, 26, 9); c.fill(); c.stroke();
      rr(c, -6, -30 + (appui ? 4 : 0), 10, 30, 5); c.fill(); c.stroke();
      c.restore();
    };
    const halo = (x, y, r) => {
      const p = (tTuto * 1.2) % 1;
      c.strokeStyle = 'rgba(255,213,74,' + (1 - p) + ')'; c.lineWidth = 5;
      ellipse(c, x, y, r * (1 + p * 0.4), r * SY * (1 + p * 0.4)); c.stroke();
      c.strokeStyle = '#ffd54a'; c.lineWidth = 3; ellipse(c, x, y, r, r * SY); c.stroke();
      // flèche qui rebondit
      const fy = y - r * SY - 26 - Math.abs(Math.sin(tTuto * 4)) * 10;
      c.fillStyle = '#ffd54a'; c.strokeStyle = '#6b3f1d'; c.lineWidth = 2.5;
      c.beginPath(); c.moveTo(x - 12, fy - 16); c.lineTo(x + 12, fy - 16); c.lineTo(x + 12, fy - 4); c.lineTo(x + 20, fy - 4); c.lineTo(x, fy + 14); c.lineTo(x - 20, fy - 4); c.lineTo(x - 12, fy - 4); c.closePath(); c.fill(); c.stroke();
    };
    switch (etape) {
      case 'charge': case 'clavier': {
        const p = Math.min(1, cyc / 0.6);
        const x0 = jx + 10, y0 = jy + 40, x1 = x0 + (ax - jx) * 0.6, y1 = y0 + (ay - jy) * 0.6;
        c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 8; c.setLineDash([10, 10]);
        c.beginPath(); c.moveTo(x0, y0); c.lineTo(x0 + (x1 - x0) * p, y0 + (y1 - y0) * p); c.stroke(); c.setLineDash([]);
        main(x0 + (x1 - x0) * p, y0 + (y1 - y0) * p + 10, cyc < 0.65);
        break;
      }
      case 'but': halo(CX, CY, RP * rayon * 1.02); break;
      case 'esquive': case 'esquive2': {
        const tap = cyc < 0.25;
        main(jx + 30, jy + 30, tap);
        if (cyc < 0.45) { c.strokeStyle = 'rgba(255,255,255,' + (1 - cyc / 0.45) + ')'; c.lineWidth = 4; ellipse(c, jx + 24, jy + 6, 10 + cyc * 60, 10 + cyc * 60); c.stroke(); }
        if (etape === 'esquive2') halo(ax, ay, taillePx(adv) * 1.6);
        break;
      }
      case 'ancre': case 'endurance': {
        main(jx + 30, jy + 30, true);
        c.strokeStyle = '#ffd54a'; c.lineWidth = 5;
        c.beginPath(); c.arc(jx + 24, jy + 8, 22, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * cyc); c.stroke();
        if (etape === 'endurance') halo(jx, jy + taillePx(joueur) * 0.7, taillePx(joueur) * 1.3);
        break;
      }
      case 'feinte': case 'champion': case 'champion2': case 'champion3': case 'rapide': case 'malin': case 'malin2': case 'finale': case 'oeufsAdv':
        if (adv) halo(ax, ay, taillePx(adv) * 1.7);
        if (etape === 'oeufsAdv' && oeufs[0]) halo(ecranX(oeufs[0].x), ecranY(oeufs[0].y), RP * 0.14);
        break;
      case 'boue': if (boue[0]) halo(ecranX(boue[0].x), ecranY(boue[0].y), boue[0].r * RP); break;
      case 'oeufs': if (oeufs[0]) halo(ecranX(oeufs[0].x), ecranY(oeufs[0].y), RP * 0.16); break;
      case 'vapeur': if (geysers[0]) {
        halo(ecranX(geysers[0].x), ecranY(geysers[0].y), geysers[0].r * RP);
        const g0 = geysers[0]; const sv = g0.etat; g0.etat = cyc < 0.5 ? 'alerte' : 'souffle'; g0.t = 0.6 * (1 - (cyc - 0.5) * 2); dessinerVapeur(g0); g0.etat = sv;
      } break;
      case 'fruit': case 'fruit2': {
        const fx = CX + RP * 0.05, fy = CY - RP * SY * 0.4;
        if (etape === 'fruit') dessinerPtero(cyc, 1, CY - RP * SY - RP * 0.55, cyc < 0.5);
        const z = cyc < 0.5 ? 1 : Math.max(0, 1 - (cyc - 0.5) / 0.3);
        const sv = fruit; fruit = { x: 0.05, y: -0.4, z, pose: z === 0, t: 0 }; dessinerFruit(); fruit = sv;
        halo(fx, fy, RP * 0.12);
        break;
      }
      case 'maree': case 'terrainPlage': halo(CX, CY, RP * rayon * 1.02); break;
      case 'terrainVolcan': case 'terrainGlacier': case 'glace': halo(CX, CY, RP * 0.6); break;
      case 'allie': case 'allie2': {
        const al = dinos.find((d) => d.camp === 'allie');
        if (al) halo(ecranX(al.x), ecranY(al.y), taillePx(al) * 1.7);
        if (etape === 'allie2') dinos.filter((d) => d.camp === 'adv').forEach((d) => halo(ecranX(d.x), ecranY(d.y), taillePx(d) * 1.5));
        break;
      }
      case 'vent': case 'tempete': {
        c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3;
        for (let k = 0; k < 6; k++) {
          const yy = CY - RP * SY * 0.6 + k * RP * SY * 0.25, xx = ((tTuto * 300 + k * 90) % (W + 200)) - 100;
          c.beginPath(); c.moveTo(xx, yy); c.lineTo(xx + 70, yy); c.stroke();
          c.beginPath(); c.moveTo(xx + 70, yy); c.lineTo(xx + 58, yy - 7); c.moveTo(xx + 70, yy); c.lineTo(xx + 58, yy + 7); c.stroke();
        }
        break;
      }
      case 'melange': halo(CX, CY, RP * 0.7); break;
    }
  }

  function dessinerScene() {
    const c = ctx;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    const sx = secousse > 0.2 ? hasard(-secousse, secousse) : 0, sy = secousse > 0.2 ? hasard(-secousse, secousse) : 0;
    c.save(); c.translate(sx, sy);
    const terrain = etat === 'titre' || etat === 'menu' ? 'colline' : L.terrain;
    dessinerFond(terrain, tGlobal);
    if (etat === 'titre' || etat === 'menu') { dessinerTitre(); c.restore(); return; }
    dessinerArene(terrain, tGlobal);
    dessinerBord(terrain, false, tGlobal);
    for (const g of geysers) if (g.etat !== 'souffle') dessinerVapeur(g);
    // Objets triés en profondeur
    const objets = [];
    for (const d of dinos) if (!d.sorti) objets.push({ y: d.y + (d.chute && !d.chute.faute ? 0.2 : 0), f: () => dessinerDinoMonde(d) });
    for (const e of oeufs) objets.push({ y: e.y, f: () => dessinerOeuf(e) });
    if (fruit) objets.push({ y: fruit.y, f: dessinerFruit });
    objets.sort((a, b) => a.y - b.y).forEach((o) => o.f());
    for (const g of geysers) if (g.etat === 'souffle') dessinerVapeur(g);
    dessinerBord(terrain, true, tGlobal);
    if (ptero) dessinerPtero(ptero.u, ptero.dir, CY - RP * SY - RP * 0.55, !ptero.lache);
    dessinerParticules();
    if (etat === 'tuto') dessinerTuto();
    else dessinerBanniere();
    c.restore();
  }

  // Dessin de l'écran titre (sert aussi de jaquette) : deux tricératops front contre front.
  function dessinerTitre() {
    const c = ctx;
    const svR = rayon, svB = boue, svG = geysers; rayon = 1; boue = []; geysers = [];
    // Écran large : arène plus petite, entre le titre et les boutons.
    const svRP = RP, svCY = CY;
    if (W > H * 1.1) { RP *= 0.62; CY = H * 0.57; }
    const ry = CY;
    dessinerArene('colline', tGlobal);
    dessinerBord('colline', false, tGlobal);
    const s = RP * 0.17;
    const pousse = Math.sin(tGlobal * 2.2) * RP * 0.025;
    c.fillStyle = 'rgba(0,0,0,.22)';
    ellipse(c, CX - s * 1.1 + pousse, ry, s * 1.3, s * 0.45); c.fill();
    ellipse(c, CX + s * 1.1 + pousse, ry, s * 1.3, s * 0.45); c.fill();
    c.save(); c.translate(CX - s * 1.1 + pousse, ry); c.scale(s, s);
    dessinerDino(c, progres.espece, null, COLLERETTES[progres.collerette].c, { marche: tGlobal * 6, amp: 0.5, penche: 0.6, accroupi: 0.3, yeux: 'concentre' });
    c.restore();
    c.save(); c.translate(CX + s * 1.1 + pousse, ry); c.scale(-s, s);
    dessinerDino(c, 'tri', '#9bbf5a', '#f08a4b', { marche: tGlobal * 6 + 2, amp: 0.5, penche: 0.6, accroupi: 0.3, yeux: 'concentre' });
    c.restore();
    // poussière entre les deux fronts
    c.fillStyle = 'rgba(255,248,220,.8)';
    for (let k = 0; k < 4; k++) { const p = (tGlobal * 1.3 + k / 4) % 1; ellipse(c, CX + pousse + Math.sin(k * 2) * s * 0.3 * p, ry - p * s * 0.6, 4 + p * 8, 3 + p * 6); c.fill(); }
    // œufs et fruit décoratifs
    dessinerOeuf({ x: -0.62, y: 0.42, r: 0.055, vacille: 0 });
    dessinerOeuf({ x: -0.52, y: 0.5, r: 0.05, vacille: 0 });
    const sv = fruit; fruit = { x: 0.6, y: 0.4, z: 0, pose: true, t: 0 }; dessinerFruit(); fruit = sv;
    dessinerBord('colline', true, tGlobal);
    dessinerPtero((tGlobal * 0.12) % 1, 1, CY - RP * SY - 20, true);
    rayon = svR; boue = svB; geysers = svG; RP = svRP; CY = svCY;
  }

  // ===========================================================================
  // Boucle principale
  // ===========================================================================
  let dernier = 0;
  function boucle(ms) {
    const dtBrut = Math.min(0.05, (ms - dernier) / 1000 || 0);
    dernier = ms;
    if (!enPause) {
      tGlobal += dtBrut;
      mettreAJour(dtBrut);
    }
    dessinerScene();
    requestAnimationFrame(boucle);
  }

  function mettreAJour(dt) {
    secousse *= Math.exp(-8 * dt);
    if (banniere) banniere.t += dt;
    if (etat === 'tuto') {
      tTuto += dt; majParticules(dt);
      // Démonstration du geste par ton dinosaure
      const etape = tutoEtapes[tutoI], cyc = (tTuto % 2.2) / 2.2;
      joueur.saut = (etape === 'esquive' || etape === 'esquive2') && cyc < 0.45 ? { t: cyc / 0.45 * DUREE_SAUT } : null;
      joueur.ancre = etape === 'ancre' || etape === 'endurance';
      joueur.endurance = joueur.ancre ? 1 - cyc * 0.8 : 1;
      joueur.phase += dt * 3;
      return;
    }
    if (etat === 'pret') {
      tEtat += dt;
      if (tEtat > 0.75 && banniere && banniere.cle === 'combat.prets') { banniere = { cle: 'combat.go', t: 0, couleur: '#ffd54a' }; SON.go(); }
      if (tEtat > 1.25) { etat = 'combat'; banniere = null; }
      majParticules(dt);
      // les dinosaures se regardent
      for (const d of dinos) { const o = plusProche(d, 'adv'); if (o) regarder(d, o.x - d.x, o.y - d.y); d.phase += dt * 2; }
      return;
    }
    if (etat === 'combat' || etat === 'finManche') {
      if (etat === 'combat') {
        tCombat += dt;
        entreesJoueur(dt);
        for (const d of dinos) if (d !== joueur) majIA(d, dt);
      } else {
        for (const d of dinos) { d.marcheX = d.marcheY = 0; d.veutAncre = false; }
      }
      // deux pas de physique pour des chocs plus précis
      majTerrain(dt);
      majPhysique(dt / 2); majPhysique(dt / 2);
      for (const e of oeufs) e.vacille = Math.max(0, e.vacille - dt);
      majParticules(dt);
      if (etat === 'finManche') {
        tEtat += dt;
        if (tEtat > 1.7) {
          banniere = null;
          if (coeurs <= 0) finNiveau(false);
          else if (poussees >= L.objectif) finNiveau(true);
          else commencerManche();
        }
      }
      return;
    }
    majParticules(dt);
  }

  // ===========================================================================
  // Commandes du joueur
  // ===========================================================================
  const touches = {};
  let ptr = null;

  function entreesJoueur(dt) {
    if (!joueur || joueur.chute) return;
    // Clavier : marche
    let mx = 0, my = 0;
    if (touches.ArrowLeft || touches.KeyA) mx -= 1;
    if (touches.ArrowRight || touches.KeyD) mx += 1;
    if (touches.ArrowUp || touches.KeyW) my -= 1;
    if (touches.ArrowDown || touches.KeyS) my += 1;
    const n = long(mx, my);
    joueur.marcheX = n ? mx / n : 0; joueur.marcheY = n ? my / n : 0;
    if (n) { joueur.visX = mx / n; joueur.visY = my / n; if (Math.abs(joueur.visX) > 0.2) joueur.face = Math.sign(joueur.visX); }
    // Appui long → ancrage
    if (ptr && !ptr.fait && !ptr.ancre && performance.now() - ptr.t0 > 260 && long(ptr.x - ptr.x0, ptr.y - ptr.y0) < 16) ptr.ancre = true;
    joueur.veutAncre = !!(touches.KeyC || (ptr && ptr.ancre));
    // Regarder l'adversaire le plus proche quand on ne bouge pas
    if (!n && joueur.poussee <= 0) {
      const o = plusProche(joueur, 'adv');
      if (o && Math.abs(o.x - joueur.x) > 0.05) joueur.face = Math.sign(o.x - joueur.x);
    }
  }

  function chargeClavier() {
    if (etat !== 'combat') return;
    let dx = 0, dy = 0;
    if (joueur.marcheX || joueur.marcheY) { dx = joueur.marcheX; dy = joueur.marcheY; }
    else { const o = plusProche(joueur, 'adv'); if (o) { dx = o.x - joueur.x; dy = o.y - joueur.y; } else { dx = joueur.face; } }
    charger(joueur, dx, dy, 1);
  }

  function versMonde(dxPx, dyPx) { return { x: dxPx / RP, y: dyPx / (RP * SY) }; }

  cv.addEventListener('pointerdown', (e) => {
    audio();
    if (enPause) return;
    if (etat === 'tuto') { e.preventDefault(); tutoSuivant(); return; }
    if (etat !== 'combat' && etat !== 'pret' && etat !== 'finManche') return;
    if (ptr) return;
    ptr = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, t0: performance.now(), ancre: false, fait: false };
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
    e.preventDefault();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!ptr || e.pointerId !== ptr.id) return;
    ptr.x = e.clientX; ptr.y = e.clientY;
    const dx = ptr.x - ptr.x0, dy = ptr.y - ptr.y0, l = long(dx, dy);
    if (!ptr.fait && !ptr.ancre && l > 40 && etat === 'combat') {
      const v = versMonde(dx, dy);
      chargeJoueurVers(v.x, v.y, borne(l / 110, 0.5, 1));
      ptr.fait = true;
    }
  });
  function finPointeur(e) {
    if (!ptr || e.pointerId !== ptr.id) return;
    const dx = ptr.x - ptr.x0, dy = ptr.y - ptr.y0, l = long(dx, dy);
    if (!ptr.fait && !ptr.ancre && etat === 'combat') {
      if (l > 16) { const v = versMonde(dx, dy); chargeJoueurVers(v.x, v.y, borne(l / 110, 0.45, 1)); }
      else if (performance.now() - ptr.t0 < 320) bondJoueur();
    }
    ptr = null;
  }
  cv.addEventListener('pointerup', finPointeur);
  cv.addEventListener('pointercancel', finPointeur);
  cv.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (['tuto', 'pret', 'combat', 'finManche'].includes(etat)) { e.preventDefault(); if (enPause) reprendre(); else mettrePause(); }
      return;
    }
    if (enPause) return;
    if (etat === 'tuto' && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); audio(); tutoSuivant(); return; }
    if (!['combat', 'pret', 'finManche'].includes(etat)) return;
    if (e.code.startsWith('Arrow') || e.code === 'Space' || e.code === 'Enter') e.preventDefault();
    audio();
    if (!touches[e.code]) {
      if (e.code === 'Space' || e.code === 'Enter') chargeClavier();
      if ((e.code === 'KeyX' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') && etat === 'combat') bondJoueur();
    }
    touches[e.code] = true;
  });
  window.addEventListener('keyup', (e) => { touches[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in touches) touches[k] = false; ptr = null; });

  // ===========================================================================
  // Interface : écrans
  // ===========================================================================
  const ECRANS = ['ecran-titre', 'ecran-niveaux', 'ecran-collection', 'ecran-pause', 'ecran-fin'];
  function cacherTout() { ECRANS.forEach((id) => { $(id).hidden = true; }); $('tuto').hidden = true; $('hud').hidden = true; }
  function montrer(id) { cacherTout(); $(id).hidden = false; }

  const SVG_ETOILE = (on) => '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z" fill="' + (on ? '#ffc93c' : '#d9cbb0') + '" stroke="#6b3f1d" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  const SVG_COEUR = (on) => '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.3-9.2C1.4 8.5 3.6 5 7 5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 5.6 3.5 4.3 6.8C19.5 16.4 12 21 12 21z" fill="' + (on ? '#ff6b6b' : '#d9cbb0') + '" stroke="#6b3f1d" stroke-width="1.6"/></svg>';
  const SVG_POINT = (on) => '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="' + (on ? '#9be07a' : '#fff3d6') + '" stroke="#6b3f1d" stroke-width="2.4"/></svg>';
  const SVG_CADENAS = '<svg class="cadenas" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="#8a7a62"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#8a7a62" stroke-width="2.5" fill="none"/></svg>';
  const SVG_COQUILLE = (coul, on) => '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 42 L6 20 Q24 0 42 20 Z" fill="' + (on ? coul : '#cfc2a8') + '" stroke="#6b3f1d" stroke-width="2.4" stroke-linejoin="round"/>' +
    [-12, -6, 0, 6, 12].map((x) => '<path d="M24 41 L' + (24 + x) + ' 11" stroke="' + (on ? 'rgba(255,255,255,.75)' : '#b8ab92') + '" stroke-width="1.8"/>').join('') +
    '<rect x="17" y="40" width="14" height="5" rx="2" fill="' + (on ? '#c98a3a' : '#b8ab92') + '" stroke="#6b3f1d" stroke-width="1.6"/></svg>';

  function majHud() {
    $('hud-nom').textContent = t('hud.niveau', { n: iNiv + 1, nom: t('niveau.nom.' + (iNiv + 1)) });
    $('hud-coeurs').innerHTML = [0, 1, 2].map((k) => SVG_COEUR(k < coeurs)).join('');
    $('hud-coeurs').setAttribute('aria-label', t('hud.coeurs', { n: coeurs }));
    let p = '';
    for (let k = 0; k < L.objectif; k++) p += SVG_POINT(k < poussees);
    $('hud-poussees').innerHTML = p;
    $('hud-poussees').setAttribute('aria-label', t('hud.poussees', { n: poussees, max: L.objectif }));
    $('hud-coeurs').setAttribute('role', 'img'); $('hud-poussees').setAttribute('role', 'img');
  }

  function allerTitre() {
    partieEnCours = false;
    enPause = false;
    etat = 'titre';
    montrer('ecran-titre');
    $('titre-etoiles').textContent = t('titre.etoiles', { n: totalEtoiles(), max: NB * 3 });
    majBoutonsSon();
  }

  function ouvrirNiveaux() {
    etat = 'menu';
    const g = $('grille-niveaux');
    g.innerHTML = '';
    ['colline', 'volcan', 'plage', 'glacier'].forEach((ter, k) => {
      const lig = document.createElement('div');
      lig.className = 'terrain-ligne';
      lig.innerHTML = '<i style="background:' + COULEUR_TERRAIN[ter] + '"></i>';
      const span = document.createElement('span'); span.textContent = t('terrain.' + ter); lig.appendChild(span);
      g.appendChild(lig);
      const grille = document.createElement('div'); grille.className = 'grille';
      for (let i = k * 5; i < k * 5 + 5; i++) {
        const b = document.createElement('button');
        const ouvert = i < progres.debloque;
        b.className = 'case' + (NIVEAUX[i].champion ? ' champion' : '') + (ouvert ? '' : ' ferme');
        if (ouvert) {
          b.innerHTML = '<span>' + nombre(i + 1) + '</span><span class="mini">' + [0, 1, 2].map((s) => SVG_ETOILE(s < progres.etoiles[i])).join('') + '</span>';
          b.setAttribute('aria-label', t('niveaux.case', { n: i + 1, nom: t('niveau.nom.' + (i + 1)), etoiles: progres.etoiles[i] }));
          b.addEventListener('click', () => { audio(); SON.clic(); demarrerNiveau(i, true); });
        } else {
          b.innerHTML = SVG_CADENAS;
          b.setAttribute('aria-label', t('niveaux.ferme', { n: i + 1 }));
          b.disabled = true;
        }
        grille.appendChild(b);
      }
      g.appendChild(grille);
    });
    $('niveaux-total').textContent = t('titre.etoiles', { n: totalEtoiles(), max: NB * 3 });
    montrer('ecran-niveaux');
  }

  function miniDino(esp, accent, verrou) {
    const c = document.createElement('canvas');
    c.width = 152; c.height = 112;
    const x = c.getContext('2d');
    x.translate(82, 98); x.scale(42, 42);
    if (verrou) x.globalAlpha = 0.35;
    dessinerDino(x, esp, verrou ? '#9a8f7a' : null, verrou ? '#8a806c' : accent, { yeux: verrou ? 'ferme' : 'content' });
    return c;
  }

  function ouvrirCollection() {
    etat = 'menu';
    const total = totalEtoiles();
    const dz = $('col-dinos'); dz.innerHTML = '';
    JOUABLES.forEach((j) => {
      const ok = j.niveau === 0 || progres.etoiles[j.niveau - 1] > 0;
      const b = document.createElement('button');
      b.className = 'col-item' + (ok ? '' : ' ferme') + (progres.espece === j.id ? ' choisi' : '');
      b.appendChild(miniDino(j.id, COLLERETTES[progres.collerette].c, !ok));
      const s = document.createElement('span');
      s.textContent = ok ? t('espece.' + j.id) : t('collection.champion', { n: j.niveau });
      b.appendChild(s);
      b.setAttribute('aria-pressed', progres.espece === j.id ? 'true' : 'false');
      if (ok) b.addEventListener('click', () => { progres.espece = j.id; garderOptions(); SON.clic(); ouvrirCollection(); });
      else b.disabled = true;
      dz.appendChild(b);
    });
    const cz = $('col-collerettes'); cz.innerHTML = '';
    COLLERETTES.forEach((co, k) => {
      const ok = total >= co.e;
      const b = document.createElement('button');
      b.className = 'col-item' + (ok ? '' : ' ferme') + (progres.collerette === k ? ' choisi' : '');
      b.innerHTML = '<span class="pastille" style="background:' + (ok ? co.c : '#cfc2a8') + '"></span>';
      const s = document.createElement('span');
      s.textContent = ok ? t('collerette.' + k) : t('collection.etoiles', { n: co.e });
      b.appendChild(s);
      b.setAttribute('aria-pressed', progres.collerette === k ? 'true' : 'false');
      if (ok) b.addEventListener('click', () => { progres.collerette = k; garderOptions(); SON.clic(); ouvrirCollection(); });
      else b.disabled = true;
      cz.appendChild(b);
    });
    const tz = $('col-trophees'); tz.innerHTML = '';
    TROPHEES.forEach((tr) => {
      const ok = progres.trophees.includes(tr.id);
      const d = document.createElement('div');
      d.className = 'col-item trophee' + (ok ? '' : ' ferme');
      d.innerHTML = SVG_COQUILLE(tr.c, ok);
      const s = document.createElement('span'); s.textContent = t('trophee.' + tr.id); d.appendChild(s);
      tz.appendChild(d);
    });
    $('col-aide').textContent = t('collection.aide', { n: progres.trophees.length, max: TROPHEES.length });
    montrer('ecran-collection');
  }

  const TROPHEES = [
    { id: 'champColline', c: '#9be07a' }, { id: 'champVolcan', c: '#ff8c5a' }, { id: 'champPlage', c: '#5bc0eb' }, { id: 'champGlacier', c: '#c9ecff' },
    { id: 'parfaitColline', c: '#ffd54a' }, { id: 'parfaitVolcan', c: '#ffd54a' }, { id: 'parfaitPlage', c: '#ffd54a' }, { id: 'parfaitGlacier', c: '#ffd54a' },
  ];

  // --- Tutoriel ---------------------------------------------------------------
  function afficherTuto() {
    const etape = tutoEtapes[tutoI];
    $('tuto').hidden = false;
    $('tuto-texte').textContent = t('tuto.' + etape);
    $('tuto-points').innerHTML = tutoEtapes.map((_, k) => '<i class="' + (k === tutoI ? 'on' : '') + '"></i>').join('');
    $('tuto-points').hidden = tutoEtapes.length < 2;
    $('b-tuto-suivant').textContent = tutoI < tutoEtapes.length - 1 ? t('tuto.suivant') : t('bouton.cestparti');
    $('b-tuto-passer').hidden = tutoI >= tutoEtapes.length - 1;
    tTuto = 0;
  }
  function tutoSuivant() {
    SON.clic();
    tutoI++;
    if (tutoI >= tutoEtapes.length) { $('tuto').hidden = true; commencerManche(); }
    else afficherTuto();
  }

  // --- Pause ------------------------------------------------------------------
  function mettrePause() {
    if (enPause || !['tuto', 'pret', 'combat', 'finManche'].includes(etat)) return;
    enPause = true;
    for (const k in touches) touches[k] = false;
    ptr = null;
    if (ac) { try { ac.suspend(); } catch (e) { /* rien */ } }
    $('ecran-pause').hidden = false;
    majBoutonsSon();
  }
  function reprendre() {
    enPause = false;
    $('ecran-pause').hidden = true;
    if (ac) { try { ac.resume(); } catch (e) { /* rien */ } }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') mettrePause(); });

  // --- Fin d'un combat ----------------------------------------------------------
  function finNiveau(victoire) {
    etat = 'fin';
    partieEnCours = false;
    const score = sortisAdv * 100 + fruitsPris * 25 + (victoire ? coeurs * 150 : 0);
    const etoiles = victoire ? Math.max(1, 3 - chutes) : 0;
    const ancienRecord = progres.records[iNiv];
    const record = score > ancienRecord;
    const deblocages = [];
    if (victoire) {
      const avant = totalEtoiles();
      progres.etoiles[iNiv] = Math.max(progres.etoiles[iNiv], etoiles);
      if (record) progres.records[iNiv] = score;
      progres.debloque = Math.max(progres.debloque, Math.min(NB, iNiv + 2));
      const apres = totalEtoiles();
      // Déblocages : champion, collerettes, trophées
      const champ = DEBLOQUE_PAR[iNiv + 1];
      const ter = ['Colline', 'Volcan', 'Plage', 'Glacier'][Math.floor(iNiv / 5)];
      if (champ && !progres.trophees.includes('champ' + ter)) {
        progres.trophees.push('champ' + ter);
        deblocages.push(t('deblocage.dino', { nom: t('espece.' + champ) }));
        deblocages.push(t('deblocage.trophee', { nom: t('trophee.champ' + ter) }));
      }
      const debut = Math.floor(iNiv / 5) * 5;
      if (!progres.trophees.includes('parfait' + ter) && progres.etoiles.slice(debut, debut + 5).every((e) => e === 3)) {
        progres.trophees.push('parfait' + ter);
        deblocages.push(t('deblocage.trophee', { nom: t('trophee.parfait' + ter) }));
      }
      COLLERETTES.forEach((co, k) => { if (avant < co.e && apres >= co.e) deblocages.push(t('deblocage.collerette', { nom: t('collerette.' + k) })); });
      try { JEL_SAVE.save(JEU, { niveau: Math.min(NB, iNiv + 2), score: progres.records.reduce((a, b) => a + b, 0), options: options() }); } catch (e) { /* pas de sauvegarde */ }
      try { localStorage.setItem('tdt-progres', JSON.stringify(progres)); } catch (e) { /* pas de stockage */ }
      SON.victoire();
      for (let k = 0; k < 80; k++) confetti(W / 2 + hasard(-60, 60), H * 0.3);
    } else {
      SON.defaite();
    }
    // Écran de fin
    setTimeout(() => {
      $('hud').hidden = true;
      $('ecran-fin').hidden = false;
      $('fin-titre').textContent = victoire ? t('fin.victoire') : t('fin.defaite');
      $('fin-sous').textContent = victoire ? (iNiv === NB - 1 ? t('fin.tournoi') : (chutes ? t('fin.bravo', { n: chutes }) : t('fin.parfait'))): t('fin.conseil.' + (iNiv % 4));
      const ze = $('fin-etoiles');
      ze.innerHTML = [0, 1, 2].map((k) => SVG_ETOILE(k < etoiles)).join('');
      ze.setAttribute('role', 'img'); ze.setAttribute('aria-label', t('fin.etoiles', { n: etoiles }));
      [...ze.children].forEach((sv, k) => {
        setTimeout(() => { sv.classList.add(k < etoiles ? 'allumee' : 'eteinte'); if (k < etoiles) SON.etoile(k); }, 300 + k * 320);
      });
      // Score qui défile
      const zs = $('fin-score');
      const t0 = performance.now();
      const defile = (now) => {
        const p = Math.min(1, (now - t0) / 900);
        zs.textContent = t('fin.score', { n: Math.round(score * p) });
        if (p < 1) requestAnimationFrame(defile);
      };
      requestAnimationFrame(defile);
      const zr = $('fin-record');
      zr.className = 'record' + (record && victoire ? ' battu' : '');
      zr.textContent = record && victoire ? t('fin.recordBattu') : t('fin.record', { n: Math.max(ancienRecord, victoire ? progres.records[iNiv] : 0) });
      $('fin-deblocages').innerHTML = '';
      deblocages.forEach((txt) => { const d = document.createElement('div'); d.textContent = txt; $('fin-deblocages').appendChild(d); });
      $('b-suivant').hidden = !victoire || iNiv >= NB - 1;
      $('b-reessayer').hidden = victoire;
      $('b-rejouer').hidden = !victoire;
      $('b-fin-accueil').hidden = victoire && iNiv < NB - 1;
      ($('b-suivant').hidden ? ($('b-reessayer').hidden ? $('b-rejouer') : $('b-reessayer')) : $('b-suivant')).focus({ preventScroll: true });
    }, victoire ? 700 : 500);
  }

  // --- Boutons ------------------------------------------------------------------
  function clic(id, f) { $(id).addEventListener('click', () => { audio(); SON.clic(); f(); }); }

  clic('b-jouer', () => {
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => {
        const n = borne(Math.floor(Number(d && d.niveau) || 1), 1, NB);
        progres.debloque = Math.max(progres.debloque, n);
        demarrerNiveau(n - 1, true);
      },
      onNouvelle: () => demarrerNiveau(0, true),
      onEffacer: () => { progres = progresNeuf(); try { localStorage.removeItem('tdt-progres'); } catch (e) { /* rien */ } demarrerNiveau(0, true); },
    });
  });
  clic('b-niveaux', ouvrirNiveaux);
  clic('b-collection', ouvrirCollection);
  clic('b-niveaux-retour', allerTitre);
  clic('b-col-retour', allerTitre);
  document.querySelectorAll('.son').forEach((b) => b.addEventListener('click', basculerSon));
  clic('b-pause', mettrePause);
  clic('b-reprendre', reprendre);
  clic('b-recommencer', () => { reprendre(); demarrerNiveau(iNiv, false); });
  clic('b-pause-accueil', () => { reprendre(); allerTitre(); });
  clic('b-tuto-suivant', tutoSuivant);
  clic('b-tuto-passer', () => { $('tuto').hidden = true; commencerManche(); });
  clic('b-suivant', () => demarrerNiveau(iNiv + 1, true));
  clic('b-reessayer', () => demarrerNiveau(iNiv, false));
  clic('b-rejouer', () => demarrerNiveau(iNiv, false));
  clic('b-fin-niveaux', ouvrirNiveaux);
  clic('b-fin-accueil', allerTitre);

  // Sauvegarde à la fermeture de la page, seulement pendant un combat.
  JEL_SAVE.surFermeture(() => {
    if (partieEnCours) JEL_SAVE.save(JEU, { niveau: iNiv + 1, score: sortisAdv * 100, options: options() });
  });

  // Changement de langue : textes refaits par le module, on remet nos textes calculés.
  if (window.JEL_I18N.surChangement) window.JEL_I18N.surChangement(() => { majBoutonsSon(); if (etat === 'titre') allerTitre(); });

  // --- Démarrage ----------------------------------------------------------------
  chargerProgres();
  redim();
  allerTitre();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
