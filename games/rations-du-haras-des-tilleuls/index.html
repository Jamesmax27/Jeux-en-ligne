  }

  function majBalance(m) {
    const ecart = m.cible - m.somme;  // > 0 : la gauche est plus lourde
    const angle = Math.max(-12, Math.min(12, -ecart / m.cible * 16));
    m.zone.style.setProperty('--angle', angle + 'deg');
    m.zone.style.setProperty('--dg', (-angle * 2.2) + 'px');
    m.zone.style.setProperty('--dd', (angle * 2.2) + 'px');
  }

  function majMangeoire(m) {
    const d = m.el;
    d.querySelectorAll('.chip').forEach((c) => c.remove());
    ORDRE_ALIMENTS.forEach((a) => {
      const n = m.contenu[a] || 0;
      if (!n) return;
      const c = document.createElement('span');
      c.className = 'chip';
      c.dataset.alim = a;
      c.innerHTML = svgAliment(a) + (n > 1 ? '<span>×' + nb(n) + '</span>' : '');
      d.insertBefore(c, m.sommeEl);
    });
    m.sommeEl.textContent = nb(m.somme);
    d.classList.toggle('ok', m.ok);
    let label;
    if (m.kind === 'box') label = t('aria.box', { nom: m.nom, s: m.somme, c: m.cible });
    else if (m.kind === 'course') label = t('aria.cache', { nom: m.nom, s: m.somme });
    else if (m.kind === 'poulain') label = t('aria.poulain', { nom: m.nom, s: m.somme });
    else label = t('aria.balance', { s: m.somme });
    d.setAttribute('aria-label', label);
    if (m.kind === 'balance') majBalance(m);
  }

  function construireReserve() {
    const r = $('#reserve');
    r.innerHTML = '';
    const noms = J.def.alim.slice();
    if ('sac' in J.stock) noms.push('sac');
    noms.forEach((a, idx) => {
      const b = el('button', 'aliment' + (a === 'sac' ? ' sac' : ''), r);
      b.type = 'button';
      b.dataset.alim = a;
      b.dataset.touche = String(idx + 1);
      b.innerHTML = svgAliment(a) + '<span class="valeur">' + nb(ALIMENTS[a]) + '</span><span class="stock"></span>';
      b.addEventListener('pointerdown', (e) => debutGlisse(e, a, b));
      b.addEventListener('click', () => {
        if (ignorerClic) return;
        if (!jeuActif()) return;
        choisir(selection === a ? null : a);
      });
    });
    majReserve();
  }

  function majReserve() {
    $$('#reserve .aliment').forEach((b) => {
      const a = b.dataset.alim;
      const n = J.stock[a];
      const fini = n !== Infinity && n <= 0;
      b.classList.toggle('choisi', selection === a);
      b.classList.toggle('epuise', fini);
      b.setAttribute('aria-pressed', selection === a ? 'true' : 'false');
      b.querySelector('.stock').textContent = n === Infinity ? '' : t('stock.court', { n });
      b.setAttribute('aria-label', t('aria.aliment', { nom: t('alim.' + a), v: ALIMENTS[a], stock: n === Infinity ? t('stock.infini') : t('stock.reste', { n }) }));
    });
  }

  function choisir(a) {
    selection = a;
    if (a) son('prise');
    majReserve();
  }

  function majBarre() {
    if (!J) return;
    $('#txt-niveau').textContent = t('niveau', { n: J.i + 1 });
    $('#txt-rangee').textContent = t('rangee', { a: J.rang + 1, b: J.def.rangs.length });
    const fers = $('#fers');
    fers.innerHTML = Array.from({ length: FERS }, (_, k) => svgFer(k < J.fers)).join('');
    fers.setAttribute('aria-label', t('aria.fers', { n: J.fers }));
    const ch = $('#chrono');
    ch.classList.toggle('cache', !J.def.chrono);
    if (J.def.chrono) majChrono();
  }
  function majChrono() {
    const s = Math.max(0, Math.ceil(J.temps));
    $('#txt-chrono').textContent = t('chrono', { n: s });
    $('#jauge').style.width = (100 * Math.max(0, J.temps) / J.def.chrono) + '%';
    $('#chrono').classList.toggle('urgent', J.temps <= 15);
    $('#chrono').setAttribute('aria-label', t('aria.chrono', { n: s }));
  }

  // Bulle de message
  let minuterieBulle = 0;
  function bulle(texte) {
    const b = $('#bulle');
    b.textContent = texte;
    b.classList.add('visible');
    clearTimeout(minuterieBulle);
    minuterieBulle = setTimeout(() => b.classList.remove('visible'), 2200);
  }

  // Dépose un aliment dans une mangeoire.
  function deposer(a, m) {
    if (!jeuActif()) return;
    if (!a) { bulle(t('msg.choisir')); son('non'); return; }
    if (a === 'sac' && m.kind !== 'poulain') { bulle(t('msg.pasSac')); son('non'); return; }
    if (a !== 'sac' && m.kind === 'poulain') { bulle(t('msg.sacSeul')); son('non'); return; }
    if (!(a in J.stock) || J.stock[a] <= 0) { bulle(t('msg.vide', { nom: t('alim.' + a) })); son('non'); return; }
    const v = ALIMENTS[a];
    if (m.somme + v > m.cible) { refuser(m); return; }
    m.contenu[a] = (m.contenu[a] || 0) + 1;
    m.somme += v;
    J.stock[a]--;
    J.servi += v;
    son('pose');
    cacherGuide();
    majMangeoire(m);
    const chip = m.el.querySelector('.chip[data-alim="' + a + '"]');
    if (chip) chip.classList.add('pop');
    if (J.stock[a] <= 0 && selection === a) selection = null;
    majReserve();
    if (m.somme === m.cible) reussir(m);
    verifierRangee();
  }

  function refuser(m) {
    J.fers--;
    J.depass++;
    son('refus');
    const cible = m.carte;
    cible.classList.remove('refus'); void cible.offsetWidth; cible.classList.add('refus');
    setTimeout(() => cible.classList.remove('refus'), 500);
    bulle(m.kind === 'poulain' ? t('msg.tropPoulain') : m.kind === 'balance' ? t('msg.tropBalance') : t('msg.trop', { nom: m.nom }));
    if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) { /* rien */ } }
    majBarre();
    if (J.fers <= 0) { J.transition = true; plusTard(J, 500, () => finNiveau(false, 'fers')); }
  }

  function retirer(m, a) {
    if (!jeuActif() || !(m.contenu[a] > 0)) return;
    m.contenu[a]--;
    m.somme -= ALIMENTS[a];
    J.stock[a]++;
    J.servi -= ALIMENTS[a];
    J.retouches++;
    if (m.ok) {
      m.ok = false;
      if (m.kind === 'poulain') { m.carte.classList.remove('content'); m.ardoise.textContent = '?'; }
      else m.carte.classList.remove('contente');
      if (m.kind === 'course') { const r = m.ardoise.querySelector('.revele'); if (r) r.remove(); }
    }
    son('retouche');
    bulle(t('msg.retouche'));
    majMangeoire(m);
    majReserve();
  }

  function coeurs(cadre, n) {
    const r = cadre.getBoundingClientRect();
    const base = $('#ecran-jeu').getBoundingClientRect();
    for (let k = 0; k < n; k++) {
      const c = el('div', 'coeur', $('#ecran-jeu'));
      c.innerHTML = svgCoeur();
      c.style.left = (r.left - base.left + r.width * (0.2 + 0.6 * Math.random())) + 'px';
      c.style.top = (r.top - base.top + r.height * 0.35) + 'px';
      c.style.animationDelay = (k * 0.12) + 's';
      setTimeout(() => c.remove(), 1500);
    }
  }

  function reussir(m) {
    m.ok = true;
    majMangeoire(m);
    if (m.kind === 'poulain') {
      m.carte.classList.add('content');
      m.ardoise.textContent = nb(m.cible);
      coeurs(m.carte, 2);
      if (m.groupe.membres.every((x) => x.ok)) { son('juste'); hennissement(); bulle(t('msg.parts')); coeurs(m.groupe.carte, 4); }
      else son('juste');
      return;
    }
    m.carte.classList.add('contente');
    coeurs(m.carte, 4);
    son('juste');
    if (m.kind === 'balance') { bulle(t('msg.equilibre')); return; }
    hennissement();
    if (m.kind === 'course') { const r = el('span', 'revele', m.ardoise); r.textContent = '= ' + nb(m.cible); }
    bulle(t('msg.juste', { nom: m.nom }));
  }

  function verifierRangee() {
    if (!J.mangeoires.every((m) => m.ok)) return;
    J.transition = true;
    const jeu = J;
    const derniere = J.rang + 1 >= J.def.rangs.length;
    plusTard(jeu, 900, () => {
      if (derniere) { J.transition = false; finNiveau(true); return; }
      son('rangee');
      bulle(t('msg.rangee'));
      $$('#ecurie .carte').forEach((c) => c.classList.add('depart'));
      plusTard(jeu, 450, () => {
        J.rang++;
        construireRangee(true);
        J.transition = false;
      });
    });
  }

  // Attente qui s'arrête si le niveau change et qui patiente pendant la pause.
  function plusTard(jeu, ms, f) {
    const tic = () => {
      if (J !== jeu || !jeu.enCours) return;
      if (enPause) { setTimeout(tic, 200); return; }
      f();
    };
    setTimeout(tic, ms);
  }

  // ------------------------------------------------------------------------
  // Glisser-déposer (doigt et souris), choix au toucher, clavier
  // ------------------------------------------------------------------------
  let glisse = null, ignorerClic = false, survol = null;
  function debutGlisse(e, a, bouton) {
    if (!jeuActif()) return;
    if (e.button !== undefined && e.button !== 0) return;
    glisse = { a, x0: e.clientX, y0: e.clientY, bouge: false, id: e.pointerId, bouton };
  }
  function mangeoireSous(x, y) {
    const cible = document.elementFromPoint(x, y);
    const d = cible && cible.closest ? cible.closest('.mangeoire') : null;
    return d && d._m ? d._m : null;
  }
  document.addEventListener('pointermove', (e) => {
    if (!glisse || e.pointerId !== glisse.id) return;
    const dx = e.clientX - glisse.x0, dy = e.clientY - glisse.y0;
    if (!glisse.bouge && dx * dx + dy * dy > 64) {
      glisse.bouge = true;
      const f = $('#fantome');
      f.innerHTML = svgAliment(glisse.a);
      f.style.display = 'block';
      son('prise');
    }
    if (glisse.bouge) {
      const f = $('#fantome');
      f.style.left = e.clientX + 'px';
      f.style.top = e.clientY + 'px';
      const m = mangeoireSous(e.clientX, e.clientY);
      if (survol && survol !== m) survol.el.classList.remove('survol');
      survol = m;
      if (m) m.el.classList.add('survol');
    }
  });
  function finGlisse(e, annule) {
    if (!glisse || e.pointerId !== glisse.id) return;
    const g = glisse;
    glisse = null;
    $('#fantome').style.display = 'none';
    if (survol) { survol.el.classList.remove('survol'); survol = null; }
    if (!g.bouge) return;
    ignorerClic = true;
    setTimeout(() => { ignorerClic = false; }, 60);
    if (annule) return;
    const m = mangeoireSous(e.clientX, e.clientY);
    if (m) { selection = g.a; majReserve(); deposer(g.a, m); }
  }
  document.addEventListener('pointerup', (e) => finGlisse(e, false));
  document.addEventListener('pointercancel', (e) => finGlisse(e, true));

  // Toucher une mangeoire : retirer l'aliment touché, sinon déposer l'aliment choisi.
  $('#ecurie').addEventListener('click', (e) => {
    if (ignorerClic || !jeuActif()) return;
    const d = e.target.closest('.mangeoire');
    if (!d || !d._m) return;
    const chip = e.target.closest('.chip');
    if (chip && chip.dataset.alim) { retirer(d._m, chip.dataset.alim); return; }
    deposer(selection, d._m);
  });

  function elementsNavigables() {
    return [...$$('#reserve .aliment'), ...J.mangeoires.map((m) => m.el)];
  }
  document.addEventListener('keydown', (e) => {
    const code = e.code;
    // Présentations : Entrée, Espace ou Échap pour passer
    if (coucheOuverte && !$('#couche-intro').classList.contains('cache')) {
      if (code === 'Enter' || code === 'Space' || code === 'Escape' || code === 'NumpadEnter') { e.preventDefault(); suivanteCouche(); }
      return;
    }
    if (!$('#couche-pause').classList.contains('cache')) {
      if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); reprendre(); }
      return;
    }
    if (!J || !J.enCours || !$('#ecran-jeu').classList.contains('actif')) return;
    if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); mettrePause(); return; }
    if (!jeuActif()) return;
    const actif = document.activeElement;
    const m = actif && actif._m ? actif._m : null;
    const chiffre = /^(Digit|Numpad)([1-9])$/.exec(code);
    if (chiffre) {
      const b = $('#reserve .aliment[data-touche="' + chiffre[2] + '"]');
      if (b) { e.preventDefault(); choisir(b.dataset.alim); }
      return;
    }
    if (m && (code === 'Enter' || code === 'Space' || code === 'NumpadEnter')) { e.preventDefault(); deposer(selection, m); return; }
    if (m && (code === 'Backspace' || code === 'Delete')) {
      e.preventDefault();
      const dernierA = ORDRE_ALIMENTS.slice().reverse().find((a) => m.contenu[a] > 0);
      if (dernierA) retirer(m, dernierA);
      return;
    }
    if (/^Arrow/.test(code)) {
      e.preventDefault();
      const liste = elementsNavigables();
      let i = liste.indexOf(actif);
      const nbRes = $$('#reserve .aliment').length;
      if (i < 0) { (liste.find((x) => x.dataset && x.dataset.alim === selection) || liste[0]).focus(); return; }
      if (code === 'ArrowRight') i = (i + 1) % liste.length;
      else if (code === 'ArrowLeft') i = (i - 1 + liste.length) % liste.length;
      else if (code === 'ArrowUp') i = i < nbRes ? nbRes : Math.max(nbRes, i - 2);
      else if (code === 'ArrowDown') i = i < nbRes ? i : (i + 2 < liste.length ? i + 2 : Math.max(0, $$('#reserve .aliment').findIndex((b) => b.dataset.alim === selection)));
      liste[i].focus();
    }
  });

  // ------------------------------------------------------------------------
  // Guide animé (niveau 1) : une main glisse un aliment vers une mangeoire
  // ------------------------------------------------------------------------
  function montrerGuide() {
    if (!J || !J.guide) return;
    const src = $('#reserve .aliment');
    const dst = J.mangeoires[0] && J.mangeoires[0].el;
    if (!src || !dst) return;
    const base = $('#ecran-jeu').getBoundingClientRect();
    const a = src.getBoundingClientRect(), b = dst.getBoundingClientRect();
    const g = $('#guide');
    g.innerHTML = SVG_MAIN;
    g.style.left = '0px'; g.style.top = '0px';
    g.style.setProperty('--x0', (a.left - base.left + a.width / 2 - 14) + 'px');
    g.style.setProperty('--y0', (a.top - base.top + a.height / 2 - 6) + 'px');
    g.style.setProperty('--x1', (b.left - base.left + b.width / 2 - 14) + 'px');
    g.style.setProperty('--y1', (b.top - base.top + b.height / 2 - 6) + 'px');
    g.style.display = 'block';
    bulle(t('msg.aide'));
  }
  function cacherGuide() { if (J) J.guide = false; const g = $('#guide'); if (g) g.style.display = 'none'; }

  // ------------------------------------------------------------------------
  // Présentations (saison, nouvelles mécaniques)
  // ------------------------------------------------------------------------
  const DEMOS = {
    base: { icone: 'carotte', ardoise: () => nb(3) },
    fers: { icone: 'foin', ardoise: () => nb(3), refus: true },
    rangees: { icone: 'seau', ardoise: () => nb(7) },
    foin: { icone: 'foin', ardoise: () => nb(12) },
    stock: { icone: 'seau', ardoise: () => nb(9) },
    sac: { icone: 'sac', ardoise: () => t('ardoise.parts'), poulain: true },
    dore: { icone: 'dore', ardoise: () => nb(8) },
    course: { icone: 'foin', ardoise: () => t('ardoise.hier', { n: 6 }) + ' ' + t('ardoise.plus', { n: 3 }) },
    balance: { icone: 'foin', ardoise: () => t('ardoise.balance') },
    pomme: { icone: 'pomme', ardoise: () => nb(9) },
    chrono: { icone: 'seau', ardoise: () => nb(15) },
    mash: { icone: 'mash', ardoise: () => nb(30) },
    double: { icone: 'mash', ardoise: () => t('ardoise.hier', { n: 8 }) + ' ' + t('ardoise.double') },
  };
  function montrerFile(file) {
    fileCouches = file.slice();
    if (!fileCouches.length) { fermerCouches(); apresCouches(); return; }
    suivanteCouche(true);
  }
  function suivanteCouche(premiere) {
    if (!premiere) son('clic');
    const item = fileCouches.shift();
    if (!item) { fermerCouches(); apresCouches(); return; }
    coucheOuverte = true;
    const boite = $('#boite-intro');
    boite.innerHTML = '';
    const h = el('h2', '', boite); h.id = 'titre-intro';
    if (item.saison !== undefined) {
      h.textContent = t('saison.' + item.saison);
      const d = el('div', 'banniere-saison', boite);
      d.innerHTML = svgRosette(COULEURS_SAISON[item.saison], false, false);
      el('p', '', boite).textContent = t('saison.texte.' + item.saison);
    } else if (item.rappelChrono) {
      h.textContent = t('intro.chrono.titre');
      el('p', '', boite).textContent = t('intro.chrono.texte');
    } else {
      const k = item.meca;
      const demo = DEMOS[k];
      h.textContent = t('intro.' + k + '.titre');
      const d = el('div', 'demo' + (demo.refus ? ' refus' : ''), boite);
      const cheval = el('div', 'd-cheval', d);
      cheval.innerHTML = svgCheval(ROBES[k.length % 3], couvertureActuelle(), !!demo.poulain);
      el('div', 'd-auge', d);
      const ard = el('div', 'ardoise', d); el('span', 'ligne', ard).textContent = demo.ardoise();
      el('div', 'd-somme', d).textContent = demo.refus ? '?' : '+' + nb(ALIMENTS[demo.icone]);
      const ic = el('div', 'd-icone', d); ic.innerHTML = svgAliment(demo.icone);
      const main = el('div', 'd-main', d); main.innerHTML = SVG_MAIN;
      el('p', '', boite).textContent = t('intro.' + k + '.texte');
    }
    const b = el('button', 'btn principal', boite);
    b.type = 'button';
    b.textContent = t('intro.passer');
    b.addEventListener('click', (e) => { e.stopPropagation(); suivanteCouche(); });
    $('#couche-intro').classList.remove('cache');
    try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }
  $('#couche-intro').addEventListener('click', () => suivanteCouche());
  function fermerCouches() {
    coucheOuverte = false;
    fileCouches = [];
    $('#couche-intro').classList.add('cache');
  }
  function apresCouches() {
    dernier = performance.now();
    if (J && J.guide) setTimeout(montrerGuide, 250);
    const premier = $('#reserve .aliment');
    if (J && premier && !J.guide) { try { premier.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  }

  // ------------------------------------------------------------------------
  // Sablier et boucle
  // ------------------------------------------------------------------------
  let dernierTic = -1;
  function demarrerBoucle() {
    arreterBoucle();
    dernier = performance.now();
    const pas = (now) => {
      boucle = requestAnimationFrame(pas);
      const dt = Math.min(0.25, (now - dernier) / 1000);
      dernier = now;
      if (!J || !J.def.chrono || !jeuActif()) return;
      J.temps -= dt;
      const s = Math.ceil(J.temps);
      if (s !== dernierTic) { dernierTic = s; if (s <= 10 && s > 0) son('tic'); majChrono(); }
      if (J.temps <= 0) { J.temps = 0; majChrono(); finNiveau(false, 'temps'); }
    };
    boucle = requestAnimationFrame(pas);
  }
  function arreterBoucle() { if (boucle) cancelAnimationFrame(boucle); boucle = 0; }

  // ------------------------------------------------------------------------
  // Pause
  // ------------------------------------------------------------------------
  function mettrePause() {
    if (!J || !J.enCours || enPause) return;
    enPause = true;
    if (glisse) { glisse = null; $('#fantome').style.display = 'none'; }
    document.body.classList.add('fige');
    $('#couche-pause').classList.remove('cache');
    if (actx && actx.state === 'running') { try { actx.suspend(); } catch (e) { /* rien */ } }
    try { $('#btn-reprendre').focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }
  function reprendre() {
    if (!enPause) return;
    enPause = false;
    document.body.classList.remove('fige');
    $('#couche-pause').classList.add('cache');
    dernier = performance.now();
    if (actx && actx.state === 'suspended' && sonActif) { try { actx.resume(); } catch (e) { /* rien */ } }
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });

  // ------------------------------------------------------------------------
  // Fin de niveau
  // ------------------------------------------------------------------------
  function confettis() {
    const c = $('#confettis');
    const couleurs = ['#e04a4a', '#f2c230', '#3b6fc8', '#4bbf73', '#ff8fb8', '#f08a00'];
    for (let k = 0; k < 44; k++) {
      const p = el('div', 'confetti', c);
      p.style.left = (Math.random() * 100) + '%';
      p.style.background = couleurs[k % couleurs.length];
      p.style.animationDelay = (Math.random() * 0.6) + 's';
      p.style.animationDuration = (1.4 + Math.random() * 1.1) + 's';
      setTimeout(() => p.remove(), 3200);
    }
  }

  function finNiveau(gagne, raison) {
    if (!J || !J.enCours) return;
    J.enCours = false;
    cacherGuide();
    arreterBoucle();
    const i = J.i;
    const boite = $('#boite-fin');
    boite.innerHTML = '';
    const h = el('h2', '', boite); h.id = 'titre-fin';
    const boutons = el('div', 'colonne');

    if (gagne) {
      const fautes = J.depass + J.retouches;
      const etoiles = fautes === 0 ? 3 : fautes <= 2 ? 2 : 1;
      const score = J.servi * 10 + J.fers * 40 + (J.def.chrono ? Math.ceil(J.temps) * 3 : 0) + (fautes === 0 ? 100 : 0);
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
      // Récompenses nouvelles (comparées avant / après)
      const robesAvant = ROBES.filter(robeOuverte).map((r) => r.id);
      const couvAvant = COUVERTURES.filter(couvertureOuverte).map((c) => c.id);
      const premiereFois = prog.etoiles[i] === 0;
      const ancienRecord = prog.records[i];
      const record = score > ancienRecord;
      prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
      prog.records[i] = Math.max(ancienRecord, score);
      prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2));
      try { window.JEL_SAVE.save(JEU, Object.assign({ niveau: Math.min(NIVEAUX.length, i + 2), score: scoreTotal() }, donneesProgression())); } catch (e) { /* rien */ }
      if (prog.etoiles.every((e) => e > 0)) {
        if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
      }
      const dernierNiveau = i === NIVEAUX.length - 1;
      h.textContent = dernierNiveau ? t('bilan.titre') : t('victoire.titre');
      const ge = el('div', 'grandes-etoiles', boite);
      ge.innerHTML = [0, 1, 2].map((k) => svgEtoile(k < etoiles)).join('');
      ge.setAttribute('role', 'img');
      ge.setAttribute('aria-label', t('etoiles', { n: etoiles }));
      const sc = el('div', 'score-fin', boite);
      sc.textContent = t('score', { n: 0 });
      el('p', 'record', boite).textContent = record ? t('record.nouveau') : t('record.ancien', { n: ancienRecord });
      el('p', 'petit', boite).textContent = fautes === 0 ? t('sansFaute') : t('fautes', { n: fautes });
      const rec = el('div', 'recompenses', boite);
      const ajouterRecompense = (svg, texte) => { const r = el('div', 'recompense', rec); r.innerHTML = svg; el('span', '', r).textContent = texte; };
      if (premiereFois) ajouterRecompense(svgRosette(COULEURS_SAISON[Math.floor(i / 5)], etoiles === 3, false), t('recompense.rosette', { n: i + 1 }));
      ROBES.filter((r) => robeOuverte(r) && !robesAvant.includes(r.id)).forEach((r) => ajouterRecompense(svgCheval(r, couvertureActuelle(), false), t('recompense.robe', { nom: t('robe.' + r.id) })));
      COUVERTURES.filter((c) => couvertureOuverte(c) && !couvAvant.includes(c.id)).forEach((c) => {
        const defs = []; const f = remplissageCouverture(c, defs);
        ajouterRecompense('<svg viewBox="0 0 64 44" aria-hidden="true"><defs>' + defs.join('') + '</defs><path d="M6 8h52l-4 30H10z" fill="' + f + '" stroke="#0004" stroke-width="2"/></svg>', t('recompense.couverture', { nom: t('couv.' + c.id) }));
      });
      if (dernierNiveau) {
        el('p', '', boite).textContent = t('bilan.texte', { e: totalEtoiles(), m: NIVEAUX.length * 3, r: prog.etoiles.filter((e) => e > 0).length });
      }
      boite.appendChild(boutons);
      if (!dernierNiveau) bouton(boutons, 'suivant', () => demarrerNiveau(i + 1), true);
      bouton(boutons, 'rejouer', () => demarrerNiveau(i), dernierNiveau);
      bouton(boutons, 'niveaux', afficherNiveaux);
      if (dernierNiveau) bouton(boutons, 'sellerie', afficherSellerie);
      // Animations : étoiles une à une, score qui défile, confettis
      son('victoire');
      confettis();
      const svgs = ge.querySelectorAll('svg');
      svgs.forEach((s, k) => {
        if (k >= etoiles) return;
        setTimeout(() => { s.classList.add('allumee'); son('etoile', k); envolerEtoile(s); }, 450 + k * 380);
      });
      const debut = performance.now();
      const defile = (now) => {
        const p = Math.min(1, (now - debut) / 1200);
        sc.textContent = t('score', { n: Math.round(score * p) });
        if (p < 1 && !$('#couche-fin').classList.contains('cache')) requestAnimationFrame(defile);
      };
      requestAnimationFrame(defile);
    } else {
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: i + 1 });
      h.textContent = raison === 'temps' ? t('defaite.temps') : t('defaite.fers');
      const ge = el('div', 'grandes-etoiles', boite);
      ge.innerHTML = svgEtoile(false) + svgEtoile(false) + svgEtoile(false);
      ge.setAttribute('aria-hidden', 'true');
      el('p', '', boite).textContent = t('defaite.texte');
      el('p', 'record', boite).textContent = t('record.ancien', { n: prog.records[i] });
      boite.appendChild(boutons);
      bouton(boutons, 'reessayer', () => demarrerNiveau(i), true);
      bouton(boutons, 'niveaux', afficherNiveaux);
      bouton(boutons, 'accueil', allerAccueil);
      son('defaite');
    }
    $('#couche-fin').classList.remove('cache');
    const premierBouton = boutons.querySelector('button');
    if (premierBouton) { try { premierBouton.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  }

  function envolerEtoile(source) {
    const r = source.getBoundingClientRect();
    for (let k = 0; k < 3; k++) {
      const e = el('div', 'etoile-vole', $('#app'));
      e.innerHTML = svgEtoile(true);
      e.style.left = (r.left + r.width / 2 - 17) + 'px';
      e.style.top = (r.top + r.height / 2 - 17) + 'px';
      e.style.setProperty('--vx', ((k - 1) * 70) + 'px');
      e.style.setProperty('--vy', (-60 - k * 15) + 'px');
      setTimeout(() => e.remove(), 1000);
    }
  }

  function bouton(parent, cle, action, principal) {
    const b = el('button', 'btn' + (principal ? ' principal' : ''), parent);
    b.type = 'button';
    b.textContent = t(cle);
    b.addEventListener('click', () => { son('clic'); $('#couche-fin').classList.add('cache'); action(); });
    return b;
  }

  // ------------------------------------------------------------------------
  // Boutons et démarrage
  // ------------------------------------------------------------------------
  function lancer() {
    son('clic');
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => {
        const n = Math.max(1, Math.min(NIVEAUX.length, Number(d && d.niveau) || 1));
        prog.debloque = Math.max(prog.debloque, n);
        demarrerNiveau(n - 1);
      },
      onNouvelle: () => demarrerNiveau(0),
      onEffacer: () => { chargerProgression(); demarrerNiveau(0); },
    });
  }

  // Sauvegarde à la fermeture de la page, seulement pendant une partie.
  window.JEL_SAVE.surFermeture(() => {
    if (J && J.enCours) window.JEL_SAVE.save(JEU, Object.assign({ niveau: J.i + 1, score: scoreTotal() }, donneesProgression()));
  });

  function init() {
    chargerProgression();
    dessinerTitre();
    $('#btn-pause').innerHTML = SVG_PAUSE;
    $$('.btn-retour').forEach((b) => { b.innerHTML = SVG_RETOUR; b.addEventListener('click', () => { son('clic'); montrer('ecran-titre'); }); });
    majBoutonsSon();
    $$('.bouton-son').forEach((b) => b.addEventListener('click', basculerSon));
    $('#btn-jouer').addEventListener('click', lancer);
    $('#btn-niveaux').addEventListener('click', () => { son('clic'); afficherNiveaux(); });
    $('#btn-sellerie').addEventListener('click', () => { son('clic'); afficherSellerie(); });
    $('#btn-pause').addEventListener('click', () => { son('clic'); mettrePause(); });
    $('#btn-reprendre').addEventListener('click', () => { son('clic'); reprendre(); });
    $('#btn-recommencer').addEventListener('click', () => { $('#couche-pause').classList.add('cache'); enPause = false; if (actx && sonActif) { try { actx.resume(); } catch (e) { /* rien */ } } demarrerNiveau(J ? J.i : 0); });
    $('#btn-pause-niveaux').addEventListener('click', () => { $('#couche-pause').classList.add('cache'); if (actx && sonActif) { try { actx.resume(); } catch (e) { /* rien */ } } afficherNiveaux(); });
    $('#btn-pause-accueil').addEventListener('click', () => { $('#couche-pause').classList.add('cache'); if (actx && sonActif) { try { actx.resume(); } catch (e) { /* rien */ } } allerAccueil(); });
  }
  init();
})();
</script>
</body>
</html>
