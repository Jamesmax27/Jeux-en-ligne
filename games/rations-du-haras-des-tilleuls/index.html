<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

  padding: 6px 8px; background: rgba(94,58,31,.92); color: #fff8ea; flex: 0 0 auto;
}
.barre .infos { flex: 1; min-width: 0; line-height: 1.1; }
.barre .infos b { display: block; font-size: 17px; white-space: nowrap; }
.barre .infos span { font-size: 13px; opacity: .9; white-space: nowrap; display: block; }
.fers { display: flex; gap: 0; flex: 0 1 auto; min-width: 0; }
.fers svg { width: 17px; height: 20px; flex: 0 0 auto; transition: opacity .3s, transform .3s; }
.fers svg.perdu { opacity: .25; transform: translateY(4px) rotate(30deg); }
.chrono {
  position: relative; width: 62px; height: 30px; border-radius: 15px; background: #3b2615;
  overflow: hidden; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center;
}
.chrono .jauge { position: absolute; left: 0; top: 0; bottom: 0; background: #6cbf4a; transition: width .25s linear; }
.chrono.urgent .jauge { background: #e0533d; }
.chrono span { position: relative; }
#ecurie {
  position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 8px;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: safe center;
}
@media (min-height: 760px) {
  .carte:not(.large) .tete { height: 110px; }
  .carte:not(.large) .tete svg { height: 110px; }
  .carte:not(.large) .mangeoire { min-height: 66px; }
}
@media (min-width: 720px) {
  #ecurie { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 1000px; width: 100%; margin: 0 auto; }
}
.arrivee { animation: arrivee .45s ease-out both; }
@keyframes arrivee { from { transform: translateX(60px); opacity: 0; } to { transform: none; opacity: 1; } }
.depart { animation: depart .4s ease-in both; }
@keyframes depart { to { transform: translateX(-80px); opacity: 0; } }

/* Cartes des boxes ------------------------------------------------------- */
.carte {
  position: relative; border-radius: 16px; padding: 6px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 30px),
    linear-gradient(#b67d4a, #9a6438);
  border: 3px solid var(--bois-fonce);
  box-shadow: 0 4px 10px rgba(60,30,10,.25);
  display: flex; flex-direction: column; min-width: 0;
}
.carte.large { grid-column: span 2; }
.carte .plaque {
  position: absolute; left: 6px; top: 6px; z-index: 2;
  background: #f2dfb6; border: 2px solid var(--bois-fonce); border-radius: 8px;
  font-size: 12px; font-weight: 800; padding: 1px 6px; max-width: 48%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ardoise {
  position: absolute; right: 6px; top: 6px; z-index: 2;
  background: var(--ardoise); color: var(--craie); border: 3px solid #a47143; border-radius: 8px;
  padding: 2px 7px; text-align: center; font-weight: 800; line-height: 1.1; max-width: 58%;
  box-shadow: 0 2px 4px rgba(0,0,0,.3);
}
.ardoise .grand { font-size: 26px; display: block; }
.ardoise .ligne { font-size: 13px; display: block; white-space: nowrap; }
.ardoise .revele { font-size: 18px; color: #b9f28c; display: block; }
.tete { height: 86px; display: flex; align-items: flex-end; justify-content: flex-start; }
.tete svg { height: 86px; width: auto; max-width: 70%; overflow: visible; }
.mangeoire {
  position: relative; margin-top: 2px; min-height: 58px; border-radius: 10px 10px 18px 18px;
  background: linear-gradient(#6b4325, #4d2f18); border: 3px solid #3a2312;
  padding: 4px 34px 4px 4px; display: flex; flex-wrap: wrap; gap: 3px; align-content: flex-start;
  cursor: pointer; transition: box-shadow .15s, background .2s;
  touch-action: manipulation;
}
.mangeoire.survol, .mangeoire.cible-clavier { box-shadow: 0 0 0 4px #ffe066, 0 0 16px #ffe066; }
.mangeoire.ok { background: linear-gradient(#5d8f37, #3f6b22); border-color: #2c4d17; }
.mangeoire .somme {
  position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
  min-width: 28px; height: 28px; border-radius: 14px; background: #fff3cf; color: var(--encre);
  font-weight: 900; font-size: 15px; display: flex; align-items: center; justify-content: center; padding: 0 4px;
}
.mangeoire.ok .somme { background: #d9f7bf; }
.chip {
  display: inline-flex; align-items: center; gap: 0; background: rgba(255,255,255,.18);
  border-radius: 8px; padding: 1px 3px 1px 1px; color: #fff; font-weight: 800; font-size: 13px;
}
.chip svg { width: 24px; height: 24px; }
.chip.pop { animation: pop .3s ease-out; }
@keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
.carte.refus { animation: secousse .45s; }
@keyframes secousse { 0%,100% { transform: none; } 20% { transform: translateX(-7px) rotate(-1deg); } 40% { transform: translateX(7px) rotate(1deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }
.carte.contente { box-shadow: 0 0 0 3px #9be36a, 0 4px 12px rgba(60,120,20,.4); }
.cheval .oeil-content { display: none; }
.contente .cheval .oeil-ouvert, .poulain.content .cheval .oeil-ouvert { display: none; }
.contente .cheval .oeil-content, .poulain.content .cheval .oeil-content { display: inline; }
.refus .cheval { animation: non .45s; transform-origin: 50% 90%; }
@keyframes non { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
.coeur { position: absolute; z-index: 5; width: 20px; height: 20px; pointer-events: none; animation: coeur 1.1s ease-out forwards; }
@keyframes coeur { from { transform: translateY(0) scale(.6); opacity: 1; } to { transform: translateY(-60px) scale(1.2); opacity: 0; } }

/* Sac à partager --------------------------------------------------------- */
.carte.partage .entete-sac { display: flex; align-items: center; gap: 8px; min-height: 40px; padding-right: 2px; }
.carte.partage .entete-sac svg { width: 40px; height: 40px; }
.carte.partage .ardoise { position: static; max-width: none; flex: 0 1 auto; }
.poulains { display: flex; gap: 6px; margin-top: 4px; }
.poulain { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; position: relative; }
.poulain .tete { height: 58px; justify-content: center; }
.poulain .tete svg { height: 58px; max-width: 100%; }
.poulain .ardoise-p {
  position: absolute; right: 0; top: 0; background: var(--ardoise); color: var(--craie); border-radius: 6px;
  border: 2px solid #a47143; font-weight: 900; font-size: 15px; min-width: 26px; text-align: center; padding: 0 3px;
}
.poulain .mangeoire { min-height: 50px; padding-right: 30px; }
.poulain .mangeoire .somme { min-width: 24px; height: 24px; font-size: 13px; }
.poulain.refus { animation: secousse .45s; }

/* Balance ---------------------------------------------------------------- */
.carte.balance .ardoise { position: static; align-self: center; max-width: none; }
.balance-zone { position: relative; height: 150px; margin-top: 6px; }
.poteau { position: absolute; left: 50%; bottom: 0; width: 56px; margin-left: -28px; height: 128px; }
.fleau {
  position: absolute; left: 12%; right: 12%; top: 18px; height: 9px; border-radius: 5px;
  background: linear-gradient(#e2c28a, #9b6c3a); border: 2px solid #5e3a1f;
  transform: rotate(var(--angle, 0deg)); transition: transform .5s cubic-bezier(.3,1.6,.5,1);
}
.plateau {
  position: absolute; top: 28px; width: 44%; transition: transform .5s cubic-bezier(.3,1.6,.5,1);
}
.plateau.g { left: 1%; transform: translateY(var(--dg, 0px)); }
.plateau.d { right: 1%; transform: translateY(var(--dd, 0px)); }
.charrette-g {
  min-height: 58px; border-radius: 10px 10px 18px 18px; border: 3px solid #3a2312;
  background: linear-gradient(#c58b4f, #9a6438); display: flex; flex-wrap: wrap; gap: 3px; padding: 4px; align-content: flex-start;
}
.charrette-g .chip { background: rgba(0,0,0,.25); }
.roues { display: flex; justify-content: space-around; height: 18px; }
.roues svg { width: 18px; height: 18px; }

/* Réserve ---------------------------------------------------------------- */
#reserve {
  position: relative; z-index: 3; flex: 0 0 auto; display: flex; gap: 4px; padding: 6px 6px max(8px, env(safe-area-inset-bottom));
  background: repeating-linear-gradient(-30deg, #f1d57f 0 6px, #e9c868 6px 12px);
  border-top: 4px solid var(--bois-fonce); justify-content: center;
}
.aliment {
  flex: 1 1 0; min-width: 44px; max-width: 92px; min-height: 84px; border: 3px solid transparent; border-radius: 14px;
  background: var(--creme); box-shadow: 0 3px 0 var(--bois-fonce); padding: 4px 2px;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 1px;
  touch-action: none; position: relative;
}
.aliment svg { width: 40px; height: 40px; pointer-events: none; }
.aliment .valeur {
  font-weight: 900; font-size: 17px; background: var(--vert); color: #fff; border-radius: 10px; min-width: 28px; padding: 0 5px; line-height: 22px;
}
.aliment .stock { font-size: 11px; font-weight: 700; line-height: 1.1; text-align: center; }
.aliment.choisi { border-color: #f08a00; background: #fff0c9; transform: translateY(-4px); }
.aliment.epuise { opacity: .45; }
.aliment.sac .valeur { background: #a0703e; }
#fantome { position: fixed; z-index: 50; width: 56px; height: 56px; margin: -28px 0 0 -28px; pointer-events: none; display: none; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
#fantome svg { width: 56px; height: 56px; }
#guide { position: absolute; z-index: 40; width: 54px; height: 54px; pointer-events: none; display: none; animation: guide 2.2s ease-in-out infinite; }
@keyframes guide {
  0% { transform: translate(var(--x0), var(--y0)); opacity: 0; }
  12% { opacity: 1; transform: translate(var(--x0), var(--y0)) scale(.9); }
  70% { transform: translate(var(--x1), var(--y1)); opacity: 1; }
  100% { transform: translate(var(--x1), var(--y1)); opacity: 0; }
}

/* Bulle de message -------------------------------------------------------- */
#bulle {
  position: absolute; z-index: 30; left: 50%; bottom: 112px; transform: translateX(-50%);
  width: max-content; max-width: 92%; background: rgba(40,25,12,.92); color: #fff8ea;
  padding: 8px 14px; border-radius: 14px; font-weight: 700; font-size: 15px; text-align: center;
  opacity: 0; transition: opacity .25s; pointer-events: none;
}
#bulle.visible { opacity: 1; }

/* Couches (pause, intro, fin) -------------------------------------------- */
.couche {
  position: absolute; inset: 0; z-index: 60; background: rgba(30,18,8,.6);
  display: flex; align-items: center; justify-content: center; padding: 14px;
}
.boite {
  width: min(100%, 440px); max-height: 100%; overflow-y: auto; background: var(--creme); border-radius: 22px;
  border: 4px solid var(--bois-clair); padding: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.35);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  animation: entree .3s ease-out;
}
@keyframes entree { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.boite h2 { margin: 0; font-size: 23px; }
.boite p { margin: 0; font-size: 16px; line-height: 1.35; }
.boite .colonne { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.boite .petit { font-size: 14px; opacity: .8; }
.grandes-etoiles { display: flex; gap: 6px; justify-content: center; }
.grandes-etoiles svg { width: 58px; height: 58px; transform: scale(.4); opacity: .35; transition: transform .35s cubic-bezier(.3,1.8,.5,1), opacity .3s; }
.grandes-etoiles svg.allumee { transform: scale(1); opacity: 1; }
.score-fin { font-size: 22px; font-weight: 900; }
.record { font-weight: 800; color: var(--vert-fonce); }
.recompenses { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.recompense { display: flex; align-items: center; gap: 8px; background: #fff0c4; border-radius: 12px; padding: 4px 8px; font-weight: 700; font-size: 15px; text-align: left; }
.recompense svg { width: 40px; height: 40px; flex: 0 0 auto; }
.demo { position: relative; width: 250px; height: 128px; margin: 4px auto; background: #f3e2bd; border-radius: 16px; overflow: hidden; }
.demo .d-icone { position: absolute; left: 14px; bottom: 14px; width: 46px; height: 46px; animation: demo-icone 2.4s ease-in-out infinite; }
.demo.refus .d-icone { animation-name: demo-refus; }
.demo .d-main { position: absolute; left: 30px; bottom: -4px; width: 46px; height: 46px; animation: demo-main 2.4s ease-in-out infinite; }
.demo.refus .d-main { animation-name: demo-main-refus; }
.demo .d-cheval { position: absolute; right: 10px; bottom: 30px; width: 96px; height: 80px; }
.demo .d-auge { position: absolute; right: 12px; bottom: 8px; width: 120px; height: 28px; border-radius: 8px 8px 14px 14px; background: #5a3820; }
.demo .ardoise { top: 6px; right: 6px; font-size: 14px; }
.demo .d-somme { position: absolute; right: 18px; bottom: 11px; min-width: 24px; height: 22px; border-radius: 11px; background: #fff3cf; font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center; animation: demo-somme 2.4s infinite; }
@keyframes demo-icone { 0%,10% { transform: translate(0,0); opacity: 1; } 60% { transform: translate(130px,-4px) scale(.7); opacity: 1; } 70%,100% { transform: translate(130px,-4px) scale(.5); opacity: 0; } }
@keyframes demo-main { 0%,10% { transform: translate(0,0); } 60% { transform: translate(130px,-4px); } 100% { transform: translate(130px,-4px); opacity: 0; } }
@keyframes demo-refus { 0%,10% { transform: translate(0,0); } 55% { transform: translate(130px,-4px) scale(.8); } 80% { transform: translate(40px,0) rotate(-20deg); } 100% { transform: translate(0,0); } }
@keyframes demo-main-refus { 0%,10% { transform: translate(0,0); } 55% { transform: translate(130px,-4px); } 100% { transform: translate(130px,-4px); opacity: 0; } }
@keyframes demo-somme { 0%,62% { transform: scale(1); } 70% { transform: scale(1.4); background: #b9f28c; } 100% { transform: scale(1); } }
.banniere-saison svg { width: 110px; height: 110px; }
#confettis { position: absolute; inset: 0; z-index: 70; pointer-events: none; overflow: hidden; }
.confetti { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: confetti 1.8s ease-in forwards; }
@keyframes confetti { to { transform: translateY(110vh) rotate(720deg); } }
.etoile-vole { position: absolute; z-index: 65; width: 34px; height: 34px; pointer-events: none; animation: vole .9s ease-out forwards; }
@keyframes vole { from { transform: scale(.4); opacity: 1; } to { transform: translate(var(--vx), var(--vy)) scale(1.3) rotate(160deg); opacity: 0; } }
.place-langue { min-height: 44px; display: flex; align-items: center; }
@media (prefers-reduced-motion: reduce) {
  .particule, .confetti { display: none; }
  .arrivee, .depart, .carte.refus { animation: none; }
}
</style>
</head>
<body>
<div id="app">

  <!-- Écran titre : le dessin sert aussi de jaquette -->
  <section id="ecran-titre" class="ecran actif">
    <div class="haut">
      <div id="langue-titre" class="place-langue"></div>
      <button class="btn-rond bouton-son" type="button"></button>
    </div>
    <h1 data-i18n="titre"></h1>
    <svg id="decor-titre" viewBox="0 236 400 470" preserveAspectRatio="xMidYMax meet" aria-hidden="true"></svg>
    <div class="bas">
      <p data-i18n="consigne"></p>
      <button id="btn-jouer" class="btn principal" type="button" data-i18n="jouer"></button>
      <div class="rangee-btn">
        <button id="btn-niveaux" class="btn" type="button" data-i18n="niveaux"></button>
        <button id="btn-sellerie" class="btn" type="button" data-i18n="sellerie"></button>
      </div>
    </div>
  </section>

  <!-- Choix des niveaux -->
  <section id="ecran-niveaux" class="ecran ecran-liste">
    <div class="entete">
      <button class="btn-rond btn-retour" type="button" data-i18n-aria="retour"></button>
      <h2 data-i18n="niveaux.titre"></h2>
    </div>
    <div class="defile" id="liste-niveaux"></div>
  </section>

  <!-- Sellerie : rosettes, chevaux, couvertures -->
  <section id="ecran-sellerie" class="ecran ecran-liste">
    <div class="entete">
      <button class="btn-rond btn-retour" type="button" data-i18n-aria="retour"></button>
      <h2 data-i18n="sellerie.titre"></h2>
    </div>
    <div class="defile" id="contenu-sellerie"></div>
  </section>

  <!-- Jeu -->
  <section id="ecran-jeu" class="ecran">
    <div id="deco"></div>
    <div class="barre">
      <button id="btn-pause" class="btn-rond" type="button" data-i18n-aria="aria.pause"></button>
      <div class="infos"><b id="txt-niveau"></b><span id="txt-rangee"></span></div>
      <div class="fers" id="fers" role="img"></div>
      <div class="chrono cache" id="chrono" role="timer"><div class="jauge" id="jauge"></div><span id="txt-chrono"></span></div>
      <button class="btn-rond bouton-son" type="button"></button>
    </div>
    <div id="ecurie"></div>
    <div id="reserve"></div>
    <div id="bulle" role="status" aria-live="polite"></div>
    <div id="guide"></div>
  </section>

  <!-- Pause -->
  <div id="couche-pause" class="couche cache">
    <div class="boite" role="dialog" aria-modal="true" aria-labelledby="titre-pause">
      <h2 id="titre-pause" data-i18n="pause.titre"></h2>
      <div class="colonne">
        <button id="btn-reprendre" class="btn principal" type="button" data-i18n="reprendre"></button>
        <button id="btn-recommencer" class="btn" type="button" data-i18n="recommencer"></button>
        <button id="btn-pause-niveaux" class="btn" type="button" data-i18n="niveaux"></button>
        <button id="btn-pause-accueil" class="btn" type="button" data-i18n="accueil"></button>
      </div>
      <div class="rangee-btn"><div id="langue-pause" class="place-langue"></div><button class="btn-rond bouton-son" type="button"></button></div>
    </div>
  </div>

  <!-- Présentation d'une saison ou d'une mécanique -->
  <div id="couche-intro" class="couche cache">
    <div class="boite" role="dialog" aria-modal="true" aria-labelledby="titre-intro" id="boite-intro"></div>
  </div>

  <!-- Fin de niveau -->
  <div id="couche-fin" class="couche cache">
    <div class="boite" role="dialog" aria-modal="true" aria-labelledby="titre-fin" id="boite-fin"></div>
  </div>

  <div id="confettis"></div>
  <div id="fantome"></div>
</div>

<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------------
  // Raccourcis
  // ------------------------------------------------------------------------
  const JEU = 'rations-du-haras-des-tilleuls';
  const I18N = window.JEL_I18N;
  const t = I18N.t;
  const nb = (x) => I18N.nombre(x);
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => Array.from(document.querySelectorAll(s));
  const el = (tag, cls, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.appendChild(e); return e; };

  // ------------------------------------------------------------------------
  // Aliments : valeur de chacun
  // ------------------------------------------------------------------------
  const ALIMENTS = { carotte: 1, seau: 2, pomme: 3, dore: 4, foin: 5, mash: 10, sac: 1 };
  const ORDRE_ALIMENTS = ['carotte', 'seau', 'pomme', 'dore', 'foin', 'mash', 'sac'];

  // Fabriques de tâches
  const B = (c) => ({ type: 'box', cible: c });                      // ardoise = nombre visé
  const C = (h, p) => ({ type: 'course', hier: h, plus: p });         // cheval de course : hier + p
  const X = (h) => ({ type: 'course', hier: h, fois: 2 });            // le double d'hier
  const P = (s, k) => ({ type: 'partage', sac: s, parts: k });        // sac de s carottes pour k poulains
  const BAL = (...g) => ({ type: 'balance', gauche: g });             // balance : charrette de gauche chargée

  const A1 = ['carotte', 'seau'];
  const A2 = ['carotte', 'seau', 'foin'];
  const A3 = ['carotte', 'seau', 'dore', 'foin'];
  const A4 = ['carotte', 'pomme', 'foin'];
  const A5 = ['carotte', 'seau', 'pomme', 'dore', 'foin'];
  const A6 = ['carotte', 'seau', 'pomme', 'dore', 'foin', 'mash'];

  // Les 20 niveaux. Saison = un bloc de 5 niveaux (printemps, été, automne, neige).
  // rangs : rangées d'écurie successives ; stock : réserve comptée ; chrono : secondes.
  const NIVEAUX = [
    // Printemps
    { alim: A1, rangs: [[B(3), B(4)]], intro: ['base', 'fers'] },
    { alim: A1, rangs: [[B(5), B(6)], [B(7), B(4)]], intro: ['rangees'] },
    { alim: A2, rangs: [[B(8), B(10)], [B(12), B(7), B(9)]], intro: ['foin'] },
    { alim: A2, rangs: [[B(9), B(13)], [B(11), B(6), B(8)]], stock: true, intro: ['stock'] },
    { alim: A2, rangs: [[B(9), B(6)], [P(8, 2)], [P(12, 3), B(11)]], intro: ['sac'] },
    // Concours d'été
    { alim: A3, rangs: [[B(12), B(16)], [B(14), B(18), B(9)]], intro: ['dore'] },
    { alim: A3, rangs: [[C(6, 3), B(13)], [C(9, 4), C(11, 5), B(17)]], intro: ['course'] },
    { alim: A3, rangs: [[B(15), C(8, 6)], [B(21), C(12, 7), B(10)]], stock: true },
    { alim: A3, rangs: [[P(15, 3), C(10, 8)], [P(16, 4)], [B(22), B(19), C(14, 6)]] },
    { alim: A3, rangs: [[B(24), C(13, 9), B(18)], [P(18, 3), B(20)], [C(15, 12), C(17, 8), B(25)]] },

  // ------------------------------------------------------------------------
  // Progression gardée (save.js) et son
  // ------------------------------------------------------------------------
  const prog = { etoiles: [], records: [], couverture: 'rouge', debloque: 1 };
  let sonActif = true;
  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    prog.etoiles = NIVEAUX.map((_, i) => (d && Array.isArray(d.etoiles) && Number.isInteger(d.etoiles[i]) ? Math.max(0, Math.min(3, d.etoiles[i])) : 0));
    prog.records = NIVEAUX.map((_, i) => (d && Array.isArray(d.records) && Number.isFinite(d.records[i]) ? d.records[i] : 0));
    prog.couverture = d && typeof d.couverture === 'string' ? d.couverture : 'rouge';
    let deb = d && Number.isInteger(d.debloque) ? d.debloque : 1;
    if (d && d.niveau) deb = Math.max(deb, d.niveau);
    prog.etoiles.forEach((e, i) => { if (e > 0) deb = Math.max(deb, i + 2); });
    prog.debloque = Math.max(1, Math.min(NIVEAUX.length, deb));
    if (d && d.options && typeof d.options.son === 'boolean') sonActif = d.options.son;
    try { const s = localStorage.getItem('rations-haras-son'); if (s === '0') sonActif = false; if (s === '1') sonActif = true; } catch (e) { /* pas de stockage */ }
    try { const c = localStorage.getItem('rations-haras-couverture'); if (c && (!d || !d.couverture)) prog.couverture = c; } catch (e) { /* pas de stockage */ }
    if (!COUVERTURES.some((c) => c.id === prog.couverture && couvertureOuverte(c))) prog.couverture = 'rouge';
  }
  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);
  const scoreTotal = () => prog.records.reduce((a, b) => a + b, 0);
  const robeOuverte = (r) => r.niveau === 0 || prog.etoiles[r.niveau - 1] > 0;
  const couvertureOuverte = (c) => (c.etoiles ? totalEtoiles() >= c.etoiles : c.niveau === 0 || prog.etoiles[c.niveau - 1] > 0);
  const couvertureActuelle = () => COUVERTURES.find((c) => c.id === prog.couverture) || COUVERTURES[0];
  function donneesProgression() {
    return { etoiles: prog.etoiles.slice(), records: prog.records.slice(), couverture: prog.couverture, debloque: prog.debloque, options: { son: sonActif } };
  }

  // ------------------------------------------------------------------------
  // Sons (Web Audio, rien avant le premier geste)
  // ------------------------------------------------------------------------
  let actx = null, premierGeste = false;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
    if (actx && actx.state === 'suspended' && !enPause) { try { actx.resume(); } catch (e) { /* rien */ } }
    return actx;
  }
  function geste() { premierGeste = true; if (sonActif) audio(); }
  document.addEventListener('pointerdown', geste, true);
  document.addEventListener('keydown', geste, true);
  function note(f, duree, type, vol, f2, delai) {
    if (!sonActif || !premierGeste) return;
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + (delai || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + duree);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + duree + 0.05);
  }
  function hennissement() {
    if (!sonActif || !premierGeste) return;
    const a = audio(); if (!a) return;
    const t0 = a.currentTime;
    const o = a.createOscillator(), lfo = a.createOscillator(), lg = a.createGain(), g = a.createGain(), f = a.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(880, t0); o.frequency.exponentialRampToValueAtTime(420, t0 + 0.75);
    lfo.frequency.value = 15; lg.gain.value = 70; lfo.connect(lg); lg.connect(o.frequency);
    f.type = 'bandpass'; f.frequency.value = 1100; f.Q.value = 1.4;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.09, t0 + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.8);
    o.connect(f); f.connect(g); g.connect(a.destination);
    o.start(t0); lfo.start(t0); o.stop(t0 + 0.85); lfo.stop(t0 + 0.85);
  }
  const SONS = {
    clic: () => note(820, 0.05, 'triangle', 0.06),
    prise: () => note(620, 0.07, 'triangle', 0.08, 880),
    pose: () => { note(300, 0.1, 'sine', 0.2, 180); note(900, 0.04, 'triangle', 0.05, null, 0.02); },
    juste: () => { note(660, 0.12, 'triangle', 0.12); note(880, 0.12, 'triangle', 0.12, null, 0.1); note(1320, 0.22, 'triangle', 0.1, null, 0.2); },
    refus: () => { note(150, 0.35, 'sawtooth', 0.1, 80); note(110, 0.3, 'square', 0.05, 70, 0.05); },
    non: () => note(220, 0.15, 'square', 0.05, 180),
    retouche: () => note(500, 0.1, 'triangle', 0.08, 330),
    rangee: () => { [523, 659, 784, 1046].forEach((f, i) => note(f, 0.16, 'triangle', 0.1, null, i * 0.09)); },
    victoire: () => { [523, 659, 784, 659, 784, 1046].forEach((f, i) => note(f, 0.22, 'triangle', 0.12, null, i * 0.13)); },
    defaite: () => { [392, 349, 311, 262].forEach((f, i) => note(f, 0.3, 'sine', 0.12, null, i * 0.2)); },
    tic: () => note(1250, 0.03, 'square', 0.04),
    etoile: (i) => note(880 + i * 220, 0.18, 'triangle', 0.12),
  };
  function son(nom, x) { try { SONS[nom](x); } catch (e) { /* audio indisponible */ } }

  function majBoutonsSon() {

  function basculerSon() {
    sonActif = !sonActif;
    try { localStorage.setItem('rations-haras-son', sonActif ? '1' : '0'); } catch (e) { /* pas de stockage */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: sonActif } }); } catch (e) { /* rien */ }

  // ------------------------------------------------------------------------
  // Partie
  // ------------------------------------------------------------------------
  let J = null;           // état du niveau en cours
  let enPause = false;
  let selection = null;   // aliment choisi dans la réserve
  let fileCouches = [];   // présentations à montrer avant de jouer
  let coucheOuverte = false;
  let boucle = 0, dernier = 0;

  const jeuActif = () => J && J.enCours && !enPause && !coucheOuverte && !J.transition;

  function cibleDe(tache) {
    if (tache.type === 'box') return tache.cible;
    if (tache.type === 'course') return tache.fois ? tache.hier * tache.fois : tache.hier + tache.plus;
    if (tache.type === 'balance') return tache.gauche.reduce((s, a) => s + ALIMENTS[a], 0);
    return 0;
  }

  // Réserve comptée : une solution simple (les plus gros aliments d'abord) + un peu de marge.
  function stockRangee(def, taches) {
    const st = {};
    def.alim.forEach((a) => { st[a] = def.stock ? 0 : Infinity; });
    if (def.stock) {
      const tries = def.alim.slice().sort((a, b) => ALIMENTS[b] - ALIMENTS[a]);
      taches.forEach((tc) => {
        if (tc.type === 'partage') return;
        let reste = cibleDe(tc);
        tries.forEach((a) => { const n = Math.floor(reste / ALIMENTS[a]); st[a] += n; reste -= n * ALIMENTS[a]; });
      });
      def.alim.forEach((a) => { if (st[a] < 1) st[a] = 1; });
      st.carotte += 2;
      const second = def.alim.filter((a) => a !== 'carotte').sort((a, b) => ALIMENTS[a] - ALIMENTS[b])[0];
      if (second) st[second] += 1;
    }
    taches.forEach((tc) => { if (tc.type === 'partage') st.sac = tc.sac; });
    return st;
  }

  function demarrerNiveau(i) {
    i = Math.max(0, Math.min(NIVEAUX.length - 1, i));
    arreterBoucle();
    fermerCouches();
    const def = NIVEAUX[i];
    J = { i, def, rang: 0, fers: FERS, depass: 0, retouches: 0, servi: 0, temps: def.chrono || 0, enCours: true, transition: false, mangeoires: [], stock: {}, compteurNom: i * 3, guide: i === 0 };
    enPause = false;
    document.body.classList.remove('fige');
    selection = null;
    prog.debloque = Math.max(prog.debloque, i + 1);
    const s = Math.floor(i / 5);
    const ecran = $('#ecran-jeu');
    ecran.className = 'ecran s' + s;
    preparerDeco(s);
    montrer('ecran-jeu');
    construireRangee(false);
    majBarre();
    // Présentations : saison (tous les 5 niveaux), puis nouvelles mécaniques.
    const file = [];
    if (i % 5 === 0) file.push({ saison: s });
    (def.intro || []).forEach((k) => file.push({ meca: k }));
    if (def.chrono && !(def.intro || []).includes('chrono')) file.push({ rappelChrono: true });
    montrerFile(file);
    demarrerBoucle();
  }

  function quitterPartie() {
    if (J) J.enCours = false;
    J = null;
    enPause = false;
    document.body.classList.remove('fige');
    arreterBoucle();
    fermerCouches();
    cacherGuide();
  }

  // Décor animé de la saison (pétales, fanions, feuilles, flocons)
  function preparerDeco(s) {
    const d = $('#deco');
    d.innerHTML = '';
    if (s === 1) {
      let f = '';
      for (let k = 0; k < 16; k++) f += '<path d="M' + (k * 25) + ' 2l12 20 13-20z" fill="' + ['#e04a4a', '#f2c230', '#3b6fc8', '#4bbf73'][k % 4] + '"/>';
      d.innerHTML = '<svg class="fanions" viewBox="0 0 400 26" preserveAspectRatio="none" aria-hidden="true"><path d="M0 2h400" stroke="#5e3a1f" stroke-width="2"/>' + f + '</svg>';
    }
    const formes = [
      (c) => '<svg viewBox="0 0 20 20"><ellipse cx="10" cy="10" rx="5" ry="8" fill="' + c + '"/></svg>',
      (c) => '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="5" fill="' + c + '"/></svg>',
      (c) => '<svg viewBox="0 0 20 20"><path d="M10 1c6 4 8 10 0 18C2 11 4 5 10 1z" fill="' + c + '"/><path d="M10 3v14" stroke="#0003"/></svg>',
      (c) => '<svg viewBox="0 0 20 20"><path d="M10 1v18M2 6l16 8M2 14l16-8" stroke="' + c + '" stroke-width="2.4" stroke-linecap="round"/></svg>',
    ];
    const couleurs = [['#f9b7d0', '#ffffff', '#f48fb1'], ['#f2c230', '#e04a4a', '#3b6fc8'], ['#d9682b', '#e9a23b', '#a8432f'], ['#ffffff', '#e8f3ff', '#ffffff']];
    const n = s === 1 ? 8 : 14;
    for (let k = 0; k < n; k++) {

    }
  }

  // Construit les cartes de la rangée en cours.
  function construireRangee(arrivee) {
    const def = J.def;
    const taches = def.rangs[J.rang];
    J.stock = stockRangee(def, taches);
    J.mangeoires = [];
    const ecurie = $('#ecurie');
    ecurie.innerHTML = '';
    const robes = ROBES.filter(robeOuverte);
    const couv = couvertureActuelle();
    let k = 0;
    taches.forEach((tc) => {
      const robe = robes[(J.i * 3 + J.rang * 2 + k * 5) % robes.length];
      k++;
      let carte;
      if (tc.type === 'partage') carte = cartePartage(tc, robe);
      else if (tc.type === 'balance') carte = carteBalance(tc);
      else carte = carteBox(tc, robe, couv);
      if (arrivee) { carte.classList.add('arrivee'); carte.style.animationDelay = (k * 0.08) + 's'; }
      ecurie.appendChild(carte);
    });
    ecurie.scrollTop = 0;
    if (selection && !(selection in J.stock)) selection = null;
    construireReserve();
    majBarre();
  }

  function nomSuivant() { const n = t('nom.' + (J.compteurNom % 14)); J.compteurNom++; return n; }

  function creerMangeoire(m, parent) {
    const d = el('div', 'mangeoire', parent);
    d.setAttribute('role', 'button');
    d.tabIndex = 0;
    d.title = t('aria.retirer');

    m.el = d; m.sommeEl = s; m.contenu = {}; m.somme = 0; m.ok = false;

    majMangeoire(m);
    return d;
  }

  function carteBox(tc, robe, couv) {
    const carte = el('div', 'carte');
    const nom = nomSuivant();
    const plaque = el('div', 'plaque', carte); plaque.textContent = nom;
    const ard = el('div', 'ardoise', carte);

    if (!cache) { const g = el('span', 'grand', ard); g.textContent = nb(tc.cible); }
    else {
      el('span', 'ligne', ard).textContent = t('ardoise.hier', { n: tc.hier });
      el('span', 'ligne', ard).textContent = tc.fois ? t('ardoise.double') : t('ardoise.plus', { n: tc.plus });
    }
    const tete = el('div', 'tete', carte);
    tete.innerHTML = svgCheval(robe, couv, false);
    const m = { kind: cache ? 'course' : 'box', cible: cibleDe(tc), nom, carte, ardoise: ard, tache: tc };
    creerMangeoire(m, carte);
    return carte;
  }

  function cartePartage(tc, robe) {
    const carte = el('div', 'carte large partage');
    const ent = el('div', 'entete-sac', carte);
    const ic = el('span', '', ent); ic.innerHTML = svgAliment('sac');
    const ard = el('div', 'ardoise', ent);
    el('span', 'ligne', ard).textContent = t('ardoise.sac', { n: tc.sac });
    el('span', 'ligne', ard).textContent = t('ardoise.parts');
    const rang = el('div', 'poulains', carte);
    const groupe = { membres: [], carte };
    const part = tc.sac / tc.parts;
    for (let p = 0; p < tc.parts; p++) {
      const pl = el('div', 'poulain', rang);
      const nom = nomSuivant();
      const tete = el('div', 'tete', pl);
      const ouvertes = ROBES.filter(robeOuverte);
      tete.innerHTML = svgCheval(ouvertes[(J.i + p * 2 + 1) % ouvertes.length] || robe, couvertureActuelle(), true);
      const ap = el('span', 'ardoise-p', pl); ap.textContent = '?';
      const m = { kind: 'poulain', cible: part, nom, carte: pl, ardoise: ap, groupe };
      groupe.membres.push(m);
      creerMangeoire(m, pl);
    }
    return carte;
  }

  function carteBalance(tc) {
    const carte = el('div', 'carte large balance');
    const ard = el('div', 'ardoise', carte);
    el('span', 'ligne', ard).textContent = t('ardoise.balance');

    const pot = el('div', 'poteau', zone);
    pot.innerHTML = '<svg viewBox="0 0 56 128" width="56" height="128" aria-hidden="true"><path d="M28 6L8 128h40z" fill="#8a5a33" stroke="#5e3a1f" stroke-width="3"/><circle cx="28" cy="12" r="7" fill="#f1b72c" stroke="#5e3a1f" stroke-width="2"/></svg>';
    const fleau = el('div', 'fleau', zone);
    const pg = el('div', 'plateau g', zone);

      const c = el('span', 'chip', cg);

    });
    const roue = '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="#5e3a1f"/><circle cx="10" cy="10" r="3" fill="#c8915a"/></svg>';
    el('div', 'roues', pg).innerHTML = roue + roue;
    const pd = el('div', 'plateau d', zone);
    const m = { kind: 'balance', cible: cibleDe(tc), nom: '', carte, ardoise: ard, zone, fleau, tache: tc };
    creerMangeoire(m, pd);
    el('div', 'roues', pd).innerHTML = roue + roue;
    majBalance(m);
