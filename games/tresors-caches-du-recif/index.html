    g.strokeStyle = c; g.globalAlpha = 0.85; g.lineCap = 'round';
    for (let i = 0; i < 9; i++) { const a = -Math.PI / 2 + (i - 4) * 0.17; g.lineWidth = t * 0.035; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(Math.cos(a) * t * 0.5, Math.sin(a) * t * 0.6, Math.cos(a) * t * 0.9, Math.sin(a) * t * 0.95); g.stroke(); }
    g.lineWidth = t * 0.02;
    for (let k = 1; k < 5; k++) { g.beginPath(); g.arc(0, 0, t * k * 0.2, -Math.PI / 2 - 0.75, -Math.PI / 2 + 0.75); g.stroke(); }
  } else if (type === 3) {     // tubes
    for (let i = 0; i < 4; i++) {
      const xx = (i - 1.5) * t * 0.16, hh = t * (0.35 + h() * 0.45);
      g.fillStyle = c; g.fillRect(xx - t * 0.07, -hh, t * 0.14, hh);
      ovale(g, xx, -hh, t * 0.07, t * 0.03, fonce);
    }
  } else if (type === 4) {     // éponge bosselée
    g.fillStyle = c; g.beginPath();
    for (let i = 0; i <= 12; i++) { const a = Math.PI + i * Math.PI / 12, rr = t * (0.42 + h() * 0.12); g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr * 0.9); }
    g.closePath(); g.fill();
    for (let i = 0; i < 6; i++) rond(g, (h() - 0.5) * t * 0.6, -h() * t * 0.3, t * 0.04, fonce);
  } else {                     // bouquet de boules
    for (let i = 0; i < 8; i++) rond(g, (h() - 0.5) * t * 0.7, -h() * t * 0.6, t * (0.08 + h() * 0.08), c);
  }
  if (grotte && h() < 0.5) { g.globalAlpha = 0.5; rond(g, 0, -t * 0.3, t * 0.06, '#e8fbff'); }
  g.restore();
}

function dessinerFond(largeur, px, opts) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(largeur * px); c.height = Math.ceil(H * px);
  const g = c.getContext('2d');
  g.scale(px, px);
  const h = graine(opts.graine);
  const grotte = opts.grotte, couleurs = grotte ? COULEURS_GROTTE : COULEURS_CORAIL;
  // Eau
  const eau = g.createLinearGradient(0, 0, 0, H);
  if (grotte) { eau.addColorStop(0, '#13284a'); eau.addColorStop(1, '#07142a'); }
  else { eau.addColorStop(0, '#46d0e0'); eau.addColorStop(0.45, '#1a8fc0'); eau.addColorStop(1, '#0d4f86'); }
  g.fillStyle = eau; g.fillRect(0, 0, largeur, H);
  // Rayons de lumière
  if (!grotte) {
    for (let x = h() * 120; x < largeur; x += 140 + h() * 120) {
      g.fillStyle = 'rgba(255,255,255,0.08)'; g.beginPath();
      g.moveTo(x, 0); g.lineTo(x + 50, 0); g.lineTo(x + 170, H * 0.8); g.lineTo(x + 70, H * 0.8); g.closePath(); g.fill();
    }
  }
  // Collines lointaines
  g.fillStyle = grotte ? 'rgba(40,60,100,.6)' : 'rgba(10,60,110,.4)';
  g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= largeur + 60; x += 60) g.lineTo(x, 470 + Math.sin(x * 0.01 + opts.graine) * 40 + h() * 25);
  g.lineTo(largeur, H); g.closePath(); g.fill();
  // Grotte : voûte rocheuse
  if (grotte) {
    g.fillStyle = '#1d2238';
    g.beginPath(); g.moveTo(0, 0);
    for (let x = 0; x <= largeur + 40; x += 40) g.lineTo(x, 50 + h() * 50 + (x % 160 < 40 ? 50 : 0));
    g.lineTo(largeur, 0); g.closePath(); g.fill();
  }
  // Épave (dernière plongée)
  if (opts.epave) {
    g.save(); g.translate(largeur * 0.55, 560); g.rotate(-0.12);
    g.fillStyle = '#3e3328'; g.beginPath(); g.moveTo(-260, 0); g.lineTo(220, 0); g.lineTo(280, -110); g.lineTo(-300, -110); g.closePath(); g.fill();
    g.strokeStyle = '#2a2219'; g.lineWidth = 5;
    for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(-290 + i * 8, -i * 27); g.lineTo(260 - i * 10, -i * 27); g.stroke(); }
    g.fillStyle = '#2a2219'; g.fillRect(-30, -330, 16, 230);
    for (const x of [-180, -80, 40, 150]) rond(g, x, -60, 13, '#1a3550');
    g.restore();
  }
  // Rochers en piliers (pour que les animaux aient des endroits où se poser)
  for (let x = 40 + h() * 80; x < largeur - 20; x += 180 + h() * 160) {
    const haut = 300 + h() * 180, l = 90 + h() * 70;
    g.fillStyle = grotte ? '#2b2f4c' : '#5f6f8f';
    g.beginPath(); g.moveTo(x - l, H);
    g.quadraticCurveTo(x - l * 0.9, haut + 40, x - l * 0.3, haut); g.quadraticCurveTo(x + l * 0.4, haut - 20, x + l * 0.8, haut + 50);
    g.quadraticCurveTo(x + l, H - 100, x + l * 1.05, H); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.08)'; g.beginPath(); g.ellipse(x - l * 0.2, haut + 30, l * 0.5, 16, -0.1, 0, Math.PI * 2); g.fill();
    for (let k = 0; k < 3; k++) corail(g, h, x - l * 0.5 + h() * l, haut + 15 + h() * 20, 50 + h() * 40, choisir2(h, couleurs), grotte);
  }
  // Herbes du fond
  g.lineCap = 'round';
  for (let x = h() * 30; x < largeur; x += 25 + h() * 40) {
    g.strokeStyle = grotte ? 'rgba(40,130,110,.6)' : 'rgba(30,140,90,.75)'; g.lineWidth = 6;
    const hh = 60 + h() * 90;
    g.beginPath(); g.moveTo(x, H - 50); g.quadraticCurveTo(x + 20, H - 50 - hh / 2, x - 5 + h() * 20, H - 50 - hh); g.stroke();
  }
  // Sable
  const sable = g.createLinearGradient(0, H - 90, 0, H);
  if (grotte) { sable.addColorStop(0, '#5a5470'); sable.addColorStop(1, '#3a3550'); }
  else { sable.addColorStop(0, '#ecd79e'); sable.addColorStop(1, '#c9a96a'); }
  g.fillStyle = sable; g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= largeur + 50; x += 50) g.lineTo(x, H - 70 + Math.sin(x * 0.02) * 10);
  g.lineTo(largeur, H); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(120,90,40,.25)'; g.lineWidth = 2;
  for (let i = 0; i < largeur / 40; i++) { const x = h() * largeur, y = H - 45 + h() * 40; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 15, y - 5, x + 30, y); g.stroke(); }
  for (let i = 0; i < largeur / 25; i++) rond(g, h() * largeur, H - 60 + h() * 55, 2 + h() * 4, grotte ? '#6d6688' : '#d9c08a');
  // Coraux du premier plan (sur le sable)
  for (let x = h() * 40; x < largeur; x += 55 + h() * 70) corail(g, h, x, H - 55 + h() * 30, 60 + h() * 60, choisir2(h, couleurs), grotte);
  // Taches d'éponges derrière les animaux camouflés
  for (const p of opts.taches) {
    g.fillStyle = p.c; g.beginPath();
    for (let i = 0; i <= 16; i++) { const a = i * Math.PI / 8, rr = p.r * (1.45 + h() * 0.25); g.lineTo(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr * 0.85); }
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(0,0,0,.18)';
    for (let i = 0; i < 18; i++) rond(g, p.x + (h() - 0.5) * p.r * 2.4, p.y + (h() - 0.5) * p.r * 2, 2 + h() * 4, g.fillStyle);
  }
  return c;
}
function choisir2(h, t) { return t[Math.floor(h() * t.length)]; }

// ---------------------------------------------------------------------
//  État de la partie
// ---------------------------------------------------------------------
const canvas = $('scene'), ctx = canvas.getContext('2d');
const nuit = document.createElement('canvas'), ctxNuit = nuit.getContext('2d');
let J = null;          // la plongée en cours
let ecran = 'accueil';
let dpr = 1, W = 0, HH = 0, s = 1, visW = 0;

function afficher(nom) {
  ecran = nom;
  document.querySelectorAll('.ecran').forEach((e) => e.classList.toggle('actif', e.id === nom));
  if (nom === 'accueil') { majAccueil(); effacerSauvegarde.maj(); }
}
function voile(id, actif) { $(id).classList.toggle('actif', actif); }

function totalEtoiles() { let t = 0; for (let i = 0; i < NIVEAUX.length; i++) t += sauvegarde.etoiles[i] || 0; return t; }
function debloque(n) { return n === 0 || (sauvegarde.etoiles[n - 1] || 0) >= 1; }

// Taille de la zone de jeu.
function mesurer() {
  const z = $('zone');
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, z.clientWidth); HH = Math.max(1, z.clientHeight);
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(HH * dpr);
  nuit.width = canvas.width; nuit.height = canvas.height;
  s = HH / H; visW = W / s;
}

// Prépare une plongée : placement des cibles et des autres animaux.
function lancerNiveau(n) {
  const L = NIVEAUX[n];
  afficher('jeu');
  voile('bilan', false); voile('pause', false);
  mesurer();
  J = { n, L, objets: [], algues: [], effets: [], textes: [], volants: [], plancton: [],
    t: 0, air: L.air, trouves: 0, erreurs: 0, indices: 0, score: 0, pause: false, fini: false,
    camX: 0, camVise: null, derive: 1, repos: 0, lampe: { x: W / 2, y: HH / 2 }, curseur: { x: W / 2, y: HH / 2 }, clavier: false,
    indice: null, alerte: 0, nouveaux: [], graine: Math.floor(Math.random() * 1e9), tuto: null, largeur: 0 };
  J.largeur = L.grotte ? visW : Math.max(900, visW * 1.2);

  // Cibles : lesquelles bougent, lesquelles sont camouflées.
  const cibles = L.cibles.map((id) => ({ id, cible: true }));
  const nageuses = melanger(cibles.filter((c) => ESPECES[c.id].nage));
  for (let i = 0; i < (L.bouge || 0) && i < nageuses.length; i++) nageuses[i].bouge = true;
  const fixes = melanger(cibles.filter((c) => !c.bouge));
  for (let i = 0; i < (L.camo || 0) && i < fixes.length; i++) fixes[i].camo = true;

  // Les autres animaux (pas de sosie avant la plongée des jumeaux).
  const interdits = new Set(L.cibles);
  if (!L.sosies) for (const id of L.cibles) if (ESPECES[id].sosie) interdits.add(ESPECES[id].sosie);
  const autres = [];
  if (L.sosies) for (const id of L.cibles) { const so = ESPECES[id].sosie; if (so && !interdits.has(so)) autres.push({ id: so }); }
  const reserve = LISTE_ESPECES.filter((id) => !interdits.has(id) && (id !== 'coffre'));
  while (autres.length < L.autres) {
    const id = choisir(reserve);
    if (autres.filter((a) => a.id === id).length < 2) autres.push({ id });
  }
  for (const a of autres) {
    if (L.bouge && ESPECES[a.id].nage && Math.random() < 0.45) a.bouge = true;
    else if (L.camo && Math.random() < 0.35) a.camo = true;
  }

  const tous = [...cibles, ...autres];
  // Les plus gros d'abord : plus facile à placer.
  for (const d of tous) d.r = Math.round(L.taille * (ESPECES[d.id].grand || 1));
  tous.sort((a, b) => b.r - a.r);
  for (const d of tous) placer(d);
  J.objets.forEach((o) => { if (o.cible) o.ordre = L.cibles.indexOf(o.id); });

  construireFond();
  construireBarre();
  majHud();
  J.camX = Math.random() * Math.max(0, J.largeur - visW) * 0.3;
  for (let i = 0; i < 40; i++) J.plancton.push({ x: Math.random() * J.largeur, y: Math.random() * H, v: 3 + Math.random() * 6, r: 1 + Math.random() * 2 });

  // Tutoriel quand une mécanique apparaît.
  if (L.tuto) demarrerTuto(L.tuto);
}

// Cherche une place libre pour un animal.
function placer(d) {
  const L = J.L, m = d.r + 16;
  const fond = !ESPECES[d.id].nage;
  let meilleur = null, meilleurEcart = -1;
  for (let essai = 0; essai < 80; essai++) {
    const x = hasard(m, J.largeur - m);
    const y = d.bouge ? hasard(110, 470) : fond ? hasard(330, H - 40) : hasard(L.grotte ? 140 : 90, 560);
    let ecart = Infinity;
    for (const o of J.objets) {
      const dx = o.x - x, dy = o.y - y;
      ecart = Math.min(ecart, Math.hypot(dx, dy) - o.r - d.r);
    }
    if (ecart > 18) { meilleur = { x, y }; break; }
    if (ecart > meilleurEcart) { meilleurEcart = ecart; meilleur = { x, y }; }
  }
  const o = { id: d.id, r: d.r, x: meilleur.x, y: meilleur.y, y0: meilleur.y, cible: !!d.cible, bouge: !!d.bouge,
    trouve: false, dir: Math.random() < 0.5 ? -1 : 1, phase: Math.random() * 6, cache: false };
  if (o.bouge) {
    const longueur = Math.min(J.largeur - 2 * m, hasard(220, 360));
    o.xa = Math.max(m, Math.min(o.x - longueur / 2, J.largeur - m - longueur));
    o.xb = o.xa + longueur;
    o.vit = (L.vitesse || 30) * hasard(0.8, 1.2) * (o.id === 'tortue' || o.id === 'hippocampe' ? 0.7 : 1);
    // Touffe d'algues sur le trajet : l'animal passe derrière.
    J.algues.push({ x: hasard(o.xa + 50, o.xb - 50), w: Math.max(62, o.r * 2.1), haut: o.y0 - o.r - 34, phase: Math.random() * 6 });
  }
  if (d.camo) { o.camo = choisir(L.grotte ? COULEURS_GROTTE : COULEURS_CORAIL); o.force = L.force || 0.5; }
  J.objets.push(o);
}

function construireFond() {
  const taches = J.objets.filter((o) => o.camo).map((o) => ({ x: o.x, y: o.y, r: o.r, c: o.camo }));
  // Éponges vides des mêmes couleurs : la tache seule ne trahit pas l'animal caché.
  if (taches.length) {
    const h = graine(J.graine + 5), base = taches.length;
    for (let i = 0; i < base * 2 + 3; i++) {
      taches.push({ x: 40 + h() * (J.largeur - 80), y: 300 + h() * 330, r: J.L.taille * (0.8 + h() * 0.4), c: taches[i % base].c });
    }
  }
  J.fond = dessinerFond(J.largeur, s * dpr, { graine: J.graine, grotte: J.L.grotte, epave: J.L.epave, taches });
}

function construireBarre() {
  const b = $('barre'); b.innerHTML = '';
  J.puces = [];
  b.classList.toggle('cinq', J.L.cibles.length === 5);   // 5 cases : une seule rangée
  for (const id of J.L.cibles) {
    const p = document.createElement('div');
    p.className = 'puce';
    p.appendChild(icone(id, 34));
    const t = document.createElement('span'); t.textContent = ESPECES[id].nom; p.appendChild(t);
    b.appendChild(p); J.puces.push(p);
  }
  // La barre change la hauteur de la zone : on remesure.
  requestAnimationFrame(() => { if (J) redimensionner(); });
}

function majHud() {
  $('nom-niveau').textContent = traduire('plongeeN', { n: J.n + 1 }) + ' · ' + J.L.nom;
  const pct = Math.max(0, J.air / J.L.air);
  $('air-niveau').style.width = (pct * 100).toFixed(1) + '%';
  $('air').classList.toggle('bas', pct < 0.25);
  $('score').textContent = J.score;
  $('bouton-indice').classList.toggle('actif', !!J.indice);
}

// Écran redimensionné (rotation du téléphone, fenêtre) : on recalcule tout.
function redimensionner() {
  if (ecran === 'accueil') { tailleAccueil(); return; }
  if (!J || ecran !== 'jeu') return;
  const ancienne = J.largeur, ancienW = W, ancienH = HH;
  mesurer();
  if (W === ancienW && HH === ancienH && J.fond) return;
  const nouvelle = J.L.grotte ? visW : Math.max(900, visW * 1.2);
  const k = nouvelle / ancienne;
  if (k !== 1) {
    for (const o of J.objets) { o.x *= k; if (o.bouge) { o.xa *= k; o.xb *= k; } }
    for (const a of J.algues) a.x *= k;
    J.largeur = nouvelle;
  }
  J.lampe.x = Math.min(J.lampe.x, W); J.lampe.y = Math.min(J.lampe.y, HH);
  J.curseur.x = Math.min(J.curseur.x, W); J.curseur.y = Math.min(J.curseur.y, HH);
  borneCamera();
  construireFond();
}
window.addEventListener('resize', redimensionner);

function borneCamera() { J.camX = Math.max(0, Math.min(J.camX, J.largeur - visW)); }

// ---------------------------------------------------------------------
//  Tutoriel animé (passe tout seul, ou d'un toucher)
// ---------------------------------------------------------------------
function demarrerTuto(type) {
  const L = J.L;
  let obj = null;
  const vivants = J.objets;
  if (type === 'base') obj = vivants.find((o) => o.cible && o.ordre === 0);
  if (type === 'camo') obj = vivants.find((o) => o.camo && !o.cible) || vivants.find((o) => o.camo);
  if (type === 'bouge') obj = vivants.find((o) => o.bouge && !o.cible) || vivants.find((o) => o.bouge);
  if (type === 'sosies') obj = vivants.find((o) => o.cible && ESPECES[o.id].sosie);
  J.tuto = { type, t: 0, duree: type === 'base' ? 6 : 5, obj, depart: J.camX };
  if (obj && !L.grotte) J.tuto.vise = Math.max(0, Math.min(obj.x - visW / 2, J.largeur - visW));
}
function finirTuto() {
  if (!J || !J.tuto) return;
  J.tuto = null;
  J.camVise = null;
  J.puces.forEach((p) => p.classList.remove('eclaire'));
}

// ---------------------------------------------------------------------
//  Toucher, souris et clavier
// ---------------------------------------------------------------------
let appui = null;
function posLocale(e) { const b = canvas.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; }

canvas.addEventListener('pointerdown', (e) => {
  if (!J || J.pause || J.fini) return;
  e.preventDefault();
  if (J.tuto) { finirTuto(); return; }
  const p = posLocale(e);
  appui = { x: p.x, y: p.y, x0: p.x, y0: p.y, glisse: false, id: e.pointerId };
  J.clavier = false;
  if (J.L.grotte) { J.lampe.x = p.x; J.lampe.y = p.y; }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* rien */ }
});
canvas.addEventListener('pointermove', (e) => {
  if (!J || J.pause || J.fini) return;
  const p = posLocale(e);
  if (!appui) {
    // Souris sans clic : la lampe suit le pointeur dans les grottes.
    if (e.pointerType === 'mouse' && J.L.grotte && !J.tuto) { J.lampe.x = p.x; J.lampe.y = p.y; J.clavier = false; }
    return;
  }
  const dx = p.x - appui.x;
  if (!appui.glisse && Math.hypot(p.x - appui.x0, p.y - appui.y0) > 10) appui.glisse = true;
  if (appui.glisse) {
    if (J.L.grotte) { J.lampe.x = p.x; J.lampe.y = p.y; }
    else { J.camX -= dx / s; J.camVise = null; J.repos = 3; borneCamera(); }
  }
  appui.x = p.x; appui.y = p.y;
});
function relacher(e) {
  if (!appui) return;
  const a = appui; appui = null;
  if (!J || J.pause || J.fini || J.tuto) return;
  if (!a.glisse) toucher(a.x0, a.y0);
}
canvas.addEventListener('pointerup', relacher);
canvas.addEventListener('pointercancel', () => { appui = null; });

document.addEventListener('keydown', (e) => {
  const k = e.key;
  if (ecran === 'jeu' && J && !J.fini) {
    if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); if (J.pause) reprendre(); else mettrePause(); return; }
    if (J.pause) return;
    if (J.tuto) { if ([' ', 'Enter', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(k)) { e.preventDefault(); finirTuto(); } return; }
    const pas = 26;
    const c = J.curseur;
    let bouge = true;
    if (k === 'ArrowLeft') c.x -= pas; else if (k === 'ArrowRight') c.x += pas;
    else if (k === 'ArrowUp') c.y -= pas; else if (k === 'ArrowDown') c.y += pas;
    else bouge = false;
    if (bouge) {
      e.preventDefault(); J.clavier = true;
      // Au bord de l'écran, la scène défile.
      if (!J.L.grotte) {
        if (c.x < W * 0.15) { J.camX -= pas / s * 1.5; J.repos = 3; J.camVise = null; }
        if (c.x > W * 0.85) { J.camX += pas / s * 1.5; J.repos = 3; J.camVise = null; }
        borneCamera();
      }
      c.x = Math.max(8, Math.min(W - 8, c.x)); c.y = Math.max(8, Math.min(HH - 8, c.y));
      if (J.L.grotte) { J.lampe.x = c.x; J.lampe.y = c.y; }
      return;
    }
    if (k === ' ' || k === 'Enter') {
      e.preventDefault();
      if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
      J.clavier = true; toucher(c.x, c.y); return;
    }
    if (k === 'i' || k === 'I') { e.preventDefault(); donnerIndice(); }
  }
});

// Un toucher dans la scène, en pixels de la zone.
function toucher(x, y) {
  const wx = J.camX + x / s, wy = y / s;
  let meilleur = null, dmin = Infinity;
  for (const o of J.objets) {
    if (o.trouve) continue;
    const d = Math.hypot(o.x - wx, o.y - wy);
    const marge = o.r + 12;
    if (d < marge && d < dmin) { dmin = d; meilleur = o; }
  }
  J.effets.push({ type: 'rond', x: wx, y: wy, t: 0, d: 0.4 });
  if (!meilleur) { sons.bloup(); return; }
  if (meilleur.bouge && meilleur.cache) { sons.cache(); texte(wx, wy - 30, traduire('cache'), '#bdf0ff'); return; }
  if (meilleur.cible) trouver(meilleur);
  else {
    J.erreurs++; J.air = Math.max(0, J.air - 4); J.score = Math.max(0, J.score - 20);
    sons.erreur(); J.secousse = 0.3;
    texte(meilleur.x, meilleur.y - meilleur.r - 14, traduire('pasCa', { nom: window.JEL_I18N.getLang() === 'de' ? ESPECES[meilleur.id].nom : ESPECES[meilleur.id].nom.toLowerCase() }), '#ffd0c4');
    majHud();
  }
}

function trouver(o) {
  o.trouve = true; J.trouves++; J.score += 100;
  sons.trouve();
  if (!sauvegarde.collection[o.id]) {
    sauvegarde.collection[o.id] = true; sauver(); J.nouveaux.push(o.id);
    sons.nouveau(); texte(o.x, o.y - o.r - 40, traduire('nouvelAmi'), '#9dffc0');
  }
  texte(o.x, o.y - o.r - 14, traduire('bravo100'), '#ffe066');
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 120;
    J.effets.push({ type: i % 3 ? 'bulle' : 'etincelle', x: o.x, y: o.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, t: 0, d: 0.9 + Math.random() * 0.5, r: 3 + Math.random() * 5 });
  }
  // L'animal s'envole vers sa case dans la barre.
  const puce = J.puces[o.ordre];
  const bz = canvas.getBoundingClientRect(), bp = puce.getBoundingClientRect();
  J.volants.push({ o, x0: (o.x - J.camX) * s, y0: o.y * s, x1: bp.left + bp.width / 2 - bz.left, y1: HH + 10, t: 0, d: 0.75, puce });
  if (J.indice && J.indice.o === o) J.indice = null;
  majHud();
  if (J.trouves === J.L.cibles.length) setTimeout(() => finNiveau(true), 1100);
}

function texte(x, y, txt, c) { J.textes.push({ x, y, txt, c, t: 0, d: 2 }); }

function donnerIndice() {
  if (!J || J.pause || J.fini || J.tuto || J.indice) return;
  const reste = J.objets.filter((o) => o.cible && !o.trouve);
  if (!reste.length) return;
  const o = choisir(reste);
  J.indices++;
  J.indice = { o, t: 0, d: 3.2 };
  if (!J.L.grotte) J.camVise = Math.max(0, Math.min(o.x - visW / 2, J.largeur - visW));
  sons.indice(); majHud();
}
$('bouton-indice').addEventListener('click', (e) => { e.currentTarget.blur(); donnerIndice(); });

// ---------------------------------------------------------------------
//  Pause
// ---------------------------------------------------------------------
function mettrePause() {
  if (!J || J.fini || J.pause) return;
  J.pause = true; appui = null; voile('pause', true);
  if (audio && audio.state === 'running') audio.suspend().catch(() => {});
  setTimeout(() => $('reprendre').focus(), 50);
}
function reprendre() {
  if (!J) return;
  J.pause = false; voile('pause', false); dernier = performance.now();
  if (audio) audio.resume().catch(() => {});
  sons.clic();
}
$('bouton-pause').addEventListener('click', (e) => { e.currentTarget.blur(); mettrePause(); });
$('reprendre').addEventListener('click', reprendre);
$('recommencer').addEventListener('click', () => { const n = J.n; reprendre(); lancerNiveau(n); });
$('pause-accueil').addEventListener('click', () => { reprendre(); J = null; afficher('accueil'); });
document.addEventListener('visibilitychange', () => { if (document.hidden && ecran === 'jeu' && J && !J.fini) mettrePause(); });

// ---------------------------------------------------------------------
//  Fin d'une plongée et bilan
// ---------------------------------------------------------------------
function finNiveau(reussi) {
  if (!J || J.fini) return;
  J.fini = true; appui = null;
  const total = J.L.cibles.length, tout = J.trouves === total;
  const pctAir = Math.max(0, J.air / J.L.air);
  let etoiles = tout ? (J.indices === 0 ? 3 : 2) : (J.trouves >= Math.ceil(total / 2) ? 1 : 0);
  let score = J.trouves * 100 + (tout ? Math.round(pctAir * 200) : 0) + (tout && J.indices === 0 ? 100 : 0) - J.erreurs * 20;
  score = Math.max(0, score);
  const ancien = sauvegarde.records[J.n] || 0;
  const record = score > ancien;
  if (record) sauvegarde.records[J.n] = score;
  sauvegarde.etoiles[J.n] = Math.max(sauvegarde.etoiles[J.n] || 0, etoiles);
  sauver();
  // Plongée réussie (au moins une étoile) : on reprendra à la suivante (la 12e reste la dernière).
  if (etoiles >= 1) JEL_SAVE.save(JEU, { niveau: Math.min(J.n + 2, NIVEAUX.length), score: 0 });

  const derniere = J.n === NIVEAUX.length - 1;
  $('bilan-titre').textContent = traduire(tout ? (derniere ? 'toutExplore' : 'plongeeReussie') : (etoiles ? 'plusAirRemonte' : 'plusAirEncore'));
  $('bilan-trouves').textContent = traduire('trouves', { n: J.trouves, total }) + ' · ' + (J.indices ? traduire('indices', { n: J.indices }) : traduire('sansIndice')) + (derniere && tout ? ' · ' + traduire('etoilesTotal', { n: totalEtoiles() }) : '');
  const be = $('bilan-etoiles'); be.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const sp = document.createElement('span'); sp.textContent = '★';
    if (i < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.4 + i * 0.35) + 's'; setTimeout(() => sons.etoile(i), 400 + i * 350); }
    be.appendChild(sp);
  }
  $('bilan-record').textContent = record ? traduire('nouveauRecord') : traduire('recordN', { n: ancien });
  const nv = $('bilan-nouveaux'); nv.innerHTML = '';
  for (const id of J.nouveaux) nv.appendChild(icone(id, 44));
  $('bilan-nouveaux-bloc').style.display = J.nouveaux.length ? '' : 'none';
  const suivant = $('bilan-suivant');
  suivant.style.display = etoiles >= 1 && !derniere ? '' : 'none';
  $('bilan-rejouer').textContent = traduire(etoiles >= 1 ? 'rejouer' : 'rejouerPlongee');
  // Compteur de score qui défile.
  const bs = $('bilan-score'); const debut = performance.now();
  const defile = (t) => { const k = Math.min(1, (t - debut) / 1000); bs.textContent = traduire('points', { n: Math.round(score * k) }); if (k < 1 && J && J.fini) requestAnimationFrame(defile); };
  requestAnimationFrame(defile);
  if (etoiles) {
    sons.fanfare();
    for (let i = 0; i < 60; i++) J.effets.push({ type: 'confetti', x: J.camX + Math.random() * visW, y: H + 20, vx: (Math.random() - 0.5) * 80, vy: -200 - Math.random() * 260, t: 0, d: 2.5 + Math.random(), r: 4 + Math.random() * 4, c: choisir(COULEURS_CORAIL) });
  } else sons.rate();
  setTimeout(() => { if (J && J.fini) { voile('bilan', true); (etoiles >= 1 && !derniere ? suivant : $('bilan-rejouer')).focus(); } }, 350);
}
$('bilan-suivant').addEventListener('click', () => { sons.clic(); lancerNiveau(J.n + 1); });
$('bilan-rejouer').addEventListener('click', () => { sons.clic(); lancerNiveau(J.n); });
$('bilan-plongees').addEventListener('click', () => { sons.clic(); voile('bilan', false); J = null; ouvrirPlongees(); });

// ---------------------------------------------------------------------
//  Boucle d'animation
// ---------------------------------------------------------------------
let dernier = performance.now();
function boucle(maintenant) {
  const dt = Math.min(0.05, (maintenant - dernier) / 1000);
  dernier = maintenant;
  if (ecran === 'jeu' && J) {
    if (!J.pause) mettreAJour(dt);
    dessiner();
  } else if (ecran === 'accueil') dessinerAccueil(dt);
  requestAnimationFrame(boucle);
}

function mettreAJour(dt) {
  J.t += dt;
  const T = J.tuto;
  // Animaux qui nagent (même pendant le bilan, pour le plaisir des yeux).
  for (const o of J.objets) {
    if (o.trouve) continue;
    if (o.bouge && !J.fini) {
      o.x += o.dir * o.vit * dt;
      if (o.x > o.xb) { o.x = o.xb; o.dir = -1; }
      if (o.x < o.xa) { o.x = o.xa; o.dir = 1; }
      o.y = o.y0 + Math.sin(J.t * 1.6 + o.phase) * (o.id === 'meduse' ? 22 : 8);
      o.cache = J.algues.some((a) => Math.abs(o.x - a.x) < a.w / 2 - o.r * 0.15 && o.y > a.haut + o.r * 0.4);
    }
  }
  for (const p of J.plancton) { p.y -= p.v * dt; p.x += Math.sin(J.t + p.r * 3) * 4 * dt; if (p.y < 0) { p.y = H; p.x = Math.random() * J.largeur; } }

  if (T) {
    T.t += dt;
    if (T.vise !== undefined && T.type !== 'grotte') {
      const k = Math.min(1, T.t / 2.0); const e = k * k * (3 - 2 * k);
      J.camX = T.depart + (T.vise - T.depart) * e;
    }
    if (T.t >= T.duree) finirTuto();
  } else if (!J.fini) {
    // Bouteille d'air.
    J.air -= dt;
    const pct = J.air / J.L.air;
    if (pct < 0.25) { J.alerte -= dt; if (J.alerte <= 0) { sons.alerte(); J.alerte = 5; } }
    if (J.air <= 0) { J.air = 0; majHud(); finNiveau(false); }
    if (Math.floor(J.t * 4) !== J.dernierHud) { J.dernierHud = Math.floor(J.t * 4); majHud(); }
    // Caméra : vers l'indice, sinon dérive douce.
    if (J.camVise !== null) {
      J.camX += (J.camVise - J.camX) * Math.min(1, dt * 3);
      if (Math.abs(J.camVise - J.camX) < 1) J.camVise = null;
    } else if (J.repos > 0) J.repos -= dt;
    else if (J.largeur > visW + 1) {
      J.camX += J.derive * 14 * dt;
      if (J.camX >= J.largeur - visW) { J.camX = J.largeur - visW; J.derive = -1; }
      if (J.camX <= 0) { J.camX = 0; J.derive = 1; }
    }
    borneCamera();
    if (J.indice) {
      J.indice.t += dt;
      if (Math.random() < dt * 25) {
        const o = J.indice.o;
        J.effets.push({ type: 'guide', x: o.x + (Math.random() - 0.5) * 50, y: H + 10, cx: o, t: 0, d: 1.6, r: 3 + Math.random() * 5 });
      }
      if (J.indice.t > J.indice.d) J.indice = null, majHud();
    }
  }
  if (J.secousse > 0) J.secousse -= dt;
  // Effets
  for (const f of J.effets) {
    f.t += dt;
    if (f.type === 'bulle' || f.type === 'etincelle') { f.x += f.vx * dt; f.y += f.vy * dt; f.vy -= 30 * dt; f.vx *= 0.97; }
    if (f.type === 'confetti') { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 160 * dt; }
    if (f.type === 'guide') { const o = f.cx; const k = Math.min(1, f.t / f.d); f.y = H + 10 + (o.y - H - 10) * k; f.x += (o.x - f.x) * dt * 2.5; }
  }
  J.effets = J.effets.filter((f) => f.t < f.d);
  for (const tx of J.textes) { tx.t += dt; tx.y -= 22 * dt; }
  J.textes = J.textes.filter((tx) => tx.t < tx.d);
  for (const v of J.volants) {
    v.t += dt;
    if (v.t >= v.d && !v.fin) { v.fin = true; v.puce.classList.add('trouvee', 'pop'); }
  }
  J.volants = J.volants.filter((v) => v.t < v.d);
}

// Une main de démonstration (pointe du doigt en x, y).
function main(g, x, y, appuie) {
  g.save(); g.translate(x, y + (appuie ? 4 : 0)); g.rotate(-0.25);
  g.fillStyle = '#fff'; g.strokeStyle = '#1b3550'; g.lineWidth = 2.5;
  g.beginPath(); g.roundRect ? g.roundRect(-7, 0, 14, 34, 7) : g.rect(-7, 0, 14, 34); g.fill(); g.stroke();
  g.beginPath(); g.ellipse(4, 42, 20, 18, 0, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = '#fff'; g.fillRect(-5, 22, 10, 16);
  g.restore();
}

function bandeau(g, lignes) {
  const l = Math.min(W - 20, 380), x = (W - l) / 2, h = 22 + lignes.length * 24;
  g.fillStyle = 'rgba(2,28,50,.85)'; g.strokeStyle = 'rgba(160,235,255,.7)'; g.lineWidth = 2;
  g.beginPath(); g.roundRect ? g.roundRect(x, 12, l, h, 16) : g.rect(x, 12, l, h); g.fill(); g.stroke();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  lignes.forEach((t, i) => { g.font = (i === 0 ? '800 18px ' : '600 16px ') + 'system-ui, sans-serif'; g.fillText(t, W / 2, 34 + i * 24); });
  g.font = '600 13px system-ui, sans-serif'; g.fillStyle = '#bdf0ff';
  g.fillText(traduire('toucheCommencer'), W / 2, 12 + h + 16);
}

function dessiner() {
  const g = ctx;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sec = J.secousse > 0 ? Math.sin(J.t * 80) * 5 * J.secousse / 0.3 : 0;
  // Décor
  const sx = J.camX * s * dpr;
  g.drawImage(J.fond, sx, 0, Math.min(J.fond.width - sx, W * dpr), J.fond.height, sec, 0, Math.min(J.fond.width - sx, W * dpr) / dpr, HH);
  // Monde : unités du récif
  g.setTransform(s * dpr, 0, 0, s * dpr, (-J.camX * s + sec) * dpr, 0);
  g.fillStyle = 'rgba(255,255,255,.45)';
  for (const p of J.plancton) { g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fill(); }
  const px = s * dpr;
  for (const o of J.objets) {
    if (o.trouve) continue;
    if (o.x + o.r * 1.5 < J.camX || o.x - o.r * 1.5 > J.camX + visW) continue;
    const img = image(o.id, o.r, px, o.camo, o.force);
    const bob = !o.bouge && ESPECES[o.id].nage ? Math.sin(J.t * 1.5 + o.phase) * 3 : 0;
    const taille = img.width / px;
    g.save(); g.translate(o.x, o.y + bob);
    if (o.dir < 0 && ESPECES[o.id].nage) g.scale(-1, 1);
    g.drawImage(img, -taille / 2, -taille / 2, taille, taille);
    g.restore();
  }
  // Algues du premier plan (on peut s'y cacher)
  for (const a of J.algues) dessinerAlgues(g, a);
  // Ronds de toucher
  for (const f of J.effets) {
    const k = f.t / f.d;
    if (f.type === 'rond') { g.strokeStyle = 'rgba(255,255,255,' + (1 - k) + ')'; g.lineWidth = 3; g.beginPath(); g.arc(f.x, f.y, 10 + k * 26, 0, Math.PI * 2); g.stroke(); }
  }
  // Grotte : noir autour de la lampe
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (J.L.grotte) {
    const n = ctxNuit;
    n.globalCompositeOperation = 'source-over';
    n.clearRect(0, 0, nuit.width, nuit.height);
    n.fillStyle = 'rgba(2,6,16,.965)'; n.fillRect(0, 0, nuit.width, nuit.height);
    n.globalCompositeOperation = 'destination-out';
    const R = J.L.lampe * s * dpr * (J.tuto ? 1.1 : 1);
    let lx = J.lampe.x, ly = J.lampe.y;
    if (J.tuto && J.tuto.type === 'grotte') { const a = J.tuto.t * 1.6; lx = W / 2 + Math.cos(a) * W * 0.28; ly = HH / 2 + Math.sin(a * 1.3) * HH * 0.22; J.lampe.x = lx; J.lampe.y = ly; }
    const gr = n.createRadialGradient(lx * dpr, ly * dpr, R * 0.55, lx * dpr, ly * dpr, R);
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    n.fillStyle = gr; n.beginPath(); n.arc(lx * dpr, ly * dpr, R, 0, Math.PI * 2); n.fill();
    g.drawImage(nuit, 0, 0);
    g.strokeStyle = 'rgba(255,240,180,.35)'; g.lineWidth = 2 * dpr; g.beginPath(); g.arc(lx * dpr, ly * dpr, R * 0.98, 0, Math.PI * 2); g.stroke();
  }
  // Bulles, étincelles, confettis (par-dessus le noir)
  g.setTransform(s * dpr, 0, 0, s * dpr, (-J.camX * s + sec) * dpr, 0);
  for (const f of J.effets) {
    const k = f.t / f.d;
    g.globalAlpha = Math.max(0, 1 - k);
    if (f.type === 'bulle' || f.type === 'guide') { g.strokeStyle = f.type === 'guide' ? '#fff6a8' : '#e8fbff'; g.lineWidth = 2; g.beginPath(); g.arc(f.x, f.y, f.r, 0, Math.PI * 2); g.stroke(); rond(g, f.x - f.r * 0.35, f.y - f.r * 0.35, f.r * 0.25, '#fff'); }
    else if (f.type === 'etincelle') { g.fillStyle = '#ffe066'; g.save(); g.translate(f.x, f.y); g.rotate(f.t * 6); g.fillRect(-f.r, -1.5, f.r * 2, 3); g.fillRect(-1.5, -f.r, 3, f.r * 2); g.restore(); }
    else if (f.type === 'confetti') { g.fillStyle = f.c; g.save(); g.translate(f.x, f.y); g.rotate(f.t * 5 + f.r); g.fillRect(-f.r, -f.r / 2, f.r * 2, f.r); g.restore(); }
  }
  g.globalAlpha = 1;
  // Indice : cercle doré qui pulse autour de la cible
  if (J.indice) {
    const o = J.indice.o; const p = 1 + Math.sin(J.t * 8) * 0.12;
    g.strokeStyle = 'rgba(255,230,100,.9)'; g.lineWidth = 4; g.setLineDash([8, 8]);
    g.beginPath(); g.arc(o.x, o.y, (o.r + 22) * p, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
  }
  // Textes qui montent
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const tx of J.textes) {
    g.globalAlpha = Math.max(0, Math.min(1, (tx.d - tx.t) / 0.6));   // bien lisible, puis s'efface
    g.font = '800 ' + Math.round(17 / s) + 'px system-ui, sans-serif';
    const x = Math.max(J.camX + 10 + g.measureText(tx.txt).width / 2, Math.min(tx.x, J.camX + visW - 10 - g.measureText(tx.txt).width / 2));
    g.lineWidth = 4 / s; g.strokeStyle = 'rgba(2,28,50,.9)'; g.strokeText(tx.txt, x, tx.y);
    g.fillStyle = tx.c; g.fillText(tx.txt, x, tx.y);
  }
  g.globalAlpha = 1;
  // Écran : animaux qui s'envolent vers la barre, curseur, tutoriel
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (const v of J.volants) {
    const k = Math.min(1, v.t / v.d), e = k * k;
    const x = v.x0 + (v.x1 - v.x0) * e, y = v.y0 + (v.y1 - v.y0) * e - Math.sin(k * Math.PI) * 60;
    const echelle = (1 + Math.sin(k * Math.PI) * 0.5) * (1 - k * 0.5);
    const img = image(v.o.id, v.o.r, s * dpr);
    const t = img.width / dpr * echelle;
    g.drawImage(img, x - t / 2, y - t / 2, t, t);
  }
  if (J.clavier && !J.tuto) {
    const c = J.curseur;
    g.strokeStyle = '#ffe066'; g.lineWidth = 3; g.beginPath(); g.arc(c.x, c.y, 22, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.moveTo(c.x - 30, c.y); g.lineTo(c.x - 14, c.y); g.moveTo(c.x + 14, c.y); g.lineTo(c.x + 30, c.y);
    g.moveTo(c.x, c.y - 30); g.lineTo(c.x, c.y - 14); g.moveTo(c.x, c.y + 14); g.lineTo(c.x, c.y + 30); g.stroke();
  }
  if (J.tuto) dessinerTuto(g);
}

function dessinerAlgues(g, a) {
  const n = 6, l = a.w / n;
  g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const bx = a.x - a.w / 2 + (i + 0.5) * l;
    const bal = Math.sin(J.t * 1.3 + i * 0.8 + a.phase) * 10;
    g.strokeStyle = ['#1e8449', '#27ae60', '#229954'][i % 3]; g.lineWidth = l * 1.7;
    g.beginPath(); g.moveTo(bx, H + 10); g.quadraticCurveTo(bx - bal * 0.5, (H + a.haut) / 2, bx + bal, a.haut + (i % 2) * 18); g.stroke();
  }
  g.strokeStyle = 'rgba(160,255,190,.35)'; g.lineWidth = 2;
  for (let i = 0; i < n; i++) {
    const bx = a.x - a.w / 2 + (i + 0.5) * l, bal = Math.sin(J.t * 1.3 + i * 0.8 + a.phase) * 10;
    g.beginPath(); g.moveTo(bx, H); g.quadraticCurveTo(bx - bal * 0.5, (H + a.haut) / 2, bx + bal, a.haut + (i % 2) * 18 + 6); g.stroke();
  }
}

function dessinerTuto(g) {
  const T = J.tuto, t = T.t;
  const ecranDe = (o) => ({ x: (o.x - J.camX) * s, y: o.y * s });
  g.textAlign = 'center';
  if (T.type === 'base') {
    const o = T.obj; const p0 = { x: W / 2, y: HH - 20 };
    let etape;
    if (t < 1.6) { etape = 0; if (J.puces[0]) J.puces[0].classList.add('eclaire'); main(g, p0.x, p0.y - Math.sin(t * 4) * 8, false); }
    else if (t < 3.6) {
      etape = 1; const p = ecranDe(o);
      const k = Math.min(1, (t - 1.6) / 1.4);
      main(g, p0.x + (p.x - p0.x) * k, p0.y + (p.y - p0.y) * k, false);
    } else {
      etape = 2; const p = ecranDe(o); const ap = (t * 2) % 1 < 0.5;
      main(g, p.x, p.y, ap);
      if (ap) { g.strokeStyle = '#ffe066'; g.lineWidth = 4; g.beginPath(); g.arc(p.x, p.y, o.r * s + 12, 0, Math.PI * 2); g.stroke(); }
    }
    if (t >= 1.6 && J.puces[0]) J.puces[0].classList.remove('eclaire');
    bandeau(g, [traduire('tuto.base.' + etape), traduire('tuto.glisse')]);
  } else if (T.type === 'camo' || T.type === 'bouge') {
    const o = T.obj;
    if (o) {
      const p = ecranDe(o), pul = 1 + Math.sin(t * 6) * 0.15;
      g.strokeStyle = '#ffe066'; g.lineWidth = 4; g.setLineDash([10, 8]);
      g.beginPath(); g.arc(p.x, p.y, (o.r * s + 16) * pul, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
      main(g, p.x + 26, p.y + o.r * s + 6, (t * 2) % 1 < 0.5);
    }
    bandeau(g, T.type === 'camo'
      ? [0, 1, 2].map((i) => traduire('tuto.camo.' + i))
      : [0, 1, 2].map((i) => traduire('tuto.bouge.' + i)));
    if (T.type === 'bouge' && o) { const p = ecranDe(o); g.fillStyle = '#ffe066'; g.font = '800 15px system-ui'; g.fillText(traduire(o.cache ? 'tuto.cache' : 'tuto.voila'), p.x, p.y - o.r * s - 26); }
  } else if (T.type === 'grotte') {
    main(g, J.lampe.x + 10, J.lampe.y + 10, false);
    bandeau(g, [0, 1, 2].map((i) => traduire('tuto.grotte.' + i)));
  } else if (T.type === 'sosies') {
    const o = T.obj;
    if (o) {
      const so = ESPECES[o.id].sosie;
      const l = Math.min(W - 40, 300), x = (W - l) / 2, y = HH / 2 - 70;
      g.fillStyle = 'rgba(2,28,50,.88)'; g.strokeStyle = 'rgba(160,235,255,.7)'; g.lineWidth = 2;
      g.beginPath(); g.roundRect ? g.roundRect(x, y, l, 170, 18) : g.rect(x, y, l, 170); g.fill(); g.stroke();
      const r = 34, px = dpr;
      const a = image(o.id, r, px), b = image(so, r, px);
      const ta = a.width / dpr;
      g.drawImage(a, x + l * 0.27 - ta / 2, y + 62 - ta / 2, ta, ta);
      g.drawImage(b, x + l * 0.73 - ta / 2, y + 62 - ta / 2, ta, ta);
      g.font = '900 34px system-ui'; g.textBaseline = 'middle';
      g.fillStyle = '#7dffa8'; g.fillText('✔', x + l * 0.27, y + 122);
      g.fillStyle = '#ff8a8a'; g.fillText('✘', x + l * 0.73, y + 122);
      g.font = '700 13px system-ui'; g.fillStyle = '#fff';
      g.fillText(ESPECES[o.id].nom, x + l * 0.27, y + 152); g.fillText(ESPECES[so].nom, x + l * 0.73, y + 152);
      if ((t * 1.5) % 1 < 0.5) main(g, x + l * 0.27 + 10, y + 70, true);
    }
    bandeau(g, [0, 1, 2].map((i) => traduire('tuto.sosies.' + i)));
  }
}

// ---------------------------------------------------------------------
//  Accueil : petit récif animé derrière le titre
// ---------------------------------------------------------------------
const fondA = $('fond-accueil'), ctxA = fondA.getContext('2d');
let accueil = null;
function tailleAccueil() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  fondA.width = Math.round(w * d); fondA.height = Math.round(h * d);
  const sa = h / H;
  accueil = { d, w, h, sa, t: 0, fond: dessinerFond(w / sa, sa * d, { graine: 7, grotte: false, taches: [] }),
    nageurs: ['clown', 'chirurgien', 'tortue', 'meduse', 'globe', 'demoiselle', 'raie'].map((id, i) => ({ id, x: Math.random() * w / sa, y: 90 + i * 70, v: (18 + Math.random() * 20) * (i % 2 ? -1 : 1), r: 30 * (ESPECES[id].grand || 1) })),
    poses: [['etoile', 0.15, 640], ['crabe', 0.8, 650], ['coquillage-raye', 0.45, 660], ['anemone', 0.65, 610], ['hippocampe', 0.92, 520]] };
}
function dessinerAccueil(dt) {
  if (!accueil || accueil.w !== window.innerWidth || accueil.h !== window.innerHeight) tailleAccueil();
  const A = accueil, g = ctxA;
  A.t += dt;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(A.fond, 0, 0);
  g.setTransform(A.sa * A.d, 0, 0, A.sa * A.d, 0, 0);
  const lw = A.w / A.sa, px = A.sa * A.d;
  for (const [id, fx, y] of A.poses) { const img = image(id, 30, px); const t = img.width / px; g.drawImage(img, fx * lw - t / 2, y - t / 2, t, t); }
  for (const n of A.nageurs) {
    n.x += n.v * dt;
    if (n.x > lw + 60) n.x = -60; if (n.x < -60) n.x = lw + 60;
    const img = image(n.id, n.r, px); const t = img.width / px;
    g.save(); g.translate(n.x, n.y + Math.sin(A.t * 1.4 + n.r) * 10); if (n.v < 0) g.scale(-1, 1);
    g.drawImage(img, -t / 2, -t / 2, t, t); g.restore();
  }
  g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 2;
  for (let i = 0; i < 12; i++) { const y = H - ((A.t * 40 + i * 97) % H), x = (i * 137) % lw + Math.sin(A.t + i) * 8; g.beginPath(); g.arc(x, y, 3 + (i % 4), 0, Math.PI * 2); g.stroke(); }
}
function majAccueil() {
  const t = totalEtoiles(), c = Object.keys(sauvegarde.collection).length;
  $('total-accueil').textContent = (t || c) ? '★ ' + t + ' / 36   ·   ' + traduire('aquariumN', { n: c, total: LISTE_ESPECES.length }) : '';
}

// ---------------------------------------------------------------------
//  Choix des plongées et aquarium
// ---------------------------------------------------------------------
function ouvrirPlongees() {
  const grille = $('grille-plongees'); grille.innerHTML = '';
  NIVEAUX.forEach((L, i) => {
    const b = document.createElement('button');
    b.className = 'case-plongee';
    const e = sauvegarde.etoiles[i] || 0;
    b.innerHTML = '<b>' + (i + 1) + '</b><small></small><span class="et">' + '★'.repeat(e) + '<i>' + '★'.repeat(3 - e) + '</i></span>';
    b.querySelector('small').textContent = debloque(i) ? L.nom : traduire('gagneEtoile', { n: i });
    b.disabled = !debloque(i);
    b.addEventListener('click', () => { sons.clic(); lancerNiveau(i); });
    grille.appendChild(b);
  });
  afficher('plongees');
  const prems = grille.querySelector('button:not(:disabled)'); if (prems) prems.focus();
}
function ouvrirAquarium() {
  const grille = $('grille-aquarium'); grille.innerHTML = '';
  let n = 0;
  for (const id of LISTE_ESPECES) {
    const connu = !!sauvegarde.collection[id]; if (connu) n++;
    const b = document.createElement('button');
    b.className = 'carte' + (connu ? '' : ' inconnue');
    b.appendChild(icone(id, 64, !connu));
    const t = document.createElement('span'); t.textContent = connu ? ESPECES[id].nom : '???'; b.appendChild(t);
    b.addEventListener('click', () => {
      sons.clic();
      const c = $('fiche-image'), g = c.getContext('2d');
      g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
      g.translate(c.width / 2, c.height / 2); ESPECES[id].dessin(g, 100);
      if (!connu) { g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-atop'; g.fillStyle = '#0b3550'; g.fillRect(0, 0, c.width, c.height); g.globalCompositeOperation = 'source-over'; }
      $('fiche-nom').textContent = connu ? ESPECES[id].nom : traduire('inconnu');
      $('fiche-texte').textContent = connu ? ESPECES[id].fiche : traduire('trouvePourFiche');
      voile('fiche', true); $('fiche-fermer').focus();
    });
    grille.appendChild(b);
  }
  $('compte-aquarium').textContent = traduire('compteAquarium', { n, total: LISTE_ESPECES.length });
  afficher('aquarium');
}
$('fiche-fermer').addEventListener('click', () => { sons.clic(); voile('fiche', false); });

// ---------------------------------------------------------------------
//  Sauvegarde de la progression (module JEL_SAVE) : « Continuer » reprend
//  directement à la plongée sauvegardée (1 à 12). Le score compte par plongée.
// ---------------------------------------------------------------------
const JEU = 'tresors-caches-du-recif';
function jouerDepuisAccueil() {
  // La première plongée débloquée sans étoile, sinon le choix des plongées.
  for (let i = 0; i < NIVEAUX.length; i++) if (debloque(i) && !(sauvegarde.etoiles[i] >= 1)) { lancerNiveau(i); return; }
  ouvrirPlongees();
}
JEL_SAVE.surFermeture(() => { if (ecran === 'jeu' && J && !J.fini) JEL_SAVE.save(JEU, { niveau: J.n + 1, score: 0 }); });
const effacerSauvegarde = JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('accueil').querySelector('.contenu') });

$('bouton-jouer').addEventListener('click', () => {
  sons.clic();
  JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => lancerNiveau(Math.max(1, Math.min(d.niveau, NIVEAUX.length)) - 1),
    onNouvelle: jouerDepuisAccueil,
  });
});
$('bouton-plongees').addEventListener('click', () => { sons.clic(); ouvrirPlongees(); });
$('bouton-aquarium').addEventListener('click', () => { sons.clic(); ouvrirAquarium(); });
document.querySelectorAll('.retour-accueil').forEach((b) => b.addEventListener('click', () => { sons.clic(); afficher('accueil'); }));

majAccueil();
requestAnimationFrame(boucle);
</script>
