  function choisirOutil(k) {
    outil = k; jouer('clic');
    if (k !== 'inspecter') { fermerFiche(); }
    majOutils();
  }
  function majOutils() {
    document.querySelectorAll('.outil').forEach((el) => {
      const k = el.dataset.outil;
      el.classList.toggle('choisi', k === outil);
      el.setAttribute('aria-pressed', k === outil ? 'true' : 'false');
      el.classList.toggle('guide', N === 1 && ((tuto === 0 && k === 'route' && outil !== 'route') || (tuto === 1 && k === 'maison' && outil !== 'maison')));
    });
    let aide;
    if (N === 1 && tuto === 0) aide = t(outil === 'route' ? 'tuto.2' : 'tuto.1');
    else if (N === 1 && tuto === 1) aide = t(outil === 'maison' ? 'tuto.4' : 'tuto.3');
    else if (N === 1 && tuto === 2 && stats.pop === 0) aide = t('tuto.5');
    else aide = t('outil.' + outil) + ' — ' + t('aide.' + outil, BAT[outil] ? { prix: BAT[outil].prix, r: BAT[outil].rayon || 0 } : { pont: PRIX_PONT, arbre: PRIX_DEFRICHER });
    $('aide-outil').textContent = aide;
    const el = document.querySelector('.outil.choisi');
    if (el && el.scrollIntoView) { try { el.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) { /* ancien navigateur */ } }
  }

  function ouvrirFiche(x, y) {
    const cell = grille[y][x], b = cell.b;
    const f = $('fiche-contenu');
    f.textContent = '';
    const h = document.createElement('h3');
    const ajouterP = (txt) => { const p = document.createElement('p'); p.textContent = txt; f.appendChild(p); };
    if (!b) {
      h.textContent = t('terrain.' + cell.ter); f.appendChild(h);
      ajouterP(t('terrain.' + cell.ter + '.aide', { arbre: PRIX_DEFRICHER, ruine: PRIX_DEBLAYER, pont: PRIX_PONT }));
      if (cell.res) ajouterP(t('fiche.reserve', { nom: t('bat.' + cell.res) }));
    } else if (b.type === 'maison') {
      h.textContent = t('maison.niv' + b.niv); f.appendChild(h);
      ajouterP(t('fiche.habitants', { n: CAPACITE[b.niv] }) + ' · ' + t('fiche.bonheur', { n: b.bon }));
      if (b.dem) ajouterP(t('fiche.demande', { nom: t('bat.' + b.dem.type), n: b.dem.reste }));
      if (b.niv === 2 && actif('ecole') && !couvert('ecole', x, y)) ajouterP(t('fiche.besoinEcole'));
      const ul = document.createElement('ul');
      for (const d of b.details || []) {
        const li = document.createElement('li');
        li.className = d.ok ? 'ok' : 'ko';
        const s = document.createElement('span'); s.textContent = t('besoin.' + d.cle);
        const v = document.createElement('b');
        v.textContent = d.delta > 0 ? t('plus', { n: d.delta }) : (d.delta < 0 ? t('moins', { n: -d.delta }) : t(d.ok ? 'fiche.oui' : 'fiche.non'));
        li.append(s, v); ul.appendChild(li);
      }
      f.appendChild(ul);
    } else {
      const def = BAT[b.type];
      h.textContent = t('bat.' + b.type); f.appendChild(h);
      ajouterP(t('aide.' + b.type, { prix: def.prix, r: def.rayon || 0 }));
      if (def.emplois) ajouterP(t('fiche.emplois', { n: def.emplois, p: Math.round(stats.remplissage * 100) }));
      if (def.entretien) ajouterP(t('fiche.entretien', { n: def.entretien }));
      if (b.type !== 'route' && b.type !== 'parc' && !routeA(x, y)) ajouterP(t('fiche.sansRoute'));
      if (b.type === 'route' && cell.ter === 'eau') ajouterP(t('fiche.pont'));
    }
    $('fiche').hidden = false;
    placerFiche();
  }
  function placerFiche() {
    const bas = $('bas').getBoundingClientRect().top;
    $('fiche').style.bottom = (innerHeight - bas + 6) + 'px';
  }
  function fermerFiche() { $('fiche').hidden = true; selection = null; }

  function message(texte, genre) {
    const zone = $('toast');
    // même message déjà affiché : on le relance au lieu de l'empiler
    for (const m of [...zone.children]) if (m.textContent === texte) zone.removeChild(m);
    const d = document.createElement('div');
    d.className = 'msg ' + (genre || '');
    d.textContent = texte;
    zone.appendChild(d);
    while (zone.children.length > 3) zone.removeChild(zone.firstChild);
    setTimeout(() => { if (d.parentNode) d.parentNode.removeChild(d); }, 3300);
    zone.style.top = ($('hud').hidden ? 20 : $('hud').getBoundingClientRect().bottom + 8) + 'px';
  }

  function majSon() {
    for (const id of ['b-son', 'b-son-titre', 'b-son-pause']) {
      const b = $(id);
      b.innerHTML = son ? SVG.sonOui : SVG.sonNon;
      b.setAttribute('aria-pressed', son ? 'false' : 'true');
    }
  }
  function basculerSon(e) {
    if (e) e.currentTarget.blur();
    son = !son;
    if (!son && ac) { try { ac.suspend(); } catch (er) { /* rien */ } }
    try { localStorage.setItem('gouverne-ta-ville-son', son ? '1' : '0'); } catch (er) { /* pas de stockage */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son } }); } catch (er) { /* rien */ }
    majSon();
    jouer('clic');
  }

  // =====================================================================
  // Écrans
  // =====================================================================
  function montrer(id) {
    for (const e of ['ecran-titre', 'ecran-niveaux', 'ecran-intro', 'ecran-pause', 'ecran-fin']) $(e).hidden = e !== id;
    const enPartie = ['intro', 'jeu', 'pause', 'fin'].includes(ecran);
    $('hud').hidden = !enPartie;
    $('bas').hidden = !enPartie;
    if (!enPartie) fermerFiche();
    calerCarte();
    const premier = id && $(id).querySelector('.gros:not([hidden]), button:not([hidden])');
    if (premier) { try { premier.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  }

  function allerTitre() { ecran = 'titre'; enJeu = false; confettis = []; montrer('ecran-titre'); }

  function allerNiveaux() {
    ecran = 'niveaux'; enJeu = false;
    const g = $('grille-niveaux');
    g.textContent = '';
    let total = 0;
    for (let i = 1; i <= NB; i++) {
      const b = document.createElement('button');
      b.className = 'niv';
      const et = progression.etoiles[i - 1] || 0;
      total += et;
      const num = document.createElement('span'); num.textContent = nb(i);
      b.appendChild(num);
      if (i <= progression.debloque) {
        if (et > 0) b.classList.add('fait');
        const e = document.createElement('div'); e.className = 'etoiles-mini';
        e.innerHTML = [1, 2, 3].map((k) => (k <= et ? SVG.etoile : SVG.etoileVide)).join('');
        b.appendChild(e);
        b.setAttribute('aria-label', t('niveaux.aria', { n: i, e: et }));
        b.addEventListener('click', () => { jouer('clic'); demarrerNiveau(i); });
      } else {
        b.disabled = true;
        b.insertAdjacentHTML('beforeend', SVG.cadenas);
        b.setAttribute('aria-label', t('niveaux.ferme', { n: i }));
      }
      g.appendChild(b);
    }
    $('niveaux-total').textContent = t('niveaux.total', { n: total, max: NB * 3 });
    montrer('ecran-niveaux');
  }

  function demarrerNiveau(n) {
    N = Math.max(1, Math.min(NB, n)); L = NIVEAUX[N - 1];
    grille = lireCarte(L.c); H = grille.length; W = grille[0].length;
    for (const [x, y, type] of (L.res || [])) grille[y][x].res = type;
    argent = L.a; mois = 0; tempsMois = 0; taux = 'normal'; dette = 0; sansFeu = 0; sansPanne = 0;
    compteurs = { demandes: 0, feux: 0, reparations: 0 };
    particules = []; confettis = []; selection = null; survol = null;
    curseur = { x: Math.floor(W / 2), y: Math.floor(H / 2), visible: curseur.visible };
    outil = 'route'; tuto = N === 1 ? 0 : 2;
    if (N > progression.debloque) progression.debloque = N;
    enJeu = true;
    calculer();
    ecran = 'intro';
    construireOutils();
    remplirIntro();
    montrer('ecran-intro');
    majHud();
    calerCarte();
  }

  function remplirIntro() {
    $('intro-titre').textContent = t('niveau.titre', { n: N, nom: t('niv.' + N + '.nom') });
    $('intro-texte').textContent = t('niv.' + N + '.texte');
    const ul = $('intro-objectifs');
    ul.textContent = '';
    for (const k of Object.keys(L.o)) {
      const li = document.createElement('li');
      li.innerHTML = SVG[OBJ_ICONE[k]] + '<span></span>';
      li.querySelector('span').textContent = t('obj.' + k, { n: nb(k === 'reserve' ? (L.res || []).length : L.o[k]) });
      ul.appendChild(li);
    }
    $('intro-mandat').textContent = t('intro.mandat', { n: L.m, p: L.p });
    demoCle = NOUVEAUTE[N] || null;
    $('demo-titre').textContent = demoCle ? t('nouveau', { nom: t('demo.' + demoCle + '.titre') }) : t('defi');
    $('demo').hidden = !demoCle;
    $('demo-texte').textContent = demoCle ? '' : t('niv.' + N + '.conseil');
    demoDebut = horloge;
  }

  function lancerPartie() {
    if (ecran !== 'intro') return;
    jouer('clic');
    ecran = 'jeu';
    montrer(null);
    majHud(); majOutils();
  }

  function pause() {
    if (ecran !== 'jeu') return;
    ecran = 'pause';
    if (ac && ac.state === 'running') { try { ac.suspend(); } catch (e) { /* rien */ } }
    document.querySelectorAll('.msg').forEach((m) => { m.style.animationPlayState = 'paused'; });
    montrer('ecran-pause');
  }
  function reprendre() {
    if (ecran !== 'pause') return;
    ecran = 'jeu';
    if (ac && son) { try { ac.resume(); } catch (e) { /* rien */ } }
    document.querySelectorAll('.msg').forEach((m) => { m.style.animationPlayState = 'running'; });
    montrer(null);
    jouer('clic');
  }

  function scoreNiveau() {
    return stats.pop * 10 + Math.max(0, argent) + stats.bonheur * 5 + Math.max(0, L.m - mois) * 20;
  }

  function victoire() {
    ecran = 'fin'; enJeu = false; fermerFiche();
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: N });
    const etoiles = mois <= L.p ? 3 : (mois <= L.p + Math.ceil((L.m - L.p) / 2) ? 2 : 1);
    const score = scoreNiveau();
    const ancien = progression.records[N - 1] || 0;
    const record = score > ancien;
    progression.etoiles[N - 1] = Math.max(progression.etoiles[N - 1] || 0, etoiles);
    if (record) progression.records[N - 1] = score;
    progression.debloque = Math.max(progression.debloque, Math.min(NB, N + 1));
    for (let i = 0; i < NB; i++) { if (progression.etoiles[i] == null) progression.etoiles[i] = 0; if (progression.records[i] == null) progression.records[i] = 0; }
    try { window.JEL_SAVE.save(JEU, donneesSauvegarde(Math.min(N + 1, NB), score)); } catch (e) { /* rien */ }
    // Jeu terminé (dernier niveau gagné, maintenant ou avant) : total des meilleures étoiles.
    if (N === NB || progression.etoiles[NB - 1] > 0) {
      if (window.FMG) window.FMG.reportComplete({ stars: progression.etoiles.reduce((a, b) => a + (b || 0), 0), maxStars: NB * 3 });
    }
    $('fin-titre').textContent = t(N === NB ? 'fin.bravoFinal' : 'fin.victoire');
    $('fin-texte').textContent = N === NB ? t('fin.texteFinal', { n: progression.etoiles.reduce((a, b) => a + (b || 0), 0), max: NB * 3 }) : t('fin.texteVictoire', { nom: t('niv.' + N + '.nom') });
    afficherFin(etoiles, score, record, ancien, true);
    lancerConfettis();
    jouer('victoire');
    for (let k = 1; k <= etoiles; k++) setTimeout(() => jouer('etoile'), 500 + k * 350);
  }

  function defaite(raison) {
    ecran = 'fin'; enJeu = false; fermerFiche();
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: N });
    const score = scoreNiveau();
    $('fin-titre').textContent = t('fin.' + raison);
    const manque = Object.keys(L.o).filter((k) => !avancement(k).ok).map((k) => t('obj.' + k, { n: nb(k === 'reserve' ? (L.res || []).length : L.o[k]) }));
    $('fin-texte').textContent = t('fin.texte.' + raison) + (manque.length ? ' ' + t('fin.manque', { liste: manque.join(' · ') }) : '');
    afficherFin(0, score, false, progression.records[N - 1] || 0, false);
    jouer('defaite');
  }

  function afficherFin(etoiles, score, record, ancien, gagne) {
    const e = $('fin-etoiles');
    e.innerHTML = [1, 2, 3].map((k) => (k <= etoiles ? SVG.etoile : SVG.etoileVide)).join('');
    e.hidden = !gagne;
    [...e.children].forEach((s, i) => setTimeout(() => s.classList.add('vue'), 400 + i * 350));
    $('fin-mois').textContent = t('obj.fraction', { a: mois, b: L.m });
    const r = $('fin-record');
    r.classList.toggle('nouveau', record);
    r.textContent = record ? t('fin.nouveauRecord') : t('fin.record', { n: nb(ancien) });
    $('b-suivant').hidden = !gagne;
    $('b-suivant').textContent = t(N === NB ? 'btn.bilan' : 'btn.suivant');
    $('b-reessayer').hidden = gagne;
    $('b-rejouer').hidden = !gagne;
    $('b-fin-accueil').hidden = gagne;
    // score qui défile
    const debut = performance.now();
    const fs = $('fin-score');
    (function defile(ts) {
      const p = Math.min(1, (ts - debut) / 1200);
      fs.textContent = nb(score * (1 - Math.pow(1 - p, 3)));
      if (p < 1 && ecran === 'fin') requestAnimationFrame(defile);
    })(debut);
    montrer('ecran-fin');
  }

  // =====================================================================
  // Démonstrations animées des nouveautés (petite ville miniature)
  // =====================================================================
  let demoCle = null, demoDebut = 0;
  const dcv = $('demo'), dctx = dcv.getContext('2d');
  function dessinerDemo() {
    if (!demoCle) return;
    const c = dctx, T = 36, ox = 32, oy = 6, cols = 6, lignes = 3;
    const cle = demoCle;
    const duree = cle === 'base' ? 9 : 5;
    const tm = (horloge - demoDebut) % duree;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, 280, 170);
    // mini-grille
    const g = [];
    for (let y = 0; y < lignes; y++) { const r = []; for (let x = 0; x < cols; x++) r.push(nouvelleCase('herbe')); g.push(r); }
    const pose = (x, y, type, niv) => { g[y][x].b = nouveauBat(type, niv == null ? 2 : niv); };
    const OUTIL_DEMO = { base: tm < 4.5 ? 'route' : 'maison', terrain: 'demolir', demandes: 'parc', impots: null, feu: null, pannes: null, pont: 'route', reserve: 'ecole', dechets: 'dechetterie' };
    const outilDemo = cle in OUTIL_DEMO ? OUTIL_DEMO[cle] : cle;
    let cible = { x: 2, y: 2 }, texte = 'demo.' + cle;
    let fait = false, maisonsHeureuses = false;
    if (cle === 'base') {
      // 1 : routes posées une à une ; 2 : maison ; 3 : habitants
      const nRoutes = Math.max(0, Math.min(cols, Math.floor((tm - 1.6) / 0.35) + 1));
      for (let x = 0; x < nRoutes; x++) pose(x, 1, 'route');
      if (tm > 6.5) pose(2, 0, 'maison', tm > 7.4 ? 1 : 0);
      cible = tm < 4.5 ? { x: Math.min(cols - 1, Math.max(0, nRoutes - 1)), y: 1 } : { x: 2, y: 0 };
      texte = tm < 4.5 ? 'demo.base.1' : (tm < 7.4 ? 'demo.base.2' : 'demo.base.3');
      maisonsHeureuses = tm > 7.6;
      fait = true;
    } else {
      for (let x = 0; x < cols; x++) pose(x, 1, 'route');
      pose(0, 0, 'maison'); pose(4, 0, 'maison'); pose(1, 2, 'maison'); pose(5, 2, 'maison');
      if (cle === 'terrain') { g[2][2].ter = 'arbre'; g[0][2].ter = 'eau'; g[2][4].ter = 'roche'; }
      if (cle === 'pont') { for (let y = 0; y < lignes; y++) { g[y][3].ter = 'eau'; g[y][3].b = null; } cible = { x: 3, y: 1 }; }
      if (cle === 'reserve') g[2][2].res = 'ecole';
      if (cle === 'demandes' && tm < 2.1) g[0][0].b.dem = { type: 'parc', reste: 6 };
      if (cle === 'demandes') cible = { x: 1, y: 0 };
      if (cle === 'feu' || cle === 'pannes') cible = { x: 4, y: 0 };
      if (cle === 'pannes') { g[0][4].b = nouveauBat('eau'); if (tm < 2.1) g[0][4].b.panne = true; }
      if (cle === 'feu' && tm < 2.1) g[0][4].b.feu = 1;
      if (cle === 'dechets' && tm < 2.1) for (const [x, y] of [[0, 0], [4, 0], [1, 2], [5, 2]]) g[y][x].b.dechets = true;
      if (cle === 'impots') cible = null;
      if (tm >= 2.1) {
        fait = true;
        if (cle === 'terrain') g[2][2].ter = 'herbe';
        else if (outilDemo && cible && !['feu', 'pannes'].includes(cle)) pose(cible.x, cible.y, outilDemo, 2);
      }
      maisonsHeureuses = fait && cle !== 'usine' && cle !== 'terrain';
    }
    for (let y = 0; y < lignes; y++) for (let x = 0; x < cols; x++) terrain(c, g[y][x], ox + x * T, oy + y * T, T, x, y);
    for (let y = 0; y < lignes; y++) for (let x = 0; x < cols; x++) if (g[y][x].b && g[y][x].b.type === 'route') dessinRoute(c, g, x, y, ox + x * T, oy + y * T, T, g[y][x].ter === 'eau');
    for (let y = 0; y < lignes; y++) for (let x = 0; x < cols; x++) {
      const cell = g[y][x], b = cell.b, px = ox + x * T, py = oy + y * T;
      if (cell.res && !b) { c.setLineDash([4, 3]); c.lineWidth = 2; c.strokeStyle = '#d99a00'; c.strokeRect(px + 2, py + 2, T - 4, T - 4); c.setLineDash([]); dessinBat(c, cell.res, px + 5, py + 5, T - 10, { alpha: 0.35, niv: 2 }); }
      if (!b || b.type === 'route') continue;
      dessinBat(c, b.type, px, py, T, { niv: b.niv, seed: graine(x, y), tm: horloge });
      if (b.feu) flammes(c, px, py, T);
      if (b.panne) signePanne(c, px + T - 8, py + 8, 7);
      if (b.dechets) sacs(c, px, py, T);
      if (b.dem) bulle(c, b.dem.type, px, py + 6, T, 6);
    }
    // zone d'effet et maisons heureuses
    const def = outilDemo && BAT[outilDemo];
    if (fait && cible && def && def.rayon && cle !== 'base') {
      const rCercle = (Math.min(1, (tm - 2.1) / 0.6)) * (def.rayon + 0.5) * T;
      c.beginPath(); c.arc(ox + (cible.x + 0.5) * T, oy + (cible.y + 0.5) * T, Math.max(1, rCercle), 0, Math.PI * 2);
      c.fillStyle = (COULEUR_ZONE[outilDemo] || 'rgba(47,93,158,1)').replace('1)', '.15)'); c.fill();
      c.setLineDash([6, 4]); c.lineWidth = 2; c.strokeStyle = COULEUR_ZONE[outilDemo] || '#2f5d9e'; c.stroke(); c.setLineDash([]);
    }
    if (cle === 'usine' && fait) {
      c.globalAlpha = 0.55; rond(c, ox + 1.5 * T, oy + 2.4 * T, 13, '#7b8591'); rond(c, ox + 4.6 * T, oy + 0.4 * T, 13, '#7b8591'); c.globalAlpha = 1;
    }
    if (maisonsHeureuses) {
      const bond = Math.sin(horloge * 5) * 3;
      for (const [x, y] of (cle === 'base' ? [[2, 0]] : [[0, 0], [4, 0], [1, 2], [5, 2]])) coeur(c, ox + (x + 0.75) * T, oy + y * T + 8 + bond, 6);
    }
    if (cle === 'feu' && tm >= 2.1 && tm < 2.9) for (let k = 0; k < 6; k++) rond(c, ox + 4.5 * T + Math.cos(k) * (tm - 2.1) * 30, oy + 0.5 * T + Math.sin(k) * (tm - 2.1) * 30, 3, '#56b0e6');
    // barre d'outils miniature
    const bx = 6, by = 124;
    if (cle === 'impots') {
      // jauge des impôts : bas, normal, élevé
      const segs = ['#2f9e5b', '#f5b82e', '#d6453d'];
      for (let k = 0; k < 3; k++) { rr(c, 70 + k * 46, by + 6, 42, 26, 8); c.fillStyle = segs[k]; c.fill(); }
      const pos = tm < 2.1 ? 1 : 0;
      c.lineWidth = 4; c.strokeStyle = '#1f2a3d'; rr(c, 70 + pos * 46, by + 6, 42, 26, 8); c.stroke();
      for (let k = 0; k < 3; k++) {
        if (tm >= 2.1) coeur(c, 92 + k * 46, by - 4 - ((tm * 20 + k * 7) % 14), 5);
      }
      const p = mouvement(tm, { x: 250, y: 160 }, { x: 70 + 23, y: by + 20 }, { x: 70 + 23, y: by + 20 });
      main(c, p.x, p.y, p.appui);
    } else {
      if (outilDemo) {
        rr(c, bx, by, 40, 40, 9); c.fillStyle = '#fffaf0'; c.fill();
        const choisi = tm > 1.0 || (cle === 'base' && tm > 0.9);
        c.lineWidth = 3; c.strokeStyle = choisi ? '#2f5d9e' : '#d1d5db'; c.stroke();
        dessinBat(c, outilDemo, bx + 4, by + 4, 32, { niv: 2, seed: 9, tm: 0.3, fume: false });
      }
      let p;
      if (cle === 'base') {
        const local = tm < 4.5 ? tm : tm - 4.5;
        const fin = tm < 4.5 ? { x: ox + (cible.x + 0.5) * T, y: oy + 1.5 * T } : { x: ox + 2.5 * T, y: oy + 0.5 * T };
        p = mouvement(local, { x: 250, y: 160 }, { x: bx + 20, y: by + 20 }, fin);
      } else if (cle === 'feu' || cle === 'pannes') {
        p = mouvement(tm, { x: 250, y: 160 }, { x: 250, y: 160 }, { x: ox + 4.5 * T, y: oy + 0.5 * T });
      } else {
        p = mouvement(tm, { x: 250, y: 160 }, { x: bx + 20, y: by + 20 }, { x: ox + (cible.x + 0.5) * T, y: oy + (cible.y + 0.5) * T });
      }
      main(c, p.x, p.y, p.appui);
    }
    const txt = t(texte);
    const el = $('demo-texte');
    if (el.textContent !== txt) el.textContent = txt;
  }
  // Trajet de la main : vers l'outil (0,8 s), toucher, vers la case (2 s), toucher
  function mouvement(tm, depart, outilPos, casePos) {
    const lisse = (a) => a * a * (3 - 2 * a);
    const mix = (a, b, k) => ({ x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k });
    if (tm < 0.8) return { ...mix(depart, outilPos, lisse(tm / 0.8)), appui: false };
    if (tm < 1.1) return { ...outilPos, appui: true };
    if (tm < 1.9) return { ...mix(outilPos, casePos, lisse((tm - 1.1) / 0.8)), appui: false };
    if (tm < 2.3) return { ...casePos, appui: tm > 1.95 && tm < 2.25 };
    return { ...casePos, appui: false };
  }

  // =====================================================================
  // Commandes : toucher, souris, clavier
  // =====================================================================
  let appuye = false, derniereCase = null;
  function caseSous(e) {
    const x = Math.floor((e.clientX - geo.ox) / geo.T), y = Math.floor((e.clientY - geo.oy) / geo.T);
    if (x < 0 || y < 0 || x >= W || y >= H) return null;
    return { x, y };
  }
  cv.addEventListener('pointerdown', (e) => {
    if (ecran !== 'jeu') return;
    const p = caseSous(e);
    curseur.visible = false;
    if (!p) { fermerFiche(); return; }
    appuye = true; derniereCase = p;
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
    agir(p.x, p.y, false);
  });
  cv.addEventListener('pointermove', (e) => {
    if (ecran !== 'jeu') return;
    const p = caseSous(e);
    survol = e.pointerType === 'mouse' ? p : null;
    if (!appuye || !p) return;
    if (derniereCase && p.x === derniereCase.x && p.y === derniereCase.y) return;
    derniereCase = p;
    if (outil === 'route' || outil === 'demolir') agir(p.x, p.y, true);
  });
  const lacher = () => { appuye = false; derniereCase = null; };
  cv.addEventListener('pointerup', lacher);
  cv.addEventListener('pointercancel', lacher);
  cv.addEventListener('pointerleave', () => { survol = null; });

  document.addEventListener('keydown', (e) => {
    const code = e.code;
    const surBouton = e.target && e.target.tagName === 'BUTTON';
    if (ecran === 'jeu') {
      if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); pause(); return; }
      const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
      if (dirs[code]) {
        e.preventDefault();
        if (curseur.visible) {
          curseur.x = Math.max(0, Math.min(W - 1, curseur.x + dirs[code][0]));
          curseur.y = Math.max(0, Math.min(H - 1, curseur.y + dirs[code][1]));
        }
        curseur.visible = true;
        if (selection && outil === 'inspecter') { selection = { x: curseur.x, y: curseur.y }; ouvrirFiche(curseur.x, curseur.y); }
        return;
      }
      if ((code === 'Enter' || code === 'Space' || code === 'NumpadEnter') && !surBouton) {
        e.preventDefault(); curseur.visible = true; agir(curseur.x, curseur.y, false); return;
      }
      const liste = outilsDuNiveau();
      const m = /^(?:Digit|Numpad)(\d)$/.exec(code);
      if (m) { const i = (Number(m[1]) + 9) % 10; if (liste[i]) choisirOutil(liste[i]); return; }
      if (code === 'KeyT') { choisirOutil(liste[(liste.indexOf(outil) + 1) % liste.length]); return; }
      if (code === 'KeyI') { choisirOutil('inspecter'); return; }
      if (code === 'KeyD') { choisirOutil('demolir'); return; }
      if (code === 'KeyV') { changerVitesse(); return; }
      if (code === 'KeyR' && actif('impots')) { changerImpots(); return; }
      return;
    }
    if (ecran === 'pause' && (code === 'Escape' || code === 'KeyP')) { e.preventDefault(); reprendre(); return; }
    if (ecran === 'intro' && (code === 'Enter' || code === 'Space') && !surBouton) { e.preventDefault(); lancerPartie(); return; }
    if (ecran === 'titre' && (code === 'Enter' || code === 'Space') && !surBouton) { e.preventDefault(); boutonJouer(); }
  });

  function changerVitesse() {
    vitesse = vitesse === 1 ? 2 : (vitesse === 2 ? 3 : 1);
    jouer('clic'); majHud();
  }

  function boutonJouer() {
    jouer('clic');
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => {
        progression.debloque = Math.max(progression.debloque, Math.min(NB, d.niveau));
        demarrerNiveau(Math.min(NB, d.niveau));
      },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { progression = { debloque: 1, etoiles: [], records: [] }; demarrerNiveau(1); },
    });
  }

  // Boutons
  $('b-jouer').addEventListener('click', boutonJouer);
  $('b-niveaux-titre').addEventListener('click', () => { jouer('clic'); allerNiveaux(); });
  $('b-niveaux-accueil').addEventListener('click', () => { jouer('clic'); allerTitre(); });
  $('b-go').addEventListener('click', lancerPartie);
  $('b-pause').addEventListener('click', (e) => { e.currentTarget.blur(); pause(); });
  $('b-reprendre').addEventListener('click', reprendre);
  $('b-recommencer').addEventListener('click', () => { jouer('clic'); demarrerNiveau(N); });
  $('b-pause-niveaux').addEventListener('click', () => { jouer('clic'); allerNiveaux(); });
  $('b-pause-accueil').addEventListener('click', () => { jouer('clic'); allerTitre(); });
  $('b-vitesse').addEventListener('click', (e) => { e.currentTarget.blur(); changerVitesse(); });
  for (const id of ['b-son', 'b-son-titre', 'b-son-pause']) $(id).addEventListener('click', basculerSon);
  $('b-suivant').addEventListener('click', () => { jouer('clic'); if (N >= NB) allerNiveaux(); else demarrerNiveau(N + 1); });
  $('b-reessayer').addEventListener('click', () => { jouer('clic'); demarrerNiveau(N); });
  $('b-rejouer').addEventListener('click', () => { jouer('clic'); demarrerNiveau(N); });
  $('b-fin-niveaux').addEventListener('click', () => { jouer('clic'); allerNiveaux(); });
  $('b-fin-accueil').addEventListener('click', () => { jouer('clic'); allerTitre(); });
  $('fiche-fermer').innerHTML = SVG.croix;
  $('fiche-fermer').addEventListener('click', () => { fermerFiche(); jouer('clic'); });
  $('b-pause').innerHTML = SVG.pause;

  // Pause automatique quand l'écran est caché
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  // Sauvegarde à la fermeture, seulement pendant une partie
  window.JEL_SAVE.surFermeture(() => {
    if (enJeu) window.JEL_SAVE.save(JEU, donneesSauvegarde(N, scoreNiveau()));
  });

  window.addEventListener('resize', () => { redimensionner(); if (!$('fiche').hidden) placerFiche(); });
  redimensionner();
  majSon();
  montrer('ecran-titre');
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
