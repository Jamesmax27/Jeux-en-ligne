  "niv.24.conseil": "Alles zählt: Dienste, Wohnblocks, reservierte Grundstücke und Zufriedenheit. Nimm dir Zeit, jedes Gebäude gut zu platzieren."
 }
}
</script>
<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

    c.fillStyle = 'rgba(0,0,0,.15)'; c.beginPath(); c.ellipse(x, y + r * 1.05, r * 0.9, r * 0.3, 0, 0, Math.PI * 2); c.fill();
    rect(c, x - r * 0.15, y, r * 0.3, r, '#7a4b2a');
    rond(c, x, y - r * 0.1, r, '#3f8f3a');
    rond(c, x - r * 0.3, y - r * 0.4, r * 0.45, '#5fb24e');
  }
  function terrain(c, cell, x, y, T, gx, gy) {
    const s = graine(gx, gy);
    if (cell.ter === 'eau') {
      c.fillStyle = '#56b0e6'; c.fillRect(x, y, T + 0.5, T + 0.5);
      c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = Math.max(1, T * 0.04);
      for (let k = 0; k < 2; k++) {
        const ox = ((horloge * 0.25 + k * 0.5 + (s & 7) / 8) % 1) * T;
        const oy = y + T * (0.3 + k * 0.4);
        c.beginPath(); c.moveTo(x + ox - T * 0.15, oy); c.quadraticCurveTo(x + ox, oy - T * 0.08, x + ox + T * 0.15, oy); c.stroke();
      }
      return;
    }
    herbe(c, x, y, T, gx, gy);
    if (cell.ter === 'arbre') {
      arbre(c, x + T * (0.3 + (s & 3) * 0.03), y + T * 0.38, T * 0.2);
      arbre(c, x + T * 0.7, y + T * (0.55 + ((s >> 2) & 3) * 0.03), T * 0.22);
    } else if (cell.ter === 'roche') {
      poly(c, [x + T * 0.12, y + T * 0.85, x + T * 0.25, y + T * 0.35, x + T * 0.55, y + T * 0.2, x + T * 0.85, y + T * 0.5, x + T * 0.9, y + T * 0.85], '#9ca3af');
      poly(c, [x + T * 0.25, y + T * 0.35, x + T * 0.55, y + T * 0.2, x + T * 0.6, y + T * 0.45, x + T * 0.35, y + T * 0.5], '#c4c9cf');
    } else if (cell.ter === 'ruine') {
      c.fillStyle = '#b8a98f'; rr(c, x + T * 0.12, y + T * 0.3, T * 0.76, T * 0.6, T * 0.08); c.fill();
      rect(c, x + T * 0.2, y + T * 0.5, T * 0.2, T * 0.12, '#8b8478');
      rect(c, x + T * 0.5, y + T * 0.62, T * 0.25, T * 0.1, '#6e6a63');
      c.save(); c.translate(x + T * 0.5, y + T * 0.45); c.rotate(-0.4); rect(c, -T * 0.25, -T * 0.03, T * 0.5, T * 0.07, '#4a3a2a'); c.restore();
    }
  }

  // Route : morceaux reliés aux routes voisines ; pont si la case est de l'eau
  function dessinRoute(c, g, gx, gy, x, y, T, pont) {
    const est = (dx, dy) => { const v = g[gy + dy] && g[gy + dy][gx + dx]; return !!(v && v.b && v.b.type === 'route'); };
    const n = est(0, -1), s = est(0, 1), o = est(-1, 0), e = est(1, 0);
    const w = T * 0.6, m = (T - w) / 2;
    c.fillStyle = pont ? '#b48448' : '#6b7280';
    c.fillRect(x + m, y + m, w, w);
    if (n) c.fillRect(x + m, y, w, m + 0.5);
    if (s) c.fillRect(x + m, y + m + w - 0.5, w, m + 0.5);
    if (o) c.fillRect(x, y + m, m + 0.5, w);
    if (e) c.fillRect(x + m + w - 0.5, y + m, m + 0.5, w);
    const cx = x + T / 2, cy = y + T / 2;
    c.strokeStyle = pont ? '#7a5528' : '#f4f1e6'; c.lineWidth = Math.max(1, T * 0.045);
    c.setLineDash(pont ? [] : [T * 0.12, T * 0.1]);
    c.beginPath();
    if (n || s) { c.moveTo(cx, n ? y : cy); c.lineTo(cx, s ? y + T : cy); }
    if (o || e) { c.moveTo(o ? x : cx, cy); c.lineTo(e ? x + T : cx, cy); }
    if (!n && !s && !o && !e) { c.moveTo(cx - T * 0.15, cy); c.lineTo(cx + T * 0.15, cy); }
    c.stroke(); c.setLineDash([]);
    if (pont) {
      c.strokeStyle = '#6a4a22'; c.lineWidth = Math.max(1.5, T * 0.05);
      c.beginPath();
      if (o || e || (!n && !s)) { c.moveTo(x, y + m); c.lineTo(x + T, y + m); c.moveTo(x, y + m + w); c.lineTo(x + T, y + m + w); }
      if (n || s) { c.moveTo(x + m, y); c.lineTo(x + m, y + T); c.moveTo(x + m + w, y); c.lineTo(x + m + w, y + T); }
      c.stroke();
    }
  }

  // Petits signes au-dessus des bâtiments (sans texte)
  function signeGoutte(c, x, y, r) {
    rond(c, x, y, r, '#fff');
    c.beginPath(); c.moveTo(x, y - r * 0.65); c.quadraticCurveTo(x + r * 0.6, y + r * 0.1, x, y + r * 0.55); c.quadraticCurveTo(x - r * 0.6, y + r * 0.1, x, y - r * 0.65); c.fillStyle = '#3a85c7'; c.fill();
    barre(c, x, y, r);
  }
  function signeEclair(c, x, y, r) {
    rond(c, x, y, r, '#fff');
    poly(c, [x + r * 0.15, y - r * 0.7, x - r * 0.4, y + r * 0.1, x, y + r * 0.1, x - r * 0.15, y + r * 0.7, x + r * 0.4, y - r * 0.1, x, y - r * 0.1], '#f2b705');
    barre(c, x, y, r);
  }
  function signeRoute(c, x, y, r) {
    rond(c, x, y, r, '#fff');
    rect(c, x - r * 0.55, y - r * 0.25, r * 1.1, r * 0.5, '#6b7280');
    barre(c, x, y, r);
  }
  function barre(c, x, y, r) {
    c.strokeStyle = '#d6453d'; c.lineWidth = Math.max(1.5, r * 0.22);
    c.beginPath(); c.arc(x, y, r * 0.92, 0, Math.PI * 2); c.moveTo(x - r * 0.65, y - r * 0.65); c.lineTo(x + r * 0.65, y + r * 0.65); c.stroke();
  }
  function flammes(c, x, y, T) {
    for (let k = 0; k < 3; k++) {
      const fx = x + T * (0.28 + k * 0.22), base = y + T * 0.8;
      const h = T * (0.45 + 0.12 * Math.sin(horloge * 12 + k * 2));
      c.beginPath(); c.moveTo(fx - T * 0.12, base); c.quadraticCurveTo(fx - T * 0.1, base - h * 0.6, fx, base - h);
      c.quadraticCurveTo(fx + T * 0.1, base - h * 0.6, fx + T * 0.12, base); c.closePath(); c.fillStyle = '#ff7a1a'; c.fill();
      c.beginPath(); c.moveTo(fx - T * 0.06, base); c.quadraticCurveTo(fx - T * 0.05, base - h * 0.35, fx, base - h * 0.55);
      c.quadraticCurveTo(fx + T * 0.05, base - h * 0.35, fx + T * 0.06, base); c.closePath(); c.fillStyle = '#ffd23f'; c.fill();
    }
    c.globalAlpha = 0.5; rond(c, x + T * 0.55, y + T * (0.05 - (horloge % 1) * 0.15), T * 0.13, '#555'); c.globalAlpha = 1;
  }
  function signePanne(c, x, y, r) {
    rond(c, x, y, r, (Math.floor(horloge * 3) % 2) ? '#ffd34d' : '#fff');
    c.save(); c.translate(x, y); c.rotate(-0.7);
    rect(c, -r * 0.14, -r * 0.2, r * 0.28, r * 0.85, '#4b5563');
    c.beginPath(); c.arc(0, -r * 0.35, r * 0.32, 0.6, Math.PI * 2 - 0.6 + Math.PI); c.lineWidth = r * 0.22; c.strokeStyle = '#4b5563'; c.stroke();
    c.restore();
  }
  function sacs(c, x, y, T) {
    for (let k = 0; k < 2; k++) {
      const sx = x + T * (0.72 + k * 0.14), sy = y + T * 0.86;
      rond(c, sx, sy, T * 0.09, '#2f4f3a'); rect(c, sx - T * 0.02, sy - T * 0.13, T * 0.04, T * 0.05, '#2f4f3a');
    }
  }
  function coeur(c, x, y, r, couleur) {
    c.beginPath(); c.moveTo(x, y + r * 0.9);
    c.bezierCurveTo(x - r * 1.6, y - r * 0.1, x - r * 0.6, y - r * 1.2, x, y - r * 0.35);
    c.bezierCurveTo(x + r * 0.6, y - r * 1.2, x + r * 1.6, y - r * 0.1, x, y + r * 0.9);
    c.fillStyle = couleur || '#ff5c8a'; c.fill();
  }
  function bulle(c, type, x, y, T, reste) {
    const w = T * 0.78, h = T * 0.66, bx = x + T / 2 - w / 2, by = y - h * 0.62 + Math.sin(horloge * 3) * T * 0.03;
    rr(c, bx, by, w, h, T * 0.14); c.fillStyle = '#fff'; c.fill();
    c.lineWidth = Math.max(1.5, T * 0.04); c.strokeStyle = reste <= 3 ? '#d6453d' : '#2f5d9e'; c.stroke();
    poly(c, [x + T * 0.42, by + h - 1, x + T * 0.5, by + h + T * 0.12, x + T * 0.58, by + h - 1], '#fff');
    dessinBat(c, type, bx + w / 2 - h * 0.42, by + h * 0.08, h * 0.84, { niv: 2, seed: 5, tm: horloge, fume: false });
    // temps restant : petit arc
    c.beginPath(); c.arc(bx + w, by, T * 0.1, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0, reste) / 8);
    c.lineWidth = Math.max(2, T * 0.06); c.strokeStyle = reste <= 3 ? '#d6453d' : '#2f9e5b'; c.stroke();
  }
  function main(c, x, y, appui) {
    // main qui montre du doigt (bout du doigt en x, y)
    c.save(); c.translate(x, y); const k = appui ? 0.9 : 1; c.scale(k, k);
    c.fillStyle = '#fff'; c.strokeStyle = '#1f2a3d'; c.lineWidth = 2;
    c.beginPath();
    c.moveTo(-4, 2); c.lineTo(-4, 16); c.lineTo(-12, 12); c.quadraticCurveTo(-16, 14, -12, 19);
    c.lineTo(-2, 32); c.lineTo(14, 32); c.quadraticCurveTo(19, 26, 18, 18); c.lineTo(18, 13);
    c.quadraticCurveTo(14, 9, 10, 13); c.quadraticCurveTo(7, 9, 3, 12); c.lineTo(3, 2);
    c.quadraticCurveTo(-0.5, -3, -4, 2); c.closePath(); c.fill(); c.stroke();
    c.restore();
  }

  // =====================================================================
  // Construction d'une grille à partir d'une carte
  // =====================================================================
  function nouvelleCase(ter) { return { ter, b: null, res: null }; }
  function nouveauBat(type, niv) { return { type, niv: niv || 0, feu: 0, panne: false, dem: null, joie: 0, colere: 0, dechets: false, bon: 0, anim: -10 }; }
  function lireCarte(lignes) {
    const g = [];
    for (let y = 0; y < lignes.length; y++) {
      const rang = [];
      for (let x = 0; x < lignes[y].length; x++) {
        const ch = lignes[y][x];
        let cell;
        switch (ch) {
          case 'T': cell = nouvelleCase('arbre'); break;
          case 'W': cell = nouvelleCase('eau'); break;
          case 'R': cell = nouvelleCase('roche'); break;
          case '#': cell = nouvelleCase('eau'); cell.b = nouveauBat('route'); break;
          default: cell = nouvelleCase('herbe');
        }
        const types = { '=': 'route', h: 'maison', i: 'maison', c: 'commerce', u: 'usine', e: 'eau', l: 'elec', p: 'parc', s: 'ecole', f: 'caserne', m: 'sante', d: 'dechetterie', S: 'stade' };
        if (types[ch]) cell.b = nouveauBat(types[ch], ch === 'i' ? 3 : (ch === 'h' ? 1 : 0));
        rang.push(cell);
      }
      g.push(rang);
    }
    return g;
  }

  // =====================================================================
  // Calcul de la ville : couvertures, emplois, bonheur
  // =====================================================================
  function actif(cle) { return N >= (MECA[cle] != null ? MECA[cle] : (BAT[cle] ? BAT[cle].debloque : 99)); }
  function routeA(x, y) {
    const v = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (const [dx, dy] of v) {
      const r = grille[y + dy] && grille[y + dy][x + dx];
      if (r && r.b && r.b.type === 'route') return true;
    }
    return false;
  }
  function fonctionne(b, x, y) {
    if (!b || b.feu || b.panne) return false;
    if (b.type === 'route' || b.type === 'parc') return true;
    return routeA(x, y);
  }
  function dansRayon(dx, dy, r) { return dx * dx + dy * dy <= r * r + r; }
  function couvert(type, x, y) { const a = couverture[type]; return !!(a && a[y * W + x]); }

  function calculer() {
    couverture = {};
    let emplois = 0, pop = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const b = grille[y][x].b;
      if (!b) continue;
      if (!fonctionne(b, x, y)) continue;
      const def = BAT[b.type];
      if (def.emplois) emplois += def.emplois;
      if (b.type === 'maison') pop += CAPACITE[b.niv];
      if (def.rayon) {
        const a = couverture[b.type] || (couverture[b.type] = new Uint8Array(W * H));
        for (let yy = Math.max(0, y - def.rayon); yy <= Math.min(H - 1, y + def.rayon); yy++)
          for (let xx = Math.max(0, x - def.rayon); xx <= Math.min(W - 1, x + def.rayon); xx++)
            if (dansRayon(xx - x, yy - y, def.rayon)) a[yy * W + xx] = 1;
      }
    }
    const besoin = Math.ceil(pop * 0.5);
    stats.pop = pop; stats.emplois = emplois; stats.besoin = besoin;
    stats.ratio = besoin ? Math.min(1, emplois / besoin) : 1;
    stats.remplissage = emplois ? Math.min(1, besoin / emplois) : 0;
    let somme = 0, poids = 0, sommeSimple = 0, nbMaisons = 0, imm = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const b = grille[y][x].b;
      if (!b || b.type !== 'maison') continue;
      const r = bonheurMaison(b, x, y);
      b.bon = r.val; b.details = r.details;
      if (b.niv === 3 && !b.feu) imm++;
      if (routeA(x, y)) { nbMaisons++; sommeSimple += r.val; }
      if (fonctionne(b, x, y) && b.niv > 0) { somme += r.val * CAPACITE[b.niv]; poids += CAPACITE[b.niv]; }
    }
    stats.bonheur = poids ? Math.round(somme / poids) : (nbMaisons ? Math.round(sommeSimple / nbMaisons) : 0);
    stats.immeubles = imm;
  }

  // Bonheur d'une maison (0 à 100) et détail de ses besoins
  function bonheurMaison(b, x, y) {
    const d = [];
    let v = 70;
    const ajoute = (cle, ok, delta) => { d.push({ cle, ok, delta }); v += delta; };
    if (!routeA(x, y)) { d.push({ cle: 'route', ok: false, delta: 0 }); return { val: 0, details: d }; }
    d.push({ cle: 'route', ok: true, delta: 0 });
    if (actif('commerce')) {
      const manque = Math.round(25 * (1 - stats.ratio));
      ajoute('emplois', manque === 0, -manque);
      const proche = couvert('commerce', x, y);
      ajoute('commerce', proche, proche ? 6 : -6);
    }
    if (actif('eau')) { const ok = couvert('eau', x, y); ajoute('eau', ok, ok ? 0 : -30); }
    if (actif('elec')) { const ok = couvert('elec', x, y); ajoute('elec', ok, ok ? 0 : -30); }
    if (actif('usine') && couvert('usine', x, y)) ajoute('pollution', false, couvert('parc', x, y) ? -10 : -22);
    if (actif('parc')) { const ok = couvert('parc', x, y); if (ok) ajoute('parc', true, 10); }
    if (actif('impots')) ajoute('impots', taux !== 'haut', taux === 'bas' ? 8 : (taux === 'haut' ? -12 : 0));
    if (actif('ecole')) { const ok = couvert('ecole', x, y); ajoute('ecole', ok, ok ? 6 : -10); }
    if (actif('sante')) { const ok = couvert('sante', x, y); ajoute('sante', ok, ok ? 6 : -12); }
    if (actif('dechets')) { const ok = couvert('dechetterie', x, y); ajoute('dechets', ok, ok ? 0 : -15); }
    if (actif('stade') && couvert('stade', x, y)) ajoute('stade', true, 12);
    if (b.joie > 0) ajoute('joie', true, 10);
    if (b.colere > 0) ajoute('colere', false, -12);
    return { val: Math.max(0, Math.min(100, v)), details: d };
  }

  // =====================================================================
  // Fin d'un mois : argent, croissance, besoins, incendies, pannes
  // =====================================================================
  function finMois() {
    calculer();
    let revenus = stats.pop * TAUX[taux], entretien = 0;
    const toasts = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const b = grille[y][x].b; if (!b) continue;
      const def = BAT[b.type];
      if (def.entretien) entretien += def.entretien;
      if (def.revenu && fonctionne(b, x, y)) revenus += def.revenu * stats.remplissage;
    }
    const net = Math.round(revenus - entretien);
    argent += net;
    if (net !== 0) flotteHud(net > 0 ? t('plus', { n: nb(net) }) : t('moins', { n: nb(-net) }), net >= 0 ? '#1d7842' : '#be342d');
    jouer('mois', net);

    // Maisons : arrivées, croissance, départs
    let grandi = false;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const b = grille[y][x].b; if (!b || b.type !== 'maison') continue;
      if (b.joie > 0) b.joie--;
      if (b.colere > 0) b.colere--;
      if (b.feu) continue;
      if (!routeA(x, y)) { b.niv = 0; continue; }
      const bon = b.bon;
      const ecoleOk = !actif('ecole') || couvert('ecole', x, y);
      if (b.niv === 0 && bon >= 40) { b.niv = 1; b.anim = horloge; grandi = true; etincelles(x, y); }
      else if (b.niv === 1 && bon >= 65 && Math.random() < 0.75) { b.niv = 2; b.anim = horloge; grandi = true; etincelles(x, y); }
      else if (b.niv === 2 && bon >= 75 && ecoleOk && Math.random() < 0.7) { b.niv = 3; b.anim = horloge; grandi = true; etincelles(x, y); }
      else if (bon < 40 && b.niv > 0) { b.niv--; b.anim = horloge; nuage(x, y); }
      if (bon >= 80 && b.niv > 0 && Math.random() < 0.5) particule(x, y, 'coeur');
    }
    if (grandi) jouer('grandit');

    // Besoins exprimés par les habitants
    if (actif('demandes')) {
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const b = grille[y][x].b; if (!b || !b.dem) continue;
        if (couvert(b.dem.type, x, y)) {
          b.dem = null; b.joie = 6; compteurs.demandes++; argent += 40;
          particule(x, y, 'coeur'); particule(x, y, 'coeur'); particuleTexte(x, y, t('plus', { n: 40 }), '#1d7842');
          toasts.push([t('msg.demandeOk'), 'bon']); jouer('satisfait');
        } else if (--b.dem.reste <= 0) {
          b.dem = null; b.colere = 6; toasts.push([t('msg.demandeRatee'), 'mal']);
        }
      }
      const intervalle = L.dem || 4;
      if (mois >= 1 && (mois + 1) % intervalle === 0) nouvelleDemande(toasts);
    }

    // Incendies
    if (actif('feu')) {
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const b = grille[y][x].b; if (!b || !b.feu) continue;
        if (couvert('caserne', x, y)) {
          b.feu = 0; compteurs.feux++; eclaboussure(x, y); toasts.push([t('msg.caserne'), 'bon']); jouer('eteint');
        } else if (++b.feu >= 4) {
          grille[y][x].b = null; grille[y][x].ter = grille[y][x].ter === 'eau' ? 'eau' : 'ruine';
          toasts.push([t('msg.ruine'), 'mal']); nuage(x, y);
        }
      }
      sansFeu++;
      const risque = L.feu || 0.2;
      const force = L.o.feux && compteurs.feux < L.o.feux && sansFeu >= 4;
      if (mois >= 2 && (Math.random() < risque || force)) {
        const cible = auHasard((b) => b.type !== 'route' && b.type !== 'parc' && !b.feu);
        if (cible) { cible.b.feu = 1; sansFeu = 0; toasts.push([t('msg.feu'), 'mal']); jouer('feu'); }
      }
    }

    // Pannes
    if (actif('pannes')) {
      sansPanne++;
      const force = L.o.reparations && compteurs.reparations < L.o.reparations && sansPanne >= 4;
      if (mois >= 2 && (Math.random() < (L.pan || 0.25) || force)) {
        const cible = auHasard((b) => SERVICES_PANNE.includes(b.type) && !b.panne && !b.feu);
        if (cible) { cible.b.panne = true; sansPanne = 0; toasts.push([t('msg.panne', { nom: t('bat.' + cible.b.type) }), 'mal']); jouer('panne'); }
      }
    }

    mois++;
    calculer();
    if (actif('dechets')) {
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const b = grille[y][x].b; if (b && b.type === 'maison') b.dechets = b.niv > 0 && !couvert('dechetterie', x, y);
      }
    }
    // Le conseiller du maire : le besoin le plus souvent oublié quand le bonheur baisse
    if (stats.pop > 0 && stats.bonheur < 65 && mois % 3 === 0 && toasts.length < 3) {
      const manques = {};
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const b = grille[y][x].b; if (!b || b.type !== 'maison' || !b.details) continue;
        for (const d of b.details) if (!d.ok) manques[d.cle] = (manques[d.cle] || 0) + 1;
      }
      const pire = Object.keys(manques).sort((a, b) => manques[b] - manques[a])[0];
      if (pire) toasts.push([t('conseil.' + pire), '']);
    }
    toasts.slice(0, 3).forEach(([m, k]) => message(m, k));
    majHud();
    if (N === 1) majOutils();

    // Fin du niveau ?
    if (objectifsAtteints()) { victoire(); return; }
    if (argent < 0) {
      dette++;
      if (dette >= 3) { defaite('faillite'); return; }
      message(t('msg.dette', { n: 3 - dette }), 'mal');
    } else dette = 0;
    if (mois >= L.m) defaite('temps');
  }

  function auHasard(filtre) {
    const liste = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const b = grille[y][x].b;
      if (b && filtre(b, x, y)) liste.push({ b, x, y });
    }
    return liste.length ? liste[aleatoire(liste.length)] : null;
  }

  function nouvelleDemande(toasts) {
    const choix = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const b = grille[y][x].b;
      if (!b || b.type !== 'maison' || b.niv === 0 || b.dem || b.feu) continue;
      const manques = DEMANDABLES.filter((k) => actif(k) && !couvert(k, x, y));
      if (manques.length) choix.push({ b, x, y, manques });
    }
    if (!choix.length) return;
    const m = choix[aleatoire(choix.length)];
    const type = m.manques[aleatoire(m.manques.length)];
    m.b.dem = { type, reste: 8 };
    toasts.push([t('msg.demande', { nom: t('bat.' + type) }), '']);
    jouer('demande');
  }

  function objectifsAtteints() {
    return Object.keys(L.o).every((k) => avancement(k).ok);
  }
  function avancement(k) {
    const but = L.o[k];
    switch (k) {
      case 'pop': return { a: stats.pop, b: but, ok: stats.pop >= but };
      case 'bonheur': return { a: stats.bonheur, b: but, ok: stats.pop > 0 && stats.bonheur >= but };
      case 'argent': return { a: Math.max(0, argent), b: but, ok: argent >= but };
      case 'demandes': return { a: compteurs.demandes, b: but, ok: compteurs.demandes >= but };
      case 'immeubles': return { a: stats.immeubles, b: but, ok: stats.immeubles >= but };
      case 'feux': return { a: compteurs.feux, b: but, ok: compteurs.feux >= but };
      case 'reparations': return { a: compteurs.reparations, b: but, ok: compteurs.reparations >= but };
      case 'reserve': {
        const res = L.res || [];
        const faits = res.filter(([x, y, type]) => grille[y][x].b && grille[y][x].b.type === type).length;
        return { a: faits, b: res.length, ok: faits >= res.length };
      }
    }
    return { a: 0, b: but, ok: false };
  }

  // =====================================================================
  // Actions du joueur sur une case
  // =====================================================================
  function agir(x, y, glisse) {
    if (ecran !== 'jeu') return;
    const cell = grille[y][x];
    if (cell.b && cell.b.feu) { eteindre(x, y); return; }
    if (cell.b && cell.b.panne) { reparer(x, y); return; }
    if (outil === 'inspecter') { selection = { x, y }; ouvrirFiche(x, y); jouer('clic'); return; }
    if (outil === 'demolir') { demolir(x, y, glisse); return; }
    construire(outil, x, y, glisse);
  }

  function refuser(cle, vars, glisse) {
    if (glisse) return;
    message(t(cle, vars), 'mal');
    jouer('erreur');
  }

  function construire(type, x, y, glisse) {
    const cell = grille[y][x];
    if (cell.b) { if (!glisse || cell.b.type !== type) refuser('err.occupe', null, glisse); return; }
    if (cell.ter === 'roche') return refuser('err.roche', null, glisse);
    if (cell.ter === 'arbre') return refuser('err.arbre', null, glisse);
    if (cell.ter === 'ruine') return refuser('err.ruine', null, glisse);
    let prix = BAT[type].prix;
    if (cell.ter === 'eau') {
      if (type === 'route' && actif('pont')) prix = PRIX_PONT;
      else return refuser(type === 'route' ? 'err.pont' : 'err.eau', null, glisse);
    }
    if (cell.res && cell.res !== type) return refuser('err.reserve', { nom: t('bat.' + cell.res) }, false);
    if (argent < prix) { pasAssez(); return; }
    argent -= prix;
    cell.b = nouveauBat(type, 0);
    cell.b.anim = horloge;
    particuleTexte(x, y, t('moins', { n: prix }), '#be342d');
    poussiere(x, y);
    jouer(type === 'route' ? 'route' : 'pose');
    calculer();
    if (type !== 'route' && type !== 'parc' && !routeA(x, y)) message(t('msg.sansRoute'), 'mal');
    if (tuto === 0 && type === 'route') { tuto = 1; majOutils(); }
    else if (tuto === 1 && type === 'maison') { tuto = 2; majOutils(); }
    majHud();
    if (selection) ouvrirFiche(selection.x, selection.y);
  }

  function demolir(x, y, glisse) {
    const cell = grille[y][x];
    if (cell.b) {
      const prix = (cell.b.type === 'route' && cell.ter === 'eau') ? PRIX_PONT : BAT[cell.b.type].prix;
      const rendu = Math.floor(prix / 2);
      argent += rendu;
      cell.b = null;
      particuleTexte(x, y, t('plus', { n: rendu }), '#1d7842');
    } else if (cell.ter === 'arbre' || cell.ter === 'ruine') {
      const prix = cell.ter === 'arbre' ? PRIX_DEFRICHER : PRIX_DEBLAYER;
      if (argent < prix) { pasAssez(); return; }
      argent -= prix; cell.ter = 'herbe';
      particuleTexte(x, y, t('moins', { n: prix }), '#be342d');
    } else { refuser(cell.ter === 'roche' ? 'err.roche' : 'err.rien', null, glisse); return; }
    poussiere(x, y); nuage(x, y);
    jouer('demolir');
    calculer(); majHud();
    if (selection) ouvrirFiche(selection.x, selection.y);
  }

  function eteindre(x, y) {
    if (argent < PRIX_EXTINCTION) { pasAssez(); return; }
    argent -= PRIX_EXTINCTION;
    grille[y][x].b.feu = 0; compteurs.feux++;
    eclaboussure(x, y); particuleTexte(x, y, t('moins', { n: PRIX_EXTINCTION }), '#be342d');
    message(t('msg.eteint'), 'bon'); jouer('eteint');
    calculer(); majHud();
  }

  function reparer(x, y) {
    if (argent < PRIX_REPARATION) { pasAssez(); return; }
    argent -= PRIX_REPARATION;
    grille[y][x].b.panne = false; compteurs.reparations++;
    etincelles(x, y); particuleTexte(x, y, t('moins', { n: PRIX_REPARATION }), '#be342d');
    message(t('msg.repare'), 'bon'); jouer('repare');
    calculer(); majHud();
  }

  function pasAssez() {
    message(t('err.argent'), 'mal'); jouer('erreur');
    const s = $('s-argent'); s.classList.remove('secoue'); void s.offsetWidth; s.classList.add('secoue');
  }

  // =====================================================================
  // Particules et effets
  // =====================================================================
  function centreCase(x, y) { return { px: geo.ox + (x + 0.5) * geo.T, py: geo.oy + (y + 0.5) * geo.T }; }
  function particule(x, y, type) {
    const { px, py } = centreCase(x, y);
    particules.push({ type, x: px + (Math.random() - 0.5) * geo.T * 0.5, y: py - geo.T * 0.3, vx: (Math.random() - 0.5) * 20, vy: -40 - Math.random() * 20, vie: 1.4, max: 1.4 });
  }
  function particuleTexte(x, y, texte, couleur) {
    const { px, py } = centreCase(x, y);
    particules.push({ type: 'texte', texte, couleur, x: px, y: py - geo.T * 0.2, vx: 0, vy: -38, vie: 1.2, max: 1.2 });
  }
  function etincelles(x, y) {
    const { px, py } = centreCase(x, y);
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 60;
      particules.push({ type: 'etincelle', x: px, y: py, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, vie: 0.8, max: 0.8, couleur: ['#ffd34d', '#fff', '#7cd67c'][i % 3] });
    }
  }
  function poussiere(x, y) {
    const { px, py } = centreCase(x, y);
    for (let i = 0; i < 8; i++) {
      const a = Math.random() * Math.PI * 2, v = 20 + Math.random() * 40;
      particules.push({ type: 'poussiere', x: px, y: py + geo.T * 0.25, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.4 - 10, vie: 0.6, max: 0.6 });
    }
  }
  function nuage(x, y) {
    const { px, py } = centreCase(x, y);
    for (let i = 0; i < 5; i++) particules.push({ type: 'nuage', x: px + (Math.random() - 0.5) * geo.T * 0.6, y: py, vx: (Math.random() - 0.5) * 15, vy: -25, vie: 1, max: 1 });
  }
  function eclaboussure(x, y) {
    const { px, py } = centreCase(x, y);
    for (let i = 0; i < 14; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, v = 60 + Math.random() * 70;
      particules.push({ type: 'goutte', x: px, y: py, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 0.8, max: 0.8 });
    }
  }
  function flotteHud(texte, couleur) {
    const r = $('s-argent').getBoundingClientRect();
    particules.push({ type: 'texte', texte, couleur, x: r.left + r.width / 2, y: r.bottom + 12, vx: 0, vy: 25, vie: 1.3, max: 1.3, ecranFixe: true });
  }
  function lancerConfettis() {
    const w = innerWidth;
    for (let i = 0; i < 120; i++) {
      confettis.push({ x: Math.random() * w, y: -20 - Math.random() * 200, vx: (Math.random() - 0.5) * 60, vy: 80 + Math.random() * 120, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, couleur: ['#f5b82e', '#e5484d', '#2f9e5b', '#4a7fc1', '#ff6b9a', '#fff'][i % 6], vie: 4 });
    }
  }

  // =====================================================================
  // Affichage
  // =====================================================================
  const cv = $('carte'), ctx = cv.getContext('2d');
  const fx = $('fx'), fctx = fx.getContext('2d');
  let dpr = 1;
  const geo = { T: 40, ox: 0, oy: 0 };

  function redimensionner() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    for (const c of [cv, fx]) { c.width = Math.round(innerWidth * dpr); c.height = Math.round(innerHeight * dpr); }
    calerCarte();
  }
  function calerCarte() {
    if (ecran === 'titre' || ecran === 'niveaux' || !grille.length) return;
    const haut = $('hud').getBoundingClientRect().bottom + 6;
    const bas = $('bas').hidden ? innerHeight - 8 : $('bas').getBoundingClientRect().top - 4;
    const dispo = Math.max(100, bas - haut);
    geo.T = Math.floor(Math.min((innerWidth - 12) / W, dispo / H, 90));
    geo.ox = Math.round((innerWidth - geo.T * W) / 2);
    geo.oy = Math.round(haut + (dispo - geo.T * H) / 2);
  }

  function dessinerGrille(c, g, T, ox, oy, opts) {
    const h = g.length, w = g[0].length;
    // terrain
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) terrain(c, g[y][x], ox + x * T, oy + y * T, T, x, y);
    // routes
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const cell = g[y][x];
      if (cell.b && cell.b.type === 'route') dessinRoute(c, g, x, y, ox + x * T, oy + y * T, T, cell.ter === 'eau');
    }
    // terrains réservés
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const cell = g[y][x];
      if (!cell.res || cell.b) continue;
      const px = ox + x * T, py = oy + y * T;
      c.fillStyle = 'rgba(245,184,46,.25)'; c.fillRect(px + 2, py + 2, T - 4, T - 4);
      c.setLineDash([T * 0.12, T * 0.08]); c.lineWidth = Math.max(2, T * 0.06); c.strokeStyle = '#d99a00';
      c.strokeRect(px + 3, py + 3, T - 6, T - 6); c.setLineDash([]);
      dessinBat(c, cell.res, px + T * 0.15, py + T * 0.15, T * 0.7, { alpha: 0.35, niv: 2, fume: false, tm: 0 });
    }
    // bâtiments
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const cell = g[y][x], b = cell.b;
      if (!b || b.type === 'route') continue;
      const px = ox + x * T, py = oy + y * T;
      const age = horloge - b.anim;
      let k = 1;
      if (age >= 0 && age < 0.45) k = 1 + Math.sin(age / 0.45 * Math.PI) * 0.18;
      const s = T * k;
      dessinBat(c, b.type, px + (T - s) / 2, py + (T - s), s, { niv: b.niv, seed: graine(x, y), tm: horloge, fume: !b.panne && !b.feu });
    }
    if (!opts || !opts.signes) return;
    // signes : besoins manquants, déchets, pannes, feux
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const b = g[y][x].b; if (!b || b.type === 'route') continue;
      const px = ox + x * T, py = oy + y * T, r = Math.max(7, T * 0.17);
      if (b.type === 'maison' && b.dechets) sacs(c, px, py, T);
      if (b.type !== 'parc' && !routeA(x, y)) signeRoute(c, px + r + 1, py + r + 1, r);
      else if (b.type === 'maison' && b.niv >= 0) {
        let i = 0;
        if (actif('eau') && !couvert('eau', x, y)) { signeGoutte(c, px + r + 1 + i * r * 2, py + r + 1, r); i++; }
        if (actif('elec') && !couvert('elec', x, y)) { signeEclair(c, px + r + 1 + i * r * 2, py + r + 1, r); i++; }
      }
      if (b.panne) signePanne(c, px + T - r - 1, py + r + 1, r);
      if (b.feu) flammes(c, px, py, T);
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const b = g[y][x].b;
      if (b && b.dem) bulle(c, b.dem.type, ox + x * T, oy + y * T, T, b.dem.reste);
    }
  }

  function cercleZone(c, x, y, r, couleur, plein) {
    const { T, ox, oy } = geo;
    c.beginPath(); c.arc(ox + (x + 0.5) * T, oy + (y + 0.5) * T, (r + 0.5) * T, 0, Math.PI * 2);
    if (plein) { c.fillStyle = couleur.replace('1)', '.14)'); c.fill(); }
    c.setLineDash([8, 6]); c.lineWidth = 2.5; c.strokeStyle = couleur; c.stroke(); c.setLineDash([]);
  }
  const COULEUR_ZONE = { commerce: 'rgba(229,72,77,1)', eau: 'rgba(58,133,199,1)', usine: 'rgba(90,90,90,1)', parc: 'rgba(47,158,91,1)', elec: 'rgba(242,183,5,1)', ecole: 'rgba(192,57,43,1)', caserne: 'rgba(214,69,61,1)', sante: 'rgba(47,163,107,1)', dechetterie: 'rgba(74,127,193,1)', stade: 'rgba(122,92,196,1)' };

  function dessiner() {
    const c = ctx;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (ecran === 'titre' || ecran === 'niveaux') {
      if (!vitrine) vitrine = lireCarte(VITRINE);
      const T = Math.ceil(Math.max(innerWidth / VITRINE[0].length, innerHeight / VITRINE.length));
      const ox = (innerWidth - T * VITRINE[0].length) / 2, oy = (innerHeight - T * VITRINE.length) / 2;
      c.fillStyle = '#8fcf6a'; c.fillRect(0, 0, innerWidth, innerHeight);
      dessinerGrille(c, vitrine, T, ox, oy, { signes: false });
      // nuages qui passent
      c.globalAlpha = 0.75;
      for (let k = 0; k < 3; k++) {
        const nx = ((horloge * 14 + k * 260) % (innerWidth + 300)) - 150, ny = 120 + k * innerHeight * 0.27;
        rond(c, nx, ny, 26, '#fff'); rond(c, nx + 28, ny - 10, 32, '#fff'); rond(c, nx + 60, ny, 24, '#fff');
      }
      c.globalAlpha = 1;
      dessinerParticules(c);
      return;
    }
    // ciel / fond
    const grad = c.createLinearGradient(0, 0, 0, innerHeight);
    grad.addColorStop(0, '#8fd0f0'); grad.addColorStop(1, '#c9ecd4');
    c.fillStyle = grad; c.fillRect(0, 0, innerWidth, innerHeight);
    const { T, ox, oy } = geo;
    c.fillStyle = 'rgba(40,70,40,.35)'; rr(c, ox - 5, oy - 5, W * T + 10, H * T + 10, 12); c.fill();
    c.save(); rr(c, ox, oy, W * T, H * T, 8); c.clip();
    dessinerGrille(c, grille, T, ox, oy, { signes: true });
    c.restore();

    // zones d'effet de l'outil choisi
    const zoneOutil = BAT[outil] && BAT[outil].rayon ? outil : null;
    if (zoneOutil) {
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const b = grille[y][x].b;
        if (b && b.type === zoneOutil) cercleZone(c, x, y, BAT[zoneOutil].rayon, COULEUR_ZONE[zoneOutil], false);
      }
      const ici = curseur.visible ? curseur : survol;
      if (ici) cercleZone(c, ici.x, ici.y, BAT[zoneOutil].rayon, COULEUR_ZONE[zoneOutil], true);
    }
    if (selection && outil === 'inspecter') {
      const b = grille[selection.y][selection.x].b;
      if (b && BAT[b.type].rayon) cercleZone(c, selection.x, selection.y, BAT[b.type].rayon, COULEUR_ZONE[b.type], true);
      c.lineWidth = 3; c.strokeStyle = '#fff'; c.strokeRect(ox + selection.x * T + 1.5, oy + selection.y * T + 1.5, T - 3, T - 3);
    }
    if (curseur.visible) {
      c.lineWidth = 3; c.strokeStyle = '#f5b82e';
      c.strokeRect(ox + curseur.x * T + 2, oy + curseur.y * T + 2, T - 4, T - 4);
    } else if (survol) {
      c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,.8)';
      c.strokeRect(ox + survol.x * T + 1, oy + survol.y * T + 1, T - 2, T - 2);
    }
    // guide du niveau 1 : main qui montre une case
    if (N === 1 && ecran === 'jeu' && tuto < 2) {
      const cible = cibleTuto();
      const ph = (horloge % 1.2) / 1.2;
      if (cible) main(c, ox + (cible.x + 0.5) * T, oy + (cible.y + 0.5) * T + Math.sin(ph * Math.PI * 2) * 6, ph > 0.5);
    }
    dessinerParticules(c);
  }

  // Case libre conseillée par le guide du niveau 1 : la plus proche du centre, contre une route
  function cibleTuto() {
    let mieux = null, dMin = 1e9;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const cell = grille[y][x];
      if (cell.b || cell.ter !== 'herbe' || !routeA(x, y)) continue;
      const d = Math.abs(x - 2) + Math.abs(y - (tuto === 0 ? 3 : 2));
      if (d < dMin) { dMin = d; mieux = { x, y }; }
    }
    return mieux;
  }

  function dessinerParticules(c) {
    for (const p of particules) {
      const a = Math.max(0, p.vie / p.max);
      c.globalAlpha = Math.min(1, a * 1.5);
      switch (p.type) {
        case 'coeur': coeur(c, p.x, p.y, 7); break;
        case 'etincelle': rond(c, p.x, p.y, 3, p.couleur); break;
        case 'poussiere': rond(c, p.x, p.y, 4 * a + 1, '#d8c9a8'); break;
        case 'nuage': rond(c, p.x, p.y, 10 * (1.5 - a), '#c9ced6'); break;
        case 'goutte': rond(c, p.x, p.y, 3.5, '#56b0e6'); break;
        case 'texte':
          c.font = '800 16px system-ui, sans-serif'; c.textAlign = 'center';
          c.lineWidth = 4; c.strokeStyle = '#fff'; c.strokeText(p.texte, p.x, p.y);
          c.fillStyle = p.couleur; c.fillText(p.texte, p.x, p.y);
          break;
      }
    }
    c.globalAlpha = 1;
  }

  function dessinerFx(dt) {
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of confettis) {
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r);
      fctx.fillStyle = p.couleur; fctx.fillRect(-5, -3, 10, 6); fctx.restore();
    }
    confettis = confettis.filter((p) => p.vie > 0 && p.y < innerHeight + 30);
  }

  // =====================================================================
  // Boucle principale
  // =====================================================================
  let dernier = 0;
  function boucle(ts) {
    const dt = Math.min(0.1, (ts - dernier) / 1000 || 0);
    dernier = ts;
    const fige = ecran === 'pause';
    if (!fige) horloge += dt;
    if (ecran === 'jeu') {
      tempsMois += dt * 1000 * vitesse;
      if (tempsMois >= DUREE_MOIS) { tempsMois -= DUREE_MOIS; finMois(); }
      const barre = $('barre-mois');
      if (barre) barre.style.width = Math.min(100, tempsMois / DUREE_MOIS * 100) + '%';
    }
    if (!fige) {
      for (const p of particules) {
        p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.type === 'goutte' || p.type === 'etincelle') p.vy += 160 * dt;
      }
      particules = particules.filter((p) => p.vie > 0);
    }
    dessiner();
    if (ecran === 'intro') dessinerDemo();
    dessinerFx(fige ? 0 : dt);
    requestAnimationFrame(boucle);
  }

  // =====================================================================
  // Interface : barre du haut, objectifs, outils, fiche, messages
  // =====================================================================
  function majHud() {
    if (ecran === 'titre' || ecran === 'niveaux') return;
    $('s-argent').innerHTML = SVG.piece + '<span></span>';
    $('s-argent').querySelector('span').textContent = nb(argent);
    $('s-argent').classList.toggle('rouge', argent < 0);
    $('s-argent').setAttribute('aria-label', t('hud.argent', { n: nb(argent) }));
    $('s-pop').innerHTML = SVG.gens + '<span></span>';
    $('s-pop').querySelector('span').textContent = nb(stats.pop);
    $('s-pop').setAttribute('aria-label', t('hud.pop', { n: nb(stats.pop) }));
    $('s-bon').innerHTML = SVG.sourire + '<span></span>';
    $('s-bon').querySelector('span').textContent = t('pourcent', { n: stats.bonheur });
    $('s-bon').setAttribute('aria-label', t('hud.bonheur', { n: stats.bonheur }));
    $('b-vitesse').textContent = t('vitesse', { n: vitesse });

    const o = $('objectifs');
    o.textContent = '';
    const moisP = document.createElement('div');
    moisP.className = 'puce mois';
    moisP.innerHTML = SVG.calendrier + '<span></span><i id="barre-mois"></i>';
    moisP.querySelector('span').textContent = t('obj.fraction', { a: mois, b: L.m });
    moisP.title = t('hud.mois', { a: mois, b: L.m });
    o.appendChild(moisP);
    for (const k of Object.keys(L.o)) {
      const av = avancement(k);
      const p = document.createElement('div');
      p.className = 'puce' + (av.ok ? ' ok' : '');
      p.innerHTML = SVG[OBJ_ICONE[k]] + '<span></span>';
      p.querySelector('span').textContent = k === 'bonheur'
        ? t('obj.fractionPourcent', { a: av.a, b: av.b })
        : t('obj.fraction', { a: nb(av.a), b: nb(av.b) });
      p.title = t('obj.' + k, { n: nb(av.b) });
      o.appendChild(p);
    }
    if (actif('impots')) {
      const b = document.createElement('button');
      b.className = 'puce puce-bouton'; b.id = 'b-impots';
      b.innerHTML = SVG.piece + '<span></span>';
      b.querySelector('span').textContent = t('impots.' + taux);
      b.addEventListener('click', changerImpots);
      o.appendChild(b);
    }
    calerCarte();
    document.querySelectorAll('.outil').forEach((el) => {
      const k = el.dataset.outil;
      el.classList.toggle('trop-cher', BAT[k] && BAT[k].prix > argent);
    });
  }

  function changerImpots(e) {
    if (e) e.currentTarget.blur();
    taux = taux === 'bas' ? 'normal' : (taux === 'normal' ? 'haut' : 'bas');
    jouer('clic');
    calculer(); majHud();
    message(t('msg.impots.' + taux), '');
  }

  const icones = {};
  function iconeOutil(k) {
    const c = document.createElement('canvas');
    c.width = 76; c.height = 76;
    const g = c.getContext('2d');
    dessinBat(g, k, 2, 2, 72, { niv: 2, seed: 9, tm: 0.3, fume: false });
    return c;
  }
  function outilsDuNiveau() { return OUTILS.filter((k) => k === 'inspecter' || k === 'demolir' || N >= BAT[k].debloque); }
  function construireOutils() {
    const zone = $('outils');
    zone.textContent = '';
    for (const k of outilsDuNiveau()) {
      const b = document.createElement('button');
      b.className = 'outil'; b.dataset.outil = k;
      b.setAttribute('aria-label', t('outil.' + k));
      b.title = t('outil.' + k);
      if (!icones[k]) icones[k] = iconeOutil(k);
      const ic = document.createElement('canvas');
      ic.width = 76; ic.height = 76;
      ic.getContext('2d').drawImage(icones[k], 0, 0);
      b.appendChild(ic);
      const s = document.createElement('small');
      s.textContent = BAT[k] ? t('prix', { n: BAT[k].prix }) : t('outil.court.' + k);
      b.appendChild(s);
      b.addEventListener('click', () => { choisirOutil(k); b.blur(); });
      zone.appendChild(b);
