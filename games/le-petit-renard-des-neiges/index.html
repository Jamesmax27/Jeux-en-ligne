<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }

  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =

    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +

    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },

    var nom = document.createElement('span');

    menu.className = 'jel-langue-menu';
    menu.hidden = true;

      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;

      element.className = 'jel-langue';

      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];

    };

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {

    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);

    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);

      }

    else demarrer();
  }

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },

    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +

    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +

        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
(function () {
  'use strict';

  // =====================================================================
  //  Le petit renard des neiges — jeu de plateforme d'hiver
  //  Frimas, un renard blanc, grimpe la montagne pour rapporter des baies.
  // =====================================================================

  const JEU = 'le-petit-renard-des-neiges';
  const tr = (cle, vars) => (window.JEL_I18N ? window.JEL_I18N.t(cle, vars) : cle);
  const nb = (x) => (window.JEL_I18N ? window.JEL_I18N.nombre(x) : String(x));
  const $ = (id) => document.getElementById(id);

  // ---------------------------------------------------------------------
  //  Paysages (couleurs)
  // ---------------------------------------------------------------------
  const PAYSAGES = {
    foret: { ciel: ['#16204a', '#3a5592', '#8fb1e3'], loin: '#3c5590', proche: '#24405f', neige: '#f5f9ff', neigeOmbre: '#c8d7f0', terre: '#55709c', roche: '#56658d', glace: '#bfe9ff', eau: '#2f6fa3', flocons: 1 },
    lac: { ciel: ['#4f7fbd', '#8fbde6', '#dff0ff'], loin: '#7b9cc8', proche: '#5f84b3', neige: '#ffffff', neigeOmbre: '#cfe0f5', terre: '#6d86b0', roche: '#6a7fa6', glace: '#c9f1ff', eau: '#2f7fb4', flocons: 0.8 },
    grotte: { ciel: ['#0a1030', '#17275a', '#25427e'], loin: '#1b2f66', proche: '#22407a', neige: '#e2f2ff', neigeOmbre: '#a7c6ea', terre: '#33518a', roche: '#2f4a82', glace: '#9fe3ff', eau: '#24609a', flocons: 0.25 },
    sommet: { ciel: ['#2c2560', '#9a5c95', '#f3a77f'], loin: '#6d568f', proche: '#4f3f78', neige: '#fff8f3', neigeOmbre: '#e3cfe0', terre: '#46386c', roche: '#5f5282', glace: '#d7ecff', eau: '#3d6ea6', flocons: 1.2 },
  };

  // ---------------------------------------------------------------------
  //  Garde-robe : écharpes, bonnets, pelages (débloqués par les étoiles ou les amis)
  // ---------------------------------------------------------------------
  const OBJETS = [
    { id: 'echarpe-rouge', type: 'echarpe', couleur: '#e2384b', etoiles: 0 },
    { id: 'echarpe-verte', type: 'echarpe', couleur: '#2f9e62', etoiles: 8 },
    { id: 'echarpe-bleue', type: 'echarpe', couleur: '#3b7ff0', ami: 'galet' },
    { id: 'echarpe-or', type: 'echarpe', couleur: '#f2b928', etoiles: 50 },
    { id: 'bonnet-aucun', type: 'bonnet', couleur: null, etoiles: 0 },
    { id: 'bonnet-rouge', type: 'bonnet', couleur: '#e2384b', etoiles: 4 },
    { id: 'bonnet-raye', type: 'bonnet', couleur: '#3b7ff0', raye: true, ami: 'hulotte' },
    { id: 'bonnet-houx', type: 'bonnet', couleur: '#2f9e62', houx: true, etoiles: 40 },
    { id: 'pelage-blanc', type: 'pelage', etoiles: 0, corps: '#f7f9ff', pointe: '#ffffff', pattes: '#cdd8ec' },
    { id: 'pelage-givre', type: 'pelage', etoiles: 18, corps: '#e2f4ff', pointe: '#a9dcff', pattes: '#bed8f0', givre: true },
    { id: 'pelage-argent', type: 'pelage', ami: 'ronflon', corps: '#d3dae6', pointe: '#f7f9ff', pattes: '#a3afc3' },
    { id: 'pelage-aurore', type: 'pelage', ami: 'cornu', corps: '#f6f2ff', pointe: '#8ff0c6', pattes: '#d6c8f0', aurore: true },
  ];
  const objet = (id) => OBJETS.find((o) => o.id === id);

  // Amis de l'hiver : rencontrés à la fin de chaque paysage
  const AMIS = {
    hulotte: { cadeau: 'bonnet-raye' },
    galet: { cadeau: 'echarpe-bleue' },
    ronflon: { cadeau: 'pelage-argent' },
    cornu: { cadeau: 'pelage-aurore' },
  };

  // ---------------------------------------------------------------------
  //  Construction des niveaux à partir de morceaux de parcours
  //  (x : colonne, y : ligne, y grandit vers le bas ; g = ligne du sol)
  // ---------------------------------------------------------------------
  function construire(niveau) {
    const sol = [];
    const extra = new Map();
    const E = { baies: [], lanternes: [], lievres: [], stalactites: [], vents: [], but: null };
    let x = 0, g = 0;
    const pose = (cx, cy, c) => extra.set(cx + ',' + cy, c);
    const baie = (cx, cy) => E.baies.push({ x: cx, y: cy, prise: false, phase: E.baies.length * 0.7 });
    const colonne = (type, gg, opts) => { sol[x] = Object.assign({ g: gg === undefined ? g : gg, type }, opts || {}); x++; };
    const ecartEau = (eau, w) => { for (let i = 0; i < w; i++) { if (eau) colonne('eau', g + 1); else { sol[x] = null; x++; } } };

    const b = {
      plat(n, k = 0, type = 'sol') {
        const x0 = x;
        for (let i = 0; i < n; i++) colonne(type);
        for (let i = 0; i < k; i++) {
          const bx = k === 1 ? x0 + Math.floor(n / 2) : x0 + Math.round(i * (n - 1) / (k - 1));
          baie(bx + 0.5, g - 0.55);
        }
        return b;
      },
      glace(n, k = 0) { return b.plat(n, k, 'glace'); },
      monte(h, n = 3, k = 0) { g -= h; return b.plat(n, k); },
      descend(h, n = 3, k = 0) { g += h; return b.plat(n, k); },
      marches(k, h = 1, n = 2) { for (let i = 0; i < k; i++) b.monte(h, n, 1); return b; },
      // Trou (ou trou d'eau) avec un arc de baies au-dessus
      trou(w, arc = true, eau = false) {
        const x0 = x;
        ecartEau(eau, w);
        if (arc) {
          const n = Math.max(1, w - 2);
          const haut = w >= 5 ? 2.7 : 1.5;
          for (let i = 0; i < n; i++) {
            const f = (i + 1) / (n + 1);
            baie(x0 + f * w, g - 0.9 - haut * 4 * f * (1 - f));
          }
        }
        return b;
      },
      eau(w, arc = true) { return b.trou(w, arc, true); },
      grandTrou(w = 5) { return b.trou(w, true); },
      // Îlots flottants qui montent
      ilots(k, w, ecart, dy) {
        for (let i = 0; i < k; i++) {
          b.trou(ecart, false);
          g -= dy;
          const x0 = x;
          for (let j = 0; j < w; j++) colonne('flottant');
          baie(x0 + w / 2, g - 0.55);
        }
        return b;
      },
      // Poudreuse avec un tunnel caché (facultatif) : baies sous la neige
      poudreTunnel(w, k) {
        const x0 = x;
        for (let i = 0; i < w; i++) { colonne('sol', g + 4); pose(x - 1, g, '~'); pose(x - 1, g + 1, '~'); }
        for (let i = 0; i < k; i++) baie(x0 + 0.5 + Math.round(i * (w - 1) / Math.max(1, k - 1)), g + 3.45);
        colonne('sol', g + 3); colonne('sol', g + 2); colonne('sol', g + 1); colonne('sol');
        return b;
      },
      // Mur de roche : il faut plonger dans la poudreuse pour passer dessous
      murPoudre(k) {
        const x0 = x;
        for (let i = 0; i < 3; i++) { colonne('sol', g + 4); pose(x - 1, g, '~'); pose(x - 1, g + 1, '~'); }
        for (let i = 0; i < 2; i++) { colonne('sol', g + 4); for (let y = g - 7; y <= g + 1; y++) pose(x - 1, y, '='); }
        for (let i = 0; i < k; i++) baie(x0 + 0.5 + Math.round(i * 4 / Math.max(1, k - 1)), g + 3.45);
        colonne('sol', g + 3); colonne('sol', g + 2); colonne('sol', g + 1); colonne('sol');
        return b;
      },
      // Congères qui s'effondrent, au-dessus de l'eau ou du vide
      congeres(k, eau = true, ecart = 1) {
        ecartEau(eau, 2);
        for (let i = 0; i < k; i++) {
          if (i > 0) ecartEau(eau, ecart);
          const x0 = x;
          colonne('congere', g, { eau }); colonne('congere', g, { eau });
          baie(x0 + 1, g - 0.7);
        }
        ecartEau(eau, 2);
        return b;
      },
      // Pont de neige qui fond
      ponts(w, eau = false) {
        const x0 = x;
        for (let i = 0; i < w; i++) colonne('pont', g, { eau });
        const k = Math.max(1, Math.floor(w / 3));
        for (let i = 0; i < k; i++) baie(x0 + (i + 0.5) * w / k, g - 0.6);
        return b;
      },
      // Lièvre variable (tremplin) devant une haute corniche
      lievre(n, h) {
        const x0 = x;
        b.plat(n);
        E.lievres.push({ x: x0 + n / 2, y: g, min: x0 + 0.8, max: x0 + n - 1.2, dir: 1, t: 0, ecrase: 0, saut: 0 });
        baie(x0 + n - 1.5, g - h - 1.6);
        g -= h;
        return b.plat(3, 1);
      },
      // Plafond de grotte avec des stalactites
      stalactites(n, k, glace = false) {
        const x0 = x;
        for (let i = 0; i < n; i++) { colonne(glace ? 'glace' : 'sol'); for (let y = g - 8; y <= g - 4; y++) pose(x - 1, y, '='); }
        for (let i = 0; i < k; i++) {
          const cx = x0 + Math.round((i + 1) * n / (k + 1)) + 0.5;
          E.stalactites.push({ x: cx, y0: g - 3, y: g - 3, etat: 'pend', t: 0, vy: 0 });
          baie(cx, g - 0.6);
        }
        return b;
      },
      // Bourrasques de flocons sur les morceaux construits par f
      vent(dir, f) {
        const x0 = x, g0 = g;
        f();
        E.vents.push({ x0, x1: x, yMin: Math.min(g0, g) - 10, yMax: Math.max(g0, g) + 6, dir, phase: E.vents.length * 1.1 });
        return b;
      },
      lanterne() {
        b.plat(2);
        E.lanternes.push({ x: x - 1, y: g, allumee: false });
        return b;
      },
      fin(terrier = false) {
        b.plat(3);
        E.but = { x: x + 1.5, y: g, terrier };
        return b.plat(7);
      },
    };

    // Départ
    b.plat(5);
    niveau.parcours(b);
    // Terrain -> grille
    const W = x + 1;
    let gMax = -Infinity;
    sol.forEach((c) => { if (c) gMax = Math.max(gMax, c.g); });
    const fond = gMax + 4;
    const tuiles = new Map();
    sol.forEach((c, cx) => {
      if (!c) return;
      if (c.type === 'sol' || c.type === 'glace') {
        for (let y = c.g; y <= fond; y++) tuiles.set(cx + ',' + y, (y === c.g && c.type === 'glace') ? '_' : '#');
      } else if (c.type === 'flottant') {
        tuiles.set(cx + ',' + c.g, '#');
      } else if (c.type === 'eau') {
        for (let y = c.g; y <= fond; y++) tuiles.set(cx + ',' + y, 'e');
      } else if (c.type === 'congere' || c.type === 'pont') {
        tuiles.set(cx + ',' + c.g, c.type === 'congere' ? 'c' : 'b');
        if (c.eau) for (let y = c.g + 1; y <= fond; y++) tuiles.set(cx + ',' + y, 'e');
      }
    });
    extra.forEach((v, k) => tuiles.set(k, v));
    let yMin = Infinity;
    tuiles.forEach((v, k) => { yMin = Math.min(yMin, Number(k.split(',')[1])); });
    E.baies.forEach((o) => { yMin = Math.min(yMin, Math.floor(o.y)); });
    const origine = yMin - 9;
    const H = fond - origine + 1;
    const grille = new Array(W * H).fill(' ');
    tuiles.forEach((v, k) => {
      const [cx, cy] = k.split(',').map(Number);
      const yy = cy - origine;
      if (cx >= 0 && cx < W && yy >= 0 && yy < H) grille[yy * W + cx] = v;
    });
    // Décalage des objets
    E.baies.forEach((o) => { o.y -= origine; });
    E.lanternes.forEach((o) => { o.y -= origine; });
    E.lievres.forEach((o) => { o.y -= origine; });
    E.stalactites.forEach((o) => { o.y0 -= origine; o.y -= origine; });
    E.vents.forEach((o) => { o.yMin -= origine; o.yMax -= origine; });
    if (E.but) E.but.y -= origine;
    const depart = { x: 1.6, y: sol[1].g - origine };
    return { W, H, grille, E, depart, par: Math.round(W / 3.2 + 14) };
  }

  // ---------------------------------------------------------------------
  //  Les 20 niveaux
  // ---------------------------------------------------------------------
  const NIVEAUX = [
    // --- Forêt de sapins ---
    { paysage: 'foret', tutos: ['courir', 'sauter', 'baies'], parcours: (b) => {
      b.plat(4, 2).monte(1, 4, 1).plat(3, 1).trou(2).plat(5, 2).monte(1, 3).monte(1, 4, 2).trou(3).plat(4, 2)
        .descend(1, 4, 1).plat(3, 1).trou(2).plat(3).monte(1, 3).plat(4, 2).fin();
    } },
    { paysage: 'foret', tutos: ['grandBond', 'lanterne'], parcours: (b) => {
      b.plat(4, 2).trou(3).plat(3).grandTrou(5).plat(4, 1).lanterne().monte(2, 3, 1).plat(3, 2).trou(5).plat(3)
        .monte(2, 3, 1).plat(3, 2).lanterne().trou(4).plat(3, 1).ilots(3, 2, 2, 1).plat(3).grandTrou(5).fin();
    } },
    { paysage: 'foret', tutos: ['plonger'], parcours: (b) => {
      b.plat(4, 1).poudreTunnel(6, 3).plat(3).monte(1, 3).murPoudre(2).plat(3, 1).lanterne().trou(4).plat(3)
        .poudreTunnel(8, 4).monte(2, 3, 1).murPoudre(3).plat(3, 1).trou(3).fin();
    } },
    { paysage: 'foret', tutos: ['glace'], parcours: (b) => {
      b.plat(4, 1).glace(8, 2).trou(3).plat(3).lanterne().glace(6, 1).grandTrou(4).plat(3, 1).monte(1, 2)
        .glace(10, 3).trou(4).plat(3).lanterne().monte(2, 2).glace(5, 1).trou(3).glace(6, 2).fin();
    } },
    { paysage: 'foret', ami: 'hulotte', tutos: [], parcours: (b) => {
      b.plat(4).glace(6, 2).trou(4).plat(2).poudreTunnel(6, 3).lanterne().monte(2, 3).murPoudre(2)
        .ilots(3, 2, 3, 1).plat(3).lanterne().glace(7, 2).grandTrou(5).plat(2).monte(1, 2).poudreTunnel(7, 3).trou(5).fin();
    } },
    // --- Lac gelé ---
    { paysage: 'lac', tutos: ['congere', 'eau'], parcours: (b) => {
      b.plat(4, 1).eau(2).plat(3).congeres(3).plat(4, 1).lanterne().glace(5, 1).eau(3).plat(3).congeres(4)
        .plat(3).monte(1, 3, 1).congeres(3, true, 2).plat(2).fin();
    } },
    { paysage: 'lac', tutos: ['vent'], parcours: (b) => {
      b.plat(4).vent(1, () => { b.plat(3, 1).eau(3).plat(4, 2); }).lanterne()
        .vent(-1, () => { b.plat(3).trou(3).plat(2, 1).trou(3).plat(3); }).monte(1, 3)
        .vent(1, () => { b.eau(4).plat(3, 1).eau(3).plat(3); }).lanterne().congeres(3).plat(2).fin();
    } },
    { paysage: 'lac', tutos: [], parcours: (b) => {
      b.plat(4).vent(1, () => { b.glace(10, 3); }).eau(3).plat(3).lanterne()
        .vent(-1, () => { b.glace(6, 1).eau(3).glace(5, 2); }).plat(2).monte(1, 2)
        .vent(1, () => { b.congeres(3); }).plat(3).lanterne().glace(8, 2).trou(4).plat(3).fin();
    } },
    { paysage: 'lac', tutos: [], parcours: (b) => {
      b.plat(4).congeres(5).plat(3).poudreTunnel(7, 4).lanterne().murPoudre(2).plat(2).congeres(4, true, 2)
        .plat(2).monte(2, 3).lanterne().poudreTunnel(6, 3).eau(3).plat(2).congeres(3).plat(2).fin();
    } },
    { paysage: 'lac', ami: 'galet', tutos: [], parcours: (b) => {
      b.plat(4).vent(1, () => { b.glace(6, 2).eau(3).plat(2).congeres(3); }).plat(3).lanterne().murPoudre(2)
        .ilots(3, 2, 2, 1).vent(-1, () => { b.plat(3, 1).grandTrou(5).plat(3); }).lanterne()
        .glace(6, 2).eau(3).plat(2).congeres(4).plat(2).monte(1, 3).fin();
    } },
    // --- Grotte de glace ---
    { paysage: 'grotte', tutos: ['lievre'], parcours: (b) => {
      b.plat(4, 1).lievre(6, 4).plat(3, 1).trou(3).plat(3).lievre(7, 4).lanterne().trou(4).plat(2)
        .lievre(6, 5).glace(5, 2).trou(3).plat(3).fin();
    } },
    { paysage: 'grotte', tutos: ['stalactite'], parcours: (b) => {
      b.plat(4, 1).stalactites(10, 3).trou(3).plat(3).lanterne().stalactites(12, 4).monte(1, 3).trou(4).plat(2)
        .lanterne().stalactites(9, 3).poudreTunnel(5, 2).plat(2).fin();
    } },
    { paysage: 'grotte', tutos: [], parcours: (b) => {
      b.plat(4).stalactites(8, 3, true).trou(3).plat(2).lievre(6, 4).lanterne().glace(6, 2).trou(4).plat(2)
        .stalactites(10, 4).lievre(6, 5).plat(2).lanterne().glace(7, 2).stalactites(8, 3, true).trou(4).fin();
    } },
    { paysage: 'grotte', tutos: ['pont'], parcours: (b) => {
      b.plat(4, 1).ponts(6).plat(3).ponts(8, true).plat(2).lanterne().monte(1, 2).ponts(5).trou(3).ponts(6)
        .plat(3).lanterne().stalactites(8, 2).ponts(9, true).plat(2).fin();
    } },
    { paysage: 'grotte', ami: 'ronflon', tutos: [], parcours: (b) => {
      b.plat(3).lievre(6, 4).ponts(7).plat(2).lanterne().stalactites(10, 3, true).murPoudre(2).lievre(5, 5)

    const nombres = (t) => Array.isArray(t) ? NIVEAUX.map((_, i) => Math.max(0, Math.floor(Number(t[i]) || 0))) : null;
    const et = nombres(d.etoiles); if (et) prog.etoiles = et.map((e) => Math.min(3, e));
    const rec = nombres(d.records); if (rec) prog.records = rec;
    if (Array.isArray(d.amis)) prog.amis = d.amis.filter((a) => AMIS[a]);
    if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string');

    let gagnes = 0;
    prog.etoiles.forEach((e, i) => { if (e > 0) gagnes = i + 1; });
    prog.debloque = Math.min(NIVEAUX.length, Math.max(1, Number(d.debloque) || 1, d.niveau || 1, gagnes + 1));
    if (d.options && typeof d.options.son === 'boolean') sonActif = d.options.son;
    ['echarpe', 'bonnet', 'pelage'].forEach((k) => { if (!objetLibre(objet(prog.tenue[k]))) prog.tenue[k] = OBJETS.find((o) => o.type === k).id; });
  }

  function alea(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // Flocons (en coordonnées d'écran)
  const flocons = [];

  // ---------------------------------------------------------------------

  function dessinerRenard(c, x, y, s, o) {

    c.fillStyle = pel.pattes;

    pattes.forEach((px, k) => {

      c.beginPath(); c.roundRect ? c.roundRect(px + balance - 0.045, -0.26, 0.09, 0.26, 0.04) : c.rect(px + balance - 0.045, -0.26, 0.09, 0.26); c.fill(); c.stroke();

  }

  // ---------------------------------------------------------------------
  //  Décor de fond (parallaxe)
  // ---------------------------------------------------------------------
  const cacheCiel = {};
  function ciel(c, P, w, h) {
    const cle = P.ciel.join() + w + 'x' + h;
    if (!cacheCiel[cle]) {
      const gr = c.createLinearGradient(0, 0, 0, h);
      gr.addColorStop(0, P.ciel[0]); gr.addColorStop(0.55, P.ciel[1]); gr.addColorStop(1, P.ciel[2]);
      cacheCiel[cle] = gr;
    }
    c.fillStyle = cacheCiel[cle]; c.fillRect(0, 0, w, h);
  }
  function crete(c, decal, base, amp, couleur, graine, w, h, pointu) {
    c.fillStyle = couleur; c.beginPath(); c.moveTo(0, h);
    for (let sx = 0; sx <= w + 8; sx += 8) {
      const wx = (sx + decal) * 0.01;
      let v = Math.sin(wx * 0.9 + graine) * 0.5 + Math.sin(wx * 2.3 + graine * 2) * 0.25 + Math.sin(wx * 5.1 + graine) * 0.12;
      if (pointu) v = 1 - Math.abs(Math.sin(wx * 0.8 + graine)) * 1.1 + Math.sin(wx * 3.3) * 0.1;
      c.lineTo(sx, base - amp * v);

  }

    }
  }
  function decor(c, P, nom, camX, camY, s, t) {
    ciel(c, P, LW, LH);
    if (nom === 'foret' || nom === 'sommet') {
      // étoiles du ciel
      c.fillStyle = 'rgba(255,255,255,.8)';
      const r = alea(7);

      const dec = camX * s * 0.35, pas = 90;
      for (let i = -1; i < LW / pas + 2; i++) {
        const wx = Math.floor(dec / pas) + i;
        const r = alea(wx * 13 + 5);
        sapin(c, wx * pas - dec + r() * 40, LH * 0.6 + r() * 30, 90 + r() * 70, P.proche);
      }
    } else if (nom === 'lac') {
      c.fillStyle = 'rgba(255,255,255,.75)'; rond(c, LW * 0.2, LH * 0.15, Math.min(LW, LH) * 0.07);
      crete(c, camX * s * 0.1, LH * 0.5 - camY * s * 0.02, LH * 0.14, P.loin, 3, LW, LH, true);
      c.fillStyle = 'rgba(210,240,255,.6)'; c.fillRect(0, LH * 0.58 - camY * s * 0.03, LW, LH);

      for (let i = 0; i < 6; i++) { const yy = LH * 0.62 + i * 26 - camY * s * 0.03; const xx = ((i * 140 - camX * s * 0.3) % (LW + 200) + LW + 200) % (LW + 200) - 100; c.beginPath(); c.moveTo(xx, yy); c.lineTo(xx + 80, yy); c.stroke(); }
      const dec = camX * s * 0.4, pas = 160;
      for (let i = -1; i < LW / pas + 2; i++) { const wx = Math.floor(dec / pas) + i; const r = alea(wx * 7 + 2); if (r() < 0.5) sapin(c, wx * pas - dec + r() * 60, LH * 0.62 - camY * s * 0.03, 50 + r() * 30, P.proche); }
    } else if (nom === 'grotte') {

      c.lineTo(LW, 0); c.fill();
    } else {
      // sommet : soleil couchant et grands pics
      const sol = c.createRadialGradient(LW * 0.5, LH * 0.42, 5, LW * 0.5, LH * 0.42, LH * 0.3);

  // ---------------------------------------------------------------------
  //  État de la partie
  // ---------------------------------------------------------------------
  let mode = 'titre';
  let jeu = null;
  const touches = { gauche: false, droite: false, saut: false };
  let demandePlonge = false, demandeSaut = false;

  const JOUEUR_L = 0.78, JOUEUR_H = 0.72;
  const VMAX = 6.2, GRAV = 38, SAUT = 11.2, GRAV_TENU = 13, TENU_MAX = 0.3;

  function nouvellePartie(n) {
    const def = NIVEAUX[n];
    const carte = construire(def);
    const baiesTotal = carte.E.baies.length;
    jeu = {
      n, def, carte, P: PAYSAGES[def.paysage], baiesTotal, baiesPrises: 0, serie: 0, serieT: 0,
      coeurs: 3, temps: 0, etat: 'jeu', pause: false, tuto: false, attente: null,
      etats: new Map(), particules: [], secousse: 0, glisseT: 0,
      reprise: { x: carte.depart.x, y: carte.depart.y - JOUEUR_H },
      cam: { x: 0, y: 0 },
      p: null, ventAvant: false,
    };
    placerJoueur();
    jeu.cam.x = jeu.p.x - 4; jeu.cam.y = jeu.p.y - 8;
    mode = 'jeu';
    afficherEcran(null);
    $('hud').classList.remove('cache');
    $('commandes').classList.remove('cache');
    majHud();
    // Tutoriel des nouvelles mécaniques
    const aMontrer = def.tutos.filter((k) => !prog.tutos.includes(k));
    try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (e) { /* rien */ }
    if (aMontrer.length) ouvrirTuto(aMontrer);
    else annoncer(tr('paysage.' + def.paysage));
  }
  function placerJoueur() {
    jeu.p = { x: jeu.reprise.x, y: jeu.reprise.y, w: JOUEUR_L, h: JOUEUR_H, vx: 0, vy: 0, vent: 0, sol: false, solType: '', dir: 1,
      coyote: 0, tampon: 0, tenu: 0, tenuActif: false, plonge: false, dansPoudre: false, course: 0, ecrase: 0, invincible: 1.2, visible: true,
      dernierSol: jeu.reprise.y };
  }

  // ---------------------------------------------------------------------
  //  Grille : lecture et solidité
  // ---------------------------------------------------------------------
  function tuile(tx, ty) {
    const C = jeu.carte;
    if (tx < 0 || tx >= C.W) return '=';
    if (ty < 0 || ty >= C.H) return ' ';
    return C.grille[ty * C.W + tx];
  }
  function etatTuile(tx, ty) { return jeu.etats.get(ty * jeu.carte.W + tx); }
  function solide(tx, ty) {
    const c = tuile(tx, ty);
    if (c === '#' || c === '=' || c === '_') return true;
    if (c === '~') return !jeu.p.plonge;
    if (c === 'c') { const s = etatTuile(tx, ty); return !(s && s.tombe); }
    if (c === 'b') { const s = etatTuile(tx, ty); return !(s && s.fondu); }
    return false;
  }
  function recouvre(p, f) {
    const x0 = Math.floor(p.x), x1 = Math.floor(p.x + p.w - 0.001), y0 = Math.floor(p.y), y1 = Math.floor(p.y + p.h - 0.001);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (f(tuile(tx, ty), tx, ty)) return true;
    return false;
  }

  function deplacer(p, dx, dy) {
    // Horizontal
    p.x += dx;
    if (dx !== 0) {
      const y0 = Math.floor(p.y + 0.02), y1 = Math.floor(p.y + p.h - 0.02);
      if (dx > 0) {
        const tx = Math.floor(p.x + p.w);
        for (let ty = y0; ty <= y1; ty++) if (solide(tx, ty)) { p.x = tx - p.w - 0.0005; p.vx = 0; break; }
      } else {
        const tx = Math.floor(p.x);
        for (let ty = y0; ty <= y1; ty++) if (solide(tx, ty)) { p.x = tx + 1.0005; p.vx = 0; break; }
      }
    }
    // Vertical
    p.y += dy;
    const etaitAuSol = p.sol;
    p.sol = false;
    const x0 = Math.floor(p.x + 0.02), x1 = Math.floor(p.x + p.w - 0.02);
    if (dy > 0) {
      const ty = Math.floor(p.y + p.h);
      let touche = false;
      let type = '';
      for (let tx = x0; tx <= x1; tx++) if (solide(tx, ty)) { touche = true; const c = tuile(tx, ty); if (c === '_' || type === '') type = c; }
      if (touche) {
        const chute = p.vy;
        p.y = ty - p.h; p.vy = 0; p.sol = true; p.solType = type; p.dernierSol = p.y;
        if (!etaitAuSol && chute > 9) { bouffee(p.x + p.w / 2, p.y + p.h, 6, '#ffffff'); Son.atterrir(); p.ecrase = Math.min(1, chute / 20); }
        if (p.plonge) { p.plonge = false; bouffee(p.x + p.w / 2, p.y + p.h, 14, '#ffffff'); Son.poudre(); jeu.secousse = 0.15; }
      }
    } else if (dy < 0) {
      const ty = Math.floor(p.y);
      for (let tx = x0; tx <= x1; tx++) if (solide(tx, ty)) { p.y = ty + 1; p.vy = 0; break; }
    }
  }

  // ---------------------------------------------------------------------

  function bouffee(x, y, n, couleur, force = 3) {
    for (let i = 0; i < n; i++) jeu.particules.push({ x, y, vx: (Math.random() - 0.5) * force * 2, vy: -Math.random() * force, vie: 0.6 + Math.random() * 0.4, t: 0, r: 0.06 + Math.random() * 0.1, c: couleur, g: 6 });
  }
  function etincelles(x, y, n, couleur) {
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 3; jeu.particules.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 0.5 + Math.random() * 0.3, t: 0, r: 0.05 + Math.random() * 0.06, c: couleur, g: 2, etoile: true }); }
  }

  // ---------------------------------------------------------------------
  function ventActif(v, t) {
    const periode = 3.4, actif = 1.9;
    return ((t + v.phase) % periode) < actif;
  }
  function ventBientot(v, t) {
    const periode = 3.4, actif = 1.9, m = (t + v.phase) % periode;
    return m > periode - 0.6;
  }

  function mettreAJour(dt) {
    const J = jeu, p = J.p, C = J.carte;
    J.temps += dt;
    J.secousse = Math.max(0, J.secousse - dt);
    if (J.serieT > 0) { J.serieT -= dt; if (J.serieT <= 0) J.serie = 0; }

    // Attente (après une chute, à l'arrivée)
    if (J.attente) {
      J.attente.t -= dt;
      if (J.attente.t <= 0) { const f = J.attente.f; J.attente = null; f(); }
    }

    // Tuiles qui changent (congères, ponts)
    J.etats.forEach((s, cle) => {
      const tx = cle % C.W, ty = Math.floor(cle / C.W);
      const c = C.grille[cle];
      if (c === 'c') {
        if (!s.tombe) { s.t += dt; if (s.t > 0.5) { s.tombe = true; s.r = 0; Son.craque(); bouffee(tx + 0.5, ty + 0.5, 10, '#f5f9ff', 2); } }
        else { s.r += dt; if (s.r > 3.5 && !chevauche(p, tx, ty)) J.etats.delete(cle); }
      } else if (c === 'b') {
        if (s.fondu) { s.r += dt; if (s.r > 4 && !chevauche(p, tx, ty)) J.etats.delete(cle); }
        else if (!s.dessus) { s.fonte = Math.max(0, s.fonte - dt * 0.4); if (s.fonte === 0) J.etats.delete(cle); }
        s.dessus = false;
      }
    });

    // Lièvres
    C.E.lievres.forEach((h) => {
      h.t += dt;
      h.ecrase = Math.max(0, h.ecrase - dt * 4);
      const cycle = h.t % 3.4;
      if (cycle < 2.2) {
        h.x += h.dir * 1.3 * dt;
        h.saut = Math.abs(Math.sin(cycle * 7)) * 0.15;
        if (h.x > h.max) { h.x = h.max; h.dir = -1; }
        if (h.x < h.min) { h.x = h.min; h.dir = 1; }
      } else h.saut = 0;
    });

    // Stalactites
    const pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
    C.E.stalactites.forEach((s) => {
      s.t += dt;
      if (s.etat === 'pend') {
        if (p.visible && Math.abs(pcx - s.x) < 1.4 && pcy > s.y0 && pcy - s.y0 < 10) { s.etat = 'tremble'; s.t = 0; Son.glacon(); }
      } else if (s.etat === 'tremble') {
        if (s.t > 0.55) { s.etat = 'chute'; s.vy = 0; s.t = 0; }
      } else if (s.etat === 'chute') {
        s.vy += 40 * dt; s.y += s.vy * dt;
        const bas = s.y + 1.05;
        if (solide(Math.floor(s.x), Math.floor(bas)) || s.y > C.H) { s.etat = 'casse'; s.t = 0; Son.casse(); etincelles(s.x, bas, 12, '#bfe9ff'); }
        else if (p.visible && p.invincible <= 0 && Math.abs(pcx - s.x) < 0.55 && bas > p.y + 0.1 && s.y < p.y + p.h) { s.etat = 'casse'; s.t = 0; Son.casse(); etincelles(s.x, bas, 12, '#bfe9ff'); perdreCoeur(); }
      } else if (s.etat === 'casse') {
        if (s.t > 3) { s.etat = 'pousse'; s.t = 0; s.y = s.y0; }
      } else if (s.etat === 'pousse') {
        if (s.t > 0.8) { s.etat = 'pend'; s.t = 0; }
      }
    });

    // Particules
    J.particules.forEach((q) => { q.t += dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; });
    J.particules = J.particules.filter((q) => q.t < q.vie);

    if (J.etat !== 'jeu' || !p.visible) return;

    // --- Commandes ---
    if (demandeSaut) { p.tampon = 0.13; demandeSaut = false; }
    p.tampon = Math.max(0, p.tampon - dt);
    p.coyote = p.sol ? 0.1 : Math.max(0, p.coyote - dt);
    p.invincible = Math.max(0, p.invincible - dt);
    p.ecrase = Math.max(0, p.ecrase - dt * 5);
    let dir = (touches.droite ? 1 : 0) - (touches.gauche ? 1 : 0);
    if (dir) p.dir = dir;

    const surGlace = p.sol && p.solType === '_';
    const accel = p.dansPoudre ? 20 : surGlace ? 8 : p.sol ? 55 : 30;
    const frein = surGlace ? 3 : p.sol ? 50 : 10;
    const vmax = p.dansPoudre ? 2.4 : VMAX;
    if (dir) {
      const cible = dir * vmax;
      if (p.vx < cible) p.vx = Math.min(cible, p.vx + accel * dt);
      else if (p.vx > cible) p.vx = Math.max(cible, p.vx - accel * dt);
    } else {
      if (p.vx > 0) p.vx = Math.max(0, p.vx - frein * dt); else p.vx = Math.min(0, p.vx + frein * dt);
    }
    if (surGlace && Math.abs(p.vx) > 2) { J.glisseT -= dt; if (J.glisseT <= 0) { Son.glisse(); J.glisseT = 0.35; bouffee(p.x + p.w / 2, p.y + p.h, 1, '#dff6ff', 1); } }

    // Plongeon
    if (demandePlonge) {
      demandePlonge = false;
      if (!p.plonge) {
        const sousPieds = (() => { const ty = Math.floor(p.y + p.h + 0.05); for (let tx = Math.floor(p.x + 0.05); tx <= Math.floor(p.x + p.w - 0.05); tx++) if (tuile(tx, ty) === '~') return true; return false; })();
        if (!p.sol || sousPieds) {
          p.plonge = true; p.vy = p.sol ? 6 : Math.max(p.vy, 14); p.vx *= 0.5; p.sol = false; p.tenuActif = false;
          Son.plonge(); bouffee(p.x + p.w / 2, p.y + p.h, 6, '#ffffff');
        } else { p.ecrase = 0.6; bouffee(p.x + p.w / 2, p.y + p.h, 3, '#ffffff', 1.5); }
      }
    }

    // Saut
    if (p.tampon > 0 && (p.sol || p.coyote > 0) && !p.plonge) {
      p.vy = -SAUT; p.sol = false; p.coyote = 0; p.tampon = 0; p.tenu = 0; p.tenuActif = true; p.grandBond = false;
      Son.saut(); bouffee(p.x + p.w / 2, p.y + p.h, 4, '#ffffff', 1.5);
    }
    if (p.tenuActif) {
      if (touches.saut && p.vy < 0 && p.tenu < TENU_MAX) {
        p.tenu += dt;
        if (p.tenu > 0.14 && !p.grandBond) { p.grandBond = true; Son.grandBond(); }
      } else p.tenuActif = false;
    }

    // Gravité
    if (p.plonge) {
      p.dansPoudre = recouvre(p, (c) => c === '~');
      p.vy = p.dansPoudre ? 4.5 : Math.max(p.vy + GRAV * dt, 14);
      if (p.dansPoudre && Math.random() < dt * 20) bouffee(p.x + p.w / 2, p.y + p.h / 2, 1, '#ffffff', 1.5);
    } else {
      p.dansPoudre = false;
      const grav = p.tenuActif ? GRAV_TENU : GRAV;
      p.vy = Math.min(18, p.vy + grav * dt);
      // Pris dans la poudreuse sans plonger : on s'y enfonce
      if (recouvre(p, (c) => c === '~')) p.plonge = true;
    }

    // Bourrasques
    let cibleVent = 0;
    C.E.vents.forEach((v) => {
      if (pcx >= v.x0 && pcx <= v.x1 && pcy >= v.yMin && pcy <= v.yMax && ventActif(v, J.temps)) cibleVent = v.dir * 3.0;
    });
    if (cibleVent && !J.ventAvant) Son.rafale();
    J.ventAvant = !!cibleVent;
    p.vent += (cibleVent - p.vent) * Math.min(1, dt * 4);

    deplacer(p, (p.vx + p.vent) * dt, p.vy * dt);
    if (p.sol) p.course += Math.abs(p.vx) * dt * 3.2; else p.course += dt * 2;

    // Ce qu'il y a sous les pieds : congères et ponts
    if (p.sol) {
      const ty = Math.floor(p.y + p.h + 0.05);
      for (let tx = Math.floor(p.x + 0.02); tx <= Math.floor(p.x + p.w - 0.02); tx++) {
        const c = tuile(tx, ty), cle = ty * C.W + tx;
        if (c === 'c' && !J.etats.has(cle)) { J.etats.set(cle, { t: 0 }); bouffee(tx + 0.5, ty, 3, '#ffffff', 1); }
        if (c === 'b') {
          let s = J.etats.get(cle);
          if (!s) { s = { fonte: 0 }; J.etats.set(cle, s); }
          if (!s.fondu) {
            s.dessus = true; s.fonte += dt;
            if (Math.random() < dt * 8) bouffee(tx + Math.random(), ty + 0.3, 1, '#bfe9ff', 0.6);
            if (s.fonte > 0.9) { s.fondu = true; s.r = 0; Son.craque(); bouffee(tx + 0.5, ty + 0.3, 8, '#e2f2ff', 1.5); }
          }
        }
      }
    }

    // Lièvres : tremplin
    C.E.lievres.forEach((h) => {
      const hx0 = h.x - 0.45, hx1 = h.x + 0.45, haut = h.y - 0.8 - h.saut;
      if (p.vy > 0 && p.x + p.w > hx0 && p.x < hx1 && p.y + p.h > haut && p.y + p.h - p.vy * dt <= haut + 0.35) {
        p.y = haut - p.h; p.vy = -19.5; p.plonge = false; p.tenu = 0; p.tenuActif = true; p.grandBond = true;
        h.ecrase = 1; Son.boing(); bouffee(h.x, haut, 8, '#ffffff', 2); etincelles(h.x, haut, 6, '#ffd27a');
      }
    });

    // Baies
    C.E.baies.forEach((o) => {
      if (o.prise) return;
      if (Math.abs(o.x - pcx) < 0.65 && Math.abs(o.y - pcy) < 0.7) {
        o.prise = true; J.baiesPrises++; J.serie++; J.serieT = 1.2;
        Son.baie(J.serie); etincelles(o.x, o.y, 10, '#ff6b7d'); majHud();
      }
    });

    // Lanternes
    C.E.lanternes.forEach((l) => {
      if (!l.allumee && Math.abs(l.x - pcx) < 0.9 && pcy > l.y - 1.6 && pcy < l.y + 0.4) {
        C.E.lanternes.forEach((a) => { if (a !== l) a.dernier = false; });
        l.allumee = true; l.dernier = true;
        J.reprise = { x: l.x - 0.6, y: l.y - JOUEUR_H - 0.01 };
        Son.lanterne(); etincelles(l.x + 0.25, l.y - 0.8, 14, '#ffd27a'); annoncer(tr('annonce.lanterne'));
      }
    });

    // Eau glacée
    if (recouvre({ x: p.x + 0.1, y: p.y + p.h * 0.5, w: p.w - 0.2, h: p.h * 0.5 }, (c) => c === 'e')) {
      bouffee(pcx, p.y + p.h, 14, '#9fe3ff', 3); perdreCoeur(true); return;
    }
    // Chute dans le vide
    if (p.y > p.dernierSol + 12 || p.y > C.H + 1) { perdreCoeur(true); return; }

    // Arrivée
    const but = C.E.but;
    if (but && Math.abs(pcx - but.x) < 0.9 && Math.abs(p.y + p.h - but.y) < 1.2) arriver();
  }
  function chevauche(p, tx, ty) { return p.x < tx + 1 && p.x + p.w > tx && p.y < ty + 1 && p.y + p.h > ty; }

  // ---------------------------------------------------------------------
  //  Cœurs, arrivée, fin de niveau
  // ---------------------------------------------------------------------
  function perdreCoeur(cacher) {
    const J = jeu, p = J.p;
    if (J.etat !== 'jeu' || !p.visible) return;
    if (!cacher && p.invincible > 0) return;
    J.coeurs--; J.secousse = 0.4;
    Son.aie(); majHud();
    p.visible = !cacher; p.vx = 0; p.vy = 0;
    if (J.coeurs <= 0) {
      J.etat = 'perdu'; p.visible = false;
      J.attente = { t: 0.9, f: afficherDefaite };
    } else {
      annoncer(tr('annonce.coeur'));
      if (cacher) J.attente = { t: 0.7, f: () => { placerJoueur(); } };
      else { p.invincible = 1.5; p.vy = -6; }
    }
  }

  function arriver() {
    const J = jeu;
    J.etat = 'arrive';
    J.p.vx = 0;
    Son.victoire();
    etincelles(J.carte.E.but.x, J.carte.E.but.y - 1, 30, '#ffd27a');
    J.attente = { t: 1.1, f: afficherVictoire };
  }

  function etoilesPour(prises, total) {
    if (prises >= total) return 3;
    if (prises * 2 >= total) return 2;
    return 1;
  }

  // Passe à l'écran de victoire (une seule fois par niveau gagné)
  function afficherVictoire() {
    const J = jeu, n = J.n;
    const etoiles = etoilesPour(J.baiesPrises, J.baiesTotal);
    const bonus = Math.max(0, Math.round((J.carte.par - J.temps) * 3));
    const score = J.baiesPrises * 10 + J.coeurs * 25 + bonus;
    const libresAvant = OBJETS.filter(objetLibre).map((o) => o.id);
    const ancienRecord = prog.records[n];
    const record = score > ancienRecord;
    prog.etoiles[n] = Math.max(prog.etoiles[n], etoiles);
    if (record) prog.records[n] = score;
    prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, n + 2));
    const ami = J.def.ami;
    if (ami && !prog.amis.includes(ami)) prog.amis.push(ami);
    const nouveaux = OBJETS.filter((o) => objetLibre(o) && !libresAvant.includes(o.id));
    sauverProg(n + 2, score);
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
    if (prog.etoiles.every((e) => e > 0)) {
      if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: MAX_ETOILES });
    }

    mode = 'victoire';
    $('hud').classList.add('cache'); $('commandes').classList.add('cache');
    const dernier = n === NIVEAUX.length - 1;
    $('vTitre').textContent = dernier ? tr('victoire.titreFin') : tr('victoire.titre', { n: n + 1 });
    $('vBaies').textContent = tr('victoire.baies', { n: J.baiesPrises, total: J.baiesTotal });
    $('vRecord').textContent = record ? tr('victoire.record') : tr('victoire.ancienRecord', { n: nb(ancienRecord) });
    $('vRecord').className = record ? 'record' : '';
    $('vObjet').textContent = nouveaux.length ? tr('victoire.objet', { objet: tr('objet.' + nouveaux[0].id) }) : '';
    $('vFinal').textContent = dernier ? tr('victoire.final', { n: totalEtoiles(), max: MAX_ETOILES }) : '';
    $('btnSuivant').classList.toggle('cache', dernier);
    // Ami de l'hiver
    const blocAmi = $('vAmi');
    if (ami) {
      blocAmi.classList.remove('cache');
      $('amiNom').textContent = tr('ami.' + ami + '.nom');
      $('amiTexte').textContent = tr('ami.' + ami + '.texte');
      $('amiCadeau').textContent = tr('ami.cadeau', { objet: tr('objet.' + AMIS[ami].cadeau) });
      setTimeout(() => Son.ami(), 900);
    } else blocAmi.classList.add('cache');
    afficherEcran('ecranVictoire');
    // Étoiles qui s'allument une à une, score qui défile
    const svgs = $('vEtoiles').querySelectorAll('svg');
    svgs.forEach((s) => s.classList.remove('allumee'));
    for (let i = 0; i < etoiles; i++) setTimeout(() => { svgs[i].classList.add('allumee'); Son.etoile(i); }, 350 + i * 330);
    const debut = performance.now();
    const compter = (t) => {
      const f = Math.min(1, (t - debut) / 900);
      $('vScore').textContent = tr('victoire.score', { n: nb(Math.round(score * f)) });
      if (f < 1 && mode === 'victoire') requestAnimationFrame(compter);
    };
    requestAnimationFrame(compter);
    confettis = [];
    for (let i = 0; i < 70; i++) confettis.push({ x: Math.random() * LW, y: -Math.random() * LH * 0.5, vx: (Math.random() - 0.5) * 40, vy: 60 + Math.random() * 80, r: 3 + Math.random() * 4, c: ['#ffffff', '#ffd27a', '#ff6b7d', '#9fe3ff'][i % 4], a: Math.random() * 6 });
  }
  let confettis = [];

  // Passe à l'écran de défaite
  function afficherDefaite() {
    const J = jeu;
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: J.n + 1 });
    Son.defaite();
    mode = 'defaite';
    $('hud').classList.add('cache'); $('commandes').classList.add('cache');
    $('dBaies').textContent = tr('defaite.baies', { n: J.baiesPrises, total: J.baiesTotal });
    $('dRecord').textContent = prog.records[J.n] ? tr('victoire.ancienRecord', { n: nb(prog.records[J.n]) }) : '';
    afficherEcran('ecranDefaite');
  }

  // ---------------------------------------------------------------------
  //  Dessin de la partie
  // ---------------------------------------------------------------------
  function tailleCase() { return Math.max(28, Math.min(LW / 9.5, LH / 12.5)); }

  function dessinerPartie(dt) {
    const J = jeu, C = J.carte, P = J.P, p = J.p;
    const s = tailleCase();
    const vueL = LW / s, vueH = LH / s;
    // Caméra
    const cibleX = p.x + p.w / 2 - vueL * 0.42 + p.dir * 1.2;
    const cibleY = p.y - vueH * 0.56;
    J.cam.x += (cibleX - J.cam.x) * Math.min(1, dt * 5);
    J.cam.y += (cibleY - J.cam.y) * Math.min(1, dt * 4);
    J.cam.x = Math.max(0, Math.min(C.W - vueL, J.cam.x));
    J.cam.y = Math.max(0, Math.min(C.H - vueH, J.cam.y));
    if (C.W < vueL) J.cam.x = (C.W - vueL) / 2;
    let cx = J.cam.x, cy = J.cam.y;
    if (J.secousse > 0) { cx += (Math.random() - 0.5) * 0.25 * J.secousse * 3; cy += (Math.random() - 0.5) * 0.25 * J.secousse * 3; }

    decor(ctx, P, J.def.paysage, cx, cy, s, J.temps);

    const X = (wx) => (wx - cx) * s, Y = (wy) => (wy - cy) * s;
    const tx0 = Math.floor(cx) - 1, tx1 = Math.ceil(cx + vueL) + 1, ty0 = Math.floor(cy) - 1, ty1 = Math.ceil(cy + vueH) + 1;

    // Bourrasques (derrière)
    C.E.vents.forEach((v) => {
      const actif = ventActif(v, J.temps), bientot = ventBientot(v, J.temps);
      if (v.x1 < tx0 || v.x0 > tx1) return;
      const r = alea(v.x0 * 31);
      ctx.strokeStyle = actif ? 'rgba(255,255,255,.75)' : bientot ? 'rgba(255,255,255,.35)' : 'rgba(255,255,255,.12)';
      ctx.lineWidth = 2;
      const n = actif ? 40 : 14;
      for (let i = 0; i < n; i++) {
        const yy = v.yMin + r() * (v.yMax - v.yMin);
        const vit = (actif ? 9 : 2) * (0.7 + r() * 0.6);
        const larg = v.x1 - v.x0;
        let xx = (r() * larg + v.dir * J.temps * vit) % larg; if (xx < 0) xx += larg;
        xx += v.x0;
        const lg = actif ? 0.9 : 0.3;
        ctx.beginPath(); ctx.moveTo(X(xx), Y(yy)); ctx.lineTo(X(xx - v.dir * lg), Y(yy + 0.05)); ctx.stroke();
        ctx.fillStyle = ctx.strokeStyle; rond(ctx, X(xx), Y(yy), 2);
      }
    });

    // Tuiles
    for (let ty = Math.max(0, ty0); ty <= Math.min(C.H - 1, ty1); ty++) {
      for (let tx = Math.max(0, tx0); tx <= Math.min(C.W - 1, tx1); tx++) {
        const c = C.grille[ty * C.W + tx];
        if (c === ' ') continue;
        const px = X(tx), py = Y(ty);
        const dessus = tuile(tx, ty - 1);
        const libre = dessus === ' ' || dessus === 'e' || dessus === 'b' || dessus === 'c';
        if (c === '#') {
          ctx.fillStyle = P.terre; ctx.fillRect(px, py, s + 0.6, s + 0.6);
          ctx.fillStyle = 'rgba(255,255,255,.07)'; if ((tx * 7 + ty * 3) % 5 === 0) rond(ctx, px + s * 0.3, py + s * 0.6, s * 0.08);
          if (libre || dessus === '~') {
            ctx.fillStyle = P.neigeOmbre; ctx.fillRect(px, py, s + 0.6, s * 0.5);
            ctx.fillStyle = P.neige; ctx.fillRect(px, py, s + 0.6, s * 0.38);
            rond(ctx, px + s * 0.25, py + s * 0.38, s * 0.13); rond(ctx, px + s * 0.75, py + s * 0.4, s * 0.11);
          }
        } else if (c === '_') {
          ctx.fillStyle = P.terre; ctx.fillRect(px, py, s + 0.6, s + 0.6);
          ctx.fillStyle = P.glace; ctx.fillRect(px, py, s + 0.6, s * 0.45);
          ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(px + s * 0.15, py + s * 0.1, s * 0.35, s * 0.06);
          ctx.fillStyle = 'rgba(80,160,220,.35)'; ctx.fillRect(px, py + s * 0.38, s + 0.6, s * 0.07);
        } else if (c === '=') {
          ctx.fillStyle = P.roche; ctx.fillRect(px, py, s + 0.6, s + 0.6);
          ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(px + s * 0.2, py + s * ((tx + ty) % 2 ? 0.3 : 0.7)); ctx.lineTo(px + s * 0.6, py + s * 0.5); ctx.stroke();
          if (libre) { ctx.fillStyle = P.neige; ctx.fillRect(px, py, s + 0.6, s * 0.25); rond(ctx, px + s * 0.5, py + s * 0.25, s * 0.12); }
          // pointes de glace sous le plafond
          if (tuile(tx, ty + 1) === ' ' && J.def.paysage !== 'foret') {
            ctx.fillStyle = 'rgba(190,235,255,.7)'; ctx.beginPath(); ctx.moveTo(px + s * 0.15, py + s); ctx.lineTo(px + s * 0.3, py + s * 1.25); ctx.lineTo(px + s * 0.45, py + s); ctx.fill();
          }
        } else if (c === '~') {
          ctx.fillStyle = 'rgba(255,255,255,.82)';
          ctx.fillRect(px, py + (libre ? s * 0.2 : 0), s + 0.6, s * (libre ? 0.8 : 1) + 0.6);
          if (libre) { rond(ctx, px + s * 0.25, py + s * 0.28, s * 0.22); rond(ctx, px + s * 0.72, py + s * 0.25, s * 0.25); }
          ctx.fillStyle = 'rgba(200,225,255,.6)'; rond(ctx, px + s * 0.5, py + s * 0.7, s * 0.12);
          const sc = Math.sin(J.temps * 3 + tx * 1.7 + ty);

        } else if (c === 'c') {

          ctx.fillStyle = P.neigeOmbre; ctx.beginPath(); ctx.ellipse(px + s / 2 + tremble, py + s * 0.6, s * 0.56, s * 0.42, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = P.neige; ctx.beginPath(); ctx.ellipse(px + s / 2 + tremble, py + s * 0.45, s * 0.52, s * 0.38, 0, 0, Math.PI * 2); ctx.fill();
          if (st) { ctx.strokeStyle = 'rgba(80,110,170,.6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(px + s * 0.3, py + s * 0.2); ctx.lineTo(px + s * 0.45, py + s * 0.5); ctx.lineTo(px + s * 0.35, py + s * 0.75); ctx.stroke(); }

  }

  // Écran titre dessiné (sert aussi de jaquette)
  let tempsTitre = 0;
  function dessinerTitre(dt) {
    tempsTitre += dt;

    const P = PAYSAGES.foret;
    const gr = ctx.createLinearGradient(0, 0, 0, LH);
    gr.addColorStop(0, '#121a45'); gr.addColorStop(0.5, '#34508f'); gr.addColorStop(1, '#9db9e8');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, LW, LH);

  // ---------------------------------------------------------------------
  //  Boucle principale
  // ---------------------------------------------------------------------
  let dernier = performance.now();
  function boucle(maintenant) {
    let dt = Math.min(0.05, (maintenant - dernier) / 1000);
    dernier = maintenant;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (jeu && (mode === 'jeu' || mode === 'victoire' || mode === 'defaite')) {
      if (mode === 'jeu' && !jeu.pause && !jeu.tuto) {
        let reste = dt;
        while (reste > 0) { const pas = Math.min(1 / 120, reste); mettreAJour(pas); reste -= pas; }
      }
      dessinerPartie(mode === 'jeu' && !jeu.pause && !jeu.tuto ? dt : 0);
      if (mode === 'victoire') {
        confettis.forEach((q) => { q.y += q.vy * dt; q.x += q.vx * dt + Math.sin(q.a + q.y * 0.02) * 0.5; ctx.fillStyle = q.c; rond(ctx, q.x, q.y, q.r); });
      }

    if (mode === 'garde') dessinerApercu();
    if (mode === 'victoire' && !$('vAmi').classList.contains('cache')) dessinerAmiCarte();
    requestAnimationFrame(boucle);
  }

  // ---------------------------------------------------------------------
  //  Tutoriel animé
  // ---------------------------------------------------------------------
  const tutoToile = $('tutoCanvas'), tctx = tutoToile.getContext('2d');

  }
  function majTuto() {
    const cle = tuto.cles[tuto.i];
    $('tutoTitre').textContent = tr('tuto.titre.' + cle);
    $('tutoTexte').textContent = tr('tuto.' + cle);
    const pts = $('tutoPoints'); pts.innerHTML = '';
    tuto.cles.forEach((_, k) => { const i = document.createElement('i'); if (k === tuto.i) i.className = 'on'; pts.appendChild(i); });
    $('btnTutoOk').textContent = tuto.i < tuto.cles.length - 1 ? tr('bouton.suite') : tr('bouton.compris');
  }
  function tutoSuivant() {
    if (!tuto) return;

    if (!prog.tutos.includes(cle)) prog.tutos.push(cle);
    if (tuto.i < tuto.cles.length - 1) { tuto.i++; tuto.t = 0; majTuto(); return; }

  // Main dessinée qui montre le geste
  function main(c, x, y, k, appui) {

    c.beginPath(); c.roundRect ? c.roundRect(-0.13, -0.05 + appui * 0.12, 0.26, 0.7, 0.13) : c.rect(-0.13, -0.05, 0.26, 0.7); c.fill(); c.stroke();
    c.beginPath(); c.roundRect ? c.roundRect(-0.35, 0.35 + appui * 0.12, 0.7, 0.65, 0.25) : c.rect(-0.35, 0.35, 0.7, 0.65); c.fill(); c.stroke();
    c.restore();
  }
  function boutonDemo(c, x, y, r, forme, actif) {
    c.fillStyle = actif ? 'rgba(255,210,122,.85)' : 'rgba(255,255,255,.25)'; c.strokeStyle = '#fff'; c.lineWidth = 3;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.beginPath();

    else if (forme === 'd') { c.moveTo(x - r * 0.3, y - r * 0.45); c.lineTo(x + r * 0.4, y); c.lineTo(x - r * 0.3, y + r * 0.45); }
    else if (forme === 'h') { c.moveTo(x - r * 0.45, y + r * 0.25); c.lineTo(x, y - r * 0.45); c.lineTo(x + r * 0.45, y + r * 0.25); }
    else { c.moveTo(x - r * 0.45, y - r * 0.25); c.lineTo(x, y + r * 0.45); c.lineTo(x + r * 0.45, y - r * 0.25); }

  }
  function dessinerTuto(dt) {
    if (!tuto) return;
    tuto.t += dt;
    const W = tutoToile.width, H = tutoToile.height, c = tctx;
    const cle = tuto.cles[tuto.i];
    const T = (tuto.t % 2.6) / 2.6; // 0 → 1 en boucle
    c.setTransform(1, 0, 0, 1, 0, 0);
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2b4180'); g.addColorStop(1, '#6d8fc9');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    const s = 56, sol = 250;
    const tenue = prog.tenue;
    const ligneSol = (x0, x1, couleur) => { c.fillStyle = '#55709c'; c.fillRect(x0, sol, x1 - x0, H - sol); c.fillStyle = couleur || '#f5f9ff'; c.fillRect(x0, sol, x1 - x0, 16); };
    const renard = (x, y, o) => dessinerRenard(c, x, y, s, Object.assign({ dir: 1, temps: tuto.t, tenue }, o));
    const saute = (f, h) => -Math.sin(Math.PI * Math.min(1, Math.max(0, f))) * h;
    if (cle === 'courir') {
      ligneSol(0, W);
      const dir = T < 0.5 ? 1 : -1;
      const x = T < 0.5 ? 200 + T * 2 * 240 : 440 - (T - 0.5) * 2 * 240;
      renard(x, sol, { dir, course: tuto.t * 18 });

    } else if (cle === 'sauter' || cle === 'baies') {

      const x = 120 + T * 420;

    } else if (cle === 'plonger') {

      c.fillStyle = 'rgba(255,255,255,.9)'; c.fillRect(250, sol - 4, 200, 60);
      c.fillStyle = '#2b4180'; c.fillRect(250, sol + 56, 200, 34);

      let x, y, plonge = false;

      else if (T < 0.75) { x = 270 + (T - 0.35) * 150; y = sol + (T - 0.35) / 0.4 * 90; plonge = true; }
      else { x = 330 + (T - 0.75) * 200; y = sol + 90; }
      renard(x, y, { course: tuto.t * 12, air: T < 0.75, plonge });
      const gl = T > 0.25 && T < 0.5 ? (T - 0.25) / 0.25 : 0;
      main(c, W - 90, 40 + gl * 110, 60, 1);
      c.strokeStyle = 'rgba(255,210,122,.9)'; c.lineWidth = 5; c.beginPath(); c.moveTo(W - 90, 40); c.lineTo(W - 90, 40 + gl * 110); c.stroke();
    } else if (cle === 'glace') {
      ligneSol(0, W, '#bfe9ff');
      c.fillStyle = 'rgba(255,255,255,.8)'; for (let i = 0; i < 6; i++) c.fillRect(30 + i * 100, sol + 3, 40, 4);
      const lache = 0.4;
      const x = T < lache ? 80 + T / lache * 260 : 340 + (1 - Math.pow(1 - (T - lache) / (1 - lache), 2)) * 200;
      renard(x, sol, { course: T < lache ? tuto.t * 18 : 0 });
      boutonDemo(c, 140, 70, 34, 'd', T < lache); main(c, 150, 85, 60, T < lache ? 1 : 0);
    } else if (cle === 'congere' || cle === 'eau') {
      ligneSol(0, 160); ligneSol(480, W);
      c.fillStyle = '#2f7fb4'; c.fillRect(160, sol + 20, 320, H);
      c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(160, sol + 22, 320, 5);
      const chute = Math.max(0, T - 0.55) * 400;
      if (cle === 'congere') {
        c.fillStyle = '#f5f9ff';
        const tr2 = T > 0.35 && T < 0.55 ? Math.sin(tuto.t * 60) * 4 : 0;
        if (T < 0.8) { c.globalAlpha = T > 0.55 ? 1 - (T - 0.55) * 4 : 1; c.beginPath(); c.ellipse(320 + tr2, sol + chute, 70, 28, 0, 0, Math.PI * 2); c.fill(); c.globalAlpha = 1; }
        const x = 80 + T * 560;
        let y = sol;
        if (x > 140 && x < 250) y = sol - 10 * ((x - 140) / 110) - Math.sin(Math.PI * (x - 140) / 110) * 70;
        else if (x >= 250 && x <= 390) y = sol - 10;
        else if (x > 390 && x < 500) y = sol - 10 + 10 * ((x - 390) / 110) - Math.sin(Math.PI * (x - 390) / 110) * 70;
        renard(x, y, { course: tuto.t * 18, air: y < sol - 12 });
      } else {
        const x = 60 + T * 560;
        const f = (x - 130) / 380;
        renard(x, sol + saute(f, 140), { course: tuto.t * 18, air: f > 0 && f < 1 });
      }
    } else if (cle === 'vent') {
      ligneSol(0, W);
      const actif = T < 0.6;
      c.strokeStyle = actif ? 'rgba(255,255,255,.85)' : 'rgba(255,255,255,.2)'; c.lineWidth = 3;
      for (let i = 0; i < 14; i++) { const y = 40 + (i * 37) % 200, x = ((i * 97 + tuto.t * (actif ? 500 : 60)) % (W + 80)) - 40; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 40, y); c.stroke(); }
