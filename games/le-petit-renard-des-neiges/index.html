    } else if (cle === 'lievre') {
      ligneSol(0, W);
      c.fillStyle = '#55709c'; c.fillRect(470, sol - 200, W - 470, 200); c.fillStyle = '#f5f9ff'; c.fillRect(470, sol - 200, W - 470, 16);
      const ec = T > 0.33 && T < 0.43 ? 1 - Math.abs(T - 0.38) * 20 : 0;
      dessinerLievre(c, 330, sol, 60, { dir: -1, ecrase: Math.max(0, ec), t: tuto.t });
      let x, y;
      if (T < 0.38) { const f = T / 0.38; x = 120 + f * 210; y = sol - 50 * f - Math.sin(Math.PI * f) * 70; }
      else { const f = Math.min(1, (T - 0.38) / 0.5); x = 330 + f * 230; y = sol - 50 - 150 * f - Math.sin(Math.PI * f) * 110; }
      renard(x, y, { course: tuto.t * 12, air: T < 0.88 });
    } else if (cle === 'stalactite') {
      ligneSol(0, W);
      c.fillStyle = '#2f4a82'; c.fillRect(0, 0, W, 40);
      const y = T < 0.45 ? 40 : 40 + Math.pow((T - 0.45) * 3, 2) * 180;
      const dx = T > 0.25 && T < 0.45 ? Math.sin(tuto.t * 70) * 4 : 0;
      if (y < sol - 50) { c.fillStyle = '#bfe9ff'; c.beginPath(); c.moveTo(300 + dx, y); c.lineTo(320 + dx, y + 60); c.lineTo(340 + dx, y); c.fill(); }
      renard(100 + T * 480, sol, { course: tuto.t * 18 });
    } else if (cle === 'pont') {
      ligneSol(0, 170); ligneSol(470, W);
      const fonte = T > 0.3 && T < 0.65 ? (T - 0.3) / 0.35 : T >= 0.65 ? 1 : 0;
      c.globalAlpha = 1 - fonte * 0.7; c.fillStyle = '#e2f2ff'; c.fillRect(170, sol, 300, 16 - fonte * 8); c.globalAlpha = 1;
      for (let k = 0; k < 8; k++) { c.fillStyle = '#bfe9ff'; c.beginPath(); c.moveTo(180 + k * 38, sol + 14); c.lineTo(188 + k * 38, sol + 22 + fonte * 30); c.lineTo(196 + k * 38, sol + 14); c.fill(); }
      const x = T < 0.3 ? 100 + T / 0.3 * 200 : T < 0.6 ? 300 : 300 + (T - 0.6) / 0.4 * 260;
      renard(x, sol, { course: T < 0.3 || T > 0.6 ? tuto.t * 18 : 0 });
    }
  }

  // ---------------------------------------------------------------------
  //  Écrans et menus
  // ---------------------------------------------------------------------
  const ECRANS = ['ecranTitre', 'ecranNiveaux', 'ecranGarde', 'ecranTuto', 'ecranPause', 'ecranVictoire', 'ecranDefaite'];
  function afficherEcran(id) {
    ECRANS.forEach((e) => $(e).classList.toggle('cache', e !== id));
  }
  function allerTitre() {
    mode = 'titre';
    jeu = null; tuto = null;
    $('hud').classList.add('cache'); $('commandes').classList.add('cache');
    afficherEcran('ecranTitre');
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }
  function lancerNiveau(n) {
    Son.init(); Son.clic();
    relacher();
    nouvellePartie(Math.max(0, Math.min(NIVEAUX.length - 1, n)));
  }
  function relacher() { touches.gauche = touches.droite = touches.saut = false; demandeSaut = demandePlonge = false; document.querySelectorAll('.touche').forEach((b) => b.classList.remove('appuye')); }

  function majHud() {
    if (!jeu) return;
    $('hudNiveau').textContent = tr('hud.niveau', { n: jeu.n + 1 });
    $('hudBaies').textContent = nb(jeu.baiesPrises) + ' / ' + nb(jeu.baiesTotal);
    const cc = $('hudCoeurs'); cc.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      if (i >= jeu.coeurs) svg.setAttribute('class', 'vide');
      const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
      u.setAttribute('href', '#i-coeur'); svg.appendChild(u); cc.appendChild(svg);
    }
    cc.setAttribute('aria-label', tr('aria.coeurs', { n: jeu.coeurs }));
  }

  function mettrePause(oui) {
    if (!jeu || mode !== 'jeu' || jeu.tuto) return;
    jeu.pause = oui;
    relacher();
    afficherEcran(oui ? 'ecranPause' : null);
  }

  // Sélection des niveaux
  function ouvrirNiveaux() {
    Son.init(); Son.clic();
    mode = 'niveaux';
    const grille = $('grilleNiveaux'); grille.innerHTML = '';
    NIVEAUX.forEach((nv, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      const ouvert = i < prog.debloque;
      b.className = 'case ' + nv.paysage + (ouvert ? '' : ' ferme');
      if (ouvert) {
        const num = document.createElement('span'); num.textContent = nb(i + 1); b.appendChild(num);
        const mini = document.createElement('span'); mini.className = 'mini';
        for (let k = 0; k < 3; k++) mini.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 24 24"><use href="#i-etoile" style="fill:${k < prog.etoiles[i] ? '#ffd27a' : 'rgba(255,255,255,.25)'}"/></svg>`);
        b.appendChild(mini);
        b.setAttribute('aria-label', tr('aria.niveau', { n: i + 1, etoiles: prog.etoiles[i] }));
        b.addEventListener('click', () => lancerNiveau(i));
      } else {
        b.insertAdjacentHTML('beforeend', '<svg class="cadenas" viewBox="0 0 24 24"><use href="#i-cadenas"/></svg>');
        b.setAttribute('aria-label', tr('aria.verrou', { n: i + 1 }));
        b.disabled = true;
      }
      grille.appendChild(b);
    });
    $('niveauxTotal').textContent = tr('niveaux.total', { n: totalEtoiles(), max: MAX_ETOILES });
    afficherEcran('ecranNiveaux');
  }

  // Garde-robe
  const apercu = $('apercu'), actx = apercu.getContext('2d');
  function dessinerApercu() {
    actx.setTransform(1, 0, 0, 1, 0, 0);
    actx.clearRect(0, 0, apercu.width, apercu.height);
    actx.fillStyle = '#e8f0ff'; ellipse(actx, 150, 215, 120, 18);
    dessinerRenard(actx, 150, 212, 180, { dir: 1, temps: performance.now() / 1000, tenue: prog.tenue });
  }
  function ouvrirGarde() {
    Son.init(); Son.clic();
    mode = 'garde';
    ['echarpe', 'bonnet', 'pelage'].forEach((type) => {
      const rayon = $('rayon-' + type); rayon.innerHTML = '';
      OBJETS.filter((o) => o.type === type).forEach((o) => {
        const b = document.createElement('button'); b.type = 'button';
        const libre = objetLibre(o);
        b.className = 'objet' + (libre ? '' : ' ferme') + (prog.tenue[type] === o.id ? ' choisi' : '');
        const cv = document.createElement('canvas'); cv.width = 112; cv.height = 92;
        const cc = cv.getContext('2d');
        const essai = Object.assign({}, prog.tenue, { [type]: o.id });
        if (type !== 'pelage') essai.pelage = 'pelage-blanc';
        dessinerRenard(cc, 32, 118, 120, { dir: 1, temps: 0.5, tenue: essai });
        b.appendChild(cv);
        const nom = document.createElement('span');
        nom.textContent = libre ? tr('objet.' + o.id) : (o.ami ? tr('garde.verrouAmi', { ami: tr('ami.' + o.ami + '.court') }) : tr('garde.verrouEtoiles', { n: o.etoiles }));
        b.appendChild(nom);
        b.setAttribute('aria-pressed', prog.tenue[type] === o.id ? 'true' : 'false');
        if (libre) b.addEventListener('click', () => { prog.tenue[type] = o.id; Son.clic(); sauverReglages(); ouvrirGarde(); });
        else b.disabled = true;
        rayon.appendChild(b);
      });
    });
    $('gardeAide').textContent = tr('garde.aide', { n: totalEtoiles(), max: MAX_ETOILES });
    afficherEcran('ecranGarde');
  }

  // Ami sur la carte de victoire
  const amiToile = $('amiCanvas'), amictx = amiToile.getContext('2d');
  function dessinerAmiCarte() {
    if (!jeu || !jeu.def.ami) return;
    const t = performance.now() / 1000;
    amictx.setTransform(1, 0, 0, 1, 0, 0);
    amictx.clearRect(0, 0, amiToile.width, amiToile.height);
    dessinerRenard(amictx, 92, 200, 100, { dir: 1, temps: t, tenue: prog.tenue });
    dessinerAmi(amictx, jeu.def.ami, 212, 200, 98, t);
    dessinerBaie(amictx, 140, 70 + Math.sin(t * 2) * 6, 34, t);
  }

  // Son
  function majBoutonsSon() { document.querySelectorAll('.btnSon').forEach((b) => b.classList.toggle('coupe', !sonActif)); }
  function basculerSon() { Son.init(); sonActif = !sonActif; majBoutonsSon(); sauverReglages(); Son.clic(); }

  // ---------------------------------------------------------------------
  //  Commandes : boutons, gestes, clavier
  // ---------------------------------------------------------------------
  function toucheMaintenue(id, nom, surAppui) {
    const b = $(id);
    const appui = (e) => { e.preventDefault(); Son.init(); if (nom) touches[nom] = true; b.classList.add('appuye'); if (surAppui) surAppui(); try { b.setPointerCapture(e.pointerId); } catch (er) { /* rien */ } };
    const fin = (e) => { if (nom) touches[nom] = false; b.classList.remove('appuye'); };
    b.addEventListener('pointerdown', appui);
    b.addEventListener('pointerup', fin);
    b.addEventListener('pointercancel', fin);
    b.addEventListener('lostpointercapture', fin);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  toucheMaintenue('btnGauche', 'gauche');
  toucheMaintenue('btnDroite', 'droite');
  toucheMaintenue('btnSaut', 'saut', () => { demandeSaut = true; });
  toucheMaintenue('btnPlonger', null, () => { demandePlonge = true; });

  // Glisser vers le bas sur l'écran = plonger
  let geste = null;
  toile.addEventListener('pointerdown', (e) => { Son.init(); geste = { y: e.clientY, x: e.clientX, t: performance.now(), fait: false }; });
  toile.addEventListener('pointermove', (e) => {
    if (!geste || geste.fait) return;
    if (e.clientY - geste.y > 38 && Math.abs(e.clientX - geste.x) < 60 && performance.now() - geste.t < 500) { geste.fait = true; if (mode === 'jeu') demandePlonge = true; }
  });
  window.addEventListener('pointerup', () => { geste = null; });

  const CODES = {
    ArrowLeft: 'gauche', KeyA: 'gauche', ArrowRight: 'droite', KeyD: 'droite',
    Space: 'saut', ArrowUp: 'saut', KeyW: 'saut',
  };
  window.addEventListener('keydown', (e) => {
    Son.init();
    if (mode === 'jeu' && jeu) {
      if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); if (jeu.tuto) tutoSuivant(); else mettrePause(!jeu.pause); return; }
      if (jeu.tuto) { if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); tutoSuivant(); } return; }
      if (jeu.pause) { if (e.code === 'Enter' && document.activeElement === document.body) { e.preventDefault(); mettrePause(false); } return; }
      const nom = CODES[e.code];
      if (nom) { e.preventDefault(); if (nom === 'saut' && !e.repeat) demandeSaut = true; touches[nom] = true; }
      if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); if (!e.repeat) demandePlonge = true; }
      return;
    }
    if (mode === 'titre' && (e.code === 'Enter' || e.code === 'Space') && document.activeElement === document.body) { e.preventDefault(); $('btnJouer').click(); }
    if ((mode === 'niveaux' || mode === 'garde') && e.code === 'Escape') allerTitre();
    // Entrée sur un écran de fin (sans bouton choisi) : niveau suivant ou réessayer
    if (e.code === 'Enter' && document.activeElement === document.body) {
      if (mode === 'victoire') { e.preventDefault(); ($('btnSuivant').classList.contains('cache') ? $('btnRejouerV') : $('btnSuivant')).click(); }
      else if (mode === 'defaite') { e.preventDefault(); $('btnReessayer').click(); }
    }
  });
  window.addEventListener('keyup', (e) => { const nom = CODES[e.code]; if (nom) touches[nom] = false; });
  window.addEventListener('blur', relacher);
  document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'jeu' && jeu && !jeu.pause && !jeu.tuto) mettrePause(true); });

  // Boutons des écrans
  $('btnJouer').addEventListener('click', () => {
    Son.init(); Son.clic();
    const nouvelle = () => lancerNiveau(0);
    if (!SAVE) { nouvelle(); return; }
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { chargerProg(); lancerNiveau(Math.min(NIVEAUX.length, d.niveau || 1) - 1); },
      onNouvelle: nouvelle,
      onEffacer: () => { chargerProg(); majBoutonsSon(); nouvelle(); },
    });
  });
  $('btnNiveaux').addEventListener('click', ouvrirNiveaux);
  $('btnGarde').addEventListener('click', ouvrirGarde);
  document.querySelectorAll('.btnRetour').forEach((b) => b.addEventListener('click', () => { Son.clic(); allerTitre(); }));
  document.querySelectorAll('.btnSon').forEach((b) => b.addEventListener('click', basculerSon));
  $('btnPause').addEventListener('click', () => { Son.init(); Son.clic(); mettrePause(true); });
  $('btnReprendre').addEventListener('click', () => { Son.clic(); mettrePause(false); });
  $('btnRecommencer').addEventListener('click', () => lancerNiveau(jeu ? jeu.n : 0));
  $('btnPauseAccueil').addEventListener('click', () => { Son.clic(); if (jeu) sauverProg(jeu.n + 1, jeu.baiesPrises * 10); allerTitre(); });
  $('btnTutoOk').addEventListener('click', tutoSuivant);
  $('ecranTuto').addEventListener('click', (e) => { if (e.target === $('ecranTuto')) tutoSuivant(); });
  tutoToile.addEventListener('click', tutoSuivant);
  $('btnSuivant').addEventListener('click', () => lancerNiveau(jeu.n + 1));
  $('btnRejouerV').addEventListener('click', () => lancerNiveau(jeu.n));
  $('btnNiveauxV').addEventListener('click', ouvrirNiveaux);
  $('btnReessayer').addEventListener('click', () => lancerNiveau(jeu.n));
  $('btnNiveauxD').addEventListener('click', ouvrirNiveaux);
  $('btnAccueilD').addEventListener('click', () => { Son.clic(); allerTitre(); });

  // Sauvegarde à la fermeture de la page (seulement pendant une partie)
  if (SAVE) window.JEL_SAVE.surFermeture(() => {
    if (jeu && mode === 'jeu') sauverProg(jeu.n + 1, jeu.baiesPrises * 10);
  });

  // ---------------------------------------------------------------------
  //  Démarrage
  // ---------------------------------------------------------------------
  try { document.title = tr('titre'); } catch (e) { /* rien */ }
  chargerProg();
  majBoutonsSon();
  let boutonEffacer = null;
  if (SAVE) boutonEffacer = SAVE.boutonEffacer({ jeu: JEU, conteneur: $('effacerTitre'), apres: () => { chargerProg(); majBoutonsSon(); } });
  allerTitre();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
