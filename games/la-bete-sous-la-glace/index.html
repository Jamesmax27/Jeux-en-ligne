  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>

    background: rgba(9,16,28,.7); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .rond svg { width: 24px; height: 24px; }
  .outils { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 14px; min-height: 48px; }

  /* Barre du haut pendant la traversée */
  #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 8px;

  @media (max-width: 480px) {
    .pastille { font-size: 15px; padding: 6px 8px; }

  }

    font-weight: 900; color: #fff; text-shadow: 0 0 16px rgba(140,200,255,.8), 0 2px 0 #000; pointer-events: none; text-align: center;
    opacity: 0; transition: opacity .3s; width: 90%; }

<body>
<canvas id="lac"></canvas>

/* ==========================================================================
   La Bête sous la Glace — jeu complet (Free Micro Games)
   Course d'esquive en vue de dessus : traverser un lac gelé de nuit, ramasser

   frappe sous la glace là où le patineur était un instant plus tôt.

   Repère du monde : x de 0 (rive ouest) à LW (rive est) ; y vers le bas comme
   l'écran. Le lac va de y = 0 (rive sud, départ) à y = -L (rive nord, arrivée).
   ========================================================================== */
(() => {
  'use strict';
  const JEU = 'la-bete-sous-la-glace';

  const TAU = Math.PI * 2;

  // Hasard à graine : chaque nuit a toujours le même lac
  function graine(s) {
    let a = s >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t2 = a; t2 = Math.imul(t2 ^ (t2 >>> 15), t2 | 1); t2 ^= t2 + Math.imul(t2 ^ (t2 >>> 7), t2 | 61); return ((t2 ^ (t2 >>> 14)) >>> 0) / 4294967296; };
  }
  const R = Math.random; // hasard d'effets (particules, sons) seulement

  // -------------------------------------------------------------------------
  // Données : lacs, nuits, équipement
  // -------------------------------------------------------------------------
  const LACS = [
    { id: 'etang', glace: '#2c4a6b', glace2: '#3b6189', bord: '#c4d0de', nuitBord: '#8796ab', arbre: '#14212e', brume: '58,72,92', eau: '#04080e', reflet: '160,200,240' },

    { lac: 3, L: 3800, lant: 7, cible: 47, ry: 2.0, pre: 0.75, vie: 2.7, brume: 235, trous: 6, plaques: 5, trainx: 4, mains: 4, devant: 0.3, bete2: 1, nouv: 'bete2' },
    { lac: 3, L: 4000, lant: 8, cible: 49, ry: 1.9, pre: 0.74, vie: 2.7, trous: 5, mains: 4, vent: 2, devant: 0.35, bete2: 1, balai: 6, rochers: 3, nouv: 'balai' },
    { lac: 3, L: 4300, lant: 8, cible: 53, ry: 1.8, pre: 0.72, vie: 2.8, brume: 210, trous: 7, plaques: 6, mains: 6, trainx: 3, roseaux: 3, devant: 0.4, bete2: 1, balai: 7, mtrace: 1, chenal: 1, nouv: 'melange' },
    { lac: 3, L: 4800, lant: 9, cible: 59, ry: 1.6, pre: 0.7, vie: 3.0, brume: 225, trous: 8, plaques: 7, mains: 7, trainx: 4, rochers: 4, vent: 2, devant: 0.45, bete2: 1, balai: 6, mtrace: 1, chenal: 1, nouv: 'finale' },
  ].map((n) => Object.assign({}, DEF, n));
  window.JEL_NIVEAUX = NIVEAUX.length;
  const MAX_ETOILES = NIVEAUX.length * 3;

  // Équipement (débloqué par le total d'étoiles)
  const PATINS = [
    { id: 'bois', seuil: 0, vmax: 1, acc: 1, turn: 1, elan: 1, vie: 1, lame: '#c9a36b' },
    { id: 'acier', seuil: 8, vmax: 1.08, acc: 1, turn: 1, elan: 1, vie: 1, lame: '#dce6f0' },
    { id: 'course', seuil: 20, vmax: 1.08, acc: 1.2, turn: 1.15, elan: 1, vie: 1, lame: '#ffd27a' },
    { id: 'loup', seuil: 34, vmax: 1.1, acc: 1.2, turn: 1.15, elan: 0.65, vie: 1, lame: '#9ab0c8' },
    { id: 'givre', seuil: 46, vmax: 1.12, acc: 1.25, turn: 1.2, elan: 0.65, vie: 0.75, lame: '#9ff0ff' },

  const LAMPES = [
    { id: 'bougie', seuil: 0, brume: 1, aimant: 0, pre: 0, feu: '#ffb347' },
    { id: 'tempete', seuil: 6, brume: 1.25, aimant: 0, pre: 0, feu: '#ffc266' },
    { id: 'huile', seuil: 16, brume: 1.25, aimant: 60, pre: 0, feu: '#ffa63d' },

    { id: 'phare', seuil: 42, brume: 1.6, aimant: 85, pre: 0.15, feu: '#fff1b0' },
  ];
  const VMAX = 215, ACC = 310, TURN = 3.6, ELAN_CD = 3.5, ELAN_V = 190;

  // -------------------------------------------------------------------------
  // Progression (sauvegarde save.js + préférences)
  // -------------------------------------------------------------------------
  function progressionVide() {
    return { ouvert: 1, etoiles: NIVEAUX.map(() => 0), scores: NIVEAUX.map(() => 0), temps: NIVEAUX.map(() => 0), patin: 0, lampe: 0, son: true };
  }
  let P = progressionVide();
  const okTab = (a) => Array.isArray(a) && a.length === NIVEAUX.length;
  function chargerProgression() {
    P = progressionVide();
    let d = null;
    try { d = window.JEL_SAVE ? window.JEL_SAVE.load(JEU) : null; } catch (e) { d = null; }
    if (d) {
      if (okTab(d.etoiles)) P.etoiles = d.etoiles.map((x) => clamp(Math.floor(Number(x) || 0), 0, 3));
      if (okTab(d.scores)) P.scores = d.scores.map((x) => Math.max(0, Math.floor(Number(x) || 0)));
      if (okTab(d.temps)) P.temps = d.temps.map((x) => Math.max(0, Number(x) || 0));
      P.ouvert = clamp(Math.floor(Math.max(Number(d.ouvert) || 1, Number(d.niveau) || 1)), 1, NIVEAUX.length);
      P.patin = clamp(Math.floor(Number(d.patin) || 0), 0, PATINS.length - 1);
      P.lampe = clamp(Math.floor(Number(d.lampe) || 0), 0, LAMPES.length - 1);
      if (d.options && typeof d.options.son === 'boolean') P.son = d.options.son;
    }
    try { const s = localStorage.getItem('bete-glace-son'); if (s === '0') P.son = false; if (s === '1') P.son = true; } catch (e) { /* stockage refusé */ }
    if (totalEtoiles() < PATINS[P.patin].seuil) P.patin = 0;
    if (totalEtoiles() < LAMPES[P.lampe].seuil) P.lampe = 0;
  }
  const totalEtoiles = () => P.etoiles.reduce((a, b) => a + b, 0);
  const totalScore = () => P.scores.reduce((a, b) => a + b, 0);
  function sauverProgression(niveau) {
    if (apercu) return;
    try {
      window.JEL_SAVE.save(JEU, { niveau: clamp(niveau, 1, NIVEAUX.length), score: totalScore(), options: { son: P.son },
        etoiles: P.etoiles.slice(), scores: P.scores.slice(), temps: P.temps.slice(), ouvert: P.ouvert, patin: P.patin, lampe: P.lampe });
    } catch (e) { /* rien */ }
  }
  // Réglages (son, équipement) : jamais une nouvelle sauvegarde depuis les menus
  function sauverReglages() {

    try { localStorage.setItem('bete-glace-son', P.son ? '1' : '0'); } catch (e) { /* rien */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: P.son }, patin: P.patin, lampe: P.lampe }); } catch (e) { /* rien */ }

      AC = new (window.AudioContext || window.webkitAudioContext)();
      maitre = AC.createGain(); maitre.gain.value = P.son ? 0.8 : 0; maitre.connect(AC.destination);
      bruitBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = bruitBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      // souffle continu de la glisse
      const src = AC.createBufferSource(); src.buffer = bruitBuf; src.loop = true;
      const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 0.8;
      const g = AC.createGain(); g.gain.value = 0;
      src.connect(f); f.connect(g); g.connect(maitre); src.start();
      glisse = { g, f };

  }
  function majVolume() { if (maitre && AC) maitre.gain.setTargetAtTime(P.son ? 0.8 : 0, AC.currentTime, 0.05); }
  function ton(freq, dur, type, vol, glissT, delai) {

    const o = AC.createOscillator(), g = AC.createGain();

    o.connect(g); g.connect(maitre); o.start(t0); o.stop(t0 + dur + 0.05);
  }

  // -------------------------------------------------------------------------
  // Écran, canvas

  const cv = $('lac');

  function redimensionner() {

    brumeCv.width = Math.ceil(W / 2); brumeCv.height = Math.ceil(H / 2);

  }
  const largeurVue = () => W / S;

  // Motif de glace (un par lac), dessiné une fois

  function motifGlace(lac) {

    const x = c.getContext('2d');

    for (let i = 0; i < 40; i++) { // taches plus claires et plus sombres
      const gx = rr() * 256, gy = rr() * 256, r0 = 20 + rr() * 60, clair = rr() < 0.5;
      partout(() => {
        const gr = x.createRadialGradient(gx, gy, 0, gx, gy, r0);

  // -------------------------------------------------------------------------
  // Génération d'une nuit
  // -------------------------------------------------------------------------
  function genererMonde(i, LW) {
    const d = NIVEAUX[i], r = graine(1013 + i * 977), L = d.L, k = LW / 560;
    const m = { i, d, lac: LACS[d.lac], LW, L, rochers: [], trous: [], plaques: [], roseaux: [], mains: [], traineaux: [], vents: [], chenaux: [], lanternes: [], decor: [] };
    const occ = [];
    const n = (v) => Math.round(v * k);
    const yHasard = () => -(260 + r() * (L - 440));
    const dansChenal = (y, marge) => m.chenaux.some((c) => y > c.y0 - marge && y < c.y1 + marge);
    const libre = (x, y, rad, sansPlaques) => {
      if (y > -220 || y < -L + 140 || dansChenal(y, rad + 30)) return false;
      for (const o of occ) { if (sansPlaques && o.plaque) continue; if (dist(x, y, o.x, o.y) < rad + o.r + 16) return false; }
      return true;
    };

    for (let c = 0; c < d.chenal; c++) {
      const yc = -L * (c + 1) / (d.chenal + 1) - 40;
      const ch = { y0: yc - 90, y1: yc + 90, blocs: [] };
      for (let voie = 0; voie < 2; voie++) {
        const v = (voie ? -1 : 1) * (48 + r() * 22) * (c % 2 ? -1 : 1);
        let x = -200 + r() * 80;
        while (x < LW + 220) {
          const w = 130 + r() * 70;

          ch.blocs.push({ x, y: ch.y0 + voie * 90, w, h: 90, v, voie, pts: polyBloc(r, w, 90) });
          x += w + 70 + r() * 90;
        }

      m.chenaux.push(ch);
    }
    // bandes de vent
    for (let v = 0; v < d.vent; v++) {

      m.vents.push({ y0: y0 - 160 - r() * 80, y1: y0, f: (r() < 0.5 ? -1 : 1) * (110 + r() * 60) });
    }
    const placer = (nbre, rad, fabrique, sansPlaques) => {
      for (let j = 0; j < nbre; j++) {

    };

    placer(n(d.plaques), () => 55 + r() * 30, (x, y, rr) => { const o = { x: x - rr, y: y - rr * 0.8, w: rr * 2, h: rr * 1.6, stress: 0, etat: 'ok', t: 0, plaque: true, fentes: fentesPlaque(r, rr) }; m.plaques.push(o); return o; });
    placer(n(d.trous), () => 30 + r() * 26, (x, y, rr) => { const o = { x, y, r: rr, bord: polyTrou(r, rr) }; m.trous.push(o); return o; });
    placer(n(d.rochers), () => 16 + r() * 14, (x, y, rr) => { const o = { x, y, r: rr, forme: polyTrou(r, rr), neige: r() }; m.rochers.push(o); return o; });

    for (let j = 0; j < d.lant; j++) {

      }
    }

    const rd = graine(77 + i * 31);

      for (const cote of [-1, 1, -1, 1, -1, 1]) {

      }
    }
    // rives sud et nord : quelques arbres sur toute la largeur
    for (let x = -700; x < LW + 700; x += 50 + rd() * 50) {
      m.decor.push({ x, y: 120 + rd() * 260, s: 0.7 + rd() * 0.7, ph: rd() * TAU, sorte: rd() });
      m.decor.push({ x, y: -L - 140 - rd() * 300, s: 0.7 + rd() * 0.7, ph: rd() * TAU, sorte: rd() });

  function polyTrou(r, rad) { const pts = []; const n = 13; for (let i = 0; i < n; i++) { const a = i / n * TAU; const rr = rad * (0.82 + r() * 0.3); pts.push([Math.cos(a) * rr, Math.sin(a) * rr]); } return pts; }

  // -------------------------------------------------------------------------
  // État d'une traversée
  // -------------------------------------------------------------------------
  let jeu = null, ecran = 'charge', apercu = 0, figer = false, affiche = false;
  const cam = { x: 0, y: 0 };
  function nouvelleNuit(i, auto) {
    const m = genererMonde(i, largeurLac());
    jeu = {
      i, m, d: m.d, auto: !!auto, invincible: !!auto,
      p: { x: m.LW / 2, y: 50, vx: 0, vy: 0, a: -Math.PI / 2, elanT: 0, elanCd: 0, pas: 0, surBloc: null },
      temps: 0, tGlace: 0, surGlace: false, prises: 0, trace: [], hist: [], frappes: [], fentes: [], evts: [], particules: [],
      bete: { x: m.LW / 2, y: 300, a: -Math.PI / 2, t: 2.6, queue: [] },
      bete2: m.d.bete2 ? { x: m.LW / 2, y: 340, a: -Math.PI / 2, t: 3.6, queue: [] } : null,
      balaiT: m.d.balai ? m.d.balai * 0.7 : 0, mtraceT: 2.2,
      etat: 'jeu', chuteT: 0, cause: '', secousse: 0, flash: 0, finT: 0, autoCible: 0,

  }

  // -------------------------------------------------------------------------
  // Commandes : doigt / souris (glisse vers le pointeur), clavier, élan
  // -------------------------------------------------------------------------
  const ent = { appui: false, id: null, sx: 0, sy: 0, cles: new Set() };
  const versEcran = (x, y) => [W / 2 + (x - cam.x) * S, H / 2 + (y - cam.y) * S];
  cv.addEventListener('pointerdown', (ev) => {
    audio();
    if (ecran !== 'jeu') return;
    ev.preventDefault();
    ent.appui = true; ent.id = ev.pointerId; ent.sx = ev.clientX; ent.sy = ev.clientY;
    try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* rien */ }
  });
  cv.addEventListener('pointermove', (ev) => { if (ent.appui && ev.pointerId === ent.id) { ent.sx = ev.clientX; ent.sy = ev.clientY; } });
  const lacher = (ev) => { if (ev.pointerId === ent.id) { ent.appui = false; ent.id = null; } };
  cv.addEventListener('pointerup', lacher);
  cv.addEventListener('pointercancel', lacher);
  $('b-elan').addEventListener('pointerdown', (ev) => { ev.preventDefault(); ev.stopPropagation(); audio(); elan(); });
  function elan() {
    if (ecran !== 'jeu' || !jeu || jeu.etat !== 'jeu' || jeu.p.elanCd > 0) return;
    const p = jeu.p; const e = equip();
    p.vx += Math.cos(p.a) * ELAN_V; p.vy += Math.sin(p.a) * ELAN_V; p.elanT = 0.45; p.elanCd = e.elanCd;
    for (let k = 0; k < 10; k++) particule(p.x, p.y, 'givre');
    SONS.elan();
  }
  // Direction voulue et poussée, pour le joueur ou pour le pilote automatique
  function commande() {
    const p = jeu.p;
    if (jeu.auto) {
      // pilote du titre et des images : vers la lanterne suivante, en ondulant
      const lant = jeu.m.lanternes.find((l) => !l.prise && l.y < p.y - 30);
      const cx = lant ? lant.x : jeu.m.LW / 2 + Math.sin(jeu.temps * 0.7) * jeu.m.LW * 0.3, cy = lant ? lant.y : p.y - 300;
      return { pousse: true, dir: Math.atan2(cy - p.y, cx - p.x) + Math.sin(jeu.temps * 1.7) * 0.25 };
    }
    let kx = 0, ky = 0; const c = ent.cles;
    if (c.has('ArrowLeft') || c.has('KeyA')) kx -= 1;
    if (c.has('ArrowRight') || c.has('KeyD')) kx += 1;
    if (c.has('ArrowUp') || c.has('KeyW')) ky -= 1;
    if (c.has('ArrowDown') || c.has('KeyS')) ky += 1;
    if (kx || ky) return { pousse: true, dir: Math.atan2(ky, kx) };

      const dx = ent.sx - sx, dy = ent.sy - sy;

  // -------------------------------------------------------------------------
  // Mise à jour d'une traversée
  // -------------------------------------------------------------------------
  function histA(tps) {
    const h = jeu.hist; if (!h.length) return [jeu.p.x, jeu.p.y];
    for (let k = h.length - 1; k >= 0; k--) if (h[k].t <= tps) return [h[k].x, h[k].y];
    return [h[0].x, h[0].y];
  }
  const dansRect = (x, y, o, marge) => x > o.x - (marge || 0) && x < o.x + o.w + (marge || 0) && y > o.y - (marge || 0) && y < o.y + o.h + (marge || 0);
  function segCoupe(ax, ay, bx, by, cx, cy, dx, dy) {
    const d1x = bx - ax, d1y = by - ay, d2x = dx - cx, d2y = dy - cy;
    const den = d1x * d2y - d1y * d2x; if (Math.abs(den) < 1e-9) return false;
    const u = ((cx - ax) * d2y - (cy - ay) * d2x) / den, v = ((cx - ax) * d1y - (cy - ay) * d1x) / den;

  function maj(dt) {

    J.secousse = Math.max(0, J.secousse - dt * 2.5); J.flash = Math.max(0, J.flash - dt * 2);

    // blocs dérivants

    if (J.etat === 'rive') { J.finT += dt; p.vx *= Math.exp(-2 * dt); p.vy *= Math.exp(-2 * dt); p.x += p.vx * dt; p.y += p.vy * dt; suivreCamera(dt); if (J.finT > 0.9 && !J.auto) finirVictoire(); return; }

    // --- patineur ---

    const ch = chenalEn(p.y);

    if (roseau) { vmax *= 0.5; acc *= 0.6; }

    const sur = p.y < 0 && p.y > -m.L;

        J.trace.push({ x: p.x, y: p.y, t: J.temps, j: (R() - 0.5) * 7, br: R() < 0.25 ? (R() - 0.5) * 2.6 : 0, coupe: false });

      }

    }

    while (J.trace.length && J.trace[0].t < J.temps - Math.max(vie, 10)) J.trace.shift();
    // sons de glisse
    if (glisse && AC && !J.auto) { const v = Math.hypot(p.vx, p.vy); glisse.g.gain.setTargetAtTime(P.son && sur ? Math.min(0.09, v / 2600) : 0, AC.currentTime, 0.08); glisse.f.frequency.setTargetAtTime(1800 + v * 6, AC.currentTime, 0.1); }

    // --- dangers (le patineur tombe) ---
    if (!J.invincible) {
      if (ch) { if (!surBloc) return chute('chenal'); }
      else if (sur) {
        for (const o of m.trous) if (dist(p.x, p.y, o.x, o.y) < o.r - 6) return chute('trou');
        for (const f of J.frappes) if (f.etat === 'ouvert' && dist(p.x, p.y, f.x, f.y) < f.R * 0.82 * f.ouv) return chute(f.petite ? 'bete2' : 'trou');
        for (const o of m.plaques) if (o.etat === 'casse' && dansRect(p.x, p.y, o, -6)) return chute('plaque');
        for (const f of J.fentes) if (f.etat === 'ouvert' && p.x > f.x0 && p.x < f.x1 && Math.abs(p.y - f.y) < f.h / 2) return chute('fente');
        // recouper une fissure vive

          if (ageN < 0.55 || ageV > vie) continue;

    }

    if (d.mtrace) majMainsSillage(dt);
    if (d.balai) majBalai(dt);

  function suivreCamera(dt) {
    const p = jeu.p, m = jeu.m, vw = W / S, vh = H / S;
    let cx = p.x + p.vx * 0.25;
    const minX = Math.min(m.LW / 2, vw / 2 - 40), maxX = Math.max(m.LW / 2, m.LW - vw / 2 + 40);
    cx = clamp(cx, minX, maxX);
    const cy = p.y - vh * 0.14 + p.vy * 0.22;
    const k = 1 - Math.exp(-4 * dt);
    cam.x = lerp(cam.x, cx, k); cam.y = lerp(cam.y, cy, k);
  }

  function majTraineau(s, dt) {
    const m = jeu.m;
    if (s.coule) { s.coule += dt; return; }
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.vx *= Math.exp(-0.7 * dt); s.vy *= Math.exp(-0.7 * dt);
    const v = Math.hypot(s.vx, s.vy); if (v > 4) s.a = lerp(s.a, s.a + angDiff(Math.atan2(s.vy, s.vx), s.a), 0.1);
    if (s.x < 20) { s.x = 20; s.vx = Math.abs(s.vx) * 0.5; } if (s.x > m.LW - 20) { s.x = m.LW - 20; s.vx = -Math.abs(s.vx) * 0.5; }
    if (s.y > -10) { s.y = -10; s.vy = -Math.abs(s.vy) * 0.5; } if (s.y < -m.L + 10) { s.y = -m.L + 10; s.vy = Math.abs(s.vy) * 0.5; }
    for (const o of m.rochers) { const dd = dist(s.x, s.y, o.x, o.y); if (dd < o.r + s.r && dd > 0) { const nx = (s.x - o.x) / dd, ny = (s.y - o.y) / dd; s.x = o.x + nx * (o.r + s.r); s.y = o.y + ny * (o.r + s.r); const vn = s.vx * nx + s.vy * ny; if (vn < 0) { s.vx -= 2 * vn * nx; s.vy -= 2 * vn * ny; s.vx *= 0.6; s.vy *= 0.6; } } }
    const couler = () => { s.coule = 0.001; for (let k = 0; k < 14; k++) particule(s.x, s.y, 'eau'); if (!jeu.auto && enVue(s.x, s.y)) SONS.plouf(); };
    if (m.trous.some((o) => dist(s.x, s.y, o.x, o.y) < o.r - 4)) return couler();
    if (m.plaques.some((o) => o.etat === 'casse' && dansRect(s.x, s.y, o, -4))) return couler();
    const ch = chenalEn(s.y); if (ch && !blocSous(ch, s.x, s.y)) return couler();
    if (jeu.frappes.some((f) => f.etat === 'ouvert' && dist(s.x, s.y, f.x, f.y) < f.R * 0.8)) return couler();
  }
  const enVue = (x, y) => { const [sx, sy] = versEcran(x, y); return sx > -60 && sx < W + 60 && sy > -60 && sy < H + 60; };

  function majPlaques(dt) {
    const p = jeu.p;
    for (const o of jeu.m.plaques) {
      if (o.etat === 'ok') {
        if (jeu.etat === 'jeu' && dansRect(p.x, p.y, o)) { const av = o.stress; o.stress += dt; if (!jeu.auto && Math.floor(av * 5) !== Math.floor(o.stress * 5)) SONS.plaque(); }
        else o.stress = Math.max(0, o.stress - dt * 0.5);
        if (o.stress >= 0.7) casserPlaque(o);
      } else { o.t -= dt; if (o.t <= 0) { o.etat = 'ok'; o.stress = 0; } }
    }
  }
  function casserPlaque(o) {
    o.etat = 'casse'; o.t = 6; o.stress = 0.7;
    for (let k = 0; k < 16; k++) particule(o.x + R() * o.w, o.y + R() * o.h, 'givre');
    if (!jeu.auto && enVue(o.x + o.w / 2, o.y + o.h / 2)) { SONS.plaque(); SONS.plouf(); }
  }

  // La bête : son ombre suit le patineur ; elle frappe à intervalles réguliers
  function majBete(b, dt, petite, e) {
    const J = jeu, d = J.d, p = J.p;
    const [hx, hy] = histA(J.temps - (petite ? 0.7 : 1.1));
    const viseeF = J.frappes.find((f) => f.etat === 'annonce' && f.petite === petite);
    const tx = viseeF ? viseeF.x : hx, ty = viseeF ? viseeF.y + (petite ? 40 : 90) : hy + (petite ? 60 : 130);
    const k = 1 - Math.exp(-(viseeF ? 6 : 1.6) * dt);
    const nx = lerp(b.x, tx, k), ny = lerp(b.y, ty, k);
    if (Math.hypot(nx - b.x, ny - b.y) > 0.3) b.a = b.a + angDiff(Math.atan2(ny - b.y, nx - b.x), b.a) * Math.min(1, dt * 3);
    b.x = nx; b.y = ny;
    b.queue.unshift([b.x, b.y]); if (b.queue.length > 40) b.queue.pop();
    if (!(p.y < -60 && p.y > -J.m.L + 50) || J.etat !== 'jeu') return;
    b.t -= dt;
    if (b.t > 0) return;
    const ry = petite ? d.ry * 0.8 : d.ry;
    b.t = ry * (0.85 + R() * 0.3);
    const pre = (petite ? 0.62 : d.pre) + e.pre;
    let x, y, cibleT = null;
    const leurre = !petite && J.m.traineaux.find((s) => !s.coule && Math.hypot(s.vx, s.vy) > 50 && dist(s.x, s.y, p.x, p.y) < 520);
    if (leurre) { x = leurre.x + leurre.vx * pre * 0.7; y = leurre.y + leurre.vy * pre * 0.7; cibleT = leurre; }
    else if (!petite && R() < d.devant) { x = p.x + p.vx * (pre + 0.12); y = p.y + p.vy * (pre + 0.12); }
    else { [x, y] = histA(J.temps - (petite ? 0.25 : d.del)); }
    x = clamp(x, 24, J.m.LW - 24); y = clamp(y, -J.m.L + 40, -40);
    if (chenalEn(y) || J.m.chenaux.some((c) => y > c.y0 - 30 && y < c.y1 + 30)) return; // pas de glace à briser là
    J.frappes.push({ x, y, R: petite ? 30 : 48, t: pre, total: pre, etat: 'annonce', petite, ouv: 1, cibleT, bord: polyTrou(R, 1), rayons: Array.from({ length: 9 }, () => [R() * TAU, 0.8 + R() * 1.2]) });
    if (!J.auto && enVue(x, y)) SONS.gronde(pre);
  }
  function majFrappes(dt) {
    const J = jeu, p = J.p;
    for (const f of J.frappes) {
      f.t -= dt;
      if (f.etat === 'annonce' && f.t <= 0) {
        f.etat = 'ouvert'; f.t = 3.5; f.total = 3.5;
        for (let k = 0; k < 22; k++) particule(f.x, f.y, k % 2 ? 'givre' : 'eau');
        if (!J.auto) { if (enVue(f.x, f.y)) { SONS.impact(); J.secousse = Math.max(J.secousse, f.petite ? 0.5 : 0.9); } }
        for (const o of J.m.plaques) if (o.etat === 'ok' && dist(f.x, f.y, o.x + o.w / 2, o.y + o.h / 2) < f.R + Math.max(o.w, o.h) / 2) casserPlaque(o);
        if (!J.invincible && J.etat === 'jeu' && dist(p.x, p.y, f.x, f.y) < f.R) { chute(f.petite ? 'bete2' : 'bete'); }
      } else if (f.etat === 'ouvert') {
        f.ouv = f.t < 1 ? Math.max(0, f.t) : 1;
        if (f.t <= 0) f.etat = 'fini';
      }
    }
    J.frappes = J.frappes.filter((f) => f.etat !== 'fini');
  }
  function majMains(dt) {
    const J = jeu, p = J.p;
    for (const h of J.m.mains) {
      const dd = dist(p.x, p.y, h.x, h.y);
      if (h.etat === 'dort') {
        if (dd < 125 && J.etat === 'jeu' && p.y < 0) {
          h.etat = 'bulles'; h.t = 0.6;
          // la main vise l'endroit où le patineur passera (90 pas au plus de sa fissure)
          const px2 = p.x + p.vx * 0.5, py2 = p.y + p.vy * 0.5;
          const d2 = Math.max(1, dist(px2, py2, h.x, h.y)), k2 = Math.min(d2, 90) / d2;
          h.hx = h.x + (px2 - h.x) * k2; h.hy = h.y + (py2 - h.y) * k2;
          if (!J.auto) SONS.bulles();
        }
      } else if (h.etat === 'bulles') { h.t -= dt; if (h.t <= 0) { h.etat = 'main'; h.t = 1.0; if (!J.auto) SONS.main(); for (let k = 0; k < 10; k++) particule(h.hx, h.hy, 'eau'); } }
      else if (h.etat === 'main') { h.t -= dt; if (!J.invincible && J.etat === 'jeu' && dist(p.x, p.y, h.hx, h.hy) < 27) chute('main'); if (h.t <= 0) { h.etat = 'repos'; h.t = 2.5; } }
      else if (h.etat === 'repos') { h.t -= dt; if (h.t <= 0) h.etat = 'dort'; }
    }
    for (const h of J.evts) {
      h.t -= dt;
      if (h.etat === 'bulles' && h.t <= 0) { h.etat = 'main'; h.t = 0.9; if (!J.auto && enVue(h.hx, h.hy)) SONS.main(); }
      else if (h.etat === 'main') { if (!J.invincible && J.etat === 'jeu' && dist(p.x, p.y, h.hx, h.hy) < 25) chute('main'); if (h.t <= 0) h.etat = 'fini'; }
    }
    J.evts = J.evts.filter((h) => h.etat !== 'fini');
  }
  // Mains qui sortent des fissures récentes, derrière le patineur
  function majMainsSillage(dt) {
    const J = jeu, p = J.p;
    if (!(p.y < -60) || J.etat !== 'jeu') return;
    J.mtraceT -= dt; if (J.mtraceT > 0) return;
    J.mtraceT = 1.7 + R() * 0.6;
    const pts = J.trace.filter((q) => !q.coupe && J.temps - q.t > 0.45 && J.temps - q.t < 0.8);
    if (!pts.length) return;
    const q = pts[Math.floor(R() * pts.length)];
    const dd = Math.max(1, dist(q.x, q.y, p.x, p.y)), k2 = Math.min(80, dd * 0.6) / dd;
    J.evts.push({ x: q.x, y: q.y, hx: q.x + (p.x - q.x) * k2, hy: q.y + (p.y - q.y) * k2, etat: 'bulles', t: 0.5, a: R() * TAU });
    if (!J.auto) SONS.bulles();
  }
  // La charge : une fente d'eau s'ouvre en travers, devant le patineur
  function majBalai(dt) {
    const J = jeu, p = J.p, m = J.m;
    for (const f of J.fentes) {
      f.t -= dt;
      if (f.etat === 'annonce' && f.t <= 0) {
        f.etat = 'ouvert'; f.t = 2.6;
        if (!J.auto) { SONS.impact(); J.secousse = Math.max(J.secousse, 0.7); }
        for (let k = 0; k < 24; k++) particule(lerp(f.x0, f.x1, R()), f.y, 'eau');
        for (const o of m.plaques) if (o.etat === 'ok' && f.y > o.y && f.y < o.y + o.h && o.x < f.x1 && o.x + o.w > f.x0) casserPlaque(o);
        if (!J.invincible && J.etat === 'jeu' && p.x > f.x0 && p.x < f.x1 && Math.abs(p.y - f.y) < f.h / 2 + 8) chute('fente');
      } else if (f.etat === 'ouvert' && f.t <= 0) f.etat = 'fini';
    }
    J.fentes = J.fentes.filter((f) => f.etat !== 'fini');
    if (!(p.y < -100) || J.etat !== 'jeu') return;
    J.balaiT -= dt; if (J.balaiT > 0) return;

    if (y < -m.L + 60 || m.chenaux.some((c) => y > c.y0 - 40 && y < c.y1 + 40)) return;
    const gauche = p.x > m.LW / 2 ? R() < 0.7 : R() < 0.3;
    const longueur = m.LW * 0.64;
    J.fentes.push({ x0: gauche ? 0 : m.LW - longueur, x1: gauche ? longueur : m.LW, y, h: 28, etat: 'annonce', t: 1.3, total: 1.3, gauche });
    if (!J.auto) SONS.gronde(1.3);
  }

  function chute(cause) {
    const J = jeu;
    if (J.etat !== 'jeu') return;
    J.etat = 'chute'; J.cause = cause; J.chuteT = 0; J.secousse = 1;
    for (let k = 0; k < 30; k++) particule(J.p.x, J.p.y, k % 3 ? 'eau' : 'givre');
    if (!J.auto) { SONS.plouf(); if (glisse && AC) glisse.g.gain.setTargetAtTime(0, AC.currentTime, 0.05); }
  }

  // -------------------------------------------------------------------------
  // Particules
  // -------------------------------------------------------------------------
  function particule(x, y, sorte) {
    const J = jeu; if (!J || J.particules.length > 400) return;
    const a = R() * TAU, v = sorte === 'etincelle' ? 60 + R() * 160 : 30 + R() * 120;
    J.particules.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, vie: 0.5 + R() * 0.7, sorte, r: 1.5 + R() * 3, rot: R() * TAU });
  }
  function majParticules(dt) {
    const J = jeu;
    for (const q of J.particules) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= Math.exp(-3 * dt); q.vy *= Math.exp(-3 * dt); q.rot += dt * 6; }
    J.particules = J.particules.filter((q) => q.t < q.vie);
  }

  // -------------------------------------------------------------------------
  // Dessin du lac
  // -------------------------------------------------------------------------
  let tAnim = 0;
  const flocons = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), z: 0.3 + Math.random() * 0.7 }));

  function dessiner() {
    const J = jeu;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!J) { g.fillStyle = '#0a1220'; g.fillRect(0, 0, W, H); return; }
    const m = J.m, lac = m.lac;
    // fond : neige de nuit des rives
    g.fillStyle = lac.nuitBord; g.fillRect(0, 0, W, H);
    const sx = J.secousse > 0 ? (R() - 0.5) * 14 * J.secousse : 0, sy = J.secousse > 0 ? (R() - 0.5) * 14 * J.secousse : 0;
    g.setTransform(DPR * S, 0, 0, DPR * S, DPR * (W / 2 - cam.x * S + sx), DPR * (H / 2 - cam.y * S + sy));
    const vw = W / S, vh = H / S, x0 = cam.x - vw / 2 - 60, x1 = cam.x + vw / 2 + 60, y0 = cam.y - vh / 2 - 80, y1 = cam.y + vh / 2 + 120;
    // neige des rives (dégradé doux, ombres)
    const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, lac.bord); gr.addColorStop(1, lac.nuitBord);
    g.fillStyle = gr; g.fillRect(x0, y0, x1 - x0, y1 - y0);
    // la glace
    g.save();
    g.fillStyle = motifGlace(lac);
    g.fillRect(0, -m.L, m.LW, m.L);
    // reflet de lune qui suit un peu la caméra
    const lx = m.LW * 0.62, ly = cam.y - vh * 0.25;
    const rl = g.createRadialGradient(lx, ly, 0, lx, ly, Math.max(vw, vh) * 0.6);
    rl.addColorStop(0, 'rgba(' + lac.reflet + ',0.28)'); rl.addColorStop(1, 'rgba(' + lac.reflet + ',0)');
    g.fillStyle = rl; g.fillRect(0, -m.L, m.LW, m.L);
    // bords de glace (congères)
    g.fillStyle = 'rgba(230,240,250,0.35)';
    g.fillRect(-6, -m.L, 10, m.L); g.fillRect(m.LW - 4, -m.L, 10, m.L);
    g.restore();
    // ombre de la bête sous la glace
    dessinerBete(J.bete, false);
    if (J.bete2) dessinerBete(J.bete2, true);
    // chenaux d'eau libre
    for (const ch of m.chenaux) {
      if (ch.y1 < y0 || ch.y0 > y1) continue;
      g.fillStyle = lac.eau; g.fillRect(0, ch.y0, m.LW, ch.y1 - ch.y0);
      g.strokeStyle = 'rgba(160,200,240,0.12)'; g.lineWidth = 1.5;
      for (let k = 0; k < 8; k++) { const yy = ch.y0 + 12 + k * 21; g.beginPath(); for (let xx = 0; xx <= m.LW; xx += 30) g.lineTo(xx, yy + Math.sin(xx * 0.04 + tAnim * 1.5 + k) * 3); g.stroke(); }
      g.save(); g.beginPath(); g.rect(0, ch.y0 - 4, m.LW, ch.y1 - ch.y0 + 8); g.clip(); // les blocs restent dans le lac

    }
    // roseaux
    for (const o of m.roseaux) { if (o.y > y1 || o.y + o.h < y0) continue; dessinerRoseaux(o); }
    // plaques minces
    for (const o of m.plaques) { if (o.y > y1 || o.y + o.h < y0) continue; dessinerPlaque(o, lac); }
    // trous fixes
    for (const o of m.trous) { if (o.y - o.r > y1 || o.y + o.r < y0) continue; dessinerTrou(o.x, o.y, o.bord, 1, lac); }
    // vieilles fissures des mains
    for (const h of m.mains) if (h.y > y0 && h.y < y1) dessinerCicatrice(h);
    // bandes de vent
    for (const v of m.vents) if (v.y1 > y0 && v.y0 < y1) dessinerVent(v, m);
    // traînée de fissures
    dessinerTrace(J);
    // frappes de la bête et charges
    for (const f of J.frappes) dessinerFrappe(f, lac);
    for (const f of J.fentes) dessinerFente(f, lac);
    // décor des rives (arbres), derrière les objets proches
    for (const a of m.decor) if (a.y > y0 - 60 && a.y < y1 + 40 && a.x > x0 - 60 && a.x < x1 + 60) dessinerArbre(a, lac);
    // rochers, traîneaux, lanternes, mains
    for (const o of m.rochers) if (o.y > y0 - 40 && o.y < y1 + 40) dessinerRocher(o);
    for (const s of m.traineaux) if (s.y > y0 - 40 && s.y < y1 + 40) dessinerTraineau(s);
    for (const l of m.lanternes) if (!l.prise && l.y > y0 - 40 && l.y < y1 + 40) dessinerLanterne(l.x, l.y, 1, l.ph);
    for (const h of m.mains) if (h.etat === 'bulles' || h.etat === 'main') dessinerMain(h);

    dessinerRives(m);

  function peindreAffiche() {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const k = Math.max(W / 600, H / 800);
    g.save(); g.translate((W - 600 * k) / 2, (H - 800 * k) / 2); g.scale(k, k);
    // ciel de nuit, lune et sapins au loin
    const ciel = g.createLinearGradient(0, 0, 0, 170); ciel.addColorStop(0, '#16233d'); ciel.addColorStop(1, '#4a6c96');
    g.fillStyle = ciel; g.fillRect(0, 0, 600, 175);
    g.save(); g.globalCompositeOperation = 'lighter'; halo(440, 72, 150, '#cfe4ff', 0.45); g.restore();
    g.fillStyle = '#f4f8ff'; g.beginPath(); g.arc(440, 72, 38, 0, TAU); g.fill();
    g.fillStyle = 'rgba(180,200,225,0.5)'; g.beginPath(); g.arc(428, 62, 7, 0, TAU); g.arc(452, 84, 5, 0, TAU); g.fill();
    for (let x = -20; x < 640; x += 26) { const h = 40 + ((x * 37) % 30); g.fillStyle = '#0f1a2a'; g.beginPath(); g.moveTo(x, 172); g.lineTo(x + 13, 172 - h); g.lineTo(x + 26, 172); g.fill(); }
    // la glace, en perspective
    const glace = g.createLinearGradient(0, 165, 0, 800); glace.addColorStop(0, '#6f97c2'); glace.addColorStop(0.45, '#3f6690'); glace.addColorStop(1, '#2a4668');
    g.fillStyle = glace; g.fillRect(0, 165, 600, 635);
    g.save(); g.globalCompositeOperation = 'lighter'; // traînée de lune sur la glace
    g.save(); g.translate(450, 300); g.scale(1, 2.2);
    const tl = g.createRadialGradient(0, 0, 0, 0, 0, 140); tl.addColorStop(0, 'rgba(210,230,255,0.32)'); tl.addColorStop(1, 'rgba(210,230,255,0)');
    g.fillStyle = tl; g.fillRect(-140, -140, 280, 280); g.restore();
    g.restore();
    // la bête sous la glace (grande ombre aux yeux pâles)
    g.save(); g.translate(370, 585); g.rotate(-0.15);
    const gb2 = g.createRadialGradient(0, 0, 0, 0, 0, 300); gb2.addColorStop(0, 'rgba(3,6,14,0.85)'); gb2.addColorStop(0.6, 'rgba(5,10,22,0.55)'); gb2.addColorStop(1, 'rgba(5,10,22,0)');
    g.fillStyle = gb2; g.beginPath(); g.ellipse(0, 0, 320, 150, 0, 0, TAU); g.fill();
    g.fillStyle = 'rgba(3,6,14,0.5)';
    for (const s of [-1, 1]) { g.beginPath(); g.moveTo(-40 * s, -40); g.quadraticCurveTo(-180 * s, -150, -280 * s, -60); g.lineTo(-120 * s, -10); g.fill(); }
    g.save(); g.globalCompositeOperation = 'lighter';
    for (const s of [-1, 1]) { halo(s * 55, 20, 46, '#9ff0ff', 0.6); }
    g.restore();
    g.fillStyle = '#e6fdff'; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(s * 55, 20, 17, 7, s * 0.25, 0, TAU); g.fill(); }
    g.fillStyle = '#0a1a24'; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(s * 55, 20, 3, 6, 0, 0, TAU); g.fill(); }
    g.restore();
    // la glace explose derrière le patineur : fissures rayonnantes et trou noir
    const ix = 210, iy = 640;
    g.strokeStyle = 'rgba(240,250,255,0.9)'; g.lineWidth = 2.5; g.lineCap = 'round';
    for (let r2 = 0; r2 < 16; r2++) { const a = r2 / 16 * TAU + 0.2; let x = ix, y = iy; g.beginPath(); g.moveTo(x, y); for (let s = 0; s < 5; s++) { x += Math.cos(a + Math.sin(s * 3 + r2) * 0.3) * 32; y += Math.sin(a + Math.sin(s * 3 + r2) * 0.3) * 22; g.lineTo(x, y); } g.stroke(); }
    g.fillStyle = 'rgba(235,245,255,0.85)'; g.beginPath(); g.ellipse(ix, iy, 78, 44, 0, 0, TAU); g.fill();
    g.fillStyle = '#04080e'; g.beginPath(); g.ellipse(ix, iy, 66, 36, 0, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(140,190,230,0.4)'; g.lineWidth = 2; g.beginPath(); g.ellipse(ix, iy, 40, 20, 0, 0, TAU); g.stroke();
    // éclats de glace et gerbe d'eau
    for (let s = 0; s < 22; s++) { const a = -Math.PI * (0.1 + (s / 22) * 0.8), d2 = 60 + (s * 37) % 90; const x = ix + Math.cos(a) * d2 * 1.3, y = iy + Math.sin(a) * d2; g.save(); g.translate(x, y); g.rotate(s); g.fillStyle = s % 3 ? 'rgba(235,248,255,0.95)' : 'rgba(140,190,230,0.9)'; g.beginPath(); g.moveTo(0, -7); g.lineTo(6, 6); g.lineTo(-6, 5); g.closePath(); g.fill(); g.restore(); }
    // traînée de fissures vives qui mène au patineur
    g.strokeStyle = 'rgba(110,200,255,0.35)'; g.lineWidth = 12;
    const trait = () => { g.beginPath(); g.moveTo(ix + 40, iy - 30); g.bezierCurveTo(300, 560, 270, 500, 330, 470); g.stroke(); };
    trait(); g.strokeStyle = 'rgba(220,245,255,0.95)'; g.lineWidth = 3.5; trait();
    // le patineur, en grand, qui fonce
    dessinerPatineurAffiche(360, 330);
    // premier plan : lanterne posée sur la glace et neige
    dessinerLanterne(90, 700, 3.2, 0);
    g.save(); g.globalCompositeOperation = 'lighter'; halo(90, 700, 140, '#ffb347', 0.5); g.restore();
    g.fillStyle = 'rgba(240,248,255,0.85)';
    for (let s = 0; s < 60; s++) { const x = (s * 97) % 600, y = (s * 53 + tAnim * 30) % 800; g.beginPath(); g.arc(x, y, 1 + (s % 3), 0, TAU); g.fill(); }
    // sapins coupés par les bords (profondeur)
    for (const [x, y, s] of [[-30, 300, 3.2], [630, 420, 3.6]]) { g.fillStyle = '#0d1624'; for (let kk = 0; kk < 3; kk++) { const r2 = (40 - kk * 10) * s / 1.6; g.beginPath(); g.moveTo(x, y - kk * 40 - r2 * 1.4); g.lineTo(x + r2, y - kk * 40 + r2 * 0.4); g.lineTo(x - r2, y - kk * 40 + r2 * 0.4); g.fill(); } }
    g.restore();
  }
  // Patineur de l'affiche, vu de trois quarts, penché en avant
  function dessinerPatineurAffiche(x, y) {
    g.save(); g.translate(x, y); g.scale(1.25, 1.25);
    const halo2 = (hx, hy, r, c, a) => { g.save(); g.globalCompositeOperation = 'lighter'; halo(hx, hy, r, c, a); g.restore(); };
    // ombre sur la glace
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(-10, 150, 90, 18, -0.1, 0, TAU); g.fill();
    g.lineCap = 'round'; g.lineJoin = 'round';
    const contour = (f) => { g.strokeStyle = 'rgba(200,230,255,0.9)'; g.lineWidth = 3; f(); };
    // jambe arrière tendue
    const jambeArr = () => { g.beginPath(); g.moveTo(-10, 40); g.lineTo(-60, 95); g.lineTo(-100, 120); g.stroke(); };
    g.strokeStyle = 'rgba(200,230,255,0.85)'; g.lineWidth = 27; jambeArr();
    g.strokeStyle = '#2c4366'; g.lineWidth = 22; jambeArr();
    g.strokeStyle = '#d6e2ee'; g.lineWidth = 5; g.beginPath(); g.moveTo(-125, 130); g.lineTo(-80, 128); g.stroke();
    g.fillStyle = '#2b2b33'; g.beginPath(); g.ellipse(-102, 122, 18, 9, -0.2, 0, TAU); g.fill();
    // jambe avant pliée
    const jambeAv = () => { g.beginPath(); g.moveTo(10, 40); g.lineTo(40, 95); g.lineTo(28, 140); g.stroke(); };
    g.strokeStyle = 'rgba(200,230,255,0.85)'; g.lineWidth = 29; jambeAv();
    g.strokeStyle = '#34507a'; g.lineWidth = 24; jambeAv();
    g.fillStyle = '#2b2b33'; g.beginPath(); g.ellipse(34, 142, 20, 10, 0.1, 0, TAU); g.fill();
    g.strokeStyle = '#eef6ff'; g.lineWidth = 5; g.beginPath(); g.moveTo(8, 154); g.lineTo(62, 152); g.stroke();
    halo2(35, 154, 30, '#9ff0ff', 0.4);
    // manteau
    g.fillStyle = '#2f4a72'; g.beginPath(); g.moveTo(-30, -60); g.quadraticCurveTo(-46, 0, -24, 50); g.lineTo(30, 50); g.quadraticCurveTo(40, -10, 30, -60); g.closePath(); g.fill();
    contour(() => { g.beginPath(); g.moveTo(30, -60); g.quadraticCurveTo(40, -10, 30, 50); g.stroke(); });
    g.fillStyle = '#243a5c'; g.fillRect(-26, 20, 54, 8);
    // écharpe rouge qui vole
    g.strokeStyle = '#d9343e'; g.lineWidth = 14; g.beginPath(); g.moveTo(-6, -62); g.bezierCurveTo(-60, -70, -100, -40, -150, -62); g.stroke();
    g.strokeStyle = '#ff6a6a'; g.lineWidth = 3; g.beginPath(); g.moveTo(-10, -66); g.bezierCurveTo(-60, -76, -100, -46, -148, -68); g.stroke();
    g.fillStyle = '#d9343e'; g.beginPath(); g.ellipse(2, -62, 26, 10, 0, 0, TAU); g.fill();
    // bras arrière
    g.strokeStyle = '#2a4266'; g.lineWidth = 16; g.beginPath(); g.moveTo(-22, -48); g.lineTo(-60, -10); g.lineTo(-90, 4); g.stroke();
    // bras avant qui brandit la lanterne
    g.strokeStyle = '#33507a'; g.lineWidth = 16; g.beginPath(); g.moveTo(22, -50); g.lineTo(70, -60); g.lineTo(104, -86); g.stroke();
    contour(() => { g.beginPath(); g.moveTo(22, -56); g.lineTo(70, -66); g.stroke(); });
    g.fillStyle = '#e8c9a8'; g.beginPath(); g.arc(106, -88, 8, 0, TAU); g.fill();
    // lanterne tenue (accent chaud)
    halo2(116, -60, 170, '#ffb347', 0.75);
    g.strokeStyle = '#c9a36b'; g.lineWidth = 3; g.beginPath(); g.moveTo(108, -92); g.lineTo(116, -78); g.stroke();
    g.fillStyle = '#3b3226'; g.fillRect(102, -78, 28, 36);
    g.fillStyle = '#ffb347'; g.beginPath(); g.ellipse(116, -60, 9, 13, 0, 0, TAU); g.fill();
    g.fillStyle = '#fff4c4'; g.beginPath(); g.ellipse(116, -58, 4, 7, 0, 0, TAU); g.fill();
    g.strokeStyle = '#e0b878'; g.lineWidth = 2.5; g.strokeRect(102, -78, 28, 36);
    // tête et bonnet
    g.fillStyle = '#e8c9a8'; g.beginPath(); g.arc(4, -92, 24, 0, TAU); g.fill();
    contour(() => { g.beginPath(); g.arc(4, -92, 24, -1.2, 0.8); g.stroke(); });
    g.fillStyle = '#1b2233'; g.beginPath(); g.ellipse(14, -94, 3.5, 4.5, 0, 0, TAU); g.ellipse(-2, -94, 3.5, 4.5, 0, 0, TAU); g.fill();
    g.strokeStyle = '#5a3a2a'; g.lineWidth = 3; g.beginPath(); g.moveTo(-6, -104); g.lineTo(2, -101); g.moveTo(10, -101); g.lineTo(19, -104); g.stroke();
    g.strokeStyle = '#7a4a3a'; g.lineWidth = 3; g.beginPath(); g.arc(7, -80, 6, 0.2, Math.PI - 0.2, true); g.stroke();
    g.fillStyle = '#d9343e'; g.beginPath(); g.arc(4, -100, 25, Math.PI * 1.02, Math.PI * 1.98); g.quadraticCurveTo(10, -150, -20, -128); g.closePath(); g.fill();
    g.fillStyle = '#ff6a6a'; g.fillRect(-21, -106, 50, 7);
    g.fillStyle = '#f6f6f6'; g.beginPath(); g.arc(-24, -130, 10, 0, TAU); g.fill();
    g.restore();
  }

  // -------------------------------------------------------------------------
  // Images du jeu (window.JEL_APERCU = 1, 2 ou 3, posé par le robot du site) :
  // le jeu s'ouvre en pleine traversée, avec son interface, puis se fige.
  // -------------------------------------------------------------------------
  function ouvrirApercu(k) {
    apercu = k;
    const cacher = () => document.querySelectorAll('jel-langue, .jel-langue').forEach((el) => { el.style.display = 'none'; });
    cacher(); setTimeout(cacher, 300);
    const i = k === 1 ? 0 : (k === 2 ? 6 : 13);
    nouvelleNuit(i, false);
    const J = jeu, m = J.m, p = J.p;
    J.invincible = true;
    ecran = 'jeu'; montrer(null);
    // le pilote mène le patineur un moment, puis on fige une scène vivante
    let cible = null;
    if (k === 1) { p.y = -500; cible = m.lanternes[1]; }
    if (k === 2) { const h = m.mains.find((x) => x.y < -700) || m.mains[0]; p.x = clamp(h.x - 60, 30, m.LW - 30); p.y = h.y + 200; cible = h; }
    if (k === 3) { const ch = m.chenaux[0]; p.y = ch.y1 + 260; p.x = m.LW * 0.5; cible = { x: m.LW * 0.5, y: ch.y1 + 20 }; }
    J.auto = true; J.surGlace = true; J.tGlace = k === 1 ? 4.2 : (k === 2 ? 11.6 : 19.3); J.prises = k === 1 ? 1 : 3;
    for (let n = 0; n < m.lanternes.length; n++) if (m.lanternes[n].y > p.y) m.lanternes[n].prise = true;
    cam.x = p.x; cam.y = p.y;
    const pas = 1 / 60;
    for (let s = 0; s < 150; s++) {
      if (cible) { const a = Math.atan2(cible.y - p.y, cible.x - p.x); p.a = p.a + angDiff(a + Math.sin(s / 20) * 0.35, p.a) * 0.08; }
      const ot = J.tGlace; maj(pas); J.tGlace = ot + pas; J.etat = 'jeu';
      J.bete.t = Math.max(J.bete.t, 0.5);
    }
    J.auto = false;
    // frappe en préparation juste derrière le patineur
    const [hx, hy] = histA(J.temps - 0.45);
    J.frappes.push({ x: hx, y: hy, R: 48, t: 0.3, total: 0.9, etat: 'annonce', petite: false, ouv: 1, bord: polyTrou(R, 1), rayons: Array.from({ length: 9 }, () => [R() * TAU, 0.8 + R() * 1.2]) });
    if (k === 2) { const h = m.mains.reduce((a, b) => (dist(b.x, b.y, p.x, p.y) < dist(a.x, a.y, p.x, p.y) ? b : a)); h.etat = 'main'; h.t = 0.6; h.hx = p.x + 55; h.hy = p.y - 30; }
    if (k === 3) { const ch = m.chenaux[0]; const b = ch.blocs.find((x) => x.voie === 1 && x.x > p.x - 200 && x.x < p.x) || ch.blocs[0]; p.x = b.x + b.w / 2; p.y = b.y + b.h / 2; p.vx = 90; p.vy = -170; p.a = Math.atan2(p.vy, p.vx); J.frappes[0].x = p.x - 20; J.frappes[0].y = ch.y1 + 90; }
    J.bete.x = p.x - 40; J.bete.y = p.y + 150;
    J.bete.queue = Array.from({ length: 40 }, (_, n) => [J.bete.x - n * 3, J.bete.y + n * 5]);
    J.particules = [];
    for (let s = 0; s < 30; s++) suivreCamera(0.2);
    majHud(true); majElan();
    figer = true;
  }

  // -------------------------------------------------------------------------
  // Démarrage
  // -------------------------------------------------------------------------
  function demarrer() {
    redimensionner();
    chargerProgression();
    majBoutonsSon();
    if (window.JEL_AFFICHE) { dessinerAffiche(); return; }
    if (window.JEL_APERCU) { ouvrirApercu(Number(window.JEL_APERCU) || 1); requestAnimationFrame(boucle); return; }
    try { effacerTitre = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('effacer-titre'), apres: () => { const son = P.son; P = progressionVide(); P.son = son; } }); if (effacerTitre && !effacerTitre.parentNode) $('effacer-titre').appendChild(effacerTitre); } catch (e) { /* rien */ }
    allerTitre();
    requestAnimationFrame(boucle);
  }
  demarrer();
})();
