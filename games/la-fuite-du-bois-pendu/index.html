      const statut = etat === 1 ? tr('statut.sorti') : etat === 2 ? tr('statut.devore') : tr('statut.case', { n: pl ? pl.p : 0, total: e ? e.L : 0 });
      d.setAttribute('aria-label', tr('place.aria.' + role, { nom: nomPlace(s) }) + (pseudo ? ' · ' + pseudo : '') + ' · ' + statut + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    if (partie.siege < 0) return tr('multi.attente');
    const moi = e.j[partie.siege];
    if (moi.st === 1) return tr('tour.sorti');
    if (moi.st === 2) return tr('tour.devore');
    if (O.courseFinie(e)) return '';
    const s = R.aQui(e);
    if (s === partie.siege) return dernierEnDanger(e) === s ? tr('tour.toiDanger') : tr('tour.toi');
    const pseudo = pseudoDe(s);
    return pseudo ? tr('tour.nom', { nom: pseudo }) : tr('tour.autre', { nom: nomPlace(s) });
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if (vue && partie && partie.phase === 'jeu') info += ' · ' + tr('jeu.tourTable', { n: vue.r });
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  // Puis-je jouer une carte maintenant ?
  function peutJouer() {
    const moi = monFuyard();
    return !!(partie && partie.monTour() && !enPause && !attenteTuto && moi && moi.st === 0 && !O.courseFinie(vue));
  }

  // Ma main : 4 cartes, la carte choisie se soulève.
  function majMain() {
    const boite = $('main');
    const moi = monFuyard();
    const cartes = moi ? moi.h : [];
    const peut = peutJouer();
    const cle = cartes.join('') + '|' + (moi ? moi.st : '-');
    if (cle !== mainAvant || boite.children.length !== 4) {
      const ancien = mainAvant.split('|')[0];
      mainAvant = cle;
      boite.textContent = '';
      for (let i = 0; i < 4; i++) {
        const type = cartes[i];
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'carte-jeu';
        if (!type) { b.disabled = true; b.style.visibility = 'hidden'; boite.appendChild(b); continue; }
        if (RARES[type]) b.classList.add('rare');
        if (ancien && i === 3 && ancien !== cartes.join('')) b.classList.add('nouvelle');
        const cv = document.createElement('canvas'); cv.width = 96; cv.height = 64;
        iconeCarte(cv.getContext('2d'), type, 48, 32, 58);
        const nom = document.createElement('span'); nom.className = 'nom'; nom.textContent = tr('carte.' + type);
        const val = document.createElement('span'); val.className = 'val';
        val.textContent = O.PAS[type] ? tr('carte.plus', { n: O.PAS[type] }) : tr('carte.surPlace');
        b.append(cv, nom, val);
        b.setAttribute('aria-label', tr('carte.aria', { nom: tr('carte.' + type), effet: tr('carte.' + type + '.effet') }));
        b.addEventListener('click', () => { audio(); toucherCarte(i); });
        boite.appendChild(b);
      }
    }
    Array.from(boite.children).forEach((b, i) => {
      if (!cartes[i]) return;
      b.disabled = !peut;
      b.classList.toggle('choisie', peut && i === choix);
    });
    majActions();
  }

  // Bouton « Jouer cette carte », ou les deux chemins d'une fourche.
  function majActions() {
    const moi = monFuyard();
    const peut = peutJouer();
    const type = peut && choix >= 0 ? moi.h[choix] : null;
    const f = type ? O.traverse(vue, partie.siege, type) : null;
    $('btn-poser').hidden = !type || !!f;
    $('btn-haut').hidden = !f;
    $('btn-bas-chemin').hidden = !f;
    $('aide').hidden = !!type;
    if (type && !f) $('btn-poser').textContent = tr('bouton.poser', { nom: tr('carte.' + type) });
    if (f) {
      const sait = f.v || moi.lt > 0;
      $('btn-haut').className = 'btn' + (sait ? (f.m === 0 ? ' rouge' : ' vert') : '');
      $('btn-bas-chemin').className = 'btn' + (sait ? (f.m === 1 ? ' rouge' : ' vert') : '');
    }
    let aide = '';
    if (moi && moi.st === 1) aide = tr('aide.sorti');
    else if (moi && moi.st === 2) aide = tr('aide.devore');
    else if (peut) aide = tr('aide.choisir');
    else if (partie && partie.phase === 'jeu' && moi) aide = moi.sk > 0 ? tr('aide.ronces') : tr('aide.attendre');
    if ($('aide').textContent !== aide) $('aide').textContent = aide;
  }

  // Ce que la carte choisie va faire (aperçu sur le sentier + phrase).
  function apercuCarte() {
    const moi = monFuyard();
    if (!moi || choix < 0 || !partie || !partie.monTour()) return null;
    const type = moi.h[choix];
    if (!type) return null;
    const f = O.traverse(vue, partie.siege, type);
    const x = copie(vue);
    if (f) {
      // On ne dit pas où mène la fourche : l'aperçu s'arrête au panneau.
      const chemin = [];
      for (let i = moi.p; i <= f.a; i++) chemin.push(i);
      return { de: moi.p, a: f.a, chemin, x: ['fourche'] };
    }
    const ev = O.appliquer(x, partie.siege, type, undefined);
    const chemin = [];
    const fin = ev.rc ? ev.rc[0] : ev.a;
    for (let i = ev.de; i <= Math.min(fin, vue.L); i++) chemin.push(i);
    if (ev.rc) chemin.push(ev.rc[1]);
    return { de: ev.de, a: ev.a, chemin, x: ev.x, danger: x.j[partie.siege].st === 0 && dernierEnDanger(x) === partie.siege };
  }

  function phraseApercu(ap) {
    if (!ap) return '';
    const x = ap.x;
    if (x.indexOf('fourche') >= 0) return tr('apercu.fourche');
    if (x.indexOf('sortie') >= 0) return tr('apercu.sortie');
    if (x.indexOf('rate') >= 0) return tr('apercu.rate');
    if (x.indexOf('cache') >= 0) return tr('apercu.cache');
    const bouts = [];
    if (x.indexOf('piege') >= 0) bouts.push(tr('apercu.piege'));
    if (x.indexOf('ronce') >= 0) bouts.push(tr('apercu.ronce'));
    if (x.indexOf('lanterne') >= 0) bouts.push(tr('apercu.lanterne'));
    if (x.indexOf('raccourci') >= 0) bouts.push(tr('apercu.raccourci'));
    if (x.indexOf('leurre') >= 0) bouts.push(tr('apercu.leurre'));
    if (ap.danger) bouts.push(tr('apercu.danger'));
    return bouts.length ? bouts.join(' ') : tr('apercu.case', { n: ap.a - ap.de });
  }

  function toucherCarte(i) {
    if (!partie || enPause || attenteTuto) return;
    const moi = monFuyard();
    if (!moi || moi.st !== 0 || O.courseFinie(vue)) return;
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (choix === i && !O.traverse(vue, partie.siege, moi.h[i])) { jouerCarte(undefined); return; }
    choix = i;
    sons.carte();
    const ap = apercuCarte();
    $('aide').textContent = '';
    majMain();
    const ph = phraseApercu(ap);
    if (ph) toast(ph, 2200);
  }

  function jouerCarte(chemin) {
    const moi = monFuyard();
    if (!partie || !moi || choix < 0 || !partie.monTour()) return;
    const action = chemin === 0 || chemin === 1 ? { c: choix, b: chemin } : { c: choix };
    if (!R.valide(vue, partie.siege, action)) return;
    if (partie.jouer(action)) { sons.carte(); choix = -1; majMain(); }
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majMain();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !O.courseFinie(e)) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle() {
    rafId = 0;
    const t = performance.now();
    if (ecran !== 'jeu') {
      if (ecran === 'titre' || ecran === 'niveaux') { dessinerTitre(t); rafId = requestAnimationFrame(boucle); }
      return;
    }
    if (enPause) return;
    for (let i = aVenir.length - 1; i >= 0; i--) if (aVenir[i].quand <= t) { const f = aVenir[i].f; aVenir.splice(i, 1); f(); }
    dessinerJeu(t);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    geo = geometrie(vue, w, h, COLONNES, true);
    const moi = monFuyard();
    const ap = choix >= 0 ? apercuCarte() : null;
    dessinerPlateau(c, vue, geo, {
      t, moi: moiSiege(), voir: !!(moi && moi.lt > 0), anims, apercu: ap, fantomes,
      danger: !!(partie && partie.phase === 'jeu' && !O.courseFinie(vue)), tour: partie && partie.phase === 'jeu' && !O.courseFinie(vue) ? R.aQui(vue) : -1,
      peur: [dernierEnDanger(vue)]
    });
  }

  // ---------------------------------------------------------------------
  //  Animations d'un coup et de la chasse
  // ---------------------------------------------------------------------

  const PAS_MS = 150;

  function plage(de, a) { const l = []; for (let i = de; i <= a; i++) l.push(i); return l; }

  // Anime la carte jouée (ev de l'état) ; renvoie sa durée (ms).
  function animerCoup(ev, action, t) {
    const s = ev.s, x = ev.x;
    let chemin, fin = ev.a, chute = false, saut = ev.c === 'b';
    if (x.indexOf('gouffre') >= 0) { chemin = plage(ev.de, ev.g); chute = true; }
    else if (ev.rc) { chemin = plage(ev.de, ev.rc[0]); chemin.push(ev.rc[1]); }
    else chemin = plage(ev.de, Math.min(fin, vueLimite()));
    if (chemin.length < 2) chemin = [ev.de, ev.de];
    const duree = Math.max(200, (chemin.length - 1) * PAS_MS + (ev.rc ? 250 : 0));
    anims.pions[s] = { chemin, debut: t, fin: t + duree, b: action && (action.b === 0 || action.b === 1) ? action.b : -1, chute, saut };
    if (O.PAS[ev.c]) sons.pas(chemin.length - 1);
    const moi = s === moiSiege();
    const nom = nomCape(s);
    plusTard(duree, () => {
      if (x.indexOf('ronce') >= 0) { sons.ronce(); if (moi) toast(tr('evt.ronceToi')); }
      if (x.indexOf('lanterne') >= 0) { sons.lanterne(); anims.eclats.push({ type: 'lumiere', c: ev.rc ? ev.rc[1] : fin, debut: performance.now(), fin: performance.now() + 700 }); if (moi) toast(tr('evt.lanterneToi')); }
      if (x.indexOf('raccourci') >= 0) { sons.raccourci(); if (moi) toast(tr('evt.raccourciToi')); else toast(tr('evt.raccourci', { nom })); }
      if (x.indexOf('piege') >= 0) { sons.piege(); anims.eclats.push({ type: 'piege', c: fin, debut: performance.now(), fin: performance.now() + 600 }); toast(moi ? tr('evt.piegeToi') : tr('evt.piege', { nom })); }
      if (x.indexOf('gouffre') >= 0) { sons.gouffre(); anims.eclats.push({ type: 'gouffre', c: ev.g, debut: performance.now(), fin: performance.now() + 800 }); toast(moi ? tr('evt.gouffreToi') : tr('evt.gouffre', { nom })); }
      if (x.indexOf('sortie') >= 0) { sons.sortie(); anims.eclats.push({ type: 'sortie', c: vue ? vue.L : fin, debut: performance.now(), fin: performance.now() + 900 }); if (!moi) toast(tr('evt.sortie', { nom })); }
    });
    if (x.indexOf('cache') >= 0) { sons.cache(); if (moi) toast(tr('evt.cacheToi')); }
    if (x.indexOf('rate') >= 0 && moi) toast(tr('evt.rateToi'));
    if (x.indexOf('leurre') >= 0) { sons.grogne(); toast(moi ? tr('evt.leurreToi') : tr('evt.leurre', { nom })); }
    if (ev.pi >= 0) { sons.piege(); if (moi) toast(tr('evt.posePiege')); }
    return duree;
  }
  function vueLimite() { return vue ? vue.L : 99; }

  // Anime la chasse des Bêtes (fin du tour de table) après le coup.
  function animerChasse(bt, apres, debut) {
    let t = debut;
    let grogne = false;
    bt.forEach((ch) => {
      const chemin = ch.a > ch.de ? plage(ch.de, ch.a) : [ch.de, ch.de];
      const duree = ch.a > ch.de ? (chemin.length - 1) * 170 : 260;
      anims.betes[ch.b] = { chemin, debut: t, fin: t + duree, faim: ch.m >= 0 };
      if (!grogne && ch.a > ch.de) { grogne = true; plusTard(t - performance.now(), () => sons.grogne()); }
      if (ch.m >= 0) {
        const pl = apres.j[ch.m];
        fantomes.push({ k: ch.m, c: pl.p, debut: debut - 150, fin: t + duree });
        const victime = ch.m, quand = t + duree;
        plusTard(quand - performance.now(), () => devorer(victime, ch.a));
      } else if (ch.pg) {
        plusTard(t + duree - performance.now(), () => { sons.piege(); toast(tr('evt.betePiege')); });
      } else if (ch.cc >= 0) {
        const qui = ch.cc;
        plusTard(t + duree - performance.now(), () => toast(qui === moiSiege() ? tr('evt.beteRateToi') : tr('evt.beteRate')));
      }
      t += duree + 120;
    });
    return t - debut;
  }

  function devorer(s, c) {
    sons.devore();
    anims.eclats.push({ type: 'devore', c: Math.max(0, c), debut: performance.now(), fin: performance.now() + 900 });
    const z = $('zone'); z.classList.remove('secousse'); void z.offsetWidth; z.classList.add('secousse');
    const fl = $('flash'); fl.classList.add('actif'); setTimeout(() => fl.classList.remove('actif'), 60);
    toast(s === moiSiege() ? tr('evt.devoreToi') : tr('evt.devore', { nom: nomCape(s) }), 2400);
    majPlaces();
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
    clore();
  }

  // Course finie et c'est à moi (place 0) de clore la manche : tout de suite.
  function clore() {
    if (!partie || partie.phase !== 'jeu' || !vue || !O.courseFinie(vue) || vue.clos) return;
    try { if (partie.monTour()) partie.jouer({ f: 1 }); } catch (e) { /* rien */ }
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? copie(partie.etat) : null;
    nouvellesAnims();
    choix = -1;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), pseudo = pseudoDe(s, sieges), cle = role + (info.chef ? '+chef' : '') + '|' + (pseudo || '');
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 100, 100);
        medaillon(c, s, 50, 56, 40, 0);
        if (info.chef) couronne(c, 50, 22, 24);
        remplirTag(d.querySelector('.tag'), role, false, pseudo);
        d.setAttribute('aria-label', tr('salon.place.' + role, { nom: nomPlace(s) }) + (pseudo ? ' · ' + pseudo : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) {
        const pseudoChef = pseudoDe(partie.chef, sieges);
        message = pseudoChef ? tr('salon.attenteNom', { nom: pseudoChef, cape: nomPlace(partie.chef) }) : tr('salon.attente', { nom: nomPlace(partie.chef) });
      }
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = copie(partie.etat);
    nouvellesAnims();
    choix = -1;
    debutTour = Date.now();
    dernierTic = -1;
    finSoloMontree = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    if (partie.monTour()) sons.tour();
  }

  function surAction(ev) {
    const t = performance.now();
    const apres = ev.apres;
    vue = copie(apres);
    debutTour = Date.now();
    dernierTic = -1;
    if (ev.moi || choix >= 0) choix = -1;
    let duree = 0;
    if (apres.ev) duree = animerCoup(apres.ev, ev.action, t);
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    (apres.sa || []).forEach((s) => { if (s === moiSiege()) plusTard(duree + 200, () => toast(tr('evt.passeToi'))); });
    if (apres.bt && apres.bt.length) duree += animerChasse(apres.bt, apres, t + duree + 150);
    const moi = moiSiege();
    if (partie.phase === 'jeu' && !O.courseFinie(apres) && R.aQui(apres) === moi && !ev.moi) {

  function surFin() {

  // ---------------------------------------------------------------------

  // Classement du moment : sortis dans l'ordre, puis ceux qui courent, puis les dévorés.
  function classementActuel(e) {
    const f = R.fin(e);
    if (f) return f.classement;
    const ordre = [];
    for (let s = 0; s < e.j.length; s++) ordre.push(s);
    const rangSt = (pl) => (pl.st === 1 ? 0 : pl.st === 0 ? 1 : 2);
    ordre.sort((x, y) => {
      const a = e.j[x], b = e.j[y];
      if (rangSt(a) !== rangSt(b)) return rangSt(a) - rangSt(b);
      if (a.st === 1) return a.k - b.k;
      if (a.st === 0) return b.p - a.p;
      return b.k - a.k;
    });
    return ordre;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    classementActuel(e).forEach((s, k) => {
      const pl = e.j[s];
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; medaillon(cv.getContext('2d'), s, 30, 30, 28, pl.st);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const pseudo = role === 'joueur' ? pseudoDe(s, sieges) : null;
      const nom = document.createElement('span'); nom.textContent = nomPlace(s) + ' · ' + (pseudo || tr('place.' + role));
      qui.appendChild(nom);
      const n = document.createElement('span');
      n.className = 'nb' + (pl.st === 1 ? ' sorti' : pl.st === 2 ? ' devore' : '');
      n.textContent = pl.st === 1 ? tr('statut.sorti') : pl.st === 2 ? tr('statut.devore') : tr('statut.case', { n: pl.p, total: e.L });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function afficherFinSolo() {

    const rang = gagne ? e.j.filter((x) => x.st === 1 && x.k <= pl.k).length : 0;

    const ancien = prog.records[i];
    const record = gagne && (ancien === 0 || rang < ancien);
    let debloque = false;

    }

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;

    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 80; i++) bouts.push({ x: Math.random() * w, y: h + Math.random() * h * 0.3, vx: (Math.random() - 0.5) * 60, vy: -(80 + Math.random() * 160), ph: Math.random() * 6, coul: i % 3 ? '#e6ff9a' : '#ffd27a', k: 2 + Math.random() * 3 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;

          if (s === 0) tapes = d.main.indexOf(et[2]);

          if (ch.m >= 0) { fant.push({ k: ch.m, c: avant.j[ch.m].p, fin: t + Math.max(260, (ch.a - ch.de) * 200) }); an.eclats.push({ type: 'devore', c: Math.max(0, b.p), debut: t + Math.max(260, (ch.a - ch.de) * 200), fin: t + 1200 }); }

    audio();
    if (!vue || !geo) return;
    const r = $('plateau').getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
    let best = -1, bd = Infinity;
    for (let i = 0; i <= vue.L; i++) { const p = centre(geo, i); const d = Math.hypot(px - p[0], py - p[1]); if (d < bd) { bd = d; best = i; } }
    if (bd > geo.s * 0.6) {
      if (geo.repaire && Math.abs(py - geo.yRep) < geo.s * 0.4) toast(tr('info.repaire'), 2000);
      return;
    }
    const moi = monFuyard();
    let cle = 'info.sentier';
    if (best === vue.L) cle = 'info.lisiere';
    else if (O.piegeEn(vue, best) >= 0) cle = 'info.piege';
    else if (vue.cel.charAt(best) === 'r') cle = 'info.ronces';
    else if (vue.cel.charAt(best) === 'l') cle = 'info.lanterne';
    else if (O.zone(vue, best)) cle = 'info.fourche';
    else if (O.raccourci(vue, best) && moi && moi.lt > 0) cle = 'info.raccourci';
    else if (vue.be.some((b) => b.p === best)) cle = 'info.bete';
    toast(tr(cle), 2000);
  });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const moi = monFuyard();
    if (!moi) return;
    const chiffre = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Numpad1: 0, Numpad2: 1, Numpad3: 2, Numpad4: 3 }[ev.code];
    if (chiffre !== undefined) { ev.preventDefault(); audio(); choix = -1; toucherCarte(chiffre); return; }
    if (ev.code === 'ArrowLeft' || ev.code === 'ArrowRight') {
      ev.preventDefault(); audio();
      const n = moi.h.length;
      const i = choix < 0 ? 0 : (choix + (ev.code === 'ArrowRight' ? 1 : n - 1)) % n;
      choix = -1; toucherCarte(i);
      return;
    }
    const type = choix >= 0 ? moi.h[choix] : null;
    const f = type && partie && partie.monTour() ? O.traverse(vue, partie.siege, type) : null;
    if (f && (ev.code === 'ArrowUp' || ev.code === 'ArrowDown')) { ev.preventDefault(); audio(); jouerCarte(ev.code === 'ArrowUp' ? 0 : 1); return; }
    if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && !document.activeElement.classList.contains('carte-jeu')) return;
      ev.preventDefault(); audio();
      if (choix < 0) { toucherCarte(0); return; }
      if (!f) jouerCarte(undefined);
      else toast(tr('apercu.fourche'), 2000);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-poser').addEventListener('click', () => { audio(); jouerCarte(undefined); });
  $('btn-haut').addEventListener('click', () => { audio(); jouerCarte(0); });
  $('btn-bas-chemin').addEventListener('click', () => { audio(); jouerCarte(1); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(performance.now()); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
