    ['#00acc1', '#ffffff', '#e53935'], ['#f4f4f4', '#1e88e5', '#1e88e5'], ['#6d4c41', '#ffd34d', '#ffd34d'],
  ];

  // --------------------------------------------------------------------------
  // Les 20 courses. Tracé : suite de sections (unité = 10 segments).
  //   D8        ligne droite         L3:6 / R3:6  courbe gauche / droite (force 3, longueur 6)
  //   E< / E>   épingle               K< / K>      chicane qui commence à gauche / droite
  //   /h        bosse de hauteur h    *s / *f      sable / flaque sur la section
  // mec : nouveauté montrée avant la course ; obj : place à atteindre ;
  // cible : virages parfaits pour la 3e étoile ; niv : adresse des rivaux.
  // --------------------------------------------------------------------------
  const NIVEAUX = [
    { c: 'cote', mec: 'pencher', tours: 2, rivaux: 4, obj: 3, cible: 3, niv: 0.80, trace: 'D10 R2:8 D8 L2.5:7 D10 R3:6 D6 L2:9 D8' },
    { c: 'cote', mec: 'parfait', tours: 2, rivaux: 4, obj: 3, cible: 4, niv: 0.82, trace: 'D9 R3:6 D6 L3:6 D8 R3.5:5 D5 L2.5:8 D7 R3:5 D6' },
    { c: 'cote', mec: 'aspiration', tours: 2, rivaux: 5, obj: 3, cible: 4, niv: 0.83, trace: 'D18 R3:6 D14 L3:6 D16 R2.5:8 D12 L3.5:5 D10' },
    { c: 'cote', mec: 'epingle', tours: 2, rivaux: 5, obj: 3, cible: 5, niv: 0.84, trace: 'D10 R3:5 D8/12 E< D10 L2.5:6 D8 R3:6 D8/10 E> D9 L3:5 D6' },
    { c: 'cote', mec: 'finaleCote', tours: 3, rivaux: 5, obj: 1, cible: 7, niv: 0.86, trace: 'D12 R3:5 D6 E< D10/12 L3:6 D12 R3.5:5 D8 E> D10 L2.5:7 D8' },
    { c: 'desert', mec: 'chicane', tours: 2, rivaux: 5, obj: 3, cible: 5, niv: 0.86, trace: 'D12 K> D10 R3:6 D8 K< D12 L3:6 D8 K> D8 R2.5:6 D8' },
    { c: 'desert', mec: 'sable', tours: 2, rivaux: 5, obj: 3, cible: 5, niv: 0.87, trace: 'D10*s R3:6 D8 K< D8*s L3:6 D10 E> D6*s R2.5:6 D10*s L3:5 D6' },
    { c: 'desert', mec: 'pneus', tours: 3, rivaux: 5, obj: 3, cible: 7, niv: 0.88, trace: 'D10 R3.5:6 D6 L3:6 D8 E< D10 K> D8 R3:6 D6' },
    { c: 'desert', mec: 'melangeDesert', tours: 3, rivaux: 6, obj: 2, cible: 7, niv: 0.89, trace: 'D16 K< D8*s R3:6 D14 L3.5:5 D6*s K> D12 E< D6' },
    { c: 'desert', mec: 'finaleDesert', tours: 3, rivaux: 6, obj: 1, cible: 9, niv: 0.90, trace: 'D12 E> D8*s K< D10 R3.5:5 D8 L3:6 D10*s K> D6 E< D8' },
    { c: 'montagne', mec: 'pluie', tours: 2, rivaux: 6, obj: 3, cible: 5, niv: 0.89, pluie: true, trace: 'D10/20 R3:6 D8/25 L3:6 D10/30 R2.5:7 D8/20 L3:6 D8' },
    { c: 'montagne', mec: 'pluieEpingle', tours: 2, rivaux: 6, obj: 2, cible: 6, niv: 0.90, pluie: true, trace: 'D10/25 E< D8 R3:5 D8/30 E> D10/20 L3:6 D8 E< D6' },
    { c: 'montagne', mec: 'pluiePneus', tours: 3, rivaux: 6, obj: 2, cible: 8, niv: 0.91, pluie: true, trace: 'D10/20 R3:6 D6 K< D8/30 L3:5 D8 E> D10/25 R2.5:6 D6' },
    { c: 'montagne', mec: 'flaques', tours: 3, rivaux: 6, obj: 2, cible: 8, niv: 0.92, trace: 'D10/25*f R3:6 D8*f L3.5:5 D10/30 E< D8*f K> D8/20 R3:5 D6*f' },
    { c: 'montagne', mec: 'finaleMontagne', tours: 3, rivaux: 7, obj: 1, cible: 10, niv: 0.93, pluie: true, trace: 'D12/30 E> D8 K< D10/25*f L3.5:5 D8 E< D10/30 R3:6 D8*f K> D6' },
    { c: 'ville', mec: 'nuit', tours: 2, rivaux: 6, obj: 3, cible: 6, niv: 0.92, nuit: true, trace: 'D12 R3.5:5 D8 L3:6 D10 R3:5 D8 E< D10 L3:5 D8' },
    { c: 'ville', mec: 'nuitChicane', tours: 3, rivaux: 6, obj: 2, cible: 8, niv: 0.93, nuit: true, trace: 'D12 K> D8 R3.5:5 D8 K< D10 L3:6 D6 K> D8 E< D6' },
    { c: 'ville', mec: 'nuitPluie', tours: 3, rivaux: 7, obj: 2, cible: 8, niv: 0.94, nuit: true, pluie: true, trace: 'D12 R3:6 D8*f K< D10 E> D8 L3:6 D10*f K> D8' },
    { c: 'ville', mec: 'toutVille', tours: 3, rivaux: 7, obj: 2, cible: 9, niv: 0.95, nuit: true, pluie: true, trace: 'D10*s K> D8 E< D10*f R3.5:5 D8 K< D8*s L3:6 D8 E> D6' },
    { c: 'ville', mec: 'grandeFinale', tours: 4, rivaux: 7, obj: 1, cible: 12, niv: 0.96, nuit: true, trace: 'D12 E> D8 K< D10*s R3.5:5 D6 E< D10 K> D8*f L3:5 D6' },
  ];
  window.JEL_NIVEAUX = NIVEAUX.length;
  // Mécaniques actives selon la course
  const PNEUS_DEPUIS = 8;
  const ASPI_DEPUIS = 3;
  const PARFAIT_DEPUIS = 1; // compté dès la 1re course, expliqué à la 2e

  // --------------------------------------------------------------------------
  // Hasard reproductible (décors, tracés)
  // --------------------------------------------------------------------------
  function alea(graine) {
    let s = graine >>> 0 || 1;
    return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, k) => a + (b - a) * k;

  // --------------------------------------------------------------------------
  // Sauvegarde et progression
  // --------------------------------------------------------------------------
  let prog = { etoiles: [], records: [], debloque: 1, moto: 1, casque: 1, combi: 1, son: true, vus: {} };
  function chargerProgression() {
    try {
      const d = window.JEL_SAVE ? window.JEL_SAVE.load(JEU) : null;
      if (d) {
        if (Array.isArray(d.etoiles)) prog.etoiles = d.etoiles.map((x) => clamp(Number(x) || 0, 0, 3)).slice(0, NIVEAUX.length);
        if (Array.isArray(d.records)) prog.records = d.records.map((x) => Number(x) || 0).slice(0, NIVEAUX.length);
        prog.debloque = clamp(Math.max(Number(d.debloque) || 1, Number(d.niveau) || 1), 1, NIVEAUX.length);
        if (d.equip && typeof d.equip === 'object') {
          prog.moto = clamp(Number(d.equip.moto) || 1, 1, 6); prog.casque = clamp(Number(d.equip.casque) || 1, 1, 6); prog.combi = clamp(Number(d.equip.combi) || 1, 1, 6);
        }
        if (d.options && typeof d.options.son === 'boolean') prog.son = d.options.son;
        if (d.vus && typeof d.vus === 'object') prog.vus = d.vus;
      }
    } catch (e) { /* sauvegarde illisible : valeurs par défaut */ }
    while (prog.etoiles.length < NIVEAUX.length) prog.etoiles.push(0);
    while (prog.records.length < NIVEAUX.length) prog.records.push(0);
  }
  function donneesSauvegarde(niveau) {
    return {
      niveau: clamp(niveau, 1, NIVEAUX.length), score: scoreTotal(), etoiles: prog.etoiles.slice(), records: prog.records.slice(),
      debloque: prog.debloque, equip: { moto: prog.moto, casque: prog.casque, combi: prog.combi }, options: { son: prog.son }, vus: prog.vus,
    };
  }
  function sauver(niveau) {
    if (apercu) return;
    try { if (window.JEL_SAVE) window.JEL_SAVE.save(JEU, donneesSauvegarde(niveau)); } catch (e) { /* sans stockage */ }
  }
  let scoreCumul = 0;
  function scoreTotal() { return Math.round(scoreCumul); }
  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);
  const tousGagnes = () => prog.etoiles.every((e) => e >= 1);

  // --------------------------------------------------------------------------
  // Construction d'un circuit
  // --------------------------------------------------------------------------
  function lireTrace(txt) {
    return txt.trim().split(/\s+/).map((tok) => {
      let sur = 0, h = 0;
      const mSur = /\*([sf])$/.exec(tok); if (mSur) { sur = mSur[1] === 's' ? 1 : 2; tok = tok.slice(0, -2); }
      const mH = /\/(\d+)$/.exec(tok); if (mH) { h = Number(mH[1]); tok = tok.slice(0, mH.index); }
      let m;
      if ((m = /^D([\d.]+)$/.exec(tok))) return { type: 'D', n: Number(m[1]), h, sur };
      if ((m = /^([LR])([\d.]+):([\d.]+)$/.exec(tok))) return { type: 'C', dir: m[1] === 'L' ? -1 : 1, c: Number(m[2]), n: Number(m[3]), h, sur };
      if ((m = /^E([<>])$/.exec(tok))) return { type: 'E', dir: m[1] === '<' ? -1 : 1, h, sur };
      if ((m = /^K([<>])$/.exec(tok))) return { type: 'K', dir: m[1] === '<' ? -1 : 1, h, sur };
      return { type: 'D', n: 4, h, sur };
    });
  }
  function construireCircuit(index) {
    const N = NIVEAUX[index];
    const sections = lireTrace(N.trace);
    // Longueur visée : environ 4 500 segments pour toute la course (une minute et demie)
    const vise = (index === 0 ? 3800 : 4500) / N.tours;
    let brut = 0;
    for (const s of sections) brut += s.type === 'E' ? 110 : s.type === 'K' ? 80 : s.n * 10;
    const fixe = sections.reduce((a, s) => a + (s.type === 'E' ? 110 : s.type === 'K' ? 80 : 0), 0);
    const ech = Math.max(0.6, (vise - fixe) / Math.max(1, brut - fixe));
    const segs = [];
    const r = alea(1000 + index * 97);
    let y = 0;
    const ajouter = (curve, yFin, sur, nature) => {
      const i = segs.length;
      const y0 = i ? segs[i - 1].y2 : 0;
      segs.push({ i, curve, y1: y0, y2: yFin, sur, surA: 0, surB: 0, sprites: [], coin: -1, nature: nature || '' });
    };
    const section = (n, courbe, h, sur, nature) => {
      n = Math.max(4, Math.round(n));
      const base = y;
      let patch = null;
      if (sur) { const cote = r() < 0.5 ? -1 : 1; patch = cote < 0 ? [-0.95, r() * 0.25] : [-r() * 0.25, 0.95]; if (r() < 0.25) patch = [-0.5, 0.5]; }
      for (let k = 0; k < n; k++) {
        const u = (k + 1) / n;
        // courbe adoucie à l'entrée et à la sortie
        const e = Math.min(1, Math.min(k + 1, n - k) / Math.max(2, n * 0.25));
        const c = typeof courbe === 'function' ? courbe(k / n) : courbe * e;
        const yy = base + h * 100 * Math.sin(Math.PI * u);
        ajouter(c, yy, 0, nature);
        const s = segs[segs.length - 1];
        if (patch && k > n * 0.2 && k < n * 0.8) { s.sur = sur; s.surA = patch[0]; s.surB = patch[1]; }
      }
      y = base;
    };
    for (const s of sections) {
      if (s.type === 'D') section(s.n * 10 * ech, 0, s.h, s.sur);
      else if (s.type === 'C') section(s.n * 10 * ech, s.dir * s.c, s.h, s.sur);
      else if (s.type === 'E') { section(110, s.dir * 6.6, s.h, s.sur, 'epingle'); }
      else if (s.type === 'K') {
        section(40, (u) => s.dir * 5.4 * Math.sin(Math.PI * u), 0, s.sur, 'chicane');
        section(40, (u) => -s.dir * 5.4 * Math.sin(Math.PI * u), 0, s.sur, 'chicane');
      }
    }
    // Virages : suites de segments courbés dans le même sens
    const coins = [];
    let enCours = null;
    for (const s of segs) {
      const sens = Math.abs(s.curve) >= 1.8 ? Math.sign(s.curve) : 0;
      if (sens && enCours && enCours.dir === sens) { enCours.fin = s.i; }
      else {
        if (enCours && enCours.fin - enCours.debut >= 8) coins.push(enCours);
        enCours = sens ? { debut: s.i, fin: s.i, dir: sens } : null;
      }
    }
    if (enCours && enCours.fin - enCours.debut >= 8) coins.push(enCours);
    coins.forEach((c, k) => { for (let i = c.debut; i <= c.fin; i++) segs[i].coin = k; });
    // Décor
    decorer(segs, N, r);
    return { segs, len: segs.length * SEG, coins };
  }

  function decorer(segs, N, r) {
    const env = N.c;
    const n = segs.length;
    for (const s of segs) {
      const i = s.i;
      // Bottes de paille le long des virages (des deux côtés)
      if (Math.abs(s.curve) >= 1.6 && i % 3 === 0) {
        s.sprites.push({ t: 'paille', x: -1.22 });
        s.sprites.push({ t: 'paille', x: 1.22 });
      }
      // Panneaux à chevrons avant les virages serrés
      const devant = segs[(i + 26) % n];
      if (Math.abs(devant.curve) >= 3.2 && Math.abs(s.curve) < 1 && i % 6 === 0) {
        s.sprites.push({ t: 'chevron', x: devant.curve > 0 ? -1.45 : 1.45, dir: Math.sign(devant.curve) });
      }
      // Tribunes et portique au départ
      if (i < 40 && i % 8 === 4) { s.sprites.push({ t: 'tribune', x: -2.1 }); s.sprites.push({ t: 'tribune', x: 2.1 }); }
      if (i === 6) s.sprites.push({ t: 'portique', x: 0 });
      // Projecteurs la nuit
      if (N.nuit && i % 18 === 0) { s.sprites.push({ t: 'projecteur', x: i % 36 ? -1.5 : 1.5 }); }
      // Décor propre à chaque circuit
      if (i % 5 === 0 && r() < 0.8) {
        const cote = r() < 0.5 ? -1 : 1;
        const x = cote * (1.7 + r() * 2.6);
        const choix = r();
        let type;
        if (env === 'cote') type = choix < 0.55 ? 'palmier' : choix < 0.8 ? 'buisson' : 'bouee';
        else if (env === 'desert') type = choix < 0.5 ? 'cactus' : choix < 0.85 ? 'rocher' : 'buisson';
        else if (env === 'montagne') type = choix < 0.7 ? 'sapin' : 'rocher';
        else type = choix < 0.65 ? 'immeuble' : 'barriere';
        if (type === 'bouee') s.sprites.push({ t: type, x: cote * 2.4, v: r() });
        else s.sprites.push({ t: type, x, v: r() });
      }
    }
  }

  // --------------------------------------------------------------------------
  // État de la course
  // --------------------------------------------------------------------------
  const cv = document.getElementById('jeu');
  let ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, UX = 200, UY = 300, HOR = 300;
  const apercu = Number(window.JEL_APERCU) || 0;
  let course = null;    // course en cours
  let etat = 'titre';   // titre, intro, depart, course, fin, pause
  let enPartie = false; // une course est choisie (pour la sauvegarde à la fermeture)
  let niveauCourant = 0;
  const entree = { g: false, d: false, pointeurs: new Map(), clavierG: false, clavierD: false };
  let bot = false;      // pilote automatique (images du jeu)

  function nouvelleCourse(index) {
    const N = NIVEAUX[index];
    const piste = construireCircuit(index);
    const moto = MOTOS[prog.moto - 1];
    const rivaux = [];
    for (let k = 0; k < N.rivaux; k++) {
      // grille de départ : rivaux devant, sur deux colonnes
      const rang = N.rivaux - k;
      // de 0,84 (course 1) à 1,00 (course 20), écart de ±0,03 entre rivaux
      const habileté = N.niv + 0.04 + (k / Math.max(1, N.rivaux - 1) - 0.5) * 0.06;
      rivaux.push({
        dist: PLAYERZ + rang * 12 * SEG, x: (k % 2 ? 0.45 : -0.45), lane: (k % 2 ? 0.45 : -0.45), v: 0, hab: habileté,
        coul: RIVAUX_COUL[k % RIVAUX_COUL.length], lean: 0, depasse: false, genou: 0,
      });
    }
    course = {
      index, N, piste, moto, rivaux,
      dist: PLAYERZ, x: 0, v: 0, lean: 0, temps: 0, depart: 3.6, tour: 0, debutTour: 0, meilleurTour: 0,
      chute: null, invuln: 0, glisse: 0, aspi: 0, usure: 0, boost: 0,
      coin: -1, coinOk: true, coinVibreur: false, parfaits: 0, coinsFaits: 0, depassements: 0,
      popups: [], particules: [], secousse: 0, fini: false, finT: 0, place: N.rivaux + 1,
      ciel: 0, gouttes: [], eclairJeu: 0, genou: 0, sonGenou: 0, finClasse: 0,
    };
    if (N.pluie) for (let k = 0; k < 90; k++) course.gouttes.push({ x: Math.random(), y: Math.random(), v: 0.8 + Math.random() * 0.6 });
    return course;
  }

  const segmentA = (z) => { const p = course.piste; const i = Math.floor(((z % p.len) + p.len) % p.len / SEG); return p.segs[i]; };
  const fracSeg = (z) => { const p = course.piste; return (((z % p.len) + p.len) % p.len % SEG) / SEG; };

  // Adhérence disponible (1 = moto pleinement penchée sans glisser)
  function adherence(seg, x) {
    let g = course.moto.grip;
    if (course.N.pluie) g *= 0.86;
    if (course.index + 1 >= PNEUS_DEPUIS) g *= 1 - 0.26 * course.usure;
    if (seg.sur && x >= seg.surA && x <= seg.surB) g *= seg.sur === 1 ? 0.66 : 0.52;
    return g;
  }

  // --------------------------------------------------------------------------
  // Mise à jour d'une image
  // --------------------------------------------------------------------------
  function maj(dt) {
    const c = course;
    const N = c.N;
    c.ciel += dt;
    // Départ : feux
    if (etat === 'depart') {
      const avant = Math.ceil(c.depart);
      c.depart -= dt;
      const apres = Math.ceil(c.depart);
      if (apres !== avant && apres >= 1 && apres <= 3) son('bip');
      if (c.depart <= 0) { etat = 'course'; son('partez'); popup(t('pop.partez'), '#7dff9b'); }
    }
    const demo = etat === 'titre';   // la moto roule seule derrière l'écran titre
    const roule = etat === 'course' || etat === 'fin' || demo;
    const seg = segmentA(c.dist);
    const sp = c.v / VMAX;
    // ---- Entrée du joueur
    let cible = 0;
    if ((etat === 'course' || demo) && !c.chute && !c.fini) {
      if (bot || demo) cible = pilote();
      else cible = (entree.g || entree.clavierG ? -1 : 0) + (entree.d || entree.clavierD ? 1 : 0);
    }
    if (c.fini) cible = 0;
    const vitesseLean = cible ? 1.7 : 2.6;
    c.lean += clamp(cible - c.lean, -vitesseLean * dt, vitesseLean * dt);
    if (Math.abs(c.lean) < 0.002) c.lean = 0;
    if (roule) c.temps += etat === 'course' && !c.fini ? dt : 0;
    // ---- Chute dans la paille
    if (c.chute) {
      const ch = c.chute;
      ch.t += dt;
      c.v = Math.max(VMAX * 0.12, c.v - VMAX * 1.6 * dt);
      const k = ch.t / ch.duree;
      c.x = ch.x0 + (ch.dir * 1.32 - ch.x0) * Math.min(1, k * 3) - ch.dir * Math.max(0, k - 0.45) * 1.0;
      c.lean = 0;
      if (ch.t >= ch.duree) { c.chute = null; c.invuln = 1.2; c.x = ch.dir * 0.78; c.v = VMAX * 0.3; }
    } else if (roule) {
      // ---- Vitesse
      let top = VMAX * c.moto.top * (1 + 0.12 * (c.aspi > 0.25 ? c.aspi : 0)) * (1 + 0.06 * c.boost);
      if (seg.sur === 1 && c.x >= seg.surA && c.x <= seg.surB) top *= 0.86;
      if (c.fini) top *= 0.45;
      const viser = top * (1 - 0.34 * Math.abs(c.lean));
      if (c.v < viser) c.v = Math.min(viser, c.v + VMAX * 0.42 * c.moto.acc * (1 - 0.5 * Math.abs(c.lean)) * (1 - 0.55 * sp) * dt * 1.6);
      else c.v = Math.max(viser, c.v - VMAX * 0.5 * dt);
      if (etat !== 'course' && !c.fini && !demo) c.v = 0;
      if (demo) c.v = Math.min(c.v, VMAX * 0.7);
      // ---- Force du virage et inclinaison
      const besoin = KNEED * seg.curve * sp;
      c.x += dt * LAT * (c.lean - besoin) * Math.min(1, sp * 1.6);
      // ---- Adhérence : trop penché sur une piste glissante = glissade
      const g = adherence(seg, c.x);
      if (Math.abs(c.lean) > g + 0.02 && sp > 0.4) { c.glisse += dt; if (c.glisse > 0.18 && Math.random() < 0.3) particule(W / 2 + c.lean * UX * 0.3, HOR + UY * 1.02, 'fumee'); }
      else c.glisse = Math.max(0, c.glisse - dt * 1.5);
      if (c.glisse > 0.45 && !c.invuln && !demo) chute(Math.sign(c.lean) || 1, 'glisse');
      // ---- Sortie de piste
      if (Math.abs(c.x) > BORD && !c.fini) {
        if (c.invuln > 0 || demo) c.x = clamp(c.x, -BORD, BORD);
        else chute(Math.sign(c.x), 'paille');
      }
      if (c.fini) c.x = clamp(c.x, -0.9, 0.9);
      // ---- Genou au sol : étincelles
      c.genou = Math.abs(c.lean) > 0.62 && sp > 0.35 ? 1 : 0;
      if (c.genou && Math.random() < 0.8) particule(W / 2 + Math.sign(c.lean) * UX * 0.3 * Math.abs(c.lean) + Math.sign(c.lean) * UX * 0.1, HOR + UY * 0.98, 'etincelle');
      // ---- Usure des pneus
      if (course.index + 1 >= PNEUS_DEPUIS && etat === 'course') c.usure = Math.min(1, c.usure + dt * (0.0019 + 0.0062 * Math.abs(c.lean) * sp));
    }
    if (c.invuln > 0) c.invuln -= dt;
    c.boost = Math.max(0, c.boost - dt * 0.6);
    // ---- Avance
    c.dist += c.v * dt;
    // ---- Virages parfaits
    if (course.index + 1 >= PARFAIT_DEPUIS && !c.fini && !demo) suivreVirage(seg);
    // ---- Rivaux
    majRivaux(dt);
    // ---- Aspiration
    if (course.index + 1 >= ASPI_DEPUIS && etat === 'course' && !c.chute) {
      let derriere = false;
      for (const r of c.rivaux) {
        const d = r.dist - c.dist;
        if (d > SEG * 2 && d < SEG * 22 && Math.abs(r.x - c.x) < 0.32) { derriere = true; break; }
      }
      const avant = c.aspi;
      c.aspi = derriere ? Math.min(1, c.aspi + dt * 0.55) : Math.max(0, c.aspi - dt * 0.7);
      if (avant < 0.6 && c.aspi >= 0.6) { popup(t('pop.aspi'), '#9fe6ff'); son('aspi'); }
    }
    // ---- Tours et arrivée
    const longueur = c.piste.len;
    const tourActuel = Math.floor((c.dist - PLAYERZ) / longueur);
    if (tourActuel > c.tour && !c.fini && !demo) {
      const tl = c.temps - c.debutTour;
      if (!c.meilleurTour || tl < c.meilleurTour) c.meilleurTour = tl;
      c.debutTour = c.temps;
      c.tour = tourActuel;
      if (c.tour >= N.tours) arrivee();
      else { son('tour'); popup(c.tour === N.tours - 1 ? t('pop.dernierTour') : t('pop.tour', { n: c.tour + 1, total: N.tours }), '#ffd34d'); }
    }
    // ---- Place
    let devant = 0;
    for (const r of c.rivaux) if (r.dist > c.dist) devant++;
    const ancienne = c.place;
    if (!c.fini) c.place = devant + 1;
    if (c.place < ancienne && etat === 'course' && !c.fini) { c.depassements++; scoreCumul += 0; son('double'); popup(t('pop.double'), '#ffffff'); }
    // ---- Fin : petit tour d'honneur puis écran de résultat
    if (c.fini) { c.finT += dt; if (c.finT > 2.2 && etat === 'fin') { etat = 'resultat'; montrerFin(); } }
    // ---- Particules et messages
    for (const p of c.particules) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vie -= dt; }
    c.particules = c.particules.filter((p) => p.vie > 0);
    for (const p of c.popups) p.vie -= dt;
    c.popups = c.popups.filter((p) => p.vie > 0);
    c.secousse = Math.max(0, c.secousse - dt * 2.5);
    if (N.pluie) for (const g of c.gouttes) { g.y += g.v * dt * 1.6; g.x -= dt * 0.15 * (1 + c.lean); if (g.y > 1) { g.y -= 1; g.x = Math.random(); } if (g.x < 0) g.x += 1; }
    sonMoteur(sp);
  }

  function suivreVirage(seg) {
    const c = course;
    if (seg.coin !== c.coin) {
      // sortie d'un virage : bilan
      if (c.coin >= 0) {
        c.coinsFaits++;
        if (c.coinOk && c.coinVibreur) {
          c.parfaits++; c.boost = 1; scoreCumul += 0;
          popup(t('pop.parfait'), '#ffd34d', true); son('parfait');
          for (let k = 0; k < 24; k++) particule(W / 2, HOR + UY * 0.7, 'or');
        }
      }
      c.coin = seg.coin;
      c.coinOk = true; c.coinVibreur = false;
    }
    if (c.coin >= 0) {
      const dir = c.piste.coins[c.coin].dir;
      if (c.x * dir > VIBREUR && Math.abs(c.lean) > 0.5) c.coinVibreur = true;
      if (c.chute || c.glisse > 0.2) c.coinOk = false;
    }
  }

  function chute(dir, raison) {
    const c = course;
    if (c.chute) return;
    c.chute = { t: 0, duree: 1.5, dir, x0: c.x };
    c.coinOk = false;
    c.aspi = 0;
    c.secousse = 1;
    c.usure = Math.min(1, c.usure + 0.03);
    son('paille');
    popup(raison === 'glisse' ? t('pop.glisse') : t('pop.paille'), '#ffb37a');
    for (let k = 0; k < 26; k++) particule(W / 2 + dir * UX * 0.5, HOR + UY * 0.9, 'paille');
  }

  function majRivaux(dt) {
    const c = course;
    const N = c.N;
    const longueur = c.piste.len;
    for (const r of c.rivaux) {
      const seg = segmentA(r.dist);
      let virage = 0;
      for (let k = 0; k < 14; k += 2) virage = Math.max(virage, Math.abs(segmentA(r.dist + k * SEG).curve));
      let vise = VMAX * r.hab * (1 - 0.043 * virage);
      if (N.pluie) vise *= 0.975;
      // Rivaux un peu plus prudents loin devant, un peu plus vifs loin derrière : course serrée
      const ecart = (c.dist - r.dist) / longueur;
      vise *= 1 + clamp(ecart * 0.25, -0.05, 0.04);
      if (etat === 'depart' || etat === 'intro') vise = 0;
      if (c.fini) vise *= 1;
      r.v += clamp(vise - r.v, -VMAX * 0.6 * dt, VMAX * 0.32 * dt);
      // Trajectoire : un peu à l'intérieur des virages
      const ideal = clamp(r.lane * 0.5 + Math.sign(seg.curve) * Math.min(0.55, Math.abs(seg.curve) * 0.1), -0.8, 0.8);
      // éviter le joueur quand il est juste devant
      const d = c.dist - r.dist;
      let evite = 0;
      if (d > 0 && d < SEG * 6 && Math.abs(c.x - r.x) < 0.35) evite = c.x > r.x ? -0.5 : 0.5;
      r.x += clamp(ideal + evite - r.x, -0.6 * dt, 0.6 * dt);
      r.lean = lerp(r.lean, clamp(seg.curve * 0.15, -0.95, 0.95), Math.min(1, dt * 4));
      r.dist += r.v * dt;
      // Contact avec le joueur (par l'arrière : le joueur ralentit)
      if (!c.chute && etat === 'course') {
        const dz = r.dist - c.dist;
        if (Math.abs(dz) < SEG * 0.9 && Math.abs(r.x - c.x) < 0.24) {
          if (dz > 0 && c.v > r.v) { c.v = r.v * 0.86; c.x += c.x >= r.x ? 0.12 : -0.12; c.coinOk = false; c.secousse = 0.5; son('toc'); }
          else if (dz <= 0 && r.v > c.v) { r.v = c.v * 0.9; r.x += r.x >= c.x ? 0.12 : -0.12; }
        }
      }
    }
  }

  function arrivee() {
    const c = course;
    c.fini = true;
    c.finT = 0;
    etat = 'fin';
    let devant = 0;
    for (const r of c.rivaux) if (r.dist > c.dist) devant++;
    c.place = devant + 1;
    son(c.place <= c.N.obj ? 'victoire' : 'rate');
    if (c.place <= c.N.obj) for (let k = 0; k < 80; k++) particule(Math.random() * W, -10, 'confetti');
  }

  // Pilote automatique (images du jeu) : penche ce qu'il faut pour suivre la trajectoire
  function pilote() {
    const c = course;
    const seg = segmentA(c.dist + SEG * 4);
    const sp = c.v / VMAX;
    const ideal = clamp(seg.curve * 0.12, -0.8, 0.8);
    const besoin = KNEED * seg.curve * sp + (ideal - c.x) * 0.9;
    if (besoin > c.lean + 0.05) return 1;
    if (besoin < c.lean - 0.05) return -1;
    return 0;
  }

  // --------------------------------------------------------------------------
  // Particules et messages
  // --------------------------------------------------------------------------
  function particule(x, y, type) {
    const c = course; if (!c) return;
    if (c.particules.length > 320) return;
    const a = Math.random() * Math.PI * 2;
    if (type === 'etincelle') c.particules.push({ x, y, vx: (Math.random() - 0.5) * 220, vy: -Math.random() * 160, g: 600, vie: 0.35 + Math.random() * 0.3, type, r: 2 });
    else if (type === 'paille') c.particules.push({ x, y, vx: Math.cos(a) * 240, vy: -Math.random() * 380, g: 700, vie: 0.9, type, r: 4 + Math.random() * 4 });
    else if (type === 'or') c.particules.push({ x, y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260 - 100, g: 220, vie: 1.0, type, r: 4 });
    else if (type === 'fumee') c.particules.push({ x, y, vx: (Math.random() - 0.5) * 60, vy: -30 - Math.random() * 40, g: 0, vie: 0.8, type, r: 10 + Math.random() * 10 });
    else if (type === 'confetti') c.particules.push({ x, y, vx: (Math.random() - 0.5) * 160, vy: 120 + Math.random() * 200, g: 60, vie: 2.6, type, r: 5, coul: ['#ffd34d', '#ff5a4e', '#4cd964', '#2f7df6', '#ff4fa8'][Math.floor(Math.random() * 5)] });
    else if (type === 'gerbe') c.particules.push({ x, y, vx: (Math.random() - 0.5) * 120, vy: -60 - Math.random() * 80, g: 400, vie: 0.5, type, r: 3 });
  }
  function popup(texte, coul, gros) { if (course) course.popups.push({ texte, coul, vie: 1.6, gros: !!gros }); }

  // --------------------------------------------------------------------------
  // Dessin
  // --------------------------------------------------------------------------
  function redim() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    UX = Math.min(H * 0.40, W * 0.5);
    UY = Math.min(H * 0.5, W * 1.1);
    HOR = H - UY - H * 0.1;
    if (window.JEL_AFFICHE) dessinerAffiche();
  }

  const fondu = (c1, c2, k) => {
    const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
    const r = Math.round(lerp(a >> 16, b >> 16, k)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, k)), bl = Math.round(lerp(a & 255, b & 255, k));
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  };

  function dessiner() {
    const c = course;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!c) { ctx.fillStyle = '#6fb6f0'; ctx.fillRect(0, 0, W, H); return; }
    const sh = c.secousse > 0 ? (Math.random() - 0.5) * 10 * c.secousse : 0;
    ctx.save();
    ctx.translate(sh, sh * 0.5);
    dessinerScene(c);
    ctx.restore();
    dessinerEffets(c);
  }

  function dessinerScene(c, opts) {
    opts = opts || {};
    const N = c.N;
    const env = CIRCUITS[N.c];
    const nuit = !!N.nuit;
    const piste = c.piste;
    const segs = piste.segs;
    const n = segs.length;
    const position = (((c.dist - PLAYERZ) % piste.len) + piste.len) % piste.len;
    const base = segmentA(position);
    const basePct = fracSeg(position);
    const joueurSeg = segmentA(c.dist);
    const joueurPct = fracSeg(c.dist);
    const joueurY = lerp(joueurSeg.y1, joueurSeg.y2, joueurPct);
    const camX = c.x * ROADW;
    const camY = joueurY + CAMH;
    // Ciel et fond
    dessinerCiel(c, env, joueurSeg);
    // sol lointain (sous l'horizon, avant les segments)
    ctx.fillStyle = nuit ? '#0b1430' : fondu(env.herbe[0], env.brouillard, 0.8);
    ctx.fillRect(0, HOR - 1, W, H - HOR + 1);
    // Route
    const portee = nuit ? 150 : 210;
    let x = 0;
    let dx = -(base.curve * basePct);
    let maxy = H;
    const vus = [];
    for (let k = 0; k < portee; k++) {
      const s = segs[(base.i + k) % n];
      const boucle = s.i < base.i ? piste.len : 0;
      const z1 = s.i * SEG + boucle - position;
      const z2 = z1 + SEG;
      const p1 = proj(x, s.y1, z1, camX, camY);
      const p2 = proj(x + dx, s.y2, z2, camX, camY);
      x += dx; dx += s.curve;
      s.p1 = p1; s.p2 = p2; s.clip = maxy; s.brume = Math.pow(k / portee, nuit ? 1.4 : 2.2);
      vus.push(s);
      if (z1 <= DEPTH || p2.y >= p1.y || p2.y >= maxy) continue;
      dessinerSegment(s, p1, p2, env, nuit);
      maxy = p1.y;
    }
    // Objets : du plus loin au plus proche
    const rivauxParSeg = new Map();
    for (const r of c.rivaux) {
      const z = ((r.dist % piste.len) + piste.len) % piste.len;
      const i = Math.floor(z / SEG);
      if (!rivauxParSeg.has(i)) rivauxParSeg.set(i, []);
      rivauxParSeg.get(i).push(r);
    }
    for (let k = vus.length - 1; k > 0; k--) {
      const s = vus[k];
      if (!s.p1 || s.p1.scale <= 0) continue;
      for (const sp of s.sprites) dessinerSprite(sp, s, env, nuit);
      const rs = rivauxParSeg.get(s.i);
      if (rs) for (const r of rs) {
        const pct = fracSeg(r.dist);
        const sc = lerp(s.p1.scale, s.p2.scale, pct);
        const sx = lerp(s.p1.x, s.p2.x, pct) + sc * r.x * ROADW * UX;
        const sy = lerp(s.p1.y, s.p2.y, pct);
        if (sy > s.clip + 2 || sc <= 0) continue;
        const taille = sc * 620 * UX;
        if (taille < 3) continue;
        ctx.save();
        if (s.clip < H) { ctx.beginPath(); ctx.rect(0, 0, W, s.clip); ctx.clip(); }
        dessinerMoto(sx, sy, taille, r.lean, { moto: r.coul[0], moto2: '#222', combi: r.coul[0], combi2: r.coul[1], casque: r.coul[2], casque2: r.coul[0], motif: 'bande' }, nuit, s.brume, N.pluie && Math.abs(r.dist - c.dist) < SEG * 30);
        ctx.restore();
      }
    }
    // Phare la nuit
    if (nuit) {
      const gr = ctx.createRadialGradient(W / 2, HOR + UY * 0.5, 10, W / 2, HOR + UY * 0.3, UY * 0.9);
      gr.addColorStop(0, 'rgba(255,246,200,.28)'); gr.addColorStop(1, 'rgba(255,246,200,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.moveTo(W / 2 - UX * 0.2, HOR + UY); ctx.lineTo(W / 2 + UX * 0.2, HOR + UY); ctx.lineTo(W / 2 + UX * 1.2, HOR + UY * 0.25); ctx.lineTo(W / 2 - UX * 1.2, HOR + UY * 0.25); ctx.closePath(); ctx.fill();
    }
    // Moto du joueur
    if (!opts.sansJoueur) dessinerJoueur(c, nuit);
  }

  function proj(wx, wy, wz, camX, camY) {
    const scale = DEPTH / wz;
    return { x: W / 2 + scale * (wx - camX) * UX, y: HOR - scale * (wy - camY) * UY, w: scale * ROADW * UX, scale };
  }

  function dessinerCiel(c, env, seg) {
    const N = c.N;
    const g = ctx.createLinearGradient(0, 0, 0, HOR + 10);
    let ciel = env.ciel;
    if (N.pluie && !N.nuit) ciel = ['#5d6f82', '#8fa1b3', '#b9c6d2'];
    g.addColorStop(0, ciel[0]); g.addColorStop(0.65, ciel[1]); g.addColorStop(1, ciel[2]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, HOR + 2);
    // décalage du fond selon les virages
    c.fondX = (c.fondX || 0) + seg.curve * (c.v / VMAX) * 0.0016;
    const fx = c.fondX;
    // soleil ou lune
    if (N.nuit) {
      ctx.fillStyle = '#f4f1dc'; ctx.beginPath(); ctx.arc(W * 0.78 - fx * 30 % W, HOR * 0.25, Math.max(16, UX * 0.12), 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.8)';
      for (let k = 0; k < 40; k++) { const sx = ((k * 137.5 + fx * 20) % W + W) % W; const sy = (k * 53.1) % (HOR * 0.8); ctx.fillRect(sx, sy, 2, 2); }
    } else if (!N.pluie) {
      const sx = W * 0.72, sy = HOR * 0.38, sr = Math.max(22, UX * 0.17);
      const gs = ctx.createRadialGradient(sx, sy, sr * 0.4, sx, sy, sr * 3.2);
      gs.addColorStop(0, 'rgba(255,250,210,.9)'); gs.addColorStop(1, 'rgba(255,250,210,0)');
      ctx.fillStyle = gs; ctx.fillRect(sx - sr * 3.2, sy - sr * 3.2, sr * 6.4, sr * 6.4);
      ctx.fillStyle = '#fff7cf'; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(70,82,98,.6)';
      for (let k = 0; k < 7; k++) { const cx = ((k * W / 4 - fx * 200) % (W * 1.75) + W * 1.75) % (W * 1.75) - W * 0.4; ctx.beginPath(); ctx.ellipse(cx, HOR * (0.2 + (k % 3) * 0.12), UX * 0.8, UX * 0.2, 0, 0, Math.PI * 2); ctx.fill(); }
    }
    // couches lointaines
    const couche = (vitesse, haut, coul, forme) => {
      const dec = fx * vitesse * W;
      ctx.fillStyle = coul;
      ctx.beginPath(); ctx.moveTo(0, HOR + 2);
      const pas = Math.max(8, W / 60);
      for (let px = 0; px <= W + pas; px += pas) {
        const u = (px + dec) / (UX * 1.1);
        ctx.lineTo(px, HOR - haut * forme(u));
      }
      ctx.lineTo(W, HOR + 2); ctx.closePath(); ctx.fill();
    };
    const onde = (u) => 0.55 + 0.25 * Math.sin(u) + 0.15 * Math.sin(u * 2.7 + 1) + 0.05 * Math.sin(u * 7.1);
    if (env.fond === 'mer') {
      couche(0.5, UX * 0.55, '#7fa9c9', (u) => Math.max(0, onde(u * 0.6) - 0.35) * 1.6);
      ctx.fillStyle = '#2a86c9'; ctx.fillRect(0, HOR - UX * 0.06, W, UX * 0.08);
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      for (let k = 0; k < 30; k++) { const sx = ((k * 97.3 - fx * 500) % W + W) % W; ctx.fillRect(sx, HOR - UX * 0.05 + (k % 3) * 3, 10, 2); }
      // phare lointain
      const px = ((W * 0.2 - fx * 400) % (W * 1.4) + W * 1.4) % (W * 1.4) - W * 0.2;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(px, HOR - UX * 0.42, UX * 0.06, UX * 0.36);
      ctx.fillStyle = '#e53935'; ctx.fillRect(px, HOR - UX * 0.34, UX * 0.06, UX * 0.06); ctx.fillRect(px, HOR - UX * 0.2, UX * 0.06, UX * 0.06);
      ctx.fillStyle = '#ffe680'; ctx.fillRect(px - UX * 0.01, HOR - UX * 0.47, UX * 0.08, UX * 0.05);
    } else if (env.fond === 'dunes') {
      couche(0.3, UX * 0.6, '#d9925a', (u) => { const m = Math.sin(u * 0.5); return m > 0.6 ? 0.9 : Math.max(0, m) * 0.4; });
      couche(0.6, UX * 0.35, '#e8a868', (u) => onde(u * 0.8) * 0.9);
      couche(1.0, UX * 0.18, '#f0bd7c', (u) => onde(u * 1.3));
    } else if (env.fond === 'pics') {
      const pic = (u) => { const f = u % 2; const tri = 1 - Math.abs(f - 1); return 0.25 + tri * 0.75 * (0.7 + 0.3 * Math.sin(u * 3.3)); };
      couche(0.25, UX * 1.0, '#9fb7cf', pic);
      // neige sur les sommets
      couche(0.25, UX * 1.0, 'rgba(255,255,255,0)', pic);
      couche(0.55, UX * 0.6, '#5f8a74', (u) => pic(u * 1.4 + 3));
      couche(1.0, UX * 0.28, '#3f7a4f', (u) => onde(u * 2));
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      const dec = fx * 0.25 * W;
      for (let px = 0; px < W; px += 4) { const u = (px + dec) / (UX * 1.1); const h = UX * 1.0 * pic(u); if (h > UX * 0.78) ctx.fillRect(px, HOR - h, 4, (h - UX * 0.78) * 0.8); }
    } else {
      // gratte-ciel avec fenêtres allumées
      const dec = fx * 0.5 * W;
      for (let k = -2; k < W / (UX * 0.22) + 3; k++) {
        const id = Math.floor(k + dec / (UX * 0.22));
        const hasard = Math.abs(Math.sin(id * 12.9898) * 43758.5453) % 1;
        const bx = k * UX * 0.22 - (dec % (UX * 0.22));
        const bh = UX * (0.4 + hasard * 0.9);
        ctx.fillStyle = hasard > 0.5 ? '#1c2550' : '#232d5e';
        ctx.fillRect(bx, HOR - bh, UX * 0.2, bh);
        ctx.fillStyle = hasard > 0.3 ? '#ffd86b' : '#7fd2ff';
        for (let wy = HOR - bh + 6; wy < HOR - 6; wy += 9) for (let wx = bx + 4; wx < bx + UX * 0.2 - 4; wx += 8) if (Math.sin(wx * 3.1 + wy * 7.7 + id) > 0.25) ctx.fillRect(wx, wy, 3, 4);
      }
    }
  }

  function dessinerSegment(s, p1, p2, env, nuit) {
    const bande = Math.floor(s.i / 3) % 2;
    const brume = s.brume;
    const fog = (coul) => (brume > 0.02 ? fondu(coul, env.brouillard, brume) : coul);
    // herbe / sable / sol
    ctx.fillStyle = fog(env.herbe[bande]);
    ctx.fillRect(0, p2.y, W, p1.y - p2.y + 1);
    // bords (vibreurs dans les virages)
    const vib = Math.abs(s.curve) >= 1.6;
    const r1 = p1.w * (vib ? 1.13 : 1.05), r2 = p2.w * (vib ? 1.13 : 1.05);
    ctx.fillStyle = fog(vib ? (bande ? '#e53935' : '#ffffff') : env.bord);
    quad(p1.x - r1, p1.y, p1.x + r1, p2.x + r2, p2.y, p2.x - r2);
    // route (mouillée : plus sombre)
    let route = env.route[bande];
    if (course && course.N.pluie) route = bande ? '#4a505c' : '#474d58';
    ctx.fillStyle = fog(route);
    quad(p1.x - p1.w, p1.y, p1.x + p1.w, p2.x + p2.w, p2.y, p2.x - p2.w);
    // vibreurs intérieurs bien visibles
    if (vib) {
      const dir = Math.sign(s.curve);
      const a1 = p1.x + dir * p1.w * VIBREUR, a2 = p2.x + dir * p2.w * VIBREUR;
      ctx.fillStyle = fog(bande ? '#c9443f' : '#d9d9d9');
      quad(a1, p1.y, p1.x + dir * p1.w, p2.x + dir * p2.w, p2.y, a2);
    }
    // sable ou flaque
    if (s.sur) {
      ctx.fillStyle = fog(s.sur === 1 ? '#d8b26a' : '#5d86b3');
      const a1 = p1.x + s.surA * p1.w, b1 = p1.x + s.surB * p1.w, a2 = p2.x + s.surA * p2.w, b2 = p2.x + s.surB * p2.w;
      quad(a1, p1.y, b1, b2, p2.y, a2);
      if (s.sur === 2 && bande) { ctx.fillStyle = 'rgba(220,240,255,.35)'; quad(lerp(a1, b1, 0.3), p1.y, lerp(a1, b1, 0.5), lerp(a2, b2, 0.5), p2.y, lerp(a2, b2, 0.3)); }
    }
    // ligne du milieu
    if (bande && !vib) {
      const l1 = p1.w * 0.025, l2 = p2.w * 0.025;
      ctx.fillStyle = fog('#f2f2f2');
      quad(p1.x - l1, p1.y, p1.x + l1, p2.x + l2, p2.y, p2.x - l2);
    }
    // ligne d'arrivée en damier
    if (s.i < 2) {
      const cases = 10;
      for (let k = 0; k < cases; k++) {
        ctx.fillStyle = (k + s.i) % 2 ? '#111' : '#fff';
        const u0 = -1 + (2 * k) / cases, u1 = -1 + (2 * (k + 1)) / cases;
        quad(p1.x + u0 * p1.w, p1.y, p1.x + u1 * p1.w, p2.x + u1 * p2.w, p2.y, p2.x + u0 * p2.w);
      }
    }
    // nuit : obscurité au loin, flaques de lumière des projecteurs
    if (nuit) {
      const lum = s.i % 18 < 6 ? 0.12 : 0.45;
      ctx.fillStyle = 'rgba(5,8,25,' + Math.min(0.82, lum + brume * 0.5) + ')';
      ctx.fillRect(0, p2.y, W, p1.y - p2.y + 1);
    }
  }

  function quad(x1, y1, x2, x3, y2, x4) {
    // 0,7 px de recouvrement vers le haut : pas de fine ligne entre deux segments
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y1); ctx.lineTo(x3, y2 - 0.7); ctx.lineTo(x4, y2 - 0.7); ctx.closePath(); ctx.fill();
  }

  // Objets du décor (dessinés en formes simples, sans aucun texte)
  function dessinerSprite(sp, s, env, nuit) {
    const p = s.p1;
    const sc = p.scale;
    const x = p.x + sc * sp.x * ROADW * UX;
    const y = p.y;
    const u = sc * UX; // 1 unité du monde = u pixels
    if (u * 300 < 1.5 || x < -W || x > W * 2) return;
    ctx.save();
    if (s.clip < H) { ctx.beginPath(); ctx.rect(0, 0, W, s.clip); ctx.clip(); }
    ctx.globalAlpha = 1 - s.brume * 0.85;
    switch (sp.t) {
      case 'paille': {
        const w = 300 * u, h = 190 * u;
        ctx.fillStyle = '#e2b448'; ctx.fillRect(x - w / 2, y - h, w, h);
        ctx.fillStyle = '#c8962e'; ctx.fillRect(x - w / 2, y - h * 0.62, w, h * 0.12); ctx.fillRect(x - w / 2, y - h * 0.3, w, h * 0.12);
        ctx.fillStyle = '#f3d27a'; ctx.fillRect(x - w / 2, y - h, w, h * 0.16);
        break;
      }
      case 'chevron': {
        const w = 360 * u, h = 260 * u, pied = 300 * u;
        ctx.fillStyle = '#555'; ctx.fillRect(x - 12 * u, y - pied, 24 * u, pied);
        ctx.fillStyle = '#1d4fd1'; ctx.fillRect(x - w / 2, y - pied - h, w, h);
        ctx.fillStyle = '#fff';
        for (let k = 0; k < 2; k++) {
          const cx = x + (k - 0.5) * w * 0.4;
          ctx.beginPath();
          ctx.moveTo(cx - sp.dir * w * 0.12, y - pied - h * 0.85); ctx.lineTo(cx + sp.dir * w * 0.1, y - pied - h * 0.5); ctx.lineTo(cx - sp.dir * w * 0.12, y - pied - h * 0.15);
          ctx.lineTo(cx - sp.dir * w * 0.02, y - pied - h * 0.15); ctx.lineTo(cx + sp.dir * w * 0.2, y - pied - h * 0.5); ctx.lineTo(cx - sp.dir * w * 0.02, y - pied - h * 0.85);
          ctx.closePath(); ctx.fill();
        }
        break;
      }
      case 'tribune': {
        const w = 1100 * u, h = 520 * u;
        ctx.fillStyle = '#8a8f9c'; ctx.fillRect(x - w / 2, y - h, w, h);
        ctx.fillStyle = '#d23b3b'; ctx.fillRect(x - w / 2 - 20 * u, y - h - 80 * u, w + 40 * u, 80 * u);
        const cols = ['#ffd34d', '#ff5a4e', '#ffffff', '#2f7df6', '#4cd964', '#ff4fa8'];
        for (let r = 0; r < 4; r++) for (let k = 0; k < 14; k++) {
          ctx.fillStyle = cols[(r * 5 + k * 3) % cols.length];
          const bx = x - w / 2 + (k + 0.5) * w / 14, by = y - h + (r + 0.6) * h / 4.6;
          ctx.beginPath(); ctx.arc(bx, by + Math.sin(course.ciel * 8 + k + r) * 6 * u, 22 * u, 0, Math.PI * 2); ctx.fill();
        }
        break;
      }
      case 'portique': {
        const w = ROADW * 2.4 * u, h = 1400 * u;
        ctx.fillStyle = '#e8e8e8'; ctx.fillRect(x - w / 2, y - h, 60 * u, h); ctx.fillRect(x + w / 2 - 60 * u, y - h, 60 * u, h);
        ctx.fillStyle = '#222'; ctx.fillRect(x - w / 2, y - h, w, 220 * u);
        for (let k = 0; k < 16; k++) { ctx.fillStyle = k % 2 ? '#fff' : '#111'; ctx.fillRect(x - w / 2 + k * w / 16, y - h + 160 * u, w / 16, 60 * u); }
        // feux de départ
        const c = course;
        for (let k = 0; k < 3; k++) {
          let coul = '#3a1010';
          if (etat === 'depart' && c.depart <= 3 - k + 0.6 && c.depart > 0) coul = '#ff3b30';
          if (etat !== 'depart' && etat !== 'intro') coul = '#2fdc5a';
          ctx.fillStyle = coul; ctx.beginPath(); ctx.arc(x + (k - 1) * 200 * u, y - h + 80 * u, 55 * u, 0, Math.PI * 2); ctx.fill();
        }
        break;
      }
      case 'projecteur': {
        const h = 1500 * u;
        ctx.fillStyle = '#4a4f5e'; ctx.fillRect(x - 18 * u, y - h, 36 * u, h);
        ctx.fillStyle = '#fffbe0'; ctx.fillRect(x - 120 * u, y - h - 40 * u, 240 * u, 80 * u);
        const g = ctx.createRadialGradient(x, y - h, 10 * u, x, y - h * 0.3, h * 0.9);
        g.addColorStop(0, 'rgba(255,250,215,.55)'); g.addColorStop(1, 'rgba(255,250,215,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(x - 100 * u, y - h); ctx.lineTo(x + 100 * u, y - h); ctx.lineTo(x - sp.x * 700 * u + 600 * u, y); ctx.lineTo(x - sp.x * 700 * u - 600 * u, y); ctx.closePath(); ctx.fill();
        break;
      }
      case 'palmier': {
        const h = (900 + sp.v * 400) * u;
        ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 50 * u; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 120 * u, y - h * 0.5, x + 60 * u, y - h); ctx.stroke();
        ctx.fillStyle = '#2e9e4a';
        for (let k = 0; k < 6; k++) {
          const a = -Math.PI / 2 + (k - 2.5) * 0.55;
          ctx.beginPath(); ctx.ellipse(x + 60 * u + Math.cos(a) * 200 * u, y - h + Math.sin(a) * 120 * u + 60 * u, 260 * u, 60 * u, a, 0, Math.PI * 2); ctx.fill();
        }
        break;
      }
      case 'buisson': {
        ctx.fillStyle = env === CIRCUITS.desert ? '#a9a24f' : '#3a9a45';
        ctx.beginPath(); ctx.ellipse(x, y - 120 * u, 260 * u, 140 * u, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.beginPath(); ctx.ellipse(x - 60 * u, y - 170 * u, 120 * u, 60 * u, 0, 0, Math.PI * 2); ctx.fill();
        break;
      }
      case 'bouee': {
        ctx.fillStyle = '#ff5a3c'; ctx.beginPath(); ctx.arc(x, y - 120 * u, 120 * u, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.fillRect(x - 120 * u, y - 150 * u, 240 * u, 60 * u);
        break;
      }
      case 'cactus': {
        const h = (600 + sp.v * 300) * u;
        ctx.fillStyle = '#3e8b4a';
        ctx.fillRect(x - 50 * u, y - h, 100 * u, h);
        ctx.fillRect(x - 200 * u, y - h * 0.6, 60 * u, h * 0.3); ctx.fillRect(x - 200 * u, y - h * 0.38, 160 * u, 60 * u);
        ctx.fillRect(x + 140 * u, y - h * 0.75, 60 * u, h * 0.3); ctx.fillRect(x + 40 * u, y - h * 0.5, 160 * u, 60 * u);
        break;
      }
      case 'rocher': {
        ctx.fillStyle = env === CIRCUITS.desert ? '#b86a3c' : '#8a8f99';
        ctx.beginPath(); ctx.moveTo(x - 300 * u, y); ctx.lineTo(x - 200 * u, y - 260 * u); ctx.lineTo(x + 40 * u, y - 340 * u); ctx.lineTo(x + 280 * u, y - 180 * u); ctx.lineTo(x + 320 * u, y); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.moveTo(x - 200 * u, y - 260 * u); ctx.lineTo(x + 40 * u, y - 340 * u); ctx.lineTo(x - 20 * u, y - 150 * u); ctx.closePath(); ctx.fill();
        break;
      }
      case 'sapin': {
        const h = (1000 + sp.v * 500) * u;
        ctx.fillStyle = '#6b4a2b'; ctx.fillRect(x - 40 * u, y - h * 0.2, 80 * u, h * 0.2);
        ctx.fillStyle = '#1f6b3a';
        for (let k = 0; k < 3; k++) { const b = y - h * 0.15 - k * h * 0.27; const lw = (330 - k * 80) * u; ctx.beginPath(); ctx.moveTo(x - lw, b); ctx.lineTo(x, b - h * 0.42); ctx.lineTo(x + lw, b); ctx.closePath(); ctx.fill(); }
        ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.moveTo(x - 70 * u, y - h * 0.82); ctx.lineTo(x, y - h * 0.97); ctx.lineTo(x + 70 * u, y - h * 0.82); ctx.closePath(); ctx.fill();
        break;
      }
      case 'immeuble': {
        const w = (700 + sp.v * 500) * u, h = (1800 + sp.v * 2000) * u;
        ctx.fillStyle = sp.v > 0.5 ? '#2b3566' : '#3b2f5e'; ctx.fillRect(x - w / 2, y - h, w, h);
        ctx.fillStyle = sp.v > 0.3 ? '#ffd86b' : '#8fe0ff';
        const pas = Math.max(3, 120 * u);
        for (let wy = y - h + pas; wy < y - pas; wy += pas * 1.4) for (let wx = x - w / 2 + pas * 0.6; wx < x + w / 2 - pas; wx += pas * 1.2) if (Math.sin(wx * 0.7 + wy * 1.3) > -0.2) ctx.fillRect(wx, wy, pas * 0.6, pas * 0.7);
        break;
      }
      case 'barriere': {
        const w = 700 * u, h = 200 * u;
        for (let k = 0; k < 5; k++) { ctx.fillStyle = k % 2 ? '#e53935' : '#ffffff'; ctx.fillRect(x - w / 2 + k * w / 5, y - h, w / 5, h * 0.6); }
        ctx.fillStyle = '#777'; ctx.fillRect(x - w / 2, y - h * 0.4, 30 * u, h * 0.4); ctx.fillRect(x + w / 2 - 30 * u, y - h * 0.4, 30 * u, h * 0.4);
        break;
      }
    }
    ctx.restore();
  }

  // Moto vue de derrière, penchée de « lean » (−1 à 1). (x, y) = point de contact au sol.
  function dessinerMoto(x, y, taille, lean, look, nuit, brume, gerbe) {
    const a = lean * 0.82; // angle en radians (environ 47° au maximum)
    const u = taille / 100;
    ctx.save();
    ctx.translate(x, y);
    if (brume > 0) ctx.globalAlpha = 1 - brume * 0.7;
    // ombre
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath(); ctx.ellipse(-a * 14 * u, 0, 22 * u, 5 * u, 0, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(a);
    const membre = (coul, largeur, pts) => {
      ctx.strokeStyle = coul; ctx.lineWidth = largeur * u; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(pts[0] * u, pts[1] * u); for (let k = 2; k < pts.length; k += 2) ctx.lineTo(pts[k] * u, pts[k + 1] * u); ctx.stroke();
    };
    // carénages latéraux (plus larges, derrière tout)
    ctx.fillStyle = look.moto2 || '#222';
    roundRect(-27 * u, -66 * u, 54 * u, 24 * u, 10 * u); ctx.fill();
    ctx.fillStyle = look.moto;
    roundRect(-25 * u, -68 * u, 50 * u, 22 * u, 10 * u); ctx.fill();
    // guidon et gants
    ctx.fillStyle = '#1c1c1c'; roundRect(-31 * u, -74 * u, 9 * u, 5 * u, 2 * u); ctx.fill(); roundRect(22 * u, -74 * u, 9 * u, 5 * u, 2 * u); ctx.fill();
    // roue arrière (pneu large)
    ctx.fillStyle = '#16181d'; roundRect(-11 * u, -32 * u, 22 * u, 32 * u, 9 * u); ctx.fill();
    ctx.fillStyle = '#3a3d45'; roundRect(-5 * u, -28 * u, 10 * u, 22 * u, 4 * u); ctx.fill();
    // pots d'échappement
    ctx.fillStyle = '#a7adb5'; roundRect(13 * u, -36 * u, 11 * u, 9 * u, 4 * u); ctx.fill();
    ctx.fillStyle = '#5c6068'; ctx.beginPath(); ctx.arc(18.5 * u, -31.5 * u, 3 * u, 0, Math.PI * 2); ctx.fill();
    // coque arrière en pointe
    ctx.fillStyle = look.moto;
    ctx.beginPath(); ctx.moveTo(-17 * u, -62 * u); ctx.lineTo(17 * u, -62 * u); ctx.lineTo(12 * u, -34 * u); ctx.lineTo(-12 * u, -34 * u); ctx.closePath(); ctx.fill();
    ctx.fillStyle = look.moto2 || '#222'; ctx.fillRect(-15 * u, -52 * u, 30 * u, 4 * u);
    // feu arrière
    ctx.fillStyle = nuit ? '#ff2a2a' : '#d02020'; roundRect(-8 * u, -44 * u, 16 * u, 6 * u, 3 * u); ctx.fill();
    if (nuit) { ctx.fillStyle = 'rgba(255,40,40,.35)'; ctx.beginPath(); ctx.arc(0, -41 * u, 18 * u, 0, Math.PI * 2); ctx.fill(); }
    // jambes : cuisse, genou, botte. Le genou intérieur s'ouvre vers le sol quand on penche.
    const ouv = Math.max(0, Math.abs(lean) - 0.2) * 1.25;
    const s = Math.sign(lean) || 1;
    for (const cote of [-1, 1]) {
      const dedans = cote === s ? ouv : 0;
      const gx = cote * (27 + dedans * 16), gy = -50 + dedans * 16;
      membre(look.combi, 16, [cote * 12, -66, gx, gy, cote * 21, -38]);
      ctx.fillStyle = '#1f1f24'; roundRect((cote * 21 - 6) * u, -42 * u, 12 * u, 9 * u, 3 * u); ctx.fill();
      // patin de genou (frotte le sol)
      ctx.fillStyle = dedans > 0.5 ? '#ffe680' : '#d8d8d8';
      ctx.beginPath(); ctx.arc(gx * u, gy * u, 4.6 * u, 0, Math.PI * 2); ctx.fill();
    }
    // selle et bas du dos
    ctx.fillStyle = look.combi; ctx.beginPath(); ctx.ellipse(0, -66 * u, 17 * u, 10 * u, 0, 0, Math.PI * 2); ctx.fill();
    // dos du pilote, couché sur la moto
    ctx.fillStyle = look.combi; roundRect(-18 * u, -96 * u, 36 * u, 34 * u, 15 * u); ctx.fill();
    ctx.fillStyle = look.combi2; roundRect(-4 * u, -94 * u, 8 * u, 30 * u, 4 * u); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.2)'; roundRect(-15 * u, -93 * u, 9 * u, 24 * u, 5 * u); ctx.fill();
    // bras vers le guidon
    membre(look.combi, 10, [-15, -88, -24, -78, -27, -72]);
    membre(look.combi, 10, [15, -88, 24, -78, 27, -72]);
    ctx.fillStyle = '#1f1f24'; ctx.beginPath(); ctx.arc(-27 * u, -72 * u, 4.5 * u, 0, Math.PI * 2); ctx.arc(27 * u, -72 * u, 4.5 * u, 0, Math.PI * 2); ctx.fill();
    // casque (le pilote garde la tête plus droite que la moto)
    ctx.save();
    ctx.translate(0, -100 * u);
    ctx.rotate(-a * 0.35);
    ctx.fillStyle = look.casque; ctx.beginPath(); ctx.ellipse(0, -6 * u, 14 * u, 15 * u, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = look.casque2;
    motifCasque(look.motif, u);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-5 * u, -12 * u, 5 * u, 4 * u, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.restore();
    // gerbe d'eau
    if (gerbe && taille > 18 && Math.random() < 0.6 && course) particule(x + (Math.random() - 0.5) * taille * 0.2, y - 4, 'gerbe');
  }
  function motifCasque(motif, u) {
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, -6 * u, 14 * u, 15 * u, 0, 0, Math.PI * 2); ctx.clip();
    if (motif === 'bande') ctx.fillRect(-3 * u, -22 * u, 6 * u, 32 * u);
    else if (motif === 'eclair') { ctx.beginPath(); ctx.moveTo(-6 * u, -20 * u); ctx.lineTo(4 * u, -10 * u); ctx.lineTo(-2 * u, -8 * u); ctx.lineTo(6 * u, 6 * u); ctx.lineTo(-5 * u, -6 * u); ctx.lineTo(1 * u, -8 * u); ctx.closePath(); ctx.fill(); }
    else if (motif === 'etoile') { etoileForme(0, -6 * u, 8 * u, 3.5 * u); ctx.fill(); }
    else if (motif === 'pois') { for (const [px, py] of [[-7, -12], [5, -14], [0, -2], [-8, 2], [8, 0]]) { ctx.beginPath(); ctx.arc(px * u, py * u, 2.6 * u, 0, Math.PI * 2); ctx.fill(); } }
    else if (motif === 'damier') { for (let i = -3; i < 3; i++) for (let j = -4; j < 2; j++) if ((i + j) % 2 === 0) ctx.fillRect(i * 5 * u, j * 5 * u, 5 * u, 5 * u); }
    else if (motif === 'flamme') { ctx.beginPath(); ctx.moveTo(-14 * u, 6 * u); for (let k = 0; k <= 6; k++) ctx.lineTo(-14 * u + k * 4.7 * u, (k % 2 ? -14 : -4) * u); ctx.lineTo(14 * u, 6 * u); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }
  function etoileForme(cx, cy, R, r) {
    ctx.beginPath();
    for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5; const rr = k % 2 ? r : R; ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
    ctx.closePath();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  const lookJoueur = () => {
    const m = MOTOS[prog.moto - 1], k = CASQUES[prog.casque - 1], c = COMBIS[prog.combi - 1];
    return { moto: m.coul, moto2: m.coul2, combi: c.coul, combi2: c.coul2, casque: k.coul, casque2: k.coul2, motif: k.motif };
  };

  function dessinerJoueur(c, nuit) {
    const yBase = HOR + UY + 2;
    let x = W / 2, lean = c.lean, taille = UX * 0.68;
    if (c.chute) {
      const k = c.chute.t / c.chute.duree;
      x = W / 2 + c.chute.dir * Math.sin(Math.min(1, k * 2.2) * Math.PI * 0.5) * UX * 0.5 * (1 - Math.max(0, k - 0.6) * 2);
      lean = c.chute.dir * (k < 0.55 ? 1.55 : lerp(1.55, 0, (k - 0.55) / 0.45));
      // rebond de la botte de paille
      const rebond = Math.abs(Math.sin(k * Math.PI * 3)) * (1 - k) * UX * 0.12;
      ctx.save(); ctx.translate(0, -rebond);
      dessinerMoto(x, yBase, taille, lean, lookJoueur(), nuit, 0, false);
      ctx.restore();
      return;
    }
    if (c.invuln > 0 && Math.floor(c.invuln * 10) % 2) ctx.globalAlpha = 0.6;
    dessinerMoto(x, yBase, taille, lean, lookJoueur(), nuit, 0, c.N.pluie);
    ctx.globalAlpha = 1;
    // traînée d'aspiration
    if (c.aspi > 0.3) {
      ctx.strokeStyle = 'rgba(200,240,255,' + (c.aspi * 0.6) + ')'; ctx.lineWidth = 2;
      for (let k = 0; k < 8; k++) { const sx = W / 2 + (k - 3.5) * UX * 0.14; const sy = HOR + UY * (0.2 + ((k * 0.37 + c.ciel * 2.5) % 1) * 0.7); ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + (sx - W / 2) * 0.3, sy + UY * 0.15); ctx.stroke(); }
    }
  }

  function dessinerEffets(c) {
    // particules
    for (const p of c.particules) {
      if (p.type === 'etincelle') { ctx.fillStyle = Math.random() < 0.5 ? '#ffe680' : '#ff9a1f'; ctx.fillRect(p.x, p.y, 3, 3); }
      else if (p.type === 'paille') { ctx.fillStyle = '#f0c552'; ctx.fillRect(p.x, p.y, p.r * 2, p.r * 0.7); }
      else if (p.type === 'or') { ctx.fillStyle = '#ffd34d'; etoileForme(p.x, p.y, p.r * 1.8, p.r * 0.8); ctx.fill(); }
      else if (p.type === 'fumee') { ctx.fillStyle = 'rgba(230,230,230,' + (p.vie * 0.5) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.6 - p.vie), 0, Math.PI * 2); ctx.fill(); }
      else if (p.type === 'confetti') { ctx.fillStyle = p.coul; ctx.fillRect(p.x, p.y, p.r * 1.6, p.r); }
      else if (p.type === 'gerbe') { ctx.fillStyle = 'rgba(210,230,255,.6)'; ctx.fillRect(p.x, p.y, 2, 4); }
    }
    // pluie
    if (c.N.pluie) {
      ctx.strokeStyle = 'rgba(210,225,255,.45)'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (const g of c.gouttes) { const gx = g.x * W, gy = g.y * H; ctx.moveTo(gx, gy); ctx.lineTo(gx - 4, gy + 16); }
      ctx.stroke();
    }
    // feux de départ (gros, au centre)
    if (etat === 'depart') {
      const r = Math.max(14, UX * 0.08);
      const y = H * 0.28;
      ctx.fillStyle = 'rgba(10,14,28,.8)'; roundRect(W / 2 - r * 5, y - r * 1.5, r * 10, r * 3, r); ctx.fill();
      for (let k = 0; k < 3; k++) {
        const on = c.depart <= 3 - k + 0.6;
        ctx.fillStyle = on ? '#ff3b30' : '#3a1414';
        ctx.beginPath(); ctx.arc(W / 2 + (k - 1) * r * 3, y, r, 0, Math.PI * 2); ctx.fill();
      }
    }
    // messages
    let decal = 0;
    for (const p of c.popups) {
      const k = 1 - p.vie / 1.6;
      const taille = (p.gros ? 1.25 : 1) * clamp(Math.min(W * 0.085, H * 0.06), 24, 52);
      ctx.save();
      ctx.globalAlpha = Math.min(1, p.vie * 2);
      ctx.font = '900 ' + Math.round(taille * (k < 0.15 ? 0.6 + k * 2.6 : 1)) + 'px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const py = H * 0.38 - k * 30 + decal;
      ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(10,14,28,.85)'; ctx.strokeText(p.texte, W / 2, py);
      ctx.fillStyle = p.coul; ctx.fillText(p.texte, W / 2, py);
      ctx.restore();
      decal += taille * 1.2;
    }
  }

  // --------------------------------------------------------------------------
  // Interface pendant la course
  // --------------------------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  const fmtTemps = (s) => { const m = Math.floor(s / 60); const r = s - m * 60; return t('temps', { m: String(m), s: (r < 10 ? '0' : '') + r.toFixed(1) }); };
  function majHud() {
    const c = course;
    if (!c) return;
    $('hud-place').textContent = t('hud.place', { p: t('place.' + c.place), n: c.rivaux.length + 1 });
    $('hud-tour').textContent = t('hud.tour', { a: Math.min(c.N.tours, c.tour + 1), b: c.N.tours });
    $('hud-temps').textContent = fmtTemps(c.temps);
    $('hud-vitesse').textContent = t('hud.kmh', { v: Math.round(c.v / VMAX * 210) });
    $('j-aspi').style.display = c.index + 1 >= ASPI_DEPUIS ? '' : 'none';
    $('j-aspi-i').style.width = Math.round(c.aspi * 100) + '%';
    const pn = c.index + 1 >= PNEUS_DEPUIS;
    $('j-pneus').style.display = pn ? '' : 'none';
    $('j-pneus-i').style.width = Math.round((1 - c.usure) * 100) + '%';
    $('j-pneus').classList.toggle('alerte', pn && (c.glisse > 0.12 || c.usure > 0.7));
    const mains = $('mains');
    mains.classList.toggle('vues', c.temps < 6 && c.index < 2 && etat !== 'fin');
    $('main-g').classList.toggle('appui', entree.g || entree.clavierG);
    $('main-d').classList.toggle('appui', entree.d || entree.clavierD);
  }

  // --------------------------------------------------------------------------
  // Écrans
  // --------------------------------------------------------------------------
  const ECRANS = ['ecran-titre', 'ecran-niveaux', 'ecran-garage', 'ecran-intro', 'ecran-pause', 'ecran-fin', 'ecran-bilan'];
  function ouvrir(id) {
    for (const e of ECRANS) $(e).classList.toggle('ouvert', e === id);
    $('hud').classList.toggle('ouvert', id === null || id === 'ecran-pause');
  }

  function montrerTitre() {
    etat = 'titre';
    enPartie = false;
    course = nouvelleCourse(0);
    course.v = VMAX * 0.55; bot = false; etat = 'titre';
    for (const r of course.rivaux) r.v = VMAX * 0.5;
    $('total-etoiles').textContent = t('titre.total', { n: totalEtoiles(), total: NIVEAUX.length * 3 });
    ouvrir('ecran-titre');
    arreterMoteur();
  }

  function montrerNiveaux() {
    const liste = $('liste-niveaux');
    liste.textContent = '';
    const groupes = ['cote', 'desert', 'montagne', 'ville'];
    for (let g = 0; g < 4; g++) {
      const titre = document.createElement('div');
      titre.className = 'groupe';
      titre.textContent = t('circuit.' + groupes[g]);
      liste.appendChild(titre);
      const grille = document.createElement('div');
      grille.className = 'grille';
      for (let k = 0; k < 5; k++) {
        const i = g * 5 + k;
        const b = document.createElement('button');
        b.className = 'case';
        const ouvert = i + 1 <= prog.debloque;
        if (!ouvert) b.classList.add('ferme');
        if (i + 1 === prog.debloque) b.classList.add('actuelle');
        const num = document.createElement('span'); num.textContent = ouvert ? String(i + 1) : '🔒';
        const et = document.createElement('span'); et.className = 'et';
        for (let s = 0; s < 3; s++) { const e = document.createElement(s < prog.etoiles[i] ? 'b' : 'span'); e.textContent = '★'; et.appendChild(e); }
        b.append(num, et);
        b.setAttribute('aria-label', ouvert ? t('aria.course', { n: i + 1, e: prog.etoiles[i] }) : t('aria.fermee', { n: i + 1 }));
        if (ouvert) b.addEventListener('click', () => { son('clic'); preparerCourse(i); });
        grille.appendChild(b);
      }
      liste.appendChild(grille);
    }
    ouvrir('ecran-niveaux');
  }

  // ---- Garage
  let onglet = 'moto';
  function montrerGarage() { ouvrir('ecran-garage'); majGarage(); }
  function majGarage() {
    document.querySelectorAll('.onglet').forEach((b) => b.classList.toggle('actif', b.dataset.onglet === onglet));
    const liste = onglet === 'moto' ? MOTOS : onglet === 'casque' ? CASQUES : COMBIS;
    const choisi = prog[onglet];
    const box = $('objets');
    box.textContent = '';
    const total = totalEtoiles();
    for (const o of liste) {
      const b = document.createElement('button');
      b.className = 'objet';
      const ouvert = total >= o.ouvre;
      if (!ouvert) b.classList.add('ferme');
      if (o.id === choisi) b.classList.add('choisi');
      const p = document.createElement('span'); p.className = 'pastille'; p.style.background = 'linear-gradient(90deg,' + o.coul + ' 60%,' + o.coul2 + ' 60%)';
      const nom = document.createElement('span'); nom.textContent = ouvert ? t(onglet + '.' + o.id) : t('garage.ferme', { n: o.ouvre });
      b.append(p, nom);
      if (ouvert) b.addEventListener('click', () => { prog[onglet] = o.id; son('clic'); sauverOptions(); majGarage(); });
      box.appendChild(b);
    }
    const stats = $('stats');
    stats.textContent = '';
    if (onglet === 'moto') {
      const m = MOTOS[prog.moto - 1];
      for (const [cle, v] of [['stat.vitesse', (m.top - 0.95) / 0.15], ['stat.reprise', (m.acc - 0.95) / 0.2], ['stat.adherence', (m.grip - 0.95) / 0.15]]) {
        const l = document.createElement('span'); l.textContent = t(cle);
        const bar = document.createElement('div'); bar.className = 'barre'; const i = document.createElement('i'); i.style.width = Math.round(clamp(v, 0.1, 1) * 100) + '%'; bar.appendChild(i);
        stats.append(l, bar);
      }
    }
    dessinerApercuGarage();
  }
  function dessinerApercuGarage() {
    const c2 = $('apercu-garage');
    const g = c2.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, c2.width, c2.height);
    dessinerAvec(g, () => {
      dessinerMoto(c2.width * 0.33, c2.height * 0.9, c2.height * 0.72, -0.25, lookJoueur(), false, 0, false);
      dessinerMoto(c2.width * 0.7, c2.height * 0.9, c2.height * 0.72, 0.45, lookJoueur(), false, 0, false);
    });
  }
  // Dessiner sur un autre canevas (petits aperçus) avec les mêmes fonctions
  function dessinerAvec(autre, f) {
    const garde = ctx;
    ctx = autre;
    try { f(); } finally { ctx = garde; }
  }
  function sauverOptions() { if (enPartie) sauver(niveauCourant + 1); else sauverHorsPartie(); }
  // Hors partie, on ne garde que les choix (sans toucher au niveau de reprise)
  function sauverHorsPartie() {
    if (apercu) return;
    try {
      // seulement si une sauvegarde existe déjà : le niveau de reprise n'est jamais touché ici
      if (!window.JEL_SAVE || !window.JEL_SAVE.existe(JEU)) return;
      window.JEL_SAVE.save(JEU, { equip: { moto: prog.moto, casque: prog.casque, combi: prog.combi }, options: { son: prog.son } });
    } catch (e) { /* sans stockage */ }
  }

  // ---- Présentation d'une course (et animation de sa nouveauté)
  let animIntro = null;
  function preparerCourse(index, sansSauver) {
    niveauCourant = index;
    enPartie = true;
    bot = false;
    course = nouvelleCourse(index);
    etat = 'intro';
    const N = NIVEAUX[index];
    const nouveau = !prog.vus[N.mec];
    $('intro-nouveau').style.display = nouveau ? '' : 'none';
    $('intro-titre').textContent = t('course.titre', { n: index + 1, nom: t('course.' + (index + 1)) });
    const infos = $('intro-infos');
    infos.textContent = '';
    const ajouterInfo = (txt) => { const d = document.createElement('div'); d.className = 'info'; d.textContent = txt; infos.appendChild(d); };
    ajouterInfo(t('circuit.' + N.c));
    ajouterInfo(t('intro.tours', { n: N.tours }));
    ajouterInfo(N.obj === 1 ? t('obj.premier') : t('obj.top', { n: N.obj }));
    ajouterInfo(t('intro.parfaits', { n: N.cible }));
    $('intro-touches').textContent = t('intro.touches');
    animIntro = { mec: N.mec, t0: performance.now() };
    ouvrir('ecran-intro');
    if (!sansSauver) sauver(index + 1);
  }
  function partir() {
    const N = NIVEAUX[niveauCourant];
    prog.vus[N.mec] = 1;
    animIntro = null;
    son('clic');
    etat = 'depart';
    course.depart = 3.6;
    ouvrir(null);
    demarrerMoteur();
  }

  // Textes de l'animation : chaque nouveauté a jusqu'à 3 étapes
  const ETAPES = {
    pencher: 3, parfait: 2, aspiration: 2, epingle: 2, finaleCote: 1, chicane: 2, sable: 2, pneus: 2, melangeDesert: 1, finaleDesert: 1,
    pluie: 2, pluieEpingle: 1, pluiePneus: 1, flaques: 2, finaleMontagne: 1, nuit: 2, nuitChicane: 1, nuitPluie: 1, toutVille: 1, grandeFinale: 1,
  };
  function dessinerIntro(now) {
    if (!animIntro) return;
    const c2 = $('anim-intro');
    const g = c2.getContext('2d');
    const Wc = c2.width, Hc = c2.height;
    const tps = (now - animIntro.t0) / 1000;
    const mec = animIntro.mec;
    const nEt = ETAPES[mec] || 1;
    const etape = Math.floor(tps / 2.4) % nEt;
    const k = (tps % 2.4) / 2.4;
    const leg = $('legende-intro');
    const txt = t('mec.' + mec + '.' + (etape + 1));
    if (leg.textContent !== txt) leg.textContent = txt;
    dessinerAvec(g, () => {
      g.setTransform(1, 0, 0, 1, 0, 0);
      animMecanique(g, Wc, Hc, mec, etape, k, tps);
    });
  }

  // Petites scènes animées des nouveautés
  function animMecanique(C, Wc, Hc, mec, etape, k, tps) {
    const N = NIVEAUX[niveauCourant];
    const env = CIRCUITS[N.c];
    // fond : ciel et sol
    const gr = C.createLinearGradient(0, 0, 0, Hc);
    gr.addColorStop(0, N.nuit ? '#0b1430' : env.ciel[0]); gr.addColorStop(0.45, N.nuit ? '#1c2a5a' : env.ciel[2]); gr.addColorStop(0.46, env.herbe[0]); gr.addColorStop(1, env.herbe[1]);
    C.fillStyle = gr; C.fillRect(0, 0, Wc, Hc);
    const hor = Hc * 0.45;
    // route en perspective qui tourne
    const famille = ({ pencher: 'v', parfait: 'v', aspiration: 'a', epingle: 'e', finaleCote: 'v', chicane: 'c', sable: 's', pneus: 'p', melangeDesert: 'c', finaleDesert: 'e', pluie: 'r', pluieEpingle: 'e', pluiePneus: 'p', flaques: 'f', finaleMontagne: 'e', nuit: 'n', nuitChicane: 'c', nuitPluie: 'r', toutVille: 'n', grandeFinale: 'v' })[mec] || 'v';
    let courbe = 0;
    if (famille === 'v' || famille === 'r' || famille === 'n' || famille === 'p') courbe = 1;
    if (famille === 'e') courbe = 2;
    if (famille === 'c') courbe = Math.sin(tps * 2.2) * 1.4;
    const route = (C2) => {
      for (let i = 0; i < 40; i++) {
        const z1 = i / 40, z2 = (i + 1) / 40;

  // ---- Fin de course
  function montrerFin() {
    const c = course;
    const N = c.N;
    const i = c.index;
    const gagne = c.place <= N.obj;
    arreterMoteur();
    let etoiles = 0;
    const raisons = [];
    if (gagne) {
      etoiles = 1 + (c.place === 1 ? 1 : 0) + (c.parfaits >= N.cible ? 1 : 0);
    }
    raisons.push([gagne, N.obj === 1 ? t('obj.premier') : t('obj.top', { n: N.obj })]);
    raisons.push([gagne && c.place === 1, t('raison.premier')]);
    raisons.push([gagne && c.parfaits >= N.cible, t('raison.parfaits', { n: N.cible })]);
    const ancienTotal = totalEtoiles();
    const recordAvant = prog.records[i];
    let nouveauRecord = false;
    const points = Math.round(Math.max(0, (N.rivaux + 2 - c.place)) * 100 + c.parfaits * 50 + c.depassements * 20 + (gagne ? 200 : 0));
    if (gagne) {
      scoreCumul += points;
      if (etoiles > prog.etoiles[i]) prog.etoiles[i] = etoiles;
      if (!recordAvant || c.temps < recordAvant) { prog.records[i] = Math.round(c.temps * 10) / 10; nouveauRecord = true; }
      prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2));
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
      sauver(Math.min(NIVEAUX.length, i + 2));
      if (tousGagnes()) { if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 }); }
    } else {
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: i + 1 });
      sauver(i + 1);
    }
    $('fin-titre').textContent = gagne ? t(c.place === 1 ? 'fin.premier' : 'fin.gagne') : t('fin.perdu');
    const lignes = $('fin-lignes');
    lignes.textContent = '';
    const ligne = (txt, cls) => { const p = document.createElement('p'); p.textContent = txt; if (cls) p.className = cls; lignes.appendChild(p); };
    ligne(t('fin.place', { p: t('place.' + c.place), n: N.rivaux + 1 }));
    ligne(t('fin.temps', { t: fmtTemps(c.temps) }));
    if (c.meilleurTour) ligne(t('fin.meilleurTour', { t: fmtTemps(c.meilleurTour) }));
    if (i + 1 >= PARFAIT_DEPUIS) ligne(t('fin.parfaits', { n: c.parfaits }));
    ligne(t('fin.points', { n: points }));
    if (nouveauRecord) ligne(t('fin.record'), 'record');
    else if (recordAvant) ligne(t('fin.recordAncien', { t: fmtTemps(recordAvant) }));
    const rs = $('fin-raisons');

    // objets débloqués
    const deb = $('fin-debloque');
    deb.textContent = '';
    const total = totalEtoiles();
    for (const [liste, cle] of [[MOTOS, 'moto'], [CASQUES, 'casque'], [COMBIS, 'combi']]) for (const o of liste) if (o.ouvre > ancienTotal && o.ouvre <= total) {
      const d = document.createElement('div'); d.className = 'debloque'; d.textContent = t('fin.debloque', { nom: t(cle + '.' + o.id) }); deb.appendChild(d);

    for (let k = 0; k < etoiles; k++) setTimeout(() => { spans[k].classList.add('on'); son('etoile'); }, 350 + k * 380);

    else bP.textContent = t('btn.reessayer');

      son('clic');
      if (!gagne) preparerCourse(i);

  }

  function montrerBilan() {
    $('bilan-texte').textContent = t('bilan.texte', { n: totalEtoiles(), total: NIVEAUX.length * 3 });
    const c2 = $('bilan-coupe');
    const g = c2.getContext('2d');

  // ---- Pause

  // --------------------------------------------------------------------------
  // Sons (Web Audio, aucun fichier)
  // --------------------------------------------------------------------------
  let audio = null, moteur = null, bruit = null;
  function initAudio() {
    if (audio || apercu || window.JEL_AFFICHE) return;
    try {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      const n = audio.sampleRate;
      bruit = audio.createBuffer(1, n, n);
      const d = bruit.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { audio = null; }
  }
  function ton(freq, duree, type, vol, glisse, delai) {
    if (!audio || !prog.son) return;
    const t0 = audio.currentTime + (delai || 0);
    const o = audio.createOscillator(); const g = audio.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
    if (glisse) o.frequency.exponentialRampToValueAtTime(glisse, t0 + duree);
    g.gain.setValueAtTime(vol || 0.08, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + duree);

  }
  function souffle(duree, vol, filtre, delai) {
    if (!audio || !prog.son || !bruit) return;
    const t0 = audio.currentTime + (delai || 0);
    const s = audio.createBufferSource(); s.buffer = bruit;
    const f = audio.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = filtre || 800;
    const g = audio.createGain(); g.gain.setValueAtTime(vol || 0.15, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + duree);
    s.connect(f); f.connect(g); g.connect(audio.destination); s.start(t0); s.stop(t0 + duree + 0.02);
  }
  function son(nom) {
    if (!audio || !prog.son) return;
    switch (nom) {
      case 'clic': ton(660, 0.06, 'triangle', 0.06); break;
      case 'bip': ton(440, 0.25, 'square', 0.07); break;
      case 'partez': ton(880, 0.5, 'square', 0.08); break;
      case 'paille': souffle(0.35, 0.3, 400); ton(160, 0.3, 'sine', 0.15, 70); ton(220, 0.12, 'triangle', 0.06, 330, 0.25); break;
      case 'toc': ton(120, 0.12, 'square', 0.08, 80); souffle(0.1, 0.12, 1500); break;
      case 'double': ton(700, 0.08, 'triangle', 0.07); ton(1050, 0.12, 'triangle', 0.07, null, 0.07); break;
      case 'aspi': souffle(0.6, 0.12, 2400); break;
      case 'parfait': [784, 988, 1175, 1568].forEach((f, k) => ton(f, 0.16, 'triangle', 0.08, null, k * 0.07)); break;
      case 'tour': ton(523, 0.12, 'square', 0.06); ton(784, 0.2, 'square', 0.06, null, 0.12); break;
      case 'victoire': [523, 659, 784, 1047, 784, 1047].forEach((f, k) => ton(f, 0.2, 'square', 0.06, null, k * 0.13)); break;
      case 'rate': [392, 330, 262].forEach((f, k) => ton(f, 0.3, 'triangle', 0.08, null, k * 0.2)); break;
      case 'etoile': ton(1320, 0.18, 'triangle', 0.07, 1760); break;
      case 'genou': souffle(0.12, 0.05, 3200); break;

  }
  function demarrerMoteur() {

      o1.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = 0.0;

  function sonMoteur(sp) {
    if (!moteur || !audio) return;
    const now = audio.currentTime;
    const f = 55 + sp * 150 + (course.chute ? -20 : 0);
    moteur.o1.frequency.setTargetAtTime(f, now, 0.05);
    moteur.o2.frequency.setTargetAtTime(f * 0.5, now, 0.05);

  function majEntreePointeurs() {
    let g = false, d = false;

  cv.addEventListener('pointerdown', (e) => {
