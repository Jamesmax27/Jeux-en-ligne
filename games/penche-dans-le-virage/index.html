    sauverOptions();
  });

  JEL_SAVE_FERMETURE();
  function JEL_SAVE_FERMETURE() {
    if (!window.JEL_SAVE) return;
    window.JEL_SAVE.surFermeture(() => { if (enPartie && !apercu) window.JEL_SAVE.save(JEU, donneesSauvegarde(niveauCourant + 1)); });
  }

  if (I18N && I18N.surChangement) I18N.surChangement(() => { if (etat === 'titre') montrerTitre(); if ($('ecran-garage').classList.contains('ouvert')) majGarage(); });

  // --------------------------------------------------------------------------
  // Boucle principale
  // --------------------------------------------------------------------------
  let dernier = 0;
  let fige = false;
  function boucle(now) {
    const dt = Math.min(0.05, (now - (dernier || now)) / 1000);
    dernier = now;
    if (course && !fige && etat !== 'pause' && etat !== 'resultat' && etat !== 'intro') {
      let reste = dt;
      while (reste > 0) { const pas = Math.min(reste, 1 / 60); maj(pas); reste -= pas; }
    } else if (course && etat === 'intro') {
      // la course attend : décor immobile
    }
    dessiner();
    if (etat === 'course' || etat === 'depart' || etat === 'fin' || etat === 'pause') majHud();
    if (etat === 'intro') dessinerIntro(now);
    requestAnimationFrame(boucle);
  }

  // --------------------------------------------------------------------------
  // Affiche (jaquette) : avec window.JEL_AFFICHE, posé par le robot du site
  // --------------------------------------------------------------------------
  function dessinerAffiche() {
    document.querySelectorAll('jel-langue, .jel-langue').forEach((el) => { el.style.display = 'none'; });
    for (const e of ECRANS) $(e).classList.remove('ouvert');
    $('hud').classList.remove('ouvert');
    document.querySelector('.coin-haut-droit').style.display = 'none';
    if (!course) course = nouvelleCourse(0);
    const c = course;
    // placer la moto à l'entrée d'un virage à droite, avec un rival juste derrière (vu devant)
    let i0 = 0;
    for (const s of c.piste.segs) if (s.curve > 2.5) { i0 = s.i; break; }
    c.dist = (i0 - 6) * SEG + PLAYERZ * 0.0; c.x = 0.35; c.v = VMAX * 0.9; c.lean = 0.95; etat = 'course';
    c.rivaux.forEach((r, k) => { r.dist = c.dist + SEG * (8 + k * 7); r.x = k % 2 ? 0.45 : -0.2; r.lean = 0.7; });
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    dessinerScene(c, { sansJoueur: true });
    // lumière du soleil couchant derrière le héros
    const g = ctx.createRadialGradient(W * 0.55, H * 0.36, 10, W * 0.55, H * 0.36, H * 0.55);
    g.addColorStop(0, 'rgba(255,214,120,.65)'); g.addColorStop(1, 'rgba(255,214,120,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // traits de vitesse
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3;
    for (let k = 0; k < 18; k++) { const a = (k / 18) * Math.PI * 2; const r0 = H * 0.32, r1 = H * 0.62; ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(a) * r0, H * 0.5 + Math.sin(a) * r0 * 0.8); ctx.lineTo(W / 2 + Math.cos(a) * r1, H * 0.5 + Math.sin(a) * r1 * 0.8); ctx.stroke(); }
    // héros en grand, couché dans le virage
    const taille = Math.min(H * 0.52, W * 0.7);
    const u = taille / 100;
    const hx = W * 0.5 - 32 * u, hy = H * 0.74;
    ctx.save(); ctx.shadowColor = 'rgba(255,240,200,.9)'; ctx.shadowBlur = 24;
    dessinerMoto(hx, hy, taille, 0.92, lookJoueur(), false, 0, false);
    ctx.restore();
    // gerbe d'étincelles qui part du genou, posé au sol, vers l'arrière
    const kx = hx + 54 * u, ky = hy - 2 * u;
    const lueur = ctx.createRadialGradient(kx, ky, 2, kx, ky, 30 * u);
    lueur.addColorStop(0, 'rgba(255,230,120,.95)'); lueur.addColorStop(1, 'rgba(255,150,40,0)');
    ctx.fillStyle = lueur; ctx.beginPath(); ctx.arc(kx, ky, 30 * u, 0, Math.PI * 2); ctx.fill();
    for (let k = 0; k < 90; k++) {
      const ang = Math.PI * (0.35 + Math.random() * 0.55);
      const d = Math.random() * 45 * u;
      ctx.fillStyle = k % 3 ? '#ffe680' : '#ff8a1a';
      ctx.fillRect(kx + Math.cos(ang) * d * 1.3, ky + Math.sin(ang) * d * 0.5, 3 + Math.random() * 5, 3);
    }
    // bottes de paille au premier plan
    for (const [bx, by, bw] of [[W * 0.02, H * 0.82, W * 0.3], [W * 0.75, H * 0.85, W * 0.3]]) {
      ctx.fillStyle = '#e2b448'; ctx.fillRect(bx, by, bw, H * 0.16);
      ctx.fillStyle = '#c8962e'; ctx.fillRect(bx, by + H * 0.06, bw, H * 0.02); ctx.fillRect(bx, by + H * 0.11, bw, H * 0.02);
      ctx.fillStyle = '#f3d27a'; ctx.fillRect(bx, by, bw, H * 0.025);
    }
  }

  // --------------------------------------------------------------------------
  // Images du jeu : avec window.JEL_APERCU = 1, 2 ou 3 (posé par le robot du site)
  // --------------------------------------------------------------------------
  function ouvrirApercu(n) {
    const plan = { 1: { niv: 0, avance: 0.22, place: 3 }, 2: { niv: 7, avance: 0.45, place: 2 }, 3: { niv: 17, avance: 0.6, place: 3 } }[n] || { niv: 0, avance: 0.2 };
    niveauCourant = plan.niv;
    course = nouvelleCourse(plan.niv);
    if (n === 3) { prog.moto = 4; prog.casque = 6; prog.combi = 3; course.moto = MOTOS[3]; }
    if (n === 2) { prog.moto = 2; prog.casque = 3; course.moto = MOTOS[1]; }
    const c = course;
    const N = c.N;
    // avancer jusqu'à l'entrée d'un virage, au bon tour
    const segs = c.piste.segs;
    const depart = Math.floor(segs.length * plan.avance);
    let i0 = depart;
    for (let k = depart; k < segs.length; k++) if (Math.abs(segs[k].curve) > 2.6) { i0 = k + 4; break; }
    const tour = n === 1 ? 0 : 1;
    c.tour = tour;
    c.dist = tour * c.piste.len + i0 * SEG + PLAYERZ;
    c.temps = tour * 34 + plan.avance * 30 + 3.4;
    c.debutTour = tour * 34;
    c.v = VMAX * 0.82; c.x = Math.sign(segs[i0].curve) * 0.45; c.lean = Math.sign(segs[i0].curve) * 0.78;
    c.usure = n === 2 ? 0.42 : n === 3 ? 0.55 : 0;
    c.aspi = n === 2 ? 0.7 : 0;
    // rivaux autour : certains devant, d'autres derrière
    const devant = (plan.place || 3) - 1;
    c.rivaux.forEach((r, k) => {
      if (k < devant) { r.dist = c.dist + SEG * (5 + k * 9); r.x = k % 2 ? -0.3 : (n === 2 ? c.x : 0.2); }
      else r.dist = c.dist - SEG * (8 + k * 6);
      r.v = VMAX * 0.8; r.lean = segs[i0].curve * 0.15;
    });
    if (n === 2) { c.rivaux[0].dist = c.dist + SEG * 6; c.rivaux[0].x = c.x; }
    c.place = (plan.place || 3);
    etat = 'course';
    enPartie = false;
    ouvrir(null);
    document.querySelector('.coin-haut-droit').style.display = '';
    // quelques images de vie, puis on fige
    for (let k = 0; k < 20; k++) { c.genou = 1; particule(W / 2 + Math.sign(c.lean) * UX * 0.36, HOR + UY * 0.98, 'etincelle'); }
    c.popups = [];
    if (n === 1) popup(t('pop.double'), '#ffffff');
    if (n === 3) { c.parfaits = 6; popup(t('pop.parfait'), '#ffd34d', true); for (let k = 0; k < 24; k++) particule(W / 2, HOR + UY * 0.7, 'or'); }
    fige = true;
    majHud();
    $('mains').classList.remove('vues');
  }

  // --------------------------------------------------------------------------
  // Démarrage
  // --------------------------------------------------------------------------
  window.addEventListener('resize', redim);
  chargerProgression();
  redim();
  majBoutonSon();
  if (window.JEL_AFFICHE) { dessinerAffiche(); return; }
  if (window.JEL_APERCU) { ouvrirApercu(apercu); requestAnimationFrame(boucle); return; }
  montrerTitre();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
