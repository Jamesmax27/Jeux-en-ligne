  </div>
</div>

<!-- Salon d'attente (en ligne) : avant chaque manche, le premier joueur arrivé lance la partie -->
<div id="voile-salon" class="voile">
  <div class="carte" role="dialog" aria-modal="true" aria-labelledby="salon-titre">
    <h2 id="salon-titre"></h2>
    <div id="salon-resultat">
      <p id="salon-resultat-titre"></p>
      <div id="salon-classement"></div>
    </div>
    <div id="salon-places"></div>
    <p id="salon-message" aria-live="polite"></p>
    <button id="btn-lancer" class="btn vert" type="button" data-multi="lancer"></button>
    <p id="salon-compte"></p>
    <button id="btn-salon-quitter" class="btn" type="button" data-i18n="bouton.quitter"></button>
  </div>
</div>

<canvas id="confettis" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // =====================================================================
  //  Les Enclos de la ferme — jeu de stratégie « points et cases »
  //  On pose des clôtures à tour de rôle ; qui ferme un enclos y met son
  //  animal et rejoue. Solo : 20 niveaux contre 3 robots. En ligne : de
  //  vrais joueurs remplacent les robots (moteur commun JEL_MULTI).
  //  Les règles (et les terrains) sont dans le bloc jel-regles.
  // =====================================================================

  const JEU = 'enclos-de-la-ferme';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = R.terrains;               // mêmes données que les règles
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);

  // Une couleur et un animal par place : 0 mouton, 1 cochon, 2 poule, 3 vache.
  const COUL = ['#2f6fe0', '#e0508c', '#e8a400', '#1d8a55'];
  const COUL_F = ['#163d8f', '#8c1f4f', '#7a4f00', '#0d4f30'];
  const COUL_T = ['#cddcfb', '#fbd2e2', '#fbe9ac', '#c4ead3'];   // fond pastel d'un enclos gagné

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#fff"/><circle cx="10.4" cy="8" r="1.6" fill="#fff"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#fff"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';

  // Tutoriels : petite démonstration animée (terrain miniature, clôtures déjà
  // là, puis gestes joués un par un ; place 0 = toi, avec la main).
  const TUTOS = {
    base: { g: ['..'], deja: [['h0,0', 1], ['h0,1', 2], ['v0,0', 3], ['h1,0', 1], ['h1,1', 2]], etapes: [['v0,1', 0], ['v0,2', 0]] },
    piege: { g: ['..'], deja: [['h0,0', 1], ['v0,0', 2], ['h0,1', 3]], etapes: [['h1,0', 0], ['v0,1', 1]] },
    rocher: { g: ['.#', '~.'], deja: [['h0,0', 1], ['v0,0', 2], ['h1,0', 3], ['h1,1', 1], ['v1,2', 2], ['h2,1', 3]], etapes: [['v0,1', 0], ['v1,1', 0]] },
    foin: { g: ['o.'], deja: [['h0,0', 1], ['v0,0', 2], ['h1,0', 3], ['h0,1', 1]], etapes: [['v0,1', 0]] },
    cloture: { g: ['..'], pre: ['h0,0', 'h0,1', 'v0,0'], deja: [], etapes: [['h1,1', 0], ['h1,0', 1], ['v0,1', 0], ['v0,2', 0]] },
    forme: { g: ['. ', '..'], deja: [['h0,0', 1], ['v0,0', 2], ['v0,1', 3], ['v1,0', 1], ['h2,0', 2], ['h2,1', 3], ['v1,2', 1], ['h1,1', 2]], etapes: [['v1,1', 0], ['h1,0', 0]] },
    trefle: { g: ['t.'], deja: [['h0,0', 1], ['v0,0', 2], ['h1,0', 3], ['h1,1', 1]], etapes: [['v0,1', 0]] },
    boue: { g: ['b.'], deja: [['h0,0', 1], ['v0,0', 2], ['h1,0', 3], ['h0,1', 1]], etapes: [['v0,1', 0], ['h1,1', 0], ['v0,2', 1]] }
  };

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = { etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, tutos: [], options: { son: true } };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 999, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string' && TUTOS[x]);
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
  }

  function sauver(niveauReprise, score) {
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
        debloque: prog.debloque, tutos: prog.tutos.slice(), options: { son: prog.options.son }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Le son se règle aussi depuis l'écran titre : jamais de nouvelle sauvegarde là.
  function sauverSon() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: prog.options.son } }); } catch (e) { /* rien */ }
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      const v = o.vol || 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.025, d / 4));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.vibrato) {
        const l = ac.createOscillator(), lg = ac.createGain();
        l.frequency.value = o.vibrato; lg.gain.value = f * 0.05;
        l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + d + 0.05);
      }
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      osc.connect(g); sortie.connect(ac.destination);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  const sons = {
    clic: () => note(660, 0.06, { type: 'triangle', vol: 0.07 }),
    pose: () => { note(210, 0.07, { type: 'square', vol: 0.05, filtre: 900 }); note(120, 0.13, { type: 'triangle', vol: 0.12, retard: 0.01 }); },
    ferme: () => [523, 659, 784].forEach((f, i) => note(f, 0.14, { type: 'triangle', vol: 0.09, retard: i * 0.07 })),
    animal: (k) => {
      if (k === 0) note(440, 0.5, { type: 'sawtooth', vol: 0.045, vibrato: 11, filtre: 1600, vers: 400, retard: 0.22 });
      else if (k === 1) { note(150, 0.12, { type: 'square', vol: 0.05, filtre: 700, vers: 110, retard: 0.22 }); note(140, 0.14, { type: 'square', vol: 0.05, filtre: 700, vers: 100, retard: 0.38 }); }
      else if (k === 2) [0.22, 0.34, 0.46].forEach((r, i) => note(900 - i * 60, 0.08, { type: 'triangle', vol: 0.06, vers: 650, retard: r }));
      else note(170, 0.8, { type: 'sawtooth', vol: 0.06, filtre: 650, vers: 120, retard: 0.22 });
    },
    boue: () => { note(220, 0.3, { vol: 0.12, vers: 80 }); note(160, 0.2, { vol: 0.08, vers: 70, retard: 0.15 }); },
    victoire: () => [523, 659, 784, 1047].forEach((f, i) => note(f, 0.26, { type: 'triangle', vol: 0.11, retard: i * 0.13 })),
    defaite: () => [392, 330, 262].forEach((f, i) => note(f, 0.3, { vol: 0.11, retard: i * 0.18 })),
    tic: () => note(1250, 0.04, { type: 'square', vol: 0.035 }),
    arrive: () => { note(660, 0.12, { vol: 0.09 }); note(880, 0.16, { vol: 0.09, retard: 0.1 }); },
    part: () => { note(880, 0.12, { vol: 0.07 }); note(587, 0.16, { vol: 0.07, retard: 0.1 }); },
    tour: () => note(988, 0.1, { vol: 0.06 }),
    non: () => note(180, 0.12, { type: 'triangle', vol: 0.06 })
  };

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.textContent = prog.options.son ? '🔊' : '🔇';
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    sauverSon();
    majBoutonsSon();
    sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Dessins (canvas) : outils, animaux, décor
  // ---------------------------------------------------------------------

  function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }
  function rond(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r);
    else { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  }
  function oeil(c, x, y, r) {
    c.fillStyle = '#fff'; rond(c, x, y, r); c.fill();
    c.fillStyle = '#1b1b1b'; rond(c, x + r * 0.15, y + r * 0.1, r * 0.58); c.fill();
    c.fillStyle = '#fff'; rond(c, x + r * 0.35, y - r * 0.18, r * 0.22); c.fill();
  }
  // Hasard fixe pour le décor (même dessin à chaque fois).
  function graineHasard(g) { let a = g >>> 0; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; }

  // Visage d'un animal, centré en (x, y), rayon r (dessiné dans une boîte de 100).
  function visage(c, k, x, y, r) {
    c.save(); c.translate(x, y); c.scale(r / 50, r / 50);
    c.lineWidth = 3; c.lineJoin = 'round';
    if (k === 0) { // mouton : tête sombre dans une couronne de laine
      c.fillStyle = '#fbf8f1'; c.strokeStyle = '#cfc6b5';
      for (let j = 0; j < 10; j++) { const a = j / 10 * Math.PI * 2; rond(c, Math.cos(a) * 30, Math.sin(a) * 27 - 4, 16); c.fill(); c.stroke(); }
      rond(c, 0, -4, 31); c.fill();
      c.fillStyle = '#4a3f3c';
      ell(c, -37, 2, 15, 7, 0.35); c.fill(); ell(c, 37, 2, 15, 7, -0.35); c.fill();
      ell(c, 0, 8, 21, 28); c.fill();
      c.fillStyle = '#fbf8f1'; [[-10, -20], [0, -26], [10, -20]].forEach((p) => { rond(c, p[0], p[1], 10); c.fill(); });
      oeil(c, -9, 4, 6); oeil(c, 9, 4, 6);
      c.fillStyle = '#e9a0a8'; ell(c, 0, 25, 7, 4); c.fill();
    } else if (k === 1) { // cochon : tout rond et rose, avec son groin
      c.fillStyle = '#f4a3bf'; c.strokeStyle = '#c86f92';
      c.beginPath(); c.moveTo(-36, -18); c.lineTo(-32, -48); c.lineTo(-10, -34); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(36, -18); c.lineTo(32, -48); c.lineTo(10, -34); c.closePath(); c.fill(); c.stroke();
      rond(c, 0, 2, 40); c.fill(); c.stroke();
      oeil(c, -15, -9, 6); oeil(c, 15, -9, 6);
      c.fillStyle = '#ee86ab'; ell(c, 0, 16, 19, 13); c.fill(); c.stroke();
      c.fillStyle = '#9c3d63'; ell(c, -6, 16, 3.5, 5); c.fill(); ell(c, 6, 16, 3.5, 5); c.fill();
      c.fillStyle = 'rgba(255,110,150,.45)'; rond(c, -27, 10, 6); c.fill(); rond(c, 27, 10, 6); c.fill();
    } else if (k === 2) { // poule : crête rouge, bec jaune
      c.fillStyle = '#e23b2e'; [[-11, -35], [0, -42], [11, -35]].forEach((p) => { rond(c, p[0], p[1], 10); c.fill(); });
      c.fillStyle = '#d8893a'; c.strokeStyle = '#9c5a1e'; rond(c, 0, 2, 36); c.fill(); c.stroke();
      c.fillStyle = '#eaa95c'; ell(c, 0, 22, 22, 12); c.fill();
      oeil(c, -13, -6, 6); oeil(c, 13, -6, 6);
      c.fillStyle = '#f6c21c'; c.strokeStyle = '#b8860b';
      c.beginPath(); c.moveTo(-10, 3); c.lineTo(10, 3); c.lineTo(0, 20); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#e23b2e'; ell(c, 0, 27, 5, 8); c.fill();
    } else { // vache : cornes, taches noires, museau rose
      c.fillStyle = '#efe3c6'; c.strokeStyle = '#a08f6a';
      c.beginPath(); c.moveTo(-20, -30); c.quadraticCurveTo(-40, -36, -38, -52); c.quadraticCurveTo(-28, -42, -12, -37); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(20, -30); c.quadraticCurveTo(40, -36, 38, -52); c.quadraticCurveTo(28, -42, 12, -37); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#2b2b2b'; ell(c, -38, -12, 14, 8, 0.4); c.fill(); ell(c, 38, -12, 14, 8, -0.4); c.fill();
      c.fillStyle = '#fbfaf6'; c.strokeStyle = '#9b9b93'; ell(c, 0, -2, 31, 40); c.fill(); c.stroke();
      c.fillStyle = '#2b2b2b'; ell(c, -13, -15, 13, 15, 0.3); c.fill(); ell(c, 15, -30, 8, 6, 0); c.fill();
      oeil(c, -13, -10, 6); oeil(c, 13, -10, 6);
      c.fillStyle = '#f3b2ad'; c.strokeStyle = '#c98680'; ell(c, 0, 22, 24, 15); c.fill(); c.stroke();
      c.fillStyle = '#8c4a45'; ell(c, -8, 22, 3.5, 5); c.fill(); ell(c, 8, 22, 3.5, 5); c.fill();
    }
    c.restore();
  }

  // Médaillon : disque de la couleur de la place + visage de l'animal.
  function medaillon(c, k, x, y, r) {
    c.fillStyle = COUL[k]; rond(c, x, y, r); c.fill();
    c.lineWidth = Math.max(1.5, r * 0.12); c.strokeStyle = '#fff'; rond(c, x, y, r * 0.94); c.stroke();
    visage(c, k, x, y + r * 0.04, r * 0.7);
  }

    else if (ch === 't') trefle(c, x, y, k, t);
    else if (ch === 'b') boue(c, x, y, k, t);
  }

  function poteau(c, x, y, s) {
    const r = Math.max(4, s * 0.085);
    c.fillStyle = '#8a5a2b'; c.strokeStyle = '#4a2e12'; c.lineWidth = 1.5; rond(c, x, y, r); c.fill(); c.stroke();
    c.fillStyle = '#c08a52'; rond(c, x - r * 0.2, y - r * 0.25, r * 0.45); c.fill();
  }

  // Une clôture posée (p = longueur, de 0 à 1, pour l'animation).
  function cloture(c, x1, y1, x2, y2, s, qui, p) {
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const ax = mx + (x1 - mx) * p, ay = my + (y1 - my) * p, bx = mx + (x2 - mx) * p, by = my + (y2 - my) * p;
    const ep = Math.max(5, s * 0.12);
    c.lineCap = 'round';
    c.strokeStyle = qui === 9 ? '#5e3b17' : COUL_F[qui]; c.lineWidth = ep + 3;
    c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke();
    c.strokeStyle = qui === 9 ? '#b07a42' : COUL[qui]; c.lineWidth = ep;
    c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke();
    const hz = Math.abs(y1 - y2) < 0.5;
    c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = Math.max(1.5, ep * 0.25);
    c.beginPath(); c.moveTo(ax + (hz ? 0 : -ep * 0.2), ay + (hz ? -ep * 0.2 : 0)); c.lineTo(bx + (hz ? 0 : -ep * 0.2), by + (hz ? -ep * 0.2 : 0)); c.stroke();
  }

  function segXY(e, g, a) {
    const p = O.segment(e, a);
    return [g.ox + p[1] * g.s, g.oy + p[0] * g.s, g.ox + p[3] * g.s, g.oy + p[2] * g.s];
  }

  // opt : t (temps), survol, curseur, couleur (place du joueur), anims, lueur, pointilles
  function dessinerPlateau(c, e, g, opt) {
    const s = g.s, t = opt.t || 0, W = e.W, H = e.H;
    const anims = opt.anims || { aretes: {}, cases: {} };
    // ombre du pré
    c.fillStyle = 'rgba(80,50,10,.18)';
    for (let i = 0; i < W * H; i++) if (e.c.charAt(i) !== ' ') c.fillRect(g.ox + (i % W) * s + 4, g.oy + Math.floor(i / W) * s + 6, s, s);
    for (let i = 0; i < W * H; i++) {
      const ch = e.c.charAt(i);
      if (ch === ' ') continue;
      herbe(c, g.ox + (i % W) * s, g.oy + Math.floor(i / W) * s, s, i);
    }
    for (let i = 0; i < W * H; i++) {
      const ch = e.c.charAt(i);
      if (ch === ' ') continue;
      const r = Math.floor(i / W), col = i % W, x = g.ox + col * s, y = g.oy + r * s, cx = x + s / 2, cy = y + s / 2;
      if (ch === '#') { rocher(c, x, y, s, i); continue; }
      if (ch === '~') { mare(c, e, x, y, s, r, col, t); continue; }
      const qui = e.o[i];
      if (qui >= 0 && qui < PLACES) {
        c.fillStyle = COUL_T[qui]; c.fillRect(x, y, s + 0.6, s + 0.6);
        if (ch !== '.') objet(c, ch, x + s * 0.78, y + s * 0.78, s * 0.14, t);
        const t0 = anims.cases[i];
        let k = 1;
        if (t0 !== undefined) {
          const p = Math.min(1, (t - t0) / 450);
          k = p < 1 ? 1 + 0.6 * Math.sin(p * Math.PI) * (1 - p) + (p < 0.3 ? (p / 0.3) - 1 : 0) : 1;
          k = Math.max(0.05, k);
        }
        medaillon(c, qui, cx, cy, s * 0.31 * k);
      } else {
        if (ch !== '.') objet(c, ch, cx, cy, s * 0.3, t);
        if (qui === -1 && opt.lueur !== false && O.poses(e.f, e, i) === 3) {
          const a = 0.35 + 0.3 * Math.sin(t / 220);
          c.strokeStyle = 'rgba(255,240,120,' + a.toFixed(2) + ')'; c.lineWidth = Math.max(3, s * 0.08);
          rr(c, x + s * 0.12, y + s * 0.12, s * 0.76, s * 0.76, s * 0.12); c.stroke();
        }
      }
    }
    // clôtures libres : pointillés
    if (opt.pointilles !== false) {
      c.save();
      c.setLineDash([Math.max(2, s * 0.05), Math.max(4, s * 0.09)]);
      c.lineCap = 'round'; c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = Math.max(2, s * 0.035);
      for (let a = 0; a < e.f.length; a++) {
        if (e.f[a] !== -1) continue;
        const p = segXY(e, g, a);
        c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(p[2], p[3]); c.stroke();
      }
      c.restore();
    }
    // clôture visée (doigt, souris ou clavier)
    [opt.survol, opt.curseur].forEach((a, k) => {
      if (a === undefined || a < 0 || e.f[a] !== -1) return;
      const p = segXY(e, g, a);
      c.lineCap = 'round';
      if (k === 1) {
        c.strokeStyle = 'rgba(255,255,255,' + (0.6 + 0.4 * Math.sin(t / 150)).toFixed(2) + ')'; c.lineWidth = Math.max(10, s * 0.22);
        c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(p[2], p[3]); c.stroke();
      }
      c.strokeStyle = opt.couleur >= 0 ? COUL[opt.couleur] : '#ffffff';
      c.globalAlpha = 0.6; c.lineWidth = Math.max(6, s * 0.13);
      c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(p[2], p[3]); c.stroke();
      c.globalAlpha = 1;
    });
    // clôtures posées
    for (let a = 0; a < e.f.length; a++) {
      const qui = e.f[a];
      if (qui < 0) continue;
      const p = segXY(e, g, a);
      const t0 = anims.aretes[a];
      const k = t0 === undefined ? 1 : Math.min(1, Math.max(0.05, (t - t0) / 220));
      cloture(c, p[0], p[1], p[2], p[3], s, qui, k);
      if (a === e.der && opt.dernier !== false && t0 !== undefined && t - t0 < 1400) {
        c.strokeStyle = 'rgba(255,255,255,' + (0.7 * (1 - (t - t0) / 1400)).toFixed(2) + ')'; c.lineWidth = Math.max(10, s * 0.24);
        c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(p[2], p[3]); c.stroke();
      }
    }
    // piquets
    const vus = {};
    for (let a = 0; a < e.f.length; a++) {
      if (e.f[a] === -2) continue;
      const q = O.segment(e, a);
      [[q[0], q[1]], [q[2], q[3]]].forEach((pt) => {
        const cle = pt[0] * (W + 1) + pt[1];
        if (vus[cle]) return;
        vus[cle] = true;
        poteau(c, g.ox + pt[1] * s, g.oy + pt[0] * s, s);
      });
    }
  }

  function geometrie(e, w, h, marge) {
    const s = Math.min((w - 2 * marge) / e.W, (h - 2 * marge) / e.H, 118);
    return { s: s, ox: (w - s * e.W) / 2, oy: (h - s * e.H) / 2 };
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#3a2a14'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (parcours de 20 niveaux) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // partie solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché
  let rejoue = false;
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)
  let geo = null;
  let survol = -1, curseur = -1, clavier = false;
  let dernierAttends = 0;
  let anims = { aretes: {}, cases: {} };
  const particules = [];

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom !== 'jeu') dessinerTitre();
    if (nom === 'titre') majTitre();
    if (nom === 'jeu') relancerBoucle();
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    // Au-dessus d'une fenêtre (salon, fin) : en haut de l'écran, pour ne cacher aucun bouton.
    el.classList.toggle('haut', salonOuvert() || $('voile-fin').classList.contains('actif'));
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  // Cartes des 4 places, en haut de l'écran.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.width = 96; cv.height = 96;
      medaillon(cv.getContext('2d'), s, 48, 48, 46);
      const pts = document.createElement('span'); pts.className = 'pts';
      const tag = document.createElement('span'); tag.className = 'tag';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 26, 36, 24);
      d.append(cv, pts, tag, cour);
      boite.appendChild(d);
    }
    // Les mêmes places dans le salon d'attente.
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 112; cv.height = 112;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  // Le rôle d'une place : toi, un vrai joueur ou un robot.
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  function remplirTag(tag, role) {
    if (tag.dataset.role === role) return;
    tag.dataset.role = role;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = tr('place.' + role);
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const pts = e ? e.sc[s] : 0;
      d.querySelector('.pts').textContent = nb(pts);
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role);
      d.setAttribute('aria-label', tr('place.aria.' + role, { animal: tr('animal.' + s), points: pts }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) return rejoue ? tr('tour.rejoue') : tr('tour.toi');
    return tr('tour.' + s);
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  function majInterface() {
    majPlaces();
    majInfos();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    geo = geometrie(vue, w, h, Math.max(16, Math.min(w, h) * 0.05));
    const moi = partie ? partie.siege : -1;
    dessinerPlateau(c, vue, geo, {
      t: t, anims: anims, survol: partie && partie.monTour() ? survol : -1,
      curseur: clavier && partie && partie.monTour() ? curseur : -1, couleur: moi
    });
    // particules (étoiles, cœurs)
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      if (p.etoile) etincelle(c, p.x, p.y, p.k); else { rond(c, p.x, p.y, p.k * 0.5); c.fill(); }
      c.globalAlpha = 1;
    }
  }

  function jaillir(i, qui) {
    if (!vue || !geo) return;
    const x = geo.ox + (i % vue.W + 0.5) * geo.s, y = geo.oy + (Math.floor(i / vue.W) + 0.5) * geo.s;
    for (let k = 0; k < 14; k++) {
      const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 180;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 160, vie: 0.7 + Math.random() * 0.4, k: geo.s * (0.08 + Math.random() * 0.07), coul: k % 2 ? COUL[qui] : '#ffe066', etoile: k % 3 !== 0 });
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    anims = { aretes: {}, cases: {} };
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;           // heure du lancement automatique (ms)
  let resultatSalon = null;   // classement de la manche qui vient de finir
  let finEnAttente = false;   // fin de manche signalée, résultat pas encore montré
  let lancement = false;      // le chef a demandé le lancement

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;            // le résultat de la manche ouvrira le salon
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), cle = role + (info.chef ? '+chef' : '');
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44);
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role);
        d.setAttribute('aria-label', tr('salon.place.' + role, { animal: tr('animal.' + s) }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { animal: tr('animal.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;

  function surManche() {

    else enPartie = true;

  function surAction(ev) {
    const t = performance.now();

    anims.aretes[ev.action] = t;
    debutTour = Date.now();
    dernierTic = -1;

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;

  // ---------------------------------------------------------------------

  function etoilesPour(pts, total, gagne) {
    if (!gagne) return 0;
    const p = total ? pts / total : 0;
    return p >= 0.6 ? 3 : p >= 0.4 ? 2 : 1;
  }

    boite.textContent = '';

      const qui = document.createElement('span'); qui.className = 'qui';

  // Confettis de victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }

  // Parcours solo : niveau n contre 3 robots (force croissante, donnée par le terrain).

  // ---------------------------------------------------------------------
  //  Tutoriels animés
  // ---------------------------------------------------------------------

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const base = () => {
      const e = O.preparer({ g: d.g, pre: d.pre });
      e.sc = [0, 0, 0, 0];
      d.deja.forEach((p) => { const a = O.arete(e, p[0]); e.f[a] = p[1]; e.libres--; });
      return e;
    };
    let e = base(), debut = 0, fait = 0, an = { aretes: {}, cases: {} };
    const PAS = 1300, j = ++tutoAnim;
    const g = geometrie(e, 560, 360, 46);
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ecoule = t - debut;
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      if (k >= d.etapes.length + 2) { e = base(); fait = 0; an = { aretes: {}, cases: {} }; debut = t; }
      else if (k >= fait && fait < d.etapes.length && dans >= (d.etapes[fait][1] === 0 ? 720 : 380)) {
        const pa = d.etapes[fait], a = O.arete(e, pa[0]);
        const avant = e.o.slice();
        R.jouer(e, pa[1], a);
        an.aretes[a] = t;
        e.o.forEach((q, i) => { if (avant[i] === -1 && q >= 0) an.cases[i] = t; });
        fait++;
      }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 360);
      dessinerPlateau(c, e, g, { t: t, anims: an, lueur: true, couleur: 0 });
      // la main pour les gestes du joueur
      const k2 = Math.min(fait, d.etapes.length - 1);
      const prochaine = fait < d.etapes.length ? d.etapes[fait] : null;
      if (prochaine && prochaine[1] === 0) {
        const p = segXY(e, g, O.arete(e, prochaine[0]));
        const mx = (p[0] + p[2]) / 2, my = (p[1] + p[3]) / 2;
        const q = Math.min(1, dans / 650);
        const x = 470 + (mx - 470) * q, y = 330 + (my - 330) * q;
        main(c, x, y, 1.6, q >= 1 ? Math.min(1, (dans - 650) / 120) : 0);
      } else if (k2 >= 0 && d.etapes[k2] && d.etapes[k2][1] === 0 && fait > 0) {
        const p = segXY(e, g, O.arete(e, d.etapes[fait - 1][0]));
        main(c, (p[0] + p[2]) / 2, (p[1] + p[3]) / 2 + Math.min(40, dans / 10), 1.6, 0);
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function distSeg(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1, l = dx * dx + dy * dy;
    let k = l ? ((px - x1) * dx + (py - y1) * dy) / l : 0;
    k = Math.max(0, Math.min(1, k));
    return Math.hypot(px - (x1 + k * dx), py - (y1 + k * dy));
  }

  // Clôture libre la plus proche du doigt (zone large, au moins 44 px).
  function areteSous(px, py) {
    if (!vue || !geo) return -1;
    let best = -1, bd = Infinity;
    for (let a = 0; a < vue.f.length; a++) {
      if (vue.f[a] !== -1) continue;
      const p = segXY(vue, geo, a);
      const d = distSeg(px, py, p[0], p[1], p[2], p[3]);
      if (d < bd) { bd = d; best = a; }
    }
    return bd <= Math.max(26, geo.s * 0.5) ? best : -1;
  }

  function milieu(a) { const p = O.segment(vue, a); return [(p[1] + p[3]) / 2, (p[0] + p[2]) / 2]; }

  function plusProche(depuis) {
    if (!vue) return -1;
    const m = depuis >= 0 ? milieu(depuis) : [vue.W / 2, vue.H / 2];
    let best = -1, bd = Infinity;
    for (let a = 0; a < vue.f.length; a++) {
      if (vue.f[a] !== -1) continue;
      const q = milieu(a), d = Math.hypot(q[0] - m[0], q[1] - m[1]);
      if (d < bd) { bd = d; best = a; }
    }
    return best;
  }

  function deplacerCurseur(dx, dy) {
    if (!vue) return;
    if (curseur < 0 || vue.f[curseur] !== -1) { curseur = plusProche(curseur); return; }
    const m = milieu(curseur);
    let best = -1, bd = Infinity;
    for (let a = 0; a < vue.f.length; a++) {
      if (vue.f[a] !== -1 || a === curseur) continue;
      const q = milieu(a), vx = q[0] - m[0], vy = q[1] - m[1];
      const avance = vx * dx + vy * dy;
      if (avance <= 0.01) continue;
      const cote = Math.abs(vx * dy - vy * dx);
      const score = avance + cote * 2.2;
      if (score < bd) { bd = score; best = a; }
    }
    if (best >= 0) { curseur = best; sons.clic(); }
  }

  function poser(a) {
    if (!partie || enPause || attenteTuto || a < 0) return;
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (partie.jouer(a)) { survol = -1; }
  }

  const plateau = $('plateau');
  let appui = null;
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  plateau.addEventListener('pointerdown', (ev) => {
    audio();
    clavier = false;
    const p = point(ev);
    appui = { x: p[0], y: p[1], id: ev.pointerId };
    survol = areteSous(p[0], p[1]);
  });
  plateau.addEventListener('pointermove', (ev) => {
    const p = point(ev);
    if (appui || ev.pointerType === 'mouse') survol = areteSous(p[0], p[1]);
  });
  plateau.addEventListener('pointerup', (ev) => {
    const p = point(ev);
    const a = areteSous(p[0], p[1]);
    appui = null;
    if (ev.pointerType !== 'mouse') survol = -1;
    poser(a);
  });
  plateau.addEventListener('pointercancel', () => { appui = null; survol = -1; });
  plateau.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') survol = -1; });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) {
      ev.preventDefault(); audio();
      if (!clavier) { clavier = true; if (curseur < 0 || !vue || vue.f[curseur] !== -1) { curseur = plusProche(-1); return; } }
      deplacerCurseur(dirs[ev.code][0], dirs[ev.code][1]);
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (!clavier || curseur < 0) { clavier = true; curseur = plusProche(curseur); return; }
      poser(curseur);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
})();
</script>
</body>
</html>
