<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +

    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },

    selecteurs.forEach(function (s) { s.maj(); });

  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).

    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);

    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }

        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {

      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

    try { texte = JSON.stringify(tout); } catch (e) { return false; }

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }

  }

  function texte(cle, vars) {

  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>
  :root {
    --creme: #fff6e3; --creme2: #ffe9c2; --brun: #6b3f1d; --brun2: #9a5b2b;

  .btn.principal { background: var(--orange); color: #fff; font-size: 24px; padding: 14px 40px; min-height: 60px;
    box-shadow: 0 5px 0 var(--orange2); text-shadow: 0 1px 0 rgba(0,0,0,.2); }

  /* Écran titre */

  /* Écrans de liste */
  .ecran.liste { background: linear-gradient(#fff3dc, #f7dcae); padding: 10px 12px 14px; }
  .ecran.liste h2 { margin: 0; font-size: 22px; flex: 1; text-align: center; }

  .groupe-cuisine::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--teinte, var(--orange)); }
  .grille-niveaux { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }

    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 800; font-size: 20px; padding: 4px; }

  .case-niveau.ferme svg.cadenas { width: 22px; height: 22px; }
  .grille-livre { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .page-livre { background: #fffaf0; border-radius: 14px; box-shadow: var(--ombre); padding: 8px; text-align: center; border: 2px solid #f0d9ae; }
  .page-livre canvas { width: 100%; height: auto; display: block; }

  .page-livre.ferme { opacity: .55; }
  .grille-tresors { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .carte-tresor { border: 3px solid transparent; border-radius: 14px; background: #fff; box-shadow: var(--ombre); padding: 8px; text-align: center; min-height: 44px; }
  .carte-tresor canvas { width: 100%; height: auto; display: block; }

  .carte-tresor.choisi { border-color: var(--vert); }
  .carte-tresor.ferme { background: #eedfc4; cursor: default; }

  /* Écran de jeu */
  #ecran-jeu { background: #f3dfb8; }
  #hud { width: 100%; display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: rgba(255, 246, 227, .92);
    box-shadow: 0 2px 6px rgba(107, 63, 29, .2); z-index: 2; flex: none; }
  .hud-centre { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .hud-ligne { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  #hud-niveau { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #vies { display: flex; gap: 2px; }
  #vies svg { width: 22px; height: 18px; }
  #vies svg.perdu { opacity: .25; }
  .jauge { height: 12px; border-radius: 8px; background: #e7cfa6; overflow: hidden; }
  #jauge-feu { height: 100%; width: 100%; border-radius: 8px; background: linear-gradient(90deg, #ff6a2b, #ffc23b); transition: background .3s; }
  #jauge-feu.bas { background: linear-gradient(90deg, #d9302a, #ff6a2b); animation: clignote .5s infinite alternate; }
  @keyframes clignote { to { opacity: .55; } }
  #btn-indice svg { width: 28px; height: 28px; }
  #zone { position: relative; flex: 1; width: 100%; min-height: 0; }
  #jeu-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

  /* Calques (pause, tutoriel, fin) */
  .calque { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10;
    background: rgba(70, 40, 15, .55); padding: 14px; }
  .calque.visible { display: flex; }
  .carte { background: var(--creme); border-radius: 22px; box-shadow: 0 8px 0 rgba(107,63,29,.35); padding: 16px 16px 18px;
    width: min(94vw, 420px); max-height: 96%; overflow-y: auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .carte h2 { margin: 0; font-size: 26px; color: var(--orange2); }
  .carte p { margin: 0; font-size: 16px; }
  .carte .btn { width: 100%; }
  .boutons-col { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 6px; }
  #tuto-canvas, #fin-bol { width: 260px; max-width: 100%; height: auto; }
  #tuto-texte { font-weight: 600; min-height: 3em; }
  .points { display: flex; gap: 6px; }

  #fin-etoiles { display: flex; gap: 8px; justify-content: center; }

  #fin-score { font-size: 22px; font-weight: 800; }

</style>

<body>
<div id="app">
  <!-- Écran titre -->
  <section id="ecran-titre" class="ecran visible">
    <div class="barre-haut">
      <span id="lang-titre" class="place-langue"></span>
      <button class="rond bouton-son" type="button" data-i18n-aria="aria.son"></button>
    </div>
    <h1 data-i18n="titre"></h1>
    <canvas id="titre-canvas" width="440" height="330"></canvas>
    <p class="consigne" data-i18n="consigne"></p>
    <button id="btn-jouer" class="btn principal" type="button" data-i18n="btn.jouer"></button>
    <div class="rangee">
      <button id="btn-niveaux" class="btn" type="button" data-i18n="btn.niveaux"></button>
      <button id="btn-livre" class="btn" type="button" data-i18n="btn.livre"></button>
      <button id="btn-tresors" class="btn" type="button" data-i18n="btn.tresors"></button>
    </div>
  </section>

  <!-- Choix des niveaux -->
  <section id="ecran-niveaux" class="ecran liste">
    <div class="entete">
      <button class="rond retour" type="button" data-i18n-aria="btn.retour"></button>
      <h2 data-i18n="niveaux.titre"></h2>
      <span class="espace"></span>
    </div>
    <div class="defile" id="liste-niveaux"></div>
  </section>

  <!-- Livre de recettes -->
  <section id="ecran-livre" class="ecran liste">
    <div class="entete">
      <button class="rond retour" type="button" data-i18n-aria="btn.retour"></button>
      <h2 data-i18n="livre.titre"></h2>
      <span class="espace"></span>
    </div>
    <p class="sous-titre" id="livre-compte"></p>
    <div class="defile"><div class="grille-livre" id="liste-livre"></div></div>
  </section>

  <!-- Trésors -->
  <section id="ecran-tresors" class="ecran liste">
    <div class="entete">
      <button class="rond retour" type="button" data-i18n-aria="btn.retour"></button>
      <h2 data-i18n="tresors.titre"></h2>
      <span class="espace"></span>
    </div>
    <p class="sous-titre" id="tresors-compte"></p>
    <div class="defile" id="liste-tresors"></div>
  </section>

  <!-- Jeu -->
  <section id="ecran-jeu" class="ecran">
    <div id="hud">
      <button id="btn-pause" class="rond" type="button" data-i18n-aria="aria.pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#6b3f1d"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#6b3f1d"/></svg>
      </button>
      <div class="hud-centre">
        <div class="hud-ligne"><span id="hud-niveau"></span><span id="vies" role="img"></span></div>
        <div class="jauge" role="img" data-i18n-aria="aria.feu"><div id="jauge-feu"></div></div>
      </div>
      <button id="btn-indice" class="rond" type="button" data-i18n-aria="aria.indice">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6" fill="#cfe9ff" stroke="#6b3f1d" stroke-width="2.4"/><path d="M14.5 14.5 20 20" stroke="#6b3f1d" stroke-width="3" stroke-linecap="round"/><circle cx="8" cy="8" r="1.8" fill="#fff"/></svg>
      </button>
      <button class="rond bouton-son" type="button" data-i18n-aria="aria.son"></button>
    </div>
    <div id="zone">
      <canvas id="jeu-canvas" role="img" data-i18n-aria="aria.marmite"></canvas>
      <div id="bandeau"></div>
    </div>
  </section>

  <!-- Pause -->
  <div id="calque-pause" class="calque">
    <div class="carte">
      <div class="pause-haut"><span id="lang-pause" class="place-langue"></span><button class="rond bouton-son" type="button" data-i18n-aria="aria.son"></button></div>
      <h2 data-i18n="pause.titre"></h2>
      <div class="boutons-col">
        <button id="pause-reprendre" class="btn principal" type="button" data-i18n="pause.reprendre"></button>
        <button id="pause-recommencer" class="btn" type="button" data-i18n="pause.recommencer"></button>
        <button id="pause-niveaux" class="btn" type="button" data-i18n="pause.niveaux"></button>
        <button id="pause-accueil" class="btn" type="button" data-i18n="btn.accueil"></button>
      </div>
    </div>
  </div>

  <!-- Tutoriel et nouvelles mécaniques -->
  <div id="calque-tuto" class="calque">
    <div class="carte">
      <h2 id="tuto-titre"></h2>
      <canvas id="tuto-canvas" width="520" height="340"></canvas>
      <p id="tuto-texte"></p>
      <div class="points" id="tuto-points"></div>
      <button id="tuto-ok" class="btn principal" type="button"></button>
    </div>
  </div>

  <!-- Fin de niveau -->
  <div id="calque-fin" class="calque">
    <div class="carte">
      <h2 id="fin-titre"></h2>
      <p id="fin-raison"></p>
      <canvas id="fin-bol" width="520" height="300"></canvas>
      <div id="fin-etoiles"></div>
      <p id="fin-score"></p>
      <p id="fin-record"></p>
      <p id="fin-recette"></p>
      <p id="fin-tresor"></p>
      <div class="boutons-col" id="fin-boutons"></div>
    </div>

    for (let rr = R - 30; rr >= 28 && rayons.length < 8; rr -= 56) rayons.push(rr);
    const places = [];
    if (!rayons.length || rayons[rayons.length - 1] >= 56) places.push({ anneau: 0, rr: 0, dec: 0 });
    rayons.reverse().forEach((rr, i) => {
      const k = i + 1, nbp = Math.max(3, Math.floor(TAU * rr / 62));
      for (let j = 0; j < nbp; j++) places.push({ anneau: k, rr, dec: j * TAU / nbp + k * .7 });
    });
    G = { W, H, dpr, Hr, R, cx, cy, places, anneaux: rayons.length };
  }

  // Position d'une place (le bouillon tourne).
  function positionPlace(i) {
    const p = G.places[i] || G.places[0];
    const a = etat.angles[p.anneau] + p.dec;
    return { x: etat.ox + G.cx + Math.cos(a) * p.rr, y: etat.oy + G.cy + Math.sin(a) * p.rr, a };
  }

  function nouvellePartie(n) {
    const cfg = NIVEAUX[n];
    const totalLettres = cfg.mots.reduce((s, m) => s + m.length, 0);
    const tempsMax = Math.round(20 + cfg.k * totalLettres + (cfg.memo ? cfg.memo * cfg.mots.length : 0));
    etat = {
      n, cfg, motIdx: 0, mot: cfg.mots[0], idx: 0, posees: 0, totalLettres, faites: 0,
      pates: [], angles: new Array(12).fill(0), temps: tempsMax, tempsMax, erreurs: 0, indices: 0, score: 0,
      phase: 'intro', enPause: false, horloge: 0, memoT: cfg.memo, indiceT: 0, vols: [], parts: [], flottants: [],
      humeur: 'ok', humeurT: 0, vapeurs: [], rafaleT: 7, rafale: 0, sel: null, inactif: 0, louche: null, secousse: 0,
      ox: 0, oy: 0, tic: 0, alerteFeu: false, attente: 0, verifT: 0
    };
    for (let i = 0; i < cfg.vapeur; i++) etat.vapeurs.push({ phi: i * Math.PI + .6, souffle: 0, alpha: 1 });
    remplirMarmite();
  }

  // Lettre (ou syllabe) attendue.
  const attendue = () => etat.mot[etat.idx];
  const estBonne = (p) => !p.poivre && etat.idx < etat.mot.length && etat.mot.startsWith(p.txt, etat.idx);

  // Contenu d'une nouvelle pâte (leurre ou bonne lettre).
  function contenuPate(bonne) {
    const cfg = etat.cfg, mot = etat.mot, i = etat.idx;
    const p = { txt: '', poivre: false, plonge: false, phase: Math.random() * TAU };
    if (bonne) {
      if (cfg.syll && i + 1 < mot.length && Math.random() < cfg.syll) p.txt = mot.substr(i, 2); else p.txt = mot[i];
    } else {
      const r = Math.random(), lettre = mot[i] || 'a';
      if (cfg.syll && r < cfg.syll * .5) {
        const j = Math.floor(Math.random() * Math.max(1, mot.length - 1));
        p.txt = mot.substr(j, 2);
        if (p.txt === mot.substr(i, 2) || p.txt.length < 2) p.txt = mot[j + 1] ? mot[j + 1] + mot[j] : choix(ALPHABET) + choix(ALPHABET);
      } else if (cfg.acc && r < .5 && CONFUS[lettre]) p.txt = choix(CONFUS[lettre]);
      else if (cfg.acc && r < .62) { const avec = mot.split('').filter((x) => CONFUS[x]); p.txt = avec.length ? choix(CONFUS[choix(avec)]) : choix(ALPHABET); }
      else if (r < .82) p.txt = choix(mot.split(''));
      else p.txt = choix(ALPHABET);
      if (Math.random() < cfg.poivre) { p.poivre = true; if (Math.random() < .5) p.txt = lettre; }
    }
    if (cfg.plonge && !p.poivre && Math.random() < cfg.plonge) p.plonge = true;
    return p;
  }
  function nouvellePate(place, bonne) {
    const p = Object.assign(contenuPate(bonne), { place, apparition: 0, tremble: 0, x: 0, y: 0, lueur: 0 });
    const pos = positionPlace(place); p.x = pos.x; p.y = pos.y;
    return p;
  }
  function remplirMarmite() {
    const nbPates = Math.min(G.places.length, etat.cfg.leurres + 3);
    const libres = G.places.map((_, i) => i).sort(() => Math.random() - .5);
    etat.pates = [];
    for (let k = 0; k < nbPates; k++) etat.pates.push(nouvellePate(libres[k], k < 2));
  }
  // Une pâte est-elle visible et pêchable ?
  function sousVapeur(p) {
    if (!etat.vapeurs.length) return false;
    const dx = p.x - etat.ox - G.cx, dy = p.y - etat.oy - G.cy, d = Math.hypot(dx, dy);
    if (d < G.R * .2) return false;
    const a = Math.atan2(dy, dx);
    return etat.vapeurs.some((v) => v.alpha > .5 && Math.abs(((a - v.phi) % TAU + TAU * 1.5) % TAU - Math.PI) < .62);
  }
  const sousLeau = (p) => p.plonge && Math.sin(p.phase) > .45;
  const peche = (p) => p.apparition > .6 && !sousLeau(p) && !sousVapeur(p);

  // Toujours au moins une (ou deux) bonne pâte dans la marmite.
  function assurer() {
    if (etat.idx >= etat.mot.length) return;
    const bonnes = etat.pates.filter(estBonne);
    const visibles = bonnes.filter(peche);
    const voulu = G.places.length > 8 ? 2 : 1;
    if (bonnes.length < voulu || (!visibles.length && Math.random() < .35)) {
      const cand = etat.pates.filter((p) => !estBonne(p) && p !== etat.sel && peche(p));
      const cible = cand.length ? choix(cand) : etat.pates.find((p) => !estBonne(p));
      if (cible) { Object.assign(cible, contenuPate(true), { apparition: 0, tremble: 0 }); cible.plonge = false; }
    }
  }
  function remplacer(p, bonne) { Object.assign(p, contenuPate(bonne), { apparition: 0, tremble: 0, lueur: 0 }); }

  // ----------------------------------------------------------------------
  // Déroulement d'un niveau
  // ----------------------------------------------------------------------
  function lancerNiveau(n) {
    afficherEcran('ecran-jeu');
    cacherCalques();
    mesurer();
    nouvellePartie(n);
    majHud();
    const cfg = NIVEAUX[n];
    const cartes = [];
    cfg.nouv.forEach((type) => { if (type === 'base') cartes.push(['base', 0], ['base', 1], ['base', 2]); else cartes.push([type, 0]); });
    montrerBandeau(t('intro.niveau', { n: n + 1, cuisine: t('cuisine.' + cfg.c) }), t('intro.mots', { n: cfg.mots.length }));
    if (cartes.length) { etat.phase = 'tuto'; ouvrirTuto(cartes, () => demarrer()); }
    else { etat.phase = 'intro'; etat.attente = 1.2; }
  }
  function demarrer() {
    if (!etat) return;
    etat.phase = 'jeu'; etat.memoT = etat.cfg.memo;
    cacherBandeau();
    if (etat.cfg.memo) flotter(t('jeu.memorise'), G.W / 2, G.Hr - 70, '#3b7dd8');
  }
  let bandeauT = null;
  function montrerBandeau(txt, sous) {
    const b = $('#bandeau'); b.textContent = txt;
    if (sous) { const s = document.createElement('small'); s.textContent = sous; b.appendChild(s); }
    b.classList.add('visible');
    clearTimeout(bandeauT); bandeauT = setTimeout(cacherBandeau, 1800);
  }
  function cacherBandeau() { $('#bandeau').classList.remove('visible'); }

  function flotter(txt, x, y, col) { etat.flottants.push({ txt, x, y, t: 0, col: col || '#6b3f1d' }); }
  function eclats(x, y, col, n) {
    for (let i = 0; i < (n || 10); i++) { const a = Math.random() * TAU, v = alea(60, 200); etat.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, t: 0, vie: alea(.5, .9), col: col || choix(['#f5c33b', '#ff8a3d', '#fff']), r: alea(2, 5) }); }
  }

  // Le joueur pêche une pâte.
  function pecher(p) {
    if (!etat || etat.phase !== 'jeu' || etat.enPause) return;
    etat.inactif = 0;
    if (!peche(p)) return;
    if (p.poivre) { eternuer(p); return; }
    if (estBonne(p)) {
      const debut = etat.idx, long = p.txt.length;
      etat.idx += long; etat.faites += long;
      etat.score += long > 1 ? 25 : 10;
      etat.louche = { x: p.x, y: p.y, t: 0 };
      const cases = casesMot();
      etat.vols.push({ txt: p.txt, x0: p.x, y0: p.y, cibles: cases.slice(debut, debut + long), t: 0, debut });
      son(long > 1 ? 'syllabe' : 'bon', debut);
      eclats(p.x, p.y, null, long > 1 ? 16 : 8);
      if (long > 1) flotter(t('jeu.syllabe'), p.x, p.y - 30, '#3fa34d');
      etat.humeur = 'content'; etat.humeurT = .8;
      if (etat.sel === p) etat.sel = null;
      remplacer(p, false);
      if (etat.idx >= etat.mot.length) etat.attente = .55; // mot fini après le vol des lettres
      else assurer();
    } else {
      etat.erreurs++; p.tremble = .5; etat.secousse = .3;
      son('faux'); flotter(t('jeu.oups'), p.x, p.y - 30, '#d9443a');
      etat.humeur = 'triste'; etat.humeurT = 1;
      majHud(); verifierDefaite();
    }
  }
  function eternuer(p) {
    etat.erreurs++;
    son('atchoum');
    etat.humeur = 'atchoum'; etat.humeurT = 1.1; etat.secousse = .5;
    flotter(t('jeu.atchoum'), G.W - 60, 40, '#d9443a');
    eclats(p.x, p.y, '#2a1a12', 18);
    remplacer(p, false);
    // Toute la soupe est mélangée : chaque pâte change de place.
    const places = etat.pates.map((q) => q.place).sort(() => Math.random() - .5);
    etat.pates.forEach((q, i) => { q.place = places[i]; });
    etat.angles = etat.angles.map((a) => a + alea(1, 3));
    if (etat.sel) etat.sel = null;
    majHud(); verifierDefaite(); assurer();
  }
  function verifierDefaite() { if (etat.erreurs >= etat.cfg.vies) defaite('erreurs'); }
  function indice() {
    if (!etat || etat.phase !== 'jeu' || etat.enPause) return;
    premierGeste = true;
    etat.indices++; etat.indiceT = 2.4; etat.inactif = 0;
    let p = etat.pates.find((q) => estBonne(q) && peche(q));
    if (!p) { const cand = etat.pates.filter((q) => peche(q)); p = cand.length ? choix(cand) : etat.pates[0]; if (p) { remplacer(p, true); p.plonge = false; p.apparition = 1; } }
    if (p) p.lueur = 2.4;
    son('indice');
  }
  function motTermine() {
    son('mot');
    const msg = t('jeu.bravo' + (1 + Math.floor(Math.random() * 4)));
    flotter(msg, G.W / 2, G.Hr - 30, '#3fa34d');
    const cases = casesMot(); cases.forEach((cs) => eclats(cs.x, cs.y, null, 3));
    etat.motIdx++;
    if (etat.motIdx >= etat.cfg.mots.length) { etat.phase = 'fin'; etat.attente = 0; setTimeout(victoire, 900); return; }
    etat.mot = etat.cfg.mots[etat.motIdx]; etat.idx = 0; etat.posees = 0; etat.memoT = etat.cfg.memo;
    // Nouvelles pâtes, pour les lettres du nouveau mot.
    etat.pates.forEach((p, i) => remplacer(p, i < 2));
    son('bulle');
  }

  function calculEtoiles() { const f = etat.erreurs + etat.indices; return f <= 1 ? 3 : f <= 3 ? 2 : 1; }

  function victoire() {
    if (!etat || etat.phase !== 'fin' || ecranActif !== 'ecran-jeu') return;
    const n = etat.n, et = calculEtoiles();
    const fautes = etat.erreurs + etat.indices;
    const bonus = Math.round(etat.temps * 2) + (fautes === 0 ? 50 : 0);
    etat.score += bonus;
    const avantEtoiles = totalEtoiles();
    const record = etat.score > prog.records[n];
    const premiere = prog.etoiles[n] === 0;
    if (record) prog.records[n] = etat.score;
    prog.etoiles[n] = Math.max(prog.etoiles[n], et);
    prog.niveau = Math.max(prog.niveau, Math.min(NIVEAUX.length, n + 2));
    sauver(Math.min(NIVEAUX.length, n + 2));
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
    // Jeu terminé (tous les niveaux gagnés au moins une fois, maintenant ou avant) :
    // total des meilleures étoiles de chaque niveau, gardées dans la sauvegarde.
    if (prog.etoiles.every((x) => x > 0)) {
      if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
    }
    // Trésors nouvellement débloqués
    const apres = totalEtoiles(), nouveaux = [];
    Object.keys(TRESORS).forEach((cat) => TRESORS[cat].forEach((s, i) => { if (s > avantEtoiles && s <= apres) nouveaux.push(t(cat + '.' + i)); }));
    son('victoire'); confettis();
    afficherFin(true, { et, score: etat.score, record, premiere, nouveaux, fautes });
  }
  function defaite(raison) {
    if (!etat || etat.phase === 'fin') return;
    etat.phase = 'fin';
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: etat.n + 1 });
    son('defaite');
    setTimeout(() => afficherFin(false, { raison, score: etat.score }), 700);
  }

  // ----------------------------------------------------------------------
  // Mise à jour (chaque image)
  // ----------------------------------------------------------------------
  function mettreAJour(dt) {
    const e = etat; if (!e) return;
    e.horloge += dt;
    if (e.humeurT > 0) { e.humeurT -= dt; if (e.humeurT <= 0) e.humeur = 'ok'; }
    if (e.secousse > 0) e.secousse -= dt;
    if (e.phase === 'intro') { e.attente -= dt; if (e.attente <= 0) demarrer(); }
    // Vitesse du bouillon (tourbillon : de plus en plus vite, avec des rafales)
    let v = e.cfg.v;
    if (e.cfg.tourb && e.phase === 'jeu') {
      v *= 1 + 1.3 * (e.faites / e.totalLettres);
      e.rafaleT -= dt;
      if (e.rafaleT <= 0) { e.rafale = 1.6; e.rafaleT = alea(7, 10); son('rafale'); flotter(t('jeu.rafale'), G.W / 2, G.cy - G.R - 4, '#1f5fa8'); }
    }
    if (e.rafale > 0) { e.rafale -= dt; v *= 2; }
    for (let k = 0; k <= G.anneaux; k++) e.angles[k] += dt * v * (1 - k * .08) * (k % 2 && e.cfg.tourb ? 1.15 : 1);
    // Tangage du bateau
    if (e.cfg.tang) { e.ox = Math.sin(e.horloge * .9) * G.R * .1; e.oy = Math.sin(e.horloge * 1.3) * 6; } else { e.ox = 0; e.oy = 0; }
    // Pâtes
    e.pates.forEach((p) => {
      const pos = positionPlace(p.place);
      const k = Math.min(1, dt * 7);
      p.x += (pos.x - p.x) * k; p.y += (pos.y - p.y) * k;
      if (p.apparition < 1) p.apparition = Math.min(1, p.apparition + dt * 2.5);
      if (p.tremble > 0) p.tremble -= dt;
      if (p.lueur > 0) p.lueur -= dt;
      if (p.plonge) p.phase += dt * 1.3;
    });
    // Vapeur
    e.vapeurs.forEach((va, i) => {
      va.phi += dt * (i % 2 ? -.18 : .14);
      if (va.souffle > 0) { va.souffle -= dt; va.alpha = Math.max(0, va.alpha - dt * 4); }
      else va.alpha = Math.min(1, va.alpha + dt * .9);
    });
    // Lettres qui volent vers leurs cases
    e.vols = e.vols.filter((vo) => {
      vo.t += dt / .45;
      if (vo.t >= 1) { e.posees = Math.max(e.posees, vo.debut + vo.txt.length); return false; }
      return true;
    });
    if (e.louche) { e.louche.t += dt * 2.5; if (e.louche.t >= 1) e.louche = null; }
    e.parts = e.parts.filter((pa) => { pa.t += dt; pa.x += pa.vx * dt; pa.y += pa.vy * dt; pa.vy += 300 * dt; return pa.t < pa.vie; });
    e.flottants = e.flottants.filter((f) => { f.t += dt; f.y -= 30 * dt; return f.t < 1.2; });
    if (e.phase !== 'jeu') return;
    // Mot fini
    if (e.attente > 0) { e.attente -= dt; if (e.attente <= 0 && e.idx >= e.mot.length) motTermine(); return; }
    if (e.memoT > 0) e.memoT -= dt;
    if (e.indiceT > 0) e.indiceT -= dt;
    e.inactif += dt;
    e.verifT -= dt; if (e.verifT <= 0) { e.verifT = 1; assurer(); }
    // Feu
    e.temps -= dt;
    if (e.temps <= 10) {
      if (!e.alerteFeu) { e.alerteFeu = true; flotter(t('jeu.feuBas'), G.W / 2, G.Hr + 20, '#d9443a'); }
      e.tic -= dt; if (e.tic <= 0) { e.tic = 1; son('tic'); }
    }
    if (e.temps <= 0) { e.temps = 0; majHud(); defaite('temps'); return; }
    majJauge();
  }

  // ----------------------------------------------------------------------
  // Dessin de la partie
  // ----------------------------------------------------------------------
  function casesMot() {
    const n = etat.mot.length;
    const larg = Math.min(44, (G.W - 24) / n - 5), haut = larg * 1.15, pas = larg + 5;
    const x0 = G.W / 2 - (pas * n - 5) / 2 + larg / 2, y = G.Hr - haut / 2 - 10;
    const l = [];
    for (let i = 0; i < n; i++) l.push({ x: x0 + i * pas, y, larg, haut });
    return l;
  }
  function dessiner() {
    const e = etat, c = ctx; if (!e || !G) return;
    c.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
    let sx = 0, sy = 0;
    if (e.secousse > 0) { sx = Math.sin(e.horloge * 70) * 5 * e.secousse; sy = Math.cos(e.horloge * 60) * 3 * e.secousse; }
    const cu = CUISINES[e.cfg.c];
    dessinerDecor(c, e.cfg.c, G.W, G.H, e.horloge, e.cfg.tang ? Math.sin(e.horloge * .9) : 0);
    c.save(); c.translate(sx, sy);

    // --- Recette (en haut)
    c.fillStyle = 'rgba(255,250,238,.92)';
    c.beginPath(); c.roundRect ? c.roundRect(6, 6, G.W - 12, G.Hr - 6, 18) : c.rect(6, 6, G.W - 12, G.Hr - 6); c.fill();
    c.strokeStyle = cu.teinte; c.lineWidth = 3; c.stroke();
    // Ingrédients de la recette (colonne de gauche)
    e.cfg.mots.forEach((m, i) => {
      const y = 28 + i * 36, x = 28;
      rond(c, x, y, 16, i === e.motIdx ? '#ffe2b8' : '#f3ead8');
      dessinerIngredient(c, m, x, y, 26);
      if (i < e.motIdx) { rond(c, x + 12, y + 10, 8, '#3fa34d'); trait(c, [x + 8, y + 10, x + 11, y + 13, x + 16, y + 7], '#fff', 2.5); }
    });
    // Grande image de l'ingrédient en cours
    const cases = casesMot();
    const P = Math.min(130, cases[0].y - cases[0].haut / 2 - 22, G.W - 180);
    const bob = Math.sin(e.horloge * 2) * 2;
    const yImg = 12 + (cases[0].y - cases[0].haut / 2 - 12) / 2;
    rond(c, G.W / 2, yImg, P / 2 + 4, '#fff');
    dessinerIngredient(c, e.mot, G.W / 2, yImg + bob, P * .95);
    // Cuisinier (à droite, toque comprise dans le cadre)
    const sc = Math.min(58, Math.max(40, P * .55));
    dessinerCuisinier(c, G.W - sc * .55 - 14, 18 + sc * 1.05, sc, e.humeur, e.horloge, prog.equip.toque);
    // Cases des lettres
    const montrerModele = !e.cfg.memo || e.memoT > 0;
    const alphaModele = e.cfg.memo ? Math.min(1, e.memoT) : 1;
    cases.forEach((cs, i) => {
      const remplie = i < e.posees;
      c.fillStyle = remplie ? '#fff0c8' : '#ffffff';
      c.beginPath(); c.roundRect ? c.roundRect(cs.x - cs.larg / 2, cs.y - cs.haut / 2, cs.larg, cs.haut, 9) : c.rect(cs.x - cs.larg / 2, cs.y - cs.haut / 2, cs.larg, cs.haut); c.fill();
      c.strokeStyle = i === e.idx && e.phase === 'jeu' ? cu.teinte : '#e0c79c'; c.lineWidth = i === e.idx ? 3 : 2; c.stroke();
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.font = '800 ' + Math.round(cs.larg * .7) + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      if (remplie) { c.fillStyle = '#8a4a16'; c.fillText(e.mot[i], cs.x, cs.y + 1); }
      else if (montrerModele) { c.fillStyle = 'rgba(138,74,22,' + (.28 * alphaModele) + ')'; c.fillText(e.mot[i], cs.x, cs.y + 1); }
      else if (i === e.idx && e.indiceT > 0) { c.fillStyle = 'rgba(59,125,216,' + Math.min(.8, e.indiceT) + ')'; c.fillText(e.mot[i], cs.x, cs.y + 1); }
    });

    // --- Marmite
    const cx = G.cx + e.ox, cy = G.cy + e.oy, R = G.R;
    c.save();
    if (e.cfg.tang) { c.translate(cx, cy); c.rotate(Math.sin(e.horloge * .9) * .04); c.translate(-cx, -cy); }
    ell(c, cx, cy + 10, R + 22, R + 16, 'rgba(70,40,15,.25)');
    rond(c, cx - R - 14, cy, 16, '#5d6b78'); rond(c, cx + R + 14, cy, 16, '#5d6b78');
    rond(c, cx - R - 14, cy, 8, '#3e4852'); rond(c, cx + R + 14, cy, 8, '#3e4852');
    const gm = c.createRadialGradient(cx - R * .3, cy - R * .3, R * .2, cx, cy, R + 16);
    gm.addColorStop(0, '#aab6c2'); gm.addColorStop(1, '#5d6b78');
    rond(c, cx, cy, R + 14, gm); rond(c, cx, cy, R + 4, '#3e4852');
    const gs = c.createRadialGradient(cx, cy, R * .1, cx, cy, R);
    gs.addColorStop(0, cu.soupe2); gs.addColorStop(1, cu.soupe);
    rond(c, cx, cy, R, gs);
    // Courant du bouillon
    c.strokeStyle = 'rgba(255,255,255,' + (e.rafale > 0 ? .5 : .22) + ')'; c.lineWidth = 3;

    const c = ttx; c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
    const s = Math.min(W / 440, H / 330);
    c.save(); c.translate(W / 2, H / 2); c.scale(s, s); c.translate(-220, -165);
    // Flammes sous la marmite
    for (let i = 0; i < 7; i++) { const fx = 120 + i * 33, h = 30 + Math.sin(titreT * 8 + i * 1.7) * 8; c.beginPath(); c.moveTo(fx - 14, 318); c.quadraticCurveTo(fx, 318 - h * 2, fx + 14, 318); c.fillStyle = i % 2 ? '#ffb02e' : '#ff6a2b'; c.fill(); }
    // Marmite
    ell(c, 220, 300, 150, 22, 'rgba(107,63,29,.3)');
    c.beginPath(); c.moveTo(80, 170); c.lineTo(92, 290); c.quadraticCurveTo(220, 320, 348, 290); c.lineTo(360, 170); c.closePath();
    const gm = c.createLinearGradient(80, 0, 360, 0); gm.addColorStop(0, '#5d6b78'); gm.addColorStop(.4, '#b5c1cc'); gm.addColorStop(1, '#4e5a66'); c.fillStyle = gm; c.fill();
    rond(c, 64, 200, 20, '#5d6b78'); rond(c, 376, 200, 20, '#5d6b78'); rond(c, 64, 200, 10, '#f7cf8f'); rond(c, 376, 200, 10, '#f7cf8f');
    ell(c, 220, 170, 142, 40, '#6b7783'); ell(c, 220, 170, 130, 32, '#f39a3c'); ell(c, 220, 164, 100, 20, '#ffc070');
    // Pâtes sans lettre qui tournent
    for (let i = 0; i < 10; i++) {
      const a = titreT * .6 + i * TAU / 10, rx = 60 + (i % 3) * 22, x = 220 + Math.cos(a) * rx, y = 170 + Math.sin(a) * rx * .26;
      dessinerPate(c, x, y, '', { echelle: .55, poivre: i === 4 });
    }
    // Vapeur
    for (let i = 0; i < 3; i++) { const ph = (titreT * .4 + i * .33) % 1; c.globalAlpha = .8 * (1 - ph); rond(c, 170 + i * 50 + Math.sin(titreT + i) * 8, 130 - ph * 90, 16 + ph * 14, '#fff'); }
    c.globalAlpha = 1;
    // Légumes qui sautent
    [['carotte', 70, 70], ['tomate', 370, 80], ['oignon', 120, 30], ['champignon', 320, 26], ['poivron', 210, 40]].forEach(([m, x, y], i) => {
      dessinerIngredient(c, m, x, y + Math.sin(titreT * 2.4 + i * 1.3) * 8, 56);
    });
    // Cuisinier et louche
    dessinerLouche(c, 372, 240, 40, -.5 + Math.sin(titreT * 2) * .15, prog.equip.louche);
    dessinerCuisinier(c, 52, 268, 64, 'content', titreT, prog.equip.toque);
    c.restore();
  }

  // ----------------------------------------------------------------------
  // Écrans de menu
  // ----------------------------------------------------------------------
  function afficherEcran(id) {
    $$('.ecran').forEach((e) => e.classList.toggle('visible', e.id === id));
    ecranActif = id;
  }
  function cacherCalques() { $$('.calque').forEach((c) => c.classList.remove('visible')); finBol = null; }
  function afficherTitre() { cacherCalques(); etat = null; afficherEcran('ecran-titre'); setTimeout(() => { try { $('#btn-jouer').focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30); }
  const SVG_CADENAS = '<svg class="cadenas" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2.5" fill="#a88a66"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#a88a66" stroke-width="2.6" fill="none"/></svg>';
  function afficherNiveaux() {
    cacherCalques(); etat = null;
    const zone = $('#liste-niveaux'); zone.innerHTML = '';
    for (let c = 0; c < 4; c++) {
      const h = document.createElement('div'); h.className = 'groupe-cuisine'; h.style.setProperty('--teinte', CUISINES[c].teinte); h.textContent = t('cuisine.' + c); zone.appendChild(h);
      const g = document.createElement('div'); g.className = 'grille-niveaux';
      for (let i = c * 5; i < c * 5 + 5; i++) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'case-niveau';
        if (debloque(i)) {
          const num = document.createElement('span'); num.textContent = nb(i + 1); b.appendChild(num);
          const et = document.createElement('span'); et.className = 'mini-etoiles';
          for (let k = 0; k < 3; k++) et.insertAdjacentHTML('beforeend', SVG_ETOILE(k < prog.etoiles[i]));
          b.appendChild(et);
          b.setAttribute('aria-label', t('aria.niveau', { n: i + 1 }));
          b.addEventListener('click', () => { premierGeste = true; son('toucher'); lancerNiveau(i); });
        } else {
          b.classList.add('ferme'); b.innerHTML = SVG_CADENAS; b.setAttribute('aria-label', t('aria.niveauFerme', { n: i + 1 })); b.disabled = true;
        }
        g.appendChild(b);
      }
      zone.appendChild(g);
    }
    afficherEcran('ecran-niveaux');
    setTimeout(() => { const b = zone.querySelector('.case-niveau:not(.ferme)'); try { b && b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30);
  }
  function afficherLivre() {
    cacherCalques();
    const zone = $('#liste-livre'); zone.innerHTML = '';
    let compte = 0;
    NIVEAUX.forEach((cfg, i) => {
      const fait = prog.etoiles[i] > 0; if (fait) compte++;
      const d = document.createElement('div'); d.className = 'page-livre' + (fait ? '' : ' ferme');
      const cv = document.createElement('canvas'); cv.width = 300; cv.height = 180; d.appendChild(cv);
      const c = cv.getContext('2d'); c.setTransform(2, 0, 0, 2, 0, 0);
      if (fait) {
        dessinerBol(c, 75, 58, 48, prog.equip.bol, CUISINES[cfg.c].soupe);
        cfg.mots.forEach((m, k) => dessinerIngredient(c, m, 75 + (k - (cfg.mots.length - 1) / 2) * 34, 36, 28));
      } else {
        dessinerBol(c, 75, 58, 48, 0, '#d8ccb8');
      }
      const nom = document.createElement('div'); nom.className = 'nom'; nom.textContent = fait ? t('soupe.' + (i + 1)) : t('livre.aDecouvrir'); d.appendChild(nom);
      const et = document.createElement('div'); et.className = 'mini-etoiles';
      if (fait) for (let k = 0; k < 3; k++) et.insertAdjacentHTML('beforeend', SVG_ETOILE(k < prog.etoiles[i]));
      Array.from(et.children).forEach((s) => { s.style.width = '18px'; s.style.height = '18px'; });
      d.appendChild(et);
      zone.appendChild(d);
    });
    $('#livre-compte').textContent = t('livre.compte', { n: compte });
    afficherEcran('ecran-livre');
  }
  function afficherTresors() {
    cacherCalques();
    const zone = $('#liste-tresors'); zone.innerHTML = '';
    const total = totalEtoiles();
    $('#tresors-compte').textContent = t('tresors.compte', { n: total });
    ['toque', 'louche', 'bol'].forEach((cat) => {
      const h = document.createElement('div'); h.className = 'groupe-cuisine'; h.textContent = t('categorie.' + cat); zone.appendChild(h);
      const g = document.createElement('div'); g.className = 'grille-tresors';
      TRESORS[cat].forEach((seuil, i) => {
        const ouvert = total >= seuil, choisi = prog.equip[cat] === i;
        const b = document.createElement('button'); b.type = 'button';
        b.className = 'carte-tresor' + (ouvert ? '' : ' ferme') + (choisi ? ' choisi' : '');
        const cv = document.createElement('canvas'); cv.width = 240; cv.height = 150; b.appendChild(cv);
        const c = cv.getContext('2d'); c.setTransform(2, 0, 0, 2, 0, 0);
        if (!ouvert) c.globalAlpha = .35;
        if (cat === 'toque') dessinerCuisinier(c, 60, 56, 38, 'content', 1, i);
        else if (cat === 'louche') dessinerLouche(c, 60, 52, 30, .9, i);
        else dessinerBol(c, 60, 42, 40, i, '#f39a3c');
        c.globalAlpha = 1;
        const nom = document.createElement('div'); nom.className = 'nom'; nom.textContent = t(cat + '.' + i); b.appendChild(nom);
        const st = document.createElement('div'); st.className = 'etat';
        st.textContent = !ouvert ? t('tresors.verrou', { n: seuil }) : choisi ? t('tresors.choisi') : t('tresors.choisir');
        b.appendChild(st);
        if (ouvert) b.addEventListener('click', () => {
          premierGeste = true; son('tresor'); prog.equip[cat] = i; ecrireLocal();
          try { if (JEL_SAVE.existe(JEU)) JEL_SAVE.save(JEU, { equip: prog.equip }); } catch (e) { /* rien */ }
          afficherTresors();
        }); else b.disabled = true;
        g.appendChild(b);
      });
      zone.appendChild(g);
    });
    afficherEcran('ecran-tresors');
  }

  // ----------------------------------------------------------------------
  // Pause
  // ----------------------------------------------------------------------
  function pause(oui) {
    if (!etat || ecranActif !== 'ecran-jeu') return;
    if (oui && (etat.phase === 'fin' || etat.phase === 'tuto')) return;
    etat.enPause = oui;
    $('#calque-pause').classList.toggle('visible', oui);
    if (oui) setTimeout(() => { try { $('#pause-reprendre').focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30);
  }

  // ----------------------------------------------------------------------
  // Entrées : toucher, souris, clavier
  // ----------------------------------------------------------------------
  canvas.addEventListener('pointerdown', (ev) => {
    premierGeste = true;
    if (!etat || etat.phase !== 'jeu' || etat.enPause) return;
    ev.preventDefault();
    const r = canvas.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    // Souffler la vapeur
    if (etat.vapeurs.length) {
      const dx = x - etat.ox - G.cx, dy = y - etat.oy - G.cy, d = Math.hypot(dx, dy);
      if (d > G.R * .2 && d < G.R + 10) {
        const a = Math.atan2(dy, dx);
        const v = etat.vapeurs.find((va) => va.alpha > .5 && Math.abs(((a - va.phi) % TAU + TAU * 1.5) % TAU - Math.PI) < .62);
        if (v) { v.souffle = 3.5; son('vapeur'); flotter(t('jeu.vapeur'), x, y - 20, '#3b7dd8'); etat.inactif = 0; return; }
      }
    }
    let meilleur = null, dmin = 34;
    etat.pates.forEach((p) => { const d = Math.hypot(p.x - x, (p.y - y) * (p.txt.length > 1 ? 1.2 : 1)); if (d < dmin && peche(p)) { dmin = d; meilleur = p; } });
    if (meilleur) pecher(meilleur);
  });
  // Pâtes visibles, rangées par angle (sélection au clavier).
  function patesVisibles() {
    return etat.pates.filter(peche).sort((a, b) => Math.atan2(a.y - G.cy, a.x - G.cx) - Math.atan2(b.y - G.cy, b.x - G.cx));
  }
  document.addEventListener('keydown', (e) => {
    if (document.getElementById('jel-sauvegarde')) return; // fenêtre de reprise ouverte
    premierGeste = true;
    const cle = e.key;
    if ($('#calque-tuto').classList.contains('visible')) {
      if (cle === 'Enter' || cle === ' ' || cle === 'Escape') { e.preventDefault(); suivantTuto(); }
      return;
    }
    if (ecranActif === 'ecran-jeu' && etat) {
      if (cle === 'Escape') { e.preventDefault(); if (etat.phase === 'jeu' || etat.phase === 'intro') pause(!etat.enPause); return; }
      if (etat.enPause || etat.phase !== 'jeu') return;
      if (cle === 'ArrowRight' || cle === 'ArrowDown' || cle === 'ArrowLeft' || cle === 'ArrowUp') {
        e.preventDefault();
        const l = patesVisibles(); if (!l.length) return;
        const i = l.indexOf(etat.sel), pas = cle === 'ArrowRight' || cle === 'ArrowDown' ? 1 : -1;
        etat.sel = l[i < 0 ? 0 : (i + pas + l.length) % l.length]; etat.inactif = 0; son('toucher');
        return;
      }
      if ((cle === 'Enter' || cle === ' ') && etat.sel) {
        if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
        e.preventDefault(); const p = etat.sel; if (peche(p)) pecher(p); else etat.sel = null; return;
      }
      if (cle.length === 1 && /\p{L}/u.test(cle) && !e.ctrlKey && !e.metaKey && !e.altKey) {
        const l = cle.toLocaleLowerCase('fr');
        const vis = etat.pates.filter((p) => peche(p) && p.txt === l);
        const p = vis.find((q) => !q.poivre) || vis[0];
        if (p) { e.preventDefault(); pecher(p); }
        else { const s = etat.pates.find((q) => peche(q) && q.txt[0] === l && estBonne(q)); if (s) { e.preventDefault(); pecher(s); } else son('faux'); }
      }
      return;
    }
    if (ecranActif === 'ecran-titre' && cle === 'Enter' && (!document.activeElement || document.activeElement === document.body)) { e.preventDefault(); $('#btn-jouer').click(); }
    if (cle === 'Escape' && ['ecran-niveaux', 'ecran-livre', 'ecran-tresors'].includes(ecranActif) && !document.querySelector('.calque.visible')) afficherTitre();
  });
  document.addEventListener('pointerdown', () => { premierGeste = true; }, { capture: true });
  document.addEventListener('visibilitychange', () => { if (document.hidden && etat && (etat.phase === 'jeu' || etat.phase === 'intro') && !etat.enPause) pause(true); });
  window.addEventListener('resize', () => {
    if (ecranActif !== 'ecran-jeu' || !etat) return;
    mesurer();
    etat.pates = etat.pates.filter((p) => p.place < G.places.length);
    assurer();
  });

  // Boutons
  $('#btn-jouer').addEventListener('click', () => {
    premierGeste = true; son('toucher');
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => {
        fusionner(d);
        const n = Math.max(1, Math.min(NIVEAUX.length, d.niveau | 0 || 1));
        prog.niveau = Math.max(prog.niveau, n);
        lancerNiveau(n - 1);
      },
      onNouvelle: () => { if (totalEtoiles() === 0) lancerNiveau(0); else afficherNiveaux(); },
      onEffacer: () => { viderProgression(); afficherTitre(); }
    });
  });
  $('#btn-niveaux').addEventListener('click', () => { premierGeste = true; son('toucher'); afficherNiveaux(); });
  $('#btn-livre').addEventListener('click', () => { premierGeste = true; son('toucher'); afficherLivre(); });
  $('#btn-tresors').addEventListener('click', () => { premierGeste = true; son('toucher'); afficherTresors(); });
  $$('.retour').forEach((b) => b.addEventListener('click', () => { son('toucher'); afficherTitre(); }));
  $$('.bouton-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('#btn-pause').addEventListener('click', () => { premierGeste = true; son('toucher'); pause(true); });
  $('#btn-indice').addEventListener('click', indice);
  $('#pause-reprendre').addEventListener('click', () => { pause(false); son('toucher'); });
  $('#pause-recommencer').addEventListener('click', () => { const n = etat.n; pause(false); son('toucher'); lancerNiveau(n); });
  $('#pause-niveaux').addEventListener('click', () => { pause(false); son('toucher'); afficherNiveaux(); });
  $('#pause-accueil').addEventListener('click', () => { pause(false); son('toucher'); afficherTitre(); });
  $('#tuto-ok').addEventListener('click', (e) => { e.stopPropagation(); suivantTuto(); });
  $('#calque-tuto').addEventListener('click', suivantTuto);
  $('#final-livre').addEventListener('click', () => { son('toucher'); afficherLivre(); });
  $('#final-rejouer').addEventListener('click', () => { son('toucher'); lancerNiveau(NIVEAUX.length - 1); });
  $('#final-niveaux').addEventListener('click', () => { son('toucher'); afficherNiveaux(); });

  // Fermeture de la page pendant une partie : on garde le niveau en cours.
  JEL_SAVE.surFermeture(() => {
    if (ecranActif === 'ecran-jeu' && etat && etat.phase !== 'fin') sauver(etat.n + 1);
  });

  // Changement de langue (jeu ouvert seul) : textes refaits.
  if (window.JEL_I18N && window.JEL_I18N.surChangement) window.JEL_I18N.surChangement(() => {
    if (ecranActif === 'ecran-niveaux') afficherNiveaux();
    else if (ecranActif === 'ecran-livre') afficherLivre();
    else if (ecranActif === 'ecran-tresors') afficherTresors();
    if (etat) majHud();
  });

  // Boucle d'animation
  let dernier = performance.now();
  function boucle(now) {
    const dt = Math.min(.05, (now - dernier) / 1000); dernier = now;
    try {
      if (ecranActif === 'ecran-titre') dessinerTitre(dt);
      if (ecranActif === 'ecran-jeu' && etat) {
        if (!etat.enPause && !tuto) mettreAJour(dt);
        dessiner();
      }
      dessinerTuto(dt);
      dessinerFin(dt);
      dessinerConfettis(dt);
    } finally {
      requestAnimationFrame(boucle);
    }
  }

  // Démarrage
  chargerProgression();
  majBoutonsSon();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
