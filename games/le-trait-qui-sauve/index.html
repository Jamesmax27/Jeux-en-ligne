  /* ---------------------------------------------------------------------------
     Partie
     ------------------------------------------------------------------------- */
  function lancerNiveau(i, garderBulle) {
    G.niv = borne(i, 0, NIVEAUX.length - 1);
    const def = NIVEAUX[G.niv];
    G.S = TS.nouveauNiveau(def, { encre: P.encre, hero: P.hero });
    G.S.morts.forEach((z, k) => { z.id = k; });
    // Laisse le décor se poser avant de rendre la main.
    for (let k = 0; k < 40; k++) TS.pas(G.S, TS.PAS);
    G.S.ev.length = 0;
    G.mode = 'jeu'; G.pause = false; G.trace = false; G.finProg = false; G.finT = 0; G.parts = []; G.secousse = 0; G.dernierTic = -1;
    G.aTrace = G.niv > 0 || vus.has('trait');
    montrer(null); montrerHud(true);
    $('hudNiv').textContent = tr('niveauN', { n: G.niv + 1 });
    G.cam = cameraPour(def.vue, null, G.S.survs);
    G.cam.bas = def.vide ? 300 * G.cam.s : 0;
    majSelecteurEncres();
    if (!garderBulle) cacherBulle();
    indice(tr(def.indice || 'hud.trace'));
    if (!garderBulle && !apercu) {
      const nouveau = def.nouveau;
      if (nouveau && (!vus.has(nouveau) || nouveau === 'trait')) montrerBulle(nouveau);
      else if (def.zones && !vus.has('zone')) montrerBulle('zone');
      else if (encreOuverte(1) && !vus.has('encres')) montrerBulle('encres');
    }
    majHud();
  }

  function finirTrait() {
    if (!G.trace) return;
    G.trace = false; grattageFin();
    const S = G.S;
    if (!TS.solidifier(S)) { indice(tr('hud.court'), true, 1.8); son('bloque'); return; }
    G.aTrace = true;
    if (G.niv === 0) marquerVu('trait');
    cacherBulle();
    indice(tr('hud.tiens'), false, 1.6);
    $('encres').classList.add('cache');
    G.derniereGrogne = 0;
  }

  function gagner() {
    const S = G.S;
    if (G.finProg) return;
    G.finProg = true;
    son('gagne');
    // Le mur s'écroule sur les morts, qui tombent en poussière.
    for (const z of S.morts) { eclats(z.x, z.y, 14, '#5a6a54', 200); poussiere(z.x, z.y1, 4); }
    S.morts.length = 0;
    const col = (COULEURS_ENCRE[S.encre.id] || COULEURS_ENCRE.normale)[1];
    for (const L of S.lignes) for (const k of L.c) if (Math.random() < 0.5) particule({ x: k.x, y: k.y, vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 200, vie: 1.2 + Math.random() * 0.6, max: 1.8, col, taille: 5, sorte: 'carre', vr: (Math.random() - 0.5) * 10 });
    S.corps = S.corps.filter((b) => b.genre !== 'ligne' && b.genre !== 'mort');
    S.lignes.length = 0;
    for (const c of S.corbeaux) eclats(c.x, c.y, 6, '#1e1a2a', 150);
    S.corps = S.corps.filter((b) => b.genre !== 'corb'); S.corbeaux.length = 0;
    // Résultat.
    const i = G.niv;
    const part = Math.max(1, Math.round((S.encreUsee / S.encreMax) * 100));
    const et = TS.etoilesPour(NIVEAUX[i], part / 100);
    const avant = totalEtoiles();
    const ancienRecord = P.records[i];
    P.etoiles[i] = Math.max(P.etoiles[i], et);
    const record = ancienRecord == null || part < ancienRecord;
    if (record) P.records[i] = part;
    const apres = totalEtoiles();
    const debloques = [];
    TS.ENCRES.forEach((e, k) => { if (e.etoiles > avant && e.etoiles <= apres) debloques.push(tr('debloque.encre', { nom: tr('encre.' + e.id) })); });
    TS.HEROS.forEach((h, k) => { if (h.etoiles > avant && h.etoiles <= apres) debloques.push(tr('debloque.heros', { nom: tr('heros.' + h.id) })); });
    ecrireProgression(i + 2);
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
    if (toutGagne()) { if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 }); }
    G.resultat = { gagne: true, et, part, record: P.records[i], nouveauRecord: record && ancienRecord != null, debloques };
    setTimeout(() => { if (G.S === S) montrerFin(); }, 1300);
  }

  function perdreEcran() {
    const S = G.S;
    if (G.finProg) return;
    G.finProg = true;
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: G.niv + 1 });
    G.resultat = { gagne: false, cause: S.cause };
    montrerFin();
  }

  function montrerFin() {
    const r = G.resultat;
    const i = G.niv;
    grattageFin();
    cacherIndice(); $('chrono').classList.add('cache');
    const titre = $('finTitre');
    $('finDebloque').textContent = '';
    const ets = $('finEtoiles'); ets.innerHTML = '';
    if (r.gagne) {
      titre.textContent = tr(G.S.survs.length > 1 ? 'fin.gagnes' : 'fin.gagne');
      titre.className = 'gros-titre vert';
      for (let k = 0; k < 3; k++) {
        ets.insertAdjacentHTML('beforeend', svgEtoile(k < r.et));
        const el = ets.lastElementChild;
        setTimeout(() => { el.classList.add(k < r.et ? 'on' : 'off'); if (k < r.et) { son('etoile', k); } }, 250 + k * 280);
      }
      $('finInfo1').textContent = tr('fin.encre', { n: r.part });
      $('finInfo2').textContent = r.nouveauRecord ? tr('fin.nouveauRecord') : tr('fin.record', { n: r.record });
      $('finInfo2').className = 'ligne-info' + (r.nouveauRecord ? ' nouveau' : '');
      $('finAstuce').textContent = r.et < 3 ? tr('fin.astuceEtoiles', { n: Math.round(NIVEAUX[i].s3 * 100) }) : '';
      if (r.debloques.length) { $('finDebloque').textContent = r.debloques.join(' '); setTimeout(() => son('debloque'), 1200); }
      $('bSuivant').classList.remove('cache'); $('bReessayer').classList.add('cache');
      $('bSuivant').textContent = i === NIVEAUX.length - 1 ? tr('bilan.voir') : tr('suivant');
      $('bRejouer').classList.remove('cache');
      // Confettis d'encre.
      for (let k = 0; k < 40; k++) particule({ x: G.S.survs[0].x + (Math.random() - 0.5) * 200, y: G.S.survs[0].y - 200, vx: (Math.random() - 0.5) * 300, vy: -Math.random() * 300, g: 500, vie: 2, max: 2, col: ['#7ef0ff', '#ffd84a', '#ff8fe0', '#ffffff'][k % 4], taille: 5, sorte: 'carre', vr: 8 });
    } else {
      titre.textContent = tr('fin.' + (r.cause || 'touche'));
      titre.className = 'gros-titre rouge';
      $('finInfo1').textContent = tr('fin.astuce.' + (r.cause || 'touche'));
      $('finInfo2').textContent = ''; $('finInfo2').className = 'ligne-info';
      $('finAstuce').textContent = tr('fin.relance');
      $('bSuivant').classList.add('cache'); $('bReessayer').classList.remove('cache');
      $('bRejouer').classList.add('cache');
    }
    montrer('fin');
  }

  function suivant() {
    if (G.niv >= NIVEAUX.length - 1) { montrerBilan(); return; }
    lancerNiveau(G.niv + 1);
  }
  function montrerBilan() {
    G.mode = 'menu'; montrerHud(false);
    const n = totalEtoiles();
    const ets = $('bilanEtoiles'); ets.innerHTML = '';
    for (let k = 0; k < 3; k++) { ets.insertAdjacentHTML('beforeend', svgEtoile(n >= (k + 1) * 20)); const el = ets.lastElementChild; setTimeout(() => el.classList.add('on'), 200 + k * 250); }
    $('bilanTexte').textContent = tr('bilan.texte', { n, max: NIVEAUX.length * 3 });
    const e = TS.ENCRES.filter((x, i) => encreOuverte(i)).length, h = TS.HEROS.filter((x, i) => heroOuvert(i)).length;
    $('bilanCol').textContent = tr('bilan.collection', { e, eMax: TS.ENCRES.length, h, hMax: TS.HEROS.length });
    son('gagne');
    montrer('bilan');
  }

  function mettrePause() {
    if (G.mode !== 'jeu' || G.pause || G.finProg) return;
    G.pause = true; finirTraitSansSolide(); grattageFin();
    montrer('pause');
  }
  function finirTraitSansSolide() { if (G.trace) { G.trace = false; } }
  function reprendre() { if (!G.pause) return; G.pause = false; son('clic'); montrer(null); }

  /* ---------------------------------------------------------------------------
     Toucher, souris et clavier
     ------------------------------------------------------------------------- */
  let dernierePos = null, dernierTemps = 0;
  cv.addEventListener('pointerdown', (e) => {
    audio();
    if (G.mode !== 'jeu' || G.pause || !G.S || G.S.phase !== 'trace') return;
    if (G.bulle) { cacherBulle(); return; }
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
    const [x, y] = versMonde(e.clientX, e.clientY);
    G.trace = true; G.pointeur = e.pointerId;
    const r = TS.tracer(G.S, x, y);
    if (r === 'bloque') { indice(tr('hud.bloque'), true, 1.2); son('bloque'); G.bloqueT = 0.6; }
    else { cacherIndice(); grattageDebut(); }
    dernierePos = [e.clientX, e.clientY]; dernierTemps = performance.now();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!G.trace || e.pointerId !== G.pointeur || !G.S) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) {
      const [x, y] = versMonde(ev.clientX, ev.clientY);
      const r = TS.tracer(G.S, x, y);
      if (r === 'ok' && G.S.trait.length === 2) { cacherIndice(); grattageDebut(); }
      if (r === 'bloque') { G.bloqueT = 0.5; if (indiceT <= 0) indice(tr('hud.bloque'), true, 0.8); }
      if (r === 'vide') { indice(tr('hud.vide'), true, 1.4); finirTrait(); return; }
    }
    const now = performance.now();
    if (dernierePos) { const v = Math.hypot(e.clientX - dernierePos[0], e.clientY - dernierePos[1]) / Math.max(1, now - dernierTemps) * 1000; grattageVitesse(v); }
    dernierePos = [e.clientX, e.clientY]; dernierTemps = now;
  });
  const lacher = (e) => { if (G.trace && e.pointerId === G.pointeur) finirTrait(); };
  cv.addEventListener('pointerup', lacher);
  cv.addEventListener('pointercancel', lacher);

  document.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const k = e.code;
    if (k === 'KeyM') { basculerSon(); return; }
    if (G.mode === 'jeu') {
      if (k === 'Escape' || k === 'KeyP') { e.preventDefault(); if (G.pause) reprendre(); else if (G.ecran === 'fin') { /* rien */ } else mettrePause(); return; }
      if (k === 'KeyR') { e.preventDefault(); audio(); lancerNiveau(G.niv); return; }
      if (G.ecran === 'fin' && (k === 'Enter' || k === 'Space' || k === 'NumpadEnter')) {
        e.preventDefault(); audio();
        if (G.resultat && G.resultat.gagne) suivant(); else lancerNiveau(G.niv);
        return;
      }
      if (G.bulle && (k === 'Enter' || k === 'Space')) { e.preventDefault(); cacherBulle(); return; }
    } else if (G.ecran === 'titre' && (k === 'Enter' || k === 'Space') && document.activeElement === document.body) {
      e.preventDefault(); $('bJouer').click();
    }
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden) { mettrePause(); grattageFin(); } });

  function brancher() {
    $('bJouer').addEventListener('click', () => {
      audio(); son('clic');
      JEL_SAVE.reprise({
        jeu: JEU,
        onContinuer: (d) => { chargerProgression(); lancerNiveau(entier(d && d.niveau, 1, NIVEAUX.length, 1) - 1); },
        onNouvelle: () => { chargerProgression(); lancerNiveau(0); },
      });
    });
    $('bNiveaux').addEventListener('click', () => { audio(); son('clic'); chargerProgression(); montrerNiveaux(); });
    $('bCollection').addEventListener('click', () => { audio(); son('clic'); chargerProgression(); montrerCollection(); });
    $('bRetourNiv').addEventListener('click', () => { son('clic'); montrerTitre(); });
    $('bRetourCol').addEventListener('click', () => { son('clic'); if (G.retourBilan) { G.retourBilan = false; montrerBilan(); } else montrerTitre(); });
    document.querySelectorAll('.bSon').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); basculerSon(); }));
    $('bPause').addEventListener('click', () => { audio(); son('clic'); mettrePause(); });
    $('bRecommencer').addEventListener('click', () => { audio(); son('clic'); lancerNiveau(G.niv); });
    $('bReprendre').addEventListener('click', reprendre);
    $('bPauseRecommencer').addEventListener('click', () => { son('clic'); lancerNiveau(G.niv); });
    $('bPauseNiveaux').addEventListener('click', () => { son('clic'); montrerNiveaux(); });
    $('bPauseAccueil').addEventListener('click', () => { son('clic'); montrerTitre(); });
    $('bSuivant').addEventListener('click', () => { son('clic'); suivant(); });
    $('bReessayer').addEventListener('click', () => { son('clic'); lancerNiveau(G.niv); });
    $('bRejouer').addEventListener('click', () => { son('clic'); lancerNiveau(G.niv); });
    $('bFinNiveaux').addEventListener('click', () => { son('clic'); montrerNiveaux(); });
    $('bFinAccueil').addEventListener('click', () => { son('clic'); montrerTitre(); });
    $('bBilanRejouer').addEventListener('click', () => { son('clic'); lancerNiveau(0); });
    $('bBilanCol').addEventListener('click', () => { son('clic'); G.retourBilan = true; montrerCollection(); });
    $('bBilanAccueil').addEventListener('click', () => { son('clic'); montrerTitre(); });
    $('bCompris').addEventListener('click', (e) => { e.stopPropagation(); son('clic'); cacherBulle(); });
    // Sauvegarde à la fermeture, seulement pendant un niveau.
    JEL_SAVE.surFermeture(() => {
      if (apercu || !G.S || G.mode !== 'jeu') return;
      ecrireProgression(G.niv + 1);
    });
  }

  /* ---------------------------------------------------------------------------
     Démo de l'écran titre : le niveau 1 joué tout seul, en boucle
     ------------------------------------------------------------------------- */
  function preparerDemo() {
    const def = NIVEAUX[0];
    const S = TS.nouveauNiveau(def, { hero: P.hero, graine: (Math.random() * 1e6) | 0 });
    S.morts.forEach((z, k) => { z.id = k + 2; });
    for (let k = 0; k < 30; k++) TS.pas(S, TS.PAS);
    G.demo = { S, t: 0, pts: arcAutour(S, S.survs[0].x, 100), i: 0 };
    S.ev.length = 0;
  }
  function arcAutour(S, x, R) {
    const gy = TS.solSous(S.segs, x, -3000), pts = [];
    for (let i = 0; i <= 50; i++) { const a = Math.PI * (i / 50); pts.push([x + Math.cos(a) * R, gy - 8 - Math.sin(a) * R]); }
    return pts;
  }
  function majDemo(dt) {
    const D = G.demo;
    if (!D) return;
    D.t += dt;
    const S = D.S;
    if (S.phase === 'trace') {
      if (D.t > 1) {
        while (D.i < D.pts.length && D.i < (D.t - 1) * 40) { TS.tracer(S, D.pts[D.i][0], D.pts[D.i][1]); D.i++; }
        if (D.i >= D.pts.length) TS.solidifier(S);
      }
    }
    TS.avancer(S, dt, 1);
    S.ev.length = 0;
    if (S.phase !== 'jeu' && S.phase !== 'trace') { D.fin = (D.fin || 0) + dt; if (D.fin > 2.5) preparerDemo(); }
  }

  /* ---------------------------------------------------------------------------
     Boucle principale
     ------------------------------------------------------------------------- */
  let dernier = performance.now(), T = 0;
  function boucle(now) {
    const dt = Math.min(0.05, Math.max(0, (now - dernier) / 1000));
    dernier = now; T += dt;
    if (window.JEL_AFFICHE) { dessinerAffiche(T); requestAnimationFrame(boucle); return; }
    G.secousse = Math.max(0, G.secousse - dt * 30);
    if (indiceT > 0) { indiceT -= dt; if (indiceT <= 0) cacherIndice(); }
    G.bloqueT = Math.max(0, (G.bloqueT || 0) - dt);
    if (G.mode === 'jeu' && G.S) {
      const S = G.S;
      if (!G.pause && !G.gel) {
        const vitesse = S.phase === 'perdu' ? 0.3 : 1;
        TS.avancer(S, dt, vitesse);
        traiterEvenements(S);
        majParticules(dt);
        if (S.phase === 'jeu') {
          // Grognements et tic des dernières secondes.
          G.derniereGrogne -= dt;
          if (S.morts.length && G.derniereGrogne <= 0) { son('grogne'); G.derniereGrogne = 1.4 + Math.random() * 2; }
          const r = Math.ceil(S.duree - S.t);
          if (r <= 3 && r !== G.dernierTic && r > 0) { G.dernierTic = r; son('tic'); }
        }
        if (S.phase === 'perdu') { G.finT += dt; if (G.finT > 1.4) perdreEcran(); }
      }
      majHud();
      const main = !G.aTrace && S.phase === 'trace' && !S.trait.length ? positionMain(T) : null;
      dessinerScene(S, T, { main: main && main.pos, mainAppuie: main && main.appuie });
    } else if (G.demo) {
      majDemo(dt);
      majParticules(dt);
      G.cam = cameraPour(NIVEAUX[0].vue, Math.max(118, H * 0.5), G.demo.S.survs);
      dessinerScene(G.demo.S, T, {});
    }
    dessinerBulle(now);
    requestAnimationFrame(boucle);
  }
  // Main du tutoriel du niveau 1 : trace un arc autour de la survivante.
  function positionMain(t) {
    const S = G.S, s = S.survs[0];
    const k = (t % 3) / 3, p = borne(k * 1.4, 0, 1);
    const a = Math.PI * p, R = 100, gy = TS.solSous(S.segs, s.x, -3000);
    const pos = [s.x + Math.cos(a) * R, gy - 8 - Math.sin(a) * R];
    // Trace fantôme.
    const pts = [];
    for (let i = 0; i <= 30 * p; i++) { const b = Math.PI * (i / 30); pts.push([s.x + Math.cos(b) * R, gy - 8 - Math.sin(b) * R]); }
    G.fantome = pts;
    return { pos, appuie: p < 1 };
  }

  /* ---------------------------------------------------------------------------
     Affiche du jeu (window.JEL_AFFICHE) : la survivante en grand derrière son
     mur de lumière, les morts plaqués contre lui, les corbeaux, la lune.
     ------------------------------------------------------------------------- */
  function dessinerAffiche(t) {
    t = t || 0;
    const g = ctx;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const w = W, h = H;
    dessinerCiel(g, w, h, 1.3, { s: h / 800 * 1.6, ox: w / 2, oy: h * 0.86 });
    const u = Math.min(w / 600, h / 800);
    g.save();
    g.translate(w / 2, h * 0.84); g.scale(u, u);
    // Sol.
    g.fillStyle = '#2e2a3c'; g.fillRect(-800, 0, 1600, 400);
    g.fillStyle = '#4a4462'; g.fillRect(-800, -3, 1600, 8);
    g.fillStyle = 'rgba(255,230,160,0.35)'; for (let x = -600; x < 600; x += 110) g.fillRect(x, 40, 60, 7);
    // Lampadaire et halo.
    g.save(); g.translate(150, 0); g.scale(1.6, 1.6); dessinerLampadaire(g, 0, 0, t); g.restore();
    // Morts au fond (plus petits, plus pâles).
    g.save(); g.globalAlpha = 0.75;
    [[-250, -60, 0.85], [-160, -40, 0.8]].forEach(([x, y, s], i) => { g.save(); g.translate(x, y); g.scale(s * 1.8, s * 1.8); dessinerMort(g, 'm', 1, 1.2 + i, i + 3, 0, 0); g.restore(); });
    g.restore();
    // Le mur de lumière (un arc tracé d'un seul trait).
    const pts = [];
    for (let i = 0; i <= 40; i++) { const a = Math.PI * (0.18 + 0.82 * i / 40); pts.push([60 + Math.cos(a) * 250, -10 - Math.sin(a) * 330]); }
    g.save(); g.scale(1, 1);
    // Halo large.
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); pts.forEach((p) => g.lineTo(p[0], p[1]));
    g.strokeStyle = 'rgba(126,240,255,0.25)'; g.lineWidth = 60; g.stroke();
    g.strokeStyle = '#3fd6f0'; g.lineWidth = 28; g.stroke();
    g.strokeStyle = '#e8fdff'; g.lineWidth = 8; g.stroke();
    g.restore();
    // Bout du trait encore lumineux, avec étincelles.
    g.fillStyle = '#fff'; g.beginPath(); g.arc(pts[0][0], pts[0][1], 16, 0, Math.PI * 2); g.fill();
    for (let i = 0; i < 26; i++) { const a = h1(i) * Math.PI * 2, r = 20 + h1(i + 5) * 60; g.fillStyle = i % 2 ? '#7ef0ff' : '#ffffff'; g.fillRect(pts[0][0] + Math.cos(a) * r, pts[0][1] + Math.sin(a) * r, 4, 4); }
    // Morts plaqués contre le mur, à gauche (premier plan, un peu coupés).
    [[-255, 0, 2.6, 2], [-330, 10, 3.0, 4], [-215, -120, 2.3, 1]].forEach(([x, y, s, k]) => { g.save(); g.translate(x, y); g.scale(s, s); dessinerMort(g, k === 4 ? 'o' : 'm', 1, 0.6 + k, k, 0, 0); g.restore(); });
    // Un mort grimpe sur le dessus du mur.
    g.save(); g.translate(-120, -300); g.rotate(0.35); g.scale(2.1, 2.1); dessinerMort(g, 'g', 1, 2.2, 5, 0, 0); g.restore();
    // Éclats là où ils frappent.
    for (let i = 0; i < 18; i++) { g.fillStyle = 'rgba(232,253,255,0.85)'; g.fillRect(-175 + h1(i * 3) * 40, -260 + h1(i * 7) * 240, 5, 5); }
    // La survivante, en grand, à droite, éclairée par le lampadaire.
    g.save(); g.translate(130, 0); g.scale(4.6, 4.6);
    dessinerHeros(g, 0, -1, 0.3, 0.9, false);
    g.restore();
    // Corbeaux qui piquent.
    [[-60, -560, 2.4], [160, -600, 1.8], [-250, -520, 1.5]].forEach(([x, y, s], i) => { g.save(); g.translate(x, y); g.scale(s, s); g.rotate(0.5); dessinerCorbeau(g, 1, 1.2 + i, 'pique'); g.restore(); });
    // Premier plan : débris et bord de trottoir.
    g.fillStyle = '#1c1828'; g.beginPath(); g.moveTo(-320, 120); g.lineTo(-250, 20); g.lineTo(-170, 120); g.fill();
    g.fillStyle = '#7a6f8a'; g.fillRect(-320, 0, 640, 6);
    g.restore();
    // Lumière froide du trait sur la scène.
    const lu = g.createRadialGradient(w * 0.45, h * 0.55, 10, w * 0.45, h * 0.55, w * 0.7);
    lu.addColorStop(0, 'rgba(126,240,255,0.18)'); lu.addColorStop(1, 'rgba(126,240,255,0)');
    g.fillStyle = lu; g.fillRect(0, 0, w, h);
  }

  /* ---------------------------------------------------------------------------
     Images du jeu (window.JEL_APERCU) : vraies parties, figées
     ------------------------------------------------------------------------- */
  const APERCUS = {
    1: { niv: 0, trace: (S) => arcAutour(S, S.survs[0].x, 98), duree: 3.6 },
    2: { niv: 7, trace: (S) => arcAutour(S, S.survs[0].x, 104), duree: 4.2 },
    3: { niv: 15, trace: (S) => { const a = S.survs[0].x, b = S.survs[1].x; const gy = TS.solSous(S.segs, a, -3000), c = (a + b) / 2, R = (b - a) / 2 + 100, pts = []; for (let i = 0; i <= 60; i++) { const an = Math.PI * (i / 60); pts.push([c + Math.cos(an) * R, gy - 8 - Math.sin(an) * R * 0.75]); } return pts; }, duree: 3.2 },
  };
  function ouvrirApercu(n) {
    apercu = n;
    const A = APERCUS[n] || APERCUS[1];
    for (const e of ECRANS) $(e).classList.add('cache');
    if (n >= 2) { P.etoiles = NIVEAUX.map((_, i) => (i < A.niv ? 3 : 0)); }
    lancerNiveau(A.niv, true);
    const S = G.S;
    for (const [x, y] of A.trace(S)) TS.tracer(S, x, y);
    TS.solidifier(S);
    S.ev.length = 0;
    const pasN = Math.round(A.duree / TS.PAS);
    for (let k = 0; k < pasN && S.phase === 'jeu'; k++) TS.pas(S, TS.PAS);
    S.ev.length = 0;
    G.gel = true;
    cacherIndice();
    $('encres').classList.add('cache');
    majHud();
  }

  /* ---------------------------------------------------------------------------
     Démarrage
     ------------------------------------------------------------------------- */
  function init() {
    redim();
    window.addEventListener('resize', () => { redim(); if (G.mode === 'jeu' && G.S) { G.cam = cameraPour(G.S.def.vue, null, G.S.survs); G.cam.bas = G.S.def.vide ? 300 * G.cam.s : 0; } });
    try { chargerProgression(); } catch (e) { /* rien */ }
    appliquerSon();
    if (window.JEL_AFFICHE) {
      for (const e of ECRANS) $(e).classList.add('cache');
      montrerHud(false);
      const cacher = () => document.querySelectorAll('.jel-langue, .jel-langue-hote').forEach((e) => { e.style.display = 'none'; });
      cacher(); setTimeout(cacher, 300);
      requestAnimationFrame(boucle);
      return;
    }
    if (window.JEL_APERCU) { ouvrirApercu(Number(window.JEL_APERCU)); requestAnimationFrame(boucle); return; }
    brancher();
    montrerTitre();
    requestAnimationFrame(boucle);
  }
  init();
})();
</script>
</body>
</html>
