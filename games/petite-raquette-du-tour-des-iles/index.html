<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +

    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +

    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }

      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};

  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
'use strict';
/* ==========================================================================
   La petite raquette du tour des îles — Free Micro Games
   Lou fait la tournée de l'archipel : 20 courts sur 5 îles.
   Court en perspective (vu de derrière Lou), physique simple de la balle
   (gravité, rebond selon la surface, vent), adversaires réglés par niveau.
   Tous les textes passent par tr() (module jel-i18n).
   ========================================================================== */

const JEU = 'petite-raquette-du-tour-des-iles';
const tr = (cle, vars) => window.JEL_I18N.t(cle, vars);
const nb = (x) => window.JEL_I18N.nombre(x);

// --------------------------------------------------------------------------
// Données : surfaces, îles, adversaires, niveaux
// --------------------------------------------------------------------------

// Rebond : rest = part de la vitesse verticale gardée, garde = vitesse au sol gardée.
const SURFACES = {
  dur:   { rest: 0.70, garde: 0.84, sol: '#3a86c8', bord: '#5fa860', ligne: '#ffffff' },
  terre: { rest: 0.82, garde: 0.70, sol: '#d9653b', bord: '#c4552f', ligne: '#fff6ea' },
  herbe: { rest: 0.55, garde: 0.93, sol: '#5cb85c', bord: '#479847', ligne: '#ffffff' },
  sable: { rest: 0.46, garde: 0.60, sol: '#ecd29a', bord: '#e2c27f', ligne: '#3f7fbf' },
};

const ILES = ['ile0', 'ile1', 'ile2', 'ile3', 'ile4'];

// Adversaires : vit = course (m/s), portee = bras + raquette (m), err = fautes,
// prec = vise loin de Lou (0 à 1), T = durée de vol de ses coups (s),
// filet = envie de monter au filet, peau / cheveux / maillot = couleurs.
function adv(nom, o) { return Object.assign({ nom, vit: 4, portee: 1.6, err: 0.2, prec: 0.4, T: 1.5, filet: 0, peau: '#f1c27d', cheveux: '#5b3a1e', maillot: '#ef476f' }, o); }

// Chaque niveau : ile, type (match, champion, service, echange), surface,
// adversaire, jeux (jeux gagnants), sets (sets gagnants, 0 = sans sets),
// cibles, vent, rafales, nuit, phare, engage ('adv' : il sert toujours),
// fenetre (temps pour frapper en avance, s), besoin/s2/s3 (épreuves),
// tutos, ouvre (niveaux débloqués quand on le gagne), pos (place sur la carte).
const NIVEAUX = [
  // Île des Mouettes (dur)

let AC = null;

  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});

}
function bip(f, duree, type, vol, glisse, retard) {
  if (!P.son || !AC || enPause) return;
  try {
    const t0 = AC.currentTime + (retard || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    if (glisse) o.frequency.exponentialRampToValueAtTime(Math.max(30, glisse), t0 + duree);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + duree + 0.02);
  } catch (e) { /* rien */ }
}
function bruit(duree, vol, filtre, retard) {
  if (!P.son || !AC || enPause) return;
  try {
    const t0 = AC.currentTime + (retard || 0);
    const n = Math.floor(AC.sampleRate * duree);
    const buf = AC.createBuffer(1, n, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = AC.createBufferSource(); s.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = filtre || 1200; f.Q.value = 0.8;
    const g = AC.createGain(); g.gain.value = vol || 0.2;
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(t0);
  } catch (e) { /* rien */ }
}

// --------------------------------------------------------------------------

const canvas = document.getElementById('jeu');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
const CAM_Y = -15, CAM_Z = 11;
let FX = 300, FY = 300, CX = 0, CY = 0;

function redimensionner() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // Fond du court de Lou (y = -2.5) en bas, fond adverse (y = 26) en haut.
  // haut : assez bas pour que le tableau de score ne cache pas l'adversaire
  const bas = H - 118, haut = Math.max(130, H * 0.205);
  const d1 = -2.5 - CAM_Y, d2 = 26 - CAM_Y;
  FY = (bas - haut) / (CAM_Z * (1 / d1 - 1 / d2));
  CY = haut - CAM_Z * FY / d2;
  FX = Math.min(W * 0.47 * (-CAM_Y) / 4.7, FY * 1.15);
  CX = W / 2;
  if (etat === 'carte') placerNoeuds();
}
// Point du court (x, y, hauteur z) → écran. Renvoie aussi l'échelle s.
function proj(x, y, z) {
  const d = Math.max(0.5, y - CAM_Y);
  return { x: CX + x * FX / d, y: CY + (CAM_Z - (z || 0)) * FY / d, s: FY / d };
}
// Écran → point du sol (z = 0).
function deproj(sx, sy) {
  const dy = Math.max(1, sy - CY);
  const d = CAM_Z * FY / dy;
  return { x: (sx - CX) * d / FX, y: d + CAM_Y };
}

// Lance la balle de (x, y, z) pour retomber en (tx, ty) au bout de T secondes.
function lancerBalle(x, y, z, tx, ty, T, auteur) {
  balle.x = x; balle.y = y; balle.z = z;
  balle.vx = (tx - x) / T; balle.vy = (ty - y) / T;
  balle.vz = (G * T * T / 2 - z) / T;
  balle.actif = true; balle.rebonds = 0; balle.auteur = auteur; balle.trainee = [];
  // Où va-t-elle vraiment (avec le vent) ?
  const p = predire();
  balle.dehors = !p || !dansCourt(p.x, p.y, auteur, balle.service);
  balle.predit = p;
}
// Le vent pousse plus fort les balles hautes (lobs).
function ventSur(z) { return vent * Math.max(0, Math.min(4, z)) * 0.22; }
// Simule le vol jusqu'au premier rebond. Renvoie null si la balle touche le filet.
function predire() {
  let x = balle.x, y = balle.y, z = balle.z, vx = balle.vx, vy = balle.vy, vz = balle.vz;
  const dt = 1 / 120;
  for (let i = 0; i < 900; i++) {
    const yAvant = y;
    vx += ventSur(z) * dt; vz -= G * dt;
    x += vx * dt; y += vy * dt; z += vz * dt;
    if ((yAvant - 12) * (y - 12) <= 0 && z < 0.95) return null;
    if (z <= 0) return { x, y, t: i * dt };
  }
  return { x, y, t: 7 };
}
// La balle tombe-t-elle dans le court de celui qui la reçoit ?
function dansCourt(x, y, auteur, service) {
  if (Math.abs(x) > 4.15) return false;
  if (auteur === 0) return service ? (y > 12 && y <= 18.5) : (y > 12 && y <= 24.1);
  return service ? (y < 12 && y >= 5.5) : (y < 12 && y >= -0.1);
}
// Où se placer pour frapper la balle après son rebond (Lou : y < 12).
function pointDeFrappe(pourLou) {
  let x = balle.x, y = balle.y, z = balle.z, vx = balle.vx, vy = balle.vy, vz = balle.vz;
  const s = SURFACES[N.surface];
  let reb = balle.rebonds, zMax = 0, meilleur = null;
  const dt = 1 / 120;
  for (let i = 0; i < 900; i++) {
    vx += ventSur(z) * dt; vz -= G * dt;
    x += vx * dt; y += vy * dt; z += vz * dt;
    if (z <= 0) {
      z = 0; reb++;
      if (reb >= 2) break;
      vz = -vz * s.rest; vx *= s.garde; vy *= s.garde;
    }
    if (reb === 1) {
      if (z >= zMax) { zMax = z; meilleur = { x, y, z }; }
      else if (zMax <= 1.9) break;                         // sommet assez bas : on frappe là
      else if (z < 1.5) { meilleur = { x, y, z }; break; } // rebond haut : on attend qu'elle redescende
    }
    if (pourLou ? y < -3.2 : y > 27.5) { meilleur = meilleur || { x, y, z }; break; }
  }
  if (!meilleur) return null;
  if (pourLou) meilleur.y = Math.max(-3, Math.min(8.5, meilleur.y - 0.2));
  else meilleur.y = Math.max(15.5, Math.min(27, meilleur.y + 0.2));
  return meilleur;
}

// Lou appuie sur « Frapper » (lob = false) ou « Lob ».
function appui(lob) {

  if (phase === 'service' && M.serveur === 0) { appuiService(); return; }
  if (phase !== 'echange') return;
  if (lou.recup > 0 || lou.arme) return;
  if (!balle.actif || balle.auteur === 0 || balle.dehors) { swingVide(); return; }
  const vy = Math.min(-1, balle.vy);
  const dt = (balle.y - lou.y) / -vy;
  const E = N.fenetre, Lt = 0.16;
  if (dt > E || dt < -Lt) { swingVide(); return; }
  const c = E * 0.42;
  const u = dt > c ? (dt - c) / (E - c) : (dt - c) / (c + Lt);
  lou.arme = { u, lob };

  const { u, lob } = lou.arme;
  lou.arme = null; lou.swing = 1; lou.recup = 0.25;
  if (Math.abs(balle.x - lou.x) > lou.portee + (lob ? 0.15 : 0) || balle.z > 2.9) { SON.vide(); annoncerTexte('msg.loin'); return; }
  const s = lou.x >= 0.3 ? 1 : (lou.x <= -0.3 ? -1 : (balle.x >= lou.x ? 1 : -1));
  let tx, ty, T, cle;
  const parfait = Math.abs(u) < 0.24;
  if (lob) {
    tx = Math.max(-2.8, Math.min(2.8, -opp.x * 0.4 + (Math.random() - 0.5) * 1.6)) - vent * 0.9;
    ty = 20.5 + Math.random() * 2;
    T = 2.05; cle = 'msg.lob';
  } else if (parfait) {
    // Coup parfait : vers le côté libre, plus vite et plus loin.
    const libre = opp.x > 0.4 ? -1 : (opp.x < -0.4 ? 1 : -s);
    tx = libre * (2.6 + Math.random() * 0.6); ty = 21 + Math.random() * 1.6; T = 1.02; cle = 'msg.parfait';
    M.parfaits++; lou.dernierParfait = true;
  } else if (u > 0) {
    tx = -s * (1.6 + u * 2.0) + (Math.random() - 0.5) * 0.5; ty = 18.5 + Math.random() * 3; T = 1.26; cle = 'msg.diagonale';
  } else {
    tx = s * (1.6 - u * 2.0) + (Math.random() - 0.5) * 0.5; ty = 19 + Math.random() * 3; T = 1.24; cle = 'msg.ligne';
  }
  balle.service = false;
  lancerBalle(balle.x, balle.y, Math.max(0.5, balle.z), tx, ty, T, 0);
  lou.cibleY = -0.6; // Lou revient au fond du court
  if (parfait && !lob) { SON.parfait(); etincelles(balle.x, balle.y, balle.z, '#ffe066', 16); } else SON.frappe();
  annoncerTexte(cle);
  if (N.type === 'echange' && !balle.dehors) { /* compté au rebond */ }
  adversaireReagit();
}
// L'adversaire décide où courir.
function adversaireReagit() {
  opp.reac = N.type === 'echange' ? 0.1 : 0.22;
  const p = pointDeFrappe(false);
  // Plus il doit courir loin, plus il risque la faute.
  opp.course = p ? Math.abs(p.x - opp.x) : 0;
  const auFilet = opp.auFilet;
  if (auFilet) {
    // Au filet : il attend la balle au vol, sur sa ligne.
    const tNet = (opp.y - balle.y) / Math.max(1, balle.vy);
    opp.cibleX = balle.x + balle.vx * tNet;
  } else if (p) { opp.cibleX = p.x; opp.cibleY = p.y; }
  else { opp.cibleX = balle.predit ? balle.predit.x : 0; opp.cibleY = 24.6; }
}
// Contact de l'adversaire avec la balle.
function frappeAdversaire() {
  opp.swing = 1;
  const volee = balle.rebonds === 0;
  const smash = balle.z > 2.3;
  const echange = N.type === 'echange';
  // Faute ?
  let err = A.err;
  if (lou.dernierParfait) err += 0.12;
  if (Math.abs(balle.x - opp.x) > A.portee * 0.7) err += 0.1;
  err += Math.min(0.2, (opp.course || 0) * 0.045);
  if (volee && !smash) err *= 0.6;
  if (echange) err = 0;
  const fauteAdv = Math.random() < err;
  let tx, ty, T, cle = null;
  const loinDeLou = lou.x > 0 ? -1 : 1;
  if (echange) {
    const ampl = Math.min(3.3, 0.6 + M.coups * 0.14);
    tx = (Math.random() * 2 - 1) * ampl; ty = 2.5 + Math.random() * 4;
    T = Math.max(1.12, A.T - M.coups * 0.012);
  } else if (fauteAdv) {
    const r = Math.random();
    if (r < 0.4) { tx = loinDeLou * (4.7 + Math.random()); ty = 3 + Math.random() * 3; }
    else if (r < 0.75) { tx = (Math.random() * 2 - 1) * 3; ty = -1.6 - Math.random() * 1.5; }
    else { tx = (Math.random() * 2 - 1) * 2.5; ty = 6; }
    T = r >= 0.75 ? 0.58 : A.T * 0.9;
  } else if (volee && opp.auFilet) {
    tx = loinDeLou * (2.4 + Math.random() * 1.2); ty = 3.5 + Math.random() * 2.5; T = 0.85; cle = 'msg.volee';
  } else if (smash) {
    tx = loinDeLou * (1.8 + Math.random() * 1.6); ty = 2 + Math.random() * 3; T = 0.78; cle = 'msg.smash'; secousse = 8;
  } else {
    const vise = Math.random() < A.prec;
    tx = vise ? loinDeLou * (1.4 + Math.random() * 2) : (Math.random() * 2 - 1) * 2.8;
    ty = 1.2 + Math.random() * 4.2;
    if (N.surface === 'sable' && Math.random() < 0.25) ty = 6.5 + Math.random() * 2;
    T = A.T * (0.92 + Math.random() * 0.16);
  }
  balle.service = false;
  lancerBalle(balle.x, balle.y, Math.max(0.6, Math.min(balle.z, 2.6)), tx, ty, T, 1);
  SON.frappe();
  if (cle) annoncerTexte(cle, null, '#ffd6a5');
  lou.dernierParfait = false;
  // Il se replace vers le centre, au fond du court.
  opp.cibleX = opp.x * 0.3; opp.cibleY = 24.6;
  // Monter au filet après un bon coup profond.
  if (!echange && A.filet > 0 && !opp.auFilet && !fauteAdv && ty < 5 && Math.random() < A.filet) {
    opp.auFilet = true; opp.cibleY = 14.4; opp.cibleX = 0;
  }
  preparerLou();
}
// Lou se place toute seule en profondeur ; le rond d'aide montre où.
function preparerLou() {
  const p = balle.dehors ? null : pointDeFrappe(true);
  aideContact = p;
  lou.cibleY = p ? p.y : -0.6;
}

// --------------------------------------------------------------------------
// Service
// --------------------------------------------------------------------------

let demarrage = false;
let srv = null; // { etape: 'pret'|'lance'|'parti', t, viseX, viseY }
function preparerPoint() {
  balle.actif = false; balle.trainee = [];
  lou.arme = null; lou.recup = 0; aideContact = null;
  opp.auFilet = false;
  if (N.rafales) changerVent();
  phase = 'service';
  const cote = (M.pts[0] + M.pts[1]) % 2 === 0 ? 1 : -1;
  if (M.serveur === 0) {
    lou.x = lou.cibleX = 0.9 * cote; lou.y = lou.cibleY = -0.6;
    opp.x = opp.cibleX = -1.2 * cote; opp.y = opp.cibleY = 24.4;
    srv = { etape: 'pret', t: 0, viseX: srv && N.type === 'service' ? srv.viseX : -1.6 * cote, viseY: srv && N.type === 'service' ? srv.viseY : 16.4 };
    consigne(M.essaisService === 1 ? 'srv.second' : 'srv.lancer');
    if (!P.tutos.service && !demarrage && !document.getElementById('ecranTuto').classList.contains('actif')) { montrerTutos(['service'], () => {}); }
  } else {
    lou.x = lou.cibleX = -1.0 * cote; lou.y = lou.cibleY = -0.6;
    opp.x = opp.cibleX = 0.9 * cote; opp.y = opp.cibleY = 24.6;
    srv = { etape: 'adv', t: 0 };
    consigne(N.type === 'echange' ? 'srv.coach' : 'srv.adv', { nom: tr(A.nom) });
  }
  majHud();
}
function appuiService() {
  if (!srv) return;
  if (srv.etape === 'pret') {
    srv.etape = 'lance'; srv.t = 0; SON.lancer();
    consigne('srv.frapper');
  } else if (srv.etape === 'lance') {
    const ecart = Math.abs(srv.t - 0.5);
    let erreur, cle;
    if (ecart < 0.09) { erreur = 0.22; cle = 'msg.parfait'; }
    else if (ecart < 0.2) { erreur = 0.85; cle = null; }
    else { erreur = 1.9; cle = 'msg.mal'; }
    const a = Math.random() * Math.PI * 2, r = Math.random() * erreur;
    const tx = srv.viseX + Math.cos(a) * r, ty = srv.viseY + Math.sin(a) * r * 0.8;
    const z = balle.z;
    balle.service = true;
    lancerBalle(balle.x, balle.y, z, tx, ty, ecart < 0.09 ? 0.82 : 0.95, 0);
    balle.service = true;
    lou.swing = 1;
    if (ecart < 0.09) { SON.parfait(); etincelles(balle.x, balle.y, balle.z, '#ffe066', 14); M.parfaits++; } else SON.frappe();
    if (cle) annoncerTexte(cle);
    srv.etape = 'parti'; phase = 'echange';
    consigne(null);
    adversaireReagit();
  }
}
function serviceAdversaire() {
  const cote = (M.pts[0] + M.pts[1]) % 2 === 0 ? 1 : -1;
  balle.service = N.type !== 'echange';
  let tx, ty, T;
  if (N.type === 'echange') { tx = (Math.random() - 0.5) * 1.4; ty = 4 + Math.random() * 2; T = 1.7; }
  else {
    tx = -cote * (0.6 + Math.random() * 2.8); ty = 7 + Math.random() * 3.6; T = Math.max(0.95, A.T * 0.8);
    if (Math.random() < A.err * 0.35) { ty = 4.2 - Math.random(); }
  }
  lancerBalle(opp.x, opp.y, 2.5, tx, ty, T, 1);
  balle.service = N.type !== 'echange';
  opp.swing = 1; SON.frappe();
  phase = 'echange'; consigne(null);
  preparerLou();
}

// --------------------------------------------------------------------------
// Fin d'un point
// --------------------------------------------------------------------------

function finPoint(gagnant, cle, vars) {
  if (phase === 'point') return;
  phase = 'point';
  minuteur = 1.35;
  lou.arme = null; aideContact = null;
  if (cle) annoncerTexte(cle, vars, gagnant === 0 ? '#caffbf' : '#ffd6d6');
  if (N.type === 'service') return; // géré par finService
  if (N.type === 'echange') {
    M.meilleur = Math.max(M.meilleur, M.coups);
    if (gagnant === 0) return;
    SON.perdPoint();
    if (M.essai >= 3) { minuteur = 1.2; M.fini = 'perdu'; return; }
    M.essai++; M.coups = 0;
    annoncer(tr('msg.essai', { n: M.essai }));
    return;
  }
  M.pts[gagnant]++;
  M.essaisService = 0;
  if (gagnant === 0) { M.pointsGagnes++; SON.gagnePoint(); } else SON.perdPoint();
  // Jeu gagné ? (premier à 4 points ; à 3 partout, point décisif)
  if (M.pts[gagnant] >= 4) {
    M.jeux[gagnant]++; M.totalJeux[gagnant]++;
    M.pts = [0, 0];
    if (N.engage !== 'adv') M.serveur = 1 - M.serveur;
    M.essaisService = 0;
    const nom = tr(A.nom);
    if (N.sets) {
      if (M.jeux[gagnant] >= N.jeux) {
        M.sets[gagnant]++; M.jeux = [0, 0];
        annoncer(tr(gagnant === 0 ? 'msg.setLou' : 'msg.setAdv', { nom }));
        if (M.sets[gagnant] >= N.sets) M.fini = gagnant === 0 ? 'gagne' : 'perdu';
      } else annoncer(tr(gagnant === 0 ? 'msg.jeuLou' : 'msg.jeuAdv', { nom }));
    } else {
      annoncer(tr(gagnant === 0 ? 'msg.jeuLou' : 'msg.jeuAdv', { nom }));
      if (M.jeux[gagnant] >= N.jeux) M.fini = gagnant === 0 ? 'gagne' : 'perdu';
    }
    if (gagnant === 0) { SON.jeu(); SON.foule(); confettis(14); }
    minuteur = 1.9;
  }
  majHud();
}
let annonceTimer = 0;
function annoncer(texte) {
  const el = document.getElementById('annonce');
  el.textContent = texte; el.style.display = 'block';
  annonceTimer = 1.6;
}
function consigne(cle, vars) {
  const el = document.getElementById('consigneJeu');
  if (!cle) { el.style.display = 'none'; return; }
  el.textContent = tr(cle, vars); el.style.display = 'block';
}

// Rebond de la balle : arbitrage.
function auRebond() {
  const b = balle;
  b.rebonds++;
  if (b.rebonds === 1) {
    SON.rebond();
    poussiere(b.x, b.y);
    const dedans = dansCourt(b.x, b.y, b.auteur, b.service);
    if (N.type === 'service') { finService(dedans); return; }
    if (!dedans) {
      if (b.service && b.auteur === 0) { fauteService(); return; }
      finPoint(1 - b.auteur, 'msg.dehors'); return;
    }
    if (b.auteur === 0) {
      // Cible lumineuse touchée ?
      for (const c of cibles) {
        if (Math.hypot(b.x - c.x, b.y - c.y) <= c.r) {
          M.ciblesTouchees++; SON.cible(); etincelles(b.x, b.y, 0.1, '#9bf6ff', 26);
          if (N.type === 'match' || N.type === 'champion') { finPoint(0, 'msg.cible'); deplacerCible(c); return; }
        }
      }
      if (N.type === 'echange') {
        M.coups++; majHud();
        if (M.coups >= 20) { M.fini = 'gagne'; finPoint(0, 'msg.echangeReussi'); }
      }
    }
  } else if (b.rebonds === 2) {
    SON.rebond();
    // Deuxième rebond : celui qui devait la renvoyer a perdu le point.
    if (b.auteur === 0) {
      if (N.type === 'echange') { opp.y = opp.cibleY; } // l'entraîneur la rattrape toujours (voir mise à jour)
      finPoint(0, b.service ? 'msg.ace' : 'msg.pointLou');
    } else finPoint(1, 'msg.pointAdv', { nom: tr(A.nom) });
  }
}
function deplacerCible(c) {
  const n = nouvelleCible(cibles.indexOf(c));
  Object.assign(c, n);
}
function fauteService() {
  M.essaisService++;
  SON.faute();
  if (M.essaisService >= 2) { M.essaisService = 0; finPoint(1, 'msg.doubleFaute'); }
  else { phase = 'point'; minuteur = 1.1; annoncerTexte('msg.faute', null, '#ffd6d6'); M.rejouerService = true; }
}
function finService(dedans) {
  M.services++;
  let touche = false;
  if (dedans) {
    for (const c of cibles) {
      if (Math.hypot(balle.x - c.x, balle.y - c.y) <= c.r) { touche = true; deplacerCible(c); break; }
    }
  }
  if (touche) { M.reussis++; SON.cible(); etincelles(balle.x, balle.y, 0.1, '#9bf6ff', 26); annoncerTexte('msg.cible'); }
  else if (!dedans) { SON.faute(); annoncerTexte('msg.faute', null, '#ffd6d6'); }
  else { SON.rebond(); annoncerTexte('msg.rate', null, '#ffe5b4'); }
  phase = 'point'; minuteur = 1.1;
  if (M.services >= 8) M.fini = M.reussis >= N.besoin ? 'gagne' : 'perdu';
  majHud();
}

// --------------------------------------------------------------------------
// Boucle de jeu
// --------------------------------------------------------------------------

let dernier = 0;
function boucle(t) {
  const dtReel = Math.min(0.05, (t - (dernier || t)) / 1000);
  dernier = t;
  tempsJeu += dtReel;
  if (etat === 'jeu' && !enPause) {
    let reste = dtReel;
    while (reste > 0 && etat === 'jeu' && !enPause) { const d = Math.min(1 / 120, reste); maj(d); reste -= d; }
  }
  if (!enPause) majParticules(dtReel);
  dessiner();
  requestAnimationFrame(boucle);
}

function maj(dt) {
  // Entrées clavier
  if (touches.gauche || touches.droite) {
    const dx = (touches.droite ? 1 : 0) - (touches.gauche ? 1 : 0);
    if (phase === 'service' && M.serveur === 0 && srv && srv.etape !== 'parti') {
      srv.viseX = Math.max(-3.9, Math.min(3.9, srv.viseX + dx * 4 * dt));
    } else lou.cibleX = Math.max(-5.2, Math.min(5.2, lou.x + dx * 2));
  }
  if (phase === 'service' && M.serveur === 0 && srv && srv.etape !== 'parti' && (touches.haut || touches.bas)) {
    srv.viseY = Math.max(12.6, Math.min(18.2, srv.viseY + ((touches.haut ? 1 : 0) - (touches.bas ? 1 : 0)) * 4 * dt));
  }
  if (annonceTimer > 0) { annonceTimer -= dt; if (annonceTimer <= 0) document.getElementById('annonce').style.display = 'none'; }
  ventAff += (vent - ventAff) * Math.min(1, dt * 3);
  if (secousse > 0) secousse = Math.max(0, secousse - dt * 30);
  // Déplacements
  deplacer(lou, lou.vit, dt);
  if (lou.recup > 0) lou.recup -= dt;
  if (lou.swing > 0) lou.swing = Math.max(0, lou.swing - dt * 3.2);
  if (opp.swing > 0) opp.swing = Math.max(0, opp.swing - dt * 3.2);
  if (opp.reac > 0) opp.reac -= dt;
  else deplacer(opp, A ? A.vit * (opp.auFilet && opp.cibleY > opp.y + 1 ? 0.6 : 1) : 4, dt);
  // Cibles qui bougent (épreuves de service, rayon du phare)
  for (const c of cibles) {
    c.ph += dt;
    if (N.mobiles) c.x = Math.max(-3.4, Math.min(3.4, c.x + Math.cos(c.ph * N.mobiles * 1.2) * dt * N.mobiles * 1.6));
    if (N.phare) { c.x = Math.sin(tempsJeu * 0.55) * 3.0; c.y = 19.5 + Math.cos(tempsJeu * 0.4) * 2.6; }
  }
  if (N.phare && cibles.length === 0) cibles.push({ x: 0, y: 19, r: 1.0, ph: 0, eclat: 0 });

  if (phase === 'service') {
    srv.t += dt;
    if (M.serveur === 0) {
      if (srv.etape === 'pret') { balle.actif = true; balle.x = lou.x + 0.35; balle.y = lou.y + 0.2; balle.z = 1.0; balle.auteur = -1; }
      else if (srv.etape === 'lance') {
        balle.z = 1.2 + 6.2 * srv.t - 6.2 * srv.t * srv.t; // sommet à 0,5 s
        if (balle.z < 0.9 && srv.t > 0.5) { srv.etape = 'parti'; balle.actif = false; if (N.type === 'service') finService(false); else fauteService(); consigne(null); }
      }
    } else {
      balle.actif = true; balle.x = opp.x - 0.3; balle.y = opp.y; balle.auteur = -1;
      balle.z = srv.t < 0.6 ? 1.2 + srv.t * 2.2 : 2.5;
      if (srv.t > (N.type === 'echange' ? 0.7 : 1.1)) serviceAdversaire();
    }
    return;
  }
  if (phase === 'point') {
    if (balle.actif) bougerBalle(dt, true);
    minuteur -= dt;
    if (minuteur <= 0) {
      if (M.fini) { terminerNiveau(M.fini === 'gagne'); return; }
      if (M.rejouerService) { M.rejouerService = false; preparerPoint(); return; }
      preparerPoint();
    }
    return;
  }
  if (phase === 'echange' && balle.actif) bougerBalle(dt, false);
}

function deplacer(j, vit, dt) {
  const dx = j.cibleX - j.x, dy = j.cibleY - j.y;
  const d = Math.hypot(dx, dy);
  if (d < 0.01) return;
  const pas = Math.min(d, vit * dt);
  j.x += dx / d * pas; j.y += dy / d * pas;
}

function bougerBalle(dt, finie) {
  const b = balle, s = SURFACES[N.surface];
  const yAvant = b.y;
  b.vx += ventSur(b.z) * dt;
  b.vz -= G * dt;
  b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
  if (Math.floor(tempsJeu * 60) % 2 === 0) { b.trainee.push({ x: b.x, y: b.y, z: b.z }); if (b.trainee.length > 9) b.trainee.shift(); }
  // Filet
  if (!finie && (yAvant - 12) * (b.y - 12) <= 0 && b.z < 0.92 && b.rebonds === 0) {
    b.vy = -b.vy * 0.15; b.vx *= 0.3; b.y = yAvant; SON.filet();
    if (N.type === 'service') { finService(false); return; }
    if (b.service && b.auteur === 0) { fauteService(); return; }
    finPoint(1 - b.auteur, 'msg.filet'); return;
  }
  if (b.z <= 0) {
    b.z = 0;
    b.vz = -b.vz * s.rest; b.vx *= s.garde; b.vy *= s.garde;
    if (Math.abs(b.vz) < 0.6) b.vz = 0;
    if (!finie) auRebond();
    else if (b.rebonds < 3) b.rebonds++;
  }
  if (Math.abs(b.vy) < 0.3 && b.z <= 0.01) { b.vx *= 0.96; b.vy *= 0.96; }
  if (finie) return;
  // Lou frappe ?
  if (b.auteur === 1 && lou.arme && b.y <= lou.y + 0.25) { frappeLou(); return; }
  // Balle passée derrière Lou sans être frappée
  if (b.auteur === 1 && b.y < lou.y - 0.3 && lou.arme) { lou.arme = null; lou.swing = 1; SON.vide(); }
  // L'adversaire frappe ?
  if (b.auteur === 0 && b.vy > 0 && !b.dehors && (b.rebonds === 1 || opp.auFilet) && Math.abs(b.y - opp.y) < 0.5) {
    const portee = N.type === 'echange' ? 9 : A.portee + (opp.auFilet ? 0.25 : 0);
    const hauteurMax = opp.auFilet ? 2.7 : 3.4;
    if (Math.abs(b.x - opp.x) <= portee && b.z <= hauteurMax) { frappeAdversaire(); return; }
  }
  // Lob par-dessus le joueur au filet : il repart vers le fond
  if (opp.auFilet && b.auteur === 0 && b.rebonds === 0 && b.y > opp.y + 0.6) {
    opp.auFilet = false; opp.reac = 0.25;
    const p = pointDeFrappe(false);
    opp.cibleY = p ? p.y : 24.6; opp.cibleX = p ? p.x : b.x;
  }
  // Entraîneur : il rattrape tout ce qui est dans le court
  if (N.type === 'echange' && b.auteur === 0 && b.rebonds === 1 && b.y > 23 && !b.dehors) { opp.x = b.x; opp.y = b.y; frappeAdversaire(); return; }
  // Sortie loin du court sans rebond
  if (b.y < -8 || b.y > 32) {
    if (b.rebonds === 0) finPoint(1 - b.auteur, 'msg.dehors');
    else finPoint(b.auteur, b.auteur === 0 ? 'msg.pointLou' : 'msg.pointAdv', { nom: tr(A ? A.nom : 'adv1') });
  }
}

// --------------------------------------------------------------------------
// Effets
// --------------------------------------------------------------------------

function etincelles(x, y, z, couleur, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 3;

}

    ctx.fillStyle = '#f6dca0'; ctx.beginPath(); ctx.ellipse(cx, cy + 4, rx, ry, 0, 0, 7); ctx.fill();

  etat = 'fin';
  modeJeu(false);
  const i = niveauCourant;
  let etoiles = 0, resultat = '';
  if (N.type === 'service') {
    etoiles = gagne ? (M.reussis >= N.s3 ? 3 : M.reussis >= N.s2 ? 2 : 1) : 0;
    resultat = tr('fin.service', { n: M.reussis });
  } else if (N.type === 'echange') {
    etoiles = gagne ? 4 - M.essai : 0;
    resultat = gagne ? tr('fin.echangeReussi', { n: M.essai }) : tr('fin.echangeRate', { n: M.meilleur });
  } else if (N.sets) {
    const perdus = M.totalJeux[1];
    etoiles = gagne ? (M.sets[1] === 0 ? (perdus <= 1 ? 3 : 2) : 1) : 0;
    resultat = tr('fin.sets', { a: M.sets[0], b: M.sets[1] }) + ' · ' + tr('fin.jeux', { a: M.totalJeux[0], b: M.totalJeux[1] });
  } else {
    const perdus = M.totalJeux[1];
    etoiles = gagne ? (perdus === 0 ? 3 : perdus <= Math.max(1, N.jeux - 2) ? 2 : 1) : 0;
    resultat = tr('fin.jeux', { a: M.totalJeux[0], b: M.totalJeux[1] });
  }
  const score = M.pointsGagnes * 10 + M.parfaits * 5 + M.ciblesTouchees * 30 + (N.type === 'service' ? M.reussis * 40 : 0) + (N.type === 'echange' ? M.meilleur * 8 : 0) + (gagne ? 100 + etoiles * 50 : 0);
  const ancienRecord = P.records[i];
  const record = score > ancienRecord;
  if (record) P.records[i] = score;
  let bonus = '';
  if (gagne) {
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
    const avant = etoilesTotal();
    P.gagnes[i] = true;
    P.etoiles[i] = Math.max(P.etoiles[i], etoiles);
    scoreTotal += score;
    if (P.etoiles[i] >= 3 && !P.balles.includes(i)) { P.balles.push(i); bonus = tr('fin.balle', { nom: tr('balle' + i) }); }
    const apres = etoilesTotal();
    const debloque = [RAQUETTES, BANDEAUX, TENUES].some((liste) => liste.some((o) => o.e > avant && o.e <= apres));
    if (debloque) bonus = (bonus ? bonus + ' · ' : '') + tr('fin.vestiaire');
    sauver(Math.min(NIVEAUX.length, i + 2));
    if (toutGagne()) { if (window.FMG) window.FMG.reportComplete({ stars: etoilesTotal(), maxStars: NIVEAUX.length * 3 }); }
    SON.victoire(); confettis(40);
  } else {
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: i + 1 });
    sauver(i + 1);
    SON.defaite();
  }
  montrer('ecranFin');
  document.getElementById('finTitre').textContent = tr(gagne ? (N.type === 'champion' ? 'fin.champion' : 'fin.victoire') : 'fin.defaite');
  majEtoilesEl(document.getElementById('finEtoiles'), etoiles, true);
  document.getElementById('finResultat').textContent = resultat;
  document.getElementById('finScore').textContent = tr('fin.score', { n: nb(score) });
  document.getElementById('finRecord').textContent = record && ancienRecord > 0 ? tr('fin.nouveauRecord') : tr('record', { n: nb(P.records[i]) });
  document.getElementById('finBonus').textContent = bonus;
  document.getElementById('finBonus').style.display = bonus ? 'block' : 'none';
  const principal = document.getElementById('btnFinPrincipal');
  finGagne = gagne;
  principal.textContent = tr(gagne ? (i === NIVEAUX.length - 1 ? 'fin.trophee' : 'fin.suivant') : 'fin.reessayer');
  setTimeout(() => principal.focus({ preventScroll: true }), 60);
}
let finGagne = false;

function niveauSuivant() {
  const i = niveauCourant;
  if (i === NIVEAUX.length - 1) { montrerFinal(); return; }
  // Prochain court : le premier ouvert pas encore gagné après celui-ci, sinon le suivant.
  let j = -1;
  for (let k = i + 1; k < NIVEAUX.length; k++) if (estOuvert(k) && !P.gagnes[k]) { j = k; break; }
  if (j < 0) j = conseille();
  if (P.gagnes[j] && i + 1 < NIVEAUX.length && estOuvert(i + 1)) j = i + 1;
  ouvrirIntro(j);
}
function montrerFinal() {
  etat = 'final';
  montrer('ecranFinal');
  document.getElementById('finalEtoiles').textContent = tr('etoilesTotal', { n: etoilesTotal(), max: NIVEAUX.length * 3 });
  document.getElementById('finalBalles').textContent = tr('final.balles', { n: P.balles.length, max: BALLES.length });
  confettis(60); SON.victoire();
}

// Vestiaire
function ouvrirVestiaire() {
  etat = 'vestiaire'; montrer('ecranVestiaire');
  const e = etoilesTotal();
  document.getElementById('vestEtoiles').textContent = tr('etoilesTotal', { n: e, max: NIVEAUX.length * 3 });
  const remplir = (id, liste, cle, dessin) => {
    const g = document.getElementById(id); g.innerHTML = '';
    liste.forEach((o, i) => {
      const b = document.createElement('button');
      const ok = e >= o.e;
      b.className = 'objet' + (P[cle] === i ? ' choisi' : '') + (ok ? '' : ' verrou');
      const c = document.createElement('canvas'); c.width = 108; c.height = 108;
      dessin(c.getContext('2d'), o, ok);
      const l = document.createElement('span');
      l.textContent = ok ? tr(cle + i) : tr('verrou', { n: o.e });
      b.appendChild(c); b.appendChild(l);
      b.addEventListener('click', () => {
        if (!ok) { SON.faute(); return; }
        SON.clic(); P[cle] = i; sauver(); ouvrirVestiaire();
      });
      g.appendChild(b);
    });
  };
  remplir('grilleRaq', RAQUETTES, 'raq', (c, o) => { c.strokeStyle = '#5a3d2b'; c.lineWidth = 8; c.beginPath(); c.moveTo(30, 90); c.lineTo(50, 64); c.stroke(); c.strokeStyle = o.c; c.lineWidth = 8; c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.ellipse(66, 40, 26, 32, 0.6, 0, 7); c.fill(); c.stroke(); });
  remplir('grilleBand', BANDEAUX, 'band', (c, o) => { c.fillStyle = '#b5651d'; c.beginPath(); c.arc(54, 58, 32, 0, 7); c.fill(); c.fillStyle = '#f2c9a0'; c.beginPath(); c.arc(54, 66, 26, 0, Math.PI); c.fill(); c.fillStyle = o.c; c.strokeStyle = '#555'; c.lineWidth = 2; c.fillRect(20, 42, 68, 12); c.strokeRect(20, 42, 68, 12); });
  remplir('grilleTen', TENUES, 'ten', (c, o) => { c.fillStyle = o.haut; c.beginPath(); c.roundRect(32, 16, 44, 46, 12); c.fill(); c.fillStyle = o.bas; c.strokeStyle = '#999'; c.lineWidth = 2; c.beginPath(); c.moveTo(28, 92); c.lineTo(80, 92); c.lineTo(74, 62); c.lineTo(34, 62); c.closePath(); c.fill(); c.stroke(); });
}
// Collection des balles rares
function ouvrirBalles() {
  etat = 'balles'; montrer('ecranBalles');
  const g = document.getElementById('grilleBalles'); g.innerHTML = '';
  const liste = [-1].concat(BALLES.map((_, i) => i));
  liste.forEach((i) => {
    const ok = i < 0 || P.balles.includes(i);
    const b = document.createElement('button');
    b.className = 'objet' + (P.balle === i || (i < 0 && !P.balles.includes(P.balle)) ? ' choisi' : '') + (ok ? '' : ' verrou');
    const c = document.createElement('canvas'); c.width = 108; c.height = 108;
    const c2 = c.getContext('2d');
    if (ok) dessinerBalleCtx(c2, 54, 54, 36, i < 0 ? ['#d4f04a', '#ffffff', 0] : BALLES[i]);
    else {
      // silhouette grise et petit cadenas dessiné
      c2.fillStyle = '#c9c3b2'; c2.beginPath(); c2.arc(54, 54, 36, 0, 7); c2.fill();
      c2.strokeStyle = '#8d8778'; c2.lineWidth = 6; c2.beginPath(); c2.arc(54, 48, 11, Math.PI, 0); c2.stroke();
      c2.fillStyle = '#8d8778'; c2.beginPath(); c2.roundRect(38, 48, 32, 24, 5); c2.fill();
    }
    const l = document.createElement('span');
    l.textContent = ok ? tr(i < 0 ? 'balleBase' : 'balle' + i) : tr('balleVerrou', { n: i + 1 });
    b.appendChild(c); b.appendChild(l);
    b.addEventListener('click', () => { if (!ok) { SON.faute(); return; } SON.clic(); P.balle = i; sauver(); ouvrirBalles(); });
    g.appendChild(b);
  });
}
function dessinerBalleCtx(c, sx, sy, r, def) {
  c.fillStyle = def[0]; c.beginPath(); c.arc(sx, sy, r, 0, 7); c.fill();
  c.save(); c.beginPath(); c.arc(sx, sy, r, 0, 7); c.clip();
  c.strokeStyle = def[1]; c.lineWidth = Math.max(1, r * 0.22); c.fillStyle = def[1];
  if (def[2] === 0 || def[2] === 2) { c.beginPath(); c.arc(sx - r * 1.1, sy, r * 0.9, -1, 1); c.stroke(); c.beginPath(); c.arc(sx + r * 1.1, sy, r * 0.9, Math.PI - 1, Math.PI + 1); c.stroke(); }
  if (def[2] === 1) { for (let i = 0; i < 5; i++) { const a = i * 1.26; c.beginPath(); c.arc(sx + Math.cos(a) * r * 0.5, sy + Math.sin(a) * r * 0.5, r * 0.2, 0, 7); c.fill(); } }
  if (def[2] === 2) { c.beginPath(); c.arc(sx, sy, r * 0.25, 0, 7); c.fill(); }
  if (def[2] === 3) { c.beginPath(); c.moveTo(sx - r, sy - r * 0.3); c.lineTo(sx + r, sy - r * 0.3); c.moveTo(sx - r, sy + r * 0.3); c.lineTo(sx + r, sy + r * 0.3); c.stroke(); }
  c.restore();
  c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.arc(sx - r * 0.35, sy - r * 0.35, r * 0.28, 0, 7); c.fill();
}

// Pause
function mettrePause() {
  if (etat !== 'jeu' || enPause || document.getElementById('ecranTuto').classList.contains('actif')) return;
  enPause = true; montrer('ecranPause');
  document.getElementById('btnReprendre').focus({ preventScroll: true });
}
function reprendre() { if (etat !== 'jeu') return; enPause = false; montrer(null); dernier = 0; }

// --------------------------------------------------------------------------
// Entrées : doigt, souris, clavier
// --------------------------------------------------------------------------

const touches = { gauche: false, droite: false, haut: false, bas: false };
function viserDepuisEcran(sx, sy) {
  if (etat !== 'jeu' || enPause || !N) return;
  if (phase === 'service' && M.serveur === 0 && srv && srv.etape !== 'parti') {
    const p = deproj(sx, sy);
    srv.viseX = Math.max(-3.9, Math.min(3.9, p.x));
    srv.viseY = Math.max(12.6, Math.min(18.2, p.y));
    return;
  }
  // Lou suit le doigt (à sa profondeur)
  const d = Math.max(1, lou.y - CAM_Y);
  lou.cibleX = Math.max(-5.2, Math.min(5.2, (sx - CX) * d / FX));
}
canvas.addEventListener('pointerdown', (e) => {
  audio();
  if (etat !== 'jeu' || enPause) return;
  if (e.pointerType === 'mouse') { if (e.button === 2 && !btnL.classList.contains('cache')) appui(true); else if (e.button !== 2) appui(false); return; }
  viserDepuisEcran(e.clientX, e.clientY);
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) viserDepuisEcran(e.clientX, e.clientY);
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
const btnF = document.getElementById('btnFrapper'), btnL = document.getElementById('btnLob');
for (const [b, lob] of [[btnF, false], [btnL, true]]) {
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); b.classList.add('presse'); appui(lob); });
  const fin = () => b.classList.remove('presse');
  b.addEventListener('pointerup', fin); b.addEventListener('pointercancel', fin); b.addEventListener('pointerleave', fin);
  b.addEventListener('keydown', (e) => { if (e.code === 'Enter' || e.code === 'Space') e.preventDefault(); });
}
window.addEventListener('keydown', (e) => {
  const c = e.code;
  if (etat === 'jeu') {
    if (c === 'Escape' || c === 'KeyP') { e.preventDefault(); if (document.getElementById('ecranTuto').classList.contains('actif')) return; if (enPause) reprendre(); else mettrePause(); return; }
    if (enPause) return;
    if (c === 'ArrowLeft' || c === 'KeyA' || c === 'KeyQ') { touches.gauche = true; e.preventDefault(); }
    if (c === 'ArrowRight' || c === 'KeyD') { touches.droite = true; e.preventDefault(); }
    if (c === 'ArrowUp' || c === 'KeyW' || c === 'KeyZ') { touches.haut = true; e.preventDefault(); }
    if (c === 'ArrowDown' || c === 'KeyS') { touches.bas = true; e.preventDefault(); }
    if ((c === 'Space' || c === 'Enter') && !e.repeat) { e.preventDefault(); appui(false); }
    if ((c === 'KeyL' || c === 'ShiftLeft' || c === 'ShiftRight') && !e.repeat) { e.preventDefault(); if (!btnL.classList.contains('cache')) appui(true); }
    if (c === 'ArrowUp' && !e.repeat && !(phase === 'service' && M.serveur === 0) && !btnL.classList.contains('cache')) appui(true);
  }
});
window.addEventListener('keyup', (e) => {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA' || c === 'KeyQ') touches.gauche = false;
  if (c === 'ArrowRight' || c === 'KeyD') touches.droite = false;
  if (c === 'ArrowUp' || c === 'KeyW' || c === 'KeyZ') touches.haut = false;
  if (c === 'ArrowDown' || c === 'KeyS') touches.bas = false;
});
document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });
window.addEventListener('resize', redimensionner);

// Boutons des écrans
function surClic(id, f) { document.getElementById(id).addEventListener('click', () => { audio(); SON.clic(); f(); }); }
surClic('btnJouer', () => {
  window.JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => {
      chargerProg();
      const n = Math.max(1, Math.min(NIVEAUX.length, Number(d && d.niveau) || 1));
      ouvrirIntro(n - 1);
    },
    // Première fois : directement au premier court ; sinon la carte.
    onNouvelle: () => { chargerProg(); if (P.gagnes.some(Boolean)) allerCarte(); else ouvrirIntro(0); },
  });
});
surClic('btnVestiaire', ouvrirVestiaire);
surClic('btnBalles', ouvrirBalles);
surClic('btnVestRetour', allerTitre);
surClic('btnBallesRetour', allerTitre);
surClic('btnCarteRetour', allerTitre);
surClic('btnIntroRetour', allerCarte);
surClic('btnIntroJouer', () => lancerNiveau(niveauCourant));
surClic('btnTutoOk', prochainTuto);
surClic('btnReprendre', reprendre);
surClic('btnRecommencer', () => lancerNiveau(niveauCourant));
surClic('btnPauseCarte', allerCarte);
surClic('btnFinPrincipal', () => { if (finGagne) niveauSuivant(); else lancerNiveau(niveauCourant); });
surClic('btnFinRejouer', () => lancerNiveau(niveauCourant));
surClic('btnFinCarte', allerCarte);
surClic('btnFinalCarte', allerCarte);
document.getElementById('btnPause').addEventListener('click', () => { audio(); mettrePause(); });
const btnSon = document.getElementById('btnSon');
function majSon() { btnSon.textContent = P.son ? '🔊' : '🔇'; }
btnSon.addEventListener('click', () => {
  audio(); P.son = !P.son; majSon(); if (P.son) SON.clic();
  if (etat !== 'titre' || window.JEL_SAVE.existe(JEU)) sauver();
});

// Sauvegarde à la fermeture de la page (jamais depuis l'écran titre)
window.JEL_SAVE.surFermeture(() => {
  if (etat === 'titre' || etat === 'vestiaire' || etat === 'balles') return;
  sauver(niveauCourant + 1);
});

// Démarrage
chargerProg();
majSon();
redimensionner();
requestAnimationFrame(boucle);
</script>
