<script>
(function () {
  'use strict';

  // =====================================================================
  //  Le Marché aux Devinettes — jeu de plateau et de devinettes (4 places)
  //  On lance son panier, on choisit son étal, on répond à la devinette en
  //  images : chaque bonne réponse remplit le panier. Solo : 20 niveaux
  //  contre 3 robots. En ligne : de vrais joueurs remplacent les robots
  //  (moteur commun JEL_MULTI). Les règles sont dans le bloc jel-regles.
  // =====================================================================

  const JEU = 'marche-aux-devinettes';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = R.niveaux;                // mêmes données que les règles
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);
  const copie = (x) => JSON.parse(JSON.stringify(x));

  // Une couleur et un petit marchand par place : 0 Fraise, 1 Citron, 2 Myrtille, 3 Petit Pois.
  const COUL = ['#e2364a', '#e0a100', '#3d5fd0', '#2f9a46'];
  const COUL_F = ['#8f1626', '#7a5300', '#1f3486', '#175a26'];

  // Couleur des étals selon leur devinette.
  const COUL_CAT = {
    pousse: '#3f9a3a', famille: '#e2364a', ferme: '#a0612a', saison: '#f08a1c', noix: '#7a4a24',
    intrus: '#7b3fa8', recette: '#2f6fe0', monde: '#14898a'
  };

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#fff"/><circle cx="10.4" cy="8" r="1.6" fill="#fff"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#fff"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';

  // Étapes des recettes : [ustensile, ingrédients montrés]
  const ETAPES = {
    crepes: [['bol', 'farine', 'oeuf'], ['fouet', 'lait'], ['poele', 'crepe'], ['assiette', 'crepe']],
    soupe: [['couteau', 'carotte'], ['marmite', 'carotte'], ['mixeur'], ['bolsoupe']],
    gateau: [['bol', 'yaourt', 'oeuf'], ['fouet', 'farine'], ['moule'], ['four', 'gateau']],
    pain: [['bol', 'farine'], ['mains'], ['lever'], ['four', 'pain']],
    compote: [['couteau', 'pomme'], ['marmite', 'pomme'], ['ecraser'], ['bol', 'compote']],
    pizza: [['rouleau'], ['sauce'], ['garnir'], ['four', 'pizza']],
    omelette: [['casser'], ['fouet', 'oeuf'], ['poele', 'omelette'], ['assiette', 'omelette']],
    jus: [['couteau', 'orange'], ['presse'], ['verre'], ['paille']],
    fruits: [['eau', 'pomme'], ['couteau', 'fraise'], ['bol', 'banane', 'fraise'], ['coupe']]
  };

  // Chapitres du livre des ingrédients.
  const CHAPITRES = [
    ['fruits', Object.keys(O.AL).filter((x) => O.prop(x, 0) === 'f')],
    ['legumes', Object.keys(O.AL).filter((x) => O.prop(x, 0) === 'l' || x === 'tomate' || x === 'champignon')],
    ['noix', Object.keys(O.AL).filter((x) => O.prop(x, 0) === 'n')],
    ['ferme', Object.keys(O.AL).filter((x) => O.prop(x, 0) === 'a')],
    ['cereales', Object.keys(O.AL).filter((x) => O.prop(x, 0) === 'c')],
    ['monde', Object.keys(O.PLATS)]
  ];
  const TOUS_LIVRE = CHAPITRES.reduce((l, c) => l.concat(c[1]), []);

  // Étals du marché (pour la liste des étals ouverts) et niveau où chacun arrive.
  const ETALS = (() => {
    const l = [];
    NIVEAUX.forEach((nv, i) => {
      nv.cats.forEach((c) => { if (!l.some((x) => x[0] === c)) l.push([c, i + 1]); });
      ['or', 'puces', 'char'].forEach((k) => { if (nv[k] && !l.some((x) => x[0] === k)) l.push([k, i + 1]); });
    });
    return l;
  })();

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = { etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, tutos: [], livre: [], options: { son: true } };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 999, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string' && TUTOS[x]);
      if (Array.isArray(d.livre)) prog.livre = d.livre.filter((x) => typeof x === 'string' && TOUS_LIVRE.indexOf(x) >= 0);
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.livre = [];
  }

  function sauver(niveauReprise, score) {
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
        debloque: prog.debloque, tutos: prog.tutos.slice(), livre: prog.livre.slice(), options: { son: prog.options.son }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Le son se règle aussi depuis l'écran titre : jamais de nouvelle sauvegarde là.
  function sauverSon() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: prog.options.son } }); } catch (e) { /* rien */ }
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);

  // Un ingrédient découvert entre dans le livre (gardé avec la sauvegarde de la partie solo).
  let livreNouveau = false;
  function decouvrir(id) {
    if (!id || TOUS_LIVRE.indexOf(id) < 0 || prog.livre.indexOf(id) >= 0) return;
    prog.livre.push(id);
    livreNouveau = true;
  }

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      const v = o.vol || 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.025, d / 4));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      osc.connect(g); sortie.connect(ac.destination);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  const sons = {
    clic: () => note(660, 0.06, { type: 'triangle', vol: 0.07 }),
    lancer: () => { note(300, 0.25, { type: 'triangle', vol: 0.06, vers: 900 }); note(500, 0.12, { type: 'square', vol: 0.03, filtre: 1200, retard: 0.28 }); },
    pas: (k) => note(520 + k * 70, 0.07, { type: 'triangle', vol: 0.07, retard: k * 0.14 }),
    bonne: () => [659, 784, 1047].forEach((f, i) => note(f, 0.16, { type: 'triangle', vol: 0.1, retard: i * 0.08 })),
    mauvaise: () => { note(220, 0.18, { type: 'square', vol: 0.05, filtre: 700, vers: 150 }); note(160, 0.22, { type: 'triangle', vol: 0.08, retard: 0.12 }); },
    pop: (k) => note(880 + k * 220, 0.08, { type: 'sine', vol: 0.1, vers: 1400, retard: 0.25 + k * 0.15 }),
    or: () => [1319, 1568, 1976, 2349].forEach((f, i) => note(f, 0.12, { type: 'sine', vol: 0.05, retard: i * 0.06 })),
    echange: () => { note(400, 0.3, { type: 'triangle', vol: 0.07, vers: 900 }); note(900, 0.3, { type: 'triangle', vol: 0.07, vers: 400, retard: 0.15 }); },
    charrette: () => [0, 0.12, 0.24, 0.36].forEach((r) => note(140, 0.08, { type: 'square', vol: 0.04, filtre: 500, retard: r })),
    victoire: () => [523, 659, 784, 1047].forEach((f, i) => note(f, 0.26, { type: 'triangle', vol: 0.11, retard: i * 0.13 })),
    defaite: () => [392, 330, 262].forEach((f, i) => note(f, 0.3, { vol: 0.11, retard: i * 0.18 })),
    tic: () => note(1250, 0.04, { type: 'square', vol: 0.035 }),
    arrive: () => { note(660, 0.12, { vol: 0.09 }); note(880, 0.16, { vol: 0.09, retard: 0.1 }); },
    part: () => { note(880, 0.12, { vol: 0.07 }); note(587, 0.16, { vol: 0.07, retard: 0.1 }); },
    tour: () => note(988, 0.1, { vol: 0.06 }),
    non: () => note(180, 0.12, { type: 'triangle', vol: 0.06 })
  };

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.textContent = prog.options.son ? '🔊' : '🔇';
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    sauverSon();
    majBoutonsSon();
    sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Dessins (canvas) : outils
  // ---------------------------------------------------------------------

  function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }
  function rond(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r);
    else { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  }
  // Remplit (et trace) le chemin en cours.
  function P(c, coul, trait) { c.fillStyle = coul; c.fill(); if (trait) { c.strokeStyle = trait; c.stroke(); } }
  function feuille(c, x, y, l, ang, coul) {
    c.save(); c.translate(x, y); c.rotate(ang);
    c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(l * 0.5, -l * 0.38, l, 0); c.quadraticCurveTo(l * 0.5, l * 0.38, 0, 0);
    c.fillStyle = coul || '#4caa3c'; c.fill();
    c.strokeStyle = 'rgba(0,60,0,.35)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(l * 0.1, 0); c.lineTo(l * 0.85, 0); c.stroke();
    c.restore();
  }
  function tige(c, x1, y1, x2, y2, coul, ep) {
    c.save(); c.strokeStyle = coul || '#6b4a22'; c.lineWidth = ep || 4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x1, y1); c.quadraticCurveTo((x1 + x2) / 2 + 5, (y1 + y2) / 2, x2, y2); c.stroke(); c.restore();
  }
  function reflet(c, x, y, rx, ry) { c.fillStyle = 'rgba(255,255,255,.5)'; ell(c, x, y, rx, ry, -0.6); c.fill(); }
  function oeil(c, x, y, r) {
    c.fillStyle = '#fff'; rond(c, x, y, r); c.fill();
    c.fillStyle = '#1b1b1b'; rond(c, x + r * 0.15, y + r * 0.1, r * 0.6); c.fill();
    c.fillStyle = '#fff'; rond(c, x + r * 0.35, y - r * 0.18, r * 0.22); c.fill();
  }
  function sourire(c, x, y, l) {
    c.save(); c.strokeStyle = '#3b1a0a'; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath(); c.arc(x, y - l * 0.4, l, 0.25 * Math.PI, 0.75 * Math.PI); c.stroke(); c.restore();
  }
  function etoile(c, x, y, r, coul, rot) {
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = (rot || 0) - Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r;
      c.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2);
    }
    c.closePath(); c.fillStyle = coul; c.fill();
  }
  // Hasard fixe pour le décor (même dessin à chaque fois).
  function graineHasard(g) { let a = g >>> 0; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; }

  // ---------------------------------------------------------------------
  //  Dessins des aliments, plats, animaux et arbres (boîte de -50 à 50)
  // ---------------------------------------------------------------------

  function formePomme(c, coul, trait) {
    c.beginPath(); c.moveTo(0, -26);
    c.bezierCurveTo(20, -42, 46, -24, 40, 4); c.bezierCurveTo(36, 32, 16, 44, 0, 36);
    c.bezierCurveTo(-16, 44, -36, 32, -40, 4); c.bezierCurveTo(-46, -24, -20, -42, 0, -26);
    P(c, coul, trait);
  }
  function rondFruit(c, x, y, r, coul, trait) { rond(c, x, y, r); P(c, coul, trait); }
  function pepins(c, liste, coul) { c.fillStyle = coul; liste.forEach((p) => { ell(c, p[0], p[1], 2.2, 3.4, p[2] || 0); c.fill(); }); }
  function feuillesHaut(c, x, y, n, l, coul) { for (let i = 0; i < n; i++) feuille(c, x, y, l, -Math.PI / 2 + (i - (n - 1) / 2) * 0.55, coul); }

  const DESSINS = {
    // --- Fruits ---
    pomme: (c) => { formePomme(c, '#e0322f', '#9e1c1a'); tige(c, 0, -26, 4, -44); feuille(c, 4, -38, 22, -0.5); reflet(c, -20, -8, 7, 12); },
    poire: (c) => {
      c.beginPath(); c.moveTo(0, -38); c.bezierCurveTo(15, -38, 13, -14, 25, 2); c.bezierCurveTo(42, 24, 27, 44, 0, 44);
      c.bezierCurveTo(-27, 44, -42, 24, -25, 2); c.bezierCurveTo(-13, -14, -15, -38, 0, -38); P(c, '#b9cf3c', '#7b8f1c');
      tige(c, 0, -36, -3, -48); feuille(c, -2, -44, 18, -0.3); reflet(c, -16, 14, 6, 11);
    },
    cerise: (c) => {
      tige(c, -16, 10, 4, -40, '#5a7a22', 3); tige(c, 18, 14, 4, -40, '#5a7a22', 3); feuille(c, 4, -40, 24, -0.2);
      rondFruit(c, -16, 20, 18, '#c8102e', '#7d0a1c'); rondFruit(c, 18, 24, 18, '#d4163a', '#7d0a1c');
      reflet(c, -22, 14, 4, 7); reflet(c, 12, 18, 4, 7);
    },
    abricot: (c) => {
      rondFruit(c, 0, 6, 38, '#f5a034', '#c47012');
      c.fillStyle = 'rgba(230,90,40,.35)'; rond(c, 14, 14, 20); c.fill();
      c.strokeStyle = 'rgba(160,70,10,.6)'; c.lineWidth = 3; c.beginPath(); c.moveTo(-2, -30); c.quadraticCurveTo(-14, 6, -2, 42); c.stroke();
      feuille(c, 2, -30, 22, -0.6); reflet(c, -18, -6, 6, 10);
    },
    peche: (c) => {
      rondFruit(c, 0, 6, 39, '#f9b183', '#d06a48');
      c.fillStyle = 'rgba(230,60,70,.4)'; rond(c, 12, 10, 24); c.fill();
      c.strokeStyle = 'rgba(170,50,40,.5)'; c.lineWidth = 3; c.beginPath(); c.moveTo(-4, -30); c.quadraticCurveTo(-16, 6, -4, 44); c.stroke();
      feuille(c, -2, -30, 24, -0.9); feuille(c, -2, -30, 20, -2.4); reflet(c, -20, -4, 6, 10);
    },
    prune: (c) => {
      ell(c, 0, 6, 31, 39, 0.15); P(c, '#6b3fa0', '#43206e');
      c.strokeStyle = 'rgba(40,10,70,.5)'; c.lineWidth = 3; c.beginPath(); c.moveTo(4, -32); c.quadraticCurveTo(-10, 6, 0, 44); c.stroke();
      tige(c, 4, -32, 8, -46); c.fillStyle = 'rgba(220,200,255,.35)'; ell(c, -12, -2, 9, 16, 0.2); c.fill();
    },
    orange: (c) => {
      rondFruit(c, 0, 4, 39, '#f7931e', '#c4650a');
      c.fillStyle = 'rgba(190,90,0,.35)';
      for (let i = 0; i < 14; i++) { const a = i * 2.4, r = 10 + (i * 7) % 24; rond(c, Math.cos(a) * r, 4 + Math.sin(a) * r, 1.6); c.fill(); }
      feuille(c, 2, -33, 24, -0.4); c.fillStyle = '#5a7a22'; rond(c, 0, -34, 4); c.fill(); reflet(c, -18, -10, 6, 11);
    },
    citron: (c) => {
      ell(c, -40, 4, 7, 6); P(c, '#f2d22a'); ell(c, 40, 4, 7, 6); P(c, '#f2d22a');
      ell(c, 0, 4, 40, 29); P(c, '#f7dc2e', '#c0a20b'); feuille(c, 8, -22, 24, -0.8); reflet(c, -14, -6, 10, 6);

    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && e.fini < 0 ? e.tour : -1;
    const but = e ? e.cfg.but : 6;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const liste = e ? e.pan[s] : [];
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomRole(info, role));
      const cle = liste.join(',') + '/' + but;
      const pan = d.querySelector('canvas.pan');
      if (pan.dataset.cle !== cle) { pan.dataset.cle = cle; rangeePanier(pan, liste, but, COUL[s]); }
      d.setAttribute('aria-label', tr('place.aria.' + role, { nom: tr('nom.' + s), n: liste.length, total: but }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    $('info-niveau').textContent = info;
    $('info-but').textContent = vue ? tr('jeu.but', { n: vue.cfg.but }) : '';
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && e.fini < 0) {
      const s = e.tour, sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Panneau d'action : en-tête, devinette, boutons
  // ---------------------------------------------------------------------

  const monTour = () => !!(partie && vue && vue.fini < 0 && !enPause && !attenteTuto && partie.monTour());

  function nomEtal(et) {
    if (et.k === 'char') return tr('etal.char');
    if (et.k === 'or') return tr('etal.or') + ' · ' + tr('cat.' + et.c);
    if (et.k === 'puces') return tr('etal.puces') + ' · ' + tr('cat.' + et.c);
    return tr('cat.' + et.c);
  }

  function texteTete() {
    const e = vue;
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    if (!e || partie.phase !== 'jeu' || attenteTuto) return '';
    if (e.fini >= 0) return '';
    const s = e.tour, moi = partie.siege >= 0 && s === partie.siege;
    if (partie.siege < 0) return tr('multi.attente');
    if (e.ph === 'l') return moi ? tr(e.der && e.der.k === 'char' && e.der.s === s ? 'tete.relanceToi' : 'tete.lanceToi') : tr('tete.lance', { nom: nomJoueur(s) });
    if (e.ph === 's') return moi ? tr('tete.sensToi', { n: e.de }) : tr('tete.sens', { nom: nomJoueur(s), n: e.de });
    if (e.ph === 'q') return moi ? tr('tete.questionToi') : tr('tete.question', { nom: nomJoueur(s) });
    if (e.ph === 'p') return moi ? tr('tete.pucesToi') : tr('tete.puces', { nom: nomJoueur(s) });
    return '';
  }

  // Texte et dessin d'une devinette.
  function texteQuestion(q) {
    if (q.c === 'pousse') return tr('q.' + q.v);
    if (q.c === 'famille') return tr('q.famille.' + q.v);
    if (q.c === 'saison') return tr('q.saison.' + q.v);
    if (q.c === 'ferme') return tr('q.ferme', { nom: tr('o.' + q.p) });
    if (q.c === 'noix') return tr('q.noix', { nom: tr('o.' + q.p) });
    if (q.c === 'intrus') return tr('q.intrus');
    if (q.c === 'recette') return tr('q.recette', { recette: tr('rec.' + q.p) });
    if (q.c === 'monde') return tr('q.monde.' + q.v);
    return '';
  }
  // Ce que l'on retient (affiché après la réponse, et dans le livre).
  function faitsDe(id) {
    const l = [];
    if (O.PLATS[id]) l.push(tr('fait.pays.' + O.PLATS[id]));
    const f = O.prop(id, 0), p = O.prop(id, 1), sa = O.prop(id, 2);
    if (f === 'f' || f === 'l' || f === 'n') l.push(tr('fait.famille.' + f));
    if (O.FERME[id]) l.push(tr('fait.ferme.' + O.FERME[id]));
    if (O.ARBRE[id]) l.push(tr('fait.arbreDe.' + O.ARBRE[id]));
    else if (p) l.push(tr('fait.' + p));
    if (sa) l.push(tr('fait.saison.' + sa));
    if (id === 'pain') l.push(tr('fait.pain'));
    if (id === 'riz') l.push(tr('fait.riz'));
    if (id === 'mais') l.push(tr('fait.mais'));
    if (id === 'banane') l.push(tr('fait.banane'));
    if (id === 'kiwi') l.push(tr('fait.kiwi'));
    if (id === 'tomate') l.push(tr('fait.tomate'));
    if (id === 'champignon') l.push(tr('fait.champignon'));
    if (id === 'asperge') l.push(tr('fait.asperge'));
    if (id === 'cacahuete') l.push(tr('fait.cacahuete'));
    return l;
  }
  function explication(q) {
    const bonne = q.c === 'recette' ? null : q.ch[q.ok];
    if (q.c === 'pousse') return [tr('o.' + bonne), tr('fait.' + q.v)];
    if (q.c === 'famille') return [tr('o.' + bonne), tr('fait.famille.' + q.v)];
    if (q.c === 'saison') return [tr('o.' + bonne), tr('fait.saison.' + q.v)];
    if (q.c === 'ferme') return [tr('o.' + q.p), tr('fait.ferme.' + q.v)];
    if (q.c === 'noix') return [tr('o.' + q.p), tr('fait.arbreDe.' + q.v)];
    if (q.c === 'intrus') { const p = q.v.split('.'); return [tr('o.' + bonne), tr('fait.intrus.' + p[0] + '.' + p[1])]; }
    if (q.c === 'monde') return [tr('o.' + bonne), tr('fait.pays.' + q.v)];
    if (q.c === 'recette') return ['', tr(q.res && q.res.ok ? 'fait.recetteOk' : 'fait.recetteNon')];
    return ['', ''];
  }

  // Construit la devinette dans le panneau (une seule fois par devinette et par état).
  function afficherQuestion() {
    const zone = $('p-question');
    const qv = questionVue;
    if (!qv) { zone.hidden = true; zone.dataset.cle = ''; return; }
    const q = qv.q, res = q.res || null, interactif = !res && monTour() && vue && vue.ph === 'q';
    // Devinette déjà jouée et c'est à toi d'agir (lancer, choisir l'étal) : on n'en garde que
    // la réponse et l'explication, pour laisser la place au plateau.
    const compact = !!res && (!!qv.ancien || monTour());
    const cle = JSON.stringify([q.c, q.p, q.ch, !!res, interactif, qv.s, ordreRecette, compact]);
    zone.hidden = false;
    zone.classList.toggle('ancien', !!qv.ancien);
    if (zone.dataset.cle === cle) return;
    zone.dataset.cle = cle;
    $('q-texte').textContent = texteQuestion(q);
    $('q-choix').hidden = compact;
    $('q-tete').hidden = compact;
    const img = $('q-image');
    const montre = q.c === 'ferme' || q.c === 'noix' ? q.p : null;
    img.hidden = !montre;
    if (montre) peindre(img, (c, w, h) => objet(c, montre, w / 2, h / 2, w * 0.44));
    const boite = $('q-choix');
    boite.textContent = '';
    boite.classList.toggle('recette', q.c === 'recette');
    const n = q.ch.length;
    boite.style.setProperty('--n', n === 3 ? 3 : 2);
    q.ch.forEach((id, k) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'choix';
      const num = document.createElement('span'); num.className = 'num'; num.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128; cv.setAttribute('aria-hidden', 'true');
      const nom = document.createElement('span'); nom.className = 'nom';
      const ordre = document.createElement('span'); ordre.className = 'ordre';
      if (q.c === 'recette') {
        peindre(cv, (c, w, h) => etape(c, q.p, id, w / 2, h / 2, w * 0.46));
        nom.textContent = tr('rec.' + q.p + '.' + id);
      } else {
        peindre(cv, (c, w, h) => objet(c, id, w / 2, h / 2, w * 0.44));
        nom.textContent = tr('o.' + id);
      }
      b.append(num, cv, nom, ordre);
      if (q.c === 'recette') {
        const pos = res ? res.o.indexOf(k) : ordreRecette.indexOf(k);
        if (res) { ordre.textContent = nb(id + 1); b.classList.add('numerote', res.o[id] === k ? 'bon' : 'mauvais'); }
        else if (pos >= 0) { ordre.textContent = nb(pos + 1); b.classList.add('numerote'); }
      } else if (res) {
        if (k === q.ok) b.classList.add('bon');
        else if (k === res.i) b.classList.add('mauvais');
        else b.classList.add('eteint');
      }
      b.disabled = !interactif;
      b.setAttribute('aria-label', (q.c === 'recette' ? tr('rec.' + q.p + '.' + id) : tr('o.' + id)));
      if (interactif) b.addEventListener('click', () => toucherChoix(k));
      boite.appendChild(b);
    });
    const verdict = $('q-verdict');
    const expl = $('q-expl');
    expl.textContent = '';
    if (res) {
      verdict.textContent = tr(res.ok ? 'verdict.oui' : 'verdict.non', { nom: nomPlace(qv.s) });
      verdict.className = res.ok ? 'oui' : 'non';
      const ex = explication(q);
      if (ex[0]) { const bb = document.createElement('b'); bb.textContent = ex[0]; expl.appendChild(bb); }
      expl.appendChild(document.createTextNode(ex[1]));
    } else {
      verdict.textContent = interactif && q.c === 'recette' ? tr('q.recetteAide') : '';
      verdict.className = '';
    }
  }

  // Boutons du bas : lancer, choisir le sens, marché aux puces.
  function majActions() {
    const boite = $('p-actions');
    const e = vue;
    const ici = monTour() ? e.ph : '';
    const cle = ici + '|' + (e ? JSON.stringify([e.cible, e.pan.map((p) => p.length), choixSens]) : '');
    if (boite.dataset.cle === cle) return;
    boite.dataset.cle = cle;
    boite.textContent = '';
    if (ici === 'l') {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn grand lancer'; b.id = 'btn-lancer-panier';
      const cv = document.createElement('canvas'); cv.width = 80; cv.height = 80; cv.setAttribute('aria-hidden', 'true');
      peindre(cv, (c) => panier(c, 40, 46, 70));
      const sp = document.createElement('span'); sp.textContent = tr('bouton.lancer');
      b.append(cv, sp);
      b.addEventListener('click', () => { audio(); lancerPanier(); });
      boite.appendChild(b);
    } else if (ici === 's') {
      [-1, 1].forEach((d) => {
        const et = e.b[e.cible[d < 0 ? 0 : 1]];
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'btn' + (et.k === 'or' ? ' or' : '') + (d === choixSens ? ' choisi' : '');
        const cv = document.createElement('canvas'); cv.width = 80; cv.height = 80; cv.setAttribute('aria-hidden', 'true');
        peindre(cv, (c) => etal(c, et, 40, 44, 66));
        const sp = document.createElement('span'); sp.textContent = (d < 0 ? '↺ ' : '') + nomEtal(et) + (d > 0 ? ' ↻' : '');
        if (d < 0) b.append(cv, sp); else b.append(sp, cv);
        b.setAttribute('aria-label', tr(d < 0 ? 'sens.gauche' : 'sens.droite', { etal: nomEtal(et) }));
        b.addEventListener('click', () => { audio(); choisirSens(d); });
        boite.appendChild(b);
      });
    } else if (ici === 'p') {
      for (let c = 0; c < PLACES; c++) {
        if (c === partie.siege) continue;
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'btn';
        const cv = document.createElement('canvas'); cv.width = 80; cv.height = 80; cv.setAttribute('aria-hidden', 'true');
        peindre(cv, (cc) => medaillon(cc, c, 40, 40, 38));
        const sp = document.createElement('span'); sp.textContent = tr('puces.avec', { n: e.pan[c].length });
        b.append(cv, sp);
        b.setAttribute('aria-label', tr('puces.aria', { nom: nomJoueur(c), n: e.pan[c].length }));
        b.addEventListener('click', () => { audio(); echanger(c); });
        boite.appendChild(b);
      }
      const g = document.createElement('button');
      g.type = 'button'; g.className = 'btn vert';
      g.textContent = tr('puces.garder');
      g.addEventListener('click', () => { audio(); echanger(-1); });
      boite.appendChild(g);
    }
  }

  function majPanneau() {
    const e = vue;
    const s = e && partie ? (e.fini >= 0 ? -1 : e.tour) : -1;
    const qui = $('p-qui');
    if (qui.dataset.s !== String(s)) { qui.dataset.s = String(s); peindre(qui, (c, w) => { if (s >= 0) medaillon(c, s, w / 2, w / 2, w / 2 - 1); }); }
    const t = texteTete();
    if ($('p-texte').textContent !== t) $('p-texte').textContent = t;
    afficherQuestion();
    majActions();
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majPanneau();
  }

  // ---------------------------------------------------------------------
  //  Actions du joueur
  // ---------------------------------------------------------------------

  function attendsTonTour() {
    if (Date.now() - dernierAttends > 1500 && partie && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
  }
  function lancerPanier() {
    if (!monTour() || vue.ph !== 'l') { attendsTonTour(); return; }
    if (partie.jouer({ t: 'l' })) sons.clic();
  }
  function choisirSens(d) {
    if (!monTour() || vue.ph !== 's') { attendsTonTour(); return; }
    choixSens = d;
    if (partie.jouer({ t: 's', d: d })) sons.clic();
  }
  function echanger(c) {
    if (!monTour() || vue.ph !== 'p') return;
    if (partie.jouer({ t: 'p', c: c })) sons.clic();
  }
  function toucherChoix(k) {
    if (!monTour() || vue.ph !== 'q' || !vue.q) return;
    const q = vue.q;
    if (q.c === 'recette') {
      const pos = ordreRecette.indexOf(k);
      if (pos >= 0) ordreRecette = ordreRecette.slice(0, pos);   // retoucher une étape l'enlève (et les suivantes)
      else ordreRecette.push(k);
      sons.clic();
      afficherQuestion();
      if (ordreRecette.length === q.n) {
        const o = ordreRecette.slice(), j = jeton;
        setTimeout(() => { if (j === jeton && monTour() && vue.ph === 'q') partie.jouer({ t: 'r', o: o }); }, 350);
      }
      return;
    }
    if (partie.jouer({ t: 'r', i: k })) sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  // Position affichée d'un pion (pendant son déplacement, il saute d'étal en étal).
  function pionAffiche(s, t) {
    const a = anims.pions[s];
    if (!a || !vue) return { i: vue ? vue.pos[s] : 0, saut: 0, x: null };
    const PAS = 210, k = (t - a.t0) / PAS;
    if (k >= a.d) { delete anims.pions[s]; return { i: vue.pos[s], saut: 0, x: null }; }
    const n = Math.floor(k), f = k - n;
    const i0 = (a.de + a.sens * n + O.L * 4) % O.L, i1 = (i0 + a.sens + O.L) % O.L;
    const p0 = posPion(geo, i0, s), p1 = posPion(geo, i1, s);
    return { i: i1, saut: Math.sin(f * Math.PI) * geo.s * 0.3, x: p0[0] + (p1[0] - p0[0]) * f, y: p0[1] + (p1[1] - p0[1]) * f };
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    geo = geometrie(w, h);
    const e = vue, g = geo;
    // pavés de la place
    c.fillStyle = '#ecd2a4'; ell(c, g.cx, g.cy, g.rx + g.s * 0.62, g.ry + g.s * 0.6); c.fill();
    c.strokeStyle = 'rgba(160,110,60,.25)'; c.lineWidth = Math.max(8, g.s * 0.3); ell(c, g.cx, g.cy, g.rx, g.ry); c.stroke();
    fontaine(c, g, t);
    // dé : le panier lancé et ses pommes
    const al = anims.lancer;
    if (al && t - al.t0 < 2600) {
      const k = Math.min(1, (t - al.t0) / 500), r = Math.min(g.rx, g.ry) * 0.36;
      const y = g.cy - r * 0.2 - Math.sin(k * Math.PI) * r * 0.8;
      panier(c, g.cx, y, r * 1.2, k >= 1 ? (cc) => { for (let i = 0; i < al.d; i++) objet(cc, 'pomme', (i - (al.d - 1) / 2) * 24, -16, 15); } : null);
    }
    // étals possibles (choix du sens) : ils brillent
    const cibles = e.ph === 's' && e.cible && e.fini < 0 ? e.cible : [];
    for (let i = 0; i < O.L; i++) {
      const p = g.pts[i];
      const vise = cibles.indexOf(i);
      if (vise >= 0) {
        const pulse = 0.5 + 0.5 * Math.sin(t / 200);
        const choisi = monTour() && (vise === 0 ? -1 : 1) === choixSens && clavierActif;
        c.fillStyle = 'rgba(255,255,255,' + (0.45 + 0.35 * pulse) + ')';
        rond(c, p[0], p[1], g.s * (0.62 + 0.06 * pulse)); c.fill();
        c.strokeStyle = COUL[e.tour]; c.lineWidth = choisi || survol === i ? 6 : 3.5; rond(c, p[0], p[1], g.s * (0.62 + 0.06 * pulse)); c.stroke();
      }
      etal(c, e.b[i], p[0], p[1], g.s, t);
    }
    // pions (celui qui joue par-dessus)
    const ordre = [0, 1, 2, 3].filter((s) => s !== e.tour).concat(e.fini >= 0 ? [] : [e.tour]);
    if (e.fini >= 0) ordre.push(e.tour);
    ordre.forEach((s) => {
      if (s >= e.pos.length) return;
      const pa = pionAffiche(s, t);
      let x, y;
      if (pa.x !== null) { x = pa.x; y = pa.y; } else { const p = posPion(g, pa.i, s); x = p[0]; y = p[1]; }
      const actif = s === e.tour && e.fini < 0;
      const r = g.s * (actif ? 0.27 : 0.22);
      const saut = pa.saut + (actif && pa.x === null ? Math.abs(Math.sin(t / 260)) * g.s * 0.06 : 0);
      pion(c, s, x, y, r, saut);
    });
    // ingrédients qui s'envolent vers le panier
    for (let i = anims.gains.length - 1; i >= 0; i--) {
      const a = anims.gains[i], k = (t - a.t0) / 900;
      if (k >= 1) { anims.gains.splice(i, 1); continue; }
      if (k < 0) continue;
      const x = a.x + (a.x2 - a.x) * k, y = a.y + (a.y2 - a.y) * k - Math.sin(k * Math.PI) * g.s * 1.2;
      objet(c, a.id, x, y, g.s * 0.28 * (1 - k * 0.4));
    }
    // particules (étoiles)
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 380 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      etoile(c, p.x, p.y, p.k, p.coul, p.vie * 4);
      c.globalAlpha = 1;
    }
  }

  function jaillir(x, y, coul, n) {
    for (let k = 0; k < (n || 14); k++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 170;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 150, vie: 0.7 + Math.random() * 0.4, k: 4 + Math.random() * 5, coul: k % 2 ? coul : '#ffe066' });
    }
  }

  // Ingrédients gagnés : ils volent de l'étal vers le haut (les cartes des places).
  function envolerGains(s, g) {
    if (!geo || !vue || !g.length) return;
    const p = geo.pts[vue.pos[s]];
    const zone = $('zone').getBoundingClientRect(), carte = $('place-' + s).getBoundingClientRect();

  // ---------------------------------------------------------------------

  function surEvenement(ev) {

  // ---------------------------------------------------------------------

  function surFin() {

  // Fin d'une manche en ligne : le classement, puis le salon (même écran).

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  // Étoiles : il faut gagner ; puis selon la part de bonnes réponses.
  function etoilesPour(bon, rep, gagne) {
    if (!gagne) return 0;
    const p = rep ? bon / rep : 0;
    return p >= 0.8 ? 3 : p >= 0.6 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {

      const l = document.createElement('div');

      const nom = document.createElement('span'); nom.textContent = tr('nom.' + s) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '');
      qui.appendChild(nom);

  function bouton(cle, classe, action) {

  // Étals qui arrivent au niveau n (pour annoncer « Nouvel étal débloqué »).
  function nouveauxEtals(n) { return ETALS.filter((x) => x[1] === n).map((x) => (['or', 'puces', 'char'].indexOf(x[0]) >= 0 ? tr('etal.' + x[0]) : tr('cat.' + x[0]))); }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();

        zone.appendChild(sp);

    } else {

  // Compte à rebours avant la manche suivante (en ligne, repassé en solo).
  function majCompte() {

    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux, livre
  // ---------------------------------------------------------------------

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    if (session === 'ligne' && livreNouveau) { try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { livre: prog.livre.slice() }); } catch (e) { /* rien */ } livreNouveau = false; }
    partie = null;

  // Parcours solo : niveau n contre 3 robots (force croissante).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;

    anims = { pions: {}, lancer: null, gains: [], echange: null };

      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();

  function lancerNiveau() {

    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : salon, manches, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();

  }

  function ouvrirNiveaux() {
    const grille = $('grille-niveaux');
    grille.textContent = '';
    NIVEAUX.forEach((_, i) => {
      const n = i + 1, ouvert = n <= prog.debloque;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
      b.append(num, et);
      b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
      else b.disabled = true;
      grille.appendChild(b);
    });
    const boite = $('etals-ouverts');
    boite.textContent = '';
    ETALS.forEach((x) => {
      const sp = document.createElement('span');
      const ouvert = x[1] <= prog.debloque;
      sp.className = 'puce-etal' + (ouvert ? '' : ' ferme');
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; cv.setAttribute('aria-hidden', 'true');
      peindre(cv, (c) => embleme(c, x[0], 30, 30, 28));
      const t = document.createElement('span');
      const nom = ['or', 'puces', 'char'].indexOf(x[0]) >= 0 ? tr('etal.' + x[0]) : tr('cat.' + x[0]);
      t.textContent = ouvert ? nom : tr('niveaux.etalFerme', { etal: nom, n: x[1] });
      sp.append(cv, t);
      boite.appendChild(sp);
    });
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
  }

  function montrerFiche(id) {
    peindre($('livre-image'), (c, w, h) => { if (id) objet(c, id, w / 2, h / 2, w * 0.44); else panier(c, w / 2, h * 0.6, w * 0.8, (cc) => { objet(cc, 'pomme', -20, -18, 16); objet(cc, 'carotte', 10, -22, 16); }); });
    $('livre-nom').textContent = id ? tr('o.' + id) : tr('livre.titre');
    $('livre-faits').textContent = id ? faitsDe(id).join(' ') : tr('livre.aide');
    document.querySelectorAll('.carte-livre').forEach((b) => b.classList.toggle('choisi', b.dataset.id === id));
  }

  function ouvrirLivre() {
    const pages = $('livre-pages');
    pages.textContent = '';
    CHAPITRES.forEach((ch) => {
      const t = document.createElement('p'); t.className = 'sous-titre'; t.textContent = tr('livre.' + ch[0]);
      const g = document.createElement('div'); g.className = 'grille-livre';
      ch[1].forEach((id) => {
        const connu = prog.livre.indexOf(id) >= 0;
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'carte-livre' + (connu ? '' : ' inconnu'); b.dataset.id = id;
        const cv = document.createElement('canvas'); cv.width = 112; cv.height = 112; cv.setAttribute('aria-hidden', 'true');
        peindre(cv, (c, w, h) => {
          objet(c, id, w / 2, h / 2, w * 0.42);
          if (!connu) { c.globalCompositeOperation = 'source-atop'; c.fillStyle = '#bfae8c'; c.fillRect(0, 0, w, h); c.globalCompositeOperation = 'source-over'; }
        });
        const nom = document.createElement('span'); nom.textContent = connu ? tr('o.' + id) : tr('livre.inconnu');
        b.append(cv, nom);
        if (connu) b.addEventListener('click', () => { sons.clic(); montrerFiche(id); });
        else { b.disabled = true; b.setAttribute('aria-label', tr('livre.inconnuAria')); }
        g.appendChild(b);
      });
      pages.append(t, g);
    });
    $('livre-compte').textContent = tr('livre.compte', { n: prog.livre.length, total: TOUS_LIVRE.length });
    montrerFiche(null);
    afficherEcran('livre');
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
    majInterface();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés (une main montre le geste)
  // ---------------------------------------------------------------------

  // Exemples des tutoriels de devinette : choix, bonne réponse, image montrée.
  const EXEMPLES = {
    famille: { ch: ['carotte', 'pomme', 'noisette'], ok: 1 },
    ferme: { ch: ['poule', 'vache', 'abeille'], ok: 1, montre: 'lait' },
    saison: { ch: ['orange', 'potiron', 'cerise'], ok: 2 },
    noix: { ch: ['cocotier', 'noisetier', 'amandier'], ok: 1, montre: 'noisette' },
    intrus: { ch: ['pomme', 'poire', 'carotte', 'cerise'], ok: 2 },
    monde: { ch: ['sushi', 'pizza', 'tacos'], ok: 1 }
  };

  // Carte de devinette dessinée (tutoriel) ; renvoie la position de chaque choix.
  function carteDemo(c, ex, t0, t, rc) {
    rr(c, 40, 40, 480, 290, 22); P(c, '#fffaf0', '#d39a5c');
    if (ex.montre) { c.fillStyle = '#fff1d6'; rr(c, 60, 56, 440, 70, 14); c.fill(); objet(c, ex.montre, 100, 91, 28); }
    const n = ex.ch.length, l = n === 4 ? 100 : 128, gap = 14, x0 = 280 - (n * l + (n - 1) * gap) / 2, y = ex.montre ? 150 : 110;
    const pos = [];
    ex.ch.forEach((id, k) => {
      const x = x0 + k * (l + gap);
      const bon = rc && k === ex.ok;
      rr(c, x, y, l, l + 30, 16); P(c, bon ? '#e6f8e4' : '#ffffff', bon ? '#2f9a46' : '#ecd6b0');
      if (rc && k !== ex.ok) { c.globalAlpha = 0.5; }
      if (ex.recette) etape(c, ex.recette, id, x + l / 2, y + l / 2 + 4, l * 0.42);
      else objet(c, id, x + l / 2, y + l / 2 + 6, l * 0.38);
      c.globalAlpha = 1;
      pos.push([x + l / 2, y + l / 2 + 10]);
    });
    return pos;
  }

  // Chaque tutoriel : une fonction qui dessine l'image t (ms depuis le début, en boucle).
  const TUTOS = {
    base: (c, t) => {
      const T = t % 6600;
      c.fillStyle = '#ecd2a4'; rr(c, 20, 20, 520, 320, 24); c.fill();
      const ets = [{ k: 'q', c: 'pousse', a: 'pomme' }, { k: 'q', c: 'pousse', a: 'carotte' }, { k: 'q', c: 'pousse', a: 'noix' }];
      ets.forEach((et, i) => etal(c, et, 110 + i * 170, 110, 110, t));
      // 1) lancer le panier
      let px = 110, saut = 0;
      if (T < 1800) {
        const k = Math.min(1, Math.max(0, (T - 700) / 500));
        panier(c, 280, 280 - Math.sin(k * Math.PI) * 80, 90, k >= 1 ? (cc) => { objet(cc, 'pomme', -12, -16, 15); objet(cc, 'pomme', 14, -16, 15); } : null);
        main(c, 300 + (1 - Math.min(1, T / 600)) * 140, 290, 1.4, T > 550 && T < 800 ? 1 : 0);
      } else if (T < 3200) {
        // 2) choisir l'étal : le pion saute
        const k = Math.min(2, Math.max(0, (T - 2300) / 300));
        px = 110 + 170 * k; saut = Math.sin((k % 1) * Math.PI) * 30;
        c.strokeStyle = COUL[0]; c.lineWidth = 5; rond(c, 450, 110, 72); c.stroke();
        if (T < 2300) main(c, 460 + (1 - Math.min(1, (T - 1800) / 400)) * 60, 130, 1.4, T > 2100 ? 1 : 0);
      } else {
        px = 450;
        // 3) la devinette : toucher la bonne image
        const ex = { ch: ['carotte', 'noix', 'radis'], ok: 1 };
        const rc = T > 4700;
        c.globalAlpha = Math.min(1, (T - 3200) / 300);
        const pos = carteDemo(c, ex, 3200, T, rc);
        c.globalAlpha = 1;
        const cible = pos[ex.ok], k = Math.min(1, Math.max(0, (T - 3700) / 800));
        main(c, 470 + (cible[0] - 470) * k, 330 + (cible[1] - 330) * k, 1.4, T > 4500 && T < 4800 ? 1 : 0);
        if (rc) { coche(c, cible[0] + 40, cible[1] - 60, 18, true); if (T > 5000) { const k2 = Math.min(1, (T - 5000) / 700); objet(c, 'noix', cible[0] + (60 - cible[0]) * k2, cible[1] - k2 * 260 + Math.sin(k2 * Math.PI) * -60, 26); } }
      }
      if (T < 3200) pion(c, 0, px, 210, 30, saut);
    },
    or: (c, t) => {
      const T = t % 4200;
      c.fillStyle = '#ecd2a4'; rr(c, 20, 20, 520, 320, 24); c.fill();
      etal(c, { k: 'or', c: 'noix', a: 'noisette' }, 280, 140, 170, t);
      pion(c, 1, 280, 270, 34, Math.abs(Math.sin(t / 260)) * 6);
      panier(c, 470, 290, 100);
      if (T > 1200) {
        [0, 1].forEach((i) => {
          const k = Math.min(1, Math.max(0, (T - 1200 - i * 400) / 800));
          objet(c, 'noisette', 280 + (470 - 280) * k + (i ? 20 : -20), 140 + (270 - 140) * k - Math.sin(k * Math.PI) * 120, 24);
        });
      }
      for (let i = 0; i < 5; i++) { const a = i * 1.3 + t / 600; etoile(c, 280 + Math.cos(a) * 110, 130 + Math.sin(a) * 70, 10, '#ffe27a'); }
    },
    recette: (c, t) => {
      const T = t % 7000;
      const ordre = [2, 0, 3, 1];   // place de chaque étape dans la rangée
      const ex = { recette: 'crepes', ch: ordre, ok: -1 };
      const pos = carteDemo(c, ex, 0, T, false);
      const fait = Math.min(4, Math.floor(T / 1300));
      for (let k = 0; k < fait; k++) {
        const p = pos[ordre.indexOf(k)];
        c.fillStyle = '#2f6fe0'; rond(c, p[0] + 42, p[1] - 70, 18); c.fill();
        c.fillStyle = '#fff'; for (let d = 0; d <= k; d++) { rond(c, p[0] + 42 + (d - k / 2) * 7, p[1] - 70, 2.8); c.fill(); }
      }
      if (fait < 4) {
        const p = pos[ordre.indexOf(fait)], k = (T % 1300) / 1300;
        main(c, p[0] + 10, p[1] + 10 + (1 - Math.min(1, k * 2)) * 40, 1.4, k > 0.6 && k < 0.85 ? 1 : 0);
      } else coche(c, 280, 316, 18, true);
    },
    puces: (c, t) => {
      const T = t % 4400;
      c.fillStyle = '#ecd2a4'; rr(c, 20, 20, 520, 320, 24); c.fill();
      const k = Math.min(1, Math.max(0, (T - 1400) / 1200));
      const a = [150, 410], y = 200;
      const xa = a[0] + (a[1] - a[0]) * k, xb = a[1] + (a[0] - a[1]) * k, dy = Math.sin(k * Math.PI) * 70;
      mascotte(c, 0, a[0], 80, 40); mascotte(c, 1, a[1], 80, 40);
      panier(c, xa, y - dy, 130, (cc) => { objet(cc, 'pomme', -10, -16, 16); });
      panier(c, xb, y + dy, 130, (cc) => { ['carotte', 'lait', 'pain', 'noix'].forEach((id, i) => objet(cc, id, -30 + i * 20, -16 - (i % 2) * 8, 15)); });
      fleches(c, 280, 200, 40, '#c0307a');
      if (T < 1400) main(c, 430, 300 - Math.min(1, T / 700) * 30, 1.4, T > 900 ? 1 : 0);
    },
    charrette: (c, t) => {
      const T = t % 4400;
      c.fillStyle = '#ecd2a4'; rr(c, 20, 20, 520, 320, 24); c.fill();
      etal(c, { k: 'char' }, 280, 150, 180);
      const k = Math.min(1, T / 900);
      pion(c, 2, 80 + 200 * k, 250, 30, Math.sin(k * Math.PI * 2) * 20);
      if (T > 1300) {
        const k2 = Math.min(1, (T - 1300) / 600);
        panier(c, 420, 290 - Math.sin(k2 * Math.PI) * 120, 90, k2 >= 1 ? (cc) => { objet(cc, 'pomme', -12, -16, 15); objet(cc, 'pomme', 14, -16, 15); objet(cc, 'pomme', 0, -30, 15); } : null);
      }
    }
  };
  // Tutoriel d'une nouvelle sorte de devinette : la main touche la bonne image.
  ['famille', 'ferme', 'saison', 'noix', 'intrus', 'monde'].forEach((cle) => {
    TUTOS[cle] = (c, t) => {
      const T = t % 4200, ex = EXEMPLES[cle];
      const rc = T > 2300;
      const pos = carteDemo(c, ex, 0, T, rc);
      const cible = pos[ex.ok], k = Math.min(1, Math.max(0, (T - 600) / 1100));
      main(c, 470 + (cible[0] - 470) * k, 340 + (cible[1] - 340) * k, 1.4, T > 1900 && T < 2300 ? 1 : 0);
      if (rc) coche(c, cible[0] + 40, cible[1] - 60, 18, true);
    };
  });

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    let debut = 0;
    const j = ++tutoAnim;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 360);
      c.lineWidth = 3; c.lineJoin = 'round';
      TUTOS[cle](c, t - debut);
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  let clavierActif = false;

  // Étal sous le doigt (zone large, au moins 44 px).
  function etalSous(px, py) {
    if (!geo || !vue) return -1;
    let best = -1, bd = Infinity;
    for (let i = 0; i < O.L; i++) {
      const p = geo.pts[i], d = Math.hypot(px - p[0], py - p[1]);
      if (d < bd) { bd = d; best = i; }
    }
    return bd <= Math.max(26, geo.s * 0.6) ? best : -1;
  }

  const plateau = $('plateau');
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  plateau.addEventListener('pointermove', (ev) => { const p = point(ev); survol = etalSous(p[0], p[1]); });
  plateau.addEventListener('pointerleave', () => { survol = -1; });
  plateau.addEventListener('pointerup', (ev) => {
    audio();
    clavierActif = false;
    const p = point(ev), i = etalSous(p[0], p[1]);
    if (ev.pointerType !== 'mouse') survol = -1;
    if (!vue || !partie || enPause || attenteTuto) return;
    if (vue.ph === 's' && vue.cible && i >= 0) {
      const k = vue.cible.indexOf(i);
      if (k >= 0) { choisirSens(k === 0 ? -1 : 1); return; }
    }
    if (vue.ph === 'l' && monTour()) { lancerPanier(); return; }
    if (i >= 0 && !monTour()) attendsTonTour();
  });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif') || !vue) return;
    const chiffre = /^(Digit|Numpad)([1-4])$/.exec(ev.code);
    if (chiffre && vue.ph === 'q' && monTour()) {
      const k = parseInt(chiffre[2], 10) - 1;
      if (vue.q && k < vue.q.ch.length) { ev.preventDefault(); audio(); toucherChoix(k); }
      return;
    }
    if (vue.ph === 's' && monTour() && (ev.code === 'ArrowLeft' || ev.code === 'ArrowRight')) {
      ev.preventDefault(); audio();
      clavierActif = true;
      choixSens = ev.code === 'ArrowLeft' ? -1 : 1;
      sons.clic();
      majActions();
      return;
    }
    if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (vue.ph === 'l') lancerPanier();
      else if (vue.ph === 's') choisirSens(choixSens);
      else if (vue.ph === 'p' && monTour()) echanger(-1);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-livre').addEventListener('click', () => { audio(); sons.clic(); ouvrirLivre(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('livre-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer-manche').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.bon[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
})();
</script>
</body>
