   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
'use strict';
/* ==========================================================================
   Les paniers du compte juste — Free Micro Games
   Jeu de calcul et d'adresse : des paniers de basket portent des nombres
   (+3, −2, ×2). On tire le doigt vers l'arrière pour viser et régler la force,
   on relâche : le ballon part en cloche. Il faut atteindre PILE le score du
   tableau d'affichage avant d'avoir lancé tous ses ballons.
   Monde logique de 400 × 720 unités (portrait), mis à l'échelle de l'écran.
   ========================================================================== */
const JEU = 'paniers-du-compte-juste';
const tr = (cle, vars) => window.JEL_I18N.t(cle, vars);
const nombre = (x) => window.JEL_I18N.nombre(x);
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------------------
// Réglages du monde
// ---------------------------------------------------------------------------
const W = 400, H = 720;          // monde logique
const VUE_HAUT = 150;            // haut du monde toujours visible sous le tableau
const GRAVITE = 980;
const RAYON_BALLON = 13;
const DEPART = { x: 200, y: 612 }; // ballon tenu au-dessus de la tête
const VITESSE_MAX = 1080;
const TIRAGE_MAX = 150;          // longueur de tirage pour la vitesse maximale
const TIRAGE_MIN = 16;           // en dessous : le tir est annulé
const PIEDS_DEFENSEUR = 578;

// ---------------------------------------------------------------------------
// Terrains (un tous les 5 matchs)
// ---------------------------------------------------------------------------
const TERRAINS = [
  { id: 'gymnase', arceau: 64 },
  { id: 'cour', arceau: 62 },
  { id: 'plage', arceau: 60 },
  { id: 'tournoi', arceau: 58 },
];

// ---------------------------------------------------------------------------
// Objets à gagner : maillots, ballons colorés, coupes
// ---------------------------------------------------------------------------
const MAILLOTS = {
  classique: { fond: '#2563eb', bord: '#ffffff', motif: 'uni' },
  rayures: { fond: '#dc2626', bord: '#ffffff', motif: 'rayures', deux: '#fecaca' },
  etoile: { fond: '#16a34a', bord: '#fef08a', motif: 'etoile', deux: '#fef08a' },
  bande: { fond: '#facc15', bord: '#1e3a8a', motif: 'bande', deux: '#1e3a8a' },
  damier: { fond: '#7c3aed', bord: '#ffffff', motif: 'damier', deux: '#c4b5fd' },
  vagues: { fond: '#0d9488', bord: '#ffffff', motif: 'vagues', deux: '#99f6e4' },
  pois: { fond: '#ec4899', bord: '#ffffff', motif: 'pois', deux: '#fbcfe8' },
  eclair: { fond: '#f97316', bord: '#1f2937', motif: 'eclair', deux: '#fde047' },
  champion: { fond: '#eab308', bord: '#7c2d12', motif: 'etoile', deux: '#fff7ae', brille: true },
};
const BALLONS = {
  orange: { fond: '#f28c28', ligne: '#6b2f0b' },
  arcenciel: { fond: '#f28c28', ligne: '#3f2a1a', motif: 'arcenciel' },
  bleu: { fond: '#2563eb', ligne: '#0b1f5c', motif: 'etoiles' },
  citron: { fond: '#c6e83a', ligne: '#3f6212' },
  pasteque: { fond: '#22a447', ligne: '#0f4d22', motif: 'rayures' },
  nuit: { fond: '#1e2a5a', ligne: '#0a1030', motif: 'points' },
  fraise: { fond: '#e11d48', ligne: '#7f1027', motif: 'graines' },
  bicolore: { fond: '#ec4899', ligne: '#3b0a2a', motif: 'moitie', deux: '#14b8a6' },
  or: { fond: '#f5c518', ligne: '#7a5200', motif: 'or' },
};
const COUPES = [
  { corps: '#cbd5e1', ombre: '#64748b', socle: '#7c4a1e' },   // gymnase : argent
  { corps: '#f59e0b', ombre: '#b45309', socle: '#1e3a8a' },   // cour : bronze doré
  { corps: '#38bdf8', ombre: '#0369a1', socle: '#f2d49b' },   // plage : coupe en verre bleu
  { corps: '#facc15', ombre: '#a16207', socle: '#111827' },   // tournoi : grande coupe d'or
];
// Ce que rapporte chaque match gagné pour la première fois
const GAINS = [
  ['maillot', 'rayures'], ['ballon', 'arcenciel'], ['maillot', 'etoile'], ['ballon', 'bleu'], ['coupe', 0],
  ['maillot', 'bande'], ['ballon', 'citron'], ['maillot', 'damier'], ['ballon', 'pasteque'], ['coupe', 1],
  ['maillot', 'vagues'], ['ballon', 'nuit'], ['maillot', 'pois'], ['ballon', 'fraise'], ['coupe', 2],
  ['maillot', 'eclair'], ['ballon', 'bicolore'], ['maillot', 'champion'], ['ballon', 'or'], ['coupe', 3],
];

// ---------------------------------------------------------------------------
// Les 20 matchs
//   op '+' ajoute n, '-' retire n (jamais sous 0), 'x' multiplie par n
//   mv : panier qui glisse (axe 'h') ou qui monte et descend (axe 'v')
//   aide : nombre de points de la ligne de visée
// ---------------------------------------------------------------------------
function pa(op, n, x, y, mv) { return { op, n, x, y, mv: mv || null }; }
function gl(amp, vit, ph) { return { axe: 'h', amp, vit, ph: ph || 0 }; }
function mo(amp, vit, ph) { return { axe: 'v', amp, vit, ph: ph || 0 }; }
function df(x0, amp, vit, periode, haut, ph) { return { x0, amp, vit, periode, haut, ph: ph || 0 }; }

const NIVEAUX = [
  // Terrain 1 : le gymnase
  { terrain: 0, objectifs: [5], ballons: 6, nouveau: 'tuto', aide: 16,
    paniers: [pa('+', 2, 120, 380), pa('+', 3, 280, 300)] },
  { terrain: 0, objectifs: [7], ballons: 6, nouveau: null, aide: 16,
    paniers: [pa('+', 2, 90, 400), pa('+', 5, 200, 250), pa('+', 3, 310, 380)] },
  { terrain: 0, objectifs: [9], ballons: 7, nouveau: null, aide: 15,
    paniers: [pa('+', 1, 90, 420), pa('+', 4, 200, 235), pa('+', 2, 310, 330)] },
  { terrain: 0, objectifs: [6], ballons: 7, nouveau: 'moins', aide: 15,
    paniers: [pa('+', 5, 90, 300), pa('-', 2, 200, 420), pa('+', 3, 310, 300)] },
  { terrain: 0, objectifs: [12], ballons: 7, nouveau: null, aide: 14,
    paniers: [pa('+', 5, 80, 250), pa('+', 4, 320, 250), pa('+', 2, 130, 420), pa('-', 3, 270, 420)] },
  // Terrain 2 : la cour d'école
  { terrain: 1, objectifs: [10], ballons: 6, nouveau: 'double', aide: 14,
    paniers: [pa('+', 3, 90, 360), pa('x', 2, 200, 230), pa('+', 2, 310, 360)] },
  { terrain: 1, objectifs: [14], ballons: 6, nouveau: null, aide: 13,
    paniers: [pa('+', 3, 80, 420), pa('+', 4, 320, 420), pa('x', 2, 130, 250), pa('-', 1, 270, 250)] },
  { terrain: 1, objectifs: [11], ballons: 7, nouveau: 'glisse', aide: 13,
    paniers: [pa('+', 3, 200, 250, gl(110, 1.1)), pa('+', 5, 90, 420), pa('+', 2, 310, 420)] },
  { terrain: 1, objectifs: [16], ballons: 6, nouveau: null, aide: 12,
    paniers: [pa('x', 2, 200, 230, gl(100, 1.0)), pa('+', 4, 80, 400), pa('+', 3, 320, 400), pa('-', 2, 200, 430)] },
  { terrain: 1, objectifs: [20], ballons: 6, nouveau: null, aide: 12,
    paniers: [pa('+', 5, 200, 220, gl(110, 1.3)), pa('x', 2, 80, 410), pa('+', 3, 200, 330, gl(100, 0.9, Math.PI)), pa('-', 4, 320, 410)] },
  // Terrain 3 : la plage
  { terrain: 2, objectifs: [13], ballons: 6, nouveau: 'monte', aide: 10,
    paniers: [pa('+', 4, 200, 300, mo(70, 1.2)), pa('+', 3, 80, 390), pa('+', 6, 320, 250)] },
  { terrain: 2, objectifs: [15], ballons: 4, nouveau: 'compte', aide: 10,
    paniers: [pa('+', 5, 90, 250), pa('+', 3, 200, 340, mo(80, 1.4)), pa('+', 1, 310, 420)] },
  { terrain: 2, objectifs: [8, 18], ballons: 8, nouveau: 'etapes', aide: 9,
    paniers: [pa('+', 4, 80, 300), pa('+', 5, 320, 300), pa('+', 3, 200, 230), pa('-', 2, 200, 420)] },
  { terrain: 2, objectifs: [6, 24], ballons: 6, nouveau: null, aide: 9,
    paniers: [pa('+', 3, 90, 410), pa('x', 2, 200, 240, gl(110, 1.2)), pa('+', 2, 310, 410), pa('-', 1, 200, 420)] },
  { terrain: 2, objectifs: [30], ballons: 6, nouveau: null, aide: 8,
    paniers: [pa('+', 5, 330, 340, mo(60, 1.3)), pa('x', 2, 200, 230, gl(60, 1.0)), pa('+', 3, 70, 330), pa('-', 4, 200, 430)] },
  // Terrain 4 : la salle de tournoi
  { terrain: 3, objectifs: [12], ballons: 7, nouveau: 'defenseur', aide: 9,
    paniers: [pa('+', 4, 90, 330), pa('+', 3, 310, 330), pa('+', 5, 200, 230)],
    defenseurs: [df(200, 110, 0.8, 2.6, 100)] },
  { terrain: 3, objectifs: [18], ballons: 6, nouveau: null, aide: 9,
    paniers: [pa('x', 2, 200, 230), pa('+', 3, 80, 360), pa('+', 4, 320, 360), pa('-', 2, 200, 410)],
    defenseurs: [df(200, 120, 0.95, 2.3, 110)] },
  { terrain: 3, objectifs: [10, 25], ballons: 9, nouveau: null, aide: 8,
    paniers: [pa('+', 5, 200, 230, gl(100, 1.0)), pa('+', 3, 80, 380), pa('+', 2, 320, 360, mo(60, 1.2)), pa('-', 3, 200, 420)],
    defenseurs: [df(200, 120, 1.0, 2.2, 115)] },
  { terrain: 3, objectifs: [27], ballons: 5, nouveau: 'defenseurs', aide: 8,
    paniers: [pa('+', 6, 320, 320, mo(70, 1.4)), pa('x', 2, 200, 230, gl(60, 1.3)), pa('+', 3, 80, 350), pa('-', 2, 200, 430)],
    defenseurs: [df(130, 70, 1.1, 2.4, 110), df(270, 70, 0.9, 2.0, 120, 1.6)] },
  { terrain: 3, objectifs: [15, 40], ballons: 9, nouveau: null, aide: 8,
    paniers: [pa('+', 5, 200, 225, gl(60, 1.2)), pa('x', 2, 340, 330, mo(60, 1.1)), pa('+', 4, 70, 330), pa('+', 3, 130, 440), pa('-', 3, 240, 440)],
    defenseurs: [df(200, 130, 1.25, 1.9, 125)] },
];
window.JEL_NIVEAUX = NIVEAUX.length;

// Nombre minimal de ballons pour réussir un match (recherche en largeur)
function appliquerPanier(p, s) {
  if (p.op === '+') return s + p.n;
  if (p.op === '-') return Math.max(0, s - p.n);
  return s * p.n;
}
function aDesMoins(niv) { return niv.paniers.some((p) => p.op === '-'); }
function calculerPar(niv) {
  const moins = aDesMoins(niv), cibles = niv.objectifs;
  const vus = new Set(['0,0']);
  let file = [[0, 0, 0]];
  while (file.length) {
    const suivante = [];
    for (const [e, s, c] of file) {
      for (const p of niv.paniers) {
        const s2 = appliquerPanier(p, s);
        let e2 = e;
        if (s2 > 200) continue;
        if (s2 === cibles[e2]) { e2++; if (e2 >= cibles.length) return c + 1; }
        else if (s2 > cibles[e2] && !moins) continue;
        const k = e2 + ',' + s2;
        if (!vus.has(k)) { vus.add(k); suivante.push([e2, s2, c + 1]); }
      }
    }
    file = suivante;
  }
  return niv.ballons;
}
const PARS = NIVEAUX.map(calculerPar);

// ---------------------------------------------------------------------------
// Progression : étoiles, records, objets portés (save.js + localStorage)
// ---------------------------------------------------------------------------
const CLE_LOCALE = JEU + '-progres';
const CLE_SON = JEU + '-son';
let P = progressionVide();
let niveauOuvertSauvegarde = 1;
let sonActif = true;

function progressionVide() {
  return { etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), maillot: 'classique', ballon: 'orange' };
}
function fusionner(src) {
  if (!src || !Array.isArray(src.etoiles)) return;
  for (let i = 0; i < NIVEAUX.length; i++) {
    P.etoiles[i] = Math.max(P.etoiles[i], Math.min(3, Number(src.etoiles[i]) || 0));
    if (Array.isArray(src.records)) P.records[i] = Math.max(P.records[i], Number(src.records[i]) || 0);
  }
  if (MAILLOTS[src.maillot]) P.maillot = src.maillot;
  if (BALLONS[src.ballon]) P.ballon = src.ballon;
}
function chargerProgression() {
  try { const s = localStorage.getItem(CLE_LOCALE); if (s) fusionner(JSON.parse(s)); } catch (e) { /* stockage refusé */ }
  try { if (JEL_SAVE.existe(JEU)) { const d = JEL_SAVE.load(JEU); fusionner(d.options); niveauOuvertSauvegarde = Math.max(1, Math.min(NIVEAUX.length, Number(d.niveau) || 1)); } } catch (e) { /* rien */ }
  try { const s = localStorage.getItem(CLE_SON); if (s === '0') sonActif = false; } catch (e) { /* rien */ }
  try { const d = JEL_SAVE.load(JEU); if (d && d.options && d.options.son === false) sonActif = false; } catch (e) { /* rien */ }
  verifierObjetsPortes();
}
function garderLocal() {
  try { localStorage.setItem(CLE_LOCALE, JSON.stringify(P)); } catch (e) { /* rien */ }
}
function optionsSauvegarde() { return { etoiles: P.etoiles, records: P.records, maillot: P.maillot, ballon: P.ballon, son: sonActif }; }
function scoreTotal() { return P.records.reduce((a, b) => a + b, 0); }
function sauverPartie(niveau) {
  try { JEL_SAVE.save(JEU, { niveau, score: scoreTotal(), options: optionsSauvegarde() }); } catch (e) { /* rien */ }
}
function matchOuvert(n) { return n === 1 || P.etoiles[n - 2] > 0 || n <= niveauOuvertSauvegarde; }
function objetGagne(type, id) {

    g.fillStyle = s.deux; g.fillRect(0, -r, r, r * 2);
  }
  g.strokeStyle = s.ligne; g.lineWidth = Math.max(1.2, r * 0.1);
  g.beginPath(); g.moveTo(-r, 0); g.lineTo(r, 0); g.stroke();
  g.beginPath(); g.moveTo(0, -r); g.lineTo(0, r); g.stroke();
  g.beginPath(); g.arc(-r * 1.25, 0, r * 0.95, -0.9, 0.9); g.stroke();
  g.beginPath(); g.arc(r * 1.25, 0, r * 0.95, Math.PI - 0.9, Math.PI + 0.9); g.stroke();
  g.restore();
  if (s.motif === 'or') {

}

// Maillot (débardeur) vu de face ou de dos ; (x, y) = milieu du haut
function dessinerMaillot(g, x, y, w, h, id) {
  const m = MAILLOTS[id] || MAILLOTS.classique;
  g.save(); g.translate(x, y);
  const forme = () => {
    g.beginPath();
    g.moveTo(-w * 0.22, 0); g.quadraticCurveTo(0, h * 0.2, w * 0.22, 0);
    g.lineTo(w * 0.34, 0); g.quadraticCurveTo(w * 0.36, h * 0.25, w * 0.5, h * 0.32);
    g.lineTo(w * 0.47, h); g.lineTo(-w * 0.47, h); g.lineTo(-w * 0.5, h * 0.32);
    g.quadraticCurveTo(-w * 0.36, h * 0.25, -w * 0.34, 0); g.closePath();
  };
  forme(); g.fillStyle = m.fond; g.fill();
  g.save(); forme(); g.clip();
  g.fillStyle = m.deux || m.bord;
  if (m.motif === 'rayures') for (let i = -3; i <= 3; i++) g.fillRect(i * w * 0.16 - w * 0.03, 0, w * 0.06, h);
  else if (m.motif === 'etoile') { etoileForme(g, 0, h * 0.56, w * 0.18, w * 0.08); g.fill(); }
  else if (m.motif === 'bande') { g.save(); g.rotate(0.6); g.fillRect(-w, h * 0.15, w * 2, h * 0.18); g.restore(); }
  else if (m.motif === 'damier') {
    const c = w * 0.14;
    for (let i = -4; i < 4; i++) for (let j = 0; j < 8; j++) if ((i + j) % 2 === 0) g.fillRect(i * c, h * 0.3 + j * c, c, c);
  } else if (m.motif === 'vagues') {
    g.strokeStyle = m.deux; g.lineWidth = w * 0.06;
    for (let k = 0; k < 3; k++) { g.beginPath(); for (let u = -w / 2; u <= w / 2; u += 3) g.lineTo(u, h * (0.4 + k * 0.2) + Math.sin(u / (w * 0.08)) * h * 0.04); g.stroke(); }
  } else if (m.motif === 'pois') {
    for (let i = 0; i < 9; i++) { g.beginPath(); g.arc(((i % 3) - 1) * w * 0.25, h * (0.35 + Math.floor(i / 3) * 0.22), w * 0.05, 0, 7); g.fill(); }
  } else if (m.motif === 'eclair') {
    g.beginPath(); g.moveTo(w * 0.08, h * 0.25); g.lineTo(-w * 0.12, h * 0.6); g.lineTo(0, h * 0.6); g.lineTo(-w * 0.08, h * 0.92);
    g.lineTo(w * 0.14, h * 0.5); g.lineTo(w * 0.02, h * 0.5); g.closePath(); g.fill();
  }
  if (m.brille) { const gr = g.createLinearGradient(-w / 2, 0, w / 2, h); gr.addColorStop(0, 'rgba(255,255,255,.5)'); gr.addColorStop(0.5, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(255,255,255,.3)'); g.fillStyle = gr; g.fillRect(-w / 2, 0, w, h); }
  g.restore();
  forme(); g.strokeStyle = m.bord; g.lineWidth = Math.max(2, w * 0.05); g.stroke();
  g.restore();
}

// Défenseur en mousse
function posDefenseur(d, t) {

  const dureeSaut = 0.85;
  const h = j < dureeSaut ? d.haut * 4 * (j / dureeSaut) * (1 - j / dureeSaut) : 0;
  const pieds = PIEDS_DEFENSEUR - h;
  const haut = h > 8;
  return {
    x, pieds, haut,
    cercles: [
      { x, y: pieds - 34, r: 24 },
      { x, y: pieds - 72, r: 17 },
      { x: x - 21, y: pieds - (haut ? 108 : 92), r: 12 },
      { x: x + 21, y: pieds - (haut ? 108 : 92), r: 12 },

}
function dessinerDefenseur(g, d, t, couleur) {

  g.beginPath(); g.moveTo(p.x + 10, corps.y + 18); g.lineTo(p.x + 12, p.pieds - 2); g.stroke();
  g.lineCap = 'butt';
  g.fillStyle = couleur; g.beginPath(); g.ellipse(corps.x, corps.y, 24, 27, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(corps.x - 8, corps.y - 8, 7, 11, 0.3, 0, 7); g.fill();
  [mg, md].forEach((m) => { g.fillStyle = '#fde68a'; g.beginPath(); g.arc(m.x, m.y, m.r, 0, 7); g.fill(); g.strokeStyle = 'rgba(0,0,0,.2)'; g.lineWidth = 2; g.stroke(); });
  g.fillStyle = '#fde68a'; g.beginPath(); g.arc(tete.x, tete.y, tete.r, 0, 7); g.fill();
  g.fillStyle = '#1f2937';
  g.beginPath(); g.arc(tete.x - 6, tete.y - 3, 2.6, 0, 7); g.fill(); g.beginPath(); g.arc(tete.x + 6, tete.y - 3, 2.6, 0, 7); g.fill();
  g.strokeStyle = '#1f2937'; g.lineWidth = 2; g.beginPath(); g.arc(tete.x, tete.y + 3, 6, 0.2, Math.PI - 0.2); g.stroke();
  g.fillStyle = 'rgba(244,114,182,.6)'; g.beginPath(); g.arc(tete.x - 10, tete.y + 3, 3, 0, 7); g.fill(); g.beginPath(); g.arc(tete.x + 10, tete.y + 3, 3, 0, 7); g.fill();
  g.fillStyle = couleur; g.beginPath(); g.arc(tete.x, tete.y - 15, 6, 0, 7); g.fill();
}

// Petits effets
let particules = [], bulles = [];
function confettis(x, y, n, couleurs) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 240;
    particules.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, vie: 0.9 + Math.random() * 0.6, t: 0,
      c: couleurs[i % couleurs.length], taille: 4 + Math.random() * 5, rot: Math.random() * 6, forme: i % 3 });
  }
}
function bulle(x, y, texte, couleur, taille = 30) { bulles.push({ x, y, texte, couleur, taille, t: 0, vie: 1.3 }); }
function majEffets(dt) {
  for (const p of particules) { p.t += dt; p.vy += 420 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985; p.rot += dt * 6; }
  particules = particules.filter((p) => p.t < p.vie);
  for (const b of bulles) b.t += dt;
  bulles = bulles.filter((b) => b.t < b.vie);
}
function dessinerEffets(g) {
  for (const p of particules) {
    g.save(); g.globalAlpha = Math.max(0, 1 - p.t / p.vie); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.c;
    if (p.forme === 0) g.fillRect(-p.taille / 2, -p.taille / 4, p.taille, p.taille / 2);
    else if (p.forme === 1) { g.beginPath(); g.arc(0, 0, p.taille / 2, 0, 7); g.fill(); }
    else { etoileForme(g, 0, 0, p.taille * 0.8, p.taille * 0.35); g.fill(); }
    g.restore();
  }
  for (const b of bulles) {
    const u = b.t / b.vie;
    g.save(); g.globalAlpha = u < 0.75 ? 1 : (1 - u) / 0.25;
    const s = u < 0.15 ? 0.5 + u / 0.15 * 0.6 : 1.1 - Math.min(0.1, (u - 0.15));
    g.translate(b.x, b.y - u * 60); g.scale(s, s);
    g.font = `900 ${b.taille}px system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 6; g.strokeStyle = '#ffffff'; g.strokeText(b.texte, 0, 0);
    g.fillStyle = b.couleur; g.fillText(b.texte, 0, 0);
    g.restore();
  }
}

// ---------------------------------------------------------------------------
// État d'un match
// ---------------------------------------------------------------------------
let ecran = 'titre';
let S = null;          // match en cours
let tempsGlobal = 0;   // pour les animations des écrans

function creerMatch(n) {
  const niv = NIVEAUX[n - 1];
  const hw = TERRAINS[niv.terrain].arceau;
  return {
    n, niv, par: PARS[n - 1], moins: aDesMoins(niv),
    paniers: niv.paniers.map((p) => ({ ...p, hw, x0: p.x, y0: p.y, vx: 0, vy: 0, secoue: 0, brille: 0 })),
    defenseurs: (niv.defenseurs || []).map((d) => ({ ...d })),
    etape: 0, score: 0, affiche: 0, restants: niv.ballons, lances: 0, propres: 0,
    t: 0, ballon: null, pret: true, fini: false, finDans: -1, finType: null,
    tirage: null, clavier: { actif: false, angle: 0.22, force: 0.72 }, aDejaTire: false,
    rot: 0, raison: null,
  };
}
function cibleActuelle() { return S.niv.objectifs[S.etape]; }

function majPaniers(dt) {
  for (const h of S.paniers) {
    const ax = h.x, ay = h.y;
    if (h.mv) {
      const v = Math.sin(S.t * h.mv.vit + h.mv.ph) * h.mv.amp;
      if (h.mv.axe === 'h') h.x = h.x0 + v; else h.y = h.y0 + v;
    }
    h.vx = dt > 0 ? (h.x - ax) / dt : 0; h.vy = dt > 0 ? (h.y - ay) / dt : 0;
    h.secoue = Math.max(0, h.secoue - dt * 2);
    h.brille += dt * 4;
  }
}

// Vitesse de lancer selon le tirage (doigt) ou le réglage au clavier
function vitesseTir() {
  if (S.tirage) {
    const dx = S.tirage.x - S.tirage.x0, dy = S.tirage.y - S.tirage.y0;
    let vx = -dx * (VITESSE_MAX / TIRAGE_MAX), vy = -dy * (VITESSE_MAX / TIRAGE_MAX);
    const v = Math.hypot(vx, vy);
    if (v > VITESSE_MAX) { vx *= VITESSE_MAX / v; vy *= VITESSE_MAX / v; }
    return { vx, vy, ok: Math.hypot(dx, dy) >= TIRAGE_MIN && vy < -80 };
  }
  const k = S.clavier;
  return { vx: Math.sin(k.angle) * k.force * VITESSE_MAX, vy: -Math.cos(k.angle) * k.force * VITESSE_MAX, ok: true };
}
function decalageTenu() {
  if (!S.tirage) return { dx: 0, dy: 0 };
  let dx = S.tirage.x - S.tirage.x0, dy = S.tirage.y - S.tirage.y0;
  const d = Math.hypot(dx, dy), m = 34;
  if (d > m) { dx *= m / d; dy *= m / d; }
  return { dx, dy: Math.max(-6, dy) };
}

function lancer() {
  if (!S || !S.pret || S.fini || S.restants <= 0) return;
  const v = vitesseTir();
  S.tirage = null;
  if (!v.ok) return;
  const d = { dx: 0, dy: 0 };
  S.ballon = { x: DEPART.x + d.dx, y: DEPART.y + d.dy, vx: v.vx, vy: v.vy, t: 0, touche: false, marque: null, apresPanier: 0, rot: 0 };
  S.pret = false; S.restants--; S.lances++; S.aDejaTire = true;
  majTableau();
  audio(); SONS.lancer();
}

// Fin de vol d'un ballon
function finBallon() {
  const b = S.ballon;
  S.ballon = null;
  if (S.fini) return;
  if (b && !b.marque) { SONS.rate(); bulle(Math.max(60, Math.min(340, b.x)), Math.min(560, Math.max(260, b.y - 40)), tr('popup.rate'), '#475569', 24); }
  if (S.restants <= 0) { S.fini = true; S.finType = 'ballons'; S.finDans = 0.6; return; }
  S.pret = true;
}

// Le ballon entre dans un panier
function marquer(h, b) {
  b.marque = h; h.secoue = 1;
  const avant = S.score;
  S.score = appliquerPanier(h, S.score);
  const c = couleursPanier(h.op);
  bulle(h.x, h.y - 90, etiquettePanier(h), c.fort, 34);
  confettis(h.x, h.y + 10, 18, [c.fort, '#ffffff', '#facc15']);
  SONS.filet();
  if (h.op === '+') SONS.plus(); else if (h.op === '-') SONS.moins(); else SONS.double();
  if (!b.touche) {
    S.propres++;
    bulle(h.x, h.y - 130, tr('popup.propre'), '#16a34a', 20);
    confettis(h.x, h.y - 20, 14, ['#fde047', '#ffffff', '#86efac']);
    SONS.propre();
  }
  const cible = cibleActuelle();
  if (S.score === cible) {
    S.etape++;
    if (S.etape >= S.niv.objectifs.length) {
      S.fini = true; S.finType = 'victoire'; S.finDans = 1.2;
      confettis(200, 300, 70, ['#f97316', '#facc15', '#22c55e', '#3b82f6', '#ec4899', '#ffffff']);
      SONS.sifflet();
    } else {
      bulle(200, 330, tr('popup.etape'), '#c2410c', 30);
      confettis(200, 260, 40, ['#facc15', '#ffffff', '#f97316']);
      SONS.sifflet();
    }
  } else if (S.score > cible) {
    secouerTableau();
    if (!S.moins) { S.fini = true; S.finType = 'trop'; S.finDans = 1.1; SONS.trop(); bulle(200, 360, tr('popup.trop'), '#b91c1c', 34); }
  } else if (avant > cible && S.score < cible) {
    secouerTableau();
  }
  majTableau();
}

// Rebond d'un cercle mobile (ballon) sur un cercle fixe ou en mouvement
function rebondir(b, cx, cy, cr, vxObj, vyObj, e) {
  const dx = b.x - cx, dy = b.y - cy, d = Math.hypot(dx, dy), m = cr + RAYON_BALLON;
  if (d >= m || d === 0) return false;
  const nx = dx / d, ny = dy / d;
  b.x = cx + nx * m; b.y = cy + ny * m;
  const rvx = b.vx - vxObj, rvy = b.vy - vyObj, vn = rvx * nx + rvy * ny;
  if (vn < 0) {
    let ux = rvx - (1 + e) * vn * nx, uy = rvy - (1 + e) * vn * ny;
    ux *= 0.92; uy *= 0.92;
    b.vx = ux + vxObj; b.vy = uy + vyObj;
  }
  return true;
}

function physique(dt) {
  const b = S.ballon;
  if (!b) return;
  const pas = 4, h = dt / pas;
  for (let k = 0; k < pas; k++) {
    const yAvant = b.y;
    b.vy += GRAVITE * h; b.x += b.vx * h; b.y += b.vy * h;
    b.rot += b.vx * h * 0.05;
    // murs
    if (b.x < RAYON_BALLON) { b.x = RAYON_BALLON; b.vx = Math.abs(b.vx) * 0.6; SONS.rebond(); }
    if (b.x > W - RAYON_BALLON) { b.x = W - RAYON_BALLON; b.vx = -Math.abs(b.vx) * 0.6; SONS.rebond(); }
    // paniers : arceau (deux bords) et passage dans le cercle
    for (const p of S.paniers) {
      for (const sx of [-1, 1]) {
        if (rebondir(b, p.x + sx * p.hw / 2, p.y, 4, p.vx, p.vy, 0.55)) { b.touche = true; SONS.rebond(); }
      }
      if (!b.marque) {
        const relAvant = yAvant - (p.y - p.vy * h), relApres = b.y - p.y;
        if (relAvant < 0 && relApres >= 0 && b.vy - p.vy > 0 && Math.abs(b.x - p.x) < p.hw / 2 - 5) {
          marquer(p, b);
          b.vx = b.vx * 0.35 + p.vx * 0.5; b.vy = Math.min(b.vy, 260);
        }
      }
    }
    // défenseurs en mousse
    for (const d of S.defenseurs) {
      const pos = posDefenseur(d, S.t);
      for (const c of pos.cercles) {
        if (rebondir(b, c.x, c.y, c.r, 0, 0, 0.75)) {
          b.touche = true;
          if (!b.mousse || S.t - b.mousse > 0.25) { SONS.mousse(); b.mousse = S.t; confettis(b.x, b.y, 6, ['#ffffff', '#fde68a']); }
        }
      }
    }
  }
  b.t += dt;
  if (b.marque) b.apresPanier += dt;
  if (b.y > H + 60 || b.t > 6 || (b.marque && b.apresPanier > 0.9)) finBallon();
}

function majMatch(dt) {
  S.t += dt;
  majPaniers(dt);
  physique(dt);
  if (S.affiche !== S.score) {
    const d = S.score - S.affiche;
    S.affiche += Math.sign(d) * Math.max(dt * 14, Math.abs(d) * dt * 6);
    if ((d > 0 && S.affiche > S.score) || (d < 0 && S.affiche < S.score)) S.affiche = S.score;
    $('t-score').textContent = nombre(Math.round(S.affiche));
  }
  if (S.fini && S.finDans >= 0) {
    S.finDans -= dt;
    if (S.finDans < 0) {
      if (S.finType === 'victoire') finVictoire();
      else finDefaite(S.finType);
    }
  }
}

// Dessin du match (et du décor de l'écran titre)
// ---------------------------------------------------------------------------
function bornesVisibles() { return { x0: -OX / SC, x1: (CW - OX) / SC, y0: -OY / SC, y1: (CH - OY) / SC }; }

function dessinerTrajectoire(g) {
  if (!S.pret || S.fini) return;
  if (!S.tirage && !S.clavier.actif) return;
  const v = vitesseTir();
  if (S.tirage && Math.hypot(S.tirage.x - S.tirage.x0, S.tirage.y - S.tirage.y0) < TIRAGE_MIN) return;
  let x = DEPART.x, y = DEPART.y, vx = v.vx, vy = v.vy;
  const pasT = 1 / 60;
  const n = S.niv.aide;
  for (let i = 1; i <= n * 4; i++) {
    vy += GRAVITE * pasT; x += vx * pasT; y += vy * pasT;
    if (i % 4 === 0) {
      const k = i / 4;
      g.fillStyle = `rgba(255,255,255,${0.95 - (k / n) * 0.6})`;
      g.strokeStyle = 'rgba(15,23,42,.45)'; g.lineWidth = 1.5;
      g.beginPath(); g.arc(x, y, 5 - (k / n) * 2, 0, 7); g.fill(); g.stroke();
    }
  }
  // flèche de force
  const f = Math.min(1, Math.hypot(v.vx, v.vy) / VITESSE_MAX);
  g.fillStyle = 'rgba(15,23,42,.45)'; rr(g, 330, 560, 16, 90, 8); g.fill();
  const gr = g.createLinearGradient(0, 650, 0, 560);
  gr.addColorStop(0, '#22c55e'); gr.addColorStop(0.6, '#facc15'); gr.addColorStop(1, '#ef4444');
  g.fillStyle = gr; rr(g, 332, 648 - 86 * f, 12, 86 * f, 6); g.fill();
}

function dessinerScene(g, terrain, t, avecTexte) {
  const b = bornesVisibles();
  dessinerFond(g, terrain, b, t);
}

function dessinerMatch() {
  const g = ctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#14203d'; g.fillRect(0, 0, CW, CH);
  g.setTransform(DPR * SC, 0, 0, DPR * SC, DPR * OX, DPR * OY);
  dessinerScene(g, S.niv.terrain, S.t, true);
  for (const h of S.paniers) dessinerPanierFond(g, h);
  const couleursDef = ['#a78bfa', '#f472b6'];
  S.defenseurs.forEach((d, i) => dessinerDefenseur(g, d, S.t, couleursDef[i % 2]));
  const tenu = S.pret && !S.fini;
  const dec = decalageTenu();
  dessinerJoueur(g, dec.dx, dec.dy, tenu);
  if (tenu) { dessinerBallon(g, DEPART.x + dec.dx, DEPART.y + dec.dy, RAYON_BALLON, S.rot, P.ballon); dessinerMains(g, dec.dx, dec.dy); }
  if (S.ballon) dessinerBallon(g, S.ballon.x, S.ballon.y, RAYON_BALLON, S.ballon.rot, P.ballon);
  for (const h of S.paniers) dessinerPanierAvant(g, h);
  // ballons qui restent (à droite du joueur)
  for (let i = 0; i < S.restants - (tenu ? 1 : 0); i++) {
    dessinerBallon(g, 262 + (i % 5) * 22, 700 - Math.floor(i / 5) * 20, 9, 0, P.ballon);
  }
  dessinerTrajectoire(g);
  dessinerEffets(g);
  // main du tutoriel tant que le premier ballon n'est pas lancé (match 1)
  if (S.niv.nouveau === 'tuto' && !S.aDejaTire && !S.tirage && !S.clavier.actif) {
    const c = (S.t % 2.4) / 2.4;
    const u = c < 0.15 ? 0 : c < 0.65 ? (c - 0.15) / 0.5 : 1;
    const x = DEPART.x - 30 * u, y = DEPART.y + 8 + 60 * u;
    if (c < 0.85) {
      g.setLineDash([6, 6]); g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 3;
      if (u > 0.1) { g.beginPath(); g.moveTo(DEPART.x, DEPART.y); g.quadraticCurveTo(DEPART.x + 70, DEPART.y - 260 * u, DEPART.x + 80 * u + 10, DEPART.y - 330 * u); g.stroke(); }
      g.setLineDash([]);
      dessinerMain(g, x, y, 1.2, c > 0.12);
    }
  }
}

function dessinerTitre() {
  const g = ctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#14203d'; g.fillRect(0, 0, CW, CH);
  // Décor : le monde est cadré pour tenir dans tout l'écran
  const sc = Math.min(CW / W, CH / H), ox = (CW - W * sc) / 2, oy = CH - H * sc;
  g.setTransform(DPR * sc, 0, 0, DPR * sc, DPR * ox, DPR * oy);
  const b = { x0: -ox / sc, x1: (CW - ox) / sc, y0: -oy / sc, y1: (CH - oy) / sc };
  dessinerFond(g, 0, b, tempsGlobal);
  const t = tempsGlobal;
  const deco = [
    { op: '-', n: 2, x: 200, y: 400, hw: 64, brille: 0 },
    { op: '+', n: 3, x: 80, y: 505, hw: 64, brille: 0 },
    { op: 'x', n: 2, x: 320, y: 490, hw: 64, brille: t * 4 },
  ];
  for (const h of deco) dessinerPanierFond(g, h, false);
  // ballon qui rebondit en cloche entre les paniers
  const c = (t % 3) / 3;
  const bx = 200 + Math.sin(c * Math.PI * 2) * 10, by = 560 - Math.sin(c * Math.PI) * 110;
  dessinerMaillot(g, 200, 680, 92, 80, P.maillot);
  g.fillStyle = '#5b3416'; g.beginPath(); g.arc(200, 652, 21, 0, 7); g.fill();
  dessinerBallon(g, bx, by, 16, t * 2, P.ballon);
  for (const h of deco) dessinerPanierAvant(g, h);
  dessinerCoupe(g, 70, 640, 1.1, 3, false);
  dessinerCoupe(g, 335, 650, 0.9, 0, false);
  // étoiles scintillantes
  for (let i = 0; i < 7; i++) {
    const a = t * 1.5 + i * 1.7, s = 4 + Math.sin(a) * 2.5;
    g.fillStyle = '#fde047'; etoileForme(g, 40 + i * 55, 250 + Math.sin(i * 2.1) * 40, s * 1.6, s * 0.6); g.fill();
  }
}

function finVictoire() {

  const points = etoiles * 100 + S.restants * 30 + S.propres * 20;

  const ancienRecord = P.records[i];
  P.etoiles[i] = Math.max(P.etoiles[i], etoiles);
  P.records[i] = Math.max(P.records[i], points);
  niveauOuvertSauvegarde = Math.max(niveauOuvertSauvegarde, Math.min(NIVEAUX.length, n + 1));
  garderLocal();
  try { JEL_SAVE.save(JEU, { niveau: Math.min(NIVEAUX.length, n + 1), score: scoreTotal(), options: optionsSauvegarde() }); } catch (e) { /* rien */ }

  for (let k = 0; k < etoiles; k++) setTimeout(() => { spans[k].classList.add('on'); SONS.etoile(k); }, 350 + k * 320);

  const el = $('v-score'); let affiche = 0; const debut = performance.now();
  const defiler = (m) => { const u = Math.min(1, (m - debut) / 900); affiche = Math.round(points * u); el.textContent = tr('victoire.points', { n: nombre(affiche) }); if (u < 1 && ecran === 'victoire') requestAnimationFrame(defiler); };
  el.textContent = tr('victoire.points', { n: nombre(0) }); requestAnimationFrame(defiler);
  // objet gagné
  const gain = GAINS[i], boite = $('v-gain');
  boite.hidden = !premiereFois;

  g.fillStyle = fonds[niv.terrain]; g.fillRect(0, 0, 400, 240);
  g.fillStyle = niv.terrain === 3 ? '#c98a4b' : niv.terrain === 1 ? '#9aa5b1' : niv.terrain === 2 ? '#f2d49b' : '#e0a060';
  g.fillRect(0, 200, 400, 40);
  const type = niv.nouveau || 'match';
  const mini = (op, n, x, y) => ({ op, n, x, y, hw: 56, secoue: 0, brille: t * 4 });
  const tableau = (valeur, x = 330, y = 30, couleur = '#ff7a59') => {
    g.fillStyle = '#1b1b22'; rr(g, x - 46, y - 22, 92, 44, 8); g.fill();
    g.fillStyle = couleur; g.font = '900 28px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(nombre(valeur), x, y + 1);
  };
  const vol = (x0, y0, x1, y1, u, haut = 120) => ({ x: x0 + (x1 - x0) * u, y: y0 + (y1 - y0) * u - Math.sin(u * Math.PI) * haut });
  if (type === 'tuto') {
    const c = t % 3.4;
    const h = mini('+', 2, 290, 110);
    dessinerPanierFond(g, h);
    const bx = 100, by = 190;
    if (c < 1.2) {
      const u = Math.min(1, c / 0.9);
      const dx = -22 * u, dy = 34 * u;
      g.setLineDash([5, 6]); g.strokeStyle = '#334155'; g.lineWidth = 2.5;
      if (u > 0.2) { g.beginPath(); g.moveTo(bx, by); g.quadraticCurveTo(170, 20 + (1 - u) * 80, 290, 100); g.stroke(); }
      g.setLineDash([]);
      dessinerBallon(g, bx + dx, by + dy, 14, 0, P.ballon);
      dessinerMain(g, bx + dx + 6, by + dy + 10, 1.1, true);
    } else if (c < 2.2) {
      const u = (c - 1.2) / 1.0;
      const p = vol(bx, by, 290, 112, u, 120);
      dessinerBallon(g, p.x, p.y, 14, u * 6, P.ballon);
    } else {
      const u = (c - 2.2) / 1.2;
      dessinerBallon(g, 290, 112 + u * 70, 14, 0, P.ballon);
      h.secoue = Math.max(0, 1 - u * 2);
      g.fillStyle = '#c2410c'; g.font = '900 30px system-ui, sans-serif'; g.textAlign = 'center';
      g.fillText(etiquettePanier(h), 190, 70 - u * 20);
    }
    dessinerPanierAvant(g, h);
  } else if (type === 'moins' || type === 'double') {
    const h = type === 'moins' ? mini('-', 2, 170, 120) : mini('x', 2, 170, 120);
    const avant = type === 'moins' ? 7 : 5, apres = type === 'moins' ? 5 : 10;
    const c = t % 2.8;
    dessinerPanierFond(g, h);
    const u = Math.min(1, c / 1.1);
    const p = vol(40, 200, 170, 122, u, 110);
    if (c < 1.6) dessinerBallon(g, p.x, c < 1.1 ? p.y : 122 + (c - 1.1) * 120, 14, u * 5, P.ballon);
    h.secoue = c > 1.1 && c < 1.6 ? 1 - (c - 1.1) * 2 : 0;
    dessinerPanierAvant(g, h);
    tableau(c < 1.1 ? avant : apres);
    if (c > 1.1) { g.fillStyle = couleursPanier(h.op).fort; g.font = '900 26px system-ui, sans-serif'; g.textAlign = 'center'; g.fillText(etiquettePanier(h), 330, 80); }
  } else if (type === 'glisse' || type === 'monte') {
    const h = mini('+', 3, 200, 120);
    if (type === 'glisse') h.x = 200 + Math.sin(t * 1.4) * 110; else h.y = 130 + Math.sin(t * 1.4) * 40;
    dessinerPanierFond(g, h);
    dessinerPanierAvant(g, h);
    g.strokeStyle = '#2563eb'; g.lineWidth = 4; g.fillStyle = '#2563eb';
    const fleche = (x1, y1, x2, y2) => {
      g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
      const a = Math.atan2(y2 - y1, x2 - x1);
      g.beginPath(); g.moveTo(x2, y2); g.lineTo(x2 - 12 * Math.cos(a - 0.5), y2 - 12 * Math.sin(a - 0.5)); g.lineTo(x2 - 12 * Math.cos(a + 0.5), y2 - 12 * Math.sin(a + 0.5)); g.closePath(); g.fill();
    };
    if (type === 'glisse') { fleche(h.x - 50, 190, h.x - 80, 190); fleche(h.x + 50, 190, h.x + 80, 190); }
    else { fleche(h.x + 60, h.y - 30, h.x + 60, h.y - 70); fleche(h.x + 60, h.y + 10, h.x + 60, h.y + 50); }
  } else if (type === 'compte') {
    const n = niv.ballons, c = t % 3;
    const partis = Math.min(n, Math.floor(c / 0.6));
    for (let i = 0; i < n; i++) {
      g.globalAlpha = i < partis ? 0.2 : 1;
      dessinerBallon(g, 110 + i * 60, 140, 22, 0, P.ballon);
    }
    g.globalAlpha = 1;
    tableau(n - partis, 200, 50, '#8fd3ff');
  } else if (type === 'etapes') {
    const [a, b] = niv.objectifs, c = t % 3.2;
    tableau(a, 120, 100, '#ffd166');
    tableau(b, 280, 100, '#ffd166');
    g.strokeStyle = '#c2410c'; g.lineWidth = 4; g.beginPath(); g.moveTo(176, 100); g.lineTo(222, 100); g.stroke();
    g.fillStyle = '#c2410c'; g.beginPath(); g.moveTo(226, 100); g.lineTo(214, 92); g.lineTo(214, 108); g.closePath(); g.fill();
    if (c > 1) {
      g.strokeStyle = '#16a34a'; g.lineWidth = 7; g.lineCap = 'round';
      g.beginPath(); g.moveTo(100, 150); g.lineTo(115, 165); g.lineTo(142, 135); g.stroke(); g.lineCap = 'butt';
    }
    if (c > 2) { g.strokeStyle = '#facc15'; g.lineWidth = 4; rr(g, 230, 74, 100, 52, 10); g.stroke(); }
  } else if (type === 'defenseur' || type === 'defenseurs') {
    g.save(); g.translate(0, -360);
    const ds = type === 'defenseur' ? [df(200, 90, 1.2, 2.0, 90)] : [df(120, 50, 1.3, 2.2, 90), df(280, 50, 1.0, 1.8, 100, 1)];
    ds.forEach((d, i) => dessinerDefenseur(g, d, t, ['#a78bfa', '#f472b6'][i]));
    g.restore();
    const c = t % 2;
    const p = vol(30, 230, 370, 60, c / 2, 40);
    dessinerBallon(g, p.x, p.y, 13, c * 4, P.ballon);
  } else {
    // match sans nouveauté : aperçu des paniers du match
    const ps = niv.paniers;
    const pasX = 400 / (ps.length + 1);
    ps.forEach((p, i) => {
      const h = mini(p.op, p.n, pasX * (i + 1), 110 + (i % 2) * 40);
      if (p.mv && p.mv.axe === 'h') h.x += Math.sin(t * p.mv.vit + p.mv.ph) * 18;
      if (p.mv && p.mv.axe === 'v') h.y += Math.sin(t * p.mv.vit + p.mv.ph) * 18;
      g.save(); g.translate(h.x, h.y); g.scale(0.8, 0.8); g.translate(-h.x, -h.y);
      dessinerPanierFond(g, h); dessinerPanierAvant(g, h);
      g.restore();
    });
    if (niv.defenseurs) {
      g.save(); g.translate(0, -340);
      niv.defenseurs.forEach((d, i) => dessinerDefenseur(g, { ...d, amp: d.amp * 0.6 }, t, ['#a78bfa', '#f472b6'][i]));
      g.restore();
    }
  }
}

// ---------------------------------------------------------------------------
// Commandes : doigt, souris, clavier
// ---------------------------------------------------------------------------
let pointeurActif = null;
canvas.addEventListener('pointerdown', (e) => {
  if (ecran !== 'jeu' || !S || !S.pret || S.fini) return;
  e.preventDefault();
  audio();
  const m = versMonde(e.clientX, e.clientY);
  pointeurActif = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* rien */ }
  S.tirage = { x0: m.x, y0: m.y, x: m.x, y: m.y, son: false };
  S.clavier.actif = false;
});
canvas.addEventListener('pointermove', (e) => {
  if (!S || !S.tirage || e.pointerId !== pointeurActif) return;
  const m = versMonde(e.clientX, e.clientY);
  S.tirage.x = m.x; S.tirage.y = m.y;
  if (!S.tirage.son && Math.hypot(m.x - S.tirage.x0, m.y - S.tirage.y0) > TIRAGE_MIN) { S.tirage.son = true; SONS.tension(); }
});
function relacher(e) {
  if (!S || !S.tirage || e.pointerId !== pointeurActif) return;
  pointeurActif = null;
  if (ecran === 'jeu') lancer(); else S.tirage = null;
}
canvas.addEventListener('pointerup', relacher);
canvas.addEventListener('pointercancel', (e) => { if (S) S.tirage = null; pointeurActif = null; });

document.addEventListener('keydown', (e) => {
  const code = e.code;
  if (ecran === 'jeu' && S) {
    if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); audio(); SONS.clic(); mettrePause(); return; }
    const k = S.clavier;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyA', 'KeyD', 'KeyW', 'KeyS'].includes(code)) {
      e.preventDefault(); audio();
      if (!k.actif) { k.actif = true; S.tirage = null; }
      if (code === 'ArrowLeft' || code === 'KeyA') k.angle = Math.max(-1.1, k.angle - 0.025);
      if (code === 'ArrowRight' || code === 'KeyD') k.angle = Math.min(1.1, k.angle + 0.025);
      if (code === 'ArrowUp' || code === 'KeyW') k.force = Math.min(1, k.force + 0.012);
      if (code === 'ArrowDown' || code === 'KeyS') k.force = Math.max(0.3, k.force - 0.012);
      return;
    }
    if (code === 'Space' || code === 'Enter') {
      e.preventDefault();
      if (!k.actif) { k.actif = true; return; }
      lancer();
    }
    return;
  }
  if (ecran === 'pause' && (code === 'Escape' || code === 'KeyP')) { e.preventDefault(); reprendre(); return; }
  if (ecran === 'intro' && (code === 'Space' || code === 'Enter' || code === 'ArrowUp' || code === 'ArrowDown' || code === 'ArrowLeft' || code === 'ArrowRight')) { e.preventDefault(); commencerMatch(); return; }
  if (code === 'Escape' && (ecran === 'niveaux' || ecran === 'armoire')) { e.preventDefault(); if (ecran === 'armoire' && retourArmoire === 'bilan') montrer('bilan'); else allerAccueil(); }
});

// ---------------------------------------------------------------------------
// Boucle principale
// ---------------------------------------------------------------------------
let derniere = performance.now();
function boucle(m) {
  const dt = Math.min(0.05, Math.max(0, (m - derniere) / 1000));
  derniere = m;
  tempsGlobal += dt;
  if (ecran === 'jeu' && S) {
    majMatch(dt);
    majEffets(dt);
  } else if (ecran !== 'pause') {
    majEffets(dt);
  }
  if (S && ['jeu', 'pause', 'intro', 'victoire', 'defaite'].includes(ecran)) dessinerMatch();
  else dessinerTitre();
  if (ecran === 'intro') dessinerDemo(dt);
  requestAnimationFrame(boucle);
}

// ---------------------------------------------------------------------------
// Lancement : bouton Jouer et sauvegarde
// ---------------------------------------------------------------------------
function boutonJouer() {
  audio(); SONS.clic();
  JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => {
      const n = Math.max(1, Math.min(NIVEAUX.length, Number(d.niveau) || 1));
      niveauOuvertSauvegarde = Math.max(niveauOuvertSauvegarde, n);
      demarrerMatch(n);
    },
    onNouvelle: () => demarrerMatch(1),
    onEffacer: () => {
      P = progressionVide(); niveauOuvertSauvegarde = 1;
      garderLocal();
      demarrerMatch(1);
    },
  });
}
$('b-jouer').addEventListener('click', boutonJouer);

// Sauvegarde à la fermeture, seulement pendant un match
JEL_SAVE.surFermeture(() => {
  if (S && (ecran === 'jeu' || ecran === 'intro' || ecran === 'pause')) sauverPartie(S.n);
});

chargerProgression();
majBoutonsSon();
redimensionner();
montrer('titre');
requestAnimationFrame(boucle);
</script>
