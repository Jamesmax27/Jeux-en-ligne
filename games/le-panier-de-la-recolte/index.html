<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],

    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }

      return Promise.resolve(c);

  // --- Sélecteur de langue ---------------------------------------------------

  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +

    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +

    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  function majSelecteurs() {

  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)

      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();

      menu.hidden = true;

      bouton.setAttribute('aria-expanded', 'false');

    });
    bouton.addEventListener('keydown', function (e) {

      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];

      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];

    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;

    }

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

    try { texte = JSON.stringify(tout); } catch (e) { return false; }

  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
/* ==========================================================================
   Le Panier de la Récolte — jeu de fusion de fruits pour Free Micro Games.
   On lâche des fruits dans un panier ; deux pareils qui se touchent fusionnent
   en un plus gros. Physique de disques maison, rendu canvas, sons Web Audio.
   Tout texte visible passe par t() (module commun jel-i18n).
   ========================================================================== */
(function () {
  'use strict';

  const JEU = 'le-panier-de-la-recolte';

  // Réserve de fruits d'un niveau, tirée de son but (valeur d'un fruit = 2^rang).
  function reserveNiveau(def) {
    let somme = 0, poids = 0;
    for (const k in def.lache) { somme += def.lache[k] * Math.pow(2, Number(k)); poids += def.lache[k]; }
    const moyenne = somme / poids;
    const partNormale = poids / (poids + (def.noix || 0) + (def.or || 0));
    let besoin = 0, fusions = 0;
    for (const b of def.buts) {
      if (b.fusions) fusions = b.fusions;
      else besoin = Math.max(besoin, b.n * Math.pow(2, b.t));
    }
    let n = Math.ceil((besoin / moyenne) * def.marge / partNormale) + 4;
    n = Math.max(n, Math.ceil(fusions * 1.5) + 6);
    return n;
  }

  const Son = {
    ctx: null, maitre: null,
    init() {

    ton(freq, duree, type, vol, glisse, delai) {

      o.connect(g); g.connect(this.maitre);

    mode: 'titre',           // titre | jeu | niveaux

  // Construit le contour (tourné si le panier penche) en segments du monde.
  function majMurs() {
    const rec = etat.rec, a = etat.angle, c = Math.cos(a), s = Math.sin(a);
    const [px, py] = rec.pivot;
    const pts = rec.pts.map(([x, y]) => [px + (x - px) * c - (y - py) * s, py + (x - px) * s + (y - py) * c]);
    const murs = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      const dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy) || 1;
      murs.push({ x1, y1, x2, y2, dx: dx / l, dy: dy / l, l, nx: dy / l, ny: -dx / l });
    }
    etat.murs = murs;
    etat.rimG = pts[0];
    etat.rimD = pts[pts.length - 1];
    etat.ptsMonde = pts;
  }
  // Point du monde correspondant à un point local du récipient (avec la pente).
  function versMonde(x, y) {
    const rec = etat.rec, a = etat.angle, c = Math.cos(a), s = Math.sin(a);
    const [px, py] = rec.pivot;
    return [px + (x - px) * c - (y - py) * s, py + (x - px) * s + (y - py) * c];
  }
  // Hauteur de la ligne de débordement à l'abscisse x.
  function ligneA(x) {
    // La ligne relie les deux bords à la hauteur du bord le plus bas (penchée avec le panier).
    const p = etat.rec.pts, y = etat.rec.ligne;
    const g = versMonde(p[0][0], y), d = versMonde(p[p.length - 1][0], y);
    const k = Math.max(0, Math.min(1, (x - g[0]) / (d[0] - g[0])));
    return g[1] + (d[1] - g[1]) * k;
  }

  function nouveauFruit(k, t, x, y) {
    const r = k === 'f' ? FRUITS[t].r : (k === 'noix' ? R_NOIX : R_OR);
    return { id: etat.prochainId++, k, t, x, y, vx: 0, vy: 0, r, rt: r, ang: (Math.random() - 0.5) * 0.6, va: 0, age: 0, colle: 0, chaine: 0, nee: 9, pop: 0, mort: false, cligne: Math.random() * 4 };
  }

  function tirerFruit() {
    const d = etat.def;
    const choix = [];
    for (const k in d.lache) choix.push(['f', Number(k), d.lache[k]]);
    if (d.noix) choix.push(['noix', 0, d.noix]);
    if (d.or && !(etat.enMain && etat.enMain.k === 'or')) choix.push(['or', 0, d.or]);
    let tot = 0; for (const c of choix) tot += c[2];
    let x = Math.random() * tot;
    for (const c of choix) { x -= c[2]; if (x <= 0) return { k: c[0], t: c[1] }; }
    return { k: choix[0][0], t: choix[0][1] };
  }

  function prendreFruit() {
    if (etat.reserve <= 0 || etat.enMain) return;
    etat.enMain = etat.suivant || tirerFruit();
    etat.suivant = tirerFruit();
    bornerMain();
  }

  function rayonDe(f) { return f.k === 'f' ? FRUITS[f.t].r : (f.k === 'noix' ? R_NOIX : R_OR); }
  function hauteurPrise() { return Math.min(etat.rimG[1], etat.rimD[1]) - 18; }
  function bornerMain() {
    const r = etat.enMain ? rayonDe(etat.enMain) : 6;
    const gx = Math.max(etat.rimG[0], versMonde(etat.rec.xmin, etat.rec.ligne)[0]) + r + 1.5;
    const dx = Math.min(etat.rimD[0], versMonde(etat.rec.xmax, etat.rec.ligne)[0]) - r - 1.5;
    etat.mainX = Math.max(gx, Math.min(dx, etat.mainX));
  }

  // Lâcher le fruit tenu.
  function lacher() {
    if (!etat.enMain || etat.fini || !etat.actif || etat.pause) return;
    bornerMain();
    const f = nouveauFruit(etat.enMain.k, etat.enMain.t, etat.mainX, hauteurPrise());
    f.vy = 40;
    etat.fruits.push(f);
    etat.enMain = null;
    etat.reserve--;
    etat.attente = 0.42;
    etat.premierLacher = true;
    Son.lacher();
  }

  // ------------------------------------------------------------------------
  // Physique : disques, gravité, murs du récipient, fusions
  // ------------------------------------------------------------------------
  function physique(dt) {
    const fr = etat.fruits;
    for (const f of fr) {
      f.age += dt; f.nee += dt;
      if (f.r < f.rt) f.r = Math.min(f.rt, f.r + (f.rt - f.r) * Math.min(1, dt * 14) + dt * 4);
      if (f.colle > 0) { f.vx = 0; f.vy = 0; continue; }
      f.vy += GRAVITE * dt;
      f.vx *= 0.9985; f.vy *= 0.9992;
      f.x += f.vx * dt; f.y += f.vy * dt;
    }
    const fusions = [];
    for (let it = 0; it < 3; it++) {
      // Fruits entre eux
      for (let i = 0; i < fr.length; i++) {
        const a = fr[i];
        for (let j = i + 1; j < fr.length; j++) {
          const b = fr[j];
          const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
          if (dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
          const d2 = dx * dx + dy * dy;
          if (d2 >= rr * rr) {
            if (it === 0 && d2 < (rr + 0.4) * (rr + 0.4) && peutFusionner(a, b)) fusions.push([a, b]);
            continue;
          }
          const d = Math.sqrt(d2) || 0.001, nx = dx / d, ny = dy / d;
          if (it === 0 && peutFusionner(a, b)) fusions.push([a, b]);
          const ia = a.colle > 0 ? 0 : 1 / (a.r * a.r), ib = b.colle > 0 ? 0 : 1 / (b.r * b.r);
          if (ia + ib === 0) continue;
          const pen = rr - d, corr = pen / (ia + ib) * 0.85;
          a.x -= nx * corr * ia; a.y -= ny * corr * ia;
          b.x += nx * corr * ib; b.y += ny * corr * ib;
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy, vn = rvx * nx + rvy * ny;
          if (vn < 0) {
            const e = (a.k === 'noix' || b.k === 'noix') ? 0.55 : 0.12;
            const jn = -(1 + e) * vn / (ia + ib);
            a.vx -= jn * ia * nx; a.vy -= jn * ia * ny;
            b.vx += jn * ib * nx; b.vy += jn * ib * ny;
            const tx = -ny, ty = nx, vt = rvx * tx + rvy * ty;
            const jt = -vt * 0.12 / (ia + ib);
            a.vx -= jt * ia * tx; a.vy -= jt * ia * ty;
            b.vx += jt * ib * tx; b.vy += jt * ib * ty;
            if (it === 0 && (a.k === 'noix' || b.k === 'noix') && vn < -90) Son.noix();
          }
        }
      }
      // Murs du récipient
      for (const f of fr) {
        if (f.colle > 0) continue;
        for (const m of etat.murs) {
          const qx = f.x - m.x1, qy = f.y - m.y1;
          const proj = qx * m.dx + qy * m.dy;
          let nx, ny, dist;
          if (proj > 0 && proj < m.l) {
            dist = qx * m.nx + qy * m.ny; // distance signée côté intérieur
            if (dist >= f.r || dist < -f.r * 2.5) continue;
            nx = m.nx; ny = m.ny;
          } else {
            const px = proj <= 0 ? m.x1 : m.x2, py = proj <= 0 ? m.y1 : m.y2;
            const ex = f.x - px, ey = f.y - py; dist = Math.hypot(ex, ey);
            if (dist >= f.r || dist === 0) continue;
            nx = ex / dist; ny = ey / dist;
          }
          const pen = f.r - dist;
          f.x += nx * pen; f.y += ny * pen;
          const vn = f.vx * nx + f.vy * ny;
          if (vn < 0) {
            const e = f.k === 'noix' ? 0.62 : 0.14;
            f.vx -= (1 + e) * vn * nx; f.vy -= (1 + e) * vn * ny;
            const tx = -ny, ty = nx, vt = f.vx * tx + f.vy * ty;
            f.vx -= vt * 0.025 * tx; f.vy -= vt * 0.025 * ty;
            if (it === 0 && vn < -120 && f.age < 3) { if (f.k === 'noix') Son.noix(); else Son.poser(); }
          }
        }
      }
    }
    for (const f of fr) f.ang += (f.vx / Math.max(f.r, 1)) * dt * 0.9;
    for (const [a, b] of fusions) if (!a.mort && !b.mort) fusionner(a, b);
    if (fusions.length) etat.fruits = fr.filter((f) => !f.mort);
    // Fruit sorti du panier (rare) : retiré.
    etat.fruits = etat.fruits.filter((f) => !(f.y > 80 || Math.abs(f.x) > 260));
  }

  let fusionsActives = true;
  function peutFusionner(a, b) {
    if (!fusionsActives) return false;
    if (a.k === 'or' || b.k === 'or') return true;
    if (a.k === 'noix' && b.k === 'noix') return true;
    return a.k === 'f' && b.k === 'f' && a.t === b.t;
  }

  function compter(rang) {
    etat.progres[rang] = (etat.progres[rang] || 0) + 1;
  }

  function ajouterPoints(n, x, y, couleur) {
    etat.score += n;
    etat.textes.push({ x, y, txt: tr('flottant.points', { n: nb(n) }), vie: 1.1, coul: couleur || '#fff', taille: 1 });
  }

  function jus(x, y, couleur, n, force) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (0.4 + Math.random()) * (force || 60);
      etat.effets.push({ type: 'goutte', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, vie: 0.6 + Math.random() * 0.4, max: 1, coul: couleur, t: 0.9 + Math.random() * 1.4 });
    }
  }
  function etincelles(x, y, n, couleur) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 30 + Math.random() * 90;
      etat.effets.push({ type: 'etoile', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 0.7 + Math.random() * 0.5, max: 1.2, coul: couleur || '#ffe46b', t: 1.4 + Math.random() * 1.6, rot: Math.random() * 6 });
    }
  }
  function anneau(x, y, r, couleur) { etat.effets.push({ type: 'anneau', x, y, r, vie: 0.45, max: 0.45, coul: couleur }); }

  function fusionner(a, b) {
    // Fruit doré : fait grandir l'autre fruit, ou casse une noix.
    if (a.k === 'or' || b.k === 'or') {
      const o = a.k === 'or' ? a : b, x = o === a ? b : a;
      o.mort = true;
      etincelles(o.x, o.y, 14);
      Son.dore();
      if (x.k === 'or') { x.mort = true; naitre(4, (o.x + x.x) / 2, (o.y + x.y) / 2, 0, 0, o.r, 1); return; }
      if (x.k === 'noix') { casserNoix(x); return; }
      x.mort = true;
      if (x.t >= DERNIER) { feuArtifice(x); return; }
      naitre(x.t + 1, x.x, x.y, x.vx * 0.5, x.vy * 0.5, x.r, 1);
      etat.fusions++;
      return;
    }
    if (a.k === 'noix') { casserNoix(a); casserNoix(b); ajouterPoints(30, (a.x + b.x) / 2, (a.y + b.y) / 2, '#ffe0b0'); return; }
    a.mort = b.mort = true;
    if (a.t >= DERNIER) { feuArtifice(a, b); return; }
    const ma = a.r * a.r, mb = b.r * b.r;
    const x = (a.x * ma + b.x * mb) / (ma + mb), y = (a.y * ma + b.y * mb) / (ma + mb);
    let c = 1;
    const recent = (f) => f.chaine > 0 && f.nee < 0.9;
    if (recent(a) || recent(b)) c = Math.max(recent(a) ? a.chaine : 0, recent(b) ? b.chaine : 0) + 1;
    naitre(a.t + 1, x, y, (a.vx + b.vx) * 0.25, (a.vy + b.vy) * 0.25, Math.max(a.r, b.r), c);
    etat.fusions++;
  }

  function naitre(rang, x, y, vx, vy, r0, chaine) {
    const f = nouveauFruit('f', rang, x, y);
    f.vx = vx; f.vy = vy; f.r = r0; f.chaine = chaine; f.nee = 0; f.pop = 1; f.age = 1;
    etat.fruits.push(f);
    compter(rang);
    const pts = FRUITS[rang].pts * chaine;
    ajouterPoints(pts, x, y - f.rt, chaine > 1 ? '#ffe46b' : '#fff');
    jus(x, y, FRUITS[rang - 1 >= 0 ? rang - 1 : 0].coul, 8 + rang * 2, 50 + rang * 10);
    anneau(x, y, f.rt * 1.3, '#fff6d0');
    Son.pop(rang);
    if (chaine > 1) {
      etat.chaineMax = Math.max(etat.chaineMax, chaine);
      etat.textes.push({ x, y: y - f.rt - 12, txt: tr('flottant.chaine', { n: chaine }), vie: 1.4, coul: '#ffd23f', taille: 1.5 });
      Son.chaine(chaine);
    }
    if (rang >= 6) etat.secousse = Math.max(etat.secousse, 0.12 + (rang - 6) * 0.08);
    if (rang === DERNIER) {
      etincelles(x, y, 30, '#ffb347');
      etat.textes.push({ x, y: y - 30, txt: tr('flottant.citrouille'), vie: 1.8, coul: '#ffe46b', taille: 1.6 });
      Son.citrouille();
    }
  }

  function casserNoix(n) {
    n.mort = true;
    for (let i = 0; i < 9; i++) {
      const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 70;
      etat.effets.push({ type: 'coque', x: n.x, y: n.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, vie: 0.9, max: 0.9, coul: '#9b6a3a', t: 1.6 + Math.random() * 1.4, rot: Math.random() * 6 });
    }
    Son.casse();
  }

  // Deux citrouilles géantes : feu d'artifice, elles partent au banquet.
  function feuArtifice(a, b) {
    const x = b ? (a.x + b.x) / 2 : a.x, y = b ? (a.y + b.y) / 2 : a.y;
    etincelles(x, y, 50, '#ffb347');
    etincelles(x, y, 30, '#fff1a8');
    ajouterPoints(500, x, y - 20, '#ffe46b');
    etat.secousse = 0.5;
    etat.fusions++;
    Son.citrouille();
  }

  // ------------------------------------------------------------------------
  // Confiture, écureuil, débordement, fin du niveau
  // ------------------------------------------------------------------------
  function placerConfitures() {
    etat.confitures = (etat.def.confiture || []).map(([cote, h]) => ({ cote, h, recharge: 0 }));
  }
  function positionConfiture(c) {
    // Point de la paroi gauche (ou droite) à la hauteur relative h.
    const rec = etat.rec, y = rec.fond + (rec.ligne - rec.fond) * c.h;
    const pts = rec.pts;
    const cote = c.cote === 'g' ? pts.slice(0, Math.ceil(pts.length / 2)) : pts.slice(Math.floor(pts.length / 2)).reverse();
    for (let i = 0; i < cote.length - 1; i++) {
      const [x1, y1] = cote[i], [x2, y2] = cote[i + 1];
      if ((y - y1) * (y - y2) <= 0 && y1 !== y2) {
        const k = (y - y1) / (y2 - y1);
        return versMonde(x1 + (x2 - x1) * k, y);
      }
    }
    return versMonde(cote[0][0], y);
  }
  function majConfitures(dt) {
    for (const c of etat.confitures) {
      if (c.recharge > 0) { c.recharge -= dt; continue; }
      const [cx, cy] = positionConfiture(c);
      for (const f of etat.fruits) {
        if (f.colle > 0 || f.k === 'or') continue;
        if (Math.hypot(f.x - cx, f.y - cy) < f.r + 5) {
          f.colle = DUREE_COLLE; c.recharge = 7.5;
          jus(cx, cy, '#b0123b', 6, 30);
          etat.textes.push({ x: f.x, y: f.y - f.r - 4, txt: tr('jeu.colle'), vie: 1, coul: '#ffd0dc', taille: 0.9 });
          Son.confiture();
          break;
        }
      }
    }
    for (const f of etat.fruits) if (f.colle > 0) f.colle = Math.max(0, f.colle - dt);
  }

  function majEcureuil(dt) {
    if (!etat.def.ecureuil) return;
    const e = etat.ecu;
    if (!e) {
      etat.ecuMinuteur -= dt;
      if (etat.ecuMinuteur <= 0) {
        const cote = Math.random() < 0.5 ? -1 : 1;
        etat.ecu = { cote, phase: 'arrive', t: 0, fruit: null, x: 0, y: 0 };
        Son.ecureuil();
      }
      return;
    }
    e.t += dt;
    const rim = e.cote < 0 ? etat.rimG : etat.rimD;
    const baseX = rim[0] + e.cote * 3, baseY = rim[1] - 7;
    if (e.phase === 'arrive') {
      const k = Math.min(1, e.t / 0.6);
      e.x = baseX + e.cote * (1 - k) * 60; e.y = baseY;
      if (k >= 1) { e.phase = 'renifle'; e.t = 0; }
    } else if (e.phase === 'renifle') {
      e.x = baseX; e.y = baseY;
      if (e.t >= 3) {
        let cible = null;
        for (const f of etat.fruits) if (f.k === 'f' && f.colle <= 0 && f.age > 1 && (!cible || f.t < cible.t || (f.t === cible.t && f.y < cible.y))) cible = f;
        if (cible) { e.phase = 'saute'; e.t = 0; e.cible = cible; e.depX = e.x; e.depY = e.y; Son.vol(); }
        else { e.phase = 'fuite'; e.t = 0; }
      }
    } else if (e.phase === 'saute') {
      const c = e.cible, k = Math.min(1, e.t / 0.45);
      if (c.mort) { e.phase = 'fuite'; e.t = 0; return; }
      e.x = e.depX + (c.x - e.depX) * k; e.y = e.depY + (c.y - e.depY) * k - Math.sin(k * Math.PI) * 25;
      if (k >= 1) {
        c.mort = true; etat.fruits = etat.fruits.filter((f) => !f.mort);
        e.fruit = c.t; e.phase = 'fuite'; e.t = 0; e.depX = e.x; e.depY = e.y;
        const perte = Math.min(2, Math.max(0, etat.reserve - (etat.enMain ? 1 : 0)));
        etat.reserve -= perte;
        montrerMessage(tr('jeu.ecureuil'), '#ffd0a0');
        Son.ecureuil();
      }
    } else if (e.phase === 'fuite') {
      const k = Math.min(1, e.t / 0.8);
      const fx = (e.depX !== undefined ? e.depX : baseX), fy = (e.depY !== undefined ? e.depY : baseY);
      e.x = fx + e.cote * k * 120; e.y = fy - Math.sin(k * Math.PI) * 20 - k * 10;
      if (k >= 1) { etat.ecu = null; etat.ecuMinuteur = 13 + Math.random() * 6; }
    }
  }
  function toucherEcureuil(wx, wy) {
    const e = etat.ecu;
    if (!e || (e.phase !== 'arrive' && e.phase !== 'renifle')) return false;
    if (wx !== null && Math.hypot(wx - e.x, wy - (e.y - 4)) > 16) return false;
    e.phase = 'fuite'; e.t = 0; e.depX = e.x; e.depY = e.y;
    etat.reserve += 1;
    ajouterPoints(25, e.x, e.y - 14, '#ffe0b0');
    montrerMessage(tr('jeu.ouste'), '#d8ffb0');
    etincelles(e.x, e.y - 6, 10, '#fff');
    Son.ouste();
    return true;
  }

  function montrerMessage(txt, coul) { etat.message = { txt, coul, vie: 2 }; }

  // Remplissage du panier (0 à 100 %) : hauteur du fruit posé le plus haut.
  function remplissage() {
    const rec = etat.rec; let haut = rec.fond;
    for (const f of etat.fruits) if (f.age > 0.8) haut = Math.min(haut, f.y - f.r);
    return Math.max(0, Math.min(100, Math.round((rec.fond - haut) / (rec.fond - rec.ligne) * 100)));
  }

  function butsAtteints() {
    return etat.def.buts.every((b) => (b.fusions ? etat.fusions >= b.fusions : (etat.progres[b.t] || 0) >= b.n));
  }

  function majDanger(dt) {
    let dedans = false;
    for (const f of etat.fruits) {
      if (f.age < 1.3) continue;
      if (Math.hypot(f.vx, f.vy) > 90) continue;
      if (f.y - f.r < ligneA(f.x) - 0.5) { dedans = true; break; }
    }
    if (dedans) {
      etat.danger += dt;
      etat.alerteT -= dt;
      if (etat.alerteT <= 0) { Son.alerte(); etat.alerteT = 0.5; }
    } else {
      etat.danger = Math.max(0, etat.danger - dt * 2);
      etat.alerteT = 0;
    }
  }

  function majJeu(dt) {
    etat.temps += dt;
    const d = etat.def;
    etat.angle = d.penche ? (d.penche * Math.PI / 180) * Math.sin(etat.temps * Math.PI * 2 / 9) : 0;
    majMurs();
    if (!etat.enMain && etat.attente > 0) { etat.attente -= dt; if (etat.attente <= 0) prendreFruit(); }
    if (!etat.enMain && etat.attente <= 0) prendreFruit();
    if (clavier.g) { etat.mainX -= 95 * dt; }
    if (clavier.d) { etat.mainX += 95 * dt; }
    bornerMain();
    const pas = Math.max(1, Math.ceil(dt / (1 / 240)));
    for (let i = 0; i < pas; i++) physique(dt / pas);
    majConfitures(dt);
    majEcureuil(dt);
    majEffets(dt);
    if (etat.fini) return;
    majDanger(dt);
    if (etat.gagneT >= 0) {
      etat.gagneT += dt;
      if (etat.gagneT > 1.1) victoire();
      return;
    }
    if (butsAtteints()) {
      etat.gagneT = 0; etat.placeFin = remplissage();
      montrerMessage(tr('jeu.butAtteint'), '#fff3a0');
      etincelles(0, (etat.rec.ligne) / 2, 40, '#ffe46b');
      Son.chaine(4);
      return;
    }
    if (etat.danger > DUREE_DEBORDE) { defaite('deborde'); return; }
    if (etat.reserve <= 0 && !etat.enMain) {
      etat.finAttente += dt;
      if (etat.finAttente > 2.6) defaite('reserve');
    } else etat.finAttente = 0;
  }

  function majEffets(dt) {
    for (const e of etat.effets) {
      e.vie -= dt;
      if (e.vx !== undefined) { e.x += e.vx * dt; e.y += e.vy * dt; if (e.type !== 'etoile') e.vy += 260 * dt; else { e.vx *= 0.96; e.vy *= 0.96; } }
      if (e.rot !== undefined) e.rot += dt * 6;
    }
    etat.effets = etat.effets.filter((e) => e.vie > 0);
    for (const t of etat.textes) { t.vie -= dt; t.y -= 22 * dt; }
    etat.textes = etat.textes.filter((t) => t.vie > 0);
    if (etat.message) { etat.message.vie -= dt; if (etat.message.vie <= 0) etat.message = null; }
    etat.secousse = Math.max(0, etat.secousse - dt);
    for (const f of etat.fruits) { f.pop = Math.max(0, f.pop - dt * 3); f.cligne -= dt; if (f.cligne < -0.15) f.cligne = 2 + Math.random() * 4; }
  }

  // ------------------------------------------------------------------------
  // Démarrage et fin des niveaux
  // ------------------------------------------------------------------------
  function preparerNiveau(i) {
    etat.niv = i; etat.def = NIVEAUX[i]; etat.rec = RECIPIENTS[etat.def.rec];
    etat.fruits = []; etat.effets = []; etat.textes = []; etat.message = null;
    etat.progres = []; etat.fusions = 0; etat.chaineMax = 0; etat.score = 0;
    etat.danger = 0; etat.temps = 0; etat.angle = 0; etat.gagneT = -1; etat.finAttente = 0;
    etat.fini = false; etat.ecu = null; etat.ecuMinuteur = 8 + Math.random() * 3;
    etat.enMain = null; etat.suivant = null; etat.attente = 0; etat.mainX = 0; etat.secousse = 0;
    etat.reserve = reserveNiveau(etat.def);
    etat.premierLacher = i > 0;
    majMurs();
    placerConfitures();
    prendreFruit();
    calculerVue();
  }

  function lancerNiveau(i) {
    Son.init();
    i = Math.max(0, Math.min(NIVEAUX.length - 1, i));
    preparerNiveau(i);
    etat.mode = 'jeu'; etat.demo = false; etat.actif = false; etat.pause = false;
    prog.atteint = Math.max(prog.atteint, i + 1);
    cacherTout();
    $('barre').hidden = false;
    montrerCarte();
  }

  function commencer() {
    $('fen-carte').hidden = true;
    etat.actif = true; etat.pause = false;
    Son.clic();
  }

  function calculEtoiles() {
    const e = [true, etat.chaineMax >= etat.def.chaine, (etat.placeFin !== undefined ? etat.placeFin : remplissage()) < SEUIL_PLACE];
    return { liste: e, n: e.filter(Boolean).length };
  }

  function victoire() {
    if (etat.fini) return;
    etat.fini = true; etat.actif = false;
    const N = etat.niv + 1;
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: N });
    const et = calculEtoiles();
    const ancien = prog.records[etat.niv];
    const nouveauRecord = etat.score > ancien;
    prog.etoiles[etat.niv] = Math.max(prog.etoiles[etat.niv], et.n);
    if (nouveauRecord) prog.records[etat.niv] = etat.score;
    prog.atteint = Math.max(prog.atteint, Math.min(NIVEAUX.length, N + 1));
    sauver(N + 1);
    if (prog.etoiles.every((x) => x > 0)) {
      if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
    }
    Son.victoire();
    confettis();
    montrerFin(true, et, nouveauRecord, ancien);
  }

  function defaite(raison) {
    if (etat.fini) return;
    etat.fini = true; etat.actif = false;
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: etat.niv + 1 });
    Son.defaite();
    montrerFin(false, null, false, prog.records[etat.niv], raison);
  }

  function confettis() {
    const couleurs = ['#ff5d5d', '#ffd23f', '#6fd05a', '#4fb3ff', '#ff8ad8', '#ffa53c'];
    for (let i = 0; i < 90; i++) {
      etat.effets.push({ type: 'confetti', ecran: true, x: Math.random() * W, y: -20 - Math.random() * H * 0.4, vx: (Math.random() - 0.5) * 60, vy: 60 + Math.random() * 120, vie: 3 + Math.random() * 2, max: 5, coul: couleurs[i % couleurs.length], t: 6 + Math.random() * 6, rot: Math.random() * 6 });
    }
  }

  // ------------------------------------------------------------------------
  // Mise à l'échelle
  // ------------------------------------------------------------------------
  function calculerVue() {
    W = window.innerWidth || 390; H = window.innerHeight || 844;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    if (cv.width !== Math.round(W * DPR) || cv.height !== Math.round(H * DPR)) {
      cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    }
    HUD = W < 600 ? 112 : 80;
    const rec = etat.rec;
    const haut = -rec.ligne + 36, bas = 14;
    const marge = Math.max(26, H * 0.05);
    const dispo = H - HUD - 8 - marge;
    const largeur = (rec.xmax - rec.xmin) + 30;
    S = Math.max(1, Math.min(dispo / (haut + bas), W * 0.95 / largeur, 7.5));
    OX = W / 2;
    OY = H - marge - bas * S;
    const ecart = dispo - (haut + bas) * S;
    if (ecart > 0) OY -= ecart * 0.3;
    construireDecor();
  }

  // ------------------------------------------------------------------------
  // Dessin des fruits (centrés sur 0,0, rayon r, déjà tournés)
  // ------------------------------------------------------------------------
  function degrade(c, r, clair, fonce) {
    const g = c.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.1);
    g.addColorStop(0, clair); g.addColorStop(1, fonce);
    return g;
  }
  function visage(c, r, f, dy) {
    const yeux = -r * 0.02 + (dy || 0), ex = r * 0.3, er = Math.max(0.6, r * 0.12);
    const ferme = f && f.cligne < 0;
    const inquiet = f && f.inquiet;
    c.fillStyle = '#2b170a'; c.strokeStyle = '#2b170a';
    if (ferme) {

    ctx.lineWidth = etat.danger > 0 ? 1.6 : 1; ctx.setLineDash([4, 3]);

    }

  function preparerDemo() {

    etat.rec = RECIPIENTS.panier; etat.fruits = []; etat.effets = []; etat.textes = [];

      bornerMain();
      const f = nouveauFruit(etat.enMain.k, etat.enMain.t, etat.mainX, hauteurPrise());
      etat.fruits.push(f); etat.enMain = null; etat.attente = 0.3;

    }
    if (!etat.enMain) { etat.attente -= dt; if (etat.attente <= 0) prendreFruit(); }

  // Le banquet : chaque niveau gagné pose son fruit-but sur une assiette.
  function peindreBanquet(cnv) {
    const w = cnv.clientWidth || 300, h = cnv.clientHeight || 150;
    cnv.width = Math.round(w * DPR); cnv.height = Math.round(h * DPR);
    const c = cnv.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#ffe7b8'); g.addColorStop(1, '#f6c77a');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    // Guirlande
    for (let x = 6; x < w; x += 22) { c.fillStyle = ['#ff5d5d', '#ffd23f', '#6fd05a', '#4fb3ff'][Math.round(x / 22) % 4]; c.beginPath(); c.moveTo(x - 7, 4); c.lineTo(x + 7, 4); c.lineTo(x, 18); c.fill(); }
    // Nappe
    const yT = h * 0.3;
    c.fillStyle = '#fff4e6'; c.fillRect(0, yT, w, h - yT);
    for (let x = 0; x < w; x += 14) for (let y = yT; y < h; y += 14) if ((Math.floor(x / 14) + Math.floor((y - yT) / 14)) % 2) { c.fillStyle = 'rgba(224,72,62,.55)'; c.fillRect(x, y, 14, 14); }
    // 2 rangées de 10 assiettes
    for (let i = 0; i < NIVEAUX.length; i++) {
      const rang = i < 10 ? 0 : 1, col = i % 10;
      const pas = w / 10, x = pas * (col + 0.5), y = rang ? h * 0.9 : h * 0.6;
      const ra = Math.min(pas * 0.46, rang ? 24 : 21);
      c.fillStyle = 'rgba(0,0,0,.12)'; c.beginPath(); c.ellipse(x, y + 3, ra, ra * 0.4, 0, 0, 7); c.fill();
      c.fillStyle = '#ffffff'; c.strokeStyle = '#d9c3a0'; c.lineWidth = 1.2; c.beginPath(); c.ellipse(x, y, ra, ra * 0.4, 0, 0, 7); c.fill(); c.stroke();
      if (prog.etoiles[i] > 0) {
        const but = NIVEAUX[i].buts.filter((b) => !b.fusions).reduce((m, b) => Math.max(m, b.t), 0);
        dessinerIcone(c, 'f', but, x, y - ra * 0.55, ra * 0.95);
      }
    }
  }

  // ------------------------------------------------------------------------
  // Démonstrations animées des mécaniques (carte du niveau)
  // ------------------------------------------------------------------------
  function peindreDemo(t) {
    const cnv = $('carte-demo');
    if (!cnv || $('carte-meca').hidden) return;
    const w = cnv.clientWidth || 300, h = cnv.clientHeight || 150;
    if (cnv.width !== Math.round(w * DPR)) { cnv.width = Math.round(w * DPR); cnv.height = Math.round(h * DPR); }
    const c = cnv.getContext('2d');
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.fillStyle = '#fde7bf'; c.fillRect(0, 0, w, h);
    const k = h / 100; // unités de démonstration : 100 de haut
    c.save(); c.translate(w / 2, h * 0.92); c.scale(k, k);
    const cycle = (d) => (t % d) / d;
    // Panier simple
    const panier = (pts) => { c.lineJoin = 'round'; cheminRecipient(c, pts); c.strokeStyle = '#7b4a1e'; c.lineWidth = 5; c.stroke(); cheminRecipient(c, pts); c.strokeStyle = '#c98b4b'; c.lineWidth = 3; c.stroke(); };
    const PAN = [[-42, -70], [-38, -4], [-34, 0], [34, 0], [38, -4], [42, -70]];
    const fruit = (kk, tt, x, y, r, ang, pop) => dessinerFruit(c, { k: kk, t: tt, x, y, r, ang: ang || 0, pop: pop || 0, cligne: 1, colle: 0 });
    switch (demoCarte) {
      case 'lacher': {
        panier(PAN);
        const p = cycle(4);
        fruit('f', 3, 10, -9, 9);
        if (p < 0.45) { const x = -25 + p / 0.45 * 35; fruit('f', 3, x, -82, 9); dessinerMain(c, x + 2, -76, 1.3, false); }
        else if (p < 0.7) { const q = (p - 0.45) / 0.25; fruit('f', 3, 10, -82 + q * 64, 9); dessinerMain(c, 12, -76, 1.3, true); }
        else { const q = (p - 0.7) / 0.3; fruit('f', 4, 10, -11, 11, 0, 1 - q); if (q < 0.4) { c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.arc(10, -11, 14 + q * 20, 0, 7); c.stroke(); } }
        break;
      }
      case 'echelle': case 'poire': case 'finale': {
        // Les 9 fruits côte à côte, à leur vraie taille relative.
        const n = FRUITS.length, largeurDemo = (w / k) * 0.96;
        const total = FRUITS.reduce((s2, f) => s2 + f.r * 2, 0) + (n - 1) * 1.5;
        const e = largeurDemo / total;
        const p = cycle(4.5), lum = Math.floor(p * n);
        let x = -largeurDemo / 2;
        for (let i = 0; i < n; i++) {
          const r = FRUITS[i].r * e;
          const enAvant = (demoCarte === 'poire' && i === 4) || (demoCarte !== 'poire' && i === lum);
          fruit('f', i, x + r, -42 - (enAvant ? 10 : 0), r * (enAvant ? 1.2 : 1));
          x += r * 2 + 1.5 * e;
        }
        break;
      }
      case 'chaine': {
        panier(PAN);
        const p = cycle(4);
        fruit('f', 4, -14, -11, 11);
        if (p < 0.3) { fruit('f', 3, 12, -9, 9); fruit('f', 3, 12, -80 + p / 0.3 * 52, 9); }
        else if (p < 0.6) { fruit('f', 4, 12 - (p - 0.3) / 0.3 * 14, -11, 11, 0, 0.5); }
        else { const q = (p - 0.6) / 0.4; fruit('f', 5, -4, -13, 13, 0, Math.max(0, 1 - q * 2)); c.fillStyle = '#ffd23f'; etoileForme(c, 22, -44, 6 + Math.sin(q * 9) * 2); etoileForme(c, -30, -40, 5); }
        break;
      }
      case 'noix': {
        panier(PAN);
        const p = cycle(3.6);
        const y1 = -6 - Math.abs(Math.sin(p * Math.PI * 4)) * 40 * (1 - p);
        if (p < 0.75) { fruit('noix', 0, -14, y1, 7); fruit('noix', 0, 10 - p * 20, -7, 7); }
        else { c.fillStyle = '#9b6a3a'; for (let i = 0; i < 6; i++) { const a = i; c.beginPath(); c.arc(-6 + Math.cos(a) * (p - 0.75) * 120, -10 + Math.sin(a) * (p - 0.75) * 80, 2.5, 0, Math.PI); c.fill(); } }
        break;
      }
      case 'confiture': {
        panier(PAN);
        c.fillStyle = '#b0123b'; c.beginPath(); c.arc(-38, -34, 6, 0, 7); c.fill();
        const p = cycle(4);
        if (p < 0.35) fruit('f', 3, -20 - p / 0.35 * 10, -80 + p / 0.35 * 46, 9);
        else { const f = { k: 'f', t: 3, x: -30, y: -34, r: 9, ang: 0, pop: 0, cligne: 1, colle: DUREE_COLLE * (1 - (p - 0.35) / 0.65) }; dessinerFruit(c, f); }
        break;
      }
      case 'penche': {
        const p = cycle(5), a = Math.sin(p * Math.PI * 2) * 0.16;
        c.save(); c.translate(0, -30); c.rotate(a); c.translate(0, 30); panier(PAN); c.restore();
        fruit('f', 3, Math.sin(p * Math.PI * 2) * 22, -10, 9, Math.sin(p * Math.PI * 2) * 2);
        fruit('f', 1, Math.sin(p * Math.PI * 2 - 0.5) * 26, -26, 6);
        break;
      }
      case 'ecureuil': {
        panier(PAN);
        fruit('f', 1, -8, -7, 6); fruit('f', 3, 14, -9, 9);
        const p = cycle(4);
        const e = { x: 46, y: -76, cote: 1, phase: p < 0.5 ? 'arrive' : 'fuite', t: 0, fruit: null };
        if (p < 0.5) { e.x = 46 + (1 - Math.min(1, p / 0.2)) * 30; dessinerEcureuil(c, e, 1.6); if (p > 0.25) dessinerMain(c, 44, -70, 1.3, p > 0.4); }
        else { e.x = 46 + (p - 0.5) * 120; e.y = -76 - Math.sin((p - 0.5) * 6) * 10; dessinerEcureuil(c, e, 1.6); c.fillStyle = '#fff'; etoileForme(c, 40, -90, 5); }
        break;
      }
      case 'or': {
        panier(PAN);
        const p = cycle(3.8);
        if (p < 0.4) { fruit('f', 2, 4, -8, 7); fruit('or', 0, 4, -80 + p / 0.4 * 62, 7); }
        else fruit('f', 3, 4, -9, 9, 0, Math.max(0, 1 - (p - 0.4) * 3));
        break;
      }
      case 'bol': case 'brouette': case 'chariot': {
        const rec = RECIPIENTS[demoCarte], kk = 70 / -rec.ligne * 1.1;
        c.save(); c.scale(kk, kk);
        dessinerRecipientFond(c, rec, rec.pts); dessinerRecipientBord(c, rec, rec.pts);
        const p = cycle(3.5);
        const xs = demoCarte === 'brouette' ? -30 + p * 60 : (demoCarte === 'bol' ? Math.cos(p * Math.PI * 2) * 30 : -40 + p * 80);
        const ys = demoCarte === 'brouette' ? -30 + p * 22 : (demoCarte === 'bol' ? -12 - Math.abs(Math.cos(p * Math.PI * 2)) * 20 : -9);
        fruit('f', 3, xs, ys, 9, p * 6);
        c.restore();
        break;
      }
    }
    c.restore();
  }

  // ------------------------------------------------------------------------
  // Commandes : doigt, souris, clavier
  // ------------------------------------------------------------------------
  function versMondeEcran(px, py) { return [(px - OX) / S, (py - OY) / S]; }
  cv.addEventListener('pointerdown', (e) => {
    Son.init();
    if (etat.mode !== 'jeu' || !etat.actif || etat.pause || etat.fini) return;
    const [wx, wy] = versMondeEcran(e.clientX, e.clientY);
    if (toucherEcureuil(wx, wy)) return;
    etat.visePointeur = true;
    etat.mainX = wx; bornerMain();
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
  });
  cv.addEventListener('pointermove', (e) => {
    if (etat.mode !== 'jeu' || !etat.actif || etat.pause) return;
    if (!etat.visePointeur && e.pointerType !== 'mouse') return;
    etat.mainX = versMondeEcran(e.clientX, e.clientY)[0]; bornerMain();
  });
  const finVisee = (e) => {
    if (!etat.visePointeur) return;
    etat.visePointeur = false;
    if (e.type === 'pointercancel') return;
    etat.mainX = versMondeEcran(e.clientX, e.clientY)[0]; bornerMain();
    lacher();
  };
  cv.addEventListener('pointerup', finVisee);
  cv.addEventListener('pointercancel', finVisee);

  window.addEventListener('keydown', (e) => {
    const code = e.code;
    const valider = code === 'Enter' || code === 'NumpadEnter' || code === 'Space';
    const surBouton = document.activeElement && document.activeElement.tagName === 'BUTTON';
    // Écran titre : Entrée ou Espace lance la partie
    if (etat.mode === 'titre' && valider && !surBouton && !$('ecran-titre').hidden) { e.preventDefault(); $('btn-jouer').click(); return; }
    if (etat.mode !== 'jeu') return;
    // Fenêtres : Entrée ou Espace choisit le bouton principal
    if (valider && !surBouton && !e.repeat) {
      if (!$('fen-carte').hidden) { e.preventDefault(); commencer(); return; }
      if (!$('fen-fin').hidden) { e.preventDefault(); $('btn-fin-principal').click(); return; }
    }
    if (code === 'Escape' || code === 'KeyP') {
      e.preventDefault();
      if (!$('fen-pause').hidden) reprendre(); else montrerPause();
      return;
    }
    if (!etat.actif || etat.pause || etat.fini || fenetreOuverte()) return;
    if (code === 'ArrowLeft' || code === 'KeyA' || code === 'KeyQ') { clavier.g = true; e.preventDefault(); }
    else if (code === 'ArrowRight' || code === 'KeyD') { clavier.d = true; e.preventDefault(); }
    else if (code === 'Space' || code === 'Enter' || code === 'NumpadEnter' || code === 'ArrowDown' || code === 'KeyS') { if (!e.repeat) lacher(); e.preventDefault(); }
    else if (code === 'ArrowUp' || code === 'KeyW' || code === 'KeyZ') { toucherEcureuil(null, null); e.preventDefault(); }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA' || e.code === 'KeyQ') clavier.g = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') clavier.d = false;
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && etat.mode === 'jeu' && etat.actif && !etat.fini) montrerPause(); });
  window.addEventListener('blur', () => { clavier.g = clavier.d = false; });

  function brancherBoutons() {

          onNouvelle: () => { lancerNiveau(0); },
          onEffacer: () => { prog.etoiles = NIVEAUX.map(() => 0); prog.records = NIVEAUX.map(() => 0); prog.atteint = 1; lancerNiveau(0); },
        });
      };
      if (window.JEL_SAVE) lancer(); else lancerNiveau(0);
    });
    $('btn-niveaux-titre').addEventListener('click', () => { Son.init(); Son.clic(); montrerNiveaux(); });
    $('btn-niveaux-retour').addEventListener('click', () => { Son.clic(); montrerTitre(); });
    $('btn-go').addEventListener('click', commencer);
    $('btn-pause').addEventListener('click', () => { Son.init(); Son.clic(); montrerPause(); });
    $('btn-reprendre').addEventListener('click', () => { Son.clic(); reprendre(); });
    $('btn-recommencer').addEventListener('click', () => { reprendre(); Son.clic(); lancerNiveau(etat.niv); });
    $('btn-pause-niveaux').addEventListener('click', () => { reprendre(); Son.clic(); sauver(etat.niv + 1); montrerNiveaux(); });
    $('btn-accueil').addEventListener('click', () => { reprendre(); Son.clic(); sauver(etat.niv + 1); montrerTitre(); });
    $('btn-fin-principal').addEventListener('click', () => {
      Son.clic();
      const a = $('btn-fin-principal').dataset.action;
      if (a === 'suivant') lancerNiveau(etat.niv + 1);
      else if (a === 'bilan') montrerBilan();
      else lancerNiveau(etat.niv);
    });
    $('btn-fin-rejouer').addEventListener('click', () => { Son.clic(); lancerNiveau(etat.niv); });
    $('btn-fin-niveaux').addEventListener('click', () => { Son.clic(); montrerNiveaux(); });
    $('btn-bilan-niveaux').addEventListener('click', () => { Son.clic(); montrerNiveaux(); });
    $('btn-bilan-accueil').addEventListener('click', () => { Son.clic(); montrerTitre(); });
    $('btn-son').addEventListener('click', () => {
      prog.son = !prog.son;
      try { localStorage.setItem('fmg-panier-recolte-son', prog.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
      // Choix gardé avec la sauvegarde existante (sans en créer une depuis l'écran titre).
      try { if (window.JEL_SAVE && window.JEL_SAVE.existe(JEU) && !APERCU) window.JEL_SAVE.save(JEU, { options: { son: prog.son } }); } catch (e) { /* rien */ }
      majBoutonSon();
      Son.init(); Son.clic();
    });
  }

  // ------------------------------------------------------------------------
  // Boucle principale
  // ------------------------------------------------------------------------
  let dernierTemps = performance.now();
  function boucle(maintenant) {
    let dt = (maintenant - dernierTemps) / 1000;
    dernierTemps = maintenant;
    if (!(dt > 0)) dt = 0;
    dt = Math.min(dt, 0.05);
    if (!etat.fige) {
      if (etat.mode === 'jeu' && etat.actif && !etat.pause) majJeu(dt);
      else if (etat.mode === 'jeu' && etat.fini) { majEffets(dt); const pas = Math.max(1, Math.ceil(dt / (1 / 240))); for (let i = 0; i < pas; i++) physique(dt / pas); }
      else if (etat.mode === 'jeu' && !etat.pause) { majMurs(); majEffets(dt); }
      else if (etat.demo && etat.mode !== 'jeu') majDemo(dt);
    }
    rendu();
    if (!$('fen-carte').hidden) peindreDemo(maintenant / 1000);
    requestAnimationFrame(boucle);
  }

  // ------------------------------------------------------------------------
  // Affiche (jaquette) : scène composée, sans interface ni texte
  // ------------------------------------------------------------------------
  function dessinerAffiche() {
    cacherTout();
    $('barre').hidden = true;
    document.querySelectorAll('jel-langue, .jel-langue').forEach((el) => { el.style.display = 'none'; });
    const peindre = () => {
      W = window.innerWidth || 600; H = window.innerHeight || 800; DPR = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
      const c = ctx; c.setTransform(DPR, 0, 0, DPR, 0, 0);
      const u = Math.min(W / 600, H / 800);
      HUD = -60;
      peindreDecor(c, W, H, H * 0.86, 3 * u, RECIPIENTS.panier);
      // Lumière de la fusion, derrière tout le reste
      const cx = W / 2, cy = H * 0.36, R = H * 0.18;
      const eclat = c.createRadialGradient(cx, cy, R * 0.4, cx, cy, R * 2.1);
      eclat.addColorStop(0, 'rgba(255,250,200,.85)'); eclat.addColorStop(0.5, 'rgba(255,220,120,.35)'); eclat.addColorStop(1, 'rgba(255,220,120,0)');
      c.fillStyle = eclat; c.beginPath(); c.arc(cx, cy, R * 2.1, 0, 7); c.fill();
      c.fillStyle = 'rgba(255,255,230,.35)';
      for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8 + 0.1; c.beginPath(); c.moveTo(cx + Math.cos(a) * R * 1.05, cy + Math.sin(a) * R * 1.05); c.lineTo(cx + Math.cos(a + 0.09) * R * 1.9, cy + Math.sin(a + 0.09) * R * 1.9); c.lineTo(cx + Math.cos(a - 0.09) * R * 1.9, cy + Math.sin(a - 0.09) * R * 1.9); c.fill(); }
      // Un panier bas et large, plein de la récolte
      const rec = { id: 'panier', pts: [[-66, -88], [-58, -8], [-50, 0], [50, 0], [58, -8], [66, -88]], ligne: -88, fond: 0, xmin: -66, xmax: 66 };
      c.save(); c.translate(W / 2, H * 0.87); const k = 3.6 * u; c.scale(k, k);
      dessinerRecipientFond(c, rec, rec.pts);
      const tas = [[-38, -9, 3], [-14, -10, 4], [12, -11, 5], [40, -9, 3], [-46, -28, 2], [-24, -32, 6], [10, -34, 4], [34, -30, 6], [52, -40, 1], [-50, -50, 1], [-30, -58, 4], [-6, -56, 2], [22, -60, 3], [46, -62, 0], [-56, -72, 0]];
      for (const [x, y, t] of tas) dessinerIcone(c, 'f', t, x, y, FRUITS[t].r);
      dessinerRecipientBord(c, rec, rec.pts);
      c.restore();
      // Les deux courges qui fusionnent, de chaque côté
      dessinerFruit(c, { k: 'f', t: 7, x: cx - R * 1.12, y: cy + R * 0.35, r: R * 0.5, ang: 0.5, pop: 0, cligne: 1, colle: 0 });
      dessinerFruit(c, { k: 'f', t: 7, x: cx + R * 1.12, y: cy + R * 0.35, r: R * 0.5, ang: -0.5, pop: 0, cligne: 1, colle: 0 });
      // Contour lumineux du héros
      c.save(); c.shadowColor = '#fff6c8'; c.shadowBlur = R * 0.35;
      dessinerFruit(c, { k: 'f', t: 8, x: cx, y: cy, r: R, ang: 0, pop: 0, cligne: 1, colle: 0 });
      c.restore();
      // Écureuil émerveillé sur le bord du panier
      dessinerEcureuil(c, { x: W / 2 - 66 * k - 2 * k, y: H * 0.87 - 88 * k - 6 * k, cote: -1, phase: 'arrive', t: 0, fruit: null }, k * 1.25);
      // Gouttes de jus et étoiles
      const etoiles = [[-1.4, -0.7, 0.16], [1.45, -0.6, 0.2], [-0.9, -1.25, 0.12], [1.0, -1.2, 0.14], [0, -1.45, 0.1], [-1.7, 0.2, 0.1], [1.75, 0.1, 0.12]];
      for (const [dx, dy, r] of etoiles) { c.fillStyle = '#fff4a0'; etoileForme(c, cx + dx * R, cy + dy * R, r * R); c.fillStyle = '#ffffff'; etoileForme(c, cx + dx * R, cy + dy * R, r * R * 0.45); }
      for (let i = 0; i < 18; i++) { const a = i * 0.7, d = R * (1.15 + (i % 4) * 0.12); c.fillStyle = i % 2 ? '#ff9a2e' : '#ffd23f'; c.beginPath(); c.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d * 0.9, R * (0.03 + (i % 3) * 0.015), 0, 7); c.fill(); }
      // Premier plan : fruits qui volent, coupés par les bords
      dessinerFruit(c, { k: 'f', t: 3, x: W * 0.06, y: H * 0.62, r: 46 * u, ang: -0.4, pop: 0, cligne: 1, colle: 0 });
      dessinerFruit(c, { k: 'f', t: 5, x: W * 0.95, y: H * 0.66, r: 58 * u, ang: 0.5, pop: 0, cligne: 1, colle: 0 });
      dessinerFruit(c, { k: 'or', t: 0, x: W * 0.83, y: H * 0.13, r: 28 * u, ang: 0.2, pop: 0, cligne: 1, colle: 0 });
      dessinerFruit(c, { k: 'f', t: 1, x: W * 0.16, y: H * 0.16, r: 26 * u, ang: -0.3, pop: 0, cligne: 1, colle: 0 });
      // Feuilles d'automne au premier plan
      for (const [x, y, l, a, col] of [[0.02, 0.93, 90, -0.6, '#e8742c'], [0.9, 0.95, 100, -2.4, '#d4512a'], [0.1, 1.0, 80, -1.2, '#f2a93b'], [0.97, 0.86, 70, -2.9, '#6fae46']]) feuille(c, W * x, H * y, l * u, a, col);
    };
    peindre();
    window.addEventListener('resize', peindre);
  }

  // ------------------------------------------------------------------------
  // Images du jeu (page du jeu) : une vraie partie posée par le code, figée
  // ------------------------------------------------------------------------
  function ouvrirApercu(n) {
    const choix = { 1: { niv: 0, tas: [[3, -22], [3, 20], [4, -2], [3, 30]], main: { k: 'f', t: 3 }, x: 14 },
      2: { niv: 8, tas: [[0, -30], [1, -20], [2, -8], [3, 6], [2, 22], [1, 34], [4, -26], [5, 2], [3, 26], [0, -10], [6, 18], [1, -36], [2, 12], ['noix', -16], [3, -38], [4, 30]], main: { k: 'noix', t: 0 }, x: -10, angle: 0.08 },
      3: { niv: 17, tas: [[4, -46], [5, -20], [6, 12], [7, 44], [3, -54], [2, -30], [4, 0], [5, 28], [1, 54], [3, -10], [2, 20], [6, -36], [4, 40], [0, -2], [1, 8]], main: { k: 'or', t: 0 }, x: 20 } }[n] || null;
    if (!choix) return;
    cacherTout();
    document.querySelectorAll('jel-langue, .jel-langue').forEach((el) => { el.style.display = 'none'; });
    $('barre').hidden = false;
    preparerNiveau(choix.niv);
    etat.mode = 'jeu'; etat.actif = true; etat.premierLacher = true;
    if (choix.angle) { etat.angle = choix.angle; majMurs(); }
    // Pose des fruits en couches, puis laisse la physique les tasser (sans fusion).
    let y = etat.rec.fond - 8;
    choix.tas.forEach(([t, x], i) => {
      const f = t === 'noix' ? nouveauFruit('noix', 0, x, y) : nouveauFruit('f', t, x, y);
      f.age = 3; etat.fruits.push(f);
      if (i % 4 === 3) y -= 20;
    });
    for (let i = 0; i < 900; i++) physiqueSansFusion(1 / 240);
    etat.enMain = choix.main; etat.mainX = choix.x; bornerMain();
    if (n === 1) {
      etat.progres[4] = 1; etat.score = 140; etat.reserve = 11;
      const p = etat.fruits.find((f) => f.t === 4);
      if (p) { p.pop = 0.5; jus(p.x, p.y, '#e33a35', 14, 70); anneau(p.x, p.y, 14, '#fff6d0'); etat.effets.forEach((e) => { e.x += e.vx * 0.12; e.y += e.vy * 0.12; }); etat.textes.push({ x: p.x, y: p.y - 18, txt: tr('flottant.points', { n: nb(30) }), vie: 1, coul: '#fff', taille: 1.2 }); }
    }
    if (n === 2) {
      etat.progres[7] = 0; etat.score = 1260; etat.reserve = 42; etat.fusions = 31;
      const cible = etat.fruits.find((f) => f.x < -20 && f.y < -40) || etat.fruits[0];
      if (cible) cible.colle = 3;
      etat.textes.push({ x: 2, y: -60, txt: tr('flottant.chaine', { n: 3 }), vie: 1, coul: '#ffd23f', taille: 1.5 });
    }
    if (n === 3) {
      etat.progres[7] = 1; etat.score = 3480; etat.reserve = 27; etat.fusions = 66;
      etat.ecu = { cote: 1, phase: 'renifle', t: 1.2, fruit: null, x: etat.rimD[0] + 3, y: etat.rimD[1] - 7 };
      etincelles(-20, -40, 12, '#ffe46b');
    }
    for (const f of etat.fruits) f.vx = f.vy = 0;
    etat.fige = true;
    $('btn-pause').disabled = false;
  }
  // Physique utilisée pour préparer les images du jeu : aucune fusion.
  function physiqueSansFusion(dt) {
    fusionsActives = false;
    physique(dt);
    fusionsActives = true;
  }

  // ------------------------------------------------------------------------
  // Initialisation
  // ------------------------------------------------------------------------
  function demarrer() {
    chargerProgression();
    majBoutonSon();
    brancherBoutons();
    if (I18N && I18N.surChangement) I18N.surChangement(() => { if (etat.mode === 'niveaux') montrerNiveaux(); });
    window.addEventListener('resize', () => { if (!AFFICHE) calculerVue(); });
    JEL_SAVE_FERMETURE();
    if (AFFICHE) { dessinerAffiche(); return; }
    if (APERCU) { ouvrirApercu(APERCU); requestAnimationFrame(boucle); return; }
    montrerTitre();
    requestAnimationFrame(boucle);
  }
  function JEL_SAVE_FERMETURE() {
    if (!window.JEL_SAVE || APERCU || AFFICHE) return;
    window.JEL_SAVE.surFermeture(() => {
      if (etat.mode === 'jeu' && !etat.fini) sauver(etat.niv + 1);
    });
  }
  demarrer();
})();
