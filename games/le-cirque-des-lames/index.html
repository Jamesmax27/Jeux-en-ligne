}

function theme() { return Math.min(3, Math.floor(G.i / 5)); }

/* ==========================================================================
   Boucle et dessin de la scène
   ========================================================================== */
function dessinerScene(roue, geant, opts) {
  opts = opts || {};
  const th = THEMES[opts.theme !== undefined ? opts.theme : theme()];
  const ti = opts.theme !== undefined ? opts.theme : theme();
  if (!fond || fondTheme !== ti) { fond = peindreFond(th); fondTheme = ti; }
  const c = cx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.drawImage(fond, 0, 0);
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const pl = disposition(geant);
  const now = performance.now() / 1000;
  const lum = roue ? roue.lumiere : 1;
  // guirlande d'ampoules
  const yv = Math.max(52, H * 0.07) + 10;
  for (let x = 12, i = 0; x < W; x += 28, i++) {
    const y = yv + Math.sin(x / W * Math.PI) * 26;
    const on = (Math.floor(now * 3) + i) % 3 !== 0;
    c.fillStyle = on ? `rgba(255,${200 + (i % 3) * 20},120,${0.35 + 0.6 * lum})` : 'rgba(90,50,30,0.8)';
    c.beginPath(); c.arc(x, y, 3.5, 0, TAU); c.fill();
  }
  // faisceau du projecteur
  const tremble = 0.92 + 0.08 * Math.sin(now * 13) * Math.sin(now * 7.3);
  c.save(); c.globalCompositeOperation = 'lighter';
  let g = c.createLinearGradient(pl.x, 0, pl.x, pl.y + pl.R * 2);
  g.addColorStop(0, `rgba(${th.lumiere},${0.32 * lum * tremble})`); g.addColorStop(1, `rgba(${th.lumiere},0)`);
  c.fillStyle = g; c.beginPath(); c.moveTo(pl.x - 30, 0); c.lineTo(pl.x + 30, 0); c.lineTo(pl.x + pl.R * 1.7, pl.y + pl.R * 2); c.lineTo(pl.x - pl.R * 1.7, pl.y + pl.R * 2); c.closePath(); c.fill();
  g = c.createRadialGradient(pl.x, pl.y, pl.R * 0.4, pl.x, pl.y, pl.R * 2.1);
  g.addColorStop(0, `rgba(${th.lumiere},${0.35 * lum})`); g.addColorStop(1, `rgba(${th.lumiere},0)`);
  c.fillStyle = g; c.fillRect(pl.x - pl.R * 2.2, pl.y - pl.R * 2.2, pl.R * 4.4, pl.R * 4.4);
  c.restore();
  // le spectre, qui flotte derrière la roue
  if (roue) dessinerSpectre(c, pl, roue, now);
  // la roue
  const sx = (Math.random() - 0.5) * FX.secousse, sy = (Math.random() - 0.5) * FX.secousse;
  c.save(); c.translate(pl.x + sx, pl.y + sy);
  const Rp = pl.R; c.scale(Rp, Rp); ECHELLE_TXT = Rp;
  if (roue) {
    // distance du lanceur (en rayons)
    roue.d0 = (pl.yLanceur - pl.y) / Rp;
    dessinerRoue(c, roue, th, P.couteau, { pret: true });
  }
  dessinerFX(c, th);
  c.restore();
  // le projecteur faiblit : obscurité, seules les lames brillent un peu
  if (roue && lum < 0.98) {
    c.fillStyle = `rgba(4,0,3,${(1 - lum) * 0.9})`; c.fillRect(0, 0, W, H);
    c.save(); c.translate(pl.x, pl.y); c.scale(Rp, Rp);
    c.globalAlpha = (1 - lum) * 0.55;
    for (const d of roue.disques) for (const l of d.lames) {
      const w = l.a + d.theta;
      c.fillStyle = l.spectre ? '#c8a6ff' : '#fff6d8';
      c.beginPath(); c.arc(Math.cos(w) * (d.rImp + 0.24 * d.echelle), Math.sin(w) * (d.rImp + 0.24 * d.echelle), 0.028, 0, TAU); c.fill();
    }
    for (const d of roue.disques) for (const z of d.zones) {
      const w = z.c + d.theta;
      c.fillStyle = '#ff3a3a'; c.beginPath(); c.arc(Math.cos(w) * d.rImp * 0.97, Math.sin(w) * d.rImp * 0.97, 0.03, 0, TAU); c.fill();
    }
    c.globalAlpha = 1; c.restore();
  }
  // lames restantes (à gauche du lanceur)
  if (roue && !opts.sansPile) dessinerPile(c, roue, pl);
  dessinerTextes(c, pl, Rp);
}

function dessinerSpectre(c, pl, roue, now) {
  const actif = roue.marques.length ? 1 : 0;
  const x = pl.x + (W > 700 ? pl.R * 1.9 : pl.R * 0.95), y = pl.y - pl.R * 0.55 + Math.sin(now * 1.3) * 8;
  const s = pl.R * (W > 700 ? 0.75 : 0.55);
  c.save(); c.translate(x, y); c.globalAlpha = (0.22 + actif * 0.45) * (roue.lumiere * 0.6 + 0.4);
  const g = c.createRadialGradient(0, 0, s * 0.1, 0, s * 0.3, s * 1.3);
  g.addColorStop(0, 'rgba(210,180,255,0.9)'); g.addColorStop(1, 'rgba(120,80,200,0)');
  c.fillStyle = g;
  // manteau qui s'effiloche
  c.beginPath(); c.moveTo(-s * 0.3, -s * 0.2); c.quadraticCurveTo(-s * 0.6, s * 0.8, -s * 0.2, s * 1.3); c.quadraticCurveTo(0, s * 1.0, s * 0.15, s * 1.35); c.quadraticCurveTo(s * 0.55, s * 0.8, s * 0.3, -s * 0.2); c.closePath(); c.fill();
  // tête et chapeau haut-de-forme
  c.fillStyle = 'rgba(230,215,255,0.85)'; c.beginPath(); c.ellipse(0, -s * 0.38, s * 0.17, s * 0.21, 0, 0, TAU); c.fill();
  c.fillStyle = 'rgba(40,20,70,0.9)'; c.fillRect(-s * 0.16, -s * 0.85, s * 0.32, s * 0.33); c.fillRect(-s * 0.28, -s * 0.55, s * 0.56, s * 0.06);
  c.fillStyle = 'rgba(20,0,30,0.9)'; c.beginPath(); c.arc(-s * 0.07, -s * 0.4, s * 0.035, 0, TAU); c.arc(s * 0.07, -s * 0.4, s * 0.035, 0, TAU); c.fill();
  // bras qui lance
  c.strokeStyle = 'rgba(200,170,255,0.8)'; c.lineWidth = s * 0.07; c.lineCap = 'round';
  const lev = actif ? -0.9 : 0.4;
  c.beginPath(); c.moveTo(-s * 0.2, -s * 0.1); c.lineTo(-s * 0.2 - Math.cos(lev) * s * 0.45, -s * 0.1 + Math.sin(lev) * s * 0.45); c.stroke();
  c.restore();
}

function dessinerPile(c, roue, pl) {
  const k = couteauDe(P.couteau);
  const deux = roue.disques.length > 1;
  const groupes = deux ? [[roue.disques[1], 26], [roue.disques[0], W - 26]] : [[roue.disques[0], 26]];
  for (const [d, x] of groupes) {
    let reste = Math.max(0, d.need - d.plantes);
    const pas = clamp((H * 0.42) / Math.max(4, d.need), 16, 36), long = Math.min(30, pas * 0.92);
    for (let i = 0; i < d.need; i++) {
      const y = H - 22 - long / 2 - i * pas;
      c.save(); c.translate(x, y); c.rotate(-Math.PI / 2); c.scale(long, long);
      dessinerCouteau(c, k, -0.5, 1, false, i < reste ? 1 : 0.18);
      c.restore();
    }
    if (deux) {
      // pastille : anneau (cercle ouvert) ou cœur (disque plein)
      const y = H - 22 - long / 2 - d.need * pas;
      c.strokeStyle = '#ffd98a'; c.fillStyle = '#ffd98a'; c.lineWidth = 3;
      if (d.type === 'anneau') { c.beginPath(); c.arc(x, y, 9, 0.5, Math.PI - 0.5); c.arc(x, y, 9, Math.PI + 0.5, TAU - 0.5); c.stroke(); }
      else { c.beginPath(); c.arc(x, y, 7, 0, TAU); c.fill(); }
    }
  }
}

/* ---------- Boucle principale ---------- */
function boucle(ts) {
  requestAnimationFrame(boucle);
  const dt = clamp((ts - (G.dernierT || ts)) / 1000, 0, 0.05); G.dernierT = ts;
  if (G.phase === 'jeu' && !G.fige && G.roue) {
    G.roue.update(dt);
    verifierFin();
    majHUD();
    musique();
  } else if (G.phase === 'fin' && G.roue) {
    G.roue.update(dt);   // la roue finit de tourner (ou ses morceaux de tomber) derrière l'écran de fin
  } else if (G.attract && !apercu && ['titre', 'niveaux', 'couteaux'].includes(G.phase)) {
    G.attract.update(dt); piloterDemo(G.attract, dt, G.attractEtat); if (G.attractEtat.refaire) nouvelleAttract();
  }
  if (G.phase !== 'pause' && !G.fige) majFX(dt);
  const roue = G.phase === 'jeu' || G.phase === 'pause' || G.phase === 'tuto' || G.phase === 'fin' ? G.roue : G.attract;
  dessinerScene(roue, roue && roue.def.geant);
  if (G.phase === 'tuto' && G.tuto) { G.tuto.update(dt); piloterDemo(G.tuto, dt, G.tutoEtat); dessinerTuto(); }
}

/** Pilote une roue de démonstration : lance au bon moment, recommence à la fin. */
function piloterDemo(roue, dt, etat) {
  etat.t = (etat.t || 0) - dt;
  etat.main = Math.max(0, (etat.main || 0) - dt);
  if (roue.etat === 'gagne' || roue.etat === 'echec') {
    if (roue.tEtat > 1.6) { etat.refaire = true; }
    return;
  }
  if (roue.etat !== 'jeu' || roue.vols.length || etat.t > 0) return;
  const pr = roue.predire();
  if (!pr) return;
  const bon = !roue.issue(pr.d, pr.a);
  const pomme = pr.d.pommes.some((p) => !p.coupee && ecart(p.a, pr.a) < pr.d.pommeH * 0.7);
  etat.attente = (etat.attente || 0) + dt;
  if (bon && (pomme || etat.attente > 0.5 || !pr.d.pommes.some((p) => !p.coupee))) {
    roue.lancer(P.couteau); etat.t = 0.75; etat.main = 0.3; etat.attente = 0;
  }
}

function verifierFin() {
  const r = G.roue;
  if (r.etat === 'echec' && r.tEtat > 1.5 && !G.finMontree) { G.finMontree = true; defaite(); }
  if (r.etat === 'gagne' && r.tEtat > (r.def.geant ? 2.1 : 1.5) && !G.finMontree) { G.finMontree = true; victoire(); }
}

function majHUD() {
  const r = G.roue; if (!r) return;
  if (G.scoreAff !== r.score) { G.scoreAff += Math.ceil((r.score - G.scoreAff) * 0.25); $('hScore').textContent = JEL_I18N.nombre(G.scoreAff); }
  let info = '';
  if (r.disques.length > 1) info = T('infoDouble', { a: r.disques[1].plantes, na: r.disques[1].need, c: r.disques[0].plantes, nc: r.disques[0].need });
  else if (r.def.phases.length > 1) info = T('infoPhase', { n: r.iPhase + 1, max: r.def.phases.length });
  if (info !== G.infoAff) { G.infoAff = info; $('hInfo').textContent = info; }
}

/* ==========================================================================
   Écrans
   ========================================================================== */
function cacherEcrans() { document.querySelectorAll('.ecran').forEach((e) => e.classList.remove('visible')); }
function montrer(id) { cacherEcrans(); $(id).classList.add('visible'); }
function nouvelleAttract() {

}

}

const SVG_ETOILE = '<path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/>';

function montrerNiveaux() {

function montrerCouteaux() {

/* ---------- Lancement d'une roue ---------- */
function lancerNiveau(i, garderEssais) {
  if (!garderEssais) G.essais = 0;
  G.i = clamp(i, 0, NIVEAUX.length - 1);
  const def = NIVEAUX[G.i];
  G.roue = new Roue(def, { seed: 4242 + G.i * 7919, evt: (t, d) => evtJeu(G.roue, t, d) });
  G.finMontree = false; G.fige = false; G.scoreAff = 0; G.infoAff = null;
  FX.parts.length = 0; FX.textes.length = 0; FX.fragments.length = 0;
  fond = null;
  $('hNiveau').textContent = T('roueN', { n: G.i + 1, max: NIVEAUX.length });
  $('hNom').textContent = T(def.cle);
  $('hScore').textContent = '0'; $('hInfo').textContent = '';
  $('hud').classList.add('visible');
  const aVoir = (def.nouveau || []).filter((m) => !P.vus.includes(m));
  if (aVoir.length) { G.tutos = aVoir.slice(); montrerTuto(); }
  else commencer();
}

function montrerTuto() {
  const m = G.tutos[0];
  G.phase = 'tuto';
  G.tuto = new Roue(DEMOS[m], { demo: true, seed: 55 + m.length * 17 });
  G.tutoEtat = {}; G.tutoNom = m;
  $('tutoNouveau').textContent = T(m === 'base' ? 'tutoPremier' : 'tutoNouveau');
  $('tutoTitre').textContent = T('tuto.' + m + '.titre');
  $('tutoL1').textContent = T('tuto.' + m + '.l1');
  $('tutoL2').textContent = T('tuto.' + m + '.l2');
  montrer('eTuto');
  setTimeout(() => { try { $('bGo').focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 50);
}

function fermerTuto() {
  if (G.phase !== 'tuto') return;
  const m = G.tutos.shift();
  if (m && !P.vus.includes(m)) P.vus.push(m);
  if (G.tutos.length) { montrerTuto(); return; }
  G.tuto = null;
  commencer();
}

function commencer() {
  cacherEcrans();
  G.phase = 'jeu'; G.dernierT = 0;
  $('hud').classList.add('visible');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  audio(); SON.enMusique = true; SON.pas = 0;
}

/** Dessine la petite roue animée de la consigne, avec la main qui touche. */
function dessinerTuto() {
  const cvs = $('tutoCanvas'), c = cvs.getContext('2d');
  const w = cvs.width, h = cvs.height, roue = G.tuto, th = THEMES[theme()];
  if (G.tutoEtat.refaire) { const m = G.tutoNom; G.tuto = new Roue(DEMOS[m], { demo: true, seed: 55 + Math.floor(Math.random() * 999) }); G.tutoEtat = {}; return; }
  c.setTransform(1, 0, 0, 1, 0, 0);
  const g = c.createRadialGradient(w / 2, h * 0.35, 10, w / 2, h * 0.4, w * 0.7);
  g.addColorStop(0, '#3a1520'); g.addColorStop(1, '#0d0407');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  const R = Math.min(w * 0.27, h * 0.27) * (roue.def.geant ? 1.1 : 1), ox = w / 2, oy = h * 0.37;
  roue.d0 = (h * 0.9 - oy) / R;
  c.save(); c.translate(ox, oy); c.scale(R, R); ECHELLE_TXT = R;
  dessinerRoue(c, roue, th, P.couteau, { pret: true });
  c.restore();
  if (roue.lumiere < 0.98) { c.fillStyle = `rgba(4,0,3,${(1 - roue.lumiere) * 0.85})`; c.fillRect(0, 0, w, h); }
  // la main qui touche
  const appui = G.tutoEtat.main || 0;
  const mx = w * 0.72, my = h * 0.84 + (appui > 0 ? 4 : -4);
  c.save(); c.translate(mx, my); c.scale(w / 260, w / 260);
  c.fillStyle = '#f3e0c8'; c.strokeStyle = '#3a1520'; c.lineWidth = 2;
  c.beginPath(); c.roundRect ? c.roundRect(-9, -6, 26, 30, 8) : c.rect(-9, -6, 26, 30); c.fill(); c.stroke();
  c.beginPath(); c.roundRect ? c.roundRect(-7, -30, 10, 30, 5) : c.rect(-7, -30, 10, 30); c.fill(); c.stroke();
  if (appui > 0) { c.strokeStyle = 'rgba(255,230,160,0.9)'; c.lineWidth = 3; c.beginPath(); c.arc(-2, -32, 12 + (0.3 - appui) * 40, 0, TAU); c.stroke(); }
  c.restore();
}

/* ---------- Pause ---------- */
function mettrePause() {
  if (G.phase !== 'jeu') return;
  G.phase = 'pause';
  try { if (SON.ctx) SON.ctx.suspend(); } catch (e) { /* rien */ }
  $('pauseInfo').textContent = T('pauseInfo', { n: G.i + 1, nom: T(NIVEAUX[G.i].cle) });
  montrer('ePause');
  setTimeout(() => { try { $('bReprendre').focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30);
}
function reprendre() {
  if (G.phase !== 'pause') return;
  G.phase = 'jeu'; G.dernierT = 0; cacherEcrans();
  try { if (SON.ctx) SON.ctx.resume(); } catch (e) { /* rien */ }
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  son('clic');
}

/* ---------- Fins de roue ---------- */
function victoire() {
  const i = G.i, r = G.roue;
  G.phase = 'fin';
  const pommesOk = r.pommesTot === 0 || r.pommesCoupees >= r.pommesTot;
  const premier = G.essais === 0;
  if (premier) r.score += 100;
  const etoiles = 1 + (pommesOk ? 1 : 0) + (premier ? 1 : 0);
  const avant = totalEtoiles();
  const ancienRecord = P.records[i];
  const record = r.score > ancienRecord;
  P.etoiles[i] = Math.max(P.etoiles[i], etoiles);
  P.records[i] = Math.max(ancienRecord, r.score);
  P.gagnes[i] = 1;
  ecrireProgression(Math.min(i + 2, NIVEAUX.length));
  if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
  if (P.gagnes.every((v) => v > 0)) { if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 }); }
  // écran
  const titres = ['vTitre1', 'vTitre2', 'vTitre3'];
  $('vTitre').textContent = T(r.def.geant ? 'vTitreGeant' : titres[Math.floor(Math.random() * 3)]);
  $('vNom').textContent = T('roueNom', { n: i + 1, nom: T(r.def.cle) });
  $('vEtoiles').innerHTML = [0, 1, 2].map(() => `<svg viewBox="0 0 24 24" class="e">${SVG_ETOILE}</svg>`).join('');
  const crit = [
    [T('critReussie'), true],
    [r.pommesTot ? T('critPommes', { n: r.pommesCoupees, max: r.pommesTot }) : T('critSansPomme'), pommesOk],
    [premier ? T('critPremier') : T('critEssais', { n: G.essais + 1 }), premier],
  ];
  $('vCriteres').innerHTML = '';
  for (const [txt, ok] of crit) { const li = document.createElement('li'); li.textContent = txt; if (ok) li.className = 'ok'; $('vCriteres').appendChild(li); }
  if (r.frolements) { const li = document.createElement('li'); li.className = 'ok'; li.textContent = T('critFrole', { n: r.frolements }); $('vCriteres').appendChild(li); }
  $('vRecord').textContent = record && ancienRecord > 0 ? T('nouveauRecord') : T('recordEst', { n: JEL_I18N.nombre(P.records[i]) });
  const nouveaux = COUTEAUX.filter((k) => k.seuil > avant && k.seuil <= totalEtoiles());
  $('vDebloque').textContent = nouveaux.length ? T('debloqueCouteau', { nom: T('couteau.' + nouveaux[0].id) }) : (i % 5 === 4 && i < 19 ? T('debloqueNumero', { nom: T('numero' + (Math.floor(i / 5) + 2)) }) : '');
  $('bSuivant').textContent = T(i >= NIVEAUX.length - 1 ? 'voirBilan' : 'suivant');
  montrer('eVictoire');
  // étoiles et score qui défilent
  const svgs = $('vEtoiles').querySelectorAll('svg');
  svgs.forEach((s, k) => { if (k < etoiles) setTimeout(() => { s.classList.add('on'); son('etoile', 1 + k * 0.25); }, 350 + k * 380); });
  let n = 0; const cible = r.score, el = $('vScore');
  const pas = () => { n = Math.min(cible, n + Math.max(1, Math.ceil(cible / 30))); el.textContent = JEL_I18N.nombre(n); if (n < cible && G.phase === 'fin') requestAnimationFrame(pas); };
  pas();
  if (nouveaux.length) setTimeout(() => son('debloque'), 1500);
  setTimeout(() => { try { $('bSuivant').focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 60);
}

function defaite() {
  const i = G.i, r = G.roue, e = r.echec || {};
  G.phase = 'fin';
  G.essais++;
  if (window.FMG) window.FMG.reportEnd({ completed: false, level: i + 1 });
  const raison = e.raison === 'lame' ? T('raisonLame', { n: e.num }) : T('raison.' + (e.raison || 'lame'));
  $('dRaison').textContent = raison;
  let plantes = 0, total = 0; for (const d of r.disques) { plantes += d.plantes; total += d.need; }
  $('dLames').textContent = T('dLames', { n: plantes, max: total }) + (r.def.phases.length > 1 ? ' · ' + T('infoPhase', { n: r.iPhase + 1, max: r.def.phases.length }) : '');
  $('dConseil').textContent = T('conseil.' + (e.raison || 'lame'));
  montrer('eDefaite');
  setTimeout(() => { try { $('bReessayer').focus({ preventScroll: true }); } catch (e2) { /* rien */ } }, 60);
}

function montrerFin() {
  G.phase = 'bilan'; $('hud').classList.remove('visible');
  nouvelleAttract();
  $('fEtoiles').textContent = T('fEtoiles', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
  $('fScore').textContent = T('fScore', { n: JEL_I18N.nombre(totalScore()) });
  montrer('eFin');
  son('gagne');

/* ==========================================================================
   Images du jeu (window.JEL_APERCU) : vraie partie, figée
   ========================================================================== */
function ouvrirApercu(n) {
  apercu = n;
  chargerProgression();
  const choix = { 1: [0, 3, 0.11], 2: [7, 5, 0.6], 3: [17, 0, 0.35] }[n] || [0, 2, 0.1];
  G.i = choix[0];
  const def = NIVEAUX[G.i];
  G.roue = new Roue(def, { seed: 4242 + G.i * 7919, evt: (t, d) => evtJeu(G.roue, t, d) });
  const r = G.roue;
  const pl = disposition(def.geant); r.d0 = (pl.yLanceur - pl.y) / pl.R;
  // lames déjà plantées par le joueur (posées directement, partie en cours)
  for (let j = 0; j < 40; j++) r.update(1 / 60);
  const parDisque = n === 3 ? [2, 3] : [choix[1]];
  r.disques.forEach((d, j) => {
    for (let q = 0; q < (parDisque[j] || 0) && d.plantes < d.need - 1; q++) {
      const a = r.placeLibre(d, 1.5, 0.12, false, 0.6);
      if (a !== null) { d.lames.push({ a, n: ++r.numLame, type: 'base', entree: 0 }); d.plantes++; r.score += 10; }
    }
  });
  // une pomme vient d'être fendue (moitiés et jus figés en l'air)
  const dp = r.disques[r.disques.length - 1], pomme = dp.pommes.find((p) => !p.coupee);
  if (pomme && n !== 1) {
    pomme.coupee = true; r.pommesCoupees++; r.score += 50;
    dp.lames.push({ a: pomme.a, n: ++r.numLame, type: 'base', entree: 0.4 }); dp.plantes++;
    evtJeu(r, 'pomme', { disque: dp, a: pomme.a });
    for (let j = 0; j < 12; j++) majFX(1 / 60);
  }
  for (let j = 0; j < 20; j++) r.update(1 / 60);
  if (n === 3 && !r.marques.length) { const a = r.placeLibre(r.cible, 1.9, 0.18, false, 0.8); if (a !== null) r.marques.push({ disque: r.cible, a, t: 0.5, max: 1.1 }); }
  r.vols.push({ d: (r.d0 + 1) * choix[2] + 1, passe: false, type: 'base' });
  if (n === 2) texteFlottant(T('frole'), 0.4, 1.35, '#bfe3ff');
  G.phase = 'jeu'; G.fige = true;
  $('hNiveau').textContent = T('roueN', { n: G.i + 1, max: NIVEAUX.length });
  $('hNom').textContent = T(def.cle);
  $('hScore').textContent = JEL_I18N.nombre(r.score + (n === 2 ? 120 : 0));
  G.scoreAff = r.score;
  let info = '';
  if (r.disques.length > 1) info = T('infoDouble', { a: r.disques[1].plantes, na: r.disques[1].need, c: r.disques[0].plantes, nc: r.disques[0].need });
  $('hInfo').textContent = info;
  cacherEcrans(); $('hud').classList.add('visible');
  const cacher = () => document.querySelectorAll('.jel-langue').forEach((e) => { e.style.display = 'none'; });
  cacher(); setTimeout(cacher, 300);
  requestAnimationFrame(boucle);
}

/* ==========================================================================
   Commandes
   ========================================================================== */
function toucherJeu() {
  if (G.phase !== 'jeu' || G.fige || !G.roue) return;
  audio();
  G.roue.lancer(P.couteau);
}

function brancher() {
  cv.addEventListener('pointerdown', (e) => { e.preventDefault(); toucherJeu(); });
  $('bJouer').addEventListener('click', () => {
    audio(); son('clic');
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { chargerProgression(); const n = clamp(Math.floor(Number(d && d.niveau) || 1), 1, NIVEAUX.length); lancerNiveau(n - 1); },
      onNouvelle: () => { chargerProgression(); lancerNiveau(0); },
      onEffacer: () => { chargerProgression(); montrerTitre(); },
    });
  });
  $('bNiveaux').addEventListener('click', () => { audio(); son('clic'); montrerNiveaux(); });
  $('bCouteaux').addEventListener('click', () => { audio(); son('clic'); montrerCouteaux(); });
  $('bRetourN').addEventListener('click', () => { son('clic'); montrerTitre(); });
  $('bRetourC').addEventListener('click', () => { son('clic'); montrerTitre(); });
  $('bGo').addEventListener('click', (e) => { e.stopPropagation(); audio(); fermerTuto(); });
  $('eTuto').addEventListener('pointerdown', (e) => { if (e.target.closest('button') || e.target.closest('.jel-langue')) return; audio(); fermerTuto(); });
  $('bPause').addEventListener('click', (e) => { e.stopPropagation(); audio(); son('clic'); mettrePause(); });
  $('bReprendre').addEventListener('click', reprendre);
  $('bRecommencer').addEventListener('click', () => { if (SON.ctx) SON.ctx.resume(); son('clic'); G.essais++; lancerNiveau(G.i, true); });
  $('bPauseNiveaux').addEventListener('click', () => { if (SON.ctx) SON.ctx.resume(); son('clic'); montrerNiveaux(); });
  $('bAccueil').addEventListener('click', () => { if (SON.ctx) SON.ctx.resume(); son('clic'); montrerTitre(); });
  $('bSuivant').addEventListener('click', () => { son('clic'); if (G.i >= NIVEAUX.length - 1) montrerFin(); else lancerNiveau(G.i + 1); });
  $('bRejouer').addEventListener('click', () => { son('clic'); lancerNiveau(G.i); });
  $('bNiveauxV').addEventListener('click', () => { son('clic'); montrerNiveaux(); });
  $('bReessayer').addEventListener('click', () => { son('clic'); lancerNiveau(G.i, true); });
  $('bRejouerD').addEventListener('click', () => { son('clic'); lancerNiveau(0); });
  $('bNiveauxD').addEventListener('click', () => { son('clic'); montrerNiveaux(); });
  $('bAccueilD').addEventListener('click', () => { son('clic'); montrerTitre(); });
  $('bRejouerFin').addEventListener('click', () => { son('clic'); lancerNiveau(0); });
  $('bNiveauxF').addEventListener('click', () => { son('clic'); montrerNiveaux(); });
  ['bSonJeu', 'bSonTitre', 'bSonPause'].forEach((id) => $(id).addEventListener('click', (e) => { e.stopPropagation(); basculerSon(); }));
  window.addEventListener('keydown', (e) => {
    const k = e.code;
    if (k === 'KeyM') { basculerSon(); return; }
    if (k === 'Escape' || k === 'KeyP') {
      e.preventDefault();
      if (G.phase === 'jeu') { audio(); mettrePause(); } else if (G.phase === 'pause') reprendre();
      return;
    }
    if (k === 'Space' || k === 'Enter' || k === 'NumpadEnter' || k === 'ArrowUp' || k === 'KeyW' || k === 'KeyZ') {
      if (G.phase === 'jeu') { e.preventDefault(); if (!e.repeat) toucherJeu(); }
      else if (G.phase === 'tuto') { e.preventDefault(); audio(); fermerTuto(); }
    }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.phase === 'jeu' && !G.fige) mettrePause(); });
  JEL_SAVE.surFermeture(() => {
    if (apercu || !G.roue) return;
    if (['jeu', 'pause', 'tuto'].includes(G.phase)) ecrireProgression(G.i + 1);
  });
  if (window.JEL_I18N && window.JEL_I18N.surChangement) window.JEL_I18N.surChangement(() => {
    majSon();
    if (G.phase === 'niveaux') montrerNiveaux(); else if (G.phase === 'couteaux') montrerCouteaux(); else if (G.phase === 'titre') montrerTitre();
  });
}

/* ---------- Démarrage ---------- */
function init() {
  redim();
  window.addEventListener('resize', () => { redim(); if (window.JEL_AFFICHE) dessinerAffiche(); });
  chargerProgression();
  if (window.JEL_AFFICHE) {
    cacherEcrans();
    const cacher = () => document.querySelectorAll('.jel-langue').forEach((e) => { e.style.display = 'none'; });
    cacher(); setTimeout(cacher, 300);
    dessinerAffiche();
    return;
  }
  if (window.JEL_APERCU) { ouvrirApercu(Number(window.JEL_APERCU)); return; }
  brancher();
  majSon();
  montrerTitre();
  requestAnimationFrame(boucle);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
