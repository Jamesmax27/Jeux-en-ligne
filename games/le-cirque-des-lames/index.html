<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */

  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

    <div class="age" data-i18n="age13"></div>
    <p class="accroche" data-i18n="accroche"></p>
    <p class="petit" id="totalTitre"></p>
    <button class="btn gros" id="bJouer" data-i18n="jouer"></button>
    <div class="ligne">

<script>
'use strict';
/* ==========================================================================
   Le Cirque des Lames — jeu d'adresse à un seul geste (13 ans et +).
   Une roue tourne, une poupée de cire est sanglée au centre : chaque toucher
   lance un couteau qui se plante et tourne avec la roue. Toucher une lame déjà
   plantée, ou une sangle de la poupée, fait échouer la roue.
   ========================================================================== */
const JEU = 'le-cirque-des-lames';
const T = (k, v) => (window.JEL_I18N ? window.JEL_I18N.t(k, v) : k);
const $ = (id) => document.getElementById(id);
const TAU = Math.PI * 2, DEG = Math.PI / 180, BAS = Math.PI / 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const norm = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ecart = (a, b) => Math.abs(norm(a - b));
/** Petit générateur pseudo-aléatoire à graine (même roue à chaque essai). */
function rngDe(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

/* ---------- Données : sangles de la poupée (angles dans le repère de la roue, en degrés) ---------- */

const Z1 = ['tete', 'piedG', 'piedD'];
const Z2 = ['tete', 'mainG', 'mainD', 'piedG', 'piedD'];

/* ---------- Les 20 roues ----------
   phases : une roue ordinaire a une phase ; une roue géante (fin de numéro) en a trois.
   couteaux : lames à planter ; vit : vitesse en degrés par seconde ;
   modes : 'inverse' (change de sens sans prévenir), 'souffle' (accélère puis freine),
           'acoups' (file puis s'arrête net) ;
   pommes : pommes de cire sur le bord ; spectre : lames du spectre déjà plantées ;
   lancers : lames que le spectre plante pendant la partie ; glisse : lames du spectre qui glissent ;
   debat : la poupée se débat (sangles qui bougent) ; noir : le projecteur faiblit ;
   double : roue double (anneau à brèches + cœur) ; nouveau : consignes animées à montrer. */
const NIVEAUX = [

  { cle: 'n2', nouveau: ['pomme'], phases: [{ couteaux: 6, vit: 82, zones: Z1, pommes: 2 }] },

    { couteaux: 4, vit: 90, zones: Z2, pommes: 1 },
    { couteaux: 4, vit: 105, modes: ['inverse'], zones: Z2, pommes: 1, spectre: 1 },
    { couteaux: 4, vit: 120, zones: Z2, pommes: 1, spectre: 2 }] },
  { cle: 'n6', nouveau: ['souffle'], phases: [{ couteaux: 7, vit: 100, modes: ['souffle'], zones: Z2, pommes: 2, spectre: 2 }] },
  { cle: 'n7', nouveau: ['lancer'], phases: [{ couteaux: 7, vit: 95, zones: Z2, pommes: 2, lancers: 3 }] },
  { cle: 'n8', nouveau: ['acoups'], phases: [{ couteaux: 7, vit: 112, modes: ['acoups'], zones: Z2, pommes: 3, spectre: 2 }] },

    { couteaux: 5, vit: 125, modes: ['souffle'], zones: Z2, pommes: 2, spectre: 2 }] },
  { cle: 'n11', nouveau: ['double'], phases: [{ double: { anneau: 4, coeur: 3, vitCoeur: -100 }, vit: 72, zones: Z1, pommes: 2 }] },
  { cle: 'n12', nouveau: ['debat'], phases: [{ couteaux: 7, vit: 105, zones: Z2, debat: true, pommes: 3, spectre: 2 }] },
  { cle: 'n13', nouveau: ['noir'], phases: [{ couteaux: 7, vit: 108, modes: ['inverse'], zones: Z2, noir: true, pommes: 2, spectre: 1 }] },
  { cle: 'n14', phases: [{ double: { anneau: 4, coeur: 4, vitCoeur: 110, modesCoeur: ['souffle'] }, vit: 88, modes: ['inverse'], zones: Z2, debat: true, pommes: 3 }] },
  { cle: 'n15', geant: true, phases: [
    { couteaux: 5, vit: 118, modes: ['souffle'], zones: Z2, pommes: 2, spectre: 2, debat: true },
    { couteaux: 5, vit: 124, modes: ['inverse'], zones: Z2, noir: true, pommes: 1, spectre: 1, debat: true },
    { couteaux: 5, vit: 132, modes: ['acoups'], zones: Z2, pommes: 2, spectre: 1, lancers: 2, debat: true }] },
  { cle: 'n16', nouveau: ['glisse'], phases: [{ couteaux: 8, vit: 112, zones: Z2, pommes: 3, glisse: 3 }] },
  { cle: 'n17', phases: [{ couteaux: 8, vit: 122, modes: ['souffle'], zones: Z2, noir: true, debat: true, pommes: 3, spectre: 2 }] },
  { cle: 'n18', phases: [{ double: { anneau: 5, coeur: 4, vitCoeur: -118, modesCoeur: ['inverse'] }, vit: 104, modes: ['acoups'], zones: Z2, lancers: 3, pommes: 3 }] },
  { cle: 'n19', phases: [{ couteaux: 9, vit: 135, modes: ['inverse', 'acoups'], zones: Z2, noir: true, debat: true, glisse: 2, lancers: 2, pommes: 4 }] },
  { cle: 'n20', geant: true, phases: [
    { couteaux: 5, vit: 128, modes: ['souffle'], zones: Z2, pommes: 2, glisse: 2, spectre: 1 },
    { couteaux: 5, vit: 138, modes: ['inverse'], zones: Z2, noir: true, lancers: 3, pommes: 2, debat: true },
    { couteaux: 6, vit: 148, modes: ['acoups', 'inverse'], zones: Z2, debat: true, spectre: 2, glisse: 1, pommes: 2 }] },
];
window.JEL_NIVEAUX = NIVEAUX.length;

/* Petites roues des consignes animées (elles se jouent toutes seules). */
const DEMOS = {
  base: { phases: [{ couteaux: 4, vit: 70, zones: Z1 }] },
  pomme: { phases: [{ couteaux: 4, vit: 70, zones: Z1, pommes: 3 }] },
  inverse: { phases: [{ couteaux: 4, vit: 95, modes: ['inverse'], zones: Z2 }] },
  spectre: { phases: [{ couteaux: 4, vit: 80, zones: Z2, spectre: 3 }] },
  geant: { geant: true, phases: [{ couteaux: 2, vit: 80, zones: Z2 }, { couteaux: 2, vit: 100, modes: ['inverse'], zones: Z2 }, { couteaux: 2, vit: 110, zones: Z2 }] },
  souffle: { phases: [{ couteaux: 4, vit: 95, modes: ['souffle'], zones: Z2 }] },
  lancer: { phases: [{ couteaux: 4, vit: 75, zones: Z2, lancers: 3 }] },
  acoups: { phases: [{ couteaux: 4, vit: 100, modes: ['acoups'], zones: Z2 }] },
  double: { phases: [{ double: { anneau: 2, coeur: 2, vitCoeur: -90 }, vit: 60, zones: Z1 }] },
  debat: { phases: [{ couteaux: 4, vit: 70, zones: Z2, debat: true }] },
  noir: { phases: [{ couteaux: 4, vit: 80, zones: Z2, noir: true }] },
  glisse: { phases: [{ couteaux: 4, vit: 75, zones: Z2, glisse: 2 }] },
};

/* Les 4 numéros du chapiteau (décor et couleurs). */
const THEMES = [
  { toileA: '#8e1f2c', toileB: '#e2cfa6', bois1: '#b07a48', bois2: '#6e4526', peintA: '#b3262e', peintB: '#efe0bf', rebord: '#cfd3d9', lumiere: '255,214,150' },
  { toileA: '#1d5a42', toileB: '#2b2a33', bois1: '#7d5a3a', bois2: '#3e2a1a', peintA: '#2f6b4f', peintB: '#d4a64a', rebord: '#d9b25c', lumiere: '200,255,210' },
  { toileA: '#3a2f8a', toileB: '#8a86c2', bois1: '#8f7aa8', bois2: '#3f305e', peintA: '#5b3fa0', peintB: '#cfd6e6', rebord: '#e6ecf5', lumiere: '205,200,255' },
  { toileA: '#7a1416', toileB: '#c8962e', bois1: '#3a3030', bois2: '#141010', peintA: '#1e1a1a', peintB: '#e2b54a', rebord: '#f2cf6a', lumiere: '255,226,160' },
];

/* Couteaux à débloquer avec les étoiles. */
const COUTEAUX = [
  { id: 'base', seuil: 0, lame: '#e4e9ef', bord: '#8b97a6', manche: '#5a3420', garde: '#c9a25a', trainee: '255,255,255', ton: 1 },
  { id: 'hache', seuil: 10, lame: '#c8ced6', bord: '#6f7884', manche: '#8a5a30', garde: '#3c2a1c', trainee: '255,170,90', ton: 0.75 },
  { id: 'verre', seuil: 25, lame: 'rgba(175,240,255,0.78)', bord: '#e9ffff', manche: '#bfc8d6', garde: '#7ad3ff', trainee: '140,230,255', ton: 1.4 },
  { id: 'ombre', seuil: 42, lame: '#16101e', bord: '#b48cff', manche: '#0b0810', garde: '#6a3fbf', trainee: '180,120,255', ton: 0.6 },
];
const COUTEAU_SPECTRE = { id: 'spectre', lame: 'rgba(196,160,255,0.72)', bord: '#efe2ff', manche: 'rgba(120,80,200,0.7)', garde: 'rgba(220,200,255,0.8)', trainee: '190,150,255' };

/* ==========================================================================
   Moteur d'une roue (le même pour la partie, l'écran titre et les consignes)
   Unités : le rayon de la roue vaut 1 ; centre en (0, 0) ; angles en radians.
   ========================================================================== */
const VIT_LAME = 15;        // vitesse d'un couteau en vol (rayons par seconde)
const BONUS_FROLE = 0.07;   // marge du frôlement au-delà de l'écart minimal

function creerDisque(type, vit, modes, rng) {
  const coeur = type === 'coeur';
  return {
    type, rImp: coeur ? 0.56 : 1, sep: coeur ? 0.2 : 0.12, pommeH: coeur ? 0.2 : 0.13, echelle: coeur ? 0.72 : 1,
    theta: rng() * TAU, omega: 0, base: Math.abs(vit) * DEG, dir: vit < 0 ? -1 : 1, modes: modes || [],
    tInv: 1.4 + rng() * 1.6, fS: 0.9 + rng() * 0.5, pS: rng() * TAU, gateOn: true, gateT: 0.7 + rng() * 0.5,
    lames: [], pommes: [], zones: [], breches: [], need: 0, plantes: 0, init: false,
  };
}

function Roue(def, opts) {
  opts = opts || {};
  this.def = def; this.demo = !!opts.demo; this.evt = opts.evt || (() => {});
  this.rng = rngDe(opts.seed || 1);
  this.t = 0; this.etat = 'jeu'; this.tEtat = 0; this.d0 = 2.2;
  this.vols = []; this.tombes = []; this.marques = []; this.buffer = false;
  this.lumiere = 1; this.sombre = false; this.flash = 0; this.brisee = false;
  this.pommesTot = 0; this.pommesCoupees = 0; this.numLame = 0; this.score = 0; this.frolements = 0;
  this.echec = null; this.iPhase = 0; this.disques = [];
  this.chargerPhase(0);
}

/** Prépare une phase : disques, sangles, pommes et lames du spectre. */
Roue.prototype.chargerPhase = function (i) {
  const ph = this.def.phases[i], rng = this.rng;
  const ancien = this.disques[this.disques.length - 1];
  this.iPhase = i; this.ph = ph; this.tPhase = 0; this.marques = [];
  const zones = (ph.zones || []).map((n) => ({ c0: ZONES[n].c * DEG, c: ZONES[n].c * DEG, h: ZONES[n].h * DEG, A: ph.debat ? 0.17 : 0, p: rng() * TAU, nom: n }));
  let porteur, cible;
  if (ph.double) {
    const coeur = creerDisque('coeur', ph.double.vitCoeur, ph.double.modesCoeur, rng);
    const anneau = creerDisque('anneau', ph.vit, ph.modes, rng);
    coeur.need = ph.double.coeur; anneau.need = ph.double.anneau;
    coeur.zones = zones;
    anneau.breches = [{ c: 0, h: 0.38 }, { c: Math.PI, h: 0.38 }];
    this.disques = [coeur, anneau];
    porteur = anneau; cible = anneau;
    const pc = Math.floor((ph.pommes || 0) / 3);
    this.placerPommes(anneau, (ph.pommes || 0) - pc);
    this.placerPommes(coeur, pc);
  } else {
    const d = creerDisque('roue', ph.vit, ph.modes, rng);
    if (ancien) d.theta = ancien.theta;
    d.need = ph.couteaux; d.zones = zones;
    this.disques = [d]; porteur = d; cible = d;
  }
  for (let k = 0; k < (ph.spectre || 0); k++) { const a = this.placeLibre(porteur, 1.9, 0.18); if (a !== null) porteur.lames.push({ a, spectre: true, entree: 0 }); }
  for (let k = 0; k < (ph.glisse || 0); k++) {
    const a = this.placeLibre(porteur, 2.4, 0.18);
    if (a !== null) porteur.lames.push({ a, a0: a, spectre: true, glisse: { A: 0.42 + rng() * 0.2, f: 0.8 + rng() * 0.6, p: rng() * TAU }, entree: 0 });
  }
  if (!ph.double) this.placerPommes(porteur, ph.pommes || 0);
  this.cible = cible;
  this.lancersRestants = ph.lancers || 0;
  this.tLancer = (this.demo ? 0.8 : 2.2) + rng() * 1.2;
  this.noir = !!ph.noir; this.tNoir = 1.8; this.sombre = false;
  for (const d of this.disques) this.tournerDisque(d, 0, true);
};

Roue.prototype.placerPommes = function (d, n) {
  for (let k = 0; k < n; k++) {
    const a = this.placeLibre(d, 1.3, 0.12, true);
    if (a !== null) { d.pommes.push({ a, coupee: false }); this.pommesTot++; }
  }
};

/** Cherche un angle libre (hors sangles, brèches, lames et pommes). */
Roue.prototype.placeLibre = function (d, facteur, margeZone, pourPomme, eviterMonde) {
  for (let essai = 0; essai < 240; essai++) {
    const a = norm(this.rng() * TAU);
    if (d.zones.some((z) => ecart(a, z.c) < z.h + margeZone + (z.A || 0))) continue;
    if (d.breches.some((b) => ecart(a, b.c) < b.h + 0.12)) continue;
    if (d.lames.some((l) => ecart(a, this.angleLame(l)) < d.sep * facteur)) continue;
    if (d.pommes.some((p) => ecart(a, p.a) < (pourPomme ? 0.3 : 0.16))) continue;
    if (this.marques.some((m) => m.disque === d && ecart(a, m.a) < d.sep * 2)) continue;
    if (eviterMonde !== undefined && ecart(a + d.theta, BAS) < eviterMonde) continue;
    return a;
  }
  return null;
};

Roue.prototype.angleLame = function (l) {
  return l.glisse ? norm(l.a0 + l.glisse.A * Math.sin(this.t * l.glisse.f + l.glisse.p)) : l.a;
};

/** Fait tourner un disque selon ses modes. */
Roue.prototype.tournerDisque = function (d, dt, immediat) {
  if (this.etat === 'echec') { d.omega *= Math.exp(-3.2 * dt); d.theta += d.omega * dt; return; }
  if (this.etat === 'gagne') { d.omega *= Math.exp(-1.2 * dt); d.theta += d.omega * dt; return; }
  const m = d.modes;
  if (m.includes('inverse')) {
    d.tInv -= dt;
    if (d.tInv <= 0) { d.dir *= -1; d.omega = -d.omega; d.tInv = 1.0 + this.rng() * 2.2; }
  }
  let cible = d.base * d.dir;
  if (m.includes('souffle')) cible *= 1 + 0.8 * Math.sin(this.t * d.fS + d.pS);
  if (m.includes('acoups')) {
    d.gateT -= dt;
    if (d.gateT <= 0) { d.gateOn = !d.gateOn; d.gateT = d.gateOn ? 0.55 + this.rng() * 0.75 : 0.3 + this.rng() * 0.45; }
    cible *= d.gateOn ? 1.7 : 0;
  }
  const k = m.includes('acoups') ? 16 : 7;
  if (immediat || !d.init) { d.omega = cible; d.init = true; } else d.omega += (cible - d.omega) * Math.min(1, k * dt);
  d.theta += d.omega * dt;
};

Roue.prototype.lamesRestantes = function () {
  let n = 0; for (const d of this.disques) n += Math.max(0, d.need - d.plantes); return Math.max(0, n - this.vols.length);
};

/** Lance un couteau (un toucher). */
Roue.prototype.lancer = function (type) {
  if (this.etat !== 'jeu') return false;
  if (this.lamesRestantes() <= 0) return false;
  if (this.vols.length) { this.buffer = true; return false; }
  this.vols.push({ d: this.d0, passe: false, type: type || 'base' });
  this.evt('lance', {});
  return true;
};

/** Que se passerait-il si une lame arrivait à l'angle a du disque d ? (null = elle se plante) */
Roue.prototype.issue = function (d, a) {
  for (const z of d.zones) if (ecart(a, z.c) < z.h + d.sep * 0.4) return { raison: 'poupee', zone: z };
  let proche = null, dist = 9;
  for (const l of d.lames) { const e = ecart(a, this.angleLame(l)); if (e < dist) { dist = e; proche = l; } }
  if (proche && dist < d.sep) return { raison: proche.spectre ? 'spectre' : 'lame', lame: proche };
  if (d.plantes >= d.need && this.disques.length > 1) return { raison: d.type === 'anneau' ? 'anneauPlein' : 'coeurPlein' };
  return null;
};

/** Angle d'arrivée d'une lame lancée maintenant (pour les consignes animées). */
Roue.prototype.predire = function () {
  const dur = (this.d0 - 1) / VIT_LAME;
  if (this.disques.length > 1) {
    const an = this.disques[1], co = this.disques[0];
    const ar = norm(BAS - (an.theta + an.omega * dur));
    if (an.breches.some((b) => ecart(ar, b.c) < b.h - an.sep * 0.5 - 0.12)) {
      const dur2 = (this.d0 - 0.56) / VIT_LAME;
      return { d: co, a: norm(BAS - (co.theta + co.omega * dur2)) };
    }
    if (an.breches.some((b) => ecart(ar, b.c) < b.h + 0.12)) return null;
    return { d: an, a: ar };
  }
  const d = this.disques[0];
  return { d, a: norm(BAS - (d.theta + d.omega * dur)) };
};

Roue.prototype.update = function (dt) {
  this.t += dt; this.tEtat += dt; this.tPhase += dt;
  if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 1.8);
  for (const d of this.disques) {
    this.tournerDisque(d, dt);
    for (const z of d.zones) if (z.A) z.c = norm(z.c0 + z.A * Math.sin(this.t * 2.1 + z.p));
    for (const l of d.lames) { if (l.entree > 0) l.entree = Math.max(0, l.entree - dt * 5); if (l.glisse) l.a = this.angleLame(l); }
  }
  // Projecteur qui faiblit
  if (this.noir && this.etat === 'jeu') {
    this.tNoir -= dt;
    if (this.tNoir <= 0) { this.sombre = !this.sombre; this.tNoir = this.sombre ? 0.55 + this.rng() * 0.45 : 1.5 + this.rng() * 1.2; this.evt('noir', { sombre: this.sombre }); }
  } else if (this.etat !== 'jeu') this.sombre = false;
  const cibleL = this.sombre ? 0.1 : 1;
  this.lumiere += (cibleL - this.lumiere) * Math.min(1, dt * (this.sombre ? 14 : 8));
  // Couteaux en vol
  for (let i = this.vols.length - 1; i >= 0; i--) {
    const v = this.vols[i];
    if (this.etat !== 'jeu') { this.vols.splice(i, 1); continue; }
    v.d -= VIT_LAME * dt;
    if (this.disques.length > 1) {
      const an = this.disques[1], co = this.disques[0];
      if (!v.passe && v.d <= 1) {
        const ar = norm(BAS - an.theta);
        if (an.breches.some((b) => ecart(ar, b.c) < b.h - an.sep * 0.5)) v.passe = true;
        else { this.vols.splice(i, 1); this.resoudre(an, ar, v); continue; }
      }
      if (v.passe && v.d <= 0.56) { this.vols.splice(i, 1); this.resoudre(co, norm(BAS - co.theta), v); continue; }
    } else if (v.d <= 1) {
      const d = this.disques[0];
      this.vols.splice(i, 1); this.resoudre(d, norm(BAS - d.theta), v); continue;
    }
  }
  // Le spectre plante des lames pendant la partie
  if (this.etat === 'jeu' && this.lancersRestants > 0) {
    this.tLancer -= dt;
    if (this.tLancer <= 0) {
      const d = this.cible, a = this.placeLibre(d, 1.9, 0.18, false, 0.7);
      this.tLancer = (this.demo ? 1.4 : 2.4) + this.rng() * 1.3;
      if (a !== null) { this.marques.push({ disque: d, a, t: 1.1, max: 1.1 }); this.lancersRestants--; this.evt('marque', {}); }
    }
  }
  for (let i = this.marques.length - 1; i >= 0; i--) {
    const m = this.marques[i];
    if (this.etat !== 'jeu') { this.marques.splice(i, 1); continue; }
    m.t -= dt;
    if (m.t <= 0) {
      this.marques.splice(i, 1);
      if (!m.disque.lames.some((l) => ecart(m.a, this.angleLame(l)) < m.disque.sep)) {
        m.disque.lames.push({ a: m.a, spectre: true, entree: 1 });
        this.evt('spectreLame', { disque: m.disque, a: m.a });
      }
    }
  }
  // Fin de phase : les lames tombent, puis la roue change de numéro
  if (this.etat === 'phaseFin') {
    if (!this.tombe && this.tEtat > 0.35) {
      this.tombe = true;
      for (const d of this.disques) {
        d.lames = d.lames.filter((l) => {
          if (l.spectre) return true;
          const w = l.a + d.theta, r = d.rImp + 0.15;
          this.tombes.push({ x: Math.cos(w) * r, y: Math.sin(w) * r, vx: Math.cos(w) * 1.4 + (this.rng() - 0.5), vy: Math.sin(w) * 1.4 - 1.2, rot: w, vr: (this.rng() - 0.5) * 14, type: l.type, ech: d.echelle });
          return false;
        });
      }
      this.evt('tombent', {});
    }
    if (this.tEtat > 1.25) { this.tombe = false; this.etat = 'jeu'; this.tEtat = 0; this.chargerPhase(this.iPhase + 1); this.evt('phase', { i: this.iPhase }); }
  }
  // Couteaux qui tombent
  for (let i = this.tombes.length - 1; i >= 0; i--) {
    const o = this.tombes[i]; o.vy += 9 * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.vr * dt;
    if (o.y > 6) this.tombes.splice(i, 1);
  }
};

/** Une lame arrive sur un disque : plantée, ou échec. */
Roue.prototype.resoudre = function (d, a, v) {
  const res = this.issue(d, a);
  if (res) {
    this.etat = 'echec'; this.tEtat = 0; this.buffer = false;
    this.echec = { raison: res.raison, num: res.lame && !res.lame.spectre ? res.lame.n : 0, disque: d, a, zone: res.zone || null };
    if (res.lame) res.lame.rouge = true;
    if (res.zone) res.zone.rouge = true;
    const r = d.rImp;
    this.tombes.push({ x: 0, y: r + 0.1, vx: (this.rng() < 0.5 ? -1 : 1) * (1.5 + this.rng() * 1.5), vy: 3, rot: BAS, vr: (this.rng() < 0.5 ? -1 : 1) * 16, type: v.type, rouge: true, ech: d.echelle });
    this.evt('echec', this.echec);
    return;
  }
  let dist = 9;
  for (const l of d.lames) dist = Math.min(dist, ecart(a, this.angleLame(l)));
  for (const z of d.zones) dist = Math.min(dist, Math.max(0, ecart(a, z.c) - z.h - d.sep * 0.4) + d.sep);
  const lame = { a, n: ++this.numLame, type: v.type, entree: 1 };
  d.lames.push(lame); d.plantes++; this.score += 10;
  this.evt('plante', { disque: d, a });
  if (dist < d.sep + BONUS_FROLE) { this.score += 15; this.frolements++; this.evt('frole', { disque: d, a }); }
  for (const p of d.pommes) if (!p.coupee && ecart(a, p.a) < d.pommeH) { p.coupee = true; this.pommesCoupees++; this.score += 50; this.evt('pomme', { disque: d, a: p.a }); }
  if (this.disques.every((x) => x.plantes >= x.need)) {
    this.tEtat = 0;
    if (this.iPhase < this.def.phases.length - 1) { this.etat = 'phaseFin'; this.evt('phaseFin', {}); }
    else { this.etat = 'gagne'; this.flash = 1; this.evt('gagne', {}); }
    this.buffer = false;
    return;
  }
  if (this.buffer) { this.buffer = false; this.lancer(v.type); }
};

/* ==========================================================================
   Dessin
   ========================================================================== */
const cv = $('c'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let fond = null, fondTheme = -1;
let ECHELLE_TXT = 0;   // rayon de la roue en pixels, pour écrire droit dans le repère de la roue

function redim() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  fond = null;
}

/** Disposition : centre de la roue, rayon en pixels, position du lanceur. */
function disposition(geant) {
  const haut = 64;
  const cyW = haut + (H - haut) * 0.36;
  let R = Math.min(W * 0.36, (H - haut) * 0.27);
  if (W > H) R = Math.min(W * 0.36, (H - haut) * 0.29);
  if (geant) R = Math.min(W * 0.41, (H - haut) * (W > H ? 0.32 : 0.305));
  return { x: W / 2, y: cyW, R: Math.max(60, R), yLanceur: H - Math.max(70, H * 0.12) };
}

/** Dessine un couteau couché le long de +x : pointe en x0, longueur L (unités de la roue). */
function dessinerCouteau(c, k, x0, L, rouge, alpha) {
  c.save();
  if (alpha !== undefined) c.globalAlpha *= alpha;
  const w = L * 0.13;
  if (k.id === 'spectre') { c.shadowColor = '#b48cff'; c.shadowBlur = 14; }
  if (k.id === 'ombre') { c.shadowColor = '#9a6aff'; c.shadowBlur = 10; }
  // lame
  c.beginPath();
  if (k.id === 'hache') {
    c.moveTo(x0, -w * 0.2); c.lineTo(x0 + L * 0.08, -w * 1.9); c.quadraticCurveTo(x0 + L * 0.3, -w * 2.1, x0 + L * 0.34, -w * 0.4);
    c.lineTo(x0 + L * 0.34, w * 0.5); c.lineTo(x0, w * 0.3); c.closePath();
  } else {
    c.moveTo(x0, 0); c.lineTo(x0 + L * 0.48, -w * 0.62); c.lineTo(x0 + L * 0.5, w * 0.5); c.lineTo(x0 + L * 0.12, w * 0.3); c.closePath();
  }
  c.fillStyle = rouge ? '#ff5050' : k.lame; c.fill();
  c.lineWidth = L * 0.018; c.strokeStyle = rouge ? '#ffd0d0' : k.bord; c.stroke();
  c.shadowBlur = 0;
  // reflet
  c.beginPath(); c.moveTo(x0 + L * 0.06, -w * 0.05); c.lineTo(x0 + L * 0.44, -w * 0.4);
  c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = L * 0.012; c.stroke();
  // garde
  const gx = k.id === 'hache' ? x0 + L * 0.34 : x0 + L * 0.5;
  c.fillStyle = rouge ? '#ff9090' : k.garde;
  c.fillRect(gx, -w * 1.05, L * 0.05, w * 2.1);
  // manche
  c.fillStyle = rouge ? '#a02020' : k.manche;
  const mx = gx + L * 0.05, ml = L - (mx - x0) - L * 0.05;
  c.beginPath(); c.moveTo(mx, -w * 0.55); c.lineTo(mx + ml, -w * 0.7); c.lineTo(mx + ml, w * 0.7); c.lineTo(mx, w * 0.55); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = L * 0.01;
  for (let i = 1; i < 4; i++) { const xx = mx + ml * i / 4; c.beginPath(); c.moveTo(xx, -w * 0.6); c.lineTo(xx, w * 0.6); c.stroke(); }
  // pommeau
  c.beginPath(); c.arc(x0 + L - L * 0.03, 0, w * 0.8, 0, TAU); c.fillStyle = rouge ? '#ffb0b0' : k.garde; c.fill();
  c.restore();
}

function couteauDe(id) { return id === 'spectre' ? COUTEAU_SPECTRE : (COUTEAUX.find((k) => k.id === id) || COUTEAUX[0]); }

/** La poupée de cire sanglée au centre d'un disque de rayon r (repère du disque). */
function dessinerPoupee(c, r, d, roue) {
  const zp = {}; for (const z of d.zones) zp[z.nom] = z;
  const pt = (z, f) => [Math.cos(z.c) * r * f, Math.sin(z.c) * r * f];
  const peur = roue.echec && roue.echec.raison === 'poupee';
  const s = r;
  c.lineCap = 'round'; c.lineJoin = 'round';
  // sangles vers le bord
  for (const z of d.zones) {
    const [x1, y1] = pt(z, z.nom === 'tete' ? 0.66 : 0.78), [x2, y2] = pt(z, 0.95);
    c.strokeStyle = z.rouge ? '#ff6a6a' : '#5a1218'; c.lineWidth = s * 0.06;
    c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
    c.strokeStyle = z.rouge ? '#ffd0d0' : '#c9a25a'; c.lineWidth = s * 0.015;
    c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  }
  const cire = '#efe2c8', ombreCire = '#c9b28c';
  // jambes
  const hanche = [[-0.08 * s, 0.16 * s], [0.08 * s, 0.16 * s]];
  ['piedG', 'piedD'].forEach((n, i) => {
    const z = zp[n]; const fin = z ? pt(z, 0.78) : [hanche[i][0] * 1.4, 0.55 * s];
    c.strokeStyle = ombreCire; c.lineWidth = s * 0.085; c.beginPath(); c.moveTo(hanche[i][0], hanche[i][1]); c.lineTo(fin[0], fin[1]); c.stroke();
    c.strokeStyle = cire; c.lineWidth = s * 0.06; c.beginPath(); c.moveTo(hanche[i][0], hanche[i][1]); c.lineTo(fin[0], fin[1]); c.stroke();
    c.fillStyle = '#2a1014'; c.beginPath(); c.arc(fin[0], fin[1], s * 0.05, 0, TAU); c.fill();
  });
  // bras
  const epaule = [[-0.12 * s, -0.27 * s], [0.12 * s, -0.27 * s]];
  ['mainG', 'mainD'].forEach((n, i) => {
    const z = zp[n]; const fin = z ? pt(z, 0.78) : [(i ? 0.17 : -0.17) * s, 0.02 * s];
    c.strokeStyle = ombreCire; c.lineWidth = s * 0.075; c.beginPath(); c.moveTo(epaule[i][0], epaule[i][1]); c.lineTo(fin[0], fin[1]); c.stroke();
    c.strokeStyle = cire; c.lineWidth = s * 0.052; c.beginPath(); c.moveTo(epaule[i][0], epaule[i][1]); c.lineTo(fin[0], fin[1]); c.stroke();
    c.fillStyle = cire; c.beginPath(); c.arc(fin[0], fin[1], s * 0.04, 0, TAU); c.fill();
  });
  // robe
  c.fillStyle = '#4a1022';
  c.beginPath(); c.moveTo(-0.13 * s, -0.3 * s); c.lineTo(0.13 * s, -0.3 * s); c.lineTo(0.22 * s, 0.22 * s); c.quadraticCurveTo(0, 0.3 * s, -0.22 * s, 0.22 * s); c.closePath(); c.fill();
  c.strokeStyle = '#e8c37a'; c.lineWidth = s * 0.012; c.stroke();
  c.strokeStyle = '#7a2a3a'; c.lineWidth = s * 0.01;
  for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * 0.04 * s, -0.25 * s); c.lineTo(i * 0.07 * s, 0.22 * s); c.stroke(); }
  // ceinture de cuir
  c.fillStyle = '#2a1014'; c.fillRect(-0.17 * s, -0.04 * s, 0.34 * s, 0.05 * s);
  c.fillStyle = '#c9a25a'; c.fillRect(-0.025 * s, -0.045 * s, 0.05 * s, 0.06 * s);
  // tête
  const hx = 0, hy = -0.47 * s, hr = 0.16 * s;
  c.fillStyle = '#1a0a0c'; c.beginPath(); c.arc(hx, hy - hr * 0.15, hr * 1.12, Math.PI * 0.95, Math.PI * 2.05); c.fill();
  const g = c.createRadialGradient(hx - hr * 0.3, hy - hr * 0.3, hr * 0.1, hx, hy, hr);
  g.addColorStop(0, '#fff6e6'); g.addColorStop(1, '#d8c29e');
  c.fillStyle = g; c.beginPath(); c.arc(hx, hy, hr, 0, TAU); c.fill();
  // fissure de cire
  c.strokeStyle = '#8a6a4a'; c.lineWidth = s * 0.008;
  c.beginPath(); c.moveTo(hx + hr * 0.5, hy - hr * 0.8); c.lineTo(hx + hr * 0.25, hy - hr * 0.35); c.lineTo(hx + hr * 0.42, hy - hr * 0.1); c.stroke();
  // yeux : ils regardent vers le lanceur (bas de l'écran)
  const vers = BAS - d.theta, ox = Math.cos(vers) * hr * 0.08, oy = Math.sin(vers) * hr * 0.08;
  const lueur = peur ? 1 : Math.max(0, 1 - roue.lumiere * 1.4);
  for (const ex of [-0.42, 0.42]) {
    c.fillStyle = '#20080c'; c.beginPath(); c.ellipse(hx + ex * hr, hy - hr * 0.05, hr * 0.26, hr * 0.3, 0, 0, TAU); c.fill();
    c.fillStyle = lueur > 0.05 ? `rgba(255,60,50,${0.5 + lueur * 0.5})` : '#e9f2ff';
    c.beginPath(); c.arc(hx + ex * hr + ox, hy - hr * 0.05 + oy, hr * (peur ? 0.13 : 0.1), 0, TAU); c.fill();
  }
  // bouche cousue
  c.strokeStyle = '#5a1218'; c.lineWidth = s * 0.012;
  c.beginPath(); c.moveTo(hx - hr * 0.35, hy + hr * 0.5); c.quadraticCurveTo(hx, hy + hr * (peur ? 0.35 : 0.62), hx + hr * 0.35, hy + hr * 0.5); c.stroke();
  for (let i = -2; i <= 2; i++) { const xx = hx + i * hr * 0.14; c.beginPath(); c.moveTo(xx, hy + hr * 0.42); c.lineTo(xx, hy + hr * 0.64); c.stroke(); }
  // joues
  c.fillStyle = 'rgba(200,60,70,0.25)';
  c.beginPath(); c.arc(hx - hr * 0.55, hy + hr * 0.3, hr * 0.15, 0, TAU); c.arc(hx + hr * 0.55, hy + hr * 0.3, hr * 0.15, 0, TAU); c.fill();
}

/** Dessine un disque (roue pleine, cœur ou anneau à brèches) dans son repère. */
function dessinerDisque(c, d, roue, th) {
  const r = d.rImp;
  c.save(); c.rotate(d.theta);
  if (d.type === 'anneau') {
    const rIn = 0.74;
    const segments = [[d.breches[0].c + d.breches[0].h, d.breches[1].c - d.breches[1].h], [d.breches[1].c + d.breches[1].h, d.breches[0].c - d.breches[0].h + TAU]];
    for (const [a0, a1] of segments) {
      c.beginPath(); c.arc(0, 0, r, a0, a1); c.arc(0, 0, rIn, a1, a0, true); c.closePath();
      const g = c.createRadialGradient(0, 0, rIn, 0, 0, r); g.addColorStop(0, th.bois2); g.addColorStop(1, th.bois1);
      c.fillStyle = g; c.fill();
      // peinture en damier
      const n = 8;
      for (let i = 0; i < n; i++) {
        const b0 = a0 + (a1 - a0) * i / n, b1 = a0 + (a1 - a0) * (i + 1) / n;
        c.beginPath(); c.arc(0, 0, r * 0.95, b0, b1); c.arc(0, 0, rIn + 0.04, b1, b0, true); c.closePath();
        c.fillStyle = i % 2 ? th.peintA : th.peintB; c.globalAlpha = 0.75; c.fill(); c.globalAlpha = 1;
      }
      c.lineWidth = 0.035; c.strokeStyle = th.rebord;
      c.beginPath(); c.arc(0, 0, r - 0.015, a0, a1); c.stroke();
      c.beginPath(); c.arc(0, 0, rIn + 0.015, a0, a1); c.stroke();
      // bords des brèches
      c.lineWidth = 0.03;
      for (const a of [a0, a1]) { c.beginPath(); c.moveTo(Math.cos(a) * rIn, Math.sin(a) * rIn); c.lineTo(Math.cos(a) * r, Math.sin(a) * r); c.stroke(); }
    }
    // rivets
    c.fillStyle = '#3a2a20';
    for (let i = 0; i < 24; i++) { const a = i * TAU / 24; if (d.breches.some((b) => ecart(a, b.c) < b.h + 0.05)) continue; c.beginPath(); c.arc(Math.cos(a) * 0.87, Math.sin(a) * 0.87, 0.018, 0, TAU); c.fill(); }
    // lueur des brèches
    for (const b of d.breches) {
      c.save(); c.rotate(b.c);
      const g = c.createRadialGradient(0.87, 0, 0.01, 0.87, 0, 0.22); g.addColorStop(0, 'rgba(255,220,150,0.25)'); g.addColorStop(1, 'rgba(255,220,150,0)');
      c.fillStyle = g; c.beginPath(); c.arc(0.87, 0, 0.22, 0, TAU); c.fill(); c.restore();
    }
  } else {
    // ombre portée
    c.fillStyle = 'rgba(0,0,0,0.45)'; c.beginPath(); c.arc(0.03, 0.05, r * 1.02, 0, TAU); c.fill();
    const g = c.createRadialGradient(-r * 0.2, -r * 0.25, r * 0.1, 0, 0, r);
    g.addColorStop(0, th.bois1); g.addColorStop(1, th.bois2);
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
    // rayons peints
    const n = 16;
    for (let i = 0; i < n; i++) {
      c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, r * 0.93, i * TAU / n, (i + 1) * TAU / n); c.closePath();
      c.fillStyle = i % 2 ? th.peintA : th.peintB; c.globalAlpha = 0.6; c.fill(); c.globalAlpha = 1;
    }
    // cercles
    for (const f of [0.93, 0.7, 0.45]) { c.beginPath(); c.arc(0, 0, r * f, 0, TAU); c.lineWidth = r * 0.025; c.strokeStyle = 'rgba(30,10,10,0.55)'; c.stroke(); }
    // planches
    c.strokeStyle = 'rgba(40,20,10,0.35)'; c.lineWidth = r * 0.008;
    for (let i = -3; i <= 3; i++) { const x = i * r * 0.27; const hh = Math.sqrt(Math.max(0, r * r - x * x)); c.beginPath(); c.moveTo(x, -hh); c.lineTo(x, hh); c.stroke(); }

}

/* Petite valse d'orgue de barbarie, en la mineur, très douce. */
const VALSE = (() => {
  const A = [220, 164.8, 220, 146.8, 220, 164.8, 220, 196];
  const M = [[440, 523, 659], [493, 415, 330], [523, 659, 587], [587, 440, 349], [659, 587, 523], [494, 523, 587], [523, 494, 440], [415, 494, 330]];
  return { basse: A, melodie: M };
})();
function musique() {
  if (!SON.ctx || SON.muet || !SON.enMusique || G.phase !== 'jeu') return;
  const a = SON.ctx;
  if (SON.prochaine < a.currentTime) SON.prochaine = a.currentTime + 0.05;
  const temps = 60 / 138;
  while (SON.prochaine < a.currentTime + 0.25) {
    const mes = Math.floor(SON.pas / 3) % 8, temp = SON.pas % 3, t = SON.prochaine - a.currentTime;
    const ralenti = G.roue && G.roue.lumiere < 0.5 ? 0.97 : 1;
    if (temp === 0) osc('triangle', VALSE.basse[mes] / 2 * ralenti, 0, temps * 0.9, 0.06, t);
    else { osc('square', VALSE.basse[mes] * 1.5 * ralenti, 0, temps * 0.35, 0.012, t); }

}

/* ==========================================================================

const P = { etoiles: new Array(20).fill(0), records: new Array(20).fill(0), couteau: 'base', vus: [], gagnes: new Array(20).fill(0) };
function chargerProgression() {
  let d = null;

  const n = NIVEAUX.length;
  P.etoiles = new Array(n).fill(0); P.records = new Array(n).fill(0); P.gagnes = new Array(n).fill(0); P.vus = []; P.couteau = 'base';
  try { const s = localStorage.getItem('cirque-des-lames-son'); if (s === '0' || s === '1') SON.muet = s === '0'; } catch (e) { /* rien */ }
  if (d && typeof d === 'object') {

    if (Array.isArray(d.records)) d.records.slice(0, n).forEach((v, i) => { P.records[i] = Math.max(0, Math.floor(Number(v) || 0)); });
    if (Array.isArray(d.gagnes)) d.gagnes.slice(0, n).forEach((v, i) => { P.gagnes[i] = v ? 1 : 0; });
    P.etoiles.forEach((v, i) => { if (v > 0) P.gagnes[i] = 1; });

  }

}
function totalEtoiles() { return P.etoiles.reduce((a, b) => a + b, 0); }
function totalScore() { return P.records.reduce((a, b) => a + b, 0); }
function ecrireProgression(niveau) {

/* ==========================================================================
   État du jeu
   ========================================================================== */
const G = { phase: 'titre', roue: null, i: 0, essais: 0, fige: false, attract: null, tuto: null, tutos: [], dernierT: 0, scoreAff: 0 };
let apercu = 0;

function evtJeu(roue, type, d) {
  const muet = roue !== G.roue || G.phase !== 'jeu';
  const pos = (disque, a, r) => { const w = a + disque.theta; return [Math.cos(w) * r, Math.sin(w) * r]; };
  if (type === 'lance') { if (!muet) son('lance'); }
  else if (type === 'plante') {
    const [x, y] = pos(d.disque, d.a, d.disque.rImp);
    particules(x, y, 9, { c: THEMES[theme()].bois1, v: 2.2, vie: 0.5, t: 0.025, forme: 'eclat', dir: d.a + d.disque.theta, cone: 2 });
    particules(x, y, 4, { c: '#fff2c8', v: 1.5, vie: 0.3, t: 0.012, g: 0 });
    FX.secousse = Math.max(FX.secousse, 5);
    if (!muet) son('tchac');
  } else if (type === 'frole') {
    const [x, y] = pos(d.disque, d.a, d.disque.rImp + 0.55);
    texteFlottant(T('frole'), x, y + 0.2, '#bfe3ff'); if (!muet) son('frole');
  } else if (type === 'pomme') {
    const [x, y] = pos(d.disque, d.a, d.disque.rImp + 0.08);
    particules(x, y, 2, { c: '#b0121e', v: 2.5, vie: 1.2, t: 0.07, forme: 'moitie', g: 7 });
    particules(x, y, 14, { c: '#d8263a', v: 2.5, vie: 0.8, t: 0.02, g: 6 });
    texteFlottant(T('points', { n: 50 }), x, y - 0.25, '#ff9a8a'); if (!muet) son('pomme');
  } else if (type === 'echec') {
    FX.secousse = 14;
    const [x, y] = pos(d.disque, d.a, d.disque.rImp);
    particules(x, y, 16, { c: '#ffe8a0', v: 3.5, vie: 0.4, t: 0.015, g: 0 });
    if (!muet) { son(d.raison === 'poupee' ? 'rire' : 'clang'); son('grince'); SON.enMusique = false; }
  } else if (type === 'marque') { if (!muet) son('marque'); }
  else if (type === 'spectreLame') {
    const [x, y] = pos(d.disque, d.a, d.disque.rImp + 0.2);
    particules(x, y, 14, { c: '#c8a6ff', v: 1.6, vie: 0.7, t: 0.03, g: -1 });
    if (!muet) son('spectre');
  } else if (type === 'tombent') { if (!muet) son('tombent'); }
  else if (type === 'phase') { texteFlottant(T('phaseFlottant', { n: d.i + 1, max: roue.def.phases.length }), 0, -1.35, '#ffd98a'); if (!muet) son('phase'); }
  else if (type === 'noir') { if (!muet) son('noir'); }
  else if (type === 'gagne') {
    if (roue.def.geant) {
      roue.brisee = true;
      const th = THEMES[theme()], n = 9;
      for (let i = 0; i < n; i++) {
        const a0 = i * TAU / n, a1 = (i + 1) * TAU / n, am = (a0 + a1) / 2 + roue.disques[0].theta;
        FX.fragments.push({ x: 0, y: 0, vx: Math.cos(am) * (1.5 + Math.random() * 1.5), vy: Math.sin(am) * 2 - 2.5, rot: roue.disques[0].theta, vr: (Math.random() - 0.5) * 5, a0, a1, peint: i % 2 ? th.peintA : th.peintB });
      }
      for (const dd of roue.disques) for (const l of dd.lames) {
        const w = l.a + dd.theta;
        roue.tombes.push({ x: Math.cos(w), y: Math.sin(w), vx: Math.cos(w) * 2.5, vy: Math.sin(w) * 2 - 2, rot: w, vr: (Math.random() - 0.5) * 12, type: l.spectre ? 'spectre' : l.type });
      }

    particules(0, -0.2, 50, { c: '#ffd98a', v: 3.5, vie: 1.6, t: 0.025, g: 2.5, forme: 'eclat' });
    particules(0, -0.2, 30, { c: '#ff7a8a', v: 3, vie: 1.6, t: 0.022, g: 2.5, forme: 'eclat' });
