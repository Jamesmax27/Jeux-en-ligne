function dessinerIntro(temps) {
  if (!intro) return;
  const cv = $('c-intro');
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W) return;
  const ctx = preparerCanvas(cv, W, H);
  const t = temps - intro.t0;
  const phaseA = 1.8;
  const cycle = phaseA + intro.total + 1.4;
  const tc = t % cycle;
  const coul = couleurPeinture(prog.peinture);
  if (tc < phaseA) {
    // Une main pose la nouvelle pièce sur une petite grille
    ctx.fillStyle = '#3d3352'; ctx.fillRect(0, 0, W, H);
    const s = Math.min((W * 0.62) / COLS, (H * 0.86) / LIGNES);
    const ox = (W * 0.7 - s * COLS) / 2, oy = (H - s * LIGNES) / 2;
    for (let r = 0; r < LIGNES; r++) for (let c = 0; c < COLS; c++) { ctx.fillStyle = (r + c) % 2 ? '#4a3f62' : '#463b5d'; rondRect(ctx, ox + c * s + 2, oy + r * s + 2, s - 4, s - 4, 6); ctx.fill(); }
    const [cr, cc] = DEMOS[intro.cle].cible;
    intro.g.forEach((tp, k) => {
      if (!tp) return;
      const r = Math.floor(k / COLS), c = k % COLS;
      if (r === cr && c === cc && tc < phaseA * 0.75) return;
      dessinerPiece(ctx, tp, ox + c * s, oy + r * s, s, { couleur: coul });
    });
    const k = Math.min(1, tc / (phaseA * 0.75));
    const e = lisse(k);
    const xd = W * 0.88, yd = H * 0.5;
    const xf = ox + cc * s, yf = oy + cr * s;
    const px = xd + (xf - xd) * e, py = yd + (yf - yd) * e - Math.sin(e * Math.PI) * H * 0.15;
    if (tc < phaseA * 0.75) dessinerPiece(ctx, DEMOS[intro.cle].piece, px, py, s, { couleur: coul });
    dessinerMain(ctx, px + s * 0.6, py + s * 0.7, s * 0.9, tc > phaseA * 0.75);
  } else {
    // Le bolide de démonstration franchit l'obstacle
    const te = Math.min(tc - phaseA, intro.total);
    const ms = intro.res.moves;
    let i = 0;
    while (i < ms.length - 1 && te >= intro.debuts[i + 1].t) i++;
    const m = ms[i];
    const p = Math.max(0, Math.min(1, (te - intro.debuts[i].t) / m.d));
    const pose = calculPose(intro.T, m, p, intro.debuts[i].pose, temps);
    // Caméra qui suit le bolide de près
    const U = Math.min(W / 6, H / 3.4);
    const camX = Math.max(-0.4, Math.min(intro.T.longueur - W / U, pose.x - (W * 0.35) / U));
    const cam = { x: camX, U, y0: H * 0.72 + Math.max(0, pose.y) * U * 0.6 };
    dessinerCiel(ctx, W, H, niv().terrain, 0, temps);
    dessinerParcours(ctx, intro.T, niv().terrain, cam, W, H, temps);
    dessinerBolide(ctx, intro.g, (pose.x - cam.x) * cam.U, cam.y0 - pose.y * cam.U, CELL_U * cam.U, pose.ang, { rot: pose.x / 0.18, spin: temps * 30, comp: pose.comp || 0, t: temps, vol: pose.vol, couleur: coul });
  }
}
function dessinerMain(ctx, x, y, s, appuie) {
  ctx.save();
  ctx.translate(x, y);
  const k = appuie ? 0.9 : 1;
  ctx.scale(k, k);
  ctx.fillStyle = '#ffe0bd'; ctx.strokeStyle = '#7a4b2a'; ctx.lineWidth = Math.max(1.5, s * 0.05);
  // Doigt pointé
  rondRect(ctx, -s * 0.09, -s * 0.5, s * 0.18, s * 0.5, s * 0.09); ctx.fill(); ctx.stroke();
  // Paume
  rondRect(ctx, -s * 0.2, -s * 0.12, s * 0.45, s * 0.42, s * 0.14); ctx.fill(); ctx.stroke();
  ctx.restore();
}

let tuto = null;

  $('bulle-tuto').classList.add('cache');
}
function centre(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r }; }
function dessinerTuto(temps) {
  if (!tuto) return;
  const cv = $('tuto');
  const ctx = cv.getContext('2d');
  ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  const t = (temps - tuto.t0) % 5.4;
  const rg = $('c-grille').getBoundingClientRect();
  const caseC = (r, c) => ({ x: rg.left + (c + 0.5) * tailleCase, y: rg.top + (r + 0.5) * tailleCase });
  const bc = document.querySelector('.piece-btn[data-type="caisse"]'), br = document.querySelector('.piece-btn[data-type="roue"]');
  if (!bc || !br) return;
  let etape, de, vers, type;
  if (t < 1.8) { etape = 1; de = centre(bc); vers = caseC(3, 2); type = 'caisse'; }
  else if (t < 3.6) { etape = 2; de = centre(br); vers = caseC(3, t < 2.7 ? 1 : 3); type = 'roue'; }
  else { etape = 3; de = centre($('b-essai')); vers = de; type = null; }
  const loc = etape === 2 ? ((t - 1.8) % 0.9) / 0.9 : (t % 1.8) / 1.8;
  const k = lisse(Math.min(1, loc / 0.75));
  const x = de.x + (vers.x - de.x) * k, y = de.y + (vers.y - de.y) * k;
  const s = tailleCase;
  if (type) { ctx.globalAlpha = 0.85; dessinerPiece(ctx, type, x - s / 2, y - s / 2, s, { couleur: couleurPeinture(prog.peinture) }); ctx.globalAlpha = 1; }
  else {
    ctx.strokeStyle = 'rgba(255,224,138,.9)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(x, y, 30 + 14 * Math.sin(t * 8), 0, Math.PI * 2); ctx.stroke();
  }
  dessinerMain(ctx, x + 6, y + s * 0.55, 64, type ? false : Math.sin(t * 8) > 0);
  const bulle = $('bulle-tuto');
  bulle.textContent = T('tuto' + etape);
  bulle.style.top = Math.max(8, rg.top - 54) + 'px';
}

  for (let x = -40; x < W + 80; x += 120) { ctx.fillRect(x, 0, 18, H * 0.78); }
  ctx.strokeStyle = 'rgba(30,20,45,.35)'; ctx.lineWidth = 10;
  for (let x = -40; x < W; x += 120) { ctx.beginPath(); ctx.moveTo(x + 9, H * 0.08); ctx.lineTo(x + 129, H * 0.3); ctx.stroke(); }
  // Panneau à outils (troué) à gauche et étagère de roues à droite
  const pw = Math.min(W * 0.36, 220), ph = H * 0.2, px = W * 0.04, py = H * 0.3;
  ctx.fillStyle = '#c99a63'; rondRect(ctx, px, py, pw, ph, 10); ctx.fill();
  ctx.fillStyle = 'rgba(90,60,30,.35)';
  for (let x = px + 10; x < px + pw - 5; x += 16) for (let y = py + 10; y < py + ph - 5; y += 16) { ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill(); }
  // Clé et marteau dessinés
  ctx.save(); ctx.translate(px + pw * 0.3, py + ph * 0.5); ctx.rotate(-0.5);
  ctx.fillStyle = '#9aa3b5'; ctx.fillRect(-4, -ph * 0.3, 8, ph * 0.55);
  ctx.beginPath(); ctx.arc(0, -ph * 0.32, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c99a63'; ctx.fillRect(-4, -ph * 0.45, 8, 12); ctx.restore();
  ctx.save(); ctx.translate(px + pw * 0.7, py + ph * 0.5); ctx.rotate(0.4);
  ctx.fillStyle = '#8e5a30'; ctx.fillRect(-4, -ph * 0.25, 8, ph * 0.55);
  ctx.fillStyle = '#5b5f6e'; ctx.fillRect(-16, -ph * 0.32, 32, 14); ctx.restore();
  const sx = W - Math.min(W * 0.34, 210) - W * 0.04, sw = Math.min(W * 0.34, 210);
  ctx.fillStyle = '#8e5a30'; ctx.fillRect(sx, H * 0.47, sw, 8);
  for (let k = 0; k < 3; k++) roueDessin(ctx, sx + sw * (0.2 + k * 0.3), H * 0.47 - 20, 18, temps * 0.2 + k, k === 1 ? '#f2c230' : '#cdd3de');
  // Lampes suspendues
  for (const lx of [W * 0.28, W * 0.72]) {
    ctx.strokeStyle = '#2a1f35'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, H * 0.1); ctx.stroke();
    ctx.fillStyle = '#3c2f4f'; ctx.beginPath(); ctx.moveTo(lx - 22, H * 0.1 + 18); ctx.lineTo(lx - 10, H * 0.1); ctx.lineTo(lx + 10, H * 0.1); ctx.lineTo(lx + 22, H * 0.1 + 18); ctx.fill();
    const lu = ctx.createRadialGradient(lx, H * 0.12, 4, lx, H * 0.4, H * 0.4);
    lu.addColorStop(0, 'rgba(255,230,160,.45)'); lu.addColorStop(1, 'rgba(255,230,160,0)');
    ctx.fillStyle = lu; ctx.beginPath(); ctx.moveTo(lx - 20, H * 0.12); ctx.lineTo(lx - H * 0.25, H * 0.78); ctx.lineTo(lx + H * 0.25, H * 0.78); ctx.lineTo(lx + 20, H * 0.12); ctx.fill();
  }
  // Guirlande de fanions
  for (let k = 0; k < 14; k++) {
    const x = (k + 0.5) * W / 14, y = H * 0.2 + Math.sin(k / 13 * Math.PI) * 18;
    ctx.fillStyle = ['#e5483b', '#f2c230', '#3b7be5', '#3fae5a'][k % 4];
    ctx.beginPath(); ctx.moveTo(x - 10, y); ctx.lineTo(x + 10, y); ctx.lineTo(x, y + 18 + Math.sin(temps * 3 + k) * 2); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let k = 0; k <= 14; k++) { const x = k * W / 14, y = H * 0.2 + Math.sin(Math.min(1, k / 14) * Math.PI) * 18; if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); } ctx.stroke();
  // Sol en planches
  ctx.fillStyle = '#b97b46'; ctx.fillRect(0, sol, W, H - sol);
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  for (let y = sol; y < H; y += 22) ctx.fillRect(0, y, W, 2);
  for (let k = 0; k < 12; k++) ctx.fillRect(((k * 97) % W), sol + (k % 5) * 22, 2, 22);
  // Caisses empilées et bouée
  ctx.save(); ctx.globalAlpha = 0.95;
  const cs = Math.min(W, H) * 0.075;
  dessinerPiece(ctx, 'caisse', W * 0.04, sol - cs, cs, { couleur: '#8d6a44' });
  dessinerPiece(ctx, 'caisse', W * 0.04 + cs, sol - cs, cs, { couleur: '#7b5c3b' });
  dessinerPiece(ctx, 'caisse', W * 0.04 + cs * 0.5, sol - cs * 2, cs, { couleur: '#9a7650' });
  dessinerPiece(ctx, 'bouee', W * 0.86, sol - cs * 1.1, cs * 1.1, {});
  ctx.restore();
  // Le bolide vedette, qui se balance doucement
  const s = Math.min(W / 9, (sol - H * 0.25) / 4.2, 64);
  const bx = W * 0.5, by = sol - 2 - Math.abs(Math.sin(temps * 2)) * s * 0.08;
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(bx, sol + 2, s * 3.2, s * 0.25, 0, 0, Math.PI * 2); ctx.fill();
  dessinerBolide(ctx, PLAN_TITRE, bx, by, s, Math.sin(temps * 1.3) * 0.03, { rot: temps * 1.5, spin: temps * 18, t: temps, vol: true, couleur: couleurPeinture(prog ? prog.peinture : 'rouge') });
  // Étincelles
  for (let k = 0; k < 10; k++) {
    const a = temps * 0.6 + k * 1.7;
    const x = bx + Math.cos(a) * s * (3 + (k % 3)), y = sol - s * 2.5 + Math.sin(a * 1.3) * s * 1.6;
    ctx.fillStyle = `rgba(255,236,150,${0.4 + 0.4 * Math.sin(temps * 4 + k)})`;
    ctx.beginPath(); ctx.arc(x, y, 2 + (k % 3), 0, Math.PI * 2); ctx.fill();
  }
}

// ==========================================================================
// Boucle d'animation
// ==========================================================================
let derniere = performance.now();
function boucle(maintenant) {
  const dt = Math.min(0.05, (maintenant - derniere) / 1000);
  derniere = maintenant;
  const temps = maintenant / 1000;
  if (ecran === 'titre') dessinerTitre(temps);
  else if (ecran === 'garage') dessinerGarage(temps);
  else if (ecran === 'jeu') {
    if (!enPause) {
      if (mode === 'essai') majEssai(dt, temps);
      if (eclats.length) {
        for (const e of eclats) { e.vie -= dt; e.x += e.vx * dt; e.y += e.vy * dt; }
        eclats = eclats.filter((e) => e.vie > 0);
      }
    }
    if (!enPause) dessinerScene(temps);
    if (mode === 'atelier') {
      dessinerGrille();
      if (eclats.length) {
        const ctx = $('c-grille').getContext('2d');
        ctx.fillStyle = '#ffe08a';
        for (const e of eclats) { ctx.globalAlpha = Math.max(0, e.vie / 0.35); ctx.beginPath(); ctx.arc(e.x, e.y, 3, 0, Math.PI * 2); ctx.fill(); }
        ctx.globalAlpha = 1;
      }
    }
    if (intro) dessinerIntro(temps);
    if (tuto) dessinerTuto(temps);
  }
  requestAnimationFrame(boucle);
}

// ==========================================================================
// Boutons et clavier
// ==========================================================================
function jouer() {
  audio(); son('clic');
  lireProg();
  JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => { lireProg(); const n = Math.max(1, Math.min(N, Math.floor(Number(d.niveau) || 1))); prog.atteint = Math.max(prog.atteint, n); lancerNiveau(n - 1); },
    onNouvelle: () => lancerNiveau(0),
    onEffacer: () => { prog = progVide(); lancerNiveau(0); }
  });
}
$('b-jouer').addEventListener('click', jouer);
$('b-niveaux').addEventListener('click', () => { audio(); son('clic'); lireProg(); ouvrirNiveaux(); });
$('b-garage').addEventListener('click', () => { audio(); son('clic'); lireProg(); ouvrirGarage(); });
document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', () => { audio(); basculerSon(); }));
document.querySelectorAll('.b-retour').forEach((b) => { b.innerHTML = ICONES.retour; b.addEventListener('click', () => { audio(); son('clic'); montrerEcran('titre'); }); });
$('b-pause').innerHTML = ICONES.pause;
$('b-annuler').innerHTML = ICONES.annuler;
$('b-vider').innerHTML = ICONES.vider;
$('b-style').innerHTML = ICONES.peinture;
$('b-astuce').innerHTML = ICONES.astuce;
$('b-pause').addEventListener('click', () => { audio(); son('clic'); pause(); });
$('b-reprendre').addEventListener('click', () => { reprendre(); son('clic'); });
$('b-recommencer').addEventListener('click', () => { enPause = false; if (ac && ac.state === 'suspended' && !sonCoupe) ac.resume().catch(() => {}); lancerNiveau(idx, true); });
$('b-accueil').addEventListener('click', () => {
  enPause = false; fermerFenetres(); moteurArreter();
  if (ac && ac.state === 'suspended' && !sonCoupe) ac.resume().catch(() => {});
  if (partieEnCours) { prog.plans[idx] = grille.slice(); sauver(niveauReprise); }
  partieEnCours = false; mode = 'atelier'; essai = null; $('ecran-jeu').classList.remove('essai');
  montrerEcran('titre');
});
$('b-annuler').addEventListener('click', () => { audio(); annuler(); });
$('b-vider').addEventListener('click', () => { audio(); vider(); });
$('b-style').addEventListener('click', () => { audio(); son('clic'); ouvrirStyle(); });
$('b-style-ok').addEventListener('click', () => { audio(); son('clic'); $('fen-style').classList.add('cache'); });
$('b-astuce').addEventListener('click', () => { audio(); son('clic'); afficherMsg(T('astuce.' + (idx + 1)), 'bon', true); });
$('b-essai').addEventListener('click', lancerEssai);
$('b-vite').addEventListener('click', () => { audio(); vitesse = vitesse === 1 ? 2 : 1; $('b-vite').classList.toggle('actif', vitesse === 2); son('clic'); });
$('b-arreter').addEventListener('click', () => { audio(); son('clic'); arreterEssai(); });
$('b-compris').addEventListener('click', fermerIntro);
$('fen-style').addEventListener('pointerdown', (e) => { if (e.target === $('fen-style')) $('fen-style').classList.add('cache'); });
document.addEventListener('pointerdown', () => { if (tuto) cacherTuto(); }, true);

document.addEventListener('keydown', (e) => {
  const k = e.key;
  const surBouton = e.target && e.target.tagName === 'BUTTON';
  const fen = fenetreOuverte();
  if (document.querySelector('jel-sauvegarde')) return;
  if (fen === 'fen-intro') { if (k === 'Enter' || k === ' ' || k === 'Escape') { e.preventDefault(); fermerIntro(); } return; }
  if (fen === 'fen-pause') { if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); reprendre(); } return; }
  if (fen === 'fen-style') { if (k === 'Escape') { e.preventDefault(); $('fen-style').classList.add('cache'); } return; }
  if (fen === 'fen-fin') { if (k === 'Enter' && !surBouton) { e.preventDefault(); const b = $('fin-boutons').querySelector('button'); if (b) b.click(); } return; }
  if (ecran === 'titre') { if (k === 'Enter' && !surBouton) { e.preventDefault(); jouer(); } return; }
  if (ecran !== 'jeu') { if (k === 'Escape') montrerEcran('titre'); return; }
  if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); pause(); return; }
  if (mode === 'essai') {
    if (k === ' ' || k === 'Enter') { e.preventDefault(); $('b-vite').click(); }
    if (k === 'Backspace') { e.preventDefault(); arreterEssai(); }
    return;
  }
  cacherTuto();
  if (surBouton && (k === 'Enter' || k === ' ')) return;
  const fl = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[k];
  if (fl) {
    e.preventDefault();
    curseur = { r: Math.max(0, Math.min(LIGNES - 1, curseur.r + fl[0])), c: Math.max(0, Math.min(COLS - 1, curseur.c + fl[1])) };
    if (document.activeElement !== $('c-grille')) $('c-grille').focus();
    audio(); son('clic'); dessinerGrille();
    return;
  }
  if (/^[1-7]$/.test(k)) {
    const b = document.querySelector(`.piece-btn[data-touche="${k}"]`);
    if (b) { e.preventDefault(); choisir(b.dataset.type); if (choix !== b.dataset.type) choisir(b.dataset.type); }
    return;
  }
  if (k === ' ') { e.preventDefault(); audio(); toucherCase(curseur.r, curseur.c); return; }
  if (k === 'Enter') { e.preventDefault(); lancerEssai(); return; }
  if (k === 'Backspace' || k === 'Delete') { e.preventDefault(); audio(); retirer(curseur.r, curseur.c); return; }
  if (k === 'z' || k === 'Z') { e.preventDefault(); audio(); annuler(); return; }
  if (k === 'h' || k === 'H') { audio(); afficherMsg(T('astuce.' + (idx + 1)), 'bon', true); }
});

// Sauvegarde à la fermeture de la page, seulement pendant une partie
JEL_SAVE.surFermeture(() => {
  if (partieEnCours && ecran === 'jeu') { prog.plans[idx] = grille.slice(); JEL_SAVE.save(JEU, { niveau: niveauReprise, score: totalScore(), options: { son: !sonCoupe }, prog }); }
});
if (window.JEL_I18N && JEL_I18N.surChangement) JEL_I18N.surChangement(() => { if (ecran === 'jeu') { $('nom-niveau').textContent = T('niveauNom', { n: idx + 1, nom: T('nom.' + (idx + 1)) }); construireReserve(); majAtelier(); } });

lireProg();
majBoutonsSon();
requestAnimationFrame(boucle);
</script>
