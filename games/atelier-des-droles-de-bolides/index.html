        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
'use strict';
// ==========================================================================
// L'atelier des drôles de bolides — Free Micro Games
// On assemble un véhicule sur une grille, puis il roule seul vers le drapeau.
// ==========================================================================
const JEU = 'atelier-des-droles-de-bolides';
const T = (cle, vars) => window.JEL_I18N.t(cle, vars);
const NB = (x) => window.JEL_I18N.nombre(x);
const $ = (id) => document.getElementById(id);
const unDec = (x) => NB(Math.round(x * 10) / 10);

// <SIM>
// --------------------------------------------------------------------------
// Moteur du bolide : analyse du plan et simulation de l'essai.
// Tout est déterministe : un même plan donne toujours le même essai.
// --------------------------------------------------------------------------
const COLS = 6;          // colonnes de la grille de montage (0 = arrière)
const LIGNES = 4;        // lignes de la grille (0 = en haut)
const CELL_U = 0.42;     // taille d'une case dans le monde (unités du parcours)

// Pièces : poids et prix (budget).
const PIECES = {
  caisse:  { poids: 2, prix: 2 },
  roue:    { poids: 1, prix: 1 },
  grosse:  { poids: 2, prix: 3 },
  ressort: { poids: 1, prix: 2 },
  helice:  { poids: 1, prix: 3 },
  aile:    { poids: 1, prix: 2 },
  bouee:   { poids: 1, prix: 1 }
};
const ORDRE_PIECES = ['caisse', 'roue', 'grosse', 'ressort', 'helice', 'aile', 'bouee'];
const VOISINS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const PORTE_BOUEE = 5;   // poids que porte une bouée sur l'eau
const PORTE_AILE = 4;    // poids que porte une aile dans le vent qui monte

function grilleVide() { return new Array(COLS * LIGNES).fill(null); }
function cel(g, r, c) { return (r < 0 || c < 0 || r >= LIGNES || c >= COLS) ? null : g[r * COLS + c]; }

// Analyse d'un plan : poids, prix, pièces utiles, équilibre, problèmes de montage.
function analyser(g) {
  const a = {
    pieces: [], n: 0, poids: 0, prix: 0, compte: {},
    detachees: [], helicesBloquees: [], inutiles: [],
    roues: 0, grosses: 0, ressorts: 0, helices: 0, ailes: 0, bouees: 0,
    hauteur: 0, longueur: 0, bas: -1, cm: 0, supMin: 99, supMax: -1, equilibre: false,
    minCol: 99, maxCol: -1, minLig: 99, sansCaisse: true
  };
  for (const t of ORDRE_PIECES) a.compte[t] = 0;
  for (let r = 0; r < LIGNES; r++) for (let c = 0; c < COLS; c++) {
    const t = cel(g, r, c);
    if (!t) continue;
    a.pieces.push({ t, r, c });
    a.n++; a.compte[t]++;
    a.poids += PIECES[t].poids; a.prix += PIECES[t].prix;
    a.minCol = Math.min(a.minCol, c); a.maxCol = Math.max(a.maxCol, c);
    a.minLig = Math.min(a.minLig, r); a.bas = Math.max(a.bas, r);
  }
  if (!a.n) return a;
  a.hauteur = a.bas - a.minLig + 1;
  a.longueur = a.maxCol - a.minCol + 1;
  // Toutes les pièces forment un seul bloc (elles se touchent par un côté),
  // qui contient au moins une caisse. On garde le plus grand bloc avec caisse.
  const caisses = a.pieces.filter((p) => p.t === 'caisse');
  const bloc = new Set();
  if (caisses.length) {
    a.sansCaisse = false;
    const dejaVu = new Set();
    for (const depart of caisses) {
      const k0 = depart.r * COLS + depart.c;
      if (dejaVu.has(k0)) continue;
      const ici = new Set([k0]);
      const pile = [depart];
      while (pile.length) {
        const p = pile.pop();
        for (const [dr, dc] of VOISINS) {
          const r = p.r + dr, c = p.c + dc, k = r * COLS + c;
          if (cel(g, r, c) && !ici.has(k)) { ici.add(k); pile.push({ r, c }); }
        }
      }
      for (const k of ici) dejaVu.add(k);
      if (ici.size > bloc.size) { bloc.clear(); for (const k of ici) bloc.add(k); }
    }
  }
  for (const p of a.pieces) if (!bloc.has(p.r * COLS + p.c)) a.detachees.push(p);
  // Pièces qui servent vraiment
  let somme = 0;
  for (const p of a.pieces) {
    somme += PIECES[p.t].poids * p.c;
    const auSol = p.r === a.bas;
    if (p.t === 'roue') { if (auSol) a.roues++; else a.inutiles.push(p); }
    if (p.t === 'grosse') { if (auSol) a.grosses++; else a.inutiles.push(p); }
    if (p.t === 'ressort') { if (auSol) a.ressorts++; else a.inutiles.push(p); }
    if ((p.t === 'roue' || p.t === 'grosse') && auSol) { a.supMin = Math.min(a.supMin, p.c); a.supMax = Math.max(a.supMax, p.c); }
    if (p.t === 'helice') {
      // L'hélice souffle vers l'arrière : rien ne doit se trouver derrière elle.
      if (cel(g, p.r, p.c - 1)) a.helicesBloquees.push(p); else a.helices++;
    }
    if (p.t === 'aile') a.ailes++;
    if (p.t === 'bouee') a.bouees++;
  }
  a.cm = somme / a.poids;
  a.equilibre = a.supMax > a.supMin && a.cm >= a.supMin - 0.01 && a.cm <= a.supMax + 0.01;
  return a;
}

// Problème de montage qui empêche l'essai (le bolide ne peut pas partir).
function problemeMontage(a, niv) {
  if (!a.n) return 'vide';
  if (a.sansCaisse) return 'sansCaisse';
  if (a.detachees.length) return 'detachees';
  if (niv.budget && a.prix > niv.budget) return 'budget';
  return null;
}

// Forces utiles du bolide
function forces(a) {
  const P = a.poids;
  const fPlat = 2 * a.roues + 2.5 * a.grosses + 1.5 * a.helices;
  const vPlat = 1 + 2.5 * Math.min(1.2, fPlat / P);
  const saut = a.ressorts > 0 ? 0.4 + 10 * a.ressorts / P + 0.5 * a.ailes : 0;
  const bond = a.ressorts > 0 ? 4.5 * a.ressorts / P : 0;   // hauteur d'un bond sur place (corniches)
  return { P, fPlat, vPlat, saut, bond };
}

// Terrain : liste de tronçons (début x, longueur L, hauteur au départ h0 et à la fin h1).
function construireTerrain(niv) {
  const tr = [{ type: 'plat', x: 0, L: 3, h0: 0, h1: 0 }];
  let x = 3, h = 0;
  for (const s of niv.parcours) {
    const t = { type: s[0], x, h0: h, L: s[1], h1: h };
    if (t.type === 'cote') { t.h1 = h + s[2]; t.raide = s[3] === 'raide'; }
    else if (t.type === 'descente') t.h1 = h - s[2];
    else if (t.type === 'glace') t.h1 = h + s[2];
    else if (t.type === 'riviere') t.courant = s[2] || 0;
    else if (t.type === 'tunnel') t.hmax = s[2];
    else if (t.type === 'marche') { t.L = 0.6; t.h1 = h + s[1]; t.haut = s[1]; }
    tr.push(t);
    x += t.L; h = t.h1;
  }
  tr.push({ type: 'plat', x, L: 5, h0: h, h1: h, arrivee: true });
  return { troncons: tr, fin: x + 1.5, longueur: x + 5 };
}

// Simulation : renvoie { ok, moves, raison, temps, stopX }.
// Chaque mouvement { m, x0, x1, d } : sol, saut, nage, vol, chute, coule,
// recule, bonk, bascule, cale, derive, bond, arrivee.
function simuler(g, niv) {
  const a = analyser(g);
  const terrain = construireTerrain(niv);
  const res = { ok: false, moves: [], raison: null, temps: 0, stopX: 1.5, a, terrain };
  const pb = problemeMontage(a, niv);
  if (pb) { res.raison = pb; return res; }
  const f = forces(a);
  const P = f.P;
  res.f = f;
  let x = 1.5;
  const mv = (m, x1, d, extra) => { d = Math.max(0.05, d); res.moves.push(Object.assign({ m, x0: x, x1, d }, extra || {})); res.temps += d; x = x1; };
  // proche : de 0 à 1, à quel point il s'en est fallu de peu (aide et réglages)
  const echec = (raison, proche) => { res.raison = raison; res.stopX = x; res.proche = Math.max(0, Math.min(1, proche || 0)); return res; };
  if (a.roues + a.grosses === 0) { mv('cale', x, 1.2); return echec('pasDeRoue'); }
  if (!a.equilibre) {
    const une = a.supMax <= a.supMin;
    mv('bascule', x, 1.3, { sens: une ? 1 : (a.cm < a.supMin ? -1 : 1) });
    return echec(une ? 'uneRoue' : 'bascule');
  }
  for (const t of terrain.troncons) {
    const fin = t.x + t.L;
    if (t.type === 'plat' || t.type === 'descente') {
      if (t.arrivee) { mv('sol', terrain.fin, (terrain.fin - x) / f.vPlat); break; }
      mv('sol', fin, (fin - x) / (f.vPlat * (t.type === 'descente' ? 1.3 : 1)));
    } else if (t.type === 'cote' || t.type === 'glace') {
      let F, besoin;
      if (t.type === 'cote') {
        F = (t.raide ? 0.5 : 2) * a.roues + 3 * a.grosses + 2 * a.helices;
        besoin = P * (t.raide ? 0.55 : 0.3);
      } else {
        F = 0.4 * (a.roues + a.grosses) + 3 * a.helices;
        besoin = P * 0.45;
      }
      if (F >= besoin) mv('sol', fin, (fin - x) / (f.vPlat * 0.65));
      else {
        const x1 = t.x + t.L * Math.max(0.15, Math.min(0.85, F / besoin));
        mv('sol', x1, (x1 - x) / (f.vPlat * 0.5));
        mv('recule', x1 - t.L * 0.08, 0.6);
        return echec(t.type === 'glace' ? 'glace' : (t.raide ? 'coteRaide' : 'cote'), F / besoin);
      }
    } else if (t.type === 'boue') {
      const F = 3 * a.grosses + 2 * a.helices;
      if (F >= P * 0.45) mv('sol', fin, (fin - x) / (f.vPlat * 0.5));
      else {
        const x1 = t.x + t.L * Math.max(0.12, Math.min(0.8, F / (P * 0.45)));
        mv('sol', x1, (x1 - x) / (f.vPlat * 0.35));
        mv('cale', x1, 1.0, { boue: true });
        return echec('boue', F / (P * 0.45));
      }
    } else if (t.type === 'fosse') {
      if (f.saut >= t.L + 0.3) {
        mv('saut', fin + 0.4, (t.L + 0.4) / (f.vPlat * 1.2) + 0.25, { haut: 0.6 + 0.15 * t.L });
      } else {
        const x1 = t.x + Math.max(0.3, Math.min(t.L - 0.3, f.saut * 0.85));
        mv('saut', x1, 0.5, { haut: f.saut > 0 ? 0.4 : 0.05, rate: true });
        mv('chute', x1, 1.0);
        return echec(a.ressorts ? 'fossePetit' : 'fosse', f.saut / (t.L + 0.3));
      }
    } else if (t.type === 'vent') {
      const portance = PORTE_AILE * a.ailes;
      if (portance >= P) {
        mv('vol', fin + 0.3, (t.L + 0.3) / (f.vPlat * 1.1) + 0.3, { haut: 1.2 + Math.min(1.5, (portance - P) * 0.15) });
      } else if (f.saut >= t.L + 0.3) {
        mv('saut', fin + 0.4, (t.L + 0.4) / (f.vPlat * 1.2) + 0.25, { haut: 0.6 + 0.15 * t.L });
      } else {
        const x1 = t.x + Math.max(0.4, Math.min(t.L - 0.4, t.L * (a.ailes ? portance / P : 0.1) + f.saut * 0.5));
        mv(a.ailes ? 'vol' : 'saut', x1, a.ailes ? 1.1 : 0.5, { haut: a.ailes ? 0.5 : 0.1, rate: true });
        mv('chute', x1, 1.1);
        return echec(a.ailes ? 'ventPeu' : 'vent', portance / P);
      }
    } else if (t.type === 'riviere') {
      const besoinH = Math.max(1, t.courant || 0);
      if (PORTE_BOUEE * a.bouees < P) {
        mv('sol', t.x + 0.6, 0.5);
        mv('coule', t.x + 0.7, 1.4);
        return echec(a.bouees ? 'coulePeu' : 'coule', PORTE_BOUEE * a.bouees / P);
      }
      if (a.helices < besoinH) {
        const x1 = t.x + Math.min(1.2, t.L * 0.35);
        mv('nage', x1, 1.0);
        mv('derive', x1, 1.4);
        return echec(t.courant ? 'courant' : 'pousse', a.helices / besoinH);
      }
      const vEau = 0.8 + 2 * Math.min(1.2, 3 * a.helices / P) - (t.courant ? 0.3 : 0);

        mv('bonk', t.x - 0.6, 0.7);
        return echec('tunnel', t.hmax / a.hauteur);
      }
      mv('sol', fin, (fin - x) / f.vPlat);
    } else if (t.type === 'face') {
      const besoin = P * 0.3 + 1 * a.ailes;
      if (f.fPlat >= besoin) mv('sol', fin, (fin - x) / (f.vPlat * 0.5));
      else {

        mv('recule', x1 - 0.8, 0.9);

      }

    }

  res.ok = true;
  res.stopX = x;
  res.temps = Math.round(res.temps * 10) / 10;
  return res;
}

      for (let k = 0; k < t.L * 2; k++) {
        const xx = X(x0 + 0.3 + ((k * 0.5 + sens * temps * (t.courant ? 0.8 : 0.25)) % t.L + t.L) % t.L);
        ctx.beginPath(); ctx.moveTo(Math.max(X(x0), xx - 8), Y(t.h0 - 0.35) + 3 + (k % 2) * 6); ctx.lineTo(Math.min(X(x1), xx + 8), Y(t.h0 - 0.35) + 3 + (k % 2) * 6); ctx.stroke();
      }
      if (ter === 'marais') {
        ctx.fillStyle = '#5c9a4a';
        for (let k = 0; k < t.L; k++) { ctx.beginPath(); ctx.ellipse(X(x0 + 0.7 + k * 0.9), Y(t.h0 - 0.35), cam.U * 0.18, cam.U * 0.05, 0, 0, Math.PI * 2); ctx.fill(); }
      }
      if (ter === 'glacier') {
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        for (let k = 0; k < t.L; k++) ctx.fillRect(X(x0 + 0.6 + k * 1.1), Y(t.h0 - 0.35) - 2, cam.U * 0.3, 5);
      }
      continue;
    }
    // Sol plein
    ctx.fillStyle = c.sol;
    ctx.beginPath(); ctx.moveTo(X(x0), H);
    const pas = Math.max(0.05, 6 / cam.U);
    for (let x = x0; x <= x1 + 0.001; x += pas) ctx.lineTo(X(x), Y(hSol(T, Math.min(x, x1 - 0.0001))));
    ctx.lineTo(X(x1), Y(hSol(T, x1 - 0.0001))); ctx.lineTo(X(x1), H); ctx.closePath(); ctx.fill();
    // Bordure d'herbe ou de neige
    ctx.strokeStyle = c.bord; ctx.lineWidth = Math.max(2, cam.U * 0.08);
    ctx.beginPath();
    for (let x = x0; x <= x1 + 0.001; x += pas) { const y = Y(hSol(T, Math.min(x, x1 - 0.0001))); if (x === x0) ctx.moveTo(X(x), y); else ctx.lineTo(X(x), y); }
    ctx.stroke();
    // Couche profonde
    ctx.fillStyle = c.sol2;
    ctx.beginPath(); ctx.moveTo(X(x0), H);
    for (let x = x0; x <= x1 + 0.001; x += pas) ctx.lineTo(X(x), Y(hSol(T, Math.min(x, x1 - 0.0001)) - 0.9));
    ctx.lineTo(X(x1), Y(hSol(T, x1 - 0.0001) - 0.9)); ctx.lineTo(X(x1), H); ctx.closePath(); ctx.fill();
    if (t.type === 'glace') {
      ctx.fillStyle = 'rgba(190,235,255,.85)';
      ctx.beginPath(); ctx.moveTo(X(x0), Y(t.h0));
      for (let x = x0; x <= x1 + 0.001; x += pas) ctx.lineTo(X(x), Y(hSol(T, Math.min(x, x1 - 0.0001)) + 0.08));
      for (let x = x1; x >= x0 - 0.001; x -= pas) ctx.lineTo(X(x), Y(hSol(T, Math.max(x0, Math.min(x, x1 - 0.0001))) - 0.3));
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
      for (let k = 0; k < t.L * 1.5; k++) { const xx = x0 + 0.3 + k * 0.6; const y = Y(hSol(T, xx) - 0.12); ctx.beginPath(); ctx.moveTo(X(xx), y); ctx.lineTo(X(xx) + cam.U * 0.2, y - cam.U * 0.08); ctx.stroke(); }
    }
    if (t.type === 'boue') {
      ctx.fillStyle = '#6b4a2b';
      ctx.fillRect(X(x0), Y(t.h0 + 0.06), X(x1) - X(x0), cam.U * 0.32);
      ctx.fillStyle = 'rgba(255,255,255,.25)';
      for (let k = 0; k < t.L * 2; k++) { const r = (cam.U * 0.06) * (1 + Math.sin(temps * 3 + k)); ctx.beginPath(); ctx.arc(X(x0 + 0.25 + k * 0.5), Y(t.h0) + cam.U * 0.08, Math.max(0.5, r), 0, Math.PI * 2); ctx.fill(); }
    }
    if (t.type === 'tunnel') {
      const plafond = t.h0 + t.hmax * CELL_U + 0.28;
      ctx.fillStyle = c.sol2;
      ctx.fillRect(X(x0), 0, X(x1) - X(x0), Y(plafond));
      ctx.fillStyle = c.sol;
      ctx.fillRect(X(x0) - 4, Y(plafond) - cam.U * 0.18, X(x1) - X(x0) + 8, cam.U * 0.18);
      ctx.fillStyle = ter === 'glacier' ? '#dff4ff' : c.sol2;
      for (let k = 0; k < t.L * 3; k++) { const xx = X(x0 + 0.15 + k * 0.33); ctx.beginPath(); ctx.moveTo(xx - cam.U * 0.07, Y(plafond)); ctx.lineTo(xx, Y(plafond) + cam.U * (0.12 + 0.1 * hasard(k))); ctx.lineTo(xx + cam.U * 0.07, Y(plafond)); ctx.fill(); }
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(X(x0), Y(plafond), X(x1) - X(x0), Y(t.h0) - Y(plafond));
    }
    if (t.type === 'face') {
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
      for (let k = 0; k < t.L * 2; k++) {
        const xx = X(x1 - ((temps * 2.5 + k * 0.7) % t.L));
        const yy = Y(t.h0 + 0.4 + 0.5 * hasard(k));
        ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx + cam.U * 0.6, yy); ctx.stroke();
        ctx.beginPath(); ctx.arc(xx, yy - 4, 4, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
      }
    }
    if (t.type === 'marche') {
      ctx.fillStyle = c.sol2; ctx.fillRect(X(t.x + 0.3) - 2, Y(t.h1), 4, Y(t.h0) - Y(t.h1));
    }
    // Décor posé sur le sol plat
    if (t.type === 'plat' && cam.U > 25) {
      for (let k = 0; k < t.L; k += 2.3) {
        const xx = x0 + 0.6 + k + hasard(x0 * 7 + k) * 0.8;
        if (xx > x1 - 0.3 || xx < 3.2) continue;
        dessinerObjetDecor(ctx, ter, X(xx), Y(t.h0), cam.U, hasard(xx * 3), temps);
      }
    }
  }
  // Drapeau d'arrivée
  const hf = hSol(T, T.fin);
  const fx = X(T.fin), fy = Y(hf);
  ctx.strokeStyle = '#4a4458'; ctx.lineWidth = Math.max(2, cam.U * 0.07);
  ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - cam.U * 1.8); ctx.stroke();
  const ond = Math.sin(temps * 5) * cam.U * 0.08;
  const cf = cam.U * 0.18;
  for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) {
    ctx.fillStyle = (i + j) % 2 ? '#ffffff' : '#2b2234';
    ctx.fillRect(fx + i * cf, fy - cam.U * 1.8 + j * cf + ond * (i / 4), cf, cf);
  }
  // Porte du hangar au départ
  ctx.fillStyle = '#8e5a30';
  ctx.fillRect(X(-0.6), Y(0) - cam.U * 2, cam.U * 1.1, cam.U * 2);
  ctx.fillStyle = '#b97b46';
  for (let k = 0; k < 4; k++) ctx.fillRect(X(-0.55), Y(0) - cam.U * 2 + k * cam.U * 0.5 + 3, cam.U * 1.0, cam.U * 0.4);
}
function dessinerObjetDecor(ctx, ter, x, y, U, h, temps) {
  ctx.save();
  if (ter === 'desert') {
    ctx.fillStyle = '#4f9a4a';
    rondRect(ctx, x - U * 0.09, y - U * 0.9, U * 0.18, U * 0.9, U * 0.09); ctx.fill();
    rondRect(ctx, x - U * 0.3, y - U * 0.62, U * 0.12, U * 0.32, U * 0.06); ctx.fill();
    ctx.fillRect(x - U * 0.3, y - U * 0.38, U * 0.25, U * 0.09);
    if (h > 0.5) { rondRect(ctx, x + U * 0.18, y - U * 0.72, U * 0.12, U * 0.3, U * 0.06); ctx.fill(); ctx.fillRect(x + U * 0.05, y - U * 0.5, U * 0.2, U * 0.09); }
  } else if (ter === 'glacier') {
    ctx.fillStyle = '#3e7a62';
    for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(x - U * (0.4 - k * 0.08), y - U * (0.15 + k * 0.3)); ctx.lineTo(x, y - U * (0.65 + k * 0.3)); ctx.lineTo(x + U * (0.4 - k * 0.08), y - U * (0.15 + k * 0.3)); ctx.fill(); }
    ctx.fillStyle = '#ffffff';
    for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(x - U * 0.12, y - U * (0.5 + k * 0.3)); ctx.lineTo(x, y - U * (0.65 + k * 0.3)); ctx.lineTo(x + U * 0.12, y - U * (0.5 + k * 0.3)); ctx.fill(); }
  } else if (ter === 'marais') {
    ctx.strokeStyle = '#4c7a33'; ctx.lineWidth = Math.max(1.5, U * 0.05);
    for (let k = -2; k <= 2; k++) { const b = Math.sin(temps * 1.5 + k) * U * 0.05; ctx.beginPath(); ctx.moveTo(x + k * U * 0.08, y); ctx.quadraticCurveTo(x + k * U * 0.1, y - U * 0.4, x + k * U * 0.12 + b, y - U * (0.7 + 0.1 * (k % 2))); ctx.stroke(); }
    ctx.fillStyle = '#7b4a26'; rondRect(ctx, x + U * 0.08, y - U * 0.75, U * 0.08, U * 0.22, U * 0.04); ctx.fill();
    if (h > 0.6) { ctx.fillStyle = 'rgba(255,240,120,.9)'; ctx.beginPath(); ctx.arc(x + Math.sin(temps * 2 + h * 9) * U * 0.4, y - U * (1 + 0.2 * Math.sin(temps * 3)), U * 0.05, 0, Math.PI * 2); ctx.fill(); }
  } else {
    ctx.fillStyle = '#8f8a83'; ctx.beginPath(); ctx.ellipse(x, y - U * 0.12, U * 0.3, U * 0.16, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = h > 0.5 ? '#ffd23f' : '#ff7aa8';
    for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(x + U * (0.35 + k * 0.12), y - U * (0.12 + 0.05 * k), U * 0.05, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.restore();
}

// Particules (poussière, éclaboussures, bulles, confettis) en coordonnées du monde
let particules = [];
function particule(x, y, vx, vy, vie, coul, taille, grav = -6) { particules.push({ x, y, vx, vy, vie, vie0: vie, coul, taille, grav }); }
function majParticules(dt) {
  for (const p of particules) { p.vie -= dt; p.vx *= 0.98; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  particules = particules.filter((p) => p.vie > 0);
}
function dessinerParticules(ctx, cam) {
  for (const p of particules) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.vie / p.vie0 * 1.5));
    ctx.fillStyle = p.coul;
    const s = p.taille * cam.U;
    ctx.fillRect((p.x - cam.x) * cam.U - s / 2, cam.y0 - p.y * cam.U - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}
function confettis(x, y, n) {
  const couls = ['#e5483b', '#f2c230', '#3b7be5', '#3fae5a', '#ef6fb0', '#8d5ad8'];
  for (let i = 0; i < n; i++) particule(x, y, (Math.random() - 0.5) * 6, 3 + Math.random() * 5, 1.6 + Math.random(), couls[i % couls.length], 0.1, -7);
}

const DPR = () => Math.min(2, window.devicePixelRatio || 1);
function preparerCanvas(cv, w, h) {
  const r = DPR();
  if (cv.width !== Math.round(w * r) || cv.height !== Math.round(h * r)) { cv.width = Math.round(w * r); cv.height = Math.round(h * r); }
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(r, 0, 0, r, 0, 0);
  return ctx;
}
let tailleCase = 56;
function miseEnPage() {
  if (ecran !== 'jeu') return;
  const zone = $('zone-scene');
  preparerCanvas($('c-scene'), zone.clientWidth, zone.clientHeight);
  if (mode === 'atelier') {
    const at = $('atelier');
    const w = at.clientWidth - 16 - 60;
    const h = at.clientHeight - 8;
    tailleCase = Math.max(30, Math.floor(Math.min(w / COLS, h / LIGNES, 70)));
    preparerCanvas($('c-grille'), tailleCase * COLS, tailleCase * LIGNES);
    dessinerGrille();
  }
  dessinerScene(performance.now() / 1000);
}
window.addEventListener('resize', () => { miseEnPage(); if (ecran === 'titre') dessinerTitre(performance.now() / 1000); if (!$('tuto').classList.contains('cache')) preparerTuto(); });

function dessinerGarage(temps) {
  document.querySelectorAll('#garage-grille canvas').forEach((cv) => {
    const b = cv._bolide; if (!b) return;
    const w = cv.clientWidth || 160, h = cv.clientHeight || 110;
    const ctx = preparerCanvas(cv, w, h);
    ctx.fillStyle = '#e9dcc4'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#b97b46'; ctx.fillRect(0, h * 0.8, w, h * 0.2);
    ctx.fillStyle = 'rgba(0,0,0,.08)'; for (let x = 0; x < w; x += 22) ctx.fillRect(x, 0, 2, h * 0.8);
    const a = analyser(b.g);
    const s = Math.min((w * 0.8) / Math.max(1, a.longueur), (h * 0.62) / Math.max(1, a.hauteur + 0.4));
    const dep = cv.dataset.saut ? (temps * 1000 - Number(cv.dataset.saut)) / 1000 : 9;
    const bond = dep < 0.6 ? Math.sin(dep / 0.6 * Math.PI) * h * 0.12 : 0;
    dessinerBolide(ctx, b.g, w / 2, h * 0.8 - bond, s, 0, { a, couleur: couleurPeinture(b.p), spin: temps * 12, ombre: true });
  });
}

function restant(type) { return (niv().stock[type] || 0) - analyse.compte[type]; }
function construireReserve() {
  const res = $('reserve');
  res.textContent = '';
  const types = ORDRE_PIECES.filter((t) => niv().stock[t] != null);
  const nouveaux = niv().nouveau || [];
  types.forEach((type, k) => {
    const b = document.createElement('button');
    b.className = 'piece-btn';
    b.dataset.type = type;
    if (nouveaux.includes(type)) b.classList.add('nouveau');
    const cv = document.createElement('canvas'); b.appendChild(cv);
    const nb = document.createElement('span'); nb.className = 'nb'; b.appendChild(nb);
    const ctx = preparerCanvas(cv, 38, 38);
    ctx.clearRect(0, 0, 38, 38);
    dessinerPiece(ctx, type, type === 'grosse' ? 7 : 3, type === 'grosse' ? 7 : 3, type === 'grosse' ? 24 : 32, { couleur: couleurPeinture(prog.peinture) });
    b.addEventListener('pointerdown', (e) => debutGlisser(e, type, null));
    b.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); choisir(type); } });
    b.title = T('piece.' + type);
    b.dataset.touche = String(k + 1);
    res.appendChild(b);
  });
  majReserve();
}
function majReserve() {
  document.querySelectorAll('.piece-btn').forEach((b) => {
    const type = b.dataset.type;
    const n = restant(type);
    b.querySelector('.nb').textContent = T('reste', { n });
    b.classList.toggle('epuise', n <= 0);
    b.classList.toggle('choisi', choix === type);
    b.setAttribute('aria-label', T('pieceAria', { piece: T('piece.' + type), n }));
  });
}
function choisir(type) {
  audio();
  choix = choix === type ? null : type;
  son('clic');
  majReserve();
  if (choix) afficherMsg(T('info.' + type), '');
  else majMessage();
}
function afficherMsg(texte, classe, secouer) {
  const m = $('msg');
  m.textContent = texte;
  m.className = classe || '';
  if (secouer) { m.classList.remove('secoue'); void m.offsetWidth; m.classList.add('secoue'); }
}
// Message de l'atelier : problème du plan, ou raison du dernier essai, ou but du niveau
function majMessage() {
  const a = analyse, nv = niv();
  if (a.detachees.length) return afficherMsg(T('raison.detachees'), 'alerte');
  if (a.n && a.sansCaisse) return afficherMsg(T('raison.sansCaisse'), 'alerte');
  if (nv.budget && a.prix > nv.budget) return afficherMsg(T('raison.budget', { prix: a.prix, budget: nv.budget }), 'alerte');
  if (a.helicesBloquees.length) return afficherMsg(T('alerte.helice'), 'alerte');
  if (a.inutiles.length) return afficherMsg(T('alerte.inutile'), 'alerte');
  if (dernierEchec) return afficherMsg(texteRaison(dernierEchec.raison, dernierEchec.vars), 'alerte');
  if (!a.n) return afficherMsg(T('but.vide'), '');
  afficherMsg(T('but.pret'), 'bon');
}
function texteRaison(raison, vars) { return T('raison.' + raison, vars || {}); }

function majAtelier() {
  analyse = analyser(grille);
  majReserve();
  majStats();
  majMessage();
  dessinerGrille();
  dessinerScene(performance.now() / 1000);

function majStats() {
  const a = analyse, nv = niv();

// ---------- Dessin de la grille ----------
let survol = null; // case survolée pendant un glisser
function dessinerGrille() {
  if (ecran !== 'jeu' || mode !== 'atelier') return;
  const cv = $('c-grille');
  const s = tailleCase, W = s * COLS, H = s * LIGNES;
  const ctx = cv.getContext('2d');
  ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#3d3352'; rondRect(ctx, 0, 0, W, H, 14); ctx.fill();
  for (let r = 0; r < LIGNES; r++) for (let c = 0; c < COLS; c++) {
    ctx.fillStyle = (r + c) % 2 ? '#4a3f62' : '#463b5d';
    rondRect(ctx, c * s + 2, r * s + 2, s - 4, s - 4, 8); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.arc(c * s + s / 2, r * s + s / 2, 2, 0, Math.PI * 2); ctx.fill();
  }
  const a = analyse;
  // Ligne du sol sous le bolide (ligne la plus basse)
  const bas = a.n ? a.bas : LIGNES - 1;
  const ys = (bas + 1) * s - 3;

  ctx.beginPath(); ctx.moveTo(6, ys); ctx.lineTo(W - 6, ys); ctx.stroke(); ctx.setLineDash([]);
  // Liens entre pièces voisines
  ctx.fillStyle = '#9aa1b3';
  for (const p of a.pieces) for (const [dr, dc] of [[0, 1], [1, 0]]) {
    if (!cel(grille, p.r + dr, p.c + dc)) continue;
    ctx.fillRect((p.c + 0.5 + dc * 0.5) * s - 4, (p.r + 0.5 + dr * 0.5) * s - 4, 8, 8);
  }
  const t = performance.now() / 1000;
  const coul = couleurPeinture(prog.peinture);
  for (const p of a.pieces) {
    if (drag && drag.bouge && drag.depuis && drag.depuis.r === p.r && drag.depuis.c === p.c) continue;
    const pb = a.detachees.includes(p) || a.helicesBloquees.includes(p);
    const inutile = a.inutiles.includes(p);
    ctx.save();
    if (p.t === 'grosse') { ctx.beginPath(); ctx.rect(p.c * s - s * 0.2, p.r * s - s * 0.2, s * 1.4, s * 1.4); ctx.clip(); }
    dessinerPiece(ctx, p.t, p.c * s, p.r * s, s, { couleur: coul, spin: t * 3, alpha: inutile ? 0.5 : 1 });
    ctx.restore();
    if (pb) {
      ctx.strokeStyle = '#ff3b2f'; ctx.lineWidth = 3;

      if (a.helicesBloquees.includes(p)) {
        ctx.beginPath(); ctx.moveTo(p.c * s + 4, p.r * s + s * 0.3); ctx.lineTo(p.c * s + s * 0.3, p.r * s + s * 0.7);
        ctx.moveTo(p.c * s + s * 0.3, p.r * s + s * 0.3); ctx.lineTo(p.c * s + 4, p.r * s + s * 0.7); ctx.stroke();
      }
    }
    if (inutile) {
      ctx.strokeStyle = '#ffb02e'; ctx.lineWidth = 3; ctx.setLineDash([5, 4]);
      rondRect(ctx, p.c * s + 3, p.r * s + 3, s - 6, s - 6, 8); ctx.stroke(); ctx.setLineDash([]);
    }

  if (a.n && a.roues + a.grosses > 0) {

    ctx.fillStyle = a.equilibre ? '#4ade80' : '#ff3b2f';

}

// ---------- Modifier le plan ----------
function memoriser() { historique.push(grille.slice()); if (historique.length > 60) historique.shift(); }
function poser(r, c, type) {
  const ancien = cel(grille, r, c);
  if (ancien === type) return false;
  if (restant(type) <= 0) { son('refus'); afficherMsg(T('plusDePiece', { piece: T('piece.' + type) }), 'alerte', true); return false; }
  memoriser();
  grille[r * COLS + c] = type;
  dernierEchec = null;
  son('pose');
  majAtelier();
  etincelles(r, c);
  return true;
}
function retirer(r, c) {
  if (!cel(grille, r, c)) return;
  memoriser();
  grille[r * COLS + c] = null;
  dernierEchec = null;
  son('retire');
  majAtelier();
}
function deplacer(de, vers) {
  if (de.r === vers.r && de.c === vers.c) { dessinerGrille(); return; }
  memoriser();
  const a = cel(grille, de.r, de.c), b = cel(grille, vers.r, vers.c);
  grille[vers.r * COLS + vers.c] = a;
  grille[de.r * COLS + de.c] = b;
  dernierEchec = null;
  son('pose');
  majAtelier();
}
function annuler() {

  grille = historique.pop();
  dernierEchec = null;
  son('retire');
  majAtelier();
}
function vider() {

// Petit éclat quand une pièce est posée
let eclats = [];
function etincelles(r, c) {
  for (let k = 0; k < 8; k++) eclats.push({ x: (c + 0.5) * tailleCase, y: (r + 0.5) * tailleCase, vx: Math.cos(k * 0.785) * 90, vy: Math.sin(k * 0.785) * 90, vie: 0.35 });
}

// ---------- Glisser-déposer au doigt et à la souris ----------
let drag = null;
let fantome = null;
function caseSous(x, y) {
  const rc = $('c-grille').getBoundingClientRect();
  const c = Math.floor((x - rc.left) / tailleCase), r = Math.floor((y - rc.top) / tailleCase);
  return (r >= 0 && c >= 0 && r < LIGNES && c < COLS) ? { r, c } : null;
}
function debutGlisser(e, type, depuis) {
  if (mode !== 'atelier' || enPause) return;
  audio();
  e.preventDefault();
  cacherTuto();
  drag = { type, depuis, x0: e.clientX, y0: e.clientY, bouge: false, id: e.pointerId };
}
function bougerGlisser(e) {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.bouge && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) {
    drag.bouge = true;
    fantome = document.createElement('canvas');
    fantome.style.cssText = 'position:fixed;pointer-events:none;z-index:30;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))';
    const s = tailleCase;
    const ctx = preparerCanvas(fantome, s * 1.3, s * 1.3);
    dessinerPiece(ctx, drag.type, s * 0.15, s * 0.15, s, { couleur: couleurPeinture(prog.peinture) });
    document.body.appendChild(fantome);
    son('clic');
  }
  if (drag.bouge) {
    const s = tailleCase;
    fantome.style.left = (e.clientX - s * 0.65) + 'px';
    fantome.style.top = (e.clientY - s * 0.85) + 'px';
    const v = caseSous(e.clientX, e.clientY - s * 0.2);
    if (JSON.stringify(v) !== JSON.stringify(survol)) { survol = v; dessinerGrille(); }
  }
}
function finGlisser(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag;
  drag = null;
  if (fantome) { fantome.remove(); fantome = null; }
  const cible = d.bouge ? caseSous(e.clientX, e.clientY - tailleCase * 0.2) : null;
  survol = null;
  if (!d.bouge) {
    // Simple toucher
    if (!d.depuis) choisir(d.type);
    else toucherCase(d.depuis.r, d.depuis.c);
    dessinerGrille();
    return;
  }
  if (cible) {
    if (d.depuis) deplacer(d.depuis, cible);
    else poser(cible.r, cible.c, d.type);   // remplace la pièce qui s'y trouvait
  } else if (d.depuis) retirer(d.depuis.r, d.depuis.c);

}
function toucherCase(r, c) {
  curseur = { r, c };
  const ici = cel(grille, r, c);
  if (choix && ici !== choix) poser(r, c, choix);   // pose, ou remplace la pièce qui s'y trouvait
  else if (ici) retirer(r, c);

}
$('c-grille').addEventListener('pointerdown', (e) => {
  if (mode !== 'atelier' || enPause) return;
  const v = caseSous(e.clientX, e.clientY);
  if (!v) return;
  const ici = cel(grille, v.r, v.c);
  if (ici) debutGlisser(e, ici, v);
  else { audio(); e.preventDefault(); cacherTuto(); drag = { type: null, depuis: null, vide: v, x0: e.clientX, y0: e.clientY, bouge: false, id: e.pointerId }; }
});
window.addEventListener('pointermove', (e) => { if (drag && drag.type) bougerGlisser(e); });
window.addEventListener('pointerup', (e) => {
  if (drag && !drag.type) { const v = drag.vide; drag = null; toucherCase(v.r, v.c); return; }
  finGlisser(e);
});
window.addEventListener('pointercancel', () => { drag = null; survol = null; if (fantome) { fantome.remove(); fantome = null; } dessinerGrille(); });
$('c-grille').addEventListener('focus', () => dessinerGrille());
$('c-grille').addEventListener('blur', () => dessinerGrille());

// ==========================================================================
// Scène : carte du parcours (atelier) ou essai en cours
// ==========================================================================
let camEssai = null;
function camCarte(T, W, H) {
  let hmin = 0, hmax = 0;
  for (const t of T.troncons) { hmin = Math.min(hmin, t.h0, t.h1); hmax = Math.max(hmax, t.h0, t.h1); }
  const U = Math.min(W / (T.longueur + 1.2), (H * 0.5) / (hmax - hmin + 2.2));
  return { x: -0.8, U, y0: H * 0.8 + hmin * U };
}
function dessinerScene(temps) {
  if (ecran !== 'jeu') return;
  const cv = $('c-scene');
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  const ctx = cv.getContext('2d');
  ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
  const ter = niv().terrain;
  const T = terrainCourant;
  if (mode === 'atelier') {
    const cam = camCarte(T, W, H);
    dessinerCiel(ctx, W, H, ter, 0, temps);
    dessinerParcours(ctx, T, ter, cam, W, H, temps);
    const s = CELL_U * cam.U;
    if (analyse.n) dessinerBolide(ctx, grille, (1.5 - cam.x) * cam.U, cam.y0, s, 0, { a: analyse, ombre: true });
    if (dernierEchec) {
      const x = (dernierEchec.x - cam.x) * cam.U;
      const h = hVeh(T, dernierEchec.x);
      const y = cam.y0 - h * cam.U - 14;
      const pulse = 1 + 0.15 * Math.sin(temps * 6);
      ctx.strokeStyle = '#ff3b2f'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x - 8 * pulse, y - 8 * pulse); ctx.lineTo(x + 8 * pulse, y + 8 * pulse); ctx.moveTo(x + 8 * pulse, y - 8 * pulse); ctx.lineTo(x - 8 * pulse, y + 8 * pulse); ctx.stroke();
      ctx.lineCap = 'butt';
      if (analyse.n) dessinerBolide(ctx, grille, x, cam.y0 - h * cam.U, s, 0, { a: analyse, alpha: 0.35 });
    }
    return;
  }
  // Essai
  const e = essai;
  if (!e) return;
  const pose = e.pose || { x: 1.5, y: 0, ang: 0 };
  const U = Math.max(28, Math.min(W / 5.6, H / 4.6));
  const cible = { x: pose.x - (W * 0.3) / U, y0: H * 0.7 + pose.y * U };
  if (!camEssai) camEssai = { x: cible.x, U, y0: cible.y0 };
  camEssai.U = U;
  camEssai.x += (cible.x - camEssai.x) * 0.12;
  camEssai.y0 += (cible.y0 - camEssai.y0) * 0.08;
  const cam = { x: camEssai.x + (e.secousse > 0 ? Math.sin(temps * 60) * e.secousse * 0.05 : 0), U, y0: camEssai.y0 };
  dessinerCiel(ctx, W, H, ter, cam.x, temps);
  dessinerParcours(ctx, T, ter, cam, W, H, temps);
  const s = CELL_U * U;
  const rot = pose.x / (CELL_U * 0.42);
  dessinerBolide(ctx, grille, (pose.x - cam.x) * U, cam.y0 - pose.y * U, s, pose.ang, {
    a: e.res.a, rot, spin: temps * (e.res.a.helices ? 30 : 0), comp: pose.comp || 0, t: temps, vol: pose.vol, ombre: pose.auSol
  });

}

// ---------- Position du bolide pendant l'essai ----------
function calculPose(T, m, p, debut, temps) {
  const lerp = (a, b, k) => a + (b - a) * k;
  const x = lerp(m.x0, m.x1, p);
  switch (m.m) {
    case 'sol': return { x, y: hVeh(T, x), ang: pente(T, x), auSol: true };
    case 'recule': { const k = Math.sin(p * Math.PI / 2); const xx = lerp(m.x0, m.x1, k); return { x: xx, y: hVeh(T, xx), ang: pente(T, xx), auSol: true }; }
    case 'saut': { const y0 = debut.y, y1 = m.rate ? y0 : hVeh(T, m.x1); return { x, y: lerp(y0, y1, p) + m.haut * 4 * p * (1 - p), ang: (p - 0.5) * -0.35, comp: p < 0.12 ? 1 - p / 0.12 : 0 }; }
    case 'bond': { const y0 = debut.y, y1 = m.rate ? y0 : hVeh(T, m.x1); return { x, y: lerp(y0, y1, p) + m.haut * 4 * p * (1 - p), ang: 0, comp: p < 0.15 ? 1 - p / 0.15 : 0 }; }
    case 'vol': { const y0 = debut.y, y1 = m.rate ? y0 - 0.4 : hVeh(T, m.x1); return { x, y: lerp(y0, y1, p) + m.haut * Math.sin(p * Math.PI), ang: 0.06 * Math.sin(temps * 3), vol: true }; }
    case 'chute': return { x: m.x0 + 0.25 * p, y: debut.y - 4.5 * p * p, ang: -0.9 * p };
    case 'coule': return { x: m.x0, y: debut.y - 1.6 * p, ang: 0.3 * p };
    case 'nage': return { x, y: hVeh(T, x) + 0.04 * Math.sin(temps * 6), ang: 0.05 * Math.sin(temps * 4) };
    case 'derive': return { x: m.x0 - 0.25 * Math.sin(p * Math.PI / 2), y: hVeh(T, m.x0) + 0.05 * Math.sin(temps * 5), ang: 0.08 * Math.sin(temps * 3) };
    case 'cale': return { x: m.x0 + 0.02 * Math.sin(temps * 50), y: hVeh(T, m.x0) - (m.boue ? 0.18 * p : 0), ang: 0, auSol: true };
    case 'bascule': return { x: m.x0 + m.sens * 0.3 * p, y: hVeh(T, m.x0) + 0.25 * Math.sin(p * Math.PI) - 0.1 * p, ang: -m.sens * 1.45 * p * p };
    case 'bonk': { const k = Math.sin(p * Math.PI / 2); return { x: lerp(m.x0, m.x1, k), y: hVeh(T, m.x0) + 0.15 * Math.sin(p * Math.PI), ang: 0.25 * Math.sin(p * Math.PI) }; }
    default: return { x: m.x0, y: hVeh(T, m.x0), ang: 0, auSol: true };
  }
}
function lancerEssai() {
  if (mode !== 'atelier' || enPause) return;
  audio();
  cacherTuto();
  const nv = niv();
  analyse = analyser(grille);
  const pb = problemeMontage(analyse, nv);
  if (pb) {
    son('refus');
    afficherMsg(texteRaison(pb, { prix: analyse.prix, budget: nv.budget }), 'alerte', true);
    return;
  }
  const res = simuler(grille, nv);
  const debuts = [];
  let acc = 0, prec = { x: 1.5, y: 0 };
  for (const m of res.moves) { debuts.push({ t: acc, pose: prec }); prec = calculPose(terrainCourant, m, 1, prec, 0); acc += m.d; }
  essai = { res, t: 0, total: acc, idxMove: -1, debuts, fini: false, secousse: 0, pose: { x: 1.5, y: 0, ang: 0 } };
  camEssai = null;
  particules = [];
  vitesse = 1; $('b-vite').classList.remove('actif');
  mode = 'essai';
  $('ecran-jeu').classList.add('essai');
  miseEnPage();
  klaxon(prog.klaxon);
  son('depart');
  moteurDemarrer();
  afficherMsg(T('essaiEnCours'), '');
}
function arreterEssai() {
  if (mode !== 'essai') return;
  moteurArreter();
  mode = 'atelier'; essai = null; particules = [];
  $('ecran-jeu').classList.remove('essai');
  requestAnimationFrame(() => { miseEnPage(); majAtelier(); });
}
// Évènements au début de chaque mouvement : sons et particules
function debutMouvement(m, i) {
  const e = essai;
  const prec = i > 0 ? e.res.moves[i - 1] : null;
  if (prec && ['saut', 'bond', 'vol'].includes(prec.m) && !prec.rate) {
    son('atterrit'); e.secousse = 0.6;
    for (let k = 0; k < 10; k++) particule(m.x0 + (Math.random() - 0.5) * 0.6, hVeh(terrainCourant, m.x0), (Math.random() - 0.5) * 2, Math.random() * 1.5, 0.6, 'rgba(160,130,90,.7)', 0.08);
  }
  const h = hVeh(terrainCourant, m.x0);
  switch (m.m) {
    case 'saut': case 'bond': son('saut'); break;
    case 'vol': son('vent'); break;
    case 'chute': son('chute'); break;
    case 'coule': son('plouf'); son('bulles'); for (let k = 0; k < 14; k++) particule(m.x0 + (Math.random() - 0.5), h, (Math.random() - 0.5) * 2, 2 + Math.random() * 3, 0.8, 'rgba(200,235,255,.9)', 0.08); break;
    case 'nage': if (!prec || prec.m !== 'nage') { son('plouf'); for (let k = 0; k < 14; k++) particule(m.x0 + (Math.random() - 0.5) * 0.5, h, (Math.random() - 0.3) * 2, 2 + Math.random() * 3, 0.8, 'rgba(200,235,255,.9)', 0.08); } break;
    case 'derive': son('bulles'); break;
    case 'bonk': son('bonk'); e.secousse = 1; break;
    case 'bascule': son('bascule'); break;
    case 'cale': case 'recule': son('patine'); for (let k = 0; k < 12; k++) particule(m.x0 - 0.2, h + 0.1, -1 - Math.random() * 2, Math.random() * 2, 0.7, m.boue ? 'rgba(107,74,43,.85)' : 'rgba(200,190,170,.7)', 0.09); break;
    case 'arrivee': son('arrivee'); klaxon(prog.klaxon); confettis(terrainCourant.fin, hSol(terrainCourant, terrainCourant.fin) + 1.5, 70); break;

}
function majEssai(dt, temps) {
  const e = essai;

  e.pose = calculPose(terrainCourant, m, p, e.debuts[i].pose, temps);
  // Poussière derrière les roues
  if (e.pose.auSol && m.m === 'sol' && Math.random() < 0.5) particule(e.pose.x - 0.5, e.pose.y + 0.05, -0.8, 0.5, 0.5, 'rgba(190,170,140,.5)', 0.07, -1);
  if (m.m === 'nage' && Math.random() < 0.4) particule(e.pose.x - 0.6, e.pose.y + 0.1, -1.2, 0.8, 0.5, 'rgba(255,255,255,.8)', 0.06);
  // Moteur : plus aigu quand ça roule vite
  const v = m.d > 0 ? Math.abs(m.x1 - m.x0) / m.d : 0;
  moteurRegler(55 + v * 28, ['sol', 'nage'].includes(m.m) ? 0.06 : 0.02);
  majParticules(dt * vitesse);
  $('chrono').textContent = T('secondes', { n: unDec(Math.min(e.t, e.res.ok ? e.res.temps : e.t)) });
  if (e.t >= e.total + 0.9) { e.fini = true; moteurArreter(); finEssai(e.res); }
}

  courant: { piece: 'helice', cible: [2, 0], plan: ['......', '......', 'H.BB..', 'HoCo..'], parcours: [['plat', 1.5], ['riviere', 3, 2], ['plat', 2]] },

};
const LETTRES = { C: 'caisse', o: 'roue', O: 'grosse', S: 'ressort', H: 'helice', A: 'aile', B: 'bouee' };
function planDe(lignes) { const g = grilleVide(); lignes.forEach((l, r) => [...l].forEach((ch, c) => { if (LETTRES[ch]) g[r * COLS + c] = LETTRES[ch]; })); return g; }
let intro = null;
function montrerIntro(cles) {
  const cle = cles[0];
  const d = DEMOS[cle];
  const g = planDe(d.plan);
  const nvDemo = { parcours: d.parcours, obj: [99, 99], stock: {} };
  const T2 = construireTerrain(nvDemo);
  const res = simuler(g, nvDemo);
  const debuts = []; let acc = 0, prec = { x: 1.5, y: 0 };
  for (const m of res.moves) { debuts.push({ t: acc, pose: prec }); prec = calculPose(T2, m, 1, prec, 0); acc += m.d; }
  intro = { cles, cle, g, T: T2, res, debuts, total: acc, t0: performance.now() / 1000 };
  $('intro-titre').textContent = T('intro.' + cle + '.titre');

function fermerIntro() {

  if (!prog.vus.includes(intro.cle)) prog.vus.push(intro.cle);
