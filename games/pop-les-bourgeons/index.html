<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });

  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).

    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');

      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    bouton.className = 'jel-langue-bouton';

    bouton.setAttribute('aria-expanded', 'false');

    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    menu.className = 'jel-langue-menu';
    menu.hidden = true;

      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;

      if (isole && !coin && hote) {

    });

    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };

      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;

      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);

  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);

      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });

      }
    };

    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {

    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];

    tout.date = Date.now();

    try { texte = JSON.stringify(tout); } catch (e) { return false; }

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },

  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');

    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;

      b.classList.remove('armer');

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)

  //                prochaine écriture du jeu)

    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
/*LOGIQUE-DEBUT*/
// ===== Logique pure du jardin (sans dessin ni son) : utilisée par la partie,
// les démonstrations et l'indice (solveur).
const POP = (function () {
  const VEC = [[0, -1], [1, 0], [0, 1], [-1, 0]];        // 0 haut, 1 droite, 2 bas, 3 gauche
  const CROIX = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const DIAG = [[1, -1], [1, 1], [-1, 1], [-1, -1]];
  const PORTEE = 2;     // cases parcourues par une graine
  const GLISSE = 2;     // cases de plus après une flaque
  const MAX_TICKS = 400;
  const CODES_ESC = { '^': 0, '>': 1, 'v': 2, '<': 3 };
  const CODES_TOUR = { N: 0, E: 1, S: 2, W: 3 };

  // Plan (lignes de caractères) -> état du jardin
  //  . herbe   o bourgeon (croix)   x bourgeon rayé (diagonale)   O / X gros bourgeons
  //  # pierre  ~ flaque   ^ > v < escargot (direction)   N E S W tournesol (direction)
  function creer(lignes) {
    const h = lignes.length, w = lignes[0].length;
    const sol = [], obj = [];
    for (let y = 0; y < h; y++) {
      sol.push([]); obj.push([]);
      for (let x = 0; x < w; x++) {
        const c = lignes[y][x];
        sol[y].push(c === '~' ? 1 : 0);
        let o = null;
        if (c === 'o') o = { k: 'b', forme: 'croix', hp: 1, max: 1 };
        else if (c === 'x') o = { k: 'b', forme: 'diag', hp: 1, max: 1 };
        else if (c === 'O') o = { k: 'b', forme: 'croix', hp: 2, max: 2 };
        else if (c === 'X') o = { k: 'b', forme: 'diag', hp: 2, max: 2 };
        else if (c === '#') o = { k: 'p' };
        else if (c in CODES_ESC) o = { k: 'e', dir: CODES_ESC[c] };
        else if (c in CODES_TOUR) o = { k: 't', dir: CODES_TOUR[c] };
        obj[y].push(o);
      }
    }
    return { w, h, sol, obj, coups: 0 };
  }

  function cloner(E) {
    return { w: E.w, h: E.h, sol: E.sol, coups: E.coups,
      obj: E.obj.map((l) => l.map((o) => (o ? Object.assign({}, o) : null))) };
  }

  function restants(E) {
    let n = 0;
    for (let y = 0; y < E.h; y++) for (let x = 0; x < E.w; x++) { const o = E.obj[y][x]; if (o && o.k === 'b') n++; }
    return n;
  }
  function touchable(E, x, y) { const o = E.obj[y] && E.obj[y][x]; return !!(o && o.k === 'b'); }

  // Toucher un bourgeon. Modifie E et renvoie le déroulé, tick par tick :
  // { ticks: [[évènements]], fin: [évènements de fin de tour], chaine, fleurs }
  function toucher(E, x, y) {
    if (!touchable(E, x, y)) return null;
    E.coups++;
    const ticks = [];
    let graines = [];
    let aEclater = [];
    let nid = 0, chaine = 0, fleurs = 0;
    const t0 = [{ type: 'toucher', x, y }];
    const o0 = E.obj[y][x];
    o0.hp--;
    if (o0.hp <= 0) { o0.marque = true; aEclater.push({ x, y, gen: 0 }); }
    else t0.push({ type: 'coup', x, y, hp: o0.hp });
    ticks.push(t0);
    let n = 0;
    while ((aEclater.length || graines.length) && n < MAX_TICKS) {
      n++;
      const ev = [];
      // 1. éclatements : le bourgeon devient fleur et lance ses graines
      for (const b of aEclater) {
        const o = E.obj[b.y][b.x];
        E.obj[b.y][b.x] = { k: 'f', forme: o.forme };
        fleurs++;
        if (b.gen > chaine) chaine = b.gen;
        ev.push({ type: 'eclat', x: b.x, y: b.y, forme: o.forme, gen: b.gen });
        for (const d of (o.forme === 'diag' ? DIAG : CROIX)) {
          graines.push({ id: nid++, x: b.x, y: b.y, dx: d[0], dy: d[1], reste: PORTEE, gen: b.gen, vus: '' });
        }
      }
      aEclater = [];
      // 2. chaque graine avance d'une case
      const vivantes = [], coups = [];
      for (const g of graines) {
        const nx = g.x + g.dx, ny = g.y + g.dy;
        const mv = { type: 'g', id: g.id, x0: g.x, y0: g.y, x1: nx, y1: ny, fin: null };
        ev.push(mv);
        if (nx < 0 || ny < 0 || nx >= E.w || ny >= E.h) { mv.fin = 'sort'; continue; }
        const c = E.obj[ny][nx];
        if (c && c.k === 'p') { mv.fin = 'pierre'; continue; }
        if (c && c.k === 'e') { mv.fin = 'escargot'; continue; }
        if (c && c.k === 'b') { mv.fin = 'bourgeon'; coups.push({ x: nx, y: ny, gen: g.gen + 1 }); continue; }

        if (c && c.k === 't') {
          const cle = nx + ',' + ny + ';';
          if (g.vus.indexOf(cle) >= 0) { mv.fin = 'pose'; continue; }
          g.vus += cle;
          g.dx = VEC[c.dir][0]; g.dy = VEC[c.dir][1]; g.reste = PORTEE;
          mv.fin = 'tournesol';
          vivantes.push(g);
          continue;
        }
        g.reste--;
        if (E.sol[ny][nx] === 1) { g.reste += GLISSE; mv.glisse = true; }
        if (g.reste <= 0) { mv.fin = 'pose'; continue; }
        vivantes.push(g);
      }
      // 3. coups reçus par les bourgeons
      for (const c of coups) {
        const o = E.obj[c.y][c.x];
        if (!o || o.k !== 'b' || o.marque) continue;
        o.hp--;
        if (o.hp <= 0) { o.marque = true; aEclater.push(c); }
        else ev.push({ type: 'coup', x: c.x, y: c.y, hp: o.hp });
      }
      graines = vivantes;
      ticks.push(ev);
    }

    const fin = [];
    const escargots = [], tournesols = [];
    for (let yy = 0; yy < E.h; yy++) for (let xx = 0; xx < E.w; xx++) {
      const o = E.obj[yy][xx];
      if (o && o.k === 'e') escargots.push([xx, yy]);
      if (o && o.k === 't') tournesols.push([xx, yy]);
    }

      const o = E.obj[ey][ex];
      const nx = ex + VEC[o.dir][0], ny = ey + VEC[o.dir][1];
      if (nx >= 0 && ny >= 0 && nx < E.w && ny < E.h && !E.obj[ny][nx]) {
        E.obj[ny][nx] = o; E.obj[ey][ex] = null;
        fin.push({ type: 'escargot', x0: ex, y0: ey, x1: nx, y1: ny, dir: o.dir });

        o.dir = (o.dir + 2) % 4;
        fin.push({ type: 'demitour', x: ex, y: ey, de: ancien, dir: o.dir });
      }
    }
    for (const [tx, ty] of tournesols) {
      const o = E.obj[ty][tx];
      const ancien = o.dir;
      o.dir = (o.dir + 1) % 4;
      fin.push({ type: 'tourne', x: tx, y: ty, de: ancien, dir: o.dir });
    }
    return { ticks, fin, chaine, fleurs };
  }

  // Cases des bourgeons encore fermés
  function bourgeons(E) {
    const l = [];
    for (let y = 0; y < E.h; y++) for (let x = 0; x < E.w; x++) if (touchable(E, x, y)) l.push([x, y]);
    return l;
  }

  // Solveur : plus courte suite de touchers (max touchers au plus), ou null.
  // budget : nombre d'essais au plus (évite de figer un vieux téléphone).
  function resoudre(E, max, budget) {
    let essais = budget || 60000;
    function cherche(S, prof) {
      if (restants(S) === 0) return [];
      if (prof === 0 || essais <= 0) return null;
      for (const [x, y] of bourgeons(S)) {
        if (--essais <= 0) return null;
        const C = cloner(S);
        toucher(C, x, y);
        const r = cherche(C, prof - 1);
        if (r) return [[x, y]].concat(r);
      }
      return null;
    }
    for (let p = 1; p <= max; p++) {
      const r = cherche(E, p);
      if (r) return r;
    }
    return null;
  }

  return { creer, cloner, toucher, restants, touchable, bourgeons, resoudre, VEC, CROIX, DIAG, PORTEE, GLISSE };
})();
/*LOGIQUE-FIN*/

  // ===== HUD =====

    for (let i = 0; i < permis; i++) g.appendChild(goutteSvg(i < reste));
    g.setAttribute('aria-label', t('hud.touchers', { n: reste }));

  // ===== Toucher =====

    const res = POP.toucher(E, x, y);

  function dessinerDemo(maintenant) {
    if (!demo) return;
    const c = $('demo');
    const r = c.getBoundingClientRect();
    if (!r.width) return;
    const d = Math.min(window.devicePixelRatio || 1, 2);
    if (c.width !== Math.round(r.width * d)) { c.width = Math.round(r.width * d); c.height = Math.round(r.height * d); }
    const g = c.getContext('2d');
    g.setTransform(d, 0, 0, d, 0, 0);
    const D = demo.D;
    const lignes = D.plan;
    const w = lignes[0].length, h = lignes.length;
    const s = Math.min((r.width - 20) / w, (r.height - 20) / h, 74);
    const ox = (r.width - w * s) / 2, oy = (r.height - h * s) / 2;
    const C = COINS[D.coin];
    g.fillStyle = C.fond; g.fillRect(0, 0, r.width, r.height);
    arrondi(g, ox - 6, oy - 6, w * s + 12, h * s + 12, 10); g.fillStyle = C.bord; g.fill();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { arrondi(g, ox + x * s + 1, oy + y * s + 1, s - 2, s - 2, s * 0.15); g.fillStyle = C.herbe[(x + y) % 2]; g.fill(); }
    // déroulé : chaque toucher = 900 ms d'attente (main) + chaîne + 700 ms ; puis pause et reprise
    const tps = maintenant - demo.debut;
    const Etat = POP.creer(lignes);
    let tLocal = tps, vue = POP.cloner(Etat), seeds = [], mainCase = null, mainT = 0, eclats = {};
    let finCycle = true;
    for (const [tx, ty] of D.touchers) {
      const res = POP.toucher(Etat, tx, ty);
      const duree = 900 + res.ticks.length * 260 + 700;
      if (tLocal < duree) {
        finCycle = false;
        if (tLocal < 900) { mainCase = [tx, ty]; mainT = tLocal; }
        else {
          const k = Math.floor((tLocal - 900) / 260);
          for (let i = 0; i <= Math.min(k, res.ticks.length - 1); i++) for (const e of res.ticks[i]) {
            if (e.type === 'eclat') { vue.obj[e.y][e.x] = { k: 'f', forme: e.forme }; eclats[e.x + ',' + e.y] = 900 + i * 260; }
            if (e.type === 'coup') vue.obj[e.y][e.x].hp = e.hp;
            if (e.type === 'g' && i === k) seeds.push({ e, k: ((tLocal - 900) % 260) / 260 });
          }
          if (k >= res.ticks.length) { for (const ev of res.fin) { if (ev.type === 'escargot') { const o = vue.obj[ev.y0][ev.x0]; vue.obj[ev.y1][ev.x1] = o; vue.obj[ev.y0][ev.x0] = null; } else { vue.obj[ev.y][ev.x].dir = ev.dir; } } }
        }
        break;
      }
      tLocal -= duree;
      vue = POP.cloner(Etat);
      eclats = {};
    }
    if (finCycle) { if (tLocal > 900) demo.debut = maintenant; }
    const fl = FLEURS[D.coin * 4];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const px = ox + (x + 0.5) * s, py = oy + (y + 0.5) * s;
      if (Etat.sol[y][x]) dessinerFlaque(g, px, py, s, maintenant, D.coin === 4);
      const o = vue.obj[y][x];
      if (!o) continue;
      if (o.k === 'b') dessinerBourgeon(g, px, py, s, o, fl, maintenant, false, 0);
      else if (o.k === 'f') { const a = eclats[x + ',' + y]; const k = a !== undefined ? clamp((tLocal - a) / 300, 0, 1) : 1; dessinerFleur(g, px, py, s * 0.4, fl, easeOutBack(k), maintenant, true); }
      else if (o.k === 'p') dessinerPierre(g, px, py, s, x * 7 + y);
      else if (o.k === 'e') dessinerEscargot(g, px, py, s, angleDir(POP.VEC[o.dir][0], POP.VEC[o.dir][1], false), maintenant, 0);
      else if (o.k === 't') dessinerTournesol(g, px, py, s, angleDir(POP.VEC[o.dir][0], POP.VEC[o.dir][1], false), maintenant, 0);
    }
    for (const sd of seeds) {
      const e = sd.e;
      const px = ox + (lerp(e.x0, e.x1, sd.k) + 0.5) * s, py = oy + (lerp(e.y0, e.y1, sd.k) + 0.5) * s;
      if (e.fin === 'sort' && sd.k > 0.5) continue;
      dessinerGraine(g, px, py, s, Math.atan2(e.y1 - e.y0, e.x1 - e.x0), e.glisse);
    }
    if (mainCase) dessinerMain(g, ox + (mainCase[0] + 0.5) * s, oy + (mainCase[1] + 0.5) * s, s, mainT + 600);
  }

  function majParticules(dt) {

    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie += dt;
      if (p.vie > p.max) { particules.splice(i, 1); continue; }

      if (temps > e.t0 + e.dur) effets.splice(i, 1);

    for (let i = graines.length - 1; i >= 0; i--) if (temps > graines[i].t0 + TICK) graines.splice(i, 1);

  function dessiner() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (AFFICHE) { dessinerAffiche(); return; }
    const jeu = ecran === 'jeu' && E;
    const coin = jeu ? Math.floor(niv / 4) : 0;
    ctx.drawImage(fabriquerDecor(coin, jeu), 0, 0, W, H);
    if (jeu) dessinerJardin();
    else dessinerFondTitre();
    if (coin === 4 || (!jeu && false)) dessinerNeige();
    dessinerPapillons(jeu);
    for (const p of particules) {
      const k = 1 - p.vie / p.max;
      ctx.globalAlpha = Math.min(1, k * 2);
      if (p.type === 'petale') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ellipse(ctx, 0, 0, p.s, p.s * 0.55, 0, p.c); ctx.restore(); }

  function dessinerNeige() {

      const x = ((i * 137.5) % W + Math.sin(temps / 1500 + i) * 20 + W) % W;
      const y = ((i * 91.3) + temps * (0.02 + (i % 5) * 0.006)) % H;
      cercle(ctx, x, y, 1.5 + (i % 3), 'rgba(255,255,255,.85)');
    }
  }
  function papillonsDebloques() { const tot = totalEtoiles(); return PAPILLONS.filter((p) => tot >= p.seuil); }
  function dessinerPapillons(jeu) {
    let liste = papillonsDebloques();
    if (!jeu && !liste.length) liste = [PAPILLONS[0]];
    const fete = anims.fete && temps - anims.fete < 3000;
    liste.forEach((p, i) => {
      const ph = i * 1.7;
      let x = W / 2 + Math.sin(temps / 4200 + ph) * W * 0.42 + Math.sin(temps / 1300 + ph * 2) * 30;
      let y = H * 0.5 + Math.sin(temps / 3100 + ph * 1.3) * H * 0.4;

  }
  function dessinerFondTitre() {

    if (titreFleurs.length < 14 && Math.random() < 0.04) {
      titreFleurs.push({ x: Math.random() * W, y: 60 + Math.random() * (H - 120), t0: temps + 900 + Math.random() * 1500, fl: FLEURS[Math.floor(Math.random() * 20)], s: 26 + Math.random() * 30 });
    }
    for (let i = titreFleurs.length - 1; i >= 0; i--) {
      const f = titreFleurs[i];
      const age = temps - f.t0;
      if (age > 6000) { titreFleurs.splice(i, 1); continue; }
      if (age < 0) dessinerBourgeon(ctx, f.x, f.y, f.s * 1.6, { forme: 'croix', hp: 1, max: 1 }, f.fl, temps, false, age > -300 ? 1 : 0);
      else {
        const k = age > 5400 ? 1 - (age - 5400) / 600 : easeOutBack(clamp(age / 350, 0, 1));
        dessinerFleur(ctx, f.x, f.y, f.s * 0.6, f.fl, k, temps, true);
        if (age < 500) for (let d = 0; d < 4; d++) { const a = d * Math.PI / 2; const r = age / 500 * f.s * 1.6; dessinerGraine(ctx, f.x + Math.cos(a) * r, f.y + Math.sin(a) * r, f.s, a, false); }
      }
    }
  }

  function dessinerJardin() {
    const fl = FLEURS[niv];
    const neige = Math.floor(niv / 4) === 4;
    const s = V.c;
    // sol : flaques
    for (let y = 0; y < E.h; y++) for (let x = 0; x < E.w; x++) {
      if (!E.sol[y][x]) continue;
      const [px, py] = versEcran(x, y);
      dessinerFlaque(ctx, px, py, s, temps, neige);
    }
    // aperçu de la portée (souris ou clavier)
    const vise = clavierActif ? curseur : survol;
    if (vise && peutToucher() && POP.touchable(vis, vise[0], vise[1])) dessinerPortee(vise[0], vise[1]);
    // effets au sol (pousses, ondes, éclaboussures)
    for (const e of effets) {
      if (temps < e.t0) continue;
      const k = (temps - e.t0) / e.dur;
      const [px, py] = versEcran(e.x, e.y);
      if (e.k === 'pousse') { ctx.globalAlpha = Math.max(0, 1 - Math.max(0, k - 0.6) / 0.4); const h = s * 0.18 * easeOut(Math.min(1, k * 3)); ctx.strokeStyle = '#3f8f35'; ctx.lineWidth = Math.max(1.5, s * 0.04); ctx.beginPath(); ctx.moveTo(px, py + s * 0.12); ctx.lineTo(px, py + s * 0.12 - h); ctx.stroke(); ellipse(ctx, px - s * 0.06, py + s * 0.12 - h, s * 0.07, s * 0.035, -0.5, '#5fbf5a'); ellipse(ctx, px + s * 0.06, py + s * 0.12 - h, s * 0.07, s * 0.035, 0.5, '#5fbf5a'); ctx.globalAlpha = 1; }
      else if (e.k === 'onde') { ctx.strokeStyle = 'rgba(255,255,255,' + (1 - k) + ')'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(px, py, s * (0.3 + k * 0.6), 0, Math.PI * 2); ctx.stroke(); }
      else if (e.k === 'plouf') { ctx.strokeStyle = 'rgba(200,240,255,' + (1 - k) + ')'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(px, py, s * (0.15 + k * 0.4), s * (0.1 + k * 0.3), 0, 0, Math.PI * 2); ctx.stroke(); }
      else if (e.k === 'poussiere') { for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; cercle(ctx, px + Math.cos(a) * s * 0.4 * k, py + Math.sin(a) * s * 0.3 * k, s * 0.07 * (1 - k), 'rgba(170,160,140,' + (1 - k) + ')'); } }
    }
    // objets
    const fete = anims.fete ? temps - anims.fete : -1;
    for (let y = 0; y < E.h; y++) for (let x = 0; x < E.w; x++) {
      const o = vis.obj[y][x];
      if (!o) continue;
      let [px, py] = versEcran(x, y);
      const a = anims[x + ',' + y] || {};
      if (o.k === 'b') {
        let agite = 0;
        if (a.coup !== undefined && temps - a.coup < 350) agite = 1 - (temps - a.coup) / 350;
        if (narguer >= 0 && temps - narguer < 1600) agite = 0.8;
        if (lecture && lecture.res && lecture.res.ticks[0] && lecture.res.ticks[0][0].x === x && lecture.res.ticks[0][0].y === y && temps - lecture.debut < 120) agite = 1;
        dessinerBourgeon(ctx, px, py, s, o, fl, temps, V.rot, agite);
      } else if (o.k === 'f') {
        const age = a.eclat !== undefined ? temps - a.eclat : 9999;
        let k = easeOutBack(clamp(age / 340, 0, 1));
        if (age < 120) { const r = age / 120; cercle(ctx, px, py, s * 0.5 * r, 'rgba(255,255,230,' + (0.8 * (1 - r)) + ')'); }
        if (fete >= 0 && fete < 1400) py -= Math.abs(Math.sin(fete / 140 + x + y)) * s * 0.12;
        dessinerFleur(ctx, px, py, s * 0.4, fl, k, temps, true, (x * 13 + y * 7) % 6);
      } else if (o.k === 'p') {
        dessinerPierre(ctx, px, py, s, x * 7 + y * 13 + niv);
      } else if (o.k === 'e') {
        let ang = angleDir(POP.VEC[o.dir][0], POP.VEC[o.dir][1], V.rot);
        if (o.anim && temps - o.anim.t0 < o.anim.dur) {
          const k = easeOut((temps - o.anim.t0) / o.anim.dur);
          const [qx, qy] = versEcran(o.anim.de[0], o.anim.de[1]);
          px = lerp(qx, px, k); py = lerp(qy, py, k);
        }
        if (o.tour && temps - o.tour.t0 < o.tour.dur) {
          const k = easeOut((temps - o.tour.t0) / o.tour.dur);
          const a0 = angleDir(POP.VEC[o.tour.de][0], POP.VEC[o.tour.de][1], V.rot);
          ang = a0 + Math.PI * k;
        }
        let rentre = 0;
        for (const e of effets) if (e.k === 'coquille' && e.x === x && e.y === y && temps >= e.t0) rentre = Math.max(rentre, 1 - Math.abs((temps - e.t0) / e.dur * 2 - 1));

      } else if (o.k === 't') {
        let ang = angleDir(POP.VEC[o.dir][0], POP.VEC[o.dir][1], V.rot);
        if (o.tour && temps - o.tour.t0 < o.tour.dur) {
          const k = easeOut((temps - o.tour.t0) / o.tour.dur);
          const a0 = angleDir(POP.VEC[o.tour.de][0], POP.VEC[o.tour.de][1], V.rot);
          ang = a0 + (Math.PI / 2) * k;
        }
        let choc = 0;
        for (const e of effets) if (e.k === 'tournesol' && e.x === x && e.y === y && temps >= e.t0) choc = 1 - (temps - e.t0) / e.dur;

    for (const g of graines) {

    if (clavierActif && curseur && ecran === 'jeu') {
      const [px, py] = versEcran(curseur[0], curseur[1]);
      ctx.strokeStyle = '#ffd447'; ctx.lineWidth = 4;
      arrondi(ctx, px - s / 2 + 3, py - s / 2 + 3, s - 6, s - 6, s * 0.18); ctx.stroke();
    }

    const mainCase = indiceCase || (tuto && niv === 0 && solutionCache['n0'] ? solutionCache['n0'][0] : null);

      const [px, py] = versEcran(mainCase[0], mainCase[1]);

  }
  // Petits points : où iront les graines du bourgeon visé
  function dessinerPortee(x, y) {

    ctx.save();
    for (const d of dirs) {
      let cx = x, cy = y, dx = d[0], dy = d[1], reste = POP.PORTEE, garde = 0;
      while (reste > 0 && garde++ < 20) {
        cx += dx; cy += dy;
        if (cx < 0 || cy < 0 || cx >= E.w || cy >= E.h) break;
        const c = vis.obj[cy][cx];
        const [px, py] = versEcran(cx, cy);
        if (c && (c.k === 'p' || c.k === 'e')) { ctx.strokeStyle = 'rgba(255,80,80,.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(px, py, V.c * 0.42, 0, Math.PI * 2); ctx.stroke(); break; }

  // ===== Affiche (jaquette) : scène composée sans interface =====
  function dessinerAffiche() {
    const g = ctx;
    const tps = 1400;
    // ciel et soleil
    const ciel = g.createLinearGradient(0, 0, 0, H);
    ciel.addColorStop(0, '#7fd3ff'); ciel.addColorStop(0.45, '#c6f0ff'); ciel.addColorStop(0.46, '#8fd468'); ciel.addColorStop(1, '#3f8f35');
    g.fillStyle = ciel; g.fillRect(0, 0, W, H);
    const sx = W * 0.82, sy = H * 0.12;
    const halo = g.createRadialGradient(sx, sy, 10, sx, sy, W * 0.55);
    halo.addColorStop(0, 'rgba(255,248,200,1)'); halo.addColorStop(0.15, 'rgba(255,236,150,.85)'); halo.addColorStop(1, 'rgba(255,236,150,0)');
    g.fillStyle = halo; g.fillRect(0, 0, W, H);

    for (let i = 0; i < 14; i++) { g.rotate(Math.PI / 7); g.fillStyle = 'rgba(255,240,170,.35)'; g.beginPath(); g.moveTo(0, 0); g.lineTo(W, -W * 0.06); g.lineTo(W, W * 0.06); g.fill(); }
    g.restore();

    ellipse(g, W * 0.85, H * 0.48, W * 0.5, H * 0.08, 0, '#9ad874');
    for (let i = 0; i < 9; i++) cercle(g, W * (0.05 + i * 0.12), H * 0.44, W * 0.035, i % 2 ? '#6fbf5a' : '#5fb24a');
    // prairie avec bourgeons et fleurs en profondeur
    const R = hasard(7);
    for (let i = 0; i < 26; i++) {
      const y = H * (0.5 + R() * 0.32), x = R() * W;
      const s = 18 + (y - H * 0.5) * 0.18;
      if (Math.abs(x - W * 0.5) < W * 0.28 && y < H * 0.68) continue;
      if (R() < 0.5) dessinerFleur(g, x, y, s * 0.5, FLEURS[Math.floor(R() * 20)], 1, tps, R() < 0.4, R() * 6);
      else dessinerBourgeon(g, x, y, s * 1.2, { forme: R() < 0.5 ? 'croix' : 'diag', hp: 1, max: 1 }, FLEURS[Math.floor(R() * 20)], tps, false, 0);
    }

    const lueur = g.createRadialGradient(hx, hy, hr * 0.2, hx, hy, hr * 2);
    lueur.addColorStop(0, 'rgba(255,255,220,.95)'); lueur.addColorStop(0.35, 'rgba(255,230,160,.5)'); lueur.addColorStop(1, 'rgba(255,230,160,0)');
    g.fillStyle = lueur; g.fillRect(0, 0, W, H);

    g.restore();
    // tige et feuilles
    g.strokeStyle = '#2f7d2a'; g.lineWidth = hr * 0.14; g.lineCap = 'round';
    g.beginPath(); g.moveTo(hx, H * 0.95); g.quadraticCurveTo(hx - hr * 0.3, hy + hr * 1.2, hx, hy + hr * 0.4); g.stroke();
    ellipse(g, hx - hr * 0.55, hy + hr * 1.35, hr * 0.5, hr * 0.18, -0.6, '#4fae3f');
    ellipse(g, hx + hr * 0.5, hy + hr * 1.1, hr * 0.5, hr * 0.18, 0.6, '#5fbf5a');
    // sépales ouverts
    g.fillStyle = '#3f8f35';
    for (let i = 0; i < 5; i++) { g.save(); g.translate(hx, hy + hr * 0.25); g.rotate(-Math.PI / 2 + (i - 2) * 0.55 + Math.PI); g.beginPath(); g.ellipse(0, hr * 0.55, hr * 0.16, hr * 0.5, 0, 0, Math.PI * 2); g.fill(); g.restore(); }
    const heros = { p: '#ff6f91', c: '#ffd447', n: 8, f: 'rond' };
    dessinerFleur(g, hx, hy, hr * 1.02, { p: '#ffb3c8', c: '#ffd447', n: 8, f: 'rond' }, 1, 0, false, Math.PI / 8);
    dessinerFleur(g, hx, hy, hr * 0.85, heros, 1, 0, true, 0);
    // contour lumineux
    g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 3;
    g.beginPath(); g.arc(hx, hy, hr * 1.06, Math.PI * 1.1, Math.PI * 1.6); g.stroke();

    cibles.forEach(([tx, ty], i) => {

      else if (i === 1) dessinerBourgeon(g, tx, ty, hr * 0.85, { forme: 'croix', hp: 1, max: 1 }, FLEURS[10], tps, false, 0.6);

      g.save(); g.translate(hx + Math.cos(a) * d, hy + Math.sin(a) * d * 0.9); g.rotate(R() * 6);

    }

    dessinerPapillon(g, W * 0.78, H * 0.62, 26, PAPILLONS[1], 500, 1);
    // premier plan : grandes feuilles coupées par le bord
    g.fillStyle = '#2f7d2a';
    g.beginPath(); g.ellipse(-W * 0.02, H * 0.86, W * 0.3, H * 0.07, -0.5, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#3f8f35';
    g.beginPath(); g.ellipse(W * 1.02, H * 0.84, W * 0.3, H * 0.07, 0.5, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#2b6a25'; g.fillRect(0, H * 0.88, W, H * 0.12);
    for (let i = 0; i < 30; i++) { g.strokeStyle = i % 2 ? '#4fae3f' : '#3f8f35'; g.lineWidth = 4; const x = i * W / 29; g.beginPath(); g.moveTo(x, H); g.quadraticCurveTo(x + 6, H * 0.9, x + 2, H * 0.84); g.stroke(); }
  }

  // ===== Aperçus (images de la page du jeu) =====
  function ouvrirApercu(n) {
    document.querySelectorAll('.jel-langue').forEach((e) => { e.style.display = 'none'; });
    prog.etoiles = NIVEAUX.map((_, i) => (i < 12 ? 3 : 0));
    const choix = n === 1 ? { i: 0, tick: 2.4 } : n === 2 ? { i: 9, tick: 3.5 } : { i: 17, avant: true, tick: 4.4 };

    if (choix.avant && sol.length > 1) {
      // premier toucher déjà joué
      POP.toucher(E, sol[0][0], sol[0][1]);
      vis = POP.cloner(E);
      majHud();
    }
    const cible = choix.avant && sol.length > 1 ? sol[1] : sol[0];
    jouerToucher(cible[0], cible[1]);
    // avancer l'horloge jusqu'au moment voulu, puis figer
    const pas = 16;
    for (let k = 0; k < (choix.tick * TICK) / pas; k++) { temps += pas; majLecture(); majParticules(pas); }
    fige = true;
  }

  // ===== Entrées =====
  function pointeur(e) {
    if (ecran !== 'jeu' || !E) return null;
    const r = canvas.getBoundingClientRect();
    return depuisEcran(e.clientX - r.left, e.clientY - r.top);
  }
  canvas.addEventListener('pointerdown', (e) => {
    Son.init();
    const c = pointeur(e);
    if (!c) return;
    clavierActif = false;
    if (jouerToucher(c[0], c[1])) { if (indiceCase && (indiceCase[0] !== c[0] || indiceCase[1] !== c[1])) indiceCase = null; }
  });
  canvas.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') { survol = pointeur(e); } });
  canvas.addEventListener('pointerleave', () => { survol = null; });

  function deplacerCurseur(dc, dr) {
    if (!E) return;
    clavierActif = true;
    if (!curseur) { const b = POP.bourgeons(E)[0] || [0, 0]; curseur = b.slice(); return; }
    // déplacement en coordonnées d'écran
    let col, row;
    if (V.rot) { col = E.h - 1 - curseur[1]; row = curseur[0]; } else { col = curseur[0]; row = curseur[1]; }
    col = clamp(col + dc, 0, V.cols - 1); row = clamp(row + dr, 0, V.rows - 1);
    curseur = V.rot ? [row, E.h - 1 - col] : [col, row];
  }
  window.addEventListener('keydown', (e) => {
    const k = e.code;
    if (estVisible('voile-nouveau')) { if (k === 'Enter' || k === 'Space' || k === 'Escape') { e.preventDefault(); $('b-compris').click(); } return; }
    if (ecran === 'jeu') {
      if (k === 'Escape' || k === 'KeyP') { e.preventDefault(); if (enPause) reprendre(); else mettrePause(); return; }
      if (enPause || resultat) return;
      if (k === 'ArrowLeft') { e.preventDefault(); deplacerCurseur(-1, 0); }
      else if (k === 'ArrowRight') { e.preventDefault(); deplacerCurseur(1, 0); }
      else if (k === 'ArrowUp') { e.preventDefault(); deplacerCurseur(0, -1); }
      else if (k === 'ArrowDown') { e.preventDefault(); deplacerCurseur(0, 1); }
      else if ((k === 'Space' || k === 'Enter') && curseur && clavierActif && (document.activeElement === document.body || document.activeElement === canvas)) { e.preventDefault(); jouerToucher(curseur[0], curseur[1]); }
      else if (k === 'KeyR') { e.preventDefault(); recommencer(); }
    }
  });

  function brancherBoutons() {
    document.querySelectorAll('.b-son').forEach((b) => b.appendChild(svg(ICONES.son)));
    $('b-pause').appendChild(svg(ICONES.pause));
    $('b-recommencer').appendChild(svg(ICONES.recommencer));
    $('b-indice').appendChild(svg(ICONES.indice));
    $('b-niv-retour').appendChild(svg(ICONES.retour));
    $('b-herb-retour').appendChild(svg(ICONES.retour));
    majBoutonsSon();
    $('b-jouer').addEventListener('click', () => {
      Son.init(); Son.clic();
      chargerProgression(); majBoutonsSon();
      if (!window.JEL_SAVE) { lancerNiveau(0); return; }
      window.JEL_SAVE.reprise({
        jeu: JEU,
        onContinuer: (d) => lancerNiveau(clamp(Number(d.niveau) || 1, 1, NIVEAUX.length) - 1),
        onNouvelle: () => lancerNiveau(0),
        onEffacer: () => { prog.etoiles = NIVEAUX.map(() => 0); prog.records = NIVEAUX.map(() => 0); prog.atteint = 1; prog.pot = 0; prog.vus = []; lancerNiveau(0); },
      });
    });
    $('b-niveaux').addEventListener('click', () => { Son.init(); Son.clic(); chargerProgression(); montrerNiveaux(); });
    $('b-herbier').addEventListener('click', () => { Son.init(); Son.clic(); chargerProgression(); montrerHerbier(); });
    $('b-niv-retour').addEventListener('click', () => { Son.clic(); montrerTitre(); });
    $('b-herb-retour').addEventListener('click', () => { Son.clic(); montrerTitre(); });
    $('b-pause').addEventListener('click', () => { Son.init(); Son.clic(); mettrePause(); });
    $('b-recommencer').addEventListener('click', () => { Son.init(); Son.clic(); if (!lecture && !resultat) recommencer(); });
    $('b-indice').addEventListener('click', demanderIndice);
    $('b-reprendre').addEventListener('click', () => { reprendre(); Son.clic(); });
    $('b-p-recommencer').addEventListener('click', () => { reprendre(); Son.clic(); recommencer(); });
    $('b-p-niveaux').addEventListener('click', () => { reprendre(); Son.clic(); sauver(niv + 1); montrerNiveaux(); });
    $('b-p-accueil').addEventListener('click', () => { reprendre(); Son.clic(); sauver(niv + 1); montrerTitre(); });
    $('b-compris').addEventListener('click', () => { Son.init(); Son.clic(); fermerNouveaute(); });
    $('b-fin-principal').addEventListener('click', () => {
      Son.clic();
      const a = $('b-fin-principal').dataset.action;
      if (a === 'suivant') lancerNiveau(niv + 1);
      else if (a === 'bilan') montrerBilan();
      else lancerNiveau(niv, true);
    });
    $('b-fin-rejouer').addEventListener('click', () => { Son.clic(); lancerNiveau(niv); });
    $('b-fin-niveaux').addEventListener('click', () => { Son.clic(); montrerNiveaux(); });
    $('b-bilan-herbier').addEventListener('click', () => { Son.clic(); montrerHerbier(); });
    $('b-bilan-niveaux').addEventListener('click', () => { Son.clic(); montrerNiveaux(); });
    $('b-bilan-accueil').addEventListener('click', () => { Son.clic(); montrerTitre(); });
    document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', () => {
      prog.son = !prog.son; sauverReglage(); majBoutonsSon(); Son.init(); Son.clic();
    }));
  }
  function majBoutonsSon() {
    document.querySelectorAll('.b-son').forEach((b) => { b.classList.toggle('coupe', !prog.son); b.setAttribute('aria-pressed', prog.son ? 'false' : 'true'); });
  }

  // ===== Démarrage =====
  function demarrer() {
    try { const s = localStorage.getItem('fmg-pop-bourgeons-son'); if (s === '0') prog.son = false; } catch (e) { /* stockage refusé */ }
    chargerProgression();
    redimensionner();
    window.addEventListener('resize', redimensionner);
    document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });
    if (AFFICHE) {
      ['ecran-titre', 'hud'].forEach((id) => $(id).classList.add('cache'));
      document.querySelectorAll('.jel-langue').forEach((e) => { e.style.display = 'none'; });
      setTimeout(() => document.querySelectorAll('.jel-langue').forEach((e) => { e.style.display = 'none'; }), 300);
      requestAnimationFrame(boucle);
      return;
    }
    brancherBoutons();
    if (APERCU) {
      ouvrirApercu(APERCU);
      setTimeout(() => document.querySelectorAll('.jel-langue').forEach((e) => { e.style.display = 'none'; }), 300);
      requestAnimationFrame(boucle);
      return;
    }
    if (window.JEL_SAVE) {
      window.JEL_SAVE.surFermeture(() => { if (enPartie && ecran === 'jeu') sauver(niv + 1); });
    }
    montrerTitre();
    requestAnimationFrame(boucle);
  }
  demarrer();
})();
</script>
</body>
</html>
