<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<style>
  :root {
    --nuit: #0b1226;
    --panneau: #17213f;
    --bouton: #27355f;
    --texte: #f4f1e6;
    --doux: #b9c0dc;
    --or: #ffd95e;
    --rose: #ff8fc8;
    --vert: #7be0a0;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--nuit); color: var(--texte);
    font-family: system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button {
    font-family: inherit; color: var(--texte); cursor: pointer;
    border: 0; background: var(--bouton); border-radius: 12px;
  }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
  svg { display: block; }
  .cache { display: none !important; }

  /* ---------- Écran de jeu ---------- */
  #jeu { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #hud {
    flex: 0 0 auto; height: 52px; display: flex; align-items: center; gap: 4px;
    padding: 4px 5px; box-sizing: border-box; background: rgba(8, 13, 32, .92);
    border-bottom: 1px solid rgba(255, 255, 255, .08);
  }
  .info {
    display: flex; align-items: center; gap: 3px; height: 40px; padding: 0 6px;
    border-radius: 12px; background: rgba(255, 255, 255, .07);
    font-weight: 800; font-size: 16px; white-space: nowrap; flex: 0 1 auto; min-width: 0;
  }
  .info svg { width: 18px; height: 20px; }
  .info small { font-weight: 600; font-size: 12px; color: var(--doux); }
  @media (max-width: 370px) { .info small { display: none; } }
  .info.secousse { animation: secoue .35s; background: rgba(255, 90, 90, .35); }
  .info.gain b { animation: gonfle .3s; }
  @keyframes secoue { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .info b { display: inline-block; }
  @keyframes gonfle { 50% { transform: scale(1.25); } }
  .espace { flex: 1; }
  .rond {
    flex: 0 0 auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .rond.actif { background: #4a5ea8; box-shadow: 0 0 0 2px var(--or) inset; }
  #zone { flex: 1 1 auto; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  #carte { display: block; touch-action: none; border-radius: 10px; box-shadow: 0 0 0 2px rgba(255,255,255,.06), 0 8px 30px rgba(0,0,0,.5); }
  #bandeau {
    position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
    padding: 12px 22px; border-radius: 16px; background: rgba(8, 13, 32, .85);
    font-size: 22px; font-weight: 800; text-align: center; pointer-events: none;
    opacity: 0; white-space: nowrap;
  }
  #bandeau small { display: block; font-size: 15px; font-weight: 600; color: var(--doux); }
  #bandeau.montre { animation: bandeau 2.4s forwards; }
  @keyframes bandeau { 0% { opacity: 0; transform: translate(-50%, -30%); } 15%, 80% { opacity: 1; transform: translate(-50%, -50%); } 100% { opacity: 0; transform: translate(-50%, -60%); } }

  /* ---------- Barre du bas ---------- */
  #barre {
    flex: 0 0 auto; min-height: 96px; box-sizing: border-box; padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
    background: rgba(8, 13, 32, .95); border-top: 1px solid rgba(255, 255, 255, .08);
    display: flex; align-items: center; gap: 6px;
  }
  .aide { flex: 1; font-size: 14px; line-height: 1.3; color: var(--doux); padding: 0 4px; }
  .aide b { color: var(--texte); }
  #b-vague {
    flex: 0 0 auto; min-width: 118px; height: 64px; font-size: 17px; font-weight: 800;
    background: linear-gradient(#ffcf4a, #f0a325); color: #3a2300; padding: 0 10px;
  }
  #b-vague small { display: block; font-size: 12px; font-weight: 700; }
  #b-vague.pulse { animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); box-shadow: 0 0 18px rgba(255, 210, 80, .7); } }
  #b-lune { flex: 0 0 auto; width: 64px; height: 64px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }

// Les 15 niveaux. Vague : « n6/1.2 » = 6 ombrelins, un toutes les 1,2 s ; groupes enchaînés.

  { carte: 1, or: 260, pv: 1.5, intro: ['phare'], vagues: ['n8/0.8 c3/1.4', 'v8/0.7', 'c6/1 n10/0.5', 'v10/0.6 r10/0.4', 'c8/0.9 v6/0.7', 'c10/0.8 v10/0.6'] },

// Éclat de lune : pouvoir débloqué au niveau 9.
const SORT = { niveau: 9, portee: 1.5, degats: 60, recharge: 22 };

// Transforme une liste de points de passage en chemin mesuré (longueurs cumulées).
function preparerChemin(points) {
  const p = points.map(([c, r]) => ({ x: c + 0.5, y: r + 0.5 }));
  const longs = [0];
  for (let i = 1; i < p.length; i++) longs.push(longs[i - 1] + Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y));
  return { p, longs, total: longs[longs.length - 1] };
}

// Position (et direction) à la distance d le long du chemin.
function positionSur(ch, d) {
  let i = 1;
  while (i < ch.p.length - 1 && ch.longs[i] < d) i++;
  const a = ch.p[i - 1], b = ch.p[i];
  const lg = ch.longs[i] - ch.longs[i - 1] || 1;
  const k = Math.max(0, Math.min(1, (d - ch.longs[i - 1]) / lg));
  return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, dx: (b.x - a.x) / lg, dy: (b.y - a.y) / lg };
}

// « n6/1.2 c2/2 » → file d'apparition [{ type, delai }].
function lireVague(texte) {
  const file = [];
  texte.trim().split(/\s+/).forEach((g, ig) => {
    const m = g.match(/^([a-zA-Z])(\d+)(?:\/([\d.]+))?$/);
    if (!m) return;
    const nb = +m[2], inter = m[3] ? +m[3] : 1;
    for (let i = 0; i < nb; i++) file.push({ type: m[1], delai: i === 0 ? (ig === 0 ? 0 : 1.5) : inter });
  });
  return file;
}

function creerPartie(n) {
  const def = NIVEAUX[n - 1];
  const carte = CARTES[def.carte];
  // Grille : 0 herbe libre, 1 chemin, 2 décor, 3 bastion, 4 tour.
  const grille = [];
  for (let r = 0; r < ROWS; r++) grille.push(new Array(COLS).fill(0));
  for (const pts of carte.chemins) {
    for (let i = 1; i < pts.length; i++) {
      const [c1, r1] = pts[i - 1], [c2, r2] = pts[i];
      const pas = Math.max(Math.abs(c2 - c1), Math.abs(r2 - r1));
      for (let k = 0; k <= pas; k++) {
        const c = c1 + Math.sign(c2 - c1) * k, r = r1 + Math.sign(r2 - r1) * k;
        if (c >= 0 && c < COLS && r >= 0 && r < ROWS) grille[r][c] = 1;
      }
    }
  }
  for (const [c, r] of carte.deco) grille[r][c] = 2;
  const fin = carte.chemins[0][carte.chemins[0].length - 1];
  grille[fin[1]][fin[0]] = 3;
  return {
    n, def, carte, grille, bastion: { x: fin[0] + 0.5, y: fin[1] + 0.5 },
    chemins: carte.chemins.map(preparerChemin),
    tours: [], ennemis: [], tirs: [], evts: [],
    or: def.or, vies: VIES, vague: 0, file: [], attente: 0, prochainChemin: 0,
    temps: 0, lumiere: 0, arretes: 0, gagne: false, perdu: false, score: 0, etoiles: 0,
    sortCharge: 0, ids: 1,
  };
}

function multGain(e) { return 1 + (e.def.pv - 1) * 0.5; }

function creerEnnemi(e, type, ich, d) {
  const def = ENNEMIS[type];
  const ch = e.chemins[ich];
  const pos = positionSur(ch, d);
  const pvMax = Math.round(def.pv * e.def.pv);
  const en = { id: e.ids++, type, def, ich, d, pv: pvMax, pvMax, x: pos.x, y: pos.y, dx: pos.dx, dy: pos.dy,
    lent: 1, lentT: 0, vivant: true, phase: (e.ids * 1.7) % 6.28, invT: def.invoque || 0, touche: 0 };
  e.ennemis.push(en);
  return en;
}

function caseLibre(e, c, r) { return c >= 0 && c < COLS && r >= 0 && r < ROWS && e.grille[r][c] === 0; }
function tourEn(e, c, r) { return e.tours.find((t) => t.c === c && t.r === r) || null; }
function tourDebloquee(e, type) { return e.n >= NIVEAU_TOUR[type]; }
function prixAmelioration(t) { return t.niv < 2 ? TOURS[t.type].niv[t.niv + 1].prix : 0; }
function prixRevente(t) { return Math.floor(t.investi * PART_REVENTE); }

// Actions du joueur : renvoient 'ok' ou la raison du refus.
function construire(e, type, c, r) {
  if (!tourDebloquee(e, type)) return 'verrou';
  if (!caseLibre(e, c, r)) return 'place';
  const prix = TOURS[type].niv[0].prix;
  if (e.or < prix) return 'or';
  e.or -= prix;
  e.grille[r][c] = 4;
  const t = { id: e.ids++, type, niv: 0, c, r, x: c + 0.5, y: r + 0.5, recharge: 0.2, investi: prix, angle: -Math.PI / 2, tirT: 0 };
  e.tours.push(t);
  e.evts.push({ t: 'construit', x: t.x, y: t.y });
  return 'ok';
}
function ameliorer(e, t) {
  if (e.n < NIVEAU_AMELIORER) return 'verrou';
  if (t.niv >= 2) return 'max';
  const prix = prixAmelioration(t);
  if (e.or < prix) return 'or';
  e.or -= prix; t.investi += prix; t.niv++;
  e.evts.push({ t: 'ameliore', x: t.x, y: t.y });
  return 'ok';
}
function vendre(e, t) {
  e.or += prixRevente(t);
  e.grille[t.r][t.c] = 0;
  e.tours = e.tours.filter((x) => x !== t);
  e.evts.push({ t: 'vendu', x: t.x, y: t.y, gain: prixRevente(t) });
  return 'ok';
}
function vagueDisponible(e) { return !e.gagne && !e.perdu && e.file.length === 0 && e.vague < e.def.vagues.length; }
function lancerVague(e) {
  if (!vagueDisponible(e)) return false;
  const bonus = e.vague > 0 && e.ennemis.length > 0 ? BONUS_AVANCE : 0;
  e.or += bonus;
  e.file = lireVague(e.def.vagues[e.vague]);
  e.vague++;
  e.attente = 0;
  e.evts.push({ t: 'vague', bonus });
  return true;
}
function sortDisponible(e) { return e.n >= SORT.niveau && e.sortCharge <= 0; }
function lancerSort(e, x, y) {
  if (!sortDisponible(e)) return false;
  e.sortCharge = SORT.recharge;
  for (const en of e.ennemis) {
    if (en.vivant && Math.hypot(en.x - x, en.y - y) <= SORT.portee) {
      infliger(e, en, SORT.degats * e.def.pv, true);
      en.lent = 0.5; en.lentT = 1.5;
    }
  }
  e.evts.push({ t: 'lune', x, y });
  return true;
}

function infliger(e, en, degats, perce) {
  if (!en.vivant) return;
  const armure = perce ? 0 : (en.def.armure || 0);
  const effectif = Math.max(1, degats - armure);
  if (armure && Math.random() < 0.25) e.evts.push({ t: 'tink', x: en.x, y: en.y });
  en.pv -= effectif;
  en.touche = 0.12;
  if (en.pv <= 0) {
    en.vivant = false;
    const gain = Math.round(en.def.gain * multGain(e));
    e.or += gain; e.lumiere += gain; e.arretes++;
    e.evts.push({ t: 'pouf', x: en.x, y: en.y, gain, boss: !!en.def.boss, taille: en.def.taille });
    if (en.def.divise) {
      creerEnnemi(e, en.def.divise, en.ich, en.d + 0.15);
      creerEnnemi(e, en.def.divise, en.ich, Math.max(0, en.d - 0.15));
      e.evts.push({ t: 'divise', x: en.x, y: en.y });
    }
  }
}

// Cible : l'ombre la plus proche du bastion, à portée.
function choisirCible(e, t, portee, air) {
  let meilleure = null, reste = Infinity;
  for (const en of e.ennemis) {
    if (!en.vivant || (en.def.vol && !air)) continue;
    if ((en.x - t.x) ** 2 + (en.y - t.y) ** 2 > portee * portee) continue;
    const r = e.chemins[en.ich].total - en.d;
    if (r < reste) { reste = r; meilleure = en; }
  }
  return meilleure;
}

function majPartie(e, dt) {
  if (e.gagne || e.perdu) return;
  e.temps += dt;
  if (e.sortCharge > 0) e.sortCharge = Math.max(0, e.sortCharge - dt);

  // 1. Apparitions.
  if (e.file.length) {
    e.attente -= dt;
    while (e.file.length && e.attente <= 0) {
      const s = e.file.shift();
      const ich = ENNEMIS[s.type].boss ? 0 : (e.prochainChemin++ % e.chemins.length);
      creerEnnemi(e, s.type, ich, 0);
      if (e.file.length) e.attente += e.file[0].delai;
    }
  }

  // 2. Déplacement des ombres, soins et renforts.
  for (const en of e.ennemis) {
    if (!en.vivant) continue;
    if (en.lentT > 0) { en.lentT -= dt; if (en.lentT <= 0) en.lent = 1; }
    if (en.touche > 0) en.touche -= dt;
    const ch = e.chemins[en.ich];
    en.d += en.def.vit * en.lent * dt;
    const pos = positionSur(ch, en.d);
    en.x = pos.x; en.y = pos.y; en.dx = pos.dx; en.dy = pos.dy;
    if (en.d >= ch.total) {
      en.vivant = false;
      e.vies = Math.max(0, e.vies - en.def.degat);
      e.evts.push({ t: 'fuite', degat: en.def.degat, x: en.x, y: en.y });
      continue;
    }
    if (en.def.soin) {
      for (const o of e.ennemis) {
        if (o !== en && o.vivant && o.pv < o.pvMax && Math.hypot(o.x - en.x, o.y - en.y) < 1.6) {
          o.pv = Math.min(o.pvMax, o.pv + en.def.soin * e.def.pv * dt);
          if (Math.random() < dt * 2) e.evts.push({ t: 'soin', x: o.x, y: o.y });
        }
      }
    }
    if (en.def.invoque) {
      en.invT -= dt;
      if (en.invT <= 0) {
        en.invT = en.def.invoque;
        creerEnnemi(e, 'n', en.ich, Math.max(0, en.d - 0.5));
        creerEnnemi(e, 'n', en.ich, Math.max(0, en.d - 0.9));
        e.evts.push({ t: 'invoque', x: en.x, y: en.y });
      }
    }
  }

  // 3. Les tours tirent.
  for (const t of e.tours) {
    const T = TOURS[t.type], s = T.niv[t.niv];
    t.recharge -= dt;
    if (t.tirT > 0) t.tirT -= dt;
    if (t.recharge > 0) continue;
    if (t.type === 'givre') {
      let touche = false;
      for (const en of e.ennemis) {
        if (!en.vivant || en.def.vol) continue;
        if (Math.hypot(en.x - t.x, en.y - t.y) > s.portee) continue;
        touche = true;
        en.lent = Math.min(en.lent, s.lent); en.lentT = Math.max(en.lentT, s.duree);
        infliger(e, en, s.degats, false);
      }
      if (touche) { t.recharge = s.cadence; t.tirT = 0.3; e.evts.push({ t: 'givre', x: t.x, y: t.y, portee: s.portee }); }
      continue;
    }
    const cible = choisirCible(e, t, s.portee, T.air);
    if (!cible) continue;
    t.recharge = s.cadence; t.tirT = 0.2;
    t.angle = Math.atan2(cible.y - t.y, cible.x - t.x);
    if (t.type === 'phare') {
      infliger(e, cible, s.degats, true);
      e.evts.push({ t: 'rayon', x1: t.x, y1: t.y - 0.3, x2: cible.x, y2: cible.y, niv: t.niv });
    } else {
      e.tirs.push({ type: t.type, x: t.x, y: t.y - 0.25, cible, cx: cible.x, cy: cible.y, vit: t.type === 'fleur' ? 5 : 8,
        degats: s.degats, zone: s.zone || 0, niv: t.niv });
      e.evts.push({ t: 'tir', type: t.type });
    }
  }

  // 4. Les projectiles avancent.
  for (const p of e.tirs) {
    if (p.cible.vivant) { p.cx = p.cible.x; p.cy = p.cible.y; }
    const dx = p.cx - p.x, dy = p.cy - p.y, dist = Math.hypot(dx, dy);
    const pas = p.vit * dt;
    if (dist <= pas + 0.08) {
      p.fini = true;
      if (p.zone) {
        for (const en of e.ennemis) {
          if (en.vivant && !en.def.vol && Math.hypot(en.x - p.cx, en.y - p.cy) <= p.zone) infliger(e, en, p.degats, false);
        }
        e.evts.push({ t: 'boum', x: p.cx, y: p.cy, zone: p.zone });
      } else if (p.cible.vivant) {
        infliger(e, p.cible, p.degats, false);
        e.evts.push({ t: 'impact', x: p.cx, y: p.cy });
      }
    } else { p.x += dx / dist * pas; p.y += dy / dist * pas; }
  }
  e.tirs = e.tirs.filter((p) => !p.fini);
  e.ennemis = e.ennemis.filter((en) => en.vivant);

  // 5. Fin du niveau.
  if (e.vies <= 0) { e.perdu = true; e.evts.push({ t: 'perdu' }); return; }
  if (e.vague >= e.def.vagues.length && !e.file.length && !e.ennemis.length) {
    e.gagne = true;
    e.etoiles = e.vies >= VIES ? 3 : e.vies >= VIES / 2 ? 2 : 1;
    e.score = e.lumiere + e.vies * 25 + (e.vies >= VIES ? 100 : 0);
    e.evts.push({ t: 'gagne' });
  }
}

// Combien de morceaux de chemin une case couvre-t-elle (pour conseiller une case) ?
function couverture(e, c, r, portee) {
  let n = 0;
  for (const ch of e.chemins) {
    for (let d = 0; d < ch.total; d += 0.25) {
      const p = positionSur(ch, d);
      if ((p.x - c - 0.5) ** 2 + (p.y - r - 0.5) ** 2 <= portee * portee) n++;
    }
  }
  return n;
}

      const d = bruit.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }

function cercle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
function lueur(ctx, x, y, r, couleur, alpha = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, couleur); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = alpha; ctx.fillStyle = g; cercle(ctx, x, y, r); ctx.fill(); ctx.globalAlpha = 1;
}
function etoile(ctx, x, y, r, branches = 5) {
  ctx.beginPath();
  for (let i = 0; i < branches * 2; i++) {
    const a = -Math.PI / 2 + i * Math.PI / branches, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}

// Une tour. tir > 0 juste après un tir (petit recul / éclat).
function dessinerTour(ctx, type, niv, x, y, t, angle = -Math.PI / 2, tir = 0) {
  // socle de pierre
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x, y + 0.3, 0.38, 0.13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#7d7f94'; ctx.beginPath(); ctx.ellipse(x, y + 0.24, 0.36, 0.14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#9a9cb2'; ctx.beginPath(); ctx.ellipse(x, y + 0.2, 0.33, 0.11, 0, 0, Math.PI * 2); ctx.fill();
  const grand = 1 + niv * 0.1;
  if (type === 'luciole') {
    ctx.fillStyle = '#7a5232'; ctx.fillRect(x - 0.13 * grand, y - 0.12, 0.26 * grand, 0.34);
    ctx.fillStyle = '#9a6d44'; ctx.beginPath(); ctx.ellipse(x, y - 0.12, 0.13 * grand, 0.05, 0, 0, Math.PI * 2); ctx.fill();
    const py = y - 0.32 - Math.sin(t * 3) * 0.04;
    lueur(ctx, x, py, 0.45 + niv * 0.08 + tir, 'rgba(255,230,110,.75)');
    ctx.fillStyle = '#fff3a0'; cercle(ctx, x, py, 0.1 + niv * 0.015); ctx.fill();
    ctx.fillStyle = 'rgba(220,240,255,.8)';
    ctx.beginPath(); ctx.ellipse(x - 0.1, py - 0.06, 0.08, 0.04, -0.5 + Math.sin(t * 30) * 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 0.1, py - 0.06, 0.08, 0.04, 0.5 - Math.sin(t * 30) * 0.4, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < niv; i++) {           // petites lucioles en orbite
      const a = t * 2 + i * Math.PI;
      ctx.fillStyle = '#ffe36e'; cercle(ctx, x + Math.cos(a) * 0.3, py + Math.sin(a) * 0.15, 0.04); ctx.fill();
    }
  } else if (type === 'givre') {
    ctx.fillStyle = '#e8f2f8'; ctx.fillRect(x - 0.08, y - 0.1, 0.16, 0.32);
    const cy = y - 0.12;
    lueur(ctx, x, cy, 0.5 + tir, 'rgba(140,215,255,.45)');
    ctx.fillStyle = niv === 2 ? '#5fb6ff' : '#7cc8ff';
    ctx.beginPath(); ctx.ellipse(x, cy, 0.3 * grand, 0.2 * grand, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff';
    [[-0.14, -0.08], [0.05, -0.15], [0.16, -0.05], [-0.02, -0.04]].forEach(([dx, dy]) => { cercle(ctx, x + dx * grand, cy + dy * grand, 0.035); ctx.fill(); });
    if (niv >= 1) { ctx.strokeStyle = '#dff4ff'; ctx.lineWidth = 0.03; for (let i = 0; i < 3; i++) { const a = t + i * 2.1; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * 0.38, cy - 0.1 + Math.sin(a) * 0.08); ctx.lineTo(x + Math.cos(a) * 0.44, cy - 0.1 + Math.sin(a) * 0.08); ctx.stroke(); } }
  } else if (type === 'fleur') {
    ctx.strokeStyle = '#4caa5a'; ctx.lineWidth = 0.06;
    ctx.beginPath(); ctx.moveTo(x, y + 0.2); ctx.quadraticCurveTo(x - 0.05, y, x, y - 0.18); ctx.stroke();
    ctx.fillStyle = '#5cc46a';
    ctx.beginPath(); ctx.ellipse(x - 0.12, y + 0.04, 0.1, 0.04, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 0.12, y, 0.1, 0.04, 0.6, 0, Math.PI * 2); ctx.fill();
    const cy = y - 0.24, nb = 5 + niv * 2, rr = 0.15 * grand * (1 + tir);
    ctx.fillStyle = niv === 2 ? '#ff6fb8' : '#ff9ad0';
    for (let i = 0; i < nb; i++) {
      const a = i * Math.PI * 2 / nb + t * 0.4;
      ctx.beginPath(); ctx.ellipse(x + Math.cos(a) * rr, cy + Math.sin(a) * rr, 0.1, 0.06, a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#ffd95e'; cercle(ctx, x, cy, 0.08); ctx.fill();
  } else if (type === 'phare') {
    const h = 0.62 + niv * 0.06;
    ctx.fillStyle = '#f2efe6';
    ctx.beginPath(); ctx.moveTo(x - 0.17, y + 0.2); ctx.lineTo(x - 0.1, y + 0.2 - h); ctx.lineTo(x + 0.1, y + 0.2 - h); ctx.lineTo(x + 0.17, y + 0.2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e0605a';
    for (let k = 0; k < 2; k++) { const yy = y + 0.1 - k * 0.22; ctx.fillRect(x - 0.155 + k * 0.02, yy - 0.08, 0.31 - k * 0.04, 0.08); }
    const ly = y + 0.2 - h - 0.07;
    lueur(ctx, x, ly, 0.45 + niv * 0.1 + tir * 2, 'rgba(255,245,190,.8)');
    ctx.fillStyle = '#fff6c8'; ctx.fillRect(x - 0.09, ly - 0.06, 0.18, 0.12);
    ctx.fillStyle = '#4a4f6a'; ctx.beginPath(); ctx.moveTo(x - 0.12, ly - 0.06); ctx.lineTo(x, ly - 0.17); ctx.lineTo(x + 0.12, ly - 0.06); ctx.fill();
  }
  // niveau de la tour : petites étoiles dorées sur le socle
  if (niv > 0) {
    ctx.fillStyle = '#ffd95e';
    for (let i = 0; i <= niv; i++) { etoile(ctx, x + (i - niv / 2) * 0.16, y + 0.32, 0.065); ctx.fill(); }
  }
}

// Un Ombrelin : boule d'ombre aux grands yeux, jamais effrayante.
function dessinerEnnemi(ctx, en, t) {
  const d = en.def, s = d.taille;
  let x = en.x, y = en.y;
  const bond = Math.abs(Math.sin(t * 7 * d.vit + en.phase)) * 0.06;
  if (d.vol) {
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x, y + 0.2, s * 0.8, s * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    y -= 0.28 + Math.sin(t * 5 + en.phase) * 0.05;
    const bat = Math.abs(Math.sin(t * 16 + en.phase));
    ctx.fillStyle = '#c58ae0';
    ctx.beginPath(); ctx.ellipse(x - s * 0.9, y - s * 0.2, s * 0.8, s * (0.25 + 0.4 * bat), -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + s * 0.9, y - s * 0.2, s * 0.8, s * (0.25 + 0.4 * bat), 0.4, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(x, y + s * 0.85, s * 0.9, s * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    y -= bond;
  }
  if (d.soin) lueur(ctx, x, y, 1.0 + Math.sin(t * 4) * 0.1, 'rgba(120,255,170,.35)');
  if (d.boss) lueur(ctx, x, y, s * 2.2, 'rgba(160,120,255,.35)');
  // corps
  const g = ctx.createRadialGradient(x - s * 0.3, y - s * 0.4, s * 0.1, x, y, s * 1.1);
  g.addColorStop(0, en.touche > 0 ? '#ffffff' : '#a99ae0');
  g.addColorStop(0.35, d.couleur);
  g.addColorStop(1, '#1a1435');
  ctx.fillStyle = g;
  const ecrase = Math.sin(t * 14 * d.vit + en.phase) * 0.06;
  ctx.beginPath(); ctx.ellipse(x, y, s * (1 + ecrase), s * (1 - ecrase), 0, 0, Math.PI * 2); ctx.fill();
  // carapace
  if (d.armure) {
    ctx.strokeStyle = '#c7b28a'; ctx.lineWidth = s * 0.16;
    ctx.beginPath(); ctx.arc(x, y + s * 0.1, s * 0.92, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
    ctx.lineWidth = s * 0.08;
    ctx.beginPath(); ctx.moveTo(x, y - s * 0.85); ctx.lineTo(x, y - s * 0.55); ctx.stroke();
  }
  // petite feuille du soigneur, couronne du roi, cornes rondes du géant
  if (d.soin) { ctx.fillStyle = '#7be0a0'; ctx.beginPath(); ctx.ellipse(x + s * 0.2, y - s * 1.05, s * 0.35, s * 0.15, -0.6, 0, Math.PI * 2); ctx.fill(); }
  if (en.type === 'R') {
    ctx.fillStyle = '#ffd95e';
    ctx.beginPath(); ctx.moveTo(x - s * 0.5, y - s * 0.75);
    [-0.5, -0.3, -0.15, 0, 0.15, 0.3, 0.5].forEach((k, i) => ctx.lineTo(x + s * k, y - s * (i % 2 ? 1.25 : 0.9)));
    ctx.lineTo(x + s * 0.5, y - s * 0.75); ctx.closePath(); ctx.fill();
  }
  if (en.type === 'G') {
    ctx.fillStyle = '#6a5fb0';
    cercle(ctx, x - s * 0.55, y - s * 0.8, s * 0.22); ctx.fill();
    cercle(ctx, x + s * 0.55, y - s * 0.8, s * 0.22); ctx.fill();
  }
  // yeux (regardent dans le sens de la marche) et sourire espiègle
  const ox = (en.dx || 0) * s * 0.18, oy = (en.dy || 0) * s * 0.12;
  const cligne = Math.sin(t * 1.3 + en.phase * 3) > 0.97 ? 0.15 : 1;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(x - s * 0.33 + ox, y - s * 0.15 + oy, s * 0.24, s * 0.3 * cligne, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + s * 0.33 + ox, y - s * 0.15 + oy, s * 0.24, s * 0.3 * cligne, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1435';
  cercle(ctx, x - s * 0.3 + ox * 1.6, y - s * 0.12 + oy * 1.6, s * 0.12 * cligne); ctx.fill();
  cercle(ctx, x + s * 0.36 + ox * 1.6, y - s * 0.12 + oy * 1.6, s * 0.12 * cligne); ctx.fill();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = s * 0.08; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x + ox, y + s * 0.3 + oy, s * 0.2, 0.3, Math.PI - 0.3); ctx.stroke();
  // ralenti par le givre
  if (en.lentT > 0 && en.lent < 1) {
    ctx.strokeStyle = 'rgba(170,230,255,.9)'; ctx.lineWidth = 0.035;
    cercle(ctx, x, y, s * 1.15); ctx.stroke();
    ctx.fillStyle = '#e8f8ff';
    for (let i = 0; i < 3; i++) { const a = t * 2 + i * 2.1; etoile(ctx, x + Math.cos(a) * s * 1.15, y + Math.sin(a) * s * 1.15, 0.05, 6); ctx.fill(); }
  }
  // jauge de lumière reçue
  if (en.pv < en.pvMax) {
    const w = Math.max(0.5, s * 2), k = Math.max(0, en.pv / en.pvMax);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x - w / 2, y - s - 0.18, w, 0.08);
    ctx.fillStyle = k > 0.5 ? '#9a8cff' : '#d08cff'; ctx.fillRect(x - w / 2, y - s - 0.18, w * k, 0.08);
  }
}

function dessinerBastion(ctx, x, y, t, vies) {
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x, y + 0.38, 0.5, 0.12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#8a8fb0'; ctx.fillRect(x - 0.42, y - 0.2, 0.84, 0.58);
  ctx.fillStyle = '#a5aac8';
  for (let i = 0; i < 4; i++) ctx.fillRect(x - 0.42 + i * 0.24, y - 0.32, 0.12, 0.14);
  ctx.fillStyle = '#5a4030'; ctx.beginPath(); ctx.arc(x, y + 0.38, 0.14, Math.PI, 0); ctx.lineTo(x + 0.14, y + 0.38); ctx.fill();
  const k = vies / VIES;
  lueur(ctx, x, y - 0.5, 0.25 + 0.6 * k, 'rgba(255,190,90,.85)', 0.4 + 0.6 * k);
  ctx.fillStyle = '#a8652a'; ctx.fillRect(x - 0.12, y - 0.66, 0.24, 0.05);
  ctx.fillStyle = k > 0 ? '#ffb84a' : '#555';
  ctx.beginPath(); ctx.moveTo(x - 0.1, y - 0.61); ctx.lineTo(x + 0.1, y - 0.61); ctx.lineTo(x + 0.07, y - 0.4); ctx.lineTo(x - 0.07, y - 0.4); ctx.fill();
  ctx.fillStyle = k > 0 ? '#fff0a0' : '#777'; cercle(ctx, x, y - 0.5, 0.04 + Math.sin(t * 6) * 0.01); ctx.fill();
}

function dessinerDeco(ctx, type, x, y, t) {
  if (type === 'arbre' || type === 'sapin') {
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x, y + 0.35, 0.36, 0.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5a3d28'; ctx.fillRect(x - 0.06, y + 0.05, 0.12, 0.32);
    if (type === 'arbre') {
      ctx.fillStyle = '#1f6b46'; cercle(ctx, x, y - 0.08, 0.36); ctx.fill();
      ctx.fillStyle = '#2b8a5a'; cercle(ctx, x - 0.1, y - 0.16, 0.22); ctx.fill();
    } else {
      ctx.fillStyle = '#2a5f55';
      for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(x, y - 0.45 + k * 0.15); ctx.lineTo(x - 0.3 + k * 0.02, y + 0.08 + k * 0.05 - 0.1 * (2 - k)); ctx.lineTo(x + 0.3 - k * 0.02, y + 0.08 + k * 0.05 - 0.1 * (2 - k)); ctx.fill(); }
      ctx.fillStyle = '#e8eef8'; ctx.beginPath(); ctx.moveTo(x, y - 0.45); ctx.lineTo(x - 0.1, y - 0.3); ctx.lineTo(x + 0.1, y - 0.3); ctx.fill();
    }
  } else if (type === 'rocher') {
    ctx.fillStyle = '#5d6178'; ctx.beginPath(); ctx.ellipse(x, y + 0.08, 0.36, 0.26, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#787d98'; ctx.beginPath(); ctx.ellipse(x - 0.08, y, 0.22, 0.14, -0.3, 0, Math.PI * 2); ctx.fill();
  } else if (type === 'fleurs') {
    const coul = ['#ff9ad0', '#ffd95e', '#b8a8ff'];
    for (let i = 0; i < 5; i++) { ctx.fillStyle = coul[i % 3]; cercle(ctx, x + Math.cos(i * 2.4) * 0.25, y + Math.sin(i * 2.4) * 0.22, 0.07); ctx.fill(); }
  } else if (type === 'eau') {
    ctx.fillStyle = '#1e5f7a'; ctx.fillRect(x - 0.5, y - 0.5, 1, 1);
    ctx.strokeStyle = 'rgba(180,230,255,.35)'; ctx.lineWidth = 0.03;
    for (let i = 0; i < 2; i++) { ctx.beginPath(); ctx.ellipse(x + (i ? 0.15 : -0.15), y + (i ? 0.15 : -0.1), 0.15 + ((t * 0.3 + i * 0.5) % 1) * 0.15, 0.06, 0, 0, Math.PI * 2); ctx.stroke(); }
  } else if (type === 'roseau') {
    ctx.strokeStyle = '#6a9a5a'; ctx.lineWidth = 0.05;
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(x + i * 0.12, y + 0.35); ctx.quadraticCurveTo(x + i * 0.12 + Math.sin(t + i) * 0.05, y, x + i * 0.16, y - 0.3); ctx.stroke(); }
    ctx.fillStyle = '#7a5232'; ctx.fillRect(x - 0.04, y - 0.38, 0.08, 0.18);
  }
}

/* ==========================================================================
   État de l'interface
   ========================================================================== */
const $ = (id) => document.getElementById(id);
const canvas = $('carte'), ctx = canvas.getContext('2d');
let partie = null;          // partie en cours (voir creerPartie)
let ecran = 'accueil';      // accueil | niveaux | jeu
let T = 40;                 // taille d'une case en pixels CSS
let dpr = 1;
let vitesse = 1;
let pauseManuelle = false;
let sel = null;             // null | { type: 'case', c, r } | { type: 'tour', tour }
let modeLune = false;
let curseur = null;         // curseur clavier { c, r }
let fondCache = null;       // fond de carte pré-dessiné
let temps = 0;
let finTimer = 0;
let secousse = 0;
let effets = { parts: [], textes: [], anneaux: [], rayons: [] };
let introFile = [];         // cartes « Nouveau ! » à montrer
let introActuelle = null;
let tuto = null;            // tutoriel en cours
let lucioles = [];          // lucioles d'ambiance
let cleBarre = '';

function enPause() {
  return pauseManuelle || !!introActuelle || !!tuto || !$('bilan').classList.contains('cache') || !$('pause').classList.contains('cache');
}

function montrer(id) {
  ['accueil', 'niveaux'].forEach((e) => $(e).classList.toggle('cache', e !== id));
  $('jeu').classList.toggle('cache', id !== 'jeu');
  ecran = id;
  if (id === 'jeu') redimensionner();
}

function majBoutonsSon() {
  document.querySelectorAll('.b-son').forEach((b) => {
    b.innerHTML = sauve.son ? ICONES.sonOui : ICONES.sonNon;
    b.setAttribute('aria-label', traduire(sauve.son ? 'couperSon' : 'remettreSon'));
  });
}

/* ---------- Taille du canvas ---------- */
function redimensionner() {
  if (ecran !== 'jeu') return;
  const zone = $('zone');
  const w = zone.clientWidth - 8, h = zone.clientHeight - 8;
  T = Math.max(20, Math.floor(Math.min(w / COLS, h / ROWS)));
  dpr = Math.min(3, window.devicePixelRatio || 1);
  canvas.style.width = T * COLS + 'px';
  canvas.style.height = T * ROWS + 'px';
  canvas.width = Math.round(T * COLS * dpr);
  canvas.height = Math.round(T * ROWS * dpr);
  preparerFond();
}
window.addEventListener('resize', redimensionner);

// Le fond (herbe, chemin, cases constructibles) ne change pas pendant un niveau.
function preparerFond() {
  if (!partie) return;
  const k = T * dpr;
  fondCache = document.createElement('canvas');
  fondCache.width = canvas.width; fondCache.height = canvas.height;
  const f = fondCache.getContext('2d');
  f.setTransform(k, 0, 0, k, 0, 0);
  const carte = partie.carte;
  const g = f.createLinearGradient(0, 0, 0, ROWS);
  g.addColorStop(0, carte.fond[0]); g.addColorStop(1, carte.fond[1]);
  f.fillStyle = g; f.fillRect(0, 0, COLS, ROWS);
  // touffes d'herbe (hasard fixe)
  let graine = 7 + partie.def.carte * 13;
  const hasard = () => (graine = (graine * 16807) % 2147483647) / 2147483647;
  f.strokeStyle = 'rgba(255,255,255,.07)'; f.lineWidth = 0.025;
  for (let i = 0; i < 160; i++) {
    const x = hasard() * COLS, y = hasard() * ROWS;
    f.beginPath(); f.moveTo(x, y); f.lineTo(x - 0.05, y - 0.12); f.moveTo(x, y); f.lineTo(x + 0.05, y - 0.1); f.stroke();
  }
  // cases constructibles : carrés très légers
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (partie.grille[r][c] === 0 || partie.grille[r][c] === 4) {
      f.fillStyle = 'rgba(255,255,255,.045)';
      arrondi(f, c + 0.08, r + 0.08, 0.84, 0.84, 0.15); f.fill();
    }
  }
  // chemins
  f.lineJoin = 'round'; f.lineCap = 'round';
  for (const ch of partie.chemins) {
    f.strokeStyle = carte.bord; f.lineWidth = 0.86; tracer(f, ch.p);
  }
  for (const ch of partie.chemins) {
    f.strokeStyle = carte.sol; f.lineWidth = 0.72; tracer(f, ch.p);
  }
  for (const ch of partie.chemins) {
    f.strokeStyle = 'rgba(255,255,255,.12)'; f.lineWidth = 0.08; f.setLineDash([0.15, 0.35]); tracer(f, ch.p); f.setLineDash([]);
  }
  // entrées : tourbillon d'ombre
  for (const ch of partie.chemins) {
    const a = ch.p[0], b = ch.p[1];
    const x = Math.max(0.3, Math.min(COLS - 0.3, a.x + (b.x - a.x) * 0.0)), y = Math.max(0.3, Math.min(ROWS - 0.3, a.y));
    const gx = f.createRadialGradient(x, y, 0, x, y, 0.8);
    gx.addColorStop(0, 'rgba(30,20,60,.9)'); gx.addColorStop(1, 'rgba(30,20,60,0)');
    f.fillStyle = gx; cercle(f, x, y, 0.8); f.fill();
  }
}
function tracer(f, pts) { f.beginPath(); pts.forEach((p, i) => (i ? f.lineTo(p.x, p.y) : f.moveTo(p.x, p.y))); f.stroke(); }
function arrondi(f, x, y, w, h, r) { f.beginPath(); f.roundRect ? f.roundRect(x, y, w, h, r) : f.rect(x, y, w, h); }

/* ---------- Dessin d'une image du jeu ---------- */
function dessinerJeu() {
  const e = partie;
  const k = T * dpr;
  const sx = secousse > 0 ? (Math.random() - 0.5) * secousse * 8 * dpr : 0;
  const sy = secousse > 0 ? (Math.random() - 0.5) * secousse * 8 * dpr : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (fondCache) ctx.drawImage(fondCache, sx, sy);
  ctx.setTransform(k, 0, 0, k, sx, sy);

  // décors et bastion, triés avec les tours et les ombres par profondeur
  const objets = [];
  for (const [c, r, type] of e.carte.deco) objets.push({ y: r + 0.5, f: () => dessinerDeco(ctx, type, c + 0.5, r + 0.5, temps) });
  objets.push({ y: e.bastion.y, f: () => dessinerBastion(ctx, e.bastion.x, e.bastion.y, temps, e.vies) });
  for (const t of e.tours) objets.push({ y: t.y, f: () => dessinerTour(ctx, t.type, t.niv, t.x, t.y, temps + t.id, t.angle, Math.max(0, t.tirT)) });
  for (const en of e.ennemis) objets.push({ y: en.y + (en.def.vol ? 0.6 : 0), f: () => dessinerEnnemi(ctx, en, temps) });
  objets.sort((a, b) => a.y - b.y).forEach((o) => o.f());

  // sélection et portée
  if (sel && sel.type === 'tour') {
    const t = sel.tour, s = TOURS[t.type].niv[t.niv];
    ctx.fillStyle = 'rgba(255,240,170,.1)'; ctx.strokeStyle = 'rgba(255,240,170,.7)'; ctx.lineWidth = 0.04;
    cercle(ctx, t.x, t.y, s.portee); ctx.fill(); ctx.stroke();
    if (t.niv < 2) { ctx.setLineDash([0.12, 0.1]); cercle(ctx, t.x, t.y, TOURS[t.type].niv[t.niv + 1].portee); ctx.stroke(); ctx.setLineDash([]); }
  }
  if (sel && sel.type === 'case') {
    const a = 0.6 + Math.sin(temps * 6) * 0.3;
    ctx.strokeStyle = `rgba(255,217,94,${a})`; ctx.lineWidth = 0.07;
    arrondi(ctx, sel.c + 0.06, sel.r + 0.06, 0.88, 0.88, 0.15); ctx.stroke();
    const apercu = selApercu || 'luciole';
    ctx.fillStyle = 'rgba(255,240,170,.08)'; ctx.strokeStyle = 'rgba(255,240,170,.4)'; ctx.lineWidth = 0.03;
    cercle(ctx, sel.c + 0.5, sel.r + 0.5, TOURS[apercu].niv[0].portee); ctx.fill(); ctx.stroke();
  }
  if (curseur) {
    ctx.strokeStyle = 'rgba(160,200,255,.9)'; ctx.lineWidth = 0.05; ctx.setLineDash([0.12, 0.08]);
    arrondi(ctx, curseur.c + 0.04, curseur.r + 0.04, 0.92, 0.92, 0.15); ctx.stroke(); ctx.setLineDash([]);
  }

  // projectiles
  for (const p of e.tirs) {
    if (p.type === 'luciole') { lueur(ctx, p.x, p.y, 0.22, 'rgba(255,235,120,.9)'); ctx.fillStyle = '#fffbe0'; cercle(ctx, p.x, p.y, 0.06 + p.niv * 0.015); ctx.fill(); }
    else { lueur(ctx, p.x, p.y, 0.25, 'rgba(255,140,200,.7)'); ctx.fillStyle = '#ffd0ea'; cercle(ctx, p.x, p.y, 0.09); ctx.fill(); }
  }
  // effets
  for (const r of effets.rayons) {
    const a = r.vie / r.duree;
    ctx.strokeStyle = `rgba(255,250,200,${a})`; ctx.lineWidth = 0.12 + r.niv * 0.05; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(r.x1, r.y1); ctx.lineTo(r.x2, r.y2); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 0.04; ctx.stroke();
  }
  for (const a of effets.anneaux) {
    const k2 = 1 - a.vie / a.duree;
    ctx.strokeStyle = a.couleur; ctx.globalAlpha = Math.max(0, a.vie / a.duree); ctx.lineWidth = a.epais || 0.08;
    cercle(ctx, a.x, a.y, a.r0 + (a.r1 - a.r0) * k2); ctx.stroke();
    if (a.plein) { ctx.fillStyle = a.plein; ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  for (const p of effets.parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.vie / p.duree * 1.5));
    if (p.etoile) { ctx.fillStyle = p.couleur; etoile(ctx, p.x, p.y, p.taille); ctx.fill(); }
    else { lueur(ctx, p.x, p.y, p.taille * 2.5, p.couleur); }
  }
  ctx.globalAlpha = 1;
  // lucioles d'ambiance
  for (const l of lucioles) {
    const a = 0.4 + 0.4 * Math.sin(temps * 2 + l.p);
    lueur(ctx, l.x, l.y, 0.18, `rgba(255,240,140,${a})`);
  }
  // textes flottants (en pixels, pour un rendu net)
  ctx.setTransform(dpr, 0, 0, dpr, sx, sy);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const tx of effets.textes) {
    ctx.globalAlpha = Math.max(0, Math.min(1, tx.vie / tx.duree * 2));
    ctx.font = `800 ${tx.taille}px system-ui, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,15,40,.85)';
    ctx.strokeText(tx.texte, tx.x * T, tx.y * T); ctx.fillStyle = tx.couleur; ctx.fillText(tx.texte, tx.x * T, tx.y * T);
  }
  ctx.globalAlpha = 1;
  if (modeLune) {
    ctx.font = '800 16px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(10,14,40,.75)'; ctx.fillRect(0, 0, T * COLS, 30);
    ctx.fillStyle = '#dfe6ff'; ctx.fillText(traduire('luneCanvas'), T * COLS / 2, 15);
  }
}

/* ---------- Effets ---------- */
function particules(x, y, nb, couleur, opts = {}) {
  for (let i = 0; i < nb; i++) {
    const a = Math.random() * Math.PI * 2, v = (opts.vitesse || 1.5) * (0.4 + Math.random());
    effets.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (opts.monte || 0), vie: opts.duree || 0.7, duree: opts.duree || 0.7,
      taille: opts.taille || 0.06, couleur, etoile: !!opts.etoile, gravite: opts.gravite || 0 });
  }
}
function texteFlottant(texte, x, y, couleur = '#ffd95e', taille = 16) {
  effets.textes.push({ texte, x, y, couleur, taille, vie: 1.1, duree: 1.1 });
}
function anneau(x, y, r0, r1, couleur, duree = 0.4, extra = {}) {
  effets.anneaux.push({ x, y, r0, r1, couleur, vie: duree, duree, ...extra });
}
function majEffets(dt) {
  for (const p of effets.parts) { p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.gravite * dt; p.vx *= 0.96; p.vy *= 0.96; }
  for (const t of effets.textes) { t.vie -= dt; t.y -= dt * 0.8; }
  for (const a of effets.anneaux) a.vie -= dt;
  for (const r of effets.rayons) r.vie -= dt;
  effets.parts = effets.parts.filter((p) => p.vie > 0).slice(-400);
  effets.textes = effets.textes.filter((t) => t.vie > 0);
  effets.anneaux = effets.anneaux.filter((a) => a.vie > 0);
  effets.rayons = effets.rayons.filter((r) => r.vie > 0);
  if (secousse > 0) secousse = Math.max(0, secousse - dt * 2.5);
  for (const l of lucioles) {
    l.x += Math.cos(l.a) * dt * 0.3; l.y += Math.sin(l.a) * dt * 0.3; l.a += (Math.random() - 0.5) * dt * 2;
    if (l.x < 0 || l.x > COLS || l.y < 0 || l.y > ROWS) { l.x = Math.random() * COLS; l.y = Math.random() * ROWS; }
  }
}

// Les événements de la logique deviennent sons et effets.
function traiterEvenements() {
  for (const ev of partie.evts) {
    switch (ev.t) {
      case 'construit': jouer('construit'); particules(ev.x, ev.y, 14, 'rgba(255,230,140,.9)', { etoile: true, taille: 0.08 }); anneau(ev.x, ev.y, 0.1, 0.6, '#ffe8a0'); break;
      case 'ameliore': jouer('ameliore'); particules(ev.x, ev.y - 0.2, 20, '#ffd95e', { etoile: true, taille: 0.09, monte: 1.2 }); texteFlottant(traduire('niveauPlus'), ev.x, ev.y - 0.6, '#9dffc0'); break;
      case 'vendu': jouer('vendu'); texteFlottant(`+${ev.gain}`, ev.x, ev.y - 0.3); particules(ev.x, ev.y, 8, 'rgba(200,200,255,.8)'); break;
      case 'tir': jouer(ev.type, ev.type === 'luciole' ? 0.07 : 0.12); break;
      case 'givre': jouer('givre', 0.2); anneau(ev.x, ev.y, 0.2, ev.portee, 'rgba(160,225,255,.9)', 0.45, { plein: 'rgba(160,225,255,.08)' }); break;
      case 'rayon': jouer('rayon', 0.1); effets.rayons.push({ ...ev, vie: 0.2, duree: 0.2 }); particules(ev.x2, ev.y2, 5, 'rgba(255,250,200,.9)'); break;
      case 'boum': jouer('boum', 0.1); anneau(ev.x, ev.y, 0.1, ev.zone, 'rgba(255,150,210,.9)', 0.35, { plein: 'rgba(255,150,210,.15)' }); particules(ev.x, ev.y, 10, 'rgba(255,170,220,.9)'); break;
      case 'impact': particules(ev.x, ev.y, 3, 'rgba(255,240,150,.9)', { duree: 0.3 }); break;
      case 'tink': jouer('tink', 0.15); particules(ev.x, ev.y - 0.2, 3, 'rgba(230,220,190,.9)', { duree: 0.25, vitesse: 2.5, taille: 0.03 }); break;
      case 'pouf':
        jouer(ev.boss ? 'grospouf' : 'pouf', ev.boss ? 0 : 0.05);
        particules(ev.x, ev.y, ev.boss ? 60 : 12, 'rgba(255,235,120,.95)', { monte: 1, duree: ev.boss ? 1.4 : 0.9, taille: ev.boss ? 0.09 : 0.06 });
        anneau(ev.x, ev.y, 0.05, ev.taille * 2, 'rgba(255,240,170,.8)', 0.3);
        texteFlottant(`+${ev.gain}`, ev.x, ev.y - 0.4, '#ffd95e', ev.boss ? 26 : 15);
        if (ev.boss) { secousse = 0.8; texteFlottant(traduire('bravo'), ev.x, ev.y - 1.1, '#ffffff', 30); }
        flash('i-or', 'gain');
        break;
      case 'divise': jouer('divise'); particules(ev.x, ev.y, 8, 'rgba(120,220,190,.8)'); break;
      case 'soin': particules(ev.x, ev.y - 0.2, 1, 'rgba(120,255,170,.9)', { monte: 1, vitesse: 0.2, etoile: true, taille: 0.07 }); break;
      case 'invoque': jouer('invoque'); anneau(ev.x, ev.y, 0.2, 1.2, 'rgba(150,110,255,.8)', 0.6); break;
      case 'fuite':
        jouer('fuite'); secousse = 0.6; flash('i-vies', 'secousse');
        texteFlottant(`-${ev.degat}`, partie.bastion.x, partie.bastion.y - 0.9, '#ff8a8a', 22);
        anneau(partie.bastion.x, partie.bastion.y, 0.2, 1.2, 'rgba(255,120,120,.8)', 0.5);
        break;
      case 'vague':
        jouer('vague');
        if (ev.bonus) texteFlottant(traduire('enAvance', { n: ev.bonus }), COLS / 2, ROWS / 2, '#9dffc0', 20);
        break;
      case 'lune':
        jouer('lune');
        anneau(ev.x, ev.y, 0.2, SORT.portee, 'rgba(220,230,255,1)', 0.6, { plein: 'rgba(200,215,255,.25)', epais: 0.12 });
        particules(ev.x, ev.y, 40, 'rgba(220,230,255,.95)', { etoile: true, taille: 0.09, vitesse: 2.5 });
        secousse = 0.4;
        break;
      case 'gagne': jouer('victoire'); lancerConfettis(); break;
      case 'perdu': jouer('defaite'); break;
    }
  }
  partie.evts.length = 0;
}
function flash(id, classe) {
  const el = $(id);
  el.classList.remove(classe); void el.offsetWidth; el.classList.add(classe);
}

/* ---------- Barre du bas et HUD ---------- */
let selApercu = null;
function iconeTour(type, niv = 0) {
  const c = document.createElement('canvas');
  c.width = 80; c.height = 80;
  const g = c.getContext('2d');
  g.setTransform(64, 0, 0, 64, 0, 0);
  dessinerTour(g, type, niv, 0.625, 0.72, 1);

}
function majBarre(force = false) {

  const etatVague = vagueDisponible(e) ? 'pret' : e.file.length ? 'cours' : 'fini';
  const cle = JSON.stringify([sel && sel.type, sel && (sel.tour ? sel.tour.id + '-' + sel.tour.niv : sel.c + '-' + sel.r), e.or, etatVague, e.vague, e.n, modeLune, e.ennemis.length > 0]);
  if (!force && cle === cleBarre) { majLune(); return; }

        b.appendChild(p);

        b.title = `${TOURS[type].nom} — ${TOURS[type].desc}`;
        b.addEventListener('pointerenter', () => { selApercu = type; });
        b.addEventListener('click', () => actionConstruire(type));
      }
      barre.appendChild(b);
    }
    barre.appendChild(boutonFermer());
  } else if (sel && sel.type === 'tour') {
    const t = sel.tour, T0 = TOURS[t.type];
    const fiche = document.createElement('div'); fiche.className = 'fiche';
    fiche.appendChild(iconeTour(t.type, t.niv));
    const d = document.createElement('div');
    d.innerHTML = `<b>${T0.nom}</b><span class="etoiles-tour">${'★'.repeat(t.niv + 1)}${'☆'.repeat(2 - t.niv)}</span><br>${T0.desc}`;
    fiche.appendChild(d);
    barre.appendChild(fiche);
    if (e.n >= NIVEAU_AMELIORER) {
      const a = document.createElement('button'); a.className = 'action ameliorer'; a.id = 'b-ameliorer';
      if (t.niv >= 2) { a.disabled = true; a.innerHTML = traduire('niveauMax'); }
      else {
        const prix = prixAmelioration(t);
        a.innerHTML = `${traduire('ameliorer')}<span class="prix">${ICONES.petiteLumiere}${prix}</span>`;
        if (e.or < prix) a.style.opacity = '.6';
        a.addEventListener('click', actionAmeliorer);
      }
      a.setAttribute('aria-label', traduire('ameliorerTour'));
      barre.appendChild(a);
    }
    const v = document.createElement('button'); v.className = 'action vendre';
    v.innerHTML = `${traduire('vendre')}<span class="prix">+${prixRevente(t)}</span>`;
    v.setAttribute('aria-label', traduire('vendreTour'));
    v.addEventListener('click', actionVendre);
    barre.appendChild(v);
    barre.appendChild(boutonFermer());
  } else {
    if (e.n >= SORT.niveau) {
      const l = document.createElement('button'); l.id = 'b-lune';
      l.setAttribute('aria-label', traduire('eclatLune'));
      l.innerHTML = `<div class="charge"></div>${ICONES.lune}`;
      if (modeLune) l.classList.add('actif');
      l.addEventListener('click', actionLune);
      barre.appendChild(l);
    }
    const aide = document.createElement('div'); aide.className = 'aide';
    if (modeLune) aide.innerHTML = traduire('aideLune');
    else if (e.vague === 0) aide.innerHTML = traduire('aideDebut');
    else if (etatVague === 'pret' && e.ennemis.length) aide.innerHTML = traduire('aideAvance', { n: BONUS_AVANCE, suite: apercuVague(e) });
    else if (etatVague === 'pret') aide.innerHTML = traduire('aideProchaine', { suite: apercuVague(e) });
    else if (etatVague === 'cours') aide.innerHTML = traduire('aideCours');
    else aide.innerHTML = traduire('aideDerniere');
    barre.appendChild(aide);
    const v = document.createElement('button'); v.id = 'b-vague';
    const total = e.def.vagues.length;
    if (etatVague === 'pret') {
      v.innerHTML = `${traduire(e.vague === 0 ? 'lancer' : 'suivante')} ▶<small>${traduire('vagueN', { n: e.vague + 1, total })}</small>`;
      if (!e.ennemis.length) v.classList.add('pulse');
    } else { v.disabled = true; v.innerHTML = traduire(etatVague === 'cours' ? 'enCours' : 'derniere'); }
    v.setAttribute('aria-label', traduire('lancerVague'));
    v.addEventListener('click', actionVague);
    barre.appendChild(v);
  }
  majLune();
}
// « 8 ombrelins, 4 papillons » : ce qui arrive à la prochaine vague.
// Noms courts (singulier / pluriel) : traductions court.<type>
function apercuVague(e) {
  const compte = {};
  for (const s of lireVague(e.def.vagues[e.vague])) compte[s.type] = (compte[s.type] || 0) + 1;
  return Object.entries(compte).map(([t, nb]) => (t === 'R' ? traduire('roiArrive') : traduire('court.' + t, { n: nb }))).join(', ');
}
function majLune() {
  const l = $('b-lune');
  if (!l || !partie) return;
  const k = partie.sortCharge / SORT.recharge;
  l.querySelector('.charge').style.height = (100 - k * 100) + '%';
  l.classList.toggle('pret', sortDisponible(partie));
}
function boutonFermer() {
  const b = document.createElement('button'); b.className = 'fermer'; b.textContent = '✕';
  b.setAttribute('aria-label', traduire('fermer'));
  b.addEventListener('click', () => { jouer('clic'); sel = null; majBarre(true); });
  return b;
}
let dernierHud = '';
function majHud() {
  const e = partie;
  const cle = `${e.vies}|${e.or}|${e.vague}`;
  if (cle === dernierHud) return;
  dernierHud = cle;
  $('t-vies').textContent = e.vies;
  $('t-or').textContent = e.or;
  $('t-vague').textContent = `${e.vague}/${e.def.vagues.length}`;
}

/* ---------- Actions du joueur ---------- */
function refuser(raison, x, y) {
  jouer('refus');
  if (raison === 'or') { texteFlottant(traduire('pasAssez'), x, y, '#ff9a9a', 15); flash('i-or', 'secousse'); }
}
function actionConstruire(type) {
  if (!sel || sel.type !== 'case') return;
  const r = construire(partie, type, sel.c, sel.r);
  if (r === 'ok') { sel = null; selApercu = null; }
  else refuser(r, sel.c + 0.5, sel.r);
  majBarre(true);
}
function actionAmeliorer() {
  if (!sel || sel.type !== 'tour') return;
  const r = ameliorer(partie, sel.tour);
  if (r !== 'ok') refuser(r, sel.tour.x, sel.tour.y - 0.5);
  majBarre(true);
}
function actionVendre() {
  if (!sel || sel.type !== 'tour') return;
  vendre(partie, sel.tour); sel = null; majBarre(true);
}
function actionVague() {
  if (lancerVague(partie)) { sel = null; majBarre(true); }
}
function actionLune() {
  if (!sortDisponible(partie)) { refuser('charge'); texteFlottant(traduire('recharge'), COLS / 2, ROWS - 1, '#dfe6ff', 16); return; }
  jouer('clic'); modeLune = !modeLune; sel = null; majBarre(true);
}
// Toucher la case (c, r) de la carte (ou position x, y en cases).
function toucherCase(x, y) {
  const c = Math.floor(x), r = Math.floor(y);
  if (modeLune) {
    if (lancerSort(partie, x, y)) { modeLune = false; majBarre(true); }
    return;
  }
  const t = tourEn(partie, c, r);
  if (t) { jouer('clic'); sel = sel && sel.tour === t ? null : { type: 'tour', tour: t }; }
  else if (caseLibre(partie, c, r)) {
    jouer('clic');
    sel = sel && sel.type === 'case' && sel.c === c && sel.r === r ? null : { type: 'case', c, r };
    selApercu = null;
  } else sel = null;
  majBarre(true);
}
canvas.addEventListener('pointerdown', (ev) => {
  if (ecran !== 'jeu' || enPause()) return;
  const rect = canvas.getBoundingClientRect();
  curseur = null;
  toucherCase((ev.clientX - rect.left) / T, (ev.clientY - rect.top) / T);
});

/* ---------- Clavier ---------- */
document.addEventListener('keydown', (ev) => {
  reveillerAudio();
  if (introActuelle && (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Escape')) { ev.preventDefault(); fermerIntro(); return; }
  if (tuto) { finirTuto(); return; }
  if (ecran !== 'jeu' || !partie) return;
  if (!$('bilan').classList.contains('cache') || !$('pause').classList.contains('cache')) {
    if (ev.key === 'Escape' && !$('pause').classList.contains('cache')) reprendre();
    return;
  }
  const fleches = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (fleches[ev.key]) {
    ev.preventDefault();
    if (!curseur) curseur = { c: 3, r: 5 };
    else {
      curseur.c = Math.max(0, Math.min(COLS - 1, curseur.c + fleches[ev.key][0]));
      curseur.r = Math.max(0, Math.min(ROWS - 1, curseur.r + fleches[ev.key][1]));
    }
    return;
  }
  if (ev.key === 'Enter') { ev.preventDefault(); if (!curseur) curseur = { c: 3, r: 5 }; toucherCase(curseur.c + 0.5, curseur.r + 0.5); return; }
  if (ev.key === ' ') { ev.preventDefault(); actionVague(); return; }
  if (ev.key === 'Escape') { if (sel || modeLune) { sel = null; modeLune = false; majBarre(true); } else ouvrirPause(); return; }
  if (/^[1-4]$/.test(ev.key) && sel && sel.type === 'case') { actionConstruire(ORDRE_TOURS[+ev.key - 1]); return; }
  if ((ev.key === 'a' || ev.key === 'A') && sel && sel.type === 'tour') { actionAmeliorer(); return; }
  if ((ev.key === 'v' || ev.key === 'V') && sel && sel.type === 'tour') { actionVendre(); return; }
  if (ev.key === 'l' || ev.key === 'L') actionLune();
});

/* ==========================================================================
   Déroulement : niveaux, intros, tutoriel, bilan
   ========================================================================== */
function demarrerNiveau(n) {

// Petite scène animée de la carte « Nouveau ! » (boucle de 4 s).
function dessinerIntro() {
  const sc = $('scene-intro'), g = sc.getContext('2d');
  const k = sc.height / 3.2;          // 3,2 cases de haut
  const L = sc.width / k;             // largeur en cases
  const t = (temps - introActuelle.debut) % 4;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, sc.width, sc.height);
  g.setTransform(k, 0, 0, k, 0, 0);
  const I = introActuelle;
  const route = (y) => { g.lineCap = 'butt'; g.strokeStyle = '#8f6d3f'; g.lineWidth = 0.86; g.beginPath(); g.moveTo(0, y); g.lineTo(L, y); g.stroke(); g.strokeStyle = '#c9a46a'; g.lineWidth = 0.72; g.stroke(); };
  const fauxEnnemi = (type, x, y, extra = {}) => ({ type, def: ENNEMIS[type], x, y, dx: 1, dy: 0, pv: 1, pvMax: 1, phase: x, lent: 1, lentT: 0, touche: 0, ...extra });
  if (I.tour) {
    route(2.2);
    const tx = L / 2, ty = 1.0;
    const ex = -0.5 + (t / 4) * (L + 1);
    const lent = I.tour === 'givre' && Math.abs(ex - tx) < 1.8;
    const en = fauxEnnemi(I.tour === 'phare' ? 'c' : 'n', ex, 2.2, lent ? { lent: 0.5, lentT: 1 } : {});
    const tirT = (t * 2) % 1;
    dessinerTour(g, I.tour, 0, tx, ty, temps, 0, tirT < 0.2 ? 0.15 : 0);
    if (Math.abs(ex - tx) < 2.5) {
      if (I.tour === 'givre') { g.strokeStyle = 'rgba(160,225,255,.8)'; g.lineWidth = 0.06; cercle(g, tx, ty, 0.3 + tirT * 1.6); g.stroke(); }
      else if (I.tour === 'phare') { if (tirT < 0.25) { g.strokeStyle = 'rgba(255,250,200,.9)'; g.lineWidth = 0.12; g.beginPath(); g.moveTo(tx, ty - 0.45); g.lineTo(ex, 2.2); g.stroke(); } }
      else {
        const px = tx + (ex - tx) * tirT, py = ty + (2.2 - ty) * tirT;
        lueur(g, px, py, 0.25, I.tour === 'fleur' ? 'rgba(255,140,200,.9)' : 'rgba(255,235,120,.9)');
        if (I.tour === 'fleur' && tirT > 0.85) { g.strokeStyle = 'rgba(255,150,210,.8)'; g.lineWidth = 0.06; cercle(g, ex, 2.2, 0.8); g.stroke(); }
      }
    }
    dessinerEnnemi(g, en, temps);
    if (I.tour === 'fleur') dessinerEnnemi(g, fauxEnnemi('n', ex - 0.6, 2.2), temps);
  } else if (I.ennemi) {
    route(2.0);
    const v = ENNEMIS[I.ennemi].vit;
    const ex = -0.8 + ((t / 4) * (0.6 + v)) % 1 * (L + 1.6);
    if (I.ennemi === 'd' && ex > L / 2) {
      dessinerEnnemi(g, fauxEnnemi('p', ex + 0.3, 1.85), temps);
      dessinerEnnemi(g, fauxEnnemi('p', ex - 0.3, 2.15), temps);
    } else {
      dessinerEnnemi(g, fauxEnnemi(I.ennemi, ex, 2.0), temps);
      if (I.ennemi === 'g') dessinerEnnemi(g, fauxEnnemi('n', ex - 0.8, 2.0, { pv: 0.5 + 0.5 * ((t * 0.5) % 1) }), temps);
      if (I.ennemi === 'R') { dessinerEnnemi(g, fauxEnnemi('n', ex - 1.2, 2.0), temps); dessinerEnnemi(g, fauxEnnemi('n', ex - 1.9, 2.0), temps); }
    }
    if (I.ennemi === 'c' && Math.sin(temps * 9) > 0.7) { g.fillStyle = '#fff'; etoile(g, ex, 1.4, 0.12); g.fill(); }
  } else if (I.scene === 'ameliorer') {
    const niv = Math.min(2, Math.floor(t / 1.2));
    dessinerTour(g, 'luciole', niv, L / 2 - 0.8, 1.7, temps);
    g.fillStyle = '#ffd95e'; g.font = '800 0.5px system-ui, sans-serif'; g.textAlign = 'center';
    g.fillText(traduire('niveauN', { n: niv + 1 }), L / 2 + 1.4, 1.8);
    dessinerMain(g, L / 2 - 0.5, 1.9 + (t % 1.2 < 0.3 ? 0.1 : 0), 0.9);
  } else if (I.scene === 'lune') {
    route(2.0);
    for (let i = 0; i < 4; i++) {
      if (t < 2.2) dessinerEnnemi(g, fauxEnnemi('n', 1 + i * 0.7 + t * 0.4, 2.0), temps);
    }
    if (t > 1.8 && t < 2.8) { const a = (t - 1.8); g.globalAlpha = 1 - a; g.fillStyle = 'rgba(220,230,255,.6)'; cercle(g, 3.2, 2.0, 0.3 + a * 1.6); g.fill(); g.globalAlpha = 1; }
    if (t > 2.2) { g.fillStyle = 'rgba(255,235,120,.9)'; for (let i = 0; i < 8; i++) { cercle(g, 2 + i * 0.4, 2 - (t - 2.2) * 1.2 - (i % 3) * 0.2, 0.06); g.fill(); } }
    dessinerMain(g, 3.3, 2.1 + (t > 1.5 && t < 1.9 ? 0.1 : 0), 0.9);
  } else if (I.scene === 'deux') {
    g.lineCap = 'round';
    const chemin = (pts) => { g.strokeStyle = '#8f6d3f'; g.lineWidth = 0.7; g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke(); g.strokeStyle = '#c9a46a'; g.lineWidth = 0.56; g.stroke(); };
    const mx = L / 2;
    chemin([[0, 0.6], [mx, 1.6], [L, 1.6]]); chemin([[0, 2.6], [mx, 1.6]]);
    const k2 = (t / 4);
    dessinerEnnemi(g, fauxEnnemi('n', k2 * mx, 0.6 + k2), temps);
    dessinerEnnemi(g, fauxEnnemi('r', k2 * mx, 2.6 - k2), temps);
    dessinerTour(g, 'luciole', 1, mx + 0.8, 0.7, temps);
  }
}
function dessinerMain(g, x, y, taille) {
  g.save(); g.translate(x, y); g.scale(taille / 56, taille / 56);
  g.fillStyle = '#fff4dc'; g.strokeStyle = '#3a2a40'; g.lineWidth = 2.5;
  const p = new Path2D('M20 30V8a5 5 0 0 1 10 0v14l3-1a5 5 0 0 1 4 1l2-1a5 5 0 0 1 5 2l1 0a5 5 0 0 1 5 5v10c0 9-7 16-16 16h-3c-6 0-10-3-13-8l-8-12a4.5 4.5 0 0 1 7-5z');
  g.translate(-25, -2);
  g.fill(p); g.stroke(p);
  g.restore();
}

/* ---------- Tutoriel animé (niveau 1) : 3 étapes, un toucher le passe ---------- */
function centreElement(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
function lancerTuto() {
  const e = partie;
  // case conseillée : la plus utile pour une Luciole
  let meilleure = { c: 2, r: 2 }, max = -1;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!caseLibre(e, c, r)) continue;
    const v = couverture(e, c, r, TOURS.luciole.niv[0].portee);
    if (v > max) { max = v; meilleure = { c, r }; }
  }
  tuto = { minuteurs: [], conseil: meilleure };
  $('tuto').classList.remove('cache');
  $('main').innerHTML = ICONES.main;
  const etapes = [
    { texte: traduire('tuto.0'), pos: () => centreElement($('zone')), action: () => {} },
    { texte: traduire('tuto.1'), pos: () => { const r = canvas.getBoundingClientRect(); return { x: r.left + (meilleure.c + 0.5) * T, y: r.top + (meilleure.r + 0.5) * T }; },
      action: () => { sel = { type: 'case', c: meilleure.c, r: meilleure.r }; majBarre(true); } },
    { texte: traduire('tuto.2'), pos: () => centreElement(document.querySelector('[data-t="luciole"]') || $('barre')),
      action: () => { const b = document.querySelector('[data-t="luciole"]'); if (b) b.classList.add('allume'); } },
    { texte: traduire('tuto.3'), avant: () => { sel = null; majBarre(true); }, pos: () => centreElement($('b-vague') || $('barre')), action: () => { $('b-vague')?.classList.add('pulse'); } },
  ];
  let delai = 0;
  etapes.forEach((et, i) => {
    tuto.minuteurs.push(setTimeout(() => {
      if (!tuto) return;
      if (et.avant) et.avant();
      $('bulle').innerHTML = `${et.texte}<small>${traduire('toucheEcran')}</small>`;
      const p = et.pos();
      const m = $('main');
      m.style.left = (p.x - 18) + 'px'; m.style.top = (p.y - 4) + 'px';
      m.classList.remove('tape');
      tuto.minuteurs.push(setTimeout(() => { if (!tuto) return; m.classList.add('tape'); jouer('clic'); et.action(); }, 700));
    }, delai));
    delai += i === 0 ? 1600 : 2200;
  });
  tuto.minuteurs.push(setTimeout(finirTuto, delai + 600));
}
function finirTuto() {
  if (!tuto) return;
  tuto.minuteurs.forEach(clearTimeout);
  tuto = null;
  $('tuto').classList.add('cache');
  sel = null; majBarre(true);
  const b = $('bandeau');
  b.innerHTML = `${traduire('aToi')}<small>${traduire('batisLuciole')}</small>`;
  b.classList.remove('montre'); void b.offsetWidth; b.classList.add('montre');
}
