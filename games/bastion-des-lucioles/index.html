/* ---------- Bilan ---------- */
let minuteursBilan = [];
function afficherBilan() {
  const e = partie, n = e.n;
  minuteursBilan.forEach(clearTimeout); minuteursBilan = [];
  sel = null; modeLune = false;
  const ancienRecord = sauve.records[n - 1] || 0;
  const record = e.gagne && e.score > ancienRecord;
  if (e.gagne) {
    sauve.etoiles[n - 1] = Math.max(sauve.etoiles[n - 1] || 0, e.etoiles);
    if (record) sauve.records[n - 1] = e.score;
    sauve.debloque = Math.max(sauve.debloque, Math.min(NIVEAUX.length, n + 1));
    enregistrer();
  }
  const fin = e.gagne && n === NIVEAUX.length;
  $('bilan-titre').textContent = fin ? traduire('valleeSauvee') : e.gagne ? traduire('niveauReussi', { n }) : traduire('lanternesEteintes');
  $('bilan-texte').textContent = fin
    ? traduire('finTexte', { n: totalEtoiles(), max: NIVEAUX.length * 3 })
    : e.gagne ? traduire(e.etoiles === 3 ? 'parfait' : 'bravo3')
    : traduire('pasGrave');
  $('bilan-detail').innerHTML = e.gagne
    ? traduire('arretees', { n: e.arretes }) + ' · ' + traduire('allumees', { n: e.vies })
    : traduire('vagueAtteinte', { n: e.vague, total: e.def.vagues.length }) + ' · ' + traduire('arretees', { n: e.arretes });
  const etoiles = [...document.querySelectorAll('.grandes-etoiles span')];
  etoiles.forEach((s) => s.classList.remove('on'));
  $('bilan-record').textContent = ''; $('bilan-record').classList.remove('nouveau');
  $('bilan-score').textContent = '0';
  $('b-suivant').classList.toggle('cache', !e.gagne || n >= NIVEAUX.length);
  $('bilan').classList.remove('cache');
  // étoiles une à une, puis le score qui défile
  for (let i = 0; i < (e.gagne ? e.etoiles : 0); i++) {
    minuteursBilan.push(setTimeout(() => { etoiles[i].classList.add('on'); jouer('etoile'); }, 500 + i * 450));
  }
  const cible = e.gagne ? e.score : e.lumiere;
  const debut = performance.now();
  const defiler = () => {
    const k = Math.min(1, (performance.now() - debut) / 1300);
    $('bilan-score').textContent = Math.round(cible * (1 - (1 - k) ** 3));
    if (k < 1) requestAnimationFrame(defiler);
    else {
      if (record) { $('bilan-record').textContent = traduire(ancienRecord ? 'nouveauRecord' : 'premierRecord'); $('bilan-record').classList.add('nouveau'); jouer('etoile'); }
      else if (e.gagne) $('bilan-record').textContent = traduire('recordN', { n: ancienRecord });
    }
  };
  requestAnimationFrame(defiler);
  if (fin) lancerConfettis(250);
}

/* ---------- Confettis ---------- */
const confCanvas = $('confettis'), confCtx = confCanvas.getContext('2d');
let confettis = [];
function lancerConfettis(nb = 140) {
  confCanvas.width = innerWidth * dpr; confCanvas.height = innerHeight * dpr;
  const coul = ['#ffd95e', '#ff8fc8', '#8fd8ff', '#9dffc0', '#ffffff', '#c8a8ff'];
  for (let i = 0; i < nb; i++) {
    confettis.push({ x: innerWidth * Math.random(), y: -20 - Math.random() * innerHeight * 0.5, vx: (Math.random() - 0.5) * 80, vy: 80 + Math.random() * 140,
      a: Math.random() * 6, va: (Math.random() - 0.5) * 10, c: coul[i % coul.length], t: 5 + Math.random() * 6 });
  }
}
function majConfettis(dt) {
  if (!confettis.length) return;
  confCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  confCtx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of confettis) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt; p.vx *= 0.99;
    confCtx.save(); confCtx.translate(p.x, p.y); confCtx.rotate(p.a);
    confCtx.fillStyle = p.c; confCtx.fillRect(-p.t / 2, -p.t / 4, p.t, p.t / 2);
    confCtx.restore();
  }
  confettis = confettis.filter((p) => p.y < innerHeight + 30);
  if (!confettis.length) confCtx.clearRect(0, 0, innerWidth, innerHeight);
}

function dessinerAccueil() {

  if (!c.width) return;
  const k = c.height / 4.4, L = c.width / k;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
  g.setTransform(k, 0, 0, k, 0, 0);
  // colline et chemin
  g.fillStyle = '#1d4a35'; g.beginPath(); g.ellipse(L / 2, 4.6, L * 0.7, 1.6, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#c9a46a'; g.lineWidth = 0.4; g.lineCap = 'round';

  g.fillStyle = '#e8ecff'; cercle(g, L - 0.8, 0.8, 0.35); g.fill();

  // bastion (en grand)
  g.save(); g.translate(L / 2, 2.6); g.scale(2.2, 2.2);
  dessinerBastion(g, 0, 0, temps, VIES);
  g.restore();
  dessinerTour(g, 'luciole', 2, L / 2 - 1.9, 3.3, temps);
  dessinerTour(g, 'phare', 1, L / 2 + 1.9, 3.4, temps);
  // un ombrelin qui s'approche timidement
  const ex = 0.6 + ((temps * 0.25) % 1) * 1.2;
  dessinerEnnemi(g, { type: 'n', def: ENNEMIS.n, x: ex, y: 3.9 - ex * 0.25, dx: 1, dy: 0, pv: 1, pvMax: 1, phase: 0, lent: 1, lentT: 0, touche: 0 }, temps);
  // lucioles
  for (let i = 0; i < 14; i++) {
    const x = (i * 1.37 + Math.sin(temps * 0.5 + i) * 0.4) % L, y = 0.4 + (i * 0.73) % 2.6 + Math.cos(temps * 0.7 + i * 2) * 0.2;
    lueur(g, x, y, 0.16, `rgba(255,235,120,${0.5 + 0.4 * Math.sin(temps * 3 + i)})`);
  }
}

/* ---------- Boucle principale ---------- */
let dernier = performance.now();
function boucle(maintenant) {
  const dt = Math.min(0.05, Math.max(0, (maintenant - dernier) / 1000));
  dernier = maintenant;
  temps += dt;
  if (ecran === 'jeu' && partie) {
    if (!enPause()) {
      for (let i = 0; i < vitesse; i++) majPartie(partie, dt);
      traiterEvenements();
      majEffets(dt * vitesse);
      if ((partie.gagne || partie.perdu) && !finTimer) finTimer = 1.3;
      if (finTimer > 0) { finTimer -= dt; if (finTimer <= 0) { finTimer = -1; afficherBilan(); } }
    }
    dessinerJeu(); majHud(); majBarre();
  }
  if (ecran === 'accueil') dessinerAccueil();
  if (introActuelle) dessinerIntro();
  majConfettis(dt);
  requestAnimationFrame(boucle);
}

// Premier geste : on réveille le son (jamais avant).
document.addEventListener('pointerdown', reveillerAudio, { capture: true });
document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', (ev) => {
  ev.stopPropagation();
  reveillerAudio();
  sauve.son = !sauve.son; enregistrer(); majBoutonsSon(); jouer('clic');
}));

remplirIcones();
majBoutonsSon();
ouvrirAccueil();
requestAnimationFrame(boucle);
</script>
