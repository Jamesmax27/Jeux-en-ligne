  // Dessine le véhicule v centré en (x, y), de largeur environ 120 × k.
  function vehicule(c, v, x, y, k) {
    c.save(); c.translate(x, y); c.scale(k, k);
    c.lineCap = 'round'; c.lineJoin = 'round';
    const f = DESSINS[VEH[v].id];
    if (f) f(c);
    c.restore();
  }

  // Ombre du véhicule (silhouette pleine).
  const tampon = document.createElement('canvas');
  function silhouette(c, v, x, y, k, coul) {
    const w = Math.ceil(140 * k), h = Math.ceil(110 * k);
    if (w < 2 || h < 2) return;
    tampon.width = w; tampon.height = h;
    const t = tampon.getContext('2d');
    t.clearRect(0, 0, w, h);
    vehicule(t, v, w / 2, h / 2, k);
    t.globalCompositeOperation = 'source-in';
    t.fillStyle = coul || '#1d2340';
    t.fillRect(0, 0, w, h);
    t.globalCompositeOperation = 'source-over';
    c.drawImage(tampon, x - w / 2, y - h / 2);
  }

  // Gros plan : un morceau du véhicule, très agrandi (z : point visé).
  const POINTS_ZOOM = [[-30, -12], [30, -12], [0, 12], [-32, 20], [32, 20], [0, -24]];
  function grosPlan(c, v, z, W, H) {
    const p = POINTS_ZOOM[z % POINTS_ZOOM.length];
    const k = Math.max(W / 44, H / 30);
    c.save();
    c.beginPath(); c.rect(0, 0, W, H); c.clip();
    c.fillStyle = '#f2f6fc'; c.fillRect(0, 0, W, H);
    vehicule(c, v, W / 2 - p[0] * k, H / 2 - p[1] * k, k);
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Locomotives des joueurs (6 modèles, à la couleur de la place)
  // ---------------------------------------------------------------------

  // Dessine une locomotive tournée vers la droite, centrée en (x, y), longue d'environ 80 × k.
  function loco(c, modele, coul, fonce, x, y, k, t) {
    c.save(); c.translate(x, y); c.scale(k, k);
    c.lineCap = 'round'; c.lineJoin = 'round';
    const or = modele === 5;
    const corps = or ? '#f2c230' : coul, ombre = or ? '#a87b00' : fonce;
    const fumee = (cx, cy) => {
      const tt = (t || 0) / 1000;
      for (let i = 0; i < 3; i++) {
        const ph = (tt * 0.9 + i / 3) % 1;
        c.globalAlpha = 0.65 * (1 - ph);
        rond(c, cx - ph * 14, cy - ph * 26, 4 + ph * 7); plein(c, '#eef2f7');
      }
      c.globalAlpha = 1;
    };
    if (modele === 0 || modele === 5) {            // vapeur
      if (t !== undefined) fumee(20, -30);
      rr(c, -16, -12, 50, 24, 11); plein(c, corps, CONTOUR);
      rr(c, -40, -26, 26, 40, 4); plein(c, corps, CONTOUR);
      rr(c, -43, -30, 32, 6, 3); plein(c, ombre);
      vitre(c, -35, -20, 15, 12, 3);
      rr(c, 16, -28, 10, 18, 3); plein(c, ombre);
      poly(c, [34, 6, 44, 18, 34, 18]); plein(c, ombre);
      roue(c, -28, 18, 8); roue(c, -6, 18, 8); roue(c, 16, 18, 8);
      if (or) { c.fillStyle = '#fffbe0'; for (let i = 0; i < 3; i++) { const a = (t || 0) / 300 + i * 2.1; rond(c, Math.cos(a) * 26, -6 + Math.sin(a) * 14, 2); c.fill(); } rr(c, -16, 2, 50, 4, 1); plein(c, coul); }
    } else if (modele === 1) {                    // diesel
      rr(c, -40, -22, 78, 36, 6); plein(c, corps, CONTOUR);
      rr(c, -40, 2, 78, 6, 0); plein(c, '#ffffff');
      vitre(c, 22, -16, 12, 12, 3); vitre(c, -34, -16, 12, 12, 3);
      for (let i = 0; i < 3; i++) { rr(c, -16 + i * 10, -16, 6, 12, 1); plein(c, ombre); }
      rr(c, -42, 14, 82, 4, 1); plein(c, '#3a3f4b');
      roue(c, -26, 20, 7); roue(c, -12, 20, 7); roue(c, 12, 20, 7); roue(c, 26, 20, 7);
    } else if (modele === 2) {                    // rapide, nez pointu
      poly(c, [-42, -18, 14, -18, 42, 6, 42, 14, -42, 14]); plein(c, corps, CONTOUR);
      poly(c, [16, -14, 32, 0, 16, 0]); plein(c, '#bfe6ff');
      rr(c, -42, 0, 70, 5, 0); plein(c, '#ffffff');
      for (let i = 0; i < 3; i++) vitre(c, -36 + i * 14, -12, 9, 8, 2);
      roue(c, -28, 18, 6); roue(c, -14, 18, 6); roue(c, 18, 18, 6); roue(c, 32, 18, 6);
    } else if (modele === 3) {                    // locomotive jouet (avec un visage)
      if (t !== undefined) fumee(14, -26);
      rr(c, -34, -24, 24, 36, 6); plein(c, corps, CONTOUR);
      rr(c, -38, -28, 32, 6, 3); plein(c, ombre);
      rr(c, -12, -10, 40, 22, 10); plein(c, corps, CONTOUR);
      rr(c, 10, -24, 9, 14, 3); plein(c, ombre);
      rond(c, 28, 1, 10); plein(c, '#fff3e0', CONTOUR);
      rond(c, 25, -2, 1.8); plein(c, '#24272e'); rond(c, 31, -2, 1.8); plein(c, '#24272e');
      c.beginPath(); c.arc(28, 3, 4, 0.2, Math.PI - 0.2); c.strokeStyle = '#24272e'; c.lineWidth = 1.6; c.stroke();
      roue(c, -24, 17, 9); roue(c, 2, 17, 9);
    } else {                                      // électrique avec pantographe
      ligne(c, [-12, -22, -2, -34, 8, -22], '#3a3f4b', 2.4); ligne(c, [-16, -34, 12, -34], '#3a3f4b', 3);
      rr(c, -38, -22, 76, 36, 10); plein(c, corps, CONTOUR);
      rr(c, -38, -2, 76, 5, 0); plein(c, '#f6c21c');
      vitre(c, 24, -16, 11, 12, 3); vitre(c, -35, -16, 11, 12, 3);
      rr(c, -14, -16, 28, 10, 2); plein(c, ombre);
      roue(c, -24, 19, 7); roue(c, -10, 19, 7); roue(c, 10, 19, 7); roue(c, 24, 19, 7);
    }
    c.restore();
  }
  function modeleDe(s) { return partie && s === partie.siege ? prog.loco : 0; }

  // Médaillon d'une place : sa locomotive sur un disque de sa couleur.
  function medaillon(c, s, x, y, r, modele) {
    rond(c, x, y, r); plein(c, COUL_C[s]);
    c.lineWidth = Math.max(2, r * 0.1); c.strokeStyle = COUL[s]; c.stroke();
    loco(c, modele || 0, COUL[s], COUL_F[s], x, y + r * 0.05, r / 52);
  }

  function couronne(c, x, y, k) {
    c.save(); c.translate(x, y); c.scale(k / 24, k / 24);
    poly(c, [-20, 0, -22, -22, -10, -10, 0, -26, 10, -10, 22, -22, 20, 0]);
    plein(c, '#ffc21a', '#a26a00');
    rond(c, 0, -26, 3); plein(c, '#e2483d');
    c.restore();
  }

  // Petite gare d'une place et grande gare centrale.
  function petiteGare(c, x, y, h, coul, fonce) {
    const w = h * 0.9;
    rr(c, x - w / 2, y - h * 0.15, w, h * 0.55, 3); plein(c, '#fdf3e1', CONTOUR);
    poly(c, [x - w * 0.62, y - h * 0.12, x, y - h * 0.5, x + w * 0.62, y - h * 0.12]); plein(c, coul, CONTOUR);
    rr(c, x - w * 0.14, y + h * 0.08, w * 0.28, h * 0.32, 2); plein(c, fonce);
  }
  function grandeGare(c, x0, y0, w, h) {
    // Façade, toit en arc, horloge sans chiffres, drapeaux.
    rr(c, x0, y0 + h * 0.18, w, h * 0.82, 6); plein(c, '#f3e2c4', CONTOUR);
    c.beginPath(); c.moveTo(x0 - 2, y0 + h * 0.2); c.quadraticCurveTo(x0 + w / 2, y0 - h * 0.08, x0 + w + 2, y0 + h * 0.2); c.closePath(); plein(c, '#c0573a', CONTOUR);
    const cx = x0 + w / 2, cy = y0 + h * 0.2, r = Math.min(w * 0.26, h * 0.1);
    rond(c, cx, cy, r); plein(c, '#ffffff', CONTOUR);
    for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; ligne(c, [cx + Math.cos(a) * r * 0.75, cy + Math.sin(a) * r * 0.75, cx + Math.cos(a) * r * 0.9, cy + Math.sin(a) * r * 0.9], '#3a3f4b', 1); }
    ligne(c, [cx, cy, cx, cy - r * 0.65], '#3a3f4b', 1.6); ligne(c, [cx, cy, cx + r * 0.45, cy + r * 0.1], '#3a3f4b', 1.6);
    for (let i = 0; i < 4; i++) {
      const yy = y0 + h * 0.34 + i * h * 0.16;
      rr(c, x0 + w * 0.16, yy, w * 0.68, h * 0.11, w * 0.2); plein(c, '#7b5a3a');
    }
    ligne(c, [x0 + 4, y0 + h * 0.16, x0 + 4, y0 - h * 0.02], '#5c6270', 1.6); poly(c, [x0 + 4, y0 - h * 0.02, x0 + 14, y0 + h * 0.02, x0 + 4, y0 + h * 0.06]); plein(c, '#2f6fe0');
    ligne(c, [x0 + w - 4, y0 + h * 0.16, x0 + w - 4, y0 - h * 0.02], '#5c6270', 1.6); poly(c, [x0 + w - 4, y0 - h * 0.02, x0 + w + 6, y0 + h * 0.02, x0 + w - 4, y0 + h * 0.06]); plein(c, '#e2483d');
  }

  // Décor de chaque paysage (fond de la carte des voies).
  function decor(c, pay, W, H, graine) {
    const al = graineHasard(graine || 7);
    const fonds = [['#bfe59a', '#a8d884'], ['#d6e4d0', '#b8cdb4'], ['#e9dcb8', '#d9c99c'], ['#d3d8e2', '#bcc3d1']];
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, fonds[pay][0]); g.addColorStop(1, fonds[pay][1]);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 26; i++) {
      const x = al() * W, y = al() * H, k = 0.6 + al() * 0.8;
      if (pay === 0) { rond(c, x, y, 2.2 * k); plein(c, ['#fff7a8', '#ffffff', '#f7a8c8'][i % 3]); }
      else if (pay === 1) { poly(c, [x - 9 * k, y + 6 * k, x, y - 8 * k, x + 9 * k, y + 6 * k]); plein(c, '#9fb39b'); poly(c, [x - 3 * k, y - 3 * k, x, y - 8 * k, x + 3 * k, y - 3 * k]); plein(c, '#ffffff'); }
      else if (pay === 2) { c.beginPath(); c.arc(x, y, 6 * k, Math.PI * 0.15, Math.PI * 0.85); c.strokeStyle = '#6fb0e8'; c.lineWidth = 2; c.stroke(); }
      else { rr(c, x, y, 8 * k, 12 * k, 1); plein(c, '#aab2c2'); rr(c, x + 2 * k, y + 2 * k, 2 * k, 2 * k, 0); plein(c, '#fff7c2'); }
    }
  }

  // ---------------------------------------------------------------------
  //  La carte des voies (une voie par place, de la petite gare à la grande)
  // ---------------------------------------------------------------------

  function geometrieCarte(e, W, H) {
    const n = e.p.length;
    const gL = Math.min(44, W * 0.11), gR = Math.min(68, W * 0.16);
    const x0 = gL + 8, x1 = W - gR - 6;
    return { n, gL, gR, x0, x1, sw: (x1 - x0) / e.L, top: 4, lh: (H - 8) / n };
  }

  // e : état ; o : { pos (positions affichées), moi, actif, t, anims, modeles }
  function dessinerCarte(c, e, W, H, o) {
    const pay = NIVEAUX[e.n] ? NIVEAUX[e.n].p : 0;
    const g = geometrieCarte(e, W, H), t = o.t || 0;
    decor(c, pay, W, H, e.n * 31 + 5);
    // Rivières sous les ponts.
    e.B.forEach((b) => {
      const xa = g.x0 + b * g.sw;
      c.fillStyle = '#5fb2ec'; c.fillRect(xa - 3, 0, g.sw + 6, H);
      c.strokeStyle = '#bfe3ff'; c.lineWidth = 1.5;
      for (let k = 0; k < 6; k++) { const yy = ((k * H / 6 + t * 0.02) % H); c.beginPath(); c.moveTo(xa + 2, yy); c.quadraticCurveTo(xa + g.sw / 2, yy + 4, xa + g.sw - 2, yy); c.stroke(); }
    });
    for (let s = 0; s < g.n; s++) {
      const y = g.top + (s + 0.5) * g.lh, bh = Math.max(8, g.lh * 0.36);
      if (s === o.actif) { rr(c, g.x0 - 6, y - g.lh * 0.48, g.x1 - g.x0 + 12, g.lh * 0.96, 8); c.fillStyle = 'rgba(255,255,255,.55)'; c.fill(); }
      if (s === o.moi) { rr(c, g.x0 - 6, y - g.lh * 0.48, g.x1 - g.x0 + 12, g.lh * 0.96, 8); c.strokeStyle = '#f0a400'; c.lineWidth = 2; c.stroke(); }
      // Ballast.
      for (let i = 0; i < e.L; i++) {
        if (e.B.indexOf(i) >= 0) continue;
        rr(c, g.x0 + i * g.sw + 1, y - bh / 2, g.sw - 2, bh, 3);
        c.fillStyle = 'rgba(120,105,85,.28)'; c.fill();
      }
      // Rails posés, moitiés de pont, rails à poser.
      for (let i = 0; i < e.L; i++) {
        const xa = g.x0 + i * g.sw, pont = e.B.indexOf(i) >= 0;
        const fait = i < e.p[s], moitie = pont && !fait && e.po[s] === i && e.p[s] === i;
        const cleA = s + ':' + i, ta = o.anims && o.anims[cleA];
        let q = 1;
        if (ta !== undefined) q = Math.min(1, Math.max(0, (t - ta) / 350));
        if (fait || moitie) {
          const larg = moitie ? g.sw / 2 : g.sw;
          c.save();
          if (q < 1) { c.translate(xa + larg / 2, y); c.scale(q, q); c.translate(-(xa + larg / 2), -y); }
          if (pont) { rr(c, xa - 1, y - bh * 0.7, larg + 2, bh * 1.4, 2); plein(c, '#b07a45', CONTOUR); for (let k = 1; k < 4; k++) ligne(c, [xa + larg * k / 4, y - bh * 0.7, xa + larg * k / 4, y + bh * 0.7], '#8a5a2e', 1.4); }
          const nbT = Math.max(2, Math.round(larg / 9));
          for (let k = 0; k < nbT; k++) { const xt = xa + (k + 0.5) * larg / nbT; rr(c, xt - 2, y - bh * 0.55, 4, bh * 1.1, 1); plein(c, '#7a5534'); }
          ligne(c, [xa, y - bh * 0.3, xa + larg, y - bh * 0.3], COUL_F[s], 2.4);
          ligne(c, [xa, y + bh * 0.3, xa + larg, y + bh * 0.3], COUL_F[s], 2.4);
          c.restore();
        } else if (!pont) {
          c.setLineDash([3, 5]);
          ligne(c, [xa + 3, y, xa + g.sw - 3, y], 'rgba(60,70,90,.35)', 2);
          c.setLineDash([]);
        }
      }
      // Passages à niveau.
      e.X.forEach((x, xi) => {
        const xa = g.x0 + x * g.sw;
        const ferme = e.bo[xi] >= 0 && e.bo[xi] !== s && e.lv[s].indexOf(xi) < 0 && e.p[s] <= x;
        const hp = g.lh * 0.42;
        rr(c, xa - 2.5, y - hp, 5, hp * 0.95, 1); plein(c, '#3a3f4b');
        rond(c, xa, y - hp, 3.2); plein(c, ferme ? ((Math.floor(t / 400) % 2) ? '#ff3b30' : '#ffb3a6') : '#9aa2b0');
        c.save(); c.translate(xa, y - hp * 0.35);
        c.rotate(ferme ? 0 : -Math.PI / 2 + 0.25);
        const lb = Math.min(g.sw * 1.1, hp * 1.6);
        rr(c, -lb / 2, -2.5, lb, 5, 2); plein(c, '#ffffff', '#c62828');
        for (let k = 0; k < 3; k++) { rr(c, -lb / 2 + k * lb / 3 + lb / 12, -2.5, lb / 8, 5, 0); plein(c, '#e53935'); }
        c.restore();
      });
      // Petite gare.
      petiteGare(c, g.gL / 2 + 2, y, Math.min(g.lh * 0.82, g.gL), COUL[s], COUL_F[s]);
    }
    grandeGare(c, W - g.gR - 2, 2, g.gR, H - 4);
    // Locomotives (par-dessus les voies).
    for (let s = 0; s < g.n; s++) {
      const y = g.top + (s + 0.5) * g.lh;
      const hl = Math.min(g.lh * 0.82, 40), k = hl / 52;
      const pos = o.pos ? o.pos[s] : e.p[s];
      const xn = g.x0 + pos * g.sw;
      const saut = s === o.actif ? Math.abs(Math.sin(t / 220)) * hl * 0.06 : 0;
      loco(c, o.modeles ? o.modeles[s] : 0, COUL[s], COUL_F[s], Math.max(g.x0 - 2, xn - 34 * k), y - 4 * k - saut, k, t + s * 400);
    }
  }

  // ---------------------------------------------------------------------
  //  Les wagons-questions (cartes à choisir)
  // ---------------------------------------------------------------------

  function iconeType(c, k, x, y, r) {
    c.save(); c.translate(x, y); c.scale(r / 20, r / 20);
    rond(c, 0, 0, 20); plein(c, '#ffffff', CONTOUR);
    if (k === 'bruit') {
      poly(c, [-10, -5, -4, -5, 4, -12, 4, 12, -4, 5, -10, 5]); plein(c, '#3a3f4b');
      for (let i = 0; i < 2; i++) { c.beginPath(); c.arc(4, 0, 7 + i * 5, -0.8, 0.8); c.strokeStyle = '#2f6fe0'; c.lineWidth = 2.4; c.stroke(); }
    } else if (k === 'usage') {
      c.fillStyle = '#e89a00';
      for (let i = 0; i < 8; i++) { c.save(); c.rotate(i * Math.PI / 4); rr(c, -3, -15, 6, 7, 1); c.fill(); c.restore(); }
      rond(c, 0, 0, 10); plein(c, '#e89a00'); rond(c, 0, 0, 4); plein(c, '#ffffff');
    } else if (k === 'ombre') {
      silhouetteMini(c);
    } else {
      rond(c, -3, -3, 9); c.strokeStyle = '#3a3f4b'; c.lineWidth = 3.5; c.stroke();
      rond(c, -3, -3, 7); plein(c, '#cfe9ff');
      ligne(c, [4, 4, 12, 12], '#3a3f4b', 5);
    }
    c.restore();
  }
  // Petite voiture noire (icône « ombre »).

  function dessinerJeu(t, dt) {
    const cv = $('carte'), boite = $('carte-boite');
    const w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { decor(c, 0, w, h, 3); return; }
    const moi = partie ? partie.siege : -1;
    const actif = partie && partie.phase === 'jeu' && vue.g < 0 ? R.aQui(vue) : -1;
    const modeles = [0, 1, 2, 3].map(modeleDe);
    c.save();
    rr(c, 0, 0, w, h, 14); c.clip();
    dessinerCarte(c, vue, w, h, { pos: pos, moi: moi, actif: actif, t: t, anims: animsRails, modeles: modeles });
    c.restore();
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      etincelle(c, p.x, p.y, p.k);
      c.globalAlpha = 1;
    }

    c.closePath(); c.fill();

  function cleZone() {
    if (!vue || !partie) return 'vide';
    if (attenteTuto) return 'tuto';
    if (partie.phase !== 'jeu') return 'attente|' + partie.phase;
    const e = vue;
    if (e.g >= 0 || e.coups >= e.max) return 'fin';
    const mien = partie.monTour() ? 'm' : 'o';
    if (e.ph === 'choix') return 'c|' + e.tour + '|' + mien + '|' + e.w.map((w) => w.id).join(',');
    if (e.ph === 'rep') return 'r|' + e.tour + '|' + mien + '|' + e.w[e.ch].id;
    return 'k|' + e.tour + '|' + mien + '|' + e.coups + '|' + e.p.join(',');
  }

  function majZone(force) {
    const cle = cleZone();
    if (!force && cle === zoneCle) return;
    if (!force && performance.now() < zoneTenir) return;
    if (cle === 'fin' && zoneCle !== 'vide') { zoneCle = cle; return; }   // on garde la dernière réponse à l'écran
    construireZone(cle);

    return tr('q.' + w.k);
  }
  function nomWagon(w) { return tr('wagon.' + w.k); }
  function sousWagon(w) { return w.x ? tr('wagon.express') : w.a ? tr('wagon.aiguillage') : tr('wagon.normal'); }

  function construireZone(cle) {
    zoneCle = cle;
    zoneJeton++;
    const zq = $('zq');
    zq.textContent = '';
    zq.classList.remove('image', 'badges');
    const e = vue;
    if (cle === 'vide' || cle === 'tuto' || cle.indexOf('attente') === 0 || cle === 'fin' || !e) return;
    const mien = partie.monTour() && !enPause;
    const s = e.tour;
    if (e.ph === 'choix') construireWagons(zq, e, mien, s);
    else if (e.ph === 'rep') construireQuestion(zq, e.w[e.ch], mien, s, e);
    else construireCibles(zq, e, mien, s);
    requestAnimationFrame(repeindreZone);
  }

  function construireWagons(zq, e, mien, s) {
    const titre = document.createElement('p'); titre.className = 'zq-titre';
    titre.textContent = mien ? tr('zone.choisis') : tr('zone.choixAutre', { qui: quiEst(s) });
    const liste = document.createElement('div'); liste.className = 'zq-wagons';
    e.w.forEach((w, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'wagon' + (w.x ? ' express' : w.a ? ' aig' : '');
      b.dataset.i = String(i);
      const cv = document.createElement('canvas');
      cv.peinture = (c, W, H) => dessinerWagon(c, w, W, H);
      const n1 = document.createElement('span'); n1.className = 'nom'; n1.textContent = nomWagon(w);
      const n2 = document.createElement('span'); n2.className = 'sous'; n2.textContent = sousWagon(w) + (w.t ? ' · ' + tr('wagon.tunnel') : '');
      b.append(cv, n1, n2);
      b.setAttribute('aria-label', tr('wagon.aria', { n: i + 1, type: nomWagon(w), detail: n2.textContent }));
      b.disabled = !mien;
      b.addEventListener('click', () => { audio(); sons.clic(); jouerAction({ w: i }); });
      liste.appendChild(b);
    });
    zq.append(titre, liste);
    if (mien) { const aide = document.createElement('p'); aide.className = 'zq-aide'; aide.textContent = tr('zone.aideChoix'); zq.appendChild(aide); }
  }

  function construireQuestion(zq, w, mien, s, e, fige) {
    const titre = document.createElement('p'); titre.className = 'zq-titre';
    titre.textContent = texteQuestion(w);
    zq.appendChild(titre);
    const badges = document.createElement('div'); badges.className = 'zq-badges';
    const ajouterBadge = (texte, classe) => { const b = document.createElement('span'); b.className = 'badge ' + (classe || ''); b.textContent = texte; badges.appendChild(b); };
    if (!mien) ajouterBadge(tr('zone.repondAutre', { qui: quiEst(s) }));
    if (w.x) ajouterBadge(tr('wagon.express'), 'express');
    if (w.a) ajouterBadge(tr('wagon.aiguillage'), 'aig');
    if (w.t) ajouterBadge(tr('wagon.tunnel'), 'tunnel');
    if (e && e.B.indexOf(e.p[s]) >= 0) ajouterBadge(e.po[s] === e.p[s] ? tr('badge.pontFin') : tr('badge.pontDebut'));
    if (e && barriereDevant(e, s)) ajouterBadge(tr('badge.barriere'));
    if (badges.childNodes.length) zq.appendChild(badges);
    zq.classList.toggle('badges', badges.childNodes.length > 0);
    zq.classList.toggle('image', w.k === 'ombre' || w.k === 'zoom');
    // Ce qu'il faut reconnaître.
    if (w.k !== 'usage') {
      const cible = document.createElement('div'); cible.className = 'zq-cible';
      if (w.k === 'bruit') {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.id = 'btn-ecouter';
        b.textContent = '🔊 ' + tr('zone.ecouter');
        b.addEventListener('click', () => bruitVehicule(w.v));
        cible.appendChild(b);
        if (!prog.options.son) { const bulle = document.createElement('span'); bulle.className = 'bulle-son'; bulle.textContent = tr('bruit.' + VEH[w.v].id); cible.appendChild(bulle); }
        if (!fige) setTimeout(() => { if (zoneCle.indexOf('r|') === 0) bruitVehicule(w.v); }, 250);
      } else {
        const boite = document.createElement('div'); boite.className = 'boite-image';
        const cv = document.createElement('canvas');
        cv.setAttribute('aria-hidden', 'true');
        cv.peinture = (c, W, H) => {
          c.fillStyle = '#f2f6fc'; c.fillRect(0, 0, W, H);
          if (w.k === 'ombre') silhouette(c, w.v, W / 2, H / 2, Math.min(W / 130, H / 92));
          else grosPlan(c, w.v, w.z, W, H);
        };
        boite.appendChild(cv);
        if (w.t) {
          const tun = document.createElement('canvas'); tun.className = 'tunnel'; tun.setAttribute('aria-hidden', 'true');
          tun.peinture = (c, W, H) => dessinerTunnel(c, W, H);
          boite.appendChild(tun);
          if (!fige) {
            const j = zoneJeton, duree = NIVEAUX[e ? e.n : 0].fl;
            setTimeout(() => { if (j === zoneJeton) { boite.classList.add('cache'); sons.tunnel(); } }, duree);
          }
        }
        cible.appendChild(boite);
      }
      zq.appendChild(cible);
    }
    // Les réponses : des véhicules dessinés.
    const grille = document.createElement('div'); grille.className = 'zq-choix' + (w.c.length === 4 ? ' quatre' : '');
    w.c.forEach((v, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'choix'; b.dataset.i = String(i);
      const cv = document.createElement('canvas');
      cv.peinture = (c, W, H) => vehicule(c, v, W / 2, H / 2 + 2, Math.min(W / 128, H / 90));
      const nom = document.createElement('span'); nom.className = 'nom'; nom.textContent = tr('v.' + VEH[v].id);
      b.append(cv, nom);
      b.setAttribute('aria-label', tr('choix.aria', { n: i + 1, nom: tr('v.' + VEH[v].id) }));
      b.disabled = !mien || !!fige;
      b.addEventListener('click', () => { audio(); jouerAction({ r: i }); });
      grille.appendChild(b);
    });
    zq.appendChild(grille);
  }

  function barriereDevant(e, s) {
    const xi = e.X.indexOf(e.p[s]);
    return xi >= 0 && e.bo[xi] >= 0 && e.bo[xi] !== s && e.lv[s].indexOf(xi) < 0;
  }

  function construireCibles(zq, e, mien, s) {
    const titre = document.createElement('p'); titre.className = 'zq-titre';
    titre.textContent = mien ? tr('zone.cible') : tr('zone.cibleAutre', { qui: quiEst(s) });
    const liste = document.createElement('div'); liste.className = 'zq-rivaux';
    for (let k = 0; k < PLACES; k++) {
      if (k === s) continue;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'rival'; b.style.setProperty('--c', COUL[k]);
      const cv = document.createElement('canvas'); cv.width = 108; cv.height = 80;
      loco(cv.getContext('2d'), modeleDe(k), COUL[k], COUL_F[k], 54, 44, 0.9);
      const n1 = document.createElement('span'); n1.textContent = k === partie.siege ? tr('place.toi') : quiEst(k);
      const n2 = document.createElement('span'); n2.textContent = tr('place.rails', { n: e.p[k], total: e.L });
      b.append(cv, n1, n2);
      b.disabled = !mien || e.p[k] <= 0;
      b.setAttribute('aria-label', tr('rival.aria', { qui: n1.textContent, n: e.p[k], total: e.L }));
      b.addEventListener('click', () => { audio(); sons.clic(); jouerAction({ c: k }); });
      liste.appendChild(b);
    }
    zq.append(titre, liste);
  }

  function jouerAction(a) {
    if (!partie || enPause || attenteTuto) return;
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    document.querySelectorAll('#zq button').forEach((b) => { if (b.id !== 'btn-ecouter') b.disabled = true; });
    partie.jouer(a);
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function prendreVue(etat) {
    vue = etat ? JSON.parse(JSON.stringify(etat)) : null;
    if (vue) pos = vue.p.slice();
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    prendreVue(partie.etat);
    animsRails = {};
    debutTour = Date.now();
    zoneTenir = 0;
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + (info.moi ? prog.loco : 0);
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 104);
        medaillon(c, s, 56, 58, 42, info.moi ? prog.loco : 0);
        if (info.chef) couronne(c, 56, 20, 24);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { loco: tr('loco.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { qui: nomChef || tr('loco.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const b = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    b.hidden = !chef;
    b.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (b.textContent !== texteBouton) b.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    prendreVue(partie.etat);
    animsRails = {};
    particules.length = 0;
    debutTour = Date.now();
    dernierTic = -1;
    zoneTenir = 0;
    nouveauxAut = [];
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche, paysage: tr('paysage.' + NIVEAUX[vue.n].p) })); sons.sifflet(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surAction(ev) {
    const t = performance.now();
    const avant = ev.avant, apres = ev.apres, s = ev.siege;
    const ancien = pos.slice();
    prendreVue(apres);
    pos = ancien;
    debutTour = Date.now();
    dernierTic = -1;
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (avant.ph === 'choix') {
      // Le wagon choisi s'illumine un instant, puis la question s'ouvre.
      const b = document.querySelector('#zq .wagon[data-i="' + ev.action.w + '"]');
      if (b && zoneCle.indexOf('c|') === 0) { b.classList.add('pris'); zoneTenir = performance.now() + 420; }
      sons.clic();
    } else if (avant.ph === 'rep') {
      surReponse(avant, apres, s, ev, t);
    } else {
      // Aiguillage : le dernier rail de la cible est dévié.
      const c = ev.action.c;
      sons.aiguillage();
      jaillir(c, '#ffffff');
      secouer();
      const quiC = c === partie.siege ? tr('place.toiObjet') : quiEst(c);
      toast(tr('evt.aiguillage', { cible: quiC }), 2200);
      zoneTenir = performance.now() + 900;
    }
    if (partie.phase === 'jeu' && apres.g < 0 && R.aQui(apres) === partie.siege && !ev.moi) sons.tour();
  }

  function surReponse(avant, apres, s, ev, t) {
    const w = avant.w[avant.ch], der = apres.der, ok = !!der.ok;
    // La question reste affichée avec la bonne réponse en vert.
    if (zoneCle.indexOf('r|') !== 0 || zoneCle.split('|')[3] !== String(w.id)) {
      const zq = $('zq'); zq.textContent = ''; zoneJeton++;
      construireQuestion(zq, w, false, s, avant, true);
      requestAnimationFrame(repeindreZone);
    }
    zoneCle = 'fb|' + w.id;
    document.querySelectorAll('#zq .choix').forEach((b) => {
      const i = Number(b.dataset.i);
      b.disabled = true;
      b.classList.add('revele');
      if (i === w.ok) b.classList.add('bon');
      else if (i === ev.action.r) b.classList.add('mauvais');
    });
    const boite = document.querySelector('#zq .boite-image');
    if (boite) boite.classList.remove('cache');
    zoneTenir = performance.now() + (apres.ph === 'cible' ? 1000 : 1500);
    const moi = s === partie.siege;
    if (ok) {
      sons.bon();
      for (let k = 0; k < der.n; k++) { animsRails[s + ':' + (avant.p[s] + k)] = t + 250 + k * 160; sons.rail(k + 1); }
      if (der.ev.indexOf('demipont') >= 0) animsRails[s + ':' + apres.p[s]] = t + 250;
      jaillir(s);
      const carte = $('place-' + s);
      carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
      if (moi && prog.aut.indexOf(w.v) < 0) {
        prog.aut.push(w.v);
        nouveauxAut.push(w.v);
        sauverCollection();
        setTimeout(() => toast(tr('aut.nouveau', { nom: tr('v.' + VEH[w.v].id) }), 2000), 500);
      }
    } else {
      sons.erreur();
      if (moi) secouer();
    }
    // Barrières et ponts.
    const qui = moi ? tr('place.toiObjet') : quiEst(s);
    if (der.ev.indexOf('ferme') >= 0) { setTimeout(sons.barriere, 400); toast(tr('evt.ferme', { qui: qui }), 2200); }
    if (der.ev.indexOf('leve') >= 0) { setTimeout(sons.barriere, 300); toast(tr('evt.leve', { qui: qui }), 2200); }
    if (der.ev.indexOf('demipont') >= 0) toast(tr('evt.demipont', { qui: qui }), 2200);
    if (der.ev.indexOf('pont') >= 0) { setTimeout(sons.pont, 300); toast(tr('evt.pont', { qui: qui }), 2200); }
    if (der.ev.indexOf('pontcasse') >= 0) { setTimeout(sons.casse, 250); toast(tr('evt.pontcasse', { qui: qui }), 2200); }
    if (!ok && !der.ev.length && moi) toast(tr('evt.attend'), 1600);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1700);
  }

  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const res = R.fin(e);
    const gagne = moi >= 0 && res && res.classement[0] === moi;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    sauverCollection();
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  // 1 étoile pour la 1re place, 2 avec 65 % de bonnes réponses, 3 avec 85 %.
  function etoilesPour(gagne, br, nq) {
    if (!gagne) return 0;
    const p = nq ? br / nq : 0;
    return p >= 0.85 ? 3 : p >= 0.65 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    ordre.forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 80; cv.height = 60;
      loco(cv.getContext('2d'), s === moi ? prog.loco : 0, COUL[s], COUL_F[s], 40, 32, 0.8);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = tr('fin.ligne', { n: e.p[s], total: e.L, br: e.br[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const res = R.fin(e);
    const gagne = moi >= 0 && res && res.classement[0] === moi;
    const br = moi >= 0 ? e.br[moi] : 0, nq = moi >= 0 ? e.nq[moi] : 0;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.reponses', { n: br, total: nq }) : '';
    $('fin-aut').textContent = nouveauxAut.length ? tr('fin.aut', { n: nouveauxAut.length }) : '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(gagne, br, nq);
      const ancienRecord = prog.records[i];
      const record = br > ancienRecord;
      if (record) prog.records[i] = br;
      const locosAvant = locosDebloquees();
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), br);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else sauverCollection();
      $('fin-titre').textContent = gagne ? tr('fin.gagne') : tr('fin.perdu', { qui: res ? quiEst(res.classement[0]) : '' });
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, br) });
      let texteDeb = '';
      if (gagne && niveau === NIVEAUX.length) texteDeb = tr('fin.dernier');
      else if (debloque) texteDeb = tr('fin.debloque', { n: niveau + 1 });
      if (locosDebloquees() > locosAvant) texteDeb += (texteDeb ? ' ' : '') + tr('fin.loco');
      $('fin-debloque').textContent = texteDeb;
      $('fin-compte').textContent = gagne ? '' : tr('fin.conseil');
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      sauverCollection();
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (robots locaux, après une coupure).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux
  // ---------------------------------------------------------------------

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    zoneCle = '';
    zoneTenir = 0;
    $('zq').textContent = '';
    bandeau('');
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon'].forEach(fermerVoile);
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  // Aperçu du niveau n (voies vides) pendant le tutoriel.
  function apercu(n) {
    const cfg = NIVEAUX[n - 1];
    return { n: n - 1, L: cfg.L, X: cfg.X.slice(), B: cfg.B.slice(), p: [0, 0, 0, 0], br: [0, 0, 0, 0], nq: [0, 0, 0, 0], po: [-1, -1, -1, -1], lv: [[], [], [], []], bo: cfg.X.map(() => -1), tour: 0, ph: 'choix', ch: -1, w: [], coups: 0, max: 99, g: -1 };
  }

  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = apercu(niveau);
    pos = [0, 0, 0, 0];
    animsRails = {};
    particules.length = 0;
    nouveauxAut = [];
    zoneCle = '';
    zoneTenir = 0;
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    zoneCle = '';
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    nouveauxAut = [];
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });

    const grille = $('grille-niveaux');

      const n = i + 1, ouvert = n <= prog.debloque;

      const b = document.createElement('button');
      b.type = 'button';

      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
      b.append(num, et);
      b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));

      else b.disabled = true;

    });

  function majTitre() {

    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';

  // ---------------------------------------------------------------------
  //  Pause

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';

  // ---------------------------------------------------------------------
  //  Tutoriels animés (une petite scène par nouveauté)
  // ---------------------------------------------------------------------

  const V = (id) => VEH.findIndex((v) => v.id === id);
  function caseVeh(c, x, y, w, h, v, etat) {
    rr(c, x, y, w, h, 12); plein(c, etat === 'bon' ? '#e3f8e6' : '#fffdf6', etat === 'bon' ? '#2a9d4b' : '#b9c4da');
    if (etat === 'bon') { rr(c, x, y, w, h, 12); c.strokeStyle = '#2a9d4b'; c.lineWidth = 4; c.stroke(); }
    vehicule(c, v, x + w / 2, y + h / 2 + 2, Math.min(w / 130, h / 92));
  }
  function wagonTuto(c, x, y, w, h, k, x2, a2, pris) {
    c.save();
    if (pris) { c.translate(x + w / 2, y + h / 2); c.scale(1.08, 1.08); c.translate(-(x + w / 2), -(y + h / 2)); }
    rr(c, x, y, w, h, 12); plein(c, x2 ? '#fff6d6' : a2 ? '#ecfbee' : '#fffdf6', pris ? '#2f6fe0' : '#b9c4da');
    c.translate(x, y + 4);
    dessinerWagon(c, { k: k, x: x2 ? 1 : 0, a: a2 ? 1 : 0, t: 0 }, w, h - 8, true);
    c.restore();
  }
  // Petite voie (tutoriels) : n rails faits sur L, couleur s.
  function voieTuto(c, x, y, w, L, n, s, opts) {
    opts = opts || {};
    const sw = w / L;
    for (let i = 0; i < L; i++) {
      const xa = x + i * sw;
      if (opts.pont === i) { c.fillStyle = '#5fb2ec'; c.fillRect(xa, y - 24, sw, 48); }
      const faitI = i < n || (opts.moitie === i);
      const larg = opts.moitie === i && i >= n ? sw / 2 : sw;
      if (faitI) {
        if (opts.pont === i) { rr(c, xa, y - 9, larg, 18, 2); plein(c, '#b07a45', CONTOUR); }
        for (let k = 0; k < 3; k++) { rr(c, xa + (k + 0.5) * larg / 3 - 2, y - 8, 4, 16, 1); plein(c, '#7a5534'); }
        ligne(c, [xa, y - 5, xa + larg, y - 5], COUL_F[s], 3); ligne(c, [xa, y + 5, xa + larg, y + 5], COUL_F[s], 3);
      } else if (opts.pont !== i) { c.setLineDash([4, 5]); ligne(c, [xa + 3, y, xa + sw - 3, y], 'rgba(60,70,90,.4)', 2); c.setLineDash([]); }
    }
    if (opts.barriere !== undefined) {
      const xa = x + opts.barriere * sw;
      rr(c, xa - 3, y - 30, 6, 26, 1); plein(c, '#3a3f4b');
      c.save(); c.translate(xa, y - 12); c.rotate(opts.ferme ? 0 : -Math.PI / 2 + 0.25);
      rr(c, -30, -4, 60, 8, 3); plein(c, '#ffffff', '#c62828'); for (let k = 0; k < 3; k++) { rr(c, -26 + k * 20, -4, 9, 8, 0); plein(c, '#e53935'); }
      c.restore();
    }
    loco(c, 0, COUL[s], COUL_F[s], x + Math.max(0.6, opts.pos !== undefined ? opts.pos : n) * sw - 26, y - 6, 0.7, opts.t);
  }

  const TUTOS = {
    // 1. Choisir un wagon, 2. toucher le bon véhicule, 3. un rail se pose.
    base(c, t) {
      const T = t % 6000, et = T < 2000 ? 0 : T < 4200 ? 1 : 2;
      if (et === 0) {
        const types = ['bruit', 'usage', 'bruit'];
        for (let i = 0; i < 3; i++) wagonTuto(c, 30 + i * 172, 90, 156, 120, types[i], false, false, i === 1 && T > 1300);
        const q = Math.min(1, T / 1200);
        main(c, 500 + (280 - 500) * q, 330 + (180 - 330) * q, 1.7, T > 1200 ? Math.min(1, (T - 1200) / 150) : 0);
      } else if (et === 1) {
        const u = T - 2000;
        iconeType(c, 'usage', 280, 50, 30);
        const vs = [V('voiture'), V('paquebot'), V('velo')];
        for (let i = 0; i < 3; i++) caseVeh(c, 30 + i * 172, 110, 156, 120, vs[i], u > 1500 && i === 1 ? 'bon' : '');
        const q = Math.min(1, u / 1300);
        main(c, 500 + (300 - 500) * q, 340 + (190 - 340) * q, 1.7, u > 1300 ? Math.min(1, (u - 1300) / 150) : 0);
      } else {
        const u = T - 4200;
        voieTuto(c, 70, 200, 420, 5, u > 300 ? 2 : 1, 0, { t: t, pos: 1 + Math.min(1, Math.max(0, (u - 300) / 600)) });
        if (u > 300) { c.fillStyle = '#ffe066'; etincelle(c, 70 + 2 * 84, 200, 12); }
      }
    },
    // Ombre : la silhouette, puis le bon véhicule en couleur.
    ombre(c, t) {
      const T = t % 4500;
      rr(c, 170, 14, 220, 130, 14); plein(c, '#f2f6fc', '#b9c4da');
      silhouette(c, V('avion'), 280, 80, 1.3);
      const vs = [V('helico'), V('avion'), V('bus')];
      for (let i = 0; i < 3; i++) caseVeh(c, 30 + i * 172, 170, 156, 110, vs[i], T > 2600 && i === 1 ? 'bon' : '');
      const q = Math.min(1, T / 2200);
      main(c, 500 + (300 - 500) * q, 350 + (240 - 350) * q, 1.6, T > 2200 ? Math.min(1, (T - 2200) / 150) : 0);
    },
    // Tunnel : l'image paraît un instant, puis le tunnel la cache.
    tunnel(c, t) {
      const T = t % 5000;
      c.save(); rr(c, 170, 14, 220, 130, 14); c.clip();
      c.fillStyle = '#f2f6fc'; c.fillRect(170, 14, 220, 130);
      silhouette(c, V('paquebot'), 280, 80, 1.2);
      const g = Math.min(1, Math.max(0, (T - 1400) / 450));
      c.translate(170 - 220 * (1 - g), 14); dessinerTunnel(c, 220, 130);
      c.restore();
      rr(c, 170, 14, 220, 130, 14); c.strokeStyle = '#b9c4da'; c.lineWidth = 3; c.stroke();
      const vs = [V('paquebot'), V('camion'), V('tracteur')];
      for (let i = 0; i < 3; i++) caseVeh(c, 30 + i * 172, 170, 156, 110, vs[i], T > 3400 && i === 0 ? 'bon' : '');
      const q = Math.min(1, Math.max(0, (T - 2000) / 1200));
      main(c, 500 + (120 - 500) * q, 350 + (240 - 350) * q, 1.6, T > 3200 ? Math.min(1, (T - 3200) / 150) : 0);
    },
    // Express : 3 rails d'un coup.
    express(c, t) {
      const T = t % 4500;
      wagonTuto(c, 180, 20, 200, 130, 'ombre', true, false, T > 1000);
      const n = T < 1500 ? 0 : Math.min(3, 1 + Math.floor((T - 1500) / 400));
      voieTuto(c, 60, 270, 440, 6, n, 0, { t: t });
      if (n > 0) { c.fillStyle = '#ffd84d'; etincelle(c, 60 + n * 73, 270, 14); }
    },
    // Gros plan : un morceau très agrandi, puis le véhicule entier.
    zoom(c, t) {
      const T = t % 4500;
      c.save(); rr(c, 150, 20, 260, 150, 14); c.clip();
      if (T < 2600) { c.translate(150, 20); grosPlan(c, V('tracteur'), 3, 260, 150); }
      else { c.fillStyle = '#e3f8e6'; c.fillRect(150, 20, 260, 150); vehicule(c, V('tracteur'), 280, 95, 1.5); }
      c.restore();
      rr(c, 150, 20, 260, 150, 14); c.strokeStyle = T < 2600 ? '#b9c4da' : '#2a9d4b'; c.lineWidth = 4; c.stroke();
      c.save(); c.translate(470, 250); c.rotate(-0.3);
      rond(c, 0, 0, 40); c.strokeStyle = '#3a3f4b'; c.lineWidth = 9; c.stroke(); rond(c, 0, 0, 36); c.fillStyle = 'rgba(191,230,255,.4)'; c.fill();
      ligne(c, [28, 28, 66, 66], '#3a3f4b', 14);
      c.restore();
      if (T > 2600) { c.fillStyle = '#ffe066'; etincelle(c, 410, 30, 14); }
    },
    // Aiguillage : bonne réponse, puis le rail d'un rival est dévié.
    aiguillage(c, t) {
      const T = t % 5000;
      wagonTuto(c, 190, 8, 180, 110, 'usage', false, true, T > 600);
      voieTuto(c, 60, 180, 440, 6, T > 1300 ? 3 : 2, 0, { t: t });
      const recule = T > 2600;
      voieTuto(c, 60, 290, 440, 6, recule ? 3 : 4, 1, { t: t + 500, pos: recule ? 3 + Math.max(0, 1 - (T - 2600) / 500) : 4 });
      if (T > 2400 && T < 3600) {
        const k = (T - 2400) / 1200;
        c.save(); c.translate(60 + 3.5 * 73, 290 - k * 90); c.rotate(k * 3); rr(c, -30, -4, 60, 8, 3); plein(c, COUL_F[1]); c.restore();
        ligne(c, [300, 220, 320, 250], '#3fae4a', 6); ligne(c, [310, 252, 322, 252, 322, 240], '#3fae4a', 6);
      }
      if (T > 1900 && T < 2500) main(c, 330, 310, 1.5, 1);
    },
    // Passage à niveau : la barrière se ferme derrière le premier, l'autre paie un rail.
    barriere(c, t) {
      const T = t % 6000;
      const n1 = T < 1200 ? 2 : 3;
      voieTuto(c, 60, 150, 440, 6, n1, 1, { t: t + 300, barriere: 2 });
      const ferme = T > 1500 && T < 3800;
      const n0 = T > 4600 ? 3 : 2;
      voieTuto(c, 60, 280, 440, 6, n0, 0, { t: t, barriere: 2, ferme: ferme });
      if (T > 3300 && T < 3900) main(c, 280, 330, 1.5, 1);
    },
    // Pont : une moitié, puis l'autre ; une erreur fait tomber la moitié.
    pont(c, t) {
      const T = t % 5500;
      const opts = { t: t, pont: 2 };
      let n = 2;
      if (T > 1500 && T < 3500) opts.moitie = 2;
      if (T >= 3500) n = 3;
      voieTuto(c, 60, 210, 440, 5, n, 0, opts);
      if (T > 1300 && T < 1700) main(c, 280, 280, 1.5, 1);
      if (T > 3300 && T < 3700) main(c, 300, 280, 1.5, 1);
      if (T > 3500) { c.fillStyle = '#ffe066'; etincelle(c, 60 + 2.5 * 88, 190, 14); }
    },
    // Heure de pointe : 4 réponses.
    pointe(c, t) {
      const T = t % 4500;
      iconeType(c, 'bruit', 280, 36, 26);
      const vs = [V('police'), V('pompiers'), V('ambulance'), V('voiture')];
      for (let i = 0; i < 4; i++) caseVeh(c, 60 + (i % 2) * 228, 80 + Math.floor(i / 2) * 140, 212, 126, vs[i], T > 2600 && i === 0 ? 'bon' : '');
      const q = Math.min(1, T / 2200);
      main(c, 500 + (170 - 500) * q, 350 + (160 - 350) * q, 1.6, T > 2200 ? Math.min(1, (T - 2200) / 150) : 0);
    }
  };

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    let debut = 0;
    const j = ++tutoAnim;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 360);
      c.fillStyle = '#eef4fb'; c.fillRect(0, 0, 560, 360);
      try { TUTOS[cle](c, t - debut); } catch (e) { /* dessin impossible */ }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Clavier : 1 à 4 pour choisir, flèches pour se déplacer, Entrée
  // ---------------------------------------------------------------------

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const boutons = Array.from(document.querySelectorAll('#zq .wagon, #zq .choix, #zq .rival'));
    const m = /^(?:Digit|Numpad)([1-4])$/.exec(ev.code);
    if (m) {
      const b = boutons[Number(m[1]) - 1];
      if (b && !b.disabled) { ev.preventDefault(); b.click(); }
      return;
    }
    if (ev.code === 'KeyR') { const e = document.getElementById('btn-ecouter'); if (e) { ev.preventDefault(); e.click(); } return; }
    const dirs = { ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1 };
    if (dirs[ev.code] && boutons.length) {
      ev.preventDefault(); audio();
      const ici = boutons.indexOf(document.activeElement);
      const suivant = boutons[(ici < 0 ? 0 : ici + dirs[ev.code] + boutons.length) % boutons.length];
      try { suivant.focus({ preventScroll: true }); } catch (e) { /* rien */ }
      sons.clic();
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-collection').addEventListener('click', () => { audio(); sons.clic(); ouvrirCollection(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('col-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.br[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(performance.now()); else requestAnimationFrame(repeindreZone); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
