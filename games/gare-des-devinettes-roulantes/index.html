  }

  function majInterface() {
    majPlaces();
    majInfos();
    majPupitre();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Pupitre : les 3 wagons (ton tour) ou le récit du dernier coup
  // ---------------------------------------------------------------------

  const monTour = () => !!(partie && vue && partie.phase === 'jeu' && !attenteTuto && partie.monTour());

  function majPupitre() {
    const mien = monTour() && !questionOuverte;
    const boite = $('wagons');
    boite.classList.toggle('actif', mien);
    $('recit').classList.toggle('actif', !mien && !!recitDer && !!vue);
    let aide = '';
    if (mien) {
      const s = partie.siege, i = vue.at[s];
      if (i >= 0) aide = vue.ob[i][0] === 'x' ? tr('jeu.aideBarriere') : tr('jeu.aidePont', { n: 2 - vue.pt[s] });
      else aide = tr('jeu.aideWagons');
      const cle = vue.nb + ':' + JSON.stringify(vue.of);
      if (cle !== cleWagons) { cleWagons = cle; construireWagons(); }
    }
    if ($('aide').textContent !== aide) $('aide').textContent = aide;
  }

  function construireWagons() {
    const boite = $('wagons');
    boite.textContent = '';
    vue.of.forEach((wagon, w) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'wagon'; b.style.setProperty('--c', COUL_WAGON[wagon.t]);
      const cv = document.createElement('canvas'); cv.width = 240; cv.height = 160; cv.setAttribute('aria-hidden', 'true');
      dessinerWagon(cv.getContext('2d'), wagon, 120, 80, 2);
      const nom = document.createElement('span'); nom.textContent = tr('sorte.' + wagon.q.k);
      const gain = document.createElement('span'); gain.className = 'gain';
      gain.textContent = (wagon.t !== 'n' ? tr('type.' + wagon.t) + ' · ' : '') + tr('wagon.gain', { n: O.gain[wagon.t] });
      b.append(cv, nom, gain);
      b.setAttribute('aria-label', tr('wagon.aria', { n: w + 1, sorte: tr('sorte.' + wagon.q.k), gain: gain.textContent }));
      b.addEventListener('click', () => { audio(); ouvrirQuestion(w); });
      boite.appendChild(b);
    });
    if (clavierActif) setTimeout(() => { if (boite.firstElementChild && !questionOuverte) try { boite.firstElementChild.focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 50);
  }

  // Récit d'un coup : question, réponses (choix entouré, bonne réponse cochée), résultat.
  function texteResultat(d) {
    const l = [];
    if (d.bon) {
      if (d.ev === 'ouvre') l.push(tr('recit.ouvre'));
      else if (d.ev === 'pont1') l.push(tr('recit.pont1'));
      else if (d.ev === 'pont') l.push(tr('recit.pont'));
      else l.push(tr('recit.rails', { n: d.g }));
      if (d.ev === 'ferme') l.push(tr('recit.ferme'));
      if (d.ev === 'arret') l.push(tr('recit.arret'));
      if (d.ev === 'arretPont') l.push(tr('recit.arretPont'));
      if (d.dv >= 0) l.push(tr('recit.devie', { qui: quiEst(d.dv) }));
    } else l.push(d.ev === 'pont0' ? tr('recit.pont0') : tr('recit.attend'));
    return l.join(' ');
  }

  function majRecit() {
    if (!recitDer) return;
    const d = recitDer.d, q = d.q;
    $('recit-question').textContent = quiEst(d.s) + ' · ' + texteQuestion(q);
    const res = $('recit-resultat');
    res.textContent = (d.bon ? tr('recit.bonne') : tr('recit.mauvaise')) + ' ' + texteResultat(d);
    res.className = d.bon ? 'bon' : 'faux';
    const cv = $('recit-dessin'), c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    dessinerWagon(c, { t: d.t, q: q }, 66, 58, 1);
    const n = q.o.length, larg = (cv.width - 140) / n;
    for (let i = 0; i < n; i++) {
      const x = 140 + larg * (i + 0.5), y = 64;
      c.fillStyle = i === d.r ? hexa(COUL[d.s], 0.22) : '#ffffff'; rr(c, x - larg / 2 + 4, 6, larg - 8, 116, 14); c.fill();
      c.strokeStyle = i === d.r ? COUL[d.s] : '#c5cde0'; c.lineWidth = i === d.r ? 6 : 2; c.stroke();
      if (q.k === 'roues') { c.fillStyle = '#2b3b66'; c.font = '900 52px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(nb(q.o[i]), x, y); }
      else vehicule(c, q.o[i], x, y, Math.min(1.25, (larg - 20) / 100));
      if (i === q.b) coche(c, x + larg / 2 - 18, 22, 1.2, true);
      else if (i === d.r) coche(c, x + larg / 2 - 18, 22, 1.2, false);
    }
  }

  // ---------------------------------------------------------------------
  //  Question d'un wagon
  // ---------------------------------------------------------------------

  let animSujet = 0;
  function ouvrirQuestion(w) {
    if (!monTour() || questionOuverte || enPause) return;
    const wagon = vue.of[w];
    if (!wagon) return;
    sons.wagon();
    const q = wagon.q;
    const tunnel = wagon.t === 't';
    questionOuverte = { w: w, wagon: wagon, q: q, envoye: false, tunnel: tunnel, debut: performance.now(), cache: false, nb: vue.nb };
    $('q-type').textContent = tr('type.' + wagon.t) + ' · ' + tr('wagon.gain', { n: O.gain[wagon.t] });
    $('q-type').style.background = COUL_WAGON[wagon.t];
    $('q-texte').textContent = texteQuestion(q);
    $('q-bilan').textContent = ''; $('q-bilan').className = '';
    $('q-sujet').hidden = q.k === 'intrus' || q.k === 'vitesse';
    $('q-reecouter').hidden = q.k !== 'bruit' || tunnel;
    $('q-son').hidden = q.k !== 'bruit' || prog.options.son;
    $('q-retour').hidden = tunnel;
    const boite = $('q-reponses');
    boite.textContent = '';
    boite.classList.toggle('quatre', q.o.length === 4);
    q.o.forEach((v, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'reponse';
      if (q.k === 'roues') b.textContent = nb(v);
      else {
        const cv = document.createElement('canvas'); cv.width = 200; cv.height = 140;
        vehicule(cv.getContext('2d'), v, 100, 72, 1.75);
        b.appendChild(cv);
      }
      b.setAttribute('aria-label', tr('q.reponseAria', { n: i + 1, nom: texteReponse(q, i) }));
      b.addEventListener('click', () => repondre(i));
      boite.appendChild(b);
    });
    $('voile-question').classList.add('actif');
    if (clavierActif) try { boite.firstElementChild.focus({ preventScroll: true }); } catch (e) { /* rien */ }
    else if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    majPupitre();
    if (q.k === 'bruit') setTimeout(() => { if (questionOuverte && questionOuverte.q === q) jouerBruit(q.s); }, 350);
    const j = ++animSujet;
    const image = (t) => { if (j !== animSujet || !questionOuverte) return; dessinerSujet(t); requestAnimationFrame(image); };
    requestAnimationFrame(image);
  }

  function dessinerSujet(t) {
    const qo = questionOuverte, q = qo.q, cv = $('q-sujet');
    if (cv.hidden) return;
    const c = cv.getContext('2d'), W = cv.width, H = cv.height;
    c.clearRect(0, 0, W, H);
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#e3eefc'); g.addColorStop(1, '#f6f9ff');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    if (q.k === 'ombre') { c.fillStyle = '#c7d3e6'; ell(c, W / 2, H * 0.84, 170, 16); c.fill(); vehicule(c, q.s, W / 2, H * 0.5, 3.6, true); }
    else if (q.k === 'roues') vehicule(c, q.s, W / 2, H * 0.5, 3.6);
    else if (q.k === 'milieu' || q.k === 'metier') picto(c, q.s, W / 2, H / 2, 3.6);
    else if (q.k === 'bruit') {
      picto(c, 'bruit', W / 2 - 20, H / 2, 3.4);
      const p = (t / 700) % 1;
      c.strokeStyle = 'rgba(47,111,224,' + (0.6 * (1 - p)).toFixed(2) + ')'; c.lineWidth = 6;
      c.beginPath(); c.arc(W / 2 - 20, H / 2, 60 + p * 90, -0.6, 0.6); c.stroke();
    }
    // Tunnel : l'image ne paraît qu'un instant, puis la montagne la cache.
    if (qo.tunnel && q.k !== 'bruit') {
      const ecoule = t - qo.debut;
      if (ecoule > 1200 || qo.cache) {
        qo.cache = true;
        if (qo.fondu === undefined) qo.fondu = t;
        const p = Math.min(1, (t - qo.fondu) / 250);
        c.save(); c.globalAlpha = p;
        c.fillStyle = '#7d8aa3'; c.fillRect(0, 0, W, H);
        c.fillStyle = '#5c6880'; poly(c, [0, H, W * 0.25, H * 0.2, W * 0.5, H, W * 0.75, H * 0.1, W, H]); c.fill();
        c.fillStyle = '#fff'; poly(c, [W * 0.68, H * 0.32, W * 0.75, H * 0.1, W * 0.82, H * 0.32]); c.fill();
        c.fillStyle = '#1d2233'; c.beginPath(); c.moveTo(W * 0.3, H); c.lineTo(W * 0.3, H * 0.55); c.arc(W * 0.5, H * 0.55, W * 0.2, Math.PI, 0); c.lineTo(W * 0.7, H); c.fill();
        c.restore();
      } else {
        // barre du temps restant avant le tunnel
        c.fillStyle = '#6b4fb8'; c.fillRect(0, H - 10, W * (1 - ecoule / 1200), 10);
      }
    }
  }

  function fermerQuestion() {
    animSujet++;
    questionOuverte = null;
    fermerVoile('voile-question');
    majPupitre();
  }

  function repondre(i) {
    const qo = questionOuverte;
    if (!qo || qo.envoye || enPause || !monTour() || vue.nb !== qo.nb || i < 0 || i >= qo.q.o.length) return;
    audio();
    if (!partie.jouer({ w: qo.w, r: i })) return;
    qo.envoye = true;
    qo.choix = i;
    $('q-retour').hidden = true;
    const b = $('q-reponses').children[i];
    if (b) b.style.boxShadow = '0 0 0 4px ' + COUL[partie.siege];
    Array.from($('q-reponses').children).forEach((x) => { x.disabled = true; });
  }

  // Retour de mon coup : bonne réponse cochée, bilan, puis fermeture.
  function bilanQuestion(d) {
    const qo = questionOuverte;
    if (!qo) return;
    qo.cache = false; qo.tunnel = false;           // on montre l'image après la réponse
    const enfants = $('q-reponses').children;
    if (enfants[d.q.b]) enfants[d.q.b].classList.add('bonne');
    if (!d.bon && enfants[d.r]) enfants[d.r].classList.add('fausse');
    const bilan = $('q-bilan');
    bilan.textContent = d.bon ? tr('q.bravo') + ' ' + texteResultat(d) : tr('q.rate', { nom: texteReponse(d.q, d.q.b) }) + ' ' + texteResultat(d);
    bilan.className = d.bon ? 'bon' : 'faux';
    const j = jeton;
    setTimeout(() => { if (j === jeton && questionOuverte === qo) fermerQuestion(); }, d.bon ? 1300 : 2100);
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0, geo = null, prochaineVapeur = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    animerPositions(dt);
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  // Les locomotives avancent rail par rail (son et étincelles à chaque rail).
  function animerPositions(dt) {
    if (!vue) return;
    for (let s = 0; s < PLACES; s++) {
      const but = vue.p[s], a = aff[s];
      if (Math.abs(but - a) < 1e-3) { aff[s] = but; continue; }
      const n = a < but ? Math.min(but, a + dt * 3.2) : Math.max(but, a - dt * 2.2);
      if (n > a && Math.floor(n + 1e-6) > Math.floor(a + 1e-6)) { sons.rail(Math.floor(n)); etincelles(s, Math.floor(n + 1e-6)); }
      aff[s] = n;
    }
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; c.drawImage(fondPlateau(session === 'solo' ? NIVEAUX[niveau - 1].pay : 0, w, h, dpr), 0, 0, w, h); return; }
    c.drawImage(fondPlateau(vue.pay, w, h, dpr), 0, 0, w, h);
    geo = geometrieVoies(w, h, vue.L);
    const tour = partie && partie.phase === 'jeu' && !attenteTuto ? R.aQui(vue) : -1;
    dessinerPlateau(c, vue, geo, aff, { t: t, tour: tour, sieges: siegesActuels() });
    // vapeur des locomotives
    if (t > prochaineVapeur) {
      prochaineVapeur = t + 260;
      const s = Math.floor(Math.random() * PLACES), k = Math.min(geo.lh * 0.5, 30);
      const lx = geo.ml + Math.min(aff[s], geo.L) * geo.sw - k * 0.65;
      particules.push({ x: lx, y: yVoie(geo, s) - k * 0.85, vx: -10 - Math.random() * 10, vy: -18, vie: 1.1, k: k * 0.14, coul: '#ffffff', fumee: true, g: 0 });
    }
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g === undefined ? 420 : p.g) * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.max(0, Math.min(1, p.vie * (p.fumee ? 0.7 : 2)));
      c.fillStyle = p.coul;
      if (p.fumee) { rond(c, p.x, p.y, p.k * (2 - p.vie)); c.fill(); }
      else if (p.etoile) etincelle(c, p.x, p.y, p.k); else { rond(c, p.x, p.y, p.k * 0.5); c.fill(); }
      c.globalAlpha = 1;
    }
  }

  function etincelles(s, pos) {
    if (!geo) return;
    const x = geo.ml + pos * geo.sw, y = yVoie(geo, s);
    for (let k = 0; k < 9; k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 120;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, vie: 0.5 + Math.random() * 0.3, k: 3 + Math.random() * 3, coul: k % 2 ? COUL[s] : '#ffe066', etoile: true });
    }
  }
  function fumeeGrise(s) {
    if (!geo || !vue) return;
    const x = geo.ml + Math.min(aff[s], geo.L) * geo.sw - 10, y = yVoie(geo, s) - 14;
    for (let k = 0; k < 6; k++) particules.push({ x: x + Math.random() * 10, y: y, vx: (Math.random() - 0.5) * 30, vy: -25 - Math.random() * 20, vie: 1, k: 4, coul: '#8b909c', fumee: true, g: 0 });
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function prendreVue(etat) {
    vue = etat ? JSON.parse(JSON.stringify(etat)) : null;
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    prendreVue(partie.etat);
    aff = vue ? vue.p.slice() : [0, 0, 0, 0];
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;           // heure du lancement automatique (ms)
  let resultatSalon = null;   // classement de la manche qui vient de finir
  let finEnAttente = false;   // fin de manche signalée, résultat pas encore montré
  let lancement = false;      // le chef a demandé le lancement

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;            // le résultat de la manche ouvrira le salon
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    if (questionOuverte) fermerQuestion();
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 128, 100);
        locomotive(c, modeleDe(s, sieges), COUL[s], COUL_F[s], 64, 62, 1.05);
        if (info.chef) couronne(c, 64, 26, 24);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { coul: tr('coul.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { qui: nomChef ? nomChef + ' · ' + tr('coul.' + partie.chef) : tr('coul.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    prendreVue(partie.etat);
    aff = vue.p.slice();
    particules.length = 0;
    recitDer = null;
    cleWagons = '';
    debutTour = Date.now();
    dernierTic = -1;
    if (questionOuverte) fermerQuestion();
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche, paysage: tr('paysage.' + vue.pay) })); sons.tour(); }
    else { enPartie = true; stats = { serie: false, express: false, aiguillage: false, tunnel: false, pont: false, barriere: false }; }
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function secouer(s) {
    const carte = $('place-' + s);
    if (!carte) return;
    carte.classList.remove('secoue'); void carte.offsetWidth; carte.classList.add('secoue');
  }

  function surAction(ev) {
    prendreVue(ev.apres);
    const d = vue.der;
    debutTour = Date.now();
    dernierTic = -1;
    if (!d) return;
    recitDer = { d: d };
    majRecit();
    if (d.bon) {
      sons.bon();
      const carte = $('place-' + d.s);
      carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
    } else {
      sons.faux();
      fumeeGrise(d.s);
      secouer(d.s);
    }
    if (d.dv >= 0) { setTimeout(() => sons.aiguillage(), 350); secouer(d.dv); }
    if (d.ev === 'ferme' || d.ev === 'ouvre') setTimeout(() => sons.barriere(), 300);
    if (d.ev === 'pont' || d.ev === 'pont1') setTimeout(() => sons.pont(), 300);
    if (ev.moi) {
      if (questionOuverte && !ev.auto) bilanQuestion(d);
      else if (questionOuverte) fermerQuestion();
      noterExploits(d);
    }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && R.aQui(vue) === partie.siege && !ev.moi && vue.fini < 0) sons.tour();
  }

  // Exploits qui donnent des autocollants (parcours solo).
  function noterExploits(d) {
    if (session !== 'solo' || !stats || !vue) return;
    const s = d.s;
    if (vue.se[s] >= 5) stats.serie = true;
    if (d.t === 'e' && d.bon && d.g > 0) stats.express = true;
    if (d.dv >= 0) stats.aiguillage = true;
    if (d.t === 't' && d.bon) stats.tunnel = true;
    if (d.ev === 'pont') stats.pont = true;
    if (d.ev === 'ferme') stats.barriere = true;
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
    if (recitDer) majRecit();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (questionOuverte) fermerQuestion();
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1500);
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const res = R.fin(e);
    const gagne = moi >= 0 && !!res && res.classement[0] === moi;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  // Étoiles d'un niveau gagné (arrivé premier) : selon le nombre d'erreurs.
  function etoilesPour(gagne, erreurs) {
    if (!gagne) return 0;
    return erreurs <= 1 ? 3 : erreurs <= 3 ? 2 : 1;
  }
  const BONUS_PLACE = [50, 30, 15, 5];

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    ordre.forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 88; cv.height = 50;
      locomotive(cv.getContext('2d'), modeleDe(s, sieges), COUL[s], COUL_F[s], 44, 27, 0.8);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = s === e.fini ? tr('fin.arrive') : tr('fin.rails', { n: e.p[s] });
      l.append(r, cv, qui, n);
      l.setAttribute('aria-label', tr('fin.ligneAria', { rang: k + 1, qui: nomPlace(info, role), coul: tr('coul.' + s), n: e.p[s], bonnes: e.ok[s] }));
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function gagnerAutocollant(cle, liste) {
    if (prog.autocollants.indexOf(cle) >= 0) return;
    prog.autocollants.push(cle);
    liste.push(tr('auto.' + cle));
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const res = R.fin(e);
    const place = moi >= 0 && res ? res.classement.indexOf(moi) : 3;
    const gagne = place === 0;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    const bonnes = moi >= 0 ? e.ok[moi] : 0, erreurs = moi >= 0 ? e.ko[moi] : 0;
    const score = bonnes * 10 + BONUS_PLACE[Math.max(0, place)];
    $('fin-points').textContent = moi >= 0 ? tr('fin.bilan', { bonnes: bonnes, erreurs: erreurs, score: score }) : '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(gagne, erreurs);
      const avantEtoiles = totalEtoiles();
      const ancienRecord = prog.records[i];
      const record = score > ancienRecord;
      if (record) prog.records[i] = score;
      let debloque = false;
      const cadeaux = [];
      if (stats) ['serie', 'express', 'aiguillage', 'tunnel', 'pont', 'barriere'].forEach((k) => { if (stats[k]) gagnerAutocollant(k, cadeaux); });
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (erreurs === 0) gagnerAutocollant('sansfaute', cadeaux);
        if (niveau % 5 === 0) gagnerAutocollant(['campagne', 'montagne', 'port', 'ville'][niveau / 5 - 1], cadeaux);
        if (totalEtoiles() >= NIVEAUX.length * 3) gagnerAutocollant('etoiles', cadeaux);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), score);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else if (cadeaux.length || record) sauver(niveau, score);
      const nouvelleLoco = LOCOS.some((seuil) => seuil > avantEtoiles && seuil <= totalEtoiles());
      $('fin-titre').textContent = gagne ? tr('fin.gagne') : tr('fin.perdu', { place: place + 1 });
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, score) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : (gagne ? '' : tr('fin.conseil')));
      $('fin-cadeaux').textContent = (cadeaux.length ? tr('fin.autocollants', { liste: cadeaux.join(', ') }) : '') + (nouvelleLoco ? (cadeaux.length ? ' ' : '') + tr('fin.loco') : '');
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      $('fin-cadeaux').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (partie en ligne repassée contre des robots).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Confettis de victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden]):not(:disabled)'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux, collection
  // ---------------------------------------------------------------------

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    recitDer = null;
    cleWagons = '';
    stats = null;
    if (questionOuverte) fermerQuestion();
    bandeau('');
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon'].forEach(fermerVoile);
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  function apercu(n) {
    const e = O.preparer(NIVEAUX[n - 1], PLACES);
    e.n = n - 1;
    return e;
  }

  // Parcours solo : niveau n contre 3 robots (force croissante).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    if (questionOuverte) fermerQuestion();
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = apercu(niveau);
    aff = vue.p.slice();
    recitDer = null;
    cleWagons = '';
    particules.length = 0;
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const grille = $('grille-niveaux');
    grille.textContent = '';
    NIVEAUX.forEach((cfg, i) => {
      if (i % 5 === 0) { const t = document.createElement('p'); t.className = 'paysage-titre'; t.textContent = tr('paysage.' + cfg.pay); grille.appendChild(t); }
      const n = i + 1, ouvert = n <= prog.debloque;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
      b.append(num, et);
      b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
      else b.disabled = true;
      grille.appendChild(b);
    });
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
  }

  function ouvrirCollection() {
    const total = totalEtoiles();
    const gl = $('grille-locos');
    gl.textContent = '';
    LOCOS.forEach((seuil, i) => {
      const ouvert = total >= seuil;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'objet' + (ouvert ? '' : ' ferme') + (prog.loco === i ? ' choisi' : '');
      const cv = document.createElement('canvas'); cv.width = 168; cv.height = 112; cv.setAttribute('aria-hidden', 'true');
      const c = cv.getContext('2d');
      if (!ouvert) c.globalAlpha = 0.35;
      locomotive(c, i, ouvert ? COUL[0] : '#9aa0aa', ouvert ? COUL_F[0] : '#6b7280', 84, 62, 1.4);
      const nom = document.createElement('span');
      nom.textContent = ouvert ? tr('loco.' + i) : tr('collection.etoilesPour', { n: seuil });
      b.append(cv, nom);
      b.setAttribute('aria-label', tr('loco.' + i) + ' · ' + (ouvert ? (prog.loco === i ? tr('collection.choisie') : tr('collection.choisir')) : tr('collection.etoilesPour', { n: seuil })));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.wagon(); prog.loco = i; sauverReglages(); ouvrirCollection(); });
      else b.disabled = true;
      gl.appendChild(b);
    });
    const ga = $('grille-autocollants');
    ga.textContent = '';
    AUTOCOLLANTS.forEach((cle) => {
      const gagne = prog.autocollants.indexOf(cle) >= 0;
      const d = document.createElement('div');
      d.className = 'objet' + (gagne ? '' : ' ferme');
      const cv = document.createElement('canvas'); cv.width = 168; cv.height = 112; cv.setAttribute('aria-hidden', 'true');
      autocollant(cv.getContext('2d'), cle, 84, 56, 50, gagne);
      const nom = document.createElement('span'); nom.textContent = gagne ? tr('auto.' + cle) : tr('auto.' + cle + '.aide');
      d.append(cv, nom);
      d.setAttribute('aria-label', tr('auto.' + cle) + ' · ' + (gagne ? tr('collection.gagne') : tr('auto.' + cle + '.aide')));
      ga.appendChild(d);
    });
    $('col-total').textContent = tr('collection.compte', { n: prog.autocollants.length, max: AUTOCOLLANTS.length });
    afficherEcran('collection');
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    if (questionOuverte && questionOuverte.tunnel) questionOuverte.cache = true;   // pas d'image gardée sous la pause
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
    if (questionOuverte) { const b = $('q-reponses').querySelector('button:not(:disabled)'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }

  function dessinerTitre() {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const large = w > h * 1.05;
    const u = Math.min(w, h * 0.8) / 10 * (large ? 0.75 : 1), hz = h * (large ? 0.5 : 0.42);
    let g = c.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, '#62b8ee'); g.addColorStop(1, '#d6f0ff');
    c.fillStyle = g; c.fillRect(0, 0, w, hz + 2);
    // soleil, nuages, avion, montgolfière
    const sx = w * 0.84, sy = h * 0.13, sr = u * 0.7;
    c.strokeStyle = '#ffd84d'; c.lineWidth = u * 0.12; c.lineCap = 'round';
    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; trait(c, [sx + Math.cos(a) * sr * 1.3, sy + Math.sin(a) * sr * 1.3, sx + Math.cos(a) * sr * 1.75, sy + Math.sin(a) * sr * 1.75]); }
    c.fillStyle = '#ffe066'; rond(c, sx, sy, sr); c.fill();
    nuage(c, w * 0.06, h * 0.22, u * 0.5);
    nuage(c, w * 0.56, h * 0.29, u * 0.42);
    vehicule(c, 13, w * 0.2, h * 0.31, u * 0.017);
    vehicule(c, 15, w * 0.72, h * 0.31, u * 0.013);
    // collines et montagne au loin
    c.fillStyle = '#a3afc6'; poly(c, [w * 0.55, hz, w * 0.72, hz - u * 1.6, w * 0.9, hz]); c.fill();
    c.fillStyle = '#fff'; poly(c, [w * 0.68, hz - u * 1.2, w * 0.72, hz - u * 1.6, w * 0.76, hz - u * 1.2]); c.fill();
    c.fillStyle = '#a5db86';
    c.beginPath(); c.moveTo(0, hz); c.bezierCurveTo(w * 0.25, hz - u * 1.2, w * 0.45, hz - u * 0.3, w * 0.6, hz - u * 0.6);
    c.bezierCurveTo(w * 0.8, hz - u * 1.1, w * 0.9, hz - u * 0.4, w, hz - u * 0.5); c.lineTo(w, hz + u); c.lineTo(0, hz + u); c.fill();
    g = c.createLinearGradient(0, hz, 0, h);
    g.addColorStop(0, '#8fd06c'); g.addColorStop(1, '#5aa843');
    c.fillStyle = g; c.fillRect(0, hz + u * 0.4, w, h);
    // la gare centrale
    const gw = u * 4.2, gx = w / 2 - gw / 2, gy = hz + u * 0.9, gh = u * 1.9;
    c.fillStyle = 'rgba(0,0,0,.15)'; c.fillRect(gx + 6, gy - gh + 8, gw, gh);
    c.fillStyle = '#f2e3c6'; c.fillRect(gx, gy - gh, gw, gh);
    c.fillStyle = '#b0563a'; poly(c, [gx - u * 0.25, gy - gh, w / 2, gy - gh - u * 1.3, gx + gw + u * 0.25, gy - gh]); c.fill();
    c.fillStyle = '#fff'; rond(c, w / 2, gy - gh - u * 0.45, u * 0.42); c.fill();
    c.strokeStyle = '#3a3f4b'; c.lineWidth = u * 0.06; c.stroke();
    trait(c, [w / 2, gy - gh - u * 0.45, w / 2, gy - gh - u * 0.75]); trait(c, [w / 2, gy - gh - u * 0.45, w / 2 + u * 0.2, gy - gh - u * 0.4]);
    c.fillStyle = '#5b6170'; c.fillRect(w / 2 - 1.5, gy - gh - u * 1.9, 3, u * 0.6);
    c.fillStyle = '#e0463c'; poly(c, [w / 2 + 1.5, gy - gh - u * 1.9, w / 2 + u * 0.55, gy - gh - u * 1.7, w / 2 + 1.5, gy - gh - u * 1.5]); c.fill();
    for (let i = 0; i < 4; i++) {
      const ax = gx + gw * (0.125 + i * 0.25), aw = gw * 0.17;
      c.fillStyle = '#5a4030'; c.beginPath(); c.moveTo(ax - aw / 2, gy); c.lineTo(ax - aw / 2, gy - gh * 0.45); c.arc(ax, gy - gh * 0.45, aw / 2, Math.PI, 0); c.lineTo(ax + aw / 2, gy); c.fill();
      c.fillStyle = COUL[i]; c.fillRect(ax - aw / 2, gy - gh * 0.86, aw, gh * 0.12);

      // le wagon-question plus bas sur la voie, la locomotive juste devant la gare

      c.restore();
      c.fillStyle = 'rgba(255,255,255,.85)';
      [0, 1, 2].forEach((k) => { rond(c, x + (i >= 2 ? 1 : -1) * u * (0.12 + k * 0.08), y - u * (0.9 + k * 0.25), u * (0.08 + k * 0.04)); c.fill(); });
    }
  }

  function focusDans(boite, delta) {
    const liste = Array.from(boite.querySelectorAll('button:not(:disabled)'));
    if (!liste.length) return;
    const i = liste.indexOf(document.activeElement);
    const j = i < 0 ? 0 : (i + delta + liste.length) % liste.length;
    try { liste[j].focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }

  document.addEventListener('keydown', (ev) => {
    clavierActif = true;
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert() || $('voile-fin').classList.contains('actif')) return;   // boutons au clavier (Tab, Entrée)
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault(); audio();
      if (enPause) fermerPause(); else ouvrirPause();
      return;
    }
    if (enPause) return;
    const chiffre = /^(?:Digit|Numpad)([1-4])$/.exec(ev.code);
    const fleche = { ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1 }[ev.code];
    if (questionOuverte) {
      if (chiffre) { ev.preventDefault(); repondre(Number(chiffre[1]) - 1); }
      else if (fleche) { ev.preventDefault(); focusDans($('q-reponses'), fleche); }
      else if (ev.code === 'Backspace' && !$('q-retour').hidden) { ev.preventDefault(); fermerQuestion(); }
      return;
    }
    if ($('wagons').classList.contains('actif')) {
      if (chiffre && Number(chiffre[1]) <= 3) { ev.preventDefault(); audio(); ouvrirQuestion(Number(chiffre[1]) - 1); }
      else if (fleche) { ev.preventDefault(); focusDans($('wagons'), fleche); }
      else if ((ev.code === 'Enter' || ev.code === 'Space') && !(document.activeElement && document.activeElement.classList.contains('wagon'))) { ev.preventDefault(); focusDans($('wagons'), 0); }
    }
  });

    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-collection').addEventListener('click', () => { audio(); sons.clic(); ouvrirCollection(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('col-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('q-reecouter').addEventListener('click', () => { if (questionOuverte) jouerBruit(questionOuverte.q.s); });
  $('q-retour').addEventListener('click', () => { audio(); sons.clic(); if (questionOuverte && !questionOuverte.envoye) fermerQuestion(); });
  $('q-remettre-son').addEventListener('click', () => { if (!prog.options.son) basculerSon(); if (questionOuverte) setTimeout(() => { if (questionOuverte) jouerBruit(questionOuverte.q.s); }, 150); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.ok[partie.siege] * 10 : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
