  // ---------------------------------------------------------------------
  //  Tutoriels animés : de vraies petites parties jouées par le moteur
  // ---------------------------------------------------------------------

  // Chaque tutoriel : réglages, tapis, commande, coups joués (place 0 = toi,
  // avec la main ; les autres places jouent sans main).
  const TUTOS = {
    base: { k: {}, tap: ['ch', 'to', 'ol', 'fr', 'pa'], o: ['fromagere', [1, 0, 0]], coups: [[0, 'to', 'c'], [0, 'fr', 'c']] },
    tapis: { k: {}, tap: ['to', 'ol', 'ch', 'fr', 'pa'], o: ['olivette', [1, 1, 0, 0]], r1: ['champetre', [1, 1, 0]], coups: [[1, 'ch', 'c'], [0, 'ol', 'c'], [2, 'pa', 'x']] },
    reserve: { k: { res: 1 }, tap: ['pa', 'ch', 'fr', 'ol', 'to', 'po'], o: ['fromagere', [1, 1, 0]], coups: [[0, 'pa', 'r'], [0, 'fr', 'c']] },
    presse: { k: { res: 1, pr: 0.3 }, tap: ['ja', 'ol', 'to', 'ch', 'fr', 'pa'], o: ['reine', [1, 1, 0, 0], 3], coups: [[0, 'ja', 'c'], [0, 'ch', 'c']] },
    four: { k: { res: 1, four: 3 }, tap: ['ol', 'fr', 'ch', 'to', 'pa', 'ja'], o: ['fromagere', [1, 1, 0]], four: [[2, 1, 'reine']], coups: [[0, 'fr', 'c'], [1, 'ol', 'x']] },
    rare: { k: { res: 1, rare: 1, four: 3 }, tap: ['ol', 'fr', 'to', 'ch', 'pa', 'ja'], file: ['tr', 'to', 'fr'], o: ['truffee', [1, 1, 1, 0]], coups: [[0, 'v0', 'v'], [1, 'ol', 'x']] },
    piment: { k: { res: 1, pim: 1, four: 3 }, tap: ['pi', 'ol', 'fr', 'to', 'pa', 'ch'], o: ['fromagere', [1, 1, 0], 0, 1], coups: [[0, 'pi', 'c'], [0, 'fr', 'c']] },
    four2: { k: { res: 1, four: 2 }, tap: ['ch', 'fr', 'ol', 'to', 'pa', 'ja', 'po'], o: ['fromagere', [1, 1, 0]], four: [[1, 4, 'reine'], [3, 3, 'olivette']], coups: [[0, 'fr', 'c'], [1, 'ol', 'x']] },
    geante: { k: { res: 1, four: 3, gt: 6 }, tap: ['ch', 'fr', 'ol', 'to', 'pa', 'ja', 'po'], o: ['blanche', [1, 1, 0, 0]], gt: [['pa', 'to', 'fr', 'ch', 'ol', 'po'], [1, 2, -1, -1, -1, 3]], coups: [[0, 'ch', 'g'], [1, 'ol', 'g'], [0, 'po', 'g']] },
    rapide: { k: { res: 1, four: 3, rap: 2 }, tap: ['to', 'ol', 'ch', 'fr', 'pa', 'ja', 'po'], o: ['reine', [1, 1, 0, 0]], coups: [[0, 'ja', 'c'], [1, 'fr', 'x']] }
  };

  function etatTuto(d) {
    const k = Object.assign({ L: d.tap.length, rec: ['fromagere', 'champetre', 'olivette', 'reine'], t: 99, res: 0, pr: 0, four: 0, rare: 0, pim: 0, gt: 0, rap: 1 }, d.k);
    const cmd = (x) => {
      const ing = O.RECETTES[x[0]].slice();
      return { r: x[0], ing: ing, ok: x[1].slice(), p: x[2] || 0, e: x[3] || 0, pim: 0 };
    };
    const e = { n: 0, k: k, tap: d.tap.slice(), file: (d.file || ['to', 'fr', 'pa']).slice(), fr2: [-1, -1, -1], j: [], four: [], att: [], gt: null, gtDans: 99, sc: [0, 0, 0, 0, 0], tour: 0, reste: 999, num: 0, ev: [] };
    const autres = ['champetre', 'reine', 'olivette', 'jardiniere'];
    for (let s = 0; s < PLACES; s++) e.j.push({ o: s === 0 ? cmd(d.o) : (s === 1 && d.r1 ? cmd(d.r1) : cmd([autres[s - 1], O.RECETTES[autres[s - 1]].map((_, i) => (i < 2 ? 1 : 0))])), r: [], pz: 0, v: -1 });
    (d.four || []).forEach((p) => e.four.push({ s: p[0], v: 8, t: p[1], r: p[2] }));
    if (d.gt) e.gt = { ing: d.gt[0].slice(), qui: d.gt[1].slice(), v: d.gt[0].length * 2 + 6 };
    return e;
  }

  // Action d'un coup de tutoriel, d'après le code de l'ingrédient (le tapis bouge).
  function actionTuto(e, coup) {
    if (coup[2] === 'v') return { t: 'v', k: parseInt(coup[1].slice(1), 10) || 0 };
    let i = e.tap.lastIndexOf(coup[1]);
    if (i < 0) i = e.tap.findIndex((x) => !!x);
    return { t: 'p', i: Math.max(0, i), d: coup[2] };
  }

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const W = 560, H = 400;
    let e = etatTuto(d), fait = 0, debut = 0, an = nouvelleAnim(), g = null;
    const PAS = 1700, j = ++tutoAnim;
    let al = graineHasard(3);
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ecoule = t - debut, k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      if (k >= d.coups.length + 1) { e = etatTuto(d); fait = 0; an = nouvelleAnim(); debut = t; al = graineHasard(3); }
      else if (k >= fait && fait < d.coups.length && dans >= (d.coups[fait][0] === 0 ? 900 : 400)) {
        const coup = d.coups[fait], a = actionTuto(e, coup);
        const avant = JSON.parse(JSON.stringify(e));
        e.tour = coup[0];
        e = R.jouer(e, coup[0], a, al);
        animerCoup(an, g, avant, e, coup[0], a, 0, t);
        (e.ev || []).forEach((x) => {
          if (x.t === 'finie' && x.s === 0 && g && g.zCmd) jaillir(an, g.zCmd.pizza.x, g.zCmd.pizza.y, COUL[0], 14, 9);
          if ((x.t === 'finie' && !e.k.four) || x.t === 'servie') an.textes.push({ txt: '+' + nb(x.v), x: x.s === 0 && g ? g.zCmd.pizza.x : W * (x.s + 0.5) / PLACES, y: x.s === 0 && g ? g.zCmd.pizza.y - 20 : 40, t0: t + 300, coul: COUL_F[x.s] });
          if (x.t === 'epice' || x.t === 'gache') an.secousse = x.t === 'gache' ? t : 0;
        });
        fait++;
      }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, W, H);
      g = rendu(c, W, H, e, 0, { t: t, anim: an, skin: prog.options.four, reservable: [] });
      // la main pour les gestes du joueur
      const prochain = fait < d.coups.length ? d.coups[fait] : null;
      if (prochain && prochain[0] === 0 && g) {
        const a = actionTuto(e, prochain);
        let p;
        if (a.t === 'v') p = centre(g.bientot.items[a.k]);
        else { const sl = g.tapis.slots[a.i]; p = [sl.x + sl.w / 2, sl.y + g.sz * 0.46]; }
        const q = Math.min(1, dans / 700);
        main(c, W - 40 + (p[0] - (W - 40)) * q, H - 20 + (p[1] - (H - 20)) * q, 1.5, q >= 1 ? Math.min(1, (dans - 700) / 150) : 0);
      }
      tutoId = requestAnimationFrame(image);
    }
    let tutoId = requestAnimationFrame(image);
    brancherFermeture(() => { tutoAnim++; cancelAnimationFrame(tutoId); }, apres);
  }

  // Nouvelles recettes : la pizza et ses ingrédients.
  function montrerRecettes(liste, apres) {
    $('tuto-titre').textContent = tr(liste.length > 1 ? 'recettes.nouvelles' : 'recettes.nouvelle');
    $('tuto-texte').textContent = liste.map((r) => tr('recette.' + r) + ' : ' + O.RECETTES[r].map((x) => tr('ingr.' + x)).join(', ')).join(' · ');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const W = 560, H = 400, j = ++tutoAnim;
    function image(t) {
      if (j !== tutoAnim) return;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, W, H);
      const n = liste.length, lw = W / n;
      liste.forEach((r, k) => {
        const cx = lw * (k + 0.5), ing = O.RECETTES[r];
        const pr = Math.min(lw * 0.32, 110);
        const montre = Math.min(ing.length, Math.floor(((t / 600) % (ing.length + 3))) + 1);
        dessinerPizza(c, cx, 150, pr, ing.slice(0, montre), t);
        texte(c, tr('recette.' + r), cx, 285, lw - 16, 26, { align: 'center', coul: '#8f1d12' });
        const ss = Math.min(44, (lw - 16) / ing.length - 4);
        ing.forEach((x, i) => {
          const xx = cx - (ing.length * (ss + 4) - 4) / 2 + i * (ss + 4) + ss / 2;
          c.fillStyle = i < montre ? '#e6f7e3' : '#fff'; c.strokeStyle = '#d3b28f'; c.lineWidth = 2; rr(c, xx - ss / 2, 320, ss, ss, 10); c.fill(); c.stroke();
          dessinerIngr(c, x, xx, 320 + ss / 2, ss * 0.36, t);
        });
      });
      tutoId = requestAnimationFrame(image);
    }
    let tutoId = requestAnimationFrame(image);
    brancherFermeture(() => { tutoAnim++; cancelAnimationFrame(tutoId); }, apres);
  }

  function brancherFermeture(arreter, apres) {
    const fermer = () => {
      arreter();
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier ; bulle de choix
  // ---------------------------------------------------------------------

  const dans = (r, x, y) => r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

  // Destinations possibles pour la case i du tapis (sans le bac).
  function destinations(i) {
    if (!vue || !partie) return [];
    return O.actions(vue, partie.siege).filter((a) => a.t === 'p' && a.i === i).map((a) => a.d);
  }

  function fermerChoix() {
    selection = null;
    $('choix').classList.remove('actif');
  }

  // Touche d'un ingrédient : une seule destination utile → on joue ; sinon, la bulle.
  function toucherCase(i) {
    if (!vue || !partie || enPause || attenteTuto) return;
    if (!vue.tap[i]) return;
    if (!partie.monTour()) { attendsTonTour(); return; }
    const code = vue.tap[i], o = vue.j[partie.siege].o;
    let ds = destinations(i);
    if (code === 'pi' && !(o.e && !o.pim)) ds = ds.filter((d) => d !== 'c');   // un piment gâcherait ta pizza
    const utiles = ds.filter((d) => d !== 'x');
    if (utiles.length === 1) { jouer({ t: 'p', i: i, d: utiles[0] }); return; }
    ouvrirChoix({ t: 'p', i: i }, utiles.length ? utiles : ['x']);
  }

  function toucherBientot(k) {
    if (!vue || !partie || enPause || attenteTuto) return;
    if (!partie.monTour()) { attendsTonTour(); return; }
    if (reservables().indexOf(k) < 0) {
      const code = vue.file[k];
      if (O.estRare(code)) toast(tr(vue.fr2[k] >= 0 ? 'choix.dejaReserve' : 'choix.uneReservation'), 2200);
      else toast(tr('choix.bientot'), 2200);
      sons.non();
      return;
    }
    ouvrirChoix({ t: 'v', k: k }, ['v']);
  }

  function attendsTonTour() {
    if (Date.now() - dernierAttends > 1500 && partie && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
  }

  function ouvrirChoix(sel, ds) {
    selection = sel;
    const boite = $('choix-boutons');
    boite.textContent = '';
    const code = sel.t === 'p' ? vue.tap[sel.i] : vue.file[sel.k];
    $('choix-titre').textContent = tr('choix.titre', { ingr: tr('ingr.' + code) });
    ds.forEach((d) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn' + (d === ds[0] ? ' vert' : '');
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60;
      const c = cv.getContext('2d');
      if (d === 'c') dessinerPizza(c, 30, 30, 24, ['pa', 'to', 'fr'], 0);
      else if (d === 'g') { dessinerPizza(c, 30, 30, 26, ['pa', 'to', 'fr', 'ch', 'ol'], 0); }
      else if (d === 'r') { c.fillStyle = '#f3e3cc'; c.strokeStyle = '#c7a27f'; c.lineWidth = 3; rr(c, 8, 8, 44, 44, 10); c.fill(); c.stroke(); dessinerIngr(c, code, 30, 30, 16, 0); }
      else if (d === 'v') { dessinerIngr(c, code, 30, 30, 22, 0); }
      else { c.fillStyle = '#8a5a2b'; c.beginPath(); c.moveTo(10, 18); c.lineTo(50, 18); c.lineTo(44, 54); c.lineTo(16, 54); c.closePath(); c.fill(); }
      const sp = document.createElement('span'); sp.textContent = tr('choix.' + d);
      b.append(cv, sp);
      b.addEventListener('click', (ev) => {
        ev.stopPropagation(); audio();
        const a = sel.t === 'p' ? { t: 'p', i: sel.i, d: d } : { t: 'v', k: sel.k };
        fermerChoix();
        jouer(a);
      });
      boite.appendChild(b);
    });
    // place de la bulle : au-dessus du tapis, près de l'ingrédient
    const el = $('choix'), zone = $('zone');
    el.classList.add('actif');
    if (geo) {
      const r = sel.t === 'p' ? geo.tapis.slots[sel.i] : geo.bientot.items[sel.k];
      const lw = el.offsetWidth, lh = el.offsetHeight;
      let x = r.x + r.w / 2 - lw / 2, y = r.y - lh - 8;
      if (y < 4) y = r.y + r.h + 18;
      x = Math.max(4, Math.min(zone.clientWidth - lw - 4, x));
      y = Math.max(4, Math.min(zone.clientHeight - lh - 4, y));
      el.style.left = x + 'px'; el.style.top = y + 'px';
    }
    sons.clic();
    const premier = boite.querySelector('button');
    if (premier) try { premier.focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }

  function jouer(a) {
    if (!partie || !partie.monTour()) return;
    if (partie.jouer(a)) { curseur = null; }
  }

  // Curseur du clavier : ingrédients du tapis et rares réservables, de gauche à droite.
  function listeCurseur() {
    const l = [];
    if (!vue) return l;
    reservables().forEach((k) => l.push({ t: 'v', k: k }));
    vue.tap.forEach((x, i) => { if (x) l.push({ t: 'p', i: i }); });
    return l;
  }
  function curseurValide(cu) { return listeCurseur().some((x) => x.t === cu.t && x.i === cu.i && x.k === cu.k); }
  function premierCurseur() {
    const l = listeCurseur();
    if (!l.length) return null;
    // de préférence, un ingrédient dont ta commande a besoin
    if (vue && partie && partie.siege >= 0) {
      const o = vue.j[partie.siege].o;
      const u = l.find((x) => x.t === 'p' && O.besoin(o, vue.tap[x.i]) >= 0);
      if (u) return u;
    }
    return l[0];
  }
  function deplacerCurseur(dx) {
    const l = listeCurseur();
    if (!l.length) return;
    let k = curseur ? l.findIndex((x) => x.t === curseur.t && x.i === curseur.i && x.k === curseur.k) : -1;
    if (k < 0) { curseur = premierCurseur(); return; }
    k = (k + dx + l.length) % l.length;
    curseur = l[k];
    sons.clic();
  }

  const plateau = $('plateau');
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  plateau.addEventListener('pointerup', (ev) => {
    audio();
    if (!geo || !vue) return;
    const p = point(ev);
    if (selection) { fermerChoix(); }
    for (let i = 0; i < geo.tapis.slots.length; i++) {
      const s = geo.tapis.slots[i];
      if (dans({ x: s.x, y: s.y - 4, w: s.w, h: s.h + 16 }, p[0], p[1])) { curseur = null; toucherCase(i); return; }
    }
    for (let k = 0; k < geo.bientot.items.length; k++) {
      const it = geo.bientot.items[k];
      if (dans({ x: it.x - 8, y: it.y - 8, w: it.w + 16, h: it.h + 16 }, p[0], p[1])) { curseur = null; toucherBientot(k); return; }
    }
  });

  $('choix-annuler').addEventListener('click', (ev) => { ev.stopPropagation(); sons.clic(); fermerChoix(); try { plateau.focus({ preventScroll: true }); } catch (e) { /* rien */ } });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if ($('choix').classList.contains('actif')) {
      const bts = Array.from($('choix').querySelectorAll('button'));
      const k = bts.indexOf(document.activeElement);
      if (ev.code === 'Escape') { ev.preventDefault(); fermerChoix(); try { plateau.focus({ preventScroll: true }); } catch (e) { /* rien */ } return; }
      if (ev.code === 'ArrowDown' || ev.code === 'ArrowRight') { ev.preventDefault(); bts[(k + 1 + bts.length) % bts.length].focus(); return; }
      if (ev.code === 'ArrowUp' || ev.code === 'ArrowLeft') { ev.preventDefault(); bts[(k - 1 + bts.length) % bts.length].focus(); return; }
      return;                              // Entrée ou Espace : le bouton qui a le focus
    }
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    if (ev.code === 'ArrowLeft' || ev.code === 'ArrowUp') { ev.preventDefault(); audio(); if (!curseur) curseur = premierCurseur(); else deplacerCurseur(-1); }
    else if (ev.code === 'ArrowRight' || ev.code === 'ArrowDown') { ev.preventDefault(); audio(); if (!curseur) curseur = premierCurseur(); else deplacerCurseur(1); }
    else if (/^Digit[1-7]$/.test(ev.code) || /^Numpad[1-7]$/.test(ev.code)) {
      const i = parseInt(ev.code.slice(-1), 10) - 1;
      if (vue && i < vue.tap.length) { ev.preventDefault(); audio(); curseur = { t: 'p', i: i }; toucherCase(i); }
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (!curseur || !curseurValide(curseur)) { curseur = premierCurseur(); return; }
      if (curseur.t === 'p') toucherCase(curseur.i); else toucherBientot(curseur.k);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-atelier').addEventListener('click', () => { audio(); sons.clic(); ouvrirAtelier(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('atelier-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(); else fermerChoix(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
})();
</script>
</body>
</html>
