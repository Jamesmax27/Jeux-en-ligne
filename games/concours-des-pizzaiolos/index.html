    c.fillStyle = lueur; c.fillRect(mx, my, mw, mh);
    for (let i = 0; i < 3; i++) flamme(c, mx + mw * (0.2 + i * 0.3), base - mh * 0.28, mh * 0.18, t + i * 300);
    return { fx: fx, fy: fy, fw: fw, fh: fh, mx: mx, my: my, mw: mw, mh: mh, base: base };
  }

  // ---------------------------------------------------------------------
  //  Le plateau : disposition et dessin (jeu et tutoriels)
  // ---------------------------------------------------------------------

  // Disposition des zones selon la taille du plateau et les règles du niveau.
  function mise(w, h, e) {
    const pad = Math.max(6, Math.min(12, w * 0.02));
    const L = e.tap.length;
    const sz = Math.max(32, Math.min(72, (w - 2 * pad) / (L + 0.85), h * 0.12));
    const avecHaut = !!(e.k.four || e.k.gt);
    const cmdH = Math.min(avecHaut ? 230 : 260, Math.max(128, h * (avecHaut ? 0.34 : 0.4)));
    const bientotH = sz * 0.62 + 18;
    const tapisH = sz * 1.08 + 14;
    let hautH = 0;
    if (avecHaut) hautH = Math.max(64, Math.min(150, h - cmdH - bientotH - tapisH - pad * 5));
    const total = hautH + bientotH + tapisH + cmdH;
    const n = avecHaut ? 4 : 3;
    const gap = Math.max(pad * 0.5, Math.min(avecHaut ? 26 : 44, (h - total) / (n + 1)));
    let y = Math.max(pad * 0.5, (h - total - gap * (n - 1)) / 2);
    const g = { w: w, h: h, pad: pad, sz: sz };
    if (avecHaut) {
      const W = w - 2 * pad;
      if (e.k.four && e.k.gt) {
        g.four = { x: pad, y: y, w: W * 0.4, h: hautH };
        g.geante = { x: pad + W * 0.42, y: y, w: W * 0.58, h: hautH };
      } else if (e.k.four) g.four = { x: pad + W * 0.1, y: y, w: W * 0.8, h: hautH };
      else g.geante = { x: pad + W * 0.08, y: y, w: W * 0.84, h: hautH };
      y += hautH + gap;
    }
    const bacW = sz * 0.85;
    const tapW = sz * L;
    const tx = Math.max(pad, (w - tapW - bacW) / 2);
    const bs = sz * 0.62;
    g.bientot = { x: tx, y: y, h: bientotH, s: bs, items: [] };
    for (let k = 0; k < 3; k++) g.bientot.items.push({ x: tx + bs * 0.1 + k * (bs + 6) + sz * 1.5, y: y + 16, w: bs, h: bs });
    y += bientotH;
    g.tapis = { x: tx, y: y, w: tapW, h: sz * 1.08, slots: [] };
    for (let i = 0; i < L; i++) g.tapis.slots.push({ x: tx + i * sz, y: y, w: sz, h: sz });
    g.bac = { x: tx + tapW + 2, y: y + sz * 0.1, w: bacW - 2, h: sz * 0.95 };
    y += tapisH + gap;
    g.cmd = { x: pad, y: y, w: w - 2 * pad, h: cmdH };
    return g;
  }

  function centre(r) { return [r.x + r.w / 2, r.y + r.h / 2]; }

  // Positions dans le panneau de la commande (pizza, cases, réserve).
  function miseCommande(g, o, e) {
    const r = g.cmd, p = 8;
    const rh = Math.min(50, r.h * 0.3);
    const res = [];
    const rs = Math.max(26, Math.min(rh - 12, 40));
    if (e.k.res) for (let k = 0; k < O.RESERVE_MAX; k++) res.push({ x: r.x + r.w - p - (O.RESERVE_MAX - k) * (rs + 5), y: r.y + p + 12, w: rs, h: rs });
    const bas = r.y + rh + p * 1.5;
    const hb = r.y + r.h - p - bas;
    const pr = Math.max(14, Math.min(hb / 2, r.w * 0.17));
    const pizza = { x: r.x + p + pr * 1.1, y: bas + hb / 2, r: pr };
    const n = o.ing.length;
    const zoneX = r.x + p + pr * 2.3 + p, zoneW = r.x + r.w - p - zoneX;
    const ss = Math.max(26, Math.min(58, zoneW / n - 6, hb - 4));
    const cases = [];
    const largeur = n * ss + (n - 1) * 6;
    const x0 = zoneX + Math.max(0, (zoneW - largeur) / 2);
    for (let i = 0; i < n; i++) cases.push({ x: x0 + i * (ss + 6), y: bas + (hb - ss) / 2, w: ss, h: ss });
    return { rh: rh, res: res, pizza: pizza, cases: cases, client: { x: r.x + p + rh * 0.5, y: r.y + p + rh * 0.45, r: rh * 0.45 } };
  }

  // Tapis roulant : bande, rouleaux, ingrédients, points des rivaux.
  function dessinerTapis(c, e, g, moi, opt) {
    const t = opt.t, sz = g.sz, tp = g.tapis, anim = opt.anim;
    // décalage pendant que le tapis avance
    let dec = 0;
    if (anim && anim.tapis) { const p = Math.min(1, (t - anim.tapis.t0) / anim.tapis.d); if (p < 1) dec = (1 - (1 - p) * (1 - p)) * anim.tapis.n * sz - anim.tapis.n * sz; else anim.tapis = null; }
    // bientôt
    const bi = g.bientot;
    texte(c, tr('jeu.bientot'), bi.items[0].x - 6, bi.items[0].y + bi.s / 2, sz * 1.4, Math.max(11, sz * 0.24), { align: 'right', coul: '#7a4320' });
    c.strokeStyle = '#a5532c'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(bi.items[0].x - 2, bi.items[0].y + bi.s + 2); c.quadraticCurveTo(tp.x + sz * 0.2, bi.items[0].y + bi.s + 6, tp.x + sz * 0.4, tp.y + 4); c.stroke();
    for (let k = 0; k < 3 && k < e.file.length; k++) {
      const it = bi.items[k], cx = it.x + it.w / 2, cy = it.y + it.h / 2;
      c.fillStyle = '#fff3df'; c.strokeStyle = '#d6a77c'; c.lineWidth = 2; rr(c, it.x, it.y, it.w, it.h, it.w * 0.25); c.fill(); c.stroke();
      const qui = e.fr2[k];
      if (qui >= 0) { c.strokeStyle = COUL[qui]; c.lineWidth = 4; rr(c, it.x - 1, it.y - 1, it.w + 2, it.h + 2, it.w * 0.25); c.stroke(); }
      else if (opt.reservable && opt.reservable.indexOf(k) >= 0) {
        c.strokeStyle = 'rgba(255,190,0,' + (0.55 + 0.45 * Math.sin(t / 180)).toFixed(2) + ')'; c.lineWidth = 4; rr(c, it.x - 2, it.y - 2, it.w + 4, it.h + 4, it.w * 0.28); c.stroke();
      }
      dessinerIngr(c, e.file[k], cx, cy, it.w * 0.36, t);
      if (qui >= 0) { c.fillStyle = COUL[qui]; rond(c, it.x + it.w - 3, it.y + 3, it.w * 0.16); c.fill(); }
      if (opt.curseur && opt.curseur.t === 'v' && opt.curseur.k === k) { c.strokeStyle = '#1a4fb8'; c.lineWidth = 3; rr(c, it.x - 4, it.y - 4, it.w + 8, it.h + 8, it.w * 0.3); c.stroke(); }
    }
    // bande
    c.fillStyle = 'rgba(0,0,0,.18)'; rr(c, tp.x + 3, tp.y + 5, tp.w, tp.h, 10); c.fill();
    c.fillStyle = '#4b5059'; rr(c, tp.x, tp.y, tp.w, tp.h, 10); c.fill();
    c.fillStyle = '#5d636d'; rr(c, tp.x + 3, tp.y + 3, tp.w - 6, tp.h - 10, 8); c.fill();
    c.save(); rr(c, tp.x + 3, tp.y + 3, tp.w - 6, tp.h - 10, 8); c.clip();
    c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 3;
    if (dec) for (let xx = tp.x - sz + (dec % (sz / 3)) + sz / 3; xx < tp.x + tp.w; xx += sz / 3) { c.beginPath(); c.moveTo(xx, tp.y); c.lineTo(xx + 6, tp.y + tp.h); c.stroke(); }
    else for (let xx = tp.x; xx < tp.x + tp.w; xx += sz / 3) { c.beginPath(); c.moveTo(xx, tp.y); c.lineTo(xx + 6, tp.y + tp.h); c.stroke(); }
    c.restore();
    c.fillStyle = '#2f333a';
    for (let xx = tp.x + 8; xx < tp.x + tp.w - 4; xx += sz / 2) { rond(c, xx, tp.y + tp.h - 4, 3); c.fill(); }
    // séparations
    c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1;
    for (let i = 1; i < e.tap.length; i++) { const xx = tp.x + i * sz + dec; c.beginPath(); c.moveTo(xx, tp.y + 4); c.lineTo(xx, tp.y + tp.h - 8); c.stroke(); }
    // bac au bout du tapis
    const bc = g.bac;
    c.fillStyle = '#8a5a2b'; c.strokeStyle = '#4a2e12'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(bc.x, bc.y + bc.h * 0.2); c.lineTo(bc.x + bc.w, bc.y + bc.h * 0.2); c.lineTo(bc.x + bc.w * 0.88, bc.y + bc.h); c.lineTo(bc.x + bc.w * 0.12, bc.y + bc.h); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.moveTo(bc.x + bc.w * 0.1, bc.y + bc.h * 0.55); c.lineTo(bc.x + bc.w * 0.9, bc.y + bc.h * 0.55); c.stroke();
    // ingrédients
    const mien = moi >= 0 ? e.j[moi].o : null;
    for (let i = 0; i < e.tap.length; i++) {
      const code = e.tap[i];
      if (!code) continue;
      const s = tp.slots[i], cx = s.x + sz / 2 + dec, cy = s.y + sz * 0.46;
      if (cx < tp.x + sz * 0.3) continue;
      const utile = mien && (code === 'pi' ? (mien.e && !mien.pim) : O.besoin(mien, code) >= 0);
      if (utile) { c.fillStyle = 'rgba(255,225,80,' + (0.35 + 0.2 * Math.sin(t / 200)).toFixed(2) + ')'; rond(c, cx, cy, sz * 0.44); c.fill(); }
      if (opt.sel && opt.sel.t === 'p' && opt.sel.i === i) { c.fillStyle = 'rgba(255,255,255,.75)'; rond(c, cx, cy, sz * 0.46); c.fill(); }
      dessinerIngr(c, code, cx, cy, sz * 0.36, t);
      // la commande géante en a besoin : petite part de pizza orange
      if (code !== 'pi' && O.besoinGeante(e.gt, code) >= 0) {
        const px = cx + sz * 0.3, py = s.y + sz * 0.12, k = sz * 0.13;
        c.fillStyle = '#f0a020'; c.strokeStyle = '#fff'; c.lineWidth = 1.5;
        c.beginPath(); c.moveTo(px - k, py - k * 0.6); c.lineTo(px + k, py - k * 0.6); c.lineTo(px, py + k); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = '#d9412b'; rond(c, px, py - k * 0.1, k * 0.25); c.fill();
      }
      if (opt.curseur && opt.curseur.t === 'p' && opt.curseur.i === i) {
        c.strokeStyle = 'rgba(26,79,184,' + (0.6 + 0.4 * Math.sin(t / 150)).toFixed(2) + ')'; c.lineWidth = 3.5; rond(c, cx, cy, sz * 0.47); c.stroke();
      }
      // rivaux qui en ont besoin : points de couleur sous l'ingrédient
      if (opt.points !== false) {
        const qui = [];
        for (let p = 0; p < e.j.length; p++) {
          if (p === moi) continue;
          const o = e.j[p].o;
          if (code === 'pi' ? (o.e && !o.pim) : O.besoin(o, code) >= 0) qui.push(p);
        }
        qui.forEach((p, k) => { c.fillStyle = COUL[p]; c.strokeStyle = '#fff'; c.lineWidth = 1.5; rond(c, cx + (k - (qui.length - 1) / 2) * sz * 0.17, tp.y + tp.h + 7, sz * 0.07 + 1); c.fill(); c.stroke(); });
      }
    }
    // ingrédients qui tombent dans le bac
    if (anim) for (let k = anim.tombes.length - 1; k >= 0; k--) {
      const tb = anim.tombes[k], p = (t - tb.t0) / 520;
      if (p >= 1) { anim.tombes.splice(k, 1); continue; }
      if (p < 0) continue;
      c.globalAlpha = 1 - p * 0.6;
      dessinerIngr(c, tb.c, bc.x + bc.w / 2 + (1 - p) * sz * 0.3, tp.y + sz * 0.46 + p * p * sz * 0.5, sz * 0.36 * (1 - p * 0.4), t);
      c.globalAlpha = 1;
    }
  }

  // Panneau de la commande du joueur (ou de la place suivie).
  function dessinerCommande(c, e, g, moi, opt) {
    const t = opt.t, r = g.cmd;
    const s = moi >= 0 ? moi : 0, f = e.j[s], o = f.o, m = miseCommande(g, o, e);
    let sx = 0;
    if (opt.anim && opt.anim.secousse) { const p = (t - opt.anim.secousse) / 450; if (p < 1) sx = Math.sin(p * 30) * 7 * (1 - p); else opt.anim.secousse = 0; }
    c.save(); c.translate(sx, 0);
    c.fillStyle = 'rgba(0,0,0,.15)'; rr(c, r.x + 3, r.y + 5, r.w, r.h, 18); c.fill();
    c.fillStyle = '#fff8ec'; c.strokeStyle = COUL[s]; c.lineWidth = 4; rr(c, r.x, r.y, r.w, r.h, 18); c.fill(); c.stroke();
    // client, nom de la recette, valeur
    client(c, m.client.x, m.client.y, m.client.r, o.r.length * 7 + o.ing.length + (e.num || 0) % 1);
    let tx = m.client.x + m.client.r + 8;
    const finTexte = (m.res.length ? m.res[0].x - 6 : r.x + r.w - 8);
    if (o.p !== 0) { horloge(c, tx + m.rh * 0.22, m.client.y, m.rh * 0.22, o.p > 0 ? o.p / (o.ing.length + 2) : 0); tx += m.rh * 0.5; }
    if (o.e) { flamme(c, tx + m.rh * 0.18, m.client.y, m.rh * 0.3, t); tx += m.rh * 0.42; }
    texte(c, tr('recette.' + o.r), tx, m.client.y - m.rh * 0.16, finTexte - tx, Math.max(12, m.rh * 0.36), { coul: COUL_F[s] });
    let detail = tr('commande.points', { n: O.valeurCommande(o) });
    if (o.p > 0) detail += ' · ' + tr('commande.presse', { n: o.p });
    else if (o.p < 0) detail += ' · ' + tr('commande.retard');
    if (o.e) detail += ' · ' + tr(o.pim ? 'commande.pimente' : 'commande.epice');
    texte(c, detail, tx, m.client.y + m.rh * 0.26, finTexte - tx, Math.max(10, m.rh * 0.25), { poids: 700, coul: '#7a4320' });
    // réserve
    m.res.forEach((q, k) => {
      c.fillStyle = '#f3e3cc'; c.strokeStyle = '#c7a27f'; c.lineWidth = 2; c.setLineDash([4, 3]); rr(c, q.x, q.y, q.w, q.h, 10); c.fill(); c.stroke(); c.setLineDash([]);
      if (f.r[k]) dessinerIngr(c, f.r[k], q.x + q.w / 2, q.y + q.h / 2, q.w * 0.38, t);
    });
    if (m.res.length) texte(c, tr('jeu.reserve'), m.res[0].x + (m.res.length * (m.res[0].w + 5) - 5) / 2, m.res[0].y - 7, m.res.length * (m.res[0].w + 5) + 4, 11, { align: 'center', poids: 700, coul: '#7a4320' });
    // pizza en cours
    const poses = o.ing.filter((_, i) => o.ok[i]);
    dessinerPizza(c, m.pizza.x, m.pizza.y, m.pizza.r, poses, t, { pimente: o.pim });
    // cases des ingrédients
    m.cases.forEach((q, i) => {
      const ok = o.ok[i];
      c.fillStyle = ok ? '#e6f7e3' : '#fff'; c.strokeStyle = ok ? '#2f9e44' : '#d3b28f'; c.lineWidth = ok ? 3 : 2;
      if (!ok) c.setLineDash([5, 4]);
      rr(c, q.x, q.y, q.w, q.h, q.w * 0.22); c.fill(); c.stroke(); c.setLineDash([]);
      c.globalAlpha = ok ? 1 : 0.42;
      dessinerIngr(c, o.ing[i], q.x + q.w / 2, q.y + q.h / 2, q.w * 0.36, t);
      c.globalAlpha = 1;
      if (ok) { c.fillStyle = '#2f9e44'; rond(c, q.x + q.w - 4, q.y + 4, q.w * 0.15); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.moveTo(q.x + q.w - 4 - q.w * 0.07, q.y + 4); c.lineTo(q.x + q.w - 4 - q.w * 0.01, q.y + 4 + q.w * 0.06); c.lineTo(q.x + q.w - 4 + q.w * 0.08, q.y + 4 - q.w * 0.06); c.stroke(); }
    });
    c.restore();
    return m;
  }

  // Four et pizzas qui attendent.
  function dessinerZoneFour(c, e, g, opt) {
    const r = g.four, t = opt.t;
    const fourH = r.h * 0.86;
    const f = dessinerFour(c, r.x, r.y, r.w * 0.72, fourH, opt.skin, t, e, false);
    const n = e.k.four, pr = Math.min(f.mw / (n * 2.4), f.mh * 0.3);
    const places = [];
    for (let k = 0; k < n; k++) {
      const px = f.mx + f.mw * (k + 0.5) / n, py = f.base - pr * 1.2;
      places.push([px, py]);
      const pz = e.four[k];
      if (pz) {
        dessinerPizza(c, px, py, pr, O.RECETTES[pz.r] || ['pa', 'to'], t);
        c.strokeStyle = COUL[pz.s]; c.lineWidth = 3; rond(c, px, py, pr * 1.15); c.stroke();
        // temps de cuisson restant : petits points
        for (let q = 0; q < PLACES; q++) { c.fillStyle = q < pz.t ? '#ffe9a8' : 'rgba(255,255,255,.25)'; rond(c, px - pr + q * pr * 0.5, py - pr * 1.5, Math.max(1.5, pr * 0.12)); c.fill(); }
      } else {
        c.strokeStyle = 'rgba(255,220,160,.5)'; c.lineWidth = 2; c.setLineDash([3, 3]); rond(c, px, py, pr); c.stroke(); c.setLineDash([]);
      }
    }
    // pizzas qui attendent une place (sur le comptoir à droite)
    const ax = r.x + r.w * 0.76, aw = r.w * 0.24;
    c.fillStyle = '#c69c6d'; c.fillRect(ax, r.y + fourH - 6, aw, 8);
    texte(c, tr('four.attente'), ax + aw / 2, r.y + 8, aw + 10, 11, { align: 'center', poids: 700, coul: '#7a4320' });
    const ar = Math.min(aw * 0.32, r.h * 0.13);
    e.att.slice(0, 4).forEach((p, k) => {
      const px = ax + aw / 2, py = r.y + fourH - 8 - ar - k * ar * 1.25;
      dessinerPizza(c, px, py, ar, O.RECETTES[p.r] || ['pa'], t);
      c.strokeStyle = COUL[p.s]; c.lineWidth = 2.5; rond(c, px, py, ar * 1.12); c.stroke();
    });
    texte(c, tr('four.places', { n: n }), r.x + r.w * 0.36, r.y + r.h - 6, r.w * 0.72, 11, { align: 'center', poids: 800, coul: '#7a4320' });
    return { places: places, pr: pr };
  }

  // Commande géante (au centre), avec la couleur de qui a posé chaque ingrédient.
  function dessinerZoneGeante(c, e, g, opt) {
    const r = g.geante, t = opt.t;
    c.fillStyle = 'rgba(0,0,0,.12)'; rr(c, r.x + 3, r.y + 4, r.w, r.h, 16); c.fill();
    c.fillStyle = '#fff3d6'; c.strokeStyle = '#e09a00'; c.lineWidth = 3; rr(c, r.x, r.y, r.w, r.h, 16); c.fill(); c.stroke();
    const cases = [];
    if (!e.gt) {
      texte(c, tr('geante.titre'), r.x + r.w / 2, r.y + r.h * 0.32, r.w - 16, 14, { align: 'center', coul: '#8f1d12' });
      texte(c, tr('geante.bientot', { n: Math.max(1, e.gtDans) }), r.x + r.w / 2, r.y + r.h * 0.62, r.w - 16, 12, { align: 'center', poids: 700, coul: '#7a4320' });
      return { cases: cases };
    }
    const gt = e.gt;
    texte(c, tr('geante.titre'), r.x + 10, r.y + 13, r.w * 0.5 - 16, 13, { coul: '#8f1d12' });
    texte(c, tr('geante.points', { n: gt.v }), r.x + r.w - 10, r.y + 13, r.w * 0.5 - 16, 12, { align: 'right', poids: 800, coul: '#b06a00' });
    const n = gt.ing.length, cols = Math.ceil(n / 2);
    const zoneH = r.h - 30, ss = Math.max(18, Math.min((r.w - 16) / cols - 4, zoneH / 2 - 4));
    const x0 = r.x + (r.w - cols * (ss + 4) + 4) / 2;
    for (let i = 0; i < n; i++) {
      const col = i % cols, lig = Math.floor(i / cols);
      const q = { x: x0 + col * (ss + 4), y: r.y + 26 + lig * (ss + 4) + (zoneH - 2 * (ss + 4)) / 2, w: ss, h: ss };
      cases.push(q);
      const qui = gt.qui[i];
      c.fillStyle = qui >= 0 ? '#fff' : '#fff8ec'; c.strokeStyle = qui >= 0 ? COUL[qui] : '#e0c39b'; c.lineWidth = qui >= 0 ? 3 : 1.5;
      rr(c, q.x, q.y, q.w, q.h, q.w * 0.25); c.fill(); c.stroke();
      c.globalAlpha = qui >= 0 ? 1 : 0.4;
      dessinerIngr(c, gt.ing[i], q.x + q.w / 2, q.y + q.h / 2, q.w * 0.36, t);
      c.globalAlpha = 1;
    }
    return { cases: cases };
  }

  // Dessin complet du plateau. Renvoie la disposition (pour les touchers).
  function rendu(c, w, h, e, moi, opt) {
    const g = mise(w, h, e);
    const t = opt.t;
    g.zFour = e.k.four ? dessinerZoneFour(c, e, g, opt) : null;
    g.zGeante = e.k.gt ? dessinerZoneGeante(c, e, g, opt) : null;
    dessinerTapis(c, e, g, moi, opt);
    g.zCmd = dessinerCommande(c, e, g, moi, opt);
    const anim = opt.anim;
    if (anim) {
      // ingrédients qui volent vers leur destination
      for (let k = anim.vols.length - 1; k >= 0; k--) {
        const v = anim.vols[k], p = (t - v.t0) / v.d;
        if (p >= 1) { anim.vols.splice(k, 1); continue; }
        if (p < 0) continue;
        const q = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        const x = v.x0 + (v.x1 - v.x0) * q, y = v.y0 + (v.y1 - v.y0) * q - Math.sin(q * Math.PI) * g.sz * 0.9;
        dessinerIngr(c, v.c, x, y, g.sz * 0.36 * (1 + 0.25 * Math.sin(q * Math.PI)), t);
      }
      // textes qui s'envolent (+12…)
      for (let k = anim.textes.length - 1; k >= 0; k--) {
        const v = anim.textes[k], p = (t - v.t0) / 1300;
        if (p >= 1) { anim.textes.splice(k, 1); continue; }
        if (p < 0) continue;
        c.globalAlpha = Math.min(1, (1 - p) * 2);
        texte(c, v.txt, v.x, v.y - p * 40, w * 0.8, 20, { align: 'center', coul: v.coul, contour: 4 });
        c.globalAlpha = 1;
      }
      // étincelles
      for (let k = anim.parts.length - 1; k >= 0; k--) {
        const p = anim.parts[k];
        p.vie -= 0.016; p.x += p.vx * 0.016; p.y += p.vy * 0.016; p.vy += 380 * 0.016;
        if (p.vie <= 0) { anim.parts.splice(k, 1); continue; }
        c.globalAlpha = Math.min(1, p.vie * 2); c.fillStyle = p.coul;
        etincelle(c, p.x, p.y, p.k); c.globalAlpha = 1;
      }
    }
    return g;
  }

  // Où se trouve une destination (pour les animations).
  function cible(g, e, s, moi, d, code, avant) {
    if (d === 'x') return centre(g.bac);
    if (d === 'g' && g.zGeante) {
      const i = O.besoinGeante(avant.gt, code);
      if (i >= 0 && g.zGeante.cases[i]) return centre(g.zGeante.cases[i]);
      return centre(g.geante);
    }
    if (s === moi && g.zCmd) {
      if (d === 'r') { const k = Math.min(avant.j[s].r.length, O.RESERVE_MAX - 1); return g.zCmd.res[k] ? centre(g.zCmd.res[k]) : [g.cmd.x + g.cmd.w - 30, g.cmd.y + 20]; }
      const i = code === 'pi' ? -1 : O.besoin(avant.j[s].o, code);
      if (i >= 0 && g.zCmd.cases[i]) return centre(g.zCmd.cases[i]);
      return [g.zCmd.pizza.x, g.zCmd.pizza.y];
    }
    // vers la carte du chef, en haut de l'écran
    return [g.w * (s + 0.5) / PLACES, -g.sz];
  }

  function nouvelleAnim() { return { vols: [], tombes: [], textes: [], parts: [], tapis: null, secousse: 0 }; }

  function jaillir(anim, x, y, coul, n, k) {
    for (let i = 0; i < (n || 14); i++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 170;
      anim.parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 150, vie: 0.7 + Math.random() * 0.4, k: (k || 8) * (0.6 + Math.random() * 0.6), coul: i % 2 ? coul : '#ffe066' });
    }
  }

  // Animation d'un coup (jeu et tutoriels) : ingrédient pris, tapis qui avance, chutes.
  function animerCoup(anim, g, avant, apres, s, a, moi, t) {
    if (!g) return;
    if (a.t === 'p') {
      const code = avant.tap[a.i], sl = g.tapis.slots[a.i];
      if (code && sl) {
        const de = [sl.x + sl.w / 2, sl.y + g.sz * 0.46], vers = cible(g, avant, s, moi, a.d, code, avant);
        anim.vols.push({ c: code, x0: de[0], y0: de[1], x1: vers[0], y1: vers[1], t0: t, d: 520 });
      }
    }
    anim.tapis = { t0: t + 260, d: 360, n: avant.k.rap };
    (apres.ev || []).forEach((ev) => { if (ev.t === 'tombe') anim.tombes.push({ c: ev.c, t0: t + 260 }); });
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#3b2414'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Écran titre : la pizzeria du concours
  // ---------------------------------------------------------------------

  function dessinerTitre() {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const t = 0;
    const sw = Math.min(w, h * 0.8), ox = (w - sw) / 2, u = sw / 10;
    // ciel du soir doré et murs de la place
    let g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#ffb36b'); g.addColorStop(0.45, '#ffe3b0'); g.addColorStop(1, '#f2c48a');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    // façades
    const murY = h * 0.18;
    [['#f3a76b', 0, 0.3], ['#f7d18a', 0.28, 0.46], ['#e9906b', 0.72, 0.3]].forEach((m, i) => {
      const x = m[1] * w, ww = m[2] * w, yy = murY - (i === 1 ? u * 0.8 : 0);
      c.fillStyle = m[0]; c.fillRect(x, yy, ww + 2, h);
      c.fillStyle = '#6b3d1e';
      for (let k = 0; k < 3; k++) for (let l = 0; l < 2; l++) { const fx = x + ww * (0.15 + k * 0.28), fy = yy + u * 0.5 + l * u * 1.3; c.fillStyle = '#7a4a2a'; rr(c, fx, fy, ww * 0.16, u * 0.9, 4); c.fill(); c.fillStyle = '#ffe6a0'; rr(c, fx + 3, fy + 3, ww * 0.16 - 6, u * 0.9 - 6, 3); c.fill(); }
    });
    // guirlande de fanions
    const coulsF = COUL.concat(['#ffffff']);
    c.strokeStyle = '#6b3d1e'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(0, h * 0.16); c.quadraticCurveTo(w / 2, h * 0.26, w, h * 0.16); c.stroke();
    for (let i = 0; i < 14; i++) {
      const p = (i + 0.5) / 14, x = p * w, y = h * 0.16 + (1 - Math.pow(2 * p - 1, 2)) * h * 0.05;
      c.fillStyle = coulsF[i % coulsF.length]; c.beginPath(); c.moveTo(x - u * 0.22, y); c.lineTo(x + u * 0.22, y); c.lineTo(x, y + u * 0.45); c.closePath(); c.fill();
    }
    // auvent rayé de la pizzeria
    const avY = h * 0.34, avH = u * 0.9;
    for (let i = 0; i < 12; i++) { c.fillStyle = i % 2 ? '#fff8ec' : '#d9412b'; c.fillRect(ox + i * sw / 12, avY, sw / 12 + 1, avH); }
    for (let i = 0; i < 12; i++) { c.fillStyle = i % 2 ? '#fff8ec' : '#d9412b'; c.beginPath(); c.arc(ox + (i + 0.5) * sw / 12, avY + avH, sw / 24, 0, Math.PI); c.fill(); }
    // four à bois (à gauche)
    dessinerFour(c, ox + sw * 0.02, avY + avH + u * 0.2, sw * 0.36, u * 2.7, prog.options.four, 900, null, false);
    // les cinq chefs derrière le comptoir
    const cY = avY + avH + u * 3.3;
    for (let s = 0; s < PLACES; s++) {
      const x = ox + sw * (0.42 + s * 0.125), y = cY - u * 1.0 - (s % 2) * u * 0.2;
      chef(c, s, x, y, u * 0.62, s === 0 ? prog.options.tablier : 'uni');
    }
    // comptoir en bois
    c.fillStyle = '#9a5a2b'; c.fillRect(0, cY - u * 0.4, w, u * 0.5);
    c.fillStyle = '#7a4320'; c.fillRect(0, cY + u * 0.1, w, h);
    c.fillStyle = 'rgba(255,255,255,.1)'; for (let x = 0; x < w; x += u * 1.2) c.fillRect(x, cY + u * 0.1, 3, h);
    // une pizza toute chaude sur le comptoir, devant le four
    dessinerPizza(c, ox + sw * 0.2, cY - u * 0.15, u * 0.7, ['pa', 'to', 'fr', 'ba', 'ol'], t);
    // tapis roulant chargé
    const tY = cY + u * 0.55, tH = u * 0.95;
    c.fillStyle = '#4b5059'; rr(c, -10, tY, w + 20, tH, 10); c.fill();
    c.fillStyle = '#5d636d'; c.fillRect(-10, tY + 4, w + 20, tH - 12);
    c.fillStyle = '#2f333a'; for (let x = 6; x < w; x += u * 0.5) { rond(c, x, tY + tH - 4, 3); c.fill(); }
    const lot = ['to', 'fr', 'ch', 'pa', 'ol', 'po', 'ja', 'ba', 'an', 'pi', 'tr', 'ma'];
    const nIt = Math.ceil(w / (u * 1.05));
    for (let i = 0; i < nIt; i++) dessinerIngr(c, lot[i % lot.length], u * 0.55 + i * u * 1.05, tY + tH * 0.45, u * 0.36, t);
    // grande pizza fumante au premier plan
    const pY = tY + tH + u * 1.6;
    dessinerPizza(c, w / 2, pY, u * 1.35, ['pa', 'to', 'fr', 'ch', 'ol', 'ba', 'po'], t);
    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 3; c.lineCap = 'round';
    [-0.5, 0, 0.5].forEach((d) => { c.beginPath(); c.moveTo(w / 2 + d * u, pY - u * 1.5); c.bezierCurveTo(w / 2 + d * u - u * 0.25, pY - u * 1.9, w / 2 + d * u + u * 0.25, pY - u * 2.1, w / 2 + d * u, pY - u * 2.5); c.stroke(); });
    // étoiles de concours
    c.fillStyle = '#ffd23a';
    [[0.12, 0.62], [0.88, 0.6], [0.2, 0.82], [0.82, 0.84]].forEach((p) => etincelle(c, ox + sw * p[0], h * p[1], u * 0.22));
  }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (parcours de 20 niveaux) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // partie solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)
  let geo = null;
  let anim = nouvelleAnim();
  let curseur = null;         // sélection au clavier : { t: 'p', i } ou { t: 'v', k }
  let selection = null;       // ingrédient touché, en attente d'un choix de destination
  let dernierAttends = 0;

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'atelier', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom !== 'jeu') { dessinerTitre(); fermerChoix(); }
    if (nom === 'titre') majTitre();
    if (nom === 'jeu') relancerBoucle();
  }

  function toast(texteToast, duree) {
    const el = $('toast');
    el.textContent = texteToast;
    el.classList.toggle('haut', salonOuvert() || $('voile-fin').classList.contains('actif') || ecran === 'jeu');
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(t) {
    $('bandeau-texte').textContent = t || '';
    $('bandeau').classList.toggle('actif', !!t);
  }

  const moiSiege = () => (partie && partie.siege >= 0 ? partie.siege : -1);

  // Cartes des 5 places, en haut de l'écran.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'tete'; cv.width = 96; cv.height = 96;
      const pts = document.createElement('span'); pts.className = 'pts';
      const tag = document.createElement('span'); tag.className = 'tag';
      const bes = document.createElement('canvas'); bes.className = 'besoins'; bes.width = 136; bes.height = 38; bes.setAttribute('aria-hidden', 'true');
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 26, 36, 24);
      d.append(cv, pts, tag, bes, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 104; cv.height = 104;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  // Pseudo d'un autre vrai joueur à une place (null : toi, un robot, ou pas de profil).
  function pseudoDe(s, sieges) {
    const info = (sieges || siegesActuels())[s] || {};
    return info.humain && !info.moi && info.nom ? info.nom : null;
  }
  // Nom d'un chef dans les messages : le pseudo d'un vrai joueur, sinon « Chef Tomate »…
  function nomChef(s, sieges) { return pseudoDe(s, sieges) || tr('chef.' + s); }

  // Ingrédients qui manquent à chaque chef (petites images sur sa carte).
  function dessinerBesoins(cv, e, s) {
    const c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    if (!e) return;
    const o = e.j[s].o, manque = o.ing.filter((_, i) => !o.ok[i]);
    let x = 10;
    if (o.e && !o.pim) { flamme(c, x, 19, 15, 0); x += 22; }
    if (o.p > 0) { horloge(c, x + 2, 19, 11, o.p / (o.ing.length + 2)); x += 26; }
    manque.slice(0, 6).forEach((code) => { if (x < cv.width - 8) dessinerIngr(c, code, x + 4, 19, 14, 0); x += 27; });
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const pts = e ? e.sc[s] : 0;
      d.querySelector('.pts').textContent = nb(pts);
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      const tete = d.querySelector('canvas.tete'), cle = (info.moi ? prog.options.tablier : 'uni');
      if (tete.dataset.t !== cle) { tete.dataset.t = cle; const c = tete.getContext('2d'); c.clearRect(0, 0, 96, 96); medaillon(c, s, 48, 48, 46, cle); }
      dessinerBesoins(d.querySelector('canvas.besoins'), e, s);
      d.setAttribute('aria-label', tr('place.aria.' + role, { chef: tr('chef.' + s), points: pts }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) return tr('tour.toi');
    return tr('tour.autre', { chef: nomChef(s) });
  }

  function majInfos() {
    let info = '';
    const e = vue;
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if (e && partie && partie.phase === 'jeu') info += ' · ' + tr('jeu.tours', { n: Math.ceil(e.reste / PLACES) });
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  function majInterface() {
    majPlaces();
    majInfos();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle() {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    dessinerJeu(performance.now());
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  // Ce que le joueur peut réserver maintenant (ingrédients rares de « Bientôt »).
  function reservables() {
    if (!vue || !partie || !partie.monTour()) return [];
    return O.actions(vue, partie.siege).filter((a) => a.t === 'v').map((a) => a.k);
  }

  function dessinerJeu(t) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    const monTour = !!(partie && partie.monTour());
    geo = rendu(c, w, h, vue, moiSiege(), {
      t: t, anim: anim, skin: prog.options.four, sel: selection, curseur: monTour ? curseur : null, reservable: reservables()
    });
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    anim = nouvelleAnim();
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    fermerChoix();
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 104, 104);
        medaillon(c, s, 52, 58, 42, info.moi ? prog.options.tablier : 'uni');
        if (info.chef) couronne(c, 52, 22, 24);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { chef: tr('chef.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) {
        const pseudo = pseudoDe(partie.chef, sieges);
        message = tr('salon.attente', { chef: pseudo ? pseudo + ' · ' + tr('chef.' + partie.chef) : tr('chef.' + partie.chef) });
      }
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const estChef = enSalon && partie.estChef();
    bouton.hidden = !estChef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    anim = nouvelleAnim();
    debutTour = Date.now();
    dernierTic = -1;
    curseur = null;
    fermerChoix();
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  // Un coup vient d'être joué (par n'importe qui) : animation, sons, messages.
  function surAction(ev) {
    const t = performance.now();
    const avant = ev.avant, apres = ev.apres, s = ev.siege, moi = moiSiege();
    vue = JSON.parse(JSON.stringify(apres));
    animerCoup(anim, geo, avant, apres, s, ev.action, moi, t);
    debutTour = Date.now();
    dernierTic = -1;
    if (ev.action.t === 'p') sons.prend(); else sons.reserve();
    setTimeout(() => { if (ecran === 'jeu') sons.tapis(); }, 260);
    const carte = (q) => { const d = $('place-' + q); if (d) { d.classList.remove('bond'); void d.offsetWidth; d.classList.add('bond'); } };
    const posCarte = (q) => (geo ? [geo.w * (q + 0.5) / PLACES, 18] : [0, 0]);
    (apres.ev || []).forEach((x) => {
      if (x.t === 'prend' && x.s === moi && x.d === 'c') setTimeout(() => sons.pose(), 380);
      else if (x.t === 'epice') { sons.piment(); if (x.s === moi) toast(tr('evt.epice')); }
      else if (x.t === 'gache') {
        sons.gache();
        if (x.s === moi) { anim.secousse = t + 300; toast(tr('evt.gache'), 3000); }
        else if (geo) anim.textes.push({ txt: '🌶', x: posCarte(x.s)[0], y: 30, t0: t + 300, coul: COUL[x.s] });
      } else if (x.t === 'finie') {
        setTimeout(() => sons.finie(), 420);
        if (x.s === moi) {
          if (geo && geo.zCmd) jaillir(anim, geo.zCmd.pizza.x, geo.zCmd.pizza.y, COUL[x.s], 18, geo.sz * 0.2);
          toast(apres.k.four ? tr('evt.finieFour', { n: x.v }) : tr('evt.finie', { n: x.v }));
        }
        if (!apres.k.four && geo) { anim.textes.push({ txt: '+' + nb(x.v), x: posCarte(x.s)[0], y: 24, t0: t + 400, coul: COUL_F[x.s] }); carte(x.s); }
      } else if (x.t === 'attend') { if (x.s === moi) toast(tr('evt.attend'), 3000); }
      else if (x.t === 'servie' && x.four) {
        setTimeout(() => sons.ding(), 300);
        if (geo && geo.four) anim.textes.push({ txt: '+' + nb(x.v), x: geo.four.x + geo.four.w * 0.36, y: geo.four.y + geo.four.h * 0.5, t0: t + 200, coul: COUL_F[x.s] });
        carte(x.s);
        if (x.s === moi) toast(tr('evt.servie', { n: x.v }));
      } else if (x.t === 'retard') { if (x.s === moi) toast(tr('evt.retard'), 3000); }
      else if (x.t === 'geante') {
        sons.geante();
        x.qui.forEach((q) => carte(q));
        const noms = x.qui.map((q) => (q === moi ? tr('evt.toi') : nomChef(q))).join(' + ');
        toast(tr('evt.geante', { qui: noms, n: x.v }), 3400);
        if (geo && geo.geante) jaillir(anim, geo.geante.x + geo.geante.w / 2, geo.geante.y + geo.geante.h / 2, '#e09a00', 24, geo.sz * 0.2);
      } else if (x.t === 'nouvelleGeante') { toast(tr('evt.nouvelleGeante'), 2800); }
      else if (x.t === 'livre') { if (x.s === moi) { toast(tr('evt.livre')); sons.reserve(); } }
      else if (x.t === 'reserve') { if (x.s !== moi && geo) anim.textes.push({ txt: '★', x: posCarte(x.s)[0], y: 30, t0: t, coul: COUL[x.s] }); }
      else if (x.t === 'tombe') { setTimeout(() => sons.tombe(), 420); }
      else if (x.t === 'perdues') { toast(tr('evt.perdues'), 3000); }
    });
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && R.aQui(vue) === partie.siege && !ev.moi) sons.tour();
    if (selection) fermerChoix();
    if (curseur) curseur = curseurValide(curseur) ? curseur : premierCurseur();
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    fermerChoix();
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 900);
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = moi >= 0 && e.sc[moi] > 0 && e.sc[moi] === Math.max.apply(null, e.sc);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  // Étoiles : finir premier (1), avec au moins 30 % des points de la table (2), 40 % (3).
  function etoilesPour(pts, total, gagne) {
    if (!gagne) return 0;
    const p = total ? pts / total : 0;
    return p >= 0.4 ? 3 : p >= 0.3 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3, 4];
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      if (e.sc[s] !== prec) { rang = k + 1; prec = e.sc[s]; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64; medaillon(cv.getContext('2d'), s, 32, 32, 30, s === moi ? prog.options.tablier : 'uni');
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const pseudo = role === 'joueur' ? pseudoDe(s, sieges) : null;
      const nom = document.createElement('span'); nom.textContent = (pseudo ? pseudo + ' · ' : '') + tr('chef.' + s) + ' · ' + tr('fin.pizzas', { n: e.j[s].pz });
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.pointsCourt', { n: e.sc[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  // Déblocages de l'atelier entre deux totaux d'étoiles.
  function deblocages(avant, apres) {
    const l = [];
    TABLIERS.forEach((x) => { if (x.e > avant && x.e <= apres) l.push(tr('debloque.tablier', { nom: tr('tablier.' + x.id) })); });
    FOURS.forEach((x) => { if (x.e > avant && x.e <= apres) l.push(tr('debloque.four', { nom: tr('four.' + x.id) })); });
    return l;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.sc[moi] : 0;
    const total = e.sc.reduce((a, b) => a + b, 0);
    const gagne = moi >= 0 && pts > 0 && pts === Math.max.apply(null, e.sc);
    const egalite = gagne && e.sc.filter((x) => x === pts).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.points', { n: pts, pct: total ? Math.round(pts / total * 100) : 0 }) : '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(pts, total, gagne);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      const avantEt = totalEtoiles();
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else if (record) sauver(niveau, pts);
      const nouveaux = deblocages(avantEt, totalEtoiles());
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      const lignes = [];
      if (gagne && niveau === NIVEAUX.length) lignes.push(tr('fin.dernier'));
      else if (debloque) lignes.push(tr('fin.debloque', { n: niveau + 1 }));
      else if (!gagne) lignes.push(tr('fin.conseil'));
      $('fin-debloque').textContent = lignes.concat(nouveaux).join(' ');
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (partie en ligne repassée sur l'appareil).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const t = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== t) $('fin-compte').textContent = t; }
    else if ($('bandeau').classList.contains('actif')) bandeau(t);
  }

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % PLACES], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux
  // ---------------------------------------------------------------------

  let attenteTuto = false;

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    curseur = null;
    bandeau('');
    fermerChoix();
    fermerVoile('voile-pause');
    fermerVoile('voile-fin');
    fermerVoile('voile-tuto');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  // Aperçu d'un niveau avant que l'arbitre le prépare (même graine : rien d'important).
  function apercu(n) {
    return R.depart(graineHasard(n * 101), PLACES, { niveau: n });
  }

  // Parcours solo : niveau n contre 4 robots.
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    fermerChoix();
    vue = apercu(niveau);
    anim = nouvelleAnim();
    curseur = null;
    afficherEcran('jeu');
    const d = NIVEAUX[niveau - 1];
    const nouvelles = d.rec.filter((r) => prog.recettes.indexOf(r) < 0 && (d.rare || !O.RECETTES[r].some(O.estRare)));
    const suite = () => {
      if (nouvelles.length) {
        attenteTuto = true;
        montrerRecettes(nouvelles, () => { nouvelles.forEach((r) => { if (prog.recettes.indexOf(r) < 0) prog.recettes.push(r); }); attenteTuto = false; lancerNiveau(); });
      } else lancerNiveau();
    };
    if (d.tuto && prog.tutos.indexOf(d.tuto) < 0) {
      attenteTuto = true;
      montrerTuto(d.tuto, () => { if (prog.tutos.indexOf(d.tuto) < 0) prog.tutos.push(d.tuto); attenteTuto = false; suite(); });
    } else suite();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const grille = $('grille-niveaux');
    grille.textContent = '';
    NIVEAUX.forEach((_, i) => {
      const n = i + 1, ouvert = n <= prog.debloque;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
      b.append(num, et);
      b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
      else b.disabled = true;
      grille.appendChild(b);
    });
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
  }

  // Atelier : choisir son tablier et son four parmi ceux débloqués.
  function ouvrirAtelier() {
    const total = totalEtoiles();
    const remplir = (boite, liste, type) => {
      boite.textContent = '';
      liste.forEach((x) => {
        const ouvert = x.e <= total, pris = prog.options[type] === x.id;
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'choix-objet' + (pris ? ' pris' : '') + (ouvert ? '' : ' ferme');
        const cv = document.createElement('canvas'); cv.width = 144; cv.height = 144;
        const c = cv.getContext('2d');
        if (type === 'tablier') { c.fillStyle = '#fff3df'; rond(c, 72, 72, 70); c.fill(); chef(c, 0, 72, 80, 62, x.id); }
        else dessinerFour(c, 6, 14, 132, 124, x.id, 900, null, true);
        const nom = document.createElement('span'); nom.textContent = tr(type + '.' + x.id);
        b.append(cv, nom);
        if (!ouvert) { const p = document.createElement('span'); p.className = 'prix'; p.textContent = '🔒 ' + tr('atelier.prix', { n: x.e }); b.appendChild(p); }
        b.setAttribute('aria-pressed', pris ? 'true' : 'false');
        b.addEventListener('click', () => {
          audio();
          if (!ouvert) { sons.non(); toast(tr('atelier.ferme', { n: x.e })); return; }
          sons.clic();
          prog.options[type] = x.id;
          sauverOptions();
          ouvrirAtelier();
        });
        boite.appendChild(b);
      });
    };
    remplir($('grille-tabliers'), TABLIERS, 'tablier');
    remplir($('grille-fours'), FOURS, 'four');
    const connues = Object.keys(O.RECETTES).filter((r) => prog.recettes.indexOf(r) >= 0).map((r) => tr('recette.' + r));
    $('atelier-recettes').textContent = connues.length ? tr('atelier.recettesConnues', { n: connues.length, total: Object.keys(O.RECETTES).length }) + ' ' + connues.join(', ') : tr('atelier.aucuneRecette');
    $('atelier-total').textContent = tr('etoiles.total', { n: total, max: NIVEAUX.length * 3 });
    if (ecran !== 'atelier') afficherEcran('atelier');
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    fermerChoix();
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';

  function fermerPause() {
    if (!enPause) return;
