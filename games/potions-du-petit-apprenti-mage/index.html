// --------------------------------------------------------------------------
// Partie
// --------------------------------------------------------------------------
const niv = () => NIVEAUX[etat.niveau];
const recette = () => niv().recettes[etat.recette];
const mult = () => (niv().double ? 2 : 1);

function lancerNiveau(i) {
  annulerChat(); viderMinuteurs(); fermerPause(true);
  etat.niveau = i; etat.recette = 0; etat.enPartie = true; etat.verrou = false;
  etat.coeurs = 3; etat.fiolesUtilisees = 0; etat.renversements = 0; etat.chatsChasses = 0; etat.points = [];
  const n = niv();
  const scene = $('#scene-jeu');
  construireScene(scene, { salle: n.salle, dore: !!n.double });
  $('#info-niveau').textContent = tr('jeu.niveau', { n: nb(i + 1), max: nb(NIVEAUX.length) });
  $('#info-salle').textContent = tr('salle.' + SALLES[n.salle]);
  construireEtagere();
  const badges = [];
  if (n.double) badges.push(tr('badge.double'));
  if (n.marge > 0) badges.push(tr('badge.marge', { n: n.marge }));
  if (n.fioles.some((x) => x.n !== null)) badges.push(tr('badge.limite'));
  if (n.chat) badges.push(tr('badge.chat'));
  $('#badges').innerHTML = badges.map((b) => `<span class="badge">${b}</span>`).join('');
  $('#badges').hidden = !badges.length;
  montrer('ecran-jeu');
  commencerRecette();
  majCoeurs();
  // Tutoriel animé de la nouveauté du niveau, la première fois.
  if (n.nouv && !prog.tutos.includes(n.nouv)) {
    prog.tutos.push(n.nouv); ecrireProg();
    requestAnimationFrame(() => montrerTuto(n.nouv));
  }
}

function construireEtagere() {
  const n = niv();
  const et = $('#etagere');
  et.innerHTML = '';
  // 2 à 4 fioles : une rangée ; 5 ou 6 : deux rangées de 3 ; 7 ou 8 : deux rangées de 4.
  const nf = n.fioles.length;
  et.style.gridTemplateColumns = `repeat(${nf <= 4 ? nf : nf <= 6 ? 3 : 4}, 1fr)`;
  n.fioles.forEach((fi, j) => {
    const cas = document.createElement('div');
    cas.className = 'fiole-case';
    cas.dataset.j = j;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'fiole ing-' + fi.i;
    const val = fi.v > 0 ? tr('fiole.plus', { n: nb(fi.v) }) : tr('fiole.moins', { n: nb(-fi.v) });
    b.innerHTML = `<span class="touche" aria-hidden="true">${nb(j + 1)}</span><span class="dessin">${svgFiole(fi.i, fi.v)}</span>
      <span class="valeur" style="color:${ING[fi.i].clair}">${val}</span><span class="usages" hidden></span><span class="remplacer">${tr('fiole.remplacer')}</span>`;
    b.addEventListener('click', () => verser(j));
    cas.appendChild(b);
    et.appendChild(cas);
  });
}

function commencerRecette() {
  const r = recette();
  etat.compte = {};
  Object.keys(r.cibles).forEach((k) => { etat.compte[k] = 0; });
  etat.usages = niv().fioles.map((x) => x.n);
  etat.renversees.clear();
  etat.versesRecette = 0; etat.renversementsRecette = 0;
  annulerChat();
  etat.chatFait = false; etat.declencheur = 1 + Math.floor(Math.random() * 2);
  // Couleur du liquide : celle du premier ingrédient de la recette.
  $('#scene-jeu').style.setProperty('--liquide', ING[Object.keys(r.cibles)[0]].clair);
  construireJauges();
  majTout();
}

function construireJauges() {
  const n = niv(), r = recette();
  const box = $('#scene-jeu .jauges');
  box.innerHTML = '';
  Object.keys(r.cibles).forEach((k) => {
    const max = r.cibles[k] + margeDe(n, k);
    const j = document.createElement('div');
    j.className = 'jauge'; j.dataset.k = k;
    j.innerHTML = `<div class="jauge-rempli" style="background:${ING[k].clair};height:0"></div>
      <div class="jauge-cible" style="bottom:${(r.cibles[k] / max) * 100}%"></div><div class="jauge-bord"></div>`;
    box.appendChild(j);
  });
}

function majTout() { majCarte(); majFioles(); majJauges(); majCompteur(); }

function majCarte() {
  const n = niv(), r = recette();
  $('#recette-num').textContent = tr('jeu.recette', { n: etat.recette + 1, max: n.recettes.length });
  $('#pastilles').innerHTML = n.recettes.map((x, j) => `<span class="pastille ${j < etat.recette ? 'faite' : j === etat.recette ? 'encours' : ''}"></span>`).join('');
  const box = $('#cibles');
  const anciens = {};
  $$('.cible', box).forEach((c) => { anciens[c.dataset.k] = c.dataset.c; });
  box.innerHTML = '';
  const ings = Object.keys(r.cibles);
  ings.forEach((k) => {
    const c = document.createElement('div');
    c.className = 'cible' + (etat.compte[k] === r.cibles[k] ? ' juste' : '');
    c.dataset.k = k; c.dataset.c = etat.compte[k];
    const resolue = etat.verrou && etat.compte[k] === r.cibles[k];
    const cible = r.enigmes[k] && !resolue ? `<span class="enigme">${texteEnigme(r.enigmes[k])}</span>` : nb(r.cibles[k]);
    const pop = anciens[k] !== undefined && String(anciens[k]) !== String(etat.compte[k]) ? ' class="pop"' : '';
    c.innerHTML = `<span class="ico">${svgGoutte(k)}</span><span class="txt"><span class="nom">${tr(ings.length > 2 ? ING[k].court : ING[k].cle)}</span>
      <span class="val"><b${pop}>${nb(etat.compte[k])}</b> ${tr('cible.sur', { n: cible })}</span></span>`;
    c.setAttribute('aria-label', tr('cible.aria', { ing: tr(ING[k].cle), c: etat.compte[k], n: r.enigmes[k] && !resolue ? texteEnigme(r.enigmes[k]) : r.cibles[k] }));
    box.appendChild(c);
  });
}

function majFioles() {
  const n = niv(), r = recette();
  $$('#etagere .fiole-case').forEach((cas) => {
    const j = Number(cas.dataset.j), fi = n.fioles[j], b = cas.querySelector('.fiole');
    const u = etat.usages[j];
    const us = b.querySelector('.usages');
    us.hidden = u === null;
    if (u !== null) us.textContent = tr('fiole.usages', { n: nb(u) });
    const inutile = r.cibles[fi.i] === undefined;
    b.classList.toggle('vide', u === 0 || inutile);
    cas.classList.toggle('renversee', etat.renversees.has(j));
    const val = fi.v > 0 ? tr('fiole.plus', { n: nb(fi.v) }) : tr('fiole.moins', { n: nb(-fi.v) });
    b.setAttribute('aria-label', etat.renversees.has(j) ? tr('fiole.aria.renversee') : tr('fiole.aria', { v: val, ing: tr(ING[fi.i].cle) }) + (u !== null ? ' — ' + tr('fiole.usages.aria', { n: u }) : ''));
  });
}

function majJauges() {
  const n = niv(), r = recette();
  $$('#scene-jeu .jauge').forEach((j) => {
    const k = j.dataset.k, max = r.cibles[k] + margeDe(n, k);
    j.querySelector('.jauge-rempli').style.height = `calc(${Math.min(100, (etat.compte[k] / max) * 100)}% - 4px)`;
    if (!etat.compte[k]) j.querySelector('.jauge-rempli').style.height = '0';
  });
}

function majCompteur() {
  $('#compteur-fioles').innerHTML = tr('jeu.fioles', { n: `<b>${nb(etat.fiolesUtilisees)}</b>` });
}
function majCoeurs() {
  $('#coeurs').innerHTML = [0, 1, 2].map((k) => ICONES.coeur(k >= etat.coeurs)).join('');
  $('#coeurs').setAttribute('aria-label', tr('jeu.coeurs', { n: etat.coeurs }));
}

let minuteMessage = null;
function message(texte, mauvais) {
  const m = $('#message');
  m.textContent = texte;
  m.classList.toggle('mauvais', !!mauvais);
  m.classList.add('voir');
  clearTimeout(minuteMessage);
  minuteMessage = setTimeout(() => m.classList.remove('voir'), 1300);
}

// Gouttes qui tombent dans le chaudron (ou en ressortent).
function animerGouttes(k, delta) {
  const scene = $('#scene-jeu'), c = centreChaudron(scene);
  const n = Math.min(10, Math.max(2, Math.abs(delta)));
  const zone = scene.querySelector('.effets');
  for (let q = 0; q < n; q++) {
    const g = document.createElement('div');
    g.className = 'goutte-vol';
    g.style.background = ING[k].clair;
    g.style.left = (c.x + hasard(-c.l / 4, c.l / 4)) + 'px';
    g.style.top = (c.y - 4) + 'px';
    g.style.animation = `${delta > 0 ? 'tombe' : 'aspire'} .5s ease-in ${q * 0.04}s both`;
    zone.appendChild(g);
    g.addEventListener('animationend', () => g.remove());
  }
}

function secouer(el, cl) { el.classList.remove(cl); void el.offsetWidth; el.classList.add(cl); setTimeout(() => el.classList.remove(cl), 550); }

function verser(j) {
  if (!etat.enPartie || etat.pause || etat.verrou || tutoActif || etat.ecran !== 'ecran-jeu') return;
  const n = niv(), r = recette(), fi = n.fioles[j];
  const cas = $(`#etagere .fiole-case[data-j="${j}"]`), b = cas.querySelector('.fiole');
  if (etat.renversees.has(j)) { remplacer(j); return; }
  if (r.cibles[fi.i] === undefined) { secouer(b, 'non'); SON.bonk(); message(tr('msg.pasIci'), true); return; }
  if (etat.usages[j] === 0) { secouer(b, 'non'); SON.bonk(); message(tr('msg.videFiole'), true); return; }
  const delta = fi.v * mult();
  const nouveau = etat.compte[fi.i] + delta;
  if (nouveau < 0) { secouer(b, 'non'); SON.bonk(); message(tr('msg.zero'), true); return; }
  etat.fiolesUtilisees++; etat.versesRecette++;
  if (etat.usages[j] !== null) etat.usages[j]--;
  etat.compte[fi.i] = nouveau;
  b.classList.add('verse'); setTimeout(() => b.classList.remove('verse'), 280);
  animerGouttes(fi.i, delta);
  if (delta > 0) SON.goutte(delta); else SON.retrait();
  if (n.double) { SON.double(); }
  majTout();
  if (nouveau > r.cibles[fi.i] + margeDe(n, fi.i)) { debordement(); return; }
  if (!verifierRecette() && n.chat && !etat.chatFait && !etat.chat && etat.versesRecette >= etat.declencheur && !etat.chatDans) etat.chatDans = 700;
}

function remplacer(j) {
  etat.renversees.delete(j);
  etat.fiolesUtilisees++; etat.versesRecette++;
  SON.remplace();
  message(tr('msg.remplacee'));
  majTout();
}

function vider() {
  if (!etat.enPartie || etat.pause || etat.verrou || tutoActif) return;
  if (Object.values(etat.compte).every((v) => v === 0) && !etat.renversees.size && etat.usages.every((u, j) => u === niv().fioles[j].n)) { SON.bonk(); return; }
  SON.vider();
  remettreRecette();
  secouer($('#scene-jeu .chaudron'), 'secoue');
  message(tr('msg.vide'));
}
// Chaudron vidé, fioles rendues (sans toucher au compteur de fioles).
function remettreRecette() {
  Object.keys(etat.compte).forEach((k) => { etat.compte[k] = 0; });
  etat.usages = niv().fioles.map((x) => x.n);
  etat.renversees.clear();
  majTout();
}

function debordement() {
  etat.verrou = true;
  annulerChat();
  etat.coeurs--;
  majCoeurs();
  SON.deborde();
  const scene = $('#scene-jeu');
  secouer(scene.querySelector('.chaudron'), 'secoue');
  const c = centreChaudron(scene);
  for (let k = 0; k < 16; k++) particule(scene, PARTS.bulle(scene.style.getPropertyValue('--liquide') || '#8cc8ff'), { x: c.x + hasard(-c.l / 2, c.l / 2), y: c.y, anim: 'chute', duree: 1.2, delai: k * 0.02, taille: hasard(12, 22), dx: hasard(-80, 80) });
  message(tr(etat.coeurs > 0 ? 'msg.deborde' : 'msg.debordeFin'), true);
  plusTard(1100, () => {
    if (etat.coeurs <= 0) { defaite(); return; }
    remettreRecette();
    etat.verrou = false;
  });
}

function verifierRecette() {
  const r = recette();
  const ok = Object.keys(r.cibles).every((k) => etat.compte[k] === r.cibles[k]);
  if (ok) reussirRecette();
  return ok;
}

function reussirRecette() {
  etat.verrou = true;
  annulerChat();
  const n = niv(), j = etat.recette;
  const surplus = Math.max(0, etat.versesRecette - n.opt[j] - etat.renversementsRecette);
  etat.points.push(100 - Math.min(70, 15 * surplus));
  majCarte();
  const scene = $('#scene-jeu');
  SON.reussite();
  message(surplus === 0 ? tr('msg.parfait') : tr('msg.reussie'));
  const chaud = scene.querySelector('.chaudron');
  chaud.classList.add('brille');
  petitEffet(scene, ING[Object.keys(recette().cibles)[0]].clair);
  scene.querySelector('.apprenti').classList.add('content');
  plusTard(1400, () => {
    chaud.classList.remove('brille');
    scene.querySelector('.apprenti').classList.remove('content');
    if (j < n.recettes.length - 1) {
      etat.recette++;
      commencerRecette();
      etat.verrou = false;
    } else victoire();
  });
}

// --------------------------------------------------------------------------
// Chat malicieux
// --------------------------------------------------------------------------
function lancerChat() {
  const n = niv(), r = recette(), m = mult();
  if (etat.chat || etat.chatFait) return;
  const candidats = n.fioles.map((x, j) => j).filter((j) => {
    const fi = n.fioles[j];
    if (fi.v <= 0 || etat.usages[j] === 0 || etat.renversees.has(j) || r.cibles[fi.i] === undefined) return false;
    return etat.compte[fi.i] + fi.v * m <= r.cibles[fi.i] + margeDe(n, fi.i);
  });
  etat.chatFait = true;
  if (!candidats.length) return;
  const j = choix(candidats);
  const duree = etat.niveau >= 18 ? 2200 : 2600;
  etat.chat = { j, t: 0, duree };
  const cas = $(`#etagere .fiole-case[data-j="${j}"]`);
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chat-farceur';
  b.setAttribute('aria-label', tr('chat.aria'));
  b.style.setProperty('--duree', duree / 1000 + 's');
  b.innerHTML = `<span class="anneau"></span>${svgChatFarceur()}`;
  b.addEventListener('click', (e) => { e.stopPropagation(); chasserChat(); });
  cas.appendChild(b);
  const perche = $('#scene-jeu .chat-perche'); if (perche) perche.classList.add('parti');
  SON.miaou();
  message(tr('msg.chat'));
}
function chasserChat() {
  if (!etat.chat || etat.pause || tutoActif) return;
  const el = $('#etagere .chat-farceur');
  etat.chat = null;
  etat.chatsChasses++;
  SON.pschitt();
  message(tr('msg.chasse'));
  if (el) { el.classList.add('fuit'); setTimeout(() => el.remove(), 520); }
  setTimeout(() => { const p = $('#scene-jeu .chat-perche'); if (p) p.classList.remove('parti'); }, 700);
}
function chatRenverse() {
  const n = niv(), r = recette(), j = etat.chat.j, fi = n.fioles[j];
  etat.chat = null;
  const el = $('#etagere .chat-farceur');
  if (el) { el.classList.add('saute'); setTimeout(() => el.remove(), 480); }
  setTimeout(() => { const p = $('#scene-jeu .chat-perche'); if (p) p.classList.remove('parti'); }, 700);
  const delta = fi.v * mult();
  if (etat.compte[fi.i] + delta > r.cibles[fi.i] + margeDe(n, fi.i)) return; // jamais de quoi déborder
  if (etat.usages[j] !== null) etat.usages[j]--;
  etat.compte[fi.i] += delta;
  etat.renversees.add(j);
  etat.renversements++; etat.renversementsRecette++;
  SON.miaou(); SON.goutte(delta);
  animerGouttes(fi.i, delta);
  message(tr('msg.renverse', { n: delta }), true);
  majTout();
  verifierRecette();
}
function annulerChat() {
  etat.chat = null; etat.chatDans = 0;
  $$('#etagere .chat-farceur').forEach((e) => e.remove());
  const p = $('#scene-jeu .chat-perche'); if (p) p.classList.remove('parti');
}

// --------------------------------------------------------------------------
// Fins de niveau
// --------------------------------------------------------------------------
function calculEtoiles() {
  const n = niv();
  const optTot = n.opt.reduce((a, b) => a + b, 0);
  const extra = etat.fiolesUtilisees - optTot - etat.renversements;
  let e = extra <= n.tol ? 3 : extra <= n.tol + 4 ? 2 : 1;
  if (3 - etat.coeurs >= 2) e = Math.min(e, 2);
  return { e, optTot };
}

function victoire() {
  const i = etat.niveau;
  etat.enPartie = false; etat.verrou = true;
  const { e, optTot } = calculEtoiles();
  const score = etat.points.reduce((a, b) => a + b, 0) + 50 * etat.coeurs + 30 * etat.chatsChasses;
  const ancienRecord = prog.records[i];
  const avant = totalEtoiles();
  const premiereFois = prog.etoiles[i] === 0;
  prog.etoiles[i] = Math.max(prog.etoiles[i], e);
  prog.records[i] = Math.max(prog.records[i], score);
  niveauMaxSauve = Math.max(niveauMaxSauve, Math.min(19, i + 1));
  const apres = totalEtoiles();
  const objets = [];
  SEUILS_CHAPEAUX.forEach((s, k) => { if (avant < s && apres >= s) objets.push(['chapeau', k]); });
  SEUILS_BAGUETTES.forEach((s, k) => { if (avant < s && apres >= s) objets.push(['baguette', k]); });
  ecrireProg();
  window.JEL_SAVE.save(JEU, donneesSauvegarde(i + 2));
  if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
  // Jeu terminé (dernière potion réussie, maintenant ou avant) : total des meilleures étoiles.
  if (prog.etoiles[NIVEAUX.length - 1] > 0) {
    if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
  }
  SON.victoire();
  const scene = $('#scene-jeu');
  scene.style.setProperty('--liquide', TEINTES_POTIONS[i]);
  effet(scene, EFFETS[i]);
  message(tr('msg.potionNiveau', { nom: tr('potion.' + (i + 1) + '.nom') }));
  plusTard(2300, () => afficherBilan({ gagne: true, e, score, ancienRecord, optTot, premiereFois, objets }));
}

function defaite() {
  const i = etat.niveau;
  etat.enPartie = false; etat.verrou = true;
  annulerChat();
  if (window.FMG) window.FMG.reportEnd({ completed: false, level: i + 1 });
  SON.defaite();
  const score = etat.points.reduce((a, b) => a + b, 0);
  afficherBilan({ gagne: false, e: 0, score, ancienRecord: prog.records[i] });
}

function boutonBilan(cle, principal, fn) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'btn' + (principal ? '' : ' sec');
  b.textContent = tr(cle);
  b.addEventListener('click', () => { SON.clic(); fn(); });
  return b;
}

function afficherBilan({ gagne, e, score, ancienRecord, optTot, premiereFois, objets = [] }) {
  const i = etat.niveau;
  const boite = $('#bilan-boite');
  const record = score > ancienRecord;
  boite.innerHTML = `
    <div class="bilan-flacon">${svgFlacon(gagne ? TEINTES_POTIONS[i] : '#6b6585', !gagne)}</div>
    <h2>${tr(gagne ? 'bilan.gagne' : 'bilan.perdu')}</h2>
    <p class="bilan-petit">${tr('jeu.niveau', { n: nb(i + 1), max: nb(NIVEAUX.length) })}</p>
    <div class="grandes-etoiles" id="bilan-etoiles" aria-label="${tr('bilan.etoilesAria', { n: e })}"></div>
    <p class="bilan-score">${tr('bilan.score')} <b id="bilan-points">${nb(0)}</b></p>
    <p class="${record && gagne ? 'bilan-record' : 'bilan-petit'}">${gagne && record ? tr('bilan.record') : tr('bilan.recordAncien', { n: nb(Math.max(ancienRecord, gagne ? score : 0)) })}</p>
    ${gagne ? `<p class="bilan-petit">${tr('bilan.mage', { n: optTot, m: etat.fiolesUtilisees })}</p>` : `<p class="bilan-petit">${tr('bilan.conseil')}</p>`}
    ${gagne ? `<p class="bilan-page">${tr(premiereFois ? 'bilan.grimoireNouveau' : 'bilan.grimoire', { nom: tr('potion.' + (i + 1) + '.nom') })}<br><small>${tr('potion.' + (i + 1) + '.effet')}</small></p>` : ''}
    <div class="bilan-objets" id="bilan-objets"></div>
    <div class="bilan-boutons" style="display:flex;flex-direction:column;gap:8px"></div>`;
  const ob = $('#bilan-objets', boite);
  objets.forEach(([type, k]) => {
    const d = document.createElement('div');
    d.className = 'objet';
    d.innerHTML = (type === 'chapeau' ? `<svg viewBox="22 -4 96 82" aria-hidden="true">${dessinChapeau(k)}</svg>` : `<svg viewBox="96 40 60 90" aria-hidden="true">${dessinBaguette(k)}</svg>`) + `<span>${tr('bilan.debloque', { nom: tr(type + '.' + k) })}</span>`;
    ob.appendChild(d);
  });
  ob.hidden = !objets.length;
  const bb = $('.bilan-boutons', boite);
  if (gagne) {
    if (i < NIVEAUX.length - 1) bb.appendChild(boutonBilan('bilan.suivant', true, () => lancerNiveau(i + 1)));
    else bb.appendChild(boutonBilan('bilan.final', true, afficherFinal));
    bb.appendChild(boutonBilan('bilan.rejouer', false, () => lancerNiveau(i)));
    bb.appendChild(boutonBilan('niveaux', false, ouvrirNiveaux));
  } else {
    bb.appendChild(boutonBilan('bilan.reessayer', true, () => lancerNiveau(i)));
    bb.appendChild(boutonBilan('niveaux', false, ouvrirNiveaux));
    bb.appendChild(boutonBilan('pause.accueil', false, allerTitre));
  }
  montrer('ecran-bilan');
  bb.firstChild.focus();
  // Étoiles une à une, puis score qui défile.
  const zone = $('#bilan-etoiles', boite);
  for (let k = 0; k < 3; k++) {
    setTimeout(() => {
      if (!zone.isConnected) return;
      zone.insertAdjacentHTML('beforeend', svgEtoile(k < e, 54));
      if (k < e) SON.etoile(k);
    }, 300 + k * 350);
  }
  const b = $('#bilan-points', boite), t0 = performance.now();
  const defile = (t) => {
    if (!b.isConnected) return;
    const p = Math.min(1, (t - t0) / 1100);
    b.textContent = nb(Math.round(score * p));
    if (p < 1) requestAnimationFrame(defile);
  };
  requestAnimationFrame(defile);
  if (objets.length) setTimeout(() => SON.debloque(), 1500);
}

function afficherFinal() {
  const boite = $('#final-boite');
  boite.innerHTML = `
    <div class="bilan-flacon">${svgFlacon(TEINTES_POTIONS[19])}</div>
    <h2>${tr('final.titre')}</h2>
    <p>${tr('final.texte')}</p>
    <div class="grandes-etoiles">${svgEtoile(true, 54)}</div>
    <p class="bilan-score">${tr('etoiles.total', { n: totalEtoiles(), max: nb(60) })}</p>
    <p class="bilan-score">${tr('bilan.score')} <b>${nb(scoreTotal())}</b></p>
    <p class="bilan-petit">${tr('grimoire.compte', { n: prog.etoiles.filter((x) => x > 0).length, max: nb(20) })}</p>
    <div class="bilan-boutons" style="display:flex;flex-direction:column;gap:8px"></div>`;
  const bb = $('.bilan-boutons', boite);
  bb.appendChild(boutonBilan('final.rejouer', true, () => lancerNiveau(0)));
  bb.appendChild(boutonBilan('niveaux', false, ouvrirNiveaux));
  bb.appendChild(boutonBilan('grimoire', false, ouvrirGrimoire));
  montrer('ecran-final');
  bb.firstChild.focus();
  SON.victoire();
}

// --------------------------------------------------------------------------
// Pause
// --------------------------------------------------------------------------
function ouvrirPause() {
  if (etat.ecran !== 'ecran-jeu' || etat.pause) return;
  if (tutoActif) fermerTuto();
  etat.pause = true;
  document.body.classList.add('en-pause');
  $('#pause').hidden = false;
  try { if (actx) actx.suspend(); } catch (e) { /* rien */ }
  $('#btn-reprendre').focus();
}
function fermerPause(silence) {
  if (!etat.pause) return;
  etat.pause = false;
  document.body.classList.remove('en-pause');
  $('#pause').hidden = true;
  try { if (actx && son) actx.resume(); } catch (e) { /* rien */ }
  if (!silence) SON.clic();
}

// --------------------------------------------------------------------------
// Tutoriel animé (main qui montre le geste, 3 étapes au plus)
// --------------------------------------------------------------------------
const fioleDe = (test) => () => { const n = niv(); const j = n.fioles.findIndex(test); return j >= 0 ? $(`#etagere .fiole-case[data-j="${j}"]`) : $('#etagere'); };
const TUTOS = {
  base: [{ c: () => $('#cibles'), k: 'tuto.base1' }, { c: fioleDe(() => true), k: 'tuto.base2' }, { c: () => $('#scene-jeu .jauges'), k: 'tuto.base3' }],
  cinq: [{ c: fioleDe((x) => x.v === 5), k: 'tuto.cinq' }],
  dix: [{ c: fioleDe((x) => x.v === 10), k: 'tuto.dix' }],
  moins: [{ c: fioleDe((x) => x.v < 0), k: 'tuto.moins1' }, { c: () => $('#scene-jeu .jauges'), k: 'tuto.moins2' }],
  moins2: [{ c: fioleDe((x) => x.v === -5), k: 'tuto.moins3' }],
  double: [{ c: () => $('#scene-jeu .chaudron'), k: 'tuto.double1' }, { c: fioleDe((x) => x.v === 5), k: 'tuto.double2' }],
  deux: [{ c: () => $('#cibles'), k: 'tuto.deux1' }, { c: fioleDe((x) => x.i === 's'), k: 'tuto.deux2' }],
  limite: [{ c: fioleDe((x) => x.n !== null), k: 'tuto.limite1' }, { c: () => $('#btn-vider'), k: 'tuto.limite2' }],
  enigme: [{ c: () => $('#cibles'), k: 'tuto.enigme' }],
  chat: [{ c: fioleDe(() => true), k: 'tuto.chat1', chat: true }, { c: fioleDe(() => true), k: 'tuto.chat2' }],
  grand: [{ c: fioleDe((x) => x.v === 20), k: 'tuto.grand1' }, { c: fioleDe((x) => x.v === -10), k: 'tuto.grand2' }],
  trois: [{ c: () => $('#cibles'), k: 'tuto.trois' }],
};
function montrerTuto(nom) {
  if (etat.ecran !== 'ecran-jeu' || etat.pause) return;
  const etapes = TUTOS[nom] || TUTOS.base;
  tutoActif = { etapes, i: 0 };
  $('#tuto').hidden = false;
  $('#tuto-main').innerHTML = ICONES.main;
  etapeTuto();
}
function etapeTuto() {
  const { etapes, i } = tutoActif;
  const et = etapes[i];
  const cible = et.c() || $('#etagere');
  const app = $('#app').getBoundingClientRect(), r = cible.getBoundingClientRect();
  const cadre = $('#tuto-cadre');
  cadre.style.left = (r.left - app.left - 4) + 'px'; cadre.style.top = (r.top - app.top - 4) + 'px';
  cadre.style.width = (r.width + 8) + 'px'; cadre.style.height = (r.height + 8) + 'px';
  const main = $('#tuto-main');
  main.style.left = (r.left - app.left + r.width / 2) + 'px';
  main.style.top = (r.top - app.top + r.height / 2) + 'px';
  $('#tuto-texte').textContent = tr(et.k);
  $('#tuto-suite').textContent = tr(i < etapes.length - 1 ? 'tuto.suite' : 'tuto.go', { n: i + 1, max: etapes.length });
  // La bulle se place loin de ce qu'elle montre.
  const bulle = $('#tuto-bulle');
  const enBas = (r.top - app.top) < app.height * 0.45;
  bulle.style.top = enBas ? 'auto' : '70px';
  bulle.style.bottom = enBas ? '76px' : 'auto';
  // Chat de démonstration.
  $$('.chat-demo').forEach((e) => e.remove());
  if (et.chat) {
    const d = document.createElement('div');
    d.className = 'chat-farceur chat-demo';
    d.innerHTML = svgChatFarceur();
    cible.appendChild(d);
  }
}
function suiteTuto() {
  if (!tutoActif) return;
  SON.clic();
  tutoActif.i++;
  if (tutoActif.i >= tutoActif.etapes.length) fermerTuto(); else etapeTuto();
}
function fermerTuto() {
  tutoActif = null;
  $('#tuto').hidden = true;
  $$('.chat-demo').forEach((e) => e.remove());
}

// --------------------------------------------------------------------------
// Commandes
// --------------------------------------------------------------------------
let boutonEffacer = null;
function init() {
  chargerProg();
  // Icônes des boutons.
  $('#btn-pause').innerHTML = ICONES.pause;
  $('#btn-aide').innerHTML = ICONES.aide;
  $$('.btn-retour').forEach((b) => { b.innerHTML = ICONES.retour; b.addEventListener('click', () => { SON.clic(); allerTitre(); }); });
  $('#btn-vider').innerHTML = ICONES.vider + `<span>${tr('vider')}</span>`;
  majBoutonsSon();

  // Première action : les sons deviennent possibles.
  const premiere = () => { premiereAction = true; };
  window.addEventListener('pointerdown', premiere, true);
  window.addEventListener('keydown', premiere, true);

  $('#btn-jouer').addEventListener('click', jouer);
  $('#btn-niveaux').addEventListener('click', ouvrirNiveaux);
  $('#btn-grimoire').addEventListener('click', ouvrirGrimoire);
  $('#btn-garde').addEventListener('click', ouvrirGarde);
  $$('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('#btn-pause').addEventListener('click', () => { SON.clic(); ouvrirPause(); });
  $('#btn-reprendre').addEventListener('click', () => fermerPause());
  $('#btn-recommencer').addEventListener('click', () => { fermerPause(); lancerNiveau(etat.niveau); });
  $('#btn-accueil').addEventListener('click', () => {
    if (etat.enPartie) window.JEL_SAVE.save(JEU, donneesSauvegarde(etat.niveau + 1));
    fermerPause(); allerTitre();
  });
  $('#btn-vider').addEventListener('click', vider);
  $('#btn-aide').addEventListener('click', () => { if (etat.verrou || etat.pause) return; SON.clic(); montrerTuto(niv().nouv || 'base'); });
  $('#tuto').addEventListener('click', (e) => { if (e.target.closest('#tuto-passer')) { SON.clic(); fermerTuto(); return; } suiteTuto(); });

  // Effacer la sauvegarde depuis l'écran titre.
  boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('#effacer-titre'), apres: () => { effacerProg(); allerTitre(); } });

  // Clavier.
  document.addEventListener('keydown', (e) => {
    const code = e.code;
    if (etat.ecran === 'ecran-jeu') {
      if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); if (etat.pause) fermerPause(); else ouvrirPause(); return; }
      if (etat.pause) return;
      if (tutoActif) { if (code === 'Enter' || code === 'Space' || code === 'ArrowRight') { e.preventDefault(); suiteTuto(); } return; }
      const m = /^(?:Digit|Numpad)([1-9])$/.exec(code);
      if (m) { const j = Number(m[1]) - 1; if (j < niv().fioles.length) { e.preventDefault(); verser(j); } return; }
      if (code === 'Backspace' || code === 'KeyV' || code === 'Delete') { e.preventDefault(); vider(); return; }
      if (code === 'KeyC' && etat.chat) { e.preventDefault(); chasserChat(); return; }
      if (code === 'ArrowLeft' || code === 'ArrowRight') {
        const fs = $$('#etagere .fiole');
        const i = fs.indexOf(document.activeElement);
        const k = i < 0 ? 0 : (i + (code === 'ArrowRight' ? 1 : fs.length - 1)) % fs.length;
        e.preventDefault(); fs[k].focus();
      }
    } else if (etat.ecran === 'ecran-titre') {
      if ((code === 'Enter' || code === 'Space') && document.activeElement === document.body) { e.preventDefault(); jouer(); }
    } else if (code === 'Escape' && etat.ecran !== 'ecran-bilan' && etat.ecran !== 'ecran-final') {
      allerTitre();
    }
  });

  // Pause automatique quand l'écran est caché.
  document.addEventListener('visibilitychange', () => { if (document.hidden && etat.ecran === 'ecran-jeu' && etat.enPartie) ouvrirPause(); });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie.
  window.JEL_SAVE.surFermeture(() => { if (etat.enPartie) window.JEL_SAVE.save(JEU, donneesSauvegarde(etat.niveau + 1)); });

  allerTitre();  requestAnimationFrame(boucle);
}
init();
</script>
