<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }

        setTimeout(function () { changerSurPlace(c); }, 700);

        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);

      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }

    try {

  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +

    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +

    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +

    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },

  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';

    bouton.setAttribute('aria-expanded', 'false');

    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)

      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();

      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();

    });

    });
    bouton.addEventListener('keydown', function (e) {

      e.stopPropagation();

    document.addEventListener('pointerdown', function (e) {

      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {

          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];

    }

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>
:root{
  /* Plein écran, toujours en paysage : une scène 3D, des icônes flottantes, très peu de texte en jeu. */
  --mint:#BFE8D9; --berry:#F2545B; --sun:#FFC83D; --teal:#1B6B72; --cream:#FFF8EA; --plum:#4A2C4F; --gris:#E4D6DA;
  --police:ui-rounded,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--mint);overflow:hidden;touch-action:none;font-family:var(--police);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--mint)}
canvas#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

/* ── Icônes du jeu ── */
#hud{position:absolute;inset:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;gap:12px}
.ic{position:relative;pointer-events:auto;width:54px;height:54px;flex:none;border-radius:50%;border:0;background:var(--cream);color:var(--plum);
  display:grid;place-items:center;box-shadow:0 4px 0 rgba(74,44,79,.28);cursor:pointer;padding:0}
.ic:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,44,79,.28)}
.ic:focus-visible,.bt:focus-visible,.niv:focus-visible{outline:4px solid var(--teal);outline-offset:3px}
.ic svg{width:30px;height:30px}
.ic.off .wave{display:none}
.ic.dot::after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--berry);border:3px solid var(--cream)}
#gauche{display:flex;gap:10px;pointer-events:none}
#side{margin-left:auto;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.pill{display:flex;gap:8px;align-items:center;background:rgba(255,248,234,.94);padding:7px 14px;border-radius:30px;margin-top:3px;box-shadow:0 4px 0 rgba(74,44,79,.18)}
#mid{position:absolute;left:0;right:0;top:12px;display:flex;justify-content:center;align-items:flex-start;gap:8px;pointer-events:none}
.etoile{clip-path:polygon(50% 0%,62% 34%,98% 36%,69% 58%,80% 93%,50% 72%,20% 93%,31% 58%,2% 36%,38% 34%);background:var(--gris);display:block;flex:none}
.etoile.on{background:var(--sun)}
#coins .coin{width:28px;height:28px;border-radius:50%;background:var(--sun);border:5px solid #E09A12;display:block}
#coins b,#lvn{font:800 21px/1 var(--police);color:var(--plum);font-variant-numeric:tabular-nums}
#coins.bump .coin,#lvl.bump .big{animation:pop .5s ease-out}
#lvl .big{width:44px;height:44px;background:var(--sun);display:grid;place-items:center;padding-top:3px}
#lvn{font-size:18px}
#jour,#dots{display:flex;gap:3px}
#jour i,#dots i{width:16px;height:16px;border-radius:50%;background:var(--gris);display:block;transition:background .3s,transform .3s}
#jour i.on,#dots i.on{background:var(--berry)}
#dots i{width:18px;height:18px;margin:4px 1px}
#dots i.cur{background:var(--sun);transform:scale(1.35)}
/* Étoiles du niveau : elles se gagnent en cuisinant vite ; la barre montre le temps qu'il reste avant d'en perdre une. */
#chrono{flex-direction:column;gap:3px;padding:6px 12px}
#chrono .trois{display:flex;gap:4px}
#chrono .etoile{width:24px;height:24px;transition:background .4s}
#chrono .etoile.tombe{animation:tombe .7s ease-in}
#chrono .barre{width:100%;height:5px;border-radius:3px;background:var(--gris);overflow:hidden}
#chrono .barre b{display:block;height:100%;width:100%;background:var(--berry);transform-origin:0 50%}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.7)}100%{transform:scale(1)}}
@keyframes tombe{0%{transform:none}30%{transform:scale(1.4) rotate(-12deg)}100%{transform:translateY(14px) scale(.6) rotate(40deg)}}
#hint{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;pointer-events:none;opacity:0;
  background:rgba(255,255,255,.5);border:5px solid var(--plum);box-shadow:0 0 0 9px rgba(255,255,255,.3);will-change:transform,opacity}
#fade{position:absolute;inset:0;background:var(--mint);opacity:0;pointer-events:none}
#annonce{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);flex-direction:column;gap:2px;padding:8px 22px;text-align:center;pointer-events:none;max-width:86%}
#annonce b{font:800 20px/1.15 var(--police);color:var(--plum)}
#annonce span{font:700 16px/1.2 var(--police);color:var(--teal)}

/* ── Écrans : titre, niveaux, pause, fin de niveau ── */
.ecran{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px;gap:8px;z-index:5;color:var(--plum)}
.voile{background:rgba(74,44,79,.42)}
.carte{background:var(--cream);border-radius:26px;padding:12px 20px;max-width:min(94%,660px);max-height:100%;overflow:auto;text-align:center;
  box-shadow:0 8px 0 rgba(74,44,79,.25);display:flex;flex-direction:column;align-items:center;gap:8px}
.ecran h1,.ecran h2{margin:0;font:800 26px/1.1 var(--police)}
.ecran p{margin:0;font:600 16px/1.3 var(--police)}
.rang{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.bt{pointer-events:auto;min-height:48px;padding:9px 22px;border-radius:26px;border:0;background:var(--cream);color:var(--plum);cursor:pointer;
  font:800 18px/1.15 var(--police);box-shadow:0 5px 0 rgba(74,44,79,.28)}
.bt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(74,44,79,.28)}
.bt.pri{background:var(--berry);color:#fff;box-shadow:0 5px 0 #B93640}
.bt.gros{min-height:58px;font-size:25px;padding:11px 40px}
.carte .bt:not(.pri){background:#F3E7D3}
#titre{justify-content:space-between;padding:10px 12px 14px}
#titre h1{font-size:clamp(28px,9vmin,58px);color:var(--berry);letter-spacing:.5px;text-shadow:0 2px 0 #fff,0 5px 0 rgba(74,44,79,.16)}
#titre .haut{display:flex;flex-direction:column;align-items:center;width:100%}
#titre .mot{background:rgba(255,248,234,.95);border-radius:24px;padding:8px 22px 10px;max-width:min(100% - 150px,660px);box-shadow:0 5px 0 rgba(74,44,79,.18);text-align:center;display:flex;flex-direction:column;gap:4px}
#titre .mot p{font-size:clamp(13px,3.6vmin,18px)}
#titre .mot .clavier{font-weight:500;font-size:clamp(12px,3vmin,15px);opacity:.85}
#titre .coin{position:absolute;top:10px;display:flex;gap:10px;align-items:center}
#titre .coin.g{left:12px}
#titre .coin.d{right:12px}
#niveaux .carte{max-width:min(98%,920px);width:100%;padding:8px 12px 12px}
#niveaux .tete{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px}
#niveaux .total{display:flex;align-items:center;gap:6px;font:800 18px/1 var(--police)}
#niveaux .total .etoile{width:24px;height:24px}
.grille{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;width:100%}
.niv{position:relative;min-height:56px;aspect-ratio:1/1.05;border-radius:14px;border:0;background:#F3E7D3;padding:0;cursor:pointer;overflow:hidden;
  box-shadow:0 3px 0 rgba(74,44,79,.22);font:800 14px/1 var(--police);color:var(--plum)}
.niv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.niv .num{position:absolute;left:3px;top:3px;min-width:20px;height:20px;border-radius:10px;background:var(--cream);display:grid;place-items:center;padding:0 4px}
.niv .et{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:center;gap:1px}
.niv .et .etoile{width:15px;height:15px;background:rgba(74,44,79,.25)}
.niv .et .etoile.on{background:var(--sun)}
.niv.ferme{cursor:default;box-shadow:none;background:#E9DFE2}
.niv.ferme img{filter:grayscale(1);opacity:.28}
.niv.ferme .cadenas{position:absolute;inset:0;display:grid;place-items:center;color:var(--plum);opacity:.7}
.niv.ferme .cadenas svg{width:42%;height:42%}
.niv.ici{outline:4px solid var(--berry);outline-offset:-4px}
#fin .gagne{display:flex;gap:8px;justify-content:center}
#fin .gagne .etoile{width:58px;height:58px;transform:scale(0)}
#fin .gagne .etoile.on{animation:arrive .5s cubic-bezier(.3,1.6,.5,1) forwards}
#fin .gagne .etoile.vide{transform:scale(1)}
#fin .ligne{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;font:700 17px/1.2 var(--police)}
#fin .sou{display:inline-flex;gap:6px;align-items:center}
#fin .sou i{width:22px;height:22px;border-radius:50%;background:var(--sun);border:4px solid #E09A12;display:block}
@keyframes arrive{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
#pause .reglages{display:flex;gap:12px;align-items:center;justify-content:center}
@media (max-width:640px),(max-height:300px){
  .pill{padding:5px 10px;gap:6px}
  #lvl .big{width:38px;height:38px}
  #chrono .etoile{width:20px;height:20px}
}
@media (max-height:300px){
  .ecran h2{font-size:22px}
  .carte{padding:8px 16px;gap:6px}
  #fin .gagne .etoile{width:46px;height:46px}
  .niv{min-height:50px}
}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--mint);transition:opacity .5s}
#load span{width:70px;height:70px;border-radius:50%;border:10px solid var(--cream);border-top-color:var(--berry);animation:spin 1s linear infinite}
#load.gone{opacity:0;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#err{position:fixed;inset:0;margin:0;display:grid;place-items:center;padding:24px;text-align:center;background:var(--mint);
  color:var(--plum);font:600 20px/1.4 var(--police)}
/* Affiche du jeu (jaquette) : la scène seule, sans aucune interface. */
.affiche #hud,.affiche #mid,.affiche #hint,.affiche .ecran,.affiche #annonce,.affiche .jel-langue{display:none!important}
@media (prefers-reduced-motion:reduce){#load span{animation-duration:3s}#lvl.bump .big,#coins.bump .coin,#chrono .etoile.tombe{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" data-i18n-aria="aria.scene"></canvas>

  <!-- Icônes pendant la partie -->
  <div id="hud" hidden>
    <div id="gauche">
      <button id="bpause" class="ic" type="button" data-i18n-aria="aria.pause">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4.5" width="4.6" height="15" rx="1.6"/><rect x="13.9" y="4.5" width="4.6" height="15" rx="1.6"/></svg>
      </button>
      <button id="home" class="ic" type="button" data-i18n-aria="aria.cuisine" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M6 10v9h12v-9"/></svg>
      </button>
    </div>
    <div id="side">
      <button id="snd" class="ic son" type="button" data-i18n-aria="aria.son">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path class="wave" d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path class="wave" d="M18 6.5a8 8 0 0 1 0 11"/></svg>
      </button>
      <button id="bsalle" class="ic" type="button" data-i18n-aria="aria.salle" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18"/><path d="M6 11v8M18 11v8"/><path d="M8 7.5a4 2.2 0 0 1 8 0z" fill="currentColor"/></svg>
      </button>
      <button id="bdehors" class="ic" type="button" data-i18n-aria="aria.dehors" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5.5" fill="currentColor"/><path d="M12 14v7M7 21h10"/></svg>
      </button>
    </div>
  </div>
  <div id="mid" hidden>
    <div id="dots" class="pill" aria-hidden="true" hidden></div>
    <div id="lvl" class="pill" role="img"><span class="big etoile on"><b id="lvn"></b></span><span id="jour"></span></div>
    <div id="coins" class="pill" role="img"><span class="coin"></span><b id="cn"></b></div>
    <div id="chrono" class="pill" role="img" hidden><span class="trois"><i class="etoile on"></i><i class="etoile on"></i><i class="etoile on"></i></span><span class="barre"><b></b></span></div>
  </div>
  <div id="hint" aria-hidden="true"></div>
  <div id="annonce" class="pill" hidden><b id="annonce-niveau"></b><span id="annonce-plat"></span></div>
  <div id="fade" aria-hidden="true"></div>

  <!-- Écran titre -->
  <section id="titre" class="ecran" hidden>
    <div class="coin g" id="pc-langue"></div>
    <div class="coin d">
      <button class="ic son" type="button" data-i18n-aria="aria.son">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path class="wave" d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path class="wave" d="M18 6.5a8 8 0 0 1 0 11"/></svg>
      </button>
    </div>
    <div class="haut">

// ── Écran : le jeu est toujours en paysage ; en portrait, la scène est tournée d'un quart de tour ──
let W = 1, H = 1, ROT = false;
function resize() {
  const iw = window.innerWidth, ih = window.innerHeight; ROT = !AFFICHE && ih > iw * 1.05; W = ROT ? ih : iw; H = ROT ? iw : ih;
  stage.style.width = W + 'px'; stage.style.height = H + 'px'; stage.style.transform = ROT ? `translateX(${H}px) rotate(90deg)` : 'none';
  renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix();
}
function localPoint(e) { return ROT ? { x: e.clientY, y: H - e.clientX } : { x: e.clientX, y: e.clientY }; }

// ── Fluidité : si l'appareil peine, le rendu s'allège tout seul (netteté, puis ombres, puis taille de l'image) ──
let allege = 0, mesure = 0, lent = 0;
function surveillerFluidite(dt) {
  if (AFFICHE || APERCU || allege >= 3 || dt > 0.5) return;        // jamais pour l'affiche ni les images du jeu ; un trou = onglet caché
  mesure += dt; if (dt > 0.045) lent += dt; if (mesure < 2) return;
  if (lent > mesure * 0.6) {
    allege++;
    if (allege === 1 && renderer.getPixelRatio() <= 1) allege = 2; // écran déjà en netteté simple : on passe aux ombres
    if (allege === 1) renderer.setPixelRatio(1); else if (allege === 2) sun.castShadow = false; else renderer.setPixelRatio(0.7);
    resize();
  }
  mesure = 0; lent = 0;
}

// ── Caméra et projection ──
const cam = { p: new V3(0, 6.4, 9.6), l: new V3(0, 2.5, -1.6) };
const tmp = new V3();
function setCam(v) { cam.p.set(...v.p); cam.l.set(...v.l); }
function flyTo(v, dur, done) { const p0 = cam.p.clone(), l0 = cam.l.clone(), p1 = new V3(...v.p), l1 = new V3(...v.l); tween(dur, k => { cam.p.lerpVectors(p0, p1, k); cam.l.lerpVectors(l0, l1, k); }, done); }
function jumpTo(v, done) { tween(0.22, k => { $fade.style.opacity = k; }, () => { setCam(v); tween(0.26, k => { $fade.style.opacity = 1 - k; }, done, linear); }, linear); }
/** Glisse si la destination est proche, fondu sinon. */
function goTo(v, dur, done) { if (Math.abs(v.l[0] - cam.l.x) > 26) jumpTo(v, done); else flyTo(v, dur, done); }
function applyCam() {
  const fit = AFFICHE ? 1 : clamp(1.6 / camera.aspect, 1, 1.7);   // écran étroit : la caméra recule pour tout montrer
  camera.position.copy(cam.p).sub(cam.l).multiplyScalar(fit).add(cam.l); camera.lookAt(cam.l);
  sun.target.position.copy(cam.l); sun.position.set(cam.l.x + 7, 17, cam.l.z + 9);
}
function toScreen(v) { tmp.copy(v).project(camera); return { x: (tmp.x * 0.5 + 0.5) * W, y: (-tmp.y * 0.5 + 0.5) * H }; }
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new V3(0, 1, 0), 0), hitP = new V3();
function pointerRay(px, py) { ndc.set(px / W * 2 - 1, -(py / H * 2 - 1)); ray.setFromCamera(ndc, camera); return ray.ray; }
function groundAt(px, py, y = 0) { plane.normal.set(0, 1, 0); plane.constant = -y; return pointerRay(px, py).intersectPlane(plane, hitP) ? hitP.clone() : null; }
function planeAt(px, py, pl) { return pointerRay(px, py).intersectPlane(pl, hitP) ? hitP.clone() : null; }
function near(p, world, f) { const s = toScreen(world); return Math.hypot(p.x - s.x, p.y - s.y) < f * Math.min(W, H) + 28; }
function dist2D(p, world) { const s = toScreen(world); return Math.hypot(p.x - s.x, p.y - s.y); }

/** Dore les parties « cuisables » d'un aliment : k de 0 (cru) à 1 (cuit). */
function bake(item, k) {
  item.traverse(o => { if (!o.isMesh || !o.userData.bake) return;
    if (!o.userData.c0) { o.material = o.material.clone(); o.material.userData.cached = false; o.userData.c0 = o.material.color.clone(); }
    o.material.color.copy(o.userData.c0).lerp(BROWN, clamp(k, 0, 1) * o.userData.bake); });
}
/** Point de la surface d'un aliment où poser une garniture, pour une position x,z donnée. */
function decoPoint(item, x, z, out) {
  const d = item.userData.deco || { y: 0.3, r: 1 };
  if (d.box) return out.set(clamp(x, -d.box[0], d.box[0]), d.y, clamp(z, -d.box[1], d.box[1]));
  let r = Math.hypot(x, z);
  if (d.ring) { if (r < 0.001) { x = d.ring; z = 0; r = d.ring; } const k = clamp(r, d.ring - d.w, d.ring + d.w) / r; return out.set(x * k, d.y, z * k); }
  if (r > d.r) { x *= d.r / r; z *= d.r / r; r = d.r; }
  return out.set(x, d.dome ? d.y + d.dome * Math.sqrt(Math.max(0, 1 - (r / d.r) * (r / d.r))) : d.y, z);
}
/** Met un modèle à l'échelle pour tenir dans un cube de côté « size », base au sol. */
function fitModel(obj, size) {

  const box = new THREE.Box3(); obj.traverse(o => { if (o.isMesh && o.visible) { o.geometry.computeBoundingBox(); box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld)); } });
  const h = new THREE.Group(); if (box.isEmpty()) { h.add(obj); return h; }
  const sz = box.getSize(new V3()), c = box.getCenter(new V3()), k = size / Math.max(sz.x, sz.y, sz.z, 0.001);
  obj.position.set(-c.x, -box.min.y, -c.z); h.add(obj); h.scale.setScalar(k); h.userData.k = k; return h;
}

    }, easeIn);
  });
  s.hint = () => (s.done || busy) ? null : { type: 'tap', a: new V3(cut.position.x + x, 0.9, cut.position.z) };

};

T.whisk = (x, prm, ctx) => {

  const bowl = new THREE.Mesh(new THREE.SphereGeometry(2.3, 30, 14, 0, PI * 2, PI / 2, PI / 2), new THREE.MeshLambertMaterial({ color: C.tealL, side: THREE.DoubleSide })); bowl.position.set(0, 2.55, Z); bowl.castShadow = true; g.add(bowl);

  let total = 0, prog = 0;

// ═════════════════════════ niveaux.js ═════════════════════════
// Les 20 niveaux : une journée au restaurant par recette.
// Le premier client commande le plat du jour (une recette nouvelle, avec ses outils), les suivants des plats déjà appris.
// Les étoiles récompensent la rapidité en cuisine : le temps passé aux postes est comparé au temps d'un geste bien fait.
/** Durée d'un poste joué sans hésiter, en secondes, animations comprises (mesurée avec le geste automatique du jeu). */
const DUREE_POSTE = {
  rail: 6, 'kettle:pop': 4, 'kettle:floss': 4, 'kettle:stir': 4, funnel: 7, launcher: 5, chop: 3.5, fryer: 5, sprinkle: 2.5, press: 4.5, pan: 4.5,
  stack: 3.5, blender: 4.5, 'tap:swirl': 4.5, 'tap:liquid': 4.5, pipe: 2, roll: 2, oven: 3.5, whisk: 3, stamp: 3.5,
};
/** Temps accordé pour une recette : chaque poste, plus un temps pour regarder le geste et s'y mettre. */
const tempsRecette = (rec, reflexion) => rec.steps.reduce((s, st) => s + (DUREE_POSTE[st.t + (st.mode ? ':' + st.mode : '')] || 4) + reflexion, 0);

const NIVEAUX = RECIPES.map((rec, i) => {
  const clients = i < 6 ? 2 : 3;                                   // deux clients par jour au début, trois ensuite
  const commandes = [i];                                           // le plat du jour d'abord
  if (i > 0) commandes.push(i - 1);                                // puis le plat de la veille
  if (clients > 2) commandes.push(Math.floor(((i * 0.618034) % 1) * (i - 1)));   // puis un plat plus ancien, jamais le même d'un jour à l'autre
  while (commandes.length < clients) commandes.push(i);            // premier jour : deux fois le même plat
  // De plus en plus exigeant : large au début (3 étoiles du premier coup), serré à la fin (il faut s'entraîner).
  const k = i / (RECIPES.length - 1), reflexion = lerp(4, 2.5, k), marge = lerp(2, 1.45, k);
  const t3 = commandes.reduce((s, c) => s + tempsRecette(RECIPES[c], reflexion), 0) * marge;
  return { recette: i, commandes, t3, t2: t3 * 1.5 };
});
/** Étoiles d'un niveau selon le temps passé aux postes : 3, 2, ou 1 (on ne perd jamais). */
const etoilesPour = (niv, temps) => temps <= niv.t3 ? 3 : temps <= niv.t2 ? 2 : 1;
window.JEL_NIVEAUX = NIVEAUX.length;

  poser(2, 1.3, 0.05, -0.7, 0.25);                                                                  // son burger, juste devant lui
  poser(0, 1.5, -1.55, 0.35, 0.35); poser(3, 1.6, 1.68, 0.3); poser(10, 0.95, -0.55, 0.85, 0.4); poser(15, 0.9, 0.62, 0.9, 0.5);   // pop-corn, glace, cupcake, donut
  // une lumière chaude derrière le héros, et du pop-corn qui vole autour de lui
  const c = cv(128, 128), g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 4, 64, 64, 64); gr.addColorStop(0, 'rgba(255,250,220,0.95)'); gr.addColorStop(0.45, 'rgba(255,236,170,0.45)'); gr.addColorStop(1, 'rgba(255,236,170,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex(c), depthWrite: false, fog: false })); halo.scale.set(11, 11, 1); halo.position.set(0, 3.5, -6); scene.add(halo);
  for (let i = 0; i < 22; i++) { const x = rnd(3.1), y = rnd(3.6, 6.4); if (Math.abs(x) < 1.35 && y < 5.0) continue; const p = popPiece(scene); p.position.set(x, y, rnd(-3.2, -0.9)); p.scale.setScalar(rnd(0.55, 0.95)); }
  setCam({ p: [0.5, 3.5, 6.1], l: [0, 2.78, -1.9] });
  let t = 0; const feu = () => burst(rnd(2.6), 5.1 + rnd(0.7), -2.2 + rnd(0.8), 12, 4);
  for (let i = 0; i < 5; i++) feu(); tween(1e9, () => { if (++t % 24 === 0) feu(); }, null, linear);

/** Images du jeu : la partie s'ouvre sur un vrai moment, puis se fige. 1 = premier niveau (la machine à pop-corn),
 *  2 = milieu du jeu (les clients au comptoir), 3 = dernier niveau (le gâteau d'anniversaire). Rien n'est sauvegardé. */
function ouvrirApercu(n) {
  const plan = { 1: { niveau: 1, poste: 1, joue: 1.5, pieces: 3 }, 2: { niveau: 9, cuisine: true, pieces: 37, objets: 5 }, 3: { niveau: 20, poste: 3, joue: 1.5, pieces: 112 } }[n];
  if (!plan) return false;
  game.mode = 'niveau'; const niv = NIVEAUX[plan.niveau - 1], rec = RECIPES[niv.recette];
  jour.n = plan.niveau; jour.file = []; jour.servis = plan.cuisine ? 1 : 0; jour.temps = niv.t3 * (plan.cuisine ? 0.3 : 0.12);
  prog.pieces = plan.pieces; prog.niveau = plan.niveau; for (let i = 0; i < plan.niveau - 1; i++) prog.et[i] = i % 4 === 2 ? 2 : 3;
  ITEMS.slice(0, plan.objets || 0).forEach(it => { it.owned = true; prog.objets.push(it.id); });
  PROPS.find(p => p.id === 'carte').g.visible = false; majJour(); majChrono(true); majPieces(); refreshMenu(); refreshShop();
  if (plan.cuisine) {                       // deux clients attendent, le premier montre sa commande
    niv.commandes.slice(1).forEach((c, s) => { const a = spawnClient(s, SLOTS[s][0], c); a.userData.state = 'wait'; }); avail.potager = true;
    setCam(VIEW_K); setState('arrive'); after(1.3, () => { enPause = true; });
  } else {                                  // un poste en pleine action : le jeu fait lui-même le geste, puis s'arrête
    order = { rec, idx: niv.recette, free: false, i: plan.poste, st: null, built: [], ctx: { item: null } }; order.ctx.next = () => {}; order.ctx.take = () => null;
    buildStation(plan.poste); setCam(order.st.view); setState('station');
    aide.auto = true; after(plan.joue, () => { aide.auto = false; aideAnnuler(); after(0.25, () => { enPause = true; }); });
  }
  return true;
}

// ───────────────────────── Démarrage ─────────────────────────
majSon(); majPieces(); refreshMenu(); refreshShop();
if (window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches) $('aide-clavier').hidden = false;
if (AFFICHE) dessinerAffiche();
else if (!(APERCU && ouvrirApercu(APERCU))) { spawnClient(0, -3); spawnClient(1, -7); spawnClient(2, -11); montrer('titre'); }
hud(); applyCam(); renderer.render(scene, camera);
document.getElementById('load').classList.add('gone');
// Accès pour les essais (mode test du lanceur : ?debug=1)
if (window.JEL_DEBUG || window.PC_ESSAI) window.PC = { game, jour, prog, dbg, aide, RECIPES, NIVEAUX, MENU, PROPS, K, ITEMS, LAUNCH, DOORS, toScreen, hint: hintSpec, front, order: () => order, ecran: () => ecran, place: () => place,
  horloge: () => time, niveau: lancerNiveau, libre: lancerLibre, titre: retourTitre, room: r => goRoom(r), pieces: n => addCoins(n), mini: id => startMini(id), menu: openMenu, cuisine: goHome,
  recette: i => { if (game.state === 'waitOrder' || game.state === 'arrive') startOrder(i, true); } };
requestAnimationFrame(frame);

})();
