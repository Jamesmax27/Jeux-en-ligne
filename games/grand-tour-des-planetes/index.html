<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +

    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },

    selecteurs.forEach(function (s) { s.maj(); });

  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).

    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);

    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }

        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {

      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

    try { texte = JSON.stringify(tout); } catch (e) { return false; }

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }

  }

  function texte(cle, vars) {

  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

  @keyframes tap{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-10px)}}
  .scene .fileante{animation:file 3s linear infinite}
  @keyframes file{from{transform:translateX(0)}to{transform:translateX(200px)}}
  #bilan-etoiles{font-size:50px;letter-spacing:6px;min-height:62px}
  #bilan-etoiles span{display:inline-block;color:#ffffff30;transition:color .2s}
  #bilan-etoiles span.gagnee{color:#ffd76a;animation:etoile .5s;text-shadow:0 0 18px #ffd76a}
  @keyframes etoile{0%{transform:scale(.2) rotate(-90deg)}70%{transform:scale(1.35)}}
  #bilan-score{font-size:34px;font-weight:900;margin:4px 0}
  #bilan-details{font-size:15px;line-height:1.45;opacity:.95;margin-bottom:12px}
  #bilan-record{font-weight:800;color:#9fe7ff;min-height:22px;margin-bottom:10px}
  #bilan-record.nouveau{color:#ffd76a;animation:pop .6s 2}
  #album-grille{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0 14px;text-align:left}
  .fiche{background:#ffffff10;border-radius:12px;padding:8px;display:flex;gap:8px;align-items:center;font-size:12px;line-height:1.25;min-height:64px}
  .fiche b{display:block;font-size:14px}
  .fiche.vide{opacity:.4;justify-content:center;font-size:24px}

  /* ---------- Effets ---------- */
  .etincelle{position:fixed;z-index:45;pointer-events:none;width:8px;height:8px;border-radius:50%;
    transition:transform .7s ease-out,opacity .7s ease-in}
  .points{position:fixed;z-index:45;pointer-events:none;font-weight:900;font-size:20px;color:#ffd76a;
    text-shadow:0 2px 0 #0008;transform:translate(-50%,-50%);animation:monte 1s ease-out forwards}
  @keyframes monte{to{transform:translate(-50%,-260%);opacity:0}}
  #confettis{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:35}
  @media (prefers-reduced-motion:reduce){
    .scene .bouge,.scene .main,#soleil{animation-duration:6s}
    .secoue,.place.secoue{animation:none}
  }
  @media (min-height:760px){ .piece{width:76px;min-height:80px} #info{font-size:16px} }
  /* Petits téléphones : tout doit tenir sans défilement */
  @media (max-height:700px){
    #barre{min-height:50px;padding-top:3px}
    .piece{width:60px;min-height:62px} .piece .nom{font-size:12px}
    .piece.enigme{font-size:12px;min-height:38px;padding:3px 6px}
    #info{min-height:44px;font-size:14px;padding:4px 8px}
    #accueil{gap:6px} #deco{height:min(32vw,120px)}
  }
</style>
</head>
<body>
<div id="jeu">
  <!-- Écran d'accueil -->
  <section id="accueil">
    <div id="deco" aria-hidden="true"></div>
    <h1 data-i18n-html="titreHtml">Le grand tour<br>des planètes</h1>
    <p data-i18n="accroche">Remets les planètes dans l'ordre autour du Soleil et découvre un secret sur chacune !</p>
    <button class="gros" id="btn-jouer"></button>
    <div id="record"></div>
    <div id="niveaux" aria-label="Choisir un niveau" data-i18n-aria="choisirNiveau"></div>
    <div id="ligne-boutons"><button class="doux" id="btn-album" data-i18n="albumBtn">📖 Album</button></div>
  </section>

  <!-- Écran de jeu -->
  <section id="partie" class="cache">
    <div id="barre">
      <button class="rond" id="btn-menu" aria-label="Retour au menu" data-i18n-aria="retourMenu">☰</button>
      <div id="titre-niv"><b id="nom-niv"></b><span id="mission"></span></div>
      <div id="score" aria-live="polite">0</div>
      <button class="rond" id="btn-aide" aria-label="Revoir l'explication" data-i18n-aria="revoir">?</button>
    </div>
    <div id="chrono" class="cache" aria-hidden="true"><span class="fin">🏁</span><div id="comete-chrono"></div></div>
    <div id="plateau">
      <div id="dessin"></div>
      <div id="soleil"><span data-i18n="soleil">Soleil</span></div>
      <button id="boite" class="cache" aria-label="Boîte à intrus" data-i18n-aria="boite" data-i18n-html="boiteHtml"><span class="icone">🗑️</span>Boîte à<br>intrus</button>
    </div>
    <div id="info" aria-live="polite"></div>
    <div id="reserve"></div>
  </section>
</div>

<div id="coin-langue"></div>
<button id="btn-son">🔊</button>

<!-- Tutoriel animé -->
<div id="intro" class="voile cache" role="dialog" aria-modal="true">
  <div class="carte-voile">
    <h2 id="intro-titre"></h2>
    <div class="scene" id="intro-scene"></div>
    <ol class="etapes" id="intro-etapes"></ol>
    <div class="boutons"><button class="gros" id="btn-compris" data-i18n="compris">Compris !</button></div>
  </div>
</div>

<!-- Bilan de fin de niveau / fin de partie -->
<div id="bilan" class="voile cache" role="dialog" aria-modal="true">
  <div class="carte-voile">
    <h2 id="bilan-titre"></h2>
    <div id="bilan-etoiles"><span>★</span><span>★</span><span>★</span></div>
    <div id="bilan-score">0</div>
    <div id="bilan-record"></div>
    <div id="bilan-details"></div>
    <div class="boutons">
      <button class="gros" id="btn-suivant" data-i18n="suivant">Niveau suivant</button>
      <button class="doux" id="btn-rejouer" data-i18n="rejouer">Rejouer</button>
      <button class="doux" id="btn-bilan-menu" data-i18n="menu">Menu</button>
    </div>
  </div>
</div>

<!-- Album des astres découverts -->
<div id="album" class="voile cache" role="dialog" aria-modal="true">
  <div class="carte-voile">
    <h2 data-i18n="albumTitre">Mon album de l'espace</h2>
    <div id="album-compte"></div>
    <div id="album-grille"></div>
    <button class="gros" id="btn-album-fermer" data-i18n="fermer">Fermer</button>
  </div>
</div>

<canvas id="confettis"></canvas>

<script>
'use strict';
// =====================================================================
// Le grand tour des planètes — ranger les planètes, chasser les intrus,
// deviner et découvrir une info sur chaque astre.
// =====================================================================

// ---------- Données des astres ----------
// px = taille de dessin (respecte l'ordre réel des tailles)
// Textes de chaque astre dans les traductions astre.<id>.* : nom, phrase (en début de phrase),
// milieu (dans une phrase), e1 = devinette des cartes énigmes, e2 = devinette du quiz, info, taille.
const PLANETES = [
  { id: 'mercure', px: 28 }, { id: 'venus', px: 38 }, { id: 'terre', px: 40 }, { id: 'mars', px: 32 },
  { id: 'jupiter', px: 56 }, { id: 'saturne', px: 49 }, { id: 'uranus', px: 45 }, { id: 'neptune', px: 43 },
];
const INTRUS = [{ id: 'lune', px: 26 }, { id: 'pluton', px: 22 }, { id: 'comete', px: 24 }, { id: 'asteroide', px: 26 }];
const ASTRES = {};
function textesAstre(a) {
  for (const k of ['nom', 'phrase', 'milieu', 'e1', 'e2', 'info', 'taille']) {
    if (window.JEL_I18N.has('astre.' + a.id + '.' + k)) a[k] = t('astre.' + a.id + '.' + k);
  }
}
PLANETES.forEach((p, i) => { p.rang = i + 1; textesAstre(p); ASTRES[p.id] = p; });
INTRUS.forEach((p) => { p.intrus = true; textesAstre(p); ASTRES[p.id] = p; });
const ORDRE_TAILLE = ['mercure', 'mars', 'venus', 'terre', 'neptune', 'uranus', 'saturne', 'jupiter'];
const MEMO = t('memo');   // phrase pour retenir l'ordre des planètes (propre à chaque langue)

// ---------- Les 12 niveaux ----------
// mode : 'distance' (depuis le Soleil) ou 'taille' ; ombres : silhouettes dans les places ;
// quiz : nombre de questions « Qui suis-je ? » ; intrus : nombre d'intrus ;
// enigmes : nombre de planètes cachées derrière une devinette ; chrono : secondes de la comète.
const NIVEAUX = [
  { mode: 'distance', planetes: 3, ombres: true, nouveau: 'base' },
  { mode: 'distance', planetes: 4, ombres: true },
  { mode: 'distance', planetes: 5, nouveau: 'sansOmbres' },
  { mode: 'distance', planetes: 6, quiz: 2, nouveau: 'quiz' },
  { mode: 'distance', planetes: 8, quiz: 2 },
  { mode: 'distance', planetes: 6, intrus: 1, nouveau: 'intrus' },
  { mode: 'distance', planetes: 8, intrus: 2, quiz: 2 },
  { mode: 'taille', liste: ['mercure', 'mars', 'terre', 'neptune', 'saturne', 'jupiter'], nouveau: 'taille' },
  { mode: 'taille', planetes: 8, quiz: 2 },
  { mode: 'distance', planetes: 5, enigmes: 5, nouveau: 'enigmes' },
  { mode: 'distance', planetes: 8, enigmes: 4, intrus: 1, chrono: 100, nouveau: 'chrono' },
  { mode: 'distance', planetes: 8, enigmes: 8, intrus: 2, quiz: 3, chrono: 120 },
];

// ---------- Sauvegarde (toujours protégée : le cadre peut refuser le stockage) ----------
const CLE = 'jel-grand-tour-planetes-v1';
const sauve = { etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 0, son: true, vus: {}, album: {} };
try {
  const o = JSON.parse(localStorage.getItem(CLE) || 'null');
  if (o && typeof o === 'object') {
    if (Array.isArray(o.etoiles)) o.etoiles.slice(0, NIVEAUX.length).forEach((v, i) => { sauve.etoiles[i] = Math.min(3, Math.max(0, v | 0)); });
    if (Array.isArray(o.records)) o.records.slice(0, NIVEAUX.length).forEach((v, i) => { sauve.records[i] = Math.max(0, v | 0); });
    sauve.debloque = Math.min(NIVEAUX.length - 1, Math.max(0, o.debloque | 0));
    sauve.son = o.son !== false;
    if (o.vus && typeof o.vus === 'object') sauve.vus = o.vus;
    if (o.album && typeof o.album === 'object') sauve.album = o.album;
  }
} catch (e) { /* pas de stockage : on joue sans sauvegarde */ }
function enregistrer() {
  try { localStorage.setItem(CLE, JSON.stringify(sauve)); } catch (e) { /* ignoré */ }
}

// ---------- Sons (Web Audio, créés seulement après une action du joueur) ----------
let ctxAudio = null;
function audio() {
  if (!sauve.son) return null;
  try {
    if (!ctxAudio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctxAudio = new AC();
    }
    if (ctxAudio.state === 'suspended') ctxAudio.resume();
  } catch (e) { return null; }
  return ctxAudio;
}
function note(c, freq, debut, duree, type, vol, freqFin) {
  const t = c.currentTime + debut;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (freqFin) o.frequency.exponentialRampToValueAtTime(freqFin, t + duree);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + duree + 0.05);
}
const SONS = {
  prendre: (c) => note(c, 700, 0, 0.09, 'triangle', 0.12),
  bon: (c) => [523, 659, 784, 1047].forEach((f, i) => note(c, f, i * 0.06, 0.18, 'triangle', 0.13)),
  erreur: (c) => { note(c, 220, 0, 0.22, 'sine', 0.18, 160); note(c, 180, 0.12, 0.25, 'sine', 0.14, 130); },
  intrus: (c) => note(c, 900, 0, 0.35, 'sine', 0.13, 180),
  quiz: (c) => [784, 988, 1319].forEach((f, i) => note(c, f, i * 0.08, 0.2, 'sine', 0.13)),
  tic: (c) => note(c, 1200, 0, 0.05, 'square', 0.05),
  comete: (c) => note(c, 300, 0, 0.6, 'sawtooth', 0.06, 90),
  fanfare: (c) => [523, 659, 784, 659, 784, 1047].forEach((f, i) => note(c, f, i * 0.11, 0.24, 'triangle', 0.14)),
  etoile: (c) => note(c, 1319, 0, 0.25, 'sine', 0.13, 1760),
  clic: (c) => note(c, 500, 0, 0.06, 'sine', 0.08),
};
function son(nom) {
  const c = audio();
  if (!c) return;
  try { SONS[nom](c); } catch (e) { /* ignoré */ }
}

// ---------- Raccourcis ----------
const $ = (id) => document.getElementById(id);
const melanger = (t) => { for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; } return t; };
function astre(id, d) {
  const el = document.createElement('div');
  el.className = 'astre ' + id;
  el.style.width = el.style.height = d + 'px';
  el.style.setProperty('--d', d + 'px');
  return el;
}
function montrer(id, oui) { $(id).classList.toggle('cache', !oui); }

// ---------- Bouton du son ----------
function majSon() {
  $('btn-son').textContent = sauve.son ? '🔊' : '🔇';
  $('btn-son').setAttribute('aria-label', t(sauve.son ? 'sonCouper' : 'sonRemettre'));
}
$('btn-son').addEventListener('click', () => {
  sauve.son = !sauve.son;
  if (!sauve.son && ctxAudio) { try { ctxAudio.suspend(); } catch (e) { /* ignoré */ } }
  enregistrer(); majSon(); son('clic');
});

// =====================================================================
// Accueil
// =====================================================================
let idDeco = 0;
function dessinerDeco() {
  const deco = $('deco');
  deco.innerHTML = '<div class="soleil-deco"></div>';
  const w = deco.clientWidth || 280;
  const lent = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tours = ['mercure', 'terre', 'mars', 'jupiter', 'saturne'].map((id, i) => {
    const r = 40 + i * (w / 2 - 50) / 4;
    const orb = document.createElement('div');
    orb.className = 'orb';
    orb.style.width = orb.style.height = r * 2 + 'px';
    deco.appendChild(orb);
    const d = Math.round(ASTRES[id].px * 0.45 + 6);
    const a = astre(id, d);
    deco.appendChild(a);
    return { a, r, d, vitesse: (lent ? 0.15 : 1) / (1.2 + i * 0.8), angle: i * 1.7 };
  });
  // Les planètes tournent sur des orbites aplaties (vues de biais)
  cancelAnimationFrame(idDeco);
  let tAvant = performance.now();
  const anime = (t) => {
    const dt = Math.min(0.1, (t - tAvant) / 1000);
    tAvant = t;
    tours.forEach((o) => {
      o.angle += dt * o.vitesse;
      const x = Math.cos(o.angle) * o.r, y = Math.sin(o.angle) * o.r * 0.42;
      o.a.style.transform = `translate(${x - o.d / 2}px,${y - o.d / 2}px)`;
      o.a.style.zIndex = y > 0 ? 2 : 0;     // devant ou derrière le Soleil
    });
    if (!$('accueil').classList.contains('cache')) idDeco = requestAnimationFrame(anime);
  };
  idDeco = requestAnimationFrame(anime);
}
function afficherAccueil() {
  arreterBoucle();
  montrer('partie', false); montrer('accueil', true);
  montrer('bilan', false); montrer('intro', false); montrer('album', false);
  const total = sauve.etoiles.reduce((a, b) => a + b, 0);
  const points = sauve.records.reduce((a, b) => a + b, 0);
  $('record').textContent = points > 0 ? t('recordAccueil', { p: points, e: total, max: NIVEAUX.length * 3 }) : t('aDecouvrir', { n: NIVEAUX.length });
  $('btn-jouer').textContent = sauve.debloque > 0 ? t('jouerNiveau', { n: sauve.debloque + 1 }) : t('jouer');
  const grille = $('niveaux');
  grille.innerHTML = '';
  NIVEAUX.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'niv' + (i === sauve.debloque ? ' actuel' : '');
    b.disabled = i > sauve.debloque;
    b.innerHTML = `${i > sauve.debloque ? '🔒' : i + 1}<small>${'★'.repeat(sauve.etoiles[i])}</small>`;
    b.setAttribute('aria-label', t('nivAria', { niv: i + 1, n: sauve.etoiles[i] }));
    b.addEventListener('click', () => { son('clic'); demarrerNiveau(i); });
    grille.appendChild(b);
  });
  boutonEffacer.maj();
  dessinerDeco();
}

// ---------- Sauvegarde du site (JEL_SAVE) ----------
// « Jouer » propose de reprendre au niveau sauvegardé ; un niveau réussi
// enregistre le suivant ; quitter la page pendant un niveau le garde.
const JEU = 'grand-tour-des-planetes';
const boutonEffacer = JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('ligne-boutons') });
function jouer() {
  JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => demarrerNiveau(Math.max(1, Math.min(NIVEAUX.length, d.niveau)) - 1),
    onNouvelle: () => demarrerNiveau(sauve.debloque),
  });
}
JEL_SAVE.surFermeture(() => {
  if (etat && !$('partie').classList.contains('cache') && $('bilan').classList.contains('cache')) JEL_SAVE.save(JEU, { niveau: etat.n + 1 });
});
$('btn-jouer').addEventListener('click', () => { son('clic'); jouer(); });
$('btn-album').addEventListener('click', () => { son('clic'); ouvrirAlbum(); });

// ---------- Album ----------
function ouvrirAlbum() {
  const grille = $('album-grille');
  grille.innerHTML = '';
  let n = 0;
  [...PLANETES, ...INTRUS].forEach((a) => {
    const f = document.createElement('div');
    if (sauve.album[a.id]) {
      n++;
      f.className = 'fiche';
      f.appendChild(astre(a.id, 34));
      const t = document.createElement('div');
      t.innerHTML = `<b>${a.nom}</b>${a.info}`;
      f.appendChild(t);
    } else {
      f.className = 'fiche vide';
      f.textContent = '?';
    }
    grille.appendChild(f);
  });
  $('album-compte').textContent = t('albumCompte', { n, total: 12 });
  montrer('album', true);
  $('btn-album-fermer').focus();
}
$('btn-album-fermer').addEventListener('click', () => { son('clic'); montrer('album', false); });

// =====================================================================
// Partie
// =====================================================================
let etat = null;

function demarrerNiveau(n) {
  const cfg = NIVEAUX[n];
  const ids = cfg.liste || PLANETES.slice(0, cfg.planetes).map((p) => p.id);
  const ordre = cfg.mode === 'taille' ? ORDRE_TAILLE.filter((id) => ids.includes(id)) : ids.slice();
  // Planètes cachées derrière une devinette
  const cachees = new Set(melanger(ids.slice()).slice(0, cfg.enigmes || 0));
  const intrus = melanger(INTRUS.slice()).slice(0, cfg.intrus || 0).map((a) => a.id);
  let pieces = [...ids, ...intrus].map((id) => ({
    id, enigme: cachees.has(id) || (ASTRES[id].intrus && (cfg.enigmes || 0) > 0), place: false, rate: 0,
  }));
  // Mélange, sans laisser les planètes déjà dans le bon ordre
  do { melanger(pieces); } while (pieces.filter((p) => !ASTRES[p.id].intrus).map((p) => p.id).join() === ordre.join());

  etat = {
    n, cfg, ordre, pieces, places: ordre.map((id) => ({ attendu: id, pleine: false })),
    score: 0, erreurs: 0, serie: 0, sel: null, phase: 'ranger', questions: [], temps: 0, cometePassee: false,
    bonusChrono: 0, pause: false, dernierTic: 0,
  };
  montrer('accueil', false); montrer('bilan', false); montrer('partie', true);
  $('nom-niv').textContent = t('niveauSur', { n: n + 1, max: NIVEAUX.length });
  majMission();
  $('score').textContent = '0';
  montrer('boite', intrus.length > 0);
  montrer('soleil', cfg.mode === 'distance');
  montrer('chrono', !!cfg.chrono);
  if (cfg.chrono) {
    const c = $('comete-chrono');
    c.innerHTML = '';
    c.appendChild(astre('comete', 14));
    c.style.left = '0%';
  }
  construirePlaces();
  construireReserve();
  infoTexte(t(cfg.mode === 'taille' ? 'aideTaille' : 'aideDistance'));
  requestAnimationFrame(placerPlateau);
  demarrerBoucle();
  const cle = cfg.nouveau;
  if (cle && !sauve.vus[cle]) montrerIntro(cle);
}

function majMission() {
  const cfg = etat.cfg;
  let m;
  if (etat.phase === 'quiz') m = t('quiSuisJe');
  else if (cfg.mode === 'taille') m = t('rangeTaille');
  else m = t('rangeSoleil');
  if (cfg.intrus && etat.phase !== 'quiz') m += ' ' + t('plusIntrus');
  $('mission').textContent = m;
}

// ---------- Places (orbites) ----------
function construirePlaces() {
  const plateau = $('plateau');
  plateau.querySelectorAll('.place').forEach((p) => p.remove());
  etat.places.forEach((pl, j) => {
    const b = document.createElement('button');
    b.className = 'place';
    b.dataset.j = j;
    b.setAttribute('aria-label', t(etat.cfg.mode === 'taille' ? 'placeN' : 'orbiteN', { n: j + 1 }));
    b.addEventListener('click', () => toucherPlace(j));
    plateau.appendChild(b);
    pl.el = b;
  });
}
function dessinerPlace(j) {
  const pl = etat.places[j];
  const b = pl.el;
  b.innerHTML = `<span class="num">${j + 1}</span>`;
  b.classList.toggle('pleine', pl.pleine);
  const fit = (etat.taillePlace * 0.86) / 56;   // Jupiter (56) remplit la place
  const d = Math.max(12, Math.round(ASTRES[pl.attendu].px * fit));
  if (pl.pleine) b.appendChild(astre(pl.attendu, d));
  else if (etat.cfg.ombres) { const o = astre(pl.attendu, d); o.classList.add('ombre'); b.appendChild(o); }
}

// Calcule la position des places : en diagonale depuis le Soleil (coin en haut à gauche).
function placerPlateau() {
  if (!etat) return;
  const plateau = $('plateau');
  const W = plateau.clientWidth, H = plateau.clientHeight;
  if (!W || !H) return;
  const n = etat.places.length;
  const distance = etat.cfg.mode === 'distance';
  const rSoleil = distance ? Math.max(30, Math.min(70, Math.min(W, H) * 0.2)) : 0;
  const cx = distance ? rSoleil * 0.5 : 34, cy = distance ? rSoleil * 0.5 : 34;
  let s = 56;
  let pos = [];
  for (let essai = 0; essai < 2; essai++) {
    const m = s / 2 + 8;
    const ex = W - m, ey = H - m;
    const base = Math.atan2(ey - cy, ex - cx);
    const rMax = Math.hypot(ex - cx, ey - cy);
    const r0 = distance ? rSoleil + s * 0.55 + 6 : 0;   // la 1re orbite ne touche pas le Soleil
    const pas = n > 1 ? (rMax - r0) / (n - 1) : 0;
    s = Math.max(44, Math.min(64, pas * 1.02));
    const zig = distance ? 0.2 : 0.12;
    pos = [];
    for (let i = 0; i < n; i++) {
      const r = r0 + i * pas;
      const a = base + (i === 0 ? 0 : (i % 2 ? 1 : -1) * zig * Math.min(1, r / 160));
      let x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      x = Math.max(s / 2 + 8, Math.min(W - s / 2 - 8, x));
      y = Math.max(s / 2 + 10, Math.min(H - s / 2 - 6, y));
      pos.push({ x, y, r });
    }
  }
  etat.taillePlace = s;
  etat.places.forEach((pl, j) => {
    pl.el.style.left = pos[j].x + 'px';
    pl.el.style.top = pos[j].y + 'px';
    pl.el.style.width = pl.el.style.height = s + 'px';
    dessinerPlace(j);
  });
  const sol = $('soleil');
  sol.style.width = sol.style.height = rSoleil * 2 + 'px';
  sol.style.left = cx - rSoleil + 'px';
  sol.style.top = cy - rSoleil + 'px';
  // Orbites (cercles autour du Soleil) ou flèche « petite → grande »
  let svg = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  if (distance) {
    pos.forEach((p) => {
      const r = Math.hypot(p.x - cx, p.y - cy);
      svg += `<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="none" stroke="#ffffff22" stroke-width="1.5" stroke-dasharray="4 6"/>`;
    });
  } else {
    svg += `<polyline points="${pos.map((p) => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ')}" fill="none" stroke="#ffd76a55" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>`;
    const a = pos[n - 1], b = pos[n - 2] || { x: 0, y: 0 };
    svg += `<text x="${Math.min(W - 70, pos[0].x + s / 2 + 6)}" y="${pos[0].y + 4}" fill="#ffd76a" font-size="13" font-weight="700">${t('petite')}</text>`;
    svg += `<text x="${Math.max(4, a.x - s / 2 - 60)}" y="${a.y + 4}" fill="#ffd76a" font-size="13" font-weight="700">${t('grande')}</text>`;
    void b;
  }
  svg += '</svg>';
  $('dessin').innerHTML = svg;
}
// Le plateau se recalcule dès que sa taille change (fenêtre, réserve qui rétrécit…)
let dernierW = 0, dernierH = 0;
function surveillerPlateau() {
  const p = $('plateau');
  if (etat && !$('partie').classList.contains('cache') && (p.clientWidth !== dernierW || p.clientHeight !== dernierH)) {
    dernierW = p.clientWidth; dernierH = p.clientHeight;
    placerPlateau();
  }
}
if (window.ResizeObserver) new ResizeObserver(surveillerPlateau).observe($('plateau'));
window.addEventListener('resize', surveillerPlateau);

// ---------- Réserve (pièces à placer) ----------
function construireReserve() {
  const res = $('reserve');
  res.innerHTML = '';
  etat.pieces.forEach((p, i) => {
    const a = ASTRES[p.id];
    const b = document.createElement('button');
    b.dataset.i = i;
    if (p.enigme) {
      b.className = 'piece enigme';
      b.innerHTML = `<span class="q">?</span><span class="txt">${a.e1}</span>`;
      b.setAttribute('aria-label', t('devinetteAria', { e: a.e1 }));
    } else {
      b.className = 'piece';
      b.appendChild(astre(p.id, Math.round(a.px * 0.8 + 6)));
      const nom = document.createElement('span');
      nom.className = 'nom';
      nom.textContent = a.nom;
      b.appendChild(nom);
      b.setAttribute('aria-label', a.nom);
    }
    b.addEventListener('click', () => {
      if (performance.now() - dernierGlisse < 350) return;   // fin d'un glisser
      choisirPiece(i);
    });
    p.el = b;
    res.appendChild(b);
  });
}

function nomPiece(p) {
  if (p.enigme && p.rate < 2) return t('mystere');
  return ASTRES[p.id].milieu;
}

function choisirPiece(i, garder) {
  if (!etat || etat.phase !== 'ranger' || etat.pause) return;
  const p = etat.pieces[i];
  if (!p || p.place) return;
  if (etat.sel === i && !garder) {
    etat.sel = null;
  } else {
    etat.sel = i;
    son('prendre');
    infoTexte(t(etat.cfg.intrus ? 'ouVaIntrus' : 'ouVa', { nom: nomPiece(p) }));
  }
  etat.pieces.forEach((q, k) => q.el.classList.toggle('choisie', k === etat.sel));
}

function toucherPlace(j) {
  if (!etat || etat.pause) return;
  if (etat.phase === 'quiz') { repondreQuiz(j); return; }
  if (etat.phase !== 'ranger') return;
  if (etat.sel === null) {
    const pl = etat.places[j];
    if (pl.pleine) infoAstre(pl.attendu);
    else { infoTexte(t('choisisDabord')); etat.pieces.forEach((p) => { if (!p.place) secouer(p.el); }); }
    return;
  }
  essayer(etat.sel, j);
}

function essayer(i, j) {
  const p = etat.pieces[i], pl = etat.places[j];
  const a = ASTRES[p.id];
  if (pl.pleine) { infoTexte(t('placePrise')); secouer(pl.el); son('erreur'); return; }
  if (p.id === pl.attendu) { reussite(i, pl.el, () => { pl.pleine = true; dessinerPlace(j); rebond(pl.el); }); return; }
  // Erreur : la pièce revient, un indice aide
  rater(p, pl.el);
  let m;
  if (a.intrus) {
    m = p.enigme && p.rate < 2 ? t('intrusEnigme') : t('pasPlanete', { phrase: a.phrase });
  } else if (p.enigme && p.rate < 2) {
    m = t('relis');
  } else if (etat.cfg.mode === 'taille') {
    m = p.rate < 2 ? t('compare') : t('tailleIndice', { taille: a.taille, n: etat.ordre.indexOf(p.id) + 1 });
  } else if (etat.cfg.ombres && p.rate < 2) {
    m = t('ombres');
  } else {
    m = p.rate < 2 ? t('memoIndice', { memo: MEMO }) : t('rang', { phrase: a.phrase, o: t('ordinal', { n: a.rang }) });
  }
  if (p.enigme && p.rate === 2) revelerCarte(p);
  infoTexte(m);
}

function toucherBoite() {
  if (!etat || etat.pause || etat.phase !== 'ranger' || $('boite').classList.contains('cache')) return;
  if (etat.sel === null) { infoTexte(t('boiteAttend')); return; }
  const p = etat.pieces[etat.sel];
  const a = ASTRES[p.id];
  if (a.intrus) {
    son('intrus');
    reussite(etat.sel, $('boite'), () => rebondBoite(), true);
    return;
  }
  rater(p, $('boite'));
  infoTexte(p.enigme && p.rate < 2 ? t('vraiePlaneteEnigme') : t('vraiePlanete', { phrase: a.phrase }));
  if (p.enigme && p.rate === 2) revelerCarte(p);
}
$('boite').addEventListener('click', toucherBoite);

function revelerCarte(p) {
  const txt = p.el.querySelector('.txt');
  if (txt) txt.innerHTML = `${ASTRES[p.id].e1} <b>(${ASTRES[p.id].nom})</b>`;
}

function rater(p, cible) {
  etat.erreurs++;
  etat.serie = 0;
  p.rate++;
  son('erreur');
  secouer(cible);
  secouer(p.el);
}

// Bonne réponse : la pièce vole jusqu'à sa place, points, étincelles, info.
function reussite(i, cible, apres, estIntrus) {
  const p = etat.pieces[i];
  const a = ASTRES[p.id];
  p.place = true;
  etat.sel = null;
  etat.serie++;
  const gain = 100 + Math.min(100, 20 * (etat.serie - 1));
  ajouterPoints(gain, cible);
  if (!estIntrus) son('bon');
  // Vol de la pièce
  const de = p.el.getBoundingClientRect(), vers = cible.getBoundingClientRect();
  const vol = astre(p.id, Math.round(a.px * 0.8 + 6));
  vol.classList.add('vole');
  vol.style.left = de.left + de.width / 2 - (a.px * 0.8 + 6) / 2 + 'px';
  vol.style.top = de.top + de.height / 2 - (a.px * 0.8 + 6) / 2 + 'px';
  document.body.appendChild(vol);
  p.el.style.visibility = 'hidden';
  requestAnimationFrame(() => {
    vol.style.transform = `translate(${vers.left + vers.width / 2 - de.left - de.width / 2}px,${vers.top + vers.height / 2 - de.top - de.height / 2}px)${estIntrus ? ' scale(.3)' : ''}`;
  });
  setTimeout(() => {
    vol.remove();
    p.el.remove();
    if (!etat || etat.pieces[i] !== p) return;
    apres();
    const r = cible.getBoundingClientRect();
    etincelles(r.left + r.width / 2, r.top + r.height / 2, estIntrus ? '#ff9fd0' : '#ffd76a');
    verifierFin();
  }, 360);
  sauve.album[p.id] = 1;
  enregistrer();
  infoAstre(p.id, estIntrus);
  etat.pieces.forEach((q) => q.el.classList.remove('choisie'));
}

// Minuterie liée à la partie en cours : ignorée si le joueur a changé de niveau ou quitté.
function plusTard(fn, ms) {
  const e = etat;
  setTimeout(() => { if (etat === e && !$('partie').classList.contains('cache')) fn(); }, ms);
}

function verifierFin() {
  if (etat.phase !== 'ranger' || etat.pieces.some((p) => !p.place)) return;
  if (etat.cfg.quiz) { etat.phase = 'transition'; plusTard(lancerQuiz, 1200); }
  else { etat.phase = 'fini'; plusTard(finNiveau, 1300); }
}

// ---------- Quiz « Qui suis-je ? » ----------
function lancerQuiz() {
  if (!etat || etat.phase !== 'transition') return;
  etat.phase = 'quiz';
  etat.questions = melanger(etat.ordre.slice()).slice(0, etat.cfg.quiz);
  etat.places.forEach((pl) => pl.el.classList.add('quiz'));
  majMission();
  poserQuestion();
}
function poserQuestion() {
  const id = etat.questions[0];
  const reste = etat.questions.length;
  infoTexte(`<b>${t('quiSuisJe')}</b> ${t('cite', { x: ASTRES[id].e2 })} <small>(${t('nbQuestions', { n: reste })})</small>`, true);
}
function repondreQuiz(j) {
  const id = etat.questions[0];
  const pl = etat.places[j];
  if (!id) return;
  if (pl.attendu === id) {
    son('quiz');
    etat.serie++;
    ajouterPoints(50, pl.el);
    rebond(pl.el);
    const r = pl.el.getBoundingClientRect();
    etincelles(r.left + r.width / 2, r.top + r.height / 2, '#9fe7ff');
    etat.questions.shift();
    if (etat.questions.length) {
      infoTexte(t('bravoCetait', { nom: ASTRES[id].nom }));
      plusTard(() => { if (etat.phase === 'quiz') poserQuestion(); }, 1100);
    } else {
      etat.phase = 'fini';
      etat.places.forEach((p) => p.el.classList.remove('quiz'));
      infoTexte(t('quizFini', { nom: ASTRES[id].nom }));
      plusTard(finNiveau, 1300);
    }
  } else {
    etat.erreurs++;
    etat.serie = 0;
    son('erreur');
    secouer(pl.el);
    infoTexte(t('nonPas', { nom: ASTRES[pl.attendu].nom, cite: t('cite', { x: ASTRES[id].e2 }) }), true);
  }
}

// ---------- Ligne d'information ----------
function infoTexte(html, brut) {
  const info = $('info');
  info.innerHTML = brut ? html : '';
  if (!brut) info.textContent = html;
  info.classList.remove('neuf'); void info.offsetWidth; info.classList.add('neuf');
}
function infoAstre(id, estIntrus) {
  const a = ASTRES[id];
  const info = $('info');
  info.innerHTML = '';
  info.appendChild(astre(id, 30));
  const sp = document.createElement('span');
  const texte = estIntrus ? a.info : (etat.cfg.mode === 'taille' ? a.taille : a.info);
  sp.innerHTML = `<b>${estIntrus ? t('intrusDemasque') : t('nomDeux', { nom: a.nom })} </b>`;
  sp.appendChild(document.createTextNode(texte));
  info.appendChild(sp);
  info.classList.remove('neuf'); void info.offsetWidth; info.classList.add('neuf');
}

// ---------- Score ----------
function ajouterPoints(n, cible) {
  etat.score += n;
  const sc = $('score');
  sc.textContent = etat.score;
  sc.classList.remove('pop'); void sc.offsetWidth; sc.classList.add('pop');
  const r = cible.getBoundingClientRect();
  const t = document.createElement('div');
  t.className = 'points';
  t.textContent = '+' + n;
  t.style.left = r.left + r.width / 2 + 'px';
  t.style.top = r.top + 'px';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1000);
}

// ---------- Glisser-déposer (doigt ou souris) ----------
let glisse = null;
let dernierGlisse = 0;
$('reserve').addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.piece');
  if (!b || !etat || etat.phase !== 'ranger' || etat.pause) return;
  glisse = { i: +b.dataset.i, x0: e.clientX, y0: e.clientY, el: b, fantome: null, id: e.pointerId };
});
window.addEventListener('pointermove', (e) => {
  if (!glisse || e.pointerId !== glisse.id) return;
  if (!glisse.fantome) {
    if (Math.hypot(e.clientX - glisse.x0, e.clientY - glisse.y0) < 10) return;
    const p = etat.pieces[glisse.i];
    if (!p || p.place) { glisse = null; return; }
    choisirPiece(glisse.i, true);
    let f;
    if (p.enigme) { f = document.createElement('div'); f.className = 'fantome carte'; f.textContent = ASTRES[p.id].e1; }
    else { f = astre(p.id, Math.round(ASTRES[p.id].px * 0.8 + 10)); f.classList.add('fantome'); }
    document.body.appendChild(f);
    glisse.fantome = f;
    glisse.el.classList.add('tenue');
  }
  glisse.fantome.style.left = e.clientX + 'px';
  glisse.fantome.style.top = e.clientY + 'px';
  // Surbrillance de la cible survolée
  const sous = document.elementFromPoint(e.clientX, e.clientY);
  document.querySelectorAll('.cible').forEach((c) => c.classList.remove('cible'));
  const c = sous && (sous.closest('.place') || sous.closest('#boite'));
  if (c) c.classList.add('cible');
});
function finGlisse(e, annule) {
  if (!glisse || e.pointerId !== glisse.id) return;
  const g = glisse;
  glisse = null;
  if (!g.fantome) return;
  g.fantome.remove();
  g.el.classList.remove('tenue');
  dernierGlisse = performance.now();
  document.querySelectorAll('.cible').forEach((c) => c.classList.remove('cible'));
  if (annule || !etat || etat.phase !== 'ranger') return;
  const sous = document.elementFromPoint(e.clientX, e.clientY);
  const place = sous && sous.closest('.place');
  if (place) essayer(g.i, +place.dataset.j);
  else if (sous && sous.closest('#boite')) toucherBoite();
}
window.addEventListener('pointerup', (e) => finGlisse(e, false));
window.addEventListener('pointercancel', (e) => finGlisse(e, true));

// ---------- Clavier ----------
document.addEventListener('keydown', (e) => {
  if (!$('intro').classList.contains('cache')) {
    if (['Enter', ' ', 'Escape'].includes(e.key)) { e.preventDefault(); fermerIntro(); }
    return;
  }
  if (!$('album').classList.contains('cache')) { if (e.key === 'Escape') montrer('album', false); return; }
  if (!etat || $('partie').classList.contains('cache') || !$('bilan').classList.contains('cache')) return;
  const surBouton = document.activeElement && document.activeElement.tagName === 'BUTTON';
  if (/^[1-9]$/.test(e.key)) {
    const j = +e.key - 1;
    if (j < etat.places.length) toucherPlace(j);
  } else if (e.key === 'i' || e.key === 'I' || e.key === '0') {
    toucherBoite();
  } else if (['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp'].includes(e.key) || (e.key === ' ' && !surBouton)) {
    e.preventDefault();
    if (etat.phase !== 'ranger') return;
    const libres = etat.pieces.map((p, k) => (p.place ? -1 : k)).filter((k) => k >= 0);
    if (!libres.length) return;
    const pos = libres.indexOf(etat.sel);
    const sens = (e.key === 'ArrowLeft' || e.key === 'ArrowUp') ? -1 : 1;
    const k = libres[(pos + sens + libres.length) % libres.length];
    choisirPiece(k, true);
    etat.pieces[k].el.focus({ preventScroll: true });
  }
});

// ---------- Chrono comète (boucle d'animation) ----------
let idBoucle = 0, tPrec = 0;
function demarrerBoucle() {
  arreterBoucle();
  tPrec = performance.now();
  const pas = (t) => {
    const dt = Math.min(0.1, (t - tPrec) / 1000);
    tPrec = t;
    if (etat && etat.cfg.chrono && !etat.pause && !document.hidden && (etat.phase === 'ranger' || etat.phase === 'quiz')) {
      etat.temps += dt;
      const total = etat.cfg.chrono;
      const f = Math.min(1, etat.temps / total);
      $('comete-chrono').style.left = (f * 100) + '%';
      const reste = Math.ceil(total - etat.temps);
      if (!etat.cometePassee && reste <= 10 && reste !== etat.dernierTic) { etat.dernierTic = reste; son('tic'); }
      if (!etat.cometePassee && f >= 1) {
        etat.cometePassee = true;
        son('comete');
        infoTexte(t('cometePassee'));
      }
    }
    idBoucle = requestAnimationFrame(pas);
  };
  idBoucle = requestAnimationFrame(pas);
}
function arreterBoucle() { if (idBoucle) cancelAnimationFrame(idBoucle); idBoucle = 0; }

// ---------- Fin de niveau : bilan ----------
function finNiveau() {
  if (!etat) return;
  const cfg = etat.cfg, n = etat.n;
  let etoiles = etat.erreurs === 0 ? 3 : etat.erreurs <= 2 ? 2 : 1;
  let bonus = 0;
  if (cfg.chrono) {
    if (etat.cometePassee) etoiles = Math.min(2, etoiles);
    else bonus = Math.ceil(cfg.chrono - etat.temps) * 5;
  }
  const total = etat.score + bonus;
  const ancien = sauve.records[n];
  const nouveauRecord = total > ancien;
  if (nouveauRecord) sauve.records[n] = total;
  sauve.etoiles[n] = Math.max(sauve.etoiles[n], etoiles);
  if (n + 1 < NIVEAUX.length) sauve.debloque = Math.max(sauve.debloque, n + 1);
  enregistrer();
  // Progression du site : niveau réussi → on reprendra au suivant (le dernier reste jouable).
  JEL_SAVE.save(JEU, { niveau: Math.min(NIVEAUX.length, n + 2), score: total });

  const dernier = n === NIVEAUX.length - 1;
  $('bilan-titre').textContent = dernier ? t('grandTourFini') : t('niveauReussi', { n: n + 1 });
  const lignes = [t('erreurs', { n: etat.erreurs })];
  if (cfg.chrono) lignes.push(etat.cometePassee ? t('cometeAvant') : t('plusRapide', { n: bonus }));
  if (dernier) {
    const te = sauve.etoiles.reduce((a, b) => a + b, 0);
    const tp = sauve.records.reduce((a, b) => a + b, 0);
    lignes.push(t('tousNiveaux', { e: te, max: NIVEAUX.length * 3, p: tp }));
    lignes.push(t(te < NIVEAUX.length * 3 ? 'rejoueEtoiles' : 'toutesEtoiles'));
  } else if (etoiles < 3) {
    lignes.push(t('zeroErreur'));
  }
  $('bilan-details').innerHTML = lignes.map((l) => `<div>${l}</div>`).join('');
  const rec = $('bilan-record');
  rec.textContent = nouveauRecord ? t(ancien > 0 ? 'nouveauRecord' : 'premierRecord') : t('recordPoints', { n: ancien });
  rec.classList.toggle('nouveau', nouveauRecord);
  montrer('btn-suivant', !dernier);
  $('btn-rejouer').textContent = t('rejouer');
  const spans = $('bilan-etoiles').querySelectorAll('span');
  spans.forEach((s) => s.classList.remove('gagnee'));
  montrer('bilan', true);
  son('fanfare');
  confettis();
  // Score qui défile, puis étoiles une à une
  const sc = $('bilan-score');
  const debut = performance.now();
  const defile = (t) => {
    const f = Math.min(1, (t - debut) / 900);
    sc.textContent = window.JEL_I18N.t('points', { n: Math.round(total * f) });
    if (f < 1) requestAnimationFrame(defile);
  };
  requestAnimationFrame(defile);
  for (let k = 0; k < etoiles; k++) {
    setTimeout(() => { spans[k].classList.add('gagnee'); son('etoile'); }, 700 + k * 380);
  }
  setTimeout(() => (dernier ? $('btn-rejouer') : $('btn-suivant')).focus({ preventScroll: true }), 50);
}
$('btn-suivant').addEventListener('click', () => { son('clic'); demarrerNiveau(Math.min(NIVEAUX.length - 1, etat.n + 1)); });
$('btn-rejouer').addEventListener('click', () => { son('clic'); demarrerNiveau(etat.n); });
$('btn-bilan-menu').addEventListener('click', () => { son('clic'); afficherAccueil(); });
$('btn-menu').addEventListener('click', () => { son('clic'); afficherAccueil(); });
$('btn-aide').addEventListener('click', () => {
  son('clic');
  if (!etat) return;
  // Revoir l'explication de la mécanique la plus récente de ce niveau
  let cle = 'base';
  for (let k = 0; k <= etat.n; k++) if (NIVEAUX[k].nouveau) cle = NIVEAUX[k].nouveau;
  montrerIntro(cle);
});

// =====================================================================
// Tutoriel animé : une main montre le geste, sans besoin de toucher
// =====================================================================
// Titre et étapes : traductions intro.<clé>.titre et intro.<clé>.0 à 2
const INTROS = {
  base: { scene: 'base' }, sansOmbres: { scene: 'sansOmbres' }, quiz: { scene: 'quiz' }, intrus: { scene: 'intrus' },
  taille: { scene: 'taille' }, enigmes: { scene: 'enigmes' }, chrono: { scene: 'chrono' },
};
// Place un élément dans la scène (coordonnées en px)
function poser(el, x, y) { el.style.left = x + 'px'; el.style.top = y + 'px'; return el; }
function elem(cls, html) { const d = document.createElement('div'); d.className = cls; if (html) d.innerHTML = html; return d; }
function mouvement(el, dx, dy) { el.style.setProperty('--dx', dx + 'px'); el.style.setProperty('--dy', dy + 'px'); return el; }
function construireScene(type) {
  const sc = $('intro-scene');
  sc.innerHTML = '';
  const ajouter = (el) => { sc.appendChild(el); return el; };
  if (type === 'base' || type === 'sansOmbres' || type === 'enigmes') {
    // Soleil en haut à gauche, 3 orbites, une pièce glisse vers l'orbite 3
    const sol = ajouter(poser(elem(''), -30, -30));
    Object.assign(sol.style, { width: '80px', height: '80px', borderRadius: '50%', background: 'radial-gradient(circle,#fffbd6,#ffd34d 45%,#ff9a1f)' });
    [[70, 34], [120, 52], [178, 62]].forEach(([x, y], k) => {
      const p = ajouter(poser(elem('mini-place', `${k + 1}`), x, y));
      if (type === 'base') { const o = astre(['mercure', 'venus', 'terre'][k], 22 + k * 3); o.style.opacity = '.3'; o.style.position = 'absolute'; p.appendChild(o); }
    });
    let piece;
    if (type === 'enigmes') {
      piece = elem('', t('sceneEnigme'));
      Object.assign(piece.style, { width: '120px', fontSize: '11px', background: '#5b4bb5', borderRadius: '10px', padding: '4px 6px' });
      poser(piece, 20, 104);
      mouvement(piece, 140, -44);
    } else {
      piece = astre('terre', 30);
      poser(piece, 40, 108);
      mouvement(piece, 160, -38);
    }
    piece.classList.add('bouge');
    ajouter(piece);
    ajouter(mouvement(poser(elem('main', '👆'), 52, 118), type === 'enigmes' ? 140 : 160, type === 'enigmes' ? -44 : -38));
  } else if (type === 'quiz') {
    ajouter(poser(elem('bulle', t('sceneQuiz')), 0, 0));
    [['mars', 30], ['jupiter', 100], ['saturne', 180]].forEach(([id, x]) => {
      const p = ajouter(poser(elem('mini-place'), x, 64));
      p.appendChild(astre(id, id === 'mars' ? 20 : 32));
    });
    ajouter(mouvement(poser(elem('main', '👆'), 110, 112), 82, -10));
  } else if (type === 'intrus') {
    const lune = ajouter(mouvement(poser(astre('lune', 28), 170, 30), -128, 80));
    lune.classList.add('bouge');
    ajouter(poser(elem('mini-boite', '🗑️ ' + t('boite')), 14, 92));
    ajouter(poser(astre('mars', 24), 100, 34));
    ajouter(mouvement(poser(elem('main', '👆'), 182, 44), -128, 80));
  } else if (type === 'taille') {
    [24, 92, 160].forEach((x, k) => ajouter(poser(elem('mini-place', `${k + 1}`), x, 28)));
    const piece = ajouter(mouvement(poser(astre('mercure', 20), 172, 104), -136, -63));
    piece.classList.add('bouge');
    ajouter(poser(astre('terre', 34), 104, 98));
    ajouter(poser(astre('jupiter', 44), 36, 92));
    ajouter(mouvement(poser(elem('main', '👆'), 180, 114), -136, -63));
    const fl = ajouter(poser(elem('', t('petiteGrande')), 70, 4));
    Object.assign(fl.style, { fontSize: '13px', fontWeight: '800', color: '#ffd76a' });
  } else if (type === 'chrono') {
    const piste = ajouter(poser(elem(''), 20, 40));
    Object.assign(piste.style, { width: '220px', height: '24px', borderRadius: '12px', background: '#ffffff18' });
    const c = ajouter(poser(astre('comete', 16), 22, 44));
    c.classList.add('fileante');
    ajouter(poser(elem('', '🏁'), 222, 42));
    ajouter(poser(elem('', t('sceneChrono')), 30, 100)).style.fontSize = '14px';
  }
}
let introOuverte = null;
function montrerIntro(cle) {
  const d = INTROS[cle];
  if (!d) return;
  introOuverte = cle;
  if (etat) etat.pause = true;
  $('intro-titre').textContent = t('intro.' + cle + '.titre');
  $('intro-etapes').innerHTML = [0, 1, 2].map((k) => `<li><b>${k + 1}</b><span>${t('intro.' + cle + '.' + k, { memo: MEMO })}</span></li>`).join('');
  construireScene(d.scene);
  montrer('intro', true);
  $('btn-compris').focus({ preventScroll: true });
}
function fermerIntro() {
  if (introOuverte) { sauve.vus[introOuverte] = 1; enregistrer(); }
  introOuverte = null;
  montrer('intro', false);
  $('intro-scene').innerHTML = '';
  if (etat) etat.pause = false;
  son('clic');
}
$('btn-compris').addEventListener('click', fermerIntro);
$('intro').addEventListener('click', (e) => { if (e.target === $('intro')) fermerIntro(); });

// =====================================================================
// Effets visuels
// =====================================================================
function secouer(el) { if (!el) return; el.classList.remove('secoue'); void el.offsetWidth; el.classList.add('secoue'); }
function rebond(el) { el.classList.remove('rebond'); void el.offsetWidth; el.classList.add('rebond'); }
function rebondBoite() { secouer($('boite')); }
function etincelles(x, y, couleur) {
  for (let k = 0; k < 14; k++) {
    const s = document.createElement('div');
    s.className = 'etincelle';
    s.style.left = x - 4 + 'px';
    s.style.top = y - 4 + 'px';
    s.style.background = k % 3 ? couleur : '#fff';
    document.body.appendChild(s);
    const a = (k / 14) * Math.PI * 2, d = 30 + Math.random() * 40;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      s.style.transform = `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) scale(.3)`;
      s.style.opacity = '0';
    }));
    setTimeout(() => s.remove(), 750);
  }
}
// Confettis en canvas pendant 2,5 secondes
function confettis() {
  const cv = $('confettis');
  const c = cv.getContext('2d');
  if (!c) return;
  const W = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
  const couleurs = ['#ffd76a', '#9fe7ff', '#ff9fd0', '#a99bff', '#7dffb0', '#ffffff'];
  const parts = Array.from({ length: 90 }, () => ({
    x: W / 2 + (Math.random() - 0.5) * 80, y: H * 0.35, vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 9 - 3,
    r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, t: 5 + Math.random() * 5, col: couleurs[Math.floor(Math.random() * couleurs.length)],
  }));
  const debut = performance.now();
  const anim = (t) => {
    c.clearRect(0, 0, W, H);
    parts.forEach((p) => {
      p.vy += 0.22; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.col; c.fillRect(-p.t / 2, -p.t / 4, p.t, p.t / 2); c.restore();
    });
    if (t - debut < 2500) requestAnimationFrame(anim);
    else c.clearRect(0, 0, W, H);
  };
  requestAnimationFrame(anim);
}
