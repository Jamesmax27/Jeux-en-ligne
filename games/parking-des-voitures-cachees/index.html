  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  function remplirTag(tag, role) {
    if (tag.dataset.role === role) return;
    tag.dataset.role = role;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = tr('place.' + role);
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const pts = e ? e.sc[s] : 0;
      const zone = d.querySelector('.pts');
      if (zone.dataset.n !== String(pts)) { zone.dataset.n = String(pts); zone.innerHTML = ICONE_TICKET; zone.appendChild(document.createTextNode(nb(pts))); }
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role);
      d.setAttribute('aria-label', tr('place.aria.' + role, { animal: tr('animal.' + s), n: pts }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) {
      if (e.att) return tr('tour.rate');
      return e.o.length === 1 ? tr('tour.deuxieme') : tr('tour.toi');
    }
    return tr('tour.autre', { animal: tr('animal.' + s) });
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
    majKlaxon();
  }

  // Bouton du klaxon : visible si le parking en donne, actif après la 1re porte.
  function klaxonPossible() {
    return !!(vue && partie && partie.siege >= 0 && partie.monTour() && !enPause && !attenteTuto && R.valide(vue, partie.siege, 'k'));
  }
  function majKlaxon() {
    const b = $('btn-klaxon');
    const moi = partie ? partie.siege : -1;
    const montre = !!(vue && vue.cf && moi >= 0 && NIVEAUX[vue.n] && (NIVEAUX[vue.n].kl || 0) > 0);
    b.hidden = !montre;
    if (!montre) return;
    const reste = vue.kl[moi] || 0;
    const pret = klaxonPossible();
    b.querySelector('.nbk').textContent = nb(reste);
    b.disabled = !pret;
    b.style.opacity = reste > 0 ? '1' : '.45';
    b.classList.toggle('pret', pret);
    b.setAttribute('aria-label', tr('klaxon.aria', { n: reste }));
  }

  function majInterface() {
    majPlaces();
    majInfos();
    $('aide').textContent = session === 'ligne' || !vue ? tr('jeu.aide') : tr(vue.cf && NIVEAUX[vue.n].kl ? 'jeu.aideKlaxon' : 'jeu.aide');
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    geo = geometrie(vue, w, h, Math.max(12, Math.min(w, h) * 0.04));
    scene.e = vue;
    const monTour = partie && partie.monTour();
    scene.couleur = partie ? partie.siege : -1;
    scene.vise = monTour ? survol : -1;
    scene.curseur = clavier && monTour ? curseur : -1;
    dessinerParking(c, scene, geo, t, dt, theme());
    // tickets qui s'envolent vers le pilote, étincelles
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      if (p.ticket) {
        const q = Math.min(1, (t - p.t0) / p.d);
        if (q < 0) continue;
        if (q >= 1) {
          particules.splice(i, 1);
          const carte = $('place-' + p.qui);
          if (carte) { carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond'); }
          sons.ticket();
          continue;
        }
        const e2 = ease(q), x = p.x + (p.tx - p.x) * e2, y = p.y + (p.ty - p.y) * e2 - Math.sin(q * Math.PI) * 60;
        c.save(); c.translate(x, y); c.rotate(q * 6);
        c.fillStyle = '#ffb300'; c.strokeStyle = '#a66a00'; c.lineWidth = 2; rr(c, -14, -9, 28, 18, 3); c.fill(); c.stroke();
        c.fillStyle = '#fff3c4'; rond(c, -14, 0, 4); c.fill(); rond(c, 14, 0, 4); c.fill();
        c.restore();
        continue;
      }
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      etincelle(c, p.x, p.y, p.k);
      c.globalAlpha = 1;
    }
  }

  // Centre d'une place (coordonnées du plateau).
  function centre(i) {
    const pos = disposition(vue)[i];
    return [geo.ox + (pos.x + pos.w / 2) * geo.cw, geo.oy + (pos.y + 0.5) * geo.ch];
  }

  function jaillir(i, qui, n, retard) {
    if (!vue || !geo) return;
    const p = centre(i);
    for (let k = 0; k < 12; k++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 160;
      particules.push({ x: p[0], y: p[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v - 150, vie: 0.7 + Math.random() * 0.4, k: geo.cw * (0.05 + Math.random() * 0.05), coul: k % 2 ? COUL[qui] : '#ffe066' });
    }
    // tickets vers la carte du pilote
    const carte = $('place-' + qui), plat = $('plateau');
    if (!carte) return;
    const rc = carte.getBoundingClientRect(), rp = plat.getBoundingClientRect();
    for (let k = 0; k < n; k++) {
      particules.push({ ticket: true, qui: qui, x: p[0], y: p[1], tx: rc.left + rc.width / 2 - rp.left, ty: rc.top + rc.height / 2 - rp.top, t0: performance.now() + (retard || 0) + k * 180, d: 800 });
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function nouvelleVue(etat) {
    vue = etat ? JSON.parse(JSON.stringify(etat)) : null;
    scene.e = vue;
    scene.k = {}; scene.mv = {}; scene.part = {}; scene.lav = null; scene.dep = null; scene.asc = null;
    if (vue) vue.o.forEach((i) => { scene.k[i] = 1; });
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    nouvelleVue(partie.etat);
    appliquerTheme();
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne)
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), cle = role + (info.chef ? '+chef' : '');
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44);
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role);
        d.setAttribute('aria-label', tr('salon.place.' + role, { animal: tr('animal.' + s) }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { animal: tr('animal.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    clearTimeout(fermeAuto);
    nouvelleVue(partie.etat);
    appliquerTheme();
    particules.length = 0;
    debutTour = Date.now();
    dernierTic = -1;
    curseur = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  // Les véhicules qui ont changé de place glissent vers la nouvelle.
  function glissements(av, ap, t, evt) {
    const p0 = disposition(av), p1 = disposition(ap);
    for (let i = 0; i < ap.c.length; i++) {
      if (!p0[i] || !p1[i] || (p0[i].x === p1[i].x && p0[i].y === p1[i].y)) continue;
      const saut = evt && evt.k === 'asc' && Math.abs(p1[i].x - p0[i].x) > ap.W / 2;
      scene.mv[i] = { x0: p0[i].x, y0: p0[i].y, t0: t, d: evt && evt.k === 'dep' ? 1000 : 750, lev: evt && evt.k === 'dep', saut: saut, d0: evt && evt.d ? evt.d : 1 };
    }
  }

  function surAction(ev) {
    const t = performance.now();
    const av = ev.avant, ap = ev.apres, a = ev.action;
    vue = JSON.parse(JSON.stringify(ap));
    scene.e = vue;
    debutTour = Date.now();
    dernierTic = -1;
    if (typeof a === 'number') {
      sons.monte();
      if (ap.p[a] >= 0 && av.p[a] === -1) {
        // une paire : les deux véhicules partent en balade
        const paire = [];
        for (let i = 0; i < ap.p.length; i++) if (av.p[i] === -1 && ap.p[i] >= 0) paire.push(i);
        const val = O.valeur(ap.c[a]);
        paire.forEach((i, k) => { scene.part[i] = t; if (k === 0) jaillir(i, ev.siege, val, 650); });
        setTimeout(() => sons.paire(), 250);
        if (ev.moi && session === 'solo' && prog.garage.indexOf(ap.c[a]) < 0) {
          prog.garage.push(ap.c[a]);
          nouveauxGarage.push(ap.c[a]);
          setTimeout(() => toast(tr('garage.nouveau')), 900);
        }
        if (ap.c[a] === O.DOREE) setTimeout(() => toast(tr('jeu.doree', { animal: tr('animal.' + ev.siege) })), 700);
      } else if (ap.att) {
        setTimeout(() => sons.rate(), 300);
        if (ev.moi && !ev.auto) programmerFermeture();
      }
    } else if (a === 'k') {
      sons.klaxon();
      if (ap.kh >= 0) sons.reponse();
      else { sons.personne(); toast(tr('klaxon.personne'), 2200); }
      if (!ev.moi) toast(tr('klaxon.autre', { animal: tr('animal.' + ev.siege) }), 1800);
    } else if (a === 'ok') {
      clearTimeout(fermeAuto);
      sons.descend();
      if (ap.ev && av.ev && ap.ev.i !== av.ev.i) evenementVu(ap.ev, av, ap, t);
    }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && R.aQui(vue) === partie.siege && !ev.moi && a === 'ok') sons.tour();
    if (curseur >= 0 && vue.p[curseur] !== -1) curseur = plusProche(curseur);
  }

  // Dépanneuse, lavage, ascenseur : animation et message.
  function evenementVu(evt, av, ap, t) {
    if (evt.k === 'dep') {
      scene.dep = { ids: evt.a.slice(), t0: t };
      glissements(av, ap, t, evt);
      sons.depanneuse(); toast(tr('ev.dep'), 2200);
    } else if (evt.k === 'lav') {
      scene.lav = { id: evt.a[0], t0: t, fin: t + 1500 };
      sons.lavage(); toast(tr('ev.lav'), 2200);
    } else if (evt.k === 'asc') {
      scene.asc = { r: evt.r, d: evt.d, t0: t };
      glissements(av, ap, t, evt);
      sons.ascenseur(); toast(tr(evt.d > 0 ? 'ev.ascDroite' : 'ev.ascGauche'), 2200);
    }
  }

  // Deux portes différentes : elles se referment toutes seules au bout d'un instant.
  function programmerFermeture() {
    clearTimeout(fermeAuto);
    const j = jeton;
    fermeAuto = setTimeout(() => { if (j === jeton) fermer(); }, 1300);
  }
  function fermer() {
    if (!partie || enPause || !vue || !vue.att) return false;
    if (!partie.monTour()) return false;
    clearTimeout(fermeAuto);
    return partie.jouer('ok');
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    clearTimeout(fermeAuto);
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1500);
  }

  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = moi >= 0 && e.sc[moi] === Math.max.apply(null, e.sc);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function totalTickets(e) { return e.c.reduce((s, t) => s + O.valeur(t), 0) / 2; }

  function etoilesPour(pts, total, gagne) {
    if (!gagne) return 0;
    const p = total ? pts / total : 0;
    return p >= 0.5 ? 3 : p >= 0.35 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      if (e.sc[s] !== prec) { rang = k + 1; prec = e.sc[s]; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64; medaillon(cv.getContext('2d'), s, 32, 32, 30);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('animal.' + s) + ' · ' + tr('place.' + role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.ticketsCourt', { n: e.sc[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.sc[moi] : 0;
    const total = totalTickets(e);
    const gagne = moi >= 0 && pts === Math.max.apply(null, e.sc);
    const egalite = gagne && e.sc.filter((x) => x === pts).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.tickets', { n: pts, total: total }) : '';
    $('fin-garage').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(pts, total, gagne);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
      } else sauver(niveau, pts);
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      if (nouveauxGarage.length) $('fin-garage').textContent = tr('fin.garage', { n: nouveauxGarage.length });
      const nouveauParking = debloque && niveau % 5 === 0;
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (nouveauParking ? tr('fin.parking', { nom: tr('parking.' + NIVEAUX[niveau].p) }) : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : ''));
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 5 === 4 ? '#ffb300' : COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux
  // ---------------------------------------------------------------------

  let attenteTuto = false;

  function quitterPartie() {
    jeton++;
    clearTimeout(fermeAuto);
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    nouvelleVue(null);
    particules.length = 0;
    bandeau('');
    fermerVoile('voile-pause');
    fermerVoile('voile-fin');
    fermerVoile('voile-tuto');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  // Parcours solo : niveau n contre 3 robots.
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    clearTimeout(fermeAuto);
    enPartie = true;
    enPause = false;
    nouveauxGarage = [];
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    // aperçu du parking avant le tutoriel (portes fermées)
    nouvelleVue(R.depart(window.JEL_MULTI.hasard(niveau * 977), PLACES, { niveau: niveau }));
    particules.length = 0;
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();

  function lancerNiveau() {

  function dessinerGarage() {
    const cv = $('garage-cv'), zone = $('garage-zone');
    const w = zone.clientWidth - 20, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (w <= 0 || h <= 0) return;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const d = prog.deco, t = performance.now();
    // mur et sol
    c.fillStyle = PEINTURES[d.peinture]; rr(c, 0, 0, w, h, 16); c.fill();
    const sol = h * 0.86;
    if (d.arc) {
      ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93'].forEach((col, i) => {
        c.strokeStyle = col; c.lineWidth = h * 0.025; c.globalAlpha = 0.45;
        c.beginPath(); c.arc(w / 2, sol, w * 0.45 - i * h * 0.025, Math.PI, 0); c.stroke();
      });
      c.globalAlpha = 1;
    }
    if (d.damier) {
      const k = h * 0.035;
      for (let x = 0, n = 0; x < w; x += k, n++) for (let y = sol, m = 0; y < h; y += k, m++) { c.fillStyle = (n + m) % 2 ? '#2a2a2e' : '#f5f5f5'; c.fillRect(x, y, k + 0.5, k + 0.5); }
    } else { c.fillStyle = '#9aa4b1'; c.fillRect(0, sol, w, h - sol); }
    if (d.guirlande) {
      c.strokeStyle = '#555'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(0, h * 0.02); c.quadraticCurveTo(w / 2, h * 0.09, w, h * 0.02); c.stroke();
      for (let i = 1; i < 12; i++) {
        const x = (w * i) / 12, y = h * 0.02 + Math.sin((i / 12) * Math.PI) * h * 0.035;
        c.fillStyle = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4'][i % 4];
        poly(c, [x - w * 0.025, y, x + w * 0.025, y, x, y + h * 0.04]); c.fill();
      }
    }
    if (d.lampes) {
      for (let i = 0; i < 3; i++) {
        const x = w * (0.2 + 0.3 * i), y = h * 0.09;
        const gr = c.createRadialGradient(x, y, 2, x, y, h * 0.12); gr.addColorStop(0, 'rgba(255,240,150,.8)'); gr.addColorStop(1, 'rgba(255,240,150,0)');
        c.fillStyle = gr; rond(c, x, y, h * 0.12); c.fill();
        c.fillStyle = '#444'; poly(c, [x - h * 0.025, y, x + h * 0.025, y, x + h * 0.012, y - h * 0.02, x - h * 0.012, y - h * 0.02]); c.fill();
      }
    }
    // emplacements : 15 voitures (4 par rangée), puis 4 camions (2 par rangée)
    const zoneH = sol - h * 0.13, top = h * 0.12;
    const rangs = 6, rh = zoneH / rangs, cols = 4, cw = (w - w * 0.06) / cols, ox = w * 0.03;
    for (let t2 = 0; t2 < NB_TYPES; t2++) {
      let r, col, ww;
      if (t2 < O.CAMION) { r = Math.floor(t2 / 4); col = t2 % 4; ww = cw; }
      else { const k = t2 - O.CAMION; r = 4 + Math.floor(k / 2); col = (k % 2) * 2; ww = cw * 2; }
      const x = ox + col * cw, y = top + r * rh;
      c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(x + 3, y + rh - 2); c.lineTo(x + ww - 3, y + rh - 2); c.stroke();
      c.beginPath(); c.moveTo(x + 3, y + rh * 0.3); c.lineTo(x + 3, y + rh - 2); c.moveTo(x + ww - 3, y + rh * 0.3); c.lineTo(x + ww - 3, y + rh - 2); c.stroke();
      if (prog.garage.indexOf(t2) >= 0) vehicule(c, t2, x + ww * 0.06, y + rh * 0.08, ww * 0.88, rh * 0.88, t);
      else silhouette(c, t2, x + ww * 0.06, y + rh * 0.08, ww * 0.88, rh * 0.88);
    }
    if (d.plantes) {
      [[w * 0.03, 1], [w * 0.97, -1]].forEach((p) => {
        const x = p[0], y = sol;
        c.fillStyle = '#c0703a'; poly(c, [x - h * 0.03, y, x + h * 0.03, y, x + h * 0.022, y + h * 0.06, x - h * 0.022, y + h * 0.06]); c.fill();
        c.fillStyle = '#3f9a4f'; for (let k = 0; k < 5; k++) { ell(c, x + (k - 2) * h * 0.012, y - h * 0.03 - (k % 2) * h * 0.02, h * 0.012, h * 0.04, (k - 2) * 0.35); c.fill(); }
      });
    }
    if (d.coupe) {
      const x = w * 0.5, y = sol + h * 0.07;
      c.fillStyle = '#f2c230'; c.strokeStyle = '#a07a00'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(x - h * 0.04, y - h * 0.09); c.lineTo(x + h * 0.04, y - h * 0.09); c.quadraticCurveTo(x + h * 0.04, y - h * 0.03, x, y - h * 0.025); c.quadraticCurveTo(x - h * 0.04, y - h * 0.03, x - h * 0.04, y - h * 0.09); c.fill(); c.stroke();
      c.fillRect(x - h * 0.008, y - h * 0.026, h * 0.016, h * 0.02); c.fillRect(x - h * 0.025, y - h * 0.008, h * 0.05, h * 0.012);
      c.fillStyle = '#fffbe0'; etincelle(c, x + h * 0.05, y - h * 0.09, h * 0.015);

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const sc = nouvelleScene();
    const base = () => {
      const e = { n: niveau - 1, W: 0, H: d.r.length, c: [], r: [], p: [], o: [], att: 0, sc: [0, 0, 0, 0], pa: [0, 0, 0, 0], kh: -1, kl: [1, 1, 1, 1], vu: [] };
      d.r.forEach((etage) => {
        const l = []; let w = 0;
        etage.forEach((t) => { l.push(e.c.length); e.c.push(t); e.p.push(-1); e.vu.push(0); w += O.largeur(t); });
        e.W = Math.max(e.W, w); e.r.push(l);
      });
      return e;
    };
    sc.e = base();
    let debut = 0, fait = 0;
    const PAS = 1150, j = ++tutoAnim;
    const g = geometrie(sc.e, 560, 380, 30);
    let tPrecT = 0;
    function appliquer(pa, t) {
      const e = sc.e;
      if (pa[0] === 'o') {
        e.o.push(pa[1]);
        if (e.o.length === 2) {
          const x = e.o[0], y = e.o[1];
          if (e.c[x] === e.c[y]) { e.p[x] = e.p[y] = 0; sc.part[x] = t; sc.part[y] = t; e.o = []; }
        }
      } else if (pa[0] === 'f') { e.o = []; e.kh = -1; }
      else if (pa[0] === 'k') { e.kh = O.jumelle(e, e.o[0]); }
      else if (pa[0] === 'lav') { sc.lav = { id: pa[1], t0: t, fin: t + 1500 }; }
      else if (pa[0] === 'dep' || pa[0] === 'asc') {
        const av = JSON.parse(JSON.stringify(e));
        if (pa[0] === 'dep') {
          const [x, y] = pa[1];
          const a = e.r.findIndex((l) => l.indexOf(x) >= 0), b = e.r.findIndex((l) => l.indexOf(y) >= 0);
          const ia = e.r[a].indexOf(x), ib = e.r[b].indexOf(y);
          e.r[a][ia] = y; e.r[b][ib] = x;
          sc.dep = { ids: [x, y], t0: t };
        } else {
          const [r, dd] = pa[1], l = e.r[r];
          if (dd > 0) l.unshift(l.pop()); else l.push(l.shift());
          sc.asc = { r: r, d: dd, t0: t };
        }
        const p0 = disposition(av), p1 = disposition(e);
        for (let i = 0; i < e.c.length; i++) {
          if (p0[i].x === p1[i].x && p0[i].y === p1[i].y) continue;
          sc.mv[i] = { x0: p0[i].x, y0: p0[i].y, t0: t, d: pa[0] === 'dep' ? 1000 : 750, lev: pa[0] === 'dep', saut: pa[0] === 'asc' && Math.abs(p1[i].x - p0[i].x) > e.W / 2, d0: pa[0] === 'asc' ? pa[1][1] : 1 };
        }
      }
    }
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const dt = Math.min(0.05, tPrecT ? (t - tPrecT) / 1000 : 0.016); tPrecT = t;
      const ecoule = t - debut;
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      if (k >= d.etapes.length + 2) { sc.e = base(); sc.k = {}; sc.mv = {}; sc.part = {}; sc.lav = null; sc.dep = null; sc.asc = null; fait = 0; debut = t; }
      else if (k >= fait && fait < d.etapes.length && dans >= (d.etapes[fait][2] ? 650 : 300)) { appliquer(d.etapes[fait], t); fait++; }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 380);
      dessinerParking(c, sc, g, t, dt, theme());
      if (cle === 'klaxon') klaxonDessin(c, 490, 310, 54);
      // la main pour les gestes du joueur
      const prochaine = fait < d.etapes.length ? d.etapes[fait] : null;
      if (prochaine && prochaine[2]) {
        let cx, cy;
        if (prochaine[0] === 'k') { cx = 517; cy = 337; }
        else {
          const pos = disposition(sc.e)[prochaine[1]];
          cx = g.ox + (pos.x + pos.w / 2) * g.cw; cy = g.oy + (pos.y + 0.55) * g.ch;
        }
        const q = Math.min(1, dans / 550);
        main(c, 470 + (cx - 470) * q, 370 + (cy - 370) * q, 1.5, q >= 1 ? Math.min(1, (dans - 550) / 100) : 0);
      } else if (prochaine && prochaine[0] === 'o') {
        // un robot lève la porte : son visage apparaît au-dessus
        const pos = disposition(sc.e)[prochaine[1]];
        medaillon(c, 1, g.ox + (pos.x + pos.w / 2) * g.cw, g.oy + pos.y * g.ch + 6, 20);
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fin = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fin(); };
    $('voile-tuto').onclick = () => { audio(); fin(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  // Véhicule caché sous le doigt (place entière, au moins 44 px).
  function placeSous(px, py) {
    if (!vue || !geo) return -1;
    const pos = disposition(vue);
    for (let i = 0; i < vue.c.length; i++) {
      const p = pos[i];
      const x = geo.ox + p.x * geo.cw, y = geo.oy + p.y * geo.ch;
      if (px >= x && px < x + p.w * geo.cw && py >= y && py < y + geo.ch) return i;
    }
    return -1;
  }

  function levable(i) { return vue && i >= 0 && vue.p[i] === -1 && vue.o.indexOf(i) < 0; }

  function plusProche(depuis) {
    if (!vue) return -1;
    const pos = disposition(vue);
    const m = depuis >= 0 && pos[depuis] ? [pos[depuis].x + pos[depuis].w / 2, pos[depuis].y] : [0, 0];
    let best = -1, bd = Infinity;
    for (let i = 0; i < vue.c.length; i++) {
      if (!levable(i)) continue;
      const d = Math.hypot(pos[i].x + pos[i].w / 2 - m[0], pos[i].y - m[1]);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  function deplacerCurseur(dx, dy) {
    if (!vue) return;
    if (!levable(curseur)) { curseur = plusProche(curseur); return; }
    const pos = disposition(vue), p = pos[curseur];
    const mx = p.x + p.w / 2, my = p.y;
    let best = -1, bd = Infinity;
    for (let i = 0; i < vue.c.length; i++) {
      if (!levable(i) || i === curseur) continue;
      const vx = pos[i].x + pos[i].w / 2 - mx, vy = pos[i].y - my;
      const avance = vx * dx + vy * dy;
      if (avance <= 0.01) continue;
      const score = avance + Math.abs(vx * dy - vy * dx) * 2.2;
      if (score < bd) { bd = score; best = i; }
    }
    if (best >= 0) { curseur = best; sons.clic(); }
  }

  function lever(i) {
    if (!partie || enPause || attenteTuto) return;
    if (vue && vue.att && partie.monTour()) { fermer(); return; }
    if (i < 0) return;
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (!levable(i)) return;
    if (partie.jouer(i)) survol = -1;
  }

  function klaxonner() {
    if (!klaxonPossible()) { if (vue && partie && partie.monTour() && vue.o.length === 0 && (vue.kl[partie.siege] || 0) > 0) toast(tr('klaxon.avant'), 1800); return; }
    partie.jouer('k');
  }

  const plateau = $('plateau');
  let appui = null;
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  plateau.addEventListener('pointerdown', (ev) => {
    audio();
    clavier = false;
    const p = point(ev);
    appui = { x: p[0], y: p[1] };
    survol = placeSous(p[0], p[1]);
  });
  plateau.addEventListener('pointermove', (ev) => {
    const p = point(ev);
    if (appui || ev.pointerType === 'mouse') survol = placeSous(p[0], p[1]);
  });
  plateau.addEventListener('pointerup', (ev) => {
    const p = point(ev);
    const i = placeSous(p[0], p[1]);
    appui = null;
    if (ev.pointerType !== 'mouse') survol = -1;
    lever(i);
  });
  plateau.addEventListener('pointercancel', () => { appui = null; survol = -1; });
  plateau.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') survol = -1; });

  document.addEventListener('keydown', (ev) => {
    if (ecran === 'garage' && ev.code === 'Escape') { afficherEcran('titre'); return; }
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    if (ev.code === 'KeyK') { ev.preventDefault(); audio(); klaxonner(); return; }
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) {
      ev.preventDefault(); audio();
      if (!clavier) { clavier = true; if (!levable(curseur)) { curseur = plusProche(-1); return; } }
      deplacerCurseur(dirs[ev.code][0], dirs[ev.code][1]);
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (vue && vue.att) { lever(-1); return; }
      if (!clavier || !levable(curseur)) { clavier = true; curseur = plusProche(curseur); return; }
      lever(curseur);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-garage').addEventListener('click', () => { audio(); sons.clic(); ouvrirGarage(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('garage-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-klaxon').addEventListener('click', () => { audio(); klaxonner(); });
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'titre') dessinerTitre(); if (ecran === 'garage') dessinerGarage(); });

  // L'écran titre s'anime doucement (route, étincelles).
  (function animerTitre() {
    if (ecran === 'titre') dessinerTitre();
    setTimeout(() => requestAnimationFrame(animerTitre), 80);
  })();

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
})();
</script>
</body>
</html>
