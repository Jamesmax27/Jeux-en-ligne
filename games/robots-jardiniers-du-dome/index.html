  function allerCollection() {
    montrer('collection');
    $('collection-total').innerHTML = SVG_ETOILE(true);
    $('collection-total').append(document.createTextNode(nb(totalEtoiles())));
    const gc = $('grille-couleurs'); gc.innerHTML = '';
    COULEURS.forEach((co, i) => {
      const ouvert = couleurOuverte(i);
      const b = document.createElement('button'); b.type = 'button';
      b.className = 'choix' + (PROG.couleur === i ? ' choisi' : '') + (ouvert ? '' : ' ferme');
      const cnv = document.createElement('canvas');
      const nom = document.createElement('span'); nom.textContent = t(co.cle);
      b.append(cnv, nom);
      if (!ouvert) { const c = document.createElement('span'); c.className = 'cond'; c.textContent = t('collection.condEtoiles', { n: co.etoiles }); b.append(c); b.setAttribute('aria-disabled', 'true'); }
      b.setAttribute('aria-pressed', String(PROG.couleur === i));
      b.addEventListener('click', () => {
        if (!ouvert) { son('erreur'); return; }
        PROG.couleur = i; sauverProg(); son('poser'); allerCollection();
      });
      gc.append(b);
      requestAnimationFrame(() => icone(cnv, 'aspi', co.c === 'arc' ? 'hsl(300,85%,68%)' : co.c));
    });
    const gf = $('grille-fleurs'); gf.innerHTML = '';
    FLEURS.forEach((fl, i) => {
      const ouvert = fleurOuverte(i);
      const b = document.createElement('button'); b.type = 'button';
      b.className = 'choix' + (PROG.fleur === i ? ' choisi' : '') + (ouvert ? '' : ' ferme');
      const cnv = document.createElement('canvas');
      const nom = document.createElement('span'); nom.textContent = t(fl.cle);
      b.append(cnv, nom);
      if (!ouvert) { const c = document.createElement('span'); c.className = 'cond'; c.textContent = t('collection.condNiveau', { n: fl.niveau }); b.append(c); b.setAttribute('aria-disabled', 'true'); }
      b.setAttribute('aria-pressed', String(PROG.fleur === i));
      b.addEventListener('click', () => {
        if (!ouvert) { son('erreur'); return; }
        PROG.fleur = i; sauverProg(); son('poser'); allerCollection();
      });
      gf.append(b);
      requestAnimationFrame(() => {
        cnv.width = 112; cnv.height = 112;
        const c = cnv.getContext('2d');
        dessinerFleur(c, 56, 64, 150, i, ouvert, 1, 0, 0.6);
      });
    });
  }

  // ---------------------------------------------------------------------------
  // DÉROULEMENT D'UN NIVEAU
  // ---------------------------------------------------------------------------
  function lancerNiveau(n) {
    n = clamp(n, 0, NIVEAUX.length - 1);
    S.demo = false; S.n = n; S.mult = 1 + 0.07 * n;
    montrer('jeu');
    preparerCarte(NIVEAUX[n]);
    S.energie = NIVEAUX[n].energie;
    S.vague = 0; S.phase = 'prep'; S.compteActif = false; S.compte = COMPTE_VAGUE; S.file = [];
    S.score = 0; S.gouttes = 0; S.bonus = 0; S.fin = false; S.pause = false;
    $('voile-fin').hidden = true; $('voile-pause').hidden = true;
    miseEnPage();
    majHud(); majPanneau();
    // Cartes des nouveautés (une seule fois par nouveauté).
    const aMontrer = (NIVEAUX[n].nouveautes || []).filter((cle) => !PROG.vus[cle]);
    if (aMontrer.length) montrerNouveautes(aMontrer);
    else toast(t('toast.debut', { n: n + 1 }));
  }

  function etoilesPour(fleurs) { return fleurs >= FLEURS_MAX ? 3 : fleurs >= 7 ? 2 : fleurs >= 1 ? 1 : 0; }

  function victoire() {
    if (S.fin) return;
    S.fin = true; S.phase = 'fini';
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: S.n + 1 });
    const fl = fleursIntactes();
    const etoiles = etoilesPour(fl);
    S.score = S.gouttes + fl * 30;
    const avantEtoiles = totalEtoiles();
    const couleursAvant = COULEURS.map((c, i) => couleurOuverte(i));
    const fleursAvant = FLEURS.map((f, i) => fleurOuverte(i));
    const record = S.score > PROG.records[S.n];
    const ancienRecord = PROG.records[S.n];
    if (record) PROG.records[S.n] = S.score;
    if (etoiles > PROG.etoiles[S.n]) PROG.etoiles[S.n] = etoiles;
    // Sauvegarde : on reprendra au niveau suivant.
    try { localStorage.setItem(CLE_LOCALE, JSON.stringify(PROG)); } catch (e) { /* stockage refusé */ }
    JEL_SAVE.save(JEU, { niveau: Math.min(S.n + 2, NIVEAUX.length), score: totalScore(), options: { prog: copieProg() } });
    // Jeu terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
    if (PROG.etoiles.every((e) => e > 0)) {
      if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
    }
    const deblocages = [];
    COULEURS.forEach((c, i) => { if (!couleursAvant[i] && couleurOuverte(i)) deblocages.push(t('fin.nouvelleCouleur', { nom: t(c.cle) })); });
    FLEURS.forEach((f, i) => { if (!fleursAvant[i] && fleurOuverte(i)) deblocages.push(t('fin.nouvelleFleur', { nom: t(f.cle) })); });
    son('victoire');
    confettis();
    setTimeout(() => afficherFin(true, { etoiles, fl, record, ancienRecord, deblocages, gagnees: totalEtoiles() - avantEtoiles }), 700);
    majPanneau();
  }

  function defaite() {
    if (S.fin) return;
    S.fin = true; S.phase = 'fini';
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: S.n + 1 });
    S.score = S.gouttes;
    son('defaite');
    setTimeout(() => afficherFin(false, {}), 700);
    majPanneau();
  }

  function confettis() {
    if (reduire) return;
    const couleurs = ['#ffd166', '#5ff2d0', '#ff9ad5', '#b49cff', '#9fd8ff', '#ff8c7a'];
    for (let i = 0; i < 90; i++) {
      particules.push({ x: L.W / 2 + (Math.random() - 0.5) * 80, y: L.H * 0.4, vx: (Math.random() - 0.5) * 420, vy: -150 - Math.random() * 300, vie: 0, max: 1.6 + Math.random(), coul: couleurs[i % couleurs.length], taille: 6 + Math.random() * 5, forme: 'confetti', rot: Math.random() * 6 });
    }
  }

  let minuteurScore = 0;
  function afficherFin(gagne, d) {
    const v = $('voile-fin');
    v.hidden = false;
    $('fin-titre').textContent = t(gagne ? (S.n === NIVEAUX.length - 1 ? 'fin.domeSauve' : 'fin.victoire') : 'fin.defaite');
    const et = $('fin-etoiles'); et.innerHTML = '';
    et.hidden = !gagne;
    if (gagne) {
      for (let i = 0; i < 3; i++) {
        et.insertAdjacentHTML('beforeend', SVG_ETOILE(true));
        if (i < d.etoiles) setTimeout(() => { et.children[i].classList.add('gagnee'); son('etoile'); }, 250 + i * 330);
      }
      et.setAttribute('aria-label', t('fin.etoilesAria', { n: d.etoiles }));
    }
    // Score qui défile.
    const sc = $('fin-score');
    let affiche = 0; clearInterval(minuteurScore);
    minuteurScore = setInterval(() => {
      affiche = Math.min(S.score, affiche + Math.max(1, Math.ceil(S.score / 30)));
      sc.textContent = t('fin.score', { n: affiche });
      if (affiche >= S.score) clearInterval(minuteurScore);
    }, 30);
    sc.textContent = t('fin.score', { n: 0 });
    const rec = $('fin-record');
    rec.classList.remove('battu');
    if (gagne) {
      $('fin-detail').textContent = t('fin.fleurs', { n: d.fl, total: FLEURS_MAX }) + (S.bonus ? ' · ' + t('fin.bonus', { n: S.bonus }) : '');
      if (d.record) { rec.textContent = d.ancienRecord ? t('fin.recordBattu') : t('fin.premierRecord'); rec.classList.add('battu'); }
      else rec.textContent = t('fin.meilleur', { n: PROG.records[S.n] });
    } else {
      $('fin-detail').textContent = t('fin.vagues', { n: S.vague, total: S.niv.vagues.length });
      rec.textContent = PROG.records[S.n] ? t('fin.meilleur', { n: PROG.records[S.n] }) : t('fin.encouragement');
    }
    const deb = $('fin-debloque');
    deb.hidden = !(gagne && d.deblocages && d.deblocages.length);
    if (!deb.hidden) deb.textContent = d.deblocages.join(' · ');
    const cons = $('fin-conseil');
    cons.hidden = gagne && S.n !== NIVEAUX.length - 1;
    if (!gagne) cons.textContent = t('conseil.' + (1 + Math.floor(Math.random() * 6)));
    else if (S.n === NIVEAUX.length - 1) cons.textContent = t('fin.bilan', { n: totalEtoiles(), total: NIVEAUX.length * 3 });
    const bo = $('fin-boutons'); bo.innerHTML = '';
    const ajouter = (cle, classe, action) => { const b = bouton('bouton ' + classe, t(cle), () => { son('toucher'); action(); }); bo.append(b); return b; };
    let premier;
    if (gagne) {
      if (S.n < NIVEAUX.length - 1) premier = ajouter('bouton.suivant', 'principal', () => lancerNiveau(S.n + 1));
      const r = ajouter('bouton.rejouer', premier ? '' : 'principal', () => lancerNiveau(S.n));
      premier = premier || r;
      ajouter('bouton.niveaux', '', allerNiveaux);
    } else {
      premier = ajouter('bouton.reessayer', 'principal', () => lancerNiveau(S.n));
      ajouter('bouton.niveaux', '', allerNiveaux);
      ajouter('bouton.accueil', '', allerTitre);
    }
    setTimeout(() => { try { premier.focus(); } catch (e) { /* rien */ } }, 50);
  }

  // ---------------------------------------------------------------------------
  // PAUSE
  // ---------------------------------------------------------------------------
  function ouvrirPause() {
    if (S.ecran !== 'jeu' || S.fin || S.pause) return;
    S.pause = true;
    $('voile-pause').hidden = false;
    $('pause-niveau').textContent = t('pause.niveau', { n: S.n + 1, secteur: t(SECTEURS[S.niv.s].cle) });
    $('b-astuce').hidden = !(S.niv.nouveautes && S.niv.nouveautes.length);
    setTimeout(() => { try { $('b-reprendre').focus(); } catch (e) { /* rien */ } }, 30);
  }
  function fermerPause() { S.pause = false; $('voile-pause').hidden = true; }

  // ---------------------------------------------------------------------------
  // NOUVEAUTÉS : cartes avec une petite scène animée
  // ---------------------------------------------------------------------------
  let fileCartes = [], carteCle = null, carteT = 0;
  function montrerNouveautes(cles) {
    fileCartes = cles.slice();
    S.carte = true;
    carteSuivante();
  }
  function carteSuivante() {
    const cle = fileCartes.shift();
    if (!cle) {
      S.carte = false; $('voile-nouveaute').hidden = true;
      toast(t('toast.debut', { n: S.n + 1 }));
      return;
    }
    carteCle = cle; carteT = 0;
    PROG.vus[cle] = 1; sauverProg();
    $('voile-nouveaute').hidden = false;
    $('nv-titre').textContent = t('nv.' + cle + '.titre');
    $('nv-texte').textContent = t('nv.' + cle + '.texte');
    $('nv-astuce').textContent = t('nv.' + cle + '.astuce');
    const ol = $('nv-etapes');
    ol.hidden = cle !== 'tuto';
    if (cle === 'tuto') {
      ol.innerHTML = '';
      ['nv.tuto.e1', 'nv.tuto.e2', 'nv.tuto.e3'].forEach((c) => { const li = document.createElement('li'); li.textContent = t(c); ol.append(li); });
    }
    $('nv-ok').textContent = t(fileCartes.length ? 'bouton.suite' : 'bouton.compris');
    setTimeout(() => { try { $('nv-ok').focus(); } catch (e) { /* rien */ } }, 30);
  }

  // Petite scène : une allée horizontale, un socle, des moutons qui roulent.
  const demoCnv = $('nv-demo');
  const dctx = demoCnv.getContext('2d');
  function dessinerCarte(dt) {
    if (!S.carte || !carteCle) return;
    carteT += dt;
    const c = dctx, W = 640, H = 320;
    c.setTransform(1, 0, 0, 1, 0, 0);
    const sec = SECTEURS[S.niv ? S.niv.s : 0];
    c.fillStyle = sec.sol2; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 8; i++) for (let j = 0; j < 4; j++) { if ((i + j) % 2) { c.fillStyle = sec.sol; c.fillRect(i * 80, j * 80, 80, 80); } }
    const k = 80, yA = 120;
    const allee = (pts) => {
      c.lineCap = 'round'; c.lineJoin = 'round';
      c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
      c.strokeStyle = sec.bord; c.lineWidth = k * 0.78; c.stroke();
      c.strokeStyle = sec.allee; c.lineWidth = k * 0.62; c.stroke();
    };
    const socle = (x, y) => { c.fillStyle = '#b8c4d6'; c.beginPath(); c.arc(x, y, k * 0.36, 0, TAU); c.fill(); c.strokeStyle = sec.reflet; c.lineWidth = 2; c.beginPath(); c.arc(x, y, k * 0.27, 0, TAU); c.stroke(); };
    const mouton = (type, x, y, extra) => dessinerMouton(c, x, y, MOUTONS[type].r * k, Object.assign({ type, rot: x / 20, mouille: 0, bulle: 0, touche: 0, bouclier: 0, nait: 0, dx: 1, dy: 0 }, extra || {}), carteT);
    const robot = (id, x, y, extra) => dessinerRobot(c, x, y, k, id, (extra && extra.niv) || 1, couleurRobot(carteT), (extra && extra.angle) || -Math.PI / 2, carteT, (extra && extra.actif) || 0, 0);
    const cle = carteCle;
    const T = carteT;

    if (cle === 'tuto') {
      const cyc = T % 7;
      allee([[-40, yA], [W + 40, yA]]);
      socle(320, 230);
      const pose = cyc > 2.6;
      if (pose) robot('aspi', 320, 230, { angle: -Math.PI / 2 });
      if (cyc > 3.2) {
        for (let i = 0; i < 3; i++) {
          const x = ((cyc - 3.2) * 150 - i * 110);
          if (x < -30) continue;
          const pres = Math.abs(x - 320) < 110;
          const fin = x > 330;
          if (!fin) mouton('p', x, yA, { touche: pres ? 0.05 : 0 });
          if (pres && !fin) { c.strokeStyle = 'rgba(200,240,255,.8)'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, yA); c.lineTo(320, 200); c.stroke(); }
          if (fin && x < 380) { c.fillStyle = '#fff6b0'; dessinerEtoile(c, 330, yA, 10, '#fff6b0'); }
        }
      }
      // Bouton du robot (en bas à droite) et bouton de vague.
      rrect(c, 470, 245, 70, 62, 12); c.fillStyle = '#e9f6ff'; c.fill();
      dessinerRobot(c, 505, 275, 52, 'aspi', 1, couleurRobot(T), -Math.PI / 4, T, 0, 0);
      rrect(c, 40, 250, 170, 54, 14); c.fillStyle = '#2fc4a8'; c.fill();
      dessinerGoutte(c, 125, 280, 9, '#e9fffa');
      let hx, hy, appui;
      if (cyc < 1.3) { hx = lerp(560, 320, cyc / 1.3); hy = lerp(300, 232, cyc / 1.3); appui = false; }
      else if (cyc < 1.8) { hx = 320; hy = 232; appui = true; }
      else if (cyc < 2.3) { hx = lerp(320, 505, (cyc - 1.8) / 0.5); hy = lerp(232, 280, (cyc - 1.8) / 0.5); appui = false; }
      else if (cyc < 2.8) { hx = 505; hy = 280; appui = true; }
      else if (cyc < 3.3) { hx = lerp(505, 125, (cyc - 2.8) / 0.5); hy = 282; appui = false; }
      else if (cyc < 3.8) { hx = 125; hy = 282; appui = true; }
      else { hx = 125; hy = 300; appui = false; }
      if (cyc > 1.3 && cyc < 2.8) { c.strokeStyle = '#ffe27a'; c.lineWidth = 4; c.beginPath(); c.arc(320, 230, 34, 0, TAU); c.stroke(); }
      dessinerMain(c, hx, hy, 60, appui);
      const etape = cyc < 1.8 ? 0 : cyc < 2.8 ? 1 : 2;
      $('nv-etapes').querySelectorAll('li').forEach((li, i) => li.classList.toggle('active', i === etape));
      return;
    }
    if (cle === 'bonus') {
      allee([[-40, yA], [W + 40, yA]]);
      const cyc = T % 4;
      rrect(c, 170, 220, 300, 70, 16); c.fillStyle = '#2fc4a8'; c.fill();
      c.fillStyle = 'rgba(255,255,255,.35)'; rrect(c, 190, 268, 260 * Math.max(0, 1 - cyc / 3), 12, 6); c.fill();
      dessinerGoutte(c, 320, 248, 11, '#e9fffa');
      const appui = cyc > 1.5 && cyc < 2;
      dessinerMain(c, 330, 262 + (appui ? 0 : 8), 60, appui);
      if (cyc > 1.6) for (let i = 0; i < 6; i++) { const q = clamp((cyc - 1.6 - i * 0.08) / 1, 0, 1); dessinerGoutte(c, lerp(320, 60 + i * 20, q), lerp(250, 40, q), 8, '#5ff2d0'); }
      for (let i = 0; i < 3; i++) mouton('p', ((T * 70 + i * 160) % (W + 80)) - 40, yA);
      return;
    }
    if (cle === 'rapide') {
      allee([[-40, yA + 20], [W + 40, yA + 20]]);
      mouton('p', ((T * 60) % (W + 80)) - 40, yA + 20);
      mouton('r', ((T * 170 + 200) % (W + 80)) - 40, yA + 20);
      socle(200, 250); socle(440, 250); robot('aspi', 200, 250); robot('aspi', 440, 250);
      return;
    }
    if (cle === 'troisAllees') {
      allee([[-40, 50], [W + 40, 50]]); allee([[-40, 160], [W + 40, 160]]); allee([[-40, 270], [W + 40, 270]]);
      [50, 160, 270].forEach((y, i) => mouton(['p', 'r', 'l'][i], ((T * (60 + i * 30) + i * 200) % (W + 80)) - 40, y));
      socle(320, 105); robot('aspi', 320, 105, { angle: -Math.PI / 2 });
      socle(480, 215); robot('arroseur', 480, 215, { actif: 0.5 });
      return;
    }
    if (cle === 'deuxAllees' || cle === 'croise') {
      if (cle === 'deuxAllees') { allee([[-40, 70], [W + 40, 70]]); allee([[-40, 230], [W + 40, 230]]); }
      else { allee([[-40, 160], [W + 40, 160]]); allee([[320, -40], [320, H + 40]]); }
      if (cle === 'deuxAllees') {
        mouton('p', ((T * 80) % (W + 80)) - 40, 70); mouton('p', ((T * 80 + 300) % (W + 80)) - 40, 230);
        socle(320, 150); robot('aspi', 320, 150);
      } else {
        mouton('p', ((T * 80) % (W + 80)) - 40, 160);
        dessinerMouton(c, 320, ((T * 80 + 150) % (H + 80)) - 40, MOUTONS.p.r * k, { type: 'p', rot: T * 3, mouille: 0, bulle: 0, touche: 0, bouclier: 0, nait: 0, dx: 0, dy: 1 }, T);
        socle(400, 80); robot('aspi', 400, 80, { angle: Math.PI * 0.75 });
        c.strokeStyle = 'rgba(255,226,122,.8)'; c.lineWidth = 3; c.beginPath(); c.arc(400, 80, 1.6 * k, 0, TAU); c.stroke();
      }
      return;
    }
    if (cle === 'gros' || cle === 'roi') {
      allee([[-40, yA], [W + 40, yA]]);
      socle(320, 240); robot('aspi', 320, 240);
      const cyc = T % 5;
      const grand = cle === 'roi' ? 'R' : 'g', petit = cle === 'roi' ? 'g' : 'p';
      if (cyc < 2.5) {
        const x = 40 + cyc * 110;
        mouton(grand, x, yA, { touche: cyc > 1.2 ? 0.05 : 0, pv: 1 - cyc / 2.5, pvMax: 1 });
        if (cyc > 1.2) { c.strokeStyle = 'rgba(200,240,255,.8)'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, yA); c.lineTo(320, 212); c.stroke(); }
      } else {
        const q = cyc - 2.5;
        if (q < 0.3) for (let i = 0; i < 8; i++) { const a = i * TAU / 8; c.fillStyle = '#c9cdd6'; c.beginPath(); c.arc(315 + Math.cos(a) * q * 200, yA + Math.sin(a) * q * 200, 6, 0, TAU); c.fill(); }
        mouton(petit, 315 + q * 90, yA - 26 - Math.min(q, 0.3) * 30); mouton(petit, 315 + q * 90 - 30, yA + 22);
      }
      return;
    }
    if (cle === 'nouvelleAllee') {
      allee([[-40, 80], [W + 40, 80]]);
      c.globalAlpha = T % 4 < 1.5 ? 0.45 : 1; allee([[-40, 240], [W + 40, 240]]); c.globalAlpha = 1;
      if (T % 4 < 1.5) { rrect(c, 60, 210, 30, 60, 6); c.fillStyle = '#ff6b6b'; c.fill(); }
      else mouton('p', ((T % 4 - 1.5) * 200) - 20, 240);
      mouton('p', ((T * 80) % (W + 80)) - 40, 80);
      return;
    }
    if (cle === 'deplacer') {
      allee([[-40, yA], [W + 40, yA]]);
      socle(160, 240); socle(480, 240);
      const cyc = T % 4;
      let x;
      if (cyc < 1) x = 160; else if (cyc < 2.5) x = lerp(160, 480, (cyc - 1) / 1.5); else x = 480;
      robot('aspi', x, 240 - (cyc > 1 && cyc < 2.5 ? 12 : 0));
      dessinerMain(c, x + 4, 246, 60, cyc > 0.6 && cyc < 2.6);
      return;
    }
    if (cle === 'ameliorer') {
      allee([[-40, yA], [W + 40, yA]]);
      socle(320, 240);
      const niv = 1 + Math.floor((T % 4.5) / 1.5);
      const p = ROBOT.aspi.portee[niv - 1] * k * 0.8;
      c.fillStyle = 'rgba(255,226,122,.12)'; c.strokeStyle = 'rgba(255,226,122,.75)'; c.lineWidth = 2;
      c.beginPath(); c.arc(320, 240, p, 0, TAU); c.fill(); c.stroke();
      robot('aspi', 320, 240, { niv });
      dessinerMain(c, 330, 252, 60, (T % 1.5) > 1.1);
      if ((T % 1.5) > 1.1) for (let i = 0; i < 6; i++) dessinerEtoile(c, 320 + Math.cos(i + T * 4) * 50, 230 + Math.sin(i + T * 4) * 40, 7, '#ffe27a');
      return;
    }
    if (cle === 'solaire') {
      const nuit = (T % 6) > 3.5;
      allee([[-40, yA], [W + 40, yA]]);
      socle(320, 240); robot('solaire', 320, 240, { actif: nuit ? 0 : ((T % 1) < 0.5 ? 0.4 : 0) });
      if (!nuit) for (let i = 0; i < 3; i++) { const q = ((T * 0.8 + i / 3) % 1); dessinerGoutte(c, 320 + (i - 1) * 30, 220 - q * 150, 8, 'rgba(255,226,122,' + (1 - q) + ')'); }
      if (nuit) { c.fillStyle = 'rgba(4,8,36,.55)'; c.fillRect(0, 0, W, H); c.fillStyle = '#cfe0ff'; c.beginPath(); c.arc(560, 60, 26, 0, TAU); c.fill(); c.fillStyle = 'rgba(4,8,36,1)'; c.beginPath(); c.arc(572, 52, 22, 0, TAU); c.fill(); }
      else { c.fillStyle = '#ffd166'; c.beginPath(); c.arc(560, 60, 24, 0, TAU); c.fill(); }
      mouton('p', ((T * 70) % (W + 80)) - 40, yA);
      return;
    }
    if (cle === 'laineux') {
      allee([[-40, yA], [W + 40, yA]]);
      socle(200, 240); socle(440, 240);
      robot('arroseur', 200, 240, { actif: 0.5 }); robot('aspi', 440, 240);
      const x = ((T * 80) % (W + 80)) - 40;
      const mouille = x > 150;
      mouton('l', x, yA, { mouille: mouille ? 1 : 0, bouclier: x < 150 && x > 60 ? 0.2 : 0 });
      if (x > 150 && x < 260) for (let i = 0; i < 5; i++) dessinerGoutte(c, 200 + Math.cos(T * 3 + i) * 60, 200 + Math.sin(T * 3 + i) * 50, 4, '#9fd8ff');
      if (x > 360 && x < 520) { c.strokeStyle = 'rgba(200,240,255,.8)'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, yA); c.lineTo(440, 212); c.stroke(); }
      return;
    }
    if (cle === 'finale') {
      allee([[-40, 70], [W + 40, 70]]); allee([[-40, 240], [W + 40, 240]]);
      mouton('R', ((T * 40) % (W + 120)) - 60, 70);
      mouton('l', ((T * 60 + 200) % (W + 80)) - 40, 240); mouton('r', ((T * 150 + 400) % (W + 80)) - 40, 240);
      socle(320, 155); robot('bulles', 320, 155, { angle: -Math.PI / 2 });
      return;
    }
    // Robots : arroseur, ventilateur, brosse, bulles.
    allee([[-40, yA], [W + 40, yA]]);
    socle(320, 240);
    const x = ((T * 90) % (W + 80)) - 40;
    const pres = Math.abs(x - 320) < 140;
    if (cle === 'arroseur') {
      robot('arroseur', 320, 240, { actif: pres ? 0.5 : 0 });
      mouton('p', pres ? 180 + (x - 180) * 0.6 : x, yA, { mouille: pres || x > 460 ? 1 : 0 });
      if (pres) for (let i = 0; i < 10; i++) dessinerGoutte(c, 320 + Math.cos(T * 3 + i * 0.6) * 110, 200 + Math.sin(T * 3 + i * 0.6) * 70, 4, '#9fd8ff');
    } else if (cle === 'ventilo') {
      const cyc = T % 4;
      let mx = 40 + cyc * 140;
      if (cyc > 2) { mx = lerp(320, 40, Math.min(1, (cyc - 2) * 2)); c.strokeStyle = 'rgba(230,245,255,.8)'; c.lineWidth = 3; for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(320, 215); c.quadraticCurveTo(260, yA + i * 20, mx + 40, yA + i * 15); c.stroke(); } }
      robot('ventilo', 320, 240, { actif: cyc > 2 ? 0.6 : 0, angle: -Math.PI / 2 - 0.5 });
      mouton('p', mx, yA, { dx: cyc > 2 ? -1 : 1 });
    } else if (cle === 'brosse') {
      robot('brosse', 320, 200, { actif: 0.6 });
      mouton('p', x, 80); mouton('p', W - x, 290, { dx: -1, touche: Math.abs(W - x - 320) < 120 ? 0.05 : 0 });
      c.strokeStyle = 'rgba(255,209,102,.7)'; c.lineWidth = 3; c.setLineDash([10, 10]); c.beginPath(); c.arc(320, 200, 105, T * 4, T * 4 + TAU); c.stroke(); c.setLineDash([]);
    } else if (cle === 'bulles') {
      robot('bulles', 320, 240, { actif: 0.4, angle: -Math.PI / 2 });
      const cyc = T % 4;
      const bx = cyc < 1.5 ? 40 + cyc * 120 : 220;
      mouton('p', cyc > 3 ? 220 + (cyc - 3) * 200 : bx, yA, { bulle: cyc > 1.5 && cyc < 3 ? 1 : 0 });
      if (cyc > 1.2 && cyc < 1.5) { const q = (cyc - 1.2) / 0.3; c.strokeStyle = '#e6faff'; c.lineWidth = 2; c.beginPath(); c.arc(lerp(330, 220, q), lerp(200, yA, q), 12, 0, TAU); c.stroke(); }
    }
  }

  // ---------------------------------------------------------------------------
  // COMMANDES : doigt, souris, clavier
  // ---------------------------------------------------------------------------
  canvas.addEventListener('pointerdown', (e) => {
    if (S.ecran !== 'jeu' || S.pause || S.fin || S.carte) return;
    clavierActif = false;
    const x = (e.clientX - L.ox) / L.cell, y = (e.clientY - L.oy) / L.cell;
    let trouve = -1, mieux = 0.62;
    S.socles.forEach((so, i) => { const d = Math.hypot(so.x - x, so.y - y); if (d < mieux) { mieux = d; trouve = i; } });
    if (trouve >= 0) selectionner(trouve);
    else if (S.selection >= 0 || S.deplace >= 0) deselectionner();
  });

  // Flèches : aller au socle le plus proche dans cette direction.
  function deplacerCurseur(dx, dy) {
    if (!S.socles.length) return;
    clavierActif = true;
    const depart = S.curseur >= 0 ? S.socles[S.curseur] : null;
    if (!depart) { S.curseur = socleConseille(); }
    else {
      let meilleur = -1, score = 1e9;
      S.socles.forEach((so, i) => {
        if (i === S.curseur) return;
        const vx = so.x - depart.x, vy = so.y - depart.y;
        const avance = vx * dx + vy * dy;
        if (avance <= 0.1) return;
        const cote = Math.abs(vx * dy - vy * dx);
        const s = avance + cote * 2;
        if (s < score) { score = s; meilleur = i; }
      });
      if (meilleur >= 0) S.curseur = meilleur;
    }
    son('toucher');
    if (S.deplace < 0) { S.selection = S.curseur; majPanneau(); }
  }

  document.addEventListener('keydown', (e) => {
    const cible = e.target;
    const surBouton = cible && cible.tagName === 'BUTTON';
    if (S.carte && !$('voile-nouveaute').hidden) {
      if ((e.key === 'Enter' || e.key === ' ') && !surBouton) { e.preventDefault(); $('nv-ok').click(); }
      return;
    }
    if (S.ecran === 'titre') {
      if ((e.key === 'Enter' || e.key === ' ') && !surBouton && !document.querySelector('jel-sauvegarde')) { e.preventDefault(); $('b-jouer').click(); }
      return;
    }
    if (S.ecran !== 'jeu') {
      if (e.key === 'Escape') { e.preventDefault(); allerTitre(); }
      return;
    }
    if (S.fin) return;
    if (S.pause) {
      if (e.key === 'Escape' || (e.key || '').toLowerCase() === 'p') { e.preventDefault(); fermerPause(); }
      return;
    }
    const k = e.code;
    // Lettres : celle écrite sur la touche (AZERTY, QWERTY, QWERTZ).
    const lettre = (e.key || '').length === 1 ? e.key.toLowerCase() : '';
    if (lettre === 'p') { e.preventDefault(); ouvrirPause(); return; }
    if (e.key === 'Escape') {
      e.preventDefault();
      if (S.selection >= 0 || S.deplace >= 0) deselectionner(); else ouvrirPause();
      return;
    }
    if (k === 'ArrowLeft') { e.preventDefault(); deplacerCurseur(-1, 0); return; }
    if (k === 'ArrowRight') { e.preventDefault(); deplacerCurseur(1, 0); return; }
    if (k === 'ArrowUp') { e.preventDefault(); deplacerCurseur(0, -1); return; }
    if (k === 'ArrowDown') { e.preventDefault(); deplacerCurseur(0, 1); return; }
    if (/^(Digit|Numpad)[1-6]$/.test(k)) {
      const def = robotsDuNiveau()[Number(k.slice(-1)) - 1];
      if (def && S.selection >= 0 && !S.socles[S.selection].robot) { e.preventDefault(); poser(def); }
      return;
    }
    if (lettre === 'a' && S.selection >= 0 && S.socles[S.selection].robot) { e.preventDefault(); ameliorer(S.socles[S.selection]); return; }
    if (lettre === 'd' && S.selection >= 0 && S.socles[S.selection].robot) { e.preventDefault(); commencerDeplacement(); return; }
    if (lettre === 'r' && S.selection >= 0 && S.socles[S.selection].robot) { e.preventDefault(); recycler(S.socles[S.selection]); return; }
    if (lettre === 'v') { e.preventDefault(); basculerVitesse(); return; }
    if (e.key === 'Enter' || e.key === ' ') {
      if (surBouton) return;
      e.preventDefault();
      if (S.deplace >= 0 && S.curseur >= 0) { selectionner(S.curseur); return; }
      if (S.phase === 'prep') { deselectionner(); lancerVague(false); }
    }
  });

  function basculerVitesse() { S.vitesse = S.vitesse > 1 ? 1 : 2; son('toucher'); majHud(); toast(t(S.vitesse > 1 ? 'toast.rapide' : 'toast.normal')); }

  // Boutons fixes.
  const clic = (id, f) => $(id).addEventListener('click', (e) => { e.stopPropagation(); f(); });
  clic('b-jouer', () => {
    son('toucher');
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => lancerNiveau(clamp((Number(d.niveau) || 1) - 1, 0, NIVEAUX.length - 1)),
      onNouvelle: () => lancerNiveau(0),
      onEffacer: () => { if (effacerTitre && effacerTitre.maj) effacerTitre.maj(); lancerNiveau(0); },
    });
  });
  clic('b-niveaux', () => { son('toucher'); allerNiveaux(); });
  clic('b-collection', () => { son('toucher'); allerCollection(); });
  clic('b-niveaux-retour', () => { son('toucher'); allerTitre(); });
  clic('b-collection-retour', () => { son('toucher'); allerTitre(); });
  clic('b-son-titre', basculerSon);
  clic('b-son-jeu', basculerSon);
  clic('b-son-pause', basculerSon);
  clic('b-pause', () => { son('toucher'); ouvrirPause(); });
  clic('b-vitesse', basculerVitesse);
  clic('b-reprendre', () => { son('toucher'); fermerPause(); });
  clic('b-recommencer', () => { son('toucher'); fermerPause(); lancerNiveau(S.n); });
  clic('b-astuce', () => { son('toucher'); fermerPause(); montrerNouveautes(S.niv.nouveautes); });
  clic('b-pause-niveaux', () => { son('toucher'); allerNiveaux(); });
  clic('b-pause-accueil', () => { son('toucher'); allerTitre(); });
  clic('nv-ok', () => { son('toucher'); carteSuivante(); });
  $('voile-nouveaute').addEventListener('click', (e) => { if (e.target === $('voile-nouveaute')) { son('toucher'); carteSuivante(); } });

  // Pause automatique quand l'écran est caché.
  document.addEventListener('visibilitychange', () => { if (document.hidden) ouvrirPause(); });

  // Sauvegarde à la fermeture, seulement pendant une partie.
  JEL_SAVE.surFermeture(() => {
    if (S.ecran !== 'jeu' || S.demo) return;
    try { localStorage.setItem(CLE_LOCALE, JSON.stringify(PROG)); } catch (e) { /* stockage refusé */ }
    const niveau = S.fin && S.phase === 'fini' && PROG.etoiles[S.n] && fleursIntactes() > 0 ? Math.min(S.n + 2, NIVEAUX.length) : S.n + 1;
    JEL_SAVE.save(JEU, { niveau, score: totalScore(), options: { prog: copieProg() } });
  });

  window.addEventListener('resize', () => { miseEnPage(); });

  // ---------------------------------------------------------------------------
  // BOUCLE
  // ---------------------------------------------------------------------------
  let dernier = performance.now();
  function boucle(now) {
    const dt = Math.min(0.05, Math.max(0, (now - dernier) / 1000));
    dernier = now;
    const fige = S.pause || (S.ecran === 'jeu' && S.carte);
    if (!fige) {
      if (S.ecran === 'jeu' && !S.demo) { if (!S.fin) maj(dt * S.vitesse); }
      else maj(dt);
      majParticules(dt);
    }
    if (S.carte) dessinerCarte(dt);
    try { dessiner(now / 1000); } catch (e) { setTimeout(() => { throw e; }); return; }
    requestAnimationFrame(boucle);
  }

  // ---------------------------------------------------------------------------
  // DÉMARRAGE
  // ---------------------------------------------------------------------------
  document.title = t('titre');
  chargerProg();
  majSon();
  let effacerTitre = null;
  try { effacerTitre = JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('titre-effacer') }); } catch (e) { effacerTitre = null; }
  allerTitre();
  requestAnimationFrame(boucle);
})();
</script>
</body>
