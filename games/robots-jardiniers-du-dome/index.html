        const types = ['p', 'p', 'r', 'g', 'l', 'p', 'r'];
        apparaitre(types[Math.floor(Math.random() * types.length)], 0, 0);
        S.demoT = 1.3 + Math.random();
      }
    } else if (S.phase === 'prep') {
      if (S.compteActif) {
        S.compte -= dt;
        if (S.compte <= 0) lancerVague(true);
      }
      minuteurPanneau -= dt;
      if (minuteurPanneau <= 0) { minuteurPanneau = 0.25; majBoutonVague(); }
    } else if (S.phase === 'vague') {
      S.tv += dt;
      while (S.file.length && S.file[0].at <= S.tv) {
        const f = S.file.shift();
        apparaitre(f.type, f.ch, 0);
      }
    }

    // Moutons.
    for (const m of S.moutons) {
      if (m.mort) continue;
      if (m.nait > 0) m.nait -= dt;
      if (m.touche > 0) m.touche -= dt;
      if (m.bouclier > 0) m.bouclier -= dt;
      if (m.mouille > 0) m.mouille -= dt;
      if (m.lentT > 0) { m.lentT -= dt; if (m.lentT <= 0) m.lentF = 1; }
      if (m.bulle > 0) { m.bulle -= dt; continue; }
      const v = m.def.v * (m.lentT > 0 ? m.lentF : 1);
      m.d += v * dt;
      m.rot += v * dt / (m.def.r * 1.3);
      placerMouton(m);
      if (reste(m) <= 0.3) arrivee(m);
      if (S.fin) return;
    }

    // Robots.
    for (const so of S.socles) {
      const rob = so.robot;
      if (!rob) continue;
      rob.anim += dt;
      if (rob.flash > 0) rob.flash -= dt;
      if (rob.tir > 0) rob.tir -= dt;
      if (rob.actif > 0) rob.actif -= dt;
      rob.cd -= dt;
      if (rob.cd > 0) continue;
      agir(so, rob);
    }

    // Effets de jeu (rayons, souffles…).
    for (const e of S.effets) e.vie += dt;
    S.effets = S.effets.filter((e) => e.vie < e.max);
    S.moutons = S.moutons.filter((m) => !m.mort);

    if (!S.demo && S.phase === 'vague' && !S.file.length && !S.moutons.length && !S.fin) finVague();
  }

  function agir(so, rob) {
    const id = rob.def.id;
    const portee = val(rob, 'portee');
    if (id === 'aspi') {
      const l = aPortee(so, portee);
      if (!l.length) { rob.cd = 0.1; return; }
      const m = l[0];
      rob.cible = m; rob.tir = 0.35; rob.angle = Math.atan2(m.y - so.y, m.x - so.x);
      frapper(m, val(rob, 'degats'), 'aspi');
      rob.cd = rob.def.cadence;
      son('aspire');
    } else if (id === 'arroseur') {
      const l = aPortee(so, portee);
      rob.cd = rob.def.cadence;
      if (!l.length) return;
      const lent = val(rob, 'lent');
      for (const m of l) {
        m.mouille = 2.2;
        m.lentF = m.lentT > 0 ? Math.min(m.lentF, lent) : lent;
        m.lentT = 2.2;
      }
      rob.actif = 0.5;
      son('eau');
    } else if (id === 'ventilo') {
      const l = aPortee(so, portee, (m) => m.bulle <= 0 && m.nait <= 0);
      if (!l.length) { rob.cd = 0.15; return; }
      const k = val(rob, 'cibles');
      for (let i = 0; i < Math.min(k, l.length); i++) {
        const m = l[i];
        let recul;
        if (m.type === 'R') recul = 1.2;
        else if (m.type === 'g') recul = 3;
        else if (m.retours < 2) { recul = m.d; m.retours++; } else recul = 2;
        S.effets.push({ type: 'vent', x: so.x, y: so.y, x2: m.x, y2: m.y, vie: 0, max: 0.45 });
        m.d = Math.max(0, m.d - recul);
        m.nait = 0.25;
        placerMouton(m);
      }
      rob.angle = Math.atan2(l[0].y - so.y, l[0].x - so.x);
      rob.actif = 0.6;
      rob.cd = val(rob, 'cadence');
      son('ventilo');
    } else if (id === 'solaire') {
      rob.cd = S.nuit ? 0.5 : rob.def.cadence;
      if (S.nuit) return;
      rob.actif = 0.6;
      gagner(val(rob, 'gain'), so.x, so.y, true);
      son('solaire');
    } else if (id === 'brosse') {
      const l = aPortee(so, portee);
      rob.cd = rob.def.cadence;
      if (!l.length) return;
      rob.actif = 0.5;
      for (const m of l) frapper(m, val(rob, 'degats'), 'brosse');
      son('aspire');
    } else if (id === 'bulles') {
      const l = aPortee(so, portee, (m) => m.bulle <= 0);
      if (!l.length) { rob.cd = 0.15; return; }
      const m = l[0];
      rob.angle = Math.atan2(m.y - so.y, m.x - so.x);
      m.bulle = val(rob, 'duree') * (m.type === 'R' ? 0.5 : 1);
      S.effets.push({ type: 'tirBulle', x: so.x, y: so.y, x2: m.x, y2: m.y, vie: 0, max: 0.3 });
      frapper(m, val(rob, 'degats'), 'bulles');
      rob.actif = 0.4;
      rob.cd = val(rob, 'cadence');
      son('bulle');
    }
  }

  // Particules et gouttes en vol (pixels).
  function majParticules(dt) {
    for (const p of particules) {
      p.vie += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += (p.forme === 'confetti' ? 120 : 60) * dt; p.vx *= 0.98;
      if (p.forme === 'confetti') p.rot = (p.rot || 0) + dt * 6;
    }
    for (let i = particules.length - 1; i >= 0; i--) if (particules[i].vie >= particules[i].max) particules.splice(i, 1);
    for (const g of gouttesVol) g.k += dt / g.duree;
    for (let i = gouttesVol.length - 1; i >= 0; i--) {
      if (gouttesVol[i].k >= 1) {
        if (!gouttesVol[i].haut) { son('goutte'); pulse($('hud-energie')); }
        gouttesVol.splice(i, 1);
      }
    }
  }

  // ---------------------------------------------------------------------------
  // MISE EN PAGE
  // ---------------------------------------------------------------------------
  const canvas = $('scene');
  const ctx = canvas.getContext('2d');
  let cache = null, cacheValide = false;
  const gx = (x) => L.ox + x * L.cell;
  const gy = (y) => L.oy + y * L.cell;

  function miseEnPage() {
    L.dpr = Math.min(2, window.devicePixelRatio || 1);
    L.W = window.innerWidth; L.H = window.innerHeight;
    canvas.width = Math.round(L.W * L.dpr); canvas.height = Math.round(L.H * L.dpr);
    let haut = 8, bas = 8;
    if (S.ecran === 'jeu') {
      haut = $('hud').getBoundingClientRect().bottom + 2;
      bas = L.H - $('panneau').getBoundingClientRect().top + 2;
    }
    const dispoH = Math.max(100, L.H - haut - bas);
    const lignes = LIGNES + 1.05 + 0.3;
    L.cell = Math.max(18, Math.min((L.W - 10) / COLS, dispoH / lignes, 80));
    L.ox = (L.W - COLS * L.cell) / 2;
    L.oy = haut + 0.3 * L.cell + Math.max(0, (dispoH - lignes * L.cell) / 2);
    cacheValide = false;
  }

  function hexa(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function rrect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function couleurRobot(temps) {
    const c = COULEURS[PROG.couleur].c;
    return c === 'arc' ? 'hsl(' + Math.round((temps * 60) % 360) + ',85%,68%)' : c;
  }

  // ---------------------------------------------------------------------------
  // DÉCOR FIXE (dessiné une fois dans un canevas caché)
  // ---------------------------------------------------------------------------
  function construireCache() {
    if (!cache) cache = document.createElement('canvas');
    cache.width = canvas.width; cache.height = canvas.height;
    const c = cache.getContext('2d');
    c.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    const sec = SECTEURS[S.niv.s];
    const k = L.cell;

    // Ciel du dôme, étoiles et nervures de verre.
    const g = c.createLinearGradient(0, 0, 0, L.H);
    g.addColorStop(0, sec.ciel[0]); g.addColorStop(1, sec.ciel[1]);
    c.fillStyle = g; c.fillRect(0, 0, L.W, L.H);
    const h = hasard(11 + S.niv.s * 7);
    for (let i = 0; i < 90; i++) {
      c.fillStyle = 'rgba(255,255,255,' + (0.25 + h() * 0.6) + ')';
      const s = h() < 0.15 ? 2.4 : 1.4;
      c.fillRect(h() * L.W, h() * L.H, s, s);
    }
    const cx = L.W / 2, cy = L.H * 1.08, R = Math.max(L.W * 0.95, L.H * 1.05);
    c.strokeStyle = hexa(sec.reflet, 0.16); c.lineWidth = 2;
    for (let i = 0; i < 5; i++) { c.beginPath(); c.arc(cx, cy, R - i * R * 0.17, Math.PI, TAU); c.stroke(); }
    for (let i = 1; i < 10; i++) {
      const a = Math.PI + i * Math.PI / 10;
      c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); c.stroke();
    }

    // Plateau du jardin.
    const x0 = gx(0), y0 = gy(0), w = COLS * k, hh = (LIGNES + 1) * k;
    c.fillStyle = 'rgba(0,0,0,.3)'; rrect(c, x0 - 7, y0 - 7, w + 14, hh + 14, 20); c.fill();
    c.strokeStyle = hexa(sec.reflet, 0.55); c.lineWidth = 2.5; rrect(c, x0 - 7, y0 - 7, w + 14, hh + 14, 20); c.stroke();
    c.save(); rrect(c, x0, y0, w, LIGNES * k, 12); c.clip();
    for (let r = 0; r < LIGNES; r++) for (let col = 0; col < COLS; col++) {
      c.fillStyle = (r + col) % 2 ? sec.sol : sec.sol2;
      c.fillRect(gx(col), gy(r), k + 0.5, k + 0.5);
    }
    // Petits brins d'herbe lumineux.
    const hh2 = hasard(3 + S.niv.s);
    c.strokeStyle = hexa(sec.reflet, 0.25); c.lineWidth = 1.2;
    for (let i = 0; i < 70; i++) {
      const px = x0 + hh2() * w, py = y0 + hh2() * LIGNES * k;
      c.beginPath(); c.moveTo(px, py); c.lineTo(px + 2, py - 5); c.stroke();
    }
    c.restore();

    // Décor des cases libres.
    const libre = (col, r) => !S.cases.has(col + ',' + r) && !S.socles.some((s) => s.c === col && s.r === r);
    const hd = hasard(101 + S.niv.s * 13 + S.n);
    for (let r = 0; r < LIGNES; r++) for (let col = 0; col < COLS; col++) {
      const tirage = hd();
      if (!libre(col, r) || tirage > 0.55) continue;
      dessinerDecor(c, sec.decor, gx(col + 0.5), gy(r + 0.5), k, hd(), sec);
    }

    // Allées.
    S.chemins.forEach((ch, i) => {
      const ouvert = S.ouverts[i];
      c.save();
      c.globalAlpha = ouvert ? 1 : 0.45;
      c.lineCap = 'round'; c.lineJoin = 'round';
      c.beginPath();
      ch.P.forEach((p, j) => { const X = gx(p.x), Y = gy(Math.min(p.y, 10.2)); if (j) c.lineTo(X, Y); else c.moveTo(X, gy(-0.1)); });
      c.strokeStyle = sec.bord; c.lineWidth = k * 0.78; c.stroke();
      c.strokeStyle = sec.allee; c.lineWidth = k * 0.62; c.stroke();
      c.setLineDash([k * 0.12, k * 0.22]); c.strokeStyle = hexa(sec.bord, 0.55); c.lineWidth = k * 0.06; c.stroke();
      c.setLineDash([]);
      c.restore();
    });
    // Entrées (tuyaux du dôme) et barrières des allées fermées.
    S.chemins.forEach((ch, i) => {
      const X = gx(ch.P[0].x), Y = gy(-0.12);
      c.fillStyle = '#0a1426'; c.beginPath(); c.ellipse(X, Y, k * 0.42, k * 0.2, 0, 0, TAU); c.fill();
      c.strokeStyle = sec.reflet; c.lineWidth = 3; c.stroke();
      if (!S.ouverts[i]) {
        const by = gy(0.35);
        c.save(); c.translate(X, by);
        rrect(c, -k * 0.42, -k * 0.1, k * 0.84, k * 0.2, 4); c.fillStyle = '#fff'; c.fill();
        c.save(); c.clip();
        c.fillStyle = '#ff6b6b';
        for (let s = -k; s < k; s += k * 0.22) { c.beginPath(); c.moveTo(s, k * 0.1); c.lineTo(s + k * 0.1, k * 0.1); c.lineTo(s + k * 0.2, -k * 0.1); c.lineTo(s + k * 0.1, -k * 0.1); c.fill(); }
        c.restore(); c.restore();
      }
    });

    // Jardin des fleurs (ligne du bas).
    const jy = gy(LIGNES);
    const gj = c.createLinearGradient(0, jy, 0, jy + k);
    gj.addColorStop(0, '#3a2a1e'); gj.addColorStop(1, '#2a1d14');
    c.fillStyle = gj; rrect(c, x0, jy + 2, w, k * 1.0, 12); c.fill();
    c.strokeStyle = hexa(sec.reflet, 0.6); c.lineWidth = 2; rrect(c, x0, jy + 2, w, k * 1.0, 12); c.stroke();

    // Socles.
    for (const so of S.socles) {
      const X = gx(so.x), Y = gy(so.y);
      c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(X, Y + k * 0.06, k * 0.4, k * 0.34, 0, 0, TAU); c.fill();
      const gs = c.createRadialGradient(X - k * 0.1, Y - k * 0.1, 2, X, Y, k * 0.38);
      gs.addColorStop(0, '#e8f0fa'); gs.addColorStop(1, '#8796ad');
      c.fillStyle = gs; c.beginPath(); c.arc(X, Y, k * 0.36, 0, TAU); c.fill();
      c.strokeStyle = hexa(sec.reflet, 0.8); c.lineWidth = 2; c.beginPath(); c.arc(X, Y, k * 0.27, 0, TAU); c.stroke();
      c.fillStyle = '#5b6a82'; for (let a = 0; a < 4; a++) { c.beginPath(); c.arc(X + Math.cos(a * Math.PI / 2 + 0.78) * k * 0.31, Y + Math.sin(a * Math.PI / 2 + 0.78) * k * 0.31, 1.6, 0, TAU); c.fill(); }
    }
    cacheValide = true;
  }

  function dessinerDecor(c, type, x, y, k, r, sec) {
    c.save(); c.translate(x + (r - 0.5) * k * 0.3, y + (r - 0.5) * k * 0.2);
    if (type === 'tulipe') {
      c.strokeStyle = '#4fb38c'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, k * 0.25); c.lineTo(0, -k * 0.05); c.stroke();
      c.fillStyle = hexa(sec.reflet, 0.7); c.beginPath(); c.moveTo(-k * 0.12, -k * 0.05); c.lineTo(-k * 0.12, -k * 0.2); c.lineTo(-k * 0.04, -k * 0.13); c.lineTo(0, -k * 0.24); c.lineTo(k * 0.04, -k * 0.13); c.lineTo(k * 0.12, -k * 0.2); c.lineTo(k * 0.12, -k * 0.05); c.closePath(); c.fill();
    } else if (type === 'cristal') {
      c.fillStyle = hexa(sec.reflet, 0.65);
      [[-0.1, 0.15], [0.06, 0.24], [0.14, 0.12]].forEach(([dx, hgt]) => { c.beginPath(); c.moveTo(dx * k - k * 0.05, k * 0.18); c.lineTo(dx * k, k * 0.18 - hgt * k * 1.4); c.lineTo(dx * k + k * 0.05, k * 0.18); c.closePath(); c.fill(); });
    } else if (type === 'luciole') {
      c.fillStyle = '#5c8f3a'; c.beginPath(); c.ellipse(0, k * 0.12, k * 0.22, k * 0.1, 0, 0, TAU); c.fill();
      c.fillStyle = '#ffe27a'; [[-0.1, -0.05], [0.12, -0.12], [0.02, -0.22]].forEach(([dx, dy]) => { c.beginPath(); c.arc(dx * k, dy * k, 2, 0, TAU); c.fill(); });
    } else if (type === 'arbre') {
      c.fillStyle = '#7a5236'; c.fillRect(-2, -k * 0.02, 4, k * 0.24);
      c.fillStyle = '#5f9a4f'; c.beginPath(); c.arc(0, -k * 0.1, k * 0.2, 0, TAU); c.fill();
      c.fillStyle = '#ff8fab'; [[-0.08, -0.12], [0.08, -0.04], [0.04, -0.2]].forEach(([dx, dy]) => { c.beginPath(); c.arc(dx * k, dy * k, k * 0.035, 0, TAU); c.fill(); });
    } else {
      c.fillStyle = '#4a5b80'; c.fillRect(-1.5, -k * 0.12, 3, k * 0.3);
      c.fillStyle = hexa(sec.reflet, 0.9); c.beginPath(); c.arc(0, -k * 0.16, k * 0.07, 0, TAU); c.fill();
      c.fillStyle = hexa(sec.reflet, 0.18); c.beginPath(); c.arc(0, -k * 0.16, k * 0.18, 0, TAU); c.fill();
    }
    c.restore();
  }

  // ---------------------------------------------------------------------------
  // DESSINS : robots, moutons, fleurs, main
  // ---------------------------------------------------------------------------
  function dessinerRobot(c, x, y, k, id, niv, coul, angle, anim, actif, nuitK) {
    const r = k * 0.3;
    c.save(); c.translate(x, y);
    c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(0, r * 0.75, r * 1.05, r * 0.42, 0, 0, TAU); c.fill();
    const flotte = Math.sin(anim * 3) * k * 0.025;
    c.translate(0, flotte - k * 0.04);
    if (id === 'solaire') {
      // Panneau solaire sur un petit pied.
      c.fillStyle = '#6b7a93'; c.fillRect(-k * 0.04, -k * 0.02, k * 0.08, k * 0.24);
      c.fillStyle = coul; c.beginPath(); c.arc(0, k * 0.2, k * 0.12, 0, TAU); c.fill();
      c.save(); c.rotate(-0.15);
      rrect(c, -k * 0.36, -k * 0.3, k * 0.72, k * 0.4, 5);
      c.fillStyle = actif > 0 ? '#3d7bff' : '#22408a'; c.fill();
      c.strokeStyle = '#d8e6ff'; c.lineWidth = 1.6; c.stroke();
      c.strokeStyle = 'rgba(216,230,255,.55)'; c.lineWidth = 1;
      for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(-k * 0.36 + i * k * 0.18, -k * 0.3); c.lineTo(-k * 0.36 + i * k * 0.18, k * 0.1); c.stroke(); }
      c.beginPath(); c.moveTo(-k * 0.36, -k * 0.1); c.lineTo(k * 0.36, -k * 0.1); c.stroke();
      if (actif > 0) { c.fillStyle = 'rgba(255,255,255,' + actif * 0.6 + ')'; c.fillRect(-k * 0.36, -k * 0.3, k * 0.72, k * 0.4); }
      c.restore();
      dessinerPips(c, niv, k, r * 1.25);
      c.restore();
      return;
    }
    // Accessoires derrière le corps.
    if (id === 'brosse') {
      c.save(); c.rotate(anim * (actif > 0 ? 9 : 2));
      c.strokeStyle = '#ffd166'; c.lineWidth = k * 0.06; c.lineCap = 'round';
      for (let i = 0; i < 12; i++) { const a = i * TAU / 12; c.beginPath(); c.moveTo(Math.cos(a) * r * 1.05, Math.sin(a) * r * 1.05); c.lineTo(Math.cos(a + 0.2) * r * 1.42, Math.sin(a + 0.2) * r * 1.42); c.stroke(); }
      c.restore();
    }
    if (id === 'aspi') {
      c.save(); c.rotate(angle);
      c.fillStyle = '#8fa1bd'; rrect(c, r * 0.4, -k * 0.07, r * 1.05, k * 0.14, 5); c.fill();
      c.fillStyle = '#5b6a82'; c.beginPath(); c.moveTo(r * 1.35, -k * 0.12); c.lineTo(r * 1.65, -k * 0.16); c.lineTo(r * 1.65, k * 0.16); c.lineTo(r * 1.35, k * 0.12); c.closePath(); c.fill();
      c.restore();
    }
    // Corps.
    const gc = c.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.1);
    gc.addColorStop(0, '#ffffff'); gc.addColorStop(0.25, coul); gc.addColorStop(1, ombrer(coul));
    c.fillStyle = gc; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(10,20,40,.55)'; c.lineWidth = 1.6; c.stroke();
    // Écran-visage.
    rrect(c, -r * 0.62, -r * 0.42, r * 1.24, r * 0.66, r * 0.25); c.fillStyle = '#10213d'; c.fill();
    const cligne = (anim % 3.2) > 3.05 ? 0.15 : 1;
    c.fillStyle = '#7ff7e0';
    c.beginPath(); c.ellipse(-r * 0.25, -r * 0.1, r * 0.11, r * 0.15 * cligne, 0, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(r * 0.25, -r * 0.1, r * 0.11, r * 0.15 * cligne, 0, 0, TAU); c.fill();
    if (nuitK > 0.1) { c.fillStyle = 'rgba(127,247,224,' + nuitK * 0.35 + ')'; c.beginPath(); c.arc(0, -r * 0.1, r * 0.7, 0, TAU); c.fill(); }
    // Accessoires devant / dessus.
    if (id === 'arroseur') {
      c.fillStyle = 'rgba(120,200,255,.85)'; c.beginPath(); c.arc(0, -r * 0.95, r * 0.42, Math.PI, TAU); c.fill();
      c.strokeStyle = '#d8f0ff'; c.lineWidth = 1.4; c.stroke();
      c.save(); c.translate(0, -r * 1.25); c.rotate(anim * (actif > 0 ? 8 : 1));
      c.fillStyle = '#5b6a82'; c.fillRect(-r * 0.45, -r * 0.08, r * 0.9, r * 0.16);
      c.fillStyle = '#9fd8ff'; c.beginPath(); c.arc(-r * 0.45, 0, r * 0.11, 0, TAU); c.arc(r * 0.45, 0, r * 0.11, 0, TAU); c.fill();
      c.restore();
    } else if (id === 'ventilo') {
      c.save(); c.translate(0, r * 0.05); c.rotate(angle);
      c.translate(r * 0.95, 0);
      c.strokeStyle = '#d8e6ff'; c.lineWidth = 1.5; c.beginPath(); c.arc(0, 0, r * 0.55, 0, TAU); c.stroke();
      c.rotate(anim * (actif > 0 ? 25 : 4));
      c.fillStyle = '#f2f7ff';
      for (let i = 0; i < 3; i++) { c.rotate(TAU / 3); c.beginPath(); c.ellipse(r * 0.26, 0, r * 0.26, r * 0.12, 0, 0, TAU); c.fill(); }
      c.fillStyle = '#5b6a82'; c.beginPath(); c.arc(0, 0, r * 0.1, 0, TAU); c.fill();
      c.restore();
    } else if (id === 'bulles') {
      c.strokeStyle = '#ff9ad5'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(r * 0.5, -r * 0.7); c.lineTo(r * 0.9, -r * 1.3); c.stroke();
      c.beginPath(); c.arc(r * 1.05, -r * 1.55, r * 0.3, 0, TAU); c.stroke();
      c.fillStyle = 'rgba(200,240,255,.45)'; c.beginPath(); c.arc(r * 1.05 + Math.sin(anim * 2) * 2, -r * 1.55, r * 0.22, 0, TAU); c.fill();
    } else if (id === 'aspi') {
      c.fillStyle = '#5b6a82'; c.fillRect(-r * 0.08, -r * 1.25, r * 0.16, r * 0.35);
      c.fillStyle = '#ff6b6b'; c.beginPath(); c.arc(0, -r * 1.3, r * 0.14, 0, TAU); c.fill();
    } else if (id === 'brosse') {
      c.fillStyle = '#ffd166'; c.beginPath(); c.arc(0, -r * 1.05, r * 0.2, 0, TAU); c.fill();
    }
    dessinerPips(c, niv, k, r * 1.2);
    c.restore();
  }
  function dessinerPips(c, niv, k, dy) {
    if (niv <= 1) return;
    c.fillStyle = '#ffe27a'; c.strokeStyle = '#7a5a00'; c.lineWidth = 1;
    for (let i = 0; i < niv; i++) {
      const x = (i - (niv - 1) / 2) * k * 0.14;
      c.beginPath(); c.arc(x, dy, k * 0.05, 0, TAU); c.fill(); c.stroke();
    }
  }
  function ombrer(coul) {
    if (coul[0] !== '#') return coul;
    const n = parseInt(coul.slice(1), 16);
    const f = (v) => Math.round(v * 0.55);
    return 'rgb(' + f(n >> 16 & 255) + ',' + f(n >> 8 & 255) + ',' + f(n & 255) + ')';
  }

  function dessinerMouton(c, x, y, R, m, temps) {
    const def = MOUTONS[m.type];
    const echelle = m.nait > 0 ? 1 - m.nait * 1.6 : 1;
    if (echelle <= 0.05) return;
    c.save(); c.translate(x, y); c.scale(echelle, echelle);
    c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(0, R * 0.8, R * 0.95, R * 0.35, 0, 0, TAU); c.fill();
    // Traînée des rapides.
    if (m.type === 'r' && m.bulle <= 0) {
      c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 2; c.lineCap = 'round';
      for (let i = -1; i <= 1; i++) {
        const ox = -(m.dx || 0) * R * 1.2 + (m.dy || 0) * i * R * 0.45, oy = -(m.dy || 1) * R * 1.2 - (m.dx || 0) * i * R * 0.45;
        c.beginPath(); c.moveTo(ox, oy); c.lineTo(ox - (m.dx || 0) * R * 0.9, oy - (m.dy || 1) * R * 0.9); c.stroke();
      }
    }
    // Boule de poussière duveteuse.
    const bosses = m.type === 'R' ? 16 : 12;
    c.fillStyle = def.ombre;
    for (let i = 0; i < bosses; i++) { const a = m.rot + i * TAU / bosses; c.beginPath(); c.arc(Math.cos(a) * R * 0.78, Math.sin(a) * R * 0.78, R * 0.34, 0, TAU); c.fill(); }
    c.fillStyle = def.coul;
    for (let i = 0; i < bosses; i++) { const a = m.rot + i * TAU / bosses + 0.2; c.beginPath(); c.arc(Math.cos(a) * R * 0.7, Math.sin(a) * R * 0.7, R * 0.3, 0, TAU); c.fill(); }
    c.beginPath(); c.arc(0, 0, R * 0.78, 0, TAU); c.fill();
    if (def.laine) {
      c.strokeStyle = '#b8a77a'; c.lineWidth = 1.4;
      for (let i = 0; i < 7; i++) { const a = m.rot * 0.5 + i * TAU / 7; c.beginPath(); c.arc(Math.cos(a) * R * 0.5, Math.sin(a) * R * 0.5, R * 0.16, 0, Math.PI * 1.5); c.stroke(); }
    }
    // Petits points de poussière qui tournent.
    c.fillStyle = 'rgba(80,80,100,.35)';
    for (let i = 0; i < 4; i++) { const a = m.rot * 1.3 + i * 1.7; c.beginPath(); c.arc(Math.cos(a) * R * 0.45, Math.sin(a) * R * 0.45, R * 0.07, 0, TAU); c.fill(); }
    // Yeux et joues (toujours droits).
    const ex = R * 0.28, ey = -R * 0.08;
    c.fillStyle = '#fff';
    c.beginPath(); c.ellipse(-ex, ey, R * 0.2, R * 0.24, 0, 0, TAU); c.ellipse(ex, ey, R * 0.2, R * 0.24, 0, 0, TAU); c.fill();
    c.fillStyle = '#1b2233';
    const regard = m.bulle > 0 ? 0 : R * 0.06;
    c.beginPath(); c.arc(-ex + (m.dx || 0) * regard, ey + (m.dy || 0) * regard, R * 0.1, 0, TAU); c.arc(ex + (m.dx || 0) * regard, ey + (m.dy || 0) * regard, R * 0.1, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,140,170,.55)';
    c.beginPath(); c.arc(-R * 0.5, R * 0.2, R * 0.12, 0, TAU); c.arc(R * 0.5, R * 0.2, R * 0.12, 0, TAU); c.fill();
    c.strokeStyle = '#1b2233'; c.lineWidth = Math.max(1, R * 0.07);
    c.beginPath(); c.arc(0, R * 0.2, R * 0.13, 0.2, Math.PI - 0.2); c.stroke();
    // Couronne du roi (forme, sans texte).
    if (def.roi) {
      c.fillStyle = '#ffd166'; c.strokeStyle = '#a07800'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(-R * 0.45, -R * 0.75); c.lineTo(-R * 0.5, -R * 1.2); c.lineTo(-R * 0.22, -R * 0.95); c.lineTo(0, -R * 1.3); c.lineTo(R * 0.22, -R * 0.95); c.lineTo(R * 0.5, -R * 1.2); c.lineTo(R * 0.45, -R * 0.75); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#ff5d8f'; c.beginPath(); c.arc(0, -R * 0.92, R * 0.08, 0, TAU); c.fill();
    }
    // Mouillé : reflets bleus et gouttes.
    if (m.mouille > 0) {
      c.fillStyle = 'rgba(80,170,255,.32)'; c.beginPath(); c.arc(0, 0, R * 0.95, 0, TAU); c.fill();
      c.fillStyle = '#9fd8ff';
      for (let i = 0; i < 3; i++) { const dy = ((temps * 1.5 + i * 0.33) % 1) * R * 0.8; c.beginPath(); c.arc((i - 1) * R * 0.45, R * 0.4 + dy, R * 0.07, 0, TAU); c.fill(); }
    }
    if (m.touche > 0) { c.fillStyle = 'rgba(255,255,255,' + m.touche * 3 + ')'; c.beginPath(); c.arc(0, 0, R * 0.9, 0, TAU); c.fill(); }
    if (m.bouclier > 0) { c.strokeStyle = 'rgba(255,240,180,' + m.bouclier * 3 + ')'; c.lineWidth = 3; c.beginPath(); c.arc(0, 0, R * 1.15, 0, TAU); c.stroke(); }
    if (m.bulle > 0) {
      c.fillStyle = 'rgba(190,235,255,.25)'; c.strokeStyle = 'rgba(230,250,255,.9)'; c.lineWidth = 2;
      c.beginPath(); c.arc(0, 0, R * 1.35 + Math.sin(temps * 8) * 1.5, 0, TAU); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.8)'; c.beginPath(); c.ellipse(-R * 0.6, -R * 0.65, R * 0.22, R * 0.12, -0.6, 0, TAU); c.fill();
    }
    // Jauge de poussière restante.
    if (m.pvMax && m.pv < m.pvMax) {
      const w = R * 1.6;
      c.fillStyle = 'rgba(0,0,0,.45)'; rrect(c, -w / 2, -R * 1.25 - (def.roi ? R * 0.2 : 0), w, 4, 2); c.fill();
      c.fillStyle = '#7ff7e0'; rrect(c, -w / 2, -R * 1.25 - (def.roi ? R * 0.2 : 0), w * clamp(m.pv / m.pvMax, 0, 1), 4, 2); c.fill();
    }
    c.restore();
  }

  const TEINTES_FLEURS = [
    ['#7ff7e0', '#3fd1c2'], ['#ff9ad5', '#e45fa6'], ['#cfe0ff', '#8fb2ff'],
    ['#ffd166', '#ff9f1c'], ['#c9a6ff', '#8e6bff'], ['#ff6b6b', '#ffd166'],
  ];
  function dessinerFleur(c, x, y, k, sorte, ok, temps, phase, lueur) {
    c.save(); c.translate(x, y);
    const bal = ok ? Math.sin(temps * 1.5 + phase) * 0.08 : 0.5;
    // Tige et feuilles.
    c.strokeStyle = ok ? '#4fb38c' : '#6b6b5e'; c.lineWidth = Math.max(1.5, k * 0.05); c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, k * 0.35); c.quadraticCurveTo(k * 0.04, k * 0.1, Math.sin(bal) * k * 0.2, -k * 0.05); c.stroke();
    c.fillStyle = ok ? '#4fb38c' : '#6b6b5e';
    c.beginPath(); c.ellipse(-k * 0.08, k * 0.2, k * 0.09, k * 0.04, -0.6, 0, TAU); c.ellipse(k * 0.09, k * 0.24, k * 0.09, k * 0.04, 0.6, 0, TAU); c.fill();
    c.translate(Math.sin(bal) * k * 0.2, -k * 0.08); c.rotate(bal);
    const [c1, c2] = ok ? TEINTES_FLEURS[sorte] : ['#9aa0ad', '#70757f'];
    if (ok && lueur > 0) {
      const g = c.createRadialGradient(0, 0, 1, 0, 0, k * 0.45);
      g.addColorStop(0, hexa(c1, 0.55 * lueur)); g.addColorStop(1, hexa(c1, 0));
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, k * 0.45, 0, TAU); c.fill();
    }
    const s = k * 0.17;
    if (sorte === 0) { // tulipe de verre
      c.fillStyle = c2; c.beginPath(); c.moveTo(-s, -s * 0.2); c.quadraticCurveTo(-s * 1.1, s, 0, s); c.quadraticCurveTo(s * 1.1, s, s, -s * 0.2); c.lineTo(s * 0.5, -s * 0.9); c.lineTo(0, -s * 0.3); c.lineTo(-s * 0.5, -s * 0.9); c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,255,255,.45)'; c.beginPath(); c.ellipse(-s * 0.35, s * 0.1, s * 0.15, s * 0.4, 0.2, 0, TAU); c.fill();
    } else if (sorte === 1) { // rose cristal
      for (let i = 0; i < 6; i++) { c.save(); c.rotate(i * TAU / 6 + 0.3); c.fillStyle = i % 2 ? c1 : c2; c.beginPath(); c.moveTo(0, 0); c.lineTo(s * 0.45, -s * 0.5); c.lineTo(0, -s * 1.15); c.lineTo(-s * 0.45, -s * 0.5); c.closePath(); c.fill(); c.restore(); }
      c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, s * 0.22, 0, TAU); c.fill();
    } else if (sorte === 2) { // clochette de lune
      c.fillStyle = c1; c.beginPath(); c.moveTo(-s * 0.8, s * 0.6); c.quadraticCurveTo(-s * 0.8, -s, 0, -s); c.quadraticCurveTo(s * 0.8, -s, s * 0.8, s * 0.6); c.quadraticCurveTo(0, s * 0.3, -s * 0.8, s * 0.6); c.fill();
      c.fillStyle = c2; c.beginPath(); c.arc(0, s * 0.6, s * 0.18, 0, TAU); c.fill();
    } else if (sorte === 3) { // soleil d'or
      c.fillStyle = c1; for (let i = 0; i < 12; i++) { c.save(); c.rotate(i * TAU / 12); c.beginPath(); c.ellipse(0, -s * 0.75, s * 0.18, s * 0.42, 0, 0, TAU); c.fill(); c.restore(); }
      c.fillStyle = c2; c.beginPath(); c.arc(0, 0, s * 0.45, 0, TAU); c.fill();
    } else if (sorte === 4) { // orchidée étoile
      c.fillStyle = c1; c.beginPath();
      for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? s * 0.45 : s * 1.1; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      c.closePath(); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, s * 0.25, 0, TAU); c.fill();
    } else { // fleur arc-en-ciel
      for (let i = 0; i < 6; i++) { c.save(); c.rotate(i * TAU / 6); c.fillStyle = ok ? 'hsl(' + (i * 60 + temps * 30) % 360 + ',85%,65%)' : c2; c.beginPath(); c.ellipse(0, -s * 0.62, s * 0.32, s * 0.5, 0, 0, TAU); c.fill(); c.restore(); }
      c.fillStyle = ok ? '#fff6b0' : c1; c.beginPath(); c.arc(0, 0, s * 0.35, 0, TAU); c.fill();
    }
    if (!ok) { // poussière posée dessus
      c.fillStyle = 'rgba(120,120,130,.8)';
      for (let i = 0; i < 5; i++) { c.beginPath(); c.arc((i - 2) * s * 0.3, -s * 0.3 + (i % 2) * s * 0.3, s * 0.18, 0, TAU); c.fill(); }
    }
    c.restore();
  }

  // Main qui montre le geste (pointe de l'index en x, y).
  function dessinerMain(c, x, y, k, appui) {
    c.save(); c.translate(x, y); const e = k / 40 * (appui ? 0.9 : 1); c.scale(e, e); c.rotate(-0.35);
    c.fillStyle = '#fff'; c.strokeStyle = '#1b2a44'; c.lineWidth = 2.5; c.lineJoin = 'round';
    c.beginPath();
    c.moveTo(-4, 0); c.quadraticCurveTo(-4, -4, 0, -4); c.quadraticCurveTo(4, -4, 4, 0);
    c.lineTo(4, 16); c.quadraticCurveTo(8, 12, 12, 16); c.quadraticCurveTo(16, 13, 19, 18); c.quadraticCurveTo(23, 16, 25, 21);
    c.lineTo(25, 34); c.quadraticCurveTo(24, 44, 14, 46); c.lineTo(2, 46); c.quadraticCurveTo(-6, 44, -10, 34);
    c.lineTo(-14, 24); c.quadraticCurveTo(-15, 19, -10, 20); c.lineTo(-4, 26); c.closePath();
    c.fill(); c.stroke();
    if (appui) { c.strokeStyle = '#ffe27a'; c.lineWidth = 3; c.beginPath(); c.arc(0, -4, 10, 0, TAU); c.stroke(); }
    c.restore();
  }

  function dessinerEtoile(c, x, y, r, coul) {
    c.fillStyle = coul; c.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    c.closePath(); c.fill();
  }
  function dessinerGoutte(c, x, y, r, coul) {
    c.fillStyle = coul; c.beginPath();
    c.moveTo(x, y - r * 1.4); c.quadraticCurveTo(x + r, y - r * 0.2, x + r, y + r * 0.2);
    c.arc(x, y + r * 0.2, r, 0, Math.PI); c.quadraticCurveTo(x - r, y - r * 0.2, x, y - r * 1.4); c.fill();
  }

  // ---------------------------------------------------------------------------
  // DESSIN D'UNE IMAGE
  // ---------------------------------------------------------------------------
  function nuitK() {
    if (!S.niv || !S.niv.cycle || S.demo) return 0;
    const p = S.cycleT % CYCLE;
    if (p < JOUR - 2) return 0;
    if (p < JOUR) return (p - (JOUR - 2)) / 2;
    if (p < CYCLE - 2) return 1;
    return (CYCLE - p) / 2;
  }
  let clavierActif = false;

  function dessiner(temps) {
    if (!S.niv) return;
    if (!cacheValide) construireCache();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(cache, 0, 0);
    ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    const k = L.cell;
    let sx = 0, sy = 0;
    if (S.secousse > 0 && !reduire) { const f = S.secousse / 0.3; sx = (Math.random() - 0.5) * 7 * f; sy = (Math.random() - 0.5) * 5 * f; }
    ctx.save(); ctx.translate(sx, sy);
    const nk = nuitK();

    // Socles : choix, curseur du clavier, destination d'un déplacement.
    S.socles.forEach((so, i) => {
      const X = gx(so.x), Y = gy(so.y);
      const pulse = 0.5 + 0.5 * Math.sin(temps * 6);
      if (S.deplace >= 0 && !so.robot) {
        ctx.strokeStyle = 'rgba(127,247,224,' + (0.5 + pulse * 0.5) + ')'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(X, Y, k * 0.4, 0, TAU); ctx.stroke();
      }
      if (i === S.selection) {
        ctx.strokeStyle = '#ffe27a'; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.arc(X, Y, k * (0.42 + pulse * 0.04), 0, TAU); ctx.stroke();
      } else if (i === S.curseur && clavierActif) {
        ctx.setLineDash([5, 4]); ctx.strokeStyle = '#ffe27a'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(X, Y, k * 0.44, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      }
    });
    // Portée du robot choisi.
    const sel = S.selection >= 0 ? S.socles[S.selection] : (S.deplace >= 0 ? S.socles[S.deplace] : null);
    if (sel && sel.robot && sel.robot.def.id !== 'solaire') {
      const p = val(sel.robot, 'portee') * k;
      ctx.fillStyle = 'rgba(255,226,122,.12)'; ctx.strokeStyle = 'rgba(255,226,122,.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(gx(sel.x), gy(sel.y), p, 0, TAU); ctx.fill(); ctx.stroke();
    }

    // Fleurs du jardin.
    for (const f of S.fleurs) {
      if (f.anim > 0) f.anim = Math.max(0, f.anim - 0.02);
      dessinerFleur(ctx, gx(f.x), gy(LIGNES + 0.5), k, PROG.fleur, f.ok, temps, f.phase, 0.3 + nk * 0.5);
    }

    // Moutons (du plus haut au plus bas).
    const tri = S.moutons.slice().sort((a, b) => a.y - b.y);
    for (const m of tri) dessinerMouton(ctx, gx(m.x), gy(m.y), m.def.r * k, m, temps);

    // Robots et leurs effets.
    const coul = couleurRobot(temps);
    for (const so of S.socles) {
      const rob = so.robot;
      if (!rob) continue;
      const X = gx(so.x), Y = gy(so.y);
      if (rob.def.id === 'aspi' && rob.tir > 0 && rob.cible && !rob.cible.mort) {
        const tx = gx(rob.cible.x), ty = gy(rob.cible.y);
        const bx = X + Math.cos(rob.angle) * k * 0.45, by = Y + Math.sin(rob.angle) * k * 0.45;
        ctx.strokeStyle = 'rgba(200,240,255,' + (rob.tir * 2) + ')'; ctx.lineWidth = 2;
        for (let i = -1; i <= 1; i++) {
          ctx.beginPath(); ctx.moveTo(tx, ty);
          const mx = (tx + bx) / 2 - Math.sin(rob.angle) * i * 7, my = (ty + by) / 2 + Math.cos(rob.angle) * i * 7;
          ctx.quadraticCurveTo(mx, my, bx, by); ctx.stroke();
        }
        ctx.fillStyle = 'rgba(180,180,195,.9)';
        for (let i = 0; i < 4; i++) { const q = (temps * 3 + i / 4) % 1; ctx.beginPath(); ctx.arc(lerp(tx, bx, q), lerp(ty, by, q), 2.5 * (1 - q) + 1, 0, TAU); ctx.fill(); }
      }
      if (rob.def.id === 'arroseur' && rob.actif > 0) {
        const p = val(rob, 'portee') * k;
        ctx.fillStyle = 'rgba(120,200,255,' + Math.min(1, rob.actif * 2) * 0.85 + ')';
        for (let i = 0; i < 12; i++) {
          const a = temps * 2.2 + i * TAU / 12, q = (temps * 1.4 + i * 0.13) % 1;
          dessinerGoutte(ctx, X + Math.cos(a) * p * (0.3 + q * 0.7), Y + Math.sin(a) * p * (0.3 + q * 0.7), 2.6, ctx.fillStyle);
        }
      }
      if (rob.def.id === 'brosse' && rob.actif > 0) {
        const p = val(rob, 'portee') * k;
        ctx.strokeStyle = 'rgba(255,209,102,' + rob.actif + ')'; ctx.lineWidth = 3; ctx.setLineDash([8, 10]);
        ctx.beginPath(); ctx.arc(X, Y, p * 0.85, temps * 5, temps * 5 + TAU); ctx.stroke(); ctx.setLineDash([]);
      }
      if (rob.flash > 0) {
        ctx.fillStyle = 'rgba(255,246,176,' + rob.flash + ')';
        ctx.beginPath(); ctx.arc(X, Y, k * (0.6 - rob.flash * 0.4), 0, TAU); ctx.fill();
      }
      dessinerRobot(ctx, X, Y, k, rob.def.id, rob.niv, coul, rob.angle, rob.anim, rob.actif, nk);
    }
    for (const e of S.effets) {
      const q = e.vie / e.max;
      if (e.type === 'vent') {
        ctx.strokeStyle = 'rgba(230,245,255,' + (1 - q) + ')'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
        for (let i = -1; i <= 1; i++) {
          const ax = gx(e.x), ay = gy(e.y), bx = gx(e.x2), by = gy(e.y2);
          const nx = -(by - ay), ny = bx - ax, nl = Math.hypot(nx, ny) || 1;
          ctx.beginPath(); ctx.moveTo(ax + nx / nl * i * 8, ay + ny / nl * i * 8);
          ctx.quadraticCurveTo(lerp(ax, bx, 0.5) + nx / nl * (i * 8 + Math.sin(q * 9) * 6), lerp(ay, by, 0.5) + ny / nl * (i * 8 + Math.sin(q * 9) * 6), lerp(ax, bx, 0.4 + q * 0.6), lerp(ay, by, 0.4 + q * 0.6));
          ctx.stroke();
        }
      } else if (e.type === 'tirBulle') {
        ctx.strokeStyle = 'rgba(230,250,255,.95)'; ctx.fillStyle = 'rgba(190,235,255,.35)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(gx(lerp(e.x, e.x2, q)), gy(lerp(e.y, e.y2, q)), k * 0.14, 0, TAU); ctx.fill(); ctx.stroke();
      }
    }

    // Nuit : voile bleu, puis lueur des fleurs.
    if (nk > 0) {
      ctx.fillStyle = 'rgba(4,8,36,' + (0.5 * nk) + ')';
      rrect(ctx, gx(0) - 7, gy(0) - 7, COLS * k + 14, (LIGNES + 1) * k + 14, 20); ctx.fill();
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const f of S.fleurs) {
        if (!f.ok) continue;
        const g = ctx.createRadialGradient(gx(f.x), gy(LIGNES + 0.35), 1, gx(f.x), gy(LIGNES + 0.35), k * 0.5);
        g.addColorStop(0, hexa(TEINTES_FLEURS[PROG.fleur][0], 0.45 * nk)); g.addColorStop(1, hexa(TEINTES_FLEURS[PROG.fleur][0], 0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(gx(f.x), gy(LIGNES + 0.35), k * 0.5, 0, TAU); ctx.fill();
      }
      // Lucioles de la nuit.
      ctx.fillStyle = 'rgba(255,226,122,' + 0.8 * nk + ')';
      for (let i = 0; i < 14; i++) {
        const fx = gx(((i * 1.37 + Math.sin(temps * 0.5 + i) * 0.6) % COLS + COLS) % COLS), fy = gy(((i * 2.71 + Math.cos(temps * 0.4 + i * 2) * 0.8) % LIGNES + LIGNES) % LIGNES);
        ctx.beginPath(); ctx.arc(fx, fy, 1.8 + Math.sin(temps * 4 + i) * 0.8, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }

    // Particules.
    for (const p of particules) {
      const a = 1 - p.vie / p.max;
      ctx.globalAlpha = clamp(a, 0, 1);
      if (p.forme === 'etoile') dessinerEtoile(ctx, p.x, p.y, p.taille, p.coul);
      else if (p.forme === 'confetti') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0); ctx.fillStyle = p.coul; ctx.fillRect(-p.taille / 2, -p.taille / 4, p.taille, p.taille / 2); ctx.restore(); }
      else { ctx.fillStyle = p.coul; ctx.beginPath(); ctx.arc(p.x, p.y, p.taille * (0.6 + a * 0.4), 0, TAU); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // Gouttes d'énergie en vol vers le compteur.
    let cible = null;
    if (!S.demo) { const r = $('hud-energie').getBoundingClientRect(); cible = { x: r.left + 16, y: r.top + r.height / 2 }; }
    for (const g of gouttesVol) {
      if (g.k < 0) continue;
      let x, y;
      if (g.haut || !cible) { x = g.x0; y = g.y0 - g.k * 50; ctx.globalAlpha = 1 - g.k; }
      else {
        const q = g.k * g.k;
        const cx = (g.x0 + cible.x) / 2, cy = Math.min(g.y0, cible.y) - 60;
        x = (1 - q) * (1 - q) * g.x0 + 2 * (1 - q) * q * cx + q * q * cible.x;
        y = (1 - q) * (1 - q) * g.y0 + 2 * (1 - q) * q * cy + q * q * cible.y;
      }
      dessinerGoutte(ctx, x, y, 5, g.solaire ? '#ffe27a' : '#5ff2d0');
      ctx.globalAlpha = 1;
    }

    // Aide du niveau 1 : une main montre quoi toucher.
    if (!S.demo && S.n === 0 && S.phase === 'prep' && S.vague === 0 && !S.pause && !S.carte) dessinerAide(temps);
  }

  function socleConseille() {
    let meilleur = 0, score = -1;
    S.socles.forEach((so, i) => {
      if (so.robot) return;
      let n = 0;
      S.cases.forEach((cle) => { const [c, r] = cle.split(',').map(Number); if (Math.hypot(c + 0.5 - so.x, r + 0.5 - so.y) <= 1.6) n++; });
      if (n > score) { score = n; meilleur = i; }
    });
    return meilleur;
  }
  function dessinerAide(temps) {
    const appui = (temps % 1.2) > 0.8;
    const dy = appui ? 0 : Math.sin(temps * 5) * 4;
    const robots = S.socles.filter((s) => s.robot).length;
    let x, y;
    if (S.selection >= 0 && !S.socles[S.selection].robot) {
      const b = document.querySelector('.robot-bouton');
      if (!b) return;
      const r = b.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height * 0.4;
    } else if (robots < 2 && S.selection < 0) {
      const so = S.socles[socleConseille()];
      x = gx(so.x); y = gy(so.y);
    } else if (S.selection < 0) {
      const b = $('b-vague');
      if (!b) return;
      const r = b.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height * 0.45;
    } else return;
    dessinerMain(ctx, x + 4, y + 6 + dy, L.cell * 0.9, appui);
  }

  // Icône d'un robot dans un petit canevas (boutons, collection).
  function icone(cnv, id, coul) {
    const d = 2;
    cnv.width = cnv.clientWidth * d || 68; cnv.height = cnv.clientHeight * d || 68;
    const c = cnv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cnv.width, cnv.height);
    const k = cnv.width * 1.05;
    dessinerRobot(c, cnv.width / 2, cnv.height * 0.56, k, id, 1, coul || couleurRobot(0), -Math.PI / 4, 0.5, 0, 0);
  }

  // ---------------------------------------------------------------------------
  // INTERFACE : bandeau, panneau, messages
  // ---------------------------------------------------------------------------
  const SVG_GOUTTE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C9 7 6 10.2 6 14a6 6 0 0 0 12 0c0-3.8-3-7-6-11.5z" fill="#2fc4a8"/></svg>';
  const SVG_ETOILE = (on) => '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z" fill="' + (on ? '#ffd166' : 'rgba(255,255,255,.22)') + '" stroke="' + (on ? '#a07800' : 'none') + '" stroke-width="1"/></svg>';
  const SVG_CADENAS = '<svg class="cadenas" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2.4" fill="none"/></svg>';

  let minuteurToast = 0;
  function toast(texte) {
    const el = $('toast');
    el.textContent = texte; el.classList.add('visible');
    clearTimeout(minuteurToast);
    minuteurToast = setTimeout(() => el.classList.remove('visible'), 2200);
  }
  function pulse(el) { el.classList.add('pulse'); clearTimeout(el._p); el._p = setTimeout(() => el.classList.remove('pulse'), 140); }

  function majHud() {
    if (!S.niv || S.demo) return;
    $('hud-energie-n').textContent = nb(S.energie);
    $('hud-fleurs-n').textContent = nb(fleursIntactes());
    $('hud-vague-n').textContent = t('hud.vague',{ n: Math.min(S.vague + 1, S.niv.vagues.length), total: S.niv.vagues.length });
    $('hud-ciel').hidden = !S.niv.cycle;
    $('ico-soleil').hidden = S.nuit; $('ico-lune').hidden = !S.nuit;
    $('hud-ciel').title = t(S.nuit ? 'hud.nuit' : 'hud.jour');
    $('b-vitesse').classList.toggle('actif', S.vitesse > 1);
  }
  function majSon() {
    document.body.classList.toggle('muet', !PROG.son);
    ['b-son-jeu', 'b-son-titre', 'b-son-pause'].forEach((id) => $(id).setAttribute('aria-pressed', String(!PROG.son)));
  }
  function basculerSon() {
    PROG.son = !PROG.son; majSon(); sauverProg();
    if (PROG.son) { audio(); son('toucher'); }
  }

  const robotsDuNiveau = () => ROBOTS.filter((r) => r.niveau <= S.n + 1);
  const peutAmeliorer = () => S.n + 1 >= NIVEAU_AMELIORER;
  const peutDeplacer = () => S.n + 1 >= NIVEAU_DEPLACER;

  function bouton(classe, html, action, aria) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = classe; b.innerHTML = html;
    if (aria) { b.setAttribute('aria-label', aria); b.title = aria; }
    b.addEventListener('click', (e) => { e.stopPropagation(); action(); });
    return b;
  }

  // Panneau du bas : selon ce qui est choisi. leger = seulement les prix.
  function majPanneau(leger) {
    if (S.ecran !== 'jeu' || S.demo) return;
    const zone = $('p-boutons'), info = $('p-info');
    if (leger) {
      zone.querySelectorAll('[data-cout]').forEach((b) => {
        const trop = Number(b.dataset.cout) > S.energie;
        b.classList.toggle('trop-cher', trop);
        if (b.classList.contains('bouton')) b.disabled = trop;
      });
      return;
    }
    zone.innerHTML = '';
    const so = S.selection >= 0 ? S.socles[S.selection] : null;
    if (S.deplace >= 0) {
      info.textContent = t('panneau.deplacerOu');
      zone.append(bouton('bouton discret', t('bouton.annuler'), () => { S.deplace = -1; son('toucher'); majPanneau(); }));
    } else if (so && !so.robot) {
      info.textContent = t('panneau.choisir');
      robotsDuNiveau().forEach((def, i) => {
        const nom = t('robot.' + def.id + '.nom');
        const b = bouton('robot-bouton', '<canvas></canvas><span class="cout">' + SVG_GOUTTE + nb(def.cout) + '</span>', () => poser(def), t('panneau.robotAria', { nom, n: def.cout, touche: i + 1 }));
        b.dataset.cout = def.cout;
        b.classList.toggle('trop-cher', def.cout > S.energie);
        zone.append(b);
        requestAnimationFrame(() => icone(b.querySelector('canvas'), def.id));
      });
      zone.append(bouton('bouton discret fermer', '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>', deselectionner, t('bouton.fermer')));
    } else if (so && so.robot) {
      const rob = so.robot;
      info.innerHTML = '';
      const nom = document.createElement('span'); nom.textContent = t('robot.' + rob.def.id + '.nom') + ' — ' + t('robot.' + rob.def.id + '.role');
      const pips = document.createElement('span'); pips.className = 'pips';
      for (let i = 0; i < 3; i++) { const p = document.createElement('i'); if (i < rob.niv) p.className = 'on'; pips.append(p); }
      info.append(nom, pips);
      if (peutAmeliorer()) {
        if (rob.niv < 3) {
          const cout = rob.def.amelio[rob.niv - 1];
          const b = bouton('bouton principal', t('bouton.ameliorer') + '<small>' + SVG_GOUTTE.replace('<svg', '<svg width="12" height="12"') + nb(cout) + '</small>', () => ameliorer(so));
          b.dataset.cout = cout; b.disabled = cout > S.energie;
          zone.append(b);
        } else {
          const b = bouton('bouton', t('bouton.maximum'), () => {}); b.disabled = true; zone.append(b);
        }
      }
      if (peutDeplacer()) {
        const b = bouton('bouton', t('bouton.deplacer') + '<small>' + t(S.phase === 'prep' ? 'panneau.gratuit' : 'panneau.entreVagues') + '</small>', () => commencerDeplacement());
        b.disabled = S.phase !== 'prep';
        zone.append(b);
      }
      const rendu = Math.floor(rob.depense / 2);
      zone.append(bouton('bouton', t('bouton.recycler') + '<small>+' + nb(rendu) + '</small>', () => recycler(so)));
      zone.append(bouton('bouton discret fermer', '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>', deselectionner, t('bouton.fermer')));
    } else if (S.phase === 'prep') {
      info.textContent = t(S.vague === 0 ? 'panneau.preparer' : 'panneau.entreDeux');
      const b = bouton('bouton principal', '', () => lancerVague(false));
      b.id = 'b-vague';
      zone.append(b);
      majBoutonVague();
    } else if (S.phase === 'vague') {
      info.textContent = t('panneau.enCours', { n: S.vague + 1 });
    } else {
      info.textContent = '';
    }
  }
  function majBoutonVague() {
    const b = $('b-vague'); if (!b) return;
    const titre = t(S.vague === 0 ? 'bouton.lancerPremiere' : 'bouton.lancer');
    if (S.compteActif) {
      const s = Math.max(0, Math.ceil(S.compte));
      b.innerHTML = '';
      b.append(document.createTextNode(titre));
      const sm = document.createElement('small'); sm.textContent = t('panneau.bonus', { s, n: s }); b.append(sm);
    } else b.textContent = titre;
  }

  function selectionner(i) {
    if (S.deplace >= 0) {
      const so = S.socles[i];
      if (!so.robot && S.phase === 'prep') {
        so.robot = S.socles[S.deplace].robot; S.socles[S.deplace].robot = null;
        so.robot.flash = 0.5;
        S.deplace = -1; S.selection = i; S.curseur = i;
        son('poser'); toast(t('toast.deplace'));
      } else { S.deplace = -1; son('erreur'); }
      majPanneau(); return;
    }
    if (S.selection === i) { deselectionner(); return; }
    S.selection = i; S.curseur = i;
    son('toucher');
    majPanneau();
  }
  function deselectionner() { S.selection = -1; S.deplace = -1; majPanneau(); }

  function poser(def) {
    const so = S.socles[S.selection];
    if (!so || so.robot) return;
    if (def.cout > S.energie) { son('erreur'); toast(t('toast.manque', { n: def.cout - S.energie })); pulse($('hud-energie')); return; }
    S.energie -= def.cout;
    so.robot = nouveauRobot(def);
    son('poser');
    const X = gx(so.x), Y = gy(so.y);
    for (let i = 0; i < 10; i++) { const a = i * TAU / 10; particules.push({ x: X, y: Y, vx: Math.cos(a) * 80, vy: Math.sin(a) * 80, vie: 0, max: 0.45, coul: '#7ff7e0', taille: 3, forme: 'etoile' }); }
    majHud();
    majPanneau();
  }
  function ameliorer(so) {
    const rob = so.robot; if (!rob || rob.niv >= 3 || !peutAmeliorer()) return;
    const cout = rob.def.amelio[rob.niv - 1];
    if (cout > S.energie) { son('erreur'); toast(t('toast.manque', { n: cout - S.energie })); return; }
    S.energie -= cout; rob.depense += cout; rob.niv++; rob.flash = 0.7;
    son('amelio');
    const X = gx(so.x), Y = gy(so.y);
    for (let i = 0; i < 14; i++) { const a = Math.random() * TAU; particules.push({ x: X, y: Y, vx: Math.cos(a) * 70, vy: Math.sin(a) * 70 - 50, vie: 0, max: 0.7, coul: '#ffe27a', taille: 3.5, forme: 'etoile' }); }
    toast(t('toast.ameliore'));
    majHud(); majPanneau();
  }
  function recycler(so) {
    const rob = so.robot; if (!rob) return;
    const rendu = Math.floor(rob.depense / 2);
    so.robot = null;
    S.energie += rendu;
    son('toucher');
    for (let i = 0; i < 8; i++) { const a = Math.random() * TAU; particules.push({ x: gx(so.x), y: gy(so.y), vx: Math.cos(a) * 60, vy: Math.sin(a) * 60, vie: 0, max: 0.5, coul: '#c9d6ea', taille: 3, forme: 'rond' }); }
    majHud(); majPanneau();
  }
  function commencerDeplacement() {
    if (!peutDeplacer() || S.phase !== 'prep' || S.selection < 0 || !S.socles[S.selection].robot) return;
    S.deplace = S.selection; S.selection = -1;
    son('toucher');
    majPanneau();
  }

  // ---------------------------------------------------------------------------
  // ÉCRANS
  // ---------------------------------------------------------------------------
  function prochainNiveau() {
    for (let i = 0; i < NIVEAUX.length; i++) if (!PROG.etoiles[i]) return i;
    return NIVEAUX.length - 1;
  }
  function montrer(ecran) {
    S.ecran = ecran;
    $('ecran-titre').hidden = ecran !== 'titre';
    $('ecran-niveaux').hidden = ecran !== 'niveaux';
    $('ecran-collection').hidden = ecran !== 'collection';
    $('hud').hidden = ecran !== 'jeu';
    $('panneau').hidden = ecran !== 'jeu';
    if (ecran !== 'jeu') { $('voile-pause').hidden = true; $('voile-fin').hidden = true; }
  }
  function allerTitre() {
    S.pause = false; S.fin = false; S.carte = false;
    $('voile-nouveaute').hidden = true;
    montrer('titre');
    demarrerDemo();
    $('titre-etoiles').innerHTML = SVG_ETOILE(true);

    if (effacerTitre && effacerTitre.maj) effacerTitre.maj();
    setTimeout(() => { try { $('b-jouer').focus(); } catch (e) { /* rien */ } }, 50);
  }

  function allerNiveaux() {
    S.pause = false; S.fin = false;
    $('voile-nouveaute').hidden = true; S.carte = false;
    const depuisJeu = S.ecran === 'jeu';
    montrer('niveaux');

    const liste = $('liste-niveaux'); liste.innerHTML = '';
    let premier = null;

      const titre = document.createElement('span'); titre.textContent = t(sec.cle);
      h.append(puce, titre); bloc.append(h);
      const grille = document.createElement('div'); grille.className = 'grille';
      for (let n = si * 4; n < si * 4 + 4 && n < NIVEAUX.length; n++) {
        const ouvert = niveauOuvert(n);
        const b = document.createElement('button'); b.type = 'button';
        b.className = 'case-niveau' + (ouvert ? '' : ' ferme') + (ouvert && !PROG.etoiles[n] ? ' nouveau' : '');
        if (ouvert) {
          const num = document.createElement('span'); num.textContent = nb(n + 1);
          const et = document.createElement('span'); et.className = 'mini-etoiles';
          et.innerHTML = [0, 1, 2].map((i) => SVG_ETOILE(i < PROG.etoiles[n])).join('');
          b.append(num, et);

        } else {
          b.innerHTML = SVG_CADENAS; b.disabled = true;

    setTimeout(() => { try { (premier || $('b-niveaux-retour')).focus(); if (premier) premier.scrollIntoView({ block: 'center' }); } catch (e) { /* rien */ } }, 30);
