<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS

      element: element,
      maj: function () {

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },

    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +

    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
'use strict';
// ===========================================================================
// Les Clous du Cercueil — puzzle de clous à arracher dans une crypte en coupe.
// Tout est dessiné par le code (canvas), les sons sont fabriqués par Web Audio.
// ===========================================================================
const JEU = 'les-clous-du-cercueil';
const tr = (cle, vars) => window.JEL_I18N.t(cle, vars);
const $ = (id) => document.getElementById(id);

// <SIM> ---------------------------------------------------------------------
// Simulation de la crypte : une grille de cases, un pas toutes les 50 ms.
// Pure et déterministe (aucun hasard, aucune horloge) : le même niveau et les
// mêmes gestes donnent toujours la même chute.
const T = { VIDE: 0, MUR: 1, PIERRE: 2, CLOU: 3, LAVE: 4, EAU: 5, BRUME: 6, OR: 7, ZOMBIE: 8, SURV: 9, CERCUEIL: 10 };
const PAS_MS = 50;          // durée d'un pas de simulation
const RAT_PAS = 60;         // un rat ronge son clou en 60 pas (3 secondes)
const MARCHE_PAS = 5;       // un mort-vivant avance d'une case tous les 5 pas
const CALME_PAS = 4;        // pas sans mouvement avant de juger la partie
const LETTRES_CASES = { '#': T.MUR, '.': T.VIDE, 'L': T.LAVE, 'W': T.EAU, 'M': T.BRUME, 'G': T.OR, 'Z': T.ZOMBIE, 'S': T.SURV, 'C': T.CERCUEIL, 'P': T.PIERRE };

function creerSim(niv) {
  const lignes = niv.carte;
  const h = lignes.length, w = lignes[0].length;
  const s = {
    w, h, g: new Uint8Array(w * h), pid: new Int8Array(w * h).fill(-1), u: new Int32Array(w * h),
    dx: new Int8Array(w * h), dy: new Int8Array(w * h),
    clous: [], tick: 0, orTotal: 0, orPris: 0, orFondu: 0, morts: 0, tires: 0, tours: 0,
    etat: 'jeu', cause: null, calme: 0, evts: [], prochain: 1, orMin: 0, peutPartir: false, mortsRestants: 0, orRestant: 0,
    tourne: !!niv.tourne,
  };
  const ids = {};
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = lignes[y][x], i = y * w + x;
      if (ch >= 'a' && ch <= 'z') {
        if (ids[ch] === undefined) {
          const r = (niv.rats && niv.rats[ch]) || 0;
          ids[ch] = s.clous.length;
          s.clous.push({ id: s.clous.length, lettre: ch, actif: true, rat: r, ratMax: r });
        }
        s.g[i] = T.CLOU; s.pid[i] = ids[ch];
      } else {
        const t = LETTRES_CASES[ch];
        if (t === undefined) throw new Error('case inconnue ' + ch);
        s.g[i] = t;
        if (t === T.OR) s.orTotal++;
        if (t === T.ZOMBIE || t === T.CERCUEIL) s.mortsRestants++;
      }
      if (s.g[i] >= T.LAVE) s.u[i] = s.prochain++;
    }
  }
  s.orRestant = s.orTotal;
  s.orMin = niv.orMin !== undefined ? niv.orMin : Math.ceil(s.orTotal / 2);
  return s;
}

function cloneSim(s) {
  return {
    ...s, g: s.g.slice(), pid: s.pid.slice(), u: s.u.slice(), dx: s.dx.slice(), dy: s.dy.slice(),
    clous: s.clous.map((c) => ({ ...c })), evts: [],
  };
}

// Arracher un clou : ses cases deviennent vides.
function arracherClou(s, id, parRat) {
  const c = s.clous[id];
  if (!c || !c.actif || s.etat !== 'jeu') return false;
  c.actif = false;
  const cases = [];
  for (let i = 0; i < s.g.length; i++) if (s.pid[i] === id) { s.g[i] = T.VIDE; s.pid[i] = -1; cases.push(i); }
  if (!parRat) s.tires++;
  s.calme = 0;
  s.evts.push({ t: parRat ? 'rat' : 'clou', id, cases });
  return true;
}

// Faire pivoter toute la crypte d'un quart de tour (sens = 1 : sens horaire).
function tournerSim(s, sens) {
  const { w, h } = s;
  const nw = h, nh = w;
  const g = new Uint8Array(w * h), pid = new Int8Array(w * h).fill(-1), u = new Int32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    const nx = sens > 0 ? h - 1 - y : y;
    const ny = sens > 0 ? x : w - 1 - x;
    const j = ny * nw + nx;
    g[j] = s.g[i]; pid[j] = s.pid[i]; u[j] = s.u[i];
  }
  s.g = g; s.pid = pid; s.u = u; s.w = nw; s.h = nh;
  s.dx = new Int8Array(nw * nh); s.dy = new Int8Array(nw * nh);
  s.tours++; s.calme = 0;
  s.evts.push({ t: 'tour', sens });
}

// Partir avec l'or : la crypte est nettoyée, on laisse le reste du trésor.
function partirSim(s) {
  if (s.etat === 'jeu' && s.peutPartir) { s.etat = 'gagne'; s.evts.push({ t: 'gagne' }); }
}

function rongeursActifs(s) {
  for (const c of s.clous) if (c.actif && c.rat > 0) return true;
  return false;
}
function clousActifs(s) {
  let n = 0;
  for (const c of s.clous) if (c.actif) n++;
  return n;
}

// Un pas de simulation.
function pasSim(s) {
  if (s.etat !== 'jeu') return;
  const { w, h, g, u } = s;
  s.tick++;
  s.dx.fill(0); s.dy.fill(0);
  const bouge = new Uint8Array(w * h);
  let mv = false;

  // Les rats rongent leur clou.
  for (const c of s.clous) {
    if (c.actif && c.rat > 0) {
      c.rat--;
      if (c.rat === 0) { arracherClou(s, c.id, true); mv = true; }
    }
  }

  // Position du survivant (les morts marchent vers lui, l'or roule vers lui).
  let sx = -1, sy = -1;
  for (let i = 0; i < g.length; i++) if (g[i] === T.SURV) { sx = i % w; sy = (i / w) | 0; break; }

  const deplacer = (a, b) => {
    const ta = g[a], tb = g[b], ua = u[a], ub = u[b];
    g[b] = ta; u[b] = ua; g[a] = tb; u[a] = ub;
    const ax = a % w, ay = (a / w) | 0, bx = b % w, by = (b / w) | 0;
    s.dx[b] = bx - ax; s.dy[b] = by - ay;
    s.dx[a] = tb ? ax - bx : 0; s.dy[a] = tb ? ay - by : 0;
    bouge[b] = 1; if (tb) bouge[a] = 1;
    mv = true;
  };
  // Une case lourde peut-elle descendre dans la case t ?
  const traversable = (type, t) => t === T.VIDE || t === T.BRUME || ((type === T.OR || type === T.SURV) && t === T.EAU);
  // Cherche, sur la même ligne, la chute la plus proche dans une direction.
  const chercheChute = (x, y, dir, type, vy) => {
    for (let k = 1; k < w; k++) {
      const nx = x + dir * k;
      if (nx < 0 || nx >= w) return -1;
      const c = g[y * w + nx];
      if (!(c === T.VIDE || (type !== T.BRUME && c === T.BRUME) || (type === T.OR && c === T.EAU))) return -1;
      const ny = y + vy;
      if (ny < 0 || ny >= h) return -1;
      const d = g[ny * w + nx];
      if (type === T.BRUME ? d === T.VIDE : traversable(type, d)) return k;
    }
    return -1;
  };
  const sens = (s.tick & 1) ? 1 : -1;
  const choisir = (kg, kd) => {
    if (kg > 0 && (kd < 0 || kg < kd)) return -1;
    if (kd > 0 && (kg < 0 || kd < kg)) return 1;
    if (kd > 0 && kg > 0) return sens;
    return 0;
  };

  // 1. Ce qui tombe (lave, eau, or, morts, survivant), du bas vers le haut.
  for (let y = h - 1; y >= 0; y--) {
    for (let k = 0; k < w; k++) {
      const x = sens > 0 ? k : w - 1 - k;
      const i = y * w + x;
      const t = g[i];
      if (bouge[i] || t < T.LAVE || t === T.BRUME) continue;
      const bas = y + 1 < h ? i + w : -1;
      if (bas >= 0 && traversable(t, g[bas])) { deplacer(i, bas); continue; }
      if (t === T.SURV || t === T.CERCUEIL) continue;
      if (t === T.ZOMBIE) {
        if (bas >= 0 && (g[bas] === T.EAU || g[bas] === T.LAVE)) continue;
        if (sx < 0 || s.tick % MARCHE_PAS !== 0) continue;
        const dir = Math.sign(sx - x);
        if (!dir) continue;
        const nx = x + dir;
        if (nx < 0 || nx >= w) continue;
        const j = y * w + nx;
        const c = g[j];
        if (c === T.VIDE || c === T.BRUME) deplacer(i, j);
        else if (c === T.LAVE || c === T.EAU) { g[i] = T.VIDE; u[i] = 0; s.morts++; mv = true; s.evts.push({ t: c === T.LAVE ? 'brule' : 'noye', x: nx, y }); }
        continue;
      }
      // Or : roule vers le survivant s'il est sur la même ligne.
      if (t === T.OR && sy === y) {
        const dir = Math.sign(sx - x);
        const j = i + dir;
        if (dir && (g[j] === T.VIDE || g[j] === T.EAU || g[j] === T.BRUME)) { deplacer(i, j); continue; }
        if (dir && g[j] === T.OR) continue;
      }
      // Liquide : glisse vers la chute la plus proche.
      let dir = choisir(chercheChute(x, y, -1, t, 1), chercheChute(x, y, 1, t, 1));
      // Pression : une pile de liquide s'étale sur les côtés.
      if (!dir && y > 0 && g[i - w] === t && t !== T.OR) {
        const libreG = x > 0 && g[i - 1] === T.VIDE, libreD = x < w - 1 && g[i + 1] === T.VIDE;
        dir = libreG && libreD ? sens : libreG ? -1 : libreD ? 1 : 0;
      }
      if (dir) deplacer(i, i + dir);
    }
  }

  // 2. La brume verte monte, du haut vers le bas.
  for (let y = 0; y < h; y++) {
    for (let k = 0; k < w; k++) {
      const x = sens > 0 ? k : w - 1 - k;
      const i = y * w + x;
      if (bouge[i] || g[i] !== T.BRUME) continue;
      if (y > 0 && g[i - w] === T.VIDE) { deplacer(i, i - w); continue; }
      let dir = choisir(chercheChute(x, y, -1, T.BRUME, -1), chercheChute(x, y, 1, T.BRUME, -1));
      if (!dir && y < h - 1 && g[i + w] === T.BRUME) {
        const libreG = x > 0 && g[i - 1] === T.VIDE, libreD = x < w - 1 && g[i + 1] === T.VIDE;
        dir = libreG && libreD ? sens : libreG ? -1 : libreD ? 1 : 0;
      }
      if (dir) deplacer(i, i + dir);
    }
  }

  // 3. Les cercueils s'ouvrent quand quelque chose tombe dessus.
  for (let i = w; i < g.length; i++) {
    if (g[i] !== T.CERCUEIL) continue;
    const a = i - w;
    if (bouge[a] && s.dy[a] > 0 && g[a] !== T.VIDE && g[a] !== T.BRUME) {
      g[i] = T.ZOMBIE; u[i] = s.prochain++; mv = true;
      s.evts.push({ t: 'cercueil', x: i % w, y: (i / w) | 0 });
    }
  }

  // 4. Contacts entre voisins.
  const voisins = (i) => {
    const x = i % w, y = (i / w) | 0, r = [];
    if (x > 0) r.push(i - 1);
    if (x < w - 1) r.push(i + 1);
    if (y > 0) r.push(i - w);
    if (y < h - 1) r.push(i + w);
    return r;
  };
  const perdre = (cause, i) => {
    if (s.etat !== 'jeu') return;
    s.etat = 'perdu'; s.cause = cause;
    s.evts.push({ t: 'perdu', cause, x: i % w, y: (i / w) | 0 });
  };
  for (let i = 0; i < g.length; i++) {
    const t = g[i];
    if (t === T.LAVE) {
      for (const j of voisins(i)) {
        const v = g[j];
        if (v === T.EAU) { g[i] = T.PIERRE; u[i] = 0; g[j] = T.VIDE; u[j] = 0; mv = true; s.evts.push({ t: 'pierre', x: i % w, y: (i / w) | 0 }); break; }
        if (v === T.ZOMBIE) { g[j] = T.VIDE; u[j] = 0; s.morts++; mv = true; s.evts.push({ t: 'brule', x: j % w, y: (j / w) | 0 }); }
        else if (v === T.OR) { g[j] = T.VIDE; u[j] = 0; s.orFondu++; mv = true; s.evts.push({ t: 'fond', x: j % w, y: (j / w) | 0 }); }
        else if (v === T.BRUME) { g[j] = T.VIDE; u[j] = 0; mv = true; s.evts.push({ t: 'brumeBrule', x: j % w, y: (j / w) | 0 }); }
        else if (v === T.SURV) perdre('lave', j);
      }
    } else if (t === T.EAU) {
      for (const j of voisins(i)) {
        const v = g[j];
        if (v === T.ZOMBIE) { g[j] = T.VIDE; u[j] = 0; s.morts++; mv = true; s.evts.push({ t: 'noye', x: j % w, y: (j / w) | 0 }); }
        else if (v === T.BRUME) { g[j] = T.VIDE; u[j] = 0; mv = true; s.evts.push({ t: 'brumeLavee', x: j % w, y: (j / w) | 0 }); }
      }
    } else if (t === T.BRUME) {
      for (const j of voisins(i)) if (g[j] === T.SURV) perdre('brume', j);
    } else if (t === T.ZOMBIE) {
      for (const j of voisins(i)) if (g[j] === T.SURV) perdre('zombie', j);
    }
  }
  // L'or qui touche le survivant (même en diagonale) est ramassé.
  if (s.etat === 'jeu') {
    for (let i = 0; i < g.length; i++) {
      if (g[i] !== T.SURV) continue;
      const x = i % w, y = (i / w) | 0;
      for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
        const nx = x + ox, ny = y + oy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const j = ny * w + nx;
        if (g[j] === T.OR) { g[j] = T.VIDE; u[j] = 0; s.orPris++; mv = true; s.evts.push({ t: 'or', x: nx, y: ny }); }
      }
    }
  }

  // 5. Bilan du pas.
  let morts = 0, orRestant = 0, surv = 0;
  for (let i = 0; i < g.length; i++) {
    const t = g[i];
    if (t === T.ZOMBIE || t === T.CERCUEIL) morts++;
    else if (t === T.OR) orRestant++;
    else if (t === T.SURV) surv++;
  }
  s.mortsRestants = morts; s.orRestant = orRestant;
  if (s.etat === 'jeu' && !surv) perdre('lave', 0);
  if (s.etat === 'jeu' && s.orPris + orRestant < s.orMin) {
    s.etat = 'perdu'; s.cause = 'or'; s.evts.push({ t: 'perdu', cause: 'or', x: 0, y: 0 });
  }
  s.calme = mv ? 0 : s.calme + 1;
  s.peutPartir = false;
  if (s.etat === 'jeu' && s.calme >= CALME_PAS && !rongeursActifs(s)) {
    const clous = clousActifs(s);
    // Dans une crypte qui pivote, on peut encore tourner : jamais « coincé ».
    if (morts === 0 && s.orPris >= s.orMin) {
      if (orRestant === 0 || (clous === 0 && !s.tourne)) { s.etat = 'gagne'; s.evts.push({ t: 'gagne' }); }
      else s.peutPartir = true;
    } else if (clous === 0 && !s.tourne) {
      s.etat = 'perdu'; s.cause = 'coince'; s.evts.push({ t: 'perdu', cause: 'coince', x: 0, y: 0 });
    }
  }
}

// Étoiles d'une partie gagnée : 1, +1 si tout l'or est sauvé, +1 si on n'a
// pas arraché plus de clous que nécessaire (« par » du niveau).
function etoilesSim(s, par) {
  if (s.etat !== 'gagne') return 0;
  return 1 + (s.orPris >= s.orTotal ? 1 : 0) + (s.tires <= par ? 1 : 0);
}
// </SIM> --------------------------------------------------------------------

// <NIVEAUX> -----------------------------------------------------------------
// Les 20 cryptes. # mur, . vide, L lave, W eau bénite, M brume verte,
// G pièce d'or, Z mort-vivant, S survivant, C cercueil, P pierre ;

// double tête, arraché d'un seul geste).

// par : clous à arracher au plus pour la 3e étoile ; tourne : crypte pivotante.

// Place de la crypte à l'écran.
function miseEnPage(s, niv) {
  const haut = 62, bas = niv && niv.tourne ? 92 : 84;
  const dimW = niv && niv.tourne ? Math.max(s.w, s.h) : s.w;
  const dimH = niv && niv.tourne ? Math.max(s.w, s.h) : s.h;
  const cs = Math.max(12, Math.floor(Math.min((W - 16) / dimW, (H - haut - bas) / dimH, 92)));
  const gw = cs * s.w, gh = cs * s.h;
  const cx = W / 2, cy = haut + (H - haut - bas) / 2;
  return { cs, ox: Math.round(cx - gw / 2), oy: Math.round(cy - gh / 2), cx, cy };
}

// Petit hasard stable (dessins qui ne changent pas d'une image à l'autre).
function hache(a, b) { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }

// ---------------------------------------------------------------------------
// Décor de la crypte (remplit tout l'écran, téléphone comme ordinateur)
// ---------------------------------------------------------------------------
function dessinerFondStatique(c, w, h) {
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#1c1430'); g.addColorStop(0.6, '#140e22'); g.addColorStop(1, '#0c0814');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  // Briques sur toute la largeur.
  const bh = 26, bw = 56;
  for (let y = 0, r = 0; y < h; y += bh, r++) {
    for (let x = -((r % 2) * bw / 2); x < w; x += bw) {
      const v = hache(Math.round(x), r);
      c.fillStyle = `rgba(${70 + v * 30},${55 + v * 20},${95 + v * 30},${0.22 + v * 0.12})`;
      c.fillRect(x + 2, y + 2, bw - 4, bh - 4);
    }
  }
  // Arches et piliers répétés jusqu'aux bords.
  const pas = Math.max(220, Math.min(320, w / 4));
  for (let x = (w / 2) % pas - pas; x < w + pas; x += pas) {
    c.fillStyle = 'rgba(8,5,14,.55)';
    c.beginPath(); c.moveTo(x + 30, h); c.lineTo(x + 30, h * 0.34); c.arc(x + pas / 2, h * 0.34, pas / 2 - 30, Math.PI, 0); c.lineTo(x + pas - 30, h); c.closePath(); c.fill();
    c.fillStyle = 'rgba(90,72,120,.35)';
    c.fillRect(x - 14, 0, 28, h);
    c.fillStyle = 'rgba(140,120,170,.18)';
    c.fillRect(x - 14, 0, 5, h);
    // Niches à crânes stylisés (formes, pas de texte).
    for (let k = 0; k < 3; k++) {
      const ny = h * (0.42 + k * 0.17), nx = x + pas / 2;
      c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(nx, ny, 26, 18, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = 'rgba(220,210,190,.12)'; c.beginPath(); c.arc(nx, ny - 2, 10, 0, Math.PI * 2); c.fill();
    }
  }
  // Toiles d'araignée dans les coins.
  c.strokeStyle = 'rgba(220,220,240,.10)'; c.lineWidth = 1;
  for (const [ax, ay, sx, sy] of [[0, 0, 1, 1], [w, 0, -1, 1]]) {
    for (let k = 1; k <= 5; k++) { c.beginPath(); c.arc(ax, ay, k * 22, sx > 0 ? 0 : Math.PI / 2, sx > 0 ? Math.PI / 2 : Math.PI); c.stroke(); }
    for (let a = 0; a <= 4; a++) { const an = (a / 4) * Math.PI / 2; c.beginPath(); c.moveTo(ax, ay); c.lineTo(ax + sx * Math.cos(an) * 120, ay + sy * Math.sin(an) * 120); c.stroke(); }
  }
}
function dessinerFond(c, t) {

    const fc = fondCache.getContext('2d'); fc.setTransform(DPR, 0, 0, DPR, 0, 0);
    dessinerFondStatique(fc, W, H);
  }
  c.drawImage(fondCache, 0, 0, W, H);
  // Bougies qui vacillent le long des piliers.
  const pas = Math.max(220, Math.min(320, W / 4));
  for (let x = (W / 2) % pas - pas; x < W + pas; x += pas) {
    for (const yy of [0.3, 0.72]) {
      const by = H * yy, fl = 1 + Math.sin(t / 130 + x) * 0.15 + Math.sin(t / 47 + x * 3) * 0.08;

  for (let i = 0; i < 40; i++) {
    const px = (hache(i, 1) * W + t * 0.006 * (0.5 + hache(i, 2))) % W;

  // Or, cercueils, morts, survivant
  for (let i = 0; i < g.length; i++) {
    const ty = g[i];
    if (ty < T.OR) continue;
    const [px, py] = pos(i);
    const cxp = px + cs / 2, cyp = py + cs / 2;
    if (ty === T.OR) dessinerPiece(c, cxp, cyp + cs * 0.12, cs * 0.3, t, s.u[i]);
    else if (ty === T.CERCUEIL) dessinerCercueil(c, cxp, cyp - cs * 0.05, cs * 0.95, t, s.u[i]);
    else if (ty === T.ZOMBIE) dessinerZombie(c, cxp, cyp - cs * 0.04, cs * 0.98, t, sxp >= 0 ? Math.sign(sxp - cxp) || 1 : 1, s.u[i], false);
    else if (ty === T.SURV) {
      let etat = 'ok';
      if (s.etat === 'perdu') etat = 'mort'; else if (s.etat === 'gagne') etat = 'joie';
      else {
        // Peur quand un danger est tout près.
        const x = i % w, y = (i / w) | 0;
        for (let oy2 = -2; oy2 <= 2 && etat === 'ok'; oy2++) for (let ox2 = -2; ox2 <= 2; ox2++) {
          const nx = x + ox2, ny = y + oy2;
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const v = g[ny * w + nx];
          if (v === T.ZOMBIE || v === T.LAVE || v === T.BRUME) { etat = 'peur'; break; }
        }
      }
      dessinerSurvivant(c, cxp, cyp - cs * 0.04, cs * 0.98, skin, lant, t, etat, 0);
    }
  }
  // Brume verte (par-dessus)
  for (let i = 0; i < g.length; i++) {
    if (g[i] !== T.BRUME) continue;
    const [px, py] = pos(i);
    for (let k = 0; k < 3; k++) {
      const a = t / (700 + k * 200) + hache(s.u[i], k) * 6;
      const r = cs * (0.38 + 0.08 * k);
      c.fillStyle = `rgba(${100 + k * 30},${230 - k * 10},${110},${0.32 - k * 0.06})`;
      c.beginPath(); c.arc(px + cs / 2 + Math.cos(a) * cs * 0.18, py + cs / 2 + Math.sin(a) * cs * 0.18, r, 0, Math.PI * 2); c.fill();
    }
    c.fillStyle = 'rgba(30,60,20,.5)';
    c.beginPath(); c.arc(px + cs * 0.38, py + cs * 0.45, cs * 0.05, 0, Math.PI * 2); c.arc(px + cs * 0.62, py + cs * 0.45, cs * 0.05, 0, Math.PI * 2); c.fill();
  }
  // Clous
  const choisi = opts && opts.choisi;
  for (const cl of s.clous) {
    if (!cl.actif) continue;
    const segs = segmentsClou(s, cl.id);
    const coul = segs.length > 1 ? LAITON : ACIER;
    const tetes = segs.map((sg) => dessinerTige(c, sg, L, 0, 1, coul, choisi === cl.id, t));
    if (segs.length > 1) {
      // Chaîne lumineuse entre les têtes d'un clou double.
      c.save(); c.strokeStyle = `rgba(255,216,122,${0.45 + 0.25 * Math.sin(t / 200)})`; c.lineWidth = 2.5; c.setLineDash([5, 6]); c.lineDashOffset = -t / 40;
      c.beginPath(); c.moveTo(tetes[0].hx, tetes[0].hy);
      for (let k = 1; k < tetes.length; k++) c.lineTo(tetes[k].hx, tetes[k].hy);
      c.stroke(); c.restore();
    }
    if (cl.ratMax > 0 && cl.rat > 0) {
      const sg = segs[0];
      const rx = ox + ((sg.x0 + sg.x1 + 1) / 2) * cs, ry = oy + ((sg.y0 + sg.y1 + 1) / 2) * cs;
      dessinerRat(c, rx, ry - cs * 0.3, cs * 0.95, t, 1);
      const f = cl.rat / cl.ratMax;
      c.lineWidth = Math.max(3, cs * 0.09); c.lineCap = 'round';
      c.strokeStyle = 'rgba(0,0,0,.55)'; c.beginPath(); c.arc(rx, ry - cs * 0.95, cs * 0.24, 0, Math.PI * 2); c.stroke();
      c.strokeStyle = f > 0.35 ? '#ffb347' : '#ff4d4d';
      c.beginPath(); c.arc(rx, ry - cs * 0.95, cs * 0.24, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * f); c.stroke();
    }
  }
}

// ---------------------------------------------------------------------------
// Particules et effets
// ---------------------------------------------------------------------------
let parts = [];
let secousse = 0;
function emettre(n, x, y, o) {
  for (let i = 0; i < n; i++) {
    const a = (o.angle !== undefined ? o.angle : Math.random() * Math.PI * 2) + (Math.random() - 0.5) * (o.ecart !== undefined ? o.ecart : Math.PI * 2);
    const v = (o.vitesse || 2) * (0.4 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 1, duree: (o.duree || 700) * (0.6 + Math.random() * 0.6), taille: (o.taille || 4) * (0.6 + Math.random() * 0.8), couleur: o.couleurs[(Math.random() * o.couleurs.length) | 0], grav: o.grav || 0, forme: o.forme || 'rond' });
  }
}
function majParticules(dt) {
  for (const p of parts) {
    p.vie -= dt / p.duree; p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.vy += p.grav * dt / 16; p.vx *= 0.985;
  }
  parts = parts.filter((p) => p.vie > 0);
  secousse = Math.max(0, secousse - dt / 400);
}
function dessinerParticules(c) {
  for (const p of parts) {
    c.globalAlpha = Math.max(0, Math.min(1, p.vie));
    c.fillStyle = p.couleur;
    if (p.forme === 'etoile') {
      c.save(); c.translate(p.x, p.y); c.rotate(p.vie * 6);
      c.beginPath();
      for (let k = 0; k < 10; k++) { const r = k % 2 ? p.taille * 0.45 : p.taille; c.lineTo(Math.cos(k * Math.PI / 5) * r, Math.sin(k * Math.PI / 5) * r); }
      c.fill(); c.restore();
    } else { c.beginPath(); c.arc(p.x, p.y, p.taille * (p.forme === 'fumee' ? (1.6 - p.vie) : 1), 0, Math.PI * 2); c.fill(); }
  }
  c.globalAlpha = 1;
}

// ---------------------------------------------------------------------------
// État de la partie
// ---------------------------------------------------------------------------
let ecran = 'titre';
let S = null;              // partie en cours
let apercu = 0;            // 1, 2 ou 3 : image du jeu (window.JEL_APERCU)
let affiche = false;       // affiche du jeu (window.JEL_AFFICHE)
let anims = [];            // clous qui sortent du mur
let demo = null;           // démonstration de la fenêtre de nouveauté

function lancerNiveau(n) {
  n = Math.max(0, Math.min(NIVEAUX.length - 1, n));
  const niv = NIVEAUX[n];
  S = { n, niv, sim: creerSim(niv), acc: 0, rot: null, fin: 0, finMontree: false, guide: niv.guide ? 0 : -1, choisi: -1, gele: false, astuceFin: 0 };
  anims = []; parts = [];
  P.ouvert = Math.max(P.ouvert, n + 1);
  $('bas').classList.toggle('tourne', !!niv.tourne);
  majHud();
  if (niv.nouveau && !P.vus[niv.nouveau] && !apercu) ouvrirIntro(niv.nouveau);
  else commencerNiveau();
}
function commencerNiveau() {
  montrer('jeu');
  majAstuce();
}
function majAstuce() {
  const el = $('astuce');
  if (!S || ecran !== 'jeu' || apercu) { el.classList.remove('visible'); return; }
  let txt = '';
  if (S.guide >= 0 && S.niv.guide && S.guide < S.niv.guide.length) txt = tr(S.niv.guide[S.guide].cle);
  else if (S.astuceFin > performance.now()) txt = S.astuceTexte;
  if (el.textContent !== txt) el.textContent = txt;
  el.classList.toggle('visible', !!txt);
}
function majHud() {
  if (!S) return;
  const s = S.sim;
  $('hud-nom').textContent = tr('crypte', { n: S.n + 1 });
  $('hud-morts').lastElementChild.textContent = String(s.mortsRestants);
  $('hud-or').lastElementChild.textContent = tr('fraction', { a: s.orPris, b: s.orTotal });
  $('hud-clous').lastElementChild.textContent = tr('fraction', { a: s.tires, b: S.niv.par });
  const partirVisible = !!(s.peutPartir && s.etat === 'jeu');
  $('b-partir').classList.toggle('visible', partirVisible);
  document.body.classList.toggle('partir', partirVisible);
  document.body.classList.toggle('tourne', !!S.niv.tourne);
}

function arracher(id) {
  if (!S || S.rot || S.sim.etat !== 'jeu' || ecran !== 'jeu') return;
  const s = S.sim;
  if (!s.clous[id] || !s.clous[id].actif) return;
  audio();
  const segs = segmentsClou(s, id);
  if (arracherClou(s, id, false)) {
    anims.push({ segs, debut: performance.now(), double: segs.length > 1 });
    traiterEvts(true);
    if (S.guide >= 0 && S.niv.guide) { const e = S.niv.guide[S.guide]; if (e && e.clou && s.clous.find((c) => c.lettre === e.clou && !c.actif)) { S.guide++; } }
    S.choisi = -1;
    majHud(); majAstuce();
  }
}
function tourner(sens) {
  if (!S || !S.niv.tourne || S.rot || S.sim.etat !== 'jeu' || ecran !== 'jeu') return;
  audio();
  tournerSim(S.sim, sens);
  S.rot = { debut: performance.now(), sens };
  anims = [];
  traiterEvts(true);
  if (S.guide >= 0 && S.niv.guide) { const e = S.niv.guide[S.guide]; if (e && e.tour) S.guide++; }
  majAstuce();
}

// Effets des événements de la simulation.
function traiterEvts(joueur) {
  const s = S.sim;
  const L = miseEnPage(s, S.niv);
  const centre = (x, y) => [L.ox + (x + 0.5) * L.cs, L.oy + (y + 0.5) * L.cs];
  for (const e of s.evts) {
    if (e.t === 'clou' || e.t === 'rat') {
      if (e.t === 'rat') { SONS.rat(); anims.push({ segs: [], debut: performance.now() }); } else SONS.clou();
      for (const i of e.cases) { const [px, py] = centre(i % s.w, (i / s.w) | 0); emettre(3, px, py, { couleurs: ['#fff', '#cfd3dd', '#ffd36b'], vitesse: 2.5, duree: 400, taille: 2 }); }
    } else if (e.t === 'brule') {
      const [px, py] = centre(e.x, e.y);
      SONS.brule(); secousse = Math.max(secousse, 0.5);
      emettre(18, px, py, { couleurs: ['#7aff6a', '#4a6a3a', '#2a2a2a'], vitesse: 1.6, duree: 1100, taille: 6, grav: -0.05, forme: 'fumee' });
      emettre(14, px, py, { couleurs: ['#ffb347', '#ff6a1a', '#ffe08a'], vitesse: 3, duree: 600, taille: 2.5, grav: -0.02 });
    } else if (e.t === 'noye') {
      const [px, py] = centre(e.x, e.y);
      SONS.noye(); secousse = Math.max(secousse, 0.35);
      emettre(20, px, py, { couleurs: ['#e8f7ff', '#9fd8ff', '#ffffff'], vitesse: 2, duree: 900, taille: 3, grav: -0.08 });
      emettre(10, px, py, { couleurs: ['#7aff6a', '#3a5a30'], vitesse: 1.2, duree: 900, taille: 5, grav: -0.04, forme: 'fumee' });
    } else if (e.t === 'pierre') {
      const [px, py] = centre(e.x, e.y);
      SONS.pierre();
      emettre(10, px, py, { couleurs: ['#d8d8e0', '#a0a0b0', '#ffffff'], vitesse: 1.2, duree: 1000, taille: 7, grav: -0.06, forme: 'fumee' });
    } else if (e.t === 'fond') {
      const [px, py] = centre(e.x, e.y);
      SONS.fond();
      emettre(10, px, py, { couleurs: ['#ffcf3a', '#ff8a1a'], vitesse: 2, duree: 600, taille: 2.5, grav: 0.1 });
    } else if (e.t === 'brumeBrule' || e.t === 'brumeLavee') {
      const [px, py] = centre(e.x, e.y);
      if (Math.random() < 0.5) SONS.brume();
      emettre(6, px, py, { couleurs: e.t === 'brumeBrule' ? ['#b6ff6a', '#ffd36b'] : ['#ffffff', '#c8ffd0'], vitesse: 1.5, duree: 600, taille: 3, grav: -0.05 });
    } else if (e.t === 'or') {
      const [px, py] = centre(e.x, e.y);
      SONS.or();
      emettre(8, px, py, { couleurs: ['#ffcf3a', '#fff3a0', '#ffffff'], vitesse: 2.5, duree: 700, taille: 4, grav: -0.03, forme: 'etoile' });
    } else if (e.t === 'cercueil') {
      const [px, py] = centre(e.x, e.y);
      SONS.cercueil(); secousse = Math.max(secousse, 0.4);
      emettre(14, px, py, { couleurs: ['#7d4a2a', '#5a321b', '#c9b08a'], vitesse: 3, duree: 800, taille: 3, grav: 0.12 });
    } else if (e.t === 'tour') {
      SONS.tour(); secousse = Math.max(secousse, 0.6);
    } else if (e.t === 'perdu') {
      const [px, py] = centre(e.x, e.y);
      secousse = 1.2;
      emettre(30, px, py, { couleurs: ['#ffffff', '#ffb347', '#7aff6a', '#3a3a3a'], vitesse: 4, duree: 1100, taille: 5, grav: 0.05 });
      emettre(12, px, py, { couleurs: ['#555', '#333'], vitesse: 1.5, duree: 1400, taille: 9, grav: -0.04, forme: 'fumee' });
      S.fin = performance.now();
    } else if (e.t === 'gagne') {
      S.fin = performance.now();
      for (let k = 0; k < 4; k++) emettre(20, W * (0.2 + k * 0.2), H * 0.3, { couleurs: ['#ffcf3a', '#ff9b3d', '#b6ff6a', '#a8d8ff', '#ffffff'], vitesse: 5, duree: 1600, taille: 5, grav: 0.12, forme: k % 2 ? 'etoile' : 'rond', angle: -Math.PI / 2, ecart: 2.4 });
    }
  }
  s.evts.length = 0;
}

// Boucle principale
let tPrec = performance.now();
function boucle(t) {
  const dt = Math.min(64, t - tPrec); tPrec = t;
  if (affiche) { dessinerAfficheImage(t); requestAnimationFrame(boucle); return; }
  if (S && ecran === 'jeu' && !S.gele) {
    if (S.rot) {
      if (t - S.rot.debut > 480) S.rot = null;
    } else if (S.sim.etat === 'jeu') {
      S.acc += dt;
      let n = 0;
      while (S.acc >= PAS_MS && n < 4) {
        const avant = S.sim.clous.map((c) => c.rat);
        pasSim(S.sim); n++;
        S.acc -= PAS_MS;
        if (S.sim.clous.some((c, i) => c.actif && c.rat > 0 && c.rat % 10 === 0 && avant[i] !== c.rat)) SONS.ronge();
        traiterEvts(false);
      }
      majHud();
      majAstuce();
    }
    if (S.sim.etat !== 'jeu' && !S.finMontree && t - S.fin > (S.sim.etat === 'gagne' ? 900 : 1300)) {
      S.finMontree = true;
      if (S.sim.etat === 'gagne') montrerVictoire(); else montrerDefaite();
    }
  }
  if (S && ecran === 'jeu' && !S.gele) majParticules(dt);
  dessiner(t);
  if (ecran === 'intro' && demo) dessinerDemo(t, dt);
  requestAnimationFrame(boucle);
}

function dessiner(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  dessinerFond(ctx, t);
  if (!S) dessinerDecorTitre(ctx, t);
  if (S && (ecran === 'jeu' || ecran === 'pause' || ecran === 'victoire' || ecran === 'defaite' || ecran === 'intro' || ecran === 'fin')) {
    const s = S.sim;
    const L = miseEnPage(s, S.niv);
    const alpha = S.sim.etat === 'jeu' && !S.gele ? Math.min(1, S.acc / PAS_MS) : 1;
    ctx.save();
    if (secousse > 0) ctx.translate((Math.random() - 0.5) * 10 * secousse, (Math.random() - 0.5) * 10 * secousse);
    // Cadre de pierre autour de la crypte
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(L.ox - 10, L.oy - 10, s.w * L.cs + 20, s.h * L.cs + 20);
    if (S.rot) {
      const p = Math.min(1, (t - S.rot.debut) / 480);
      const e = 1 - Math.pow(1 - p, 3);
      ctx.translate(L.cx, L.cy); ctx.rotate(-S.rot.sens * (Math.PI / 2) * (1 - e)); ctx.translate(-L.cx, -L.cy);
    }
    dessinerCrypte(ctx, s, L, alpha, t, { choisi: S.choisi, graine: S.n });
    // Clous qui sortent du mur
    for (const a of anims) {
      const p = (t - a.debut) / 320;
      if (p >= 1) continue;
      for (const sg of a.segs) dessinerTige(ctx, sg, L, p * 0.9, 1 - p, a.double ? LAITON : ACIER, false, t);
    }
    anims = anims.filter((a) => t - a.debut < 320);
    // Main du tutoriel
    if (ecran === 'jeu' && S.guide >= 0 && S.niv.guide && S.guide < S.niv.guide.length && !S.rot) {
      const e = S.niv.guide[S.guide];
      let hx = -1, hy = -1;
      if (e.clou) {
        const cl = s.clous.find((c) => c.lettre === e.clou && c.actif);
        if (cl) { const sg = segmentsClou(s, cl.id)[0]; hx = L.ox + ((sg.x0 + sg.x1 + 1) / 2) * L.cs; hy = L.oy + ((sg.y0 + sg.y1 + 1) / 2) * L.cs; }
      }
      if (e.tour) {
        const r = $('b-tourner-d').getBoundingClientRect();
        if (r.width) { hx = r.left - 8; hy = r.top - 26; }
      }
      if (hx >= 0) dessinerMain(ctx, hx, hy, Math.max(44, L.cs), t);
    }
    ctx.restore();
    dessinerParticules(ctx);
  }
}

// Décor de l'écran titre : la survivante, un cercueil cloué et un mort qui approche.
function dessinerDecorTitre(c, t) {
  const large = W >= 700;
  const taille = large ? Math.min(H * 0.3, W * 0.17) : Math.min(H * 0.08, W * 0.2);
  const y = large ? H * 0.64 : H * 0.705;
  const xs = large ? W * 0.16 : W * 0.24, xz = large ? W * 0.84 : W * 0.76;
  // Flaque de lumière de la lanterne
  const lant = lanterneChoisie().rgb;
  const g = c.createRadialGradient(xs, y, 4, xs, y, taille * 1.8);
  g.addColorStop(0, rgba(lant, 0.35)); g.addColorStop(1, rgba(lant, 0));
  c.fillStyle = g; c.fillRect(xs - taille * 2, y - taille * 2, taille * 4, taille * 4);
  dessinerSurvivant(c, xs, y, taille, survivantChoisi(), lant, t, 'peur', 1);
  const avance = Math.sin(t / 1400) * taille * 0.15;
  dessinerZombie(c, xz + avance, y, taille, t, -1, 3, Math.sin(t / 700) > 0.6);
  // Cercueil cloué au milieu, avec des pièces d'or
  const xc = W / 2, yc = large ? H * 0.9 : y + taille * 0.1;
  if (!large) {
    dessinerCercueil(c, xc, yc, taille * 0.9, t, 5);
    for (let k = 0; k < 3; k++) dessinerPiece(c, xc - taille * 0.3 + k * taille * 0.3, yc + taille * 0.42, taille * 0.11, t, k);
  } else {
    for (let k = 0; k < 7; k++) dessinerPiece(c, xs + taille * 0.55 + (k % 4) * taille * 0.16, y + taille * 0.42 - Math.floor(k / 4) * taille * 0.14, taille * 0.08, t, k);
  }
}

// Main animée qui touche un clou (tutoriel).
function dessinerMain(c, x, y, cs, t) {
  const p = (t % 1400) / 1400;
  const appui = p < 0.35 ? p / 0.35 : p < 0.5 ? 1 : Math.max(0, 1 - (p - 0.5) / 0.3);
  const k = Math.max(0.8, cs / 44);
  c.save(); c.translate(x + 6 * k, y + (8 + (1 - appui) * 16) * k); c.scale(k, k);
  if (appui > 0.9) { c.strokeStyle = 'rgba(255,211,107,.8)'; c.lineWidth = 3; c.beginPath(); c.arc(-6, -8, 16 + (p - 0.35) * 40, 0, Math.PI * 2); c.stroke(); }
  c.fillStyle = '#fff1df'; c.strokeStyle = '#3a2a1a'; c.lineWidth = 2;
  c.beginPath();
  c.moveTo(-8, -10); c.quadraticCurveTo(-8, -16, -4, -16); c.quadraticCurveTo(0, -16, 0, -10); c.lineTo(0, 2);
  c.quadraticCurveTo(6, 0, 8, 4); c.quadraticCurveTo(14, 4, 14, 10); c.lineTo(14, 20); c.quadraticCurveTo(14, 30, 4, 30); c.lineTo(-6, 30);
  c.quadraticCurveTo(-14, 30, -16, 20); c.lineTo(-18, 10); c.quadraticCurveTo(-18, 6, -12, 8); c.lineTo(-8, 12); c.closePath();
  c.fill(); c.stroke();
  c.restore();
}

// ---------------------------------------------------------------------------
// Entrées : toucher, souris, clavier
// ---------------------------------------------------------------------------
function clouSous(px, py) {
  if (!S) return -1;
  const s = S.sim, L = miseEnPage(s, S.niv);
  const marge = Math.max(L.cs * 0.25, (44 - L.cs * 0.5) / 2 + 6);
  let meilleur = -1, dist = Infinity;
  for (const cl of s.clous) {
    if (!cl.actif) continue;
    for (const sg of segmentsClou(s, cl.id)) {
      const x0 = L.ox + sg.x0 * L.cs - (sg.horiz ? L.cs * 0.35 : marge - L.cs * 0.25);
      const x1 = L.ox + (sg.x1 + 1) * L.cs + (sg.horiz ? L.cs * 0.35 : marge - L.cs * 0.25);
      const y0 = L.oy + sg.y0 * L.cs - (sg.horiz ? marge - L.cs * 0.25 : L.cs * 0.35);
      const y1 = L.oy + (sg.y1 + 1) * L.cs + (sg.horiz ? marge - L.cs * 0.25 : L.cs * 0.35);
      const ey = sg.horiz ? Math.max(0, Math.abs(py - (y0 + y1) / 2) - L.cs * 0.05) : 0;
      const ex = !sg.horiz ? Math.max(0, Math.abs(px - (x0 + x1) / 2) - L.cs * 0.05) : 0;
      if (px >= x0 && px <= x1 && py >= y0 && py <= y1) { const d = ex + ey; if (d < dist) { dist = d; meilleur = cl.id; } }
    }
  }
  return meilleur;
}

function clousTries() {
  const s = S.sim;
  return s.clous.filter((c) => c.actif).map((c) => { const sg = segmentsClou(s, c.id)[0]; return { id: c.id, k: sg.y0 * 100 + sg.x0 }; }).sort((a, b) => a.k - b.k).map((o) => o.id);
}
document.addEventListener('keydown', (ev) => {
  const code = ev.code;
  if (ecran === 'jeu' && S) {
    if (code === 'Escape' || code === 'KeyP') { ev.preventDefault(); ouvrirPause(); return; }
    if (code === 'KeyM') { basculerSon(); return; }
    if (code === 'KeyR') { ev.preventDefault(); recommencer(); return; }
    if (code === 'ArrowUp' && S.niv.tourne) { ev.preventDefault(); tourner(-1); return; }
    if (code === 'ArrowDown' && S.niv.tourne) { ev.preventDefault(); tourner(1); return; }
    if (code === 'ArrowLeft' || code === 'ArrowRight' || code === 'Tab') {
      if (document.activeElement && document.activeElement !== document.body && code === 'Tab') return;
      ev.preventDefault();
      const l = clousTries(); if (!l.length) return;
      let k = l.indexOf(S.choisi);
      k = code === 'ArrowLeft' ? (k <= 0 ? l.length - 1 : k - 1) : (k + 1) % l.length;
      S.choisi = l[k]; audio(); SONS.clic(); return;
    }
    if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault();
      if (S.choisi >= 0) arracher(S.choisi);
      else if (S.sim.peutPartir) partir();
      else { const l = clousTries(); if (l.length) { S.choisi = l[0]; SONS.clic(); } }
      return;
    }
  } else if (ecran === 'titre') {
    if ((code === 'Enter' || code === 'Space') && document.activeElement === document.body) { ev.preventDefault(); boutonJouer(); }
  } else if (ecran === 'pause') {
    if (code === 'Escape' || code === 'KeyP') { ev.preventDefault(); reprendre(); }
  } else if (ecran === 'niveaux' || ecran === 'caveau') {
    if (code === 'Escape') { ev.preventDefault(); allerAccueil(); }
  } else if (ecran === 'intro') {
    if (code === 'Escape') { ev.preventDefault(); fermerIntro(); }
  }
});

function dessinerDemo(t, dt) {
  const c = $('demo').getContext('2d');

  c.save();
  if (demo.rot) { const p = Math.min(1, (t - demo.rot.debut) / 480); const e = 1 - Math.pow(1 - p, 3); c.translate(L.cx, L.cy); c.rotate(-(Math.PI / 2) * (1 - e)); c.translate(-L.cx, -L.cy); }
  dessinerCrypte(c, s, L, demo.rot ? 1 : Math.min(1, demo.acc / PAS_MS), t, {});
  for (const a of demo.anims) { const p = (t - a.debut) / 320; if (p < 1) for (const sg of a.segs) dessinerTige(c, sg, L, p * 0.9, 1 - p, a.segs.length > 1 ? LAITON : ACIER, false, t); }
  c.restore();

function montrerVictoire() {
  const s = S.sim, n = S.n;

  const totalAvant = totalEtoiles();
  P.etoiles[n] = Math.max(avant, et);

  sauverPartie(Math.min(NIVEAUX.length, n + 2));
  if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
  if (P.etoiles.every((x) => x > 0)) {

  }
  SONS.victoire();

  [...ze.children].forEach((el, k) => setTimeout(() => { el.classList.add('pop'); if (k < et) SONS.etoile(k); }, 250 + k * 260));

  $('vic-debloque').textContent = neufs.length ? tr('debloque', { nom: neufs.join(', ') }) : '';

function dessinerAfficheImage(t) {

  c.fillStyle = rayon; c.beginPath(); c.moveTo(w * 0.28, 0); c.lineTo(w * 0.5, 0); c.lineTo(w * 0.78, h * 0.85); c.lineTo(w * 0.36, h * 0.85); c.fill();
  // Corniche de pierre en haut, avec la poche de lave éventrée.

  c.fillStyle = ng; c.fillRect(0, -11, w * 0.34, 22);

    const p = ((t / 2200) + k / 16) % 1;
    const x = w * (0.78 - p * 0.18) + Math.sin(k * 3) * 30, y = h * (0.2 + p * 0.42);
    dessinerPiece(c, x, y, 15, t, k);
  }
  // Coffre ouvert et tas d'or.
  c.fillStyle = '#6b3d1e'; c.fillRect(w * 0.7, h * 0.63, w * 0.22, h * 0.08);
  c.fillStyle = '#8a5530'; c.fillRect(w * 0.7, h * 0.585, w * 0.22, h * 0.05);
  c.fillStyle = '#c9a24a'; c.fillRect(w * 0.7, h * 0.63, w * 0.22, 6); c.fillRect(w * 0.8, h * 0.63, 10, h * 0.08);
  for (let k = 0; k < 12; k++) dessinerPiece(c, w * (0.68 + (k % 6) * 0.045), h * (0.725 - Math.floor(k / 6) * 0.025), 13, t, k + 30);
  // La survivante, en grand, lanterne levée.
  const sk = survivantChoisi(), lant = lanterneChoisie().rgb;
  const sh = c.createRadialGradient(w * 0.58, h * 0.4, 20, w * 0.58, h * 0.45, w * 0.55);
  sh.addColorStop(0, rgba(lant, 0.5)); sh.addColorStop(1, rgba(lant, 0));
  c.fillStyle = sh; c.fillRect(0, 0, w, h);
  dessinerSurvivant(c, w * 0.52, h * 0.53, h * 0.38, sk, lant, 1000, 'peur', 1);
  // Premier plan : coin d'un cercueil, clous plantés, sol sombre pour le bandeau du titre.
  c.fillStyle = '#0d0916'; c.fillRect(0, h * 0.78, w, h * 0.22);
  c.fillStyle = '#2a1a12';
  c.beginPath(); c.moveTo(-20, h * 0.68); c.lineTo(w * 0.3, h * 0.73); c.lineTo(w * 0.34, h * 0.86); c.lineTo(-20, h * 0.9); c.fill();
  c.fillStyle = '#4a2c18';
  c.beginPath(); c.moveTo(-20, h * 0.68); c.lineTo(w * 0.3, h * 0.73); c.lineTo(w * 0.29, h * 0.76); c.lineTo(-20, h * 0.72); c.fill();
  c.fillStyle = '#c9b08a'; c.fillRect(w * 0.12, h * 0.71, 8, h * 0.08); c.fillRect(w * 0.08, h * 0.735, w * 0.1, 8);
  for (const px of [0.05, 0.25]) { c.fillStyle = '#d8d8e0'; c.beginPath(); c.arc(w * px, h * 0.705, 6, 0, Math.PI * 2); c.fill(); }
  // Brume verte au ras du sol.
  for (let k = 0; k < 10; k++) {
    c.fillStyle = `rgba(110,240,130,${0.12 + (k % 3) * 0.04})`;
    c.beginPath(); c.ellipse(w * (k / 9) + Math.sin(t / 900 + k) * 20, h * 0.79, 70, 22, 0, 0, Math.PI * 2); c.fill();
  }
  // Toile d'araignée en haut à droite.
  c.strokeStyle = 'rgba(230,230,250,.25)'; c.lineWidth = 1.5;
  for (let k = 1; k <= 4; k++) { c.beginPath(); c.arc(w, 0, k * 26, Math.PI / 2, Math.PI); c.stroke(); }
}

// ---------------------------------------------------------------------------
// Images du jeu (window.JEL_APERCU = 1, 2 ou 3, posé par le robot du site) :
// la vraie partie, en pleine action, puis figée (ni son, ni sauvegarde).
// ---------------------------------------------------------------------------
function ouvrirApercu(n) {
  apercu = n;
  const plan = n === 1 ? { niveau: 0, avant: 0, clous: ['a'], apres: 1 }
    : n === 2 ? { niveau: 9, avant: 24, clous: ['b'], apres: 3 }
      : { niveau: 17, avant: 0, clous: ['b'], apres: 6 };
  lancerNiveau(plan.niveau);
  S.guide = -1;
  const s = S.sim;
  for (let k = 0; k < plan.avant; k++) { pasSim(s); traiterEvts(false); }
  for (const l of plan.clous) { const cl = s.clous.find((c) => c.lettre === l); if (cl) arracherClou(s, cl.id); traiterEvts(false); }
  for (let k = 0; k < plan.apres; k++) { pasSim(s); traiterEvts(false); }
  S.acc = PAS_MS * 0.6;
  montrer('jeu');
  majHud();
  S.gele = true;
  $('astuce').classList.remove('visible');
}

// ---------------------------------------------------------------------------
// Démarrage
// ---------------------------------------------------------------------------
redimensionner();
chargerProgression();
majBoutonsSon();
const numeroApercu = Number(window.JEL_APERCU);
if (window.JEL_AFFICHE) demarrerAffiche();
else if (numeroApercu === 1 || numeroApercu === 2 || numeroApercu === 3) ouvrirApercu(numeroApercu);
else montrer('titre');
requestAnimationFrame(boucle);
</script>
