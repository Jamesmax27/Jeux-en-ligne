  c.fillStyle = '#c9853f'; c.fillRect(0, 320, 480, 40);
  c.save(); c.scale(0.4, 0.4);
  const cyc = (t % 2.4) / 2.4;
  let bx = 0, by = 0, type = 'n';
  const T = TERRAINS.gym;
  if (cle === 'bois') {
    // Tir à ras du sol, le panneau incliné renvoie le ballon vers le haut, il retombe dans le panier
    dessinerBois(c, [820, 790, 1120, 520]);
    dessinerPanier(c, { x: 930, y: 260, dos: 1 }, t, cyc > 0.88 ? 1 : 0);
    if (cyc < 0.4) { const k = cyc / 0.4; bx = lerp(160, 900, k); by = 730 - Math.sin(k * PI) * 30; }
    else if (cyc < 0.75) { const k = (cyc - 0.4) / 0.35; bx = lerp(900, 935, k); by = 730 - (1 - (1 - k) * (1 - k)) * 640; }
    else { const k = (cyc - 0.75) / 0.25; bx = 935; by = 90 + k * k * 260; }
  } else if (cle === 'tramp') {
    dessinerTramp(c, [500, 770, 760, 770], cyc > 0.4 && cyc < 0.55 ? 1 : 0);
    dessinerPanier(c, { x: 950, y: 360, dos: 1 }, t, 0);
    if (cyc < 0.45) { const k = cyc / 0.45; bx = lerp(150, 630, k); by = lerp(400, 730, k * k); }
    else { const k = (cyc - 0.45) / 0.55; bx = lerp(630, 950, k); by = 730 - Math.sin(k * PI * 0.8) * 520 + k * 80; }
  } else if (cle === 'vent') {
    const v = { x: 300, y: 150, w: 800, h: 260, dx: 1, dy: 0, f: 1 };
    dessinerVentilo(c, v, t);
    const k = cyc; bx = lerp(150, 1050, k); by = 700 - Math.sin(k * PI) * 420 + (k > 0.3 ? -40 : 0);
  } else if (cle === 'rail') {
    const p = { x: 600, y: 420, dos: 1, rail: { ax: 280, w: 2.6 } };
    dessinerPanier(c, p, t, 0);
    bx = -100; by = -100;
  } else if (cle === 'deux') {
    dessinerBois(c, [300, 560, 620, 680]);
    dessinerPanier(c, { x: 380, y: 360, dos: -1 }, t, 0);
    dessinerPanier(c, { x: 920, y: 760, dos: 1 }, t, 0);
    if (cyc < 0.35) { const k = cyc / 0.35; bx = lerp(150, 380, k); by = lerp(780, 300, k) - Math.sin(k * PI) * 120; }
    else if (cyc < 0.55) { const k = (cyc - 0.35) / 0.2; bx = lerp(380, 470, k); by = lerp(300, 580, k); }
    else { const k = (cyc - 0.55) / 0.45; bx = lerp(470, 920, k); by = lerp(580, 790, k) - Math.sin(k * PI) * 160; }
  } else if (cle === 'leger' || cle === 'lourd') {
    type = cle;
    const v = { x: 300, y: 100, w: 800, h: 300, dx: -1, dy: 0, f: 1 };
    dessinerVentilo(c, v, t);
    const k = cyc;
    if (cle === 'leger') { bx = lerp(200, 650, k) - Math.max(0, k - 0.3) * 300; by = 720 - Math.sin(k * PI) * 520; }
    else { bx = lerp(200, 900, k); by = 720 - Math.sin(k * PI) * 260; }
  } else if (cle === 'tourne') {
    c.save(); c.translate(600, 450); c.rotate(Math.sin(t * 1.4) * 0.22); c.translate(-600, -450);
    c.strokeStyle = T.cadre; c.lineWidth = 16; c.strokeRect(120, 60, 960, 760);
    dessinerPanier(c, { x: 850, y: 380, dos: 1 }, t, 0);
    dessinerBallon(c, 300, 700, 50, 'n', prog.ballon, t * 2);
    c.restore();
    bx = -100; by = -100;
  }
  if (bx > -50) dessinerBallon(c, bx, by, 50, type, prog.ballon, t * 4);
  c.restore();
}
function mettrePause() {
  if (etat !== 'jeu') return;
  etat = 'pause';
  doigt = null; visee = null; touches = {};
  try { if (Son.ctx && Son.ctx.state === 'running') Son.ctx.suspend(); } catch (e) { /* rien */ }
  $('#pause').hidden = false;
}
function reprendre() {
  if (etat !== 'pause') return;
  try { if (Son.ctx) Son.ctx.resume(); } catch (e) { /* rien */ }
  $('#pause').hidden = true;
  etat = 'jeu'; reste = 0;
}

/* ---------------------------------------------------------------------
   Affiche (jaquette du jeu) : window.JEL_AFFICHE
   --------------------------------------------------------------------- */
function dessinerAffiche(t) {
  const c = ctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const k = Math.min(W / 600, H / 800);
  c.fillStyle = '#f0c98c'; c.fillRect(0, 0, W, H);
  c.save();
  c.translate((W - 600 * k) / 2, (H - 800 * k) / 2); c.scale(k, k);
  // Gymnase lumineux, grande fenêtre et soleil derrière le panier
  const g = c.createLinearGradient(0, 0, 0, 800);
  g.addColorStop(0, '#ffe8b8'); g.addColorStop(0.6, '#f2c07a'); g.addColorStop(1, '#d8924a');
  c.fillStyle = g; c.fillRect(-300, 0, 1200, 800);
  for (let x = -300; x < 900; x += 40) { c.fillStyle = (Math.floor(x / 40) % 2) ? 'rgba(160,100,40,.08)' : 'rgba(255,255,255,.08)'; c.fillRect(x, 0, 40, 620); }
  // Fenêtre et soleil
  c.fillStyle = '#bfe8ff'; c.fillRect(300, 40, 260, 200);
  const sg = c.createRadialGradient(470, 110, 10, 470, 110, 360);
  sg.addColorStop(0, 'rgba(255,255,230,1)'); sg.addColorStop(0.2, 'rgba(255,240,180,.85)'); sg.addColorStop(1, 'rgba(255,230,160,0)');
  c.fillStyle = sg; c.fillRect(0, 0, 900, 800);
  c.strokeStyle = '#8a5a2a'; c.lineWidth = 10; c.strokeRect(300, 40, 260, 200);
  c.beginPath(); c.moveTo(430, 40); c.lineTo(430, 240); c.moveTo(300, 140); c.lineTo(560, 140); c.stroke();
  // Rayons de lumière
  c.fillStyle = 'rgba(255,250,220,.22)';
  for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(470, 110); c.lineTo(-100 + i * 90, 800); c.lineTo(-60 + i * 90, 800); c.closePath(); c.fill(); }
  // Gradins flous au fond, avec public
  const r = alea(42);
  for (let rang = 0; rang < 4; rang++) {
    const y = 600 - rang * 40;
    c.fillStyle = rang % 2 ? 'rgba(150,95,45,.75)' : 'rgba(130,82,38,.75)';
    c.fillRect(-300, y, 280 + 300, 22);
    for (let x = -290; x < -20; x += 26) { if (r() < 0.2) continue; c.fillStyle = ['#e63946', '#2f7de1', '#ffd34a', '#27a85a', '#ff8de0'][Math.floor(r() * 5)]; c.fillRect(x - 8, y - 16, 16, 18); c.fillStyle = '#f2c7a0'; c.beginPath(); c.arc(x, y - 23, 7, 0, PI * 2); c.fill(); }
  }
  // Fanions
  for (let x = -10; x < 620; x += 34) { c.fillStyle = ['#e63946', '#2f7de1', '#ffd34a', '#27a85a'][Math.floor((x + 10) / 34) % 4]; const yy = 285 + 22 * Math.sin(PI * (x + 10) / 640); c.beginPath(); c.moveTo(x, yy); c.lineTo(x + 26, yy); c.lineTo(x + 13, yy + 30); c.closePath(); c.fill(); }
  // Sol en parquet
  const gs = c.createLinearGradient(0, 620, 0, 800); gs.addColorStop(0, '#d18c45'); gs.addColorStop(1, '#a86425');
  c.fillStyle = gs; c.fillRect(-300, 620, 1200, 180);
  c.strokeStyle = 'rgba(0,0,0,.12)'; c.lineWidth = 2;
  for (let x = -300; x < 900; x += 36) { c.beginPath(); c.moveTo(x, 620); c.lineTo(x - 40, 800); c.stroke(); }
  c.fillStyle = '#fff4dc'; c.fillRect(-300, 640, 1200, 5);
  // Le panier, en entier, à droite (planche, filet qui ondule)
  c.save(); c.translate(450, 330); c.scale(0.95, 0.95);
  dessinerPanier(c, { x: 0, y: 0, dos: 1 }, t, 0.8);
  c.restore();
  // Traînée du ballon : un rebond sur le mur de gauche, puis l'arc jusqu'au panier
  const pts = pointsChemin([[150, 360], [40, 250], [180, 130], [330, 120], [440, 250]], 16);
  pts.forEach((p, i) => { const k = i / pts.length; c.fillStyle = 'rgba(255,255,255,' + (0.25 + k * 0.6).toFixed(2) + ')'; c.beginPath(); c.arc(p[0], p[1], 4 + k * 9, 0, PI * 2); c.fill(); });
  // Petite étoile du rebond sur le mur
  c.fillStyle = '#fff6c8'; etoileForme(c, 34, 250, 22, 0.3); c.fill();
  // Le ballon, qui tombe dans le filet, avec un contour lumineux
  const bx = 450, by = 285;
  c.fillStyle = 'rgba(255,240,180,.75)'; c.beginPath(); c.arc(bx, by, 62, 0, PI * 2); c.fill();
  dessinerBallon(c, bx, by, 46, 'n', 'classique', 0.6);
  // Moitié avant de l'anneau, devant le ballon
  c.strokeStyle = '#ff5a1f'; c.lineWidth = 8.5;
  c.beginPath(); c.ellipse(450, 330, DEMI_ANNEAU * 0.95, 10.5, 0, 0, PI); c.stroke();
  // Étoiles qui jaillissent du filet
  for (let i = 0; i < 11; i++) { const a = i * 0.58 + t * 0.6, rr = 90 + (i % 3) * 34; c.fillStyle = ['#ffe27a', '#ffffff', '#ffd84a'][i % 3]; etoileForme(c, 450 + Math.cos(a) * rr * 0.9, 330 + Math.sin(a) * rr * 0.55, 11 + (i % 3) * 5, a); c.fill(); }
  // L'enfant en grand, qui saute de joie, bras levés (35 à 60 % de la hauteur)
  c.fillStyle = 'rgba(90,50,20,.25)'; c.beginPath(); c.ellipse(190, 690, 90, 16, 0, 0, PI * 2); c.fill();
  c.save();
  c.translate(0, -36);
  c.shadowColor = 'rgba(255,250,220,.95)'; c.shadowBlur = 26;
  dessinerEnfant(c, 190, 690, 430, 0.999, 'rouge', 0, 1);
  c.restore();
  // Premier plan : ballons du chariot, coupés par le bord
  c.fillStyle = '#5c6b80'; c.fillRect(-10, 690, 220, 22);
  dessinerBallon(c, 40, 700, 56, 'n', 'ciel', 0.3);
  dessinerBallon(c, 150, 720, 56, 'n', 'classique', -0.5);
  dessinerBallon(c, 560, 740, 70, 'leger', 'classique', 0.8);
  c.restore();
}

/* ---------------------------------------------------------------------
   Images du jeu (page du jeu) : window.JEL_APERCU = 1, 2 ou 3
   --------------------------------------------------------------------- */
const APERCUS = {
  1: { niveau: 0, visee: { dx: 150, dy: -200 }, fantome: { dx: 140, dy: -215, duree: 1.0 } },
  // Ballon en plein vol, posé à la main : rebond sur le trampoline puis souffle du ventilateur
  2: { niveau: 7, ballon: 1, vol: { x: 640, y: 560, vx: 160, vy: -900, chemin: [[170, 1040], [380, 1110], [590, 1145], [620, 860], [640, 560]] } },
  // Finale : rebond sur le panneau au sol, le ballon monte entre les deux paniers
  3: { niveau: 19, ballon: 2, t0: 1.1, vol: { x: 716, y: 575, vx: 10, vy: -1500, chemin: [[170, 1040], [430, 1028], [690, 1012], [712, 820], [716, 575]] } },
};
// Points réguliers le long d'une ligne brisée (traînée du ballon)
function pointsChemin(ch, pasL) {
  const pts = [];
  for (let i = 0; i < ch.length - 1; i++) {
    const [x1, y1] = ch[i], [x2, y2] = ch[i + 1];
    const n = Math.max(1, Math.round(Math.hypot(x2 - x1, y2 - y1) / pasL));
    for (let k = 0; k < n; k++) pts.push([lerp(x1, x2, k / n), lerp(y1, y2, k / n)]);
  }
  return pts;
}
function ouvrirApercu(n) {
  const a = APERCUS[n] || APERCUS[1];
  lancerNiveau(a.niveau);
  $('#intro').hidden = true; etat = 'jeu'; tuto = false;
  const b = $('#banniere'); b.classList.remove('vu'); b.textContent = '';
  $('#aide').hidden = true;
  prog.ballon = n === 3 ? 'soleil' : 'classique';
  prog.maillot = n === 2 ? 'bleu' : n === 3 ? 'violet' : 'rouge';
  if (a.t0) monde.t = a.t0;
  if (a.fantome) {
    lancerBalle(monde, 'n', a.fantome.dx, a.fantome.dy);
    const pts = [];
    for (let i = 0; i < a.fantome.duree / DT; i++) { pas(monde); if (i % 10 === 0) pts.push([monde.balle.x, monde.balle.y]); }
    fantome = pts; monde.balle = null; iBallon = 1;
    visee = a.visee; majHud();
  }
  if (a.vol) {
    iBallon = a.ballon || 1;
    const b = lancerBalle(monde, typeActuel(), 1, -1);
    Object.assign(b, { x: a.vol.x, y: a.vol.y, vx: a.vol.vx, vy: a.vol.vy, rebonds: 1 });
    sousEtat = 'vol'; majHud();
    traces = pointsChemin(a.vol.chemin, 30);
    pose = 0.45;
    if (n === 2) trampVague[0] = 0.6;
  }
  apparition = 1;
  fige = true;
  setTimeout(() => { $('#aide').hidden = true; }, 50);
}

/* ---------------------------------------------------------------------
   Boutons
   --------------------------------------------------------------------- */
$('#btnJouer').addEventListener('click', () => {
  Son.init(); Son.clic();
  window.JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => { lireSauvegarde(); lancerNiveau(clamp((parseInt(d.niveau, 10) || 1) - 1, 0, NIVEAUX.length - 1)); },
    onNouvelle: () => { lancerNiveau(0); },
    onEffacer: () => { lireSauvegarde(); lancerNiveau(0); },
  });
});
$('#btnNiveaux').addEventListener('click', () => { Son.init(); Son.clic(); montrerNiveaux(); });
$('#btnVestiaire').addEventListener('click', () => { Son.init(); Son.clic(); montrerVestiaire(); });
$$('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
$('#btnPause').innerHTML = SVG_PAUSE;
$('#btnPause').addEventListener('click', () => { Son.init(); Son.clic(); mettrePause(); });
$$('.retour').forEach((b) => b.addEventListener('click', () => { Son.clic(); montrerTitre(); }));
$$('.onglets button').forEach((b) => b.addEventListener('click', () => { Son.clic(); onglet = b.dataset.onglet; montrerVestiaire(); }));
$('#pause').addEventListener('click', (e) => {
  const a = e.target.closest('[data-action]'); if (!a) return;
  Son.clic();
  const act = a.dataset.action;
  if (act === 'reprendre') reprendre();
  else if (act === 'recommencer') { reprendre(); lancerNiveau(niv); }
  else if (act === 'accueil') { reprendre(); ecrireSauvegarde({ niveau: niv + 1 }); montrerTitre(); }
});
$('#introOk').addEventListener('click', fermerIntro);
$('#intro').addEventListener('click', (e) => { if (e.target === $('#intro')) fermerIntro(); });
$('#finSuivant').addEventListener('click', () => { Son.clic(); lancerNiveau(niv + 1); });
$('#finReessayer').addEventListener('click', () => { Son.clic(); lancerNiveau(niv); });
$('#finRejouer').addEventListener('click', () => { Son.clic(); lancerNiveau(niv); });
$('#finNiveaux').addEventListener('click', () => { Son.clic(); if (dernierGagne) montrerBilan(); else montrerNiveaux(); });
$('#bilanNiveaux').addEventListener('click', () => { Son.clic(); montrerNiveaux(); });
$('#bilanVestiaire').addEventListener('click', () => { Son.clic(); montrerVestiaire(); });
$('#bilanAccueil').addEventListener('click', () => { Son.clic(); montrerTitre(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });

// Fermeture de la page pendant une partie : on garde le niveau en cours.
window.JEL_SAVE.surFermeture(() => {
  if (apercu || affiche) return;
  if (N && (etat === 'jeu' || etat === 'pause' || etat === 'intro')) ecrireSauvegarde({ niveau: niv + 1, score: totalScore() });
});

/* ---------------------------------------------------------------------
   Démarrage
   --------------------------------------------------------------------- */
window.addEventListener('resize', redimensionner);
lireSauvegarde();
majBoutonsSon();
function cacherLangue() { $$('.jel-langue, jel-langue, [class*="jel-langue"]').forEach((el) => { el.style.display = 'none'; }); }
if (window.JEL_AFFICHE) {
  affiche = true;
  redimensionner();
  cacherEcrans(); $('#hud').hidden = true;
  cacherLangue(); setTimeout(cacherLangue, 300);
  requestAnimationFrame(boucle);
  return;
}
redimensionner();
if (window.JEL_APERCU) {
  apercu = Number(window.JEL_APERCU) || 1;
  ouvrirApercu(apercu);
  requestAnimationFrame(boucle);
  return;
}
montrerTitre();
requestAnimationFrame(boucle);
})();
