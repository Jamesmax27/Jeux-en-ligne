        c.fillStyle = '#ffe14a'; rond(c, fx, fy, r * 0.12); c.fill();
      }
    }
    c.restore();
  }

  // Tenue d'une place : la mienne (vestiaire) ou celle d'un robot (couleur seule).
  function tenueDe(s, moi) {
    if (s === moi) return { espece: ESPECES[prog.tenue.p].id, bonnet: BONNETS[prog.tenue.b].id, echarpe: ECHARPES[prog.tenue.e].id };
    return { espece: 'classique', bonnet: ['pompon', 'pompon', 'pompon', 'pompon'][s], echarpe: ['rayee', 'unie', 'pois', 'unie'][s] };
  }

  // Médaillon d'une place (tête de profil dans un rond de sa couleur).
  function medaillon(c, s, x, y, r, moi) {
    c.save();
    c.fillStyle = COUL[s]; rond(c, x, y, r); c.fill();
    c.fillStyle = '#ffffff55'; rond(c, x - r * 0.3, y - r * 0.35, r * 0.4); c.fill();
    c.beginPath(); c.arc(x, y, r * 0.93, 0, TAU); c.clip();
    const tn = tenueDe(s, moi);
    pingouinCote(c, x - r * 0.15, y + r * 1.75, r * 2.05, { coul: COUL[s], fonce: COUL_FONCE[s], espece: tn.espece, bonnet: tn.bonnet, echarpe: tn.echarpe });
    c.restore();
  }
  function couronne(c, x, y, k) {
    c.save(); c.translate(x, y);
    c.fillStyle = '#ffd21f'; c.strokeStyle = '#a46a00'; c.lineWidth = k * 0.08;
    c.beginPath(); c.moveTo(-k * 0.45, k * 0.3); c.lineTo(-k * 0.5, -k * 0.25); c.lineTo(-k * 0.2, 0); c.lineTo(0, -k * 0.35); c.lineTo(k * 0.2, 0); c.lineTo(k * 0.5, -k * 0.25); c.lineTo(k * 0.45, k * 0.3); c.closePath(); c.fill(); c.stroke();
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Décor : la mer et les coins du pôle (remplit tout l'écran)
  // ---------------------------------------------------------------------
  const cacheDecor = { cle: '', liste: null };
  function elementsDecor(coin, w, h) {
    const cle = coin + '|' + Math.round(w) + '|' + Math.round(h);
    if (cacheDecor.cle === cle) return cacheDecor.liste;
    const al = graineHasard(77 + coin * 131), l = [];
    const n = Math.round(6 + (w * h) / 90000);
    for (let i = 0; i < n; i++) l.push({ x: al() * w, y: al() * h, k: 0.6 + al() * 0.8, a: al() * TAU, f: al() });
    cacheDecor.cle = cle; cacheDecor.liste = l;
    return l;
  }

  function dessinerMer(c, w, h, t, coin, centre) {
    const cx = centre ? centre[0] : w / 2, cy = centre ? centre[1] : h / 2, rr = centre ? centre[2] : Math.min(w, h) * 0.4;
    const fonds = [['#3aa6dc', '#1d6fa8'], ['#2fb7cf', '#137f9f'], ['#1b3f7a', '#0c1f45'], ['#17708f', '#0a3c57']];
    const gr = c.createRadialGradient(cx, cy, rr * 0.6, cx, cy, Math.max(w, h) * 0.85);
    gr.addColorStop(0, fonds[coin][0]); gr.addColorStop(1, fonds[coin][1]);
    c.fillStyle = gr; c.fillRect(0, 0, w, h);
    const dec = elementsDecor(coin, w, h);
    // reflets d'aurore ou rayons de la grotte
    if (coin === 2) {
      for (let k = 0; k < 3; k++) {
        c.fillStyle = ['#53ffb033', '#b36bff2a', '#4fd8ff26'][k];
        c.beginPath();
        for (let x = 0; x <= w + 20; x += 20) c.lineTo(x, h * (0.15 + k * 0.3) + Math.sin(x / 90 + t * 0.6 + k) * 30);
        for (let x = w + 20; x >= 0; x -= 20) c.lineTo(x, h * (0.15 + k * 0.3) + 60 + Math.sin(x / 70 + t * 0.5 + k * 2) * 26);
        c.closePath(); c.fill();
      }
      c.fillStyle = '#ffffffcc';
      dec.forEach((d) => { const s = 1 + Math.sin(t * 3 + d.a * 5) * 0.6; etincelle(c, d.x, d.y, 2.2 * s * d.k); });
    }
    if (coin === 3) {
      c.fillStyle = '#bff5ff14';
      for (let k = 0; k < 4; k++) { const x0 = w * (0.15 + k * 0.24); c.beginPath(); c.moveTo(x0, 0); c.lineTo(x0 + 70, 0); c.lineTo(x0 + 160 + Math.sin(t * 0.4 + k) * 20, h); c.lineTo(x0 + 40, h); c.closePath(); c.fill(); }
    }
    // vagues
    c.strokeStyle = coin === 2 ? '#9fd4ff22' : '#ffffff2c'; c.lineWidth = 2;
    for (let y = 18; y < h; y += 34) {
      c.beginPath();
      for (let x = -20; x <= w + 20; x += 16) c.lineTo(x, y + Math.sin(x / 38 + t * 1.6 + y * 0.07) * 4);
      c.stroke();
    }
    // éléments du coin, autour de la banquise
    dec.forEach((d, i) => {
      const dx = d.x - cx, dy = d.y - cy;
      if (dx * dx + dy * dy < (rr * 1.25) * (rr * 1.25)) return;
      const bob = Math.sin(t * 1.2 + d.a) * 3;
      const k = d.k * Math.max(26, Math.min(w, h) * 0.07);
      if (coin === 0) {
        // fjord : rochers enneigés, l'écume autour
        const forme = [];
        for (let j = 0; j < 10; j++) { const a = j * TAU / 10 + d.a; const rr = k * (0.72 + ((j * 7 + i * 3) % 5) * 0.08); forme.push([d.x + Math.cos(a) * rr, d.y + Math.sin(a) * rr * 0.75]); }
        c.strokeStyle = '#ffffff66'; c.lineWidth = 2; ell(c, d.x, d.y + k * 0.08, k * (1.05 + Math.sin(t * 2 + d.a) * 0.04), k * 0.82); c.stroke();
        c.fillStyle = '#3f4d5c'; c.beginPath(); forme.forEach((p) => c.lineTo(p[0], p[1] + k * 0.12)); c.closePath(); c.fill();
        c.fillStyle = '#6a7b8c'; c.beginPath(); forme.forEach((p) => c.lineTo(p[0], p[1])); c.closePath(); c.fill();
        c.fillStyle = '#f4fbff'; c.beginPath();
        forme.forEach((p) => c.lineTo(d.x + (p[0] - d.x) * 0.78, d.y + (p[1] - d.y) * 0.62 - k * 0.12)); c.closePath(); c.fill();
        c.fillStyle = '#d6ecf8'; ell(c, d.x + k * 0.15, d.y - k * 0.02, k * 0.3, k * 0.12, 0.2); c.fill();
      } else if (coin === 1 || (coin === 2 && i % 3 === 0)) {
        // icebergs flottants
        const y0 = d.y + bob;
        c.fillStyle = '#0a3c5733'; ell(c, d.x + 4, y0 + k * 0.35, k * 1.1, k * 0.5); c.fill();
        c.fillStyle = '#bde8fb'; c.beginPath(); c.moveTo(d.x - k, y0 + k * 0.2); c.lineTo(d.x - k * 0.6, y0 - k * 0.7); c.lineTo(d.x - k * 0.1, y0 - k * 0.45); c.lineTo(d.x + k * 0.35, y0 - k * 0.95); c.lineTo(d.x + k, y0 + k * 0.2); c.closePath(); c.fill();
        c.fillStyle = '#ffffff'; c.beginPath(); c.moveTo(d.x - k * 0.6, y0 - k * 0.7); c.lineTo(d.x - k * 0.1, y0 - k * 0.45); c.lineTo(d.x + k * 0.35, y0 - k * 0.95); c.lineTo(d.x + k * 0.2, y0 - k * 0.1); c.lineTo(d.x - k * 0.5, y0 - k * 0.1); c.closePath(); c.fill();
      } else if (coin === 3) {
        // grotte : cristaux de glace
        c.fillStyle = '#9fe9ff'; c.strokeStyle = '#e8fdff'; c.lineWidth = 2;
        for (let j = 0; j < 3; j++) {
          const a = d.a + j * 0.7, L = k * (1.1 - j * 0.25);
          c.beginPath(); c.moveTo(d.x + Math.cos(a + 1.57) * k * 0.2, d.y + Math.sin(a + 1.57) * k * 0.2);
          c.lineTo(d.x + Math.cos(a) * L, d.y + Math.sin(a) * L); c.lineTo(d.x + Math.cos(a - 1.57) * k * 0.2, d.y + Math.sin(a - 1.57) * k * 0.2); c.closePath(); c.fill(); c.stroke();
        }
      } else {
        // aurore : petits glaçons qui brillent
        c.fillStyle = '#dff6ff'; ell(c, d.x, d.y + bob, k * 0.35, k * 0.2, d.a); c.fill();
      }
    });
  }

  // ---------------------------------------------------------------------
  //  La banquise et ce qu'il y a dessus
  // ---------------------------------------------------------------------
  function dessinerBanquise(c, e, g, R, t) {
    const X = (x) => g.cx + x * g.s, Y = (y) => g.cy + y * g.s;
    const r = R * g.s;
    const tg = e.tg ? O.DIRS[e.gi] : null;
    const pente = tg ? [tg[0] / 1000, tg[1] / 1000] : [0, 0];
    const ep = Math.max(6, r * 0.07);
    // épaisseur de la glace (et inclinaison quand elle tangue)
    const forme = (rx, ry, ox, oy) => {
      c.beginPath();
      for (let i = 0; i <= 72; i++) {
        const a = i * TAU / 72, k = 1 + 0.012 * Math.sin(7 * a) + 0.008 * Math.sin(13 * a + 1);
        c.lineTo(g.cx + ox + Math.cos(a) * rx * k, g.cy + oy + Math.sin(a) * ry * k);
      }
      c.closePath();
    };
    c.fillStyle = '#0a3c5740'; forme(r * 1.04, r * 1.04, pente[0] * ep * 2, ep * 1.8 + pente[1] * ep * 2); c.fill();
    c.fillStyle = '#7fc3e6'; forme(r, r, pente[0] * ep * 1.2, ep + pente[1] * ep * 1.2); c.fill();
    const gr = c.createRadialGradient(g.cx - r * 0.3 - pente[0] * r * 0.4, g.cy - r * 0.35 - pente[1] * r * 0.4, r * 0.1, g.cx, g.cy, r * 1.05);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.7, '#eaf7ff'); gr.addColorStop(1, tg ? '#b7e0f6' : '#cfeafa');
    c.fillStyle = gr; forme(r, r, 0, 0); c.fill();
    c.strokeStyle = '#ffffff'; c.lineWidth = Math.max(2, r * 0.015); forme(r * 0.985, r * 0.985, 0, 0); c.stroke();
    // petites traces de neige et fissures (toujours les mêmes)
    c.save(); forme(r, r, 0, 0); c.clip();
    const al = graineHasard(e.n * 31 + 7);
    c.strokeStyle = '#a9d6ee'; c.lineWidth = Math.max(1, r * 0.006);
    for (let i = 0; i < 9; i++) {
      const a = al() * TAU, d = (0.3 + al() * 0.6) * R;
      let x = Math.cos(a) * d, y = Math.sin(a) * d;
      c.beginPath(); c.moveTo(X(x), Y(y));
      for (let j = 0; j < 3; j++) { x += (al() - 0.5) * R * 0.18; y += (al() - 0.5) * R * 0.18; c.lineTo(X(x), Y(y)); }
      c.stroke();
    }
    c.fillStyle = '#ffffffaa';
    for (let i = 0; i < 14; i++) { const a = al() * TAU, d = al() * R * 0.9; ell(c, X(Math.cos(a) * d), Y(Math.sin(a) * d), r * 0.05, r * 0.02, al() * 3); c.fill(); }
    // la pente : chevrons qui glissent vers le bas
    if (tg) {
      const ang = Math.atan2(pente[1], pente[0]);
      c.strokeStyle = '#2f86ff38'; c.lineWidth = Math.max(3, r * 0.035); c.lineCap = 'round'; c.lineJoin = 'round';
      for (let k = -1; k <= 1; k++) {
        for (let j = 0; j < 3; j++) {
          const off = (((t * 0.35 + j / 3) % 1) - 0.5) * 1.4 * R;
          const px = Math.cos(ang) * off - Math.sin(ang) * k * R * 0.45, py = Math.sin(ang) * off + Math.cos(ang) * k * R * 0.45;
          const L = R * 0.1;
          c.beginPath();
          c.moveTo(X(px - Math.cos(ang - 0.7) * L), Y(py - Math.sin(ang - 0.7) * L));
          c.lineTo(X(px), Y(py));
          c.lineTo(X(px - Math.cos(ang + 0.7) * L), Y(py - Math.sin(ang + 0.7) * L));
          c.stroke();
        }
      }
    }
    c.restore();
  }

  function dessinerLisse(c, o, g, t) {
    const x = g.cx + o[0] * g.s, y = g.cy + o[1] * g.s, r = o[2] * g.s;
    const gr = c.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
    gr.addColorStop(0, '#e9fbff'); gr.addColorStop(0.6, '#8fd8f8'); gr.addColorStop(1, '#5fc0ec');
    c.fillStyle = gr; rond(c, x, y, r); c.fill();
    c.strokeStyle = '#ffffffcc'; c.lineWidth = Math.max(1.5, r * 0.04);
    rond(c, x, y, r * 0.97); c.stroke();
    c.save(); rond(c, x, y, r); c.clip();
    c.strokeStyle = '#ffffffaa'; c.lineWidth = Math.max(2, r * 0.07);
    const d = ((t * 0.5) % 1) * r * 3 - r * 1.5;
    c.beginPath(); c.moveTo(x - r + d, y - r); c.lineTo(x + r * 0.2 + d, y + r); c.stroke();
    c.lineWidth = Math.max(1, r * 0.03);
    c.beginPath(); c.moveTo(x - r * 0.6 + d, y - r); c.lineTo(x + r * 0.6 + d, y + r); c.stroke();
    c.restore();
  }

  function dessinerBloc(c, o, g, i, chute) {
    const x = g.cx + o[0] * g.s, y = g.cy + o[1] * g.s, r = o[2] * g.s * 0.95;
    const haut = chute || 0;
    c.save();
    c.translate(x, y - haut);
    const a = (i * 0.7 + o[0] * 0.0003) % 1.5;
    c.fillStyle = '#0a3c5740'; c.save(); c.translate(r * 0.15, r * 0.25 + haut); c.rotate(a); c.fillRect(-r * 0.9, -r * 0.9, r * 1.8, r * 1.8); c.restore();
    c.rotate(a);
    const L = r * 0.85;
    c.fillStyle = '#86c9ec'; c.beginPath(); c.moveTo(-L, -L * 0.5); c.lineTo(L, -L * 0.5); c.lineTo(L, L); c.lineTo(-L, L); c.closePath(); c.fill();
    const gr = c.createLinearGradient(-L, -L, L, L);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#c4ebfc');
    c.fillStyle = gr; c.beginPath();
    const rr = L * 0.25;
    c.moveTo(-L + rr, -L); c.lineTo(L - rr, -L); c.quadraticCurveTo(L, -L, L, -L + rr); c.lineTo(L, L * 0.6 - rr); c.quadraticCurveTo(L, L * 0.6, L - rr, L * 0.6);
    c.lineTo(-L + rr, L * 0.6); c.quadraticCurveTo(-L, L * 0.6, -L, L * 0.6 - rr); c.lineTo(-L, -L + rr); c.quadraticCurveTo(-L, -L, -L + rr, -L); c.closePath(); c.fill();
    c.strokeStyle = '#ffffff'; c.lineWidth = Math.max(1.5, r * 0.06);
    c.beginPath(); c.moveTo(-L * 0.6, -L * 0.7); c.lineTo(L * 0.1, -L * 0.7); c.stroke();
    c.beginPath(); c.moveTo(-L * 0.75, -L * 0.5); c.lineTo(-L * 0.75, 0); c.stroke();
    c.restore();
  }

  // Phoque couché, la tête vers le centre ; ecrase : 0 à 1 après un choc.
  function dessinerPhoque(c, o, g, t, ecrase) {
    const x = g.cx + o[0] * g.s, y = g.cy + o[1] * g.s, r = O.RPH * g.s;
    const ang = (o[0] === 0 && o[1] === 0) ? Math.sin(t * 0.5) * 0.4 + 1.57 : Math.atan2(-o[1], -o[0]);
    const k = 1 + (ecrase || 0) * 0.25;
    c.save(); c.translate(x, y); c.rotate(ang); c.scale(1 / k, k);
    c.fillStyle = '#0a3c5733'; ell(c, r * 0.1, r * 0.15, r * 1.25, r * 0.85); c.fill();
    // queue
    c.fillStyle = '#7c8c9c';
    c.beginPath(); c.moveTo(-r * 0.9, 0); c.lineTo(-r * 1.45, -r * 0.4); c.lineTo(-r * 1.3, 0); c.lineTo(-r * 1.45, r * 0.4); c.closePath(); c.fill();
    // corps
    const gr = c.createLinearGradient(0, -r, 0, r);
    gr.addColorStop(0, '#a9b8c6'); gr.addColorStop(1, '#7d8d9d');
    c.fillStyle = gr; ell(c, -r * 0.1, 0, r * 1.05, r * 0.72); c.fill();
    c.fillStyle = '#6b7b8b';
    for (let i = 0; i < 5; i++) { rond(c, -r * 0.5 + i * r * 0.22, (i % 2 ? -0.25 : 0.2) * r, r * 0.06); c.fill(); }
    // nageoires
    c.fillStyle = '#7c8c9c';
    ell(c, r * 0.2, -r * 0.72, r * 0.32, r * 0.14, -0.5); c.fill();
    ell(c, r * 0.2, r * 0.72, r * 0.32, r * 0.14, 0.5); c.fill();
    // tête
    c.fillStyle = '#b4c2cf'; rond(c, r * 0.85, 0, r * 0.5); c.fill();
    c.fillStyle = '#10141c'; rond(c, r * 1.02, -r * 0.2, r * 0.08); c.fill(); rond(c, r * 1.02, r * 0.2, r * 0.08); c.fill();
    c.fillStyle = '#fff'; rond(c, r * 1.04, -r * 0.22, r * 0.03); c.fill(); rond(c, r * 1.04, r * 0.18, r * 0.03); c.fill();
    c.fillStyle = '#3a3f4a'; ell(c, r * 1.28, 0, r * 0.09, r * 0.12); c.fill();
    c.strokeStyle = '#ffffffaa'; c.lineWidth = Math.max(1, r * 0.025);
    [-1, 1].forEach((s) => { for (let j = 0; j < 3; j++) { c.beginPath(); c.moveTo(r * 1.2, s * r * 0.1); c.lineTo(r * 1.5, s * (r * 0.12 + j * r * 0.1)); c.stroke(); } });
    if (ecrase) { c.fillStyle = '#ff8fb0aa'; rond(c, r * 0.95, -r * 0.32, r * 0.1); c.fill(); rond(c, r * 0.95, r * 0.32, r * 0.1); c.fill(); }
    c.restore();
  }

  function dessinerPoisson(c, x, y, k, t, a) {
    c.save(); c.translate(x, y); c.rotate(a + Math.sin(t * 6) * 0.25);
    c.fillStyle = '#fff3a088'; rond(c, 0, 0, k * 1.3); c.fill();
    c.fillStyle = '#ff8a2a';
    c.beginPath(); c.moveTo(-k * 0.6, 0); c.lineTo(-k * 1.2, -k * 0.5); c.lineTo(-k * 1.1, 0); c.lineTo(-k * 1.2, k * 0.5); c.closePath(); c.fill();
    const gr = c.createLinearGradient(0, -k * 0.5, 0, k * 0.5);
    gr.addColorStop(0, '#ffb347'); gr.addColorStop(1, '#ff6a2a');
    c.fillStyle = gr; ell(c, 0, 0, k * 0.85, k * 0.45); c.fill();
    c.fillStyle = '#fff'; rond(c, k * 0.45, -k * 0.1, k * 0.14); c.fill();
    c.fillStyle = '#10141c'; rond(c, k * 0.49, -k * 0.1, k * 0.07); c.fill();
    c.restore();
  }

  // Pingouin tombé à l'eau : la tête qui flotte, il nage vers le large.
  function dessinerNageur(c, n, g, t, s, moi) {
    const age = t - n.t0;
    const x = g.cx + (n.x + n.dx * Math.min(age, 6)) * g.s, y = g.cy + (n.y + n.dy * Math.min(age, 6)) * g.s;
    const r = O.RP * g.s * 0.62;
    const bob = Math.sin(age * 4) * r * 0.08;
    c.save();
    c.globalAlpha = Math.max(0.35, 1 - age / 10);
    c.strokeStyle = '#ffffff88'; c.lineWidth = 2;
    ell(c, x, y + r * 0.2, r * (1.2 + (age % 1.2) * 0.4), r * 0.55 * (1.2 + (age % 1.2) * 0.4)); c.stroke();
    const tn = tenueDe(s, moi), sp = corpsEspece(tn.espece);
    c.fillStyle = sp.dos; rond(c, x, y + bob, r * 0.7); c.fill();
    c.fillStyle = sp.joue; ell(c, x + r * 0.22, y + bob + r * 0.05, r * 0.3, r * 0.25); c.fill();
    c.fillStyle = '#10141c'; rond(c, x + r * 0.28, y + bob - r * 0.08, r * 0.08); c.fill();
    c.fillStyle = sp.bec; c.beginPath(); c.moveTo(x + r * 0.55, y + bob - r * 0.05); c.lineTo(x + r * 0.95, y + bob + r * 0.05); c.lineTo(x + r * 0.55, y + bob + r * 0.15); c.closePath(); c.fill();
    c.save(); c.translate(x - r * 0.05, y + bob - r * 0.55); bonnetCote(c, tn.bonnet, COUL[s], COUL_FONCE[s], r * 0.75, t); c.restore();
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  État de l'affichage et file des animations
  // ---------------------------------------------------------------------
  let partie = null;          // partie du moteur commun (JEL_MULTI)
  let session = null;         // 'solo' (parcours) ou 'ligne'
  let niveau = 1;
  let ecran = 'titre';
  let enPause = false, enPartie = false;
  let vue = null;             // état affiché (en retard sur le moteur pendant les animations)
  let file = [];              // coups et fins de partie à montrer, dans l'ordre
  let anim = null;            // animation en cours
  let nageurs = [];           // pingouins tombés à l'eau
  let particules = [];
  let secousse = 0;
  let angles = [0, 0, 0, 0];  // direction de chaque pingouin
  let ecrases = {};           // phoques touchés : heure du choc
  let geo = null;
  let visee = null;           // { x, y (vecteur de lancer, unités), p (force 0 à 1), doigt, sx, sy, accroche }
  let clavier = { a: 0, p: 0.6, actif: false };
  let debutTour = Date.now(), dernierTic = -1, humainsAvant = null, jeton = 0;
  let attenteTuto = false, finEnAttente = false, lancement = false, finSalon = 0, resultatSalon = null, finManche = 0;
  let dernierGeste = Date.now();

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  // Place du joueur de l'appareil (en solo, avant le départ du moteur : la place 0).
  const monSiege = () => (partie ? partie.siege : (session === 'solo' ? 0 : -1));

  function geometrie(e, w, h) {
    let haut = 8, bas = h - 8;
    try { haut = $('hud').getBoundingClientRect().bottom + 8; } catch (er) { /* rien */ }
    try { const a = $('aide'); if (a.textContent) bas = a.getBoundingClientRect().top - 2; } catch (er) { /* rien */ }
    const H = Math.max(120, bas - haut);
    const R0 = e ? e.R0 : 10000;
    const s = Math.min(w * 0.94, H * 0.98) / (2 * R0 * 1.06);
    return { cx: w / 2, cy: haut + H / 2, s: s, w: w, h: h };
  }

  // Ce qu'il faut dessiner maintenant : positions, rayon, poissons, blocs.
  function scene(t) {
    const e = vue;
    if (!e) return null;
    const sc = { e: e, pos: e.p.map((p) => [p.x, p.y]), out: e.p.map((p, i) => !e.ac[i] || !!p.o), R: e.R, po: e.po, b: e.b, ph: e.ph, glisse: [0, 0, 0, 0], bloc: null };
    if (!anim) return sc;
    const a = anim, av = a.ev.avant;
    sc.e = av;
    sc.R = av.R; sc.b = av.b; sc.ph = av.ph;
    if (a.phase === 'vise') {
      sc.pos = av.p.map((p) => [p.x, p.y]);
      sc.out = av.p.map((p, i) => !av.ac[i] || !!p.o);
      sc.po = av.po;
      return sc;
    }
    const k = Math.min(a.rec.pos.length - 1, Math.floor(a.k)), f = a.rec.pos[k], f0 = a.rec.pos[Math.max(0, k - 1)];
    const fr = a.k - Math.floor(a.k);
    const nouv = a.rec.pos[Math.min(a.rec.pos.length - 1, k + 1)];
    sc.pos = av.p.map((p, i) => f ? [f[i * 2] + (nouv[i * 2] - f[i * 2]) * fr, f[i * 2 + 1] + (nouv[i * 2 + 1] - f[i * 2 + 1]) * fr] : [p.x, p.y]);
    sc.out = av.p.map((p, i) => !av.ac[i] || !!p.o || a.tombes[i]);
    sc.po = av.po.filter((q) => !a.manges.some((m) => m[0] === q[0] && m[1] === q[1]));
    if (f && f0) sc.glisse = av.p.map((p, i) => { const vx = f[i * 2] - f0[i * 2], vy = f[i * 2 + 1] - f0[i * 2 + 1]; return Math.min(1, Math.sqrt(vx * vx + vy * vy) / 60); });
    if (a.phase === 'fonte') { sc.R = av.R + (a.ev.apres.dc.rm - av.R) * Math.min(1, a.u); }
    if (a.phase === 'glacon' || a.phase === 'banniere') {
      if (a.ev.apres.dc.rm) sc.R = a.ev.apres.dc.rm;
      if (a.phase === 'glacon') sc.bloc = { o: [a.ev.apres.dc.gl[0], a.ev.apres.dc.gl[1], 640], u: a.u };
      else if (a.ev.apres.dc.gl) sc.b = av.b.concat([[a.ev.apres.dc.gl[0], a.ev.apres.dc.gl[1], 640]]);
    }
    if (a.phase === 'fonte' || a.phase === 'glacon' || a.phase === 'banniere') {
      const R2 = sc.R * sc.R;
      if (a.ev.apres.dc.rm) { sc.b = sc.b.filter((o) => o[0] * o[0] + o[1] * o[1] < R2); sc.ph = sc.ph.filter((o) => o[0] * o[0] + o[1] * o[1] < R2); }
    }
    return sc;
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau');
    const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const e = vue;
    const coin = e ? NIVEAUX[e.n].d : 0;
    geo = geometrie(e, w, h);
    const g = geo;
    if (secousse > 0) { secousse = Math.max(0, secousse - dt * 3); c.translate((Math.random() - 0.5) * secousse * 10, (Math.random() - 0.5) * secousse * 10); }
    const sc = scene(t);
    dessinerMer(c, w, h, t, coin, [g.cx, g.cy, (sc ? sc.R : 10000) * g.s]);
    if (!sc) return;
    const X = (x) => g.cx + x * g.s, Y = (y) => g.cy + y * g.s;
    // nageurs derrière la banquise s'ils sont au nord
    nageurs.forEach((n) => { if (n.y < 0) dessinerNageur(c, n, g, t, n.s, monSiege()); });
    dessinerBanquise(c, sc.e, g, sc.R, t);
    sc.e.li.forEach((o) => dessinerLisse(c, o, g, t));
    sc.b.forEach((o, i) => dessinerBloc(c, o, g, i, 0));
    sc.ph.forEach((o, i) => { const tt = ecrases[i] ? (t - ecrases[i]) : 9; dessinerPhoque(c, o, g, t, tt < 0.35 ? 1 - tt / 0.35 : 0); });
    sc.po.forEach((q, i) => dessinerPoisson(c, X(q[0]), Y(q[1]), O.RPO * g.s * 0.7, t + i, i * 1.3));
    if (sc.bloc) {
      // ombre du glaçon qui grossit, puis il tombe
      const u = sc.bloc.u, o = sc.bloc.o;
      c.fillStyle = '#0a3c5755'; ell(c, X(o[0]), Y(o[1]), o[2] * g.s * (0.3 + 0.7 * u), o[2] * g.s * (0.2 + 0.5 * u)); c.fill();
      if (u > 0.45) dessinerBloc(c, o, g, sc.b.length, (1 - (u - 0.45) / 0.55) * g.h * 0.5);
    }
    // anneau du joueur dont c'est le tour
    const quiJoue = anim ? anim.ev.siege : (e && partie && partie.phase === 'jeu' && !attenteTuto ? R.aQui(e) : -1);
    if (quiJoue >= 0 && !sc.out[quiJoue]) {
      const p = sc.pos[quiJoue], rr = O.RP * g.s * (1.45 + Math.sin(t * 6) * 0.08);
      c.strokeStyle = COUL[quiJoue]; c.lineWidth = Math.max(3, g.s * 120); c.globalAlpha = 0.55;
      rond(c, X(p[0]), Y(p[1]), rr); c.stroke(); c.globalAlpha = 1;
    }
    // visée (lance-pierre)
    const moi = monSiege();
    const v = visee && visee.p > 0.01 ? visee : (clavier.actif && peutJouer() ? { x: Math.cos(clavier.a) * clavier.p * 1000, y: Math.sin(clavier.a) * clavier.p * 1000, p: clavier.p } : null);
    if (v && moi >= 0 && (peutJouer() || (modeApercu && !anim)) && !sc.out[moi]) dessinerVisee(c, g, sc, moi, v, t);
    else if (anim && anim.phase === 'vise') dessinerVisee(c, g, sc, anim.ev.siege, { x: anim.ev.action.x * Math.min(1, anim.u * 1.4), y: anim.ev.action.y * Math.min(1, anim.u * 1.4), p: Math.hypot(anim.ev.action.x, anim.ev.action.y) / 1000 * Math.min(1, anim.u * 1.4) }, t);
    // pingouins (les plus au nord d'abord)
    const ordre = [0, 1, 2, 3].filter((s) => s < sc.pos.length && sc.e.ac[s] && !sc.out[s]).sort((a, b) => sc.pos[a][1] - sc.pos[b][1]);
    ordre.forEach((s) => {
      const p = sc.pos[s], tn = tenueDe(s, moi);
      let saut = 0;
      if (anim && anim.phase === 'banniere' && anim.ev.apres.dc.w === s) saut = Math.abs(Math.sin(anim.u * Math.PI * 4)) * 0.8;
      pingouinHaut(c, X(p[0]), Y(p[1]), O.RP * g.s * 1.12, {
        ang: angles[s], coul: COUL[s], fonce: COUL_FONCE[s], espece: tn.espece, bonnet: tn.bonnet, echarpe: tn.echarpe,
        glisse: sc.glisse[s], t: t, anneau: true, saut: saut
      });
      if (sc.e.p[s] && sc.e.p[s].bo && !(anim && anim.phase !== 'vise' && anim.ev.siege === s)) {
        // poisson mangé : petite flamme dorée, le prochain lancer est plus fort
        c.fillStyle = '#ffd21fcc';
        etincelle(c, X(p[0]) + O.RP * g.s * 0.9, Y(p[1]) - O.RP * g.s * 0.9, O.RP * g.s * (0.35 + Math.sin(t * 8) * 0.08));
      }
      if (s === moi) {
        // étiquette « Toi » au-dessus de son pingouin
        const tx = tr('place.toi');
        c.font = '800 ' + Math.max(11, Math.round(O.RP * g.s * 0.62)) + 'px system-ui, sans-serif';
        const lw = c.measureText(tx).width + 12, lh = Math.max(16, O.RP * g.s * 0.8);
        const bx = X(p[0]) - lw / 2, by = Y(p[1]) - O.RP * g.s * 1.75 - lh;
        c.fillStyle = '#ffd84d'; c.beginPath(); c.roundRect ? c.roundRect(bx, by, lw, lh, lh / 2) : c.rect(bx, by, lw, lh); c.fill();
        c.fillStyle = '#4a2e00'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(tx, X(p[0]), by + lh / 2 + 1);
      }
    });
    nageurs.forEach((n) => { if (n.y >= 0) dessinerNageur(c, n, g, t, n.s, moi); });
    // aide animée : une main qui montre le geste aux tout premiers niveaux
    if (!anim && session === 'solo' && niveau <= 2 && moi >= 0 && peutJouer() && !visee && !clavier.actif && Date.now() - dernierGeste > 2500 && !sc.out[moi]) dessinerMain(c, g, sc.pos[moi], t);
    // particules
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      if (p.forme === 'etoile') etincelle(c, p.x, p.y, p.k);
      else if (p.forme === 'anneau') { c.strokeStyle = p.coul; c.lineWidth = 3; ell(c, p.x, p.y, p.k * (1.6 - p.vie), p.k * 0.6 * (1.6 - p.vie)); c.stroke(); }
      else { rond(c, p.x, p.y, p.k); c.fill(); }
      c.globalAlpha = 1;
    }
  }

  // Flèche du lance-pierre, pointillés jusqu'à l'arrêt prévu (sans les chocs).
  function dessinerVisee(c, g, sc, s, v, t) {
    const p = sc.pos[s], X = (x) => g.cx + x * g.s, Y = (y) => g.cy + y * g.s;
    const L = Math.hypot(v.x, v.y);
    if (L < 1) return;
    const ux = v.x / L, uy = v.y / L, pw = Math.min(1, L / 1000);
    const bonus = sc.e.p[s] && sc.e.p[s].bo ? O.BOOST / 100 : 1;
    // distance d'une glissade seule
    let vv = pw * O.VMAX * bonus, d = 0, n = 0;
    while (vv * vv >= 16 && n++ < 900) { vv = vv * O.FROT / 1000; d += vv; }
    const x0 = X(p[0]), y0 = Y(p[1]);
    // élastique tiré derrière le pingouin
    const tir = (O.RP * 1.2 + pw * 3600) * g.s;
    const bx = x0 - ux * tir, by = y0 - uy * tir;
    c.strokeStyle = '#8a5a2b'; c.lineWidth = Math.max(2, g.s * 90); c.lineCap = 'round';
    c.beginPath(); c.moveTo(x0 - uy * O.RP * g.s, y0 + ux * O.RP * g.s); c.lineTo(bx, by); c.lineTo(x0 + uy * O.RP * g.s, y0 - ux * O.RP * g.s); c.stroke();
    c.fillStyle = '#ffffffcc'; rond(c, bx, by, Math.max(6, g.s * 260)); c.fill();
    // pointillés de la trajectoire
    c.strokeStyle = '#ffffffee'; c.lineWidth = Math.max(2, g.s * 110);
    c.setLineDash([Math.max(4, g.s * 300), Math.max(5, g.s * 330)]);
    c.lineDashOffset = -t * 30;
    c.beginPath(); c.moveTo(x0, y0); c.lineTo(X(p[0] + ux * d), Y(p[1] + uy * d)); c.stroke();
    c.setLineDash([]);
    c.strokeStyle = COUL[s]; c.globalAlpha = 0.7; c.lineWidth = Math.max(2, g.s * 80);
    rond(c, X(p[0] + ux * d), Y(p[1] + uy * d), O.RP * g.s); c.stroke(); c.globalAlpha = 1;
    // flèche de force
    const fl = (O.RP * 1.3 + pw * 3000) * g.s;
    const coul = pw < 0.4 ? '#36c46a' : pw < 0.75 ? '#ffb81f' : '#ff4f5e';
    c.strokeStyle = coul; c.lineWidth = Math.max(5, g.s * 300);
    c.beginPath(); c.moveTo(x0 + ux * O.RP * g.s, y0 + uy * O.RP * g.s); c.lineTo(x0 + ux * fl, y0 + uy * fl); c.stroke();
    c.fillStyle = coul;
    const tete = Math.max(10, g.s * 650);
    c.beginPath(); c.moveTo(x0 + ux * (fl + tete), y0 + uy * (fl + tete)); c.lineTo(x0 + ux * fl - uy * tete * 0.7, y0 + uy * fl + ux * tete * 0.7); c.lineTo(x0 + ux * fl + uy * tete * 0.7, y0 + uy * fl - ux * tete * 0.7); c.closePath(); c.fill();
  }

  function dessinerMain(c, g, p, t) {
    const u = (t % 2.2) / 2.2;
    const x0 = g.cx + p[0] * g.s, y0 = g.cy + p[1] * g.s;
    const vx = -p[0], vy = -p[1], L = Math.hypot(vx, vy) || 1;
    const tire = Math.min(1, Math.max(0, (u - 0.2) / 0.5));
    const x = x0 - (vx / L) * tire * 3600 * g.s, y = y0 - (vy / L) * tire * 3600 * g.s;
    c.save(); c.globalAlpha = u > 0.85 ? (1 - u) / 0.15 : 1;
    const k = Math.max(16, O.RP * g.s * 1.2);
    c.translate(x + k * 0.3, y + k * 0.4);
    c.fillStyle = '#ffe0c2'; c.strokeStyle = '#6b4a2b'; c.lineWidth = 2;
    c.beginPath(); c.roundRect ? c.roundRect(-k * 0.35, -k * 0.1, k * 0.7, k * 0.8, k * 0.2) : c.rect(-k * 0.35, -k * 0.1, k * 0.7, k * 0.8); c.fill(); c.stroke();
    c.beginPath(); c.roundRect ? c.roundRect(-k * 0.12, -k * 0.75, k * 0.24, k * 0.8, k * 0.12) : c.rect(-k * 0.12, -k * 0.75, k * 0.24, k * 0.8); c.fill(); c.stroke();
    c.restore();
  }

  // Éclaboussure, étoiles, anneaux.
  function jaillir(x, y, n, coul, forme, v) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU, sp = (v || 160) * (0.4 + Math.random());
      particules.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (forme === 'goutte' ? 120 : 0), g: forme === 'goutte' ? 500 : 0, vie: 0.5 + Math.random() * 0.4, k: forme === 'etoile' ? 4 + Math.random() * 5 : 2 + Math.random() * 3, coul: coul, forme: forme });
    }
  }
  function plouf(xw, yw, s) {
    if (!geo) return;
    const x = geo.cx + xw * geo.s, y = geo.cy + yw * geo.s;
    jaillir(x, y, 26, '#e9fbff', 'goutte', 230);
    for (let i = 0; i < 3; i++) particules.push({ x: x, y: y, vx: 0, vy: 0, vie: 1.2 + i * 0.25, k: O.RP * geo.s * 1.6, coul: '#ffffffcc', forme: 'anneau' });
    secousse = Math.max(secousse, 0.6);
  }

  // ---------------------------------------------------------------------
  //  Animations : un coup à la fois, avec la même physique que les règles
  // ---------------------------------------------------------------------
  function vitesse() {
    // On rattrape le moteur quand plusieurs coups attendent, et on accélère
    // quand son pingouin est déjà dans l'eau.
    const moi = monSiege();
    let v = 1;
    if (file.length > 1) v = 2.2;
    if (vue && moi >= 0 && vue.p[moi] && (vue.p[moi].o || !vue.ac[moi])) v = Math.max(v, 2.4);
    return v;
  }

  function demarrerAnimSuivante() {
    while (!anim && file.length) {
      const it = file.shift();
      if (it.fin) { montrerFin(it); return; }
      const ev = it.ev;
      const rec = { pos: [], ev: [] };
      const tmp = O.copier(ev.avant);
      O.glisser(tmp, ev.siege, ev.action, rec);
      anim = { ev: ev, rec: rec, k: 0, u: 0, iev: 0, phase: ev.moi && !ev.auto ? 'glisse' : 'vise', tombes: {}, manges: [] };
      if (anim.phase === 'glisse') lancerGlisse();
      if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    }
  }

  function lancerGlisse() {
    anim.phase = 'glisse';
    anim.k = 0;
    const L = Math.hypot(anim.ev.action.x, anim.ev.action.y) / 1000;
    sons.lacher(L);
  }

  function evenementsGlisse(jusque) {
    const a = anim, g = geo;
    while (a.iev < a.rec.ev.length && a.rec.ev[a.iev].t <= jusque) {
      const ev = a.rec.ev[a.iev++];
      const f = a.rec.pos[Math.min(a.rec.pos.length - 1, ev.t)];
      const px = f ? f[ev.a * 2] : 0, py = f ? f[ev.a * 2 + 1] : 0;
      const sx = g ? g.cx + px * g.s : 0, sy = g ? g.cy + py * g.s : 0;
      if (ev.k === 'choc') {
        sons.choc(ev.f);
        if (g && f) {
          const qx = f[ev.b * 2], qy = f[ev.b * 2 + 1];
          jaillir(g.cx + (px + qx) / 2 * g.s, g.cy + (py + qy) / 2 * g.s, 10, '#ffe14a', 'etoile', 150);
        }
        secousse = Math.max(secousse, Math.min(0.5, ev.f / 400));
      } else if (ev.k === 'bloc') { sons.bloc(); jaillir(sx, sy, 8, '#ffffff', 'rond', 120); }
      else if (ev.k === 'phoque') { sons.phoque(); ecrases[ev.o] = performance.now() / 1000; jaillir(sx, sy, 8, '#ffd1e0', 'etoile', 140); }
      else if (ev.k === 'poisson') { sons.poisson(); a.manges.push([ev.x, ev.y]); jaillir(g ? g.cx + ev.x * g.s : 0, g ? g.cy + ev.y * g.s : 0, 14, '#ffb347', 'etoile', 160); }
      else if (ev.k === 'plouf') {
        a.tombes[ev.a] = true;
        sons.plouf();
        plouf(px, py, ev.a);
        const L = Math.hypot(px, py) || 1;
        nageurs.push({ s: ev.a, x: px, y: py, dx: px / L * 260, dy: py / L * 260, t0: performance.now() / 1000 });
        const carte = $('place-' + ev.a);
        if (carte) { carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond'); }
      }
    }
  }

  function avancerAnim(dt) {
    if (!anim) { demarrerAnimSuivante(); return; }
    const a = anim, v = vitesse();
    if (a.phase === 'vise') {
      a.u += dt * v / 0.55;
      if (Math.floor(a.u * 8) !== Math.floor((a.u - dt * v / 0.55) * 8)) sons.tendu(Math.min(1, a.u));
      if (a.u >= 1) lancerGlisse();
      return;
    }
    if (a.phase === 'glisse') {
      const avant = a.k;
      a.k += dt * v * 165;
      evenementsGlisse(Math.floor(a.k));
      // direction des pingouins qui bougent
      const k = Math.min(a.rec.pos.length - 1, Math.floor(a.k)), f = a.rec.pos[k], f0 = a.rec.pos[Math.max(0, Math.floor(avant) - 1)];
      if (f && f0) for (let s = 0; s < PLACES; s++) { const dx = f[s * 2] - f0[s * 2], dy = f[s * 2 + 1] - f0[s * 2 + 1]; if (dx * dx + dy * dy > 30) angles[s] = Math.atan2(dy, dx); }
      if (a.k >= a.rec.pos.length - 1) {
        evenementsGlisse(Infinity);
        const dc = a.ev.apres.dc || {};
        if (dc.rm) { a.phase = 'fonte'; a.u = 0; sons.craque(); }
        else if (dc.gl) { a.phase = 'glacon'; a.u = 0; sons.glacon(); }
        else if (dc.w > -2) debutBanniere();
        else finirAnim();
      }
      return;
    }
    if (a.phase === 'fonte') {
      const avantU = a.u;
      a.u += dt * v / 0.9;
      if (avantU < 0.5 && a.u >= 0.5) {
        (a.ev.apres.dc.cf || []).forEach((s) => {
          a.tombes[s] = true; sons.plouf();
          const f = a.rec.pos[a.rec.pos.length - 1];
          const px = f ? f[s * 2] : 0, py = f ? f[s * 2 + 1] : 0, L = Math.hypot(px, py) || 1;
          plouf(px, py, s);
          nageurs.push({ s: s, x: px, y: py, dx: px / L * 260, dy: py / L * 260, t0: performance.now() / 1000 });
        });
      }
      if (a.u >= 1) {
        const dc = a.ev.apres.dc;
        if (dc.gl) { a.phase = 'glacon'; a.u = 0; sons.glacon(); }
        else if (dc.w > -2) debutBanniere();
        else finirAnim();
      }
      return;
    }
    if (a.phase === 'glacon') {
      const avantU = a.u;
      a.u += dt * v / 0.9;
      if (avantU < 0.99 && a.u >= 0.99 && geo) { const o = a.ev.apres.dc.gl; jaillir(geo.cx + o[0] * geo.s, geo.cy + o[1] * geo.s, 16, '#e9fbff', 'rond', 200); secousse = 0.7; }
      if (a.u >= 1) { if (a.ev.apres.dc.w > -2) debutBanniere(); else finirAnim(); }
      return;
    }
    if (a.phase === 'banniere') {
      a.u += dt / 2.1;
      if (a.u >= 1) { $('banniere').classList.remove('actif'); finirAnim(); }
    }
  }

  function debutBanniere() {
    const a = anim, dc = a.ev.apres.dc;
    a.phase = 'banniere'; a.u = 0;
    const moi = monSiege();
    const nom = dc.w >= 0 ? nomCourt(dc.w) : '';
    $('banniere-texte').textContent = dc.w === moi ? tr('manche.gagneeToi', { n: dc.man + 1 }) : (dc.w >= 0 ? tr('manche.gagneePar', { n: dc.man + 1, nom: nom }) : tr('manche.personne', { n: dc.man + 1 }));
    const reste = O.MANCHES - (dc.man + 1);
    $('banniere-petit').textContent = reste > 0 ? tr('manche.reste', { n: reste }) : '';
    $('banniere').classList.add('actif');
    if (dc.w === moi) { sons.manche(); if (geo) jaillir(geo.cx, geo.cy, 30, '#ffd21f', 'etoile', 260); } else sons.non();
  }

  function finirAnim() {
    const a = anim;
    anim = null;
    vue = O.copier(a.ev.apres);
    if (a.ev.apres.dc && a.ev.apres.dc.w > -2) {
      // nouvelle manche : la banquise est refaite, tout le monde remonte dessus
      nageurs = [];
      angles = vue.p.map((p) => Math.atan2(-p.y, -p.x));
      if (vue.man < O.MANCHES) toast(tr('manche.debut', { n: vue.man + 1 }), 1400);
    }
    debutTour = Date.now();
    dernierTic = -1;
    if (partie && partie.phase === 'jeu' && !file.length && vue.man < O.MANCHES && R.aQui(vue) === monSiege()) { sons.tour(); orienterClavier(); }
    majInterface();
    demarrerAnimSuivante();
  }

  function viderAnimations() {
    file = []; anim = null; particules = []; nageurs = []; ecrases = {};
    $('banniere').classList.remove('actif');
  }

  // ---------------------------------------------------------------------
  //  Lancer : au doigt (lance-pierre) ou au clavier
  // ---------------------------------------------------------------------
  function peutJouer() {
    if (!partie || !vue || anim || file.length || enPause || attenteTuto || modeApercu) return false;
    if (ecran !== 'jeu' || partie.phase !== 'jeu') return false;
    try { return partie.monTour() && R.aQui(vue) === partie.siege && O.vivant(vue, partie.siege); } catch (e) { return false; }
  }

  const TIRE_MAX = 5200;   // tirer de cette longueur (unités du monde) = pleine force
  function versMonde(ev) {
    const r = $('plateau').getBoundingClientRect();
    return { x: (ev.clientX - r.left - geo.cx) / geo.s, y: (ev.clientY - r.top - geo.cy) / geo.s, px: ev.clientX, py: ev.clientY };
  }

  function majVisee(m) {
    const moi = monSiege(), p = vue.p[moi];
    let dx, dy;
    if (visee.accroche) { dx = p.x - m.x; dy = p.y - m.y; }
    else { dx = (visee.sx - m.px) / geo.s; dy = (visee.sy - m.py) / geo.s; }
    const L = Math.hypot(dx, dy);
    const pw = Math.min(1, L / TIRE_MAX);
    visee.p = pw;
    visee.x = L > 0 ? dx / L * pw * 1000 : 0;
    visee.y = L > 0 ? dy / L * pw * 1000 : 0;
    sons.tendu(pw);
  }

  function lancer(vx, vy) {
    let x = Math.round(vx), y = Math.round(vy);
    let garde = 0;
    while (x * x + y * y > 1000000 && garde++ < 30) { x = Math.trunc(x * 0.995); y = Math.trunc(y * 0.995); }
    if (x * x + y * y < 3600) { sons.non(); return false; }
    const a = { x: x, y: y };
    if (!R.valide(vue, monSiege(), a)) { sons.non(); return false; }
    if (partie.jouer(a)) { clavier.actif = false; return true; }
    return false;
  }

  function orienterClavier() {
    const moi = monSiege();
    if (!vue || moi < 0 || !vue.p[moi]) return;
    const p = vue.p[moi];
    let best = null, d = Infinity;
    vue.p.forEach((q, i) => { if (i !== moi && O.vivant(vue, i)) { const dd = (q.x - p.x) ** 2 + (q.y - p.y) ** 2; if (dd < d) { d = dd; best = q; } } });
    clavier.a = best ? Math.atan2(best.y - p.y, best.x - p.x) : Math.atan2(-p.y, -p.x);
  }

  function brancherCommandes() {
    const cv = $('plateau');
    cv.addEventListener('pointerdown', (ev) => {
      audio();
      dernierGeste = Date.now();
      if (!peutJouer() || !geo) { if (partie && partie.phase === 'jeu' && ecran === 'jeu' && !enPause && !anim && !file.length && !peutJouer()) attendsTonTour(); return; }
      const m = versMonde(ev), p = vue.p[monSiege()];
      const proche = Math.hypot(m.x - p.x, m.y - p.y) < Math.max(O.RP * 2.2, 40 / geo.s);
      visee = { x: 0, y: 0, p: 0, sx: ev.clientX, sy: ev.clientY, accroche: proche, id: ev.pointerId };
      clavier.actif = false;
      try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* rien */ }
      ev.preventDefault();
    });
    cv.addEventListener('pointermove', (ev) => {
      if (!visee || ev.pointerId !== visee.id) return;
      if (!peutJouer()) { visee = null; return; }
      majVisee(versMonde(ev));
    });
    const relacher = (ev) => {
      if (!visee || ev.pointerId !== visee.id) return;
      const v = visee;
      visee = null;
      dernierGeste = Date.now();
      if (!peutJouer()) return;
      if (v.p < 0.08) { if (v.p > 0.01) toast(tr('jeu.tropDoux'), 1300); return; }
      lancer(v.x, v.y);
    };
    cv.addEventListener('pointerup', relacher);
    cv.addEventListener('pointercancel', (ev) => { if (visee && ev.pointerId === visee.id) visee = null; });
  }

  let dernierAttends = 0;
  function attendsTonTour() {
    if (Date.now() - dernierAttends < 1500) return;
    dernierAttends = Date.now();
    toast(tr('tour.attends'), 1300);
    sons.non();
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran === 'jeu' && (ev.code === 'Escape' || ev.code === 'KeyP')) {
      ev.preventDefault();
      if ($('voile-pause').classList.contains('actif')) fermerPause(); else if (!voileOuvert()) ouvrirPause();
      return;
    }
    if (ecran !== 'jeu' || voileOuvert()) return;
    const touches = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Enter', 'KeyA', 'KeyD', 'KeyW', 'KeyS'];
    if (touches.indexOf(ev.code) < 0) return;
    ev.preventDefault();
    audio();
    dernierGeste = Date.now();
    if (!peutJouer()) { attendsTonTour(); return; }
    if (!clavier.actif) { clavier.actif = true; orienterClavier(); }
    if (ev.code === 'ArrowLeft' || ev.code === 'KeyA') clavier.a -= ev.shiftKey ? 0.02 : 0.07;
    else if (ev.code === 'ArrowRight' || ev.code === 'KeyD') clavier.a += ev.shiftKey ? 0.02 : 0.07;
    else if (ev.code === 'ArrowUp' || ev.code === 'KeyW') { clavier.p = Math.min(1, clavier.p + 0.05); sons.tendu(clavier.p); }
    else if (ev.code === 'ArrowDown' || ev.code === 'KeyS') { clavier.p = Math.max(0.1, clavier.p - 0.05); sons.tendu(clavier.p); }
    else if (ev.code === 'Space' || ev.code === 'Enter') lancer(Math.cos(clavier.a) * clavier.p * 1000, Math.sin(clavier.a) * clavier.p * 1000);
  });

  // ---------------------------------------------------------------------
  //  Places, messages, barre de temps
  // ---------------------------------------------------------------------
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom d'une place : le pseudo d'un vrai joueur en ligne (partie.sieges()[s].nom),
  // sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  // Nom dans une phrase : « Toi », le pseudo, ou le pingouin de couleur.
  function nomCourt(s) {
    const info = siegesActuels()[s] || {};
    if (s === monSiege()) return tr('place.toi');
    if (info.humain && info.nom) return info.nom;
    return tr('couleur.' + s);
  }
  function remplirTag(tag, role, nom) {
    if (tag.dataset.role === role && tag.dataset.nom === nom) return;
    tag.dataset.role = role; tag.dataset.nom = nom;
    tag.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
    const sp = document.createElement('span'); sp.textContent = nom; tag.appendChild(sp);
  }

  function construirePlaces() {
    const boite = $('places'), salon = $('salon-places');
    boite.textContent = ''; salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'tete'; cv.width = 88; cv.height = 88;
      const cr = document.createElement('canvas'); cr.className = 'couronne'; cr.width = 52; cr.height = 40;
      couronne(cr.getContext('2d'), 26, 22, 40);
      const tag = document.createElement('span'); tag.className = 'tag';
      const m = document.createElement('div'); m.className = 'manches';
      for (let k = 0; k < O.MANCHES; k++) m.appendChild(document.createElement('i'));
      d.append(cv, cr, tag, m);
      boite.appendChild(d);
      const ds = document.createElement('div');
      ds.className = 'salon-place'; ds.id = 'salon-place-' + s;
      const cs = document.createElement('canvas'); cs.width = 112; cs.height = 112;
      const ts = document.createElement('span'); ts.className = 'tag';
      ds.append(cs, ts);
      salon.appendChild(ds);
    }
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels(), moi = monSiege();
    const tour = anim ? anim.ev.siege : (e && partie && partie.phase === 'jeu' && !attenteTuto ? R.aQui(e) : -1);
    let actifs = 0;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: s === moi };
      const ac = !e || !!e.ac[s];
      d.hidden = !ac;
      if (ac) actifs++;
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', s === moi);
      d.classList.toggle('chef', !!info.chef);
      const dansLEau = !!(e && e.p[s] && e.p[s].o && ac) || !!(anim && anim.tombes[s]);
      d.classList.toggle('eau', dansLEau);
      const role = s === moi ? 'toi' : roleDe(info), nom = nomPlace(info, role);
      remplirTag(d.querySelector('.tag'), role, nom);
      const cle = s + '|' + (s === moi ? prog.tenue.p + '-' + prog.tenue.b + '-' + prog.tenue.e : 'r');
      const cv = d.querySelector('canvas.tete');
      if (cv.dataset.cle !== cle) { cv.dataset.cle = cle; const c = cv.getContext('2d'); c.clearRect(0, 0, 88, 88); medaillon(c, s, 44, 44, 42, moi); }
      const mg = e ? e.mg[s] : 0;
      d.querySelectorAll('.manches i').forEach((i, k) => i.classList.toggle('oui', k < mg));
      d.setAttribute('aria-label', tr('place.aria', { couleur: tr('couleur.' + s), nom: nom, n: mg }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
    $('places').classList.toggle('trois', actifs === 3);
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    if (anim) {
      const s = anim.ev.siege;
      return s === monSiege() ? tr('tour.glisse') : tr('tour.lance', { nom: nomCourt(s) });
    }
    if (file.length) return '';
    if (e.man >= O.MANCHES) return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) return e.p[s].bo ? tr('tour.toiPoisson') : tr('tour.toi');
    return tr('tour.nom', { nom: nomCourt(s) });
  }

  function majInfos() {
    let info = '';
    const e = vue;
    const m = e ? Math.min(O.MANCHES, e.man + 1) : 1;
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length, coin: tr('coin.' + COINS[coinDe(niveau)].id), m: m });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche, m: m });
    $('info-niveau').textContent = info;
    const t = texteMessage();
    if ($('message').textContent !== t) $('message').textContent = t;
    const aide = peutJouer() ? tr(clavier.actif ? 'jeu.aideClavier' : 'jeu.aide') : '';
    if ($('aide').textContent !== aide) $('aide').textContent = aide;
  }

  function majInterface() { majPlaces(); majInfos(); }

  function majTemps() {
    const barre = $('temps');
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && vue && partie.phase === 'jeu' && !anim && !file.length && vue.man < O.MANCHES) {
      const s = R.aQui(vue), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------
  let rafId = 0, tPrec = 0, derMaj = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu') return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    if (!enPause && !modeApercu) avancerAnim(dt);
    dessinerJeu(t / 1000, enPause || modeApercu ? 0 : dt);
    if (t - derMaj > 200) { derMaj = t; majInfos(); majTemps(); majCompte(); }
    rafId = requestAnimationFrame(boucle);
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------
  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': file.push({ ev: ev }); debutTour = Date.now(); dernierTic = -1; break;
      case 'fin': file.push({ fin: true, resultat: ev.resultat, jeton: jeton }); if (partie.mode === 'en-ligne') finEnAttente = true; break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function prendreEtat() {
    viderAnimations();
    vue = partie.etat ? O.copier(partie.etat) : null;
    if (vue) angles = vue.p.map((p) => Math.atan2(-p.y, -p.x));
    debutTour = Date.now();
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    prendreEtat();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  function surManche() {
    jeton++;
    // Fin précédente pas encore montrée (le chef a relancé très vite) : on la compte quand même.
    if (file.some((x) => x.fin) && partie.mode === 'en-ligne' && vue && monSiege() >= 0) {
      const r = R.fin(lireFinal()) || null;
      if (r && window.FMG) window.FMG.reportEnd({ completed: r.classement[0] === monSiege(), level: vue.n + 1 });
    }
    prendreEtat();
    fermerVoile('voile-fin'); fermerVoile('voile-salon');
    resultatSalon = null; finEnAttente = false; lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('partie.nouvelle', { n: partie.manche }), 1800); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    if (vue && R.aQui(vue) === monSiege()) orienterClavier();
  }
  // État final d'une partie dont les coups attendent encore d'être montrés.
  function lireFinal() {
    let e = vue;
    file.forEach((x) => { if (x.ev) e = x.ev.apres; });
    if (anim) e = file.length ? e : anim.ev.apres;
    return e;
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la partie,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;            // le résultat de la partie ouvrira le salon
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'partie.gagnee' : 'partie.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels(), moi = monSiege();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + (info.moi ? prog.tenue.p + '-' + prog.tenue.b + '-' + prog.tenue.e : '');
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44, info.moi ? s : -1);
        if (info.chef) couronne(c, 56, 18, 30);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { couleur: tr('couleur.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomChef || tr('couleur.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texte = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texte) bouton.textContent = texte;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  // ---------------------------------------------------------------------
  //  Fins de partie : victoire, défaite, classement
  // ---------------------------------------------------------------------
  function montrerFin(it) {
    if (it.jeton !== jeton || !partie) return;
    const j = jeton;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (partie.mode === 'en-ligne') afficherFinEnLigne(); else afficherFin();
    }, 450);
  }

  function scoreDe(e, s) { return 100 * e.mg[s] + 30 * e.ko[s] + 10 * e.pf[s]; }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    ordre.forEach((s, k) => {
      if (!e.ac[s]) return;
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64; medaillon(cv.getContext('2d'), s, 32, 32, 30, moi);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.manchesCourt', { n: e.mg[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  // Objets du vestiaire débloqués entre deux totaux d'étoiles.
  function nouveautesVestiaire(avant, apres) {
    const l = [];
    ESPECES.forEach((x) => { if (x.s > avant && x.s <= apres) l.push(tr('espece.' + x.id)); });
    BONNETS.forEach((x) => { if (x.s > avant && x.s <= apres) l.push(tr('bonnet.' + x.id)); });
    ECHARPES.forEach((x) => { if (x.s > avant && x.s <= apres) l.push(tr('echarpe.' + x.id)); });
    return l;
  }

  function afficherFin() {
    const e = vue;
    if (!e) return;
    const moi = monSiege(), sieges = siegesActuels();
    const res = R.fin(e);
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-cadeau').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1, mg = moi >= 0 ? e.mg[moi] : 0, score = moi >= 0 ? scoreDe(e, moi) : 0;
      const gagne = mg >= 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = Math.min(3, mg);
      const ancienRecord = prog.records[i];
      const record = score > ancienRecord;
      if (record) prog.records[i] = score;
      let debloque = false;
      const totalAvant = totalEtoiles();
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), score);
        // Parcours terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
        const cadeaux = nouveautesVestiaire(totalAvant, totalEtoiles());
        if (cadeaux.length) $('fin-cadeau').textContent = tr('fin.cadeau', { objets: cadeaux.join(', ') });
      }
      const premier = res && res.classement[0] === moi;
      $('fin-titre').textContent = gagne ? tr(premier ? 'fin.champion' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-points').textContent = tr('fin.manches', { n: mg, total: O.MANCHES });
      $('fin-detail').textContent = tr('fin.score', { score: score, ko: e.ko[moi] || 0, poissons: e.pf[moi] || 0 });
      $('fin-record').textContent = record && ancienRecord > 0 ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, score) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : (gagne ? '' : tr('fin.conseil')));
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
      enPartie = false;
      if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    } else {
      // Partie en ligne repassée contre des robots sur l'appareil (serveur absent,
      // connexion perdue) : les parties s'enchaînent seules.
      const gagne = !!(res && res.classement[0] === moi);
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = tr(gagne ? 'partie.gagnee' : 'partie.finie');
      $('fin-etoiles').textContent = ''; $('fin-etoiles').style.display = 'none';
      $('fin-points').textContent = moi >= 0 ? tr('fin.manches', { n: e.mg[moi], total: O.MANCHES }) : '';
      $('fin-detail').textContent = ''; $('fin-record').textContent = ''; $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
      if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    }
    ouvrirVoile('voile-fin');
  }

  // Fin d'une partie en ligne : classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = vue;
    if (!e) return;
    const moi = monSiege(), res = R.fin(e);
    const gagne = !!(res && moi >= 0 && res.classement[0] === moi);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('partie.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
  }

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 5 === 4 ? '#ffffff' : COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  const voileOuvert = () => !!document.querySelector('.voile.actif');
  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  let toastMinuteur = 0;
  function toast(texte, duree) {
    const t = $('toast');
    t.textContent = texte;
    t.classList.add('actif');
    clearTimeout(toastMinuteur);
    toastMinuteur = setTimeout(() => t.classList.remove('actif'), duree || 2400);
  }
  function bandeau(texte) {
    $('bandeau-texte').textContent = texte;
    $('bandeau').classList.toggle('actif', !!texte);
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------
  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    visee = null;
    if (partie) partie.pause(true);
    $('pause-ligne').style.display = session === 'ligne' && partie && partie.mode === 'en-ligne' ? '' : 'none';
    $('btn-recommencer').style.display = session === 'solo' ? '' : 'none';
    $('btn-pause-niveaux').style.display = session === 'solo' ? '' : 'none';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
  }

  // ---------------------------------------------------------------------
  //  Lancer une partie, quitter, niveaux
  // ---------------------------------------------------------------------
  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null; session = null; enPartie = false; enPause = false; attenteTuto = false;
    vue = null; visee = null; clavier.actif = false;
    viderAnimations();
    bandeau('');
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon'].forEach(fermerVoile);
    resultatSalon = null; finEnAttente = false; lancement = false;
  }

  // Parcours solo : niveau n contre des robots (force croissante, donnée par le terrain).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true; enPause = false;
    fermerVoile('voile-fin'); fermerVoile('voile-pause');
    viderAnimations();
    vue = R.depart(graineHasard(niveau * 97), PLACES, { niveau: niveau });
    angles = vue.p.map((p) => Math.atan2(-p.y, -p.x));
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : robots aux places vides, salon avant chaque partie.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  // ---------------------------------------------------------------------
  //  Vestiaire
  // ---------------------------------------------------------------------
  function dessinerApercuVestiaire(t) {
    const cv = $('vest-apercu'), c = cv.getContext('2d');
    c.clearRect(0, 0, 360, 400);
    const gr = c.createRadialGradient(180, 220, 20, 180, 220, 200);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#bfe6fb00');
    c.fillStyle = gr; c.fillRect(0, 0, 360, 400);
    c.fillStyle = '#dff2fc'; ell(c, 180, 352, 140, 30); c.fill();
    c.strokeStyle = '#ffffff'; c.lineWidth = 4; ell(c, 180, 352, 140, 30); c.stroke();
    pingouinCote(c, 180, 352, 280, { coul: COUL[0], fonce: COUL_FONCE[0], espece: ESPECES[prog.tenue.p].id, bonnet: BONNETS[prog.tenue.b].id, echarpe: ECHARPES[prog.tenue.e].id, t: t });
  }
  let rafVest = 0;
  function boucleVestiaire(t) { rafVest = 0; if (ecran !== 'vestiaire') return; dessinerApercuVestiaire(t / 1000); rafVest = requestAnimationFrame(boucleVestiaire); }

  function ouvrirVestiaire() {
    const total = totalEtoiles();
    const remplir = (boite, liste, cle, champ) => {
      boite.textContent = '';
      liste.forEach((x, i) => {

    const px = X(500), py = Y(420);
    c.fillStyle = '#ffffffee';
    for (let i = 0; i < 26; i++) { const a = -Math.PI * (0.1 + (i / 26) * 0.8), d = (60 + (i * 37) % 70) * k; rond(c, px + Math.cos(a) * d, py + Math.sin(a) * d * 1.3, (5 + (i % 4) * 3) * k); c.fill(); }
    c.strokeStyle = '#ffffffcc'; c.lineWidth = 4 * k; ell(c, px, py + 8 * k, 95 * k, 22 * k); c.stroke();
    c.lineWidth = 2.5 * k; ell(c, px, py + 10 * k, 130 * k, 32 * k); c.stroke();
    c.save(); c.translate(X(490), Y(330)); c.rotate(-0.9);
    pingouinCote(c, 0, 0, 120 * k, { coul: COUL[1], fonce: COUL_FONCE[1], espece: 'classique', bonnet: 'pompon', echarpe: 'unie', t: 0.3, regard: 1 });
    c.restore();
    // étoiles du choc
    c.fillStyle = '#ffe14a';
    [[430, 400, 22], [455, 360, 14], [400, 370, 12], [470, 440, 10]].forEach((p) => etincelle(c, X(p[0]), Y(p[1]), p[2] * k));
    // la banquise au premier plan
    c.fillStyle = '#7fc3e6'; ell(c, X(250), Y(640), 440 * k, 150 * k); c.fill();
    const gb = c.createLinearGradient(0, Y(470), 0, Y(800));
    gb.addColorStop(0, '#ffffff'); gb.addColorStop(1, '#cdeafa');
    c.fillStyle = gb; ell(c, X(250), Y(612), 430 * k, 140 * k); c.fill();
    c.strokeStyle = '#ffffff'; c.lineWidth = 4 * k; ell(c, X(250), Y(612), 426 * k, 137 * k); c.stroke();
    // poissons qui sautent
    dessinerPoisson(c, X(120), Y(410), 18 * k, 0.4, -0.6);
    dessinerPoisson(c, X(560), Y(560), 15 * k, 1.1, 2.4);
    // spectateur jaune sur la glace, au fond
    pingouinCote(c, X(110), Y(530), 110 * k, { coul: COUL[3], fonce: COUL_FONCE[3], espece: 'classique', bonnet: 'oreilles', echarpe: 'pois', t: 0.5, regard: 1 });
    // traînée de neige derrière le héros
    c.fillStyle = '#ffffffdd';
    for (let i = 0; i < 24; i++) { rond(c, X(60 + i * 9 - (i % 3) * 12), Y(572 - (i % 5) * 10 + i * 1.2), (5 + (i % 4) * 3) * k); c.fill(); }
    c.strokeStyle = '#ffffffcc'; c.lineWidth = 5 * k; c.lineCap = 'round';
    [[40, 520, 150, 540], [20, 560, 140, 575], [60, 600, 170, 605]].forEach((l) => { c.beginPath(); c.moveTo(X(l[0]), Y(l[1])); c.lineTo(X(l[2]), Y(l[3])); c.stroke(); });
    // le héros : le pingouin bleu, en grand, qui file sur le ventre
    c.save();
    c.shadowColor = '#ffffff'; c.shadowBlur = 18 * k;
    pingouinCote(c, X(300), Y(610), 230 * k, { coul: COUL[0], fonce: COUL_FONCE[0], espece: 'classique', bonnet: 'pompon', echarpe: 'rayee', glisse: true, t: 0.15, regard: 1 });
    c.restore();
    // premier plan : glaçons coupés par le bord
    c.fillStyle = '#e9f8ff'; c.strokeStyle = '#a9d8f0'; c.lineWidth = 3 * k;
    [[-10, 760, 70], [610, 740, 60], [520, 800, 50]].forEach((b) => { c.beginPath(); c.moveTo(X(b[0] - b[2]), Y(b[1] + b[2] * 0.5)); c.lineTo(X(b[0] - b[2] * 0.4), Y(b[1] - b[2])); c.lineTo(X(b[0] + b[2]), Y(b[1] - b[2] * 0.3)); c.lineTo(X(b[0] + b[2] * 0.8), Y(b[1] + b[2] * 0.6)); c.closePath(); c.fill(); c.stroke(); });
  }

  function cacherInterface() {
    document.querySelectorAll('.ecran, .voile, #toast, #confettis, #plateau, #bandeau, #banniere, .jel-langue, jel-langue').forEach((el) => el.style.setProperty('display', 'none', 'important'));
  }
  function demarrerAffiche() {
    cacherInterface();
    $('fond').style.display = 'block';
    dessinerAffiche();
    setTimeout(cacherInterface, 50); setTimeout(cacherInterface, 400); setTimeout(cacherInterface, 1200);
    window.addEventListener('resize', dessinerAffiche);
  }

  // ---------------------------------------------------------------------
  //  Images du jeu (page du jeu) : window.JEL_APERCU = 1, 2 ou 3
  //  Le jeu s'ouvre directement en pleine partie solo, avec sa vraie
  //  interface ; l'état est préparé par les règles (graine fixe), puis figé :
  //  rien ne bouge, aucun son, rien d'écrit dans la sauvegarde.
  //    1 = niveau 1 : à toi, la flèche tirée vers le pingouin rouge ;
  //    2 = niveau 9 : phoques et fonte, un robot glisse et pousse ;
  //    3 = niveau 18 (ordinateur) : grotte, pente, glaçons, poissons.
  // ---------------------------------------------------------------------
  const MOMENTS_APERCU = { 1: { niveau: 1, graine: 12, coups: 0 }, 2: { niveau: 9, graine: 21, coups: 2 }, 3: { niveau: 18, graine: 33, coups: 5 } };
  function ouvrirApercu(n) {
    const m = MOMENTS_APERCU[n], al = graineHasard(m.graine * 7919 + 1);
    niveau = m.niveau; session = 'solo'; enPartie = false;
    let e = R.depart(al, PLACES, { niveau: niveau });
    for (let i = 0; i < m.coups && e.man === 0; i++) { const s = R.aQui(e); const a = R.bot(O.copier(e), s, al, 0.8); const ap = R.jouer(O.copier(e), s, a, al); if (ap.man > 0) break; e = ap; }
    // à toi de jouer (place 0), ou un robot qui glisse
    const sieges = [0, 1, 2, 3].map((s) => ({ moi: s === 0, humain: s === 0, chef: false }));
    partie = {
      mode: 'solo', phase: 'jeu', siege: 0, chef: -1, manche: 1, etat: e,
      sieges: () => sieges, monTour: () => R.aQui(vue) === 0 && !anim, jouer: () => false, pause: () => {}, quitter: () => {},
      estChef: () => false, recommencer: () => false, lancerManche: () => false
    };
    afficherEcran('jeu');
    if (n === 1) {
      e.tour = 0;
      vue = e;
      angles = e.p.map((p) => Math.atan2(-p.y, -p.x));
      const me = e.p[0];
      let cible = e.p[1];
      const dx = cible.x - me.x, dy = cible.y - me.y, L = Math.hypot(dx, dy);
      visee = { x: dx / L * 780, y: dy / L * 780, p: 0.78, sx: 0, sy: 0, accroche: true, id: -1 };
      angles[0] = Math.atan2(dy, dx);
    } else {
      // un robot lance : on fige la glissade juste après le premier choc
      let s = R.aQui(e);
      if (s === 0) { e.mg[0] = 1; e.jc[0] = 1; e.tour = 1; s = 1; }
      const a = R.bot(O.copier(e), s, al, 0.95);
      const apres = R.jouer(O.copier(e), s, a, al);
      vue = e;
      angles = e.p.map((p) => Math.atan2(-p.y, -p.x));
      const rec = { pos: [], ev: [] };
      O.glisser(O.copier(e), s, a, rec);
      const choc = rec.ev.find((x) => x.k === 'choc' || x.k === 'phoque' || x.k === 'bloc');
      anim = { ev: { siege: s, action: a, avant: e, apres: apres, moi: false }, rec: rec, k: Math.min(rec.pos.length - 2, choc ? choc.t + 10 : Math.floor(rec.pos.length * 0.35)), u: 0, iev: 0, phase: 'glisse', tombes: {}, manges: [] };
      const f = rec.pos[Math.floor(anim.k)], f0 = rec.pos[Math.max(0, Math.floor(anim.k) - 4)];
      for (let q = 0; q < PLACES; q++) { const ddx = f[q * 2] - f0[q * 2], ddy = f[q * 2 + 1] - f0[q * 2 + 1]; if (ddx * ddx + ddy * ddy > 30) angles[q] = Math.atan2(ddy, ddx); }
      // des étoiles du choc, figées
      if (choc && f) {
        geo = geometrie(e, window.innerWidth, window.innerHeight);
        const x = geo.cx + f[choc.a * 2] * geo.s, y = geo.cy + f[choc.a * 2 + 1] * geo.s;
        for (let i = 0; i < 9; i++) { const ang = i * TAU / 9; particules.push({ x: x + Math.cos(ang) * 30, y: y + Math.sin(ang) * 30, vx: 0, vy: 0, vie: 99, k: 6, coul: '#ffe14a', forme: 'etoile' }); }
      }
    }
    majInterface();
  }

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------
  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-vestiaire').addEventListener('click', () => { audio(); sons.clic(); ouvrirVestiaire(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('vest-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-tuto-ok').addEventListener('click', () => { audio(); sons.clic(); fermerTuto(); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && !modeApercu && ecran === 'jeu' && !enPause && !voileOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && monSiege() >= 0 ? scoreDe(vue, monSiege()) : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'titre' && !modeAffiche) dessinerTitre(performance.now()); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  brancherCommandes();
  try { window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { /* rien */ }
  if (modeAffiche) { demarrerAffiche(); return; }
  if (modeApercu) { ouvrirApercu(numeroApercu); return; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
