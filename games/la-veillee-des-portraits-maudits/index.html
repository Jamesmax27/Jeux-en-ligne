  // Pluie de cire dorée et de flammes à la victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 70, vy: 110 + Math.random() * 150, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: ['#ffd77a', '#ffb02a', '#fff2b0', COUL[i % 4]][i % 4], k: 5 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; ell(c, 0, 0, b.k * 0.4, b.k * 0.7); c.fill(); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, nuits, journal
  // ---------------------------------------------------------------------

  let attenteTuto = false;

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;

  // Galerie voilée de la nuit n, en attendant le début (tutoriel).
  function apercu(n) {
    const nuit = NIVEAUX[n - 1], N = nuit.l * nuit.h;
    const e = { n: n - 1, l: nuit.l, h: nuit.h, t: [], p: [], vu: [], mv: [], tick: 0, sc: [], pa: [], tour: 0, prem: -1, dame: 0, dmax: nuit.d, ech: nuit.ech || 0, noir: !!nuit.noir, ner: 0, der: null };
    for (let i = 0; i < N; i++) { e.t.push(0); e.p.push(-1); e.vu.push(-1); e.mv.push(0); }
    for (let s = 0; s < PLACES; s++) { e.sc.push(O.BOUGIES); e.pa.push(0); }
    return e;
  }

  // Parcours solo : nuit n contre 3 robots (force croissante, donnée par la nuit).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    aff = null;
    prendreVue(apercu(niveau));
    dameAff = null;
    particules.length = 0;
    rejoue = false;
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNuit(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const liste = $('liste-nuits');
    liste.textContent = '';
    for (let g = 0; g < 4; g++) {
      const ouverte = g * 5 + 1 <= prog.debloque;
      const h = document.createElement('h3');
      h.className = 'galerie-titre' + (ouverte ? '' : ' ferme');
      h.textContent = (ouverte ? '' : '🔒 ') + tr('galerie.' + g);
      liste.appendChild(h);
      const grille = document.createElement('div');
      grille.className = 'grille';
      for (let i = g * 5; i < g * 5 + 5; i++) {
        const n = i + 1, ouvert = n <= prog.debloque;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
        const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
        const et = document.createElement('small');
        for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
        b.append(num, et);
        b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
        if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
        else b.disabled = true;
        grille.appendChild(b);
      }
      liste.appendChild(grille);
    }
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
  }

  function ouvrirJournal() {
    const liste = $('liste-pages');
    liste.textContent = '';
    NIVEAUX.forEach((_, i) => {
      if (i % 5 === 0) {
        const h = document.createElement('h3');
        h.className = 'galerie-titre';
        h.textContent = tr('galerie.' + (i / 5));
        liste.appendChild(h);
      }
      const gagnee = prog.etoiles[i] > 0;
      const p = document.createElement('div');
      p.className = 'page' + (gagnee ? '' : ' vide');
      const h = document.createElement('h3'); h.textContent = tr('journal.nuit', { n: i + 1 });
      const txt = document.createElement('p'); txt.textContent = gagnee ? tr('journal.' + (i + 1)) : tr('journal.ferme');
      p.append(h, txt);
      liste.appendChild(p);
    });
    $('journal-total').textContent = tr('journal.total', { n: pagesGagnees(), max: NIVEAUX.length });
    afficherEcran('journal');
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés : une petite galerie qui se joue toute seule
  // ---------------------------------------------------------------------

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#2a1a10'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // Rangée de bougies (n allumées) pour les démonstrations.
  function rangBougies(c, x, y, n, dir, t) {
    for (let i = 0; i < n; i++) bougie(c, x + dir * i * 13, y, 18, t);
  }

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const PAS = 1150, j = ++tutoAnim;
    const g = { cw: 120, ch: 132, ox: 40, oy: 76, pad: 8 };
    const W = g.cw - 2 * g.pad, H = g.ch - 2 * g.pad;
    let s = null;
    const neuf = () => ({ t: d.t.slice(), face: d.t.map(() => false), pris: d.t.map(() => false), montre: d.t.map(() => 0), err: d.t.map(() => -9999), glisse: d.t.map(() => null), ret: [], moi: 3, adv: 3, dame: d.dame || 0, fumee: -9999, flash: -9999, fait: 0 });
    s = neuf();
    let debut = 0;
    function cell(i) { return [g.ox + (i % 4) * g.cw + g.pad, g.oy + Math.floor(i / 4) * g.ch + g.pad]; }
    function appliquer(et, t) {
      const op = et[0];
      if (op === 'f') { s.face[et[1]] = true; s.ret.push(et[1]); if (d.noir) s.montre[et[1]] = t + 700; }
      else if (op === 'ok') { s.ret.forEach((i) => { s.pris[i] = true; }); s.ret = []; s.moi++; }
      else if (op === 'err') { s.ret.forEach((i) => { s.err[i] = t; s.montre[i] = t + 600; s.face[i] = false; }); s.ret = []; s.moi = Math.max(0, s.moi - 1); s.dame++; s.fumee = t; }
      else if (op === 'sw') { const a = et[1], b = et[2]; const x = s.t[a]; s.t[a] = s.t[b]; s.t[b] = x; s.glisse[a] = { de: b, t0: t }; s.glisse[b] = { de: a, t0: t }; }
      else if (op === 'mir') s.montre[et[1]] = t + 900;
      else if (op === 'ecl') { s.flash = t; et[1].forEach((k) => { s.montre[k] = t + 900; }); }
      else if (op === 'souffle') { s.adv = Math.max(0, s.adv - 1); s.fumee = t; }
      else if (op === 'recul') s.dame = Math.max(0, s.dame - 3);
    }
    function image2(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ec = t - debut, k = Math.floor(ec / PAS), dans = ec - k * PAS;
      if (k >= d.et.length + 2) { s = neuf(); debut = t; }
      else if (k >= s.fait && s.fait < d.et.length) {
        const et = d.et[s.fait];
        if (et[0] !== 'f' || dans >= 700) { appliquer(et, t); s.fait++; }
      }
      c.setTransform(1, 0, 0, 1, 0, 0);
      papierPeint(c, 560, 360, d.noir ? '#0e0e16' : '#1f3326', d.noir ? '#16161f' : '#2b4535');
      // haut : toi (chat) et tes bougies, la Dame, l'adversaire
      medaillon(c, 0, 30, 34, 22);
      rangBougies(c, 64, 52, s.moi, 1, t);
      if (d.adv) { medaillon(c, 2, 530, 34, 22); rangBougies(c, 496, 52, s.adv, -1, t); }
      if (d.dame !== undefined) {
        for (let i = 0; i < 10; i++) { c.fillStyle = i < s.dame ? '#ff5a6e' : 'rgba(255,255,255,.25)'; rond(c, 190 + i * 18, 40, 5); c.fill(); }
        c.save(); c.translate(190 + Math.min(9, s.dame) * 18, 30); c.fillStyle = '#e8ecf6'; ell(c, 0, 0, 6, 12); c.fill(); c.fillStyle = '#050508'; rond(c, 0, -14, 5); c.fill(); c.fillStyle = '#f2f4fa'; ell(c, 0, -13, 3, 4); c.fill(); c.restore();
      }
      if (t - s.fumee < 900) { c.fillStyle = 'rgba(200,200,220,' + (0.6 * (1 - (t - s.fumee) / 900)).toFixed(2) + ')'; rond(c, d.adv && d.et.some((x) => x[0] === 'souffle') ? 500 : 90, 20 - (t - s.fumee) / 40, 10); c.fill(); }
      for (let i = 0; i < s.t.length; i++) {
        let [x, y] = cell(i);
        const gl = s.glisse[i];
        if (gl) { const p = Math.min(1, (t - gl.t0) / 700); const [x0, y0] = cell(gl.de); x = x0 + (x - x0) * p; y = y0 + (y - y0) * p - Math.sin(p * Math.PI) * 30; if (p >= 1) s.glisse[i] = null; }
        const te = t - s.err[i];
        if (te < 450) x += Math.sin(te / 25) * 4;
        const vis = s.pris[i] || t < s.montre[i] || (s.face[i] && !d.noir);
        c.save();
        if (d.noir && !(t < s.montre[i])) c.globalAlpha = s.pris[i] ? 0.45 : 0.3;
        tableau(c, x, y, W, H, vis ? s.t[i] : -1, t, false);
        c.restore();
        if (s.pris[i]) { c.strokeStyle = COUL[0]; c.lineWidth = 3; rr(c, x - 2, y - 2, W + 4, H + 4, 6); c.stroke(); }
        if (t < s.montre[i] && !s.face[i] && !s.pris[i]) { c.strokeStyle = 'rgba(200,230,255,.8)'; c.lineWidth = 4; rr(c, x - 3, y - 3, W + 6, H + 6, 7); c.stroke(); }
      }
      if (t - s.flash < 500) { c.fillStyle = 'rgba(235,242,255,' + (0.7 * (1 - (t - s.flash) / 500)).toFixed(2) + ')'; c.fillRect(0, 0, 560, 360); }
      // la main, pour les tableaux à retourner
      const et = s.fait < d.et.length ? d.et[s.fait] : null;
      if (et && et[0] === 'f') {
        const [x, y] = cell(et[1]);
        const q = Math.min(1, dans / 600);
        main(c, 470 + (x + W / 2 - 470) * q, 340 + (y + H / 2 - 340) * q, 1.5, q >= 1 ? Math.min(1, (dans - 600) / 100) : 0);
      }
      tutoAnimId = requestAnimationFrame(image2);
    }
    let tutoAnimId = requestAnimationFrame(image2);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function caseSous(px, py) {
    if (!vue || !geo) return -1;
    const col = Math.floor((px - geo.ox) / geo.cw), lig = Math.floor((py - geo.oy) / geo.ch);
    if (col < 0 || col >= vue.l || lig < 0 || lig >= vue.h) return -1;
    return lig * vue.l + col;
  }

  function plusProche(depuis) {
    if (!vue) return -1;
    const l = vue.l, c0 = depuis >= 0 ? depuis % l : (l - 1) / 2, r0 = depuis >= 0 ? Math.floor(depuis / l) : (vue.h - 1) / 2;
    let best = -1, bd = Infinity;
    for (let i = 0; i < vue.t.length; i++) {
      if (vue.p[i] >= 0 || i === vue.prem) continue;
      const d = Math.hypot(i % l - c0, Math.floor(i / l) - r0);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  function deplacerCurseur(dx, dy) {
    if (!vue) return;
    if (curseur < 0) { curseur = plusProche(-1); return; }
    const l = vue.l;
    let c0 = curseur % l, r0 = Math.floor(curseur / l);
    for (let k = 0; k < Math.max(l, vue.h); k++) {
      c0 += dx; r0 += dy;
      if (c0 < 0 || c0 >= l || r0 < 0 || r0 >= vue.h) return;
      const i = r0 * l + c0;
      if (vue.p[i] < 0) { curseur = i; sons.clic(); return; }
    }
  }

  function retourner(i) {
    if (!partie || enPause || attenteTuto || i < 0 || !vue) return;
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (vue.p[i] >= 0 || i === vue.prem) { sons.non(); return; }
    if (partie.jouer(i)) survol = -1;
  }

  const plateau = $('plateau');
  let appui = null;
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  plateau.addEventListener('pointerdown', (ev) => {
    audio();
    clavier = false;
    const p = point(ev);
    appui = { x: p[0], y: p[1] };
    survol = caseSous(p[0], p[1]);
  });
  plateau.addEventListener('pointermove', (ev) => {
    const p = point(ev);
    if (appui || ev.pointerType === 'mouse') survol = caseSous(p[0], p[1]);
  });
  plateau.addEventListener('pointerup', (ev) => {
    const p = point(ev);
    const i = caseSous(p[0], p[1]);
    appui = null;
    if (ev.pointerType !== 'mouse') survol = -1;
    retourner(i);
  });
  plateau.addEventListener('pointercancel', () => { appui = null; survol = -1; });
  plateau.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') survol = -1; });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) {
      ev.preventDefault(); audio();
      if (!clavier) { clavier = true; if (curseur < 0 || !vue || vue.p[curseur] >= 0) { curseur = plusProche(-1); return; } }
      deplacerCurseur(dirs[ev.code][0], dirs[ev.code][1]);
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (!clavier || curseur < 0) { clavier = true; curseur = plusProche(curseur); return; }
      retourner(curseur);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-journal').addEventListener('click', () => { audio(); sons.clic(); ouvrirJournal(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('journal-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'titre') { titreFond = null; dessinerTitre(performance.now()); } });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
})();
</script>
</body>
</html>
