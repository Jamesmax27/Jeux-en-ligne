    horizon: { N: 12, R: 4, caps: [[2, 0, 5], [1, 6, 0]], etapes: [{ s: 0, a: { p: 0, d: 'a' } }, { horizon: 1 }, { grav: 1 }] }
  };

  function etatTuto(d) {
    let g = '';
    for (let i = 0; i < d.N * d.R; i++) g += '.';
    const e = { N: d.N, R: d.R, L: 999, F: 5, hz: 0, ht: 0, k: 1, km: 99, g: g, ast: (d.ast || []).map((a) => a.slice()), mi: [], ev: [], arr: [], asp: [], q: [], ch: [] };
    (d.objets || []).forEach((o) => { const i = o[1] * d.N + o[2]; e.g = e.g.slice(0, i) + o[0] + e.g.slice(i + 1); });
    e.c = d.caps.map((p) => ({ r: p[0], s: p[1], d: 0, f: p[2], m: p[3] || 0, st: 0, pc: 0 }));
    return e;
  }

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const fondTuto = ciel(560, 360, 9);
    const PAS = 1500;
    let e = etatTuto(d), debut = 0, fait = 0, pistes = {}, tAsp = {}, pose = [];
    const j = ++tutoAnim;
    const g = geoPiste(e, 380, 360, 10, 190, 180);
    // boutons dessinés à droite : monter, avancer, plonger, mine
    const BT = { o: [450, 70], a: [450, 160], i: [450, 250], m: [522, 160], go: [522, 300] };
    function cleDe(i, t, r, s) {
      const p = pistes[i] || (pistes[i] = []);
      const der = p.length ? p[p.length - 1] : null;
      let u = s;
      if (der) { let dd = s - (((der.u % e.N) + e.N) % e.N); if (dd < -e.N / 2) dd += e.N; if (dd > e.N / 2) dd -= e.N; u = der.u + dd; }
      p.push({ t: t, r: r, u: u });
    }
    function pos(i, t) {
      const p = pistes[i], c0 = e.c[i];
      let r = c0.r, u = c0.s;
      if (p && p.length) {
        if (t >= p[p.length - 1].t) { r = p[p.length - 1].r; u = p[p.length - 1].u; }
        else if (t <= p[0].t) { r = p[0].r; u = p[0].u; }
        else for (let k = 1; k < p.length; k++) if (t <= p[k].t) { const a = p[k - 1], b = p[k], q = (t - a.t) / Math.max(1, b.t - a.t); r = a.r + (b.r - a.r) * q; u = a.u + (b.u - a.u) * q; break; }
      }
      if (c0.st === 2) {
        const ta = tAsp[i];
        if (ta === undefined || t > ta + 900) return { cache: true };
        if (t > ta) return { r: r, u: u, spirale: Math.min(1, (t - ta) / 900) };
      }
      return { r: r, u: u };
    }
    function executer(et, t) {
      if (et.grav) {
        e.c.forEach((cc, i) => {
          if (cc.st !== 0) return;
          cleDe(i, t, cc.r, cc.s);
          if (O.asteroide(e, cc.r - 1, cc.s) >= 0) { cc.f = Math.max(0, cc.f - 1); return; }
          cc.r -= 1;
          if (cc.r < e.hz) { cc.st = 2; tAsp[i] = t + 450; }
          cleDe(i, t + 450, cc.r, cc.s);
        });
        e.ast.forEach((a) => { a[1] = (a[1] + a[2] + e.N) % e.N; });
        sons.gravite(0);
      } else if (et.horizon) {
        e.hz += 1;
        e.c.forEach((cc, i) => { if (cc.st === 0 && cc.r < e.hz) { cc.st = 2; tAsp[i] = t; } });
        sons.horizon(0);
      } else {
        const a = { p: et.a.p, d: et.a.d, m: et.a.m || 0 };
        const ch = O.deplacer(e, et.s, a);
        cleDe(et.s, t, ch[0][0], ch[0][1]);
        ch.forEach((p, k) => { if (k) cleDe(et.s, t + k * 110, p[0], p[1]); });
        if (a.p > 0 && et.s === 0) sons.moteur(a.p, 0);
      }
    }
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ecoule = t - debut;
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      if (k >= d.etapes.length + 1) { e = etatTuto(d); fait = 0; pistes = {}; tAsp = {}; debut = t; pose = []; }
      else if (k >= fait && fait < d.etapes.length && dans >= (d.etapes[fait].s === 0 ? 750 : 300)) {
        executer(d.etapes[fait], t);
        fait++;
      }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 360);
      c.drawImage(fondTuto, 0, 0);
      dessinerPiste(c, e, g, { t: t, pos: (i) => pos(i, t), moi: 0, design: prog.capsule });
      // les commandes dessinées
      const prochaine = fait < d.etapes.length ? d.etapes[fait] : null;
      const actif = prochaine && prochaine.s === 0 ? prochaine.a : null;
      [['o', '#4fd8ff', -Math.PI / 2], ['a', '#ffc23d', 0], ['i', '#b48cff', Math.PI / 2]].forEach((b) => {
        const p = BT[b[0]], on = actif && actif.p > 0 && actif.d === b[0] && dans > 600;
        c.fillStyle = on ? '#2e2777' : '#1b1840'; c.strokeStyle = on ? '#4fd8ff' : '#4a4390'; c.lineWidth = 3;
        rr(c, p[0] - 30, p[1] - 30, 60, 60, 14); c.fill(); c.stroke();
        c.save(); c.translate(p[0], p[1]); c.rotate(b[2]); c.fillStyle = b[1];
        poly(c, [18, 0, 2, -14, 2, -6, -16, -6, -16, 6, 2, 6, 2, 14]); c.fill(); c.restore();
        if (on) for (let q = 0; q < actif.p; q++) { c.fillStyle = '#ffc23d'; rond(c, p[0] - 12 + q * 12, p[1] + 38, 4.5); c.fill(); }
      });
      if (d.caps[0][3]) {
        const p = BT.m, on = actif && actif.m && dans > 600;
        c.fillStyle = on ? '#5a1830' : '#1b1840'; c.strokeStyle = on ? '#ff4d5e' : '#4a4390'; c.lineWidth = 3;
        rr(c, p[0] - 24, p[1] - 30, 48, 60, 14); c.fill(); c.stroke();
        dessinerMine(c, p[0], p[1], 40, t, -1);
      }
      // jauge de carburant de ta capsule
      const f = e.c[0].f;
      for (let q = 0; q < Math.max(5, f); q++) { c.fillStyle = q < f ? '#ffc23d' : '#2c2760'; rr(c, 410 + q * 14, 14, 10, 18, 3); c.fill(); }
      // bouton d'allumage
      {
        const p = BT.go, on = actif && dans > 600 && (actif.p === 0 && !actif.m);
        c.fillStyle = on ? '#4fd8ff' : '#2a7cf0'; c.strokeStyle = '#d4f6ff'; c.lineWidth = 3;
        rr(c, p[0] - 30, p[1] - 26, 60, 52, 14); c.fill(); c.stroke();
        c.fillStyle = '#021630'; poly(c, [p[0] + 12, p[1], p[0] - 8, p[1] - 12, p[0] - 8, p[1] + 12]); c.fill();
      }
      // la main
      if (actif) {
        const cible = actif.m ? BT.m : actif.p > 0 ? BT[actif.d] : BT.go;
        const q = Math.min(1, dans / 600);
        const x = 540 + (cible[0] + 8 - 540) * q, y = 345 + (cible[1] + 10 - 345) * q;
        main(c, x, y, 1.4, dans > 600 && dans < 760 ? (dans - 600) / 160 : 0);
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#120f2c'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-hangar').addEventListener('click', () => { audio(); sons.clic(); ouvrirHangar(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('hangar-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une course solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
})();
</script>
</body>
</html>
