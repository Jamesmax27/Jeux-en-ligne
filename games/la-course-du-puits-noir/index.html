<canvas id="confettis" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // =====================================================================
  //  La Course du Puits Noir — course de capsules au tour par tour
  //  autour d'un trou noir. Solo : 20 circuits contre 5 robots. En ligne :
  //  de vrais pilotes remplacent les robots (moteur commun JEL_MULTI).
  //  Les règles et les circuits sont dans le bloc jel-regles.
  // =====================================================================

  const JEU = 'la-course-du-puits-noir';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = R.niveaux;                 // mêmes données que les règles
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);

  // Une couleur par place : cyan, rose, ambre, vert, orange, violet.
  const COUL = ['#4fd8ff', '#ff5fa8', '#ffc23d', '#6ef08a', '#ff8a3d', '#b48cff'];
  const COUL_F = ['#0b5f7a', '#7a1748', '#7a5200', '#16682c', '#7a3409', '#4a2590'];
  // Pièces de coque nécessaires pour chaque capsule du hangar.
  const CAPSULES = [0, 3, 6, 10, 14, 18];

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#120f2c"/><circle cx="10.4" cy="8" r="1.6" fill="#120f2c"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#120f2c"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = {
    etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), pieces: NIVEAUX.map(() => 0),
    debloque: 1, tutos: [], capsule: 0, options: { son: true }
  };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);
  const nbPieces = () => prog.pieces.reduce((a, b) => a + b, 0);
  const capsuleOuverte = (k) => nbPieces() >= CAPSULES[k];

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 99999, 0));
      if (Array.isArray(d.pieces)) prog.pieces = NIVEAUX.map((_, i) => entier(d.pieces[i], 0, 1, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string' && TUTOS[x]);
      prog.capsule = entier(d.capsule, 0, CAPSULES.length - 1, 0);
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
    if (!capsuleOuverte(prog.capsule)) prog.capsule = 0;
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.pieces = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.capsule = 0;
  }

  function sauver(niveauReprise, score) {
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
        pieces: prog.pieces.slice(), debloque: prog.debloque, tutos: prog.tutos.slice(), capsule: prog.capsule,
        options: { son: prog.options.son }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Son et capsule se règlent aussi hors partie : jamais de nouvelle sauvegarde là.
  function sauverReglages() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: prog.options.son }, capsule: prog.capsule }); } catch (e) { /* rien */ }
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null, bufBruit = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      const v = o.vol || 0.1;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.025, d / 4));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.vibrato) {
        const l = ac.createOscillator(), lg = ac.createGain();
        l.frequency.value = o.vibrato; lg.gain.value = f * 0.05;
        l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + d + 0.05);
      }
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      osc.connect(g); sortie.connect(ac.destination);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  // Souffle (bruit filtré) : moteurs, chocs, explosions.
  function souffle(d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      if (!bufBruit) {
        bufBruit = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const ch = bufBruit.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      }
      const t = ac.currentTime + (o.retard || 0);
      const src = ac.createBufferSource(); src.buffer = bufBruit; src.loop = true;
      const f = ac.createBiquadFilter(); f.type = o.type || 'lowpass'; f.frequency.setValueAtTime(o.f || 800, t);
      if (o.vers) f.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      const g = ac.createGain(), v = o.vol || 0.1;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.04, d / 4));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      src.connect(f); f.connect(g); g.connect(ac.destination);
      src.start(t); src.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  const sons = {
    clic: () => note(720, 0.05, { type: 'triangle', vol: 0.06 }),
    choix: () => note(520, 0.05, { type: 'square', vol: 0.03, filtre: 1800 }),
    moteur: (p, r) => { souffle(0.25 + p * 0.12, { f: 250, vers: 900 + p * 300, vol: 0.05 + p * 0.025, type: 'bandpass', retard: r }); note(70 + p * 15, 0.3 + p * 0.1, { type: 'sawtooth', vol: 0.035, filtre: 500, retard: r }); },
    glisse: (r) => note(260, 0.22, { vers: 360, vol: 0.03, type: 'triangle', retard: r }),
    choc: (r) => { souffle(0.25, { f: 700, vers: 120, vol: 0.16, retard: r }); note(95, 0.2, { type: 'square', vol: 0.06, vers: 50, filtre: 600, retard: r }); },
    mine: (r) => { souffle(0.75, { f: 1800, vers: 60, vol: 0.24, retard: r }); note(80, 0.55, { type: 'sawtooth', vol: 0.09, vers: 30, filtre: 400, retard: r }); },
    cellule: (r) => [660, 880, 1320].forEach((f, i) => note(f, 0.12, { type: 'triangle', vol: 0.07, retard: (r || 0) + i * 0.06 })),
    courant: (r) => note(400, 0.35, { vers: 1250, type: 'triangle', vol: 0.07, retard: r }),
    porte: (r, bas) => note(bas ? 950 : 320, 0.5, { vers: bas ? 240 : 980, vibrato: 18, vol: 0.07, retard: r }),
    piece: (r) => [1047, 1319, 1568, 2093].forEach((f, i) => note(f, 0.1, { vol: 0.06, retard: (r || 0) + i * 0.05 })),
    pose: (r) => { note(180, 0.12, { type: 'square', vol: 0.05, filtre: 900, retard: r }); note(1200, 0.06, { type: 'square', vol: 0.03, retard: (r || 0) + 0.1 }); },
    bloque: (r) => note(160, 0.14, { type: 'triangle', vol: 0.07, retard: r }),
    arrivee: (r) => [523, 784, 1047].forEach((f, i) => note(f, 0.2, { type: 'triangle', vol: 0.08, retard: (r || 0) + i * 0.09 })),
    aspire: (r) => { note(420, 1.2, { vers: 38, type: 'sawtooth', filtre: 900, vol: 0.09, retard: r }); souffle(1.2, { f: 2200, vers: 70, vol: 0.12, retard: r }); },
    gravite: (r) => note(72, 0.4, { vol: 0.09, vers: 48, retard: r }),
    horizon: (r) => { souffle(1.1, { f: 260, vers: 50, vol: 0.22, retard: r }); note(46, 1.1, { type: 'sawtooth', vol: 0.08, filtre: 220, retard: r }); },
    victoire: () => [523, 659, 784, 1047, 1319].forEach((f, i) => note(f, 0.26, { type: 'triangle', vol: 0.1, retard: i * 0.12 })),
    defaite: () => [392, 311, 233].forEach((f, i) => note(f, 0.34, { vol: 0.1, retard: i * 0.2, type: 'sawtooth', filtre: 900 })),
    tic: () => note(1250, 0.04, { type: 'square', vol: 0.03 }),
    tour: () => { note(880, 0.08, { vol: 0.06 }); note(1175, 0.12, { vol: 0.06, retard: 0.08 }); },
    arrive: () => { note(660, 0.12, { vol: 0.08 }); note(880, 0.16, { vol: 0.08, retard: 0.1 }); },
    part: () => { note(880, 0.12, { vol: 0.07 }); note(587, 0.16, { vol: 0.07, retard: 0.1 }); },
    non: () => note(180, 0.12, { type: 'triangle', vol: 0.06 })
  };

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.textContent = prog.options.son ? '🔊' : '🔇';
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    sauverReglages();
    majBoutonsSon();
    sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Dessins : outils, capsules, objets de la piste
  // ---------------------------------------------------------------------

  function rond(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
  function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r);
    else { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  }
  function poly(c, pts) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); }
  function graineHasard(g) { let a = g >>> 0; return () => { a = (Math.imul(a, 1664525) + 1013904223) >>> 0; return a / 4294967296; }; }

  // Une capsule, centrée en (x, y), tournée vers a (radians), longueur k.
  // design : 0 goutte, 1 flèche, 2 soucoupe, 3 aiguille, 4 scarabée, 5 éclat.
  function capsule(c, x, y, a, k, coul, fonce, design, flamme) {
    c.save(); c.translate(x, y); c.rotate(a); c.scale(k / 40, k / 40);
    c.lineJoin = 'round'; c.lineCap = 'round';
    if (flamme) {
      const f = 0.7 + 0.3 * Math.sin(performance.now() / 40);
      const g = c.createLinearGradient(-14, 0, -14 - 26 * flamme * f, 0);
      g.addColorStop(0, '#fff6c8'); g.addColorStop(0.4, '#ff9a2a'); g.addColorStop(1, 'rgba(255,60,40,0)');
      c.fillStyle = g;
      c.beginPath(); c.moveTo(-12, -6); c.quadraticCurveTo(-14 - 30 * flamme * f, 0, -12, 6); c.closePath(); c.fill();
    }
    c.lineWidth = 2.6; c.strokeStyle = fonce; c.fillStyle = coul;
    if (design === 1) {            // flèche
      poly(c, [21, 0, -13, -13, -6, 0, -13, 13]); c.fill(); c.stroke();
      c.fillStyle = '#e8fbff'; ell(c, 5, 0, 5, 3.4); c.fill();
    } else if (design === 2) {     // soucoupe
      ell(c, 0, 0, 18, 10); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.35)'; ell(c, -2, -3, 12, 3.5); c.fill();
      c.fillStyle = '#e8fbff'; ell(c, 3, 0, 7, 6); c.fill(); c.stroke();
      c.fillStyle = '#fff'; [-12, -4, 12].forEach((px) => { rond(c, px, 6, 1.6); c.fill(); });
    } else if (design === 3) {     // aiguille
      poly(c, [-14, -4, -20, -12, -8, -5]); c.fill(); c.stroke();
      poly(c, [-14, 4, -20, 12, -8, 5]); c.fill(); c.stroke();
      rr(c, -16, -5, 30, 10, 5); c.fill(); c.stroke();
      poly(c, [14, -5, 23, 0, 14, 5]); c.fill(); c.stroke();
      c.fillStyle = '#e8fbff'; ell(c, 6, 0, 5, 2.8); c.fill();
    } else if (design === 4) {     // scarabée
      c.fillStyle = fonce; ell(c, -3, -10, 11, 6, -0.4); c.fill(); ell(c, -3, 10, 11, 6, 0.4); c.fill();
      c.fillStyle = coul; ell(c, 0, 0, 17, 11); c.fill(); c.stroke();
      c.strokeStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.moveTo(-15, 0); c.lineTo(4, 0); c.stroke();
      c.fillStyle = '#e8fbff'; ell(c, 9, 0, 6, 5); c.fill();
    } else if (design === 5) {     // éclat
      poly(c, [22, 0, 5, -12, -16, -7, -10, 0, -16, 7, 5, 12]); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.45)'; poly(c, [22, 0, 5, -12, 2, 0]); c.fill();
      c.fillStyle = '#e8fbff'; ell(c, 6, 0, 4, 3); c.fill();
    } else {                       // goutte
      c.beginPath(); c.moveTo(21, 0); c.bezierCurveTo(14, -12, -10, -14, -15, -8); c.lineTo(-15, 8); c.bezierCurveTo(-10, 14, 14, 12, 21, 0); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.35)'; ell(c, 0, -6, 11, 2.5); c.fill();
      c.fillStyle = '#e8fbff'; c.strokeStyle = fonce; c.lineWidth = 2; ell(c, 7, 0, 5.5, 4.5); c.fill(); c.stroke();
    }
    c.restore();
  }

  // Couronne dorée du chef du salon (le premier joueur arrivé), base en (x, y).
  function couronne(c, x, y, k) {
    c.save(); c.translate(x, y); c.scale(k / 22, k / 22);
    c.fillStyle = '#ffc23d'; c.strokeStyle = '#6a4200'; c.lineWidth = 2.5; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-20, 0); c.lineTo(-23, -22); c.lineTo(-10, -10); c.lineTo(0, -26); c.lineTo(10, -10); c.lineTo(23, -22); c.lineTo(20, 0); c.closePath();
    c.fill(); c.stroke();
    c.fillStyle = '#fff3a8'; c.fillRect(-17, -6, 34, 3);
    c.fillStyle = '#ff4d5e'; rond(c, 0, -10, 3.5); c.fill();
    c.restore();
  }

  // Médaillon d'une place : disque sombre bordé de sa couleur, capsule dessus.
  function medaillon(c, s, x, y, r, design) {
    c.fillStyle = '#0b0920'; rond(c, x, y, r); c.fill();
    c.lineWidth = Math.max(1.5, r * 0.12); c.strokeStyle = COUL[s]; rond(c, x, y, r * 0.92); c.stroke();
    capsule(c, x, y, -Math.PI / 4, r * 1.25, COUL[s], COUL_F[s], design, 0);
  }

  // Étoiles du fond (une seule fois par taille d'écran).
  function ciel(w, h, graine) {
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(w)); cv.height = Math.max(1, Math.round(h));
    const c = cv.getContext('2d');
    const al = graineHasard(graine || 3);
    const nb2 = Math.round(w * h / 1800);
    for (let i = 0; i < nb2; i++) {
      const x = al() * w, y = al() * h, k = al();
      c.fillStyle = k > 0.95 ? '#ffe9c8' : k > 0.85 ? '#c8d8ff' : 'rgba(255,255,255,' + (0.25 + al() * 0.5).toFixed(2) + ')';
      rond(c, x, y, k > 0.95 ? 1.5 : 0.5 + al() * 0.8); c.fill();
    }
    // nébuleuses
    [[0.15, 0.2, '#b23cff22'], [0.85, 0.75, '#2a7cf022'], [0.7, 0.15, '#ff5fa816']].forEach((n) => {
      const g = c.createRadialGradient(w * n[0], h * n[1], 0, w * n[0], h * n[1], Math.max(w, h) * 0.45);
      g.addColorStop(0, n[2]); g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g; c.fillRect(0, 0, w, h);
    });
    return cv;
  }

  // Trou noir : disque d'accrétion, anneau de photons et horizon.
  function trouNoir(c, x, y, rz, t, aplati) {
    const k = aplati || 1;
    c.save(); c.translate(x, y); c.scale(1, k);
    let g = c.createRadialGradient(0, 0, rz * 0.7, 0, 0, rz * 1.9);
    g.addColorStop(0, 'rgba(255,170,80,.0)'); g.addColorStop(0.18, 'rgba(255,150,60,.55)'); g.addColorStop(0.42, 'rgba(210,70,180,.28)');
    g.addColorStop(1, 'rgba(60,20,120,0)');
    c.fillStyle = g; rond(c, 0, 0, rz * 1.9); c.fill();
    c.lineCap = 'round';
    for (let i = 0; i < 7; i++) {
      const rr2 = rz * (1.06 + i * 0.09), a0 = t / (900 + i * 260) + i * 1.7;
      c.strokeStyle = 'rgba(255,' + (200 - i * 18) + ',' + (120 + i * 12) + ',' + (0.5 - i * 0.05).toFixed(2) + ')';
      c.lineWidth = Math.max(1, rz * 0.035);
      c.beginPath(); c.arc(0, 0, rr2, a0, a0 + 1.6 + i * 0.15); c.stroke();
      c.beginPath(); c.arc(0, 0, rr2, a0 + Math.PI, a0 + Math.PI + 1.1); c.stroke();
    }
    c.restore();
    c.fillStyle = '#000'; rond(c, x, y, rz); c.fill();
    c.strokeStyle = 'rgba(255,220,160,.9)'; c.lineWidth = Math.max(1.5, rz * 0.04); rond(c, x, y, rz * 1.02); c.stroke();
    c.strokeStyle = 'rgba(255,77,94,.55)'; c.lineWidth = Math.max(1, rz * 0.02); rond(c, x, y, rz * 1.08); c.stroke();
  }

  // ---------------------------------------------------------------------
  //  Géométrie de la piste (anneaux autour du trou noir)
  // ---------------------------------------------------------------------

  function geoPiste(e, w, h, marge, cx, cy) {
    const S = Math.min(w, h);
    const ro = S / 2 - (marge || 6);
    const rh = ro * 0.36;
    return { cx: cx === undefined ? w / 2 : cx, cy: cy === undefined ? h / 2 : cy, ro: ro, rh: rh, wr: (ro - rh) / e.R, N: e.N };
  }
  const angle = (g, u) => -Math.PI / 2 + (u + 0.5) * Math.PI * 2 / g.N;
  const rayon = (g, r) => g.rh + (r + 0.5) * g.wr;
  function xy(g, r, u) { const a = angle(g, u), ra = rayon(g, r); return [g.cx + Math.cos(a) * ra, g.cy + Math.sin(a) * ra, a]; }
  const tailleCase = (g, r) => Math.min(g.wr, rayon(g, Math.max(0, r)) * Math.PI * 2 / g.N);

  function secteur(c, g, r, s) {
    const a0 = -Math.PI / 2 + s * Math.PI * 2 / g.N, a1 = a0 + Math.PI * 2 / g.N;
    const r1 = g.rh + r * g.wr, r2 = r1 + g.wr;
    c.beginPath(); c.arc(g.cx, g.cy, r2, a0, a1); c.arc(g.cx, g.cy, r1, a1, a0, true); c.closePath();
  }

  // Objets des cases
  function dessinerCourant(c, x, y, a, k, t) {
    c.save(); c.translate(x, y); c.rotate(a + Math.PI / 2);
    const p = (t / 500) % 1;
    for (let i = 0; i < 3; i++) {
      const al = 0.35 + 0.65 * ((i / 3 + p) % 1);
      c.strokeStyle = 'rgba(255,214,90,' + al.toFixed(2) + ')'; c.lineWidth = Math.max(2, k * 0.16); c.lineCap = 'round'; c.lineJoin = 'round';
      const dx = (i - 1) * k * 0.42;
      c.beginPath(); c.moveTo(dx - k * 0.2, -k * 0.35); c.lineTo(dx + k * 0.15, 0); c.lineTo(dx - k * 0.2, k * 0.35); c.stroke();
    }
    c.restore();
  }
  function dessinerCellule(c, x, y, k, t) {
    const p = 0.8 + 0.2 * Math.sin(t / 260);
    c.save(); c.translate(x, y);
    c.fillStyle = 'rgba(110,240,138,.25)'; rond(c, 0, 0, k * 0.75 * p); c.fill();
    c.fillStyle = '#6ef08a'; c.strokeStyle = '#0d5a26'; c.lineWidth = Math.max(1, k * 0.08);
    poly(c, [0, -k * 0.5, k * 0.36, -k * 0.2, k * 0.36, k * 0.25, 0, k * 0.5, -k * 0.36, k * 0.25, -k * 0.36, -k * 0.2]); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.6)'; poly(c, [0, -k * 0.5, k * 0.36, -k * 0.2, 0, 0]); c.fill();
    c.restore();
  }
  function dessinerPorte(c, x, y, a, k, t, sens) {
    const coul = sens === 'o' ? '79,216,255' : '180,140,255';
    c.save(); c.translate(x, y);
    const rot = t / (sens === 'o' ? 600 : -600);
    for (let i = 0; i < 3; i++) {
      c.strokeStyle = 'rgba(' + coul + ',' + (0.9 - i * 0.25).toFixed(2) + ')'; c.lineWidth = Math.max(1.5, k * 0.1);
      c.beginPath(); c.arc(0, 0, k * (0.5 - i * 0.12), rot + i, rot + i + 4.2); c.stroke();
    }
    // flèche : vers l'extérieur (porte) ou vers le trou (plongeoir)
    c.rotate(a + (sens === 'o' ? 0 : Math.PI));
    c.fillStyle = 'rgb(' + coul + ')';
    poly(c, [k * 0.32, 0, k * 0.02, -k * 0.2, k * 0.02, k * 0.2]); c.fill();
    c.restore();
  }
  function dessinerPiece(c, x, y, k, t) {
    c.save(); c.translate(x, y); c.rotate(Math.sin(t / 500) * 0.3);
    c.fillStyle = 'rgba(255,194,61,.3)'; rond(c, 0, 0, k * 0.7); c.fill();
    c.fillStyle = '#ffc23d'; c.strokeStyle = '#7a5200'; c.lineWidth = Math.max(1, k * 0.08);
    poly(c, [-k * 0.42, -k * 0.28, k * 0.42, -k * 0.36, k * 0.34, k * 0.32, -k * 0.36, k * 0.28]); c.fill(); c.stroke();
    c.fillStyle = '#7a5200';
    [[-0.26, -0.15], [0.26, -0.2], [0.2, 0.18], [-0.22, 0.15]].forEach((p) => { rond(c, k * p[0], k * p[1], Math.max(1, k * 0.06)); c.fill(); });
    c.restore();
    const s = 0.5 + 0.5 * Math.sin(t / 200);
    c.fillStyle = 'rgba(255,255,230,' + s.toFixed(2) + ')';
    etincelle(c, x + k * 0.45, y - k * 0.45, k * 0.22);
  }
  function etincelle(c, x, y, k) {
    c.beginPath(); c.moveTo(x, y - k); c.quadraticCurveTo(x, y, x + k, y); c.quadraticCurveTo(x, y, x, y + k); c.quadraticCurveTo(x, y, x - k, y); c.quadraticCurveTo(x, y, x, y - k); c.fill();
  }
  function dessinerRocher(c, x, y, k, graine) {
    const al = graineHasard(graine * 13 + 7);
    c.save(); c.translate(x, y);
    c.fillStyle = '#7b7488'; c.strokeStyle = '#3a3448'; c.lineWidth = Math.max(1, k * 0.08);
    c.beginPath();
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * Math.PI * 2, ra = k * (0.38 + al() * 0.14);
      if (i) c.lineTo(Math.cos(a) * ra, Math.sin(a) * ra); else c.moveTo(Math.cos(a) * ra, Math.sin(a) * ra);
    }
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#5b5568'; rond(c, k * 0.1, k * 0.08, k * 0.1); c.fill(); rond(c, -k * 0.15, -k * 0.12, k * 0.07); c.fill();
    c.fillStyle = 'rgba(255,255,255,.25)'; ell(c, -k * 0.12, -k * 0.2, k * 0.12, k * 0.06, -0.4); c.fill();
    c.restore();
  }
  function dessinerMine(c, x, y, k, t, poseur) {
    c.save(); c.translate(x, y);
    c.strokeStyle = '#ff4d5e'; c.lineWidth = Math.max(1.2, k * 0.08); c.lineCap = 'round';
    for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2 + t / 900; c.beginPath(); c.moveTo(Math.cos(a) * k * 0.2, Math.sin(a) * k * 0.2); c.lineTo(Math.cos(a) * k * 0.42, Math.sin(a) * k * 0.42); c.stroke(); }
    c.fillStyle = '#5a1830'; rond(c, 0, 0, k * 0.26); c.fill(); c.stroke();
    const on = Math.sin(t / 180) > 0;
    c.fillStyle = on ? '#ff4d5e' : '#7a2030'; rond(c, 0, 0, k * 0.11); c.fill();
    if (poseur >= 0) { c.strokeStyle = COUL[poseur]; c.lineWidth = Math.max(1, k * 0.06); rond(c, 0, 0, k * 0.5); c.stroke(); }
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  La piste entière (course, tutoriels, écran titre)
  // ---------------------------------------------------------------------

  // opt : t, pos(i) → { r, u, cache, spirale }, astU (positions des rochers),
  //       g / mi (objets affichés), moi, apercu, danger, design (capsule du joueur)
  function dessinerPiste(c, e, g, opt) {
    const t = opt.t || 0;
    const hz = e.hz || 0;
    const rz = g.rh + hz * g.wr;
    // trou noir et anneaux déjà avalés
    trouNoir(c, g.cx, g.cy, rz, t);
    // anneaux vivants
    for (let r = hz; r < e.R; r++) {
      for (let s = 0; s < e.N; s++) {
        secteur(c, g, r, s);
        if (r === hz) {
          const fort = opt.danger ? 0.25 + 0.2 * Math.sin(t / 160) : 0;
          c.fillStyle = (s + r) % 2 ? 'rgba(120,24,52,' + (0.55 + fort).toFixed(2) + ')' : 'rgba(96,18,44,' + (0.55 + fort).toFixed(2) + ')';
        } else c.fillStyle = (s + r) % 2 ? 'rgba(34,30,84,.82)' : 'rgba(26,22,66,.82)';
        c.fill();
      }
    }
    c.strokeStyle = 'rgba(180,170,255,.16)'; c.lineWidth = 1;
    for (let r = hz; r <= e.R; r++) { rond(c, g.cx, g.cy, g.rh + r * g.wr); c.stroke(); }
    c.beginPath();
    for (let s = 0; s < e.N; s++) {
      const a = -Math.PI / 2 + s * Math.PI * 2 / e.N;
      c.moveTo(g.cx + Math.cos(a) * rz, g.cy + Math.sin(a) * rz); c.lineTo(g.cx + Math.cos(a) * g.ro, g.cy + Math.sin(a) * g.ro);
    }
    c.strokeStyle = 'rgba(180,170,255,.08)'; c.stroke();
    // flèches du sens de la course, sur le bord
    c.fillStyle = 'rgba(180,170,255,.35)';
    for (let s = 2; s < e.N; s += 4) {
      const p = xy(g, e.R - 0.5 + 0.38, s + 0.5);
      c.save(); c.translate(p[0], p[1]); c.rotate(p[2] + Math.PI / 2);
      poly(c, [4, 0, -3, -3.5, -3, 3.5]); c.fill(); c.restore();
    }
    // ligne de départ et d'arrivée (damier)
    const pas = Math.max(3, g.wr / 4);
    for (let ra = rz, k = 0; ra < g.ro - 0.5; ra += pas, k++) {
      for (let j = 0; j < 2; j++) {
        c.fillStyle = (k + j) % 2 ? '#f4f2ff' : '#141030';
        c.fillRect(g.cx + (j ? 0 : -pas), g.cy - ra - pas, pas, Math.min(pas, ra + pas - rz));
      }
    }
    // objets des cases
    const gAff = opt.g || e.g;
    for (let r = hz; r < e.R; r++) {
      for (let s = 0; s < e.N; s++) {
        const ch = gAff.charAt(r * e.N + s);
        if (ch === '.' || !ch) continue;
        const p = xy(g, r, s), k = tailleCase(g, r) * 0.82;
        if (ch === 'c') dessinerCourant(c, p[0], p[1], p[2], k, t);
        else if (ch === 'e') dessinerCellule(c, p[0], p[1], k * 0.85, t);
        else if (ch === 'o' || ch === 'i') dessinerPorte(c, p[0], p[1], p[2], k, t, ch);
        else if (ch === 'p') dessinerPiece(c, p[0], p[1], k * 0.85, t);
      }
    }
    (opt.mi || e.mi || []).forEach((m) => { if (m[0] >= hz) { const p = xy(g, m[0], m[1]); dessinerMine(c, p[0], p[1], tailleCase(g, m[0]) * 0.85, t, m[2]); } });
    (e.ast || []).forEach((a, j) => {
      const u = opt.astU ? opt.astU[j] : a[1];
      const p = xy(g, a[0], u);
      dessinerRocher(c, p[0], p[1], tailleCase(g, a[0]) * 0.95, j + 1);
    });
    if (opt.apercu) dessinerApercu(c, e, g, opt.apercu, t);
    // capsules (la mienne par-dessus)
    const ordre = [];
    for (let i = 0; i < e.c.length; i++) if (i !== opt.moi) ordre.push(i);
    if (opt.moi >= 0) ordre.push(opt.moi);
    const vus = {};
    ordre.forEach((i) => {
      const p = opt.pos ? opt.pos(i) : { r: e.c[i].r, u: e.c[i].s };
      if (!p || p.cache) return;
      const cle = Math.round(p.r * 10) + ':' + Math.round(p.u * 10);
      const empile = vus[cle] = (vus[cle] || 0) + 1;
      let k = tailleCase(g, Math.max(hz, Math.round(p.r))) * 0.95;
      let q = xy(g, p.r, p.u);
      let x = q[0], y = q[1];
      if (empile > 1) { const dec = (empile - 1) * k * 0.22; x += Math.cos(q[2]) * dec * 0.6 - Math.sin(q[2]) * dec * 0.3; y += Math.sin(q[2]) * dec * 0.6 + Math.cos(q[2]) * dec * 0.3; }
      let a = q[2] + Math.PI / 2;
      if (p.spirale) {                       // aspirée : elle s'enroule vers le centre
        const s2 = p.spirale;
        const ra = rayon(g, p.r) * (1 - s2) + 2;
        const an = q[2] + s2 * 5;
        x = g.cx + Math.cos(an) * ra; y = g.cy + Math.sin(an) * ra;
        a = an + Math.PI / 2 + s2 * 1.2;
        k *= 1 - s2 * 0.85;
        c.globalAlpha = 1 - s2 * 0.6;
      }
      if (i === opt.moi && !p.spirale) {
        const h2 = 0.5 + 0.5 * Math.sin(t / 220);
        c.strokeStyle = 'rgba(255,255,255,' + (0.35 + 0.4 * h2).toFixed(2) + ')'; c.lineWidth = 2;
        rond(c, x, y, k * (0.62 + 0.08 * h2)); c.stroke();
      }
      if (opt.tour === i && !p.spirale) {
        c.strokeStyle = COUL[i]; c.lineWidth = 2; c.setLineDash([3, 3]);
        rond(c, x, y, k * 0.78); c.stroke(); c.setLineDash([]);
      }
      const design = i === opt.moi && opt.design !== undefined ? opt.design : 0;
      capsule(c, x, y, a, k, COUL[i], COUL_F[i], design, p.flamme || 0);
      c.globalAlpha = 1;
    });
  }

  // Aperçu du coup choisi : chemin, capsule fantôme, chute de fin de tour.
  function dessinerApercu(c, e, g, ap, t) {
    if (!ap.ch || ap.ch.length < 1) return;
    let u = ap.ch[0][1];
    const pts = ap.ch.map((p, k) => {
      if (k > 0) { const prev = ap.ch[k - 1][1]; let d = p[1] - prev; if (d < -e.N / 2) d += e.N; if (d > e.N / 2) d -= e.N; u += d; }
      return xy(g, p[0], u);
    });
    c.save();
    c.strokeStyle = ap.mort ? '#ff4d5e' : '#ffffff'; c.lineWidth = 3; c.setLineDash([2, 6]); c.lineDashOffset = -t / 40; c.lineCap = 'round';
    c.beginPath();
    pts.forEach((p, k) => { if (k) c.lineTo(p[0], p[1]); else c.moveTo(p[0], p[1]); });
    c.stroke();
    c.setLineDash([]);
    const fin = pts[pts.length - 1], dernier = ap.ch[ap.ch.length - 1];
    const k = tailleCase(g, Math.max(0, dernier[0])) * 0.95;
    c.globalAlpha = 0.55;
    if (!ap.arrive && !ap.aspire) capsule(c, fin[0], fin[1], fin[2] + Math.PI / 2, k, COUL[ap.moi], COUL_F[ap.moi], ap.design, 0);
    c.globalAlpha = 1;
    // la chute de fin de tour
    if (!ap.arrive && !ap.aspire) {
      const bas = xy(g, dernier[0] - 1, u);
      c.strokeStyle = ap.mort ? '#ff4d5e' : 'rgba(255,255,255,.55)'; c.lineWidth = 2; c.setLineDash([3, 4]);
      c.beginPath(); c.moveTo(fin[0], fin[1]); c.lineTo(bas[0], bas[1]); c.stroke(); c.setLineDash([]);
      c.fillStyle = ap.mort ? '#ff4d5e' : 'rgba(255,255,255,.7)';
      c.save(); c.translate(bas[0], bas[1]); c.rotate(Math.atan2(bas[1] - fin[1], bas[0] - fin[0]));
      poly(c, [5, 0, -4, -4, -4, 4]); c.fill(); c.restore();
    }
    if (ap.mort || ap.aspire) {
      const p = ap.aspire ? fin : xy(g, Math.max(e.hz || 0, dernier[0] - 1), u);
      c.strokeStyle = '#ff4d5e'; c.lineWidth = 4; c.lineCap = 'round';
      const z = k * 0.4;
      c.beginPath(); c.moveTo(p[0] - z, p[1] - z); c.lineTo(p[0] + z, p[1] + z); c.moveTo(p[0] + z, p[1] - z); c.lineTo(p[0] - z, p[1] + z); c.stroke();
    }
    if (ap.arrive) {
      c.fillStyle = '#ffc23d'; etincelle(c, fin[0], fin[1], k * 0.6);
    }
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Écran titre (sert aussi de jaquette) : le Puits Noir et ses capsules
  // ---------------------------------------------------------------------

  let cielTitre = null;
  function dessinerTitre() {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cielTitre = null; }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.fillStyle = '#05040f'; c.fillRect(0, 0, w, h);
    if (!cielTitre) cielTitre = ciel(w, h, 11);
    c.drawImage(cielTitre, 0, 0, w, h);
    const large = w > h * 1.05;
    const cx = w / 2, cy = h * (large ? 0.47 : 0.47);
    const rz = Math.min(w, h) * (large ? 0.095 : 0.15);
    // orbites
    c.save(); c.translate(cx, cy); c.scale(1, 0.42);
    for (let i = 0; i < 5; i++) {
      c.strokeStyle = 'rgba(180,170,255,' + (0.28 - i * 0.04).toFixed(2) + ')'; c.lineWidth = 2 / 0.42 * 0.5; c.setLineDash([6, 8]);
      rond(c, 0, 0, rz * (1.6 + i * 0.5)); c.stroke();
    }
    c.restore(); c.setLineDash([]);
    // grand disque d'accrétion aplati, derrière
    c.save(); c.translate(cx, cy); c.scale(1, 0.32);
    const g = c.createRadialGradient(0, 0, rz * 0.9, 0, 0, rz * 3.1);
    g.addColorStop(0, 'rgba(255,240,200,.95)'); g.addColorStop(0.2, 'rgba(255,170,70,.8)'); g.addColorStop(0.55, 'rgba(220,70,160,.35)'); g.addColorStop(1, 'rgba(80,20,140,0)');
    c.fillStyle = g; rond(c, 0, 0, rz * 3.1); c.fill();
    c.restore();
    trouNoir(c, cx, cy, rz, 1800);
    // l'arc de lumière qui passe par-dessus le trou (lentille gravitationnelle)
    c.save(); c.translate(cx, cy);
    const g2 = c.createLinearGradient(0, -rz * 1.5, 0, rz * 0.2);
    g2.addColorStop(0, 'rgba(255,230,170,.0)'); g2.addColorStop(0.4, 'rgba(255,200,110,.85)'); g2.addColorStop(1, 'rgba(255,140,60,.0)');
    c.strokeStyle = g2; c.lineWidth = rz * 0.22;
    c.beginPath(); c.ellipse(0, 0, rz * 1.32, rz * 1.22, 0, Math.PI * 1.05, Math.PI * 1.95); c.stroke();
    c.restore();
    // bande avant du disque (passe devant le trou)
    c.save(); c.translate(cx, cy); c.scale(1, 0.18);
    c.strokeStyle = 'rgba(255,215,140,.85)'; c.lineWidth = rz * 0.5;
    c.beginPath(); c.arc(0, 0, rz * 1.55, 0.1, Math.PI - 0.1); c.stroke();
    c.strokeStyle = 'rgba(255,250,230,.9)'; c.lineWidth = rz * 0.14;
    c.beginPath(); c.arc(0, 0, rz * 1.45, 0.15, Math.PI - 0.15); c.stroke();
    c.restore();
    // les six capsules en course autour
    const places = [[-2.5, 3.0, 0], [-1.9, 2.5, 1], [-0.6, 2.0, 2], [0.5, 3.4, 3], [1.5, 2.6, 4], [2.6, 3.0, 5]];
    places.forEach((p) => {
      const a = p[0], ra = rz * p[1];
      const x = cx + Math.cos(a) * ra, y = cy + Math.sin(a) * ra * 0.42;
      const dir = Math.atan2(Math.cos(a) * 0.42, -Math.sin(a));
      const k = rz * (0.55 + 0.12 * Math.sin(a + 1)) * (0.75 + 0.25 * (Math.sin(a) + 1));
      capsule(c, x, y, dir, k, COUL[p[2]], COUL_F[p[2]], p[2] % 6, 0.9);
    });
    // quelques astéroïdes
    [[0.12, 0.72, 1], [0.86, 0.66, 2], [0.78, 0.28, 3], [0.2, 0.3, 4]].forEach((p) => dessinerRocher(c, w * p[0], h * p[1], rz * 0.35, p[2]));
  }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (parcours de 20 circuits) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // course solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché (dernier état connu)
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)
  let geo = null;
  let finSolo = false;        // fin de course solo déjà montrée
  let attenteTuto = false;
  let choix = { p: 0, d: 'a', m: 0 };
  let tourVu = -1;            // pour régler l'aperçu au début de chaque tour du joueur
  let cielJeu = null, cielTaille = '';
  const particules = [];
  // Animations : pistes de chaque capsule (images clés), rochers, objets.
  let anim = { pistes: {}, fin: 0, tArr: {}, tAsp: {}, ast: null, gAvant: null, miAvant: null, jusque: 0 };

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'hangar', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom !== 'jeu') dessinerTitre();
    if (nom === 'titre') majTitre();
    if (nom === 'jeu') relancerBoucle();
  }

  function toast(texte, duree, rouge) {
    const el = $('toast');
    el.textContent = texte;
    el.classList.toggle('haut', salonOuvert() || $('voile-fin').classList.contains('actif'));
    el.classList.toggle('rouge', !!rouge);
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2400);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  function secouer() {
    const z = $('zone');
    z.classList.remove('secoue'); void z.offsetWidth; z.classList.add('secoue');
  }

  // Cartes des 6 places, en haut de l'écran, et celles du salon.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const haut = document.createElement('div'); haut.className = 'haut';
      const cv = document.createElement('canvas'); cv.className = 'cap'; cv.width = 64; cv.height = 64;
      const rg = document.createElement('span'); rg.className = 'rg';
      haut.append(cv, rg);
      const jauge = document.createElement('div'); jauge.className = 'jauge';
      jauge.appendChild(document.createElement('i'));
      const tag = document.createElement('span'); tag.className = 'tag';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 26, 36, 24);
      d.append(haut, jauge, tag, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 104; cv.height = 104;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  // Pseudo d'un autre vrai joueur (null pour soi, un robot ou en solo).
  function pseudoDe(s) {
    const info = siegesActuels()[s];
    return info && info.humain && !info.moi && info.nom ? info.nom : null;
  }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  const moiSiege = () => (partie ? partie.siege : -1);
  const designDe = (s) => (s === moiSiege() ? prog.capsule : 0);

  // Classement en direct : arrivées, puis en course (distance), puis aspirées.
  function classementDirect(e) {
    const actifs = [];
    for (let i = 0; i < e.c.length; i++) if (e.c[i].st === 0) actifs.push(i);
    actifs.sort((x, y) => (e.c[y].d - e.c[x].d) || (x - y));
    return e.arr.concat(actifs).concat(e.asp.slice().reverse());
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && e.q.length ? R.aQui(e) : -1;
    const cl = e ? classementDirect(e) : [];
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const c = e ? e.c[s] : null;
      const rang = cl.indexOf(s) + 1;
      const design = designDe(s);
      const cv = d.querySelector('canvas.cap');
      if (cv.dataset.design !== String(design)) {
        cv.dataset.design = String(design);
        const x = cv.getContext('2d'); x.clearRect(0, 0, 64, 64);
        capsule(x, 32, 32, -Math.PI / 4, 52, COUL[s], COUL_F[s], design, 0);
      }
      const texteRang = c ? (c.st === 2 ? '✕' : tr('rang.' + rang)) : '';
      const rg = d.querySelector('.rg');
      if (rg.textContent !== texteRang) rg.textContent = texteRang;
      const F = e ? Math.max(e.F, c.f, 1) : 1;
      d.querySelector('.jauge > i').style.transform = 'scaleX(' + (c ? Math.min(1, c.f / F) : 0).toFixed(3) + ')';
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('arrivee', !!c && c.st === 1);
      d.classList.toggle('aspiree', !!c && c.st === 2);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      let aria = tr('place.aria.' + role, { pilote: tr('pilote.' + s) });
      if (role === 'joueur' && info.nom) aria += ' · ' + info.nom;
      if (c) aria += ' · ' + (c.st === 2 ? tr('place.aspiree') : tr('rang.' + rang)) + ' · ' + tr('place.carburant', { n: c.f });
      if (info.chef) aria += ' · ' + tr('salon.chefMarque');
      if (d.getAttribute('aria-label') !== aria) d.setAttribute('aria-label', aria);
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    if (partie.siege < 0) return tr('multi.attente');
    const moi = e.c[partie.siege];
    if (moi.st === 1) return tr('msg.arrive', { rang: tr('rang.' + (e.arr.indexOf(partie.siege) + 1)) });
    if (moi.st === 2) return tr('msg.aspire');
    if (!e.q.length) return '';
    const s = R.aQui(e);
    if (s === partie.siege) return tr('tour.toi');
    const nom = pseudoDe(s);
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.autre', { pilote: tr('pilote.' + s) });
  }

  function majInfos() {
    let info = '';
    const e = vue;
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if (e && partie && partie.phase === 'jeu') info += ' · ' + tr('jeu.tour', { k: Math.min(e.k, e.km), max: e.km });
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
    // l'horizon grandira à la fin de ce tour ?
    let alerte = '';
    if (e && partie && partie.phase === 'jeu' && e.ht > 0 && O.horizonFin(e, e.k, e.hz) !== e.hz) alerte = tr('msg.horizon');
    if ($('alerte').textContent !== alerte) $('alerte').textContent = alerte;
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majCommandes();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && e.q.length) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Commandes : direction, poussée, mine, aperçu
  // ---------------------------------------------------------------------

  const monTour = () => !!(partie && !enPause && !attenteTuto && partie.monTour() && vue && !finSolo);

  function actionChoisie() { return choix.p === 0 ? { p: 0, d: 'a', m: choix.m } : { p: choix.p, d: choix.d, m: choix.m }; }
  function valide(a) { return !!(vue && partie && partie.siege >= 0 && O.valideCoup(vue, partie.siege, a)); }

  // Au début de mon tour : un choix sûr par défaut (remonter si l'attraction m'aspirerait).
  function choixParDefaut() {
    const e = vue, moi = partie.siege, c = e.c[moi];
    choix.m = 0;
    if (!valide(actionChoisie())) { choix.p = 0; choix.d = 'a'; }
    const ap = calculerApercu(actionChoisie());
    if (ap.mort) {
      for (let p = 1; p <= Math.min(3, c.f); p++) {
        const a = { p: p, d: 'o', m: 0 };
        if (valide(a) && !calculerApercu(a).mort) { choix.p = p; choix.d = 'o'; break; }
      }
    }
  }

  // Ce que donnerait le coup a (mêmes calculs que l'arbitre, sur une copie).
  function calculerApercu(a) {
    const e = vue, moi = partie.siege;
    const x = O.copieCourse(e);
    const ch = O.deplacer(x, moi, a);
    const c = x.c[moi];
    const res = { ch: ch, moi: moi, design: prog.capsule, ev: x.ev, f: c.f, gain: c.d - e.c[moi].d, arrive: c.st === 1, aspire: c.st === 2, mort: false };
    if (c.st === 0) {
      const hzFin = O.horizonFin(e, e.k, e.hz);
      const sous = O.asteroide(x, c.r - 1, c.s) >= 0;
      if (c.r - 1 < hzFin && !sous) res.mort = true;
    }
    return res;
  }

  let apercuCourant = null;
  function majCommandes() {
    const cmd = $('commandes');
    const e = vue, moi = moiSiege();
    const c = e && moi >= 0 ? e.c[moi] : null;
    const mien = monTour();
    if (mien && tourVu !== e.k * 10 + 1) { tourVu = e.k * 10 + 1; choixParDefaut(); }
    if (!mien) tourVu = -1;
    cmd.classList.toggle('attente', !mien);
    // pips de carburant
    const pips = $('pips');
    const F = c ? Math.max(e.F, c.f) : 0;
    const ap = mien ? calculerApercu(actionChoisie()) : null;
    apercuCourant = ap;
    const cout = mien ? choix.p : 0;
    const gagne = ap ? Math.max(0, ap.f - (c.f - cout)) : 0;
    let html = '';
    for (let i = 0; i < F + gagne; i++) {
      let cl = '';
      if (i < c.f - cout) cl = 'plein';
      else if (i < c.f) cl = 'coute';
      else if (i < c.f + gagne) cl = 'gagne';
      html += '<i class="' + cl + '"></i>';
    }
    if (pips.dataset.h !== html) { pips.dataset.h = html; pips.innerHTML = html; }
    const ariaPips = c ? tr('cmd.carburant', { n: c.f }) : '';
    if (pips.getAttribute('aria-label') !== ariaPips) pips.setAttribute('aria-label', ariaPips);
    // boutons de direction et de poussée
    document.querySelectorAll('.dir').forEach((b) => {
      const d = b.dataset.dir;
      const ok = mien && (d === 'a' || [1, 2, 3].some((p) => valide({ p: p, d: d, m: 0 })));
      b.disabled = !ok;
      b.classList.toggle('choisi', choix.d === d && (choix.p > 0 || d === 'a'));
      b.classList.toggle('eteint', choix.p === 0 && d !== 'a');
      b.setAttribute('aria-pressed', choix.d === d ? 'true' : 'false');
    });
    document.querySelectorAll('.pp').forEach((b) => {
      const p = Number(b.dataset.p);
      const ok = mien && valide({ p: p, d: p === 0 ? 'a' : choix.d, m: 0 });
      if (b.textContent !== nb(p)) b.textContent = nb(p);
      b.disabled = !ok;
      b.classList.toggle('choisi', choix.p === p);
      b.setAttribute('aria-pressed', choix.p === p ? 'true' : 'false');
      b.setAttribute('aria-label', tr('cmd.poussee', { n: p }));
    });
    const mine = $('btn-mine');
    const avecMines = !!(e && NIVEAUX[e.n] && (NIVEAUX[e.n].m || 0) > 0);
    mine.hidden = !avecMines;
    if (avecMines && c) {
      $('mines-nb').textContent = nb(c.m);
      mine.disabled = !(mien && c.m > 0 && O.mine(e, c.r, c.s) < 0);
      mine.classList.toggle('choisi', choix.m === 1);
      mine.setAttribute('aria-pressed', choix.m === 1 ? 'true' : 'false');
      mine.setAttribute('aria-label', tr('cmd.mine', { n: c.m }));
    }
    // bouton d'allumage et texte de l'aperçu
    const go = $('btn-go');
    let texteGo, texteAp = '', classeAp = '';
    if (mien) {
      texteGo = tr('cmd.go');
      if (ap.arrive) { texteAp = tr('apercu.arrivee'); classeAp = 'bien'; }
      else if (ap.aspire || ap.mort) { texteAp = tr('apercu.aspire'); classeAp = 'danger'; }
      else {
        const evs = ap.ev.map((x) => x.t);
        const morceaux = [tr('apercu.cases', { n: ap.gain })];
        if (evs.includes('choc')) morceaux.push(tr('apercu.choc'));
        if (evs.includes('mine')) morceaux.push(tr('apercu.mine'));
        if (evs.includes('bloque')) morceaux.push(tr('apercu.bloque'));
        if (evs.includes('courant')) morceaux.push(tr('apercu.courant'));
        if (evs.includes('cellule')) morceaux.push(tr('apercu.cellule'));
        if (evs.includes('porte')) morceaux.push(tr('apercu.porte'));
        if (evs.includes('piece')) morceaux.push(tr('apercu.piece'));
        texteAp = morceaux.join(' · ');
        if (evs.includes('choc') || evs.includes('mine')) classeAp = 'danger';
        else if (evs.includes('cellule') || evs.includes('piece') || evs.includes('courant')) classeAp = 'bien';
      }
    } else {
      texteGo = !partie || !e || partie.phase !== 'jeu' || !e.q.length ? tr('cmd.pret') : tr('cmd.attends');
      if (c && c.st === 1) texteGo = tr('cmd.arrive');
      else if (c && c.st === 2) texteGo = tr('cmd.aspire');
    }
    go.disabled = !mien;
    if (go.textContent !== texteGo) go.textContent = texteGo;
    go.classList.toggle('danger', !!(ap && (ap.mort || ap.aspire)));
    const apEl = $('apercu');
    if (apEl.textContent !== texteAp) apEl.textContent = texteAp;
    apEl.className = classeAp;
  }

  function choisirDir(d) {
    if (!monTour()) return;
    audio();
    if (choix.p === 0) choix.p = 1;
    choix.d = d;
    // poussée trop forte pour cette direction : la plus forte possible
    while (choix.p > 1 && !valide(actionChoisie())) choix.p--;
    if (!valide(actionChoisie())) { choix.p = 0; choix.d = 'a'; }
    sons.choix();
    majCommandes();
  }
  function choisirP(p) {
    if (!monTour()) return;
    audio();
    p = Math.max(0, Math.min(3, p));
    const a = { p: p, d: p === 0 ? 'a' : choix.d, m: 0 };
    if (!valide(a)) { sons.non(); return; }
    choix.p = p;
    sons.choix();
    majCommandes();
  }
  function basculerMine() {
    if (!monTour()) return;
    audio();
    const m = choix.m ? 0 : 1;
    if (m && !valide({ p: 0, d: 'a', m: 1 })) { sons.non(); return; }
    choix.m = m;
    sons.choix();
    majCommandes();
  }
  let dernierAttends = 0;
  function allumer() {
    if (!partie) return;
    audio();
    if (!monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu' && vue && vue.c[partie.siege] && vue.c[partie.siege].st === 0) { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    const a = actionChoisie();
    if (!valide(a)) { sons.non(); return; }
    if (partie.jouer(a)) { choix.m = 0; majCommandes(); }
  }

  // ---------------------------------------------------------------------
  //  Animations des coups : pistes des capsules (images clés)
  // ---------------------------------------------------------------------

  function derniereCle(i) { const p = anim.pistes[i]; return p && p.length ? p[p.length - 1] : null; }
  // Ajoute un point à la piste de la capsule i (u déroulé pour tourner sans saut).
  function ajouterCle(i, t, r, s, N, extra) {
    const p = anim.pistes[i] || (anim.pistes[i] = []);
    const der = p.length ? p[p.length - 1] : null;
    let u = s;
    if (der) { let d = s - (((der.u % N) + N) % N); if (d < -N / 2) d += N; if (d > N / 2) d -= N; u = der.u + d; }
    p.push(Object.assign({ t: t, r: r, u: u }, extra || {}));
  }
  function nettoyerPistes(t) {
    Object.keys(anim.pistes).forEach((i) => {
      const p = anim.pistes[i];
      while (p.length > 2 && p[1].t < t - 200) p.shift();
    });
  }

  // Un coup vient d'être joué : chemin du pilote, puis chute de fin de tour.
  function animerCoup(ev) {
    const now = performance.now();
    nettoyerPistes(now);
    const avant = ev.avant, apres = ev.apres, s = ev.siege, N = apres.N;
    let t0 = Math.max(now, anim.fin);
    const retard = Math.min(1200, t0 - now);
    const ch = apres.ch && apres.ch.length ? apres.ch : [[avant.c[s].r, avant.c[s].s, avant.c[s].d]];
    const pasMs = Math.max(45, Math.min(110, 480 / Math.max(1, ch.length - 1)));
    // départ du coup : là où la capsule est affichée à la fin des animations en cours
    for (let i = 0; i < PLACES; i++) {
      if (!derniereCle(i)) ajouterCle(i, t0, avant.c[i].r, avant.c[i].s, N);
    }
    ajouterCle(s, t0, ch[0][0], ch[0][1], N);
    for (let k = 1; k < ch.length; k++) ajouterCle(s, t0 + k * pasMs, ch[k][0], ch[k][1], N, { flamme: 1 });
    let tFin = t0 + (ch.length - 1) * pasMs;
    const derniere = ch[ch.length - 1];
    ajouterCle(s, tFin + 1, derniere[0], derniere[1], N);
    // événements du coup, puis ceux de la fin du tour (après « gravite »)
    const iGrav = apres.ev.findIndex((x) => x.t === 'gravite');
    const evCoup = iGrav < 0 ? apres.ev : apres.ev.slice(0, iGrav);
    const evTour = iGrav < 0 ? [] : apres.ev.slice(iGrav + 1);
    const finiPendantCoup = evCoup.some((x) => (x.t === 'aspire' || x.t === 'arrivee') && x.s === s);
    // objets qui disparaissent pendant le trajet
    anim.gAvant = avant.g; anim.miAvant = avant.mi; anim.jusque = tFin;
    if (apres.c[s].st === 1) anim.tArr[s] = tFin;
    if (apres.c[s].st === 2 && finiPendantCoup) anim.tAsp[s] = tFin;
    // effets (particules et sons), au bon moment
    const rs = (tFin - now) / 1000, r0 = Math.max(0, (t0 - now) / 1000);
    const posFin = () => (geo ? xy(geo, derniere[0], derniere[1]) : null);
    const moiCoup = s === moiSiege();
    evCoup.forEach((x) => {
      if (x.t === 'poussee') sons.moteur(x.p, r0);
      else if (x.t === 'choc') { sons.choc(rs); eclats(posFin, tFin, '#ffd0a0', 16, false); if (moiCoup) setTimeout(secouer, Math.max(0, tFin - now)); }
      else if (x.t === 'mine') { sons.mine(rs); eclats(posFin, tFin, '#ff4d5e', 30, true); if (moiCoup) setTimeout(secouer, Math.max(0, tFin - now)); }
      else if (x.t === 'cellule') { sons.cellule(rs); eclats(posFin, tFin, '#6ef08a', 18, true); }
      else if (x.t === 'courant') { sons.courant(rs); eclats(posFin, tFin, '#ffd65a', 12, false); }
      else if (x.t === 'porte') { sons.porte(rs, x.sens === 'i'); eclats(posFin, tFin, x.sens === 'i' ? '#b48cff' : '#4fd8ff', 16, true); }
      else if (x.t === 'piece') { sons.piece(rs); eclats(posFin, tFin, '#ffc23d', 22, true); }
      else if (x.t === 'pose') sons.pose(r0);
      else if (x.t === 'bloque') sons.bloque(rs);
      else if (x.t === 'arrivee') { sons.arrivee(rs); eclats(posFin, tFin, COUL[s], 30, true); }
      else if (x.t === 'aspire') sons.aspire(rs);
    });
    if (!evCoup.some((x) => x.t === 'poussee')) sons.glisse(r0);
    // fin du tour : tout le monde descend d'un anneau, les rochers dérivent
    if (iGrav >= 0) {
      const tg = tFin + 160, dur = 420;
      for (let i = 0; i < PLACES; i++) {
        if (avant.c[i].st !== 0) continue;
        if (i === s && finiPendantCoup) continue;
        const c0 = i === s ? { r: derniere[0], s: derniere[1] } : avant.c[i];
        const c1 = apres.c[i];
        ajouterCle(i, tg, c0.r, c0.s, N);
        ajouterCle(i, tg + dur, c1.r, c1.s, N);
        if (c1.st === 2) anim.tAsp[i] = tg + dur;
      }
      anim.ast = { de: avant.ast.map((a) => a[1]), vers: apres.ast.map((a) => a[1]), t0: tg, t1: tg + dur, N: N };
      const rg = (tg - now) / 1000;
      sons.gravite(rg);
      evTour.forEach((x) => {
        const ici = () => (geo && vue && vue.c[x.s] ? xy(geo, Math.max(vue.hz, vue.c[x.s].r), vue.c[x.s].s) : null);
        if (x.t === 'aspire') sons.aspire(rg + 0.2);
        else if (x.t === 'horizon') { sons.horizon(rg + 0.3); setTimeout(() => { secouer(); toast(tr('msg.horizonAvale'), 2600, true); }, Math.max(0, tg - now + 300)); }
        else if (x.t === 'mine') { sons.mine(rg + 0.3); eclats(ici, tg + dur, '#ff4d5e', 24, true); }
        else if (x.t === 'choc') { sons.choc(rg + 0.3); eclats(ici, tg + dur, '#ffd0a0', 12, false); }
      });
      tFin = tg + dur;
    }
    anim.fin = tFin + 60;
    return retard;
  }

  // Position affichée de la capsule i à l'instant t.
  function posCapsule(i, t) {
    const e = vue;
    if (!e) return null;
    const c = e.c[i];
    const p = anim.pistes[i];
    let r = c.r, u = c.s, flamme = 0;
    if (p && p.length) {
      const der = p[p.length - 1];
      if (t >= der.t) { r = der.r; u = der.u; }
      else if (t <= p[0].t) { r = p[0].r; u = p[0].u; }
      else {
        for (let k = 1; k < p.length; k++) {
          if (t <= p[k].t) {
            const a = p[k - 1], b = p[k], q = (t - a.t) / Math.max(1, b.t - a.t);
            r = a.r + (b.r - a.r) * q; u = a.u + (b.u - a.u) * q; flamme = b.flamme ? 1 : 0;
            break;
          }
        }
      }
    }
    if (c.st === 1) {
      const ta = anim.tArr[i];
      if (ta === undefined || t > ta + 350) return { cache: true };
    }
    if (c.st === 2) {
      const ta = anim.tAsp[i];
      if (ta === undefined || t > ta + 900) return { cache: true };
      if (t > ta) return { r: r, u: u, spirale: Math.min(1, (t - ta) / 900) };
    }
    return { r: r, u: u, flamme: flamme };
  }

  // Particules : éclats d'un choc, d'une mine, d'une cellule…
  function eclats(pos, quand, coul, n, etoile) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = 50 + Math.random() * 170;
      particules.push({ pos: pos, x: null, y: null, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t0: quand, vie: 0.6 + Math.random() * 0.5, k: 2 + Math.random() * 3.5, coul: k % 3 ? coul : '#ffffff', etoile: etoile && k % 2 === 0 });
    }
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('piste'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (cielTaille !== w + 'x' + h) { cielJeu = ciel(w, h, 5); cielTaille = w + 'x' + h; }
    c.clearRect(0, 0, w, h);
    c.drawImage(cielJeu, 0, 0, w, h);
    if (!vue) { geo = null; return; }
    geo = geoPiste(vue, w, h, 6);
    let astU = null;
    if (anim.ast && t < anim.ast.t1 + 50) {
      const A = anim.ast, q = Math.max(0, Math.min(1, (t - A.t0) / (A.t1 - A.t0)));
      astU = A.de.map((u0, j) => { let d = A.vers[j] - u0; if (d < -A.N / 2) d += A.N; if (d > A.N / 2) d -= A.N; return u0 + d * q; });
    }
    const avantFin = t < anim.jusque;
    const moi = moiSiege();
    const ap = monTour() ? apercuCourant : null;
    dessinerPiste(c, vue, geo, {
      t: t, pos: (i) => posCapsule(i, t), astU: astU,
      g: avantFin && anim.gAvant ? anim.gAvant : vue.g, mi: avantFin && anim.miAvant ? anim.miAvant : vue.mi,
      moi: moi, apercu: ap, design: prog.capsule,
      danger: vue.ht > 0 && O.horizonFin(vue, vue.k, vue.hz) !== vue.hz,
      tour: partie && partie.phase === 'jeu' && vue.q.length && t >= anim.fin ? R.aQui(vue) : -1
    });
    // particules
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      if (t < p.t0) continue;
      if (p.x === null) {
        const q = typeof p.pos === 'function' ? p.pos() : p.pos;
        if (!q) { particules.splice(i, 1); continue; }
        p.x = q[0]; p.y = q[1];
      }
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.vy *= 0.97;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      if (p.etoile) etincelle(c, p.x, p.y, p.k * 1.4); else { rond(c, p.x, p.y, p.k * 0.6); c.fill(); }
      c.globalAlpha = 1;
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function reinitAnim() {
    anim = { pistes: {}, fin: 0, tArr: {}, tAsp: {}, ast: null, gAvant: null, miAvant: null, jusque: 0 };
    particules.length = 0;
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    reinitAnim();
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la course,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + ':' + designDe(s) + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 104, 104);
        medaillon(c, s, 52, 58, 42, designDe(s));
        if (info.chef) couronne(c, 52, 22, 24);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { pilote: tr('pilote.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { pilote: nomChef ? tr('pilote.' + partie.chef) + ' · ' + nomChef : tr('pilote.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    reinitAnim();
    debutTour = Date.now();
    dernierTic = -1;
    tourVu = -1;
    finSolo = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else {
      enPartie = true;
      // une pièce de coque attend sur ce circuit
      const i = niveau - 1;
      if (vue.g.indexOf('p') >= 0 && !prog.pieces[i]) setTimeout(() => { if (session === 'solo' && !finSolo) toast(tr('msg.piece'), 3200); }, 700);
    }
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surAction(ev) {
    vue = JSON.parse(JSON.stringify(ev.apres));
    animerCoup(ev);
    debutTour = Date.now();
    dernierTic = -1;
    const moi = partie.siege;
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    // mon tour arrive
    if (partie.phase === 'jeu' && moi >= 0 && vue.q.length && R.aQui(vue) === moi && !ev.moi) {
      const tAttente = Math.max(0, anim.fin - performance.now());
      const j = jeton;
      setTimeout(() => { if (j === jeton) sons.tour(); }, tAttente);
    }
    // mon arrivée ou mon aspiration
    if (moi >= 0 && ev.avant.c[moi].st === 0 && ev.apres.c[moi].st !== 0) {
      const arrive = ev.apres.c[moi].st === 1;
      const j = jeton;
      const attente = Math.max(0, anim.fin - performance.now()) + 500;
      if (session === 'solo') {
        finSolo = true;
        enPartie = false;
        const etat = vue;
        // course finie pour moi : les robots n'ont plus besoin de jouer
        setTimeout(() => {
          if (j !== jeton || session !== 'solo') return;
          if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
          afficherFin(etat);
        }, attente + 400);
      } else {
        setTimeout(() => {
          if (j !== jeton) return;
          if (arrive) { toast(tr('msg.arriveToast', { rang: tr('rang.' + (vue.arr.indexOf(moi) + 1)) }), 3000); }
          else toast(tr('msg.aspireToast'), 3000, true);
        }, attente);
      }
    }
    // un rival aspiré, une arrivée
    ev.apres.ev.forEach((x) => {
      if (x.t === 'arrivee' && x.s !== moi && session === 'ligne') {
        const j = jeton;
        const nomx = pseudoDe(x.s);
        const texte = nomx ? tr('msg.arriveNom', { nom: nomx, rang: tr('rang.' + x.rang) }) : tr('msg.arriveAutre', { pilote: tr('pilote.' + x.s), rang: tr('rang.' + x.rang) });
        setTimeout(() => { if (j === jeton) toast(texte, 1800); }, Math.max(0, anim.fin - performance.now()));
      }
    });
    const carte = $('place-' + ev.siege);
    carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    const enLigne = partie.mode === 'en-ligne';
    finManche = Date.now() + R.pauseManche;
    if (session === 'solo') {
      if (finSolo) return;                   // déjà montrée (arrivée ou aspiration)
      finSolo = true;
      enPartie = false;
      const etat = vue;
      setTimeout(() => { if (j === jeton && session === 'solo') { if (partie) partie.quitter(); afficherFin(etat); } }, Math.max(0, anim.fin - performance.now()) + 600);
      return;
    }
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin(vue);
    }, Math.max(0, anim.fin - performance.now()) + 600);
  }

  // Place du joueur dans le classement final de la manche (1 = premier).
  function maPlace(e, moi) {
    const res = R.fin(e);
    const cl = res ? res.classement : classementDirect(e);
    return cl.indexOf(moi) + 1;
  }

  // Fin d'une manche en ligne : le classement, puis le salon (même fenêtre).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = moi >= 0 && e.c[moi].st === 1 && maPlace(e, moi) === 1;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de course : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : classementDirect(e);
    ordre.forEach((s, k) => {
      const c = e.c[s];
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = c.st === 2 ? '✕' : tr('rang.' + (k + 1));
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; medaillon(cv.getContext('2d'), s, 30, 30, 28, s === moi ? prog.capsule : 0);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('pilote.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = c.st === 1 ? tr('fin.arrive') : c.st === 2 ? tr('fin.aspire') : tr('fin.distance', { n: c.d, total: e.L });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  // Bilan d'une course solo (ou d'une manche contre des robots après une coupure).
  function afficherFin(e) {
    if (!e) return;
    const moi = partie ? partie.siege : 0;
    const s = moi >= 0 ? moi : 0;
    const c = e.c[s];
    const sieges = siegesActuels();
    const place = maPlace(e, s);
    const arrive = c.st === 1;
    const t = NIVEAUX[e.n];
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, s, sieges, $('fin-classement'));
    let gagne;
    if (session === 'solo') {
      const i = niveau - 1;
      gagne = arrive && place <= t.top;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = gagne ? 1 + (place === 1 ? 1 : 0) + (c.f >= t.c3 ? 1 : 0) : 0;
      const score = arrive ? (7 - place) * 100 + c.f * 20 + (c.pc ? 50 : 0) : c.d * 5;
      const ancienRecord = prog.records[i];
      const record = score > ancienRecord;
      if (record) prog.records[i] = score;
      // pièce de coque rapportée à l'arrivée
      const avantPieces = nbPieces();
      let nouvellePiece = false;
      if (arrive && c.pc && !prog.pieces[i]) { prog.pieces[i] = 1; nouvellePiece = true; }
      const nouvelleCapsule = CAPSULES.findIndex((n) => n > avantPieces && n <= nbPieces());
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), score);
        // Parcours terminé (tous les circuits gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else sauver(niveau, score);
      $('fin-titre').textContent = gagne ? tr(place === 1 ? 'fin.victoire' : 'fin.qualifie') : tr(c.st === 2 ? 'fin.aspireTitre' : 'fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-place').textContent = arrive ? tr('fin.place', { rang: tr('rang.' + place), objectif: tr('rang.' + t.top) }) : (c.st === 2 ? tr('fin.aspirePlace') : tr('fin.horsDelai'));
      $('fin-details').textContent = tr('fin.details', { f: c.f, c3: t.c3, score: score });
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, score) });
      $('fin-piece').textContent = nouvellePiece ? tr('fin.piece', { n: nbPieces(), total: NIVEAUX.length }) : (c.pc && !arrive ? tr('fin.piecePerdue') : '');
      let texteDebloque = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      if (nouvelleCapsule >= 0) texteDebloque = (texteDebloque ? texteDebloque + ' ' : '') + tr('fin.capsule', { nom: tr('capsule.' + nouvelleCapsule) });
      $('fin-debloque').textContent = texteDebloque;
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      gagne = arrive && place === 1;
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-place').textContent = arrive ? tr('fin.placeLigne', { rang: tr('rang.' + place) }) : (c.st === 2 ? tr('fin.aspirePlace') : tr('fin.horsDelai'));
      $('fin-details').textContent = '';
      $('fin-record').textContent = '';

  // Confettis de victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 6], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  const TUTOS = {
    base: { N: 12, R: 3, caps: [[2, 0, 5]], etapes: [{ s: 0, a: { p: 2, d: 'a' } }, { grav: 1 }, { s: 0, a: { p: 0, d: 'a' } }, { grav: 1 }] },
