<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<style>
  /* ---------- Base ---------- */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #3b2a4a;
    background: linear-gradient(180deg, #d9f0ff 0%, #fff3df 100%);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .cache { display: none !important; }

  /* ---------- Barre du haut (pendant la partie) ---------- */
  #barre {
    position: fixed; left: 0; right: 0; top: 0; height: 56px; z-index: 5;
    display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    background: rgba(255, 255, 255, .78); box-shadow: 0 2px 8px rgba(60, 40, 90, .12);
  }
  .rond {
    min-width: 44px; height: 44px; border-radius: 14px; border: none;
    background: #fff; box-shadow: 0 2px 0 #c9b8e8, 0 3px 8px rgba(60, 40, 90, .15);
    display: inline-flex; align-items: center; justify-content: center; padding: 0 8px;
  }
  .rond:active { transform: translateY(2px); box-shadow: 0 0 0 #c9b8e8; }
  .rond svg { width: 26px; height: 26px; }
  .rond:focus-visible, .gros:focus-visible, .vignette:focus-visible { outline: 3px solid #ff9f1c; outline-offset: 2px; }
  #barre-titre { flex: 1; min-width: 0; font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chrono { display: inline-flex; align-items: center; gap: 3px; font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; min-width: 58px; }
  #chrono svg { width: 20px; height: 20px; }
  #chrono.urgent { color: #d62839; animation: battre .5s infinite alternate; }
  @keyframes battre { to { transform: scale(1.12); } }

  /* ---------- Scène de jeu ---------- */
  #scene { position: fixed; left: 0; right: 0; top: 56px; bottom: 0; width: 100%; touch-action: none; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
  #bulle {
    position: fixed; left: 50%; top: 66px; transform: translateX(-50%); z-index: 6;
    background: #3b2a4a; color: #fff; padding: 9px 16px; border-radius: 18px; font-weight: 700; font-size: 16px;
    max-width: 92vw; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  }
  #bulle.vue { opacity: 1; }

  /* ---------- Écrans superposés ---------- */
  .ecran {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    padding: 12px; background: rgba(40, 25, 70, .45);
  }
  .carte {
    background: #fffdf8; border-radius: 26px; padding: 18px 18px 16px; width: min(420px, 100%);
    max-height: 100%; overflow-y: auto; text-align: center; box-shadow: 0 10px 40px rgba(40, 20, 70, .35);
    animation: arriver .35s cubic-bezier(.2, 1.4, .5, 1);
  }
  @keyframes arriver { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .carte h2 { margin: 2px 0 8px; font-size: 26px; color: #6a3fb5; }
  .carte p { margin: 6px 0; font-size: 17px; line-height: 1.35; }
  .boutons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .gros {
    min-height: 52px; padding: 10px 20px; border: none; border-radius: 18px; font-size: 19px; font-weight: 800;
    background: #ff9f1c; color: #fff; box-shadow: 0 4px 0 #c96f00; max-width: 100%;
  }
  .gros.doux { background: #7b61d9; box-shadow: 0 4px 0 #4f37a3; }
  .gros.clair { background: #fff; color: #6a3fb5; box-shadow: 0 4px 0 #c9b8e8; }
  .gros:active { transform: translateY(3px); box-shadow: 0 1px 0 #c96f00; }

  /* Écran titre */
  #ecran-titre { background: linear-gradient(180deg, #8fd3ff 0%, #c8f0c0 62%, #ffe6a8 100%); flex-direction: column; gap: 6px; }
  #ecran-titre h1 {
    margin: 0; font-size: clamp(34px, 10vw, 56px); color: #fff; text-align: center; line-height: 1.05;
    text-shadow: 0 3px 0 #6a3fb5, 0 6px 14px rgba(60, 30, 110, .35);
  }
  #titre-dessin { width: min(330px, 84vw); height: min(300px, 76vw, 38vh); }
  #ecran-titre .consigne { max-width: 360px; text-align: center; font-size: 18px; font-weight: 600; margin: 4px 8px 10px; }
  #ecran-titre .gros { font-size: 26px; padding: 14px 46px; }
  #titre-coin { position: fixed; top: 10px; right: 10px; display: flex; gap: 8px; align-items: center; }
  #lang-titre { position: fixed; top: 10px; left: 10px; }

  /* Choix des niveaux */
  #ecran-niveaux { background: linear-gradient(180deg, #d9f0ff 0%, #fff3df 100%); flex-direction: column; justify-content: flex-start; padding: 0; }
  #niveaux-tete { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: rgba(255, 255, 255, .8); }
  #niveaux-tete h2 { flex: 1; margin: 0; font-size: 20px; color: #6a3fb5; }
  #total-etoiles { font-weight: 800; display: inline-flex; align-items: center; gap: 4px; }
  #total-etoiles svg { width: 22px; height: 22px; }
  #grille {
    flex: 1; width: 100%; max-width: 760px; overflow-y: auto; padding: 12px 10px 24px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; align-content: start;
    touch-action: pan-y;
  }
  .vignette {
    position: relative; border: none; padding: 5px 5px 4px; border-radius: 16px; background: #fff;
    box-shadow: 0 3px 0 #c9b8e8, 0 4px 10px rgba(60, 40, 90, .12); display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .vignette canvas { width: 100%; aspect-ratio: 1; border-radius: 11px; display: block; }
  .vignette .num { position: absolute; top: 2px; left: 4px; background: #6a3fb5; color: #fff; font-weight: 800; font-size: 13px; border-radius: 9px; padding: 1px 6px; }
  .vignette .etoiles { display: flex; gap: 1px; height: 16px; }
  .vignette .etoiles svg { width: 16px; height: 16px; }
  .vignette.fermee { background: #e9e4f2; box-shadow: 0 3px 0 #bcb1d0; cursor: default; }
  .vignette.fermee canvas { filter: grayscale(1) brightness(.45); }
  .vignette .cadenas { position: absolute; top: 28%; left: 50%; width: 34px; height: 34px; transform: translateX(-50%); }

  /* Fin de niveau */
  #fin-image { width: 120px; height: 120px; border-radius: 16px; box-shadow: 0 3px 10px rgba(0, 0, 0, .2); margin: 4px auto; display: block; }
  #fin-etoiles { display: flex; justify-content: center; gap: 8px; margin: 6px 0; }
  #fin-etoiles svg { width: 46px; height: 46px; transform: scale(.6); opacity: .35; transition: transform .35s cubic-bezier(.2, 1.8, .5, 1), opacity .2s; }
  #fin-etoiles svg.allumee { transform: scale(1); opacity: 1; }
  #fin-fait { background: #eef7ff; border-radius: 14px; padding: 8px 10px; margin: 8px 0 0; font-size: 15px; text-align: left; }
  #fin-record.nouveau { color: #e85d04; font-weight: 800; animation: battre .4s infinite alternate; }

  /* Tutoriel */
  #tuto-dessin { width: 260px; height: 180px; max-width: 100%; display: block; margin: 4px auto; border-radius: 16px; background: #eef7ff; }
  .petit { font-size: 14px !important; color: #7a6a8a; }
</style>
</head>

<script>

  let g; // contexte de dessin courant

  function ciel(h1, h2, y2) { const gr = g.createLinearGradient(0, 0, 0, y2 || 100); gr.addColorStop(0, h1); gr.addColorStop(1, h2); g.fillStyle = gr; g.fillRect(0, 0, 100, 100); }
  function nuage(x, y, s) { alpha(0.92, () => { E(x + 6 * s, y + 2 * s, 11 * s, 4 * s, '#fff'); C(x + 2 * s, y, 4.5 * s, '#fff'); C(x + 7 * s, y - 2 * s, 5.5 * s, '#fff'); C(x + 12 * s, y + 0.5 * s, 4 * s, '#fff'); }); }

  /* =====================================================================
     PIÈCES DE PUZZLE (formes à tenons)
     ===================================================================== */
  // Bord d'une pièce : v = 0 plat, 1 tenon vers l'extérieur, -1 creux.
  function bord(p, x0, y0, x1, y1, v, T) {
    if (!v) { p.lineTo(x1, y1); return; }
    const Lg = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / Lg, uy = (y1 - y0) / Lg, nx = uy * v, ny = -ux * v, m = Lg / 2;
    const q = (s, o) => [x0 + ux * s + nx * o, y0 + uy * s + ny * o];
    p.lineTo(...q(m - 0.35 * T, 0));
    p.bezierCurveTo(...q(m - 0.15 * T, 0.3 * T), ...q(m - 0.72 * T, 0.95 * T), ...q(m, 0.95 * T));
    p.bezierCurveTo(...q(m + 0.72 * T, 0.95 * T), ...q(m + 0.15 * T, 0.3 * T), ...q(m + 0.35 * T, 0));
    p.lineTo(x1, y1);
  }
  // b = [haut, droite, bas, gauche] ; pièce de w × h dont le coin est en (0, 0).
  function cheminPiece(w, h, b, T) {
    const p = new Path2D(); p.moveTo(0, 0);
    bord(p, 0, 0, w, 0, b[0], T); bord(p, w, 0, w, h, b[1], T); bord(p, w, h, 0, h, b[2], T); bord(p, 0, h, 0, 0, b[3], T);
    p.closePath(); return p;
  }
  function hasard(graine) { // générateur pseudo-aléatoire (formes identiques à chaque partie)
    let a = graine >>> 0;
    return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function genererBords(cols, lignes, alea) {
    const H = [], V = [];
    for (let r = 0; r < lignes; r++) { V[r] = []; for (let c = 0; c < cols - 1; c++) V[r][c] = alea() < 0.5 ? 1 : -1; }
    for (let r = 0; r < lignes - 1; r++) { H[r] = []; for (let c = 0; c < cols; c++) H[r][c] = alea() < 0.5 ? 1 : -1; }
    return (c, r) => [r > 0 ? -H[r - 1][c] : 0, c < cols - 1 ? V[r][c] : 0, r < lignes - 1 ? H[r][c] : 0, c > 0 ? -V[r][c - 1] : 0];
  }
  // Fabrique l'image d'une pièce : endroit (dessin) et dos (motif de pattes).
  function fabriquerPiece(img, B, c, r, cw, ch, b, T, dpr) {
    const pad = Math.ceil(T + 3);
    const W = cw + 2 * pad, H = ch + 2 * pad;
    const chemin = cheminPiece(cw, ch, b, T);
    const faire = (dessin) => {
      const cv = document.createElement('canvas'); cv.width = Math.ceil(W * dpr); cv.height = Math.ceil(H * dpr);
      const x = cv.getContext('2d'); x.scale(dpr, dpr); x.translate(pad, pad);
      x.save(); x.clip(chemin); dessin(x); x.restore();
      x.lineWidth = 2.2; x.strokeStyle = 'rgba(255,255,255,.6)'; x.stroke(chemin);
      x.lineWidth = 1; x.strokeStyle = 'rgba(40,25,50,.55)'; x.stroke(chemin);
      return cv;
    };
    const endroit = faire((x) => x.drawImage(img, -c * cw, -r * ch, B, B));
    const dos = faire((x) => {
      const gr = x.createLinearGradient(-pad, -pad, cw + pad, ch + pad); gr.addColorStop(0, '#9d7be8'); gr.addColorStop(1, '#6a3fb5');
      x.fillStyle = gr; x.fillRect(-pad, -pad, W, H);
      x.fillStyle = 'rgba(255,255,255,.28)';
      const pas = Math.max(18, Math.min(cw, ch) / 2.2);
      for (let ligne = 0, yy = -pad; yy < ch + pad; yy += pas, ligne++) for (let xx = -pad + (ligne % 2 ? pas / 2 : 0); xx < cw + pad; xx += pas) {
        const s = pas / 22;
        x.beginPath(); x.ellipse(xx, yy + 3 * s, 4 * s, 3.3 * s, 0, 0, TAU); x.fill();
        [[-4.2, -2.4], [-1.5, -5], [1.5, -5], [4.2, -2.4]].forEach(([dx, dy]) => { x.beginPath(); x.arc(xx + dx * s, yy + dy * s, 1.5 * s, 0, TAU); x.fill(); });
      }
    });
    return { endroit, dos, chemin, pad };
  }

      for (let r = 0; r < N.l; r++) for (let c = 0; c < N.c; c++) liste.push({ c, r, intrus: false, b: bordsDe(c, r) });
      // Intrus : pièces d'un autre animal.
      const autre = Object.keys(ANIMAUX)[(J.niv * 7 + 11) % 30] === N.a ? 'poisson' : Object.keys(ANIMAUX)[(J.niv * 7 + 11) % 30];
      for (let k = 0; k < (N.intrus || 0); k++) {
        liste.push({ c: Math.floor(Math.random() * N.c), r: Math.floor(Math.random() * N.l), intrus: true, autre, b: [1, -1, 1, -1].map((v) => (Math.random() < 0.5 ? v : -v)) });
      }
      const reels = liste.filter((p) => !p.intrus);
      melanger(reels).slice(0, N.rot || 0).forEach((p) => { p.rot = 1 + Math.floor(Math.random() * 3); });
      melanger(liste.slice()).slice(0, N.dos || 0).forEach((p) => { p.cache = true; });
      melanger(liste);
      J.pieces = liste.map((p, i) => Object.assign(p, {
        ordre: i, rot: p.rot || 0, ang: (p.rot || 0) * Math.PI / 2, face: !p.cache, flip: 1, place: false, jete: false, enPanier: 0,
        x: 0, y: 0, s: 0.5, libre: false, z: i, sec: 0, eclat: 0
      }));
    }
    J.pieces.forEach((p) => {
      const img = p.intrus ? imageAnimal(p.autre, B * dpr) : J.img;
      Object.assign(p, fabriquerPiece(img, B, p.c, p.r, cw, ch, p.b, T, dpr));
    });
    rangerReserve(nouvelles);
    // Panier (niveaux à intrus).
    const R = D.reserve;
    D.panier = N.intrus ? { x: R.x + R.w - 44, y: R.y + R.h - 44, r: 36 } : null;
    J.pieces.forEach((p) => { if (p.place) { p.x = cibleX(p); p.y = cibleY(p); p.s = 1; } });
  }
  function melanger(t) { for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; } return t; }
  const cibleX = (p) => D.bx + (p.c + 0.5) * D.cw;
  const cibleY = (p) => D.by + (p.r + 0.5) * D.ch;

  // Place les pièces libres dans la réserve (rangées, avec un peu de désordre).
  function rangerReserve(depart) {
    const R = D.reserve;
    const n = Math.max(1, J.pieces.length);
    const zoneW = R.w - (J.N.intrus ? 90 : 0), zoneH = R.h;
    const pw = Math.max(D.cw, D.ch) + 1.2 * D.T, ph = pw; // les tenons peuvent se chevaucher un peu
    let meilleur = { s: 0, k: 1 };
    for (let k = 1; k <= n; k++) {
      const lignes = Math.ceil(n / k), s = Math.min(1, zoneW / (k * pw), zoneH / (lignes * ph));
      if (s > meilleur.s) meilleur = { s, k };
    }
    const k = meilleur.k, lignes = Math.ceil(n / k), s = meilleur.s * 0.98;
    D.echelleReserve = s;
    const cellW = zoneW / k, cellH = zoneH / lignes;
    J.pieces.forEach((p) => {
      if (p.place || p.jete) return;
      const i = p.ordre, cx = i % k, cy = Math.floor(i / k);
      p.tx = R.x + (cx + 0.5) * cellW + (((i * 37) % 7) - 3) * cellW * 0.03;
      p.ty = R.y + (cy + 0.5) * cellH + (((i * 53) % 7) - 3) * cellH * 0.03;
      p.libre = false;
      if (depart) { p.x = p.tx; p.y = p.ty; p.s = s; }
    });
  }

  /* =====================================================================
     CHRONO ET SABLIER
     ===================================================================== */
  function formatTemps(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  let chronoAffiche = '';
  function majChrono() {
    const el = $('chrono');
    const reste = tempsSablier(J.N) - J.temps;
    const texte = (J.N.sablier ? 's' : 'c') + formatTemps(J.N.sablier ? reste : J.temps);
    if (texte === chronoAffiche) return; // on ne redessine que si l'affichage change
    chronoAffiche = texte;
    el.innerHTML = (J.N.sablier ? SVG_SABLIER : SVG_CHRONO) + '<span>' + texte.slice(1) + '</span>';
    el.classList.toggle('urgent', !!J.N.sablier && reste <= 10);
  }

  /* =====================================================================
     MANIPULATION DES PIÈCES (doigt, souris, clavier)
     ===================================================================== */
  function libres() { return J.pieces.filter((p) => !p.place && !p.jete); }
  function pieceSous(x, y) {
    const liste = libres().sort((a, b) => b.z - a.z);
    for (const p of liste) {
      const dx = x - p.x, dy = y - p.y, co = Math.cos(-p.ang), si = Math.sin(-p.ang);
      const lx = (dx * co - dy * si) / p.s, ly = (dx * si + dy * co) / p.s;
      if (Math.abs(lx) < D.cw / 2 + D.T * 0.6 + 6 / p.s && Math.abs(ly) < D.ch / 2 + D.T * 0.6 + 6 / p.s) return p;
    }
    return null;
  }
  let zMax = 100;
  function auDessus(p) { p.z = ++zMax; }
  function dansPlateau(x, y) { return x >= D.bx && x <= D.bx + D.B && y >= D.by && y <= D.by + D.B; }
  function dansPanier(x, y) { return D.panier && Math.hypot(x - D.panier.x, y - D.panier.y) < D.panier.r * 1.35; }

  function retourner(p) {
    p.face = true; p.flip = 0; SON.retourner(); auDessus(p);
  }
  function tourner(p) {
    if (!J.N.rot) { p.eclat = 1; SON.clic(); return; } // pas de rotation à ce niveau : petit saut
    p.rot = (p.rot + 1) % 4; SON.tourner(); auDessus(p);
  }
  // Pose une pièce là où elle est (centre x, y).
  function deposer(p) {
    const x = p.x, y = p.y;
    if (p.intrus) {
      if (dansPanier(x, y)) { p.jete = true; p.enPanier = 0.001; SON.panier(); eclats(D.panier.x, D.panier.y, '#c9a26b', 10); verifierFin(); return; }
      if (dansPlateau(x, y)) { erreur(p, 'bulle.intrus'); return; }
      garderDansReserve(p); return;
    }
    const tx = cibleX(p), ty = cibleY(p);
    const bonneCase = Math.abs(x - tx) < D.cw * 0.55 && Math.abs(y - ty) < D.ch * 0.55;
    if (bonneCase && p.rot === 0 && p.face) {
      p.place = true; p.z = 0; SON.poser(); p.eclat = 1; eclats(tx, ty, '#ffd43b', 14); vibrer(15);
      verifierFin(); return;
    }
    if (bonneCase && p.rot !== 0) { bulle('bulle.tourner'); p.sec = 0.35; SON.erreur(); return; }
    if (dansPanier(x, y)) { erreur(p, 'bulle.panierNon'); return; }
    if (dansPlateau(x, y)) { erreur(p, 'bulle.place'); return; }
    garderDansReserve(p);
  }
  function erreur(p, cle) { J.erreurs++; p.sec = 0.45; J.secousse = 0.25; SON.erreur(); bulle(cle); vibrer(40); } // la pièce rejoint seule sa place dans la réserve (tx, ty)
  function garderDansReserve(p) {
    // La pièce reste entière dans la réserve (marge = demi-taille de la pièce dans la réserve).
    const R = D.reserve, mx = Math.min(R.w / 2, (D.cw / 2 + D.T * 0.5) * D.echelleReserve + 4), my = Math.min(R.h / 2, (D.ch / 2 + D.T * 0.5) * D.echelleReserve + 4);
    p.tx = Math.min(R.x + R.w - mx, Math.max(R.x + mx, p.x)); p.ty = Math.min(R.y + R.h - my, Math.max(R.y + my, p.y)); p.libre = true;
  }
  function vibrer(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* rien */ } }

  function verifierFin() {
    const reste = J.pieces.some((p) => (p.intrus ? !p.jete : !p.place));
    if (reste || J.fini) return;
    J.fini = true; J.celeb = 0; J.tenue = null; SON.victoire(); confettis(90);
  }

  // --- Doigt et souris ---
  let geste = null;
  function pos(e) { const r = scene.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  scene.addEventListener('pointerdown', (e) => {
    if (J.ecran !== 'jeu' || J.pause || J.fini) return;
    const { x, y } = pos(e); J.lumiere = { x, y }; J.clavier = false;
    const p = pieceSous(x, y); if (!p) return;
    try { scene.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
    auDessus(p);
    geste = { p, id: e.pointerId, x0: x, y0: y, bouge: false, dx: p.x - x, dy: p.y - y, s0: p.s };
  });
  scene.addEventListener('pointermove', (e) => {
    if (J.ecran !== 'jeu' || J.pause) return;
    const { x, y } = pos(e); J.lumiere = { x, y };
    if (!geste || geste.id !== e.pointerId) return;
    const p = geste.p;
    if (!geste.bouge && Math.hypot(x - geste.x0, y - geste.y0) > 8) {
      if (!p.face) { retourner(p); geste = null; return; }
      geste.bouge = true; J.tenue = p; SON.prendre();
    }
    if (geste.bouge) {
      // La pièce grandit vers sa taille réelle : l'écart au doigt se réduit en même temps.
      const k = p.s / geste.s0;
      p.x = x + geste.dx * k; p.y = y + geste.dy * k;
    }
  });
  function finGeste(e) {
    if (!geste || geste.id !== e.pointerId) return;
    const g0 = geste; geste = null;
    if (J.ecran !== 'jeu' || J.pause || J.fini) { J.tenue = null; return; }
    const p = g0.p;
    if (!g0.bouge) {
      if (!p.face) retourner(p); else tourner(p);
      return;
    }
    J.tenue = null; deposer(p);
  }
  scene.addEventListener('pointerup', finGeste);
  scene.addEventListener('pointercancel', (e) => { if (geste && geste.id === e.pointerId) { const p = geste.p; geste = null; J.tenue = null; if (p) garderDansReserve(p); } });

  // --- Clavier ---
  function ordreClavier() { return libres().sort((a, b) => (Math.abs(a.ty - b.ty) > 20 ? a.ty - b.ty : a.tx - b.tx)); }
  function positionCurseur() {
    const n = J.N.c * J.N.l;
    if (J.curseur >= n) return { x: D.panier.x, y: D.panier.y };
    return { x: D.bx + ((J.curseur % J.N.c) + 0.5) * D.cw, y: D.by + (Math.floor(J.curseur / J.N.c) + 0.5) * D.ch };
  }
  document.addEventListener('keydown', (e) => {
    aInteragi = true;
    const code = e.code, k = e.key;
    if (J.ecran === 'tuto') { if (code === 'Enter' || code === 'Space' || code === 'Escape') { e.preventDefault(); fermerTuto(); } return; }
    if (J.ecran === 'pause') { if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); reprendre(); } return; }
    if (J.ecran !== 'jeu' || J.fini) return;
    if (code === 'KeyP' || (code === 'Escape' && !(J.tenue && J.clavier))) { e.preventDefault(); ouvrirPause(); return; }
    if (code === 'KeyM') { voirModele(); return; }
    const fleches = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    J.clavier = true;
    if (J.tenue) {
      const p = J.tenue, n = J.N.c * J.N.l;
      if (fleches[code]) {
        e.preventDefault();
        const [dx, dy] = fleches[code];
        if (J.curseur >= n) { if (dy < 0 || dx < 0) J.curseur = n - 1; }
        else {
          let c = J.curseur % J.N.c, r = Math.floor(J.curseur / J.N.c);
          if (dy > 0 && r === J.N.l - 1 && D.panier) { J.curseur = n; }
          else { c = Math.max(0, Math.min(J.N.c - 1, c + dx)); r = Math.max(0, Math.min(J.N.l - 1, r + dy)); J.curseur = r * J.N.c + c; }
        }
        SON.clic(); return;
      }
      if (code === 'Enter' || code === 'Space') { e.preventDefault(); const q = positionCurseur(); p.x = q.x; p.y = q.y; J.tenue = null; deposer(p); J.sel = -1; return; }
      if (code === 'KeyR') { tourner(p); return; }
      if (code === 'Escape') { e.preventDefault(); J.tenue = null; return; }
      return;
    }
    const liste = ordreClavier(); if (!liste.length) return;
    let i = liste.indexOf(J.pieces[J.sel]); if (i < 0) i = 0;
    if (fleches[code]) {
      e.preventDefault();
      const d = (code === 'ArrowLeft' || code === 'ArrowUp') ? -1 : 1;
      i = J.pieces[J.sel] && !J.pieces[J.sel].place && !J.pieces[J.sel].jete ? (i + d + liste.length) % liste.length : 0;
      J.sel = J.pieces.indexOf(liste[i]); SON.clic();
      const p = liste[i]; J.lumiere = { x: p.x, y: p.y };
      return;
    }
    const p = J.pieces[J.sel] && liste.includes(J.pieces[J.sel]) ? J.pieces[J.sel] : null;
    if ((code === 'Enter' || code === 'Space') ) {
      e.preventDefault();
      if (!p) { J.sel = J.pieces.indexOf(liste[0]); return; }
      if (!p.face) { retourner(p); return; }
      J.tenue = p; auDessus(p); SON.prendre();
      if (J.curseur >= J.N.c * J.N.l && !D.panier) J.curseur = 0;
      return;
    }
    if (code === 'KeyR' && p) { tourner(p); }
  });
  document.addEventListener('pointerdown', () => { aInteragi = true; }, true);

  /* =====================================================================
     MODÈLE, PAUSE, TUTORIEL
     ===================================================================== */
  function voirModele() { if (J.ecran !== 'jeu' || J.pause || J.fini) return; J.modele = 2.6; SON.modele(); }
  $('b-modele').addEventListener('click', voirModele);
  $('b-pause').addEventListener('click', () => { SON.clic(); ouvrirPause(); });
  function ouvrirPause() {
    if (J.ecran !== 'jeu' || J.fini) return;
    J.pause = true; J.ecran = 'pause'; geste = null; if (J.tenue && !J.clavier) { garderDansReserve(J.tenue); } J.tenue = null;
    montrer('ecran-pause'); $('b-reprendre').focus();
  }
  function reprendre() { J.pause = false; J.ecran = 'jeu'; montrer(null); SON.clic(); }
  $('b-reprendre').addEventListener('click', reprendre);
  $('b-recommencer').addEventListener('click', () => { SON.clic(); lancerNiveau(J.niv); });
  $('b-pause-niveaux').addEventListener('click', () => { SON.clic(); ouvrirNiveaux(); });
  $('b-pause-accueil').addEventListener('click', () => { SON.clic(); ouvrirTitre(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && J.ecran === 'jeu' && !J.fini) ouvrirPause(); });

  let tutoType = null, tutoT = 0;
  function ouvrirTuto(type) {
    tutoType = type; tutoT = 0; J.ecran = 'tuto'; J.pause = true;
    $('tuto-titre').textContent = tr('tuto.' + type + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + type + '.texte');
    $('tuto-clavier').textContent = tr('tuto.' + type + '.clavier');
    const c = $('tuto-dessin'); c.width = 260 * D.dpr; c.height = 180 * D.dpr;
    montrer('ecran-tuto'); $('b-compris').focus();
  }
  function fermerTuto() { if (J.ecran !== 'tuto') return; sauvegarde.tutos[tutoType] = true; sauver(); tutoType = null; J.ecran = 'jeu'; J.pause = false; montrer(null); SON.clic(); }
  $('b-compris').addEventListener('click', (e) => { e.stopPropagation(); fermerTuto(); });
  $('ecran-tuto').addEventListener('click', fermerTuto);

  /* =====================================================================
     ÉCRANS : TITRE, NIVEAUX, FIN
     ===================================================================== */
  function ouvrirTitre() {
    J.ecran = 'titre'; J.pause = false; $('barre').classList.add('cache'); scene.classList.add('cache');
    montrer('ecran-titre'); preparerTitre(); effacerTitre.maj();
  }
  // Jouer : reprise de la partie sauvegardée (directement au niveau gardé)
  // ou parcours d'origine (choix des puzzles).
  function jouer() {
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => {
        const i = Math.min(NIVEAUX.length, d.niveau) - 1;
        scorePartie = d.score;
        sauvegarde.ouverts = Math.max(sauvegarde.ouverts, i + 1);
        lancerNiveau(i);
      },
      onNouvelle: () => {
        // Une sauvegarde plus avancée reste tant qu'aucun puzzle n'est lancé.
        scorePartie = 0; reprendreA = JEL_SAVE.existe(JEU) ? 0 : 1;
        ouvrirNiveaux();
      }
    });
  }
  const effacerTitre = JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('ecran-titre') });
  $('b-jouer').addEventListener('click', () => { aInteragi = true; SON.clic(); jouer(); });
  $('b-niv-accueil').addEventListener('click', () => { SON.clic(); ouvrirTitre(); });

  function ouvrirNiveaux() {
    J.ecran = 'niveaux'; J.pause = false; $('barre').classList.add('cache'); scene.classList.add('cache');
    montrer('ecran-niveaux');
    const grille = $('grille'); grille.innerHTML = '';
    let total = 0;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    NIVEAUX.forEach((N, i) => {
      const ouvert = i < sauvegarde.ouverts, et = sauvegarde.etoiles[i] || 0; total += et;
      const b = document.createElement('button'); b.className = 'vignette' + (ouvert ? '' : ' fermee');
      b.setAttribute('aria-label', ouvert ? tr('niveauOuvert', { n: i + 1, animal: tr('animal.' + N.a), etoiles: tr('etoilesAria', { n: et }) }) : tr('niveauFerme', { n: i + 1 }));
      const cv = document.createElement('canvas'); cv.width = cv.height = Math.round(84 * dpr);
      cv.getContext('2d').drawImage(imageAnimal(N.a, 84 * dpr), 0, 0);
      const num = document.createElement('span'); num.className = 'num'; num.textContent = nombre(i + 1);
      const ets = document.createElement('span'); ets.className = 'etoiles';
      ets.innerHTML = ouvert ? [0, 1, 2].map((k) => SVG_ETOILE(k < et)).join('') : '';
      b.append(cv, num, ets);
      if (!ouvert) b.insertAdjacentHTML('beforeend', SVG_CADENAS);
      b.addEventListener('click', () => { if (!ouvert) { SON.erreur(); b.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], 250); return; } SON.clic(); lancerNiveau(i); });
      grille.appendChild(b);
    });
    $('total-etoiles').innerHTML = SVG_ETOILE(true) + '<span>' + nombre(total) + ' / ' + nombre(NIVEAUX.length * 3) + '</span>';
    $('total-etoiles').setAttribute('aria-label', tr('totalEtoiles', { n: total, total: NIVEAUX.length * 3 }));
    const prochain = Math.min(sauvegarde.ouverts - 1, NIVEAUX.length - 1);
    const cible = grille.children[Math.max(0, prochain)];
    if (cible) { cible.focus({ preventScroll: true }); try { cible.scrollIntoView({ block: 'nearest' }); } catch (e) { /* rien */ } }
  }

  function calculEtoiles() {
    let e = 3;
    if (J.temps > tempsRef(J.N)) e--;
    if (J.erreurs > erreursPermises(J.N)) e--;
    return Math.max(1, e);
  }
  function montrerFin(gagne) {
    J.ecran = 'fin';
    const i = J.niv, N = J.N, nPieces = N.c * N.l;
    const poses = J.pieces.filter((p) => p.place).length;
    const fc = $('fin-image'), dpr = D.dpr; fc.width = fc.height = Math.round(120 * dpr);
    const fx2 = fc.getContext('2d'); fx2.clearRect(0, 0, fc.width, fc.height);
    $('fin-fait').classList.toggle('cache', !gagne);
    $('fin-detail').textContent = tr('detail', { temps: formatTemps(J.temps), erreurs: tr('erreurs', { n: J.erreurs }) });
    let score = 0, etoiles = 0;
    if (gagne) {
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
      fx2.drawImage(imageAnimal(N.a, 120 * dpr), 0, 0);
      etoiles = calculEtoiles();
      score = Math.max(nPieces * 10, nPieces * 50 + Math.max(0, Math.round(tempsRef(N) - J.temps)) * 5 - J.erreurs * 10);
      $('fin-titre').textContent = tr('bravo');
      $('fin-sous').textContent = tr('reconstitue', { animal: tr('animal.' + N.a) });
      $('fin-fait-texte').textContent = tr('fait.' + N.a);
      const ancien = sauvegarde.records[i] || 0;
      const nouveau = score > ancien;
      sauvegarde.records[i] = Math.max(ancien, score);
      sauvegarde.etoiles[i] = Math.max(sauvegarde.etoiles[i] || 0, etoiles);
      sauvegarde.ouverts = Math.min(NIVEAUX.length, Math.max(sauvegarde.ouverts, i + 4));
      sauver();
      // Niveau réussi : on reprendra au suivant (au dernier si tout est fini).
      scorePartie += score;
      reprendreA = Math.min(NIVEAUX.length, i + 2);
      JEL_SAVE.save(JEU, { niveau: reprendreA, score: scorePartie, etoiles: sauvegarde.etoiles });
      // Jeu terminé (tous les niveaux gagnés au moins une fois) : total des meilleures étoiles.
      if (NIVEAUX.every((_, k) => (sauvegarde.etoiles[k] || 0) > 0)) {
        if (window.FMG) window.FMG.reportComplete({ stars: NIVEAUX.reduce((s, _, k) => s + Math.min(3, sauvegarde.etoiles[k] || 0), 0), maxStars: NIVEAUX.length * 3 });
      }
      $('fin-record').textContent = nouveau ? tr('recordNouveau') : tr('recordAncien', { n: nombre(ancien) });
      $('fin-record').classList.toggle('nouveau', nouveau);
      const dernier = i === NIVEAUX.length - 1;
      $('b-suivant').textContent = dernier ? tr('voirBilan') : tr('suivant');
      $('b-suivant').classList.remove('cache');
      $('b-rejouer').textContent = tr('rejouer');
    } else {
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: i + 1 });
      // Défaite : le dessin incomplet (pièces posées seulement).
      fx2.fillStyle = '#efe8f7'; fx2.fillRect(0, 0, fc.width, fc.height);
      const k = 120 * dpr / D.B;

  /* =====================================================================

  function eclats(x, y, c, n) {
    for (let i = 0; i < n; i++) { const a = Math.random() * TAU, v = 60 + Math.random() * 140; J.part.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, vie: 0.7 + Math.random() * 0.4, c, r: 2 + Math.random() * 3, etoile: Math.random() < 0.5 }); }
  }
  let confs = [];

    for (let i = 0; i < n; i++) confs.push({ x: Math.random() * window.innerWidth, y: -20 - Math.random() * window.innerHeight * 0.5, vx: (Math.random() - 0.5) * 60, vy: 120 + Math.random() * 160, a: Math.random() * TAU, va: (Math.random() - 0.5) * 10, c: couleurs[i % couleurs.length], w: 6 + Math.random() * 6 });

  /* =====================================================================

  function dessinerPiece(c, p, dt) {

  function dessiner(dt) {

    c.fillStyle = 'rgba(255,255,255,.55)'; c.strokeStyle = 'rgba(122,97,217,.35)'; c.lineWidth = 2; c.setLineDash([8, 6]);
    c.beginPath(); c.roundRect ? c.roundRect(R.x, R.y, R.w, R.h, 18) : c.rect(R.x, R.y, R.w, R.h); c.fill(); c.stroke(); c.setLineDash([]);

    c.save(); c.translate(secousse, 0);
    c.fillStyle = '#fffaf0'; c.shadowColor = 'rgba(60,40,90,.25)'; c.shadowBlur = 16; c.shadowOffsetY = 4;
    c.fillRect(bx - 6, by - 6, B + 12, B + 12); c.shadowColor = 'transparent';

    if (N.guide === 'image') { c.globalAlpha = 0.3; c.drawImage(J.img, bx, by, B, B); c.globalAlpha = 1; }

      J.pieces.forEach((p) => { if (p.intrus || p.place) return; c.save(); c.translate(bx + p.c * D.cw, by + p.r * D.ch); c.stroke(p.chemin); c.restore(); });

    c.restore();

    const liste = libres().filter((p) => p !== J.tenue).sort((a, b) => a.z - b.z);
    liste.forEach((p) => dessinerPiece(c, p, dt));
    if (N.nuit && !J.fini) dessinerNuit(c);
    // Panier (toujours visible, même la nuit) et intrus qui y tombent.
    if (D.panier) dessinerPanier(c, D.panier);
    J.pieces.filter((p) => p.jete && p.enPanier < 1).forEach((p) => dessinerPiece(c, p, dt));
    if (J.tenue) dessinerPiece(c, J.tenue, dt);

  }
  function dessinerPanier(c, k) {

    c.fillStyle = '#c9a26b'; c.strokeStyle = '#8a6236'; c.lineWidth = 2;

  /* =====================================================================
     MISE À JOUR (chaque image)
     ===================================================================== */
  function maj(dt) {
    if (J.ecran !== 'jeu' || J.pause) return;
    const N = J.N;
    if (!J.fini) {
      J.temps += dt;
      if (N.sablier) {
        const reste = tempsSablier(N) - J.temps;
        const s = Math.ceil(reste);
        if (reste <= 10 && s !== J.dernierTic && s > 0) { J.dernierTic = s; SON.tic(); }
        if (reste <= 0) { J.fini = true; J.perdu = true; J.tenue = null; geste = null; majChrono(); setTimeout(() => montrerFin(false), 500); return; }
      }
      majChrono();
    } else if (!J.perdu) {
      J.celeb += dt;
      if (J.celeb > 0.15 && J.celeb - dt <= 0.15) eclats(D.bx + D.B / 2, D.by + D.B / 2, '#ffd43b', 30);
      if (J.celeb > 1.5 && J.celeb - dt <= 1.5) montrerFin(true);
    }
    if (J.modele > 0) J.modele = Math.max(0, J.modele - dt);
    if (J.secousse > 0) J.secousse = Math.max(0, J.secousse - dt);
    const lisse = 1 - Math.exp(-dt * 14);
    J.pieces.forEach((p) => {
      const cibleAng = p.rot * Math.PI / 2;
      let da = cibleAng - p.ang; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;

      if (p.eclat > 0) p.eclat = Math.max(0, p.eclat - dt * 3);
      if (p.jete) {
        p.enPanier = Math.min(1, p.enPanier + dt * 2.5);
        p.x += (D.panier.x - p.x) * lisse; p.y += (D.panier.y - p.y) * lisse;
        return;
      }
      if (p.place) { p.x += (cibleX(p) - p.x) * lisse; p.y += (cibleY(p) - p.y) * lisse; p.s += (1 - p.s) * lisse; return; }

    J.part = J.part.filter((q) => q.vie > 0);
  }

  function majConfettis(dt) {

    fctx.setTransform(dpr, 0, 0, dpr, 0, 0); fctx.clearRect(0, 0, fx.width, fx.height);

  /* =====================================================================
     ÉCRAN TITRE ANIMÉ ET TUTORIELS ANIMÉS
     ===================================================================== */
  let titre = null;
  function preparerTitre() {
    const cv = $('titre-dessin'), dpr = Math.min(window.devicePixelRatio || 1, 2.5);

    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);

      c.lineWidth = 3; c.strokeStyle = '#fff'; c.stroke(); c.restore();
    });

  // Main animée du tutoriel (bout du doigt en x, y).

    c.rotate(-0.35); c.fillStyle = '#fff'; c.strokeStyle = '#3b2a4a'; c.lineWidth = 2;
    const f = new Path2D(rr(-4.5, 0, 9, 24, 4.5)), pa = new Path2D(rr(-10, 16, 24, 22, 8)), po = new Path2D(); po.ellipse(-10, 24, 4, 8, -0.5, 0, TAU);

  const tutoCache = {};
  function tutoMorceaux() {

      const B = 110, cw = 55, T = cw * 0.22, img = imageAnimal(a, B * dpr), bordsDe = genererBords(2, 2, hasard(5));
      const autre = imageAnimal(a === 'poisson' ? 'chat' : 'poisson', B * dpr);
      tutoCache.cle = cle; tutoCache.B = B; tutoCache.cw = cw; tutoCache.img = img;
      tutoCache.p = [0, 1, 2, 3].map((i) => fabriquerPiece(img, B, i % 2, Math.floor(i / 2), cw, cw, bordsDe(i % 2, Math.floor(i / 2)), T, dpr));

  function dessinerTuto(dt) {
