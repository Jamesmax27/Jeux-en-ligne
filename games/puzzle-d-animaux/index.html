    const cv = $('tuto-dessin'), c = cv.getContext('2d'), m = tutoMorceaux(), dpr = D.dpr;
    c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, 260, 180);
    const cyc = (tutoT % 3.4) / 3.4, B = m.B, cw = m.cw, ox = 22, oy = 35;
    const ease = (v) => v < 0 ? 0 : v > 1 ? 1 : v * v * (3 - 2 * v);
    // Pièce du tutoriel : s = taille, sx = largeur (retournement), img = endroit ou dos.
    const piece = (q, x, y, a, s, sx, img) => { const w = cw + 2 * q.pad; c.save(); c.translate(x, y); c.rotate(a || 0); c.scale((s || 1) * (sx || 1), s || 1); c.drawImage(img || q.endroit, -w / 2, -w / 2, w, w); c.restore(); };
    const plateau = (alphaImg, grille) => {
      c.fillStyle = '#efe6d6'; c.fillRect(ox, oy, B, B);
      if (alphaImg) { c.globalAlpha = alphaImg; c.drawImage(m.img, ox, oy, B, B); c.globalAlpha = 1; }
      if (grille) { c.globalAlpha = grille; c.setLineDash([4, 4]); c.strokeStyle = 'rgba(106,63,181,.6)'; c.lineWidth = 1.2; m.p.forEach((q, i) => { c.save(); c.translate(ox + (i % 2) * cw, oy + Math.floor(i / 2) * cw); c.stroke(q.chemin); c.restore(); }); c.setLineDash([]); c.globalAlpha = 1; }
      c.strokeStyle = '#7b61d9'; c.lineWidth = 2; c.strokeRect(ox, oy, B, B);
    };
    const poses = (sauf) => m.p.forEach((q, i) => { if (i !== sauf) piece(q, ox + (i % 2 + 0.5) * cw, oy + (Math.floor(i / 2) + 0.5) * cw); });
    const cx3 = ox + 1.5 * cw, cy3 = oy + 1.5 * cw, rx = 200, ry = 120;
    const brille = (x, y, k) => { if (k <= 0) return; c.fillStyle = '#ffd43b'; for (let i = 0; i < 6; i++) { const a = i * TAU / 6; dessinerEtoile(c, x + Math.cos(a) * 36 * k, y + Math.sin(a) * 36 * k, 5 * (1 - k * 0.5)); } };
    if (tutoType === 'glisser' || tutoType === 'cadre') {
      const grille = tutoType === 'cadre' ? 1 - ease(cyc / 0.3) : 1;
      plateau(tutoType === 'glisser' ? 0.3 : 0, grille); poses(3);
      const k = ease((cyc - 0.25) / 0.45), x = rx + (cx3 - rx) * k, y = ry + (cy3 - ry) * k;
      piece(m.p[3], x, y, 0, 1);
      if (cyc < 0.25) main(c, rx + 30 * (1 - ease(cyc / 0.25)), ry + 30 * (1 - ease(cyc / 0.25)), 0);
      else if (cyc < 0.72) main(c, x, y, cyc < 0.3 ? 1 : 0);
      brille(cx3, cy3, ease((cyc - 0.72) / 0.25));
    } else if (tutoType === 'modele') {
      plateau(0, 1);
      const ex = 205, ey = 60;
      c.fillStyle = '#fff'; c.strokeStyle = '#6a3fb5'; c.lineWidth = 2; c.beginPath(); c.arc(ex, ey, 18, 0, TAU); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(ex - 11, ey); c.quadraticCurveTo(ex, ey - 10, ex + 11, ey); c.quadraticCurveTo(ex, ey + 10, ex - 11, ey); c.stroke(); c.fillStyle = '#6a3fb5'; c.beginPath(); c.arc(ex, ey, 4, 0, TAU); c.fill();
      const app = ease((cyc - 0.35) / 0.12) * (1 - ease((cyc - 0.85) / 0.12));
      c.globalAlpha = app; c.drawImage(m.img, ox, oy, B, B); c.globalAlpha = 1;
      const k = ease(cyc / 0.3); main(c, 230 + (ex - 230) * k, 150 + (ey - 150) * k, cyc > 0.3 && cyc < 0.4 ? 1 : 0);
    } else if (tutoType === 'sablier') {
      plateau(0, 1); poses(3);
      const hx = 205, hy = 90, v = cyc;
      c.fillStyle = '#fff'; c.strokeStyle = '#6a3fb5'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(hx - 24, hy - 42); c.lineTo(hx + 24, hy - 42); c.quadraticCurveTo(hx + 24, hy - 8, hx, hy); c.quadraticCurveTo(hx + 24, hy + 8, hx + 24, hy + 42); c.lineTo(hx - 24, hy + 42); c.quadraticCurveTo(hx - 24, hy + 8, hx, hy); c.quadraticCurveTo(hx - 24, hy - 8, hx - 24, hy - 42); c.fill(); c.stroke();
      c.fillStyle = '#f4a259';
      const haut = 30 * (1 - v); c.beginPath(); c.moveTo(hx - haut * 0.7, hy - haut); c.lineTo(hx + haut * 0.7, hy - haut); c.lineTo(hx, hy - 2); c.closePath(); c.fill();
      const bas = 30 * v; c.beginPath(); c.moveTo(hx - 22, hy + 40); c.lineTo(hx + 22, hy + 40); c.lineTo(hx + bas * 0.5, hy + 40 - bas); c.lineTo(hx - bas * 0.5, hy + 40 - bas); c.closePath(); c.fill();
      if (v < 0.97) c.fillRect(hx - 1, hy, 2, 40 - bas);
    } else if (tutoType === 'tourner') {
      plateau(0, 1); poses(3);
      const tap = cyc > 0.3 && cyc < 0.38, a = cyc < 0.35 ? -Math.PI / 2 : -Math.PI / 2 * (1 - ease((cyc - 0.35) / 0.15));
      const k = ease((cyc - 0.55) / 0.3), x = rx + (cx3 - rx) * k, y = ry + (cy3 - ry) * k;
      piece(m.p[3], x, y, a, 1);
      if (cyc < 0.55) main(c, rx + 10, ry + 10, tap ? 1 : 0); else if (cyc < 0.86) main(c, x, y, 0);
      brille(cx3, cy3, ease((cyc - 0.86) / 0.12));
    } else if (tutoType === 'intrus') {
      plateau(0, 1); poses(-1);
      const kx = 215, ky = 140; dessinerPanier(c, { x: kx, y: ky, r: 26 });
      const k = ease((cyc - 0.2) / 0.45), x = 205 + (kx - 205) * k, y = 60 + (ky - 60) * k, s = 1 - ease((cyc - 0.65) / 0.15) * 0.9;
      if (cyc < 0.85) piece(m.intrus, x, y, 0, Math.max(0.1, s));
      if (cyc < 0.65) main(c, x, y, cyc < 0.25 ? 1 : 0);
      brille(kx, ky - 6, ease((cyc - 0.8) / 0.2) * 0.6);
    } else if (tutoType === 'retourner') {
      plateau(0, 1); poses(3);
      const f = ease((cyc - 0.35) / 0.25), sx = Math.abs(Math.cos(f * Math.PI)), img = f < 0.5 ? m.p[3].dos : m.p[3].endroit;
      piece(m.p[3], rx, ry - 20, 0, 1, Math.max(0.05, sx), img);
      main(c, rx + 6, ry - 6, cyc > 0.3 && cyc < 0.4 ? 1 : 0);
    } else if (tutoType === 'nuit') {
      c.fillStyle = '#efe6d6'; c.fillRect(0, 0, 260, 180);
      m.p.forEach((q, i) => piece(q, 45 + i * 56, 95 + (i % 2 ? 20 : -20), 0, 0.9));
      const lx = 130 + Math.cos(cyc * TAU) * 85, ly = 95 + Math.sin(cyc * TAU * 2) * 35;
      const gr = c.createRadialGradient(lx, ly, 18, lx, ly, 55); gr.addColorStop(0, 'rgba(10,14,40,0)'); gr.addColorStop(1, 'rgba(10,14,40,.95)');
      c.fillStyle = gr; c.fillRect(0, 0, 260, 180);
      main(c, lx, ly, 0);
    }
  }

  /* =====================================================================
     BOUCLE PRINCIPALE
     ===================================================================== */
  let avant = performance.now();
  function boucle(t) {
    const dt = Math.min(0.05, (t - avant) / 1000); avant = t;
    if (J.ecran === 'titre') dessinerTitre(dt);
    if (J.ecran === 'tuto') dessinerTuto(dt);
    if (J.N && (J.ecran === 'jeu' || J.ecran === 'pause' || J.ecran === 'tuto' || J.ecran === 'fin')) {
      maj(dt);
      if (!J.pause || J.ecran === 'tuto') dessiner(dt);
    }
    majConfettis(dt);
    requestAnimationFrame(boucle);
  }

  window.addEventListener('resize', () => {
    if (J.ecran === 'titre') { preparerTitre(); return; }
    if (!J.N || J.ecran === 'niveaux') return;
    dimensions(); J.tenue = null; geste = null; preparerPieces(false); if (J.ecran === 'pause' || J.ecran === 'fin') dessiner(0);
  });

  // Démarrage.
  dimensions();
  ouvrirTitre();
  requestAnimationFrame(boucle);
})();
</script>
