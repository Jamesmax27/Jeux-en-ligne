  "journal.titre": "Le journal du dernier gardien",
  "journal.page": "Page {n}",
  "journal.ferme": "Page {n} : encore perdue. Franchis l'étage pour la retrouver.",
  "journal.1": "Premier soir au phare. L'ancien gardien a laissé la porte ouverte et le feu éteint. Dans la cave, l'eau monte jusqu'aux chevilles, et quelqu'un a gravé des marques au mur : une par nuit de tempête.",
  "journal.2": "J'ai trouvé un médaillon coincé entre deux pierres. Un coquillage gravé dessus, et un prénom effacé par le sel. Les pêcheurs disent que chaque noyé en portait un, pour qu'on le reconnaisse.",
  "journal.3": "Les marches de bois pourrissent plus vite que je ne les répare. Cette nuit, l'une d'elles a cédé sous mon pied. En bas, dans le noir, j'ai entendu quelque chose l'attraper.",
  "journal.4": "La marée ne redescend plus. Elle monte dans la tour comme si la mer voulait la reprendre. J'ai compté les marches entre l'eau et moi : il en reste moins qu'hier.",
  "journal.5": "Je sais maintenant qui sont ceux qui remontent. Les marins de l'Hirondelle, perdus il y a quarante ans, la nuit où le feu s'est éteint. Ils ne cherchent pas à me faire peur. Ils cherchent la lumière.",
  "journal.6": "Ma chambre sent l'algue. Les vagues passent par les fenêtres et dévalent l'escalier comme une rivière. Je me cache derrière les piliers et je compte jusqu'à ce que ça passe.",
  "journal.7": "Certains ne marchent plus. Ils flottent, à travers les marches, à travers les murs. Seule la lanterne les arrête. Je garde mon huile comme on garde son souffle.",
  "journal.8": "Il y a des mains dans les murs. Je les vois frémir sous le plâtre mouillé juste avant qu'elles sortent. Elles ne frappent pas. Elles veulent seulement me tirer vers le bas, avec eux.",
  "journal.9": "J'ai retrouvé le carnet de mon prédécesseur sous le lit. La dernière page dit seulement : « Ne pas éteindre. Jamais. » L'encre a coulé, comme s'il avait écrit sous la pluie.",
  "journal.10": "La chambre est sous l'eau. J'ai emporté les médaillons dans ma poche. Ils sont froids, et ils pèsent plus lourd chaque fois que la mer gronde.",
  "journal.11": "La salle des cartes est pleine de miroirs. Mon reflet ne me suit pas. Il attend que je me retourne pour avancer. Je ne lui tourne plus jamais le dos.",
  "journal.12": "Les noyés d'un côté, les reflets de l'autre. Je dois choisir qui regarder et qui éclairer. Une erreur, et le verre se colle à ma nuque.",
  "journal.13": "Les grandes cartes pendent à leurs chaînes et se balancent toutes seules. Sur l'une d'elles, la route de l'Hirondelle s'arrête juste devant nos rochers. Une croix rouge, et rien après.",
  "journal.14": "J'ai compris pourquoi le feu s'est éteint, cette nuit-là. Le gardien était descendu aider les marins. Il n'est jamais remonté. Le phare est resté noir, et la mer a tout pris.",
  "journal.15": "Plus que la lanterne. Mes mains tremblent, mon huile baisse, et l'eau me suit toujours. Derrière moi, ils ne grognent plus. Ils chantent, tout bas, une chanson de marins.",
  "journal.16": "Ici, il fait noir. Vraiment noir. Les éclairs me montrent les marches une seconde, puis tout disparaît. Je monte en me souvenant de ce que j'ai vu.",
  "journal.17": "Une vague m'a presque emportée. Une main m'a retenue par le col. Pas une main des murs. Une main chaude. Quelqu'un, parmi eux, veut que j'arrive en haut.",
  "journal.18": "Les vitres de la lanterne ont éclaté. Le vent hurle à l'intérieur et me pousse vers le vide. Dans les miroirs brisés, mon reflet sourit. Je ne souris pas.",
  "journal.19": "Je vois le foyer. Il ne reste qu'un étage. L'eau est à mes talons, les mains sortent de partout, et ma lanterne n'a presque plus d'huile. Si tu lis ceci, monte. Ne t'arrête pas.",
  "journal.20": "Le feu brûle. Son faisceau passe sur la mer, et un à un, les noyés redescendent dans l'eau, apaisés. Ils ont enfin vu la lumière qui leur avait manqué. Le phare a de nouveau une gardienne.",

  "journal.titre": "The last keeper's diary",
  "journal.page": "Page {n}",
  "journal.ferme": "Page {n}: still lost. Clear the floor to find it.",
  "journal.1": "First night at the lighthouse. The old keeper left the door open and the light out. In the cellar, the water is ankle-deep, and someone has scratched marks into the wall: one for every stormy night.",
  "journal.2": "I found a medallion stuck between two stones. A shell is carved on it, and a first name worn away by the salt. The fishermen say every drowned sailor wore one, so they could be recognised.",
  "journal.3": "The wooden steps rot faster than I can fix them. Tonight one gave way under my foot. Down below, in the dark, I heard something catch it.",
  "journal.4": "The tide doesn't go back down anymore. It climbs the tower as if the sea wanted it back. I counted the steps between the water and me: there are fewer than yesterday.",
  "journal.5": "Now I know who is climbing up. The sailors of the Swallow, lost forty years ago, the night the light went out. They aren't trying to scare me. They are looking for the light.",
  "journal.6": "My bedroom smells of seaweed. The waves pour in through the windows and rush down the stairs like a river. I hide behind the pillars and count until it passes.",
  "journal.7": "Some of them don't walk anymore. They float, through the steps, through the walls. Only the lantern stops them. I save my oil the way you hold your breath.",
  "journal.8": "There are hands in the walls. I see them twitch under the wet plaster just before they come out. They don't strike. They only want to pull me down, with them.",
  "journal.9": "I found the old keeper's notebook under the bed. The last page only says: \"Don't let it go out. Ever.\" The ink has run, as if he wrote it in the rain.",
  "journal.10": "The bedroom is underwater. I took the medallions in my pocket. They are cold, and they feel heavier every time the sea roars.",
  "journal.11": "The map room is full of mirrors. My reflection doesn't follow me. It waits for me to turn around before it moves. I never turn my back on it anymore.",
  "journal.12": "The drowned on one side, the reflections on the other. I have to choose who to face and who to light. One mistake, and the glass is right at my neck.",
  "journal.13": "The big maps hang from their chains and sway on their own. On one of them, the Swallow's route stops right in front of our rocks. A red cross, and nothing after.",
  "journal.14": "I understand why the light went out that night. The keeper went down to help the sailors. He never came back up. The lighthouse stayed dark, and the sea took everything.",
  "journal.15": "Only the lantern room is left. My hands shake, my oil is low, and the water is still following me. Behind me, they don't growl anymore. They sing, very softly, an old sailors' song.",
  "journal.16": "It's dark here. Truly dark. The lightning shows me the steps for a second, then everything vanishes. I climb by remembering what I saw.",
  "journal.17": "A wave nearly swept me away. A hand caught me by the collar. Not a hand from the walls. A warm hand. Someone among them wants me to reach the top.",
  "journal.18": "The lantern room windows have burst. The wind howls inside and pushes me toward the edge. In the broken mirrors, my reflection is smiling. I'm not.",
  "journal.19": "I can see the hearth. Only one floor left. The water is at my heels, hands come out everywhere, and my lantern is almost out of oil. If you are reading this, climb. Don't stop.",
  "journal.20": "The fire is burning. Its beam sweeps across the sea, and one by one the drowned sink back into the water, at peace. At last they have seen the light they were missing. The lighthouse has a keeper again.",

  "journal.titre": "El diario del último guardián",
  "journal.page": "Página {n}",
  "journal.ferme": "Página {n}: todavía perdida. Supera el piso para encontrarla.",
  "journal.1": "Primera noche en el faro. El antiguo guardián dejó la puerta abierta y la luz apagada. En el sótano, el agua llega a los tobillos, y alguien grabó marcas en el muro: una por cada noche de tormenta.",
  "journal.2": "Encontré un medallón atrapado entre dos piedras. Tiene una concha grabada y un nombre borrado por la sal. Los pescadores dicen que cada ahogado llevaba uno, para que lo reconocieran.",
  "journal.3": "Los escalones de madera se pudren más rápido de lo que los arreglo. Esta noche uno se rompió bajo mi pie. Abajo, en la oscuridad, oí que algo lo atrapaba.",
  "journal.4": "La marea ya no baja. Sube por la torre como si el mar quisiera recuperarla. Conté los escalones entre el agua y yo: quedan menos que ayer.",
  "journal.5": "Ahora sé quiénes son los que suben. Los marineros de la Golondrina, perdidos hace cuarenta años, la noche en que la luz se apagó. No quieren asustarme. Buscan la luz.",
  "journal.6": "Mi habitación huele a algas. Las olas entran por las ventanas y bajan por la escalera como un río. Me escondo detrás de los pilares y cuento hasta que pasa.",
  "journal.7": "Algunos ya no caminan. Flotan, a través de los escalones, a través de los muros. Solo la linterna los detiene. Guardo mi aceite como quien contiene la respiración.",
  "journal.8": "Hay manos en los muros. Las veo temblar bajo el yeso mojado justo antes de salir. No golpean. Solo quieren arrastrarme hacia abajo, con ellos.",
  "journal.9": "Encontré el cuaderno del antiguo guardián debajo de la cama. La última página solo dice: «No dejar que se apague. Nunca». La tinta se corrió, como si hubiera escrito bajo la lluvia.",
  "journal.10": "La habitación está bajo el agua. Me llevé los medallones en el bolsillo. Están fríos y pesan más cada vez que el mar ruge.",
  "journal.11": "La sala de mapas está llena de espejos. Mi reflejo no me sigue. Espera a que me dé la vuelta para avanzar. Ya nunca le doy la espalda.",
  "journal.12": "Los ahogados por un lado, los reflejos por el otro. Tengo que elegir a quién mirar y a quién alumbrar. Un error, y el vidrio se me pega a la nuca.",
  "journal.13": "Los grandes mapas cuelgan de sus cadenas y se balancean solos. En uno de ellos, la ruta de la Golondrina se detiene justo delante de nuestras rocas. Una cruz roja, y nada más.",
  "journal.14": "Entendí por qué la luz se apagó aquella noche. El guardián bajó a ayudar a los marineros. Nunca volvió a subir. El faro quedó a oscuras, y el mar se lo llevó todo.",
  "journal.15": "Solo queda la linterna. Me tiemblan las manos, mi aceite baja y el agua me sigue. Detrás de mí ya no gruñen. Cantan, muy bajito, una canción de marineros.",
  "journal.16": "Aquí está oscuro. Oscuro de verdad. Los relámpagos me muestran los escalones un segundo y luego todo desaparece. Subo recordando lo que vi.",
  "journal.17": "Una ola casi me arrastra. Una mano me sujetó por el cuello del impermeable. No era una mano de los muros. Era una mano cálida. Alguien, entre ellos, quiere que llegue arriba.",
  "journal.18": "Los cristales de la linterna estallaron. El viento aúlla dentro y me empuja hacia el vacío. En los espejos rotos, mi reflejo sonríe. Yo no.",
  "journal.19": "Veo el hogar del fuego. Solo queda un piso. El agua me pisa los talones, las manos salen por todas partes y a mi linterna casi no le queda aceite. Si lees esto, sube. No te detengas.",
  "journal.20": "El fuego arde. Su haz recorre el mar y, uno a uno, los ahogados vuelven a hundirse en el agua, en paz. Por fin vieron la luz que les faltó. El faro vuelve a tener guardiana.",

 "pt": {
  "titre": "O Farol dos Afogados",
  "consigne": "Suba até o alto do farol, degrau por degrau. Levante a lanterna para congelar os afogados, mas fique de olho no óleo.",

  "journal.titre": "O diário do último guardião",
  "journal.page": "Página {n}",
  "journal.ferme": "Página {n}: ainda perdida. Vença o andar para encontrá-la.",
  "journal.1": "Primeira noite no farol. O antigo guardião deixou a porta aberta e a luz apagada. No porão, a água chega aos tornozelos, e alguém riscou marcas na parede: uma para cada noite de tempestade.",
  "journal.2": "Achei um medalhão preso entre duas pedras. Tem uma concha gravada e um nome apagado pelo sal. Os pescadores dizem que cada afogado usava um, para ser reconhecido.",
  "journal.3": "Os degraus de madeira apodrecem mais rápido do que eu consigo consertar. Hoje à noite, um quebrou debaixo do meu pé. Lá embaixo, no escuro, ouvi alguma coisa pegá-lo.",
  "journal.4": "A maré não desce mais. Ela sobe pela torre como se o mar quisesse tomá-la de volta. Contei os degraus entre a água e mim: sobram menos que ontem.",
  "journal.5": "Agora sei quem são os que sobem. Os marinheiros do Andorinha, perdidos há quarenta anos, na noite em que a luz se apagou. Eles não querem me assustar. Eles procuram a luz.",
  "journal.6": "Meu quarto cheira a alga. As ondas entram pelas janelas e descem pela escada como um rio. Eu me escondo atrás dos pilares e conto até passar.",
  "journal.7": "Alguns não andam mais. Eles flutuam, através dos degraus, através das paredes. Só a lanterna consegue pará-los. Guardo meu óleo como quem prende a respiração.",
  "journal.8": "Há mãos nas paredes. Eu as vejo tremer sob o reboco molhado logo antes de saírem. Elas não batem. Só querem me puxar para baixo, junto com eles.",
  "journal.9": "Achei o caderno do antigo guardião embaixo da cama. A última página só diz: \"Não deixar apagar. Nunca.\" A tinta escorreu, como se ele tivesse escrito na chuva.",
  "journal.10": "O quarto está debaixo d'água. Levei os medalhões no bolso. Eles estão frios e ficam mais pesados cada vez que o mar ruge.",
  "journal.11": "A sala dos mapas está cheia de espelhos. Meu reflexo não me segue. Ele espera eu me virar para avançar. Nunca mais dou as costas para ele.",
  "journal.12": "Os afogados de um lado, os reflexos do outro. Preciso escolher quem encarar e quem iluminar. Um erro, e o vidro gruda na minha nuca.",
  "journal.13": "Os grandes mapas pendem das correntes e balançam sozinhos. Em um deles, a rota do Andorinha para bem na frente das nossas pedras. Uma cruz vermelha, e mais nada.",
  "journal.14": "Entendi por que a luz se apagou naquela noite. O guardião desceu para ajudar os marinheiros. Nunca mais subiu. O farol ficou escuro, e o mar levou tudo.",
  "journal.15": "Só falta a lanterna. Minhas mãos tremem, meu óleo diminui e a água continua atrás de mim. Às minhas costas, eles não rosnam mais. Eles cantam, bem baixinho, uma canção de marinheiros.",
  "journal.16": "Aqui está escuro. Escuro de verdade. Os relâmpagos mostram os degraus por um segundo, depois tudo some. Eu subo lembrando do que vi.",
  "journal.17": "Uma onda quase me levou. Uma mão me segurou pela gola. Não era uma mão das paredes. Era uma mão quente. Alguém, entre eles, quer que eu chegue lá em cima.",
  "journal.18": "Os vidros da lanterna estouraram. O vento uiva lá dentro e me empurra para o vazio. Nos espelhos quebrados, meu reflexo sorri. Eu não.",
  "journal.19": "Vejo a fornalha. Falta só um andar. A água está nos meus calcanhares, mãos saem de todo lado e minha lanterna quase não tem mais óleo. Se você está lendo isto, suba. Não pare.",
  "journal.20": "O fogo queima. O facho passa sobre o mar e, um por um, os afogados voltam a afundar na água, em paz. Enfim viram a luz que lhes faltou. O farol tem uma guardiã de novo.",

  "journal.ferme": "Seite {n}: noch verloren. Schaff das Stockwerk, um sie zu finden.",
  "journal.1": "Erste Nacht im Leuchtturm. Der alte Wärter hat die Tür offen und das Licht aus gelassen. Im Keller steht das Wasser knöcheltief, und jemand hat Striche in die Wand geritzt: einen für jede Sturmnacht.",
  "journal.2": "Ich habe ein Medaillon zwischen zwei Steinen gefunden. Eine Muschel ist darauf eingraviert und ein Vorname, den das Salz weggefressen hat. Die Fischer sagen, jeder Ertrunkene trug eins, damit man ihn erkennt.",
  "journal.3": "Die Holzstufen faulen schneller, als ich sie reparieren kann. Heute Nacht ist eine unter meinem Fuß gebrochen. Unten in der Dunkelheit habe ich gehört, wie etwas sie aufgefangen hat.",
  "journal.4": "Die Flut geht nicht mehr zurück. Sie steigt im Turm hoch, als wollte das Meer ihn zurückholen. Ich habe die Stufen zwischen dem Wasser und mir gezählt: Es sind weniger als gestern.",
  "journal.5": "Jetzt weiß ich, wer da heraufsteigt. Die Seeleute der Schwalbe, vor vierzig Jahren verschollen, in der Nacht, als das Licht ausging. Sie wollen mir keine Angst machen. Sie suchen das Licht.",
  "journal.6": "Meine Kammer riecht nach Algen. Die Wellen kommen durch die Fenster und stürzen die Treppe hinab wie ein Fluss. Ich verstecke mich hinter den Säulen und zähle, bis es vorbei ist.",
  "journal.7": "Manche laufen nicht mehr. Sie schweben, durch die Stufen, durch die Wände. Nur die Laterne hält sie auf. Ich spare mein Öl, wie man den Atem anhält.",
  "journal.8": "In den Wänden sind Hände. Ich sehe sie unter dem nassen Putz zucken, kurz bevor sie herauskommen. Sie schlagen nicht. Sie wollen mich nur nach unten ziehen, zu sich.",
  "journal.9": "Unter dem Bett habe ich das Heft meines Vorgängers gefunden. Auf der letzten Seite steht nur: „Nicht ausgehen lassen. Niemals.“ Die Tinte ist verlaufen, als hätte er im Regen geschrieben.",
  "journal.10": "Die Kammer steht unter Wasser. Ich habe die Medaillons in die Tasche gesteckt. Sie sind kalt und werden schwerer, jedes Mal, wenn das Meer tost.",
  "journal.11": "Der Kartenraum ist voller Spiegel. Mein Spiegelbild folgt mir nicht. Es wartet, bis ich mich umdrehe, und kommt dann näher. Ich kehre ihm nie mehr den Rücken zu.",
  "journal.12": "Die Ertrunkenen auf der einen Seite, die Spiegelbilder auf der anderen. Ich muss wählen, wen ich ansehe und wen ich anleuchte. Ein Fehler, und das Glas klebt an meinem Nacken.",
  "journal.13": "Die großen Karten hängen an Ketten und schaukeln von allein. Auf einer endet die Route der Schwalbe direkt vor unseren Felsen. Ein rotes Kreuz, und danach nichts mehr.",
  "journal.14": "Jetzt verstehe ich, warum das Licht in jener Nacht ausging. Der Wärter ist hinabgestiegen, um den Seeleuten zu helfen. Er kam nie wieder herauf. Der Leuchtturm blieb dunkel, und das Meer nahm alles.",
  "journal.15": "Nur noch die Laterne. Meine Hände zittern, mein Öl wird knapp, und das Wasser folgt mir immer noch. Hinter mir knurren sie nicht mehr. Sie singen, ganz leise, ein altes Seemannslied.",
  "journal.16": "Hier ist es dunkel. Wirklich dunkel. Die Blitze zeigen mir die Stufen für eine Sekunde, dann ist alles weg. Ich steige weiter und erinnere mich an das, was ich gesehen habe.",
  "journal.17": "Eine Welle hätte mich fast mitgerissen. Eine Hand hat mich am Kragen gepackt. Keine Hand aus den Wänden. Eine warme Hand. Jemand unter ihnen will, dass ich oben ankomme.",
  "journal.18": "Die Scheiben der Laterne sind zersprungen. Drinnen heult der Wind und drückt mich zum Abgrund. In den zerbrochenen Spiegeln lächelt mein Spiegelbild. Ich nicht.",
  "journal.19": "Ich sehe die Feuerstelle. Nur noch ein Stockwerk. Das Wasser ist mir auf den Fersen, überall kommen Hände heraus, und meine Laterne hat fast kein Öl mehr. Wenn du das liest: Steig weiter. Bleib nicht stehen.",
  "journal.20": "Das Feuer brennt. Sein Strahl streicht über das Meer, und einer nach dem anderen sinken die Ertrunkenen ins Wasser zurück, in Frieden. Endlich haben sie das Licht gesehen, das ihnen gefehlt hat. Der Leuchtturm hat wieder eine Wärterin.",

  "tuto.sauter": "Tipp auf den Sprungknopf, um auf die Stufe darüber zu springen. Je länger du drückst, desto höher springst du.",

  "tuto.lanterne.titre": "Die Laterne",
  "tuto.lanterne": "Halt den Finger auf der Laterne: Ihr Licht lässt die Ertrunkenen erstarren. Sie verbrennt Öl, also lass los, sobald du kannst. Erreiche die Tür oben im Stockwerk.",
  "tuto.lanterne.clavier": "Tastatur: Umschalt, E, S oder Pfeil nach unten (gedrückt halten). Esc oder P: Pause.",

  "tuto.objets": "Sammle die 3 Medaillons und behalte mindestens 30 % Öl, um alle 3 Sterne zu holen. Fläschchen füllen deine Laterne auf.",
  "tuto.pourrie.titre": "Morsche Stufen",
  "tuto.pourrie": "Holzstufen knarren und brechen dann unter deinen Füßen. Bleib nicht darauf stehen! Etwas später sind sie wieder da.",
  "tuto.maree.titre": "Die Flut steigt",
  "tuto.maree": "Im Turm steigt das Wasser. Wenn es dich bedeckt, ist es vorbei: Klettere schneller als die Flut.",

  "tuto.vague": "Ein Tropfen blinkt und der Turm grollt: Eine Welle kommt. Stell dich dicht an eine Säule, sonst stößt sie dich in die Tiefe.",
  "tuto.flotteur.titre": "Die Schwebenden",
  "tuto.flotteur": "Diese Ertrunkenen gleiten durch Stufen und Wände direkt auf dich zu. Auch sie hält dein Licht auf.",

<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }

      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }

  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }

    }

  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;

    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);

  }

  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)

  // tout de suite. Renvoie true si la fenêtre s'affiche.

    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);

    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();

  }

  function lumiereSur(x, y) {
    if (!touches.lanterne || huile <= 0) return false;
    const dx = x - joueur.x, dy = y - (joueur.y - 18);
    return dx * dx + dy * dy < RAYON_LUMIERE * RAYON_LUMIERE;
  }

  function mettreAJour(dt) {
    const L = monde.L;
    temps += dt;
    const j = joueur;

    // Lanterne et huile
    const allumee = touches.lanterne && huile > 0;
    if (allumee && !lanterneAvant) { huile = Math.max(0, huile - CONSO_ALLUMAGE); son('lanterne'); }
    if (allumee) {
      huile = Math.max(0, huile - CONSO * dt);
      if (huile <= 0) { annoncer(T('msg.huileVide'), 1600); }
      if (Math.random() < dt * 14) particules.push({ x: j.x + j.dir * 9 + (Math.random() - 0.5) * 6, y: j.y - 40, vx: (Math.random() - 0.5) * 20, vy: -30 - Math.random() * 30, g: -20, vie: 0.8, max: 0.8, c: 'lumiere', r: 1.5 + Math.random() * 1.5 });
    }
    lanterneAvant = allumee;

    // Plateformes mobiles et pourries
    monde.plats.forEach((p) => {
      if (p.type === 'mobile') {
        const nx = p.x0 + Math.sin(temps * p.vit + p.phase) * p.amp;
        p.dx = nx - p.x; p.x = nx;
      } else if (p.type === 'pourrie') {
        if (!p.actif) {
          p.chute += dt;
          p.retour -= dt;
          if (p.retour <= 0) { p.actif = true; p.charge = 0; p.chute = 0; }
        } else if (j.sol === p) {
          if (p.charge === 0) son('craque');
          p.charge += dt;
          if (Math.random() < dt * 20) gerbe(p.x + Math.random() * p.w, p.y + 4, 1, '#6b5036', 40, 300, 0.5);
          if (p.charge > 0.55) {
            p.actif = false; p.retour = 3.4; p.chute = 0;
            son('cede');
            gerbe(p.x + p.w / 2, p.y + 5, 18, '#7a5a3a', 120, 600, 0.9);
            if (j.sol === p) j.sol = null;
          }
        } else if (p.charge > 0) {
          p.charge = Math.max(0, p.charge - dt * 0.5);
        }
      }
    });

    // Déplacement horizontal
    let cible = 0;
    if (touches.gauche) cible -= VITESSE;
    if (touches.droite) cible += VITESSE;
    if (touches.gauche !== touches.droite) j.dir = touches.droite ? 1 : -1;
    const acc = j.sol ? 14 : 7;
    j.vx += (cible - j.vx) * Math.min(1, acc * dt);

    // Vagues
    let pousseX = 0;
    if (L.vagues) {
      prochaineVague -= dt;
      if (!vague && prochaineVague <= 0) {
        vague = { t: 0, dir: Math.random() < 0.5 ? -1 : 1, alerte: 1.6, duree: 1.8, son: false };
        son('alerte');
        annoncer(T('msg.vague'), 1700);
      }
      if (vague) {
        vague.t += dt;
        if (vague.t > vague.alerte) {
          if (!vague.son) { vague.son = true; son('vague'); secousse = 0.25; }
          const abri = monde.piliers.some((pi) => j.sol === pi.p && Math.abs(j.x - pi.x) < 34);
          if (!abri) pousseX += vague.dir * 240;
          if (Math.random() < dt * 30) gerbe(j.x + (Math.random() - 0.5) * 120, j.y - 30 - Math.random() * 100, 1, '#bfe6ee', 60, 300, 0.6);
        }
        if (vague.t > vague.alerte + vague.duree) { vague = null; prochaineVague = L.vagues; }
      }
    }
    // Vent
    if (L.vent) {
      prochainVent -= dt;
      if (!vent && prochainVent <= 0) { vent = { t: 0, dir: Math.random() < 0.5 ? -1 : 1, alerte: 1, duree: 2.2 }; annoncer(T('msg.vent'), 1500); son('vent'); }
      if (vent) {
        vent.t += dt;
        if (vent.t > vent.alerte) pousseX += vent.dir * 110;
        if (vent.t > vent.alerte + vent.duree) { vent = null; prochainVent = 3.5 + Math.random() * 2.5; }
      }
    }
    j.pousse = pousseX;

    // Saut (mémoire du toucher et petit délai après le bord)
    if (j.sol) j.coyote = 0.1; else j.coyote -= dt;
    if (sautDemande > 0) sautDemande -= dt;
    if (sautDemande > 0 && j.coyote > 0) {
      j.vy = -SAUT; j.sol = null; j.coyote = 0; sautDemande = 0;
      son('saut');
      gerbe(j.x, j.y, 5, '#9fb7b0', 60, 300, 0.4);
    }
    if (!touches.saut && j.vy < -260) j.vy = -260; // saut plus court si on lâche

    // Gravité et mouvement
    const ancienY = j.y;
    if (j.sol) {
      if (!surPlateforme(j.sol, j.x)) j.sol = null;
      else { j.y = j.sol.y; j.vy = 0; if (j.sol.type === 'mobile') j.x += j.sol.dx; }
    }
    if (!j.sol) { j.vy = Math.min(900, j.vy + GRAVITE * dt); j.y += j.vy * dt; }
    j.x += (j.vx + pousseX) * dt;
    j.x = Math.max(MUR + 9, Math.min(LARGEUR - MUR - 9, j.x));
    // Atterrissage (marches traversables par en dessous)
    if (!j.sol && j.vy >= 0) {
      for (const p of monde.plats) {
        if (!surPlateforme(p, j.x)) continue;
        if (ancienY <= p.y + 1 && j.y >= p.y) {
          j.y = p.y; j.vy = 0; j.sol = p;
          son('sol');
          gerbe(j.x, j.y, 4, '#9fb7b0', 40, 300, 0.3);
          break;
        }
      }
    }
    if (j.sol && Math.abs(j.vx) > 30) { j.pas += dt * Math.abs(j.vx) / 40; if (j.pas > 1) { j.pas = 0; son('pas'); } }
    j.anim += dt * (j.sol ? Math.abs(j.vx) / 20 : 4);
    if (j.invul > 0) j.invul -= dt;

    // Noyés marcheurs
    monde.noyes.forEach((e) => {
      e.anim += dt;
      if (e.touche > 0) e.touche -= dt;
      const proche = Math.abs(e.p.y - j.y) < 320;
      if (!e.vu && proche) { e.vu = true; }
      if (e.vu && e.sortie < 1) e.sortie = Math.min(1, e.sortie + dt * 1.2);
      const ey = e.p.y - 18;
      if (lumiereSur(e.x, ey)) { if (e.gel <= 0) son('gel'); e.gel = GEL_APRES; }
      else if (e.gel > 0) e.gel -= dt;
      if (e.sortie >= 1 && e.gel <= 0) {
        const memeNiveau = Math.abs(e.p.y - j.y) < 50;
        if (memeNiveau) e.dir = j.x < e.x ? -1 : 1;
        e.x += e.dir * e.vit * (memeNiveau ? 1 : 0.5) * dt;
        if (e.x < e.p.x + 10) { e.x = e.p.x + 10; e.dir = 1; }
        if (e.x > e.p.x + e.p.w - 10) { e.x = e.p.x + e.p.w - 10; e.dir = -1; }
      }
      if (e.sortie >= 1 && e.gel <= 0 && Math.abs(e.x - j.x) < 17 && Math.abs(ey - (j.y - 15)) < 30) blesser(e.x);
    });
    // Flotteurs
    monde.flotteurs.forEach((f) => {
      f.anim += dt;
      if (!f.actif && Math.abs(f.y - j.y) < 300) f.actif = true;
      if (!f.actif) return;
      if (lumiereSur(f.x, f.y)) { if (f.gel <= 0) son('gel'); f.gel = GEL_APRES; }
      else if (f.gel > 0) f.gel -= dt;
      if (f.recul > 0) { f.recul -= dt; f.y += 120 * dt; return; }
      if (f.gel > 0) return;
      const dx = j.x - f.x, dy = (j.y - 16) - f.y, d = Math.hypot(dx, dy) || 1;
      const v = L.vFlot || 32;
      f.x += dx / d * v * dt; f.y += dy / d * v * dt + Math.sin(f.anim * 2) * 8 * dt;
      if (d < 20) { blesser(f.x); f.recul = 1.6; }
    });
    // Mains des murs
    monde.mains.forEach((h) => {
      const proche = Math.abs(h.y - j.y) < 220;
      h.t -= dt;
      const eclairee = lumiereSur(h.x + h.dir * 40, h.y);
      if ((h.etat === 'fremit' || h.etat === 'sortie') && eclairee) { h.etat = 'rentre'; h.t = 2.2; son('gel'); }
      if (h.etat === 'cache' && h.t <= 0 && proche) { h.etat = 'fremit'; h.t = 0.85; }
      else if (h.etat === 'fremit' && h.t <= 0) { h.etat = 'sortie'; h.t = 1.3; son('main'); gerbe(h.x + h.dir * 6, h.y, 8, '#9fd0d8', 90, 300, 0.5); }
      else if (h.etat === 'sortie' && h.t <= 0) { h.etat = 'rentre'; h.t = 1.4 + Math.random(); }
      else if (h.etat === 'rentre' && h.t <= 0) { h.etat = 'cache'; h.t = 0.6 + Math.random() * 1.2; }
      const cibleSortie = h.etat === 'sortie' ? 1 : 0;
      h.sortie += (cibleSortie - h.sortie) * Math.min(1, dt * (cibleSortie ? 12 : 6));
      const bout = h.x + h.dir * 78 * h.sortie;
      if (h.sortie > 0.4) {
        const xmin = Math.min(h.x, bout), xmax = Math.max(h.x, bout);
        if (j.x + 8 > xmin && j.x - 8 < xmax && Math.abs(h.y - (j.y - 15)) < 22) blesser(h.x);
      }
    });
    // Miroirs et reflets : avancent quand on leur tourne le dos
    monde.miroirs.forEach((mi) => {
      if (!mi.actif && Math.abs(mi.y - j.y) < 260) mi.actif = true;
      if (!mi.actif) return;
      // Trop loin de son miroir : le reflet y retourne
      if (Math.abs(j.y - mi.y) > 240) {
        const hx = mi.x + (mi.gauche ? 16 : -16), hy = mi.y + 10;
        mi.rx += (hx - mi.rx) * Math.min(1, dt * 2); mi.ry += (hy - mi.ry) * Math.min(1, dt * 2);
        mi.avance = 0;
        return;
      }
      const dx = mi.rx - j.x, dy = mi.ry - (j.y - 16);
      const regarde = Math.sign(dx) === j.dir && Math.abs(dx) > 6;
      mi.avance = regarde ? 0 : 1;
      if (!regarde) {
        const d = Math.hypot(dx, dy) || 1;
        const v = L.vRef || 62;
        mi.rx -= dx / d * v * dt; mi.ry -= dy / d * v * dt;
        mi.son -= dt;
        if (mi.son <= 0) { son('reflet'); mi.son = 0.5; }
        if (d < 18) {
          blesser(mi.rx);
          gerbe(mi.rx, mi.ry, 14, '#d9e6ee', 140, 200, 0.6);
          mi.rx = mi.x + (mi.gauche ? 16 : -16); mi.ry = mi.y + 10;
        }
      }
    });
    // Objets
    monde.objets.forEach((o) => {
      if (o.pris) return;
      o.anim += dt;
      if (o.plat) o.x = o.plat.x + o.decal;
      if (Math.abs(o.x - j.x) < 18 && Math.abs(o.y - (j.y - 15)) < 26) {
        o.pris = true;
        if (o.type === 'medaillon') { medaillons++; son('medaillon'); gerbe(o.x, o.y, 22, '#ffd86b', 150, 120, 0.9); }
        else { huile = Math.min(HUILE_MAX, huile + 40); son('fiole'); gerbe(o.x, o.y, 16, '#ffb74a', 110, 150, 0.8); }
      }
    });

    // Marée montante
    if (L.maree) {
      if (temps > 4) eau -= L.maree * dt;
      if (j.y - 14 > eau) terminer(false, 'mer');
    }

    // Éclairs
    prochainEclair -= dt;
    if (prochainEclair <= 0) {
      eclair = 0.55; flashBlanc = 1;
      prochainEclair = (L.noir ? 3.2 : 5) + Math.random() * 3.5;
      son('tonnerre');
    }
    if (eclair > 0) eclair -= dt;
    if (flashBlanc > 0) flashBlanc = Math.max(0, flashBlanc - dt * 5);

    // Sortie : porte ou grand feu
    if (monde.porte && j.sol && j.sol.type === 'palier' && Math.abs(j.x - monde.porte.x) < 24) terminer(true);
    if (monde.foyer && !monde.foyer.allume) {
      const f = monde.foyer;
      if (j.sol && j.sol.type === 'palier' && Math.abs(j.x - f.x) < 60 && allumee) {
        f.progres += dt;
        if (Math.random() < dt * 25) gerbe(f.x + (Math.random() - 0.5) * 30, f.y - 30, 1, '#ffb04a', 80, -100, 0.7);
        if (f.progres >= 3) { f.allume = true; son('feu'); gerbe(f.x, f.y - 40, 60, '#ffd36b', 260, 100, 1.4); terminer(true); }
      } else if (j.sol && j.sol.type === 'palier' && Math.abs(j.x - f.x) < 60 && f.progres === 0 && !f.indice) {
        f.indice = true; annoncer(T('msg.feu'), 2600);
      }
    }

    // Particules
    particules.forEach((p) => { p.vie -= dt; p.vx *= 0.98; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; });
    particules = particules.filter((p) => p.vie > 0);
    if (particules.length > 400) particules.splice(0, particules.length - 400);
    if (secousse > 0) secousse -= dt;

    // Caméra
    const cibleCam = j.y - vueH * 0.6;
    camY += (cibleCam - camY) * Math.min(1, dt * 5);
    camY = Math.max(monde.haut - 160, Math.min(150 / echelle - vueH, camY));
  }

  // ------------------------------------------------------------------------
  // Fin d'étage
  // ------------------------------------------------------------------------
  function terminer(gagne, cause) {
    if (finPartie) return;
    finPartie = { gagne, cause, t: 0 };
    const n = niveau;
    if (gagne) {
      const etoiles = 1 + (medaillons >= 3 ? 1 : 0) + (huile >= 30 ? 1 : 0);
      const score = medaillons * 100 + Math.floor(huile) * 3 + coeurs * 50 + Math.max(0, Math.round((NIVEAUX[n].temps - temps) * 5));
      const ancien = prog.records[n];
      const record = score > ancien;
      prog.etoiles[n] = Math.max(prog.etoiles[n], etoiles);
      if (record) prog.records[n] = score;
      prog.atteint = Math.max(prog.atteint, Math.min(NIVEAUX.length, n + 2));
      sauver(Math.min(NIVEAUX.length, n + 2));
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
      if (prog.etoiles.every((e) => e > 0)) {
        if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
      }
      son('victoire');
      gerbe(joueur.x, joueur.y - 30, 40, '#ffd86b', 220, 200, 1.2);
      finPartie.resultat = { etoiles, score, record, ancien, details: [true, medaillons >= 3, huile >= 30] };
    } else {
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: n + 1 });
      son('defaite');
      secousse = 0.5;
      finPartie.resultat = { score: medaillons * 100 };
    }
    partieEnCours = false;
    pluieAmbiance(false);
    setTimeout(() => montrerFin(), gagne ? 900 : 1100);
  }

  const SVG_ETOILE = (couleur) => '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="' + couleur + '" stroke="#5a3d0c" stroke-width="1"/></svg>';

  function montrerFin() {
    const f = finPartie;
    if (!f || !monde || (etat !== 'jeu' && etat !== 'pause')) return;
    etat = 'fin';
    montrer('ecran-fin');
    cacherJeu();
    const n = niveau;
    const zoneEt = document.getElementById('f-etoiles');
    zoneEt.innerHTML = '';
    const detail = document.getElementById('f-detail');
    const journal = document.getElementById('f-journal');
    const suivant = document.getElementById('f-suivant');
    if (f.gagne) {
      const r = f.resultat;
      document.getElementById('f-titre').textContent = T(NIVEAUX[n].finale ? 'fin.phare' : 'fin.victoire');
      document.getElementById('f-cause').textContent = T('hud.etage', { n: n + 1 }) + ' · ' + T(PALIERS[NIVEAUX[n].palier].cle);
      for (let i = 0; i < 3; i++) {
        zoneEt.insertAdjacentHTML('beforeend', SVG_ETOILE(i < r.etoiles ? '#ffd24a' : '#59666a'));
        const el = zoneEt.lastElementChild;
        setTimeout(() => { el.classList.add(i < r.etoiles ? 'allumee' : 'eteinte'); if (i < r.etoiles) son('etoile', i); }, 250 + i * 330);
      }
      detail.textContent = [T('etoile.porte'), T('etoile.medaillons', { a: medaillons }), T('etoile.huile', { n: Math.floor(huile) })].join(' · ');
      defiler(document.getElementById('f-score'), r.score, (v) => T('fin.score', { n: NB(v) }));
      document.getElementById('f-record').textContent = r.record ? T('fin.record') : T('fin.recordAncien', { n: NB(r.ancien) });
      journal.classList.remove('cache');
      journal.innerHTML = '';
      const b = document.createElement('b'); b.textContent = T('fin.journalTitre', { n: n + 1 });
      const p = document.createElement('span'); p.textContent = T('journal.' + (n + 1));
      journal.append(b, p);
      suivant.textContent = T(n + 1 < NIVEAUX.length ? 'fin.suivant' : 'fin.epilogue');
      suivant.onclick = () => { son('clic'); if (n + 1 < NIVEAUX.length) lancerNiveau(n + 1); else montrerBilan(); };
    } else {
      document.getElementById('f-titre').textContent = T('fin.defaite');
      document.getElementById('f-cause').textContent = T('cause.' + f.cause);
      for (let i = 0; i < 3; i++) { zoneEt.insertAdjacentHTML('beforeend', SVG_ETOILE('#59666a')); zoneEt.lastElementChild.classList.add('eteinte'); }
      detail.textContent = T('fin.medaillons', { a: medaillons, b: 3 }) + ' · ' + T('fin.huile', { n: Math.floor(huile) });
      document.getElementById('f-score').textContent = T('fin.score', { n: NB(f.resultat.score) });
      document.getElementById('f-record').textContent = prog.records[n] ? T('fin.recordAncien', { n: NB(prog.records[n]) }) : '';
      journal.classList.add('cache');
      suivant.textContent = T('fin.reessayer');
      suivant.onclick = () => { son('clic'); lancerNiveau(n); };
    }
    document.getElementById('f-rejouer').onclick = () => { son('clic'); lancerNiveau(n); };
    document.getElementById('f-niveaux').onclick = () => { son('clic'); ouvrirNiveaux(); };
    suivant.focus();
  }

  function defiler(el, valeur, format) {
    const debut = performance.now();
    const pas = () => {
      const k = Math.min(1, (performance.now() - debut) / 900);
      el.textContent = format(Math.round(valeur * (1 - Math.pow(1 - k, 3))));
      if (k < 1 && etat === 'fin') requestAnimationFrame(pas);
      else el.textContent = format(valeur);
    };
    pas();
  }

  function montrerBilan() {
    etat = 'menu';
    montrer('ecran-bilan');
    document.getElementById('b-texte').textContent = T('bilan.texte');
    document.getElementById('b-etoiles').textContent = T('etoilesTotal', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    document.getElementById('b-accueil').focus();
  }

  // ------------------------------------------------------------------------
  // Dessin : éléments réutilisés (jeu, écran titre, tutoriel, vestiaire)
  // ------------------------------------------------------------------------
  function dessinerGardienne(c, x, y, dir, leve, anim, cire, lant, sol, eclat) {
    c.save();
    c.translate(x, y);
    c.scale(dir, 1);
    const pas = sol ? Math.sin(anim) : 0.6;
    // Jambes (bottes)
    c.fillStyle = '#1d1a17';
    c.fillRect(-6 + pas * 3, -10, 5, 10);
    c.fillRect(1 - pas * 3, -10, 5, 10);
    // Ciré
    c.fillStyle = cire.couleur;
    c.beginPath();
    c.moveTo(-9, -9); c.lineTo(9, -9); c.lineTo(7, -26); c.lineTo(-7, -26); c.closePath(); c.fill();
    c.fillStyle = cire.ombre;
    c.fillRect(-1, -25, 2, 15);
    // Tête et capuche
    c.fillStyle = '#e8c9a8';
    c.beginPath(); c.arc(1, -31, 5.5, 0, Math.PI * 2); c.fill();
    c.fillStyle = cire.couleur;
    c.beginPath(); c.arc(0, -31, 7.5, Math.PI * 0.85, Math.PI * 2.15); c.lineTo(-8, -25); c.closePath(); c.fill();
    c.fillStyle = '#1a1310';
    c.fillRect(3, -32, 1.8, 1.8);
    // Bras et lanterne
    const lx = leve ? 8 : 10, ly = leve ? -44 : -14;
    c.strokeStyle = cire.couleur; c.lineWidth = 3.5; c.lineCap = 'round';
    c.beginPath(); c.moveTo(4, -23); c.lineTo(lx - 1, ly + 2); c.stroke();
    c.fillStyle = lant.metal;
    c.fillRect(lx - 4, ly - 1, 8, 2);
    c.fillRect(lx - 4, ly + 9, 8, 2);
    const [r, g, b] = lant.lumiere;
    c.fillStyle = eclat ? 'rgb(' + r + ',' + g + ',' + b + ')' : 'rgba(' + r + ',' + g + ',' + b + ',.45)';
    c.fillRect(lx - 3, ly + 1, 6, 8);
    c.strokeStyle = lant.metal; c.lineWidth = 1;
    c.beginPath(); c.moveTo(lx, ly - 1); c.lineTo(lx, ly - 4); c.stroke();
    c.restore();
  }

  function dessinerNoye(c, x, y, dir, t, gel, sortie) {
    c.save();
    c.translate(x, y + (1 - sortie) * 36);
    c.scale(dir, 1);
    const balance = Math.sin(t * 3) * 2;
    const peau = gel > 0 ? '#cfe9f2' : '#6f8f86';
    const fonce = gel > 0 ? '#9fc2cf' : '#3f5a54';
    c.globalAlpha = 0.35 + 0.65 * sortie;
    // Corps voûté
    c.fillStyle = fonce;
    c.beginPath(); c.moveTo(-8, 0); c.lineTo(8, 0); c.lineTo(7 + balance, -22); c.lineTo(-6 + balance, -24); c.closePath(); c.fill();
    // Haillons
    c.fillStyle = '#2a3a3a';
    c.beginPath(); c.moveTo(-8, -6); c.lineTo(-4, 2); c.lineTo(0, -4); c.lineTo(4, 2); c.lineTo(8, -6); c.lineTo(8, -10); c.lineTo(-8, -10); c.closePath(); c.fill();
    // Tête
    c.fillStyle = peau;
