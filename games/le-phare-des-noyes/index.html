    m.miroirs.forEach((mi) => dessinerMiroir(c, mi));
    // Mains (taches et bras)
    m.mains.forEach((h) => { if (h.y > camY - 60 && h.y < camY + vueH + 60) dessinerMain(c, h, horloge); });
    // Piliers
    m.piliers.forEach((pi) => dessinerPilier(c, pi.x, pi.p.y, pal, vague && vague.t < vague.alerte + vague.duree));
    // Plateformes
    m.plats.forEach((p) => { if (p.y > camY - 40 && p.y < camY + vueH + 60) dessinerPlateforme(c, p, pal, horloge); });
    if (m.porte) dessinerPorte(c, m.porte.x, m.porte.y, horloge);
    if (m.foyer) dessinerFoyer(c, m.foyer, horloge);
    // Objets
    m.objets.forEach((o) => { if (!o.pris) (o.type === 'medaillon' ? dessinerMedaillon : dessinerFiole)(c, o.x, o.y, o.anim); });
    // Noyés
    m.noyes.forEach((e) => { if (e.vu) dessinerNoye(c, e.x, e.p.y, e.x < joueur.x ? 1 : -1, e.anim, e.gel, e.sortie); });
    // Gardienne
    const allumee = touches.lanterne && huile > 0 && !finPartie;
    const clign = joueur.invul > 0 && Math.floor(joueur.invul * 12) % 2 === 0;
    if (!clign) dessinerGardienne(c, joueur.x, joueur.y, joueur.dir, allumee, joueur.anim, cireChoisi(), lanterneChoisie(), !!joueur.sol, allumee);
    // Reflets et flotteurs par-dessus
    m.miroirs.forEach((mi) => { if (mi.actif) dessinerReflet(c, mi, horloge, cireChoisi()); });
    m.flotteurs.forEach((f) => { if (f.actif) dessinerFlotteur(c, f.x, f.y, f.anim, f.gel); });
    // Lumière de la lanterne
    const [lr, lg, lb] = lanterneChoisie().lumiere;
    if (allumee) {
      const gl = c.createRadialGradient(joueur.x, joueur.y - 30, 5, joueur.x, joueur.y - 30, RAYON_LUMIERE);
      gl.addColorStop(0, 'rgba(' + lr + ',' + lg + ',' + lb + ',.35)');
      gl.addColorStop(0.7, 'rgba(' + lr + ',' + lg + ',' + lb + ',.12)');
      gl.addColorStop(1, 'rgba(' + lr + ',' + lg + ',' + lb + ',0)');
      c.fillStyle = gl; c.beginPath(); c.arc(joueur.x, joueur.y - 30, RAYON_LUMIERE, 0, Math.PI * 2); c.fill();
      c.strokeStyle = 'rgba(' + lr + ',' + lg + ',' + lb + ',.25)'; c.lineWidth = 1.5; c.setLineDash([6, 8]);
      c.beginPath(); c.arc(joueur.x, joueur.y - 30, RAYON_LUMIERE - 2, horloge, horloge + Math.PI * 2); c.stroke(); c.setLineDash([]);
    }
    // Eau qui monte
    if (L.maree) {
      const surface = eau;
      if (surface < camY + vueH + 20) {
        c.fillStyle = 'rgba(16,52,66,.88)';
        c.beginPath(); c.moveTo(0, camY + vueH + 40);
        for (let x = 0; x <= LARGEUR; x += 12) c.lineTo(x, surface + Math.sin(x * 0.05 + horloge * 3) * 4);
        c.lineTo(LARGEUR, camY + vueH + 40); c.closePath(); c.fill();
        c.strokeStyle = 'rgba(200,235,240,.7)'; c.lineWidth = 2;
        c.beginPath();
        for (let x = 0; x <= LARGEUR; x += 12) c.lineTo(x, surface + Math.sin(x * 0.05 + horloge * 3) * 4);
        c.stroke();
        // Mains de noyés dans l'eau
        c.fillStyle = 'rgba(120,160,150,.7)';
        for (let k = 0; k < 4; k++) { const hx = 50 + k * 85 + Math.sin(horloge + k) * 10; c.fillRect(hx, surface + 4 - Math.abs(Math.sin(horloge * 2 + k)) * 10, 4, 14); }
      }
    }
    // Particules
    particules.forEach((p) => {
      c.globalAlpha = Math.max(0, p.vie / p.max);
      c.fillStyle = p.c === 'lumiere' ? 'rgb(' + lr + ',' + lg + ',' + lb + ')' : p.c;
      c.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
    });
    c.globalAlpha = 1;
    // Vague : nappe d'eau qui dévale
    if (vague) {
      if (vague.t < vague.alerte) {
        // Goutte qui clignote en haut de l'écran, du côté d'où vient l'eau
        const a = 0.5 + 0.5 * Math.sin(vague.t * 18);
        const gx = vague.dir > 0 ? 40 : LARGEUR - 40;
        c.fillStyle = 'rgba(150,220,240,' + a + ')';
        c.beginPath(); c.moveTo(gx, camY + 70); c.quadraticCurveTo(gx + 14, camY + 96, gx, camY + 102); c.quadraticCurveTo(gx - 14, camY + 96, gx, camY + 70); c.fill();
        c.strokeStyle = 'rgba(150,220,240,' + a + ')'; c.lineWidth = 3;
        c.beginPath(); c.moveTo(gx + vague.dir * 20, camY + 90); c.lineTo(gx + vague.dir * 44, camY + 90); c.lineTo(gx + vague.dir * 36, camY + 82); c.moveTo(gx + vague.dir * 44, camY + 90); c.lineTo(gx + vague.dir * 36, camY + 98); c.stroke();
      } else {
        const k = (vague.t - vague.alerte) / vague.duree;
        c.fillStyle = 'rgba(90,170,200,' + (0.35 * Math.sin(k * Math.PI)) + ')';
        c.fillRect(0, camY, LARGEUR, vueH);
        c.strokeStyle = 'rgba(220,245,255,' + (0.6 * Math.sin(k * Math.PI)) + ')'; c.lineWidth = 2;
        for (let i = 0; i < 14; i++) {
          const yy = camY + ((i * 67 + k * vueH * 2) % vueH);
          const xx = ((i * 97 + horloge * 400 * vague.dir) % LARGEUR + LARGEUR) % LARGEUR;
          c.beginPath(); c.moveTo(xx, yy); c.lineTo(xx + vague.dir * 40, yy + 12); c.stroke();
        }
      }
    }
    // Vent : traits de pluie couchés
    if (vent) {
      const fort = vent.t > vent.alerte ? 1 : vent.t / vent.alerte * 0.4;
      c.strokeStyle = 'rgba(190,210,230,' + 0.45 * fort + ')'; c.lineWidth = 1.2;
      for (let i = 0; i < 26; i++) {
        const yy = camY + ((i * 53 + horloge * 300) % vueH);
        const xx = ((i * 71 + horloge * 500 * vent.dir) % LARGEUR + LARGEUR) % LARGEUR;
        c.beginPath(); c.moveTo(xx, yy); c.lineTo(xx + vent.dir * 26, yy + 6); c.stroke();
      }
    }
    // Pluie qui tombe par les meurtrières (léger)
    c.strokeStyle = 'rgba(160,190,200,.12)'; c.lineWidth = 1;
    for (let i = 0; i < 16; i++) { const xx = (i * 23) % LARGEUR, yy = camY + ((i * 97 + horloge * 260) % vueH); c.beginPath(); c.moveTo(xx, yy); c.lineTo(xx - 3, yy + 10); c.stroke(); }

    // Noir et éclairs
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (L.noir) {
      const n = nctx;
      const k = 0.5;
      n.setTransform(1, 0, 0, 1, 0, 0);
      n.globalCompositeOperation = 'source-over';
      n.clearRect(0, 0, nuit.width, nuit.height);
      const sombre = eclair > 0 ? Math.max(0.15, 0.96 - eclair * 1.6) : 0.96;
      n.fillStyle = 'rgba(2,3,6,' + sombre + ')';
      n.fillRect(0, 0, nuit.width, nuit.height);
      n.globalCompositeOperation = 'destination-out';
      const px = (decalX + joueur.x * echelle) * k, py = ((joueur.y - 26 - camY) * echelle) * k;
      const rr = (allumee ? RAYON_LUMIERE * 1.25 : 46) * echelle * k;
      const trou = n.createRadialGradient(px, py, rr * 0.25, px, py, rr);
      trou.addColorStop(0, 'rgba(0,0,0,1)'); trou.addColorStop(1, 'rgba(0,0,0,0)');
      n.fillStyle = trou; n.beginPath(); n.arc(px, py, rr, 0, Math.PI * 2); n.fill();
      // Lueurs des objets et de la porte
      const lueur = (x, y, r) => { const gx = (decalX + x * echelle) * k, gy = ((y - camY) * echelle) * k, gr = r * echelle * k; const gg = n.createRadialGradient(gx, gy, 0, gx, gy, gr); gg.addColorStop(0, 'rgba(0,0,0,.8)'); gg.addColorStop(1, 'rgba(0,0,0,0)'); n.fillStyle = gg; n.beginPath(); n.arc(gx, gy, gr, 0, Math.PI * 2); n.fill(); };
      m.objets.forEach((o) => { if (!o.pris) lueur(o.x, o.y, 20); });
      if (m.porte) lueur(m.porte.x, m.porte.y - 30, 50);
      if (m.foyer) lueur(m.foyer.x, m.foyer.y - 40, 50 + m.foyer.progres * 30);
      m.noyes.forEach((e) => { if (e.vu) lueur(e.x, e.p.y - 29, 7); }); // yeux qui brillent
      c.drawImage(nuit, 0, 0, ecranL, ecranH);
    }
    if (flashBlanc > 0) { c.fillStyle = 'rgba(220,235,255,' + flashBlanc * 0.35 + ')'; c.fillRect(0, 0, ecranL, ecranH); }

    dessinerHUD(c);
  }

  function dessinerHUD(c) {
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const x0 = 10, y0 = Math.max(8, 8) + 4;
    // Cadre
    c.fillStyle = 'rgba(4,10,14,.72)';
    rond(c, x0, y0 - 4, 186, 70, 12); c.fill();
    // Étage
    c.fillStyle = '#f3d98c';
    c.font = '700 14px system-ui, sans-serif';
    c.textBaseline = 'top';
    c.fillText(T('hud.etage', { n: niveau + 1 }), x0 + 10, y0 + 2, 90);
    // Cœurs
    for (let i = 0; i < COEURS; i++) {
      coeur(c, x0 + 118 + i * 22, y0 + 10, i < coeurs ? '#e2554a' : '#3a3a3a');
    }
    // Huile
    c.fillStyle = '#c9a04a';
    c.font = '600 12px system-ui, sans-serif';
    c.fillText(T('hud.huile'), x0 + 10, y0 + 24, 60);
    c.fillStyle = '#1d2a2e'; rond(c, x0 + 68, y0 + 25, 106, 12, 6); c.fill();
    const k = huile / HUILE_MAX;
    c.fillStyle = k > 0.3 ? '#f0b545' : (Math.floor(horloge * 4) % 2 ? '#e2554a' : '#a63a30');
    if (k > 0) { rond(c, x0 + 68, y0 + 25, Math.max(8, 106 * k), 12, 6); c.fill(); }
    c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x0 + 68 + 106 * 0.3, y0 + 23); c.lineTo(x0 + 68 + 106 * 0.3, y0 + 39); c.stroke();
    // Médaillons
    for (let i = 0; i < 3; i++) {
      c.fillStyle = i < medaillons ? '#f7c94c' : 'rgba(255,255,255,.15)';
      c.beginPath(); c.arc(x0 + 18 + i * 20, y0 + 53, 7, 0, Math.PI * 2); c.fill();
      if (i < medaillons) { c.strokeStyle = '#a7761f'; c.beginPath(); c.arc(x0 + 18 + i * 20, y0 + 53, 4, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); }
    }
    // Palier
    c.fillStyle = '#a9c9c2'; c.font = '600 11px system-ui, sans-serif';
    c.fillText(T(PALIERS[monde.L.palier].cle), x0 + 80, y0 + 47, 100);
  }
  function rond(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function coeur(c, x, y, couleur) {
    c.fillStyle = couleur;
    c.beginPath(); c.moveTo(x, y + 6);
    c.bezierCurveTo(x - 9, y - 1, x - 5, y - 8, x, y - 3);
    c.bezierCurveTo(x + 5, y - 8, x + 9, y - 1, x, y + 6); c.fill();
  }

  // ------------------------------------------------------------------------
  // Écran titre : le phare dans la tempête (sert aussi de jaquette)
  // ------------------------------------------------------------------------
  function dessinerTitre() {
    const c = ctx, L = ecranL, H = ecranH, t = horloge;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const ciel = c.createLinearGradient(0, 0, 0, H);
    ciel.addColorStop(0, '#05070d'); ciel.addColorStop(0.45, '#142433'); ciel.addColorStop(1, '#0a1a22');
    c.fillStyle = ciel; c.fillRect(0, 0, L, H);
    // Nuages
    c.fillStyle = 'rgba(40,55,70,.6)';
    for (let i = 0; i < 7; i++) { const x = ((i * 160 + t * 12) % (L + 300)) - 150; c.beginPath(); c.ellipse(x, 40 + (i % 3) * 30, 140, 30, 0, 0, Math.PI * 2); c.fill(); }
    // Éclair
    const fl = Math.max(0, Math.sin(t * 0.9) > 0.985 ? 1 : 0, flashBlanc);
    if (fl > 0) {
      c.strokeStyle = 'rgba(230,240,255,.9)'; c.lineWidth = 2.5;
      c.beginPath(); c.moveTo(L * 0.18, 0); c.lineTo(L * 0.22, H * 0.12); c.lineTo(L * 0.17, H * 0.18); c.lineTo(L * 0.24, H * 0.32); c.stroke();
      c.fillStyle = 'rgba(200,220,255,.12)'; c.fillRect(0, 0, L, H);
    }
    // Phare
    // Le phare tient entier au-dessus du panneau du titre
    const panneau = document.querySelector('#ecran-titre .panneau');
    const ouvert = etat === 'titre' && panneau;
    const haut = ouvert ? Math.max(220, panneau.getBoundingClientRect().top) : H * 0.62;
    const s = Math.min(L / 330, (haut - 20) / 345);
    const cx = L / 2, base = haut - 36 * s;
    c.save(); c.translate(cx, base); c.scale(s, s);
    // Faisceau qui tourne
    const ang = Math.sin(t * 0.7) * 1.2;
    c.save(); c.translate(0, -258);
    const fa = c.createLinearGradient(0, 0, Math.cos(ang) * 400, Math.sin(ang) * 60);
    fa.addColorStop(0, 'rgba(255,220,140,.55)'); fa.addColorStop(1, 'rgba(255,220,140,0)');
    c.fillStyle = fa;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(ang) * 420, -60); c.lineTo(Math.cos(ang) * 420, 70); c.closePath(); c.fill();
    c.restore();
    // Rocher
    c.fillStyle = '#1b2224';
    c.beginPath(); c.moveTo(-150, 40); c.lineTo(-90, -10); c.lineTo(-40, -22); c.lineTo(50, -20); c.lineTo(110, 0); c.lineTo(160, 40); c.closePath(); c.fill();
    // Tour (bandes rouges et blanches délavées)
    for (let k = 0; k < 6; k++) {
      const y1 = -20 - k * 38, y2 = y1 - 38;
      const w1 = 46 - k * 3.6, w2 = 46 - (k + 1) * 3.6;
      c.fillStyle = k % 2 ? '#d9d3c4' : '#8c2f26';
      c.beginPath(); c.moveTo(-w1, y1); c.lineTo(w1, y1); c.lineTo(w2, y2); c.lineTo(-w2, y2); c.closePath(); c.fill();
    }
    c.fillStyle = 'rgba(0,0,0,.25)';
    c.beginPath(); c.moveTo(10, -20); c.lineTo(46, -20); c.lineTo(24.4, -248); c.lineTo(6, -248); c.closePath(); c.fill();
    // Fenêtres allumées en spirale
    c.fillStyle = '#ffcf6b';
    [[-12, -60], [10, -110], [-6, -160], [8, -205]].forEach(([fx, fy], i) => { c.globalAlpha = 0.6 + 0.4 * Math.sin(t * 2 + i); c.fillRect(fx, fy, 7, 12); });
    c.globalAlpha = 1;
    // Galerie et lanterne
    c.fillStyle = '#26292d'; c.fillRect(-34, -252, 68, 8);
    c.strokeStyle = '#3c4046'; c.lineWidth = 2;
    for (let k = -30; k <= 30; k += 10) { c.beginPath(); c.moveTo(k, -252); c.lineTo(k, -264); c.stroke(); }
    c.beginPath(); c.moveTo(-32, -264); c.lineTo(32, -264); c.stroke();
    const lu = c.createRadialGradient(0, -280, 2, 0, -280, 40);
    lu.addColorStop(0, 'rgba(255,230,150,1)'); lu.addColorStop(1, 'rgba(255,200,100,0)');
    c.fillStyle = lu; c.beginPath(); c.arc(0, -280, 40, 0, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(255,225,140,.9)'; c.fillRect(-18, -296, 36, 30);
    c.strokeStyle = '#2a2d31'; c.lineWidth = 3; c.strokeRect(-18, -296, 36, 30);
    c.beginPath(); c.moveTo(-6, -296); c.lineTo(-6, -266); c.moveTo(6, -296); c.lineTo(6, -266); c.stroke();
    c.fillStyle = '#1e2124'; c.beginPath(); c.moveTo(-24, -296); c.lineTo(0, -318); c.lineTo(24, -296); c.closePath(); c.fill();
    // Silhouette de la gardienne sur la galerie
    dessinerGardienne(c, -24, -252, 1, true, 0, cireChoisi(), lanterneChoisie(), true, true);
    c.restore();
    // Mer déchaînée
    for (let k = 0; k < 4; k++) {
      const y = base + (k * 18 - 2) * s;
      c.fillStyle = ['#0f2a36', '#0c2330', '#0a1d28', '#081720'][k];
      c.beginPath(); c.moveTo(0, H);
      for (let x = 0; x <= L + 20; x += 20) c.lineTo(x, y + Math.sin(x * 0.02 + t * (1.2 + k * 0.3) + k) * (10 + k * 3));
      c.lineTo(L, H); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(200,230,235,' + (0.35 - k * 0.06) + ')'; c.lineWidth = 2;
      c.beginPath();
      for (let x = 0; x <= L + 20; x += 20) c.lineTo(x, y + Math.sin(x * 0.02 + t * (1.2 + k * 0.3) + k) * (10 + k * 3));
      c.stroke();
    }
    // Noyés qui remontent vers le rocher (silhouettes)
    for (let k = 0; k < 5; k++) {
      const hx = cx + (k - 2) * 70 * s + Math.sin(t * 0.5 + k) * 8;
      const hy = base + 8 * s + (k % 2) * 10 * s;
      const lev = (Math.sin(t * 0.8 + k * 1.3) + 1) / 2;
      c.save(); c.translate(hx, hy); c.scale(s, s);
      c.fillStyle = 'rgba(110,150,140,.75)';
      c.beginPath(); c.ellipse(0, -8 - lev * 8, 6, 7, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = 'rgba(110,150,140,.75)'; c.lineWidth = 3; c.lineCap = 'round';
      c.beginPath(); c.moveTo(-4, -2); c.lineTo(-10, -20 - lev * 10); c.moveTo(4, -2); c.lineTo(9, -18 - lev * 12); c.stroke();
      c.fillStyle = '#d9fff4'; c.fillRect(-3, -10 - lev * 8, 2, 2); c.fillRect(1, -10 - lev * 8, 2, 2);
      c.restore();
    }
    // Pluie
    c.strokeStyle = 'rgba(170,200,215,.3)'; c.lineWidth = 1;
    for (let i = 0; i < 70; i++) { const x = (i * 37 + t * 90) % L, y = (i * 91 + t * 520) % H; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 5, y + 14); c.stroke(); }
    if (flashBlanc > 0) flashBlanc = Math.max(0, flashBlanc - 0.05);
  }

  // ------------------------------------------------------------------------
  // Tutoriel animé : une petite scène par mécanique, avec une main qui montre le geste
  // ------------------------------------------------------------------------
  const tutoToile = document.getElementById('tuto-toile');
  const tctx = tutoToile.getContext('2d');
  let tutoListe = [], tutoIndex = 0, tutoSuite = null, tutoT = 0;

  function ouvrirTuto(liste, suite) {
    tutoListe = liste; tutoIndex = 0; tutoSuite = suite;
    etat = 'tuto';
    montrer('tuto');
    afficherEtapeTuto();
  }
  function afficherEtapeTuto() {
    const k = tutoListe[tutoIndex];
    tutosVus.add(k);
    tutoT = 0;
    document.getElementById('tuto-titre').textContent = T('tuto.' + k + '.titre');
    document.getElementById('tuto-texte').textContent = T('tuto.' + k);
    const cl = document.getElementById('tuto-clavier');
    const cleClavier = 'tuto.' + k + '.clavier';
    cl.textContent = I18N.has(cleClavier) ? T(cleClavier) : '';
    document.getElementById('tuto-etape').textContent = tutoListe.length > 1 ? T('tuto.etape', { a: tutoIndex + 1, b: tutoListe.length }) : '';
    const ok = document.getElementById('tuto-ok');
    ok.textContent = T(tutoIndex + 1 < tutoListe.length ? 'tuto.suivant' : 'tuto.compris');
    ok.focus();
  }
  function suiteTuto() {
    son('clic');
    tutoIndex++;
    if (tutoIndex < tutoListe.length) { afficherEtapeTuto(); return; }
    montrer(null);
    const s = tutoSuite; tutoSuite = null;
    if (s) s(); else { etat = 'titre'; montrer('ecran-titre'); }
  }
  document.getElementById('tuto-ok').addEventListener('click', suiteTuto);

  function mainDoigt(c, x, y, appui) {
    c.save(); c.translate(x, y); if (appui) c.scale(0.9, 0.9);
    c.fillStyle = '#f2d6bd'; c.strokeStyle = '#5a3d2a'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(-4, 0); c.lineTo(-4, -18); c.arc(0, -18, 4, Math.PI, 0); c.lineTo(4, -6); c.lineTo(12, -4); c.quadraticCurveTo(16, 6, 10, 16); c.lineTo(-6, 16); c.quadraticCurveTo(-12, 8, -10, 2); c.closePath();
    c.translate(0, 0); c.fill(); c.stroke();
    if (appui) { c.strokeStyle = 'rgba(255,230,150,.8)'; c.lineWidth = 2; c.beginPath(); c.arc(0, -20, 10, 0, Math.PI * 2); c.stroke(); }
    c.restore();
  }
  function boutonDemo(c, x, y, forme, appui) {
    c.fillStyle = appui ? 'rgba(240,200,110,.5)' : 'rgba(20,40,46,.85)';
    c.strokeStyle = appui ? '#f3d98c' : 'rgba(190,220,210,.6)'; c.lineWidth = 2;
    c.beginPath(); c.arc(x, y, 16, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = '#e9efe9';

  // ------------------------------------------------------------------------
  // Boucle principale
  // ------------------------------------------------------------------------
  let avant = performance.now();
  function boucle(maintenant) {
    const dt = Math.min(0.033, Math.max(0, (maintenant - avant) / 1000));
    avant = maintenant;
    horloge += dt;
    if (etat === 'jeu' && monde) mettreAJour(dt);
    else if (etat === 'fin' && monde && finPartie) {
      // Les particules et la caméra continuent un peu après la fin
      particules.forEach((p) => { p.vie -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; });
      particules = particules.filter((p) => p.vie > 0);
    }
    if (monde && (etat === 'jeu' || etat === 'pause' || etat === 'tuto' || etat === 'fin')) dessinerJeu();
    else dessinerTitre();
    if (etat === 'tuto') { tutoT += dt; dessinerDemo(); }
    requestAnimationFrame(boucle);
  }

  // ------------------------------------------------------------------------

  function brancher(id, cle) {
    const b = document.getElementById(id);
    const presser = (e) => {
      e.preventDefault();
      initAudio();
      touches[cle] = true; b.classList.add('appui');
      if (cle === 'saut') sautDemande = 0.14;
      try { b.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
    };
    const lacher = (e) => { if (e) e.preventDefault(); touches[cle] = false; b.classList.remove('appui'); };
    b.addEventListener('pointerdown', presser);
    b.addEventListener('pointerup', lacher);
    b.addEventListener('pointercancel', lacher);
    b.addEventListener('lostpointercapture', () => lacher());
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  brancher('b-gauche', 'gauche'); brancher('b-droite', 'droite');
  brancher('b-saut', 'saut'); brancher('b-lanterne', 'lanterne');

  const CLES = {
    ArrowLeft: 'gauche', KeyA: 'gauche', ArrowRight: 'droite', KeyD: 'droite',
    Space: 'saut', ArrowUp: 'saut', KeyW: 'saut',
    ShiftLeft: 'lanterne', ShiftRight: 'lanterne', KeyE: 'lanterne', ArrowDown: 'lanterne', KeyS: 'lanterne',
  };
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (etat === 'jeu') { pause(); e.preventDefault(); }
      else if (etat === 'pause') { reprendre(); e.preventDefault(); }
      return;
    }
    // Entrée ou Espace passent la carte du tutoriel (le bouton focalisé le fait déjà tout seul)
    if (etat === 'tuto' && (e.code === 'Enter' || e.code === 'Space')) {
      if (document.activeElement !== document.getElementById('tuto-ok')) { e.preventDefault(); suiteTuto(); }
      return;
    }
    if (etat !== 'jeu') return;
    const k = CLES[e.code];
    if (!k) return;
    e.preventDefault();
    initAudio();
    if (k === 'saut' && !touches.saut) sautDemande = 0.14;
    touches[k] = true;
  });
  window.addEventListener('keyup', (e) => { const k = CLES[e.code]; if (k) touches[k] = false; });
  window.addEventListener('blur', () => { Object.keys(touches).forEach((k) => { touches[k] = false; }); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  surClic('t-journal', ouvrirJournal);
  surClic('t-aide', () => ouvrirTuto(['deplacer', 'sauter', 'lanterne'], null));
  surClic('n-retour', allerTitre);
  surClic('v-retour', allerTitre);
  surClic('j-retour', allerTitre);
  surClic('h-pause', pause);
  surClic('p-reprendre', reprendre);
  surClic('p-recommencer', () => { partieEnCours = false; lancerNiveau(niveau); });
  surClic('p-accueil', allerTitre);
  surClic('b-accueil', allerTitre);
  document.querySelectorAll('.bouton-son').forEach((b) => b.addEventListener('click', basculerSon));

  // Sauvegarde à la fermeture, seulement pendant une partie
  window.JEL_SAVE.surFermeture(() => {
    if (partieEnCours && monde) sauver(niveau + 1);
  });

  // ------------------------------------------------------------------------
  // Démarrage
  // ------------------------------------------------------------------------
  chargerProgression();
  try {
    const tenue = (localStorage.getItem('phare-noyes-tenue') || '').split(',');
    if (LANTERNES.some((l) => l.id === tenue[0])) prog.lanterne = tenue[0];
    if (CIRES.some((c) => c.id === tenue[1])) prog.cire = tenue[1];
  } catch (e) { /* pas de stockage */ }
  majBoutonsSon();
  allerTitre();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
